- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IDA
  original_reference_id: PMID:8617213
  qualifier: involved_in
  review:
    summary: >-
      The defining experiment for p4: in vitro transcription and footprinting with
      purified p4, purified host RNA polymerase and the phi29 promoter region show that
      p4 activates the late A3 promoter and represses the early A2b and A2c promoters, and
      that site-directed substitution of Arg120 abolishes both.
    action: MODIFY
    reason: >-
      The claim is correct and is the gene's core function, but the term is less specific
      than the evidence supports and both specific descendants are demonstrated in the
      same experiments, so both are proposed rather than one being chosen. Activation of
      A3 is positive regulation (GO:0045893); repression of A2b and A2c is negative
      regulation (GO:0045892). This is a genuinely bidirectional regulator, not a case of
      picking a sign: the same p4 surface, the Arg120-containing domain, activates at one
      promoter and represses at another according to where p4 binds relative to the
      polymerase, and a gene-4 nonsense mutant shows both arms failing in vivo at once.
    proposed_replacement_terms:
