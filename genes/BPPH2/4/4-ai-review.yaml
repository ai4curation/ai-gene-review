  review:
    summary: >-
      Proposed row. GOA carries no molecular-function term for what p4 is: its only MF
      rows are DNA binding plus the two wrong terms removed above. p4 is a
      sequence-specific DNA-binding protein that turns on the late A3 promoter, whose own
      -35 element is too poor for the host polymerase to use, by binding upstream and
      stabilising the enzyme there as a closed complex.
    action: NEW
    reason: >-
      The activity is directly demonstrated with purified components and is p4's defining
      property, and the gene performs the work itself: it binds the cis-regulatory site
      and makes the protein-protein contact that recruits and stabilises the polymerase,
      rather than being required for the process at a distance. Site-directed substitution
      of a single p4 residue, Arg120, abolishes activation while leaving DNA binding
      intact, which pins the activator function on p4's own surface. The comparator check
      supports the term: GO:0001216 is used for exactly this class of bacterial and phage
      activators that contact the polymerase alpha C-terminal domain from an upstream
      site. It is not a descendant or ancestor of any other term proposed here:
      GO:0000987, the replacement on the DNA-binding rows, sits under GO:0003677, while
      GO:0001216 sits under GO:0140110.
