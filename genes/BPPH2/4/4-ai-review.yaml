suggested_questions:
- question: >-
    Which residues of p6 form the interface with the C-terminal tail of p4? The p4 side is
    mapped residue by residue, but no p6 variant has ever been tested for the contact.
  experts:
  - Fernando Rojo
  - Ana Camacho
- question: >-
    What makes the switch happen when it does? p4 and p6 are both early proteins, yet the
    late promoter turns on only around 20 minutes after infection. Is the trigger simply p6
    accumulating to the concentration at which p4-nucleated polymerisation becomes stable,
    or is something else rate-limiting in vivo?
  experts:
  - Ana Camacho
  - Fernando Rojo
- question: >-
    Why does one p4 surface activate at A3 and repress at A2c? The Arg120 contact with
    alpha-CTD is shared, and the stated explanation is the relative geometry of p4 and the
    polymerase at each promoter. Would a structure of p4 bound to DNA together with the
    polymerase, at each of the two promoters, show two different alpha-CTD contacts or one
    contact used from two orientations?
  experts:
  - Miguel Coll
  - Mario Mencia
suggested_experiments:
- hypothesis: >-
    The p4-p6 contact is mediated by acidic or polar surface residues of p6 pairing with
    the basic C-terminal tail of p4 (R116, R118, R120, R121, K122).
  description: >-
    Charge-reversal and alanine scanning across the solvent-exposed surface of p6, scored
    in three assays with purified components: cooperative binding with wild-type p4 over
    the A2c-to-A3 fragment by DNase I footprinting, formation of the p4-p6-DNA complex by
    band shift, and p6-assisted repression of A2c by in vitro transcription on TP-DNA.
    Intrinsic p6 DNA binding and dimerisation are measured in parallel so that interface
    mutants are distinguished from destabilised or DNA-binding-defective protein, and
    candidate interface mutants are then tested for charge-swap rescue against the
    complementary p4 substitutions.
  experiment_type: site-directed mutagenesis with in vitro reconstitution
- hypothesis: >-
    p4's requirement for host lysis is entirely indirect, through activation of the single
    late promoter A3, and is not a separate activity of the protein.
  description: >-
    Supply gp14 and gp15 from a host-borne inducible construct in cells infected with a
    gene-4 nonsense mutant, and ask whether lysis timing is restored to wild type while
    virion production stays blocked. Separating the lysis phenotype from the rest of the
    late programme in this way would show directly that p4 contributes nothing to lysis
    beyond transcription of the lysis genes, and would settle whether any process term
    beyond transcriptional regulation belongs on p4.
  experiment_type: trans-complementation of a nonsense mutant
- hypothesis: >-
    p4 bound at A3 and p4 bound at A2c engage different surfaces of the RNA polymerase
    alpha C-terminal domain.
  description: >-
    Cryo-EM of reconstituted complexes of Bacillus subtilis sigma-A RNA polymerase with p4
    on DNA fragments carrying either the A3 or the A2c promoter, compared against a
    charge-swap matrix pairing p4 C-terminal substitutions with alpha-CTD substitutions and
    scored for activation at A3 and repression at A2c, to test whether the two outcomes use
    one contact from two geometries or two distinct contacts.
  experiment_type: structural biology with genetic complementation
