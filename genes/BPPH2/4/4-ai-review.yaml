- description: >-
    Sequence-specific repression of the main phi29 early promoters A2b and A2c, the other
    half of the same switch and performed by the same protein surface. p4 target sites 1
    and 3 overlap the -35 boxes of A2c and A2b. At A2c, p4 bound immediately upstream of
    the polymerase does not prevent its binding or the formation of an initiated complex
    but blocks promoter clearance, so only short abortive transcripts are made; the
    Arg120 contact with alpha-CTD is what holds the enzyme at the promoter, and relieving
    that contact relieves repression. At A2b, the p4-containing nucleoprotein complex
    displaces the polymerase from the promoter. In vivo, a gene-4 nonsense mutant lets
    early transcription from A2b and A2c climb through infection instead of being shut
    off, while A3 transcripts stay almost undetectable.
