- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IMP
  original_reference_id: PMID:820555
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: Indirect downstream mutant phenotype; gene 4 mutants fail to lyse the host only because p4 is required to transcribe the late operon encoding the lysis proteins gp14 and gp15.
    action: REMOVE
    reason: Protein p4 is a transcriptional regulator and has no direct role in host cell cytolysis. In PMID:820555, the absence of lysis in gene 4 mutants is a secondary consequence of failing to activate the single late promoter A3 that drives expression of all late morphogenesis and lysis genes (gp14 holin and gp15 endolysin).
    supported_by:
    - reference_id: PMID:2107318
      supporting_text: Transcription initiation from the Bacillus subtilis phage phi 29 late A3 promoter requires the viral protein p4, a transcriptional activator.
