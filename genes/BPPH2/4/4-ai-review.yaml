- term:
    id: GO:0016987
    label: sigma factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008771
  - UniProtKB-KW:KW-0731
  review:
    summary: >-
      Automatic row resting on the UniProt keyword KW-0731 "Sigma factor" and on the same
      InterPro family, whose description calls p4 a possible "sigma-like component of the
      host RNA polymerase". GO:0016987 is defined as the promoter-specificity subunit of
      the polymerase, which binds promoter elements only as part of the holoenzyme and is
      released once elongation begins. None of that describes p4.
    action: REMOVE
    reason: >-
      p4 is not a subunit of RNA polymerase. It binds DNA on its own, at its own target
      sites, independently of the enzyme, and it acts on the holoenzyme from outside by
      contacting the C-terminal domain of the alpha subunit, the same surface that
      conventional activators and repressors use; the contact is dispensable for DNA
      binding and is mapped to a single residue, Arg120, whose substitution leaves DNA
      binding intact while abolishing both activation and repression. Nothing about p4
      matches the sigma-factor concept: it confers no promoter specificity on core
      polymerase, is not part of the holoenzyme, and is not released at elongation but
      stays bound to its site. The claim is false rather than imprecise, so the row is
      removed; the functional claim it was reaching for is captured instead by the
      activator and repressor activity rows proposed below. Two resources carry the
      defect, so two reports are filed.
    supported_by:
    - reference_id: PMID:8799127
      supporting_text: >-
        Protein p4 could form a complex at PA2c with purified wild-type alpha subunit, but not with a deletion mutant lacking the 15 C-terminal residues.
    - reference_id: PMID:8617213
      supporting_text: >-
        Activation involves stabilization of RNA polymerase (RNAP) at the A3 promoter as a closed complex and is mediated by interaction between RNAP and a small domain of protein p4 in which residue Arg120 plays an essential role.
    - reference_id: PMID:8617213
      supporting_text: >-
        Mutation of protein p4 residue Arg120, which relieves the contact between the two proteins, leads to a loss of repression.
    - reference_id: file:BPPH2/4/4-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: >-
        R->Q: 80% loss of transcription activation from the A3 promoter and 80% loss of transcription repression from the A2c promoter. Complete loss of interaction with host RNAP.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:P03682
      slot: KW
      requested_change: DELETE_VALUE
      asserted_value: UniProtKB-KW:KW-0731
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        P03682 carries the keyword "Sigma factor", which maps to GO:0016987 and produces
        this row (the entry's own DR GO line records the route as IEA:UniProtKB-KW). p4 is
        not a polymerase subunit; the entry's own curated SUBUNIT and FUNCTION lines
        describe it as a DNA-binding regulator that interacts with host RNA polymerase via
        its C-terminus, and its MUTAGEN 120 annotation separates DNA binding from the RNAP
        contact. The keyword also propagates downstream: GO_REF:0000108 derived the
        GO:2000142 row in this review from GO:0016987 by inter-ontology inference, so one
        keyword produced two rows. The keywords "Activator", "Repressor", "Transcription"
        and "Transcription regulation", already present on the entry, carry the correct
        content.
    - defect_type: WRONG_TERM
