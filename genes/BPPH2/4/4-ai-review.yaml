  knowledge_gaps:
  - gap_statement: >-
      Which residues of the nucleoid protein p6 contact the C-terminal tail of p4 is
      unknown, so the interface that sets the phase and the boundaries of the p6 filament
      has been mapped on one side only.
    boundary: >-
      The p4 side is mapped to single residues: deleting the last 14 residues of p4, or
      substituting R116, R118, R120, R121 or K122, impairs cooperative binding with p6 and
      p6-assisted repression of A2c to graded extents, and those determinants are distinct
      from the Arg120 determinant used for the polymerase contact. The p6 side has never
      been probed, because every mutant in the study that defined the interaction is a p4
      or a DNA-site mutant and the p6 used was wild-type protein throughout.
