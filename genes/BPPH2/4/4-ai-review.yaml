- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:2107318
  qualifier: enables
  review:
    summary: >-
      Direct binding of p4 to the late A3 promoter, mapped by gel retardation, DNase I
      footprinting, methylation interference and circular permutation to a region between
      -50 and -100 relative to the A3 start site that is intrinsically curved and is bent
      further on binding. The site is an inverted repeat bound by two p4 monomers, and the
      later crystal structure shows the recognition is base-specific.
    action: MODIFY
    reason: >-
      The claim is directly demonstrated, but the root term is less specific than the
      evidence supports and the refinement is informative here. p4 does not bind DNA
      generically: it recognises inverted-repeat target sites that lie in the regulatory
      region of three promoters, with sites overlapping the -35 boxes of A2c and A2b and
      the activation site upstream of the A3 start, and the N-hook motif makes
      base-specific major-groove contacts in the 41 bp A3-site co-crystal. GO:0000987
      cis-regulatory region sequence-specific DNA binding is therefore the supported term
      and is a descendant of GO:0003677 by way of GO:0043565. It is not refined further to
      the transcription-regulator activity terms, which are not DNA-binding descendants
      and are proposed separately as NEW rows below.
    proposed_replacement_terms:
