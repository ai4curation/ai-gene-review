  review:
    summary: Correct but less specific than sequence-specific DNA binding (GO:0043565), as p4 recognizes specific inverted-repeat sites at the late A3 and early A2b/A2c promoters.
    action: MODIFY
    reason: Gel retardation, footprinting, and circular permutation assays in PMID:2107318 demonstrate that p4 binds a specific inverted-repeat target sequence upstream of the late A3 promoter and bends the DNA; refine to GO:0043565 (sequence-specific DNA binding).
    proposed_replacement_terms:
