- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IMP
  original_reference_id: PMID:820555
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row (2025) from the 1976 Carrascosa et al. nonsense-mutant characterisation of
      phi29 gene products. That paper reports one lysis cistron, whose mutants show
      delayed lysis and a normal or larger burst after artificial lysis, and the 2025
      campaign placed GO:0044659 on two entries from it: gene 4 and gene 15. Gene 4 is the
      early transcription activator, and p4 is indirectly required for lysis because the
      holin and endolysin genes are late genes read from the single promoter it switches
      on.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is not false of p4, which is why it is marked over-annotated rather than
      removed: no p4 means no A3 transcription, hence no gp14 holin and no gp15 endolysin,
      so p4 is genetically upstream of lysis with a positive effect. But it is an
      over-annotation of a transcription regulator to a downstream outcome. A3 is the only
      late promoter, so by the same reasoning p4 would be upstream of capsid assembly,
      scaffolding, tail morphogenesis and DNA packaging as well; annotating lysis alone
      records no property specific to p4, and what p4 actually does is already said by the
      transcription-regulation rows. The cited evidence is also another gene's. The 1976
      abstract reports a single lysis cistron, and its mutant produced a burst size
      similar to or higher than wild type after artificial lysis, which a gene-4 mutant
      cannot do: a gene-4 nonsense mutant makes almost no A3 transcript, hence no
      structural proteins and no progeny to release, so the reported phenotype excludes
      gene 4 by construction. The cistron is a late lysis gene, and three independent
      lines put it on gene 14, the holin (UniProtKB:P11188): gene 14 is the gene with a
      sus allele in that region, sus14(1241); its product is the one shown to be required
      for efficient lysis of B. subtilis; and delayed lysis with an undiminished burst is
      the canonical holin-null phenotype, gene 15 being the lysozyme the holin releases.
      Gene 14 carries no CACAO row at all. Neither of the two records that would settle it
      outright could be read: the 1976 full text is not in PMC and its two open-access
      locations were unreachable from here, and the GONUTS page that held the student's
      reasoning is permanently gone, gowiki.tamu.edu now returning HTTP 410 with "GONUTS,
      the GO wiki, has been retired" and the Wayback Machine holding no snapshot of it.
      The source defect is therefore PROBABLE rather than CONFIRMED.
    supported_by:
    - reference_id: PMID:820555
      supporting_text: >-
        A cistron, probably involved in the final lysis of the infected bacteria, has been found.
    - reference_id: PMID:820555
      supporting_text: >-
        Mutants in this gene give place, under restrictive conditions, to delayed lysis and produce, after artificial lysis, a burst size similar or higher than that obtained after wild-type phage infection.
    - reference_id: PMID:11689446
      supporting_text: >-
        In bacteria harbouring a nonsense mutant in gene 4, transcription from promoters A2b and A2c increases steadily during infection while the transcripts arising from promoter A3 are almost undetectable
    - reference_id: PMID:16600871
      supporting_text: >-
        The synthesis of DNA replication proteins and p4 takes place in the early phase, while structural, morphogenesis, and lysis proteins are synthesized in the late phase.
    - reference_id: PMID:21614197
      supporting_text: >-
        Late genes are expressed from a single promoter, A3.
    - reference_id: PMID:8432697
      supporting_text: >-
        Phage phi 29 gene 14, the product of which is required for efficient lysis of Bacillus subtilis, was cloned in Escherichia coli.
    - reference_id: PMID:3027653
      supporting_text: >-
        The g14 open reading frame (ORF) was confirmed by sequencing a sus14(1241) mutant.
    - reference_id: PMID:7831803
      supporting_text: >-
        The 131-codon gene 14 of Bacillus subtilis phage phi 29 encodes the holin function, whereas the downstream gene 15 codes for a lysozyme.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: CACAO
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:P03682
      corrected_value: UniProtKB:P11188
      corrected_label: Antiholin, gene product 14 (gp14), including the holin
      cause: SYMBOL_COLLISION
      confidence: PROBABLE
      explanation: >-
        PMID:820555 reports one lysis cistron, and the 2025 CACAO campaign spread
        GO:0044659 across two numbered phi29 entries from it, gene 4 (P03682) and gene 15
        (P11187), while the gene it was about carries no row. The mutant phenotype the
        abstract describes, delayed lysis with a burst size similar to or higher than wild
        type after artificial lysis, is the holin-null phenotype and cannot be gene 4's,
        whose nonsense mutants make almost no late transcript and therefore no progeny.
        The sus allele in that region is sus14(1241) (PMID:3027653) and gp14 is the
        product required for efficient lysis (PMID:8432697), with gp15 the lysozyme it
        releases (PMID:7831803). The likely mechanism is a numeric name collision between
        the paper's gene 14 and the entries named 4 and 15; the same paper's
        DNA-replication half was distributed correctly over five genes. PROBABLE rather
        than CONFIRMED because the paper's own cistron numbering could not be read: it is
        not in PMC, Wiley returns HTTP 403 on the article, ePDF, DOI and pdfdirect URLs,
        and the only repository copy (DIGITAL.CSIC, hdl 10261/38080) sits behind a
        bot-check that asks automated clients not to fetch it. The GONUTS record of the
        student's reasoning is also permanently gone (HTTP 410, no Wayback snapshot). The
        parallel review of gene 15 reached the same conclusion independently from the same
        secondary literature.
