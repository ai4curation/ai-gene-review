  findings:
  - statement: >-
      Cryo-EM reconstructions show that gp9 forms the cylindrical distal tail
      knob housing the gp13 peptidoglycan-degrading enzyme at its distal tip.
    supporting_text: >-
      The tail had been found to consist of three proteins: gp11, gp12* (cleaved from the gp12 precursor), and gp9, that form the lower collar, appendages, and knob, respectively ( Fig. 1 ) ( 7 , 17 ).
- id: file:BPPH2/9/9-uniprot.txt
  title: UniProtKB entry for 9 (P04331)
  findings:
  - statement: >-
      gp9 is a homohexamer of 6 copies at the distal tip of the tail tube that
      plugs the tube before DNA ejection and forms a membrane-perforating channel
      via six flexible hydrophobic loops during genome ejection.
    supporting_text: >-
      -!- FUNCTION: Distal (knob) tail protein that plugs the end of the tube before DNA ejection and forms a channel perforating the host membrane during ejection. {ECO:0000269|PubMed:18606992, ECO:0000269|PubMed:27309813}.
suggested_questions:
- question: >-
    What host membrane signal or mechanical cue following gp13 release triggers
    the conformational eversion of the six gp9 hydrophobic loops to insert into
    the Bacillus subtilis cytoplasmic membrane?
suggested_experiments:
- description: >-
    Reconstitute phi29 virions with liposomes and purified peptidoglycan fragments
    for cryo-electron tomography to visualize the gp9 transmembrane pore in a
    lipid bilayer.
