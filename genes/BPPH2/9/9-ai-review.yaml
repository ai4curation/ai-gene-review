  label: Bacillus phage phi29
description: >-
  Distal tail knob protein (gp9) of Bacillus phage phi29 that assembles as a
  homohexameric cylindrical tube at the distal end of the gp11 lower collar.
  In the mature virion, six internal hydrophobic loops of gp9 plug the tail tube
  lumen to retain the pressurized dsDNA genome; during infection, after gp13
  degrades the peptidoglycan layer, the hydrophobic loops evert and insert into
  the Bacillus subtilis plasma membrane to form a transmembrane pore for viral
  genome ejection into the host cytoplasm.
