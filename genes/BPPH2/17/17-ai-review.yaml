  review:
    summary: >-
      CACAO IMP row from the 1976 Carrascosa et al. survey of phi29 gene products and
      functions, a bulk nonsense-mutant screen whose abstract reports that mutants in six
      genes fail to synthesise phage DNA. Gene 17 is one of those six.
    action: ACCEPT
    reason: >-
      What the paper establishes for this gene specifically: that a sus17 mutant is one of
      the DNA-synthesis-negative mutants of the screen. The abstract does not name the six
      cistrons and the cached record is abstract-only, with GONUTS now permanently retired
      (gowiki.tamu.edu returns HTTP 410 "GONUTS, the GO wiki, has been retired", and the
      Internet Archive holds no snapshot of the relevant pages), so the student's reading
      cannot be inspected. It can, however, be checked independently: the same laboratory
      named the set seven years later while describing the mutant extracts it worked with
      - genes 2, 3, 5, 6 and 17 - which with gene 1 completes the six, and three later
      papers restate gene 17's replication role as established. The attribution is
      therefore correct, not a guess, and the row is accepted under curator deference. The
      qualifier acts_upstream_of_or_within_positive_effect is also the right choice here,
      not a defect: the evidence is a bulk mutant screen that demonstrates necessity
      without demonstrating participation, and the modern literature shows a large part of
      the sus17 DNA-synthesis defect is indirect, arising from failed genome
      internalisation, altered viral DNA topology and reduced p6 binding. Direct
      participation is established by the separate IDA row, not by this one.
