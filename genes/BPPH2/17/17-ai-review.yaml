- id: PMID:16517096
  title: Requirements for Bacillus subtilis bacteriophage phi29 DNA ejection.
  findings:
  - statement: >-
      The pull step requires an electrochemical proton gradient and negatively supercoiled
      DNA, and p17 is the component where the energy requirement sits, since azide has no
      effect in its absence.
    supporting_text: p17 suggests that this protein is essential for energy transduction
    reference_section_type: ABSTRACT
  - statement: >-
