taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Protein p17 is a 166-residue early protein of the Bacillus subtilis phage phi29,
  encoded by the first gene of the right-side early operon that is driven by the C2
  promoter and that enters the cell during the first step of genome injection. It is a
  homodimer with a putative coiled-coil region, is not a membrane protein, and has two
  demonstrated roles in the early stages of infection. First, it is required for
  efficient internalisation of the phage genome: phi29 injects its linear DNA
  right-to-left in two steps, and after capsid pressure has pushed in about 65% of the
  genome, p17 is a component of the energy-dependent machinery that actively pulls in the
  remaining left-hand portion. Second, it stimulates protein-primed replication of the
  phi29 genome. Purified p17 stimulates phi29 DNA amplification in vitro when the input
  DNA is scarce, and in vivo it is required at low multiplicity of infection but
  dispensable at high multiplicity, consistent with a role in recruiting limiting
  initiation factors to the replication origins early in infection. It is not needed for
  the terminal-protein-dAMP initiation reaction itself; it acts instead by optimising
  binding of the viral architectural protein p6 along the genome and at the DNA ends,
  which favours initiation, and the same p6-mediated effect represses p17's own promoter.
  The protein is conserved throughout the phi29-like phages, where it is treated as an
  accessory component of the phage DNA-replicating machinery.
