- id: PMID:17526715
  title: The phage phi29 membrane protein p16.7, involved in DNA replication, is required
    for efficient ejection of the viral genome.
  findings:
  - statement: >-
      p17 is required for efficient internalisation of the left half of the phi29 genome,
      and its absence affects the pull step more drastically than the absence of p16.7.
    supporting_text: These results corroborate earlier findings that protein p17 is
      required for efficient ejection of the left half of the φ29 genome
    reference_section_type: RESULTS
  - statement: >-
      p17's replication role is separable from its ejection role: replication is
      drastically reduced even once the whole sus17 genome has been internalised.
    supporting_text: the absence of p17 was also shown to drastically affect the level of
      φ29 DNA replication once the entire sus17 genome was internalized
    reference_section_type: INTRODUCTION
  - statement: >-
      Within the phi29 right-side early operon only gene 16.7 encodes a membrane protein,
      so p17 is not itself membrane-integral.
    supporting_text: Interestingly, 16.7 appears to be the only gene present in the
      right-side operon to encode a membrane protein
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified, and the cached record carries the PMC full text, which is
      the only full text available for any p17 paper. It supplies the three statements
      this review most depends on: the ranking of p17 against p16.7 in the pull step, the
      separation of p17's replication role from its ejection role, and the fact that p17
      is not a membrane protein.
