      multiplicity of infection (moi), which is probably the natural condition for
      infection, but is
  - reference_id: PMID:12480935
    supporting_text: p17 function is to optimize binding of protein p6 at the viral DNA
      ends, thus
  - reference_id: PMID:6402761
    supporting_text: The products of genes 5, 6 and 17 do not seem to be needed in the
      formation of the initiation complex
  - reference_id: PMID:15576790
    supporting_text: proteins p1 and p17 could be required to restrain the proper topology
      of phi29 DNA
  knowledge_gaps:
  - gap_statement: >-
      It is not known what p17 actually does to make phi29 replication efficient when
      template is limiting. The two candidate accounts - that it recruits limiting
      initiation factors to the origins, and that it optimises p6 occupancy by
      constraining the topology of the injected genome - have never been separated, and
      neither has been shown to be the proximal activity. Whether the in vivo p6-binding
      deficit of sus17-infected cells is a direct consequence of the p17-p6 interaction or
      an indirect consequence of the genome never being fully internalised is also
      unresolved.
    boundary: >-
      What is established: purified p17 stimulates phi29 DNA amplification in vitro from
      low input DNA; p17 is not needed for formation of the terminal protein-dAMP
      initiation complex in extracts; p17 is a homodimer and hetero-associates with p6; p6
      binding is reduced along the whole genome in sus17-infected cells, and that deficit
      is alleviated by novobiocin; and the replication defect persists after the whole
      sus17 genome has entered the cell.
    gap_kind:
    - BIOLOGY
    significance: >-
      p17 is the one phi29 replication protein whose activity has no molecular
      description, and it is the component that makes replication work under the low-input
      conditions the authors argue are the natural ones, so the gap sits exactly where the
      in vitro reconstitution stops explaining the infection.
    resolution: >-
      Reconstitute the stimulation with defined components and ask whether p17 changes p6
      occupancy, origin recognition by the terminal protein/polymerase heterodimer, or
      neither (see suggested_experiments).
    provenance:
    - reference_id: PMID:9858710
      supporting_text: possibly to recruit the limiting amount of initiation factors at
        the replication origins
    - reference_id: PMID:15576790
      supporting_text: proteins p1 and p17 could be required to restrain the proper
        topology of phi29 DNA
- description: >-
    Component of the energy-dependent machinery that pulls the left-hand part of the phi29
    genome into the host cytoplasm during the second, active step of injection. The first
    step is passive, driven by capsid packing pressure, and delivers the right-side early
    operon that encodes p17 itself; the second requires newly synthesised p17, an
    electrochemical proton gradient and negatively supercoiled DNA, and p17 is where the
    energy requirement is placed, since azide has no effect in its absence. Loss of p17
    impairs this step more severely than loss of the membrane protein p16.7, with which it
    cooperates. GO has no molecular function term for this activity either.
