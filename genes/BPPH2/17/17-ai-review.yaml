  label: Bacillus phage phi29
description: Early replication auxiliary protein (gp17, p17) of Bacillus phage phi29 that is conditionally required for the initial rounds of protein-primed viral DNA replication at low multiplicity of infection. Although p17 does not bind DNA directly, it interacts with the viral histone-like nucleoprotein p6 to enhance and optimize p6 binding at the terminal viral replication origins when viral templates and initiation factors are limiting.
