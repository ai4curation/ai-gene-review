    supporting_text: p17 suggests that this protein is essential for energy transduction
  - reference_id: PMID:16517096
    supporting_text: The second step is transcription-independent and is completely
      abolished by novobiocin, suggesting a requirement for negatively supercoiled DNA.
  - reference_id: PMID:17526715
    supporting_text: These results corroborate earlier findings that protein p17 is
      required for efficient ejection of the left half of the φ29 genome
proposed_new_terms:
- proposed_name: symbiont-mediated pulling of symbiont genome into host cytoplasm
  proposed_definition: >-
    The active, energy-requiring internalisation of the part of a symbiont genome that is
    not delivered by the pressure stored in the virion, carried out by symbiont proteins
    that are translated inside the host cell from the portion of the genome already
    delivered. The process is distinct from the ejection apparatus of the virion, acts
    from the host cytoplasm rather than across the envelope from outside, and requires an
    electrochemical gradient across the host membrane.
  justification: >-
    GO represents genome entry by the apparatus that performs it: GO:0039678 symbiont
    genome ejection through host cell envelope and its children are defined in terms of
    contractile, long flexible or short tails, that is, structures of the virion. phi29
    shows that a second, mechanistically separate phase exists, performed by early
    proteins made inside the host from the first-delivered part of the genome: about 65%
    of the genome enters passively by capsid pressure, and the remainder is pulled in by a
    motor that includes p17 and p16.7 and that depends on a proton gradient and on
    negatively supercoiled DNA. There is currently no term that distinguishes this
    host-side pull phase, so p17 and p16.7 can only be annotated to the virion-apparatus
    parent. The phenomenon is unlikely to be confined to phi29, since a push-pull
    internalisation has been proposed for other phages of Gram-positive hosts.
  proposed_parent:
    id: GO:0039678
    label: symbiont genome ejection through host cell envelope
  supported_by:
  - reference_id: PMID:15066038
    supporting_text: second step at least one of the viral early proteins, p17,
      participates in the
  - reference_id: PMID:16517096
    supporting_text: Viral DNA pulling also requires an electrochemical proton gradient,
      as the process is highly impaired by specific energy poisons such as gramicidin and
      CCCP
  - reference_id: PMID:17526715
    supporting_text: at least two proteins encoded by the right-side operon, p17 and
      p16.7, are required for an efficient pull step of DNA ejection, although the absence
      of p17 affects this step more drastically than the absence of p16.7
suggested_questions:
- question: >-
    Should p17's role in the pull step of phi29 genome internalisation be annotated to
    GO:0039678, whose definition is written around the virion's ejection apparatus, or
    does GO want a separate term for the host-side, energy-dependent pull phase performed
    by early proteins translated from the already-injected part of the genome? The same
    question applies to phi29 p16.7, which has no ejection annotation either.
- question: >-
    Is the reduction of p6 binding along phi29 DNA in sus17-infected cells a direct
    consequence of the p17-p6 interaction, or an indirect consequence of impaired genome
    internalisation and altered DNA topology? The answer decides whether p17's
    contribution to replication should be described as an activity on p6 or as an
    upstream requirement.
- question: >-
    Does the CACAO practice of using acts_upstream_of_or_within_positive_effect for
    IMP annotations drawn from bulk nonsense-mutant screens reflect an explicit
    instruction? Every 2025-dated phi29 CACAO row carries that qualifier while the same
    organism's 2012-2017 rows use involved_in, and on this gene the conservative qualifier
    is the better fit for the evidence.
suggested_experiments:
- hypothesis: >-
    p17 stimulates phi29 replication by increasing p6 occupancy at the DNA ends, and not
    by acting on the terminal protein/DNA polymerase heterodimer.
  description: >-
    Reconstitute the minimal phi29 amplification reaction (terminal protein, DNA
    polymerase, p5, p6, DNA-protein p3 template) at limiting template concentration and
    titrate purified p17 and the coiled-coil-defective, dimerisation-deficient p17
    derivative. Measure initiation and amplification yield, and in parallel measure p6
    occupancy on the template ends by footprinting or by ChIP from the reaction, so that a
    stimulation of amplification can be attributed to, or dissociated from, a change in p6
    binding.
  experiment_type: in vitro reconstitution with footprinting
- hypothesis: >-
    The p6-binding deficit of sus17-infected cells is downstream of incomplete genome
    internalisation, so it disappears when the full genome is delivered independently of
    p17.
  description: >-
    Compare p6 occupancy by X-ChIP along the phi29 genome in cells infected with sus17
    phage and in cells where the sus17 genome has been fully internalised - for example by
    infecting a suppressor host, by complementing p17 in trans from a plasmid after
    internalisation is complete, or by selecting the time window in which the X-ChIP
    left-end/right-end ratio shows the left end has arrived. A persisting deficit would
    establish a replication-specific role for p17; its disappearance would place the
    effect entirely on internalisation.
  experiment_type: chromatin immunoprecipitation with genetic complementation
- hypothesis: >-
    p17 is the energy-transducing component of the pull motor and contacts the host
    membrane machinery through p16.7 rather than directly.
  description: >-
    Fractionate infected B. subtilis and ask whether p17 is recovered with the membrane
    only when p16.7 is present, using sus16.7 phage as the comparator, and map the
    interaction by crosslinking or proximity labelling from p17 in infected cells. Combine
    with measurement of the pull step in cells carrying the p16.7 membrane-anchor deletion
    to test whether anchoring, rather than p16.7 itself, is what p17 requires.
  experiment_type: subcellular fractionation and proximity labelling
