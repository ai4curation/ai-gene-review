suggested_questions:
- question: Why does protein p17 remain soluble rather than incorporating stably into the ternary p6-origin DNA nucleoprotein complex after stimulating p6 binding?
- question: How does p17 contribute to the second-step pulling of the right end of the phi29 genome into the host cell prior to replication initiation?
suggested_experiments:
- description: Use hydrogen-deuterium exchange mass spectrometry (HDX-MS) and NMR titration to map the transient interaction surface between p17 and p6 dimers in the presence and absence of origin DNA.
- description: Perform single-molecule fluorescence colocalization (CoSMoS) of labeled p17, p6, and origin DNA to test whether p17 acts as a catalytic chaperone that alters p6 dimer conformation before DNA loading.
