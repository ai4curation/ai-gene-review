  knowledge_gaps:
  - gap_statement: Protein p17 stimulates p6 binding to the terminal viral replication origins via direct protein-protein interaction without possessing intrinsic DNA-binding or enzymatic activity, leaving it without a specific GO Molecular Function term beyond protein binding.
    boundary: Whether p17 functions as a conformational chaperone for p6 dimers or has an additional biochemical activity during the second-step genome entry/replication transition remains unresolved.
