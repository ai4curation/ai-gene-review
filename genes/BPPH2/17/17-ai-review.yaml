core_functions:
- description: >-
    Accessory stimulator of protein-primed replication of the phi29 genome, acting at the
    stage after the terminal-protein-dAMP initiation complex can form. p17 is dispensable
    for the initiation reaction in extracts, and its contribution is seen when template is
    scarce: purified p17 stimulates phi29 DNA amplification in vitro from a low amount of
    input DNA, and in vivo it is required at low multiplicity of infection but not at
    high. The mechanism proposed from its dimerisation and its hetero-association with
    the viral architectural protein p6 is that p17 optimises p6 binding at the viral DNA
    ends, thereby favouring initiation, with in vivo chromatin immunoprecipitation showing
    reduced p6 binding along the whole genome in sus17-infected cells. GO has no molecular
    function term for this kind of accessory activity, so the activity is left unstated
    rather than forced onto a binding term.
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  supported_by:
