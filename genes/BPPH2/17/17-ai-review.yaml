    summary: >-
      Proposed row for p17's best-documented in vivo role, which is absent from GOA
      altogether. phi29 injects its linear genome right-to-left in two steps; after
      capsid pressure has pushed in about 65% of it, p17 is a component of the
      energy-dependent machinery that actively pulls the remaining left-hand portion into
      the cytoplasm.
    action: NEW
    reason: >-
      p17 does the work of this process rather than merely being required for it. Three
      papers from two groups converge: X-ChIP measurement of left-end internalisation in
      sus17-infected cells shows the pull step is strongly impaired without p17 and that
      p17 affects it more severely than the membrane protein p16.7 does; dissection with
      energy poisons shows the pull step needs an electrochemical proton gradient and
      that azide has no further effect in p17's absence, placing the energy-transduction
      step on p17 itself. GO:0039678 is the mechanism-agnostic parent term for entry of a
      symbiont genome into the host cell through the host cell envelope. The short-tail
      child GO:0099002 is deliberately not used: its definition is about the tail tube,
      connector and released core proteins, and p17 is not part of that apparatus - it is
      an early protein translated inside the host from the already-injected right-hand
      operon. Whether GO wants a distinct term for this host-side, energy-dependent pull
      phase is raised in suggested_questions rather than asserted here.
