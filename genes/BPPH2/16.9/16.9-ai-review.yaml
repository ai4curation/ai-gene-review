  label: Bacillus phage phi29
description: Uncharacterized early protein gp16.9 encoded in the right early region (operon C2) of the Bacillus phage phi29 genome. It belongs to the phi29likevirus gp16.9 family and is synthesized during early infection, though its biochemical activity, subcellular localization, and physiological role in phage propagation remain unknown.
