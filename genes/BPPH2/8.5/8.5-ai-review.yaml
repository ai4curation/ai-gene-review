id: B3VMP4
gene_symbol: '8.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: Capsid head fiber protein gp8.5 that assembles into 55 homotrimeric fibers decorating the quasi-3-fold symmetry positions of the Bacillus phage phi29 procapsid and mature virion capsid. Each trimer comprises a pseudohexagonal base anchored to the BIG2 domains of the major capsid protein gp8 and a 110-Angstrom protruding shaft built from a supercoiled triple repeating helix-turn-helix motif; although dispensable for virion morphogenesis and infectivity under laboratory conditions, the head fibers may facilitate initial virion contact with the Bacillus subtilis cell wall.
existing_annotations:
- term:
    id: GO:0019062
    label: virion attachment to host cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1161
  review:
    summary: Head fibers may weakly enhance virion attachment or orientation on the host cell wall, but they are dispensable for adsorption and infectivity, which is primarily mediated by the gp12* neck appendages.
    action: KEEP_AS_NON_CORE
    reason: Thin-section electron microscopy suggests gp8.5 head fibers may facilitate initial contact with the Bacillus subtilis cell wall (PMID:21383126), but fiberless phi29 mutants assemble and infect efficiently (PMID:409854), and specific host receptor binding is carried out by the tail appendage protein gp12*.
    supported_by:
    - reference_id: PMID:21383126
      supporting_text: Thin section studies of Bacillus subtilis cells infected with fibered or fiberless 29 suggest that the fibers might enhance the attachment of the virions onto the host cell wall.
    - reference_id: PMID:409854
      supporting_text: These observations suggest that the head fiber is not an essential component of the prohead or virion and that the assembly process is efficient in the absence of fiber protein.
