  supporting_entities:
  - UniProtKB-KW:KW-1160
  review:
    summary: External capsid head fibers do not mediate viral penetration or entry into the host cell.
    action: REMOVE
    reason: This IEA annotation derives from an erroneous UniProt keyword assignment (KW-1160, Viral penetration into host cytoplasm). gp8.5 forms external decorative fibers on the capsid shell that are completely dispensable for infection (PMID:409854) and play no role in cell envelope penetration or genome entry, which are mediated by the tail apparatus (gp12*, gp13, and gp9).
    supported_by:
    - reference_id: PMID:409854
      supporting_text: These observations suggest that the head fiber is not an essential component of the prohead or virion and that the assembly process is efficient in the absence of fiber protein.
