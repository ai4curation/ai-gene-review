  review:
    summary: gp8.5 forms a homotrimer via a supercoiled triple helix-turn-helix shaft.
    action: KEEP_AS_NON_CORE
    reason: X-ray crystallography and cryo-EM in PMID:21383126 show that three identical gp8.5 subunits assemble into a homotrimeric head fiber; self-association is valid but secondary to its core role as a structural constituent of the virion.
    supported_by:
