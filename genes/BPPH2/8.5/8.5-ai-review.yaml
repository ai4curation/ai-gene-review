suggested_experiments:
- description: Compare adsorption kinetics and competitive fitness of isogenic fibered (8.5+) and fiberless (8.5-) phi29 virions on structured Bacillus subtilis biofilms and purified cell wall peptidoglycan-teichoic acid sacculi.
  hypothesis: Homotrimeric gp8.5 head fibers mediate low-affinity reversible tethering to cell wall polymers in high-shear or biofilm environments.
  experiment_type: Phage adsorption kinetics and biofilm competition assay
