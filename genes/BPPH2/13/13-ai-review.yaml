references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:18394643
  title: Multifunctional roles of a bacteriophage phi 29 morphogenetic factor in assembly
    and infection.
  findings:
  - statement: >-
      Identified gp13 as a structural component localized to the distal tip of
      the phi29 tail knob and demonstrated that both gp9 and gp13 are required to
      assemble an active tail knob.
    supporting_text: >-
      The Bacillus subtilis double-stranded DNA bacteriophage phi 29 gene 13 product (gp13), previously undetected in the virion, was identified and localized to the distal tip of the tail knob.
- id: PMID:18606992
  title: Crystal and cryoEM structural studies of a cell wall degrading enzyme in
    the bacteriophage phi29 tail.
  findings:
  - statement: >-
      Solved the 1.8-A crystal structure of gp13 and cryo-EM reconstructions of
      the tail knob, showing that gp13 has an N-terminal lysozyme-like domain and
      a C-terminal M23 metalloendopeptidase domain located at the distal tip of
      the tail knob.
    supporting_text: >-
      A 1.8-A resolution crystal structure of gene product 13 (gp13) shows that this tail protein has spatially well separated N- and C-terminal domains, whose structures resemble lysozyme-like enzymes and metallo-endopeptidases, respectively. CryoEM reconstructions of the WT bacteriophage and mutant bacteriophages missing some or most of gp13 shows that this enzyme is located at the distal end of the phi29 tail knob. This finding suggests that gp13 functions as a tail-associated, peptidoglycan-degrading enzyme able to cleave both the polysaccharide backbone and peptide cross-links of the peptidoglycan cell wall.
- id: file:BPPH2/13/13-uniprot.txt
  title: UniProtKB entry for 13 (P15132)
  findings:
  - statement: >-
      gp13 localizes to the distal tip of the tail knob, is essential for tail
      assembly, and degrades both glycosidic linkages and peptide cross-links of
      the host peptidoglycan cell wall during viral entry.
    supporting_text: >-
      -!- FUNCTION: May serve as a plug to restrain the highly pressurized packaged genome and thus would be the first virion protein to contact the host cell wall, degrading the peptidoglycan layer and thereby facilitating viral genome entry into the host bacteria. Acts probably as a multifunctional enzyme that degrades N-acetylglucosamine polymers (in vitro) and cleaves the peptide cross-links of the host cell wall. Essential for the tail assembly. {ECO:0000305|PubMed:18394643, ECO:0000305|PubMed:18606992}.
suggested_questions:
- question: >-
    Is gp13 completely ejected into the Bacillus subtilis peptidoglycan matrix
    ahead of the viral DNA, or does it remain tethered to the everted gp9 tube
    during genome translocation?
suggested_experiments:
- description: >-
    Perform biochemical peptidoglycan digestion assays with isolated N-terminal
    (GH24) and C-terminal (M23) domains of gp13 on purified Bacillus subtilis
    sacculi followed by RP-HPLC/MS muropeptide profiling to determine the exact
    peptide cross-link cleavage bond and synergy between the two catalytic
    domains.
