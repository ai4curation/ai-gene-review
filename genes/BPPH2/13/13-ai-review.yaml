- term:
    id: GO:0031640
    label: killing of cells of another organism
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0081
  review:
    summary: >-
      Spurious keyword mapping from KW-0081 (Bacteriolytic enzyme); gp13 locally
      punctures the cell wall for viral DNA entry rather than killing the host
      cell.
    action: REMOVE
    reason: >-
      gp13 is a virion tail-tip exolysin (present in ~2 copies per virion) that
      locally degrades the peptidoglycan layer during phage entry so the genome
      can be injected into a viable host cell. Host cell killing and cytolysis at
      the end of the lytic cycle are mediated by the gp14 holin and gp15
      endolysin, not gp13.
