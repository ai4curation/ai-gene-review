      describes. This is the row that carries the claim the misattributed CACAO row
      below also states, so the correction of that row's provenance does not cost the
      entry a true annotation.
    supported_by:
    - reference_id: PMID:8432697
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        Production of protein 14 in E. coli resulted in cell death, whereas production of protein 14 concomitantly with the phi 29 lysozyme or unrelated murein-degrading enzymes led to lysis, suggesting that membrane-bound protein 14 induces a nonspecific lesion in the cytoplasmic membrane.
    - reference_id: file:BPPH2/15/15-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Endolysin with lysozyme activity that degrades host peptidoglycans and participates with the holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles.
- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IMP
  original_reference_id: PMID:820555
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row (2025) on the 1976 phi29 sus-mutant survey. The term is true of gp15
      and is carried independently by the UniRule row above, but the mutant phenotype
      the paper reports belongs to the adjacent gene 14, the holin, and the qualifier
      is wrong for a protein that executes the lytic step.
    action: ACCEPT
    reason: >-
      Kept, and the curator deferred to, because the claim is true and independently
      established: gp15 is the endolysin whose hydrolysis of the host sacculus
      releases progeny virions, which the GO_REF:0000104 row above asserts on sound
      grounds. What is wrong is the reference-to-gene pairing, recorded as a source
      defect. PMID:820555 reports one lysis cistron, unnamed in the abstract: "A
      cistron, probably involved in the final lysis of the infected bacteria, has been
      found", whose mutants show delayed lysis with a normal or better burst after
      artificial lysis. Five lines place that cistron at gene 14 rather than gene 15.
      (i) The only suppressor-sensitive mutant in this region of the phi29 collection
      is sus14(1241) (PMID:3027653); there is no sus15. (ii) Gene 14's product is the
      one required for efficient lysis of Bacillus subtilis (PMID:8432697). (iii) Gene
      14 encodes the holin and gene 15 the lysozyme (PMID:7831803), and a holin mutant
      gives exactly the delayed-lysis-with-normal-burst phenotype the 1976 abstract
      describes, because the endolysin accumulates in the cytoplasm but cannot reach
      the murein. (iv) gp15 was characterised eleven years later by cloning and
      purification (PMID:3469652), not by any mutant, so a 1976 mutant-phenotype paper
      cannot ground an IMP on it. (v) Decisively, the same curator made a second
      GO:0044659 IMP row from the same sentence on gene 4, the late-genes
      transcription activator p4 (UniProtKB:P03682, 2025-02-20, in the project's CACAO
      snapshot): one cistron in the paper, two genes annotated, and the actual lysis
      cistron carries no row at all. The choice between those two rows is therefore a
      false one - the answer is neither, because the cistron is gene 14 - and the
      later phi29 literature attributes the 1976 abstract's exact phenotype, delayed
      lysis with a normal or larger burst after artificial lysis, to the alleles
      sus14(1241) and sus14(1242) by name. This is the adjacent-locus shape that batch 3's
      first screen was built to test, and it behaves as it did on phage T4 gp5.4 - the
      term happens to be true of the entry it landed on, so an inventory of terms
      scores the row as a success while its stated evidence is about a different
      protein. Removal is not the remedy: the full text could not be read
      (abstract-only cache, Eur J Biochem 1976 is not in PMC), and the GONUTS page
      that would hold the student's reasoning now returns HTTP 410 Gone with "GONUTS,
      the GO wiki, has been retired" (queried 2026-11-01).
    supported_by:
    - reference_id: PMID:820555
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        A cistron, probably involved in the final lysis of the infected bacteria, has been found.
    - reference_id: PMID:3027653
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        The g14 open reading frame (ORF) was confirmed by sequencing a sus14(1241) mutant.
    - reference_id: PMID:7831803
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        The 131-codon gene 14 of Bacillus subtilis phage phi 29 encodes the holin function, whereas the downstream gene 15 codes for a lysozyme.
    - reference_id: PMID:8432697
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        Phage phi 29 gene 14, the product of which is required for efficient lysis of Bacillus subtilis, was cloned in Escherichia coli.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: OTHER
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:P11187
      corrected_value: UniProtKB:P11188
      corrected_label: Antiholin / Holin (gene product 14, gp14) of Bacillus phage phi29
      cause: SYMBOL_COLLISION
      confidence: PROBABLE
      explanation: >-
        Assigned by CACAO (GONUTS community curation, 2025-02-17). PMID:820555
        describes a single cistron whose mutants lyse late; the suppressor-sensitive
        mutant that exists in this region is sus14(1241) (PMID:3027653), gene 14's
        product is the one required for efficient lysis (PMID:8432697), and gene 14 is
        the holin while gene 15 is the lysozyme (PMID:7831803). gp15 itself was first
        characterised in 1987 by cloning and purification, with no mutant. The same
        paper and term were also put on gene 4 (UniProtKB:P03682), the late-genes
        transcription activator, so one sentence about one cistron generated two rows
        on two genes, neither of them gene 14. The GO:0044659 term is nonetheless true
        of gp15 and is carried by the GO_REF:0000104 UniRule row, so the requested
        change is to move this row's evidence to P11188 rather than to delete the claim
        from P11187. PROBABLE rather than CONFIRMED because the 1976 full text could
        not be read: Eur J Biochem 1976 is not in PMC, the cached record is
        abstract-only, and gowiki.tamu.edu now returns HTTP 410 Gone, so the cistron
        number the paper itself gives could not be checked directly.
    - defect_type: WRONG_QUALIFIER
      resource: OTHER
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within_positive_effect
      corrected_value: involved_in
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        gp15 performs the peptidoglycan hydrolysis that constitutes the cytolytic step
        of viral release, so it participates in GO:0044659 rather than acting upstream
        of it; involved_in is the qualifier the entry's other GO:0044659 row uses. This
        is the same regressed-qualifier pattern reported from AcrIIA5 in batch 2, and
        it is diagnostic here: the upstream-effect qualifier fits a mutant that delays a
        downstream outcome, which is further evidence that the row was written from the
        gene-14 holin phenotype rather than from anything gp15 does. All ten of phi29's
        2025-dated CACAO rows carry this same qualifier, so it is a campaign-wide habit
        rather than a per-row judgement, and it has to be judged gene by gene: on a
        regulator, or where the only evidence is a downstream phenotype, the hedge can
        be the better fit. It is not the better fit here, because gp15's activity was
        assayed directly on the purified protein and that activity is the lytic step
        itself.
