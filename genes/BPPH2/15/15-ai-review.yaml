- term:
    id: GO:0009253
    label: peptidoglycan catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002196
  - InterPro:IPR034690
  - UniRule:UR000433564
  review:
    summary: >-
      Own-process metabolic term for a host-directed activity. The chemistry is right
      and the direction of the interaction is wrong: GO:0009253 describes an organism
      turning over its own peptidoglycan, and phi29 has none.
    action: MODIFY
    reason: >-
      Ancestry checked in QuickGO: GO:0009253 sits wholly inside the metabolic branch
      - peptidoglycan metabolic process, aminoglycan catabolic process, macromolecule
      catabolic process, all under GO:0009987 cellular process - with no interspecies
      parent anywhere above it. As written the row asserts that Bacillus phage phi29
      catabolises peptidoglycan of its own, which is false; gp15 hydrolyses the
      sacculus of its Bacillus subtilis host. GO has the matching host-directed term,
      GO:0052009 symbiont-mediated disruption of host cell wall, under GO:0098933
      symbiont-mediated disruption of host cell envelope and GO:0044419, so replacing
      the term keeps the substance and puts it on the right branch. This is the third
      instance of the shape the CACAO project found on PRD1 endolysin P15
      (GO:0044277, batch 1) and phage K LysK (GO:0009253 from InterPro2GO, batch 2),
      and the sharpest of the three, because here one of the two sources is HAMAP rule
      MF_04110 / UniRule UR000433564, whose name is ENDOLYSIN_T4 and whose scope is
      phage endolysins exclusively: every protein the rule fires on acts on another
      organism's wall, so the own-process term is wrong for all of them, not merely
      for a cross-species minority of a shared domain.
    proposed_replacement_terms:
    - id: GO:0052009
      label: symbiont-mediated disruption of host cell wall
    supported_by:
    - reference_id: file:BPPH2/15/15-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Endolysin with lysozyme activity that degrades host peptidoglycans and participates with the holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles.
    - reference_id: PMID:3469652
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        The purified product of gene 15 has a lysozyme activity similar to other phage-type lysozymes: products of phage T4 gene e and of phage P22 gene 19.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: REPOINT
      asserted_value: >-
        GO:0009253 peptidoglycan catabolic process, asserted by UniRule UR000433564
        (HAMAP MF_04110, ENDOLYSIN_T4)
      corrected_value: >-
        GO:0052009 symbiont-mediated disruption of host cell wall
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Queried live at rest.uniprot.org/unirule: rule UR000433564 is HAMAP MF_04110,
        named ENDOLYSIN_T4, and its GO set is GO:0003796 lysozyme activity, GO:0044659
        viral release from host cell by cytolysis and GO:0009253 peptidoglycan
        catabolic process. The first two are right. The third has no interspecies
        parent in GO and therefore asserts that the annotated organism degrades its
        own wall, which cannot be true of any protein in the rule's scope, since the
        rule exists to annotate phage endolysins. Unlike the InterPro2GO case reported
        from LysK, there is no taxon for which this rule's own-process term is correct,
        so the fix is a substitution rather than a taxon-aware mapping: replace
        GO:0009253 with GO:0052009 in MF_04110.
    - defect_type: WRONG_TERM
      resource: OTHER
      requested_change: REPOINT
      asserted_value: >-
        GO:0009253 peptidoglycan catabolic process, from InterPro:IPR002196 /
        IPR034690 (InterPro2GO)
      corrected_value: >-
        GO:0052009 symbiont-mediated disruption of host cell wall for the viral members
        of these signatures
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Resource is InterPro (InterPro2GO), for which the schema has no enum value, so
        OTHER is used. Queried live at the InterPro API: IPR002196 ("Glycoside
        hydrolase, family 24", a family entry) maps to GO:0003796, GO:0009253 and
        GO:0016998, and 1,570 of its 8,193 UniProt members are viral (taxonomy 10239).
        For a bacterial autolysin carrying this domain the own-process term is right;
        for the 1,570 viral members it inverts the direction of the interaction. Same
        defect as the one reported from LysK for IPR002502/IPR036505, on a different
        signature, and here on the family entry that specifically describes phage
        lysozymes. Suggest making the mapping taxon-aware, or adding GO:0052009 for the
        viral members.
