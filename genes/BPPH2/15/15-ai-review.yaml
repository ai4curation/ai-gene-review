id: P11187
gene_symbol: '15'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Endolysin (gp15, protein p15) of Bacillus phage phi29, a 258-residue glycoside
  hydrolase family 24 enzyme encoded by the second gene of the phage's two-gene
  lysis cassette. It is a lysozyme (muramidase, EC 3.2.1.17) that hydrolyses the
  beta-1,4 bond between N-acetylmuramic acid and N-acetyl-D-glucosamine in
  peptidoglycan, demonstrated on protein purified from an Escherichia coli
  expression clone and identified by N-terminal sequencing. Unusually for a
  phage-type lysozyme it carries two C-terminal LysM repeats appended to the
  catalytic domain, whose contribution to substrate binding has not been tested
  experimentally. Its role is in the terminal, lytic stage of infection: the
  product of the adjacent upstream gene 14 is the holin, which permeabilizes the
  Bacillus subtilis cytoplasmic membrane and lets the endolysin, otherwise
  confined to the host cytoplasm where it is made, reach the murein sacculus.
  Degradation of the sacculus ruptures the cell and releases progeny virions, so
  the enzyme's substrate is the host's cell wall rather than any structure of the
  phage's own. Loss of the holin, not of the endolysin, is what delays lysis in
  the classical phi29 suppressor-sensitive mutant collection.
