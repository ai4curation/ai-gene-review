- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0381
  review:
    summary: >-
      The only cellular-component row, from the curated subcellular-location keyword.
      Correct: the endolysin is synthesised in and retained in the host cytoplasm,
      and reaches the murein only once the holin has breached the membrane.
    action: ACCEPT
    reason: >-
      gp15 has no signal peptide and no transmembrane segment in the record, and the
      curated location note states that it is cytoplasmic and depends on the holin to
      reach the periplasmic space - which is precisely the holin-endolysin mechanism
      demonstrated for this pair in Escherichia coli, where protein 14 alone kills
      without lysing and lysis follows only when the phi29 lysozyme is co-expressed.
      Host cell cytoplasm is the right compartment for the protein even though it is
      not where the catalysis happens; GO has no host periplasmic space term (checked
      by QuickGO search), so the site of action cannot be annotated and is noted in
      suggested_questions instead. Kept as core rather than non-core because it is the
      compartment the enzyme occupies for the whole of its functional life until the
      moment of lysis.
    supported_by:
    - reference_id: file:BPPH2/15/15-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: >-
        The endolysin is cytoplasmic, but can reach the periplasmic space with the help of the holins which disrupt the host cell membrane.
