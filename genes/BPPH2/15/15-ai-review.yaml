- id: PMID:3469652
  title: Cloning and purification of a unique lysozyme produced by Bacillus phage
    phi 29.
  findings:
  - statement: >-
      Gene 15 was expressed in Escherichia coli, its 26 kDa product purified to near
      homogeneity and identified as gp15 by N-terminal sequencing, and the purified
      protein has lysozyme activity comparable to the T4 gene e and P22 gene 19
      lysozymes. This is a direct assay on purified protein, not a mutant phenotype.
    supporting_text: >-
      The purified product of gene 15 has a lysozyme activity similar to other phage-type lysozymes: products of phage T4 gene e and of phage P22 gene 19.
  - statement: >-
      phi29 lysozyme is structurally unusual among phage lysozymes, the distinctive
      feature being the two C-terminal LysM repeats appended to the GH24 catalytic
      domain.
    supporting_text: >-
      However, to our knowledge phi 29 lysozyme is structurally unique among the phage-type lysozymes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PNAS 1987;84:955-8, PMC304338); this is UniProt reference [5]
      for the entry's characterization, function and catalytic activity, and it is the
      paper the CACAO GO:0003796 row cites. Cached abstract-only and outside the PMC
      open-access subset, so the methods could not be read; the abstract alone is
      explicit that the work is on purified protein, which is why the row's IMP code is
      flagged.
- id: PMID:820555
  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: >-
      The survey identifies one cistron probably involved in final lysis of the
      infected bacteria, whose mutants lyse late under restrictive conditions while
      giving a normal or larger burst after artificial lysis. The abstract does not
      name the cistron, and the suppressor-sensitive mutant that exists in this region
      of the genome is sus14(1241), in the adjacent holin gene.
    supporting_text: >-
      A cistron, probably involved in the final lysis of the infected bacteria, has been found.
  - statement: >-
      The paper's reach is partial even among identified products, which is relevant to
      how confidently any one protein can be read out of it.
    supporting_text: >-
      The protein products of 10 out of the 17 cistrons detected in the genome of phage phi29 have been identified.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Eur J Biochem 1976;66:229-41). The identifier and title are
      right, but the paper is the wrong choice for this gene: its lysis result is a
      mutant phenotype, and the mutant in this region is in gene 14 (the holin), not
      gene 15. The same reference and term were also applied to gene 4 (P03682) by the
      same curator. Relevance LOW for gene 15 - it is background on the phi29 gene set
      rather than evidence about gp15, which was not characterised until 1987. Full
      text not available: not in PMC, cache is abstract-only.
- id: PMID:3027653
  title: 'Nucleotide sequence of Bacillus phage phi 29 genes 14 and 15: homology of
    gene 15 with other phage lysozymes.'
  findings:
  - statement: >-
      Genes 14 and 15 encode proteins of 15,014 and 28,022 Da; gp15 is a phage-type
      lysozyme related to the P22 and T4 enzymes.
    supporting_text: >-
      Gene product 15 (gp15) has considerable homology with Salmonella phage P22 lysozyme and lesser homology with Escherichia coli phage T4 lysozyme.
  - statement: >-
      The suppressor-sensitive mutant available in this part of the phi29 genome is a
      gene 14 mutant, which is what identifies gene 14 rather than gene 15 as the
      cistron behind the 1976 delayed-lysis phenotype.
    supporting_text: >-
      The g14 open reading frame (ORF) was confirmed by sequencing a sus14(1241) mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nucleic Acids Res 1986;14:10001-8); UniProt reference [1] for
      the entry's sequence. Used here for family placement and, critically, for the
      identity of the sus mutant in the lysis region. Cached abstract-only; PMC341351
      is a scan outside the open-access subset.
- id: PMID:8432697
  title: 'The missing link in phage lysis of gram-positive bacteria: gene 14 of Bacillus
    subtilis phage phi 29 encodes the functional homolog of lambda S protein.'
  findings:
  - statement: >-
      Gene 14's product is the one required for efficient lysis of Bacillus subtilis,
      and it is a holin: expressed alone in Escherichia coli it kills without lysing,
      while co-expression with the phi29 lysozyme or another murein hydrolase lyses the
      cells, showing that protein 14 makes a nonspecific lesion in the cytoplasmic
      membrane through which the endolysin passes.
    supporting_text: >-
      Production of protein 14 in E. coli resulted in cell death, whereas production of protein 14 concomitantly with the phi 29 lysozyme or unrelated murein-degrading enzymes led to lysis, suggesting that membrane-bound protein 14 induces a nonspecific lesion in the cytoplasmic membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Bacteriol 1993;175:1038-42, PMC193017). Fetched for this
      review. It is the functional demonstration of the holin-endolysin partnership
      that gp15's role depends on, and it is the clearest statement that the
      lysis-defective gene is 14. Cached abstract-only; PMC193017 is a scan outside the
      open-access subset.
- id: PMID:7831803
  title: Dual translational start motif evolutionarily conserved in the holin gene of
    Bacillus subtilis phage phi 29.
  findings:
  - statement: >-
      The division of labour in the phi29 lysis cassette is explicit: gene 14 encodes
      the holin, the downstream gene 15 the lysozyme.
    supporting_text: >-
      The 131-codon gene 14 of Bacillus subtilis phage phi 29 encodes the holin function, whereas the downstream gene 15 codes for a lysozyme.
  - statement: >-
      Holins exist to let phage murein hydrolases reach the periplasm, which is why the
      endolysin's own location is the host cytoplasm until the holin acts.
    supporting_text: >-
      Holins represent phage encoded lysis functions required for transit of the phage murein hydrolases to the periplasm.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Virology 1995;206:479-84). Fetched for this review. Not about
      gp15 itself, but it is the unambiguous statement of which of the two adjacent
      genes is the holin and which the lysozyme, which is what settles the
      adjacent-locus question on the PMID:820555 row. Cached abstract-only.
core_functions:
- description: >-
    Beta-1,4-N-acetylmuramidase (lysozyme) activity: hydrolysis of the glycosidic
    bond between N-acetylmuramic acid and N-acetyl-D-glucosamine in the
    peptidoglycan of the Bacillus subtilis host, carried out by a glycoside
    hydrolase family 24 catalytic domain with Glu15 as the proton donor/acceptor.
    Demonstrated on protein purified from an expression clone and identified by
    N-terminal sequencing. The enzyme is made in and retained in the host cytoplasm
    and acts on the sacculus only after the gene 14 holin has permeabilized the
    cytoplasmic membrane, so the single activity serves one end: destroying the host
    cell wall so that progeny virions are released. GO has no host periplasmic space
    component term, so the compartment in which the catalysis occurs is not
    expressible and `locations` is left unset rather than filled with the cytoplasmic
    location the enzyme occupies beforehand.
  molecular_function:
    id: GO:0003796
    label: lysozyme activity
  directly_involved_in:
  - id: GO:0044659
    label: viral release from host cell by cytolysis
  - id: GO:0052009
    label: symbiont-mediated disruption of host cell wall
  substrates:
  - id: CHEBI:8005
    label: peptidoglycan
  supported_by:
  - reference_id: PMID:3469652
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: >-
      The purified product of gene 15 has a lysozyme activity similar to other phage-type lysozymes: products of phage T4 gene e and of phage P22 gene 19.
  - reference_id: file:BPPH2/15/15-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: >-
      Hydrolysis of (1->4)-beta-linkages between N-acetylmuramic acid and N-acetyl-D-glucosamine residues in a peptidoglycan and between N-acetyl-D-glucosamine residues in chitodextrins.
  - reference_id: file:BPPH2/15/15-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: >-
      Endolysin with lysozyme activity that degrades host peptidoglycans and participates with the holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles.
  - reference_id: PMID:8432697
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: >-
      Production of protein 14 in E. coli resulted in cell death, whereas production of protein 14 concomitantly with the phi 29 lysozyme or unrelated murein-degrading enzymes led to lysis, suggesting that membrane-bound protein 14 induces a nonspecific lesion in the cytoplasmic membrane.
  knowledge_gaps:
  - gap_statement: >-
      What the two C-terminal LysM repeats of gp15 do is unknown. They are what makes
      this enzyme structurally unusual among phage lysozymes, and the UniProt DOMAIN
      line infers peptidoglycan binding from the domain family's general properties
      rather than from any measurement on this protein; no binding assay, truncation
      or point mutant has been reported for phi29 gp15.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether the LysM repeats are a substrate-targeting module that should
      carry a peptidoglycan-binding molecular function in its own right, and whether
      they are what adapts a GH24 catalytic domain to the thick Gram-positive sacculus
      of Bacillus subtilis.
    resolution: >-
      Assay purified full-length gp15 against CHAP-style truncations lacking one or
      both LysM repeats for binding to purified B. subtilis peptidoglycan and for
      muramidase kinetics and exogenous lytic activity.
  - gap_statement: >-
      How gp15 is catalytically active without the aspartate that is conserved across
      GH24 lysozymes is unresolved. The HAMAP caution records the absence, the purified
      enzyme is nonetheless a lysozyme, and no structure of gp15 or mutagenesis of its
      active site has been published.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Would show whether phi29 gp15 uses a variant catalytic mechanism or recruits a
      different residue to the aspartate's role, which bears on how far GH24 active-site
      conservation can be used to infer activity in other phage lysozymes.
    resolution: >-
      Determine the structure of gp15, or of its catalytic domain, and test candidate
      carboxylates by site-directed mutagenesis against the muramidase assay.
suggested_questions:
- question: >-
    Should the GO:0042742 defense response to bacterium mapping be dropped from
    UniProt keyword KW-0081 (Bacteriolytic enzyme) and left only on its parent KW-0929
    (Antimicrobial)? This is now the third phage endolysin on which the mapping
    inverts the direction of the interaction, and the narrow keyword means specifically
    a wall-lysing enzyme, for which host defence is never the right framing.
- question: >-
    Should HAMAP rule MF_04110 (ENDOLYSIN_T4, UniRule UR000433564) replace GO:0009253
    peptidoglycan catabolic process with GO:0052009 symbiont-mediated disruption of
    host cell wall? Every protein in the rule's scope is a phage endolysin acting on
    another organism's wall, so there is no taxon for which the own-process term is
    correct.
- question: >-
    Does GO need a host periplasmic space cellular-component term? The compartment in
    which a phage endolysin works cannot currently be annotated; the only available
    term, GO:0030430 host cell cytoplasm, names where the enzyme waits rather than
    where it acts.
- question: >-
    Do the two LysM repeats target gp15 to the Bacillus subtilis sacculus, and is that
    what the 1987 paper's observation of structural uniqueness among phage lysozymes
    amounts to functionally?
- question: >-
    Which residue substitutes for the missing conserved aspartate in the gp15 active
    site, and is the enzyme's specific activity on B. subtilis peptidoglycan lower than
    that of GH24 lysozymes retaining it?
suggested_experiments:
- description: >-
    Express gp15 and gp14 separately and together from controlled promoters in
    Bacillus subtilis, and follow culture turbidity, membrane potential and sacculus
    integrity, to confirm in the natural host the division of labour that was
    demonstrated heterologously in Escherichia coli.
  hypothesis: >-
    gp14 alone permeabilizes the membrane without lysis and gp15 alone is confined to
    the cytoplasm and inert, so lysis requires both, which would also settle directly
    that the delayed-lysis phenotype of the classical sus mutant collection maps to
    gene 14 and not gene 15.
- description: >-
    Purify full-length gp15 and LysM-truncated variants and measure peptidoglycan
    binding (pull-down and surface plasmon resonance on purified B. subtilis sacculi),
    muramidase kinetics on labelled peptidoglycan, and exogenous lytic activity on
    live and chloroform-treated B. subtilis.
  hypothesis: >-
    The LysM repeats raise the enzyme's effective affinity for the thick Gram-positive
    sacculus without contributing to catalysis, so their removal will reduce lytic
    activity on intact walls far more than it reduces activity on soluble substrate.
- description: >-
    Solve the structure of gp15 or its catalytic domain and mutate each candidate
    active-site carboxylate, assaying muramidase activity against the wild-type
    enzyme.
  hypothesis: >-
    A non-canonical carboxylate takes the role of the aspartate conserved in other GH24
    lysozymes, which is why the enzyme is active despite the absence HAMAP records.
