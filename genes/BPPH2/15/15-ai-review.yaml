  label: Bacillus phage phi29
description: >-
  Modular endolysin (lysozyme gp15) of Bacillus phage phi29 comprising an
  N-terminal GH24 muramidase catalytic domain and a C-terminal cell-wall-binding
  domain with two LysM repeats. Synthesized in the host cytoplasm during late
  infection, gp15 traverses the cytoplasmic membrane through pores formed by the
  gp14 holin and hydrolyzes beta-1,4-glycosidic linkages of the Bacillus subtilis
  peptidoglycan sacculus to cause host cell cytolysis and release of mature
  progeny virions.
