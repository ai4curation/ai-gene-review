  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: >-
      Identified gene 15 mutants as defective in final host bacterial lysis while
      producing normal intracellular phage progeny.
    supporting_text: >-
      A cistron, probably involved in the final lysis of the infected bacteria, has been found. Mutants in this gene give place, under restrictive conditions, to delayed lysis and produce, after artificial lysis, a burst size similar or higher than that obtained after wild-type phage infection.
- id: PMID:3469652
  title: Cloning and purification of a unique lysozyme produced by Bacillus phage
    phi 29.
  findings:
  - statement: >-
      Cloned, purified, and biochemically characterized the gene 15 product as a
      28-kDa phage-type lysozyme (muramidase).
    supporting_text: >-
      The purified product of gene 15 has a lysozyme activity similar to other phage-type lysozymes: products of phage T4 gene e and of phage P22 gene 19.
