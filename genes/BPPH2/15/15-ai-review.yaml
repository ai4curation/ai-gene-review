  title: UniProtKB entry for 15 (P11187)
  findings:
  - statement: >-
      gp15 is a cytoplasmic endolysin with an N-terminal lysozyme domain and two
      C-terminal LysM repeats that reaches the cell wall through holin pores to
      degrade host peptidoglycan and release viral progeny.
    supporting_text: >-
      -!- FUNCTION: Endolysin with lysozyme activity that degrades host peptidoglycans and participates with the holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles. Once the holin has permeabilized the host cell membrane, the endolysin can reach the periplasm and break down the peptidoglycan layer. {ECO:0000255|HAMAP-Rule:MF_04110, ECO:0000269|PubMed:3469652}.
suggested_questions:
- question: >-
    How do the two C-terminal LysM domains of gp15 recognize Bacillus subtilis
    peptidoglycan modifications (such as wall teichoic acid attachment or
    N-deacetylation) to target muramidase activity after holin pore formation?
suggested_experiments:
- description: >-
    Isothermal titration calorimetry and NMR titration of the isolated tandem
    LysM domain of gp15 with defined chito-oligosaccharides and Bacillus subtilis
    peptidoglycan fragments to determine binding stoichiometry and specificity.
