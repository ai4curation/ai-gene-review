- term:
    id: GO:0003796
    label: lysozyme activity
  evidence_type: IMP
  original_reference_id: PMID:3469652
  qualifier: enables
  review:
    summary: >-
      CACAO row (2012). Right gene, right paper, right term: PMID:3469652 cloned
      gene 15, purified its product, confirmed identity by N-terminal sequencing and
      measured lysozyme activity. The evidence code is the one thing wrong - the
      paper contains no mutant, so this is IDA, not IMP.
    action: ACCEPT
    reason: >-
      CACAO assignment, experimental, and what the paper shows for this gene is
      exactly this term. The whole paper is about the product of gene 15: a DNA
      fragment encoding the entire gene was expressed in Escherichia coli, the 26 kDa
      product purified, its identity established by N-terminal amino acid sequencing,
      and its lysozyme activity compared with two other phage lysozymes. Nothing here
      rests on a phenotype: there is no sus15 mutant in the phi29 collection, and the
      only suppressor-sensitive mutant in this part of the genome is sus14(1241) in
      the neighbouring holin gene (PMID:3027653). So the student chose the term and
      the paper correctly, and used an experimental code that misdescribes a
      purified-protein assay; the mismatch is recorded as a source defect rather than
      an action change, following the batch-2 treatment of the SWP7 and T5 D15 rows.
      The cached record is abstract-only (full_text_available: false) and no
      figure-level check was possible: PMC304338 is not in the open-access subset, and
      the GONUTS wiki page that would hold the student's reasoning now returns HTTP
      410 Gone with "GONUTS, the GO wiki, has been retired" (queried 2026-11-01), so
      the project's standing fallback for abstract-only CACAO rows is permanently
      unavailable. No REMOVE is entertained for an experimental row whose full text
      has not been read.
    supported_by:
    - reference_id: PMID:3469652
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        The overproduced protein has been purified to near homogeneity and confirmed to be the product of gene 15 by amino acid sequence analysis of its N terminus.
    - reference_id: PMID:3469652
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        The purified product of gene 15 has a lysozyme activity similar to other phage-type lysozymes: products of phage T4 gene e and of phage P22 gene 19.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: OTHER
      slot: Evidence
      requested_change: REPOINT
      asserted_value: IMP (ECO:0000315)
      corrected_value: IDA (ECO:0000314)
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        Assigned by CACAO (GONUTS community curation, 2012-11-16). PMID:3469652 is a
        cloning and purification paper: gene 15 was expressed in Escherichia coli from
        the lambda PL promoter, the product purified to near homogeneity, its identity
        confirmed by N-terminal sequencing, and lysozyme activity measured on the
        purified protein. There is no mutant phenotype in it, and no gene 15 mutant
        exists in the phi29 suppressor-sensitive collection, so IMP cannot be the right
        code; a direct assay on the purified gene product is IDA. PROBABLE rather than
        CONFIRMED because the cached record is abstract-only and PMC304338 is outside
        the open-access subset, so the methods could not be read; the abstract alone
        describes only purified-protein work. The term itself is correct and is not in
        question.
