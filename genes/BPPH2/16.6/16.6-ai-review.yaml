suggested_questions:
- question: What is the function of gp16.6 during early infection of Bacillus subtilis, and does it cooperate with the adjacent early replication proteins gp16.7 and gp17?
suggested_experiments:
- description: Construct a nonpolar in-frame deletion of gene 16.6 in phi29 to assay effects on viral DNA synthesis kinetics, burst size, and host physiology, complemented by pull-down mass spectrometry to identify interacting proteins.
