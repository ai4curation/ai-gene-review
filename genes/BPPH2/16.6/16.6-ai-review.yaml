description: Uncharacterized 54-amino-acid early protein (gp16.6) of Bacillus phage phi29 encoded in the right early C2 operon between genes 16.5 and 16.7. It belongs to the phi29likevirus gp16.6 family, and its molecular function and biological role during viral infection have not yet been experimentally determined.
