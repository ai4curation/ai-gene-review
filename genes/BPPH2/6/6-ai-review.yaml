- id: PMID:11384991
  title: Repression of bacteriophage phi 29 early promoter C2 by viral protein p6 is due to impairment of closed complex.
  findings:
  - statement: Protein p6 represses the early C2 promoter by binding along the promoter region and destabilizing the closed complex with Bacillus subtilis RNA polymerase.
    supporting_text: Protein p6 binds along the fragment including the sequence adjacent to the bound polymerase, altering the structure of the transcriptional complex and affecting specifically the stability of the closed complex.
- id: PMID:12426390
  title: The phi29 transcriptional regulator contacts the nucleoid protein p6 to organize a repression complex.
  findings:
  - statement: Proteins p6 and p4 bind cooperatively across a ~200 bp region between early promoter A2c and late promoter A3 to repress A2c and activate A3.
    supporting_text: Proteins p6 and p4 bind cooperatively to an approximately 200 bp DNA region located between the late A3 and the early A2c promoters, generating an extended nucleoprotein complex that helps to repress the early A2c promoter and to activate the late A3 promoter.
- id: PMID:15118076
  title: Genome wide, supercoiling-dependent in vivo binding of a viral protein involved in DNA replication and transcriptional control.
  findings:
  - statement: Protein p6 binds across the entire phi29 genome in vivo in a supercoiling-dependent manner with highest affinity for the terminal replication origins.
    supporting_text: By crosslinking, chromatin immunoprecipitation and real-time PCR we show that protein p6 binds to most, if not all, the viral genome in vivo, although with higher affinity for both DNA ends, which contain the replication origins.
- id: PMID:2111580
  title: A novel nucleoprotein complex at a replication origin.
  findings:
  - statement: Protein p6 wraps viral origin DNA into a right-handed toroidal superhelix with ~24 bp per repeat to stimulate protein-primed replication initiation.
    supporting_text: The viral protein p6, required for the protein-primed initiation of replication of Bacillus subtilis phage phi 29, forms a nucleoprotein complex at the viral replication origins that shows novel features.
- id: PMID:820555
  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: Mutants in gene 6 fail to synthesize viral DNA in infected Bacillus subtilis cells.
    supporting_text: Mutants in six genes do not synthesize phage DNA.
- id: file:BPPH2/6/6-uniprot.txt
  title: UniProtKB entry P03685 (NP_BPPH2)
  findings:
  - statement: Protein p6 is a histone-like nucleoprotein that wraps viral dsDNA into a right-handed toroidal conformation and compacts it about 4-fold.
    supporting_text: 'Histone-like nucleoprotein that binds to the viral dsDNA and responsible for wrapping and compacting the viral DNA about 4-fold. Forms a nucleoprotein complex in which the DNA adopts a right-handed toroidal conformation winding around a protein core.'
suggested_questions:
- question: What is the atomic-resolution architecture of the right-handed toroidal p6-dsDNA nucleoprotein filament, and how does early-protein p17 remodel this array at low multiplicity of infection?
- question: How is the extensive p6 nucleoprotein coat displaced ahead of the gp2 replication fork and the gp16 packaging motor?
suggested_experiments:
- description: Determine the cryo-EM structure of p6 oligomers bound to the right-end phi29 replication origin DNA fragment in the presence and absence of protein p17.
- description: Perform single-molecule magnetic tweezers unwinding and replication assays to measure how right-handed toroidal wrapping by p6 lowers the energy barrier for origin opening by the gp2-gp3 heterodimer.
