id: P13848
gene_symbol: '7'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: Transient internal prohead scaffolding protein gp7 that forms homodimers in the host cell cytoplasm and bridges the dodecameric portal protein gp10 and major capsid protein gp8 to nucleate and direct the fidelity of T=3, Q=5 prolate procapsid assembly. Approximately 147 to 180 copies of gp7 arrange as concentric internal shells within the nascent procapsid before exiting intact upon viral DNA genome packaging, leaving gp7 absent from the mature virion.
