  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: Non-specific DNA binding was observed crystallographically, which is peripheral to its primary structural scaffolding function during procapsid assembly.
    action: KEEP_AS_NON_CORE
    reason: UniProt notes that gp7 interacts non-specifically with DNA and may contact the entering genome during early stages of DNA packaging (PMID:12778115), but its core biological role is acting as a protein-protein chaperone and geometric template for procapsid shell assembly (PMID:17198713).
    supported_by:
    - reference_id: file:BPPH2/7/7-uniprot.txt
      supporting_text: '-!- SUBUNIT: Homodimer. Interacts non-specifically with DNA; probably binds DNA in the early stages of DNA packaging.'
- term:
    id: GO:0019068
    label: virion assembly
  evidence_type: IDA
  original_reference_id: PMID:17198713
  qualifier: involved_in
  review:
    summary: gp7 specifically directs assembly of the prolate procapsid shell rather than the entire virion, warranting refinement to viral capsid assembly (GO:0019069).
    action: MODIFY
    reason: PMID:17198713 demonstrates in a purified in vitro system that dimeric gp7 co-assembles with monomeric major capsid protein gp8 and portal protein gp10 to nucleate and determine the T=3, Q=5 geometry of the procapsid. Refining GO:0019068 (virion assembly) to its child term GO:0019069 (viral capsid assembly) captures the precise morphogenetic step mediated by gp7.
    proposed_replacement_terms:
    - id: GO:0019069
      label: viral capsid assembly
    supported_by:
    - reference_id: PMID:17198713
      supporting_text: The crowding agent polyethylene glycol can induce bacteriophage ø29 monomeric capsid protein and dimeric scaffolding protein to co-assemble to form particles which have the same geometry as either prolate T=3 Q=5 procapsids formed in vivo or previously observed isometric particles. The formation of particles is a scaffolding-dependent reaction.
    - reference_id: file:BPPH2/7/7-uniprot.txt
      supporting_text: '-!- FUNCTION: Scaffolding protein involved in the icosahedric procapsid assembly. Coassembles with the capsid proteins to form the procapsid. The scaffolding protein is found within the capsid as a serie of concentric shells. During DNA packaging, the scaffolding protein molecules are released from the procapsid.'
