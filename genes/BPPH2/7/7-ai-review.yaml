- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:17198713
  title: Molecular dissection of ø29 scaffolding protein function in an in vitro assembly system.
  findings:
  - statement: Dimeric scaffolding protein gp7 co-assembles with monomeric major capsid protein gp8 in vitro and requires both its N-terminal helix-loop-helix domain and C-terminal acidic tail to direct prolate T=3, Q=5 procapsid formation.
    supporting_text: The crowding agent polyethylene glycol can induce bacteriophage ø29 monomeric capsid protein and dimeric scaffolding protein to co-assemble to form particles which have the same geometry as either prolate T=3 Q=5 procapsids formed in vivo or previously observed isometric particles. The formation of particles is a scaffolding-dependent reaction.
  - statement: The scaffolding protein gp7 exits intact from the procapsid during viral DNA packaging.
    supporting_text: The ø29 scaffolding protein exits intact from the procapsid during DNA packaging 25 .
- id: file:BPPH2/7/7-uniprot.txt
  title: UniProtKB entry for 7 (P13848)
  findings:
  - statement: gp7 is a homodimeric scaffolding protein present in about 147 copies as concentric shells within the prohead that co-assembles with capsid proteins and is released during DNA packaging.
    supporting_text: '-!- FUNCTION: Scaffolding protein involved in the icosahedric procapsid assembly. Coassembles with the capsid proteins to form the procapsid. The scaffolding protein is found within the capsid as a serie of concentric shells. During DNA packaging, the scaffolding protein molecules are released from the procapsid.'
  - statement: gp7 forms a homodimer and interacts non-specifically with DNA inside the prohead.
    supporting_text: '-!- SUBUNIT: Homodimer. Interacts non-specifically with DNA; probably binds DNA in the early stages of DNA packaging.'
suggested_questions:
- question: Through which structural channels in the procapsid shell or portal vertex do intact gp7 homodimers exit during the early stages of ATP-driven DNA packaging?
  experts:
  - Shelley Grimes
  - Dwight L. Anderson
  - Michael G. Rossmann
suggested_experiments:
- description: Perform time-resolved cryo-electron microscopy of stalled phi29 DNA packaging intermediates containing cross-linked or fluorescently labeled gp7 dimers.
  hypothesis: Intact gp7 dimers exit through transient pores at the quasi-3-fold or hexamer-pentamer interfaces of the gp8 capsid shell as internal DNA pressure builds.
  experiment_type: Cryo-electron microscopy (cryo-EM)
