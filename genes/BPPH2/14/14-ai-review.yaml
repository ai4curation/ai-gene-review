  title: UniProtKB entry for 14 (P11188)
  findings:
  - statement: >-
      Describes the dual-start holin (129 aa) and antiholin (131 aa) isoforms of
      gp14 and their opposing roles in cytoplasmic membrane pore formation.
    supporting_text: >-
      -!- FUNCTION: [Isoform Holin]: Accumulates harmlessly in the cytoplasmic membrane until it reaches a critical concentration that triggers the formation of micron-scale pores (holes) causing host cell membrane disruption and endolysin escape into the periplasmic space (Probable).
suggested_questions:
- question: >-
    How is the translational ratio between the Met-1 antiholin (gp14-131) and
    Met-3 holin (gp14-129) isoforms modulated by the secondary structure of the
    late mRNA in Bacillus subtilis?
suggested_experiments:
- description: >-
    Site-directed mutagenesis of Met-1 and Met-3 codons in an inducible Bacillus
    subtilis expression system combined with membrane depolarization and GFP-gp15
    release assays to quantify the lysis timing control exerted by the antiholin
    isoform in the native Gram-positive host.
