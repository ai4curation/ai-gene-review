core_functions:
- description: >-
    Pore-forming holin activity in the host cell plasma membrane that creates
    nonspecific membrane lesions at the end of the lytic cycle, enabling the
    cytoplasmic gp15 endolysin to access the peptidoglycan layer and trigger
    viral release by host cell cytolysis.
  supported_by:
  - reference_id: PMID:8432697
    supporting_text: >-
      Production of protein 14 in E. coli resulted in cell death, whereas production of protein 14 concomitantly with the phi 29 lysozyme or unrelated murein-degrading enzymes led to lysis, suggesting that membrane-bound protein 14 induces a nonspecific lesion in the cytoplasmic membrane.
