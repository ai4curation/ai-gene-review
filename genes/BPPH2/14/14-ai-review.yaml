id: P11188
gene_symbol: '14'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Dual-start holin/antiholin membrane protein (gp14) of Bacillus phage phi29
  containing three transmembrane helices that integrates into the host cytoplasmic
  membrane during late infection. Translation from Met-3 yields the 129-residue
  holin isoform, which oligomerizes at a programmed concentration to form
  micron-scale lesions in the host plasma membrane, collapsing the proton-motive
  force and allowing the cytoplasmic gp15 endolysin to access the peptidoglycan
  layer for host cell cytolysis and progeny virion release; translation from
  Met-1 yields the 131-residue antiholin isoform that inhibits premature pore
  assembly.
alternative_products:
- id: P11188-1
  name: Antiholin
  sequence_note: VSP_058249
  description: >-
    Full-length 131-amino-acid isoform initiated at Met-1 (containing Lys-2) that
    counteracts oligomerization of the active holin isoform and delays membrane
    pore formation.
- id: P11188-2
  name: Holin
  sequence_note: VSP_058249
  description: >-
    129-amino-acid isoform initiated at Met-3 that accumulates in the host
    cytoplasmic membrane and forms nonspecific membrane pores at a critical
    concentration to trigger endolysin release and host cell lysis.
