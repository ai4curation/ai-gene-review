id: P11188
gene_symbol: '14'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Dual-start holin/antiholin membrane protein (gp14) of Bacillus phage phi29
  containing three transmembrane helices that integrates into the host cytoplasmic
  membrane during late infection. Translation from Met-3 yields the 129-residue
  holin isoform, which oligomerizes at a programmed concentration to form
  micron-scale lesions in the host plasma membrane, collapsing the proton-motive
  force and allowing the cytoplasmic gp15 endolysin to access the peptidoglycan
  layer for host cell cytolysis and progeny virion release; translation from
  Met-1 yields the 131-residue antiholin isoform that inhibits premature pore
  assembly.
alternative_products:
- id: P11188-1
  name: Antiholin
  description: >-
    Full-length 131-amino-acid isoform initiated at Met-1 (containing Lys-2) that
    counteracts oligomerization of the active holin isoform and delays membrane
    pore formation.
- id: P11188-2
  name: Holin
  sequence_note: VSP_058249
  description: >-
    129-amino-acid isoform initiated at Met-3 that accumulates in the host
    cytoplasmic membrane and forms nonspecific membrane pores at a critical
    concentration to trigger endolysin release and host cell lysis.
functional_isoforms:
- id: P11188-2
  name: Holin (14-129)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P11188-2
  description: >-
    Active 129-amino-acid pore-forming holin isoform produced by alternative
    translational initiation at Met-3 (lacking residues 1-2, MK; VSP_058249).
    Oligomerizes in the host cytoplasmic membrane at a programmed critical
    concentration to form micron-scale lesions (`GO:0140911`) that release the
    gp15 endolysin and trigger host cell cytolysis (`GO:0044659`).
  isoform_specific_terms:
  - id: GO:0140911
    label: pore-forming activity
  - id: GO:0044659
    label: viral release from host cell by cytolysis
- id: P11188-1
  name: Antiholin (14-131)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P11188-1
  description: >-
    Full-length 131-amino-acid antiholin isoform produced by translational
    initiation at Met-1. The extra N-terminal positively charged Lys-2 residue
    retards membrane topology maturation and enables heterooligomerization with
    the 129-aa holin isoform, inhibiting premature pore formation and controlling
    lysis timing.
