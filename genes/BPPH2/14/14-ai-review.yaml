- id: PMID:8432697
  title: 'The missing link in phage lysis of gram-positive bacteria: gene 14 of Bacillus
    subtilis phage phi 29 encodes the functional homolog of lambda S protein.'
  findings:
  - statement: >-
      Demonstrated that gene 14 encodes a dual-start membrane holin whose
      production creates nonspecific lesions in the cytoplasmic membrane and
      triggers cell lysis when co-expressed with phi29 lysozyme (gp15) or
      unrelated phage endolysins.
    supporting_text: >-
      Production of protein 14 in E. coli resulted in cell death, whereas production of protein 14 concomitantly with the phi 29 lysozyme or unrelated murein-degrading enzymes led to lysis, suggesting that membrane-bound protein 14 induces a nonspecific lesion in the cytoplasmic membrane.
- id: file:BPPH2/14/14-uniprot.txt
  title: UniProtKB entry for 14 (P11188)
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      UniProt CC DOMAIN states that 'Isoform Holin has 3 transmembrane regions
      whereas isoform Antiholin lacks the first transmembrane region' (propagated
      by similarity from lambda S, P03705) and FT TOPO_DOM annotates residues
      1..52 of Antiholin as cytoplasmic. However, P11188-1 (Antiholin, 131 aa) is
      the full-length sequence and P11188-2 (Holin, 129 aa) lacks only residues
      1..2 (MK, VSP_058249); in dual-start holins, the extra positively charged
      Lys-2 in the antiholin inhibits translocation of the N-terminal
      transmembrane helix across the energized membrane rather than deleting the
      sequence of TM1.
  findings:
  - statement: >-
      Describes the dual-start holin (129 aa) and antiholin (131 aa) isoforms of
      gp14 and their opposing roles in cytoplasmic membrane pore formation.
    supporting_text: >-
      -!- FUNCTION: [Isoform Holin]: Accumulates harmlessly in the cytoplasmic membrane until it reaches a critical concentration that triggers the formation of micron-scale pores (holes) causing host cell membrane disruption and endolysin escape into the periplasmic space (Probable).
suggested_questions:
- question: >-
    How is the translational ratio between the Met-1 antiholin (gp14-131) and
    Met-3 holin (gp14-129) isoforms modulated by the secondary structure of the
    late mRNA in Bacillus subtilis?
- question: >-
    Should FunctionalIsoformTypeEnum in the gene_review schema be extended with an
    ALTERNATIVE_INITIATION value so prokaryotic dual-start holin/antiholin pairs
    do not need to use SPLICE_VARIANT as a proxy?
suggested_experiments:
- description: >-
    Site-directed mutagenesis of Met-1 and Met-3 codons in an inducible Bacillus
    subtilis expression system combined with membrane depolarization and GFP-gp15
    release assays to quantify the lysis timing control exerted by the antiholin
    isoform in the native Gram-positive host.
