core_functions:
- description: >-
    Pore-forming holin activity in the host cell plasma membrane that creates
    nonspecific membrane lesions at the end of the lytic cycle, enabling the
    cytoplasmic gp15 endolysin to access the peptidoglycan layer and trigger
    viral release by host cell cytolysis.
  supported_by:
  - reference_id: PMID:8432697
