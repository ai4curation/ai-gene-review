  label: Bacillus phage phi29
description: Uncharacterized 66-amino-acid early open reading frame product (gp5.5) of Bacillus phage phi29 encoded in the left early operon between the replication genes 5 (SSB) and 6 (nucleoprotein). It belongs to the phi29likevirus GP5.5 family, and its molecular function and role in the phage infection cycle have not yet been experimentally determined.
