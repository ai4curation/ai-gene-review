suggested_questions:
- question: Is gp5.5 translated at detectable levels during Bacillus subtilis infection, and does its deletion affect phi29 replication fitness under nutrient-limiting or sporulation-inducing conditions?
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and targeted mass spectrometry of phi29-infected Bacillus subtilis to verify in vivo translation of gp5.5, followed by CRISPR-Cas9-assisted clean deletion of gene 5.5 to assay plaque size and burst size across host growth conditions.
