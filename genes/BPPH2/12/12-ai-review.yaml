suggested_questions:
- question: How is the processive degradation of poly(glycerol phosphate) teichoic acids by the 12 gp12* appendages coordinated
    with rotational or ratcheting movement of the virion toward the peptidoglycan layer?
suggested_experiments:
- description: Use single-particle fluorescence microscopy and cryo-electron tomography of phi29 virions adsorbing to native
    Bacillus subtilis sacculi to track gp12* conformational states and teichoic acid hydrolysis kinetics during cell wall
    traversal.
