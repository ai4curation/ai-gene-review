  label: Bacillus phage phi29
description: DNA packaging motor ATPase and DNA translocase gp16 that transiently assembles onto the prohead RNA (pRNA) ring at the procapsid portal vertex in the host cell cytoplasm to pump unit-length gp3-linked viral dsDNA into the prohead. It comprises an N-terminal P-loop NTPase domain with canonical Walker A, Walker B, and arginine-finger motifs that hydrolyzes approximately one ATP molecule per two base pairs packaged, and a C-terminal non-catalytic DNA-binding domain that contacts both the viral genome and the CCA bulge of the pRNA A-helix before dissociating upon packaging completion.
