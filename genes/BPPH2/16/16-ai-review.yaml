- id: PMID:18674782
  title: DNA packaging motor assembly intermediate of bacteriophage phi29.
  findings:
  - statement: Multiple copies of gp16 bind to the prohead in a pRNA-dependent manner to form an active packaging motor intermediate.
    supporting_text: The binding of multiple copies of gp16 to the prohead was dependent on the presence of an oligomer of 174- or 120-base prohead RNA (pRNA) fixed to the head-tail connector at the unique portal vertex of the prohead.
  - statement: gp16 binds specifically to the A-helix of pRNA and protects the CC residues of the CCA bulge (residues 18-20) in ribonuclease footprinting assays.
    supporting_text: The use of mutant pRNAs demonstrated that gp16 bound specifically to the A-helix of pRNA, and ribonuclease footprinting of gp16 on pRNA showed that gp16 protected the CC residues of the CCA bulge (residues 18-20) of the A-helix.
- id: PMID:23706809
  title: The ATPase of the phi29 DNA packaging motor is a member of the hexameric AAA+ superfamily.
  findings:
  - statement: Mutagenesis of Walker A (G27D) and Walker B motifs demonstrates that the Walker A motif is required for ATP binding and the Walker B motif is required for ATP hydrolysis by gp16.
    supporting_text: Only the wildtype ATPase hydrolyzed ATP (Fig. 4A); the Walker A G27D mutant is incapable of binding ATP while the Walker B mutant can bind, but cannot hydrolyze.
- id: file:BPPH2/16/16-uniprot.txt
  title: UniProtKB entry for 16 (P11014)
  findings:
  - statement: gp16 is the packaging motor ATPase that binds pRNA and dsDNA-gp3 and hydrolyzes approximately 1 ATP per 2 bp of viral DNA packaged into the prohead.
    supporting_text: '-!- FUNCTION: ATPase required for the genome encapsidation reaction (PubMed:3879485). Part of the active packaging motor via the binding to the packaging RNA (pRNA), itself fixed to the head-tail connector at the unique portal vertex of the prohead (PubMed:11130079, PubMed:18674782). Binds and supercoils the pre-formed, unit-length DNA bound to gp3 to produce an initiation complex for DNA packaging (PubMed:2960820). Provides the energy to actively pump the viral DNA into the prohead. Approximately one molecule of ATP is used in the packaging of 2 bp of viral DNA (PubMed:2960820).'
  - statement: The N-terminal domain of gp16 catalyzes ATP hydrolysis and the C-terminal domain binds DNA and pRNA while lacking endonuclease activity.
    supporting_text: '-!- DOMAIN: The N-terminus contains the ATPase activity and the C-terminus (CTD) binds DNA (PubMed:33089330). The CTD is likely a vestigial nuclease that has lost its hydrolytic capability since Phi-29 is not a concatamer that neads cleavage (PubMed:33089330).'
suggested_questions:
- question: How does the pentameric gp16 ATPase ring coordinate sequential four-step bursts of 10-bp DNA translocation and 1-subunit regulatory dwell states across the 5-fold/12-fold symmetry mismatch with the gp10 portal?
  experts:
  - Marc C. Morais
  - Carlos Bustamante
  - Peixuan Guo
suggested_experiments:
- description: Perform single-molecule optical tweezers packaging measurements combined with cryo-EM of phi29 proheads reconstituted with heteromeric gp16 rings containing a single catalytically inactive Walker B subunit.
  hypothesis: A single inactive subunit stalls the coordinated sequential hydrolysis wave at the dwell-to-burst transition, revealing the structural register of the DNA-contacting loops in the special fifth subunit.
  experiment_type: Single-molecule optical tweezers and cryo-EM
