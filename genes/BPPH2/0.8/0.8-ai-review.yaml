  label: Bacillus phage phi29
description: Early homodimeric acidic protein p56 (gene 0.8 product) of Bacillus phage phi29 that inhibits host Bacillus subtilis uracil-DNA glycosylase (UDG). By acting as a DNA mimic that occupies the DNA-binding cleft of host UDG and displaces UDG from uracil-containing DNA, p56 prevents host base excision repair from introducing abasic sites and strand nicks into replicating viral DNA templates.
