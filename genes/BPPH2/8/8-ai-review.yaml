suggested_questions:
- question: How do conformational changes at the junction between the N-terminal HK97-like domain and C-terminal BIG2 domain of gp8 accommodate the quasi-equivalent curvature differences between the hemispherical end caps and the cylindrical equatorial belt?
  experts:
  - Marc C. Morais
  - Jardcne Tao
  - Michael G. Rossmann
suggested_experiments:
- description: Mutate hinge residues linking the N-terminal HK97-like domain and C-terminal BIG2 domain of gp8 and analyze the resulting capsid geometry distribution (prolate T=3, Q=5 versus isometric T=3 or T=4) by cryo-EM.
  hypothesis: The inter-domain hinge between the HK97-like core and the BIG2 domain controls hexamer skewing and stabilizes the transition between the cylindrical equatorial region and the icosahedral end caps.
  experiment_type: Site-directed mutagenesis and cryo-EM reconstruction
