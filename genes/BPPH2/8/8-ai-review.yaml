- id: PMID:11562162
  title: Composition and mass of the bacteriophage phi29 prohead and virion.
  findings:
  - statement: Quantitative SDS-PAGE and scanning transmission electron microscopy confirm approximately 235 copies of major capsid protein gp8 per prolate prohead and mature virion.
    supporting_text: The mean numbers of copies of the major capsid protein in the prohead and virion were 241 and 218, respectively, approaching the 235 copies determined previously by cryoelectron microscopy.
- id: PMID:17098197
  title: Determinants of bacteriophage phi29 head morphology.
  findings:
  - statement: Cryo-EM reconstructions show that the prolate T=3, Q=5 phi29 capsid is built from gp8 pentamers and hexamers whose geometry is directed by the scaffolding and connector proteins.
    supporting_text: The prolate prohead, as well as the two isometric capsids with T = 3 and T = 4 symmetry, are composed of similar pentamers and differently skewed hexamers.
- id: PMID:22225806
  title: Role of channel lysines and the "push through a one-way valve" mechanism of the viral DNA packaging motor.
  findings:
  - statement: gp8 is one of the four structural proteins constituting the phi29 procapsid prior to DNA packaging.
    supporting_text: 'The φ 29 nanomotor packages its genomic DNA into a procapsid consisting of four proteins: gp7 (the scaffold protein), gp8 (the capsid protein), gp8.5 (the fiber protein), and gp10 (the connector) ( 28 , 29 ).'
