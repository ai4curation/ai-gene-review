  label: Bacillus phage phi29
description: Major capsid protein gp8 that polymerizes into 11 pentamers and 30 hexamers (235 subunits in total) to form the prolate T=3, Q=5 icosahedral capsid shell of Bacillus phage phi29, enclosing the packaged dsDNA genome. Each monomer comprises an N-terminal HK97-like shell domain that forms the contiguous capsid wall and a C-terminal immunoglobulin-like BIG2 protrusion domain that stabilizes inter-capsomer contacts and anchors the gp8.5 head fibers at quasi-3-fold axes.
