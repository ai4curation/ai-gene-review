description: Uncharacterized 37-amino-acid small protein (gp16.5) of Bacillus phage phi29 encoded in the right early C2 operon adjacent to genes 16.6, 16.7, and 17. It belongs to the phi29likevirus gp16.5 family, and its molecular function, cellular localization, and role in phage infection remain experimentally uncharacterized.
