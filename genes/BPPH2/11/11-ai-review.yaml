suggested_questions:
- question: How does binding of the gp11 dodecamer to the gp10 connector after completion of DNA packaging displace the pRNA-gp16
    packaging motor and lock the packaged genome inside the capsid prior to gp9 knob attachment?
suggested_experiments:
- description: Perform time-resolved cryo-EM single-particle analysis of DNA-filled heads incubated sequentially with purified
    gp11 and gp9 to resolve conformational transitions at the gp10-gp11 interface that gate DNA retention and release.
