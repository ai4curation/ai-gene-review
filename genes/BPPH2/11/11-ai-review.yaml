  label: Bacillus phage phi29
description: Proximal tail tube protein (lower collar protein gp11) of Bacillus phage phi29 that assembles as a dodecameric
  ring immediately distal to the gp10 head-tail connector after viral DNA packaging. It forms the proximal section of the
  axial tail tube conduit for dsDNA genome ejection into the Bacillus subtilis host cell and provides the radial attachment
  scaffold for the twelve gp12* neck appendages.
