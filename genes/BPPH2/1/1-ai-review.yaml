      single substitutions there abolish sheet formation.
    action: NEW
    reason: >-
      GOA records what p1 is involved in and where it sits but gives it no molecular
      function other than RNA binding, which is not the activity through which it supports
      replication. GO:0005198 structural molecule activity is the term for a molecule that
      contributes to the structural integrity of an assembly, which is precisely what the
      direct evidence shows: self-association into ordered polymers whose formation depends
      on identified residues, with loss of assembly and loss of replication support tracking
      together. The term is proposed rather than a more specific child because GO has no
      structural-constituent term for a viral replication platform, and rather than left
      implicit because the molecular-function slot is where this review's core function has
      to be expressed. It is not a duplicate of any existing row, being in a different aspect
      from the process and component rows and not an ancestor or descendant of GO:0003723.
