id: P03679
gene_symbol: '1'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: Early membrane-associated replication scaffold protein (gp1, p1) of Bacillus phage phi29 that self-assembles via its C-terminal domain into two-dimensional protofilament sheet structures attached to the host bacterial membrane. Through its N-terminal region, p1 interacts with the viral primer terminal protein gp3 to compartmentalize and anchor the viral replisome at the host membrane during protein-primed viral DNA replication.
alternative_products:
- name: Long (10 kDa)
  id: P03679-1
  description: Full-length 85-residue mature protein (residues 2-86 after initiator methionine removal) containing both the N-terminal primer terminal protein (gp3)-binding region and the C-terminal coiled-coil/hydrophobic protofilament assembly and membrane-association domain.
- name: Short (6 kDa, Protein delta-1)
  id: P03679-2
  sequence_note: VSP_018684
  description: Shorter 52-residue isoform produced by internal translational initiation (missing residues 1-34) that retains the C-terminal coiled-coil protofilament sheet assembly and membrane-association region but lacks the N-terminal terminal-protein-binding region.
