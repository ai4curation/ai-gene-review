- id: file:BPPH2/1/1-uniprot.txt
  title: UniProtKB entry P03679 (GP1_BPPH2), DNA replication protein 1, Bacillus phage phi29
  findings:
  - statement: >-
      The curated FUNCTION statement describes p1 as assembling into highly ordered
