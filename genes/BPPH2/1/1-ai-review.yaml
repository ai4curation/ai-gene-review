      the hydrophobic C-terminus is the determinant of host-membrane association.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Host membrane'
  - statement: >-
      The entry records two products of the same open reading frame by alternative
      initiation, a 10 kDa Long form and a 6 kDa Short form (delta-1) missing residues 1-34.
    record_section: ["CC:ALTERNATIVE PRODUCTS"]
    supporting_text: Event=Alternative initiation; Named isoforms=2;
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The curated FUNCTION, SUBCELLULAR LOCATION, DOMAIN and ALTERNATIVE PRODUCTS blocks are
      cited, all of which carry ECO:0000269 experimental evidence or explicit publication
      references. No protein name, keyword, EC number or DR GO line is used as support.
suggested_questions:
- question: >-
    Does the p1 sheet contribute anything to initiation beyond concentrating the terminal
    protein and DNA polymerase at the membrane - for example activating the heterodimer or
    juxtaposing the two genome ends - or is proximity the whole mechanism? The distinction
    decides whether a scaffolding molecular function is the right description or whether a
    regulatory activity should also be annotated.
  experts:
  - Daniel Munoz-Espin
- question: >-
    Has the mRNA-binding and translational-repression activity of gp1 been reproduced
    outside the laboratory that reported it, and is it a property of the full-length 10 kDa
    form, the 6 kDa delta-1 form, or both? The RNA-binding keyword on P03679, and the GOA
    row derived from it, rest on two papers from one group.
- question: >-
    GO has no host-scoped component term for the bacterial division site or the host FtsZ
    ring, which is where p1 actually concentrates, nor for the cytoplasmic face of the host
    plasma membrane. Should such terms exist under GO:0033643 host cell part, or is
    GO:0033644 host cell membrane the intended stopping point for phage proteins of this
    kind?
- question: >-
    Is the 6 kDa delta-1 form a distinct functional product or a translation artefact? It
    lacks the N-terminal 34 residues, and therefore the region shown to bind the primer
    terminal protein, while retaining the coiled coil and the membrane-anchoring
    C-terminus, so it is predicted to polymerise and sit on the membrane without recruiting
    the replisome - a dominant-negative architecture that has never been tested as such.
suggested_experiments:
- hypothesis: >-
    The 6 kDa delta-1 product of gene 1 assembles into membrane-associated sheets but cannot
    recruit the primer terminal protein, and so acts as a dominant-negative regulator of
    phi29 replication rather than as a redundant copy of p1.
  description: >-
    Express the 10 kDa and 6 kDa forms separately and together from plasmids in Bacillus
    subtilis, measure sheet formation by negative-stain electron microscopy and
    sedimentation and membrane association by fractionation, assay terminal-protein binding
    by cross-linking, and score complementation of a sus1 phage and inhibition of wild-type
    phage DNA synthesis. An internal-initiation-dead variant that preserves the p1 coding
    sequence would separate the two products genetically.
  experiment_type: structure-function and complementation analysis
- hypothesis: >-
    gp1 represses translation of the phi29 dna operon by binding its mRNA, and this is a
    genuine second function of the protein rather than an artefact of the overexpression
    systems used in the original reports.
  description: >-
    Repeat the repression independently with modern methods: ribosome profiling of
    phi29-infected Bacillus subtilis comparing wild-type with sus1 infection at equal mRNA
    levels, CLIP or RIP-seq from infected cells to locate the gp1 binding site on the
    polycistronic transcript, and in vitro translation of the dna-operon mRNA with purified
    gp1 titrated against the assembly-deficient coiled-coil substitutions. Separating
    transcript level from ribosome occupancy is the key control the original agarose-gel and
    S1-protection assays could only approximate.
  experiment_type: ribosome profiling, RNA-protein crosslinking and in vitro translation
- hypothesis: >-
    Association with the host FtsZ ring times phi29 replication to the host division cycle,
    so that uncoupling p1 from FtsZ delays or desynchronises genome replication without
    abolishing it.
  description: >-
    Isolate or design p1 variants that still polymerise and bind membranes but no longer
    co-localise with FtsZ, then follow replication in single cells by time-lapse imaging of
    a labelled phage genome alongside FtsZ-ring assembly, in wild-type cells and in cells
    where division is blocked at defined steps. Pairing this with quantitative measurement
    of phi29 DNA accumulation would show whether the FtsZ association sets the timing, the
    site, or only the efficiency of replication.
  experiment_type: live-cell imaging with separation-of-function mutants
