taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Protein p1 (gp1) is an 86-residue early protein of Bacillus phage phi29 that builds the
  membrane platform on which the phage replicates its genome. It carries a predicted
  coiled coil (residues 38-67) and a hydrophobic C-terminus, and it self-polymerises into
  long protofilaments that pack side by side into two-dimensional sheets resembling
  tubulin and bacterial FtsZ polymers; the coiled-coil residues Leu-46, Met-53 and Leu-60
  are each required for sheet formation. The hydrophobic C-terminus attaches these
  polymers peripherally to the inner face of the Bacillus subtilis membrane - p1 has no
  transmembrane segment and behaves as an amphiphilic peripheral membrane protein - and
  the multimers assemble in infected cells whether or not viral DNA synthesis is running.
  Through its N-terminal 42 residues p1 binds the free primer terminal protein, so the
  terminal protein/DNA polymerase heterodimer that initiates protein-primed replication is
  recruited to the p1 sheet, giving a membrane-associated multiprotein initiation complex;
  p1 also concentrates at midcell by associating with the host cell-division protein FtsZ.
  Loss of p1 severely impairs phage DNA synthesis in vivo, more strongly at 37 degrees C
  than at 30 degrees C, while an excess of p1 inhibits replication in a dosage-dependent
  way, as expected of a stoichiometric scaffold. Two products arise from the same open
  reading frame by alternative in-phase initiation: a 10 kDa form and a 6 kDa form
  (delta-1) that lacks the first 34 residues and therefore the terminal-protein-binding
  region. A separate activity reported by one laboratory is binding to the polycistronic
  mRNA of the phi29 dna operon, through which p1 represses translation of the DNA
  polymerase and terminal protein genes, coupling the scaffold's accumulation to the
  supply of the replication proteins it organises.
