- id: PMID:11032825
  title: 'Compartmentalization of phage phi29 DNA replication: interaction between the primer terminal protein and the membrane-associated protein p1.'
  findings:
  - statement: Protein p1 is membrane-associated in infected Bacillus subtilis cells, self-assembles via its C-terminal 52 amino acids into protofilament sheets, and binds terminal protein p3 via its N-terminal domain.
    supporting_text: The bacteriophage phi29 replication protein p1 (85 amino acids) is membrane associated in Bacillus subtilis-infected cells. The C-terminal 52 amino acid residues of p1 are sufficient for assembly into protofilament sheet structures.
- id: PMID:12904294
  title: In vivo assembly of phage phi 29 replication protein p1 into membrane-associated multimeric structures.
  findings:
  - statement: Protein p1 assembles into membrane-associated multimeric structures in vivo and functions in a dose-dependent manner to support phage DNA synthesis.
    supporting_text: By combining in vivo chemical cross-linking and cell fractionation techniques, we also demonstrate that p1 assembles in infected cells into multimeric structures that are associated with the bacterial membrane.
- id: PMID:820555
  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: Mutants in gene 1 show impaired phage DNA synthesis in vivo.
    supporting_text: Mutants in six genes do not synthesize phage DNA.
- id: file:BPPH2/1/1-uniprot.txt
  title: UniProtKB entry P03679 (GP1_BPPH2)
  findings:
  - statement: Protein p1 self-associates into filamentous structures, binds primer terminal protein gp3 and host FtsZ, and anchors the viral DNA replisome to the host membrane.
    supporting_text: 'Protein that assembles into highly ordered structures and provides a specific site for viral DNA replication. Probably anchors the viral DNA replisome to the host membrane.'
suggested_questions:
- question: How does the shorter internal-initiation isoform delta-1 (P03679-2), which lacks the N-terminal terminal-protein-binding domain but retains the C-terminal polymerization domain, modulate protofilament sheet assembly and replisome tethering in vivo?
- question: What is the structural basis of p1 binding to host FtsZ, and how does this interaction coordinate viral replication compartmentalization with inhibition of host cell division?
suggested_experiments:
- description: Use cryo-electron tomography of phi29-infected Bacillus subtilis minicells to visualize the native organization of p1 protofilament sheets at the inner face of the cytoplasmic membrane.
- description: Reconstitute full-length p1 and truncated delta-1 at varying stoichiometric ratios on supported lipid bilayers to quantify how delta-1 incorporation regulates terminal protein gp3 recruitment.
