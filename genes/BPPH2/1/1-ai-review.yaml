  review:
    summary: >-
      Proposed new molecular function row. p1 has no catalytic activity; what it does is
      polymerise into protofilaments that pack into highly ordered two-dimensional sheets,
      shown directly by sedimentation assays and negative-stain electron microscopy, and
      those sheets are the structure that holds the replication machinery at the host
