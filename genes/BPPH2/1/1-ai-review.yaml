  review:
    summary: >-
      CACAO row from the 1976 Carrascosa et al. survey of phi29 gene products and functions,
      which scored suppressor-sensitive and temperature-sensitive mutants of each cistron
      for phage DNA synthesis under restrictive conditions. The paper names gene 1
      specifically: sus1(629) is listed among the mutants that did not synthesise phage DNA,
      and the Discussion states that cistrons 1, 2, 3, 5, 6 and 17 are involved in
      phage-specific DNA synthesis. The term and the mutant-based evidence code match.
    action: ACCEPT
    reason: >-
      This row was selected to test a predicted one-paper-many-genes failure, on the
      suspicion that a single multi-gene mutant survey had been spread across the phi29
      entries without individually establishing the term for each. The prediction does not
      hold here. The cached record is abstract-only and its summary sentence says only that
      mutants in six genes do not synthesise phage DNA, but the full text (Eur. J. Biochem.
      66:229-241, retrieved externally for this review and quoted in the gene notes rather
      than here, since supporting text must be verbatim from the cached source) names this
      locus three times: in the Results, among the mutants that did not synthesise phage DNA
      alongside ts6, sus6 and sus17; in the Discussion, in the explicit list of the six
      DNA-synthesis cistrons as 1, 2, 3, 5, 6 and 17; and again among the cistrons whose
      products were characterised as early proteins. The identification of sus1 with this
      gene is independently secure, because Prieto et al. later sequenced the same
      sus1(629) allele, found an ochre codon in ORF-6, and concluded that ORF-6 is gene 1 -
      so this is not an adjacent-locus mis-attribution. The qualifier
      acts_upstream_of_or_within_positive_effect is also the appropriate level of caution
      for a 1976 mutant survey that scored the outcome rather than the mechanism, and it is
      the more honest reading of a phenotype that is severe at 37 degrees C but mild at 30
      degrees C.
