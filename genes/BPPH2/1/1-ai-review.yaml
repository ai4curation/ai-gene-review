  knowledge_gaps:
  - gap_statement: >-
      Whether the p1 sheet does anything for initiation beyond concentrating the terminal
      protein and DNA polymerase at the membrane is undetermined: it is not known whether
      contact with p1 activates the terminal protein/polymerase heterodimer, orders the two
      genome ends, or only raises local concentration. The purpose of the association with
      the host FtsZ ring is equally open, since the timing relationship between phage
      replication and host division-site assembly has never been measured.
    boundary: >-
      Firmly established: p1 polymerises into protofilament sheets through identified
      coiled-coil residues, attaches to the host membrane through its hydrophobic
      C-terminus, binds the free primer terminal protein through its N-terminal 42 residues,
      co-fractionates with free terminal protein and DNA polymerase in membrane vesicles,
      pre-assembles independently of the rest of the replisome, supports replication of a
      p1-lacking phage when supplied from a plasmid, and co-localises with host FtsZ at
      midcell.
    gap_kind:
    - BIOLOGY
    significance: >-
      It decides whether p1 is a passive tethering surface or an active participant in
      initiation, which is the difference between a structural molecule activity and a
      regulatory one, and it is the clearest prokaryotic test case for whether membrane
      compartmentalisation of DNA replication does anything beyond localisation.
    resolution: >-
      Separation-of-function p1 variants that polymerise and bind membranes but no longer
      bind the terminal protein or no longer associate with FtsZ, assayed for initiation
      complex formation in vitro and for replication timing in single cells.
    provenance:
