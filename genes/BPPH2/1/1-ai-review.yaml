core_functions:
- description: >-
    Structural scaffold for phi29 genome replication. Protein p1 self-polymerises through
    its coiled-coil region into protofilaments that associate laterally into
    two-dimensional sheets, and attaches these polymers peripherally to the Bacillus
    subtilis membrane through its hydrophobic C-terminus. The sheet is the specific site at
    which the phage replicates: p1 binds the free primer terminal protein through its
    N-terminal 42 residues, so the terminal protein/DNA polymerase heterodimer that
    initiates protein-primed replication is concentrated on the membrane-associated
    structure, and p1, free terminal protein and a fraction of the DNA polymerase are
    recovered together in membrane vesicles from infected cells. The structures pre-assemble
    independently of the rest of the replisome and are functional, since plasmid-borne p1
    supports replication of a p1-lacking phage. p1 also concentrates at midcell by
    associating with the host division protein FtsZ. The scaffold is stoichiometric rather
    than catalytic: too little p1 impairs replication and too much inhibits it.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
