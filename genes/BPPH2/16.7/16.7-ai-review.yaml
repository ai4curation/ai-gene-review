    supporting_text: 'Binds to the long stretches of ssDNA of the viral DNA replication intermediates created during the protein-primed mechanism of replication of the viral genome and attaches the viral DNA to the membrane of the infected cells (PubMed:11169113, PubMed:11741949).'
suggested_questions:
- question: How do membrane-tethered p16.7 oligomers hand off displaced single-stranded viral DNA to soluble gp5 (SSB) as viral DNA replication transitions from the bacterial nucleoid periphery to the host cell membrane?
- question: Does interaction between p16.7 and the MreB actin-like cytoskeleton coordinate the helical redistribution of phi29 replication sites along the Bacillus subtilis plasma membrane?
suggested_experiments:
- description: Perform super-resolution live-cell PALM/STORM imaging of fluorescently tagged p16.7 and gp5 in phi29-infected Bacillus subtilis to track the temporal transition from nucleoid-associated initiation to membrane-associated rolling-strand displacement replication.
- description: Measure competitive binding kinetics of soluble p16.7 C-terminal domain and gp5 on stretched ssDNA molecules using single-molecule fluorescence and optical tweezers.
