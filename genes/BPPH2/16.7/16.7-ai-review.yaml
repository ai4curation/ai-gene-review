  label: Bacillus phage phi29
description: Early single-pass membrane protein (gp16.7, p16.7) of Bacillus phage phi29 that anchors viral DNA replication intermediates to the host cell plasma membrane. It contains an N-terminal transmembrane helix required for membrane insertion and a C-terminal cytoplasmic domain that dimerizes, multimerizes, and binds both single-stranded and double-stranded viral DNA as well as the viral terminal protein gp3, promoting spatial organization and efficiency of protein-primed viral DNA replication.
