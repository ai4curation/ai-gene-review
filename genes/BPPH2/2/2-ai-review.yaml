- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004868
  - UniProtKB-KW:KW-0238
  review:
    summary: >-
      Keyword and signature row for DNA binding. Well supported and curated at residue
      level: the YxGG/A motif in the linker region (192-229) and the C-terminal residues
      563-575 are both mapped as DNA-binding by mutagenesis, and the crystal structure
      shows the enzyme encircling both the downstream template strand and the upstream
      duplex product.
    action: ACCEPT
    reason: >-
      Correct and kept at this level deliberately. The enzyme binds double-stranded DNA
      (the primer-terminus duplex and the upstream product it encircles) and
      single-stranded DNA (the displaced strand, the downstream template threaded through
      the narrow tunnel, and the 3' single-stranded terminus at the exonuclease site), so
      neither GO:0003690 double-stranded DNA binding nor GO:0003697 single-stranded DNA
      binding would be a refinement of the claim - each would be a partial restatement of
      it. GO:0003677 is as precise as the evidence allows. It is a component of the
      catalytic activities rather than a core function in its own right.
    supported_by:
    - reference_id: PMID:15546620
      supporting_text: explained by its topological encirclement of both the downstream
        template and the upstream duplex DNA
      reference_section_type: ABSTRACT
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: The conserved motif YxGG/A located between the 3'-5' exonuclease and
        polymerization domains is important for DNA-binding
