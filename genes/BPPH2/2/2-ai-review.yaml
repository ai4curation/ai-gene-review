- term:
    id: GO:0006270
    label: DNA replication initiation
  evidence_type: IMP
  original_reference_id: PMID:6402761
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row (ECO:0006099, temperature-sensitive mutant phenotypic evidence, dated
      2025-02-17). Blanco et al. 1983 dissected the in vitro requirements for forming the
      p3-dAMP complex, the first step of phi29 DNA replication, using extracts of Bacillus
      subtilis infected with phi29 mutants in genes 2, 3, 5, 6 and 17. The paper is titled
      for this gene and its headline result is about this gene: initiation is completely
      dependent on a functional gene 2 product, while the products of genes 5, 6 and 17
      are dispensable for it. This is the one CACAO row in this entry whose cited paper is
      primarily about the gene under review.
    action: ACCEPT
    reason: >-
      The term matches the assay exactly: the readout is formation of the initiation
      complex, which is the process GO:0006270 names, and the mutant-extract design is
      what makes IMP the right evidence code. There is no phenotype-as-process problem,
      because what the mutant abolishes is the chemical step itself rather than a
      downstream outcome. The qualifier is wrong - this protein catalyses the initiation
      reaction, it does not act upstream of it - and that is recorded as a source defect
      rather than as a reason to reject the claim; the term, reference and evidence code
      all stand. The cached record is abstract-only (EuropePMC returns a server error for
      PMC325798 and the 1983 PMC copy is scanned images), so the figure-level evidence
      could not be checked, and the GONUTS wiki that held the student's evidence pages is
