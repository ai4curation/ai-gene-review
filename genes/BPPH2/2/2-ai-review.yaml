- term:
    id: GO:0034061
    label: DNA polymerase activity
  evidence_type: EXP
  original_reference_id: PMID:3863101
  qualifier: enables
  review:
    summary: >-
      UniProt experimental row, the source of EC 2.7.7.7 in the entry. Blanco and Salas
