- id: PMID:9199402
  title: ø29 DNA polymerase residue Lys383, invariant at motif B of DNA-dependent
    polymerases, is involved in dNTP binding.
  findings:
  - statement: >-
      Mutating the invariant motif B lysine abolishes dNTP incorporation with either DNA
      or terminal protein as primer while leaving DNA affinity and the exonuclease
      unaffected, so the nucleotide site is distinct from the DNA site and from the
      exonuclease site, and it is a dNTP site rather than a nucleoside site.
    supporting_text: mutant K383P showed no detectable capacity to incorporate dNTP
      substrates using either DNA or TP as primer, although its affinity for DNA was not
      affected
    reference_section_type: ABSTRACT
  - statement: >-
      The conservative K383R substitution raises the Km for dNTPs 200-fold, a direct
      measurement of nucleotide, not nucleoside, binding by this enzyme.
    supporting_text: the Km for dNTPs being 200-fold higher than that of the wild-type
      enzyme
    reference_section_type: ABSTRACT
