- id: file:BPPH2/2/2-uniprot.txt
  title: UniProtKB entry P03680 (DPOL_BPPH2), DNA polymerase
  findings:
  - statement: >-
      UniProt's curated FUNCTION line records three distinct enzymatic activities in the
      one chain, with experimental evidence: DNA polymerisation, terminal protein
      deoxynucleotidylation, and 3'-5' exonuclease.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      This polymerase possesses three
      enzymatic activities: DNA synthesis (polymerase), primer terminal
      protein (TP) deoxynucleotidylation, which is the formation of a
      covalent linkage (phosphoester) between the hydroxyl group of a
      specific serine residue in TP and 5'-dAMP, a reaction directed by the
      second T at the 3' end, and 3' to 5' exonuclease activity
  - statement: >-
      The exonuclease has a proofreading purpose, and the two active sites are used
      without the primer leaving the enzyme.
    record_section: ["CC:FUNCTION"]
    supporting_text: Exonuclease activity has a proofreading purpose
  - statement: >-
      The entry places the protein in the type-B DNA polymerase family, the curated
      classification that the family-B InterPro signatures and the GO:0003887 rows rest
      on.
    record_section: ["CC:SIMILARITY"]
    supporting_text: Belongs to the DNA polymerase type-B family.
  - statement: >-
      Mg2+ is the curated cofactor, with four experimental references, and six Mg2+
      ligand residues are mapped as BINDING features.
    record_section: ["CC:COFACTOR"]
    supporting_text: Name=Mg(2+); Xref=ChEBI:CHEBI:18420;
  - statement: >-
      The catalytic domains are separated along the chain: the N-terminal 191 residues
      carry the exonuclease and the strand displacement ability, residues 230-562 the
      initiation, polymerisation and pyrophosphorolytic activities.
    record_section: ["CC:DOMAIN"]
    supporting_text: The N-terminus contains the 3'-5' exonuclease activity and
      strand displacement ability
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The curated record for this protein is unusually deep - roughly fifty primary
      references, most of them residue-level mutational analyses from the Salas
      laboratory - and the FUNCTION, COFACTOR, DOMAIN and BINDING content used here all
      carries ECO:0000269 or ECO:0007744 evidence tied to publications or PDB entries. No
      ARBA-only or ProtNLM statement is cited as support.
- id: PMID:820555
  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: >-
      Mutants in six phi29 cistrons fail to synthesise phage DNA; gene 2 is one of them.
      This is the basis of the CACAO GO:0039693 row, and the same paper is cited on CACAO
      rows for phi29 genes 1, 3, 6 and 17 for the same term.
    supporting_text: Mutants in six genes do not synthesize phage DNA.
    reference_section_type: ABSTRACT
  - statement: >-
      The paper's purpose was mapping cistrons to protein products, which is why it is
      cited across so many phi29 entries; it also identifies a lysis cistron, the basis of
      the CACAO rows on genes 4 and 15 for viral release by cytolysis.
    supporting_text: The protein products of 10 out of the 17 cistrons detected in the
      genome of phage phi29 have been identified.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed. A genuine multi-gene survey, cited on six
      phi29 entries in this corpus; the abstract does not name gene 2 individually, so
      the row that cites it is accepted under curator deference and corroborated from
      other papers rather than from this one alone. The cached record is abstract-only
      and the article is not in PMC.
  full_text_unavailable: true
- id: PMID:6402761
  title: 'Factors involved in the initiation of phage phi 29 DNA replication in vitro:
    requirement of the gene 2 product for the formation of the protein p3-dAMP complex.'
  findings:
  - statement: >-
      Formation of the p3-dAMP initiation complex in extracts is absolutely dependent on a
      functional gene 2 product, with p3 and the phi29 DNA-protein p3 template; this is
      the mutant-based evidence behind both CACAO GO:0006270 rows.
    supporting_text: The formation of the initiation complex is completely dependent on
      the presence of a functional gene 2 product, in addition to protein p3 and phi29
      DNA-protein p3 as template.
    reference_section_type: ABSTRACT
  - statement: >-
      The survey is differentiating rather than blanket: the products of genes 5, 6 and 17
      are not needed for the initiation step, even though their mutants are
      DNA-synthesis-defective.
    supporting_text: The products of genes 5, 6 and 17 do not seem to be needed in the
      formation of the initiation complex.
    reference_section_type: ABSTRACT
  - statement: >-
      Host DNA polymerase III, gyrase and RNA polymerase inhibitors do not affect
      initiation, so the phage initiation machinery is autonomous of the host replication
      apparatus.
    supporting_text: Inhibitors of the host DNA polymerase
      III, DNA gyrase or RNA polymerase had no effect on the formation of the protein
      p3-dAMP complex
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; the title names the gene under review and
      the requirement for its product is the paper's headline result, so this is the right
      paper for the rows that cite it. Cached abstract-only: the EuropePMC full-text
      endpoint returns a 500 for PMC325798 and the PMC copy of this 1983 article is scanned
      page images. Two CACAO rows cite it for the same term and evidence code, differing
      only in ECO refinement, and the abstract does not state which mutant class was used.
  full_text_unavailable: true
- id: PMID:3863101
  title: 'Replication of phage phi 29 DNA with purified terminal protein and DNA polymerase:
    synthesis of full-length phi 29 DNA.'
  findings:
  - statement: >-
      phi29 DNA-protein p3 is replicated to full length with the DNA polymerase and the
      terminal protein as the only proteins, which is the reconstitution behind the IDA
      row for viral DNA genome replication and behind EC 2.7.7.7 in the UniProt entry.
    supporting_text: A system that replicates bacteriophage phi 29 DNA with protein p3
      covalently attached to the two 5' ends, using as the only proteins the phi 29 DNA
      polymerase and the terminal protein, is described.
    reference_section_type: ABSTRACT
  - statement: >-
      The same polymerase performs both the initiation chemistry and the elongation, so
      initiation and strand elongation are separately attributable to this one protein.
    supporting_text: the phi 29 DNA polymerase functions, not only in the formation of
      the p3-dAMP covalent initiation complex but also in the elongation of the latter,
      as the only DNA polymerase to produce full-length phi 29 DNA
    reference_section_type: ABSTRACT
  - statement: >-
      ATP is required at neither step, ruling out a host primase or an ATP-dependent
      helicase in the minimal system.
    supporting_text: ATP
      was not required for phi 29 DNA-protein p3 replication, either in the initiation
      or elongation steps.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed. The primary demonstration of the protein's
      core function; cited on the UniProt EXP and IDA rows in this entry. Cached
      abstract-only, but the abstract states both results used here outright.
  full_text_unavailable: true
- id: PMID:2498321
  title: Highly efficient DNA synthesis by the phage phi 29 DNA polymerase. Symmetrical
    mode of DNA replication.
  findings:
  - statement: >-
      Processivity and strand displacement are intrinsic to the polymerase, requiring no
      accessory protein, and are what make the two-protein replication system sufficient.
    supporting_text: the phi 29 DNA polymerase is highly processive in the absence of any
      accessory protein; 2) the polymerase itself is able to produce strand displacement
      coupled to the polymerization process
    reference_section_type: ABSTRACT
  - statement: >-
      Chains greater than 70 kb are synthesised on primed M13 DNA, roughly four genome
      lengths, and template secondary structure does not impede the enzyme.
    supporting_text: the phi 29 DNA polymerase is able to synthesize DNA chains greater
      than 70 kilobase pairs
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; abstract-only in the cache. Supports the
      processivity and strand-displacement content of the core polymerase function.
  full_text_unavailable: true
- id: PMID:2790959
  title: A conserved 3'->5' exonuclease active site in prokaryotic and eukaryotic
    DNA polymerases.
  findings:
  - statement: >-
      Site-directed mutagenesis of the predicted exonuclease active site specifically
      inactivates the 3'-5' exonuclease of phi29 DNA polymerase while leaving
      polymerisation intact, establishing a separate N-terminal catalytic site. This is
      the experimental reference UniProt gives for EC 3.1.11.-.
    supporting_text: specifically
      inactivated the 3'----5' exonuclease activity of the enzyme
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; abstract-only in the cache. The cached title
      renders the arrow as 3'->5' while the abstract text uses 3'----5', so quotes must be
      taken from the abstract body.
  full_text_unavailable: true
- id: PMID:1730646
  title: DNA-independent deoxynucleotidylation of the phi 29 terminal protein by
    the phi 29 DNA polymerase.
  findings:
  - statement: >-
      The polymerase catalyses covalent attachment of dAMP to the terminal protein even
      without DNA, with the same O-5'-deoxyadenylyl-L-serine linkage, the same Ser232
      specificity and the same YCDTD motif requirement as genuine initiation. This is the
      cleanest demonstration that the deoxynucleotidylation of the terminal protein is an
      activity of this protein, separable from template-directed polymerisation.
    supporting_text: the phi 29 DNA polymerase, in the absence of DNA, is able to catalyze
      the formation of a covalent complex between the phi 29 terminal protein (TP) and
      5'-dAMP
    reference_section_type: ABSTRACT
  - statement: >-
      Without a director DNA the reaction loses base specificity, so the template's role
      at initiation is to stabilise the complementary nucleotide rather than to provide
      the chemistry.
    supporting_text: the same specificity for TP Ser232 as the OH donor and the involvement
      of the YCDTD amino acid motif
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; abstract-only in the cache. Used as the
      primary support for the proposed molecular function term, since it isolates the
      protein-acceptor nucleotidyl transfer from DNA templating.
  full_text_unavailable: true
- id: PMID:1310035
  title: Metal activation of synthetic and degradative activities of phi 29 DNA
    polymerase, a model enzyme for protein-primed DNA replication.
  findings:
  - statement: >-
      The synthetic and degradative activities have independent metal binding sites,
      consistent with the N-terminal exonuclease and C-terminal polymerisation domains.
    supporting_text: The results obtained
      support the existence of independent metal binding sites for the synthetic and
      degradative activities of phi 29 DNA polymerase
    reference_section_type: ABSTRACT
  - statement: >-
      Protein-primed initiation specifically prefers Mn2+, through a large increase in
      dATP affinity; this is a metal-activation property in vitro rather than evidence of
      a second physiological cofactor, so no manganese-binding term is proposed.
    supporting_text: the initiation of DNA polymerization using a protein as a primer, a
      special synthetic activity carried out by phi 29 DNA polymerase, exhibited a strong
      preference for Mn2+ as metal activator
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; abstract-only in the cache. Supports the
      metal-ion row's refinement and the two-active-site architecture.
  full_text_unavailable: true
- id: PMID:15546620
  title: Insights into strand displacement and processivity from the crystal structure
    of the protein-primed DNA polymerase of bacteriophage phi29.
  findings:
  - statement: >-
      The downstream template passes through a tunnel too small for duplex DNA, which is
      the structural basis of coupling polymerisation to strand displacement.
    supporting_text: This tunnel is too small to accommodate double-stranded DNA and
      requires the separation of template and nontemplate strands.
    reference_section_type: ABSTRACT
  - statement: >-
      Processivity is explained by topological encirclement of both the downstream
      template and the upstream duplex, which is also the structural basis of the DNA
      binding annotation.
    supporting_text: explained by its topological encirclement of both the downstream
      template and the upstream duplex DNA
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed; abstract-only in the cache, with an erratum
      noted in the record (Mol Cell 2004;16:1035-6) that concerns the X-ray intensity
      correction described in PMID:15608377, not the biological conclusions used here.
  full_text_unavailable: true
- id: PMID:16511564
  title: 'The phi29 DNA polymerase:protein-primer structure suggests a model for the
    initiation to elongation transition.'
  findings:
  - statement: >-
      The terminal protein's priming domain occupies the same cleft in the polymerase that
      duplex DNA uses during elongation, so the growing product must displace it; this is
      the structural account of the initiation-to-elongation transition.
    supporting_text: a third domain containing the priming serine occupying the same
      binding cleft in the polymerase as duplex DNA does during elongation
    reference_section_type: ABSTRACT
  - statement: >-
      The polymerase/terminal-protein heterodimer cannot accommodate upstream template
      DNA, which is why initiation is restricted to the genome ends - origin specificity
      arising from the enzyme's architecture rather than from a sequence-recognition
      activity.
    supporting_text: this heterodimer of polymerase and terminal protein cannot
      accommodate upstream template DNA, thereby explaining its specificity for initiating
      DNA synthesis only at the ends of the bacteriophage genome
    reference_section_type: ABSTRACT
