core_functions:
- description: >-
    Template-directed DNA polymerisation of extreme processivity coupled to strand
    displacement, carried out with no accessory protein. The polymerase extends a
    primer terminus by one nucleotide at a time against a DNA template, synthesising
    products of tens of kilobases without dissociating and separating the duplex ahead
    of itself as it goes. Both properties are structural: the downstream template is
    threaded through a tunnel too narrow to admit duplex DNA, which forces strand
    separation at the entrance to the active site, and the enzyme topologically
    encircles both the downstream template and the upstream duplex product. This is why
    phi29 replication needs no helicase, no clamp and no single-stranded DNA binding
    protein in vitro, and why the two phi29 origins can both be used with continuous
    synthesis of each daughter strand.
  molecular_function:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  - id: GO:0006271
    label: DNA strand elongation involved in DNA replication
  supported_by:
  - reference_id: PMID:2498321
    supporting_text: the phi 29 DNA polymerase is highly processive in the absence of any
      accessory protein; 2) the polymerase itself is able to produce strand displacement
      coupled to the polymerization process
  - reference_id: PMID:15546620
    supporting_text: This tunnel is too small to accommodate double-stranded DNA and
      requires the separation of template and nontemplate strands.
  - reference_id: PMID:3863101
    supporting_text: the phi 29 DNA polymerase functions, not only in the formation of
      the p3-dAMP covalent initiation complex but also in the elongation of the latter,
      as the only DNA polymerase to produce full-length phi 29 DNA
- description: >-
    Template-directed transfer of dAMP onto the hydroxyl of a serine side chain of the
    phage terminal protein, forming the TP-dAMP initiation product that primes
    replication at each genome end. The polymerase first forms a heterodimer with a free
    terminal protein molecule; the heterodimer cannot accommodate upstream template DNA,
    so it can only engage a genome end, and the terminal protein's priming domain sits in
    the cleft the growing duplex will later occupy. The polymerase then catalyses the
    phosphoester bond between Ser-232 of the terminal protein and 5'-dAMP, directed by an
    internal template thymine, after which the product slides back to recover the terminal
    nucleotides. The acceptor is a protein, not a nucleic acid 3'-OH, and the reaction
    proceeds even in the absence of DNA with identical linkage chemistry and the same
    Ser232 and YCDTD-motif requirements, so it is a distinct catalytic activity of this
    protein rather than an aspect of DNA polymerisation. GO has no molecular function term
    for it: the nearest existing terms are the biological process GO:0018175 protein
    nucleotidylation and GO:0018117 protein adenylylation, neither a
    nucleotidyltransferase activity and neither template-directed. The activity is
    therefore given as a proposed term.
  proposed_molecular_function: terminal protein deoxynucleotidylyltransferase activity
  directly_involved_in:
  - id: GO:0006270
    label: DNA replication initiation
  - id: GO:0039693
    label: viral DNA genome replication
  supported_by:
  - reference_id: PMID:1730646
    supporting_text: the phi 29 DNA polymerase, in the absence of DNA, is able to catalyze
      the formation of a covalent complex between the phi 29 terminal protein (TP) and
      5'-dAMP
  - reference_id: PMID:1730646
    supporting_text: the same specificity for TP Ser232 as the OH donor and the involvement
      of the YCDTD amino acid motif
  - reference_id: PMID:19011105
    supporting_text: the DNA polymerase, in a template-instructed reaction, adds 5'-dAMP
      to a molecule of terminal protein (TP) to form the initiation product TP-dAMP
  - reference_id: PMID:16511564
    supporting_text: this heterodimer of polymerase and terminal protein cannot
      accommodate upstream template DNA, thereby explaining its specificity for initiating
      DNA synthesis only at the ends of the bacteriophage genome
  - reference_id: PMID:6402761
    supporting_text: The formation of the initiation complex is completely dependent on
      the presence of a functional gene 2 product, in addition to protein p3 and phi29
      DNA-protein p3 as template.
- description: >-
    Proofreading 3'-5' exodeoxyribonuclease activity on a single-stranded 3' terminus,
    housed in an independent active site in the N-terminal 191 residues with its own
    metal site. Mispaired primer termini are excised and the primer is handed back to the
    polymerisation site intramolecularly, travelling between the two active sites without
    dissociating from the DNA, which is what lets a single-subunit enzyme combine high
    processivity with high fidelity. The exonuclease is separable by mutation: lesions at
    the conserved Exo motifs abolish degradation and leave synthesis intact, and the
    converse holds for polymerisation-site mutants.
  molecular_function:
    id: GO:0008310
    label: single-stranded DNA 3'-5' DNA exonuclease activity
  directly_involved_in:
  - id: GO:0045004
    label: DNA replication proofreading
  supported_by:
  - reference_id: PMID:2790959
    supporting_text: specifically
      inactivated the 3'----5' exonuclease activity of the enzyme
  - reference_id: file:BPPH2/2/2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Exonuclease activity has a proofreading purpose
  - reference_id: file:BPPH2/2/2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: DNA polymerase edits the polymerization errors using
      an intramolecular pathway as the primer terminus travels from one
      active site to the other without dissociation from the DNA
  - reference_id: PMID:1310035
    supporting_text: The results obtained
      support the existence of independent metal binding sites for the synthetic and
      degradative activities of phi 29 DNA polymerase
proposed_new_terms:
- proposed_name: terminal protein deoxynucleotidylyltransferase activity
  proposed_definition: >-
    Catalysis of the transfer of a deoxyribonucleoside monophosphate from a
    deoxyribonucleoside 5'-triphosphate to a hydroxyl group on an amino acid side chain of
    a priming protein, forming a phosphoester bond between the protein and the
    deoxynucleotide and releasing diphosphate. The nucleotide transferred is specified by a
    DNA template, and the resulting protein-dNMP adduct serves as the primer for DNA strand
    synthesis.
  justification: >-
    This is a catalytic activity of the phi29 DNA polymerase, distinct from its
    DNA-directed DNA polymerase activity in both acceptor and assay: the acceptor is a
    serine hydroxyl of the terminal protein rather than the 3'-OH of a nucleic acid, the
    reaction proceeds in the complete absence of DNA with the same linkage chemistry and
    the same Ser232 and YCDTD requirements, and it has its own metal preference. It is
    shared by the protein-primed replicases of phi29 and relatives, of PRD1 and Bam35, of
    adenovirus, and of linear plasmids, and it is the reaction that makes protein priming
    possible. GO represents the priming event only on the process side (GO:0006270 DNA
    replication initiation, GO:0006269 DNA replication, synthesis of primer) and represents
    protein nucleotidylation only as a biological process (GO:0018175) or as an adenylylation
    process (GO:0018117), with no molecular function term for a protein-accepting
    nucleotidyltransferase of this kind. Without such a term the polymerase's second
    catalytic activity can only be annotated as DNA polymerase activity, which misstates
    the acceptor, and the companion review of the terminal protein (UniProtKB:P03681) has
    had to propose a separate protein-primer term for the acceptor side of the same
    reaction. The two proposals are complementary: this one is the enzyme's activity, that
    one is the primer's.
  proposed_parent:
    id: GO:0016779
    label: nucleotidyltransferase activity
  supported_by:
  - reference_id: PMID:1730646
    supporting_text: the phi 29 DNA polymerase, in the absence of DNA, is able to catalyze
      the formation of a covalent complex between the phi 29 terminal protein (TP) and
      5'-dAMP
  - reference_id: PMID:1730646
    supporting_text: The nature of the TP-dAMP linkage was shown to be identical (a
      O-5'-deoxyadenylyl-L-serine bond) to that found covalently linking TP to the DNA of
      bacteriophage phi 29
  - reference_id: file:BPPH2/2/2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: primer terminal
      protein (TP) deoxynucleotidylation, which is the formation of a
      covalent linkage (phosphoester) between the hydroxyl group of a
      specific serine residue in TP and 5'-dAMP
  - reference_id: PMID:19011105
    supporting_text: the DNA polymerase, in a template-instructed reaction, adds 5'-dAMP
      to a molecule of terminal protein (TP) to form the initiation product TP-dAMP
suggested_questions:
- question: >-
    Will InterPro repoint the GO mapping of IPR014416 (DNA-directed DNA polymerase, family
    B, phi29-like virus) from GO:0001882 nucleoside binding to GO:0000166 nucleotide
    binding? Nucleoside binding is not an ancestor of nucleotide binding in GO, so the
    mapping asserts binding of an unphosphorylated nucleoside, which no member of this
    family has been shown to do, and it propagates to every phi29-like family-B polymerase.
- question: >-
    Should GO add a binding term for deoxyribonucleoside triphosphates? For a replicative
    DNA polymerase the most specific statement available is GO:0000166 nucleotide binding,
    because GO:0032546 deoxyribonucleoside binding is in the unphosphorylated nucleoside
    branch and the only dNTP-level terms are single-nucleotide ones such as GO:0032564 dATP
    binding. The gap is what leaves the generic parent as the correct annotation here.
- question: >-
    Does GO want a molecular function term for the deoxynucleotidylation of a priming
    protein, as proposed here, and should it be coordinated with the protein-primer term
    proposed in the review of the phi29 terminal protein (UniProtKB:P03681)? The two
    describe the enzyme and the acceptor sides of one reaction, and both phi29 proteins are
    currently annotated to terms that misstate their roles in it.
- question: >-
    Should the two CACAO rows on GO:0006270 that cite PMID:6402761 and differ only in their
    ECO refinement (ECO:0007161 nonsense mutation and ECO:0006099 temperature-sensitive
    mutant, submitted nine days apart) be collapsed to one? Both appear as IMP in the GAF,
    so the distinction is invisible downstream, and the paper's abstract does not state
    which mutant class was used.
- question: >-
    Now that the GONUTS wiki is permanently retired (gowiki.tamu.edu returns HTTP 410 and
    the Internet Archive holds no snapshot of its protein or paper pages), is the
    figure-level evidence behind CACAO annotations archived anywhere? Several thousand GOA
    rows carry assigned_by CACAO, many of them citing abstract-only papers, and the
    reasoning that justified each term is no longer retrievable.
- question: >-
    Which mutant alleles did Blanco et al. 1983 use for the gene 2, 3, 5, 6 and 17 extracts?
    The paper is paywalled and its PMC copy is scanned images, and the answer decides both
    the ECO refinement question above and how strongly the initiation requirement is
    established for each gene.
suggested_experiments:
- hypothesis: >-
    The terminal-protein deoxynucleotidylation activity can be separated from
    DNA-directed polymerisation by mutation in both directions, which would establish it
    as an independent molecular function rather than a context of the polymerase reaction.
  description: >-
    Build a mutant panel in the polymerisation site and in the terminal-protein interface
    (the YxGG/A linker, the TPR1 insertion, the YCDTD motif) and assay each protein in
    parallel for DNA-independent TP-dAMP formation, template-directed TP-dAMP formation and
    primer extension on a DNA primer-template. A mutant competent for DNA-primed synthesis
    but null for TP deoxynucleotidylation, together with the converse, would give the
    separation-of-function evidence that an IDA annotation to the proposed new molecular
    function term requires. Published single mutants hint at both directions but have not
    been assayed as one panel against the three readouts.
  experiment_type: enzyme activity assay
- hypothesis: >-
    The proofreading exonuclease acts on a single-stranded 3' terminus and not on a paired
    terminus within duplex DNA, as GO:0008310 asserts.
  description: >-
    Measure steady-state and single-turnover excision rates on a defined substrate series:
    a 3' single-stranded tail, a fully paired blunt duplex, a single mispaired 3' terminus
    in duplex, and a recessed 3' end, each with the wild-type enzyme and with a
    polymerisation-dead mutant to prevent re-extension. The strandedness requirement is
    inferred from mutational mapping of single-stranded DNA ligands rather than measured
    against a substrate panel, and it is the premise of the term this review proposes as
    the replacement for three keyword-derived rows.
  experiment_type: enzyme activity assay
- hypothesis: >-
    In vivo, the protein-primed initiation at the two genome ends is the rate-limiting step
    that the temperature-sensitive gene 2 lesions affect, as the 1990 analysis inferred from
    phenotype.
  description: >-
    Combine quantitative PCR of origin-proximal and internal genome regions with
    single-molecule imaging of labelled polymerase in infected Bacillus subtilis at
    permissive and restrictive temperature for the ts2(24) and ts2(98) alleles, measuring
    initiation events per genome end and elongation rate separately. This would convert the
    in vivo claim behind the GO:0006270 annotations from a mutant phenotype to a measured
    rate, and would test whether the two ts alleles differ in vivo as they do in vitro.
  experiment_type: imaging
