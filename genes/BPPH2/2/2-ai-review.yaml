core_functions:
- description: Catalyzes template-directed deoxynucleotidylation of terminal protein gp3 (p3-dAMP initiation complex formation) and highly processive strand-displacement DNA synthesis to replicate the linear phi29 dsDNA genome.
  molecular_function:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  supported_by:
