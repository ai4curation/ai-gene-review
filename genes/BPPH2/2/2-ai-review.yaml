id: P03680
gene_symbol: '2'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Gene 2 of Bacillus phage phi29 encodes p2 (gp2), the 575-residue family-B
  ("alpha-like") DNA polymerase that carries out the whole of phi29 genome replication by
  itself. It is the archetype of protein-primed replication: instead of an RNA or DNA
  primer, it forms a heterodimer with a free molecule of the phage terminal protein p3,
  recognises the origins at the two 5' ends of the linear 19 kb genome, and covalently
  attaches the initiating dAMP to the hydroxyl of Ser-232 of the priming terminal
  protein, a template-directed transfer onto a protein acceptor that the polymerase
  itself catalyses. The same enzyme then elongates that TP-dAMP product to full genome
  length, so the polymerase and the terminal protein are the only proteins needed to
  replicate the genome in vitro. Three activities reside in one chain: DNA-templated DNA
  polymerisation, terminal-protein deoxynucleotidylation, and a 3'-5' exodeoxyribonuclease
  that proofreads, housed in an independent N-terminal active site with its own metal
  site, between which the primer terminus travels without leaving the enzyme. Two
  structural features make the polymerase autonomous where other replicases need helicases
  and clamps: a downstream-template tunnel too narrow for duplex DNA, which couples
  polymerisation to strand displacement, and topological encirclement of both the
  downstream template and the upstream duplex, which gives processivity of tens of
  kilobases with no accessory protein. These properties are the basis of its wide use in
  multiple displacement amplification and in single-molecule nanopore sequencing.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004868
  - InterPro:IPR006172
  - InterPro:IPR017964
  - UniProtKB-KW:KW-0547
  review:
    summary: >-
      Electronic row from the family-B polymerase signatures and the nucleotide-binding
      keyword. The claim is that the protein binds nucleotides, which for this enzyme
      means the dNTP substrate of polymerisation and of terminal-protein
      deoxynucleotidylation. It is directly documented: UniProt carries curated BINDING
      features for a nucleotide analogue (5-methyl-UTP) at residues 254, 371, 383 and
      458, and mutating Lys383 of motif B destroys dNTP use while leaving DNA affinity
      and the exonuclease untouched.
    action: ACCEPT
    reason: >-
      Correct, and as specific as GO allows. The precise claim would be binding of
      deoxyribonucleoside triphosphates, but GO has no such term - GO:0032546
      deoxyribonucleoside binding sits in the unphosphorylated nucleoside branch and
      GO:0032564 dATP binding is specific to the initiating nucleotide only, while
      elongation uses all four dNTPs. GO:0000166 is therefore kept rather than modified,
      and the missing term is raised in suggested_questions. The row is a mechanistic
      component of the polymerase activity rather than a separate core function.
    supported_by:
    - reference_id: PMID:9199402
      supporting_text: mutant K383P showed no detectable capacity to incorporate dNTP
        substrates using either DNA or TP as primer, although its affinity for DNA was not
        affected
      reference_section_type: ABSTRACT
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="5-methyl-UTP"
- term:
    id: GO:0001882
    label: nucleoside binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR014416
  review:
    summary: >-
      InterPro2GO row from IPR014416 "DNA-directed DNA polymerase, family B, phi29-like
      virus". Checked against the InterPro API: that entry maps to three GO terms, and one
      of them is GO:0001882 nucleoside binding. A nucleoside is a base plus sugar with no
      phosphate, and in GO this is not a parent of nucleotide binding: GO:0000166 descends
      from GO:1901265 nucleoside phosphate binding, whereas GO:0001882 descends from
      GO:0097367 carbohydrate derivative binding and all its children are unphosphorylated
      nucleosides. The mapping therefore asserts something different from, not weaker
      than, the dNTP binding this enzyme has.
    action: REMOVE
    reason: >-
      Demonstrably wrong electronic mapping, which is the sanctioned use of REMOVE for an
      IEA row. Nothing in fifty years of work on this polymerase reports binding of a
      nucleoside; the substrate at the polymerisation site is a dNTP, the curated BINDING
      features are for a nucleotide analogue, and the Michaelis constants in the
      mutational literature are Km values for dNTPs. The claim the mapping was presumably
      meant to make, nucleotide binding, is already annotated from IPR006172 and from
      UniProt keyword KW-0547, so removing this row loses nothing. The defect is in the
      InterPro2GO mapping and propagates to every phi29-like family-B polymerase, so it is
      filed as a source defect against InterPro rather than treated as a problem with this
      entry.
    supported_by:
    - reference_id: PMID:9199402
      supporting_text: the Km for dNTPs being 200-fold higher than that of the wild-type
        enzyme
      reference_section_type: ABSTRACT
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: IPR014416
      slot: GO term
      requested_change: REPOINT
      asserted_value: GO:0001882
      corrected_value: GO:0000166
      corrected_label: nucleotide binding
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        InterPro entry IPR014416 (DNA-directed DNA polymerase, family B, phi29-like virus)
        carries a GO mapping to GO:0001882 nucleoside binding. Nucleoside binding is
        binding of an unphosphorylated base-sugar compound; in the GO graph it is not an
        ancestor of GO:0000166 nucleotide binding (GO:0000166 is under GO:1901265
        nucleoside phosphate binding, while GO:0001882 is under GO:0097367 carbohydrate
        derivative binding, and every GO:0001882 descendant is an unphosphorylated
        nucleoside). The proteins in this family bind deoxyribonucleoside triphosphates,
        not nucleosides; for the type member, phi29 DNA polymerase (UniProtKB:P03680),
        the nucleotide site is mapped by crystallography and by mutational analysis of
        motif B Lys383. The sibling entry IPR006172 (DNA-directed DNA polymerase, family
        B) already maps to GO:0000166, which is what IPR014416 appears to have been
        intended to use. We suggest repointing the mapping to GO:0000166 nucleotide
        binding.
- term:
