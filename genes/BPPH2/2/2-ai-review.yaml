- id: PMID:3863101
  title: 'Replication of phage phi 29 DNA with purified terminal protein and DNA polymerase: synthesis of full-length phi 29 DNA.'
  findings:
  - statement: Purified phi29 DNA polymerase (p2) catalyzes both formation of the covalent p3-dAMP initiation complex and full-length elongation of phi29 DNA in vitro.
    supporting_text: The results show that the phi 29 DNA polymerase functions, not only in the formation of the p3-dAMP covalent initiation complex but also in the elongation of the latter, as the only DNA polymerase to produce full-length phi 29 DNA.
- id: PMID:6402761
  title: 'Factors involved in the initiation of phage phi 29 DNA replication in vitro: requirement of the gene 2 product for the formation of the protein p3-dAMP complex.'
  findings:
  - statement: Functional gene 2 product (p2) is required together with terminal protein p3 and phi29 DNA-p3 template for formation of the covalent p3-dAMP replication initiation complex.
    supporting_text: The formation of the initiation complex is completely dependent on the presence of a functional gene 2 product, in addition to protein p3 and phi29 DNA-protein p3 as template.
- id: PMID:820555
  title: Bacillus subtilis phage phi29. Characterization of gene products and functions.
  findings:
  - statement: Mutants in gene 2 fail to synthesize viral DNA in infected Bacillus subtilis cells.
    supporting_text: Mutants in six genes do not synthesize phage DNA.
- id: file:BPPH2/2/2-uniprot.txt
  title: UniProtKB entry P03680 (DPOL_BPPH2)
  findings:
  - statement: Phi29 gp2 catalyzes DNA polymerization, primer terminal protein deoxynucleotidylation, and 3'-5' proofreading exonuclease activity during protein-primed viral DNA replication.
    supporting_text: 'This polymerase possesses three enzymatic activities: DNA synthesis (polymerase), primer terminal protein (TP) deoxynucleotidylation, which is the formation of a covalent linkage (phosphoester) between the hydroxyl group of a specific serine residue in TP and 5''-dAMP, a reaction directed by the second T at the 3'' end, and 3'' to 5'' exonuclease activity (PubMed:2790959).'
suggested_questions:
- question: How is the conformational transition of gp2 from terminal protein heterodimerization during replication initiation to processive DNA elongation coordinated with release of the parental and primer gp3 molecules?
- question: What structural rearrangements in the TPR2 subdomain allow the polymerase to thread the template strand at the replication origin without a free 5' end?
suggested_experiments:
- description: Perform single-molecule cryo-EM time-resolved imaging of gp2-gp3 complexes bound to the phi29 replication origin across successive nucleotide additions (positions +1 to +10) to visualize the structural transition from initiation to elongation and dissociation of gp3.
- description: Measure strand-displacement synthesis rates and exonuclease switching kinetics of TPR2 loop variants using optical tweezers to quantify the energetic coupling between template strand separation and polymerization.
