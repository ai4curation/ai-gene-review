      template, so GO:0003887 DNA-directed DNA polymerase activity - an is_a child that
      this entry already carries, and the term UniProt itself derives EC 2.7.7.7 from - is
      the correct level. Modified for consistency with the IEA row carrying the same term,
      not because the evidence is doubted; this paper is the primary support for the core
      polymerase function.
