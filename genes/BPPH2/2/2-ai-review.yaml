- term:
    id: GO:0045004
    label: DNA replication proofreading
  evidence_type: IMP
  original_reference_id: PMID:2790959
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. The 3'-5' exonuclease of this polymerase is a proofreading
      exonuclease, and GO:0045004 is defined as correction of replication errors by a DNA
      polymerase using a 3'-5' exonuclease activity - a definition this protein satisfies
      literally. GOA records the exonuclease activity (as the keyword-derived nuclease,
      exonuclease and hydrolase rows) but not the process the activity serves, so the
      proofreading function is currently invisible on the process side.
    action: NEW
    reason: >-
      The gene product performs the work of this process itself: it is the enzyme that
      excises the mispaired nucleotide, and it does so without releasing the primer, which
      is why its fidelity is a property of the single chain rather than of a complex.
      Site-directed mutagenesis of the predicted exonuclease active site specifically
      abolishes the degradative activity while leaving synthesis intact, which is
      separation-of-function evidence that the excision is this protein's job and makes IMP
      the right evidence code. UniProt states the proofreading purpose in its curated
      FUNCTION line. The comparator check supports the proposal rather than warning against
      it: GO:0045004 is annotated to the proofreading exonucleases and proofreading
      polymerases of other replication systems (dnaQ and polC across bacteria in QuickGO),
      which is the same role this protein occupies, so its absence here is a gap rather
      than a convention. The term is not an ancestor or descendant of any other term
      proposed in this review, and the activity side is separately captured by the
      replacement term GO:0008310.
    supported_by:
    - reference_id: PMID:2790959
      supporting_text: specifically
        inactivated the 3'----5' exonuclease activity of the enzyme
      reference_section_type: ABSTRACT
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Exonuclease activity has a proofreading purpose
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: DNA polymerase edits the polymerization errors using
        an intramolecular pathway as the primer terminus travels from one
        active site to the other without dissociation from the DNA
