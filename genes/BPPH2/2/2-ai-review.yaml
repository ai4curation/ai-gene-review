      Correct but less specific than the evidence supports, so MODIFY rather than
      KEEP_AS_NON_CORE. The replacement is GO:0003677 DNA binding, an is_a descendant that
      this entry already carries from KW-0238, and which UniProt supports with mapped
      DNA-binding regions in the linker (192-229) and at the C-terminus (563-575).
    proposed_replacement_terms:
    - id: GO:0003677
      label: DNA binding
    supported_by:
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["FT:REGION"]
      supporting_text: Involved in DNA-binding and TP interaction
    - reference_id: file:BPPH2/2/2-uniprot.txt
      record_section: ["CC:SUBUNIT"]
