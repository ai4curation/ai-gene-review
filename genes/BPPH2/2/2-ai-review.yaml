    supporting_text: The results show that the phi 29 DNA polymerase functions, not only in the formation of the p3-dAMP covalent initiation complex but also in the elongation of the latter, as the only DNA polymerase to produce full-length phi 29 DNA.
  - reference_id: PMID:6402761
    supporting_text: The formation of the initiation complex is completely dependent on the presence of a functional gene 2 product, in addition to protein p3 and phi29 DNA-protein p3 as template.
- description: Catalyzes 3'-5' exonucleolytic proofreading of misincorporated deoxynucleotides during viral DNA genome replication.
