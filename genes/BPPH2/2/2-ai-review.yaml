  label: Bacillus phage phi29
description: Monomeric protein-primed family B DNA-directed DNA polymerase (gp2, p2) that catalyzes all synthetic steps of Bacillus phage phi29 genome replication. It forms a heterodimer with the viral terminal protein gp3 to catalyze template-directed deoxynucleotidylation of gp3 Ser232 with 5'-dAMP at the replication origins, followed by highly processive elongation via intrinsic strand displacement without requiring an accessory helicase. It also contains an N-terminal 3'-5' exonuclease domain responsible for proofreading during viral DNA synthesis.
