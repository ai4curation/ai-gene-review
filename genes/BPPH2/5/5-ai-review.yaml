suggested_questions:
- question: How does the advancing phi29 DNA polymerase gp2 displace cooperatively bound gp5 filaments when two opposing replication forks meet and merge on Type I replication intermediates?
- question: Does gp5 interact directly with the membrane-localized ssDNA-binding protein gp16.7 to coordinate transition from membrane-tethered early replication to bulk cytoplasmic replication?
suggested_experiments:
- description: Determine the cryo-EM structure of the cooperative gp5-ssDNA nucleoprotein filament to define the inter-protomer interface and nucleotide-binding stoichiometry.
- description: Perform single-molecule magnetic tweezers assays comparing strand-displacement synthesis and fork convergence of gp2 in the presence of gp5 versus gp16.7.
