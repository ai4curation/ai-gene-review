  label: Bacillus phage phi29
description: Single-stranded DNA-binding protein (gp5, p5) required for the elongation phase of Bacillus phage phi29 protein-primed DNA replication. It binds cooperatively to the long single-stranded DNA stretches displaced during strand-displacement synthesis, protecting replication intermediates from nuclease degradation, destabilizing secondary structures, and preventing non-productive binding of the viral DNA polymerase to ssDNA.
