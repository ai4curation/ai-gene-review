- id: PMID:20823229
  title: Viral terminal protein directs early organization of phage DNA replication
    at the bacterial nucleoid.
  findings:
  - statement: >-
      The terminal proteins of phi29 and PRD1 associate with the nucleoid of their
      respective bacterial hosts independently of any other phage-encoded protein.
    supporting_text: associate with the host bacterial nucleoid independently of other
      viral-encoded proteins
    reference_section_type: ABSTRACT
  - statement: >-
      The N-terminal domain (residues 1-73) binds DNA sequence-independently and is what
      targets the terminal protein to the nucleoid.
    supporting_text: possesses sequence-independent DNA-binding capacity and is
      responsible for its nucleoid association
    reference_section_type: ABSTRACT
  - statement: >-
      The terminal protein recruits the phage DNA polymerase to the bacterial nucleoid,
      organising the early replication machinery there.
    supporting_text: the TP recruits the phage DNA polymerase to the bacterial nucleoid
    reference_section_type: ABSTRACT
  - statement: >-
      Parental terminal protein covalently attached to the injected genome also
      co-localises with the Bacillus subtilis nucleoid in the absence of priming TP,
      shown by immunofluorescence in cells infected with the sus3(91) mutant.
    supporting_text: the phage parental TP indeed colocalizes with the B. subtilis
      nucleoid in the absence of priming TP
    reference_section_type: RESULTS
  - statement: >-
      Nucleoid tethering is not explained by any of the obvious nucleoid-associated
      proteins; no interaction with HBsu, SMC, ScpA or Noc was detected.
    supporting_text: TP and nucleoid-associated proteins HBsu, SMC, ScpA, or Noc was
      detected by yeast two-hybrid assays
    reference_section_type: DISCUSSION
  - statement: >-
      Later in infection the terminal protein and the DNA polymerase move together onto
      helix-like paths in an MreB-dependent manner.
    supporting_text: both proteins later are redistributed to enlarged helix-like
      structures in an MreB cytoskeleton-dependent way
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified; full text cached and read. Establishes the second core
      function and is the reason the host cell nucleus rows are marked over-annotated: the
      in-host location is the bacterial nucleoid.
- id: PMID:22210885
  title: Involvement of residues of the 29 terminal protein intermediate and priming
    domains in the formation of a stable and functional heterodimer with the replicative
    DNA polymerase.
  findings:
  - statement: >-
      Initiation proceeds through a DNA polymerase/terminal protein heterodimer that
      recognises the genome-end origins and primes replication from the hydroxyl of
      Ser-232.
    supporting_text: the DNA polymerase forms a heterodimer with a free TP that
      recognizes the origins and initiates replication using as primer the hydroxyl group
      of TP residue Ser232
    reference_section_type: ABSTRACT
  - statement: >-
      The polymerase catalyses the covalent bond between the initiator dAMP and Ser-232
      of the priming terminal protein; the terminal protein supplies the hydroxyl, the
      polymerase the chemistry.
    supporting_text: the polymerase catalyses the formation of a covalent bond between
      the initiator dAMP and the hydroxyl group of Ser232 of the primer TP in the
      initiation reaction
    reference_section_type: INTRODUCTION
  - statement: >-
      Residues of the intermediate and priming domains (R158, R169, E191, D198, Y250,
      E252, Q253, R256) are needed for a stable and functional heterodimer and for the
      first steps of replication.
    supporting_text: substitution of these residues had an effect on either the stability
      of the TP/DNA polymerase complex
    reference_section_type: ABSTRACT
  reference_review:
