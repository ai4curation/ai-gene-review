- id: file:BPPH2/3/3-uniprot.txt
  title: UniProtKB entry P03681 (TERM_BPPH2)
  findings:
  - statement: Terminal protein gp3 acts as the protein primer for viral DNA elongation, recruits DNA polymerase to the bacterial nucleoid via its N-terminal region, and participates in viral DNA packaging.
    supporting_text: 'Acts as a primer for DNA elongation during viral genomic replication (PubMed:6813861). Acts as the small terminase protein during packaging (PubMed:18674782). Recruits the phage DNA polymerase to the bacterial nucleoid (PubMed:20823229).'
suggested_questions:
- question: How does the parental terminal protein gp3 at the 5' ends of the genome interact with the packaging RNA (pRNA) and gp16 ATPase ring to initiate directional DNA translocation into the prohead?
- question: What structural features of the parental gp3-DNA junction allow the gp2-gp3 heterodimer to recognize the terminal replication origin and position the template second thymidine for sliding-back initiation?
suggested_experiments:
- description: Determine a high-resolution cryo-EM reconstruction of the phi29 prohead-pRNA-gp16 motor stalled at the initial recognition stage with the 5' DNA-gp3 complex to resolve the specific contacts between parental gp3 and the packaging motor.
- description: Use single-molecule fluorescence resonance energy transfer (smFRET) with labeled parental gp3 and primer gp3 to monitor origin unwinding and sliding-back dynamics during synthesis of the first six nucleotides by gp2.
