- id: PMID:16511564
  title: 'The phi29 DNA polymerase:protein-primer structure suggests a model for the
    initiation to elongation transition.'
  findings:
  - statement: >-
      phi29 solves the primer problem by using a serine hydroxyl of the terminal protein
      to prime replication.
    supporting_text: The DNA polymerase of bacteriophage phi29 solves this problem by
      using a serine hydroxyl of terminal protein to prime replication.
    reference_section_type: ABSTRACT
  - statement: >-
      The 3.0 A structure resolves the three terminal protein domains: one making no
      contacts, one binding the polymerase, and the priming domain occupying the cleft
      that duplex DNA uses during elongation.
    supporting_text: The 3.0 A resolution structure shows one domain of terminal protein
      making no interactions, a second binding the polymerase and a third domain
      containing the priming serine occupying the same binding cleft in the polymerase as
      duplex DNA does during elongation.
    reference_section_type: ABSTRACT
  - statement: >-
      The heterodimer cannot accommodate upstream template DNA, which explains why
      initiation is restricted to the genome ends.
    supporting_text: this heterodimer of polymerase and terminal protein cannot
      accommodate upstream template DNA, thereby explaining its specificity for
      initiating DNA synthesis only at the ends of the bacteriophage genome
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified; full text cached. The structure is also the basis for
      judging that the terminal protein has no hydrolase fold.
