- id: PMID:19011105
  title: Phage phi29 and Nf terminal protein-priming domain specifies the internal
    template nucleotide to initiate DNA replication.
  findings:
  - statement: >-
      Swapping the priming domains of the phi29 and Nf terminal proteins shows that this
      domain determines which internal template nucleotide directs initiation, with the
      terminal nucleotides recovered by sliding back.
    supporting_text: we show that this domain is the main structural determinant that
      dictates the internal 3' nucleotide used as template during initiation
    reference_section_type: ABSTRACT
  reference_review:
