- term:
    id: GO:0019073
    label: viral DNA genome packaging
  evidence_type: IDA
  original_reference_id: PMID:18674782
  qualifier: involved_in
  review:
    summary: >-
      UniProt IDA row from the phi29 packaging-motor assembly paper. The parental TP is
      the covalently bound genome-end protein that the packaging machinery engages, and
      gp3 actively condenses the DNA ends: DNA-gp3 sediments faster than its proteinase
      K-treated counterpart in a gp3-dependent way, and gp3 together with the packaging
      ATPase gp16 supercoils the ends before the prohead takes up the genome.
    action: KEEP_AS_NON_CORE
    reason: >-
      Participation is satisfied rather than assumed: gp3 does not merely ride along on
      the substrate but compacts it, and the lariat and supercoiled forms that precede
      efficient prohead interaction require gp3 (PMID:9086269). The cited paper is
      principally about gp16 oligomerisation on the prohead/pRNA, and its gp3 content is
      that the assembled prohead/pRNA/gp16 motor supercoils DNA-gp3; the direct
      gp3-dependence is in PMID:9086269, added here as a supporting reference. Kept as
      non-core because the protein's defining and evolutionarily primary role is
      priming replication, with the genome-end role in packaging a consequence of the
      covalent linkage established during replication.
    supported_by:
    - reference_id: PMID:9086269
      supporting_text: the faster sedimentation was both gp3 and Mg2+-dependent
    - reference_id: PMID:9086269
      supporting_text: DNA-gp3 has a maturation pathway in which the packaging proteins
        gp3 and gp16 supercoil the DNA ends, probably as a prerequisite for efficient
        interaction with the prohead.
    - reference_id: PMID:18674782
      supporting_text: The complex was capable of supercoiling DNA-gp3 as observed
        previously for gp16 alone
    additional_reference_ids:
    - PMID:9086269
