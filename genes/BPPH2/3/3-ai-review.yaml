  evidence_type: EXP
  original_reference_id: PMID:23091024
  qualifier: located_in
  review:
    summary: >-
      UniProt experimental row for a nuclear location. The underlying experiment is
      heterologous: phi29 TP, like the terminal proteins of Nf, PRD1, Bam35 and Cp-1,
      localises to the nucleus when expressed in mammalian cells, through a bona fide NLS
      in residues 1-37. Mammalian cells are not phi29's host.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0042025 is the nucleus of the host, and the host of phi29 is Bacillus subtilis
      (recorded as such in the UniProt entry's host-organism line), which has no nucleus.
      The observation is real and interesting - it is the basis of using TP-DNA for gene
      delivery into eukaryotic nuclei - but it is a property of the protein in a
      non-host eukaryotic cell, not a location it occupies in the organism it infects.
      The protein's actual in-host location is the bacterial nucleoid, for which GO has
      no host-scoped term (GO:0009295 nucleoid and GO:0043590 bacterial nucleoid are not
      host-qualified, and GO:0033643 host cell part has no nucleoid child); that gap is
      filed under proposed_new_terms. The row is marked over-annotated rather than
      removed because the localisation itself is well demonstrated and the NLS is
      mapped by mutagenesis of Lys-25 and Lys-27, and rather than modified because no
      existing GO term states the claim correctly.
