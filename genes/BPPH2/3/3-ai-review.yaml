id: P03681
gene_symbol: '3'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Terminal protein p3 (TP, gp3) is the 266-residue early protein of Bacillus phage phi29
  that makes protein-primed DNA replication possible. It is covalently attached to both
  5' ends of the linear phage genome through a phosphoester bond between the hydroxyl of
  Ser-232 and the terminal 5'-dAMP. A free molecule of TP forms a heterodimer with the
  phage DNA polymerase; the heterodimer recognises the origins at the two genome ends,
  and the polymerase deoxyadenylylates Ser-232 to give the TP-dAMP initiation product,
  which is then elongated as the 5' end of the nascent strand. The TP is not a passive
  acceptor: its C-terminal priming domain occupies the polymerase cleft that duplex DNA
  later uses, excludes initiation at internal genome sites, and determines which internal
  template thymine directs the initiating nucleotide, after which the TP-dAMP product
  slides back to recover the terminal nucleotide. The protein has three parts: a
  disordered N-terminal domain (1-73) that binds DNA without sequence specificity, an
  intermediate domain (74-172) that confers specificity for the polymerase, and the
  priming domain (173-266) carrying Ser-232. In infected Bacillus subtilis the N-terminal
  domain tethers both the parental genome and the priming TP/polymerase heterodimer to
  the bacterial nucleoid and recruits the DNA polymerase there, which is required for
  efficient replication in vivo; the complex later redistributes along MreB-dependent
  helical paths. As the covalently attached genome-end protein, p3 also compacts and,
  with the packaging ATPase gp16, supercoils the DNA ends before the genome is taken up
  by the prohead. Terminal proteins of phi29 and of several unrelated phages
  additionally carry nuclear localisation signals that are functional when the proteins
  are expressed in mammalian cells, a property of unknown significance for the phage life
  cycle that has been proposed to favour horizontal gene transfer to eukaryotes.
