  label: Bacillus phage phi29
description: Terminal protein (gp3, p3) covalently linked by a phosphoester bond at Ser232 to both 5' ends of the linear double-stranded DNA genome of Bacillus phage phi29. During infection, free gp3 forms a heterodimer with the viral DNA polymerase gp2, recruits the replication machinery to the bacterial nucleoid and viral replication origins via its N-terminal DNA-binding domain, and serves as the protein primer for initiation of strand-displacement viral DNA replication through template-directed covalent attachment of 5'-dAMP. Parental gp3 covalently attached to progeny viral genomes is also required for recognition and translocation of the DNA-gp3 complex into the prohead during viral genome packaging.
