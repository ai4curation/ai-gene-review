- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: >-
      Keyword-derived row (KW-0238 DNA-binding). The terminal protein's disordered
      N-terminal domain binds double-stranded DNA in a sequence-independent manner, and
      this activity is the molecular basis of its nucleoid-tethering role; the
      DNA-binding residues have been mapped by mutagenesis.
    action: ACCEPT
    reason: >-
      The claim is directly demonstrated rather than merely predicted. Residues 1-73 of
      the phi29 TP bind DNA without sequence specificity and that binding is what places
      the protein on the Bacillus subtilis nucleoid (PMID:20823229); mutating the basic
      residues of this domain correlates loss of DNA binding with loss of nucleoid
      localisation, loss of DNA polymerase recruitment and reduced phage DNA replication
      (PMID:24205926, PMID:25722367). The term is the most specific molecular function
      GO offers for this activity - the binding is explicitly not sequence-specific, so
      no descendant such as GO:0003688 DNA replication origin binding applies - and it
      is retained as a core function.
    supported_by:
    - reference_id: PMID:20823229
      supporting_text: possesses sequence-independent DNA-binding capacity and is
        responsible for its nucleoid association
    - reference_id: PMID:25722367
