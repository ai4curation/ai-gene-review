- term:
    id: GO:0006269
    label: DNA replication, synthesis of primer
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008770
  review:
    summary: >-
      InterPro2GO row from IPR008770 (DNA terminal protein Gp3). The priming step of
      phi29 replication is exactly the step this term names: the polymerase covalently
      links the initiating dAMP to Ser-232 of the TP, and the TP-dAMP adduct is the
      primer that is then extended.
    action: ACCEPT
    reason: >-
      The signature is this protein's own family signature, so the mapping is not an
      over-propagation. The term definition is written with nucleotide primers in mind
      (a short chain made by a primase), and GO has no term for protein priming -
      GO:0006269 is the only primer-synthesis term in the ontology - but the fit is
      substantive rather than approximate: a nucleotide (dAMP) is added on the DNA
      template to form the primer, the TP supplies the 3'-OH-bearing moiety that the
      polymerase extends, and the TP's priming domain selects which internal template
      nucleotide directs the reaction (PMID:19011105), so the TP does part of the work of
      making the primer. The missing molecular function term is filed under
      proposed_new_terms. Core.
    supported_by:
    - reference_id: PMID:16511564
      supporting_text: The DNA polymerase of bacteriophage phi29 solves this problem by
        using a serine hydroxyl of terminal protein to prime replication.
    - reference_id: PMID:19011105
      supporting_text: we show that this domain is the main structural determinant that
        dictates the internal 3' nucleotide used as template during initiation
- term:
    id: GO:0006270
    label: DNA replication initiation
  evidence_type: IDA
  original_reference_id: PMID:6813861
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO IDA row. Penalva and Salas 1982 is the paper that demonstrated the phi29
      initiation reaction: incubating extracts of phi29-infected Bacillus subtilis with
      labelled dATP produces a labelled protein with p3's electrophoretic mobility, and
      chemical and enzymatic dissection shows that the label is a covalently bound
      5'-dAMP on p3. The resulting p3-dAMP complex is elongated on addition of dNTPs.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene product is the initiation step itself, assayed
      directly on p3: nuclease-, phosphatase- and RNase-resistant but proteinase
      K-sensitive label; piperidine release of 5'-dAMP; abolition by anti-p3 serum; and a
      requirement for the phi29 DNA-protein p3 template. The CACAO term matches that
      assay at the right granularity - GO:0006270 DNA replication initiation is the
      process the p3-dAMP complex constitutes, and the dideoxy-terminated elongation
      products of 9 and 12 bases confirm that initiation occurred at the two genome ends.
      This is not a phenotype read as a process: the molecular event is observed, not
      inferred from an outcome. Core, and the same paper carries the UniProt IDA row for
      GO:0039693, which is also accepted. The cached record is abstract-only, so
      figure-level detail could not be inspected; the GONUTS wiki page that might record
      the student's evidence is offline.
    supported_by:
    - reference_id: PMID:6813861
      supporting_text: a covalent complex between protein p3 and 5'-dAMP is formed in
        vitro
    - reference_id: PMID:6813861
      supporting_text: was strongly inhibited by anti-p3 serum and required the preence
        of phi 29 DNA-protein p3 complex
    - reference_id: PMID:6813861
      supporting_text: can be elongated by addition of 40 microM dNTPs
