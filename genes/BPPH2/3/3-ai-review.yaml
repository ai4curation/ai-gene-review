- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0378
  review:
    summary: >-
      Keyword row (KW-0378 Hydrolase) that traces to UniProt's second FUNCTION line,
      hydrolysis of host peptidoglycans during virus entry, cited to Moak and Molineux
      2004. That attribution of the phi29 virion muralytic activity to gp3 has been
      superseded: the enzyme is the tail protein gp13.
    action: REMOVE
    reason: >-
      Moak and Molineux assayed muralytic activity associated with whole virions and
      placed the phi29 activity on gp3. The phi29 tail knob protein gp13 was
      subsequently solved at 1.8 A and shown to carry a lysozyme-like glycosidase domain
      and a metallo-endopeptidase domain, positioned at the distal tip of the tail where
      peptidoglycan is encountered (PMID:18606992); UniProt itself annotates gp13
      (UniProtKB:P15132) as a lysozyme-like glycosidase plus a probable
      metalloendopeptidase. The p3 structure (PDB 2EX3) is a three-domain priming
      protein with no hydrolase fold and no candidate catalytic residues, and no
      hydrolytic activity has ever been assayed on purified p3. The row is an electronic
      keyword mapping, not an experimental annotation, and the keyword rests on an
      attribution that the later structural work reassigns, so removal rather than
      over-annotation is appropriate. Independently, bare GO:0016787 would be
      uninformative even if the activity were real.
    supported_by:
    - reference_id: PMID:18606992
