core_functions:
- description: >-
    Protein primer for protein-primed replication of the phi29 genome. A free molecule of
    terminal protein heterodimerises with the phi29 DNA polymerase; the heterodimer
    recognises the origins formed by the parental terminal protein plus the terminal
    inverted repeat at each 5' end, and the polymerase covalently links the initiating
    dAMP to the hydroxyl of Ser-232 of the priming TP to give the TP-dAMP initiation
    product, which is extended as the 5' end of the nascent strand with the TP remaining
    covalently attached. The TP contributes more than the hydroxyl group: its priming
    domain occupies the polymerase cleft that duplex DNA later uses, excludes initiation
    at internal sites, and determines which internal template thymine directs the
    initiating nucleotide, after which the product slides back to recover the terminal
    nucleotide. GO has no molecular function term for protein priming, so the activity is
    given as a proposed term.
  proposed_molecular_function: DNA replication protein primer activity
  directly_involved_in:
  - id: GO:0006270
    label: DNA replication initiation
  - id: GO:0006269
    label: DNA replication, synthesis of primer
  - id: GO:0039693
    label: viral DNA genome replication
  supported_by:
  - reference_id: PMID:16511564
    supporting_text: The DNA polymerase of bacteriophage phi29 solves this problem by
      using a serine hydroxyl of terminal protein to prime replication.
  - reference_id: PMID:6813861
    supporting_text: a covalent complex between protein p3 and 5'-dAMP is formed in vitro
  - reference_id: PMID:6779279
    supporting_text: protein p3 is covalently linked to phi 29 DNA through a phosphoester
      bond between L-serine and 5'-dAMP
  - reference_id: PMID:3135531
    supporting_text: The mutant terminal protein has been purified to homogeneity and
      shown to be inactive in the formation of the initiation complex
  - reference_id: PMID:19011105
    supporting_text: we show that this domain is the main structural determinant that
      dictates the internal 3' nucleotide used as template during initiation
- description: >-
    Sequence-independent double-stranded DNA binding by the disordered N-terminal domain
    (residues 1-73), which tethers both the injected parental genome and the priming
    TP/DNA polymerase heterodimer to the Bacillus subtilis nucleoid and recruits the DNA
    polymerase there. This organisation of the replication machinery at the host nucleoid
    is required for efficient phage DNA replication in vivo, and also gives the phage
    genome access to host RNA polymerase for early transcription.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  supported_by:
  - reference_id: PMID:20823229
    supporting_text: possesses sequence-independent DNA-binding capacity and is
      responsible for its nucleoid association
  - reference_id: PMID:20823229
    supporting_text: the TP recruits the phage DNA polymerase to the bacterial nucleoid
  - reference_id: PMID:20823229
    supporting_text: organizing the early viral DNA replication machinery at the cell
      nucleoid
  - reference_id: PMID:24205926
    supporting_text: these residues are important to recruit the DNA polymerase at the
      bacterial nucleoid and, subsequently, for an efficient phage DNA replication
  knowledge_gaps:
  - gap_statement: >-
      How the terminal protein is held at the bacterial nucleoid, beyond generic
      sequence-independent DNA binding, is unknown. No interaction was detected with the
      obvious candidate nucleoid-associated proteins, and nothing explains why the
      TP/polymerase complex later follows MreB-dependent helical paths rather than
      staying on the nucleoid.
    boundary: >-
      What is established: residues 1-73 bind DNA without sequence specificity; the basic
      residues responsible have been identified by mutagenesis and their loss abolishes
      nucleoid localisation, polymerase recruitment and efficient replication; and no
      interaction with HBsu, SMC, ScpA or Noc was detected by yeast two-hybrid.
    gap_kind:
    - BIOLOGY
    significance: >-
      The nucleoid is where phi29 replication is organised in vivo, so the tethering
      mechanism is the link between a well-understood in vitro priming reaction and the
      spatial organisation of the infection.
    resolution: >-
      Unbiased identification of the host factors and membrane or cytoskeletal structures
      that the TP and the TP/polymerase heterodimer contact in infected cells (see
      suggested_experiments).
    provenance:
    - reference_id: PMID:20823229
      supporting_text: TP and nucleoid-associated proteins HBsu, SMC, ScpA, or Noc was
        detected by yeast two-hybrid assays
    - reference_id: PMID:20823229
      supporting_text: both proteins later are redistributed to enlarged helix-like
        structures in an MreB cytoskeleton-dependent way
proposed_new_terms:
- proposed_name: DNA replication protein primer activity
  proposed_definition: >-
    The function of a protein that supplies a hydroxyl group on one of its own amino acid
    side chains as the primer for DNA strand synthesis: a DNA polymerase covalently links
    the initiating deoxynucleoside monophosphate to that hydroxyl in a template-directed
    reaction, and the resulting protein-dNMP adduct is elongated as the 5' end of the
    nascent DNA strand, leaving the protein covalently attached to that end.
  justification: >-
    Protein priming is a distinct solution to the primer requirement of DNA polymerases,
    used by the terminal proteins of phi29 and related phages, of PRD1 and Bam35, of
    adenoviruses, and of linear plasmids of bacteria, fungi and plants. GO represents it
    only as a process (GO:0006269 DNA replication, synthesis of primer, whose definition
    assumes a short nucleotide chain made by a primase) and has no molecular function
    term for the priming protein itself, so terminal proteins can presently be annotated
    only to DNA binding or to process terms. A molecular function term would let the
    priming role be stated as an activity and distinguished from the polymerase's
    nucleotidyltransferase activity.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:16511564
    supporting_text: The DNA polymerase of bacteriophage phi29 solves this problem by
      using a serine hydroxyl of terminal protein to prime replication.
  - reference_id: PMID:22210885
    supporting_text: the DNA polymerase forms a heterodimer with a free TP that
      recognizes the origins and initiates replication using as primer the hydroxyl group
      of TP residue Ser232
  - reference_id: PMID:6779279
    supporting_text: protein p3 is covalently linked to phi 29 DNA through a phosphoester
      bond between L-serine and 5'-dAMP
- proposed_name: host cell nucleoid
  proposed_definition: >-
    The region of a host prokaryotic cell to which its DNA is confined. The host is
    defined as the larger of the organisms involved in a symbiotic interaction.
  justification: >-
    Phage and other prokaryote-infecting symbiont proteins that localise to the host
    nucleoid currently have no term to be annotated to. GO:0009295 nucleoid and
    GO:0043590 bacterial nucleoid describe the organism's own nucleoid, not the host's,
    and GO:0033643 host cell part has no nucleoid child, so the only available
    host-chromatin-like term is GO:0042025 host cell nucleus - which is taxonomically
    wrong for a bacterial host and is how phi29 terminal protein came to carry a nucleus
    annotation. At least two phage terminal proteins (phi29 in Bacillus subtilis and PRD1
    in Escherichia coli) localise to the host nucleoid independently of other phage
    proteins, and the phage DNA polymerase is recruited to the same compartment.
  proposed_parent:
    id: GO:0033643
    label: host cell part
  supported_by:
  - reference_id: PMID:20823229
    supporting_text: associate with the host bacterial nucleoid independently of other
      viral-encoded proteins
  - reference_id: PMID:20823229
    supporting_text: organizing the early viral DNA replication machinery at the cell
      nucleoid
suggested_questions:
- question: >-
    Should UniProt's FUNCTION statement about hydrolysing host peptidoglycans during virus
    entry, and the associated keywords (KW-0378, KW-1160, KW-1235, KW-1236), be moved from
    the phi29 terminal protein to the tail knob protein gp13, given the structural and
    cryoEM identification of gp13 as the peptidoglycan-degrading enzyme? Four GOA rows on
    P03681 derive from them.
- question: >-
    Does GO want a molecular function term for protein priming of DNA replication, and a
    host-scoped nucleoid cellular component term? Both gaps are currently absorbed by
    terms that misstate the biology: the priming role by DNA binding or by process terms,
    and the nucleoid location by host cell nucleus.
- question: >-
    What is the biological role, if any, of the eukaryotic-functional nuclear localisation
    signals found in the terminal proteins of phi29, Nf, PRD1, Bam35 and Cp-1? The
    proposed explanation is facilitation of horizontal gene transfer to eukaryotes, which
    has not been tested in a natural setting.
  experts:
  - Modesto Redrejo-Rodriguez
- question: >-
    In phi29, which protein performs the functions a small terminase would, and is the
    terminal protein properly a subunit of the packaging machine or only the recognition
    element on its substrate? pRNA, gp16 and gp3 divide these roles differently from
    canonical headful-packaging phages.
  experts:
  - Marc C. Morais
  - Shelley Grimes
suggested_experiments:
- hypothesis: >-
    Purified phi29 terminal protein has no peptidoglycan hydrolase activity, and the
    virion muralytic activity attributed to it in 2004 is contributed by gp13.
  description: >-
    Assay purified recombinant p3 and purified gp13 side by side on Bacillus subtilis
    peptidoglycan sacculi and on dye-release or zymogram substrates, including the
    S232T priming-dead p3 as a control, and compare whole virions of wild-type and
    gp13-deficient phage. A negative result on p3 at loading comparable to the virion
    content would settle the attribution that four GOA rows depend on.
  experiment_type: enzyme activity assay
- hypothesis: >-
    The terminal protein is held at the host nucleoid by host factors in addition to
    generic DNA binding, and those factors also position the TP/polymerase complex on the
    MreB-dependent helical paths seen later in infection.
  description: >-
    Proximity-dependent labelling (BioID or APEX) from p3 and from the p3/DNA polymerase
    heterodimer in infected Bacillus subtilis at early and middle infection times,
    compared with the DNA-binding-deficient N-terminal mutants, followed by validation of
    candidates by co-localisation and by replication efficiency in the corresponding host
    deletion strains.
  experiment_type: proximity labelling and genetic validation
- hypothesis: >-
    Terminal protein is a functional constituent of the packaging machine rather than
    only the recognition mark on the substrate, so its presence changes motor kinetics
    and not merely substrate recruitment.
  description: >-
    Single-molecule optical-tweezers packaging assays comparing DNA-gp3 with proteinase
    K-treated DNA and with DNA bearing a non-cognate 5' protein, measuring initiation
    frequency, velocity, slipping and stalling; combined with cryoEM of a stalled
    prohead/pRNA/gp16/DNA-gp3 complex to ask whether gp3 occupies a defined site on the
    motor.
  experiment_type: single-molecule biophysics and structural biology
- hypothesis: >-
    The eukaryotic NLS of phage terminal proteins confers a measurable advantage for
    transfer of phage DNA into eukaryotic nuclei under conditions resembling natural
    exposure.
  description: >-
    Compare nuclear delivery and expression of TP-DNA carrying wild-type p3 with that
    carrying the K25A/K27A NLS mutant, in primary cells and in a gut or soil-derived
    co-culture where phage-eukaryote encounters occur, rather than in transfection of a
    cell line only.
  experiment_type: gene delivery assay
