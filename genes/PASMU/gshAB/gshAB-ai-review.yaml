  label: Pasteurella multocida subsp. multocida str. Pm70
description: 'Bifunctional glutathione biosynthesis protein GshAB (GshF) of Pasteurella multocida, a 757-residue
  cytosolic enzyme that performs both steps of glutathione synthesis. An N-terminal gamma-proteobacterial-type
  glutamate--cysteine ligase domain forms gamma-L-glutamyl-L-cysteine from L-glutamate and L-cysteine,
  and a C-terminal ATP-grasp domain, most similar to that of cyanophycin synthetases and unrelated to
  known glutathione synthetases, adds glycine to complete glutathione. The recombinant protein forms dimers,
  its glutamate--cysteine ligase activity is allosterically feedback-inhibited by glutathione, and its
  kinetics indicate cross-talk between the two domains. P. multocida obtains glutathione both by GshF-driven
  synthesis and by import.'
