- term:
    id: GO:0008716
    label: D-alanine-D-alanine ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011095
  review:
    summary: InterPro2GO mapping from IPR011095 (D-alanine--D-alanine ligase C-terminal ATP-grasp) 
      to D-alanine-D-alanine ligase activity.
    action: REMOVE
    reason: Wrong mapping for this protein. IPR011095 recognises a generic ATP-grasp C-terminal fold
      shared by many carboxylate--amine ligases; in GshF that domain is the glutathione synthetase 
      module. The protein's two activities are glutamate--cysteine ligase and glutathione 
      synthetase, and nothing indicates D-Ala--D-Ala ligation.
    supported_by:
    - reference_id: PMID:16339152
      supporting_text: followed by a typical ATP-grasp domain, which most closely resembles that of 
        cyanophycin synthetases, although it has no significant homology with known GS ligases
    - reference_id: file:PASMU/gshAB/gshAB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Synthesizes glutathione from L-glutamate and L-cysteine via 
        gamma-L-glutamyl-L-cysteine.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR011095
      requested_change: CHECK
      asserted_value: GO:0008716
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: IPR011095 marks the C-terminal ATP-grasp fold of D-Ala--D-Ala ligase, which also 
        occurs in other carboxylate--amine ligases. In the GshAB/GshF fusion (HAMAP MF_00782) this 
        domain is the glutathione synthetase module, so the GO:0008716 mapping over-reaches. 
        Restrict the InterPro2GO mapping, for example by excluding proteins matching IPR006335 
        (Glut_biosynth) or HAMAP MF_00782.
      supported_by:
      - reference_id: PMID:16339152
        supporting_text: Domain architecture analysis shows that this P. multocida GshF bifunctional
          ligase contains an N-terminal gamma-proteobacterial gamma-ECL-like domain followed by a 
          typical ATP-grasp domain
