suggested_questions:
- question: Is gamma-glutamylcysteine channelled from the N-terminal ligase domain to the C-terminal
    ATP-grasp domain within the GshF dimer, and does the half-of-the-sites behaviour reflect 
    alternating domain use across protomers?
suggested_experiments:
- hypothesis: GshF channels gamma-glutamylcysteine between its two domains without release to bulk 
    solvent.
  description: Run coupled GshF reactions in the presence of excess gamma-glutamyl cyclotransferase 
    or an isotopically labelled gamma-Glu-Cys trap and compare glutathione formation with an 
    equimolar mixture of separately expressed domains.
