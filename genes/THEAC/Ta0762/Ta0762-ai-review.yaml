    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  evidence_type: IDA
  original_reference_id: PMID:24914732
  qualifier: enables
  review:
    summary: >-
      Recombinant Ta0762 phosphorylates (R)-mevalonate 3-phosphate with ATP, and 13C NMR places the new
      phosphate on C5, giving mevalonate 3,5-bisphosphate. It was the only one of seven candidate
      kinases with this activity, and it does not phosphorylate 2-phosphoglycerate.
    action: MODIFY
    reason: >-
      The row's own paper identifies the specific reaction, mevalonate-3-phosphate 5-kinase
      (EC 2.7.1.186, RHEA:42888), so the general parent is less specific than the evidence supports.
      GO has no term for the reaction (checked against the 2026-07-26 release: no rhea2go or ec2go
      mapping and no OLS match), so the replacement is the new term requested in proposed_new_terms.
      Until GO creates it, GO:0016773 is the most specific existing term and the row stays correct.
      Not GO:0004631 phosphomevalonate kinase activity, which phosphorylates the 5-phosphate of
      mevalonate 5-phosphate to a diphosphate, a different reaction.
    proposed_replacement_terms:
    - id: NTR
      label: mevalonate-3-phosphate 5-kinase activity
    supported_by:
    - reference_id: PMID:24914732
      supporting_text: Of the seven enzymes tested, only Ta0762 showed activity with mevalonate 3-phosphate
    - reference_id: PMID:24914732
      supporting_text: The observed spectrum is consistent with the structure of mevalonate 3,5-bisphosphate.
    - reference_id: PMID:24914732
      supporting_text: >-
        Ta0762 had been computationally annotated as 2-phosphoglycerate kinase, though no activity was
        detected with 2-phosphoglycerate
