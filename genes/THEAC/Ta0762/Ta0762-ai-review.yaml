proposed_new_terms:
- proposed_name: mevalonate-3-phosphate 5-kinase activity
  proposed_definition: >-
    Catalysis of the reaction: (R)-3-phosphomevalonate + ATP = (R)-3,5-bisphosphomevalonate + ADP + H+.
  justification: >-
    EC 2.7.1.186 and RHEA:42888 describe the reaction, which has been demonstrated for recombinant
    T. acidophilum Ta0762 with product identification by 13C NMR (PMID:24914732) and used as an enzymatic
    reagent in an independent study (PMID:28004831). GO has no term: GO:0004631 phosphomevalonate kinase
    activity phosphorylates mevalonate 5-phosphate to the 5-diphosphate, a different reaction, so the
    enzyme is annotated only to the parent GO:0016773. It is the middle step of the three-reaction
    Thermoplasma-type pathway whose other two activities are also missing from GO and are requested in
    the PTO1356 review (mevalonate 3-kinase activity, EC 2.7.1.185, RHEA:42884) and the Ta0893 review
    (mevalonate 3,5-bisphosphate decarboxylase activity, EC 4.1.1.110, RHEA:56500); the three are best
    created together.
  proposed_parent:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:42888
      label: (R)-3-phosphomevalonate + ATP = (R)-3,5-bisphosphomevalonate + ADP + H(+)
  - predicate: skos:exactMatch
    target_term:
      id: EC:2.7.1.186
      label: mevalonate-3-phosphate 5-kinase
  supported_by:
  - reference_id: PMID:24914732
    supporting_text: Of the seven enzymes tested, only Ta0762 showed activity with mevalonate 3-phosphate
  - reference_id: PMID:24914732
    supporting_text: The observed spectrum is consistent with the structure of mevalonate 3,5-bisphosphate.
