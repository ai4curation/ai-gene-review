  label: Thermoplasma acidophilum DSM 1728
description: >-
  Ta0762 (UniProt Q9HK44) of the thermoacidophilic archaeon Thermoplasma acidophilum encodes
  mevalonate-3-phosphate 5-kinase (M3P5K), a 202-residue P-loop NTPase-fold kinase (PANTHER PTHR33477,
  NCBIfam PRK12339) that was first annotated as a 2-phosphoglycerate kinase. It transfers a phosphate
  from ATP to the 5-hydroxyl of (R)-mevalonate 3-phosphate, giving (R)-mevalonate 3,5-bisphosphate and
  ADP; the recombinant enzyme has no activity on 2-phosphoglycerate, and the position of phosphorylation
  was assigned by 13C NMR. This is the second step of the Thermoplasma-type mevalonate pathway of the
  Thermoplasmatales: mevalonate 3-kinase (Ta1305) phosphorylates mevalonate at C3, Ta0762 phosphorylates
  C5, the ATP-independent mevalonate 3,5-bisphosphate decarboxylase (Ta0893) forms isopentenyl phosphate,
  and isopentenyl phosphate kinase forms isopentenyl diphosphate for archaeal ether lipids. The protein
  has not been localised and has no predicted signal peptide or transmembrane segment; as a soluble
  enzyme of an archaeon it acts in the cytoplasm.
existing_annotations:
