    action: ACCEPT
    reason: >-
      GO:0019287 is defined by the mevalonate intermediate, so it covers the Thermoplasmatales variant
      (mevalonate, mevalonate 3-phosphate, mevalonate 3,5-bisphosphate, isopentenyl phosphate,
      isopentenyl diphosphate) as well as the classical route; the sibling Ta0893 and PTO1356 reviews
      accept the same term. Participation test: the protein itself catalyses a step of the process.
    supported_by:
