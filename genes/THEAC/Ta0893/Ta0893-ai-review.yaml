id: Q9HJS1
gene_symbol: Ta0893
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:273075
  label: Thermoplasma acidophilum DSM 1728
description: >-
  Ta0893 (UniProt Q9HJS1) of the thermoacidophilic archaeon Thermoplasma acidophilum encodes
  mevalonate 3,5-bisphosphate decarboxylase (MBD), a 405-residue homodimeric member of the
  GHMP-superfamily diphosphomevalonate decarboxylase family that was first annotated as a
  mevalonate diphosphate decarboxylase. It catalyses the ATP-independent conversion of
  (R)-mevalonate 3,5-bisphosphate to isopentenyl phosphate, CO2 and phosphate, eliminating the
  3-phosphate together with the C1 carboxylate. This is the third step of the Thermoplasma-type
  mevalonate pathway of the Thermoplasmatales: mevalonate 3-kinase (Ta1305) phosphorylates
  mevalonate at C3, mevalonate 3-phosphate 5-kinase (Ta0762) phosphorylates C5, Ta0893
  decarboxylates the bisphosphate, and isopentenyl phosphate kinase forms isopentenyl
  diphosphate. MBD activity was detected in T. acidophilum lysate, co-purified with Ta0893 and
  was reproduced with recombinant Ta0893. The enzyme keeps the Asp/Lys/Arg residues that the
  ATP-dependent decarboxylases need for decarboxylation but has lost both conserved
  ATP-binding residues, consistent with evolution from an ATP-dependent phosphomevalonate
  decarboxylase by loss of the kinase half-reaction. Splitting phosphorylation and
  decarboxylation between two enzymes is proposed to be an adaptation to the low cytoplasmic pH
  of these acidophiles, where the dual-function decarboxylase loses its kinase step. The
  structure of the Picrophilus torridus ortholog shows a conserved catalytic aspartate and a
  hydrophobic cavity at the position of the ancestral ATP site, and that ortholog is activated
  by geranylgeranyl diphosphate.
