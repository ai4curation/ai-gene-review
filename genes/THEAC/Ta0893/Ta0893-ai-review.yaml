- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00057
  review:
    summary: >-
      UniPathway mapping to isopentenyl diphosphate biosynthesis via mevalonate. Ta0893
      catalyses the decarboxylation step of the Thermoplasma-type mevalonate pathway.
    action: ACCEPT
    reason: >-
      GO:0019287 is defined as isopentenyl diphosphate formation via the intermediate mevalonate,
      which includes the Thermoplasma-type route (mevalonate, mevalonate 3-phosphate, mevalonate
      3,5-bisphosphate, isopentenyl phosphate, isopentenyl diphosphate). Ta0893 performs one of
      its steps. The pathway was reconstituted in vitro with the T. acidophilum enzymes
      (Ta1305, Ta0762, Ta0893 and isopentenyl phosphate kinase), and the T. acidophilum lysate
      converts mevalonate 3-phosphate onward to isopentenyl phosphate (PMID:24755225). Core
      process.
    supported_by:
    - reference_id: PMID:28004831
      supporting_text: >-
        Robust ATP consumption was detected when IP kinase was added to a reaction containing
        Ta0893 pre-incubated with (R)-mevalonate 3,5-bisphosphate
    - reference_id: PMID:24755225
      supporting_text: >-
        The product could be converted into isopentenyl phosphate, probably through
        (R)-mevalonate 3,5-bisphosphate, by the action of unidentified T. acidophilum enzymes
        fractionated by anion-exchange chromatography.
      reference_section_type: ABSTRACT
