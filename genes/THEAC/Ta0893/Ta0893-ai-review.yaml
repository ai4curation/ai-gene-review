    - reference_id: PMID:28004831
      supporting_text: >-
        In summary, we have identified and characterized mevalonate 3,5-bisphosphate
        decarboxylase, a novel enzyme which produces isopentenyl phosphate and completes the
        unique mevalonate pathway of extreme acidophiles comprising the archaeal order
        thermoplasmatales.
- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005935
  review:
    summary: >-
      InterPro2GO mapping from IPR005935 to carboxy-lyase activity. Ta0893 is a carboxy-lyase
      (EC 4.1.1.110): it decarboxylates (R)-mevalonate 3,5-bisphosphate to isopentenyl phosphate
      without ATP.
    action: ACCEPT
    reason: >-
      Correct, and at present the most specific GO molecular-function term that describes the
      activity. GO has no term for mevalonate 3,5-bisphosphate decarboxylase activity (searched
      OLS, QuickGO and the ec2go file of GO release 2026-07-26: no mapping for EC 4.1.1.110), and
      neither existing sibling term fits: GO:0004163 diphosphomevalonate decarboxylase activity
      and GO:0090710 phosphomevalonate decarboxylase activity both name ATP-dependent reactions on
      a different substrate, and Ta0893 lacks the ATP-binding residues and needs no ATP. The term
      is therefore kept rather than marked too general; a specific child term is proposed in
      proposed_new_terms and this row should move to it once it exists. MODIFY to that term is
      not used because this row's evidence, the IPR005935 family signature shared with the
      ATP-dependent decarboxylases, does not by itself identify the reaction.
    supported_by:
    - reference_id: PMID:28004831
