proposed_new_terms:
- proposed_name: mevalonate 3,5-bisphosphate decarboxylase activity
  proposed_definition: >-
    Catalysis of the reaction: (R)-3,5-bisphosphomevalonate + H+ = isopentenyl phosphate + CO2 +
    phosphate.
  justification: >-
    EC 4.1.1.110 and RHEA:56500 describe the reaction, which has been demonstrated for
    T. acidophilum Ta0893 and the P. torridus ortholog (PMID:28004831) and studied structurally
    in the latter (PMID:35690147). GO has no term. The existing sibling terms GO:0004163
    diphosphomevalonate decarboxylase activity and GO:0090710 phosphomevalonate decarboxylase
    activity describe ATP-dependent reactions on other substrates and cannot be used; the
    Thermoplasmatales MBDs are currently annotated only to GO:0016831 carboxy-lyase activity.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:56500
      label: (R)-3,5-bisphosphomevalonate + H(+) = isopentenyl phosphate + CO2 + phosphate
  - predicate: skos:exactMatch
    target_term:
      id: EC:4.1.1.110
      label: bisphosphomevalonate decarboxylase
  supported_by:
  - reference_id: PMID:28004831
    supporting_text: >-
      Here we report the identification of MBD from T. acidophilum, which produces IP through
      the ATP independent decarboxylation of mevalonate 3,5-bisphosphate
  - reference_id: PMID:35690147
    supporting_text: >-
      The enzyme catalyzes the elimination of the 3-phosphate group from mevalonate
      3,5-bisphosphate as well as concomitant decarboxylation of the substrate.
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Is the geranylgeranyl diphosphate activation seen for the P. torridus ortholog also a
    property of Ta0893, and does it act as a feed-forward or feedback control of isoprenoid
    supply in vivo?
- question: >-
    Why do the Thermoplasmatales place mevalonate 3-phosphate 5-kinase between the 3-kinase and
    the decarboxylase, rather than decarboxylating mevalonate 3-phosphate directly?
suggested_experiments:
- hypothesis: >-
    Ta0893 is regulated by geranylgeranyl diphosphate as its P. torridus ortholog is.
  description: >-
    Produce soluble Ta0893 (N-terminally truncated or chaperone co-expressed), measure MBD kinetics
    at pH 5 to 6 and 60 C with and without geranylgeranyl diphosphate, and test mutants at the
    residues corresponding to the PtoMBD cavity that abolished activation.
  experiment_type: enzyme kinetics and site-directed mutagenesis
knowledge_gaps:
- gap_statement: >-
    The physiological role of geranylgeranyl diphosphate binding to mevalonate 3,5-bisphosphate
    decarboxylases is unknown; activation has been shown only in vitro, for the P. torridus
    ortholog, and not for Ta0893 or in cells.
  boundary: >-
    Ta0893 is the T. acidophilum MBD (PMID:28004831); the P. torridus ortholog binds a fatty
    acid-like ligand at the former ATP site and is activated by geranylgeranyl diphosphate in
    vitro (PMID:35690147).
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:35690147
    supporting_text: >-
      suggesting the physiological importance of ligand binding as well as a possible novel
      regulatory system employed by the Thermoplasma-type mevalonate pathway.
    reference_section_type: ABSTRACT
