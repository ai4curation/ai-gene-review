    summary: >-
      InterPro2GO mapping from IPR005935 (mevalonate-pathway decarboxylase family). Ta0893
      produces isopentenyl phosphate, the precursor of isopentenyl diphosphate used for the
      isoprenoid chains of archaeal lipids.
    action: ACCEPT
    reason: >-
      True broad pathway term. Every characterised member of IPR005935, including this
      ATP-independent decarboxylase, supplies isoprenoid precursors, so the family-level mapping
      is correct for Ta0893. The more specific GO:0019287 is also present (UniPathway row) and
      accepted; the broader term is kept as accurate context, as in the sibling MVD reviews.
