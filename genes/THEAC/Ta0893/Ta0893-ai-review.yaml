- id: PMID:28004831
  title: An Adaptation To Life In Acid Through A Novel Mevalonate Pathway.
  findings:
  - statement: >-
      MBD activity in T. acidophilum lysate co-fractionated with Ta0893 (mass spectrometry of
      active native-gel fragments), and recombinant Ta0893 (N-terminally truncated, or
      co-expressed with GroES/GroEL) showed MBD activity with the same apparent native size.
    supporting_text: >-
      The finding that MBD activity in E. coli is dependent on Ta0893 expression and correlates
      with the same molecular weight as activity in T. acidophilum lysate, strongly suggests that
      Ta0893 is the missing MBD.
  - statement: >-
      Ta0893 is a homodimer (apparent 89 kDa for a 46.3 kDa monomer).
    supporting_text: suggesting that Ta0893 is a native homodimer
  - statement: >-
      The detailed biochemistry was done on the P. torridus ortholog because Ta0893 expressed
      poorly; that ortholog is specific for mevalonate 3,5-bisphosphate.
    supporting_text: >-
      torridus MBD showed clear specificity for mevalonate 3,5-bisphosphate and no detectable
      decarboxylase activity on mevalonate, mevalonate 3-phosphate, mevalonate 5-phosphate or
      mevalonate 5-pyrophosphate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary identification of Ta0893 as MBD; full text cached. Direct evidence on Ta0893 is
      activity-guided purification from the native organism plus activity of recombinant protein
      (truncated or chaperone co-expressed) and coupled-assay product identification; kinetics
      and substrate specificity were measured on the P. torridus ortholog, not on Ta0893.
