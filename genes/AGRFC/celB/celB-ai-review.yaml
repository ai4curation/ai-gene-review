    reason: 'CelB is a structural component of cellulose synthase; CelA performs UDP-glucose glycosyl
      transfer. BcsB-specific domains and the homolog BcsAB structure support direct participation by
      organizing the synthesis complex, independently of mutant necessity. GO:0030244 lies under glucan/polysaccharide
      biosynthesis. It is not a descendant of UDP-glucose metabolism: this is an explicit role correction,
      not a claimed hierarchical refinement. Same-role QuickGO checks on E. coli P37652 and P. putida
      Q88JL3 found the same broad donor-metabolism annotation and no cellulose-biosynthesis row. That
      absence is not evidence of a gap; the replacement rests on structural participation and the conserved
      family, not on annotation counting. No duplicate NEW process row is added, and no target GO-CAM
      was present in the index.'
