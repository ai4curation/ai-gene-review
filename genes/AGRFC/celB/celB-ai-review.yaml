taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: CelB (Atu3308) is the noncatalytic, membrane-anchored partner of cellulose synthase CelA
  in Agrobacterium fabrum C58. Its AcsB/BcsB-family carbohydrate-binding and flavodoxin-like domains are
  predicted to occupy the periplasm, with a C-terminal transmembrane anchor connecting the protein to
  the inner membrane. It supports cellulose synthesis and handling of the emerging glucan; glycosyl transfer
  and the established c-di-GMP switch reside in CelA.
