id: A9CEZ7
gene_symbol: celA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: CelA (Atu3309) is the membrane-embedded catalytic subunit of the Agrobacterium fabrum C58
  cellulose synthase. Its glycosyltransferase domain uses UDP-glucose to extend beta-1,4-glucan, while
  the transmembrane region provides the path for the nascent chain across the inner membrane. A C-terminal
  PilZ domain mediates c-di-GMP-dependent activation. Cellulose production contributes to stable association
  with plant surfaces and extracellular aggregates.
