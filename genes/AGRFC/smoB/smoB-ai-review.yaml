  - InterPro:IPR020471
  review:
    summary: Correct but uninformative; SmoB is an NADPH-dependent CH-OH oxidoreductase (6-dehydroglucose
      reductase, EC 1.1.1.432).
    action: MODIFY
    reason: The InterPro2GO mapping from the AKR signatures is true but very general. The measured reaction
      (D-glucose + NADP+ = 6-dehydro-D-glucose + NADPH, RHEA:70779) acts on a CH-OH donor with NADP as
      acceptor, so GO:0016616 is the most specific existing descendant; a dedicated 6-dehydroglucose reductase
      term is proposed below.
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: 'Only enzymatic reactions conducted in the presence of NADP+ produced product labeled
        with 18O at C6: NAD+ failed to produce any product, supporting our observations by ITC and defining
        the cofactor specificity of SmoB.'
