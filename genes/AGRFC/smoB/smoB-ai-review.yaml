id: A9CEY6
gene_symbol: smoB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: SmoB (Atu3278) is a homotrimeric NADPH-dependent aldo-keto reductase of Agrobacterium fabrum
  (A. tumefaciens) C58, encoded in the smoA-smoI sulfoquinovose monooxygenase gene cluster that is induced
  during growth on sulfoquinovose. It reduces 6-dehydro-D-glucose (6-oxo-glucose), the aldehyde released
  when the monooxygenase SmoC removes sulfite from sulfoquinovose, back to D-glucose, so that the sugar
  skeleton of the sulfosugar enters central carbon metabolism. SmoB binds NADPH but not NADH, and its
  crystal structures with NADPH and glucose show a classical (alpha/beta)8-barrel AKR fold with the conserved
  His/Tyr/Lys/Asp catalytic tetrad positioned for hydride transfer to C6.
