suggested_questions:
- question: What are the steady-state kinetic parameters of SmoB for 6-dehydroglucose, given that activity
    has so far been shown only by equilibrium isotope exchange from glucose?
suggested_experiments:
- experiment_type: coupled steady-state kinetics
  description: Generate 6-dehydroglucose in situ with SmoA/SmoC from SQ and follow NADPH consumption
    by SmoB at varying SQ and NADPH concentrations to obtain kcat and KM in the physiological direction.
