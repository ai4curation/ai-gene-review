      record_section: ["CC:FUNCTION"]
      supporting_text: dependent reduction of 6-dehydro-D-glucose to D-glucose
    proposed_replacement_terms:
    - id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
- term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  evidence_type: IDA
  original_reference_id: PMID:35074914
  qualifier: involved_in
  review:
    summary: SmoB catalyzes the final step of the sulfo-SMO pathway, converting the desulfonated C6 aldehyde
      to glucose.
    action: NEW
    reason: SmoB catalyzes a step of the pathway itself (reduction of 6-dehydroglucose, the product of
      SmoC-catalyzed SQ desulfurization, to glucose), shown by NADP+-dependent 18O exchange at glucose C6
      and by ternary NADPH-glucose crystal structures; the cluster proteins are induced on SQ. Comparator
      check - the terminal 3-sulfolactaldehyde reductase YihU of the E. coli sulfo-EMP route is the same
      kind of route-completing NAD(P)H-dependent reductase and carries GO:1902777 (IEP and IEA). The precomposed sulphoglycolysis
      term GO:0061722 does not apply because its definition ends in DHAP and pyruvate.
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: 'Only enzymatic reactions conducted in the presence of NADP+ produced product labeled
        with 18O at C6: NAD+ failed to produce any product, supporting our observations by ITC and defining
        the cofactor specificity of SmoB.'
    - reference_id: PMID:35074914
      supporting_text: The SMO pathway includes several proteins with hitherto undescribed activities, including
        an SQGro-binding protein; an FMNH2- and O2-dependent SQ monooxygenase that defines this “SMO” pathway
        by catalyzing scission of the C–S bond in SQ; and an oxidoreductase dedicated to the NADPH-dependent
        reduction of 6-OG to glucose.
