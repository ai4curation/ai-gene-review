  proposed_definition: 'Catalysis of the reaction: D-glucose + NADP+ = 6-dehydro-D-glucose + NADPH +
    H+ (RHEA:70779, EC 1.1.1.432).'
  justification: The reaction has an EC number and a Rhea entry but no GO term or rhea2go/ec2go mapping.
    It is the terminal step of the sulfo-SMO and sulfo-ASDO sulfoquinovose pathways and is catalyzed by
    characterized AKR enzymes (A. fabrum SmoB, Novosphingobium SquF).
