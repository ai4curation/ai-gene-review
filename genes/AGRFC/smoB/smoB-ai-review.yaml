  review:
    summary: SmoB is a soluble cytoplasmic aldo-keto reductase acting on an intracellular pathway intermediate.
    action: KEEP_AS_NON_CORE
    reason: SmoB has no signal peptide or transmembrane segment, behaves as a soluble trimer, and acts on
      6-dehydroglucose produced inside the cell after SQ and SQGro are imported by the Smo ABC transporter
      and processed by cytoplasmic SmoI and SmoC. The TreeGrafter cytosol transfer from the PTHR43364 lineage
      is therefore plausible, though not directly assayed; location is peripheral to the catalytic function.
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: SQ or its glycoside sulfoquinovosyl glycerol are imported into the cell by an ATP-binding
        cassette transporter system with an associated SQ binding protein.
    - reference_id: PMID:35074914
      supporting_text: This protein maintained the same catalytic activity, and SEC-MALS confirmed it remained
        a trimer in solution
