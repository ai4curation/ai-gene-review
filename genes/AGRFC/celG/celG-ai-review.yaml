gene_symbol: celG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: CelG is a tetratricopeptide-repeat-like protein encoded in the cellulose-associated region
  of Agrobacterium fabrum C58. Related type III cellulose loci encode BcsK proteins with TPR domains but
  without the C-terminal porin domain of BcsC. Agrobacterium celG insertion mutants have been reported
  to overproduce cellulose. The molecular role and cellular location of the current 748-residue CelG protein
  remain unresolved, including whether it organizes cellulose machinery or modulates its output.
references:
- id: PMID:16167770
  title: The effect of cellulose overproduction on binding and biofilm formation on roots by Agrobacterium
    tumefaciens.
  findings:
  - statement: Mutations reported in celG cause cellulose overproduction assessed by chemical fractionation
      and methylation analysis. This does not establish an essential export pore or a direct negative-regulatory
      activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only the cached abstract was accessible; its explicit statements are used without reconstructing
      unseen figures or claiming isolated target-protein assays.
- id: PMID:26077867
  title: 'Bacterial cellulose biosynthesis: diversity of operons, subunits, products, and functions.'
  findings:
  - statement: Type III cellulose loci lack BcsC; BcsK/CelG-like proteins have TPR domains without the
      BcsC C-terminal porin domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text examined; homolog structural evidence is distinguished from direct
      Agrobacterium experiments.
- id: PMID:29998422
  title: Function and Regulation of Agrobacterium tumefaciens Cell Surface Structures that Promote Attachment.
  findings:
  - statement: The synthesis acknowledges the unresolved mechanistic basis of the celG overproduction
      phenotype.
    supporting_text: The mechanistic basis for the surprising phenotype of this mutant, given the predicted
      central role for CelG, warrants further investigation.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The explicit admission that the phenotype is unexplained is supported. The outer-membrane
      secretin description overstates the evidence: the cited 2015 review describes a TPR protein lacking
      the BcsC porin domain. Historical Table2 lengths/locus identifiers also disagree with current records;
      no pore or localization assertion is transferred.'
