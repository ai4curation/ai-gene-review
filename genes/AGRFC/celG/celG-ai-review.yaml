      or porin feature.
    supporting_text: DR   InterPro; IPR011990; TPR-like_helical_dom_sf.
- id: file:AGRFC/celG/celG-source-analysis/OSTI840242.txt
  title: Primary-author DOE final report on Agrobacterium cellulose synthesis, 2000–2004
  findings:
