core_functions: []
knowledge_gaps:
- gap_statement: The direct molecular activity, interaction partners and cellular location of C58 CelG
    are undetermined; no demonstrated BcsC-like outer-membrane channel function explains the reported
    cellulose-overproduction phenotype.
  boundary: The current protein has TPR-like domains, and insertion mutants described as celG overproduce
    cellulose. Exact mapping of the historical mutant and 781-residue model to current 748-residue Atu8186
    requires verification.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  provenance:
  - reference_id: PMID:29998422
    supporting_text: The mechanistic basis for the surprising phenotype of this mutant, given the predicted
      central role for CelG, warrants further investigation.
  resolution: Verify the historical mutant locus and current gene start, then construct a nonpolar deletion
    with native-locus complementation; measure cellulose, protein localization and interactions with CelA/CelB.
suggested_questions:
- question: Does the historical celG insertion affect current Atu8186, adjacent gene expression, or a
    differently annotated ORF?
- question: Does CelG organize a periplasmic complex, act from another compartment, or indirectly alter
    cellulose output?
