  review:
    summary: Native C58 deletion and metabolite analysis establish the spermidine pathway.
    action: NEW
    reason: 'PMID:26682642 measures metabolites in native C58 locus deletions: ΔAtu4170 lacks spermidine
      and accumulates putrescine, while ΔAtu4169 accumulates carboxyspermidine. This identifies successive
      enzyme steps, rather than merely a requirement for growth. The gene product catalyzes conversion
      of carboxyspermidine to spermidine; CASDH supplies its substrate. Table S1 maps the construct to
      WP_010973611, whose sequence matches A9CG65 exactly. Same-role product-forming catalysts Vibrio
      NspC Q9KRL4 and E. coli SpeE P09158 both carry GO:0008295 in QuickGO (2026-11-05); this checks the
      participation convention without treating their annotations as evidence for this target. The term
      is under polyamine biosynthesis, not a downstream growth or siderophore process. GO:0008295 is not
      an ancestor or descendant of the separate spermine, thermospermine or norspermidine process terms;
      no broader polyamine BP is added. Native physiological participation is established for C58.'
    supported_by:
