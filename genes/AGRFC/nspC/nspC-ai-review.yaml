- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: The accession-matched CASDH/CASDC pair synthesizes spermidine when expressed in spermidine-deficient
      E. coli; this is pathway reconstruction, not a purified-enzyme kinetic assay.
    supporting_text: Fig. 2 shows that all CASDH/CASDC pairs were able to synthesize spermidine in the
      spermidine-void BL21speD cells.
  - statement: LC-MS/MS resolves both spermine and thermospermine made by the reconstructed pair.
    supporting_text: Table 1 shows that both Spm and Tspm were produced by each CASDH/CASDC pair.
  - statement: CASDH expression alone produces carboxyspermine/carboxythermospermine in a spermidine-replete
      host; these intermediate isomers were not distinguished.
    supporting_text: However, in the spermidine-replete BL21speG, the CASDHs of A. tumefaciens and P. denitrificans
      efficiently produce C-Spm/C-Tspm.
  - statement: Fed homospermidine and norspermidine reveal additional substrate scope, with unknown relative
      uptake and no native-flux inference.
    supporting_text: Consistent with this, approximately 5- to 8-fold more N1-aminopropylhomospermidine
      was produced by the A. tumefaciens, P. denitrificans, and B. abortus CASDH/CASDC pairs, compared
      to norspermine, when expressed in spermidine-void BL21speD grown with 500 μM homospermidine or norspermidine
      (Fig. S1).
  - statement: 'Native tetraamine observations support physiological plausibility of the CASDH/CASDC route
      but do not establish separate spermine and thermospermine processes for this gene: the historical
      native measurements did not distinguish the two products.'
    supporting_text: These studies did not resolve Spm from the same mass isomer Tspm.
  - statement: The absence of canonical aminopropyltransferase machinery strengthens the alternative-route
      hypothesis; it does not identify which tetraamine isomer this native locus produces.
    supporting_text: However, unlike all known prokaryotic and eukaryotic species that produce Spm or
      Tspm, A. tumefaciens and P. denitrificans do not encode AdoMetDC or an APT.
- id: PMID:26682642
  title: The Essential Role of Spermidine in Growth of Agrobacterium tumefaciens Is Determined by the
    1,3-Diaminopropane Moiety.
  findings:
  - statement: C58 locus-specific deletions and intermediate accumulation establish the order and physiological
      role of CASDH and CASDC.
    supporting_text: Compared to the C58 wild-type strain, the ΔCASDH (Atu4170) strain accumulates putrescine
      and homospermidine but lacks spermidine (Supporting Information Figure 1A); the ΔCASDC (Atu4169)
      strain accumulates carboxyspermidine, some putrescine and a small amount of homospermidine (Supporting
      Information Figure 2A).
  - statement: Fed diamines in the ODC deletion background reveal conditional norspermidine and aminopropylcadaverine
      production.
    supporting_text: The ΔODC strain allowed us to replace putrescine with 1,3-diaminopropane resulting
      in synthesis of norspermidine, and also with cadaverine, resulting in synthesis of aminopropylcadaverine
      and the corresponding tetraamine bis(aminopropyl)cadaverine or its isomer aminopentylnorspermidine.
  - statement: Figure 4C detects an unresolved spermine/thermospermine pool in C58 wild type treated with
      the ODC inhibitor DFMO. The manipulated enzyme is ODC; this experiment does not establish native
      isomer-specific flux through either CASDH or CASDC.
    supporting_text: The presence of spermine/thermospermine (Figure 2) was confirmed by LC-MS of the
      benzoylated cell extracts, which detected a peak at m/z 619.3, corresponding to the tetrabenzoylated
      spermine or thermospermine (Figure 4C).
