id: A9CG65
gene_symbol: nspC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: nspC is a carboxyspermidine decarboxylase of the NspC family that catalyzes the second step
  of the aspartate semialdehyde-dependent spermidine pathway, converting carboxyspermidine to spermidine.
  It is a predicted cytoplasmic, pyridoxal phosphate-dependent enzyme. Native C58 deletion and metabolite
  analysis establish the spermidine pathway. The enzyme pair also produces spermine and thermospermine
  through carboxylated intermediates in heterologous E. coli reconstruction. In C58, replacing putrescine
  supply with 1,3-diaminopropane or cadaverine permits synthesis of norspermidine or aminopropylcadaverine.
  Additional tetraamine products are detected when homospermidine or norspermidine is supplied to the
  reconstructed pathway; these activities do not establish the predominant substrates in the native bacterium.
