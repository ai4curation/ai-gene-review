id: A9CEZ0
gene_symbol: smoI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: SmoI (Atu3285, AtSQase) is the glycoside hydrolase family 31 sulfoquinovosidase of Agrobacterium
  fabrum (A. tumefaciens) C58, encoded at the end of the smoA-smoI sulfoquinovose monooxygenase gene cluster
  that is induced during growth on sulfoquinovose. It hydrolyzes the alpha-glycosidic bond of sulfoquinovosyl
  glycerol (SQGro), the deacylated head group of the plant sulfolipid, to release free sulfoquinovose and
  glycerol; it prefers the natural 2'R stereoisomer of SQGro and is inactive on the corresponding glucoside.
  The released sulfoquinovose is then desulfurized by the monooxygenase SmoC, which cannot act on the
  glycoside. Crystal structures show an (alpha/beta)8 barrel with appended beta-sandwich domains and a
  sulfonate-binding Arg/Trp/Tyr triad that, with second-shell residue pairing, confers selectivity for
  sulfosugars.
