- term:
    id: GO:1990929
    label: sulfoquinovosidase activity
  evidence_type: IDA
  original_reference_id: PMID:30276262
  qualifier: enables
  review:
    summary: Purified SmoI (AtSQase) hydrolyzes SQGro and PNPSQ but not PNPGlc.
    action: NEW
    reason: Direct kinetic assay of the recombinant enzyme (kcat 22.3 s-1, KM 0.21 mM on PNPSQ), hydrolysis
      of both SQGro epimers with preference for 2'R, a pseudo-Michaelis SQGro complex structure, and loss
      of activity in active-site mutants establish sulfoquinovosidase activity. The GO definition is written
      with SQDG as substrate (RHEA:49452) whereas SmoI was assayed on SQGro (RHEA:70727); both are 6-sulfo-alpha-D-quinovosides
      hydrolyzed at the same glycosidic bond, and the term name and its PAINT placement on GH31 SQases (PTN002333608)
      cover the activity. Paper 30276262 names the expressed construct by RefSeq WP_035199431, and PMID:35074914
      confirms it as the Atu3285 (smoI) product.
    supported_by:
    - reference_id: PMID:30276262
      supporting_text: AtSQase exhibited high specificity for 4-nitrophenyl α-d-sulfoquinovoside (PNPSQ)
    - reference_id: PMID:30276262
      supporting_text: AtSQase hydrolyzed both epimers of SQGro, with a preference for the natural 2′R
        isomer
    - reference_id: PMID:35074914
      supporting_text: We previously reported that Atu3285 (smoI) encodes an SQase that preferentially
        hydrolyzes 2'R-SQGro, the natural stereoisomer of this glycoside
