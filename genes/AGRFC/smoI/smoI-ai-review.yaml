  review:
    summary: Superfamily-level mapping from the galactose mutarotase-like beta-sandwich domain; no separate
      carbohydrate-binding function is shown.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR011013 is a structural superfamily signature for an N-terminal beta-sandwich domain. In
      SmoI the sulfosugar is recognized in the catalytic (alpha/beta)8 barrel by the Arg283/Trp286/Tyr491
      triad and the aglycone by Arg438 and Glu135; binding of SQGro is the substrate-binding step of the
      glycosidase reaction, not an independent carbohydrate-binding activity, and no lectin-like binding
      by the appended domain has been reported.
    supported_by:
