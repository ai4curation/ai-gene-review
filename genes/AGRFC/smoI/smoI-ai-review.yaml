suggested_questions:
- question: Should GO:1990929 sulfoquinovosidase activity be generalized from SQDG to any 6-sulfo-alpha-D-quinovoside
    (SQGro, SQDG, methyl alpha-sulfoquinovoside), given that the characterized GH31 SQases are assayed
    mainly on SQGro and chromogenic analogues?
- question: Does SmoI hydrolyze intact or lyso SQDG in vivo, or does A. tumefaciens rely on other lipases
    to deacylate plant sulfolipid to SQGro first?
suggested_experiments:
- experiment_type: substrate profiling
  description: Assay recombinant SmoI on SQDG, lyso-SQDG and SQGro under matched conditions, and test
    growth of a smoI deletion on each substrate versus free SQ.
