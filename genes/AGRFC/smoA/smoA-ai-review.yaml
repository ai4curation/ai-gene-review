gene_symbol: smoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: SmoA (Atu3277) is a small non-flavoprotein-family flavin reductase of Agrobacterium fabrum
  (A. tumefaciens) C58, encoded at the start of the smoA-smoI sulfoquinovose monooxygenase gene cluster
  that is induced during growth on sulfoquinovose. The purified enzyme copurifies with FMN and catalyzes
  the NADH-dependent reduction of FMN to FMNH2, with NADH strongly preferred over NADPH. The reduced flavin
  is the cosubstrate of the two-component sulfoquinovose monooxygenase SmoC, so SmoA acts as the reductase
  component of the oxidative desulfurization step that releases sulfite and 6-dehydroglucose from sulfoquinovose,
  allowing the cell to use all six carbons of this plant-derived sulfosugar.
