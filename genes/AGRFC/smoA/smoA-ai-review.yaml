suggested_questions:
- question: Does SmoA transfer FMNH2 to SmoC through a specific protein-protein complex, as proposed
    for SsuE/SsuD, or by free diffusion of reduced flavin?
suggested_experiments:
- experiment_type: protein interaction and flavin-transfer kinetics
  description: Test SmoA-SmoC association (cross-linking, ITC or SEC-MALS) and compare coupled sulfite
    release with SmoA versus a non-partner flavin reductase at matched FMNH2 production rates.
