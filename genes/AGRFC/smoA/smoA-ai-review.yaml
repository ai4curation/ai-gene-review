  - PANTHER:PTN001252946
  review:
    summary: TreeGrafter transfer of an NADPH-dependent riboflavin reductase activity; SmoA is an NADH-preferring
      FMN reductase.
    action: MODIFY
    reason: The flavin reductase essence is sound but both specifics are wrong for SmoA. The measured
      substrate is FMN (riboflavin was not tested), and NADPH supports only about 0.2% of the NADH catalytic
      efficiency (kcat/KM 6.8 x 10^2 versus 4.1 x 10^5 M-1 s-1, NADPH not saturable). The TreeGrafter
      graft at PTN001252946 therefore over-specifies the reductant and flavin; the row is corrected laterally
      to the experimentally supported FMN reductase (NADH) activity already on the gene.
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: With NADH, the kinetic parameters were KM = 35 ± 5 µM, kcat = 14.5 ± 0.5 s−1, and
        kcat/KM = 4.1 × 105 M−1 s−1, while for NADPH, saturation was not observed and kcat/KM = 6.8 × 102
        M−1 s−1, indicating that NADH is the preferred cofactor for SmoA
    proposed_replacement_terms:
