- term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  evidence_type: IDA
  original_reference_id: PMID:35074914
  qualifier: involved_in
  review:
    summary: SmoA supplies the FMNH2 cosubstrate of the sulfoquinovose C-S cleavage step.
    action: NEW
    reason: SmoA does part of the work of the step rather than merely being required for it. It is the
      reductase component of the two-component SQ monooxygenase, generating the FMNH2 that SmoC consumes
      to cleave the C-S bond of SQ (cofactor-supply case), and its protein abundance rises with the rest
      of the cluster during growth on SQ. Comparator check - E. coli SsuE, the reductase partner of the
      alkanesulfonate monooxygenase SsuD, carries GO:0046306 alkanesulfonate catabolic process by IDA,
      so the reductase tier of a two-component desulfonation system is conventionally annotated to the
      catabolic process it supplies.
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: SmoC was incubated with SQ in the presence of SmoA, FMN, and NADH, which generate
        FMNH2 in situ
    - reference_id: PMID:35074914
      supporting_text: The largest and most significant change we observed was an increase in the abundance
        of proteins encoded by a single cluster of genes (Atu3277-Atu3285) for cells grown on SQ.
    - reference_id: file:AGRFC/smoA/smoA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: FMNH(2) is then transferred to the sulfoquinovose monooxygenase SmoC (PubMed:35074914).
