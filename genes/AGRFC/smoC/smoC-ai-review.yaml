- term:
    id: GO:0046306
    label: alkanesulfonate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000768559
  review:
    summary: SmoC degrades sulfoquinovose, not the aliphatic alkanesulfonates of the Ssu sulfur-scavenging
      system.
    action: MODIFY
    reason: 'GO:0046306 covers breakdown of alkanesulfonates, "sulfonic acid derivatives containing an
      aliphatic hydrocarbon group", the process of the PAINT seed SsuD. SmoC instead acts in catabolism
      of the sulfosugar sulfoquinovose as a carbon source and is inactive on other sulfonates tested; A.
      tumefaciens does not grow on pentanesulfonate, MES, HEPES or other alkylsulfonates. The specific
      process term GO:1902777 6-sulfoquinovose(1-) catabolic process exists and is the correct replacement
      (a lateral correction, since GO:1902777 is not a descendant of GO:0046306).'
    supported_by:
    - reference_id: PMID:35074914
      supporting_text: No activity was observed when SQ was replaced with other sulfonates, including SQGro
        (the precursor to SQ) or HEPES (an unrelated sulfonate) demonstrating that, unlike the promiscuous
        SsuD, SmoC has high specificity for SQ
    - reference_id: PMID:35074914
      supporting_text: 'The unique SQ monooxygenase activity of SmoC defines this pathway: it is the enzyme
        that effects fissure of the C–S bond in SQ'
    proposed_replacement_terms:
    - id: GO:1902777
      label: 6-sulfoquinovose(1-) catabolic process
