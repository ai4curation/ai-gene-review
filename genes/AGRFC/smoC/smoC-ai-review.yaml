- id: PMID:35074914
  title: Oxidative desulfurization pathway for complete catabolism of sulfoquinovose by bacteria.
  findings:
  - statement: SmoC cleaves the C-S bond of SQ in a FMNH2-dependent sulfite-release assay.
    supporting_text: 'The unique SQ monooxygenase activity of SmoC defines this pathway: it is the enzyme
      that effects fissure of the C–S bond in SQ'
  - statement: SmoC is specific for SQ and inactive on SQGro and HEPES.
    supporting_text: No activity was observed when SQ was replaced with other sulfonates, including SQGro
      (the precursor to SQ) or HEPES (an unrelated sulfonate) demonstrating that, unlike the promiscuous
      SsuD, SmoC has high specificity for SQ
  - statement: SQ binds SmoC without flavin; SQGro does not bind.
    supporting_text: SQ was found to bind SmoC with Kd = 3 µM in the absence of any flavin-based cofactors,
      whereas no binding was detected for SQGro
  - statement: SmoC is a homodimer.
    supporting_text: The corresponding low-resolution map suggested that SmoC exists as a dimer, which
      was confirmed in solution by size exclusion chromatography–multiangle light scattering (SEC-MALS)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of SmoC; full text cached (PMC8795539). Activity was shown with
      SmoA/FMN/NADH generating FMNH2 in situ and sulfite detected by Ellman's reagent; 6-dehydroglucose
      was not detected directly but its reduction product is established through SmoB.
