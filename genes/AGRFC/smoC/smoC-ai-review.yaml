suggested_questions:
- question: Which active-site residues beyond the conserved sulfonate-binding constellation (Trp206,
    Arg236, His238, Tyr341, His343 in RoSmoC) confer SmoC's specificity for sulfoquinovose over other
    alkanesulfonates?
suggested_experiments:
- experiment_type: substrate-complex structure and mutagenesis
  description: Obtain a SmoC (or RoSmoC) structure with SQ or a non-reactive SQ analogue bound, and
    swap candidate specificity residues with their SsuD counterparts to test gain of pentanesulfonate
    activity.
