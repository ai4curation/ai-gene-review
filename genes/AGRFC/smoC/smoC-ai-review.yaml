proposed_new_terms:
- proposed_name: sulfoquinovose monooxygenase activity
  proposed_definition: 'Catalysis of the reaction: 6-sulfo-D-quinovose + FMNH2 + O2 = 6-dehydro-D-glucose
    + FMN + sulfite + H2O + 2 H+ (RHEA:70775, EC 1.14.14.181).'
  justification: The reaction has an EC number and a Rhea entry but no GO term or rhea2go/ec2go mapping.
    SmoC (and Novosphingobium SquD) are SQ-specific and do not share the broad substrate range of SsuD,
    so a child of alkanesulfonate monooxygenase activity would record the physiologically relevant substrate.
  proposed_parent:
