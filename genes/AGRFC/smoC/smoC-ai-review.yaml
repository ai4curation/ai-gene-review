gene_symbol: smoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:176299
  label: Agrobacterium fabrum str. C58
description: SmoC (Atu3279) is the sulfoquinovose monooxygenase of Agrobacterium fabrum (A. tumefaciens)
  C58, a homodimeric bacterial-luciferase-like TIM-barrel enzyme of the SsuD family. Using reduced FMN
  supplied by the NADH-dependent flavin reductase SmoA and molecular oxygen, it cleaves the C-S bond of
  free sulfoquinovose (6-deoxy-6-sulfo-D-glucose), releasing sulfite and 6-dehydro-D-glucose (6-oxo-glucose),
  which SmoB then reduces to glucose. Unlike the promiscuous alkanesulfonate monooxygenase SsuD, SmoC
  is highly specific for sulfoquinovose and does not act on sulfoquinovosyl glycerol or unrelated sulfonates.
  This oxidative desulfurization step defines the sulfoquinovose monooxygenase (sulfo-SMO) pathway, which
  lets the bacterium use all six carbons of the plant sulfolipid head group and is widespread in Rhizobiales.
existing_annotations:
- term:
    id: GO:0008726
    label: alkanesulfonate monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000768559
  review:
    summary: SmoC is an FMNH2- and O2-dependent sulfonate monooxygenase whose physiological substrate
      is sulfoquinovose.
    action: ACCEPT
    reason: 'GO:0008726 is defined as "an alkanesulfonate + O2 + FMNH2 = an aldehyde + sulfite + H2O +
      FMN". The SmoC reaction (RHEA:70775) is exactly this transformation applied to sulfoquinovose, whose
      C6 is a primary alkyl sulfonate (R-CH2-SO3-) that becomes the C6 aldehyde of 6-dehydroglucose, so
      the term is correct for SmoC. It is the most specific existing GO term; the SQ-specific activity
      (EC 1.14.14.181) has no GO term and is proposed below. The TreeGrafter graft is to PAINT node PTN000768559,
      which the PTHR42847 family review judges too deep for the whole family (it also covers RutA), but
      for SmoC itself the transferred activity is confirmed by direct assay.'
    supported_by:
    - reference_id: file:AGRFC/smoC/smoC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the oxidative desulfurization of sulfoquinovose to sulfite and 6-dehydro-D-glucose
        (PubMed:35074914).
    - reference_id: PMID:35074914
      supporting_text: 'The unique SQ monooxygenase activity of SmoC defines this pathway: it is the enzyme
        that effects fissure of the C–S bond in SQ'
