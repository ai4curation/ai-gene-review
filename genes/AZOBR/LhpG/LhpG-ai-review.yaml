id: Q08IB7
gene_symbol: LhpG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: >-
  LhpG (KGSADH-III) is one of three alpha-ketoglutaric semialdehyde
  dehydrogenase isozymes of Azospirillum brasilense. It is a homodimeric
  aldehyde dehydrogenase-family enzyme that oxidizes 2,5-dioxopentanoate
  (alpha-ketoglutaric semialdehyde) to 2-oxoglutarate, the terminal step of
  bacterial trans-4-hydroxy-L-proline catabolism. It was purified from cells
  grown on hydroxy-L-proline and is the hydroxyproline-inducible isozyme, as
  distinct from the D-glucarate/D-galactarate-inducible KGSADH-II and the
  L-arabinose-pathway KGSADH-I. The enzyme uses either NADP+ or NAD+, with a
  roughly 75-fold lower Km for NADP+ and a higher Vmax with NAD+, so both
  cofactor-specific reactions are part of its measured activity.
