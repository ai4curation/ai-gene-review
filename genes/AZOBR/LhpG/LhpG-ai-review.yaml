- term:
    id: GO:0019470
    label: trans-4-hydroxy-L-proline catabolic process
  evidence_type: IEP
  original_reference_id: PMID:17202142
  qualifier: involved_in
  review:
    summary: LhpG is the hydroxyproline-inducible KGSADH isozyme and performs the terminal step of the route.
    action: NEW
    reason: >-
      The GOA rows cover only the molecular function. The enzyme carries out
      the last chemical step of hydroxyproline catabolism, converting
      2,5-dioxopentanoate to 2-oxoglutarate, so it does part of the work of
      the process rather than merely being required for it. Its assignment to
      this route, as opposed to the aldarate route served by the paralogous
      KGSADH-II, rests on expression: it was purified from
      hydroxy-L-proline-grown cells and is described as the
      hydroxy-L-proline-inducible isozyme, which is why IEP is the evidence
      code rather than IDA. UniProt records the same pathway placement from
      the same study.
    supported_by:
    - reference_id: PMID:17202142
      supporting_text: hydroxy-l-proline-inducible KGSADH-III
    - reference_id: PMID:17202142
      supporting_text: >-
        They were purified homogeneously from A. brasilense cells grown on
        d-galactarate or hydroxy-l-proline, respectively.
    - reference_id: file:AZOBR/LhpG/LhpG-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in hydroxy-L-proline metabolism.
