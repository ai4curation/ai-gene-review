suggested_questions:
- question: >-
    Do the three A. brasilense KGSADH isozymes have non-overlapping
    physiological roles, or can one substitute for another when its own
    inducing substrate is absent?
suggested_experiments:
- description: >-
    Test growth of single and combinatorial KGSADH-I/II/III deletion strains on
    hydroxy-L-proline, D-galactarate and L-arabinose, to establish whether the
    hydroxyproline route depends on LhpG alone.
  experiment_type: isozyme-resolved deletion genetics and growth phenotyping
