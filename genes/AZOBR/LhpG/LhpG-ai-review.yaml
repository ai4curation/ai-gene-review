  title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic
    pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic
    convergent evolution.
  full_text_unavailable: true
  findings:
  - statement: >-
      A. brasilense has two KGSADH isozymes distinct from the L-arabinose-pathway
      enzyme: a D-glucarate/D-galactarate-inducible KGSADH-II and a
      hydroxy-L-proline-inducible KGSADH-III.
    supporting_text: >-
      d-glucarate/d-galactarate-inducible KGSADH-II and
      hydroxy-l-proline-inducible KGSADH-III
    reference_section_type: ABSTRACT
  - statement: >-
      Both isozymes share high specificity for alpha-ketoglutaric semialdehyde
      but differ in cofactor preference.
    supporting_text: >-
      KGSADH-II and KGSADH-III showed similar high substrate specificity for
      alphaKGSA and different coenzyme specificity
    reference_section_type: ABSTRACT
  - statement: >-
      Three types of KGSADH arose convergently in bacteria, and the same
      pathway can recruit different KGSADH types in different organisms.
    supporting_text: >-
      We conclude that three different types of KGSADH appeared in the bacterial
      evolutional stage convergently.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
