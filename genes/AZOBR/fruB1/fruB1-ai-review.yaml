suggested_questions:
- question: How fast are the individual EI-to-HPr-to-EIIA-to-FruA transfers in the cognate system, and
    are all predicted histidine sites directly phosphorylated?
- question: Should the kinase GO0016301 hierarchy explicitly include the PEP-dependent GO0008965 reaction,
    given that its definition allows non-ATP phosphate donors?
- question: Under which conditions does Fru-PTS2 contribute alongside Fru-PTS1, and can either relay substitute
    for the other without overexpression? The 2025 phenotypes do not establish universal interchangeability.
