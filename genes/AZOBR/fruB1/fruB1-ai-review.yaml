  label: Azospirillum brasilense
description: FruB1 is the soluble multiphosphoryl-transfer protein of the fructose-inducible Fru-PTS1
  system of Azospirillum brasilense Sp7. Its N-to-C domain order is EIIA–HPr–EI, while phosphate flows
  from phosphoenolpyruvate through EI, HPr and EIIA before transfer to the membrane FruA component. The
  fused architecture supplies both PEP entry and the downstream protein phosphorelay. The native fructose-system
  locus is AMK58_25885.
