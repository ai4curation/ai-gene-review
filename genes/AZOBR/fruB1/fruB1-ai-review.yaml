- id: PMID:39817736
  title: Identification and functional characterization of a fructose-inducible phosphotransferase system
    in Azospirillum brasilense Sp7.
  findings:
  - statement: Native Sp7 proteomics distinguishes the induced PTS1 FruA/FruK/FruB locus from the second
      fructose-PTS locus.
    supporting_text: Analysis of the proteome of A. brasilense Sp7 grown on fructose as sole carbon source
      showed upregulation of all the three components of a fructose PTS (designated as Fru-PTS1); FruA
      (AMK58_25875), FruK (AMK58_25880), and FruB (AMK58_25885).
  - statement: The paper describes the EIIB/EIIC transporter and EIIA-HPr-EI cytoplasmic relay architecture;
      residue chemistry is inferred rather than directly measured.
    supporting_text: Although the membrane-bound FruA consists of EIIB and EIIC domains, the cytosolic
      FruB is a larger polyprotein and consists of EIIA-HPr-EI domains (15).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and inspected. The tested organism is Azospirillum brasilense Sp7;
      distinguish the induced main PTS1 locus from its PTS2 paralogs. The proteomics identifies the native
      PTS1 locus protein AMK58_25885, and promoter reporters characterize regulation. The EIIA-HPr-EI
      architecture supports the relay assignment. The paper does not independently measure purified FruB1
      domain-to-domain transfer kinetics or identify its phosphorylated residues; these chemical details
      remain conserved-mechanism inferences.
