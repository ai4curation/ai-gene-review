id: P10583
gene_symbol: glnA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: GlnA is the type I glutamine synthetase of Azospirillum brasilense, with the P10583 sequence
  originating from strain Sp7. It uses ATP to incorporate ammonium into L-glutamate, producing L-glutamine
  for nitrogen assimilation and biosynthesis. The conserved enzyme is assigned to the cytoplasm and has
  the magnesium-binding, ATP-binding and adenylylation-site architecture of bacterial glutamine synthetases.
  GlnA supplies glutamine to the GltB/GltD glutamate-synthase reaction in the GS–GOGAT cycle. Native species-level
  isotope-tracer experiments support this assimilation route; the oligomeric and localization assignments
  for P10583 are homology-based.
