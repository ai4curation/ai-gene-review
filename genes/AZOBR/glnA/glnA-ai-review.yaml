- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002459219
  review:
    summary: The TreeGrafter IEA places Sp7 GlnA at the membrane. The underlying PAINT membrane IBD at
      the family root rests on a single vertebrate seed, mouse lengsin, so the location is likely an
      over-annotation for this soluble bacterial dodecamer.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO_REF:0000118 is a TreeGrafter IEA. P10583 is grafted onto the PTHR43407 tree (proximate
      node PANTHER:PTN002459219) and inherits the PAINT IBD for membrane at the family-root node
      PTN000464923. In the cached PAINT table that membrane IBD has one seed, MGI:2672844 (mouse lengsin).
      Lengsin is a GS-superfamily protein that has no GS activity and lines lens fiber-cell plasma membranes
      with intermediate filament proteins. That is a lineage-specific specialization, and it does not
      imply membrane association for bacterial type I GS. The target's curated UniProt location is
      cytoplasm, and no Azospirillum experiment places GlnA at a membrane. The row is not removed because
      peripheral attachment of a soluble enzyme has not been experimentally excluded. The same judgement
      is applied to the HDA and IBA membrane rows on E. coli GlnA (P0A9C5).
    supported_by:
    - reference_id: file:interpro/panther/PTHR43407/PTHR43407-paint.tsv
      supporting_text: "PTHR43407\tPTN000464923\tGO:0016020\tC\tIBD\tfalse\tMGI:MGI:2672844"
    - reference_id: PMID:18178558
      supporting_text: Lengsin has no GS activity, suggesting that it has a structural rather than catalytic
        role in lens.
    - reference_id: PMID:18178558
      supporting_text: Lengsin and lens intermediate filament proteins co-localize at the plasma membrane
        in maturing fiber cells.
    - reference_id: file:AZOBR/glnA/glnA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250|UniProtKB:P9WN39}.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002459219
        source_status: UNRESOLVED
        comment: Proximate TreeGrafter node for P10583; it carries the membrane term only by inheritance
          from the PTN000464923 IBD and has no experimental grounding of its own for membrane.
      - source_id: PANTHER:PTN000464923
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ancestral membrane IBD is seeded only by mouse lengsin, a vertebrate GS-superfamily
          member without GS activity; its membrane association does not transfer to bacterial GS.
