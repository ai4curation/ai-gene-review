suggested_questions:
- question: Which target EIIB residues and kinetic steps mediate phosphorylation, and what does the duplicated
    N-terminal B-like region contribute? Conserved architecture is not a target site-directed assay.
- question: Under which conditions does Fru-PTS2 contribute alongside Fru-PTS1, and can either relay substitute
    for the other without overexpression? The 2025 phenotypes do not establish universal interchangeability.
