id: A0A0P0F8C9
gene_symbol: fruA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: FruA1 is the principal membrane fructose phosphotransferase-system permease in Azospirillum
  brasilense Sp7 under fructose sole-carbon growth conditions. It couples fructose entry to formation
  of fructose 1-phosphate using phosphate supplied by the soluble fused FruB relay. The EIIB cysteine-dependent
  mechanism is inferred from conserved PTS domains and the characterized E. coli homolog; the duplicated
  N-terminal B-like region is not evidence for a second catalytic phosphoacceptor. Its paralog FruA2 has
  a different, secondary contribution under the tested conditions.
