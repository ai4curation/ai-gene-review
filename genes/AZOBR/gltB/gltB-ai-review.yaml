taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: GltB is the large catalytic subunit of Azospirillum brasilense NADPH-dependent glutamate
  synthase. Its N-terminal glutamine amidotransferase center releases the amide nitrogen of glutamine,
  and an internal ammonia tunnel connects this center to the FMN-associated site that reductively aminates
  2-oxoglutarate. GltB carries one [3Fe-4S] cluster and receives reducing equivalents from the FAD-containing
  GltD subunit. Together the subunits convert glutamine and 2-oxoglutarate into two glutamate molecules,
  completing the GS–GOGAT assimilation cycle. The Q05755 sequence has Sp7 provenance; detailed enzymology
  includes native Sp6 and recombinant A. brasilense preparations.
