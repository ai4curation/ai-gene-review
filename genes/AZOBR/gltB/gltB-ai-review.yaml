core_functions:
- description: Contribute glutamine hydrolysis in the Ntn-amidotransferase domain, internal
    ammonia channeling, and FMN-dependent glutamate formation to the NADPH-dependent GltB/GltD
    complex. NADPH-linked electron input is supplied by GltD; the hydrolysis is a coupled
    subreaction of this enzyme.
