      beta.
    supporting_text: one FMN (at Site 2, the 2-oxoglutarate/L-glutamate site in the alpha subunit)
  - statement: The pyridine-nucleotide interaction requires a 2-prime phosphate.
    supporting_text: the strict requirement of a 2'-phosphate group in the pyridine nucleotide for binding
      to glutamate synthase (GltS) was established.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Wiley full-text access returned HTTP403. The enzyme was expressed in E. coli BL21(DE3) and compared
      with native A. brasilense enzyme. This is not a native Sp7 isolated-subunit assay; both [4Fe-4S]
      locations were unresolved in this paper.
