- id: PMID:8428988
  title: Glutamate synthase genes of the diazotroph Azospirillum brasilense. Cloning, sequencing, and
    analysis of functional domains.
  findings:
  - statement: Cloning and sequence analysis identify gltB and gltD as the alpha and beta subunit genes.
    supporting_text: Two open reading frames of 4548 and 1446 base pairs (bp) were identified within the
      fragment as the structural genes for the alpha and beta subunits (gltB and gltD, respectively) of
      A. brasilense GltS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Full publisher PDF returned HTTP403. The abstract only tentatively assigns domains; later biochemistry
      and structure are used for catalytic/cofactor allocation. The UniProt sequence-source annotation
      names Sp7, while the abstract itself does not resolve all experimental strains.
