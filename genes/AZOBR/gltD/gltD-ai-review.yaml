      strain.
- id: PMID:18421771
  title: 'Structure-function studies of glutamate synthases: a class of self-regulated iron-sulfur flavoenzymes
    essential for nitrogen assimilation.'
  findings:
  - statement: The synthase couples an Ntn-amidotransferase to the FMN-bearing catalytic domain.
    supporting_text: a PurF- (Type II- or Ntn-) type amidotransferase domain is coupled to the synthase
      domain
  - statement: The second module supplies FAD-dependent pyridine-nucleotide oxidation.
    supporting_text: acts as a FAD-dependent NAD(P)H oxidoreductase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review article, abstract read. Used as mechanistic synthesis, with target domains and
      primary biochemical/structural studies providing independent grounding. It discusses multiple donor
      classes; NADPH specificity here comes from the A. brasilense primary study.
- id: PMID:4019412
  title: Purification and characterization of glutamate synthase from Azospirillum brasilense.
  findings:
  - statement: The native purified GOGAT preparation was from A. brasilense Sp6.
    supporting_text: Growth conditions for Azospirillum brasilense Sp6 were devised for maximal expression
      of glutamate synthase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Sp6 is explicit. Historical mass/cofactor stoichiometries and kinetic measurements are not copied
      as Sp7 measurements; later recombinant/structural work controls subunit allocation.
- id: PMID:2887545
  title: Assimilation of 13NH4+ by Azospirillum brasilense grown under nitrogen limitation and excess.
  findings:
  - statement: Native tracer and inhibitor evidence supports GS–GOGAT ammonium assimilation.
    supporting_text: These results imply that the GS-GOGAT pathway is the primary route of NH4+ assimilation
      by A. brasilense grown with excess or limiting nitrogen
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Experimental strain is not stated in the accessible abstract; retain species-level physiological
      scope.
