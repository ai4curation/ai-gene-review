- id: PMID:8428988
  title: Glutamate synthase genes of the diazotroph Azospirillum brasilense. Cloning, sequencing, and
    analysis of functional domains.
  findings:
  - statement: Cloning and sequence analysis identify gltB and gltD as the alpha and beta subunit genes.
    supporting_text: Two open reading frames of 4548 and 1446 base pairs (bp) were identified within the
      fragment as the structural genes for the alpha and beta subunits (gltB and gltD, respectively) of
      A. brasilense GltS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Full publisher PDF returned HTTP403. The abstract only tentatively assigns domains; later biochemistry
      and structure are used for catalytic/cofactor allocation. The UniProt sequence-source annotation
      names Sp7, while the abstract itself does not resolve all experimental strains.
- id: PMID:10785395
  title: Functional properties of recombinant Azospirillum brasilense glutamate synthase, a complex iron-sulfur
    flavoprotein.
  findings:
  - statement: Recombinant A. brasilense GOGAT is active as an alpha/beta protomer.
    supporting_text: Its catalytically active alphabeta protomer is composed of two dissimilar subunits
  - statement: The FMN/2-oxoglutarate site is on alpha, whereas the pyridine-nucleotide/FAD site is on
      beta.
    supporting_text: one FAD (at Site 1, the pyridine nucleotide site within the beta subunit)
  - statement: The pyridine-nucleotide interaction requires a 2-prime phosphate.
    supporting_text: the strict requirement of a 2'-phosphate group in the pyridine nucleotide for binding
      to glutamate synthase (GltS) was established.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID cache contains the abstract only. Full-text recovery was attempted;
      no accessible full article was recovered. Findings are restricted to explicit abstract statements.
      Wiley full-text access returned HTTP403. The enzyme was expressed in E. coli BL21(DE3) and compared
      with native A. brasilense enzyme. This is not a native Sp7 isolated-subunit assay; both [4Fe-4S]
      locations were unresolved in this paper.
- id: PMID:31473159
  title: Cryo-EM Structures of Azospirillum brasilense Glutamate Synthase in Its Oligomeric Assemblies.
  findings:
  - statement: Cryo-EM assigns FAD and two [4Fe-4S] clusters to betaGltS.
    supporting_text: allows unequivocal location of the FAD cofactor and of two electron transfer [4Fe-4S]+1,+2
