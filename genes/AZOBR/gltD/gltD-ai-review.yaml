- term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00634
  review:
    summary: The subunit directly contributes to biosynthesis of L-glutamate.
    action: ACCEPT
    reason: The NADPH-dependent holoenzyme converts glutamine plus 2-oxoglutarate into two L-glutamate
      molecules. GltD performs the NADPH-linked electron transfer that the synthesis reaction uses; its
      role is catalytic, not simply a requirement inferred from a knockout. Thus glutamate biosynthesis
      is a core process contribution even though the full reaction requires both chains.
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: PMID:10785395
      supporting_text: catalyses the NADPH-dependent reductive transfer of glutamine amide group to the
        C(2) carbon of 2-oxoglutarate to yield L-glutamate.
