id: Q05756
gene_symbol: gltD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: GltD is the small electron-transfer subunit of Azospirillum brasilense NADPH-dependent glutamate
  synthase. It binds the pyridine nucleotide and FAD and carries two [4Fe-4S] clusters that relay reducing
  equivalents to the catalytic GltB subunit. GltB supplies the glutamine-hydrolysis and FMN-dependent
  glutamate-forming centers. Their coupled reaction produces two glutamate molecules from glutamine and
  2-oxoglutarate in the GS–GOGAT assimilation cycle. The Q05756 record combines Sp7 genomic-sequence provenance
  with a Sp6 partial-protein source; recombinant biochemical and structural studies establish the subunit
  division of labor.
