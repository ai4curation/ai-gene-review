suggested_questions:
- question: What are the target FruK kinetic constants and substrate selectivity under native intracellular
    conditions?
- question: Under which conditions does Fru-PTS2 contribute alongside Fru-PTS1, and can either relay substitute
    for the other without overexpression? The 2025 phenotypes do not establish universal interchangeability.
