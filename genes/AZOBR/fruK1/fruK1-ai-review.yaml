gene_symbol: fruK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:192
  label: Azospirillum brasilense
description: FruK1 is the fructose-1-phosphate kinase of the fructose-inducible Fru-PTS1 locus in Azospirillum
  brasilense Sp7. It phosphorylates fructose 1-phosphate with ATP to form fructose 1,6-bisphosphate, connecting
  fructose PTS uptake to central carbon metabolism. It belongs to the PfkB carbohydrate-kinase family;
  this membership does not make it a fructose-6-phosphate kinase. The specific reaction is inferred from
  its FruK classification and native pathway context, rather than a purified FruK1 assay in the 2025 study.
