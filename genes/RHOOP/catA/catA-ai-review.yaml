  findings:
  - statement: >-
      The 1CP catA, catB and catC genes are transcribed in that order and the
      clone expresses all three catechol-branch activities.
    supporting_text: >-
      Sequencing of the insert on the recombinant plasmid pRER1 revealed that
      the genes are transcribed in the order catA catB catC.
  - statement: >-
      Gram-positive catechol 1,2-dioxygenases are more closely related to
      Gram-negative chlorocatechol 1,2-dioxygenases than to Gram-negative
      catechol 1,2-dioxygenases.
    supporting_text: >-
      The chlorocatechol 1,2-dioxygenases and the chloromuconate
      cycloisomerases of gram-negative bacteria appear to be more closely
      related to the catechol 1,2-dioxygenases and muconate cycloisomerases of
      the gram-positive strains than to the corresponding enzymes of
      gram-negative bacteria.
