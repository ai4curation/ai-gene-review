suggested_questions:
- question: >-
    Which active-site residues let the actinobacterial CatA accept
    chlorocatechols while the 1CP chlorocatechol 1,2-dioxygenases remain
    separate enzymes in the same strain?
  experts:
  - Rhodococcus aromatic-catabolism biochemists
suggested_experiments:
- experiment_type: comparative kinetics and mutagenesis
  description: >-
    Swap substrate-pocket residues between 1CP CatA and the 1CP
    3-chlorocatechol 1,2-dioxygenase and measure kcat/Km for catechol and
    chlorocatechols.
