  label: Rhodococcus opacus
description: >-
  CatA of the chlorophenol-degrading actinobacterium Rhodococcus opacus 1CP
  (originally described as R. erythropolis 1CP) is a cytoplasmic non-heme
  Fe(III) intradiol catechol 1,2-dioxygenase that cleaves catechol to
  cis,cis-muconate as the first step of the catechol ortho-cleavage branch of
  the beta-ketoadipate pathway. It is encoded first in a catA-catB-catC
  cluster whose cloned products carry out all three reactions of the branch.
  Crystal structures of the enzyme alone and with catechol, methylcatechols,
  chlorocatechols, pyrogallol and protocatechuate show how these substrates
  coordinate the active-site Fe(III), and turnover rates for catechol and
  several substituted catechols correlate with substrate electronic
  properties. The protein belongs to the actinobacterial catechol
  1,2-dioxygenase family, a lineage separate from the proteobacterial CatA
  enzymes and more closely related to Gram-negative chlorocatechol
  1,2-dioxygenases.
