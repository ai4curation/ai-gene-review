  review:
    summary: >-
      Core activity. The cloned 1CP cat cluster expresses muconolactone
      isomerase activity, catC is its only candidate gene for that step, and
      the protein matches the muconolactone delta-isomerase family model.
    action: ACCEPT
    reason: >-
      Expression evidence from the cloned cluster plus family membership
      support the electronic assignment.
    supported_by:
