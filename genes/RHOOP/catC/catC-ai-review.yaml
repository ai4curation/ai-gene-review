status: COMPLETE
taxon:
  id: NCBITaxon:37919
  label: Rhodococcus opacus
description: >-
  CatC of Rhodococcus opacus 1CP (originally described as R. erythropolis 1CP)
  is a 93-residue cytoplasmic muconolactone Delta-isomerase (EC 5.3.3.4) of
  the dimeric alpha/beta-barrel fold. It converts (4S)-muconolactone to
  beta-ketoadipate enol-lactone, the third reaction of the catechol
  ortho-cleavage branch, and is the last gene of the 1CP catA-catB-catC
  cluster whose cloned products carry out the whole branch.
