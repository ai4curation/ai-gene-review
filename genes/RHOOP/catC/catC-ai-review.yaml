suggested_questions:
- question: >-
    Is CatC the only muconolactone isomerase in 1CP, or do paralogs from the
    chlorocatechol and methylcatechol pathways (e.g. muconolactone-isomerase-fold
    dehalogenases) contribute to catechol-branch flux?
