suggested_questions:
- question: >-
    Did the actinobacterial muconate cycloisomerases (PANTHER PTHR48080) and the
    proteobacterial CatB enzymes (PTHR48073) acquire muconate
    cycloisomerization independently from different enolase-superfamily
    ancestors?
  experts:
  - enolase-superfamily evolution specialists
suggested_experiments:
- experiment_type: phylogenetics and ancestral reconstruction
  description: >-
    Build a joint enolase-superfamily tree including both PANTHER families,
    reconstruct the ancestors of each muconate cycloisomerase clade and assay
    them for muconate cycloisomerase and o-succinylbenzoate synthase activity.
