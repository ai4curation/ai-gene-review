- term:
    id: GO:0018850
    label: chloromuconate cycloisomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013370
  review:
    summary: >-
      Electronic mapping from InterPro IPR013370, which groups muconate and
      chloromuconate cycloisomerases. 1CP makes a separate chloromuconate
      cycloisomerase for chlorophenol degradation; the muconate
      cycloisomerase (this protein) shows limited activity on a chlorinated
      substrate, converting 2-chloromuconate to 5-chloromuconolactone without
      dehalogenation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Some side activity on a chloromuconate is reported, so the claim is not
      flatly contradicted, but the chloromuconate cycloisomerase role in 1CP
      belongs to a different enzyme and this protein's physiological substrate
      is cis,cis-muconate. This differs deliberately from the REMOVE on the
      same InterPro-derived row for A. baylyi ADP1 CatB, whose enzyme was shown
      not to turn over chlorinated muconates.
    supported_by:
    - reference_id: PMID:7751292
      supporting_text: >-
        Both enzymes discriminated between the two possible directions of
        2-chloro-cis, cis-muconate cycloisomerization and converted this
        substrate to 5-chloromuconolactone as the only product.
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013370
  review:
    summary: >-
      Muconate cycloisomerases are divalent-metal enzymes with Mn(2+) at the
      active site, and P95608 carries the mandelate racemase/muconate
      lactonizing enzyme signatures that include the metal ligands.
    action: ACCEPT
    reason: >-
      Catalytic cofactor binding supported by family signatures and by the
      characterised Mn(2+) site of the homologous P. putida enzyme (same
      TIGR02534 family model).
    supported_by:
    - reference_id: file:RHOOP/catB/catB-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: >-
        DR   PROSITE; PS00909; MR_MLE_2; 1.
    - reference_id: PMID:6652062
      supporting_text: >-
        The titration of enzyme freed of divalent metal ion with manganous ion,
        monitored by electron paramagnetic resonance spectroscopy and
        steady-state kinetic measurements, indicates a single binding site per
        subunit
- term:
