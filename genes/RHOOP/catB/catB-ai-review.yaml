    label: catechol catabolic process, ortho-cleavage
  evidence_type: IDA
  qualifier: involved_in
  review:
    summary: >-
      CatB catalyses the second of the three catechol-branch reactions encoded
      by the 1CP catABC cluster; GOA carries no process annotation for this
      protein.
    action: NEW
    reason: >-
      The enzyme does part of the work of the process (it converts the CatA
      product cis,cis-muconate to muconolactone), so involved_in is warranted;
      the same term is the refinement adopted for the other CatB orthologs in
      this corpus.
    supported_by:
    - reference_id: PMID:8990288
      supporting_text: >-
        The clone thus obtained expressed catechol 1,2-dioxygenase, muconate
        cycloisomerase, and muconolactone isomerase activities.
    - reference_id: PMID:7751292
      supporting_text: >-
        Muconate cycloisomerase (EC 5.5.1.1) and chloromuconate cycloisomerase
        (EC 5.5.1.7) were purified from extracts of Rhodococcus erythropolis
        1CP cells grown with benzoate or 4-chlorophenol, respectively.
