taxon:
  id: NCBITaxon:37919
  label: Rhodococcus opacus
description: >-
  CatB of Rhodococcus opacus 1CP (originally described as R. erythropolis 1CP)
  is the benzoate-induced muconate cycloisomerase (EC 5.5.1.1), a cytoplasmic
  mandelate racemase/muconate lactonizing enzyme of the enolase superfamily
  that converts cis,cis-muconate to (4S)-muconolactone in the catechol
  ortho-cleavage branch, between CatA and CatC of the 1CP catABC cluster. The
  purified enzyme also converts 2-chloro-cis,cis-muconate, but only to
  5-chloromuconolactone and without dehalogenation. Neither it nor the
  separate 1CP chloromuconate cycloisomerase dehalogenates, unlike the
  Gram-negative chloromuconate cycloisomerases; the two 1CP enzymes differ
  instead in how efficiently they cycloisomerize 3-chloro- and
  2,4-dichloro-cis,cis-muconate. Although it matches the same muconate
  cycloisomerase family model as proteobacterial CatB, it lies in a different
  PANTHER family, consistent with the proposed independent evolution of
  cycloisomerase specificities in Gram-positive and Gram-negative bacteria.
