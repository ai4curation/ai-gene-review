      The family-level mapping assumes the MxaF calcium site. For this protein the
      metal site is shown crystallographically to hold Ce(3+) or Eu(3+), growth is
      strictly lanthanide-dependent, and SolV has no Ca-MDH. Calcium binding is
      not a function of this protein; the correct claim is lanthanide (metal) ion
