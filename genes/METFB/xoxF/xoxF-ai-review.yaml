- description: >-
    Binds one trivalent lanthanide ion per subunit as an essential Lewis-acid
    cofactor. The evolved cofactors are the naturally available early
    lanthanides (La to Nd), which give the highest activity. Eu, Pm and the
    actinides Am and Cm can substitute, which shows how tolerant the metal site
