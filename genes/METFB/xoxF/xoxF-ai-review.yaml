- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IDA
  original_reference_id: PMID:24034209
  qualifier: enables
  review:
    summary: >-
      Binds one trivalent lanthanide ion per subunit in the active site. The
      evolved cofactors are the early lanthanides (La, Ce, Pr, Nd) that SolV
      takes up in its volcanic mudpot habitat: the enzyme purified from cells
      grown on them carries Ce(3+) in its crystal structure (PDB 4MAE).
    action: NEW
    reason: >-
      The lanthanide cofactor is essential for catalysis, and the primary
      evidence is the native enzyme from cells grown on the naturally available
      light lanthanides. Eu(3+) (PMID:29524328), the actinides Am(3+) and
      Cm(3+) (PMID:37074219) and radioactive Pm(3+) (PMID:43058125) also fit the
      site and support activity, but Pm is virtually absent from nature and Am
      and Cm are synthetic, so these results show how tolerant the site is to
      trivalent ions of similar radius, not functions the enzyme evolved for.
      The Pm and actinide activities were measured on apo-enzyme reconstituted
      in vitro. GO has no lanthanide ion binding term, so the parent metal ion
      binding is used and a new term is proposed (same proposal as in the
      M. extorquens xoxF1 review).
    supported_by:
    - reference_id: PMID:24034209
      supporting_text: it was shown that lanthanides were essential as cofactor in a homodimeric MDH
    - reference_id: UniProt:I0JWN7
      supporting_text: Binds one lanthanide ion per subunit.
    - reference_id: PMID:43058125
      supporting_text: Reconstituted methanol dehydrogenase of the type XoxF-MDH displays Pm-dependent activity precisely between the neodymium and samarium variants
