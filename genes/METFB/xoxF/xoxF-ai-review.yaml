proposed_new_terms:
- proposed_name: lanthanide ion binding
  proposed_definition: Binding to a lanthanide (rare-earth) ion, for example La(3+), Ce(3+), Pr(3+) or Nd(3+).
  justification: >-
    XoxF-type methanol dehydrogenases require a lanthanide rather than calcium
    in the active site; SolV has no calcium-dependent MDH at all. Only the
    generic parent metal ion binding (GO:0046872) is available. Same proposal as
    in the M. extorquens xoxF1 review.
  supported_by:
  - reference_id: PMID:24034209
    supporting_text: it was shown that lanthanides were essential as cofactor in a homodimeric MDH
suggested_questions:
- question: Is the activity of the Pm-, Am- and Cm-substituted XoxF in reconstitution assays matched by enzyme isolated from cells grown on those elements, given that in vitro reconstitution with an apo-enzyme can differ from in vivo metal loading?
- question: Which SolV proteins take up and deliver lanthanides to periplasmic XoxF, given that SolV removes 98% of Pm-147 from the medium in 60 h?
suggested_experiments:
- description: Purify XoxF from SolV grown on single lanthanides (or actinides) and compare metal content and kinetics with apo-enzyme reconstituted in vitro, using the physiological acceptor cytochrome cGJ rather than PES/DCPIP.
