gene_symbol: xoxF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1156937
  label: Methylacidiphilum fumariolicum SolV
description: >-
  Lanthanide-dependent, pyrroloquinoline quinone (PQQ)-containing methanol
  dehydrogenase (XoxF-type MDH, EC 1.1.2.10) of the thermoacidophilic
  verrucomicrobial methanotroph Methylacidiphilum fumariolicum SolV. It is the
  only methanol dehydrogenase of this organism, which lacks the calcium-dependent
  MxaFI enzyme, so growth on methane is strictly dependent on lanthanides. The
  soluble homodimeric enzyme is exported to the periplasm by an N-terminal signal
  peptide and binds one PQQ and one trivalent lanthanide ion per subunit; the
  lanthanide acts as a Lewis acid that activates PQQ. It oxidises methanol, formed
  by methane monooxygenase, to formaldehyde (and further to formate in vitro), and
  passes the electrons to the XoxG-XoxJ fusion cytochrome cGJ. It also oxidises
  other C2-C6 primary alcohols in vitro. The early lanthanides (La to Nd) give the
  highest activity and activity falls across the series; Eu(3+), the trivalent
  actinides Am(3+) and Cm(3+), and radioactive Pm(3+) can also occupy the metal
  site and support activity and growth.
