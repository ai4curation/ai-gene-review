- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: Cytoplasmic location, consistent with purification from a cell-free extract.
    action: ACCEPT
    reason: >-
      UniProt assigns a cytoplasmic location by similarity. The enzyme was
      purified from a cell-free extract and acts on the TreY product made from
      intracellular glucans. No assay here resolves cytosol from other
      cytoplasmic fractions, so the term is as precise as the evidence allows.
    supported_by:
