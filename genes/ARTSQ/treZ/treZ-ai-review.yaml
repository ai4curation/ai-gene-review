- term:
    id: GO:0005992
    label: trehalose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012768
  - UniPathway:UPA00299
  review:
    summary: Core process; TreZ releases trehalose in the TreY/TreZ route.
    action: ACCEPT
    reason: >-
      The family and UniPathway inference is borne out by this strain's own
      biochemistry. Purified Q36 TreZ releases trehalose from maltooligosyl
      trehalose (PMID:8611745), and its gene is the second gene of the cloned
      treYZ operon from this trehalose-producing strain (PMID:8605217).
    supported_by:
    - reference_id: file:ARTSQ/treZ/treZ-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Glycan biosynthesis; trehalose biosynthesis.'
    - reference_id: PMID:8605217
      supporting_text: >-
        Sequence analysis of the DNA fragment revealed two open reading frames
        of 2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
        maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
