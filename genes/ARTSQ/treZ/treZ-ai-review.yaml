id: Q44316
gene_symbol: treZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:104027
  label: Arthrobacter sp. Q36
description: >-
  TreZ of Arthrobacter sp. Q36 is a malto-oligosyltrehalose trehalohydrolase,
  a cytoplasmic glycoside hydrolase family 13 (GH13) enzyme with an N-terminal
  E-set domain. It is encoded by the second gene of the treYZ operon. The
  enzyme purified from this strain specifically hydrolyses the alpha-1,4 bond
  joining the maltooligosyl and trehalose moieties of maltooligosyl trehalose,
  which TreY forms. This releases free trehalose and completes trehalose
  synthesis from starch-like alpha-1,4-glucans.
