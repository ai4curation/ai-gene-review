suggested_questions:
- question: >-
    Does Arthrobacter sp. Q36 TreZ also hydrolyse longer maltooligosyl
    trehalose chains derived from glycogen in vivo, or only the short chains
    tested in vitro?
suggested_experiments:
- description: >-
    Express Q44316 recombinantly, compare its kinetics with the native enzyme,
    and test the predicted nucleophile Asp267 by mutagenesis.
