id: Q44315
gene_symbol: treY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:104027
  label: Arthrobacter sp. Q36
description: >-
  TreY of Arthrobacter sp. Q36 is the founding characterized maltooligosyl
  trehalose synthase, a glycoside hydrolase family 13 (GH13) enzyme. Purified
  from cell extracts, the 81 kDa enzyme converts maltooligosaccharides of three
  or more glucose units, but not maltose, into maltooligosyl trehalose. It does
  so by intramolecular transglycosylation, turning the reducing-end
  alpha-1,4-linked glucose into an alpha,alpha-1,1-linked terminal glucose.
  treY lies in an operon with treZ, whose trehalohydrolase then releases free
  trehalose. Together the pair makes trehalose from starch-like
  alpha-1,4-glucans.
