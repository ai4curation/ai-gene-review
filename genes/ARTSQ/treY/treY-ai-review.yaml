core_functions:
- description: >-
    Converts the reducing-end alpha-1,4 linkage of maltooligosaccharides and
    alpha-1,4-glucans to an alpha,alpha-1,1 linkage, forming
    maltooligosyltrehalose for TreZ in the TreY/TreZ trehalose biosynthesis
    route.
