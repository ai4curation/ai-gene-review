suggested_questions:
- question: >-
    Does Arthrobacter sp. Q36 use TreY/TreZ on an endogenous glycogen pool, or
    mainly on exogenous starch-derived maltooligosaccharides?
suggested_experiments:
- description: >-
    Delete treY in Arthrobacter sp. Q36 and measure intracellular trehalose
    and glycogen during growth on starch versus glucose and under osmotic
    stress.
