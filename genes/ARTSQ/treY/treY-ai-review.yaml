  review:
    summary: Core process; TreY makes the trehalose-containing intermediate of the TreY/TreZ route.
    action: ACCEPT
    reason: >-
      The TreeGrafter inference is borne out by the protein's own
      biochemistry. Purified Q36 TreY forms maltooligosyl trehalose
      (PMID:8611744), and the cloned treYZ operon from this trehalose-producing
      strain encodes both enzymes of the route (PMID:8605217).
    supported_by:
    - reference_id: PMID:8605217
      supporting_text: >-
        Sequence analysis of the DNA fragment revealed two open reading frames
        of 2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
        maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
    - reference_id: PMID:8611744
      supporting_text: >-
        catalyzes the conversion of maltooligosaccharide into the non-reducing
        saccharide, maltooligosyl trehalose (alpha-maltooligosyl
        alpha-D-glucoside) by intramolecular transglycosylation
- term:
    id: GO:0030980
    label: alpha-glucan catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002449568
  review:
    summary: True secondary process; the TreY/TreZ route consumes alpha-1,4-glucan termini.
    action: KEEP_AS_NON_CORE
    reason: >-
      TreY acts on the reducing end of maltooligosaccharides, and with TreZ the
      route shortens the glucan as it makes trehalose. That consumption is real
      but secondary to the biosynthetic role, matching the same term on the
      M. tuberculosis and P. putida orthologs.
    supported_by:
    - reference_id: PMID:8611744
      supporting_text: >-
        The enzyme was specific for maltooligosaccharides except maltose, and
        catalyzed the conversion to form maltooligosyl trehalose.
