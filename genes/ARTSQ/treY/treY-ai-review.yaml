  review:
    summary: Core activity, demonstrated on the purified native enzyme.
    action: ACCEPT
    reason: >-
      The electronic EC/Rhea mapping is confirmed by the purified Q36 enzyme.
      It converts maltooligosaccharides to maltooligosyl trehalose by
      intramolecular transglycosylation, with Km values falling from 22.9 mM for
      maltotetraose to 0.9 mM for maltoheptaose (PMID:8611744). The curated
      Swiss-Prot function statement agrees.
    supported_by:
