  review:
    summary: LapD self-association underlies signal transmission.
    action: ACCEPT
    reason: The structure-function study supports trans-subunit EAL-domain dimerization and intersubunit
      coupling. Retain this mechanistically supported self-association as core, without adding a redundant
      generic-binding core function.
    supported_by:
    - reference_id: PMID:21304926
      supporting_text: Binding of c-di-GMP to the phosphodiesterase domain disrupts the inactive state,
        permitting the formation of a trans-subunit dimer interface between adjacent phosphodiesterase
        domains via interactions conserved in c-di-GMP-degrading enzymes.
