id: Q3KK31
gene_symbol: lapD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:205922
  label: Pseudomonas fluorescens Pf0-1
description: LapD is an inner-membrane c-di-GMP receptor of Pseudomonas fluorescens Pf0-1. Its catalytically
  inactive EAL domain binds c-di-GMP and transmits an activating conformational change through HAMP to
  a periplasmic output domain. Activated LapD sequesters and inhibits the cysteine protease LapG, preventing
  cleavage of the surface adhesin LapA and promoting surface retention and biofilm attachment.
