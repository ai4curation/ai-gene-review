  label: Thermotoga maritima MSB8
description: Tm0936/MtaD is a zinc-dependent deaminase from Thermotoga maritima MSB8 that converts S-adenosylhomocysteine
  to S-inosylhomocysteine and 5′-methylthioadenosine to 5′-methylthioinosine. It also deaminates adenosine
  and 5′-deoxyadenosine in purified-protein assays. Its measured substrate profile favors the sulfur-containing
  adenosine derivatives in the 2013 comparison. Coupling SAH deamination to the organism's SIH-hydrolyzing
  AhcY can regenerate homocysteine, although the dominant native substrate and flux through that route
  remain unresolved. AMP and SAM were not substrates in the original assay.
