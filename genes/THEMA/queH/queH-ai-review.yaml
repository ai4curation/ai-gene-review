status: COMPLETE
taxon:
  id: NCBITaxon:243274
  label: Thermotoga maritima MSB8
description: >-
  QueH (TM_0731) is the epoxyqueuosine reductase of Thermotoga maritima and the
  structurally characterized member of the QueH family (formerly DUF208,
  InterPro IPR003828). QueH is unrelated in sequence to QueG and needs no
  cobalamin: its crystal structures show a monomer with an active-site
  [4Fe-4S] cluster beside a second, singly coordinated metal ion. It completes
  tRNA queuosine biosynthesis by reducing epoxyqueuosine at wobble position 34
  of tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr) to queuosine. Expression of
  the T. maritima gene restores queuosine in an Escherichia coli queG deletion.
