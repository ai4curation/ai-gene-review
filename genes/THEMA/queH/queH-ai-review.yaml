- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000497575
  review:
    summary: The crystal structure of this protein resolves an active-site [4Fe-4S] cluster.
    action: ACCEPT
    reason: >-
      Five X-ray structures of this protein are in the entry, and the reported
      architecture is a [4Fe-4S] cluster with an adjacent coordinated metal in
      the active site; spectra of the reduced and oxidized protein match a
      [4Fe-4S] cluster. The structure assigns the four cluster ligands to
      Cys87, Cys90, Cys169 and Cys171, while Cys9 and Cys10 together with
      Asp13 coordinate a separate mononuclear metal, so the UniProt BINDING
      features (9, 10, 87, 90) misassign the cluster site; that is recorded as
      a source defect below. The cluster is integral to the reductase
      chemistry.
    supported_by:
    - reference_id: PMID:34652139
      supporting_text: >-
        The structure reveals an unusual active site architecture with a
        [4Fe-4S] metallocluster along with an adjacent coordinated iron metal.
    - reference_id: PMID:34652139
      supporting_text: >-
        of the anaerobically prepared/reduced and air oxidized protein display
        characteristic spectra of [4Fe-4S] clusters
    - reference_id: PMID:34652139
      supporting_text: >-
        A canonical [4Fe-4S] cluster is coordinated with a four cysteine motif:
        Cys87-X2-Cys90 (α4) and Cys169-X-Cys171 (located in a loop between α7,
        α8) with helix α3 helping to enclose the active site
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q9WZJ0
      slot: "FT:BINDING"
      requested_change: REPOINT
      asserted_value: "FT BINDING 9, 10, 87, 90 /ligand=\"[4Fe-4S] cluster\" (HAMAP-Rule:MF_02089)"
      corrected_value: "FT BINDING 87, 90, 169, 171 /ligand=\"[4Fe-4S] cluster\""
      confidence: CONFIRMED
      explanation: >-
        The crystal structures of this very protein (PDB 7LC5, 7LC7) show the
        [4Fe-4S] cluster coordinated by Cys87-X2-Cys90 and Cys169-X-Cys171.
        Cys9 and Cys10, which the rule lists as cluster ligands, instead
        coordinate a separate mononuclear metal together with Asp13 and a
        non-proteinogenic ligand. The four BINDING features should point at
        87, 90, 169 and 171, and the mononuclear site at Cys9, Cys10 and Asp13
        should be annotated separately.
      supported_by:
      - reference_id: PMID:34652139
        supporting_text: >-
          A canonical [4Fe-4S] cluster is coordinated with a four cysteine
          motif: Cys87-X2-Cys90 (α4) and Cys169-X-Cys171 (located in a loop
          between α7, α8)
      - reference_id: PMID:34652139
        supporting_text: >-
          a single metal ion was found coordinated with the two cysteines
          (Cys9, Cys10) along with Asp13 and a non-proteinogenic ligand
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q9WZJ0
      slot: "FT:DISULFID"
      requested_change: REPOINT
      asserted_value: "FT DISULFID 169..171 /note=\"Redox-active\" (HAMAP-Rule:MF_02089)"
      corrected_value: "FT BINDING 169, 171 /ligand=\"[4Fe-4S] cluster\""
      confidence: CONFIRMED
      explanation: >-
        The redox-active disulfide at 169..171 is a prediction, by analogy with
        vitamin K epoxide reductase, that the structure of this protein
        refutes: Cys169 and Cys171 are two of the four ligands of the [4Fe-4S]
        cluster. The disulfide feature should be removed and these residues
        annotated as cluster ligands.
      supported_by:
      - reference_id: PMID:34652139
        supporting_text: >-
          The two cysteines not coordinating the metal cluster were previously
          predicted to undergo disulfide bond chemistry through a redox cycle,
          similar to the mechanism of vitamin K epoxide reductase.
      - reference_id: PMID:34652139
        supporting_text: >-
          four iron atoms coordinated by sulfhydryls of four conserved cysteine
          residues from Cys87-X2-Cys90 and Cys169-X-Cys171
- term:
