core_functions:
- description: >-
    Cobalamin-independent, [4Fe-4S]-dependent reduction of epoxyqueuosine(34)
    in tRNA to queuosine(34), the final step of queuosine synthesis, replacing
    QueG in genomes that lack it.
  molecular_function:
    id: GO:0052693
    label: epoxyqueuosine reductase activity
  directly_involved_in:
  - id: GO:0008616
    label: tRNA queuosine(34) biosynthetic process
  supported_by:
  - reference_id: PMID:34652139
    supporting_text: >-
      The queH gene (TM0731) of T. maritima was previously shown to
      complement a ΔqueG strain of E. coli by restoring functionally
      production of Q.
  - reference_id: PMID:34652139
    supporting_text: >-
      The structure reveals an unusual active site architecture with a
      [4Fe-4S] metallocluster along with an adjacent coordinated iron metal.
  knowledge_gaps:
  - gap_statement: >-
      Purified QueH consumes epoxyqueuosine-tRNA but no queuosine product has
      been detected in vitro, and the physiological electron donor is unknown.
    significance: >-
      The reaction is established genetically, but the catalytic mechanism,
      the role of the second active-site metal and the reductant remain to be
      demonstrated.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      The identity of the second active-site metal is unassigned; the paper
      models it as iron while a prediction server favoured zinc.
    significance: >-
      Which metal sits beside the cluster determines the proposed
      two-electron reduction and deoxygenation mechanism.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: What reductant supports QueH turnover, and does the second active-site metal participate in catalysis or only in stability?
suggested_experiments:
- hypothesis: QueH requires a physiological reductant absent from the reported in vitro assays.
  description: >-
    Screen candidate ferredoxin, flavodoxin and NADPH-dependent reductase
    systems with anaerobically purified QueH and epoxyqueuosine-tRNA, and
    quantify queuosine by LC-MS.
- hypothesis: The second metal site is catalytic rather than structural.
  description: >-
    Determine metal content by ICP-MS, substitute the site's ligands by
    mutagenesis, and test complementation of an E. coli queG deletion.
