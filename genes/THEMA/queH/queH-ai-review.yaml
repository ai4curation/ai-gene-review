- term:
    id: GO:0052693
    label: epoxyqueuosine reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:32159
  - EC:1.17.99.6
  - UniRule:UR000497575
  review:
    summary: Established in vivo by complementation; in vitro turnover to queuosine is not yet shown.
    action: ACCEPT
    reason: >-
      This gene restores queuosine in an E. coli queG deletion, and the
      purified protein consumes epoxyqueuosine-tRNA, although no queuosine
      product was detected under the conditions tried. Complementation plus
      the HAMAP MF_02089 assignment of RHEA:32159 make the activity the
      best-supported function, so it is kept as core with the in vitro gap
      recorded below.
    supported_by:
    - reference_id: PMID:34652139
      supporting_text: >-
        The queH gene (TM0731) of T. maritima was previously shown to
        complement a ΔqueG strain of E. coli by restoring functionally
        production of Q.
    - reference_id: PMID:34652139
      supporting_text: >-
        With added TmQueH, the epoxyqueuosine signal disappears, however, a
        mass corresponding to queuosine was not apparent
