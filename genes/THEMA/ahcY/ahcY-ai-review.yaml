  label: Thermotoga maritima MSB8
description: AhcY/TM_0172 is a soluble NAD-dependent adenosylhomocysteinase from Thermotoga maritima MSB8.
  It reversibly hydrolyzes S-adenosylhomocysteine to adenosine and homocysteine and also hydrolyzes S-inosylhomocysteine
  to inosine and homocysteine. Both substrates were processed approximately equally in the direct comparative
  assay. The internal NAD cofactor supports the redox-assisted carbon–sulfur bond cleavage. Its SIH activity
  can complete the chemical sequence initiated by MtaD-mediated SAH deamination; the contribution of that
  sequence to native metabolic flux has not been established.
