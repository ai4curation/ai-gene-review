proposed_new_terms:
- proposed_name: S-inosyl-L-homocysteine hydrolase activity
  proposed_definition: 'Catalysis of the reaction: S-inosyl-L-homocysteine + H2O = inosine + L-homocysteine.'
  proposed_parent:
    id: GO:0046508
    label: hydrolase activity, acting on carbon-sulfur bonds
  justification: The direct target assay establishes this carbon–sulfur bond hydrolysis. GO0004013 instead
    specifies the adenine-containing SAH substrate; fresh QuickGO searches found no SIH-specific hydrolase
    term. This proposal supports the existing core activity without manufacturing a new GOA row.
  supported_by:
  - *id001
