- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR045170
  review:
    summary: SoxA binds one FAD per chain, covalently at Cys318; FAD binding by the N-terminal motif has been studied directly by mutagenesis of this enzyme.
    action: ACCEPT
    reason: >-
      InterPro2GO mapping (GO_REF:0000002) from IPR045170 (MTOX). The family
      inference is backed by direct work on the Arthrobacter TE1826 enzyme.
      Nishiya and Imanaka mutated Asp36 (D-35 in their numbering) and the
      G-X-G-X-X-G motif, which changed the flavin spectrum and reduced or
      abolished activity. Nishiya (2000) identified Cys318 as the covalent
      flavin attachment site and showed that the C318S mutant's activity
      depends on free FAD binding noncovalently. The cofactor is the redox
      centre of the sarcosine oxidase reaction, so binding it is an integral
      part of the core activity.
