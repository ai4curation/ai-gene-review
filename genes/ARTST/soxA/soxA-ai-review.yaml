  review:
    summary: Core activity. SoxA is a characterized sarcosine oxidase whose activity has been assayed in many site-directed mutants.
    action: ACCEPT
    reason: >-
      Combined automated annotation (GO_REF:0000120) drawing on InterPro
      IPR006281 (SoxA_mon), the HAMAP/UniRule MSOX rule, EC 1.5.3.1 / RHEA:13313
      and a PANTHER node. GO defines the term as "Catalysis of the reaction: H2O
      + O2 + sarcosine = formaldehyde + glycine + H2O2." That is the reaction
      curated in the Swiss-Prot entry, and the Nishiya mutagenesis papers assay
      the sarcosine oxidase activity of the purified Arthrobacter TE1826 enzyme
      directly. The formaldehyde-releasing (folate-independent) form of the
      reaction is right for monomeric sarcosine oxidases: Wagner and Schuman
      Jorns (1997) found that monomeric enzymes, unlike the heterotetrameric
      ones, do not use tetrahydrofolate as a substrate. The cached abstract of
      that paper does not say which monomeric enzymes were tested, so it is
      cited as family-level support and not as an assay of P40873.
