      supporting_text: Sarcosine oxidase from Arthrobacter sp. TE1826 (SoxA) tightly binds with the coenzyme flavin adenine dinucleotide (FAD).
    - reference_id: PMID:8779579
      supporting_text: These results strongly suggest that the inhibition of interaction of enzyme with FAD was caused by the substitution in the motif and that it could be recovered under different conditions.
    - reference_id: PMID:11035956
      supporting_text: The covalent flavin attachment site in the Arthrobacter sarcosine oxidase (cysteine at position 318) was replaced with serine, and the mutational effect of C318S was analyzed.
    - reference_id: PMID:11035956
