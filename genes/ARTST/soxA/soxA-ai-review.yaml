proposed_new_terms: []
suggested_questions:
- question: >-
    Is soxA induced by creatinine or creatine through SoxR, and does an
    Arthrobacter TE1826 soxA mutant fail to grow on creatinine, creatine or
    sarcosine as sole nitrogen or carbon source? Such data would justify a
    process annotation (e.g. GO:0006602 creatinine catabolic process); the
    gene cluster alone does not.
- question: >-
    Do the residues and structural features identified in the Bacillus sp.
    B-0618 monomeric sarcosine oxidase crystal structures (substrate-binding
    site, flavin attachment geometry) carry over to the TE1826 enzyme? They
    have not been transferred to this review.
suggested_experiments:
- description: >-
    Delete soxA in Arthrobacter sp. TE1826, test growth on creatinine,
    creatine and sarcosine, and measure soxA transcript levels in response to
    these substrates, with and without soxR.
- description: >-
    Solve the crystal structure of the TE1826 enzyme, or a sarcosine-analog
    complex of it, to confirm the active-site residues directly rather than by
    homology to the Bacillus enzyme.
