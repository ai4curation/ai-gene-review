    summary: Soluble monomeric flavoenzyme with no signal peptide or transmembrane segment; cytoplasmic location is appropriate.
    action: ACCEPT
    reason: >-
      Combined automated annotation (GO_REF:0000120) from the UniProt
      subcellular-location vocabulary (SL-0086) and the UniRule/HAMAP MSOX rule
