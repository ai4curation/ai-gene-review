id: P40873
gene_symbol: soxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:68999
  label: Arthrobacter sp. TE1826
description: >-
  soxA of Arthrobacter sp. TE1826 encodes a monomeric sarcosine oxidase (MSOX),
  a soluble cytoplasmic flavoenzyme of about 43 kDa that catalyzes the oxidative
  demethylation of sarcosine (N-methylglycine) with molecular oxygen, producing
  glycine, formaldehyde and hydrogen peroxide (EC 1.5.3.1). It carries one FAD
  per chain, attached covalently through Cys318; an N-terminal Rossmann-type
  G-X-G-X-X-G motif (Gly13-Gly18) and Asp36 contact the flavin.
  Mutation of the attachment cysteine leaves an enzyme whose weak activity
  depends on noncovalently bound free FAD. Unlike the heterotetrameric bacterial
  sarcosine oxidases, monomeric sarcosine oxidases do not channel the methyl
  group to tetrahydrofolate and release free formaldehyde. soxA lies in a gene
  cluster with a regulator gene (soxR), creatininase (crnA) and creatinase
  (creA), consistent with a role in the final step of creatinine and creatine
  degradation to glycine. The protein belongs to the MSOX/MTOX family of
  FAD-dependent amine oxidases.
