      single-chain enzyme, the sequence has no predicted signal peptide or
      transmembrane helix, and the enzyme is studied as a soluble protein from
      cell extracts of recombinant strains. Cytoplasm is where the sarcosine
      oxidase activity is expected to act. No compartment finer than cytoplasm
