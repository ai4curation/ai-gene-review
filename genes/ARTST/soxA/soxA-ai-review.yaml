- id: PMID:9563845
  title: Gene cluster for creatinine degradation in Arthrobacter sp. TE1826.
  full_text_unavailable: true
  findings:
  - statement: soxA and its regulator soxR cluster with the creatininase (crnA) and creatinase (creA) genes.
    supporting_text: The genes form a cluster with the sarcosine oxidase gene (soxA) and its regulator gene (soxR), which were cloned previously.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Exact strain and gene. Shows a genomic context that points to a role in
      creatinine/creatine degradation to glycine. The cached abstract has no
      physiological (knockout or growth) data for soxA.
- id: PMID:7887617
  title: Active site analysis and stabilization of sarcosine oxidase by the substitution
    of cysteine residues.
  full_text_unavailable: true
  findings:
  - statement: The C318S mutant lost activity, implicating the conserved Cys318 in the active site; Cys265 substitutions gave thiol-reagent-resistant enzymes with near wild-type properties.
    supporting_text: Since the mutant with the C-to-S mutation at position 318 (C318S) lost the enzyme activity, C-318 (conserved among sarcosine oxidases) is most likely a part of the active site.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct mutagenesis of the TE1826 enzyme. Later work (PMID:11035956)
      showed that C318S keeps very weak, FAD-dependent activity, which revises
      the "lost activity" reading.
- id: PMID:8779579
  title: Analysis of interaction between the Arthrobacter sarcosine oxidase and the
    coenzyme flavin adenine dinucleotide by site-directed mutagenesis.
  full_text_unavailable: true
  findings:
  - statement: SoxA binds FAD tightly through an N-terminal motif and an aspartate (D-35 in the paper's numbering, Asp36 in UniProt's full-length numbering); substitutions decrease sarcosine oxidase activity and alter flavin spectra, and some are rescued by chloride.
    supporting_text: Most of them showed inhibited or remarkably decreased sarcosine oxidase activity, and their spectral profiles were altered.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Exact protein. The abstract numbers residues from the mature N-terminus
      (D-35, motif positions 12-17), while UniProt's features number them from
      the initiator Met (Asp36, Gly13-Gly18).
- id: PMID:11035956
  title: A mutant sarcosine oxidase in which activity depends on flavin adenine dinucleotide.
  full_text_unavailable: true
  findings:
  - statement: Cys318 is the covalent FAD attachment site; C318S keeps very weak activity that rises with added FAD, so covalent attachment is not strictly essential.
    supporting_text: The covalently binding to flavin was not essential to the enzyme activity because the C318S mutant exhibited extremely weak activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct work on the Arthrobacter TE1826 enzyme (His-tagged wild type and C318S).
- id: PMID:9185627
  title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
  full_text_unavailable: true
  findings:
  - statement: Monomeric sarcosine oxidases contain covalent FAD and, unlike heterotetrameric enzymes, do not use tetrahydrofolate as a substrate, releasing free formaldehyde.
    supporting_text: Monomeric sarcosine oxidases are similar in size to the beta subunit in the heterotetramers and contain covalently bound FAD.
    reference_section_type: ABSTRACT
  - statement: Only heterotetrameric sarcosine oxidases use tetrahydrofolates as substrates.
    supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Family-level comparison. The cached abstract does not say which
      monomeric enzymes (e.g. the Bacillus sp. B-0618 enzyme or this
      Arthrobacter enzyme) were tested, so its findings support the
      folate-independent GO:0008115 reaction for monomeric sarcosine oxidases
      in general, not as a direct assay of P40873.
