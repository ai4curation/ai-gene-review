      PubMed-verified; the only study that works with the GOX0265 gene product itself
      (overproduction, activity, purification). Abstract-only in the cache, so quotes
      are limited to abstract statements.
- id: PMID:20453146
  title: Metabolic engineering of Gluconobacter oxydans for improved growth rate and
    growth yield on glucose by elimination of gluconate formation.
  findings:
  - statement: >-
      Inactivation of the membrane-bound glucose dehydrogenase gene in G. oxydans
      N44-1 abolished formation of gluconate and of the downstream ketogluconates,
      while glucose was still consumed, establishing mGDH as the committing enzyme of
      periplasmic glucose oxidation.
    supporting_text: >-
      Both mutant strains completely consumed the glucose but produced neither
      gluconate nor the secondary products 2-ketogluconate and 2,5-diketogluconate.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Loss-of-function evidence is for the mgdH ortholog in strain
      N44-1, not in 621H; used as cross-strain support, as stated in the review
      reasons.
- id: PMID:16892291
  title: Modification of the membrane-bound glucose oxidation system in Gluconobacter
    oxydans significantly increases gluconate and 5-keto-D-gluconic acid accumulation.
  findings:
  - statement: >-
      Overproduction of the membrane-bound glucose dehydrogenase in a G. oxydans
      DSM 2343 (ATCC 621H) background increased gluconic acid formation.
    supporting_text: >-
      Furthermore, the resulting strains overproducing the membrane-bound
      glucose dehydrogenase showed an increased gluconic acid formation, whereas the
      overproduction of gluconate-5-dehydrogenase resulted in an increase in 5-KGA of
      up to 230 mM.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; strain background is the same as the reviewed entry (ATCC 621H),
      but the abstract does not name the locus tag.
- id: PMID:1833618
  title: A single amino acid substitution changes the substrate specificity of quinoprotein
    glucose dehydrogenase in Gluconobacter oxydans.
  findings:
  - statement: >-
      The gdh gene was cloned from G. oxydans strains differing in sugar specificity;
      the maltose-oxidizing P2 form differs from the glucose-only P1 form by a single
      histidine-to-asparagine substitution near the C terminus, which UniProt records
      as the P2 variant of this entry.
    supporting_text: >-
      This mutation could be ascribed to a 1 bp substitution resulting in
      the replacement of His 787 by Asn.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is reference 1 of the UniProt entry and the origin of its
      P1/P2 MISCELLANEOUS note and the VARIANT at position 788.
- id: PMID:23381123
  title: Genetic analysis of D-xylose metabolism pathways in Gluconobacter oxydans 621H.
  findings:
  - statement: >-
      A 621H mgdh deletion strain accumulated no xylonate and was strongly impaired on
      xylose, indicating that the same enzyme oxidizes D-xylose in vivo.
    supporting_text: >-
      These experimental observations suggested that the mgdh
      gene was responsible for the conversion of xylose to xylonate in G. oxydans,
      which was also verified by whole-cell biotransformation.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; same strain as the reviewed entry. Supports substrate breadth,
      which is noted in the description but not turned into a separate GO annotation.
- id: PMID:23519735
  title: Characterization of membrane-bound dehydrogenases from Gluconobacter oxydans
    621H via whole-cell activity assays using multideletion strains.
  findings:
  - statement: >-
      Clean deletions of all membrane-bound dehydrogenases of 621H were constructed and
      their substrate spectra determined in whole cells; none of these deletions is
      lethal, so the membrane-bound oxidations are dispensable for viability.
    supporting_text: >-
      Our data demonstrate that there are
      less membrane-bound dehydrogenases in G. oxydans 621H than expected and that the
      deletion of all of them is not lethal for the organism.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
