- id: PMID:34795278
  title: Generation of a Gluconobacter oxydans knockout collection for improved extraction
    of rare earth elements.
  findings:
  - statement: >-
      In Gluconobacter oxydans B58, the gluconic-acid-rich biolixiviant used to leach
      rare earth elements is produced by periplasmic glucose oxidation by the
      PQQ-dependent membrane-bound glucose dehydrogenase; disrupting mgdh or the supply
      of its PQQ cofactor largely abolishes bioleaching.
    supporting_text: >-
      This is produced by periplasmic glucose oxidation by the pyrroloquinoline quinone
      (PQQ)-dependent membrane-bound glucose dehydrogenase (mGDH)
    full_text_unavailable: false
  - statement: >-
      Gluconic acid alone does not account for the leaching activity of the culture
      fluid, so mGDH activity is necessary but not a complete explanation of leaching.
    supporting_text: >-
      gluconic acid alone fails to explain bioleaching by G. oxydans
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Work is on strain NRRL B-58 and its mgdh
      ortholog, not on the 621H entry reviewed here; used for biological context, not
      for a strain-specific claim.
- id: PMID:40425722
  title: High efficiency rare earth element bioleaching with systems biology guided
    engineering of Gluconobacter oxydans.
  findings:
  - statement: >-
      Driving higher expression of mgdh in a phosphate-signalling mutant background
      lowered biolixiviant pH further and improved rare earth element extraction from
      allanite ore, consistent with mGDH activity being rate-relevant for acidification.
    supporting_text: >-
      G. oxydans ΔpstS, P112:mgdh produced REE-bioleaching that was 53.1% higher than
      wild-type.
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. Strain B58, as above; relevant to the applied
      context in which this protein is cited rather than to its molecular function.
