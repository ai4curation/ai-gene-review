    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:P27175
      slot: FT SIGNAL
      requested_change: CHECK
      asserted_value: "SIGNAL 1..33"
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The entry annotates a cleavable signal peptide (FT SIGNAL 1..33,
        ECO:0000255) and "Flags: Precursor", with the mature chain starting at 34,
        immediately followed by four predicted transmembrane helices (35..54, 59..76,
