  findings:
  - statement: >-
      The gene reviewed here, gox0265, encodes the membrane-bound PQQ-dependent glucose
      dehydrogenase; overproducing it raised membrane mGDH activity five-fold and the
      gluconate production rate by 70 percent, and the enzyme was purified from the
      membrane fraction.
    supporting_text: >-
