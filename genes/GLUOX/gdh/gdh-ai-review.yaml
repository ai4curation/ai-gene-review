  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  review:
    summary: >-
      mGDH is an integral protein of the bacterial inner (cytoplasmic) membrane,
      mapped here from the curated UniProt subcellular location.
    action: ACCEPT
    reason: >-
      Independent lines agree. UniProt curates the location as cell inner membrane,
      multi-pass, with predicted N-terminal transmembrane helices; the enzyme was
      assayed and purified from the membrane fraction of a G. oxydans strain
      overproducing it (PMID:22790543), and its electron acceptor is the membrane
      quinone pool. In a bacterium without an outer-membrane alternative for this
      enzyme, plasma membrane is the correct and informative component term.
    supported_by:
    - reference_id: file:GLUOX/gdh/gdh-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane; Multi-pass membrane protein;"
    - reference_id: PMID:22790543
      supporting_text: >-
        Furthermore, membranes from the overexpression strain had a five- and threefold
        increase of mGDH activity and oxygen consumption rates, respectively.
