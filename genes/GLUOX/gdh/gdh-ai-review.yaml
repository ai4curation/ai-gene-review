core_functions:
- description: >-
    PQQ-dependent oxidation of D-glucose to D-glucono-1,5-lactone at the periplasmic
    face of the inner membrane, with electrons passed to the membrane ubiquinone pool;
    this is the committing step of non-phosphorylative glucose catabolism in
    Gluconobacter oxydans and the source of the gluconic acid that acidifies the medium.
  molecular_function:
    id: GO:0008876
    label: quinoprotein glucose dehydrogenase activity
  directly_involved_in:
  - id: GO:0019595
    label: non-phosphorylated glucose catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
  supported_by:
  - reference_id: PMID:22790543
    supporting_text: >-
      The higher glucose oxidation rates of the mGDH overproduction strain
      corresponded to a 70 % increase of the gluconate production rate compared to
      the control strain.
  - reference_id: PMID:20453146
    supporting_text: >-
      Both mutant strains completely consumed the glucose but produced neither
      gluconate nor the secondary products 2-ketogluconate and 2,5-diketogluconate.
  - reference_id: file:GLUOX/gdh/gdh-uniprot.txt
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane; Multi-pass membrane protein;"
proposed_new_terms: []
suggested_questions:
- question: >-
    Is the N-terminal region of P27175 really cleaved as a signal peptide, as the
    UniProt precursor annotation implies, or does it form the first helix of an
    uncleaved membrane anchor as in the Escherichia coli orthologue?
- question: >-
    Should GO offer a molecular function term for PQQ-dependent aldose (xylose)
    dehydrogenase activity, given that the same enzyme oxidizes D-xylose to xylonate
    in vivo?
- question: >-
    Which enzyme, if any, hydrolyses D-glucono-1,5-lactone to gluconate in the
    G. oxydans periplasm, and is any of that hydrolysis spontaneous at the pH reached
    during glucose oxidation?
suggested_experiments:
- hypothesis: >-
    GOX0265 is the sole enzyme responsible for gluconate formation in G. oxydans 621H,
    as its ortholog is in strain N44-1.
  description: >-
    Construct a clean 621H gox0265 deletion and complement it with the P1 and P2 forms
    of the gene; measure glucose consumption, gluconate and ketogluconate titres,
    culture pH, and membrane PQQ-dependent glucose oxidation activity.
  experiment_type: Gene deletion and complementation with product and activity assays
- hypothesis: >-
    The mature protein is retained in the inner membrane with its PQQ domain facing the
    periplasm, rather than being released as a soluble periplasmic enzyme.
  description: >-
    Determine the N-terminal sequence of the membrane-purified protein to test for
    signal-peptide cleavage, and probe topology by protease accessibility in
    spheroplasts versus inverted membrane vesicles with a C-terminally tagged construct.
  experiment_type: Protein topology and N-terminal sequencing
- hypothesis: >-
    The acidification attributable specifically to mGDH, rather than to other
    membrane-bound dehydrogenases, sets the leaching power of the culture fluid.
  description: >-
    Compare culture fluid from wild type, a gox0265 deletant and an mgdh-overexpressing
    strain, matched for pH by titration, in a mineral leaching assay, to separate the
    contribution of gluconate itself from that of the pH it produces.
  experiment_type: Comparative leaching assay with pH-matched controls
