id: P27175
gene_symbol: gdh
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  Membrane-bound pyrroloquinoline quinone (PQQ)-dependent glucose dehydrogenase
  (mGDH, GOX0265) of the acetic acid bacterium Gluconobacter oxydans. The protein is
  anchored in the cytoplasmic (inner) membrane by an N-terminal set of hydrophobic
  helices, and its large C-terminal PQQ beta-propeller domain faces the periplasm.
  There it oxidizes D-glucose to D-glucono-1,5-lactone and passes the electrons to
  ubiquinone in the membrane, feeding the quinol oxidases of the respiratory chain.
  The lactone is hydrolysed to gluconic acid, which other membrane-bound
  dehydrogenases can oxidize further to ketogluconates. This periplasmic,
  non-phosphorylative glucose oxidation accounts for most glucose turnover in
  G. oxydans and acidifies the medium strongly; loss of mGDH abolishes gluconate
  formation. The enzyme also oxidizes D-xylose to xylonate in vivo, and a single
  His-to-Asn substitution near the C terminus extends its substrate range to maltose.
  The gluconic-acid-rich acidic culture fluid produced by mGDH activity is the main
  lixiviant in laboratory bioleaching of rare earth elements from phosphor powders
  and ores by G. oxydans.
