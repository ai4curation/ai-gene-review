- term:
    id: GO:0008876
    label: glucose dehydrogenase (PQQ, quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:22152
  - EC:1.1.5.2
  - PANTHER:PTN002088148
  review:
    summary: >-
      The defining activity of the gene product: PQQ-dependent oxidation of D-glucose
      to D-glucono-1,5-lactone with ubiquinone as electron acceptor.
    action: ACCEPT
    reason: >-
      This is the core molecular function and is well supported for this very gene
      product. GOX0265 was overproduced and purified as mGDH, with a five-fold
      increase in membrane mGDH activity and a 70% higher gluconate production rate
      (PMID:22790543); overproduction of the membrane-bound glucose dehydrogenase in
      ATCC 621H raised gluconic acid formation (PMID:16892291); and inactivation of
      the orthologous mgdH in G. oxydans N44-1 abolished gluconate and ketogluconate
      formation from glucose (PMID:20453146). The term definition (D-glucose +
      ubiquinone = D-glucono-1,5-lactone + ubiquinol) matches the UniProt catalytic
      activity and RHEA:22152 exactly. GOA (fetched 2026-07-27) gives this term its
      current name, glucose dehydrogenase (PQQ, quinone) activity, which this row
      keeps; the slots authored in this review (replacement terms and core_functions)
      use the older name, quinoprotein glucose dehydrogenase activity, because that is
      the label in the ontology version used for validation. Both name GO:0008876.
    supported_by:
    - reference_id: PMID:22790543
      supporting_text: >-
        The higher glucose oxidation rates of the mGDH overproduction strain
        corresponded to a 70 % increase of the gluconate production rate compared to
        the control strain.
    - reference_id: PMID:20453146
      supporting_text: >-
        Both mutant strains completely consumed the glucose but produced neither
        gluconate nor the secondary products 2-ketogluconate and 2,5-diketogluconate.
