- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR001479
  review:
    summary: >-
      The periplasm is where the catalytic PQQ domain works, so the compartment term is
      right; what does not fit a membrane-integral protein is the located_in relation.
      The defensible claim is is_active_in the periplasmic space.
    action: ACCEPT
    reason: >-
      The term is correct and core: glucose oxidation by this enzyme takes place in the
      periplasm, which is the compartment the activity faces, and G. oxydans is a
      diderm bacterium, so the outer membrane-bounded periplasmic space is the right
      grain. The error is the relation. The mapping comes from IPR001479, a
      quinoprotein dehydrogenase conserved site shared by soluble periplasmic PQQ
      dehydrogenases (methanol dehydrogenase, soluble glucose dehydrogenase), for
      which located_in is true, and by membrane-integral ones such as this protein,
      which UniProt curates as a multi-pass inner-membrane protein (its located_in
      claim is carried by the accepted GO:0005886 row). GO's relation for a
      membrane-integral protein whose catalytic domain works in a compartment is
      is_active_in, and InterPro2GO can only emit the default located_in. This
      matches the repository's review of the direct ortholog, genes/PSEPK/gcd
      (P. putida KT2440 Gcd, Q88MX4), which adds the periplasmic space as a NEW
      is_active_in row on the same reasoning ("the catalytic domain faces the
      periplasm while the protein is membrane-integral"); the compartment claim is
      therefore kept here, not replaced, and the qualifier problem is recorded as a
      source defect. A leaflet term such as GO:0098567 periplasmic side of plasma
      membrane was considered and rejected: side-of-membrane terms denote one
      leaflet, while a multi-pass protein spans both. E. coli Gcd (P15877) receives
      the same InterPro2GO located_in GO:0030288 row (checked in QuickGO), so the
      issue is generic to the mapping rather than specific to this entry.
    supported_by:
    - reference_id: file:GLUOX/gdh/gdh-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane; Multi-pass membrane protein;"
    - reference_id: PMID:34795278
      supporting_text: >-
        This is produced by periplasmic glucose oxidation by the pyrroloquinoline quinone
        (PQQ)-dependent membrane-bound glucose dehydrogenase (mGDH)
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: OTHER
      slot: Qualifier
      requested_change: CHECK
      asserted_value: located_in
      corrected_value: is_active_in
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        InterPro2GO maps IPR001479 (quinoprotein dehydrogenase conserved site) to
        GO:0030288 outer membrane-bounded periplasmic space, which GOA emits with the
        default located_in relation. The term is appropriate for the catalytic
        compartment of every member, but the signature also matches
        membrane-integral enzymes such as the Gluconobacter oxydans membrane-bound
        glucose dehydrogenase (UniProtKB:P27175, curated "Cell inner membrane;
        Multi-pass membrane protein; Periplasmic side") and Escherichia coli Gcd
        (UniProtKB:P15877), whose relation to the periplasm is is_active_in, not
        located_in. Because the mapping file cannot carry a non-default qualifier,
        the alternatives are to accept the limitation, to restrict the mapping to
        the soluble members, or to drop the component mapping for this signature.
        Raised as suspected because the transmembrane topology of P27175 itself
        rests on sequence prediction and orthology. The resource is InterPro / the
        InterPro2GO mapping file maintained with GO.
- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017511
  review:
    summary: >-
      The protein binds a quinone, and the quinone it binds as a cofactor is
      identified: pyrroloquinoline quinone.
    action: MODIFY
    reason: >-
      UniProt curates PQQ as the cofactor of this enzyme, the PQQ beta-propeller
      domain and PROSITE bacterial PQQ sites are present, and the literature treats
      PQQ as the essential redox cofactor of mGDH, whose supply limits its activity
      in vivo (PMID:34795278). The specific descendant GO:0070968 pyrroloquinoline
      quinone binding is therefore supported and should replace the general term.
      Ubiquinone, the reaction's electron acceptor, is a substrate rather than a
      bound cofactor and is already captured by GO:0008876. The membrane-bound
      glucose dehydrogenases do have a distinct ubiquinone-binding site (E. coli Gcd,
      P15877, carries GO:0048039 ubiquinone binding by IDA in QuickGO), and
      GO:0048038 covered both ligands; this refinement asserts nothing about that site
      for P27175, for which no direct ubiquinone-binding evidence was found. The
      ortholog review genes/PSEPK/gcd makes the same refinement.
    proposed_replacement_terms:
    - id: GO:0070968
      label: pyrroloquinoline quinone binding
    supported_by:
    - reference_id: file:GLUOX/gdh/gdh-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: "Name=pyrroloquinoline quinone; Xref=ChEBI:CHEBI:58442;"
    - reference_id: PMID:34795278
      supporting_text: >-
        Disrupting the supply of the PQQ cofactor to the membrane-bound glucose
        dehydrogenase reduces REE extraction by up to 94%.
- term:
    id: GO:0019595
    label: non-phosphorylated glucose catabolic process
  evidence_type: IC
  original_reference_id: PMID:20453146
  qualifier: involved_in
  review:
    summary: >-
      Proposed process annotation: mGDH catalyses the first and committing step of the
      periplasmic, non-phosphorylative oxidation of glucose to gluconate and onward to
      ketogluconates, which is the dominant route of glucose catabolism in G. oxydans.
    action: NEW
    reason: >-
      The participation test is met directly: the enzyme itself performs the chemistry
      of the first step, oxidizing D-glucose to D-glucono-1,5-lactone without
      phosphorylation, and the pathway stops when it is removed - mgdH inactivation in
      G. oxydans N44-1 left glucose consumption intact but produced neither gluconate
      nor the downstream 2-ketogluconate and 2,5-diketogluconate (PMID:20453146).
      The comparator check supports rather than undercuts the proposal. In this
      repository, the review of the direct ortholog genes/PSEPK/gcd (P. putida KT2440
      Gcd, Q88MX4) independently makes the identical NEW GO:0019595 call, and the
      module modules/pseudomonad_2_ketogluconate_loop.yaml takes GO:0019595 as its
      top-level concept, with part 1 (periplasmic glucose oxidation) typed GO:0008876
      and exemplified by Escherichia coli Gcd (UniProtKB:P15877). That module's
      boundary is explicitly restricted to Pseudomonas, so G. oxydans lies outside it;
      this review supplies an Acetobacteraceae implementation of the same first step.
      Outside the repository, a QuickGO query confirms that P15877 itself carries
      GO:0019595 from EcoCyc on EXP evidence (PMID:2228962), with the
      acts_upstream_of_or_within relation rather than involved_in. Together these
      show an established convention for this class of enzyme, not an absence to be
      read as a curator decision.
      No descendant or ancestor of this term is otherwise asserted for this gene, and
      the process is stated at the level the evidence supports; the wider acidification
      and mineral-leaching outcomes downstream of gluconate are consequences of the
      acid produced, not processes this protein executes, so they are not proposed.
    supported_by:
    - reference_id: PMID:20453146
      supporting_text: >-
        Both mutant strains completely consumed the glucose but produced neither
        gluconate nor the secondary products 2-ketogluconate and 2,5-diketogluconate.
    - reference_id: PMID:22790543
      supporting_text: >-
        The higher glucose oxidation rates of the mGDH overproduction strain
        corresponded to a 70 % increase of the gluconate production rate compared to
        the control strain.
