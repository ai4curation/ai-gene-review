        assignment is independently supported by NCBIfam TIGR02138 and PANTHER
        PTHR30425:SF1.
core_functions:
  - description: >-
      Inner-membrane permease subunit of the PstSCAB phosphate importer: with PstA it
      forms the translocation pathway that receives phosphate from the periplasmic binding
      protein PstS and passes it to the cytoplasm, driven by ATP hydrolysis at PstB.
    contributes_to_molecular_function:
      id: GO:0015415
      label: ATPase-coupled phosphate ion transmembrane transporter activity
    directly_involved_in:
      - id: GO:0035435
        label: phosphate ion transmembrane transport
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0055052
      label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
    supported_by:
      - reference_id: file:GLUOX/pstC/pstC-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: >-
          Part of the binding protein-dependent transport system for
          phosphate; probably responsible for the translocation of the substrate
          across the membrane.
      - reference_id: PMID:40425722
        supporting_text: >-
          The transmembrane sub-units PstA and PstC bind to the periplasmic
          phosphate-binding protein, PstS, and to the cytoplasmic signaling protein,
          PstB
suggested_questions:
  - question: >-
      Does the acidification phenotype of the G. oxydans B58 pstC transposon disruption
      reproduce in a clean deletion in strain 621H, and does it require an intact PhoR?
      The published clean deletion of pstC was less acidic than the disruption, which the
      polar-effect hypothesis would explain but has not been tested.
  - question: >-
      Does G. oxydans encode a PhoU orthologue, and is it the link between the Pst complex
      and PhoR, as in Escherichia coli? The Pho-regulon mechanism assumed throughout the
      bioleaching literature for this organism has not been demonstrated in it.
  - question: >-
      GO:0005315 phosphate transmembrane transporter activity is is_a GO:0015291
      secondary active transmembrane transporter activity and carries secondary-active
      definition text, but has the ABC term GO:0015415 as an is_a child. Should GO make
      GO:0005315 an energy-neutral substrate grouping term, and would an InterPro2GO
      mapping of IPR011864 to GO:0015415 hold for every protein the entry matches, given
      that the activity belongs to the assembled complex rather than the permease?
suggested_experiments:
  - description: >-
      Measure phosphate uptake (radiolabelled Pi, or Pi depletion from defined medium) in
      wild-type 621H and in a markerless pstC deletion complemented in trans, to show
      directly that GOX0706 is required for high-affinity phosphate import rather than
      inferring it from family membership.
  - description: >-
      Distinguish polar from genuine loss-of-function effects behind the published
      disruption/deletion discrepancy: construct in-frame pstC deletions with and without
      a constitutive promoter driving the downstream pst genes, and measure biolixiviant
      pH, gluconic acid titre and Pho-regulon reporter output for each.
  - description: >-
      Pull down the assembled complex from the inner-membrane fraction with a tagged PstC
      and identify partners by mass spectrometry, to confirm the PstSCAB stoichiometry
      assumed here from family rules and to test whether PhoU or PhoR co-purify.
