id: Q5FT13
gene_symbol: pstC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  pstC (GOX0706) encodes one of the two transmembrane permease subunits of the
  high-affinity PstSCAB phosphate ABC importer of Gluconobacter oxydans. The protein has
  the MetI-like fold typical of type-I ABC-importer permeases, with six predicted
  membrane-spanning helices and an ABC transmembrane type-1 domain, and is assigned
  specifically to the PstC rather than the paralogous PstA subfamily by NCBIfam TIGR02138
  and InterPro IPR011864. Together with PstA it forms the inner-membrane translocation
  pathway: the periplasmic binding protein PstS delivers inorganic phosphate to the
  PstC/PstA pair, and ATP hydrolysis by the PstB ATPase drives the substrate into the
  cytoplasm. PstC is not catalytic on its own; the transport reaction is a property of the
  assembled complex. In bacteria the intact Pst system is also the sensory input that
  reports phosphate sufficiency to the PhoR-PhoB two-component system, which in
  G. oxydans sits upstream of the organic-acid secretion that solubilizes mineral
  phosphate.
existing_annotations:
  - term:
      id: GO:0005315
      label: phosphate transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    supporting_entities:
      - InterPro:IPR011864
    review:
      summary: >-
        Phosphate transmembrane transport is the right activity, but it is enabled by the
        assembled PstSCAB complex, not by the PstC permease subunit alone. PstC
        contributes to the complex-level ATP-driven activity GO:0015415, a descendant of
        GO:0005315, and that is recorded in core_functions.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The entry is assigned to the PstC permease of a binding-protein-dependent ABC
        system by TIGR02138 and IPR011864, and the curated RuleBase statement makes it
        responsible for translocation across the membrane. The transport activity
        itself, however, belongs to the PstSCAB complex: PstS delivers phosphate, PstC
        and PstA form the pathway, and PstB hydrolyses ATP. A single permease subunit
        does not enable GO:0005315 on its own, so the enables row over-states what PstC
        does. This follows the sibling reviews of the same complex (genes/ECOLI/pstC
        and genes/ECOLI/pstA for GO:0005315, genes/ECOLI/pstB for GO:0015415, all
        MARK_AS_OVER_ANNOTATED). The more specific GO:0015415 ATPase-coupled phosphate
        ion transmembrane transporter activity is an is_a descendant of GO:0005315 (it
        has GO:0005315 and GO:0042626 as parents; QuickGO, checked 2026-10-28), so it is
        a refinement of the same claim. It is not proposed as an enables replacement
        here because that would repeat the subunit/complex conflation; instead it is
        recorded as contributes_to in core_functions. The InterPro2GO mapping of
        IPR011864 to GO:0005315 is over-broad for an ABC permease family rather than
        wrong, and is not recorded as an InterPro defect. GO:0005315's own definition
        and its is_a parent GO:0015291 secondary active transmembrane transporter
        activity are inconsistent with its ABC child GO:0015415; that GO-side issue is
        recorded below.
      supported_by:
        - reference_id: file:GLUOX/pstC/pstC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Part of the binding protein-dependent transport system for
            phosphate; probably responsible for the translocation of the substrate
            across the membrane.
        - reference_id: PMID:40425722
          supporting_text: >-
            The Pst phosphate-specific transport system is a transmembrane protein
            complex located in the bacterial inner membrane.
      source_defects:
        - defect_type: OTHER
          resource: OTHER
          record: GO:0005315
          slot: is_a
          requested_change: CHECK
          asserted_value: GO:0015291
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            Gene Ontology (ontology editors, not an annotation source).
            GO:0005315 phosphate transmembrane transporter activity is asserted is_a
            GO:0015291 secondary active transmembrane transporter activity (QuickGO
            is_a ancestors of GO:0005315, checked 2026-10-28: GO:0022857, GO:0022804,
            GO:0015291, GO:0005215, GO:0003674), and its text definition carries the
            secondary-active wording "Transport works equally well in either direction
            and is driven by a chemiosmotic source of energy. Secondary active
            transporters include symporters and antiporters." Yet its is_a children
            include GO:0015415 ATPase-coupled phosphate ion transmembrane transporter
            activity, whose other parent is GO:0042626 ATPase-coupled transmembrane
            transporter activity. GO:0015415 therefore inherits GO:0015291 (QuickGO
            is_a ancestors of GO:0015415 include GO:0005315, GO:0042626, GO:0015399 and
            GO:0015291), classifying an ATP-driven ABC importer activity as a
            secondary active transporter. Either GO:0005315 should be a
            substrate-only grouping term (parent GO:0022857, energy-neutral
            definition), or GO:0015415 should not sit under it; the choice is for the GO
            editors. The InterPro2GO mapping IPR011864 to GO:0005315 is over-broad for an
            ABC permease family but not itself wrong, given this placement.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    supporting_entities:
      - UniProtKB-SubCell:SL-0037
      - UniProtKB-SubCell:SL-0039
    review:
      summary: >-
        PstC is a polytopic inner-membrane protein; in a bacterium the inner (cytoplasmic)
        membrane is GO:0005886.
      action: ACCEPT
      reason: >-
        The subcellular location is asserted by the curated RuleBase RU363054 system and
        is corroborated independently by the protein's own sequence features: six
        PROSITE-ProRule transmembrane helices and an ABC transmembrane type-1 domain
        (residues 88-318). A permease that forms the translocation pathway of an
        inner-membrane importer can hardly be anywhere else, and the primary literature
        places the whole Pst complex in the bacterial inner membrane. This is the
        location where the core activity happens, so it is accepted rather than kept as
        non-core.
      supported_by:
        - reference_id: file:GLUOX/pstC/pstC-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane"
        - reference_id: PMID:40425722
          supporting_text: >-
            The Pst phosphate-specific transport system is a transmembrane protein
            complex located in the bacterial inner membrane.
  - term:
      id: GO:0006817
      label: phosphate ion transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    supporting_entities:
      - InterPro:IPR011864
    review:
      summary: >-
        True, but less specific than the evidence supports: the transport PstC performs
        is across a membrane, so GO:0035435 is the right child.
      action: MODIFY
      reason: >-
        GO:0006817 covers movement of phosphate "into, out of or within a cell, or between
        cells", which includes transport that is not transmembrane. PstC is a polytopic
        inner-membrane permease forming the translocation pathway of the Pst importer, so
        the transmembrane child GO:0035435 is supported and is the term the paralogous
        binding protein PstS already carries in this family's InterPro2GO mappings. A
        refinement to an is_a descendant, per the correct-but-general rule.
      proposed_replacement_terms:
        - id: GO:0035435
          label: phosphate ion transmembrane transport
      supported_by:
        - reference_id: file:GLUOX/pstC/pstC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Part of the binding protein-dependent transport system for
            phosphate; probably responsible for the translocation of the substrate
            across the membrane.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    supporting_entities:
      - InterPro:IPR000515
      - InterPro:IPR011864
      - UniRule:UR000414660
    review:
      summary: >-
        True but uninformative beside the accepted plasma membrane row that entails it.
      action: TOO_GENERAL
      reason: >-
        The claim is correct - the MetI-like signature IPR000515 identifies a membrane
        protein - but GO:0005886 plasma membrane is accepted in this review and is a
        descendant of GO:0016020, so this row adds no information. GO:0016020 is a generic
        term, not a root organelle term, so the organelle exception does not apply; the
        row is not removed, since the claim is not false.
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: part_of
    supporting_entities:
      - UniRule:UR000414660
    review:
      summary: >-
        Complex membership is right; the five-subunit importer term GO:0055052 matches the
        architecture of the Pst system.
      action: MODIFY
      reason: >-
        GO:0043190 is true, but the Pst system is specifically a binding-protein-dependent
        importer: two ATP-binding subunits (PstB), two membrane-spanning subunits (PstC
        and PstA) and one substrate-binding subunit (PstS), which is the composition
        GO:0055052 is defined by. GO:0055052 is an is_a descendant of GO:0043190, and the
        curated RuleBase FUNCTION statement for this entry makes the binding-protein
        dependence explicit. The same refinement is proposed on the partner subunit
        Q5FTI1 (pstS).
      proposed_replacement_terms:
        - id: GO:0055052
          label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
      supported_by:
        - reference_id: file:GLUOX/pstC/pstC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Part of the binding protein-dependent transport system for
            phosphate; probably responsible for the translocation of the substrate
            across the membrane.
        - reference_id: PMID:40425722
          supporting_text: >-
            The transmembrane sub-units PstA and PstC bind to the periplasmic
            phosphate-binding protein, PstS, and to the cytoplasmic signaling protein,
            PstB
  - term:
      id: GO:0055085
      label: transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    supporting_entities:
      - InterPro:IPR000515
    review:
      summary: >-
        True but uninformative: the substrate-specific child GO:0035435 is asserted in
        this review.
      action: TOO_GENERAL
      reason: >-
        The mapping comes from IPR000515, the generic MetI-like ABC transmembrane domain,
        which is shared with permeases for many other substrates, so it can say nothing
        about what is transported. The substrate-specific signature IPR011864 and the
        curated RuleBase statement both identify this protein as a phosphate permease, and
        GO:0035435 phosphate ion transmembrane transport - a descendant of GO:0055085 - is
        the replacement proposed on the GO:0006817 row. The claim is not false, so the row
        is retained rather than removed.
