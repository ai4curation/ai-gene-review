  - id: PMID:40425722
    title: High efficiency rare earth element bioleaching with systems biology guided
      engineering of Gluconobacter oxydans.
    findings:
      - statement: >-
          The Pst system is an inner-membrane complex in which the transmembrane subunits
          PstA and PstC engage the periplasmic binding protein PstS and the ATPase PstB.
        supporting_text: >-
          The Pst phosphate-specific transport system is a transmembrane protein complex
          located in the bacterial inner membrane. The transmembrane sub-units PstA and
          PstC bind to the periplasmic phosphate-binding protein, PstS, and to the
          cytoplasmic signaling protein, PstB
        reference_section_type: RESULTS
      - statement: >-
          A clean deletion of pstC did not reproduce the bioleaching gain of the
          transposon disruption, so the disruption phenotype is not a simple
          loss-of-function readout.
        supporting_text: ΔpstC did not produce additional bioleaching improvement.
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Commun Biol 8:815, DOI 10.1038/s42003-025-08109-5); full text
        cached. Used here for the architecture and membrane placement of the Pst complex.
        The paper's description of subunit roles is loose (PstB is called "the cytoplasmic
        signaling protein"), noted in pstC-notes.md; no annotation rests on that wording.
        Its genetic work is in strain B58, not strain 621H.
  - id: PMID:34795278
    title: Generation of a Gluconobacter oxydans knockout collection for improved extraction
      of rare earth elements.
    findings:
      - statement: >-
          Transposon disruption of pstC produced the most acidic biolixiviant in a
          genome-wide G. oxydans B58 knockout screen, alongside disruptions of the other
          pst genes.
        supporting_text: >-
          The most acidic biolixiviant was produced by a disruption in the phosphate
          transport gene δpstC at pH 2.09. In fact, 4 of the 11 mutant strains that
          produced a more acidic biolixiviant were disrupted in genes involved in the
          phosphate-specific transport system (δpstA, δpstB, δpstC, and δpstS).
        reference_section_type: RESULTS
      - statement: >-
          The authors attribute the effect to loss of phosphate sensing by the Pst system,
          with the regulatory steps performed by PhoR and PhoB.
        supporting_text: >-
          We speculate that by disrupting pstSCAB or PhoR, we prevent G. oxydans from
          sensing when there is adequate phosphate in its environment and when to stop
          producing biolixiviants.
        reference_section_type: DISCUSSION
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Nat Commun 2021, PMC8602642); full text cached. Physiological
        context only: the phenotypes are transposon disruptions in strain B58, they
        establish that the gene is required for normal shutdown of acidogenesis rather
        than that PstC performs a regulatory step, and the mechanism is stated by the
        authors as speculation. No annotation is derived from it.
