id: Q5FTI1
gene_symbol: pstS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  pstS (GOX0537) encodes the substrate-binding protein of the high-affinity PstSCAB
  phosphate ABC importer of Gluconobacter oxydans. The protein belongs to the PstS
  family (PIRSF002756, TIGR00975, PANTHER PTHR42996:SF1) and consists of a single
  bilobed type-II periplasmic-binding-protein fold that closes around an inorganic
  phosphate ion. It is made with an N-terminal Sec signal sequence and, in this diderm
  alphaproteobacterium, works in the periplasm, where it scavenges free phosphate and
  delivers it to the PstC/PstA transmembrane subunits for ATP-driven translocation by
  PstB. In bacteria generally, the assembled Pst system also acts as the sensory input
  to the PhoR-PhoB two-component system, so phosphate capture by the binding protein is
  coupled to the cell's assessment of phosphate sufficiency; in G. oxydans that output
  includes the incomplete-glucose-oxidation pathway responsible for gluconic acid
  secretion and mineral phosphate solubilization. The protein itself has no catalytic
  activity.
