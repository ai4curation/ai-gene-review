          record_section: ["DR:PIRSF"]
          supporting_text: 'DR   PIRSF; PIRSF002756; PstS; 1.'
        - reference_id: file:GLUOX/pstS/pstS-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: 'DR   Pfam; PF12849; PBP_like_2; 1.'
        - reference_id: file:GLUOX/pstS/pstS-uniprot.txt
          record_section: ["DR:SUPFAM"]
          supporting_text: 'DR   SUPFAM; SSF53850; Periplasmic binding protein-like II; 1.'
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    supporting_entities:
      - InterPro:IPR005673
    review:
      summary: >-
        Complex membership is right, but the specific five-subunit importer term
        GO:0055052 matches the architecture the record states.
      action: MODIFY
      reason: >-
        GO:0043190 is true (its definition explicitly includes the substrate-binding
        proteins of bacterial ABC importers), but the curated PIRNR002756 SUBUNIT
        statement describes exactly the composition GO:0055052 is defined by - two
        ATP-binding subunits, two membrane-spanning subunits and one substrate-binding
        subunit - and GO:0055052 is an is_a descendant of GO:0043190. Refining the row
        also captures that this is an importer rather than an exporter.
      proposed_replacement_terms:
        - id: GO:0055052
          label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
      supported_by:
        - reference_id: file:GLUOX/pstS/pstS-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: >-
            The complex is composed of two ATP-binding proteins (PstB),
            two transmembrane proteins (PstC and PstA) and a solute-binding protein
            (PstS).
  - term:
      id: GO:0030288
      label: outer membrane-bounded periplasmic space
    evidence_type: IC
    original_reference_id: PMID:40425722
    qualifier: located_in
    review:
      summary: >-
        Proposed location: the substrate-binding protein of a Pst system in a diderm
        alphaproteobacterium works in the periplasm.
      action: NEW
      reason: >-
        The entry carries no subcellular location at all, which leaves the one piece of
        cellular context that makes the binding activity interpretable unstated. Three
        independent lines agree. (i) G. oxydans is a Gram-negative alphaproteobacterium,
        so it has a periplasm bounded by an outer membrane, and GO:0055052 - the complex
        term this review assigns - is defined with the substrate-binding protein moving
        freely in that space. Because the diderm envelope is exactly what GO:0030288
        outer membrane-bounded periplasmic space encodes, that term is used rather than
        the cross-taxon parent GO:0042597 periplasmic space, matching the location used
        for the E. coli orthologue in genes/ECOLI/pstS.
        (ii) The literature on this very system calls PstS periplasmic. (iii) Residues
        1-27 of the sequence (MFHRVGFIARGLAVALVVMVFGTAHSA) have the tripartite
        architecture of a Sec signal peptide - basic n-region (H3, R4, R10), long apolar
        h-region (about residues 11-21), and a small-residue c-region (GTAHSA, residues
        22-27) - with no lipobox cysteine, so the protein is exported and released rather
        than membrane-anchored. This is a reviewer reading of the sequence: the entry
        carries no FT SIGNAL feature, and the exact cleavage position (somewhere in
        residues 24-27, just before or overlapping the Pfam PBP_like_2 domain start at
        residue 25) is not determined.
        Asserted as IC, a curator inference from the complex membership and family
        assignment, rather than as an experimental claim.
      supported_by:
        - reference_id: PMID:40425722
          supporting_text: >-
            The transmembrane sub-units PstA and PstC bind to the periplasmic
            phosphate-binding protein, PstS, and to the cytoplasmic signaling protein,
            PstB
        - reference_id: file:GLUOX/pstS/pstS-uniprot.txt
          record_section: ["FT:DOMAIN"]
          supporting_text: 'DOMAIN          25..299'
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO
      terms
    findings: []
  - id: PMID:40425722
    title: High efficiency rare earth element bioleaching with systems biology guided
      engineering of Gluconobacter oxydans.
    findings:
      - statement: >-
          The Pst system is described as an inner-membrane complex in which the PstA and
          PstC transmembrane subunits engage the periplasmic phosphate-binding protein
          PstS.
        supporting_text: >-
          The Pst phosphate-specific transport system is a transmembrane protein complex
          located in the bacterial inner membrane. The transmembrane sub-units PstA and
          PstC bind to the periplasmic phosphate-binding protein, PstS, and to the
          cytoplasmic signaling protein, PstB
        reference_section_type: RESULTS
      - statement: >-
          Clean deletion of pstS in the G. oxydans B58 background lowers biolixiviant pH
          and raises rare-earth bioleaching from allanite ore by about 30% over wild-type.
        supporting_text: >-
          ΔpstB raised bioleaching by 29.3% over wild-type, while ΔpstS raised bioleaching
          by 30.1%.
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Commun Biol 8:815, DOI 10.1038/s42003-025-08109-5); full text
        cached. Supports the periplasmic placement of PstS and the deletion phenotype.
        Its prose is loose about subunit roles - it calls PstB "the cytoplasmic signaling
        protein" and pstS "a phosphate signaling protein" - which conflicts with the
        standard architecture and with this entry's own curated SUBUNIT line; that
        looseness is noted in pstS-notes.md and no annotation rests on it. The deletion
        work is in strain B58, not in strain 621H whose protein is reviewed here.
  - id: PMID:34795278
    title: Generation of a Gluconobacter oxydans knockout collection for improved extraction
      of rare earth elements.
    findings:
      - statement: >-
          Disruption of pst genes, including pstS, raises biolixiviant acidity, consistent
          with the Pst transporter acting as the phosphate-sufficiency input to the Pho
          regulon rather than as an acid-producing enzyme.
        supporting_text: >-
          The most acidic biolixiviant was produced by a disruption in the phosphate
          transport gene δpstC at pH 2.09. In fact, 4 of the 11 mutant strains that
          produced a more acidic biolixiviant were disrupted in genes involved in the
          phosphate-specific transport system (δpstA, δpstB, δpstC, and δpstS).
        reference_section_type: RESULTS
      - statement: >-
          The proposed mechanism places the regulatory step on PhoR and PhoB, with
          PstSCAB as the sensory input.
        supporting_text: >-
          Under phosphate-limiting conditions, the PstSCAB phosphate transporter will
          activate the histidine kinase PhoR, which in turn phosphorylates the
          transcription factor PhoB and activates the pho regulon, enabling phosphate
          solubilization and uptake
        reference_section_type: DISCUSSION
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Nat Commun 2021, PMC8602642); full text cached. Relevant as
        physiological context for the Pst system in G. oxydans, but the phenotypes are
        transposon disruptions in strain B58 and are necessity/derepression evidence; the
        paper's own wording for the regulatory mechanism is explicitly speculative, so no
        process annotation is derived from it.
