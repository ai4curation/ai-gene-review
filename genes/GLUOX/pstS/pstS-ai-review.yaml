    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    supporting_entities:
      - InterPro:IPR005673
    review:
      summary: >-
        PstS is the substrate-binding subunit of the PstSCAB phosphate importer and does
        part of the work of transport: it captures periplasmic phosphate and delivers it
        to the membrane subunits.
      action: ACCEPT
      reason: >-
        The InterPro2GO transfer is from IPR005673, the PstS-specific substrate-binding
        protein signature, which the entry matches along with the curated PIRNR002756
        (PstS) and NCBIfam TIGR00975 systems. Substrate capture and delivery is
        participation in the transport process, not mere necessity, so involved_in is the
        right relation and the term is at the right granularity for a phosphate-specific
        importer.
      supported_by:
