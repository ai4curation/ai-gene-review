suggested_questions:
  - question: >-
      Does G. oxydans PstS, like its enterobacterial counterparts, participate in
      phosphate-sufficiency signalling through PhoU and PhoR, and if so is the signalling
      competence separable from phosphate transport?
  - question: >-
      Is the phosphate affinity of GOX0537 in the range reported for enterobacterial PstS
      (sub-micromolar), and does it discriminate against arsenate, which matters for
      bioleaching feedstocks containing arsenate-bearing minerals?
  - question: >-
      GO has no term for the sensory role of a substrate-binding protein that feeds a
      two-component system. Should that be requested, or is the signalling claim better
      represented as a GO-CAM with PhoR and PhoB performing the regulatory steps?
suggested_experiments:
  - description: >-
      Construct the clean pstS deletion in strain 621H (the strain this accession comes
      from) and complement it with GOX0537 in trans, measuring phosphate uptake rate,
      alkaline-phosphatase (Pho regulon) induction and biolixiviant pH. This separates the
      transport contribution from the regulatory one and tests whether the B58 phenotype
      transfers to 621H.
  - description: >-
      Purify the mature protein (from the predicted signal-peptide cleavage site, near
      residue 25-28, to residue 329) and measure phosphate binding by
      isothermal titration calorimetry or intrinsic tryptophan fluorescence, with arsenate
      and sulfate as counter-ligands, to put a number on the binding activity that is
      currently asserted only from family membership.
  - description: >-
      Verify the predicted export and periplasmic location directly: signal-peptide
      cleavage by N-terminal sequencing of the mature protein, and periplasmic
      fractionation (osmotic shock) with an inner-membrane and a cytoplasmic marker.
