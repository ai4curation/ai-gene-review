          supporting_text: >-
            Part of the ABC transporter complex PstSACB involved in
            phosphate import.
  - term:
      id: GO:0042301
      label: phosphate ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    supporting_entities:
      - InterPro:IPR005673
    review:
      summary: >-
        Binding inorganic phosphate is the protein's own molecular function, independent
        of the rest of the complex.
      action: ACCEPT
      reason: >-
        This is the one activity a solute-binding protein enables by itself, and it is
        what the matched family signatures are defined by: IPR005673 and PIRSF002756 are
        the phosphate-binding protein PstS, and the Pfam PBP_like_2 domain (PF12849,
        residues 25-299) is the bilobed type-II periplasmic binding fold that closes on
        the phosphate ion. Kept as the core molecular function.
      supported_by:
