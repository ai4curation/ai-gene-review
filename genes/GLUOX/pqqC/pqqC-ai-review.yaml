  review:
    summary: >-
      PqqC is the terminal enzyme of PQQ biosynthesis, producing mature PQQ from the late
      intermediate AHQQ, so the gene product performs a step of the process rather than
      merely being required for it. GOX0985 carries the PqqC-specific signatures (HAMAP
      MF_00654, NCBIfam TIGR02111 PQQ_syn_pqqC, InterPro IPR011845) and UniProt places it in
      the pyrroloquinoline quinone biosynthesis pathway. Independent genetic evidence in
      Gluconobacter supports a functional pqq pathway in this species: PQQ supplementation
      restores acid production in a pqq-cluster transposon mutant, and transposon disruption
      of pqqC in G. oxydans B58 produces the least acidic lixiviant and a large reduction in
      rare earth element leaching, consistent with loss of the glucose dehydrogenase cofactor.
    action: ACCEPT
    reason: >-
      The term names the process in which PqqC catalyses the final step, and it is at the
      right granularity for a biosynthetic pathway enzyme. The family assignment is a tight,
      single-function one and the genetic data in Gluconobacter are consistent with it.
