      This is the core molecular function of PqqC and the exact activity the family performs.
      UniProt's curated FUNCTION and CATALYTIC ACTIVITY lines describe ring cyclization and
      eight-electron oxidation of AHQQ to PQQ (RHEA:10692, EC 1.3.3.11), and the enzymology was
