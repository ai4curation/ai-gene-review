proposed_new_terms: []
suggested_questions:
- question: >-
    Is PQQ biosynthesis in Gluconobacter oxydans cytoplasmic, and how is mature PQQ exported to
    the periplasmic quinoprotein dehydrogenases that use it? No subcellular location is
    annotated for this entry and no transmembrane or signal features are predicted, so no
    cellular-component annotation is proposed here.
- question: >-
    Does the Gluconobacter oxydans 621H pqq cluster lack pqqF/pqqG, and do the tldD/tldE gene
    products supply the PqqA-processing protease activity in their place, as proposed from the
    B58 transposon phenotypes?
suggested_experiments:
- hypothesis: >-
    Gluconobacter oxydans GOX0985 is a functional pyrroloquinoline-quinone synthase with the
    family-conserved cofactorless oxidase chemistry.
  description: >-
    Express and purify GOX0985, incubate it with the AHQQ intermediate under controlled oxygen
    tension, and follow PQQ formation by LC-MS while measuring O2 consumption and H2O2 release,
    to test whether the Gluconobacter enzyme reproduces the stoichiometry established for
    characterized PqqC.
  experiment_type: enzyme assay with LC-MS and oxygen/peroxide quantification
- hypothesis: >-
    The acidification and leaching defect of a pqqC mutant is due specifically to loss of PQQ,
    not to a secondary effect of the disruption.
  description: >-
    Construct a clean pqqC deletion in Gluconobacter oxydans, quantify intracellular and
    secreted PQQ, and test whether exogenous PQQ supplementation or complementation with pqqC in
    trans restores glucose dehydrogenase activity and gluconic acid production.
  experiment_type: genetic complementation with cofactor supplementation and metabolite quantification
