taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  pqqC (GOX0985) encodes pyrroloquinoline-quinone synthase (EC 1.3.3.11), the terminal
  enzyme of pyrroloquinoline quinone (PQQ) biosynthesis. PqqC converts the late pathway
  intermediate 6-(2-amino-2-carboxyethyl)-7,8-dioxo-1,2,3,4,7,8-hexahydroquinoline-2,4-dicarboxylate
  (AHQQ) into mature PQQ by ring cyclization coupled to an eight-electron oxidation, using
  molecular oxygen as the electron acceptor without a redox-active metal or organic cofactor.
  The mature PQQ it produces is the prosthetic group of quinoprotein dehydrogenases, including
  the membrane-bound glucose dehydrogenase that oxidizes D-glucose to gluconic acid in the
  periplasm of this acetic acid bacterium. In Gluconobacter the pqq genes are organized in a
  pqqA-E cluster; the protein belongs to the PqqC family (HAMAP MF_00654, TIGRFAM TIGR02111,
  InterPro IPR011845).
