- id: PMID:34795278
  title: Generation of a Gluconobacter oxydans knockout collection for improved extraction of rare earth elements.
  findings:
  - statement: >-
      A transposon disruption of pqqC in Gluconobacter oxydans B58 produced the least acidic
      biolixiviant of all strains tested.
    supporting_text: "The most alkaline biolixiviant was produced by a disruption in the PQQ synthesis system, δpqqC, at pH 4.71."
  - statement: >-
      The pqqC disruption strain was strongly impaired for rare earth element extraction from
      retorted phosphor powder.
    supporting_text: "δpqqC reduced bioleaching by ≈94%."
  - statement: >-
      The authors attribute the reduced acidity of pqq-pathway disruption strains to loss of the
      redox cofactor required by the membrane-bound glucose dehydrogenase.
    supporting_text: "Disruption mutants that knocked out the synthesis of mGDH’s essential redox cofactor, PQQ, also produced significant reductions in biolixiviant acidity."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified whole-genome transposon knockout study. The phenotypes are from strain
      B58, not the 621H entry under review, and they establish that PQQ synthesis is necessary
      for gluconic-acid-driven leaching rather than directly assaying PqqC catalysis; cited here
      as corroboration of the biosynthetic-process annotation only.
