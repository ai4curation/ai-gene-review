core_functions:
  - description: >-
      NAD(P)(H)-dependent aldo-keto reductase: reduces a carbonyl carbon by hydride
      transfer from the reduced dinucleotide, using the superfamily's catalytic
      tetrad Asp62/Tyr67/Lys101/His147 within a single (beta/alpha)8 AKR barrel.
      Equivalently, in the oxidative direction, it oxidises a CH-OH group with NAD
      or NADP as acceptor. The substrate, the cofactor preference and the
      physiological role are unknown.
    molecular_function:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    supported_by:
      - reference_id: file:GLUOX/GOX1598/GOX1598-bioinformatics/RESULTS.md
        supporting_text: >-
          Every curated catalytic position of every reference maps onto an
          **identical**
          residue in Q5FQK7, and all five references agree on the same four
          Q5FQK7
          positions
      - reference_id: file:GLUOX/GOX1598/GOX1598-uniprot.txt
        record_section: ["DR:Pfam"]
        supporting_text: 'DR   Pfam; PF00248; Aldo_ket_red; 1.'
      - reference_id: PMID:14517983
        supporting_text: >-
          Crystal structure of the Escherichia coli Tas protein, an
          NADP(H)-dependent aldo-keto reductase.
    knowledge_gaps:
      - gap_statement: >-
          No substrate is known for GOX1598, nor for its closest characterised
          relative E. coli Tas, so the reaction this enzyme actually runs in
          G. oxydans is undetermined.
        boundary: >-
          Established: the catalytic tetrad and the dinucleotide pocket core are
          intact, so a carbonyl-reducing activity is expected. Unknown: which
          carbonyl compound, and whether the physiological direction is reduction
          or oxidation.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
        status: OPEN
        significance: >-
          Without a substrate the enzyme cannot be placed in any pathway, and the
          molecular function cannot be refined below the reaction class. A
          substrate would also decide whether the protein belongs to the organism's
          oxidative sugar and alcohol metabolism or to an unrelated detoxification
          role, which is the question that matters for engineering G. oxydans.
      - gap_statement: >-
          Whether GOX1598 uses NADPH or NADH is unresolved, and cannot be resolved
          from sequence: the conserved pocket positions are shared by NAD- and
          NADP-dependent relatives, while the residues that read the cofactor
          2'-phosphate in characterised AKRs are not conserved here.
        boundary: >-
          Established: a dinucleotide pocket is present and its core contacts are
          conserved. Unknown: the specificity, which requires steady-state kinetics
          with both cofactors.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
        status: OPEN
        significance: >-
          Cofactor choice determines which redox pool the activity draws on and is
          what separates GO:0008106 from its NAD counterpart, so it is the single
          measurement that would let the molecular-function annotation be refined.
suggested_questions:
  - question: >-
      Does GOX1598 have a physiological substrate at all in G. oxydans, or is it,
      like several PTHR43364:SF4 members, a broad-specificity carbonyl scavenger
      whose in vivo role is detoxification of reactive aldehydes generated by the
      organism's own incomplete oxidation of sugars and alcohols?
  - question: >-
      The AKR superfamily catalytic domain IPR023210 has no interpro2go mapping, so
      proteins whose only domain is a full-length match to it receive no GO
      annotation whatsoever. Should GO:0016491 be mapped to IPR023210, and if not,
      what is the reason for leaving the superfamily's catalytic domain unmapped?
  - question: >-
      G. oxydans 621H encodes several aldo-keto reductase superfamily proteins.
      Which of them are paralogues with overlapping substrate ranges, and does that
      redundancy explain why no phenotype has ever been reported for this locus?
suggested_experiments:
  - description: >-
      Express and purify the 362-residue protein and screen it against a carbonyl
      substrate panel chosen from what the organism actually makes and encounters -
      glyoxal, methylglyoxal, glyceraldehyde, 5-keto-D-gluconate, 2-keto-D-gluconate,
      D-glucono-1,5-lactone, furfural, 4-hydroxynonenal - in parallel with NADPH and
      NADH, following absorbance at 340 nm. This is the experiment that would turn
      the reaction-class annotation into a substrate-level one and simultaneously
      settle the cofactor question; a negative panel is itself informative and
      should be reported.
  - description: >-
      Test catalytic competence directly rather than by inference: measure the
      activity of the wild-type protein against Y67F and K101M variants, which
      should abolish proton donation and raise the tyrosine pKa respectively if the
      tetrad identified here is the working active site.
  - description: >-
      Establish the subcellular location, which this review deliberately leaves
      unannotated: fractionate G. oxydans 621H into periplasm (osmotic shock),
      cytoplasm and membrane with marker controls, and locate the protein by
      immunoblot or by targeted proteomics. For an acetic acid bacterium whose
      characteristic oxidations happen in the periplasm, whether this AKR is
      cytoplasmic is the difference between an intracellular detoxification role and
      a role in the organism's hallmark incomplete-oxidation chemistry.
  - description: >-
      Make a clean deletion of GOX1598 in strain 621H and phenotype it for growth on
      and oxidation of the sugars and polyols G. oxydans is used for, and for
      sensitivity to exogenous reactive aldehydes. No mutant in this locus has ever
      been reported; note that the published bioleaching phenotype attributed to
      "GO_1598" is from strain NRRL B-58 and belongs to an orotate
      phosphoribosyltransferase, so it provides no prior expectation here.
