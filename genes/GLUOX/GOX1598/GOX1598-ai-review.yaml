id: Q5FQK7
gene_symbol: GOX1598
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  GOX1598 is an uncharacterised aldo-keto reductase (AKR) superfamily protein of
  Gluconobacter oxydans 621H. The 362-residue chain carries a single AKR catalytic
  domain spanning residues 29-353, recognised independently by Pfam PF00248
  (Aldo_ket_red), SUPFAM SSF51430, CDD cd19094 (AKR_Tas-like) and Gene3D
  3.20.20.100, and is placed by PANTHER in the mixed bacterial/eukaryotic
  subfamily PTHR43364:SF4 together with Escherichia coli Tas, E. coli YdjG,
  Bacillus subtilis IolS and the human AKR7 aflatoxin B1 aldehyde reductases.
  Enzymes of this superfamily adopt a (beta/alpha)8 barrel and reduce a carbonyl
  carbon by hydride transfer from NAD(P)H, using a catalytic Asp-Tyr-Lys-His
  tetrad in which the tyrosine donates the proton and the lysine lowers its pKa;
  all four positions are present and unmutated in GOX1598 (Asp62, Tyr67, Lys101,
  His147), as is the core of the dinucleotide pocket. The protein therefore has
  the equipment of a working NAD(P)(H)-dependent carbonyl reductase, and its
  closest reviewed relative is E. coli Tas at 50% sequence identity, a
  structurally characterised NADP(H)-dependent aldo-keto reductase. Beyond that
  reaction class nothing is established: no substrate has been identified, the
  residues that discriminate NADP from NAD in characterised AKRs are not
  conserved, no subcellular location is recorded, and no study has assayed this
  locus or its product. G. oxydans is an obligately aerobic acetic acid bacterium
  whose hallmark is incomplete periplasmic oxidation of sugars and alcohols by
  membrane-bound dehydrogenases, but GOX1598 is a soluble cytoplasmic-type AKR
  with no signal peptide, so no connection to that periplasmic oxidative
  machinery is implied by its sequence.
existing_annotations:
  - term:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    evidence_type: ISS
    original_reference_id: file:GLUOX/GOX1598/GOX1598-bioinformatics/RESULTS.md
    qualifier: enables
    supporting_entities:
      - Pfam:PF00248
      - InterPro:IPR023210
      - UniProtKB:P0A9T4
    review:
      summary: >-
        Proposed annotation: GOX1598 is an aldo-keto reductase with a complete,
        unmutated catalytic tetrad, which supports NAD(P)-dependent oxidoreductase
        activity on a CH-OH/carbonyl pair, but supports nothing more specific.
      action: NEW
      reason: >-
        This entry has no GO annotations at all - QuickGO returns zero rows for
        UniProtKB:Q5FQK7 - and the gap is mechanical rather than a curatorial
        judgement about the protein: none of IPR023210, IPR036812 or IPR050523 has
        an interpro2go mapping, PTHR43364 has no PANTHER-family GO mapping, and
        PAINT placed no ancestral annotation on the lineage this protein descends
        from (the one PTHR43364 node seeded by its closest relative, PTN000199734
        from E. coli Tas, carries only GO:0005829 cytosol and is scoped to
        Gammaproteobacteria, which excludes this alphaproteobacterium). So there is
        no propagation to defer to and no row to refine; the choice is between
        asserting nothing and asserting what the sequence establishes.
        What it establishes is specific. Four signature databases agree on AKR
        superfamily membership over residues 29-353, and the catalytic machinery of
        that superfamily is intact: aligning five reviewed AKRs that carry curated
        ACT_SITE/SITE/BINDING features onto this sequence places the proton-donor
        tyrosine at Tyr67, the pKa-lowering lysine at Lys101, the tetrad aspartate
        at Asp62 and the tetrad histidine at His147, each identical to the curated
        reference residue, with all five references agreeing on the same four
        positions; the conserved dinucleotide-pocket positions Thr34, Ser196,
        Asn197, Gln221 and Lys260 follow the same pattern. That rules out the
        fold-retaining pseudoenzyme reading and licenses the reaction class.
        It licenses no more than the class, which is why GO:0016616 rather than
        something narrower. GO:0008106 alcohol dehydrogenase (NADP+) activity - the
        term the 50%-identical E. coli Tas carries, and only by NAS:EcoCyc - names
        NADP+ specifically, and the alignment cannot support that: the conserved
        pocket positions are shared by the NADP(+)-using references and by the
        NAD(+)-using YdjG, while the AKR1B1 residues that read the cofactor
        2'-phosphate (Lys263, Ser264, Arg269, Glu272, Asn273) map to Pro316,
        Phe317, Ile322, Ala325 and Thr326 here. Nor can a substrate be named:
        PTHR43364:SF4 is substrate-heterogeneous (aflatoxin B1 aldehyde reductases,
        a methylglyoxal reductase, IolS, Tas and a dozen uncharacterised bacterial
        members), and the substrate-contact residues of AKR7A2 and AKR1B1 other
        than the tetrad histidine map to non-identical residues or to gaps. No
        cofactor-binding term is proposed for the same reason, and no
        cellular-component term is proposed because the absence of a signal
        peptide, lipobox or transmembrane segment is a single line of evidence.
        Asserted as ISS: the inference is sequence similarity plus conserved
        catalytic residues, set out in the cited analysis, not an experiment.
      supported_by:
        - reference_id: file:GLUOX/GOX1598/GOX1598-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: 'DR   Pfam; PF00248; Aldo_ket_red; 1.'
        - reference_id: file:GLUOX/GOX1598/GOX1598-uniprot.txt
          record_section: ["DR:SUPFAM"]
          supporting_text: 'DR   SUPFAM; SSF51430; NAD(P)-linked oxidoreductase; 1.'
        - reference_id: file:GLUOX/GOX1598/GOX1598-uniprot.txt
          record_section: ["DR:CDD"]
          supporting_text: 'DR   CDD; cd19094; AKR_Tas-like; 1.'
        - reference_id: file:GLUOX/GOX1598/GOX1598-uniprot.txt
          record_section: ["FT:DOMAIN"]
          supporting_text: 'DOMAIN          29..353'
        - reference_id: file:GLUOX/GOX1598/GOX1598-bioinformatics/RESULTS.md
          supporting_text: >-
            Every curated catalytic position of every reference maps onto an
            **identical**
            residue in Q5FQK7, and all five references agree on the same four
            Q5FQK7
            positions
        - reference_id: file:GLUOX/GOX1598/GOX1598-bioinformatics/RESULTS.md
          supporting_text: >-
            The pocket is intact but its specificity cannot be read off this
            alignment.
        - reference_id: PMID:14517983
          supporting_text: >-
            Crystal structure of the Escherichia coli Tas protein, an
            NADP(H)-dependent aldo-keto reductase.
      source_defects:
        - defect_type: OTHER
          resource: OTHER
          record: InterPro:IPR023210
          slot: interpro2go
          requested_change: ADD
          asserted_value: InterPro:IPR023210
          corrected_value: GO:0016491
          corrected_label: oxidoreductase activity
          confidence: CONFIRMED
          explanation: >-
            InterPro IPR023210 (NADP_OxRdtase_dom) has no entry in the GO
            external2go interpro2go mapping file, checked live against
            https://ftp.ebi.ac.uk/pub/databases/GO/goa/external2go/interpro2go
            (30128 lines; IPR023210, IPR036812 and IPR050523 are all absent).
            IPR023210 is the catalytic domain of the aldo-keto reductase
            superfamily, integrated with Pfam PF00248 (Aldo_ket_red) and SUPFAM
            SSF51430 (NAD(P)-linked oxidoreductase); every characterised member
            is an NAD(P)(H)-dependent oxidoreductase. A mapping to GO:0016491
            oxidoreductase activity would therefore be safe, and its absence is
            why UniProtKB:Q5FQK7 - a 362-residue protein whose only domain is a
            full-length match to this entry - carries no GO annotation of any
            kind. Nothing more specific is requested: the domain occurs in members
            with different cofactors (NAD and NADP) and unrelated substrates, so a
            mapping to a sub-class such as GO:0016616 or GO:0008106 would
            over-reach. This is a missing mapping rather than a wrong one, so it
            is filed as a query to the InterPro/GO external2go maintainers rather
            than as a correction to any single record.
