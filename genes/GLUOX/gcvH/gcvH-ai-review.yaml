core_functions:
- description: >-
    Lipoyl-dependent carrier subunit of the glycine cleavage system. GcvH holds one
    lipoyl cofactor amide-linked to Lys-59 on a swinging arm, accepts the aminomethyl
    group generated by the P protein's decarboxylation of glycine as an
    S-aminomethyl-dihydrolipoyl adduct, and delivers it to the T protein, which
    releases ammonia and transfers the one-carbon unit to tetrahydrofolate. The L
    protein then reoxidises the arm with NAD+. GcvH contributes no catalysis; what it
    contributes is the cofactor and the geometry that let the intermediate pass between
    two active sites without leaving the system, which is why its loss breaks glycine
    cleavage. The system is reversible and in this organism sits in the canonical
    gcvTHP operon (GOX1095-GOX1096-GOX1097), linking glycine metabolism to the
    one-carbon folate pool.
