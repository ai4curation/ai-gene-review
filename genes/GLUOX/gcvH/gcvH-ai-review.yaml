id: Q5FRY1
gene_symbol: gcvH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:290633
  label: Gluconobacter oxydans 621H
description: >-
  gcvH encodes the H protein of the glycine cleavage system of Gluconobacter oxydans
  621H, a small (119 residue) soluble protein built from a single lipoyl-binding
  (biotinyl/lipoyl) domain. It carries one lipoyl cofactor amide-linked to Lys-59, and
  that lipoyl arm is the working part of the protein: it is not an enzyme but a
  swinging carrier that moves a reaction intermediate between the active sites of the
  other subunits. In the glycine cleavage reaction the P protein (glycine
  dehydrogenase, GOX1097) decarboxylates glycine and transfers the resulting
  aminomethyl group onto the distal thiol of the GcvH lipoyl arm; GcvH presents the
  S-aminomethyl-dihydrolipoyl intermediate to the T protein (aminomethyltransferase,
  GOX1095), which releases ammonia and transfers the remaining methylene unit to
  tetrahydrofolate to give 5,10-methylenetetrahydrofolate; the L protein
  (dihydrolipoyl dehydrogenase, GOX2292) then reoxidises the lipoyl arm with NAD+ so
  the cycle can repeat. The net reaction converts glycine to CO2, ammonia, a
  one-carbon unit on folate and NADH, linking amino-acid catabolism to the cellular
  one-carbon pool, and it is readily reversible, so the same machinery can run toward
  glycine synthesis. In this genome gcvH lies in the canonical gcvTHP cluster at
  consecutive loci GOX1095-GOX1096-GOX1097, immediately beside the two subunits its
  lipoyl arm shuttles between. GcvH is itself a target of the lipoylation machinery:
  the octanoyltransferase LipB (GOX0046) attaches an octanoyl group to Lys-59 from
  octanoyl-ACP and the radical-SAM lipoyl synthase LipA (GOX2293) inserts the two
  sulfur atoms that complete the cofactor.
