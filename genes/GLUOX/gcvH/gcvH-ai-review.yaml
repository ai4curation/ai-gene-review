      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 lipoyl cofactor covalently
    - reference_id: file:GLUOX/gcvH/gcvH-bioinformatics/RESULTS.md
      supporting_text: All four subunits of the glycine cleavage system are encoded.
- term:
    id: GO:0140104
    label: molecular carrier activity
  evidence_type: IC
  original_reference_id: file:GLUOX/gcvH/gcvH-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      GOA gives this gene no molecular function at all, which leaves its actual
      activity unrepresented. GcvH binds a specific chemical group, the aminomethyl
      moiety, on its covalently attached lipoyl arm and delivers it to an acceptor,
      the T protein active site. That is exactly what GO:0140104 defines: directly
      binding a specific ion or molecule and delivering it either to an acceptor
      molecule or to a specific location. UniProt's own curated text for the family
      describes the protein in these terms, and the B. subtilis orthologue is named
      "Octanoyl/lipoyl carrier protein" in Swiss-Prot.
    action: NEW
    reason: >-
      Added as the molecular-function representation of the gene's core role, inferred
      by the curator (IC) from the curated HAMAP function and cofactor statements plus
      the lipoyl-binding domain and lipoylated Lys-59 features. It is the same call
      made in the existing review of this gene in Methylorubrum extorquens
      (genes/METEA/gcvH), so the family is treated consistently. No catalytic activity
      is proposed, and no activity of the P, T or L proteins is attributed to GcvH even
      by contributes_to: carrying a substrate between active sites on a tethered
      cofactor is a molecular function of its own, which is what distinguishes this
      case from a purely structural complex subunit such as PSEPK ureA.
