- term:
    id: GO:0009249
    label: protein lipoylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000196926
  review:
    summary: >-
      GcvH is lipoylated, but being lipoylated is being the acceptor of lipoylation,
      not doing any of its work: in this organism the octanoyl transfer is done by
      LipB (GOX0046) and the sulfur insertion by the lipoyl synthase LipA (GOX2293).
      GcvH does participate in lipoylation in one clade, and that clade is defined by
      enzymes absent here. In Bacillus subtilis, LipM octanoylates GcvH and the
      amidotransferase LipL then moves the group onto the E2 subunits, making
      octanoyl-GcvH an obligate waypoint, which is why B. subtilis GcvH (O32174)
      carries this term by IMP. That relay is dispensable wherever a LipB is present:
      expressing E. coli lipB rescues a B. subtilis gcvH deletion. Gluconobacter
      oxydans 621H encodes LipB plus LipA and no detectable LipM or LipL, and the
      E. coli GcvH comparator (P0A6T9), which also uses the LipB route, carries no
      protein lipoylation annotation at all. The row looks like a family-wide
      propagation of a Bacillus-type donor role to a target that only has the acceptor
      role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Role conflation at the PANTHER node: the substrate of lipoylation is annotated as
      a participant in it. The term is not simply false for the family, which is why
      this is not REMOVE, and the LipM/LipL search behind the call was by gene and
      protein name within a TrEMBL proteome rather than a profile-HMM scan of the
      genome, so absence here means not annotated as present. On the evidence
      available the donor role does not transfer to this protein.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000196926
        source_label: PTN000196926
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: GcvH-family node; the lipoylation role it carries is the Bacillus-type
          LipM/LipL relay, which requires enzymes this target's genome does not encode.
      - source_id: UniProtKB:O32174
        source_label: gcvH (Bacillus subtilis)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Experimental donor role (GO:0009249 by IMP, PMID:21338421), but it
          depends on LipM and LipL, absent from Gluconobacter oxydans 621H.
      - source_id: UniProtKB:P0A6T9
        source_label: gcvH (Escherichia coli K-12)
        source_status: NOT_RELEVANT
        comment: Comparator standing in the same acceptor-only role via LipB; carries
          no protein lipoylation annotation, so the absence is the convention.
      residue_claims_not_applicable: >-
        The argument is about which lipoyl-attachment enzymes the organism encodes, not
