suggested_questions:
- question: >-
    Does Gluconobacter oxydans run the glycine cleavage system in the degradative
    direction under acidogenic bioleaching conditions, or in the synthetic direction
    toward glycine? The system is reversible and the direction determines whether GcvH
    is a net source or a net sink of one-carbon units in this physiology.
  experts: []
- question: >-
    Do Acetobacteraceae possess any GcvH-dependent lipoyl relay, or is lipoylation of
    all acceptor domains in this lineage handled directly by LipB? A negative answer
    would settle whether GO:0009249 should ever propagate to GcvH outside the
    LipM/LipL clade, rather than being judged organism by organism.
  experts: []
suggested_experiments:
- hypothesis: >-
    GcvH (GOX1096) is a lipoyl acceptor only, and is not required for lipoylation of
    the 2-oxoacid dehydrogenase E2 domains in Gluconobacter oxydans.
  description: >-
    Delete gcvH (GOX1096) in Gluconobacter oxydans 621H and assay the lipoylation state
    of the pyruvate and 2-oxoglutarate dehydrogenase E2 subunits by anti-lipoic acid
    immunoblot, alongside growth in minimal medium without lipoate. If the E2 subunits
    remain lipoylated and growth is unaffected, GcvH is not a relay intermediate here
    and the protein lipoylation annotation is an over-propagation; if E2 lipoylation is
    lost, the Bacillus-type donor role does operate in this lineage and the annotation
    should be restored.
  experiment_type: targeted deletion plus anti-lipoyl immunoblot
- hypothesis: >-
    Lys-59 is the lipoylation site of GcvH and the lipoyl arm is required for glycine
    cleavage flux.
  description: >-
    Express wild-type and K59R GcvH in a gcvH deletion background and compare
    lipoylation by mass shift (intact-protein LC-MS, expecting the 188 Da lipoyl
    adduct) and glycine cleavage activity by 14C release from [1-14C]glycine in cell
    extracts. This tests a site that is currently only predicted from HAMAP and PIRSR
    and has never been shown experimentally in this organism.
  experiment_type: site-directed mutagenesis with mass spectrometry and radiotracer
    assay
- hypothesis: >-
    GcvH is not a determinant of rare-earth-element bioleaching in Gluconobacter
    oxydans.
  description: >-
    Construct a clean gcvH deletion and a gcvH overexpression strain in the bioleaching
    background and measure neodymium extraction from synthetic monazite by ICP-MS
    against the wild type, using the published assay. The gene entered this curation
    queue through a locus-tag confusion with a strain B58 screen hit that the screen's
    authors assign to TypA/BipA, so the direct measurement is what would either
    substantiate or retire the bioleaching association.
  experiment_type: markerless deletion and overexpression with ICP-MS bioleaching assay
