- term:
    id: GO:0019464
    label: glycine decarboxylation via glycine cleavage system
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002930
  - InterPro:IPR017453
  - PANTHER:PTN000196926
  - UniRule:UR000083076
  review:
    summary: >-
      GcvH catalyses no step of glycine cleavage, so this row has to be argued rather
      than assumed. It survives the test. The aminomethyl group released by the P
      protein is never free in solution: it is transferred onto the distal thiol of
      GcvH's covalently bound lipoyl arm, carried as the S-aminomethyl-dihydrolipoyl
      adduct, and presented to the T protein, whose tetrahydrofolate-dependent step
      consumes it. GcvH therefore supplies the cofactor activity two of the pathway's
      steps depend on and holds the intermediate in register between two active sites,
      which is contributing to the work of the process rather than merely being
      required for it or being acted on by it.
    action: ACCEPT
    reason: >-
      Participation is by cofactor and scaffold contribution, the thyroglobulin and
      fibrin shape rather than the angiotensinogen shape. The comparator check agrees
      that GO treats the H protein as a participant: E. coli GcvH (P0A6T9) carries
      GO:0019464 by NAS and B. subtilis GcvH (O32174) carries it too, so this is the
      convention and not a propagation artefact. Genomic context in this organism
      supports the pathway being present: P, T, H and L subunits are all encoded, with
      T, H and P in one operon.
    supported_by:
    - reference_id: file:GLUOX/gcvH/gcvH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The glycine cleavage system catalyzes the degradation of glycine.
        The H protein shuttles the methylamine group of glycine from the P protein to
        the T protein
