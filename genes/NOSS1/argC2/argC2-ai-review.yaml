  label: Nostoc sp. PCC 7120 = FACHB-418
description: ArgC2 (historically ArgC; all2498) is the type-2 N-acetylglutamyl-phosphate reductase of
  Nostoc sp. PCC 7120, also studied under the name Anabaena sp. PCC 7120. It catalyzes NADPH-dependent
  reduction of N-acetylglutamyl phosphate to N-acetylglutamate semialdehyde during arginine biosynthesis.
  The cloned gene complements an arginine auxotroph of the cyanobacterium and an Escherichia coli argC
  mutant.
