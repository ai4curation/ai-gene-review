- term:
    id: GO:0030488
    label: tRNA methylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Incorrect TreeGrafter propagation for Cfr.
    action: REMOVE
    reason: |
      Retained. Cfr's characterized substrate is 23S rRNA: it methylates C8 of adenosine 2503 (PMID:19144912), and the record's rRNA methyltransferase, rRNA base methylation and rRNA binding rows are accepted. The tRNA specificity in this family belongs to the paralogous radical-SAM enzyme RlmN, which methylates C2 of A2503 in 23S rRNA and of A37 in tRNA; Cfr lacks the tRNA activity, so this row is a substrate-class error propagated from the shared RlmN/Cfr PANTHER family rather than a merely coarse term. No tRNA substrate is reported for Cfr in the UniProt record or the cited literature.
    supported_by:
    - reference_id: PMID:19144912
      supporting_text: "The Cfr-mediated modification has previously been shown to occur on nucleotide
        A2503 of 23S rRNA"
