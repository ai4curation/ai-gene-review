id: A2AXI2
gene_symbol: cfr
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1292
  label: Staphylococcus warneri
description: >-
  cfr encodes a radical SAM 23S rRNA methyltransferase that methylates carbon 8
  of adenine 2503 in bacterial 23S rRNA. This A2503 C8 modification confers
  cross-resistance to multiple antibiotic classes that bind near the peptidyl
  transferase center. Cfr is related to RlmN, but the clinically relevant Cfr
  activity is C8 methylation rather than the housekeeping C2 methyltransferase
  activity represented by existing GO specificity terms.
reference_proteome_assessments:
- reference_proteomes:
  - UP000814367
  status: NO_SUPPORTED_COUNTERPART
  reviewed_on: '2026-10-19'
  reason: Retain A2AXI2 as the primary Swiss-Prot accession. The only hit is the related RlmN
    methyltransferase A0A2T4Q1F7 (33.69% global identity), not an established Cfr counterpart.
    Shared radical-SAM/RNA-methyltransferase ancestry does not establish the Cfr resistance activity
    or gene identity. The source is strain 11562A; no supported reference-strain counterpart was
    identified.
  evidence:
  - type: PROTEOME_SEARCH
    description: MMseqs2 searched 2,456 sequences across UP000814367 at E <= 1e-5 and sensitivity
      7.5, returning 1 hits. Every returned sequence was globally aligned using BLOSUM62 with
      gap-open -10 and extension -0.5. Scores and sequences for all 1 returned candidates are
      retained, with 1 detailed alignment files. The heuristic search does not establish genomic
      absence or unique locus identity.
    supported_by:
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: 'target_sequence_count: 2456'
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: 'candidate_count: 1'
  - type: PROTEOME_MEMBERSHIP
    description: The primary accession is outside every searched exact-taxon reference proteome.
    supported_by:
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: 'primary_in_any_reference_proteome: false'
  - type: RECORD_HISTORY
    description: 'Sampled UniSave observations: 11-NOV-2015, entry version 43.: no Proteomes cross-reference;
      02-DEC-2020, entry version 58.: no Proteomes cross-reference; 27-NOV-2024, entry version 68.: no
      Proteomes cross-reference. These dated observations do not establish uninterrupted membership/absence,
      the exact change date, or UniProt''s motivation.'
    supported_by:
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: |-
        entry_date: 11-NOV-2015, entry version 43.
          proteomes: []
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: |-
        entry_date: 02-DEC-2020, entry version 58.
          proteomes: []
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: |-
        entry_date: 27-NOV-2024, entry version 68.
          proteomes: []
  - type: CURATION_CONTEXT
    description: The primary UniProt entry records plasmid origin. Reference-proteome membership at
      species or strain level does not ensure coverage of every accessory plasmid.
    supported_by:
    - reference_id: file:STAWA/cfr/cfr-record-evidence.yaml
      supporting_text: 'geneEncodingType: Plasmid'
