    summary: ADAR2 binds RNA through its double-stranded RNA binding domains.
    action: ACCEPT
    reason: RNA binding is required for engagement of the duplex RNA substrate by the ADAR2 
      dsRNA-binding domains; it describes direct molecular work in editing. The broad RNA-binding 
