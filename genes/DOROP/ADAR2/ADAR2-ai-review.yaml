- id: PMID:19390115
  title: An extra double-stranded RNA binding domain confers high activity to a squid RNA editing 
    enzyme.
  findings:
  - statement: sqADAR2a contains an extra dsRBD that confers high editing activity compared to 
      sqADAR2b
    supporting_text: sqADAR2a differs from sqADAR2b by containing an optional exon that encodes an 
      "extra" dsRBD...For each mRNA, sqADAR2a edited many more sites than sqADAR2b. These data 
      suggest that the "extra" dsRBD confers high activity on sqADAR2a.
  - statement: Both splice variants are expressed at comparable levels and are extensively 
      self-edited
    supporting_text: Both splice variants are expressed at comparable levels and are extensively 
      edited, each in a unique pattern.
- id: PMID:22457361
  title: Extra double-stranded RNA binding domain (dsRBD) in a squid RNA editing enzyme confers 
    resistance to high salt environment.
  findings:
  - statement: The extra dsRBD of sqADAR2a increases RNA binding affinity by 30-100 fold and confers
      resistance to high chloride
    supporting_text: the extra dsRBD in sqADAR2a conferred resistance to the high Cl(-) levels found
      in squid neurons. It does so by increasing the affinity of sqADAR2 for dsRNA by 30- or 
      100-fold in vertebrate-like or squid-like conditions, respectively.
  - statement: Squid-like salt conditions severely impair conventional ADAR2 binding and activity
    supporting_text: squid-like salt conditions severely impair the binding affinity of conventional
      ADAR2s for dsRNA, leading to a decrease in nonspecific and site-specific editing activity.
- id: PMID:25569156
  title: The majority of transcripts in the squid nervous system are extensively recoded by A-to-I 
    RNA editing.
  findings:
  - statement: 57,108 recoding sites identified in the squid nervous system, affecting the majority 
      of proteins
    supporting_text: We identify 57,108 recoding sites in the nervous system, affecting the majority
      of the proteins studied. Recoding is tissue-dependent, and enriched in genes with neuronal and
      cytoskeletal functions, suggesting it plays an important role in brain physiology.
- id: PMID:32201888
  title: Spatially regulated editing of genetic information within a neuron.
  findings:
  - statement: ADAR2 is expressed outside the nucleus in squid neurons and axoplasm exhibits A-to-I 
      editing activity
    supporting_text: ADAR2 (adenosine deaminase that acts on RNA), an RNA editing enzyme, is 
      expressed outside of the nucleus in squid neurons. Furthermore, purified axoplasm exhibits 
      adenosine-to-inosine activity and can specifically edit adenosines in a known substrate.
  - statement: Over 70% of editing sites are edited more extensively in the giant axon than in cell 
      bodies
    supporting_text: a transcriptome-wide analysis of RNA editing reveals that tens of thousands of 
      editing sites (>70% of all sites) are edited more extensively in the squid giant axon than in 
      its cell bodies.
- id: PMID:37342458
  title: Squid express conserved ADAR orthologs that possess novel features.
  findings:
  - statement: Squid express two catalytically active ADARs (sqADAR1 and sqADAR2) and one inactive 
      ADAR-like protein (sqADAR/D-like)
    supporting_text: Studies using recombinant sqADARs suggest that only sqADAR1 and sqADAR2 are 
      active adenosine deaminases...sqADAR/D-like shows no activity on these substrates.
  - statement: sqADAR2 is the predominant ADAR in non-neural tissues
    supporting_text: sqADAR2 is the predominant ADAR in the gill...sqADAR1 is the most highly 
      expressed isoform in the nervous system
  - statement: Both sqADAR2 splice-variant messages are extensively edited.
    supporting_text: "Previous results from our laboratory \nhave shown that squid express an ADAR2 homolog,
      with two splice variants named \nsqADAR2a and sqADAR2b and that these messages are extensively edited."
- id: PMID:37981860
  title: High-level RNA editing diversifies the coleoid cephalopod brain proteome.
  findings:
  - statement: Coleoid cephalopods are the only known animals to recode the majority of expressed 
      proteins through A-to-I RNA editing
    supporting_text: The coleoid nervous system is also the only one currently known to recode the 
      majority of expressed proteins through A-to-I RNA editing.
  - statement: The extra dsRBD of sqADAR2 and the novel SRD of sqADAR1 are unique cephalopod 
      features that may contribute to high-level editing
    supporting_text: We describe the complement of ADAR enzymes in cephalopods, including a recently
      discovered novel domain in sqADAR1.
- id: PMID:37295402
  title: Temperature-dependent RNA editing in octopus extensively recodes the neural proteome.
  findings:
  - statement: Over 13,000 codons are affected by temperature-dependent RNA editing in octopus, 
      showing RNA editing functions in environmental acclimation
    supporting_text: Over 13,000 codons are affected, and many alter proteins that are vital for 
      neural processes. For two highly temperature-sensitive examples, recoding tunes protein 
      function.
  - statement: Temperature-dependent editing occurs in wild populations and recodes synaptotagmin 
      and kinesin-1
    supporting_text: "For synaptotagmin, a key component of Ca2+-dependent neurotransmitter \nrelease,
      crystal structures and supporting experiments show that editing alters \nCa2+ binding. For kinesin-1,
      a motor protein driving axonal transport, editing \nregulates transport velocity down microtubules."
