- term:
    id: GO:0006396
    label: RNA processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Adenosine-to-inosine RNA editing is RNA processing.
    action: ACCEPT
    reason: RNA processing here is the covalent conversion of substrate adenosine to inosine, not an
      indirect effect on an RNA pathway. The broad process describes the same direct catalytic work 
      as the accepted A-to-I editing annotation. Its generality is not evidence of a non-core role.
    supported_by:
    - reference_id: PMID:25569156
      supporting_text: We identify 57,108 recoding sites in the nervous system, affecting the 
        majority of the proteins studied.

- term:
    id: GO:0008251
    label: tRNA-specific adenosine deaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: TreeGrafter-predicted tRNA-specific adenosine deaminase activity. This is very likely 
      an incorrect annotation for sqADAR2. ADAR enzymes (Adenosine Deaminases Acting on RNA) act on 
      double-stranded RNA structures in mRNAs and other transcripts. tRNA-specific adenosine 
      deaminase activity (GO:0008251) is the function of the ADAT family of enzymes (Adenosine 
      Deaminases Acting on tRNAs), which are structurally and functionally distinct from ADARs. All 
      experimental evidence for sqADAR2 demonstrates activity on dsRNA and mRNA substrates, not 
      tRNAs [PMID:19390115, PMID:37342458]. This appears to be a TreeGrafter misannotation arising 
      from the shared adenosine deaminase domain between ADARs and ADATs.
    action: REMOVE
    reason: tRNA-specific adenosine deaminase activity is the function of ADAT enzymes, not ADAR 
      enzymes. sqADAR2 has been tested and shown to be active on dsRNA and mRNA substrates. There is
      no evidence that sqADAR2 edits tRNAs, and the domain architecture (dsRBDs + ADAR-type 
      deaminase domain) is inconsistent with tRNA editing activity. This is a phylogenetic transfer 
      error likely due to the shared deaminase domain superfamily between ADARs and ADATs. The 
      existing OpenScientist report supports the three-dsRBD architecture, while Falcon incorrectly 
      labels C1JAR3 as the two-dsRBD sqADAR2b variant. The cached 786-aa sequence has three 
      dsRNA-binding domains and is consistent with sqADAR2a. Functional divergence is supported, but
      no exact historical graft error is established from domain architecture alone.
    supported_by:
    - reference_id: PMID:37342458
      supporting_text: Studies using recombinant sqADARs suggest that only sqADAR1 and sqADAR2 are 
        active adenosine deaminases...both on perfect duplex dsRNA and on a squid potassium channel 
        mRNA substrate known to be edited.
    - reference_id: PMID:19390115
      supporting_text: We next tested the ability of sqADAR2a and sqADAR2b to edit two K+ channel 
        mRNAs in vitro.
    - reference_id: 
        file:DOROP/ADAR2/ADAR2-hypotheses/function-hypothesis-go-0008251/openscientist.md
      supporting_text: 'Verdict: Refuted — within-superfamily mis-placement (Failure Mode 3)'
    - reference_id: 
        file:DOROP/ADAR2/ADAR2-hypotheses/function-hypothesis-go-0008251/openscientist.md
      supporting_text: squid ADAR2 contains three double-stranded RNA binding domains (dsRBDs) 
        upstream of its deaminase domain
    - reference_id: file:DOROP/ADAR2/ADAR2-hypotheses/function-hypothesis-go-0008251/falcon.md
      supporting_text: recombinant sqADAR2b is catalytically active on duplex RNA substrates

