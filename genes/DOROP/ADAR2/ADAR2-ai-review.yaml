- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: NAS
  original_reference_id: file:DOROP/ADAR2/ADAR2-uniprot.txt
  review:
    summary: >-
      The deaminase domain of ADAR enzymes coordinates a zinc ion at the catalytic
      center, which is essential for the hydrolytic deamination of adenosine. The
      UniProt entry for C1JAR3 lists zinc and metal-binding as keywords. This is
      a conserved feature of all active ADAR deaminase domains.
    action: NEW
    reason: >-
      Zinc ion binding is an inherent property of the ADAR catalytic deaminase domain. The UniProt entry
      lists zinc binding as a keyword. While metal ion binding (GO:0046872) is annotated in the UniProt
      GO cross-references, the more specific zinc ion binding term better captures the biochemistry of
      the ADAR active site. The supporting source is an electronic UniProt keyword inference, not a direct
      zinc-binding measurement in PMID:37342458.
    supported_by:
    - reference_id: file:DOROP/ADAR2/ADAR2-uniprot.txt
      supporting_text: Zinc {ECO:0000256|ARBA:ARBA00022833}.
