- id: PMID:28123910
  title: A comparative in-silico analysis of autophagy proteins in ciliates.
  findings:
  - statement: Ciliate genomes, including Paramecium tetraurelia, lack typical Atg1
      proteins with the C-terminal domain needed for Atg1-complex assembly.
    supporting_text: ciliate genomes do not encode typical Atg1 since all the
      candidate sequences lack an Atg1-specific C-terminal domain which is essential
      for Atg1 complex formation
    reference_section_type: ABSTRACT
  - statement: Ciliates also lack Atg1-complex partners, supporting lineage-level
      loss of the canonical Atg1 initiation machinery.
    supporting_text: Consistent with the absence of Atg1, ciliates also lack other
      members of the Atg1 complex.
    reference_section_type: ABSTRACT
  - statement: Ciliate Atg1-like kinase-domain proteins should not be treated as Atg1 without
      experiments, and whether any of them acts in ciliate autophagy is an open question.
    supporting_text: However, it is still an open question whether any of these kinase domain
      containing proteins have role(s) in autophagic processes in ciliates.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. It explicitly surveys Paramecium tetraurelia. PSI-BLAST
      with yeast Atg1 hits only the kinase domain in ciliates, and the Atg1 C-terminal region has no
      ciliate hits.
- id: PMID:24280724
  title: Role of class III phosphatidylinositol 3-kinase during programmed nuclear death
    of Tetrahymena thermophila.
  findings:
  - statement: Tetrahymena programmed nuclear death is a ciliate autophagy-like process,
      supporting residual uncertainty about noncanonical ciliate autophagy regulation.
    supporting_text: Programmed nuclear death (PND) in the ciliate protozoan Tetrahymena
      thermophila is a novel type of autophagy that occurs during conjugation
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Tetrahymena paper. It shows that ciliates have autophagy-like processes that depend
      on VPS34, but it does not implicate A0BFB4 or any Atg1-like kinase.
- id: file:PARTE/A0BFB4/A0BFB4-placement-evidence.md
  title: A0BFB4 verified PAINT descent and sequence-family discrepancy
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Records that the PANTHER PTHR24348 reference tree has A0BFB4 as leaf PTN002805316
      below the Atg1/ULK node PTN000681272, and that the current HMM gives PTHR44167:SF18. The tree
      lineage is accepted as a description of the PANTHER graft. Its 2026-09-20 conclusion that the
      autophagy terms are inherited is superseded by its own 2026-10-10 addendum and by this
      re-review's kinase-domain analysis. No longer cited as positive support for any annotation.
  findings:
  - statement: The actual tree places A0BFB4 below the autophagy-bearing ancestor; this is not
      merely a donor-list inference.
    supporting_text: The actual tree therefore confirms that A0BFB4 descends from the
      autophagy-bearing ancestral node.
- id: file:PARTE/A0BFB4/A0BFB4-hypotheses/autophagy-ancestry-versus-hmm-family-placement/openscientist.md
  title: OpenScientist focused report on A0BFB4 autophagy ancestry versus family placement
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found that PTHR44167 is a generic best-HMM hit rather than a
      competing family placement, leaving A0BFB4 in the Atg1/ULK clade.
    supporting_text: A0BFB4 genuinely belongs to the ATG1/ULK clade by ancestry, and this ancestry
      is **not** a misplacement.
    reference_section_type: RESULTS
    finding_review:
      finding_status: DISPUTED
      supported_by:
      - reference_id: file:PARTE/A0BFB4/A0BFB4-bioinformatics/RESULTS.md
        supporting_text: bootstrap support for A0BFB4 + ATG1/ULK is 1/200
  - statement: The focused report interpreted the autophagosome-assembly, regulation-of-autophagy,
      phagophore-assembly-site, and autophagosome IBAs as over-specific because the ciliate lineage
      and the A0BFB4 protein lack the canonical Atg1/ULK initiation-complex module.
    supporting_text: Because the machinery that nucleates a phagophore is absent in the ciliate
      lineage and in this protein specifically, GO:0000045, GO:0000407, GO:0005776, and GO:0010506
      rest solely on phylogenetic IBA inference and cannot be executed by the canonical mechanism.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Its conclusion on the autophagy BP/CC terms agrees with this re-review and with
      PMID:28123910. Its claim that PTHR44167 is a function-less catch-all is wrong. The PTHR44167
      family review describes it as the CHK2/Rad53 and CDC7/DDK kinase family. Its ULK-ancestry
      claim rests on a ~35% best-hit identity that this re-review could not reproduce as a
      discriminating signal (24.8-32.0% to all panel kinases). No longer cited as support for any
      annotation row. It is kept for provenance.
