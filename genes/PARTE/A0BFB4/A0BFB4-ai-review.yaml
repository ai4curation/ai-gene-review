id: A0BFB4
gene_symbol: A0BFB4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
description: A0BFB4 (ORF GSPATT00028266001) is an uncharacterized 381-residue protein kinase from
  the ciliate Paramecium tetraurelia. Residues 96-348 form a protein kinase domain, and the
  catalytic motifs are intact (glycine-rich loop, beta3 lysine K125, HRD catalytic loop, DFG, APE).
  It is therefore predicted to be an active, ATP-dependent protein serine/threonine kinase. Outside
  the kinase domain there is only a ~95-residue N-terminal segment with no annotated domain and a
  short C-terminal tail. It has none of the C-terminal regions that canonical Atg1/ULK kinases use to
  assemble the autophagy-initiation complex. Its classification within the kinome is uncertain.
  PANTHER's reference tree grafts it into the Atg1/UNC-51 family (PTHR24348), but the current
  PANTHER HMM assigns it to PTHR44167 (CHK2/CDC7-related kinases), and a kinase-domain distance tree
  does not group it robustly with Atg1/ULK proteins. Its substrates, subcellular location and
  biological roles have not been studied.
