    summary: Membrane association is propagated from the Atg1/ULK ancestral node PTN000681272, where it
      reflects Atg1/ULK recruitment to autophagic membranes. A0BFB4 lacks the module that mediates
      that recruitment and has no transmembrane or lipid-anchor features.
    action: MARK_AS_OVER_ANNOTATED
    reason: The membrane IBD sits on the same Atg1/ULK node (PTN000681272) as the phagophore assembly
      site and autophagosome IBDs, and its seeds are Atg1/ULK proteins (ULK1, ULK2, yeast ATG1, S. pombe
