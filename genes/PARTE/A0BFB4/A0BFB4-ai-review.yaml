id: A0BFB4
gene_symbol: A0BFB4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
description: A0BFB4 (GSPATT00028266001) is a 381-residue Paramecium tetraurelia ATG1/ULK-family
  serine/threonine protein kinase with conserved ATP-binding and catalytic-site signatures. Its
  kinase-domain ancestry is consistent with the autophagy-initiating kinase family, but it lacks
  the C-terminal Atg1-complex recruitment module found in canonical Atg1 proteins. Its exact
  protein substrates, localization and pathway role in Paramecium remain uncharacterized.
