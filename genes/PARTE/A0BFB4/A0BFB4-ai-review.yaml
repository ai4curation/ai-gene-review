- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: A0BFB4's ATG1/ULK-family ancestry is real, but ciliate loss of the
      canonical Atg1-complex module makes this autophagy term over-specific.
    action: MARK_AS_OVER_ANNOTATED
    reason: The actual PTHR24348 tree identifies target leaf PTN002805316
      (A0BFB4/GSPATT00028266001) as a descendant of PTN000681272, where the
      autophagy functions were placed from Atg1/ULK experimental descendants. The
      focused OpenScientist report accepts that ancestry and the intact kinase MF,
      but finds that A0BFB4 is a kinase-domain-only member that lacks the C-terminal
      Atg1 recruitment module, and cites a ciliate comparative-genomics study showing
      that ciliates lack typical Atg1 and other Atg1-complex partners. Propagating
      this canonical autophagosome/phagophore term from the ancestor is therefore
      unsafe pending target-specific evidence for a divergent Paramecium complex.
    supported_by:
    - reference_id: file:PARTE/A0BFB4/A0BFB4-placement-evidence.md
      supporting_text: The actual tree therefore confirms that A0BFB4 descends from the
        autophagy-bearing ancestral node.
    - reference_id: file:PARTE/A0BFB4/A0BFB4-hypotheses/autophagy-ancestry-versus-hmm-family-placement/openscientist.md
      supporting_text: A0BFB4 is a bare 381-aa kinase catalytic domain.
    - reference_id: file:PARTE/A0BFB4/A0BFB4-hypotheses/autophagy-ancestry-versus-hmm-family-placement/openscientist.md
      supporting_text: the four IBA-propagated autophagy BP/CC terms should be treated
        as over-annotations pending experimental support
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000681272
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'The actual nested PAINT tree was inspected: A0BFB4 leaf PTN002805316 descends from this
          function-bearing ancestor, but a focused follow-up found ciliate-lineage loss of the canonical
          Atg1 recruitment module.'
