- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Over-propagated. Autophagosome assembly by Atg1/ULK needs the Atg1 complex, which
      cannot form here. A0BFB4 lacks the Atg1 C-terminal domain, ciliates lack Atg13, Atg17, FIP200
      and Atg101, and A0BFB4 does not group robustly with Atg1/ULK by sequence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD at PTN000681272 is sound for Atg1/ULK proteins. Two lines of target-specific
      evidence argue against inheritance here. (1) Aslan et al. surveyed ciliate genomes, including
      Paramecium tetraurelia, and found that every Atg1-like kinase-domain protein lacks the
      Atg1-specific C-terminal domain needed to form the complex. The other Atg1-complex members are
      also absent. The authors conclude that these proteins should not be considered Atg1 candidates
      without experimental work (PMID:28123910). A0BFB4 has a C-terminal tail of only 33 residues
      after the kinase domain. (2) Membership of the Atg1 clade is itself doubtful. The current
      PANTHER HMM places A0BFB4 in PTHR44167, not PTHR24348. In the kinase-domain neighbour-joining
      analysis, A0BFB4 grouped exclusively with the ATG1/ULK kinases in only 1 of 200 bootstrap
      replicates. Kinase activity is retained, but participation in autophagosome assembly is not
      established. It is not removed outright because ciliates do have autophagy (PMID:24280724),
      and whether any ciliate Atg1-like kinase contributes to it remains open.
    supported_by:
    - reference_id: PMID:28123910
      supporting_text: ciliate genomes do not encode typical Atg1 since all the
        candidate sequences lack an Atg1-specific C-terminal domain which is essential
        for Atg1 complex formation
      reference_section_type: ABSTRACT
    - reference_id: PMID:28123910
      supporting_text: We conclude that these kinase domain containing proteins should not be
        considered as Atg1 candidates without further experimental analyses, since they all lack the
        important C-terminal domains.
      reference_section_type: RESULTS
    - reference_id: file:PARTE/A0BFB4/A0BFB4-bioinformatics/RESULTS.md
      supporting_text: bootstrap support for A0BFB4 + ATG1/ULK is 1/200
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000681272
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Atg1/ULK node, correct for the seeds. The A0BFB4 leaf PTN002805316 grafted below it
          lacks the C-terminal complex-assembly domain, and its placement conflicts with the current
          HMM family PTHR44167.
