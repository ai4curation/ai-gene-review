- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The autophagosome-assembly IBA over-propagates a canonical Atg1/ULK complex role to a
      compact ciliate kinase-domain protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The inspected PTHR24348 tree still places target leaf PTN002805316 below the
      Atg1/ULK-bearing ancestor PTN000681272, so the issue is not target misplacement. The focused
      report reconciled the generic PTHR44167 hit as a scoring artifact but found target-relevant
      evidence of lineage-specific functional narrowing because A0BFB4 lacks the C-terminal Atg1
      partner-binding module and ciliates lack the Atg13/Atg17/Atg101 initiation machinery that
      performs canonical phagophore nucleation. Kinase activity should be retained; this
      Atg1-complex BP should not be treated as established for A0BFB4.
    supported_by:
    - reference_id: file:PARTE/A0BFB4/A0BFB4-placement-evidence.md
      supporting_text: The actual tree therefore confirms that A0BFB4 descends from the
        autophagy-bearing ancestral node.
