taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
description: A0BFB4 (GSPATT00028266001) is a 381-residue Paramecium tetraurelia serine/threonine
  protein kinase with conserved ATP-binding and catalytic-site signatures. Its placement below the
  autophagy-bearing Atg1/ULK ancestor supports an inherited role in autophagosome assembly and regulation,
  with cytoplasmic and autophagic membrane-associated pools. The exact protein substrates and regulation
  in Paramecium remain uncharacterized.
