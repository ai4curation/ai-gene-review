taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
description: A0BFB4 (GSPATT00028266001) is a 381-residue Paramecium tetraurelia serine/threonine
  protein kinase with conserved ATP-binding and catalytic-site signatures. It belongs to an
  Atg1/ULK-related kinase clade but has a compact kinase-domain architecture that lacks the
  C-terminal interaction module used by canonical Atg1 proteins to assemble the autophagy-initiation
  complex. Its exact protein substrates, localization, and pathway roles in Paramecium remain
  uncharacterized.
