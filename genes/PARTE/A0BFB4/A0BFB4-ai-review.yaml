    action: MARK_AS_OVER_ANNOTATED
    reason: The previous review left this row UNDECIDED because the term is broad enough to allow a
      noncanonical ciliate role. This re-review gives it the same action as the sister autophagy
      rows, because it rests on the same IBD source (PTN000681272) and the same weak Atg1-clade
