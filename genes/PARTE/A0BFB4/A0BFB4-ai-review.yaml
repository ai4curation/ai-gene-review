  title: UniProtKB A0BFB4 sequence and domain record
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The exact target is GSPATT00028266001/CAK57231.1. Protein kinase domain96–348, 
      ATP-binding-site and Ser/Thr-active-site signatures support inferred catalysis. GO lines are 
      not counted as independent functional experiments.
- id: file:PARTE/A0BFB4/A0BFB4-deep-research-falcon.md
  title: Falcon research on A0BFB4/GSPATT00028266001
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read the complete report. Conserved kinase architecture supports broad catalysis; 
      the report did not find target assays. General Paramecium kinome expansion, CaM signaling, 
      ciliary control and vesicle pathways are contextual and do not assign this target to a 
      pathway. The PANTHER family name is not evidence that the PAINT autophagy placement is wrong.
  findings:
  - statement: Target substrates are unresolved despite a supported catalytic architecture.
    supporting_text: The specific substrates of A0BFB4 are unknown.
  - statement: The provider does not establish a target pathway or localization experimentally.
    supporting_text: No direct localization data exist for protein A0BFB4.
- id: file:PARTE/A0BFB4/A0BFB4-placement-evidence.md
  title: A0BFB4 verified PAINT descent and sequence-family discrepancy
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read actual nested PANTHER tree lineage retained by root, exact target/ancestor 
      rows and independently checked current UniProt family. Verified descent supports existing IBA;
      a later focused report adds a lineage-specific module-loss argument against propagating the
      autophagy BP/CC terms despite the verified tree path.
  findings:
  - statement: The actual tree places A0BFB4 below the autophagy-bearing ancestor; this is not 
      merely a donor-list inference.
    supporting_text: The actual tree therefore confirms that A0BFB4 descends from the 
      autophagy-bearing ancestral node.
- id: file:PARTE/A0BFB4/A0BFB4-hypotheses/autophagy-ancestry-versus-hmm-family-placement/openscientist.md
  title: OpenScientist focused report on A0BFB4 autophagy ancestry versus HMM family placement
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read the complete focused report. It reconciles PTHR24348/ATG1 ancestry
      with the generic PTHR44167 HMM hit, retains the catalytically intact kinase MF,
      and argues that ciliate loss of the Atg1 C-terminal recruitment module makes
      inherited autophagy BP/CC terms over-specific for A0BFB4.
  findings:
  - statement: The ATG1/ULK family placement is genuine, but canonical autophagy
      process and compartment terms are weakly supported in the ciliate target.
    supporting_text: the four IBA-propagated autophagy BP/CC terms should be treated
      as over-annotations pending experimental support
suggested_questions:
- question: Does Paramecium A0BFB4 phosphorylate a divergent ciliate autophagy factor, or has
    this kinase-domain-only ATG1/ULK-family protein been rewired to another substrate class?
- question: Which Paramecium factor, if any, replaces canonical Atg1-complex recruitment during
    ciliate phagophore initiation?
suggested_experiments:
- description: Tag the endogenous A0BFB4 protein and measure localization during
    starvation or conjugation, alongside ATG8-positive autophagic membranes, to test
    whether this kinase-domain-only protein is recruited to a ciliate phagophore-like
    compartment.
  experiment_type: endogenous tagging and starvation/conjugation live imaging
