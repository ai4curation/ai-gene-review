      partners. A0BFB4 lacks that domain, and ciliates lack the partners (PMID:28123910). The UniProt
      record has no transmembrane or signal features. The node placement itself is also weak at the
      sequence level (see the bioinformatics results). The earlier ACCEPT treated this term as generic,
      but it is one of the Atg1-node localization assertions and rests on the same inheritance
      argument as the phagophore-site term. It is therefore marked over-annotated rather than
