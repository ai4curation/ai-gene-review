- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Retain the autophagy assignment supported by the inspected PAINT lineage.
    action: ACCEPT
    reason: The actual PTHR24348 tree identifies target leaf PTN002805316 (A0BFB4/GSPATT00028266001)
      as a descendant of PTN000681272, where the autophagy functions were placed from Atg1/ULK experimental
      descendants. This verifies the relevant ancestral placement; the specific function is accepted
      as inherited, without claiming a target assay. Current UniProt/InterPro assigns PTHR44167:SF18,
      a resource-classification discrepancy that warrants reconciliation but does not by itself refute
      the inspected tree or demonstrate functional loss. Compact ciliate architecture, overlapping
      terms and the family label are not counterevidence.
    supported_by:
    - reference_id: file:PARTE/A0BFB4/A0BFB4-deep-research-falcon.md
      supporting_text: The specific substrates of A0BFB4 are unknown.
    - reference_id: file:PARTE/A0BFB4/A0BFB4-uniprot.txt
      supporting_text: PTHR44167:SF18; PROTEIN KINASE DOMAIN-CONTAINING PROTEIN
    - reference_id: file:PARTE/A0BFB4/A0BFB4-placement-evidence.md
      supporting_text: The actual tree therefore confirms that A0BFB4 descends from the autophagy-bearing
        ancestral node.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000681272
        source_status: SUPPORTS_TRANSFER
        comment: 'The actual nested PAINT tree was inspected: A0BFB4 leaf PTN002805316 descends from
          this function-bearing ancestor, with no target-specific loss established.'
