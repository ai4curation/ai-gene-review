id: A0BFB4
gene_symbol: A0BFB4
taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
status: COMPLETE
description: >-
  A0BFB4 is an uncharacterized Paramecium protein kinase whose kinase domain (residues 96-348)
  retains every canonical catalytic motif, so it is expected to be an active protein
  serine/threonine kinase. The single ProtNLM2 prediction, protein phosphorylation, is the process
  that this catalytic activity carries out and is not yet annotated to the gene. No experimental
  study of this protein or its ORF (GSPATT00028266001) was found in PubMed.
source_documents:
  - genes/PARTE/A0BFB4/A0BFB4-uniprot.txt
  - genes/PARTE/A0BFB4/A0BFB4-goa.tsv
  - genes/PARTE/A0BFB4/A0BFB4-ai-review.yaml
  - genes/PARTE/A0BFB4/A0BFB4-bioinformatics/RESULTS.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006468
      label: protein phosphorylation
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The protein kinase domain (96-348) carries the PROSITE protein-kinase ATP-binding and
        serine/threonine-kinase active-site signatures, and motif analysis finds the glycine-rich
        loop, beta3 lysine K125, HRD catalytic loop, DFG and APE motifs all intact, so the protein
        is predicted to be a catalytically competent kinase rather than a pseudokinase. The gene
        review accepts protein serine/threonine kinase activity (GO:0004674) as its core function
        on this basis. An active protein kinase performs the phosphotransfer step of protein
        phosphorylation itself, so the process term follows directly from the supported activity.
        GO:0006468 is not among the gene's GOA annotations, and OLS4 lists no is_a or part_of path
        from GO:0004674 to it, so the prediction adds a novel process annotation. Support is
        sequence-based inference; no substrate or phosphorylation event has been observed, and the
        term implies nothing about the autophagy roles that the gene review marks over-annotated.
      supported_by:
        - reference_id: file:PARTE/A0BFB4/A0BFB4-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR000719; Prot_kinase_dom. ... DR   InterPro; IPR017441; Protein_kinase_ATP_BS.
            ... DR   InterPro; IPR008271; Ser/Thr_kinase_AS. ... FT   DOMAIN          96..348
        - reference_id: file:PARTE/A0BFB4/A0BFB4-bioinformatics/RESULTS.md
          supporting_text: >-
            All canonical kinase catalytic motifs are present in A0BFB4 (381 aa): glycine-rich loop GEGTFG at 103,
