id: A0BFB4
gene_symbol: A0BFB4
taxon:
  id: NCBITaxon:5888
  label: Paramecium tetraurelia
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for an uncharacterised Paramecium tetraurelia
  protein kinase. The interesting call is at rank 2: calcium-dependent protein
  serine/threonine kinase activity, a strict descendant of this review's core molecular
  function. P. tetraurelia has the largest kinome relative to genome size of any known
  organism and its dominant group is the calcium/calmodulin-dependent family (970 of 2606
  kinases), so a CAMK-type assignment is the single most likely refinement for an
  arbitrary Paramecium kinase - which makes this call hard to separate from a base-rate
  guess. Rank 1 repeats the IRE1-TRAF2-ASK1 complex that this benchmark's other
  uncharacterised fungal kinase also drew, and ranks 3-4 continue enumerating kinase
  subtypes. The generic and correct term (protein serine/threonine kinase activity,
  already in GOA by IBA) is retrieved only at rank 7.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  1 uncertain (UNC), 1 incorrect (REP).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/PARTE/A0BFB4/A0BFB4-uniprot.txt
  - genes/PARTE/A0BFB4/A0BFB4-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1990604
      label: IRE1-TRAF2-ASK1 complex
    predicted_term_type: GO_CC
    review:
      assessment: REP
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 14.17). This same complex is the rank-1 call for S0EDH7, the
        benchmark's other uncharacterised protein-kinase-domain protein, in a different
        kingdom. Two unrelated kinases with no subfamily assignment drawing the identical
        named metazoan complex as their top hit is a repetition artefact rather than a
        prediction: the retrieval falls back on a heavily-annotated kinase-containing complex
        whenever the query embedding carries a kinase fold and nothing more. TRAF2 and ASK1
        have no ciliate counterparts, so the call is also taxonomically impossible.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0009931
      label: calcium-dependent protein serine/threonine kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 12.69) and a strict descendant of the IBA-annotated protein
        serine/threonine kinase activity. The refinement is biologically apt for the organism
        - CAMKs dominate the Paramecium kinome and calcium signalling is central to ciliate
        biology - but the protein's PANTHER placement (PTHR44167, LOK/STK-related, with a
        suggested ATG1/ULK1 affinity) does not point to the CAMK group, and no calcium-binding
        or calmodulin-binding module is annotated. Plausible and unverifiable: a lead for
        curation, not an annotation.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 3 (score 12.59). The receptor framing is wrong - the protein has no
        transmembrane segment or extracellular domain - but the term is again a descendant of
        the correct and already-annotated protein serine/threonine kinase activity, so
        climbing one level recovers a right answer. Scored LSP on that basis. Ranks 2, 3 and
        4 offer three mutually exclusive kinase subtypes at nearly identical scores, which is
        the clearest possible statement that the model has resolved the fold but not the
        subfamily; the honest output would have been the parent term, which the index does
        surface, but only at rank 7.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
