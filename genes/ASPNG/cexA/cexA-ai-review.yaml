  label: Aspergillus niger
description: 'CexA (citrate exporter A; also called CitT) is a 524-residue major facilitator
  superfamily (DHA1 subfamily) transporter with 12 predicted transmembrane helices that resides
  in the plasma membrane of Aspergillus niger and exports cytosolic citrate to the extracellular
  medium. It is the main route of citric acid secretion: gene disruption almost completely
  abolishes citrate export and diverts carbon to oxalate via the glyoxylate shunt and oxaloacetate
  acetylhydrolase, while overexpression raises citric acid titres and expression in Saccharomyces
  cerevisiae or Yarrowia lipolytica confers citrate secretion. In yeast, CexA also mediates
  low-affinity citrate uptake (Km about 44 mM at pH 5.5) that is independent of the proton
  motive force, consistent with facilitated diffusion rather than proton-coupled antiport,
  and it binds tricarboxylates (citrate, isocitrate) but not mono- or dicarboxylates. cexA
  transcription is repressed by manganese(II) and induced by manganese deficiency and by intracellular
  citrate or acetyl-CoA accumulation, linking it to the classic Mn-limited citric acid fermentation.'
