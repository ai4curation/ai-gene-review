    summary: Immunogold labelling with MCR-specific antibodies places MCR throughout
      the cytoplasm of M. marburgensis grown under standard conditions. Under nickel
      depletion and slow linear growth, 50-70% of the label moves close to the cytoplasmic
      membrane.
    action: ACCEPT
