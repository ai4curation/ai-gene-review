  review:
    summary: Bokranz et al. 1988 cloned the mcr gene cluster of strain Marburg, expressed
      the three subunits in Escherichia coli and mapped the transcript. The full text
      (read 2026-11-13 from a PDF supplied by the reviewer; not cached, because it is
      not openly licensed) contains no activity assay. Its methods are DNA and RNA preparation,
      Northern blots, raising antisera against gel-purified subunits, library screening,
      expression in E. coli detected by Western blot, S1 mapping and Maxam-Gilbert sequencing.
      The only experiment on the protein is immunodetection of the E. coli-expressed
      subunits. MCR activity appears only as introductory background citing other papers.
      The row was assigned by MENGO in 2013.
