- term:
    id: GO:0046906
    label: tetrapyrrole binding
  evidence_type: IDA
  original_reference_id: PMID:9367957
  qualifier: enables
  review:
    summary: The crystal structure resolves coenzyme F430, a nickel tetrapyrrole (hydrocorphinoid),
      in both active sites, with the alpha subunit Gln147 as the axial ligand to its
      nickel. UniProt records F430 as a non-covalently bound cofactor from purification
      and structure.
    action: NEW
    reason: GO has no coenzyme F430 binding term; GO:0046906 tetrapyrrole binding, the
      parent of heme, chlorophyll and cobalamin binding, is the closest existing term,
      and a specific child is proposed under proposed_new_terms. F430 sits at a subunit
      interface, but the alpha subunit provides the nickel ligand, so binding is a property
      of this subunit. This harmonizes the Methanothermobacter review with the Methanosarcina
      acetivorans review, which already carries the same row. Non-core relative to the
      catalytic activity it supports. Further direct evidence on this isoenzyme is that F430
      is the prosthetic group of purified MCR I of strain Marburg, whose activity depends
      on its Ni(I) state, and the atomic-resolution and Ni-methyl structures resolve
      the bound cofactor.
    supported_by:
    - reference_id: PMID:9367957
      supporting_text: two molecules of the nickel porphinoid coenzyme F430 are embedded
        between the subunits alpha, alpha', beta, and gamma
    - reference_id: PMID:9030728
      supporting_text: The nickel porphinoid, coenzyme F430, is the prosthetic group
        of methyl-coenzyme M reductase.
    - reference_id: PMID:9030728
