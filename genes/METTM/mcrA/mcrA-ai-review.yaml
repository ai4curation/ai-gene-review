core_functions:
- description: Catalytic, F430-bearing alpha subunit of methyl-coenzyme M reductase
    I, catalyzing the reduction of methyl-coenzyme M by coenzyme B to methane and CoM-S-S-CoB,
    the terminal step of hydrogenotrophic (CO2-reducing) methanogenesis. The two active
    sites of the alpha2beta2gamma2 holoenzyme form at the alpha, alpha', beta, gamma
    interface, with alpha providing the axial Gln147 ligand to the F430 nickel and
    most substrate contacts.
  molecular_function:
    id: GO:0050524
    label: coenzyme-B sulfoethylthiotransferase activity
  directly_involved_in:
  - id: GO:0019386
    label: methanogenesis, from carbon dioxide
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0044674
    label: methyl coenzyme M reductase complex
  supported_by:
  - reference_id: PMID:3350018
    supporting_text: The enzyme was found to catalyze the reduction of methylcoenzyme
      M (CH3-S-CoM) with N-7-mercaptoheptanoylthreonine phosphate (H-S-HTP = component
      B) to CH4.
  - reference_id: PMID:9367957
    supporting_text: two molecules of the nickel porphinoid coenzyme F430 are embedded
      between the subunits alpha, alpha', beta, and gamma and alpha', alpha, beta',
      and gamma', forming two identical active sites.
  - reference_id: PMID:2269306
    supporting_text: The reductase has been characterized in detail from Methanobacterium
      thermoautotrophicum strain Marburg and delta H, which grow on H2 and CO2 as energy
      source.
proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases, or to a modified form of it.
  justification: Every MCR and alkyl-coenzyme M reductase alpha subunit binds F430
    (or a modified F430) through an axial ligand to its nickel, a glutamine in methanogenic
    and methanotrophic MCRs and a methionine in the ethane-specific enzyme of Ca.
    Ethanoperedens. GO has heme, chlorophyll and cobalamin binding under tetrapyrrole
    binding but no F430 term, so keyword mappings fall back to metal ion binding.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: PMID:9367957
    supporting_text: two molecules of the nickel porphinoid coenzyme F430 are embedded
      between the subunits alpha, alpha', beta, and gamma
suggested_questions:
- question: Do MCR I (mcr) and MCR II (mrt) of M. marburgensis differ in kinetic properties,
    substrate affinity or post-translational modification in a way that explains why
    MCR II dominates H2-replete exponential growth and MCR I dominates gas limitation?
- question: The reaction in GO:0050524 is written as reversible, and purified MCR from
    this organism runs it backwards. Should GO distinguish methane-forming from methane-activating
    use of the reaction only at the process level (methanogenesis versus methane catabolic
    process), as this review set assumes?
suggested_experiments:
- experiment_type: Genetic deletion and enzyme characterization
  hypothesis: MCR I and MCR II are functionally specialized for H2-limited versus H2-replete
    growth.
  description: Using the genetic system available for Methanothermobacter, delete mcrA
    or the mrt operon and compare growth, methane formation and the kinetic properties
    of the remaining isoenzyme under H2-limited and H2-replete conditions.
