- id: PMID:2269306
  title: Two genetically distinct methyl-coenzyme M reductases in Methanobacterium
    thermoautotrophicum strain Marburg and delta H.
  findings:
  - statement: Two genetically distinct MCR isoenzymes, each of alpha, beta and gamma
      subunits, occur in strains Marburg and Delta H; MCR II dominates exponential growth
      with ample H2 and CO2 and MCR I dominates under gas limitation.
    supporting_text: When growth was limited by the gas supply, MCR I predominated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Eur J Biochem 1990). Abstract-only in cache; UniProt
      cites it for function, catalytic activity, KM values and subunit composition of
      P11558.
- id: PMID:23533332
  title: Localization of Methyl-Coenzyme M reductase as metabolic marker for diverse
    methanogenic Archaea.
  findings:
  - statement: Immunogold labelling places MCR in the cytoplasm of M. marburgensis;
      under nickel depletion much of it is found near the cytoplasmic membrane.
    supporting_text: MCR of Methanothermobacter marburgensis was located at the cytoplasmic
      membrane under nickel-depleted growth conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC3596918). Direct localization of the endogenous
      enzyme in this organism.
- id: PMID:2448287
  title: Cloning and characterization of the methyl coenzyme M reductase genes from
    Methanobacterium thermoautotrophicum.
  findings:
  - statement: The mcr gene cluster of strain Marburg was cloned and the subunits expressed
      in E. coli; the cluster contains two further open reading frames between the structural
      genes.
    supporting_text: Sequence analysis revealed two more open reading frames of unknown
      function located between two of the methyl coenzyme M reductase genes.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: PubMed-verified (J Bacteriol 1988); abstract-only in cache. The full
      text was read on 2026-11-13 from a reviewer-supplied PDF (PMC210692 scan; automated
      download is refused, and the text is not cached because it is not openly licensed).
      It is the correct paper for the mcr gene-cluster sequence (gene order beta, two
      ORFs, gamma, alpha; transcript start and terminator mapped). It is miscited as
      IDA evidence for GO:0050524, because it contains no activity measurement (see the
      source defect on that row). The authors note that the alpha subunit expressed
      in E. coli was unstable and suggest that the missing F430 cofactor prevented correct
      folding.
