- id: PMID:20520712
  title: The key nickel enzyme of methanogenesis catalyses the anaerobic oxidation
    of methane.
  findings:
  - statement: Purified M. marburgensis MCR converts methane into methyl-coenzyme M
      under equilibrium conditions, with kinetics consistent with in vivo anaerobic
      oxidation of methane.
    supporting_text: Here we report that purified MCR from Methanothermobacter marburgensis
