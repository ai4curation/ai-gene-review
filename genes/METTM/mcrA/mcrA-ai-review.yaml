    strict binding order.'
  findings:
  - statement: Purified M. marburgensis MCR follows a strictly ordered ternary-complex
      mechanism; only the MCR-methyl-SCoM binary complex is productive.
    supporting_text: only one binary complex (MCR·methyl-SCoM) is productive whereas
      the other (MCR·CoB7SH) is inhibitory.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2015); organism named in the abstract.
