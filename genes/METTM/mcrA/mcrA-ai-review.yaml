      it with any evidence code, let alone IDA. It is the gene-sequence paper, and the
      alpha subunit it expressed in E. coli lacked F430 and was unstable. The evidence
      is therefore the defect, not the claim, and it is recorded as a source defect
      asking for the row to be withdrawn.
    supported_by:
