gene_symbol: mcrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:79929
  label: Methanothermobacter marburgensis str. Marburg
description: mcrA (MTBMA_c15480) encodes the alpha subunit of methyl-coenzyme M reductase
  isoenzyme I (MCR I) of Methanothermobacter marburgensis (formerly Methanobacterium
  thermoautotrophicum strain Marburg), a thermophilic hydrogenotrophic methanogen that
  grows on H2 and CO2. MCR is a soluble cytoplasmic alpha2beta2gamma2 heterohexamer
  that catalyzes the final, methane-forming step of methanogenesis, the reduction of
  methyl-coenzyme M by coenzyme B to methane and the CoM-S-S-CoB heterodisulfide (EC
  2.8.4.1). It is the best-characterized MCR. Purified enzyme follows a strictly ordered
  ternary-complex mechanism in which methyl-coenzyme M binds before coenzyme B, is active
  only when its coenzyme F430 nickel is in the Ni(I) state, and is inactivated by 3-nitrooxypropanol,
  which oxidizes that Ni(I). The same purified enzyme also catalyzes the reverse reaction,
  converting methane to methyl-coenzyme M under equilibrium conditions. The crystal
  structure shows two identical active sites, each holding one non-covalently bound
  F430 between the alpha, alpha', beta and gamma subunits. The alpha subunit supplies
  the axial Gln147 ligand to the nickel and most of the coenzyme M and coenzyme B contacts,
  and carries active-site post-translational modifications (thioglycine, methylhistidine,
  5-methylarginine, 2-methylglutamine, S-methylcysteine and didehydroaspartate), whose
  methyl groups are introduced post-translationally from S-adenosylmethionine. Atomic-resolution
  structures resolve the F430 geometry, substrate- and product-bound states, and a
  Ni-methyl species proposed as a catalytic intermediate. A second,
  genetically distinct isoenzyme (MCR II, encoded by mrt genes) predominates during
  exponential growth with ample H2, whereas MCR I predominates under gas limitation.
