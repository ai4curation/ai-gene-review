  title: UniProtKB Q9SE35 (SIL1_CYLFU) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Swiss-Prot reviewed entry, PE:1. Used here for the curated processing /
      feature architecture (signal, propeptides, PEPTIDE chains, repeats) and for
      the curated PTM notes, all of which carry ECO:0000269 or ECO:0000305
