existing_annotations:
# Q9SE35 has NO existing GO annotations. `just fetch-gene CYLFU SIL1` produced a
# SIL1-goa.tsv containing only a header row, and a direct QuickGO query for
# geneProductId=Q9SE35 returns "numberOfHits":0. There are therefore no rows to
# adjudicate, and every row below is a proposed (NEW) annotation. See
# SIL1-notes.md for why this total absence is a curation gap rather than a
# deliberate curator decision.
- term:
    id: GO:0030312
    label: external encapsulating structure
  evidence_type: IDA
  original_reference_id: PMID:11106386
  review:
    summary: >-
      Silaffin-1 peptides are integral components of the diatom silica cell wall,
      so tightly incorporated into the biosilica that releasing them requires
      dissolving the wall in hydrogen fluoride.
    action: NEW
    reason: >-
      This is a direct, physical demonstration of location: the peptides are
      recovered from purified cell walls and cannot be extracted without destroying
      the mineral phase, which is stronger evidence of wall residence than a
      typical co-localization assay. GO:0030312 rather than its child GO:0005618
      cell wall is used deliberately: GO:0005618 carries a "Not to be used for
      manual annotation" instruction pointing curators to a lineage-specific child,
      and the children GO offers (bacterial, plant-type, fungal-type, archaeal
      S-layer) contain no option for a diatom frustule. The missing diatom child is
      filed under proposed_new_terms. No intracellular location is proposed: the
      silica deposition vesicle is where silica formation is believed to occur and
      UniProt's PTM note invokes it, but the evidence available for this protein
      demonstrates only the mature biosilica location, and GO has no SDV term in any
      case.
    supported_by:
    - reference_id: PMID:11106386
      supporting_text: >-
        The silaffins are tightly associated with the biosilica so that they can
        only be solubilized after dissolution of the cell wall in hydrogen fluoride
        (HF).
    - reference_id: PMID:11349130
      supporting_text: >-
        Two silica-precipitating peptides, silaffin-1A(1) and-1A(2), both encoded by
        the sil1 gene from the diatom Cylindrotheca fusiformis, were extracted from
        cell walls and purified to homogeneity.
- term:
    id: GO:0005199
    label: structural constituent of cell wall
  evidence_type: IDA
  original_reference_id: PMID:11106386
  review:
    summary: >-
      Beyond simply being located in the wall, silaffin-1 peptides are a structural
      part of it: they are occluded within the biosilica as its organic matrix and
      are co-extensive with the mineral phase.
    action: NEW
    reason: >-
      The HF requirement shows the peptides are not surface-adsorbed but entrapped
      within the silica they helped form, which is what a structural constituent of
      the wall means. This captures the structural half of silaffin-1's molecular
      role. The other half, the actual silica-precipitating activity, has no GO term
      at all and is therefore proposed rather than annotated here (see
      proposed_new_terms "silicic acid polycondensation activity"); it is left out
      of this row rather than approximated by a wrong id.
    supported_by:
    - reference_id: PMID:11106386
      supporting_text: >-
        The silaffins are tightly associated with the biosilica so that they can
        only be solubilized after dissolution of the cell wall in hydrogen fluoride
        (HF).
    - reference_id: file:CYLFU/SIL1/SIL1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: formation of silica cell wall of diatoms.
- term:
    id: GO:0042546
    label: cell wall biogenesis
  evidence_type: IDA
  original_reference_id: PMID:10550045
  review:
    summary: >-
      The mature silaffin-1 peptides themselves carry out the silica precipitation
      step that builds the diatom cell wall, converting monosilicic acid into
      networks of silica nanospheres within seconds.
    action: NEW
    reason: >-
      The participation test in CLAUDE.md is satisfied directly rather than by
      necessity evidence: purified silaffin-1 peptides, acting alone on a monosilicic
      acid solution, perform the condensation that produces the wall's mineral
      phase. SIL1 is the entity doing the work, not something the process merely
      requires or consumes. Note what is deliberately NOT claimed. GO:0031214
      biomineral tissue development is the obvious "biomineralization" term but is
      is_a GO:0009888 tissue development with ancestry through multicellular
      organism development; a unicellular diatom has no tissue, so that term is
      wrong here despite the apparent subject-matter match. Equally, no
      polyamine- or methylation-related process term is proposed: those
      modifications are installed ON SIL1 by other, still unidentified enzymes, so
      SIL1 is the substrate of that chemistry, which is precisely the
      non-participation case. The remaining caveat, recorded as a suggested
      experiment, is that all the functional evidence is in vitro precipitation by
      purified peptides; there is no loss-of-function evidence in the living diatom.
    supported_by:
    - reference_id: PMID:10550045
      supporting_text: >-
        A set of polycationic peptides (called silaffins) isolated from diatom cell
        walls were shown to generate networks of silica nanospheres within seconds
        when added to a solution of silicic acid.
    - reference_id: PMID:11349130
      supporting_text: >-
        In vitro, both peptides precipitate silica nanospheres within seconds when
        added to a monosilicic acid solution.
    - reference_id: file:CYLFU/SIL1/SIL1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: formation of silica cell wall of diatoms.
core_functions:
- description: >-
    Silaffin-1 is processed into short, hypermodified polycationic peptides that
    self-assemble and drive the condensation of monosilicic acid into silica
    nanospheres, and that remain embedded in the resulting biosilica as structural
    components of the diatom cell wall. The activity is a property of the modified
    peptide assembly rather than of a catalytic site: it requires the lysine-linked
    long-chain polyamines and, in the native state, near-complete serine
    phosphorylation.
  proposed_molecular_function: silicic acid polycondensation activity
  directly_involved_in:
  - id: GO:0042546
    label: cell wall biogenesis
  locations:
  - id: GO:0030312
    label: external encapsulating structure
  supported_by:
  - reference_id: PMID:11349130
    supporting_text: >-
      Two silica-precipitating peptides, silaffin-1A(1) and-1A(2), both encoded by
      the sil1 gene from the diatom Cylindrotheca fusiformis, were extracted from
      cell walls and purified to homogeneity.
  - reference_id: PMID:11349130
    supporting_text: >-
      In vitro, both peptides precipitate silica nanospheres within seconds when
      added to a monosilicic acid solution.
  - reference_id: PMID:12386330
    supporting_text: >-
      Each serine residue was phosphorylated, and this high level of phosphorylation
      is essential for biological activity.
  - reference_id: PMID:11106386
    supporting_text: >-
      The silaffins are tightly associated with the biosilica so that they can only
      be solubilized after dissolution of the cell wall in hydrogen fluoride (HF).
proposed_new_terms:
- proposed_name: silicic acid polycondensation activity
  proposed_definition: >-
    Binding silicic acid and promoting its condensation into solid silica
    (polymerized silicon dioxide), thereby accelerating silica formation and
    determining the size and morphology of the silica particles formed. Carriers of
    this function are typically not classical enzymes but polycationic,
    post-translationally modified polypeptides or peptide assemblies that provide a
    charged template surface for nucleation and growth.
  justification: >-
    SIL1 (silaffin-1) has no GO molecular function term that fits. Searching GO for
    "silica" returns only GO:0034021 response to silicon dioxide and GO:0071251
    cellular response to silicon dioxide, both response terms; the only other
    silica-related function is GO:0015115 silicate transmembrane transporter
    activity, which is a transporter and plainly wrong for a cell-wall structural
    peptide. The demonstrated activity of the sil1 gene products is the rapid
    conversion of monosilicic acid into networks of silica nanospheres, which is a
    molecular function in its own right and is the single most-studied property of
    this protein family. Per the CLAUDE.md rule on activities with no GO term, the
    core function above leaves molecular_function unset and points at this proposed
    name rather than forcing an ill-fitting id. Note that the term is deliberately
    not called a catalytic or lyase-type activity: although the UniProt FUNCTION
    line says "Catalyzes the polymerization of silica spheres", no turnover number,
    active site or catalytic mechanism has been demonstrated, and the primary
    literature describes the effect as acceleration and templating by a charged
    surface.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:10550045
    supporting_text: >-
      A set of polycationic peptides (called silaffins) isolated from diatom cell
      walls were shown to generate networks of silica nanospheres within seconds
      when added to a solution of silicic acid.
  - reference_id: PMID:11106386
    supporting_text: >-
      It is probably this structural element that accelerates silicic acid
      polymerization and promotes production of nanosphere networks.
- proposed_name: silica deposition vesicle
  proposed_definition: >-
    A membrane-bounded, acidified intracellular vesicle of silicifying organisms,
    notably diatoms, within which silicic acid is concentrated and condensed into
    solid biosilica, and whose expansion and shaping determine the morphology of the
    resulting silicified cell wall element.
  justification: >-
    The silica deposition vesicle (SDV) is the defining organelle of diatom
    biosilicification and the compartment in which silaffins are proposed to act,
    but GO has no term for it: an OLS search of the go ontology for "silica
    deposition vesicle" returns zero classes. Without this term, the intracellular
    site of silica formation cannot be annotated for any diatom protein, and
    curators are forced either to omit the location or to misuse a generic secretory
    vesicle term. This review therefore annotates only the mature biosilica location
    (GO:0030312) and records the SDV as an ontology gap.
  proposed_parent:
    id: GO:0031410
    label: cytoplasmic vesicle
  supported_by:
  - reference_id: file:CYLFU/SIL1/SIL1-uniprot.txt
    record_section: ["CC:PTM"]
    supporting_text: within the silica deposition vesicle (SDV).
- proposed_name: diatom silica cell wall
  proposed_definition: >-
    The silicified external encapsulating structure of a diatom, composed chiefly of
    amorphous hydrated silica together with an occluded organic matrix of silaffins,
    long-chain polyamines and associated proteins, and comprising two overlapping
    valves joined by girdle bands.
  justification: >-
    GO:0005618 cell wall carries an explicit "Not to be used for manual annotation"
    instruction directing curators to a lineage-specific child, but the children it
    offers cover only bacteria (GO:0009274), plants (GO:0009505), fungi (GO:0009277)
    and archaea (GO:0030115 S-layer). There is no child for the diatom frustule,
    which is chemically and developmentally unlike all four. As a result this review
    annotates the location at GO:0030312 external encapsulating structure, which is
    one level too general for a structure as well characterized as the diatom
    frustule. A diatom-specific child of GO:0005618 would let silaffins, frustulins,
    pleuralins and silicic acid transporters all be annotated at the right
    granularity.
  proposed_parent:
    id: GO:0005618
    label: cell wall
  supported_by:
  - reference_id: PMID:11106386
    supporting_text: >-
      The silaffins are tightly associated with the biosilica so that they can only
      be solubilized after dissolution of the cell wall in hydrogen fluoride (HF).
  - reference_id: file:CYLFU/SIL1/SIL1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: formation of silica cell wall of diatoms.
functional_isoforms:
- id: SIL1_1A1
  name: Silaffin-1A1
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032602]
    residues: "163-177"
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032604]
    residues: "182-196"
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032606]
    residues: "201-215"
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032608]
    residues: "220-234"
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032610]
    residues: "239-253"
  description: >-
    The 15-residue mineralization peptide, released in five tandem copies from a
    single SIL1 precursor by cleavage at RR/KR pairs. Carries lysine-linked
    long-chain poly(N-methylpropylamine), epsilon-N,N-dimethyllysine and
    epsilon-N,N,N-trimethyl-delta-hydroxylysine, and in the native state is
    phosphorylated on every serine. Precipitates silica nanospheres from monosilicic
    acid within seconds in vitro. Silaffin-1A1 was the first peptide shown to
    contain epsilon-N,N,N-trimethyl-delta-hydroxylysine.
- id: SIL1_1A2
  name: Silaffin-1A2
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032600]
    residues: "141-158"
  description: >-
    The 18-residue mineralization peptide, released once per precursor. Its four
    modified lysines are clustered in two pairs, each pair combining a
    polyamine-bearing lysine with an epsilon-N,N-dimethyllysine. Like silaffin-1A1
    it precipitates silica nanospheres within seconds in vitro, but unlike 1A1 only
    minor amounts of it are phosphorylated.
- id: SIL1_1B
  name: Silaffin-1B
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids: [PRO_0000032598]
    residues: "108-136"
  description: >-
    The longest of the mature silaffin-1 peptides, derived from the first, atypical
    repeat (R1) of the precursor. Modified on Lys-110/Lys-111 in the same
    polyamine/dimethyllysine pattern as the 1A peptides. Characterized in less
    detail than silaffin-1A1 and -1A2; its individual silica-precipitating activity
    has not been reported separately in the cached literature.
suggested_questions:
- question: >-
    Is the acidic N-terminal region of the SIL1 precursor (residues 20-107) a
    functional domain or only a propeptide? UniProt flags this explicitly as
    unknown. Given that native silaffin activity depends on a zwitterionic balance
    between polyanionic phosphoserine and polycationic polyamines, an acidic segment
    could plausibly act as an intramolecular chaperone or a self-assembly regulator
    that is removed on maturation, rather than being inert.
  experts:
  - Nils Kroeger
  - Manfred Sumper
- question: >-
    Which enzymes install the polyamine, methylation, hydroxylation and
    phosphorylation modifications on silaffins, and are they themselves silica
    deposition vesicle residents? These modifications, not the peptide backbone,
    carry the activity, yet none of the responsible enzymes is identified. They
    would be the real molecular-function targets for the polyamine-transfer and
    methylation chemistry; SIL1 is the substrate of those reactions, not their
    catalyst, so those activities must not be annotated to SIL1.
  experts:
  - Nils Kroeger
  - Rainer Deutzmann
- question: >-
    Should GO create a diatom-specific child of GO:0005618 cell wall, and a
    cellular component term for the silica deposition vesicle? Both gaps are
    recorded in proposed_new_terms, and both affect every silicifying organism in
    GO, not just this gene.
  experts: []
suggested_experiments:
- hypothesis: >-
    The lysine-linked polyamines and the serine phosphorylation make separable
    contributions to silaffin activity, the former driving precipitation rate and
    the latter controlling self-assembly and resulting silica morphology.
  description: >-
    Reconstitute silica precipitation with recombinant, chemically defined SIL1
    peptides in which each modification class is installed or omitted
    combinatorially (polyamine only, phosphate only, both, neither), and measure
    precipitation rate and resulting sphere size distribution. The literature
    establishes that both modifications are required, but the two were demonstrated
    in separate studies on differently extracted material (HF-extracted versus
    native), so their individual and joint contributions to rate versus morphology
    have never been separated.
  experiment_type: in vitro biochemical reconstitution
- hypothesis: >-
    SIL1 peptides enter the silica deposition vesicle before silica condensation
    begins, rather than associating with biosilica only after it has formed.
  description: >-
    Localize SIL1 peptides in vivo through the cell cycle by immuno-electron
    microscopy or a genetically encoded tag, specifically asking whether they are
    present in the silica deposition vesicle prior to mineral deposition. The SDV is
    where silica formation is believed to occur, and UniProt's PTM note invokes it,
    but the direct evidence available for this protein shows only the mature
    biosilica location, which is why no intracellular location is annotated in this
    review.
  experiment_type: subcellular localization / immuno-EM
- hypothesis: >-
    SIL1 is required in vivo for normal frustule silicification, and its loss alters
    silica nanosphere size or wall patterning.
  description: >-
    Knock down or knock out sil1 in Cylindrotheca fusiformis and characterize
    frustule morphology, silica content and nanosphere size by electron microscopy.
    All functional evidence for silaffin-1 is currently in vitro precipitation by
    purified peptides; there is no loss-of-function evidence that SIL1 is required
    for normal wall formation in the living diatom, which is the main gap between
    the accepted in vitro activity and the asserted in vivo role in cell wall
    biogenesis.
  experiment_type: reverse genetics / phenotypic analysis
