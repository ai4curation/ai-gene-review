id: Q9SE35
gene_symbol: SIL1
product_type: PROTEIN
taxon:
  id: NCBITaxon:2853
  label: Cylindrotheca fusiformis
description: >-
  Silaffin-1 precursor, the founding member of the silaffin family of diatom
  biosilica-forming polypeptides. The 265-residue precursor carries a cleaved
  signal peptide, an acidic N-terminal propeptide of uncertain function, and a
  C-terminal array of seven lysine/serine-rich repeats that is proteolytically
  processed at pairs of basic residues into the mature mineralization peptides
  silaffin-1A1 (five copies), silaffin-1A2 and silaffin-1B. The mature peptides
  are among the most heavily post-translationally modified polypeptides known:
  specific lysines carry long poly(N-methylpropylamine) chains, others are
  dimethylated or converted to trimethyl-delta-hydroxylysine, and in the native
  state essentially every serine is phosphorylated. The resulting zwitterionic
  peptides self-assemble and precipitate networks of silica nanospheres from
  monosilicic acid within seconds in vitro, and both the polyamine modification
  and the phosphorylation are required for that activity. In the cell the
  peptides are integral, HF-resistant components of the silica cell wall
  (frustule) and are thought to template and accelerate silica polycondensation
  during wall biogenesis, acting together with free long-chain polyamines to set
  silica sphere size and the species-specific wall pattern.
references:
- id: PMID:10550045
  title: Polycationic peptides from diatom biosilica that direct silica nanosphere formation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding silaffin paper and the source of the UniProt FUNCTION statement.
      Cached entry is abstract-only (full_text_available: false). The abstract
      itself states both the silica-precipitating activity and the dependence of
      that activity on the lysine modifications, which is all that is quoted here.
- id: PMID:11349130
  title: 'Silica-precipitating peptides from diatoms. The chemical structure of silaffin-A
    from Cylindrotheca fusiformis.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper that ties the purified silica-precipitating peptides to the sil1
      gene specifically, and determines their chemical structure. Abstract-only in
      the cache, but the abstract names the gene, the organism and the in vitro
      activity explicitly. Note the typographic quirk "and-1A(2)" in the cached
      abstract, reproduced verbatim in the quote below.
- id: PMID:11106386
  title: Species-specific polyamines from diatoms control silica morphology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only full-text entry among the silaffin papers in our cache. Its
      introduction supplies the cell-wall association evidence (HF required for
      solubilization) and the authors' mechanistic reading (templating/acceleration
      rather than catalysis). The paper's own new result concerns free long-chain
      polyamines rather than SIL1, so it is cited here for the silaffin background
      it states, not for its headline finding.
- id: PMID:12386330
  title: Self-assembly of highly phosphorylated silaffins and their function in biosilica
    morphogenesis.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the native (non-HF) modification state: complete serine
      phosphorylation, essential for activity, producing a zwitterion that
      self-assembles. Important as a correction to the earlier HF-extracted
      preparations. Abstract-only in the cache.
