- id: PMID:2520825
  title: Localization of ice nucleation activity and the iceC gene product in Pseudomonas
    syringae and Escherichia coli.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The subcellular-location evidence for this entry: UniProt
      cites it as the ECO:0000269 source for its "Cell outer membrane" line.
      Cached abstract-only, but the abstract itself states the fractionation
      result, the marker controls used (KDO versus NADH oxidase) and the
      conclusion for both P. syringae and E. coli, which is all that is quoted.
      The paper calls the gene iceC; UniProt curators treat that gene product as
      this entry, and this review defers to that identification rather than
      second-guessing it from an abstract.
- id: PMID:9698431
  title: Phospholipid analysis and fractional reconstitution of the ice nucleation
    protein activity purified from Escherichia coli overexpressing the inaZ gene of
    Pseudomonas syringae.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The strongest direct activity evidence that names inaZ
      explicitly: the protein was purified from membranes of E. coli carrying
      inaZ, its ice nucleation activity was measured, abolished by phospholipase
      C and restored by phosphatidylethanolamine. Also an independent
      confirmation that the protein is envelope-localised. Abstract-only in the
      cache; every quoted statement is in the abstract.
- id: PMID:33608518
  title: Ice-nucleating proteins are activated by low temperatures to control the structure
    of interfacial water.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available in the cache. The modern mechanistic
      study of InaZ specifically: sum-frequency generation and 2D-IR
      spectroscopy with molecular dynamics. Source of the beta-helix fold of the
      ice-active repeats, of the water-ordering mechanism, and of the explicit
      three-part domain architecture. Caveat recorded for the reader: the
      construct is InaZ9R, a truncation carrying nine of the repeats in the
      native terminal domains, not full-length InaZ, so repeat-number-dependent
      claims do not follow from it; the fold and water-ordering results do.
- id: PMID:8355267
  title: A model of the three-dimensional structure of ice nucleation proteins.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. A modelling paper, not experimental structure
      determination, and used here only for the two-faced architecture it
      predicts (an ice-templating face and a membrane-interacting face). Note
      that this is a different membrane-interaction model from the one used for
      the anchor statement in core_functions: here the membrane-contacting
      surface is a face of the repeat region, whereas PMID:33608518 puts membrane
      binding in a distinct N-terminal domain. The two are not reconciled in the
      literature and the review says so rather than merging them. Nothing in
      this review rests on its specific beta-sheet geometry, which PMID:33608518
      weighs against a beta-helical alternative.
- id: PMID:9624691
  title: Surface display of Zymomonas mobilis levansucrase by using the ice-nucleation
    protein of Pseudomonas syringae.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The founding INP surface-display paper and the reason
      this protein appears in the CMMMech critical-minerals corpus. Used as
      corroboration of outer-membrane residence and outward accessibility, and
      not as primary location evidence, because the construct is an
      Inp-levansucrase fusion in E. coli rather than native InaZ in P. syringae.
      Note that its abstract describes Inp as "glycosyl
      phosphatidylinositol-anchored"; GPI anchoring is a eukaryotic pathway and
      the GPI-like anchor claim for INPs is not settled, so no anchor-type
      statement in this review derives from it.
- id: PMID:1760850
  title: Principles and biotechnological applications of bacterial ice nucleation.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified review, cited by UniProt's BIOTECHNOLOGY line. Used only
      for ecological and applied framing (frost damage to plants, snow making).
      No annotation in this review is supported by it alone.
