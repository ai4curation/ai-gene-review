id: P06620
gene_symbol: inaZ
product_type: PROTEIN
taxon:
  id: NCBITaxon:321
  label: Pseudomonas syringae pv. syringae
description: >-
  InaZ is the ice nucleation protein of Pseudomonas syringae pv. syringae and
  the most studied member of the bacterial ice nucleation protein family. The
  1200-residue polypeptide has three parts: a membrane-binding N-terminal
  domain, a long central array of imperfect octapeptide repeats (consensus
  A-G-Y-G-S-T-L-T, with 16-residue and 48-residue periodicities superimposed),
  and a C-terminal domain of unknown function. The protein resides in the cell
  outer membrane, where essentially all of the gene product and essentially all
  of the cellular ice nucleation activity are found; its activity depends on a
  lipid environment, being abolished by phospholipase C and restored by
  phosphatidylethanolamine. The repeat array folds as a beta-helix whose
  repeating, water-facing surface orders adjacent water molecules into an
  ice-like arrangement, so that the protein templates ice formation instead of
  catalysing a chemical conversion; the ordering of interfacial water increases
  as the temperature approaches the melting point of water. Bacteria carrying
  InaZ are the most effective ice nucleators known and can freeze water at
  temperatures as high as about -2 degrees Celsius, well above the homogeneous
  nucleation limit. In the field this activity causes frost injury to plant
  surfaces colonised by the bacterium, and airborne ice-nucleation-active
  bacteria contribute to cloud glaciation and precipitation. The same property
  is exploited industrially in artificial snow production, and the N-terminal
  membrane-anchoring portion of InaZ is widely used as a scaffold for displaying
  heterologous proteins on the outer surface of Gram-negative bacteria.
