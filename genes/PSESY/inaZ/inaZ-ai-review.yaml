existing_annotations:
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR000258
  - UniProtKB-SubCell:SL-0040
  review:
    summary: >-
      InaZ is an outer-membrane protein, and this is where its ice nucleation
      activity resides. Cell fractionation of both P. syringae and E. coli
      carrying the cloned gene put essentially all of the gene product and
      essentially all of the ice nucleation activity in the outer membrane,
      with lipopolysaccharide and inner-membrane markers used to tell the two
      membranes apart.
    action: ACCEPT
    reason: >-
      The row is electronic (InterPro signature plus the UniProt SubCell
      keyword), so the question is whether the underlying claim holds, and it
      does, on direct experiment that the electronic mapping happens to agree
      with. PMID:2520825 fractionated cells and showed that ice nuclei
      co-partitioned with 3-ketodeoxyoctonate, a lipopolysaccharide component,
      and anti-partitioned with NADH oxidase, a cytoplasmic membrane marker,
      which is the marker-controlled discrimination that makes an outer-membrane
      assignment meaningful rather than a generic envelope assignment. The same
      paper localised the gene product itself, not only the activity, to the
      outer membrane in both the native host and a heterologous host.
      PMID:9698431 independently found the protein entirely in the bacterial
      envelope. UniProt curators cite PMID:2520825 as the ECO:0000269 evidence
      for the entry's SUBCELLULAR LOCATION line. ACCEPT rather than
      KEEP_AS_NON_CORE because this location is where the core activity happens:
      an ice nucleator that is not presented at the cell envelope, facing bulk
      water, cannot do its job. A more specific term is deliberately not
      proposed; see the GO:0019833 row and the notes file for why outward
      orientation is not annotated here. One caveat worth recording for anyone
      re-reviewing the electronic source: IPR000258 is a Repeat entry covering
      the octapeptide array, and it also matches secreted fungal ice-nucleation
      proteins, so the signature is not by itself a reliable predictor of an
      outer-membrane location in other organisms even though it gives the right
      answer for this protein.
    supported_by:
    - reference_id: PMID:2520825
      supporting_text: >-
        Nearly all ice nucleation activity was associated with the outer membrane
        because the partitioning of 3-ketodeoxyoctonate (a lipopolysaccharide
        component) and ice nuclei in cell fractions were similar to and opposite
        that of NADH oxidase (a cytoplasmic membrane component).
    - reference_id: PMID:2520825
      supporting_text: >-
        Nearly all of the iceC gene product, which occurred in low abundance, was
        associated with the outer membrane of both P. syringae and E. coli.
    - reference_id: PMID:9698431
      supporting_text: >-
        The ice nucleation protein was totally localized in the bacterial envelope
        and was extracted by either salt (0.25 M NH4Cl) or the nonionic detergent
        Tween 20.
    - reference_id: file:PSESY/inaZ/inaZ-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: "SUBCELLULAR LOCATION: Cell outer membrane"
- term:
    id: GO:0019833
    label: ice nucleation activity
  evidence_type: IDA
  original_reference_id: PMID:9698431
  qualifier: enables
  review:
    summary: >-
      InaZ nucleates ice. Protein purified from membranes of E. coli carrying
      inaZ has measurable ice nucleation activity that is destroyed by
      phospholipase C and restored by phosphatidylethanolamine, and the
      ice-active repeat region folds as a beta-helix that orders the adjacent
      water network into an ice-like arrangement.
    action: NEW
    reason: >-
      This is the defining activity of the protein and the only annotation that
      says what it does, yet P06620 carries no molecular function row at all. A
      term exists: GO:0019833 ice nucleation activity, a molecular function
      under GO:0050825 ice binding, whose definition names this organism
      ("commonly found in certain bacteria, such as Pseudomonas syringae").
      Verified via OLS on 2026-10-28, not obsolete. A QuickGO query for
      goId=GO:0019833 on the same date returned numberOfHits 0, so the term has
      no annotations anywhere; the term id and its non-obsolete label are also
      recorded in this repository's own ontology cache at cache/go/terms.csv line
      4483 (fetched 2026-07-26), which is the in-repo anchor for the id. An
      independent in-repo source reaches the same conclusion about the gap: the
      TCDB propagation analysis at projects/TCDB/data/propagation_evidence.tsv
      line 195 lists TC family 9.B.133.1.1 with GO:0019833 and member P06620 at
      k=0 of n=1 annotated, verdict GAP_CANDIDATE. That absence is not a curator
      convention to
      respect: the term's own definition records that it was reinstated from
      obsolete, which accounts for an empty annotation set, and unlike a
      substrate-versus-enzyme convention there is no other gene product that
      performs this step instead. InaZ itself presents the templating surface,
      so it is the entity doing the work. Evidence is IDA on PMID:9698431, which
      names inaZ explicitly: ice nucleation protein was partially purified from
      the membrane fraction of E. coli carrying inaZ, and the ice nucleation
      activity of that purified protein was measured. The phospholipase C
      abolition and phosphatidylethanolamine restoration show only that the
      activity requires a lipid environment; they do not by themselves exclude a
      co-purifying lipid-dependent nucleant, which in a partially purified
      membrane preparation would behave the same way. What excludes a
      contaminating nucleant is the heterologous gain of function: E. coli
      acquires outer-membrane-localised, maximally active ice nucleation on
      receipt of the cloned gene, which is PMID:2520825's explicit conclusion for
      both the source strain and heterologous strains. Mechanism from
      PMID:33608518. Two reservations are recorded rather than hidden. First,
      the term's definition says "Catalysis of the formation of ice crystals",
      but INPs present an ordered surface and consume nothing; the term's own
      placement under ice binding is the more accurate statement, and the
      definition wording is raised in suggested_questions rather than taken as a
      reason to avoid the term. Second, the activity measurements are on protein
      expressed in E. coli, as is almost all InaZ biochemistry, because the
      native protein is of very low abundance; PMID:2520825 reports the activity
      in the native host as well.
    supported_by:
    - reference_id: PMID:9698431
      supporting_text: >-
        Ice nucleation protein was partially purified from the membrane fraction of
        E. coli carrying inaZ from Pseudomonas syringae.
    - reference_id: PMID:9698431
      supporting_text: >-
        The activity of the purified protein was lost after treatment with
        phospholipase C, and its activity was subsequently restored by addition of
        the naturally occurring lipid phosphatidylethanolamine.
    - reference_id: PMID:2520825
      supporting_text: >-
        Therefore, the iceC gene product is located at and is maximally active in
        or on the outer membrane of cells of the source strain and heterologous
        strains.
    - reference_id: PMID:33608518
      supporting_text: >-
        In this configuration, interaction between INPs and water molecules imposes
        structural ordering on the adjacent water network.
    - reference_id: PMID:33608518
      supporting_text: >-
        Using ice-nucleating proteins (INPs) attached to their outer membrane, they
        promote ice growth at high sub-zero temperatures
    - reference_id: file:PSESY/inaZ/inaZ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Ice nucleation proteins enable bacteria to nucleate crystallization in
        supercooled water.
core_functions:
- description: >-
    InaZ is an outer-membrane ice nucleator. Its central array of imperfect
    octapeptide repeats folds as a beta-helix presenting a flat, periodic,
    water-facing surface whose spacing matches an ice lattice, so that adjacent
    water molecules are held in an ice-like arrangement and the free-energy
    barrier to ice nucleation is lowered. The protein consumes nothing and is
    not altered by the reaction: the activity is a property of the ordered
    surface, and it requires both the repeat array and a lipid environment,
    being abolished by phospholipase C and restored by
    phosphatidylethanolamine. How the protein is held at the membrane is
    described by two different models that should not be conflated: the
    molecular-modelling study of PMID:8355267 puts one face of the repeat region
    itself against the membrane while the other face templates water, whereas the
    architecture followed here, from PMID:33608518, assigns membrane binding to a
    distinct N-terminal domain separate from the ice-active repeats. The
    N-terminal-anchor reading is the one taken in this review; it is itself
    model-based in that source. Anchored in the outer membrane through its
    N-terminal domain, InaZ makes P. syringae the most effective ice nucleator
    known, able to freeze water at temperatures as high as about -2 degrees
    Celsius.
  molecular_function:
    id: GO:0019833
    label: ice nucleation activity
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:9698431
    supporting_text: >-
      The activity of the purified protein was lost after treatment with
      phospholipase C, and its activity was subsequently restored by addition of
      the naturally occurring lipid phosphatidylethanolamine.
  - reference_id: PMID:33608518
    supporting_text: >-
      In this configuration, interaction between INPs and water molecules imposes
      structural ordering on the adjacent water network.
  - reference_id: PMID:2520825
    supporting_text: >-
      Nearly all of the iceC gene product, which occurred in low abundance, was
      associated with the outer membrane of both P. syringae and E. coli.
  - reference_id: PMID:33608518
    supporting_text: >-
      At cell surfaces, based on current models, InaZ is anchored through its
      N-terminal domain
  - reference_id: PMID:8355267
    supporting_text: >-
      This model predicts a largely planar extended molecule, with one side
      serving as a template for orienting water into an ice lattice and the other
      side interacting with the membrane.
  knowledge_gaps:
  - gap_statement: >-
      How many InaZ molecules, in what arrangement, constitute a functional ice
      nucleus, and what sets the characteristic nucleation temperature of a given
      cell? Ice nucleation activity per cell varies over orders of magnitude and
      is widely held to depend on multimeric assemblies of INP rather than on
      single molecules, but the size, stoichiometry and membrane organisation of
      the active assembly in a living P. syringae cell have not been measured.
    boundary: >-
      Established: the protein is in the outer membrane, the central repeat array
      folds as a beta-helix, that surface orders interfacial water, and the
      activity requires a lipid environment. Unknown: the number of molecules and
      their spatial arrangement in the functional nucleus, and what determines the
      nucleation temperature of an individual cell.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
suggested_questions:
- question: >-
    Should the definition of GO:0019833 ice nucleation activity be revised? It
    currently reads "Catalysis of the formation of ice crystals in extracellular
    fluid at relatively high temperatures (up to -2 degrees Celsius) to protect
    the organism from damage by intracellular ice formation". Two things sit
    awkwardly. Ice nucleators are not catalysts in the enzymatic sense: they
    present a templating surface, turn nothing over and are not consumed, which
    is exactly what the term's placement under GO:0050825 ice binding already
    says, so the definition text and the position in the ontology disagree.
    Separately, the clause about protecting the organism from intracellular ice
    describes freeze-tolerant insects and some fungi, but for P. syringae the
    literature frames high-temperature nucleation as damaging the plant host and
    releasing nutrients to the epiphyte. A definition that names one lineage's
    adaptive rationale makes the term harder to apply to the organism it was
    written for.
  experts: []
- question: >-
    Is the native InaZ ice-active surface oriented outward, into bulk water,
    with evidence from the native protein rather than from display constructs?
    Outward presentation is obvious from the function and is demonstrated for
    engineered INP-anchor fusions by protease accessibility and immunogold
    microscopy, but those are heterologous constructs. This review therefore
    annotates GO:0009279 cell outer membrane and does not add a cell surface or
    external-side term.
  experts: []
- question: >-
    What is the function of the InaZ C-terminal domain? The three-part
    architecture is established and the N-terminal domain is the membrane anchor,
    but the C-terminal domain is described in the literature as being of unknown
    function. Since it is conserved across the bacterial INP family, it is
    unlikely to be a passive linker.
  experts: []
suggested_experiments:
- hypothesis: >-
    The ice-active repeat surface of native InaZ faces outward from the outer
    membrane into the extracellular medium.
  description: >-
    Test accessibility of the repeat region in intact, non-permeabilised
    P. syringae cells expressing untagged native InaZ, using protease shaving
    followed by mass spectrometry of released repeat peptides, with a periplasmic
    marker as the integrity control, and in parallel by labelling with an
    antibody raised against the repeat consensus under non-permeabilising
    conditions. Current outward-orientation evidence comes from
    INP-anchor-passenger fusions in E. coli, so a direct result on the native
    protein in the native host would let the location be annotated at a
    sub-compartment or cell-surface granularity instead of at the outer membrane.
  experiment_type: topology mapping / surface proteolysis
- hypothesis: >-
    The ice nucleation temperature of a cell is set by the size of the InaZ
    assembly rather than by the amount of InaZ present.
  description: >-
    Titrate inaZ expression over a wide range in a defined P. syringae
    background, and for each level measure both the number of InaZ molecules per
    cell and the distribution of freezing temperatures of single cells or
    droplets, while imaging InaZ assemblies in the membrane by super-resolution
    or cryo-electron tomography. If nucleation temperature tracks assembly size
    and saturates while InaZ copy number keeps rising, the active unit is a
    multimer of defined size; if it tracks copy number, it is not. This addresses
    the knowledge gap recorded on the core function, and it is the measurement
    that would let the activity be described quantitatively rather than as a
    present/absent property.
  experiment_type: quantitative cell biology / single-droplet freezing assay
