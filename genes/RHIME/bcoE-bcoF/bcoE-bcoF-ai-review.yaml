  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:45716
  review:
    summary: Rhea-mapped activity of the C-terminal betainyl-CoA thioesterase region; the closest GO term
      for EC 3.1.2.33.
    action: ACCEPT
    reason: The current GO definition covers acyl-CoA hydrolysis and therefore both measured CoA-ester
      reactions. Full-length sequence-matched protein hydrolyzes betainyl-CoA (kcat 142.3s−1) and carnitinyl-CoA
      (0.9s−1), each with Km 12µM. The slower activity has reconstructed upstream pathway support and
      its substrate is detected in GBB-grown 3D0a2 cells; lack of a direct carnitine ligase does not negate
      formation via BcoAB/C/D. GO0016289 remains the fitting available genus, with the specific betainyl-CoA
      proposal separate. Assays were not performed on isolated target domains or native 1021 cells.
