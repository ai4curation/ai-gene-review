- term:
    id: GO:0009437
    label: carnitine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000160024
  - UniPathway:UPA00117
  review:
    summary: Carnitine metabolism includes both synthesis by thioester hydrolysis and downstream catabolism.
    action: MODIFY
    reason: Refine the metabolic parent to both supported descendants. The intact fusion directly releases
      carnitine from carnitinyl-CoA in the reconstructed GBB pathway, then oxidizes carnitine and hydrolyzes
      downstream betainyl-CoA during degradation. This is catalytic participation, not an inference from
      gene necessity alone. Chemistry transfers by the exact sequence bridge; Rm2011 growth cannot be
      presented as a strain1021 phenotype. GO:0045329 describes formation of transient carnitine by hydrolysis
      of its CoA ester within GBB utilization; it does not assign the mammalian BBOX-type hydroxylation
      route to this enzyme.
    proposed_replacement_terms:
    - id: GO:0042413
      label: carnitine catabolic process
    - &id003
      id: GO:0045329
      label: carnitine biosynthetic process
    supported_by:
    - reference_id: file:RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Is involved in a L- carnitine degradation pathway that allows R.meliloti to grow
        on L- carnitine as the sole source of carbon and nitrogen (PubMed:30670548).
    - reference_id: file:RHIME/bcoE-bcoF/bcoE-bcoF-source-analysis/primary-scope.md
      supporting_text: Purified full-length Smc01638 performs NAD-dependent carnitine oxidation and hydrolysis
        of both carnitinyl-CoA and betainyl-CoA.
