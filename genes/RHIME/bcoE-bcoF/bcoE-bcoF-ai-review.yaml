  - term:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000116
    qualifier: enables
    supporting_entities:
      - RHEA:45716
    review:
      summary: >-
        Rhea-mapped activity of the C-terminal betainyl-CoA thioesterase region;
        the closest GO term for EC 3.1.2.33.
      action: ACCEPT
      reason: >-
        The purified enzyme hydrolyzes betainyl-CoA with high efficiency (kcat
        142 s-1); GO has no betainyl-CoA-specific term (see proposed_new_terms),
        so this parent is the most precise available. The enzyme also hydrolyzes
        L-carnitinyl-CoA, but at kcat 0.9 s-1 against 142.3 s-1 for betainyl-CoA
        at the same KM of 12 uM, a 158-fold difference in turnover; UniProt
        itself calls this "much lower efficiency". On the promiscuous-activity
        tiers in projects/ENZYME_SPECIFICITY.md that reads as in vitro activity
        of unknown physiological relevance rather than a second evolved
        function: no carnitinyl-CoA ligase is known in this pathway, so there is
        no route by which the substrate would be formed in vivo. GO:0016289
        covers both reactions, so no separate row is proposed; the open question
        is recorded in suggested_questions.
      supported_by:
        - reference_id: file:RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: >-
            Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
            H(+);
        - reference_id: file:RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
          record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
          supporting_text: "KM=12 uM for betainyl-CoA {ECO:0000269|PubMed:30670548};"
        - reference_id: file:RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Can also hydrolyze L-carnitinyl-CoA, but with much lower efficiency
            (PubMed:30670548).
