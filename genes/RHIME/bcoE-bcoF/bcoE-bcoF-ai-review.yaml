  label: Sinorhizobium meliloti 1021
description: >-
  bcoE-bcoF (cdhAB, SMc01638) encodes a bifunctional cytoplasmic enzyme of
  Sinorhizobium meliloti L-carnitine catabolism. The N-terminal region (residues
  1-335, 3-hydroxyacyl-CoA dehydrogenase family) oxidizes L-carnitine to
  3-dehydrocarnitine with NAD(+), and the C-terminal hotdog-fold region
  (residues 336-496) hydrolyzes betainyl-CoA (N,N,N-trimethylglycyl-CoA) to
  glycine betaine and CoA, so one polypeptide carries the first and last steps
  of the route whose middle step is the BcoG cleavage enzyme. In Pseudomonas the
  two activities are separate proteins (CdhA and CdhB). The purified homodimer
  was characterized kinetically, and gene disruption abolishes growth on
  gamma-butyrobetaine, which S. meliloti converts to carnitine before
  degrading it.
