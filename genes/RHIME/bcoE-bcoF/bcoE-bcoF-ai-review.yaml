suggested_questions:
  - question: >-
      Is the C-terminal thioesterase region homologous to the stand-alone CdhB
      hotdog thioesterases of Pseudomonas, and did the fusion arise once in
      Rhizobiales and Roseobacter lineages?
  - question: >-
      Is L-carnitinyl-CoA ever formed in S. meliloti, or is the 158-fold slower
      hydrolysis of it by this enzyme purely an in vitro property of a pocket
      evolved for betainyl-CoA?
suggested_experiments:
  - description: >-
      Express the two regions separately and test whether each retains its
      activity, and whether the fusion channels betainyl-CoA formed by BcoG.
    experiment_type: protein dissection and coupled enzyme assay
