suggested_questions:
- question: Is the C-terminal thioesterase region homologous to the stand-alone CdhB hotdog thioesterases
    of Pseudomonas, and did the fusion arise once in Rhizobiales and Roseobacter lineages?
- question: Which regulatory or physiological differences explain failure of tested1021 stocks to grow
    on GBB despite identical local coding sequences, and how do the two thioester substrates partition
    in vivo?
suggested_experiments:
- description: Express the two regions separately and test catalytic sufficiency and kinetic coupling.
    Directly test the hypothesized channeling of carnitine from thioester hydrolysis to oxidation; do
    not infer channeling from fusion alone.
  experiment_type: protein dissection and coupled enzyme assay
