taxon:
  id: NCBITaxon:266834
  label: Sinorhizobium meliloti 1021
description: BcoE-BcoF is a fused dehydrogenase–thioesterase of Sinorhizobium meliloti carnitine metabolism.
  Its N-terminal region oxidizes L-carnitine to 3-dehydrocarnitine with NAD+, and its C-terminal hotdog
  region hydrolyzes betainyl-CoA to glycine betaine and CoA. The same protein also hydrolyzes carnitinyl-CoA,
  releasing carnitine during upstream gamma-butyrobetaine utilization. These three activities were measured
  on the sequence-matched 3D0a2 protein. The fusion supplies two distinct catalytic roles in carnitine
  degradation, with BcoG performing the intervening cleavage reaction. Native GBB-growth phenotypes differ
  between Rm2011 and strain 1021 despite identical local coding sequences.
