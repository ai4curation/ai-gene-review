  - RHEA:21732
  - EC:4.1.3.27
  review:
    summary: >-
      A single 729-residue polypeptide fuses the TrpE synthase domain to a C-terminal TrpG glutamine amidotransferase
      domain, so it can carry out the whole glutamine-dependent anthranilate synthase reaction.
    action: ACCEPT
    reason: >-
      Core function. Unlike separate TrpG subunits, this fused protein carries both half-reactions, so
      the enables relation is accurate. The support is the chorismate-binding (Pfam PF00425) and class-I
      GATase (PF00117, CDD cd01743) domains with the triad active-site residues, and the alphaproteobacterial
      fused-AS model TIGR01815. No kinetic study of the S. meliloti enzyme is cached.
    supported_by:
    - reference_id: PMID:2656657
      supporting_text: >-
        This apparent gene fusion joins the C terminus of the large subunit (TrpE) to the N terminus of
        the small subunit (TrpG) through a short connecting segment.
    - reference_id: file:RHIME/trpEG/trpEG-uniprot.txt
