id: P15395
gene_symbol: trpE(G)
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:266834
  label: Sinorhizobium meliloti 1021
description: >-
  trpE(G) (SMc02725) of Sinorhizobium meliloti 1021 encodes a 729-residue single-chain anthranilate synthase.
  The chorismate-binding synthase (TrpE) portion is joined at its C terminus to a class-I glutamine amidotransferase
  (TrpG) domain through a short connector. The fused protein converts chorismate and L-glutamine to anthranilate,
  pyruvate and L-glutamate, the first step of L-tryptophan biosynthesis. This TrpE-TrpG fusion is typical
  of a clade of alphaproteobacteria. The gene carries an attenuation-type leader region like those of
  other tryptophan biosynthetic operons.
