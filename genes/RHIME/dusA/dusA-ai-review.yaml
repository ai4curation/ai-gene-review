    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000184720
  review:
    summary: >-
      True but peripheral: DusA must bind its tRNA substrate, and the E. coli
      enzyme binds tRNA directly, but binding is part of the catalytic activity
      rather than a separate function.
    action: KEEP_AS_NON_CORE
    reason: >-
      E. coli DusA binds tRNA in a two-step mechanism and prefers modified tRNA
      (PMID:42080256), and the tRNA-contact and subfamily-signature residues are
      conserved here (dusA-bioinformatics/RESULTS.md). The UniRule mapping is sound.
      The term is as precise as the binding evidence allows, but it describes
      substrate binding by an enzyme whose core function is the synthase activity,
      so it is kept as non-core.
    supported_by:
    - reference_id: PMID:42080256
      supporting_text: We find that DusA binds tRNA via a two-step mechanism involving
        a local structural rearrangement and exhibits a higher affinity for previously
        modified tRNA compared to unmodified tRNA.
    - reference_id: file:RHIME/dusA/dusA-bioinformatics/RESULTS.md
      supporting_text: tRNA-interacting E. coli N111 and R201 are conserved (N80, R169)
