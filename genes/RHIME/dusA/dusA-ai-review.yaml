taxon:
  id: NCBITaxon:266834
  label: Sinorhizobium meliloti 1021
aliases: [SMc04235, SM_RS09780]
description: >-
  DusA is the tRNA-dihydrouridine(20/20a) synthase of Sinorhizobium meliloti, an
  FMN-dependent flavoenzyme of the Dus (COG0042) family that reduces
  the C5-C6 double bond of uridines at positions 20 and 20a in the tRNA D-loop,
  using NADPH or NADH as the electron source. It belongs to the DusA subfamily
  (HAMAP MF_02041), whose members bind the tRNA elbow in an orientation set by
  subfamily-specific binding-signature residues and so modify U20/U20a rather than
  the U16 and U17 sites of DusC and DusB. The protein keeps the catalytic cysteine
  (Cys83 in the UniProt numbering, equivalent to E. coli DusA Cys114), the FMN-binding
  residues and the subfamily signature residues, and carries two short insertions in
  its C-terminal helical domain. The UniProt sequence starts within the conserved
  N-terminal FMN-binding segment, and the open reading frame continues upstream, so
  the native protein is probably longer at its N-terminus. No rhizobial DusA has
  been studied experimentally; the function rests on the E. coli and Thermus
  thermophilus enzymes, where D20/D20a formation tunes tRNA structure and the
  decoding of specific codons.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    The 359-residue UniProt/EMBL model (CAC46484) starts at MIDWTD, which aligns to
    E. coli DusA Met33, so the first residue (Pro32) of the HAMAP MF_02041
    FMN-binding feature at E. coli 32-34 is missing; its codon lies just upstream
    in an open frame. The feature therefore cannot be placed on Q92P85, which is
    why UniProt flags missing conserved residues. The current RefSeq model for the same locus (SM_RS09780,
    WP_015241224.1) starts 26 codons upstream and contains the motif, as does the
    398-residue KBase model from strain USDA1810, whose different N-terminal 39
    residues probably come from a dusA-associated integrase island. The start used
    in vivo is not known. Functional statements apply to the full-length protein,
    and the domain and site analysis is unaffected beyond that one residue.
  evidence_types:
  - ORTHOLOG_COMPARISON
  - GENOMIC_SEQUENCE
  supported_by:
  - reference_id: file:RHIME/dusA/dusA-uniprot.txt
    record_section: ["CC:CAUTION"]
    supporting_text: 'CAUTION: Lacks conserved residue(s) required for the propagation of feature annotation.'
  - reference_id: file:RHIME/dusA/dusA-bioinformatics/RESULTS.md
    supporting_text: The 359-residue model is most likely an
      N-terminally truncated gene call; the longer RefSeq model (WP_015241224.1) restores
      the motif.
  - reference_id: file:RHIME/dusA/dusA-bioinformatics/RESULTS.md
    supporting_text: 'S. meliloti 1021: open frame upstream of annotated start: RDMMESVQTDGKRGENRYFKAPVFAVAP (28 codons)'
