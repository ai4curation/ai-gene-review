- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018517
  review:
    summary: >-
      Wrong cofactor. Dus enzymes are FMN flavoenzymes; FAD binding comes from a
      broad InterPro2GO mapping of the Dus conserved-site signature.
    action: REMOVE
    reason: >-
      The flavin of the Dus family is FMN, shown in the Thermus Dus-tRNA crystal
      structures (PMID:22123979), and UniProt and HAMAP record FMN as the
      cofactor of this protein. No Dus enzyme is known to bind FAD. The row is an
      electronic mapping from IPR018517 (tRNA-dihydrouridine synthase conserved
      site) that also puts FAD binding on E. coli DusA (QuickGO, 2026-10-30), next
      to the correct FMN binding row; the upstream defect is recorded below.
    supported_by:
    - reference_id: PMID:22123979
      supporting_text: In the active site, U20 is stacked on the isoalloxazine ring
        of FMN
    - reference_id: file:RHIME/dusA/dusA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=FMN; Xref=ChEBI:CHEBI:58210;
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR018517
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0050660
      corrected_value: GO:0010181
      corrected_label: FMN binding
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Resource is InterPro (InterPro2GO). IPR018517 (tRNA-dihydrouridine
        synthase, conserved site) is mapped to GO:0050660 flavin adenine
        dinucleotide binding. The flavin of the Dus family is FMN, not FAD
