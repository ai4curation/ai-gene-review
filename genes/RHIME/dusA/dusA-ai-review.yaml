- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000184720
  review:
    summary: >-
      Correct. Dus enzymes carry FMN as the prosthetic group that is reduced by
      NAD(P)H and transfers a hydride to the uridine, and the FMN-binding residues
      are conserved here.
    action: ACCEPT
    reason: >-
      FMN is the catalytic cofactor of the Dus family (PMID:22123979), and in the
      Thermus Dus-tRNA complex U20 stacks on the FMN isoalloxazine ring. All
      HAMAP MF_02041 FMN-binding residues are conserved in Q92P85 except E. coli
      Pro32, which the truncated gene model omits, and Leu34, which is
      conservatively replaced by Ile (dusA-bioinformatics/RESULTS.md). Cofactor binding is integral to the core
      catalytic function.
    supported_by:
    - reference_id: PMID:22123979
      supporting_text: Dihydrouridine synthase (Dus) catalyzes the D formation of
        tRNA through reduction of uracil base with flavin mononucleotide (FMN) as a
        cofactor.
    - reference_id: file:RHIME/dusA/dusA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=FMN; Xref=ChEBI:CHEBI:58210;
