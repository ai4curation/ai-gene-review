suggested_questions:
- question: Which start codon does S. meliloti use for dusA? The RefSeq model
    (WP_015241224.1) adds 26 residues that include the equivalent of E. coli DusA
    FMN-binding Pro32, which is missing from Q92P85.
- question: Do strains with a dusA-associated integrase island, such as USDA1810,
    make a functional DusA from the island-supplied 5' end?
- question: Why does the S. meliloti dusA transposon mutant grow better in 10 mM
    perchlorate (Fitness Browser data, as shown on the KBase dashboard), and is this linked to NADPH-dependent redox
    sensitivity of Dus activity?
suggested_experiments:
- description: Map dihydrouridines in tRNAs of S. meliloti wild type and a dusA
    deletion (AlkAnilineSeq or LC-MS of tRNA digests) to confirm loss of D20/D20a.
  experiment_type: tRNA modification mapping
- description: Determine the N-terminus of native DusA by N-terminal proteomics or
    ribosome profiling with translation-initiation inhibitors in strains 1021 and
    USDA1810.
  experiment_type: gene model validation
