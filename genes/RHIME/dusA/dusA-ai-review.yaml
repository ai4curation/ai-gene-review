- id: PMID:11983710
  title: Identification of the tRNA-dihydrouridine synthase family.
  findings:
  - statement: Deletion of the three E. coli COG0042 genes (dusA/yjbN, dusB/yhdG,
      dusC/yohI) showed that this family makes dihydrouridine in tRNA, with
      non-redundant site-specific roles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; founding identification of the Dus family in
      E. coli.
- id: PMID:22123979
  title: Molecular basis of dihydrouridine formation on tRNA.
  findings:
  - statement: Crystal structures of Thermus thermophilus Dus (the D20/D20a enzyme)
      with tRNA show FMN as cofactor, U20 stacked on the flavin, and C5 of U20
      cross-linked to the catalytic Cys93.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; mechanism and cofactor for the 20/20a Dus enzymes.
- id: PMID:25902496
  title: Major reorientation of tRNA substrates defines specificity of dihydrouridine
    synthases.
  findings:
  - statement: DusA and DusC bind tRNA in almost reversed orientations, set by
      subfamily-specific binding-signature residues, which explains their
      U20 versus U16 specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural basis for subfamily site specificity; source of the
      signature residues checked in dusA-bioinformatics.
- id: PMID:29294097
  title: 'Unveiling structural and functional divergences of bacterial tRNA dihydrouridine
    synthases: perspectives on the evolution scenario.'
  findings:
  - statement: In E. coli, DusA is the U20/U20a bi-site enzyme, while DusB and DusC
      make D17 and D16.
    supporting_text: DusC and DusB are mono-site specific flavoenzymes involved in
      D16 and D17 biosynthesis, respectively, while DusA is a U20/U20a bi-site specific
      enzyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mass spectrometry of tRNAs from single dus mutants
      defines the site specificity of each subfamily.
- id: PMID:39460624
  title: Differential redox sensitivity of tRNA dihydrouridylation.
  findings:
  - statement: DusA is the most active of the three E. coli Dus enzymes in vivo and
      in vitro, and Dus activity depends on NADPH availability.
    supporting_text: revealing DusA as the most active enzyme, followed by DusB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; EcoCyc's EXP annotations for E. coli DusA cite this paper.
- id: PMID:42080256
  title: The tRNA dihydrouridine synthase DusA has a distinct mechanism in optimizing
    tRNAs for translation.
  findings:
  - statement: E. coli DusA binds tRNA in a two-step mechanism, prefers
      pre-modified tRNA, and improves translation at specific codons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; physiological role of D20/D20a.
- id: PMID:25883135
  title: A novel family of integrases associated with prophages and genomic islands
    integrated within the tRNA-dihydrouridine synthase A (dusA) gene.
  findings:
  - statement: dusA-associated integrases insert genomic islands at the 5' end of
      dusA, and the island supplies a new 5' end for the gene.
    supporting_text: The 5′ portion of the dusA gene affected by the integration is
      replaced by a new 5′ end (white) provided by the GEI
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; explains the strain-specific N-terminus of the KBase
      USDA1810 model, which has an integrase meeting dusA 5'-to-5'.
- id: PMID:35315701
  title: Mining the Flavoproteome of Brucella ovis, the Brucellosis Causing Agent in
    Ovis aries.
  findings:
  - statement: Brucella ovis BOV_RS04255 (dusA; 56.4% identical to the query per the
      KBase dashboard PaperBLAST panel; same
      order) is assigned as a tRNA dihydrouridine20/20a synthase in a curated
      flavoproteome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Comparative assignment, not an assay; cited by PaperBLAST.
- id: PMID:36551188
  title: Evolutionary Diversity of Dus2 Enzymes Reveals Novel Structural and Functional
    Features among Members of the RNA Dihydrouridine Synthases Family.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Uses E. coli DusA as the bacterial reference for the U20-specific
