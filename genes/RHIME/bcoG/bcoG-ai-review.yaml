core_functions:
- description: Condensation of 3-dehydrocarnitine with acetyl-CoA to betainyl-CoA and acetoacetate (EC
    2.3.1.317) in L-carnitine catabolism. Intrinsic activity transfers through the exact sequence bridge;
    a BcoG knockout and native 1021 GBB growth are not established.
