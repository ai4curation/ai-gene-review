  label: Sinorhizobium meliloti 1021
description: >-
  bcoG (SMc01637) encodes the 3-dehydrocarnitine:acetyl-CoA trimethylamine
  transferase of Sinorhizobium meliloti, a beta-keto acid cleavage enzyme
  (BKACE family) and the ortholog of Pseudomonas aeruginosa CdhC. The
  homotetrameric enzyme condenses 3-dehydrocarnitine with acetyl-CoA to form
  betainyl-CoA (N,N,N-trimethylglycyl-CoA) and acetoacetate, the middle step of
  L-carnitine catabolism between the dehydrogenase and betainyl-CoA thioesterase
  activities of the bifunctional BcoE-BcoF protein. Its disruption abolishes
  growth on gamma-butyrobetaine, which S. meliloti converts to carnitine before
  degrading it.
