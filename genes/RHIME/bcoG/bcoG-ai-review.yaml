proposed_new_terms:
  - proposed_name: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
    proposed_definition: >-
      Catalysis of the reaction: 3-dehydrocarnitine + acetyl-CoA =
      N,N,N-trimethylglycyl-CoA + acetoacetate.
    justification: >-
      EC 2.3.1.317 (RHEA:47044) is measured for BcoG and P. aeruginosa CdhC; GO
      has only the unrelated 3-keto-5-aminohexanoate cleavage term for the
      family.
    proposed_parent:
