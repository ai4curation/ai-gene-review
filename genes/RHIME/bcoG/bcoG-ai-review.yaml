  label: Sinorhizobium meliloti 1021
description: BcoG is a beta-keto acid cleavage enzyme of Sinorhizobium meliloti that converts 3-dehydrocarnitine
  and acetyl-CoA to betainyl-CoA and acetoacetate. This reaction connects the carnitine-dehydrogenase
  and betainyl-CoA-hydrolase activities of the fused BcoE-BcoF protein. Purified-enzyme chemistry was
  measured with the 3D0a2 protein, whose sequence matches the strain 1021 reference through Rm2011. Native
  GBB utilization differs between strains, so this catalytic identity does not establish growth of strain
  1021 on GBB.
