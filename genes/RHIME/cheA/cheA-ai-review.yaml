taxon:
  id: NCBITaxon:266834
  label: Sinorhizobium meliloti 1021
description: CheA is the central soluble histidine kinase of the Sinorhizobium meliloti chemotaxis pathway.
  It couples chemoreceptor signaling to ATP-dependent autophosphorylation and phosphotransfer to response
  regulators. In the S. meliloti phosphate-sink circuit, CheA also accepts phosphate back from the motor
  regulator CheY2-P and transfers it to CheY1 for signal termination. CheS associates with CheA and enhances
  CheY1 recruitment. The 1021 protein conserves this kinase architecture; its sequence differs at five
  positions from the deposited RU11/001 protein used to establish the detailed coupling mechanism.
existing_annotations:
- term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
