  review:
    summary: CheA kinase chemistry is supported; the inherited molecular-sensor role needs correction.
    action: MODIFY
    reason: 'QuickGO checked 2026-11-06 confirms GO:0000155 is_a GO:0140299 molecular sensor activity,
      as well as GO:0004673. The sensor parent describes ligand binding with an activity change in response
      to intracellular ligand level. Receptor-controlled histidine phosphorylation is established, but
      the experiments do not establish that sensor activity on CheA itself: chemoreceptors detect the
      stimulus and control CheA through the coupling complex. The child definition alone had obscured
      this inherited requirement. Retain the demonstrated kinase chemistry as GO:0004673 and the receptor-controlled
      phosphorelay in the process/core description; ask GO to resolve the term-scope mismatch rather than
      asserting an experimentally disproven kinase or a wrong PAINT node. PMID:9485379 establishes the
      kinase and forward/reverse phosphotransfer in the RU lineage. The current 1021 record differs at
      five positions from deposited RU11/001 CheA; the qualitative role is inferred from the ortholog
      and conserved architecture, without transferring quantitative RU measurements.'
    supported_by:
    - &id001
      reference_id: PMID:9485379
      supporting_text: Phosphorylation of CheY1 and CheY2 by the central ATP-dependent autokinase, CheA,
        is the crucial step in signal transduction.
    - &id002
      reference_id: file:RHIME/cheA/cheA-source-analysis/identity-summary.md
      supporting_text: 'The current 1021 CheA Q52880 differs from RU11001 AAA86674.1 at five of 758 positions:
        current/reference D189E, S192A, N215D, E297K, S308P.'
    proposed_replacement_terms:
    - id: GO:0004673
      label: protein histidine kinase activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      asserted_value: GO:0000155
      corrected_value: GO:0004673
      requested_change: CHECK
      confidence: SUSPECTED
      explanation: The molecular-sensor is_a parent adds a role not demonstrated on receptor-coupled CheA.
        Check whether the kinase should carry GO:0004673 or the ontology needs a revised scope; the catalytic
        evidence itself remains valid.
