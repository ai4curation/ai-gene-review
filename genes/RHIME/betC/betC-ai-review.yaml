- term:
    id: GO:0042425
    label: choline biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00290
  review:
    summary: BetC forms choline from choline-O-sulfate, feeding glycine betaine synthesis; retained as non-core process context.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO defines choline biosynthetic process as "The chemical reactions and
      pathways resulting in the formation of choline", and BetC hydrolysis of
      choline-O-sulfate does form choline, which S. meliloti then converts to
      glycine betaine. This is a release (desulfation) step from an exogenous
      sulfate ester rather than de novo choline synthesis, and GO has no
      specific choline-O-sulfate catabolic process term, so the UniPathway
      mapping is as precise as the ontology allows. The process is retained as
      non-core because the core claim is the hydrolase activity itself.
    supported_by:
    - reference_id: PMID:9736747
