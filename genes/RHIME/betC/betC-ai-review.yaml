core_functions:
- description: >-
    Formylglycine-dependent class I sulfatase that hydrolyzes choline-O-sulfate
    to choline and sulfate, supplying choline for glycine betaine synthesis and
    allowing choline-O-sulfate use as a carbon, nitrogen and sulfur source.
  molecular_function:
    id: GO:0047753
    label: choline-sulfatase activity
  supported_by:
  - reference_id: PMID:9736747
    supporting_text: Choline sulfatase activity was absent from betC but not from betB mutants
  - reference_id: PMID:29458126
    supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the hydrolysis of alkyl sulfate choline-O-sulfate
proposed_new_terms:
- proposed_name: choline-O-sulfate catabolic process
  proposed_definition: >-
    The chemical reactions and pathways resulting in the breakdown of
    choline-O-sulfate (choline sulfate), typically by hydrolysis of its sulfate
    ester bond to choline and inorganic sulfate.
  justification: >-
    BetC hydrolysis of choline-O-sulfate is currently captured only by
    GO:0042425 choline biosynthetic process (via UniPathway), which describes
    formation of choline rather than breakdown of an exogenous sulfate ester
    that S. meliloti uses as a carbon, nitrogen and sulfur source. No GO
    process term names choline-O-sulfate. Choline-O-sulfate contains sulfur,
    so GO:0044273 sulfur compound catabolic process ("The chemical reactions
    and pathways resulting in the breakdown of compounds that contain sulfur")
    is the natural parent.
  proposed_parent:
    id: GO:0044273
    label: sulfur compound catabolic process
  supported_by:
  - reference_id: PMID:9736747
    supporting_text: S. meliloti also can use this compound as the sole carbon, nitrogen, and sulfur source for growth and that depends on a functional bet locus.
suggested_questions:
- question: Is the phosphorylcholine hydrolysis reported for BetC physiologically relevant in S. meliloti, or only an in vitro consequence of alkaline phosphatase superfamily promiscuity?
- question: Which transporter imports choline-O-sulfate into S. meliloti for BetC hydrolysis?
suggested_experiments:
- description: Compare choline-O-sulfate and phosphorylcholine utilization and intracellular glycine betaine in a clean betC deletion complemented with wild-type BetC or a Glu386 substitution, to test whether quaternary-ammonium recognition is needed in vivo.
