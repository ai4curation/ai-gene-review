- id: PMID:35503214
  title: Structural insights into choline-O-sulfatase reveal the molecular determinants for ligand
    binding.
  findings:
  - statement: The ligand-bound structural study uses CECT 4857 enzyme, not an unqualified direct
      1021 strain assay.
    supporting_text: The sequence corresponding to choline sulfatase from S. meliloti CECT 4857 was
      deposited in GenBank (accession No. MH208481).
    reference_section_type: METHODS
  - statement: Ligand-bound structures favor an aromatic binding environment and challenge the
      earlier proposed role of residue 386 in direct quaternary-ammonium recognition; residue naming
      varies within the article, so no target residue correction is inferred.
    supporting_text: Contrary to the previous hypothesis, we confirm the general ligand-binding
      strategy observed for other choline-binding proteins, in which Trp129 and His145 belonging to
      a conserved β-hairpin are responsible for ligand accommodation.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Source is CECT 4857, sequence MH208481, compared to GR4 with
      F105L. E. coli expression and C54 variants are recombinant constructs. This is comparative
      structural evidence, not native 1021 flux or proof that every PDB-linked sequence equals the
      canonical record. Text alternates Asp386 and Glu386; preserve that source limitation rather
      than silently changing target identity.
