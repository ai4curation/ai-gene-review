  label: Sinorhizobium meliloti 1021
description: >-
  BetC (SmCS) is a soluble, formylglycine-dependent choline sulfatase of Sinorhizobium meliloti 1021.
  It hydrolyzes choline-O-sulfate to choline and inorganic sulfate. Purified recombinant 1021 enzyme strongly
  favors choline-O-sulfate over phosphorylcholine and the artificial substrate 4-nitrophenyl sulfate;
  these secondary in vitro reactions do not establish physiological phosphate-ester metabolism. Its buried
  active site contains a nucleophile derived from Cys54 and a divalent metal ion. In the related 102F34
  strain, bet-locus genetics link choline-O-sulfate utilization to nutrient acquisition and conversion
  of released choline into the osmoprotectant glycine betaine.
