  label: Sinorhizobium meliloti 1021
description: >-
  BetC (SmCS) is the choline sulfatase of the Sinorhizobium meliloti betICBA
  operon, a class I (formylglycine-dependent) sulfatase of the alkaline
  phosphatase superfamily that hydrolyzes choline-O-sulfate to choline and
  inorganic sulfate. Genetics show that it is required for choline sulfatase
  activity, and the choline it releases is oxidized by BetA and BetB to the
  osmoprotectant glycine betaine; choline-O-sulfate can also serve as a sole
  carbon, nitrogen and sulfur source through the bet locus. The purified enzyme
  is highly efficient with choline-O-sulfate, hydrolyzes 4-nitrophenyl sulfate
  far more slowly and shows promiscuous phosphoesterase activity. Its crystal
  structure shows a buried active site in which a formylglycine nucleophile
  derived from Cys54, a divalent metal ion and Glu386 (which recognizes the
  quaternary ammonium group) bind the substrate.
