- description: >-
    Formylglycine-dependent choline sulfatase that forms choline and sulfate from choline-O-sulfate. The
    1021 recombinant protein is directly characterized; nutrient acquisition and downstream glycine-betaine
    osmoprotection are supported by native 102F34R genetics.
