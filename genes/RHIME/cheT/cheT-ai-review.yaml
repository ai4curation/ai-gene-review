references:
- id: PMID:39081077
  title: The dual role of a novel Sinorhizobium meliloti chemotaxis protein CheT in signal termination
    and adaptation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full text read from Wiley. Figure1 identifies NP_384751.1, which exactly matches 1021
      Q92S03. Methods and Table1 identify RU11/001 experimental strains and plasmids but do not establish
      complete identity of the assayed CheT insert to 1021. IC is therefore used. CheR complex formation
      is real, but no reciprocal enzymatic regulation was detected; adaptation coupling remains hypothetical.
- id: file:RHIME/cheA/cheA-source-analysis/identity-summary.md
