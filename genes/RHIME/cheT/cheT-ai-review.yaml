id: Q92S03
gene_symbol: cheT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:266834
  label: Sinorhizobium meliloti 1021
description: CheT is a small chemotaxis protein predicted to function as a CheY1-P phosphatase in Sinorhizobium
  meliloti 1021. The corresponding protein studied in RU11/001 accelerates dephosphorylation of the phosphate-sink
  response regulator CheY1-P, with no detected effect on the motor regulator CheY2-P. CheT contains a
  conserved DXXXQ motif associated with this activity. It also forms a complex with CheR, although the
  proposed connection between signal termination and receptor adaptation remains mechanistically unresolved.
existing_annotations:
- term: &id003
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  evidence_type: IC
  original_reference_id: PMID:39081077
  review:
    summary: The paper-linked 1021 CheT ortholog is inferred to dephosphorylate CheY1-P.
    action: NEW
    reason: PMID39081077 directly measures enhanced CheY1-P decay and tests the DXXXQ motif, with no enhancement
      of CheY2-P decay. Q92S03 exactly matches NP_384751.1, the 1021 sequence used in Figure1, but the
      experimental RU11/001 construct sequence is not independently deposited in the main text. Therefore
      this is an explicit ortholog inference, not IDA on 1021. Phosphoprotein phosphatase describes the
      reaction; serine/threonine or histidine specificity would be false. No existing term covers this
      previously unannotated record.
    supported_by:
    - &id001
      reference_id: PMID:39081077
      supporting_text: Phosphorylation assays demonstrated that CheT dephosphorylates the phosphate-sink
        response regulator, CheY1~P by enhancing its decay two-fold but does not affect the motor response
        regulator CheY2~P.
    - &id002
      reference_id: file:RHIME/cheA/cheA-source-analysis/identity-summary.md
      supporting_text: Its complete 124-aa sequence exactly matches current Q92S03. This proves identity
        to the paper's alignment reference, not identity of the RU11/001 experimental construct.
- term: &id004
    id: GO:0006935
    label: chemotaxis
  evidence_type: IC
  original_reference_id: PMID:39081077
  review:
    summary: CheT contributes enzymatically to termination of chemotaxis signaling.
    action: NEW
    reason: CheT itself catalyzes phosphate removal from CheY1-P, rather than merely being required for
      movement. This reaction drains the sink that resets the CheY2 signal. Inference to 1021 is based
      on the Figure1 NP_384751.1/Q92S03 sequence bridge, not a claim that RU is 1021. GO:0006935 is under
      taxis and chemical response; no other proposed BP is its ancestor or descendant. Same-role phosphatase
      comparators E. coli CheZ P0A9H9 and B. subtilis CheC P40403 both carry chemotaxis, while the actual
      substrate selectivity here comes from the CheT assay. No target entry was found in the GO-CAM index.
      CheR binding alone does not justify a separate sensory-adaptation annotation.
    supported_by:
    - *id001
    - *id002
core_functions:
- description: Predicted CheY1-P phosphatase of the 1021 chemotaxis phosphate sink, inferred from the paper-linked
    reference sequence and RU11/001 enzymology; CheY2-P is not the demonstrated substrate.
