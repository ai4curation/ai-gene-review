      The domain docks the cellular E2 enzymes UbcH5A to UbcH5C and UbcH13 on the
      surface equivalent to that used by classical cellular RING domains,
      suggesting K3 may catalyse Lys63-linked ubiquitination.
    supporting_text: >-
      found to interact with the cellular ubiquitin-conjugating enzymes UbcH5A to -C
    reference_section_type: ABSTRACT
  reference_review:
