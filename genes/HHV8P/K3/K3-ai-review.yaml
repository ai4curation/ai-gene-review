- id: PMID:10799607
  title: Downregulation of major histocompatibility complex class I molecules by Kaposi's
    sarcoma-associated herpesvirus K3 and K5 proteins.
  findings:
  - statement: >-
      K3 downregulates all four HLA allotypes tested (HLA-A2, HLA-B2705, HLA-Cw4
      and HLA-E), whereas K5 spares HLA-E and acts only weakly on HLA-C; the
      allotype selectivity maps in part to the transmembrane regions.
    supporting_text: >-
      A dramatic downregulation of HLA-A2, HLA-B2705, HLA-Cw4, and HLA-E was
      observed in the K3-expressing GFP-positive cell population
    reference_section_type: RESULTS
  - statement: >-
      Antibody-internalisation microscopy shows K3 accelerates endocytosis of
      class I: internalisation is evident within 30 min and nearly complete by 60
      min, against roughly 120 min in control cells, while transferrin receptor
      endocytosis is unchanged.
    supporting_text: >-
      K3-expressing cells exhibited a rapid endocytosis of class I molecules
    reference_section_type: RESULTS
  - statement: >-
      Confocal immunofluorescence places K3 near the host plasma membrane, with
      little or no overlap with a Golgi marker.
    supporting_text: >-
      cross sections of transfected cells demonstrated that K3 and K5 were
      localized near the plasma membrane
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ishido et al., J Virol 2000). Full text cached. One of the
      two founding papers for K3's MHC class I activity, and the experimental
      basis for UniProt's host cell membrane location.
- id: PMID:10859362
  title: Kaposi's sarcoma-associated herpesvirus encodes two proteins that block cell
    surface display of MHC class I chains by enhancing their endocytosis.
  findings:
  - statement: >-
      K3 and K5 do not retain class I in the ER or block its assembly or export;
      they accelerate endocytosis from the surface and route internalised chains
      to endolysosomal vesicles for degradation.
    supporting_text: >-
      they act to enhance endocytosis of MHC I from the cell surface;
      internalized class I chains are delivered to endolysosomal vesicles, where
      they undergo degradation
    reference_section_type: ABSTRACT
  - statement: >-
      Colocalisation with KDEL-GFP and with endogenous calnexin, and absence of
      overlap with later-compartment markers, places the steady-state bulk of K3
      in the host endoplasmic reticulum.
    supporting_text: >-
      Thus, at steady state the bulk of the K3 and K5 chains are localized within the ER
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Coscoy and Ganem, PNAS 2000). Full text cached. The
      companion founding paper to PMID:10799607 and the experimental basis for
      UniProt's host endoplasmic reticulum location. Note that its localisation
      result (ER) and that of PMID:10799607 (near the plasma membrane) are
      complementary rather than contradictory, reflecting the resident pool and
      the site of action.
- id: PMID:11756476
  title: A novel class of herpesvirus-encoded membrane-bound E3 ubiquitin ligases regulates
    endocytosis of proteins involved in immune recognition.
  findings:
  - statement: >-
      MIR1 (K3) and MIR2 (K5) expression causes ubiquitination of endogenous MHC
      class I chains, and the activity requires the N-terminal Zn finger; the
      paper defines the MARCH class of membrane-bound E3 ligases.
    supporting_text: >-
      cells expressing either MIR1 or MIR2 display ubiquitination of their
      endogenous MHC-I chains
    reference_section_type: RESULTS
  - statement: >-
      The N-terminal cytosolic Zn finger, then classified as PHD/LAP, is
      essential for MHC class I downregulation, as is a second element in the
      C-terminal cytosolic domain.
    supporting_text: >-
      The NH2-terminal region of both proteins harbors a Zn finger of the PHD/LAP subfamily
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Coscoy, Sanchez and Ganem, J Cell Biol 2001). Full text
      cached. The in vitro E1/E2/E3 reconstitution in this paper is done with
      MIR2, not MIR1, but the MHC class I ubiquitination result (Fig. 4) covers
      both proteins explicitly, so it is cited here only for the MIR1 claims.
- id: PMID:12006494
  title: Ubiquitylation of MHC class I by the K3 viral protein signals internalization
    and TSG101-dependent degradation.
  findings:
  - statement: >-
      K3 associates with MHC class I and ubiquitylates it after ER export; the
      mark is the internalisation signal at the plasma membrane and routes class
      I into the TSG101-dependent late endosomal pathway for degradation.
    supporting_text: >-
      promotes ubiquitylation of class I after export from the endoplasmic reticulum.
    reference_section_type: ABSTRACT
  - statement: >-
      The ubiquitin mark on class I is the signal for its internalisation at the
      plasma membrane; UniProt additionally records from this paper that mutating
      the conserved Trp41 of the RING-CH domain abolishes ubiquitination activity
      and class I degradation.
    supporting_text: >-
      signal for class I internalization at the plasma membrane
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
