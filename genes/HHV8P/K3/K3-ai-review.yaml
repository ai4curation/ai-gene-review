      PubMed-verified (Dodd et al., JBC 2004). Cache is abstract-only (no PMC
      record), but the structural conclusion is independently represented in the
      UniProt record as PDB 1VYX and the RING-CH-type zinc finger feature.
- id: PMID:15994556
  title: Ubiquitination on nonlysine residues by a viral E3 ubiquitin ligase.
  findings:
  - statement: >-
      MIR1 (K3), but not MIR2 (K5), downregulates MHC class I molecules whose
      intracytoplasmic domain lacks lysines; this requires a cysteine in the tail
      and the ubiquitin linkage is beta-mercaptoethanol-sensitive, establishing
      non-lysine ubiquitination.
    supporting_text: >-
      ubiquitination required a cysteine residue in the intracytoplasmic tail of MHC I
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Cadwell and Coscoy, Science 2005). Cache is abstract-only
      (no PMC record). This is the paper behind UniProt's EC 2.3.2.36 assignment
      and its cysteine-to-cysteine reaction, and it is a case where the paralog
      distinction runs in K3's favour - the non-lysine activity is specific to
      MIR1.
- id: PMID:16339411
  title: Herpesviral protein networks and their interaction with the human proteome.
  findings:
  - statement: >-
      Comprehensive intraviral yeast two-hybrid screens of KSHV and VZV reported
      123 and 173 interactions respectively; the two K3 interactions annotated
      from this work (with P88941 and P88951) are network-level hits with no
      functional follow-up.
    supporting_text: >-
      The comprehensive yeast two-hybrid analysis of intraviral protein interactions
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Uetz et al., Science 2006). Cache is abstract-only. The
      citation is correct and the interactions are presumably real Y2H hits, but
      the paper supports only bare protein binding for K3 - both partners are
      KSHV proteins (an uncharacterised 110-aa product and the ribonucleotide
      reductase small subunit RIR2), neither a known K3 substrate - so it informs
      nothing about K3's function.
- id: PMID:17166914
  title: Downregulation of gamma interferon receptor 1 by Kaposi's sarcoma-associated
    herpesvirus K3 and K5.
  findings:
  - statement: >-
      K3 and K5 both specifically target IFNGR1 for ubiquitination, endocytosis
      and degradation, lowering its surface expression; K5 does so more strongly
      than K3.
    supporting_text: >-
      K3 and K5 both specifically target IFN-γR1 and induce its ubiquitination,
      endocytosis, and degradation, resulting in downregulation of IFN-γR1
      surface expression
    reference_section_type: ABSTRACT
  - statement: >-
      The functional consequence is proximal: IFN-gamma-induced STAT1 Tyr701
      phosphorylation is markedly reduced in K3-expressing BJAB cells while total
      STAT1 is unchanged.
    supporting_text: >-
      tyrosine-phosphorylated STAT1 (pY701-STAT1) was markedly reduced in
      BJAB-K3 and BJAB-K5 cells
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Li, Means, Lang and Jung, J Virol 2006). Full text cached.
      Fetched for this review because it decides the interferon rows: the pathway
      K3 is shown to block is type II (IFN-gamma), not type I, which is where the
      KW-1114 mapping had placed it. The mutational dissection in this paper is
      done on K5, but the IFNGR1 downregulation and STAT1 results cover K3
      directly.
- id: PMID:23460925
  title: Kaposi's sarcoma-associated herpesvirus K3 and K5 proteins down regulate both
    DC-SIGN and DC-SIGNR.
  findings:
  - statement: >-
      Exogenously expressed wild-type K3 lowers surface DC-SIGN and DC-SIGNR by
      about 60% in 293 stable lines, and mutating the RING-CH zinc ligands
      abolishes the effect (Fig. 2).
    supporting_text: >-
      both K3 and K5 caused a reduction in surface expression of both DC-SIGN and
      DC-SIGNR by approximately 60%
    reference_section_type: RESULTS
  - statement: >-
      The same experiment records K3's effect on endogenous MHC class I: surface
      levels fall about 80-90% with wild-type K3 and only 20-30% with the RING-CH
      mutant.
    supporting_text: >-
      In the presence of wild-type K3 or K5, surface levels of MHC I were reduced
      about 80–90%.
    reference_section_type: RESULTS
  - statement: >-
      DC-SIGN is ubiquitylated only in the presence of RING-CH-intact K3, and its
      degradation runs primarily through a ubiquitylation-dependent proteasomal
      route with a lysosomal fraction (Fig. 7A, 7B).
    supporting_text: >-
      We confirmed that DC-SIGN displayed ubiquitylation only in the presence of
      K3 or K5 with an intact RING-CH domain and not in the presence K3 mZn or K5
      mZn.
    reference_section_type: RESULTS
  - statement: >-
      Dynasore washout shows K3 accelerates endocytosis of DC-SIGN but not of
      DC-SIGNR, and the tyrosine-based endocytosis motif is required in addition
      to the RING-CH domain (Fig. 4).
    supporting_text: >-
      K3 expression also caused increased endocytosis of DC-SIGN relative to
      vector expressing cells
    reference_section_type: RESULTS
  - statement: >-
      In the context of infection the activity is K5's: viruses carrying a
      functional K5 gene downregulate DC-SIGN, DC-SIGNR and MHC class I, whereas
      the K5-deleted and doubly deleted viruses only weakly do so.
    supporting_text: >-
      Each of the viruses encoding a functional K5 gene (wt and ΔK3) showed
      significant down regulation of DC-SIGN, DC-SIGNR and MHC I from the cell
      surface.
    reference_section_type: RESULTS
  - statement: >-
      The entry-enhancing co-receptor role belongs to the host lectins and was
      measured with virus deleted for both K3 and K5 (Fig. 1), so it is not an
      activity of K3.
    supporting_text: >-
      It has been documented that DC-SIGN can act a co-receptor for KSHV, not
      sufficient for entry by itself, but capable of enhancing viral infectivity
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Lang et al., PLoS ONE 2013). Full text cached. This is the
      sole reference behind all four CACAO rows on K3. Verified that it assays K3
      in its own right and not only its paralog: every figure from Fig. 2 onward
      includes K3 wild-type plus its own mZn, Y/A, Y/F, P/A and DE12 mutants, so
      the K3 annotations are not mis-attributed K5 data. The caveat is scope, not
      identity - K3's lectin activity is shown in exogenous expression, and K5
      dominates during infection. The GONUTS wiki page that would record the
      student curators' own evidence statements was offline when this review was
      made.
- id: PMID:24899205
  title: Kaposi's sarcoma-associated herpesvirus K3 and K5 ubiquitin E3 ligases have
    stage-specific immune evasion roles during lytic replication.
  findings:
  - statement: >-
      Using the RGB-BAC16 reporter virus and K3/K5 locus-swap recombinants, K3
      and K5 are shown to act sequentially rather than redundantly: K5 immediately
      on entry into the lytic phase and K3 during later stages of lytic
      replication.
    supporting_text: >-
      while K5 acts immediately upon entry into the lytic phase, K3-mediated
      downregulation of MHC-I was evident during later stages of lytic
      replication
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Brulois et al., J Virol 2014). Full text cached. Fetched
      for this review because it is the only study that establishes a role for K3
      inside the intact virus, which is what lets the MHC class I activity be
      called core despite the K3-deletion phenotype being mild in other systems.
