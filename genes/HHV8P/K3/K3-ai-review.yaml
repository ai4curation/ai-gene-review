- term:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1090
  review:
    summary: >-
      Supported - K3 destroys IFNGR1 and the innate C-type lectins DC-SIGN and
      DC-SIGNR - but peripheral to the MHC class I activity that defines the
      protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim holds on two independent lines: K3 induces IFNGR1
      ubiquitination, endocytosis and degradation with a measurable loss of
      IFN-gamma-driven STAT1 phosphorylation (PMID:17166914), and it
      ubiquitylates and degrades the dendritic-cell lectins DC-SIGN and DC-SIGNR
      (PMID:23460925). The term is as precise as the keyword allows and is not
      entailed by the interferon-signalling terms, which sit under signal
      transduction rather than under innate immune response, so it is retained
      rather than called too general. It is non-core because K3's dominant,
      best-replicated activity in the intact virus is MHC class I removal
      (PMID:24899205), and because the lectin arm is an exogenous-expression
      result that K5 dominates during infection.
    supported_by:
