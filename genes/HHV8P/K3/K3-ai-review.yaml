- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1114
  review:
    summary: >-
      The interferon pathway K3 is actually shown to block is type II
      (IFN-gamma), via degradation of IFNGR1; no evidence places K3 on the type
      I (IFNAR) pathway.
    action: MODIFY
    reason: >-
      KW-1114 ("Inhibition of host interferon signaling pathway by virus") is
      type-agnostic, but its GO mapping lands on the type I child. The only
      interferon target documented for K3 is IFNGR1: Li et al. showed that K3
      and K5 induce IFNGR1 ubiquitination, endocytosis and degradation and that
      IFN-gamma-driven STAT1 Tyr701 phosphorylation is markedly reduced in
      K3-expressing BJAB cells (PMID:17166914). That is the type II pathway, and
      GO:0140884 is the sibling term for it. This is a lateral correction within
      the interferon branch rather than a refinement, and it is the same
      replacement proposed for the GO:0140886 row below so that the two
      keyword-derived interferon rows agree. Nothing in the literature reviewed
      here tests K3 against IFN-alpha/beta receptor signalling, so asserting the
      type I term overstates the evidence.
    proposed_replacement_terms:
    - id: GO:0140884
      label: symbiont-mediated suppression of host type II interferon-mediated signaling
        pathway
    supported_by:
    - reference_id: PMID:17166914
      supporting_text: >-
        K3 and K5 both specifically target IFN-γR1 and induce its
        ubiquitination, endocytosis, and degradation, resulting in
        downregulation of IFN-γR1 surface expression
    - reference_id: PMID:17166914
      supporting_text: >-
        tyrosine-phosphorylated STAT1 (pY701-STAT1) was markedly reduced in
        BJAB-K3 and BJAB-K5 cells
    additional_reference_ids:
    - PMID:17166914
- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089256
  review:
    summary: >-
      Correct, but the specific mechanism - removal of surface MHC class I - has
      its own term, GO:0046776, which the evidence supports.
    action: MODIFY
    reason: >-
      The adaptive-immune suppression K3 effects is antigen presentation via MHC
      class I: K3 downregulates all four HLA allotypes tested (PMID:10799607),
      ubiquitylates class I and signals its internalisation and
      TSG101-dependent degradation (PMID:12006494), and does so during lytic
      replication in the intact virus (PMID:24899205). GO:0046776 is an
      is_a descendant of GO:0039588, itself a child of GO:0039504, so this is a
      refinement to the term the evidence actually supports. The same
      replacement is proposed for the CACAO IMP row on this term so that the two
      rows agree.
    proposed_replacement_terms:
    - id: GO:0046776
      label: symbiont-mediated suppression of host antigen processing and presentation
        of peptide antigen via MHC class I
    supported_by:
    - reference_id: PMID:10799607
      supporting_text: >-
        K3 downregulated all four HLA allotypes
    - reference_id: PMID:12006494
      supporting_text: >-
        promotes ubiquitylation of class I after export from the endoplasmic reticulum.
    additional_reference_ids:
    - PMID:10799607
    - PMID:12006494
- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IMP
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The cited paper does assay K3's effect on host antigen
      presentation, but the readout is MHC class I surface loss, for which GO
      has the specific child term GO:0046776.
    action: MODIFY
    reason: >-
      CACAO, assigned 2013-03-26, IMP from PMID:23460925. What the paper shows
      for K3: in Fig. 2 and Fig. 3, 293 cells transfected with GFP-K3 wild-type
      and with the mZn, Y/A, Y/F, P/A and DE12 mutants were stained for
      endogenous MHC class I alongside the lectins, and wild-type K3 reduced
      surface MHC class I by about 80-90% while the RING-CH mutant reduced it by
      only 20-30% - a mutant-based experiment, so IMP is the right code. The
      CACAO term is therefore true of K3 and the paper is the right paper, but
      it is one level too shallow: the specific process assayed is the
      suppression of antigen processing and presentation via MHC class I
      (GO:0046776), an is_a descendant via GO:0039588. The paper's other K3
      targets, the C-type lectins DC-SIGN and DC-SIGNR, are innate pattern
      receptors rather than adaptive effectors, so they do not themselves
      sustain the adaptive-immunity framing. Note the scope caveat the authors
      themselves record: in the recombinant-virus arm K5 is dominant and K3 acts
      only weakly, so the K3 lectin phenotype is an exogenous-expression result.
      MHC class I downregulation by K3, by contrast, is corroborated in the
      intact virus (PMID:24899205).
    proposed_replacement_terms:
    - id: GO:0046776
      label: symbiont-mediated suppression of host antigen processing and presentation
        of peptide antigen via MHC class I
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: >-
        In the presence of wild-type K3 or K5, surface levels of MHC I were
        reduced about 80–90%.
    - reference_id: PMID:24899205
      supporting_text: >-
        while K5 acts immediately upon entry into the lytic phase, K3-mediated
        downregulation of MHC-I was evident during later stages of lytic
        replication
    additional_reference_ids:
    - PMID:24899205
    - PMID:12006494
- term:
    id: GO:0039648
    label: symbiont-mediated perturbation of host ubiquitin-like protein modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089028
  review:
    summary: >-
      Same claim as the CACAO IMP row on this term: a viral E3 that ubiquitinates
      host proteins alters host ubiquitin modification by definition.
    action: ACCEPT
    reason: >-
      The ARBA rule is not the basis of the claim. K3 is a virus-encoded E3 whose
      substrates are host membrane proteins - endogenous MHC class I
      (PMID:11756476), class I after ER export (PMID:12006494), DC-SIGN
      (PMID:23460925) and IFNGR1 (PMID:17166914) - which is precisely what
      GO:0039648 describes, namely a symbiont altering ubiquitin-like protein
      modification of host target proteins. The action matches the CACAO row on
      the same term.
    supported_by:
    - reference_id: PMID:11756476
      supporting_text: >-
        cells expressing either MIR1 or MIR2 display ubiquitination of their
        endogenous MHC-I chains
    - reference_id: PMID:17166914
      supporting_text: >-
        K3 and K5 both specifically target IFN-γR1 and induce its
        ubiquitination, endocytosis, and degradation, resulting in
        downregulation of IFN-γR1 surface expression
- term:
    id: GO:0039648
    label: symbiont-mediated perturbation of host ubiquitin-like protein modification
  evidence_type: IMP
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, well supported: the paper shows RING-CH-dependent ubiquitylation
      of the host lectins DC-SIGN and DC-SIGNR by K3.
    action: ACCEPT
    reason: >-
      CACAO, assigned 2013-03-09, IMP from PMID:23460925. What the paper shows
      for K3: Fig. 7A is an HA-ubiquitin co-transfection in which DC-SIGN is
      ubiquitylated with wild-type K3 but not with the RING-CH mutant K3 mZn, and
      DC-SIGNR shows the same RING-CH dependence at a lower level; Fig. 2 and
      Fig. 3 extend the mutant series (mZn, Y/A, Y/F, P/A, DE12), which is what
      makes IMP rather than IDA the fitting code. The host lectins are host
      proteins and the modification is ubiquitin, so the CACAO term is an exact
      match for the assay at the right granularity. Right protein, right assay,
      right term, correct evidence code. The one caveat, which the authors state,
      is that this activity was demonstrated by exogenous expression; in the
      context of infection K5 dominates.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: >-
        We confirmed that DC-SIGN displayed ubiquitylation only in the presence
        of K3 or K5 with an intact RING-CH domain and not in the presence K3 mZn
        or K5 mZn.
    - reference_id: PMID:23460925
      supporting_text: >-
        Pull-down of GST-tagged proteins followed by WB showed that both DC-SIGN
        and DC-SIGNR co-precipitated with both K3 and K5
- term:
