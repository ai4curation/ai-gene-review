  - reference_id: PMID:10859362
    supporting_text: >-
      they act to enhance endocytosis of MHC I from the cell surface;
      internalized class I chains are delivered to endolysosomal vesicles, where
      they undergo degradation
  - reference_id: PMID:24899205
    supporting_text: >-
      while K5 acts immediately upon entry into the lytic phase, K3-mediated
      downregulation of MHC-I was evident during later stages of lytic
      replication
- description: >-
    Extends the same mechanism to cytokine and pattern receptors, degrading the
    gamma interferon receptor IFNGR1 so that IFN-gamma-driven STAT1 activation is
    blunted, and ubiquitylating the dendritic-cell C-type lectins DC-SIGN and
    DC-SIGNR for proteasomal and lysosomal degradation. This arm is secondary:
    the lectin activity is demonstrated by exogenous expression and is dominated
    by the paralog K5 in the context of infection.
