- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Lang et al. show directly that K3 ubiquitylates DC-SIGN and
      drives its ubiquitylation-dependent degradation, which is exactly what
      this term describes.
    action: ACCEPT
    reason: >-
      CACAO, assigned 2013-03-26, IDA from PMID:23460925. What the paper shows
      for K3: Fig. 7A, an HA-ubiquitin pull-down in which DC-SIGN is
      ubiquitylated only with RING-CH-intact K3 and not with the K3 mZn mutant;
      Fig. 7B, the same assay under MG132 and chloroquine, concluding that
      degradation runs primarily through a ubiquitylation-dependent proteasomal
      route with a lysosomal fraction; and Fig. 5A, a western blot showing that
      wild-type but not mZn K3 lowers total DC-SIGN and DC-SIGNR protein. The
      CACAO term matches that assay exactly, at the right granularity: K3's
      substrates are routed both to the proteasome and, for MHC class I, to the
      late endosome/lysosome (PMID:12006494, PMID:10859362), so the parent term
      is preferable to the proteasome-specific child GO:0043161. K3 performs the
      step that commits the substrate to this catabolic route (it is the E3 that
      attaches the degron), which is the participation GO intends for an E3
      ligase here. This is independently corroborated for MHC class I by
      PMID:11756476 and PMID:12006494. Right protein, right assay, right term,
      correct evidence code.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: >-
        We confirmed that DC-SIGN displayed ubiquitylation only in the presence
        of K3 or K5 with an intact RING-CH domain and not in the presence K3 mZn
        or K5 mZn.
    - reference_id: PMID:23460925
      supporting_text: >-
        These results indicate that degradation of DC-SIGN occurs primarily
        through a ubiquitylation-dependent, proteasomal mechanism
    - reference_id: PMID:23460925
      supporting_text: >-
        expression of either wild-type K3 or K5 resulted in decreased protein
        levels of both DC-SIGN and DC-SIGNR
    additional_reference_ids:
    - PMID:12006494
