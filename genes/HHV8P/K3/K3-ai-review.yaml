    label: HLA-A (human MHC class I heavy chain)
  - id: UniProtKB:P15260
    label: IFNGR1 (human interferon gamma receptor 1)
  - id: UniProtKB:Q9NNX6
    label: CD209 / DC-SIGN
  - id: UniProtKB:Q9H2X3
    label: CLEC4M / DC-SIGNR
  - id: UniProtKB:P15813
    label: CD1D
  supported_by:
  - reference_id: PMID:15465811
    supporting_text: >-
      found to interact with the cellular ubiquitin-conjugating enzymes UbcH5A to -C
  - reference_id: PMID:15994556
    supporting_text: >-
      ubiquitination required a cysteine residue in the intracytoplasmic tail of MHC I
  - reference_id: PMID:11756476
    supporting_text: >-
      cells expressing either MIR1 or MIR2 display ubiquitination of their
      endogenous MHC-I chains
- description: >-
    Uses that ligase activity to strip MHC class I from the surface of the
    infected cell: K3 ubiquitylates class I heavy chains after their export from
    the ER, the mark triggers internalisation at the plasma membrane and sorting
    into the TSG101-dependent late endocytic pathway, and the chains are
    degraded - so the infected cell can no longer present viral peptide to
    cytotoxic T lymphocytes. K3 acts on all of HLA-A, -B, -C and -E, and in the
    intact virus it carries this out during the later stages of lytic
    replication.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0046776
    label: symbiont-mediated suppression of host antigen processing and presentation
