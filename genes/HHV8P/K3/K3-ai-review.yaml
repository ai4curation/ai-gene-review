suggested_questions:
- question: >-
    Does K3 contribute measurably to DC-SIGN and DC-SIGNR downregulation in a
    natural infection, or only on exogenous overexpression? The recombinant-virus
    arm of PMID:23460925 shows K5 doing essentially all the work, and the answer
    determines whether the lectin arm belongs in K3's core function at all.
- question: >-
    Why does K3 drive endocytosis of DC-SIGN but not of DC-SIGNR, when it
    ubiquitylates and degrades both? Distinguishing a different ubiquitin-chain
    linkage from a different trafficking itinerary would say whether K3 writes one
    signal that the two lectins read differently.
- question: >-
    Given that the RING-CH domain docks UbcH13, does K3 build Lys63-linked chains
    on its substrates in cells, and is the endosomal-sorting fate of MHC class I a
    consequence of chain type rather than of substrate identity?
- question: >-
    Is K3 ever present at the plasma membrane in sufficient amount to act there,
    or does it modify substrates during a transient surface encounter? Its
    steady-state bulk is in the ER, it does not colocalise with internalised MHC
    class I, and it engages the lectins as immature, pre-Golgi forms.
- question: >-
    Does cysteine ubiquitination contribute to K3's activity against substrates
    other than MHC class I - for example IFNGR1 or the C-type lectins - or is the
    non-lysine route specific to the class I tail?
suggested_experiments:
- description: >-
    Complement the Bac16 double-deletion recombinant with K3 alone at the K5
    genomic locus (the construct already described in PMID:24899205, which raises
    K3 expression) and measure surface DC-SIGN and DC-SIGNR in infected THP-1 or
    primary monocyte-derived dendritic cells, to establish whether the K3 lectin
    activity is real at native expression levels or an artefact of
    overexpression.
- description: >-
    Ubiquitin-linkage-specific immunoblotting (K48 and K63 antibodies) plus
    mass-spectrometric chain profiling of MHC class I, IFNGR1 and DC-SIGN
    immunoprecipitated from K3-expressing versus K3 mZn cells, together with
    reconstituted in vitro assays using UbcH5 or UbcH13/Uev1a, to test whether K3
    writes distinct chain types on different substrates.
- description: >-
    Lysine-free and cysteine-free cytoplasmic-tail variants of IFNGR1 and DC-SIGN,
    assayed for K3-dependent ubiquitination and surface loss under
    beta-mercaptoethanol-sensitive conditions, to test how far the non-lysine
    ubiquitination mechanism extends beyond MHC class I.
- description: >-
    Bimolecular fluorescence complementation or a surface-restricted proximity
    labelling (split-APEX at the plasma membrane) between K3 and MHC class I in
    live cells, to determine whether the ubiquitin mark is written at the surface
    or in a pre-Golgi compartment, which the current steady-state localisations
    leave unresolved.
- description: >-
    A cytotoxic T lymphocyte killing assay against KSHV-infected cells carrying
    wild-type, K3-deleted, K5-deleted and doubly deleted genomes at defined lytic
    stages, to quantify how much protection K3's late-stage MHC class I
    downregulation actually buys the infected cell.
