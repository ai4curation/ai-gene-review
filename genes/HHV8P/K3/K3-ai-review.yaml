        endogenous MHC-I chains
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011016
  - UniProtKB-KW:KW-0863
  review:
    summary: >-
      The RING-CH domain binds two zinc ions in a cross-brace motif; this was
      established structurally by NMR, not merely predicted from the signature.
    action: ACCEPT
    reason: >-
      The InterPro RING-CH signature match is good support for membership, and
      the claim is confirmed directly by the solution structure of the K3
      N-terminal domain (PDB 1VYX, PMID:15465811), which showed it to be a
      variant RING rather than a plant homeodomain and retaining the canonical
      two-zinc cross-brace. UniProt annotates the eight coordinating residues
      (Cys9, Cys12, Cys24, His26, Cys34, Cys37, Cys50, Cys53). The zinc sites
      are not incidental: disrupting them (the mZn mutants) abolishes
      ubiquitination and substrate downregulation in every assay reported for
      K3, so this is a genuine, functionally load-bearing molecular function of
      the protein.
    supported_by:
    - reference_id: PMID:15465811
      supporting_text: >-
        binding two zinc ions in a stable cross-brace motif
    - reference_id: PMID:15465811
      supporting_text: >-
        it is conclusively demonstrated that the K3 N-terminal domain is a variant
    - reference_id: file:HHV8P/K3/K3-uniprot.txt
      record_section: ["FT:ZN_FING"]
      supporting_text: >-
        ZN_FING         1..60
    additional_reference_ids:
    - PMID:15465811
