    action: MODIFY
    reason: >-
      GO:0075509 is defined as any endocytosis involved in the uptake of a virus
      into a host cell, i.e. the virion is the cargo. K3 has no reported role in
      virion uptake; it is an immediate-early to late lytic product acting
      inside an already infected cell, and the endocytosis it enhances is that of
      host immunoreceptors - MHC class I (PMID:10799607, PMID:10859362) and
      DC-SIGN (PMID:23460925). The sound essence of the row is therefore
      symbiont-driven enhancement of host endocytosis, for which GO:0044077, a
      process in which a symbiont initiates, promotes or enhances host
      receptor-mediated endocytosis, is the appropriate interspecies term. This
      is a lateral correction, and the same replacement is proposed for the CACAO
      IMP row on this term so the two agree.
