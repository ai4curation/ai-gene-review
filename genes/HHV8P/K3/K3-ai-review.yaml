core_functions:
- description: >-
    Acts as a membrane-bound RING-CH (MARCH-family) E3 ubiquitin ligase: the
    cytosolic N-terminal zinc finger recruits an E2 ubiquitin-conjugating enzyme
    (UbcH5A-C, UbcH13) while the transmembrane segments select the target, so
    that ubiquitin is transferred onto the cytosolic tail of a host membrane
    protein - onto cysteine as well as lysine residues, which lets K3 modify
    substrates that lack cytoplasmic lysines.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  - id: GO:0039648
    label: symbiont-mediated perturbation of host ubiquitin-like protein modification
  locations:
  - id: GO:0044165
    label: host cell endoplasmic reticulum
  - id: GO:0020002
    label: host cell plasma membrane
  substrates:
