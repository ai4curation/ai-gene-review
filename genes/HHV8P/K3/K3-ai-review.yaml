id: P90495
gene_symbol: K3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:868565
  label: Human herpesvirus 8 strain GK18
description: >-
  K3 (ORF K3; also IE1B, or MIR1, modulator of immune recognition 1) is a
  333-residue Kaposi's sarcoma-associated herpesvirus membrane protein and, with
  its ~40% identical paralog K5/MIR2, the prototype of the MARCH family of
  membrane-bound RING-CH E3 ubiquitin ligases. Its architecture is a cytosolic
  N-terminal RING-CH (RINGv) zinc finger that binds two zinc ions in a
  cross-brace motif and docks the E2 ubiquitin-conjugating enzymes UbcH5A-C and
  UbcH13, two transmembrane helices that recognise targets through their own
  transmembrane segments, and a long cytosolic C-terminal tail carrying a
  tyrosine-based endocytosis motif and acidic tracts that direct trafficking and
  degradation of the modified substrate. The protein is made and resides largely
  in the host endoplasmic reticulum and pre-Golgi compartment and acts on its
  targets at or near the host plasma membrane. K3 polyubiquitinates the cytosolic
  tails of host immunoreceptors, marking them for accelerated endocytosis and
  delivery to the endolysosomal or proteasomal degradation route: MHC class I
  (all of HLA-A, -B, -C and -E), the gamma interferon receptor IFNGR1, CD1D, and
  the C-type lectins DC-SIGN (CD209) and DC-SIGNR (CLEC4M). Uniquely among
  characterised E3s of its era, it can transfer ubiquitin to cysteine as well as
  lysine residues of the substrate tail, so MHC class I molecules lacking
  cytoplasmic lysines are still downregulated. The net effect is multi-pronged
  immune evasion: loss of surface MHC class I blinds cytotoxic T lymphocytes to
  the infected cell, and loss of IFNGR1 blunts IFN-gamma-driven STAT1
  phosphorylation. In the intact virus K3 and K5 act sequentially rather than
  redundantly, K5 immediately on entry into the lytic phase and K3 during later
  stages of lytic replication.
