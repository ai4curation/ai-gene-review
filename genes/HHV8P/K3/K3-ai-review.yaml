- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0375
  review:
    summary: >-
      The UniProt subcellular-location mapping rests on an experimental
      localisation (PubMed:10799607) that placed K3 near the host plasma
      membrane, which is also where its substrates are internalised.
    action: ACCEPT
    reason: >-
      UniProt's SL-0375 assignment carries ECO:0000269|PubMed:10799607, i.e. it
      is a curated statement from confocal immunofluorescence on transfected
      COS-1 and stably expressing BJAB cells, not a prediction. This is the
      functionally relevant pool: K3 ubiquitylates MHC class I after its export
      from the ER and the mark triggers internalisation at the plasma membrane
      (PMID:12006494). It is not redundant with the host-ER row - the two
      locations reflect the steady-state bulk (ER) and the site of action
      (plasma membrane), and both are curated from experiment.
    supported_by:
    - reference_id: PMID:10799607
      supporting_text: >-
        cross sections of transfected cells demonstrated that K3 and K5 were
        localized near the plasma membrane
    - reference_id: PMID:12006494
      supporting_text: >-
        signal for class I internalization at the plasma membrane
    additional_reference_ids:
