      high-throughput screen, so no more informative molecular function can be
      inferred for this pair, and K3's informative molecular function
      (GO:0061630 ubiquitin protein ligase activity) is already asserted
      elsewhere in this review from direct evidence. Removal of the generic term
      does not assert that the reported interaction is false.
