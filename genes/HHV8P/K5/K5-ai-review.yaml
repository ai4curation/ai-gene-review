- id: PMID:23460925
  title: Kaposi's sarcoma-associated herpesvirus K3 and K5 proteins down regulate
    both DC-SIGN and DC-SIGNR.
  findings:
  - statement: >-
      In the context of infection, K5 rather than K3 is the dominant activity
      removing DC-SIGN, DC-SIGNR and MHC class I from the cell surface: viruses
      retaining a functional K5 gene downregulate all three, while K5-deleted
      viruses barely do.
    supporting_text: Each of the viruses encoding a functional K5 gene (wt and ΔK3) showed
      significant down regulation of DC-SIGN, DC-SIGNR and MHC I from the cell surface.
    reference_section_type: RESULTS
  - statement: >-
      Downregulation of both lectins requires an intact RING-CH domain, so it is
      a ubiquitin-ligase-dependent effect rather than simple sequestration.
    supporting_text: Mutation of the RING-CH domain abolished this effect, with surface
      levels of DC-SIGN and DC-SIGNR in the presence of K3 mZn or K5 mZn reaching 75–100%
      of the levels observed in 293 cells expressing vector only.
    reference_section_type: RESULTS
  - statement: >-
      K5 accelerates endocytosis of DC-SIGN specifically; DC-SIGNR is not
      endocytosed but is instead blocked from reaching the surface, so the two
      closely related substrates are handled by different mechanisms.
    supporting_text: In the presence of K5, accumulated DC-SIGN was endocytosed following
      dynasore removal, with cell surface levels decreasing ∼60%, but total protein levels
      remaining static
    reference_section_type: RESULTS
  - statement: >-
      DC-SIGN is ubiquitylated only by RING-CH-competent K5 and is destroyed
      mainly by the proteasome, with a minor lysosomal contribution.
    supporting_text: These results indicate that degradation of DC-SIGN occurs primarily
      through a ubiquitylation-dependent, proteasomal mechanism
    reference_section_type: RESULTS
  - statement: >-
      The authors read the consequence of lectin removal as reduced
      superinfection and possibly enhanced egress, i.e. the opposite of a
      positive role for K5 in viral entry.
    supporting_text: Given a role for both lectins in entry, down modulation would reduce
      superinfection.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; cached with full text (PMC3584050), so the figures behind
      all four CACAO rows could be read rather than inferred. The paper assays
      K3 and K5 side by side, and each result quoted here is the K5 result. It
      genuinely supports the GO:0006511 and GO:0039648 rows and, together with
      companion literature, the GO:0039504 row; it does not support
      GO:0075509, whose entry data are host-side and were collected with a
      double-deletion virus lacking K3 and K5.
- id: PMID:10684303
  title: Identification and analysis of the K5 gene of Kaposi's sarcoma-associated
    herpesvirus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Immunoelectron microscopy localized the K5 antigen mainly to the
      endoplasmic reticulum of induced BCBL-1 and BC-3 cells, and not to virions
      or the nucleus; this is the primary evidence behind UniProt's host
      endoplasmic reticulum location.
    supporting_text: Immunoelectron microscopy showed that the K5 antigen was situated
      mainly in the endoplasmic reticulum but was not present on the virion or in the nucleus.
  - statement: >-
      K5 transcription is insensitive to phosphonoformic acid and to
      cycloheximide plus actinomycin D, establishing it as an immediate-early
      gene expressed before viral DNA replication.
    supporting_text: K5 expression was unaffected by the respective DNA and protein synthesis
      inhibitors phosphonoformic acid and cycloheximide plus actinomycin D, confirming
      its immediate-early nature.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified and matches the UniProt subcellular-location evidence tag
      ECO:0000269|PubMed:10684303. A K5-specific paper, so there is no paralog
      ambiguity. Abstract-only in the cache, but the two statements used here
      are stated in the abstract itself.
- id: PMID:10799607
  title: Downregulation of major histocompatibility complex class I molecules by Kaposi's
    sarcoma-associated herpesvirus K3 and K5 proteins.
  findings:
  - statement: >-
      K5 downregulates HLA-A and HLA-B strongly, HLA-C weakly and HLA-E not at
      all, a narrower allotype specificity than K3, which affects all four.
    supporting_text: K5 significantly downregulated HLA-A and -B and downregulated HLA-C
      only weakly, but not HLA-E, whereas K3 downregulated all four HLA allotypes.
  - statement: >-
      Both proteins localize primarily near the plasma membrane and act by
      inducing rapid endocytosis of class I molecules rather than by blocking
      their synthesis or transport.
    supporting_text: K3 and K5 exhibit 40% amino acid identity to each other and localize
      primarily near the plasma membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Assays K3 and K5 in parallel; the statements used here
      are explicitly the K5 results, and the HLA-allotype difference is itself
      the discriminator between the two paralogs.
- id: PMID:10859362
  title: Kaposi's sarcoma-associated herpesvirus encodes two proteins that block cell
    surface display of MHC class I chains by enhancing their endocytosis.
  findings:
  - statement: >-
      MIR1/K3 and MIR2/K5 reduce surface MHC-I not by interfering with
      synthesis, translocation or assembly but by accelerating endocytosis, with
      internalized chains degraded in endolysosomes.
    supporting_text: they act to enhance endocytosis of MHC I from the cell surface;
      internalized class I chains are delivered to endolysosomal vesicles, where they undergo
      degradation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Establishes the mechanism class (enhanced endocytosis
      plus endolysosomal degradation) that all later K5 substrate papers build
      on. An erratum exists (PNAS 2001;98:2111) but does not affect the
      statement used.
- id: PMID:11413168
  title: A viral protein that selectively downregulates ICAM-1 and B7-2 and modulates
    T cell costimulation.
  findings:
  - statement: >-
      K5, and specifically not K3, removes ICAM-1 and B7.2 from the surface of
      BJAB cells while leaving B7-1 untouched; the effect is reversed by
      dominant-negative dynamin, showing it is endocytic.
    supporting_text: We report that K5, but not K3, expression in BJAB cells dramatically
      reduces ICAM-1 and B7-2 surface expression; B7-1 expression is unaffected.
  - statement: >-
      The surface changes have a measured immunological consequence:
      K5-expressing B cells are substantially impaired in their ability to
      activate T cells, making K5 a viral modulator of immunological-synapse
      formation and costimulation.
    supporting_text: K5-transfected B cells show substantial impairment in their ability
      to induce T cell activation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The cleanest paralog discrimination in the K3/K5
      literature - the paper's central claim is that K5 and not K3 performs this
      function - and the T-cell activation assay is what carries the
      adaptive-immunity process claim beyond inference.
- id: PMID:11751860
  title: Functional organization of MIR2, a novel viral regulator of selective endocytosis.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Cited by UniProt as FUNCTION evidence (ECO:0000269|PubMed:11751860) and is
