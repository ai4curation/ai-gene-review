- term:
    id: GO:0075509
    label: endocytosis involved in viral entry into host cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00088611
  review:
    summary: >-
      ARBA rule asserting the same term as the CACAO IMP row below. The term
      means the endocytic uptake of the virion itself, a process K5 takes no
      part in: K5 is an immediate-early protein expressed after entry, and its
      effect on the entry co-receptors DC-SIGN and DC-SIGNR is to destroy them,
      which would reduce rather than promote entry.
    action: REMOVE
    reason: >-
      Removed for the same reasons as the IMP row below, with which it must stay
      consistent. The claim is not merely unsupported for K5 but opposite in
      sign to what the only relevant paper concludes. This electronic row is an
      instance of a CACAO error propagating: it restates the 2013 student
      annotation through a machine-learning rule, so the footprint of the
      original mistake is larger than one row.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: Given a role for both lectins in entry, down modulation would reduce
        superinfection.
    - reference_id: PMID:10684303
      supporting_text: K5 expression was unaffected by the respective DNA and protein
        synthesis inhibitors phosphonoformic acid and cycloheximide plus actinomycin D,
        confirming its immediate-early nature.
- term:
    id: GO:0075509
    label: endocytosis involved in viral entry into host cell
  evidence_type: IMP
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The term is defined as "Any endocytosis that is involved in the
      uptake of a virus into a host cell", i.e. the endocytic internalization of
      the virion during entry. The endocytosis in this paper is that of DC-SIGN,
      a host C-type lectin, from the cell surface, which is the removal of a
      receptor rather than the uptake of a particle. The only viral-entry data
      in the paper (Figure 1A/B) are host-side - DC-SIGN or DC-SIGNR expression
      raises KSHV infectivity about sixfold - and Figure 1A was performed with a
      Bac16 virus lacking both K3 and K5, so K5 was absent from the very
      experiment that measures entry.
    action: REMOVE
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IMP, PMID:23460925). Full text is cached
      and was read, so this removal does not rest on an abstract. Three
      independent problems compound: (1) the process annotated belongs to the
      virion's uptake, while the endocytosis assayed is that of a host receptor
      - this is a host-receptor endocytosis read as viral-entry endocytosis;
      (2) the entry measurements in the paper are a property of DC-SIGN and
      DC-SIGNR, not of K5, and were made with a double-deletion virus from which
      K5 is absent, so no K5 loss-of-function phenotype for entry exists to
      support an IMP; (3) the sign is inverted - the authors' own reading is
      that K5-mediated removal of the lectins would reduce superinfection, and
      their alternative hypothesis is a role in egress, not entry. The claim is
      therefore contradicted rather than merely unverified, which is what
      distinguishes this from an UNDECIDED. The paper's genuine K5 findings are
      fully captured by the GO:0006511 and GO:0039648 rows from the same
      reference, so nothing is lost by removing this one.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: Given a role for both lectins in entry, down modulation would reduce
        superinfection.
    - reference_id: PMID:23460925
      supporting_text: cells were infected with a low multiplicity of infection (MOI)
        (0.01) of recombinant KSHV derived from the Bac16 construct, lacking both K3 and
        K5 genes
    - reference_id: PMID:23460925
      supporting_text: The possibility also exists that DC-SIGN and DC-SIGNR down modulation
        enhances viral egress, as has been demonstrated in the case of tetherin.
