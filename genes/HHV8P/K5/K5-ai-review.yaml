id: P90489
gene_symbol: K5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:868565
  label: Human herpesvirus 8 strain GK18
description: >-
  K5, also called MIR2 (modulator of immune recognition 2), is a 256-residue
  immediate-early protein of Kaposi's sarcoma-associated herpesvirus and, with
  its ~40%-identical neighbour K3/MIR1, the prototype of the MARCH
  (membrane-associated RING-CH) family of E3 ubiquitin ligases. Its
  architecture is modular: an N-terminal cytoplasmic RING-CH zinc finger
  (residues 7-66) that coordinates two Zn(2+) ions and carries the catalytic
  activity, two transmembrane helices that anchor the protein in host
  membranes, and a long, largely disordered cytoplasmic C-terminal region
  holding the trafficking determinants, including a tyrosine-based endocytosis
  motif beginning at Tyr156, a polyproline tract and two acidic tracts. Because
  both the catalytic domain and the sorting motifs face the cytosol while the
  protein itself is membrane-embedded, K5 acts on the cytosolic tails of other
  integral membrane proteins. In a cell-free reaction with purified E1 and E2
  enzymes it transfers ubiquitin to acceptor proteins, and mutating the
  zinc-coordinating cysteines abolishes both the transfer and every downstream
  effect. K5 resides in the host endoplasmic reticulum and at the host plasma
  membrane, and it uses both compartments: it intercepts newly made, immature
  (EndoH-sensitive) substrates in the ER or early Golgi and blocks their
  exocytosis, and it ubiquitinates mature substrates at the cell surface so
  that they are endocytosed and delivered to endolysosomes or to the
  proteasome. Its substrates are host immune-recognition receptors: MHC class I
  heavy chains (HLA-A and -B strongly, HLA-C weakly), the costimulatory and
  adhesion molecules B7.2/CD86 and ICAM-1, CD1d, CD31/PECAM, interferon-gamma
  receptor 1, the NK-cell activating ligands MICA, MICB and AICL/CLEC2B, the
  restriction factor BST-2/tetherin, ALCAM/CD166, syntaxin-4, the C-type
  lectins DC-SIGN and DC-SIGNR, and growth-factor-binding receptor tyrosine
  kinases. Stripping these molecules from the infected cell's surface blunts
  recognition by cytotoxic T lymphocytes, NK cells and NKT cells, impairs
  immunological-synapse formation and T-cell costimulation, and closes down
  interferon-gamma responsiveness, while removal of tetherin aids virion
  release. The receptor-tyrosine-kinase arm is not immunological at all: by
  accelerating RTK internalization K5 raises the sensitivity of monocytes to
  autocrine and paracrine growth factors, increasing aerobic glycolysis,
  Akt activation and proliferation.
