suggested_questions:
- question: >-
    Does K5-mediated removal of DC-SIGN and DC-SIGNR measurably enhance virion
    egress, as it does for tetherin, or is its main consequence the reduction of
    superinfection? Lang et al. say the egress experiment with K3/K5 deletion
    viruses was under way in 2013 but it does not appear to have been published.
  experts:
  - Robert E. Means
  - Sabine M. Lang
- question: >-
    Which host E2 conjugating enzyme or enzymes does K5 use in infected cells,
    and does the choice of E2 explain why some substrates are polyubiquitinated
    and destroyed (DC-SIGN, MHC-I, ALCAM) while others are only
    monoubiquitinated and internalized (MICA)?
  experts:
  - Paul J. Lehner
  - Klaus Fruh
- question: >-
    Is the receptor-tyrosine-kinase arm of K5 activity under positive selection,
    that is, does KSHV benefit from the increased glycolysis and proliferation
    it causes in monocytes, or is it an incidental consequence of a MARCH ligase
    sitting in the plasma membrane of a cell full of RTKs?
  experts:
  - Robert E. Means
- question: >-
    How is K5 itself turned over? It is an immediate-early protein that destroys
    membrane proteins; whether it autoubiquitinates, and whether that limits the
    duration of immune evasion during lytic replication, is unaddressed.
  experts: []
suggested_experiments:
- hypothesis: >-
    K5 has no role in the endocytic uptake of KSHV virions; the GO:0075509
    annotation reflects the entry function of its substrate DC-SIGN rather than
    any activity of K5.
  description: >-
    Infect DC-SIGN-positive and DC-SIGN-negative cells with BAC16 wild-type, the
    K5-deletion mutant and the K3/K5 double-deletion mutant at matched particle
    numbers and measure entry directly rather than by GFP expression: quantify
    internalized, DNase-protected viral genomes by qPCR at 30, 60 and 120
    minutes, with dynasore and an entry-blocking mannan control. Because K5 is
    expressed only after entry, the prediction is that entry kinetics are
    indistinguishable between the three viruses in the first round, while
    DC-SIGN expression shifts all three equally; a second-round superinfection
    assay on already-infected cells should then show more entry into
    K5-deletion-infected cells, the sign opposite to what the current annotation
    implies.
  experiment_type: quantitative virion internalization assay with deletion viruses
- hypothesis: >-
    K5 suppresses type II but not type I interferon signalling, so the
    type-I-specific GO term currently annotated from the UniProt keyword is the
    wrong child.
  description: >-
    In the same cell background, compare K5-expressing and vector cells for
    surface IFNGR1 and IFNAR1/IFNAR2 by flow cytometry, for STAT1 Tyr701
    phosphorylation after IFN-gamma versus IFN-beta stimulation, and for
    induction of a type-I-specific (MX1, ISG15) versus a type-II-specific
    (CXCL9, GBP1) reporter. Include the RING-CH-dead and W47A K5 mutants as
    controls. A clean dissociation - IFNGR1 and the IFN-gamma response lost,
    IFNAR and the IFN-beta response intact - would confirm the MODIFY to
    GO:0140884 and the keyword-mapping defect reported against UniProt.
  experiment_type: receptor surface quantification plus interferon-class-resolved
    signalling readout
- hypothesis: >-
    The fate of a K5 substrate - internalized only, lysosomally degraded, or
    proteasomally degraded - is determined by the polyubiquitin chain linkage K5
    builds on it rather than by the substrate's own trafficking itinerary.
  description: >-
    Immunoprecipitate MICA, MHC-I, ALCAM and DC-SIGN from K5-expressing cells
    co-expressing single-lysine (K48-only, K63-only, K0) ubiquitin mutants and
    determine the linkage on each substrate by ubiquitin-AQUA mass spectrometry,
    pairing each with the matching inhibitor (MG132, chloroquine, bafilomycin)
    and a surface-versus-total flow readout. A substrate-specific linkage
    pattern that tracks with the route of destruction would explain the
    mechanistic heterogeneity the DC-SIGN/DC-SIGNR work exposed.
  experiment_type: linkage-resolved ubiquitin proteomics
