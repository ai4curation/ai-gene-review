- id: PMID:11756476
  title: A novel class of herpesvirus-encoded membrane-bound E3 ubiquitin ligases
    regulates endocytosis of proteins involved in immune recognition.
  findings:
  - statement: >-
      MIR2/K5 is a membrane-bound E3 ubiquitin ligase: in a cell-free reaction a
      MIR2-GST fusion plus purified E1 and E2 transfers ubiquitin to acceptor
      proteins in an ATP- and E2-dependent manner, and the reaction is abolished
      by mutating the zinc-coordinating residues.
    supporting_text: addition of a MIR2-glutathione S-transferase (GST) fusion protein
      to purified E1 and E2 enzymes leads to transfer of ubiquitin (Ub) to GST-containing
      targets in an ATP- and E2-dependent fashion
  - statement: >-
      Substrate ubiquitination is not incidental but mechanistically required:
      ubiquitination of the cytosolic tails of MHC-I, B7.2 and ICAM-1 is
      essential for their removal from the cell surface.
    supporting_text: expression of MIR1 and MIR2 leads to ubiquitination of the cytosolic
      tail of their target proteins and that ubiquitination is essential for their removal
      from the cell surface
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The decisive molecular-function paper and the reason
      GO:0061630 is accepted on direct rather than EC-mapped grounds; the in
      vitro reaction is performed with the MIR2 (K5) fusion specifically, so it
      is not a K3 result transferred across.
- id: PMID:17166914
  title: Downregulation of gamma interferon receptor 1 by Kaposi's sarcoma-associated
    herpesvirus K3 and K5.
  findings:
  - statement: >-
      K5 ubiquitinates interferon-gamma receptor 1 and drives its endocytosis
      and degradation, inhibiting IFN-gamma action. The interferon arm K5
      attacks is therefore type II, not type I.
    supporting_text: we demonstrate that K3 and K5 both specifically target gamma interferon
      receptor 1 (IFN-gammaR1) and induce its ubiquitination, endocytosis, and degradation,
      resulting in downregulation of IFN-gammaR1 surface expression and, thereby, inhibition
      of IFN-gamma action
  - statement: >-
      K5 is the stronger of the two paralogs against IFN-gammaR1, and both the
      N-terminal RING finger and the C-terminal region are required.
    supporting_text: the amino-terminal ring finger motif and the carboxyl-terminal region
      of K5 were necessary for IFN-gammaR1 downregulation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. This is the reference that settles the interferon-class
      question underlying the GO:0039502 MODIFY and the UniProt keyword-mapping
      source defect; the mutational analysis is explicitly on K5.
- id: PMID:17238276
  title: Quantitative membrane proteomics reveals new cellular targets of viral immune
    modulators.
  findings:
  - statement: >-
      An unbiased SILAC membrane-proteomics comparison of cells with and without
      K5 identified MHC-I, BST-2/tetherin, ALCAM/CD166 and syntaxin-4 as
      consistently depleted from the plasma membrane.
    supporting_text: Mass spectrometric protein identification revealed four proteins
      that were consistently underrepresented in the plasma membrane of K5 expression
      cells
  - statement: >-
      ALCAM is a bona fide K5 substrate, ubiquitinated in a RING- and
      acidic-motif-dependent manner after exiting the ER and destroyed via the
      multivesicular-body route to the lysosome.
    supporting_text: ALCAM is ubiquitinated in the presence of wild-type, but not RING-deficient
      or acidic motif-deficient, K5, and is targeted for lysosomal degradation via the
      multivesicular body pathway
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. A K5-only screen, so no paralog ambiguity, and valuable
      because it is unbiased: the substrate list was not chosen by immunological
      expectation. It also shows that K5's route of destruction is
      substrate-dependent (lysosomal for ALCAM, proteasomal for DC-SIGN).
- id: PMID:18230726
  title: Down-regulation of NKG2D and NKp80 ligands by Kaposi's sarcoma-associated
    herpesvirus K5 protects against NK cell cytotoxicity.
  findings:
  - statement: >-
      K5 reduces surface MICA, MICB and AICL/CLEC2B, the activating ligands for
      NKG2D and NKp80, and this requires its E3 ligase activity acting on
      lysines in the substrates' cytoplasmic tails.
    supporting_text: Down-regulation of both MICA and AICL requires the ubiquitin E3
      ligase activity of K5 to target substrate cytoplasmic tail lysine residues.
  - statement: >-
      For MICA, ubiquitylation signals internalization without degradation, and
      the functional consequence is a potent reduction in NK-cell-mediated
      killing; the MICA*008 allele, which lacks the tail lysines, escapes.
    supporting_text: K5-mediated ubiquitylation signals internalization but not degradation
      of MICA and causes a potent reduction in NK cell-mediated cytotoxicity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. A K5-only paper, and the clearest demonstration that K5's
      activity has an innate-immune output with a measured effector readout
      (NK cytotoxicity), which is what supports GO:0052170 on functional rather
      than keyword grounds. The MICA*008 lysine-loss result is a strong internal
      control for the ubiquitination mechanism.
- id: PMID:21490960
  title: The MARCH family E3 ubiquitin ligase K5 alters monocyte metabolism and proliferation
    through receptor tyrosine kinase modulation.
  findings:
  - statement: >-
      Beyond immune evasion, K5 accelerates endocytosis of growth-factor-binding
      receptor tyrosine kinases in monocytes, which raises sensitivity to
      autocrine and paracrine factors and increases aerobic glycolysis, lactate
      production, Akt activation and proliferation.
    supporting_text: This ubiquitin ligase increases aerobic glycolysis and lactate production
      through modulation of cellular growth factor-binding receptor tyrosine kinase endocytosis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; a K5-only paper and the source of the W47A mutant that
      UniProt records as abolishing ligase activity. Relevance is MEDIUM rather
      than HIGH because the metabolic/proliferative arm is not represented by
      any GOA row and is not proposed as one here - the causal chain from RTK
      internalization to altered metabolism runs through host signalling
      cascades that K5 does not itself execute.
- id: PMID:24899205
  title: Kaposi's sarcoma-associated herpesvirus K3 and K5 ubiquitin E3 ligases have
    stage-specific immune evasion roles during lytic replication.
  findings:
  - statement: >-
      Within the viral genome the two ligases act at different stages:
      K5-mediated MHC-I downregulation coincides with early lytic gene
      expression, whereas K3's contribution becomes evident later, in cells
      enriched for late promoter activity.
    supporting_text: These data support the notion that immunoreceptor downregulation
      occurs by a sequential process wherein K5 is critical during the
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cited by UniProt as FUNCTION evidence. Important for the
      paralog question in the opposite direction from the others: it shows K3
      and K5 are not redundant in the viral context but act at different lytic
      stages, which is why the K5-deletion virus in PMID:23460925 is not rescued
      by K3.
core_functions:
- description: >-
    Membrane-embedded RING-CH (MARCH-family) E3 ubiquitin ligase. The
    N-terminal RING-CH zinc finger, held on the cytosolic face of host
    membranes by two transmembrane helices, recruits a ubiquitin-charged host E2
    and transfers ubiquitin onto lysines in the cytoplasmic tails of host
    integral membrane proteins. The reaction has been reconstituted cell-free
    from a MIR2-GST fusion plus purified E1 and E2, is ATP- and E2-dependent,
    and is abolished by substituting the zinc-coordinating cysteines or the
    conserved RING-CH tryptophan (W47A). The modified substrate is then
    committed to destruction - by the proteasome for DC-SIGN, by the
    multivesicular-body/lysosome route for ALCAM and MHC-I - or, for some
    substrates such as MICA, merely internalized. This single activity accounts
    for everything else the protein does.
