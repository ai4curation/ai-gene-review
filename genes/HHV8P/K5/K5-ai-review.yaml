- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Lang et al. show directly that K5 ubiquitylates DC-SIGN and
      routes it for destruction: ubiquitylated DC-SIGN is recovered only when
      the RING-CH domain is intact (Figure 7A), the signal rises sharply under
      the proteasome inhibitor MG132 and modestly under chloroquine (Figure 7B),
      and total DC-SIGN and DC-SIGNR protein falls in cells expressing wild-type
      but not RING-CH-mutant K5 (Figure 5A). The same ubiquitin-dependent
      destruction is established for MHC-I, ICAM-1/B7.2 and ALCAM in other
      papers.
    action: ACCEPT
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IDA, PMID:23460925). The cached paper has
      full text, so the panels behind the row could be read. What the paper
      shows for this gene is exactly what the term says: Figure 7A is a
      ubiquitylation assay on a K5 substrate with a catalytically dead control,
      and Figure 7B identifies the proteasome as the main route of destruction,
      while Figure 5A shows the loss of total substrate protein. The term
      matches the assay at the right granularity and judges K5's own activity,
      not a downstream phenotype. K5 performs the step the term names: it is
      the ligase that attaches the ubiquitin that commits the substrate to
      degradation.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: We confirmed that DC-SIGN displayed ubiquitylation only in the
        presence of K3 or K5 with an intact RING-CH domain and not in the presence K3
        mZn or K5 mZn
    - reference_id: PMID:23460925
      supporting_text: These results indicate that degradation of DC-SIGN occurs primarily
        through a ubiquitylation-dependent, proteasomal mechanism
    - reference_id: PMID:11756476
      supporting_text: This downregulation results from enhanced endocytosis and subsequent
        endolysosomal degradation of the target proteins.
