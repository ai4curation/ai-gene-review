- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011016
  - UniProtKB-KW:KW-0863
  review:
    summary: >-
      Signature-based call from the RING-CH (RINGv) zinc-finger match
      (IPR011016), which UniProt places at residues 7-66 with eight
      zinc-coordinating cysteines arranged as two Zn(2+) sites. The structural
      prediction is corroborated functionally: substituting the coordinating
      cysteines abolishes ubiquitin transfer in vitro and abolishes substrate
      downregulation in cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well supported and as precise as the evidence allows, so it should not be
      generalized or specialized further; but zinc binding is the structural
      prerequisite for the RING-CH fold rather than the activity K5 is for. The
      core molecular function is GO:0061630 ubiquitin protein ligase activity,
      which the zinc sites serve. The corroboration is not merely a signature
      match: mutation of the zinc-coordinating residues abolishes ubiquitin
      transfer in a reconstituted reaction, which is a functional test of the
      metal site.
    supported_by:
    - reference_id: file:HHV8P/K5/K5-uniprot.txt
      record_section: ["FT:ZN_FING"]
      supporting_text: RING-CH-type
    - reference_id: PMID:11756476
      supporting_text: this reaction is abolished by mutation of the Zn-coordinating
        residues of the PHD domain
    - reference_id: file:HHV8P/K5/K5-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: 'C->S: Loss of ubiquitination; when associated with S-59.'
- term:
    id: GO:0016567
    label: protein ubiquitination
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00143
  review:
    summary: >-
      UniPathway mapping of the "protein modification; protein ubiquitination"
      pathway annotation. This is the process K5 directly executes, and it is
      demonstrated by in vitro reconstitution with purified E1 and E2 enzymes as
      well as by substrate ubiquitylation in cells.
    action: ACCEPT
    reason: >-
      Although the evidence code is electronic, the claim is among the
      best-supported statements about this protein: a cell-free reaction with
      purified E1 and E2 shows K5 transferring ubiquitin onto acceptor proteins,
      and substrate-level ubiquitylation with RING-CH-dead controls has been
      shown for MHC-I, ICAM-1/B7.2, MICA, ALCAM and DC-SIGN. The term is at the
      granularity the evidence supports for the process aspect, and K5 is the
      entity that performs the step.
    supported_by:
    - reference_id: PMID:11756476
      supporting_text: addition of a MIR2-glutathione S-transferase (GST) fusion protein
        to purified E1 and E2 enzymes leads to transfer of ubiquitin (Ub) to GST-containing
        targets in an ATP- and E2-dependent fashion
    - reference_id: PMID:11756476
      supporting_text: expression of MIR1 and MIR2 leads to ubiquitination of the cytosolic
        tail of their target proteins and that ubiquitination is essential for their
        removal from the cell surface
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0808
  review:
    summary: >-
      Keyword-to-GO mapping from KW-0808 (Transferase), which is itself a
      consequence of the EC 2.3.2.27 assignment. True of K5, but it conveys only
      that the protein transfers a group.
    action: TOO_GENERAL
    reason: >-
      The claim is correct and nothing about it is in doubt; it is simply
      entailed by GO:0061630 ubiquitin protein ligase activity, which this
      review asserts from the EC mapping and which the in vitro E1/E2
      reconstitution supports directly. GO:0061630 is a descendant of
      GO:0016740, so this row adds no information beyond it. This judges the
      term, not the row's evidence.
    supported_by:
    - reference_id: PMID:11756476
      supporting_text: MIR2 defines a novel class of membrane-bound E3 Ub ligases that
        modulates the trafficking of host cell membrane proteins
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0375
  review:
    summary: >-
      Subcellular-location mapping of UniProt's "Host cell membrane;
      Multi-pass membrane protein". Independently supported: K3 and K5 were
      reported to localize primarily near the plasma membrane, and the surface
      ubiquitylation of mature MHC-I, MICA and receptor tyrosine kinases
      requires K5 to act there.
    action: ACCEPT
    reason: >-
      A genuine site of action, not just a prediction. K5 ubiquitylates the
      cytosolic tails of mature substrates at the cell surface and thereby
      accelerates their endocytosis, which places the ligase in the plasma
      membrane with its catalytic domain facing the cytosol; the two predicted
      transmembrane helices (84-104, 125-145) are consistent with this topology.
      UniProt itself notes that K5 probably exerts its effects at the plasma
      membrane during infection. The term is as precise as the evidence allows
      for this compartment.
    supported_by:
    - reference_id: PMID:10799607
      supporting_text: K3 and K5 exhibit 40% amino acid identity to each other and localize
        primarily near the plasma membrane.
    - reference_id: file:HHV8P/K5/K5-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Probably exerts its effects at the plasma membrane during viral
        infection.
    - reference_id: PMID:18230726
      supporting_text: K5-mediated ubiquitylation signals internalization but not degradation
        of MICA and causes a potent reduction in NK cell-mediated cytotoxicity.
- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1114
  review:
    summary: >-
      Keyword mapping from KW-1114, whose own definition is generic ("Viral
      protein involved in the evasion of host innate defense by inhibiting the
      interferon signaling pathway") while the GO term it is mapped to is
      specific to type I interferon. K5's demonstrated interferon target is
      interferon-gamma receptor 1, which is type II; no publication reports K5
      acting on IFNAR or on type I interferon signalling.
    action: MODIFY
    reason: >-
      Wrong arm of the interferon system rather than a wrong claim about immune
      evasion. Li et al. show that K3 and K5 target IFN-gammaR1 for
      ubiquitination, endocytosis and degradation, inhibiting IFN-gamma action,
      and the RING finger plus the C-terminal region of K5 are required. That is
      type II interferon signalling, so the supported child of
      GO:0140886 is GO:0140884, not GO:0039502. The mis-specification originates
      in the keyword-to-term mapping, not in the K5 record, and is recorded as a
      source defect below.
    proposed_replacement_terms:
    - id: GO:0140884
      label: symbiont-mediated suppression of host type II interferon-mediated signaling
        pathway
    supported_by:
    - reference_id: PMID:17166914
      supporting_text: we demonstrate that K3 and K5 both specifically target gamma interferon
        receptor 1 (IFN-gammaR1) and induce its ubiquitination, endocytosis, and degradation,
        resulting in downregulation of IFN-gammaR1 surface expression and, thereby, inhibition
        of IFN-gamma action
    - reference_id: PMID:17166914
      supporting_text: the amino-terminal ring finger motif and the carboxyl-terminal
        region of K5 were necessary for IFN-gammaR1 downregulation
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: term
      requested_change: REPOINT
      asserted_value: GO:0039502
      corrected_value: GO:0140886
      corrected_label: symbiont-mediated suppression of host interferon-mediated signaling
        pathway
      confidence: PROBABLE
      explanation: >-
        KW-1114 "Inhibition of host interferon signaling pathway by virus" is
        defined without reference to interferon class, but the keyword-to-GO
        mapping sends it to GO:0039502, which is type-I specific. Any entry
        carrying the keyword therefore acquires a type-I claim the keyword never
        made; for K5 the demonstrated target is the type II receptor IFN-gammaR1.
        The mapping should point at the class-neutral parent GO:0140886, leaving
        the class-specific child to per-entry curation.
      supported_by:
      - reference_id: PMID:17166914
        supporting_text: we demonstrate that K3 and K5 both specifically target gamma
          interferon receptor 1 (IFN-gammaR1) and induce its ubiquitination, endocytosis,
          and degradation
- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089256
  review:
    summary: >-
      ARBA rule asserting the same term as the CACAO IMP row below. The claim is
      independently demonstrated: K5 strips MHC class I, ICAM-1 and B7.2 from
      the surface of infected cells, and K5-expressing B cells are substantially
      impaired in their ability to activate T cells.
    action: ACCEPT
    reason: >-
      Accepted, consistent with the IMP row on the same term. The functional
      readout exists in the literature rather than only as a rule inference:
      Coscoy and Ganem measured T-cell activation directly and found it impaired
      by K5, which is the adaptive-immunity outcome the term names, and the
      MHC-I/CTL arm is supported by two further papers.
    supported_by:
    - reference_id: PMID:11413168
      supporting_text: K5-transfected B cells show substantial impairment in their ability
        to induce T cell activation
    - reference_id: PMID:10799607
      supporting_text: K5 significantly downregulated HLA-A and -B and downregulated
        HLA-C only weakly, but not HLA-E
- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IMP
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row resting on Figure 1C, the deletion-virus experiment: viruses
      carrying a functional K5 gene (wild type and the K3 deletion) strongly
      remove DC-SIGN, DC-SIGNR and MHC class I from the cell surface, whereas
      the K5-deleted and double-deleted viruses barely do. DC-SIGN is an
      antigen-uptake and immunological-synapse receptor and MHC-I is the CTL
      ligand, so the loss-of-function phenotype is the removal of two adaptive
      immune-recognition molecules.
    action: ACCEPT
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IMP, PMID:23460925). Full text was read.
      The IMP code fits: the comparison is wild-type versus K5-deletion
      recombinant virus, so the phenotype is attributed to K5 by mutation. The
      term sits one step downstream of what this particular paper measures -
      Lang et al. assay surface receptor levels and only predict the T-cell
      consequence ("it is likely that by reducing DC-SIGN levels in these
      antigen presenting cells, K3 and K5 will have inhibitory effects on
      activation of T cells") - but the consequence is not left to inference for
      this gene: K5-transfected B cells were directly shown to be impaired in
      T-cell activation, and K5's MHC-I downregulation is the textbook CTL
      evasion mechanism. The claim is therefore true of K5 and annotated at an
      appropriate granularity; this is not a phenotype-as-process error, because
      the host molecules whose removal K5 catalyses are themselves components of
      the adaptive immune response.
    additional_reference_ids:
    - PMID:11413168
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: Each of the viruses encoding a functional K5 gene (wt and ΔK3)
        showed significant down regulation of DC-SIGN, DC-SIGNR and MHC I from the cell
        surface.
    - reference_id: PMID:23460925
      supporting_text: In contrast, the ΔK5 and ΔK3ΔK5 viruses only mediated weak down
        regulation of any of the examined molecules.
    - reference_id: PMID:11413168
      supporting_text: K5-transfected B cells show substantial impairment in their ability
        to induce T cell activation
- term:
    id: GO:0039648
    label: symbiont-mediated perturbation of host ubiquitin-like protein modification
