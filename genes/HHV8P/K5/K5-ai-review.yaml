      by substrate ubiquitylation in cells with RING-CH-dead controls.
    supported_by:
    - reference_id: PMID:11756476
      supporting_text: expression of MIR1 and MIR2 leads to ubiquitination of the cytosolic
        tail of their target proteins and that ubiquitination is essential for their
        removal from the cell surface
    - reference_id: PMID:18230726
      supporting_text: Down-regulation of both MICA and AICL requires the ubiquitin E3
        ligase activity of K5 to target substrate cytoplasmic tail lysine residues.
- term:
    id: GO:0039648
    label: symbiont-mediated perturbation of host ubiquitin-like protein modification
  evidence_type: IMP
  original_reference_id: PMID:23460925
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. In Lang et al., K5 variants are the mutational handle: the
      RING-CH mutant (mZn) and the W47A variant lose the ability to reduce
      DC-SIGN surface levels and to generate ubiquitylated DC-SIGN, while
      wild-type K5 does both. Host ubiquitin (HA-tagged) is the modifier
      transferred, so the viral ligase is altering ubiquitination of host target
      proteins.
    action: ACCEPT
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IMP, PMID:23460925). Full text was read.
      The term definition is explicit that it covers a symbiont altering
      ubiquitin-like modification of host target proteins, which is what Figures
      5B/C and 7A show for K5 with catalytically dead controls. The term matches
      the assay, the evidence code fits (RING-CH and W47A mutants versus wild
      type), and the granularity is right for the interspecies aspect - the
      organism-internal counterpart GO:0016567 is annotated separately from the
      UniPathway mapping. The strongest of the four CACAO rows alongside
      GO:0006511.
    supported_by:
    - reference_id: PMID:23460925
      supporting_text: We confirmed that DC-SIGN displayed ubiquitylation only in the
        presence of K3 or K5 with an intact RING-CH domain and not in the presence K3
        mZn or K5 mZn
    - reference_id: PMID:23460925
      supporting_text: Cells expressing a K5 variant carrying a mutation of the conserved
        tryptophan (residue 46) in the RING-CH domain to alanine (K5 W/A), which impairs
        E3 ubiquitin ligase activity (data not shown), or the K5 Y/A or Y/F mutants showed
        no significant surface modulation of DC-SIGN
- term:
    id: GO:0044165
    label: host cell endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0388
  review:
    summary: >-
      Subcellular-location mapping of UniProt's "Host endoplasmic reticulum",
      which rests on direct immunoelectron microscopy of the K5 antigen in
      induced BCBL-1 cells. The ER is also where K5 first engages several
      substrates: it co-precipitates preferentially with the EndoH-sensitive,
      immature forms of DC-SIGN and DC-SIGNR, placing the initial interaction in
      a pre-Golgi compartment, and the same ER/early-Golgi interception is
      described for B7.2.
    action: ACCEPT
    reason: >-
      Two independent lines agree, so the electronic row is not merely a
      keyword restatement: immunoelectron microscopy localized the K5 antigen
      mainly to the endoplasmic reticulum, and the glycosidase-sensitivity of
      co-precipitated substrates independently places part of K5's activity
      before the Golgi. This is a real site of action rather than an incidental
      biosynthetic transit, because for DC-SIGNR the mechanism is a block on
      exocytosis rather than surface endocytosis. The term is as precise as the
      evidence supports.
    supported_by:
    - reference_id: PMID:10684303
      supporting_text: Immunoelectron microscopy showed that the K5 antigen was situated
        mainly in the endoplasmic reticulum but was not present on the virion or in the
        nucleus.
    - reference_id: PMID:23460925
      supporting_text: From these experiments, we concluded that the initial interactions
        between the viral proteins and DC-SIGN or DC-SIGNR is likely to occur in a pre-Golgi
        compartment with immature forms of these two lectins.
