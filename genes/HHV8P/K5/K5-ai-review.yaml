- description: >-
    Subversion of host immune recognition by destroying immune receptors. The
    same ligase activity is aimed at a broad but specific set of host surface
    molecules, and the choice of substrate is what makes the activity an
    immune-evasion function. On the adaptive side, K5 removes MHC class I
    heavy chains (HLA-A and -B strongly) and the synapse components ICAM-1 and
    B7.2/CD86, with the measured consequence that K5-expressing B cells fail to
    activate T cells. On the innate side it removes the NKG2D ligands MICA and
    MICB and the NKp80 ligand AICL, measurably reducing NK-cell cytotoxicity,
    and it removes interferon-gamma receptor 1, closing down type II interferon
    responsiveness. Substrates are intercepted both before the Golgi, as
    immature glycoforms whose exocytosis is blocked, and at the plasma membrane,
    where ubiquitylation triggers endocytosis.
