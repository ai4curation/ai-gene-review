- id: PMID:16339411
  title: Herpesviral protein networks and their interaction with the human proteome.
  full_text_unavailable: true
  findings:
  - statement: >-
      A comprehensive intraviral yeast two-hybrid screen of KSHV and VZV
      reported 123 and 173 binary interactions respectively; the four
      GO:0005515 rows on K5 come from the KSHV half of this screen and name
      other viral proteins as partners.
    supporting_text: The comprehensive yeast two-hybrid analysis of intraviral protein
      interactions
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Identifier and title verified against the cached PubMed record and the
      IntAct cross-references in P90489. Correctly cited, but the screen
      contributes only generic protein-binding rows with viral partners and no
