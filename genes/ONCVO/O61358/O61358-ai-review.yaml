    label: microtubule cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028425
  review:
    summary: ARBA microtubule-organization inference for a beta-tubulin.
    action: ACCEPT
    reason: >-
      O61358 carries a full-length beta-tubulin sequence with the conserved
      Tubulin/FtsZ GTPase and C-terminal tubulin/FtsZ domains. As an
      alpha/beta-tubulin heterodimer component, it is expected to contribute to
      the structural subunits from which dynamic microtubules are assembled.
