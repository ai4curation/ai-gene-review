- term:
    id: GO:0018991
    label: egg-laying behavior
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q18817
  - WormBase:C54C6.2.1
  review:
    summary: >-
      EnsemblMetazoa transfer from the C. elegans ben-1 egg-laying phenotype.
    action: REMOVE
    reason: >-
      The transfer donor is the C. elegans BEN-1 beta-tubulin. The donor row
      rests on Lacroix et al.'s tissue-specific TBB-5 RNAi phenotype, which the
      worm BEN-1 review itself judges an over-annotation to organism-level
      egg-laying behavior. The direct evidence for O61358 supports a conserved
      microtubule structural subunit, not direct participation in that
      organism-level behavior, and the transferred term is wrong for an
      ovoviviparous filarial nematode whose adult females release
      microfilariae rather than laying eggs. This row therefore transfers a
      C. elegans phenotype to an unassayed Onchocerca beta-tubulin in a
      species context where the egg-laying behavior term does not apply.
    supported_by:
    - reference_id: PMID:24780738
      supporting_text: >-
        Tissue-specific RNAi of 5 of these MAPs induced Egl (Figure 5A; KLP-7,
        KLP-13, CCPP-6, TTLL-15, and TBB-5), confirming that they act in egg
        laying via a role in the non-neuronal cells of the egg-laying
        apparatus.
    - reference_id: PMID:6087508
      supporting_text: >-
        Up to 4,000 microfilariae were expelled by each female per day
