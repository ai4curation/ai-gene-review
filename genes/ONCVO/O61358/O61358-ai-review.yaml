id: O61358
gene_symbol: tub
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6282
  label: Onchocerca volvulus
description: >-
  O61358 is a full-length Onchocerca volvulus beta-tubulin chain cloned as a
  filarial cDNA and predicted to encode Phe at benzimidazole-resistance
  position 200. It contains the conserved Tubulin/FtsZ GTPase and C-terminal
  beta-tubulin domains and is expected to heterodimerize with alpha-tubulin and
  supply the beta structural subunit of microtubules.
