  review:
    summary: >-
      EnsemblMetazoa transfer from the C. elegans ben-1 chemosensory-behavior
      row.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The transfer donor is the C. elegans BEN-1 beta-tubulin. Driscoll et al.
      cloned that donor as the beta-tubulin responsible for C. elegans
      benzimidazole sensitivity, but the worm review could not verify the
      chemosensory IMP from the abstract-only source. Even if the worm
