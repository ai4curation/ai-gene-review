knowledge_gaps:
- gap_statement: >-
    The contribution of O61358 to benzimidazole sensitivity or adult filarial
    benzimidazole insensitivity has not been genetically separated from other
    O. volvulus beta-tubulin isotypes.
  boundary: >-
    O61358 is a full-length filarial beta-tubulin cDNA and encodes the
    benzimidazole-sensitive Phe residue at codon 200. No O. volvulus
    loss-of-function, allele-swap, biochemical or resistance-mapping experiment
    has tested whether this cloned beta-tubulin isotype is a benzimidazole
    target.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the Onchocerca benzimidazole-sensitive isotype would define
    whether adult filarial benzimidazole insensitivity is explained by this
    beta-tubulin's sequence, expression, assembly context or drug exposure.
  resolution: >-
    Identify the O61358 genomic locus among the current O. volvulus
    beta-tubulin models, then perturb or edit this and paralogous isotypes and
    measure adult-worm microtubule integrity and benzimidazole response.
  provenance:
  - reference_id: PMID:9576511
    supporting_text: >-
      none of these drugs is clinically useful against adult filariae
    full_text_unavailable: true
suggested_questions:
- question: >-
    Which O. volvulus beta-tubulin gene model corresponds to the O61358 cDNA,
    which other isotypes are expressed in adult filariae, and do
    O61358-containing microtubules bind benzimidazoles despite the conserved
    Phe200 residue?
suggested_experiments:
- description: >-
    Map O61358 to the current O. volvulus genome, measure its stage and tissue
    expression against the other full-length beta-tubulin paralogs, and
    reconstitute O61358-containing alpha/beta-tubulin heterodimers for
    benzimidazole binding or polymerization assays.
  hypothesis: >-
    O61358 encodes a benzimidazole-sensitive beta-tubulin sequence, but adult
    O. volvulus benzimidazole insensitivity depends on isotype usage,
    microtubule assembly context or drug exposure rather than on Phe200 itself.
  experiment_type: biochemical reconstitution
