knowledge_gaps:
- gap_statement: >-
    The native host or parasite lipid cargoes carried by O. volvulus FAR-1,
    and the in vivo developmental, nutritional, or immunomodulatory phenotypes
    that depend on far-1, have not been directly identified.
  boundary: >-
    Recombinant Ov-FAR-1 directly binds all-trans-retinol and several
    long-chain fatty acids in vitro, and the native/filarial FAR-1 protein is
    released into culture medium by adult O. volvulus and by other assayed
    filarial species and stages.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    Native-ligand and perturbation data would test whether Ov-FAR-1 scavenges
    host retinoids, host fatty acids, or host-derived lipid signals during
    onchocerciasis rather than simply displaying broad recombinant binding in
    vitro.
  resolution: >-
    Purify native or excretory-secretory Ov-FAR-1 for LC-MS/MS ligand
    identification and pair far-1 perturbation or protein blockade with
    parasite lipid-uptake, development, and host-cell response assays.
  provenance:
  - reference_id: file:ONCVO/far-1/far-1-notes.md
    supporting_text: >-
      Ov-FAR-1 has direct in vitro fatty-acid and retinol-binding evidence and
      direct secretion evidence, but native in vivo cargoes, uptake routes, and
      immunomodulatory phenotypes in O. volvulus remain inferred from the FAR
      family model rather than directly assayed for Q25619.
suggested_questions:
- question: >-
    Which retinoids, fatty acids, or lipid mediators are bound by native
    Ov-FAR-1 during infection, and does Ov-FAR-1 preferentially scavenge
    host-derived arachidonic acid?
  experts:
  - Filarial nematode lipid biochemists
  - Nematode FAR protein specialists
suggested_experiments:
- description: >-
    Immunopurify native or excretory-secretory Ov-FAR-1 and identify
    co-purifying retinoids, fatty acids, and eicosanoid-related lipid signals
    by untargeted and targeted LC-MS/MS.
  hypothesis: >-
    Ov-FAR-1 carries a restricted host-derived lipid pool in vivo rather than
    binding fatty acids and retinol only as a recombinant in vitro activity.
  experiment_type: native ligand identification
- description: >-
    Perturb far-1 genetically or block secreted Ov-FAR-1 protein and assay
    parasite fatty-acid/retinoid uptake, parasite fitness, and host-cell
    inflammatory responses to O. volvulus excretory-secretory products.
  hypothesis: >-
    Secreted FAR-1 contributes to O. volvulus host lipid scavenging and
    host-interface immune modulation.
  experiment_type: perturbation
