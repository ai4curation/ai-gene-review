id: Q25619
gene_symbol: far-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6282
  label: Onchocerca volvulus
description: >-
  FAR-1 (Ov-FAR-1, Ov20, OvS1) is a small secreted fatty-acid and
  retinol-binding protein of the filarial nematode Onchocerca volvulus. The
  178-amino-acid precursor has a predicted N-terminal signal peptide and a
  helix-rich Gp-FAR-1/FARBP domain, placing it in PANTHER subfamily
  PTHR31418:SF7 with Brugia malayi and Caenorhabditis elegans FAR-1 proteins.
  Recombinant Ov-FAR-1 binds all-trans-retinol, fluorescent fatty-acid
  analogs, and long-chain fatty acids including oleic and arachidonic acids in
  fluorescence-based binding and competition assays. The native protein is
  detected in culture medium from adult parasites, and filarial FAR proteins
  were released into the medium by all species and stages tested in a
  comparative secretion study. These properties are consistent with an
  extracellular lipid-carrier role at the host-parasite interface, but the
  native cargoes and in vivo phenotypes of O. volvulus far-1 remain to be
  identified.
