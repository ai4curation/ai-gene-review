core_functions:
- description: >-
    Predicted O. volvulus Cys-loop GluCl-family receptor subunit with conserved
    extracellular ligand-binding and transmembrane signatures. A0A8R1TV31 is
    inferred to function as an extracellular ligand-gated monoatomic ion-channel
    subunit at the plasma membrane, but its exact ligand gating, ion
    selectivity, partner subunits, and parasite cell type have not been
    experimentally resolved.
  molecular_function:
    id: GO:0005230
    label: extracellular ligand-gated monoatomic ion channel activity
  directly_involved_in:
  - id: GO:0034220
    label: monoatomic ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *glucl_ligand_binding
  - *glucl_tm
knowledge_gaps:
- gap_statement: >-
    The native O. volvulus A0A8R1TV31 channel activity, receptor composition,
    cellular expression, and macrocyclic-lactone sensitivity have not been
    experimentally resolved.
  boundary: >-
    A0A8R1TV31 has complete predicted GluCl-family extracellular and
    transmembrane signatures and an intact PAR-like anion-selectivity motif in
    M2, and the PTHR18945 family review restricts chloride-transmembrane
    transport to invertebrate and GABA-A anion clades. However, the
    A0A8R1TV31 model appears N-terminally truncated, this accession is not a
    leaf in the cached PAINT tree, and no publication directly reconstitutes
    this Onchocerca subunit, establishes glutamate gating or chloride
    selectivity, or localizes it in parasite neurons or muscle; exact
    glutamate-gated chloride-channel activity therefore remains unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  significance: >-
    Defining the native receptor would test whether this O. volvulus subunit is
    a functional macrocyclic-lactone target and would identify whether the
    glc-3-like behavior transfers have any matching parasite circuit context.
  resolution: >-
    Express A0A8R1TV31 alone and with candidate O. volvulus GluCl subunits and
    ancillary factors in Xenopus oocytes or a nematode-expression system, then
    assay glutamate-gated chloride currents, ivermectin and moxidectin
    modulation, and native parasite expression.
  provenance:
  - *glucl_ligand_binding
  - *glucl_tm
  - *a0a8r1tv31_lbd_offset
  - *bruma_glc3_lbd_offset
  - *bruma_glc3_m1_offset
suggested_questions:
- question: >-
    Does A0A8R1TV31 form an Onchocerca GluCl receptor, and which O. volvulus
    partner subunits and cell types define its native channel?
  experts:
  - Filarial nematode neurophysiologists
  - Nematode GluCl pharmacology experts
suggested_experiments:
- description: >-
    Reconstitute A0A8R1TV31 with candidate O. volvulus GluCl subunits in
    Xenopus oocytes and measure glutamate-gated chloride currents and
    macrocyclic-lactone modulation by two-electrode voltage clamp.
  hypothesis: >-
    A0A8R1TV31 contributes to a heteromeric extracellularly glutamate-gated
    chloride channel with sensitivity to ivermectin or moxidectin.
  experiment_type: heterologous receptor reconstitution
