description: >-
  A0A8R1TV31 is an Onchocerca volvulus OVOC6009.1 Cys-loop receptor subunit
  predicted to belong to the nematode glutamate-gated chloride channel family,
  a receptor class targeted by macrocyclic-lactone anthelmintics. The
  deposited 455-residue model appears to be N-terminally truncated but retains
  GluCl-specific extracellular ligand-binding and transmembrane signatures plus
  a multi-pass receptor transmembrane region, consistent with a
  plasma-membrane extracellular ligand-gated ion-channel subunit. Its
  glutamate-gated current, chloride selectivity, native receptor composition,
  and cellular expression remain untested.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    The 455-aa OVOC6009.1 model appears to start within the N-terminal signal
    peptide. A0A8R1TV31 residue 9 aligns to BRUMA GLC-3 residue 42, and the
    same 33-residue offset separates their UniProtKB ligand-binding-domain and
    first transmembrane-segment coordinates (ONCVO 13..228 and 229..253 versus
    BRUMA 46..261 and 262..286). A0A8R1TV31 has no FT SIGNAL feature, unlike
    C. elegans GLC-3, and the EnsemblMetazoa OVOC6009.1 protein comes from an
    unannotated CDS on an EMBL genomic-DNA record. The suspected missing
    N-terminal signal peptide does not change the accepted generic receptor,
    channel, transport or plasma-membrane GO calls.
