- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002453
  review:
    summary: InterPro2GO beta-tubulin GTPase assignment.
    action: ACCEPT
    reason: >-
      O61359 has the conserved beta-tubulin GTPase fold and contributes the
      exchangeable GTP-binding half of the alpha/beta-tubulin heterodimer.
      UniProt's RuleBase-supported FUNCTION text places GTP hydrolysis in the
      post-cap microtubule polymer rather than in free tubulin and notes the
      alpha-tubulin contribution to that cycle. The term is therefore sound,
      but the InterPro2GO-generated qualifier overstates the relationship:
      beta-tubulin contributes the exchangeable GTP site to an interface-coupled
      tubulin nucleotide cycle rather than acting as a standalone monomeric
      GTPase. In contrast, beta-tubulin enables the structural-cytoskeleton
      activity captured in GO:0005200 as an intrinsic lattice subunit.
    supported_by:
    - *uniprot_domains
    - &uniprot_function
      reference_id: file:genes/ONCVO/O61359/O61359-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Microtubules grow by the addition of GTP-tubulin dimers to the
        microtubule end, where a stabilizing cap forms. Below the cap, tubulin
        dimers are in GDP-bound state, owing to GTPase activity of alpha-tubulin
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: INTERPRO
      record: InterPro:IPR002453
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        The InterPro2GO beta-tubulin mapping correctly reaches GTPase activity
        as the conserved alpha/beta-tubulin nucleotide cycle, but the generated
        GOA row uses enables for O61359. The beta-tubulin chain provides the
        exchangeable GTP-binding site whose GTP is hydrolyzed in the polymer
        with catalytic contribution from the adjacent alpha-tubulin, so the
        more accurate qualifier for a beta-tubulin chain is contributes_to.
      supported_by:
      - *uniprot_function
