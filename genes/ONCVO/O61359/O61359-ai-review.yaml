id: O61359
gene_symbol: tub
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6282
  label: Onchocerca volvulus
description: >-
  O61359 is a near-complete Onchocerca volvulus beta-tubulin chain with
  conserved Tubulin/FtsZ GTPase and C-terminal two-layer-sandwich domains. The
  chain is expected to heterodimerize with alpha-tubulin, supply beta
  structural subunits to the microtubule lattice, and carry Phe at the
  benzimidazole-resistance residue corresponding to beta-tubulin position 200.
