knowledge_gaps:
- gap_statement: >-
    The contribution of O61359 to benzimidazole sensitivity or adult filarial
    benzimidazole insensitivity has not been genetically separated from other
    O. volvulus beta-tubulin isotypes.
  boundary: >-
    O61359 is a near-complete filarial beta-tubulin sequence and encodes the
    benzimidazole-sensitive Phe residue at codon 200. No O. volvulus
    loss-of-function, allele-swap, biochemical or resistance-mapping experiment
    has tested whether this beta-tubulin isotype is a benzimidazole target.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the Onchocerca benzimidazole-sensitive isotype would define
    whether adult filarial benzimidazole insensitivity is explained by this
    beta-tubulin's sequence, expression, assembly context or drug exposure.
  resolution: >-
    Reconcile O61359 with the current O. volvulus beta-tubulin gene models,
    then perturb or edit this and paralogous isotypes and measure adult-worm
    microtubule integrity and benzimidazole response.
  provenance:
  - reference_id: PMID:9576511
    supporting_text: >-
      none of these drugs is clinically useful against adult filariae
    full_text_unavailable: true
suggested_questions:
- question: >-
    Does AF019886/O61359 represent the genomic locus for the AF019885/O61358
    cDNA?
- question: >-
    Which current O. volvulus beta-tubulin gene model corresponds to the
    AF019886/O61359 locus?
- question: >-
    Do O61359-containing microtubules bind benzimidazoles despite the conserved
    Phe200 residue?
suggested_experiments:
- description: >-
    Map O61359 to the current O. volvulus genome, measure its stage and tissue
    expression against the other full-length beta-tubulin paralogs, and
    reconstitute O61359-containing alpha/beta-tubulin heterodimers for
    benzimidazole binding or polymerization assays.
  hypothesis: >-
    O61359 encodes a benzimidazole-sensitive beta-tubulin sequence, but adult
    O. volvulus benzimidazole insensitivity depends on isotype usage,
    microtubule assembly context or drug exposure rather than on Phe200 itself.
  experiment_type: biochemical reconstitution
