- id: PMID:9576511
  title: >-
    Cloning and characterization of cDNAs encoding beta-tubulin from Dirofilaria
    immitis and Onchocerca volvulus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Geary et al. cloned filarial beta-tubulin sequences including an
      O. volvulus beta-tubulin and reported that the predicted filarial
      beta-tubulins encode Phe at benzimidazole-resistance position 200.
    supporting_text: >-
      We cloned and characterized cDNAs encoding beta-tubulin from 2 filariae,
      Dirofilaria immitis and Onchocerca volvulus ... All 4 filarial
      beta-tubulins are predicted to encode phe at this position, suggesting
      that filarial beta-tubulin is not inherently insensitive to the
      benzimidazoles.
  - statement: >-
      Geary et al. stated that they cloned the genomic locus for the O. volvulus
      beta-tubulin cDNA, supporting the interpretation that the AF019886/O61359
      genomic-DNA entry is paired with an O. volvulus cDNA from the same study.
    supporting_text: >-
      We cloned the genomic locus for the O. volvulus beta-tubulin cDNA and
      compared its organization to the reported genomic loci for beta-tubulin in
      B. pahangi and O. gibsoni.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the direct filarial beta-tubulin cloning paper behind O61359 and
      its companion O. volvulus beta-tubulin cDNA entry.
- id: PMID:24780738
  title: In situ imaging in C. elegans reveals developmental regulation of
    microtubule dynamics.
  findings:
  - statement: >-
      Lacroix et al. identified a TBB-5 beta-tubulin RNAi requirement in
      C. elegans uterine muscle cells during egg laying, consistent with a
      cell-level microtubule requirement rather than direct participation in the
      organism-level egg-laying behavior.
    supporting_text: >-
      Tissue-specific RNAi of 5 of these MAPs induced Egl (Figure 5A; KLP-7,
      KLP-13, CCPP-6, TTLL-15, and TBB-5), confirming that they act in egg
      laying via a role in the non-neuronal cells of the egg-laying apparatus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This C. elegans paper supplies the TBB-5 cell-level egg-laying-apparatus
      phenotype that should not be promoted to direct O. volvulus O61359
      participation in organism-level egg-laying behavior.
- id: PMID:6087508
  title: Observations on adult Onchocerca volvulus maintained in vitro.
  full_text_unavailable: true
  findings:
  - statement: >-
      Adult O. volvulus females release first-stage microfilariae rather than
      eggs.
    supporting_text: >-
      Up to 4,000 microfilariae were expelled by each female per day
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This O. volvulus adult culture paper verifies that gravid females release
      microfilariae, supporting removal of the transferred egg-laying behavior
      row.
- id: PMID:2592410
  title: >-
    Genetic and molecular analysis of a Caenorhabditis elegans beta-tubulin
    that conveys benzimidazole sensitivity.
  full_text_unavailable: true
  findings:
  - statement: >-
      C. elegans ben-1 encodes a beta-tubulin whose deletion confers full
      benzimidazole resistance while leaving animals viable and coordinated.
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs,
      the ben-1 product appears to be the only benzimidazole-sensitive
      beta-tubulin in C. elegans.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      This is a cross-species donor paper for C. elegans BEN-1 identity and
      benzimidazole sensitivity, not direct evidence for O. volvulus O61359
      function.
