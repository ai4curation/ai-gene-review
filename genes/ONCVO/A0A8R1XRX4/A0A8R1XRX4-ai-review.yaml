core_functions:
- description: >-
    Predicted O. volvulus Cys-loop GluCl-family receptor subunit with conserved
    extracellular ligand-binding and transmembrane domains. A0A8R1XRX4 is
    inferred to enable extracellularly glutamate-gated chloride-channel
    activity by orthology to C. elegans GLC-2, but its native receptor partners
    and pharmacology have not been experimentally resolved.
  molecular_function:
    id: GO:0008068
    label: extracellularly glutamate-gated chloride channel activity
  directly_involved_in:
  - id: GO:1902476
    label: chloride transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
