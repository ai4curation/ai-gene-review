  label: Onchocerca volvulus
description: >-
  A0A8R1XRX4 is an Onchocerca volvulus Cys-loop glutamate-gated chloride
  channel family subunit. The 431-residue protein has the extracellular GluCl
  ligand-binding signature, a GluCl-family transmembrane signature, and four
  predicted transmembrane helices, consistent with a plasma-membrane pentameric
  ligand-gated chloride channel subunit that contributes to chloride
  transmembrane transport. Its native O. volvulus receptor composition,
  cellular expression, and macrocyclic-lactone pharmacology remain untested.
