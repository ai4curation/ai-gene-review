  - *glucl_tm
knowledge_gaps:
- gap_statement: >-
    The native O. volvulus A0A8R1XRX4-containing receptor composition,
    cellular expression, and macrocyclic-lactone sensitivity have not been
    experimentally resolved.
  boundary: >-
    A0A8R1XRX4 has complete predicted GluCl-family extracellular and
    transmembrane signatures consistent with an extracellularly glutamate-gated
    chloride channel, but no publication directly reconstitutes the Onchocerca
    channel or localizes this subunit in parasite neurons or muscle.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  significance: >-
    Defining the native receptor would test whether this O. volvulus subunit is
    a functional macrocyclic-lactone target and would identify its native GluCl
    complex.
  resolution: >-
    Express A0A8R1XRX4 alone and with candidate O. volvulus GluCl subunits and
    ancillary factors in Xenopus oocytes or a nematode-expression system, then
    assay glutamate-gated chloride currents, ivermectin and moxidectin
    modulation, and native parasite expression.
  provenance:
  - *glucl_ligand_binding
  - *glucl_tm
suggested_questions:
- question: >-
    Does A0A8R1XRX4 form an Onchocerca heteromeric GluCl receptor, and which
    O. volvulus GluCl subunits pair with it in the native
    macrocyclic-lactone-sensitive channel?
  experts:
  - Filarial nematode neurophysiologists
  - Nematode GluCl pharmacology experts
suggested_experiments:
- description: >-
    Reconstitute A0A8R1XRX4 with candidate O. volvulus GluCl subunits in
    Xenopus oocytes and measure glutamate-gated chloride currents
    and macrocyclic-lactone modulation by two-electrode voltage clamp.
  hypothesis: >-
    A0A8R1XRX4 contributes to a heteromeric ivermectin- or
    moxidectin-sensitive glutamate-gated chloride channel.
  experiment_type: heterologous receptor reconstitution
