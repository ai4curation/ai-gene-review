knowledge_gaps:
- gap_statement: >-
    The full-length O. volvulus GluClX coding sequence, native subunit
    partners, and electrophysiological properties have not been resolved.
  boundary: >-
    The Q25634 record covers a 351-amino acid fragment with extracellular
    GluCl-family and anion-channel transmembrane signatures, M1, the complete
    M2 pore helix, and M3, but it lacks the M3-M4 intracellular loop and M4,
    and no publication directly reconstitutes an Onchocerca GluClX channel.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    A complete receptor sequence and direct channel assay would show whether
    GluClX belongs to an ivermectin-sensitive Onchocerca GluCl subtype or only
    marks a partial conserved filarial GluCl fragment.
  resolution: >-
    Clone the full-length O. volvulus GluClX transcript, express it alone and
    with candidate Onchocerca GluCl partners in Xenopus oocytes, and measure
    glutamate-evoked chloride currents and macrocyclic-lactone modulation.
  provenance:
  - *record_fragment
suggested_questions:
- question: >-
    What full-length O. volvulus GluCl subunit contains the Q25634 GluClX
    fragment, and can it form a glutamate- and macrocyclic-lactone-gated
    chloride channel with other filarial GluCl subunits?
  experts:
  - Parasitic nematode neurophysiologists
  - Nematode GluCl pharmacology experts
suggested_experiments:
- description: >-
    Complete the O. volvulus GluClX cDNA by RACE, coexpress the full-length
    subunit with candidate Onchocerca AVR-14, GLC-2, GLC-3, and GLC-4 partners
    in Xenopus oocytes, and record glutamate- and ivermectin-evoked chloride
    currents.
  hypothesis: >-
    Q25634 is a fragment of a full-length filarial GluCl subunit that requires
    a compatible native partner to form an ivermectin-sensitive
    glutamate-gated chloride channel.
  experiment_type: heterologous receptor reconstitution
