    review_notes: >-
      The UniProtKB record provides the exact ONCVO accession, gene symbol,
      literature-linked EMBL identifier, PTHR18945 membership, CDD
      GluCl-family signatures, predicted signal peptide and M1/M3
      transmembrane helices, the PAR/M2 pore-region sequence, and the
      C-terminal non-terminus feature that bounds the review's inference.
- id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
  title: PTHR18945 neurotransmitter-gated ion channel family review
  findings:
  - statement: >-
      PTHR18945 spans both cation- and anion-selective Cys-loop channels, so
      broad receptor and ion-channel architecture are safer family-wide than
      exact ligand or ion selectivity.
    supporting_text: >-
      invertebrate chloride channels gated by glutamate, histamine,
      acetylcholine, serotonin, tyramine or protons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The family review explains why Q25634 should be interpreted within the
      broad pentameric ligand-gated ion-channel family but should not inherit
      ligand-specific claims from PTHR18945 alone.
