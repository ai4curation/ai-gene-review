core_functions:
- description: >-
    Partial GluCl-family Cys-loop receptor subunit inferred to contribute to
    an extracellularly glutamate-gated chloride channel in O. volvulus. The
    inference is based on the literature-linked GluClX cDNA fragment and
    conserved extracellular GluCl and anion-channel transmembrane signatures;
    the complete native receptor has not been reconstructed.
  contributes_to_molecular_function:
