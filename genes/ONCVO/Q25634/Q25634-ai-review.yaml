id: Q25634
gene_symbol: GluClX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6282
  label: Onchocerca volvulus
description: >-
  GluClX is an Onchocerca volvulus Cys-loop glutamate-gated chloride channel
  subunit fragment cloned as the partial EMBL U59745 transcript. The 351-amino
  acid UniProtKB record contains the signal peptide, extracellular GluCl-family
  ligand-binding domain, the M1/M2/M3 region with the PAR anion-selectivity
  motif, and the anion-channel transmembrane signature of a plasma-membrane
  pentameric ligand-gated ion channel, but it lacks the M3-M4 intracellular loop
  and M4 helix. The available O. volvulus record therefore supports a filarial
  GluCl subunit inference but leaves the full-length coding sequence, native
  receptor composition, and direct electrophysiology of GluClX-containing
  channels unresolved.
