    action: NEW
    reason: >-
      UniProtKB ties Q25634 to the partial O. volvulus U59745 GluClX cDNA from
      Cully et al., and the sequence has a GluCl-family extracellular domain
      plus an anion-selective Cys-loop transmembrane signature. That
      combination supports inference that the complete native protein
