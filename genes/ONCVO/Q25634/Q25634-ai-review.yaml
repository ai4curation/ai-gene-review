- id: PMID:9051935
  title: >-
    Molecular biology and electrophysiology of glutamate-gated chloride
    channels of invertebrates.
  findings:
  - statement: >-
      Cully et al. summarized cloned invertebrate glutamate-gated chloride
      channels, including nematode sequences that represent avermectin target
      candidates.
    supporting_text: >-
      glutamate-gated chloride channels have been cloned from several
      nematodes and Drosophila
  - statement: >-
      The review summarizes the experimental paradigm in which cloned
      invertebrate GluCl channels are characterized by Xenopus oocyte
      expression.
    supporting_text: >-
      The pharmacology and electrophysiological properties of these channels
      have been studied by expression in Xenopus oocytes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only review support for the broader 1990s invertebrate GluCl
      cloning and oocyte-expression literature. UniProtKB cites this PMID for
      the Q25634 O. volvulus U59745 nucleotide sequence, but the accessible
      abstract does not say that O. volvulus GluClX itself was expressed or
      functionally tested.
