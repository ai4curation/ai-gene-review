description: Keratin-associated protein 8-1 (KRTAP8-1; wool HGT protein component 0.62) is a 62-aa high glycine-tyrosine
  (HGT) keratin-associated protein of sheep wool, whose protein sequence was first determined directly from wool
  keratin. HGT KAP genes are the first KAP genes expressed in the wool follicle, and their products are concentrated
  in the orthocortex. In the keratinizing cortex KRTAP8-1 forms part of the interfilamentous matrix that surrounds
  wool keratin intermediate filaments; in vitro, KAP8.1 binds the head domain of the trichocyte keratin K85 and
  promotes filament bundling, and it has been proposed to help organize the helical intermediate-filament arrangement
  of the orthocortex that underlies fibre crimp. Variation in ovine KRTAP8-1 is associated with staple length and
  fibre opacity.
