description: Keratin-associated protein 6-1 (KRTAP6-1; KAP6.1) is an 83-aa basic high glycine-tyrosine (HGT) keratin-associated
  protein of sheep wool, with glycine plus tyrosine making up about 60 mol% of its residues. KAP6 genes are expressed
  relatively late in follicle differentiation in the cortical cells of the wool and hair shaft, and HGT KAPs are
  concentrated in the orthocortex of the fibre. In the keratinizing cortex KRTAP6-1 forms part of the interfilamentous
  matrix that surrounds the wool keratin intermediate filaments. Genetic variation in ovine KRTAP6-1, including
  a 57-bp in-frame deletion, is associated with mean fibre diameter and fibre diameter variability in several sheep
  breeds, indicating that this matrix protein influences fibre morphology.
