description: Keratin-associated protein 3-1 (KRTAP3-1; wool high-sulfur protein BIIIB2) is a 98-aa high-sulfur keratin-associated
  protein of sheep wool. It was among the first KAPs characterized, by direct amino-acid sequencing of the high-sulfur
  protein fraction extracted from Merino wool. KAP3 proteins are expressed in the wool follicle cortex, first in
  orthocortical cells and then in all cortical cells. In the keratinizing cortex, KRTAP3-1 forms part of the interfilamentous
  matrix in which the wool keratin intermediate filaments are embedded; its cysteine residues form disulfide cross-links
  with the head and tail domains of wool keratins and with other matrix proteins, contributing to the rigidity and
  mechanical properties of the wool fibre.
