suggested_questions:
- question: Which keratin residues or domains does KRTAP3-1 cross-link or bind in the fibre, and does it pair preferentially
    with particular type I/type II trichocyte keratins or other KAPs?
- question: Is KRTAP3-1 functionally redundant with its paralogues in the same KAP cluster, or does its loss change
    fibre mechanics, diameter or curvature?
suggested_experiments:
- description: Generate a KRTAP3-1 knockout (CRISPR, ideally together with close paralogues) and measure fibre tensile
    strength, diameter, curvature and ortho/para-cortex organization, with keratin/KAP proteomics of the fibre.
  hypothesis: KRTAP3-1 contributes non-redundantly to fibre mechanics or morphology.
  experiment_type: knockout phenotyping
- description: Map KRTAP3-1-keratin cross-links in native fibres by cross-linking mass spectrometry, and test binding
    of recombinant protein to trichocyte keratin head domains (ITC/pull-down) under non-reducing and reducing conditions.
  hypothesis: KRTAP3-1 associates with specific keratin head/tail domains.
  experiment_type: biochemical binding / XL-MS
