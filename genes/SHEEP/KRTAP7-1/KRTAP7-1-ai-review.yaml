- id: file:SHEEP/KRTAP7-1/KRTAP7-1-deep-research-openscientist.md
  title: OpenScientist deep-research report on sheep KRTAP7-1
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Checked against cached PubMed records. Verified quotes: ovine chromosome 1 cluster order and three
      KAP classes (PMID:25279319), HGT-KAPs predominantly orthocortical (PMID:25782086), reduced KAP6/7/8 in straight
      crimp-mutant wool (PMID:34859500), KRTAP7-1 association with yield (P = 0.017) and staple length (P = 0.024)
      (PMID:31863114), orthocortical-side expression of Gly/Tyr-rich proteins (PMID:17697142), KAP6 late expression
      and sheep-rabbit conservation (PMID:7680040), two keratin conformations (PMID:29797268), JN091630 naming
      (PMID:22298953). Disputed: the report states that KAP7 is expressed late in keratinization by analogy to KAP6
      (PMID:7680040), but the KRTAP7-1-specific study PMID:22044071 states that HGT KAP genes are the first KAP genes
      expressed, just after the keratins; this review keeps the early-expression statement. Unsupported speculation:
      isodityrosine or di-tyrosine cross-linking by KRTAP7-1, and the "flexibility/crimp" vs "rigidity" mechanical
      partition table, which no cited paper tests for KRTAP7-1. The report itself concedes that there is no
      KRTAP7-1-specific functional assay and that orthocortex localization is class/family level. Used only as leads;
      no annotation rests on it alone.'
core_functions:
- description: 'Structural matrix constituent of the keratinized wool fibre: as a high glycine-tyrosine (HGT) KAP,
    KRTAP7-1 is deposited in differentiating cortical keratinocytes around the trichocyte keratin intermediate filaments
    and becomes cross-linked (chiefly by disulfide bonds for cysteine-rich KAPs) to keratin head/tail domains and
    to other matrix proteins, forming the interfilamentous matrix that gives the fibre its rigidity and mechanical
    resistance.'
