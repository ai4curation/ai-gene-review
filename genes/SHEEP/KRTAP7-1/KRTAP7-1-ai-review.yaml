description: Keratin-associated protein 7-1 (KRTAP7-1; HGT component C2) is an 85-aa basic high glycine-tyrosine
  (HGT) keratin-associated protein of sheep wool and the only member of the KAP7 family. Its gene was isolated as
  one of the two genes encoding the major HGT keratins of wool. HGT KAP genes are the first KAP genes switched on
  in the wool follicle, just after the keratin genes, and their products are concentrated in the orthocortex. In
  the keratinizing cortex KRTAP7-1 forms part of the interfilamentous matrix that surrounds wool keratin intermediate
  filaments. A coding variant (p.Ser58Asn) has been reported, and KRTAP7-1 variation has been associated with clean
  wool yield and staple length.
