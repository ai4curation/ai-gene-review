- id: PMID:8898919
  title: The carotenoid 7,8-dihydro-psi end group can be cyclized by the lycopene cyclases
    from the bacterium Erwinia uredovora and the higher plant Capsicum annuum.
  full_text_unavailable: true
  findings:
  - statement: >-
      Showed that the Erwinia uredovora (Pantoea ananatis) CrtY cyclase is
      promiscuous at the ring precursor, converting neurosporene to
      7,8-dihydro-beta-carotene via monocyclic beta-zeacarotene and cyclizing
      zeta-carotene to a bicyclic tetrahydro-beta-carotene.
    supporting_text: Further introduction of the lycopene cyclase gene from E. uredovora
