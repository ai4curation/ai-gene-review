core_functions:
- description: >-
    Lycopene beta-cyclase activity: CrtY binds the extremely hydrophobic
    all-trans-lycopene at the inner-membrane surface and folds each acyclic psi
    end into a beta-ionone ring, converting lycopene to bicyclic
    all-trans-beta-carotene through the monocyclic intermediate gamma-carotene.
    The reaction is a non-redox cycloisomerization (EC 5.5.1.19): reduced FAD is
    an essential cofactor that stabilizes the positively charged reaction
    intermediate, proton attack from water at C-2 initiates ring closure, and
    NAD(P)H stimulates activity indirectly without being incorporated. The
    beta-carotene product is the precursor handed to the downstream hydroxylase
    CrtZ, so this activity sets entry into the cyclic (provitamin A) carotenoid
    branch of the pathway.
  molecular_function:
    id: GO:0045436
    label: lycopene beta cyclase activity
  directly_involved_in:
  - id: GO:0016117
    label: carotenoid biosynthetic process
  - id: GO:1901812
    label: beta-carotene biosynthetic process
