      Showed by isotope-labelling that the hydrogen introduced at C-2 during
      cyclization comes from water, not from NADPH, confirming proton-initiated
      acid-base catalysis and an indirect (allosteric) role for NAD(P)H.
    supporting_text: the hydrogen atom introduced at C(2) in the cyclization comes from
      water and not from NADPH
  - statement: >-
      Concluded that NADPH is not involved directly in the cyclization and acts
