- term:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or
      reduction of molecular oxygen
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010108
  review:
    summary: >-
      InterPro2GO assigns an oxygen-dependent oxidoreductase activity from the
      lycopene-cyclase signature IPR010108, misled by the FAD/NAD(P)-binding
      fold. CrtY is a non-redox cycloisomerase that neither uses nor incorporates
      molecular oxygen, so this molecular-function term is biologically wrong.
    action: REMOVE
    reason: >-
      GO:0016705 is defined (verified against QuickGO) as catalysis of an
      oxidation-reduction reaction in which hydrogen or electrons are transferred
      from two donors and molecular oxygen is reduced or incorporated into a
      donor. Every element of that definition is contradicted by the established
      chemistry of CrtY. The enzyme is an isomerase (EC 5.5.1.19): its
      cyclization produces no net oxidation or reduction of the carotenoid, and
      no molecular oxygen is used. PubMed:20178989 showed that a mechanism
      relying on cryptic net electron transfer can be refuted and placed lycopene
      cyclase among the novel class of non-redox flavoproteins; PubMed:11943208
      showed the hydrogen introduced at C-2 comes from water and not from NADPH,
      confirming proton-initiated acid-base catalysis rather than redox
      chemistry. The signature that produced this row, IPR010108, is the
      lycopene-cyclase family entry, and the same UniProt record matches an
      FAD/NAD(P)-binding superfamily fold (Gene3D 3.50.50.60, SUPFAM SSF51905);
      that fold is what misled the automatic mapping, because a
      dinucleotide-binding fold does not imply an oxygen-dependent redox reaction.
      Reduced FAD
      is required only to stabilize the carbocation-like transition state, not as
      a terminal oxidant. This is a fold-driven over-annotation that is
      contradicted by direct experiment.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: InterPro:IPR010108
