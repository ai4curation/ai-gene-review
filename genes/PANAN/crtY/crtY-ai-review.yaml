id: P21687
gene_symbol: crtY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:553
  label: Pantoea ananatis
description: >-
  CrtY is the lycopene beta-cyclase of the carotenoid-producing enterobacterium
  Pantoea ananatis (historically Erwinia uredovora), a 382-residue FAD-dependent
  enzyme of the lycopene cyclase family. It catalyses the double cyclization that
  converts the acyclic C40 hydrocarbon all-trans-lycopene into bicyclic
  all-trans-beta-carotene, forming one beta-ionone ring at each acyclic psi end
  by way of the monocyclic intermediate gamma-carotene. The reaction is a
  cycloisomerization (EC 5.5.1.19): despite the flavoprotein-like
  FAD/NAD(P)-binding fold, no net oxidation or reduction of the carotenoid takes
  place and no molecular oxygen is used or incorporated. Reduced FAD is the essential
  cofactor; it is proposed to stabilize a positively charged transition state or
  carbocation intermediate, while proton attack from water at C-2 of the folded
  psi end group initiates ring closure. NAD(P)H stimulates activity but is not
  incorporated and acts indirectly, most likely by maintaining FAD in its reduced
  state or as an allosteric activator. The enzyme is promiscuous at the
  ring-precursor level, also cyclizing neurosporene to 7,8-dihydro-beta-carotene via
  beta-zeacarotene and zeta-carotene to a tetrahydro-beta-carotene. CrtY is a
  membrane-associated peripheral enzyme of the inner (cytoplasmic) membrane,
  acting on its extremely hydrophobic membrane-embedded substrate. In the Pantoea
  crt gene cluster it acts on the lycopene supplied by the CrtE/CrtB/CrtI segment
  and hands beta-carotene to the hydroxylase CrtZ and glucosyltransferase CrtX,
  and it is a standard tool for reconstructing beta-carotene biosynthesis in
  heterologous hosts.
