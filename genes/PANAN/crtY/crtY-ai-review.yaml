    supporting_text: 'Name=FAD; Xref=ChEBI:CHEBI:57692;'
  - reference_id: PMID:20178989
    supporting_text: We show that reduced FAD is the essential lycopene cyclase (CrtY)
      cofactor
  - reference_id: PMID:11943208
    supporting_text: No hydrogen is transferred from NADPH, which is therefore not involved
      directly in the cyclization reaction, but must play an indirect role, e.g. as an
      allosteric activator.
knowledge_gaps:
- gap_statement: >-
    No experimental three-dimensional structure of CrtY has been determined, so
    the residues that bind FAD and lycopene and the geometry that positions the
    psi end group for proton-initiated ring closure are not directly known.
  boundary: >-
    The reaction, substrate, product, EC classification, FAD requirement and the
    non-redox mechanism are established by direct biochemistry, and one catalytic
    residue is identified (the E199A mutant loses activity while still binding
    FAD). What is missing is an atomic-resolution model of the active site.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    A structure would explain how a flavoprotein fold supports a non-redox
    cycloisomerization, locate the acid-base machinery that Glu-199 belongs to,
    and guide engineering of ring specificity in heterologous carotenoid
    production.
  resolution: >-
    Crystallography or cryo-EM of CrtY with bound FAD and a lycopene analogue,
    combined with site-directed mutagenesis around the proposed catalytic
    residues.
  provenance:
  - reference_id: file:PANAN/crtY/crtY-deep-research-falcon.md
    supporting_text: No experimentally solved three-dimensional structure of P21687
      was identified in the retrieved literature.
    reference_section_type: OTHER
- gap_statement: >-
    The membrane association of CrtY has not been characterized at the level of
    topology or orientation: it is treated as a peripheral, membrane-associated
    enzyme, but whether and how it docks onto the cytoplasmic face of the inner
    membrane is not resolved.
  boundary: >-
    The inner-membrane location is experimentally supported and the sequence
    carries no signal peptide or transmembrane span, so an integral multipass
    topology is excluded; the unresolved point is the nature of the peripheral
    interaction and how the hydrophobic substrate is accessed.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    How CrtY engages the membrane bears on how the insoluble lycopene substrate
    is delivered and how beta-carotene is handed to the downstream membrane
    enzymes CrtZ and CrtX.
  resolution: >-
    Cell fractionation with membrane and soluble marker controls,
    protease-accessibility assays on inverted and right-side-out vesicles, and
    imaging of a functional tagged allele in the native organism.
  provenance:
  - reference_id: file:PANAN/crtY/crtY-deep-research-falcon.md
    supporting_text: membrane-associated/peripheral enzyme acting on a membrane-embedded
      substrate
    reference_section_type: OTHER
suggested_questions:
- question: >-
    How does a reduced FAD cofactor promote a reaction with no net redox change
    in the carotenoid; does it stabilize a carbocation intermediate as proposed,
    and which active-site residues complete the acid-base machinery alongside
    Glu-199?
- question: >-
    What is the structural basis for the two-end double cyclization; does CrtY
    process both psi ends in a single active site sequentially via gamma-carotene,
    and what determines the strict beta-ring (versus epsilon-ring) outcome?
- question: >-
    How is CrtY positioned at the inner membrane and how does it acquire its
    membrane-embedded lycopene substrate and release beta-carotene to CrtZ; is
    there a physical or kinetic coupling among the crt-cluster enzymes?
suggested_experiments:
- experiment_type: structure determination and site-directed mutagenesis
  hypothesis: >-
    CrtY uses a flavoprotein fold to house an acid-base cycloisomerase active
    site in which reduced FAD stabilizes a positively charged intermediate while
    a network including Glu-199 provides the proton chemistry, and no residue
    performs oxygen-dependent redox catalysis.
  description: >-
    Determine the structure of CrtY with bound FAD and a non-reactive lycopene
    analogue by crystallography or cryo-EM, identify the FAD and substrate
    pockets, and test candidate catalytic residues (including the region around
    Glu-199) by alanine substitution, measuring the effect on activity, FAD
    binding and product ring stereochemistry.
- experiment_type: cofactor and mechanism assay
  hypothesis: >-
    Reduced FAD is required for catalysis but is not consumed and effects no net
    oxidation or reduction of the carotenoid, and NAD(P)H acts only to regenerate
    or maintain reduced FAD rather than participating in the cyclization.
  description: >-
    Reconstitute purified CrtY with defined FAD redox states and with flavin
    analogues, quantify turnover and any change in flavin oxidation state during
    catalysis by spectroscopy and mass spectrometry, and test isotope
    incorporation from labelled NAD(P)H and from solvent water into the product
    to confirm the proton source and the absence of net redox chemistry.
- experiment_type: subcellular fractionation and imaging
  hypothesis: >-
    CrtY is a peripheral enzyme of the cytoplasmic face of the inner membrane
    rather than a soluble cytoplasmic protein or an integral membrane protein.
  description: >-
    Fractionate Pantoea ananatis into soluble and membrane fractions with
    validated marker controls, locate CrtY by immunoblot, probe the strength and
    orientation of the membrane association by salt and carbonate extraction and
    protease-accessibility assays on sealed vesicles, and image a functional
    tagged allele in the native organism.
- experiment_type: substrate specificity panel
  hypothesis: >-
    CrtY cyclizes a range of psi and 7,8-dihydro-psi end groups but favours
    all-trans-lycopene as its physiological substrate.
  description: >-
    Assay purified CrtY against a graded panel of acyclic carotenes including
    lycopene, neurosporene and zeta-carotene, determine steady-state kinetics for
    each, and identify the mono- and bicyclic products by HPLC and mass
    spectrometry to map the tolerance for reduced terminal structures already
    reported qualitatively.
