      bicyclic carotenoid, 7,8-dihydro-beta-carotene, via monocyclic beta-zeacarotene.
  - statement: >-
      Demonstrated that CrtY cyclizes a 7,8-dihydro-psi end group in addition to
      the usual psi end group, defining its substrate tolerance.
