          fold; InterPro2GO read the flavoprotein architecture as an
          oxygen-dependent oxidoreductase, but the family reaction is a non-redox
          cycloisomerization that uses no molecular oxygen.
    supported_by:
    - reference_id: PMID:20178989
      supporting_text: Lycopene cyclase, thus, ranks among the novel class of non-redox
        flavoproteins
    - reference_id: PMID:20178989
      supporting_text: evidence was obtained based on which a catalytic mechanism relying
        on cryptic (net) electron transfer can be refuted
    - reference_id: PMID:11943208
      supporting_text: the hydrogen atom introduced at C(2) in the cyclization comes
        from water and not from NADPH
    - reference_id: file:PANAN/crtY/crtY-uniprot.txt
      supporting_text: 'Gene3D; 3.50.50.60; FAD/NAD(P)-binding domain; 1.'
