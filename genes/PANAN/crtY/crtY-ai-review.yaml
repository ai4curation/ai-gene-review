      UniProt records the subcellular location as "Cell inner membrane" with
      experimental evidence (ECO:0000269) attributed to PubMed:20178989, together
      with the note that the enzyme is membrane-bound. The cached copy of this
      paper is abstract-only and the abstract is mechanism-focused, so the
