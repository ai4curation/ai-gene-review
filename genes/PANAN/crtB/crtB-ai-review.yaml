- id: PMID:9593819
  title: Expression of an active phytoene synthase from Erwinia uredovora and biochemical
    properties of the enzyme.
  full_text_unavailable: true
  findings:
  - statement: >-
      Overexpressed and partially purified the crtB product from this organism and
      demonstrated conversion of GGPP to phytoene in vitro, with the product
      confirmed against authentic standards.
    supporting_text: A non-radioactive assay was developed that enabled the conversion
      of GGPP to phytoene.
  - statement: >-
      Established the cofactor requirement as ATP together with either manganese
      or magnesium, with no nicotinamide cofactor, which distinguishes the enzyme
      from NAD(P)H-dependent squalene synthases.
    supporting_text: The essential cofactors required were ATP in combinations with
      either Mn2+ or Mg2+.
  - statement: >-
      Determined a Km of 41 microM for the GGPP substrate.
    supporting_text: The Km value for GGPP was determined as 41 microM.
  - statement: >-
      Showed that CrtB expression depletes the host geranylgeranyl diphosphate
      pool and that co-expression of the separate GGPP synthase crtE relieves the
      resulting growth defect, establishing GGPP as substrate rather than product.
    supporting_text: Presumably inhibition of growth arose from the depletion of the
      substrate geranylgeranyl pyrophosphate (GGPP)
  - statement: >-
      Reported inhibition by phosphate and by squalestatin, a squalene synthase
      inhibitor, reflecting the active-site architecture shared with squalene
      synthases rather than squalene synthase activity.
    supporting_text: Phytoene synthesis was inhibited by phosphate ions and squalestatin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of both IDA rows and the primary evidence for this review. The
      title names Erwinia uredovora, the historical name for Pantoea ananatis, so
      it matches the UniProt organism despite the apparent discrepancy. The cache
      is abstract-only, but the abstract itself states each result relied on here,
      so no annotation required deferral to unread full text.
