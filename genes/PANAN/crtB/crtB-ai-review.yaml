- term:
    id: GO:0051996
    label: squalene synthase [NAD(P)H] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033904
  review:
    summary: >-
      InterPro2GO assigns the paralogous squalene synthase activity from
      IPR033904, the head-to-head trans-IPPS domain that phytoene synthases and
      squalene synthases share by construction. CrtB uses a different substrate,
      makes a different product, and requires no NAD(P)H.
    action: REMOVE
    reason: >-
      GO:0051996 is defined as the NAD(P)H-dependent condensation of two farnesyl
      diphosphate molecules to squalene, verified against QuickGO, and every
      component of that definition is wrong for CrtB: the substrate is the C20
      geranylgeranyl diphosphate rather than the C15 farnesyl diphosphate, and
      the product is the C40 phytoene rather than the C30 squalene. The
      nicotinamide requirement is the decisive and most informative discrepancy.
      Squalene synthase and phytoene synthase are genuine homologues and both
      form a cyclopropylcarbinyl diphosphate intermediate by head-to-head
      condensation, which for this protein UniProt records explicitly as
      prephytoene diphosphate. The families diverge at the second half-step:
      squalene synthase reductively opens the intermediate using NADPH, whereas
      phytoene synthase instead eliminates a proton, which is exactly why the
      product carries the central 15-cis double bond and why no nicotinamide
      cofactor is needed. The experimentally determined cofactor set for this
      enzyme is ATP with Mn2+ or Mg2+ and contains no NAD(P)H, so the single
      feature that names GO:0051996 is the step CrtB demonstrably does not
      perform. IPR033904 is the shared head-to-head domain, matched on the same
      UniProt record by CDD cd00683, and therefore cannot discriminate between
      the two families. One contrary observation was weighed and rejected: CrtB
      is inhibited by squalestatin, a squalene synthase inhibitor, but inhibitor
      cross-reactivity reports active-site similarity, which the shared fold
      already explains and which is the very reason this signature matches;
      being inhibited by a drug aimed at a homologue is not evidence of
      catalysing the homologue's reaction.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR033904
        source_label: Trans_IPPS_HH
        source_status: SOURCE_BAD
        comment: >-
          Head-to-head trans-IPPS domain common to squalene synthases and
          phytoene synthases; shared by construction, so it cannot assign the
          squalene-specific, NAD(P)H-dependent activity to a phytoene synthase.
    supported_by:
    - reference_id: PMID:9593819
      supporting_text: The essential cofactors required were ATP in combinations with
        either Mn2+ or Mg2+.
    - reference_id: PMID:9593819
      supporting_text: Phytoene synthesis was inhibited by phosphate ions and squalestatin.
    - reference_id: file:PANAN/crtB/crtB-uniprot.txt
      supporting_text: 'InterPro; IPR033904; Trans_IPPS_HH.'
    - reference_id: file:PANAN/crtB/crtB-uniprot.txt
      supporting_text: The enzyme produces 15-cis-phytoene.
core_functions:
- description: >-
    Committed entry step of C40 carotenoid biosynthesis. CrtB binds two molecules
    of geranylgeranyl diphosphate from the cellular isoprenoid pool and joins them
    head-to-head, first forming the cyclopropylcarbinyl intermediate prephytoene
    diphosphate and then rearranging it with loss of a proton to release
    15-cis-phytoene and diphosphate. Catalysis requires ATP, which is not
    hydrolysed, together with Mn2+ or Mg2+. The product is passed to the
    desaturase CrtI and onward to CrtY and CrtZ, so this activity sets carbon
    entry into the whole carotenoid branch. No cellular component is asserted:
    there is no localization experiment for this protein, and the two plausible
    placements, bacterial cytoplasm and the cytoplasmic face of the membrane
    where the hydrophobic product partitions, are not distinguished by any
    available evidence. That unknown is recorded as a knowledge gap rather than
    resolved by assumption.
