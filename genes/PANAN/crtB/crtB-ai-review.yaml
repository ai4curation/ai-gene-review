- term:
    id: GO:0004311
    label: geranylgeranyl diphosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044843
  review:
    summary: >-
      InterPro2GO assigns GGPP synthase activity from IPR044843, a fold-level
      trans-isoprenyl diphosphate synthase signature. CrtB does not synthesise
      GGPP; it consumes GGPP as its substrate, and the GGPP synthase of this
      organism is the separate gene crtE.
    action: REMOVE
    reason: >-
      GO:0004311 is defined as the head-to-tail condensation of farnesyl
      diphosphate with isopentenyl diphosphate to give geranylgeranyl
      diphosphate, verified against QuickGO. That is the opposite of what CrtB
      does. Expressing CrtB alone in E. coli depleted the host GGPP pool and
      suppressed growth, and the experimental remedy was to co-express crtE, the
      actual Erwinia GGPP synthase, to raise GGPP levels; an enzyme cannot both
      deplete GGPP and be the enzyme that makes it. Misawa and colleagues had
      already shown crtE and crtB to be distinct open reading frames of the same
      cluster in this organism, so the activity being transferred belongs to a
      paralogous neighbour rather than to this protein. Mechanistically the two
      are different reaction types: GGPP synthase is a 1'-4 head-to-tail
      prenyltransferase, whereas CrtB performs a 1'-1 head-to-head condensation.
      IPR044843 is a bacterial-type trans-isoprenyl diphosphate synthase entry
      capturing the shared all-alpha terpenoid synthase fold, which the same
      UniProt record also matches as Gene3D "Farnesyl Diphosphate Synthase" and
      SUPFAM "Terpenoid synthases"; a fold-level match cannot discriminate chain
      elongation from head-to-head condensation. This is a paralog
      over-annotation from an InterPro2GO mapping, and it is contradicted by
      direct experiment rather than merely unsupported.
