id: P21683
gene_symbol: crtB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:553
  label: Pantoea ananatis
description: >-
  CrtB is the phytoene synthase of the carotenoid-producing enterobacterium
  Pantoea ananatis (historically Erwinia uredovora), a 309-residue soluble
  enzyme of the phytoene/squalene synthase family. It catalyses the committed,
  pathway-defining step of C40 carotenoid biosynthesis: the head-to-head (1'-1)
  condensation of two molecules of the C20 isoprenoid geranylgeranyl diphosphate
  into the cyclopropylcarbinyl intermediate prephytoene diphosphate, followed by
  rearrangement of that intermediate with loss of a proton to give the colourless
  C40 hydrocarbon 15-cis-phytoene. The enzyme requires ATP, which is not
  hydrolysed during turnover, together with either Mn2+ or Mg2+, and is inhibited
  by phosphate and by squalestatin. Because it eliminates a proton rather than
  reducing the intermediate, it needs no nicotinamide cofactor, which is the
  chemical step that distinguishes it from its squalene synthase relatives.
  CrtB acts inside the bacterial cell on the geranylgeranyl diphosphate pool
  supplied by CrtE, and its product is handed on to the desaturase CrtI, the
  cyclase CrtY and the hydroxylase CrtZ that build lycopene, beta-carotene and
  zeaxanthin. By controlling entry of isoprenoid carbon into the carotenoid
  branch, CrtB sets the flux for the pigments that give the organism its yellow
  colouration, and its compact, self-contained activity has made it a standard
  entry enzyme for reconstructing carotenoid pathways in heterologous hosts.
