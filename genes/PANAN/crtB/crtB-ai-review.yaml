knowledge_gaps:
- gap_statement: >-
    Where in the bacterial cell CrtB carries out catalysis is undetermined: it is
    not known whether the enzyme is freely soluble in the cytoplasm or associates
    with the cytoplasmic face of the inner membrane where its hydrophobic product
    partitions.
  boundary: >-
    The reaction, substrate, product stereochemistry, cofactor requirement and
    kinetics are all firmly established by direct assay of the purified enzyme,
    and the sequence carries no signal peptide and no transmembrane segment. What
    is missing is any positive localization measurement.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Whether phytoene synthase is recruited to a membrane surface bears on how the
    insoluble C40 product is handed to the downstream desaturase CrtI, and hence
    on whether the pathway operates as a membrane-associated assembly or through
    free intermediates.
  resolution: >-
    Cell fractionation with membrane and soluble marker controls, protease
    accessibility, and fluorescent-fusion imaging in the native organism, ideally
    with and without an active downstream pathway.
  provenance:
  - reference_id: file:PANAN/crtB/crtB-deep-research-falcon.md
    supporting_text: remains inferred rather than experimentally demonstrated for
      P21683
    reference_section_type: OTHER
- gap_statement: >-
    The substrate specificity of CrtB has not been mapped: no panel of alternative
    prenyl diphosphates has been tested, so it is unknown whether the enzyme is
    strictly selective for the C20 geranylgeranyl diphosphate or will accept
    shorter or longer chains.
  boundary: >-
    Geranylgeranyl diphosphate is established as the physiological substrate, with
    a measured Km of 41 microM, and the physiological product is established as
    15-cis-phytoene. The unknown is the breadth of acceptance around that
    substrate, not the identity of the substrate itself.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Chain-length selectivity determines whether CrtB can be redirected to
    non-natural carotenoid backbones in engineered hosts, and would locate the
    residues that set the C40 versus C30 boundary against its squalene synthase
    relatives.
  resolution: >-
    Steady-state kinetics of the purified enzyme against a graded series of
    prenyl diphosphates, with products identified by mass spectrometry.
  provenance:
  - reference_id: file:PANAN/crtB/crtB-deep-research-falcon.md
    supporting_text: No rigorous alternative-substrate panel for P21683 was recovered.
    reference_section_type: OTHER
suggested_questions:
- question: >-
    Does CrtB function as a soluble cytoplasmic enzyme, or is it recruited to the
    cytoplasmic face of the inner membrane where its hydrophobic product
    accumulates and where the downstream desaturase CrtI must act?
- question: >-
    Which residues of CrtB coordinate the required Mn2+ or Mg2+, and does the
    metal bind the protein directly or principally chelate the diphosphate leaving
    groups of the two substrate molecules?
- question: >-
    What is the role of ATP, given that it is essential for activity but is
    reported not to be hydrolysed during the reaction?
- question: >-
    Do CrtB and the downstream enzymes CrtI, CrtY and CrtZ form a physical or
    kinetically coupled assembly that channels the insoluble intermediates, or are
    phytoene and lycopene released into the lipid phase between steps?
- question: >-
    Which residues set the C40 versus C30 boundary that separates phytoene
    synthases from their squalene synthase relatives within the same fold?
suggested_experiments:
- experiment_type: subcellular fractionation and imaging
  hypothesis: >-
    CrtB associates with the cytoplasmic face of the inner membrane rather than
    being freely soluble, positioning it to deliver phytoene to CrtI.
  description: >-
    Fractionate Pantoea ananatis into soluble and membrane fractions with
    validated marker controls and locate CrtB by immunoblot, in parallel with
    protease-accessibility assays on inverted and right-side-out vesicles and
    with fluorescent-fusion imaging of a functional tagged allele. Repeat in a
    crtI deletion background to test whether downstream pathway activity
    influences the distribution.
- experiment_type: structure determination and site-directed mutagenesis
  hypothesis: >-
    CrtB binds its divalent metal through an aspartate-rich motif of the
    terpenoid synthase fold, and distinct residues govern the proton elimination
    that yields the 15-cis product instead of the NADPH-dependent reduction used
    by squalene synthases.
  description: >-
    Solve the structure of CrtB alone and with a non-hydrolysable GGPP analogue
    and ATP to identify the metal and substrate sites, then test candidate
    residues by alanine substitution, measuring the effect on kinetics, metal
    dependence and product stereochemistry. This would place binding-site
    annotations on an entry that currently carries none, and would test directly
    whether the InterPro signatures shared with squalene synthase correspond to
    conserved or diverged active-site chemistry.
- experiment_type: substrate specificity panel
  hypothesis: >-
    CrtB is strictly selective for the C20 geranylgeranyl diphosphate and will
    not productively condense shorter prenyl diphosphates.
  description: >-
    Assay the purified enzyme against a graded series of prenyl diphosphates,
    including farnesyl diphosphate, geranylfarnesyl diphosphate and the natural
    geranylgeranyl diphosphate, determining steady-state kinetics for each and
    identifying products by mass spectrometry, with and without added NADPH to
    confirm that no reductive route operates.
- experiment_type: ATP dependence dissection
  hypothesis: >-
    ATP acts as a non-consumed allosteric or structural effector of CrtB rather
    than as a phosphoryl donor.
  description: >-
    Compare initial rates with ATP against non-hydrolysable analogues and with
    other nucleotides, quantify any ADP or phosphate release stoichiometrically
    against turnover, and test for nucleotide binding by isothermal titration
    calorimetry or thermal shift.
