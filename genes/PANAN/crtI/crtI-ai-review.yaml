  findings:
  - statement: >-
      Reconstituted the reaction in liposomes and showed clean conversion of
      15-cis-phytoene to all-trans-lycopene with no build-up of intermediates,
      the transformation comprising four desaturations and one cis-trans
      isomerization.
    supporting_text: Right, CRTI-mediated phytoene desaturation encompassing all four
      desaturation steps and one cis-trans isomerization step to form all-trans-lycopene.
  - statement: >-
      Concluded that FAD is the sole redox-active cofactor and that it is required
      structurally at membrane association, apoprotein being non-reactivatable.
    supporting_text: we conclude that FAD is the sole cofactor effective in CRTI-mediated
      phytoene desaturation
  - statement: >-
      Established that CrtI is a membrane-peripheral, probably monotopic
      oxidoreductase, revising the earlier membrane-integrated description while
      keeping the same cytoplasmic-membrane compartment.
    supporting_text: CRTI is a membrane-peripheral oxidoreductase which utilizes FAD
      as the sole redox-active cofactor.
  - statement: >-
      Identified oxygen as the terminal electron acceptor aerobically, replaceable
      by quinones anaerobically, an open point for the native organism.
    supporting_text: Thus, oxygen must play the role of a terminal electron acceptor.
  - statement: >-
      Showed that anaerobic isomerization of prolycopene by CRTI yields
      partially isomerized tri-cis and di-cis species rather than all-trans
      lycopene, distinguishing CrtI from a bona fide CRTISO carotenoid isomerase.
    supporting_text: led to the formation of a novel tri-cis-lycopene species accompanied
      by smaller amounts of the half-side isomerized 7,9-di-cis-lycopene
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text (XML) mechanistic and structural study of this exact protein (PDB
      4DGK, cross-referenced from P21685). It independently confirms the substrate,
      product, cofactor and four-desaturation-plus-isomerization mechanism, and is
      the strongest evidence in the review. Its partial-isomerization result is why
      no carotenoid isomerase activity (GO:0046608) is proposed for CrtI.
- id: PMID:39322757
  title: Combining systems and synthetic biology for in vivo enzymology.
  findings:
  - statement: >-
      Quantified phytoene substrate and lycopene product intracellularly for
      Pantoea ananatis CrtI expressed in engineered yeast, corroborating the
      phytoene-in, lycopene-out activity of this specific protein in a living cell.
    supporting_text: For PaCrtI, the observed concentrations of phytoene (substrate)
      and lycopene (product) are either equivalent to or lower than those obtained with
      the two fungal CrtI enzymes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text study using P. ananatis CrtI (PaCrtI) as one of several CrtI
      enzymes in an in vivo enzymology platform. Cited only as in-cell
      corroboration that this enzyme converts phytoene to lycopene; no identifier
      or GO term was taken from it.
