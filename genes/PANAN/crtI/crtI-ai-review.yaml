proposed_new_terms:
- proposed_name: lycopene-forming phytoene desaturase activity
  proposed_definition: >-
    Catalysis of the reaction 15-cis-phytoene + 4 A = all-trans-lycopene + 4 AH2,
    in which a single flavoprotein introduces four double bonds into phytoene
    (via phytofluene, zeta-carotene and neurosporene) and isomerizes the central
    15-cis bond to trans, producing all-trans-lycopene using a diffusible
    electron acceptor (EC 1.3.99.31, RHEA:15585). This is the bacterial and
    fungal CrtI-type route, mechanistically and cofactor-wise distinct from the
    plant/cyanobacterial plastoquinone-dependent 15-cis-phytoene desaturase
    (EC 1.3.5.5) that performs only part of the desaturation sequence.
  justification: >-
    GO:0016166 phytoene dehydrogenase activity has no children and is therefore
    used both for the CrtI four-step lycopene-forming reaction (EC 1.3.99.31,
    RHEA:15585) and for the plant/cyanobacterial single-substrate PDS reaction
    (EC 1.3.5.5), which are mutually exclusive routes distinguished only by Rhea
    and taxon. A dedicated child term for the lycopene-forming activity would let
    GO discriminate the two desaturation systems by function term. The carotene
    backbone biosynthesis module records the same absence of a CrtI-specific
    child of GO:0016166.
  proposed_parent:
    id: GO:0016166
    label: phytoene dehydrogenase activity
  supported_by:
  - reference_id: file:PANAN/crtI/crtI-uniprot.txt
    supporting_text: Reaction=15-cis-phytoene + 4 A = all-trans-lycopene + 4 AH2;
  - reference_id: PMID:2254247
    supporting_text: only one gene product (CrtI) for the conversion of phytoene to lycopene
      is required, a conversion in which four sequential desaturations should occur via
      the intermediates phytofluene, zeta-carotene, and neurosporene.
suggested_questions:
- question: >-
    Which terminal electron acceptor does CrtI use in native Pantoea ananatis:
    molecular oxygen, as it does aerobically in vitro, or a membrane quinone as
    it can anaerobically? The choice bears on how carotenogenesis is coupled to
    the cell's respiratory state.
  experts:
  - Beyer P
  - Sandmann G
- question: >-
    On which leaflet of the cytoplasmic membrane does the peripheral, probably
    monotopic CrtI sit, and does it associate physically with the upstream
    phytoene synthase CrtB and downstream cyclase CrtY to channel the insoluble
    carotene intermediates rather than releasing them into the bilayer?
  experts:
  - Schaub P
  - Cavarelli J
suggested_experiments:
- experiment_type: reconstitution with defined electron acceptors
  hypothesis: >-
    In its native aerobic physiology CrtI passes electrons to molecular oxygen,
    but under oxygen limitation it switches to a membrane quinone, so
    carotenogenesis continues anaerobically.
  description: >-
    Reconstitute purified CrtI with phytoene-loaded liposomes and measure
    lycopene formation and oxygen consumption under controlled oxygen tensions,
    then repeat anaerobically with a panel of native Pantoea quinones as the only
    available acceptor, quantifying turnover for each. Complement in vivo by
    assaying carotenoid accumulation in the organism under aerobic versus
    micro-aerobic growth.
- experiment_type: membrane topology and pathway-assembly mapping
  hypothesis: >-
    CrtI is recruited monotopically to the cytoplasmic face of the inner membrane
    and forms a physical or kinetically coupled assembly with CrtB and CrtY that
    channels phytoene and lycopene.
  description: >-
    Determine the sidedness of membrane-bound CrtI by protease-accessibility and
    labelling assays on inverted and right-side-out vesicles, and test for
    complex formation with CrtB and CrtY by co-purification, crosslinking and
    fluorescence microscopy of tagged functional alleles, comparing intermediate
    accumulation between strains expressing the enzymes together versus singly.
- experiment_type: substrate and isomerization dissection
  hypothesis: >-
    The physiological central-bond cis-to-trans isomerization is an obligatory
    internal step of the four-desaturation reaction rather than a separable
    carotenoid isomerase activity, and CrtI cannot fully convert prolycopene to
    all-trans-lycopene as a bona fide CRTISO would.
  description: >-
    Assay purified CrtI against prolycopene under the anaerobic reduced-FAD
    conditions that permit isomerization and identify the products by HPLC and
    mass spectrometry, testing whether the enzyme reaches all-trans-lycopene or
    stops at partially isomerized tri-cis and di-cis species, and compare with an
    authentic CRTISO run in parallel.
