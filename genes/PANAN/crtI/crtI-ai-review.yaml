gene_symbol: crtI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:553
  label: Pantoea ananatis
description: >-
  CrtI is the phytoene desaturase of the carotenoid-producing enterobacterium
  Pantoea ananatis (historically Erwinia uredovora), a 492-residue FAD-dependent
  flavoprotein oxidoreductase of the amine-oxidase (carotenoid/retinoid
  oxidoreductase) fold. As a single enzyme it carries out the entire conversion
  of the colourless C40 hydrocarbon 15-cis-phytoene into the pink, fully
  conjugated all-trans-lycopene, introducing four double bonds through the
  successive intermediates phytofluene, zeta-carotene and neurosporene and
  isomerizing the central 15-cis bond to trans in the course of the reaction.
  Each desaturation abstracts a pair of hydrogens that are passed via the tightly
  bound FAD to a terminal electron acceptor, which is molecular oxygen under
  aerobic conditions and can be replaced by quinones anaerobically. FAD is both
  the redox cofactor and a structural element: the holoenzyme forms cooperatively
  as the protein associates with the membrane, and apoprotein that binds the
  membrane without FAD cannot be reactivated afterwards. Rather than being
  integral, the enzyme sits peripherally, probably monotopically, on the
  cytoplasmic membrane where its lipophilic substrate resides. CrtI accepts
  15-cis-phytoene from the phytoene synthase CrtB and delivers all-trans-lycopene
  to the lycopene cyclase CrtY, and because its bacterial single-enzyme route
  substitutes functionally for the four-enzyme poly-cis desaturation pathway of
  plants and cyanobacteria (PDS, Z-ISO, ZDS, CRTISO), it has become a standard
  tool for reconstructing carotenoid pathways in heterologous hosts.
