core_functions:
- description: >-
    Single-enzyme desaturation of phytoene to lycopene. CrtI binds
    15-cis-phytoene at the cytoplasmic membrane and, using tightly bound FAD as
    the redox cofactor, introduces four double bonds in succession through the
    intermediates phytofluene, zeta-carotene and neurosporene while isomerizing
    the central 15-cis bond to trans, releasing all-trans-lycopene. The hydrogens
    removed at each step are transferred via FAD to a terminal electron acceptor,
    molecular oxygen aerobically or a quinone anaerobically. The product is passed
    to the lycopene cyclase CrtY, so this activity converts the committed C40
    precursor made by CrtB into the first coloured, fully conjugated carotene of
    the pathway.
