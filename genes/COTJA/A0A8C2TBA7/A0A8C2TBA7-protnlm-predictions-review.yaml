predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0004598
      label: peptidylamidoglycolate lyase activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        The quail protein is in PANTHER subfamily PTHR10680:SF14 with experimentally characterized
        mammalian PAM and carries a complete NHL-repeat PAL domain. The crystal structure and
        mutagenesis of the rat PAL catalytic core establish N-dealkylation of the
        peptidyl-alpha-hydroxyglycine to the amidated peptide and glyoxylate (PMID:19604476), which
        justifies transfer of this activity within the subfamily. The gene already carries this exact
        term (GO:0004598, from EC 4.3.2.5 mapping), and its gene review accepts it as a core function,
        so the prediction is correct but not novel.
      supported_by:
        - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
          supporting_text: DR   PANTHER; PTHR10680:SF14; PEPTIDYL-GLYCINE ALPHA-AMIDATING MONOOXYGENASE; 1.
        - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
          supporting_text: DR   CDD; cd14958; NHL_PAL_like; 1.
        - reference_id: PMID:19604476
          supporting_text: >-
            alpha-amidating lyase (PAL; EC 4.3.2.5) catalyzes the second and last step of
            this reaction, N-dealkylation of the peptidyl-alpha-hydroxyglycine to generate
            the alpha-amidated peptide and glyoxylate.
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0031418
      label: L-ascorbic acid binding
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Ascorbate is the reductant co-substrate of the PHM module, which carries the copper type II
        ascorbate-dependent monooxygenase domains (IPR000323, IPR014784). Stopped-flow reduction
        kinetics on rat PHM, from the same PANTHER subfamily (SF14), show saturable ascorbate
        dependence (KD about 1.1 mM), indicating that ascorbate binds the enzyme to reduce the copper
        centres (PMID:35380039). The same study notes that crystallography has not identified a
        discrete ascorbate site, so the binding is kinetically defined and of low affinity. The gene's
        annotations include the ascorbate-dependent monooxygenase activities (GO:0016715, GO:0004504)
        but no ascorbate binding term, and the PTHR10680 family review assigns L-ascorbic acid binding
        to PHM-bearing members. The prediction is therefore a supported, novel molecular function for
        this protein, though one that adds little beyond the co-substrate role implicit in its
        catalytic activity.
      supported_by:
        - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
          supporting_text: DR   InterPro; IPR000323; Cu2_ascorb_mOase_N.
        - reference_id: PMID:35380039
          supporting_text: >-
            The reduction
            obeys saturation kinetics with KD = 1120
            μM and kobs = 146 s–1 and indicates that ascorbate binds to the enzyme to accomplish reduction.
        - reference_id: PMID:35380039
          supporting_text: crystallography failed to identify any
