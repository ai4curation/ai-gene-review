id: A0A8C2TBA7
gene_symbol: PAM
taxon:
  id: NCBITaxon:93934
  label: Coturnix japonica
status: COMPLETE
description: >-
  Japanese quail PAM (PANTHER PTHR10680:SF14) is a bifunctional peptidylglycine alpha-amidating
  monooxygenase with an ascorbate-dependent dicopper PHM module and a zinc-dependent PAL
  beta-propeller module. The peptidylamidoglycolate lyase prediction matches an annotation the gene
  already carries and that its gene review accepts. The L-ascorbic acid binding prediction is absent
  from the gene's annotations and is supported by kinetic evidence of saturable ascorbate binding to
  rat PHM, a member of the same PANTHER subfamily.
source_documents:
  - genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
  - genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-goa.tsv
  - genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-ai-review.yaml
