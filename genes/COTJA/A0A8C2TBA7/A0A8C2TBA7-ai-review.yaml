id: A0A8C2TBA7
gene_symbol: A0A8C2TBA7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:93934
  label: Coturnix japonica
description: >-
  Peptidylglycine alpha-amidating monooxygenase (PAM) of the Japanese quail, a
  bifunctional type I membrane enzyme of the regulated secretory pathway that
  generates C-terminally alpha-amidated neuropeptides and peptide hormones from
  their glycine-extended precursors. Its luminal region holds two catalytic
  domains. The N-terminal PHM domain (peptidylglycine alpha-hydroxylating
  monooxygenase) is a copper type II ascorbate-dependent monooxygenase: it binds
  two copper ions and uses molecular oxygen and ascorbate to hydroxylate the
  alpha-carbon of the C-terminal glycine. The PAL domain
  (peptidyl-alpha-hydroxyglycine alpha-amidating lyase) is a six-bladed
  NHL-repeat beta-propeller with a zinc active site; it cleaves the
  hydroxyglycine intermediate to release the amidated peptide and glyoxylate.
  An N-terminal signal peptide directs the protein into the secretory pathway,
  and a single transmembrane helix plus a disordered C-terminal cytosolic tail
  anchor it in the membranes of the trans-Golgi network and secretory granules.
  The tail carries the trafficking information that returns the protein through
  the endocytic pathway after exocytosis. This gene model lacks the
  linker between PHM and PAL that mammalian PAM-1 carries (exon 16), giving it
  the domain arrangement of the mammalian PAM-2 splice form, in which the two
  catalytic domains are rarely separated by cleavage. Soluble PHM and PAL, which
  arise from endoproteolysis of PAM, are released with the peptide products
  during regulated secretion.
existing_annotations:
- term:
    id: GO:0001519
    label: peptide amidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: Peptide amidation is the defining process of PAM, which performs both
      chemical steps of the conversion of a peptidylglycine to an amidated peptide.
    action: ACCEPT
    reason: The quail protein belongs to PANTHER subfamily PTHR10680:SF14, the same
      subfamily as the experimentally characterized human (P19021), rat (P14925),
      mouse and bovine PAM. In mammals PAM is the only known peptide-amidating enzyme.
      Both catalytic cores of the quail model are intact, and all PHM copper ligands
      and PAL zinc ligands are conserved (file:COTJA/A0A8C2TBA7/A0A8C2TBA7-bioinformatics/RESULTS-rereview.md).
      The gene product does the catalytic work of the process, so the participation
      test is met. The term is ARBA-derived, but the claim is independently supported.
    supported_by:
    - reference_id: PMID:26667899
      supporting_text: "Peptidylglycine α-amidating monooxygenase (PAM), the only enzyme
        that catalyzes this modification, is essential"
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-bioinformatics/RESULTS-rereview.md
      supporting_text: "A0A8C2TBA7 is a full-length bifunctional PAM gene model that
        lacks exon 16"
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The term is correct but uninformative. PAM's two specific activities are
      known and are already annotated.
    action: MODIFY
    reason: The InterPro PHM/PAL signature (IPR000720) correctly identifies PAM as
      an enzyme, but catalytic activity is a root-level term. Following the
      refinement rule, the replacements are the two specific descendant activities
      that the gene already carries, GO:0004504 (PHM step) and GO:0004598 (PAL step).
      Both are listed because the bifunctional protein has both.
    proposed_replacement_terms:
    - id: GO:0004504
      label: peptidylglycine monooxygenase activity
    - id: GO:0004598
      label: peptidylamidoglycolate lyase activity
    supported_by:
    - reference_id: PMID:26667899
      supporting_text: "peptidylglycine α-hydroxylating monooxygenase catalyzes the
        copper- and ascorbate-dependent α-hydroxylation of the peptidylglycine substrate;
        peptidyl-α-hydroxyglycine α-amidating lyase cleaves the N-C bond, producing
        amidated product and glyoxylate"
- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The term is correct for the PHM domain but is a general ancestor of
      peptidylglycine monooxygenase activity.
    action: MODIFY
    reason: The PHM domain (Cu2_ascorb_mOase N- and C-terminal domains, IPR000323 and
