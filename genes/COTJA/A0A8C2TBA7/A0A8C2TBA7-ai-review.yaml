- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: PAM is a type I single-pass membrane protein. The specific membrane is
      the secretory granule membrane, a descendant of membrane.
    action: MODIFY
    reason: The quail model has a SignalP signal peptide (1-21) and a Phobius
      transmembrane helix (734-758), and the juxtamembrane, transmembrane and
      cytosolic segments of mammalian PAM are all present. Mammalian PAM is a granule
      membrane protein whose cytosolic domain directs it to the trans-Golgi network
      and secretory granules. GO:0030667 secretory granule membrane is_a (via vesicle
      membrane) GO:0016020.
    proposed_replacement_terms:
    - id: GO:0030667
      label: secretory granule membrane
    supported_by:
