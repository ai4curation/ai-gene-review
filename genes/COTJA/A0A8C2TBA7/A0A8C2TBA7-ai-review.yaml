- term:
    id: GO:0030658
    label: transport vesicle membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: The term comes from UniProt's "secretory vesicle membrane" subcellular
      location, but the vesicles PAM resides in are dense-core secretory granules,
      for which GO has the more accurate term secretory granule membrane.
    action: MODIFY
    reason: The UniProt subcellular-location statement on this unreviewed entry is
      ARBA-derived. It maps through GO_REF:0000044 to transport vesicle membrane.
      The independent evidence places membrane PAM in regulated secretory granules
      and the trans-Golgi network, from which it is retrieved through the endocytic
      pathway after exocytosis. GO:0030667 secretory granule membrane is the
      better-supported term. It is not an is_a descendant of GO:0030658 in the
      current ontology, so this is a lateral correction to the term that the core
      function already uses.
    proposed_replacement_terms:
    - id: GO:0030667
      label: secretory granule membrane
    supported_by:
    - reference_id: PMID:26667899
      supporting_text: "Unlike soluble granule content proteins, granule membrane
        proteins are not secreted; after exocytosis and insertion into the plasma
        membrane, membrane PAM can be retrieved, traveling through the endocytic
        pathway in a regulated manner."
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-deep-research-falcon.md
      supporting_text: "PAM is packaged into regulated secretory granules and
        neurosecretory vesicles, where it exists in both membrane-associated
        and soluble forms. In atrial cardiomyocytes, PAM represents a major
        membrane protein of secretory granules"
