      supporting_text: "TRANSMEM        734..758"
    - reference_id: PMID:26667899
      supporting_text: "Both enzymes are contained in the luminal domain of PAM, a type 1
        integral membrane protein."
    - reference_id: PMID:26667899
      supporting_text: "an epitope-tagged protein consisting of the transmembrane and
        cytosolic domains of PAM localizes to the trans Golgi network and secretory
