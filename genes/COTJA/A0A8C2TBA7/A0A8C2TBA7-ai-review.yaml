      already on this gene. The previous review kept this row as non-core while
      arguing that it was too general; the action is now MODIFY to match that reason.
    proposed_replacement_terms:
    - id: GO:0004504
      label: peptidylglycine monooxygenase activity
    supported_by:
    - reference_id: PMID:9360928
      supporting_text: "The amino-terminal domain of the bifunctional PAM protein is a
        peptidylglycine alpha-hydroxylating monooxygenase (PHM) with two coppers that
        cycle through cupric and cuprous oxidation states."
- term:
    id: GO:0004504
    label: peptidylglycine monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the core activity of the PHM domain, the first step of peptide
      amidation.
    action: ACCEPT
    reason: The annotation combines an EC mapping with PANTHER placement. Its
      phylogenetic grounding is the PAINT IBD for GO:0004504 at PTN000073733
      (Deuterostomia), whose seeds are human PAM (P19021), bovine PAM (P10731), mouse,
      rat and zebrafish PAM. Quail is a deuterostome and shares the SF14 subfamily
      with these seeds. Rat PHM structures place the substrate hydroxylation at a
      pair of copper sites. Both of those sites, with all six histidine and
      methionine ligands, are conserved in the quail model.
    supported_by:
    - reference_id: PMID:9360928
      supporting_text: "The amino-terminal domain of the bifunctional PAM protein is a
        peptidylglycine alpha-hydroxylating monooxygenase (PHM) with two coppers that
        cycle through cupric and cuprous oxidation states."
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-bioinformatics/RESULTS-rereview.md
      supporting_text: "All six PHM copper ligands are conserved (human H102, H103,
        H167, H237, H239, M309 -> quail H103, H104, H168, H238, H240, M310)."
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-deep-research-falcon.md
      supporting_text: "The N-terminal PHM domain catalyzes the stereospecific
        hydroxylation of the α-carbon of the C-terminal glycine residue. This
        rate-limiting step requires three essential cofactors: (1) copper ions
        (two copper atoms per PHM domain), (2) molecular oxygen, and (3) reduced
        ascorbate as an electron donor"
- term:
    id: GO:0004598
    label: peptidylamidoglycolate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: This is the core activity of the PAL domain, the second and final step
      of peptide amidation.
    action: ACCEPT
    reason: The annotation comes from an EC 4.3.2.5 mapping. It is supported because
      the quail protein has a complete NHL-repeat PAL domain (four NHL repeats,
      CDD NHL_PAL_like) with conserved zinc ligands, and because the structure of
      the PAL catalytic core of rat PAM, an SF14 subfamily member, establishes a
      Zn(II)-histidine active site. PAINT has no separate IBD for GO:0004598 in this
      family, so the support rests on the domain and residue conservation and on the
      shared subfamily with characterized mammalian PAM, not on an IBA.
    supported_by:
    - reference_id: PMID:19604476
      supporting_text: "The enzyme peptidyl-alpha-hydroxyglycine
        alpha-amidating lyase (PAL; EC 4.3.2.5) catalyzes the second and last step of
        this reaction, N-dealkylation of the peptidyl-alpha-hydroxyglycine to generate
        the alpha-amidated peptide and glyoxylate."
    - reference_id: PMID:19604476
      supporting_text: "The active site is formed by a Zn(II) ion
        coordinated by three histidine residues"
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-bioinformatics/RESULTS-rereview.md
      supporting_text: "All three PAL zinc ligands are conserved (human H582, H687,
        H783 -> quail H453, H557, H654)"
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The PHM domain binds two catalytic Cu(2+) ions. Copper binding is correct
      but is a cofactor property of the monooxygenase, not a separate function.
    action: KEEP_AS_NON_CORE
    reason: Copper binding is real and required. PIRSR places six catalytic copper
      ligands (H103, H104, H168, H238, H240, M310), and all of them are conserved
      relative to human PAM. The term is as precise as GO allows for a metal ligand.
      It describes the cofactor of the PHM activity, not the enzyme's role, so it is
      kept as non-core rather than accepted as a core function.
    supported_by:
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
      supporting_text: "Binds 2 Cu(2+) ions per subunit"
    - reference_id: PMID:9360928
      supporting_text: "peptidylglycine alpha-hydroxylating monooxygenase (PHM) with two
        coppers that cycle through cupric and cuprous oxidation states"
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Soluble PHM and PAL derived from PAM are released with peptide products
      during regulated secretion and are found in serum and cerebrospinal fluid. This
      is a secondary location.
    action: KEEP_AS_NON_CORE
    reason: The TreeGrafter annotation comes from PTN000840922. The family PAINT table
      also has an IBD for GO:0005576 at PTN000840899 (taxon 6072, Eumetazoa), seeded
      by fly and rat genes. Release of soluble PHM and PAL is documented in mammals.
      This gene model lacks the exon-16 linker, so PAM-1-style separation of PHM
      from PAL is unlikely. Soluble bifunctional or PHM-containing products can
      still arise from cleavage near the membrane, and the term applies to the gene
      product rather than to one splice form. The protein amidates peptides in
      granules, not outside the cell, so the location is kept as non-core. The
      previous review accepted this term while calling it a secondary location; the
      action now matches that reasoning.
    supported_by:
    - reference_id: PMID:26667899
      supporting_text: "Both in neurons and endocrine cells, soluble PHM and PAL are
        secreted along with neuropeptides and peptide hormones upon stimulation; PHM
        and PAL can be detected in serum and cerebrospinal fluid"
    - reference_id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-deep-research-falcon.md
      supporting_text: "Soluble PAM forms generated through endoproteolytic
        processing can be secreted into the extracellular space in active form"
