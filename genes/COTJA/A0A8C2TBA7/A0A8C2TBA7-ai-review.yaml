- id: PMID:9360928
  title: 'Amidation of bioactive peptides: the structure of peptidylglycine alpha-hydroxylating
    monooxygenase.'
  findings:
  - statement: Crystal structure of the rat PHM catalytic core shows two copper sites
      and supports substrate activation by a copper-bound oxygen species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed esummary confirms the title (Science 1997). Abstract-only cache.
      It concerns rat PAM, a member of the same PANTHER subfamily (SF14) as the quail
      protein.
- id: PMID:19604476
  title: 'Amidation of bioactive peptides: the structure of the lyase domain of the
    amidating enzyme.'
  findings:
  - statement: The PAL catalytic core is a six-bladed beta-propeller with a
      three-histidine Zn(II) active site that catalyzes N-dealkylation of the
      peptidyl-alpha-hydroxyglycine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. It concerns rat PAL, a member of the same PANTHER
      subfamily as the quail protein.
- id: PMID:26667899
  title: '60 YEARS OF POMC: From POMC and α-MSH to PAM, molecular oxygen, copper, and
    vitamin C.'
  findings:
  - statement: PAM is the only known peptide-amidating enzyme, a type 1 membrane
      protein with PHM and PAL in its luminal domain. Splice forms PAM-1, PAM-2 (no
      linker between PHM and PAL) and PAM-3 (soluble) exist. Soluble PHM and PAL are
      co-secreted with peptides, and the cytosolic domain directs trafficking to the
      TGN and secretory granules.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review by the Eipper/Mains group, full text cached. Supports the
      gene-level claims and the PAM-2 interpretation of this exon-16-lacking model.
- id: file:COTJA/A0A8C2TBA7/A0A8C2TBA7-bioinformatics/RESULTS-rereview.md
  title: Quail A0A8C2TBA7 vs human PAM P19021 alignment (re-review)
  findings:
  - statement: The quail model lacks the 107-residue exon-16 linker (PAM-2-like) but
      keeps the transmembrane and cytosolic segments and every Cu, Zn and Ca ligand
      of human PAM.
