      summary: >-
        Top-ranked hit (score 20.43, the highest in the benchmark), an exact match to GOA and
        to the first core function of this review - the copper- and ascorbate-dependent PHM
        half-reaction that hydroxylates the C-terminal glycine. Correct and maximally
        specific, but already annotated.
      supported_by:
