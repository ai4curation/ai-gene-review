id: A0A8C2TBA7
gene_symbol: PAM
taxon:
  id: NCBITaxon:93934
  label: Coturnix japonica
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for quail peptidylglycine alpha-amidating
  monooxygenase (PAM), the bifunctional PHM+PAL enzyme of peptide C-terminal amidation.
  This is ProTrek's best-scoring query in the benchmark (top-1 GO score 20.43, top-1
  Function score 21.45) and its most complete result: it recovers both catalytic
  activities of the bifunctional enzyme (peptidylglycine monooxygenase at rank 1,
  peptidylamidoglycolate lyase at rank 3) and the shared process (peptide amidation at
  rank 5), matching both core functions of this review. All three are already in GOA, so
  the value is confirmation rather than discovery. ProtNLM2 recovered only the PAL half
  plus an unsupported ascorbate-binding call.
  Assessment: 2 correct not novel (CNN), 1 uncertain (UNC).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-uniprot.txt
  - genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-goa.tsv
