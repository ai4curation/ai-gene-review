          supporting_text: Automatic annotation from ARBA rules
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0062112
      label: fatty acid primary amide biosynthetic process
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 19.20). PAM is genuinely the enzyme that produces primary fatty acid
        amides such as oleamide from N-acylglycines, so this is a real PAM activity rather
        than a spurious match - but it is a secondary, non-peptide branch of the enzyme's
        chemistry, it has not been shown for the quail protein, and this review treats
        peptide amidation as the core process. Recorded as uncertain: a legitimate lead that
        a curator would need substrate evidence to accept.
      supported_by:
        - reference_id: GO_REF:0000117
          supporting_text: Automatic annotation from ARBA rules
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004598
      label: peptidylamidoglycolate lyase activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 17.87), an exact match to GOA and to the second core function - the PAL
        half-reaction that cleaves the peptidyl-alpha-hydroxyglycine intermediate. Recovering
        both catalytic domains of a bifunctional enzyme from one sequence embedding is the
        strongest demonstration in this benchmark that ProTrek is reading domain content
        rather than returning a single family label; ProtNLM2 found only this half.
      supported_by:
        - reference_id: GO_REF:0000117
          supporting_text: Automatic annotation from ARBA rules
