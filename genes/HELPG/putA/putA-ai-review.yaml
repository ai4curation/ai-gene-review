suggested_questions:
- question: Which physiological quinone accepts electrons from G27 PutA, and how does oxygen reactivity
    compare with the J99 homolog under microaerobic growth conditions?
- question: Is active G27 PutA membrane-associated, and on which membrane face? The J99 enzymology does
    not establish this localization.
suggested_experiments:
- description: Purify sequence-verified G27 PutA and measure coupled proline-to-glutamate activity with
    defined quinones, NAD+ and controlled oxygen concentrations; separately assay donor-independent oxygen
    turnover.
  experiment_type: biochemistry
- description: Measure G27 PutA membrane association and sidedness using fractionation with compartment
    markers and a membrane-binding assay, without assuming the E. coli regulatory switch.
  experiment_type: localization
