- term:
    id: GO:0006562
    label: L-proline catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR025703
  review:
    action: ACCEPT
    summary: The fused enzyme carries the two catalytic activities that convert proline to glutamate.
    reason: The target-specific PRODH/PutA-P5CDH architecture and biochemical characterization of the
      J99 homolog support direct catalytic participation in proline catabolism. The P12 put-gene studies
      are additional species-level context, not native G27 flux measurements. Catabolic chemistry, rather
      than colonization necessity or gene adjacency alone, supports this process.
    supported_by:
