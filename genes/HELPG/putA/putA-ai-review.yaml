    id: GO:0004657
    label: proline dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027069
  - InterPro:IPR025703
  review:
    action: ACCEPT
    summary: The N-terminal catalytic region is assigned quinone-linked proline dehydrogenase activity
      by conserved PutA architecture.
    reason: The exact G27 protein contains a PRODH domain, an FAD-linked oxidoreductase signature and
      a fused PutA-specific ALDH region. The established PutA catalytic family couples proline oxidation
      to reduction of a quinone, supporting this existing reaction assignment as a conserved-function
      inference. J99 experiments independently establish proline dehydrogenation using DCPIP and oxygen,
      but do not themselves establish quinone reduction or the native quinone species. The relatively
      high J99 oxygen reactivity is not evidence that quinone use is absent, nor does it demonstrate that
      oxygen is the sole physiological acceptor. No direct G27 quinone kinetics are claimed.
    supported_by:
