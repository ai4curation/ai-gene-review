  supporting_entities:
  - InterPro:IPR025703
  review:
    action: REMOVE
    summary: The broad PutA family mapping overextends the enterobacterial transcriptional-regulator role
      to this Helicobacter catalytic protein.
    reason: 'The target carries the PRODH and aldehyde-dehydrogenase architecture without an annotated
      N-terminal PutA RHH DNA-binding domain. This is supported by independent comparative-negative evidence:
      purified H. pylori J99 PutA lacked binding to its corresponding putA promoter DNA even at 100-fold
      protein excess, whereas enterobacterial RHH-containing PutAs bind regulatory DNA. Together these
      observations argue against transferring the canonical PutA repressor function through IPR025703.
      The J99 N-terminal His8 construct, expressed in E. coli, is not a direct G27 assay; the conclusion
      is an architecture-specific correction of this electronic mapping, not proof that every conceivable
      secondary regulatory interaction is impossible.'
    supported_by:
