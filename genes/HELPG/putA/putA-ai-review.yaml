id: B5Z6C1
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:563041
  label: Helicobacter pylori G27
description: PutA is a fused proline-catabolic enzyme with an FAD-dependent proline dehydrogenase region
  and an NAD-dependent glutamate-semialdehyde dehydrogenase region. These activities oxidize L-proline
  to L-glutamate through pyrroline-5-carboxylate and its ring-opened semialdehyde. The Helicobacter protein
  has the bifunctional catalytic architecture rather than the N-terminal ribbon-helix-helix regulatory
  architecture of enterobacterial trifunctional PutA proteins.
