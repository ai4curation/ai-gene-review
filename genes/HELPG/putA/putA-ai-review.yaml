- id: PMID:16452403
  title: Oxygen reactivity of PutA from Helicobacter species and proline-linked oxidative stress.
  findings:
  - statement: J99 PutA expressed with an N-terminal His8 tag in E. coli has catalytic activity but lacks
      promoter-DNA binding in the reported assay; G27 is not the experimental donor.
    supporting_text: PutA Hh and PutA Hp displayed no DNA binding activity even with up to a 100-fold
      excess of PutA protein compared to DNA (data not shown as negative results).
  - statement: The primary PRODH assay uses artificial DCPIP and separately oxygen; it does not measure
      a native G27 quinone reaction.
    supporting_text: PRODH activity was analyzed using the proline:dichlorophenolindophenol (DCPIP) oxidoreductase
      assay
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. H. pylori donor is J99; His8-tagged protein was expressed in BL21(DE3)(pLysS).
      The negative gel-shift result is reported in text as data not shown. NAD-linked P5CDH and DCPIP/O2
      PRODH assays are direct for that construct. Neither exact G27 sequence identity, G27 membrane localization
      nor native quinone choice is established.
- id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  findings:
  - statement: Comparative review establishes the two catalytic reactions while distinguishing bifunctional
      PutAs from the RHH-containing trifunctional regulators.
    supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde
      dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Family-level mechanistic synthesis; it supports the conserved catalytic inference but
      is not a G27-specific enzyme, localization or channeling experiment.
