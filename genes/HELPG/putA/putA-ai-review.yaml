- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002871986
  review:
    action: UNDECIDED
    summary: The precise membrane-face localization of G27 PutA is not established by the available evidence.
    reason: The TreeGrafter row places PutA on the cytoplasmic face of the plasma membrane, but the reviewed
      J99 biochemical study does not measure Helicobacter membrane binding, localization or sidedness.
      Its membrane-switch discussion concerns E. coli. A quinone-linked family reaction is compatible
      with membrane interaction but is insufficient by itself to resolve the exact location of G27 catalytic
      activity. No specific membrane face is therefore included in the core synthesis; absence of a target
      localization assay is not evidence that membrane association is impossible.
    supported_by:
    - *id004
