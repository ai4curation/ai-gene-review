- id: PMID:24358297
  title: The sodium/proline transporter PutP of Helicobacter pylori.
  findings:
  - statement: P12 native cells, heterologous E. coli and reconstituted purified HpPutP establish proline
      transport and sodium coupling; these are not G27 experiments.
    supporting_text: gene hpp12_0049 codes for a high affinity Na+/proline symporter
  - statement: Lithium can replace sodium in the P12 reconstitution, while a proton gradient does not
      drive uptake under those tested conditions.
    supporting_text: Also a lmf proved to be an efficient driving force indicating that Na+ could be substituted
      by Li+.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Native donor and knockout experiments are H. pylori P12/hpp12_0049.
      The recombinant carrier carries a C-terminal His6 tag; E. coli WG170 expression and proteoliposomes
      establish coupling. G27 B5Z6C0 is inferred from its specific domain/signature and RuleBase assignments;
      exact P12/G27 sequence identity and kinetic equivalence are not claimed. The abstract says exclusively
      Na+ coupling, but Results explicitly reports Li+ substitution in vitro; no proton-coupled activity
      is inferred.
