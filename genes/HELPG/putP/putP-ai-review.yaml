  label: Helicobacter pylori G27
description: PutP is a multipass inner-membrane sodium/proline symporter that imports L-proline for cellular
  metabolism. Sodium binding couples inward ion movement to substrate uptake. It belongs to the specific
  PutP branch of the sodium:solute symporter family and provides proline to the PutA catabolic system.
