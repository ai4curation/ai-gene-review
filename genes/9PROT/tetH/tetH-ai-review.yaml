id: A0A060URH6
gene_symbol: tetH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160808
  label: Acidithiobacillus ferrivorans
description: >-
  Tetrathionate hydrolase TetH (tetH1-type) of the psychrotolerant acidophilic iron- and
  sulfur-oxidizer Acidithiobacillus ferrivorans (sequence from strain CF27). The 503-residue
  precursor has a predicted Sec signal peptide and the PQQ-repeat beta-propeller fold of the
  TetH family, with the catalytic aspartate of the A. ferrooxidans enzyme conserved. It is the
  ortholog of tetH1 of strain SS3, whose transcripts indicate that it hydrolyses tetrathionate to
  thiosulfate, elemental sulfur and sulfate during growth on tetrathionate, as the hydrolytic step
  of the S4-intermediate sulfur oxidation pathway. A second, divergent TetH-like paralog (tetH2)
  exists in A. ferrivorans genomes.
existing_annotations:
- term:
    id: GO:0016828
    label: hydrolase activity, acting on sulfur-sulfur bonds
  evidence_type: ISS
  original_reference_id: PMID:17904676
  supporting_entities:
  - UniProtKB:B7J3C9
  - UniProtKB:A4ZV25
  - GenBank:AEM46280.1
  review:
    summary: >-
      Full-length TetH family member (58% identical to the characterised A. ferrooxidans Tth,
      71% to A. caldus KU TetH) with the catalytic Asp conserved; its SS3 ortholog tetH1 is the
      transcriptionally implicated tetrathionate hydrolase.
    action: NEW
    reason: >-
      Tetrathionate hydrolysis has no specific GO term, so the S-S hydrolase parent is used.
      Similarity is to biochemically characterised enzymes (A. ferrooxidans, PMID:17904676 and
      PMID:33103311; A. caldus, PMID:14717695) across the full length, and the essential
      catalytic Asp325 of Af-Tth aligns to Asp323. Organism-level support is only
      transcriptional (PMID:26956550) and genomic (PMID:23183980); the enzyme has not been
      purified from A. ferrivorans. A0A060URH6 is the tetH1 ortholog (98.8% to SS3 Acife_0037),
      not the divergent tetH2.
    additional_reference_ids:
    - PMID:33103311
    - PMID:26956550
    - PMID:23183980
    supported_by:
    - reference_id: file:ACIF2/tth/tth-bioinformatics/RESULTS.md
      supporting_text: 'A0A060URH6 vs AEM46280 (A. ferrivorans SS3 tetH1): 98.8% over 503 aligned;
        vs tetH2 (AEM48684) only 35.4%.'
    - reference_id: PMID:26956550
      supporting_text: RNA transcripts suggested that tetrathionate was hydrolyzed by the tetH1
        gene product to form thiosulfate, elemental sulfur and sulfate.
    - reference_id: PMID:33103311
      supporting_text: 4THase activity was completely abolished in the site-specific Af-Tth D325N
        variant
