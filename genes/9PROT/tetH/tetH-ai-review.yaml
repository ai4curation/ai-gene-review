suggested_questions:
- question: Where is A. ferrivorans TetH located (periplasm as in A. caldus, or outer membrane/extracellular
    as in A. ferrooxidans), and is it active at the low temperatures at which this species leaches?
- question: Does the divergent tetH2 paralog have tetrathionate hydrolase activity at all?
suggested_experiments:
- description: Purify or acid-refold recombinant A. ferrivorans TetH1 and TetH2 and measure tetrathionate
    hydrolysis across pH 1-5 and 5-40 degrees C.
  hypothesis: TetH1 is an acid-active tetrathionate hydrolase with a lower temperature optimum than
    Af-Tth; TetH2 is not.
  experiment_type: enzyme assay
