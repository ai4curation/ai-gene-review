  title: Deep research summary for Bacteriophage T4 denA
  findings:
  - statement: >-
      DenA (Endonuclease II) is a GIY-YIG superfamily DNA endonuclease that
      initiates degradation of unmodified cytosine-containing host DNA during T4
      infection.
    supporting_text: >-
      **DenA (Endonuclease II; EndoII)** is a phage-encoded, sequence-context-sensitive DNA endonuclease of the **GIY–YIG nuclease superfamily** that initiates degradation (“restriction”) of **cytosine-containing, unmodified host DNA** during T4 infection.
  - statement: >-
      EndoII forms an active homotetramer that simultaneously binds two dsDNA
      molecules.
    supporting_text: >-
      Lagerbäck et al. show that EndoII behaves unusually among many GIY–YIG enzymes by forming an active **tetrameric** DNA complex that can bind **two DNA molecules** at once
  - statement: >-
      EndoII initiates host chromosomal DNA attack to supply nucleotides for T4
      genome synthesis.
    supporting_text: >-
      DenA/EndoII is positioned at the **initiation step** of T4 host DNA degradation, producing rare nicks in host DNA that enable further processing.
  - statement: >-
      Glu118 is a catalytic-surface residue implicated in catalysis and DNA
      complex stability.
    supporting_text: >-
      A catalytic-surface residue **E118** is implicated in catalysis and also affects DNA binding: the **E118A** variant can bind stably as monomer/dimer to a single DNA substrate
- id: file:BPT4/denA/denA-uniprot.txt
  title: UniProtKB entry P07059 (DENA_BPT4)
  findings:
  - statement: >-
      DenA contributes to host DNA degradation for nucleotide scavenging and
      nicks double-stranded DNA adjacent to CCGC motifs without cleaving
      5hmC-containing phage DNA.
    supporting_text: >-
      Contributes to the degradation of host DNA, permitting the scavenging of host-derived nucleotides for phage DNA synthesis (PubMed:18539732, PubMed:19666720). Sequence-specific endonuclease. Catalyzes nicking of the bottom strand of double-stranded DNA between the first and second base pair to the right of a top-strand CCGC motif. Does not cleave native phage DNA, which contains 5-hydroxymethylcytosine instead of cytosine.
  - statement: >-
      DenA requires Mg2+ as its catalytic cofactor.
    supporting_text: >-
      Name=Mg(2+); Xref=ChEBI:CHEBI:18420;
suggested_questions:
- question: >-
    What is the high-resolution structure of the DenA homotetramer bound
    simultaneously to two cytosine-containing dsDNA duplexes, and how does
    5-hydroxymethylcytosine sterically or electronically prevent productive
    recognition?
- question: >-
    How does Ndd-mediated nucleoid peripheralization affect the accessibility of
    host chromosomal sites to DenA cleavage in vivo?
suggested_experiments:
- description: >-
    Determine the cryo-EM or X-ray structure of the DenA(E118A) homotetramer in
    complex with two 5'-GRCCG-3' dsDNA substrates to resolve the DNA-bridging
    interface and base-recognition contacts.
- description: >-
    Perform genome-wide strand-break sequencing (END-seq or GLOE-seq) at early
    time points after T4 infection to map in vivo DenA cleavage hotspots across
    the Escherichia coli chromosome.
