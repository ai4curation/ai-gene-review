- term:
    id: GO:0039657
    label: symbiont-mediated suppression of host gene expression
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Downstream consequence of host chromosome degradation rather than a direct
      transcriptional shutoff mechanism.
    action: KEEP_AS_NON_CORE
    reason: >-
      DenA initiates nucleolytic breakdown of the host chromosome (GO:0099015),
      which secondarily eliminates templates for host gene expression, but DenA
      acts directly on DNA integrity rather than the transcription apparatus.
    supported_by:
    - reference_id: file:BPT4/denA/denA-deep-research-falcon.md
      supporting_text: >-
        DenA/EndoII is positioned at the **initiation step** of T4 host DNA degradation, producing rare nicks in host DNA that enable further processing.
    - reference_id: file:BPT4/denA/denA-uniprot.txt
      supporting_text: >-
        Contributes to the degradation of host DNA, permitting the scavenging of host-derived nucleotides for phage DNA synthesis (PubMed:18539732, PubMed:19666720).
