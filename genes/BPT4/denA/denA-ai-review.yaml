gene_symbol: denA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  Endonuclease II (DenA; EndoII; EC 3.1.21.8) is a 136-amino-acid,
  magnesium-dependent GIY-YIG superfamily DNA endonuclease of bacteriophage T4
  that initiates the degradation of unmodified, cytosine-containing host
  chromosomal DNA during early infection. Functioning as a dimer-of-dimers
  homotetramer that bridges two double-stranded DNA duplexes, DenA recognizes
  cytosine-rich sequence motifs (consensus 5'-GRCCG-3' / CCGC) and introduces
  single-strand nicks and double-strand breaks into the Escherichia coli
  chromosome while sparing T4 genomic DNA, which contains glucosylated
  5-hydroxymethylcytosine. The resulting host DNA fragments are further
  processed into mononucleotides to supply precursors for phage DNA replication.
