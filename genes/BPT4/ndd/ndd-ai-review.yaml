suggested_questions:
- question: >-
    Does Ndd tether host chromosomal DNA directly to the Escherichia coli inner
    membrane or via interaction with a specific host inner-membrane protein or
    nucleoid-associated protein?
- question: >-
    Does Ndd distinguish unmodified cytosine-containing host DNA from
    5-hydroxymethylcytosine-containing T4 DNA?
suggested_experiments:
- description: >-
    Perform ChIP-seq and Hi-C in Escherichia coli expressing T4 Ndd to map
    whether Ndd binds specific chromosomal macrodomains or architectural motifs
    during nucleoid peripheralization.
- description: >-
    Compare Ndd binding affinity for unmodified cytosine dsDNA versus
    5hmC-modified and glucosylated-5hmC dsDNA using fluorescence anisotropy and
    surface plasmon resonance.
