id: P15556
gene_symbol: ndd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  Nucleoid disruption protein (Ndd; gpD2b) is a 151-amino-acid early effector
  protein of bacteriophage T4 that binds double-stranded DNA and rapidly
  remodels the architecture of the Escherichia coli host nucleoid within 2 to 3
  minutes of infection. Without cleaving or degrading DNA, Ndd disorganizes the
  central bacterial chromosome and relocalizes host DNA toward the inner
  membrane periphery, thereby arresting host chromosomal DNA replication and
  segregating host chromatin prior to nucleolytic degradation by DenA and DenB.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Correct parent term that should be refined to GO:0003690 (double-stranded
      DNA binding).
    action: MODIFY
    reason: >-
      Biochemical assays demonstrate that Ndd binds specifically to
      double-stranded DNA and does not bind single-stranded DNA, supporting
      refinement to the descendant term GO:0003690 (double-stranded DNA
      binding).
    proposed_replacement_terms:
    - id: GO:0003690
      label: double-stranded DNA binding
    supported_by:
    - reference_id: file:BPT4/ndd/ndd-deep-research-falcon.md
      supporting_text: >-
        function as a **structural bridge** between DNA and membrane
    - reference_id: file:BPT4/ndd/ndd-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Binds to dsDNA but not to ssDNA. {ECO:0000269|PubMed:9748458}.
- term:
    id: GO:0044071
    label: symbiont-mediated perturbation of host cell cycle progression
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Downstream consequence of nucleoid disruption and host DNA replication
      arrest rather than direct regulation of the cell division machinery.
    action: KEEP_AS_NON_CORE
    reason: >-
      Ndd disrupts the bacterial nucleoid and blocks host chromosomal DNA
      replication (GO:0098673), which secondarily prevents normal bacterial cell
      cycle progression and nucleoid segregation.
    supported_by:
    - reference_id: file:BPT4/ndd/ndd-deep-research-falcon.md
      supporting_text: >-
        short-term expression of bacteriophage T4 **Ndd** disrupted the nucleoid and relocalized it toward the **inner membrane/periphery**
    - reference_id: file:BPT4/ndd/ndd-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Disorganizes the host nucleoid and inhibits replication, but without host DNA cleavage or degradation. Only the architecture of the nucleoid is affected.
- term:
    id: GO:0098673
    label: symbiont-mediated suppression of host DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Accurately captures the core biological process mediated by Ndd during
      early T4 infection.
    action: ACCEPT
    reason: >-
      Ndd-induced disorganization and peripheral relocalization of the host
      nucleoid directly inhibits host chromosomal DNA replication independently
      of host DNA cleavage.
    supported_by:
    - reference_id: file:BPT4/ndd/ndd-deep-research-falcon.md
      supporting_text: >-
        The best-supported functional annotation for T4 Ndd is that it is an **early infection effector** that causes rapid **host nucleoid disruption/redistribution**, a hallmark phenotype beginning **~2–3 minutes** after infection
    - reference_id: file:BPT4/ndd/ndd-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Disorganizes the host nucleoid and inhibits replication, but without host DNA cleavage or degradation.
core_functions:
- description: >-
    Binds double-stranded DNA to remodel and peripheralize the host bacterial
    nucleoid against the inner membrane without cleaving DNA, thereby arresting
    host chromosomal DNA replication during early T4 infection.
  molecular_function:
    id: GO:0003690
    label: double-stranded DNA binding
  directly_involved_in:
  - id: GO:0098673
    label: symbiont-mediated suppression of host DNA replication
  supported_by:
  - reference_id: file:BPT4/ndd/ndd-deep-research-falcon.md
    supporting_text: >-
      The best-supported functional annotation for T4 Ndd is that it is an **early infection effector** that causes rapid **host nucleoid disruption/redistribution**, a hallmark phenotype beginning **~2–3 minutes** after infection
  - reference_id: file:BPT4/ndd/ndd-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Disorganizes the host nucleoid and inhibits replication, but without host DNA cleavage or degradation. Only the architecture of the nucleoid is affected. May act on the host chromosomal sequences that determine the structure of the nucleoid. Binds to dsDNA but not to ssDNA. {ECO:0000269|PubMed:9748458}.
