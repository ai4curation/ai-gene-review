id: P13341
gene_symbol: '54'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate tail-tube junction protein gp54 of bacteriophage T4 that assembles as a homohexameric ring atop the gp48 ring at the apex of the baseplate dome to form the second annulus of the tail-tube continuation. Adopting a tail-tube-like core fold and acting in concert with gp48 and the gp29 tape measure protein, the gp54 hexamer directly nucleates polymerization of the 24 hexameric rings of the major tail tube protein gp19 and contacts the proximal ring of the gp18 contractile sheath.
