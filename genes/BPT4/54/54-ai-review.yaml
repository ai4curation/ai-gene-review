suggested_questions:
  - question: Why is monomer-to-hexamer assembly of gp54 strictly dependent on prior binding of the gp48 hexamer to the baseplate dome, given that recombinant gp54 can self-oligomerize at elevated concentrations in vitro?
  - question: How do the contacts between the gp54 hexameric ring and the first layer of gp18 sheath subunits rearrange when the sheath detaches from the tube surface during contraction?
suggested_experiments:
  - description: Determine the cryo-EM structure of the baseplate-tube junction in contracted T4 tails to map how the gp54–gp18 interface is broken while the gp48–gp54–gp19 axial tube continuity is preserved during host envelope puncture.
  - description: Mutate surface loops on the distal face of the gp54 hexamer to identify the specific residues that lower the nucleation barrier for monomeric gp19 polymerization.
