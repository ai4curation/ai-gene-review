id: P0DXF1
gene_symbol: uvsW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: ATP-dependent DNA helicase UvsW (also known as Dar) is a 502-amino-acid superfamily 2 (SF2) 3'-5' branched-DNA helicase and strand-annealing motor of bacteriophage T4. Combining two RecA-like ATPase domains with a basic N-terminal branched-substrate recognition domain, UvsW couples ATP hydrolysis to 3'-5' translocation on single-stranded DNA, unwinding of RNA-DNA hybrids (R-loops) and branched DNA duplexes, and complementary strand annealing. In vivo, UvsW represses origin-dependent replication initiation during late infection by unwinding origin R-loops, catalyzes Holliday junction branch migration during homologous recombination, and drives regression of stalled replication forks to promote template-switching DNA repair.
