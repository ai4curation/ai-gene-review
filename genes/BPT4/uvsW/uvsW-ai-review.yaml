suggested_questions:
  - question: How does the basic N-terminal domain of UvsW coordinate simultaneous duplex unwinding and nascent-strand annealing to drive unidirectional regression of stalled replication forks?
  - question: What determines whether a Holliday junction or D-loop intermediate in T4-infected cells is resolved by endonuclease VII (gp49) cleavage vs migrated to completion by UvsW?
suggested_experiments:
  - description: Determine cryo-EM structures of full-length UvsW bound to a four-way Holliday junction and a three-way replication fork in the presence of ADP-AlF4.
    hypothesis: The N-terminal basic domain acts as a wedge at the branch point that splits parental/nascent duplexes while guiding displaced complementary strands into an annealing channel along the RecA-like motor domains.
  - description: Perform single-molecule FRET assays on mobile Holliday junctions in the presence of UvsW, UvsX, gp32, and endonuclease VII (gp49).
    hypothesis: UvsW-driven branch migration displaces UvsX filaments and exposes open four-way junction conformations that either resolve by strand run-off or become licensed for gp49 endonucleolytic cleavage when branch migration stalls.
