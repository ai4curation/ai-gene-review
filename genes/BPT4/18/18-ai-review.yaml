id: P13332
gene_symbol: '18'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Major contractile tail sheath protein gp18 of bacteriophage T4 that polymerizes into 23 hexameric rings (138 subunits total) forming the outer helical sheath around the rigid central tail tube (gp19). Upon host cell attachment and baseplate conformational switching, gp18 subunits undergo a concerted rigid-body rearrangement that contracts the sheath to less than half its extended length, mechanically driving the central tail tube through the host bacterial outer membrane to create a channel for viral genomic DNA ejection.
