suggested_questions:
  - question: What are the precise atomic contacts between the C-terminal Domain IV of gp18 and the gp19 tail tube subunits that maintain the high-energy extended conformation prior to baseplate triggering?
  - question: Does the bound purine nucleotide historically reported in gp18 preparations play any allosteric or stabilizing role during sheath polymerization onto the tail tube template?
suggested_experiments:
  - description: Determine high-resolution cryo-EM structures of partially contracted T4 tail intermediates trapped by targeted disulfide cross-links between adjacent gp18 rings to resolve the ring-by-ring propagation wave of sheath contraction.
  - description: Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) on monomeric gp18, extended tail sheaths, and contracted sheaths to map the inter-domain hinge regions and beta-sheet augmentation interfaces that lock the contracted state.
