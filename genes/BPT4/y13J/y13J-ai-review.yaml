      - reference_id: file:BPT4/y13J/y13J-deep-research-falcon.md
        supporting_text: '**Best-supported function:** **o-spanin (outer membrane lipoprotein subunit) required for outer membrane disruption in lysis**, acting together with its partner i-spanin (pseT.3) as a **two-component spanin complex**.'
      - reference_id: file:BPT4/y13J/y13J-uniprot.txt
