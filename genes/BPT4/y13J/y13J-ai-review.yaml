taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Outer lipoprotein spanin subunit (o-spanin; PseT.2; gpY13J) is a 99-amino-acid precursor protein of bacteriophage T4 that is processed at its N-terminal signal peptidase II lipobox (cleaved after residue 16 and lipidated at Cys17) and anchored to the periplasmic leaflet of the Escherichia coli outer membrane. Together with its inner-membrane partner i-spanin (PseT.3 / Y13K), Y13J forms a periplasm-spanning two-component spanin complex that executes the final step of host cell lysis by disrupting the bacterial outer membrane—likely via inner-to-outer membrane fusion—after holin-mediated inner membrane permeabilization and endolysin-mediated peptidoglycan degradation.
existing_annotations:
  - term:
      id: GO:0020002
      label: host cell plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: Inaccurate conservative mapping from UniProtKB-SubCell SL-0376 (Host cell outer membrane); in Gram-negative hosts, the o-spanin lipoprotein is anchored in the outer membrane rather than the plasma (inner) membrane.
      action: MODIFY
      reason: In Gram-negative bacteria such as Escherichia coli, the plasma membrane corresponds to the inner membrane (where the i-spanin partner y13K is anchored), whereas y13J (pseT.2) is an outer-membrane lipoprotein. Because GO lacks a dedicated host cell outer membrane term in this branch, GO:0033644 (host cell membrane) accurately encompasses its outer-membrane localization without conflating it with the plasma membrane.
      proposed_replacement_terms:
        - id: GO:0033644
          label: host cell membrane
      supported_by:
        - reference_id: file:BPT4/y13J/y13J-deep-research-falcon.md
          supporting_text: '**Expected localization:** As an o-spanin, y13J/pseT.2 is expected to be an **outer membrane-anchored lipoprotein**, produced as a precursor and processed by signal peptidase II at the lipobox and lipidated at the N-terminal cysteine.'
        - reference_id: file:BPT4/y13J/y13J-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: 'SUBCELLULAR LOCATION: Host cell outer membrane {ECO:0000250}; Lipid-anchor {ECO:0000250}; Periplasmic side {ECO:0000250}.'
  - term:
      id: GO:0031640
      label: killing of cells of another organism
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Broad keyword-derived term that should be refined to the specific descendant GO:0044659 (viral release from host cell by cytolysis) already annotated to the gene.
      action: MODIFY
      reason: Y13J specifically mediates the terminal outer-membrane disruption step of phage-induced host cytolysis for virion release, which is captured by the more specific descendant term GO:0044659 already present on this gene.
      proposed_replacement_terms:
        - id: GO:0044659
          label: viral release from host cell by cytolysis
      supported_by:
        - reference_id: PMID:17900620
          supporting_text: In the case of T4, a deletion of a non-overlapping gene pair pseT.2 and pseT.3 identified as Rz/Rz1 equivalents resulted in the same divalent cation-dependent lysis phenotype.
        - reference_id: file:BPT4/y13J/y13J-deep-research-falcon.md
          supporting_text: '**Best-supported function:** **o-spanin (outer membrane lipoprotein subunit) required for outer membrane disruption in lysis**, acting together with its partner i-spanin (pseT.3) as a **two-component spanin complex**.'
  - term:
      id: GO:0044659
      label: viral release from host cell by cytolysis
    evidence_type: IGI
    original_reference_id: PMID:17900620
    review:
      summary: Directly supported by T4 deletion genetics demonstrating that the pseT.2/pseT.3 spanin pair is required for host outer membrane disruption and cell lysis.
      action: ACCEPT
      reason: Summer et al. (2007) demonstrated that deletion of pseT.2 (y13J) and pseT.3 (y13K) in bacteriophage T4 causes a divalent cation-dependent lysis defect in which spherical cells fail to lyse and release progeny virions.
      supported_by:
        - reference_id: PMID:17900620
          supporting_text: In the case of T4, a deletion of a non-overlapping gene pair pseT.2 and pseT.3 identified as Rz/Rz1 equivalents resulted in the same divalent cation-dependent lysis phenotype.
        - reference_id: file:BPT4/y13J/y13J-deep-research-falcon.md
          supporting_text: A constructed **Δ(pseT.3 pseT.2)** mutant showed a classic spanin-null phenotype described as **Mg2+-dependent lysis defect** with infected cells adopting a **spherical morphology**—consistent with successful PG degradation but failure to disrupt the OM barrier.
core_functions:
  - description: Outer-membrane lipoprotein subunit (o-spanin) that heterooligomerizes via its periplasmic C-terminal domain with the inner-membrane i-spanin subunit Y13K (PseT.3) to bridge the periplasm and disrupt the host outer membrane during viral release by cytolysis.
