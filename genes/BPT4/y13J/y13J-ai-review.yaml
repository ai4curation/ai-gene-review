  - id: PMID:17900620
    title: Rz/Rz1 lysis gene equivalents in phages of Gram-negative hosts.
    findings:
      - statement: Identified T4 pseT.2 (y13J) and pseT.3 (y13K) as Rz/Rz1-equivalent spanin genes and showed that their deletion in T4 causes a divalent cation-dependent lysis defect.
        supporting_text: In the case of T4, a deletion of a non-overlapping gene pair pseT.2 and pseT.3 identified as Rz/Rz1 equivalents resulted in the same divalent cation-dependent lysis phenotype.
      - statement: Defined spanins as lysis proteins that span the periplasm to physically connect the inner and outer membranes.
        supporting_text: These proteins were named "spanins," since their protein products are predicted to span the periplasm providing a physical connection between the inner and outer membranes.
  - id: file:BPT4/y13J/y13J-deep-research-falcon.md
    title: Deep research summary for Bacteriophage T4 y13J
    findings:
      - statement: Y13J (PseT.2) is the outer membrane lipoprotein subunit (o-spanin) of the T4 two-component spanin complex.
        supporting_text: '**Best-supported function:** **o-spanin (outer membrane lipoprotein subunit) required for outer membrane disruption in lysis**, acting together with its partner i-spanin (pseT.3) as a **two-component spanin complex**.'
      - statement: Deletion of pseT.3 and pseT.2 in T4 causes a Mg2+-dependent lysis defect in which infected cells become spherical due to failure of outer-membrane disruption.
        supporting_text: A constructed **Δ(pseT.3 pseT.2)** mutant showed a classic spanin-null phenotype described as **Mg2+-dependent lysis defect** with infected cells adopting a **spherical morphology**—consistent with successful PG degradation but failure to disrupt the OM barrier.
      - statement: Y13J is synthesized as a lipoprotein precursor processed by signal peptidase II and anchored to the outer membrane.
        supporting_text: '**Expected localization:** As an o-spanin, y13J/pseT.2 is expected to be an **outer membrane-anchored lipoprotein**, produced as a precursor and processed by signal peptidase II at the lipobox and lipidated at the N-terminal cysteine.'
  - id: file:BPT4/y13J/y13J-uniprot.txt
    title: UniProtKB entry P39503 (SPAN2_BPT4)
    findings:
      - statement: Y13J is a component of the T4 spanin complex that disrupts the host outer membrane during viral exit.
        record_section: ["CC:FUNCTION"]
        supporting_text: Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
      - statement: Y13J interacts via its C-terminus with the C-terminus of the inner membrane spanin subunit to span the periplasmic space.
        record_section: ["CC:SUBUNIT"]
        supporting_text: Interacts (via C-terminus) with the spanin inner membrane subunit (via C-terminus). Part of the spanin complex which spans the entire periplasmic space.
      - statement: Y13J is lipid-anchored to the periplasmic side of the host cell outer membrane.
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: 'SUBCELLULAR LOCATION: Host cell outer membrane {ECO:0000250}; Lipid-anchor {ECO:0000250}; Periplasmic side {ECO:0000250}.'
suggested_questions:
  - question: Do the three conserved cysteines near the C-terminus of mature T4 Y13J form intermolecular disulfide bonds via the host DsbA/DsbC system analogous to phage lambda Rz1?
  - question: What is the stoichiometry and structure of the periplasmic C-terminal heterocomplex between T4 Y13J (PseT.2) and Y13K (PseT.3) before and after peptidoglycan degradation?
suggested_experiments:
  - description: Perform non-reducing SDS-PAGE and site-directed mutagenesis of the cysteine residues in T4 Y13J (PseT.2) and Y13K (PseT.3) during T4 infection to test whether covalent disulfide-linked homodimerization is required for T4 spanin function.
  - description: Reconstitute purified soluble periplasmic domains of T4 Y13J and Y13K into proteoliposomes to assay inner-outer membrane lipid mixing and determine the complex structure by cryo-EM.
