          supporting_text: Structural reviews describe that gp12 N-termini attach to **gp10 trimers** in the baseplate, while **gp11 trimers** hold the short tail fibers at a hinge roughly halfway along the fiber—placing gp12 within a defined baseplate attachment/hinge architecture.
