      reason: GO:0046718 (symbiont entry into host cell) is an overly broad parent process derived from keyword mapping. The specific step performed by gp12 is irreversible binding of the deployed short tail fibers to the host LPS core receptor on the outer surface (GO:0098670, entry receptor-mediated virion attachment to host cell).
      proposed_replacement_terms:
