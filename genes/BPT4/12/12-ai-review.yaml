suggested_questions:
  - question: Does each gp12 homotrimer bind a single LPS core oligosaccharide along its C-terminal flat apex or three LPS molecules simultaneously across its threefold-symmetric lateral clefts in vivo?
  - question: How does the cytoplasmic chaperone gp57A prevent off-pathway aggregation of the intertwined beta-stranded shaft domains of gp12 prior to octahedral Zn2+ capture at the C-terminus?
suggested_experiments:
  - description: Determine the cryo-EM or X-ray co-crystal structure of the gp12 C-terminal receptor-binding domain bound to purified Escherichia coli B core-lipid A oligosaccharide (Re/Rd/Rc chemotypes).
    hypothesis: The three symmetry-related surface pockets surrounding the C-terminal apex of the gp12 trimer each engage the inner-core heptose/Kdo sugars of LPS simultaneously, explaining the near-irreversible avidity of short tail fiber binding.
  - description: Construct His445Ala and His447Ala substitutions in full-length gp12 co-expressed with gp57A and measure trimer assembly, protease resistance, and Zn2+ stoichiometry by ICP-MS.
    hypothesis: Octahedral coordination of Zn2+ by His445 and His447 acts as a C-terminal kinetic lock required to register and zip the three beta-helical chains during gp57A-assisted folding.
