id: P10930
gene_symbol: '12'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Short tail fiber protein gp12 is a 527-residue homotrimeric adhesin and structural fiber protein (18 copies per virion) that forms the six short tail fibers of bacteriophage T4. Each gp12 trimer comprises an N-terminal baseplate-binding domain anchored to gp10, an elongated intertwined beta-helical shaft clamped at its central hinge by gp11, and a C-terminal receptor-binding head domain stabilized by an octahedrally coordinated zinc ion (bound by His445 and His447 from each protomer). Stowed in a compact garland beneath the dome-shaped baseplate prior to infection, gp12 unfolds downward during the dome-to-star baseplate transition to bind irreversibly to the core lipopolysaccharide region of Escherichia coli, locking the virion onto the host cell surface for tail sheath contraction and DNA injection.
existing_annotations:
  - term:
      id: GO:0019062
      label: virion attachment to host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp12 mediates irreversible virion attachment to the host cell, but this term is less specific than entry receptor-mediated virion attachment to host cell (GO:0098670).
      action: MODIFY
      reason: While gp12 functions in virion attachment, biochemical and structural evidence shows that its C-terminal head domain specifically recognizes and binds irreversibly to the core lipopolysaccharide (LPS) receptor on the Escherichia coli outer membrane. Modifying this broad term to GO:0098670 (entry receptor-mediated virion attachment to host cell), which is already present on this gene, captures the specific mechanism.
      proposed_replacement_terms:
        - id: GO:0098670
          label: entry receptor-mediated virion attachment to host cell
      supported_by:
        - reference_id: file:BPT4/12/12-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: Structural component of the short tail fiber. Adhesion protein that binds irreversibly to the lipopolysaccharides component (LPS) on the cell surface of Escherichia coli B strains during virus attachment. After at least three long tail fibers have bound, short tail fibers extend and bind irreversibly to the core region of the host cell LPS.
        - reference_id: file:BPT4/12/12-deep-research-falcon.md
          supporting_text: '**gp12 forms the short tail fibers of bacteriophage T4 and mediates irreversible binding to the host** by binding the **core region of Escherichia coli LPS**.'
