        - reference_id: file:BPT4/12/12-deep-research-falcon.md
          supporting_text: '**gp12 forms the short tail fibers of bacteriophage T4 and mediates irreversible binding to the host** by binding the **core region of Escherichia coli LPS**.'
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: gp12 binds a structural metal ion at its trimer axis, which X-ray crystallography and X-ray absorption spectroscopy identify specifically as a zinc ion (Zn2+).
      action: MODIFY
      reason: High-resolution crystal structures of the gp12 C-terminal receptor-binding domain demonstrate that three monomers octahedrally coordinate a single buried Zn2+ ion via six histidine residues (His445 and His447 from each chain). Modifying general GO:0046872 (metal ion binding) to its specific descendant GO:0008270 (zinc ion binding) accurately reflects the experimental evidence.
      proposed_replacement_terms:
        - id: GO:0008270
          label: zinc ion binding
      supported_by:
        - reference_id: file:BPT4/12/12-deep-research-falcon.md
          supporting_text: The receptor-binding domain structure contains a **Zn2+ ion coordinated octahedrally by six histidines**—specifically **His445 and His447 from each monomer**—forming an unusual metal-binding site at the interface of receptor-binding subdomains.
  - term:
      id: GO:0098015
      label: virus tail
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp12 is part of the bacteriophage T4 tail, but this term is too general compared to its specific localizations as the short tail fiber and peripheral component of the tail baseplate.
      action: MODIFY
      reason: gp12 forms the six short tail fibers (GO:0098024, virus tail, fiber) that are anchored to gp10 and gp11 and stowed within the peripheral garland of the tail baseplate (GO:0098025, virus tail, baseplate). Replacing the general parent term GO:0098015 with both specific subcompartment terms already present on this gene captures its full localization.
      proposed_replacement_terms:
        - id: GO:0098024
          label: virus tail, fiber
        - id: GO:0098025
          label: virus tail, baseplate
      supported_by:
        - reference_id: file:BPT4/12/12-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: Structural component of the short tail fiber. Adhesion protein that binds irreversibly to the lipopolysaccharides component (LPS) on the cell surface of Escherichia coli B strains during virus attachment. After at least three long tail fibers have bound, short tail fibers extend and bind irreversibly to the core region of the host cell LPS.
