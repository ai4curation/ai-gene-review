id: P13336
gene_symbol: '28'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate hub assembly protein gp28 of bacteriophage T4 required during late morphogenesis for the formation of the central hub of the tail baseplate. Acting as a low-abundance assembly factor that associates with gp27 in an early hub precursor, gp28 is essential for assembling a functional central baseplate plug onto which the six peripheral baseplate wedges circularize, but is absent from the final atomic structure of the mature baseplate.
existing_annotations:
  - term:
      id: GO:0098003
      label: viral tail assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      action: ACCEPT
      reason: Genetic and morphogenesis experiments demonstrate that gp28 is an essential group II baseplate factor required for assembling the central hub of the bacteriophage T4 tail baseplate.
      supported_by:
        - reference_id: file:BPT4/28/28-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'FUNCTION: Baseplate hub assembly chaperone involved in the tail assembly.'
        - reference_id: file:BPT4/28/28-deep-research-falcon.md
          supporting_text: Cells infected with gene 28 amber mutants accumulated normal 15S arm complexes but produced only small amounts of organized 70S baseplate-like structures that were unstable and, critically, lacked the density at the very center of the baseplate when examined by electron microscopy.
references:
  - id: GO_REF:0000043
    title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
    findings: []
  - id: file:BPT4/28/28-uniprot.txt
    title: UniProtKB record for P13336 (28_BPT4)
    findings:
      - statement: gp28 functions as a baseplate hub assembly chaperone in T4 tail assembly and combines with gp27 to form an early hub precursor during morphogenesis.
        record_section: ["CC:SUBUNIT"]
        supporting_text: The gp27 and gp28 proteins seem to combine to form a small hub precursor during morphogenesis.
  - id: file:BPT4/28/28-deep-research-falcon.md
    title: Deep research summary for Bacteriophage T4 gene 28 (gp28)
    findings:
      - statement: Gene 28 amber mutants fail to form the central hub density of the baseplate, and modern models propose that gp28 acts as a hub assembly chaperone not retained in the mature baseplate-tube complex.
        supporting_text: Cells infected with gene 28 amber mutants accumulated normal 15S arm complexes but produced only small amounts of organized 70S baseplate-like structures that were unstable and, critically, lacked the density at the very center of the baseplate when examined by electron microscopy.
core_functions:
  - description: Acts as a baseplate hub assembly factor that associates with gp27 to promote formation of the central hub precursor during bacteriophage T4 tail morphogenesis.
    directly_involved_in:
      - id: GO:0098003
        label: viral tail assembly
    supported_by:
      - reference_id: file:BPT4/28/28-uniprot.txt
        record_section: ["CC:SUBUNIT"]
        supporting_text: The gp27 and gp28 proteins seem to combine to form a small hub precursor during morphogenesis.
      - reference_id: file:BPT4/28/28-deep-research-falcon.md
        supporting_text: One modern interpretation proposes that gp26 and gp28 may act as assembly chaperones and are not found in the fully assembled baseplate–tube complex
    molecular_function:
      id: GO:0039660
      label: structural constituent of virion
suggested_questions:
  - question: How does transient binding of gp28 to gp27 facilitate formation of the (gp5-gp27)3 central hub complex in vivo when recombinant gp5 and gp27 can co-assemble in heterologous expression systems?
  - question: At which step of central hub maturation—incorporation of gp5, gp26, or the gp29 tape measure protein—is gp28 displaced from the hub precursor?
suggested_experiments:
  - description: Perform affinity pull-down and quantitative mass spectrometry using tagged gp28 in T4-infected Escherichia coli extracts carrying amber mutations in genes 5, 26, 27, 29, or 51 to map the exact assembly intermediate in which gp28 resides.
  - description: Determine the crystal or NMR structure of recombinant gp28 alone and bound to gp27 to define the interaction surface and mechanism of hub precursor stabilization.
