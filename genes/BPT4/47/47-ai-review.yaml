  label: Tequatrovirus T4
description: Exonuclease subunit 1 (gp47) is the 339-amino-acid Mre11-family metallophosphoesterase nuclease subunit of the bacteriophage T4 Mre11-Rad50 (gp47-gp46) DNA end-processing complex. Partnering with the Rad50-like ABC-type ATPase subunit gp46 in a heterotetrameric assembly, gp47 catalyzes metal-dependent single-stranded DNA endonuclease and ATP-stimulated double-stranded DNA exonuclease activities that resect DNA ends to generate 3' single-stranded DNA tails. Interaction with the single-stranded DNA-binding protein gp32 and the recombination mediator UvsY modulates gp47 nuclease activity to couple DNA end resection directly to presynaptic filament assembly during double-strand break repair, homologous recombination, and recombination-dependent DNA replication, as well as exonucleolytic degradation of fragmented host chromosomal DNA into mononucleotides.
