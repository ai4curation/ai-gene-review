  - id: file:BPT4/47/47-deep-research-falcon.md
    title: Deep research summary for Enterobacteria phage T4 gene 47 (gp47)
    findings:
      - statement: gp47 is the Mre11-family metallophosphoesterase nuclease subunit that forms the T4 MR complex with gp46 to resect double-strand breaks for homologous recombination and recombination-dependent replication.
        supporting_text: The target protein specified by UniProt accession **P04521** corresponds to **gene product 47 (gp47)** from **Enterobacteria phage T4** and is consistently identified in the literature as the **T4 Mre11 homolog** (nuclease subunit) that partners with **gp46 (Rad50 homolog)** to form the **Mre11–Rad50 (MR) complex**.
      - statement: Interaction with gp32 and UvsY enables Mg2+-dependent endonucleolytic and exonucleolytic processing by the gp46/gp47 complex, coupling resection to recombinase loading.
        supporting_text: Specifically, while Mg2+ alone supports little to no detectable nuclease activity, the presence of **UvsY + gp32** enables a **Mg2+-dependent reaction** with a distinct product distribution (consistent with a switch toward endonucleolytic processing products under those conditions).
suggested_questions:
  - question: How do gp32 and UvsY physically engage gp47 to switch its divalent cation selectivity from Mn2+-dependent 3'-5' exonucleolysis to Mg2+-dependent endonucleolytic cleavage near DNA ends?
  - question: Does gp47 distinguish between hydroxymethylcytosine-glucosylated T4 DNA ends (destined for limited resection and recombinational repair) and nonglucosylated cytosine-containing host DNA fragments (destined for complete degradation)?
suggested_experiments:
  - description: Compare the cleavage kinetics and product profiles of reconstituted gp46/gp47-gp32-UvsY complexes on unmodified cytosine-containing dsDNA vs glucosyl-hydroxymethylcytosine T4 dsDNA substrates in physiological Mg2+ buffers.
    hypothesis: Glucosyl-hydroxymethylcytosine modifications and rapid UvsY/UvsX filament nucleation restrict gp47 resection on phage DNA ends after generating a 3' single-stranded tail, whereas unmodified host DNA fragments undergo extensive exonucleolytic digestion.
  - description: Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) on gp47 in the gp46/gp47 complex upon addition of gp32 and UvsY.
    hypothesis: UvsY and gp32 bind a surface patch on gp47 adjacent to the capping domain, allosterically repositioning the catalytic His/Asp motifs to favor Mg2+-assisted endonucleolytic incision of the 5'-terminated strand.
