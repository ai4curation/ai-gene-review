suggested_questions:
  - question: How does the SH3-like tower/pin domain of Dda sense and destabilize high-affinity protein-DNA roadblocks such as stalled Escherichia coli RNA polymerase without forming a stable ring around the template strand?
  - question: What governs the handoff at T4 replication origins between early Dda-mediated duplex opening and gp59-dependent loading of the hexameric gp41 replicative helicase?
suggested_experiments:
  - description: Use correlative optical tweezers and single-molecule fluorescence microscopy to visualize fluorescently labeled Dda monomers colliding with stalled E. coli RNA polymerase elongation complexes on stretched phage DNA templates.
    hypothesis: Trailing Dda monomers pile up behind a leading monomer at the RNA polymerase barrier, preventing backward slippage and rectifying thermal fluctuations of the transcription bubble until RNA polymerase dissociates.
  - description: Reconstitute T4 origin R-loop unwinding in vitro with purified RNase H, gp32, Dda, gp59, and gp41 to measure the effect of Dda on the kinetics of gp41 hexamer loading.
    hypothesis: Monomeric Dda rapidly expands the initial origin ssDNA bubble to expose a gp32-coated lagging-strand loading site required for gp59-mediated gp41 recruitment.
