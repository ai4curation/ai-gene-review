taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: ATP-dependent DNA helicase Dda (DNA-dependent ATPase) is a 439-amino-acid superfamily 1B (SF1B) 5'-3' DNA helicase of bacteriophage T4. Capable of unwinding duplex DNA at rates of ~250 bp/s as a monomer and generating higher displacement forces when multiple monomers assemble along single-stranded DNA, Dda couples ssDNA-stimulated ATP hydrolysis to 5'-3' translocation, duplex unwinding, and displacement of DNA-bound protein roadblocks such as host RNA polymerase. In vivo and in vitro, Dda facilitates early origin-dependent viral DNA replication initiation, clears protein barriers ahead of the replication fork, and cooperates with UvsX and gp32 in recombinational template switching.
