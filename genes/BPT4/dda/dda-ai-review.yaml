  - id: PMID:12411580
    title: Pre-steady-state DNA unwinding by bacteriophage T4 Dda helicase reveals a monomeric molecular motor.
    findings:
      - statement: Monomeric Dda rapidly unwinds oligonucleotide duplexes in pre-steady-state assays without requiring oligomerization.
        supporting_text: Thus, Dda can rapidly unwind oligonucleotide substrates as a monomer, indicating that the functional molecular motor component of a helicase can reside within a single polypeptide.
  - id: PMID:1328208
    title: Overexpression, purification, sequence analysis, and characterization of the T4 bacteriophage dda DNA helicase.
    findings:
      - statement: Dda is a 5'-3' DNA helicase and DNA-dependent ATPase that stimulates T4 DNA replication and recombination in vitro and contributes to replication initiation in vivo.
        supporting_text: The bacteriophage T4 dda protein is a 5'-3' DNA helicase that stimulates DNA replication and recombination reactions in vitro and seems to play a role in the initiation of T4 DNA replication in vivo.
  - id: PMID:17823128
    title: The phage T4 protein UvsW drives Holliday junction branch migration.
    findings:
      - statement: Together with the UvsX recombinase, Dda helicase promotes template strand switching by T4 DNA polymerase.
        supporting_text: In this system, the strand exchange protein UvsX and the Dda helicase promoted strand switching by T4 polymerase.
  - id: PMID:7806534
    title: A role for two DNA helicases in the replication of T4 bacteriophage DNA.
    findings:
      - statement: Dda provides an alternative helicase pathway that allows the T4 replication machinery to bypass DNA-bound RNA polymerase barriers.
        supporting_text: A second, very different DNA helicase, the T4 dda protein, provides an alternative pathway for replication past this DNA-bound RNA polymerase
