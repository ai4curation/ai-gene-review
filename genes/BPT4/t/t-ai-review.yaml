suggested_questions:
- question: >-
    How does the transmembrane helix of holin T rearrange within the inner membrane
    once the periplasmic domain is released from antiholin RI inhibition or reaches
    its critical triggering threshold?
- question: >-
    Does the cytoplasmic N-terminal domain of holin T interact directly with the
    cytoplasmic antiholin RIII simultaneously with periplasmic RI binding to the
    C-terminal domain in vivo?
suggested_experiments:
- description: >-
    Perform cryo-electron tomography and subtomogram averaging of triggered holin T
    micron-scale lesions in Escherichia coli inner membrane vesicles to resolve the
    architecture of the transmembrane pore wall.
  hypothesis: >-
    Holin T oligomerizes into higher-order two-dimensional rafts that nucleate a
    lipid-protein lined mega-pore upon collapse of the proton motive force.
- description: >-
    Use single-molecule fluorescence bleaching and FRET in live infected E. coli
    cells co-expressing fluorescently tagged holin T, periplasmic RI, and
    cytoplasmic RIII to quantify complex stoichiometry before and after secondary
    phage adsorption.
  hypothesis: >-
    Superinfection stabilizes a ternary RI-T-RIII complex across the inner membrane
    that locks holin T in a non-oligomerizing state.
