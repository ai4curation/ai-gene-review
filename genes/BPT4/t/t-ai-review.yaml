core_functions:
- description: >-
    Forms micron-scale pores in the host bacterial inner (plasma) membrane at a
    genetically scheduled time during late infection, collapsing the proton motive
    force and allowing cytoplasmic endolysin (gpE) to escape into the periplasm to
    trigger host cell cytolysis and virion release.
