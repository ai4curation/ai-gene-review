  label: Tequatrovirus T4
description: >-
  Holin T (gpT, also known as protein rV) is a 218-amino-acid single-pass type II
  membrane protein of bacteriophage T4 that functions as the canonical class III
  holin and master timer of host cell lysis. During late infection, holin T
  accumulates in the Escherichia coli inner (plasma) membrane with its N-terminus
  in the cytoplasm and a large globular C-terminal domain in the periplasm. At a
  genetically programmed time, it triggers to form micron-scale pores in the host
  inner membrane, collapsing the membrane potential and releasing the cytoplasmic
  endolysin (gpE) into the periplasm to degrade the peptidoglycan layer. Its
  periplasmic domain also serves as the direct binding partner for the periplasmic
  antiholin RI, which blocks holin oligomerization to establish lysis inhibition
  (LIN) upon superinfection.
