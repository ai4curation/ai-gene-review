suggested_questions:
  - question: Does gp52.2 (protein ac) form an oligomeric ion or small-molecule channel in the Escherichia coli inner membrane itself, or does it inhibit a host multidrug efflux pump (such as AcrAB-TolC) to cause intracellular acridine accumulation?
  - question: What selective advantage does gene ac provide to bacteriophage T4 in natural polymicrobial environments where acridines are absent?
suggested_experiments:
  - description: Measure ethidium bromide and acriflavin influx and efflux rates in wild-type vs delta-acrAB-tolC Escherichia coli strains expressing T4 gene ac (52.2) from an inducible plasmid.
    hypothesis: Protein ac either directly permeabilizes the inner membrane independent of AcrAB-TolC or inhibits AcrB-mediated efflux of planar cationic dyes.
  - description: Perform affinity purification Coupled to mass spectrometry (AP-MS) of epitope-tagged gp52.2 solubilized from T4-infected E. coli inner membranes.
    hypothesis: gp52.2 interacts with a specific host inner-membrane transporter or phage co-factor (such as theama/rII membrane proteins) to modulate envelope energetics during infection.
