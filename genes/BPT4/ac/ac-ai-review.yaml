id: P18924
gene_symbol: ac
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Protein ac (gp52.2) is a 51-amino-acid predicted two-pass integral membrane protein of bacteriophage T4 that localizes to the host Escherichia coli membrane. Wild-type protein ac alters host membrane permeability and promotes cellular accumulation of acridine dyes such as acriflavin, rendering phage development sensitive to acridine inhibition; conversely, loss-of-function mutations in gene ac reduce acridine uptake and confer resistance to acridine-mediated inhibition of T4 development. Its precise molecular function during normal phage infection in the absence of acridines remains uncharacterized.
existing_annotations:
  - term:
      id: GO:0033644
      label: host cell membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: Protein ac (gp52.2) is a 51-residue hydrophobic protein predicted to insert into the host bacterial membrane as a multi-pass transmembrane protein, consistent with its role in modulating host membrane permeability to acridines.
      action: ACCEPT
      reason: Sequence architecture (two transmembrane helices) and physiological evidence showing altered acriflavin flux across the infected Escherichia coli cell envelope support localization to the host cell membrane (GO:0033644).
      supported_by:
        - reference_id: file:BPT4/ac/ac-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Host membrane {ECO:0000305}; Multi-pass membrane protein {ECO:0000305}.'
        - reference_id: file:BPT4/ac/ac-deep-research-falcon.md
          supporting_text: '**Acriflavin inhibits T4 development**, and **mutations in the T4 ac gene (gene 52.2) overcome acriflavin inhibition and allow phage development**'
  - term:
      id: GO:0046677
      label: response to antibiotic
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Wild-type protein ac does not mediate a protective response to antibiotics; instead, loss-of-function mutations in gene ac confer resistance to acridine dyes by preventing wild-type ac-dependent acridine uptake.
      action: REMOVE
      reason: This annotation is a UniProt keyword-mapping artifact derived from the disruption phenotype of ac mutants. Wild-type gp52.2 increases sensitivity of phage development to acriflavin (an intercalating acridine dye) rather than mediating a response to antibiotics, and resistance arises only when gene ac is mutated or inactivated.
      supported_by:
        - reference_id: file:BPT4/ac/ac-uniprot.txt
          supporting_text: 'DISRUPTION PHENOTYPE: Mutations in the gene confer resistance to acridine-inhibition of phage development. {ECO:0000269|PubMed:9560385}.'
        - reference_id: file:BPT4/ac/ac-deep-research-falcon.md
          supporting_text: '**Acriflavin inhibits T4 development**, and **mutations in the T4 ac gene (gene 52.2) overcome acriflavin inhibition and allow phage development**'
