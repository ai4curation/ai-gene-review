  - id: file:BPT4/stp/stp-deep-research-falcon.md
    title: Deep research summary for Bacteriophage T4 stp
    findings:
      - statement: Stp is a 26-amino-acid effector/regulator peptide rather than a catalytic nuclease.
        supporting_text: Stp itself is best understood as an **effector/regulator peptide**, not as the catalytic nuclease.
      - statement: Stp selectively abolishes EcoPrrI DNA restriction activity without inhibiting its methyltransferase activity, which in turn unmasks the latent host PrrC anticodon nuclease.
        supporting_text: Penner et al. show that Stp **abolishes EcoPrrI restriction activity but not the cognate modification activity**, consistent with selective interference with the restriction apparatus
  - id: file:BPT4/stp/stp-uniprot.txt
    title: UniProtKB entry P62765 (STP_BPT4)
    findings:
      - statement: Stp inactivates host DNA restriction systems including EcoPrrI and EcoR124I and consequently activates the host anticodon nuclease PrrC.
        supporting_text: Plays a role in the inactivation of several host DNA restriction systems including EcoprrI or EcoR124I. As a consequence, it activates the host anticodon nuclease PrrC. However, the phage-encoded RNA repair enzymes normally offset the damage. {ECO:0000269|PubMed:14507369, ECO:0000269|PubMed:1639077, ECO:0000269|PubMed:7791212}.
      - statement: The conserved N-proximal 18 residues of Stp mediate both anti-restriction and PrrC activation.
        supporting_text: The conserved N-proximal 18 residue region of Stp is critical both for its anti-DNA restriction and ACNase activating functions. {ECO:0000269|PubMed:7791212}.
suggested_questions:
  - question: Where on the EcoPrrI (HsdR2M2S1)-PrrC holoenzyme complex does the 26-residue Stp peptide bind to uncouple DNA translocation/restriction from PrrC silencing?
  - question: How broadly does Stp inhibit other Type I restriction-modification families beyond Type IC (EcoPrrI and EcoR124I)?
suggested_experiments:
  - description: Determine the cryo-EM structure of the EcoPrrI-PrrC complex in the presence and absence of synthetic Stp peptide and dTTP/GTP to visualize the allosteric switch from anti-restriction to PrrC anticodon nuclease activation.
  - description: Test synthetic Stp peptide variants systematically across purified Type IA, IB, and IC restriction-modification enzymes in vitro to map its inhibition spectrum and binding interface on HsdR/HsdM.
