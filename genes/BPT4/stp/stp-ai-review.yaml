core_functions:
  - description: Acts as a 26-amino-acid enzyme regulator peptide that inhibits the DNA restriction activity of host Type IC restriction-modification complexes (EcoPrrI and EcoR124I) while allosterically unmasking the latent host PrrC anticodon nuclease.
    directly_involved_in:
      - id: GO:0099018
        label: symbiont-mediated evasion of host restriction-modification system
    supported_by:
      - reference_id: file:BPT4/stp/stp-deep-research-falcon.md
        supporting_text: Penner et al. show that Stp **abolishes EcoPrrI restriction activity but not the cognate modification activity**, consistent with selective interference with the restriction apparatus
      - reference_id: file:BPT4/stp/stp-uniprot.txt
        supporting_text: Plays a role in the inactivation of several host DNA restriction systems including EcoprrI or EcoR124I. As a consequence, it activates the host anticodon nuclease PrrC. However, the phage-encoded RNA repair enzymes normally offset the damage. {ECO:0000269|PubMed:14507369, ECO:0000269|PubMed:1639077, ECO:0000269|PubMed:7791212}.
    molecular_function:
      id: GO:0030234
      label: enzyme regulator activity
