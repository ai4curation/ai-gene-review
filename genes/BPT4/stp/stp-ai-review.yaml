  label: Tequatrovirus T4
description: Suppressor of prr (Stp; gpAc.6) is a 26-amino-acid early regulatory peptide of bacteriophage T4 that binds and inhibits host Type IC DNA restriction-modification complexes such as EcoPrrI and EcoR124I, selectively abolishing their restriction endonuclease activity while sparing modification activity. In Escherichia coli hosts encoding the latent anticodon nuclease PrrC in complex with EcoPrrI, binding of Stp's conserved N-proximal 18-residue region allosterically unmasks PrrC, triggering cleavage of host tRNA(Lys) that wild-type T4 subsequently counters via its polynucleotide kinase/phosphatase (Pnkp) and RNA ligase 1 (RnlA) tRNA repair pathway. Stp is a non-catalytic effector peptide and possesses no intrinsic nuclease activity.
