suggested_questions:
  - question: At what precise moment during sheath contraction and outer membrane penetration does the (gp27)3 cylinder dissociate from the gp5 C-terminal needle or from the distal tip of the gp48 tail-tube ring to clear the conduit for genomic DNA exit?
  - question: How does the transient association of gp28 with gp27 during early morphogenesis promote assembly of the (gp5-gp27)3 hub complex prior to wedge circularization?
suggested_experiments:
  - description: Use cryo-electron tomography of bacteriophage T4 particles adsorbed to Escherichia coli minicells at sequential time points to determine whether the (gp27)3 cylinder remains attached to the gp48 tube tip in the periplasm or is released into the host envelope after outer membrane puncture.
  - description: Co-express gp27 with candidate hub assembly factors gp26, gp28, and gp51 in Escherichia coli and analyze complex formation by size-exclusion chromatography coupled to multi-angle light scattering (SEC-MALS) to test whether gp28 stabilizes monomeric or trimeric gp27 intermediates.
