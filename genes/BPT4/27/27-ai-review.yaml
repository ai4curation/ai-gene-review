    title: Structure of the cell-puncturing device of bacteriophage T4.
    findings:
      - statement: Determines the 2.9 A crystal structure of the (gp5-gp27)3 cell-puncturing complex, showing that three gp27 monomers form a hollow cylinder that binds the N-terminal domain of gp5 and extends the DNA ejection channel at the center of the baseplate.
