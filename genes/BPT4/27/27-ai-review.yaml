      - reference_id: file:BPT4/27/27-uniprot.txt
        record_section: ["CC:SUBUNIT"]
        supporting_text: Heteromultimer with gp5 trimer and gp5.4 monomer; this interaction forms the tail lysozyme complex that creates an extension of the tail tube (PubMed:12837775, PubMed:27193680).
