  label: Tequatrovirus T4
description: Baseplate central hub and cell-puncturing complex protein gp27 of bacteriophage T4 that forms a hollow homotrimeric cylinder at the center of the tail baseplate. Because each gp27 subunit contains two homologous torus domains, the (gp27)3 trimer acts as a symmetry adaptor bridging the three-fold symmetric (gp5)3 membrane-puncturing lysozyme needle at its base with the six-fold symmetric inner baseplate wedges (gp6, gp25, gp53) and the hexameric gp48 tail-tube junction ring above, while forming a continuous central channel for viral DNA ejection.
