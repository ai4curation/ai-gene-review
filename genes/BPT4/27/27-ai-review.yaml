core_functions:
  - description: Forms the homotrimeric pseudo-six-fold central hub cylinder of the T4 baseplate that binds the trimeric gp5 cell-puncturing needle below and interfaces with the six inner baseplate wedges (gp6, gp25, gp53) and the hexameric gp48 tail-tube junction ring above, extending the central channel for viral DNA ejection.
