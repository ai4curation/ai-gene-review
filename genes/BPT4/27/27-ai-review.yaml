  - id: PMID:15701513
    title: Control of bacteriophage T4 tail lysozyme activity during the infection process.
    findings:
      - statement: Solves the crystal structure of the non-cleaved gp5(S351L) mutant in complex with gp27, demonstrating how gp5 maturation and inhibition operate within the (gp5-gp27)3 central hub complex.
        supporting_text: The crystal structure of the non-cleavage phenotype mutant of gp5, S351L, complexed with gene product 27, showed that the 18 residues in the vicinity of the potential cleavage site (disordered in the wild-type structure) had visible electron density.
  - id: PMID:27193680
    title: Structure of the T4 baseplate and its function in triggering sheath contraction.
    findings:
      - statement: Presents the atomic structure of the ~6-MDa T4 baseplate in pre- and post-attachment states, defining the role of the central gp27 hub and surrounding wedge proteins in triggering sheath contraction.
        supporting_text: Here we present the atomic structure of the approximately 6-megadalton bacteriophage T4 baseplate in its pre- and post-host attachment states and explain the events that lead to sheath contraction in atomic detail.
