      polymerase at the replication fork and generating ssDNA for both leading and
      lagging strand synthesis (PubMed:11459969, PubMed:23578280).
- id: file:BPT4/41/41-deep-research-falcon.md
  title: Deep research summary for Enterobacteria phage T4 replicative helicase gp41
  findings:
  - statement: >-
      gp41 is a hexameric ring-shaped replicative helicase that couples ATP/GTP
      hydrolysis to 5'-3' translocation on ssDNA and unwinding of replication forks.
    supporting_text: >-
      **gp41 is the T4 replicative helicase** and functions as an **ssDNA-stimulated
      ATPase/GTPase** whose NTP hydrolysis drives **5′→3′ translocation** on ssDNA
      and **fork unwinding**.
suggested_questions:
- question: >-
    What is the high-resolution structural mechanism by which the gp59 helicase
    loader opens the hexameric gp41 ring to thread the lagging-strand template
    into the central channel?
- question: >-
    How does transient physical coupling between the moving gp41 hexamer and the
    leading-strand gp43 DNA polymerase switch gp41 from a passive ~30 bp/s
    unwinding mode to rapid (~400 bp/s) replisomal unwinding?
suggested_experiments:
- description: >-
    Resolve cryo-EM structures of the T4 primosome-loading intermediate containing
    forked DNA, gp32, gp59, gp41, and gp61 in the presence of ADP-BeFx.
  hypothesis: >-
    gp59 wedges into a single subunit interface of the gp41 hexamer, stabilizing a
    cracked right-handed spiral conformation that closes into a planar translocating
    ring upon gp61 binding and ATP hydrolysis.
- description: >-
    Perform single-molecule magnetic tweezers unwinding assays with gp41 and gp43
    variants carrying targeted mutations in their C-terminal and N-terminal surface
    loops.
  hypothesis: >-
    A flexible electrostatic tether between the C-terminal tail of gp41 and the
    palm/thumb domain of gp43 prevents polymerase-helicase uncoupling and DNA
    rezipping behind the advancing helicase.
