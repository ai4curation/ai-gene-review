core_functions:
- description: >-
    Unwinds double-stranded viral DNA ahead of the replication fork by translocating
    5' to 3' as a homohexameric ring along the lagging-strand single-stranded DNA
    template, coupling ATP hydrolysis to replication fork progression and
    primosome-mediated primer synthesis.
  molecular_function:
    id: GO:0003678
    label: DNA helicase activity
  directly_involved_in:
  - id: GO:0039686
    label: bidirectional double-stranded viral DNA replication
  supported_by:
  - reference_id: file:BPT4/41/41-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      ATP-dependent DNA helicase essential for viral DNA replication and
      recombination (PubMed:10871615). The helicase moves 5' -> 3' on the lagging
      strand template, unwinding the DNA duplex ahead of the leading strand
      polymerase at the replication fork and generating ssDNA for both leading and
      lagging strand synthesis (PubMed:11459969, PubMed:23578280).
  - reference_id: file:BPT4/41/41-deep-research-falcon.md
    supporting_text: >-
      **gp41 is the T4 replicative helicase** and functions as an **ssDNA-stimulated
      ATPase/GTPase** whose NTP hydrolysis drives **5′→3′ translocation** on ssDNA
      and **fork unwinding**.
  - reference_id: PMID:15781450
    supporting_text: >-
      We also found that all origin-replicative intermediates were absent in
      infections deficient in the helicase gp41 or the single-strand-binding
      protein gp32, regardless of whether gp59 was present or absent.
