    label: DNA replication, synthesis of primer
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gp41 forms the primosome complex with the gp61 primase and is required to
      recruit and stimulate gp61 for lagging-strand RNA primer synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      While gp61 catalyzes the actual synthesis of the pentaribonucleotide primer,
