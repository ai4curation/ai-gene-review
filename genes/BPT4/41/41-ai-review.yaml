id: P04530
gene_symbol: '41'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  DNA helicase gp41 is a 475-amino-acid superfamily 4 (DnaB-like) hexameric
  replicative DNA helicase that serves as the primary fork-unwinding motor of the
  bacteriophage T4 replisome. Upon binding ATP or GTP, gp41 assembles into a
  ring-shaped homohexamer that is loaded onto gp32-coated replication forks and
  recombination intermediates by the helicase loader gp59. Translocating in the
  5' to 3' direction along the lagging-strand template, gp41 unwinds duplex DNA
  ahead of the leading-strand gp43 DNA polymerase and associates directly with the
  gp61 primase to form the primosome, coordinating lagging-strand RNA primer
  synthesis with rapid replication fork progression during origin-dependent and
  recombination-dependent viral DNA replication.
