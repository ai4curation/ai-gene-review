- id: PMID:10871615
  title: Interaction of the bacteriophage T4 gene 59 helicase loading protein and
    gene 41 helicase with each other and with fork, flap, and cruciform DNA.
  findings:
  - statement: >-
      Helicase loader gp59 binds to and stimulates gp41 DNA helicase activity on
      Holliday junctions and strand-invasion-like branched DNA substrates.
    supporting_text: >-
      Consistent with the roles of these proteins in recombination, we find that
      59 protein binds to and stimulates 41 helicase activity on Holliday junction
      DNA, and on a substrate that resembles a strand invasion structure.
- id: PMID:15781450
  title: Bacteriophage T4 helicase loader protein gp59 functions as gatekeeper in
    origin-dependent replication in vivo.
  findings:
  - statement: >-
      Origin-replicative intermediates are completely absent in T4 infections
      lacking the gp41 replicative helicase.
    supporting_text: >-
      We also found that all origin-replicative intermediates were absent in
      infections deficient in the helicase gp41 or the single-strand-binding
      protein gp32, regardless of whether gp59 was present or absent.
- id: PMID:8107085
  title: Kinetic parameters of the translocation of bacteriophage T4 gene 41 protein
    helicase on single-stranded DNA.
  findings:
  - statement: >-
      gp41 possesses a single-stranded DNA-dependent ATPase activity that drives
      processive translocation along ssDNA and is essential for its helicase
      activity.
    supporting_text: >-
      The bacteriophage T4 gene 41 helicase protein (gp41) carries a
      single-stranded DNA-dependent ATPase activity that is essential to its
      helicase activity.
