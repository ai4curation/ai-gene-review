id: P17173
gene_symbol: '51'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate hub assembly chaperone gp51 of bacteriophage T4 required during the late phase of infection for the formation of the central hub of the tail baseplate. Synthesized in very low copy numbers in the infected host cell and absent from mature virions, gp51 acts transiently alongside group II hub components (gp5, gp26, gp27, gp28, and gp29) to promote assembly of a functional central baseplate plug onto which the six peripheral baseplate wedges circularize.
