id: P13304
gene_symbol: rI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  Protein rI (gpRI) is a 97-amino-acid periplasmic antiholin of bacteriophage T4
  that serves as the primary sensor and effector of lysis inhibition (LIN) in
  response to superinfection. Synthesized as a precursor with a cleavable 24-residue
  N-terminal Sec signal peptide, mature soluble RI is released into the Escherichia
  coli periplasm where it binds the periplasmic C-terminal domain of holin T (gpT)
  to form a heterotetrameric T2-RI2 complex. By stabilizing holin T in an inactive
  state—further reinforced by binding periplasmic DNA released from superinfecting
  virions—RI blocks holin oligomerization and inner-membrane pore formation,
  delaying host cell lysis and extending intracellular virion maturation.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      In complex with the periplasmic domain of holin T, RI participates in binding
      periplasmic double-stranded DNA from superinfecting phages as a lysis
      inhibition signal.
    action: KEEP_AS_NON_CORE
    reason: >-
      DNA binding is an accessory sensory property of the assembled holin-antiholin
      (T-RI) complex during superinfection rather than the primary intrinsic
      function of RI, which is inhibition of holin T pore-forming activity.
    supported_by:
    - reference_id: file:BPT4/rI/rI-uniprot.txt
      supporting_text: >-
        The genomic DNA from the superinfecting phage bound to the complex
        holin-antiholin probably serves as a signal for the lysis inhibition and
        blocks the holin multimerization.
- term:
    id: GO:0031640
    label: killing of cells of another organism
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      RI is an antiholin that inhibits holin T and delays host cell lysis upon
      superinfection rather than killing the host cell.
    action: MODIFY
    reason: >-
      Killing of cells of another organism (GO:0031640) has the opposite biological
      direction to RI's actual function; RI suppresses holin-mediated cytolysis in
      response to secondary phage infection, which is specifically represented by
      suppression by virus of host cell lysis in response to superinfection
      (GO:0039639).
    proposed_replacement_terms:
    - id: GO:0039639
      label: suppression by virus of host cell lysis in response to superinfection
    supported_by:
    - reference_id: file:BPT4/rI/rI-uniprot.txt
      supporting_text: >-
        Involved in lysis inhibition. Senses superinfections and inhibits the holin,
        thereby delaying the host cell lysis timing.
    - reference_id: file:BPT4/rI/rI-deep-research-falcon.md
      supporting_text: >-
        **Primary function:** RI is a **T-holin inhibitor (antiholin)** that binds
        the holin and prevents holin **oligomerization/triggering**, delaying
        membrane permeabilization and therefore delaying endolysin access to
        peptidoglycan
- term:
    id: GO:0044229
    label: host cell periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: >-
      Following cleavage of its N-terminal signal peptide by signal peptidase I,
      mature RI localizes to the Escherichia coli periplasmic space.
    action: ACCEPT
    reason: >-
      Experimental and sequence evidence establish that mature RI is released into
      the host cell periplasmic space where it binds the periplasmic domain of
      holin T.
    supported_by:
    - reference_id: PMID:34456892
      supporting_text: >-
        Here we show that, in contrast to previous reports, this domain of RI is a
        cleavable signal peptide. RI is processed and released into the periplasm as
        a mature protein, and inactivation of its signal peptidase cleavage site
        blocks processing and membrane release.
- term:
    id: GO:0140678
    label: molecular function inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      RI directly binds the periplasmic C-terminal domain of holin T and inhibits
      its oligomerization and pore-forming activity.
    action: ACCEPT
    reason: >-
      Molecular function inhibitor activity (GO:0140678) accurately captures the
      core antiholin activity of RI in inhibiting holin T.
    supported_by:
    - reference_id: PMID:17693511
      supporting_text: >-
        At the molecular level, this is due to the inhibition of the holin, T, by
        the antiholin, RI. RI is only 97 residues and contains an N-terminal
        hydrophobic domain and a C-terminal hydrophilic domain; expression of the
        latter domain fused to a secretory signal sequence is sufficient to impose
        LIN, due to its specific interaction with the periplasmic domain of the T
        holin.
