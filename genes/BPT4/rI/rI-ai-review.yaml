suggested_questions:
- question: >-
    What regulates the rapid turnover of mature periplasmic RI in the absence of
    superinfection if DegP is not required for its proteolytic degradation?
- question: >-
    How does transient periplasmic passage of superinfecting phage genomic DNA or
    internal capsid proteins allosterically stabilize the periplasmic T2-RI2
    heterotetramer in vivo?
suggested_experiments:
- description: >-
    Perform pulse-chase radiolabeling of mature periplasmic RI across a panel of
    Escherichia coli periplasmic protease knockouts (degP, ptrA, tsp/prc,degQ,
    degS) during T4 infection.
  hypothesis: >-
    A periplasmic protease distinct from DegP—or spontaneous conformational
    unfolding of free mature RI—rapidly clears uncomplexed RI unless stabilized by
    superinfection signals.
- description: >-
    Measure binding kinetics and complex half-life of purified mature RI (residues
    25-97) and the periplasmic domain of holin T by surface plasmon resonance in
    the presence and absence of linear dsDNA fragments.
  hypothesis: >-
    Binding of dsDNA across the composite T-RI positively charged groove reduces
    the dissociation rate constant (k_off) of the T-RI complex by more than an
    order of magnitude.
