- term:
    id: GO:0003796
    label: lysozyme activity
  evidence_type: IDA
  original_reference_id: PMID:10217762
  qualifier: enables
  review:
    summary: >-
      CACAO row. The cited paper is about gp5, the 575-residue product of the
      adjacent gene 5: it measures the lysozyme activity of the gp5 precursor,
      of the nicked precursor and of mature gp5, and traces the fate of the
      cleaved C-terminal fragment gp5C. gp5.4 is a 97-residue PAAR-repeat
      protein with no glycoside hydrolase domain, and the paper does not mention
      it.
    action: REMOVE
    reason: >-
      The assay is on the right protein family but the wrong gene product. The
      abstract states in its first sentence that the tail lysozyme "is the
      product of gene 5 (gp 5)", and the masses it reports (63 kDa precursor,
      43 kDa mature) are those of gp5, not of the 10.2 kDa gp5.4. Independently
      of the paper, gp5.4 cannot have this activity: the entry is 97 residues
      long with a single PAAR_motif domain (Pfam PF05488) and its structure is
      solved to 1.15 A as a metal-stabilised cone with no catalytic cleft, so
      there is no muramidase domain to carry EC 3.2.1.17. Nothing is lost by
      removal, because P16009 (gene 5) already carries lysozyme activity from
      this same reference. Note also that gp5.4 was an unidentified density in
      the 2003 baseplate reconstruction and was only recognised as a protein of
      the PAAR family in 2013 (PMID:23925114), fourteen years after this paper,
      so it cannot have been the subject of the assay.
