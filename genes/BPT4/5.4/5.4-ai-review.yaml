- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0479
  review:
    summary: >-
      Keyword-derived annotation that matches real structural evidence: the
      1.15 A crystal structure of gp5.4 bound to the gp5 beta-helix fragment
      contains a single metal ion coordinated by His14, His46, His56 and Cys83,
      the conserved PAAR metal site, which stabilises the pointed vertex of the
      cone.
    action: ACCEPT
    reason: >-
      The claim is correct and the general term is the right granularity here.
      UniProt curates an Fe cation cofactor for gp5.4 with four binding
      residues from PDB 4KU0, but the homologous site in the structurally
      characterised bacterial PAAR proteins was shown by X-ray fluorescence and
      anomalous difference maps to hold zinc, at residues that align with
      gp5.4's (H14/H46/H54/C81 in VCA0105 vs H14/H46/H56/C83 in gp5.4). Since
      the identity of the ion in gp5.4 rests on a single unpublished
      deposition, GO:0046872 is as specific as the evidence firmly allows and
      is not modified to GO:0005506 iron ion binding; if the Fe assignment is
      confirmed spectroscopically, the row should be refined then. The function
      of the ion is structural - it holds the tip of the cone together - so
      this is retained as part of the gene's core, puncturing-tip role rather
      than as a peripheral binding term.
    supported_by:
    - reference_id: file:BPT4/5.4/5.4-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: >-
        Name=Fe cation; Xref=ChEBI:CHEBI:24875;
    - reference_id: file:BPT4/5.4/5.4-uniprot.txt
      record_section: [REF]
      supporting_text: >-
        X-RAY CRYSTALLOGRAPHY (1.15 ANGSTROMS) OF 2-97 IN COMPLEX WITH IRON, COFACTOR, AND FUNCTION.
    - reference_id: PMID:23925114
      supporting_text: >-
        The Zn binding site consists of three histidines and one cysteine - H14, H46, H54 and C81 in VCA0105 - that are very well conserved in close homologs
    - reference_id: PMID:23925114
      supporting_text: >-
        The metal ion, being a natural ligand for this site, stabilizes the pointed tip of the PAAR domain and is likely to be important for its integrity during penetration of the target cell envelope.
