id: P39234
gene_symbol: '5.4'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  Baseplate puncturing device gp5.4 of bacteriophage T4, a 97-residue (10.2 kDa)
  protein of the PAAR-repeat superfamily that forms the sharp conical tip of the
  virion central spike. A single copy of gp5.4 caps the blunt distal end of the
  trimeric C-terminal beta-helix of gp5, completing the central spike complex at
  the hub of the contractile tail baseplate together with the gp5 and gp27
  trimers. Its small cone-shaped fold is stabilised by one metal ion held close
  to the vertex by three histidines and a cysteine (His14, His46, His56, Cys83);
  the ion is modelled as Fe(III) in the gp5.4-gp5 crystal structure, while the
  equivalent, sequence-conserved site of bacterial PAAR proteins carries zinc.
  Because it caps the spike, gp5.4 is the leading point of the injection machine
  and is thought to make the initial opening in the host outer membrane when
  sheath contraction drives the spike into the cell envelope - the step that
  precedes local peptidoglycan digestion by the gp5 lysozyme domain and ejection
  of the viral genome through the tail tube. gp5.4 is the phage counterpart of
  the PAAR proteins that sharpen the VgrG spike of the bacterial type VI
  secretion system.
