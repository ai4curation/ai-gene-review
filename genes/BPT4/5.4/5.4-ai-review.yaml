references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:10217762
  title: The C-terminal fragment of the precursor tail lysozyme of bacteriophage T4
    stays as a structural component of the baseplate after cleavage.
  findings:
  - statement: >-
      The tail-associated lysozyme of phage T4 is the product of gene 5, an
      essential structural component of the baseplate hub, synthesised as a
      63 kDa precursor that is cleaved to a 43 kDa mature protein.
    supporting_text: >-
      Tail-associated lysozyme of bacteriophage T4 (tail lysozyme), the product of gene 5 (gp 5), is an essential structural component of the hub of the phage baseplate. It is synthesized as a 63-kDa precursor, which later cleaves to form mature gp 5 with a molecular weight of 43,000.
  - statement: >-
      The C-terminal cleavage fragment of the gp5 precursor (gp5C) remains in
      the tail and in the phage particle, so it is a structural component of
      the baseplate.
    supporting_text: >-
      Surprisingly, the C-terminal fragment was found in the tail and the phage particle by immunoblotting.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PubMed-verified; the identifier resolves to the intended paper. It is
      about gp5 (UniProtKB:P16009) and its cleavage fragment gp5C, and does not
      mention gene 5.4 - which had not been identified as a protein in 1999 -
      so it supports none of the four claims made from it about P39234. Cached
      record is abstract-only.
- id: PMID:23925114
  title: PAAR-repeat proteins sharpen and diversify the type VI secretion system spike.
  findings:
  - statement: >-
      gp5.4 is the bacteriophage T4 member of the PAAR-repeat superfamily,
      identified as the small protein that binds the tip of the gp5 beta-helix
      in the baseplate.
    supporting_text: >-
      Proteins containing the PAAR-repeat motif were strongly represented in this group with gp5.4 being the corresponding protein of T4 phage.
  - statement: >-
      A PAAR protein folds into a cone with a sharp tip and a triangular base
      that fully occupies the blunt end of the spike beta-helix.
    supporting_text: >-
      In both complexes, a single chain of the PAAR protein folds into a symmetrical cone-shaped structure with a sharp tip and a triangular base fully occupying the blunt end of the β-helix
  - statement: >-
      The PAAR fold is stabilised by a zinc ion bound by three histidines and
      one cysteine, a site conserved across close homologues, which holds the
      pointed tip together during envelope penetration.
    supporting_text: >-
      The fold of the PAAR protein is stabilized by a Zn atom positioned close to the cone’s vertex
  - statement: >-
      Because the PAAR protein caps the spike, it is the piercing tip that
      makes the initial opening in the target cell envelope.
    supporting_text: >-
      Because a PAAR-repeat protein caps the end of the β-helix of a VgrG spike, it is in fact the piercing tip that is responsible for the initial event of creating an opening in the target cell envelope.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text read from the cache (PMC3792578). The crystal
      structures reported are of two bacterial PAAR proteins bound to a T4 gp5
      beta-helix fragment, not of gp5.4 itself, so the gp5.4-specific content
      is the family assignment and the mechanistic conclusion about the spike
      cap; the gp5.4 structure itself is the unpublished PDB 4KU0 deposition
      cited by UniProt as Ref.2.
- id: PMID:27193680
  title: Structure of the T4 baseplate and its function in triggering sheath contraction.
  findings:
  - statement: >-
      The atomic structure of the 6 MDa T4 baseplate was determined in pre- and
      post-host-attachment states, identifying the components of the assembly
      and the mechanism that triggers sheath contraction.
    supporting_text: >-
      Here we present the atomic structure of the approximately 6-megadalton bacteriophage T4 baseplate in its pre- and post-host attachment states and explain the events that lead to sheath contraction in atomic detail.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. This is the work from which gp5.4 was placed in the
      baseplate central spike complex; UniProt's name, subunit composition and
      subcellular location for P39234 all carry ECO:0000269 or ECO:0000303 to
      it. Cached record is abstract-only, so the gp5.4-specific modelling was
      read through the UniProt annotation rather than the figures.
- id: PMID:3157805
  title: Isolation and characterization of the bacteriophage T4 tail-associated lysozyme.
  findings:
  - statement: >-
      The T4 tail-associated lysozyme was purified from tails and identified
      unambiguously as gp5, a 42 kDa component of the baseplate hub, with
      N-acetylmuramidase activity matching the gene e lysozyme.
    supporting_text: >-
      Direct evidence has been obtained that the tail-associated lysozyme of bacteriophage T4 (tail-lysozyme) is gp5, which is a protein component of the hub of the baseplate.
  - statement: >-
      The purified tail lysozyme has N-acetylmuramidase activity with the same
      substrate specificity as the gene e lysozyme but a lower pH optimum.
    supporting_text: >-
      The tail-lysozyme has N-acetylmuramidase activity and the same substrate specificity as gene e lysozyme; the optimum pH is around 5.8, about 1 pH unit lower than for the e lysozyme.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PubMed-verified; the identifier resolves to the intended paper. Its
      subject is gp5 (UniProtKB:P16009), named in the first sentence of the
      abstract and sized at 42 kDa, so it does not support the lysozyme or
      baseplate claims made from it about the 10.2 kDa product of gene 5.4.
      Cached record is abstract-only.
suggested_questions:
- question: >-
    Is the metal ion at the apex of gp5.4 iron or zinc? PDB 4KU0 models Fe(III)
    and UniProt curates an Fe cofactor, but every structurally characterised
    PAAR homologue carries Zn at the aligned 3-His/1-Cys site, verified by X-ray
    fluorescence. The answer decides whether GO:0046872 should be refined to
    GO:0005506 iron ion binding or to GO:0008270 zinc ion binding.
- question: >-
    Is gene 5.4 essential for infectivity, and is a spike without its PAAR cap
    still able to puncture the outer membrane? No amber or deletion mutant of
    gene 5.4 appears in the literature, although inactivating all PAAR genes
    severely impairs the analogous type VI secretion systems.
- question: >-
    Should GO have a cellular-component term for the tip of a contractile
    injection spike, or a molecular-function term for a spike-sharpening cap?
    gp5.4, the T6SS PAAR proteins and the DUF4280/PAAR-like proteins occupy the
    same structural position, and at present the only shared annotation
    available is the whole baseplate.
- question: >-
    Does gp5.4 stay attached to the spike after penetration, or does it
    dissociate like the gp5C beta-helix? This determines whether it is carried
    into the periplasm during genome delivery and whether it has any role after
    the initial opening is made.
suggested_experiments:
- description: >-
    Determine the metal identity in gp5.4 directly: X-ray fluorescence scans and
    anomalous difference maps on gp5.4-gp5 crystals at the Fe and Zn edges,
    together with ICP-MS on purified recombinant gp5.4 and on intact T4 virions.
  hypothesis: >-
    The gp5.4 apex site holds zinc, as in all structurally characterised PAAR
    homologues, and the Fe(III) modelled in PDB 4KU0 is a crystallisation
    artefact or a mis-assignment of the density.
- description: >-
    Construct a gene 5.4 amber or deletion mutant (with a suppressor host or
    plasmid-borne complementation) and compare the resulting particles with
    wild-type for plaque-forming efficiency, adsorption, outer-membrane
    permeabilisation, and the kinetics of DNA ejection into cells and into
    liposome targets.
  hypothesis: >-
    Particles lacking gp5.4 assemble and adsorb normally but are defective in
    the initial penetration of the outer membrane, so genome ejection is delayed
    or abolished without the capping cone.
- description: >-
    Mutate the four metal-coordinating residues of gp5.4 (His14, His46, His56,
    Cys83) singly and in combination, and assay fold stability of the
    recombinant protein, its binding to the gp5 beta-helix fragment, its
    incorporation into virions, and infectivity of the resulting phage.
  hypothesis: >-
    The metal site is required for the integrity of the cone tip, so its loss
    leaves a protein that still binds the spike but fails during penetration,
    separating the capping and the puncturing contributions of gp5.4.
- description: >-
    Cryo-electron tomography of T4 particles caught attacking E. coli
    minicells or liposomes, with gp5.4 located by labelling or by difference
    mapping against a gene 5.4 deletion, imaging the spike before and after
    outer-membrane penetration.
  hypothesis: >-
    gp5.4 leads the spike through the outer membrane and then dissociates with
    the gp5C beta-helix, so it is not retained at the inner membrane during
    genome translocation.
