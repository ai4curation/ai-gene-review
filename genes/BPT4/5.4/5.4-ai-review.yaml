- term:
    id: GO:0098994
    label: symbiont entry into host cell via disruption of host cell envelope
  evidence_type: IC
  original_reference_id: PMID:23925114
  qualifier: involved_in
  review:
    summary: >-
      As the capping cone at the apex of the central spike, gp5.4 is the
      leading structure driven into the host envelope when the tail sheath
      contracts, and is held to make the initial opening in the outer membrane
      through which the spike and then the tail tube pass.
    action: NEW
    reason: >-
      Inferred from the structural placement of gp5.4 and from the general
      conclusion drawn for the PAAR superfamily, of which gp5.4 is the T4
      member: because a PAAR protein caps the end of the spike beta-helix, it
      is the piercing tip responsible for creating the opening in the target
      cell envelope. gp5.4 therefore performs part of the work of envelope
      disruption itself - it is the physical point of the needle - rather than
      merely being required for it. The sibling term GO:0098932 (entry via
      disruption of host cell wall peptidoglycan) is not proposed, because the
      peptidoglycan step is catalysed by the gp5 lysozyme domain, not by
      gp5.4. The inference is flagged as such: UniProt states the puncturing
      role with ECO:0000305, and no gene 5.4 mutant has been assayed, so the
      proposal is made with IC rather than an experimental code.
    supported_by:
    - reference_id: PMID:23925114
      supporting_text: >-
        Because a PAAR-repeat protein caps the end of the β-helix of a VgrG spike, it is in fact the piercing tip that is responsible for the initial event of creating an opening in the target cell envelope.
