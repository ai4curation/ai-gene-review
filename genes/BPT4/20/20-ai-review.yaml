  label: Tequatrovirus T4
description: Portal protein gp20 (524 amino acids) forms a homododecameric (12-subunit) ring complex that occupies the unique fivefold vertex of the bacteriophage T4 prolate icosahedral capsid. During early head morphogenesis, gp20 docks at the cytoplasmic face of the Escherichia coli inner membrane (via host YidC and phage helper gp40) to nucleate assembly of the prohead scaffolding core and major capsid shell; subsequently, its exposed clip domain docks the pentameric gp17 large terminase ATPase motor to translocate genomic dsDNA into the capsid through its central channel, and after motor release it binds the neck proteins (gp13/gp14) to form the conduit for genome ejection during infection.
