suggested_questions:
  - question: How do the N-terminal 73 residues of gp20, which are disordered in the mature cryo-EM structure, interact with phage helper gp40 and host insertase YidC at the inner membrane to nucleate the prohead scaffolding core?
  - question: How is the conformational transition of the gp20 tunnel loop (residues 374-398) coupled to gp17 ATPase termination and subsequent gp13 neck binding to lock the packaged genome inside the head?
suggested_experiments:
  - description: Determine the cryo-EM structure of the membrane-bound gp20-gp40-YidC initiation complex in lipid nanodiscs to resolve the N-terminal membrane anchor of gp20 and the mechanism of prohead nucleation.
  - description: Perform single-molecule fluorescence resonance energy transfer (smFRET) on fluorophore-labeled gp20 tunnel-loop variants during active gp17-driven DNA packaging to track real-time valve gating as internal capsid pressure builds.
