  label: Tequatrovirus T4
description: >-
  DNA beta-glucosyltransferase (BGT; EC 2.4.1.27) is a monomeric, 351-amino-acid
  DNA-modifying glycosyltransferase of bacteriophage T4 and the structural
  prototype of the GT-B glycosyltransferase fold superfamily. BGT catalyzes the
  inverting transfer of a beta-D-glucosyl residue from UDP-alpha-D-glucose onto
  5-hydroxymethylcytosine (5hmC) bases in double-stranded T4 DNA via an
  extrahelical base-flipping mechanism using Asp100 as the catalytic base. By
  converting approximately 30% of genomic 5hmC residues to beta-glucosyl-5hmC
  (complementing alpha-glucosylation by Agt), BGT shields the phage genome from
  T4's own cytosine-specific nucleases and from host restriction-modification
  and CRISPR-Cas defense systems.
