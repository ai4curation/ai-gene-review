suggested_questions:
- question: >-
    Unlike AGT, which binds the gp45 sliding clamp, does BGT interact with any
    replisome component in vivo or does it act distributively on remaining
    unglucosylated 5hmC sites after replication fork passage?
- question: >-
    What local DNA structural features govern BGT's preference for the ~30% of
    genomic 5hmC sites that remain unglucosylated by AGT?
suggested_experiments:
- description: >-
    Perform high-throughput base-flipping fluorescence kinetics (using
    2-aminopurine-substituted 5hmC duplexes across all dinucleotide/trinucleotide
    contexts) to quantitatively explain the 70:30 genomic partitioning between
    AGT and BGT.
- description: >-
    Test whether BGT co-purifies or cross-links with T4 replisome proteins in
    infected E. coli cells using proximity labeling (BioID/TurboID).
