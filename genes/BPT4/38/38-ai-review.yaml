- term:
    id: GO:0098004
    label: virus tail fiber assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gp38 is an essential phage-encoded chaperone required for the folding and
      homotrimerization of the distal long tail fiber protein gp37.
    action: ACCEPT
    reason: >-
      Genetic, biochemical, and heterologous co-expression studies establish that in
      the absence of gp38, gp37 polypeptides fail to trimerize and accumulate as
      insoluble aggregates, completely blocking distal long tail fiber assembly.
      GO:0098004 accurately captures its core biological process.
