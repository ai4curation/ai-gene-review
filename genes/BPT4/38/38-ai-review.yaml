- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IEA
  original_reference_id: file:BPT4/38/38-deep-research-falcon.md
  review:
    summary: >-
      gp38 is a nonstructural phage protein that acts in the host bacterial cytoplasm
      during late infection and is absent from mature T4 virions.
    action: NEW
    reason: >-
      Unlike the gp38 orthologs of phages T2 and Mu that remain bound to the fiber tip,
      T4 gp38 dissociates after catalyzing gp37 folding and functions exclusively in
      the infected host cell cytoplasm (GO:0030430).
    supported_by:
    - reference_id: file:BPT4/38/38-deep-research-falcon.md
      supporting_text: >-
        The dominant model for T4 is that gp38 acts during **intracellular assembly/morphogenesis** of LTF components and is **not incorporated into the mature T4 long tail fiber** (nor detected in mature virions), consistent with its role as a chaperone rather than a structural receptor-binding adhesin in T4.
