suggested_questions:
- question: >-
    What is the three-dimensional structure of the transient complex between T4 gp38
    and the unfolded C-terminal domain of gp37, and what triggers gp38 release once
    the Fe2+-coordinated beta-helix of the gp37 trimer is formed?
- question: >-
    How do gp38 and the general tail-fiber chaperone gp57A coordinate their interactions
    along nascent gp37 polypeptide chains during co-translational or post-translational
    trimer assembly?
suggested_experiments:
- description: >-
    Trap a pre-folding complex between T4 gp38 and a C-terminal truncation or His-box
    mutant of gp37 (unable to bind Fe2+ and complete folding) for structural
    determination by cryo-EM or X-ray crystallography.
- description: >-
    Perform in vitro refolding and fluorescence cross-correlation spectroscopy (FCCS)
    assays with purified gp37, gp38, gp57A, and Fe2+ to measure the stoichiometry,
    order of binding, and dissociation kinetics of gp38 during gp37 trimerization.
