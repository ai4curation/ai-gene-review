- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IEA
  original_reference_id: file:BPT4/38/38-uniprot.txt
  review:
    summary: >-
      gp38 functions as a dedicated molecular chaperone that catalyzes the folding and
      trimerization of gp37 without being incorporated into the mature virion.
    action: NEW
    reason: >-
      Existing GOA annotations for gp38 lack a molecular function term. Because gp38
      transiently binds the C-terminal region of unfolded gp37 monomers to prevent
      aggregation and promote productive homotrimerization before dissociating,
      GO:0044183 (protein folding chaperone) accurately represents its core molecular
      function.
