  review:
    summary: >-
      gp38 specifically catalyzes the folding and assembly of the distal long tail
      fiber subunit gp37, so the broader parent term viral tail assembly should be
      refined to GO:0098004 (virus tail fiber assembly).
    action: MODIFY
    reason: >-
      gp38 is dedicated exclusively to the folding and trimerization of the long tail
      fiber adhesin gp37 and has no role in tail tube, sheath, or baseplate hub assembly.
      Because the more specific descendant term GO:0098004 (virus tail fiber assembly)
      is already present on this record, GO:0098003 is modified to GO:0098004.
