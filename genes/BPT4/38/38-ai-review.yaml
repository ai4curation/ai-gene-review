core_functions:
- description: >-
    Acts as a gene-specific nonstructural molecular chaperone in the host cytoplasm
    that transiently binds the C-terminal region of nascent gp37 polypeptides and
    catalyzes their folding and parallel homotrimerization into the distal long tail
    fiber shaft and receptor-binding tip.
