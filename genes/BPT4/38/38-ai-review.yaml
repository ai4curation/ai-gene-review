id: P03739
gene_symbol: '38'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  gp38 (183 amino acids, ~22.3 kDa) is an essential, nonstructural gene-specific
  molecular chaperone (tail fiber assembly protein) of bacteriophage T4 required for
  the folding and homotrimerization of the distal long tail fiber adhesin subunit gp37
  in the infected Escherichia coli cytoplasm. Acting in concert with the general phage
  tail-fiber chaperone gp57A, gp38 transiently recognizes and binds the C-terminal
  receptor-binding tip region of nascent gp37 monomers, preventing off-pathway
  aggregation and nucleating the C-to-N-terminal zippering and iron-coordinated beta-helix
  folding of the gp37 homotrimer before dissociating prior to virion incorporation.
