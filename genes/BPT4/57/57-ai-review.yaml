  label: Tequatrovirus T4
description: >-
  gp57A (also known as gp57 or p57; 80 amino acids, ~8.6 kDa) is an essential, highly
  alpha-helical, nonstructural molecular chaperone of bacteriophage T4 required in
  the infected Escherichia coli cytoplasm for the folding and homotrimerization of
  three fibrous structural proteins: the short tail fiber subunit gp12, the proximal
  long tail fiber subunit gp34, and the distal long tail fiber subunit gp37 (the
  latter in concert with the gp37-specific chaperone gp38). Existing in solution as
  flexible alpha-helical oligomers linked to the inner cytoplasmic membrane, gp57A
  suppresses off-pathway aggregation of nascent fibrous polypeptides and promotes
  register-specific parallel trimerization without being incorporated into the mature
  virion.
existing_annotations:
- term:
    id: GO:0098003
    label: viral tail assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gp57A specifically chaperones the folding and trimerization of the short and long
      tail fiber subunits (gp12, gp34, and gp37), so the broader parent term viral tail
      assembly should be refined to GO:0098004 (virus tail fiber assembly).
    action: MODIFY
    reason: >-
      gp57A acts exclusively in the assembly of the short tail fibers (gp12) and long
      tail fibers (gp34 and gp37) rather than the tail tube, sheath, or baseplate hub.
      Because the more specific descendant term GO:0098004 (virus tail fiber assembly)
      is already present on this record with experimental (IDA) and IEA support,
      GO:0098003 is modified to GO:0098004.
    proposed_replacement_terms:
    - id: GO:0098004
      label: virus tail fiber assembly
    supported_by:
    - reference_id: PMID:8892827
      supporting_text: >-
        In the absence of the other, p57, p34 (another component of the long tail fiber), p37, and p12 (the subunit of the short tail fiber) remain unassembled.
- term:
    id: GO:0098004
    label: virus tail fiber assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gp57A is an essential nonstructural chaperone required for the assembly of both
      short and long tail fibers in bacteriophage T4.
    action: ACCEPT
    reason: >-
      In the absence of gp57A, the trimeric fibrous subunits of the short tail fiber
      (gp12) and the proximal (gp34) and distal (gp37) long tail fibers fail to fold
      and oligomerize into functional tail fibers. GO:0098004 accurately captures this
      core biological process.
    supported_by:
    - reference_id: file:BPT4/57/57-uniprot.txt
      supporting_text: >-
        Chaperone essential for folding and oligomerization of both
    - reference_id: file:BPT4/57/57-deep-research-falcon.md
      supporting_text: >-
        Gene **57** of *Enterobacteria phage T4* encodes **gp57A** (historically also called gp57 or p57), a **small, nonstructural assembly helper/molecular chaperone** that is **required for correct assembly/folding of tail fiber components**—most consistently **gp12 (short tail fiber)** and **gp34 and gp37 (long tail fiber components)**—but is **not incorporated into the mature virion**.
- term:
    id: GO:0098004
    label: virus tail fiber assembly
  evidence_type: IDA
  original_reference_id: PMID:8892827
  review:
    summary: >-
      Direct experimental characterization demonstrates that gp57A (p57) is required
      for the assembly of gp12 (short tail fiber) as well as gp34 and gp37 (long tail
      fiber subunits).
    action: ACCEPT
    reason: >-
      Matsui et al. (PMID:8892827) purified and characterized T4 p57 (gp57A) and
      established that without functional p57 and its cooperative helper p38, the tail
      fiber subunits p34, p37, and p12 remain unassembled in infected cells.
    supported_by:
    - reference_id: PMID:8892827
      supporting_text: >-
        In the absence of the other, p57, p34 (another component of the long tail fiber), p37, and p12 (the subunit of the short tail fiber) remain unassembled.
    - reference_id: file:BPT4/57/57-deep-research-falcon.md
      supporting_text: >-
        Gene **57** of *Enterobacteria phage T4* encodes **gp57A** (historically also called gp57 or p57), a **small, nonstructural assembly helper/molecular chaperone** that is **required for correct assembly/folding of tail fiber components**—most consistently **gp12 (short tail fiber)** and **gp34 and gp37 (long tail fiber components)**—but is **not incorporated into the mature virion**.
- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IEA
  original_reference_id: file:BPT4/57/57-uniprot.txt
  review:
    summary: >-
      gp57A functions as a molecular chaperone that promotes the folding and trimeric
      oligomerization of gp12, gp34, and gp37 without becoming part of the assembled
      fibers.
    action: NEW
    reason: >-
      Existing GOA annotations for gp57A lack a molecular function term. Because gp57A
      acts transiently to prevent aggregation and catalyze the productive folding and
      homotrimerization of three distinct fibrous phage proteins (gp12, gp34, and gp37),
      GO:0044183 (protein folding chaperone) is proposed as its core molecular function.
    supported_by:
    - reference_id: file:BPT4/57/57-uniprot.txt
      supporting_text: >-
        Chaperone essential for folding and oligomerization of both
    - reference_id: file:BPT4/57/57-deep-research-falcon.md
      supporting_text: >-
        Gene **57** of *Enterobacteria phage T4* encodes **gp57A** (historically also called gp57 or p57), a **small, nonstructural assembly helper/molecular chaperone** that is **required for correct assembly/folding of tail fiber components**—most consistently **gp12 (short tail fiber)** and **gp34 and gp37 (long tail fiber components)**—but is **not incorporated into the mature virion**.
