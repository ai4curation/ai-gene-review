suggested_questions:
- question: >-
    What common sequence or structural motif in the disparate fibrous substrates gp12,
    gp34, and gp37 is recognized by gp57A, and how does gp57A prevent premature
    mismatched beta-strand register without requiring ATP hydrolysis?
- question: >-
    Does inner-membrane tethering of gp57A in T4-infected Escherichia coli spatially
    compartmentalize tail fiber folding sites or enhance the local concentration of
    nascent gp12, gp34, and gp37 monomers?
suggested_experiments:
- description: >-
    Perform crosslinking mass spectrometry (XL-MS) and NMR titration experiments using
    15N-labeled gp57A and unfolded/partially folded fragments of gp12, gp34, and gp37
    to map the substrate-binding surface on gp57A and the recognized motifs on its
    client proteins.
- description: >-
    Compare in vivo tail fiber assembly efficiency and phage burst size between
    wild-type gp57A and N-terminally mutated gp57A variants defective in inner-membrane
    association.
