id: P39229
gene_symbol: adfA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Anti-DarT factor A (AdfA; gp61.2) is a 208-amino-acid counter-defense protein of bacteriophage T4 that antagonizes the bacterial DarTG toxin-antitoxin anti-phage defense system. Functioning as a non-enzymatic antitoxin mimic in the infected host cytoplasm, AdfA inhibits the host DarT DNA ADP-ribosyltransferase toxin, preventing ADP-ribosylation of viral DNA and allowing phage genome replication and productive infection to proceed.
