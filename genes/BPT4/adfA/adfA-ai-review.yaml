suggested_questions:
  - question: What is the three-dimensional structure of the AdfA-DarT complex, and how does the polymorphism at residue 164 (His in T4 vs Arg in wild-type RB69) control allele-specific binding to DarT1 versus DarT2?
  - question: Against which natural bacterial DarTG variants is T4 AdfA essential when the NADAR-family glycohydrolase AdfN is absent or insufficient?
suggested_experiments:
  - description: Determine the crystal or cryo-EM structure of T4 AdfA and RB69 AdfA(R164H) bound to Escherichia coli DarT1 to define the toxin-neutralizing interface and the structural role of His164.
  - description: Measure binding affinities (Kd) and in vitro inhibition constants (Ki) of purified T4 AdfA against a panel of diverse bacterial DarT toxins using isothermal titration calorimetry and ssDNA ADP-ribosylation assays.
