  label: Tequatrovirus T4
description: wac (whisker antigen control) encodes fibritin (gpwac; 487 amino acids, ~53.1 kDa), a parallel homotrimeric alpha-helical coiled-coil structural protein that forms the collar and six ~53 nm whiskers radiating from the head-to-tail connector (neck) of bacteriophage T4 (12 trimers or 36 monomers per virion). The N-terminal domain anchors each fibritin trimer to the gp13/gp14 neck complex, twelve segmented alpha-helical coiled-coil rods form the elongated shaft, and the globular C-terminal beta-propeller-like "foldon" domain (residues 457-486) drives rapid autonomous trimerization and folding of the entire molecule. In the mature virion, the collar/whisker assembly catalyzes the attachment of assembled long tail fibers (LTFs) to the baseplate during morphogenesis and acts as an environmental sensor that binds the gp35-gp36-gp37 knee region of the LTFs to hold them in a retracted, non-infectious conformation under unfavorable pH, ionic strength, or temperature conditions.
