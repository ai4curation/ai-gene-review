suggested_questions:
  - question: Which specific residues of the fibritin whisker shaft or C-terminal foldon domain contact the gp35-gp36-gp37 knee region of the retracted long tail fiber, and how do changes in ionic strength or pH modulate the affinity of this interaction?
  - question: How do the twelve N-terminal domains of fibritin accommodate the symmetry mismatch and interface geometry at the dodecameric gp13/hexameric gp14 neck complex to segregate into six upward-pointing collar trimers and six downward-pointing whisker trimers?
suggested_experiments:
  - description: Determine the cryo-EM structure of the intact T4 neck-collar-whisker complex with retracted long tail fibers using focused classification and local refinement around the whisker-to-LTF knee contact site.
  - description: Measure the binding affinity and kinetics between purified fibritin trimers and reconstituted gp35-gp36-gp37 knee complexes across varying pH, temperature, and ionic strength conditions using surface plasmon resonance (SPR) or biolayer interferometry (BLI).
