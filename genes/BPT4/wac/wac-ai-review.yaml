core_functions:
  - description: Forms twelve parallel homotrimeric coiled-coil fibers nucleated by a C-terminal foldon domain that assemble at the gp13/gp14 neck as the virion collar and whiskers, promoting docking of mature long tail fibers onto the baseplate during morphogenesis and reversibly tethering the long tail fiber knee region to regulate host attachment in response to environmental conditions.
