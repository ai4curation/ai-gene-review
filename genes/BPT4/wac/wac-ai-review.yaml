      summary: Neck-assembled fibritin whiskers bind the knee region of mature long tail fibers to align and accelerate their docking onto the gp9 baseplate sockets during late virion morphogenesis.
      action: NEW
      reason: During the final stage of T4 morphogenesis, the collar and whiskers formed by gpwac interact transiently with the knee region of assembled long tail fibers, positioning the proximal gp34 end for efficient attachment to gp9 on the baseplate. Mutants lacking wac exhibit severely impaired long tail fiber attachment rates, supporting GO:0098004 (virus tail fiber assembly).
