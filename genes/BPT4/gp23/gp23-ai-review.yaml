taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Major capsid protein gp23 (521 amino acids; cleaved after Glu65 by the prohead protease gp21 to yield the 456-residue mature gp23*) is the principal structural building block of the bacteriophage T4 head. Folded in the Escherichia coli cytoplasm with the obligatory assistance of the host GroEL chaperonin and phage co-chaperonin gp31, gp23 polymerizes into 155 hexameric capsomers (930 monomers) around the prohead scaffolding core to form the hexagonal surface lattice of the prolate icosahedral capsid (Tend = 13 laevo, Tmid = 20), which subsequently undergoes proteolytic cleavage, conformational expansion during DNA packaging, and external clamping by the decoration proteins Soc and Hoc.
