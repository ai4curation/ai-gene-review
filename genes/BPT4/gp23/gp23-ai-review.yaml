        supporting_text: In the mature virion it is present as the **proteolytically processed** form **gp23***, which assembles into **hexameric capsomers** to build the **hexagonal lattice** of the **prolate icosahedral** head.
suggested_questions:
  - question: How does the N-terminal 65-residue delta-peptide of precursor gp23 interact with the gp22 scaffolding core to specify the prolate elongation (Tmid = 20) versus isometric (T = 13) geometry prior to gp21 cleavage?
  - question: What structural features of unfolded gp23 prevent its productive folding inside the standard E. coli GroEL-GroES Anfinsen cage and necessitate replacement of GroES by the phage co-chaperonin gp31?
suggested_experiments:
  - description: Solve the high-resolution cryo-EM structure of the unexpanded, uncleaved prolate prohead (in a gp21-deficient mutant) to visualize the N-terminal delta-domain of gp23 in complex with the internal gp22 scaffolding core.
  - description: Determine the cryo-EM structure of non-native gp23 encapsulated within the GroEL-gp31 chaperonin chamber to identify the steric and electrostatic contacts that require the expanded gp31 folding cavity.
