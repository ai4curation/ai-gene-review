suggested_questions:
  - question: What is the exact copy number (trimer vs. hexamer) and C-terminal anchoring interface of gp29 within the (gp5-gp27)3 / gp48 / gp54 baseplate hub dome?
  - question: Is gp29 ejected into the host bacterial envelope or cytoplasm ahead of the viral dsDNA genome during infection, and does it form part of the inner-membrane translocation conduit?
suggested_experiments:
  - description: Construct internal coiled-coil deletions and duplications in gene 29 of bacteriophage T4 and measure the resulting tail tube ring counts and lengths by cryo-EM to directly test the linear ruler relationship between gp29 length and gp19/gp18 ring number.
  - description: Perform symmetry-expanded focused cryo-EM refinement of the T4 tail tube lumen and baseplate hub junction to resolve the oligomeric stoichiometry and C-terminal anchor of gp29.
