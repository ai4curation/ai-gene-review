id: P13337
gene_symbol: '29'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Tail tape measure protein (TMP) gp29 of bacteriophage T4 that anchors in the central hub of the baseplate and extends through the internal lumen of the growing tail tube during morphogenesis. Working in concert with the gp48/gp54 baseplate-tube junction rings, gp29 nucleates polymerization of the major tail tube protein gp19 and acts as a physical molecular ruler that arrests tube elongation after 24 hexameric rings once gp29 is fully extended.
