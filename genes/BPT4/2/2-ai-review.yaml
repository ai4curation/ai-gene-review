  label: Tequatrovirus T4
description: Terminal DNA protecting protein gp2 (also known historically as gp64; 274 amino acids) is an internal head protein of bacteriophage T4 that binds noncovalently to the ends of the packaged linear double-stranded DNA genome at the portal junction and accompanies the viral DNA into the Escherichia coli cytoplasm upon infection. Once injected, gp2 caps the free linear dsDNA termini to shield them from exonucleolytic degradation by the host RecBCD (exonuclease V) complex, enabling viral transcription and DNA replication to proceed, and also contributes to head completion and head-to-tail joining during virion morphogenesis.
