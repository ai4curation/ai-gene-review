        supporting_text: Enterobacteria phage T4 **gene 2** encodes **gp2** (historically also called **gp64**), a small, highly basic virion-associated protein that **protects the linear T4 dsDNA termini from degradation by host exonuclease V (ExoV; RecBCD complex)** immediately upon injection into the host cytoplasm.
suggested_questions:
  - question: Does gp2 remain stably bound to the linear T4 DNA termini inside the E. coli cytoplasm after genome ejection, or does it merely pilot the DNA through the portal/tail channel and dissociate once early recombination-dependent priming begins?
  - question: What is the atomic structure and stoichiometry of gp2 bound to the terminal base pairs of glucosylated hydroxymethylcytosine T4 DNA within the portal channel?
suggested_experiments:
  - description: Determine the high-resolution asymmetric cryo-EM reconstruction of the DNA-filled T4 neck/portal vertex to resolve the position and stoichiometry of gp2 bound to the leading DNA terminus prior to ejection.
  - description: Perform in vitro single-molecule DNA curtains with fluorescently labeled recombinant gp2 and purified E. coli RecBCD to measure how gp2 end-binding blocks RecBCD helicase/nuclease loading at blunt dsDNA ends.
