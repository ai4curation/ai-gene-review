  - term:
      id: GO:0098004
      label: virus tail fiber assembly
    evidence_type: IEA
    original_reference_id: file:BPT4/36/36-deep-research-falcon.md
    review:
      summary: Binding of the gp36 homotrimer to the N-terminal domain of the gp37 trimer is an obligate intermediate step in distal long tail fiber assembly that creates the docking site for gp35.
      action: NEW
      reason: In the sequential distal long tail fiber assembly pathway, gp36 binds the N-terminal region of trimerized gp37 to form the 14S gp36-gp37 intermediate, which is strictly required before gp35 can bind and before the distal half-fiber can join the gp34 proximal half-fiber. Adding GO:0098004 (virus tail fiber assembly) captures this essential morphogenetic function.
