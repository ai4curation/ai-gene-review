suggested_questions:
  - question: What is the atomic structure of the gp36 homotrimer and its asymmetric interface with the monomeric gp35 hinge protein and the N-terminal collar domain of the gp37 trimer?
  - question: How does association of gp36 with the N-terminal region of gp37 induce or stabilize the conformational state required for gp35 binding during distal half-fiber assembly?
suggested_experiments:
  - description: Determine the high-resolution structure of a reconstituted gp35-gp36-gp37(N-terminal domain) complex using single-particle cryo-EM or X-ray crystallography to resolve the trimer-to-trimer (gp37-gp36) and trimer-to-monomer (gp36-gp35) interfaces.
  - description: Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) on isolated gp37 N-terminal trimers before and after gp36 binding to map the conformational changes that license subsequent gp35 recruitment.
