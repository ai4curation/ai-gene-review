id: P03743
gene_symbol: '36'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: gp36 (221 amino acids, ~23.3 kDa) is the structural subunit that forms a parallel homotrimer comprising the proximal segment ("upper shin") of the distal half-fiber of the bacteriophage T4 long tail fiber (LTF). During sequential assembly of the distal half-fiber, the gp36 homotrimer associates with the N-terminal globular domain of the gp37 distal shaft/adhesin trimer, stabilizing its proximal rod region, and subsequently recruits a monomeric gp35 hinge/knee cap to form the mature gp35-gp36-gp37 distal half-fiber before joining the gp34 proximal half-fiber. Within the intact virion, gp36 serves as the rigid structural link between the gp35 knee hinge and the gp37 receptor-binding shaft that transmits host recognition signals from the fiber tip toward the baseplate.
existing_annotations:
  - term:
      id: GO:0019062
      label: virion attachment to host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp36 is a structural subunit of the long tail fiber required for host attachment, but this general UniProt-keyword term should be refined to the specific descendant GO:0098671 (adhesion receptor-mediated virion attachment to host cell).
      action: MODIFY
      reason: Although gp36 does not directly bind host LPS or OmpC (which is mediated by the distal tip of gp37), the gp36 homotrimer is an essential structural segment of the distal long tail fiber required to assemble a functional receptor-binding fiber and transmit the attachment signal to the baseplate. Because the more specific descendant term GO:0098671 (adhesion receptor-mediated virion attachment to host cell) is already present on this record, this broader parent term is modified to GO:0098671.
      proposed_replacement_terms:
        - id: GO:0098671
          label: adhesion receptor-mediated virion attachment to host cell
      supported_by:
        - reference_id: file:BPT4/36/36-deep-research-falcon.md
          supporting_text: Multiple authoritative T4 morphogenesis and structural reviews explicitly identify **gp36** as a **trimeric structural component of the T4 long tail fiber (LTF)**, positioned in the **distal/hinge region** and present at **3 copies per fiber** (6 fibers per virion).
