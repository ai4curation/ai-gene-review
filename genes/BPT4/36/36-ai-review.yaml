      reason: gp36 is an external long tail fiber structural shaft subunit and does not cross the host envelope or directly mediate viral genome penetration. Its role in the entry pathway is restricted to assembling the long tail fiber apparatus that mediates reversible host receptor attachment, which is better captured by GO:0098671 (adhesion receptor-mediated virion attachment to host cell).
      proposed_replacement_terms:
