    review:
      summary: Spurious InterPro2GO mapping that misassigns a baseplate tail-fiber socket protein to viral release from the host cell.
      action: REMOVE
      reason: gp9 is a structural component of the extracellular virion baseplate that connects the long tail fibers and transmits the receptor-binding signal for tail sheath contraction during host entry; it plays no role in host cell lysis or viral egress.
      supported_by:
