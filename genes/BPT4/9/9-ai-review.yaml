          record_section: ["CC:FUNCTION"]
          supporting_text: Peripheral baseplate protein that is part of the tail fiber network (PubMed:10545330, PubMed:27193680). Connects the long tail fibers to the baseplate and, after virus attachment to a host cell, probably changes its conformation to trigger the signal for tail contraction (PubMed:10545330). Involved in the tail assembly (PubMed:21129200).
