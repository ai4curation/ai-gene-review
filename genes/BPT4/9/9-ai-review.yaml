suggested_questions:
  - question: How many long tail fibers must simultaneously engage host receptors and apply torque through their gp9 sockets to overcome the activation barrier for the cooperative dome-to-star transition of the baseplate?
    experts:
      - Petr G. Leiman
      - Michael G. Rossmann
      - Fumio Arisaka
  - question: What is the precise atomic interface between the N-terminal coiled-coil domain of the gp9 trimer and the N-terminal baseplate-binding domain of the gp34 proximal long tail fiber trimer?
    experts:
      - Petr G. Leiman
      - Mark J. van Raaij
suggested_experiments:
  - description: Determine the high-resolution cryo-EM structure of the isolated gp9 homotrimer bound to the N-terminal fragment of the gp34 homotrimer using focused local refinement.
    hypothesis: The N-terminal coiled-coil of gp9 forms a symmetry-matched three-fold helical bundle clasp with the N-terminal domain of gp34 that permits wide-angle swiveling without dissociation under mechanical load.
    experiment_type: Single-particle cryo-EM with focused local refinement
  - description: Use optical tweezers to apply controlled piconewton pulling forces to individual long tail fibers on immobilized T4 virions while monitoring baseplate dome-to-star transition and sheath contraction.
    hypothesis: Mechanical deflection of at least three gp9 sockets beyond a critical angular threshold cooperatively destabilizes the dome-shaped gp7-gp10 network to trigger short tail fiber unpinning.
    experiment_type: Single-molecule optical tweezers force spectroscopy
