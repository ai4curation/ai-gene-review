  label: Tequatrovirus T4
description: Peripheral baseplate socket protein (gp9) of bacteriophage T4 that assembles as a homotrimer (18 copies per virion; six trimers per baseplate) and anchors the six long tail fibers to the baseplate periphery. Its C-terminal beta-barrel domain binds to baseplate wedge protein gp7, while its flexible N-terminal coiled-coil domain binds the proximal gp34 subunit of the long tail fiber. Together with the gp11-gp12 complex, gp9 stabilizes the metastable dome-shaped conformation of the pre-infection baseplate and swivels upon host receptor engagement by the long tail fibers to transmit the mechanical signal that initiates the dome-to-star transition and tail sheath contraction.
