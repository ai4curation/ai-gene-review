id: P10928
gene_symbol: '10'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate wedge protein gp10 is a 602-residue homotrimeric structural protein (18 copies per virion) that forms the six peripheral pins of the bacteriophage T4 baseplate and initiates the sequential assembly of the outer baseplate wedge. Organized into four domains with non-collinear threefold axes and stabilized by disulfide bonds both within the gp10 trimer and to the backbone protein gp7, gp10 anchors the gp11 adaptor trimer and the N-terminus of the gp12 short tail fiber. During infection, gp10 rotates by approximately 100 degrees as the baseplate transitions from its dome-shaped to star-shaped conformation, acting as a mechanical lever that deploys the short tail fibers toward the Escherichia coli surface to establish irreversible attachment.
existing_annotations:
  - term:
      id: GO:0019076
      label: viral release from host cell
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: gp10 is a virion baseplate wedge pin and mechanical lever that functions in tail assembly and deployment of short tail fibers during viral attachment and entry, not in viral release from the host cell.
      action: REMOVE
      reason: This electronic annotation derives from an InterPro2GO mapping on domain family IPR008987 (Baseplate structural protein Gp9/Gp10, N-terminal domain), which is mis-mapped to viral release from host cell. Experimental structural and biochemical studies establish that gp10 is an extracellularly acting structural component of the virion baseplate that initiates outer wedge assembly and rotates during the dome-to-star transition to deploy the gp12 short tail fibers for host attachment, having no role in host cell lysis or viral egress.
      supported_by:
        - reference_id: file:BPT4/10/10-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: Peripheral baseplate protein that is part of the tail fiber network. Connects the short tail fibers to the baseplate (PubMed:16554069). During infection, the baseplate undergoes a conformational change from a dome-shaped to a star-shaped structure. At this point, gp10 rotates and acts as a lever that unfolds the short tail fibers, which then interact with host cell surface receptors. Involved in the tail assembly.
        - reference_id: file:BPT4/10/10-deep-research-falcon.md
          supporting_text: High-resolution structural work describes gp10 as a **602-residue trimeric protein** organized into **four domains**, each forming a homotrimer, with **non-collinear trimer axes** that allow substantial reorientation during baseplate conformational switching.
  - term:
