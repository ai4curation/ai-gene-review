      label: viral tail assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp10 initiates the sequential assembly of the six outer baseplate wedges by binding gp7 and recruiting the peripheral gp11 and gp12 tail fiber components.
      action: ACCEPT
      reason: Classical in vitro reconstitution and atomic-resolution cryo-EM structures demonstrate that the gp10 homotrimer is the initial building block of the baseplate wedge assembly pathway, forming a disulfide-linked subcomplex with gp7 and providing the docking sites for gp11 and gp12 during tail morphogenesis.
      supported_by:
        - reference_id: file:BPT4/10/10-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: Peripheral baseplate protein that is part of the tail fiber network. Connects the short tail fibers to the baseplate (PubMed:16554069). During infection, the baseplate undergoes a conformational change from a dome-shaped to a star-shaped structure. At this point, gp10 rotates and acts as a lever that unfolds the short tail fibers, which then interact with host cell surface receptors. Involved in the tail assembly.
        - reference_id: file:BPT4/10/10-deep-research-falcon.md
          supporting_text: High-resolution structural work describes gp10 as a **602-residue trimeric protein** organized into **four domains**, each forming a homotrimer, with **non-collinear trimer axes** that allow substantial reorientation during baseplate conformational switching.
  - term:
      id: GO:0098015
      label: virus tail
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp10 is a component of the bacteriophage T4 tail, but this annotation is overly general compared to its specific localization in the tail baseplate.
      action: MODIFY
      reason: While gp10 is part of the viral tail, atomic structures of the T4 baseplate resolve six gp10 homotrimers specifically at the peripheral vertices of the tail baseplate. Modifying this broad term to GO:0098025 (virus tail, baseplate), which is already asserted on this gene, provides the precise localization.
      proposed_replacement_terms:
        - id: GO:0098025
          label: virus tail, baseplate
      supported_by:
        - reference_id: file:BPT4/10/10-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: Homotrimer; disulfide-linked (PubMed:19896486, PubMed:27193680). Heteromultimer with gp7 (PubMed:19896486, PubMed:27193680); a gp10 molecule is disulfide-linked to gp7 and the other two remaining gp10 molecules form a disulfide bond (PubMed:27193680). The gp10 trimer interacts with gp11 trimer and with the short tail fiber (STF) composed of the gp12 trimer (PubMed:27193680).
        - reference_id: file:BPT4/10/10-deep-research-falcon.md
          supporting_text: In a crystallography + cryo-EM fitting study, the **whole gp10 rotates ~100° about its long axis**, and **domain IV rotates ~60°** during the hexagon→star transition.
