suggested_questions:
  - question: How are the inter-chain disulfide bonds between gp10(Cys444) and gp7(Cys479) and between the remaining two gp10(Cys444) protomers formed inside the reducing Escherichia coli cytoplasm during baseplate wedge assembly?
  - question: What is the exact sequence of inter-domain hinge motions among domains I–IV of gp10 that transduces long tail fiber binding signals via gp9 and gp11 into release of the gp12 short tail fibers?
suggested_experiments:
  - description: Perform site-directed mutagenesis of Cys444 in gp10 (C444S/C444A) and quantify wedge assembly yield, virion thermostability, and plating efficiency to determine whether the gp10-gp7 and gp10-gp10 disulfide bonds are essential for assembly or mechanical force transmission.
    hypothesis: Loss of Cys444 disulfide cross-links will destabilize the gp10-gp7 wedge pin interface and reduce the efficiency of dome-to-star conformational switching under mechanical load.
  - description: Introduce engineered inter-domain disulfide staples across the flexible linkers connecting domains II, III, and IV of gp10 and assay short tail fiber deployment by cryo-EM and LPS-binding assays.
    hypothesis: Restricting inter-domain rotation of domain IV relative to domains I–III will lock gp12 in its stowed sub-baseplate conformation and prevent irreversible host adsorption.
