suggested_questions:
  - question: What is the high-resolution structure of the full-length gp37 shaft domains (residues 1-784) N-terminal to the crystallized C-terminal needle fragment (residues 785-1026), and how do they interface with the gp36 trimer?
  - question: How do specific point mutations in the apical head domain loops of gp37 remodel the electrostatic and hydrogen-bonding network to switch receptor specificity between OmpC-dependent and LPS-only E. coli strains?
suggested_experiments:
  - description: Determine the cryo-EM structure of the gp37 distal tip bound to nanodisc-reconstituted Escherichia coli OmpC trimers and defined rough LPS oligosaccharides to resolve the atomic basis of dual-receptor recognition.
  - description: Perform deep mutational scanning of the gp37 head domain (residues 932-996) across a panel of E. coli OmpC variants and LPS core chemotypes to map the complete sequence-to-receptor-specificity landscape.
