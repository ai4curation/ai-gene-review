  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: file:BPT4/37/37-deep-research-falcon.md
    review:
      summary: The C-terminal needle domain of the gp37 homotrimer coordinates seven iron ions (Fe2+) along its central 3-fold axis via conserved His-X-His motifs.
      action: NEW
      reason: X-ray crystallography of the C-terminal tip fragment of gp37 (PDB 2XGF, 2.2 A) demonstrated that 14 histidine residues from each monomer (42 histidines per trimer arranged in paired His-X-His motifs) coordinate seven octahedral Fe2+ ions along the central axis of the intertwined trimer, stabilizing the receptor-binding needle structure.
      supported_by:
        - reference_id: file:BPT4/37/37-deep-research-falcon.md
          supporting_text: A striking feature of the needle is the presence of **multiple His–X–His motifs** coordinating **seven iron ions** along the fiber axis, likely stabilizing the fold and conferring mechanical rigidity needed for adsorption signaling.
