taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: gp37 (1,026 amino acids, ~109.2 kDa) is the distal long tail fiber (LTF) subunit and primary host-range adhesin of bacteriophage T4. Assisted by the nonstructural molecular chaperones gp57A and gp38, three gp37 polypeptides fold into an elongated, heavily intertwined parallel fibrous homotrimer that forms the main shaft ("lower shin") and extreme C-terminal receptor-binding tip ("foot" or needle domain) of each of the six long tail fibers. The C-terminal tip contains paired histidine boxes (His-X-His motifs) that coordinate a row of seven octahedral Fe2+ ions along the trimer symmetry axis for structural stabilization and presents surface-exposed loops at the extreme apex that reversibly recognize and bind Escherichia coli outer membrane porin C (OmpC) and the inner core region of lipopolysaccharide (LPS).
