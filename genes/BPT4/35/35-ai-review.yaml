id: P03742
gene_symbol: '35'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Long-tail fiber protein gp35 (372 amino acids) is the monomeric hinge ("kneecap") subunit of the bacteriophage T4 long tail fiber ((gp34)3(gp35)1(gp36)3(gp37)3). During distal half-fiber morphogenesis, a single molecule of gp35 binds asymmetrically to the N-terminal tip of the homotrimeric gp36-gp37 subassembly and provides the specific docking interface for the C-terminal end of the homotrimeric gp34 proximal half-fiber, forming the characteristic angled knee joint of the mature long tail fiber and mechanically coupling distal receptor binding to baseplate activation.
