suggested_questions:
  - question: How does a single asymmetric monomer of gp35 simultaneously accommodate the three-fold symmetry of the N-terminal gp36 trimer and the C-terminal gp34 trimer while imposing a fixed hinge angle at the long tail fiber knee?
  - question: Does the hinge angle of gp35 flex elastically during reversible host scanning, and how does interaction with the fibritin (gpwac) whiskers at the knee stabilize the retracted long tail fiber conformation?
suggested_experiments:
  - description: Determine the X-ray crystal or cryo-EM structure of a reconstituted gp34(C-terminal trimer)-gp35(monomer)-gp36(N-terminal trimer) hinge complex to resolve the symmetry-mismatch interfaces and the structural basis of the knee bend.
  - description: Perform glycan microarray screening with purified recombinant gp35 and the gp35-gp36-gp37 distal half-fiber to confirm experimentally that the CBM-like domains of gp35 lack autonomous carbohydrate-binding activity.
