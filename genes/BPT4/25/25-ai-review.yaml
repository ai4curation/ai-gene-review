id: P09425
gene_symbol: '25'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate wedge protein gp25 is a 132-residue structural protein (6 copies per virion) located at the inner rim of the bacteriophage T4 baseplate adjacent to the central tail tube. Added as the final subunit in the sequential assembly of the six baseplate wedges, gp25 associates with gp53 and the (gp6)2-gp7 heterotrimeric module and adopts a fold homologous to the C-terminal polymerization domain of the contractile tail sheath protein gp18. By accepting beta-strand arms from the first ring of gp18 subunits to nucleate tail sheath polymerization in the extended state and rotating with the (gp6)2-gp7 module during the dome-to-star transition, gp25 couples host attachment to contractile sheath triggering.
