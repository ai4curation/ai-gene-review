    original_reference_id: GO_REF:0000043
    review:
      summary: gp25 is a component of the bacteriophage T4 tail, but this term is overly general compared to its specific localization within the viral tail baseplate.
      action: MODIFY
      reason: Cryo-EM and X-ray crystallographic structures of the bacteriophage T4 tail resolve six copies of gp25 specifically at the inner rim of the tail baseplate wedges where the baseplate joins the contractile tail sheath. Modifying GO:0098015 (virus tail) to its more specific child term GO:0098025 (virus tail, baseplate), which is already asserted on this gene, provides accurate localization.
      proposed_replacement_terms:
        - id: GO:0098025
          label: virus tail, baseplate
      supported_by:
        - reference_id: file:BPT4/25/25-uniprot.txt
          supporting_text: Baseplate protein that is located next to the tail tube (inner baseplate). Involved in sheath assembly. The gp25-(gp6)2-gp7 module is involved in sheath contraction (PubMed:27193680).
        - reference_id: file:BPT4/25/25-deep-research-falcon.md
          supporting_text: The strongest convergent conclusion from structural biology and assembly models is that **T4 gp25 is a structural baseplate wedge protein that also acts as the “sheath initiator” (nucleator)** for polymerization of the contractile tail sheath protein **gp18** in the extended (pre-infection) conformation.
