suggested_questions:
  - question: Why does purified gp25 form a homodimer in solution whereas six monomeric copies of gp25 incorporate symmetrically into the six baseplate wedges?
  - question: How do the beta-sheet augmentation interfaces formed by gp25 and gp6 with the N- and C-terminal arms of the first ring of gp18 selectively stabilize the high-energy extended sheath conformation over the lower-energy contracted conformation during assembly?
suggested_experiments:
  - description: Perform structure-guided mutagenesis of the gp25 beta-sheet edge residues that form the four-stranded handshake sheet with the N- and C-terminal arms of gp18 and assay in vitro sheath polymerization onto assembled baseplates-tail tubes.
    hypothesis: Disrupting the beta-strand augmentation surface on gp25 will abolish nucleation of the extended gp18 sheath on the baseplate while leavinggp18's intrinsic ability to form contracted polysheaths in solution intact.
  - description: Characterize the solution-to-wedge monomerization transition of gp25 upon binding to pre-formed gp10-gp7-gp8-gp6-gp53 wedges using native mass spectrometry and analytical ultracentrifugation.
    hypothesis: Binding to gp53 and the (gp6)2-gp7 trifurcation interface competes directly with the gp25 homodimerization surface, ensuring stoichiometric recruitment of a single gp25 monomer per baseplate wedge.
