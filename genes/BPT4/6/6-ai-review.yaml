  label: Tequatrovirus T4
description: Inner baseplate wedge protein (gp6) of bacteriophage T4 that assembles into a continuous 12-subunit ring of six interdigitated dimers surrounding the central baseplate hub. Within each wedge, a gp6 dimer forms a (gp6)2-gp7 heterotrimeric core module and interacts with gp25 and gp53, while C-terminal dimerization between adjacent wedges ties the six wedges into a circular ring. During the host-attachment-induced dome-to-star transition of the baseplate, a ~15-degree hinge motion between the N- and C-terminal regions of gp6 expands the inner baseplate ring and repositions the gp25-(gp6)2-gp7 module to trigger tail sheath contraction.
