  - description: Structural scaffold of the inner baseplate that forms an interdigitated 12-subunit ring of six dimers (as part of the gp25-(gp6)2-gp7 wedge module), tying the six baseplate wedges together during viral tail assembly and undergoing a hinge-like rotation during the dome-to-star transition to trigger tail sheath contraction.
