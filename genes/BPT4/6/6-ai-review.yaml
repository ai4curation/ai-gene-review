suggested_questions:
  - question: How does binding of the gp8 homodimer to the gp10-gp7 wedge intermediate chaperone or orient the gp7 alpha-helix so that the (gp6)2 dimer can form the triple-helical bundle of the (gp6)2-gp7 heterotrimer?
    experts:
      - Petr G. Leiman
      - Fumio Arisaka
      - Shuji Kanamaru
  - question: Does restricting the ~15-degree internal hinge motion between the N- and C-terminal halves of gp6 abolish the dome-to-star transition, or does it uncouple outer wedge rotation from gp25-gp18 sheath contraction?
    experts:
      - Petr G. Leiman
      - Nicholas M. I. Taylor
suggested_experiments:
  - description: Engineer disulfide cross-links across the internal hinge region between the N- and C-terminal domains of gp6 and assay baseplate assembly, short tail fiber deployment, and tail sheath contraction under oxidizing versus reducing conditions.
    hypothesis: Locking the gp6 internal hinge will allow normal wedge circularization into a dome-shaped baseplate but prevent the ~10 A radial ring expansion required to trigger gp18 sheath contraction upon host adsorption.
    experiment_type: Disulfide-trapping mutagenesis and cryo-EM conformational assay
  - description: Perform in vitro reconstitution of the (gp6)2-gp7-gp8-gp10 wedge complex with truncated gp6 N-terminal or C-terminal dimerization mutants analyzed by native mass spectrometry and analytical ultracentrifugation.
    hypothesis: Disruption of the N-terminal dimer interface prevents incorporation of gp6 into individual wedges, whereas disruption of the C-terminal dimer interface permits monomeric wedge completion but blocks assembly of the six-wedge circular ring.
    experiment_type: Native mass spectrometry and analytical ultracentrifugation of wedge assembly intermediates
