    findings:
      - statement: gp26 functions in bacteriophage T4 baseplate hub assembly during tail morphogenesis and has been detected in the baseplate of virions following proteolytic removal of residues 1-5.
        supporting_text: 'FUNCTION: Baseplate hub assembly chaperone involved in the tail assembly.'
