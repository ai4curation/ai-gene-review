suggested_questions:
  - question: What is the functional significance of the shorter internal-initiation product gp26* (~10-11 kDa) relative to full-length proteolytically processed gp26 during baseplate hub assembly?
  - question: Which viral or host protease cleaves the N-terminal pentapeptide (MYEYK) of gp26, and is this cleavage coupled to hub incorporation or gp29 tape measure anchoring?
suggested_experiments:
  - description: Perform native mass spectrometry and cross-linking mass spectrometry (XL-MS) on early T4 hub assembly intermediates containing gp5, gp27, gp26, gp28, gp29, and gp51 to define the direct binding partners and stoichiometry of gp26 and gp26*.
  - description: Mutate the internal translation initiation codon of gene 26 without altering the amino acid sequence of full-length gp26 to test whether gp26* is independently required for efficient phage T4 plaque formation and hub assembly.
