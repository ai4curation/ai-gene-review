    title: Deep research summary for Bacteriophage T4 gene 26 (gp26)
    findings:
      - statement: Gene 26 is required for central baseplate hub assembly and its product was identified by N-terminal sequencing of purified tube-baseplate complexes lacking the first five N-terminal residues.
        supporting_text: Genetic evidence places gene 26 among “group II” baseplate genes required to form the central part (hub/plug) of the baseplate.
core_functions:
