id: P13335
gene_symbol: '26'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate hub assembly protein gp26 of bacteriophage T4 required during late morphogenesis for the assembly of the central hub of the tail baseplate. Synthesized as a 208-amino-acid precursor whose N-terminal five residues are removed in mature tail-baseplate complexes, gp26 acts alongside group II hub factors (gp27, gp28, gp29, gp51, and gp5) to promote formation of the central baseplate plug onto which the six peripheral baseplate wedges circularize.
