  - term:
      id: GO:0044659
      label: viral release from host cell by cytolysis
    evidence_type: IGI
    original_reference_id: PMID:17900620
    review:
      summary: Directly supported by T4 deletion genetics demonstrating that the pseT.3/pseT.2 spanin pair is required for host outer membrane disruption and cell lysis.
      action: ACCEPT
      reason: Summer et al. (2007) demonstrated that deletion of pseT.3 (y13K) and pseT.2 (y13J) in bacteriophage T4 causes a divalent cation-dependent lysis defect in which spherical cells fail to complete outer membrane disruption and virion release.
      supported_by:
        - reference_id: PMID:17900620
          supporting_text: In the case of T4, a deletion of a non-overlapping gene pair pseT.2 and pseT.3 identified as Rz/Rz1 equivalents resulted in the same divalent cation-dependent lysis phenotype.
        - reference_id: file:BPT4/y13K/y13K-deep-research-falcon.md
          supporting_text: 'A key defining experimental result is that deletion of the **non-overlapping gene pair pseT.3/pseT.2** in T4 produces the classical **divalent cation (Mg2+)-dependent lysis defect** known for λ Rz/Rz1 mutants: infected cells undergo PG removal but fail to complete OM disruption efficiently under Mg2+-supplemented conditions, forming **spherical** cells and yielding **small plaques**/plating defects.'
