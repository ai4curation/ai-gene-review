id: P39504
gene_symbol: y13K
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Inner membrane spanin subunit (i-spanin; PseT.3; gpY13K) is a 117-amino-acid single-pass type II membrane protein of bacteriophage T4 anchored in the Escherichia coli inner (plasma) membrane via an N-terminal transmembrane helix (residues 3-23) with a periplasmic coiled-coil domain (residues 24-117). Through C-terminal interaction with the outer-membrane lipoprotein o-spanin subunit Y13J (PseT.2), Y13K forms a periplasm-spanning two-component spanin complex that disrupts the host outer membrane—likely by catalyzing inner-outer membrane fusion once the peptidoglycan layer has been degraded by endolysin—to complete host cell lysis and progeny virion release.
