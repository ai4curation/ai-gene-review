  - id: PMID:17900620
    title: Rz/Rz1 lysis gene equivalents in phages of Gram-negative hosts.
    findings:
      - statement: Identified T4 pseT.3 (y13K) and pseT.2 (y13J) as Rz/Rz1-equivalent spanin genes and showed that their deletion in T4 results in a divalent cation-dependent lysis defect.
        supporting_text: In the case of T4, a deletion of a non-overlapping gene pair pseT.2 and pseT.3 identified as Rz/Rz1 equivalents resulted in the same divalent cation-dependent lysis phenotype.
      - statement: Defined spanins as periplasm-spanning proteins that physically connect the inner and outer membranes.
        supporting_text: These proteins were named "spanins," since their protein products are predicted to span the periplasm providing a physical connection between the inner and outer membranes.
  - id: file:BPT4/y13K/y13K-deep-research-falcon.md
    title: Deep research summary for Bacteriophage T4 y13K
    findings:
      - statement: Y13K (PseT.3) is the inner-membrane spanin (i-spanin) subunit of the T4 two-component spanin complex required for outer-membrane disruption during host cell lysis.
        supporting_text: '**y13K/pseT.3 (UniProt P39504)** functions as the **i-spanin** subunit in the T4 spanin complex that is required for **outer-membrane disruption during the final step of host cell lysis**.'
      - statement: Y13K carries an N-terminal transmembrane domain that anchors it in the host inner membrane with a periplasm-facing domain.
        supporting_text: '**PseT.3 (y13K)** carries an **N-terminal transmembrane domain**, consistent with an **inner-membrane anchor** and a periplasm-facing domain.'
      - statement: Deletion of pseT.3/pseT.2 in T4 produces a Mg2+-dependent lysis defect with spherical cells that fail to disrupt the outer membrane.
        supporting_text: 'A key defining experimental result is that deletion of the **non-overlapping gene pair pseT.3/pseT.2** in T4 produces the classical **divalent cation (Mg2+)-dependent lysis defect** known for λ Rz/Rz1 mutants: infected cells undergo PG removal but fail to complete OM disruption efficiently under Mg2+-supplemented conditions, forming **spherical** cells and yielding **small plaques**/plating defects.'
  - id: file:BPT4/y13K/y13K-uniprot.txt
    title: UniProtKB entry P39504 (SPAN1_BPT4)
    findings:
      - statement: Y13K is a component of the T4 spanin complex that disrupts the host outer membrane during viral exit.
        supporting_text: Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
      - statement: Y13K interacts via its C-terminus with the C-terminus of the outer lipoprotein spanin subunit across the periplasmic space.
        supporting_text: Interacts (via C-terminus) with the spanin outer lipoprotein subunit (via C-terminus). Part of the spanin complex which spans the entire periplasmic space.
      - statement: Y13K localizes to the host cell inner membrane as a single-pass type II membrane protein with its C-terminal domain on the periplasmic side.
        supporting_text: 'SUBCELLULAR LOCATION: Host cell inner membrane {ECO:0000250}; Single-pass type II membrane protein {ECO:0000250}; Periplasmic side {ECO:0000250}.'
suggested_questions:
  - question: How does the periplasmic coiled-coil domain of T4 Y13K (residues 24-93) transition from a peptidoglycan-trapped extended rod to a post-fusion hairpin conformation upon peptidoglycan hydrolysis?
  - question: Which specific C-terminal residues of Y13K (PseT.3) mediate high-affinity heterooligomerization with the outer-membrane lipoprotein subunit Y13J (PseT.2)?
suggested_experiments:
  - description: Perform circular dichroism spectroscopy and size-exclusion chromatography with multi-angle light scattering (SEC-MALS) on the purified periplasmic domain of Y13K (residues 24-117) alone and mixed with mature Y13J (residues 18-99) to characterize coiled-coil bundle formation upon complex assembly.
  - description: Conduct spheroplast fusion assays in Escherichia coli co-expressing T4 Y13K and Y13J to directly demonstrate fusogenic activity of the T4 two-component spanin complex.
