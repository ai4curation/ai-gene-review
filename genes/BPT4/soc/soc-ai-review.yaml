id: P03715
gene_symbol: soc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Small outer capsid protein Soc (80 amino acids) is a nonessential decoration protein that binds to the exterior surface of the bacteriophage T4 capsid after proteolytic maturation and expansion of the major capsid protein (gp23*) lattice. Assembling as ~270-290 trimeric clamps (~810-870 monomers per wild-type prolate head, or 660 monomers in T=13 isometric heads) at the quasi-threefold interfaces between adjacent gp23* hexameric capsomers, Soc forms a continuous external cage that reinforces regions of high lattice curvature and stabilizes the DNA-filled capsid against extreme alkaline pH (above pH 10.6), osmotic shock, and elevated temperature.
