suggested_questions:
  - question: How does the local inter-capsomer dihedral angle between adjacent gp23* hexamers quantitatively modulate the binding affinity and cooperative trimerization of Soc across the prolate midsection versus the icosahedral end caps?
  - question: Does external clamping by Soc measurably alter the internal DNA ejection kinetics or resistance to osmotic shock in gut-like bile salt environments?
suggested_experiments:
  - description: Perform atomic force microscopy (AFM) nanoindentation and differential scanning calorimetry on soc-deficient T4 capsids titrated with wild-type Soc versus C-terminal trimerization-interface mutants to separate the mechanical contributions of monomer bridging from trimeric clamping.
  - description: Measure single-molecule binding kinetics of fluorescently labeled Soc to immobilized isometric (T=13) versus prolate (Tend=13, Tmid=20) soc-minus capsids across a range of pH and ionic strengths using total internal reflection fluorescence (TIRF) microscopy.
