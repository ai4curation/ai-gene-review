suggested_questions:
  - question: What is the functional role of the large peripheral/outer domain of gp48 that extends beyond its conserved tail-tube-like beta-barrel ring core at the baseplate dome?
  - question: How do the contacts between gp48 and the inner baseplate wedge proteins (gp6, gp25, and gp53) remodel when the wedges splay outward during the dome-to-star conformational transition?
suggested_experiments:
  - description: Perform structure-guided mutagenesis of the interface between gp48 and the (gp27)3 pseudo-hexameric ring and between gp48 and gp25/gp53 to distinguish mutations that block baseplate assembly from those that uncouple baseplate expansion from tail tube penetration.
  - description: Reconstitute the minimal gp27–gp48–gp54–gp19 assembly cascade in vitro using purified recombinant oligomers to measure the cooperative binding affinities governing sequential ring addition.
