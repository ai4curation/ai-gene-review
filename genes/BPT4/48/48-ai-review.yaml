core_functions:
  - description: Assembles as a homohexameric ring atop the central (gp27)3 hub cylinder to form the first annulus of the baseplate-tail tube junction, recruiting the gp54 hexamer to initiate gp19 tail tube polymerization and maintaining continuity of the DNA ejection channel.
