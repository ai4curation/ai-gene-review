id: P13339
gene_symbol: '48'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate tail-tube junction protein gp48 of bacteriophage T4 that assembles as a homohexameric ring directly atop the central (gp27)3 hub cylinder to form the first annulus of the tail tube continuation within the baseplate dome. Together with the overlying gp54 hexameric ring, gp48 completes baseplate morphogenesis, interacts with inner baseplate wedge proteins (gp6, gp25, gp53), and creates the structural platform required to initiate polymerization of the gp19 tail tube.
