        supporting_text: Baseplate protein that forms, together with gp54, the baseplate-tail tube junction. The tail tube first 2 annuli are formed by gp48 and gp54, which are in continuation of the spike complex.
      - reference_id: file:BPT4/48/48-deep-research-falcon.md
        supporting_text: 'In T4, gp48 and gp54 are classically described as tube initiator proteins: structural components added late in baseplate assembly that create the platform from which the major tail tube protein gp19 polymerizes to form the tail tube.'
