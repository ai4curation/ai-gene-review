      action: REMOVE
      reason: Arn is a non-catalytic 92-amino-acid DNA-mimic protein (Pfam PF22134; PDB 3WX4) that binds and inhibits host restriction endonucleases (McrA/McrBC); it has no nuclease activity.
      supported_by:
