  label: Tequatrovirus T4
description: Anti-restriction protein Arn (Anti-rgl nuclease; gpSoc.4) is a 92-amino-acid double-stranded DNA-mimic protein of bacteriophage T4 that functions as a competitive inhibitor of host modification-dependent restriction endonucleases, including Escherichia coli McrA (RglA) and McrBC (RglB). Forming a homodimer with an array of negatively charged surface residues that structurally mimic the phosphate backbone of B-form DNA (PDB 3WX4), Arn sequesters host restriction enzymes and prevents cleavage of T4 DNA containing 5-hydroxymethylcytosine. Despite its legacy name "Anti-restriction endonuclease" (meaning inhibitor of restriction endonucleases), Arn possesses no intrinsic nuclease or hydrolase activity.
