suggested_questions:
  - question: How does transient binding of the P22 (gp37) distal tip of the long tail fiber to the gp11 finger domain in the dome-shaped baseplate modulate the threshold for triggering the dome-to-star transition?
  - question: What is the molecular mechanism by which the gp11 finger domain releases the C-terminal receptor-binding head of the neighboring gp12 short tail fiber trimer while remaining clamped to the central shaft of its partner gp12 trimer?
suggested_experiments:
  - description: Mutate surface-exposed residues in the gp11 finger domain that contact the C-terminal head of the adjacent gp12 trimer in the dome-shaped state and measure the thermal activation barrier for spontaneous baseplate transition by cryo-EM and urea-triggering assays.
    hypothesis: Disrupting the gp11 clamp on the neighboring gp12 receptor-binding head will destabilize the stowed short tail fiber garland and lower the activation barrier for premature dome-to-star conversion.
  - description: Perform surface plasmon resonance and cross-linking mass spectrometry between purified gp11 trimers and recombinant gp37 C-terminal fragments to map the putative long tail fiber docking interface on gp11.
    hypothesis: gp11 provides a low-affinity docking site that holds the long tail fibers in a retracted conformation prior to host receptor engagement.
