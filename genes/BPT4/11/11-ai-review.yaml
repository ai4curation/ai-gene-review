id: P10929
gene_symbol: '11'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Baseplate wedge protein gp11 is a 219-residue homotrimeric adaptor protein (18 copies per virion) situated at the six peripheral vertices of the bacteriophage T4 baseplate. Composed of an N-terminal three-stranded coiled-coil domain, a middle beta-roll finger domain, and a C-terminal beta-annulus domain, each gp11 trimer docks onto domain III of the gp10 wedge pin and clamps around the central hinge of the gp12 short tail fiber trimer. By stabilizing the stowed garland of short tail fibers in the dome-shaped baseplate and rotating alongside gp10 during the dome-to-star transition, gp11 couples host recognition by the long tail fibers to the deployment of gp12 for irreversible host adsorption.
