  - term:
      id: GO:0098003
      label: viral tail assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp11 assembles onto the gp10 peripheral baseplate pin and is required for stable incorporation and organization of the gp12 short tail fibers into the mature phage tail baseplate.
      action: ACCEPT
      reason: Biochemical reconstitution and cryo-EM/crystallographic studies show that gp11 trimers bind directly to gp10 during baseplate wedge maturation (or onto pre-assembled gp11-deficient baseplates) to anchor and stabilize the gp12 short tail fibers into a functional tail apparatus.
      supported_by:
        - reference_id: file:BPT4/11/11-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: Baseplate protein that is part of the baseplate wedge and that connects the short tail fibers to the baseplate (PubMed:15315755). Involved in the tail assembly.
        - reference_id: file:BPT4/11/11-deep-research-falcon.md
          supporting_text: gp11 interacts with **gp10** during wedge initiation/assembly and associates functionally with **gp12 STFs**; gp11–gp12 association is part of stabilizing the dome-shaped baseplate.
  - term:
      id: GO:0098015
      label: virus tail
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: gp11 is a structural component of the bacteriophage T4 tail, but this annotation is overly general given its well-defined localization within the tail baseplate.
      action: MODIFY
      reason: Atomic structures of the bacteriophage T4 tail resolve six gp11 homotrimers specifically at the peripheral vertices of the tail baseplate. Modifying GO:0098015 (virus tail) to its more specific child term GO:0098025 (virus tail, baseplate), which is already asserted on this gene, accurately reflects its localization.
      proposed_replacement_terms:
        - id: GO:0098025
          label: virus tail, baseplate
      supported_by:
        - reference_id: file:BPT4/11/11-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: Homotrimer (PubMed:19896486, PubMed:27193680). The gp11 trimer interacts with gp10 trimer and with the short tail fiber (STF) composed of the gp12 trimer (PubMed:27193680).
        - reference_id: file:BPT4/11/11-deep-research-falcon.md
          supporting_text: Enterobacteria phage T4 gene product 11 (gp11; UniProt P10929) is a **structural baseplate wedge/pin protein** that forms a **trimeric adaptor** at the baseplate periphery and serves as a key **mechanical and signaling interface** between the **baseplate (via gp10)** and the **short tail fibers (gp12)** required for irreversible adsorption and triggering of contractile tail function.
