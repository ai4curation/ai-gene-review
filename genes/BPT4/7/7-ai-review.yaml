    findings:
      - statement: gp7 serves as the structural backbone of each baseplate wedge, scaffolding other wedge subunits during assembly and transmitting the receptor-binding signal from the tail fibers to the inner baseplate.
        supporting_text: gp7 is a major **structural “backbone” protein** of a baseplate wedge. It (i) scaffolds/links other wedge proteins during assembly and (ii) participates in transmitting the host-binding signal from the tail fiber/receptor-binding network to the inner baseplate, enabling the conformational transition that triggers sheath contraction.
      - statement: gp7 is covalently linked to gp10 via an inter-protein disulfide bond that maintains baseplate integrity during the dome-to-star conformational transition.
        supporting_text: gp7 is reported to be **covalently linked to gp10** via the only known inter-protein covalent bond in T4, and this linkage is implicated in maintaining the baseplate structure through the conformational switch.
