suggested_questions:
  - question: How does the inter-protein disulfide bond between gp7 and one protomer of the gp10 homotrimer form within the reducing cytoplasm of Escherichia coli during late T4 morphogenesis?
    experts:
      - Petr G. Leiman
      - Fumio Arisaka
  - question: Is the covalent disulfide linkage between gp7 and gp10 strictly required to prevent peripheral wedge dissociation under the mechanical tension of the dome-to-star transition, or can non-covalent contacts suffice for single-cycle infectivity?
    experts:
      - Petr G. Leiman
      - Nicholas M. I. Taylor
suggested_experiments:
  - description: Mutate the cysteine residue in gp7 that forms the inter-protein disulfide bond with gp10 to serine or alanine, and evaluate wedge assembly, virion thermal/mechanical stability, and plating efficiency.
    hypothesis: Loss of the gp7-gp10 disulfide bond will permit non-covalent wedge assembly in vitro but cause premature unpinning or detachment of the gp10-gp11-gp12 peripheral pin module during the dome-to-star transition, reducing infection efficiency.
    experiment_type: Site-directed mutagenesis, non-reducing SDS-PAGE, and phage infectivity assays
  - description: Use single-molecule Forster resonance energy transfer (smFRET) on fluorescently labeled gp7 in reconstituted gp10-gp7 versus gp10-gp7-gp8 complexes to measure conformational dynamics of the gp7 inter-domain linker.
    hypothesis: Binding of the gp10 trimer stretches the flexible gp7 linker into a fluctuating open state that is locked into a rigid conformation upon gp8 dimer binding, exposing the gp6-binding helix.
    experiment_type: Single-molecule FRET (smFRET) of sequential wedge assembly intermediates
