  label: Tequatrovirus T4
description: Large multi-domain baseplate wedge protein (gp7; 1032 residues) of bacteriophage T4 that forms the structural backbone of each of the six baseplate wedges, bridging the peripheral tail-fiber sockets to the inner baseplate ring. During tail morphogenesis, a single gp7 monomer initiates wedge assembly by binding a gp10 homotrimer—forming an inter-subunit disulfide bond with one gp10 protomer—and subsequently recruits a gp8 homodimer and a gp6 homodimer to assemble the (gp6)2-gp7 heterotrimeric core. As part of the gp25-(gp6)2-gp7 module, gp7 transmits the receptor-binding conformational signal from the peripheral tail-fiber network to the inner baseplate during the dome-to-star transition to trigger tail sheath contraction.
