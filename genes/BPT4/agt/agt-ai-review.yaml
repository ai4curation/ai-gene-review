taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: >-
  DNA alpha-glucosyltransferase (AGT; EC 2.4.1.26) is a monomeric, 400-amino-acid
  GT-B fold glycosyltransferase of bacteriophage T4 that catalyzes the transfer
  of an alpha-D-glucosyl moiety from UDP-alpha-D-glucose to 5-hydroxymethylcytosine
  (5hmC) residues in double-stranded T4 DNA. AGT modifies approximately 70% of
  5hmC bases in the phage genome in a post-replicative process coupled to DNA
  synthesis via direct interaction with the T4 sliding clamp protein gp45. Together
  with DNA beta-glucosyltransferase (Bgt), AGT generates glucosyl-5-hydroxymethylcytosine
  (glc-HMC) across the viral genome, protecting T4 DNA against phage-encoded
  cytosine-specific nucleases as well as host restriction-modification and
  CRISPR-Cas defense systems.
