- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      General keyword-mapped term that should be refined to the specific
      descendant GO:0098672 (symbiont-mediated suppression of host CRISPR-cas
      system).
    action: MODIFY
    reason: >-
      In bacterial hosts, adaptive immunity corresponds to the CRISPR-Cas
      system, and the more specific descendant term GO:0098672 is already
      annotated to this gene based on protection of glucosylated 5hmC DNA
      against Cas9 cleavage.
    proposed_replacement_terms:
    - id: GO:0098672
      label: symbiont-mediated suppression of host CRISPR-cas system
    supported_by:
    - reference_id: file:BPT4/agt/agt-deep-research-falcon.md
      supporting_text: >-
        In 2024 experimental work aimed at engineering T4, authors reiterate that 5ghmdC modifications impede recognition/targeting by host nucleases and CRISPR-Cas systems, motivating strategies to transiently reduce modification for genome editing
    - reference_id: file:BPT4/agt/agt-uniprot.txt
      supporting_text: >-
        The glc-HMC modification also protects against the host CRISPR-Cas9 defense system (PubMed:26081634).
