  findings:
  - statement: >-
      Characterized the sequence and substrate specificity of bacteriophage
      T4-induced hydroxymethylcytosine alpha-glucosyltransferase (AGT) and
      beta-glucosyltransferase (BGT).
    supporting_text: >-
      On the specificity of bacteriophage-induced hydroxymethylcytosine glucosyltransferases. II. Specificities of hydroxymethylcytosine alphaand beta-glucosyltransferases induced by bacteriophage T4.
- id: file:BPT4/agt/agt-deep-research-falcon.md
  title: Deep research summary for Bacteriophage T4 agt
  findings:
  - statement: >-
      T4 AGT glucosylates 5-hydroxymethylcytosine in T4 DNA using UDP-glucose to
      form glucosylated 5hmC, protecting the viral genome against host nucleases.
    supporting_text: >-
      T-even phages such as T4 replace cytosine with **5-hydroxymethylcytosine (5hmC/5hmdC)** during DNA replication and then further **glucosylate** this modified base to form **glucosylated 5hmdC (5ghmdC)**
  - statement: >-
      Glucosylation of 5hmC serves as a protective barrier against host nuclease
      systems including restriction endonucleases and CRISPR-Cas interference.
    supporting_text: >-
      Glucosylation of 5hmdC is described as a defensive strategy: these bulky glycosyl modifications **protect phage DNA from host nucleases** and help distinguish phage DNA from host DNA
  - statement: >-
      Comparison of wild-type T4 and glucosylation-deficient T4gt demonstrates
      the protective role of 5hmC glucosylation against CRISPR interference.
    supporting_text: >-
      In 2024 experimental work aimed at engineering T4, authors reiterate that 5ghmdC modifications impede recognition/targeting by host nucleases and CRISPR-Cas systems, motivating strategies to transiently reduce modification for genome editing
- id: file:BPT4/agt/agt-uniprot.txt
  title: UniProtKB entry P04519 (AGT_BPT4)
  findings:
  - statement: >-
      AGT transfers an alpha-D-glucosyl residue from UDP-alpha-D-glucose to
      5-hydroxymethylcytosine in T4 DNA (EC 2.4.1.26) and interacts with the T4
      sliding clamp gp45.
    supporting_text: >-
      Catalyzes the transfer of glucose from uridine diphosphoglucose to 5-hydroxymethyl cytosine of T4 DNA to yield glucosyl 5-hydroxymethyl cytosine (glc-HMC) (PubMed:15381072).
  - statement: >-
      Enzymatic reaction and EC number of AGT.
    supporting_text: >-
      Reaction=Transfers an alpha-D-glucosyl residue from UDP-glucose to a hydroxymethylcytosine residue in DNA.; EC=2.4.1.26;
  - statement: >-
      The glc-HMC modification protects T4 DNA from host restriction
      endonucleases and CRISPR-Cas9 defense.
    supporting_text: >-
      The glc-HMC modification protects the phage genome against its own nucleases and the host restriction endonuclease system (PubMed:15381072). The glc-HMC modification also protects against the host CRISPR-Cas9 defense system (PubMed:26081634).
suggested_questions:
- question: >-
    How is substrate site selection partitioned between AGT (~70% alpha-glucosylation)
    and BGT (~30% beta-glucosylation) on nascent 5hmC-containing T4 DNA during
    gp45-coupled replication?
- question: >-
    What is the structural basis of the interaction between AGT and the T4
    sliding clamp gp45?
suggested_experiments:
- description: >-
    Determine the cryo-EM or crystal structure of AGT bound to the T4 gp45
    sliding clamp and a 5hmC-containing dsDNA substrate to define how clamp
    recruitment coordinates post-replicative alpha-glucosylation.
- description: >-
    Perform single-molecule nanopore sequencing of nascent T4 replication forks
    in wild-type, agt-null, and bgt-null backgrounds to map the kinetics and
    sequence context of alpha- versus beta-glucosylation in vivo.
