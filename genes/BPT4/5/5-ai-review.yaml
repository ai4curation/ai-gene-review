  label: Tequatrovirus T4
description: Baseplate central spike protein and tail-associated peptidoglycan hydrolase (gp5) of bacteriophage T4 that forms a heterotrimeric (gp27-gp5)3 cell-puncturing complex at the distal hub of the contractile tail baseplate. Synthesized as a 575-residue precursor with an N-terminal gp27-binding OB-fold domain, a central N-acetylmuramidase (lysozyme) domain, and a C-terminal triple-stranded beta-helix needle domain, gp5 is proteolytically cleaved between Ser351 and Ala352 during morphogenesis into mature gp5* and gp5C fragments that remain associated in the virion. Upon tail sheath contraction, the C-terminal beta-helix needle punctures the host outer membrane and dissociates to relieve autoinhibition of the lysozyme domain, which locally digests the periplasmic peptidoglycan layer to allow tail tube penetration and viral DNA injection.
