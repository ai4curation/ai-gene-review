suggested_experiments:
  - description: Perform cryo-electron tomography of bacteriophage T4 infecting Escherichia coli minicells using non-cleavable gp5(S351L) versus wild-type virions to visualize where envelope penetration stalls when gp5C cannot dissociate from gp5*.
    hypothesis: Virions carrying uncleaved gp5(S351L) will puncture the outer membrane upon sheath contraction but remain stalled at the peptidoglycan layer due to persistent autoinhibition of the lysozyme active site and steric blockage of the tail tube tip.
    experiment_type: Cryo-electron tomography of phage-infected minicells
  - description: Use time-resolved hydrogen-deuterium exchange mass spectrometry (HDX-MS) on purified (gp27-gp5*-gp5C)3 complexes upon thermal or mechanical release of gp5C to map conformational changes in the linker loop (residues 340-388) and lysozyme active site.
    hypothesis: Dissociation of the gp5C beta-helix triggers a cooperative order-to-disorder transition in the inhibitory linker loop, exposing the catalytic cleft of gp5* for peptidoglycan binding.
    experiment_type: Hydrogen-deuterium exchange mass spectrometry (HDX-MS)
