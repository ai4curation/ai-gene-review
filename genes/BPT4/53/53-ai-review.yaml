suggested_questions:
  - question: How does binding of gp53 to the (gp6)2-gp7 heterotrimeric helical bundle allosterically create the high-affinity binding site for the sheath-initiator wedge subunit gp25?
  - question: Which specific contacts between gp53 and the gp48/gp54 tail-tube junction rings are broken to release the inner baseplate from the central tube during sheath contraction?
suggested_experiments:
  - description: Compare high-resolution cryo-EM structures of recombinant gp10-gp7-gp8-gp6 wedge intermediates before and after gp53 addition to visualize the conformational clamping of the (gp6)2-gp7 bundle that drives spontaneous wedge circularization.
  - description: Introduce targeted point mutations at the gp53–gp25 and gp53–gp48 interfaces to dissect how gp53 couples peripheral wedge expansion to release of the gp18 sheath.
