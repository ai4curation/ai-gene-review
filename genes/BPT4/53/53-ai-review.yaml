id: P16011
gene_symbol: '53'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Inner baseplate wedge protein gp53 of bacteriophage T4 present in six copies per virion (one per baseplate wedge) adjacent to the tail tube. Incorporated as the fifth component in the sequential wedge assembly pathway (gp10-gp7-gp8-gp6-gp53-gp25), gp53 acts as a bundle clamp that binds the (gp6)2-gp7 helical bundle across neighboring wedges to drive six-fold wedge circularization, recruits gp25, and contributes to the upper baseplate platform that interfaces with the contractile tail sheath.
