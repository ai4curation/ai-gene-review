  - description: Functions as the Rad50-like ABC-type ATPase motor subunit of the gp46/gp47 Mre11-Rad50 complex, coupling DNA-stimulated ATP binding and hydrolysis to processive exonucleolytic resection of double-strand breaks for homologous recombination, recombination-dependent DNA replication, and degradation of fragmented host chromosomal DNA.
