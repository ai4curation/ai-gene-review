    findings:
      - statement: gp46 is the Rad50-family ABC ATPase subunit of the T4 Mre11-Rad50 complex whose ATPase activity is stimulated ~20-fold by gp47 and dsDNA to drive processive DNA end resection during double-strand break repair and recombination-dependent replication.
        supporting_text: The modern consensus from genetics and biochemistry is that gp46 is the **Rad50-family ATPase subunit** of a phage **Mre11–Rad50 (MR)–like DNA end-processing complex** formed with **gp47 (Mre11 homolog)**; this complex is required in vivo for **homologous recombination, recombination-dependent DNA replication (RDR), and double-strand break (DSB) repair**.
      - statement: ATP hydrolysis by gp46 is strongly activated by gp47 and dsDNA and promotes processive nuclease action by gp47.
        supporting_text: 'Current model: gp46 **binds/hydrolyzes ATP at the Rad50 head dimer interface**; ATP-driven conformational cycling promotes assembly at DNA ends and transitions to a **translocation state** that supports processive nuclease action by gp47.'
suggested_questions:
  - question: How do the recombination mediator UvsY and single-stranded DNA-binding protein gp32 remodel the conformational cycle of the gp46 ATPase head domain to switch gp47 from Mn2+-dependent 3'-5' exonucleolysis to Mg2+-dependent endonucleolytic resection?
  - question: What is the structural basis for zinc-hook dimerization of the gp46 coiled-coil domains in bridging broken phage DNA ends vs tethering sister duplexes during recombination-dependent replication?
suggested_experiments:
  - description: Determine cryo-EM structures of the T4 gp46/gp47 heterotetramer bound to forked dsDNA substrates in the presence and absence of ATP-gamma-S, gp32, and UvsY.
    hypothesis: Binding of gp32 and UvsY stabilizes an open, endonuclease-competent conformation of the gp46/gp47 head assembly that exposes the 5'-terminated strand for endonucleolytic clipping near double-strand break ends.
  - description: Perform single-molecule optical tweezers combined with confocal fluorescence tracking of fluorescently labeled gp46/gp47 complexes translocating on bacteriophage DNA ends at physiological Mg2+ and ATP concentrations.
    hypothesis: ATP hydrolysis by gp46 drives step-wise unidirectional translocation (~4 bp per ATP hydrolyzed) that is paused and redirected upon recruitment of UvsY and UvsX.
