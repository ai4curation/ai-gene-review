  label: Tequatrovirus T4
description: Exonuclease subunit 2 (gp46) is the 560-amino-acid Rad50-family ABC-type ATPase subunit of the bacteriophage T4 Mre11-Rad50 (gp47-gp46) DNA end-processing complex. Containing split N- and C-terminal P-loop NTPase domains separated by a coiled-coil region with a central CXXC zinc-hook motif, gp46 assembles into a heterotetramer with the Mre11-like metallophosphoesterase nuclease subunit gp47. Binding to gp47 and double-stranded DNA ends stimulates gp46 ATP hydrolysis approximately 20-fold, driving conformational transitions that enable processive dsDNA exonucleolytic resection by gp47. Through this activity, gp46 is essential for homologous recombination, double-strand break repair, recombination-dependent DNA replication, and exonucleolytic degradation of fragmented host chromosomal DNA into mononucleotides for viral DNA synthesis.
