      id: GO:0016887
      label: ATP hydrolysis activity
    directly_involved_in:
      - id: GO:0006302
        label: double-strand break repair
      - id: GO:0099015
        label: degradation of host chromosome by virus
    supported_by:
      - reference_id: file:BPT4/46/46-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: 'FUNCTION: Exonuclease that plays a role in viral genome replication, DNA recombination, and host DNA degradation.'
      - reference_id: file:BPT4/46/46-deep-research-falcon.md
        supporting_text: The modern consensus from genetics and biochemistry is that gp46 is the **Rad50-family ATPase subunit** of a phage **Mre11–Rad50 (MR)–like DNA end-processing complex** formed with **gp47 (Mre11 homolog)**; this complex is required in vivo for **homologous recombination, recombination-dependent DNA replication (RDR), and double-strand break (DSB) repair**.
