suggested_questions:
  - question: How does the negatively charged inner lumen of the gp19 hexameric tube modulate the exit of the gp29 tape measure protein and subsequent high-speed translocation of genomic dsDNA during infection?
  - question: What conformational signal at the distal gp19 hexameric ring allows the gp15 tail-completion hexamer to bind specifically after 24 rings of gp19 have polymerized around gp29?
suggested_experiments:
  - description: Perform cryo-EM single-particle reconstruction of the gp54–gp19–gp29 junction and the distal gp19–gp15 cap in intact extended and contracted tails to resolve the exact interface transitions between gp54, gp19, and gp15.
  - description: Mutate conserved charged residues lining the inner lumen of gp19 and measure DNA ejection kinetics in vitro using liposome-reconstituted outer membrane OmpC/LPS receptors and fluorescent DNA-intercalating dyes.
