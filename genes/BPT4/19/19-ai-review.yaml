id: P13333
gene_symbol: '19'
status: COMPLETE
taxon:
  id: NCBITaxon:10665
  label: Tequatrovirus T4
description: Major tail tube protein gp19 of bacteriophage T4 that polymerizes into 24 stacked hexameric rings (144 subunits total) atop the gp48/gp54 baseplate-tube junction platform and around the gp29 tape measure protein to form the rigid central cylinder of the phage tail. Surrounded by the outer contractile gp18 sheath, the gp19 tube is mechanically driven across the host bacterial outer membrane during sheath contraction to form the hollow conduit for viral dsDNA genome ejection into the host cytoplasm.
