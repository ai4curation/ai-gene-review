    title: Deep research report on bacteriophage T4 gene 8 (gp8; P19062)
    findings:
      - statement: gp8 stabilizes the baseplate wedge by binding a stretched linker of gp7, reducing its flexibility so that gp6 can bind productively to complete wedge assembly.
        supporting_text: A central mechanistic insight is that gp8 acts as a stabilizing wedge component by binding a gp7 linker that is stretched upon earlier assembly steps, thereby reducing gp7 flexibility and allowing gp6 to bind in a productive orientation to complete wedge assembly.
      - statement: gp8 must bind to the gp10-gp7 complex before gp6 can attach and fold into the wedge.
        supporting_text: gp8 is required before gp6 can attach to the wedge, and gp8 has been described as essential for gp6 folding in this assembly context.
core_functions:
  - description: Homodimeric structural clamp of the intermediate baseplate wedge that binds a stretched linker of gp7 in the (gp10)3-gp7 complex, stabilizing gp7 in an assembly-competent conformation required for gp6 recruitment and viral tail assembly.
