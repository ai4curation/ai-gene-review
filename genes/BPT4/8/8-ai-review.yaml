suggested_questions:
  - question: Does gp8 make any direct transient contacts with gp6 during recruitment of the gp6 dimer to the (gp10)3-gp7-gp8 complex, or is its role in enabling gp6 incorporation mediated purely allosterically through clamping of the gp7 linker?
    experts:
      - Fumio Arisaka
      - Petr G. Leiman
  - question: Why is gp8 dispensable in minimal contractile injection systems (such as R-type pyocins and Vibrio phage XM1) that retain gp6-, gp7-, and gp25-like core wedge homologs?
    experts:
      - Petr G. Leiman
      - Nicholas M. I. Taylor
suggested_experiments:
  - description: Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) on purified (gp10)3-gp7 complexes before and after addition of the gp8 homodimer, followed by addition of gp6.
    hypothesis: Binding of the gp8 dimer strongly protects the stretched inter-domain linker of gp7 and allosterically orders the gp6-binding alpha-helix of gp7 without requiring extensive direct gp8-gp6 contact surfaces.
    experiment_type: Hydrogen-deuterium exchange mass spectrometry (HDX-MS)
  - description: Design a chimeric gp7 variant in which the gp8-binding linker region is replaced by a shorter, conformationally rigid linker modeled on minimal gp8-less myovirus baseplates, and test whether (gp10)3-gp7 can recruit gp6 in vitro in the absence of gp8.
    hypothesis: Shortening and rigidifying the gp7 inter-domain linker will bypass the requirement for gp8 clamping to allow direct (gp6)2-gp7 heterotrimer formation.
    experiment_type: Protein engineering and in vitro wedge reconstitution assay
