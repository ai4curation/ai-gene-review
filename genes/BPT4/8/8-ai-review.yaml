  label: Tequatrovirus T4
description: Intermediate baseplate wedge protein (gp8) of bacteriophage T4 that assembles as a homodimer (12 copies per virion; one dimer per wedge) within each of the six baseplate wedges. During sequential wedge morphogenesis, the gp8 homodimer binds to the (gp10)3-gp7 initiation complex and clamps a stretched inter-domain linker of gp7, reducing conformational flexibility and orienting gp7 to enable productive binding and folding of the gp6 dimer and completion of the baseplate wedge.
