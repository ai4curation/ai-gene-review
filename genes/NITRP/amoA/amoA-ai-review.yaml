id: D9J262
gene_symbol: amoA
aliases:
- Ammonia monooxygenase subunit A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:338192
  label: Nitrosopumilus maritimus
description: >-
  amoA encodes subunit A of ammonia monooxygenase (AMO), the copper-dependent
  integral membrane enzyme that catalyses the first and rate-limiting step of
  nitrification, the oxidation of ammonia to hydroxylamine, in
  ammonia-oxidizing archaea (Nitrososphaerota). This UniProt entry is a
  208-residue partial sequence (fragment) amplified from an environmental clone
  (SF_AOA_C12) recovered from the biofilter of a marine shrimp recirculating
  aquaculture system and assigned to the species Nitrosopumilus maritimus; it is
  not the genome-encoded AmoA of the type strain SCM1. The sequence carries the
  archaeal AmoA domain (Pfam PF12942) and five predicted transmembrane helices.
  In ammonia-oxidizing archaea, AmoA is one of the abundant subunits of a
  membrane-embedded AMO complex that also contains AmoB and AmoC and the
  archaea-specific subunits AmoX, AmoY and AmoZ; the complex sits in the
  cytoplasmic (cell) membrane with its active site most likely facing the
  pseudo-periplasmic space beneath the S-layer. The archaeal enzyme is
  distantly related to bacterial AMO and to particulate methane monooxygenase
  (pMMO) within the copper membrane monooxygenase superfamily; no structure of
  any AMO has been determined, and which subunit carries the catalytic copper
  site is not known. Whole-cell kinetics of N. maritimus show exceptionally high
  affinity for ammonium, adapting these archaea to oligotrophic marine waters,
  where amoA is also the standard molecular marker for ammonia-oxidizing
  archaea.
