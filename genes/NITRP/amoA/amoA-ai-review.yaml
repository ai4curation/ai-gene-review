proposed_new_terms:
- proposed_name: ammonia monooxygenase complex
  proposed_definition: A membrane-embedded protein complex that possesses ammonia
    monooxygenase activity, catalysing the oxidation of ammonia to hydroxylamine.
    In ammonia-oxidizing bacteria it contains AmoA, AmoB and AmoC; in ammonia-oxidizing
    archaea it additionally contains AmoX, AmoY and AmoZ.
  justification: GO has GO:0015050 methane monooxygenase complex for the homologous
    pMMO but no complex term for AMO. Native-gel proteomics and cross-linking of archaeal
    membrane complexes now define AMO subunit composition, so AmoA and its partners
    could be annotated to the complex.
  proposed_parent:
    id: GO:1990204
    label: oxidoreductase complex
  supported_by:
  - reference_id: PMID:36721060
    supporting_text: Besides the known AmoABC subunits and the earlier predicted AmoX,
      two new protein subunits, AmoY and AmoZ, were identified.
suggested_questions:
- question: Which AMO subunit carries the catalytic copper site in archaeal AMO, and
    does AmoA itself bind copper?
  experts:
  - Metalloenzyme biochemists
  - Structural biologists working on copper membrane monooxygenases
- question: Should GO annotate AMO subunits to a process term for ammonia oxidation?
    GO:0019329 ammonia oxidation and GO:0019409 aerobic respiration, using ammonia
    as electron donor currently have no annotations in GOA, not even on the experimentally
    characterised bacterial AmoA, and the GO:0019409 definition (hydrazine as an
    intermediate) does not describe aerobic nitrification.
  experts:
  - GO editors
  - Nitrification biochemists
- question: What sequence positions reliably separate archaeal amoA from bacterial
    amoA and pmoA in environmental surveys?
  experts:
  - Environmental microbiologists
  - Phylogeneticists
suggested_experiments:
- experiment_type: Structural determination
  description: Cryo-EM of the native archaeal AMO complex (AmoABCXYZ) solubilised from
    Nitrosopumilus or Nitrososphaera membranes, to place the copper sites and define
    the role of AmoA.
- experiment_type: Biochemical characterization
  description: Activity-preserving purification or reconstitution of archaeal AMO
    in nanodiscs, with copper titration and substrate and inhibitor profiling.
