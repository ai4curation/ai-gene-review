- id: PMID:22775980
  title: Ammonia-oxidizing archaea and nitrite-oxidizing nitrospiras in the biofilter
    of a shrimp recirculating aquaculture system
  findings:
  - statement: Source study of the D9J262 sequence (UniProt RX line). An environmental
      amoA survey that classified clones as related to Nitrosopumilus maritimus; it
      contains no functional assay of the protein.
    supporting_text: Analysis of bacterial and archaeal amoA gene sequences revealed
      that most ammonia oxidizers were related to Nitrosomonas marina and Nitrosopumilus
      maritimus.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only cache. Correctly cited as the sequence source (UniProt
      RX PubMed=22775980), but it is an ecological marker-gene survey and does not
      support any molecular function or process claim for the protein. The earlier
      D9J262 review used it as TAS support for an anaerobic respiration process, which
      it does not support.
- id: PMID:36721060
  title: Unexpected complexity of the ammonia monooxygenase in archaea.
  findings:
  - statement: Archaeal AMO is an integral membrane complex catalysing the first,
      rate-limiting step of nitrification.
    supporting_text: step of nitrification is the oxidation of ammonia via the integral
      membrane protein complex ammonia monooxygenase (AMO)
  - statement: Native membrane complexes of two AOA contain AmoA, AmoB, AmoC, AmoX
      and two new AOA-specific subunits, AmoY and AmoZ.
    supporting_text: Besides the known AmoABC subunits and the earlier predicted AmoX,
      two new protein subunits, AmoY and AmoZ, were identified.
  - statement: AmoA, AmoB and AmoC are among the most abundant proteins of the AOA
      membrane fraction.
    supporting_text: AMO subunits (AmoA, AmoB, and AmoC) were among the most abundant
      proteins (22% of iBAQ normalized intensity) detected overall in these membrane
      fractions.
  - statement: AOA have a single cell membrane and an S-layer that creates a pseudo-periplasm,
      toward which the AMO active site most likely faces.
    supporting_text: However, it is likely that the active site as well as the soluble
      AmoB and AmoZ domains are situated toward the pseudo-periplasmic space.
  - statement: No AMO structure (bacterial or archaeal) has been solved.
    supporting_text: no structural studies have been successfully carried out for any
      AMO complex, bacterial or archaeal
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Experimental work is on Nitrososphaera viennensis
      and Nitrosocaldus cavascurensis membrane complexes, not on this sequence; applied
      here by homology to the archaeal AmoA family (Pfam PF12942).
- id: PMID:20421470
  title: Nitrosopumilus maritimus genome reveals unique mechanisms for nitrification
    and autotrophy in globally distributed marine crenarchaea.
  findings:
  - statement: The N. maritimus SCM1 genome encodes copper-dependent ammonia oxidation
      and electron transport systems that differ from those of ammonia-oxidizing bacteria.
    supporting_text: revealing highly copper-dependent systems for ammonia oxidation
      and electron transport that are distinctly different from known ammonia-oxidizing
      bacteria
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; PubMed-verified via DOI 10.1073/pnas.0913533107.
      Describes the SCM1 genome (AmoA = Nmar_1500, UniProt A9A4U2), the species-level
