existing_annotations:
- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  retired: true
  supporting_entities:
  - UniProtKB-KW:KW-0503
  review:
    summary: Keyword-mapped monooxygenase activity. True but general; the specific activity
      is ammonia monooxygenase activity. This row is no longer in GOA (the October
      2026 refresh returns no annotations for D9J262), so it is kept as a retired row.
    action: MODIFY
    reason: >-
      The two earlier reviews disagreed (ACCEPT vs MODIFY). MODIFY is correct under
      the project rule that a true but general term is refined rather than accepted:
      the Archaeal_AmoA domain and family placement identify the substrate as ammonia,
      and GO:0018597 ammonia monooxygenase activity is an is_a descendant of
      monooxygenase activity. AmoA is annotated with GO:0018597 as a subunit of the
      AMO complex, following the convention used for the experimentally characterised
      bacterial AmoA (AMOA_NITEU, Q04507, GO:0018597 by EXP). The activity is a
      property of the multi-subunit complex, and which subunit holds the catalytic
      copper site is unresolved; no AMO structure exists.
    proposed_replacement_terms:
    - id: GO:0018597
      label: ammonia monooxygenase activity
    supported_by:
    - reference_id: PMID:36721060
      supporting_text: step of nitrification is the oxidation of ammonia via the integral
        membrane protein complex ammonia monooxygenase (AMO)
    - reference_id: file:NITRP/amoA/amoA-uniprot.txt
      supporting_text: Pfam; PF12942; Archaeal_AmoA; 1.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:36721060
  review:
    summary: AmoA is an integral membrane subunit of AMO in the archaeal cell (cytoplasmic)
      membrane.
    action: NEW
    reason: >-
      Both earlier reviews proposed NEW GO:0016020 membrane. The sequence has five
      Phobius-predicted transmembrane helices, and in AOA the AMO subunits are among
      the most abundant proteins of the membrane fraction. AOA have a single cell
      membrane surrounded by an S-layer rather than an outer membrane, so the membrane
      can be specified as the plasma membrane; the active site most likely faces the
      pseudo-periplasm. This matches the plasma membrane annotation (EXP) of the
      bacterial AmoA Q04507. The membrane-localisation keyword row (UniProtKB-KW, IEA)
      that once accompanied this entry is no longer in GOA, so this is proposed as
      NEW.
    supported_by:
    - reference_id: file:NITRP/amoA/amoA-uniprot.txt
      supporting_text: TRANSMEM        32..54
    - reference_id: PMID:36721060
      supporting_text: AMO subunits (AmoA, AmoB, and AmoC) were among the most abundant
        proteins (22% of iBAQ normalized intensity) detected overall in these membrane
        fractions.
    - reference_id: PMID:36721060
      supporting_text: rely on a proteinaceous S-layer rather than an outer membrane
        to create a pseudo-periplasmic space
    - reference_id: PMID:36721060
      supporting_text: These cross-links can rather be attributed to the high abundance
        of those proteins in the cell membrane.
