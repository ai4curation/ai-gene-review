- id: PMID:19794413
  title: Ammonia oxidation kinetics determine niche separation of nitrifying Archaea
    and Bacteria.
  findings:
  - statement: N. maritimus SCM1 oxidises ammonia with very high affinity.
    supporting_text: Its half-saturation constant (K(m) = 133 nM total ammonium) and
