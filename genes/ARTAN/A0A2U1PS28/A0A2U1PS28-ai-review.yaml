  qualifier: located_in
  review:
    summary: Mitochondrial matrix is the wrong organelle for this chloroplast LepA (HAMAP mitochondrial rule misapplied).
      The analogous soluble compartment is the chloroplast stroma, where a minor pool of the Arabidopsis ortholog
      is found.
    action: MODIFY
    reason: Propagated by UniRule from the mitochondrial GUF1 rule. PANTHER SF4 placement and sequence identity
