suggested_questions:
- question: Should UniProt reassign A0A2U1PS28 from HAMAP MF_03137 (mitochondrial GUF1) to MF_03138 (chloroplastic
    GUF1), given its PANTHER SF4 placement and 83% identity to Arabidopsis cpLEPA?
  experts: []
- question: Is there a GO molecular function term suitable for ribosome back-translocation by LepA/EF4, more specific
    than GTPase activity?
  experts: []
- question: Is chloroplast LepA bound to thylakoid membranes through thylakoid-associated ribosomes or through a
    membrane partner, as proposed for mitochondrial Guf1 at the inner membrane?
  experts: []
suggested_experiments:
- description: Express A0A2U1PS28-GFP in A. annua or Nicotiana benthamiana leaves and image with chloroplast autofluorescence
    and a mitochondrial marker; fractionate chloroplasts into stroma and thylakoids.
  hypothesis: A0A2U1PS28 is chloroplast-targeted and mainly thylakoid-associated, like Arabidopsis cpLEPA.
- description: Complement the Arabidopsis cplepa-1 mutant with A0A2U1PS28 and measure chloroplast protein synthesis
    by in vivo labelling and polysome loading under high light.
  hypothesis: A0A2U1PS28 is functionally equivalent to Arabidopsis cpLEPA.
