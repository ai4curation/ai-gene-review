    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GTP binding by the Tr-type G domain is intrinsic to the LepA GTPase cycle; EF4 binds the ribosome in
