- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Mitochondrial inner membrane localization is a misassignment: A0A2U1PS28 is the chloroplast LepA,
      not the mitochondrial GUF1. The essence of the row, a peripheral membrane-associated organellar translation
      factor, holds for the chloroplast thylakoid membrane.'
    action: MODIFY
    reason: This row comes from the UniProt SubCell term set by HAMAP rule MF_03137 (mitochondrial GUF1). A0A2U1PS28
      is in PANTHER PTHR43512:SF4 (bacterial/chloroplast LepA) with Arabidopsis cpLEPA (82.9% identity), not in
      SF7 with yeast, human and Arabidopsis mitochondrial GUF1 (43-50% identity); the Arabidopsis ortholog is named
      by the chloroplastic rule MF_03138. PAINT placed mitochondrion only at the eukaryotic mitochondrial node,
      which the target does not descend from. Arabidopsis cpLEPA fractionates mainly with thylakoids and is released
      by carbonate/urea, i.e. a peripheral thylakoid membrane protein (PMID:23166764). Replace with chloroplast
      thylakoid membrane.
    supported_by:
    - &id001
      reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43512:SF4; TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC; 1.
    - &id002
      reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A2U1PS28 is assigned to SF4, the bacterial/chloroplast subfamily, not the mitochondrial
        SF7.
    - reference_id: PMID:23166764
      supporting_text: most of the cpLEPA protein was detected in the thylakoid fractions
    - reference_id: PMID:23166764
      supporting_text: These results indicate that cpLEPA is a membrane-associated protein.
    proposed_replacement_terms:
