  review:
    summary: Ribosome-dependent GTP hydrolysis is the catalytic activity of the LepA/EF4 family; the Tr-type G domain
      motifs, including the switch II DTPGH motif with catalytic His164, are intact.
    action: ACCEPT
    reason: Inherited from the LepA subfamily (PTHR43512:SF4, the same subfamily as E. coli LepA), in which ribosome-dependent
      multiple-turnover GTPase activity was measured directly (PMID:25712150). Core function.
    supported_by:
