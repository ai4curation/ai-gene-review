  label: Artemisia annua
description: 'Chloroplast-targeted elongation factor 4 (LepA, cpLEPA) of Artemisia annua, a ribosome-dependent translational
  GTPase of the LepA/GUF1 family. It belongs to the bacterial/chloroplast LepA subfamily rather than to the mitochondrial
  GUF1 subfamily, and is most similar to Arabidopsis cpLEPA (At5g08650). The 661-residue protein has an N-terminal
  extension with transit-peptide-like composition followed by the complete LepA architecture: a Tr-type G domain
  with P-loop and switch motifs, domains II, III and V shared with EF-G, and the unique LepA C-terminal domain.
  By homology with bacterial LepA, it binds translating 70S-type ribosomes in its GTP form, can back-translocate
  tRNAs by one codon and remodel the A-site tRNA, and hydrolyses GTP on the ribosome. In Arabidopsis the orthologous
  cpLEPA is a peripheral thylakoid-membrane protein with a smaller stromal pool, and its loss reduces chloroplast
  protein synthesis, photosynthetic activity and growth, especially under suboptimal conditions.'
