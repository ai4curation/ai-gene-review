    id: GO:0043022
    label: ribosome binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Ribosome binding is the defining property of LepA/EF4, which binds pre- and post-translocation ribosomes
      in its GTP form; here, chloroplast ribosomes.
    action: ACCEPT
    reason: PAINT placed ribosome binding at PTN002460656 with E. coli LepA (SF4) among the seeds, a node the target
      inherits from; structures of SF4 LepA on the ribosome show extensive rRNA and tRNA contacts (PMID:27092003,
      PMID:27137929). Core function.
    supported_by:
    - reference_id: PMID:27137929
      supporting_text: we present the cryo-EM reconstitution of the GTP form of EF4 bound to the ribosome with P
        and E site tRNAs at 3.8-Å resolution
    - reference_id: PMID:27092003
      supporting_text: The structure reveals the interactions of EF-4 with the A-site tRNA, including contacts between
        the C-terminal domain (CTD) of EF-4 and the acceptor helical stem of the tRNA
- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LepA family members promote translation efficiency, mainly under suboptimal conditions; Arabidopsis
      cpLEPA promotes the efficiency of chloroplast protein synthesis.
    action: KEEP_AS_NON_CORE
    reason: The term comes from the PAINT node PTN002460656 (seeded by yeast Guf1), which the target inherits from,
      and it is consistent with the conditional enhancement of chloroplast protein synthesis by the Arabidopsis
      ortholog (PMID:23166764). It is a regulatory reading of what is better described as direct participation in
      plastid translation, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:23166764
      supporting_text: promotes the efficiency of chloroplast protein synthesis
- term:
    id: GO:0032544
    label: plastid translation
  evidence_type: ISS
  original_reference_id: PMID:23166764
  qualifier: involved_in
  review:
    summary: The protein is a chloroplast translation factor that acts on the ribosome during protein synthesis
      in the plastid.
    action: NEW
    reason: Replaces the previous NEW 'translation' row, which was supported by the yeast mitochondrial Guf1 paper
      (SF7, the other subfamily). LepA performs a step of translation itself (GTP-dependent tRNA back-translocation/remodelling
      on the ribosome), so this is participation, not mere requirement. The SF4 ortholog cpLEPA (82.9% identity)
      is required for efficient chloroplast protein synthesis and polysome loading of plastid mRNAs (PMID:23166764).
      GO:0032544 is not in GOA for this entry; the UniProt KW-derived 'translation' line is its unspecific ancestor.
    supported_by:
    - reference_id: PMID:23166764
      supporting_text: promotes the efficiency of chloroplast protein synthesis
    - *id002
