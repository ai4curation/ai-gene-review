id: A0A2U1PS28
gene_symbol: A0A2U1PS28
taxon:
  id: NCBITaxon:35608
  label: Artemisia annua
status: COMPLETE
description: >-
  Chloroplast LepA/EF4 translational GTPase of Artemisia annua (PANTHER PTHR43512:SF4, ortholog of Arabidopsis
  cpLEPA). The single ProtNLM2 prediction, chloroplast, is a correct novel localization supported by subfamily transfer
  from the experimentally localized Arabidopsis ortholog.
source_documents:
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-goa.tsv
  - publications/PMID_23166764.md
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-ai-review.yaml
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-bioinformatics/RESULTS-rereview.md
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-hypotheses/prediction-organellar-localization/openscientist.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0009507
      label: chloroplast
    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The 661-residue target has the complete EF4/LepA architecture and is placed in the chloroplastic
        LepA subfamily PTHR43512:SF4, sharing 82.9% identity with Arabidopsis cpLEPA (At5g08650) and
        clearly less with the mitochondrial GUF1 subfamily SF7. Arabidopsis cpLEPA was shown by
        fractionation of intact chloroplasts to reside mainly on thylakoids with a minor stromal pool, and
        its loss impairs chloroplast protein synthesis (PMID:23166764), which grounds transfer of chloroplast
        localization within the plant SF4 branch. The re-reviewed gene review agrees, replacing the
        HAMAP-derived mitochondrial inner membrane and matrix rows with chloroplast thylakoid membrane and
        chloroplast stroma; those mitochondrial rows are the only cellular-component annotations in GOA, so
        chloroplast is novel for this gene. The term is correct though less specific than the suborganellar
        locations the evidence supports, and it rests on subfamily transfer rather than a targeting assay
        on the Artemisia protein.
      supported_by:
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
          supporting_text: >-
            ID   A0A2U1PS28_ARTAN        Unreviewed;       661 AA. ... DR   InterPro; IPR006297; EF-4.
            ... DR   PANTHER; PTHR43512:SF4; TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC; 1. ... FT   DOMAIN          86..245
            ... FT                   /note="Tr-type G"
        - reference_id: PMID:23166764
          supporting_text: >-
            promotes the efficiency of chloroplast protein synthesis
        - reference_id: PMID:23166764
          supporting_text: >-
            intact chloroplasts were isolated and fractionated, and the proteins were subjected to immunoblot
            analysis with a specific cpLEPA antibody
        - reference_id: PMID:23166764
          supporting_text: most of the cpLEPA protein was detected in the thylakoid fractions
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-bioinformatics/RESULTS-rereview.md
          supporting_text: A0A2U1PS28 is assigned to SF4, the bacterial/chloroplast subfamily, not the mitochondrial SF7.
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-hypotheses/prediction-organellar-localization/openscientist.md
          supporting_text: >-
            the ProtNLM2 chloroplast prediction is the better-supported localization
