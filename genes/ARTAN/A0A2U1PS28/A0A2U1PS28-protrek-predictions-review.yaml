id: A0A2U1PS28
gene_symbol: A0A2U1PS28
taxon:
  id: NCBITaxon:35608
  label: Artemisia annua
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for an Artemisia annua GUF1/EF-4 translation factor.
  The UniProt entry names this protein "Translation factor GUF1 homolog, mitochondrial"
  from a HAMAP rule, but PANTHER (PTHR43512:SF4), paralog comparison and this review all
  place it in the chloroplastic branch - A. annua carries separate chloroplastic and
  mitochondrial GUF1 paralogs and the mitochondrial one is A0A2U1PCN3. ProTrek's GO
  channel independently agrees with the review against the entry name: all five top calls
  are plastid, not mitochondrial, and the free-text channel returns the chloroplastic GUF1
  description ("Promotes chloroplast protein synthesis. May act as a fidelity factor ...
  one-codon backward translocation of tRNAs"). That is the most useful thing ProTrek does
  on this protein - resolving a paralog assignment that the automatic annotation got
  wrong. The molecular functions themselves (GTPase activity, GTP binding, ribosome
  binding, all in GOA) are not retrieved; every top call is a compartment or process.
  ProtNLM2 predicted chloroplast for the same protein, agreeing on the compartment.
  Assessment: 2 correct novel (COR), 1 uncertain (UNC).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
  - genes/ARTAN/A0A2U1PS28/A0A2U1PS28-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0032544
      label: plastid translation
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 18.15) and absent from GOA, whose annotations for this entry are
        all mitochondrial (mitochondrial inner membrane, mitochondrial matrix). The call is
        correct and it corrects the record: this is the chloroplastic GUF1 paralog, and
        plastid translation is exactly the process this review assigns. A specific, novel and
        compartment-correcting prediction is the most valuable single output a function
        predictor can produce for a mis-targeted automatic annotation.
      supported_by:
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
          supporting_text: PANTHER; PTHR43512:SF4; TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0043253
      label: chloroplast ribosome
    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 16.46), also absent from GOA. GUF1/EF-4 acts on translating ribosomes
        and binds them GTP-dependently through its five-domain architecture and unique
        LepA_C domain, so placing it at the chloroplast ribosome is correct and specific.
        Scored COR; a curator might prefer the parent chloroplast stroma (retrieved at rank
        13) since the protein associates transiently rather than being a ribosomal
        constituent.
      supported_by:
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
          supporting_text: PANTHER; PTHR43512:SF4; TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0009547
      label: plastid ribosome
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 16.26). The parent of the rank-2 call, correct for the same reason and
        adding nothing; it is recorded as uncertain rather than counted as a second correct
        prediction, since scoring the same claim twice at two ontology depths would inflate
        the model's apparent hit rate. The pattern - the same concept returned at two or
        three depths within a single top five - recurs across this benchmark and is the main
        reason a fixed top-k cut overstates how many distinct claims a ProTrek list contains.
      supported_by:
        - reference_id: file:ARTAN/A0A2U1PS28/A0A2U1PS28-uniprot.txt
          supporting_text: PANTHER; PTHR43512:SF4; TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC; 1.
