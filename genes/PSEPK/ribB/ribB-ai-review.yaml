taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ribB (PP_0530) of Pseudomonas putida KT2440 encodes a monofunctional 3,4-dihydroxy-2-butanone
  4-phosphate (DHBP) synthase (RibB), a soluble Mg2+/Mn2+-dependent enzyme that converts D-ribulose 5-phosphate
  to DHBP and formate. DHBP supplies the four-carbon unit that lumazine synthase condenses with the pyrimidine
  intermediate in riboflavin biosynthesis. KT2440 has two further DHBP synthases, the RibBX-type proteins
  ribAB-I and ribAB-II. Function is inferred from family membership with conserved catalytic residues.
