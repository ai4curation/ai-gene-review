suggested_questions:
- question: >-
    What kinetic features of KT2440 CysH enforce APS over PAPS specificity, and
    does the CysNC C-terminal domain alter intracellular APS/PAPS partitioning?
suggested_experiments:
- description: >-
    Measure purified Q88KG2 turnover with APS and PAPS side by side, including
    reduced thioredoxin and active-site or iron-sulfur-cluster variants.
  experiment_type: substrate-specificity enzyme assay
