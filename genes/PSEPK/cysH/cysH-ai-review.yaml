- id: file:PSEPK/cysH/cysH-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK cysH
  findings:
  - statement: OpenScientist independently recovered Q88KG2/PP_2328 as the
      thioredoxin-dependent APS reductase of assimilatory sulfate reduction.
    supporting_text: >-
      The gene **cysH** (locus **PP_2328**; UniProt **Q88KG2**) of *Pseudomonas
      putida* strain KT2440 encodes a **thioredoxin-dependent
      adenosine-5′-phosphosulfate (APS) reductase** (EC 1.8.4.10).
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Provider-generated report; the APS-not-PAPS conclusion is
      corroborated by the exact UniProt record and by primary P. aeruginosa
      ortholog enzymology.
- id: PMID:10613872
  title: Identification of a new class of 5'-adenylylsulfate (APS) reductases from sulfate-assimilating bacteria.
  findings:
  - statement: Purified P. aeruginosa CysH reduces APS but not PAPS.
    supporting_text: Purified P. aeruginosa CysH expressed as a His-tagged recombinant protein is able to reduce APS, but not PAPS.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary biochemical and genetic characterization of the P. aeruginosa
      CysH ortholog that the OpenScientist report aligns at high identity to
      Q88KG2; supports APS specificity over PAPS.
- id: PMID:12072441
  title: 5'-adenosinephosphosulfate lies at a metabolic branch point in mycobacteria.
  findings:
  - statement: The CCXXRKXXPL and SXGCXXCT motifs distinguish APS reductases from PAPS reductases.
    supporting_text: CCXXRKXXPL and SXGCXXCT
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mycobacterial APS-reductase paper; supports the diagnostic motif
      distinction used to classify Q88KG2 rather than serving as direct
      Pseudomonas enzymology.
