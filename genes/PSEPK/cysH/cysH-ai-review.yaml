taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  CysH is the iron-sulfur APS reductase of the direct APS branch of
  assimilatory sulfate reduction. It uses reduced thioredoxin to convert APS to
  sulfite and AMP. This substrate assignment distinguishes the KT2440 enzyme
  from PAPS reductases in organisms that phosphorylate APS before reduction.
