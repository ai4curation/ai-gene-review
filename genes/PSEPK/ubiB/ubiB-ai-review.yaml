  review:
    summary: >-
      Core process. UbiB is required for ubiquinone biosynthesis; its ATPase is stimulated by
      pathway intermediates, though its exact contribution is unknown.
    action: ACCEPT
    reason: >-
      E. coli and Providencia ubiB disruptants lack CoQ and accumulate octaprenylphenol. That is
      necessity evidence; the participation argument is that the conserved UbiB/COQ8 ATPase is
      stimulated by phenolic compounds resembling CoQ precursors and the protein co-purifies
      with lipids, indicating it acts on or with the pathway's own intermediates. The precise
      step or mechanism (substrate presentation, membrane extraction or complex assembly) is
      not known. Retained as the core process, as in the module.
    supported_by:
    - reference_id: PMID:10960098
      supporting_text: Both the P. stuartii aarF and E. coli ubiB (yigR) disruption mutant strains
        lack CoQ and accumulate octaprenylphenol.
    - reference_id: PMID:29198567
      supporting_text: We found that ATPase activity is an evolutionarily conserved feature of
        COQ8 orthologs from E. coli to humans that is enhanced by phenolic compounds resembling
        CoQ biosynthetic precursors.
