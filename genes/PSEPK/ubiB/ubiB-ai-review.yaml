knowledge_gaps:
- gap_statement: >-
    How UbiB ATP hydrolysis contributes to ubiquinone biosynthesis is unknown: no protein or
    small-molecule substrate, partner, or pathway step dependent on it has been identified in
    bacteria.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does PP_5013 couple ATP hydrolysis to extracting or presenting polyprenylphenol
    intermediates at the membrane, and does it interact with the soluble Ubi complex?
suggested_experiments:
- description: >-
    Purify the soluble domain of PP_5013 and measure ATPase activity with and without phenolic
    CoQ-precursor analogues and cardiolipin; test complementation of an E. coli ubiB mutant with
    wild-type and catalytic-loop Asp mutant PP_5013.
