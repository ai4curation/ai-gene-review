taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiB (PP_5013) encodes a UbiB-family (ABC1/ADCK) protein of 540 residues: an N-terminal
  region with the UbiB-specific KxGQ motif, an atypical protein-kinase-like domain with a
  conserved catalytic-loop aspartate, and a single C-terminal transmembrane helix that anchors
  it in the inner membrane with the catalytic domain facing the cytoplasm. It is the third gene
  of the ubiE-ubiJ-ubiB cluster. UbiB-family proteins are required for ubiquinone
  biosynthesis; Escherichia coli ubiB mutants lack coenzyme Q and accumulate octaprenylphenol.
  The characterized family members, E. coli UbiB and eukaryotic COQ8, show ATPase activity
  stimulated by phenolic ubiquinone precursors and lack protein kinase activity in trans. How
  ATP hydrolysis supports the pathway is unknown. Function in KT2440 is inferred by orthology;
  the protein has not been studied.
existing_annotations:
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000059578
  review:
    summary: >-
      UniRule transfer of the "probable protein kinase" assignment of HAMAP MF_00414. The
      UbiB kinase-like fold does not make it a protein kinase: COQ8 lacks protein kinase
      activity in trans, and the activity measured for E. coli UbiB and COQ8 is ATP hydrolysis.
    action: MODIFY
    reason: >-
      Lateral correction. The essence of the row (an ATP-using enzyme of the kinase-like fold) is
      sound, but the specific claim is not: structural work shows UbiB-specific features
      positioned to inhibit protein kinase activity, COQ8 lacks protein kinase activity in trans,
      and no protein substrate of any bacterial UbiB is known (the "UbiI regulator" idea in the
      HAMAP text is speculative). ATPase activity was measured for purified E. coli UbiB and is
      conserved across COQ8 orthologs; A0A140FWS4 keeps the family motifs shared with E. coli
      UbiB. Replace with ATP hydrolysis activity, an orthology inference for PP_5013.
    proposed_replacement_terms:
    - id: GO:0016887
      label: ATP hydrolysis activity
    supported_by:
    - reference_id: PMID:27499294
      supporting_text: Although COQ8 was predicted to be a protein kinase, we demonstrate that
        it lacks canonical protein kinase activity in trans.
    - reference_id: PMID:25498144
      supporting_text: By solving a crystal structure of a UbiB family protein, human mitochondrial
        ADCK3, we show that UbiB proteins adopt an atypical PKL fold with multiple UbiB-specific
        features positioned to inhibit protein kinase activity.
    - reference_id: PMID:29198567
      supporting_text: We found that ATPase activity is an evolutionarily conserved feature of
        COQ8 orthologs from E. coli to humans that is enhanced by phenolic compounds resembling
        CoQ biosynthetic precursors.
