taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ribF (PP_0602) of Pseudomonas putida KT2440 encodes the bifunctional riboflavin kinase/FMN
  adenylyltransferase RibF (FAD synthetase). Its C-terminal flavokinase domain phosphorylates riboflavin
  to FMN and its N-terminal FAD synthetase domain adenylylates FMN to FAD, so the single protein converts
  riboflavin into both flavin cofactors. It is the only riboflavin kinase and FAD synthetase encoded in
  the genome and links riboflavin biosynthesis to flavin cofactor supply. Function is inferred from membership
  of the bacterial RibF family, whose B. subtilis member was shown to have both activities; no KT2440
  enzymology is reported.
