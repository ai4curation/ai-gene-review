  review:
    summary: Electronic mapping (InterPro riboflavin kinase/FAD synthase signatures) to riboflavin biosynthetic
      process.
    action: REMOVE
    reason: RibF uses riboflavin, the end product of riboflavin biosynthesis, as its substrate and performs
      no step in forming riboflavin. The mapping of the riboflavin kinase/FAD synthetase domains to riboflavin
      biosynthesis is therefore wrong for this enzyme, as recorded for S. cerevisiae FMN1. The correct
      processes (FMN and FAD biosynthesis) are annotated separately.
    supported_by:
    - reference_id: file:PSEPK/ribF/ribF-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=riboflavin + ATP = FMN + ADP + H(+); Xref=Rhea:RHEA:14357,
    - reference_id: file:PSEPK/ribF/ribF-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=FMN + ATP + H(+) = FAD + diphosphate; Xref=Rhea:RHEA:17237,
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      slot: InterPro2GO mapping
      requested_change: CHECK
      asserted_value: GO:0009231
      corrected_value: GO:0009398
      corrected_label: FMN biosynthetic process
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The riboflavin kinase/FAD synthetase signatures (IPR002606, IPR015864, IPR023465) map
        to GO:0009231 riboflavin biosynthetic process, but RibF-family enzymes consume riboflavin to make
        FMN and FAD and catalyse no step of riboflavin formation. FMN biosynthetic process (GO:0009398)
        and FAD biosynthetic process (GO:0006747) describe what these domains do.
