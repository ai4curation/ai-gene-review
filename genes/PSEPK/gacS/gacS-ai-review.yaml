- term:
    id: GO:0009927
    label: histidine phosphotransfer kinase activity
  qualifier: enables
  evidence_type: ISS
  original_reference_id: PMID:12848429
  review:
    summary: >-
      GacS carries its own C-terminal HPt domain (His863) that accepts the
      phosphoryl group from the internal receiver (Asp718) and passes it to
      GacA. In P. fluorescens CHA0 all three GacS phosphoacceptor sites,
      including the HPt histidine, are required for signalling.
    action: NEW
    reason: >-
      The HPt step of the His-Asp-His-Asp relay is performed by GacS itself,
      so the phospho-His intermediate activity belongs to GacS (a domain of
      the hybrid kinase rather than a separate Hpt protein). Ortholog
      mutational evidence plus the conserved HPt domain and phosphohistidine
      site in KT2440 GacS.
    supported_by:
    - reference_id: PMID:12848429
      supporting_text: >-
        inactivation of each of the three conserved phosphate acceptor sites
        caused an exoproduct null phenotype (GacS-)
    - reference_id: file:PSEPK/gacS/gacS-uniprot.txt
      record_section: ["FT:MOD_RES"]
      supporting_text: 'MOD_RES         863'
