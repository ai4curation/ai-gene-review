proposed_new_terms:
- proposed_name: positive regulation of protein secretion by the type VI secretion system
  proposed_definition: >-
    Any process that activates or increases the frequency, rate, or extent of
    protein secretion by the type VI secretion system.
  justification: >-
    Mirror of the negative-regulation term proposed in the retS review. GO has
    GO:0033103 for type VI secretion but no type VI-specific regulation terms
    (QuickGO search, 2026-11-12), so the KT2440 gacS phenotype can only be
    recorded with an acts_upstream_of_positive_effect qualifier.
  proposed_parent:
    id: GO:0050714
    label: positive regulation of protein secretion
  supported_by:
  - reference_id: PMID:36748579
    supporting_text: >-
      This indicates that GacS is a positive regulator of K1-T6SS
      expression, and this activity is repressed only by RetS in the
      exponential phase of growth.
suggested_questions:
- question: What signal is sensed by the periplasmic sensor region of KT2440 GacS?
- question: Which KT2440 outputs of GacS (adhesion, K1-T6SS) pass through the RsmY/RsmZ-Rsm protein arm, and which do not?
suggested_experiments:
- hypothesis: The receiver Asp718 and HPt His863 of KT2440 GacS are required for phosphotransfer to GacA.
  description: >-
    Construct D718A and H863Q gacS alleles at the native locus and measure in
    vitro phosphotransfer to GacA and in vivo rsmY/rsmZ and lapA promoter
    activity.
  experiment_type: phosphotransfer biochemistry plus reporter genetics
