  label: Pseudomonas putida KT2440
description: >-
  GacS is the inner-membrane hybrid ("unorthodox") sensor histidine kinase of
  the GacS/GacA two-component system. Two transmembrane helices enclose a
  periplasmic sensor domain; the cytoplasmic part carries a HAMP linker, a
  HisKA/HATPase histidine kinase with its conserved phosphohistidine and
  ATP-binding boxes, a receiver domain (Asp718) and a C-terminal HPt domain
  (His863). In orthologous pseudomonads GacS autophosphorylates and relays
  phosphate His->Asp->His to the receiver aspartate of the response regulator
  GacA, all three phosphoacceptor sites being required for signalling. GacA then
  activates transcription of small RNAs that sequester RsmA/CsrA-family
  translational repressors. The activating signal is unknown. The sensor
  hybrid kinase RetS inhibits GacS by direct binding. In KT2440, gacS is
  required for surface attachment and for transcription of the LapA and LapF
  adhesin genes, and it positively regulates the K1 type VI secretion system.
