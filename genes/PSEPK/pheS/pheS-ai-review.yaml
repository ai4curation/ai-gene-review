  label: Pseudomonas putida KT2440
description: PheS is the alpha catalytic subunit of the bacterial alpha2-beta2 phenylalanyl-tRNA synthetase.
  The PheS/PheT complex activates phenylalanine with ATP and transfers it to tRNA(Phe). Its conserved
  magnesium-binding architecture includes an intersubunit site shared with the beta subunit.
