  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: XthA is an exonuclease III-family DNA repair nuclease that incises abasic DNA and provides double-stranded DNA 3-prime-to-5-prime exonuclease activity.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The target record predicts Mg2+ or Mn2+ binding for the AP/ExoA-family nuclease.
    action: KEEP_AS_NON_CORE
    reason: Metal binding is mechanistically relevant but does not distinguish AP incision from exonuclease activity.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: XthA binds DNA as a substrate, but the parent term omits its AP-site and exonuclease reactions.
    action: KEEP_AS_NON_CORE
    reason: Keep substrate binding outside the core, which records the two nuclease activities.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic catalytic activity adds no information to XthA's AP endonuclease and directional exonuclease functions.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003906 and GO:0008311 provide the useful reaction resolution.
- term:
    id: GO:0004518
    label: nuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic nuclease activity does not distinguish XthA's AP-site incision and 3-prime-to-5-prime exonuclease reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain the two substrate- and direction-specific child terms instead.
- term:
    id: GO:0004519
    label: endonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Endonuclease activity is consistent with XthA but less precise than AP-site endonuclease activity.
    action: KEEP_AS_NON_CORE
    reason: Keep the generic parent outside the core while proposing GO:0003906 by ISS.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is compatible with chromosomal DNA repair.
    action: KEEP_AS_NON_CORE
    reason: Location is contextual and does not define either XthA nuclease reaction.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: XthA is an AP/ExoA-family repair nuclease, but this parent process is less informative than its nuclease activities and BER placement.
    action: KEEP_AS_NON_CORE
    reason: Retain the broad repair context outside the core annotation set.
