suggested_questions:
- question: KT2440 lacks ThiH. Which partner does KT2440 ThiG form its working complex with? Does it
    bind ThiO or ThiS (PP_5105), or does it act alone on free 2-iminoacetate?
- question: Which E1-like enzyme adenylylates KT2440 ThiS for thiocarboxylation in the absence
    of a dedicated thiF gene, so that sulfur reaches ThiG?
suggested_experiments:
- description: Delete thiG (PP_5104) in KT2440 and test for a thiamine (or thiazole) requirement
    on minimal medium, with complementation in trans.
  experiment_type: genetic knockout and complementation
- description: Reconstitute thiazole phosphate formation in vitro from purified KT2440 ThiG, ThiO,
    glycine, DXP and ThiS thiocarboxylate, and test a Lys112 mutant.
  experiment_type: biochemical assay
