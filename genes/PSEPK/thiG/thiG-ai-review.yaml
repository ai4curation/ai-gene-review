  review:
    summary: Thiazole synthase activity (EC 2.8.1.10, RHEA:26297); the core activity of ThiG.
    action: ACCEPT
    reason: >-
      Q88CS6 is a full-length member of the ThiG family (HAMAP MF_00443, Pfam PF05690, PANTHER
      PTHR34266:SF2). Alignment to E. coli ThiG (44% identity) and B. subtilis ThiG (52%) maps the
      Schiff-base active-site lysine to Lys112 and the DXP-binding residues to identical or
      conservatively substituted residues in Q88CS6. Purified E. coli ThiG (as ThiGH) forms
      thiazole phosphate only with DXP, the imine co-substrate and ThiS thiocarboxylate, which
      matches the GO definition of this activity.
    supported_by:
    - reference_id: file:PSEPK/thiG/thiG-bioinformatics/RESULTS.md
      supporting_text: Q88CS6 retains the catalytic lysine and the DXP phosphate/sugar-binding residues
        of characterised ThiG enzymes, consistent with an active thiazole synthase rather than a
        diverged paralog.
    - reference_id: PMID:17403671
      supporting_text: The activity is shown to require four proteins isolated as heterodimers
    - reference_id: PMID:17403671
      supporting_text: yield dehydroglycine, which is required by ThiG for the thiazole cyclization
        reaction.
    - reference_id: file:PSEPK/thiG/thiG-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: /note="Schiff-base intermediate with DXP"
- term:
    id: GO:0052837
    label: thiazole biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/thiG/thiG-bioinformatics/RESULTS.md
  review:
    summary: Proposed process term for the reaction ThiG catalyses, formation of the thiazole ring.
    action: NEW
    reason: >-
      ThiG is the enzyme that closes the thiazole ring, so it performs a step of thiazole
      biosynthesis itself rather than being required for it. Comparator check: the other
      gene products of the thiazole branch carry this term in GO. E. coli and B. subtilis ThiS
      have it by IBA from PTHR34472 node PTN002157649, and E. coli ThiS also by IDA. The ThiG
      orthologs P30139 and O31618 carry only GO:0009228 and GO:0009229 in QuickGO (queried
      2026-11-12). That absence follows from the PAINT ThiG node using those two pathway terms;
      it is not a decision that ThiG takes no part in thiazole formation. GO:0052837 is not an
      ancestor or descendant of GO:0009228 or GO:0009229, so the row adds the specific branch
      process.
    supported_by:
    - reference_id: PMID:17403671
      supporting_text: yield dehydroglycine, which is required by ThiG for the thiazole cyclization
        reaction.
    - reference_id: file:PSEPK/thiG/thiG-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the rearrangement of 1-deoxy-D-xylulose 5-phosphate (DXP) to produce
