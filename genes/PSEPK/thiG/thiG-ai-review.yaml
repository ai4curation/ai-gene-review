id: Q88CS6
gene_symbol: thiG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  thiG (PP_5104) encodes thiazole synthase (EC 2.8.1.10), a 270-residue cytoplasmic
  TIM-barrel enzyme of the ThiG family that forms the thiazole phosphate moiety of thiamine.
  ThiG binds 1-deoxy-D-xylulose 5-phosphate (DXP) as a Schiff base on an active-site lysine
  (Lys112 in this protein), and condenses it with 2-iminoacetate (glyoxyl imine) and sulfur
  delivered as the C-terminal thiocarboxylate of the ThiS sulfur-carrier protein, yielding
  2-[(2R,5Z)-2-carboxy-4-methylthiazol-5(2H)-ylidene]ethyl phosphate. In Pseudomonas putida
  KT2440 the 2-iminoacetate comes from the glycine oxidase ThiO rather than the radical-SAM
  ThiH used by Escherichia coli, and the ThiS sulfur carrier is encoded by the adjacent locus
  PP_5105. The thiazole product is coupled with the pyrimidine moiety by ThiE and phosphorylated
  by ThiL to thiamine diphosphate. The function is inferred from family membership and conserved
  catalytic residues; the KT2440 protein itself has not been assayed.
