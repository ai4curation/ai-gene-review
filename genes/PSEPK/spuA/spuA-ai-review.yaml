  review:
    summary: L-glutamine metabolism is transferred by a UniRule from the class I glutamine amidotransferase
      fold.
    action: REMOVE
    reason: PuuD-subfamily enzymes use the GATase-fold cysteine to hydrolyse gamma-glutamyl amides of
      GABA and polyamines, not glutamine. The characterized P. aeruginosa SpuA prefers gamma-Glu-GABA,
      whereas a glutamine-using GATase of the same fold class was inactive on gamma-Glu-GABA; the fold-level
      rule over-propagates glutamine metabolism to this subfamily.
    supported_by:
