- description: Hydrolysis of 4-(gamma-L-glutamylamino)butanoate to GABA and L-glutamate, the deglutamylation
    step of the gamma-glutamyl putrescine catabolic route (inferred from PuuD-subfamily membership and
    characterized orthologs).
  molecular_function:
    id: GO:0033969
    label: gamma-glutamyl-gamma-aminobutyrate hydrolase activity
