knowledge_gaps:
- gap_statement: No KT2440 PuuD-family paralog has been assayed, so the physiological substrate and flux
    share of each paralog are unknown.
  gap_kind:
  - BIOLOGY
  boundary: Function is inferred from family, PAINT ancestry and orthologs; substrate preference among
    paralogs is not asserted.
suggested_questions:
- question: Which of the three KT2440 PuuD-family paralogs (PP_5298, SpuA/PP_2179, PP_3598) carries gamma-Glu-GABA
    hydrolase flux during growth on putrescine, and do any prefer gamma-glutamyl derivatives of other
    polyamines?
suggested_experiments:
- description: Purify PP_5298, SpuA and PP_3598 and compare kcat/Km for gamma-Glu-GABA, gamma-glutamylputrescine
    and gamma-glutamyl-spermidine-derived intermediates; test single and combined deletions for growth
    on putrescine and spermidine.
  experiment_type: paralog enzyme kinetics and genetics
