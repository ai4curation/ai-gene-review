taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SpuA (PP_2179) is one of three Pseudomonas putida KT2440 paralogs of the PuuD-like subfamily
  of class I glutamine amidotransferase-like (peptidase C26) hydrolases. By family, PAINT ancestry and
  the characterized orthologs E. coli PuuD and P. aeruginosa SpuA, it is a gamma-glutamyl-gamma-aminobutyrate
  hydrolase that releases GABA and L-glutamate in the gamma-glutamyl route of putrescine catabolism. It
  lies between puuA-I (PP_2178), a PuuA-family ligase, and spuC-I (PP_2180), a polyamine aminotransferase,
  matching the spuA position of the P. aeruginosa spu locus. No KT2440 enzyme assay or mutant has been
  reported, and the division of labour among the three paralogs is unknown.
