    label: adenosylhomocysteinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Adenosylhomocysteinase activity is the core AhcY molecular function.
    action: ACCEPT
    reason: >-
      UniProt assigns EC 3.13.2.1 and RHEA:21708 for hydrolysis of SAH to
      L-homocysteine and adenosine, exactly matching GO:0004013.
    supported_by:
