- term:
    id: GO:0033353
    label: L-methionine cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: AhcY is a central SAH-clearing step in the L-methionine cycle.
    action: ACCEPT
    reason: >-
      SAH hydrolysis connects SAM-dependent methylation to homocysteine
      remethylation. This is the direct AhcY implementation of the bacterial
      methionine cycle.
    supported_by:
    - reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
      supporting_text: "May play a key role in the regulation of the intracellular"
    - reference_id: file:PSEPK/ahcY/ahcY-goa.tsv
      supporting_text: "GO:0033353\tL-methionine cycle"
- term:
    id: GO:0071269
    label: L-homocysteine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: AhcY directly produces L-homocysteine from SAH.
    action: ACCEPT
    reason: >-
      UniProt assigns the enzyme to the single-step route from SAH to
      L-homocysteine, so the process annotation is chemically and pathway
      appropriate even though homocysteine is subsequently remethylated.
    supported_by:
    - reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
      supporting_text: "L-homocysteine from S-adenosyl-L-homocysteine: step 1/1"
    - reference_id: file:PSEPK/ahcY/ahcY-goa.tsv
      supporting_text: "GO:0071269\tL-homocysteine biosynthetic process"
- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: ISS
  original_reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
  qualifier: enables
  review:
    summary: AhcY binds one NAD(+) cofactor per subunit.
    action: NEW
    reason: >-
      UniProt assigns a stoichiometric NAD(+) cofactor and multiple conserved
      NAD-contacting residues. NAD binding is therefore a supported non-core
      molecular function complementing the defining hydrolase activity.
    supported_by:
    - reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
      supporting_text: "Name=NAD(+); Xref=ChEBI:CHEBI:57540"
    - reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
      supporting_text: "Note=Binds 1 NAD(+) per subunit."
