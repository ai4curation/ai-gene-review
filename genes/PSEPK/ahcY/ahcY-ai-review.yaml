      supporting_text: "Reaction=S-adenosyl-L-homocysteine + H2O = L-homocysteine + adenosine"
    - reference_id: file:PSEPK/ahcY/ahcY-uniprot.txt
      supporting_text: "Xref=Rhea:RHEA:21708"
    - reference_id: file:PSEPK/ahcY/ahcY-goa.tsv
