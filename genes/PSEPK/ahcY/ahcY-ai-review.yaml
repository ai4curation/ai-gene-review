id: A0A140FWS3
gene_symbol: ahcY
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  ahcY (PP_4976) encodes an NAD-dependent adenosylhomocysteinase that hydrolyzes
  S-adenosyl-L-homocysteine (SAH) to L-homocysteine and adenosine. The enzyme
  clears the inhibitory product of SAM-dependent methyltransferases and supplies
  homocysteine for remethylation, thereby linking transmethylation to methionine
  regeneration in the bacterial methionine cycle.
existing_annotations:
