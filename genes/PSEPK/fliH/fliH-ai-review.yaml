  review:
    summary: The export accessory performs a direct mechanistic step in type III protein secretion.
    action: NEW
    reason: The KT2440 assignment is inferred from the target-specific NCBIfam/InterPro classification
      and conserved export-system context; the mechanistic experiments cited here used Salmonella,
      not KT2440. FliH is a soluble export-ATPase assembly and targeting factor. It associates
      with FliI, helps recruit the ATPase to the basal body and carries export substrates
      to the gate; it also restrains free FliI ATPase assembly and activity. Salmonella reconstitution
      and interaction experiments establish that the protein performs carrier/assembly or
      gate-activation work, not merely that its deletion blocks an outcome. Same-role comparator
      query (2026-11-06) found E. coli FliH P31068 and FliJ P52613 each annotated to GO:0030254
      by NAS from PMID31337100; Salmonella P15934/P0A1K1 lack that BP, so annotation presence
      alone is not the evidence. The term descends from protein secretion/transport and describes
      export machinery, not transported cargo. No current row or other new proposal is an
      ancestor or descendant of this process. No matching target entry was found in the cached
      GO-CAM index.
    supported_by:
