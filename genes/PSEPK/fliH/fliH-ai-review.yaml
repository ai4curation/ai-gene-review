taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FliH is a soluble export-ATPase assembly and targeting factor. It associates
  with FliI, helps recruit the ATPase to the basal body and carries export substrates to the
  gate; it also restrains free FliI ATPase assembly and activity. In Pseudomonas putida KT2440
  these functions are inferred from its conserved flagellar export-family identity. The membrane
  gate normally uses proton motive force; the cytoplasmic ATPase machinery improves export
  efficiency, and bypass conditions can support export without FliHI. ATP-driven export without
  bulk proton motive force has also been reconstituted in Salmonella membrane vesicles.
