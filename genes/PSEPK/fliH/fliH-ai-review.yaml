      supporting_text: These results show that the FliH2/FliI complex externally added in
        solution can assemble onto the export gate complex to form a functional export apparatus.
    - reference_id: PMID:21934659
      supporting_text: a specific binding of FliJ with an export gate membrane protein, FlhA,
