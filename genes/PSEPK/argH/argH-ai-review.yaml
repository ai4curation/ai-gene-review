  title: OpenScientist functional synthesis for PSEPK ArgH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. Native KT2440 argH deletion and complementation plus curated lyase chemistry
      support the terminal biosynthetic step. Cytosol is accepted as the soluble metabolic compartment;
      cytoplasm is refined to that existing child term. Broader catalytic/lyase terms are refined, not
      judged biologically false. Pyoverdine phenotypes do not imply direct pyoverdine synthesis by ArgH.
  findings:
  - statement: The report identifies the exact accession as argininosuccinate lyase and retrieves the
      terminal arginine-biosynthesis reaction.
    supporting_text: The gene **argH** (ordered locus **PP_0184**; UniProt **P59618**) of *Pseudomonas
      putida* KT2440 encodes **argininosuccinate lyase (ASL / ASAL; EC 4.3.2.1; arginosuccinase)**.
