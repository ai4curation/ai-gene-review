id: Q88MU1
gene_symbol: recJ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RecJ is a single-stranded-DNA-specific 5'-to-3' exonuclease of the conserved
  DHH/DHHA1 family. It degrades exposed single-stranded DNA during DNA repair
  and recombination and is a candidate nuclease for mismatch-excision tracts
  requiring 5'-to-3' degradation. Its exact contribution relative to
  Exonuclease VII and Exonuclease I in KT2440 mismatch repair remains
  unresolved.
