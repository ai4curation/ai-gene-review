- id: file:PSEPK/gmhA/gmhA-uniprot.txt
  title: UniProtKB entry for gmhA (Q88N89)
  findings:
  - statement: GmhA-specific curated signatures support phosphoheptose isomerase function, catalytic
      zinc binding and cytoplasmic localization by homology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Function, cofactors and localization are supported by curated HAMAP rules and specific
      GmhA signatures, not direct KT2440 assays. The GmhA/DiaA family contains distinct functions;
      the alpha/beta products are anomers, not a racemic mixture as stated in the record.
- id: file:interpro/panther/PTHR30390/PTHR30390-metadata.yaml
  title: PANTHER family metadata for the GmhA and DiaA SIS-family proteins
  findings:
  - statement: The broad PANTHER family contains both catalytic GmhA and non-catalytic DiaA subfamilies.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Family membership context, not independent experimental demonstration of the target
      reaction. Specific curated domain/rule evidence and biochemical sources determine function.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__adp-heptose-biosynthesis__ppu00541-deep-research-openscientist.md
  title: OpenScientist PSEPK ADP-heptose biosynthesis synthesis
  findings:
  - statement: Generated pathway synthesis flags an unresolved KT2440 terminal epimerase assignment;
      its reported failure to find HldD has not been independently reproduced and does not establish
      biological absence.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Useful research lead, not primary evidence or a demonstrated genome-wide absence
      of HldD. No catalytic or stereochemical endpoint claim depends on this generated report.
- id: PMID:18056714
  title: Structure and function of sedoheptulose-7-phosphate isomerase, a critical enzyme for lipopolysaccharide
    biosynthesis and a target for antibiotic adjuvants.
  findings:
  - statement: Homolog structures and mutagenesis support phosphoheptose isomerization and substrate
      recognition.
    supporting_text: Here we report structures of GmhA from Escherichia coli and Pseudomonas aeruginosa
      in apo, substrate, and product-bound forms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The abstract explicitly describes E. coli and P. aeruginosa enzymes, substrate/product-bound
      structures and catalytic mutant analysis. Supports conserved GmhA chemistry and substrate recognition,
      not direct KT2440 enzymology or its metal occupancy.
