id: Q88N89
gene_symbol: gmhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GmhA is a predicted cytoplasmic, zinc-dependent phosphoheptose isomerase of Pseudomonas
  putida KT2440. It converts D-sedoheptulose 7-phosphate into the alpha and beta anomers of D-glycero-D-manno-heptose
  7-phosphate, supplying the first heptose intermediate for ADP-heptose donor biosynthesis and lipopolysaccharide
  core assembly.
