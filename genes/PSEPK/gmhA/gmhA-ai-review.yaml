id: Q88N89
gene_symbol: gmhA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GmhA is a zinc-dependent phosphoheptose isomerase that converts
  D-sedoheptulose 7-phosphate into the alpha and beta anomers of
  D-glycero-D-manno-heptose 7-phosphate. This reaction supplies the first
  committed heptose intermediate used to make ADP-heptose precursors for the
  lipopolysaccharide inner core.
