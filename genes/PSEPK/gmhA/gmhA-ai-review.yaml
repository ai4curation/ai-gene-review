    summary: The soluble GmhA pathway operates in the cytoplasm.
    action: ACCEPT
    reason: HAMAP MF_00067 assigns cytoplasmic localization to this GmhA-subfamily protein. This
      is a comparative localization inference, not a KT2440 localization experiment; the location
      is integral to its metabolic role.
