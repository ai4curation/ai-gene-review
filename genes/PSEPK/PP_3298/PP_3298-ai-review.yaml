taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Small CinA C-terminal/PncC-family protein of Pseudomonas putida
  KT2440. The 167-residue protein carries the CinA/PncC domain signatures
  IPR008136, PF02464, and TIGR00199. Its catalytic activity, substrate
  specificity, and physiological role have not been established; membership
  in a family that includes inactive domains does not by itself establish NMN
  deamidase activity for this paralog.
references:
  - id: file:PSEPK/PP_3298/PP_3298-hypotheses/kgap-pp3298-cinac-pncc-active-site/openscientist.md
    title: OpenScientist analysis of the PP_3298 CinA-C/PncC active site
    findings:
      - statement: >-
          PP_3298 retains the PncC catalytic tetrad (S25, Y52, K57, R139) in native geometry but
          differs from the canonical NMN deamidase PP_1628 at nine fixed pocket positions; predicted
          active amidohydrolase with an unknown, probably non-NMN substrate.
        supporting_text: >-
          PP_3298 is probably not the NMN deamidase of *P. putida* KT2440.
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: >-
