id: Q88ME7
gene_symbol: mutS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MutS is the cytosolic ATP-dependent mismatch sensor that initiates
  post-replicative DNA mismatch repair. It recognizes base-pair mismatches and
  small insertion/deletion loops in duplex DNA, then uses its ATPase cycle to
  form a signaling clamp and recruit MutL for downstream strand incision and
  excision. In Pseudomonas putida KT2440, MutS and MutL constitute the two
  conserved recognition/incision components of a MutH-independent mismatch
  repair system.
