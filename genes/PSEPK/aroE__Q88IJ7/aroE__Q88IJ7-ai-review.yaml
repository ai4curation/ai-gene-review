taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: aroE (PP_3002, also called aroE-2) encodes a shikimate dehydrogenase-family oxidoreductase in
  Pseudomonas putida KT2440 with shikimate-dehydrogenase substrate-binding and NAD(P)-binding domains. Its crystal
  structure (PDB 3PWZ) is that of an AroE-like1 (Ael1) enzyme, one of at least four functionally distinct
  shikimate dehydrogenase classes (AroE, YdiB, SdhL, Ael1) that use shikimate as a substrate in vitro; Ael1 shares
  the family fold and the active-site lysine-aspartate catalytic dyad. Shikimate dehydrogenases catalyze the
  reversible NADP(H)-linked interconversion of 3-dehydroshikimate and shikimate, the fourth step of the shikimate
  pathway to chorismate. KT2440 encodes several aroE-like paralogs; the structurally characterized AroE-class
  enzyme is PP_0074 (PDB 4OMU), so the physiological role of PP_3002 within or beside the shikimate pathway is not
  resolved by current gene-level evidence. It is inferred to be a soluble cytosolic enzyme.
