    id: GO:0009423
    label: chorismate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Shikimate dehydrogenase supplies shikimate for the pathway leading to chorismate, the aromatic-branch precursor. PP_3002 is an Ael1-class enzyme, and the structurally characterized AroE of KT2440 is the paralog PP_0074.
    action: KEEP_AS_NON_CORE
    reason: The enzyme can catalyse the shikimate step in vitro, so participation in chorismate biosynthesis is plausible and the row is kept. But PP_3002 belongs to the Ael1 class rather than the AroE class, and KT2440 has an AroE-class paralog (PP_0074), so how much PP_3002 contributes to chorismate biosynthesis in vivo is unresolved; it is not treated as the core role. Both earlier reviews of this protein had accepted the row; the merged duplicate (folder aroE) did so on the mistaken basis that PP_3002 is the canonical AroE.
