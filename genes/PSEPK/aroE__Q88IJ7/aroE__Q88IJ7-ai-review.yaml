    summary: PP_3002 is assigned to the shikimate dehydrogenase family with NAD(P)-binding and shikimate substrate-binding domains, and UniProt maps it to EC 1.1.1.25/RHEA-supported shikimate dehydrogenase activity.
    action: ACCEPT
    reason: This is the best-supported molecular function for the protein and is consistent with InterPro/HAMAP/ARBA evidence. Its structure places it in the Ael1 class, which uses shikimate as a substrate in vitro and shares the AroE catalytic dyad, so the activity term is kept; whether NADP(H)-linked shikimate oxidoreduction is its physiological reaction, as it is for the AroE-class paralog PP_0074, is open.
