suggested_questions:
- question: What is the physiological substrate and cofactor of the Ael1-class enzyme PP_3002, and does it contribute
    to chorismate biosynthesis in vivo alongside the AroE-class paralog PP_0074?
suggested_experiments:
- description: Compare growth of KT2440 delta-PP_0074, delta-PP_3002 and the double mutant in minimal medium without
    aromatic amino acids, and measure PP_3002 kinetics with shikimate and quinate using NADP+ and NAD+.
