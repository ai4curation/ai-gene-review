core_functions:
- description: Shikimate dehydrogenase-family oxidoreductase of the Ael1 (AroE-like1) class, which uses shikimate as a
    substrate in vitro via the conserved lysine-aspartate catalytic dyad; annotated as NADP-dependent shikimate
    dehydrogenase. Its physiological substrate and its contribution to chorismate biosynthesis, beside the AroE-class
    paralog PP_0074, are unresolved.
