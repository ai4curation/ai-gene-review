id: Q88K44
gene_symbol: puuB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PuuB is the predicted gamma-glutamylputrescine oxidoreductase of KT2440. Its
  exact PANTHER subfamily and close correspondence to experimentally
  characterized E. coli PuuB support oxidation of gamma-glutamylputrescine to
  4-(gamma-glutamylamino)butanal. No dedicated GO molecular-function term
  currently captures this reaction.
