id: Q88K44
gene_symbol: puuB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PuuB is the predicted gamma-glutamylputrescine oxidase of KT2440. Its
  exact PANTHER subfamily and close correspondence to experimentally
  characterized E. coli PuuB support oxidation of gamma-glutamylputrescine to
  4-(gamma-glutamylamino)butanal. No dedicated GO molecular-function term
  currently captures this reaction.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A cytoplasmic location is plausible but does not describe PuuB's biochemical role.
      action: KEEP_AS_NON_CORE
      reason: Retain the generic TreeGrafter location outside the core functional summary.
  - term:
      id: GO:0009447
      label: putrescine catabolic process
    evidence_type: ISS
    original_reference_id: UniProtKB:P37906
    qualifier: involved_in
    review:
      summary: PuuB performs the second, route-specific oxidation in gamma-glutamyl putrescine catabolism.
      action: NEW
      reason: The exact PANTHER subfamily and experimentally characterized E. coli exemplar support pathway membership.
      supported_by:
        - reference_id: file:PSEPK/puuB/puuB-uniprot.txt
          supporting_text: DR   PANTHER; PTHR13847:SF275; GAMMA-GLUTAMYLPUTRESCINE OXIDOREDUCTASE; 1.
  - term:
      id: GO:0016641
      label: oxidoreductase activity, acting on the CH-NH2 group of donors, oxygen as acceptor
    evidence_type: ISS
    original_reference_id: UniProtKB:P37906
    qualifier: enables
    review:
      summary: This is the most specific existing GO parent that captures the oxygen-dependent PuuB reaction class.
      action: NEW
      reason: >-
        Q88K44 shares exact PTHR13847:SF275 membership with characterized E.
        coli PuuB, and Rhea 28414 oxidizes a CH-NH2 donor using oxygen. A new
        substrate-specific child term is proposed separately.
      supported_by:
        - reference_id: file:PSEPK/puuB/puuB-uniprot.txt
          supporting_text: DR   PANTHER; PTHR13847:SF275; GAMMA-GLUTAMYLPUTRESCINE OXIDOREDUCTASE; 1.
        - reference_id: PMID:15590624
          supporting_text: oxidization of gamma-glutamylputrescine
