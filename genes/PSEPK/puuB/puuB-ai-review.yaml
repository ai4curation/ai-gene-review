aliases:
  - PP_2448
core_functions:
  - description: >-
      Predicted gamma-glutamylputrescine oxidoreductase that forms
      4-(gamma-glutamylamino)butanal in putrescine catabolism.
    directly_involved_in:
      - id: GO:0009447
        label: putrescine catabolic process
    supported_by:
      - reference_id: file:PSEPK/puuB/puuB-uniprot.txt
        supporting_text: DR   PANTHER; PTHR13847:SF275; GAMMA-GLUTAMYLPUTRESCINE OXIDOREDUCTASE; 1.
proposed_new_terms:
  - proposed_name: gamma-glutamylputrescine oxidoreductase activity
    proposed_definition: >-
      Catalysis of the oxidation of gamma-L-glutamylputrescine with oxygen and
      water to form 4-(gamma-L-glutamylamino)butanal, hydrogen peroxide, and ammonium.
    justification: >-
      The experimentally characterized Rhea 28414 reaction lacks a
      substrate-specific GO molecular-function term, forcing PuuB annotations to generic oxidoreductase activity.
    proposed_parent:
      id: GO:0016491
      label: oxidoreductase activity
suggested_questions:
  - question: Does KT2440 PuuB have the same substrate range and oxygen dependence as E. coli PuuB?
suggested_experiments:
  - description: Purify Q88K44 and measure Rhea 28414 turnover with gamma-glutamylputrescine and related glutamylpolyamines.
    experiment_type: substrate-specific enzyme kinetics
