  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A cytoplasmic location is plausible but does not describe PuuB's biochemical role.
      action: KEEP_AS_NON_CORE
      reason: Retain the generic TreeGrafter location outside the core functional summary.
  - term:
      id: GO:0009447
      label: putrescine catabolic process
    evidence_type: ISS
    original_reference_id: file:modules/gamma_glutamyl_putrescine_catabolism.yaml
    qualifier: involved_in
    review:
      summary: PuuB performs the second, route-specific oxidation in gamma-glutamyl putrescine catabolism.
      action: NEW
      reason: The exact PANTHER subfamily and experimentally characterized E. coli exemplar support pathway membership.
      supported_by:
        - reference_id: file:PSEPK/puuB/puuB-uniprot.txt
          supporting_text: DR   PANTHER; PTHR13847:SF275; GAMMA-GLUTAMYLPUTRESCINE OXIDOREDUCTASE; 1.
