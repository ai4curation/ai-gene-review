- id: file:PSEPK/moeB/moeB-deep-research-openscientist.md
  title: OpenScientist gene research for moeB
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Read in full. Reported full-length E. coli orthology, ATP-binding and zinc motifs and absence of rhodanese extension support classical MoeB. Exact reported alignment statistics were not independently rerun, and unsaved target analyses are presented as decisive. No direct PP_0735 biochemical experiment or partner mapping was identified.
  findings:
  - statement: The report states the conserved MoeB acyl-adenylation reaction.
    supporting_text: '**The reaction catalyzed is: MoaD-COO⁻ + ATP → MoaD-CO-AMP (MoaD-adenylate) + PPᵢ.**'
  - statement: The report explicitly acknowledges that no direct Q88PW3 assay, structure, or knockout was found.
    supporting_text: '**No direct experimental characterization of Q88PW3 itself.** The functional assignment is inferred from the *E. coli* ortholog (P12282) via high sequence identity (~54%) and conserved motifs. No published enzymatic assay, structure, or knockout of the *P. putida* PP_0735 protein was identified.'
  - statement: The report presents a target-specific alignment that was not saved as a reproducible local artifact.
    supporting_text: A Needleman-Wunsch global alignment of the two proteins (251 aa vs. 249 aa) yields **133 identical residues = 53.8% identity** over aligned columns (53.0% over the full Q88PW3 length), with near-identical length and no large insertions or deletions (alignment length 253).
  - statement: The report presents target motif and zinc-site calls that were not saved as a reproducible local artifact.
    supporting_text: Two cysteine-pair motifs — `CYHC` (C171–C174) and `CTVC` (C243–C246, at the extreme C-terminus) — match the structural zinc-binding site characteristic of *E. coli* MoeB.
  - statement: Q88PW3 is a classical 251-aa MoeB without a fused rhodanese domain, separating adenylation from sulfur transfer.
    supporting_text: Q88PW3 is therefore a "classic" adenylyltransferase that requires a separate downstream sulfurtransferase to complete thiocarboxylation.
