    supporting_text: P12282,Molybdopterin-synthase adenylyltransferase,protein,83333,Escherichia coli (strain K12),Escherichia coli (strain K12),moeB,249,PTHR10953:SF194,MOLYBDOPTERIN-SYNTHASE ADENYLYLTRANSFERASE,True
