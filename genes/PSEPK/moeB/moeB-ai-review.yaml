      no sulfur. The PTHR10953 family review rates this IBD TOO_DEEP. Same action as
      genes/ECOLI/moeB.
    supported_by:
    - reference_id: PMID:11463785
      supporting_text: There was also no evidence for a MoeB-bound sulfur during the sulfuration of
