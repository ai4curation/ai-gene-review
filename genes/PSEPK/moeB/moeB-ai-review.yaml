  review:
    summary: This electronic annotation conflates MoeB-mediated acyl-adenylation with E1-like
      thiolester-forming modifier activation.
    action: REMOVE
    reason: The GO:0008641 definition requires ATP-dependent formation of a high-energy thiolester
      bond. E. coli MoeB forms MoaD-adenylate but no thioester with MoaD, and Q88PW3 is the same
      classical single-domain MoeB. Same action as genes/ECOLI/moeB.
    supported_by:
    - reference_id: PMID:11463785
      supporting_text: However, unlike
        the ubiquitin activation reaction, the formation of a thioester intermediate
        between MoeB and MoaD could not be observed.
    - reference_id: file:PSEPK/moeB/moeB-deep-research-openscientist.md
      supporting_text: Q88PW3 is therefore a "classic" adenylyltransferase that requires a separate downstream sulfurtransferase to complete thiocarboxylation.
