taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  moeB encodes the cytosolic molybdopterin-synthase sulfur-carrier
  adenylyltransferase. MoeB uses ATP to adenylate the C-terminal glycine of MoaD,
  activating the carrier for thiocarboxylate formation and subsequent sulfur
  donation during molybdopterin synthesis.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Retain the broad catalytic term describing MoaD adenylation.
    action: ACCEPT
    reason: ATP-dependent transfer of AMP to the terminal carboxylate of MoaD is catalytic nucleotidyl
      transfer. The specific molybdopterin-synthase adenylyltransferase term is already retained, and
      its broad catalytic ancestors remain correct. OpenScientist supports the classical MoeB architecture
      and conserved mechanism while explicitly noting that Q88PW3 has not been assayed.
    supported_by:
    - reference_id: PMID:11713534
      supporting_text: MoeB activates the C terminus of MoaD to form an acyl-adenylate.
    - reference_id: file:PSEPK/moeB/moeB-deep-research-openscientist.md
      supporting_text: Q88PW3 is therefore a "classic" adenylyltransferase that requires a separate
        downstream sulfurtransferase to complete thiocarboxylation.
- term:
    id: GO:0004792
    label: thiosulfate-cyanide sulfurtransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: A thiosulfate-cyanide sulfurtransferase reaction is not supported for MoeB.
    action: REMOVE
    reason: MoeB activates MoaD by ATP-dependent adenylylation; it does not use thiosulfate or cyanide
      in the assigned reaction. The 251-aa target lacks the C-terminal rhodanese domain found in multifunctional
      MoeB/MoeZ-family fusions; this is an architecture and reaction mismatch, not merely absence of
      a target assay.
