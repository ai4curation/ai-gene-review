id: Q88PW3
gene_symbol: moeB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  moeB (PP_0735) encodes the cytosolic molybdopterin-synthase sulfur-carrier
  adenylyltransferase, a single-domain member of the HesA/MoeB/ThiF family. By orthology with
  Escherichia coli MoeB, it uses ATP to adenylate the C-terminal glycine of MoaD, activating the
  carrier for thiocarboxylate formation by a separate sulfurtransferase and subsequent sulfur
  donation during molybdopterin synthesis.
