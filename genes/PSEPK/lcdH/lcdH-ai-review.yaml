  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GO:0047728 is the exact molecular function of LcdH.
    action: ACCEPT
    reason: HAMAP MF_02129 classifies PP_0302 specifically as L-carnitine dehydrogenase. Its sequence
      is 83.489% identical to P. aeruginosa CdhA over a global alignment and it occupies the conserved
      carnitine locus. PMID:3058208 measures L-carnitine/NAD(+) specificity in P. putida IFP 206,
      not KT2440. This combined comparative support justifies the exact catalytic assignment without
      transferring strain-specific kinetics.
    supported_by:
    - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes the NAD(+)-dependent oxidation of L-carnitine to 3- dehydrocarnitine.
