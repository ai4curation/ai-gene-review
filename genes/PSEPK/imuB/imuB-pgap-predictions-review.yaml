id: Q88I83
gene_symbol: imuB
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_3118
description: >-
  NCBI PGAP names WP_010954010.1 "Y-family DNA polymerase" from the SPARCLE
  CDD domain architecture 10131054 (a single PolY_like domain, cd03468) and
  passes on EC 2.7.7.7 and five GO terms: damaged DNA binding, DNA-directed
  DNA polymerase activity, metal ion binding, DNA replication and DNA repair.
  ImuB keeps the Y-family polymerase fold but has lost the active-site
  carboxylates; in the characterized mycobacterial system it is a
  polymerase-inactive adaptor that links ImuA and the catalytic DnaE2/ImuC to
  the beta clamp. In the KT2440 sequence every CDD-annotated active-site
  position carries a non-acidic residue except one. The polymerase activity,
  the EC number and the metal ion binding are therefore wrong (pseudoenzyme
  over-annotation). DNA replication and DNA repair are broad processes that
  the main review refines to translesion synthesis, and damaged DNA binding
  is unverified for ImuB. The error lies on the architecture: a bare PolY_like
  architecture cannot distinguish active Y-family polymerases from ImuB, so
  the product name and GO reach every ImuB with it.
