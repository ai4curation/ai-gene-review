    label: DNA replication
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Broadly true but less precise. ImuB takes part in damage-induced,
      DnaE2-dependent translesion synthesis, which the main review proposes as
      GO:0019985; in GO, translesion synthesis is part of DNA replication, so
      this term is an ancestor of the specific process. It is not in GOA. ImuB
      takes part in replication only through lesion bypass, not in
      normal replicative synthesis.
