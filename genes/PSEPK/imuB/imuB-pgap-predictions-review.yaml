- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0003684
    label: damaged DNA binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Uncertain. The term is inherited from active Y-family polymerases, which
      bind lesion-containing primer-template DNA in their catalytic cleft. The
      CDD annotation maps a DNA-binding site onto ImuB, but no study has shown
      that ImuB binds DNA, damaged or otherwise; the characterized interactions
      are protein-protein (ImuA, DnaE2 and the beta clamp). In the mycobacterial
      mutasome the predicted DNA-binding component is ImuA', not ImuB. Neither
      in GOA nor proposed in the main review.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: "a putative polymerase-inactive Y-family homolog that binds β as well as the other cassette components, and a predicted DNA-binding protein"
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Wrong. ImuB homologs keep the Y-family fold but lack the active-site
      carboxylates that coordinate the catalytic metals. In the GenPept
      record, the CDD active-site positions (7-8, 11-12, 44, 47, 101-102, 154)
      carry L, L, L, A, P, A, R, A and D in the KT2440 sequence: only one
      acidic residue remains and the two-metal palm carboxylates are gone. In
      the ImuA-ImuB-DnaE2 cassette, DNA synthesis is done by DnaE2/ImuC, and
      ImuB is the polymerase-inactive adaptor (main review core function:
      protein-macromolecule adaptor activity). The SPARCLE architecture is a
      single PolY_like domain shared with active polymerases, so it cannot
      separate ImuB from them.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: "Despite retaining structural features characteristic of Y-family members, ImuB homologs lack conserved active-site amino acids required for polymerase activity."
    - reference_id: PMID:20615954
      supporting_text: "However, the absence of active-site carboxylates appears incompatible with catalytic function in ImuB"
    - reference_id: PMID:28118378
      supporting_text: "ImuB lacks catalytic residues essential for polymerase activities, but possesses β-clamp-binding motif."
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0046872
    label: metal ion binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Not supported. In Y-family polymerases, metal ion binding is the
      coordination of the two catalytic Mg2+/Mn2+ ions by the active-site
      carboxylates. ImuB has lost those carboxylates, so the basis for the
      prediction is absent; no other metal site is known in ImuB. The term
      follows from the same pseudoenzyme over-annotation as the polymerase
      activity.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: "However, the absence of active-site carboxylates appears incompatible with catalytic function in ImuB"
