    review:
      summary: Broad DNA repair obscures ImuB's specific role in damage tolerance and mutagenesis.
      action: MODIFY
      reason: ImuB is a noncatalytic accessory of DnaE2-dependent error-prone translesion synthesis rather than a repair enzyme.
      proposed_replacement_terms:
