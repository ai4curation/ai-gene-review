taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: 'ImuB (PP_3118) is the polymerase-like accessory protein of the LexA2-regulated ImuA-ImuB-DnaE2
  cassette. Its noncatalytic adaptor role is inferred from specific architecture and experimentally
  characterized orthologs that organize ImuA, DnaE2 and the beta clamp. Native P. putida genetics
  support damage tolerance: deletion in PaW85, described as isogenic to KT2440, increases alkylation
  sensitivity in an AlkA-deficient background, and complementation restores tolerance. Stationary-phase
  and UV mutation effects differ from the MMS-induced cassette phenotype; they do not establish universally
  mutagenic or nonmutagenic output.'
