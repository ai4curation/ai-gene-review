id: Q88I83
gene_symbol: imuB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  ImuB (PP_3118) is a catalytically inactive, polymerase-like accessory protein
  of the ImuA-ImuB-DnaE2 damage-induced mutagenesis cassette. It is predicted
  to organize or recruit DnaE2 and replication-clamp machinery at damaged DNA;
  the adjacent DnaE2 protein, not ImuB, performs DNA synthesis.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Broad DNA repair obscures ImuB's specific role in damage tolerance and mutagenesis.
      action: MODIFY
      reason: ImuB is a noncatalytic accessory of DnaE2-dependent error-prone translesion synthesis rather than a repair enzyme.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/imuB/imuB-uniprot.txt
    qualifier: involved_in
    review:
      summary: ImuB is the polymerase-like recruitment component of the ImuABC cassette.
      action: NEW
      reason: The IMS/UmuC-like family architecture and exact imuA-imuB-dnaE2 locus support the specific process annotation.
      supported_by:
        - reference_id: file:PSEPK/imuB/imuB-uniprot.txt
          supporting_text: DR   Pfam; PF00817; IMS; 1.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/imuB/imuB-uniprot.txt
    title: UniProtKB entry for imuB (Q88I83)
    findings:
      - statement: Q88I83 has an IMS/UmuC-like polymerase fold and is encoded between ImuA and the reviewed DnaE2 polymerase.
  - id: file:PSEPK/imuB/imuB-deep-research-openscientist.md
    title: OpenScientist research report for imuB (Q88I83)
    findings:
      - statement: >-
          The report supports a catalytically inactive polymerase-like scaffold
          role using ortholog interaction data, conserved cassette structure,
          and loss of key catalytic carboxylates; direct KT2440 assays remain absent.
core_functions:
  - description: Noncatalytic polymerase-like scaffold that contributes to recruitment and operation of DnaE2 during damage-induced mutagenic synthesis.
    contributes_to_molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: file:PSEPK/imuB/imuB-uniprot.txt
        supporting_text: DR   InterPro; IPR001126; UmuC.
      - reference_id: file:PSEPK/imuB/imuB-deep-research-openscientist.md
        supporting_text: ImuB is **not an active polymerase**.
    knowledge_gaps:
      - gap_statement: Q88I83 binding to DnaE2, the beta clamp, and damaged DNA has not been tested directly in KT2440.
        significance: The cassette supports an accessory role but not an independent DNA polymerase annotation.
proposed_new_terms: []
suggested_questions:
  - question: Which Q88I83 interfaces recruit DnaE2 and the replication clamp in KT2440?
suggested_experiments:
  - description: Map Q88I83 interactions with Q88I82 and DnaN, then test separation-of-function mutants in lesion-bypass and mutation-frequency assays.
