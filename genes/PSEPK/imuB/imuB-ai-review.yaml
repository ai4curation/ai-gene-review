id: Q88I83
gene_symbol: imuB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ImuB (PP_3118) is a catalytically inactive, polymerase-like accessory protein
  of the ImuA-ImuB-DnaE2 damage-induced synthesis cassette. Ortholog studies
  show that ImuB organizes ImuA, DnaE2, and beta-clamp interactions rather than
  performing DNA synthesis. In P. putida, ImuB promotes stationary-phase and
  UV-associated mutation accumulation and contributes to alkylation-damage
  tolerance.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Broad DNA repair obscures ImuB's specific role in damage tolerance and mutagenesis.
      action: MODIFY
      reason: >-
        The row is a UniProt combined-pipeline IEA whose stated basis is the
        UmuC domain IPR001126 plus the TreeGrafter node PANTHER:PTN002440639;
        it is not a PAINT IBA, and neither source resolves beyond generic repair.
        ImuB is a noncatalytic accessory of DnaE2-dependent lesion bypass rather
        than a repair enzyme, and in this organism it promotes mutation
        accumulation. Translesion synthesis is the supported term; the mutagenic
        child GO:0042276 is reserved for the orthologs where the whole cassette's
        output is error-prone, since KT2440 ImuB and DnaE2 have antagonistic
        effects on mutagenesis.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
      supported_by:
        - reference_id: PMID:17331811
          supporting_text: ImuB facilitated accumulation of stationary-phase mutants up to two-fold.
        - reference_id: PMID:20615954
          supporting_text: >-
            Despite retaining structural features characteristic of Y-family
            members, ImuB homologs lack conserved active-site amino acids
            required for polymerase activity.
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/imuB/imuB-uniprot.txt
    qualifier: involved_in
    review:
      summary: ImuB is the polymerase-like recruitment component of the ImuABC cassette.
      action: NEW
      reason: >-
        Supported in this organism: an imuB mutant changes stationary-phase and
        UV mutagenesis, and ImuB contributes to alkylation-damage tolerance,
        which is lesion tolerance rather than repair. The IMS/UmuC architecture
        and the exact imuA-imuB-dnaE2 locus identify it as the cassette's
        adaptor component.
      supported_by:
        - reference_id: file:PSEPK/imuB/imuB-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: DR   Pfam; PF00817; IMS; 1.
        - reference_id: PMID:17331811
          supporting_text: "accumulation of stationary-phase mutants up to two-fold."
  - term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    evidence_type: ISS
    original_reference_id: PMID:20615954
    qualifier: enables
    review:
      summary: ImuB is a noncatalytic interaction hub connecting mutasome proteins and the beta clamp.
      action: NEW
      reason: >-
        Transferred from the mycobacterial ortholog, where two-hybrid
        interactions with ImuA, DnaE2 and the beta clamp plus a
        separation-of-function clamp-binding allele establish the adaptor
        activity, and where the active-site carboxylates are shown to be absent
        in ImuB proteins generally. Q88I83 keeps the UmuC fold and the cassette
        context, so the role transfers; the interactions have not been tested in
        KT2440.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            Yeast two-hybrid analyses indicate that ImuB interacts with both
            ImuA' and DnaE2, as well as with the beta-clamp.
        - reference_id: file:PSEPK/imuB/imuB-deep-research-openscientist.md
          supporting_text: "structural adapter/scaffold protein"
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/imuB/imuB-uniprot.txt
    title: UniProtKB entry for imuB (Q88I83)
    findings:
      - statement: Q88I83 has an IMS/UmuC-like polymerase fold and is encoded between ImuA and the reviewed DnaE2 polymerase.
  - id: file:PSEPK/imuB/imuB-deep-research-openscientist.md
    title: OpenScientist research report for imuB (Q88I83)
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: >-
        Supports ImuB as the catalytically inactive polymerase-like adaptor of
        the imuA-imuB-dnaE2 cassette, using ortholog interaction genetics,
        KT2440 operon structure, and catalytic-residue loss; PP_3118-specific
        ImuA/DnaE2/beta-clamp binding interfaces and lesion-bypass phenotypes
        remain to be tested directly.
    findings:
      - statement: >-
          The report supports a catalytically inactive polymerase-like scaffold
          role using ortholog interaction data, conserved cassette structure,
          and loss of key catalytic carboxylates.
  - id: PMID:20615954
    title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis in Mycobacterium tuberculosis.
    findings:
      - statement: ImuB binds ImuA, DnaE2, and the beta clamp while lacking polymerase active-site residues.
        supporting_text: >-
          Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA'
          and DnaE2, as well as with the beta-clamp.
  - id: PMID:17331811
    title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
    findings:
      - statement: P. putida ImuB promotes accumulation of stationary-phase mutants.
        supporting_text: "accumulation of stationary-phase mutants up to two-fold."
  - id: PMID:28118378
    title: DNA Polymerases ImuC and DinB Are Involved in DNA Alkylation Damage Tolerance in Pseudomonas aeruginosa and Pseudomonas putida.
    findings:
      - statement: P. putida ImuB and DnaE2/ImuC participate in alkylation-damage tolerance.
        supporting_text: "polymerases ImuC and DinB ensured a protective role against N- and O-methylation"
core_functions:
  - description: Noncatalytic polymerase-like adaptor that recruits and organizes DnaE2 and the beta clamp during damage-induced synthesis.
    molecular_function:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA'
          and DnaE2, as well as with the beta-clamp.
      - reference_id: PMID:17331811
        supporting_text: "accumulation of stationary-phase mutants up to two-fold."
    knowledge_gaps:
      - gap_statement: Q88I83 interaction interfaces and their contribution to lesion-specific synthesis have not been mapped directly.
        significance: Species genetics support function, while ortholog studies define the detailed adaptor mechanism.
proposed_new_terms: []
suggested_questions:
  - question: Which Q88I83 interfaces recruit DnaE2 and the replication clamp in KT2440?
suggested_experiments:
  - description: Map Q88I83 interactions with Q88I82 and DnaN, then test separation-of-function mutants in lesion-bypass and mutation-frequency assays.
