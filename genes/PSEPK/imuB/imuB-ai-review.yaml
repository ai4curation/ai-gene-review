      Native PaW85 ΔimuB alkyl-damage sensitivity and complementation establish function, while ortholog
      interaction evidence supports an adaptor mechanism. Generic TLS spans the different mutation
      outcomes; older stationary-phase antagonism does not negate ImuC-dependent MMS mutagenesis.
