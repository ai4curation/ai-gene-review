  review:
    summary: ImuB is a noncatalytic interaction hub connecting mutasome proteins and the beta clamp.
    action: NEW
    reason: Transferred from the mycobacterial ortholog, where two-hybrid interactions with ImuA,
      DnaE2 and the beta clamp plus a separation-of-function clamp-binding allele establish the adaptor
      activity, and where the active-site carboxylates are shown to be absent in ImuB proteins generally.
      Q88I83 keeps the UmuC fold and the cassette context, so the role transfers; the interactions
      have not been tested in KT2440.
