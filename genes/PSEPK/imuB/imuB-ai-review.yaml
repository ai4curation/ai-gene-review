  findings:
  - statement: Mycobacterial ImuB interacts with ImuA-prime, DnaE2 and the beta clamp; its noncatalytic
      polymerase-like architecture supports an adaptor interpretation by analogy for PSEPK.
    supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
