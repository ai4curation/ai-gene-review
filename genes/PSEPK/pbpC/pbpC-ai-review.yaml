knowledge_gaps:
- gap_statement: Whether the intact transpeptidase-like domain of KT2440 PbpC has condition-specific or partner-dependent activity is unknown.
  status: OPEN
  gap_kind: [BIOLOGY, CURATION]
  significance: Sequence conservation alone does not justify a D,D-transpeptidase annotation when the characterized ortholog is transglycosylase-only in vivo.
