id: Q88QC2
gene_symbol: pbpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PbpC/PBP1C is a membrane-anchored class-A penicillin-binding protein whose
  best-supported physiological activity is accessory peptidoglycan glycan
  polymerization. It contains GT51 and transpeptidase-like domains, but
  ortholog evidence does not establish peptide-crosslinking activity in vivo.
existing_annotations:
- term:
    id: GO:0008658
    label: penicillin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PBP1C has a conserved penicillin-recognizing domain but an atypical beta-lactam-binding profile.
    action: ACCEPT
    reason: The family assignment and intact active-site motifs support penicillin binding without implying a core transpeptidase role.
- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The GT51 domain polymerizes lipid II into peptidoglycan glycan strands.
    action: ACCEPT
    reason: Glycan polymerization is the experimentally supported primary activity of the characterized PBP1C ortholog.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PbpC provides accessory glycan-polymerization capacity during peptidoglycan synthesis.
    action: ACCEPT
    reason: Its glycosyltransferase reaction directly contributes to assembly of the sacculus.
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The catalytic domains are predicted to project into the periplasm.
    action: ACCEPT
    reason: An N-terminal membrane anchor and conserved class-A PBP topology place glycan polymerization on the periplasmic face.
