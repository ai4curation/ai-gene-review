knowledge_gaps:
- gap_statement: The relative roles of MrdA-I and MrdA-II in KT2440 elongation are unknown.
  status: OPEN
  gap_kind: [BIOLOGY, CURATION]
  significance: Operon context favors MrdA-II as the canonical RodA partner but does not establish redundancy or condition-specific deployment.
- gap_statement: GO lacks a molecular-function term that cleanly represents PBP-family D,D-transpeptidation.
  status: OPEN
  gap_kind: [ONTOLOGY]
  significance: The available carboxypeptidase term obscures the core peptide-crosslinking reaction.
