id: Q88DL8
gene_symbol: mrdA-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  MrdA-II/PBP2 is a bitopic inner-membrane class-B penicillin-binding protein
  predicted to perform periplasmic D,D-transpeptidation in the RodA-dependent
  lateral-wall peptidoglycan synthesis machinery. Its operon linkage to mrdB/rodA
  supports a canonical elongasome role, while the contribution of the second
  paralog MrdA-I remains unresolved.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The root catalytic term is true but uninformative for a D,D-transpeptidase.
    action: REMOVE
    reason: It adds no useful information beyond the family-specific catalytic interpretation.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: MrdA-II is anchored in the cytoplasmic membrane.
    action: ACCEPT
    reason: Its N-terminal transmembrane helix positions the catalytic domain in the periplasm.
- term:
    id: GO:0008658
    label: penicillin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The intact PBP active site supports beta-lactam binding.
    action: ACCEPT
    reason: Penicillin binding is a defining property of the MrdA/PBP2 family.
- term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: MrdA-II performs D,D-transpeptidation rather than primarily D,D-carboxypeptidation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The EC-linked GO label does not accurately describe the core peptide-crosslinking reaction.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: MrdA-II is the predicted RodA-coupled lateral-wall crosslinking enzyme.
    action: ACCEPT
    reason: Its immediate mrdB/rodA neighbor supplies the glycan-polymerase half of the elongasome synthase.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Membrane localization is true but less specific than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: GO:0005886 captures the relevant bacterial membrane.
- term:
    id: GO:0071555
    label: cell wall organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Lateral-wall peptide crosslinking directly contributes to cell-wall organization.
    action: ACCEPT
    reason: The RodA-MrdA machinery organizes and expands the peptidoglycan sacculus.
- term:
    id: GO:0071972
    label: peptidoglycan L,D-transpeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: MrdA family proteins are D,D-transpeptidases, not L,D-transpeptidases.
    action: REMOVE
    reason: This TreeGrafter transfer assigns the wrong crosslink chemistry to a class-B PBP.
