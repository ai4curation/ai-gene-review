- id: PMID:32214184
  title: Transport and kinase activities of CbrA of Pseudomonas putida KT2440.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      KT2440 primary biochemistry (full text cached): His766 autophosphorylation,
      phosphotransfer to CbrB, no phosphatase activity, specific L-histidine
      binding and proton-driven transport, and domain-deletion effects on crcZ
      reporter expression.
  findings:
  - statement: CbrA autophosphorylates and transfers phosphate to CbrB.
    supporting_text: >-
      it is shown that the histidine kinase can autophosphorylate and transfer
      the phosphoryl group to the response regulator CbrB.
  - statement: CbrA is a specific, proton-driven L-histidine transporter.
    supporting_text: >-
      It is demonstrated that CbrA can bind and transport L-histidine.
      Transport is specific for L-histidine and probably driven by an
      electrochemical proton gradient.
  - statement: L-histidine does not modulate CbrA kinase activities in vitro, so the sensed signal is unknown.
    supporting_text: >-
      The lack of an effect of L-histidine leaves open the possibility that a
      yet to be identified intracellular metabolite is perceived by CbrA as a
      signal.
- id: PMID:26148710
  title: Role of the Transporter-Like Sensor Kinase CbrA in Histidine Uptake and Signal Transduction.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; work in Pseudomonas fluorescens SBW25 implicating
      the CbrA SSSF domain in histidine uptake. Used as corroborating evidence
      from an ortholog.
  findings:
  - statement: The CbrA SSSF domain mediates histidine transport in P. fluorescens.
    supporting_text: >-
      Our combined data implicate the SSSF domain of CbrA in histidine
      transport and suggest that transport is coupled to signal transduction.
- id: PMID:11401699
  title: The CbrA-CbrB two-component regulatory system controls the utilization of multiple carbon and nitrogen sources in Pseudomonas aeruginosa.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; founding P. aeruginosa paper identifying CbrA as a membrane sensor histidine kinase partnered with CbrB.
  findings:
  - statement: CbrA is a membrane sensor histidine kinase and CbrB its cognate response regulator.
    supporting_text: >-
      The cbrA and cbrB genes encode a sensor/histidine kinase (Mr 108 379,
      983 residues) and a cognate response regulator (Mr 52 254, 478 residues)
      respectively.
- id: file:PSEPK/cbrA/cbrA-uniprot.txt
  title: UniProt entry Q88DX3
  findings:
  - statement: Thirteen predicted transmembrane segments precede the PAS and histidine kinase domains.
suggested_questions:
- question: What intracellular or membrane-derived signal does CbrA sense, given that L-histidine binds CbrA but does not change its kinase activities in vitro?
- question: Is L-histidine uptake by the CbrA SLC5 domain physiologically significant in KT2440 relative to the dedicated HutT and HutWX transporters?
suggested_experiments:
- hypothesis: CbrA autokinase activity responds to an intracellular metabolite that tracks carbon/nitrogen balance.
  experiment_type: biochemical_assay
  description: Screen candidate intracellular metabolites (for example 2-oxoglutarate, glutamine, ATP/ADP ratio) for effects on CbrA-dependent phosphotransfer to CbrB in proteoliposomes, and correlate with crcZ reporter output in vivo.
