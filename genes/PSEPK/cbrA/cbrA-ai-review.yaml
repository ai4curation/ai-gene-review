gene_symbol: cbrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  cbrA (PP_4695) encodes the sensor histidine kinase of the CbrA/CbrB
  two-component system, an atypical integral cytoplasmic-membrane protein in
  which an N-terminal solute/sodium symporter (SLC5) domain of about 13
  transmembrane helices is joined through a STAC linker to cytoplasmic PAS,
  DHp and CA kinase domains. CbrA autophosphorylates on His766 and transfers the
  phosphoryl group to the receiver aspartate of its cognate response regulator
  CbrB; no CbrA phosphatase activity toward CbrB~P has been detected. The SLC5
  domain specifically binds and takes up L-histidine, driven by the proton
  gradient, but L-histidine does not alter the kinase activities in vitro and
  the proximal signal sensed by CbrA remains unknown. Through CbrB, CbrA drives
  sigma-54-dependent expression of the CrcZ and CrcY small RNAs that antagonise
  Hfq/Crc translational repression, so the CbrA/CbrB system controls carbon
  catabolite repression and the balance of carbon and nitrogen utilization in
  pseudomonads and related Pseudomonadaceae.
