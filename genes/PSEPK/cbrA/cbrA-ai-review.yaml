- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013767
  review:
    summary: >-
      Over-annotation from the PAS-fold InterPro2GO mapping. CbrA does not bind
      DNA; it affects transcription only indirectly, by phosphorylating the
      transcription activator CbrB.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A PAS domain does not imply transcription regulation, and the sensor
      kinase's own process is the phosphorelay. The transcriptional output
      (crcZ activation) is the activity of CbrB with sigma-54 and is annotated
      on those gene products.
    supported_by:
    - reference_id: PMID:32214184
      supporting_text: >-
        CbrA is composed of a domain with similarity to proteins of the
        solute/sodium symporter family (SLC5) and domains typically found in
        bacterial sensor kinases.
