- description: >-
    Sensor histidine kinase of the CbrA/CbrB two-component system:
    autophosphorylates on His766 and transfers the phosphoryl group to the
    receiver aspartate of CbrB, which then activates sigma-54-dependent
    transcription of the CrcZ/CrcY small RNAs and other poor-carbon targets.
