  supporting_entities:
  - InterPro:IPR003661
  - InterPro:IPR036097
  review:
    summary: >-
      Correct and core. Purified KT2440 CbrA autophosphorylates at the conserved
      His766 and transfers the phosphoryl group to CbrB, and the H766N variant
      fails to activate the CbrB target crcZ in vivo.
    action: ACCEPT
    reason: >-
      The InterPro-based assignment is confirmed by direct biochemical evidence
      for KT2440 CbrA, including phosphotransfer to its cognate response
      regulator, which is the defining feature of a two-component sensor kinase.
    supported_by:
    - reference_id: PMID:32214184
      supporting_text: >-
        it is shown that the histidine kinase can autophosphorylate and transfer
        the phosphoryl group to the response regulator CbrB.
    - reference_id: PMID:32214184
      supporting_text: >-
        Contrary to wild type CbrA, CbrA-H766N did not activate expression of
        crcZ indicating that the conserved histidine in the DHp domain (site of
        phosphorylation) is essential for signal transduction.
