  label: Pseudomonas putida KT2440
description: TauD is an Fe(II)- and 2-oxoglutarate-dependent taurine dioxygenase. It oxidatively cleaves
  taurine to aminoacetaldehyde and sulfite while converting 2-oxoglutarate and oxygen to succinate and
  carbon dioxide; the KT2440 enzyme forms a homotetramer.
