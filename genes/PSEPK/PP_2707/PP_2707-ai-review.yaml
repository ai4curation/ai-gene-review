  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PP_2707 is an unreviewed Xth/ExoIII-family nuclease predicted to have double-stranded DNA 3-prime-to-5-prime exonuclease activity. It is a plausible redundant AP-endonuclease candidate, but its lesion-processing specificity has not been established in KT2440.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The target record predicts two Mg2+ or Mn2+ ions for this AP/ExoA-family nuclease.
    action: KEEP_AS_NON_CORE
    reason: Metal binding is mechanistically relevant but does not distinguish PP_2707's lesion or exonuclease substrate.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: DNA binding is consistent with the ExoIII-like nuclease assignment but does not specify a catalytic reaction.
    action: KEEP_AS_NON_CORE
    reason: Retain substrate binding outside the core, which is represented by the exact 3-prime-to-5-prime exonuclease term.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic catalytic activity adds no information beyond the exact exonuclease annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0008311 identifies both the DNA substrate and exonucleolytic direction for PP_2707.
- term:
    id: GO:0004518
    label: nuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic nuclease activity does not distinguish the accepted double-stranded DNA 3-prime-to-5-prime exonuclease function.
    action: MARK_AS_OVER_ANNOTATED
    reason: Keep the directional exonuclease child as the informative catalytic assertion.
- term:
    id: GO:0004519
    label: endonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The AP/ExoA-family assignment makes endonuclease activity plausible, but PP_2707 has no target-specific AP-site assay.
    action: KEEP_AS_NON_CORE
    reason: Preserve the family-level possibility without promoting this paralog to the module's AP-incision role.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is consistent with a chromosomal DNA-repair nuclease.
    action: KEEP_AS_NON_CORE
    reason: Localization is contextual and does not define the supported exonuclease reaction.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The AP/ExoA-family assignment makes DNA repair plausible, but no target-specific lesion-processing role has been established.
    action: KEEP_AS_NON_CORE
    reason: Retain this broad process context without treating PP_2707 as a required BER enzyme; its supported core assertion is the exonuclease activity.
- term:
    id: GO:0008311
    label: double-stranded DNA 3'-5' DNA exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PP_2707 is named exodeoxyribonuclease III and assigned to the exact ExoIII-like subfamily.
    action: ACCEPT
    reason: The target protein name, ExoIII-like domains, and PTHR43250:SF1 placement converge on this exonuclease activity.
    supported_by:
    - reference_id: file:PSEPK/PP_2707/PP_2707-uniprot.txt
      supporting_text: "DR   PANTHER; PTHR43250:SF1; EXODEOXYRIBONUCLEASE III; 1."
