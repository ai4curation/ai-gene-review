- id: PMID:19400787
  title: BcsQ is an essential component of the Escherichia coli cellulose biosynthesis apparatus that
    localizes at the bacterial cell pole.
  full_text_unavailable: true
  findings:
  - statement: The primary BcsQ paper shows that yhjQ/BcsQ is essential for cellulose biosynthesis and
      polar localization in the enterobacterial reference system.
    supporting_text: we show that yhjQ, but not yhjR, is essential for cellulose biosynthesis; it has
      therefore been renamed bcsQ
  - statement: The same paper identifies BcsQ as a MinD homolog with polar localization.
    supporting_text: we demonstrate that BcsQ, a MinD homologue, displays a polar localization
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract-only primary research; directly supports BcsQ identity and accessory
      positioning role in a characterized ortholog.
- id: PMID:33563593
  title: Architecture and regulation of an enterobacterial cellulose secretion system.
  findings:
  - statement: E. coli BcsRQ forms ATP-bound sandwich dimers; wild-type hydrolysis is weak and inhibited
      by BcsE. The coupling of hydrolysis to downstream cellulose secretion is a mechanistic model, not
      demonstrated KT2440 ATPase activity.
    supporting_text: the BcsHisRQWT complex exhibited only weak adenosine triphosphatase (ATPase) activity
      in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text recovered by normal force-fetch. E. coli 1094 deletion/complementation assays
      and recombinant complex structures are distinguished from KT2440 inference. No precise ATP-hydrolysis
      mechanism is transferred from a generic P-loop domain.
- id: PMID:39394223
  title: Structural basis for synthase activation and cellulose modification in the E. coli Type II Bcs
    secretion system.
  findings:
  - statement: The E. coli macrocomplex directly places BcsQ against BcsA PilZ, providing structural participation
      evidence beyond a deletion phenotype.
    supporting_text: BcsQ buttresses the PilZ domain, likely stabilizing the catalytically competent state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined after normal fetch. Native phenotype assays used E. coli 1094; recombinant
      assembly used a bcs-deleted BL21*(DE3) host. The exact E. coli partner stoichiometry and stabilization
      geometry are not established for KT2440.
- id: PMID:30889223
  title: Transcriptional organization, regulation and functional analysis of flhF and fleN in Pseudomonas
    putida.
  findings:
  - statement: P. putida-specific work shows c-di-GMP/FleQ/FleN regulation of the bcs promoter, placing
      PP_2634's operon in the biofilm regulatory program.
    supporting_text: PbcsD was negatively regulated by FleQ and FleN, and repression was antagonized by
      c-di-GMP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text promoter-regulation study using KT2442 and related KT2440 backgrounds; it
      establishes FleQ/FleN/c-di-GMP regulation of the bcs promoter, not PP_2634 ATPase activity.
- id: PMID:21507177
  title: Cell-cell and cell-surface interactions mediated by cellulose and a novel exopolysaccharide contribute
    to Pseudomonas putida biofilm formation and fitness under water-limiting conditions.
  full_text_unavailable: true
  findings:
  - statement: The abstract explicitly studies P. putida mt2. It reports a minor bcs contribution to biofilm
      stability and a contribution to rhizosphere colonization; these are operon-level phenotypes, not
      KT2440 target-protein assays.
    supporting_text: The composition of the exopolysaccharide matrix of Pseudomonas putida mt2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only source explicitly identifies strain mt2. Use as contextual operon physiology,
      not direct KT2440 molecular evidence or a basis for adding target-specific biofilm functions.
