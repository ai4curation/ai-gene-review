  label: Pseudomonas putida KT2440
description: PP_2634 is a predicted BcsQ-family accessory protein of the Pseudomonas putida KT2440 cellulose
  biosynthesis machinery. BcsQ and P-loop NTPase family signatures support a role in assembly or stabilization
  of the synthase complex. Characterized E. coli BcsQ contacts the BcsA PilZ domain and associates with
  BcsR and BcsE. The KT2440 protein has a divergent N-terminal nucleotide-binding region, and its nucleotide
  specificity, hydrolytic activity, partners and localization remain untested.
