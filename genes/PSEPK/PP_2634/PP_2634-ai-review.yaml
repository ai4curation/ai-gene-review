  review:
    summary: Retain the inherited proposed cellulose biosynthesis annotation for the BcsQ-family structural
      accessory protein.
    action: NEW
    reason: The inherited NEW assertion is retained. Target-specific BcsQ family signatures and bcs-locus
      context link PP_2634 to characterized BcsQ. Beyond knockout necessity, the E. coli macrocomplex
      structure places BcsQ against the synthase PilZ domain, consistent with direct structural participation
      by stabilizing an active assembly. Transfer supports the biosynthetic role without asserting cellulose
      polymerase chemistry, polar localization, or ATP-driven transport for KT2440. The exact target nucleotide
      cycle and partner set remain untested.
