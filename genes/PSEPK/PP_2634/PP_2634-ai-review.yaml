core_functions:
- description: Predicted BcsQ-family structural contribution to cellulose synthase assembly or stabilization,
    inferred from target BcsQ signatures and the E. coli BcsQ-synthase interface. No specific molecular-function
    term is asserted because the target nucleotide activity and exact partner-dependent mechanism remain
    unresolved.
  directly_involved_in:
