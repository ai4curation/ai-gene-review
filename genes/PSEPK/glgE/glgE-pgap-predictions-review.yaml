- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0009313
    label: oligosaccharide catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Wrong. GlgE uses maltooligosaccharides and glucans as acceptors and
      lengthens them; it is the defining enzyme of a biosynthetic pathway that
      builds branched alpha-glucan from trehalose via maltose 1-phosphate.
      In Pseudomonas, glgE clusters with treS and glgB in that pathway.
      Breaking down oligosaccharides is the role of the catabolic GH13
      amylases and glucosidases, not of the GlgE subfamily. The term is not in
      GOA, and the accepted process, alpha-glucan biosynthetic process, is
      also on the PGAP record. None of the three InterPro-matched NCBI HMMs
      for this protein carries the catabolic term, so it enters through the
      PGAP architecture's GO mapping.
    supported_by:
    - reference_id: PMID:24689960
      supporting_text: "It is the defining enzyme of a bacterial α-glucan biosynthetic pathway"
    - reference_id: PMID:33872310
      supporting_text: "The first cluster consists of three genes, glgE, treS and glgB, that collectively code for the GlgE α-glucan biosynthetic pathway."
