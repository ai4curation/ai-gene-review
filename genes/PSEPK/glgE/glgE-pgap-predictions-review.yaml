    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Wrong, and consistent with the main review, which REMOVEs the same term
      (InterPro IEA) from GOA. GlgE belongs to the GH13 fold, but its
      reaction is an alpha-retaining maltosyl transfer from alpha-maltose
      1-phosphate onto an alpha-1,4-glucan acceptor, releasing phosphate. That
      is a transferase reaction, not hydrolysis. The term is the activity of
      the hydrolytic GH13 amylases, wrongly carried over to the GlgE
      subfamily. NCBI's PfamAutoEq model NF023324 (PF11896) maps to the same
      term, so the mapping error is not confined to the PGAP architecture.
    supported_by:
