description: >-
  NCBI PGAP names WP_049588255.1 "alpha-1,4-glucan--maltose-1-phosphate
  maltosyltransferase" from the SPARCLE CDD domain architecture 10571012
  (GlgE N-terminal domain plus a GlgE-like alpha-amylase catalytic domain) and
  passes on EC 2.4.99.16 and four GO terms. The name, the EC number,
  hexosyltransferase activity and alpha-glucan biosynthetic process are
  correct and match the main review. The other two terms come from the
  catabolic, hydrolytic majority of glycoside hydrolase family 13 and are wrong
  for GlgE. Hydrolase activity on O-glycosyl compounds is removed by the main
  review, because GlgE transfers maltosyl units from maltose 1-phosphate to
  glucan rather than hydrolysing them. Oligosaccharide catabolic process
  inverts GlgE's role: it is the polymer-elongating enzyme of the
  TreS-Pep2-GlgE-GlgB alpha-glucan biosynthetic pathway. Both errors lie on
  the architecture's GO mapping, so they reach every GlgE named by it.
