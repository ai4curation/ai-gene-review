id: Q88FM9
gene_symbol: glgE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GlgE (PP_4060) is a predicted maltosyltransferase that uses alpha-maltose
  1-phosphate to extend alpha-1,4-glucan acceptors by two glucosyl residues,
  releasing phosphate. It is the polymer-elongating enzyme of a
  trehalose-derived branched alpha-glucan biosynthetic route with TreSB and
  GlgB. Although GlgE has a GH13 fold, its net biological reaction is
  glycosyl transfer rather than hydrolysis.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The GH13 fold mapping assigns hydrolysis, but the supported GlgE reaction
      transfers maltosyl units from maltose 1-phosphate to glucan.
    action: REMOVE
    reason: >-
      The net EC 2.4.99.16/RHEA:42692 reaction is a glycosyl transfer that
      releases phosphate, not hydrolysis of an O-glycosyl compound. This is a
      fold-level InterPro overextension and should not be propagated.
    supported_by:
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "Reaction=alpha-maltose 1-phosphate + [(1->4)-alpha-D-glucosyl](n) ="
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: GlgE directly transforms carbohydrate substrates in alpha-glucan synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      This broad process is correct but adds little beyond the accepted
      alpha-glucan biosynthetic process and does not identify the reaction.
    supported_by:
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "involved in a branched alpha-glucan biosynthetic pathway"
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GlgE is a glycosyltransferase, but this term is broader than its hexosyl transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation has the correct reaction class but is redundant with the
      more informative GO:0016758 annotation.
    supported_by:
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "Maltosyltransferase that uses maltose 1-phosphate (M1P)"
- term:
    id: GO:0016758
    label: hexosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: GlgE transfers a maltosyl unit from maltose 1-phosphate to alpha-1,4-glucan.
    action: ACCEPT
    reason: >-
      The HAMAP assignment specifies EC 2.4.99.16/RHEA:42692, GlgE-specific
      InterPro signatures, and binding sites for alpha-maltose 1-phosphate.
      GO lacks a substrate-specific GlgE molecular-function term.
      GO:0016758 is the most specific available annotation, although the
      reaction transfers a maltosyl disaccharide rather than a single hexosyl
      group.
    supported_by:
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "DR   GO; GO:0016758; F:hexosyltransferase activity; IEA:UniProtKB-UniRule."
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "DR   InterPro; IPR026585; GlgE."
- term:
    id: GO:0030979
    label: alpha-glucan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: GlgE elongates alpha-1,4-glucan using maltose 1-phosphate.
    action: ACCEPT
    reason: >-
      Polymer extension is a direct alpha-glucan biosynthetic reaction. This
      does not assign GlgE the TreSB precursor-generating or GlgB branching
      reactions.
    supported_by:
    - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
      supporting_text: "the sugar donor to elongate linear or branched alpha-(1->4)-glucans."
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings: []
- id: PMID:24689960
  title: Structural insight into how Streptomyces coelicolor maltosyl transferase GlgE
    binds α-maltose 1-phosphate and forms a maltosyl-enzyme intermediate.
  findings:
  - statement: >-
      Biochemical and structural work on Streptomyces GlgE establishes the EC
      2.4.99.16 maltose 1-phosphate-dependent maltosyltransferase reaction and
      double-displacement mechanism conserved by the Pseudomonas ortholog.
    supporting_text: >-
      GlgE (EC 2.4.99.16) is an α-maltose
      1-phosphate:(1→4)-α-d-glucan 4-α-d-maltosyltransferase of the CAZy
      glycoside hydrolase 13_3 family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary enzymology for a Streptomyces GlgE ortholog; it
      establishes family chemistry but is not a direct assay of Q88FM9.
- id: file:PSEPK/glgE/glgE-uniprot.txt
  title: UniProtKB entry for glgE (Q88FM9)
  findings:
  - statement: >-
      The unreviewed HAMAP record assigns GlgE EC 2.4.99.16/RHEA:42692,
      identifies alpha-maltose 1-phosphate binding residues, and describes
      extension of alpha-1,4-glucan in the TreS/Mak/GlgE/GlgB route.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The reaction and GlgE-specific family assignment are coherent, but the
      record is computational and no KT2440-specific enzymology was found.
- id: file:PSEPK/glgE/glgE-deep-research-openscientist.md
  title: OpenScientist functional-annotation report for glgE
  findings:
  - statement: >-
      The report corroborates the maltose-1-phosphate donor, alpha-1,4-glucan
      acceptor, GH13 transfer mechanism, and TreS-Mak-GlgE-GlgB pathway
      placement while finding no direct assay of Q88FM9.
- id: file:interpro/panther/panther-members.tsv
  title: Canonical PANTHER member index
  findings:
  - statement: >-
      Q88FM9 and the experimentally characterized PAINT seed P9WQ17 are both
      verified members of PTHR47786:SF2.
    supporting_text: "Q88FM9\tPTHR47786:SF2"
- id: file:interpro/panther/PTHR47786/PTHR47786-paint.tsv
  title: PANTHER PAINT annotations for PTHR47786
  findings:
  - statement: >-
      The bacterial ancestral node PTN002233589 carries GO:0016758 with IBD
      evidence seeded by Mycobacterium tuberculosis GlgE P9WQ17.
core_functions:
- description: >-
    Transfers maltosyl units from alpha-maltose 1-phosphate to the nonreducing
    end of alpha-1,4-glucan, extending the polymer by two glucosyl residues and
    releasing phosphate.
  molecular_function:
    id: GO:0016758
    label: hexosyltransferase activity
  directly_involved_in:
  - id: GO:0030979
    label: alpha-glucan biosynthetic process
  supported_by:
  - reference_id: file:PSEPK/glgE/glgE-uniprot.txt
    supporting_text: "Reaction=alpha-maltose 1-phosphate + [(1->4)-alpha-D-glucosyl](n) ="
  - reference_id: file:PSEPK/glgE/glgE-deep-research-openscientist.md
    supporting_text: "**GlgE (Q88FM9, locus PP_4060) is \u03b1-maltose-1-phosphate:(1\u21924)-\u03b1-D-glucan 4-\u03b1-D-maltosyltransferase (GMPMT; EC 2.4.99.16), a cytoplasmic glycoside-hydrolase family 13 (GH13_3) enzyme.**"
  - reference_id: PMID:24689960
    supporting_text: >-
      It catalyzes the α-retaining transfer of maltosyl units from α-maltose
      1-phosphate to maltooligosaccharides and is predicted to use a
      double-displacement mechanism.
  knowledge_gaps:
  - gap_statement: No direct enzymatic or structural characterization of Q88FM9 was found.
    significance: >-
      The reaction assignment is strongly supported by the exact HAMAP
      reaction, conserved GlgE family architecture, and pathway context, but
      KT2440-specific kinetics and in-vivo flux remain unmeasured.
proposed_new_terms:
- proposed_name: alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase activity
  proposed_definition: >-
    Catalysis of the transfer of a maltosyl group from alpha-maltose
    1-phosphate to the nonreducing end of an alpha-1,4-glucan, extending the
    acceptor by two glucosyl residues and releasing phosphate.
  justification: >-
    The exact EC 2.4.99.16/RHEA:42692 reaction transfers a maltosyl
    disaccharide, which is not represented precisely by the existing
    hexosyltransferase term.
  proposed_parent:
    id: GO:0016757
    label: glycosyltransferase activity
