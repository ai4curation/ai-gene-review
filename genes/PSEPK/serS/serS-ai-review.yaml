id: Q88FT2
gene_symbol: serS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  SerS is the cytoplasmic class II seryl-tRNA synthetase of Pseudomonas putida
  KT2440. It uses ATP to esterify L-serine onto tRNA(Ser) for translation and
  also charges the specialized tRNA(Sec), generating Ser-tRNA(Sec), the
  immediate substrate for SelA in the bacterial selenocysteinyl-tRNA(Sec)
  biosynthetic route.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: SerS binds ATP rather than an unspecified nucleotide during aminoacylation.
    action: MODIFY
    reason: >-
      The reviewed UniProt entry identifies ATP as the nucleotide substrate and
      annotates multiple ATP-contacting residues. GO:0005524 is therefore more
      informative than the generic nucleotide-binding parent.
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "Reaction=tRNA(Ser) + L-serine + ATP"
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The generic ligase call is correct but can be replaced by the substrate-specific activity.
    action: MODIFY
    reason: >-
      UniProt and the PANTHER subfamily both identify this protein specifically
      as serine--tRNA ligase, so GO:0004828 captures the known amino-acid
      specificity without retaining the broad parent.
    proposed_replacement_terms:
    - id: GO:0004828
      label: serine-tRNA ligase activity
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "RecName: Full=Serine--tRNA ligase"
- term:
    id: GO:0004828
    label: serine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the specific catalytic activity of SerS.
    action: ACCEPT
    reason: >-
      The reviewed entry assigns EC 6.1.1.11 and explicitly records
      aminoacylation of both tRNA(Ser) and tRNA(Sec) with L-serine.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "DE            EC=6.1.1.11"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is the activating substrate for both documented SerS aminoacylation reactions.
    action: ACCEPT
    reason: >-
      Both UniProt reaction records consume ATP and produce AMP plus
      diphosphate, and predicted ATP-binding residues are present.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "Reaction=tRNA(Sec) + L-serine + ATP"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: A cytoplasmic location is appropriate for this soluble bacterial aminoacyl-tRNA synthetase.
    action: ACCEPT
    reason: >-
      The reviewed UniProt entry explicitly assigns SerS to the cytoplasm and
      contains no secretion or membrane-topology features.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The broad translational aminoacylation process can be replaced by seryl-tRNA aminoacylation.
    action: MODIFY
    reason: >-
      SerS has defined serine and tRNA substrates. GO:0006434 preserves its
      direct role in translational tRNA charging while recording the known
      amino-acid specificity.
    proposed_replacement_terms:
    - id: GO:0006434
      label: seryl-tRNA aminoacylation
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "Catalyzes the attachment of serine to tRNA(Ser)."
- term:
    id: GO:0006434
    label: seryl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SerS directly produces Ser-tRNA(Ser) for translation.
    action: ACCEPT
    reason: >-
      The assigned reaction attaches L-serine to tRNA(Ser), which is exactly
      the process represented by this term.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "Catalyzes the attachment of serine to tRNA(Ser)."
- term:
    id: GO:0016260
    label: L-selenocysteine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: SerS supplies Ser-tRNA(Sec), the first charged-tRNA intermediate in bacterial Sec-tRNA synthesis.
    action: ACCEPT
    reason: >-
      UniProt explicitly records aminoacylation of tRNA(Sec) with serine.
      SerS therefore participates in L-selenocysteine biosynthesis, but this
      annotation does not imply that SerS synthesizes or functions as the
      downstream selenoprotein.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      supporting_text: "to aminoacylate tRNA(Sec) with serine"
