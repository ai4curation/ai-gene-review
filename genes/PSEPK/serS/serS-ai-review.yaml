id: Q88FT2
gene_symbol: serS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SerS is a cytoplasmic class II seryl-tRNA synthetase that charges tRNA(Ser) for translation
  and is predicted to charge tRNA(Sec), supplying the serine-bearing intermediate for selenocysteinyl-tRNA
  formation. It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA
  substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate serine by serS.
    action: MODIFY
    reason: The MF_00176 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Ser) + L-serine + ATP = L-seryl-tRNA(Ser) + AMP +
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Sec) + L-serine + ATP
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify serine and tRNA(Ser).
    action: MODIFY
    reason: HAMAP MF_00176 specifies both tRNA(Ser) and tRNA(Sec) reactions and a homodimer spanning the
      tRNA-binding surface. Current GO:0004828 explicitly includes the tRNA(Sec) reaction, so no extra
      MF proposal is required. GO:0004828 is the supported amino-acid-specific descendant of GO:0004812;
      the parent is biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id002
      id: GO:0004828
      label: serine-tRNA ligase activity
- term:
    id: GO:0004828
    label: serine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: serS supplies serine-charged tRNA(Ser) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_00176 specifies both tRNA(Ser) and tRNA(Sec) reactions and a homodimer spanning the
      tRNA-binding surface. Current GO:0004828 explicitly includes the tRNA(Sec) reaction, so no extra
      MF proposal is required. The independently curated MF_00176 reaction supports this specific MF;
      electronic provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to serS-catalysed serine activation.
    action: ACCEPT
    reason: The curated MF_00176 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: serS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: ACCEPT
    reason: The MF_00176 subcellular-location statement supports this native compartment as a conserved
      functional inference. No finer localization is established in the inspected record; this is the
      core cellular setting rather than a peripheral process.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: serS catalyses the charging step that supplies serine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00176 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006434
    label: seryl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The serine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006434 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain serine specificity
      in GO:0004828. This is ontology maintenance, not a rejection of the MF_00176 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0016260
    label: L-selenocysteine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: SerS supplies Ser-tRNA(Sec), the first charged intermediate in the bacterial selenocysteine
      route.
    action: ACCEPT
    reason: HAMAP MF_00176 independently assigns the tRNA(Sec) reaction and its pathway step. SerS catalyses
      formation of this intermediate itself, satisfying process participation; SelA performs the subsequent
      chemical conversion to Sec-tRNA. Exact KT2440 flux and physiological conditions remain unmeasured
      in the retrieved evidence.
    supported_by:
    - reference_id: file:PSEPK/serS/serS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Sec) + L-serine + ATP
