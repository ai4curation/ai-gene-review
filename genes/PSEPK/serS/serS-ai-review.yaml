suggested_questions:
- question: Can purified KT2440 SerS charge both native tRNA(Ser) and tRNA(Sec), and which conditions
    support flux through the downstream Sec-tRNA route?
suggested_experiments:
- hypothesis: Q88FT2 aminoacylates both KT2440 tRNA(Ser) and tRNA(Sec).
  description: Purify SerS and compare steady-state aminoacylation kinetics with the two cognate tRNA
    classes; verify Ser-tRNA products by acid-urea electrophoresis or LC-MS.
