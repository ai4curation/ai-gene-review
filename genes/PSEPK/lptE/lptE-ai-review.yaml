  review:
    summary: Proposed by orthology to E. coli lptE (same PANTHER subfamily, PTHR38098:SF1), where the LptD/LptE
      translocon moves LPS from the periplasmic bridge into the outer leaflet of the outer membrane.
    action: NEW
    reason: 'Retain the historical proposal for a contribution to the assembled LptDE translocon: LptE binds/remodels
