- term:
    id: GO:1990351
    label: transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: LptE is the lipoprotein partner of LptD in the outer-membrane LPS translocon.
    action: MODIFY
    reason: Transporter complex is correct but general. GO has no LptD/LptE subcomplex term, but the translocon
