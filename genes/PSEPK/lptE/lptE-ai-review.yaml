  label: Pseudomonas putida KT2440
description: LptE is an outer-membrane lipoprotein located within the LptD beta-barrel. It promotes LptD assembly,
  binds lipopolysaccharide, and partners with LptD in the terminal transfer and insertion of LPS into the outer
  leaflet of the Gram-negative outer membrane.
