id: Q88DN0
gene_symbol: lptE
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LptE is an outer-membrane lipoprotein located within the LptD
  beta-barrel. It promotes LptD assembly, binds lipopolysaccharide, and partners
  with LptD in the terminal transfer and insertion of LPS into the outer leaflet
  of the Gram-negative outer membrane.
existing_annotations:
- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: LptE directly binds LPS within the LptDE outer-membrane translocon.
    action: ACCEPT
    reason: LPS binding is supported by the LptE family assignment and UniProt functional description.
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Lipidated LptE is localized to the cell outer membrane.
    action: ACCEPT
    reason: This taxon-specific location matches its role as the lipoprotein plug within LptD.
- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: LptE participates with LptD in the terminal stage of LPS transport.
    action: ACCEPT
    reason: The term is a biological-process annotation and does not imply that LptE alone transports LPS.
- term:
    id: GO:0019867
    label: outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: LptE is in the outer membrane, but a Gram-negative-specific term is already present.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic outer-membrane term is redundant with cell outer membrane.
- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LptE assists LptD maturation and LPS insertion during outer-membrane assembly.
    action: ACCEPT
    reason: Both LptD assembly and translocon function directly support this process assignment.
- term:
    id: GO:1990351
    label: transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: LptE is the lipoprotein partner of LptD in the outer-membrane LPS translocon.
    action: ACCEPT
    reason: Conserved LptDE complex membership is supported by the LptE family assignment.
core_functions:
- description: Binds LPS and contributes to LptDE-mediated transfer and insertion at the outer membrane.
