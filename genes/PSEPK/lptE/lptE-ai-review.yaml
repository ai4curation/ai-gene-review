id: Q88DN0
gene_symbol: lptE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LptE is an outer-membrane lipoprotein located within the LptD beta-barrel. It promotes LptD
  assembly, binds lipopolysaccharide, and partners with LptD in the terminal transfer and insertion of
  LPS into the outer leaflet of the Gram-negative outer membrane.
existing_annotations:
- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: LptE directly binds LPS within the LptDE outer-membrane translocon.
    action: ACCEPT
    reason: LPS binding is supported by the LptE family assignment and UniProt functional description.
      Experimental support is from the E. coli orthologue lptE (same PANTHER subfamily).
    supported_by:
    - reference_id: file:PSEPK/lptE/lptE-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Binds LPS and may serve as the LPS recognition site at the outer membrane.
    - reference_id: PMID:24938785
      supporting_text: Our results establish that LptE binds LPS specifically and that this is crucial
        to LptE’s function in vivo.
    - reference_id: PMID:24938785
      supporting_text: In vitro binding experiments established that LptE binds LPS, is able to interfere
        with LPS–LPS interactions, and affects LPS’s aggregation state.
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Lipidated LptE is localized to the cell outer membrane.
    action: ACCEPT
    reason: This taxon-specific location matches its role as the lipoprotein plug within LptD. Experimental
      support is from the E. coli orthologue lptE (same PANTHER subfamily).
    supported_by:
    - reference_id: file:PSEPK/lptE/lptE-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Cell outer membrane'
    - reference_id: PMID:21257904
      supporting_text: The integral membrane β-barrel LptD and the lipoprotein LptE form an essential
        complex in the OM, which is necessary for LPS assembly.
    - reference_id: PMID:16861298
      supporting_text: Sequence characteristics ( 7 ) suggest that RlpB localizes to the OM, a prediction
        supported by the copurification of Imp with RlpB
- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: LptE participates with LptD in the terminal stage of LPS transport.
    action: ACCEPT
    reason: The term is a biological-process annotation and does not imply that LptE alone transports
      LPS. Experimental support is from the E. coli orthologue lptE (same PANTHER subfamily).
    supported_by:
    - reference_id: file:PSEPK/lptE/lptE-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Binds LPS and may serve as the LPS recognition site at the outer membrane.
    - reference_id: file:PSEPK/lptE/lptE-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: PF04390; LptE
    - reference_id: PMID:16861298
      supporting_text: These data clearly show that in the absence of Imp or RlpB de novo synthesized
        LPS does not reach the outer leaflet of the OM.
    - reference_id: PMID:16861298
      supporting_text: Because RlpB does not function simply to stabilize or target Imp, we conclude that
        both of these proteins function together in what is likely to be the last step in LPS assembly,
        localization to the outer leaflet of the OM.
