  full_text_unavailable: true
  findings:
  - statement: The E. coli lptE6 mutant and specific lptD/bamA suppressors support an LptE role during LptD
      assembly. This does not imply generic folding-chaperone activity.
    supporting_text: We show that lptE6 and both suppressor mutations affect the assembly of the LptD/E complex
- id: PMID:24938785
  title: LptE binds to and alters the physical state of LPS to catalyze its assembly at the cell surface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli LptE binds LPS and alters its aggregation state; matched in-vivo mutant
      phenotypes link this substrate interaction to the assembly function. Full cached text inspected.
  findings:
  - statement: Purified E. coli LptE binds LPS and alters its aggregation state; matched in-vivo mutant phenotypes
      link this substrate interaction to the assembly function.
    supporting_text: Our results establish that LptE binds LPS specifically and that this is crucial to LptE’s
      function in vivo.
- id: PMID:29449493
  title: Lipopolysaccharide is transported to the cell surface by a membrane-to-membrane protein bridge.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component. Full cached text inspected.
  findings:
  - statement: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component.
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
      transport to occur.
