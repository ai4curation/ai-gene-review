  label: Pseudomonas putida KT2440
description: PP_3995 is a TusB-family structural subunit of the predicted cytosolic TusBCD sulfur-relay
  complex. Together with TusC and sulfur-bearing TusD, it supports sulfur delivery for MnmA-dependent
  C2 thiolation of tRNA wobble uridine U34. Its role is inferred from specific family signatures, the
  neighboring Tus genes and the characterized enterobacterial complex.
