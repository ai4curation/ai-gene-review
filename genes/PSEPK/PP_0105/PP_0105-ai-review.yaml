id: Q88RM4
gene_symbol: PP_0105
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: PP_0105 encodes CtaG, a COX11/CtaG-family assembly factor for the aa3
  cytochrome c oxidase of Pseudomonas putida KT2440. It is a single-pass type II
  inner-membrane protein whose conserved, periplasmically exposed domain binds copper
  and delivers it to the CuB site of oxidase subunit I at a late stage of oxidase
  biogenesis. CtaG is therefore a copper metallochaperone acting on the terminal
  oxidase rather than a redox-active component of the respiratory chain itself.
existing_annotations:
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'copper ion binding: Copper binding is the defining activity of the
      COX11/CtaG family and is the step by which CtaG delivers copper to the CuB
      site of oxidase subunit I; the UniProt record for this protein states that
      role directly.'
    action: ACCEPT
    reason: This is the term-specific activity CtaG itself performs, as distinct
      from the oxidase reaction it enables. The UniProt FUNCTION line for Q88RM4
      places the protein at a terminal stage of cytochrome c oxidase synthesis,
      inserting copper B into subunit I, and the SIMILARITY line assigns it to
      the COX11/CtaG family from which the InterPro annotation (IPR007533)
      derives.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Exerts its effect at some terminal stage of cytochrome c'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC       Belongs to the COX11/CtaG family.'
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'plasma membrane: UniProt places the protein in the cell inner membrane
      as a single-pass type II membrane protein with its functional domain on the
      periplasmic side, which is where copper is handed to subunit I.'
    action: ACCEPT
    reason: The localization is mechanistically specific rather than generic.
      CtaG must reside in the same membrane as the aa3 oxidase and expose its
      copper-binding domain on the periplasmic face to metallate subunit I, and
      the UniProt SUBCELLULAR LOCATION line states that topology explicitly.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cell inner membrane'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC       {ECO:0000256|ARBA:ARBA00004382}; Single-pass type II membrane protein'
