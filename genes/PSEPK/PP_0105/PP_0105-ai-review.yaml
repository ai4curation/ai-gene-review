id: Q88RM4
gene_symbol: PP_0105
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: PP_0105 encodes CtaG, a COX11/CtaG-family assembly factor for the aa3
  cytochrome c oxidase of Pseudomonas putida KT2440. It is a single-pass type II
  inner-membrane protein whose conserved, periplasmically exposed domain binds copper
  and delivers it to the CuB site of oxidase subunit I at a late stage of oxidase
  biogenesis. CtaG is therefore a copper metallochaperone acting on the terminal
  oxidase rather than a redox-active component of the respiratory chain itself.
existing_annotations:
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'copper ion binding: Copper binding is the defining activity of the
      COX11/CtaG family and is the step by which CtaG delivers copper to the CuB
      site of oxidase subunit I; the UniProt record for this protein states that
      role directly.'
    action: ACCEPT
    reason: This is the term-specific activity CtaG itself performs, as distinct
      from the oxidase reaction it enables. The UniProt FUNCTION line for Q88RM4
      places the protein at a terminal stage of cytochrome c oxidase synthesis,
      inserting copper B into subunit I, and the SIMILARITY line assigns it to
      the COX11/CtaG family from which the InterPro annotation (IPR007533)
      derives. Copper binding is the mechanism rather than the whole activity, so
      core_functions records the delivery step itself as GO:0016531 copper
      chaperone activity, following the GO-CAM treatment of the COX11 orthologs
      in gocams/index.tsv (PomBase cox1101/cox1102 in model 67e5e74400003073,
      and Dmel Cox11 / FB:FBgn0051648 in model 68b0f0d000005090). GO:0016531 and
      GO:0008535 are also proposed as annotations below.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Exerts its effect at some terminal stage of cytochrome c'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the COX11/CtaG family.'
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'plasma membrane: UniProt places the protein in the cell inner membrane
      as a single-pass type II membrane protein with its functional domain on the
      periplasmic side, which is where copper is handed to subunit I.'
    action: ACCEPT
    reason: The localization is mechanistically specific rather than generic.
      CtaG must reside in the same membrane as the aa3 oxidase and expose its
      copper-binding domain on the periplasmic face to metallate subunit I, and
      the UniProt SUBCELLULAR LOCATION line states that topology explicitly.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cell inner membrane'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC       {ECO:0000256|ARBA:ARBA00004382}; Single-pass type II membrane protein'
- term:
    id: GO:0008535
    label: respiratory chain complex IV assembly
  evidence_type: ISS
  qualifier: involved_in
  review:
    summary: 'respiratory chain complex IV assembly: proposed process annotation.
      CtaG acts at a terminal stage of cytochrome c oxidase biogenesis, and
      GO:0008535 is defined to cover the bacterial 3-4 subunit forms of the
      complex as well as the mitochondrial one.'
    action: NEW
    reason: CtaG performs a step of the assembly process itself rather than being
      a substrate or a downstream consequence of it - it metallates the CuB site
      of subunit I, without which the complex does not mature. GOA carries no
      process term for this protein, only copper ion binding and plasma
      membrane, so the assembly role is currently unrepresented. The comparator
      check supports the term rather than contradicting it - the COX11 orthologs
      that stand in the same metallochaperone role carry the mitochondrial
      sibling GO:0033617 in the GO-CAM models (PomBase cox1101/cox1102 in model
      67e5e74400003073, Dmel Cox11 in model 68b0f0d000005090), and human COX11
      is annotated to complex IV assembly with direct experimental evidence.
      GO:0008535 is the non-mitochondrial term appropriate to a bacterium.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Exerts its effect at some terminal stage of cytochrome c'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC       oxidase synthesis, probably by being involved in the insertion of the'
- term:
    id: GO:0016531
    label: copper chaperone activity
  evidence_type: ISS
  qualifier: enables
  review:
    summary: 'copper chaperone activity: proposed molecular-function annotation.
      This is the activity CtaG performs - it does not merely bind copper, it
      delivers it to a specific acceptor site on another protein.'
    action: NEW
    reason: GOA records only GO:0005507 copper ion binding, which captures the
      mechanism but not the function. Copper chaperone activity is the term used
      for exactly this role in the COX11/CtaG orthologs (human COX11 carries it,
      and the PomBase and Dmel GO-CAM models type their COX11 nodes with it),
      and the UniProt FUNCTION line for Q88RM4 states the delivery step directly.
      Proposed rather than asserted from experiment because the evidence here is
      family-level - the CtaG assignment rests on the COX11/CtaG SIMILARITY line
      and IPR007533, with no KT2440-specific characterization published.
    supported_by:
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC       copper B into subunit I. {ECO:0000256|ARBA:ARBA00004007}.'
    - reference_id: file:PSEPK/PP_0105/PP_0105-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the COX11/CtaG family.'
