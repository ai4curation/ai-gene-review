suggested_questions:
- question: Does deletion of PP_0105 in KT2440 abolish aa3 oxidase activity
    specifically, leaving the cbb3, bo3 and CIO branches intact, as the CtaG
    assignment predicts?
- question: Which residues of the periplasmic domain of PP_0105 coordinate copper,
    and is copper transferred directly to subunit I or via an intermediate carrier?
suggested_experiments:
- description: Delete PP_0105 and assay aa3-specific oxidase activity and copper
    occupancy of the purified oxidase, testing for rescue by copper supplementation
    and by complementation with wild-type versus cysteine-substituted PP_0105.
- description: Measure copper binding stoichiometry and affinity of the recombinant
    periplasmic domain of Q88RM4 directly, and test copper transfer to purified
    apo-subunit I in vitro.
