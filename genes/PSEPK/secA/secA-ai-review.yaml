id: Q88N69
gene_symbol: secA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SecA is the cytoplasmic and peripheral-inner-membrane ATPase motor of the
  bacterial Sec pathway (EC 7.4.2.8). It receives unfolded precursors from SecB,
  engages the SecYEG channel, and couples ATP hydrolysis to stepwise protein
  translocation across the inner membrane. The protein cycles between soluble
  and membrane-associated pools, can form monomers or homodimers, and carries a
  C-terminal SEC-C motif with predicted zinc coordination.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Supporting molecular function. SecA is an ATP-dependent motor with a DEAD-box-like nucleotide-binding
      fold; the UniProt ATP-binding keyword and documented ATP-binding residues (e.g. 87, 105-109, 512)
      support this. It is a broad parent of the specific protein-exporting ATPase activity (GO:0008564)
      also annotated, so retained as non-core.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Cytoplasm is a broad parent of the more specific cytosol annotation for soluble SecA.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retaining both cytoplasm and cytosol is redundant; cytosol better identifies the soluble pool.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: SecA partitions between a soluble cytosolic pool and the cytoplasmic face of the inner membrane.
    action: ACCEPT
    reason: The specific cytosol term captures the soluble half of the approximately 50:50 distribution reported by UniProt and is retained as a core location.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Core cellular component. SecA is a peripheral inner (plasma) membrane protein on the cytoplasmic
      face, where it docks onto SecYEG to drive translocation; matches the UniProt subcellular location
      (Cell inner membrane; Peripheral membrane protein; Cytoplasmic side). Accept.
    action: ACCEPT
- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SecA serves as the receptor for the preprotein-SecB complex and targets preproteins to the
      SecYEG channel, consistent with the UniProt FUNCTION. Correct but a broader process relative to
      the specific protein transport by the Sec complex (GO:0043952); retained as non-core.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Broad parent biological process term assigned by InterPro2GO. Correct in the sense that SecA
      moves proteins to/across the membrane, but far less informative than the specific GO:0043952 (protein
      transport by the Sec complex) and GO:0065002 also annotated. Marking as over-annotated relative
      to the precise child terms.
    action: MARK_AS_OVER_ANNOTATED
- term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Core molecular function. This is the EC 7.4.2.8 ATP-driven protein translocase activity matching
      the UniProt RecName/FUNCTION and HAMAP-Rule MF_01382 (SecA), TIGR00963 (secA). SecA couples ATP
      hydrolysis to stepwise translocation of polypeptides across the membrane. Strongly supported despite
      IEA evidence.
    action: ACCEPT
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Generic membrane parent term assigned by InterPro2GO. Correct but uninformative relative
      to the specific plasma membrane (GO:0005886) annotation. Marking as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
- term:
    id: GO:0017038
    label: protein import
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: SecA drives export from the cytoplasm rather than protein import.
    action: REMOVE
    reason: >-
      The directional import term conflicts with the conserved SecA mechanism.
      SecA transfers unfolded preproteins from the cytoplasm into and across the
      inner membrane for export or membrane insertion; GO:0043952 and GO:0065002
      capture that process without reversing its direction.
- term:
    id: GO:0031522
    label: cell envelope Sec protein transport complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: part_of
  review:
    summary: Correct cellular component. SecA is part of the Sec protein translocation apparatus (SecA-SecYEG
      with SecDF-YajC and YidC) per the UniProt SUBUNIT description. Accept.
    action: ACCEPT
- term:
    id: GO:0043952
    label: protein transport by the Sec complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Core biological process. SecA is the ATPase motor of the Sec translocon that drives Sec-dependent
      protein transport; directly matches the UniProt FUNCTION and HAMAP-Rule MF_01382. Accept.
    action: ACCEPT
- term:
    id: GO:0065002
    label: intracellular protein transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Accurately describes SecA-driven translocation of polypeptides across the inner membrane;
      supported by UniRule and the UniProt FUNCTION. Accept as a supporting biological process (specific
      transmembrane transport aspect of Sec translocation).
    action: ACCEPT
