- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The auxiliary 2Fe-2S cluster is a valid mechanistic feature of BioB.
    action: ACCEPT
    reason: >-
      Core, not ancillary: the auxiliary [2Fe-2S] cluster is the immediate sulfur donor that is consumed
      during turnover, so biotin synthase activity cannot proceed without it. ECOLI/bioB treats the same
      cluster as a core function on direct evidence; this row is aligned with it rather than left non-core.
    supported_by:
    - reference_id: file:PSEPK/bioB/bioB-uniprot.txt
      record_section: ["CC:COFACTOR"]
