id: Q88R44
gene_symbol: hisH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  hisH encodes the class-I glutamine amidotransferase subunit of
  imidazole-glycerol-phosphate synthase (IGPS). HisH hydrolyzes L-glutamine and
  channels the resulting ammonia to the HisF cyclase subunit, which converts
  PRFAR to imidazole-glycerol phosphate and AICAR. The coupled HisF-HisH reaction
  is the fifth step of L-histidine biosynthesis.
existing_annotations:
- term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: HisH is an obligate component of the fifth histidine-biosynthesis reaction.
    action: ACCEPT
    reason: >-
      UniProt, UniPathway, and HisH-specific family assignments place the
      HisF-HisH IGPS reaction at step 5 of 9 in L-histidine biosynthesis.
    supported_by:
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Amino-acid biosynthesis; L-histidine biosynthesis; L-histidine
        from 5-phospho-alpha-D-ribose 1-diphosphate: step 5/9.
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'HAMAP; MF_00278; HisH; 1.'
- term:
    id: GO:0000107
    label: imidazoleglycerol-phosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: HisH contributes the ammonia-generating subunit of IGPS activity.
    action: ACCEPT
    reason: >-
      GO:0000107 and RHEA:24793 describe the coupled HisF-HisH reaction. HisH
      supplies channelled ammonia while HisF performs the cyclization chemistry.
      Support is the HAMAP-rule (MF_00278) FUNCTION and SUBUNIT text plus HisH
      family membership (NCBIfam TIGR01855, InterPro IPR010139); it describes
      the HisH-HisF heterodimer, so the IGPS activity is a complex-level
      activity to which HisH contributes the glutaminase half-reaction. No
      KT2440 assay is cached.
    supported_by:
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: IGPS catalyzes the conversion of PRFAR and glutamine to IGP, AICAR and glutamate.
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The HisH subunit catalyzes the hydrolysis of glutamine to glutamate and ammonia as part of the synthesis of IGP and AICAR.
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01855; IMP_synth_hisH; 1."
- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: HisH catalyzes glutamine hydrolysis as its subunit-level activity.
    action: ACCEPT
    reason: >-
      The reviewed UniProt entry assigns EC 3.5.1.2 and RHEA:15889 and describes
      glutamine hydrolysis as the source of ammonia channelled to HisF.
    supported_by:
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        The HisH subunit catalyzes the hydrolysis of glutamine to glutamate and
        ammonia as part of the synthesis of IGP and AICAR.
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=L-glutamine + H2O = L-glutamate + NH4(+); Xref=Rhea:RHEA:15889
    - reference_id: file:PSEPK/hisH/hisH-deep-research-openscientist.md
      supporting_text: >-
        catalyzes the hydrolysis of L-glutamine to L-glutamate plus ammonia (EC
        3.5.1.2)
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: HisH is a soluble cytoplasmic biosynthetic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      The HAMAP MF_00278 rule places the protein in the cytoplasm, and no
      signal peptide or transmembrane segment is annotated. The location is
      correct but contextual rather than the core biochemical role.
    supported_by:
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0016763
    label: pentosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      True only as an ontology ancestor of the accepted IGPS activity; HisH
      itself performs no pentosyl-group transfer.
    action: TOO_GENERAL
    reason: >-
      This InterPro2GO (GO_REF:0000002) row is entailed by the accepted
      GO:0000107 imidazoleglycerol-phosphate synthase activity, which GO
      classifies is_a GO:0016763 pentosyltransferase activity. Because the
      review accepts GO:0000107 for the HisF-HisH complex activity, the broad
      ancestor cannot be removed without contradiction; it is uninformative
      rather than false at the level of the complex. The HisH subunit's own
      chemistry is glutamine hydrolysis (EC 3.5.1.2), with the ammonia
      channelled to HisF, so the term adds nothing about what HisH does.
    supported_by:
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        IGPS catalyzes the conversion of PRFAR and glutamine to IGP, AICAR and
        glutamate.
    - reference_id: file:PSEPK/hisH/hisH-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR010139; Imidazole-glycPsynth_HisH.'
