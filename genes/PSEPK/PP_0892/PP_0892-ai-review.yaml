core_functions:
  - description: >-
      ClsB-like PLD-family phosphatidyltransferase with unresolved physiological substrate specificity.
    molecular_function:
      id: GO:0030572
      label: phosphatidyltransferase activity
    supported_by:
      - reference_id: file:PSEPK/PP_0892/PP_0892-uniprot.txt
        supporting_text: PTHR21248:SF23; CARDIOLIPIN SYNTHASE B
proposed_new_terms: []
suggested_questions:
  - question: Does PP_0892 synthesize cardiolipin in vivo or act on a different phospholipid substrate?
suggested_experiments:
  - description: >-
      Assay purified PP_0892 against PG, PE, and other phospholipids, and perform deletion/complementation lipidomics in clsA/clsB-deficient backgrounds.
