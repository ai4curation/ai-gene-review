id: Q88PF8
gene_symbol: PP_0892
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0892 encodes a membrane-associated phospholipase D-family protein with a ClsB-like family assignment and two PLD-like regions. Its physiological phospholipid substrate and contribution to cardiolipin synthesis are not experimentally established.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Generic catalytic activity is too broad for this PLD-family protein.
      action: MODIFY
      reason: >-
        Use phosphatidyltransferase activity as the cautious function supported
        by the PLD-family architecture while substrate specificity remains unresolved.
      supported_by:
        - reference_id: file:PSEPK/PP_0892/PP_0892-goa.tsv
          supporting_text: "GO:0003824\tcatalytic activity"
      proposed_replacement_terms:
        - id: GO:0030572
          label: phosphatidyltransferase activity
  - term:
      id: GO:0008808
      label: cardiolipin synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Exact cardiolipin synthase activity remains unresolved for PP_0892.
      action: UNDECIDED
      reason: >-
        TreeGrafter and PANTHER place PP_0892 in a ClsB-like node, but the
        current UniProt record remains generic and supplies no reaction or
        experimental substrate evidence.
      supported_by:
        - reference_id: file:PSEPK/PP_0892/PP_0892-goa.tsv
          supporting_text: "GO:0008808\tcardiolipin synthase activity"
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Accept membrane localization for this PLD-domain lipid enzyme candidate.
      action: ACCEPT
      reason: The PLD-family cardiolipin synthase-like assignment is consistent with a membrane enzyme.
      supported_by:
        - reference_id: file:PSEPK/PP_0892/PP_0892-uniprot.txt
          supporting_text: "PTHR21248:SF23; CARDIOLIPIN SYNTHASE B"
  - term:
      id: GO:0030572
      label: phosphatidyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Accept broad phosphatidyltransferase activity for this PLD-family protein.
      action: ACCEPT
      reason: >-
        The two PLD-like regions support phosphatidyltransferase chemistry,
        while the exact phospholipid substrates remain unresolved.
      supported_by:
        - reference_id: file:PSEPK/PP_0892/PP_0892-uniprot.txt
          supporting_text: "InterPro; IPR001736; PLipase_D/transphosphatidylase."
  - term:
      id: GO:0032049
      label: cardiolipin biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Cardiolipin biosynthesis is plausible but not established for PP_0892.
      action: UNDECIDED
      reason: >-
        The process assignment depends on the same computational ClsB-like
        inference as the unresolved exact molecular function and lacks direct
        KT2440 evidence.
      supported_by:
        - reference_id: file:PSEPK/PP_0892/PP_0892-goa.tsv
          supporting_text: "GO:0032049\tcardiolipin biosynthetic process"
