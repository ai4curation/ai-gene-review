- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports
      the homologous role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
      FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC
      or FljB) and the filament cap (FliD)'
- id: PMID:33931760
  title: Molecular structure of the intact bacterial flagellar basal body.
  findings:
  - statement: Salmonella cryo-EM resolves the proximal rod proteins; KT2440 role inferred from
      specific family signatures, not direct target structure.
    supporting_text: The proximal rod is composed of four different proteins, FliE, FlgB, FlgC
      and FlgF, while the distal rod is composed of multiple copies of just one protein, FlgG
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  findings:
  - statement: KT2440-specific motility context does not equate semisolid spreading with flagellum-dependent
      swarming.
    supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and
      is lophotrichously flagellated, having multiple flagella at one cell pole (17).
