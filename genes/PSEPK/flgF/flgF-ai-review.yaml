taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FlgF is a proximal-rod subunit of the flagellar basal body in Pseudomonas putida
  KT2440. It is inferred from its specific FlgF family assignment to assemble into the rigid
  axial structure that connects the membrane rotor to the distal rod and transmits torque toward
  the hook and filament. It is a structural protein, with no established independent catalytic
  activity.
