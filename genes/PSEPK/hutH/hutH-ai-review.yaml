id: Q88CZ7
gene_symbol: hutH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutH (PP_5032) is a soluble histidine ammonia-lyase that catalyzes the
  committed first reaction of histidine utilization, eliminating ammonium from
  L-histidine to form trans-urocanate. The predicted enzyme contains the
  autocatalytically formed MIO prosthetic group characteristic of the
  PAL/histidase family and acts in the cytoplasmic histidine-catabolic pathway.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HutH is catalytic, but this root term omits the substrate and reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0004397 captures the supported histidine ammonia-lyase reaction, so
      the root catalytic-activity annotation adds no useful information.
    supported_by:
    - reference_id: file:PSEPK/hutH/hutH-uniprot.txt
      supporting_text: "DR   GO; GO:0004397; F:histidine ammonia-lyase activity; IEA:UniProtKB-UniRule."
- term:
    id: GO:0004397
    label: histidine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      HutH eliminates ammonium from L-histidine to produce trans-urocanate.
    action: ACCEPT
    reason: >-
      The reviewed UniProt/HAMAP record assigns EC 4.3.1.3 and RHEA:21232, and
      the local PANTHER family carries an IBD assertion for this exact activity
      in bacteria.
    supported_by:
    - reference_id: file:PSEPK/hutH/hutH-uniprot.txt
      supporting_text: "Reaction=L-histidine = trans-urocanate + NH4(+)"
    - reference_id: file:interpro/panther/PTHR10362/PTHR10362-paint.tsv
      supporting_text: "PTHR10362	PTN000796665	GO:0004397	F	IBD	false"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: A cytoplasmic location is appropriate for this soluble catabolic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      The reviewed record predicts cytoplasmic localization, but location is
      secondary to the enzyme reaction and has not been measured for KT2440.
    supported_by:
    - reference_id: file:PSEPK/hutH/hutH-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: HutH performs the first committed reaction of L-histidine catabolism.
    action: ACCEPT
    reason: >-
      Formation of trans-urocanate from L-histidine is the first pathway step.
      This process annotation denotes participation and does not imply that
      HutH catalyzes later pathway reactions.
    supported_by:
    - reference_id: file:PSEPK/hutH/hutH-uniprot.txt
      supporting_text: "N-formimidoyl-L-glutamate from L-histidine: step 1/3."
- term:
    id: GO:0016841
    label: ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: HutH is an ammonia-lyase, but this parent term lacks substrate specificity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The accepted GO:0004397 annotation identifies the L-histidine substrate
      and is therefore the informative molecular function.
    supported_by:
    - reference_id: file:PSEPK/hutH/hutH-uniprot.txt
      supporting_text: "RecName: Full=Histidine ammonia-lyase"
