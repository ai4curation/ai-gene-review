taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ribH (PP_0517) of Pseudomonas putida KT2440 encodes 6,7-dimethyl-8-ribityllumazine synthase
  (lumazine synthase, RibH), which condenses 5-amino-6-(D-ribitylamino)uracil with 3,4-dihydroxy-2-butanone
  4-phosphate to form 6,7-dimethyl-8-ribityllumazine. This is the penultimate step of riboflavin biosynthesis
  and the point where the GTP and ribulose 5-phosphate branches converge. Like other type I lumazine synthases
  it is predicted to form a soluble icosahedral capsid of 60 subunits. Function is inferred from family
  membership; no KT2440 enzymology is reported.
