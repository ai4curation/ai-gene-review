    id: GO:0009349
    label: riboflavin synthase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR002180
  - InterPro:IPR036467
  review:
    summary: InterPro mapping (IPR002180 LS/RS, IPR036467) to riboflavin synthase complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO defines GO:0009349 as the flavoprotein that catalyses riboflavin formation from dimethylribityllumazine,
      i.e. the riboflavin synthase that, in Bacillus subtilis, is encapsulated in the lumazine synthase
      capsid (the heavy riboflavin synthase complex). The InterPro signatures are shared by lumazine synthase
      and riboflavin synthase domains and do not show that KT2440 RibH packages its riboflavin synthase.
      In KT2440 the riboflavin synthases (ribE, ribC) are separate proteins, and no complex has been reported.
      UniProt records only the 60-mer lumazine synthase capsid, and that subunit statement is itself a
      HAMAP MF_00178 rule transfer rather than a KT2440 observation, so even the capsid is inferred, not
      observed. The complex assignment is not refuted, but it extends a Bacillus-specific assembly to
      this protein without evidence.
    supported_by:
    - reference_id: file:PSEPK/ribH/ribH-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Forms an icosahedral capsid composed of 60 subunits, arranged'
    - reference_id: GO:0009349
      supporting_text: An flavoprotein that catalyzes the reaction the breakdown of dimethyl(ribityl)lumazine
        to form riboflavin and ribitylamino-amino-dihydroxypyrimidine.
