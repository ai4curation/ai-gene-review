core_functions:
- description: >-
    Chain elongation of farnesyl diphosphate with isopentenyl diphosphate to the
    long-chain all-trans-polyprenyl diphosphate (expected C45, nonaprenyl) that
    forms the ubiquinone side chain, inferred from one-to-one orthology with E.
    coli IspB.
  molecular_function:
    id: GO:0120531
    label: prenyl diphosphate synthase activity
  directly_involved_in:
  - id: GO:0006744
    label: ubiquinone biosynthetic process
  supported_by:
  - reference_id: file:PSEPK/ispB/ispB-bioinformatics/RESULTS.md
    supporting_text: >-
      That fits a one-to-one orthologue of the homodimeric bacterial quinone
      side-chain synthase.
  - reference_id: PMID:11825609
    supporting_text: >-
      Octaprenyl pyrophosphate synthase (OPPs) catalyzes the sequential
      condensation of five molecules of isopentenyl pyrophosphate with farnesyl
      pyrophosphate to generate all-trans C40-octaprenyl pyrophosphate, which
      constitutes the side chain of ubiquinone.
suggested_questions:
- question: >-
    Should GO add an FPP-primed all-trans-nonaprenyl-diphosphate synthase activity
    term (bacterial Q9 tail synthases), parallel to GO:0106350 and GO:0097269?
- question: >-
    Is the major ubiquinone of P. putida KT2440 Q9, as in P. aeruginosa, and does
    its IspB make a C45 product?
suggested_experiments:
- hypothesis: P. putida IspB makes all-trans-nonaprenyl diphosphate.
  description: >-
    Measure the quinone profile of KT2440 by LC-MS, and express PP_0687 in an E.
    coli ispB depletion strain to test whether the complemented strain makes Q9
    instead of Q8; assay the purified enzyme with FPP and radiolabelled IPP and
    size the product.
