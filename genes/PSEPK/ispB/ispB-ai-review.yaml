id: Q88Q11
gene_symbol: ispB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  IspB (PP_0687) is the long-chain all-trans-polyprenyl diphosphate synthase of
  Pseudomonas putida KT2440, a trans-prenyltransferase of the FPP/GGPP synthase
  family that supplies the isoprenoid side chain of ubiquinone. It is a
  full-length one-to-one orthologue of Escherichia coli IspB (about 52%
  identical, with the aspartate-rich DDxxD motif and the E. coli chain-length
  residues Tyr38, Ala79 and Arg321 conserved), which elongates farnesyl
  diphosphate with isopentenyl diphosphate units. Pseudomonads make
  ubiquinone-9, so the expected product in P. putida is all-trans-nonaprenyl
  (C45) rather than octaprenyl (C40) diphosphate, although neither the enzyme
  nor the quinone chain length of strain KT2440 has been measured. The protein
  has not been characterised experimentally.
existing_annotations:
- term:
    id: GO:0004659
    label: prenyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027066
  - InterPro:IPR000092
  - PANTHER:PTN002279822
  review:
    summary: Combined IEA (InterPro polyprenyl synthase family, PANTHER node) for generic prenyltransferase activity.
    action: MODIFY
    reason: >-
      Correct but general. Q88Q11 is a full-length orthologue of E. coli IspB, a
      chain-elongating trans-prenyl diphosphate synthase, so prenyl diphosphate
      synthase activity (GO:0120531, an is_a child of prenyltransferase activity)
      is the most specific term the evidence supports. The octaprenyl product
      term is not used because the chain length in Pseudomonas is expected to be
      C45 (see the GO:0106350 row). This is the same refinement as for E. coli
      IspB, which goes further to GO:0106350 because its product was measured.
    proposed_replacement_terms:
    - id: GO:0120531
      label: prenyl diphosphate synthase activity
    supported_by:
    - reference_id: file:PSEPK/ispB/ispB-bioinformatics/RESULTS.md
      supporting_text: >-
        Q88Q11 is a full-length trans-prenyl diphosphate synthase that is 51.6%
        identical to E. coli IspB over its whole length, with the first
        aspartate-rich (DDxxD) motif conserved.
    - reference_id: file:PSEPK/ispB/ispB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR12001:SF69; ALL TRANS-POLYPRENYL-DIPHOSPHATE SYNTHASE PDSS1; 1.
- term:
    id: GO:0008299
    label: isoprenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000092
  - PANTHER:PTN002279822
  review:
    summary: Combined IEA from the polyprenyl synthase family.
    action: ACCEPT
    reason: >-
      A long-chain polyprenyl diphosphate is an isoprenoid, and family membership
      supports its synthesis by Q88Q11; the term holds whatever the exact chain
      length. Same call as for E. coli IspB and yeast COQ1.
    supported_by:
    - reference_id: file:PSEPK/ispB/ispB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR000092; Polyprenyl_synt.
    - reference_id: file:PSEPK/ispB/ispB-bioinformatics/RESULTS.md
      supporting_text: >-
        The alignment therefore supports "long-chain all-trans-prenyl diphosphate
        synthase" but cannot assign the octaprenyl (C40) versus nonaprenyl (C45)
        product.
- term:
    id: GO:0106350
    label: all-trans-octaprenyl-diphosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:27798
  - EC:2.5.1.90
  review:
    summary: Rhea/EC 2.5.1.90 (octaprenyl, C40) assigned by automatic annotation from the E. coli-type name.
    action: MODIFY
    reason: >-
      The C40 product is likely wrong for a pseudomonad. The major quinone of
      the related P. aeruginosa is ubiquinone-9, whose C45 tail is made by the
      orthologous IspB, and pseudomonads generally make Q9; the chain-length
      residues conserved with E. coli IspB do not by themselves set C40. The
      UniProt EC and reaction rest only on ARBA, not on any assay. GO has no
      FPP-primed all-trans-nonaprenyl-diphosphate synthase term (GO:0052923 and
      GO:0052924 are the GPP- and GGPP-primed enzymes), so the row is
      generalised to the parent prenyl diphosphate synthase activity
      (GO:0120531), which holds for either chain length.
    proposed_replacement_terms:
    - id: GO:0120531
      label: prenyl diphosphate synthase activity
    supported_by:
    - reference_id: PMID:32409583
      supporting_text: we established that UQ9 is the major quinone of Pseudomonas aeruginosa
    - reference_id: file:PSEPK/ispB/ispB-bioinformatics/RESULTS.md
      supporting_text: >-
        That conservation does not tell C40 from C45 product lengths, because
        other positions (and dimer contacts) also set chain length.
- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:11108713
  qualifier: involved_in
  review:
    summary: Proposed pathway annotation by orthology to E. coli IspB, whose mutants change the ubiquinone made.
    action: NEW
    reason: >-
      The polyprenyl diphosphate synthase catalyses a step of ubiquinone
      biosynthesis (making the tail that UbiA attaches), so it passes the
      participation test, and the comparator E. coli IspB carries the term with
      mutant evidence. Q88Q11 is its one-to-one orthologue, and KT2440 has a
      complete aerobic ubiquinone pathway. The module models this enzyme as the
      chain-length-determining part of ubiquinone biosynthesis.
    supported_by:
    - reference_id: PMID:11108713
      supporting_text: >-
        In Escherichia coli, the side chain of Q-8 is synthesized by
        octaprenyl-diphosphate synthase, which is encoded by an essential gene,
        ispB.
    - reference_id: file:PSEPK/ispB/ispB-bioinformatics/RESULTS.md
      supporting_text: >-
        That fits a one-to-one orthologue of the homodimeric bacterial quinone
        side-chain synthase.
