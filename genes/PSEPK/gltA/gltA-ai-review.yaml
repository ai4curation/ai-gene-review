taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GltA is a soluble cytoplasmic citrate synthase (EC 2.3.3.16) that condenses oxaloacetate and acetyl-CoA to citrate at the entry step of the tricarboxylic acid cycle in Pseudomonas putida KT2440. It belongs to the large bacterial, Gram-negative Type II citrate synthase class whose characterized members are hexameric and NADH-regulated, and it controls a central acetyl-CoA branch point between oxidative TCA-cycle flux and acetyl-CoA-dependent biosynthesis.
