  label: Pseudomonas putida KT2440
description: GltA is a soluble cytoplasmic citrate synthase that catalyzes condensation of oxaloacetate and acetyl-CoA to citrate at the entry step of the tricarboxylic acid cycle in Pseudomonas putida KT2440. It is a bacterial type-I citrate synthase-family enzyme and controls a central acetyl-CoA branch point between oxidative TCA-cycle flux and acetyl-CoA-dependent biosynthesis.
