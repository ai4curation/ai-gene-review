- id: file:PSEPK/gltA/gltA-deep-research-openscientist.md
  title: OpenScientist deep research report for gltA
  findings:
  - statement: The report supports GltA as the cytoplasmic citrate synthase at the acetyl-CoA entry point to the TCA cycle.
    supporting_text: Functionally, GltA operates in the **cytoplasm** and serves as the **gatekeeper of the acetyl-CoA node**
    reference_section_type: RESULTS
  - statement: The report assigns Q88FA4 to the Gram-negative Type II citrate synthase class.
    supporting_text: 'This places Q88FA4 unambiguously in the **Gram-negative "Type II"** class of citrate synthases'
    reference_section_type: RESULTS
  - statement: The report characterizes Gram-negative Type II citrate synthases as NADH-regulated hexameric enzymes.
    supporting_text: hexameric enzymes that are **allosterically inhibited by NADH**
    reference_section_type: RESULTS
  - statement: Direct Q88FA4 enzymology is absent, so kinetic and NADH-inhibition parameters remain transferred from homologs.
    supporting_text: No direct enzymology on Q88FA4 itself.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Provider-generated report; used for target interpretation and the explicit direct-assay
      caveat while the catalytic assignment remains anchored to UniProt EC, family, and organism-specific
      primary evidence. The report uses the generic citrate-synthase EC 2.3.3.1,
      whereas UniProt maps Q88FA4 to the exact EC 2.3.3.16 reaction reviewed here.
- id: PMID:34343699
  title: Model-guided dynamic control of essential metabolic nodes boosts acetyl-coenzyme A-dependent bioproduction in rewired Pseudomonas putida.
