    supporting_text: gltA, encoding citrate synthase
    reference_section_type: ABSTRACT
  - statement: CRISPRi-mediated reduction of gltA and accA expression raised acetyl-CoA in rewired P. putida.
    supporting_text: |-
      encoding subunit A of the acetyl-CoA carboxylase complex) mediated an 8-fold
      increase in the acetyl-CoA content of rewired P. putida.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly identifies gltA as the citrate synthase target in P. putida and reports the acetyl-CoA effect of dynamic CRISPRi at this node.
