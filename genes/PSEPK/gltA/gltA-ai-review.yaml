suggested_questions:
- question: Has KT2440 GltA been purified directly, and do its kinetic constants and NADH inhibition match those inferred from E. coli and Pseudomonas homologs?
suggested_experiments:
- description: Purify Q88FA4 and measure oxaloacetate and acetyl-CoA kinetic constants plus NADH inhibition to confirm the transferred NADH-regulated Type II citrate synthase parameters in the KT2440 enzyme.
