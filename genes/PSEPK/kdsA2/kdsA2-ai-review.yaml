id: Q88LX0
gene_symbol: kdsA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  KdsA2 is a cytoplasmic KDO-8-phosphate synthase paralog adjacent to the second arabinose-5-phosphate
  isomerase candidate PP_1806. It forms KDO-8-phosphate for CMP-KDO biosynthesis, but its in vivo division
  of labor with KdsA1 is unknown.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: KdsA2 is a soluble cytoplasmic enzyme; cytosol is the more specific location.
    action: MODIFY
    reason: >-
      Correct but general. KdsA2 has no membrane-anchoring feature and belongs to the KdsA subfamily whose
      PAINT root node (PTN000471837) carries cytosol, seeded by direct fractionation evidence for E. coli
      KdsA; cytosol is the part_of descendant that fits this soluble enzyme.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: file:PSEPK/kdsA2/kdsA2-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|PROSITE-ProRule:PRU01406}'
    - reference_id: file:interpro/panther/PTHR21057/PTHR21057-paint.tsv
      supporting_text: "PTHR21057\tPTN000471837\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:P0A715"
- term:
    id: GO:0008676
    label: 3-deoxy-8-phosphooctulonate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: KdsA2 condenses D-arabinose 5-phosphate with phosphoenolpyruvate to KDO 8-phosphate.
    action: ACCEPT
    reason: >-
      HAMAP MF_00056, NCBIfam TIGR01362 and the PTHR21057 family, whose every tree leaf is a KdsA-type
      enzyme and whose root carries this activity by PAINT, agree on the exact reaction.
    supported_by:
    - reference_id: file:PSEPK/kdsA2/kdsA2-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00056; KDO8P_synth; 1.
    - reference_id: file:PSEPK/kdsA2/kdsA2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=D-arabinose 5-phosphate + phosphoenolpyruvate + H2O
- term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: KDO 8-phosphate is the precursor of the KDO residues of the LPS inner core.
    action: ACCEPT
    reason: >-
      KdsA2 performs a step of the pathway that makes the KDO moiety of LPS; GO:0019294 has GO:0009103
      among its ancestors, so the row agrees with the core process. It is kept as ACCEPT rather than refined
      because lipopolysaccharide biosynthesis is itself a core process of this gene (listed in core_functions.directly_involved_in),
      not a too-general stand-in for KDO biosynthesis.
    supported_by:
    - reference_id: file:PSEPK/kdsA2/kdsA2-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00056; KDO8P_synth; 1.
    - reference_id: PMID:10734095
      supporting_text: >-
        KDO8P is the phosphorylated precursor of 3-deoxy-D-manno-octulosonate, an essential sugar of the
        lipopolysaccharide of Gram-negative bacteria
- term:
    id: GO:0019294
    label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
