taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  KdsA2 is a cytoplasmic KDO-8-phosphate synthase paralog adjacent to the second
  arabinose-5-phosphate isomerase candidate PP_1806. It forms KDO-8-phosphate
  for CMP-KDO biosynthesis, but its in vivo division of labor with KdsA1 is unknown.
