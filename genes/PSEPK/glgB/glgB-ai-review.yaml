- id: PMID:20305657
  title: Self-poisoning of Mycobacterium tuberculosis by targeting GlgE in an alpha-glucan
    pathway.
  findings:
  - statement: >-
      Experimental work in Mycobacterium identifies GlgB as the fourth member
      of the conserved TreS-Mak-GlgE-GlgB alpha-glucan pathway; it supports the
      pathway boundary but is not a direct assay of Q88FN1.
    supporting_text: >-
      We describe a new pathway from trehalose to alpha-glucan in
      Mycobacterium tuberculosis comprising four enzymatic steps mediated by
      TreS, Pep2, GlgE (which has been identified as a maltosyltransferase that
      uses maltose 1-phosphate) and GlgB.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary research supporting the conserved pathway
      topology; the direct target-level branching assignment remains grounded
      in the reviewed Q88FN1 UniProt record.
- id: PMID:32267616
  title: Pseudomonas putida KT2440 is naturally endowed to withstand industrial-scale
    stress conditions.
  findings:
  - statement: >-
      KT2440 glgB is transcriptionally upregulated with glycogen-biosynthesis
      genes during acute glucose starvation, supporting a physiological role
      in dynamic carbon storage.
    supporting_text: >-
      In addition, upregulation was found for genes belonging to glycogen
      biosynthesis (glgA, glgB) and its degradation (glgX, glgP, malQ).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text KT2440 transcriptomics directly names glgB in the
      glycogen-biosynthesis response; it supports physiological context rather
      than the catalytic reaction itself.
- id: file:PSEPK/glgB/glgB-uniprot.txt
  title: UniProtKB entry for glgB (Q88FN1)
  findings:
  - statement: >-
      The reviewed HAMAP record assigns 1,4-alpha-glucan branching enzyme EC
      2.4.1.18, describes alpha-1,6 branch formation, and places GlgB in
      glycogen biosynthesis.
- id: file:PSEPK/glgB/glgB-deep-research-openscientist.md
  title: OpenScientist functional-annotation report for glgB
  findings:
  - statement: >-
      The report corroborates Q88FN1 as a GH13 GlgB branching enzyme and places
      it downstream of TreSB and GlgE, while distinguishing ortholog-derived
      mechanism from direct KT2440 evidence.
- id: file:interpro/panther/PTHR43651/PTHR43651-entries.csv
  title: PANTHER members for PTHR43651
  findings:
  - statement: >-
      Q88FN1 is assigned to PTHR43651:SF3, named
      1,4-ALPHA-GLUCAN-BRANCHING ENZYME, in the local member table.
- id: file:interpro/panther/PTHR43651/PTHR43651-paint.tsv
  title: PANTHER PAINT annotations for PTHR43651
  findings:
  - statement: >-
      PTHR43651 ancestral node PTN000040010 carries GO:0003844 with IBD
      evidence from experimentally annotated branching enzymes, including the
      PTHR43651:SF3 exemplar P9WN45.
