id: Q88FN1
gene_symbol: glgB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GlgB (PP_4058) is a soluble 1,4-alpha-glucan branching enzyme that cleaves a
  segment from an alpha-1,4-glucan chain and transfers it to the C6 hydroxyl of
  a glucan acceptor, creating an alpha-1,6 branch. It branches glycogen or the
  related alpha-glucan produced by the neighboring TreSB-GlgE route. Its net
  biological function is branch-forming glycosyl transfer, not generic
  glycoside hydrolysis.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GlgB is catalytic, but this root term omits its branch-transfer reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003844 captures the substrate class and branch-forming activity, so
      the root catalytic term is redundant.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "DR   GO; GO:0003844; F:1,4-alpha-glucan branching enzyme activity; IEA:UniProtKB-UniRule."
- term:
    id: GO:0003844
    label: 1,4-alpha-glucan branching enzyme activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GlgB transfers an alpha-1,4-glucan segment to create an alpha-1,6 branch.
    action: ACCEPT
    reason: >-
      The reviewed HAMAP record assigns EC 2.4.1.18, GlgB-specific
      InterPro/NCBIfam signatures, and conserved catalytic residues. The local
      PANTHER member table places Q88FN1 in the specifically named
      PTHR43651:SF3 branching-enzyme subfamily.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "Reaction=Transfers a segment of a (1->4)-alpha-D-glucan chain to a"
    - reference_id: file:interpro/panther/PTHR43651/PTHR43651-entries.csv
      supporting_text: "Q88FN1,\"1,4-alpha-glucan branching enzyme GlgB\""
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The InterPro mapping reflects a GH13 fold, but GlgB's net reaction
      transfers a glucan segment rather than hydrolyzing it.
    action: REMOVE
    reason: >-
      The reviewed EC 2.4.1.18 reaction is branch-forming glycosyl transfer
      without water as the acceptor. The generic hydrolase annotation is a
      fold-level overextension and conflicts with the specific reaction.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "subsequent attachment of the oligosaccharide to the alpha-1,6 position."
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is compatible with GlgB but redundant with the cytosol annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The accepted cytosol child term is the more precise of the two
      TreeGrafter locations; the parent adds no independent localization
      information.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "DR   GO; GO:0005829; C:cytosol; IEA:TreeGrafter."
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is compatible with a soluble intracellular branching enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      The location is computational but biologically appropriate and is the
      more precise of the two existing compartment annotations.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "DR   GO; GO:0005829; C:cytosol; IEA:TreeGrafter."
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GlgB directly remodels an alpha-glucan carbohydrate polymer.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is correct but much broader than glycogen/alpha-glucan
      biosynthesis and does not identify the branching reaction.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "Catalyzes the formation of the alpha-1,6-glucosidic linkages"
- term:
    id: GO:0005978
    label: glycogen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Formation of alpha-1,6 branches is a direct glycogen-biosynthetic step.
    action: ACCEPT
    reason: >-
      The reviewed HAMAP pathway annotation explicitly assigns glycogen
      biosynthesis. This denotes GlgB participation in polymer branching and
      does not attribute TreSB precursor production or GlgE elongation to
      GlgB.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "PATHWAY: Glycan biosynthesis; glycogen biosynthesis."
- term:
    id: GO:0043169
    label: cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: A GH13 domain mapping predicts cation binding, but no cation is specified.
    action: UNDECIDED
    reason: >-
      The reviewed UniProt record contains no cofactor comment or cation-binding
      feature, and the local PANTHER data add no cation annotation. Without a
      specified ion, site, or experiment, this broad InterPro-derived claim
      cannot be confirmed or confidently removed.
- term:
    id: GO:0044042
    label: glucan metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: GlgB directly remodels alpha-glucan by introducing branch points.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is correct but broad and redundant with the more informative
      glycogen biosynthetic process and branching-enzyme activity.
    supported_by:
    - reference_id: file:PSEPK/glgB/glgB-uniprot.txt
      supporting_text: "Transfers a segment of a (1->4)-alpha-D-glucan chain"
