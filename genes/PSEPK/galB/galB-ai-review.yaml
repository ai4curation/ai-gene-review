  label: Pseudomonas putida KT2440
description: GalB is a zinc-containing hydratase that converts the enol form of 4-oxalomesaconate (OMAenol/CHM)
  to 4-carboxy-4-hydroxy-2-oxoadipate (CHA) in Pseudomonas putida gallate catabolism. The protein belongs
  to the LmbE-like/MshB fold family but executes hydration rather than amide hydrolysis. Recombinant GalB
  contains one zinc per subunit and forms a homohexamer.
existing_annotations:
- term:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The C-N-bond hydrolase annotation is the wrong molecular-function aspect for GalB chemistry.
    action: REMOVE
    reason: The LmbE-like/MshB fold assignment does not establish its ancestral amide-cleaving chemistry
      on GalB. Recombinant GalB catalyzes hydration of a carbon-carbon double bond in OMAenol to CHA,
      retaining the carbon skeleton; the reported target reaction is a hydro-lyase reaction, not linear-amide
      carbon-nitrogen bond hydrolysis. The family-derived amidase assignment is therefore rejected rather
      than used to describe GalB.
    proposed_replacement_terms:
    - id: GO:0047584
      label: 4-oxalmesaconate hydratase activity
    supported_by:
    - reference_id: file:PSEPK/galB/galB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes the conversion of oxalomesaconic acid enol
    - reference_id: PMID:21219457
      supporting_text: GalB is the founding member of a new family of zinc-containing hydratases that
        converts OMAenol into 4-carboxy-4-hydroxy-2-oxoadipic acid
- term:
    id: GO:0047584
    label: 4-oxalmesaconate hydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 4-oxalmesaconate hydratase activity is the specific catalytic function of GalB.
    action: ACCEPT
    reason: Retain the experimentally characterized GalB hydratase assignment under the established EC
      4.2.1.83 term. PMID:21219457 resolves the assayed immediate substrate as OMAenol (CHM), not the
      distinct KCH substrate of LigJ. The current GO definition writes the keto OMA tautomer, whereas
      the curated RHEA:17401 reaction specifies CHM; this nomenclature discrepancy does not invalidate
      the target hydration assay or justify transferring LigJ specificity.
