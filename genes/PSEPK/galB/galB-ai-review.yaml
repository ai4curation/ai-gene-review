  title: UniProtKB reviewed entry for galB
  findings:
  - statement: UniProt identifies GalB as 4-oxalmesaconate hydratase in the gallate degradation pathway.
- id: PMID:21219457
  title: 'Unravelling the gallic acid degradation pathway in bacteria: the gal cluster from Pseudomonas
    putida'
  findings:
  - statement: The KT2440 gal cluster paper identifies GalB as a zinc-containing hydratase converting
      OMAenol to CHA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; full publisher text was read at https://onlinelibrary.wiley.com/doi/full/10.1111/j.1365-2958.2010.07448.x.
      Native growth and uptake experiments use the adapted KTGAL background, whose gal cluster differs
      from KT2440 by correction of the galT frameshift. The other gal genes are sequence-identical. Recombinant
      enzyme assays and native-growth phenotypes are distinguished; galB insertion also has downstream
      polar effects. Reproducible transport and strain excerpts with acquisition hashes are recorded in
      file:analysis/module_audits/bacterial_gallate_catabolism/review-20261107/publisher-evidence.md.
- id: file:PSEPK/galB/galB-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on galB (Q88JX8) in Pseudomonas putida KT2440
  findings:
  - statement: GalB hydrates **4-carboxy-2-hydroxymuconate (CHM)** to **4-carboxy-4-hydroxy-2-oxoadipate
      (CHA)**.
  - statement: GalB uses the **enol form CHM**, not the keto form **OMA**, even though OMA and CHM are
      in equilibrium.
  - statement: GalB belongs to a **PIG-L / GlcNAc-PI deacetylase-like / MshB-related** metallohydrolase
      family rather than the amidohydrolase-fold LigJ family.
  - statement: GalB is a **divalent-metal-dependent** hydratase.
  - statement: GalB functions in **gallate/gallic acid 4,5-cleavage** and intersects with the **protocatechuate
      4,5-cleavage** route
  - statement: GalB is a **catabolic, intracellular aromatic-degradation enzyme**, expected to act in
      the **cytosol** rather than being a transporter or secreted enzyme.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Genuine protected provider report used as a literature lead, not independent experimental
      evidence. Primary-source interpretation takes precedence, especially KTGAL versus KT2440, GalP uptake
      versus isolated channel selectivity, and GalB/LigJ substrate distinctions.
- id: file:analysis/module_audits/bacterial_gallate_catabolism/review-20261107/publisher-evidence.md
  title: Scoped publisher transport and strain evidence for PMID:21219457
  findings:
  - statement: The sequenced gal cluster differs between KTGAL and KT2440 only in the GalT-restoring cytosine
      deletion; other cluster genes provide an exact sequence bridge, without establishing native KT2440
      gallate uptake.
    supporting_text: identical to that of the wild-type strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bounded publisher Results excerpts and separate interpretation; acquisition URL, source
      lines190/229 and capture/excerpt hashes are in adjacent publisher-provenance.json. Original PMID
      cache remains abstract-only.
