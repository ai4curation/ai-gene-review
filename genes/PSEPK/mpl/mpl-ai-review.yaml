id: Q88QE7
gene_symbol: mpl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Mpl is the ATP-dependent murein peptide ligase of peptidoglycan recycling. It
  attaches the recovered L-Ala-gamma-D-Glu-meso-diaminopimelate tripeptide to
  UDP-MurNAc, allowing an intact stem peptide to re-enter cytoplasmic
  peptidoglycan precursor assembly.
