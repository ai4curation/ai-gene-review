      membrane proteins, respectively
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract verified; direct genetic evidence for the E. coli TauABC ortholog
      system, not Q88RA2 itself.
