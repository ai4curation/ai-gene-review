  title: OpenScientist gene research for PSEPK tauC
  findings:
  - statement: The report corroborates TauC as the non-catalytic membrane subunit of TauABC while
      explicitly distinguishing orthology-based inference from target-specific transport evidence.
    supporting_text: No direct structural or biochemical data
    reference_section_type: CONCLUSIONS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Provider synthesis retained as secondary context; reported sequence identity,
      hydropathy, regulation, and complex stoichiometry were not independently verified.
