description: >-
  NCBI PGAP assigns no GO terms and no EC number to WP_010951919.1 (PP_0661,
  current locus tag PP_RS03540), so there are no predictions to assess. The
  absence comes from how PGAP propagates GO, not from a judgment about the
  protein. PGAP named the protein "LysR substrate-binding domain-containing
  protein" from NF015431 (NCBI's copy of Pfam PF03466, the C-terminal
  co-inducer-binding domain), and that model carries no GO. The protein also
  matches NF012354 (NCBI's copy of Pfam PF00126, the LysR HTH domain), which
  carries GO:0003700 DNA-binding transcription factor activity and GO:0006355
  regulation of DNA-templated transcription. Because PGAP passes on GO only from
  the naming model, those terms are discarded. The companion gene review
  (PP_0661-ai-review.yaml) accepts GO:0003700 as the core molecular function and
  GO:0006355 as the core process. It also accepts GO:0043565 sequence-specific
  DNA binding. So the empty PGAP GO set is a recall failure: PGAP misses two
  well-supported core terms that its own matched HTH model would have supplied.
  It makes no precision error. The PGAP product name is accurate but less
  informative than "LysR family transcriptional regulator". Unlike the 2002
  submitter name "Transcriptional regulator AmpR" kept in UniProt, it does not
  imply an unsupported beta-lactamase role. The CDD region in the GenPept record
  (PRK11139, GcvA-like) also does not support the AmpR name.
