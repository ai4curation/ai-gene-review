- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000847
  - InterPro:IPR058163
  - PANTHER:PTN009110665
  review:
    summary: >-
      This is the core molecular function. PP_0661 has the full LysR-type
      transcriptional regulator architecture: an N-terminal HTH DNA-binding
      domain (PF00126) and a C-terminal co-inducer-binding domain (PF03466).
      This architecture defines a family of DNA-binding transcription factors.
    action: ACCEPT
    reason: >-
      Several independent signatures (InterPro IPR000847 LysR_HTH_N, IPR058163,
      IPR005119, Pfam PF00126 and PF03466, PROSITE PS50931) and the PANTHER
      PTHR30537 family placement agree that this is a LysR-type regulator. LTTRs
      are DNA-binding transcription factors with an N-terminal HTH and a
      C-terminal co-inducer-binding domain. No experiment has tested PP_0661
      itself, but family membership is enough to support this general activity
      term. The specific targets and effector are unknown.
    supported_by:
    - reference_id: PMID:19047729
      supporting_text: >-
        Members of this family have a conserved structure with an N-terminal
        DNA-binding helix-turn-helix motif and a C-terminal co-inducer-binding
        domain.
    - reference_id: file:PSEPK/PP_0661/PP_0661-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF00126; HTH_1; 1.
    - reference_id: file:PSEPK/PP_0661/PP_0661-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF03466; LysR_substrate; 1.
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009110665
  - UniRule:UR000400807
  review:
    summary: >-
      This term describes the synthesis of RNA from a DNA template by RNA
      polymerase. PP_0661 is a sequence-specific transcriptional regulator and
      is not part of the transcription machinery.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A LysR-type regulator controls whether target promoters are transcribed.
      It does not carry out transcription. GO:0006355 regulation of
      DNA-templated transcription, which is accepted here, describes its process
      role correctly. This row is a generic propagation from the "Transcription"
      keyword/UniRule mapping and PANTHER, applied to transcription factors in
      general. The same call was made for the KT2440 LysR regulator OxyR in this
      repository (genes/PSEPK/oxyR).
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028138
  - InterPro:IPR000847
  - InterPro:IPR058163
  - UniRule:UR000400807
  review:
    summary: >-
      As a LysR-type DNA-binding transcription factor, PP_0661 is expected to
      regulate transcription of its target genes.
    action: ACCEPT
    reason: >-
      This is the process role that follows from DNA-binding transcription
      factor activity. LTTRs can activate or repress their targets, and the
      targets and direction of regulation for PP_0661 are unknown. So the general
      term is as precise as the evidence allows, and positive or negative
      regulation cannot be chosen. A specific regulated pathway (for example
      beta-lactamase induction, as the "AmpR" name implies, or methionine
      metabolism, as the genomic context hints) is not supported well enough to
      propose.
    supported_by:
    - reference_id: PMID:19047729
      supporting_text: >-
        LysR-type transcriptional regulators (LTTRs)
        regulate a diverse set of genes, including those involved in virulence,
        metabolism, quorum sensing and motility.
    - reference_id: file:PSEPK/PP_0661/PP_0661-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR000847; LysR_HTH_N.
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN009110665
  review:
    summary: >-
      This is a family-level inference. Characterized LysR-type regulators bind
      specific operator sequences through their N-terminal HTH domain; AmpR,
      one such family member, has a defined binding site in the ampR-ampC
      intergenic region. PP_0661 has the same HTH domain, so sequence-specific
      DNA binding is an appropriate inference from the PANTHER family placement.
    action: ACCEPT
    reason: >-
      The TreeGrafter/PANTHER inference matches the LysR HTH domain detected by
      several signatures. Sequence-specific operator binding is how LTTRs work
      as transcription factors, and this term is more informative than generic
      DNA binding. The support is family-level only: no DNA-binding experiment
      has been done on PP_0661, and its binding site is unknown.
    supported_by:
    - reference_id: PMID:22479525
      supporting_text: >-
        there is a nearly identical putative AmpR binding site (5′ TCTGCTCCAAATTT
        3′) in the ampR-ampC intergenic region in P. aeruginosa
    - reference_id: file:PSEPK/PP_0661/PP_0661-uniprot.txt
      record_section: ["FT:DNA_BIND"]
      supporting_text: /note="H-T-H motif"
core_functions:
- description: >-
    LysR-type DNA-binding transcription factor. The N-terminal HTH domain is
    expected to bind specific operator sites, and the C-terminal
    substrate-binding domain is expected to sense an unidentified small-molecule
    co-inducer. Together these regulate transcription of target genes that are
    not yet known. Genomic context points to sulfur amino acid and threonine
    metabolism genes, and there is no support for an AmpR-type role in
    beta-lactamase regulation.
