id: Q88Q37
gene_symbol: PP_0661
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0661 is an uncharacterized LysR-type transcriptional regulator (LTTR) of
  Pseudomonas putida KT2440 (294 aa). It has an N-terminal LysR winged
  helix-turn-helix DNA-binding domain (residues 7-64, HTH motif 24-43) and a
  C-terminal LysR substrate-binding (co-inducer-binding, periplasmic binding
  protein type 2-like) domain of the GcdR/TrpI/HvrB/AmpR-like subgroup (CDD
  cd08432). Like other LTTRs it is expected to bind specific operator DNA
  sequences and to activate or repress target promoters in response to a small
  effector bound by its C-terminal domain. Neither the effector nor the target
  genes have been identified. The 2002 genome submission named it
  "Transcriptional regulator AmpR", but it is no closer to AmpR than to GcvA
  (about 40% identity to each) and is not next to the KT2440 ampC-like gene
  (PP_2876), so that name is unsupported. It lies in a co-directional cluster of
  sulfur amino acid and threonine metabolism genes (homocysteine
  S-methyltransferase, cystathionine gamma-synthase, S-methyl-L-methionine
  transporter, threonine synthase), next to an AsnC-family regulator (PP_0663).
  This position suggests, without showing, a role in regulating amino acid
  metabolism.
