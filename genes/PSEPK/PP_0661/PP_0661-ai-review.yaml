suggested_questions:
- question: >-
    Is PP_0661 a GcvA-type activator of glycine cleavage? KT2440 carries two
    gcvTHP loci (PP_0986-PP_0989 and PP_5192-PP_5194), and KEGG places four
    LysR regulators in the GcvA-like orthology group K03566 (PP_0661, PP_1393,
    PP_3143, PP_4107). Which of them, if any, activates gcvTHP, for example
    when cells are grown with glycine?
- question: >-
    Which genes does PP_0661 regulate, and what effector does its C-terminal
    domain bind? Do its targets include the neighbouring methionine and
    threonine metabolism genes (PP_0658-PP_0660, PP_0662)?
- question: >-
    Does any LysR regulator control the KT2440 class C beta-lactamase gene
    PP_2876, given that PP_0661 is not next to it? If not, is PP_2876
    expressed constitutively?
suggested_experiments:
- description: >-
    Build a clean PP_0661 deletion in KT2440 and compare its transcriptome (RNA-seq)
    with wild type during growth on methionine, S-methylmethionine, threonine or
    glycine.
    Also measure beta-lactam MICs to test the AmpR hypothesis directly.
  experiment_type: RNA-seq and antibiotic susceptibility testing
- description: >-
    Run DAP-seq or ChIP-seq with tagged PP_0661 to map its operator sites
    genome-wide, and use EMSA on the PP_0658-PP_0662 intergenic regions to test
    direct binding.
  experiment_type: DAP-seq / ChIP-seq / EMSA
