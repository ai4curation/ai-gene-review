id: Q88ND4
gene_symbol: algF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgF is a periplasmic interaction component of the alginate O-acetylation machinery.
  It binds AlgJ and AlgX and is proposed to help organize their modification complex. Purified
  KT2440 AlgF lacks detectable acetylesterase activity on the tested surrogate substrate,
  supporting a nonenzymatic assembly role. Its ortholog is required for alginate acetylation
  and contributes to efficient polymer production in Pseudomonas aeruginosa.
existing_annotations:
- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: AlgF contributes both to O-acetylation and to stable coupling with the alginate
      polymerization machinery.
    action: ACCEPT
    reason: AlgF provides interaction support to the modification/secretion machinery rather
      than catalyzing mannuronate polymerization. Direct KT2440 AlgJ/AlgX binding supports
      this structural contribution, while P. aeruginosa PDO300 deletion and stability experiments
      show coupling to efficient polymer production and Alg8. Retain the broader biosynthesis
      contribution alongside acetylation, without claiming AlgF itself is a polymerase or
      that the production phenotype has been measured in KT2440.
    supported_by:
    - reference_id: PMID:31900562
      supporting_text: only the AlgF deletion impaired alginate production
    - reference_id: PMID:31900562
      supporting_text: AlgI and AlgF stability was strongly impaired supporting a link of
        the O-acetylation machinery with alginate polymerisation.
    - reference_id: PMID:37797696
      supporting_text: We found that AlgJPp and AlgXPp bind to AlgFPp with Kd values of 86 ±
        12 μM and 178 ± 5 μM, respectively.
