    label: alginic acid acetylation
  evidence_type: ISS
  original_reference_id: PMID:12003941
  qualifier: involved_in
  review:
    summary: AlgF is required for the periplasmic alginate O-acetylation machinery.
    action: NEW
    reason: Nonpolar P. aeruginosa deletion and complementation establish the ortholog process
      role. KT2440 AlgF29–215 directly binds KT2440 AlgJ and AlgX (PMID:37797696), supporting
      active structural organization of acetylation machinery rather than mere necessity as
      a substrate. The nonenzymatic model is supported by absent surrogate acetylesterase
      activity; no acetyltransferase molecular function is assigned. Exact-term comparisons
      confirm experimental acetylation annotations on P. aeruginosa AlgI/AlgJ/AlgF and A.
      vinelandii AlgF; these are convention checks rather than evidence. AlgF has two same-role
      ortholog comparators. The term describes active protein machinery, not the polymer substrate;
      GO-CAM contains no target entry and this term is not an ancestor/descendant duplicate
      of retained biosynthesis.
    supported_by:
    - reference_id: PMID:12003941
      supporting_text: each mutant produced alginate lacking O-acetyl groups.
    - reference_id: PMID:37797696
      supporting_text: We found that AlgJPp and AlgXPp bind to AlgFPp with Kd values of 86 ±
        12 μM and 178 ± 5 μM, respectively.
