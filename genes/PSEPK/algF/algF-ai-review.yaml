id: Q88ND4
gene_symbol: algF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AlgF is a noncatalytic periplasmic component of the AlgI-AlgJ-AlgF alginate
  O-acetylation complex. It is required for O-acetylation and also couples the
  modification machinery to the Alg8-containing polymerization and secretion
  complex, with AlgF loss impairing alginate production in Pseudomonas.
existing_annotations:
- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: AlgF contributes both to O-acetylation and to stable coupling with the alginate polymerization machinery.
    action: ACCEPT
    reason: >-
      GO:0051979 is not an ontology descendant of GO:0042121, so replacing this
      row would lose the broader biosynthesis role. The AlgF-specific deletion
      impairs alginate production, and AlgF stability is coupled to Alg8,
      supporting retention of the parent process while acetylation is added as
      a separate exact annotation.
    supported_by:
    - reference_id: PMID:31900562
      supporting_text: only the AlgF deletion impaired alginate production
    - reference_id: PMID:31900562
      supporting_text: AlgI and AlgF stability was strongly impaired supporting a link of the O-acetylation machinery with alginate polymerisation.
- term:
    id: GO:0051979
    label: alginic acid acetylation
  evidence_type: ISS
  original_reference_id: PMID:12003941
  qualifier: involved_in
  review:
    summary: AlgF is required for the periplasmic alginate O-acetylation machinery.
    action: NEW
    reason: >-
      Nonpolar deletion and complementation establish the role of the
      P. aeruginosa ortholog, while Q88ND4 retains the exact AlgF family and
      syntenic position in the KT2440 alginate operon.
    supported_by:
    - reference_id: PMID:12003941
      supporting_text: each mutant produced alginate lacking O-acetyl groups.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: The periplasmic-space annotation is correct for AlgF.
    action: ACCEPT
    reason: AlgF acts as a periplasmic component of the alginate modification machinery, so this location is part of its core biological role.
    supported_by:
    - reference_id: file:PSEPK/algF/algF-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
    - reference_id: file:PSEPK/algF/algF-goa.tsv
      supporting_text: "GO:0042597\tperiplasmic space"
    - reference_id: file:PSEPK/algF/algF-deep-research-falcon.md
      supporting_text: |-
        The same pathway model describes **AlgF as a periplasmic protein**, with AlgI and AlgJ being membrane-associated components
    - reference_id: file:PSEPK/algF/algF-deep-research-falcon.md
      supporting_text: |-
        Acetylation and epimerization steps take place in the periplasm under the concerted action of AlgI, AlgJ and AlgF for O-acetylation
