- id: file:PSEPK/algF/algF-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for algF (Q88ND4, PP_1278) in Pseudomonas
    putida KT2440
  findings:
  - statement: 'Falcon confirms gene identity and operon context: a KT2440 transcriptomics
      study places PP_1278/algF in the AlgD alginate biosynthesis operon and annotates it
      as an alginate O-acetylation gene, matching UniProt Q88ND4.'
    supporting_text: A KT2440 transcriptomics study explicitly lists **PP_1278 = algF** within
      the **AlgD operon** and annotates it as an **alginate O-acetylation gene
  - statement: Falcon describes the AlgI/AlgJ/AlgF acetylase system as performing partial
      O-acetylation of polymeric mannuronic acid residues at O-2/O-3 as a post-polymerization
      modification, supporting the alginic acid biosynthetic process annotation.
    supporting_text: an **AlgI/AlgJ/AlgF acetylase system** responsible for **partial O-acetylation
      of polymeric mannuronic acid residues**, specifically at the **O-2 and/or O-3 positions**,
      as a **post-polymerization modification** step in alginate biosynthesis
  - statement: 'Falcon corroborates the periplasmic localization: the canonical pathway model
      describes AlgF as a periplasmic protein, with AlgI/AlgJ membrane-associated and O-acetylation
      occurring at the inner membrane/periplasm.'
    supporting_text: The same pathway model describes **AlgF as a periplasmic protein**, with
      AlgI and AlgJ being membrane-associated components
  - statement: Falcon notes AlgF is not a stand-alone enzyme with a classic small-molecule
      substrate but contributes to a multi-protein machinery modifying the alginate polymer,
      cautioning against assigning a catalytic molecular function to AlgF directly.
    supporting_text: AlgF is not described as a stand-alone cytosolic enzyme with a classic
      small-molecule substrate
  - statement: Falcon cites a 2023 review reaffirming that acetylation steps take place in
      the periplasm under the concerted action of AlgI, AlgJ and AlgF.
    supporting_text: Acetylation and epimerization steps take place in the periplasm under
      the concerted action of AlgI, AlgJ and AlgF for O-acetylation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Checked as contextual source; functional conclusions rely on the primary
      evidence and curated target classifications described in this review.
