- id: PMID:37797696
  title: Pseudomonas aeruginosa AlgF is a protein-protein interaction mediator required for
    acetylation of the alginate exopolysaccharide.
  findings:
  - statement: KT2440 AlgF29–215 directly binds KT2440 AlgJ75–370 and AlgX by ITC.
    supporting_text: We found that AlgJPp and AlgXPp bind to AlgFPp with Kd values of 86 ±
      12 μM and 178 ± 5 μM, respectively.
  - statement: KT2440 AlgF showed no detectable acetylesterase activity on ACC, alone or in
      the tested protein combinations.
    supporting_text: No acetylesterase activity was observed for AlgFPp
  - statement: The NMR structure and absence of binding to ManA4–ManA12 were determined for
      P. aeruginosa AlgF, not directly for KT2440 AlgF.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods, Results and figures checked. Methods explicitly name P. putida
      KT2440, with Q88ND4 listed among the target sequences. The Results mix AlgFPp30–215
      and AlgFPp29–215 numbering and contain a P. aeruginosa/AlgFPp typo; Methods and figure3
      identify the KT2440 construct. Binary ITC binding is direct; simultaneous bridging of
      AlgJ and AlgX remains an assembly model.
