description: ccoN-I encodes the cbb3-type cytochrome c oxidase catalytic CcoN 
  subunit in the first paralogous complex in Pseudomonas putida KT2440. The 
  protein acts in a plasma-membrane terminal oxidase branch that reduces oxygen 
  to water and supports aerobic respiratory energy conservation. Its 
  subunit-specific role is distinguished from the emergent catalytic activity of
  the assembled oxidase complex.
