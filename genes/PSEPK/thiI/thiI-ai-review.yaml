    summary: tRNA binding is true of ThiI (THUMP and ferredoxin-like domains bind the tRNA acceptor arm) but is part of acting on its substrate rather than a separate function.
    action: KEEP_AS_NON_CORE
    reason: >-
      KT2440 ThiI carries the THUMP domain (residues 63-167) and the ThiI
      ferredoxin-like N-terminal domain, which in the E. coli and B. anthracis ThiI
      structures form the acceptor-stem binding module. Binding tRNA is a genuine
      activity but subsidiary to the tRNA-uracil-4 sulfurtransferase activity;
