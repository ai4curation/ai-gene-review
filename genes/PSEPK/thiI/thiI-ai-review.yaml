      record_section: ["CC:FUNCTION"]
      supporting_text: produce 4-thiouridine in position 8 of tRNAs
    - reference_id: PMID:15037613
      supporting_text: ThiI, which utilizes Mg-ATP to activate uridine 8 in tRNA and transfers sulfur to give s4U
