- term:
    id: GO:0002937
    label: tRNA 4-thiouridine biosynthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The core biological process of ThiI, demonstrated in KT2440 by loss of tRNA s4U in a thiI deletion strain.
    action: ACCEPT
    reason: >-
      ThiI performs the final sulfur-transfer step of s4U8 synthesis. In KT2440, mass
      spectrometry of bulk tRNA showed that s4U is drastically reduced in a delta-thiI
      strain (Fuchs et al. 2023, PMID:37891428), and the mechanism (IscS persulfide
      to ThiI, ATP-dependent activation of U8) is established for the E. coli
      ortholog. The TreeGrafter row is therefore supported by target-specific
      genetic evidence.
    supported_by:
    - reference_id: PMID:37891428
      supporting_text: As expected, the content of 4-thiouridine in bulk tRNA was drastically reduced in the ΔthiI knockout strain (negative control).
