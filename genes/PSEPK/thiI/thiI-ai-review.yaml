id: Q88CY4
gene_symbol: thiI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  thiI (PP_5045) encodes ThiI, a cytosolic, ATP-dependent tRNA sulfurtransferase
  (tRNA 4-thiouridine synthase, EC 2.8.1.4) of 484 residues. Its N-terminal
  ferredoxin-like and THUMP domains bind the tRNA acceptor arm, its central PP-loop
  (AANH) pyrophosphatase domain adenylates uridine 8, and its C-terminal rhodanese
  domain carries the active-site Cys457 persulfide that receives sulfane sulfur from
  the cysteine desulfurase IscS and transfers it to the activated uridine, producing
  4-thiouridine (s4U8), the near-UV photosensor of tRNA. Deletion of thiI in KT2440
  drastically reduces s4U in bulk tRNA. Like E. coli and Salmonella ThiI, which share
  its rhodanese domain, KT2440 ThiI is expected also to sulfurate the C-terminus of
  the sulfur carrier ThiS, forming the ThiS thiocarboxylate that donates sulfur to
  the thiazole moiety of thiamine; this second role is inferred from those
  orthologs and has not been tested in KT2440.
