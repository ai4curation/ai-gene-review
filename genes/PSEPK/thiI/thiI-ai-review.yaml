- term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Plausible for a rhodanese-containing ThiI, but it is the pathway endpoint rather than ThiI's step, and the role is inferred from orthologs.
    action: KEEP_AS_NON_CORE
    reason: >-
      The UniRule/UniPathway rule assumes the E. coli-type bifunctional ThiI. Unlike
      B. subtilis ThiI (for which this row is removed), KT2440 ThiI keeps the
      C-terminal rhodanese domain (405-483, IPR026340 / TIGR04271 thiazole
      biosynthesis domain), which in Salmonella is necessary and sufficient for
      thiazole synthesis, and KT2440 encodes the thiazole pathway (ThiS PP_5105, ThiG, ThiO).
      The step ThiI performs is sulfuration of ThiS, captured by GO:0052837 thiazole
      biosynthetic process; thiamine diphosphate formation is the pathway endpoint.
      Kept as non-core, matching the E. coli ThiI review.
    supported_by:
