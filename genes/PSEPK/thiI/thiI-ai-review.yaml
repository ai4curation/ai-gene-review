  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Wrong activity from a mis-mapped InterPro entry; ThiI does not add CCA to tRNA.
    action: REMOVE
    reason: >-
      The row comes from InterPro2GO on IPR020536 (ThiI AANH domain), the PP-loop
      pyrophosphatase domain that adenylates U8 as the first half of 4-thiouridine
