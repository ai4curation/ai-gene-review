- proposed_name: ThiS sulfur-carrier protein sulfurtransferase activity
  proposed_definition: >-
    Catalysis of the reaction: [ThiS sulfur-carrier protein]-C-terminal Gly-Gly-AMP +
    S-sulfanyl-L-cysteinyl-[cysteine desulfurase] + AH2 = [ThiS sulfur-carrier
