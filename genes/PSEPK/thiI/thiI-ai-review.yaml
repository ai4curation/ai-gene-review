suggested_questions:
- question: Does KT2440 ThiI sulfurate ThiS in vivo, and is it the only source of ThiS thiocarboxylate for thiazole synthesis in this organism?
- question: Which cysteine desulfurase is the in vivo sulfur donor for ThiI in P. putida KT2440? The IscS persulfide relay is inferred from E. coli and has not been reconstituted for this organism.
suggested_experiments:
- description: Score thiamine auxotrophy and ThiS thiocarboxylate (by mass spectrometry) in a KT2440 delta-thiI strain, and test separation-of-function alleles (PP-loop versus rhodanese Cys457) for s4U and thiazole formation.
  experiment_type: mutant analysis
- description: In vitro reconstitution of KT2440 ThiI with IscS, tRNA and ThiS-AMP to confirm the persulfide donor and both sulfur-transfer reactions.
  experiment_type: biochemical reconstitution
