taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Small membrane accessory subunit of the KdpFABC high-affinity potassium pump.
  KdpC participates in a transient nucleotide-dependent interaction with KdpB
  that can increase pump ATP-binding affinity, but KdpB remains the
  ATP-hydrolyzing subunit and KdpA provides potassium selectivity.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      Direct work on Escherichia coli KdpC reports ATP binding in the transient
      KdpB/KdpC/ATP catalytic-chaperone context. This supports the family-based
      annotation, although the broad binding term is not KdpC's defining role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain conservatively because the E. coli ortholog directly binds ATP and
      the conserved KdpC family assignment supports transfer to PSEPK. Keep it
      non-core because the interaction is complex-contextual and KdpC does not
      hydrolyze ATP.
