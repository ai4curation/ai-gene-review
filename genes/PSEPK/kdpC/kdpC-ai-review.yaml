core_functions:
- description: Accessory KdpFABC subunit whose predicted periplasmic domain contacts KdpA and
    supports the transporter assembly, inferred from E. coli structures and target KdpC
    classification. It contributes to potassium pumping without independently catalyzing ATP
    hydrolysis; the exact accessory mechanism remains incompletely resolved.
