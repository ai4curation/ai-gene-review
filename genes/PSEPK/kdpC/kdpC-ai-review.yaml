id: Q88FD8
gene_symbol: kdpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Small membrane accessory subunit of the KdpFABC high-affinity potassium pump.
  KdpC contributes to pump assembly and regulation but is not the ATP-hydrolyzing
  or potassium-selective catalytic subunit.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      KdpC modulates ATP binding by KdpB as a catalytic chaperone, but the
      available record does not establish ATP binding by KdpC itself.
    action: REMOVE
    reason: >-
      The UniProt record assigns ATP binding and hydrolysis to KdpB and states
      that KdpC increases KdpB ATP-binding affinity; formation of a ternary
      KdpB/KdpC/ATP complex does not justify an enables ATP binding annotation
      on KdpC.
    supported_by:
    - reference_id: file:PSEPK/kdpC/kdpC-uniprot.txt
      supporting_text: acts as a catalytic chaperone that increases the ATP-binding affinity
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for the integral KdpC accessory subunit.
    action: ACCEPT
- term:
    id: GO:0006813
    label: potassium ion transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct process at the KdpFABC complex level.
    action: ACCEPT
- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      KdpC contributes as an accessory subunit to the collective KdpFABC pump
      activity but does not possess the complete transporter activity alone.
    action: MODIFY
    reason: >-
      Retain GO:0008556 with the qualifier contributes_to; enables incorrectly
      assigns the heteromeric pump activity to KdpC independently.
    proposed_replacement_terms:
    - id: GO:0008556
      label: P-type potassium transmembrane transporter activity
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Correct but less precise than plasma membrane.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0071805
    label: potassium ion transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct collective transport process of the complex containing KdpC.
    action: ACCEPT
