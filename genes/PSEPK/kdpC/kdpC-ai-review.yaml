  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      KdpC contributes as an accessory subunit to the collective KdpFABC pump
      activity but does not possess the complete transporter activity alone.
    action: ACCEPT
    reason: >-
      The term is correct in substance. The qualifier should ideally be
      contributes_to rather than enables because KdpC is an accessory subunit;
      this relationship is captured in core_functions.
