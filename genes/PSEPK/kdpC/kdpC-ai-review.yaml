id: Q88FD8
gene_symbol: kdpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpC (Q88FD8) is the small single-pass accessory subunit of the KdpFABC high-affinity ATP-driven
  potassium uptake pump of the Pseudomonas putida inner membrane. By orthology with the structurally characterized
  Escherichia coli complex, KdpC carries a periplasmic soluble domain that packs against the K+-selective
  subunit KdpA and, together with KdpF, stabilizes the KdpA-KdpB assembly; it neither hydrolyzes ATP (a
  KdpB function) nor forms the K+ pathway (a KdpA function). An earlier biochemical model in E. coli proposed
  that KdpC binds ATP and acts as a catalytic chaperone for KdpB, but the periplasmic location of its
  soluble domain in the structures makes that role uncertain.
