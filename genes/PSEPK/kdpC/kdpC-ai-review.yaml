gene_symbol: kdpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpC (PP_4159) is a single-pass accessory subunit of the Pseudomonas putida KT2440
  high-affinity KdpFABC potassium pump. Its KdpC-family architecture supports a periplasmic domain
  contacting KdpA and a structural contribution to the assembled transporter, inferred from
  Escherichia coli structures. KdpA selects potassium and delivers it to KdpB, which drives ion
  transfer and cytoplasmic release through its ATPase cycle.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The physiological ATP-binding claim is unresolved for KT2440 KdpC.
    action: UNDECIDED
    reason: The full E. coli PMID:21711450 study reports photoaffinity-labeling and ATP-dependent
      isolated-domain interaction, but direct ITC did not detect ATP binding to isolated KdpC up to
      2.8 mM ATP. These observations are retained rather than treated as a negative across all
      conditions. Later intact-complex structures place its soluble domain in the periplasm,
      challenging the proposed cytoplasmic catalytic-chaperone mechanism without disproving all
      binding. No KT2440 assay resolves this transfer; topology and another subunit binding ATP are
      insufficient grounds to dismiss the original biochemical observations.
    supported_by:
    - reference_id: PMID:21711450
      supporting_text: both ATP binding to KdpC and ATP hydrolysis activity of KdpFABC were
        sensitive to the
    - reference_id: PMID:28636601
      supporting_text: KdpC has a single transmembrane helix (cM1), but the topology is inverted
        relative to previous models (Extended Data Fig. 1d). This topology puts the soluble domain,
        which appears to have a novel fold, on the periplasmic side of the membrane.
    - reference_id:
        file:analysis/module_audits/bacterial_kdp_potassium_homeostasis/psepk-consultation/primary-scope.md
      supporting_text: could therefore not be shown, at least for the ATP concentrations applicable
