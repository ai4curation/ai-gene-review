  review:
    summary: KdpC contributes structurally to the ATP-driven potassium pump.
    action: ACCEPT
    reason: The target HAMAP KdpC assignment and operon context support a conserved accessory role
      in KdpFABC. E. coli structures place KdpC against KdpA and support stabilization of the
      transporter architecture. That contribution is compatible with the pump activity even though
      ATP hydrolysis occurs in KdpB; the core records contributes_to. The judgment concerns the
      biological contribution, not the inherited relationship string.
    supported_by:
