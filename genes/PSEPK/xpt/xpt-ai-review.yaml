id: Q88CB6
gene_symbol: xpt
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Xpt (PP_5265) is a xanthine phosphoribosyltransferase that salvages xanthine
  from nucleic-acid breakdown by transferring a phosphoribosyl group from PRPP
  to form XMP and diphosphate. The reviewed UniProt entry assigns EC 2.4.2.22,
  Rhea reaction 10800, HAMAP rule MF_01184, and the Xpt-specific
  PTHR43864:SF1 subfamily. The KT2440 enzyme has not been directly
  characterized biochemically.
existing_annotations:
  - term:
      id: GO:0000310
      label: xanthine phosphoribosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Xpt catalyzes the substrate-specific xanthine-to-XMP salvage reaction.
      action: ACCEPT
      reason: >-
        The reviewed UniProt entry, EC 2.4.2.22, Rhea 10800, HAMAP MF_01184,
        and the Xpt-specific PANTHER subfamily support this exact function.
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-uniprot.txt
          supporting_text: Converts the preformed base xanthine
        - reference_id: file:PSEPK/xpt/xpt-goa.tsv
          supporting_text: "GO:0000310\txanthine phosphoribosyltransferase activity"
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is plausible but is not a core function.
      action: KEEP_AS_NON_CORE
      reason: >-
        HAMAP predicts a soluble cytoplasmic enzyme. The location is useful
        context but has not been measured directly in KT2440.
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-uniprot.txt
          supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
  - term:
      id: GO:0016763
      label: pentosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This broad parent should be replaced by the exact Xpt activity.
      action: MODIFY
      reason: >-
        GO:0000310 captures Xpt's substrate and reaction class, whereas the
        InterPro-derived pentosyltransferase term adds no useful specificity.
      proposed_replacement_terms:
        - id: GO:0000310
          label: xanthine phosphoribosyltransferase activity
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-goa.tsv
          supporting_text: "GO:0016763\tpentosyltransferase activity"
  - term:
      id: GO:0032265
      label: XMP salvage
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Xpt directly executes the one-step salvage of xanthine to XMP.
      action: ACCEPT
      reason: >-
        UniProt explicitly places Xpt in XMP biosynthesis from xanthine via the
        salvage pathway.
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-uniprot.txt
          supporting_text: XMP biosynthesis via salvage pathway
        - reference_id: file:PSEPK/xpt/xpt-goa.tsv
          supporting_text: "GO:0032265\tXMP salvage"
  - term:
      id: GO:0043101
      label: purine-containing compound salvage
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This broad salvage process is correct but less informative than XMP salvage.
      action: ACCEPT
      reason: >-
        Xanthine is a purine-containing compound and this is the same central
        salvage role, although GO:0032265 is more informative.
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-goa.tsv
          supporting_text: "GO:0043101\tpurine-containing compound salvage"
  - term:
      id: GO:0046110
      label: xanthine metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Xpt metabolizes xanthine, but the term does not specify salvage.
      action: ACCEPT
      reason: >-
        This process is valid for Xpt's central substrate conversion; XMP
        salvage is more informative and distinguishes degradation.
      supported_by:
        - reference_id: file:PSEPK/xpt/xpt-goa.tsv
          supporting_text: "GO:0046110\txanthine metabolic process"
