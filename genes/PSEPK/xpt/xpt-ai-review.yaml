        supporting_text: Its primary and essentially sole catalytic function
core_functions:
  - description: >-
      Transfers a phosphoribosyl group from PRPP to xanthine, producing XMP and
      diphosphate in the xanthine-salvage branch of purine metabolism.
    molecular_function:
      id: GO:0000310
      label: xanthine phosphoribosyltransferase activity
    directly_involved_in:
      - id: GO:0032265
        label: XMP salvage
    supported_by:
      - reference_id: file:PSEPK/xpt/xpt-uniprot.txt
        supporting_text: Converts the preformed base xanthine
      - reference_id: file:PSEPK/xpt/xpt-uniprot.txt
        supporting_text: XMP biosynthesis via salvage pathway
      - reference_id: file:PSEPK/xpt/xpt-deep-research-openscientist.md
        supporting_text: Its primary and essentially sole catalytic function
proposed_new_terms: []
suggested_questions:
  - question: >-
      Under which nutrient conditions does Xpt compete with xanthine oxidation
      and route xanthine back into nucleotide synthesis in KT2440?
suggested_experiments:
  - description: >-
      Measure xanthine-dependent XMP formation by purified Xpt and use labeled
      xanthine to compare salvage flux in wild type and an xpt deletion strain.
    experiment_type: enzyme assay and isotope-tracing metabolomics
