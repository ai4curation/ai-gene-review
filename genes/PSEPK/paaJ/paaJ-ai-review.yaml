  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Over-specific family transfer for a different thiolase substrate pair.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The assigned target reaction uses succinyl-CoA and acetyl-CoA to form
      3-oxoadipyl-CoA, rather than condensing two acetyl-CoA molecules. The
      orthologous Pseudomonas sp. Y2 PaaJ was characterized on the C8 and C6
      3-oxoacyl-CoA pathway intermediates, not on acetoacetyl-CoA.
    supported_by:
