- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Likely family-level over-annotation rather than the principal pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The rejection is
      retained on substrate grounds, not merely because the source is a
      thiolase-family transfer. GO:0006635 is defined as the process that
      "results in the complete oxidation of a long-chain fatty acid", whereas
      PaaJ is the 3-oxoadipyl-CoA/3-oxo-5,6-dehydrosuberyl-CoA thiolase of the
      paa locus (UniProt reaction succinyl-CoA + acetyl-CoA = 3-oxoadipyl-CoA +
      CoA, EC 2.3.1.174), acting on dicarboxylic CoA-esters derived from
      phenylacetyl-CoA ring opening. The same TreeGrafter node also supplied
      GO:0010124 phenylacetate catabolic process, which is the physiological
      pathway retained here. Marked over-annotated rather than removed because
      thiolytic C-C cleavage is shared chemistry and no assay rules out a minor
      fatty-acyl-CoA activity.
    supported_by:
    - reference_id: file:PSEPK/paaJ/paaJ-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR43853:SF2; 3-OXOADIPYL-COA_3-OXO-5,6-DEHYDROSUBERYL-COA THIOLASE'
    - reference_id: PMID:20660314
