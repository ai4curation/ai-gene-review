id: Q88PK1
gene_symbol: ndk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Ndk (PP_0849) is nucleoside diphosphate kinase. Through a phosphohistidine
  intermediate, it transfers the terminal phosphate of ATP to ribonucleoside
  and deoxyribonucleoside diphosphates, supplying non-ATP nucleoside
  triphosphates including GTP, UTP, and CTP.
existing_annotations:
- term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific molecular function.
    action: ACCEPT
    reason: >-
      UniProt assigns EC 2.7.4.6 and RHEA:18113/RHEA:44640 for phosphate
      transfer from ATP to ribonucleoside and deoxyribonucleoside diphosphates.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Correct substrate-binding annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP is the phosphate donor, but ATP binding alone is less informative
      than nucleoside diphosphate kinase activity.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for the soluble bacterial enzyme.
    action: ACCEPT
    reason: UniProt explicitly assigns Ndk to the cytoplasm.
- term:
    id: GO:0006183
    label: GTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct purine nucleotide biosynthetic role.
    action: ACCEPT
    reason: >-
      Ndk phosphorylates GDP to GTP using ATP and has a major role in synthesis
      of non-ATP nucleoside triphosphates.
- term:
    id: GO:0006228
    label: UTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct pyrimidine nucleotide biosynthetic role.
    action: ACCEPT
    reason: >-
      The broad Ndk reaction includes phosphorylation of UDP to UTP; this valid
      role is retained even though it lies outside the purine-focused module.
- term:
    id: GO:0006241
    label: CTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct pyrimidine nucleotide biosynthetic role.
    action: ACCEPT
    reason: >-
      Ndk can phosphorylate CDP to CTP; this valid role is retained even though
      it lies outside the purine-focused module.
