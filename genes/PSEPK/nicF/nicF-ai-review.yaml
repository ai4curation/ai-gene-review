    label: nicotinate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:18678916
  review:
    action: ACCEPT
    summary: nicF directly performs a lower-pathway chemical step in nicotinate catabolism.
    reason: Recombinant NicF cell extracts hydrolyzed maleamate with reported specific activity 19.3 micromol/min/mg.
      This directly establishes catalysis of a pathway step; the paper does not report an individual nicF
      knockout. The glutamate-dehydrogenase/NADPH coupling measures released ammonium and does not make
      NADPH a NicF cofactor. The primary full text was inspected externally; the local cache is abstract-only.
    supported_by:
    - reference_id: file:PSEPK/nicF/nicF-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=maleamate + H2O = maleate + NH4(+);
    - reference_id: PMID:18678916
- term:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
  evidence_type: IDA
  original_reference_id: PMID:18678916
  review:
    action: MODIFY
    summary: Refine the broad linear-amide hydrolase activity to the characterized substrate-specific
      reaction.
    reason: The linear-amide hydrolase parent is correct but less specific than the demonstrated maleamate
      amidohydrolase activity. No exact current GO term was recovered; the replacement corresponds to
      the supported proposed term. Family/conserved-residue analysis suggests a cysteine amidase mechanism,
      but it is not target-specific mutational proof of every catalytic residue or direct evidence of
      metal independence.
    proposed_replacement_terms:
    - id: NTR
      label: maleamate amidohydrolase activity
    supported_by:
