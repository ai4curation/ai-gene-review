taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NicF is a maleamate amidohydrolase in the aerobic nicotinate degradation pathway of Pseudomonas
  putida KT2440. It converts maleamate into maleate and ammonium, acting after NicD deformylation and
  before MaiA/NicE maleate isomerization to fumarate. NicF belongs to the isochorismatase-like hydrolase
  family, with a predicted cysteine-centered catalytic mechanism.
