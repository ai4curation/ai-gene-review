id: P0A120
gene_symbol: dnaN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: DnaN is the homodimeric beta sliding clamp of bacterial DNA polymerase III. The clamp forms a ring around duplex DNA after ATP-dependent loading by the clamp-loader complex and tethers replicative polymerases to DNA, thereby supporting processive chromosome synthesis.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The beta clamp topologically encircles and tracks along duplex DNA.
    action: ACCEPT
    reason: The reviewed UniProt record describes a ring around DNA that diffuses along duplex DNA and tethers partner enzymes.
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Incorrect subunit-level catalytic assignment; DnaN is a processivity clamp.
    action: REMOVE
    reason: Polymerization is catalyzed by the DnaE alpha subunit, whereas DnaN structurally tethers polymerases to DNA.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Appropriate localization for the bacterial sliding clamp.
    action: ACCEPT
    reason: DnaN acts on chromosomal DNA in the cytoplasmic replisome and has no membrane-targeting features.
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct core biological process for the beta clamp.
    action: ACCEPT
    reason: DnaN is required for processive bacterial chromosome replication.
- term:
    id: GO:0006271
    label: DNA strand elongation involved in DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct specific process annotation for clamp-supported synthesis.
    action: ACCEPT
    reason: The beta clamp confers processivity during replicative DNA strand elongation.
- term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Incorrect catalytic assignment inherited from the polymerase III complex.
    action: REMOVE
    reason: The 3'-5' proofreading exonuclease is DnaQ; DnaN has no exonuclease active site.
- term:
    id: GO:0009360
    label: DNA polymerase III complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: Correct complex-membership annotation.
    action: ACCEPT
    reason: DnaN is the beta sliding-clamp component of the DNA polymerase III replisome.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Homodimerization is structurally correct but the generic binding term is not an informative core function.
    action: MARK_AS_OVER_ANNOTATED
    reason: DnaN forms a homodimeric ring, but its biologically meaningful role is sliding-clamp processivity.
- term:
    id: GO:0071897
    label: DNA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: True but overly broad relative to DNA replication and replication-coupled strand elongation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The more specific replication terms capture DnaN's biological role.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: Duplicate cytoplasmic localization supported by orthology.
    action: ACCEPT
    reason: This agrees with the clamp's action in the bacterial cytoplasmic replisome.
- term:
    id: GO:0030337
    label: DNA polymerase processivity factor activity
  evidence_type: IEA
  original_reference_id: file:PSEPK/dnaN/dnaN-uniprot.txt
  qualifier: enables
  review:
    summary: The specific molecular function of the DnaN beta sliding clamp.
    action: NEW
    reason: >-
      DnaN encircles duplex DNA and tethers DNA polymerases, directly increasing
      their processivity without catalyzing DNA synthesis.
    supported_by:
    - reference_id: file:PSEPK/dnaN/dnaN-uniprot.txt
      supporting_text: Confers DNA tethering and processivity to DNA polymerases and other proteins.
core_functions:
- description: Homodimeric beta sliding clamp that encircles DNA and tethers DNA polymerase III for processive strand elongation.
  molecular_function:
