  label: Pseudomonas putida KT2440
description: DnaN is the homodimeric beta sliding clamp of bacterial DNA polymerase III. The clamp forms
  a ring around duplex DNA after ATP-dependent loading by the clamp-loader complex and tethers replicative
  polymerases to DNA, thereby supporting processive chromosome synthesis.
