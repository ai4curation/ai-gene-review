    id: GO:0003935
    label: GTP cyclohydrolase II activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002327872
  review:
    summary: TreeGrafter IEA of GTP cyclohydrolase II activity, driven by the C-terminal GTP cyclohydrolase
      II-like domain.
    action: REMOVE
    reason: 'ribAB-II is a RibBX-type protein: an N-terminal DHBP synthase domain fused to a C-terminal
      GTP cyclohydrolase II-like domain that has lost the catalytic residues. In the C-terminal region
      the three zinc-binding cysteines of RibA are replaced and the catalytic arginine does not align.
      RibBX proteins from several proteobacteria, tested experimentally, lack GTP cyclohydrolase II activity.
      UniProt names the protein a DHBP synthase only, and KT2440 RibA (PP_0522) is the sole intact GTP
      cyclohydrolase II. The TreeGrafter transfer follows the fold, not the activity, and is an over-propagation.'
    supported_by:
    - reference_id: file:PSEPK/ribAB-I/ribAB-I-bioinformatics/RESULTS.md
      supporting_text: Neither ribAB-I nor ribAB-II retains the zinc-binding cysteine triad or the catalytic
        residues of GTP cyclohydrolase II
    - reference_id: PMID:24097946
      supporting_text: We examined the functionality of representative ribBX genes from Beta-, Gamma-,
        and Epsilonproteobacteria and found that, consistent with sequence-based predictions, the encoded
        GTP cyclohydrolase II domains lack catalytic activity.
    - reference_id: PMID:24097946
      supporting_text: Phylogenetic analysis revealed that the misannotation of ribBX as ribBA is rampant
        throughout the phylum Proteobacteria
