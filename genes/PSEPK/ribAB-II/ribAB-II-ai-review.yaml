taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: 'ribAB-II (PP_3813) of Pseudomonas putida KT2440 encodes a RibBX-type protein: an N-terminal
  3,4-dihydroxy-2-butanone 4-phosphate (DHBP) synthase domain fused to a C-terminal GTP cyclohydrolase
  II-like domain. The C-terminal domain lacks the zinc-binding cysteines and the catalytic arginine of
  GTP cyclohydrolase II, so it is predicted to be catalytically inactive. RibBX proteins elsewhere in
  the Proteobacteria lack GTP cyclohydrolase II activity, and in Shewanella the domain regulates the DHBP
  synthase. The protein is therefore a DHBP synthase of riboflavin biosynthesis despite its "ribAB" symbol,
  and is one of three DHBP synthases in KT2440. Function is inferred from sequence; no KT2440 enzymology
  is reported.'
