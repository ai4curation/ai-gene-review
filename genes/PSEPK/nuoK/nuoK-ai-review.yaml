taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoK (PP_4128) is the small three-transmembrane-helix subunit (ND4L/NuoK family) of the
  proton-pumping NADH:quinone oxidoreductase (NDH-1, respiratory complex I) in the
  cytoplasmic membrane. It is encoded in the PP_4119-PP_4131 nuo operon. By orthology to
  the well-characterised Escherichia coli NuoK, it sits in the proximal membrane arm
  where, with NuoA, NuoJ and part of NuoH, it forms the E-channel proton pathway next to
  the quinone site. Two conserved membrane-embedded glutamates in this channel are needed
  to couple NADH-to-quinone electron transfer with proton translocation. NuoK has no redox
  cofactor; it contributes to the proton-pumping NADH:ubiquinone oxidoreductase activity
  of the assembled complex, which conserves respiratory redox energy as proton-motive
  force for ATP synthesis.
existing_annotations:
