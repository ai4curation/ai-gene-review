    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Automated plasma membrane assignment from the HAMAP NuoK rule and UniProt
      subcellular location.
    action: ACCEPT
    reason: >-
      HAMAP MF_01456 places NuoK in the cell inner membrane with three transmembrane
      helices. In the E. coli orthologue (P0AFE4) the inner-membrane location is shown
      experimentally (PMID:7607227, PMID:21822288). Core location.
    supported_by:
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
    - reference_id: PMID:21822288
      supporting_text: It includes six subunits, NuoL, NuoM, NuoN, NuoA, NuoJ and NuoK,
        with 55 transmembrane helices.
- term:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO mapping from the complex I chain 4L/K signature (IPR001133) to a
      high-level NAD(P)H oxidoreductase term.
    action: MODIFY
    reason: >-
      Correct in direction but too general. The specific activity of the complex that
      NuoK belongs to is the proton-pumping NADH:ubiquinone oxidoreductase GO:0008137,
      a descendant of GO:0016651. HAMAP gives this reaction for NuoK, and E. coli NuoK
      mutants show that the subunit is required for the coupled activity
      (PMID:15996109). NuoK has no catalytic site, so the replacement should be read as
      contributes_to.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: Reaction=a quinone + NADH + 5 H(+)(in) = a quinol + NAD(+) + 4
        H(+)(out); Xref=Rhea:RHEA:57888
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the complex I subunit 4L family.'
    - reference_id: PMID:15996109
      supporting_text: Mutations of nearly perfectly conserved Glu-36 lead to almost null
        activities of coupled electron transfer with a concomitant loss of generation
        of electrochemical gradient.
- term:
    id: GO:0030964
    label: NADH dehydrogenase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: TreeGrafter assignment of NADH dehydrogenase complex from PTHR11434 (subfamily
      SF16), which mirrors the PAINT IBD at PTN000153441.
    action: MODIFY
    reason: >-
      Correct but general. HAMAP places NuoK in the 13-subunit NDH-1 membrane sector,
      which is respiratory chain complex I (GO:0045271, a child of GO:0030964), as shown
      experimentally for the E. coli orthologue (PMID:17722886). The family-level node
      placement is sound (interpro/panther/PTHR11434/PTHR11434-review.yaml); for this
      bacterial respiratory member the specific complex term applies.
    proposed_replacement_terms:
    - id: GO:0045271
      label: respiratory chain complex I
    supported_by:
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: 'SUBUNIT: NDH-1 is composed of 13 different subunits. Subunits
        NuoA, H, J, K, L, M, N constitute the membrane sector of the complex.'
    - reference_id: PMID:17722886
      supporting_text: The preparation is pure and monodisperse and comprises all known
        subunits and cofactors.
- term:
    id: GO:0042773
    label: ATP synthesis coupled electron transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO mapping from the complex I chain 4L/K signature to ATP synthesis
      coupled electron transport.
    action: ACCEPT
    reason: >-
      P. putida KT2440 is a strict aerobe whose NDH-1 feeds NADH electrons into the
      aerobic respiratory chain. HAMAP states that the complex conserves redox energy as
      a proton gradient, which drives ATP synthesis. NuoK is required for that coupling
      in the E. coli orthologue (PMID:15996109). Core process.
    supported_by:
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every two
        electrons transferred, four hydrogen ions are translocated across the cytoplasmic
        membrane), and thus conserves the redox energy in a proton gradient.
- term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: UniRule-derived non-electrogenic NADH:quinone oxidoreductase activity
      (RHEA:46160).
    action: REMOVE
    reason: >-
      Demonstrably wrong mapping. GO:0050136 is the non-electrogenic reaction of type II
      NADH dehydrogenases (NDH-2). NuoK belongs to the electrogenic, proton-pumping NDH-1,
      and the same HAMAP rule gives the proton-translocating reaction (RHEA:57888,
      4 H+ out per NADH), which corresponds to GO:0008137. In the E. coli orthologue, NuoK
      mutations specifically abolish generation of the electrochemical gradient.
    supported_by:
    - reference_id: file:PSEPK/nuoK/nuoK-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every two
        electrons transferred, four hydrogen ions are translocated across the cytoplasmic
        membrane)
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh II) that reacts with NADH exclusively whose
        turnover does not lead to generation of a H+ electrochemical gradient
