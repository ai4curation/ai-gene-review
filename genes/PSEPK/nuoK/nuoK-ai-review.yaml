suggested_questions:
- question: Has the contribution of P. putida KT2440 nuoK to complex I assembly, activity,
    or proton-coupling efficiency been tested directly, and are the E-channel glutamates
    equivalent to E. coli Glu-36 and Glu-72 conserved in PP_4128?
suggested_experiments:
- description: Construct a clean nuoK deletion or E-channel glutamate substitution strain
    and measure membrane NADH:quinone oxidoreductase activity, respiratory growth, and
    proton-motive-force generation.
