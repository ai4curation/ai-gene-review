taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: cheA (PP_4338, also called cheA2) encodes the chemotaxis histidine kinase CheA of Pseudomonas
  putida KT2440. The 747 aa protein has the CheA domain organisation, with an N-terminal HPt phosphotransfer
  domain carrying the phosphoacceptor histidine (His49), a central dimerisation and histidine-kinase ATPase
  region, and a C-terminal CheW-like domain that couples the kinase to chemoreceptors and the adaptor
  CheW in chemosensory arrays. KT2440 has three CheA paralogs; PP_4338 is the one that drives the flagellar
  chemotaxis pathway, while CheA1 belongs to a Wsp-like c-di-GMP/biofilm pathway. Purified P. putida CheA
  autophosphorylates with ATP and transfers the phosphoryl group to the response regulator CheY, and a
  cheA2 mutant is non-chemotactic towards maize root exudates and copper gradients. Its autophosphorylation
  is modulated by interacting proteins such as the copper-sensing repressor CsoR, linking metal stress
  to swimming behaviour.
