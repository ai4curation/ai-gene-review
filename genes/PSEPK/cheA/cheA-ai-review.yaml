- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: CheA is a soluble cytoplasmic kinase with no signal peptide or transmembrane segment. In
      bacteria generally it sits in membrane-proximal chemosensory arrays, usually at the cell pole, but
      no localization study of KT2440 CheA2 is available, so cytoplasm is the most specific location the
      evidence for this protein supports.
    action: ACCEPT
    reason: Correct, and as precise as the KT2440 evidence allows. CheA interacts in vivo (BiFC in P.
      putida) with cytoplasmic proteins such as CsoR, enolase and glutamine synthetase, and its partners
      CheY and CheZ are soluble. A cell-pole or array term would need KT2440 localization data and is
      left as a suggested experiment.
    supported_by:
    - reference_id: PMID:40197389
      supporting_text: the other 16 proteins displayed obvious interaction with CheA in the BiFC assay
    - reference_id: file:PSEPK/cheA/cheA-deep-research-falcon.md
      supporting_text: Although the retrieved KT2440-specific texts did not directly image CheA2 localization,
        the conserved mechanism implies that KT2440 CheA2 operates at these **membrane-proximal/polar
        chemosensory arrays** to integrate receptor inputs and control downstream phosphorylation.
  qualifier: located_in
core_functions:
- description: CheA (PP_4338/CheA2) is the histidine kinase of the KT2440 chemotaxis phosphorelay. Activated
    by chemoreceptors through CheW, it autophosphorylates on the HPt-domain histidine using ATP and transfers
    the phosphoryl group to the response regulator CheY, coupling receptor input to flagellar behaviour
    and chemotaxis.
