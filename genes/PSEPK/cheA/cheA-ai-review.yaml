- id: PMID:40197389
  title: Coordinated regulation of chemotaxis and resistance to copper by CsoR in Pseudomonas putida.
  findings:
  - statement: Purified P. putida CheA autophosphorylates with [32P]ATP and transfers phosphate to CheY;
      CsoR and PhaD inhibit CheA autophosphorylation; a cheA deletion abolishes chemotaxis including the
      chemorepellent response to copper.
    supporting_text: The addition of CheY to phosphorylated CheA led to a labeling of CheY and a reduction
      in the phospholabeling of CheA
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official Supplementary file 1 checked. The supplement explicitly identifies
      the cheA deletion as PP_4338 and lists cheA expression constructs/primers, strengthening locus identity
      beyond the phenotype alone. CheY and CheZ are named without accession identifiers; the exact CheY
      assay construct is unresolved.
- id: file:PSEPK/cheA/cheA-deep-research-falcon.md
  title: Falcon deep research report for cheA in Pseudomonas putida KT2440
  findings:
  - statement: Synthesizes KT2440 cheA2 literature, conserved CheA domain architecture, and chemosensory-array
      reviews.
    supporting_text: In KT2440, **CheA2 (PP_4338)** functions as the **central histidine kinase of the
      canonical chemotaxis signaling pathway**, required for chemotaxis to maize root exudates in quantitative
      capillary assays.
- id: file:PSEPK/cheA/cheA-source-analysis/PMID40197389-supp1.txt
