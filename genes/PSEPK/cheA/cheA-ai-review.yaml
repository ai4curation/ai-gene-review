    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: CheA kinase chemistry is supported; the inherited molecular-sensor role needs correction.
    action: MODIFY
    reason: 'QuickGO checked 2026-11-06 confirms GO:0000155 is_a GO:0140299 molecular sensor activity,
      as well as GO:0004673. The sensor parent describes ligand binding with an activity change in response
      to intracellular ligand level. Receptor-controlled histidine phosphorylation is established, but
      the experiments do not establish that sensor activity on CheA itself: chemoreceptors detect the
      stimulus and control CheA through the coupling complex. The child definition alone had obscured
      this inherited requirement. Retain the demonstrated kinase chemistry as GO:0004673 and the receptor-controlled
      phosphorelay in the process/core description; ask GO to resolve the term-scope mismatch rather than
      asserting an experimentally disproven kinase or a wrong PAINT node. PMID:40197389 demonstrates CheA
      autophosphorylation and CheY phosphotransfer; its supplement identifies PP_4338. PMID:30761113 places
      this paralog in KT2440 flagellar chemotaxis.'
