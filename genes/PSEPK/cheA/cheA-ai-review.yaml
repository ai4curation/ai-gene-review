suggested_questions:
- question: Which KT2440 response regulators are the dominant in vivo phospho-acceptors for PP_4338/CheA
    during chemotaxis under rhizosphere conditions?
  experts:
  - Tino Krell
  - Miguel A Matilla
  - Jose A Reyes-Darias
- question: How are signaling duties partitioned among the three KT2440 CheA paralogs across defined attractants
    and surface-associated states?
  experts:
  - Tino Krell
  - Miguel A Matilla
- question: Does PP_4338 form stable polar chemosensory arrays with specific MCP and CheW partners in
    KT2440, and how condition-dependent is that assembly?
  experts:
  - Tino Krell
suggested_experiments:
- description: Test phosphotransfer from purified PP_4338/CheA to each KT2440 CheY and CheB paralog, including
    kinetics, to define cognate partners.
  hypothesis: PP_4338 preferentially phosphorylates the CheY and CheB proteins of its own che cluster.
  experiment_type: biochemical phosphotransfer assay
- description: Compare cheA1, cheA2, and cheA3 single and combinatorial mutants across defined attractants,
    root-exudate mixtures, motility, and root-colonization assays.
  hypothesis: cheA2 carries the core flagellar chemotaxis pathway, while the other paralogs control distinct
    surface-sensing or c-di-GMP-linked signaling branches.
  experiment_type: comparative mutant phenotyping
- description: Tag PP_4338 with a minimally perturbing fluorescent marker and image its localization relative
    to chemoreceptor arrays during planktonic and rhizosphere-like growth.
  hypothesis: The core chemotaxis CheA paralog forms membrane-proximal polar signaling arrays whose abundance
    changes with environmental context.
  experiment_type: live-cell localization microscopy
