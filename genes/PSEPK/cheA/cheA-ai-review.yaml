- id: PMID:30761113
  title: Concentration Dependent Effect of Plant Root Exudates on the Chemosensory Systems of Pseudomonas
    putida KT2440.
  findings:
  - statement: PP_4338 is cheA2; a cheA2 mutant is entirely deficient in maize root exudate chemotaxis,
      placing CheA2 in the che chemotaxis pathway, whereas cheA1 affects c-di-GMP and biofilm formation.
    supporting_text: mutation of cheA2 abolished chemotaxis, which is consistent with the notion the CheA2
      forms part of the che chemotaxis pathway
    reference_section_type: RESULTS
  reference_review:
