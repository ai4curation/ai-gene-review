id: Q88QP1
gene_symbol: rpoC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  rpoC (PP_0448) encodes the beta-prime subunit of the bacterial DNA-directed RNA
  polymerase core enzyme. RpoC pairs with the beta subunit RpoB to form the catalytic
  cleft of the alpha2-beta-beta-prime-omega RNAP core, coordinating divalent metal
  ions and nucleic-acid contacts needed for DNA-templated RNA synthesis. Its core
  role is contribution to complex-level RNA polymerase activity, with magnesium and
  zinc binding as important subunit-specific features.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      Magnesium ion binding is appropriate for the beta-prime subunit active center
      architecture.
    action: ACCEPT
    reason: >-
      UniProt records Mg(2+) as a cofactor for the RpoC subunit, consistent with the
      conserved RNAP catalytic mechanism.
    supported_by:
    - reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: Binds 1 Mg(2+) ion per subunit.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      DNA binding is plausible for the beta-prime subunit within the RNAP cleft, but
      it is a broad supporting activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain as non-core context. Complex-level DNA-directed RNA polymerase activity
      and metal-binding features better capture the main role.
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      RpoC is an essential beta-prime subunit of the bacterial RNAP active-center
      cleft, but RNA synthesis is performed by the assembled core enzyme.
    action: ACCEPT
    reason: >-
      RpoC carries the conserved metal-binding active-center architecture and directly
      participates in nucleotide addition by the assembled core. Retain the annotation
      while the synthesis records contribution to the complex-level function rather
      than activity by isolated RpoC.
    supported_by:
    - reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: DNA-dependent RNA polymerase catalyzes the transcription of
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      Cytosolic localization is appropriate for a soluble bacterial RNA polymerase
      core subunit.
    action: ACCEPT
    reason: >-
      RpoC functions in the bacterial cytosol/nucleoid as part of the transcription
      machinery.
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      RpoC directly participates in DNA-templated transcription as an essential beta-prime
      subunit of bacterial RNA polymerase.
    action: ACCEPT
    reason: Correct process annotation for a core RNAP subunit.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      Zinc ion binding is appropriate for the beta-prime subunit, which UniProt annotates
      as binding two Zn(2+) ions per subunit.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain as a structural zinc-binding feature of beta-prime (two Zn(2+) sites);
      it supports the fold rather than defining the subunit's activity. Applied identically
      to E. coli rpoC.
    supported_by:
    - reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: Binds 2 Zn(2+) ions per subunit.
- term:
    id: GO:0034062
    label: 5'-3' RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Rhea-derived 5'-3' RNA polymerase activity on an RNAP active-centre subunit.
    action: MODIFY
    reason: >-
      Correct but general: the activity is DNA-templated, so the specific descendant
      GO:0003899 DNA-directed RNA polymerase activity, already carried by this gene,
      is the supported term.
    proposed_replacement_terms:
    - id: GO:0003899
      label: DNA-directed RNA polymerase activity
    supported_by:
    - reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using
        the four ribonucleoside triphosphates as substrates.
- term:
    id: GO:0000345
    label: cytosolic DNA-directed RNA polymerase complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
  qualifier: part_of
  review:
    summary: >-
      The subunit is part of the eubacterial DNA-directed RNA polymerase (alpha2 beta
      beta' omega core).
    action: NEW
    reason: >-
      UniProt (HAMAP) records the subunit in the alpha2 beta beta' omega catalytic
      core. GO:0000345 is the GO term defined as exactly this eubacterial enzyme,
      so it is preferred over the domain-neutral parent GO:0000428.
    supported_by:
    - reference_id: file:PSEPK/rpoC/rpoC-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: The RNAP catalytic core consists of 2 alpha, 1 beta, 1 beta'
    - reference_id: file:PSEPK/rpoC/rpoC-deep-research-openscientist.md
      supporting_text: >-
        is therefore the capstone subunit whose correct incorporation completes the
        catalytically competent core.
