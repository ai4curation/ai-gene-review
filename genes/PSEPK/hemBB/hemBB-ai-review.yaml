    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/hemBB/hemBB-uniprot.txt
    title: UniProtKB entry for PSEPK hemBB
    findings:
      - statement: HemBB is an ALAD-family delta-aminolevulinate dehydratase.
        record_section: [DE]
        supporting_text: "RecName: Full=Delta-aminolevulinic acid dehydratase"
      - statement: HemBB has a predicted Mg2+-binding site.
        record_section: ["FT:BINDING"]
        supporting_text: 'ligand="Mg(2+)"'
      - statement: HemBB retains two predicted Schiff-base active sites.
        record_section: ["FT:ACT_SITE"]
        supporting_text: Schiff-base intermediate with substrate
  - id: file:PSEPK/hemBB/hemBB-deep-research-openscientist.md
    title: OpenScientist research report for PSEPK hemBB
    findings:
      - statement: >-
          The report identifies the ALAD reaction and Mg-dependent subclass
          prediction but acknowledges the absence of direct KT2440 enzymology.
        supporting_text: "No direct enzymology (kM, kcat, metal titration, oligomeric state) has been published for the *P. putida* KT2440 protein specifically;"
    reference_review:
      relevance: HIGH
      correctness: MISCITED
      review_notes: >-
        The report recovers the predicted ALAD reaction and Mg-site architecture,
        which are independently present in UniProt. It incorrectly calls PP_3322
        the single KT2440 hemB/PBGS gene and omits the Q88IT6/PP_2913 paralog, so
        it cannot adjudicate physiological dominance. It also supplies unsaved
        sequence analysis and transfers oligomeric state, metal behavior,
        essentiality, and antibacterial-target claims from other proteins. Those
        target-specific conclusions were not retained.
