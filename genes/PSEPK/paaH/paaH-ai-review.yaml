- id: file:PSEPK/paaH/paaH-deep-research-openscientist.md
  title: OpenScientist deep-research report for PSEPK paaH
  findings:
  - statement: >-
      The report independently matches Q88HS1 and PP_3282 to an
      NAD+-dependent 3-hydroxyacyl-CoA dehydrogenase in lower phenylacetate
      catabolism.
    supporting_text: >-
      **PaaH** (gene *paaH*; ordered locus **PP_3282**; UniProt **Q88HS1**) of
      *Pseudomonas putida* KT2440 is a **soluble, cytoplasmic, NAD⁺-dependent
      3-hydroxyacyl-CoA dehydrogenase (EC 1.1.1.35)** that acts in the **lower,
      β-oxidation-like segment of the aerobic phenylacetate (phenylacetyl-CoA)
      degradation pathway**.
    reference_section_type: RESULTS
  - statement: Direct target-specific substrate enzymology remains unavailable.
    supporting_text: >-
      **No direct enzymology on Q88HS1 itself:** substrate specificity and
      kinetic parameters are inferred from pathway context and close homologs,
      not measured for the KT2440 protein.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Provider-generated gene report. Exact accession, locus, enzyme class,
      cofactor, and pathway agree with local records; substrate
      stereochemistry and detailed mechanism derive from pathway context and
      orthologs.
