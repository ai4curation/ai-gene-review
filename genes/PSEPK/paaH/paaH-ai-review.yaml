    id: GO:0008691
    label: 3-hydroxybutyryl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Substrate-specific over-annotation from the broader enzyme family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UniProt names the target 3-hydroxyadipyl-CoA dehydrogenase, not
      3-hydroxybutyryl-CoA dehydrogenase. Activity on the shorter substrate
      has not been established for KT2440 PaaH. The PANTHER subfamily name
      (3-hydroxybutyryl-CoA dehydrogenase) reflects the dominant family
      member, whereas the NCBIfam PaaH family and the orthologous
      biochemistry point to 3-hydroxyadipyl-CoA.
    supported_by:
