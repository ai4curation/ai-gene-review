id: Q88HS1
gene_symbol: paaH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaH is a 3-hydroxyacyl-CoA dehydrogenase-family enzyme in the aerobic
  phenylacetate degradation pathway of Pseudomonas putida KT2440. By
  orthology to the characterized E. coli enzyme, it oxidizes
  3-hydroxyadipyl-CoA with NAD+ to 3-oxoadipyl-CoA in the beta-oxidation-like
  lower pathway, the substrate for the final PaaJ thiolysis to succinyl-CoA
  and acetyl-CoA.
