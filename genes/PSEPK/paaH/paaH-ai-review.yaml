- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Broad family-level process annotation that obscures the paa pathway role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The exact target is named 3-hydroxyadipyl-CoA dehydrogenase and is
      encoded in the phenylacetate catabolic locus, not a general fatty-acid
      metabolic enzyme. Its substrate, 3-hydroxyadipyl-CoA, is a dicarboxylic
      ring-cleavage product of phenylacetate rather than a fatty acyl-CoA.
      Marked over-annotated rather than removed because the dehydrogenase
      chemistry is shared with fatty-acid beta-oxidation enzymes of the same
      family.
    supported_by:
    - reference_id: file:PSEPK/paaH/paaH-uniprot.txt
      supporting_text: 'NCBIfam; TIGR02279; PaaC-3OHAcCoADH'
    - reference_id: PMID:20660314
      supporting_text: PaaH therefore functioned as an NAD + -dependent
    - reference_id: PMID:20660314
      supporting_text: 3-hydroxyadipyl-CoA dehydrogenase forming 3-oxoadipyl-CoA
- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Likely family-level over-annotation rather than the physiological pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The rejection is
      retained on substrate grounds rather than on the propagation alone.
      GO:0006635 is defined as the process that "results in the complete
      oxidation of a long-chain fatty acid". The exact target is named
      3-hydroxyadipyl-CoA dehydrogenase and sits in the paa locus, acting on the
      3-hydroxy dicarboxylic CoA-ester produced after ring opening of
      phenylacetyl-CoA; adipyl-CoA is not a long-chain fatty acyl-CoA, and the
      gene's own GOA carries GO:0010124 phenylacetate catabolic process for the
      physiological pathway. Marked over-annotated rather than removed because
      the 3-hydroxyacyl-CoA dehydrogenase chemistry is genuinely shared with
      beta-oxidation and no assay excludes a minor fatty-acyl contribution.
    supported_by:
    - reference_id: file:PSEPK/paaH/paaH-uniprot.txt
      supporting_text: 'NCBIfam; TIGR02279; PaaC-3OHAcCoADH'
    - reference_id: PMID:20660314
      supporting_text: 3-hydroxyadipyl-CoA dehydrogenase forming 3-oxoadipyl-CoA
