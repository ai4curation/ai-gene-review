taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3253 is a type 2/YbdK-family ATP-dependent carboxylate--amine ligase
  predicted to exhibit weak glutamate--cysteine ligase activity. Its
  physiological substrate and contribution to glutathione biosynthesis in
  Pseudomonas putida KT2440 have not been established, and the canonical GshA
  enzyme supplies the conserved first biosynthetic step.
