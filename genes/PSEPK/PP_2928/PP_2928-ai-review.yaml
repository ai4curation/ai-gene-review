  review:
    summary: Family, domain, protein-length, and nspC synteny evidence support CASDH/CANSDH activity, but no direct KT2440 assay is available. GO:0102143 has the current label "carboxynorspermidine dehydrogenase activity"; with putrescine as substrate, this family activity yields carboxyspermidine and is referred to as CASDH in this pathway.
