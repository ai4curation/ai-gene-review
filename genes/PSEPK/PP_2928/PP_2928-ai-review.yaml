references:
- id: file:PSEPK/PP_2928/PP_2928-uniprot.txt
  title: UniProtKB entry for Pseudomonas putida KT2440 PP_2928
  findings:
  - statement: UniProt records Q88IS1 in the CASDH-related PTHR43796 family but retains a
      saccharopine-dehydrogenase product name.
- id:
    file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
  title: OpenScientist PSEPK carboxyspermidine pathway review
  findings:
  - statement: The species-aware review identifies PP_2928 as the missing CASDH using family,
      synteny, and protein-length evidence.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Useful retrieval and pathway synthesis, but internally inconsistent route
      claims and unreproducible identity percentages were deliberately excluded;
      exact family, synteny, and primary-literature evidence carry the assignment.
- id: PMID:19196710
  title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for
    biofilm formation in Vibrio cholerae.
  findings:
  - statement: The study experimentally identifies paired CANSDH/CANSDC enzymes in the alternative
      bacterial polyamine pathway.
    supporting_text: "deletion of either CANSDC or the putative CANSDH led to loss of sym-norspermidine
      and spermidine"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text checked. Deletion/complementation and metabolite experiments used V. cholerae C6709, whereas
      Q9KRL3/Q9KRL4 are N16961 reference records. Purified decarboxylase specificity was assayed using
      V. vulnificus CANSDC for technical reasons. These are distinct evidence layers; no N16961 purified-enzyme
      assay is inferred.
- id: PMID:36283333
  title: Structural analysis of carboxyspermidine dehydrogenase from Helicobacter pylori.
  findings:
  - statement: The study defines NADPH-dependent condensation of putrescine and aspartate
      semialdehyde by CASDH.
    supporting_text: "CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in
      an NADPH-dependent manner."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract chemistry checked: the H. pylori enzyme can perform putrescine condensation. PMID:37878710
      also identifies the H. pylori homolog as CAPADH; putrescine turnover or a CASDH name alone does
      not establish native substrate preference. This is comparator chemistry, not a target-species assay.
- id: PMID:22025614
  title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni
    and is the dominant polyamine pathway in human gut microbiota.
  findings:
  - statement: CASDH/CASDC orthologues are widespread in bacteria and cluster with
      putrescine-biosynthesis genes, consistent with spermidine synthesis.
    supporting_text: Orthologues encoding carboxyspermidine dehydrogenase and carboxyspermidine
      decarboxylase are found clustered with an array of diverse putrescine biosynthetic genes in
      different bacterial genomes, consistent with a role in spermidine, rather than
      sym-norspermidine biosynthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The publication cache was normally refreshed to full text during this audit. C. jejuni experiments
      support the comparator spermidine pathway; they are not direct assays of the Vibrio or KT2440 targets.
- id: file:PSEPK/PP_2928/PP_2928-notes.md
  title: Manual evidence notes for PP_2928
  findings:
  - statement: The notes record the family and synteny evidence without relying on unreproducible
      identity values.
- id: file:PSEPK/PP_2928/PP_2928-deep-research-openscientist.md
  title: OpenScientist functional review of PP_2928
  findings:
  - statement: The completed retrieval supports CASDH assignment from family, synteny, pathway
      completeness, and comparative literature.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Genuine provider artifact used for literature retrieval. Its unsupported
      quantitative identity and route-absence claims were not used in the final
      annotation rationale.
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: Some related CASDH/CASDC pairs support tetramine or agmatine-dependent chemistry;
      this cautions against assigning substrate preference from family membership alone. No such
      additional activity is assigned here.
    supporting_text: The ASA-dependent pathway consisting of CASDH/CASDC homologs has diversified
      during evolution to produce norspermidine (29), N1-aminopropylagmatine (37), and as we have
      shown here, spermidine and Spm/Tspm.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked as a specificity comparator. The reported heterologous
      reconstructions are not direct measurements of this target enzyme or native target-species
      flux.
- id: PMID:37437886
  title: Kinetic and structural characterization of carboxyspermidine dehydrogenase of polyamine
    biosynthesis.
  findings:
  - statement: Comparative putrescine/DAP kinetic measurements exist for B. fragilis and C. leptum
      CASDH, but do not measure this target or test agmatine preference.
    supporting_text: These data suggest that both enzymes can use putrescine or DAP and thus produce
      carboxyspermidine or carboxynorspermidine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked. BfCASDH favors putrescine over DAP in catalytic efficiency;
      ClCASDH has similar measured efficiencies for those two substrates. Native substrate
      preference against untested agmatine remains a separate question.
- id: PMID:37878710
  title: A bacterial spermidine biosynthetic pathway via carboxyaminopropylagmatine.
  findings:
  - statement: The CAPA pathway establishes functional divergence among CASDH-like enzymes, so
      PP_2928 family membership is not by itself proof of native putrescine use.
    supporting_text: Many bacterial genomes encode homologs of CASDH and CASDC (13); however, the
      polyamine biosynthetic pathway in most of these bacteria remains unclear.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked as a comparative specificity constraint; this is not a PP_2928
      assay.
