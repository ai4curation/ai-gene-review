    supporting_text: "CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in an NADPH-dependent manner."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract chemistry verified; directly defines the CASDH reaction used in this review.
