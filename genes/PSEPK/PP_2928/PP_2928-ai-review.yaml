knowledge_gaps:
- gap_statement: >-
    PP_2928 has not been tested biochemically or genetically in KT2440, so its
    substrate preference and contribution to cellular spermidine production remain unconfirmed.
  boundary: >-
    Exact PTHR43796:SF2 family membership, adjacency to nspC, and characterized
    orthologous CASDH/CANSDH pathways strongly support the assignment.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Direct validation would establish whether carboxyspermidine is the physiological product in KT2440.
  resolution: >-
    Assay purified PP_2928 with putrescine and aspartate semialdehyde and measure
    polyamine profiles after PP_2928 deletion and complementation.
  provenance:
  - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
    supporting_text: "there is **no direct biochemical or genetic experiment in KT2440** confirming CASDH activity for PP_2928 or CASDC activity for PP_2929"
proposed_new_terms: []
suggested_questions:
- question: Does purified PP_2928 preferentially produce carboxyspermidine from putrescine under physiological conditions?
suggested_experiments:
- description: Test NADPH-dependent PP_2928 activity with putrescine and aspartate semialdehyde and identify the product by LC-MS.
  experiment_type: biochemical validation
