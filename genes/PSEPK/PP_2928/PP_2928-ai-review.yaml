knowledge_gaps:
- gap_statement: >-
    PP_2928 has not been tested biochemically or genetically in KT2440, so its
    substrate preference and contribution to cellular spermidine production remain unconfirmed.
  boundary: >-
    Exact PTHR43796:SF2 family membership, adjacency to nspC, and characterized orthologous CASDH/CANSDH
    pathways strongly support the assignment. Related family members can instead use agmatine or participate
    in onward tetramine synthesis; those activities are not established for this KT2440 pair.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Direct validation would establish whether carboxyspermidine is the physiological
    product in KT2440.
  resolution: >-
    Assay the purified PP_2928/NspC pair across putrescine, 1,3-diaminopropane and agmatine-derived substrates,
    identify products by LC-MS, and measure polyamines after deletion and complementation in KT2440. Distinguish
    catalytic capacity from native substrate use and flux.
  provenance:
  - reference_id: file:PSEPK/PP_2928/PP_2928-notes.md
