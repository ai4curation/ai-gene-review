    file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
  qualifier: enables
  review:
    summary: Family, domain, protein-length, and nspC synteny evidence support CASDH/CANSDH
      activity, but no direct KT2440 assay is available. GO:0102143 has the current label
      "carboxynorspermidine dehydrogenase activity"; with putrescine as substrate, this family
      activity yields carboxyspermidine and is referred to as CASDH in this pathway.
    action: NEW
    supported_by:
    - reference_id: file:PSEPK/PP_2928/PP_2928-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "PANTHER; PTHR43796:SF2; CARBOXYNORSPERMIDINE SYNTHASE"
    - reference_id: PMID:19196710
      supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine,
        which is then converted to spermidine by CANSDC
    - reference_id: PMID:36283333
      supporting_text: CASDH condenses putrescine and aspartate β-semialdehyde into
        carboxyspermidine in an NADPH-dependent manner.
    - reference_id: file:PSEPK/PP_2928/PP_2928-deep-research-openscientist.md
    reason: >2-
       This is an inherited comparative proposal, not a newly measured KT2440 function. PMID:37878710
      and PMID:40074085 show substrate and pathway diversification in related proteins, so family membership
      and adjacency do not by themselves prove native putrescine preference. The curated-rule/comparative
      pathway inference is retained, with physiological substrate identity explicitly open.
