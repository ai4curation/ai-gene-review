  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Strongly supported carboxyspermidine dehydrogenase candidate. PP_2928 is
  adjacent to nspC and belongs to the CASDH/CANSDH family. Comparative,
  domain, and synteny evidence predicts NADPH-dependent condensation of
  putrescine with aspartate semialdehyde to form carboxyspermidine; direct
  biochemical or genetic confirmation in KT2440 is not available.
