    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is appropriate for the soluble MetH methionine synthase.
    action: ACCEPT
    reason: KT2440 MetH has a complete soluble four-module methyltransferase architecture and no annotated
      signal peptide or transmembrane segment; cytosolic activity is an inference, not a native localization
      measurement. This inference uses catalytic architecture and compartmental substrate context; the
      submitted protein name is not localization evidence.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_methionine_cycle/review-followup/metH-source-observation.md
      supporting_text: The frozen Q88KB5 record has five DOMAIN feature intervals spanning the four functional
