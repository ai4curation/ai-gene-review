id: Q88KB5
gene_symbol: metH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: MetH (PP_2375) is a four-domain cobalamin-dependent methionine synthase predicted to methylate
  L-homocysteine using 5-methyltetrahydrofolate, regenerating tetrahydrofolate. Its zinc-containing homocysteine-binding
  domain, folate-binding domain, cobalamin-binding module and SAM-dependent reactivation module support
  methionine formation and regeneration. These conserved catalytic assignments do not establish native
  KT2440 kinetics or which remethylation route dominates under a particular nutrient condition.
