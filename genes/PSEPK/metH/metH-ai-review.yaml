- id: file:PSEPK/metH/metH-deep-research-openscientist.md
  title: OpenScientist deep research report for metH
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Supports Q88KB5/PP_2375 as a full-length cobalamin-dependent methionine synthase using
      domain architecture, catalytic-residue conservation, and E. coli MetH orthology; no direct KT2440
      MetH assay, structure, kinetic measurement, essentiality test, or reactivation-partner study was
      identified.
  findings:
  - statement: The provider describes the complete MetH architecture; its interpretation of compact PP_2698
      as canonical MetE is superseded by MesD/MesX evidence. No KT2440 target assay was identified.
- id: file:analysis/module_audits/bacterial_methionine_cycle/psepk-consultation/evidence.md
  title: PSEPK methionine-cycle sequence, ontology and source-scope assessment
  findings:
  - statement: Target catalytic assignments distinguish conserved-role inference from comparator experiments
      and preserve unknown native flux.
- id: PMID:12832615
  title: 'Factors modulating conformational equilibria in large modular proteins: a case study with cobalamin-dependent
    methionine synthase.'
  findings:
  - statement: MetH couples homocysteine methylation to methylfolate utilization and has a separate SAM-dependent
      reactivation reaction; this is mechanistic comparative evidence, not a KT2440 assay.
    supporting_text: 'Two of these methyl transfer reactions

      occur during turnover, when homocysteine is converted to methionine by using a

      methyl group derived from methyltetrahydrofolate.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract accessed; used only for the explicit catalytic mechanism, not uninspected construct
      or strain claims.
- id: file:analysis/module_audits/bacterial_methionine_cycle/review-followup/metH-source-observation.md
  title: Independent inspection of the frozen KT2440 MetH domain/topology annotations
  findings:
