suggested_questions:
- question: Under which KT2440 growth conditions is the MetH route limited by cobalamin biosynthesis,
    salvage, or uptake rather than by the methionine-pathway enzymes themselves?
suggested_experiments:
- description: Compare metH and PP_2698/PP_2699 perturbations under controlled cobalamin and oxygen conditions,
    measuring methionine-cycle metabolites; test the inferred MesD/MesX route without presuming methylfolate
    as its donor.
  experiment_type: targeted genetics and nutrient rescue
