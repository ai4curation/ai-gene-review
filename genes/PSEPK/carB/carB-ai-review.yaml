description: carB encodes the ATP-dependent large chain of carbamoyl-phosphate synthase. Together with the glutaminase chain CarA it produces carbamoyl phosphate for de novo UMP and L-arginine biosynthesis; the large chain can also use free ammonia in the component reaction.
