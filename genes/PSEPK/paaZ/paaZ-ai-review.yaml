- id: PMID:31511507
  title: Molecular basis for metabolite channeling in a ring opening enzyme of the phenylacetate
    degradation pathway.
  findings:
  - statement: >-
      The NADP+-dependent PaaZ aldehyde dehydrogenase domain is needed to convert the
      semialdehyde intermediate; without it the intermediate forms a dead-end product.
    supporting_text: >-
      If either PaaZ-Aldh is impaired or if the enzyme is not supplemented with
      NADP+, the semialdehyde intermediate (III) rapidly forms a dead end product
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. CryoEM structure of E. coli PaaZ showing substrate
      channeling between the hydratase and dehydrogenase domains (the
      paper's wording "reduces" refers to the NADP+-dependent oxidation of
      the semialdehyde).
