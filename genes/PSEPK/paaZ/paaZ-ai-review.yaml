id: Q88HT3
gene_symbol: paaZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaZ is a predicted bifunctional oxepin-CoA hydrolase and
  3-oxo-5,6-dehydrosuberyl-CoA semialdehyde dehydrogenase in the aerobic
  phenylacetate pathway of Pseudomonas putida KT2440. Its two domains couple
  ring-opening hydrolysis to NADP-dependent aldehyde oxidation
  in the upper-to-lower pathway transition.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but too broad for the aldehyde-dehydrogenase domain.
    action: MODIFY
    reason: >-
      UniProt assigns one PaaZ domain as
      3-oxo-5,6-dehydrosuberyl-CoA semialdehyde dehydrogenase.
    proposed_replacement_terms:
    - id: GO:0016620
      label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: [DE]
      supporting_text: 'SubName: Full=Oxepin-CoA hydrolase/3-oxo-5,6-dehydrosuberyl-CoA semialdehyde dehydrogenase'
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IC
  original_reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
  qualifier: enables
  review:
    summary: Missing annotation for the second catalytic domain of bifunctional PaaZ.
    action: NEW
    reason: >-
      The inference rests on domain architecture, not on the submitter-assigned
      product name. Besides its N-terminal aldehyde-dehydrogenase domain, Q88HT3
      carries a C-terminal MaoC-like hotdog-fold domain (Pfam PF01575, CDD
      cd03452 MaoC_C; FT DOMAIN 543..645). In the characterized Escherichia coli
      PaaZ this MaoC-like domain performs the hydrolytic ring opening of
      oxepin-CoA (Teufel et al., PMID:20660314 and PMID:21296885, cited by the
      deep-research report but not cached here), so the hydrolase claim is an
      ortholog and domain inference without a KT2440 assay. The parent term
      GO:0016787 is kept because the domain evidence does not fix the substrate.
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF01575; MaoC_dehydratas; 1.'
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: 'DR   CDD; cd03452; MaoC_C; 1.'
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IC
  original_reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
  qualifier: involved_in
  review:
    summary: Missing pathway annotation for the PaaZ bifunctional enzyme.
    action: NEW
    reason: >-
      Both activities named for PaaZ act on CoA-ester intermediates specific
      to aerobic phenylacetate ring opening. Q88HT3 matches the NCBIfam
      TIGR02278 / InterPro IPR011966 "PaaN-DH" family (the
      phenylacetic-acid-degradation ring-opening aldehyde dehydrogenase) and
      has the ALDH-plus-MaoC fusion architecture (CDD cd07128 ALDH_MaoC-N)
      characteristic of PaaZ. This is a family-membership inference; no KT2440
      paaZ pathway genetics are cached.
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02278; PaaN-DH; 1.'
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: 'DR   CDD; cd07128; ALDH_MaoC-N; 1.'
