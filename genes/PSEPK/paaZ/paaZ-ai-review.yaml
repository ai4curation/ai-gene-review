id: Q88HT3
gene_symbol: paaZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaZ is a predicted bifunctional fusion enzyme of the aerobic phenylacetate
  pathway of Pseudomonas putida KT2440, combining an N-terminal aldehyde
  dehydrogenase domain with a C-terminal MaoC-like (R)-specific enoyl-CoA
  hydratase domain. By orthology to E. coli PaaZ, the hydratase domain
  hydrolytically opens the oxepin-CoA ring formed by PaaG, releasing a
  reactive semialdehyde that is channelled to the dehydrogenase domain and
  oxidized with NADP+ to 3-oxo-5,6-dehydrosuberyl-CoA, which enters the
  beta-oxidation-like lower pathway.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but too broad for the NADP+-dependent aldehyde-dehydrogenase domain.
    action: MODIFY
    reason: >-
      Q88HT3 belongs to the NCBIfam PaaN-DH family (TIGR02278) and carries
      the ALDH_MaoC-N aldehyde dehydrogenase domain. The orthologous E. coli
      PaaZ dehydrogenase domain oxidizes the ring-opened semialdehyde with
      NADP+, so GO:0033721 aldehyde dehydrogenase (NADP+) activity is the
      most specific available term (no term exists for EC 1.2.1.91), matching
      the E. coli PaaZ review.
    proposed_replacement_terms:
    - id: GO:0033721
      label: aldehyde dehydrogenase (NADP+) activity
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR02278; PaaN-DH'
    - reference_id: PMID:21296885
      supporting_text: >-
        an N-terminal NADP(+)-dependent aldehyde dehydrogenase domain that
        oxidizes the aldehyde to 3-oxo-5,6-dehydrosuberyl-CoA
    - reference_id: PMID:20660314
      supporting_text: >-
        The aldehyde group is oxidized further to the respective carboxylic
        acid by the aldehyde dehydrogenase domain under formation of NADPH
- term:
    id: GO:0016803
    label: ether hydrolase activity
  evidence_type: ISS
  original_reference_id: PMID:21296885
  qualifier: enables
  review:
    summary: Missing annotation for the oxepin-CoA ring-opening hydrolase domain.
    action: NEW
    reason: >-
      Q88HT3 carries the C-terminal MaoC-like hydratase domain (CDD MaoC_C)
      of the PaaZ fusion. In the orthologous enzyme this domain hydrolytically
      opens the oxepin-CoA ring, cleaving the bond between C3 and the ring
      ether oxygen (EC 3.3.2.12, an ether hydrolase). No reaction-specific GO
      term exists, so the EC 3.3.2 class term ether hydrolase activity is
      used, matching the E. coli PaaZ review. (This NEW row refines an
      earlier draft proposal of bare GO:0016787 hydrolase activity.)
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: 'CDD; cd03452; MaoC_C'
    - reference_id: PMID:21296885
      supporting_text: >-
        Here we characterize the hydrolytic oxepin-CoA ring cleavage catalyzed
        by the bifunctional fusion protein PaaZ.
    - reference_id: PMID:20660314
      supporting_text: >-
        The proton of the attached hydroxyl group dissociates, thus forming a
        keto group with concomitant ring cleavage between C3 and the ether O
        atom.
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IC
  original_reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
  qualifier: involved_in
  review:
