    action: NEW
    reason: >-
      Both activities of the orthologous PaaZ act on CoA-ester intermediates
      specific to aerobic phenylacetate ring opening, converting oxepin-CoA to
      3-oxo-5,6-dehydrosuberyl-CoA; Q88HT3 is classified in the
      phenylacetate-pathway PaaN-DH family.
    supported_by:
    - reference_id: file:PSEPK/paaZ/paaZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR02278; PaaN-DH'
    - reference_id: PMID:31511507
      supporting_text: >-
        If either PaaZ-Aldh is impaired or if the enzyme is not supplemented with
        NADP+, the semialdehyde intermediate (III) rapidly forms a dead end product
    - reference_id: file:PSEPK/paaZ/paaZ-deep-research-openscientist.md
      supporting_text: >-
        The enzyme consists of a C-terminal (R)-specific enoyl-CoA hydratase
        domain (formerly MaoC) that cleaves the ring and produces a highly
