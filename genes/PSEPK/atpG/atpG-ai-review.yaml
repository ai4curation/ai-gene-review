      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpG is a peripheral component of the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate although gamma is not integral to the membrane.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Gamma transmits rotor motion to the catalytic head during ATP synthesis.
      action: ACCEPT
      reason: This is the core biological process of AtpG.
  - term:
      id: GO:0042777
      label: proton motive force-driven plasma membrane ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: AtpG participates in proton-driven ATP synthesis at the bacterial plasma membrane.
      action: ACCEPT
      reason: The specific process is appropriate for this central-stalk subunit.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpG is the gamma subunit of F1 and the central stalk.
      action: ACCEPT
      reason: This records direct complex membership.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Gamma transmits rotation but does not independently catalyze coupled proton transport and ATP synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity is enabled by the full complex and AtpG contributes to it.
