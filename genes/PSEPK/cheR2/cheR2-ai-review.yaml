- term:
    id: GO:0008983
    label: protein-glutamate O-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:24452
  - EC:2.1.1.80
  review:
    summary: >-
      Combined IEA from the curated EC 2.1.1.80 / RHEA:24452 assignment.
      CheR2 is the experimentally characterized chemoreceptor glutamate
      methyltransferase of KT2440: it methylates McpS and McpT in vitro and its
      loss abolishes chemotaxis.
    action: ACCEPT
    reason: >-
      This is the core molecular function of CheR2. The Swiss-Prot entry
      states, with experimental evidence from PMID:23677992, that CheR2
      methylates membrane-bound MCPs to form gamma-glutamyl methyl esters and
      that it methylates the McpS receptor. The cited paper shows that CheR2
      alone among the three KT2440 CheR paralogues methylates McpS and McpT.
      The CheR-type methyltransferase domain spans the whole protein (PROSITE
      PS50123) with conserved SAM-binding residues. Although the row is
      electronic, the claim is directly supported by KT2440 data (abstract-only
      cache; the curated UniProt function line carries ECO:0000269 for this
      paper).
    supported_by:
    - reference_id: PMID:23677992
      supporting_text: Methylation assays show that CheR2, but not the other paralogues, methylates the McpS and McpT chemotaxis receptors.
    - reference_id: file:PSEPK/cheR2/cheR2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Methylation of the membrane-bound methyl-accepting chemotaxis proteins (MCP) to form gamma-glutamyl methyl ester residues in MCP. Methylates the McpS chemotaxis receptor. {ECO:0000269|PubMed:23677992}.'
    - reference_id: file:PSEPK/cheR2/cheR2-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: |-
        FT   DOMAIN          1..275
        FT                   /note="CheR-type methyltransferase"
- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IMP
  original_reference_id: PMID:23677992
  qualifier: involved_in
  review:
    summary: >-
      Proposed new process annotation from the KT2440 cheR2 mutant, which is
      deficient in chemotaxis, whereas cheR1 and cheR3 mutants have little or
      no chemotaxis defect.
    action: NEW
    reason: >-
      GOA has no process annotation for CheR2. CheR2 does part of the work of
      chemotaxis rather than being merely required for it: receptor methylation
      by CheR is the adaptation step of the chemotaxis signaling cycle, and
      CheR2 is the paralogue that methylates the flagellar-pathway receptors
      McpS and McpT. The mutant phenotype (loss of chemotaxis toward malate and
      casamino acids) is direct KT2440 evidence, so IMP from the cited paper is
      the appropriate code. Comparator: E. coli CheR (P07364) carries
      chemotaxis in GO, the same role relative to the same process.
    supported_by:
    - reference_id: PMID:23677992
      supporting_text: The mutant in CheR2 was deficient in chemotaxis, whereas mutation of CheR1 and CheR3 had either no or little effect on chemotaxis.
    - reference_id: PMID:23677992
      supporting_text: We conclude that CheR2 forms part of a chemotaxis pathway, and CheR1 forms part of a chemosensory route that controls biofilm formation.
    - reference_id: file:PSEPK/cheR2/cheR2-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: 'DISRUPTION PHENOTYPE: Mutants are deficient in chemotaxis toward malate and casamino acids. Mutation does not affect biofilm formation. {ECO:0000269|PubMed:23677992}.'
