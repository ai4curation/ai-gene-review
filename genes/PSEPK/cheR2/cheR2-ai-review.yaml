suggested_questions:
- question: >-
    Which glutamate residues of McpS, McpT and the other flagellar-pathway
    chemoreceptors does CheR2 methylate, and does CheR2 dock on a C-terminal
    pentapeptide-like tether as E. coli CheR does?
- question: >-
    Is the tight SAH binding of CheR2 (KD 0.14-2.2 uM range across
    paralogues) physiologically limiting, i.e. does cellular SAM/SAH ratio
    modulate chemotactic adaptation in KT2440?
suggested_experiments:
- hypothesis: CheR2 methylates a defined set of glutamates in the McpS signaling domain that control adaptation.
  description: >-
    Mass-spectrometric mapping of methylated glutamates in McpS (and
    glutamine-to-glutamate variants) after in vitro methylation with purified
    CheR2, combined with chemotaxis assays of receptor site mutants.
  experiment_type: biochemistry and genetics
