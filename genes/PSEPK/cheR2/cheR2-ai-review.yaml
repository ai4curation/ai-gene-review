id: Q88ER1
gene_symbol: cheR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  CheR2 (PP_4392) is the S-adenosyl-L-methionine-dependent chemoreceptor
  methyltransferase of the flagellar chemotaxis pathway of Pseudomonas putida
  KT2440. It is a monomeric cytoplasmic CheR-family enzyme (N-terminal
  CheR_N and C-terminal SAM-binding CheR_C domains) that transfers methyl
  groups from SAM to specific glutamate residues in the cytoplasmic signaling
  domain of methyl-accepting chemotaxis proteins, forming glutamate
  5-O-methyl esters. Of the three CheR paralogues of KT2440, only CheR2
  methylates the McpS and McpT chemoreceptors in vitro, and only the cheR2
  mutant is deficient in chemotaxis (toward malate and casamino acids), so
  CheR2 is the methyltransferase that drives receptor adaptation in the
  flagellar chemotaxis pathway, whereas CheR1 serves a biofilm-controlling
  chemosensory route. CheR2 binds its product S-adenosyl-L-homocysteine much
  more tightly than SAM, consistent with product feedback inhibition.
