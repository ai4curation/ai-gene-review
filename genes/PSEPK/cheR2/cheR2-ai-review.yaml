  review:
    summary: >-
      InterPro2GO mapping from the CheR methyltransferase signature
      (IPR000780). The claim is true: CheR2 is a SAM-dependent
      methyltransferase, but the term is a distant ancestor of the specific
      activity, protein-glutamate O-methyltransferase activity, that is
      established for this protein.
    action: MODIFY
    reason: >-
      Correct but general. CheR2 binds SAM and SAH (ITC) and methylates the
      McpS and McpT chemoreceptors in vitro (PMID:23677992), and the curated
      Swiss-Prot entry records the EC 2.1.1.80 protein-glutamate
      O-methyltransferase reaction. GO:0008983 protein-glutamate
      O-methyltransferase activity is an is_a descendant of GO:0008757 and is
      already carried by this gene (GO_REF:0000120 row), so the general term is
      refined to it rather than kept as a separate assertion.
    proposed_replacement_terms:
    - id: GO:0008983
      label: protein-glutamate O-methyltransferase activity
    supported_by:
    - reference_id: PMID:23677992
      supporting_text: Methylation assays show that CheR2, but not the other paralogues, methylates the McpS and McpT chemotaxis receptors.
    - reference_id: PMID:23677992
      supporting_text: these paralogues bind the product of the methylation reaction, S-adenosylhomocysteine, with much higher affinity (KD of 0.14-2.2 μM) than the substrate S-adenosylmethionine (KD of 22-43 μM)
