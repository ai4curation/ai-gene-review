  label: Pseudomonas putida KT2440
description: PP_5276 (UniProt Q88CA5) is a Pseudomonas putida KT2440 phospholipase D-superfamily protein
  with two PLD phosphodiesterase domains, each keeping the HxK(x4)D catalytic motif. It also carries a
  prokaryotic lipoprotein signature. PANTHER places it in the ClsC subfamily of cardiolipin synthases
  (PTHR21248:SF12) together with Escherichia coli ClsC, which, with its partner YmdB, forms cardiolipin
  by transferring a phosphatidyl group from phosphatidylethanolamine to phosphatidylglycerol. PP_5276
  is therefore a probable third KT2440 cardiolipin synthase, alongside ClsA and ClsB. Its phosphatidyl
  donor and any partner requirement have not been tested.
