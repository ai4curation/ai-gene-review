- term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Cardiolipin biosynthesis, inherited by TreeGrafter within the cardiolipin synthase family.
    action: ACCEPT
    reason: PAINT places cardiolipin biosynthetic process at the PTHR21248 root (PTN000478698), seeded
      by characterized cardiolipin synthases from every subfamily with data, including E. coli ClsC of
      SF12, the subfamily that contains PP_5276. Both catalytic HKD motifs are intact at a spacing
      comparable to E. coli ClsC, whose His130 and His369 are needed for cardiolipin formation. The process holds
      whichever phosphatidyl donor is used. The exact reaction is left at phosphatidyltransferase level,
      and the in vivo contribution is a knowledge gap. Previous notes left this row UNDECIDED pending
      KT2440 data; the motif analysis and the family-wide process are judged sufficient for this process-level
      claim.
    supported_by:
    - reference_id: file:PSEPK/PP_5276/PP_5276-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PTHR21248:SF12; CARDIOLIPIN SYNTHASE C; 1.
    - reference_id: file:PSEPK/PP_5276/PP_5276-bioinformatics/RESULTS.md
      supporting_text: That spacing is comparable to E. coli ClsC (130 and 369, 239 apart)
    - reference_id: PMID:22988102
      supporting_text: Mutation of the putative catalytic motif of ClsC prevents CL formation.
