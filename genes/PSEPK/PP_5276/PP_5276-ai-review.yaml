proposed_new_terms: []
suggested_questions:
- question: Does PP_5276 catalyze the PE-plus-PG ClsC reaction in KT2440, and does it require a partner
    analogous to E. coli YmdB?
- question: Is the predicted lipoprotein signature of PP_5276 used, so that the enzyme is lipid-anchored
    rather than peripherally bound like E. coli ClsC?
suggested_experiments:
- description: Reconstitute PP_5276 with PG and PE in proteoliposomes, test candidate partner proteins,
    and quantify cardiolipin in single and combinatorial synthase deletions.
