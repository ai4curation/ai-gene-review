suggested_questions:
  - question: Does PP_5276 catalyze the PE-plus-PG ClsC reaction in KT2440, and does it require a partner analogous to E. coli YmdB?
suggested_experiments:
  - description: >-
      Reconstitute PP_5276 with PG and PE in proteoliposomes, test candidate partner proteins, and quantify cardiolipin in single and combinatorial synthase deletions.
