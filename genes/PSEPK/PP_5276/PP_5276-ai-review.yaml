id: Q88CA5
gene_symbol: PP_5276
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_5276 encodes a two-PLD-domain phosphatidyltransferase-family protein assigned to the ClsC subfamily. It is a candidate for the chemically distinct phosphatidylethanolamine-plus-phosphatidylglycerol cardiolipin synthase route, but this reaction has not been demonstrated in KT2440.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Generic catalytic activity is too broad for this PLD-family protein.
      action: MODIFY
      reason: Use phosphatidyltransferase activity as the cautious current molecular-function assignment.
      supported_by:
        - reference_id: file:PSEPK/PP_5276/PP_5276-goa.tsv
          supporting_text: "GO:0003824\tcatalytic activity"
      proposed_replacement_terms:
        - id: GO:0030572
          label: phosphatidyltransferase activity
  - term:
      id: GO:0030572
      label: phosphatidyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Accept phosphatidyltransferase activity as a cautious PLD-family molecular-function assignment.
      action: ACCEPT
      reason: >-
        The protein has two PLD/transphosphatidylase domains and a PANTHER ClsC
        subfamily assignment, but current UniProt does not assign the exact
        PE-plus-PG reaction.
      supported_by:
        - reference_id: file:PSEPK/PP_5276/PP_5276-goa.tsv
          supporting_text: "GO:0030572\tphosphatidyltransferase activity"
  - term:
      id: GO:0032049
      label: cardiolipin biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Cardiolipin biosynthetic process is plausible but not resolved for this paralog.
      action: UNDECIDED
      reason: >-
        The annotation is computational. The ClsC-family assignment makes it
        plausible, but substrate-specific evidence in KT2440 is needed before
        cardiolipin biosynthesis is accepted as a core process.
      supported_by:
        - reference_id: file:PSEPK/PP_5276/PP_5276-goa.tsv
          supporting_text: "GO:0032049\tcardiolipin biosynthetic process"
