      The donor is unresolved, though: ClsA/ClsB-type enzymes use PG (GO:0008808) and E. coli ClsC uses
      PE (GO:0090483). So the generic parent is the appropriate level. The ARBA source is not cited; support
      is the family and motif evidence.'
