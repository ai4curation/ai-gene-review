- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct cellular component. Bacterial glutamate dehydrogenase is a soluble cytoplasmic homohexamer; the cytosol localization applied by TreeGrafter is consistent with the known localization of this enzyme family. Accept.
    action: ACCEPT
    reason: >-
      The entry has no signal peptide, no transmembrane segment and no lipobox,
      and the TreeGrafter assignment propagates from PANTHER node PTN002461478,
      whose characterized members are soluble cytoplasmic enzymes. A soluble
      NADP-dependent dehydrogenase acting on free L-glutamate and the cytosolic
      NADP(H) pool must act in the cytoplasm, so the location follows from the
      activity rather than being merely inherited.
    supported_by:
    - reference_id: file:PSEPK/gdhA/gdhA-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR43571; NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED; 1.
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: True but one level too general. GDH interconverts L-glutamate and 2-oxoglutarate, so the process it participates in is specifically glutamate metabolism, a direct child of this term.
    action: MODIFY
    reason: >-
      The InterPro signatures behind this row (IPR006095/IPR006096/IPR006097, the
      Glu/Leu/Phe/Val/Trp dehydrogenase family) are supplemented on the same record
      by the glutamate-dehydrogenase-specific IPR014362 and by the NADP-specific
      PANTHER family, so this row's evidence identifies which amino acid is
      concerned. GO:0006536 glutamate metabolic process is the direct child of
      GO:0006520 that names it. The metabolic-process term is the right level: no
      evidence establishes which direction predominates in KT2440, so neither
      L-glutamate biosynthesis (GO:0097054) nor L-glutamate catabolism (GO:0006538)
      can be asserted.
    proposed_replacement_terms:
    - id: GO:0006536
      label: glutamate metabolic process
    supported_by:
    - reference_id: file:PSEPK/gdhA/gdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR014362; Glu_DH.
    - reference_id: file:PSEPK/gdhA/gdhA-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR43571; NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED; 1.
