- term:
    id: GO:0004354
    label: L-glutamate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Core molecular function. This is the precise EC 1.4.1.4 activity matching the UniProt catalytic-activity statement (RHEA:11612) and the Glu/Leu/Phe/Val dehydrogenase family assignment (PIRSF000185, PANTHER NADP-specific glutamate dehydrogenase). Active-site and NAD(P)-binding residues annotated in UniProt support this. Strongly supported despite IEA evidence.
    action: ACCEPT
    reason: >-
      Three independent curated classification systems converge on NADP-specific
      glutamate dehydrogenase: the PIRSF/PIRNR Glu_DH superfamily rule, the
      NCBIfam PRK09414 model, and PANTHER PTHR43571. The PIRSR site rule also
      places the catalytic proton donor at residue 129 and NAD(P)-binding residues
      at 212 and 243, so the entry retains a complete, correctly positioned active
      site rather than being a degenerate family member. No experimental study of
      this enzyme in KT2440 is available, but nothing in the record or the family
      argues against the assignment.
    supported_by:
    - reference_id: file:PSEPK/gdhA/gdhA-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR43571; NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED; 1.
    - reference_id: file:PSEPK/gdhA/gdhA-uniprot.txt
