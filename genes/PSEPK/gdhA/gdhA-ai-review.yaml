    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: True of the gene but uninformative on its own - it does not say what is oxidized or what accepts the electrons - and it is entailed by the specific EC 1.4.1.4 activity asserted on another row.
    action: TOO_GENERAL
    reason: >-
      This is a judgement about the term, not about the row's evidence: the
      InterPro ELFV-dehydrogenase signatures that supplied it are sound. But
      GO:0016491 is a root-level activity term that is imprecise on its own, and
      GO:0004354 is asserted elsewhere in this review and entails it, so the row
      adds no information. Not REMOVE: the claim is true, and this row is one of
      several independent sources reinforcing the oxidoreductase assignment.
    supported_by:
