suggested_questions:
- question: Under which nitrogen and carbon regimes does KT2440 gdhA operate in the aminating (ammonium-assimilating) versus the deaminating (glutamate-catabolic) direction, and how does its contribution compare with the glutamine synthetase/glutamate synthase route?
- question: Is the KT2440 enzyme strictly NADP-dependent (EC 1.4.1.4), as the PANTHER and ARBA assignments imply, or does it also accept NAD+ like the dual-cofactor EC 1.4.1.3 enzymes that GO:0004353 covers?
- question: Is gdhA expression nitrogen-regulated in KT2440, and does a gdhA deletion impair growth on glutamate or on low ammonium as sole nitrogen source?
suggested_experiments:
- hypothesis: PP_0675 encodes a strictly NADP-dependent L-glutamate dehydrogenase (EC 1.4.1.4) rather than a dual-cofactor EC 1.4.1.3 enzyme.
  description: Express and purify recombinant PP_0675, then measure initial-rate kinetics in both directions with NADP+/NADPH and with NAD+/NADH, reporting kcat and Km for L-glutamate, 2-oxoglutarate, ammonium and each cofactor; confirm the quaternary structure by size-exclusion chromatography or native mass spectrometry.
  experiment_type: enzyme kinetics and biophysical characterization
- hypothesis: gdhA provides a low-affinity ammonium-assimilation route that is dispensable while GS/GOGAT is active but limiting during glutamate catabolism.
  description: Construct a clean gdhA deletion and a residue-129 active-site substitution in KT2440 and compare growth and 13C/15N flux on glutamate, on glutamine, and on glucose with high or low ammonium as sole nitrogen source, in otherwise wild-type and glnA/gltBD-compromised backgrounds.
  experiment_type: targeted genetics with isotopic flux analysis
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: The InterPro2GO pipeline mapped the Glu/Leu/Phe/Val/Trp dehydrogenase signatures IPR006095, IPR006096 and IPR006097 to amino acid metabolic process and oxidoreductase activity, and the glutamate-dehydrogenase-specific IPR014362 and IPR033922 to the CH-NH2/NAD(P) oxidoreductase term, so all three of this source's rows stop above the NADP-specific activity the same record states.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA rule ARBA00026338 assigned the cofactor-agnostic parent term GO:0004353, while other ARBA rules on the same entry assert the NADP-specific RHEA:11612 reaction and EC 1.4.1.4 - an internal inconsistency in precision rather than in chemistry.
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
  - statement: TreeGrafter grafted Q88Q23 into PANTHER node PTN002461478 and propagated cytosol, consistent with the soluble, signal-peptide-free architecture of the entry.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The combined pipeline asserted GO:0004354 from three concordant sources at once - RHEA:11612, EC 1.4.1.4 and PANTHER:PTN002461478 - which is why this row is the best-supported annotation on the entry despite being electronic.
