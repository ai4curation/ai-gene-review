  review:
    summary: Correct chemistry, but one level less precise than the evidence allows. GO:0004353 is the direct parent of GO:0004354 in GO, covering glutamate dehydrogenases of either cofactor specificity (the EC 1.4.1.3 dual-cofactor enzymes as well as the NAD- and NADP-specific ones).
