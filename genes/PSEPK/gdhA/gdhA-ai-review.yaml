    reason: >-
      The ARBA rule that supplied this row is the same source that supplies the
      entry's catalytic-activity statement, and that statement is NADP-specific
      (RHEA:11612, EC 1.4.1.4); PANTHER independently places the protein in the
      NADP-specific glutamate dehydrogenase family. This row's own evidence
      therefore supports the NADP-specific child term GO:0004354, which the gene
      already carries, so the correct-but-general parent is MODIFYed to it rather
      than kept.
    proposed_replacement_terms:
