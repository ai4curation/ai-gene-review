taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: SerA is the NAD-dependent D-3-phosphoglycerate dehydrogenase that oxidizes 3-phosphoglycerate
  to 3-phosphohydroxypyruvate in the first reaction of phosphorylated L-serine biosynthesis. The inferred
  enzyme also interconverts (R)-2-hydroxyglutarate and 2-oxoglutarate, but that secondary chemistry is
  not used to define its pathway role.
