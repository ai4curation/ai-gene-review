    label: phosphoglycerate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Accept the enzyme-specific function by conserved-family inference from
      characterized phosphoglycerate dehydrogenases.
    action: ACCEPT
    reason: >-
      Q88CM5 has the expected D-isomer-specific dehydrogenase architecture,
      including a nucleotide-binding domain, and characterized enzymes
      catalyze the 3-phosphoglycerate/phosphohydroxypyruvate reaction.
    supported_by:
