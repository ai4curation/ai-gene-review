    summary: >-
      Retain as a non-core cofactor-binding property distinct from the
      substrate-specific catalytic activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88CM5 contains NAD(P)-binding Rossmann-like and
      D-isomer-dehydrogenase nucleotide-binding domains.
    supported_by:
