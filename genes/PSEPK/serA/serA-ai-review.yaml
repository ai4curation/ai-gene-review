    label: L-serine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      Accept by conserved reaction-role inference within the phosphorylated
      L-serine pathway.
    action: ACCEPT
    reason: >-
      The characterized phosphoglycerate-dehydrogenase reaction supplies the
      first intermediate of the conserved three-step biosynthetic route.
    supported_by:
    - reference_id: PMID:22023909
      supporting_text: The phosphorylated pathway is the only anabolic source of L-serine in most organisms.
- term:
