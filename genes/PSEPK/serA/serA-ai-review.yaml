id: Q88CM5
gene_symbol: serA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SerA is an NAD-dependent D-3-phosphoglycerate dehydrogenase that
  oxidizes 3-phosphoglycerate to 3-phosphohydroxypyruvate in the first reaction
  of phosphorylated L-serine biosynthesis. It is also predicted to interconvert
  (R)-2-hydroxyglutarate and 2-oxoglutarate. A C-terminal ACT domain suggests
  potential amino-acid feedback regulation, but its effector response has not
  been tested in KT2440.
existing_annotations:
