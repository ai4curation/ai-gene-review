suggested_experiments:
- description: Test a clean serA deletion for serine auxotrophy and restore growth by L-serine supplementation
    or gene complementation.
suggested_questions:
- question: Does KT2440 SerA carry physiologically relevant (R)-2-hydroxyglutarate dehydrogenase flux
    in vivo?
- question: >-
