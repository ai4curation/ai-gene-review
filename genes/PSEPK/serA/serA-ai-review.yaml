    label: (S)-2-hydroxyglutarate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Wrong hydroxyglutarate stereoisomer for the assigned EC reaction.
    action: REMOVE
    reason: The entry assigns (R)-2-hydroxyglutarate dehydrogenase activity (GO:0120568), not the (S)-2-hydroxyglutarate
      activity represented here.
    supported_by:
