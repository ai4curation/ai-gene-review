id: Q88P94
gene_symbol: mlaF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  ABC-family ATPase subunit on the cytoplasmic face of the inner-membrane
  MlaFEDB complex. MlaF binds and hydrolyzes ATP to drive the transporter's
  phospholipid-transfer cycle and maintenance of diderm-envelope lipid
  organization.
existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Correct but redundant with the more specific ATP-binding annotation.
      action: MARK_AS_OVER_ANNOTATED
      reason: The ABC-family active site specifically binds ATP, making the generic nucleotide-binding parent uninformative.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Correct for the ABC-family ATPase, but ATP hydrolysis is the catalytic core function.
      action: KEEP_AS_NON_CORE
      reason: ATP binding is intrinsic to the catalytic cycle but is less informative than ATP hydrolysis activity.
  - term:
      id: GO:0006869
      label: lipid transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: Correct broad process for the Mla phospholipid transport system.
      action: MODIFY
      reason: MlaF supplies ATP-dependent energy coupling to phospholipid transport, and GO:0015914 captures that process more specifically than generic lipid transport.
      proposed_replacement_terms:
        - id: GO:0015914
          label: phospholipid transport
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: MlaF is the catalytic ATPase that energizes MlaFEDB.
      action: ACCEPT
      reason: Q88P94 contains the complete conserved ABC ATPase motif set and is encoded as the MlaF nucleotide-binding subunit.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: ISS
    original_reference_id: file:PSEPK/mlaF/mlaF-deep-research-openscientist.md
    qualifier: located_in
    review:
      summary: MlaF is peripherally associated with the cytoplasmic face of the inner membrane through MlaE/MlaD in MlaFEDB.
      action: NEW
      reason: Structural studies of orthologous MlaFEDB complexes place the MlaF nucleotide-binding dimer on the cytoplasmic face of the plasma membrane.
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: ISS
    original_reference_id: PMID:33236984
    qualifier: part_of
    review:
      summary: MlaF is the nucleotide-binding ATPase unit of MlaFEDB.
      action: NEW
      reason: The conserved MlaF architecture and primary structure of the orthologous assembled complex support MlaFEDB membership.
  - term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence_type: ISS
    original_reference_id: file:PSEPK/mlaF/mlaF-deep-research-openscientist.md
    qualifier: involved_in
    review:
      summary: MlaF energizes the MlaFEDB step of intermembrane phospholipid transfer.
      action: NEW
      reason: The MlaF family assignment and mlaFED operon context establish its role in the conserved Mla system without fixing net transport direction.
references:
  - id: PMID:33236984
    title: Structure of bacterial phospholipid transporter MlaFEDB with substrate bound.
    findings:
      - statement: Cryo-EM defines the MlaFEDB subunit architecture and a phospholipid pathway through MlaE and MlaD.
        supporting_text: >-
          A continuous transport pathway extends from the MlaE
          substrate-binding site, through the channel of MlaD, and into the periplasm.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Primary structural evidence on the assembled orthologous MlaFEDB complex.
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000104
    title: Electronic Gene Ontology annotations created by transferring manual GO annotations between related proteins based on shared sequence features
    findings: []
  - id: GO_REF:0000117
    title: Electronic Gene Ontology annotations created by ARBA machine learning models
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/mlaF/mlaF-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 MlaF (Q88P94)
    findings:
      - statement: UniProt identifies MlaF as the energy-coupling ATPase of MlaFEDB.
  - id: file:PSEPK/mlaF/mlaF-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK MlaF/Q88P94
    findings:
      - statement: Q88P94 contains the complete ABC-family nucleotide-binding and hydrolysis motif set.
        supporting_text: A motif scan of the actual 269-residue *P. putida* MlaF (Q88P94) confirms a complete, intact ABC nucleotide-binding active site
      - statement: The report places MlaF on the cytoplasmic face of the inner membrane as the MlaFEDB energy-coupling subunit.
        supporting_text: "MlaF is a **peripheral cytoplasmic-membrane protein**: the NBDs sit on the **cytoplasmic (inner) face of the inner membrane**"
      - statement: The report acknowledges that ATP coupling to lipid direction and individual transfer steps remains unresolved.
        supporting_text: precisely how ATP hydrolysis is coupled to the direction and steps of lipid movement is still debated and not fully resolved
