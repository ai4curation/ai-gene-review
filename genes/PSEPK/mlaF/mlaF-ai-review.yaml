knowledge_gaps:
  - gap_statement: The coupling between KT2440 MlaF ATP hydrolysis and net phospholipid-transfer direction has not been established directly.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: >-
      ATPase identity is secure, but the review does not convert debated
      system-level directionality into an MlaF-specific directional claim.
  - gap_statement: Q88P94 has not been tested directly in purified KT2440 MlaFEDB or by a KT2440 loss-of-function study.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: The first-pass assignment rests on diagnostic motifs, family and operon context, and structural work on orthologous complexes.
suggested_questions:
  - question: How does the KT2440 MlaF ATPase cycle couple to net phospholipid movement by MlaFEDB?
suggested_experiments:
  - description: Reconstitute KT2440 MlaFEDB and couple ATPase measurements to leaflet-resolved phospholipid transfer.
    experiment_type: coupled ATPase and lipid-transfer assay
