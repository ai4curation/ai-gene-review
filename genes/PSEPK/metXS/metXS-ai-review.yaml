suggested_questions:
- question: Does KT2440 rely primarily on the MetXS plus MetZ O-succinylhomoserine route
    under methionine-limited growth, or can the O-acetylhomoserine route substitute?
- question: Does the MetW requirement reported for MetXS activity reflect a stable MetW-MetXS complex,
    and is that complex feedback-inhibited by S-adenosylhomocysteine in P. putida as in P. aeruginosa?
suggested_experiments:
- description: Compare growth of metXS, metZ, and PP_2528 deletion strains in defined
    medium with and without methionine, homocysteine, or sulfide supplementation.
  experiment_type: targeted genetics and metabolite rescue
- description: Measure kcat/Km of purified MetXS, with and without MetW, for succinyl-CoA versus acetyl-CoA
    to quantify acyl-donor specificity on the defined protein.
  experiment_type: in vitro enzyme kinetics
