- term:
    id: GO:0071266
    label: '''de novo'' L-methionine biosynthetic process'
  evidence_type: IC
  original_reference_id: PMID:28581482
  qualifier: involved_in
  review:
    summary: MetXS catalyses the first committed step of de novo methionine synthesis, the formation of
      O-succinyl-L-homoserine; no process annotation for this step exists in GOA.
    action: NEW
    reason: The enzyme itself performs a step of the pathway (homoserine activation), so it participates
      rather than being merely required. Inferred from the experimentally determined activity (EXP row)
      plus the pathway placement of acyl-L-homoserine transferases. The same term is carried by the
      characterised homoserine acyltransferases of other organisms (S. pombe met6, E. coli metA).
    supported_by:
    - reference_id: PMID:28581482
      supporting_text: We tackled this issue for the MetA and MetX enzyme families, phylogenetically unrelated
        families of acyl-L-homoserine transferases involved in L-methionine biosynthesis.
    - reference_id: file:PSEPK/metXS/metXS-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Amino-acid biosynthesis; L-methionine biosynthesis via de novo pathway; O-succinyl-L-homoserine
