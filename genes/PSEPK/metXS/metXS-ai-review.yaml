id: Q88CT3
gene_symbol: metXS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: metXS (PP_5097) encodes a cytoplasmic homoserine O-succinyltransferase (EC 2.3.1.46)
  of the MetX family of alpha/beta-hydrolase-fold acyltransferases. It transfers the succinyl group
  of succinyl-CoA to the gamma-hydroxyl of L-homoserine, forming O-succinyl-L-homoserine, the first
  committed step of de novo L-methionine biosynthesis. Although most characterised MetX enzymes use
  acetyl-CoA, the Pseudomonas enzyme belongs to a succinyl-CoA-specific MetX lineage that arose in
  parallel with the unrelated succinyl-specific MetA enzymes; its activity requires the partner
  protein MetW. The O-succinylhomoserine is converted to homocysteine by direct sulfhydrylation or
  by the cystathionine route.
existing_annotations:
- term:
    id: GO:0004414
    label: homoserine O-acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00088393
  - PANTHER:PTN002426741
  review:
    summary: Electronic acetyltransferase assignment propagated from the MetX family default; contradicted
      by the experimentally determined succinyl-CoA specificity of this enzyme.
    action: REMOVE
    reason: The row combines an ARBA rule and a PANTHER family node, both encoding the assumption that
      MetX-fold enzymes are homoserine acetyltransferases. Bastard et al. (PMID:28581482) assayed the
      acyl-donor specificity of MetX/MetA family members and assigned this protein to the succinyl-CoA-using
      class (EC 2.3.1.46, ECO:0000269 in UniProt); the curated HAMAP rule and the NCBIfam MetX_succinyl
      model place it in the same class. No evidence shows acetyl-CoA use by this protein, so the row is a
      demonstrably wrong over-propagation of the acetyl default.
    supported_by:
    - reference_id: PMID:28581482
      supporting_text: Members of these families are prone to incorrect annotation because MetX and MetA
        enzymes are assumed to always use acetyl-CoA and succinyl-CoA, respectively.
    - reference_id: file:PSEPK/metXS/metXS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Transfers a succinyl group from succinyl-CoA to L-homoserine, forming succinyl-L-homoserine.
        {ECO:0000255|HAMAP-Rule:MF_00296, ECO:0000269|PubMed:28581482}.'
    - reference_id: file:PSEPK/metXS/metXS-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; NF047916; MetX_succinyl; 1.
    - reference_id: file:PSEPK/metXS/metXS-deep-research-openscientist.md
      supporting_text: "PP_5097 is a homoserine O-**succinyl**transferase (EC 2.3.1.46), not an acetyltransferase"
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: ARBA:ARBA00088393
      requested_change: CHECK
      asserted_value: GO:0004414
      corrected_value: GO:0008899
      corrected_label: homoserine O-succinyltransferase activity
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: P. putida MetXS (Q88CT3) is experimentally a homoserine O-succinyltransferase
        (PMID:28581482, recorded in the entry with ECO:0000269), yet receives homoserine O-acetyltransferase
        activity via ARBA00088393 and PANTHER node PTN002426741 (GO_REF:0000120). The rule should exclude
        succinyl-specific MetX proteins (e.g. HAMAP MF_00296 succinyl case, NCBIfam NF047916).
