- id: PMID:28581482
  title: Parallel evolution of non-homologous isofunctional enzymes in methionine
    biosynthesis.
  findings:
  - statement: Large-scale enzymology of MetA- and MetX-family acyl-L-homoserine transferases shows that
      acyl-donor specificity (acetyl- versus succinyl-CoA) does not follow family membership.
    supporting_text: We tackled this issue for the MetA and MetX enzyme families, phylogenetically unrelated
      families of acyl-L-homoserine transferases involved in L-methionine biosynthesis.
  - statement: Exclusive succinyl-CoA use evolved from an acetyl-CoA ancestral state in recent bacterial lineages.
    supporting_text: suggest that acetyl-CoA was originally the sole substrate of these isofunctional
      enzymes, which evolved to use exclusively succinyl-CoA in the most recent bacteria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache (Nat Chem Biol, not open access). The gene-level succinyl-CoA result
      for Q88CT3 and the MetW requirement are taken from UniProt's ECO:0000269 citations of this paper.
