- id: PMID:8155731
  title: 'Characterization of polyprenyldiphosphate: 4-hydroxybenzoate polyprenyltransferase
    from Escherichia coli.'
  findings:
  - statement: Enriched E. coli UbiA is membrane-bound, Mg2+-dependent and accepts GPP, FPP
      and solanesyl-PP as donors.
    supporting_text: The enzyme is membrane-bound and could not be solubilized by hypotonic
      buffer or detergent treatment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Shows donor-chain flexibility, relevant to the C45 donor
      of P. putida.
- id: file:PSEPK/ubiA/ubiA-uniprot.txt
  title: UniProt entry Q88C65 for ubiA
  findings:
  - statement: >-
      Reviewed entry (HAMAP MF_01635) assigns an integral inner-membrane
      4-hydroxybenzoate polyprenyltransferase. The FUNCTION text names ubiquinone-8 and an
      octaprenyl product, inherited from the E. coli-based rule; KT2440 makes ubiquinone-9.
- id: file:PSEPK/ubiA/ubiA-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK ubiA
  findings:
  - statement: >-
      Ortholog biochemistry, the UbiA fold, intact Q88C65 Asp-rich motifs and database
      annotations converge on a membrane polyprenyltransferase with flexible all-trans
      donor-chain acceptance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Consistent with UniProt and the E. coli literature; leaves the KT2440 protein as an
      orthology and sequence-motif inference rather than a directly assayed enzyme.
