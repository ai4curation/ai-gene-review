id: Q88C65
gene_symbol: ubiA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiA (PP_5318) encodes 4-hydroxybenzoate polyprenyltransferase (UbiA prenyltransferase
  family, EC 2.5.1.39), a magnesium-dependent polytopic inner-membrane enzyme with eight
  predicted transmembrane helices. It transfers an all-trans polyprenyl chain from a
  polyprenyl diphosphate to C-3 of 4-hydroxybenzoate, forming 3-polyprenyl-4-hydroxybenzoate,
  the first membrane-anchored intermediate of ubiquinone biosynthesis. In Pseudomonas
  putida the donor is nonaprenyl diphosphate, giving ubiquinone-9. ubiA lies immediately
  downstream of ubiC (PP_5317), which supplies the 4-hydroxybenzoate. Function is inferred
  from the UbiA family and the characterized Escherichia coli enzyme; the KT2440 protein has
  not been assayed.
