  review:
    summary: >-
      InterPro2GO (IPR006370, 4-hydroxybenzoate polyprenyltransferase-like) assigns generic
      prenyltransferase activity. Correct but general; the specific activity is carried by
      this gene.
    action: MODIFY
    reason: >-
      True but less specific than the evidence supports. The protein is a HAMAP MF_01635 and
      NCBIfam TIGR01474 (ubiA_proteo) member whose reaction is the polyprenylation of
      4-hydroxybenzoate, so the informative term is GO:0008412, which this gene already
      carries from the UniRule pipeline.
    proposed_replacement_terms:
    - id: GO:0008412
      label: 4-hydroxybenzoate polyprenyltransferase activity
    supported_by:
    - reference_id: file:PSEPK/ubiA/ubiA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the prenylation of para-hydroxybenzoate (PHB) with an all-trans
        polyprenyl group.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  - PANTHER:PTN004223178
  - UniRule:UR000081061
  review:
    summary: >-
      HAMAP MF_01635 cell inner membrane, multi-pass. Correct and core: UbiA is an integral
      cytoplasmic-membrane enzyme.
    action: ACCEPT
    reason: >-
      Phobius predicts eight transmembrane helices in Q88C65, and the E. coli ortholog is
      membrane-bound and cannot be solubilized by detergent. The bacterial cell inner
      membrane is the plasma membrane. PAINT places plasma membrane at PTHR11048 node
      PTN000114159 seeded by bacterial UbiA proteins, consistent with this row.
    supported_by:
    - reference_id: file:PSEPK/ubiA/ubiA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane {ECO:0000255|HAMAP-Rule:MF_01635};
        Multi-pass membrane protein'
    - reference_id: PMID:8155731
      supporting_text: The enzyme is membrane-bound and could not be solubilized by hypotonic
        buffer or detergent treatment.
    - reference_id: PMID:4552989
      supporting_text: Both the side-chain precursor and 4-hydroxybenzoate octaprenyltransferase
        were shown to be membrane-bound.
- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN004223178
  - UniRule:UR000081061
  - UniPathway:UPA00232
  review:
    summary: >-
      Core process. UbiA catalyses the prenylation step that joins the aromatic head group
      to the isoprenoid tail.
    action: ACCEPT
    reason: >-
      UbiA performs a pathway step, so it does work within ubiquinone biosynthesis. E. coli
      ubiA mutants lack the activity and cannot convert 4-hydroxybenzoate to
      3-octaprenyl-4-hydroxybenzoate. PAINT also annotates GO:0006744 at the bacterial UbiA
      node PTN000114231.
    supported_by:
    - reference_id: file:PSEPK/ubiA/ubiA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Mediates the second step in the final reaction sequence of ubiquinone-8
        (UQ-8) biosynthesis, which is the condensation of the polyisoprenoid side chain with
        PHB, generating the first membrane-bound Q intermediate 3-octaprenyl-4-hydroxybenzoate.
    - reference_id: PMID:4552989
      supporting_text: The ubiA(-) mutants were found to lack 4-hydroxybenozate octaprenyltransferase
        activity, which suggested that the ubiA gene is the structural gene coding for this
        enzyme.
- term:
    id: GO:0008412
    label: 4-hydroxybenzoate polyprenyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:27782
  - EC:2.5.1.39
  - PANTHER:PTN004223178
  - UniRule:UR000081061
  review:
    summary: >-
      Core molecular function (EC 2.5.1.39). The GO term is chain-length neutral
      ("an all-trans-polyprenyl diphosphate"), which fits the nonaprenyl donor of KT2440.
    action: ACCEPT
    reason: >-
      Q88C65 is a HAMAP MF_01635/TIGR01474 UbiA with the conserved Asp-rich Mg2+-binding
      motifs. The characterized E. coli enzyme accepts several all-trans polyprenyl
      diphosphates including solanesyl (C45) diphosphate, the chain used for ubiquinone-9.
      GO:0008412 is also carried by the gammaproteobacterial PAINT node PTN001666047 seeded
      by E. coli UbiA. The HAMAP reaction is written with the octaprenyl donor of E. coli;
      the generic GO term is the better description for KT2440.
    supported_by:
    - reference_id: file:PSEPK/ubiA/ubiA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the prenylation of para-hydroxybenzoate (PHB) with an all-trans
        polyprenyl group.
    - reference_id: PMID:8155731
      supporting_text: Geranyldiphosphate (GPP), all-trans-farnesyldiphosphate (FPP) and all-trans-solanesyldiphosphate
        (SPP) are accepted as side chain precursors.
    - reference_id: file:PSEPK/ubiA/ubiA-deep-research-openscientist.md
      supporting_text: UbiA (PP_5318, Q88C65) catalyzes the membrane-associated condensation
        of 4-hydroxybenzoate with a polyprenyl-diphosphate donor
