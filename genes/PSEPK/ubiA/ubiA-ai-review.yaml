suggested_questions:
- question: >-
    Does PP_5318 discriminate among polyprenyl diphosphate chain lengths, or is the
    ubiquinone-9 chain length set entirely by the IspB product pool in KT2440?
suggested_experiments:
- description: >-
    Express PP_5318 in membranes, assay 4-hydroxybenzoate prenylation with geranyl, farnesyl,
    octaprenyl and solanesyl diphosphates, and test complementation of an E. coli ubiA
    mutant.
