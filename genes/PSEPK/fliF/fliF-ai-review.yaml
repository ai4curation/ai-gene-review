  label: Pseudomonas putida KT2440
description: >-
  FliF is the integral membrane structural subunit that oligomerizes to form the
  flagellar MS ring. The ring anchors the export apparatus and cytoplasmic switch
  complex during basal-body assembly; FliF is not itself a motor enzyme.
