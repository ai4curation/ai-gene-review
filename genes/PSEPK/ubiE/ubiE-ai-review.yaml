- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000030800
  review:
    summary: >-
      UniRule process term. UbiE makes the respiratory quinone but does not itself take part
      in respiratory electron transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Ubiquinone is needed for aerobic respiration, and E. coli ubiE mutants grow poorly on
      succinate, but that is a downstream requirement for the product. UbiE performs no step of
      respiration itself; its process is ubiquinone biosynthesis (accepted).
    supported_by:
    - reference_id: PMID:9045837
      supporting_text: Disruption of o251 in a wild-type parental strain produced a mutant with
        defects in growth on succinate and in both ubiquinone and menaquinone synthesis.
- term:
    id: GO:0009234
    label: menaquinone biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000030800
  - UniPathway:UPA00079
  review:
    summary: >-
      HAMAP rule transfer of the E. coli dual role. Wrong for KT2440, which has no menaquinone
      pathway.
    action: REMOVE
    reason: >-
      The HAMAP rule MF_01813 is unconditional and transfers menaquinone biosynthesis to every
      MenG/UbiE member. KT2440 lacks the upstream menaquinone genes (menA and menD searches
      return no hits) and makes no menaquinone, so PP_5011 cannot take part in the process in
      this organism. This is an over-propagated rule annotation, not a statement about the
      protein's chemistry (see the GO:0043770 row).
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__ubiquinone_biosynthesis__ppu00130-deep-research-openscientist.md
      supporting_text: not present in KT2440 (proteome searches for *menA* and *menD* return
        zero hits)
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0009234
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        UniRule UR000030800 (HAMAP MF_01813) assigns menaquinone biosynthesis to UbiE in
        Pseudomonas putida KT2440, which lacks menaquinone biosynthesis genes (no menA or menD)
        and makes only ubiquinone. A taxonomic or pathway-presence condition on the menaquinone
        part of the rule would avoid this transfer.
      supported_by:
      - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__ubiquinone_biosynthesis__ppu00130-deep-research-openscientist.md
        supporting_text: not present in KT2440 (proteome searches for *menA* and *menD* return
          zero hits)
