id: Q88D17
gene_symbol: ubiE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiE (PP_5011) encodes the ubiquinone/menaquinone biosynthesis C-methyltransferase UbiE
  (MenG/UbiE family of class I SAM-dependent methyltransferases). It transfers a methyl group
  from S-adenosyl-L-methionine to C-2 of 2-methoxy-6-polyprenyl-1,4-benzoquinol, the ring
  C-methylation of ubiquinone biosynthesis, between the UbiH and Coq7 hydroxylations. ubiE is
  the first gene of a ubiE-ubiJ-ubiB cluster (PP_5011-PP_5013). In Escherichia coli UbiE also
  methylates demethylmenaquinol, but Pseudomonas putida KT2440 has no menaquinone pathway and
  uses ubiquinone-9 as its sole respiratory quinone. Function is inferred from the family and
  E. coli UbiE; the KT2440 protein has not been assayed.
