- term:
    id: GO:0043770
    label: demethylmenaquinone methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:42640
  - EC:2.1.1.163
  - UniRule:UR000030800
  review:
    summary: >-
      The E. coli ortholog has this activity, but KT2440 makes no demethylmenaquinol, so the
      activity has no physiological substrate in this organism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      E. coli UbiE methylates both quinones, and PP_5011 may well retain the chemistry, so the
      activity is not contradicted. But KT2440 lacks the menaquinone pathway that would supply
      demethylmenaquinol. The capacity is plausible yet untested and without a substrate in
      vivo, so it is not a function of the protein in this organism.
    supported_by:
    - reference_id: PMID:9045837
      supporting_text: The data presented identify the E. coli UbiE polypeptide and provide evidence
        that it is required for the C methylation reactions in both ubiquinone and menaquinone
        biosynthesis.
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__ubiquinone_biosynthesis__ppu00130-deep-research-openscientist.md
      supporting_text: not present in KT2440 (proteome searches for *menA* and *menD* return
        zero hits)
