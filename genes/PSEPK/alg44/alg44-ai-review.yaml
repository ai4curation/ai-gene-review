      action: ACCEPT
      reason: The periplasmic domain is part of the core envelope-spanning topology through which Alg44 organizes nascent-polymer passage.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
