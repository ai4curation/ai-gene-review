      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Alg44 contains the conserved cyclic-di-GMP-binding PilZ domain.
      action: ACCEPT
      reason: The domain assignment and established Alg44 mechanism support this exact regulatory binding function.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: PilZ_domain
  - term:
