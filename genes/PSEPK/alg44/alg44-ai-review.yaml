id: Q88NC6
gene_symbol: alg44
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Alg44 is an inner-membrane regulatory copolymerase subunit of the Pseudomonas
  alginate synthase. Its N-terminal cytoplasmic PilZ domain binds
  cyclic-di-GMP, coupling the second messenger to activation of the
  membrane-embedded Alg8 catalytic subunit, while its periplasmic region helps
  organize nascent-polymer passage through the envelope-spanning machinery.
