      id: GO:0047643
      label: alginate synthase activity
    evidence_type: ISS
    original_reference_id: PMID:25968647
    qualifier: contributes_to
    review:
      summary: Alg44 is the non-catalytic regulatory copolymerase subunit of the Alg8-Alg44 synthase.
      action: NEW
      reason: A contributes-to qualifier distinguishes its essential complex contribution from Alg8 catalysis.
      supported_by:
        - reference_id: PMID:25968647
          supporting_text: c-di-GMP-mediated activation of alginate polymerization by the PilZAlg44 domain and Alg8
