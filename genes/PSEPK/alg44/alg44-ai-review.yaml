taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Alg44 is a cyclic-di-GMP-responsive component of the Pseudomonas putida KT2440
  alginate synthase. Its PilZ domain supports second-messenger recognition, while the conserved
  membrane/periplasmic architecture links the Alg8 polymerase to the secretion machinery.
  Ortholog ligand-binding, interaction and genetic experiments support a regulatory copolymerase
  role; Alg44 is not itself the glycosyltransferase that forms the polymer.
