id: Q88NC6
gene_symbol: alg44
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Alg44 is the regulatory copolymerase subunit of the Pseudomonas alginate
  synthase. Its PilZ domain binds cyclic-di-GMP, coupling the second messenger
  to activation of the membrane-embedded Alg8 catalytic subunit, while its
  envelope-spanning architecture helps organize nascent-polymer passage into
  the periplasm.
existing_annotations:
  - term:
      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Alg44 contains the conserved cyclic-di-GMP-binding PilZ domain.
      action: ACCEPT
      reason: The domain assignment and established Alg44 mechanism support this exact regulatory binding function.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: PilZ_domain
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: A large Alg44 domain faces the periplasm as part of the envelope-spanning synthase complex.
      action: KEEP_AS_NON_CORE
      reason: The location is compatible with the reviewed record but does not capture the complete membrane topology or regulatory role.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
  - term:
      id: GO:0042121
      label: alginic acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000041
    qualifier: involved_in
    review:
      summary: Alg44 is required for the Alg8-dependent polymerization step in alginate biosynthesis.
      action: ACCEPT
      reason: The reviewed record, Alg44-specific domains, operon context, and ortholog mechanism consistently support this process.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: Required for alginate biosynthesis
  - term:
      id: GO:0047643
      label: alginate synthase activity
    evidence_type: ISS
    original_reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-polymerization-export__ppu00543-deep-research-openscientist.md
    qualifier: contributes_to
    review:
      summary: Alg44 is the non-catalytic regulatory copolymerase subunit of the Alg8-Alg44 synthase.
      action: NEW
      reason: A contributes-to qualifier distinguishes its essential complex contribution from Alg8 catalysis.
      supported_by:
        - reference_id: file:PSEPK/alg44/alg44-uniprot.txt
          supporting_text: Required for alginate biosynthesis
