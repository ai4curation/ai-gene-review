    label: aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: EC 1.2.1.3 and the AldB/AcoD-like family support NAD-dependent aldehyde oxidation.
    action: ACCEPT
    reason: >-
      This is the substrate-generic NAD-dependent ALDH activity directly
      supported by the KT2440 EC assignment. Locus adjacency does not establish
      acetaldehyde as the preferred substrate.
    supported_by:
    - reference_id: file:PSEPK/aldB-I/aldB-I-uniprot.txt
      supporting_text: EC=1.2.1.3
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The ARBA term leaves cofactor specificity ambiguous despite the EC 1.2.1.3 assignment.
    action: MODIFY
    reason: >-
      UniProt EC mapping supports the NAD+-specific child GO:0004029, but does
      not establish a specific aldehyde substrate.
    proposed_replacement_terms:
    - id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    supported_by:
    - reference_id: file:PSEPK/aldB-I/aldB-I-uniprot.txt
