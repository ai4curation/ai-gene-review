- term:
    id: GO:0046336
    label: ethanolamine catabolic process
  evidence_type: IC
  original_reference_id: GO:0140087
  qualifier: involved_in
  review:
    summary: AldB-I is the strongest candidate for oxidizing EutBC-derived acetaldehyde in the compact KT2440 locus.
    action: NEW
    reason: >-
      The non-acylating enzyme is not classical EutE, but its exact adjacency to
      transporter-eutBC and acetaldehyde-compatible family make pathway
      participation a defensible inference. Direct genetic confirmation remains needed.
    supported_by:
    - reference_id: PMID:19783625
      supporting_text: >-
        Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into
        acetaldehyde and ammonia, is encoded by the gene tandem eutBC.
