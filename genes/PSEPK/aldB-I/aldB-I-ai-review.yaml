  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad InterPro parent adds no information beyond the specific aldehyde-dehydrogenase chemistry.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain the more informative NAD-dependent aldehyde-dehydrogenase term as the core annotation.
