  qualifier: enables
  review:
    summary: EC 1.2.1.3 and the AldB/AcoD-like family support NAD-dependent aldehyde oxidation.
    action: MODIFY
    reason: >-
      The generic EC term is chemically correct, but the locus and exact
      AldB/AcoD-like family support acetaldehyde as the most relevant substrate.
      GO:0140087 captures the non-acylating acetaldehyde-to-acetate reaction
      without confusing this protein with CoA-dependent EutE.
    proposed_replacement_terms:
    - id: GO:0140087
      label: acetaldehyde dehydrogenase (NAD+) activity
    supported_by:
