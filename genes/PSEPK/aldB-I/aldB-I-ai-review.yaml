  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AldB-I (PP_0545) is a soluble, non-acylating NAD-dependent aldehyde
  dehydrogenase of the AldB/AcoD-like family. Its position immediately beside
  the ethanolamine transporter and eutBC makes oxidation of EutBC-derived
  acetaldehyde to acetate a strong physiological hypothesis, but direct KT2440
  substrate-specific or pathway evidence is not yet available.
