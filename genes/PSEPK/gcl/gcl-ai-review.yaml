id: Q88F03
gene_symbol: gcl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  gcl encodes glyoxylate carboligase, a thiamine-diphosphate enzyme in the
  glyoxylate/tartronate semialdehyde branch. It condenses two glyoxylate
  molecules to 2-hydroxy-3-oxopropanoate (tartronate semialdehyde), linking
  glyoxylate catabolism to downstream glycerate formation in KT2440.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Magnesium binding is consistent with the TPP-dependent glyoxylate carboligase enzyme family.
    action: ACCEPT
    reason: The UniProt record lists a magnesium cofactor and InterPro supports the TPP-enzyme domain architecture; TPP-family enzymes bind Mg2+ to anchor the ThDP cofactor.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: "CC   -!- SIMILARITY: Belongs to the TPP enzyme family."
    - reference_id: file:PSEPK/gcl/gcl-deep-research-openscientist.md
      supporting_text: "Family members (AHAS, pyruvate oxidase) are typically oligomeric with tightly bound TPP/FAD/Mg²⁺"
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Catalytic activity is true but too broad for this enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: Tartronate-semialdehyde synthase activity captures the specific reaction catalyzed by Gcl, so the root catalytic activity term adds nothing.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01504; glyox_carbo_lig; 1."
- term:
    id: GO:0005948
    label: acetolactate synthase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: This TreeGrafter complex annotation appears to be over-propagated from related TPP enzymes and is not appropriate for glyoxylate carboligase.
    action: REMOVE
    reason: Gcl belongs to the glyoxylate carboligase subfamily of TPP enzymes (InterPro IPR006397; PANTHER PTHR18968:SF14), not to the acetolactate synthase lineage, and is not an acetolactate synthase complex subunit.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR006397; Glyox_carbo_lig."
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR18968:SF14; GLYOXYLATE CARBOLIGASE; 1."
- term:
    id: GO:0009028
    label: tartronate-semialdehyde synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the specific core catalytic activity of Gcl.
    action: ACCEPT
    reason: Gcl is a member of the glyoxylate carboligase family (NCBIfam TIGR01504 glyox_carbo_lig), which defines the condensation of two glyoxylate molecules to tartronate semialdehyde and CO2; GOA carries Rhea/EC-supported tartronate-semialdehyde synthase activity. Support is family-membership based.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01504; glyox_carbo_lig; 1."
    - reference_id: file:PSEPK/gcl/gcl-deep-research-openscientist.md
      supporting_text: "The **primary function** of the Gcl gene product is to catalyze the decarboxylative condensation of **two molecules of glyoxylate** into **tartronate semialdehyde**"
- term:
    id: GO:0009099
    label: L-valine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The valine biosynthesis annotation is not supported for this glyoxylate carboligase and likely reflects TPP-enzyme family over-propagation.
    action: REMOVE
    reason: The gene product falls in the glyoxylate carboligase subfamily (PANTHER PTHR18968:SF14) acting in glyoxylate catabolism, not acetolactate synthase or a valine-biosynthetic enzyme.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR18968:SF14; GLYOXYLATE CARBOLIGASE; 1."
- term:
    id: GO:0009436
    label: glyoxylate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Gcl directly consumes glyoxylate in the glyoxylate carboligase branch.
    action: ACCEPT
    reason: The specific reaction condenses two glyoxylate molecules to tartronate semialdehyde and CO2.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR006397; Glyox_carbo_lig."
    - reference_id: file:PSEPK/gcl/gcl-deep-research-openscientist.md
      supporting_text: "This is the classic \"glycerate pathway\" of glyoxylate assimilation, and Gcl is its gatekeeper."
- term:
    id: GO:0030976
    label: thiamine pyrophosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: TPP binding is expected for this glyoxylate carboligase.
    action: ACCEPT
    reason: The protein is a TPP-enzyme family member and the catalytic reaction is TPP-dependent.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR045229; TPP_enz."
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: FAD binding is plausible cofactor context for glyoxylate carboligase, but the catalytic role is better captured by tartronate-semialdehyde synthase activity.
    action: KEEP_AS_NON_CORE
    reason: OpenScientist and family evidence support Gcl as a ThDP/TPP-family enzyme with FAD binding; FAD is retained as cofactor context rather than treated as the core function.
    supported_by:
    - reference_id: file:PSEPK/gcl/gcl-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR029035; DHS-like_NAD/FAD-binding_dom."
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
  - statement: TreeGrafter supplied acetolactate/valine annotations that do not fit the specific glyoxylate carboligase role; the FAD-binding annotation is retained as non-core cofactor context.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/gcl/gcl-uniprot.txt
  title: UniProtKB entry for gcl
  findings:
  - statement: UniProt describes Gcl as glyoxylate carboligase with the glyoxylate-to-tartronate-semialdehyde reaction.
- id: file:PSEPK/gcl/gcl-goa.tsv
  title: GOA annotations for gcl
  findings:
  - statement: GOA includes tartronate-semialdehyde synthase activity and glyoxylate catabolic process.
- id: file:PSEPK/gcl/gcl-deep-research-openscientist.md
  title: OpenScientist deep research report for gcl
  findings:
  - statement: OpenScientist supported Gcl as a cytosolic glyoxylate carboligase/tartronate-semialdehyde synthase and corrected the earlier interpretation of FAD binding as plausible cofactor context.
  - statement: OpenScientist treated Q88F03 as FAD-dependent by transferring E. coli Gcl cofactor biochemistry and AHAS/pyruvate-oxidase family architecture.
    supporting_text: "The Gcl enzyme is a thiamine-pyrophosphate (TPP)- and FAD-dependent enzyme."
    finding_review:
      finding_status: DISPUTED
      review_notes: >-
        FAD use for Q88F03 remains a homology/family inference. The sidecar
        grounds FAD in E. coli Gcl biochemistry plus AHAS-family/domain
        conservation rather than a direct KT2440 cofactor assay, so it can
        support only a non-core FAD-binding annotation.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      On-target provider report that correctly supports glyoxylate carboligase
      family placement. Its FAD-dependence wording is inferred from direct E.
      coli ortholog biochemistry and AHAS-family/domain conservation rather
      than a direct Q88F03 cofactor assay, so the FAD-binding GO row should
      remain non-core.
