taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ribD (PP_0514) of Pseudomonas putida KT2440 encodes the bifunctional riboflavin biosynthesis
  protein RibD. Its N-terminal cytidine deaminase-like domain is a zinc-dependent deaminase that removes
  the 2-amino group of the GTP cyclohydrolase II product, and its C-terminal RibD_C domain is an NAD(P)H-dependent
  reductase that reduces the ribosyl side chain to a ribityl chain. Together the two domains carry out
  steps 2 and 3 of the GTP branch of riboflavin biosynthesis in the bacterial order (deamination before
  reduction). Function is inferred from family membership with the characterised E. coli and B. subtilis
  orthologues.
