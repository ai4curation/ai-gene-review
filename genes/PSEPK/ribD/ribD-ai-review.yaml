    summary: InterPro mapping of zinc ion binding from the cytidine/deoxycytidylate deaminase zinc-binding
      signature of the N-terminal deaminase domain.
    action: KEEP_AS_NON_CORE
    reason: 'True: the RibD deaminase domain belongs to the cytidine deaminase superfamily, which uses
      a catalytic zinc, and the PIRSF rule annotates one zinc and its catalytic ligands. Zinc binding
      is a cofactor property of the deaminase activity, not a separate function.'
