- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: A Rieske-like fold does not establish a canonical 2Fe-2S binding site in NirD.
    action: REMOVE
    reason: The target sequence has Cys18, Cys95, and only one histidine, His87, incompatible with
      the canonical Rieske two-cysteine/two-histidine ligand set. Independent NirD-specific family
      membership and the cofactor-free M. tuberculosis NirD structure support a fold-level electronic
      over-transfer. The structure is comparative, not a native KT2440 cofactor measurement.
    supported_by:
    - *id001
    - reference_id: PMID:22965870
      supporting_text: it does not contain any Fe-S cluster or other cofactors that might be involved
        in electron transfer
    - reference_id: file:PSEPK/nirD/nirD-source-analysis/README.md
      supporting_text: Q88M68 contains cysteines at positions 18 and 95 and a single histidine at
