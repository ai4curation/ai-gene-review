taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NirD (PP_1706) is the small accessory component of the assimilatory NirBD nitrite reductase
  in Pseudomonas putida KT2440. It supports the neighboring catalytic subunit NirB during nitrite
  reduction to ammonium. Its Rieske-related fold is predicted to lack the canonical iron-sulfur cofactor,
  based on its ligand sequence and the cofactor-free structure of a characterized NirD homolog.
