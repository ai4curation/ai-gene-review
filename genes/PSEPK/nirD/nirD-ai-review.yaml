- id: PMID:32523942
  title: A Nitrate-Blind P. putida Strain Boosts PHA Production in a Synthetic Mixed Culture.
  findings:
  - statement: The introduction cites PP_1705 and PP_1706 as the assigned KT2440 assimilatory nitrite
      reductase.
    supporting_text: nirBD (PP_1705, PP_1706)
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The quoted locus assignment is introduction/background citing earlier work; this
      paper directly perturbs nasT rather than assaying NirD.
- id: PMID:35285712
  title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon
    Sequencing.'
  findings:
  - statement: Native KT2440 pooled-mutant fitness supports nitrate uptake by PP_2092; the nitrate-condition
      fitness score is −2.6.
    supporting_text: We were also able to identify a distinct nitrate transporter PP_2092 (−2.6).
  - statement: Absence of a significant nitrite-condition phenotype does not exclude redundant or
      conditional nitrite transport.
    supporting_text: However, no significant phenotype could be detected for this gene in the nitrite
      condition, suggesting that it may be specific to nitrate.
  - statement: The paper reports NarB and combined NirDB pathway phenotypes, without assigning the
      displayed combined NirDB score to each individual subunit.
    supporting_text: The enzymes associated with the initial steps of the assimilatory nitrogen system
      in P. putida are the reductases NarB and NirDB, for which we see significant growth phenotypes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text and Figure 3 inspected. PP_2092 is explicitly identified.
      NarB and combined NirDB figure labels are not treated as locus-specific quantitative measurements
      for PP_1703, NirB, or NirD.
- id: PMID:38000372
  title: Cyclic di-GMP inhibits nitrate assimilation by impairing the antitermination function of
    NasT in Pseudomonas putida.
  findings:
  - statement: Native KT2440 experiments identify the nirBD operon and show NasT-dependent nirB transcription.
    supporting_text: the NalA-encoding sequence (nalA) is located upstream of the nirBD operon (PP_1705-PP_1706).
  - statement: Loss of nasT prevents induction downstream of the leader terminator.
    supporting_text: the induction of nirB expression was abolished in ΔnasT, while the induction
      of nalA expression was not affected in ΔnasT
  - statement: Nitrite-reductase activity was measured in cell lysate with an artificial electron
      donor; this does not identify the physiological pyridine nucleotide.
    supporting_text: 3 mM methyl viologen, 1 mM KNO2, 17 mM Na2S2O4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. NasT/c-di-GMP perturbations, NirB protein detection, and
      lysate activity establish native regulatory and pathway context; there is no purified KT2440
      NirBD donor-specificity or direct NirD-reconstitution experiment.
- id: PMID:41980646
  title: The nirB and nirD genes are essential for both assimilatory and dissimilatory reduction
    of nitrite in Pseudomonas putida Y-9 under aerobic conditions.
  findings:
  - statement: In the distinct P. putida Y-9 strain, deletion of either nirB or nirD impairs nitrite
      reduction.
    supporting_text: Deletion of nirB or nirD severely impaired NO2- reduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only comparative primary evidence. Y-9 isotope-tracing and aerobic ANRA/DNRA
      phenotypes are not transferred as experimentally demonstrated KT2440 physiology or donor specificity.
- id: file:PSEPK/nirD/nirD-source-analysis/README.md
  title: file:PSEPK/nirD/nirD-source-analysis/README.md
  findings:
