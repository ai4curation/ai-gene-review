id: Q88M68
gene_symbol: nirD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  NirD (PP_1706) is the small accessory subunit of the assimilatory NirBD
  nitrite reductase complex in Pseudomonas putida KT2440. It has a
  Rieske-related fold but lacks an iron-sulfur cluster or other cofactor and is
  not an independent catalyst. NirD supports the adjacent catalytic large
  subunit NirB during reduction of nitrite to ammonium for nitrate assimilation.
existing_annotations:
  - term:
      id: GO:0008942
      label: nitrite reductase [NAD(P)H] activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NirD contributes to this complex activity but does not independently enable it.
      action: MODIFY
      reason: >-
        Q88M68 is a 120-residue accessory subunit lacking the
        siroheme catalytic center, FAD/NAD(P)-binding region, and nitrite-binding
        machinery present in NirB. The term is appropriate only with a
        contributes_to qualifier in the NirBD complex context.
      proposed_replacement_terms:
        - id: GO:0008942
          label: nitrite reductase [NAD(P)H] activity
      supported_by:
        - reference_id: file:PSEPK/nirD/nirD-uniprot.txt
          supporting_text: "NITRITE REDUCTASE (NADH) SMALL SUBUNIT"
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NirD has a Rieske-related fold but does not bind a 2Fe-2S cluster.
      action: REMOVE
      reason: >-
        Structural analysis of NirD shows that it lacks the ligands and the
        Fe-S cluster found in true Rieske proteins; the fold-level electronic
        transfer therefore over-annotates cofactor binding.
      supported_by:
        - reference_id: PMID:22965870
          supporting_text: "it does not contain any Fe-S cluster or other cofactors that might be involved in electron transfer"
  - term:
      id: GO:0042128
      label: nitrate assimilation
    evidence_type: ISS
    original_reference_id: file:PSEPK/nirD/nirD-uniprot.txt
    qualifier: involved_in
    review:
      summary: NirD contributes to the assimilatory reduction of nitrite to ammonium.
      action: NEW
      reason: >-
        Q88M68 is the conserved NirD small subunit encoded directly beside nirB,
        and UniProt assigns the protein to nitrate assimilation.
      supported_by:
        - reference_id: file:PSEPK/nirD/nirD-uniprot.txt
          supporting_text: "KW   Nitrate assimilation"
        - reference_id: PMID:32523942
          supporting_text: "nirBD (PP_1705, PP_1706)"
  - term:
      id: GO:0009344
      label: nitrite reductase complex [NAD(P)H]
    evidence_type: ISS
    original_reference_id: PMID:32523942
    qualifier: part_of
    review:
      summary: NirD is the small accessory subunit of the two-subunit NirBD complex.
      action: NEW
      reason: KT2440 literature explicitly assigns PP_1705 and PP_1706 to the assimilatory nitrite reductase.
      supported_by:
        - reference_id: PMID:32523942
          supporting_text: "nirBD (PP_1705, PP_1706)"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: file:PSEPK/nirD/nirD-uniprot.txt
    title: UniProtKB entry for nirD (Q88M68)
    findings:
      - statement: >-
          Q88M68 is a 120-residue NirD-family small accessory subunit encoded
          adjacent to nirB; the Rieske-related fold does not imply Fe-S binding.
  - id: file:interpro/panther/PTHR40562/PTHR40562-entries.csv
    title: PANTHER members for PTHR40562
    findings:
      - statement: Reviewed E. coli and Salmonella NirD proteins ground the conserved small-subunit family.
  - id: PMID:22965870
    title: Crystal structure of NirD, the small subunit of the nitrite reductase NirbD from Mycobacterium tuberculosis at 2.0 Å resolution.
    findings:
      - statement: Structural analysis establishes that NirD is Rieske-related but lacks an Fe-S cluster.
        supporting_text: "it does not contain any Fe-S cluster or other cofactors that might be involved in electron transfer"
  - id: PMID:32523942
    title: A Nitrate-Blind P. putida Strain Boosts PHA Production in a Synthetic Mixed Culture.
    findings:
      - statement: The study explicitly identifies PP_1705 and PP_1706 as the KT2440 assimilatory nitrite reductase.
        supporting_text: "nirBD (PP_1705, PP_1706)"
  - id: PMID:35285712
    title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon Sequencing.'
    findings:
      - statement: BarSeq provided organism-wide genetic evidence for KT2440 nitrogen-assimilation pathways.
        supporting_text: "Using pooled mutant fitness assays, we identified genes and proteins involved in the assimilation of 52 different nitrogen containing compounds."
core_functions:
  - description: >-
      Small accessory subunit that contributes structurally to
      NAD(P)H-dependent nitrite reductase activity in the NirBD complex.
    contributes_to_molecular_function:
      id: GO:0008942
      label: nitrite reductase [NAD(P)H] activity
    directly_involved_in:
      - id: GO:0042128
        label: nitrate assimilation
    in_complex:
      id: GO:0009344
      label: nitrite reductase complex [NAD(P)H]
    supported_by:
      - reference_id: file:PSEPK/nirD/nirD-uniprot.txt
        supporting_text: "DR   InterPro; IPR017881; NirD."
      - reference_id: PMID:22965870
        supporting_text: "NirD is related in three-dimensional structure and sequence to the Rieske proteins"
    knowledge_gaps:
      - gap_statement: The electron-transfer contribution of Q88M68 to Q88M69 has not been reconstituted directly.
        significance: Complex reconstitution would establish whether NirD is strictly required for KT2440 NirB activity.
proposed_new_terms: []
suggested_questions:
  - question: Is Q88M68 required for full Q88M69 nitrite-reductase activity, and what interface does it stabilize?
suggested_experiments:
  - description: Compare Q88M69 nitrite-reductase activity and complex stability with and without Q88M68.
