core_functions:
- description: >-
    Deviant Walker-type ATPase of the ParABS system that, with ParB bound at
    the oriC-region parS sites, segregates replicated chromosome origins.
    The activity is inferred from the P. aeruginosa ortholog and the
    conserved Walker A box; the partition role is shown in P. putida.
