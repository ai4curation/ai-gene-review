proposed_new_terms: []
suggested_questions:
- question: Why are P. putida par mutants defective mainly when cells divide without ongoing replication
    (minimal medium, entry into stationary phase), when P. aeruginosa par mutants are defective during
    exponential growth?
- question: Is P. putida ParA ATPase stimulated by ParB and by non-specific DNA, as for SopA and P1 ParA?
suggested_experiments:
- description: Purify P. putida ParA and measure ATP hydrolysis alone and with ParB, parS DNA and non-specific
    DNA.
  hypothesis: P. putida ParA is a weak ATPase stimulated by ParB and DNA, like its orthologs.
  experiment_type: enzyme assay
