status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ParA (PP_0002) is the ATPase of the Pseudomonas putida ParABS
  chromosome-partitioning system, encoded immediately next to parB beside
  oriC. It is a 263-residue deviant Walker-type (ParA/MinD-family) P-loop
  ATPase related to B. subtilis Soj, with the KGGVGKT Walker A box at
  residues 11-17. It is 84% identical to P. aeruginosa ParA, whose purified
  protein hydrolyses ATP, dimerizes and binds ParB. In P. putida, parA
  mutants produce anucleate cells, mainly in minimal medium as cultures
  enter stationary phase. Together with ParB, ParA stabilises a plasmid
  carrying an oriC-region parS-like sequence in E. coli, showing that the
  P. putida proteins have partition activity of their own.
existing_annotations:
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  supporting_entities:
  - UniProtKB:Q9HT11
  review:
    summary: ParA is a deviant Walker-type ATPase; ATP hydrolysis is measured on its P. aeruginosa ortholog.
    action: NEW
    reason: >-
      The protein has no GO annotation in GOA at all. The 84%-identical P.
      aeruginosa ParA hydrolyses ATP as a purified protein, and the P. putida
      protein keeps the identical deviant Walker A box (KGGVGKT) at the same
      position. UniProt classes it with B. subtilis Soj (curated similarity).
      NCBI's SPARCLE architecture for this protein already asserts ATP binding
      and ATP hydrolysis activity. The P. aeruginosa source annotation is
      itself proposed (IDA) in the genes/PSEAE/parA review and is not yet in
      GOA, so this transfer depends on that row being accepted.
    supported_by:
    - reference_id: PMID:25139949
      supporting_text: ParA-His6 demonstrated ATPase activity (Fig. 3) of ~1.2 pmol Pi released min−1
        (pmol ParA)−1.
    - reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
      supporting_text: ParA has the deviant Walker A box KGGVGKT at 11-17,
        the ATP-binding signature of the ParA/MinD family.
    - reference_id: file:PSEPK/parA/parA-uniprot.txt
      supporting_text: 'SIMILARITY: To B.subtilis soj.'
- term:
    id: GO:0007059
    label: chromosome segregation
  evidence_type: IMP
  original_reference_id: PMID:11832517
  review:
    summary: P. putida parA mutants lose chromosomes, and ParAB partitions a parS plasmid.
    action: NEW
    reason: >-
      Based on P. putida data only. The abstract reports that parA (and
      parB) mutations raise the frequency of anucleate cells in minimal medium
      at the transition to stationary phase. ParA together with ParB also
      stabilises a parS-carrying plasmid in E. coli. Only the abstracts are
      cached, so the allele structure is not visible here; because parA lies
      upstream of parB in the same operon, a parA mutation could act partly by
      a polar effect on parB. The plasmid assay supplies both proteins and does
      not separate them either. ParA passes the participation test as the
      partition ATPase that positions the ParB-parS complex.
    supported_by:
    - reference_id: PMID:11832517
      supporting_text: However, in M9-minimal medium different parA and parB mutations gave between 5
        and 10% anucleate cells during the transition from exponential phase to stationary phase.
    - reference_id: PMID:11849535
      supporting_text: One was inserted into an unstable mini-F and shown to stabilize it in E. coli in
        a ParAB-dependent manner.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: ISM
  original_reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
  review:
    summary: ParA carries the deviant Walker A ATP-binding box of the ParA/MinD family.
    action: NEW
    reason: >-
      The deviant Walker A box KGGVGKT at residues 11-17 is the ATP-binding
      signature of the ParA/MinD family and is identical in the directly
      assayed P. aeruginosa ParA. NCBI's architecture already asserts this
      term. It is recorded separately from ATP hydrolysis activity because GO
      does not derive one from the other.
    supported_by:
    - reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
      supporting_text: ParA has the deviant Walker A box KGGVGKT at 11-17,
        the ATP-binding signature of the ParA/MinD family.
