proposed_new_terms: []
suggested_questions:
- question: UniProt still names P0A149 "Uncharacterized protein PP_0002" (Swiss-Prot, sequence version
    1 of 2005), although P. putida ParA has been characterized genetically since 2002. Should the entry
    be renamed ParA and given its family annotation?
- question: GOA has no annotation for this protein, while NCBI's CDD architecture gives ATP binding and
    ATP hydrolysis activity. Which InterPro or PANTHER mapping would let GOA cover ParA-family ATPases
    (Pfam AAA_31, PANTHER PTHR13696:SF52), which currently bring no GO?
suggested_experiments:
- description: Purify P. putida ParA and measure ATP hydrolysis alone and with ParB, parS DNA and non-specific
    DNA.
  hypothesis: P. putida ParA is a weak ATPase stimulated by ParB and DNA, like its orthologs.
  experiment_type: enzyme assay
