id: P0A149
gene_symbol: parA
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_0002
description: >-
  NCBI PGAP names WP_003253182.1 "ParA family protein" from SPARCLE CDD
  architecture 11439703 (a single COG1192 ParA region) and passes on ATP
  binding and ATP hydrolysis activity. Both are correct. This is a case
  where CDD architecture GO fills a gap that UniProt/GOA leaves completely
  open: GOA has no annotation of any kind for this protein. UniProt keeps the
  Swiss-Prot entry as "Uncharacterized protein PP_0002", and its Pfam
  (AAA_31) and PANTHER (PTHR13696:SF52) matches bring no GO. The main review
  proposes ATP hydrolysis activity as the core function, on the basis of the
  84%-identical P. aeruginosa ParA and the conserved Walker A box. ATP
  binding is correct but follows from the hydrolysis activity. Neither
  pipeline provides the process: chromosome segregation is supported
  directly by P. putida parA mutants, but the ParA architecture carries no
  process term.
