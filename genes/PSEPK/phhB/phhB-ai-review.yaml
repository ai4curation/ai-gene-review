      Reviewed (Swiss-Prot) entry; accession, locus tag PP_4491 and the
      118-residue chain match the target. Its FUNCTION statement carries
      ECO:0000250 (by similarity) and its name, EC number, reaction and family
      assignment all come from HAMAP-Rule MF_00434, a curated UniRule rather than
      an ARBA association rule, so they are usable as support. Protein existence
      is level 3, so nothing on the record is an experimental observation of the
      KT2440 protein. The record names tetrahydrobiopterin throughout and does not
      address the bacterial tetrahydromonapterin cofactor question.
- id: file:PSEPK/phhB/phhB-deep-research-falcon.md
  title: Falcon deep-research report on phhB (PCD/PhhB; Q88EH2; PP_4491) in P. putida KT2440
  findings:
  - statement: >-
      PCD catalyses a dehydration step in the recycling of the reduced pterin
      cofactors used by aromatic amino acid hydroxylases, which is the pathway
      context for both GOA rows.
    supporting_text: catalyzes a **dehydration** step in the recycling of reduced pterin cofactors used by **aromatic amino acid hydroxylases**
    reference_section_type: INTRODUCTION
  - statement: >-
      The enzyme regenerates the reduced tetrahydropterin pool by dehydrating
      pterin-4a-carbinolamine to quinonoid dihydropterin, sustaining turnover of
      the tetrahydropterin-dependent hydroxylases.
    supporting_text: regenerates reduced tetrahydropterin cofactor by dehydrating **pterin-4α-carbinolamine** to **quinonoid dihydropterin**, enabling continued turnover of tetrahydropterin-dependent hydroxylases
    reference_section_type: RESULTS
  - statement: >-
      In bacterial phenylalanine hydroxylase systems the physiological reduced
      pterin is tetrahydromonapterin rather than tetrahydrobiopterin, shown
      genetically in a P. aeruginosa and E. coli system where folX or folM
      deletion abolishes PhhA-dependent tyrosine rescue. This is why the
      biopterin-specific GO terms may name the wrong pterin for KT2440.
    supporting_text: the physiological reduced pterin cofactor for phenylalanine hydroxylase is proposed and experimentally supported to be **tetrahydromonapterin (H4-MPt; MH4)**
    reference_section_type: RESULTS
  - statement: >-
      In P. aeruginosa phhB sits in a phhABC operon with the phenylalanine
      hydroxylase phhA and the aromatic aminotransferase phhC, and PhhB is
      required for PhhA function in vivo. This is the closest experimentally
      backed neighbourhood model for the KT2440 gene, whose own operon structure
      was not retrieved.
    supporting_text: phhB** occurs in a **multigene operon** with **phhA** (phenylalanine hydroxylase) and **phhC** (aromatic aminotransferase), i.e., a phhABC unit; and **PhhB is required for in vivo function of PhhA**
    reference_section_type: RESULTS
  - statement: >-
      In pseudomonads the phenylalanine hydroxylase module is catabolic,
      converting Phe to Tyr for degradation through the homogentisate pathway, so
      the physiological purpose of the pterin recycling is aromatic amino acid
      catabolism.
    supporting_text: phenylalanine hydroxylase–associated pathways are commonly **catabolic**, converting **Phe → Tyr**, which can then be degraded via the **homogentisate pathway**
    reference_section_type: RESULTS
  - statement: >-
      No localization experiment for the KT2440 protein was retrieved; a soluble
      intracellular enzyme is the defensible inference from the chemistry and the
      absence of targeting features, consistent with GOA carrying no
      cellular-component row for this gene.
    supporting_text: the most defensible working annotation is **intracellular (cytosolic) enzyme**
    reference_section_type: DISCUSSION
  - statement: >-
      Bacterial PCDs are dimeric whereas the mammalian PCD/DCoH is tetrameric, a
      structural difference that tracks the mammalian protein's additional DCoH
      transcriptional-coactivator role.
    supporting_text: bacterial PCDs are generally dimeric (whereas mammalian PCD/DCoH is tetrameric)
    reference_section_type: RESULTS
  - statement: >-
      Phylogenomic work finds COG2154 PCD proteins in genomes with no aromatic
      amino acid hydroxylase at all, so family membership does not by itself
      establish an AAH-coupled role and the PhhA partnership has to be argued
      separately for each organism.
    supporting_text: presence of phhB/PCD does not guarantee presence of an AAH partner
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The report states plainly that no KT2440-specific biochemical
      characterization of PP_4491 was retrieved and that its organism-level
      conclusions are inferred from P. aeruginosa phhB and the conserved
      COG2154/PCD family; that limitation is carried through into this review. Its
      core claims (the carbinolamine dehydration step, the DHPR coupling, the
      phhABC operon in P. aeruginosa, the tetrahydromonapterin cofactor evidence)
      trace to the Thoeny 2000, Naponelli 2008 and Pribat 2010 sources it cites and
      are used here. The mammalian BH4-recycling reviews it cites are background
      only, and its engineered-tyrosine-production figures are not used.
