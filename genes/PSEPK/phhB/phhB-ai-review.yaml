id: Q88EH2
gene_symbol: phhB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: phhB encodes pterin-4-alpha-carbinolamine dehydratase (PCD; EC 4.2.1.96), a soluble enzyme that recycles the reduced tetrahydropterin cofactor used by aromatic amino acid hydroxylases by dehydrating the 4-alpha-hydroxytetrahydropterin (carbinolamine) intermediate to quinonoid dihydropterin. It supports phenylalanine hydroxylase (PhhA) turnover, with which it is co-encoded in a phhABC module in pseudomonads; in Pseudomonas the physiological reduced cofactor is most plausibly tetrahydromonapterin (MH4) rather than tetrahydrobiopterin (BH4).
existing_annotations:
- term:
    id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      The process annotation is sound. PCD performs one of the chemical steps of
      the pterin cycle that regenerates the reduced tetrahydropterin cofactor,
      and the cycle does result in formation of the tetrahydro form.
    action: ACCEPT
    reason: >-
      PCD dehydrates the 4a-carbinolamine intermediate to quinonoid
      dihydropterin, which quinonoid dihydropterin reductase then reduces back to
      the tetrahydro cofactor; so PhhB does part of the work of a process whose
      product is the reduced pterin, which is what involved_in requires. This is
      also the reading of curators independent of the InterPro mapping. UniProt
      applies the curated Swiss-Prot keyword for tetrahydrobiopterin biosynthesis
      and the FUNCTION statement written under HAMAP-Rule MF_00434 says the
      protein is involved in tetrahydrobiopterin biosynthesis. The term is not
      kept merely because it is the closest available; the regeneration cycle
      falls within its definition. Two caveats are recorded elsewhere rather than
      acted on here, because neither makes the term false. First, PCD acts in
      recycling rather than de novo ring formation, which is why a
      recycling-specific term is offered in proposed_new_terms. Second, in
      pseudomonads the physiological reduced pterin is most plausibly
      tetrahydromonapterin rather than tetrahydrobiopterin, so the pterin named by
      this term may be wrong for KT2440; that is raised as a suggested question
      because no measurement of the KT2440 pterin pool is available.
    supported_by:
    - reference_id: file:PSEPK/phhB/phhB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in tetrahydrobiopterin biosynthesis
    - reference_id: file:PSEPK/phhB/phhB-deep-research-falcon.md
      supporting_text: PCD/PhhB is a **cofactor recycling enzyme** that supports tetrahydropterin-dependent hydroxylation by rapidly converting the 4a-carbinolamine intermediate to a reducible quinonoid dihydropterin species
    - reference_id: file:PSEPK/phhB/phhB-deep-research-falcon.md
      supporting_text: the physiological reduced pterin cofactor for phenylalanine hydroxylase is proposed and experimentally supported to be **tetrahydromonapterin (H4-MPt; MH4)**
- term:
    id: GO:0008124
    label: 4-alpha-hydroxytetrahydrobiopterin dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The dehydratase activity annotation is the correct core molecular function
      for PhhB, and no better-fitting GO term exists.
    action: ACCEPT
    reason: >-
      The row rests on a curated rule rather than an association rule. Its
      WITH/FROM names UniRule UR000031216, which is HAMAP-Rule MF_00434, together
      with RHEA:11920, EC 4.2.1.96 and the PCD InterPro signatures IPR001533 and
      IPR036428. MF_00434 is the rule that gives the entry its recommended name
      and its catalytic-activity statement, so term, EC number and reaction all
      come from one curated source and agree. The alternative-looking GO:0102434
      (pterin-4alpha-carbinolamine dehydratase activity) was checked and is not a
      more general sibling; its definition is the
      10-formyltetrahydrofolate-4a-carbinolamine reaction, a different substrate,
      so GO:0008124 remains the only fitting term. The one residual mismatch is
      the pterin side chain, biopterin in the term and most plausibly monapterin
      in a pseudomonad, which is recorded as a suggested question rather than used
      to downgrade the row, since the chemistry catalysed (4a-carbinolamine
      dehydration to the quinonoid dihydropterin) is the same either way.
    supported_by:
    - reference_id: file:PSEPK/phhB/phhB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=(4aS,6R)-4a-hydroxy-L-erythro
    - reference_id: file:PSEPK/phhB/phhB-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the pterin-4-alpha-carbinolamine dehydratase
    - reference_id: file:PSEPK/phhB/phhB-deep-research-falcon.md
      supporting_text: regenerates reduced tetrahydropterin cofactor by dehydrating **pterin-4α-carbinolamine** to **quinonoid dihydropterin**, enabling continued turnover of tetrahydropterin-dependent hydroxylases
    - reference_id: file:PSEPK/phhB/phhB-deep-research-falcon.md
      supporting_text: PCD dehydrates this intermediate to a **quinonoid dihydropterin**
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      The InterPro2GO pipeline mapped the PCD signatures IPR001533
      (Pterin_deHydtase) and IPR036428 (PCD_sf) to tetrahydrobiopterin
      biosynthetic process, so the process annotation comes from family
      membership alone and carries no information about which pterin the
      organism actually uses.
- id: GO_REF:0000120
  title: Combined automated GO annotation using multiple IEA methods
  findings:
  - statement: >-
      The molecular-function row was asserted from five concordant sources at
      once, IPR001533, IPR036428, RHEA:11920, EC 4.2.1.96 and UniRule
      UR000031216 (HAMAP-Rule MF_00434), so despite the IEA code it rests on a
      curated UniRule rather than an unvetted association rule.
