core_functions:
- description: >-
    Zinc-dependent base exchange of guanine 34 with preQ1 in bacterial
    GUN-anticodon tRNAs, producing preQ1-tRNA for QueA; this is preQ1
    insertion, not eukaryotic free-queuine insertion.
  molecular_function:
