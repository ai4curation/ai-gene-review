id: Q88PL7
gene_symbol: tgt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Tgt is the bacterial tRNA-guanine transglycosylase of Pseudomonas putida
  KT2440. As a zinc-dependent homodimer, it exchanges guanine 34 for the
  bacterially synthesized base preQ1 in tRNAs with GUN anticodons, generating
  preQ1-tRNA for subsequent QueA and QueG reactions. Unlike eukaryotic TGT,
  bacterial Tgt inserts preQ1, not free queuine.
existing_annotations:
- term:
    id: GO:0002099
    label: tRNA wobble guanine modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Tgt directly replaces wobble guanine 34 with preQ1 in target bacterial tRNAs.
    action: ACCEPT
    reason: >-
      UniProt records base exchange at anticodon position 34 in tRNA(Asp),
      tRNA(Asn), tRNA(His), and tRNA(Tyr). Cached genetic evidence also states
      that an E. coli tgt mutant fails to insert preQ1 in tRNA.
    supported_by:
    - reference_id: PMID:40703034
      supporting_text: "the mutant does not insert preQ1 in tRNA"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is compatible with Tgt but redundant with the more specific cytosol annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005829 already captures the soluble compartment at useful specificity.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "GO; GO:0005829; C:cytosol"
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is the more specific soluble compartment consistent with Tgt function.
    action: ACCEPT
    reason: >-
      TreeGrafter assigns cytosol, consistent with a soluble tRNA-modifying
      enzyme lacking targeting or membrane features.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "GO; GO:0005829; C:cytosol"
- term:
    id: GO:0006400
    label: tRNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Generic tRNA modification should be narrowed to wobble guanine modification.
    action: MODIFY
    reason: >-
      The target residue and position are known: Tgt exchanges guanine 34 for
      preQ1. GO:0002099 captures the direct substrate-level process.
    proposed_replacement_terms:
    - id: GO:0002099
      label: tRNA wobble guanine modification
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "at position 34"
- term:
    id: GO:0008479
    label: tRNA-guanosine(34) queuine transglycosylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The current GO term's queuine reaction does not match bacterial Tgt, which inserts preQ1.
    action: MODIFY
    reason: >-
      The current definition of GO:0008479 describes exchange with free
      queuine to form queuosine-tRNA, the eukaryotic chemistry. P. putida Tgt
      instead exchanges guanine 34 with preQ1. No current GO molecular-function
      term captures bacterial preQ1-tRNA transglycosylation exactly, so the
      chemically correct parent GO:0050147 is proposed and GO:0002099 retains
      the exact tRNA-position context.
    proposed_replacement_terms:
    - id: GO:0050147
      label: nucleoside ribosyltransferase activity
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "queuine precursor 7-aminomethyl-7-deazaguanine (PreQ1) at position 34"
- term:
    id: GO:0008616
    label: tRNA queuosine(34) biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Tgt catalyzes the first tRNA-bound step of bacterial queuosine synthesis.
    action: ACCEPT
    reason: >-
      Insertion of preQ1 at guanine 34 creates the substrate for QueA and QueG,
      so Tgt directly participates in tRNA queuosine(34) biosynthesis even
      though it does not insert queuine itself.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "the tRNA convert PreQ1 to queuine (Q), resulting in the hypermodified"
