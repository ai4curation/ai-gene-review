id: Q88PL7
gene_symbol: tgt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Tgt is the bacterial tRNA-guanine transglycosylase of Pseudomonas putida
  KT2440. As a zinc-dependent homodimer, it exchanges guanine 34 for the
  bacterially synthesized base preQ1 in tRNAs with GUN anticodons, generating
  preQ1-tRNA for subsequent QueA and QueG reactions. Unlike eukaryotic TGT,
  bacterial Tgt inserts preQ1, not free queuine.
existing_annotations:
- term:
    id: GO:0002099
    label: tRNA wobble guanine modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Tgt directly replaces wobble guanine 34 with preQ1 in target bacterial tRNAs.
    action: ACCEPT
    reason: >-
      UniProt records base exchange at anticodon position 34 in tRNA(Asp),
      tRNA(Asn), tRNA(His), and tRNA(Tyr). Cached genetic evidence also states
      that an E. coli tgt mutant fails to insert preQ1 in tRNA.
    supported_by:
    - reference_id: PMID:40703034
      supporting_text: "the mutant does not insert preQ1 in tRNA"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is compatible with Tgt but redundant with the more specific cytosol annotation.
    action: KEEP_AS_NON_CORE
    reason: Retain the valid broader location while using GO:0005829 in the core function.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
