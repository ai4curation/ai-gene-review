      enzyme lacking targeting or membrane features.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "GO; GO:0005829; C:cytosol"
- term:
    id: GO:0006400
    label: tRNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Generic tRNA modification should be narrowed to wobble guanine modification.
    action: MODIFY
    reason: >-
      The target residue and position are known: Tgt exchanges guanine 34 for
      preQ1. GO:0002099 captures the direct substrate-level process.
    proposed_replacement_terms:
    - id: GO:0002099
      label: tRNA wobble guanine modification
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "at position 34"
- term:
    id: GO:0008479
    label: tRNA-guanosine(34) queuine transglycosylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the GOC-maintained molecular-function mapping for bacterial Tgt, although its formal definition describes free-queuine insertion.
    action: ACCEPT
    reason: >-
      InterPro2GO maps the bacterial IPR004803 family to GO:0008479, and
      UniRule UR000079182 pairs the same GO term with EC 2.4.2.29 and the
      preQ1 exchange reaction RHEA:24104. Retain that established mapping while
      recording the conflict with the term's free-queuine definition and
      requesting a dedicated bacterial term.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "queuine precursor 7-aminomethyl-7-deazaguanine (PreQ1) at position 34"
    - reference_id: file:rules/arba/_interpro2go.txt
      supporting_text: "InterPro:IPR004803 tRNA-guanine transglycosylase > GO:tRNA-guanosine(34) queuine transglycosylase activity ; GO:0008479"
- term:
    id: GO:0008616
    label: tRNA queuosine(34) biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Tgt catalyzes the first tRNA-bound step of bacterial queuosine synthesis.
    action: ACCEPT
    reason: >-
      Insertion of preQ1 at guanine 34 creates the substrate for QueA and QueG,
      so Tgt directly participates in tRNA queuosine(34) biosynthesis even
      though it does not insert queuine itself.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "queuine precursor 7-aminomethyl-7-deazaguanine (PreQ1) at position 34"
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IC
  original_reference_id: file:PSEPK/tgt/tgt-uniprot.txt
  qualifier: enables
  review:
    summary: Tgt binds one zinc ion per subunit as part of its conserved catalytic architecture.
    action: NEW
    reason: >-
      The reviewed HAMAP record explicitly assigns the zinc cofactor and its
      coordinating residues. Its UniProt record also carries the broader
      keyword-derived metal ion binding term, while seeded GOA lacks a
      metal-binding row.
    supported_by:
    - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
      supporting_text: "Note=Binds 1 zinc ion per subunit."
