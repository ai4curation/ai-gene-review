  knowledge_gaps:
  - gap_statement: GO:0008479 formally defines free-queuine insertion, while InterPro2GO IPR004803 and UniRule MF_00168 apply it to bacterial preQ1-inserting Tgt.
    significance: A dedicated bacterial preQ1 transglycosylase molecular-function term is needed to resolve the ontology-to-rule inconsistency.
  - gap_statement: No direct biochemical or genetic characterization of Q88PL7 in P. putida was found.
    significance: >-
      The reaction and substrate specificity are strongly supported by the
      reviewed record, family conservation, and characterized bacterial
      orthologs, but remain untested for purified Q88PL7.
proposed_new_terms:
- proposed_name: bacterial tRNA-guanosine(34) preQ1 transglycosylase activity
  proposed_definition: >-
    Catalysis of the exchange of guanine at position 34 in a target tRNA with
    7-aminomethyl-7-deazaguanine (preQ1), producing preQ1-modified tRNA and
    free guanine.
  justification: >-
    Bacterial Tgt performs RHEA:24104 with preQ1, whereas the current
    GO:0008479 definition specifies the distinct free-queuine reaction
    RHEA:16633. A dedicated term would preserve the bacterial substrate and
    distinguish this activity from eukaryotic TGT.
  proposed_parent:
    id: GO:0016763
    label: pentosyltransferase activity
  supported_by:
  - reference_id: file:PSEPK/tgt/tgt-uniprot.txt
    supporting_text: "queuine precursor 7-aminomethyl-7-deazaguanine (PreQ1) at position 34"
  - reference_id: file:rules/unirule/UR000079182/UR000079182.json
    supporting_text: '"id": "RHEA:24104"'
suggested_questions:
- question: Should GO add a bacterial tRNA-guanosine(34) preQ1 transglycosylase activity term distinct from GO:0008479?
suggested_experiments:
- hypothesis: Q88PL7 exchanges guanine 34 for preQ1 in KT2440 GUN-anticodon tRNAs.
  description: >-
    Reconstitute base exchange with purified Tgt and target tRNAs, quantify
    preQ1 incorporation by LC-MS, and test active-site and zinc-binding mutants.
