description: TrpS is the cytoplasmic homodimeric tryptophanyl-tRNA synthetase of Pseudomonas putida KT2440. It uses ATP to attach L-tryptophan to tRNA(Trp), producing Trp-tRNA(Trp) for translation; the functional and oligomeric assignments are conserved-family HAMAP predictions rather than direct KT2440 assays.
