taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Alpha subunit of succinate--CoA ligase/succinyl-CoA synthetase in Pseudomonas putida KT2440. Together with the beta subunit SucC, SucD forms the soluble succinate-CoA ligase complex that reversibly interconverts succinyl-CoA and succinate while coupling the reaction to nucleotide phosphorylation. This is the substrate-level phosphorylation step of the tricarboxylic acid cycle; the alpha subunit contributes the CoA/phosphate-binding and phosphohistidine chemistry, while nucleotide specificity is supplied by the beta subunit.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Root-level molecular function term; true but superseded by succinate-CoA ligase activity.
    action: TOO_GENERAL
    reason: SucD is an enzymatic subunit, so catalytic activity is true, but GO:0003824 is an ancestor of the accepted GO:0004775 succinate-CoA ligase (ADP-forming) activity and is entailed by it; TOO_GENERAL rather than over-annotated.
- term:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct core molecular function for the SucC/SucD succinate-CoA ligase complex.
    action: ACCEPT
    reason: SucD belongs to the succinate/malate CoA ligase alpha subunit family (HAMAP MF_01988, NCBIfam TIGR01019 sucCoAalpha), and the HAMAP-rule FUNCTION text states that succinyl-CoA synthetase couples succinyl-CoA hydrolysis to ATP or GTP synthesis, with the alpha subunit binding CoA and phosphate and carrying the phosphohistidine active-site residue (His247, HAMAP/PIRSR). This is family-level, curated-rule evidence for the activity of the SucC/SucD complex, to which the alpha subunit contributes; no KT2440 enzyme assay is cached.
    supported_by:
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'coupling the hydrolysis of succinyl-CoA to the synthesis of either ATP or GTP'
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'The alpha subunit of the enzyme binds the substrates coenzyme A and phosphate'
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'DR   HAMAP; MF_01988; Succ_CoA_alpha; 1.'
- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Plausible retained activity for the succinate-CoA ligase complex, consistent with the already curated sucC review.
    action: KEEP_AS_NON_CORE
    reason: The HAMAP-rule FUNCTION text for the succinate/malate CoA ligase alpha subunit family (HAMAP MF_01988) states that the enzyme couples succinyl-CoA hydrolysis to synthesis of either ATP or GTP, and that nucleotide specificity is provided by the beta subunit. GDP-forming activity is therefore within the family's catalytic range for the SucC/SucD complex, but whether KT2440 SucCD prefers GTP is set by SucC and has not been assayed; the ADP-forming term remains the core representation. Changed from ACCEPT to KEEP_AS_NON_CORE so that the action matches this reason; GDP formation is treated as a genuine secondary activity, as for E. coli SucD. The assay of the P. aeruginosa enzyme, which forms ATP and GTP in about equal amounts, suggests it may be more prominent in Pseudomonas than in E. coli, but the P. putida enzyme has not been measured.
    supported_by:
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'coupling the hydrolysis of succinyl-CoA to the synthesis of either ATP or GTP'
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'nucleotide specificity is provided by the beta subunit'
    - reference_id: PMID:10671455
      supporting_text: Scs synthesizes essentially an equimolar amount of ATP and GTP
