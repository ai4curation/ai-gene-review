- id: PMID:10671455
  title: Succinyl coenzyme A synthetase of Pseudomonas aeruginosa with a broad specificity for nucleoside triphosphate
    (NTP) synthesis modulates specificity for NTP synthesis by the 12-kilodalton form of nucleoside diphosphate
    kinase.
  findings:
  - statement: P. aeruginosa succinyl-CoA synthetase makes ATP and GTP in about equal amounts when given both
      nucleoside diphosphates.
    supporting_text: Scs synthesizes essentially an equimolar amount of ATP and GTP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read. A direct assay of the enzyme of a congener, P. aeruginosa, not of P. putida KT2440.
      It supports the family-level statement that bacterial succinyl-CoA synthetase with a single beta subunit
      can form GTP, and is the kind of seed behind the PAINT placement of GDP-forming activity.
