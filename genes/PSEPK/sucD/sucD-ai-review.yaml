- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GDP-forming activity of the SucC/SucD complex, recorded by the family rule; the alpha subunit contributes to it with its only beta partner, SucC.
    action: ACCEPT
    reason: The HAMAP-rule FUNCTION text for the succinate/malate CoA ligase alpha subunit family (HAMAP MF_01988) states that the enzyme couples succinyl-CoA hydrolysis to synthesis of either ATP or GTP, and that nucleotide specificity is provided by the beta subunit. Nucleotide preference has not been measured for the KT2440 enzyme. The nearest assayed enzyme, P. aeruginosa SucCD (beta subunit 94% identical, alpha subunit 98% identical), formed ATP and GTP in about equal amounts from an equimolar mixture of ADP and GDP (PMID:10671455) and carries experimental annotations for both activities, so neither activity is ranked above the other here. That result is an end-point observation without kinetic constants in the abstract, and the same abstract notes that the enzyme copurifies with nucleoside diphosphate kinase, so it does not show equal intrinsic specificity. The E. coli tenfold preference for ATP (beta subunit 77% identical) is not assumed to transfer.
    supported_by:
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'coupling the hydrolysis of succinyl-CoA to the synthesis of either ATP or GTP'
    - reference_id: file:PSEPK/sucD/sucD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'nucleotide specificity is provided by the beta subunit'
    - reference_id: PMID:10671455
