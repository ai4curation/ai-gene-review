  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GspF is a polytopic inner-membrane component of the type II secretion system.
  It forms the central membrane-platform subunit that couples the GspE ATPase
  and other platform proteins to pseudopilus assembly.
