  qualifier: enables
  review:
    summary: Current evidence identifies FtsW as a polymerase rather than the lipid II flippase.
    action: REMOVE
    reason: MurJ performs lipid II translocation; this transfer reflects the superseded SEDS transporter model.
    supported_by:
