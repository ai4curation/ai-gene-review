id: Q88N77
gene_symbol: ftsW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  FtsW is an integral inner-membrane SEDS-family peptidoglycan
  glycosyltransferase that polymerizes lipid II into glycan strands at the
  division septum. It forms the glycan-polymerizing half of the divisome
  synthase, paired with the FtsI/PBP3 D,D-transpeptidase.
