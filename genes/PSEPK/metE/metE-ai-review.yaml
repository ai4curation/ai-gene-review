suggested_questions:
- question: What methyl donor supplies the predicted PP_2698/PP_2699 MesD/MesX system, and under which
    KT2440 growth conditions does it complement MetH?
suggested_experiments:
- description: Test PP_2698 and PP_2699 jointly and individually in methionine-biosynthesis complementation
    under aerobic and anaerobic conditions, then reconstitute homocysteine methylation without assuming
    methylfolate is the donor.
  experiment_type: genetic complementation and biochemical reconstitution
