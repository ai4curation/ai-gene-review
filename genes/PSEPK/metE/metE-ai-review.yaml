id: Q88JF1
gene_symbol: metE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_2698 (annotated metE) encodes a compact zinc-dependent methionine-synthase-like protein
  assigned to the MesD branch by its close sequence relationship to characterized MesD and its linked
  MesX-family gene PP_2699. It is predicted to methylate the sulfur of homocysteine in a folate-independent,
  MesX-associated route to methionine. The physiological methyl donor and native KT2440 activity remain
  uncharacterized; the aerobic requirement demonstrated for a comparative MesD/MesX system has not been
  directly tested in KT2440.
existing_annotations:
- term:
    id: GO:0003871
    label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The predicted MesD activity supports sulfur methyl transfer without a specified folate donor.
    action: MODIFY
    reason: 'GO:0003871 requires 5-methyltetrahydropteroyltriglutamate. PP_2698 is closely related to
      characterized MesD and linked to MesX, whereas it lacks the canonical N-terminal folate-binding
      barrel. PMID:33534785 demonstrates folate-independent MesD/MesX complementation in a comparator.
      Generalize to S-methyltransferase activity: the homocysteine sulfur acceptor is supported, but the
      methyl donor and native target activity are not directly measured. This corrects substrate specificity
      without denying the conserved methyltransferase role.'
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_methionine_cycle/psepk-consultation/evidence.md
      supporting_text: PP_2698/Q88JF1 and Acinetobacter baylyi MesD/Q6F6Z8 share 295 identical residues
        across 346 global-alignment columns; both proteins contain 344 residues.
    - reference_id: PMID:33534785
      supporting_text: Growth of either ΔmetE or ΔmetF strains was rescued when both mesD and mesX were
        provided on a plasmid, but not when mesD or mesX were provided individually
    proposed_replacement_terms:
    - id: GO:0008172
      label: S-methyltransferase activity
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Zinc binding supports the conserved MesD-like homocysteine-activation site.
    action: ACCEPT
    reason: The close MesD sequence relationship and catalytic-barrel architecture support zinc binding
      as a conserved catalytic feature. PMID:33534785 reports conserved zinc and homocysteine residues
      across core-synthase families. The target ARBA-only cofactor comment is not independent support,
      and native target zinc occupancy has not been measured.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_methionine_cycle/psepk-consultation/evidence.md
      supporting_text: PP_2698/Q88JF1 and Acinetobacter baylyi MesD/Q6F6Z8 share 295 identical residues
        across 346 global-alignment columns; both proteins contain 344 residues.
    - reference_id: PMID:33534785
      supporting_text: Overall, we found that the functional residues for binding zinc and homocysteine
        were conserved in all four families of core methionine synthases.
