  findings:
  - statement: Comparative MesD requires MesX but not MetF in aerobic complementation; the native experiments
      concern Sphingomonas koreensis and prior Acinetobacter genetics, not KT2440.
    supporting_text: This confirms that MesD is a methionine synthase that requires MesX, but not MetF,
      for activity.
