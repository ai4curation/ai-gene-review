- term:
    id: GO:0008854
    label: exodeoxyribonuclease V activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO (IPR006344 RecD) mapping to exodeoxyribonuclease V activity with enables.
    action: MODIFY
    reason: Exodeoxyribonuclease V activity is the reaction of the RecBCD holoenzyme. The nuclease active
      site is in RecB, and isolated RecD (studied in E. coli) has no holoenzyme activity, but RecD stimulates
      the RecB nuclease and processivity. RecD therefore contributes_to GO:0008854 rather than enabling
      it. The term is kept (same-term MODIFY) with the relation corrected to contributes_to, as in core_functions;
      the same judgement is made for E. coli RecD.
