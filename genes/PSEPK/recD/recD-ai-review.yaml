gene_symbol: recD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RecD (PP_4672) is the 5'-3' DNA helicase subunit of the RecBCD enzyme (Exonuclease V) of
  Pseudomonas putida KT2440, encoded in a recD-recB-recC locus. In RecBCD, a heterotrimeric helicase-nuclease
  that processes double-stranded DNA ends for RecA-mediated homologous recombination, RecD is the fast
  ATP-dependent motor on the 5'-ended strand, while RecB is the slow 3'-5' motor and carries the nuclease.
  RecD has no nuclease site but stimulates the holoenzyme nuclease and processivity. In the related Pseudomonas
  syringae, RecD and its ATPase are required for RecBCD recombination, UV and mitomycin C resistance and
  growth at low temperature, unlike the dispensable RecD of Escherichia coli. Pseudomonas RecBCD enzymes
  do not respond to the E. coli Chi sequence.
