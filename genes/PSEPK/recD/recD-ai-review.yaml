description: RecD is the fast 5-prime-to-3-prime ATP-dependent DNA helicase motor of the bacterial RecBCD complex. Together with the oppositely directed RecB motor and the RecC scaffold, it drives processive double-strand-end unwinding and modulates RecB nuclease and RecA-loading activities. RecD contributes to, but does not itself catalyze, Exonuclease V nuclease chemistry.
