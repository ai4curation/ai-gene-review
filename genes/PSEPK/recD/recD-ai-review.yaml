    label: double-strand break repair via homologous recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: UniRule transfer of RecBCD's role in homologous double-strand break repair to RecD.
    action: ACCEPT
    reason: RecD is the fast 5'-3' motor of RecBCD, which processes double-strand ends for RecA-mediated
      repair. In the pseudomonad P. syringae, unlike E. coli, recD loss or an ATPase-dead RecD (K229Q)
      abolishes RecBCD recombination and causes UV and mitomycin C sensitivity, so RecD both participates
      in and is required for homologous DSB repair in this genus. The KT2440 protein is the RecD (TIGR01447/HAMAP
      MF_01487) of the recD-recB-recC locus.
    supported_by:
