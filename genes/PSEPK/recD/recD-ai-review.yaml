  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: RecD is the fast 5-prime-to-3-prime ATP-dependent DNA helicase motor of the bacterial RecBCD complex. Together with the oppositely directed RecB motor and the RecC scaffold, it drives processive double-strand-end unwinding and modulates RecB nuclease and RecA-loading activities. RecD contributes to, but does not itself catalyze, Exonuclease V nuclease chemistry. In the experimentally studied pseudomonad Pseudomonas syringae, RecD is required for resistance to UV and mitomycin C, unlike the dispensable RecD subunit in the corresponding Escherichia coli assays.
