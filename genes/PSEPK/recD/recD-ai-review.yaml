      reference_id: file:PSEPK/recD/recD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The Chi-altered holoenzyme produces a long 3'-ssDNA overhang and facilitates RecA-binding
        to the ssDNA for homologous DNA recombination and repair.
    - &id005
      reference_id: PMID:20195537
      supporting_text: More importantly, we now demonstrate that an inactive RecDK229Q subunit (i.e.,
        RecBCDK229Q enzyme) or an inactive RecB subunit (i.e., RecBK28QCD) also makes the P. syringae
        RecBCD enzyme inefficient in homologous recombination (Table 3).
    - &id003
