- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. Native-locus ProA-msfGFP and ProB-msfGFP fusions in the E. coli
      BW25113 background were examined in M9/glucose medium. The ProA localization supplies comparative
      support for a conserved cytosolic location, not a direct measurement on Bacillus subtilis ProA or
      evidence for a stable ProA-ProB complex.
  findings:
  - statement: Native-locus monomeric-GFP E. coli ProA is dispersed throughout the cytoplasm. Together
      with target HAMAP localization and conserved soluble reductase architecture, this supports an inferred
      cytosolic location for Bacillus subtilis ProA.
    supporting_text: When we express ProB and ProA tagged with monomeric superfolder GFP (msfGFP) from
      a gene integrated into the native locus, both proteins are dispersed throughout the cytoplasm
core_functions:
- description: Cytoplasmic NADPH-dependent reduction of L-glutamyl 5-phosphate to L-glutamate 5-semialdehyde
    during proline biosynthesis, inferred from conserved ProA chemistry; subsequent cyclization to P5C
    is spontaneous. The cytosolic location is inferred from conserved soluble architecture and comparative
    E. coli imaging, not a target-specific localization assay.
