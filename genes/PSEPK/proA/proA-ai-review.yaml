  review:
    summary: Refine cytoplasm to an inferred cytosolic location.
    action: MODIFY
    reason: HAMAP MF_00412 assigns this conserved gamma-glutamyl phosphate reductase to the cytoplasm.
      Its soluble reductase architecture and lack of annotated export or membrane-spanning features, together
      with native-locus monomeric-GFP imaging of E. coli ProA in PMID:39514317, support an inferred cytosolic
      location. The microscopy is comparative evidence, not a localization measurement on Pseudomonas
      putida KT2440 ProA. Cytosol includes protein complexes, so possible transient intracellular associations
      do not preclude this refinement. MODIFY replaces the correct broader compartment with GO:0005829;
      the absence of a separate cytosol row does not determine the biological judgment.
    supported_by:
