description: >-
  Periplasmic PstS phosphate-binding subunit encoded in the Pho-linked
  PP_5326-PP_5329 high-affinity phosphate-import locus. Its signal peptide
  directs export to the periplasm, where it captures inorganic phosphate for
  delivery to the PstCAB membrane transporter.
