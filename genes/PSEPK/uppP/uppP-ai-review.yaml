  label: Pseudomonas putida KT2440
description: UppP is the inner-membrane undecaprenyl-diphosphatase of Pseudomonas putida KT2440. It hydrolyzes
  undecaprenyl diphosphate to undecaprenyl phosphate, generating the membrane-embedded C55 carrier used
  for bacterial cell-envelope glycan assembly and helping maintain the carrier pool during repeated rounds
  of precursor transfer.
