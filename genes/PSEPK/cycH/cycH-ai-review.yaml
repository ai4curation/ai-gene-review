id: A0A140FWM3
gene_symbol: cycH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CycH is a membrane-associated accessory factor of cytochrome c maturation
  system I. Characterized CycH-family orthologs are required for efficient
  accumulation of multiple c-type cytochromes, but the direct molecular activity
  and substrate range of this lineage-variable component remain unresolved.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: CycH is a membrane-associated system I accessory protein.
      action: ACCEPT
      reason: Family architecture and characterized orthologs support a membrane-associated role without requiring a specific substrate-presentation mechanism.
  - term: {id: "GO:0030313", label: cell envelope}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CycH acts at the bacterial cell envelope.
      action: KEEP_AS_NON_CORE
      reason: Compatible with its membrane anchor and periplasmic TPR region, but broader than plasma membrane.
  - term: {id: "GO:1903607", label: cytochrome c biosynthetic process}
    evidence_type: ISS
    original_reference_id: PMID:8231805
    qualifier: involved_in
    review:
      summary: CycH belongs to the CycH family of cytochrome c biogenesis factors.
      action: NEW
      reason: PANTHER PTHR47870:SF4 includes characterized Bradyrhizobium CycH as well as NrfG-family cytochrome c maturation accessories. The Bradyrhizobium CycH disruption eliminates nearly all detectable c-type cytochromes (PMID:8231805), supporting the process annotation by homology while leaving the direct molecular activity unresolved.
      supported_by:
        - reference_id: PMID:8231805
          supporting_text: All of the c-type cytochromes detectable in aerobically grown B. japonicum wild-type cells were absent in the COX3 mutant, with the exception of cytochrome c1.
