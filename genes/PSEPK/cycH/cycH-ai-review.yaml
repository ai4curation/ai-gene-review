    supporting_text: Binding experiments show that the interaction occurs at the level of the TPR domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The explicit binding/kinetic and citrate-synthase aggregation findings
      concern P. aeruginosa periplasmic CcmI constructs, not the KT2440 protein. They provide a mechanistic
      ortholog rationale for substrate handling; no direct KT2440 substrate range or generic folding activity
      is asserted. This source does not directly assay the KT2440 target; mechanistic use here is comparative
      ortholog inference.
