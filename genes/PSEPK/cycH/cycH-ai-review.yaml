taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CycH is the PSEPK CcmI-like membrane-associated substrate-presentation factor of cytochrome c maturation system I. Its periplasmic TPR-rich region is expected to bind selected apocytochromes and facilitate their productive delivery to the CcmF/H heme-ligation machinery; CcmI-like proteins are lineage-variable accessories rather than universal system I subunits.
