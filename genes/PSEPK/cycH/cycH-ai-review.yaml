    id: GO:1903607
    label: cytochrome c biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:8231805
  qualifier: involved_in
  review:
    summary: CycH is inferred to assist apocytochrome substrate handling during maturation.
    action: NEW
    reason: The frozen KT2440 record assigns the CcmI family and TPR domains. P. aeruginosa periplasmic
      CcmI directly recognizes apocytochrome c551 through its TPR region, supporting substrate presentation
      by this accessory protein; this provides participation evidence beyond the Bradyrhizobium knockout
      phenotype in the original source. The KT2440 assignment remains ortholog inference, not a direct
      assay. This is a retained historical proposal, not a new row added by the current audit.
    supported_by:
    - reference_id: PMID:23648553
      supporting_text: Binding experiments show that the interaction occurs at the level of the TPR domain
