  label: Pseudomonas putida KT2440
description: cycH encodes a membrane-associated CcmI-family substrate-handling factor of cytochrome c
  maturation system I. Supports apocytochrome substrate handling as a membrane-associated CcmI-family
  accessory factor with a periplasmic TPR region. Its mechanistic assignment in Pseudomonas putida KT2440
  is inferred from conserved features and characterized system I orthologs.
