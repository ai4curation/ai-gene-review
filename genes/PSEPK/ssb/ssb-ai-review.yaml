  label: Pseudomonas putida KT2440
description: SSB is the bacterial single-stranded DNA-binding protein. It coats exposed ssDNA, suppresses
  secondary structure, protects templates, and recruits partner proteins during chromosome replication,
  DNA repair, and homologous recombination.
