description: SSB is the bacterial single-stranded DNA-binding protein. It coats exposed ssDNA, suppresses secondary structure, protects templates, and recruits partner proteins during chromosome replication. The same ssDNA-management activity also supports DNA repair and homologous recombination, but those are secondary to the focused replication-module role.
