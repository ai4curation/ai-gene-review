id: Q88EX8
gene_symbol: ccmD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmD is a small integral membrane accessory protein of cytochrome c maturation system I. It acts with CcmC during formation of holo-CcmE and thereby supports heme delivery to the downstream CcmF/H maturation machinery.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CcmD is a small inner-membrane protein.
      action: ACCEPT
      reason: This specific location is integral to CcmD's core role as a small accessory membrane subunit.
  - term: {id: "GO:0015886", label: heme transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmD supports heme handling by CcmC and CcmE.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        This protein's own unreviewed UniProt FUNCTION line repeats the
        historical export model, but direct work places CcmD in stabilization
        of membrane-associated CcmE rather than demonstrated heme translocation
        (PMID:10339610).
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: CcmD is membrane localized.
      action: MARK_AS_OVER_ANNOTATED
      reason: Redundant, less precise parent of plasma membrane.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmD contributes to c-type cytochrome assembly.
      action: KEEP_AS_NON_CORE
      reason: Correct but broader than the existing cytochrome c biosynthetic process term.
  - term: {id: "GO:1903607", label: cytochrome c biosynthetic process}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: CcmD is a system I accessory required for c-type cytochrome maturation.
      action: ACCEPT
      reason: This is the appropriately specific core process.
