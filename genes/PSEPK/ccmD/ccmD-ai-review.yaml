aliases: [Q88EX8, PP_4324]
core_functions:
  - description: Supports CcmC-dependent formation of the holo-CcmE heme chaperone during system I maturation.
    directly_involved_in:
      - {id: "GO:1903607", label: cytochrome c biosynthetic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: PMID:10339610
        supporting_text: CcmD was found to be involved in stabilizing the heme chaperone CcmE in the membrane.
suggested_questions:
  - question: Does PSEPK CcmD stabilize CcmC, CcmE, or their productive loading complex?
suggested_experiments:
  - description: Measure CcmC abundance and holo-CcmE formation after ccmD deletion and complementation.
    experiment_type: complex-stability assay
