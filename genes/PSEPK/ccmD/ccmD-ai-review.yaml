  label: Pseudomonas putida KT2440
description: ccmD encodes a small membrane accessory protein of cytochrome c maturation system I. Supports
  assembly and release of heme-loaded CcmE within the CcmABCD membrane machinery. Structural and biochemical
  studies support heme handling by CcmABCD, while the membrane-crossing route and its energetic coupling
  remain disputed. Its mechanistic assignment in Pseudomonas putida KT2440 is inferred from conserved
  features and characterized system I orthologs.
