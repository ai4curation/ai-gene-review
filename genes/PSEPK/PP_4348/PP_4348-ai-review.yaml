- id: file:PSEPK/PP_4348/PP_4348-deep-research-openscientist.md
  title: OpenScientist gene research for PP_4348
  findings:
  - statement: The report itself notes that the P. putida enzymology was done in strain S-313, not KT2440.
    supporting_text: The Vermeij & Kertesz work used *P. putida* S-313, not strain KT2440.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Provider report. The family and pathway reasoning is sound, but some statements overreach.
      It gives EC 4.4.1.8, an EC number since merged into 4.4.1.13. It cites "direct enzymological detection"
      of CBL activity in P. putida, but that was in strain S-313 extracts and cannot be assigned to PP_4348.
      It presents the conservation of the full MetC active site as established, whereas our alignment
      checks only the PLP lysine. Used for orientation only, not as support.
