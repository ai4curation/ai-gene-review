id: Q88EV4
gene_symbol: PP_4348
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_4348 encodes a predicted cytoplasmic pyridoxal 5'-phosphate-dependent cystathionine beta-lyase
  of the MetC type (PANTHER PTHR43500:SF1, the subfamily of E. coli MetC; InterPro bacterial cystathionine
  beta-lyase). By homology it cleaves L-cystathionine to L-homocysteine, pyruvate and ammonium, the second
  step of forward trans-sulfuration towards methionine. The protein has not been characterised experimentally
  in KT2440. In pseudomonads the main route to homocysteine is direct sulfhydrylation of O-succinylhomoserine
  (MetZ), while trans-sulfuration enzyme activities, including cystathionine beta-lyase, are low and are
  induced by growth on cysteine as sole sulfur source (shown in P. putida strain S-313). P. putida lacks
  cystathionine gamma-lyase, so the cystathionine route runs only in the biosynthetic direction. Whether
  PP_4348 is the enzyme behind that activity, and how it contributes to methionine supply in KT2440, is
  unknown.
