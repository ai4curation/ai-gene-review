- term:
    id: GO:0047804
    label: cysteine-S-conjugate beta-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO (IPR006233 bacterial cystathionine beta-lyase) to cysteine-S-conjugate beta-lyase
      activity, the live term that carries cystathionine beta-lyase activity as a synonym (GO:0004121
      is obsolete as its equivalent).
    action: ACCEPT
    reason: 'Family-level inference, but a strong one: PP_4348 is in the same PANTHER subfamily as biochemically
      characterised E. coli MetC (PTHR43500:SF1), with about 30% identity over its full length, and the
      PLP lysine is conserved. The UniProt catalytic-activity line rests only on ARBA and is not cited.
      Cystathionine beta-lyase activity has been measured in extracts of another P. putida strain (S-313),
      but it cannot be assigned to this gene product, and the purified KT2440 protein has not been assayed.
      Accepted as the predicted core activity, with that caveat.'
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: file:PSEPK/PP_4348/PP_4348-deep-research-openscientist.md
      supporting_text: The Vermeij & Kertesz work used *P. putida* S-313, not strain KT2440.
