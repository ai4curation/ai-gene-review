- question: Does PP_4348 provide the physiological cystathionine beta-lyase activity
    for methionine trans-sulfuration, or is direct sulfhydrylation dominant in KT2440?
suggested_experiments:
- description: Measure PP_4348 cystathionine beta-lyase activity and test metB/PP_4348
