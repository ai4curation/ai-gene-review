id: Q88EV4
gene_symbol: PP_4348
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_4348 encodes a PLP-dependent cystathionine beta-lyase-family enzyme.
  It is the candidate second enzyme of the trans-sulfuration branch of L-methionine
  biosynthesis in KT2440, hydrolyzing cystathionine to L-homocysteine, pyruvate,
  and ammonium.
existing_annotations:
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Amino acid metabolic process is true but too broad for PP_4348.
    action: MARK_AS_OVER_ANNOTATED
    reason: The InterPro2GO parent term should not obscure the specific cystathionine
      beta-lyase/trans-sulfuration role supported by the local protein name and UniProt
      catalytic activity.
    supported_by:
    - reference_id: file:PSEPK/PP_4348/PP_4348-deep-research-openscientist.md
      supporting_text: "PP_4348 (Q88EV4) of *Pseudomonas putida* KT2440 is a cytoplasmic, PLP-dependent **cystathionine β-lyase (MetC, EC 4.4.1.8)**"
- term:
    id: GO:0019346
    label: transsulfuration
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Transsulfuration is appropriate for a cystathionine beta-lyase candidate.
    action: ACCEPT
    reason: PP_4348 is classified in the InterPro bacterial cystathionine beta-lyase
      family (IPR006233) and the RuleBase-supported trans-sulfuration enzymes family,
      with the conserved PLP-binding lysine (PIRSR001434); cystathionine beta-lyase
      (MetC) is the second step of the forward trans-sulfuration route, and GapMind
      also places it in that route (MetB plus MetC). The evidence is family membership
      only; the KT2440 enzyme has not been assayed and the fitness data show no
      phenotype.
    supported_by:
    - reference_id: file:PSEPK/PP_4348/PP_4348-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR006233; Cys_b_lyase_bac."
    - reference_id: file:PSEPK/PP_4348/PP_4348-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: "SIMILARITY: Belongs to the trans-sulfuration enzymes family."
- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Pyridoxal phosphate binding is a catalytic cofactor feature for PP_4348.
    action: KEEP_AS_NON_CORE
    reason: PLP binding supports the beta-lyase reaction but is secondary to the
      cystathionine-cleavage function.
    supported_by:
    - reference_id: file:PSEPK/PP_4348/PP_4348-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: "Name=pyridoxal 5'-phosphate"
- term:
    id: GO:0047804
    label: cysteine-S-conjugate beta-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The beta-lyase activity captures the PP_4348 trans-sulfuration reaction.
    action: ACCEPT
    reason: PP_4348 belongs to the InterPro bacterial cystathionine beta-lyase family
      (IPR006233) and carries the PIRSR001434 PLP-binding lysine (Lys186), so it is
      inferred to cleave cystathionine to L-homocysteine, pyruvate and ammonium. The
      UniProt catalytic-activity line for this reaction rests only on an ARBA rule
      and is not cited; the inference is family-level and the KT2440 enzyme has not
      been assayed. The older GO:0004121 cystathionine beta-lyase
      term is obsolete and equivalent to the current GO:0047804 term, so the valid
      GOA molecular-function term is retained while the physiological cystathionine
      substrate is stated explicitly.
    supported_by:
    - reference_id: file:PSEPK/PP_4348/PP_4348-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR006233; Cys_b_lyase_bac."
    - reference_id: file:PSEPK/PP_4348/PP_4348-uniprot.txt
      record_section: ["FT:MOD_RES"]
      supporting_text: "/note=\"N6-(pyridoxal phosphate)lysine\""
