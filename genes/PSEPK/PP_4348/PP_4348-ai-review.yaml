suggested_questions:
- question: Is PP_4348 the cystathionine beta-lyase responsible for the cysteine-inducible activity seen
    in P. putida, or do other PLP enzymes in KT2440 contribute? And is the trans-sulfuration route needed
    at all when MetZ-dependent direct sulfhydrylation is available?
suggested_experiments:
- description: Purify recombinant PP_4348 and measure kinetics with L-cystathionine, L-cystine and L-cysteine.
    Build PP_4348 and metZ single and double deletions in KT2440 and score methionine requirement on sulfate
    versus cysteine as sole sulfur source.
  experiment_type: enzymology and targeted genetics
