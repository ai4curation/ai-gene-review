- term:
    id: GO:0019346
    label: obsolete transsulfuration
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO (IPR000277) to transsulfuration. The cached GOA file still shows the old label,
      but QuickGO now lists GO:0019346 as obsolete because it conflated the forward and reverse directions;
      its consider tags are GO:0071269 and GO:0019344.
    action: MODIFY
    reason: A MetC-type beta-lyase works in the forward, homocysteine-forming direction. The cystathionine
      gamma-lyase needed for the reverse direction was not detected in P. putida (strain S-313), so the
      replacement is GO:0071269 L-homocysteine biosynthetic process. The inference rests on family membership
      (PTHR43500:SF1, the subfamily of E. coli MetC); the KT2440 protein has not been assayed.
    proposed_replacement_terms:
    - id: GO:0071269
      label: L-homocysteine biosynthetic process
