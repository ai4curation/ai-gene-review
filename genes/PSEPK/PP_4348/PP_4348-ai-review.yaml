      term.
    supporting_text: The reason for obsoletion is that this term is equivalent to GO:0047804 cysteine-S-conjugate
      beta-lyase activity.
- id: PMID:10482527
  title: Pathways of assimilative sulfur metabolism in Pseudomonas putida.
  findings:
  - statement: P. putida S-313 and P. aeruginosa make methionine mainly by direct sulfhydrylation; trans-sulfuration
      enzymes are low but cysteine-induced, and P. putida lacks cystathionine gamma-lyase.
    supporting_text: Both these organisms used direct sulfhydrylation of O-succinylhomoserine for the
      synthesis of methionine
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Different strain (S-313); activities measured in extracts, not assigned to genes.
