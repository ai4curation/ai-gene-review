  title: Escherichia coli dihydropyrimidine dehydrogenase is a novel NAD-dependent heterotetramer essential for the production of 5,6-dihydrouracil.
  full_text_unavailable: true
  findings:
  - statement: The characterized E. coli homolog establishes an NADH-dependent heterotetrameric iron-sulfur flavoenzyme architecture.
    supporting_text: "dihydropyrimidine dehydrogenase is the first member of a novel NADH-dependent subclass of iron-sulfur flavoenzymes"
- id: PMID:22782928
  title: Pseudomonas putida PydR, a RutR-like transcriptional regulator, represses the dihydropyrimidine dehydrogenase gene in the pyrimidine reductive catabolic pathway.
  findings:
  - statement: A pydA mutant cannot use uracil or thymine as sole nitrogen source.
    supporting_text: "a pydA strain of P. putida fails to grow on a minimal media containing uracil or thymine as a sole nitrogen source"
