id: Q88FQ0
gene_symbol: pydA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  pydA (PP_4038) encodes one subunit of the bacterial heteromeric
  dihydropyrimidine dehydrogenase of the reductive pyrimidine-catabolic
  pathway. Together with the adjacent PydX subunit, it reduces uracil or thymine
  to the corresponding 5,6-dihydropyrimidine using reduced nicotinamide
  cofactors. The enzyme initiates utilization of pyrimidine bases as nitrogen
  and carbon sources; PydA is a soluble iron-sulfur flavoprotein subunit rather
  than a complete, independently active dehydrogenase.
existing_annotations:
- term:
    id: GO:0004159
    label: dihydropyrimidine dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The specific activity is supported by the EC assignment and by direct
      KT2440 genetics showing that pydA is required for growth on uracil or
      thymine as sole nitrogen source.
    action: MODIFY
    reason: >-
      Retain the term but change the relation from enables to contributes_to;
      PydA houses the pyrimidine-reduction site while PydX supplies the
      electron-input machinery.
    proposed_replacement_terms:
    - id: GO:0004159
      label: dihydropyrimidine dehydrogenase (NAD+) activity
    supported_by:
    - reference_id: file:PSEPK/pydA/pydA-notes.md
      supporting_text: "The putative DPD genes, pydX and pydA, are tandemly arranged in the Pseudomonas putida genome."
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: PydA is a soluble enzyme subunit and cytoplasmic localization is consistent with its pathway role and lack of membrane-targeting features.
    action: ACCEPT
    reason: Retain the InterPro-derived bacterial cytoplasm annotation.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This generic oxidoreductase parent is true but substantially less informative than the specific dihydropyrimidine dehydrogenase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The specific catalytic term already captures the biologically relevant redox function.
- term:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Core subunit-level reaction class for PydA, which houses the active site that reduces the C5-C6 bond of uracil or thymine.
    action: ACCEPT
    reason: Use this donor-agnostic oxidoreductase term for the activity PydA enables directly while representing whole-enzyme DPD activity with contributes_to.
- term:
    id: GO:0072529
    label: pyrimidine-containing compound catabolic process
  evidence_type: IMP
  original_reference_id: PMID:22782928
  qualifier: involved_in
  review:
    summary: Loss of pydA prevents KT2440 growth on uracil or thymine as sole nitrogen source.
    action: NEW
    reason: >-
      The mutant phenotype directly supports a role for PydA in reductive
      pyrimidine catabolism, which is not represented in the seeded GOA rows.
    supported_by:
    - reference_id: PMID:22782928
      supporting_text: "a pydA strain of P. putida fails to grow on a minimal media containing uracil or thymine as a sole nitrogen source"
references:
