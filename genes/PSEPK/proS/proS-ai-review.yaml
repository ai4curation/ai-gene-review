taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: ProS is the cytoplasmic prolyl-tRNA synthetase of Pseudomonas putida KT2440. It uses ATP to charge tRNA(Pro) with L-proline and is predicted by a conserved-family HAMAP rule to proofread alanine errors through pretransfer Ala-AMP hydrolysis and posttransfer deacylation of Ala-tRNA(Pro); these activities have not been directly assayed in KT2440.
