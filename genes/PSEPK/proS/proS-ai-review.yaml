id: Q88NK2
gene_symbol: proS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ProS is a class II prolyl-tRNA synthetase that charges tRNA(Pro) and removes alanine errors
  through pretransfer Ala-AMP hydrolysis and posttransfer Ala-tRNA(Pro) editing. It acts in the cytoplasm
  of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate proline by proS.
    action: MODIFY
    reason: The MF_01569 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/proS/proS-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=tRNA(Pro) + L-proline + ATP = L-prolyl-tRNA(Pro) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ProS is a class II prolyl-tRNA synthetase that charges tRNA(Pro) and removes alanine errors
      through pretransfer Ala-AMP hydrolysis and posttransfer Ala-tRNA(Pro) editing.
    action: MODIFY
    reason: The source specifically assigns deacylation of Ala-tRNA(Pro), so the supported descendant
      GO:0043906 is preferable to the generic deacylase term. The Ala-AMP pretransfer reaction is separate,
      and Cys-tRNA(Pro) editing is explicitly excluded by the curated family rule. HAMAP MF_01569 and
      the ProRS-INS editing-domain assignment support alanine proofreading. The curated rule explicitly
      distinguishes mischarged Cys-tRNA(Pro), which is not edited by this ProRS activity.
    supported_by:
    - reference_id: file:PSEPK/proS/proS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '''posttransfer'' editing and involves deacylation of mischarged Ala-'
    - reference_id: file:PSEPK/proS/proS-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: tRNA(Pro). The misacylated Cys-tRNA(Pro) is not edited by ProRS.
    proposed_replacement_terms:
    - id: GO:0043906
      label: Ala-tRNA(Pro) deacylase activity
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify proline and tRNA(Pro).
    action: MODIFY
    reason: HAMAP MF_01569 and the ProRS-INS editing-domain assignment support alanine proofreading. The
      curated rule explicitly distinguishes mischarged Cys-tRNA(Pro), which is not edited by this ProRS
      activity. GO:0004827 is the supported amino-acid-specific descendant of GO:0004812; the parent is
      biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0004827
      label: proline-tRNA ligase activity
- term:
    id: GO:0004827
    label: proline-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: proS supplies proline-charged tRNA(Pro) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_01569 and the ProRS-INS editing-domain assignment support alanine proofreading. The
      curated rule explicitly distinguishes mischarged Cys-tRNA(Pro), which is not edited by this ProRS
      activity. The independently curated MF_01569 reaction supports this specific MF; electronic provenance
      does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to proS-catalysed proline activation.
    action: ACCEPT
    reason: The curated MF_01569 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: proS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_01569 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/proS/proS-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
