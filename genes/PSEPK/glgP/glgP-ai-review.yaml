      action: KEEP_AS_NON_CORE
      reason: >-
        The term is valid context; glycogen catabolic process is the more
        informative pathway annotation.
      supported_by:
        - reference_id: file:PSEPK/glgP/glgP-uniprot.txt
          supporting_text: "Phosphorylase is an important allosteric enzyme in"
  - term:
      id: GO:0005977
      label: glycogen metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: The broad glycogen process is compatible with the GlgP assignment.
      action: KEEP_AS_NON_CORE
      reason: >-
        Q88CY8 is predicted to mobilize rather than synthesize glycogen, so the
        child glycogen catabolic process is the core pathway role.
      supported_by:
        - reference_id: file:PSEPK/glgP/glgP-uniprot.txt
          supporting_text: "glycogen catabolism, the phosphorolytic cleavage of glycogen to produce"
  - term:
      id: GO:0005980
      label: glycogen catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: GlgP phosphorolysis directly mobilizes glycogen chain segments.
      action: ACCEPT
      reason: >-
        The glycogen-phosphorylase family assignment and EC 2.4.1.1 reaction
        support a direct role in glycogen catabolism, while the imported
        claim that this is rate-limiting in KT2440 is not adopted.
      supported_by:
        - reference_id: file:PSEPK/glgP/glgP-uniprot.txt
          supporting_text: "DR   GO; GO:0005980; P:glycogen catabolic process; IEA:TreeGrafter."
  - term:
      id: GO:0008184
      label: glycogen phosphorylase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The family-level annotation specifies glycogen as the alpha-glucan substrate.
      action: ACCEPT
      reason: >-
        Q88CY8 belongs to the glycogen phosphorylase family and carries the
        expected EC 2.4.1.1 reaction. Direct assays are still needed to measure
        selectivity among KT2440 alpha-glucans.
      supported_by:
        - reference_id: file:PSEPK/glgP/glgP-uniprot.txt
          supporting_text: "DR   GO; GO:0008184; F:glycogen phosphorylase activity; IEA:InterPro."
  - term:
      id: GO:0030170
      label: pyridoxal phosphate binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: PLP binding is a conserved cofactor property of glycogen phosphorylases.
      action: KEEP_AS_NON_CORE
      reason: >-
        UniProt predicts pyridoxal 5'-phosphate as the cofactor and identifies
        the corresponding family attachment-site signature, but cofactor
        binding is ancillary to the catalytic phosphorolysis annotation.
      supported_by:
        - reference_id: file:PSEPK/glgP/glgP-uniprot.txt
          supporting_text: "Name=pyridoxal 5'-phosphate; Xref=ChEBI:CHEBI:597326;"
