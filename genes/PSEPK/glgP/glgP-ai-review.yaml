id: Q88CY8
gene_symbol: glgP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GlgP (PP_5041) is a predicted pyridoxal-5'-phosphate-dependent alpha-1,4-glucan
  phosphorylase. It phosphorolytically shortens glycogen or related alpha-1,4
  glucans to release alpha-D-glucose 1-phosphate, acting with a debranching
  enzyme during polymer mobilization. The precise KT2440 substrate preference
  and allosteric regulation have not been experimentally established.
