    review:
      summary: This term captures the alpha-1,4-glucan phosphorolysis chemistry.
      action: ACCEPT
      reason: >-
        Q88CY8 is assigned EC 2.4.1.1/RHEA:41732, which releases
        alpha-D-glucose 1-phosphate from an alpha-1,4-glucan chain.
