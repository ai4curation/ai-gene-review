    knowledge_gaps:
      - gap_statement: >-
          Q88CY8 substrate preference and allosteric regulation have not been
          directly characterized in P. putida KT2440.
        significance: >-
          The proteome contains multiple connected alpha-glucan pathways, so
          family-level glycogen specificity should be tested experimentally.
proposed_new_terms: []
suggested_questions:
  - question: Which KT2440 alpha-glucan pool is the preferred in-vivo substrate of GlgP?
suggested_experiments:
  - description: >-
      Measure Q88CY8 kinetics on GlgA/GlgB-derived glycogen and
      TreS-Mak-GlgE-derived alpha-glucan, test candidate allosteric effectors,
      and quantify polymer mobilization in a glgP deletion strain.
