    title: UniProtKB entry for glgP (Q88CY8)
    findings:
      - statement: >-
          The record assigns alpha-1,4-glucan phosphorylase EC 2.4.1.1,
          RHEA:41732, a PLP cofactor, and the glycogen-phosphorylase family.
  - id: PMID:33872310
    title: Trehalose and α-glucan mediate distinct abiotic stress responses in Pseudomonas aeruginosa.
    findings:
      - statement: >-
          Purified P. aeruginosa GlgP generated alpha-glucose 1-phosphate from
          maltohexaose, and deletion increased trehalose and alpha-glucan,
          directly supporting phosphorylase function in a close homolog.
        supporting_text: >-
          Thus, GlgP is a glycogen phosphorylase whose absence leads to the
          increased accumulation of trehalose and α-glucan in vivo.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verified; direct biochemical and genetic evidence concerns
        the P. aeruginosa PAO1 homolog rather than PSEPK Q88CY8.
core_functions:
