    action: MODIFY
    reason: >-
      Following the RADICAL_SAM project rule for the generic domain-derived rows (projects/RADICAL_SAM.md):
      the row is true, not an over-annotation, so it is refined rather than flagged. LipA has a defined
      reaction, lipoate synthase activity (EC 2.8.1.8), which this entry already carries.
