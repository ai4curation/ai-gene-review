      The report supports the radical-SAM lipoate synthase assignment, two
      4Fe-4S-cluster architecture, and direct placement after LipB.
  - statement: >-
      No direct biochemical characterization of Q88DM5 was identified, so
      detailed mechanistic and client-specific claims remain ortholog-derived.
