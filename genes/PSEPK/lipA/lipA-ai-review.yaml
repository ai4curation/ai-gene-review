  title: OpenScientist gene research report for lipA
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Supports LipA as the radical-SAM lipoate synthase acting after LipB,
      including the two 4Fe-4S-cluster architecture; no direct Q88DM5
      biochemistry was found, and client specificity, Fe-S cluster
      regeneration, operon/regulation, essentiality, and salvage capacity
      remain inferred.
