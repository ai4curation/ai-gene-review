- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Binding two 4Fe-4S clusters is required mechanistic context for LipA.
    action: ACCEPT
    reason: >-
      Core cofactor binding under the project rule: the radical SAM [4Fe-4S] cluster is what generates
      the 5'-deoxyadenosyl radical and the second [4Fe-4S] cluster is the sulfur donated to the product,
      so neither is ancillary to lipoate synthase activity. Catalysis is established for this protein
      by the HAMAP family rule and the E. coli and human orthologues, so the row is ACCEPT, not KEEP_AS_NON_CORE.
    supported_by:
    - reference_id: file:PSEPK/lipA/lipA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'CC       Note=Binds 2 [4Fe-4S] clusters per subunit. One cluster is coordinated'
- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: file:PSEPK/lipA/lipA-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      lipA binds S-adenosyl-L-methionine at the unique iron of its radical SAM [4Fe-4S] cluster and cleaves
      it to the 5'-deoxyadenosyl radical; two SAM are consumed per lipoyl group formed.
    action: NEW
    reason: >-
      Not in GOA. Added under the RADICAL_SAM treatment rule, which treats GO:1904047 as a core cosubstrate-binding
      function of every radical SAM enzyme whose catalysis is established. This is a molecular function
      the protein itself performs, so the participation test is met directly: lipA binds SAM and cleaves
      it, rather than merely being required for a process that consumes it. UniProt's curated cofactor
      note records the exchangeable S-adenosyl-L-methionine on the radical SAM cluster and the entry's
      binding features name the 4Fe-4S-S-AdoMet ligand, so the claim rests on curated record content rather
      than on an electronic GO line. Coded IC because the inference is the reviewer's, drawn from that
      curated content and the established lipoate synthase activity rather than from a SAM-binding assay
      on this protein. Comparator check: the same NEW row was added to human LIAS and BACSU/lipA and to
      17 other active members in this project, and 18 of the 20 members with established catalysis were
      found to be missing it in GOA.
    supported_by:
    - reference_id: file:PSEPK/lipA/lipA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 [4Fe-4S] clusters per subunit. One cluster is coordinated
    - reference_id: file:PSEPK/lipA/lipA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: cysteines and an exchangeable S-adenosyl-L-methionine
    - reference_id: file:PSEPK/lipA/lipA-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand_note="4Fe-4S-S-AdoMet"
