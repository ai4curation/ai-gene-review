- id: PMID:37255442
  title: Characterization of Pseudomonas aeruginosa l,d-Transpeptidases and Evaluation of Their Role in Peptidoglycan Adaptation to Biofilm Growth.
  findings:
  - statement: Pseudomonas L,D-transpeptidase paralogs have experimentally distinct crosslinking, OprI-anchoring, and tether-hydrolysis functions.
    supporting_text: We found that the three P. aeruginosa LDTs catalyze peptidoglycan cross-linking (LdtPae1), the anchoring of lipoprotein OprI to the peptidoglycan (LdtPae2), and the hydrolysis of the resulting peptidoglycan-OprI amide bond (LdtPae3).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and verified; the PSEPK assignment additionally depends on exact subfamily and orthology evidence.
- id: PMID:42100858
  title: Outer Membrane-Peptidoglycan Anchoring in Pseudomonas aeruginosa.
  findings:
  - statement: PA2854 directly anchors OprI to peptidoglycan in vivo and with purified components in vitro.
    supporting_text: We document that the gene product of PA2854 is the catalyst that performs this transformation between the cell wall and the outer-membrane lipoprotein OprI in live Pseudomonas aeruginosa.
  - statement: The PA2854 reaction was reconstituted with purified PA2854, OprI, and synthetic peptidoglycan.
    supporting_text: Furthermore, we reconstitute this reaction in vitro with the use of purified recombinant PA2854, OprI, and synthetic samples of the cell-wall peptidoglycan, in each case documenting the attachment of the side-chain ε-amino group of Lys83 of OprI to the peptide stem of the peptidoglycan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; directly establishes the function of PA2854/Q9HZZ0, the close Pseudomonas ortholog and module exemplar.
