id: Q88KH0
gene_symbol: PP_2320
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_2320 is a Sec-exported, periplasmic YkuD-family L,D-transpeptidase with
  LysM and catalytic domains. It is predicted to covalently anchor the major
  outer-membrane lipoprotein OprI to a peptidoglycan stem, coupling the outer
  membrane to the cell-wall sacculus.
