- term:
    id: GO:0010906
    label: regulation of glucose metabolic process
  evidence_type: IMP
  original_reference_id: PMID:18245293
  review:
    summary: PtxS regulates the peripheral glucose-utilization branch through gluconate and 2-ketogluconate.
    action: NEW
    reason: KT2440 ptxS disruption changes expression of the gluconate-oxidation, 2-ketogluconate transport
      and downstream utilization genes. Together with the promoter-binding/repression work (PMID:20581202),
      this identifies the regulatory step performed by PtxS itself. This is regulation of the pathway,
      not participation in its catabolic reactions. The broad regulatory process is used because repression
      of branch genes does not alone quantify the net sign of glucose flux across parallel routes. It
      is not an is_a/part_of ancestor or descendant of the existing transcription-regulation term. Same-role
      comparator checks and their limits are recorded in the notes.
