core_functions:
- description: Represses transcription from the kgu and gad catabolic-operon promoters and its own promoter
    by sequence-specific operator binding. This controls expression of the gluconate-to-6-phosphogluconate
    branch through 2-ketogluconate. Direct binding of 2-ketogluconate reduces DNA occupancy and derepresses
    the promoters; PtxS regulates enzyme and transporter expression rather than performing their metabolic
    reactions.
