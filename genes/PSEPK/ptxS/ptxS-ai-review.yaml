- id: PMID:20581202
  title: Compartmentalized glucose metabolism in Pseudomonas putida is controlled by the PtxS repressor.
  findings:
  - statement: PtxS is a dimeric LacI/GalR-family repressor that binds a palindromic operator overlapping
      the RNA polymerase binding site in the kgu and gad operon promoters and its own promoter, repressing
      them.
    supporting_text: Footprint analysis revealed that PtxS binds to an almost perfect palindrome that
      is present within the three promoters and whose consensus sequence is 5'-TGAAACCGGTTTCA-3'. This
      palindrome overlaps with the RNA polymerase binding site.
    reference_section_type: ABSTRACT
  - statement: 2-Ketogluconate is the molecular effector, binding PtxS with an apparent KD of 15 microM
      and causing dissociation from target promoters (de-repression).
    supporting_text: in vitro we found that only 2-ketogluconate binds to the regulator with an apparent
      K(D) (equilibrium dissociation constant) of 15 muM, as determined using isothermal titration calorimetry
      assays.
    reference_section_type: ABSTRACT
  - statement: PtxS is a homodimer with an N-terminal HTH DNA-binding domain and a C-terminal effector-binding
      domain.
    supporting_text: PtxS is made of two domains, a helix-turn-helix DNA-binding domain located at the
      N terminus and a C-terminal domain that binds the effector.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and publisher full text inspected on 2026-11-08. The methods explicitly
      use KT2440 DNA, wild-type KT2440 and its isogenic ptxS mutant; reporter assays, purified-protein
      EMSA, operator footprinting, oligomerization and calorimetry support the claims used here. The publication
      cache remains abstract-only, so quotations in this review are restricted to that cached abstract.
      The PtxS effector is 2-ketogluconate; glucose/gluconate induction is not evidence of direct ligand
      binding. No Pseudomonas aeruginosa exotoxin or PtxR interaction claim is transferred.
- id: PMID:18245293
  title: A set of activators and repressors control peripheral glucose pathways in Pseudomonas putida
    to yield a common central intermediate.
  findings:
  - statement: KT2440 mutant and transcript experiments identify PtxS as a regulator of the gluconate/2-ketogluconate
      branch of glucose metabolism.
    supporting_text: PtxS, however, controls the enzymes for oxidation of gluconate to 2-ketogluconate,
      its transport and metabolism, and a set of genes unrelated to glucose metabolism.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and primary full-text Methods, Table 3, and the PtxS regulon results
      inspected. The study uses KT2440 and the isogenic ptxS mutant PSC303. It supports pathway regulation
      through enzyme/transporter expression, not execution of catabolic reactions by PtxS. Differential-expression
      hits outside the established branch are not automatically direct targets.
