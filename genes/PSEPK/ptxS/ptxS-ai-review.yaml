proposed_new_terms: []
suggested_questions:
- question: Which additional KT2440 promoters, if any, are direct physiological PtxS targets beyond the
    experimentally characterized kgu, gad and ptxS promoters?
- question: How is PtxS-mediated repression integrated with the other KT2440 carbon regulators across
    environmental carbon mixtures?
suggested_experiments:
- description: Combine genome-wide PtxS occupancy with a matched transcriptional response and promoter-site
    perturbations under defined carbon conditions to distinguish direct targets from downstream expression
    effects.
