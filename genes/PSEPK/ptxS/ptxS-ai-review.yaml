taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PtxS is a LacI/GalR-family DNA-binding transcriptional repressor in Pseudomonas putida KT2440.
  It controls the gluconate-to-6-phosphogluconate branch through 2-ketogluconate by repressing the kgu
  and gad operons, and also represses its own transcription. The homodimer recognizes palindromic operator
  sites that overlap RNA polymerase binding regions. Binding of 2-ketogluconate, with an apparent dissociation
  constant of about 15 micromolar, reduces operator binding and relieves repression. Its N-terminal helix-turn-helix
  region mediates DNA recognition and its C-terminal domain binds the effector.
