pathway_context:
- name: Regulation of gluconate and 2-ketogluconate utilization
  relationship: regulates
  mechanism: PtxS represses the gad and kgu catabolic promoters. Effector-mediated release permits expression
    of enzymes and transport functions for the gluconate-to-6-phosphogluconate branch through 2-ketogluconate.
    This records regulation, not participation of PtxS in the metabolic reactions.
  evidence: *id001
