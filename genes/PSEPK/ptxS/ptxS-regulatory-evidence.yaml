regulator:
  accession: Q88HH7
  locus: PP_3380
  taxon: NCBITaxon:160488
relationships:
- id: PSEPK:ptxS:represses:Pkgu:20581202
  target:
    name: kgu catabolic-operon promoter
    type: promoter
  effect: represses
  directness: direct
  experimental_strain: Pseudomonas putida KT2440; wild-type and isogenic ptxS mutant. KT2440 protein was
    heterologously produced in Escherichia coli BL21(DE3).
  condition: Promoter reporters in M9 minimal medium with citrate; induction tested by adding 5 mM glucose,
    gluconate or 2-ketogluconate. Direct DNA binding tested with purified PtxS; 2-ketogluconate decreases
    occupancy.
  evidence: &id001
  - reference_id: PMID:20581202
    source_url: https://journals.asm.org/doi/full/10.1128/JB.00520-10
    assay: Promoter-lacZ expression in wild-type KT2440 and isogenic ptxS mutant, purified-protein EMSA
      and DNase I footprinting
    supporting_text: PtxS binds to an almost perfect palindrome
  interpretation: PtxS directly represses the kgu operon promoter, controlling expression of enzymes/transport
    functions in the gluconate-to-6-phosphogluconate branch via 2-ketogluconate. The ptxS mutant increases
    reporter expression; binding and promoter protection support direct regulation.
  limitations:
  - The assertion is at promoter level, not a separate binding site for each downstream gene.
  - No genomic-coordinate or complete-operon membership transfer is performed.
  - This source is also used by UniProt/CollecTF; those annotations are not independent experiments.
