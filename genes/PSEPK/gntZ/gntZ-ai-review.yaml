id: Q88FP6
gene_symbol: gntZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  gntZ (PP_4043) encodes a 6-phosphogluconate dehydrogenase family enzyme in
  Pseudomonas putida KT2440. UniProt and GOA identify it as a decarboxylating
  6-phosphogluconate dehydrogenase (EC 1.1.1.44) with NADP binding, placing it
  in the pentose phosphate pathway step that oxidatively decarboxylates
  6-phosphogluconate to ribulose 5-phosphate while generating NADPH. Current
  evidence supports Q88FP6 as the single KT2440 6-phosphogluconate
  dehydrogenase, acting at the 6-phosphogluconate branch point between
  Entner-Doudoroff flux and the oxidative PPP.
existing_annotations:
- term:
    id: GO:0004616
    label: phosphogluconate dehydrogenase (decarboxylating) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the exact catalytic activity for the annotated EC 1.1.1.44 enzyme.
      UniProt names Q88FP6 as decarboxylating 6-phosphogluconate dehydrogenase,
      and GOA links the term to InterPro and EC evidence.
    action: ACCEPT
    reason: >-
      The term captures the core molecular function of gntZ in the oxidative
      pentose phosphate pathway. Support is family-level: Q88FP6 matches the
      6-phosphogluconate dehydrogenase signatures InterPro IPR006183
      (Pgluconate_DH), Pfam PF00393 (6PGD C-terminal domain) and the
      NADP-binding domain IPR006115, and NCBIfam TIGR00872 (gnd_rel, the
      Gnd-related decarboxylating 6PGDH clade). The submitter-supplied
      protein name is not used as support, and Q88FP6 has not been assayed
      directly.
    supported_by:
    - reference_id: file:PSEPK/gntZ/gntZ-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR006183; Pgluconate_DH."
    - reference_id: file:PSEPK/gntZ/gntZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR00872; gnd_rel; 1."
    - reference_id: file:PSEPK/gntZ/gntZ-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00393; 6PGD; 1."
- term:
    id: GO:0006098
    label: pentose-phosphate shunt
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      The enzyme catalyzes the oxidative PPP decarboxylation step producing
      ribulose 5-phosphate, so the broad pentose-phosphate shunt annotation is
      correct but less informative than the oxidative-branch child term.
    action: MODIFY
    reason: Correct but less specific than GO:0009051 pentose-phosphate shunt, oxidative branch,
      an is_a child of GO:0006098; this enzyme catalyses a step of the oxidative branch, so the
      branch term is the informative replacement. Applied the same way to every oxidative-branch
      ortholog in the pentose phosphate pathway module.
    proposed_replacement_terms:
    - id: GO:0009051
      label: pentose-phosphate shunt, oxidative branch
    supported_by:
    - reference_id: file:PSEPK/gntZ/gntZ-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00393; 6PGD; 1."
    - reference_id: file:PSEPK/gntZ/gntZ-deep-research-openscientist.md
      supporting_text: This is the committed oxidative-decarboxylating step of the oxidative pentose phosphate pathway (oxPPP).
- term:
    id: GO:0009051
    label: pentose-phosphate shunt, oxidative branch
  evidence_type: ISS
  original_reference_id: file:PSEPK/gntZ/gntZ-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: >-
      GntZ performs the oxidative decarboxylation that completes the oxidative
      pentose-phosphate branch and produces ribulose 5-phosphate and NADPH.
    action: NEW
    reason: >-
      This child term captures the demonstrated pathway placement more
      precisely than the existing general pentose-phosphate shunt annotation.
    supported_by:
    - reference_id: file:PSEPK/gntZ/gntZ-deep-research-openscientist.md
      supporting_text: This is the committed oxidative-decarboxylating step of the oxidative pentose phosphate pathway (oxPPP).
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      NADP binding is consistent with the dehydrogenase family and with the
      NADP-dependent oxidative PPP reaction, but it is a cofactor property rather
