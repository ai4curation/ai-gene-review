suggested_questions:
  - question: Does PSEPK UreG receive nickel directly from UreE, and is its GTPase cycle gated by Q88J01 UreF?
suggested_experiments:
  - hypothesis: Q88J00 receives nickel from UreE and releases it productively in a UreF-gated GTPase cycle.
    description: Reconstitute UreE-to-UreG nickel transfer and correlate Q88J00 nucleotide state with nickel release and UreABC activation.
    experiment_type: Metal-transfer, nucleotide-state, GTPase, and urease activation assays
