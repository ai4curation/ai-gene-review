id: Q88J00
gene_symbol: ureG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreG is a cytoplasmic G3E-family GTPase and nickel metallochaperone for
  urease maturation. In the UreD-UreF activation complex it couples GTP
  hydrolysis to productive delivery and installation of nickel in the UreC
  dinickel active site.
existing_annotations:
  - term:
      id: GO:0003924
      label: GTPase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: GTPase activity is the defining nucleotide-dependent function of UreG.
      action: ACCEPT
      reason: UreG-dependent GTP hydrolysis is required for physiological urease activation (PMID:10500143).
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: UreG acts in the cytoplasmic urease activation machinery.
      action: ACCEPT
      reason: This matches reviewed UniProt and the soluble UreDFG-apourease complex.
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: UreG binds nickel during metallocenter delivery.
      action: ACCEPT
      reason: >-
        K. aerogenes UreG directly binds one nickel ion with micromolar affinity
        (PMID:22369361), and Q88J00 belongs to the conserved UreG G3E GTPase
        family. This is strong orthology evidence rather than a direct KT2440
        metal-binding measurement.
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: In K. aerogenes this protein is a monomer that binds one Ni or one Zn with Kd values of about 5 μM
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: UreG is required to activate the enzyme that performs urea catabolism.
      action: ACCEPT
      reason: GTP-dependent metallocenter assembly is necessary for mature urease activity (PMID:10500143).
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
  - id: PMID:10500143
    title: GTP-dependent activation of urease apoprotein in complex with the UreD, UreF, and UreG accessory proteins.
    findings:
      - statement: GTP hydrolysis at UreG is required for efficient nickel-dependent activation.
        supporting_text: >-
          The critical nucleotide-binding site was localized to UreG on the
          basis of experiments using a variant complex.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: 'Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation.'
    findings:
      - statement: Purified Klebsiella aerogenes UreG binds nickel or zinc with micromolar affinity.
        supporting_text: In K. aerogenes this protein is a monomer that binds one Ni or one Zn with Kd values of about 5 μM
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verified. This directly measures metal binding by the close
        ortholog and supports transfer to the conserved Q88J00 UreG family,
        while remaining non-target experimental evidence.
