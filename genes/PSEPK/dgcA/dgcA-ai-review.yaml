- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001155
  - InterPro:IPR023753
  review:
    summary: >-
      Correct but very general. By orthology to DdhC, DgcA is a CH-NH-oxidizing
      demethylase whose electron acceptor is the 2[4Fe-4S] ferredoxin DgcB
      (EC 1.5.7.3).
    action: MODIFY
    reason: >-
      This InterPro2GO row (GO_REF:0000002, from IPR001155 and IPR023753) gives
      only the root oxidoreductase term. DgcA is 81.2% identical over its full
      length to DdhC (Q1QYW1). UniProt curates DdhC reactions as EC 1.5.7.3,
      demethylating N,N-dimethylglycine (and sarcosine) with an oxidized
      2[4Fe-4S] ferredoxin as acceptor, and the ferredoxin is the DgcB ortholog
      Csal_0991. In P. aeruginosa the orthologous dgcAB genes are required for
      dimethylglycine-to-sarcosine conversion. The existing GO term for this
      chemistry is GO:0033694 (oxidoreductase activity, acting on the CH-NH
      group of donors, iron-sulfur protein as acceptor; EC:1.5.7.-).

      GO:0047865 dimethylglycine dehydrogenase activity is not used. Its
      definition ("N,N-dimethylglycine + electron-transfer flavoprotein + H2O =
      sarcosine + formaldehyde + reduced electron-transfer flavoprotein",
      EC:1.5.8.4) makes ETF the direct acceptor, but here the ETF sits after DgcB.
      The EC=1.5.8.- in the TrEMBL record is a submitter annotation
      (ECO:0000313), not evidence. The replacement is GO:0033694 now, plus the
      substrate-specific EC 1.5.7.3 child term in proposed_new_terms. Whether the
      KT2440 enzyme also demethylates sarcosine, as DdhC does in vitro, is
      untested.
    proposed_replacement_terms:
    - id: GO:0033694
      label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
    - id: NTR
      label: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
