core_functions:
- description: >-
    Soluble FAD-containing dehydrogenase that, by orthology to DdhC, oxidatively
    demethylates N,N-dimethylglycine to sarcosine and formaldehyde and passes the
    electrons to the membrane-anchored 2[4Fe-4S] ferredoxin DgcB (EC 1.5.7.3).
    This is the dimethylglycine step of glycine betaine catabolism. Sarcosine
    demethylation, seen for DdhC in vitro, has not been tested for the KT2440
    enzyme.
    GO has no term for EC 1.5.7.3 itself; the exact activity is proposed as
    "N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity" (see
    proposed_new_terms), a child of the term used here.
  molecular_function:
    id: GO:0033694
    label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
  directly_involved_in:
  - id: GO:0031457
    label: glycine betaine catabolic process
  supported_by:
  - reference_id: PMID:17951379
    supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other
      enzymes with demethylase activity, are required for the conversion of DMG to sarcosine
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O ='
  - reference_id: file:PSEPK/dgcA/dgcA-bioinformatics/RESULTS.md
    supporting_text: Q88R24 and Q1QYW1 share 81.2% identity over their full length
  knowledge_gaps:
  - gap_statement: >-
      The KT2440 DgcA protein has not been purified or assayed. Its flavin
      content (FAD, or FAD plus FMN in the TIM barrel), its substrate range
      (dimethylglycine only, or sarcosine as well) and direct reduction of DgcB
      are all inferred from the Chromohalobacter ortholog.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Pseudomonas sarcosine catabolism needs soxBDAG, so the physiological
      relevance of any DgcA sarcosine activity, and the acceptor chemistry of the
      Pseudomonas enzyme, decide how the pathway is modelled across Pseudomonas.
proposed_new_terms:
- proposed_name: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
  proposed_definition: >-
    Catalysis of the reactions: N,N-dimethylglycine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = sarcosine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+, and sarcosine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = glycine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+.
  justification: >-
    EC 1.5.7.3 and RHEA:74167/RHEA:74155 describe the DgcA/DdhC reaction, but GO
    has no corresponding term. The only dimethylglycine and sarcosine
    dehydrogenase terms (GO:0047865, EC:1.5.8.4; GO:0008480, EC:1.5.8.3) are
    defined with electron-transfer flavoprotein as the direct acceptor, whereas
    in the DgcAB system the ETF acts after the DgcB ferredoxin. The closest
    existing term is the generic parent GO:0033694.
  proposed_parent:
    id: GO:0033694
    label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: EC:1.5.7.3
      label: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74167
      label: oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O = reduced 2[4Fe-4S]-[ferredoxin] + sarcosine + formaldehyde
        + 2 H(+)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74155
      label: oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced 2[4Fe-4S]-[ferredoxin] + glycine + formaldehyde + 2 H(+)
  supported_by:
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O ='
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced'
suggested_questions:
- question: Which flavin(s) does KT2440 DgcA bind, and does it demethylate sarcosine as well as dimethylglycine?
- question: Does the PP_0312/PP_0313 ETF heterodimer accept electrons directly from reduced DgcB?
suggested_experiments:
- description: >-
    Purify KT2440 DgcA, determine its bound flavins and nucleotides, and assay
    dimethylglycine and sarcosine demethylation (formaldehyde release) with
    NAD(P)+ and with membranes containing DgcB, comparing wild-type and
    PP_0311-deleted membranes.
  experiment_type: biochemical assay
