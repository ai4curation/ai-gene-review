- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: ISS
  original_reference_id: PMID:17951379
  qualifier: involved_in
  review:
    summary: >-
      DgcA catalyses the dimethylglycine-to-sarcosine step of glycine betaine
      catabolism, as shown for its orthologs in P. aeruginosa (genetics and 13C
      tracing) and C. salexigens (enzymology and genetics).
    action: NEW
    reason: >-
      In P. aeruginosa, glycine betaine is degraded by stepwise demethylation:
      gbcAB turns glycine betaine into dimethylglycine, dgcAB turns
      dimethylglycine into sarcosine, and soxBDAG turns sarcosine into glycine.
      13C NMR tracing showed that dgcAB mutants block the dimethylglycine step.
      The Chromohalobacter ortholog DdhC catalyses that step directly. DgcA
      passes the participation test, since it is the enzyme that oxidizes the
      dimethylglycine. The same ISS-level inference for KT2440 is supported by
      the conserved dgcA-dgcB-etf locus and 81% identity to DdhC. GO:0031457 is
      defined as "The chemical reactions and pathways resulting in the breakdown
      of glycine betaine, N-trimethylglycine". GO has no dimethylglycine
      catabolic process term.
    supported_by:
    - reference_id: PMID:17951379
      supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other
        enzymes with demethylase activity, are required for the conversion of DMG to sarcosine
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991, csal_0992, and csal_0993
        genes are responsible for DMG degradation to sarcosine
