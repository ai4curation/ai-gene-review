id: Q88R24
gene_symbol: dgcA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DgcA (PP_0310) is the soluble flavin-binding subunit of the membrane-associated
  DgcAB dimethylglycine dehydrogenase system. Together with the iron-sulfur
  membrane subunit DgcB, it converts dimethylglycine to sarcosine during
  stepwise glycine-betaine catabolism. Conserved locus organization, genetics,
  and the proposed electron-transfer architecture of the Chromohalobacter
  system support a ferredoxin step through DgcB followed by transfer to the
  adjacent ETF heterodimer, although the KT2440 proteins have not been
  reconstituted directly.
existing_annotations:
  - term:
      id: GO:0010181
      label: FMN binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The InterPro fold name does not establish FMN as the bound flavin, but cross-species FAD evidence does not exclude FMN in Q88R24.
      action: UNDECIDED
      reason: >-
        Q1QYW1 directly binds noncovalent FAD, but the broad oxidoreductase
        family assignment is not sufficient to transfer cofactor specificity
        confidently or to remove the existing FMN inference for Q88R24.
      supported_by:
        - reference_id: file:PSEPK/dgcA/dgcA-uniprot.txt
          supporting_text: "DR   InterPro; IPR001155; OxRdtase_FMN_N."
        - reference_id: PMID:32631860
          supporting_text: "a monomer of 79 kDa with a noncovalently bound flavin adenine dinucleotide"
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but too broad for the dimethylglycine-oxidizing DgcA subunit.
      action: MODIFY
      reason: >-
        GO:0047865 captures dimethylglycine-to-sarcosine oxidation, but its
        definition specifies direct ETF reduction. The bacterial DgcAB model
        instead places the DgcB iron-sulfur protein as the immediate acceptor,
        so a ferredoxin-linked child term is proposed below.
      proposed_replacement_terms:
        - id: GO:0047865
          label: dimethylglycine dehydrogenase activity
      supported_by:
        - reference_id: PMID:17951379
          supporting_text: "conversion of DMG to sarcosine."
  - term:
      id: GO:0050660
      label: flavin adenine dinucleotide binding
    evidence_type: ISS
    original_reference_id: PMID:32631860
    qualifier: enables
    review:
      summary: The characterized ortholog is an FAD-containing dimethylglycine dehydrogenase.
      action: NEW
      reason: This supports FAD as the likely DgcA flavin while direct cofactor identification for Q88R24 remains outstanding.
      supported_by:
        - reference_id: PMID:32631860
          supporting_text: "a monomer of 79 kDa with a noncovalently bound flavin adenine dinucleotide"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: file:PSEPK/dgcA/dgcA-uniprot.txt
    title: UniProtKB entry for dgcA (Q88R24)
    findings:
      - statement: Q88R24 is a 686-residue FMN-dependent oxidoreductase assigned as a DgcA subunit.
  - id: PMID:17951379
    title: Identification of two gene clusters and a transcriptional regulator required for Pseudomonas aeruginosa glycine betaine catabolism.
    findings:
      - statement: Pseudomonas genetics and isotope tracing place DgcAB in dimethylglycine-to-sarcosine conversion.
        supporting_text: "conversion of DMG to sarcosine."
  - id: PMID:32631860
    title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
    findings:
      - statement: Q1QYW1 is directly characterized as an FAD-containing, NAD(P)-using dehydrogenase; its four-gene locus supports a proposed downstream ferredoxin-to-ETF relay.
        supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
core_functions:
  - description: >-
      Flavin-binding catalytic subunit of the DgcAB system that oxidizes
      dimethylglycine to sarcosine while reducing the DgcB iron-sulfur
      ferredoxin. The exact Q88R24 flavin remains unresolved.
    molecular_function:
      id: GO:0047865
      label: dimethylglycine dehydrogenase activity
    supported_by:
      - reference_id: PMID:17951379
        supporting_text: "conversion of DMG to sarcosine."
proposed_new_terms:
  - proposed_name: dimethylglycine dehydrogenase (iron-sulfur protein acceptor) activity
    proposed_definition: >-
      Catalysis of the oxidation of N,N-dimethylglycine to sarcosine and a
      one-carbon product, with electron transfer to an iron-sulfur protein.
    justification: >-
      GO:0047865 specifies direct reduction of electron-transfer flavoprotein,
      whereas the bacterial DgcAB architecture places a membrane-associated
      DgcB iron-sulfur protein as the immediate acceptor before downstream ETF.
    proposed_parent:
      id: GO:0016645
      label: oxidoreductase activity, acting on the CH-NH group of donors
    supported_by:
      - reference_id: PMID:32631860
        supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
suggested_questions:
  - question: Which flavin is bound by KT2440 DgcA, and does PP_0312/PP_0313 directly accept electrons from reduced DgcB?
suggested_experiments:
  - description: Reconstitute DgcA with membrane-embedded DgcB and measure dimethylglycine-to-sarcosine conversion with candidate electron acceptors.
