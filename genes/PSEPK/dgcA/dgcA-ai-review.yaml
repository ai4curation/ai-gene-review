  - id: PMID:17951379
    title: Identification of two gene clusters and a transcriptional regulator required for Pseudomonas aeruginosa glycine betaine catabolism.
    findings:
      - statement: Pseudomonas genetics and isotope tracing place DgcAB in dimethylglycine-to-sarcosine conversion.
        supporting_text: "conversion of DMG to sarcosine."
  - id: PMID:32631860
    title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
    findings:
      - statement: Q1QYW1 is directly characterized as an FAD-containing, NAD(P)-using dehydrogenase; its four-gene locus supports a proposed downstream ferredoxin-to-ETF relay.
        supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
core_functions:
  - description: >-
      Flavin-binding catalytic subunit of the DgcAB system that oxidizes
      dimethylglycine to sarcosine while reducing the DgcB iron-sulfur
      ferredoxin. The exact Q88R24 flavin remains unresolved.
    molecular_function:
      id: GO:0016491
      label: oxidoreductase activity
    supported_by:
      - reference_id: PMID:17951379
        supporting_text: "conversion of DMG to sarcosine."
proposed_new_terms: []
suggested_questions:
  - question: Which flavin is bound by KT2440 DgcA, and does PP_0312/PP_0313 directly accept electrons from reduced DgcB?
suggested_experiments:
  - description: Reconstitute DgcA with membrane-embedded DgcB and measure dimethylglycine-to-sarcosine conversion with candidate electron acceptors.
