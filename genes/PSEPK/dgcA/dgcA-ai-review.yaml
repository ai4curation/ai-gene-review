- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001155
  - InterPro:IPR023753
  review:
    summary: >-
      DgcA is an inferred dimethylglycine-oxidizing dehydrogenase; the native electron acceptor has not been directly
      established.
    action: MODIFY
    reason: >-
      The root oxidoreductase term is refined to its CH-NH-donor descendant GO:0016645. Full-length identity to
      DdhC (81.2%) plus P. aeruginosa pathway genetics support dimethylglycine oxidation. Purified Chromohalobacter
      DdhC produced sarcosine and formaldehyde in an approximately 1:1:1 substrate/product ratio, but its measured
      electron-transfer assays used PMS with DCPIP or NBT. NAD(P)+ dependence was measured in the PMS/DCPIP assay;
      it does not demonstrate free NAD(P)H production as the terminal physiological product. The DdhC-to-ferredoxin-to-ETF
      sequence is proposed in the discussion, not reconstituted. Neither GO:0033694 (iron-sulfur acceptor) nor GO:0047865
      (direct ETF acceptor) should fix that uncertain partner here. The historical ferredoxin-specific NTR is retained
      as an explicitly conditional ontology proposal, not a current activity assignment. Sarcosine oxidation by
      DdhC also cannot establish this secondary substrate for KT2440 DgcA.
    proposed_replacement_terms:
    - id: GO:0016645
      label: oxidoreductase activity, acting on the CH-NH group of donors
    supported_by:
