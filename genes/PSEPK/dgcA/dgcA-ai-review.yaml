  review:
    summary: >-
      FMN binding is inferred only from the N-terminal Old Yellow Enzyme-type
      TIM-barrel fold. The flavin identified in the purified 81%-identical
      ortholog DdhC is noncovalently bound FAD, with no FMN reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This InterPro2GO row (GO_REF:0000002) maps IPR001155 (NADH:flavin oxidoreductase/NADH oxidase N-terminal domain)
      to FMN binding. That is a fold-level inference and the right default for classical Old Yellow Enzymes. The
      only biochemically characterized member of this subfamily is Chromohalobacter DdhC (Q1QYW1), a full-length
      ortholog with 81.2% identity. Its purified recombinant form contains noncovalently bound FAD, and its curated
      cofactors are FAD and NAD(P)+, without FMN. The full primary article identifies approximately one noncovalent
      FAD per DdhC monomer and reports no covalent flavin. It discusses loss of the usual FMN-linking cysteine.
      This strengthens the FAD assignment without directly measuring all possible cofactors of KT2440 DgcA, so FMN
      binding is not demonstrably impossible. With FAD as the only demonstrated flavin in the subfamily, FMN binding
      is best treated as a likely over-annotation. The same verdict is given on the ortholog's identical InterPro2GO
      row in the DdhC review. The supported FAD-binding term is added as a NEW row below.
