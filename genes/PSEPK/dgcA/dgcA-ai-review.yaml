gene_symbol: dgcA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DgcA (PP_0310) is the catalytic flavoprotein of the dimethylglycine dehydrogenase system of Pseudomonas putida
  KT2440. It is a 686-residue soluble protein with an N-terminal NADH:flavin oxidoreductase (Old Yellow Enzyme-type)
  TIM-barrel domain and a C-terminal FAD/NAD(P)-binding domain, and it is a full-length ortholog (81% identity)
  of the characterized Chromohalobacter salexigens enzyme DdhC. By that orthology, DgcA oxidatively demethylates
  N,N-dimethylglycine to sarcosine and formaldehyde, using FAD. The adjacent membrane-anchored 2[4Fe-4S] ferredoxin
  DgcB (PP_0311) is a proposed electron acceptor, not a demonstrated partner in a reconstituted assay. DgcB is thought
  to reduce the electron transfer flavoprotein encoded by the neighbouring PP_0312/PP_0313 genes. This is the dimethylglycine-to-sarcosine
  step of glycine betaine catabolism, which in Pseudomonas aeruginosa requires the orthologous dgcAB genes. The
  KT2440 protein has not been purified or assayed directly.
