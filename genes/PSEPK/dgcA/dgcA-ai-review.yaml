- id: PMID:32631860
  title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
  findings:
  - statement: >-
      The DgcA ortholog DdhC (csal_0990) is an FAD-containing monomeric
      dimethylglycine dehydrogenase that also acts on sarcosine; it and the
      adjacent ferredoxin and ETF genes are required for dimethylglycine
      degradation to sarcosine.
    supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
      csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full primary text read. Chromohalobacter salexigens DSM 3043 derivative ZW4-1 genetics and purified recombinant
      DdhC support dimethylglycine oxidation. Csal_0991 and ETF roles derive from genetics and architecture; the
      ordered electron-transfer sequence is proposed, not measured. These are ortholog inferences for KT2440.
core_functions:
- description: >-
    Soluble FAD-containing dimethylglycine dehydrogenase inferred by 81.2% full-length identity to Chromohalobacter
    DdhC and Pseudomonas pathway genetics. It supplies the dimethylglycine-to-sarcosine step of glycine betaine
    catabolism. The characterized ortholog forms sarcosine and formaldehyde in dye-linked assays; the native DgcB/ETF
    relay, its order, and secondary sarcosine oxidation by KT2440 DgcA remain untested. The activity term deliberately
    leaves the physiological electron acceptor unspecified.
  molecular_function:
    id: GO:0016645
    label: oxidoreductase activity, acting on the CH-NH group of donors
  directly_involved_in:
  - id: GO:0031457
    label: glycine betaine catabolic process
  supported_by:
  - reference_id: PMID:32631860
    supporting_text: DMGDH activity was measured with the dye-linked assay systems, with PMS as the electron
      intermediator and DCPIP or NBT as the terminal electron acceptor.
  - reference_id: PMID:32631860
    supporting_text: The molar ratio of DMG consumption to the production of sarcosine and formaldehyde was
      determined to be approximately 1:1:1.
  - reference_id: PMID:32631860
    supporting_text: a possible reaction mechanism of DdhC toward DMG was proposed
  - reference_id: file:PSEPK/dgcA/dgcA-bioinformatics/RESULTS.md
    supporting_text: Q88R24 and Q1QYW1 share 81.2% identity over their full length
  knowledge_gaps:
  - gap_statement: >-
      KT2440 DgcA has not been purified or assayed. Its flavin inventory and secondary sarcosine activity are inferred
      from DdhC. Neither DgcA/DdhC reduction of the cognate ferredoxin nor subsequent ETF reduction was directly
      measured in the cited primary work; the ordered relay and final respiratory acceptor remain mechanistic hypotheses.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Pseudomonas sarcosine catabolism needs soxBDAG, so the physiological
      relevance of any DgcA sarcosine activity, and the acceptor chemistry of the
      Pseudomonas enzyme, decide how the pathway is modelled across Pseudomonas.
proposed_new_terms:
- proposed_name: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
  proposed_definition: >-
    Catalysis of the reactions: N,N-dimethylglycine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = sarcosine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+, and sarcosine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = glycine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+.
  justification: >-
    Historical ontology proposal corresponding to EC 1.5.7.3 and RHEA:74167/RHEA:74155, retained as a candidate
    definition rather than an assigned KT2440 activity. These database reactions specify a 2[4Fe-4S] ferredoxin
    acceptor, but the underlying primary work (PMID:32631860) measured dye-linked oxidation and proposed the ferredoxin/ETF
    sequence. The two substrates were assayed for DdhC; KT2440 DgcA secondary sarcosine activity is unknown. Direct
    partner assays are needed before using this acceptor-specific proposal as a core function. The current core
    therefore uses acceptor-unspecified GO:0016645.
  proposed_parent:
    id: GO:0033694
    label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: EC:1.5.7.3
      label: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74167
      label: oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O = reduced 2[4Fe-4S]-[ferredoxin] +
        sarcosine + formaldehyde + 2 H(+)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74155
      label: oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced 2[4Fe-4S]-[ferredoxin] + glycine +
        formaldehyde + 2 H(+)
  supported_by:
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O ='
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced'
  - reference_id: PMID:32631860
    supporting_text: a possible reaction mechanism of DdhC toward DMG was proposed
suggested_questions:
- question: Which flavin(s) does KT2440 DgcA bind, and does it demethylate sarcosine as well as
    dimethylglycine?
- question: Does the PP_0312/PP_0313 ETF heterodimer accept electrons directly from reduced DgcB?
suggested_experiments:
- description: >-
    Purify KT2440 DgcA, determine its bound flavins and nucleotides, and assay
    dimethylglycine and sarcosine demethylation (formaldehyde release) with
    NAD(P)+ and with membranes containing DgcB, comparing wild-type and
    PP_0311-deleted membranes.
  experiment_type: biochemical assay
