gene_symbol: dgcA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DgcA (PP_0310) is the catalytic flavoprotein of the dimethylglycine
  dehydrogenase system of Pseudomonas putida KT2440. It is a 686-residue soluble
  protein with an N-terminal NADH:flavin oxidoreductase (Old Yellow Enzyme-type)
  TIM-barrel domain and a C-terminal FAD/NAD(P)-binding domain, and it is a
  full-length ortholog (81% identity) of the characterized Chromohalobacter
  salexigens enzyme DdhC. By that orthology, DgcA oxidatively demethylates
  N,N-dimethylglycine to sarcosine and formaldehyde, using FAD, and passes the
  electrons to the adjacent membrane-anchored 2[4Fe-4S] ferredoxin DgcB
  (PP_0311). DgcB is thought to reduce the electron transfer flavoprotein
  encoded by the neighbouring PP_0312/PP_0313 genes. This is the
  dimethylglycine-to-sarcosine step of glycine betaine catabolism, which in
  Pseudomonas aeruginosa requires the orthologous dgcAB genes. The KT2440
  protein has not been purified or assayed directly.
existing_annotations:
- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001155
  review:
    summary: >-
      FMN binding is inferred only from the N-terminal Old Yellow Enzyme-type
      TIM-barrel fold. The flavin identified in the purified 81%-identical
      ortholog DdhC is noncovalently bound FAD, with no FMN reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This InterPro2GO row (GO_REF:0000002) maps IPR001155 (NADH:flavin
      oxidoreductase/NADH oxidase N-terminal domain) to FMN binding. That is a
      fold-level inference and the right default for classical Old Yellow
      Enzymes. The only biochemically characterized member of this subfamily is
      Chromohalobacter DdhC (Q1QYW1), a full-length ortholog with 81.2% identity.
      Its purified recombinant form contains noncovalently bound FAD, and its
      curated cofactors are FAD and NAD(P)+, without FMN. FMN in the TIM barrel
      cannot be ruled out from the abstract-only source, so the term is not
      demonstrably wrong. With FAD as the only demonstrated flavin in the
      subfamily, FMN binding is best treated as a likely over-annotation. The
      same verdict is given on the ortholog's identical InterPro2GO row in the
      DdhC review. The supported FAD-binding term is added as a NEW row below.
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: existing as a monomer of 79 kDa with a noncovalently bound flavin adenine dinucleotide
