  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report corroborates the Type 1 OMP decarboxylase assignment and final de novo UMP step.
    supporting_text: pyrF (Q88LW2) is **orotidine 5′-monophosphate decarboxylase (OMPDC, EC 4.1.1.23)**
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      The core OMP decarboxylase assignment agrees with reviewed UniProt, but
      the report extrapolates enzymology, essentiality, 5-FOA counterselection,
      and regulation from orthologs and generic OMPDC literature. Its pyrF/5-FOA
      counterselection framing is uncited, and the only KT2440-specific support
      in that section is an analogy to upp/5-FU counterselection; no direct
      KT2440 PP_1815 enzymology, structure, or loss-of-function evidence was
      located.
