id: Q88GD0
gene_symbol: pbpG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PbpG is a Sec-exported low-molecular-mass penicillin-binding protein 7 of the
  peptidase S11 family. Its primary role is periplasmic D,D-endopeptidase
  cleavage of D-Ala-meso-diaminopimelate 4-3 crosslinks in peptidoglycan,
  helping remodel the sacculus during growth and division. This substrate
  specificity is a high-confidence transfer from the characterized Escherichia
  coli PBP7 ortholog; direct KT2440 enzymology is not available.
existing_annotations:
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PbpG hydrolyzes crosslinks in peptidoglycan rather than peptide bonds in proteins.
    action: REMOVE
    reason: >-
      GO:0006508 is defined as "The hydrolysis of proteins into smaller
      polypeptides and/or amino acids by cleavage of their peptide bonds." PbpG's
      substrate is the murein sacculus, so the reaction is cell-wall remodeling
      rather than proteolysis; the S11 signature records the fold. Treated the
      same way in the sibling PBP4/PBP7 reviews of this module.
    supported_by:
    - reference_id: PMID:7925376
      supporting_text: >-
        Murein meso-diaminopimelate-D-alanine DD-endopeptidase activity was
        demonstrated for both PBP7 and PBP8, which specifically hydrolyse the
        DD-diaminopimelate-alanine bonds in high-molecular-mass murein sacculi
    source_defects:
