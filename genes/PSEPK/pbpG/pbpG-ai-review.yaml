      resource: OTHER
      record: InterPro:IPR001967
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0006508
      confidence: PROBABLE
      explanation: >-
        Resource is InterPro (InterPro2GO; assigned_by InterPro in GOA).
        The InterPro2GO mapping of IPR001967 (Peptidase S11 N-terminal) and IPR018044 (Peptidase S11) to GO:0006508 proteolysis is
        applied to this low-molecular-mass penicillin-binding protein, whose
        substrate is peptidoglycan (stem peptides and crosslinks), not protein.
        The signature records the serine D,D-peptidase fold; the mapping should
        be reviewed for the PBP members of the entry.
