    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PbpG hydrolyzes crosslinks in peptidoglycan rather than peptide bonds in proteins.
    action: REMOVE
    reason: Its substrate is the murein sacculus, so the reaction is cell-wall remodeling rather than proteolysis.
