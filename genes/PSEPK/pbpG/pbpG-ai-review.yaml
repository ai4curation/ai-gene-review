proposed_new_terms:
- proposed_name: peptidoglycan D,D-endopeptidase activity
  proposed_definition: >-
    Catalysis of hydrolysis of a D-alanyl-meso-diaminopimelate 4-3 peptide
    crosslink between stem peptides in peptidoglycan.
  justification: >-
    GO:0009002 names D,D-carboxypeptidase activity and does not represent
    hydrolysis of the inter-stem 4-3 crosslink that defines PBP7 activity.
  proposed_parent:
    id: GO:0016787
    label: hydrolase activity
