proposed_new_terms:
- proposed_name: peptidoglycan D,D-endopeptidase activity
  proposed_definition: >-
    Catalysis of hydrolysis of a D-alanyl-meso-diaminopimelate 4-3 peptide
    crosslink between stem peptides in peptidoglycan.
  justification: >-
    GO:0061785 captures peptidoglycan endopeptidase activity generally, but a
    child term would distinguish hydrolysis of the D-Ala-mDAP 4-3 crosslink
    from other peptidoglycan peptide-bond cleavage specificities.
