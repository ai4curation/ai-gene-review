  review:
    summary: PdxJ performs the ring-forming step of de novo DXP-dependent PLP synthesis.
    action: NEW
    reason: >-
      PdxJ itself catalyses a step of de novo PLP synthesis and has no salvage role, so the
      participation test is met. GOA carries no PLP-biosynthesis row for this protein; the
      de novo term matches the E. coli PdxJ review (NEW, IDA) and the PdxA reviews, where
      GO:0042823 is refined to GO:0036001. Isotope labelling in P. putida shows the organism
      uses this DXP-dependent route.
