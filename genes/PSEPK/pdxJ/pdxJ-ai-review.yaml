suggested_questions:
- question: >-
    Is a pdxJ (PP_1436) deletion of P. putida KT2440 a pyridoxine auxotroph, or is pdxJ essential
    through a polar or moonlighting effect?
suggested_experiments:
- hypothesis: PP_1436 is the sole PNP synthase of KT2440.
  description: >-
    Delete PP_1436 and test growth on minimal medium with and without pyridoxine; assay purified
    PP_1436 coupled to PdxA with HTP, NAD+ and DXP for PNP formation.
