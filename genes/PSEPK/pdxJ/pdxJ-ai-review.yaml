    label: pyridoxine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PdxJ forms pyridoxine 5'-phosphate at branch convergence.
    action: ACCEPT
    reason: >-
      GO has no 'pyridoxine 5'-phosphate biosynthetic process' term; GO:0008615 is the process
      used for the branch that builds the pyridoxine ring, and PdxJ catalyses its final step
      (UniPathway UPA00244 step 5/5). The vitamer formed is PNP rather than free pyridoxine,
      so the term is used in its vitamin-B6-branch sense. Same action as on E. coli PdxJ.
    supported_by:
