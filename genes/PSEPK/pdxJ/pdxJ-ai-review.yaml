  review:
    summary: This is the defining catalytic activity of PdxJ.
    action: ACCEPT
    reason: >-
      GO:0033856 matches EC 2.6.99.2 and RHEA:15265 recorded by HAMAP MF_00279 for this single-function
      family (PTHR30456:SF0, PF03740). The deep-research alignment reports 63% identity to
      E. coli PdxJ with the catalytic residues conserved, and the E. coli enzyme's PNP-forming
      activity was shown directly. No direct assay of PP_1436 exists.
    supported_by:
    - reference_id: file:PSEPK/pdxJ/pdxJ-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: >-
