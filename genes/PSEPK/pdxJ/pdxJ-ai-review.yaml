taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PdxJ (PP_1436) is the pyridoxine 5'-phosphate synthase (EC 2.6.99.2) of Pseudomonas putida
  KT2440. This cytoplasmic TIM-barrel enzyme catalyses the ring-closing condensation of 3-amino-2-oxopropyl
  phosphate (the PdxA product) with 1-deoxy-D-xylulose 5-phosphate (DXP), forming pyridoxine
  5'-phosphate and phosphate, the branch-convergence step of DXP-dependent de novo pyridoxal
  5'-phosphate (vitamin B6) biosynthesis; PdxH subsequently oxidizes the product to PLP. By
  orthology to the structurally characterized Escherichia coli enzyme it forms a homooctamer
  with active sites shared between neighbouring subunits.
