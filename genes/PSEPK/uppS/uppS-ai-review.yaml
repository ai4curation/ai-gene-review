suggested_questions:
- question: How is undecaprenyl-carrier flux partitioned among peptidoglycan, lipopolysaccharide, and
    other envelope glycans in KT2440?
suggested_experiments:
- description: Quantify C55-PP and C55-P pools after controlled UppS depletion and measure the corresponding
    effects on peptidoglycan and lipopolysaccharide synthesis.
