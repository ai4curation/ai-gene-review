taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  UppS is the soluble undecaprenyl-diphosphate synthase of Pseudomonas putida
  KT2440. It condenses eight isopentenyl diphosphate molecules with farnesyl
  diphosphate to make the C55 undecaprenyl diphosphate precursor of the lipid
  carrier used to assemble peptidoglycan, lipopolysaccharide, and other
  bacterial cell-envelope glycans.
