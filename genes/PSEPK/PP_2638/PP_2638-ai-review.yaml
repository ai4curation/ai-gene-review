- id: file:interpro/panther/PTHR12558/PTHR12558-metadata.yaml
  title: PANTHER family metadata for PP_2638
  findings:
  - statement: PANTHER places PP_2638 in a broad repeat-containing family; the specific cellulose operon
      C role is supported by UniProt and InterPro domain context rather than a specific PANTHER family
      name.
- id: PMID:31604608
  title: Architecture of the Cellulose Synthase Outer Membrane Channel and Its Association with the Periplasmic
    TPR Domain.
  findings:
  - statement: The E. coli BcsC C-terminal construct (residues 710-1157) resolves a 16-stranded outer-membrane
      barrel attached to the final TPR repeat; it supports homolog-based assignment of PP_2638 as the
      cellulose export channel.
    supporting_text: The membrane-integrated porin domain of BcsC forms a kidney-shaped 16-stranded β-barrel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Structure used a truncated E. coli construct, not full-length KT2440
      BcsC. The pore supports cellulose passage, not glycosyltransferase activity.
- id: PMID:39242554
  title: Insights into phosphoethanolamine cellulose synthesis and secretion across the Gram-negative
    cell envelope.
  findings:
  - statement: The E. coli BcsC N-terminal TPR region contacts the terminal BcsB of a periplasmic assembly;
      the detailed interface used a TPR/BcsB fusion.
    supporting_text: To improve the resolution of the BcsB-BcsC complex map, BcsC’s TPR#1–4 were fused
      to the N-terminus of BcsB
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Transfer supports an export-channel model for KT2440, not identical
      copy number, engineered geometry, or pEtN-cellulose product chemistry.
- id: PMID:21507177
  title: Cell-cell and cell-surface interactions mediated by cellulose and a novel exopolysaccharide contribute
    to Pseudomonas putida biofilm formation and fitness under water-limiting conditions.
  full_text_unavailable: true
  findings:
  - statement: The abstract explicitly studies P. putida mt2. It reports a minor bcs contribution to biofilm
      stability and a contribution to rhizosphere colonization; these are operon-level phenotypes, not
      KT2440 target-protein assays.
    supporting_text: The composition of the exopolysaccharide matrix of Pseudomonas putida mt2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only source explicitly identifies strain mt2. Use as contextual operon physiology,
      not direct KT2440 molecular evidence or a basis for adding target-specific biofilm functions.
- id: file:PSEPK/PP_2638/PP_2638-deep-research-openscientist.md
  title: OpenScientist gene research for PP_2638
  findings:
