status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_2638 is the predicted BcsC outer-membrane cellulose export component of Pseudomonas putida
  KT2440. An N-terminal TPR-rich region and a C-terminal BcsC barrel domain support a channel that guides
  nascent cellulose through the periplasm and across the outer membrane. This export role is inferred
  from target architecture and characterized E. coli BcsC; direct transport measurements and synthase-complex
  contacts in KT2440 remain unresolved.
