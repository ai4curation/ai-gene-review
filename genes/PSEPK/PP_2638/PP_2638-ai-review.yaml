- term:
    id: GO:0030244
    label: cellulose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Refine the supported cellulose-producing role to bacterial cellulose biosynthesis.
    action: MODIFY
    reason: 'PP_2638 carries the BcsC C-terminal domain (Pfam PF05420 BCSC_C, residues 806-1152) preceded
      by TPR repeats, the architecture of the BcsC cellulose-export porin. Its role in cellulose production
      is argued from that family membership; the evidence is for characterized BcsC orthologs (E. coli/Enterobacteriaceae),
      where BcsC is essential in vivo for cellulose secretion and forms the outer-membrane channel of
      the Bcs synthase-secretion complex, not a KT2440 assay. BcsC contributes the export step of cellulose
      production rather than glucan polymerization (done by BcsA). The UniProt FUNCTION and PATHWAY lines
      are ARBA predictions and are not cited. GO:0090540 is the supported is_a descendant: its added distinction
      is bacterial context, not a different polymer or a stronger native-output claim. The inferred participation
      is cellulose export through a bacterial BcsC-family channel, not polymerization or a direct KT2440
      secretion assay.'
    supported_by:
    - reference_id: file:PSEPK/PP_2638/PP_2638-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF05420; BCSC_C; 1.
    - reference_id: file:PSEPK/PP_2638/PP_2638-uniprot.txt
      record_section:
      - DR:InterPro
      supporting_text: DR   InterPro; IPR008410; BCSC_C.
    - reference_id: PMID:31604608
      supporting_text: in vivo BcsC is essential for cellulose secretion
    proposed_replacement_terms:
    - id: GO:0090540
      label: bacterial cellulose biosynthetic process
- term:
    id: GO:0015159
    label: polysaccharide transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:31604608
  review:
    summary: BcsC-family architecture supports the missing polysaccharide export activity.
    action: NEW
    reason: The target combines the BcsC-specific C-terminal barrel domain with a TPR-rich periplasmic
      region. E. coli structures and functional work identify BcsC as the cellulose outer-membrane conduit;
      transfer therefore supports polysaccharide transmembrane transporter activity for PP_2638. This
      is a homolog-based assignment, not direct KT2440 transport. GO:0015288 porin activity is unsuitable
      because its current definition restricts transported substances to less than 1000 Da; cellulose
      is a polymer. No ATP-coupled transport mechanism or phosphoethanolamine modification is inferred.
    supported_by: &id001
    - reference_id: file:PSEPK/PP_2638/PP_2638-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF05420; BCSC_C; 1.
    - reference_id: PMID:31604608
      supporting_text: pEtN-cellulose is secreted through the β-barrel porin BcsC
    - reference_id: PMID:39242554
      supporting_text: BcsC interacts with the terminal BcsB subunit of the semicircle to establish an
        envelope-spanning complex.
references:
