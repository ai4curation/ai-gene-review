suggested_questions:
- question: What is the exact molecular role of PP_2638 in KT2440 cellulose export, pore formation, or
    synthase-complex assembly?
- question: How does the TPR-rich region couple cellulose passage to BcsA/BcsB synthesis in KT2440, and
    which contacts are conserved from the engineered E. coli structures?
suggested_experiments:
- description: Compare cellulose production, cell-surface cellulose retention, and extracellular cellulose
    export in wild-type and PP_2638 deletion strains.
  experiment_type: targeted genetics and cellulose localization assay
- description: Determine PP_2638 localization and complex association with BcsA/BcsB using fractionation
    and co-immunoprecipitation or proximity tagging.
  experiment_type: localization and protein-complex assay
