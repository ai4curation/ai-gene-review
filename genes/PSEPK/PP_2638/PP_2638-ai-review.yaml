- term:
    id: GO:0019867
    label: outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Outer membrane is the appropriate location for the BcsC-like PP_2638 cellulose synthase operon
      C protein.
    action: ACCEPT
    reason: The target contains a BcsC C-terminal barrel-domain signature preceded by TPR repeats. The
      E. coli BcsC structure directly places the homologous 16-stranded barrel in the outer membrane.
      Together these support the outer-membrane assignment for KT2440, independently of its submitted
      protein name or the annotation under review.
    supported_by:
