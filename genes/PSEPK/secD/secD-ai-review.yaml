id: Q88PL5
gene_symbol: secD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SecD is the large membrane subunit of the bacterial SecDF accessory complex. Together with
  SecF, it couples proton-motive-force-dependent conformational changes to completion of SecYEG-mediated
  protein translocation after the ATP-driven SecA stage; YajC associates with this accessory assembly.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: secD is a multi-pass subunit of the inner-membrane SecDF complex.
    action: ACCEPT
    reason: The exact family assignment and membrane topology support plasma-membrane localization.
- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: SecD acts after precursors have been targeted, during late translocation.
    action: MARK_AS_OVER_ANNOTATED
    reason: SecD acts with SecF after the precursor has reached SecYEG, assisting late translocation with
      the proton motive force; it is not a targeting factor, so protein targeting over-states its role.
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct but general; the protein acts in transmembrane movement of precursors across the cytoplasmic
      membrane.
    action: MODIFY
    reason: 'Intracellular protein transport is true but general. GO:0065002 intracellular protein transmembrane
      transport is its is_a descendant and describes the SecYEG-mediated step; the Sec-complex process is
      recorded in core_functions. Harmonized across the Sec member reviews: a MODIFY replacement must be an
      is_a/part_of descendant of the annotated term, and GO:0043952 protein transport by the Sec complex is
      not a descendant of GO:0006886.'
    proposed_replacement_terms:
    - id: GO:0065002
      label: intracellular protein transmembrane transport
- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct but general; the specific process is protein transport by the Sec complex.
    action: MODIFY
    reason: Protein transport is a true ancestor of GO:0043952 protein transport by the Sec complex, the specific
      process this protein takes part in, so the row is refined to that descendant.
    proposed_replacement_terms:
    - id: GO:0043952
      label: protein transport by the Sec complex
- term:
    id: GO:0015450
    label: protein-transporting ATPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Not a protein-transporting ATPase; SecD uses the proton motive force, not ATP.
    action: REMOVE
    reason: 'SecD is not an ATPase: ATP hydrolysis in Sec export belongs to SecA, and SecD (with SecF) couples
      the proton motive force to late translocation. Its activity, contributes_to GO:0009977, is not a descendant
      of GO:0015450, so this electronic ATPase row is removed and the activity is proposed as a NEW row.'
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: >-
        we propose that SecDF functions as a membrane-integrated chaperone, powered
        by proton motive force, to achieve ATP-independent protein translocation
    - reference_id: PMID:29718185
      supporting_text: >-
        Once SecDF captures the precursor protein on the periplasmic surface, SecDF
        can complete protein translocation even if SecA function is inactivated by
        ATP depletion, implying that SecDF is a protein-translocation motor that
        works independent of SecA
- term:
    id: GO:0009977
    label: proton motive force dependent protein transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:21562494
  qualifier: contributes_to
  review:
    summary: SecD contributes, with SecF, to the proton-motive-force-coupled translocation activity of
      SecDF.
    action: NEW
    reason: No existing row gives SecD's molecular function correctly once the ATPase row is removed.
      P. putida SecD belongs to the same PTHR30081 subfamily as E. coli SecD, for which mutant and complementation
      work in PMID:21562494 shows that SecD and SecF couple the proton motive force to ATP-independent
      completion of translocation through SecYEG. The qualifier is contributes_to because SecYEG is the
      channel, and ISS because the P. putida protein was not assayed.
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: we have shown that SecDF is a component of the Sec machinery that utilizes the
        PMF to complete protein translocation after the ATP-dependent SecA function
    - reference_id: PMID:29718185
      supporting_text: SecDF is a protein-translocation factor, which is different from the ATP-driven
        SecA motor
