description: PP_3087 is a second UvrA-family ABC ATPase in KT2440, placed in PTHR43152:SF1 rather than the canonical UvrA SF3 subfamily. It is a plausible accessory UvrA2-type damage-response protein, but current annotations do not establish participation in nucleotide-excision repair.
