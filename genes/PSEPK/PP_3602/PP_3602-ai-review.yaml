suggested_questions:
- question: >-
    Is PP_3602 the principal terminal dehydrogenase during growth on glucarate
    or galactarate, and does it prefer NAD+ or NADP+?
suggested_experiments:
- description: >-
    Measure aldarate growth, 2,5-dioxopentanoate accumulation, and purified
    enzyme kinetics with NAD+ and NADP+ in PP_3602, PP_1256, and PP_2585
    single and combined deletion backgrounds.
  experiment_type: paralog-resolved pathway genetics and cofactor-specific enzyme assay
