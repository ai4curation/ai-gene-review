id: Q88GW5
gene_symbol: PP_3602
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3602 is a predicted 2,5-dioxovalerate dehydrogenase that oxidizes
  2,5-dioxopentanoate to 2-oxoglutarate using NAD+ or NADP+. In its local
  aldarate-catabolism locus it consumes the common product of glucarate and
  galactarate breakdown and connects that carbon to central metabolism.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_3602 is an oxidoreductase, but this term does not identify its substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The exact EC-mapped 2,5-dioxovalerate dehydrogenase activity is available
      and is supported by an alpha-ketoglutaric-semialdehyde dehydrogenase
      subfamily assignment.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term is compatible but less specific than GO:0047533.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UniProt predicts both NAD+- and NADP+-coupled reactions, but the exact
      substrate-specific GO term captures the principal EC 1.2.1.26 assignment.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "DE            EC=1.2.1.26"
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: PP_3602 oxidizes 2,5-dioxopentanoate to 2-oxoglutarate.
    action: ACCEPT
    reason: >-
      EC 1.2.1.26, the two explicit Rhea reactions, InterPro IPR044151, and
      PANTHER SF3 support alpha-ketoglutaric-semialdehyde/2,5-dioxovalerate
      dehydrogenase chemistry. The GO term specifies the supported NADP+ form.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
references:
