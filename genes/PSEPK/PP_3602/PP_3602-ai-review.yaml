description: >-
  PP_3602 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme and the locus-linked candidate for oxidation of
  2,5-dioxopentanoate to 2-oxoglutarate after GarD and PP_3599 in aldarate
  catabolism. Its KGSADH-family assignment supports the terminal chemistry,
  while NAD+ versus NADP+ preference remains unresolved.
