id: Q88GW5
gene_symbol: PP_3602
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3602 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme. Its position next to garD and PP_3599 makes it the leading candidate
  for oxidation of 2,5-dioxopentanoate to 2-oxoglutarate in aldarate
  catabolism, but this physiological assignment and its NAD+ versus NADP+
  preference have not been tested directly.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_3602 is an oxidoreductase, but this term does not identify its substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The exact EC-mapped 2,5-dioxovalerate dehydrogenase activity is available
      and is supported by an alpha-ketoglutaric-semialdehyde dehydrogenase
      subfamily assignment.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term captures the supported cofactor range without choosing NAD+ or NADP+.
    action: ACCEPT
    reason: >-
      The KGSADH-family assignment supports aldehyde oxidation with an NAD(P)+
      acceptor, while the two ARBA-derived Rhea reactions predict both
      cofactors. No KT2440 assay establishes a preference.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "CC       Reaction=2,5-dioxopentanoate + NAD(+) + H2O = 2-oxoglutarate + NADH + 2"
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts the NADP+-coupled 2,5-dioxopentanoate oxidation.
    action: UNDECIDED
    reason: >-
      InterPro IPR044151 and the EC/Rhea mappings support KGSADH chemistry, but
      the UniProt entry and both cofactor-specific reactions are computational.
      The NADP+-specific GO term cannot be preferred over the separately
      predicted NAD+-dependent reaction without biochemical evidence.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
  title: UniProtKB entry for PP_3602 (Q88GW5)
  findings:
  - statement: >-
      The record assigns 2,5-dioxovalerate dehydrogenase EC 1.2.1.26 and
      predicts NAD+- and NADP+-coupled oxidation to 2-oxoglutarate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Reaction, EC, and subfamily evidence are concordant, but the target is an
      unreviewed entry without a direct KT2440 assay.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
  findings:
  - statement: >-
      The species-aware synthesis identifies PP_3602 as the locus-linked
      candidate; its stronger claim that this is the uniquely correct paralog
      is not supported by a direct KT2440 experiment.
- id: file:modules/glucarate_galactarate_catabolism.yaml
  title: Glucarate and galactarate catabolism module
  findings:
  - statement: PP_3602 is the synteny-favored terminal-dehydrogenase candidate after convergent aldarate breakdown.
core_functions:
- description: >-
    Probable oxidation of 2,5-dioxopentanoate to 2-oxoglutarate with NAD+ or
    NADP+; genomic context favors a role at the end of aldarate catabolism.
  molecular_function:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
  supported_by:
  - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
    supporting_text: "DE   RecName: Full=2,5-dioxovalerate dehydrogenase"
proposed_new_terms: []
suggested_questions:
- question: >-
    Is PP_3602 the principal terminal dehydrogenase during growth on glucarate
    or galactarate, and does it prefer NAD+ or NADP+?
suggested_experiments:
- description: >-
    Measure aldarate growth, 2,5-dioxopentanoate accumulation, and purified
    enzyme kinetics with NAD+ and NADP+ in PP_3602, PP_1256, and PP_2585
    single and combined deletion backgrounds.
  experiment_type: paralog-resolved pathway genetics and cofactor-specific enzyme assay
