- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts the NADP+-coupled 2,5-dioxopentanoate oxidation; the cofactor is not established for PP_3602.
    action: MODIFY
    reason: >-
      The substrate chemistry is sound: InterPro IPR044151 and the
      characterized ortholog in the same PANTHER subfamily (PTHR43353:SF3), A.
      baylyi ADP1 KGSADH Q6FFQ0, support 2,5-dioxopentanoate oxidation. The
      NADP+ specificity, however, is too specific for PP_3602. Its UniProt
      entry carries ARBA-predicted NAD+ and NADP+ reactions, characterized
      KGSADH isozymes differ in coenzyme specificity, and no KT2440 assay
      exists. GO splits the reaction into NADP+ (this term) and NAD+
      (GO:0044104) children with no substrate-specific neutral parent, so the
      replacement is the proposed cofactor-neutral term below rather than
      either child. It is preferred to GO:0004030, which drops the cofactor
      claim but also the well-supported substrate. This resolves the
      previously undecided row, and matches the paralog PP_1256, which has the
      same evidence and the same proposed term.
    proposed_replacement_terms:
    - id: NTR
      label: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
    - reference_id: PMID:17202142
      supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
