      The record assigns 2,5-dioxovalerate dehydrogenase EC 1.2.1.26 and
      predicts NAD+- and NADP+-coupled oxidation to 2-oxoglutarate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Reaction, EC, and subfamily evidence are concordant, but the target is an
      unreviewed entry without a direct KT2440 assay.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
  findings:
  - statement: >-
      The species-aware synthesis identifies PP_3602 as the locus-linked
      candidate; its stronger claim that this is the uniquely correct paralog
      is not supported by a direct KT2440 experiment.
- id: file:modules/glucarate_galactarate_catabolism.yaml
  title: Glucarate and galactarate catabolism module
  findings:
  - statement: PP_3602 is the synteny-favored terminal-dehydrogenase candidate after convergent aldarate breakdown.
- id: PMID:17202142
  title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic convergent evolution.
  full_text_unavailable: true
  findings:
  - statement: A. brasilense KGSADH isozymes share alphaKGSA specificity but differ in cofactor preference.
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract explicitly identifies A. brasilense; it supports family chemistry and aldarate-route precedent, not PP_3602 directly.
- id: PMID:16835232
  title: 'A novel alpha-ketoglutaric semialdehyde dehydrogenase: evolutionary insight into an alternative pathway of bacterial L-arabinose metabolism.'
  full_text_unavailable: true
  findings:
  - statement: A. brasilense ALDH shows high catalytic efficiency with alphaKGSA.
    supporting_text: "Higher catalytic efficiency of ALDH was found with alphaKGSA and succinic semialdehyde among the tested aldehyde substrates."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Orthologous biochemical evidence supports the substrate class, not PP_3602 pathway membership.
core_functions:
- description: >-
    Probable oxidation of 2,5-dioxopentanoate to 2-oxoglutarate with NAD+ or
    NADP+; genomic context favors a role at the end of aldarate catabolism.
  molecular_function:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  directly_involved_in:
  - id: GO:0042838
    label: D-glucarate catabolic process
  - id: GO:0046392
    label: D-galactarate catabolic process
  supported_by:
