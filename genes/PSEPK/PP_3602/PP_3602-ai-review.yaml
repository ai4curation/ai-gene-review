- id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified species-aware synthesis identifying PP_3602 as the
      synteny-favored terminal enzyme of the aldarate locus. Its assignment is
      stronger than PP_1256 or PP_2585 because only PP_3602 is in the local
      garD/PP_3599 locus, but the source explicitly presents this as
      guilt-by-operon evidence needing target-specific biochemical or
      physiological confirmation.
  findings:
  - statement: >-
      The species-aware synthesis identifies PP_3602 as the locus-linked
      candidate and declares the assignment operon-context-based.
    supporting_text: >-
      Terminal oxidation to 2-oxoglutarate. Assignment rests on
      **guilt-by-operon** (directly downstream of `garD`). TrEMBL.
  - statement: >-
      The report treats PP_3602, PP_1256, and PP_2585 as divergent paralogs
      whose identical KEGG K13877 mapping is expected over-propagation.
    supporting_text: >-
      KGSADH is a **hub aldehyde dehydrogenase** reused by convergent
      α-ketoglutarate-semialdehyde–producing pathways; the KEGG multi-mapping is
      expected over-propagation. The three proteins are **divergent paralogs,
      not recent duplicates** (pairwise amino-acid identity ≈57–69%:
      PP_1256–PP_2585 57%, PP_1256–PP_3602 57%, PP_2585–PP_3602 69%),
      consistent with each being retained for a distinct physiological route —
      so functional identity cannot be assumed uniform and must be assigned by
      genomic context/experiment.
