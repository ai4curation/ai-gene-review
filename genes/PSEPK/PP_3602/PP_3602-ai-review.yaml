id: Q88GW5
gene_symbol: PP_3602
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3602 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme and the locus-linked candidate for oxidation of
  2,5-dioxopentanoate to 2-oxoglutarate after GarD and PP_3599 in aldarate
  catabolism. Its KGSADH-family assignment supports the terminal chemistry,
  while NAD+ versus NADP+ preference remains unresolved.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_3602 is an oxidoreductase, but this term does not identify its substrate.
    action: KEEP_AS_NON_CORE
    reason: >-
      This broad parent is chemically correct but does not capture either
      aldehyde-dehydrogenase chemistry or the KGSADH substrate class.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term captures the supported cofactor range without identifying aldehyde dehydrogenase chemistry.
    action: KEEP_AS_NON_CORE
    reason: >-
      The KGSADH-family assignment supports aldehyde oxidation with an NAD(P)+
      acceptor, while the two ARBA-derived Rhea reactions predict both
      cofactors. No KT2440 assay establishes a preference.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts the NADP+-coupled 2,5-dioxopentanoate oxidation.
    action: UNDECIDED
    reason: >-
      InterPro IPR044151 and the EC/Rhea mappings support KGSADH chemistry, but
      the UniProt entry and both cofactor-specific reactions are computational.
      The NADP+-specific GO term cannot be preferred over the separately
      predicted NAD+-dependent reaction without biochemical evidence.
    supported_by:
    - reference_id: file:PSEPK/PP_3602/PP_3602-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: ISS
  original_reference_id: PMID:17202142
  qualifier: enables
  review:
    summary: PP_3602 has KGSADH-family aldehyde dehydrogenase chemistry with unresolved NAD+ versus NADP+ usage.
    action: NEW
    reason: >-
      GO:0004030 is the most specific current cofactor-neutral MF. IPR044151 and
      characterized KGSADH isozymes support alphaKGSA oxidation, while the
      proposed term below records the missing substrate-specific neutral term.
    supported_by:
    - reference_id: PMID:17202142
      supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
- term:
    id: GO:0042838
    label: D-glucarate catabolic process
  evidence_type: ISS
  original_reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: PP_3602 is the locus-linked candidate for the terminal reaction after D-glucarate entry.
    action: NEW
    reason: >-
      PP_3602 is adjacent to garD and reviewed PP_3599, whose GOA includes
      D-glucarate catabolism. This operon-level inference supports a hedged
      pathway call while comparative genetics is still needed to resolve
      paralog contributions.
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
- term:
    id: GO:0046392
    label: D-galactarate catabolic process
  evidence_type: ISS
  original_reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: PP_3602 is the locus-linked candidate for the terminal reaction after D-galactarate entry.
    action: NEW
    reason: >-
      The local garD-PP_3599-PP_3602 organization places PP_3602 after the
      galactarate-specific entry and shared dehydratase steps, with pathway
      membership supported more strongly than unique paralog assignment.
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
