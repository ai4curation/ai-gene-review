  - id: PMID:21261833
    title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        The full-text KT2440 study supports formaldehyde induction and a
        formaldehyde-tolerance phenotype for PP_1617, but it does not establish
        the exact FrmC reaction.
    findings:
      - statement: >-
          PP_1617 is induced by formaldehyde, and its disruption slows growth
          under formaldehyde stress; this supports physiological relevance but
          does not establish the proposed FrmC reaction.
