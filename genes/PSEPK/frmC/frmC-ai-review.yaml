id: Q88MF4
gene_symbol: frmC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  FrmC is a serine-dependent S-formylglutathione hydrolase that converts
  S-formylglutathione to formate and glutathione. It completes the
  glutathione-dependent formaldehyde detoxification route downstream of FrmA.
existing_annotations:
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: TreeGrafter assigns FrmC to the cytosol by phylogenetic inference.
      action: ACCEPT
      reason: The family-based localization is compatible with its soluble-metabolite hydrolase role; no contradictory localization evidence was found.
  - term:
      id: GO:0018738
      label: S-formylglutathione hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the direct catalytic function of FrmC.
      action: ACCEPT
      reason: >-
        UniProt assigns EC 3.1.2.12, the FrmC-specific TIGR02821 and
        PTHR10061:SF1 families, and an intact Ser150-Asp228-His261 charge-relay
        system. Together these support an active S-formylglutathione hydrolase
        rather than a generic esterase or catalytically inactive family member.
  - term:
      id: GO:0046292
      label: formaldehyde metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Correct but broader than the formaldehyde catabolic process annotation.
      action: KEEP_AS_NON_CORE
      reason: GO:0046292 is a true but redundant parent of the more specific GO:0046294 annotation.
  - term:
      id: GO:0046294
      label: formaldehyde catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: FrmC completes a glutathione-dependent formaldehyde catabolic branch.
      action: ACCEPT
      reason: >-
        Hydrolysis of S-formylglutathione releases formate and regenerates
        glutathione. The KT2440 PP_1617 mutant phenotype independently supports
        a role in formaldehyde tolerance, without proving this exact reaction.
      supported_by:
      - reference_id: PMID:21261833
        supporting_text: The second type consisted of mutants whose growth rates were at least twofold lower than that of the wild type (PP1617
