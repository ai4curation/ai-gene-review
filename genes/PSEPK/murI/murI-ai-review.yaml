id: Q88PW2
gene_symbol: murI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MurI is a glutamate racemase that interconverts L-glutamate and D-glutamate.
  It supplies the D-glutamate incorporated into peptidoglycan stem peptides
  during bacterial cell-wall precursor synthesis.
existing_annotations:
  - term:
      id: GO:0008881
      label: glutamate racemase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the exact catalytic function assigned to MurI.
      action: ACCEPT
      reason: >-
        The reviewed UniProt entry identifies Q88PW2 as glutamate racemase,
        EC 5.1.1.3, and records its D-glutamate-producing reaction.
      supported_by:
        - reference_id: file:PSEPK/murI/murI-uniprot.txt
          supporting_text: "RecName: Full=Glutamate racemase"
  - term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Peptidoglycan biosynthesis is the direct physiological context for MurI.
      action: ACCEPT
      reason: >-
        UniProt states that Q88PW2 supplies D-glutamate for cell-wall
        biosynthesis and assigns it to peptidoglycan biosynthesis.
      supported_by:
        - reference_id: file:PSEPK/murI/murI-uniprot.txt
          supporting_text: "Provides the (R)-glutamate required for cell wall"
        - reference_id: file:PSEPK/murI/murI-uniprot.txt
          supporting_text: "Cell wall biogenesis; peptidoglycan biosynthesis."
  - term:
      id: GO:0016855
      label: racemase and epimerase activity, acting on amino acids and derivatives
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This is a valid but uninformative parent of glutamate racemase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        GO:0008881 captures the substrate-specific activity and should be used
        for the core function.
      supported_by:
        - reference_id: file:PSEPK/murI/murI-uniprot.txt
          supporting_text: "RecName: Full=Glutamate racemase"
  - term:
      id: GO:0047661
      label: amino-acid racemase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This broad racemase term is superseded by the exact glutamate activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Q88PW2 has a specific glutamate-racemase reaction rather than an
        unresolved broad amino-acid substrate range.
      supported_by:
        - reference_id: file:PSEPK/murI/murI-uniprot.txt
          supporting_text: "EC=5.1.1.3"
