id: Q88RK2
gene_symbol: dsbA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Periplasmic thiol-disulfide oxidoreductase DsbA. Oxidized DsbA introduces
  disulfide bonds into newly exported proteins and is subsequently reoxidized
  by the membrane protein DsbB.
existing_annotations:
- term:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Specific core molecular function of the DsbA thioredoxin-family oxidant.
    action: ACCEPT
    reason: >-
      The exact Q88RK2 record identifies a DsbA-family thiol-disulfide
      interchange protein with the canonical active-site disulfide, supporting
      this substrate-level redox function.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but too broad relative to disulfide oxidoreductase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Oxidoreductase activity is a valid parent of the more informative
      disulfide oxidoreductase activity. It is broad rather than erroneous and
      is therefore retained outside the core-function summary.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Correct compartment for the mature Gram-negative DsbA protein and its exported substrates.
    action: ACCEPT
    reason: >-
      Q88RK2 has a cleavable signal peptide and UniProt assigns the mature
      protein to the periplasm.
- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: DsbA contributes to envelope redox homeostasis, but oxidative protein folding is the more direct role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is compatible with a periplasmic thiol-disulfide oxidoreductase,
      but it is broader than DsbA's direct catalytic contribution to exported
      protein folding.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: NAS
  original_reference_id: file:PSEPK/dsbA/dsbA-uniprot.txt
  qualifier: involved_in
  review:
    summary: DsbA directly introduces disulfide bonds during folding of exported proteins.
    action: NEW
    reason: >-
      The DsbA-family assignment, periplasmic localization, and
      disulfide-oxidoreductase activity support oxidative folding as the direct
      biological process, which is absent from the fetched GOA set.
