taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DsbA is a predicted periplasmic thiol-disulfide oxidoreductase of Pseudomonas putida KT2440.
  Its DsbA-family catalytic domain and export signal support introduction of disulfide bonds into exported
  proteins, followed by regeneration by membrane redox partners. Its native substrate set and partner
  preferences remain uncharacterized.
existing_annotations:
- term:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Refine the broad redox function to protein thiol-disulfide exchange.
    action: MODIFY
    reason: The current GO:0015035 definition is a reversible reaction between reduced protein sulfide
      groups and oxidized disulfide bonds. It is an is_a descendant of both GO:0015036 and GO:0016491
      and captures the supported protein-substrate specificity despite the reductase label. This is refinement
      of a correct core activity, not non-core retention. This assignment is inferred for the exact KT2440
      reference protein from its family/domain and catalytic architecture; PMID:24327342 experimentally
      studies P. aeruginosa PA14, not KT2440. No native KT2440 paralog redundancy or quantitative rate
      is asserted.
    proposed_replacement_terms:
    - id: GO:0015035
      label: protein-disulfide reductase activity
