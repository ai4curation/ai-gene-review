- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: DsbA contributes to envelope redox homeostasis, but oxidative protein folding is the more
      direct role.
    action: KEEP_AS_NON_CORE
    reason: Oxidation of exported protein thiols can contribute to periplasmic redox balance, a consequence
      distinct from the direct folding process. Retain the existing homeostasis annotation as a peripheral,
      family-inferred role; it is not used to claim a dedicated redox-sensing mechanism or a measured
      KT2440 homeostatic phenotype.
    supported_by:
    - *id001
    - reference_id: PMID:1429594
      supporting_text: We propose that DsbA, which proved to directly catalyze disulfide bond formation,
        may also have a role in maintaining the bacterial periplasm oxidative.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: ISS
  original_reference_id: file:PSEPK/dsbA/dsbA-uniprot.txt
  qualifier: involved_in
  review:
    summary: DsbA directly introduces disulfide bonds during folding of exported proteins.
    action: NEW
    reason: DsbA performs substrate cysteine oxidation during folding, as directly demonstrated for E.
      coli P0AEG4; the KT2440 Q88RK2 sequence has DsbA-specific CDD/Pfam classification, a signal peptide,
      and a redox-active cysteine pair. This inherited NEW proposal is retained as a functional inference,
      not a target-specific assay.
    supported_by:
    - *id001
    - *id002
