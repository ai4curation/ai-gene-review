id: P0A118
gene_symbol: dnaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DnaG is the bacterial DNA primase. It binds single-stranded DNA at the replication fork and
  uses its DNA-directed RNA polymerase activity to synthesize short RNA primers that provide 3'-hydroxyl
  ends for leading- and lagging-strand DNA synthesis. Its N-terminal zinc-binding domain supports template-sequence
  recognition, while its C-terminal region contacts DnaB helicase.
