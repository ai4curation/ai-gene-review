gene_symbol: kdpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: 'KdpB (PP_4160, kdpFABC operon) is the catalytic P-type ATPase subunit (type IA, EC 7.2.2.6)
  of the KdpFABC high-affinity ATP-driven potassium uptake complex in the inner membrane of Pseudomonas
  putida KT2440. By orthology with the characterised Escherichia coli enzyme, it binds Mg-ATP in its cytoplasmic
  N and P domains, forms an aspartyl-phosphate intermediate on the conserved DKTGT aspartate (Asp311 here),
  and couples ATP hydrolysis to K+ uptake: K+ is selected by the channel-like KdpA subunit, transferred
  through an intramembrane tunnel to sites in the KdpB transmembrane domain, and released by KdpB to the
  cytoplasm.'
