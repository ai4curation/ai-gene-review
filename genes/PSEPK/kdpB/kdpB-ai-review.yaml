- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The term correctly describes the collective KdpFABC pump activity, but
      KdpB supplies ATP-dependent energy coupling while KdpA supplies the
      potassium-selective pathway.
    action: ACCEPT
    reason: >-
      The term is correct in substance. The qualifier should ideally be
      contributes_to rather than enables because KdpB independently supplies
      ATP hydrolysis, while the complete transporter activity belongs to the
      heteromeric pump; core_functions records both relationships.
