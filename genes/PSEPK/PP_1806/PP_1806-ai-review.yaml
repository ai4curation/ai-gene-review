taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_1806 is a second KdsD/KpsF-family arabinose-5-phosphate isomerase candidate.
  It is adjacent to kdsA2 and can plausibly provide D-arabinose-5-phosphate for
  KDO-8-phosphate synthesis, but its contribution relative to the housekeeping
  kdsD copy has not been established experimentally in KT2440.
