- id: PMID:16199563
  title: Identification of GutQ from Escherichia coli as a D-arabinose 5-phosphate isomerase.
  findings:
  - statement: >-
      Escherichia coli GutQ is a biochemically characterized second API that can
      sustain KDO/LPS synthesis when KdsD is absent.
    supporting_text: >-
      Recombinant GutQ was shown to indeed be a second copy of API from the E. coli K-12 genome
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This is a comparative paralog paradigm, not direct evidence that KT2440
      PP_1806 carries KDO-pathway flux.
- id: PMID:16765569
  title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia coli yrbG-yhbG locus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Escherichia coli single-gene results demonstrate genetic redundancy in
      early KDO biosynthetic functions.
    supporting_text: >-
      were shown to be non-essential, indicating genetic redundancy for these two functions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The paper is restricted to E. coli and supports only the comparative
      redundancy model used to frame the KT2440 paralog question.
