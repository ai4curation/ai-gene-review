description: >-
  GcvP1 is one of two KT2440 glycine cleavage P proteins. It is a PLP-dependent
  glycine dehydrogenase that decarboxylates glycine and transfers the remaining
  aminomethyl group to the covalently lipoylated H protein. Together with GcvH1
  and GcvT-I, it forms one of two paralogous P/H/T sets that can implement the
  glycine cleavage cycle with a shared dihydrolipoyl dehydrogenase.
