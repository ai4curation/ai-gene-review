gene_symbol: lpxB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LpxB is lipid-A-disaccharide synthase, a glycosyltransferase that
  condenses lipid X with UDP-2,3-diacylglucosamine to form the lipid A
  disaccharide precursor.
existing_annotations:
- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Phospholipid binding is not supported for LpxB; its substrates are acylated glucosamine phosphates rather than phospholipids.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The annotation is TreeGrafter-only (GO_REF:0000118) with no LpxB-specific evidence,
      and LpxB's substrates -- lipid X (UDP-2,3-diacylglucosamine-derived 2,3-diacylglucosamine
      1-phosphate) and UDP-2,3-diacylglucosamine -- are acylated glucosamine phosphates, not
      the glycerophospholipids GO:0005543 describes. No positive support for a distinct
      phospholipid-binding activity was found, so the term is downgraded rather than kept as
      a non-core function.
- term:
    id: GO:0008915
    label: lipid-A-disaccharide synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term precisely describes condensation of lipid X and UDP-2,3-diacylglucosamine to form lipid A disaccharide.
    action: ACCEPT
    reason: LpxB-specific HAMAP, InterPro, NCBIfam, and PANTHER signatures support the exact catalytic assignment.
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LpxB produces the disaccharide scaffold of lipid A.
    action: ACCEPT
    reason: Lipid A biosynthesis is the conserved pathway role of LpxB.
core_functions:
