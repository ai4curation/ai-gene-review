regulator:
  accession: Q88I42
  locus: PP_3159
  taxon: NCBITaxon:160488
relationships:
- id: PSEPK_BenR_PbenA_activation
  target:
    name: PbenA / promoter upstream of benA
    locus: PP_3161
    type: promoter
  effect: activates
  directness: unresolved
  experimental_strain: KT2440 for promoter-response assays; engineered E. coli sIP16 for the KT2440-derived PP_3159/PP_3161 two-plasmid system; KT2442 derivatives for the Crc-context promoter/transcript assays
  condition: Benzoate exposure; regulator abundance controlled in the heterologous reporter system
  evidence:
  - reference_id: PMID:38113125
    source_url: https://escholarship.org/uc/item/802967bs
    assay: Native-host promoter reporter and heterologous regulator/promoter reconstruction using a 200-bp PP_3161-upstream fragment containing canonical Pb and part of PP_3160 (Table 1 and Fig. 3)
    supporting_text: inducible BenR (PP_3159)
  - reference_id: PMID:18156252
    source_url: https://journals.asm.org/doi/10.1128/jb.01604-07
    assay: KT2442-derived promoter reporters and ben-gene transcript measurements in Crc-proficient/deficient backgrounds
    supporting_text: decreasing BenR levels below those required for the full expression of the benABCD genes.
  interpretation: The promoter system is activated by BenR. The KT2442 evidence adds physiological pathway context; it does not independently isolate direct BenR-DNA binding. One promoter assertion is retained rather than assigning direct contacts to every downstream operon member.
  limitations:
  - Physical binding of purified KT2440 BenR to this promoter was not verified; directness is therefore unresolved under the batch's binding-plus-function criterion.
  - The host strain and engineered regulator expression must be retained; reporter induction is not a ligand-binding measurement.
  - The source locus identifies the downstream gene, not a versioned promoter coordinate interval.
pathway_context:
- name: Regulation of entry into benzoate catabolism
  process:
    id: GO:0043639
    label: benzoate catabolic process
  relationship: regulates
  mechanism: BenR promotes expression of the ben enzymes that convert benzoate to catechol; it does not catalyze those reactions. This is pathway context, not an involved_in GO annotation.
  evidence:
  - reference_id: PMID:18156252
    assay: Pathway-specific expression analysis in KT2442 derivatives
    supporting_text: decreasing BenR levels below those required for the full expression of the benABCD genes.
