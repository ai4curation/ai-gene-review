regulator:
  accession: Q88I42
  locus: PP_3159
  taxon: NCBITaxon:160488
relationships:
- id: PSEPK_BenR_PbenA_activation
  target:
    name: PbenA / promoter upstream of benA
    locus: PP_3161
    type: promoter
  effect: activates
  directness: unresolved
  experimental_strain: KT2442 derivatives (KT2440 lineage) for the Crc-context promoter/transcript assays;
    PRS2000 and heterologous E. coli constructs in the comparative BenR reporter study
  condition: Benzoate-responsive ben-gene expression; Crc-proficient/deficient backgrounds in the KT2442
    study
  evidence:
  - reference_id: PMID:11053377
    supporting_text: benR activated expression of a benA-lacZ reporter fusion in response to benzoate.
    source_url: https://doi.org/10.1128/JB.182.22.6339-6346.2000
    assay: Comparative PRS2000 BenR promoter-reporter study; the strain is not KT2440 and this is not
      a purified-binding assay
  - reference_id: PMID:18156252
    source_url: https://journals.asm.org/doi/10.1128/jb.01604-07
    assay: KT2442-derived promoter reporters and ben-gene transcript measurements in Crc-proficient/deficient
      backgrounds
    supporting_text: The expression of the ben, cat, and pca genes requires the BenR, CatR, and PcaR transcriptional
      activators, respectively.
  interpretation: BenR-dependent ben-gene activation in KT2442 supports the KT2440-lineage regulatory
    role; the PRS2000 benA reporter provides comparative promoter-specific support. These sources do not
    independently establish purified KT2440 BenR-DNA binding. One promoter assertion is retained rather
    than assigning direct contacts to every downstream operon member.
  limitations:
  - Physical binding of purified KT2440 BenR to this promoter was not verified; directness is therefore
    unresolved under the batch's binding-plus-function criterion.
  - The host strain and engineered regulator expression must be retained; reporter induction is not a
    ligand-binding measurement.
  - The source locus identifies the downstream gene, not a versioned promoter coordinate interval.
  - PMID:38113125 was inspected previously through an author manuscript, but its local abstract lacks
    the BenR figure text. The uncheckable figure quotation was removed; the acquisition and construct
    details remain in the gene notes, not as verified quotations here.
pathway_context:
- name: Regulation of entry into benzoate catabolism
  process:
    id: GO:0043639
    label: benzoate catabolic process
  relationship: regulates
  mechanism: BenR promotes expression of the ben enzymes that convert benzoate to catechol; it does not
    catalyze those reactions. This is pathway context, not an involved_in GO annotation.
  evidence:
  - reference_id: PMID:18156252
    assay: Pathway-specific expression analysis in KT2442 derivatives
    supporting_text: The expression of the ben, cat, and pca genes requires the BenR, CatR, and PcaR transcriptional
      activators, respectively.
