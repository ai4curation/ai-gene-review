suggested_questions:
- question: Which KT2440 BenR promoter contacts and binding sites have direct biochemical validation,
    beyond reporter activity and AraC-family inference?
- question: Do the substituted-benzoate responses of engineered E. coli systems occur at physiological
    BenR expression in KT2440?
- question: Does purified KT2440 BenR bind benzoate directly, and which residues are experimentally demonstrated
    ligand contacts?
suggested_experiments:
- description: Combine purified KT2440 BenR DNA-binding assays with promoter-site mutagenesis and matched
    transcriptional reporters.
  experiment_type: EMSA or footprinting plus promoter reporter
  hypothesis: BenR recognizes a specific cis-regulatory site required for benA promoter activation.
- description: Measure binding of benzoate and substituted benzoates to purified BenR, checking folding
    and activity of candidate-site mutants.
  experiment_type: ITC or another orthogonal ligand-binding assay
  hypothesis: The reporter response involves direct effector binding rather than an exclusively indirect
    cellular response.
