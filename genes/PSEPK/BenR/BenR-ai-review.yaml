- id: file:PSEPK/BenR/BenR-uniprot.txt
  title: UniProt entry Q88I42
  findings:
  - statement: The accession maps to benR/PP_3159 and contains the AraC-family HTH domain; the FUNCTION
      comment incorrectly describes the TOL-plasmid XylS regulator.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Identity/domain fields support BenR. The ARBA-derived FUNCTION comment identifies XylS
      and TOL-plasmid xyl operons, conflicting with the chromosomal PP_3159 identity and BenR promoter
      studies.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q88I42
      slot: CC:FUNCTION
      asserted_value: Regulatory protein of the TOL plasmid xyl operons.
      requested_change: CHECK
      confidence: CONFIRMED
      cause: OTHER
      explanation: The same record names benR/PP_3159 on the KT2440 chromosome, while its ARBA00037345
        FUNCTION text describes XylS and the TOL plasmid. Replace with the supported BenR role in transcriptional
        activation of benzoate-degradation genes; heterologous cross-activation of Pm does not make this
        protein plasmid-encoded XylS. See PMID:38113125, PMID:18156252 and the accession-specific notes.
- id: PMID:18156252
  title: The target for the Pseudomonas putida Crc global regulator in the benzoate degradation pathway
    is the BenR transcriptional regulator.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and primary full-text methods/results inspected online. Experiments
      use KT2442, a rifampin-resistant KT2440 derivative, and its reporter/crc derivatives. Supports ben-gene
      activation context; its Crc RNA-binding model is not re-curated here.
  findings: []
- id: PMID:38113125
  title: Characterization and Diversification of AraC/XylS Family Regulators Guided by Transposon Sequencing.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus indexed author-manuscript results, Table 1 and Fig. 3 inspected.
      KT2440 promoter response and KT2440-derived PP_3159/PP_3161 heterologous constructs support activation;
      docking and mutant response loss do not establish biochemical ligand binding. The local cache is
      abstract-only and does not contain the previously inspected Fig. 3 phrase. No target-specific quotation
      from this article is used in the machine-validated evidence; the author-manuscript access record
      remains in notes.
  findings: []
- id: PMID:11053377
  title: BenR, a XylS homologue, regulates three different pathways of aromatic acid degradation in Pseudomonas
    putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary reporter and promoter-repeat evidence for BenR activation. The principal native
      strain is PRS2000, not KT2440; therefore this is explicitly comparative support for the conserved
      regulatory mechanism. Combined with KT2442 BenR-dependent ben expression and the KT2440 AraC domain,
      it supports an inferred promoter-recognition activity. It does not establish KT2440 pcaK or TOL-plasmid
      targets, and its abstract describes binding as likely, not a purified-protein demonstration.
  findings: []
