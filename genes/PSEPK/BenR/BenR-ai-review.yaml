core_functions:
- description: Activates the benA/PP_3161 promoter system in response to benzoate, controlling expression
    of enzymes for entry into benzoate catabolism. The demonstrated activity is transcriptional regulation;
    BenR does not catalyze the catabolic reactions. Promoter recognition is supported by AraC-family architecture
    and reporter-function evidence, while physical binding and direct ligand-binding details were not
    verified.
  molecular_function:
