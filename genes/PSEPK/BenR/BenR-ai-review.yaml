gene_symbol: BenR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: BenR (PP_3159) is an AraC/XylS-family DNA-binding transcriptional activator that promotes
  expression of the benzoate-degradation genes in Pseudomonas putida KT2440. Its benA promoter system
  responds to benzoate, regulating the entry of benzoate into the catechol and beta-ketoadipate pathways.
  BenR has a C-terminal helix-turn-helix region and is inferred to act intracellularly at promoter DNA.
  Engineered systems carrying the KT2440 protein also respond to substituted benzoates; direct ligand
  binding and the physiological breadth of these responses remain unresolved.
