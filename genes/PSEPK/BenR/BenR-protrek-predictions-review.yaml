    summary: >-
      Rank 2 (score 16.60), with toluene metabolic process behind it at rank 3. Toluene degradation
      is regulated by XylS and XylR on the TOL plasmid - which is exactly what ProTrek's free-text
      channel returns for this query at scores above 20. BenR is chromosomally encoded and controls
      the benzoate branch; it is a XylS homolog but not a XylS ortholog, and the two regulate different
      operons.
