id: Q88I42
gene_symbol: BenR
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for BenR, the AraC/XylS-family benzoate-responsive activator
  of the benABCD operon. All five calls are aromatic-catabolism processes, so the metabolic neighbourhood
  is right, but the model works through phthalate, toluene and carbazole before reaching benzoate
  at rank 5 - and it returns catabolic processes rather than the transcriptional-activator activity
  that is what BenR actually does. The free-text channel makes the same substitution, returning XylS
  and XylR, the TOL-plasmid regulators of toluene and xylene degradation. This is a TrEMBL entry with
  no GOA process annotations, so the calls are all novel by construction. Assessment: 1 uncertain
  (UNC), 2 nonparalog incorrect (NPI).
