    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 17.01). Phthalate catabolism is a distinct aromatic degradation route
      with its own regulators (PhtR, PhdR) and is not among the pathways BenR controls. The AraC/XylS
      family is large and its members are defined by which effector they sense; BenR senses benzoate.
      Naming the wrong aromatic is the family-level substitution seen throughout this evaluation,
      here compounded by returning a metabolic process for a regulator.
