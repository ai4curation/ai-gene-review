taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  AstD (PP_4478) is an NAD-dependent N-succinylglutamate 5-semialdehyde dehydrogenase in the bacterial
  arginine succinyltransferase pathway. It oxidizes N-succinyl-L-glutamate 5-semialdehyde to N-succinyl-L-glutamate
  while reducing NAD+ to NADH, linking the AstC transamination step to terminal desuccinylation by AstE.
