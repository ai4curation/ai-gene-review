- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: AceK regulates entry of isocitrate into the TCA cycle by controlling IDH
      activity; it does not itself catalyze a TCA-cycle reaction but governs flux through
      this pathway, so it is appropriately associated with the TCA cycle as a regulator.
    action: ACCEPT
    reason: By reactivating IDH (dephosphorylation), AceK restores TCA-cycle flux; by
      inactivating IDH (phosphorylation) it diverts flux to the glyoxylate bypass. This
      regulatory role makes the TCA cycle association appropriate.
    supported_by:
