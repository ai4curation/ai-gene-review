  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: AceK is the regulatory switch that diverts isocitrate into the glyoxylate
      bypass by phosphorylating and inactivating IDH during growth on acetate/fatty acids;
      this is a core biological process for the enzyme.
    action: ACCEPT
    reason: AceK enables flux through the glyoxylate shunt by inactivating IDH, partitioning
      isocitrate toward isocitrate lyase and malate synthase. This is a defining biological
