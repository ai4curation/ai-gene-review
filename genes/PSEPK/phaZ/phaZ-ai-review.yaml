proposed_new_terms:
- proposed_name: medium-chain-length poly(3-hydroxyalkanoate) depolymerase activity
  proposed_definition: Catalysis of the hydrolysis of ester bonds in medium-chain-length poly(3-hydroxyalkanoate),
    yielding 3-hydroxyalkanoate monomers and oligomers.
  justification: GO:0050527 names poly(3-hydroxyoctanoate), whereas PhaZ hydrolyzes mcl-PHAs containing
    multiple aliphatic and aromatic monomers. A chemistry-appropriate broader mcl-PHA depolymerase term
    is needed to represent this substrate scope.
  proposed_parent:
    id: GO:0016787
    label: hydrolase activity
  supported_by:
  - reference_id: PMID:17170116
    supporting_text: We have demonstrated that PhaZ is an intracellular depolymerase that is located in
      PHA granules and that hydrolyzes specifically mcl-PHAs containing aliphatic and aromatic monomers.
- proposed_name: poly(3-hydroxyalkanoate) catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of poly(3-hydroxyalkanoate),
    an intracellular carbon- and energy-storage polyester.
  justification: GO has the specific molecular-function term GO:0050527 and the broader process term GO:0042620,
    but it lacks a direct catabolic-process term for intracellular PHA mobilization by depolymerases such
    as PhaZ.
  proposed_parent:
    id: GO:0042620
    label: poly(3-hydroxyalkanoate) metabolic process
  supported_by:
  - reference_id: PMID:17170116
    supporting_text: We have demonstrated that PhaZ is an intracellular depolymerase that is located in
      PHA granules and that hydrolyzes specifically mcl-PHAs containing aliphatic and aromatic monomers.
suggested_questions:
- question: Which of the additional putative PhaZ paralogs in the KT2440 genome are active depolymerases,
    and do they target distinct PHA chemistries or growth states?
- question: What nutritional or regulatory signals control phaZ expression and granule recruitment during
    transitions from PHA accumulation to mobilization?
suggested_experiments:
- description: Measure PHA amount and monomer composition over time in wild type, clean Delta phaZ, and
    complemented PP_5004 strains during nitrogen starvation and refeeding on octanoate or lignin-derived
    substrates.
  experiment_type: genetic perturbation plus polymer quantification
  hypothesis: Loss of phaZ blocks intracellular PHA mobilization and prolongs high polymer loads after
    accumulation.
- description: Localize epitope-tagged or antibody-detected PhaZ across growth phases by fluorescence
    microscopy or immunogold electron microscopy and correlate localization with granule morphology and
    turnover.
  experiment_type: localization assay
  hypothesis: PhaZ is recruited to PHA granules specifically during mobilization phases.
- description: Test purified PP_5004 against mcl-PHA latex, defined hydroxyalkanoate oligomers, triacylglycerols,
    and p-nitrophenyl esters to refine substrate specificity for GO curation.
  experiment_type: biochemical enzyme assay
  hypothesis: PP_5004 prefers intracellular mcl-PHA substrates and does not behave as a generic triacylglycerol
    lipase.
