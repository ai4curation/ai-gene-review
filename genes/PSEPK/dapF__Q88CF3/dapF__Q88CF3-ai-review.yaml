taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DapF Q88CF3 (PP_5228) is a diaminopimelate epimerase (EC 5.1.1.7) that interconverts LL-2,6-diaminopimelate
  and meso-2,6-diaminopimelate in the diaminopimelate route to L-lysine. It retains the canonical DapF
  catalytic cysteine pair at Cys75 and Cys219. KT2440 also encodes the putative paired-serine DapF-SS
  paralog Q88GD4; their relative physiological contributions are unresolved.
