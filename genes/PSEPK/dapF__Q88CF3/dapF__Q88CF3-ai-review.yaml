  findings:
  - statement: Corroborates Q88CF3/PP_5228 as an EC 5.1.1.7 DapF candidate.
    supporting_text: The gene **dapF** (ordered locus name **PP_5228**; UniProt **Q88CF3**; protein DAPF_PSEPK,
      276 aa) of *Pseudomonas putida* KT2440 encodes **diaminopimelate epimerase**
  - statement: Confirms that the exact Q88CF3 sequence has the canonical DapF-CC catalytic cysteine pair.
    supporting_text: In Q88CF3 these are **Cys75 (proton donor active site) and Cys219 (proton acceptor
      active site)**
  - statement: No direct Q88CF3 characterization was found. Gene-specific essentiality, RppH moonlighting,
      redox regulation, and dominance over Q88GD4 are not adopted from ortholog evidence.
    supporting_text: No direct experimental characterization of the *P. putida* KT2440 orthologue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: OpenScientist sidecar supports DapF/Q88CF3 as a canonical cysteine-pair diaminopimelate
      epimerase and maps Cys75/Cys219 onto the catalytic positions, while preserving that Q88CF3 direct
