- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_0544 is a 12-TM APC-superfamily transporter; its specific family model (NCBIfam TIGR00908
      / InterPro IPR004757, ethanolamine permease) and conserved eat-eutBC locus predict ethanolamine
      as the substrate.
    action: MODIFY
    reason: 'The multipass APC-family protein has the specific IPR004757/TIGR00908 ethanolamine-permease
      classification and lies beside eutBC in KT2440. These are coherent family/locus clues, but not independent
      transport experiments: the model itself was defined using related gene neighborhoods. Refine the
      generic MF to predicted ethanolamine transmembrane transport. The reviewed sources do not directly
      measure PP_0544 transport. In PAO1, the separate Eat/PA4023 deletion retained growth at pH 7.0 and
      20 mM ethanolamine, whereas deletion of the transcriptional regulator EatR/PA4021 abolished growth.
      Regulatory essentiality does not demonstrate transporter specificity, and the Eat result does not
      exclude transport at limiting substrate or another pH. No substrate charge, coupling ion, rate or
      universal requirement is inferred.'
    proposed_replacement_terms:
    - id: GO:0034228
      label: ethanolamine transmembrane transporter activity
    additional_reference_ids:
