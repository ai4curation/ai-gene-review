taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0544 is a 12-pass plasma-membrane APC-superfamily permease encoded beside
  eutBC and aldB-I. Its ethanolamine-permease InterPro/NCBIfam assignments and
  locus context support uptake of ethanolamine for catabolism, although it is
  not a member of the classical enterobacterial EutH family and has not been
  directly assayed in KT2440.
