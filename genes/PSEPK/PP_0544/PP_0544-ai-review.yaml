- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_0544 is a 12-TM APC-superfamily transporter; its specific family model (NCBIfam TIGR00908
      / InterPro IPR004757, ethanolamine permease) and conserved eat-eutBC locus predict ethanolamine
      as the substrate.
    action: MODIFY
    reason: 'Replace generic transporter activity with GO:0034228 ethanolamine transmembrane transporter
      activity, as a prediction resting on two independent lines: (1) the NCBIfam family model
      TIGR00908 (InterPro IPR004757), whose seeds and hits are all encoded next to ethanolamine-catabolism
      genes; (2) the KT2440 locus itself, where PP_0544 lies between eutB/eutC (PP_0543/PP_0542) and an
      aldehyde dehydrogenase (PP_0545) and a sigma-54 regulator (PP_0546), the same arrangement as the
      P. aeruginosa eatR-PA4022-eat-eutBC cluster whose eat product is described as the pathway transport
      protein. The assignment does not rest on PTHR42770 or SF7, which are functionally heterogeneous,
      nor on similarity to classical EutH (a different family). No direct transport assay of PP_0544 or
      of any IPR004757 member was found (searches of PubMed for PP_0544, ethanolamine transport in P.
      putida, and APC ethanolamine permeases; see notes). In P. aeruginosa PAO1 a deletion of the orthologous
      eat gene (PA4023) did not impair growth on ethanolamine (Lundgren et al. 2016, full text), so the
      substrate assignment is a family- and locus-based prediction, not a demonstrated function.'
    proposed_replacement_terms:
    - id: GO:0034228
      label: ethanolamine transmembrane transporter activity
