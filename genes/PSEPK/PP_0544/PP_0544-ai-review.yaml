taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_0544 is a 12-transmembrane-helix cytoplasmic-membrane permease of the APC (amino acid-polyamine-organocation)
  superfamily, encoded in Pseudomonas putida KT2440 between the ethanolamine ammonia-lyase genes eutB/eutC
  and an aldehyde dehydrogenase, next to a sigma-54-dependent regulator. It belongs to the ethanolamine
  permease family (NCBIfam TIGR00908, InterPro IPR004757; Eat), whose members are encoded beside ethanolamine-catabolism
  genes, and it is therefore predicted to take up ethanolamine for catabolism to acetaldehyde and ammonia.
  It is unrelated to the enterobacterial EutH ethanolamine channel, and its transport activity, substrate
  range and coupling ion have not been measured directly.
