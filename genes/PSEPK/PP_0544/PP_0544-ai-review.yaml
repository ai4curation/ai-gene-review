  knowledge_gaps:
  - gap_statement: >-
      The ethanolamine permease function of PP_0544 is predicted from its
      IPR004757/TIGR00908 family and its eutBC locus, not measured: no IPR004757 member
      has been assayed for transport. Whether the permease is needed at all is also
      open, since the full text of PMID:27325678 (PMC4984546, not in the local cache
      and not re-verified here) reportedly found that a P. aeruginosa eat deletion
      mutant grew normally on ethanolamine, which would imply redundant uptake or
      diffusion of the uncharged amine.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
