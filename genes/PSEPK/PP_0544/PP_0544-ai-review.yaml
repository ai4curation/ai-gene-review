suggested_questions:
- question: Does PP_0544 transport protonated ethanolamine, and what coupling ion and substrate range
    does it use?
- question: Is PP_0544 needed for growth on low ethanolamine concentrations, given that the P. aeruginosa
    eat deletion grows normally on ethanolamine at the concentrations tested?
suggested_experiments:
- description: Measure radiolabeled ethanolamine uptake in wild type, PP_0544 deletion, and complemented
    strains across pH and ion gradients.
  experiment_type: membrane transport assay
