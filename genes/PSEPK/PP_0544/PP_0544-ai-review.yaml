  review:
    summary: PP_0544 is the strongest KT2440 ethanolamine-uptake candidate.
    action: NEW
    reason: >-
      The exact locus, 12-pass topology, IPR004757 ethanolamine-permease match,
      and TIGR00908 assignment support an ethanolamine-specific proposal. The
      sequence belongs to an APC-family implementation distinct from classical
      EutH, so this remains an orthology/family inference rather than a direct assay.
