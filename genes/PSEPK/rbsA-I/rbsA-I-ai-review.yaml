id: Q88K37
gene_symbol: rbsA-I
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  RbsA-I is the peripheral membrane ATP-binding component of the
  PP_2454-PP_2459 carbohydrate ABC importer. It hydrolyzes ATP to energize the
  neighboring RbsC permease and is inferred from locus context to support
  D-ribose uptake; its allose-related PANTHER subfamily label is not treated as
  substrate-specific evidence.
existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: True but less informative than the ATP-binding and ATP-hydrolysis annotations.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Correct substrate binding for an ABC energy-coupling ATPase.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: >-
        Correct membrane association through the transporter, although RbsA-I
        is a peripheral ATPase rather than an integral membrane subunit.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Direct catalytic activity that supplies energy to the ABC importer.
      action: ACCEPT
  - term:
      id: GO:0015749
      label: monosaccharide transmembrane transport
    evidence_type: ISS
    original_reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation for the ATPase subunit of the contiguous
        RbsABC locus, stated at the monosaccharide level that the family
        classification supports; D-ribose specificity remains a locus-context
        inference without independent support for this protein.
      action: NEW
      reason: >-
        Q88K37 is classified in the InterPro ABC carbohydrate-import ATPase
        family (IPR050107) and carries both CDD carbohydrate/monosaccharide
        uptake ABC-ATPase domains (cd03216, cd03215), which places it in the
        energizing subunits of monosaccharide ABC importers. This proposal was
        previously D-ribose transmembrane transport (GO:0015752), supported only
        by the submitter-supplied name (ECO:0000313); D-ribose specificity rests
        on the neighbouring rbsB/rbsC/rbsK/rbsD genes and on E. coli RbsA
        orthology, and substrate specificity resides in the binding protein, not
        the ATPase. The PANTHER subfamily (D-allose import ATPase-related) does not
        resolve ribose versus allose, so the term is stated at the monosaccharide
        level. Family-level evidence only; no assay of the KT2440 protein exists.
      supported_by:
        - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR050107; ABC_carbohydrate_import_ATPase."
        - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
          record_section: ["DR:CDD"]
          supporting_text: "DR   CDD; cd03216; ABC_Carb_Monos_I; 1."
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: ISS
    original_reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
    qualifier: part_of
    review:
      summary: Proposed complex membership for the energy-coupling subunit.
      action: NEW
      reason: >-
        Q88K37 has two PROSITE ABC transporter domains (residues 11-252 and
        254-508) and is classified in the InterPro ABC carbohydrate-import ATPase
        family (IPR050107). Members of this family are the cytoplasmic
        nucleotide-binding subunits that assemble with a permease and a
        periplasmic binding protein into an ABC importer, so membership in an ABC
        transporter complex is inferred from family classification; the complex
        has not been isolated in KT2440.
      supported_by:
        - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR050107; ABC_carbohydrate_import_ATPase."
        - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
          record_section: ["DR:PROSITE"]
          supporting_text: "DR   PROSITE; PS50893; ABC_TRANSPORTER_2; 2."
references:
  - id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida KT2440 rbsA-I
    findings:
      - statement: The record identifies Q88K37 as the ATP-binding subunit of a ribose ABC transporter.
        record_section: [DE]
        supporting_text: "DE   SubName: Full=Ribose ABC transporter-ATP-binding subunit {ECO:0000313|EMBL:AAN68067.1};"
      - statement: The PANTHER subfamily label does not distinguish ribose from allose import ATPases.
        record_section: ["DR:PANTHER"]
        supporting_text: "DR   PANTHER; PTHR43790:SF3; D-ALLOSE IMPORT ATP-BINDING PROTEIN ALSA-RELATED; 1."
  - id: file:PSEPK/rbsA-I/rbsA-I-deep-research-openscientist.md
    title: OpenScientist deep research report for rbsA-I in Pseudomonas putida KT2440
    findings:
      - statement: The report confirmed the dual-NBD architecture expected of RbsA.
        supporting_text: exactly the architecture of the experimentally defined *E. coli* RbsA
      - statement: The report aligned Q88K37 to E. coli RbsA across nearly the full protein.
        supporting_text: yields 41.2% identity over 498 aligned columns
      - statement: The report found no direct experimental study of Q88K37.
        supporting_text: "No direct experimental data on PP_2455 itself."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Directly supports treating Q88K37 as the RbsABC ATPase from dual-NBD architecture and locus context while preserving the no-direct-assay caveat.
