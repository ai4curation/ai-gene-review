core_functions:
  - description: >-
      Hydrolyzes ATP to energize the RbsABC carbohydrate importer and thereby
      contributes to monosaccharide uptake through the neighboring RbsC
      permease; by locus context the substrate is probably D-ribose, which the
      family classification alone does not resolve.
    molecular_function:
      id: GO:0016887
      label: ATP hydrolysis activity
    contributes_to_molecular_function:
      id: GO:0015407
      label: ABC-type monosaccharide transporter activity
    directly_involved_in:
      - id: GO:0015749
        label: monosaccharide transmembrane transport
    in_complex:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    supported_by:
      - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
        record_section: ["DR:InterPro"]
        supporting_text: "DR   InterPro; IPR050107; ABC_carbohydrate_import_ATPase."
      - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
        record_section: ["DR:CDD"]
        supporting_text: "DR   CDD; cd03216; ABC_Carb_Monos_I; 1."
      - reference_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
        record_section: ["DR:Pfam"]
        supporting_text: "DR   Pfam; PF00005; ABC_tran; 2."
suggested_questions:
  - question: Does RbsA-I couple specifically to RbsC and Q88K38-bound D-ribose in KT2440?
  - question: >-
      Is the PP_2454-PP_2459 importer specific for D-ribose (as locus context and
      E. coli RbsA orthology suggest) rather than D-allose (as the PANTHER
      subfamily label suggests)? A D-ribose transmembrane transport (GO:0015752)
      annotation was withdrawn to the monosaccharide level pending direct
      evidence, such as growth or uptake assays of a PP_2455 deletion on D-ribose.
suggested_experiments:
  - description: Reconstitute RbsA-I with RbsC and RbsB and measure substrate-dependent ATPase and transport activity.
    experiment_type: transporter reconstitution
