id: Q88HU8
gene_symbol: ku
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  ku (PP_3255) encodes the predicted prokaryotic Ku DNA-end binding factor in
  the Pseudomonas putida KT2440 non-homologous end joining system. Ku forms a
  homodimer, binds linear double-stranded DNA ends with 5-prime or 3-prime
  overhangs, and interacts with LigD to recruit and stimulate the LigD repair
  enzyme at double-strand breaks. It is therefore best treated as a DNA-end
  recognition and recruitment factor for bacterial NHEJ rather than as a
  standalone DNA-repair catalyst. Loss of Ku alters stationary-phase mutation
  spectra in carbon-starved P. putida.
