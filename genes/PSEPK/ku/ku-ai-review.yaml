- id: file:analysis/module_audits/bacterial_nonhomologous_end_joining/literature-acquisition-20261107/Sharaev2022-English.txt
  title: 'Sharaev et al. 2022 English full text: Repair of Double-Stranded DNA Breaks Generated by CRISPR–Cas9
    in Pseudomonas putida KT2440'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full English publisher article, DOI 10.1134/S0026893322060152; counterpart of Russian-edition
      PMID:36475478. Native KT2440 gene disruption and overexpression show locus-dependent effects and
      LigD-independent repair. Deletion spectra are repair outcomes, not purified-enzyme kinetics; source
      bytes and retrieval receipt are preserved.
  findings:
  - statement: Native KT2440 Cas9 repair can occur without LigD, and Ku dependence differs among target
      loci.
    supporting_text: LigD is dispensable for NHEJ for repair of DSBs generated by Cas9 in KT2440, while
      the presence of Ku is required at some sites.
  - statement: Target sequence and context affect repair outcomes.
    supporting_text: The repair events we observe appear to be highly context-dependent.
