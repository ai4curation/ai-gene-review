taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Ku (PP_3255) is the prokaryotic DNA-end binding factor of Pseudomonas putida KT2440. Its
  conserved Ku architecture and curated HAMAP classification support a homodimer that recognizes exposed
  double-stranded DNA ends and recruits and stimulates the LigD repair enzyme. These molecular properties
  are inferred from family conservation and characterized bacterial Ku proteins. Native KT2440 genetics
  shows a locus-dependent contribution to mutagenic repair of Cas9-induced breaks; some end-joining events
  persist without Ku or LigD. Ku also influences mutation spectra during carbon starvation in P. putida.
