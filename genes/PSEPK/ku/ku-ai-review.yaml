- id: PMID:20018881
  title: Gap filling activities of Pseudomonas DNA ligase D (LigD) polymerase and functional interactions
    of LigD with the DNA end-binding Ku protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text concerns recombinant Pseudomonas aeruginosa proteins. Ku-(1–253) was
      used in the end-protection assay; POL dNTP-dependent extension/gap filling and full-length Ku stimulation
      of LigD provide comparative mechanism, not KT2440 measurements. Ribonucleotide extension is distinguished
      from DNA polymerization.
  findings:
  - statement: P. aeruginosa Ku stimulates LigD repair activities in reconstitution.
    supporting_text: PaeKu stimulated ribonucleotide addition to DSB ends by PaePOL and DSB end sealing
      by LigD.
  - statement: P. aeruginosa POL was tested on DNA primer/gap substrates with dNTPs.
    supporting_text: The primer extension and gap filling reactions were performed in the presence of
      100 μ m dNTPs
  - statement: The P. aeruginosa Ku-(1–253) construct protected DNA ends in the specified assay.
    supporting_text: Ku afforded virtually complete protection from both exonucleases
- id: PMID:25942369
  title: NHEJ enzymes LigD and Ku participate in stationary-phase mutagenesis in Pseudomonas putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports P. putida carbon-starvation genetics and distinct Ku/LigD mutational
      effects, not purified catalysis. The available canonical abstract does not specify the experimental
      strain. An uncached publisher search snippet cannot establish a reproducible PaW85-to-KT2440 strain
      bridge here; exact strain scope remains unresolved. The paper explicitly allows independent mutagenic
      pathways.
  findings:
  - statement: Ku and LigD affect stationary-phase mutation spectra and need not act exclusively together.
    supporting_text: This indicates that LigD and Ku may participate also in mutagenic pathways that are
      independent from each other.
