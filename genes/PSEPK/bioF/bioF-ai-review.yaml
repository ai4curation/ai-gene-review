id: Q88QX1
gene_symbol: bioF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  BioF is a pyridoxal 5'-phosphate-dependent 8-amino-7-oxononanoate synthase.
  It condenses pimeloyl-ACP with L-alanine, releasing ACP and carbon dioxide,
  to begin assembly of the biotin heterocycle.
existing_annotations:
- term:
    id: GO:0008710
    label: 8-amino-7-oxononanoate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the specific BioF catalytic activity.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record, EC 2.3.1.47, HAMAP rule, and
      proteobacterial BioF family assignments agree on this reaction. The
      support is HAMAP rule MF_01693 (curated function and BioF subfamily
      membership) and the NCBIfam bioF model; it is family-level, with no
      Q88QX1-specific assay cached.
    supported_by:
    - reference_id: file:PSEPK/bioF/bioF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the decarboxylative condensation of pimeloyl-[acyl-carrier protein] and L-alanine to produce 8-amino-7-oxononanoate (AON)
    - reference_id: file:PSEPK/bioF/bioF-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: aminotransferase family. BioF subfamily.
    - reference_id: file:PSEPK/bioF/bioF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR00858; bioF; 1.'
- term:
    id: GO:0009102
    label: biotin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: BioF catalyzes the first ring-assembly reaction of biotin synthesis.
    action: ACCEPT
    reason: >-
      Its pimeloyl-ACP/L-alanine condensation product is the precursor used by
      BioA, BioD, and BioB.
- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PLP binding is a valid mechanistic property but is not the core reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      The UniProt cofactor record and class-II PLP-dependent transferase family
      support PLP use; GO:0008710 remains the informative core function.
