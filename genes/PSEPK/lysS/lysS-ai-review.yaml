taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: LysS is the cytoplasmic homodimeric lysyl-tRNA synthetase of Pseudomonas putida KT2440. Each subunit contributes the ATP-dependent activity that attaches L-lysine to tRNA(Lys), producing Lys-tRNA(Lys) for translation; magnesium binding, dimerization, localization, and catalysis are assigned by automated family rules rather than direct KT2440 experiments.
