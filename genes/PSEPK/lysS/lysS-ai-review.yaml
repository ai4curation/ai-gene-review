id: Q88MS3
gene_symbol: lysS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LysS is the class II lysyl-tRNA synthetase, predicted to form a homodimer and use magnesium-associated
  ATP chemistry to charge tRNA(Lys). It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP
  to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: lysS must recognize and bind tRNA(Lys) to transfer its activated amino acid.
    action: ACCEPT
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      Substrate-tRNA binding is integral to this reaction and is not rendered uninformative merely because
      the catalytic MF is also annotated.
    supported_by: &id001
    - reference_id: file:PSEPK/lysS/lysS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Lys) + L-lysine + ATP = L-lysyl-tRNA(Lys) + AMP +
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate lysine by lysS.
    action: MODIFY
    reason: The MF_00252 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: LysS has a conserved magnesium-binding assignment associated with its catalytic architecture.
    action: ACCEPT
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      Retain magnesium binding as a core cofactor property; the predicted three-ion stoichiometry is not
      an independently measured solution stoichiometry.
    supported_by:
    - reference_id: file:PSEPK/lysS/lysS-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 3 Mg(2+) ions per subunit.
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The supported nucleic-acid partner of lysS is tRNA(Lys).
    action: MODIFY
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      The charged tRNA is an actual enzyme substrate, so tRNA binding is a supported refinement of the
      broader binding term rather than an unrelated ancillary effect.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0000049
      label: tRNA binding
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify lysine and tRNA(Lys).
    action: MODIFY
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      GO:0004824 is the supported amino-acid-specific descendant of GO:0004812; the parent is biologically
      correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0004824
      label: lysine-tRNA ligase activity
- term:
    id: GO:0004824
    label: lysine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: lysS supplies lysine-charged tRNA(Lys) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      The independently curated MF_00252 reaction supports this specific MF; electronic provenance does
      not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to lysS-catalysed lysine activation.
    action: ACCEPT
    reason: The curated MF_00252 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: lysS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_00252 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/lysS/lysS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
    - &id005
      id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for lysS.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_00252 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: lysS catalyses the charging step that supplies lysine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00252 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006430
    label: lysyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The lysine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006430 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain lysine specificity
      in GO:0004824. This is ontology maintenance, not a rejection of the MF_00252 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id004
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The class II LysS protein is predicted to assemble as a homodimer.
    action: ACCEPT
    reason: HAMAP MF_00252 identifies the class II lysine-specific enzyme, a homodimer and three Mg(2+)
      ions per subunit; these are conserved biochemical assignments rather than measured KT2440 stoichiometry.
      Homodimerization is an informative self-association property of the functional enzyme and is distinct
      from uninformative heterotypic protein binding.
    supported_by:
    - reference_id: file:PSEPK/lysS/lysS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Homodimer.'
