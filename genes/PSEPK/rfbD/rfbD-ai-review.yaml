- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      Precursor-supply enzyme annotated to the downstream O-antigen polymer process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RfbD is a soluble dTDP-4-dehydrorhamnose reductase that makes the dTDP-L-rhamnose donor; it forms
      no glycosidic bond, and no KT2440 study links PP_1784 to an O-antigen. The polymer is assembled
      by glycosyltransferases, and the accurate process, dTDP-rhamnose biosynthesis (GO:0019305), is carried
      separately. This matches the treatment of GO:0000271 on the PSEPK RmlC paralogs (TreeGrafter re-review
      batch 07) and of the O-antigen rows on the E. coli RmlA-D orthologs.
    supported_by:
    - reference_id: file:PSEPK/rfbD/rfbD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the reduction of dTDP-6-deoxy-L-lyxo-4-hexulose to yield 
        dTDP-L-rhamnose.
