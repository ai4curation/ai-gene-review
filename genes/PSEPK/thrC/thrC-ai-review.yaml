  label: Pseudomonas putida KT2440
description: ThrC (PP_1471) is a pyridoxal-phosphate-dependent threonine synthase that converts O-phospho-L-homoserine
  to L-threonine and phosphate. It performs the terminal reaction of the aspartate-derived threonine pathway.
  The native protein has been coexpressed with ThrB and heterologous ThrA to increase threonine production
  in engineered KT2440.
