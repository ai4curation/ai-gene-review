id: Q88MU7
gene_symbol: thrC
product_type: PROTEIN
status: DRAFT
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida KT2440}
description: >-
  thrC (PP_1471) encodes a pyridoxal 5'-phosphate-dependent threonine
  synthase that converts O-phospho-L-homoserine and water to L-threonine and
  phosphate. TIGR00260, IPR004450, IPR000634, and the predicted PLP-linked
  Lys112 distinguish this canonical enzyme from weaker threonine-synthase-like
  candidates. It performs the terminal reaction of bacterial L-threonine
  biosynthesis from L-aspartate.
