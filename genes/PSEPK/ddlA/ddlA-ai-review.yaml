suggested_questions:
  - question: How redundant are DdlA and DdlB-family paralogs across growth and envelope-stress conditions?
  - question: What are the measured kinetic constants, metal preference, and D-lactate rejection profile of purified KT2440 DdlA?
suggested_experiments:
  - description: >-
      Construct single and combinatorial ddl depletion strains and test
      D-Ala-D-Ala auxotrophy, muropeptide composition, and envelope integrity.
    experiment_type: conditional genetics and peptidoglycan phenotyping
  - description: >-
      Purify Q88EV6 and directly assay ATP-dependent D-Ala-D-Ala formation,
      Mg2+/Mn2+ and K+ dependence, and product specificity with D-alanine,
      D-lactate, and D-serine.
    experiment_type: in vitro enzyme kinetics
