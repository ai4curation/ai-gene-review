id: Q88EV6
gene_symbol: ddlA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DdlA is a cytoplasmic ATP-dependent D-alanine-D-alanine ligase. It joins two
  D-alanine molecules to form the D-Ala-D-Ala dipeptide used by MurF during
  peptidoglycan stem-peptide precursor assembly. Q88EV6 is the DdlA-like member
  of a multi-paralog ligase family in KT2440.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP binding is required for catalysis but is not the defining function.
      action: KEEP_AS_NON_CORE
      reason: The ATP-grasp domain and annotated ATP-binding region support this cofactor property.
      supported_by:
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["FT:DOMAIN"]
          supporting_text: /note="ATP-grasp"
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasm is correct but general for this soluble ligase.
      action: MODIFY
      reason: >-
        Correct but general. The protein is a soluble ATP-grasp ligase with no
        signal peptide or transmembrane segment, so the specific descendant
        cytosol (GO:0005829) applies, matching the E. coli K-12 DdlA and DdlB
        reviews.
      proposed_replacement_terms:
        - id: GO:0005829
          label: cytosol
      supported_by:
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosol is the specific location of this soluble ligase.
      action: ACCEPT
      reason: >-
        DdlA/DdlB-family ligases are soluble ATP-grasp enzymes with no signal
        peptide or transmembrane segment; UniProt records a cytoplasmic location
        (HAMAP MF_00047). Cytosol is the most specific supported location and is
        used as the core location, as in the E. coli K-12 Ddl reviews.
      supported_by:
      - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
  - term:
      id: GO:0008716
      label: D-alanine-D-alanine ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the exact reaction assigned by convergent curated rules and signatures.
      action: ACCEPT
      reason: The curated HAMAP rule MF_00047 assigns the ATP-dependent 2 D-alanine to D-alanyl-D-alanine reaction, and the protein matches the D-Ala-D-Ala ligase family signatures (NCBIfam TIGR01205; PROSITE DALA_DALA_LIGASE_1/2). Support is UniRule/family classification, not a KT2440 enzyme assay.
      supported_by:
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: "Reaction=2 D-alanine + ATP = D-alanyl-D-alanine + ADP + phosphate +"
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: "NCBIfam; TIGR01205; D_ala_D_alaTIGR; 1."
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["DR:PROSITE"]
          supporting_text: "PROSITE; PS00843; DALA_DALA_LIGASE_1; 1."
  - term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Peptidoglycan precursor assembly is the direct process context.
      action: ACCEPT
      reason: D-Ala-D-Ala is the dipeptide substrate supplied to MurF.
      supported_by:
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["CC:PATHWAY"]
          supporting_text: "Cell wall biogenesis; peptidoglycan biosynthesis."
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Metal ion binding is correct but general; the bound ions are Mg(2+).
      action: MODIFY
      reason: >-
        Correct but general. The Ddl reaction uses two Mg(2+) (Mn(2+) substitutes
        in vitro) bound to the ATP phosphates, so the specific descendant
        magnesium ion binding (GO:0000287) is the better term. A cofactor
        property rather than the core activity; same treatment as the E. coli
        K-12 DdlA and DdlB reviews.
      proposed_replacement_terms:
        - id: GO:0000287
          label: magnesium ion binding
      supported_by:
        - reference_id: file:PSEPK/ddlA/ddlA-uniprot.txt
          record_section: ["CC:COFACTOR"]
          supporting_text: Binds 2 magnesium or manganese ions per subunit.
