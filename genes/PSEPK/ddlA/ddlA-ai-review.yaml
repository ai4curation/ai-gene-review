id: Q88EV6
gene_symbol: ddlA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DdlA is a cytoplasmic ATP-dependent D-alanine-D-alanine ligase. It joins two
  D-alanine molecules to form the D-Ala-D-Ala dipeptide used by MurF during
  peptidoglycan stem-peptide precursor assembly. Q88EV6 is the DdlA-like member
  of a multi-paralog ligase family in KT2440.
