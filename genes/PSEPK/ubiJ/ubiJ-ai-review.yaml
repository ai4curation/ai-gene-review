suggested_questions:
- question: >-
    Does KT2440 UbiJ assemble a Ubi complex that contains Coq7 in place of UbiF, and does its
    SCP2 cavity accommodate the longer nonaprenyl intermediates?
suggested_experiments:
- description: >-
    Delete PP_5012 in KT2440 and measure UQ-9 and accumulation of 2-nonaprenylphenol; purify
    tagged PP_5012 from cytoplasmic extracts and identify co-purifying Ubi proteins and lipids
    by mass spectrometry.
