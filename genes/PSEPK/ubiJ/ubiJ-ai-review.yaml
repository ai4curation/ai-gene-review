      supporting_text: It resides in a conserved **ubiE–ubiJ–ubiB operon** (PP_5011–PP_5012–PP_5013)
- term:
    id: GO:0019840
    label: isoprenoid binding
  evidence_type: ISS
  original_reference_id: PMID:30686758
  qualifier: enables
  review:
    summary: >-
      Proposed molecular function: binding of the polyisoprenoid ubiquinone intermediates by the
      SCP2 domain.
    action: NEW
    reason: >-
      Two lines agree. Q88D16 carries the SCP2 lipid-binding domain (Pfam PF02036, residues
      14-111) and the UbiJ family signature, and the curated HAMAP MF_02215 rule states that
      UbiJ binds the hydrophobic intermediates through it. In E. coli the SCP2 domain of UbiJ
      forms a hydrophobic cavity that binds UQ intermediates. The ligands are polyprenylated
      (isoprenoid) quinone precursors, so isoprenoid binding (a child of lipid binding) is the
      most specific supported term; it matches the E. coli UbiJ review. Binding has not been
      measured for the KT2440 protein.
    supported_by:
    - reference_id: PMID:30686758
      supporting_text: The SCP2 domain of UbiJ forms an extended hydrophobic cavity that binds
        UQ intermediates inside the 1-MDa Ubi complex.
    - reference_id: file:PSEPK/ubiJ/ubiJ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Binds hydrophobic ubiquinone biosynthetic intermediates via its SCP2 domain
        and is essential for the stability of the Ubi complex.
    - reference_id: file:PSEPK/ubiJ/ubiJ-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF02036; SCP2; 1.
- term:
    id: GO:0110142
    label: ubiquinone biosynthesis complex
  evidence_type: ISS
  original_reference_id: PMID:30686758
  qualifier: part_of
  review:
    summary: >-
      Proposed: UbiJ is the scaffold of the soluble Ubi complex in E. coli, and its role is
      defined by that complex.
    action: NEW
    reason: >-
      UbiJ is one of the seven proteins named in the GO:0110142 definition and is required for
      complex stability; UbiK binds its C-terminal region. The KT2440 ortholog has the same
      SCP2 plus coiled-coil architecture, and KT2440 has UbiK. Composition of a P. putida
      complex is untested (Coq7 would replace UbiF), so this is an orthology inference.
    supported_by:
    - reference_id: PMID:30686758
      supporting_text: Here, we demonstrate that seven Ubi proteins form the Ubi complex, a stable
        metabolon that catalyzes the last six reactions of the UQ biosynthetic pathway in Escherichia
        coli.
    - reference_id: PMID:28559279
      supporting_text: Using several methods, we demonstrated that the UbiK protein forms a complex
        with the C-terminal part of UbiJ, another UQ biogenesis factor we previously identified.
