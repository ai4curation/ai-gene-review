  review:
    summary: >-
      Core process. UbiJ contributes the lipid-binding scaffold on which the Ubi enzymes act.
    action: ACCEPT
    reason: >-
      Participation test: UbiJ catalyses no step, but it supplies structure the steps depend on
      (the scaffold case): its SCP2 cavity holds the intermediates inside the Ubi complex and
      it is needed for complex stability. E. coli ubiJ mutants are impaired in aerobic Q8
      synthesis. PAINT places GO:0006744 at the gammaproteobacterial UbiJ node PTN002214787
      (seed E. coli UbiJ).
    supported_by:
