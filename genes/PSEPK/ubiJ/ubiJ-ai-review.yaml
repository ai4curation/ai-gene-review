  review:
    summary: >-
      HAMAP MF_02215 cytoplasm. True but general: the E. coli Ubi complex scaffolded by UbiJ is
      soluble and purified from cytoplasmic extracts, so the cytosol is the specific location.
    action: MODIFY
    reason: >-
      UbiJ has no transmembrane segment, and its E. coli ortholog works inside a soluble 1-MDa
      complex isolated from the cytoplasmic fraction. In a bacterium the soluble part of the
      cytoplasm is the cytosol. Refine to cytosol (GO:0005829), in line with the UbiC, UbiK and
      E. coli UbiJ reviews.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
