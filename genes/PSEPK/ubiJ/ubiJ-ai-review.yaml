taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiJ (PP_5012) encodes the ubiquinone biosynthesis accessory factor UbiJ, a 207-residue
  non-enzymatic protein with an N-terminal SCP2 (sterol carrier protein 2) lipid-binding
  domain and a C-terminal coiled coil. By orthology to Escherichia coli UbiJ, the SCP2 domain
  binds the polyisoprenoid tails of hydrophobic ubiquinone intermediates, and UbiJ organizes
  and stabilizes a soluble cytoplasmic Ubi complex in which the ring-modifying enzymes act;
  its C-terminal region binds the accessory factor UbiK. ubiJ lies between ubiE (PP_5011) and
  ubiB (PP_5013). In E. coli UbiJ is needed only for aerobic ubiquinone synthesis; KT2440 lacks
  the UbiT/UbiU/UbiV anaerobic system. Function is inferred from the UbiJ family and E. coli
  work; the KT2440 protein has not been studied.
