  review:
    summary: The specific ImuA assignment contradicts the legacy transfer of canonical SulA division-inhibitor
      function.
    action: REMOVE
    reason: The electronic SulA mapping conflates related but functionally distinct proteins. Q88I84
      has the ImuA-specific IPR047610/NCBIfam signature and occupies the LexA2-imuABC cassette; native
      matched genetics support damage-tolerance accessory function. Canonical SulA inhibits FtsZ
      assembly, whereas current ImuA evidence concerns the mutasome and, in Myxococcus, DNA binding/ATPase
      and RecA interaction. Retain removal of the legacy SulA functional assignment on this specific
      identity basis, without claiming that every conceivable effect on division has been excluded
      or that no ImuA can affect division indirectly.
