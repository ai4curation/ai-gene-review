  title: UniProtKB entry for PP_3117/ImuA (Q88I84)
  findings:
  - statement: Q88I84 is assigned to the ImuA-specific translesion-synthesis family and lies immediately
      upstream of imuB and dnaE2.
- id: PMID:15458417
  title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette
    in the Proteobacteria phylum.
  findings:
  - statement: The P. putida LexA2-imuA-imuB-dnaE2 operon is induced by DNA damage.
    supporting_text: these genes constitute a DNA damage-inducible operon
- id: PMID:9501185
  title: Inhibition of FtsZ polymerization by SulA, an inhibitor of septation in Escherichia coli.
  findings:
  - statement: Canonical SulA inhibits division through FtsZ polymerization. This comparator defines
      the legacy functional mapping; it does not assay Q88I84 or establish absence of every division-related
      effect in ImuA proteins.
    supporting_text: These results indicate that SulA blocks Z ring formation by blocking FtsZ polymerization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Cited as the comparator that defines what the removed term means: this is the
      experimental demonstration of the SulA mechanism, and it is one of the references behind UniProt''s
      curated SulA FUNCTION statement. Abstract-only in the cache; both quoted claims are in the
      abstract.'
- id: PMID:17331811
  title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
  findings:
  - statement: In P. putida, DnaE2 acts as an anti-mutator for stationary-phase base substitutions,
      so the cassette's mutational output in this organism is condition-dependent rather than uniformly
      error-prone.
    supporting_text: it acted as an anti-mutator in accumulation of base substitution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only. Stationary-phase and UV antimutator/mutator effects
      are retained as stated, without inferring identical output under MMS or other conditions. Exact
      experimental background is not reconstructed from the abstract; the later full2017 paper separately
      identifies PaW85 as isogenic to KT2440.
- id: PMID:15886391
  title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
  findings:
  - statement: Ortholog genetics establishes ImuA as part of a required damage-inducible mutagenesis
      unit.
    supporting_text: all three genes that compose this expression unit are involved
  - statement: Caulobacter imuA/imuB genetics support damage tolerance in that organism; this is
      ortholog evidence, not a purified PSEPK assay.
    supporting_text: The genes imuA and imuB encode previously uncharacterized proteins, which are
      shown here for the first time to be involved in DNA damage tolerance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Used as the ortholog source for ImuA's role; the reviewed gene
      reviews for Q9A3J1, Q9A3J2 and Q9A3J3 carry the experimental annotations from this paper.
- id: PMID:28118378
  title: DNA Polymerases ImuC and DinB Are Involved in DNA Alkylation Damage Tolerance in Pseudomonas
    aeruginosa and Pseudomonas putida.
  findings:
  - statement: The native experiments use PaW85 derivatives, described as isogenic to the KT2440
      reference strain.
    supporting_text: All Pseudomonas putida strains are derivatives of PaW85 [54], which is isogenic
      to KT2440 [55].
    reference_section_type: METHODS
  - statement: Individual imuA, imuB and imuC deletions compromise alkyl-damage tolerance in an AlkA-deficient
      background; ImuB complementation addresses polarity.
    supporting_text: ImuB and ImuA are both required for the involvement of ImuC in the DNA alkyl
      damage tolerance in pseudomonads.
    reference_section_type: RESULTS
  - statement: ImuC promotes MMS-induced mutagenesis in the tested conditions, despite older antimutator
      results under different stresses.
    supporting_text: indicating that ImuC is responsible for the MMS mutability in P. putida
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary read. PaW85 derivatives are stated isogenic to KT2440; PAO1
      experiments are separate. Individual imuABC deletion phenotypes were compared in ΔalkA at 0.5mM
      MMS and30°C for P. putida; ImuB complementation almost restored tolerance. Mutation assays
      used low MMS overnight and RifR readouts. Effects vary with temperature, growth state and repair
      background. No purified Q88I82/Q88I83/Q88I84 kinetics or direct lesion-specific bypass assay
      is claimed.
- id: PMID:38591662
  title: Myxococcus xanthus translesion DNA synthesis protein ImuA is an ATPase enhanced by DNA.
  findings:
  - statement: Myxococcus ImuA exhibits DNA-enhanced ATPase activity and direct ImuB interaction;
      this is a biochemical comparator, not a measurement of PSEPK Q88I84.
    supporting_text: Here we show that M. xanthus ImuA, like RecA, hydrolyzes ATP.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary read; assays include wild-type and truncated/mutant M. xanthus proteins,
      with phosphate release and DNA binding. No automatic transfer of these molecular activities
      to the PSEPK target is made.
