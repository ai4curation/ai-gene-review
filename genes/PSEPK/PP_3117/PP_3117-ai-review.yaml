suggested_questions:
- question: Does Q88I84 bind RecA, ImuB, DnaE2, or the beta clamp directly in KT2440?
suggested_experiments:
- description: Purify Q88I84 and test DNA binding and ATP turnover with and without DNA, alongside
    activity-site controls and pairwise binding to ImuB/RecA. Relate separation-of-function mutants
    to the established PaW85 alkyl-damage phenotype; do not treat the already published imuA deletion
    as a missing experiment.
