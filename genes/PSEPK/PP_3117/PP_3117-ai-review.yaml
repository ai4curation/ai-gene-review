id: Q88I84
gene_symbol: PP_3117
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_3117 encodes the ImuA accessory protein of the LexA2-regulated
  imuA-imuB-dnaE2 cassette. It is an accessory component for which no
  catalytic activity has been demonstrated and is distinct from the SulA
  cell-division inhibitor despite sharing a broader PANTHER family assignment.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: The annotation captures damage-associated DNA metabolism but is too broad for ImuA.
      action: MODIFY
      reason: >-
        The row is a TreeGrafter IEA (GO_REF:0000118, grafting node
        PANTHER:PTN009155960), not a PAINT IBA, and it stops at the broad repair
        term. ImuA is an accessory component of the DnaE2 damage-tolerance
        cassette rather than a repair enzyme: the characterized orthologs are
        required for lesion tolerance and induced mutagenesis, which is
        translesion synthesis. The mutagenic child term is not used for this
        organism because KT2440 DnaE2 behaves as an anti-mutator for
        stationary-phase base substitutions, so the cassette's output here is
        not established as error-prone.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The genes imuA and imuB encode previously uncharacterized proteins,
            which are shown here for the first time to be involved in DNA damage
            tolerance.
        - reference_id: PMID:17331811
          supporting_text: it acted as an anti-mutator in accumulation of base substitution
  - term:
      id: GO:0009432
      label: SOS response
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The ImuA-ImuB-DnaE2 cassette is induced as part of a DNA-damage response.
      action: KEEP_AS_NON_CORE
      reason: >-
        True independently of the mapping that produced it: the P. putida
        cassette was shown to be a DNA damage-inducible operon regulated by its
        own LexA. The term is the regulatory context rather than what the protein
        does, so translesion synthesis is annotated as the effector process.
      supported_by:
        - reference_id: PMID:15458417
          supporting_text: "these genes constitute a DNA damage-inducible operon"
  - term:
      id: GO:0051782
      label: negative regulation of cell division
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This appears to be a SulA-family transfer rather than an ImuA function.
      action: REMOVE
      reason: >-
        A demonstrably wrong electronic mapping. The row is an InterPro2GO
        transfer whose stated basis is IPR004596, the SulA cell-division
        suppressor family, but Q88I84 is not currently matched to IPR004596: its
        InterPro signatures are the ImuA-specific IPR047610 plus IPR017166, and
        PANTHER places it in the ImuA subfamily PTHR35369:SF3. InterPro's own
        description of IPR047610 records that this protein was previously
        misnamed SulA in Pseudomonas putida, which is exactly the legacy
        misidentification this annotation preserves. The gene lies in the
        lexA2-imuA-imuB-dnaE2 cassette and nothing links it to division
        inhibition.
      supported_by:
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR047610; ImuA_translesion.'
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:PANTHER"]
          supporting_text: 'DR   PANTHER; PTHR35369:SF3; TRANSLESION DNA SYNTHESIS-ASSOCIATED PROTEIN IMUA; 1.'
      source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          record: 'UniProtKB:Q88I84 involved_in GO:0051782 IEA GO_REF:0000002 InterPro:IPR004596'
          requested_change: DELETE_ROW
          asserted_value: 'GO:0051782 negative regulation of cell division (from InterPro:IPR004596)'
          confidence: PROBABLE
          explanation: >-
            The defect is in InterPro's mapping as it reaches GOA: the WITH/FROM
            cites IPR004596 (Cell division suppressor protein, SulA) for a
            protein whose current InterPro signature set is the ImuA family
            IPR047610 plus IPR017166. InterPro has since created the dedicated
            ImuA entry and its description records that ImuA was previously
            misnamed SulA in P. putida, so the cell-division term is a residue of
            that misnaming. The same WITH/FROM also generates this protein's
            GO:0009432 row, which is retained because SOS-regulon membership
            happens to be true of ImuA independently.
          supported_by:
            - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
              record_section: ["DR:InterPro"]
              supporting_text: 'DR   InterPro; IPR047610; ImuA_translesion.'
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
    qualifier: involved_in
    review:
      summary: ImuA is a cassette-specific accessory protein for DnaE2-dependent lesion bypass.
      action: NEW
      reason: >-
        Transferred from the characterized orthologs: deletion of imuA in
        C. crescentus abolishes mitomycin C-induced mutagenesis and sensitizes
        cells to the damage, and the ImuA-specific family assignment plus the
        exact imuA-imuB-dnaE2 adjacency identify Q88I84 as the same component.
        No KT2440 imuA mutant has been reported, so the row is ISS rather than
        experimental.
      supported_by:
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: DR   InterPro; IPR047610; ImuA_translesion.
        - reference_id: PMID:15886391
          supporting_text: "all three genes that compose this expression unit are involved"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
    title: UniProtKB entry for PP_3117/ImuA (Q88I84)
    findings:
      - statement: Q88I84 is assigned to the ImuA-specific translesion-synthesis family and lies immediately upstream of imuB and dnaE2.
  - id: PMID:15458417
    title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in the Proteobacteria phylum.
    findings:
      - statement: The P. putida LexA2-imuA-imuB-dnaE2 operon is induced by DNA damage.
        supporting_text: "these genes constitute a DNA damage-inducible operon"
  - id: PMID:17331811
    title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
    findings:
      - statement: >-
          In P. putida, DnaE2 acts as an anti-mutator for stationary-phase base
          substitutions, so the cassette's mutational output in this organism is
          condition-dependent rather than uniformly error-prone.
        supporting_text: it acted as an anti-mutator in accumulation of base substitution
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Abstract-only in the cache; the antagonistic ImuB and DnaE2 effects on
        stationary-phase and UV mutagenesis are stated in the abstract. This is
        the reason the mutagenic child term GO:0042276 is not used for KT2440.
  - id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    findings:
      - statement: Ortholog genetics establishes ImuA as part of a required damage-inducible mutagenesis unit.
        supporting_text: "all three genes that compose this expression unit are involved"
      - statement: >-
          Deletion of the C. crescentus imuA ortholog causes extreme mitomycin C
          sensitivity, establishing a damage-tolerance role for ImuA proteins.
        supporting_text: >-
          The genes imuA and imuB encode previously uncharacterized proteins,
          which are shown here for the first time to be involved in DNA damage
          tolerance.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached. Used as the ortholog source for ImuA's role; the
        reviewed gene reviews for Q9A3J1, Q9A3J2 and Q9A3J3 carry the
        experimental annotations from this paper.
core_functions:
  - description: ImuA accessory role in the ImuB-DnaE2 damage-induced synthesis machinery.
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
        record_section: ["DR:NCBIfam"]
        supporting_text: 'DR   NCBIfam; NF033429; ImuA_translesion; 1.'
      - reference_id: PMID:15886391
        supporting_text: "all three genes that compose this expression unit are involved"
    knowledge_gaps:
      - gap_statement: The direct molecular partners and biochemical activity of Q88I84 have not been established.
        significance: The family and cassette strongly establish pathway membership but do not justify a specific molecular-function term.
proposed_new_terms: []
suggested_questions:
  - question: Does Q88I84 bind RecA, ImuB, DnaE2, or the beta clamp directly in KT2440?
suggested_experiments:
  - description: Test pairwise interactions among Q88I84, Q88I83, Q88I82, RecA, and the beta clamp and measure UV-induced mutagenesis in a PP_3117 deletion.
