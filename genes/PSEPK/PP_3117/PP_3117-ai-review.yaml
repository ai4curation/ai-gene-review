id: Q88I84
gene_symbol: PP_3117
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_3117 encodes ImuA, an accessory component of the LexA2-regulated ImuA-ImuB-DnaE2
  damage-tolerance cassette in Pseudomonas putida KT2440. In the closely matched PaW85 background,
  loss of imuA compromises alkylation-damage tolerance when AlkA repair is absent. Its precise molecular
  mechanism in this organism remains unresolved. Myxococcus ImuA can bind DNA and hydrolyze ATP,
  but those measurements have not established the same activities for Q88I84. The specific ImuA assignment
  distinguishes this protein from the canonical SulA cell-division inhibitor.
