id: Q88I84
gene_symbol: PP_3117
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3117 encodes the ImuA accessory protein of the LexA2-regulated
  imuA-imuB-dnaE2 cassette. It is an accessory component for which no
  catalytic activity has been demonstrated and is distinct from the SulA
  cell-division inhibitor despite sharing a broader PANTHER family assignment.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: The annotation captures damage-associated DNA metabolism but is too broad for ImuA.
      action: MODIFY
      reason: ImuA is an accessory component of the mutagenic DnaE2 damage-tolerance pathway rather than a canonical repair enzyme.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
  - term:
      id: GO:0009432
      label: SOS response
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The ImuA-ImuB-DnaE2 cassette is induced as part of a DNA-damage response.
      action: KEEP_AS_NON_CORE
      reason: The cassette is experimentally damage inducible; translesion synthesis is the more direct effector process.
      supported_by:
        - reference_id: PMID:15458417
          supporting_text: "these genes constitute a DNA damage-inducible operon"
  - term:
      id: GO:0051782
      label: negative regulation of cell division
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This appears to be a SulA-family transfer rather than an ImuA function.
      action: REMOVE
      reason: Q88I84 carries the ImuA-specific IPR047610 and PTHR35369:SF3 assignments and is encoded in the lexA2-imuA-imuB-dnaE2 cassette, not as a SulA division inhibitor.
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
    qualifier: involved_in
    review:
      summary: ImuA is a cassette-specific accessory protein for DnaE2-dependent lesion bypass.
      action: NEW
      reason: The ImuA-specific family assignment and conserved adjacency to imuB and dnaE2 support the specific process annotation.
      supported_by:
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          supporting_text: DR   InterPro; IPR047610; ImuA_translesion.
        - reference_id: PMID:15886391
          supporting_text: "all three genes that compose this expression unit are involved"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
    title: UniProtKB entry for PP_3117/ImuA (Q88I84)
    findings:
      - statement: Q88I84 is assigned to the ImuA-specific translesion-synthesis family and lies immediately upstream of imuB and dnaE2.
  - id: PMID:15458417
    title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in the Proteobacteria phylum.
    findings:
      - statement: The P. putida LexA2-imuA-imuB-dnaE2 operon is induced by DNA damage.
        supporting_text: "these genes constitute a DNA damage-inducible operon"
  - id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    findings:
      - statement: Ortholog genetics establishes ImuA as part of a required damage-inducible mutagenesis unit.
        supporting_text: "all three genes that compose this expression unit are involved"
core_functions:
  - description: ImuA accessory role in the ImuB-DnaE2 damage-induced synthesis machinery.
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
        supporting_text: 'DE   RecName: Full=Translesion DNA synthesis-associated protein ImuA {ECO:0008006|Google:ProtNLM};'
      - reference_id: PMID:15886391
        supporting_text: "all three genes that compose this expression unit are involved"
    knowledge_gaps:
      - gap_statement: The direct molecular partners and biochemical activity of Q88I84 have not been established.
        significance: The family and cassette strongly establish pathway membership but do not justify a specific molecular-function term.
proposed_new_terms: []
suggested_questions:
  - question: Does Q88I84 bind RecA, ImuB, DnaE2, or the beta clamp directly in KT2440?
suggested_experiments:
  - description: Test pairwise interactions among Q88I84, Q88I83, Q88I82, RecA, and the beta clamp and measure UV-induced mutagenesis in a PP_3117 deletion.
