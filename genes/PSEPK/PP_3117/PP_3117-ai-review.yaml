id: Q88I84
gene_symbol: PP_3117
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_3117 encodes the ImuA accessory protein of the LexA2-regulated
  imuA-imuB-dnaE2 cassette. It is an accessory component for which no
  catalytic activity has been demonstrated and is distinct from the SulA
  cell-division inhibitor despite sharing a broader PANTHER family assignment.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: The annotation captures damage-associated DNA metabolism but is too broad for ImuA.
      action: MODIFY
      reason: >-
        The row is a TreeGrafter IEA (GO_REF:0000118, grafting node
        PANTHER:PTN009155960), not a PAINT IBA, and it stops at the broad repair
        term. ImuA is an accessory component of the DnaE2 damage-tolerance
        cassette rather than a repair enzyme: the characterized orthologs are
        required for lesion tolerance and induced mutagenesis, which is
        translesion synthesis. The mutagenic child term is not used for this
        organism because KT2440 DnaE2 behaves as an anti-mutator for
        stationary-phase base substitutions, so the cassette's output here is
        not established as error-prone.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The genes imuA and imuB encode previously uncharacterized proteins,
            which are shown here for the first time to be involved in DNA damage
            tolerance.
        - reference_id: PMID:17331811
          supporting_text: it acted as an anti-mutator in accumulation of base substitution
  - term:
      id: GO:0009432
      label: SOS response
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The ImuA-ImuB-DnaE2 cassette is induced as part of a DNA-damage response.
      action: KEEP_AS_NON_CORE
      reason: >-
        True independently of the mapping that produced it: the P. putida
        cassette was shown to be a DNA damage-inducible operon regulated by its
        own LexA. The term is the regulatory context rather than what the protein
        does, so translesion synthesis is annotated as the effector process.
      supported_by:
        - reference_id: PMID:15458417
          supporting_text: "these genes constitute a DNA damage-inducible operon"
  - term:
      id: GO:0051782
      label: negative regulation of cell division
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: >-
        A SulA-family transfer that survives only because ImuA is homologous to
        SulA; nothing links this protein to cell division.
      action: REMOVE
      reason: >-
        An over-propagated electronic inference, argued on biological grounds
        rather than on a missing signature. The row is an InterPro2GO transfer
        whose stated basis is IPR004596 (Cell division suppressor protein,
        SulA), and that entry does carry exactly GO:0051782 and GO:0009432 in
        InterPro2GO. InterPro's entry-protein match list for Q88I84 does include
        IPR004596, alongside the four entries UniProt cross-references:
        IPR047610 (ImuA_translesion), IPR027417 (P-loop_NTPase), IPR050356
        (SulA_CellDiv_inhibitor) and IPR017166 (UCP037290). So the match is real
        and the mapping was applied correctly; what is wrong is the conclusion.
        The SulA signature catches ImuA because the two are homologous, which is
        the very similarity that caused ImuA to be misnamed SulA in this
        organism in the first place: InterPro's dedicated ImuA entry IPR047610
        records that history. IPR050356 does not reinstate the term either, as it
        is the PANTHER-integrated family entry for PTHR35369 (the heterogeneous
        family holding SulA, ImuA and ImuB) and carries no InterPro2GO mapping at
        all. Biologically, Q88I84 sits in the lexA2-imuA-imuB-dnaE2 cassette,
        PANTHER places it in the ImuA subfamily PTHR35369:SF3, the characterized
        orthologs are required for damage tolerance and induced mutagenesis, and
        no division phenotype has ever been reported for an ImuA protein. The
        division-inhibition claim is therefore false for this gene even though
        the homology behind it is genuine.
      supported_by:
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR047610; ImuA_translesion.'
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR050356; SulA_CellDiv_inhibitor.'
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:PANTHER"]
          supporting_text: 'DR   PANTHER; PTHR35369:SF3; TRANSLESION DNA SYNTHESIS-ASSOCIATED PROTEIN IMUA; 1.'
        - reference_id: PMID:9501185
          supporting_text: >-
            These results indicate that SulA blocks Z ring formation by blocking
            FtsZ polymerization.
      source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          record: 'UniProtKB:Q88I84 involved_in GO:0051782 IEA GO_REF:0000002 InterPro:IPR004596'
          requested_change: DELETE_ROW
          asserted_value: 'GO:0051782 negative regulation of cell division (from InterPro:IPR004596)'
          confidence: PROBABLE
          explanation: >-
            The defect is upstream in InterPro, not in GOA's application of it.
            IPR004596 (Cell division suppressor protein, SulA) carries GO:0051782
            and GO:0009432, and its signature matches ImuA proteins as well as
            SulA proteins, so every ImuA inherits a cell-division term. InterPro
            has since created a dedicated ImuA family, IPR047610, whose own
            description records that this protein was previously misnamed SulA in
            Pseudomonas putida; Q88I84 matches both entries. The fix is upstream:
            either IPR004596 should not match the ImuA clade now that IPR047610
            exists for it, or its GO mapping should not propagate to members that
            IPR047610 also matches. Note that the same IPR004596 mapping
            generates this protein's GO:0009432 row, which is retained, because
            SOS-regulon membership happens to be independently true of ImuA. The
            UniProt flat file lists four InterPro cross-references and omits
            IPR004596; the match is visible in InterPro's own entry-protein
            listing for the accession and in the GOA row's WITH/FROM, recorded
            above.
          supported_by:
            - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
              record_section: ["DR:InterPro"]
              supporting_text: 'DR   InterPro; IPR047610; ImuA_translesion.'
            - reference_id: PMID:9501185
              supporting_text: >-
                In Escherichia coli the formation of the Z ring is prevented by
                induction of the cell division inhibitor SulA (SfiA), a component
                of the SOS response.
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
    qualifier: involved_in
    review:
      summary: ImuA is a cassette-specific accessory protein for DnaE2-dependent lesion bypass.
      action: NEW
      reason: >-
        Transferred from the characterized orthologs: deletion of imuA in
        C. crescentus abolishes mitomycin C-induced mutagenesis and sensitizes
        cells to the damage, and the ImuA-specific family assignment plus the
        exact imuA-imuB-dnaE2 adjacency identify Q88I84 as the same component.
        No KT2440 imuA mutant has been reported, so the row is ISS rather than
        experimental.
      supported_by:
        - reference_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: DR   InterPro; IPR047610; ImuA_translesion.
        - reference_id: PMID:15886391
          supporting_text: "all three genes that compose this expression unit are involved"
