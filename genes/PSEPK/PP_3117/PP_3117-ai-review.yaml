    title: UniProtKB entry for PP_3117/ImuA (Q88I84)
    findings:
      - statement: Q88I84 is assigned to the ImuA-specific translesion-synthesis family and lies immediately upstream of imuB and dnaE2.
  - id: PMID:15458417
    title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in the Proteobacteria phylum.
    findings:
      - statement: The P. putida LexA2-imuA-imuB-dnaE2 operon is induced by DNA damage.
        supporting_text: "these genes constitute a DNA damage-inducible operon"
  - id: PMID:9501185
    title: Inhibition of FtsZ polymerization by SulA, an inhibitor of septation in Escherichia coli.
    findings:
      - statement: >-
          SulA inhibits cell division by blocking FtsZ polymerization, which is
          the function IPR004596's GO mapping encodes and which no ImuA protein
          has been shown to have.
        supporting_text: >-
          These results indicate that SulA blocks Z ring formation by blocking
          FtsZ polymerization.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cited as the comparator that defines what the removed term means: this is
        the experimental demonstration of the SulA mechanism, and it is one of the
        references behind UniProt's curated SulA FUNCTION statement. Abstract-only
        in the cache; both quoted claims are in the abstract.
  - id: PMID:17331811
    title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
    findings:
      - statement: >-
          In P. putida, DnaE2 acts as an anti-mutator for stationary-phase base
          substitutions, so the cassette's mutational output in this organism is
          condition-dependent rather than uniformly error-prone.
        supporting_text: it acted as an anti-mutator in accumulation of base substitution
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Abstract-only in the cache; the antagonistic ImuB and DnaE2 effects on
        stationary-phase and UV mutagenesis are stated in the abstract. This is
        the reason the mutagenic child term GO:0042276 is not used for KT2440.
  - id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    findings:
      - statement: Ortholog genetics establishes ImuA as part of a required damage-inducible mutagenesis unit.
        supporting_text: "all three genes that compose this expression unit are involved"
      - statement: >-
          Deletion of the C. crescentus imuA ortholog causes extreme mitomycin C
          sensitivity, establishing a damage-tolerance role for ImuA proteins.
        supporting_text: >-
          The genes imuA and imuB encode previously uncharacterized proteins,
          which are shown here for the first time to be involved in DNA damage
          tolerance.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached. Used as the ortholog source for ImuA's role; the
        reviewed gene reviews for Q9A3J1, Q9A3J2 and Q9A3J3 carry the
        experimental annotations from this paper.
