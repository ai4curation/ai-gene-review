description: >-
  FtsI/PBP3 is a bitopic inner-membrane class-B penicillin-binding protein whose
  periplasmic catalytic domain performs D,D-transpeptidation during septal
  peptidoglycan synthesis. It is the peptide-crosslinking partner of the FtsW
  SEDS glycan polymerase in the bacterial divisome.
