id: Q88PJ6
gene_symbol: hisS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HisS is a class II histidyl-tRNA synthetase predicted to act as a homodimer, supplying His-tRNA(His)
  for translation. It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA
  substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0004821
    label: histidine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: hisS supplies histidine-charged tRNA(His) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_00127 supports the histidine-specific ATP-dependent reaction and class II architecture;
      no KT2440 kinetic measurement was located. The independently curated MF_00127 reaction supports
      this specific MF; electronic provenance does not make a central catalytic function peripheral.
    supported_by: &id001
    - reference_id: file:PSEPK/hisS/hisS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(His) + L-histidine + ATP = L-histidyl-tRNA(His) + AMP +
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to hisS-catalysed histidine activation.
    action: ACCEPT
    reason: The curated MF_00127 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: hisS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: ACCEPT
    reason: The MF_00127 subcellular-location statement supports this native compartment as a conserved
      functional inference. No finer localization is established in the inspected record; this is the
      core cellular setting rather than a peripheral process.
    supported_by:
    - reference_id: file:PSEPK/hisS/hisS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0006427
    label: histidyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The histidine-specific charging chemistry remains supported, but this biological-process
      ID is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006427 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain histidine specificity
      in GO:0004821. This is ontology maintenance, not a rejection of the MF_00127 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id002
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
