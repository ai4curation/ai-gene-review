      supporting_text: "Its catalytically active alphabeta protomer is composed of two dissimilar subunits (alpha subunit, 164.2 kDa; beta subunit, 52.3 kDa) and contains one FAD."
    - reference_id: file:PSEPK/gltD/gltD-uniprot.txt
      supporting_text: "SubName: Full=Glutamate synthase (NADPH) beta subunit"
