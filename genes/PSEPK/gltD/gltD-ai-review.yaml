status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GltD (PP_5075) is the small electron-transfer subunit of the NADPH-dependent glutamate synthase
  of Pseudomonas putida KT2440. Its GltD-family FAD/NAD(P)-binding and iron-sulfur architecture supports
  electron entry from NADPH and delivery to the catalytic GltB subunit. The coupled enzyme converts glutamine
  and 2-oxoglutarate to two glutamate molecules within the GS–GOGAT assimilation route. Native KT2440
  fitness data support nitrogen-source-dependent participation, while isolated-subunit cofactor stoichiometry
  and kinetics remain comparative functional inferences.
