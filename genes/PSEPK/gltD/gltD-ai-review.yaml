  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Broad oxidoreductase activity derived from the FAD/NAD-binding signature; the direct subunit chemistry can be represented more specifically as oxidoreductase activity acting on NAD(P)H.
    action: MODIFY
    reason: Replace the generic parent with GO:0016651 to capture GltD's direct NADPH-oxidizing role separately from its contribution to holoenzyme glutamate synthase activity.
