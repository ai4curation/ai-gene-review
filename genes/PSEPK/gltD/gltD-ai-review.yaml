    action: ACCEPT
- term:
    id: GO:0019676
    label: ammonia assimilation cycle
  evidence_type: IC
  original_reference_id: file:modules/bacterial_ammonia_assimilation.yaml
  qualifier: involved_in
  supporting_entities:
  - GO:0004355
  review:
    summary: Proposed new biological-process annotation. GltD is the obligate FAD/[4Fe-4S]-containing beta subunit of the glutamate synthase (GOGAT) holoenzyme (EC 1.4.1.13); together with the GltB large chain and glutamine synthetase (GlnA) it constitutes the GS-GOGAT cycle that assimilates ammonia into L-glutamate under nitrogen limitation. The paired gltB review carries this term (ACCEPT, supported by TreeGrafter GO_REF:0000118); because both subunits act in the same holoenzyme and pathway, GltD should be annotated to the same biological process. Currently absent from gltD GOA; proposed by analogy to the partner subunit and the shared EC 1.4.1.13 activity.
    action: NEW
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "A reusable bacterial module for high-affinity assimilation of ammonium through the glutamine synthetase-glutamate synthase (GS-GOGAT) cycle."
