id: Q88CV5
gene_symbol: gltD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: gltD (PP_5075) encodes the small (beta) chain of glutamate synthase [NADPH] (GOGAT), the FAD-containing flavoprotein/oxidoreductase subunit of the EC 1.4.1.13 holoenzyme. Its 4Fe-4S ferredoxin-type and NAD(P)-binding Rossmann domains support a role accepting reducing equivalents from NADPH and relaying them through the holoenzyme's flavin and iron-sulfur centers to the catalytic GltB large chain. The adjacent gltD and gltB genes (PP_5075 and PP_5076) encode the two subunits of the ammonia-assimilatory glutamate synthase that, together with glutamine synthetase GlnA, forms the GS-GOGAT cycle of central nitrogen metabolism. GltD is predicted to be a soluble cytoplasmic iron-sulfur oxidoreductase in P. putida.
existing_annotations:
- term:
    id: GO:0004355
    label: glutamate synthase (NADPH) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct complex-level EC 1.4.1.13 activity, but GltD is the NADPH-oxidizing electron-transfer subunit rather than an independently active glutamate synthase.
    action: MODIFY
    reason: Retain the term but change the relation from enables to contributes_to; GltD supplies reducing equivalents to the GltB catalytic subunit.
    proposed_replacement_terms:
    - id: GO:0004355
      label: glutamate synthase (NADPH) activity
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "Reducing equivalents are delivered by NADPH via FAD and iron–sulfur clusters in the β-subunit."
- term:
    id: GO:0009342
    label: glutamate synthase complex (NADPH)
  evidence_type: IC
  original_reference_id: file:modules/bacterial_ammonia_assimilation.yaml
  qualifier: part_of
  supporting_entities:
  - GO:0004355
  review:
    summary: GltD is the electron-transfer small subunit of the two-subunit NADPH-dependent glutamate synthase complex.
    action: NEW
    reason: >-
      Complex membership captures the physical context required for GltD and
      GltB to perform the complete NADPH-dependent reaction. Membership of the
      KT2440 protein is inferred from its subunit assignment and conserved
      family architecture rather than a direct complex assay.
    supported_by:
