- id: PMID:10613867
  title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put
    genes in the presence of root exudates.'
  findings:
  - statement: KT2442 native proline-utilization genetics and sequence-based assignment of PutA catalytic
      domains and PutP proline uptake; KT2442 is a KT2440 derivative.
    supporting_text: its gene product is an integral inner-membrane protein involved in the uptake of
      proline
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The frozen cache remains abstract-only. Independently acquired official PMC full text
      confirms KT2442 native genetics, not a direct purified KT2440 catalytic or sodium-transport assay.
      See the shared PSEPK PutA source-scope analysis.
- id: PMID:11097893
  title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
  findings:
  - statement: The KT2440 pathway study assigns proline uptake to PutP.
    supporting_text: its uptake, which is mediated by the PutP protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract names KT2440; full Table1 identifies KT2442 as its Rif-r derivative, and
      Figure3 compares KT2442, S14D2 and KT2442-Pro21. Methods uses KT2440-Pro21 for the spontaneous mutant.
      This supports lineage-specific put-gene regulation; it does not measure transport coupling.
