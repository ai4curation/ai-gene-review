  label: Pseudomonas putida KT2440
description: putP encodes a multi-pass inner-membrane sodium/proline symporter that imports extracellular
  L-proline. The imported proline supplies the adjacent PutA catabolic enzyme and supports use of proline
  as a carbon and nitrogen source.
