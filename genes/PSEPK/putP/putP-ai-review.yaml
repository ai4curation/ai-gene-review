  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  putP encodes a multi-pass inner-membrane sodium/proline symporter that imports
  extracellular L-proline. The imported proline supplies the adjacent PutA
  catabolic enzyme and supports use of proline as a carbon and nitrogen source.
