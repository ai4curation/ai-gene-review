    review:
      summary: The substrate- and coupling-specific symporter term is the core PutP molecular function.
      action: ACCEPT
      reason: >-
        The combined automated row is supported by the exact UniProt sodium-dependent
        uptake assignment, PutP family membership, and the P. putida pathway literature.
      supported_by:
        - reference_id: file:PSEPK/putP/putP-goa.tsv
