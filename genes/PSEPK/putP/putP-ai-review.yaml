- term:
    id: GO:0031402
    label: sodium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Sodium binding supports the Na+-coupled proline transport mechanism.
    action: ACCEPT
    reason: 'The specific PutP/Na-proline symporter assignment and curated RuleBase sodium-dependent
      uptake statement support sodium binding as a conserved mechanistic interaction. A separate
      standalone sodium-binding role is not required by GO:0031402. This is inference for KT2440,
      not a target-specific affinity or stoichiometry measurement. The evidence remains weaker than
      the direct Na+-protection/binding experiments on E. coli PutP (PMID:1567896): neither sodium
      affinity, stoichiometry, nor binding without proline has been measured here. The shared ACCEPT
      action judges the supported central interaction; it does not equate evidence codes or experimental
      coverage.'
    supported_by:
