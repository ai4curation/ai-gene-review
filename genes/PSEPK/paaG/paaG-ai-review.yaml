    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct pathway assignment for PaaG.
    action: ACCEPT
    reason: >-
      PaaG is the epoxyphenylacetyl-CoA isomerase encoded in the paa
      catabolic locus. The UniProt name is a submitter-imported label and is
      not cited. Support is family membership plus ortholog biochemistry: the
      protein matches the phenylacetate-degradation-specific crotonase
      subfamily PaaB1 (NCBIfam TIGR02280, InterPro IPR011968), and the E. coli
      PaaG ortholog acts in the paa-encoded phenylacetate degradation pathway,
      forming a PaaFG hydratase-isomerase complex (PMID:22961985, abstract
      only). No KT2440-specific experiment is cached.
    supported_by:
    - reference_id: file:PSEPK/paaG/paaG-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR02280; PaaB1; 1."
    - reference_id: PMID:22961985
      supporting_text: >-
        The hybrid phenylacetate degradation pathway is encoded in Escherichia
        coli by the paa operon containing genes for 10 enzymes.
    - reference_id: PMID:22961985
      supporting_text: >-
        another stable complex, PaaFG, an enoyl-CoA hydratase and enoyl-Coa
        isomerase, both belonging to the crotonase superfamily
