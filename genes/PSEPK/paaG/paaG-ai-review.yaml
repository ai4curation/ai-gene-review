id: Q88HS0
gene_symbol: paaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaG is a crotonase-superfamily 1,2-epoxyphenylacetyl-CoA isomerase in the
  aerobic phenylacetate degradation pathway of Pseudomonas putida KT2440. It
  acts downstream of the PaaABCE epoxidase system, reversibly rearranging the
  reactive ring 1,2-epoxyphenylacetyl-CoA into the seven-membered
  oxygen-heterocycle oxepin-CoA, the substrate for hydrolytic ring opening by
  PaaZ. By orthology to E. coli PaaG it may also isomerize
  3,4-dehydroadipyl-CoA to 2,3-dehydroadipyl-CoA in the lower pathway and
  associate with the PaaF hydratase.
