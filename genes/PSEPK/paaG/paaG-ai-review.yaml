  findings:
  - statement: The report specifies oxepin-CoA as the product of PaaG-catalyzed epoxide isomerization.
    supporting_text: >-
      Its primary reaction is the intramolecular isomerization of the reactive,
      non-aromatic **1,2-epoxyphenylacetyl-CoA** into the seven-membered
      oxygen-heterocycle **oxepin-CoA**
    reference_section_type: RESULTS
  - statement: Direct biochemical characterization of the KT2440 target remains unavailable.
    supporting_text: >-
      **Direct biochemistry is on orthologs, not PP_3283 itself.**
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
