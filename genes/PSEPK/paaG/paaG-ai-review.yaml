    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Correct in branch but too broad for the epoxide-oxepin isomerase.
    action: MODIFY
    reason: >-
      Q88HS0 belongs to the NCBIfam PaaB1 (TIGR02280) phenylacetate-pathway
      crotonase family, and the Pseudomonas sp. Y2 ortholog was shown to
      catalyze the reversible isomerization of ring 1,2-epoxyphenylacetyl-CoA
      to oxepin-CoA (EC 5.3.3.18). GO has no reaction-specific term; the EC
      5.3.3 class term GO:0016863 intramolecular oxidoreductase activity,
      transposing C=C bonds is the most specific available parent, matching
      the E. coli PaaG review.
    proposed_replacement_terms:
    - id: GO:0016863
      label: intramolecular oxidoreductase activity, transposing C=C bonds
