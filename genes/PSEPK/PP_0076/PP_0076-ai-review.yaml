id: Q88RQ3
gene_symbol: PP_0076
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0076 is a signal-peptide-bearing periplasmic substrate-binding protein in
  the choline/glycine-betaine transporter binding-protein family. Its
  physiological ligand and membrane-transport partner are unresolved; current
  evidence does not establish an ABC complex or direct transmembrane
  transporter activity for this soluble protein.
existing_annotations:
- term:
    id: GO:0015871
    label: choline transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Choline transport is plausible from family membership but is not established for PP_0076.
    action: UNDECIDED
    reason: The annotation is transferred from the choline-transporter substrate-binding family. No target-specific study distinguishes choline from choline-O-sulfate, glycine betaine, or another related ligand.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-goa.tsv
      supporting_text: "GO:0015871\tcholine transport"
    - reference_id: file:PSEPK/PP_0076/PP_0076-deep-research-openscientist.md
      supporting_text: No direct biochemical characterization of PP_0076 itself.
- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: A soluble periplasmic binding protein does not itself translocate substrate across a membrane.
    action: REMOVE
    reason: PP_0076 has a cleavable signal peptide and a periplasmic substrate-binding-protein architecture but no transmembrane segment. Transport-process participation is separable from enabling transporter molecular activity.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      supporting_text: 'FT   SIGNAL          1..20'
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
