      The explicit knowledge gaps were retained. The report's definitive ABC
      complex model is rejected because it incorrectly identifies
      PP_0074/Q88RQ5 as an ABC ATPase; PP_0074 is shikimate dehydrogenase AroE,
      and PP_0075 has SLC26A/SulP-STAS rather than ABC-permease architecture.
