- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: Current target and locus evidence does not establish membership in an ABC transporter complex.
    action: REMOVE
    reason: The ABC-complex annotation is transferred from a broad substrate-binding domain. The adjacent PP_0075 candidate is an SLC26A/SulP-STAS transporter, not a canonical ABC permease or ATPase, and no cognate ABC assembly or physical association has been demonstrated.
    supported_by:
