id: Q88RQ3
gene_symbol: PP_0076
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0076 is a signal-peptide-bearing periplasmic substrate-binding protein in
  the choline/glycine-betaine transporter binding-protein family. Its
  physiological ligand and membrane-transport partner are unresolved; current
  evidence does not establish an ABC complex or direct transmembrane
  transporter activity for this soluble protein.
existing_annotations:
- term:
    id: GO:0015871
    label: choline transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Transport of a quaternary ammonium compound is supported at family level, but the
      choline-specific cargo is not.
    action: MODIFY
    reason: >-
      The InterPro2GO mapping transfers choline transport from the choline-transporter substrate-binding
      family. The OpuAC-type binding-protein domain is shared by binding proteins for several quaternary
      ammonium compatible solutes, and PP_0076 sits beside the choline sulfatase gene in a locus induced
      by choline-O-sulfate in a second Pseudomonas, so its cargo could be choline-O-sulfate, choline or
      a related compound. The available sources do not resolve this for KT2440; the cited ATCC19151 locus
      study is a different-strain comparator, and its cached text is abstract-only. The supported claim
      is the class-level parent quaternary ammonium group transport (GO:0015697), whose definition covers
      any compound derived from ammonium by replacement of all four hydrogens with organic groups; choline
      and choline-O-sulfate both qualify.
    proposed_replacement_terms:
    - id: GO:0015697
      label: quaternary ammonium group transport
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR007210; ABC_Gly_betaine_transp_sub-bd.
    - reference_id: PMID:21369825
      supporting_text: BetR activates betC and betR transcription in the presence of choline sulfate
- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: A soluble periplasmic binding protein does not itself translocate substrate across a
      membrane.
    action: REMOVE
    reason: The unqualified enables assertion attributes membrane translocation to a protein whose
      signal peptide and soluble substrate-binding architecture instead support ligand capture. No
      target-specific functional transport complex has been established that would justify a
      contributes_to qualifier. Retain transport-process participation and ligand binding, while
      rejecting independent transmembrane transporter activity for PP_0076; the absence of
      transmembrane helices alone would not exclude a qualified contribution in a demonstrated
      complex.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: FT   SIGNAL          1..20
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR007210; ABC_Gly_betaine_transp_sub-bd.
- term:
    id: GO:0033265
    label: choline binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Exact choline binding is not established; binding of a quaternary ammonium ligand is
      the supported generalization.
    action: MODIFY
    reason: >-
      The term is a family-based inference. Neither direct ligand-binding data
      nor target-specific genetics distinguishes choline from choline-O-sulfate
      or another quaternary ammonium solute for PP_0076. GO:0050997 quaternary
      ammonium group binding is defined as "Binding to a quaternary ammonium
      group, including glycine betaine, choline, carnitine and proline" and is
      the claim the OpuAC-type binding domain supports without committing to a
      ligand. This is a lateral generalization, not a parent: in GO,
      GO:0033265 choline binding is_a GO:0043169 cation binding (is_a ion
      binding, is_a binding), while GO:0050997 is_a GO:0036094 small molecule
      binding; neither term subsumes the other.
      Comparator: the KT2440 paralog CaiX (Q88R30, also NCBIfam TIGR03414
      ABC_choline_bnd) is reviewed in this repository as the L-carnitine-binding
      component of the CbcWV importer, so membership of this NCBIfam family does
      not fix choline as the ligand.
    proposed_replacement_terms:
    - id: GO:0050997
      label: quaternary ammonium group binding
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04069; OpuAC; 1.
    - reference_id: file:PSEPK/PP_0076/PP_0076-deep-research-openscientist.md
      supporting_text: Substrate ambiguity within the quaternary-ammonium class.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: The signal peptide and binding-protein architecture support a periplasmic location.
    action: ACCEPT
    reason: The predicted cleavable signal peptide and OpuAC-type substrate-binding architecture
      jointly support periplasmic localization. This is where the inferred ligand-capture activity
      occurs, so it is core functional localization even though the exact ligand and transport
      partner remain unresolved; it is not a target localization assay.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: FT   SIGNAL          1..20
- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: ABC-complex membership is an over-annotation from family architecture; no cognate
      KT2440 ABC permease or ATPase has been identified.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The target has ABC substrate-binding-family architecture and a syntenic
      Pseudomonas homolog is described in silico as an ABC substrate-binding
      protein, so complex membership is possible. However, the adjacent
      membrane protein PP_0075 is an SLC26A/SulP-STAS permease rather than an
      ABC permease, no ABC ATPase is encoded at the locus, and no assay has
      paired PP_0076 with any ABC transporter encoded elsewhere. Asserting
      part_of an ABC transporter complex goes beyond the evidence.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR017783; ABC_choline_sub-bd.
    - reference_id: PMID:21369825
      supporting_text: substrate-binding ABC transporter protein (betD)
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Retain generic transport-process participation for a periplasmic transporter binding
      protein.
    action: ACCEPT
    reason: The substrate-binding-protein architecture supports participation in a transport
      process, although the transported ligand and membrane partner remain unresolved.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR007210; ABC_Gly_betaine_transp_sub-bd.
