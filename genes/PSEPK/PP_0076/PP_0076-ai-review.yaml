- id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: A KT2440 betC deletion retained intact choline-O-sulfate accumulation.
    supporting_text: This mutant still accumulated intact COS but failed to use this compound as carbon or nitrogen source.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct KT2440 betC genetics. The cached abstract does not individually assay PP_0076, its ligand, or its transport partner.
- id: file:PSEPK/PP_0076/PP_0076-deep-research-openscientist.md
  title: OpenScientist deep-research report for PSEPK PP_0076
  findings:
  - statement: The report confirms that direct target ligand-binding and transport assays are absent.
    supporting_text: No direct biochemical characterization of PP_0076 itself.
    reference_section_type: DISCUSSION
  - statement: The report recognizes unresolved ligand specificity within the quaternary-ammonium class.
    supporting_text: Substrate ambiguity within the quaternary-ammonium class.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      The explicit knowledge gaps were retained. The report's definitive ABC
      complex model is rejected because it incorrectly identifies
      PP_0074/Q88RQ5 as an ABC ATPase; PP_0074 is shikimate dehydrogenase AroE,
      and PP_0075 has SLC26A/SulP-STAS rather than ABC-permease architecture.
