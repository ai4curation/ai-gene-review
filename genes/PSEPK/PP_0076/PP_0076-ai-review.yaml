suggested_questions:
- question: Which ligand binds PP_0076 in vivo, and does PP_0076 function with PP_0075 or a
    different membrane transporter?
suggested_experiments:
- description: Measure purified PP_0076 binding to choline, choline-O-sulfate, glycine betaine, and
    related osmolytes, then pair deletion/complementation genetics with uptake assays and
    interaction tests against PP_0075.
