  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Exact choline binding remains unresolved for the target protein.
    action: UNDECIDED
    reason: The term is a family-based inference, and neither direct ligand-binding data nor target-specific genetics resolves the physiological ligand.
    supported_by:
    - reference_id: file:PSEPK/PP_0076/PP_0076-goa.tsv
      supporting_text: "GO:0033265\tcholine binding"
- term:
