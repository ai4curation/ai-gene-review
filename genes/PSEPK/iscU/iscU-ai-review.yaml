id: Q88PK7
gene_symbol: iscU
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: IscU (PP_0843) is the central transient scaffold of the bacterial Isc system. It receives sulfur from IscS, coordinates a nascent iron-sulfur cluster, and presents cluster-bearing scaffold to downstream transfer machinery.
existing_annotations:
  - term:
      id: GO:0005506
      label: iron ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The broad free-iron-binding term obscures coordination of a nascent Fe-S cluster.
      action: MARK_AS_OVER_ANNOTATED
      reason: IscU is a cluster scaffold; its biologically informative property is Fe-S cluster chaperone activity rather than generic iron-ion binding.
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is compatible with the bacterial Isc system.
      action: KEEP_AS_NON_CORE
      reason: The location is plausible but not defining and is not directly established in KT2440.
  - term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: IscU directly scaffolds nascent Fe-S cluster assembly.
      action: ACCEPT
      reason: The IscU-specific family and UniProt function statement support the process assignment.
      supported_by:
        - reference_id: file:PSEPK/iscU/iscU-uniprot.txt
          supporting_text: 'CC   -!- FUNCTION: A scaffold on which IscS assembles Fe-S clusters. It is'
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Cluster binding is correct but a chaperone term better captures assembly and handoff.
      action: MODIFY
      reason: IscU transiently coordinates and transfers a nascent cluster rather than merely binding it.
      proposed_replacement_terms:
        - id: GO:0140132
          label: iron-sulfur cluster chaperone activity
