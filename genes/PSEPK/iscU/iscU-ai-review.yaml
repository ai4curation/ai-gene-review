  label: Pseudomonas putida KT2440
description: IscU (PP_0843) is the transient iron-sulfur cluster scaffold of Pseudomonas putida KT2440.
  It receives sulfur from IscS and coordinates newly assembled clusters for transfer to acceptors. Its
  conserved scaffold family supports iron loading and cluster delivery, while the detailed loading sequence
  and HscA/HscB-dependent conformational cycle are characterized in bacterial homologs.
existing_annotations:
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Iron binding is compatible with an iron-loaded scaffold intermediate.
    action: ACCEPT
    reason: The 2010 E. coli study failed to recover iron on IscU under its purification conditions; it
      does not establish universal absence. The later reconstituted E. coli system in PMID39870763 explicitly
      begins with iron binding to IscU. Together with target RuleBase scaffold function, this supports
      the inherited iron-binding claim by homolog inference, without asserting a stable free-iron reservoir
      or a direct KT2440 assay. Primary native-MS studies PMID32131593 and PMID36605734 also support iron
      interaction but differ over loading order and detectable intermediates; no universal iron-first
      sequence is assigned to KT2440.
    supported_by:
    - &id001
      reference_id: file:PSEPK/iscU/iscU-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: A scaffold on which IscS assembles Fe-S clusters.
    - reference_id: PMID:39870763
      supporting_text: this process is initiated by iron binding to the scaffold protein IscU
    - reference_id: PMID:20942799
      supporting_text: fails to bind any iron in E. coli cells under the same experimental conditions.
    - reference_id: PMID:32131593
      supporting_text: Fe(II) ions bind to the IscU active site cysteine residues and another lower affinity
        binding site
    - reference_id: PMID:36605734
      supporting_text: Our data indicate that either Fe2+ or sulfur transfer can occur first
