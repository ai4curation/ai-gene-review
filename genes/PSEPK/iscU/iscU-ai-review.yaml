- id: PMID:20942799
  title: In vivo evidence for the iron-binding activity of an iron-sulfur cluster assembly protein IscA
    in Escherichia coli.
  findings:
  - statement: E. coli IscU did not copurify with iron under conditions that recovered iron-loaded IscA.
    supporting_text: fails to bind any iron in E. coli cells under the same experimental conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This full-text E. coli study tests particular growth and purification conditions; it
      does not exclude transient scaffold iron loading under other conditions or in KT2440.
- id: PMID:16877383
  title: Interplay of IscA and IscU in biogenesis of iron-sulfur clusters.
  findings:
  - statement: Comparative reconstitution identifies IscU as the preferred initial Fe-S cluster assembly
      scaffold.
- id: PMID:39870763
  title: The ISC machinery assembles [2Fe-2S] clusters by formation and fusion of [1Fe-1S] precursors.
  findings:
  - statement: The E. coli reconstituted assembly pathway starts with iron loading onto IscU and ends
      in cluster delivery.
    supporting_text: this process is initiated by iron binding to the scaffold protein IscU
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract identifies E. coli, not KT2440. Its positive iron-loading result is
      assessed alongside the condition-specific earlier negative experiment.
- id: PMID:18986169
  title: Studies on the mechanism of catalysis of iron-sulfur cluster transfer from IscU[2Fe2S] by HscA/HscB
    chaperones.
  findings:
  - statement: A bacterial HscA/HscB system accelerates cluster transfer from holo-IscU to apoferredoxin.
    supporting_text: transfer from holo-IscU to apoferredoxin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative reconstitution, cached abstract-only; the result supports scaffold handoff
      rather than a KT2440 kinetic measurement.
- id: PMID:32131593
  title: Molecular Mechanism of ISC Iron-Sulfur Cluster Biogenesis Revealed by High-Resolution Native
    Mass Spectrometry.
  findings:
  - statement: E. coli native mass spectrometry detects iron binding to IscU before cluster completion.
    supporting_text: Fe(II) ions bind to the IscU active site cysteine residues and another lower affinity
