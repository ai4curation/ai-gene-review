    title: UniProtKB entry for iscU (Q88PK7)
    findings:
      - statement: Q88PK7 is assigned to the IscU-specific IPR011339 family and described as the scaffold on which IscS assembles clusters.
core_functions:
  - description: Transiently scaffolds nascent Fe-S cluster assembly and presents the cluster for downstream transfer.
    molecular_function:
      id: GO:0140132
      label: iron-sulfur cluster chaperone activity
    directly_involved_in:
      - id: GO:0016226
        label: iron-sulfur cluster assembly
    supported_by:
      - reference_id: file:PSEPK/iscU/iscU-uniprot.txt
        supporting_text: DR   InterPro; IPR011339; ISCU.
    knowledge_gaps:
      - gap_statement: Q88PK7 cluster type, kinetics, and acceptor specificity have not been measured directly.
        significance: Family assignment supports a scaffold role but not the detailed KT2440 handoff mechanism.
proposed_new_terms: []
suggested_questions:
  - question: Which KT2440 Fe-S targets receive clusters directly from Q88PK7?
suggested_experiments:
  - description: Reconstitute cluster assembly on Q88PK7 with Q88PK8 and test transfer to candidate acceptor proteins with and without HscA/HscB.
