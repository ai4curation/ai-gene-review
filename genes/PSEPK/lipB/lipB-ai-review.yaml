    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasm, from the HAMAP rule and UniProt subcellular location.
    action: ACCEPT
    reason: The protein is soluble, with no signal peptide or transmembrane segment, and its substrates
      (octanoyl-ACP of type II fatty acid synthesis and the lipoyl domains of the soluble 2-oxoacid dehydrogenase
      E2 subunits and GcvH) are cytoplasmic. No more specific location row exists for this gene, so cytoplasm
      is as precise as the evidence allows and is the location of the core activity, as for the E. coli
      and B. subtilis orthologs.
