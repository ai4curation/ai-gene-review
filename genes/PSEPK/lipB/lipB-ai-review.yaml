id: Q88DM4
gene_symbol: lipB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: lipB encodes the octanoyltransferase that initiates endogenous protein lipoylation. It transfers
  an octanoyl group from octanoyl-acyl carrier protein to a conserved lysine in lipoyl domains, producing
  the protein-bound octanoyl intermediate that LipA converts to the mature lipoyl cofactor.
existing_annotations:
