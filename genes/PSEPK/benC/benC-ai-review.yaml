- term:
    id: GO:0043639
    label: benzoate catabolic process
  evidence_type: IC
  original_reference_id: PMID:12534466
  review:
    summary: BenC supplies reducing equivalents to the BenABC benzoate dioxygenase system, which initiates benzoate catabolism by hydroxylation.
    action: NEW
    reason: >-
      The ben genes are mapped to benzoate catabolism in KT2440, and BenC is the electron-transfer component of the BenABC hydroxylating dioxygenase. This row originally proposed GO:0043640 (benzoate catabolic process via hydroxylation), which is obsolete in the GO release 2026-07-26 with replaced_by GO:0043639; the hydroxylation route is carried by the MF.
    supported_by:
