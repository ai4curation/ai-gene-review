id: Q88I38
gene_symbol: benC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: benC encodes the electron-transfer component of the BenABC benzoate 1,2-dioxygenase system. It is a ferredoxin-NAD+ reductase/[2Fe-2S] protein that supplies reducing equivalents to the terminal dioxygenase components, enabling the first hydroxylating step of benzoate catabolism in KT2440.
