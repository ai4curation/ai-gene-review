suggested_questions:
- question: Should GO distinguish class IB ring-hydroxylating dioxygenase reductases like BenC, whose FAD/[2Fe-2S] chain transfers electrons directly to the oxygenase component, from reductases that reduce a discrete ferredoxin partner?
  experts:
  - GO molecular function curators
- question: What are the kinetic electron-transfer parameters between KT2440 BenC and the BenAB oxygenase component?
  experts:
  - Ring-hydroxylating dioxygenase biochemists
suggested_experiments:
- description: Reconstitute BenABC with purified BenC and measure NADH-dependent benzoate cis-diol formation while varying BenC concentration and redox-active cluster mutants.
  experiment_type: enzyme kinetics assay
