- id: PMID:11053377
  title: BenR, a XylS homologue, regulates three different pathways of aromatic acid degradation in Pseudomonas putida.
  findings:
  - statement: The abstract identifies benABC as likely encoding benzoate dioxygenase genes.
- id: PMID:12534466
  title: Genomic analysis of the aromatic catabolic pathways from Pseudomonas putida KT2440
  findings:
  - statement: KT2440 pathway mapping places the ben genes in benzoate catabolism.
- id: file:PSEPK/benC/benC-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: benC (PP_3163; UniProt Q88I38) in Pseudomonas putida KT2440'
  findings:
  - statement: |-
      **BenC is the electron-transfer (reductase) component** of the multicomponent benzoate 1,2-dioxygenase system encoded in the **ben gene cluster**
  - statement: |-
      BenC** is the **electron transfer component** (reductase) that delivers reducing equivalents required for oxygen activation and substrate dihydroxylation by the oxygenase component
  - statement: |-
      the associated **reductase component** is **monomeric** and contains **FAD** and a **plant-type [2Fe-2S]** cluster—i.e., an electron-transfer module consistent with BenC’s role
  - statement: |-
      an N-terminal **[2Fe-2S] ferredoxin-like domain**, a **FAD-binding domain**, and a C-terminal **NAD(H)-binding domain**
  - statement: |-
      benD** encodes a **benzoate diol dehydrogenase** that converts the benzoate cis-dihydrodiol product into **catechol**
  - statement: |-
      BenC is most consistent with a **cytosolic (intracellular) enzyme** associated functionally with the benzoate dioxygenase complex
- id: file:PSEPK/benC/benC-deep-research-openscientist.md
  title: OpenScientist gene research report for benC
  findings:
  - statement: The report supports the EC split between intrinsic BenC reductase
      chemistry and contribution to the BenABC benzoate 1,2-dioxygenase complex.
    supporting_text: >-
      **benC** (UniProt **Q88I38**; ordered locus **PP_3163**) in *Pseudomonas
      putida* strain KT2440 encodes the **soluble, cytoplasmic reductase
      (electron-transfer) component of benzoate 1,2-dioxygenase**.
  - statement: The report notes that BenC delivers electrons directly to the
      terminal BenAB oxygenase rather than to a discrete ferredoxin acceptor.
    supporting_text: deliver them **directly to the terminal oxygenase**
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: OpenScientist sidecar supports BenC/PP_3163 as the soluble BenABC reductase that uses FAD and a 2Fe-2S cluster to pass NADH-derived electrons directly to the terminal BenAB oxygenase, distinguishing BenC's intrinsic reductase chemistry from contribution to the overall benzoate 1,2-dioxygenase reaction.
