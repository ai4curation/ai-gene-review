  label: Pseudomonas putida KT2440
description: MnmA (PP_4014) is the single tRNA-specific 2-thiouridylase of Pseudomonas putida KT2440,
  an ATP-dependent PP-loop enzyme of the MnmA/TRMU family (HAMAP MF_00144). By orthology to Escherichia
  coli MnmA it adenylates uridine 34 of substrate tRNAs and incorporates sulfur delivered by the IscS-TusA-TusBCD-TusE
  relay, using conserved catalytic cysteines (Cys108 and Cys204), to form 2-thiouridine at the wobble
  position.
