taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MnmA is an ATP-dependent tRNA-uridine 2-sulfurtransferase that catalyzes
  formation of 2-thiouridine at wobble position U34 in substrate tRNAs. It is
  the terminal enzyme of the IscS-TusA-TusBCD-TusE sulfur relay.
