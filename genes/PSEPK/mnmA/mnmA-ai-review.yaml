id: Q88FR9
gene_symbol: mnmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: MnmA is an ATP-dependent tRNA-uridine 2-sulfurtransferase that activates the wobble uridine
  U34 and catalyzes its C2 thiolation. The KT2440 enzyme has the conserved MnmA ATP-utilizing and catalytic
  architecture and is predicted to receive sulfur supplied through the IscS–Tus relay in the cytosol.
  The precise terminal sulfur-transfer mechanism and any Fe-S cofactor requirement have not been established
  for this enzyme.
