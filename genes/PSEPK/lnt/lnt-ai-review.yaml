  review:
    summary: This is the most specific current GO molecular-function term available for Lnt's phospholipid-dependent
      acyl transfer reaction.
    action: ACCEPT
    reason: Lnt transfers a phospholipid-derived acyl group to the free alpha-amino group of a diacylglyceryl-modified
      cysteine. Target Lnt-specific family architecture and conserved functional residues support this
      reaction by comparison with characterized E. coli/P. aeruginosa enzymes. Fresh QuickGO confirms
      GO:0016410 is obsolete. GO:0140186 instead specifies acyl-CoA-dependent lysine-N6 acylation and
      is not a suitable refinement; retain the valid acyltransferase class with the exact reaction in
      core_functions and a proposed specific term.
