proposed_new_terms:
- proposed_name: apolipoprotein N-acyltransferase activity
  proposed_definition: Catalysis of the phospholipid-dependent N-acylation of the N-terminal S-diacylglyceryl-L-cysteine
    of a bacterial lipoprotein.
  justification: GO:0016747 is the best valid current parent term, but it does not capture Lnt's defined
    lipoprotein acceptor, phospholipid donor, or EC 2.3.1.269 reaction. The formerly used GO:0016410 N-acyltransferase
    activity is obsolete.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: file:PSEPK/lnt/lnt-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the phospholipid dependent N-acylation of the N-terminal cysteine of apolipoprotein
  - reference_id: file:PSEPK/lnt/lnt-uniprot.txt
