- id: file:PSEPK/lnt/lnt-deep-research-openscientist.md
  title: OpenScientist gene research for lnt
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Genuine existing provider research reused as a literature lead. Primary assay organisms
      and frozen target features were independently checked in the source consultation. Generic essentiality,
      universal pathway order, exact donor preferences and predicted structural geometry are not treated
      as KT2440 measurements. Its sequence claims are independently qualified by the parameter-sensitive
      alignment panel.
  findings:
  - statement: OpenScientist supports Lnt as the final proteobacterial lipoprotein N-acylation enzyme
      and notes that direct KT2440-specific biochemical evidence remains inferential from close orthologs.
- id: file:analysis/module_audits/bacterial_lipoprotein_maturation/psepk-consultation/evidence.md
  title: PSEPK lipoprotein maturation source and sequence consultation
  findings:
  - statement: Frozen target identities, source assay organisms, current ontology and independent sequence
      checks distinguish conserved chemistry from native KT2440 assays.
    supporting_text: No target-specific assay or essentiality conclusion follows from this identity check.
- id: PMID:21676878
  title: Kinetics and phospholipid specificity of apolipoprotein N-acyltransferase.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached Results read. PE preference is not exclusivity; PG/PA donation and quantitative
      E. coli parameters are not transferred to KT2440.
  findings:
  - statement: Purified E. coli Lnt uses a phospholipid acyl donor and diacylglyceryl-modified acceptor
      in a two-step reaction; donor headgroup and acyl chains affect activity.
    supporting_text: strongly affected by the phospholipid headgroup and acyl chain composition.
- id: PMID:28675161
  title: Structural insights into the mechanism of the membrane integral N-acyltransferase step in bacterial
    lipoprotein synthesis.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached Results read. This is Wiktor et al.; target topology is inferred rather
      than experimentally solved.
  findings:
  - statement: P. aeruginosa and E. coli Lnt structures place a periplasm-facing catalytic domain on an
      integral membrane domain.
    supporting_text: 'The active site resides above the membrane interface where

      the domains meet facing into the periplasm.'
