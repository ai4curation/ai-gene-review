taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Lnt (PP_4790) is an integral inner-membrane apolipoprotein N-acyltransferase. It transfers
  a phospholipid-derived acyl chain to the free alpha-amino group of the N-terminal S-diacylglyceryl cysteine
  after signal-peptide removal, producing a triacylated lipoprotein. The Lnt-family architecture and conserved
  catalytic residues support this function in Pseudomonas putida KT2440; its native donor preferences
  and substrate repertoire remain unmeasured in the consulted sources.
