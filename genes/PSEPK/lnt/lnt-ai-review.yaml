suggested_questions:
- question: Should GO add an apolipoprotein N-acyltransferase activity term for Lnt/EC 2.3.1.269 now that
    GO:0016410 is obsolete?
- question: Is PP_4790 essential under standard KT2440 growth conditions, and how does partial Lnt depletion
    affect outer-membrane lipoprotein localization?
- question: Which KT2440 lipoprotein substrates are most sensitive to loss of Lnt-mediated N-acylation?
suggested_experiments:
- description: Compare wild-type and conditional lnt-depletion KT2440 envelope fractions by lipoproteomics
    to identify substrates that accumulate as non-N-acylated intermediates or mislocalize.
  experiment_type: conditional depletion and envelope proteomics
- description: Reconstitute PP_4790 with diacylglyceryl lipoprotein substrate and glycerophospholipid
    acyl donors to measure N-acyltransferase activity and donor preference.
  experiment_type: in vitro enzyme assay
