id: Q88E01
gene_symbol: mmsA-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MmsA-II is a CoA-acylating methylmalonate-semialdehyde dehydrogenase. In the
  distal valine route it oxidatively decarboxylates methylmalonate semialdehyde
  with NAD+ and coenzyme A to form propionyl-CoA. Its adjacency to mmsB supports
  this valine-catabolic role; possible use in other semialdehyde pathways
  remains less securely assigned for this paralog.
existing_annotations:
- term:
    id: GO:0004491
    label: methylmalonate-semialdehyde dehydrogenase (acylating, NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the specific EC 1.2.1.27 activity assigned to Q88E01.
    action: ACCEPT
    reason: >-
      The exact record and methylmalonate-semialdehyde-dehydrogenase family
      assignment support the CoA-acylating NAD+-dependent reaction.
    supported_by:
    - reference_id: file:PSEPK/mmsA-II/mmsA-II-uniprot.txt
      supporting_text: Full=methylmalonate-semialdehyde dehydrogenase (CoA acylating)
- term:
    id: GO:0006210
    label: thymine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The TreeGrafter thymine-catabolism transfer is an unsupported pathway over-annotation for this MmsA paralog.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Methylmalonate-semialdehyde dehydrogenases can accept related
      semialdehydes, but the local record provides no Q88E01-specific pathway
      evidence. The species-aware OpenScientist analysis assigns Q88E01 as the
      valine-arm copy because it is adjacent to mmsB, while the paralogous
      mmsA-I is genomically separate. The broad transfer is therefore not used
      as a core pathway role.
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-branched-chain-amino-acid-catabolism__ppu00280-deep-research-openscientist.md
      supporting_text: >-
        **Assign mmsA-II/PP_4667** to the valine arm.
