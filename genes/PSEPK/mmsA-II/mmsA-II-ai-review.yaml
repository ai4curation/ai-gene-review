  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: MmsA-II produces propionyl-CoA at the distal end of L-valine catabolism.
    action: ACCEPT
    reason: >-
      The specific EC/family assignment and adjacency to mmsB support the
      methylmalonate-semialdehyde step of the valine route.
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-branched-chain-amino-acid-catabolism__ppu00280-deep-research-openscientist.md
      supporting_text: "**Assign mmsA-II/PP_4667** to the valine arm."
- term:
