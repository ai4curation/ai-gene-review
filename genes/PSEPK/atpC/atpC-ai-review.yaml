id: Q88BX5
gene_symbol: atpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase epsilon subunit, a nucleotide-binding central-stalk component that associates with gamma and the c-ring to transmit and regulate rotary coupling between F0 and F1.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: >-
        ATP binding by the epsilon C-terminal domain is a real but lineage-restricted
        property, and it is not established for Pseudomonas; retained as non-core with
        a taxonomic caveat rather than promoted.
      action: KEEP_AS_NON_CORE
      reason: >-
        Regulatory ATP binding by the epsilon CTD is characterized in thermophilic
        Bacillus PS3, Bacillus subtilis and Mycobacterium, but is absent in Escherichia
        coli and has not been demonstrated in Pseudomonas. The reviewed UniProt record
        for Q88BX5 carries no ATP-binding or Nucleotide-binding keyword and no FT BINDING
        feature, and the annotation is an electronic transfer (ECO:0000256,
        UniRule:UR000037425) over a family spanning both binding and non-binding
        epsilons. The term is therefore not wrong at family level but cannot carry
        epsilon's core molecular function in this organism.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpC is a peripheral component of the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate although epsilon is not membrane-spanning.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AtpC contributes central-stalk coupling and regulation during ATP synthesis at the plasma membrane.
      action: MODIFY
      reason: >-
        The process is right but the term is the general parent. P. putida F0F1 is a
        plasma-membrane enzyme, so the plasma-membrane-specific child GO:0042777 is the
        accurate placement. GOA already carries GO:0042777 for atpB and atpG; applying it
        across all eight subunits makes the operon agree on one term for one identical
        process instead of splitting between parent and child by accident of which
        UniRule fired.
      proposed_replacement_terms:
        - id: GO:0042777
          label: proton motive force-driven plasma membrane ATP synthesis
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpC is the epsilon subunit of F1 and the central stalk.
      action: ACCEPT
      reason: This correctly records direct complex membership.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Epsilon contributes to rotary coupling but does not independently catalyze proton-driven ATP synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity belongs to the assembled F0F1 complex and should be represented as a contribution.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000104
    title: Electronic Gene Ontology annotations created by transferring manual GO annotations between related proteins based on shared sequence features
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/atpC/atpC-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida AtpC (Q88BX5)
    findings:
      - statement: UniProt identifies AtpC as the epsilon subunit of the F1 sector.
core_functions:
  - description: >-
      Forms the epsilon component of the central stalk and contributes regulated rotary
      coupling to proton-driven ATP synthesis. No subunit-autonomous molecular function
      is asserted: regulatory ATP binding by the epsilon C-terminal domain is documented
      in other bacterial lineages but not in Pseudomonas, so it is retained as a non-core
      annotation rather than as epsilon's core activity here.
    contributes_to_molecular_function:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    directly_involved_in:
      - id: GO:0042777
        label: proton motive force-driven plasma membrane ATP synthesis
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    supported_by:
      - reference_id: file:PSEPK/atpC/atpC-uniprot.txt
        supporting_text: Produces ATP from ADP in the presence of a proton gradient across the membrane.
