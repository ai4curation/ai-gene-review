  - id: file:PSEPK/atpA/atpA-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida AtpA (Q88BX2)
    findings:
      - statement: >-
          The complex-level SUBUNIT description places the epsilon chain, together with gamma, in
          the central stalk that attaches CF(1) to CF(0).
        supporting_text: >-
          CF(1) is attached to CF(0) by a central stalk formed by the gamma and epsilon chains,
          while a peripheral stalk is formed by the delta and b chains.
  - id: file:PSEPK/atpH/atpH-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida AtpH (Q88BX1)
    findings:
      - statement: >-
          The complex-level FUNCTION description attributes the coupling of ATP synthesis to proton
          translocation to rotation of the central-stalk subunits.
        supporting_text: >-
          During catalysis, ATP synthesis in the catalytic domain of F(1) is coupled via a rotary
          mechanism of the central stalk subunits to proton translocation.
core_functions:
  - description: >-
      Forms, with the gamma chain, the central stalk that attaches the F1 (CF(1)) catalytic core
      to the F0 proton channel, and so contributes the rotary coupling by which proton
      translocation drives ATP synthesis in the plasma-membrane F0F1 complex. Epsilon has no
      catalytic activity of its own; the ATP synthase activity belongs to the assembled complex.
    contributes_to_molecular_function:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    directly_involved_in:
      - id: GO:0042777
        label: proton motive force-driven plasma membrane ATP synthesis
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    supported_by:
      - reference_id: file:PSEPK/atpC/atpC-uniprot.txt
        supporting_text: "CF(1) has five subunits: alpha(3), beta(3), gamma(1), delta(1), epsilon(1)."
      - reference_id: file:PSEPK/atpA/atpA-uniprot.txt
        supporting_text: >-
          CF(1) is attached to CF(0) by a central stalk formed by the gamma and epsilon chains,
          while a peripheral stalk is formed by the delta and b chains.
      - reference_id: file:PSEPK/atpH/atpH-uniprot.txt
        supporting_text: >-
          During catalysis, ATP synthesis in the catalytic domain of F(1) is coupled via a rotary
          mechanism of the central stalk subunits to proton translocation.
      - reference_id: file:PSEPK/atpC/atpC-uniprot.txt
        supporting_text: Produces ATP from ADP in the presence of a proton gradient across the membrane.
