      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: The bacterial epsilon subunit has a conserved nucleotide-binding regulatory role.
      action: ACCEPT
      reason: The family-based transfer supports a direct subunit property rather than whole-complex catalysis.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpC is a peripheral component of the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate although epsilon is not membrane-spanning.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AtpC contributes central-stalk coupling and regulation during ATP synthesis.
      action: ACCEPT
      reason: This is the principal process of the complex containing epsilon.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpC is the epsilon subunit of F1 and the central stalk.
      action: ACCEPT
      reason: This correctly records direct complex membership.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Epsilon contributes to rotary coupling but does not independently catalyze proton-driven ATP synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity belongs to the assembled F0F1 complex and should be represented as a contribution.
