  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase epsilon subunit, a nucleotide-binding central-stalk component that associates with gamma and the c-ring to transmit and regulate rotary coupling between F0 and F1.
existing_annotations:
