id: Q88BX5
gene_symbol: atpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  ATP synthase epsilon chain, one of the five subunits of the F1 (CF(1)) catalytic sector of the
  plasma-membrane F0F1 ATP synthase, the enzyme that produces ATP from ADP using the proton
  gradient across the inner membrane. Together with the gamma chain, epsilon forms the central
  stalk that attaches F1 to the F0 proton channel, and rotation of these central-stalk subunits
  is what couples proton translocation through F0 to ATP synthesis in F1. Epsilon is a peripheral
  membrane protein with no catalytic activity of its own, acting only as a component of the
  assembled complex.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: >-
        Nucleotide binding is not established for this protein; retained as non-core with
        a taxonomic caveat rather than promoted to epsilon's core molecular function.
      action: KEEP_AS_NON_CORE
      reason: >-
        This is an electronic annotation (ECO:0000256, UniRule:UR000037425) propagated
        across the ATPase epsilon chain family. The reviewed UniProt record for Q88BX5
        carries no ATP-binding or Nucleotide-binding keyword and no FT BINDING feature,
        so there is no organism-specific support for nucleotide binding by this protein.
        Regulatory ATP binding by the epsilon C-terminal domain has been reported for
        epsilon subunits in other bacteria, but no such evidence is cited in this review
        for Pseudomonas putida. The term is therefore not wrong at family level but
        cannot carry epsilon's core molecular function here.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpC is a peripheral component of the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate although epsilon is not membrane-spanning.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AtpC contributes central-stalk rotary coupling during ATP synthesis at the plasma membrane.
      action: MODIFY
      reason: >-
        The process is right but the term is the general parent. P. putida F0F1 is a
        plasma-membrane enzyme, so the plasma-membrane-specific child GO:0042777 is the
        accurate placement. GOA already carries GO:0042777 for atpB and atpG; applying it
        across all eight subunits makes the operon agree on one term for one identical
        process instead of splitting between parent and child by accident of which
        UniRule fired.
      proposed_replacement_terms:
        - id: GO:0042777
          label: proton motive force-driven plasma membrane ATP synthesis
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpC is the epsilon subunit of F1 and, with gamma, of the central stalk.
      action: ACCEPT
      reason: This correctly records direct complex membership.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Epsilon contributes to the complex's rotational ATP synthase activity but does not independently catalyze proton-driven ATP synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity belongs to the assembled F0F1 complex and should be represented as a contribution.
