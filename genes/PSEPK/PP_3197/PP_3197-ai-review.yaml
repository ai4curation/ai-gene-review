id: Q88I05
gene_symbol: PP_3197
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3197 encodes a predicted VOC-superfamily dioxygenase in the KT2440
  flavonoid-degradation locus. Orthology and conserved locus organization
  identify it as an FdeC-like enzyme predicted to cleave the A-ring of the
  trihydroxyflavanone produced during naringenin catabolism. The target protein
  has not been characterized directly, so its exact substrate, product, and
  catalytic metal remain unverified in P. putida.
existing_annotations:
- term:
    id: GO:0051213
    label: dioxygenase activity
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_3197/PP_3197-deep-research-openscientist.md
  qualifier: enables
  review:
    summary: PP_3197 is predicted to be an FdeC-like flavonoid ring-cleavage dioxygenase.
    action: NEW
    reason: >-
      KEGG assigns PP_3197 to FdeC orthology group K26181, and the report finds
      strong whole-protein similarity to the experimentally characterized
      Herbaspirillum FdeC. GO lacks a term for the exact naringenin-intermediate
      A-ring cleavage, so the supported parent dioxygenase activity is used.
    supported_by:
    - reference_id: file:PSEPK/PP_3197/PP_3197-deep-research-openscientist.md
      supporting_text: >-
        KEGG orthology places PP_3197 in ortholog group **K26181 (fdeC)** and
        assigns it reaction **R13075** within pathway **ppu00946 / map00946
        ("Degradation of flavonoids")**.
    - reference_id: PMID:27059806
      supporting_text: that is subsequently dioxygenated and cleaved at the A-ring by the FdeC
