suggested_questions:
- question: >-
    Does PP_3197 catalyze KEGG reaction R13075 on the FdeE-generated
    trihydroxyflavanone in KT2440, and which divalent metal supports turnover?
suggested_experiments:
- description: >-
    Purify PP_3197 and assay the FdeE-generated trihydroxyflavanone with oxygen
    and a divalent-metal panel, identifying the ring-cleavage product by
    LC-MS/MS.
  experiment_type: biochemical reconstitution and product analysis
- description: >-
    Compare wild type, a PP_3197 deletion, and a complemented strain during
    growth on naringenin, measuring substrate use and accumulation of the
    trihydroxyflavanone intermediate.
  experiment_type: genetics and targeted metabolomics
