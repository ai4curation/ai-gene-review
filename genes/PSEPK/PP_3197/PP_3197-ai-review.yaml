knowledge_gaps:
- gap_statement: >-
    PP_3197's exact physiological substrate, ring-cleavage product, and
    catalytic metal have not been measured in KT2440.
  boundary: >-
    Orthology, locus context, and sequence conservation support an FdeC-like
    extradiol dioxygenase, but all substrate-specific chemistry is transferred
    from Hsero_1005 and KEGG R13075.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Direct evidence is required before assigning a future substrate-specific GO
    molecular-function term to PP_3197 experimentally.
  resolution: >-
    Reconstitute PP_3197 with its proposed substrate and identify product and
    metal dependence, then test a native deletion for intermediate accumulation.
  provenance:
  - reference_id: file:PSEPK/PP_3197/PP_3197-deep-research-openscientist.md
    supporting_text: No direct experimental characterization of PP_3197 itself.
- gap_statement: >-
    The electron-transfer relationship between PP_3198/FdeD and the upstream
    monooxygenase candidate PP_3199/FdeE remains untested in KT2440.
  boundary: >-
    The paired FdeD/FdeE assignment belongs to the preceding hydroxylation
    reaction and must not be treated as evidence that PP_3198 is a redox partner
    for PP_3197.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: >-
    Reconstitute PP_3198 and PP_3199 together and test naringenin hydroxylation
    independently of the downstream PP_3197 reaction.
  provenance:
  - reference_id: file:PSEPK/PP_3197/PP_3197-deep-research-openscientist.md
    supporting_text: The role of the adjacent FdeD ferredoxin (PP_3198) as a redox partner is plausible but untested for the *P. putida* cluster.
suggested_questions:
- question: >-
    Does PP_3197 catalyze KEGG reaction R13075 on the FdeE-generated
    trihydroxyflavanone in KT2440, and which divalent metal supports turnover?
suggested_experiments:
- description: >-
    Purify PP_3197 and assay the FdeE-generated trihydroxyflavanone with oxygen
    and a divalent-metal panel, identifying the ring-cleavage product by
    LC-MS/MS.
  experiment_type: biochemical reconstitution and product analysis
- description: >-
    Compare wild type, a PP_3197 deletion, and a complemented strain during
    growth on naringenin, measuring substrate use and accumulation of the
    trihydroxyflavanone intermediate.
  experiment_type: genetics and targeted metabolomics
