proposed_new_terms:
- proposed_name: naringenin-intermediate A-ring extradiol dioxygenase activity
  proposed_definition: >-
    Catalysis of the incorporation of both atoms of molecular oxygen during
    extradiol cleavage of the A-ring of
    5,7,8-trihydroxy-2-(4-hydroxyphenyl)-2,3-dihydro-4H-chromen-4-one.
  justification: >-
    KEGG reaction R13075 and the FdeC mutant study define this substrate-specific
    cleavage, whereas GO:0016702 captures only the general two-oxygen-atom
    incorporation mechanism.
  proposed_parent:
    id: GO:0016702
    label: oxidoreductase activity, acting on single donors with incorporation of molecular oxygen, incorporation of two atoms of oxygen
  supported_by:
