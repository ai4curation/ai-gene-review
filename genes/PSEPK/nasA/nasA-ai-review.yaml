  label: Pseudomonas putida KT2440
description: NasA (PP_2092) is a major facilitator superfamily nitrate/nitrite porter-family protein
  in the plasma membrane of Pseudomonas putida KT2440. Its predicted twelve transmembrane helices
  form a nitrate uptake system supporting nitrate assimilation. Native pooled-mutant fitness is strongest
  for nitrate utilization; nitrite transport and the energetic coupling mechanism remain unresolved.
