id: Q88HH8
gene_symbol: kguE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Conserved kgu-operon protein with an IolE/XylA/MocC-like isomerase fold. KguE
  contributes to efficient 2-ketogluconate utilization in Pseudomonas, but its
  substrate and reaction are unresolved. PP_3376/KguD, not KguE, is the supported
  candidate for reduction of 2-dehydro-6-phosphogluconate to 6-phosphogluconate.
existing_annotations:
  - term: {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: The annotation is an EC mapping attached to an unreviewed epimerase product string, while KguE chemistry remains experimentally unresolved.
      action: REMOVE
      reason: >-
        Direct pathway order identifies KguD as the reductase; KguE should not receive the same exact
        activity without biochemical evidence. The fold also rules it out: every signature places KguE in
        the metal-dependent xylose-isomerase-like TIM barrel family (IPR050312, Gene3D 3.20.20.150,
        SSF51658), with no Rossmann NAD(P)-binding domain, whereas EC 1.1.1.43 is a Rossmann-fold
        dehydrogenase reaction. An independent OpenScientist run found no oxidoreductase among the
        reviewed members of IPR050312.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: However, the reaction KguE exactly catalyzes remains to be studied.
        - reference_id: file:PSEPK/kguE/kguE-uniprot.txt
          supporting_text: IPR050312; IolE/XylAMocC-like.
        - reference_id: file:PSEPK/kguE/kguE-hypotheses/function-hypothesis-go-0008114/openscientist.md
          supporting_text: zero oxidoreductases** — the family is exclusively EC class 4 (lyases/dehydratases) and class 5 (isomerases/epimerases)
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: Cross-species deletion and complementation show that KguE contributes to 2-ketogluconate utilization despite unresolved chemistry.
      action: NEW
      reason: The process annotation captures the demonstrated pathway role without inventing a molecular function.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: This study proved for the first time that KguE did participate in 2KGA metabolism in Pseudomonas.
references:
  - {id: "GO_REF:0000003", title: Gene Ontology annotation based on Enzyme Commission mapping}
  - id: PMID:39770733
    title: Characterization and Transcriptional Regulation of the 2-Ketogluconate Utilization Operon in Pseudomonas plecoglossicida.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cross-species deletion/complementation links KguE to 2-ketogluconate utilization while explicitly leaving its reaction unknown.
  - {id: "file:PSEPK/kguE/kguE-uniprot.txt", title: UniProt record for KguE (Q88HH8)}
  - {id: "file:PSEPK/kguE/kguE-notes.md", title: Manual evidence reconciliation for KguE}
  - id: file:PSEPK/kguE/kguE-hypotheses/function-hypothesis-go-0008114/openscientist.md
    title: OpenScientist hypothesis report for kguE phosphogluconate 2-dehydrogenase activity
    publication_type: DEEP_RESEARCH
    findings:
    - statement: >-
        OpenScientist refuted the EC 1.1.1.43 assignment on fold grounds; KguE is a xylose-isomerase-like TIM-barrel protein.
      supporting_text: 'zero oxidoreductases** — the family is exclusively EC class 4 (lyases/dehydratases) and class 5 (isomerases/epimerases)'
core_functions:
  - description: Optional or accessory kgu-locus protein associated with efficient 2-ketogluconate utilization; exact molecular function remains unknown.
    directly_involved_in:
      - {id: "GO:0019521", label: D-gluconate metabolic process}
    supported_by:
      - reference_id: PMID:39770733
        supporting_text: However, the reaction KguE exactly catalyzes remains to be studied.
proposed_new_terms:
  - proposed_name: 2-dehydro-D-gluconate catabolic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the breakdown of
      2-dehydro-D-gluconate, including its conversion to 6-phospho-D-gluconate.
    justification: >-
      KguE is genetically required for efficient 2-dehydro-D-gluconate use even
      though its reaction is unresolved; GO:0019521 does not distinguish this
      substrate-specific pathway.
    proposed_parent: {id: "GO:0072329", label: monocarboxylic acid catabolic process}
suggested_questions:
  - question: Which metabolite and stereochemical transformation, if any, is catalyzed by KT2440 KguE?
suggested_experiments:
  - description: Purify Q88HH8 and assay 2-ketogluconate-pathway intermediates, paired with KT2440 deletion, complementation, and metabolomics.
