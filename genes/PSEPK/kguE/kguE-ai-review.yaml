id: Q88HH8
gene_symbol: kguE
product_type: PROTEIN
status: COMPLETE
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain KT2440)}
description: >-
  Conserved kgu-operon protein with an IolE/XylA/MocC-like isomerase fold. KguE
  is associated with 2-ketogluconate utilization in Pseudomonas, but its substrate
  and reaction are unresolved. PP_3376/KguD, not KguE, is the supported candidate
  for reduction of 2-dehydro-6-phosphogluconate to 6-phosphogluconate.
existing_annotations: []
references:
  - id: PMID:39770733
    title: Characterization and Transcriptional Regulation of the 2-Ketogluconate Utilization Operon in Pseudomonas plecoglossicida.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Cross-species deletion/complementation evidence links KguE to 2-ketogluconate utilization but does not establish its biochemical reaction.
  - id: file:genes/PSEPK/kguE/kguE-uniprot.txt
    title: UniProt record for KguE (Q88HH8)
core_functions:
  - description: >-
      Optional or accessory kgu-locus protein associated with efficient
      2-ketogluconate utilization; exact molecular function remains unknown.
proposed_new_terms: []
suggested_questions:
  - question: Which metabolite and stereochemical transformation, if any, is catalyzed by KT2440 KguE?
suggested_experiments:
  - description: >-
      Purify Q88HH8 and assay a targeted panel of 2-ketogluconate-pathway
      intermediates, paired with KT2440 deletion, complementation, and metabolomics.
