  review:
    summary: An export signal and SsuA solute-binding architecture support periplasmic localization.
    action: NEW
    reason: The target has an independently predicted SignalP export peptide and SsuA-specific NCBIfam/CDD
      classification. Together with the characterized importer architecture these support the existing
      periplasmic ISS proposal. ARBA-only CC localization and family prose are not independent evidence;
      export alone would not distinguish periplasm from extracellular secretion without the solute-binding
      context.
