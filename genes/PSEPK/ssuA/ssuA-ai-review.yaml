  review:
    summary: SsuA provides substrate capture for the SsuABC complex but does not independently translocate alkanesulfonate.
    action: NEW
    reason: >-
      Genetic analysis established SsuABC as a non-interchangeable alkanesulfonate
      uptake system. Q88R96 belongs to the joint SsuA/TauA solute-binding family,
      but its position at PP_0237 in the syntenic ssuEADCB cluster, beside ssuD
      rather than the separate KT2440 tau locus, resolves it as SsuA. The specific
      ISS comparator is E. coli SsuA P75853.
