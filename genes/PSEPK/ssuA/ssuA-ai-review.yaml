references:
- id: file:PSEPK/ssuA/ssuA-uniprot.txt
  title: UniProt record Q88R96 for KT2440 ssuA
  findings:
  - statement: Specific functional-family classification supports the subunit or enzyme assignment; names,
      EC labels and GO lines are not functional proof.
    record_section: ["DR:NCBIfam"]
    supporting_text: NCBIfam; TIGR01728; SsuA_fam; 1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ARBA-only CC function/location/similarity claims are excluded; independent NCBIfam/CDD
      and SignalP support the inference.
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  findings:
  - statement: S-313 genetics separates sulfonate growth from essentiality of particular transporter or
      reductase components.
    supporting_text: 'The flavin reductase SsuE was not required for growth with

      aliphatic sulfonates or methionine'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected, including deletion complementation and extract assays.
      S-313 is a different strain; SsuA dispensability and polar effects prevent treating locus phenotypes
      as proof of every individual subunit.
  full_text_unavailable: false
- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: E. coli deletion/complementation supports SsuABC transport and shows noninterchangeable
      Ssu/Tau components.
    supporting_text: the individual components of the two transport systems were not functionally exchangeable
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed cache is abstract-only; full article inspected in the separately cached PMC URL.
      Native E. coli genetic evidence is transferred as qualified homolog support.
  full_text_unavailable: true
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC101965/
  title: Deletion Analysis of the Escherichia coli Taurine and Alkanesulfonate Transport Systems
  findings:
  - statement: The study combines gene deletions and complementation with comparative architecture; stoichiometry
      and topology are inferred rather than structurally measured.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article corresponding to PMID:10781534, including Methods and Discussion.
      Its signal/ABC-domain reasoning is not a KT2440 localization or individual ATPase assay.
- id: url:https://backend.orbit.dtu.dk/ws/files/406857921/PhD_Thesis_-_Garret_William_O_Connell.pdf
  title: https://backend.orbit.dtu.dk/ws/files/406857921/PhD_Thesis_-_Garret_William_O_Connell.pdf
  findings:
  - statement: Native KT2440 combined ssuBC deletion affects growth on selected sulfonates; individual
      SsuA, SsuB, SsuC and SsuE activities are not isolated by this design.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Garret William O'Connell, Refactoring native metabolism in Pseudomonas putida towards
      production and incorporation of novel fluorinated building blocks (DTU doctoral thesis, 2024), chapter
      1. Methods, strain tables, Results, Figure 4 (PDF pages 37-38) and locus map inspected. The chapter
      was a manuscript in preparation at thesis submission; no journal version was established. Growth
      is a composite fitness score, not direct transport flux. Possible sulfate contamination affects
      some substrate conditions, so no broad PFAS or arylsulfonate activity is inferred.
