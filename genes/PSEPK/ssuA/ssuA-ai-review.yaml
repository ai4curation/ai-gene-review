taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SsuA is the exported periplasmic substrate-binding subunit of the SsuABC
  alkanesulfonate importer. It captures aliphatic sulfonates and presents them
  to the SsuC membrane permease for ATP-coupled import driven by SsuB. The
  KT2440 assignment is supported by its signal peptide, SsuA-family domains,
  exact gene-cluster context, and characterized bacterial SsuABC systems.
