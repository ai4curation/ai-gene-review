  review:
    summary: ssuA performs part of the substrate uptake machinery for alkanesulfonates.
    action: NEW
    reason: 'This retained process proposal is supported by active transport machinery participation:
      SsuA captures substrate, SsuC supplies the membrane path, and SsuB couples ATP hydrolysis. It is
      not a claim based only on a growth requirement. Target classification and the characterized E. coli
      importer support the ISS inference. S-313 transporter redundancy and KT2440 combined-subunit tests
      do not establish universal necessity of an individual gene.'
    supported_by:
