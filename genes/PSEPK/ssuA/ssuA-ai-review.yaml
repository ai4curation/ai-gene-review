suggested_questions:
- question: Which aliphatic sulfonates bind KT2440 SsuA with physiologically relevant affinity, and how
    strongly does it exclude taurine and cysteate?
suggested_experiments:
- description: Purify Q88R96, measure binding to a panel of alkanesulfonates, and test clean ssuA deletion
    and complementation during growth with each compound as the sulfur source.
