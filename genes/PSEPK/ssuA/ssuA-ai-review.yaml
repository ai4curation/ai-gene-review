  label: Pseudomonas putida KT2440
description: SsuA (PP_0237) is the predicted periplasmic substrate-binding component of the SsuABC alkanesulfonate
  importer in Pseudomonas putida KT2440. Its SsuA-family architecture and export signal support capture
  of aliphatic sulfonates for delivery to the SsuC membrane component and ATP-dependent uptake driven
  by SsuB. Substrate range and subunit function are inferred from the transport-family assignment and
  characterized bacterial systems.
