      label: bacterial-type flagellum filament
- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  qualifier: involved_in
  evidence_type: IEA
  review:
    summary: This process term captures the main biological context of FliC. As the polymerizing
      flagellin subunit of the filament, FliC contributes directly to the propeller structure
      required for bacterial-type flagellum-dependent motility.
    action: NEW
    reason: Existing GOA lacks a biological process annotation for the core motility role of
      the flagellar filament.
    supported_by:
    - reference_id: file:PSEPK/fliC/fliC-notes.md
      supporting_text: FliC supports bacterial-type flagellum-dependent cell motility because
        the flagellar filament is the propeller of the bacterial-type flagellum and FliC is
        its polymerizing subunit.
    - reference_id: file:PSEPK/fliC/fliC-notes.md
      supporting_text: In KT2440, deletion of a large flagellar region produced a strain that
        "lacked the protruding polar cords that define flagella in the wild-type P. putida strain
        and was unable of any swimming motility", supporting bacterial-type flagellum-dependent
        cell motility as the relevant process context, although this evidence is system-level
        rather than `fliC`-specific.
    - reference_id: file:PSEPK/fliC/fliC-deep-research-falcon.md
      supporting_text: '**FliC is a structural protein (not an enzyme/transport protein):**
        it polymerizes to form the **flagellar filament**, enabling propulsion during swimming.'
