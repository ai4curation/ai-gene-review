    supported_by:
    - reference_id: file:PSEPK/fliC/fliC-notes.md
      supporting_text: For GO curation, `GO:0005576` extracellular region is too broad for mature
        FliC because the biologically relevant location is the assembled flagellar filament
        rather than generic extracellular space.
    - reference_id: file:PSEPK/fliC/fliC-deep-research-falcon.md
      supporting_text: The filament is described as “a long and thin helical appendage that
        protrudes from the cells,” placing FliC in an **extracellular, surface-exposed polymer**
        attached to the flagellar basal body/hook.
    - reference_id: file:PSEPK/fliC/fliC-deep-research-falcon.md
      supporting_text: Mechanistically, FliC is exported via the fT3SS to the growing tip after
        cap assembly, consistent with extracellular polymerization.
    reason: The filament propeller assignment is supported by the conserved protein architecture
      and comparative flagellar structures. The annotation is assessed for the KT2440 homolog;
      no isolated target-protein experiment is implied.
- term:
    id: GO:0009288
    label: bacterial-type flagellum
  qualifier: located_in
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: FliC occupies the bacterial-type flagellum filament.
    action: MODIFY
    supported_by:
    - reference_id: PMID:39766194
      supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
        FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament
        (FliC or FljB) and the filament cap (FliD)'
    reason: The broader location is sound but the conserved component architecture supports
      this specific flagellar substructure. This is a target-family inference from comparative
