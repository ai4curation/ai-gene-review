- id: file:PSEPK/fliC/fliC-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for PSEPK fliC (Q88ES5)
  findings:
  - supporting_text: '**FliC is a structural protein (not an enzyme/transport protein):** it
      polymerizes to form the **flagellar filament**, enabling propulsion during swimming.'
  - supporting_text: A KT2440 study discussing flagellar regulation explicitly identifies **fliC
      as encoding the major flagellin subunit** and positions its expression among the late
      flagellar genes requiring FliA/σ\28.
  - supporting_text: The filament is described as “a long and thin helical appendage that protrudes
      from the cells,” placing FliC in an **extracellular, surface-exposed polymer** attached
      to the flagellar basal body/hook.
  - supporting_text: Mechanistically, FliC is exported via the fT3SS to the growing tip after
      cap assembly, consistent with extracellular polymerization.
  - supporting_text: A Pseudomonas flagella review reports that a filament can contain **~20,000
      flagellin subunits**.
- id: file:PSEPK/fliC/fliC-uniprot.txt
  title: Frozen UniProt record for PSEPK fliC
  findings: []
- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports
      the homologous role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
      FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC
      or FljB) and the filament cap (FliD)'
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  findings:
  - statement: KT2440 FliC S267C was used to label flagella; the authors report that the substitution
      does not influence motility.
    supporting_text: We used the strain P. putida KT2440 FliCS267C.
