  label: Pseudomonas putida KT2440
description: FliC is the flagellin subunit that polymerizes into the extracellular filament
  of the polar bacterial-type flagellum in Pseudomonas putida KT2440. Its core role is structural
  rather than enzymatic, providing the propeller-like filament required for bacterial-type flagellum-dependent
  motility.
