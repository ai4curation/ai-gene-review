proposed_new_terms:
- proposed_name: structural constituent of bacterial-type flagellum filament
  proposed_definition: The action of a molecule that contributes to the structural integrity
    of the bacterial-type flagellum filament, the external propeller of the bacterial-type flagellum
    assembled primarily from flagellin subunits.
  justification: GO currently offers the generic molecular function term structural molecule
    activity and the cellular component term bacterial-type flagellum filament, but lacks a
    flagellin-specific structural constituent molecular function term.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - reference_id: file:PSEPK/fliC/fliC-notes.md
    supporting_text: GO currently lacks an MF term equivalent to "structural constituent of
      bacterial-type flagellum filament", so `GO:0005198` structural molecule activity is the
      best available molecular function term.
suggested_questions:
- question: Does FliC have any experimentally supported role in surface sensing or biofilm initiation
    in KT2440 beyond being the filament structural subunit?
- question: Are there condition-specific mechanisms that alter FliC export or filament abundance
    during transitions between planktonic and sessile growth?
suggested_experiments:
- description: Construct an in-frame fliC deletion and complementation strain in KT2440, then
    quantify swimming/swarming motility and visualize filament formation by electron microscopy.
  hypothesis: FliC is required to assemble the flagellar filament and thereby support bacterial-type
    flagellum-dependent motility.
  experiment_type: targeted mutant phenotype analysis
- description: Measure secreted and polymerized FliC across planktonic, surface-associated,
    and oxidative-stress conditions using immunoblotting or quantitative proteomics.
  hypothesis: FliC abundance and export are conditionally regulated during the motile-to-sessile
    transition.
  experiment_type: protein localization and abundance profiling
