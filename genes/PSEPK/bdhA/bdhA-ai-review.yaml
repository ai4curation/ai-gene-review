  label: Pseudomonas putida KT2440
description: BdhA (PP_0552) is the NAD-dependent, R-selective butanediol dehydrogenase of Pseudomonas
  putida KT2440. The homotetramer oxidizes (2R,3R)- and meso-2,3-butanediol to acetoin and catalyzes the
  reverse reduction; it also reduces diacetyl to R-acetoin. Native loss of bdhA impairs utilization of
  the R,R and meso isomers, while PedE/PedH provide a distinct route for the S,S isomer. Matched assays
  detected no NADP(H)-supported activity. Its zinc-containing alcohol-dehydrogenase family supplies an
  integral metal-binding site.
