- term:
    id: GO:0045150
    label: acetoin catabolic process
  evidence_type: ISS
  original_reference_id: PMID:7813883
  qualifier: involved_in
  review:
    summary: Native BdhA catalyzes entry into butanediol catabolism by producing acetoin.
    action: MODIFY
    reason: The inherited proposal conflated the coupled pathway with breakdown of acetoin itself. PMID:34513815
      demonstrates PP0552-dependent R,R/meso-butanediol utilization and unchanged growth on acetoin after
      deletion. Replace with butanediol catabolism as a lateral substrate-role correction. Reverse acetoin
      reduction is real biochemical capacity, but does not establish a physiological acetoin-degradation
      role for this protein. The inherited acetoin-process proposal is retained as a retired historical
      record with its lateral butanediol-process refinement; it is not a current GOA assertion.
    supported_by:
    - reference_id: PMID:34513815
      supporting_text: the disruption of pp0552 had no effect on the ability of P. putida KT2440 (Δpp0552)
        to grow in racemic AC and pyruvate but impaired its ability to utilize meso-2,3-BDO and (2R,3R)-2,3-BDO.
    - reference_id: PMID:34513815
      supporting_text: For the oxidative reaction, R,R-BDH can catalyze NAD-dependent dehydrogenation
        of (2R,3R)-2,3-BDO and meso-2,3-BDO.
