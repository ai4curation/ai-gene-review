  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  findings:
  - statement: The PpG2 enzyme is a group-I zinc/NAD(P)-dependent alcohol dehydrogenase expressed from the acetoin-catabolic locus.
    supporting_text: >-
      Strong sequence similarities of the adh translational product
      (2,3-butanediol dehydrogenase, M(r) 38361) were obtained to various
      alcohol dehydrogenases belonging to the zinc- and NAD(P)-dependent
      long-chain (group I) alcohol dehydrogenases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified PpG2 evidence; KT2440 catalytic specificity remains an orthology inference.
