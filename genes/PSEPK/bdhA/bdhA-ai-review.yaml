id: Q88QE2
gene_symbol: bdhA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BdhA (PP_0552) is a zinc-dependent, NAD(P)-linked group-I alcohol
  dehydrogenase assigned as an (R,R)-2,3-butanediol dehydrogenase. It provides
  acetoin to the adjacent acetoin-cleaving system, forming an optional upstream
  entry into acetoin catabolism when the corresponding butanediol stereoisomer is available.
existing_annotations:
- term:
    id: GO:0000721
    label: (R,R)-butanediol dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC-derived term is the specific assigned activity of BdhA.
    action: ACCEPT
    reason: >-
      The KT2440 gene product and the same-length PpG2 Adh exemplar Q59696 are
      both assigned EC 1.1.1.4, while the PpG2 locus study demonstrated
      heterologous expression and linked the enzyme to acetoin-system induction.
    supported_by:
    - reference_id: file:PSEPK/bdhA/bdhA-uniprot.txt
      supporting_text: Full=2,3-butanediol dehydrogenase
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Zinc binding is consistent with the group-I alcohol dehydrogenase family.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PpG2 homolog belongs to the zinc- and NAD(P)-dependent long-chain
      alcohol dehydrogenases. This cofactor-binding annotation is credible but
      is subordinate to the catalytic activity.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: >-
        zinc- and NAD(P)-dependent long-chain (group I) alcohol dehydrogenases
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This generic oxidoreductase term is true but uninformative beside GO:0000721.
    action: MARK_AS_OVER_ANNOTATED
    reason: The EC-derived stereospecific activity captures the function more precisely.
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This parent oxidoreductase term is correct but less specific than GO:0000721.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain the stereospecific butanediol dehydrogenase activity as the core function.
