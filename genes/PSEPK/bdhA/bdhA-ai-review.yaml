- id: PMID:7813883
  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  findings:
  - statement: PpG2 induces both butanediol dehydrogenase and acetoin cleavage during growth on either
      substrate.
    supporting_text: The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were simultaneously
      induced in Pseudomonas putida PpG2 during growth on 2,3-butanediol and on acetoin.
  - statement: PpG2 AcoA/B/C assignments were made from sequence similarity to characterized acetoin-system
      components.
    supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r) 34639),
      E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system exhibited striking
      similarities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PpG2 primary: canonical abstract and publisher abstract inspected. Normal forced PMID
      retrieval and publisher PDF recovery did not yield full text. Induction, cloned locus and heterologous
      Adh expression are explicit; exact isolated-subunit activity and stereoisomer tests must not be
      invented.'
- id: PMID:34513815
  title: Dehydrogenation Mechanism of Three Stereoisomers of Butane-2,3-Diol in Pseudomonas putida KT2440.
  findings:
  - statement: Purified KT2440 PP0552 directly oxidizes R,R and meso substrates with NAD+; Table 2 reports
      no detected NADP(H)-supported reaction.
    supporting_text: For the oxidative reaction, R,R-BDH can catalyze NAD-dependent dehydrogenation of
      (2R,3R)-2,3-BDO and meso-2,3-BDO.
  - statement: GC identifies R-acetoin and R,R-butanediol among diacetyl-reduction products.
    supporting_text: diacetyl was reduced into (3R)-AC and (2R,3R)-2,3-BDO by R,R-BDH
  - statement: Native pp0552 deletion selectively impairs R,R/meso-butanediol utilization without abolishing
      acetoin growth.
    supporting_text: the disruption of pp0552 had no effect on the ability of P. putida KT2440 (Δpp0552)
      to grow in racemic AC and pyruvate but impaired its ability to utilize meso-2,3-BDO and (2R,3R)-2,3-BDO.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text inspected: exact KT2440 pp0552 construct, purified enzyme, GC stereochemistry,
      matched NAD/NADP Table 2 and native deletion. This is not an engineered heterologous budC production
      result.'
- id: file:PSEPU/adh/adh-bioinformatics/RESULTS.md
  title: Sequence comparison results
  findings:
  - statement: The PpG2 and KT2440 dehydrogenases are near-identical over their full lengths.
    supporting_text: Q59696 Adh and Q88QE2 BdhA have 354 identical residues in an ungapped 362-residue
      alignment (97.79% identity).
  - statement: Both AcoC sequences preserve closely related full-length architecture.
    supporting_text: Q59695 and Q88QE1 AcoC have 351 identical residues across 370 alignment columns,
      with two gap positions (94.86% identity).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible global pairwise comparisons of unchanged UniProt sequences; no inferred
      tree or experimentally measured kinetics.
