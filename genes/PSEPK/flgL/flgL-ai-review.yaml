suggested_questions:
- question: Does KT2440 FlgL have a specific role in hook-filament junction stability, filament initiation, or motor load adaptation?
suggested_experiments:
- hypothesis: FlgL is required to assemble a functional hook-filament junction and support flagellum-dependent motility.
  description: Analyze flgL deletion and complemented strains by swimming assays, flagellar staining or electron microscopy, and immunodetection of exported flagellar subunits.
  experiment_type: targeted mutant phenotype and structure assay
