- id: file:PSEPK/flgL/flgL-deep-research-falcon.md
  title: Falcon deep research on flgL (Edison Scientific Literature)
  findings:
  - statement: FlgL is the distal hook-filament junction protein that, together with FlgK, links the FlgE
      hook to the FliC filament; KT2440 locus PP_4380 is explicitly mapped to flgL.
    supporting_text: The bacterial flagellum’s extracellular portion includes the **hook**, a flexible
      universal-joint-like structure, and the **filament**, a comparatively rigid helical propeller. These
      are connected by the **hook–filament junction (HFJ)**, which is formed by the proteins **FlgK (proximal
      junction protein)** and **FlgL (distal junction protein)**. A high-resolution structural study of
      the complete extracellular flagellum describes FlgL as a **hook-associated protein** that assembles
      as the **distal layer** of the HFJ, directly beneath the filament and above FlgK, thereby linking
      the hook protein **FlgE** to the filament protein **FliC (flagellin)**.
  - statement: FlgL is a structural adaptor and mechanical element, not an enzyme or transporter.
    supporting_text: FlgL is best understood as a **structural adaptor and mechanical element** rather
      than an enzyme or transporter. In the HFJ, FlgL contributes to (i) creating a compatible geometric
      and mechanical interface between hook and filament, and (ii) enabling correct initiation/stabilization
      of filament assembly and cap docking.
  - statement: FlgL functions in the extracellular flagellar structure, specifically within the hook-filament
      junction between the distal hook and the proximal filament/cap region.
    supporting_text: FlgL functions in the **extracellular flagellar structure**, specifically within
      the **hook–filament junction** between the distal hook and the proximal filament/cap region. Cryo-EM
      structures show a distinct FlgL layer immediately adjacent to FlgK and beneath the filament-cap
      apparatus (FliD).
  - statement: The hook-filament junction contains an 11:11 FlgK:FlgL stoichiometry, with FlgL forming
      an 11-mer layer, resolved by cryo-EM at 2.9 Angstrom.
    supporting_text: The HFJ contains **11 FlgK + 11 FlgL subunits** (11-mer layers), experimentally confirming
      a proposed **11:11** FlgK:FlgL stoichiometry.
  - statement: The hook-filament junction acts as a mechanical buffer limiting transmission of mechanical
      stress from hook motion into the filament, with FlgL forming part of the buffering layer.
    supporting_text: The HFJ is proposed to act as a **mechanical buffer** that limits transmission of
      mechanical stress from hook motion into the filament. In a 3D-variability analysis, FlgK/FlgL (and
      FlgE) show substantial shifts between extended/compressed states, while the filament shows minimal
      shift, supporting the concept that junction elasticity protects filament integrity; FlgL is part
      of this buffering layer (distal HFJ).
  - statement: Structure-guided mutagenesis of the FlgK-FlgL interface reduces swimming motility and increases
      filament loss under shear, linking FlgL to flagellum-dependent motility.
    supporting_text: interface disruption in the FlgK–FlgL junction produced measurable reductions in
      swimming motility and increased filament loss under shear
