  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: This is the appropriate molecular-function annotation for FlgL. FlgL is a flagellar structural protein rather than an enzyme or regulator.
    action: ACCEPT
    reason: Structural molecule activity is the best current MF term for a hook-associated flagellar protein. The support is family membership, not a KT2440 assay - Q88ES3 matches the FlgL-specific NCBIfam model TIGR02550 and InterPro IPR013384 (Flagell_FlgL) and falls in the PANTHER flagellar hook-associated protein 3 subfamily. Characterized members of this family are non-catalytic axial components of the hook-filament junction, and the record carries no catalytic or transport domain (its only FT DOMAIN is the flagellin N-terminal domain).
    supported_by:
