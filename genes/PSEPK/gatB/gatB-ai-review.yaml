- term:
    id: GO:0050566
    label: asparaginyl-tRNA synthase (glutamine-hydrolyzing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: gatB contributes to Asn formation on tRNA within GatABC.
    action: ACCEPT
    reason: GatA supplies glutamine-derived ammonia, GatB carries the tRNA-bound acceptor activation/amidation
      machinery, and GatC supports the complex. The exact KT2440 conserved family/rule assignments and
      native PAO1 Asn-transamidation assay support the target capability by homology; no isolated-subunit
      complete reaction or direct KT2440 kinetics is asserted.
    supported_by: &id006
    - *id003
    - *id002
    - *id004
- term:
    id: GO:0050567
    label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: gatB contributes to the conserved GatABC Gln-forming biochemical capacity.
    action: KEEP_AS_NON_CORE
    reason: The curated heterotrimer reaction and direct PAO1 assay with supplied B. subtilis Glu-tRNA(Gln)
      support a real substrate capacity. PAO1 uses its Asn route natively, and KT2440 native Gln-transamidation
      flux is not established. Retain the secondary capacity without presenting it as a demonstrated physiological
      KT2440 route.
    supported_by:
    - *id001
    - &id005
      reference_id: PMID:14729703
      supporting_text: The heterotrimeric AdT of P. aeruginosa has no Glu-tRNA Gln substrate in its host,
        but it can transamidate heterologous Glu-tRNA Gln .
- term:
    id: GO:0070681
    label: glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GatABC modifies a charged amino acid; the former pathway-variant BP is obsolete.
    action: MODIFY
    reason: Current QuickGO explicitly retires GO:0070681 and distinguishes GatCAB modification of already-charged
      tRNA from charging itself. KT2440 conserved GatABC and non-discriminating AspS support the Asn-forming
      modification route by inference. PAO1 shows an additional in vitro Gln-forming capacity with supplied
      heterologous substrate, not a native KT2440 Gln-transamidation pathway. Replace the obsolete overly
      specific pathway claim with the supported modification process.
    supported_by:
    - *id001
    - *id004
    - *id005
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
