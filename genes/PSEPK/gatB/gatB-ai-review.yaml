- term:
    id: GO:0070681
    label: glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GatABC has the reaction capacity, but this route is not established in KT2440.
    action: UNDECIDED
    reason: >-
      The reaction requires Glu-tRNA(Gln), but KT2440 has direct GlnRS and no
      evidence establishes that its GltX supplies this misacylated precursor.
      The characterized Pseudomonas aeruginosa system instead uses
      discriminating GluRS and direct GlnRS.
    supported_by:
    - reference_id: file:PSEPK/gatB/gatB-uniprot.txt
      supporting_text: "Reaction=L-glutamyl-tRNA(Gln) + L-glutamine + ATP + H2O"
    - reference_id: PMID:14729703
      supporting_text: "GluRS is discriminating in the sense that it does not glutamylate tRNA(Gln)"
