    id: GO:0070680
    label: asparaginyl-tRNAAsn biosynthesis via transamidation
  evidence_type: ISS
  original_reference_id: PMID:14729703
  qualifier: involved_in
  review:
    summary: GatB participates directly in indirect Asn-tRNA(Asn) formation from Asp-tRNA(Asn).
    action: NEW
    reason: The KT2440 GatB record contains the exact asparaginyl-tRNA synthase reaction, and the corresponding ND-AspRS/GatABC route is experimentally established in Pseudomonas aeruginosa.
    supported_by:
    - reference_id: file:PSEPK/gatB/gatB-uniprot.txt
      supporting_text: "Reaction=L-aspartyl-tRNA(Asn) + L-glutamine + ATP + H2O"
    - reference_id: PMID:14729703
      supporting_text: "The essential role of AdT in the formation of Asn-tRNA in P. aeruginosa"
