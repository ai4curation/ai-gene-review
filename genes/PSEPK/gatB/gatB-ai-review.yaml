id: Q88PC0
gene_symbol: gatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GatB is the ATP-dependent synthetase subunit of the GatABC tRNA-dependent
  amidotransferase in Pseudomonas putida KT2440. In the heterotrimer it activates
  the tRNA-bound glutamyl or aspartyl side chain for ammonia transfer, enabling
  formation of Gln-tRNA(Gln) or Asn-tRNA(Asn).
