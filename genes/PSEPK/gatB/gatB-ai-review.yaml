gene_symbol: gatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GatB is the ATP-dependent acceptor-side subunit of the soluble GatABC tRNA-dependent amidotransferase.
  With ammonia supplied by GatA and the structural support of GatC, it converts Asp-tRNA(Asn) to Asn-tRNA(Asn).
  The conserved complex also has Glu-tRNA(Gln)-to-Gln-tRNA(Gln) capacity when that substrate is available;
  these reactions modify the charged amino acid rather than form its ester bond to tRNA.
