- id: PMID:14729703
  title: Direct glutaminyl-tRNA biosynthesis and indirect asparaginyl-tRNA biosynthesis in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Native PAO1 uses direct GlnRS and indirect Asn formation; its GatABC also transamidates
      supplied heterologous Glu-tRNA(Gln) in vitro. Do not infer native KT2440 Gln-transamidation flux
      from that capacity.
    supporting_text: The heterotrimeric AdT of P. aeruginosa has no Glu-tRNA Gln substrate in its host,
      but it can transamidate heterologous Glu-tRNA Gln .
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native PAO1 uses direct GlnRS and indirect Asn formation; its GatABC also transamidates
      supplied heterologous Glu-tRNA(Gln) in vitro. Do not infer native KT2440 Gln-transamidation flux
      from that capacity.
- id: PMID:25548166
  title: Structure of the Pseudomonas aeruginosa transamidosome reveals unique aspects of bacterial tRNA-dependent
    asparagine biosynthesis.
  findings:
  - statement: PAO1 transamidosome structure and kinetics distinguish stabilization of the mischarged
      Asp-tRNA substrate from product release. This is a comparative architectural basis, not a native
      KT2440 complex or error-rate measurement.
    supporting_text: However, Pa GatCAB does protect Asp-tRNA Asn from deacylation
  reference_review:
    relevance: HIGH
