- id: PMID:36869664
  title: Structural and functional insights into the activation of the dual incision activity of UvrC, a key player
    in bacterial NER
  findings:
  - statement: Full-length UvrC is the dual-incision endonuclease of bacterial NER; its GIY-YIG (N-terminal) and
      RNase H-like (C-terminal) nuclease domains perform the 3' and 5' incisions respectively, and UvrC must transition
      from a closed inactive to an open active state to execute dual incision.
    reference_section_type: ABSTRACT
    supporting_text: DNA damage removal is performed by UvrC, an enzyme possessing a dual endonuclease activity,
      capable of incising the DNA on either side of the damaged site to release a short single-stranded DNA fragment
      containing the lesion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Seck et al., Nucleic Acids Research 2023, doi:10.1093/nar/gkad108; Deinococcus radiodurans UvrC
      structure and incision biochemistry. The deep-research report cites it by DOI only; PMID:36869664 matches
      the cached title, DOI and abstract. Orthologous (not KT2440) evidence.
