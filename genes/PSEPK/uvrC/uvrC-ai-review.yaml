  review:
    summary: UvrC is the catalytic subunit of the UvrABC excinuclease; both incision active sites lie in UvrC.
    action: ACCEPT
    reason: Changed from the earlier draft's MARK_AS_OVER_ANNOTATED. GO:0009381 (is_a GO:0004520) names the hydrolysis
      of DNA ester bonds flanking damage bound by the Uvr ABC complexes, and both of those cleavages are catalysed
      by UvrC itself (R42 for 3'; D399, D438, D466, H538 for 5' in E. coli). All of these residues are conserved
      in Q88FJ7, so UvrC is the subunit that executes the activity, with UvrB positioning the lesion. Kept consistent
