description: 'UvrC (UvrABC system protein C, excinuclease ABC subunit C; PP_4098) is the nuclease subunit of the
  UvrABC nucleotide excision repair system of Pseudomonas putida KT2440, which removes bulky, helix-distorting DNA
  lesions. After UvrA and UvrB recognize damage and leave UvrB bound at the lesion, UvrC is recruited through its
  UVR domain and makes two incisions in the damaged strand: the N-terminal GIY-YIG nuclease domain cleaves 3'' of
  the lesion and the C-terminal RNase H-like domain cleaves 5'' of it, releasing a short lesion-containing oligonucleotide;
  repair synthesis and ligation then restore the strand. A C-terminal helix-hairpin-helix module binds DNA. The
  607-residue protein conserves every catalytic residue identified in Escherichia coli UvrC and acts on the chromosome
  in the cytoplasm.'
