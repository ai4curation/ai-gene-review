id: Q88LE4
gene_symbol: asd
product_type: PROTEIN
status: DRAFT
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida KT2440}
description: >-
  Q88LE4 (asd, PP_1989) is an NADPH-dependent aspartate-semialdehyde
  dehydrogenase that forms L-aspartate 4-semialdehyde from
  4-phospho-L-aspartate. It supplies the shared aspartate-family trunk leading
  to lysine and to the homoserine-derived methionine and threonine branches.
