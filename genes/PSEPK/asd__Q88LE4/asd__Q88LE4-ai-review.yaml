  label: Pseudomonas putida KT2440
description: Asd (PP_1989) is an inferred NADPH-dependent aspartate-semialdehyde dehydrogenase that
  reduces 4-phospho-L-aspartate to L-aspartate 4-semialdehyde. This shared intermediate supplies
  diaminopimelate/lysine synthesis and homoserine-derived threonine and methionine synthesis. The
  protein has the gamma-type Asd architecture and conserved catalytic residues; its native kinetic
  properties remain unmeasured.
