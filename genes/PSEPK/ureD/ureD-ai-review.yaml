id: Q88J07
gene_symbol: ureD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreD is a cytoplasmic urease-maturation scaffold. It binds the UreABC
  apoprotein, recruits UreF and UreG into the activation complex, and maintains
  an apo-urease conformation competent for carbamylation and dinickel-site
  assembly.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: UreD acts on the cytoplasmic UreABC apoprotein.
      action: ACCEPT
      reason: The localization agrees with reviewed UniProt and orthologous activation complexes.
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Orthologous UreD binds divalent metals, but this is not its defining maturation role.
      action: KEEP_AS_NON_CORE
      reason: >-
        Purified K. aerogenes MBP-UreD binds nickel and more tightly bound zinc
        (PMID:22369361), supporting a conserved family property. Target Q88J07
        has not been measured, and UreD's defining role is activation-complex
        scaffolding rather than selective nickel delivery.
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: MBP-UreD binds divalent metal ions
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: ISS
    original_reference_id: PMID:7909161
    qualifier: involved_in
    review:
      summary: UreD is required to mature the urease that directly hydrolyzes urea.
      action: NEW
      reason: Orthologous deletion and reconstitution establish conserved UreD as an essential upstream component of urease-dependent urea catabolism; this is not a direct KT2440 experiment.
      supported_by:
        - reference_id: PMID:7909161
          supporting_text: extracts of cells containing a ureD deletion derivative failed to generate active urease
  - term:
      id: GO:0044183
      label: protein folding chaperone
    evidence_type: ISS
    original_reference_id: PMID:7909161
    qualifier: enables
    review:
      summary: UreD stabilizes an activation-competent conformation of urease apoprotein.
      action: NEW
      reason: >-
        Orthologous reconstitution directly describes UreD as an apoprotein
        chaperone; this is family-level evidence rather than a Q88J07 assay.
      supported_by:
        - reference_id: PMID:7909161
          supporting_text: >-
            We propose that UreD is a chaperone protein which stabilizes a urease
            apoprotein conformation that is competent for nickel incorporation.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
  - id: PMID:7909161
    title: In vitro activation of urease apoprotein and role of UreD as a chaperone required for nickel metallocenter assembly.
    findings:
      - statement: UreD binds the apoprotein and is essential for productive nickel incorporation.
        supporting_text: >-
          We propose that UreD is a chaperone protein which stabilizes a urease
          apoprotein conformation that is competent for nickel incorporation.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: 'Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation.'
    findings:
      - statement: A soluble UreD fusion binds nickel and zinc in vitro.
        supporting_text: MBP-UreD binds divalent metal ions
        reference_section_type: RESULTS
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Full text verified. This supports family-level metal binding but also
        shows stronger zinc than nickel binding, so the property is non-core
        and is not treated as direct evidence for Q88J07.
