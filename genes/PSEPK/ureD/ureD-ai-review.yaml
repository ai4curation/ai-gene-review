proposed_new_terms: []
suggested_questions:
  - question: Does PSEPK UreD bind nickel directly, or is its principal role structural recruitment of UreF/UreG?
suggested_experiments:
  - hypothesis: Q88J07 primarily scaffolds UreF/UreG on apo-UreABC while retaining measurable nickel-binding capacity.
    description: Reconstitute Q88J07 binding to apo-UreABC and quantify nickel binding separately from activation-complex assembly.
    experiment_type: Complex reconstitution, binding analysis, and metal titration
