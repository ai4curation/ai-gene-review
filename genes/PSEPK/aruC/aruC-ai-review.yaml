  label: Pseudomonas putida KT2440
description: AruC (PP_0372) is an inferred class-III PLP-dependent acetylornithine aminotransferase that
  forms N-acetyl-L-ornithine in L-arginine biosynthesis. It is distinct from PP_4481/AstC in the arginine
  succinyltransferase catabolic pathway. Its substrate range, relative biosynthetic contribution and ability
  to compensate for AstC remain unresolved in KT2440.
