- id: file:PSEPK/aruC/aruC-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK AruC/PP_0372
  findings:
  - statement: Orthology and pathway context separate PP_0372 as the anabolic ArgD-like enzyme from catabolic
      PP_4481 while documenting the absence of direct PP_0372 enzymology.
    supporting_text: The key caveat is that all substrate and localization assignments for PP_0372 derive
      from orthology, genomic context, and conserved active-site residues — no direct enzymology has been
      performed on PP_0372 or its close ortholog PA0530 themselves.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. PP_0372/Q88QW2 must be distinguished from PP_4481/astC. Full PMID31451546
      Table1 explicitly maps its argD insertion to PP_4481; retained prototrophy does not demonstrate
      absent activity and does not prove PP_0372 compensation. PMID35254100 identifies astC as the AST-pathway
      succinylornithine transaminase. PP_0372 acetylornithine activity and the pre-existing NEW biosynthetic
      annotation remain explicit SF79/classIII inferences, supported by comparative E. coli ArgD enzymology
      (PMID10074354). No new BP is proposed. PLP binding is supported by a curated RuleBase family statement
      and InterPro classification rather than the ARBA cofactor line. Comparative ArgD/AstC dimer structures
      support homomerization as an inference, not direct KT2440 measurement. Free-ornithine activity remains
      unresolved; family preference for acylated substrate is not proof of its absence. Provider claims
      of exclusive anabolic/catabolic separation or exact measured target kinetics are not adopted.
- id: PMID:10074354
  title: The dual biosynthetic capability of N-acetylornithine aminotransferase in arginine and lysine
    biosynthesis.
  reference_review:
