    id: GO:0042802
    label: identical protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Homomeric association is supported as a conserved acyl-ornithine aminotransferase feature.
    action: ACCEPT
    reason: The earlier rejection relied on absence of a UniProt SUBUNIT note, which is not evidence against
      self-association. Comparative ArgD structures and direct AstC crystallographic/solution work establish
      a functional homodimer with cofactor contacts contributed across subunits (PMID23484010). Together
      with the target family classification this supports the propagated interaction as an inference,
      not a direct KT2440 oligomer measurement.
    supported_by:
    - *id001
    - reference_id: PMID:23484010
      supporting_text: demonstrating that this enzyme is also a classical dimeric PLP-dependent, αβ-fold
        protein.
