suggested_experiments:
- description: Purify Q88QW2 and compare catalytic efficiencies for N-acetylornithine, free ornithine,
    N-succinylornithine, and N-succinyl-LL-diaminopimelate; test PP_0372 and PP_4481 single and double
    mutants for arginine auxotrophy.
