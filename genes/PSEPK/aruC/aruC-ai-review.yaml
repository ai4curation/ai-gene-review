    correctness: VERIFIED
    review_notes: Primary abstract inspected; direct purified E. coli ArgD substrate chemistry, comparative
      evidence only. Additional lysine chemistry is not automatically transferred to PP_0372.
- id: PMID:23484010
  title: Determination of the structure of the catabolic N-succinylornithine transaminase (AstC) from
    Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary paper inspected: E. coli AstC substrate kinetics, holo/dimer structures
      and comparative ArgD structures support family-level chemistry, PLP dependence and dimerization;
      these are not KT2440 target measurements.'
- id: PMID:35254100
  title: Role of the Transcriptional Regulator ArgR in the Connection between Arginine Metabolism and
    c-di-GMP Signaling in Pseudomonas putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary paper inspected; KT2440 astC belongs to the catabolic AST pathway, distinct
      from PP_0372. ArgR regulation is not itself proof of PP_0372 substrate specificity.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC6805116/
  title: Arginine Biosynthesis Modulates Pyoverdine Production and Release in Pseudomonas putida as Part
    of the Mechanism of Adaptation to Oxidative Stress
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
