suggested_questions:
- question: Does KT2440 PNPase form a stable RhlB-containing complex, and which structured RNA classes
    depend on that coupling in vivo?
  experts: []
- question: GO:0000175 3'-5'-RNA exonuclease activity is_a GO:0016896 (hydrolysis yielding 5'-phosphomonoesters),
    yet it is the community-standard term for phosphorolytic PNPases. Should GO make GO:0000175 mechanism-neutral,
    or should phosphorolytic exoribonucleases be annotated only to GO:0004654? This review modifies GO:0000175
    to GO:0004654 pending that decision; the human PNPT1 review currently accepts GO:0000175.
suggested_experiments:
- description: Compare RNA half-lives and structured-RNA intermediates in pnp and rhlB perturbation strains,
    coupled to reciprocal affinity purification of the native proteins.
