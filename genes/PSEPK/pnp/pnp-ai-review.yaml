  - supporting_text: We identified the PNPase-encoding gene (pnp) of Pseudomonas putida and constructed
      deletion mutants that did not exhibit cold sensitivity.
  - supporting_text: the transcription pattern of pnp upon cold shock in P. putida was markedly different
      from that in Escherichia coli.
