  findings:
  - supporting_text: polynucleotide phosphorylase (PNPase) is one of the main exonucleolytic activities involved in RNA turnover and is widely conserved.
  - supporting_text: We identified the PNPase-encoding gene (pnp) of Pseudomonas putida and constructed deletion mutants that did not exhibit cold sensitivity.
