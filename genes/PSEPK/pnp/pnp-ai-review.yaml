  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Polynucleotide phosphorylase (PNPase) is the Mg2+-dependent phosphorolytic
  3'-to-5' exoribonuclease of the bacterial RNA degradosome. It binds
  single-stranded RNA and processively removes ribonucleotides as nucleoside
  diphosphates, providing a principal downstream RNA-decay activity after RNase
  E cleavage and RhlB-assisted unwinding.
