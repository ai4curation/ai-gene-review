  label: Pseudomonas putida KT2440
description: Polynucleotide phosphorylase (PNPase) is the Mg2+-dependent phosphorolytic 3'-to-5' exoribonuclease
  of the bacterial RNA degradosome. It binds single-stranded RNA and processively removes ribonucleotides
  as nucleoside diphosphates. It can participate in RNase E-centered decay, while the exact balance between
  PNPase and hydrolytic exonucleases in KT2440 remains unresolved.
existing_annotations:
- term:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: TreeGrafter IEA for 3'-5'-RNA exonuclease activity.
    action: MODIFY
    reason: 'PNPase degrades RNA 3''-to-5'' by phosphorolysis, releasing nucleoside diphosphates. GO:0000175
      is_a GO:0016896, defined as ''Catalysis of the hydrolysis of ester linkages within ribonucleic acids
      by removing nucleotide residues from the 3'' or 5'' end to yield 5'' phosphomonoesters'', so it
      asserts a hydrolytic mechanism PNPase does not use. GO:0004654 is already accepted here (same decision
      as the E. coli ortholog review). The issue is ontological, not an annotator error: GO:0000175 is
      the community-standard term for PNPases, so the question is raised for GO in suggested_questions
      rather than as a source defect.'
    proposed_replacement_terms:
    - id: GO:0004654
      label: polyribonucleotide nucleotidyltransferase activity
    supported_by:
