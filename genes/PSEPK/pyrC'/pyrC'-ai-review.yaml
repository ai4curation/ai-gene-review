id: Q88D29
gene_symbol: pyrC'
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  pyrC' encodes a catalytically inactive dihydroorotase-like subunit of the
  Pseudomonas putida aspartate transcarbamoylase complex. Six PyrC' chains
  associate with six catalytic PyrB chains to maintain the native dodecameric
  assembly and its aspartate transcarbamoylase activity during de novo UMP
  biosynthesis. PyrC' lacks histidines required for dihydroorotase catalysis and
  does not replace the independently encoded active PyrC enzyme.
