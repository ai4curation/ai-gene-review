suggested_questions:
- question: >-
    Does PyrC' retain any non-catalytic metal-binding contribution to ATCase
    assembly, or has metal coordination been lost together with DHOase catalysis?
suggested_experiments:
- hypothesis: PyrC' is required structurally, rather than catalytically, for full PyrB ATCase activity.
  description: >-
    Reconstitute purified PyrB alone and with PyrC', quantify oligomeric state by
    SEC-MALS or native mass spectrometry, and compare aspartate
    transcarbamoylase kinetics with wild-type PyrC' and assembly-interface mutants.
  experiment_type: biochemical reconstitution and oligomerization analysis
