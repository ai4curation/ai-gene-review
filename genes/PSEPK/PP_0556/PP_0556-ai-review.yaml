    correctness: VERIFIED
    review_notes: The cached abstract contains an apparent apoC typo but unambiguously identifies the PpG2 acoX locus.
- id: PMID:2061286
  title: Identification and molecular characterization of the Alcaligenes eutrophus H16 aco operon genes involved in acetoin catabolism.
  findings:
  - statement: The foundational H16 operon paper explicitly leaves AcoX function unknown.
    supporting_text: >-
      Together with the gene acoX, whose function is still unknown and which is
      represented by a 1,080-bp open reading frame, these genes are probably
      organized in one single operon (acoXABC).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct source for the unresolved-function boundary.
