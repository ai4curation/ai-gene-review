suggested_questions:
- question: What is the native biochemical role of KT2440 AcoX, and do the published negative kinase assays
    reflect true substrate specificity or missing physiological conditions?
suggested_experiments:
- description: Recover the full 2012 assay conditions, test properly folded PP_0556 with nucleotide and
    candidate physiological substrates, and combine a clean nonpolar deletion/complementation with metabolomics
    and acetoin-system assembly measurements.
  experiment_type: biochemistry and reverse genetics
