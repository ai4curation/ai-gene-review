taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0556 is an AcoX-family protein encoded in the KT2440 acetoin-catabolic
  locus. The family is conserved beside acoABC, but its biochemical function
  remains unresolved. A generic NAD-kinase-like fold and automated ATP-, NAD-,
  and NAD-kinase associations are not sufficient to assign a catalytic role in
  acetoin catabolism.
