  label: Pseudomonas putida KT2440
description: PP_0556 is the AcoX-family protein at the beginning of the Pseudomonas putida KT2440 acetoin-utilization
  operon. It is co-transcribed with the E1/E2 and butanediol-dehydrogenase genes and has a NAD-kinase-related
  fold. Its native biochemical role is unresolved. Recombinant KT2440 AcoX has been reported to lack detectable
  NAD kinase and several other proposed activities under the tested conditions; this result does not identify
  its physiological substrate or exclude activity under other conditions.
