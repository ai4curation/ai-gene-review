      substrate.
    supporting_text: The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were simultaneously
      induced in Pseudomonas putida PpG2 during growth on 2,3-butanediol and on acetoin.
  - statement: PpG2 AcoA/B/C assignments were made from sequence similarity to characterized acetoin-system
