- id: PMID:15262943
  title: 'The homogentisate pathway: a central catabolic pathway involved in the degradation
    of L-phenylalanine, L-tyrosine, and 3-hydroxyphenylacetate in Pseudomonas putida.'
  findings:
  - statement: HmgB is one of the three enzymes of the P. putida homogentisate pathway.
    supporting_text: >-
      Homogentisate is then catabolized by a central catabolic pathway that
      involves three enzymes, homogentisate dioxygenase (HmgA),
      fumarylacetoacetate hydrolase (HmgB), and maleylacetoacetate isomerase
      (HmgC), finally yielding fumarate and acetoacetate.
    reference_section_type: ABSTRACT
  - statement: >-
      hmgABC form one transcriptional unit repressed by HmgR and induced by
      homogentisate.
    supporting_text: >-
      hmgR encodes a specific repressor that controls the inducible expression
      of the divergently transcribed hmgABC catabolic genes, and homogentisate
      is the inducer molecule.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary P. putida pathway study. The cached record is
      abstract-only but explicitly identifies HmgB and the pathway products.
