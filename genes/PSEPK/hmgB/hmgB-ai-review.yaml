id: Q88E48
gene_symbol: hmgB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  HmgB is the fumarylacetoacetase (fumarylacetoacetate hydrolase) of the
  Pseudomonas putida KT2440 homogentisate pathway. It hydrolyzes
  fumarylacetoacetate to fumarate and acetoacetate in the terminal step of the
  central homogentisate-catabolic route, which is encoded by the
  homogentisate-inducible, HmgR-repressed hmgABC operon and receives carbon from
  L-phenylalanine, L-tyrosine and, in some P. putida strains,
  3-hydroxyphenylacetate. It is a member of the FAH (fumarylacetoacetase)
  family, with conserved N-terminal and C-terminal FAH domains and the
  family's Ca2+/Mg2+-dependent active site.
