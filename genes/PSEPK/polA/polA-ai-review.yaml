suggested_questions:
- question: Is the PTHR10133:SF27 'DNA POLYMERASE NU' subfamily name a PANTHER naming artefact for bacterial Pol
    I? The subfamily holds E. coli and P. putida Pol I, phage T7-type polymerases and vertebrate Pol nu together.
- question: Does KT2440 Pol I contribute measurably to NER repair synthesis after UvrABC incision, or do other polymerases
    compensate in a polA mutant?
suggested_experiments:
- description: Construct a KT2440 polA deletion (or 5'-nuclease-only allele) and test UV, MMS and formaldehyde sensitivity
    alongside uvrA/uvrC mutants, to place Pol I in the NER and BER gap-filling steps in this organism.
  experiment_type: genetic validation
