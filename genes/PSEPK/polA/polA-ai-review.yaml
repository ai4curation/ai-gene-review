    summary: PolA is the type-A DNA polymerase I of KT2440 and extends primer termini on a DNA template.
    action: ACCEPT
    reason: Core function. Q88RK6 is a full-length Pol I (63% identical to E. coli Pol I over its length) with every
      checked polymerase active-site residue conserved, including the kcat-critical R668, Q849 and D882 of Klenow
      fragment. Purified E. coli Pol I fills gaps and replaces primers with DNA. The TreeGrafter node PTN002228076
      sits under the PTHR10133 family-root IBD (PTN000015249) for this term.
