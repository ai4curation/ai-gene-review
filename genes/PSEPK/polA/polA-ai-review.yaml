  label: Pseudomonas putida KT2440
description: 'PolA (DNA polymerase I, PP_0123) of Pseudomonas putida KT2440 is a 915-residue single-chain type-A
  DNA polymerase with three activities in separate domains: an N-terminal 5''-3'' exonuclease (5'' nuclease) that
  removes 5'' flaps and RNA primers, a central 3''-5'' proofreading exonuclease, and a C-terminal DNA-directed polymerase.
  By homology with Escherichia coli Pol I it matures lagging-strand Okazaki fragments by nick translation, replacing
  RNA primers with DNA, and fills the short gaps left by nucleotide-excision and base-excision repair before ligation.
  It acts on the chromosome in the cytoplasm and is a maturation and repair polymerase rather than the main replicase.'
