suggested_questions:
- question: Which lesion spectrum and pathway contribution of polA can be demonstrated directly in KT2440?
- question: Does the PTHR10133:SF27 DNA-polymerase-nu assignment reflect a family-classification artifact for this full-length bacterial PolA?
suggested_experiments:
