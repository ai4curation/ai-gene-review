id: Q88RK6
gene_symbol: polA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PolA is a multifunctional bacterial DNA polymerase I with DNA-directed polymerase, 3-prime-to-5-prime proofreading exonuclease, and 5-prime-to-3-prime exonuclease activities. It fills repair gaps and processes DNA termini in replication and repair.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleic acid binding is too broad to identify PolA's DNA polymerase and exonuclease reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: The three catalytic terms already establish the relevant DNA substrate interactions.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: DNA binding is required for PolA catalysis but does not distinguish synthesis from either exonuclease direction.
    action: KEEP_AS_NON_CORE
    reason: Keep substrate binding outside the core, which records the target's three enzymatic activities.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic catalytic activity adds no information to the three explicit PolA reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: DNA-directed polymerase plus 3-prime-to-5-prime and 5-prime-to-3-prime exonuclease terms provide the needed resolution.
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PolA is DNA polymerase I and catalyzes template-directed deoxyribonucleotide addition.
    action: ACCEPT
    reason: The target protein name, catalytic reaction, and type-A DNA polymerase family support this activity.
    supported_by:
    - reference_id: file:PSEPK/polA/polA-uniprot.txt
      supporting_text: "CC       Reaction=DNA(n) + a 2'-deoxyribonucleoside 5'-triphosphate = DNA(n+1) +"
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DNA polymerase I contributes polymerase and exonuclease activities to bacterial DNA replication.
    action: ACCEPT
    reason: The target is named DNA polymerase I and retains all three canonical PolA catalytic domains.
    supported_by:
    - reference_id: file:PSEPK/polA/polA-uniprot.txt
      supporting_text: "DE   RecName: Full=DNA polymerase I {ECO:0000256|ARBA:ARBA00020311, ECO:0000256|NCBIfam:TIGR00593};"
- term:
    id: GO:0006261
    label: DNA-templated DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DNA-templated DNA replication is compatible with PolA but overlaps the accepted DNA replication parent.
    action: KEEP_AS_NON_CORE
    reason: Keep this alternate process granularity outside the core to avoid duplicating the replication assertion.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: PolA fills repair gaps in BER and other pathways, but this parent process does not distinguish its direct catalytic role.
    action: KEEP_AS_NON_CORE
    reason: Retain the broad repair context outside the core annotation set; the polymerase and two exonuclease activities are more informative.
- term:
    id: GO:0006302
    label: double-strand break repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: PolA can act in some double-strand-break repair contexts, but the target evidence establishes only general replication and repair functions.
    action: MARK_AS_OVER_ANNOTATED
    reason: Double-strand break repair is a distinct, more specific process and is not directly supported for PSEPK PolA by the available target record.
- term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The target PolA function statement explicitly includes 3-prime-to-5-prime exonuclease activity.
    action: ACCEPT
    reason: This is the canonical proofreading activity of the target DNA polymerase I.
    supported_by:
    - reference_id: file:PSEPK/polA/polA-uniprot.txt
      supporting_text: "CC       exhibits 3'-5' and 5'-3' exonuclease activity."
- term:
    id: GO:0008409
    label: 5'-3' exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The target PolA function statement explicitly includes 5-prime-to-3-prime exonuclease activity.
    action: ACCEPT
    reason: The target sequence contains the canonical PolA 5-prime-to-3-prime exonuclease domains and the function statement names this activity.
    supported_by:
    - reference_id: file:PSEPK/polA/polA-uniprot.txt
      supporting_text: "CC       exhibits 3'-5' and 5'-3' exonuclease activity."
- term:
    id: GO:0016779
    label: nucleotidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Nucleotidyltransferase activity omits the DNA template and deoxyribonucleotide substrate of PolA.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003887 is the informative DNA-directed polymerase child.
- term:
    id: GO:0034061
    label: DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: DNA polymerase activity is correct but less specific than DNA-directed DNA polymerase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003887 states the template direction and is already accepted for this target.
- term:
    id: GO:0071897
    label: DNA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DNA biosynthetic process is a broad ancestor of the accepted DNA replication role.
    action: MARK_AS_OVER_ANNOTATED
    reason: DNA replication and the exact polymerase activity better describe PolA's contribution.
