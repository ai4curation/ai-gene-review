- id: file:PSEPK/recB/recB-deep-research-falcon.md
  title: Deep research report (Falcon/Edison) on P. putida KT2440 recB (Q88DZ5)
  findings:
  - statement: Conserved RecBCD biology supports RecB as the ATP-dependent helicase-nuclease subunit that processes dsDNA ends into recombinogenic 3' ssDNA and loads RecA; pseudomonad genetics (P. syringae recB mutants UV/MMC-sensitive, accumulate fragmented DNA) corroborate the DSB-repair role. No KT2440-specific recB mutant phenotype was recovered, so organism-specific claims are inferred.
    reference_section_type: RESULTS
- id: PMID:38047637
  title: 'RecBCD enzyme: mechanistic insights from mutants of a complex helicase-nuclease'
  findings:
  - statement: RecBCD is a fast, processive ATP-dependent helicase-nuclease; RecB contributes the 3'-5' motor and a tethered Mg2+-dependent nuclease domain, and Chi recognition switches the enzyme to nick near Chi and load RecA.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Citation-integrity fix: this reference was originally entered as PMID:38000388, which actually resolves to an unrelated RNA paper ("Co-transcriptional folding of the glmS ribozyme enables a rapid response to metabolite", Nucleic Acids Res 2024) and was a wrong identifier. The intended source is Amundsen & Smith 2023 MMBR review "RecBCD enzyme: mechanistic insights from mutants of a complex helicase-nuclease" (doi:10.1128/mmbr.00041-23). The correct PMID was recovered from the DOI via doi_to_pmid and confirmed against PubMed (PMID:38047637 -> matching title/DOI), on-topic for RecB helicase/nuclease/RecA-loading mechanism. The replacement PMID:38047637 is VERIFIED on-topic.'
- id: PMID:20195537
  title: All three subunits of RecBCD enzyme are essential for DNA repair and low-temperature growth in the Antarctic Pseudomonas syringae Lz4W
  findings:
  - statement: In a pseudomonad, recB/recC/recD null mutants are UV- and mitomycin C-sensitive and accumulate linear/fragmented chromosomal DNA; RecB ATPase/helicase activity is essential in vivo while the nuclease center is partly dispensable.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text directly documents functional pseudomonad RecBCD and states that Pseudomonas-group enzymes, including P. putida, do not recognize the E. coli Chi sequence.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__recbcd-end-resection__ppu03440-deep-research-openscientist.md
  title: OpenScientist PSEPK RecBCD end-resection synthesis
  findings:
  - statement: The report corrects the taxon-specific Chi boundary while retaining the conserved helicase-nuclease assignment.
- id: file:modules/bacterial_recbcd_end_resection.yaml
  title: Bacterial RecBCD double-strand-end resection module
  findings:
  - statement: The reusable module places RecB motor, nuclease, and RecA-loading roles in the ordered end-resection pathway.
suggested_questions:
- question: Does KT2440 RecBCD respond to a species-specific sequence or DNA-structure signal, given its failure to recognize the E. coli Chi octamer?
suggested_experiments:
- description: Construct a P. putida KT2440 recB (PP_4673) deletion and complement with wild-type and motor-dead/nuclease-dead alleles to test sensitivity to UV and mitomycin C and quantify homologous recombination capacity.
