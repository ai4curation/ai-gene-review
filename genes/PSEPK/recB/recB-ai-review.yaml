id: Q88DZ5
gene_symbol: recB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RecB (PP_4673) is the catalytic helicase-nuclease subunit of the heterotrimeric
  RecBCD enzyme (Exonuclease V) of Pseudomonas putida KT2440. Its N-terminal UvrD-like superfamily
  1 domains form an ATP-dependent 3'-5' DNA helicase/translocase that, together with the oppositely
  directed RecD motor, unwinds DNA from a double-strand end, and its C-terminal Mg2+-dependent
  PD-(D/E)XK nuclease domain, the only nuclease active site of the complex, degrades the unwound
  strands and helps generate a 3' single-stranded tail onto which RecA is loaded, initiating
  double-strand break repair by homologous recombination. RecC supplies the recognition and
  scaffold functions. Pseudomonas RecBCD enzymes confer recombination proficiency and ATP-dependent
  nuclease activity but do not respond to the Escherichia coli Chi octamer; the sequence or structural
  signal that regulates the KT2440 enzyme is not known. In the related pseudomonad P. syringae,
  recB null mutants are sensitive to UV and mitomycin C and accumulate fragmented chromosomal
  DNA, and the RecB ATPase is required in vivo whereas its nuclease is partly dispensable.
