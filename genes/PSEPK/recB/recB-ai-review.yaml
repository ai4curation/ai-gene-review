taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: RecB is the catalytic helicase-nuclease subunit of the heterotrimeric bacterial RecBCD complex. Its 3-prime-to-5-prime ATP-dependent motor cooperates with the oppositely directed RecD motor to unwind double-strand DNA ends, while its C-terminal nuclease degrades the unwound strands and generates a recombinogenic 3-prime single-stranded tail for RecA loading. RecC provides the recognition and scaffold functions. Pseudomonas RecBCD does not recognize the Escherichia coli Chi octamer, and the sequence or structural signal controlling the KT2440 switch is unknown.
