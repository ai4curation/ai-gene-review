  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: TauA is the periplasmic substrate-binding subunit of the bacterial TauABC taurine importer.
  It captures taurine outside the cytoplasmic membrane and presents it to the TauC permease for ATP-coupled
  import by TauB.
