taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GuaA (PP_1032) is glutamine-hydrolyzing GMP synthase. It uses ATP and the
  amide nitrogen of L-glutamine to convert XMP to GMP, completing the branch
  from IMP to guanine nucleotides.
existing_annotations:
- term:
    id: GO:0003921
    label: GMP synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct but less specific than the glutamine-hydrolyzing activity.
    action: MODIFY
    reason: >-
      The exact UniProt reaction uses L-glutamine as the nitrogen donor, so the
      glutamine-hydrolyzing child term is preferable.
    proposed_replacement_terms:
      - id: GO:0003922
        label: GMP synthase (glutamine-hydrolyzing) activity
- term:
    id: GO:0003922
    label: GMP synthase (glutamine-hydrolyzing) activity
