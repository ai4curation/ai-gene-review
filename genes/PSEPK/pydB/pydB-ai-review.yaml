id: A0A140FWK2
gene_symbol: pydB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  pydB (PP_4036) encodes a zinc-dependent dihydropyrimidinase of the reductive
  pyrimidine-catabolic pathway. In the cytosol it hydrolyzes the ring of
  5,6-dihydrouracil, produced by PydXA, to
  3-ureidopropionate/N-carbamoyl-beta-alanine. It is the second consecutive
  enzyme of uracil and thymine degradation and belongs to the
  hydantoinase/dihydropyrimidinase family.
existing_annotations:
- term:
    id: GO:0004157
    label: dihydropyrimidinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The EC assignment, catalytic reaction, metal-binding architecture, and pathway context all support dihydropyrimidinase activity.
    action: ACCEPT
    reason: This is the specific core molecular function of PydB.
- term:
