  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Dihydropyrimidines are cyclic amides, making this a correct mechanistic parent term.
    action: KEEP_AS_NON_CORE
    reason: Correct but less informative than GO:0004157.
