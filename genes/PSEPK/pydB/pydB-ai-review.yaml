    summary: The reaction hydrolyzes a non-peptide carbon-nitrogen bond in a dihydropyrimidine ring.
    action: KEEP_AS_NON_CORE
    reason: Retain as a correct reaction-class parent of the specific activity.
- term:
    id: GO:0016812
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
