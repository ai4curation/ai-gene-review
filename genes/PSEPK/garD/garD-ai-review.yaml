  findings: []
- id: file:PSEPK/garD/garD-uniprot.txt
  title: UniProtKB entry for garD (Q88GW6)
  findings:
  - statement: >-
      The record assigns galactarate dehydratase EC 4.2.1.42 and concordant
      GarD-specific NCBIfam, InterPro, PANTHER, and PAINT evidence.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Independent classifiers agree on GarD rather than the paralogous UxaA
      role; the entry itself remains unreviewed and lacks a direct KT2440 assay.
- id: PMID:19060141
  title: Cloning and characterization of uronate dehydrogenases from two pseudomonads and Agrobacterium tumefaciens strain C58.
  full_text_unavailable: true
  findings:
  - statement: >-
      Purified P. putida KT2440 Udh accepts galacturonate, establishing the
      upstream oxidative route from D-galacturonate to D-galactarate.
    supporting_text: |-
      For all three enzymes, the turnover number (k(cat)) with
      glucuronate as a substrate was higher than that with galacturonate
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified target-strain biochemical study; it establishes the Udh
      feeder reaction rather than assaying GarD directly.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
  findings:
  - statement: >-
      The species-aware synthesis places garD in the PP_3599-through-PP_3602
      aldarate locus and supports its galactarate-specific entry role.
- id: file:modules/glucarate_galactarate_catabolism.yaml
  title: Glucarate and galactarate catabolism module
  findings:
  - statement: GarD is the galactarate-specific entry reaction.
core_functions:
