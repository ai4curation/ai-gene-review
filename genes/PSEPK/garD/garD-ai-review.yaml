id: Q88GW6
gene_symbol: garD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GarD (PP_3601) is a galactarate dehydratase predicted to convert
  D-galactarate to 5-dehydro-4-deoxy-D-glucarate. This substrate-entry reaction
  converges with D-glucarate catabolism before formation of 2-oxoglutarate.
existing_annotations:
- term:
    id: GO:0008867
    label: galactarate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GarD dehydrates D-galactarate to 5-dehydro-4-deoxy-D-glucarate.
    action: ACCEPT
    reason: >-
      EC 4.2.1.42, NCBIfam TIGR03248, InterPro IPR017654, PANTHER SF1, and
      PAINT node PTN002021951 all support the galactarate-specific activity.
    supported_by:
    - reference_id: file:PSEPK/garD/garD-uniprot.txt
      supporting_text: "DR   GO; GO:0008867; F:galactarate dehydratase activity; IEA:UniProtKB-UniRule."
- term:
    id: GO:0016829
    label: lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GarD is a lyase, but this parent term omits its defining substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The generic InterPro mapping is true but uninformative beside the accepted
      galactarate dehydratase activity GO:0008867.
- term:
    id: GO:0019698
    label: D-galacturonate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: GarD can participate in D-galacturonate catabolism through the oxidative uronate route.
    action: KEEP_AS_NON_CORE
    reason: >-
      P. putida KT2440 Udh converts D-galacturonate to D-galactarate, which is
      then consumed by GarD. The annotation is therefore biologically valid,
      although the direct D-galactarate entry reaction is the more informative
      core role of GarD.
    supported_by:
    - reference_id: PMID:19060141
      full_text_unavailable: true
      supporting_text: |-
        For all three enzymes, the turnover number (k(cat)) with
        glucuronate as a substrate was higher than that with galacturonate
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
- term:
    id: GO:0046392
    label: D-galactarate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GarD initiates the D-galactarate branch of aldarate catabolism.
    action: ACCEPT
    reason: >-
      The biological-process annotation follows directly from the accepted
      D-galactarate-specific reaction and concordant UniRule/family evidence.
    supported_by:
    - reference_id: file:PSEPK/garD/garD-uniprot.txt
      supporting_text: "DR   GO; GO:0046392; P:galactarate catabolic process; IEA:UniProtKB-UniRule."
