suggested_questions:
  - question: Which periplasmic cytochrome c proteins are the physiological electron acceptors from P. putida KT2440 PetC?
  - question: Does P. putida KT2440 PetC carry the organism-specific acidic N-terminal extension seen in Paracoccus cytochrome c1, which controls the oligomerization state of the complex?
suggested_experiments:
  - description: Reconstitute electron transfer from PetABC to candidate P. putida cytochrome c proteins and test PetC heme-ligand variants.
  - description: Determine experimentally whether the predicted signal peptide of PetC is cleaved and whether the mature protein is retained in the cytoplasmic membrane, raising this PE 4 entry above prediction.
