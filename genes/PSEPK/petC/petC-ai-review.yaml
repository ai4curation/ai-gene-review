  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetC is the cytochrome c1 output subunit of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. Its c-type heme accepts an electron from the PetA Rieske center and transfers it to a periplasmic cytochrome c acceptor. PetC contributes to the complete PetABC quinol:cytochrome c reductase reaction.'
