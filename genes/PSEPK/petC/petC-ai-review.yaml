id: Q88N93
gene_symbol: petC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetC is the cytochrome c1 output subunit of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. A cleaved N-terminal signal peptide and a single C-terminal transmembrane helix leave its covalently heme-bound cytochrome c domain in the periplasm, where it accepts an electron from the PetA Rieske center and transfers it to a periplasmic cytochrome c acceptor. PetC contributes to the complete PetABC quinol:cytochrome c reductase reaction.'
existing_annotations:
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetC directly transfers electrons through its covalently bound c-type heme, accepting from the Rieske center and donating to periplasmic cytochrome c.
      action: ACCEPT
      reason: This is the subunit-level molecular function PetC itself performs; supported by the cytochrome c1 family assignment (IPR002326, PTHR10266) and the UniProt heme c cofactor statement with mapped covalent binding residues.
      supported_by:
        - reference_id: file:PSEPK/petC/petC-uniprot.txt
          supporting_text: Name=heme c; Xref=ChEBI:CHEBI:61717;
        - reference_id: file:PSEPK/petC/petC-uniprot.txt
          supporting_text: Note=Binds 1 heme c group covalently per subunit.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: >-
        PetC is membrane anchored by a single C-terminal transmembrane helix (residues
        232-250), but the UniProt record gives only the unqualified parent term 'Membrane'.
        In a Gram-negative bacterium a complex III subunit resides in the cytoplasmic (inner)
        membrane, and the co-operonic petA carries GO:0005886 from
        UniProtKB-SubCell:SL-0039.
      action: MODIFY
      reason: >-
        The essence is correct but the term is under-specific, and the module
        (modules/bacterial_cytochrome_bc1_complex.yaml) already asserts GO:0005886 for this
        subunit. Replacing rather than removing keeps a location on the gene, which plain
        REMOVE (the action used for petA's GO:0016020) would not, because petC has no
        GO:0005886 row of its own. The plasma-membrane inference comes from complex membership
        with PetA rather than from petC's own UniProt subcellular-location line, which is
        important to state because this entry is only PE 4 Predicted.
      proposed_replacement_terms:
        - id: GO:0005886
          label: plasma membrane
      supported_by:
        - reference_id: file:PSEPK/petC/petC-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Membrane'
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
  - term:
      id: GO:0020037
      label: heme binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetC binds one c-type heme covalently per subunit, the cofactor that makes it an electron carrier, with the attachment residues mapped in the UniProt record.
      action: ACCEPT
      reason: Direct, subunit-level cofactor binding rather than an emergent complex property; supported by the UniProt heme c cofactor statement, the mapped covalent BINDING sites, and the cytochrome c1 family assignment.
      supported_by:
        - reference_id: file:PSEPK/petC/petC-uniprot.txt
          supporting_text: Note=Binds 1 heme c group covalently per subunit.
  - term:
      id: GO:0045275
      label: respiratory chain complex III
    evidence_type: ISS
    original_reference_id: file:PSEPK/petA/petA-uniprot.txt
    qualifier: part_of
    review:
      summary: >-
        PetC is the c1-type cytochrome of the three-subunit bc1 complex, yet complex
        membership is absent from its GOA while the co-operonic petB carries it by IEA.
      action: NEW
      reason: >-
        A membership claim, not a process claim. UniProt names cytochrome c1 among the main
        subunits of complex b-c1, the petABC operon encodes exactly these three proteins, and
        the comparator check supports subunit-level attribution rather than arguing against
        it: the orthologous human cytochrome c1 subunit CYC1 carries GO:0045275 by IPI, as do
        UQCRFS1 (IDA, IC) and UQCRB (IPI). Evidence is ISS from the co-operonic petA record
        because petC's own entry is PE 4 Predicted and carries no SUBUNIT line.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBUNIT: The main subunits of complex b-c1 are: cytochrome b, cytochrome c1 and the Rieske protein.'
        - reference_id: PMID:15948965
          supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
  - term:
      id: GO:0022904
      label: respiratory electron transport chain
    evidence_type: ISS
    original_reference_id: file:PSEPK/petA/petA-uniprot.txt
    qualifier: involved_in
    review:
      summary: >-
        PetC performs the output step of the chain: its heme c accepts the high-potential
        electron from the Rieske center and reduces periplasmic cytochrome c, which then feeds
        the cbb3- and aa3-type terminal oxidases. It does the work of this process rather than
        merely being required for it. The term is absent from petC's GOA though petB carries
        it.
      action: NEW
      reason: >-
        The bc1 complex is the obligatory entry point of the cytochrome c branch of the
        P. putida KT2440 branched aerobic respiratory chain, and PetC is its exit point. The
        orthologous human CYC1 carries the mitochondrion-specific descendant GO:0006122, and
        UQCRFS1 carries GO:0022904 by IMP, so GO does make this attribution at the individual
        subunit level; GO:0022904 is the correct granularity for a bacterium.
      supported_by:
        - reference_id: file:PSEPK/petC/petC-uniprot.txt
          supporting_text: Note=Binds 1 heme c group covalently per subunit.
        - reference_id: PMID:21996020
          supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
        - reference_id: PMID:16958757
          supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: PMID:15948965
    title: 'Multiple Rieske genes in prokaryotes: exchangeable Rieske subunits in the cytochrome bc-complex of Rubrivivax gelatinosus.'
    findings:
      - statement: The bacterial bc1 complex is encoded by the petABC operon and consists of the Rieske iron-sulphur protein, the b-type cytochrome and the c1-type cytochrome.
        supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Work is in Rubrivivax gelatinosus, so it
        supports the family-level petABC architecture by homology rather than a P. putida
        measurement. This is the principal evidence that petC is the c1 subunit of the
        operon-encoded complex, since petC's own UniProt entry is PE 4 Predicted.
  - id: PMID:21996020
    title: X-ray structure of the dimeric cytochrome bc(1) complex from the soil bacterium Paracoccus denitrificans at 2.7-Å resolution.
    findings:
      - statement: The respiratory bc1 complex couples ubiquinol-to-cytochrome-c electron transfer to generation of proton motive force, with cytochrome c1 forming the electron-transfer interface to the soluble or membrane-anchored cytochrome c substrate.
        supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Structural work on the Paracoccus
        denitrificans complex; its cytochrome c1 findings are the closest structural
        counterpart to P. putida PetC available.
  - id: PMID:16958757
    title: Inactivation of the Pseudomonas putida cytochrome o ubiquinol oxidase leads to a significant change in the transcriptome and to increased expression of the CIO and cbb3-1 terminal oxidases.
    findings:
      - statement: P. putida KT2440 respires through a branched aerobic chain including cbb3- and aa3-type cytochrome c oxidases, the downstream consumers of the cytochrome c that PetC reduces.
        supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Performed in P. putida KT2440 itself,
        though it concerns the terminal oxidases rather than petC.
  - id: file:PSEPK/petC/petC-uniprot.txt
    title: UniProtKB entry for petC (Q88N93)
    findings:
      - statement: >-
          Unreviewed TrEMBL record with only a SubName and PE 4 Predicted, the weakest of the
          three subunits. Provides the cytochrome c1 family assignment (IPR002326, PTHR10266),
          one covalently bound heme c with mapped binding residues, a cleaved signal peptide
          (1-19), and a single C-terminal transmembrane helix (232-250).
  - id: file:PSEPK/petC/petC-goa.tsv
    title: QuickGO GOA annotations for petC
    findings:
      - statement: The fetched table is the complete existing-annotation set reviewed here; only three IEA rows, with no cellular-component term more specific than membrane and no biological-process annotation at all.
  - id: file:PSEPK/petA/petA-uniprot.txt
    title: UniProtKB entry for petA (Q88N95)
    findings:
      - statement: The co-operonic Rieske subunit supplies both the SUBUNIT statement naming cytochrome c1 as a main subunit of complex b-c1 and the explicit 'Cell membrane' location used to refine petC's generic 'Membrane'.
