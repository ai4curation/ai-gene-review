id: Q88N51
gene_symbol: sbcB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SbcB is a magnesium-dependent Exonuclease I that degrades single-stranded DNA
  processively in the 3'-to-5' direction to nucleoside 5'-phosphates. Its
  C-terminal region is predicted to interact with SSB, providing a mechanism
  for recruitment to single-stranded DNA. This directional activity makes SbcB
  a candidate nuclease for one orientation of mismatch-excision tracts, but a
  specific KT2440 mismatch-repair role has not been demonstrated directly.
existing_annotations:
  - term:
      id: GO:0000175
      label: 3'-5'-RNA exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Remove. The Q88N51 record and Exonuclease I subfamily assignment
        (PTHR11046:SF11) specify a single-stranded DNA substrate; the
        RNA-exonuclease mapping comes from a broad overlapping InterPro family.
      action: REMOVE
      reason: Contradicted by the exact EC 3.1.11.1 DNA reaction and Exonuclease I domain architecture.
      supported_by:
        - reference_id: file:PSEPK/sbcB/sbcB-uniprot.txt
          supporting_text: "Exonucleolytic cleavage in the 3'- to 5'-direction"
        - reference_id: file:PSEPK/sbcB/sbcB-uniprot.txt
          supporting_text: "PANTHER; PTHR11046:SF11; EXODEOXYRIBONUCLEASE I; 1."
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Too broad relative to the substrate-specific exonuclease function.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008310 captures both DNA substrate and direction.
  - term:
      id: GO:0004527
      label: exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Correct parent activity but redundant with GO:0008310.
      action: MARK_AS_OVER_ANNOTATED
      reason: A direction- and substrate-specific child term is present.
  - term:
      id: GO:0004529
      label: DNA exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct parent activity but less informative than GO:0008310.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retaining both would duplicate the same core reaction at two levels.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: >-
        Retain as non-core. Exonuclease I is used in DNA-processing and repair
        pathways, but the exact KT2440 pathway assignment has not been tested.
      action: KEEP_AS_NON_CORE
      reason: Conserved family context without organism-specific pathway evidence.
  - term:
      id: GO:0008310
      label: single-stranded DNA 3'-5' DNA exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        Accept as the core molecular function. The Q88N51 record assigns
        EC 3.1.11.1 for 3'-to-5' exonucleolytic cleavage of single-stranded DNA.
      action: ACCEPT
      reason: Exact directional Exonuclease I chemistry.
      supported_by:
        - reference_id: file:PSEPK/sbcB/sbcB-uniprot.txt
          supporting_text: "EC=3.1.11.1"
