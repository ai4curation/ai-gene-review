suggested_questions:
  - question: Does SbcB remove 3'-directed mismatch-excision tracts in KT2440?
suggested_experiments:
  - hypothesis: SbcB supplies the major 3'-to-5' exonuclease activity during one orientation of KT2440 MMR.
    description: >-
      Compare repair of substrates nicked on either side of a mismatch in wild
      type and sbcB-null extracts, with purified Q88N51 complementation.
    experiment_type: orientation-resolved mismatch excision assay
