- id: PMID:30012603
  title: Insights into bacterial lipoprotein trafficking from a structure of LolA bound to the LolC periplasmic
    domain.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. Structure, binding assays, ATPase assays and E. coli cellular
      experiments distinguish LolC recruitment from LolD ATP hydrolysis. Used as mechanistic ortholog
      support, not direct KT2440 evidence.
  findings:
  - statement: E. coli LolCDE separates the membrane heterodimer from the LolD nucleotide-binding dimer;
      LolC recruits LolA through its periplasmic domain.
    supporting_text: The LolCDE complex is an ABC transporter that comprises a heterodimer of the transmembrane
      proteins LolC and LolE, and a homodimer of cytoplasmic LolD, which forms the nucleotide binding
      domain that hydrolyzes ATP.
- id: PMID:29109272
  title: Structure and mechanotransmission mechanism of the MacB ABC transporter superfamily.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Includes an E. coli LolC periplasmic-domain structure; the principal
      mechanotransmission study is of MacB. The LolCDE discussion is comparative mechanism support and
      does not establish a KT2440 assay.
  findings:
  - statement: Comparative analysis distinguishes LolCDE outer-leaflet extraction from movement of substrate
      across the inner-membrane bilayer.
    supporting_text: LolCDE and FtsEX do not transport substrates across the inner membrane, but instead
      use cytoplasmic ATP hydrolysis to perform work in the periplasm
