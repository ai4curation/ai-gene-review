  review:
    summary: ATP binding is integral to the LolD catalytic cycle.
    action: ACCEPT
    reason: ATP is the substrate for the LolD nucleotide-binding dimer that drives release. Binding and
      hydrolysis are distinct GO molecular functions, rather than a broad term and its descendant; substrate
      binding is part of the core ATPase mechanism, not a peripheral activity. Q88KY4/PP_2155 is the curated
      LolD ATPase (HAMAP MF_01708, TIGR02211), located between PP_2154/lolC and PP_2156/lolE. Assignment
      to KT2440 is an ortholog inference; the cited E. coli experiments are not assays of this target.
