id: Q88KY4
gene_symbol: lolD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Cytoplasmic ATPase subunit of the inner-membrane LolCDE complex. LolD
  hydrolyzes ATP to power extraction of outer-membrane-destined mature
  lipoproteins from the inner membrane and their transfer to LolA.
existing_annotations:
  - term: {id: "GO:0005524", label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct for this ABC-family ATPase but less informative than ATP hydrolysis activity.
      action: KEEP_AS_NON_CORE
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: LolD is peripherally associated with the inner membrane through LolCDE.
      action: ACCEPT
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but less specific than the plasma membrane annotation the protein already carries.
      action: MODIFY
      reason: Plasma membrane (bacterial inner membrane) is the supported is_a descendant.
      proposed_replacement_terms:
        - {id: "GO:0005886", label: plasma membrane}
  - term: {id: "GO:0016887", label: ATP hydrolysis activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: LolD is the catalytic ATPase subunit that powers LolCDE.
      action: ACCEPT
  - term: {id: "GO:0022857", label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: >-
        The ATPase subunit carries the activity of its complex, but the
        accurate activity is lipoprotein release, not transmembrane transport.
      action: MODIFY
      reason: >-
        GO annotates ABC ATPase subunits with the transporter activity of their
        complex, so the row is refined rather than removed. The transmembrane
        sense is wrong for LolCDE, which does not move its cargo across the
        bilayer, and GO:0140359 ABC-type transporter activity likewise requires
        transport across a membrane. The specific activity of the complex that
        LolD powers is GO:0140306 lipoprotein releasing activity, a protein
        transporter activity defined for LolCDE.
      supported_by:
        - reference_id: PMID:10783239
          supporting_text: The LolCDE complex differs mechanistically from all other ABC transporters as it is not involved in the transmembrane transport of substrates.
      proposed_replacement_terms:
      - id: GO:0140306
        label: lipoprotein releasing activity
  - term: {id: "GO:0044873", label: lipoprotein localization to membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Broad parent of the accepted outer-membrane localization process.
      action: MODIFY
      reason: GO:0044874 is the is_a child that the gene already carries.
      proposed_replacement_terms:
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
  - term: {id: "GO:0044874", label: lipoprotein localization to outer membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: LolD powers the initiating LolCDE release step.
      action: ACCEPT
  - term: {id: "GO:0042953", label: lipoprotein transport}
    evidence_type: ISS
    original_reference_id: file:PSEPK/lolD/lolD-uniprot.txt
    qualifier: involved_in
    review:
      summary: LolD supplies ATP hydrolysis to the LolCDE lipoprotein-release step.
      action: NEW
      reason: >-
        The reviewed Q88KY4 UniProt record places LolD in the LolCDE complex that
        releases mature outer-membrane-directed lipoproteins, supporting the missing
        pathway process annotation by conserved-family inference.
      supported_by:
        - reference_id: file:PSEPK/lolD/lolD-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: translocation of mature outer membrane-directed lipoproteins
  - term: {id: "GO:0055085", label: transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: >-
        LolCDE extracts lipoprotein from the outer leaflet of the inner membrane by
        mechanotransmission; its cargo does not cross the lipid bilayer.
      action: REMOVE
      reason: >-
        GO:0055085 requires movement across a membrane, whereas LolCDE mechanically
        extrudes lipid-anchored cargo from the membrane surface into the periplasm.
      supported_by:
        - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
          supporting_text: LolCDE does not translocate its substrate *across* the membrane
  - term: {id: "GO:0089705", label: protein localization to outer membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Broad compared with lipoprotein localization to outer membrane.
      action: MODIFY
      reason: LolD acts only on lipoproteins; GO:0044874 is the precise process the gene already carries.
      proposed_replacement_terms:
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
  - term: {id: "GO:0140306", label: lipoprotein releasing activity}
    evidence_type: ISS
    original_reference_id: file:PSEPK/lolD/lolD-uniprot.txt
    qualifier: enables
    review:
      summary: LolD is the ATPase subunit that powers LolCDE lipoprotein release.
      action: NEW
      reason: >-
        GO:0140306 lipoprotein releasing activity is defined for the LolCDE
        complex of diderm bacteria. Q88KY4 is the syntenic lolC-lolD-lolE
        ortholog in KT2440, and the activity is established by reconstitution
        and depletion of the E. coli LolCDE subunits, which carry this term by
        IDA and IMP.
      supported_by:
        - reference_id: PMID:10783239
          supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent manners
references:
  - {id: "GO_REF:0000002", title: Gene Ontology annotation through association of InterPro records with GO terms, findings: []}
  - {id: "GO_REF:0000118", title: TreeGrafter-generated GO annotations, findings: []}
  - {id: "GO_REF:0000120", title: Combined Automated Annotation using Multiple IEA Methods, findings: []}
  - id: PMID:10783239
    title: A new ABC transporter mediating the detachment of lipid-modified proteins from membranes.
    findings:
      - statement: Reconstituted E. coli LolCDE catalyses LolA- and sorting-signal-dependent lipoprotein release and does not transport substrate across the membrane.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Ortholog evidence (E. coli K-12 LolCDE) supporting the ISS lipoprotein releasing activity annotation.
  - id: file:PSEPK/lolD/lolD-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 LolD (Q88KY4)
    findings:
      - statement: UniProt identifies LolD as the ATP-binding subunit of the inner-membrane LolCDE complex.
  - id: file:PSEPK/lolD/lolD-deep-research-openscientist.md
    title: OpenScientist deep research report on PSEPK LolD (Q88KY4)
    publication_type: DEEP_RESEARCH
    findings:
      - statement: Q88KY4 is a complete LolD-type ABC ATPase encoded between lolC and lolE.
        supporting_text: >-
          This chromosomal **lolC–lolD–lolE cluster** mirrors the *E. coli lolCDE*
          operon and demonstrates that *P. putida* encodes a **complete LolCDE
          transporter** with LolD's integral-membrane partners present and
          adjacently encoded
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: Used for target-specific motif, architecture, orthology, and synteny synthesis; mechanistic claims remain ortholog-derived.
  - id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
    title: OpenScientist research for the reusable Lol trafficking module
    publication_type: DEEP_RESEARCH
    findings:
      - statement: LolCDE uses mechanotransmission rather than moving lipoprotein through a membrane pore.
        supporting_text: LolCDE does not translocate its substrate *across* the membrane
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: Used to distinguish membrane-surface extraction from transmembrane transport.
core_functions:
  - description: ATP hydrolysis that powers LolCDE-dependent lipoprotein extraction and release to LolA.
    molecular_function: {id: "GO:0016887", label: ATP hydrolysis activity}
    contributes_to_molecular_function: {id: "GO:0140306", label: lipoprotein releasing activity}
    directly_involved_in:
      - {id: "GO:0042953", label: lipoprotein transport}
      - {id: "GO:0044874", label: lipoprotein localization to outer membrane}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: file:PSEPK/lolD/lolD-deep-research-openscientist.md
        supporting_text: >-
          The protein is **only ~227 aa with no transmembrane segment** — i.e., a
          **stand-alone nucleotide-binding domain**, exactly the architecture
          expected for the separate cytoplasmic LolD ATPase that dimerizes and
          docks onto the integral-membrane LolC/LolE subunits.
      - reference_id: PMID:10783239
        supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent manners
knowledge_gaps:
  - gap_statement: ATPase kinetics and subunit coupling have not been measured for the KT2440 LolCDE complex.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: The catalytic assignment is strong, but quantitative behavior is transferred from characterized orthologs.
suggested_questions:
  - question: What ATPase cycle and subunit stoichiometry optimize KT2440 LolCDE activity?
suggested_experiments:
  - description: Reconstitute LolCDE and couple ATP hydrolysis measurements to lipoprotein release onto LolA.
    experiment_type: coupled ATPase and transport assay
