    label: lipoprotein transport
  evidence_type: ISS
  original_reference_id: file:PSEPK/lolD/lolD-uniprot.txt
  qualifier: involved_in
  review:
    summary: LolD supplies ATP hydrolysis to the LolCDE lipoprotein-release step.
    action: NEW
    reason: The reviewed Q88KY4 UniProt record places LolD in the LolCDE complex that releases mature
      outer-membrane-directed lipoproteins, supporting the missing pathway process annotation by conserved-family
      inference. Q88KY4/PP_2155 is the curated LolD ATPase (HAMAP MF_01708, TIGR02211), located between
      PP_2154/lolC and PP_2156/lolE. Assignment to KT2440 is an ortholog inference; the cited E. coli
      experiments are not assays of this target. The product performs transport work itself (terminal
      transfer/insertion for LolB or ATP-driven release for LolD). Current GO is_a/part_of ancestry shows
      lipoprotein transport and lipoprotein localization to outer membrane are neither ancestors nor descendants
      of each other; retain this historically authored proposal without adding another row.
    supported_by: *id002
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: LolCDE extracts lipoprotein from the outer leaflet of the inner membrane by mechanotransmission;
      its cargo does not cross the lipid bilayer.
    action: REMOVE
    reason: 'The electronic transmembrane-transport inference misstates the cargo trajectory: mature lipoproteins
      are extracted from the periplasmic leaflet and delivered into the periplasm, rather than crossing
      the inner-membrane bilayer. The full-text comparative mechanism in PMID:29109272 and target-specific
      LolD family assignment support this correction; it is not inferred from failure to observe transport
      in an inaccessible assay.'
    supported_by:
    - reference_id: PMID:29109272
      supporting_text: LolCDE and FtsEX do not transport substrates across the inner membrane, but instead
        use cytoplasmic ATP hydrolysis to perform work in the periplasm
