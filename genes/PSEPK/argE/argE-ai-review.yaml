- id: file:PSEPK/argE/argE-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. ArgE-specific HAMAP and NCBIfam classifications support the inferred
      deacetylase; ARBA-only name/cofactor/localization statements are not used as independent evidence.
      Soluble cytoplasmic metabolic localization remains an inference. Table1 of PMID31451546 identifies
      PP_5186 insertion, which remains prototrophic; this neither disproves hydrolysis nor proves ArgJ
      is its only compensator. Native metal preference and flux partition remain unmeasured.
  findings:
  - statement: The report identifies the exact accession, ArgE-specific family signals, and substrate-specific
      hydrolysis reaction. Its claims that ArgJ is the dominant route, that ArgE is only a backup, and
      that PP_3571 is a second ArgE paralog are not used; it also missed the direct KT2440 argE-mutant
      study, which leaves route contribution unresolved.
    supporting_text: N-acetyl-L-ornithine + H₂O → L-ornithine + acetate
