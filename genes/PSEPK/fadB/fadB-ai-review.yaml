- term:
    id: GO:0008692
    label: 3-hydroxybutyryl-CoA epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Intrinsic KT2440 FadB epimerase activity is unresolved, distinct from efficient PHA precursor
      supply.
    action: UNDECIDED
    reason: HAMAP assigns this activity and E. coli FadB has direct biochemical support. However, the
      cited Pseudomonas counterexample traces to P. oleovorans FadBA coexpressed with a PHA synthase in
      E. coli, not a purified KT2440 PP_2136 epimerase assay. The2023 KT2440 paper repeats that interpretation
      while studying PHA-monomer supply. Inefficient physiological supply of R-hydroxyacyl-CoA does not
      prove absence of the exact S/R-hydroxybutanoyl-CoA interconversion. Neither categorical rejection
      nor confident target activity is warranted from these sources; the inaccessible full2002 primary
      also limits substrate/assay assessment.
