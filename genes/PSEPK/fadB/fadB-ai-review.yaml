id: Q88L02
gene_symbol: fadB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FadB (PP_2136) is the predicted alpha subunit of the FadBA fatty-acid oxidation complex of
  Pseudomonas putida KT2440. Its conserved domains support trans-enoyl-CoA hydration, NAD-dependent oxidation
  of (3S)-3-hydroxyacyl-CoA and enoyl-CoA isomerization. KT2440 transposon fitness data support a major
  role in medium- and long-chain fatty-acid utilization, with redundancy on shorter substrates. Exact
  catalytic chain-length ranges and complex kinetics are inferred rather than directly measured, and intrinsic
  epimerase activity remains unresolved.
