    label: long-chain (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: Long-chain hydroxyacyl-CoA dehydrogenation is supported as a conserved FadB-role inference.
    action: ACCEPT
    reason: The target has the complete HAMAP-assigned NAD-dependent FadB architecture, including the
      catalytic histidine and cofactor-binding sites. Native PP_2136 fitness on long-chain fatty acids
      corroborates pathway participation, while homolog biochemistry supports the molecular assignment.
      These data support an inference, not direct KT2440 long-chain kinetics; an intact active site or
      a provider prediction alone would not establish chain-length specificity. Retain the general dehydrogenase
      term as well because the supported substrate scope is not restricted to long chains.
