id: Q88L02
gene_symbol: fadB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  fadB (PP_2136) encodes the alpha subunit of the FadBA fatty acid beta-oxidation multienzyme complex
  of Pseudomonas putida KT2440, orthologous to Escherichia coli FadB. Its N-terminal crotonase domain
  hydrates trans-2-enoyl-CoA to (3S)-3-hydroxyacyl-CoA and isomerizes cis-3 double bonds of unsaturated
  intermediates, and its C-terminal NAD-dependent domain oxidizes (3S)-3-hydroxyacyl-CoA to 3-oxoacyl-CoA
  for the FadA thiolase. Transposon disruption impairs growth on fatty acids of six carbons or longer.
