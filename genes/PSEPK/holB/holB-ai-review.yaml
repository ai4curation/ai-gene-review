  label: Pseudomonas putida KT2440
description: HolB is the delta-prime structural subunit of the Pseudomonas putida KT2440 DNA polymerase
  III clamp loader. It organizes the assembly with DnaX and HolA that loads beta sliding clamps onto primed
  DNA. The polymerase and proofreading reactions are supplied by other replisome subunits.
