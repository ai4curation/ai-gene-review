taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_4473 (lysC) encodes an aspartate kinase that uses ATP to form 4-phospho-L-aspartate. This
  soluble enzyme initiates the shared aspartate-family biosynthetic trunk supplying lysine and homoserine-derived
  amino acids, including threonine and methionine. Its C-terminal ACT domain is consistent with metabolic
  regulation, although the precise feedback kinetics of the KT2440 protein remain unresolved.
