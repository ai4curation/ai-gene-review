- id: file:PSEPK/PP_4473/PP_4473-bioinformatics/primer-identity/RESULTS.md
  title: Terminal-primer identity analysis of native KT2440 constructs in PMID:40236303
  findings:
  - statement: Published terminal primers distinguish the named native constructs; this does not verify
      the full cloned CDS or measure enzymatic activity.
    supporting_text: The Table S2 lysC_xba_R reverse primer matches the terminal PARQGE of PP_4473/Q88EI9,
      followed by a stop codon.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible analysis of original publisher Table S2 and immutable target proteins.
      Six-protein comparison includes both alternative Hom/ThrC-like paralogs. Short matches are interpreted
      with the named constructs and supplementary protein sizes.
- id: PMID:40236303
  title: Synthetic pathways for microbial biosynthesis of valuable pyrazine derivatives using genetically
    modified Pseudomonas putida KT2440.
  findings:
  - statement: Native constructs were overexpressed in KT2440; terminal primer mapping identifies the
      corresponding locus. Joint engineering and soluble expression do not establish individual kinetics,
      necessity or feedback inhibition.
    supporting_text: Despite the successful overproduction of two key enzymes, aspartate kinase (LysC)
      and homoserine dehydrogenase (Hom) from different plasmid combinations
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full main text and original supplementary DOCX examined. Native LysC/Hom overproduction
      did not increase threonine; native ThrB/ThrC coexpression with heterologous E. coli ThrA improved
      production in the single-plasmid context. The statement that bifunctional ThrA complements LysC,
      Asd and Hom is chemically overstated: ThrA does not supply Asd activity. No use of this statement
      as Asd evidence.'
- id: PMID:5441401
  title: The aspartate kinase of Pseudomonas putida. Regulation of synthesis and activity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Only bibliographic content is available; neither strain nor purified protein sequence
      can be checked. Preserve the original experimental annotation and the curated UniProt link, but
      do not call this a verified KT2440/Q88EI9 assay or transfer its numerical kinetics and regulatory
      measurements.
  full_text_unavailable: true
- id: file:PSEPK/PP_4473/PP_4473-uniprot.txt
  title: UniProtKB record for Q88EI9 (PP_4473)
  findings:
  - statement: Family, domain or curated catalytic-feature support; evidence remains an inference unless
      specifically stated as measured.
    record_section:
    - DR:NCBIfam
    supporting_text: NCBIfam; TIGR00656; asp_kin_monofn; 1.
  - statement: Family, domain or curated catalytic-feature support; evidence remains an inference unless
      specifically stated as measured.
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=L-aspartate + ATP = 4-phospho-L-aspartate + ADP
  - statement: The reviewed, untagged curated pathway statement assigns PP_4473 to de novo methionine
      synthesis at the shared first reaction; this supports an inferred role, not a new native phenotype
      measurement.
    record_section: ["CC:PATHWAY"]
    supporting_text: 'L-methionine biosynthesis via de novo

      CC       pathway; L-homoserine from L-aspartate: step 1/3.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent curated family/domain or catalytic-feature evidence supports the stated
      inference. No raw annotation is edited. Generic record names, GO cross-references and ARBA-only
      functional predictions are not decisive evidence. UniProt links PMID:5441401 to regulation/kinetics,
      but the original strain and target identity could not be verified from available bibliographic content;
      those measurements are not asserted as direct KT2440 results. Its untagged reviewed CC:PATHWAY explicitly
      assigns de novo methionine step 1/3; this is distinct from ARBA-only pathway predictions and supports
      the restored inherited IC proposal.
- id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a branched
    network of many biochemical pathways.
  findings:
  - statement: Review of the branched aspartate-family network; target assignments depend on independent
      target family evidence and, where available, native primary cloning.
    supporting_text: A multibranched web of biochemical pathways of central importance is initiated by
      the action of aspartokinase (Ask) in a reaction that combines aspartate and ATP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read for pathway chemistry and variation in branch/allosteric regulation.
      It is not a native KT2440 enzyme experiment and does not justify transferring a universal feedback
      pattern or essentiality.
- id: PMID:20573952
  title: Mechanism of concerted inhibition of alpha2beta2-type hetero-oligomeric aspartate kinase from
    Corynebacterium glutamicum.
  findings:
  - statement: Comparative primary C. glutamicum aspartokinase study places aspartate phosphorylation
      at the first reaction of the shared lysine/threonine/methionine route. It is not a KT2440 phenotype
      or kinetic assay.
    supporting_text: The enzyme catalyzing the first step of this pathway is aspartate kinase (AK2; EC
      2.7.2.4), which phosphorylates the β-carboxyl group of aspartate using ATP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Used narrowly for the independently established chemical role of a monofunctional bacterial
      aspartokinase. Native C. glutamicum structure, regulation and kinetic values are not transferred
      to PP_4473.
