- term:
    id: GO:0071266
    label: '''de novo'' L-methionine biosynthetic process'
  evidence_type: IC
  original_reference_id: file:PSEPK/PP_4473/PP_4473-uniprot.txt
  qualifier: involved_in
  review:
    summary: 'Restored inherited proposal: aspartate kinase performs the first shared reaction of de novo
      methionine synthesis.'
    action: NEW
    reason: This authored IC synthesis combines the reviewed target-specific UniProt pathway assignment
      (de novo methionine synthesis, homoserine from aspartate step 1/3) with independently supported
      aspartokinase chemistry. GO:0071266 explicitly includes methionine formation from L-aspartate or
      L-homoserine, so PP_4473 performs a chemical step rather than merely supplying a consumed substrate.
      The earlier exact-term comparator check missed parent GO:0071265 annotations on bifunctional E.
      coli ThrA and MetL; these establish relevant annotation context but do not isolate their kinase-domain
      contribution. Monofunctional C. glutamicum LysC has a matching curated pathway assignment and comparative
      primary support in PMID:20573952 despite lacking a methionine GO row. Neither comparator annotation
      presence nor absence determines the target function. The curated Q88EI9 pathway statement is not
      ARBA-only, unlike the retired Hom proposal. No native KT2440 methionine phenotype, pathway essentiality
      or kinetic measurement is claimed, and the historical PMID:5441401 strain remains unresolved. This
      reinstates one inherited proposal; its original ISS row and historical retirement reason remain
      archived.
    supported_by:
    - reference_id: file:PSEPK/PP_4473/PP_4473-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'L-methionine biosynthesis via de novo

        CC       pathway; L-homoserine from L-aspartate: step 1/3.'
    - reference_id: file:PSEPK/PP_4473/PP_4473-uniprot.txt
