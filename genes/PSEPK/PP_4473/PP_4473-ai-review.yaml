taxon:
  id: "NCBITaxon:160488"
  label: Pseudomonas putida KT2440
description: >-
  PP_4473 encodes the cytoplasmic aspartate kinase that phosphorylates
  L-aspartate to 4-phospho-L-aspartate, initiating the shared bacterial
  aspartate-family pathway toward lysine, methionine, and threonine. The
  directly studied enzyme is feedback inhibited by lysine and threonine, and
  its synthesis is repressed by methionine.
