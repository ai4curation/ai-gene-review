interpretation:
  earlier_check_limitation: Exact GO:0071266 absence missed GO:0071265 annotations on E. coli ThrA and
    MetL. It did not establish systematic exclusion of shared precursor enzymes.
  bifunctional_limit: ThrA and MetL carry both kinase and homoserine dehydrogenase activities; their process
    rows do not isolate the kinase-domain contribution.
  monofunctional_comparators: E. coli LysC and C. glutamicum LysC lack methionine process rows in these
    queries. The former curated pathway lists lysine only; the latter explicitly lists de novo methionine
    step 1/3, corroborated by native primary PMID:20573952. Annotation absence is not treated as proof
    against this chemical role.
  target_evidence: Reviewed Q88EI9 curated CC:PATHWAY explicitly assigns de novo methionine synthesis,
    homoserine from aspartate step 1/3; independent aspartokinase family and catalytic evidence support
    the reaction. The biological inference is not made from GO annotation presence.
  decision: Restore the inherited PP_4473 proposal with authored IC evidence and a bounded inferred rationale;
    no target-specific methionine phenotype or kinetic measurement is asserted.
