- term:
    id: GO:0050126
    label: N-carbamoylputrescine amidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Incorrect paralog-family transfer of N-carbamoylputrescine amidase activity.
    action: REMOVE
    reason: GO:0050126 is defined as hydrolysis of N-carbamoylputrescine to putrescine, CO2 and
      ammonium, the carbamoyl-amide step of the agmatine route to putrescine. Q88QV2 is the Dav-pathway
      enzyme that hydrolyses the simple amide 5-aminopentanamide to 5-aminovalerate, the reaction
      captured by GO:0047588 on another row. Both activities sit in the carbon-nitrogen hydrolase
      superfamily (Pfam PF00795, InterPro IPR003010), so the TreeGrafter node PANTHER:PTN001132736
      transfers a substrate-specific activity across that superfamily; the substrate and reaction
      chemistry differ, so the rejection stands.
    supported_by:
    - reference_id: file:PSEPK/davA/davA-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: /note="CN hydrolase"
    - reference_id: PMID:31064836
