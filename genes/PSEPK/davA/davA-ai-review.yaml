  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: DavA is the 5-aminopentanamidase of the bacterial Dav pathway. It hydrolyzes the 5-aminopentanamide
  formed from L-lysine by DavB to 5-aminovalerate, which is then passed to DavT during L-lysine catabolism.
