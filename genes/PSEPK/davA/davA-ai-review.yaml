id: Q88QV2
gene_symbol: davA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DavA is the 5-aminopentanamidase (5-aminovaleramide amidohydrolase) of the bacterial Dav
  route of L-lysine catabolism. It hydrolyzes the 5-aminopentanamide formed from L-lysine by the DavB
  monooxygenase to 5-aminovalerate and ammonium; 5-aminovalerate is then transaminated by DavT. DavA is a
  soluble member of the carbon-nitrogen hydrolase (nitrilase) superfamily, encoded with davB, and is
  required for use of L-lysine as sole carbon and nitrogen source.
