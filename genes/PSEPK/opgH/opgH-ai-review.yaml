proposed_new_terms: []
suggested_questions:
- question: What are the exact linkage and branch pattern, UDP-glucose donor requirements and ACP/partner
    dependence of KT2440 OpgH products?
- question: Does KT2440 OpgH physically or functionally interact with OpgG during native glucan biosynthesis?
- question: Does KT2440 OpgH have any cell-division regulatory role? E. coli FtsZ sequestration is not
    established or excluded in this organism.
suggested_experiments:
- description: Assay opgH deletion or depletion strains for osmoregulated periplasmic glucan production
    under low-osmolarity growth conditions.
  experiment_type: targeted genetics and glucan profiling
- description: Reconstitute OpgH membrane fractions with candidate UDP-glucose donor and OpgG to measure
    glucan polymer formation.
  experiment_type: in vitro glycosyltransferase assay
- description: Test OpgH-FtsZ colocalization and cell-size effects across nutrient conditions in KT2440.
  experiment_type: localization and cell-division phenotype assay
