  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Supports OpgH as a polytopic GT2-family UDP-glucose glucosyltransferase in the OpgGH
      osmoregulated periplasmic glucan pathway and distinguishes it from the separate KT2440 cyclic-beta-1,3-glucan
      synthase; direct KT2440 OpgH biochemistry, product chemistry, ACP dependence, and FtsZ-sequestration
      evidence remain unavailable.
  findings:
  - statement: OpenScientist supports OpgH as a UDP-glucose-dependent inner-membrane OPG-backbone glucosyltransferase
      and flags FtsZ moonlighting as untested in KT2440.
- id: PMID:37735577
  title: Identification of enzymatic functions of osmo-regulated periplasmic glucan biosynthesis proteins
    from Escherichia coli reveals a novel glycoside hydrolase family.
  findings:
  - statement: Earlier OpgH assays used crude membranes; proposed beta-1,2 polymer chemistry was not product-resolved.
      This supports a conservative glucosyltransferase inference rather than exact linkage or native KT2440
      measurements.
    supporting_text: these analyses were performed using a crude membrane fraction containing recombinant
      OpgH, and the reaction products were not confirmed biochemically to be β-1,2-glucans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary paper inspected; its introduction critically reviews earlier OpgH work.
      Direct new assays concern OpgG/OpgD, not KT2440 OpgH.
