- term:
    id: GO:0016758
    label: hexosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Hexosyltransferase activity is correct but less informative than glucosyltransferase activity
      for OpgH.
    action: MODIFY
    reason: OpgH-specific HAMAP MF_01072 and GT2/OpgH subfamily membership support transfer of glucosyl
      groups, refining the broader hexosyltransferase term to its verified descendant GO:0046527. The
      primary comparative synthesis describes crude-membrane OpgH activity but explicitly notes that beta-1,2
      product linkage was not biochemically confirmed in those assays. Retain glucosyltransferase chemistry
      without inventing a linkage-specific synthase term, direct KT2440 kinetics or E. coli-like FtsZ
      regulation.
    proposed_replacement_terms:
    - id: GO:0046527
      label: glucosyltransferase activity
    supported_by:
