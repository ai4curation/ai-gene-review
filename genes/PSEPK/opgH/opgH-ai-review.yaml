id: Q88D04
gene_symbol: opgH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: OpgH is a predicted multipass inner-membrane glucosyltransferase of the OpgH branch of glycosyltransferase
  family 2. It contributes to osmoregulated periplasmic glucan biosynthesis in Pseudomonas putida KT2440,
  with UDP-glucose use inferred from characterized homologs. Exact KT2440 product linkages, partner requirements
  and any cell-division regulatory activity remain uncharacterized.
