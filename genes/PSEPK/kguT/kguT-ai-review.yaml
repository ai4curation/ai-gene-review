id: Q88HI0
gene_symbol: kguT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Major facilitator superfamily transporter in the kgu locus, inferred from
  KT2440 pathway genetics and conserved Pseudomonas context to import
  2-ketogluconate across the inner membrane for cytosolic conversion to
  6-phosphogluconate.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review: {summary: "Twelve predicted transmembrane helices support an inner-membrane transporter.", action: ACCEPT, reason: "This is the appropriate specific localization."}
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review: {summary: "Correct but redundant with plasma membrane.", action: MARK_AS_OVER_ANNOTATED, reason: "GO:0005886 is already present."}
  - term: {id: "GO:0022857", label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: MFS architecture supports transmembrane transport; locus and pathway evidence support 2-ketogluconate as the physiological cargo.
      action: MODIFY
      reason: GO:0046943 captures the transported substrate's carboxylic-acid class; no existing GO term distinguishes 2-dehydro-D-gluconate transport specifically.
      proposed_replacement_terms:
        - {id: "GO:0046943", label: carboxylic acid transmembrane transporter activity}
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: 2KGA in the periplasmic space is transported into the cell by the 2KGA transporter KguT
  - term: {id: "GO:0055085", label: transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review: {summary: "This process correctly captures the general membrane-transport role.", action: ACCEPT, reason: "Retain as a broad transport process alongside the pathway-specific proposal."}
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: Conserved Pseudomonas genetics place KguT-mediated 2-ketogluconate uptake in the intracellular gluconate-derived pathway.
      action: NEW
      reason: This term covers the gluconate-derived 2-ketogluconate arm without calling its phosphorylative steps non-phosphorylated glucose catabolism.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: 2KGA in the periplasmic space is transported into the cell by the 2KGA transporter KguT
references:
  - {id: "GO_REF:0000002", title: Gene Ontology annotation through association of InterPro records with GO terms}
  - {id: "GO_REF:0000118", title: TreeGrafter-generated GO annotations}
  - {id: "GO_REF:0000120", title: Combined Automated Annotation using Multiple IEA Methods}
  - id: PMID:17483213
    title: "Convergent peripheral pathways catalyze initial glucose catabolism in Pseudomonas putida: genomic and flux analysis."
    reference_review: {relevance: HIGH, correctness: VERIFIED, review_notes: "Direct KT2440 pathway genetics support the 2-ketogluconate transport step; the cached abstract supports the route but not the gene-level detail by itself."}
  - id: PMID:39770733
    title: Characterization and Transcriptional Regulation of the 2-Ketogluconate Utilization Operon in Pseudomonas plecoglossicida.
    reference_review: {relevance: HIGH, correctness: VERIFIED, review_notes: "Cross-species deletion/complementation and pathway evidence directly support KguT-mediated 2-ketogluconate uptake."}
  - {id: "file:PSEPK/kguT/kguT-uniprot.txt", title: UniProt record for KguT (Q88HI0)}
  - {id: "file:PSEPK/kguT/kguT-notes.md", title: Manual evidence reconciliation for KguT}
core_functions:
  - description: Inner-membrane transport step inferred to import 2-ketogluconate for the kgu pathway.
    molecular_function: {id: "GO:0046943", label: carboxylic acid transmembrane transporter activity}
    directly_involved_in:
      - {id: "GO:0019521", label: D-gluconate metabolic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: PMID:39770733
        supporting_text: 2KGA in the periplasmic space is transported into the cell by the 2KGA transporter KguT
proposed_new_terms:
  - proposed_name: 2-dehydro-D-gluconate transmembrane transporter activity
    proposed_definition: Enables the transfer of 2-dehydro-D-gluconate from one side of a membrane to the other.
    justification: >-
      GO:0015128 is specific for gluconate and cannot represent its 2-oxo derivative.
      GO:0046943 captures only the carboxylic-acid substrate class, whereas KguT
      transports 2-dehydro-D-gluconate in the conserved Pseudomonas kgu pathway.
    proposed_parent: {id: "GO:0046943", label: carboxylic acid transmembrane transporter activity}
  - proposed_name: 2-dehydro-D-gluconate catabolic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the breakdown of
      2-dehydro-D-gluconate, including its conversion to 6-phospho-D-gluconate.
    justification: >-
      GO:0019521 covers D-gluconate generally but does not distinguish the
      transport and phosphorylative utilization of its 2-oxo derivative.
    proposed_parent: {id: "GO:0019521", label: D-gluconate metabolic process}
suggested_questions:
  - question: Can direct uptake assays establish Q88HI0 substrate specificity and support creation of a substrate-specific GO transporter term?
