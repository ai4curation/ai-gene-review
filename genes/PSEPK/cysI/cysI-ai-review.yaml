- id: PMID:23794620
  title: Role for ferredoxin:NAD(P)H oxidoreductase (FprA) in sulfate assimilation and siderophore biosynthesis
    in Pseudomonads.
  findings:
  - statement: Pseudomonad sulfate assimilation depends on FprA and differs from the enterobacterial CysJI
      architecture.
    supporting_text: fprA is necessary for effective sulfate assimilation by P. putida
    reference_section_type: ABSTRACT
  - statement: The paper concludes that pseudomonads use distinct sulfite-reduction enzymology.
    supporting_text: pseudomonads utilize sulfite reduction enzymology distinct from that of E. coli
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected; direct versus comparative assays are qualified in annotation
      reasons. Unresolved peripheral claims are not rejected from an abstract alone.
- id: file:PSEPK/cysI/cysI-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK cysI
  findings:
  - statement: OpenScientist described the conserved siroheme/[4Fe-4S] assimilatory sulfite-reductase
      chemistry of PP_2371/Q88KB9.
    supporting_text: Its primary catalytic function is the **six‑electron reduction of sulfite (SO₃²⁻)
      to sulfide (S²⁻/H₂S)** at a unique **siroheme–[4Fe‑4S] coupled cofactor**.
  - statement: OpenScientist assigned CysI to the NADPH-dependent CysJI donor model and mapped putative
      CysJ flavoproteins from KEGG orthology.
    supporting_text: The CysJ diflavin flavoprotein (KO K00380) maps to **PP_0860 / PP_1703** elsewhere
      on the chromosome.
    finding_review:
      finding_status: DISPUTED
      review_notes: This KEGG KO transfer is organism-specific but follows the E. coli CysJI paradigm
        and does not distinguish CysJ proper from the Fpr-class FAD-containing reductases implicated in
        Pseudomonas sulfate assimilation.
      supported_by:
      - reference_id: PMID:23794620
        supporting_text: pseudomonads utilize sulfite reduction enzymology distinct from that of E. coli
      - reference_id: PMID:23794620
        supporting_text: fprA is necessary for effective sulfate assimilation by P. putida
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Provider-generated report; its donor-neutral siroheme/[4Fe-4S] sulfite reductase summary
      is useful, but its headline EC 1.8.1.2/NADPH/CysJ framing rests on a KEGG ortholog transfer from
      the E. coli paradigm rather than independent evidence for the Pseudomonas electron-donor architecture.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3754593/
  title: Role for Ferredoxin:NAD(P)H Oxidoreductase (FprA) in Sulfate Assimilation and Siderophore Biosynthesis
    in Pseudomonads
  findings:
  - statement: Catalyzes assimilatory sulfite reduction using the siroheme/iron-sulfur reductase architecture;
      immediate electron donor is not yet established for KT2440.
    supporting_text: it also remains possible that FprA transfers electrons directly to CysI.
