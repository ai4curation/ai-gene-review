suggested_questions:
- question: Does KT2440 CysI receive electrons through a discrete ferredoxin, directly from Fpr-I, or
    through more than one interchangeable carrier?
suggested_experiments:
- description: Reconstitute Q88KB9 sulfite reduction with Q88MD5, NADPH, and candidate KT2440 ferredoxins,
    measuring sulfide formation and electron transfer through each candidate carrier.
  experiment_type: reconstituted electron-transfer assay
