id: Q88KB9
gene_symbol: cysI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: CysI is the siroheme/iron-sulfur catalytic protein implicated in assimilatory sulfite reduction
  to sulfide. Pseudomonad genetics support an Fpr-linked electron-supply system distinct from the enterobacterial
  CysJ complex. The immediate electron donor to the KT2440 enzyme remains unresolved; ferredoxin, another
  carrier, or direct Fpr-mediated transfer are candidate architectures.
