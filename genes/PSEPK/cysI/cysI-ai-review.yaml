- id: PMID:23794620
  title: Role for ferredoxin:NAD(P)H oxidoreductase (FprA) in sulfate assimilation and siderophore biosynthesis in Pseudomonads.
  findings:
  - statement: Pseudomonad sulfate assimilation depends on FprA and differs from the enterobacterial CysJI architecture.
    supporting_text: fprA is necessary for effective sulfate assimilation by P. putida
    reference_section_type: ABSTRACT
  - statement: The paper concludes that pseudomonads use distinct sulfite-reduction enzymology.
    supporting_text: pseudomonads utilize sulfite reduction enzymology distinct from that of E. coli
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Experiments used P. putida DSM
      3601, not KT2440, and did not assay Q88KB9 directly. The paper corroborates
      Pseudomonas pathway physiology; the exact CysI electron-transfer route
      remains a model rather than a fully reconstituted KT2440 reaction.
