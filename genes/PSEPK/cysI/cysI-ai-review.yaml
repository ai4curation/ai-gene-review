id: Q88KB9
gene_symbol: cysI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  CysI is the siroheme- and iron-sulfur-containing catalytic sulfite reductase
  of assimilatory sulfate reduction. The best current model for pseudomonads is
  a ferredoxin-fed enzyme, with FprA supplying reducing equivalents either
  through reduced ferredoxin or directly, rather than the enterobacterial
  CysJ-dependent architecture.
