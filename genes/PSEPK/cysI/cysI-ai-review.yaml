  review:
    summary: Best current activity term for the Pseudomonas CysI model.
    action: NEW
    reason: >-
      Q88KB9 belongs to PTHR32439, which contains the reviewed ferredoxin-fed
      sulfite reductase Sir P9WJ02. Neither PTHR32439 nor PTHR11493 reliably
      distinguishes electron-donor architecture, and the PTHR32439 subfamily
      label for Q88KB9 is not functionally reliable. This ISS proposal therefore
      rests on the exact Sir exemplar plus corroborating Pseudomonas genetics,
      not on a family-name contrast.
