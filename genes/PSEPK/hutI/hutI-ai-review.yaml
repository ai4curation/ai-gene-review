id: Q88CZ9
gene_symbol: hutI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutI (PP_5030) is a soluble metallo-dependent imidazolonepropionase that
  hydrolyzes 4-imidazolone-5-propanoate to N-formimidoyl-L-glutamate in
  cytoplasmic histidine catabolism. The predicted active site can bind either
  zinc or iron; the physiologically dominant metal in KT2440 cells is unknown.
existing_annotations:
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: HutI is predicted to bind one iron or zinc ion per subunit.
    action: KEEP_AS_NON_CORE
    reason: >-
      Iron binding is a supported alternative cofactor state, but the record
      does not show that iron rather than zinc is used in vivo in KT2440.
    supported_by:
    - reference_id: file:PSEPK/hutI/hutI-uniprot.txt
      supporting_text: "Note=Binds 1 zinc or iron ion per subunit."
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: HutI is predicted to be a soluble cytoplasmic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cytoplasmic localization is biologically appropriate and explicitly
      assigned by HAMAP, but it is secondary and not experimentally measured
      in KT2440.
    supported_by:
    - reference_id: file:PSEPK/hutI/hutI-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: HutI performs the imidazolone-ring hydrolysis step of histidine catabolism.
    action: ACCEPT
    reason: >-
      The reviewed record identifies this as step 3/3 from L-histidine to
      N-formimidoyl-L-glutamate. Terminal processing of that product is
      performed by other enzymes.
    supported_by:
    - reference_id: file:PSEPK/hutI/hutI-uniprot.txt
      supporting_text: "N-formimidoyl-L-glutamate from L-histidine: step 3/3."
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: HutI is predicted to bind one zinc or iron ion per subunit.
    action: KEEP_AS_NON_CORE
    reason: >-
      Zinc binding is a supported alternative cofactor state, but the record
      does not establish the physiologically dominant metal in KT2440.
    supported_by:
    - reference_id: file:PSEPK/hutI/hutI-uniprot.txt
      supporting_text: "Note=Binds 1 zinc or iron ion per subunit."
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The root hydrolase term is true but uninformative for HutI.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0050480 identifies the substrate and reaction, so the root hydrolase
      annotation should not be propagated as an independent function.
    supported_by:
    - reference_id: file:PSEPK/hutI/hutI-uniprot.txt
      supporting_text: "DR   GO; GO:0050480; F:imidazolonepropionase activity; IEA:UniProtKB-UniRule."
- term:
    id: GO:0016810
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This carbon-nitrogen hydrolase class is an ancestor of the precise HutI activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The class term omits the imidazolone-5-propanoate substrate and is
