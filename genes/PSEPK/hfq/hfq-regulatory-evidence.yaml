regulator:
  accession: Q88DD3
  locus: PP_4894
  taxon: NCBITaxon:160488
relationships:
- id: hfq-crcZ-stability
  target:
    name: CrcZ
    type: ncRNA
  regulatory_level: rna_stability
  effect: stabilizes
  directness: unresolved
  experimental_strain: P. putida KT2440-Z, KT2440 delta-hfq and KTCRC, carrying p424-Z
  condition: LB plus 1 mM IPTG; rifampicin added at A600 0.6; Northern sampling at 0, 2, 4, 8, 16 and
    32 minutes.
  evidence:
  - reference_id: PMID:27777366
    assay: Rifampicin-chase Northern blots with 5S-rRNA normalization in KT2440-Z, KT2440 delta-hfq and
      KTCRC carrying p424-Z.
    supporting_text: The absence of Crc and Hfq thus reduces primary CrcZ stability by almost half.
    source_url: https://pubmed.ncbi.nlm.nih.gov/27777366/
  interpretation: 'Hfq increases primary CrcZ lifetime: approximately six minutes in the Hfq/Crc background
    versus 3.8 minutes without Hfq. This is RNA stabilization, not activation of the crcZ promoter.'
  limitations:
  - The expressed primary transcript includes 62 additional nucleotides; it is distinct from the processed
    species.
  - A protective Hfq/Crc complex is proposed, but this stability experiment does not measure direct RNA
    contacts.
  - Processed CrcZ was not detected without Hfq; its half-life cannot be inferred in that mutant.
  - No CrcY stability edge is inferred from this experiment.
pathway_context:
- name: Carbon catabolite repression and decoy-RNA feedback
  relationship: regulates
  mechanism: Hfq/Crc repress translation of selected mRNAs, while CrcZ/CrcY decoys antagonize that repression.
    Stabilization of CrcZ feeds back on availability of the RNA-binding regulators.
  evidence:
  - reference_id: PMID:27777366
    assay: Rifampicin-chase Northern blots with 5S-rRNA normalization in KT2440-Z, KT2440 delta-hfq and
      KTCRC carrying p424-Z.
    supporting_text: The absence of Crc and Hfq thus reduces primary CrcZ stability by almost half.
    source_url: https://pubmed.ncbi.nlm.nih.gov/27777366/
