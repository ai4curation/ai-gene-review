gene_symbol: hfq
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Hfq is a Sm-like RNA-binding regulator of translation and RNA stability in Pseudomonas putida
  KT2440. It recognizes A-rich catabolite-activity motifs in target mRNAs and cooperates with Crc to repress
  translation during carbon catabolite repression. The decoy sRNAs CrcZ and CrcY antagonize this repression
  by titrating the regulatory proteins; this mechanism does not require base pairing of those decoys with
  target mRNAs. Hfq also supports CrcZ stability and processing. Its RNA-regulatory functions occur in
  the cytoplasm.
