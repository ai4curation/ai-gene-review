- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Hfq is a post-transcriptional regulator acting on RNA, not a direct regulator of DNA-templated
      transcription. This InterPro2GO mapping mislocates Hfq's activity at the transcriptional level.
    action: MODIFY
    reason: Hfq does not bind DNA or directly regulate transcription initiation/elongation; its regulatory
      role is post-transcriptional (sRNA-mediated effects on translation and RNA stability). The more
      accurate term is ncRNA-mediated regulation of translation, which is already separately annotated.
      This generic transcription-regulation term is an over-broad/incorrect propagation and should be
      replaced.
    proposed_replacement_terms:
    - id: GO:0045974
      label: regulation of translation, ncRNA-mediated
    supported_by:
    - reference_id: PMID:27777366
      supporting_text: In Pseudomonas putida, the Hfq and Crc proteins regulate the expression of many
        genes in response to nutritional and environmental cues, by binding to mRNAs that bear specific
        target motifs and inhibiting their translation.
- term:
    id: GO:0043487
    label: regulation of RNA stability
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Hfq binds and stabilizes sRNAs (protecting them from nucleases) and also promotes targeted
      decay of mRNAs, directly influencing RNA stability. In KT2440, Hfq increases the stability of the
      CrcZ sRNA.
    action: ACCEPT
    reason: Regulation of RNA stability is a well-documented function of Hfq and is specifically supported
      in P. putida KT2440 (Hfq increases CrcZ stability).
    supported_by:
    - reference_id: PMID:27777366
      supporting_text: In addition, we show that Crc and Hfq increase CrcZ stability, which supports the
        idea that these proteins can form a complex with CrcZ and protect it from degradation by RNases.
