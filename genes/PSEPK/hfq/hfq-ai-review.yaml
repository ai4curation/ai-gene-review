    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: RNA binding is the defining and well-established molecular function of Hfq, supported by
      its Sm/Lsm domain and extensive literature on sRNA/mRNA binding in Pseudomonas and other bacteria.
    action: ACCEPT
    reason: Hfq is a canonical RNA-binding protein; P. putida Hfq binds CA-motif RNAs through its distal
      face. The term is accurate and core; no more specific GO term for A-rich motif binding exists, so
      it is retained as-is.
    supported_by:
    - reference_id: PMID:24803210
      supporting_text: Herein, we show that the Pseudomonas putida Hfq protein can recognize the CA motifs
        of RNAs through its distal face and that Crc facilitates formation of a more stable complex at
        these targets.
    - reference_id: PMID:27777366
      supporting_text: In Pseudomonas putida, the Hfq and Crc proteins regulate the expression of many
        genes in response to nutritional and environmental cues, by binding to mRNAs that bear specific
        target motifs and inhibiting their translation.
