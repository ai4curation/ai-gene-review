id: Q88QR8
gene_symbol: pabA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0420 is a 197-residue class-I (triad) glutamine amidotransferase of the
  TrpG/PabA family. Its UniProt gene name is pabA, but the KT2440 aromatic
  amino acid study names it trpG: it is the first gene of the co-transcribed
  trpGDC operon, and domain and family evidence support assignment as a
  TrpG-like anthranilate synthase amidotransferase. As anthranilate synthase
  component II it hydrolyses L-glutamine and passes the ammonia to TrpE
  (PP_0417), which aminates chorismate to anthranilate in the first committed
  step of L-tryptophan biosynthesis. KT2440 has a standalone
  aminodeoxychorismate synthase component I (PabB, PP_2329) and no other
  TrpG/PabA-family amidotransferase. PP_0420 may therefore also supply ammonia
  for p-aminobenzoate (folate) synthesis, as the shared amidotransferase of
  some other bacteria does, but this has not been tested.
existing_annotations:
- term:
    id: GO:0000162
    label: L-tryptophan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      PP_0420 is trpG, the first gene of the KT2440 trpGDC operon. Its product
      is the glutaminase subunit of anthranilate synthase, step 1 of
      L-tryptophan biosynthesis.
    action: ACCEPT
    reason: >-
      Core process. The KT2440 operon mapping names PP0420 trpG and shows it is
      co-transcribed with trpD and trpC. The transposon screen recovered no
      trpG mutant, so participation rests on operon context, the TrpG/PabA
      family (TIGR00566) and the anthranilate synthase-specific CDD model
      cd01743.
    supported_by:
    - reference_id: PMID:21261884
      supporting_text: >-
        followed by a cluster of three genes, PP0420 through to PP0422, namely
        trpG, trpD, trpC.
    - reference_id: PMID:21261884
      supporting_text: >-
        Analysis of this cluster by RT‐PCR revealed two transcriptional units: a
        single transcript for trpE (PP0417) and an operon made up of the trpG, trpD
        and trpC genes (Fig. 3B).
    - reference_id: file:PSEPK/pabA/pabA-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: "DR   CDD; cd01743; GATase1_Anthranilate_Synthase; 1."
- term:
    id: GO:0004049
    label: anthranilate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0420 is the glutamine amidotransferase (component II) of the
      two-subunit TrpE-TrpG anthranilate synthase. It supplies the ammonia that
      TrpE uses to aminate chorismate.
    action: ACCEPT
    reason: >-
      Correct and core. Like S. cerevisiae TRP3 and S. pombe trp1, the protein
      supplies only the glutaminase half-reaction, so the accurate relation is
      contributes_to, as recorded in core_functions. The term itself is the
      right one for this subunit. The PAINT node for the TrpG clade
      (PTN000230074) asserts GO:0004049 with E. coli TrpGD among its seeds.
    supported_by:
    - reference_id: file:PSEPK/pabA/pabA-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR00566; trpG_papA; 1."
    - reference_id: PMID:21261884
      supporting_text: >-
        The enzymes are TrpE (anthranilate synthase component I), TrpG
        (anthranilate synthase component II)
    - reference_id: file:interpro/panther/PTHR43418/PTHR43418-paint.tsv
      supporting_text: "PTHR43418\tPTN000230074\tGO:0004049\tF\tIBD\tfalse"
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Anthranilate synthase is a soluble enzyme. PP_0420 has no signal peptide
      or transmembrane segment and has not been localized experimentally.
    action: ACCEPT
    reason: >-
      This TreeGrafter inference rests on the soluble class-I GATase family.
      The record's only feature is the glutamine amidotransferase domain
      (residues 3-191), and it has no FT TRANSMEM or FT SIGNAL feature.
    supported_by:
    - reference_id: file:PSEPK/pabA/pabA-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: "DR   PROSITE; PS51273; GATASE_TYPE_1; 1."
