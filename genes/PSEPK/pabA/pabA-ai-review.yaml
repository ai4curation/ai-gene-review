- term:
    id: GO:0006541
    label: L-glutamine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: >-
      As a class-I amidotransferase, PP_0420 hydrolyses L-glutamine to obtain
      the amide nitrogen for anthranilate synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Chemically correct and as specific as the GO process branch allows for
