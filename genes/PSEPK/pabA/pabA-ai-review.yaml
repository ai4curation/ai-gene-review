suggested_questions:
- question: >-
    Does PP_0420 serve as the glutaminase of both anthranilate synthase (TrpE)
    and aminodeoxychorismate synthase (PabB PP_2329) in KT2440, as the
    amphibolic TrpG/PabA of some bacteria does?
suggested_experiments:
- description: >-
    Delete PP_0420 and test growth on minimal medium supplemented with
    tryptophan alone, p-aminobenzoate alone, or both. Assay purified PabB
    PP_2329 for glutamine-dependent 4-amino-4-deoxychorismate formation with
    and without PP_0420.
  experiment_type: targeted genetics and enzyme assay
