      supporting_text: "DR   PROSITE; PS51273; GATASE_TYPE_1; 1."
- term:
    id: GO:0046654
    label: tetrahydrofolate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This TreeGrafter row (PTN002459382) comes from the PabA side of
      PTHR43418:SF4. That subfamily mixes TrpG and PabA proteins (E. coli PabA,
      B. subtilis PabA, P. aeruginosa TrpG). PP_0420 is the only TrpG/PabA
      amidotransferase in a genome that encodes a standalone PabB, so a
      secondary role in p-aminobenzoate (folate precursor) synthesis is
      plausible but untested.
    action: KEEP_AS_NON_CORE
    reason: >-
      No experiment links PP_0420 to folate synthesis. The genome inventory
      (bioinformatics folder) shows that PP_0420 is the only protein that could
      serve as the glutaminase partner of PabB PP_2329. KT2440 is a prototroph,
      so some glutaminase must partner PabB. The PabA-type node in PTHR43418
      (PTN000747575, seeded by E. coli PabA P00903) carries this term. The row
      is therefore kept as a non-core, inferred secondary role, not removed.
      Tryptophan biosynthesis remains the documented core role.
    supported_by:
    - reference_id: file:PSEPK/pabA/pabA-bioinformatics/RESULTS.md
      supporting_text: >-
        KT2440 has a standalone PabB but only one TrpG/PabA-family amidotransferase.
    - reference_id: file:interpro/panther/PTHR43418/PTHR43418-paint.tsv
      supporting_text: "PTHR43418\tPTN000747575\tGO:0046654\tP\tIBD\tfalse"
- term:
    id: GO:0046820
    label: aminodeoxychorismate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This comes from the EC 2.6.1.85 that the genome submitters attached to
      PP_0420 (the product name "Aminodeoxychorismate synthase") and from the
      PabA-type node of PTHR43418. The protein would contribute the glutaminase
      half-reaction only if it partners PabB PP_2329.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the activity counterpart of the folate row and is handled the
      same way: a plausible secondary role inferred from genome inventory, not
      an established function. The EC number and the pabA name come from the
      submitted genome annotation (ECO:0000313), whereas the experimental
      operon study names the gene trpG. If PP_0420 does partner PabB, the
      accurate relation would be contributes_to, as for GO:0004049.
    supported_by:
    - reference_id: file:PSEPK/pabA/pabA-bioinformatics/RESULTS.md
      supporting_text: >-
        PP_0420 is therefore the best sequence-based candidate for the
        glutaminase subunit of aminodeoxychorismate synthase as well as of
        anthranilate synthase
    - reference_id: file:interpro/panther/PTHR43418/PTHR43418-paint.tsv
      supporting_text: "PTHR43418\tPTN000747575\tGO:0046820\tF\tIBD\tfalse"
