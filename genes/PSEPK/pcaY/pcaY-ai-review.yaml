    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: PcaY is a transmembrane MCP chemoreceptor that binds C6-ring carboxylic acids at its periplasmic four-helix-bundle ligand-binding domain and signals across the membrane to the chemosensory pathway.
    action: ACCEPT
    reason: Direct binding of 17 ligands to the purified periplasmic LBD (ITC), ligand-bound crystal structures with binding-site mutagenesis, a two-helix transmembrane topology, and loss of chemotaxis in the pcaY mutant establish transmembrane signaling receptor activity. This is the module-level activity for MCP chemoreceptors.
    supported_by:
    - reference_id: PMID:28620365
      supporting_text: the recombinant ligand binding domain (LBD) of PcaY_PP recognizes 17 different C6-ring containing carboxylic acids with KD values between 3.7 and 138 μM and chemoeffector affinity correlated with the magnitude of the chemotactic response
    - reference_id: file:PSEPK/pcaY/pcaY-uniprot.txt
