- id: file:PSEPK/PP_3598/PP_3598-hypotheses/kgap-pp3598-puud-paralog-flux/openscientist.md
  title: OpenScientist analysis of PuuD-family paralog flux in Pseudomonas putida KT2440
  findings:
  - statement: >-
      All four KT2440 PuuD-family paralogs retain an intact catalytic triad, so triad integrity
      cannot discriminate them; genomic context and SpuA orthology instead place the
      gamma-Glu-GABA flux on PP_2179 and PP_5298, leaving PP_3598's physiological substrate open.
    supporting_text: >-
      every contextual line of evidence places the physiological gamma-glutamyl-gamma-aminobutyrate
      (gamma-Glu-GABA) hydrolase flux of *P. putida* KT2440 on PP_2179 (spuA)
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The PP_3598 triad residues Cys124, His232 and Glu234 match the three ACT_SITE features of
      the local Q88GW9 record and the C-R-G elbow is present at 122-128. The proteome scan, the
      pairwise identities, the intergenic-gap table, the PDB 7D53 pocket comparison and the
      STRING neighbourhood scores were not independently checked.
