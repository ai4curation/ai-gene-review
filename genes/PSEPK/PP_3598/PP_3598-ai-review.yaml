  label: Pseudomonas putida KT2440
description: PP_3598 (PP_3598) is one of three Pseudomonas putida KT2440 paralogs of the PuuD-like subfamily
  of class I glutamine amidotransferase-like (peptidase C26) hydrolases. By family, PAINT ancestry and
  the characterized orthologs E. coli PuuD and P. aeruginosa SpuA, it is a gamma-glutamyl-gamma-aminobutyrate
  hydrolase that releases GABA and L-glutamate in the gamma-glutamyl route of putrescine catabolism. Unlike
  PP_5298 and spuA it is not clustered with a PuuA-family ligase, so its physiological gamma-glutamyl
  substrate is the least constrained of the three paralogs. No KT2440 enzyme assay or mutant has been
  reported, and the division of labour among the three paralogs is unknown.
