knowledge_gaps:
- gap_statement: No KT2440 PuuD-family paralog has been assayed, so the physiological substrate and flux
    share of each paralog are unknown.
  gap_kind:
  - BIOLOGY
  boundary: >-
    Function is inferred from family, PAINT ancestry and orthologs; substrate preference among
    paralogs is not asserted. An OpenScientist run (kgap-pp3598-puud-paralog-flux) narrows the
    flux question without assaying anything. The catalytic test this gap's experiment proposes
    is uninformative as a discriminator: all family members retain an intact Cys-His-Glu triad
    and C-R-G nucleophile elbow, and for PP_3598 the run's Cys124, His232 and Glu234 are exactly
    the three ACT_SITE residues UniProt annotates, with the elbow present as GICRGMQ at 122-128
    in the local record. The run also finds four KT2440 family members rather than the three
    this gap's question names, adding PP_0727 as the most divergent. What discriminates is
    genomic context. PP_2179 (spuA) and PP_5298 are each co-transcribed with a PuuA-type
    glutamate-putrescine ligase, the enzyme that makes the hydrolase substrate, at intergenic
    gaps of 84 bp and 4 bp; PP_3598 sits alone between an amino-acid-transport block and a
    glucarate block, flanked by 425 bp and 347 bp gaps, the two largest of the 20 measured, with
    no polyamine or GABA gene within four loci either side. PP_2179 is also 69.6 percent
    identical to P. aeruginosa SpuA and reproduces all 14 glutamate-contacting pocket residues
    of PDB 7D53, against 42.8 percent and 11 of 14 for PP_3598. The run therefore predicts the
    physiological gamma-Glu-GABA flux runs through PP_2179 and PP_5298, and reads PP_3598 as a
    clade-restricted paralog transcriptionally decoupled from putrescine catabolism with an
    unresolved physiological substrate. The only primary evidence touching it is a triple
    base-edit knockout on hexamethylenediamine, a non-natural C6 diamine, which impaired but did
    not abolish growth and cannot attribute flux to any single gene. This bears on how much
    paralog resolution the IEA GO:0033969 row on this entry can carry, since that row descends
    from a PANTHER subfamily holding all four KT2440 paralogs plus E. coli PuuD and SpuA
    undifferentiated; the activity itself is not contradicted, so no annotation action is taken
    here and the question is left for assay.
  status: NARROWING
  provenance:
  - reference_id: file:PSEPK/PP_3598/PP_3598-hypotheses/kgap-pp3598-puud-paralog-flux/openscientist.md
    supporting_text: >-
      The test requested by the hypothesis therefore returns a uniform positive and carries no
      discriminating information.
suggested_questions:
- question: Which of the three KT2440 PuuD-family paralogs (PP_5298, SpuA/PP_2179, PP_3598) carries gamma-Glu-GABA
    hydrolase flux during growth on putrescine, and do any prefer gamma-glutamyl derivatives of other
    polyamines?
suggested_experiments:
- description: Purify PP_5298, SpuA and PP_3598 and compare kcat/Km for gamma-Glu-GABA, gamma-glutamylputrescine
    and gamma-glutamyl-spermidine-derived intermediates; test single and combined deletions for growth
    on putrescine and spermidine.
  experiment_type: paralog enzyme kinetics and genetics
