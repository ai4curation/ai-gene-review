- term:
    id: GO:0016881
    label: acid-amino acid ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct ligase activity, but less specific than the accepted D-Ala-D-Ala-adding ligase
      term.
    action: MODIFY
    reason: >-
      GO:0016881 is an is_a ancestor of GO:0008766, which is accepted on this gene and names
      both the nucleotide-peptide substrate and the amino acid added. Per the project rule
      a correct-but-general term is refined with MODIFY to the specific supported term the
      gene already carries, rather than marked over-annotated: the mapping is right, only
      unspecific. Harmonized with the Escherichia coli K-12 ortholog review, where the same
      row was modified this way.
    supported_by:
    - reference_id: file:PSEPK/murF/murF-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=D-alanyl-D-alanine + UDP-N-acetyl-alpha-D-muramoyl-L-alanyl-'
    proposed_replacement_terms:
    - id: GO:0008766
      label:
        UDP-N-acetylmuramoylalanyl-D-glutamyl-2,6-diaminopimelate-D-alanyl-D-alanine
        ligase activity
- term:
    id: GO:0047480
    label: UDP-N-acetylmuramoyl-tripeptide-D-alanyl-D-alanine ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      MurF activity stated on the L-lysine tripeptide; a genuine tolerated activity of MurF
      enzymes, but not the reaction KT2440 performs.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0047480 is defined on the L-lysine-containing tripeptide (RHEA:16085) and GO:0008766
      on the meso-diaminopimelate one (RHEA:28374); they are siblings under GO:0016881, so
      neither refines the other. Unlike MurE, MurF does not discriminate between the two tripeptide
      forms: the purified Escherichia coli and Staphylococcus aureus enzymes both accept either,
      so broad third-position tolerance is a property of the MurF enzyme class rather than
      of one species. The row is therefore true of KT2440 MurF as an in vitro capability but
      is not its physiological reaction, since KT2440 MurE inserts meso-diaminopimelate, and
      it is retained as non-core with GO:0008766 as the core function. Same treatment as the
      Escherichia coli K-12 MurF review; where no such cross-species tolerance evidence exists,
      as for MraY and MurG, the other-stem row is instead modified laterally to the organism
      own term.
    supported_by:
    - reference_id: PMID:20659527
      supporting_text: S. aureus MurF appeared less specific and accepted both forms
    - reference_id: file:PSEPK/murF/murF-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: gamma-D-glutamyl-meso-2,6-diaminopimelate + ATP = UDP-N-acet
