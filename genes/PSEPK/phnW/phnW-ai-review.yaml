    summary: PhnW supplies the first reaction of the PhnWX 2-aminoethylphosphonate degradation route.
    action: ACCEPT
    reason: The KT2440 protein matches the PhnW-specific HAMAP rule MF_01376, InterPro IPR012703 and PANTHER
      subfamily PTHR42778:SF1. Its assigned transamination supplies phosphonoacetaldehyde for the adjacent
      PhnX enzyme. Biochemical characterization of Salmonella PhnW (PMID:12107130) and detection of both
      pathway activities in P. putida NG2 (PMID:9841125) independently establish this family role. These
      studies support inference to KT2440; neither is a direct assay of Q88KT0. No particular transporter
      or regulatory regime is inferred.
