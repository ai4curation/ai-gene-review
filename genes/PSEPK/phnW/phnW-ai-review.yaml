  label: Pseudomonas putida KT2440
description: PhnW (PP_2209) is a predicted pyridoxal-phosphate-dependent 2-aminoethylphosphonate:pyruvate
  transaminase in Pseudomonas putida KT2440. It belongs to the class-V aminotransferase PhnW subfamily
  and is expected to form a homodimer. The enzyme transfers the amino group of 2-aminoethylphosphonate
  to pyruvate, yielding phosphonoacetaldehyde and L-alanine. Together with the adjacent PhnX phosphonoacetaldehyde
  hydrolase, it provides a two-step route for releasing phosphate from 2-aminoethylphosphonate. A cytosolic
  site of action is expected from the intracellular catabolic role, but has not been established experimentally
  in KT2440.
