      Combined IEA (InterPro IPR034291, RHEA:22328, EC 2.5.1.3, PANTHER node, HAMAP
      MF_00097) for thiamine-phosphate synthase activity: HMP-PP + thiazole phosphate ->
      TMP + diphosphate. This is the defining activity of the ThiE subfamily.
    action: ACCEPT
    reason: >-
      Core function. Q88DP1 matches the TMP synthase signatures (HAMAP MF_00097, TIGR00693,
