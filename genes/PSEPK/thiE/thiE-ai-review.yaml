suggested_questions:
- question: >-
    Which thiazole substrate does KT2440 ThiE use in vivo, the carboxylated thiazole
    tautomer released by ThiG or the decarboxylated thiazole phosphate, and does a TenI-like
    tautomerase exist in Pseudomonas?
suggested_experiments:
- description: >-
    Assay recombinant Q88DP1 with HMP-PP and each thiazole phosphate form (carboxylated
    tautomer, aromatic carboxylate, decarboxylated thiazole phosphate) and measure TMP
    formation and CO2 release; complement an E. coli thiE mutant with PP_4783.
  hypothesis: >-
    Q88DP1 is a Mg2+-dependent TMP synthase that accepts the carboxylated thiazole made by
    ThiG and catalyses its decarboxylation during coupling.
