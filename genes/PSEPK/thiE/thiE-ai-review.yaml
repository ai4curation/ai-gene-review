id: Q88DP1
gene_symbol: thiE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  thiE (PP_4783) encodes thiamine-phosphate synthase (TMP synthase, EC 2.5.1.3) of
  Pseudomonas putida KT2440, a 207-residue TIM-barrel enzyme of the ThiE/TenI fold
  (PANTHER PTHR20857:SF15, HAMAP MF_00097, NCBIfam TIGR00693). It condenses the activated
  pyrimidine 4-amino-2-methyl-5-(diphosphooxymethyl)pyrimidine (HMP-PP, made by ThiD) with
  the thiazole phosphate produced by the ThiG/ThiS thiazole synthase system, releasing
  diphosphate (and CO2 when the carboxylated thiazole tautomer made by ThiG is the
  substrate) to form thiamine monophosphate (TMP), which ThiL then phosphorylates to the
  cofactor thiamine diphosphate. The reaction is Mg2+-dependent. thiE lies immediately
  downstream of thiD (PP_4782). The enzyme is cytoplasmic. Its function is inferred from
  conserved family membership and the HAMAP rule; the KT2440 protein has not been assayed
  directly.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000076356
  review:
    summary: >-
      UniRule (HAMAP MF_00097) transfer of magnesium ion binding. TMP synthase binds one
      Mg2+ per subunit, coordinated by conserved residues, to stabilise the diphosphate
      leaving group of HMP-PP.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Mg2+ cofactor is well supported by the HAMAP rule and its conserved binding
      residues (positions 68 and 86 in Q88DP1), so the annotation is correct. It is a
      cofactor-binding property of the TMP synthase activity rather than a separate
      function, and is kept as non-core, as for the yeast family member THI6.
    supported_by:
    - reference_id: file:PSEPK/thiE/thiE-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Note=Binds 1 Mg(2+) ion per subunit. {ECO:0000255|HAMAP-Rule:MF_00097};'
