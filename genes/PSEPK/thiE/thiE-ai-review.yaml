  review:
    summary: >-
      TreeGrafter transfer of cytoplasm from the PANTHER ThiE node. ThiE is a soluble
      TIM-barrel enzyme with no signal peptide or transmembrane segment, acting on
      cytoplasmic pathway intermediates.
    action: ACCEPT
    reason: >-
      Consistent with the soluble TMP synthase fold and with the cytoplasmic location of
      the substrates (HMP-PP from ThiD, thiazole phosphate from ThiG) and the product TMP,
      which ThiL phosphorylates. No direct localisation evidence exists for the KT2440
      protein, so the row stays at the evidence-supported cytoplasm rather than being
