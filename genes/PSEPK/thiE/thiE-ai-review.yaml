- term:
    id: GO:0009228
    label: thiamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR034291
  - PANTHER:PTN002324921
  review:
    summary: >-
      Combined IEA for thiamine biosynthetic process. ThiE performs the coupling step that
      forms the thiamine skeleton, joining the pyrimidine and thiazole moieties.
    action: ACCEPT
    reason: >-
      ThiE catalyses the step that creates the thiamine molecule (as its monophosphate), so
      it participates directly in thiamine biosynthesis. GO:0009229 is not an is_a or
      part_of descendant of GO:0009228, so both process terms are kept, as for THI6.
    supported_by:
    - reference_id: PMID:8432721
