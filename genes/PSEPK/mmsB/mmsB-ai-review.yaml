taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MmsB is an NAD+-dependent 3-hydroxyisobutyrate dehydrogenase of the distal
  valine catabolic route. It oxidizes 3-hydroxy-2-methylpropanoate to
  methylmalonate semialdehyde, which can then be converted to propionyl-CoA by
  the adjacent methylmalonate-semialdehyde dehydrogenase MmsA-II.
