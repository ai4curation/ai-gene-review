  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HscB activates the partner HscA ATPase.
    action: ACCEPT
    reason: The target HAMAP SUBUNIT statement directly assigns stimulation of HscA ATPase; homolog biochemical
      studies explain this conserved role. HscB is the activator, not an independently assigned ATPase.
