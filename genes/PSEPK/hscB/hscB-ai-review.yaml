  findings:
  - statement: Purified E. coli Hsc66 suppresses rhodanese/citrate-synthase aggregation but fails the
      separately measured luciferase-refolding assay; Hsc20 lacks autonomous model-client antiaggregation
      under the tested conditions. These assays are not KT2440 measurements.
    supporting_text: Hsc66 suppressed aggregation of rhodanese and citrate synthase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original protected cache is abstract-only; official PMC full article additionally read
