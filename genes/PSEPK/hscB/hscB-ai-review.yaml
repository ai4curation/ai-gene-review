- term:
    id: GO:0051259
    label: protein complex oligomerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The HscB C-terminal fold supports scaffold targeting, not an independently established oligomerization
      process.
    action: MARK_AS_OVER_ANNOTATED
    reason: The current IPR009073/IPR036386 entries map the historically named oligomerisation domain
      to GO0051259, while their descriptions identify a three-helical bundle that binds and targets proteins
      to HscA. The E. coli binding-surface and ATPase-targeting experiments establish this adaptor function,
      not a separate process of creating protein oligomers. This electronic process assignment exceeds
      the demonstrated role. GO0051259 includes heteromers, so monomeric HscB is not the objection; membership
      in a transfer complex also does not by itself demonstrate oligomer assembly. For KT2440, the domain
      assignment and curated HscA interaction support targeting by inference, not a measured target oligomerization
      reaction.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/ecoli-psepk-consultation/evidence.md
      supporting_text: Their prose instead describes an open three-helical bundle that binds and targets
        proteins to HscA
    - reference_id: PMID:18702525
      supporting_text: In addition, we used ATPase assays to evaluate the ability of select HscB mutants
        to bind IscU and target it to HscA.
