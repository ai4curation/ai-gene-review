id: Q88PK5
gene_symbol: hscB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: HscB (PP_0845) is the dedicated J-domain co-chaperone of the bacterial Isc system. It recognizes cluster-bearing IscU, recruits HscA, and stimulates HscA ATPase activity to promote Fe-S cluster release and transfer.
existing_annotations:
  - term:
      id: GO:0001671
      label: ATPase activator activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: HscB activates the ATPase cycle of its HscA partner.
      action: ACCEPT
      reason: Reviewed HAMAP and the HscB-specific family support this dedicated co-chaperone activity.
      supported_by:
        - reference_id: file:PSEPK/hscB/hscB-uniprot.txt
          supporting_text: DR   HAMAP; MF_00682; HscB; 1.
  - term:
      id: GO:0006457
      label: protein folding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: Generic protein folding overstates the biological scope of HscB.
      action: MARK_AS_OVER_ANNOTATED
      reason: HscB is specialized for IscU remodeling and Fe-S transfer, not general proteostasis.
  - term:
      id: GO:0044571
      label: '[2Fe-2S] cluster assembly'
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The HscB-HscA cycle promotes release and transfer of IscU-bound clusters.
      action: ACCEPT
      reason: The dedicated HscB family assignment and Isc operon context support this process.
  - term:
      id: GO:0051087
      label: protein-folding chaperone binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: HscA binding is correct, but the existing term frames the partner too generically.
      action: MODIFY
      reason: HscB specifically binds an Hsp70-family ATPase in the Isc transfer cycle.
      proposed_replacement_terms:
        - id: GO:0030544
          label: Hsp70 protein binding
  - term:
      id: GO:0051259
      label: protein complex oligomerization
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Complex formation is not equivalent to an oligomerization process role.
      action: REMOVE
      reason: HscB forms a functional transfer complex but there is no evidence that it drives protein-complex oligomerization.
  - term:
      id: GO:1990230
      label: iron-sulfur cluster transfer complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: part_of
    review:
      summary: HscB participates in the dedicated IscU-HscA cluster-transfer complex.
      action: ACCEPT
      reason: This complex membership captures the specialized chaperone cycle without implying generic protein folding.
