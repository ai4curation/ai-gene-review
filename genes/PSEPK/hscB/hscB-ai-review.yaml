id: Q88PK5
gene_symbol: hscB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HscB (PP_0845) is the J-domain cochaperone of the Pseudomonas putida KT2440 Isc system. It
  binds the Hsp70-family partner HscA and stimulates ATP hydrolysis. Its conserved specialized family
  supports recognition of the IscU scaffold and coupling to cluster transfer, with the detailed interaction
  and conformational cycle established in bacterial homologs.
existing_annotations:
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HscB activates the partner HscA ATPase.
    action: ACCEPT
    reason: The target HAMAP SUBUNIT statement directly assigns stimulation of HscA ATPase; homolog biochemical
      studies explain this conserved role. HscB is the activator, not an independently assigned ATPase.
    supported_by:
    - &id001
      reference_id: file:PSEPK/hscB/hscB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with HscA and stimulates its ATPase activity.
    - reference_id: PMID:18986169
      supporting_text: HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an absolute requirement
        for both HscB and ATP.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Specialized scaffold-state stabilization does not settle a general folding-process claim.
    action: UNDECIDED
    reason: Client specificity alone is not grounds to reject protein folding. E. coli HscB stabilizes
      structured IscU and participates in an ATP-dependent cluster-transfer cycle, but that endpoint is
      not itself a test of assisting formation of the correct tertiary structure in KT2440. Retain uncertainty
      rather than claiming that specialization excludes folding or that a generic J-domain proves it.
    supported_by:
    - reference_id: file:PSEPK/hscB/hscB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Co-chaperone involved in the maturation of iron-sulfur cluster-containing proteins.
    - reference_id: PMID:22782893
- term:
    id: GO:0044571
    label: '[2Fe-2S] cluster assembly'
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: HscB supports the cluster-transfer stage of Isc maturation.
    action: ACCEPT
    reason: Curated target HscB function and ATPase stimulation, together with homolog cluster-transfer
      reconstitution, support involvement in this assembly process. This does not assign sulfur mobilization,
      cluster synthesis catalysis or direct cluster binding to HscB.
    supported_by:
    - *id001
    - reference_id: PMID:18986169
      supporting_text: HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an absolute requirement
        for both HscB and ATP.
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HscB binds the Hsp70-family protein HscA.
    action: MODIFY
    reason: Use the supported Hsp70 partner identity to specify the binding claim. This replacement describes
      the known target partner and does not infer that HscA is a general refolding enzyme. The dedicated
      interaction is independently curated by HAMAP; its detailed target affinity has not been measured.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - id: GO:0030544
      label: Hsp70 protein binding
- term:
    id: GO:0051259
    label: protein complex oligomerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Heterocomplex formation prevents a simple monomer-based rejection of oligomerization.
    action: UNDECIDED
    reason: GO0051259 includes oligomers of different subunits. HscB participation in an IscU-HscA transfer
      complex is compatible with that definition, and isolated monomeric HscB would not refute it. However,
      complex membership and an oligomerization-domain name do not by themselves demonstrate that KT2440
      HscB promotes oligomer creation. Without a resolved target assembly mechanism, retain uncertainty
      rather than REMOVE.
    supported_by:
    - *id001
    - reference_id: PMID:18986169
      supporting_text: formation of a 1:1:1 HscA-HscB-IscU(2)[2Fe2S] complex
- term:
    id: GO:1990230
    label: iron-sulfur cluster transfer complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: HscB is an inferred component of the specialized transfer machinery.
    action: ACCEPT
    reason: Specific HscB identity, curated HscA binding and activation, and homolog ternary-complex reconstitution
      support transfer-complex membership. The published stoichiometry is experimental context for homologs,
      not a measured native KT2440 stoichiometry.
    supported_by:
