    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/hscB/hscB-uniprot.txt
    title: UniProtKB entry for hscB (Q88PK5)
    findings:
      - statement: Reviewed HAMAP and InterPro identify Q88PK5 as the dedicated HscB Fe-S assembly co-chaperone.
core_functions:
  - description: Binds HscA and stimulates its ATPase cycle while targeting it to cluster-bearing IscU during Fe-S transfer.
    molecular_function:
      id: GO:0001671
      label: ATPase activator activity
    directly_involved_in:
      - id: GO:0044571
        label: '[2Fe-2S] cluster assembly'
    in_complex:
      id: GO:1990230
      label: iron-sulfur cluster transfer complex
    supported_by:
      - reference_id: file:PSEPK/hscB/hscB-uniprot.txt
        supporting_text: DR   InterPro; IPR004640; HscB.
    knowledge_gaps:
      - gap_statement: Q88PK5 interaction kinetics with KT2440 IscU and HscA have not been measured.
        significance: Family evidence establishes the dedicated role but not the quantitative contribution to cluster transfer.
proposed_new_terms: []
suggested_questions:
  - question: Does Q88PK5 target HscA exclusively to IscU or also to other Fe-S carriers?
suggested_experiments:
  - description: Measure Q88PK5-dependent stimulation of Q88PK4 ATPase activity with apo- and cluster-bound Q88PK7.
