- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Structured-IscU stabilization leaves the contribution to a folding endpoint unresolved.
    action: UNDECIDED
    reason: PMID22782893 shows that E. coli HscB preferentially stabilizes structured IscU. PMID9852006
      finds no autonomous Hsc20 antiaggregation on tested model clients and no Hsc66/Hsc20 luciferase
      reactivation, but these results do not exclude cofactor assistance to formation of another functional
      fold. Equilibrium selection of a structured state does not itself resolve folding kinetics or a
      recovered-activity endpoint. The folding claim remains genuinely uncertain, not a concluded false
      claim disguised as UNDECIDED. These are comparative E. coli observations; the KT2440 protein has
      not been tested for this endpoint.
    supported_by:
    - reference_id: PMID:22782893
      supporting_text: Upon the addition of equimolar HscB, %S increased to 93.
    - reference_id: PMID:9852006
      supporting_text: Hsc20, unlike DnaJ, did not exhibit intrinsic chaperone activity
