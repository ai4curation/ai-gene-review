  - statement: Reviewed HAMAP and InterPro identify Q88PK5 as the dedicated HscB Fe-S assembly co-chaperone.
- id: PMID:18986169
  title: Studies on the mechanism of catalysis of iron-sulfur cluster transfer from IscU[2Fe2S] by HscA/HscB
    chaperones.
  findings:
  - statement: ATP-dependent HscA/HscB cluster-transfer reconstitution supports the cochaperone role and
      transient complex participation.
    supporting_text: HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an absolute requirement
      for both HscB and ATP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract-only bacterial homolog biochemistry. No KT2440 assay or native target
      stoichiometry is claimed.
- id: PMID:22782893
  title: Specialized Hsp70 chaperone (HscA) binds preferentially to the disordered form, whereas J-protein
    (HscB) binds preferentially to the structured form of the iron-sulfur cluster scaffold protein (IscU).
  findings:
  - statement: E. coli HscB preferentially binds structured IscU whereas HscA stabilizes its disordered
      form.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text E. coli NMR/kinetic study. Scaffold conformational selection is not automatically
      evidence for a generic target protein-refolding process.
core_functions:
- description: Binds HscA and stimulates its ATPase cycle while targeting it to cluster-bearing IscU during
    Fe-S transfer.
