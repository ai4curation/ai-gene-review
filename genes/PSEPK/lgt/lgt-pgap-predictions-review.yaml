id: Q88CN8
gene_symbol: lgt
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_5142
description: >-
  NCBI PGAP names WP_010955678.1 "prolipoprotein diacylglyceryl transferase"
  from the TIGR00544 equivalog HMM and passes on EC 2.5.1.145 and three GO
  terms. The name, the EC number and phosphatidylglycerol-prolipoprotein
  diacylglyceryl transferase activity are correct and match the main review.
  Membrane is true but less precise than the accepted plasma membrane. Protein
  lipoylation (GO:0009249) is wrong: it is the attachment of lipoic acid to a
  lysine, whereas Lgt transfers a diacylglyceryl group from
  phosphatidylglycerol to the N-terminal cysteine of a prolipoprotein, the
  first step of lipoprotein biosynthesis. The two processes share only the
  "lipo-" prefix. The error lies in the GO mapping of the TIGR00544 model
  itself and so reaches every Lgt that model names; the subfamily model
  NF013915 for the same protein carries the correct process, lipoprotein
  biosynthetic process (GO:0042158).
