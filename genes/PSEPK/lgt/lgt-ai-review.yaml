      supporting_text: Reaction=L-cysteinyl-[prolipoprotein] + a 1,2-diacyl-sn-glycero-3-
    - reference_id: PMID:26729647
      supporting_text: Arg143 and Arg239, that are essential for diacylglyceryl transfer.
    - reference_id: file:analysis/module_audits/bacterial_lipoprotein_maturation/psepk-consultation/evidence.md
