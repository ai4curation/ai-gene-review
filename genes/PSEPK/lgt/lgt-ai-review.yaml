    label: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GO:0008961 is the exact molecular function for Lgt.
    action: ACCEPT
    reason: Q88CN8/PP_5142 has the Lgt HAMAP MF_01147, Pfam PF01790 and InterPro IPR001640 assignments
      plus polytopic membrane architecture. E. coli primary chemistry and the independently conserved
      functional arginines support transfer of the diacylglyceryl group to the prospective mature N-terminal
      cysteine thiol. PP_4236/Q88F63 is a different DsbE record and is not evidence for this target. Native
      KT2440 activity has not been directly demonstrated in the consulted sources. The 2026 comparative
      study demonstrates homolog-dependent substrate and complementation differences, so this assignment
      does not imply identical substrate repertoire or interchangeable in vivo behavior.
    supported_by:
