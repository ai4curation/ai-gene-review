- id: file:PSEPK/lgt/lgt-deep-research-openscientist.md
  title: OpenScientist gene research for lgt
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Genuine existing provider research reused as a literature lead. Primary assay organisms
      and frozen target features were independently checked in the source consultation. Generic essentiality,
      universal pathway order, exact donor preferences and predicted structural geometry are not treated
      as KT2440 measurements. Its sequence claims are independently qualified by the parameter-sensitive
      alignment panel.
  findings:
  - statement: The OpenScientist gene report confirms Q88CN8/PP_5142 as a bona fide Lgt-family phosphatidylglycerol--prolipoprotein
      diacylglyceryl transferase, finds no gene-symbol ambiguity, and notes that KT2440-specific biochemical
      evidence has not been located.
- id: file:analysis/module_audits/bacterial_lipoprotein_maturation/psepk-consultation/evidence.md
  title: PSEPK lipoprotein maturation source and sequence consultation
  findings:
  - statement: Frozen target identities, source assay organisms, current ontology and independent sequence
      checks distinguish conserved chemistry from native KT2440 assays.
    supporting_text: No target-specific assay or essentiality conclusion follows from this identity check.
- id: PMID:26729647
  title: Crystal structure of E. coli lipoprotein diacylglyceryl transferase.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached Results read, including donor assays, structure and complementation. No
      target-specific essentiality or kinetics transferred.
  findings:
  - statement: E. coli Lgt structural and biochemical studies establish membrane-associated diacylglyceryl
      transfer and functional roles for R143/R239; these are comparative, not KT2440, data.
    supporting_text: Arg143 and Arg239, that are essential for diacylglyceryl transfer.
- id: PMID:42126242
  title: Arm and head domain in highly conserved lipoprotein modification enzyme Lgt determine functional
    diversity among bacterial pathogens.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Figures3,6/Discussion read. P. aeruginosa Lgt is tested in an E. coli complementation
      host, not native KT2440. Arm/head substrate differences limit transfer of repertoire, kinetics and
      essentiality.
  findings:
  - statement: Homologs share Lgt chemistry but differ in substrate specificity and heterologous complementation;
      this bounds inference to the KT2440 target.
    supporting_text: 'Our results highlight similarities in

      catalytic mechanism and differences in substrate specificity'
