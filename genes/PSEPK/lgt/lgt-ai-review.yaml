id: Q88CN8
gene_symbol: lgt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Lgt (PP_5142) is an integral inner-membrane phosphatidylglycerol-prolipoprotein diacylglyceryl
  transferase. It transfers a diacylglyceryl group from phosphatidylglycerol to the thiol of the lipobox
  cysteine while the signal peptide remains attached, initiating bacterial lipoprotein maturation. The
  conserved Lgt-family assignment supports this activity in Pseudomonas putida KT2440.
