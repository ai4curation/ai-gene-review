id: Q88NF6
gene_symbol: PP_1255
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1255 is the FAD-dependent D-hydroxyproline dehydrogenase of the
  Pseudomonas putida KT2440 hydroxyproline-utilization locus, where it lies
  beside the epimerase proR, the deaminase PP_1257 and the candidate terminal
  dehydrogenase PP_1256. A homomeric FAD enzyme with this activity was
  purified from P. putida and oxidizes cis-4-hydroxy-D-proline to
  4-hydroxy-1-pyrroline-2-carboxylate using artificial electron acceptors in
  vitro; its physiological electron acceptor is unresolved. The assignment of
  that characterized enzyme to this locus rests on the submitted protein name
  and the gene neighbourhood rather than on a published locus tag.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: PP_1255 is predicted to be a soluble cytoplasmic FAD oxidoreductase.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localization is compatible with a soluble enzyme in the
      hydroxyproline-utilization locus, but it is a TreeGrafter inference and
      does not define the protein's substrate-specific role. The P. putida
      enzyme was purified as a soluble homomeric FAD protein, and the record
      has no transmembrane or signal-peptide feature.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        the former is a homomeric enzyme only containing FAD as a prosthetic group
- term:
    id: GO:0016645
    label: oxidoreductase activity, acting on the CH-NH group of donors
  evidence_type: IGC
  original_reference_id: PMID:22833679
  qualifier: enables
  review:
    summary: The KT2440 hydroxyproline locus encodes the characterized homomeric FAD D-hydroxyproline dehydrogenase, assigned to PP_1255 from genomic context.
    action: NEW
    reason: >-
      A homomeric FAD enzyme with this activity was purified from P. putida and
      shown to be specific for D-hydroxyproline. The activity itself is
      therefore directly measured, but nothing cited assigns it to this
      accession: the cached abstract names no locus tag and the full text was
      not reachable, and the UniProt protein name is submitter-imported
      (ECO:0000313), which this project does not treat as evidence. The
      assignment rests on genomic context, so IGC is the faithful evidence
      code rather than IDA: PP_1255 sits in the hydroxyproline locus beside
      proR, PP_1256 and PP_1257, the locus is the one the study reports as
      clustered, and the protein carries the DAAO-superfamily FAD signature
      that genome-neighbourhood analysis assigns to this step. GO:0016645 is
      the closest existing molecular-function term but does not capture the
      substrate, hence the proposed term below.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        D-hydroxyproline dehydrogenases from P. putida and P. aeruginosa were completely different from known bacterial proline dehydrogenases and showed similar high specificity for substrate (D-hydroxyproline) and some artificial electron acceptor(s).
- term:
    id: GO:0019470
    label: trans-4-hydroxy-L-proline catabolic process
  evidence_type: IGC
  original_reference_id: PMID:22833679
  qualifier: involved_in
  review:
    summary: The locus-encoded oxidase performs the second step of the four-reaction route from hydroxyproline to 2-oxoglutarate.
    action: NEW
    reason: >-
      The study places the characterized D-hydroxyproline dehydrogenase in the
      four-step P. putida route from L-hydroxyproline to 2-oxoglutarate, and
      the enzyme performs that oxidation itself, so this is participation
      rather than mere necessity. As for the molecular function, the step is
      attributed to this accession from genomic context, not from a published
      locus tag, so the evidence code is IGC.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        Here, we identified and characterized for the first time two novel enzymes, D-hydroxyproline dehydrogenase and Δ(1)-pyrroline-4-hydroxy-2-carboxylate (Pyr4H2C) deaminase, involved in this hypothetical pathway.
