id: Q88NF6
gene_symbol: PP_1255
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_1255 is a predicted FAD-dependent cis-4-hydroxy-D-proline oxidase. In the
  KT2440 hydroxyproline-utilization locus it follows ProR and is expected to
  oxidize cis-4-hydroxy-D-proline to
  4-hydroxy-1-pyrroline-2-carboxylate for subsequent deamination.
