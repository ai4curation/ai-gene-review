  qualifier: located_in
  review:
    summary: PP_1255 is predicted to be a soluble cytoplasmic FAD oxidoreductase.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localization is compatible with a soluble enzyme in the
      hydroxyproline-utilization locus, but it is a TreeGrafter inference and
      does not define the protein's substrate-specific role.
