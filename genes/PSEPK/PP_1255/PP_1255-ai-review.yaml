suggested_questions:
- question: >-
    What physiological electron acceptor couples PP_1255 oxidation to the
    respiratory chain in vivo?
suggested_experiments:
- description: >-
    Purify PP_1255 and assay cis-4-hydroxy-D-proline oxidation with candidate
    flavin electron acceptors while identifying the product by LC-MS.
  experiment_type: biochemical activity assay
