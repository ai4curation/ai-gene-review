id: Q88NF6
gene_symbol: PP_1255
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_1255 is an experimentally characterized FAD-dependent
  D-hydroxyproline dehydrogenase in the KT2440 hydroxyproline-utilization
  locus. The homomeric enzyme oxidizes cis-4-hydroxy-D-proline to
  4-hydroxy-1-pyrroline-2-carboxylate and uses artificial electron acceptors
  in vitro; its physiological electron acceptor remains unresolved.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: PP_1255 is predicted to be a soluble cytoplasmic FAD oxidoreductase.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localization is compatible with a soluble enzyme in the
      hydroxyproline-utilization locus, but it is a TreeGrafter inference and
      does not define the protein's substrate-specific role.
- term:
    id: GO:0016645
    label: oxidoreductase activity, acting on the CH-NH group of donors
  evidence_type: IDA
  original_reference_id: PMID:22833679
  qualifier: enables
  review:
    summary: PP_1255 oxidizes the CH-NH group of cis-4-hydroxy-D-proline.
    action: NEW
    reason: >-
      Direct biochemical characterization establishes the FAD-dependent
      D-hydroxyproline dehydrogenase reaction. GO:0016645 is the closest valid
      existing molecular-function term, but it does not capture the substrate.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        D-hydroxyproline dehydrogenases from P. putida and P. aeruginosa were completely different from known bacterial proline dehydrogenases and showed similar high specificity for substrate (D-hydroxyproline) and some artificial electron acceptor(s).
- term:
    id: GO:0019470
    label: trans-4-hydroxy-L-proline catabolic process
  evidence_type: IDA
  original_reference_id: PMID:22833679
  qualifier: involved_in
  review:
    summary: PP_1255 catalyzes the oxidative step of bacterial hydroxyproline catabolism.
    action: NEW
    reason: >-
      The target-species study identifies and characterizes PP_1255's enzyme
      activity as part of the four-step route from hydroxyproline to
      2-oxoglutarate.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        Here, we identified and characterized for the first time two novel enzymes, D-hydroxyproline dehydrogenase and Δ(1)-pyrroline-4-hydroxy-2-carboxylate (Pyr4H2C) deaminase, involved in this hypothetical pathway.
