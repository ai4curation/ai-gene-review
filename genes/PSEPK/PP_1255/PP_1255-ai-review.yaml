  proposed_definition: >-
    Catalysis of the oxidation of cis-4-hydroxy-D-proline to
    4-hydroxy-1-pyrroline-2-carboxylate using an electron acceptor.
  justification: >-
    PP_1255 has direct substrate-specific biochemical evidence, but GO currently
