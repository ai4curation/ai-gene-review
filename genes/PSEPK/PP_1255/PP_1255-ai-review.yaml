proposed_new_terms:
- proposed_name: cis-4-hydroxy-D-proline dehydrogenase activity
  proposed_definition: >-
    Catalysis of the oxidation of cis-4-hydroxy-D-proline to
    4-hydroxy-1-pyrroline-2-carboxylate using an electron acceptor.
  justification: >-
    PP_1255 has direct substrate-specific biochemical evidence, but GO currently
    provides only the broad donor-class parent. The physiological electron
    acceptor is unresolved, so the proposed term should remain acceptor-neutral.
