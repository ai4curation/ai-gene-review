      supporting_text: "PTN000044713\tGO:0051997\tF\tIBD"
    - reference_id: file:PSEPK/pucL/pucL-deep-research-openscientist.md
      supporting_text: >-
        encodes **2‑oxo‑4‑hydroxy‑4‑carboxy‑5‑ureidoimidazoline (OHCU)
        decarboxylase (EC 4.1.1.97)**
- term:
