    label: 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      OHCU decarboxylase activity is the specific core molecular function of
      PucL.
    action: ACCEPT
    reason: >-
      EC 4.1.1.97, RHEA:26301, the OHCU-decarboxylase InterPro family, and a
