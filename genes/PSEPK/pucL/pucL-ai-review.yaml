id: Q88F12
gene_symbol: pucL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PucL (PP_4287) is an OHCU decarboxylase (EC 4.1.1.97) that catalyzes the third
  reaction of urate oxidation, converting
  2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline to (S)-allantoin and carbon
  dioxide. It completes the stereospecific urate-to-allantoin sequence after
  PuuD-dependent oxidation and PucM-mediated hydrolysis.
existing_annotations:
- term:
    id: GO:0000255
    label: allantoin metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      PucL forms (S)-allantoin, so allantoin metabolism is valid but broad
      product-level context.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is true because PucL generates allantoin, but the more
      precise core process is urate catabolism and the specific MF captures the
      terminal reaction.
    supported_by:
    - reference_id: file:PSEPK/pucL/pucL-uniprot.txt
      supporting_text: >-
        Reaction=5-hydroxy-2-oxo-4-ureido-2,5-dihydro-1H-imidazole-5-
