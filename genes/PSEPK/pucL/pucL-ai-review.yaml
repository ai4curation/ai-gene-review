suggested_questions:
- question: >-
    Is Q88F12 kinetically coupled to Q88F14 strongly enough to prevent
    accumulation and nonenzymatic decay of OHCU in vivo?
suggested_experiments:
- description: >-
    Measure purified Q88F12 OHCU decarboxylase kinetics and determine allantoin
    stereochemistry and OHCU accumulation in a pucL deletion strain.
  experiment_type: enzyme kinetics, genetics, and chiral metabolite analysis
