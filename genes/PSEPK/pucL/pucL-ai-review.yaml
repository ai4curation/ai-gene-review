- id: file:PSEPK/pucL/pucL-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK pucL
  findings:
  - statement: >-
      The report independently recovers Q88F12 as the OHCU decarboxylase that
      forms (S)-allantoin in the terminal pathway reaction.
    supporting_text: >-
      encodes **2‑oxo‑4‑hydroxy‑4‑carboxy‑5‑ureidoimidazoline (OHCU)
      decarboxylase (EC 4.1.1.97)**
  - statement: >-
      UniProt classifies the target as predicted rather than directly assayed.
    supporting_text: >-
      function inferred from homology/annotation; no direct experimental study
      of this specific protein
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      The target identity and third-step reaction are corroborative. The report
      nevertheless overlooks Q88F11/PP_4289 and declares the PuuD entry step a
      pathway hole, while also transferring homolog-derived localization,
      oligomer, and residue claims to Q88F12. Those claims were rejected.
