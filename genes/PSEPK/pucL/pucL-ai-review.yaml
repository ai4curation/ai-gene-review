    label: urate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      PucL performs the terminal reaction of the urate-to-allantoin pathway.
    action: ACCEPT
    reason: >-
      UniPathway and PANTHER propagation place Q88F12 in urate catabolism, and
      the exact Rhea reaction forms (S)-allantoin from the OHCU intermediate.
    supported_by:
