    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic oxidoreductase activity is true of the SoxABDG complex but uninformative; the specific
      activity is the folate-coupled sarcosine oxidase reaction.
    action: MODIFY
    reason: InterPro2GO (GO_REF:0000002) maps the generic FAD/NAD-binding domain IPR023753 to oxidoreductase
      activity. The term is correct but far more general than the evidence supports, so it is refined to the
      proposed folate-coupled sarcosine oxidase activity, the redox reaction this domain contributes to in
      the assembled complex. As for the GO:0008115 row, SoxA contributes to the complex activity rather than
      enabling it alone. This proposed replacement denotes the activity to which SoxA contributes; it is not
      an autonomous SoxA enzyme assertion. Core synthesis uses the existing oxygen-dependent parent because
      the schema cannot point a contributes_to slot at a proposed term.
