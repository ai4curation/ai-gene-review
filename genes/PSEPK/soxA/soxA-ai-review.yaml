- term:
    id: GO:0046653
    label: tetrahydrofolate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: SoxABDG consumes tetrahydrofolate and forms 5,10-methylenetetrahydrofolate, and SoxA carries the
      folate-binding site.
    action: ACCEPT
    reason: InterPro2GO (GO_REF:0000002) mapping from the SoxA family signature IPR006277. Heterotetrameric
      sarcosine oxidases use tetrahydrofolate as a substrate and form the methylene derivative, and in the
      characterised orthologue the folate binds the alpha subunit, so SoxA performs part of this tetrahydrofolate
      conversion. The more specific GO:0035999 tetrahydrofolate interconversion covers transfer of one-carbon
      units between folate molecules, which is not what happens here, so the general term is as precise as
      warranted.
    supported_by:
    - reference_id: PMID:9185627
      supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates
        as substrates
    - reference_id: PMID:15946648
      supporting_text: The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The 2Fe-2S domain signature in SoxA reflects a fold, not a cluster; characterised heterotetrameric
      sarcosine oxidases contain no iron-sulfur cofactor.
    action: REMOVE
    reason: InterPro2GO (GO_REF:0000002) mapping from IPR001041 (2Fe-2S ferredoxin-type domain); the current
      entry carries the related IPR042204 2Fe-2S-bd_N and Pfam Fer2_4 matches in the N-terminal region. Independent
      biochemical and structural characterisations of heterotetrameric sarcosine oxidases list the full prosthetic-group
      inventory as FAD, FMN, NAD and a zinc ion, with the alpha subunit holding NAD and folate; no iron-sulfur
      cluster has been reported. The electronic mapping is therefore wrong for this subfamily. The cofactor
      reinvestigation of the purified Corynebacterium sp. U-96 enzyme found only NAD+, FAD and covalent FMN,
      and the crystal structure assigns a single zinc to SoxD.
    supported_by:
    - reference_id: PMID:11902668
      supporting_text: The enzyme was found to contain 1 mol of non-covalently-bound NAD+, 1 mol of non-covalently-bound
        FAD, and 1 mol of covalent FMN.
    - reference_id: PMID:16934831
      supporting_text: The enzyme contains four subunits (α, β, γ, δ ), three coenzymes (NAD, FMN, FAD), a
