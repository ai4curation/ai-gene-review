gene_symbol: soxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SoxA (PP_0325) is the large alpha subunit of the cytosolic heterotetrameric sarcosine oxidase SoxABDG.
  The assembled enzyme oxidises sarcosine at the flavin site of the beta subunit and transfers the oxidised methyl
  group to tetrahydrofolate, forming glycine, 5,10-methylenetetrahydrofolate and hydrogen peroxide; without folate
  the imine intermediate is hydrolysed to glycine and formaldehyde. SoxA belongs to the GcvT (aminomethyltransferase)
  family, carries an FAD/NAD(P)-binding domain and, in the characterised orthologous enzyme, binds NAD and the folate
  cofactor, so it supplies the folate-handling half of the bifunctional reaction rather than an independent activity.
  In KT2440 the complex acts in sarcosine catabolism downstream of creatine and glycine betaine degradation.
