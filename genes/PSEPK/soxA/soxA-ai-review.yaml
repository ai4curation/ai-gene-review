core_functions:
- description: Folate- and NAD-binding alpha subunit of the heterotetrameric sarcosine oxidase SoxABDG, which converts
    sarcosine, tetrahydrofolate and O2 to glycine, 5,10-methylenetetrahydrofolate and H2O2 (EC 1.5.3.24); SoxA supplies
    the folate site that accepts the oxidised methyl group. The folate-free formaldehyde-forming reaction (GO:0008115)
    is a conditional secondary activity of the complex.
  proposed_molecular_function: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  directly_involved_in:
  - id: GO:0046653
    label: tetrahydrofolate metabolic process
  supported_by:
  - reference_id: PMID:15946648
    supporting_text: The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid.
  - reference_id: PMID:16934831
    supporting_text: In a second reaction, TSOX catalyzes the transfer of the oxidized 1-carbon fragment from the
      sarcosine imine
  - reference_id: PMID:35266867
    supporting_text: sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase
      (SoxBDAG)
  - reference_id: PMID:9185627
    supporting_text: the heterotetrameric enzymes catalyzed the formation of 5,10-methylenetetrahydropteroyltriglutamate
proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This is the physiological reaction of heterotetrameric SoxABDG-type sarcosine oxidases (EC 1.5.3.24,
    RHEA:70455). GO:0008115 sarcosine oxidase activity is defined by the formaldehyde-forming reaction (EC 1.5.3.1,
    RHEA:13313), which these enzymes perform only when folate is absent, so no current GO term captures transfer
    of the oxidised methyl group to tetrahydrofolate.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates
      as substrates
  - reference_id: PMID:16934831
    supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine imine
      is hydrolyzed to glycine and formaldehyde.
suggested_questions:
- question: Does the KT2440 SoxABDG complex contain any iron-sulfur centre associated with the SoxA N-terminal 2Fe-2S-like
    domain, or is this domain purely a structural fold as in characterised orthologues?
- question: Should GO create a folate-coupled sarcosine oxidase term (EC 1.5.3.24) distinct from GO:0008115, so
    that electronic EC 1.5.3.1 mappings stop assigning the formaldehyde-forming reaction to tetrameric enzymes?
suggested_experiments:
- description: Purify KT2440 SoxABDG and measure tetrahydrofolate-dependent 5,10-methylenetetrahydrofolate formation
    versus formaldehyde release, and determine iron content by ICP-MS or EPR to test the 2Fe-2S domain label.
