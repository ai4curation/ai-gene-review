id: Q88R09
gene_symbol: soxA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SoxA (PP_0325) is the alpha subunit of the cytosolic SoxABDG sarcosine
  oxidase complex. The heterotetramer oxidatively demethylates sarcosine to
  glycine, coupling the one-carbon unit to tetrahydrofolate and reducing oxygen
  to hydrogen peroxide. SoxA contributes catalytic and cofactor-binding
  architecture but does not independently execute the complete reaction.
existing_annotations:
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The activity belongs to the SoxABDG complex rather than isolated SoxA.
      action: REMOVE
      reason: SoxA is one of four required subunits, so the enables relation is incorrect; a separate contributes_to annotation is proposed below.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately 10A apart."
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: ISS
    original_reference_id: PMID:15946648
    qualifier: contributes_to
    review:
      summary: SoxA contributes to sarcosine oxidase activity as the alpha subunit of the heterotetramer.
      action: NEW
      reason: The characterized orthologous complex places the redox cofactors in SoxB and requires the assembled heterotetramer.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "Sarcosine oxidase from Corynebacterium sp. U-96 is a heterotetrameric enzyme."
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Broad oxidoreductase activity is executed by the assembled SoxABDG complex, not isolated SoxA.
      action: REMOVE
      reason: The enables relation is incorrect for a non-independent subunit; a separate contributes_to annotation is proposed below.
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: ISS
    original_reference_id: PMID:15946648
    qualifier: contributes_to
    review:
      summary: SoxA contributes folate-handling and assembly functions to the heterotetrameric oxidoreductase.
      action: NEW
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid."
  - term:
      id: GO:0046653
      label: tetrahydrofolate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The physiological SoxABDG reaction produces 5,10-methylenetetrahydrofolate.
      action: ACCEPT
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The InterPro name describes a ferredoxin-like fold, not an experimentally bound Fe-S cluster.
      action: REMOVE
      reason: >-
        The characterized alpha subunit contains NAD(+) and binds folinic acid,
        while the complete structural cofactor inventory assigns FAD/FMN to
        SoxB and zinc to SoxD, with no Fe-S cofactor. Q88R09 also lacks an
        N-terminal cysteine cluster expected for Fe-S coordination.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid."
        - reference_id: file:PSEPK/soxA/soxA-deep-research-openscientist.md
          supporting_text: "The 2Fe-2S signature (IPR042204) appears in the InterPro annotation, but classical TSOX α-subunits are not described as iron-sulfur proteins in the biochemical literature reviewed; this domain match may reflect a distant fold relationship rather than a functional [2Fe-2S] cluster and warrants caution."
  - term:
      id: GO:0032921
      label: sarcosine oxidase complex
    evidence_type: NAS
    original_reference_id: PMID:35266867
    qualifier: part_of
    review:
      summary: SoxA is the alpha subunit of tetrameric SoxBDAG.
      action: NEW
      reason: This is a same-species author background statement, not a direct SoxABDG assay or sequence-similarity experiment.
      supported_by:
        - reference_id: PMID:35266867
          supporting_text: "tetrameric sarcosine oxidase (SoxBDAG)"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/soxA/soxA-uniprot.txt
    title: UniProtKB entry for soxA (Q88R09)
    findings:
      - statement: Q88R09 has alpha-subunit-specific and 2Fe-2S-binding domain signatures.
  - id: file:PSEPK/soxA/soxA-deep-research-openscientist.md
    title: OpenScientist research report for soxA (Q88R09)
    findings:
      - statement: The report localizes folate handling to SoxA and substrate oxidation to SoxB while flagging the Fe-S assignment as uncertain.
  - id: PMID:35266867
    title: Creatine utilization as a sole nitrogen source in Pseudomonas putida KT2440 is transcriptionally regulated by CahR.
    findings:
      - statement: KT2440 uses tetrameric SoxBDAG to convert sarcosine to glycine.
        supporting_text: "tetrameric sarcosine oxidase (SoxBDAG)"
  - id: PMID:15946648
    title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
    findings:
      - statement: The characterized heterotetramer contains NAD, FAD, FMN, and zinc rather than an Fe-S cluster.
        supporting_text: "The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid. The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately 10A apart. The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding structure. The delta subunit contains a single atom of zinc and has a Cys(3)His zinc finger structure."
core_functions:
  - description: >-
      Alpha subunit contributing folate-handling architecture to bifunctional
      SoxABDG; GO:0008115 captures the conditional formaldehyde-producing
      oxidase branch, while the physiological folate-coupled reaction lacks a
      suitable GO molecular-function term.
    contributes_to_molecular_function:
      id: GO:0008115
      label: sarcosine oxidase activity
    in_complex:
      id: GO:0032921
      label: sarcosine oxidase complex
    supported_by:
      - reference_id: PMID:35266867
        supporting_text: "tetrameric sarcosine oxidase (SoxBDAG)"
proposed_new_terms: []
suggested_questions:
  - question: Which SoxA cofactors are assembled in KT2440 under sarcosine-utilizing conditions?
suggested_experiments:
  - description: Reconstitute SoxABDG and test loss of SoxA on complex assembly, cofactor content, and sarcosine oxidation.
