    id: GO:0008675
    label: 2-dehydro-3-deoxy-phosphogluconate aldolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This annotation captures the specific catalytic activity named in UniProt and matches the recorded EC 4.1.2.14 reaction that cleaves KDPG into glyceraldehyde 3-phosphate and pyruvate. It is the core molecular function of Eda.
    action: ACCEPT
    reason: Q88P29 matches the KDPG aldolase-specific NCBIfam model TIGR01182 (eda), the Pfam Aldolase domain and both KDPG/KHG aldolase PROSITE active-site signatures. That family membership supports the KDPG aldolase activity characterised biochemically and structurally for E. coli and T. maritima family members (PMID:16403639). The UniProt reaction line rests only on an ARBA rule and is not cited. The gene sits in the zwf-pgl-eda operon, cloned from P. putida strain H and highly similar to the KT2440 copy, whose third gene encodes KDPG aldolase (PMID:12393206). No KT2440-specific kinetic assay is cached, so this is family-level support.
    supported_by:
    - reference_id: file:PSEPK/eda/eda-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01182; eda; 1.'
