taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: eda encodes the canonical 2-dehydro-3-deoxy-phosphogluconate (KDPG) aldolase of Pseudomonas putida KT2440. The 235 aa enzyme belongs to the KHG/KDPG aldolase family and catalyzes cleavage of KDPG to pyruvate and glyceraldehyde 3-phosphate, which is the carbon-splitting step of the Entner-Doudoroff route from 6-phosphogluconate. UniProt also places the protein in 2-dehydro-3-deoxy-D-gluconate degradation step 2/2 and predicts a homotrimeric enzyme.
