- term:
    id: GO:0061678
    label: Entner-Doudoroff pathway
  evidence_type: IEA
  original_reference_id: file:PSEPK/eda/eda-uniprot.txt
  review:
    summary: The UniProt pathway statement places Eda in 2-dehydro-3-deoxy-D-gluconate degradation step 2/2, which is the terminal aldol-cleavage step of the Entner-Doudoroff pathway. This process-level annotation is missing from GOA and should be added. (Previously proposed as GO:0009255 Entner-Doudoroff pathway through 6-phosphogluconate, which GO obsoleted with replaced_by GO:0061678.)
    action: NEW
    reason: Eda itself performs a step of the Entner-Doudoroff route, the KDPG aldolase cleavage that produces pyruvate and glyceraldehyde 3-phosphate from KDPG, so the process term reflects participation, not mere requirement. The activity rests on family membership (NCBIfam TIGR01182 eda) and on the mechanism established for E. coli and T. maritima KDPG aldolases (PMID:16403639). The eda gene is co-transcribed with zwf and pgl, upstream enzymes of the same route, in a carbohydrate-induced operon (PMID:12393206, strain H operon highly similar to KT2440). KT2440 glycolysis runs almost exclusively through the ED route (PMID:26350459), which gives organismal context but does not name eda. The UniProt PATHWAY line rests only on an ARBA rule, and the eda mutant phenotype reported in deep research is not in the cached abstract of PMID:23967821, so neither is cited.
    supported_by:
    - reference_id: file:PSEPK/eda/eda-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01182; eda; 1.'
    - reference_id: PMID:16403639
      supporting_text: In vivo, 2-keto-3-deoxy-6-phosphogluconate (KDPG) aldolase catalyzes the reversible, stereospecific retro-aldol cleavage of KDPG to pyruvate and D-glyceraldehyde-3-phosphate.
    - reference_id: PMID:12393206
