- id: PMID:12393206
  title: Analysis of the zwf-pgl-eda-operon in Pseudomonas putida strains H and KT2440.
  findings:
  - statement: In KT2440, eda is part of the zwf-pgl-eda operon, with the divergently transcribed regulator hexR nearby; the operon is induced by carbohydrates including glucose, gluconate, fructose, and glycerol.
  - statement: Operon transcription in KT2440 was about 3-fold higher than in strain H, indicating strain-level differences in expression control.
- id: PMID:23967821
  title: Metabolic and regulatory rearrangements underlying glycerol metabolism in Pseudomonas putida KT2440.
  findings:
  - statement: An eda::mini-Tn5 mutant in KT2440 fails to grow on glucose but grows slowly on glycerol (mu=0.21+/-0.05 h^-1) and succinate (mu=0.34+/-0.02 h^-1).
  - statement: Eda activity in extracts of glucose-grown KT2440 is 635+/-141 units, 2.2-fold higher than on glycerol; transcript expression hierarchy is glucose greater than glycerol greater than succinate.
- id: PMID:26350459
  title: Pseudomonas putida KT2440 strain metabolizes glucose through a cycle formed by enzymes of the Entner-Doudoroff, Embden-Meyerhof-Parnas, and pentose phosphate pathways.
  findings:
  - statement: In KT2440, more than 80 percent of glucose influx is routed through periplasmic oxidation and the Entner-Doudoroff pathway contributes about 50 percent of the flux to pyruvate, placing Eda at a high-flux node in central carbon metabolism.
- id: PMID:16403639
  title: Mechanism of the Class I KDPG aldolase.
  findings:
  - statement: Class I KDPG aldolases including the Pseudomonas putida enzyme operate via a Schiff-base (covalent imine) intermediate formed by a conserved active-site lysine, with a conserved glutamate as general acid/base; the fold is a TIM (alpha/beta) barrel forming a trimeric assembly.
- id: PMID:39589324
  title: GnuR Represses the Expression of Glucose and Gluconate Catabolism in Pseudomonas putida KT2440.
  findings:
  - statement: GnuR is a transcriptional repressor that directly represses glucose and gluconate catabolic genes including ED-pathway genes such as eda (ChIP-seq enrichment ~1.74 at the eda locus), participating in an incoherent feedforward loop with glucose/gluconate induction.
  - statement: ΔgnuR shortens lag time on 22 mM glucose or 4 mM gluconate without changing exponential growth rate, indicating GnuR primarily tunes transition dynamics for catabolite switching.
- id: file:PSEPK/eda/eda-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: eda (PP_1024; UniProt Q88P29) in Pseudomonas putida KT2440'
  findings:
  - statement: eda is PP_1024 and encodes KDPG aldolase (EC 4.1.2.14), matching UniProt Q88P29, disambiguating it from unrelated proteins sharing the eda symbol.
    supporting_text: |-
      In *Pseudomonas putida* KT2440, **eda is PP_1024** and encodes **2-keto-3-deoxy-6-phosphogluconate (KDPG) aldolase** (EC **4.1.2.14**), consistent with UniProt **Q88P29** and the KHG/KDPG aldolase family annotation.
  - statement: Eda catalyzes the defining aldolase step of the Entner-Doudoroff pathway, cleaving KDPG to pyruvate and glyceraldehyde-3-phosphate.
    supporting_text: |-
      **Eda (KDPG aldolase)** catalyzes the defining aldolase step of the Entner–Doudoroff (ED) pathway: **cleavage of KDPG to pyruvate and glyceraldehyde-3-phosphate (GAP/G3P)**.
  - statement: The ED route is a high-flux central node in KT2440 glucose catabolism, with most glucose influx via periplasmic oxidation and ~50% of pyruvate flux through the ED pathway.
    supporting_text: |-
      A ^13C-based flux analysis framework described that **>80% of glucose influx** is routed through periplasmic oxidation, and the ED pathway contributes **~50% of the flux to pyruvate formation** under the tested conditions.
  - statement: Eda sits at a high-flux node in the characteristic glucose-utilization architecture of KT2440.
    supporting_text: |-
      Thus, Eda (PP_1024) sits at a high-flux node in KT2440’s characteristic glucose-utilization architecture.
  - statement: A KT2440 eda mini-Tn5 mutant fails to grow on glucose, demonstrating that eda is required for hexose catabolism through the ED pathway.
    supporting_text: |-
      A KT2440 **eda::mini-Tn5** mutant **failed to grow on glucose**, consistent with ED pathway indispensability for glucose utilization in this organism.
  - statement: Eda acts in the cytosol on the phosphorylated intermediate KDPG, downstream of periplasmic glucose oxidation.
    supporting_text: |-
      However, the functional placement of Eda in the ED pathway (acting on **KDPG**, a cytosolic phosphorylated intermediate formed from 6-phosphogluconate) and the separation of periplasmic oxidation from cytosolic catabolism in KT2440’s glucose architecture support that Eda operates in the **cytosol** rather than in the periplasm.
  - statement: Eda belongs to the KDPG/KHG aldolase family; direct KT2440 biochemical specificity for KHG versus KDPG was not measured, so KHG activity remains an inference from family membership.
    supporting_text: |-
      The UniProt/domain context and one KT2440 paper’s annotation terminology reflect that Eda belongs to the **KDPG/KHG aldolase family** (sometimes annotated as ketodeoxyphosphogluconate/ketohydroxyglutarate aldolase).
  - statement: eda is part of the carbohydrate-induced zwf-pgl-eda operon adjacent to the divergent regulator hexR in KT2440.
    supporting_text: |-
      In KT2440, **eda is part of the zwf–pgl–eda operon**, and this operon was cloned together with part of the divergently transcribed regulator **hexR**. The operon is **induced by carbohydrates** including glucose, gluconate, fructose, and glycerol.
proposed_new_terms: []
suggested_questions:
- question: Does PP_1024 act strictly on KDPG in vivo, or does it also process related 2-keto-3-deoxy sugar phosphates such as KHG?
- question: Under which carbon-source conditions does eda become rate-limiting for central carbon flux in KT2440?
suggested_experiments:
- hypothesis: Eda is the primary KDPG aldolase required for Entner-Doudoroff flux from glucose oxidation products in KT2440.
  description: Construct an eda deletion and complemented strain, then compare growth and end-product formation on glucose, gluconate, and 2-ketogluconate.
  experiment_type: growth phenotype and complementation
- hypothesis: PP_1024 has strong substrate preference for KDPG over alternative 2-keto-3-deoxy sugar phosphates.
  description: Purify recombinant Eda and measure steady-state kinetics with KDPG and structurally related substrates such as KHG.
  experiment_type: enzymology
- hypothesis: Loss of eda redirects carbon flux upstream of KDPG during oxidative glucose metabolism.
  description: Perform 13C-tracer metabolomics or flux analysis in wild-type and eda mutant strains during growth on gluconate or glucose.
  experiment_type: metabolomics / flux analysis
