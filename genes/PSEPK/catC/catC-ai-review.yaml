status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: catC encodes a muconolactone delta-isomerase family enzyme (EC 5.3.3.4) in the catechol ortho-cleavage
  branch of the beta-ketoadipate pathway. In Pseudomonas putida KT2440, CatC acts downstream of catechol
  1,2-dioxygenase and muconate cycloisomerase to convert muconolactone to beta-ketoadipate enol-lactone,
  linking catechol degradation to the rest of central aromatic-compound assimilation.
