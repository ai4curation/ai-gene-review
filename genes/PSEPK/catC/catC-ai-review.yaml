- term:
    id: GO:0042952
    label: beta-ketoadipate pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: CatC clearly functions within the beta-ketoadipate pathway, but this term is broader than
      necessary. The gene product acts in the catechol ortho-cleavage branch specifically, rather than
      generically across the full beta-ketoadipate pathway.
    action: MODIFY
    reason: A more specific biological process term is available. UniProt places CatC at the catechol-derived
      step 3/3 of the pathway, and GO:0019615 captures the immediate process level better than the broader
      parent term GO:0042952.
    proposed_replacement_terms:
    - id: GO:0019615
      label: catechol catabolic process, ortho-cleavage
    supported_by:
    - reference_id: PMID:2449420
      supporting_text: These enzymes are required for the dissimilation of benzoate to beta-ketoadipate
        by Pseudomonas putida
    - reference_id: file:PSEPK/catC/catC-deep-research-falcon.md
      supporting_text: CatC functions in the **catechol branch of the β-ketoadipate pathway**, downstream
        of CatA and CatB.
