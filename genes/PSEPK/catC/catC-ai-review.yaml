  review:
    summary: 'This term is the core enzymatic activity of CatC: P. putida catC was identified as the muconolactone
      isomerase gene of the CatR-regulated catBC operon, required with catB for benzoate dissimilation,
      and Q88GK7 matches the muconolactone delta-isomerase family model.'
    action: ACCEPT
    reason: GO:0016159 is the specific activity that defines this enzyme. P. putida catC was identified
      as the muconolactone isomerase gene of the catBC operon, and Q88GK7 matches the muconolactone delta-isomerase
      family model.
