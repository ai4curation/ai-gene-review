  label: Pseudomonas putida KT2440
description: 'thiO (PP_0612) encodes the FAD-dependent glycine oxidase (EC 1.4.3.19) of Pseudomonas putida KT2440,
  a member of the D-amino acid oxidase (DAO) fold family, ThiO subfamily. It oxidizes glycine to glyoxyl imine (glycine
  imine) and hydrogen peroxide; the imine supplies the C2-N3 unit of the thiazole moiety of thiamine diphosphate
  and otherwise hydrolyzes spontaneously to glyoxylate and ammonia. The purified enzyme is monomeric with a non-covalently
  bound flavin, unlike the homotetrameric Bacillus and Geobacillus ThiO enzymes, and has narrow substrate specificity:
  glycine is preferred, sarcosine is also oxidized, and N-ethylglycine and D-proline are weak substrates. It is
  a soluble cytoplasmic enzyme.'
