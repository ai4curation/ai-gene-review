  - supporting_text: P. putida* ThiO is described as having **preference for glycine** and exhibiting **narrower
      substrate specificity**
  - supporting_text: reported to contain a **noncovalently bound flavin cofactor**
  - supporting_text: the recombinant enzyme is **monomeric**
  - supporting_text: links thiO to **thiamin (vitamin B1) thiazole biosynthesis**, describing ThiO as supplying
      **glyoxyl imine** needed for formation of the thiazole moiety
  - supporting_text: encoding a **FAD-dependent glycine/D-amino acid oxidase** catalyzing glycine oxidation to **2-iminoacetate**
  - supporting_text: does **not report experimental subcellular localization** information
  - supporting_text: the *P. putida* enzyme is **monomeric**, has **narrower substrate specificity**, and shows
      **weak activity/low affinity** toward D-proline
