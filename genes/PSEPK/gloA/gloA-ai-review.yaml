id: Q88GF8
gene_symbol: gloA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GloA is a metal-dependent glyoxalase I that catalyzes the first committed
  step of glutathione-dependent methylglyoxal detoxification. It converts the
  spontaneously formed methylglyoxal-glutathione hemithioacetal to
  (R)-S-lactoylglutathione, which is subsequently hydrolyzed by GloB.
existing_annotations:
  - term:
      id: GO:0004462
      label: lactoylglutathione lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining glyoxalase I activity of GloA.
      action: ACCEPT
      reason: The exact UniRule, Rhea reaction, catalytic residues, and glyoxalase-I family signatures support the assignment.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: Catalyzes the conversion of hemimercaptal, formed from
        - reference_id: file:PSEPK/gloA/gloA-goa.tsv
          supporting_text: "GO:0004462\tlactoylglutathione lyase activity"
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: GloA requires a divalent metal cofactor, but this generic binding term is not its core catalytic function.
      action: KEEP_AS_NON_CORE
      reason: Family rules support metal binding, while the physiological Ni2+-versus-Zn2+ preference of the KT2440 enzyme remains unresolved.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: Binds 1 nickel ion per subunit
  - term:
      id: GO:0051596
      label: methylglyoxal catabolic process
    evidence_type: ISS
    original_reference_id: file:PSEPK/gloA/gloA-uniprot.txt
    qualifier: involved_in
    review:
      summary: GloA performs step one of this exact two-reaction detoxification route.
      action: NEW
      reason: This is the current valid process term; the older route-specific GO:0019243 term exposed by UniProt is obsolete.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: '(R)-lactate from methylglyoxal: step 1/2'
