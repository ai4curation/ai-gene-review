id: Q88GF8
gene_symbol: gloA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Q88GF8 is predicted to be the metal-dependent glyoxalase I of Pseudomonas
  putida KT2440. It catalyzes the first committed step of
  glutathione-dependent methylglyoxal detoxification, converting the
  spontaneously formed methylglyoxal-glutathione hemithioacetal to
  (R)-S-lactoylglutathione for subsequent hydrolysis by GloB.
existing_annotations:
  - term:
      id: GO:0004462
      label: lactoylglutathione lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining glyoxalase I activity of GloA.
      action: ACCEPT
      reason: >-
        The exact UniRule, Rhea reaction, catalytic residues, and
        PTHR10374:SF30 signature support the assignment. Expression studies
        establish this activity for a P. putida glyoxalase I, although those
        historical studies do not establish that PP_3766/Q88GF8 was the locus
        tested.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: Catalyzes the conversion of hemimercaptal, formed from
        - reference_id: file:PSEPK/gloA/gloA-goa.tsv
          supporting_text: "GO:0004462\tlactoylglutathione lyase activity"
        - reference_id: PMID:11461144
          supporting_text: Pseudomonas putida glyoxalase I was expressed in the
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: GloA requires a divalent metal cofactor, but this generic binding term is not its core catalytic function.
      action: KEEP_AS_NON_CORE
      reason: >-
        The UniProt record contains both Ni2+ and Zn2+ COFACTOR blocks, while
        its PIRSR-derived residue-level BINDING features specify Zn2+. GlxI
        proteins occur in distinct Zn2+- and Ni2+-activated classes, so generic
        metal ion binding is justified but the physiological metal used by the
        KT2440 enzyme remains unresolved.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: Binds 1 nickel ion per subunit
        - reference_id: PMID:25557363
          supporting_text: can be divided into two classes
  - term:
      id: GO:0051596
      label: methylglyoxal catabolic process
    evidence_type: ISS
    original_reference_id: UniProtKB:P16635
    qualifier: involved_in
    review:
      summary: GloA performs step one of this exact two-reaction detoxification route.
      action: NEW
      reason: >-
        This is the current valid process term; the older route-specific
        GO:0019243 term exposed by UniProt is obsolete. The process inference
        is grounded in the reviewed same-species GloA exemplar P16635, which
        shares the exact PTHR10374:SF30 subfamily with Q88GF8.
      supported_by:
        - reference_id: file:PSEPK/gloA/gloA-uniprot.txt
          supporting_text: '(R)-lactate from methylglyoxal: step 1/2'
        - reference_id: file:interpro/panther/PTHR10374/PTHR10374-entries.csv
          supporting_text: P16635,Lactoylglutathione lyase
references:
  - id: GO_REF:0000120
