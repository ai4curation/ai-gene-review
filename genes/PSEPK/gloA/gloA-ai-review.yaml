    findings: []
  - id: file:PSEPK/gloA/gloA-uniprot.txt
    title: UniProtKB entry for gloA (Q88GF8)
    findings:
      - statement: The record assigns EC 4.4.1.5, Rhea 19069, the glyoxalase-I family, and a divalent-metal cofactor.
      - statement: The record explicitly assigns Q88GF8 to PTHR10374:SF30.
  - id: file:PSEPK/gloA/gloA-goa.tsv
    title: QuickGO GOA annotations for gloA
    findings:
      - statement: The fetched GOA table contains the two existing annotations reviewed here.
  - id: UniProtKB:P16635
    title: Reviewed Pseudomonas putida glyoxalase I exemplar
    findings:
      - statement: P16635 is the reviewed same-species exemplar used for the process inference.
  - id: file:interpro/panther/PTHR10374/PTHR10374-entries.csv
    title: PANTHER PTHR10374 member table
    findings:
      - statement: P16635 belongs to the exact PTHR10374:SF30 lactoylglutathione lyase subfamily.
  - id: PMID:11461144
    title: Accumulation of methylglyoxal in anaerobically grown Escherichia coli and its detoxification by expression of the Pseudomonas putida glyoxalase I gene.
    findings:
      - statement: Expression of a P. putida glyoxalase I increased activity and lowered methylglyoxal in transgenic E. coli.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified direct functional evidence for a P. putida GlxI. The
        work predates the KT2440 locus assignment, so identity with
        PP_3766/Q88GF8 remains inferred.
  - id: PMID:22358913
    title: Effect of endogenous methylglyoxal on Chinese hamster ovary cells grown in culture.
    findings:
      - statement: Heterologous expression of P. putida glyoxalase I reduced free methylglyoxal in CHO cells.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified functional corroboration for a P. putida GlxI, but the
        historical construct is not tied to PP_3766/Q88GF8.
  - id: PMID:10824093
    title: Identification of sequences encoding the detoxification metalloisomerase glyoxalase I in microbial genomes from several pathogenic organisms.
    findings:
      - statement: Provides comparative sequence context for bacterial GlxI proteins and notes distinctive regions in P. putida GlxI.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: PubMed-verified family-level sequence context; it does not identify the KT2440 locus.
  - id: PMID:25557363
    title: 'Modulating glyoxalase I metal selectivity by deletional mutagenesis: underlying structural factors contributing to nickel activation profiles.'
    findings:
      - statement: Establishes structurally distinct Zn2+- and Ni2+-activated bacterial GlxI classes.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified mechanistic context from P. aeruginosa; it does not determine the native metal for Q88GF8.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__methylglyoxal-detoxification__ppu00620-deep-research-openscientist.md
    title: OpenScientist PSEPK methylglyoxal detoxification synthesis
    findings:
      - statement: The report identifies PP_3766 as the high-confidence first enzyme in the complete glutathione-dependent route.
  - id: file:modules/methylglyoxal_detoxification.yaml
    title: Glutathione-dependent methylglyoxal detoxification module
    findings:
      - statement: GloA implements the first of two chemically chained reactions.
