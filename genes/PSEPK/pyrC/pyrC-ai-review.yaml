suggested_questions:
  - question: >-
      Does PP_1086 encode the same dihydroorotase purified in the classic
      species-level P. putida study, and is it the sole source of this activity
      in KT2440?
suggested_experiments:
  - description: >-
      Delete PP_1086 and test pyrimidine auxotrophy, uracil rescue, and loss of
      dihydroorotase activity; complement with Q88NW7 to connect the classic
      P. putida enzymology directly to the KT2440 locus.
