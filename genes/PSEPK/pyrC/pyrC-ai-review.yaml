references:
  - id: PMID:8572888
    title: Purification and characterization of dihydroorotase from Pseudomonas putida.
    full_text_unavailable: true
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed abstract verified. The study directly characterizes a P. putida
        dihydroorotase, but does not identify the KT2440 strain or PP_1086 locus;
        it therefore corroborates rather than uniquely identifies Q88NW7.
    findings:
      - statement: >-
          Purified P. putida dihydroorotase is a reversible, zinc-responsive
          homodimer with strict activity on dihydro-L-orotate and its methyl ester.
        supporting_text: >-
          The enzyme only hydrolyzed dihydro-L-orotate and its methyl ester, and
          the reactions were reversible.
