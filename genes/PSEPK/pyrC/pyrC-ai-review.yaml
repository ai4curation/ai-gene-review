  - id: file:PSEPK/pyrC/pyrC-deep-research-openscientist.md
    title: OpenScientist deep research report on pyrC (Q88NW7)
    publication_type: DEEP_RESEARCH
    findings:
      - statement: >-
          The report corroborates the Q88NW7 dihydroorotase assignment and
          identifies the direct species-level enzymology while preserving its
          strain-provenance caveat.
        supporting_text: >-
          The gene **pyrC** (ordered locus **PP_1086**; UniProt **Q88NW7**;
          *PYRC_PSEPK*) of *Pseudomonas putida* KT2440 encodes
          **dihydroorotase (DHOase; EC 3.5.2.3)**
