gene_symbol: nicX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NicX is a non-heme Fe(II)-dependent 2,5-dihydroxypyridine 5,6-dioxygenase in Pseudomonas
  putida KT2440 aerobic nicotinate catabolism. It opens the pyridine ring between C5 and C6 to produce
  N-formylmaleamate, which is subsequently hydrolyzed by NicD. NicX forms a homohexamer, and each active
  site coordinates one iron through His265, Ser302, His318 and Asp320. The substrate is positioned near
  the metal without directly chelating it. The enzyme is selective for 2,5-dihydroxypyridine within tested
  substrate panels.
