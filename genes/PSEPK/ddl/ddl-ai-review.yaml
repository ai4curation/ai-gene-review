id: A0A140FWM5
gene_symbol: ddl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_5673 is a cytoplasmic DdlB-like D-alanine-D-alanine ligase predicted to
  catalyze ATP-dependent formation of the D-Ala-D-Ala peptidoglycan precursor.
  Its 304-residue sequence carries convergent HAMAP, Rhea, PANTHER, ATP-grasp,
  Ddl signature, and conserved catalytic-site support.
existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: This broad term adds no information beyond the ATP-grasp prediction.
      action: MARK_AS_OVER_ANNOTATED
      reason: ATP binding is the more informative nucleotide-binding annotation.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: ATP binding is supported by the retained ATP-grasp domain.
      action: KEEP_AS_NON_CORE
      reason: ATP binding is required for catalysis but is not the defining function.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          supporting_text: /note="ATP-grasp"
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The predicted cytoplasmic localization is compatible with a Ddl-family protein.
      action: ACCEPT
      reason: The UniProt record assigns PP_5673 to the cytoplasm.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
  - term:
      id: GO:0008716
      label: D-alanine-D-alanine ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Accept the exact D-alanine-D-alanine ligase assignment.
      action: ACCEPT
      reason: >-
        HAMAP MF_00047, RHEA:11224, EC 6.3.2.4, the ATP-grasp domain,
        DALA_DALA_LIGASE_1 signature, conserved binding sites, and PANTHER SF23
        independently converge on a catalytically competent DdlB-like enzyme.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          supporting_text: "PANTHER; PTHR23132:SF23; D-ALANINE--D-ALANINE LIGASE B"
  - term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Accept peptidoglycan biosynthesis as the pathway context.
      action: ACCEPT
      reason: >-
        UniProt/HAMAP explicitly assigns the protein to cell-wall formation and
        the peptidoglycan-biosynthesis pathway, consistent with its exact Ddl
        reaction.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          supporting_text: "PATHWAY: Cell wall biogenesis; peptidoglycan biosynthesis."
  - term:
      id: GO:0016881
      label: acid-amino acid ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This broad ARBA term is not useful for discriminating PP_5673 function.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        This uninformative parent adds no value beyond the exact GO:0008716
        D-alanine-D-alanine ligase reaction accepted for the same protein.
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Divalent-metal binding is consistent with Ddl-family catalysis.
      action: KEEP_AS_NON_CORE
      reason: UniProt predicts the conserved magnesium-binding positions.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          supporting_text: /ligand="Mg(2+)"
