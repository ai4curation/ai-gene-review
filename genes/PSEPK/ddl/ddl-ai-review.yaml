        supporting_text: Reaction=2 D-alanine + ATP = D-alanyl-D-alanine + ADP + phosphate +
proposed_new_terms: []
suggested_questions:
  - question: Under which growth conditions does PP_5673 contribute relative to the other two KT2440 Ddl paralogs?
suggested_experiments:
  - description: >-
      Compare PP_5673 with Q88EV6 and Q88N74 by domain-resolved sequence
      alignment, complementation of a D-Ala-D-Ala auxotroph, purified-enzyme
      kinetics, and combinatorial depletion in KT2440.
    experiment_type: comparative sequence analysis, complementation, and enzymology
