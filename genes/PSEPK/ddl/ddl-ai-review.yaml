id: A0A140FWM5
gene_symbol: ddl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_5673 is a cytoplasmic DdlB-like D-alanine-D-alanine ligase predicted to
  catalyze ATP-dependent formation of the D-Ala-D-Ala peptidoglycan precursor.
  Its 304-residue sequence carries convergent HAMAP, Rhea, PANTHER, ATP-grasp,
  Ddl signature, and conserved catalytic-site support.
existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Nucleotide binding is correct but general; the bound nucleotide is ATP.
      action: MODIFY
      reason: >-
        Correct but general. The ATP-grasp domain and the Ddl reaction use ATP,
        so the specific descendant ATP binding (GO:0005524), already carried by
        this gene, is the better term.
      proposed_replacement_terms:
        - id: GO:0005524
          label: ATP binding
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["FT:DOMAIN"]
          supporting_text: /note="ATP-grasp"
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: ATP binding is supported by the retained ATP-grasp domain.
      action: KEEP_AS_NON_CORE
      reason: ATP binding is required for catalysis but is not the defining function.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["FT:DOMAIN"]
          supporting_text: /note="ATP-grasp"
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasm is correct but general for this soluble ligase.
      action: MODIFY
      reason: >-
        Correct but general. The protein is a soluble ATP-grasp ligase with no
        signal peptide or transmembrane segment, so the specific descendant
        cytosol (GO:0005829) applies, matching the E. coli K-12 DdlA and DdlB
        reviews.
      proposed_replacement_terms:
        - id: GO:0005829
          label: cytosol
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
  - term:
      id: GO:0008716
      label: D-alanine-D-alanine ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Accept the exact D-alanine-D-alanine ligase assignment.
      action: ACCEPT
      reason: >-
        HAMAP MF_00047, RHEA:11224, EC 6.3.2.4, the ATP-grasp domain,
        DALA_DALA_LIGASE_1 signature, conserved binding sites, and PANTHER SF23
        independently converge on a catalytically competent DdlB-like enzyme.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["DR:PANTHER"]
          supporting_text: "PANTHER; PTHR23132:SF23; D-ALANINE--D-ALANINE LIGASE B"
  - term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Accept peptidoglycan biosynthesis as the pathway context.
      action: ACCEPT
      reason: >-
        UniProt/HAMAP explicitly assigns the protein to cell-wall formation and
        the peptidoglycan-biosynthesis pathway, consistent with its exact Ddl
        reaction.
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["CC:PATHWAY"]
          supporting_text: "PATHWAY: Cell wall biogenesis; peptidoglycan biosynthesis."
  - term:
      id: GO:0016881
      label: acid-amino acid ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Acid-amino acid ligase activity is a correct but general parent of the Ddl reaction.
      action: MODIFY
      reason: >-
        Correct but general. HAMAP MF_00047 family membership and the Ddl
        catalytic reaction support the specific descendant
        D-alanine-D-alanine ligase activity (GO:0008716), already carried by
        this gene.
      proposed_replacement_terms:
        - id: GO:0008716
          label: D-alanine-D-alanine ligase activity
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["DR:HAMAP"]
          supporting_text: "HAMAP; MF_00047; Dala_Dala_lig; 1."
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Metal ion binding is correct but general; the bound ions are Mg(2+).
      action: MODIFY
      reason: >-
        Correct but general. The Ddl reaction uses two Mg(2+) (Mn(2+) substitutes
        in vitro) bound to the ATP phosphates, so the specific descendant
        magnesium ion binding (GO:0000287) is the better term. A cofactor
        property rather than the core activity; same treatment as the E. coli
        K-12 DdlA and DdlB reviews.
      proposed_replacement_terms:
        - id: GO:0000287
          label: magnesium ion binding
      supported_by:
        - reference_id: file:PSEPK/ddl/ddl-uniprot.txt
          record_section: ["FT:BINDING"]
          supporting_text: /ligand="Mg(2+)"
