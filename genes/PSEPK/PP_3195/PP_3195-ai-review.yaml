knowledge_gaps:
- gap_statement: No FdeB-family protein has been assayed directly with the R13077 lactone, and PP_3195
    has not been tested genetically in KT2440.
  boundary: Orthology, fold and conserved candidate catalytic residues support a broad hydrolase inference,
    but do not resolve ester versus carbon-carbon bond specificity or the physiological substrate/product.
    R13077 remains a candidate reaction, not an established target activity.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Direct evidence is needed before assigning a substrate-specific lactonase term experimentally
    or treating R13077 as established chemistry.
  resolution: Purify PP_3195, generate the proposed delta-lactone substrate enzymatically, and identify
    the ring-opened product; test a native deletion for substrate accumulation during naringenin utilization.
  provenance:
  - reference_id: file:PSEPK/PP_3195/PP_3195-deep-research-openscientist.md
    supporting_text: No direct biochemical or genetic characterization of PP_3195/FdeB itself has been
      published.
suggested_questions:
- question: Does PP_3195 hydrolyze the R13077 delta-lactone in KT2440, and are the predicted serine-hydrolase
    residues required for turnover?
- question: Which conserved histidine supplies catalytic chemistry in this FdeB protein, and can purified-protein
    mutagenesis distinguish the sequence-based candidate mappings? The provider report numbering and the
    independent characterized-family alignment do not establish target active-site geometry.
- question: 'If the candidate reaction is experimentally established, would "flavonoid-derived delta-lactone
    hydrolase activity" be an appropriate GO term? The provisional definition was: Catalysis of hydrolytic
    ring opening of 5-(4-hydroxyphenyl)-3-oxovalero-delta-lactone to 5-hydroxy-5-(4-hydroxyphenyl)-3-oxopentanoate
    in bacterial flavonoid degradation. This is a future terminology question, not a current request or
    asserted activity.'
suggested_experiments:
- description: Purify PP_3195 and assay the proposed R13077 lactone, identifying the ring-opened product
    and testing a catalytic-serine substitution.
  experiment_type: biochemical reconstitution and site-directed mutagenesis
- description: Compare wild type, a PP_3195 deletion, and a complemented strain during naringenin utilization
    using targeted metabolomics for the R13077 substrate and product.
  experiment_type: genetics and targeted metabolomics
core_functions:
- description: Hydrolase activity inferred from FrsA-like family membership, alpha/beta-hydrolase architecture
    and conserved candidate catalytic chemistry. The physiological substrate, ester-versus-carbon-carbon
    bond specificity and native flavonoid-catabolic participation remain unresolved. Candidate residue
    correspondence is not a measured active-site assignment.
  molecular_function:
    id: GO:0016787
    label: hydrolase activity
