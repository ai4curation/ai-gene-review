- id: PMID:27059806
  title: Genetic and functional characterization of a novel meta-pathway for degradation of naringenin in Herbaspirillum seropedicae SmR1.
  full_text_unavailable: true
  findings:
  - statement: >-
      The Herbaspirillum fde pathway performs naringenin A-ring cleavage, but
      FdeB itself was not among the directly tested enzymes.
    supporting_text: naringenin is first mono-oxygenated by the FdeE protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract verified. This is pathway context from another organism,
      not direct evidence for Hsero_1004 or PP_3195.
- id: file:PSEPK/PP_3195/PP_3195-deep-research-openscientist.md
  title: OpenScientist deep research report on PP_3195 (Q88I07)
  publication_type: DEEP_RESEARCH
  findings:
  - statement: >-
      The report identifies the K26184/R13077 prediction and explicitly notes
      that PP_3195 has no direct biochemical or genetic characterization.
    supporting_text: No direct biochemical or genetic characterization of PP_3195/FdeB itself has been published.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The KEGG mapping and absence of target experiments are useful. The
      AlphaFold catalytic-triad geometry, cytoplasmic localization, and detailed
      mechanism were not independently reproduced and were not promoted to GO
      assertions. The report's extended FrsA comparison is not needed for the
      pathway-level curation decision.
- id: file:PSEPK/PP_3195/PP_3195-bioinformatics/RESULTS.md
  title: Reproducible PP_3195 and Hsero_1004 sequence comparison
  findings:
  - statement: >-
      Q88I07 and D8J0W6 share 81.6% identity over 385 aligned residue pairs and
      both contain the same GVSLG nucleophile-motif candidate.
    supporting_text: 'Pairwise identity over aligned residue pairs: 81.6%'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated locally from UniProt FASTA records by the committed Biopython
      alignment script. Neither sequence has direct evidence for R13077.
