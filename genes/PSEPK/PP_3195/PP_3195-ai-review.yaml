    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The S9-like catalytic domain does not establish physiological peptide-bond hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IPR001375 catalytic-domain match is shared with non-peptidase hydrolases. FrsA-like family
      membership, alpha/beta-hydrolase architecture and close FdeB homologs favor a small-molecule hydrolase
      candidate, but do not constitute a negative peptide assay or a demonstrated loss of peptidase activity.
      The physiological peptide/proteolysis specificity is therefore over-annotation. This is the same
      judgment for Hsero_1004, PP_3195 and bll6428; differences in locus phenotype do not resolve their
      shared untested bond specificity.
