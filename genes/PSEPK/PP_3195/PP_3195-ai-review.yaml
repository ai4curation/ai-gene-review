id: Q88I07
gene_symbol: PP_3195
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3195 encodes an alpha/beta-hydrolase-fold serine hydrolase in the KT2440
  flavonoid-degradation locus. KEGG assigns it to FdeB orthology group K26184
  and reaction R13077, predicting hydrolysis of a flavonoid-derived delta-
  lactone after A-ring cleavage. The target has not been characterized directly,
  so the lactone substrate remains a pathway-level prediction; available
  evidence does not support the automated peptidase and proteolysis annotations.
existing_annotations:
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: No evidence links PP_3195 to peptide-bond hydrolysis or proteolysis.
    action: REMOVE
    reason: >-
      This annotation is propagated from a Peptidase S9 fold signature. The
      independent K26184/R13077 assignment instead predicts hydrolysis of a
      cyclic ester in flavonoid catabolism.
- term:
    id: GO:0008236
    label: serine-type peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The alpha/beta-hydrolase catalytic fold does not establish a peptide substrate.
    action: REMOVE
    reason: >-
      Peptidase S9 is a fold-level assignment shared with non-peptidase serine
      hydrolases. The pathway-specific prediction is an ester/lactone hydrolase,
      and no peptidase assay or physiological proteolysis role is available.
- term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: PP_3195 is predicted to hydrolyze a cyclic carboxylic ester in R13077.
    action: ACCEPT
    reason: >-
      The alpha/beta-hydrolase architecture, conserved GVSLG nucleophile-motif
      candidate, and K26184/R13077 pathway assignment independently support a
      carboxylic ester hydrolase without overcommitting to the untested substrate.
    supported_by:
    - reference_id: file:PSEPK/PP_3195/PP_3195-deep-research-openscientist.md
      supporting_text: KEGG links FdeB (K26184) to **reaction R13077**, classified as a **hydrolase**
    - reference_id: file:PSEPK/PP_3195/PP_3195-bioinformatics/RESULTS.md
      supporting_text: 'Target nucleophile-motif candidate `GVSLG`: present at Q88I07 residues 266-270 and D8J0W6 residues 231-235'
- term:
    id: GO:0009812
    label: flavonoid metabolic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_3195/PP_3195-deep-research-openscientist.md
  supporting_entities:
  - UniProtKB:D8J0W6
  qualifier: involved_in
  review:
    summary: PP_3195 is predicted to perform the FdeB lactone-hydrolysis step in flavonoid degradation.
    action: NEW
    reason: >-
      The target shares 81.6% global identity with Hsero_1004, the corresponding
      protein in the Herbaspirillum fde locus, and KEGG maps PP_3195 to
      K26184/R13077. GO:0009812 is used because the local ontology has no
      flavonoid-catabolic child term.
    supported_by:
    - reference_id: file:PSEPK/PP_3195/PP_3195-deep-research-openscientist.md
      supporting_text: KEGG assigns PP_3195 to ortholog **K26184** (SYMBOL *fdeB*, "naringenin degradation protein FdeB"), places it in pathway **ppu00946 "Degradation of flavonoids,"** and classifies it in **COG1506**.
    - reference_id: file:PSEPK/PP_3195/PP_3195-bioinformatics/RESULTS.md
      supporting_text: 'Pairwise identity over aligned residue pairs: 81.6%'
