id: Q88FS2
gene_symbol: icd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NADP-dependent isocitrate dehydrogenase (EC 1.1.1.42) of Pseudomonas putida KT2440 (locus PP_4011). It catalyzes the divalent-metal-dependent (Mg2+/Mn2+) oxidative decarboxylation of D-threo-isocitrate to 2-oxoglutarate and CO2 with the concomitant reduction of NADP+ to NADPH. The enzyme is a soluble cytoplasmic homodimer belonging to the isocitrate/isopropylmalate dehydrogenase family. It acts at the isocitrate node of the tricarboxylic acid cycle, where it both supplies 2-oxoglutarate for amino-acid biosynthesis and is a major source of anabolic reducing power (NADPH) for central metabolism and redox balance. In KT2440, biochemical assays of cell-free extracts show a strong (~89%) preference for NADP+ over NAD+. Activity at this branch point is subject to post-translational regulation (phosphorylation of a conserved serine), partitioning carbon between the TCA cycle and the glyoxylate shunt.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: NADP-IDH requires a divalent metal ion (Mg2+ or Mn2+) per subunit for catalysis, and UniProt annotates a Mg2+-binding residue (position 309). Magnesium ion binding is well supported for this family.
    action: KEEP_AS_NON_CORE
    reason: Consistent with the IDH/IMDH family requirement for a divalent metal cofactor; UniProt (PIRSR604439) records Mg2+ or Mn2+ as cofactor and a Mg2+-binding site. The metal is a catalytic cofactor, so the binding is real but supports, rather than constitutes, the core dehydrogenase function; kept as non-core.
    supported_by:
    - reference_id: file:PSEPK/icd/icd-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 1 Mg(2+) or Mn(2+) ion per subunit.
- term:
    id: GO:0004450
    label: isocitrate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the core molecular function. The enzyme catalyzes oxidative decarboxylation of D-threo-isocitrate to 2-oxoglutarate + CO2 with reduction of NADP+ (EC 1.1.1.42, RHEA:19629). KT2440-specific biochemistry confirms strong NADP+ preference (~89% NADP+ vs ~11% NAD+ in cell-free extracts).
    action: ACCEPT
    reason: Matches the UniProt catalytic activity and the family assignment (NCBIfam TIGR00183 prokaryotic NADP-dependent IDH; PIRSR604439 isocitrate and NADP(+) binding sites), and is corroborated by KT2440 cell-free-extract measurements of NADP preference reported by Nikel et al. 2015 (PMID:26350459; the cached copy is abstract-only, so the numbers are taken from the Falcon deep-research summary of that paper).
    supported_by:
    - reference_id: file:PSEPK/icd/icd-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: TIGR00183; prok_nadp_idh
    - reference_id: file:PSEPK/icd/icd-deep-research-falcon.md
      supporting_text: In cell-free extracts of **exponentially growing KT2440 on glucose**, Icd (PP_4011) shows strong NADP preference.
    - reference_id: file:PSEPK/icd/icd-deep-research-openscientist.md
      supporting_text: Icd is a member of the homodimeric **subfamily-I (E. coli-type)** bacterial NADP-IDHs.
- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Isocitrate dehydrogenase catalyzes the isocitrate to 2-oxoglutarate step of the TCA cycle. This is the appropriate biological process for the core function.
    action: ACCEPT
    reason: Standard placement of IDH within the TCA cycle; the enzyme catalyzes the isocitrate-to-2-oxoglutarate step itself, and KT2440 studies discuss ICD as the TCA-cycle decarboxylation step bypassed by the glyoxylate shunt.
    supported_by:
    - reference_id: PMID:30936206
      supporting_text: The glyoxylate shunt bypasses the two decarboxylation reactions, through isocitrate dehydrogenase (ICD) and α-ketoglutarate dehydrogenase (KGD), in the canonical TCA cycle
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This is a generic parent term of the specific and more informative GO:0004450 (isocitrate dehydrogenase (NADP+) activity), which is already annotated. It is not incorrect but adds no information beyond the specific child.
    action: TOO_GENERAL
    reason: True (IDH oxidizes a CH-OH group with NADP+ as acceptor) but GO:0016616 is an ancestor of the accepted GO:0004450 and is entailed by it, so it is uninformative rather than over-annotated.
- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This enzyme is NADP+-specific, not NAD+-binding. UniProt annotates multiple NADP(+)-binding residues (positions 106, 341-347, 354, 393, 397) and no NAD-binding site, and KT2440 biochemistry shows ~89% NADP+ preference. The InterPro2GO mapping to NAD binding is a mis-propagation for this NADP-specific family member; the correct cofactor binding is NADP, not NAD.
    action: MODIFY
    reason: The essence of the InterPro mapping (nicotinamide dinucleotide cofactor binding) is sound, but the cofactor is wrong for this NADP-specific subfamily member. UniProt (PIRSR604439) places NADP(+)-binding residues, and KT2440 extract assays show only a minor NAD+-linked activity. This is a lateral correction to GO:0050661 NADP binding, a non-core cofactor-binding term.
    supported_by:
    - reference_id: file:PSEPK/icd/icd-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="NADP(+)"
    proposed_replacement_terms:
    - id: GO:0050661
      label: NADP binding
