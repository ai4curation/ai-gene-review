description: 'FliQ contributes to the FliPQR channel assembly and cytoplasmic gate that conducts
  axial flagellar proteins across the cytoplasmic membrane. In Pseudomonas putida KT2440 these
  functions are inferred from its conserved flagellar export-family identity. '
