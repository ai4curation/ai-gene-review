  review:
    summary: fliQ acts at the cytoplasmic-membrane export apparatus.
    action: ACCEPT
    reason: The KT2440 assignment is inferred from the target-specific NCBIfam/InterPro classification
      and conserved export-system context; the mechanistic experiments cited here used Salmonella,
      not KT2440. The gate acts across the plasma membrane. Its assembly and detailed topology
      are distinguished from a generic membrane prediction. Primary cryo-EM shows noncanonical
      membrane topology, so this localization does not claim that each isolated subunit retains
      a conventional transmembrane-helix arrangement in the assembled channel.
    supported_by:
    - reference_id: PMID:29967543
      supporting_text: The complex is a P5Q4R1 assembly consistent with the dominant species
        in our earlier nMS data of the flagellar system
    - reference_id: PMID:39766194
      supporting_text: FliP and FliR assemble into the FliP5-FliR1 complex, and 4 FliQ subunits
        then bind to the FliP5-FliR1 complex to form the FliP5-FliQ4-FliR1 complex that allows
        proteins of the axial structure of the flagellum to pass through the cytoplasmic membrane
