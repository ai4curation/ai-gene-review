id: Q88P12
gene_symbol: tatA-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TatA-I is a small inner-membrane component of one of two twin-arginine
  translocation systems in Pseudomonas putida KT2440. After a folded substrate
  is recognized by TatBC, TatA oligomerizes into the active translocation
  assembly that uses the proton motive force to move the substrate across the
  cytoplasmic membrane.
