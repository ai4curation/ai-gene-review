id: Q88QP7
gene_symbol: secE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SecE is the essential membrane-embedded clamp subunit of the bacterial SecYEG protein-conducting
  channel. It stabilizes the two halves of SecY, contacts the channel plug, and supports SecA-driven translocation
  of unfolded precursor proteins across the inner membrane; it is not an independent transporter.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: SecE is an integral subunit of the inner-membrane SecYEG channel.
    action: ACCEPT
    reason: The reviewed family assignment and membrane topology support plasma-membrane localization.
- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct but general; SecE is part of the SecYEG target that receives precursors at the membrane.
    action: MODIFY
    reason: 'Protein targeting is true but general for SecE: SecYEG, of which SecE is the essential clamp
      subunit, is the membrane target to which SecA and SRP deliver precursors. GO:0006612 protein targeting
      to membrane is the is_a descendant that states this without choosing a route; this gene has no SRP-specific
      (GO:0006616) evidence of its own. Harmonized across the Sec member reviews: a MODIFY replacement must
      be an is_a/part_of descendant of the annotated term, and GO:0043952 protein transport by the Sec complex
      is not a descendant of GO:0006605.'
    proposed_replacement_terms:
    - id: GO:0006612
      label: protein targeting to membrane
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct but general; the protein acts in transmembrane movement of precursors across the cytoplasmic
      membrane.
    action: MODIFY
    reason: 'Intracellular protein transport is true but general. GO:0065002 intracellular protein transmembrane
      transport is its is_a descendant and describes the SecYEG-mediated step; the Sec-complex process is
      recorded in core_functions. Harmonized across the Sec member reviews: a MODIFY replacement must be an
      is_a/part_of descendant of the annotated term, and GO:0043952 protein transport by the Sec complex is
      not a descendant of GO:0006886.'
    proposed_replacement_terms:
    - id: GO:0065002
      label: intracellular protein transmembrane transport
- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SecE contributes to SecYEG protein transmembrane transporter activity; the activity itself is
      correct.
    action: ACCEPT
    reason: The assembled SecYEG channel has protein transmembrane transporter activity and SecE is an essential
      subunit of it, so the term is accepted; the enables qualifier is wrong and is corrected to contributes_to
      in source_defects, as for the E. coli SecE rows.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: CONFIRMED
      explanation: GO:0008320 is the activity of the assembled SecYEG channel, whose pore is formed by SecY.
        SecE is a clamp subunit that contributes to this activity rather than enabling it alone; the PAINT/GO_Central
        IBA row for SecG already uses contributes_to.
- term:
    id: GO:0009306
    label: protein secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SecYEG can initiate secretion by moving precursors into the periplasm.
    action: KEEP_AS_NON_CORE
    reason: Protein secretion is valid pathway context but broader than Sec-complex translocation.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: SecE is membrane embedded.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic membrane term is redundant with plasma membrane.
- term:
    id: GO:0043952
    label: protein transport by the Sec complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SecE is an essential structural subunit of the SecYEG translocation channel.
    action: ACCEPT
    reason: This is the direct biological process supported by the conserved SecE family mechanism.
- term:
    id: GO:0065002
    label: intracellular protein transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: SecE contributes to movement of precursor proteins across the inner membrane.
    action: ACCEPT
    reason: The process accurately captures transmembrane movement by the assembled Sec channel.
- term:
