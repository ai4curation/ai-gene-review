- term:
    id: GO:0008836
    label: diaminopimelate decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Incorrect LysA-family transfer. NspC is assigned specifically to PANTHER subfamily
      PTHR43727:SF1 (carboxynorspermidine/carboxyspermidine decarboxylase), UniProt places it in the
      NspC subfamily, InterPro identifies the Nsp decarboxylase family (IPR005730), and its
      adjacency to the CASDH candidate PP_2928 supports the polyamine-pathway role. These concordant
      family and synteny data contradict diaminopimelate decarboxylase activity; they are
      comparative evidence, not a direct KT2440 experiment.
    action: REMOVE
    supported_by:
    - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "PANTHER; PTHR43727:SF1; CARBOXYNORSPERMIDINE_CARBOXYSPERMIDINE DECARBOXYLASE"
    - reference_id: PMID:19196710
      supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
    propagation_review:
