knowledge_gaps:
- gap_statement: >-
    NspC has not been tested biochemically or genetically in KT2440, so its in
    vivo substrate partition and contribution to spermidine production remain unconfirmed.
  boundary: >-
    The exact record assigns EC 4.1.1.96 and both carboxyspermidine and
    carboxynorspermidine reactions, while family and synteny identify the NspC role.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Direct validation would distinguish physiological spermidine production from possible norspermidine side activity.
  resolution: >-
    Measure purified NspC kinetics with both carboxylated substrates and quantify
    polyamines after nspC deletion and complementation.
  provenance:
  - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
    supporting_text: "there is **no direct biochemical or genetic experiment in KT2440** confirming CASDH activity for PP_2928 or CASDC activity for PP_2929"
proposed_new_terms:
- proposed_name: carboxyspermidine/carboxynorspermidine decarboxylase activity
  proposed_definition: >-
    Catalysis of the decarboxylation of carboxyspermidine to spermidine or
    carboxynorspermidine to sym-norspermidine.
  justification: >-
    NspC is assigned EC 4.1.1.96 and RHEA:34095/RHEA:34099, but GO currently
    provides only the broad carboxy-lyase parent GO:0016831.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
    supporting_text: Catalyzes the decarboxylation of carboxynorspermidine and carboxyspermidine.
  - reference_id: PMID:19196710
suggested_questions:
- question: What is the in vivo substrate partition between carboxyspermidine and carboxynorspermidine for KT2440 NspC?
suggested_experiments:
- description: Measure purified NspC kinetics and polyamine profiles in an nspC deletion strain.
  experiment_type: enzyme kinetics and metabolomics
