- term:
    id: GO:0045312
    label: nor-spermidine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      A predicted ability to decarboxylate carboxynorspermidine does not establish an endogenous norspermidine
      biosynthetic process in KT2440.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PIRNR038941 and NspC family membership support potential carboxypolyamine decarboxylation, but there
      is no direct KT2440 enzyme assay, demonstrated carboxynorspermidine supply, or target-species norspermidine
      synthesis in the sources reviewed. The previous claim of a genuine peripheral process exceeded this
      evidence. PMID:22025614 and PMID:27118128 show that related decarboxylases can serve spermidine
      rather than norspermidine biosynthesis. This is over-specific pathway propagation, not evidence
      that Q88IS0 cannot accept carboxynorspermidine.
    supported_by:
    - reference_id: PMID:19196710
      supporting_text: >-
        Widespread absence of DABA AT and DABA DC in bacterial species
        where a clustered pair of CANSDH and CANSDC genes is present suggests that the
        alternative, aspartate β-semialdehyde-based pathway is widely used for
        spermidine rather than norspermidine biosynthesis.
    - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the decarboxylation of carboxynorspermidine and carboxyspermidine.

- term:
    id: GO:0008295
    label: spermidine biosynthetic process
  evidence_type: ISS
  original_reference_id:
    file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: PP_2928-NspC synteny, NspC subfamily assignment, and orthology support the terminal
      carboxyspermidine-to-spermidine role; direct evidence from KT2440 is absent.
    action: NEW
    reason: >-
      The GOA snapshot lacks this process, and the record's own GO cross-reference is not evidence for
      it. The support is the curated reaction itself: the PIRNR038941 rule assigns Q88IS0 the decarboxylation
      of carboxyspermidine to spermidine. Q88IS0 is also classified in the NspC subfamily PTHR43727:SF1
      and is encoded next to the CASDH candidate PP_2928. Genetic and metabolite analysis in Vibrio cholerae
      shows the CANSDC ortholog converting carboxyspermidine to spermidine, and deletion work in Campylobacter
      jejuni and Bacteroides thetaiotaomicron shows the CASDC/NspC ortholog making spermidine in vivo.
      All of that is comparative evidence; KT2440 NspC has not been assayed. This is an inherited comparative
      proposal, not a newly measured KT2440 function. PMID:37878710 and PMID:40074085 show substrate and
      pathway diversification in related proteins, so family membership and adjacency do not by themselves
      prove native putrescine preference. The curated-rule/comparative pathway inference is retained,
      with physiological substrate identity explicitly open.
    supported_by:
    - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=carboxyspermidine + H(+) = spermidine + CO2;"
    - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the decarboxylation of carboxynorspermidine and carboxyspermidine.
    - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "PANTHER; PTHR43727:SF1; CARBOXYNORSPERMIDINE_CARBOXYSPERMIDINE DECARBOXYLASE"
    - reference_id: PMID:19196710
      supporting_text: carboxyspermidine, which is then converted to spermidine by CANSDC
    - reference_id: PMID:19196710
      supporting_text: deletion of either CANSDC or the putative CANSDH led to loss of
        sym-norspermidine and spermidine
    - reference_id: PMID:22025614
      supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is
        responsible for synthesizing spermidine and not sym-norspermidine in vivo
    - reference_id: PMID:27118128
      supporting_text: Deletion of the gene encoding a putative carboxyspermidine decarboxylase
        (casdc), which converts carboxyspermidine to spermidine, resulted in the depletion of
        spermidine and loss of decarboxylase activity in B. thetaiotaomicron.
