id: Q88IS0
gene_symbol: nspC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PLP-dependent carboxyspermidine/carboxynorspermidine decarboxylase. In
  KT2440, NspC is adjacent to the CASDH candidate PP_2928. Comparative
  subfamily and synteny evidence strongly supports a terminal
  carboxyspermidine-to-spermidine role, but no direct KT2440 biochemical or
  genetic experiment establishes that pathway assignment.
