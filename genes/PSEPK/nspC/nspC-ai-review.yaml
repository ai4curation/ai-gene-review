- id: PMID:19196710
  title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for
    biofilm formation in Vibrio cholerae.
  findings:
  - statement: Genetic analysis establishes the CANSDC decarboxylase step in the alternative
      bacterial polyamine pathway.
    supporting_text: "Genetic deletion of the V. cholerae CANSDC led to accumulation of carboxynorspermidine"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text checked. Deletion/complementation and metabolite experiments used V. cholerae C6709, whereas
      Q9KRL3/Q9KRL4 are N16961 reference records. Purified decarboxylase specificity was assayed using
      V. vulnificus CANSDC for technical reasons. These are distinct evidence layers; no N16961 purified-enzyme
      assay is inferred.
- id: PMID:36283333
  title: Structural analysis of carboxyspermidine dehydrogenase from Helicobacter pylori.
  findings:
  - statement: The study describes the paired CASDH/CASDC alternative route to spermidine.
    supporting_text: "spermidine is biosynthesized using carboxyspermidine dehydrogenase (CASDH) and carboxyspermidine
      decarboxylase through an alternative pathway"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract chemistry checked: the H. pylori enzyme can perform putrescine condensation. PMID:37878710
      also identifies the H. pylori homolog as CAPADH; putrescine turnover or a CASDH name alone does
      not establish native substrate preference. This is comparator chemistry, not a target-species assay.
- id: PMID:22025614
  title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni
    and is the dominant polyamine pathway in human gut microbiota.
  findings:
  - statement: Gene deletion in C. jejuni shows that the CANSDC/CASDC orthologue makes spermidine,
      not norspermidine, in vivo, and that the route is widespread in bacteria.
    supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is responsible
      for synthesizing spermidine and not sym-norspermidine in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The publication cache was normally refreshed to full text during this audit. C. jejuni experiments
      support the comparator spermidine pathway; they are not direct assays of the Vibrio or KT2440 targets.
- id: PMID:27118128
  title: Carboxyspermidine decarboxylase of the prominent intestinal microbiota species Bacteroides
    thetaiotaomicron is required for spermidine biosynthesis and contributes to normal growth.
  findings:
  - statement: Deletion and complementation of casdc in B. thetaiotaomicron show that CASDC is
      required for spermidine synthesis and decarboxylase activity.
    supporting_text: These results indicate that carboxyspermidine decarboxylase is essential for
      synthesizing spermidine in B. thetaiotaomicron and contributes to the growth of this species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract checked (abstract-only cache).
- id: file:PSEPK/nspC/nspC-notes.md
  title: Manual evidence notes for nspC
  findings:
  - statement: The notes distinguish exact-record evidence from cross-species pathway transfer.
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: Some related CASDH/CASDC pairs support tetramine or agmatine-dependent chemistry;
      this cautions against assigning substrate preference from family membership alone. No such
      additional activity is assigned here.
    supporting_text: The ASA-dependent pathway consisting of CASDH/CASDC homologs has diversified
      during evolution to produce norspermidine (29), N1-aminopropylagmatine (37), and as we have
      shown here, spermidine and Spm/Tspm.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked as a specificity comparator. The reported heterologous
      reconstructions are not direct measurements of this target enzyme or native target-species
      flux.
- id: PMID:39887002
  title: Structure of Clostridium leptum carboxyspermidine decarboxylase and comparison to homologs
    prevalent within the human gut microbiome.
  findings:
  - statement: Structural comparison independently identifies the older CANSDC structure as a C.
      jejuni homolog, and supports conserved PLP-dependent decarboxylase architecture across related
      enzymes.
    supporting_text: from the bacterium Campylobacter jejuni (PDB entry 3n29; Deng et al., 2010
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked. The new structure is C. leptum EDO61992.1, not the target
      protein. Structure alone does not establish physiological substrate preference.
