  label: Pseudomonas putida KT2440
description: >-
  Predicted PLP-dependent carboxyspermidine/carboxynorspermidine decarboxylase. In KT2440, NspC is adjacent
  to the CASDH candidate PP_2928. Comparative subfamily and synteny evidence strongly supports a terminal
  carboxyspermidine-to-spermidine role, but no direct KT2440 biochemical or genetic experiment establishes
  that pathway assignment.
