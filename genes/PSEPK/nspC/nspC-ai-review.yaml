id: Q88IS0
gene_symbol: nspC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PLP-dependent carboxyspermidine/carboxynorspermidine decarboxylase. In
  KT2440, NspC is adjacent to the CASDH candidate PP_2928. Comparative
  subfamily and synteny evidence strongly supports a terminal
  carboxyspermidine-to-spermidine role, but no direct KT2440 biochemical or
  genetic experiment establishes that pathway assignment.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Too broad relative to the carboxy-lyase activity and known decarboxylase reaction.
    action: MARK_AS_OVER_ANNOTATED
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: UniProt subcellular-location mapping supports cytoplasm; the same nonredundant location is used in the core function.
    action: ACCEPT
- term:
    id: GO:0008836
    label: diaminopimelate decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Incorrect LysA-family transfer. NspC is assigned specifically to PANTHER subfamily PTHR43727:SF1 (carboxynorspermidine/carboxyspermidine decarboxylase), UniProt places it in the NspC subfamily, InterPro identifies the Nsp decarboxylase family (IPR005730), and its adjacency to the CASDH candidate PP_2928 supports the polyamine-pathway role. These concordant family and synteny data contradict diaminopimelate decarboxylase activity; they are comparative evidence, not a direct KT2440 experiment.
    action: REMOVE
- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct available GO molecular-function parent for the NspC decarboxylation reaction.
    action: ACCEPT
- term:
    id: GO:0045312
    label: nor-spermidine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: NspC can decarboxylate carboxynorspermidine, but KT2440 pathway context supports spermidine as the principal in vivo product.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0008295
    label: spermidine biosynthetic process
  evidence_type: ISS
  original_reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: PP_2928-NspC synteny, NspC subfamily assignment, and orthology support the terminal carboxyspermidine-to-spermidine role; direct evidence from KT2440 is absent.
    action: NEW
