knowledge_gaps:
- gap_statement: >-
    NspC has not been tested biochemically or genetically in KT2440, so its in
    vivo substrate partition and contribution to spermidine production remain unconfirmed.
  boundary: >-
    The exact record assigns EC 4.1.1.96 and both carboxyspermidine and carboxynorspermidine reactions,
    while family and synteny identify the NspC role. Related family members can instead use agmatine or
    participate in onward tetramine synthesis; those activities are not established for this KT2440 pair.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Direct validation would distinguish physiological spermidine production from
    possible norspermidine side activity.
  resolution: >-
    Assay the purified PP_2928/NspC pair across putrescine, 1,3-diaminopropane and agmatine-derived substrates,
    identify products by LC-MS, and measure polyamines after deletion and complementation in KT2440. Distinguish
    catalytic capacity from native substrate use and flux.
  provenance:
  - reference_id: file:PSEPK/nspC/nspC-notes.md
proposed_new_terms:
- proposed_name: carboxyspermidine/carboxynorspermidine decarboxylase activity
  proposed_definition: >-
    Catalysis of the decarboxylation of carboxyspermidine to spermidine or
    carboxynorspermidine to sym-norspermidine.
  justification: >-
    EC 4.1.1.96 and RHEA:34095/RHEA:34099 describe the two carboxypolyamine decarboxylation reactions.
    QuickGO searches on 2026-11-05 found the broad GO:0016831 parent but no specific term. The proposed
    activity excludes CAPA decarboxylation and onward tetramine synthesis; these cannot be transferred
    from other family members. The same proposal is used for both NspC reviews.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: file:PSEPK/nspC/nspC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the decarboxylation of carboxynorspermidine and carboxyspermidine.
  - reference_id: PMID:19196710
suggested_questions:
- question: What is the in vivo substrate partition between carboxyspermidine and
    carboxynorspermidine for KT2440 NspC?
suggested_experiments:
- description: >-
    Assay the purified PP_2928/NspC pair across putrescine, 1,3-diaminopropane and agmatine-derived substrates,
