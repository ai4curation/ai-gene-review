  review:
    summary: SpeB is assigned the EC 3.5.3.11 agmatinase reaction.
    action: ACCEPT
    reason: >-
      Q88KU3 carries the submitted agmatinase name and EC, an agmatinase-specific
      NCBIfam assignment, manganese-binding ureohydrolase features, and the
      K01480 orthology identified in the pathway review. These independent
      features distinguish it from broader ureohydrolase paralogs, although no
      direct KT2440 assay was located.
    supported_by:
