taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SpeB (PP_2196) is the candidate manganese-dependent agmatinase that
  hydrolyzes agmatine to putrescine and urea. It completes the direct
  agmatinase branch of putrescine biosynthesis from arginine after SpeA.
