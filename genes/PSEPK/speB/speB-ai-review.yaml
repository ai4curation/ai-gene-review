- id: PMID:40673658
  title: The Pseudomonas aeruginosa Type VI secretion system toxin Tse8 evolved from a novel N-carbamoylputrescine amidohydrolase.
  findings:
  - statement: Direct agmatinase conversion is one established route from agmatine to putrescine.
    supporting_text: >-
      There are currently three known routes from agmatine to putrescine,
      including direct conversion by agmatinase.
    reference_section_type: ABSTRACT
  - statement: Agmatinase is a manganese-dependent ureohydrolase used primarily in biosynthesis.
    supporting_text: >-
      The conversion of agmatine to putrescine has also been subject to
      convergent evolution. The most biochemically characterized pathway is the
      direct ureohydrolysis of agmatine to putrescine by the manganese-dependent
      enzyme agmatine ureohydrolase (agmatinase, SpeB) (Figure 1).
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text was checked. This establishes the generic SpeB reaction and
      cofactor class, not Q88KU3 activity.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_putrescine_biosynthesis__ppu00330-deep-research-openscientist.md
  title: OpenScientist PSEPK putrescine-biosynthesis module and pathway review
  findings:
  - statement: >-
      The report identifies PP_2196 as the sole K01480 ortholog in KT2440 and
      distinguishes it from the likely guanidinobutyrase paralog PP_4523.
core_functions:
- description: >-
    Manganese-dependent hydrolysis of agmatine to putrescine and urea,
    completing the direct arginine/agmatine route.
  molecular_function:
    id: GO:0008783
    label: agmatinase activity
  directly_involved_in:
  - id: GO:0033389
    label: putrescine biosynthetic process from arginine, via agmatine
  supported_by:
  - reference_id: file:PSEPK/speB/speB-uniprot.txt
    supporting_text: 'SubName: Full=Agmatinase'
  knowledge_gaps:
  - gap_statement: Q88KU3 substrate specificity has not been measured directly.
    significance: >-
      Ureohydrolase paralogs can be misassigned; the target call is supported
      by convergent family and orthology evidence but still requires an enzyme assay.
suggested_questions:
- question: Does Q88KU3 selectively hydrolyze agmatine over arginine and other guanidino substrates?
suggested_experiments:
- description: >-
    Purify Q88KU3 and compare steady-state kinetics for agmatine, arginine, and
    4-guanidinobutyrate with controlled manganese occupancy.
