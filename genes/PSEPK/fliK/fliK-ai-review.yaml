  review:
    summary: FliK controls hook length during flagellar assembly.
    action: NEW
    reason: Experimental work in a conserved bacterial FliK system directly establishes hook-length
      regulation. The direct hook-length experiment cited here is in Bacillus subtilis; the
      KT2440 role is inferred from its FliK-specific domain architecture. Neither a 55-nm target
      length nor direct KT2440 switching kinetics is asserted.
    supported_by:
    - reference_id: PMID:22730131
      supporting_text: We used the fluorescently labeled hook to demonstrate that FlgE is the
        hook structural protein and that FliK regulated hook length.
