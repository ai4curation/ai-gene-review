description: >-
  FliK is the flagellar hook-length control protein. During hook assembly it
  communicates hook completion to the export apparatus and triggers the switch
  from rod/hook substrates to filament-class substrates; it is a checkpoint
  regulator rather than a permanent hook structural subunit.
