id: Q88MY6
gene_symbol: lepB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: LepB is the membrane-anchored bacterial type I signal peptidase. Its periplasmic serine-lysine
  peptidase domain removes N-terminal signal peptides from non-lipoprotein secretory and periplasmic precursors
  during or after their translocation through the Sec channel.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: LepB is a serine-lysine signal endopeptidase.
    action: KEEP_AS_NON_CORE
    reason: The enzyme-class term is correct but less specific than signal peptidase activity.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LepB performs a specific signal-peptide cleavage reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: Generic proteolysis obscures the defined maturation reaction.
- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: LepB is a peptidase.
    action: MARK_AS_OVER_ANNOTATED
    reason: This very broad parent adds no information beyond GO:0009003.
- term:
    id: GO:0008236
    label: serine-type peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LepB belongs to the serine-type peptidase class.
    action: KEEP_AS_NON_CORE
    reason: The class term is correct but subordinate to the substrate-specific signal peptidase activity.
- term:
    id: GO:0009003
    label: signal peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: LepB cleaves N-terminal signal peptides from exported non-lipoprotein precursors.
    action: ACCEPT
    reason: This is the exact EC 3.4.21.89 molecular function of bacterial signal peptidase I.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LepB is a membrane-anchored multi-pass protein with a periplasmic catalytic domain.
    action: MODIFY
    reason: >-
      The generic membrane annotation is correct but underspecified. In Gram-negative
      P. putida, the membrane carrying the Sec translocon and type I signal peptidase
      is the cytoplasmic/plasma membrane.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Signal-peptide removal matures proteins during or after Sec translocation.
    action: MODIFY
    reason: >-
      GO:0016485 is the live, more specific process for protein maturation achieved
      by peptide-bond cleavage. The authoritative QuickGO term record retrieved on
      2026-08-08 returns isObsolete=true for GO:0006465 and recommends the molecular-
      function term GO:0009003, so the stale UniProt process cross-reference is not
      propagated.
    proposed_replacement_terms:
    - id: GO:0016485
      label: protein processing
