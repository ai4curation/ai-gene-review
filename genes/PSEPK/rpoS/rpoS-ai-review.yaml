- id: file:PSEPK/rpoS/rpoS-notes.md
  title: Curator notes for rpoS in Pseudomonas putida KT2440
  findings:
  - statement: RpoS is the stationary-phase sigma factor in KT2440 and its loss impairs starvation survival
      and starvation-associated cross-protection.
    supporting_text: In KT2440, the rpoS mutant showed reduced survival of carbon starvation and reduced
      cross-protection against other types of stress in cells starved for carbon, and RpoS controlled
      expression of more than 50 peptides after short carbon starvation.
  - statement: PsrA directly activates rpoS transcription and binds the rpoS promoter.
    supporting_text: PsrA binds directly to the rpoS promoter from positions -59 to -35 relative to the
      transcription start site.
  - statement: RpoS participates in biofilm-associated pathways through wspA, cfcR, lapA, and lapF regulation.
    supporting_text: RpoS directly bound the major wspA promoter and was required for tetracycline to
      induce wspA activity and promote biofilm formation.
- id: file:PSEPK/rpoS/rpoS-deep-research-codex.md
  title: Deep research report for rpoS in Pseudomonas putida KT2440
  findings:
  - statement: The core GO curation should center on sigma factor activity and transcription initiation
      rather than generic DNA-binding transcription factor terms.
    supporting_text: Accept GO:0006352 DNA-templated transcription initiation as the direct process executed
      by RpoS-containing holoenzyme.
  - statement: Response to starvation is a justified new process annotation from the original KT2440 mutant
      phenotype.
    supporting_text: Add response to starvation as a justified new BP term supported by the KT2440 mutant
      phenotype.
