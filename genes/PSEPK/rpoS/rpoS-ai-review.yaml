  label: Pseudomonas putida KT2440
description: Stationary-phase sigma factor that reprograms RNA polymerase promoter specificity during
  carbon starvation and general stress adaptation in Pseudomonas putida KT2440. RpoS is a sigma-70 family
  alternative sigma factor that drives transcription initiation at stationary- and stress-associated promoters,
  supports starvation survival and cross-protection, and also contributes to condition-specific lifestyle
  outputs such as biofilm-associated c-di-GMP signaling.
