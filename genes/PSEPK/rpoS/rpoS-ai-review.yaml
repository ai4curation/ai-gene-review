suggested_questions:
- question: Which RpoS-associated promoters have direct functional evidence in KT2440 under each stress
    condition, beyond the verified PwspA relationship?
- question: How do direct RpoS promoter effects differ from downstream c-di-GMP, biofilm and indirect
    K1-T6SS responses across growth conditions?
suggested_experiments:
- hypothesis: The direct KT2440 RpoS regulon during starvation is smaller than the full set of downstream
    stationary-phase phenotypes.
  description: Perform paired RNA-seq and ChIP-seq or ChIP-exo in wild-type and delta-rpoS cells during
    exponential growth, early carbon starvation, and stationary phase to separate direct promoter targets
    from indirect downstream effects.
  experiment_type: transcriptomics and DNA-binding profiling
- hypothesis: RpoS-dependent biofilm phenotypes arise from a condition-specific promoter subset rather
    than a universal biofilm program.
  description: Measure biofilm formation, c-di-GMP levels, and promoter activity of wspA, cfcR, lapA,
    and lapF in wild-type, delta-rpoS, and complemented strains under carbon limitation, tetracycline
    stress, and rhizosphere-mimicking conditions.
  experiment_type: targeted genetics and reporter assays
- hypothesis: Upstream regulators such as PsrA and post-transcriptional factors control RpoS at distinct
    stages of growth-phase transition.
  description: Combine translational rpoS reporter fusions with psrA, hfq, and polyphosphate-pathway perturbations
    to quantify how transcriptional versus post-transcriptional inputs shape RpoS accumulation across
    the growth curve.
  experiment_type: reporter fusion analysis
