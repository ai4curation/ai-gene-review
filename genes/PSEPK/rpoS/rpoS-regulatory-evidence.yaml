regulator:
  accession: Q88ME8
  locus: PP_1623
  taxon: NCBITaxon:160488
relationships:
- id: rpos-wspA
  target:
    name: PwspA
    type: promoter
    locus: PP_1488
  regulatory_level: transcription
  effect: activates
  directness: direct
  experimental_strain: P. putida KT2440, delta-rpoS and complementation strains
  condition: 'Standard promoter/motif reporter assays: ten-hour LB culture. Separate tetracycline assays:
    LB, 28 C, 180 rpm; 6 micrograms/mL added after six hours (OD600 about 0.6), followed by four hours
    of incubation.'
  evidence:
  - reference_id: PMID:39589111
    assay: Purified His-RpoS EMSA with competitors and mutation of the conserved -10 motif.
    supporting_text: Mutation of the conserved motif in PwspA (from CTATACT to TCGGCAC) abolished the
      binding of RpoS to PwspA (Fig. 5D).
    source_url: https://pubmed.ncbi.nlm.nih.gov/39589111/
  - reference_id: PMID:39589111
    assay: Promoter-lacZ assays in wild type, rpoS deletion/complementation backgrounds and motif-mutant
      promoter.
    supporting_text: Meanwhile, mutation of the conserved motif significantly decreased PwspA activity
      and abolished the effect of rpoS deletion on PwspA activity (Fig. 5E), suggesting that the conserved
      RpoS motif played a vital role in PwspA activity.
    source_url: https://pubmed.ncbi.nlm.nih.gov/39589111/
  interpretation: RpoS recognition of the major wsp promoter promotes transcription under tetracycline
    stress. This is sigma-factor promoter control, not independent catalytic synthesis of c-di-GMP.
  limitations:
  - Purified-protein binding and in vivo reporters do not constitute reconstituted holoenzyme transcription.
  - One major-promoter relationship is not seven separate contacts with wsp genes; PwspF effects were
    indirect.
pathway_context:
- name: Wsp/c-di-GMP signaling and biofilm response
  relationship: regulates
  mechanism: RpoS promotes wsp expression; downstream WspR synthesizes c-di-GMP and the biofilm machinery
    executes the surface-associated phenotype.
  evidence:
  - reference_id: PMID:39589111
    assay: Promoter-lacZ assays in wild type, rpoS deletion/complementation backgrounds and motif-mutant
      promoter.
    supporting_text: Meanwhile, mutation of the conserved motif significantly decreased PwspA activity
      and abolished the effect of rpoS deletion on PwspA activity (Fig. 5E), suggesting that the conserved
      RpoS motif played a vital role in PwspA activity.
    source_url: https://pubmed.ncbi.nlm.nih.gov/39589111/
