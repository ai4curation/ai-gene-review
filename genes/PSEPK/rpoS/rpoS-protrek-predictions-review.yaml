taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for RpoS, the stationary-phase sigma factor of P. putida. Rank
  1 is an exact GOA match and one of this review's core processes; ranks 2 and 3 add RNA polymerase
  core enzyme binding, which is the defining physical interaction of a sigma factor and is absent
  from GOA. Ranks 4 and 5 then leave for host-symbiont biology that does not apply. Compared with
  the three B. subtilis sporulation sigma factors, where ProTrek returned only generic sporulation
  terms, this list is substantially more sigma-factor-specific - the difference being that RpoS's
  identity is in its promoter class rather than in a developmental compartment. Assessment: 1 correct
  novel (COR), 1 correct not novel (CNN), 1 less precise (LSP).
