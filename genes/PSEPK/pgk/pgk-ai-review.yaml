      supporting_text: 'DR   PROSITE; PS00111; PGLYCERATE_KINASE; 1.'
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      ATP is a substrate (in the gluconeogenic direction) and a product (in
      the glycolytic direction) of the PGK reaction. HAMAP maps ATP-binding
      residues in the C-terminal nucleotide-binding domain (positions 197, 314
      and 340-343).
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP binding is true and supported by HAMAP binding-site evidence, but it
      is a co-substrate feature that serves the kinase activity, so it is kept
      as non-core. This replaces the earlier ACCEPT and matches the other
      KT2440 nucleotide-binding rows (glk, ppsA).
    supported_by:
    - reference_id: file:PSEPK/pgk/pgk-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="ATP"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      HAMAP MF_00145 places phosphoglycerate kinase in the cytoplasm, which
      fits a soluble monomeric glycolytic enzyme.
    action: TOO_GENERAL
    reason: >-
      The claim is true, but cytosol (GO:0005829), accepted in this review, is
      part_of cytoplasm (checked in GO), so this row is entailed by the more
      specific location.
    supported_by:
    - reference_id: file:PSEPK/pgk/pgk-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
