core_functions:
- description: >-
    Reversible phosphoryl transfer between 3-phospho-D-glyceroyl phosphate and
    ADP, giving 3-phosphoglycerate and ATP. In KT2440 this is the ATP-yielding
    step of the lower trunk that converts ED-derived triose phosphate to
    pyruvate, and the reverse step of gluconeogenesis.
