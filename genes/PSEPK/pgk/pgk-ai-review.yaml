id: Q88D64
gene_symbol: pgk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  pgk (PP_4963) encodes the phosphoglycerate kinase of Pseudomonas putida
  KT2440, a monomeric, cytoplasmic two-domain hinge-bending enzyme of the PGK
  family. The N-terminal domain binds the phosphoglycerate substrate and the
  C-terminal domain binds the Mg-adenine nucleotide. It catalyzes the
  reversible transfer of the acyl-phosphate group of 3-phospho-D-glyceroyl
  phosphate to ADP, giving 3-phosphoglycerate and ATP. In the glycolytic
  direction this is a substrate-level phosphorylation. In the gluconeogenic
  direction the reaction runs in reverse, regenerating
  1,3-bisphosphoglycerate. KT2440 lacks 6-phosphofructokinase and
  catabolizes glucose through periplasmic oxidation and the Entner-Doudoroff
  pathway. Pgk acts in the lower trunk, which carries ED-derived
  glyceraldehyde 3-phosphate to pyruvate during glucose growth and runs
  gluconeogenically on gluconeogenic substrates.
