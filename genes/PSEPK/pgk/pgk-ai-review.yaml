- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The PGK reaction is freely reversible and is the step that gluconeogenesis
      uses to convert 3-phosphoglycerate to 1,3-bisphosphoglycerate. In
      KT2440, gluconeogenic flux from PEP and pyruvate (via ppsA) and the
      gluconeogenic operation of the EMP enzymes both depend on this step.
    action: ACCEPT
    reason: >-
      Pgk is the only phosphoglycerate kinase in KT2440 and catalyzes a
      gluconeogenic step itself, so it participates in this process.
    supported_by:
    - reference_id: file:PSEPK/pgk/pgk-deep-research-falcon.md
      supporting_text: Pgk’s physiological importance is best viewed as supporting **lower-glycolysis segment function, energy balance, and gluconeogenic flux**
    - reference_id: PMID:26350459
      supporting_text: the EMP (operating in a gluconeogenic fashion)
- term:
    id: GO:0006096
    label: glycolytic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Pgk catalyzes step 2 of the 5 steps from glyceraldehyde 3-phosphate to
      pyruvate. In KT2440 this lower trunk carries the triose phosphate made by
      the Entner-Doudoroff pathway, the main glucose catabolic route, and Pgk
      generates ATP there by substrate-level phosphorylation. GO obsoleted
      GO:0061688 (glycolysis via ED) with replaced_by GO:0006096, so this term
      covers ED-route glycolysis.
    action: ACCEPT
    reason: >-
      Pgk performs a step of the lower glycolytic trunk that operates during
      glucose catabolism in KT2440. This is the same action as the other
      lower-trunk enzymes (gapA, gapB, gpmI, eno, pykA, pyk).
    supported_by:
    - reference_id: file:PSEPK/pgk/pgk-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Carbohydrate degradation; glycolysis; pyruvate from D-glyceraldehyde 3-phosphate: step 2/5.'
    - reference_id: PMID:26350459
      supporting_text: glycolysis is known to proceed almost exclusively through the Entner-Doudoroff (ED) route
- term:
