- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      pgk is a soluble monomer, cytoplasmic according to HAMAP, with no signal
      peptide or transmembrane feature, so cytosol is the appropriate specific
      location.
    action: ACCEPT
    reason: >-
      Cytosol is accepted as the specific location of this soluble
      central-metabolism enzyme, as for gpmI, pgi1 and pgi2. The quote
      supports cytoplasm. The cytosol refinement rests on the absence of
      membrane or export features.
    supported_by:
    - reference_id: file:PSEPK/pgk/pgk-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
