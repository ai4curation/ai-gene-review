- id: PMID:33089610
  title: Ribonucleases control distinct traits of Pseudomonas putida lifestyle.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct KT2440 deletion study that includes RNase R and establishes
      target-species physiological relevance without defining catalytic
      mechanism or complex membership.
  findings:
  - supporting_text: Each mutant lacked either one exoribonuclease (PNPase, RNase R) or one endoribonuclease (RNase E, RNase III, RNase G).
- id: PMID:15705581
  title: Exoribonuclease R interacts with endoribonuclease E and an RNA helicase in the psychrotrophic bacterium Pseudomonas syringae Lz4W.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Same-genus biochemical evidence establishes an RNase R-RNase E-RhlE
      complex, but does not establish this composition in P. putida.
  findings:
  - supporting_text: Most surprisingly, the hydrolytic exoribonuclease RNase R was found to co-purify with RNase E.
  - supporting_text: Co-immunoprecipitation and Ni(2+)-affinity pull-down experiments confirmed the specific interaction between RNase R and RNase E.
core_functions:
- description: >-
    Provides processive hydrolytic 3'-to-5' exoribonuclease activity for RNA
    turnover and maturation of structured RNAs. Its possible recruitment into
    a KT2440 RNase E-centered complex remains unresolved.
