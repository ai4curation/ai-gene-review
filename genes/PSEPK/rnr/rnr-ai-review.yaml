suggested_questions:
- question: Does KT2440 RNase R associate with RNase E or RhlE under conditions that favor structured-RNA decay?
  experts: []
suggested_experiments:
- description: >-
    Test RNase R interactions with RNase E and both RhlE paralogs by reciprocal
    affinity purification, and measure structured-RNA decay intermediates in an
    rnr perturbation strain.
