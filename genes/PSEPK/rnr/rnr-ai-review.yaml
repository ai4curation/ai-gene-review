  label: Pseudomonas putida KT2440
description: RNase R is a cytosolic processive 3'-to-5' hydrolytic exoribonuclease that binds RNA and
  releases nucleoside 5'-monophosphates. It is particularly suited to degradation and maturation of structured
  RNAs. RNase R orthologs can partner with RNase E and RhlE, but that complex composition has not been
  demonstrated directly in Pseudomonas putida KT2440.
