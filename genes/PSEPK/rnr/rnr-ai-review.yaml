- id: PMID:33089610
  title: Ribonucleases control distinct traits of Pseudomonas putida lifestyle.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct KT2440 deletion study that includes RNase R and establishes target-species physiological
      relevance without defining catalytic mechanism or complex membership.
  findings:
  - supporting_text: Each mutant lacked either one exoribonuclease (PNPase, RNase R) or one endoribonuclease
      (RNase E, RNase III, RNase G).
- id: PMID:15705581
  title: Exoribonuclease R interacts with endoribonuclease E and an RNA helicase in the psychrotrophic
    bacterium Pseudomonas syringae Lz4W.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Same-genus biochemical evidence establishes an RNase R-RNase E-RhlE complex, but does
      not establish this composition in P. putida.
  findings:
  - supporting_text: Most surprisingly, the hydrolytic exoribonuclease RNase R was found to co-purify
      with RNase E.
  - supporting_text: Co-immunoprecipitation and Ni(2+)-affinity pull-down experiments confirmed the specific
      interaction between RNase R and RNase E.
- id: PMID:15664199
  title: An important role for RNase R in mRNA decay.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: E. coli RNase R in structured mRNA decay; cited as orthology support for conserved RNA
      binding/degradation. No P. putida data.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings: []
  reference_review:
