- term:
    id: GO:0061798
    label: GTP 3',8'-cyclase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      GTP 3',8'-cyclase activity is possible but not established for PP_2482: the
      MoaA ligand-binding residues are conserved and the gene sits in a molybdoenzyme
      cluster, but the protein fails both function-level MoaA models and the score
      loss is not explained as benign.
    action: UNDECIDED
    reason: >-
      Reverted from ACCEPT (2026-10-15) to UNDECIDED (2026-10-16) after scoring the
      function-level models. NCBIfam TIGR02666 (moaA): Q88K11 scores 268.1 bits,
      15.9 below the trusted cutoff (284.05) and 2.9 below the noise cutoff
      (270.95), against 370-403 bits for every reviewed MoaA tested, including both
      P. aeruginosa paralogs, and 81 bits for the KT2440 PqqE control. HAMAP
      MF_01225_B: normalized score 30.6, below the level-0 trigger cutoff 35.254 that
      every reviewed MoaA passes; the rule's size and 14 FT binding-residue
      conditions are all met, so the failure is in the profile score itself. The
      loss is not a missing non-catalytic segment. It is spread along the protein,
      mostly in the N-terminal radical-SAM region and the C-terminal twitch/tail,
      and falls at eight positions that every canonical MoaA conserves but both
      paralogs replace (e.g. Q88E69 R30 and R78), none of them a UniProt-annotated
      ligand position. All 17 annotated ligand positions align confidently and are
      identical (UniProt itself annotates no binding sites on Q88K11). Ligand-site
      conservation therefore does not discriminate here: a MoaA-derived paralog keeps
      those residues whatever its present substrate. The shared PANTHER
      PTHR22960:SF0 (and the SFLD MoaA-like group and KEGG K03639) is the
      classification that produced this TreeGrafter row, and is treated as
      non-discriminative between paralogs, exactly as for PP_3571, gabD-II and
      PP_4594 in the same re-review batch. The gene context is the strongest point
      in favour: PP_2482 ends a same-strand cluster with an isoquinoline
      1-oxidoreductase-type molybdoenzyme and an XdhC-like accessory factor, next to
      PP_2483 (K07141 by KEGG, though locally closer to E. coli MobA than MocA). A
      cluster-dedicated MoaA copy is plausible, but the context does not show which
      reaction PP_2482 catalyses, and it does not explain the model failure. Three
      paralogs assigned one activity on sequence alone is the paralog
      over-annotation pattern. A blinded OpenScientist run judged the term supported
      from architecture, cysteine and subfamily evidence, without the model scores.
      The call needs an assay or complementation.
    supported_by:
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        Both paralogs score just below the noise cutoff and about 15-16 bits below the
        trusted cutoff.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: They are a distinct intermediate group, not borderline members of the
        canonical one.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: So the HAMAP non-match is a profile-score failure only.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: None of the score loss is at an annotated ligand position.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        The TIGR02666 and MF_01225 non-matches are not explained by a missing
        non-catalytic segment.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        Ligand-site conservation is expected of a MoaA-derived paralog whatever its
        present substrate, so it cannot by itself separate a GTP 3',8-cyclase from a
