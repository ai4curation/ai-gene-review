    - reference_id: file:PSEPK/PP_2482/PP_2482-hypotheses/function-hypothesis-go-0061798/openscientist.md
      supporting_text: All **six catalytic cysteines are present with conserved spacing**.
    - reference_id: file:PSEPK/PP_2482/PP_2482-uniprot.txt
      supporting_text: DR   PANTHER; PTHR22960:SF0; MOLYBDENUM COFACTOR BIOSYNTHESIS PROTEIN 1; 1.
    - reference_id: file:PSEPK/moaA/moaA-uniprot.txt
      supporting_text: DR   PANTHER; PTHR22960:SF0; MOLYBDENUM COFACTOR BIOSYNTHESIS PROTEIN 1; 1.
    - reference_id: file:PSEPK/moaA/moaA-bioinformatics/RESULTS.md
