- term:
    id: GO:0061798
    label: GTP 3',8'-cyclase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      GTP 3',8'-cyclase activity is supported for PP_2482: it has the MoaA domain
      architecture and retains every GTP-, SAM- and [4Fe-4S]-binding residue
      annotated on reviewed KT2440 MoaA.
    action: ACCEPT
    reason: >-
      Previously UNDECIDED because Q88K11 lacks the MoaA-specific database records of
      reviewed Q88E69 (NCBIfam TIGR02666, HAMAP MF_01225, PROSITE PS01305, InterPro
      IPR013483/IPR000385) and is only 36.25% identical to it. A blinded OpenScientist
      run, which did not see the local analyses, found the target in PANTHER
      PTHR22960:SF0 with the PF04055 radical-SAM plus PF06463 twitch architecture and
      all six cluster cysteines intact (C21/C25/C28 and C253/C256/C270). Checked here:
      the UniProt record carries PTHR22960:SF0, PF06463 and IPR010505, the same
      subfamily as reviewed Q88E69; the local motif table gives the same cysteine
      positions; and a new site mapping shows that all seven GTP-binding positions,
      all four SAM-binding positions and all six cluster cysteines annotated on Q88E69
      align to identical residues in Q88K11, except V266, which is Leu here as in
      characterized E. coli MoaA. The PS01305 failure is explained by two
      substitutions at non-ligand positions (CNYAC for C-[NDP]-[LIVMF]-[DNQRS]-C), so
      the two analyses agree on the facts and differ only in how much weight the
      missing signatures carry. Retaining the GTP-binding set argues against a change
      of substrate. Two of the run's supporting claims are not used: UniProt does not
      annotate binding sites on Q88K11 (the record has no FT BINDING lines), and the
      neighbour PP_2483 is K07141 but closer to E. coli MobA than MocA in the local
      comparison, so it does not establish a MocA context. No PP_2482 assay exists, so
      this remains a sequence-based call; it is not a claim about how much flux
      PP_2482 carries relative to its paralogs.
    supported_by:
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        The divergence of PP_1969 and PP_2482 from canonical KT2440 MoaA does not touch the
