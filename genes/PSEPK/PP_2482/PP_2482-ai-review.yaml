        including one (cd21117) not considered earlier.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: This is a molybdoenzyme cluster.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        A Moco-related context for PP_2482 is compatible with a dedicated GTP
        3',8-cyclase but does not show which reaction it catalyses.
