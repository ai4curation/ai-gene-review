- id: file:PSEPK/PP_2482/PP_2482-hypotheses/function-hypothesis-go-0061798/openscientist.md
  title: OpenScientist TreeGrafter stress test of PP_2482 GTP 3',8'-cyclase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Blinded run (batch openscientist-controls-2026-10-14; local bioinformatics
      withheld). Its decisive claims were checked against repository data: PANTHER
      PTHR22960:SF0, PF04055 + PF06463 and IPR010505 are in the UniProt record; the
      cluster cysteine positions match the local motif table; and an independent
      site mapping (PP_1969-bioinformatics/RESULTS.md) confirms and extends the
      active-site claim to the GTP- and SAM-binding residues. Two secondary claims
      are wrong or overstated: the Q88K11 UniProt record has no binding-site
      features, contrary to the report, and PP_2483 is K07141 but closer to E. coli
      MobA than MocA locally. Its verdict did not consider the function-level
      models: the paralog falls below both TIGR02666 and HAMAP MF_01225, so the
      verdict is not adopted. Cited literature (PMID:25941396, PMID:30097104,
      PMID:26575208) is not cached and is not relied on. AlphaFold pLDDT claims were
      not re-run.
  findings:
  - statement: The run judges GO:0061798 supported, at the right granularity, with no failure mode
      applying.
    supporting_text: '**Verdict: SUPPORTED.** The propagated GO:0061798 annotation is correct and at the
      appropriate granularity for PP_2482.'
  - statement: The run reports all six [4Fe-4S]-cluster cysteines conserved.
    supporting_text: All **six catalytic cysteines are present with conserved spacing**.
  - statement: The run states that no direct assay exists for PP_2482.
    supporting_text: 1. **No direct biochemical assay for PP_2482.** All evidence is computational,
      evolutionary, and homology-based.
  - statement: The run identifies paralog division of labour as unresolved.
    supporting_text: 2. **Paralog division of labor is unresolved.**
- id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
  title: Ligand-binding residue conservation in KT2440 MoaA paralogs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible scripts and raw outputs in the PP_1969 bioinformatics folder; it
      covers both PP_1969 and PP_2482. Binding positions are parsed from the
      reviewed Q88E69 UniProt record rather than hardcoded. The 2026-10-16 section
      adds TIGR02666 (hmmsearch), HAMAP MF_01225_B (pfsearchV3), InterPro API and
      KEGG neighbourhood results, with cutoffs read from the model headers.
  findings:
  - statement: All annotated GTP-, SAM- and cluster-binding residues of reviewed KT2440 MoaA are
      conserved in PP_1969 and PP_2482.
    supporting_text: >-
      The divergence of PP_1969 and PP_2482 from canonical KT2440 MoaA does not touch the
      annotated GTP-, SAM- or cluster-binding residues.
  - statement: PP_1969 and PP_2482 fall below the TIGR02666 noise and trusted cutoffs, about 100
      bits below every reviewed MoaA tested.
    supporting_text: >-
      Both paralogs score just below the noise cutoff and about 15-16 bits below the
      trusted cutoff.
  - statement: Both paralogs fail the HAMAP MF_01225_B level-0 cutoff while meeting all of the
      rule's FT conditions.
    supporting_text: So the HAMAP non-match is a profile-score failure only.
  - statement: The model-score loss is spread along the protein, not at annotated ligand positions
      or in one missing segment.
    supporting_text: >-
      The TIGR02666 and MF_01225 non-matches are not explained by a missing
      non-catalytic segment.
  - statement: PP_2482 ends a gene cluster encoding an isoquinoline 1-oxidoreductase-type
      molybdoenzyme.
    supporting_text: This is a molybdoenzyme cluster.
core_functions:
- description: >-
    MoaA-family radical-SAM protein with intact [4Fe-4S]-cluster and SAM-binding
    sites, encoded with an isoquinoline 1-oxidoreductase-type molybdoenzyme
    cluster; whether it cyclizes GTP like canonical MoaA, and which step of
    cofactor provision for that enzyme it serves, is unresolved.
  supported_by:
  - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
    supporting_text: >-
      The divergence of PP_1969 and PP_2482 from canonical KT2440 MoaA does not touch the
      annotated GTP-, SAM- or cluster-binding residues.
  - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
    supporting_text: They are a distinct intermediate group, not borderline members of the canonical
      one.
  - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
    supporting_text: This is a molybdoenzyme cluster.
proposed_new_terms: []
suggested_questions:
- question: >-
    PP_2482 keeps every annotated MoaA ligand residue and ends a cluster encoding an
    isoquinoline 1-oxidoreductase-type molybdoenzyme, yet falls below the TIGR02666
    and HAMAP MF_01225 MoaA models. Does it cyclize GTP to supply cofactor for that
    enzyme, or catalyse a related reaction in its maturation?
suggested_experiments:
- description: Compare purified PP_2482 with canonical MoaA for GTP turnover and cyclic intermediate
    formation, and test complementation of a moaA deletion.
  experiment_type: comparative enzyme assay and genetic complementation
- description: >-
    Delete PP_2482 and canonical moaA (PP_4597) singly and together and measure
    activity of the PP_2477-PP_2478 isoquinoline 1-oxidoreductase-type enzyme and of
    a moaA-dependent molybdoenzyme, to test whether PP_2482 supplies cofactor
    precursor specifically for its cluster.
  experiment_type: genetic knockout and enzyme activity assay
