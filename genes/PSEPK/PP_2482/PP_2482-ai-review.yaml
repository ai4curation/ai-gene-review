id: Q88K11
gene_symbol: PP_2482
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_2482 encodes a MoaA-family radical-SAM protein, one of three MoaA paralogs in
  P. putida KT2440. It has the N-terminal radical-SAM CxxxCxxC [4Fe-4S] motif and
  the C-terminal MoaA twitch domain with the second set of cluster cysteines, and
  the GTP-, S-adenosyl-L-methionine- and cluster-binding residues annotated on
  canonical KT2440 MoaA are conserved. It forms a closely related pair with PP_1969
  that falls below the function-level MoaA family models and differs from all
  characterized MoaA proteins at several otherwise invariant positions. The gene
  lies at the end of a cluster encoding an isoquinoline 1-oxidoreductase-type
  molybdoenzyme, a cytochrome c protein and a xanthine dehydrogenase
  accessory-factor homolog, next to PP_2483, a MobA/MocA-like nucleotidyltransferase.
  This places it in a molybdoenzyme context, but whether it cyclizes GTP like
  canonical MoaA or catalyses a related reaction for that system is unknown.
