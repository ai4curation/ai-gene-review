suggested_questions:
- question: >-
    PP_2482 keeps the full MoaA GTP-binding site, yet KT2440 also has canonical moaA
    (PP_4597) and the PP_1969 paralog. Does PP_2482 supply cyclic pyranopterin
    precursor for a particular molybdoenzyme system, such as one using the adjacent
    PP_2483 nucleotidyltransferase, and under which conditions?
suggested_experiments:
- description: Compare purified PP_2482 with canonical MoaA for GTP turnover and cyclic intermediate formation, and test complementation of a moaA deletion.
  experiment_type: comparative enzyme assay and genetic complementation
