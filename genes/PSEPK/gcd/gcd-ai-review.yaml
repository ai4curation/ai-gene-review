id: Q88MX4
gene_symbol: gcd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain KT2440)
description: >-
  Inner-membrane quinoprotein glucose dehydrogenase whose periplasm-facing
  catalytic domain oxidizes D-glucose to D-glucono-1,5-lactone using PQQ and
  transfers electrons to ubiquinone. The lactone hydrolyzes to gluconate, which
  can enter either the gluconate kinase route or the 2-ketogluconate loop.
existing_annotations:
  - term: {id: "GO:0008876", label: quinoprotein glucose dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The EC-supported term precisely describes the PQQ-dependent glucose oxidation reaction.
      action: ACCEPT
      reason: This is the core molecular function and agrees with KT2440 biochemical evidence.
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Gcd is a bacterial inner-membrane protein, so the source term is too broad.
      action: MODIFY
      reason: Replace the generic membrane term with the topology-specific cellular component.
      proposed_replacement_terms:
        - {id: "GO:0005886", label: plasma membrane}
  - term: {id: "GO:0016614", label: "oxidoreductase activity, acting on CH-OH group of donors"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This broad parent adds no information beyond GO:0008876.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retain the exact quinoprotein glucose dehydrogenase term as the core MF.
  - term: {id: "GO:0048038", label: quinone binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Gcd binds PQQ specifically rather than an unspecified quinone.
      action: MODIFY
      reason: The specific cofactor-binding child term is supported by the enzyme biochemistry.
      proposed_replacement_terms:
        - {id: "GO:0070968", label: pyrroloquinoline quinone binding}
  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: IMP
    qualifier: involved_in
    review:
      summary: KT2440 genetics and flux analysis place Gcd at the start of periplasmic oxidative glucose catabolism.
      action: NEW
      reason: This is more specific than broad glucose catabolism and covers the non-phosphorylated peripheral routes.
  - term: {id: "GO:0042597", label: periplasmic space}
    evidence_type: TAS
    qualifier: is_active_in
    review:
      summary: The membrane-anchored enzyme performs glucose oxidation on the periplasmic side.
      action: NEW
      reason: Use is_active_in because the catalytic domain faces the periplasm while the protein is membrane-integral.
references:
