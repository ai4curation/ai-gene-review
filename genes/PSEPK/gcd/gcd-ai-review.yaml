  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: IMP
    qualifier: involved_in
    review:
      summary: KT2440 genetics and flux analysis place Gcd at the start of periplasmic oxidative glucose catabolism.
      action: NEW
      reason: This is more specific than broad glucose catabolism and covers the non-phosphorylated peripheral routes.
      supported_by:
        - reference_id: PMID:17483213
          supporting_text: "glucose catabolism in Pseudomonas putida occurs through the simultaneous operation of three pathways that converge at the level of 6-phosphogluconate"
        - reference_id: file:PSEPK/gcd/gcd-deep-research-falcon.md
