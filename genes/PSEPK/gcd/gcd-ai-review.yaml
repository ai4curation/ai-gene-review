id: Q88MX4
gene_symbol: gcd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Inner-membrane quinoprotein glucose dehydrogenase whose periplasm-facing
  catalytic domain oxidizes D-glucose to D-glucono-1,5-lactone using PQQ and
  transfers electrons to ubiquinone. The lactone hydrolyzes to gluconate, which
  can enter either the gluconate kinase route or the 2-ketogluconate loop.
  Its secretion of gluconic acid also contributes indirectly to mineral
  phosphate solubilization under low-phosphate conditions.
existing_annotations:
  - term: {id: "GO:0008876", label: quinoprotein glucose dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The EC-supported term precisely describes the PQQ-dependent glucose oxidation reaction.
      action: ACCEPT
      reason: This is the core molecular function and agrees with KT2440 biochemical evidence.
      supported_by:
        - reference_id: PMID:27287323
          supporting_text: "which is produced from glucose by a periplasmic glucose dehydrogenase (GDH) that requires pyrroloquinoline quinone (PQQ) as a redox coenzyme."
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Gcd is a bacterial inner-membrane protein, so the source term is too broad.
      action: MODIFY
      reason: Replace the generic membrane term with the topology-specific cellular component.
      proposed_replacement_terms:
        - {id: "GO:0005887", label: integral component of plasma membrane}
      supported_by:
        - reference_id: file:PSEPK/gcd/gcd-uniprot.txt
