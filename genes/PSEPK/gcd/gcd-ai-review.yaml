  - term: {id: "GO:0042597", label: periplasmic space}
    evidence_type: ISS
    qualifier: is_active_in
    review:
      summary: The membrane-anchored enzyme performs glucose oxidation on the periplasmic side.
      action: NEW
      reason: Use is_active_in because the catalytic domain faces the periplasm while the protein is membrane-integral.
      supported_by:
        - reference_id: PMID:27287323
          supporting_text: "periplasmic glucose dehydrogenase (GDH)"
