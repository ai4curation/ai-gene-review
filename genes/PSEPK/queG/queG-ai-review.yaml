id: Q88DC7
gene_symbol: queG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  QueG is the cytoplasmic epoxyqueuosine reductase of Pseudomonas putida
  KT2440. This cobalamin- and [4Fe-4S]-dependent enzyme catalyzes the final
  bacterial queuosine-pathway step, reducing epoxyqueuosine at tRNA wobble
  position 34 to mature queuosine in tRNA(Asp), tRNA(Asn), tRNA(His), and
  tRNA(Tyr).
