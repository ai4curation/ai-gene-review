gene_symbol: fliG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: 'FliG is a core component of the bacterial flagellar motor switch complex (C-ring), which
  assembles together with FliM and FliN on the cytoplasmic face of the MS-ring (FliF) at the base of the
  flagellar basal body. FliG is a peripheral, cytoplasmic-side membrane protein organized into three domains:
  an N-terminal domain that docks onto the FliF MS-ring, a middle domain that binds FliM, and a C-terminal
  domain bearing the conserved "torque helix" that interacts electrostatically with the cytoplasmic loops
  of the MotA/MotB-type stator units. Through these stator contacts FliG couples ion-motive-force-driven
  stator activity to rotation of the rotor, making it the key element that transmits torque to the flagellum.
  FliG also mediates directional switching of flagellar rotation: as the output of the chemotaxis signaling
  pathway, phosphorylated CheY binds the C-ring (FliM/FliN) and triggers large conformational rearrangements
  in FliG that reorient its stator-facing surface, switching rotation between counterclockwise and clockwise
  states. The protein is therefore essential for both flagellum-dependent motility and the chemotactic
  control of swimming direction. In Pseudomonas putida KT2440 the gene (PP_4368) lies within the flagellar
  gene cluster and is co-transcribed in the fliEFG operon.'
