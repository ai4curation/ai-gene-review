- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: FliG relays switch conformational changes to the stator-facing rotor interface during chemotaxis.
    action: ACCEPT
    reason: Direction switching is part of FliG’s central rotor function, not a peripheral phenotype.
      The mechanistic assignment is inferred from the conserved FliG switch architecture and comparative
      bacterial motor studies; no KT2440 purified switch assay is asserted. The comparative review explicitly
      links CheY-P control through FliM/FliN to FliG rotor reorientation; this establishes a mechanistic
      bridge to guided movement rather than switching in isolation. Domain/residue notation is that of
      the comparative source, not a mapped KT2440 residue experiment.
    supported_by:
    - reference_id: PMID:31452860
      supporting_text: The binding of CheY-P to FliM and FliN affects subunit-subunit interactions between
        FliMM domains and between FliMC and FliN in the C ring to induce a 180° rotation of FliGCC relative
        to MotAC, thereby allowing the motor to rotate in CW direction
    - reference_id: PMID:31452860
