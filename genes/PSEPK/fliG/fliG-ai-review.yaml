- id: PMID:34859548
  title: Transcriptional organization and regulation of the Pseudomonas putida flagellar system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Citation-integrity fix: this reference was originally entered as PMID:36256818, which
      actually resolves to an unrelated paper ("Bacterial catabolism of acetovanillone...") and was a
      wrong identifier. The intended source is Leal-Morales et al., "Transcriptional organization and
