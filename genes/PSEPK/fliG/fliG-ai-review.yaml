- id: PMID:31452860
  title: Directional Switching Mechanism of the Bacterial Flagellar Motor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Citation-integrity fix: this reference was originally entered as PMID:31413904, which
      actually resolves to an unrelated social-science paper ("Using Mixed Methods to Examine Perceptions
      and Willingness to Participate in Biospecimen...") and was a hallucinated/wrong identifier. The
      intended source is Minamino, Kinoshita & Namba, "Directional Switching Mechanism of the Bacterial
      Flagellar Motor" (Comput Struct Biotechnol J 2019;17:1075-1081, doi:10.1016/j.csbj.2019.07.020),
      an authoritative review of FliG domain architecture (N/M/C), FliG-FliF/FliM/MotA interactions, and
      the role of FliG in torque generation and directional switching. The cached record contains full
      text, including direct statements about FliG torque generation and C-ring architecture.'
