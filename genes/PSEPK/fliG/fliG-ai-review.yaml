core_functions:
- description: Rotor/switch component of the flagellar motor that couples ion-motive-force-driven stator
    activity to torque generation and rotation of the flagellum, and changes C-ring conformation during
    directional switching. The rotor-stator mechanism is inferred from conserved FliG architecture and
    comparative structures; the specific KT2440 protein has not been assayed structurally.
  supported_by:
  - reference_id: PMID:31452860
    supporting_text: FliG is directly involved in torque generation [8].
  - reference_id: PMID:31452860
    supporting_text: The C ring also serves as a switching device that enables the motor to spin in both
      counterclockwise (CCW) and clockwise (CW) directions.
  - reference_id: PMID:39179739
    supporting_text: The CheY proteins are bound into an open groove between two adjacent protomers on
      the surface of the middle subring of the C ring and interact with the FliG and FliM subunits.
