- id: file:PSEPK/fliG/fliG-deep-research-openscientist.md
  title: OpenScientist functional report for PSEPK FliG
  findings:
  - statement: Corroborates the conserved FliG three-domain architecture, C-ring placement, stator contact,
      and directional-switch role. Its whole-protein torque wording is interpreted conservatively as contribution
      to assembled motor activity.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: On-target provider report that recovers the conserved FliG architecture and C-ring placement,
      but it overstates whole-protein torque generation; the review interprets that claim conservatively
      as contribution to the assembled proton-motive-force-driven motor.
- id: PMID:39179739
  title: Structural basis of the bacterial flagellar motor rotational switching.
  findings:
  - statement: Salmonella C-ring cryo-EM with constitutively active CheY D13K/Y106W supports switching
      through FliM/FliG; it is comparative mechanistic evidence rather than an assay of KT2440 proteins.
    supporting_text: The CheY proteins are bound into an open groove between two adjacent protomers on
      the surface of the middle subring of the C ring and interact with the FliG and FliM subunits.
