proposed_new_terms: []
suggested_questions:
- question: Does deletion of fliG in P. putida KT2440 produce a non-motile (non-flagellated or paralyzed)
    phenotype, as predicted from conserved FliG function?
- question: Is FliG function in P. putida modulated by c-di-GMP effectors (e.g., FlgZ/PP4397) acting as
    a motor brake on the C-ring or stator?
suggested_experiments:
- description: Construct an in-frame fliG deletion and complementation in P. putida KT2440 and assay swimming/swarming
    motility and flagellation by electron microscopy.
- description: Co-purification / bacterial two-hybrid assays to confirm FliG-FliF, FliG-FliM, and FliG-MotA
    interactions in P. putida.
