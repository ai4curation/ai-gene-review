description: ArgD (PP_4481) is a pyridoxal-phosphate-dependent acyl-ornithine aminotransferase
  embedded in the KT2440 arginine succinyltransferase catabolic operon. Its primary
  predicted physiological function is N2-succinyl-L-ornithine transamination (EC 2.6.1.81)
  in arginine catabolism. Secondary acetylornithine and succinyldiaminopimelate activities
  remain plausible because this enzyme family is substrate-promiscuous.
