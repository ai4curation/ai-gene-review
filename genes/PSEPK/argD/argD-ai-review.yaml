id: P59319
gene_symbol: argD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ArgD (PP_4481) is a pyridoxal-phosphate-dependent acyl-ornithine aminotransferase embedded in the KT2440
  arginine succinyltransferase catabolic operon. Its primary predicted physiological function is N2-succinyl-L-ornithine
  transamination (EC 2.6.1.81) in arginine catabolism. Secondary acetylornithine and succinyldiaminopimelate
  activities remain plausible because this enzyme family is substrate-promiscuous.
existing_annotations:
- term:
    id: GO:0003992
    label: N2-acetyl-L-ornithine:2-oxoglutarate 5-transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      P59319 is likely capable of acetylornithine transamination, but this is not its primary pathway
      role.
    action: KEEP_AS_NON_CORE
    reason: >-
      PP_4481 lies in the AST catabolic operon and PANTHER places it in the AstC/AruC subfamily SF113.
      Both characterized SF113 relatives have genuine acetylornithine transaminase activity (P. aeruginosa
      AruC serves both pathways; E. coli AstC is one of several redundant ACOATs), so the activity is
      a real secondary activity here too, but the catabolic SOAT reaction is the core role. Treated the
      same as the E. coli AstC rows.
    additional_reference_ids:
    - PMID:23484010
    supported_by:
    - &id002
      reference_id: file:PSEPK/argD/argD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR11986:SF113; SUCCINYLORNITHINE TRANSAMINASE; 1.
    - &id001
      reference_id: PMID:16593724
      supporting_text: >-
        Purified N(2)-acetylornithine 5-aminotransferase (N(2)-acetyl-L-ornithine: 2-oxoglutarate aminotransferase,
        EC 2.6.1.11), an arginine biosynthetic enzyme, efficiently transaminated N(2)-succinylornithine;
        this explains the enzyme's dual role in arginine biosynthesis and catabolism.
    - reference_id: PMID:25243376
      supporting_text: >-
        The enzymes with N-acetylornithine aminotransferase (ACOAT) activity in arginine synthesis were
        ArgD, AstC, GabT and PuuE; the major anaerobic ACOAT was ArgD.
