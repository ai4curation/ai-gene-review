  qualifier: enables
  review:
    summary: P59319 is likely capable of acetylornithine transamination, but this
      is not its primary pathway role.
    action: KEEP_AS_NON_CORE
    reason: Reviewed UniProt assigns EC 2.6.1.11, but PP_4481 lies in the AST catabolic
      operon and PANTHER places it in AstC-like SF113. Related AstC enzymes can retain
      ACOAT activity through substrate promiscuity.
