    label: L-arginine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      PP_4481 is a plausible promiscuous contributor to arginine biosynthesis, although its primary physiological
      role is in AST-pathway catabolism.
    action: KEEP_AS_NON_CORE
    reason: >-
      Prior module-level research identifies PP_4481 and PP_0372 as alternative, promiscuous class-III
      transaminases that can fill biosynthetic step 4. The AST-operon context and AstC-like subfamily
      still make catabolism the core role, but the biosynthetic contribution should be retained rather
      than discarded.
    additional_reference_ids:
