- id: PMID:31451546
  title: Arginine Biosynthesis Modulates Pyoverdine Production and Release in Pseudomonas
    putida as Part of the Mechanism of Adaptation to Oxidative Stress.
  full_text_unavailable: true
  findings:
  - statement: The KT2440 study identifies its insertion strain as argD (= astC, PP_4481)
      and reports that this mutant is not arginine auxotrophic, consistent with a
      compensating transaminase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and accessible publisher/PMC full text were checked.
      The local publication cache remains abstract-only, so the full-text statement
      is recorded without a supporting-text excerpt.
- id: PMID:9393691
  title: Cloning and characterization of the aru genes encoding enzymes of the catabolic arginine succinyltransferase pathway in Pseudomonas aeruginosa.
  full_text_unavailable: true
  findings:
  - statement: Comparative Pseudomonas genetics identifies AruC as the AST-pathway succinylornithine aminotransferase.
    supporting_text: >-
      The aruR, aruC, aruD, aruB, and aruE genes specify the ArgR regulatory protein, N2-succinylornithine 5-aminotransferase, N-succinylglutamate 5-semialdehyde dehydrogenase, N2-succinylarginine dihydrolase, and N-succinylglutamate desuccinylase, respectively
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract verified; this is direct Pseudomonas aeruginosa evidence and comparative support for the KT2440 ortholog.
- id: PMID:23484010
  title: Determination of the structure of the catabolic N-succinylornithine transaminase (AstC) from Escherichia coli.
  findings:
  - statement: Defines the PLP-dependent succinylornithine transamination chemistry and demonstrates substrate-bound AstC structure.
    supporting_text: >-
      AstC is a dimeric, pyridoxal phosphate (PLP)-dependent δ–aminotransferase that operates a ping-pong bi-bi reaction mechanism with succinylornithine (SO) and α-ketoglutarate (αKG) as co-substrates and succinylglutamic semialdehyde and glutamate as co-products
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached full text verified; evidence is direct for E. coli AstC and comparative for P59319.
