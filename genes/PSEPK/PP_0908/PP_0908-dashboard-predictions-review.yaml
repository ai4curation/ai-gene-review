description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_QHJD01000032.1_729 is "Soluble exported DUF1513-family protein associated with a
  putative ferrous iron uptake system" (tier A, Dark-Function stratum). The extractor
  attached three GO terms: GO:0008198 ferrous iron binding, GO:0033212 iron import into
  cell and GO:0042597 periplasmic space. The query is 100% identical over all 365
  residues to KT2440 PP_0908 (Q88PE2), so it is scored on that accession. GOA holds no
  annotations for Q88PE2.

  The call text itself is well hedged and largely supported. The protein is DUF1513; it
  has an N-terminal export signal with a twin-arginine-like RRQALK motif and no
  transmembrane segment. It is encoded with two imelysin-like proteins (PP_0909,
  PP_0913) and a di-haem putative peroxidase (PP_0910), in a cluster syntenic with the
  Fur-regulated P. aeruginosa imelysin operon PA4370-PA4373. The tier rationale correctly
  rejects the Fitness Browser "outer membrane" label. Two weaknesses: "ferrous" rests on
  analogy to EfeUOB, but the cluster has no EfeU/FTR1 permease (the only KT2440 FTR1
  family protein, PP_0180, is elsewhere), which matches the imelysin clusters that lack
  EfeU; and the fusaric acid fitness defect may be polar on the downstream co-directional
  RND efflux genes PP_0907-PP_0906. Fusaric acid is itself a likely efflux substrate.

  All three GO terms go beyond the evidence and are scored UNC. The extractor derived
  GO:0008198 from the word "ferrous" in the call, yet nothing shows that DUF1513 binds
  any metal. GO:0033212 is a reasonable hypothesis from gene context but has no direct
  test. GO:0042597 is the most likely location but is a prediction only. Recommended
  dashboard verdict: supported (the text is hedged and the evidence backs it), with the
  annotation corrected to "Exported (Tat-like signal peptide) DUF1513 beta-propeller
  protein of unknown function, encoded in a conserved imelysin / di-haem peroxidase
  cluster implicated in iron acquisition".
