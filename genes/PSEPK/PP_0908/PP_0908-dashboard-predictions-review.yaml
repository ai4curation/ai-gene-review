predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0008198
    label: ferrous iron binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The dashboard's GO extractor derived this term from the word "ferrous" in the
      call, not from any feature of the protein. The call itself names no binding
      activity. DUF1513 has no characterized member, and no metal-binding site, ligand or
      cofactor has been reported for the family. The beta-propeller fold assignment
      (YVTN / quinoprotein amine dehydrogenase beta-chain-like) is structural only. The
      iron-uptake association comes from gene context and cofitness, which do not show
      that this protein binds iron. Even the iron species handled by the cluster is
      uncertain, because it lacks the EfeU/FTR1 ferrous permease. The term is not in
      GOA. Nothing refutes it, so it is scored UNC, not NPI. Missing evidence: metal
      binding by purified protein, or a conserved metal-ligand motif.
    supported_by:
    - reference_id: file:PSEPK/PP_0908/PP_0908-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: It is specifically linked to 'ferrous iron', suggesting ferrous iron binding (MF)
    - reference_id: PMID:21799754
      supporting_text: The genomic context of all previously characterized imelysins bears substantial similarity to EfeUOB, except that EfeU is absent in the operons that encode putative outer-membrane clusters.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0033212
    label: iron import into cell
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      This is the most defensible of the three terms, but it remains a hypothesis.
      Supporting it: PP_0908 is co-directional with, and 2 bp downstream of, the
      imelysin-like PP_0909, in a cluster with a second imelysin (PP_0913) and a di-haem
      putative peroxidase (PP_0910). The cluster is syntenic with the P. aeruginosa
      imelysin operon PA4370-PA4373, which is Fur-regulated (PMID:21799754). Fitness
      Browser curators placed the 81%-identical P. fluorescens orthologues in a cofit
      operon with efeO-like and efeB-like genes. Against a confident call: no
      DUF1513 or imelysin-cluster gene has been shown to be required for iron import;
      the cluster lacks an EfeU/FTR1 inner-membrane permease; and the KT2440 fitness
      defect is in fusaric acid, not under iron limitation, and may be polar on the
      downstream RND efflux genes PP_0907-PP_0906. The term is not in GOA. Missing
      evidence: an iron-uptake or iron-limitation phenotype for a non-polar mutant.
    supported_by:
    - reference_id: PMID:21799754
      supporting_text: The P. aeruginosa Fur-regulated imelysin operon (PA4370–PA4373) consists of two imelysin-like proteins (PA4370/ICMP and PA4372), and one EfeB homolog (PA4371).
    - reference_id: file:PSEPK/PP_0908/PP_0908-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: In a conserved cofit operon with an efeO-like gene (AO356_18455) and an efeB-like gene (AO356_18460).
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0042597
    label: periplasmic space
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      DeepTMHMM predicts a cleavable signal peptide (residues 1-25) and no
      membrane-spanning segment of either kind on the query. The N-terminus carries a
      twin-arginine-like RRQALK motif, conserved in the P. aeruginosa orthologue
      (MLRRHVIGLG). There is no lipobox. A soluble periplasmic location is therefore the
      most likely outcome for a Gram-negative protein. However, this rests on prediction
      alone. UniProt's SignalP run reports no signal feature for Q88PE2. The
      Pfam/Fitness Browser description calls the family an outer-membrane component, and
      several partner imelysins in such clusters are outer-membrane lipoproteins. No
      fractionation or localization experiment exists for any DUF1513 protein. The term
      is not in GOA. It is scored UNC rather than COR: export is well supported, but
      periplasmic residence specifically is not established.
    supported_by:
    - reference_id: file:PSEPK/PP_0908/PP_0908-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: 'Signal peptide: residues 1-25 (cleavable)'
    - reference_id: file:PSEPK/PP_0908/PP_0908-dashboard-prediction-evidence/neighbourhood_results.json
      supporting_text: '"tat_like_motif": "RRQALK"'
