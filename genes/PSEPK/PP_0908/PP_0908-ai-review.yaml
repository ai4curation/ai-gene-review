taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0908 encodes a 365-residue DUF1513 (PF07433; PIRSF028101/UCP028101; COG3490) protein
  of unknown function. Almost the whole mature chain is one DUF1513 domain, which Gene3D
  and SUPERFAMILY place in the YVTN-repeat / quinoprotein amine dehydrogenase beta-chain
  beta-propeller fold. The N-terminus (MLRRQALKLG...) is a hydrophobic export signal with
  a conserved twin-arginine (Tat-like) RRxxLK motif; DeepTMHMM predicts a cleavable
  signal peptide at residues 1-25 and no transmembrane segment or beta-barrel. There is no
  lipobox. The mature protein is therefore most likely a soluble periplasmic protein,
  although that has not been tested. PP_0908 is the last gene of a tightly packed
  same-strand cluster, PP_0913-PP_0912-PP_0911-PP_0910-PP_0909-PP_0908. That cluster
  encodes two exported imelysin-like proteins (PP_0913 and PP_0909, Peptidase_M75 /
  PF09375) and an exported di-haem oxidoreductase/putative peroxidase (PP_0910, DHOR /
  PF06537). The arrangement is syntenic with the Fur-regulated P. aeruginosa imelysin
  operon PA4370-PA4373, in which PA4373 is the 78%-identical DUF1513 orthologue. The
  cluster has no EfeU/FTR1-family permease. The only FTR1-family protein in KT2440,
  PP_0180, is encoded elsewhere. The cluster therefore resembles the "outer-membrane"
  imelysin clusters that lack EfeU, not a complete EfeUOB system. Fitness Browser curators
  reannotated the P. fluorescens orthologues (81% identity) as the "outer membrane
  component of uptake system, probably for ferrous iron", because they are cofit with
  their efeO-like and DHOR neighbours. This family-level inference is also the source of
  the Pfam DUF1513 description. In KT2440, transposon mutants lose fitness in fusaric acid
  (fitness -2.9 to -2.0 in six experiments). Fusaric acid chelates metals, which fits an
  iron-related role. However, PP_0908 lies 155 bp upstream of the co-directional RND
  efflux genes PP_0907-PP_0906, so a polar effect cannot be excluded. No experiment has been reported on
  PP_0908 or on any DUF1513 protein. Its molecular function, ligand and substrate are
  unknown. Association with an iron-acquisition module is a well-supported hypothesis, not
  an established function.
existing_annotations: []
core_functions:
- description: >-
    Exported (Sec/Tat signal peptide), probably periplasmic, beta-propeller DUF1513 protein
    of unknown molecular function. It is encoded in a conserved, Fur-regulated (in
    P. aeruginosa) gene cluster with two imelysin-like (EfeO/IrpA-type) proteins and a
    di-haem putative peroxidase, a module proposed to act in iron acquisition. No GO
    molecular function, process or location term is assigned, because none is
    established for this protein or family.
  supported_by:
  - reference_id: PMID:21799754
    supporting_text: >-
      The P. aeruginosa Fur-regulated imelysin operon (PA4370–PA4373) consists of two
      imelysin-like proteins (PA4370/ICMP and PA4372), and one EfeB homolog (PA4371).
  - reference_id: PMID:21799754
    supporting_text: >-
      The genomic context of all previously characterized imelysins bears substantial
      similarity to EfeUOB, except that EfeU is absent in the operons that encode putative
      outer-membrane clusters.
  - reference_id: file:PSEPK/PP_0908/PP_0908-bioinformatics/neighbourhood_results.json
    supporting_text: '"tat_like_motif": "RRQALK"'
  - reference_id: file:PSEPK/PP_0908/PP_0908-dashboard-prediction-evidence/dashboard_call.json
    supporting_text: >-
      Curated reannotation of the homolog: outer membrane component of uptake system,
      probably for ferrous iron
knowledge_gaps:
- gap_statement: >-
    The molecular function of DUF1513 is unknown. No member of the family has been
    purified, structurally characterized, or tested for metal, haem or partner-protein
    binding. Whether the beta-propeller binds iron, binds the imelysin-like partners, or
    has an enzymatic activity is unknown.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    Participation in iron uptake is inferred from gene context, Fur regulation of the
    P. aeruginosa orthologous operon, and Fitness Browser cofitness in P. fluorescens. It
    has not been tested in KT2440. The cluster lacks an EfeU/FTR1 permease, so the iron
    species (Fe2+ or Fe3+) and the inner-membrane route, if any, are unknown.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    Localization is predicted only. The Pfam/Fitness Browser "outer membrane component"
    label conflicts with the soluble beta-propeller architecture and the absence of a
    lipobox or beta-barrel prediction. Whether export is Tat-dependent is also untested.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The KT2440 fusaric acid fitness defect could reflect PP_0908 itself or polar effects
    on the downstream co-directional RND efflux genes PP_0907-PP_0906. It has not been
    deconvolved.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Do in-frame PP_0908 deletion mutants (non-polar) have growth defects under iron
    limitation, with Fe2+ as the sole iron source at low pH, or in a pyoverdine-deficient
    background? Do they share these phenotypes with PP_0909/PP_0910 mutants?
- question: >-
    Is the PP_0913-PP_0908 cluster Fur- or PfrI/PvdS-regulated in KT2440, as its
    P. aeruginosa counterpart is?
- question: >-
    Does PP_0908 physically associate with the imelysin-like proteins PP_0909/PP_0913 or
    with the di-haem protein PP_0910 in the periplasm?
suggested_experiments:
- experiment_type: Genetic knockout and phenotyping
  description: >-
    Construct markerless in-frame deletions of PP_0908 and of the whole PP_0913-PP_0908
    cluster in KT2440 and a pvd mutant background. Assay growth under iron limitation
    (2,2'-dipyridyl), with Fe2+-ascorbate at acidic pH, and with fusaric acid, and
    measure 55Fe uptake. Include PP_0907-PP_0906 deletions to separate any polar efflux
    effect.
- experiment_type: Localization
  description: >-
    Fractionate cells expressing epitope-tagged PP_0908 into periplasm, inner membrane and
    outer membrane, and test export in a tatC mutant.
