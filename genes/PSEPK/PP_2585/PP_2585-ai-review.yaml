id: Q88JR4
gene_symbol: PP_2585
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_2585 is a predicted alpha-ketoglutaric-semialdehyde
  dehydrogenase-family enzyme with the catalytic and Rossmann-fold features of
  a 2,5-dioxopentanoate oxidoreductase. Its genomic neighborhood favors an
  amino-acid or polyamine-catabolic context, while its physiological route and
  NAD+ versus NADP+ preference remain unresolved.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_2585 has an aldehyde dehydrogenase fold, so the broad oxidoreductase annotation is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: >-
      Pfam PF00171 and InterPro IPR015590 support aldehyde dehydrogenase
      chemistry, but the substrate-neutral root remains non-core.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term captures the supported cofactor range without identifying aldehyde dehydrogenase chemistry.
    action: KEEP_AS_NON_CORE
    reason: >-
      The aldehyde dehydrogenase and KGSADH-family assignments support
      oxidation of an aldehyde or oxo-group donor with an NAD(P)+ acceptor.
      This term does not overstate the unmeasured cofactor preference.
    supported_by:
    - reference_id: file:PSEPK/PP_2585/PP_2585-uniprot.txt
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts NADP+-coupled oxidation of 2,5-dioxopentanoate.
    action: UNDECIDED
    reason: >-
      InterPro IPR044151 supports KGSADH-family chemistry, but the protein is
      unreviewed and its EC, NAD+-dependent Rhea reaction, and NADP+-dependent
      Rhea reaction are all automated predictions. No PP_2585 assay establishes
      the exact physiological substrate or favors NADP+ over NAD+.
    supported_by:
    - reference_id: file:PSEPK/PP_2585/PP_2585-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: ISS
  original_reference_id: PMID:17202142
  qualifier: enables
  review:
    summary: PP_2585 has KGSADH-family aldehyde dehydrogenase chemistry with unresolved NAD+ versus NADP+ usage.
    action: NEW
    reason: >-
      GO:0004030 is the most specific current cofactor-neutral MF. IPR044151,
      conserved ALDH catalytic features, and characterized KGSADH isozymes
      support alphaKGSA oxidation without assigning PP_2585 to a pathway.
    supported_by:
    - reference_id: PMID:17202142
      supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
    - reference_id: file:PSEPK/PP_2585/PP_2585-deep-research-openscientist.md
      supporting_text: "conserved sequence hallmarks of the ALDH mechanism"
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/PP_2585/PP_2585-uniprot.txt
  title: UniProtKB entry for PP_2585 (Q88JR4)
  findings:
  - statement: >-
      The unreviewed record assigns the KGSADH-family signature and predicts
      both NAD+- and NADP+-coupled oxidation of 2,5-dioxopentanoate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Family and reaction predictions are internally concordant, but no direct
      PP_2585 biochemical or physiological study is attached to the record.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
  title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
  findings:
  - statement: >-
      The species-aware report places PP_2585 outside the local aldarate locus
      and notes nearby amino-acid/polyamine-catabolism candidates; this is
      useful pathway context but does not establish PP_2585's route.
- id: file:PSEPK/PP_2585/PP_2585-deep-research-openscientist.md
  title: OpenScientist review of PSEPK PP_2585
  findings:
  - statement: The report identifies conserved ALDH catalytic and Rossmann-fold features while treating pathway assignment as unresolved.
- id: PMID:17202142
  title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic convergent evolution.
  full_text_unavailable: true
  findings:
  - statement: A. brasilense KGSADH isozymes share alphaKGSA specificity but differ in cofactor preference.
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract explicitly identifies A. brasilense; it supplies family-level enzymology, not PP_2585 evidence.
- id: PMID:16835232
  title: 'A novel alpha-ketoglutaric semialdehyde dehydrogenase: evolutionary insight into an alternative pathway of bacterial L-arabinose metabolism.'
  full_text_unavailable: true
  findings:
  - statement: A. brasilense ALDH shows high catalytic efficiency with alphaKGSA.
    supporting_text: "Higher catalytic efficiency of ALDH was found with alphaKGSA and succinic semialdehyde among the tested aldehyde substrates."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Orthologous biochemical evidence supports the substrate class, not PP_2585 pathway assignment.
- id: file:modules/glucarate_galactarate_catabolism.yaml
  title: Glucarate and galactarate catabolism module
  findings:
  - statement: >-
      PP_2585 is one of three exact KT2440 KGSADH-family exemplars whose
      contributions to the terminal reaction remain unresolved.
core_functions:
- description: >-
    Predicted alpha-ketoglutaric-semialdehyde oxidation with NAD+ or NADP+;
    the physiological pathway remains unresolved.
  molecular_function:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: PMID:17202142
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
proposed_new_terms:
- proposed_name: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
  proposed_definition: Catalysis of 2,5-dioxopentanoate oxidation to 2-oxoglutarate using either NAD+ or NADP+ as electron acceptor.
  justification: >-
    GO:0047533 specifies NADP+, while bacterial KGSADH orthologs and the KT2440
    records support the same substrate-specific reaction with either cofactor.
  proposed_parent:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: PMID:17202142
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
suggested_questions:
- question: >-
    Which physiological pathway supplies the PP_2585 substrate, and does the
    enzyme prefer NAD+ or NADP+?
- question: >-
    Does PP_2585 contribute measurably to aldarate catabolism when PP_3602 is
    absent, or is its function restricted to a separate amino-acid/polyamine
    route?
suggested_experiments:
- description: >-
    Compare aldarate, hydroxyproline, putrescine, and related amino-acid growth
    phenotypes in PP_2585, PP_3602, and PP_1256 single and combinatorial
    deletion strains, with targeted 2,5-dioxopentanoate measurements.
  experiment_type: paralog-resolved pathway genetics and metabolomics
- description: >-
    Purify PP_2585 and measure substrate specificity and steady-state kinetics
    with both NAD+ and NADP+.
  experiment_type: cofactor-specific enzyme assay
