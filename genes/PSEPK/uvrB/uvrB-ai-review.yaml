suggested_questions:
- question: Is uvrB (PP_1974) DNA-damage inducible or LexA1-regulated in P. putida KT2440, as in E. coli, or constitutive
    as in P. aeruginosa?
suggested_experiments:
- description: Measure PP_1974 transcript levels after UV or mitomycin C in wild-type and lexA1 mutant KT2440, and test UV
    sensitivity of a uvrB deletion, to settle SOS regulation and confirm the NER role in this strain.
