- term:
    id: GO:0009432
    label: SOS response
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: UniRule-propagated SOS response, transferred from E. coli where uvrB is a LexA-repressed SOS gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'UvrB''s repair function is SOS-independent, so this term rests on regulatory membership of the LexA regulon.
      That membership is not conserved in Pseudomonas: the P. aeruginosa uvrB lacks a LexA box and is not DNA-damage inducible,
      and no KT2440 study shows uvrB under LexA control. The E. coli review keeps this term as non-core because E. coli uvrB
      is LexA-regulated; that regulatory fact does not transfer here.'
    supported_by:
    - reference_id: PMID:8808952
      supporting_text: contrary to what happens with the homologous gene of E. coli, the P. aeruginosa uvrB gene is not DNA
        damage inducible
    - reference_id: PMID:8808952
      supporting_text: A P. aeruginosa SOS consensus region, which functions as a binding site for the LexA repressor molecule,
        is not present in the upstream region of the uvrB gene isolated.
