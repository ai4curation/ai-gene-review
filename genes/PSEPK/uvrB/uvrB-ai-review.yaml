id: Q88LF9
gene_symbol: uvrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: UvrB (UvrABC system protein B, PP_1974) is the DNA damage-verification subunit of the nucleotide excision repair
  system of Pseudomonas putida KT2440, which removes bulky, helix-distorting DNA lesions such as UV photoproducts. It is a
  superfamily 2 helicase-like ATPase with two RecA-like domains, a P-loop ATP-binding site, a damage-sensing beta-hairpin
  and a C-terminal UVR domain that contacts UvrC. By analogy with the closely related and well-studied E. coli protein, two
  UvrB subunits join a UvrA dimer to scan DNA; at a putative lesion the DNA wraps around one UvrB, the beta-hairpin inserts
  between the strands, and ATP hydrolysis by UvrB drives formation of a stable UvrB-DNA preincision complex. UvrA then leaves
  and UvrB recruits the UvrC endonuclease, which incises the damaged strand on both sides of the lesion. UvrB acts on the
  chromosome in the cytoplasm.
