- id: file:PSEPK/PP_1703/PP_1703-uniprot.txt
  title: UniProtKB entry for PP_1703 (Q88M71)
  findings:
  - statement: Q88M71 is a 1,341-residue fusion of a Mo-bisMGD/4Fe-4S nitrate-reductase region and
      a flavodoxin/FAD/NAD(P)-binding reductase region; imported electronic annotations conflict
      over its reaction and localization.
- id: file:PSEPK/PP_1703/PP_1703-deep-research-openscientist.md
  title: OpenScientist functional annotation report for PSEPK PP_1703 (Q88M71)
  findings:
  - statement: The completed report identifies a fused diflavin assimilatory nitrate reductase architecture,
      distinguishes it from NapA and CysJ, and records the absence of direct Q88M71 enzymology as
      a limitation.
    supporting_text: The correct primary function is **cytoplasmic assimilatory nitrate reduction**.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Preserved genuine generated discovery report. Primary sources and domain records
      are evaluated independently here; fusion alone does not prove a monomer, and the Acinetobacter
      viologen/diaphorase experiment does not establish direct NAD(P)H donation. Not used as decisive
      annotation support.
- id: PMID:10852866
  title: Inactivation of gltB abolishes expression of the assimilatory nitrate reductase gene (nasB)
    in Pseudomonas putida KT2442.
  findings:
  - statement: Closely related KT2442 genetics directly identifies nasB as an assimilatory nitrate
      reductase gene induced during ammonium deficiency.
    supporting_text: is demonstrated to bear the transposon within the assimilatory nitrate reductase
      gene (nasB) of P. putida KT2442
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract was followed by full-text recovery under the PMC101894 URL reference.
      ENA AF203789 maps exactly to residues 1–724 of Q88M71; this is a catalytic-fragment identity
      bridge, not a full-length KT2440 biochemical assay.
- id: PMID:32111737
  title: A recently evolved diflavin-containing monomeric nitrate reductase is responsible for highly
    efficient bacterial nitrate assimilation.
  findings:
  - statement: Biochemical work on NasN establishes that a molybdopterin catalytic domain fused to
      an FMN-FAD/NAD-binding module can form a monomeric NADPH-dependent assimilatory nitrate reductase.
    supporting_text: NasN is an NADPH-dependent, diflavin-containing monomeric enzyme composed of
      a canonical molybdopterin cofactor-binding catalytic domain and an FMN-FAD/NAD-binding, electron-receiving/transferring
      domain
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and the cached abstract were checked; this is comparative architecture
      evidence, not a direct Q88M71 assay.
- id: PMID:849099
  title: Assimilatory nitrate reductase from Acinetobacter calcoaceticus.
  findings:
  - statement: Comparative bacterial biochemistry establishes a soluble assimilatory nitrate reductase
      that reduces nitrate to nitrite with NAD(P)H supplied through diaphorases.
    supporting_text: A soluble nitrate reductase from the bacterium Acinetobacter calcoaceticus grown
      on nitrate has been characterized.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only Acinetobacter evidence. NAD(P)H supplied via separate diaphorases
      and viologen does not demonstrate direct pyridine-nucleotide use by the nitrate reductase or
      establish Q88M71 donor preference.
- id: PMID:32523942
  title: A Nitrate-Blind P. putida Strain Boosts PHA Production in a Synthetic Mixed Culture.
  findings:
  - statement: The introduction cites PP_1703 and nirBD as the assigned nitrate- and nitrite-reductase
      genes in KT2440 nitrate assimilation.
    supporting_text: the assimilating nitrate and nitrite reductases encoded by PP_1703 and nirBD
      (PP_1705, PP_1706)
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and the cached full text were checked. The quoted sentence is introduction/background
      that cites earlier work; this paper's own perturbation is nasT deletion, not direct PP_1703
      or NirBD biochemistry.
- id: PMID:35285712
  title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon
    Sequencing.'
  findings:
  - statement: Native KT2440 pooled-mutant fitness supports nitrate uptake by PP_2092; the nitrate-condition
      fitness score is −2.6.
    supporting_text: We were also able to identify a distinct nitrate transporter PP_2092 (−2.6).
  - statement: Absence of a significant nitrite-condition phenotype does not exclude redundant or
      conditional nitrite transport.
    supporting_text: However, no significant phenotype could be detected for this gene in the nitrite
      condition, suggesting that it may be specific to nitrate.
  - statement: The paper reports NarB and combined NirDB pathway phenotypes, without assigning the
      displayed combined NirDB score to each individual subunit.
    supporting_text: The enzymes associated with the initial steps of the assimilatory nitrogen system
      in P. putida are the reductases NarB and NirDB, for which we see significant growth phenotypes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text and Figure 3 inspected. PP_2092 is explicitly identified.
      NarB and combined NirDB figure labels are not treated as locus-specific quantitative measurements
      for PP_1703, NirB, or NirD.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC101894/?report=xml
  title: Inactivation of gltB Abolishes Expression of the Assimilatory Nitrate Reductase Gene (nasB)
    in Pseudomonas putida KT2442
  findings:
  - statement: KT2442 native gene disruption and complementation identify an assimilatory nitrate-reductase
      catalytic gene.
    supporting_text: In conclusion, these results clearly demonstrate that P. putida N25 bears the
      mini-Tn5 luxAB transposon within the assimilatory nitrate reductase.
  - statement: The cloned 2175-bp gene restores nitrate-supported growth; it corresponds to a catalytic
      fragment of the modern fused annotation.
    supporting_text: while cells of both strains harboring pAA2 were able to grow
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. KT2442 is a derivative of KT2440, but the historical tested
      clone encodes only 724 residues; see the explicit ENA-to-Q88M71 identity analysis. No full-fusion
      donor preference or oligomer state follows from these genetic experiments.
