  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_1703 is a candidate assimilatory nitrate reductase of Pseudomonas putida
  KT2440. Its N-terminal Mo-bis(molybdopterin guanine dinucleotide) and 4Fe-4S
  nitrate-reductase regions are fused to flavodoxin, FAD-binding, and
  NAD(P)-binding reductase domains, providing a plausible route for direct
  pyridine-nucleotide-dependent reduction of nitrate to nitrite. The protein is
  encoded beside nirB and nirD in the assimilatory nitrite-reduction locus, but
  Q88M71 itself has not been biochemically characterized.
