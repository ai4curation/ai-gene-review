  label: Pseudomonas putida KT2440
description: PP_1703 encodes a fused assimilatory nitrate reductase in Pseudomonas putida KT2440.
  Its molybdenum-bis(molybdopterin guanine dinucleotide) catalytic region and associated iron-sulfur
  domain are joined to flavodoxin, FAD-binding, and NAD(P)-binding domains. This architecture supports
  pyridine-nucleotide-linked nitrate reduction to nitrite, upstream of NirBD-mediated ammonium production.
  The preferred physiological electron donor and oligomeric state of the full-length KT2440 protein
  remain unresolved.
