      label: sulfite reductase (NADPH) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The sulfite-reductase transfer is incompatible with the protein architecture and locus context.
      action: REMOVE
      reason: >-
        Q88M71 lacks the siroheme nitrite/sulfite-reductase catalytic region and
        instead contains a Mo-bisMGD nitrate-reductase core fused to a
        flavin/NAD(P) reductase module. KT2440 physiological evidence instead
        places PP_1703 in nitrate assimilation.
      supported_by:
