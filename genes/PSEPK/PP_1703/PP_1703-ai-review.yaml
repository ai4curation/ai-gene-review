    findings:
      - statement: >-
          Closely related KT2442 genetics directly identifies nasB as an
          assimilatory nitrate reductase gene induced during ammonium deficiency.
        supporting_text: >-
          is demonstrated to bear the transposon within the assimilatory nitrate
          reductase gene (nasB) of P. putida KT2442
        reference_section_type: ABSTRACT
