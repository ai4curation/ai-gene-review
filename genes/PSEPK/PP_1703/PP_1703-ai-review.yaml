  review:
    summary: The sulfite-reductase call misassigns the fused nitrate-reductase protein.
    action: REMOVE
    reason: The full architecture contains a molybdenum nitrate-reductase catalytic region linked
      to a diflavin reductase module. Native KT2442 disruption/complementation identifies the historical
      nitrate-reductase gene, whose encoded 724-residue segment is exactly the Q88M71 N-terminal
      region. The reductase module alone resembles electron-input modules of sulfite reductases,
      but does not establish sulfite reduction by this fusion. This conclusion does not rely merely
      on absence of a siroheme domain.
