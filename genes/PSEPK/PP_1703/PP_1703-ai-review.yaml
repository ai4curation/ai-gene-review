suggested_questions:
- question: Does purified Q88M71 reduce nitrate with NADH, NADPH, or both, and is nitrite the physiological
    product?
suggested_experiments:
- description: Purify Q88M71 anaerobically with its Mo-bisMGD, flavin, and iron-sulfur cofactors;
    compare nitrate and sulfite substrates with NADH, NADPH, and cytochrome donors, then test PP_1703
    loss during nitrate-supported growth.
