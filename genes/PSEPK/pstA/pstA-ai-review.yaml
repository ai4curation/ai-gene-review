taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PstA membrane permease subunit of a bacterial phosphate ABC transporter.
  Together with PstC it forms the membrane translocation pathway that receives
  phosphate from PstS and is energized by PstB. In KT2440, this protein is
  encoded in the PP_2656-PP_2659 Pst-like operon.
