  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The function is correct at the assembled-permease level, but PstA is one
      subunit of the PstA/PstC membrane pair and does not independently enable it.
    action: MODIFY
    reason: Retain GO:0005315 with contributes_to rather than enables.
    proposed_replacement_terms:
    - id: GO:0005315
      label: phosphate transmembrane transporter activity
