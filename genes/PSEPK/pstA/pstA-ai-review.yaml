  - statement: >-
      A same-species PRS2000 study established PstSCAB-dependent phosphate
      uptake, but it does not identify Q88JJ1 or the KT2440 PP_2656 operon.
    supporting_text: >-
      The pstSCAB genes of Pseudomonas putida PRS2000, encoding the phosphate
      (Pi)-specific transport (Pst) system, were cloned.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Primary same-species background for Pst transport; not direct evidence
      for the KT2440 PP_2656-PP_2659 paralogous operon.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_pst_phosphate_uptake__ppu02010-deep-research-openscientist.md
  title: OpenScientist pathway and taxon report for PSEPK Pst phosphate uptake
  findings:
  - statement: >-
      The report distinguishes the PP_2656-PP_2659 Pst-like operon from the
      Pho-linked PP_5326-PP_5329 operon and leaves the former's physiological
      role unresolved.
