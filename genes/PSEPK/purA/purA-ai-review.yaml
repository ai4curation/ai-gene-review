id: Q88DD8
gene_symbol: purA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PurA (PP_4889) is the GTP-dependent adenylosuccinate synthetase that commits
  IMP to AMP biosynthesis by ligating IMP and L-aspartate to form
  adenylosuccinate. PurB subsequently cleaves adenylosuccinate to AMP and
  fumarate.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct broad substrate-binding annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      PurA binds nucleotide substrates, but adenylosuccinate synthase activity
      captures its defining molecular function more informatively.
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Correct cofactor-binding annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The UniProt record specifies one Mg2+ ion per subunit, while the catalytic
      ligase activity remains the core function.
- term:
    id: GO:0004019
    label: adenylosuccinate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific molecular function.
    action: ACCEPT
    reason: >-
      UniProt assigns EC 6.3.4.4 and RHEA:15753 for GTP-dependent ligation of IMP
      and L-aspartate to adenylosuccinate.
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct substrate-binding annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      GTP is a substrate in the adenylosuccinate synthetase reaction, but binding
      alone is less informative than GO:0004019.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for the soluble bacterial enzyme.
    action: ACCEPT
    reason: >-
      UniProt assigns PurA to the cytoplasm and the reaction uses soluble
      nucleotide metabolites.
- term:
    id: GO:0006164
    label: purine nucleotide biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct but broader than the specific AMP branch.
    action: MODIFY
    reason: >-
      PurA catalyzes the first committed reaction from IMP toward AMP, so the
      specific de novo AMP biosynthetic process is preferable.
    proposed_replacement_terms:
      - id: GO:0044208
        label: "'de novo' AMP biosynthetic process"
- term:
    id: GO:0044208
    label: '''de novo'' AMP biosynthetic process'
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct specific biological process.
    action: ACCEPT
    reason: >-
      PurA forms adenylosuccinate in the first of the two reactions converting
      IMP to AMP.
- term:
    id: GO:0046040
    label: IMP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct substrate-centered process context.
    action: KEEP_AS_NON_CORE
    reason: >-
      PurA directly consumes IMP, but its defining pathway role is de novo AMP
      biosynthesis rather than general IMP metabolism.
