  qualifier: enables
  review:
    action: UNDECIDED
    summary: Q88MG5 contains a PHP domain, but a PHP fold does not establish a catalytically competent
      metal-binding site or measurable 3-prime to 5-prime exonuclease.
    reason: Q88MG5 contains a PHP domain, but a PHP fold does not establish a catalytically competent
      metal-binding site or measurable 3-prime to 5-prime exonuclease. DnaE PHP domains vary in activity
      among bacteria; the independent DnaQ subunit neither proves nor excludes intrinsic proofreading.
      No target-specific PHP assay or validated catalytic-residue analysis was obtained, so the claim
      remains unresolved and is not made a core function.
