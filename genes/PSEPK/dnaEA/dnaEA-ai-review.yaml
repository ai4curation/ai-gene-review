description: DnaEA is the alpha catalytic subunit of the replicative DNA polymerase III in Pseudomonas
  putida KT2440. Within the polymerase III core it extends DNA primers by template-directed deoxyribonucleotide
  addition during chromosome replication and contains an N-terminal PHP domain with unresolved proofreading
  activity.
