- term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      InterPro2GO assigns 3'-5' exonuclease activity from the PHP domain of the
      Pol III alpha subunit, but the closest characterized ortholog, E. coli
      DnaE in the same PANTHER subfamily, lacks this activity and proofreading
      in this lineage is supplied by a separate epsilon subunit.
    reason: >-
      A PHP fold does not establish a catalytically competent exonuclease, and
      DnaE PHP-domain activity varies among bacteria. Purified E. coli alpha is
      devoid of 3'-5' exonuclease activity (a NOT annotation accepted in the E.
      coli dnaE review), and Pseudomonas Pol III works as an alpha-epsilon
      core in which epsilon (DnaQ, also encoded in KT2440) is the proofreading
      exonuclease. Intrinsic activity of Q88MG5 has not been tested, so the
      claim is treated as an unsupported domain-level over-annotation rather
      than shown false. It is not a core function.
    supported_by:
    - reference_id: PMID:2997151
      supporting_text: >-
        The alpha subunit lacks the 3'----5' exonuclease (proofreading) activity
        of pol III core
    - reference_id: PMID:15611049
      supporting_text: requires the presence of alphaepsilon, beta, and tau(3)deltadelta'.
    - reference_id: file:PSEPK/dnaEA/dnaEA-uniprot.txt
      supporting_text: DR   InterPro; IPR004013; PHP_dom.
      record_section:
      - DR:InterPro
