id: Q88MG5
gene_symbol: dnaEA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: DnaEA is the alpha catalytic subunit of the replicative DNA polymerase III in Pseudomonas putida KT2440. Within the polymerase III core it extends DNA primers by template-directed deoxyribonucleotide addition during chromosome replication. Proofreading is supplied by the associated DnaQ epsilon subunit rather than by the alpha subunit assignment represented here.
