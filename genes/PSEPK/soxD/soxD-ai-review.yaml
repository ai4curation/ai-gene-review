      supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the
        sarcosine imine is hydrolyzed to glycine and formaldehyde.
    - reference_id: file:PSEPK/soxB/soxB-source-analysis/assembly-evidence.md
      supporting_text: Moreover, no flavin was found to be bound to these protein samples.
