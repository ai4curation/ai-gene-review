proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This is the folate-coupled reaction of heterotetrameric SoxABDG-type sarcosine oxidases (EC
    1.5.3.24, RHEA:70455). GO:0008115 instead specifies formaldehyde production. The proposed activity belongs
    to the assembled enzyme and is retained as an ontology proposal; it is not an independent activity of this
    subunit. Because the current schema has no proposed-contribution slot, core_functions uses
    contributes_to_molecular_function for the supported oxygen-dependent parent, with the exact collective
    reaction in prose. Folate-dependent versus folate-free product partition has not been measured in KT2440.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use
      tetrahydrofolates as substrates
  - reference_id: PMID:16934831
    supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine
      imine is hydrolyzed to glycine and formaldehyde.
suggested_questions:
- question: Is the SoxD zinc site required for assembly or stability of the heterotetramer, or does it
    influence catalysis or folate channelling?
- question: How should contribution to a proposed complex-level molecular function be represented until a
    proposed_contributes_to_molecular_function slot or the specific GO term is available?
suggested_experiments:
- description: Mutate the Cys3His zinc ligands of KT2440 SoxD and compare complex assembly, zinc content and
    folate-coupled sarcosine oxidation.
