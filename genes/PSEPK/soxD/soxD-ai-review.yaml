core_functions:
- description: Zinc-binding structural (delta) subunit of the heterotetrameric sarcosine oxidase SoxABDG, which
    converts sarcosine, tetrahydrofolate and O2 to glycine, 5,10-methylenetetrahydrofolate and H2O2 (EC 1.5.3.24).
    SoxD carries no catalytic cofactor. The folate-free formaldehyde-forming reaction (GO:0008115) is a conditional
    secondary activity of the complex.
  proposed_molecular_function: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
