core_functions:
- description: SoxD supplies the zinc-binding delta structure of the enzyme, not a flavin active site. This
    subunit contributes to the assembled SoxABDG oxidation of sarcosine with oxygen. In characterized
    orthologous complexes, tetrahydrofolate accepts the one-carbon unit to form 5,10-methylenetetrahydrofolate
    and glycine; without folate, imine hydrolysis yields glycine and formaldehyde. KT2440 product partition
    and autonomous subunit catalysis have not been measured. The oxygen-dependent parent expresses complex
    contribution without asserting that this subunit independently performs the full folate-coupled reaction.
