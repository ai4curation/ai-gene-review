proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This is the physiological reaction of heterotetrameric SoxABDG-type sarcosine oxidases (EC 1.5.3.24,
    RHEA:70455). GO:0008115 sarcosine oxidase activity is defined by the formaldehyde-forming reaction (EC 1.5.3.1,
    RHEA:13313), which these enzymes perform only when folate is absent, so no current GO term captures transfer
    of the oxidised methyl group to tetrahydrofolate.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates
      as substrates
  - reference_id: PMID:16934831
    supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine imine
      is hydrolyzed to glycine and formaldehyde.
suggested_questions:
- question: Is the SoxD zinc site required for assembly or stability of the heterotetramer, or does it influence
    catalysis or folate channelling?
suggested_experiments:
- description: Mutate the Cys3His zinc ligands of KT2440 SoxD and compare complex assembly, zinc content and folate-coupled
    sarcosine oxidation.
