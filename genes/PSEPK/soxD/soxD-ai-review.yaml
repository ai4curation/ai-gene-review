product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SoxD (PP_0324) is the small (111-residue) delta subunit of the cytosolic heterotetrameric
  sarcosine oxidase SoxABDG. In the characterised orthologous enzyme the delta subunit carries a single zinc
  ion bound by a Cys3His zinc-finger motif and has no flavin or folate cofactor of its own. It is a component
  of the complex that oxidises sarcosine and transfers its methyl group to tetrahydrofolate, forming glycine,
  5,10-methylenetetrahydrofolate and hydrogen peroxide. In KT2440 this catabolic role is inferred from
  conserved subunit identity and pathway context; the strain-specific creatine study cites SoxBDAG as
  background rather than directly characterizing the purified complex.
existing_annotations:
- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The formaldehyde-forming reaction is a supported secondary activity of heterotetrameric sarcosine
      oxidase, assigned here as a subunit contribution by orthology.
    action: KEEP_AS_NON_CORE
    reason: GO:0008115 names the formaldehyde-forming oxidation, experimentally supported for heterotetrameric
      enzymes without added tetrahydrofolate. Folate suppresses formaldehyde formation and supports
      5,10-methylenetetrahydrofolate production (PMIDs:9185627,16934831); the proportion of the two outputs in
      KT2440 has not been measured. Retain the conditional formaldehyde activity as non-core, without treating
      the generic KT2440 pathway diagram in PMID:35266867 as a product assay. SoxD supplies the zinc-binding
      delta structure of the enzyme, not a flavin active site. The reaction belongs to the assembled enzyme.
      Isolated U-96 beta and beta/delta samples lacked flavin and became insoluble during further purification
      (PMID:15914915); these construct-dependent results do not prove autonomous activity impossible, but they
      do not demonstrate it. The core records contribution to the oxygen-dependent oxidation parent; the
      precise folate-coupled activity remains a complex-level proposed term.
    supported_by:
    - reference_id: PMID:15946648
      supporting_text: The delta subunit contains a single atom of zinc and has a Cys(3)His zinc finger
        structure.
    - reference_id: PMID:16934831
