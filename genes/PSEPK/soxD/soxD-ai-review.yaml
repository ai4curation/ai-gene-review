      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: PROBABLE
      explanation: Sarcosine oxidase activity of the SoxABDG type belongs to the heterotetramer. The delta subunit
        contains a single structural zinc and none of the flavin or folate sites, so the row should use contributes_to.
