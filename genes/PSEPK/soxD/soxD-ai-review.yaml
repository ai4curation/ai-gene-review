id: Q88R10
gene_symbol: soxD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SoxD (PP_0324) is the small delta subunit of the cytosolic SoxABDG sarcosine
  oxidase complex. It is a complex component rather than an independent enzyme
  and contributes to tetrahydrofolate-coupled conversion of sarcosine to
  glycine.
existing_annotations:
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: SoxD contributes to the tetrameric complex activity but cannot catalyze it alone.
      action: REMOVE
      reason: The enables relation is incorrect for the small structural subunit; a separate contributes_to annotation is proposed below.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "Sarcosine oxidase from Corynebacterium sp. U-96 is a heterotetrameric enzyme."
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: ISS
    original_reference_id: PMID:15946648
    qualifier: contributes_to
    review:
      summary: SoxD contributes structurally to activity of the assembled heterotetramer.
      action: NEW
      reason: SoxD is a zinc-binding subunit of the characterized four-subunit enzyme and is not an independent oxidase.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "The delta subunit contains a single atom of zinc and has a Cys(3)His zinc finger structure."
  - term:
      id: GO:0046653
      label: tetrahydrofolate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The physiological SoxABDG reaction produces 5,10-methylenetetrahydrofolate.
      action: ACCEPT
  - term:
      id: GO:0032921
      label: sarcosine oxidase complex
    evidence_type: NAS
    original_reference_id: PMID:35266867
    qualifier: part_of
    review:
      summary: SoxD is the delta subunit of tetrameric SoxBDAG.
      action: NEW
      reason: This is a same-species author background statement, not a direct SoxABDG assay or sequence-similarity experiment.
      supported_by:
        - reference_id: PMID:35266867
          supporting_text: "tetrameric sarcosine oxidase (SoxBDAG)"
  - term:
      id: GO:0008270
      label: zinc ion binding
    evidence_type: ISS
    original_reference_id: PMID:15946648
    qualifier: enables
    review:
      summary: The conserved SoxD Cys3His motif coordinates a structural zinc ion.
      action: NEW
