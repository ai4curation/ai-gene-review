id: Q88HH4
gene_symbol: PP_3384
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Conserved third (gamma) subunit of the periplasmic three-subunit gluconate
  2-dehydrogenase. Its precise mechanism is unknown; the Tat signal and specific
  Gad-subunit-3 family support a role in assembly, export, or stability rather
  than an independent catalytic activity.
existing_annotations:
  - term: {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: contributes_to
    review:
      summary: The specific IPR027056 family and homologous three-subunit architecture support Gad complex membership.
      action: MODIFY
      reason: Replace the GOA enables relation with contributes_to because no autonomous catalytic activity is known for the gamma subunit.
      proposed_replacement_terms:
        - {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
      supported_by:
        - reference_id: PMID:9352901
          supporting_text: complete structural genes for a 68-kDa dehydrogenase subunit, a 47-kDa cytochrome c subunit, and a 24-kDa subunit of unknown function
  - term: {id: "GO:0042597", label: periplasmic space}
    evidence_type: ISS
    qualifier: located_in
    review:
      summary: The Tat signal and homologous exported Gad subunit support periplasmic localization.
      action: NEW
      reason: This localization is part of the conserved membrane-associated Gad architecture.
      supported_by:
        - reference_id: file:PSEPK/PP_3384/PP_3384-uniprot.txt
          supporting_text: "DR   PROSITE; PS51318; TAT; 1."
  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: Complex membership places this subunit in peripheral oxidative glucose catabolism.
      action: NEW
      reason: Adds the pathway process while leaving its unknown mechanism explicit.
      supported_by:
        - reference_id: PMID:9352901
          supporting_text: The positive clone converted D-gluconate to 2-keto-D-gluconate (2KDG) in the culture medium.
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: D-gluconate is the direct substrate oxidized by the Gad complex to which this gamma subunit contributes.
      action: NEW
      reason: This complements the broader non-phosphorylated glucose-catabolism term with the immediate substrate process.
      supported_by:
        - reference_id: PMID:9352901
          supporting_text: The positive clone converted D-gluconate to 2-keto-D-gluconate (2KDG) in the culture medium.
