id: Q88HH4
gene_symbol: PP_3384
product_type: PROTEIN
status: COMPLETE
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain KT2440)}
description: >-
  Conserved third (gamma) subunit of the periplasmic three-subunit gluconate
  2-dehydrogenase. Its precise mechanism is unknown; the Tat signal and specific
  Gad-subunit-3 family support a role in assembly, export, or stability of the
  active complex rather than an independent catalytic activity.
existing_annotations:
  - term: {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
    evidence_type: ISS
    qualifier: contributes_to
    review:
      summary: The specific IPR027056 family and homologous three-subunit architecture support Gad complex membership.
      action: NEW
      reason: Use contributes_to because no autonomous catalytic activity is known for this subunit.
  - term: {id: "GO:0042597", label: periplasmic space}
    evidence_type: ISS
    qualifier: located_in
    review:
      summary: The Tat signal and homologous exported Gad subunit support periplasmic localization.
      action: NEW
      reason: This localization is part of the conserved membrane-associated Gad architecture.
  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: Complex membership places this subunit in peripheral oxidative glucose catabolism.
      action: NEW
      reason: Adds the pathway process while leaving its unknown mechanism explicit.
