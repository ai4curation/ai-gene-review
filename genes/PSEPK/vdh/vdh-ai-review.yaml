taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Vdh is an NAD-dependent vanillin dehydrogenase that oxidizes vanillin to
  vanillate in the hydroxycinnamate catabolic route. It acts after Ech cleavage
  of feruloyl-CoA and supplies vanillate to the two-component VanAB
  O-demethylase. Target-strain disruption and pathway-engineering experiments
  support this assignment.
