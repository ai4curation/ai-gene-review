id: Q88PR1
gene_symbol: nadC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Quinolinate phosphoribosyltransferase of Pseudomonas putida KT2440. NadC uses
  quinolinate and 5-phospho-alpha-D-ribose 1-diphosphate to form nicotinate
  D-ribonucleotide (NaMN), carbon dioxide, and diphosphate. This reaction links
  quinolinate formation to the shared NaMN completion branch of de novo NAD+
  biosynthesis.
existing_annotations:
  - term:
      id: GO:0004514
      label: nicotinate-nucleotide diphosphorylase (carboxylating) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Correct specific molecular function for NadC.
      action: ACCEPT
      reason: >-
        The target matches the NadC-specific NCBIfam TIGR00078 and InterPro
        IPR004393 (NadC) signatures and the PIRSF006250 NadC/ModD family, and
        carries PIRSR-placed substrate-binding residues. Family membership
        supports quinolinate phosphoribosyltransferase chemistry (quinolinate
        plus PRPP to NaMN, CO2 and diphosphate). The EC/Rhea reaction line in
        the record is ARBA-predicted and is not used as support; no direct
        assay of Q88PR1 is available.
      supported_by:
        - reference_id: file:PSEPK/nadC/nadC-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: "DR   NCBIfam; TIGR00078; nadC; 1."
        - reference_id: file:PSEPK/nadC/nadC-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR004393; NadC."
        - reference_id: file:PSEPK/nadC/nadC-uniprot.txt
          record_section: ["DR:PIRSF"]
          supporting_text: "DR   PIRSF; PIRSF006250; NadC_ModD; 1."
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Correct expected location for a soluble bacterial NadC enzyme.
      action: ACCEPT
      reason: >-
        The cytoplasmic assignment rests on absence of export features plus
        family membership: the Q88PR1 record has no FT SIGNAL, FT TRANSMEM or
        CC SUBCELLULAR LOCATION lines (checked), and the protein belongs to the
        soluble NadC quinolinate phosphoribosyltransferase family of the
        cytoplasmic de novo NAD+ pathway.
      supported_by:
        - reference_id: file:PSEPK/nadC/nadC-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR004393; NadC."
  - term:
      id: GO:0009435
      label: NAD+ biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Correct core biological process.
      action: ACCEPT
      reason: >-
        Membership in the NadC family (NCBIfam TIGR00078, InterPro IPR004393)
        places the target at the quinolinate-to-NaMN step of de novo NAD+
        biosynthesis; the record's CC PATHWAY line is ARBA-predicted and is not
        used as support.
      supported_by:
        - reference_id: file:PSEPK/nadC/nadC-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: "DR   NCBIfam; TIGR00078; nadC; 1."
  - term:
      id: GO:0016763
      label: pentosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct parent chemistry but too broad for the known NadC reaction.
      action: MODIFY
      reason: GO:0004514 captures the substrate-specific phosphoribosyltransferase activity.
      proposed_replacement_terms:
        - id: GO:0004514
          label: nicotinate-nucleotide diphosphorylase (carboxylating) activity
  - term:
      id: GO:0034213
      label: quinolinate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Chemically defensible substrate-level process, but not the core pathway framing.
      action: KEEP_AS_NON_CORE
      reason: >-
        NadC consumes quinolinate, so the term is not false. Its physiological
        role here is constructive NAD+ biosynthesis rather than a separate
        quinolinate-degradation pathway, making GO:0009435 the core process.
