id: Q88K35
gene_symbol: rbsR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RbsR is a LacI-family DNA-binding transcriptional repressor encoded within
  the PP_2454-PP_2459 ribose-utilization locus. It is likely to regulate this
  locus, but its KT2440 operator, effector, regulon, and regulatory direction
  have not been established experimentally; the current PANTHER subfamily is
  PurR-related rather than an unambiguous RbsR selector.
