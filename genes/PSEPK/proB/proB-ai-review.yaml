id: Q88Q07
gene_symbol: proB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  proB (PP_0691) encodes the cytoplasmic glutamate 5-kinase of the Pseudomonas putida KT2440 proline-biosynthesis
  pathway. ProB uses ATP to phosphorylate L-glutamate, forming L-glutamyl 5-phosphate, the acyl phosphate
  intermediate subsequently reduced by ProA to L-glutamate 5-semialdehyde, which cyclizes spontaneously
  to P5C. Its core role is therefore the first enzymatic step in the glutamate-to-P5C branch of L-proline
  biosynthesis.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002478
  - InterPro:IPR036974
  review:
    summary: RNA binding by KT2440 Q88Q07 remains unresolved; a negative inference from all
      glutamate kinases is no longer defensible.
    action: UNDECIDED
    reason: The InterPro PUA signatures identify a domain but do not establish RNA binding by KT2440
      Q88Q07. Contrary to the previous rationale, PMID:37511294 demonstrates specific, weak RNA
      binding by purified K-12 E. coli ProB using SELEX and competition EMSA (estimated KD >>10
      micromolar). That experiment does not identify its binding site, demonstrate physiological RNA
      regulation, or establish activity in this target. PMID:16337196 assigns a regulatory
      contribution to the E. coli PUA domain without testing or excluding RNA binding. Preserve
      uncertainty in this target-specific transfer rather than asserting either a family-wide
      absence or a family-wide positive function.
    additional_reference_ids:
    - PMID:37511294
    - PMID:16337196
    supported_by:
    - reference_id: PMID:37511294
      supporting_text: Representative EMSA experiments with one of those sequences confirmed the
        specific binding.
    - reference_id: PMID:16337196
      supporting_text: We propose that the PUA domain modulates the function of the AAK domain
