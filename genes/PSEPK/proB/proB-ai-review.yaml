    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      TreeGrafter assigns cytosol, consistent with a soluble cytoplasmic
      amino-acid-biosynthetic enzyme; the E. coli ortholog is directly
      localized to the cytosol.
    action: ACCEPT
    reason: >-
      Retain cytosol as a conserved-role inference for the soluble glutamate kinase. HAMAP records cytoplasmic
