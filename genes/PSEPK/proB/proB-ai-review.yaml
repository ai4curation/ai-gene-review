- id: file:modules/bacterial_glutamate_to_p5c_biosynthesis-deep-research-openscientist.md
  title: OpenScientist research for the bacterial glutamate-to-P5C module
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Species-neutral module synthesis, not a direct Q88Q07 assay. PUA-domain regulation does not exclude
      RNA binding; PMID:37511294 supplies primary evidence for weak RNA binding by E. coli ProB. No RNA
      absence claim is supported by this provider text.
  findings:
  - supporting_text: The PUA domain and inter-subunit contacts are implicated in
      transmitting/regulating this inhibition.
- id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. ProB is a K-12 ASKA-derived pET21a construct with C-terminal His
      tag, expressed in BL21-Gold(DE3). Its positive evidence is SELEX and competition EMSA, not a
      positive ProB iCLIP assay. Estimated KD >>10 micromolar. Transfer to other species is not
      established. The older ProA-complex statement in the discussion is a hypothesis, challenged by
      PMID:39514317.
  findings:
  - statement: K-12 ProB shows specific but weak RNA binding in purified-protein assays; target-site
      identity and native biological role remain unresolved.
    supporting_text: Representative EMSA experiments with one of those sequences confirmed the
      specific binding.
