      This is the core molecular function of ProB.
    action: ACCEPT
    reason: >-
      UniProt records the EC 2.7.2.11/Rhea reaction converting L-glutamate and
      ATP to L-glutamyl 5-phosphate and ADP.
    supported_by:
    - reference_id: file:PSEPK/proB/proB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-glutamate + ATP = L-glutamyl 5-phosphate + ADP
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      ATP binding is correct for the kinase reaction but less informative than
      the catalytic activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP is the phosphoryl donor of the ProB reaction, so ATP binding is
      true; it is a cofactor/co-substrate-binding subfunction that is
      peripheral to, rather than a restatement of, the catalytic activity.
    supported_by:
    - reference_id: file:PSEPK/proB/proB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-glutamate + ATP = L-glutamyl 5-phosphate + ADP
