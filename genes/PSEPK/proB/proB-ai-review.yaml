- id: PMID:16337196
  title: 'Dissection of Escherichia coli glutamate 5-kinase: functional impact of the deletion of the
    PUA domain.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract available. PUA deletion does not test or exclude RNA binding;
      PMID:37511294 provides a later positive RNA-binding assay. This is an E. coli comparator, not
      a direct KT2440 experiment.
  findings:
  - statement: The E. coli PUA domain modulates kinase activity, Mg dependence and proline feedback.
    supporting_text: We propose that the PUA domain modulates the function of the AAK domain
- id: PMID:17321544
  title: A novel two-domain architecture within the amino acid kinase enzyme family revealed by the
    crystal structure of Escherichia coli glutamate 5-kinase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract available. The geometry suggested channeling, but this was not a
      demonstrated ProA-ProB complex; newer PMID:39514317 directly challenges that inference. No
      negative RNA-binding assay is reported. This is an E. coli comparator, not a direct KT2440
      experiment.
  findings:
  - statement: E. coli ProB has a tetrameric dimer-of-dimers structure with Mg ions at a domain
      interface.
