- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      ATP binding supplies the phosphoryl-donor substrate for the core glutamate kinase reaction.
    action: ACCEPT
    reason: >-
      ATP is bound and consumed by ProB during phosphorylation of glutamate. This is an integral substrate-recognition
      subfunction, not a peripheral role merely because the catalytic term is more informative. For KT2440,
      the assignment is an inference from the curated HAMAP MF_00456 reaction and ATP-binding features,
      not a target-specific purified assay.
    supported_by:
    - reference_id: file:PSEPK/proB/proB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-glutamate + ATP = L-glutamyl 5-phosphate + ADP
