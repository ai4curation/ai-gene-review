id: Q88Q07
gene_symbol: proB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  proB (PP_0691) encodes the cytoplasmic glutamate 5-kinase of the
  Pseudomonas putida KT2440 proline-biosynthesis pathway. ProB uses ATP to
  phosphorylate L-glutamate, forming L-glutamyl 5-phosphate, the acyl phosphate
  intermediate subsequently reduced by ProA to L-glutamate 5-semialdehyde/P5C.
  Its core role is therefore the first enzymatic step in the
  glutamate-to-P5C branch of L-proline biosynthesis.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002478
  - InterPro:IPR036974
  review:
    summary: >-
      RNA binding is propagated from generic PUA-domain InterPro signatures.
      In glutamate 5-kinases the C-terminal PUA domain is a regulatory
      appendage of the kinase, and no ProB-family protein, including Q88Q07,
      has been shown to bind RNA.
    action: REMOVE
    reason: >-
      This IEA derives solely from the PUA domain (InterPro IPR002478 /
      IPR036974; GO_REF:0000002), a mapping that reflects RNA-modifying PUA
      proteins such as pseudouridine synthases. Dissection and structure of
      the orthologous E. coli ProB (same family, same domain architecture)
      assign the PUA domain to modulation of the amino-acid-kinase domain and
      of proline feedback inhibition, not to RNA binding. Removed as an
      over-propagated domain-to-function mapping, consistent with the E. coli
      proB review of the same row. The family-wide argument is recorded in
      the notes of the PTHR43654 family review.
    additional_reference_ids:
    - PMID:16337196
    - PMID:17321544
    supported_by:
    - reference_id: PMID:16337196
      supporting_text: >-
        We propose that the PUA domain modulates the function of the AAK domain
    - reference_id: PMID:17321544
      supporting_text: >-
        The AAK and PUA domains of one subunit associate non-canonically in the
        dimer with the same domains of the other subunit
    - reference_id: file:modules/bacterial_glutamate_to_p5c_biosynthesis-deep-research-openscientist.md
      supporting_text: The PUA domain and inter-subunit contacts are implicated in transmitting/regulating this inhibition.
