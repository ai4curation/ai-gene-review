  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: file:PSEPK/paaB/paaB-uniprot.txt
  title: UniProtKB entry Q88HS6 for Pseudomonas putida KT2440 paaB
  findings:
  - statement: UniProt identifies Q88HS6 as the epoxidase regulatory subunit.
    record_section: [DE]
    supporting_text: 'SubName: Full=Ring 1,2-phenylacetyl-CoA epoxidase regulatory subunit'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Exact target accession. The submitted-name and EC assignment are
      homology-based, so the complex-level activity is represented with a
      contributes-to relation.
- id: file:PSEPK/paaB/paaB-deep-research-openscientist.md
  title: OpenScientist deep-research report for PSEPK paaB
  findings:
  - statement: The report assigns PaaB an architectural role in the assembled epoxidase complex.
    supporting_text: >-
      the PaaACB complex forms **heterohexamers, with a homodimer of PaaB
      bridging two PaaAC heterodimers**
    reference_section_type: RESULTS
  - statement: Direct structural characterization of the KT2440 target remains unavailable.
    supporting_text: >-
      direct crystallographic work was performed largely on orthologous
      complexes, so the assignment relies on strong sequence/domain
      conservation across the family rather than a *P. putida*-specific
      structure.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Provider-generated gene report. The exact accession, PaaB domain,
      epoxidase-complex role, and paa-locus context agree with local records;
      the detailed oligomeric architecture derives from orthologous complexes.
core_functions:
