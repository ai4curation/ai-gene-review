id: Q88HS6
gene_symbol: paaB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaB is a small essential subunit of the soluble PaaABCE ring
  1,2-phenylacetyl-CoA epoxidase system in Pseudomonas putida KT2440, the
  ring-activating enzyme of aerobic phenylacetate catabolism. It belongs to
  the PaaB family, which has no detectable similarity to subunits of other
  bacterial multicomponent monooxygenases. By orthology to the E. coli
  enzyme, PaaB associates with the PaaAC oxygenase core (via PaaC) and is
  required for catalytic turnover, but its precise role is unresolved: it has
  been proposed to act as a regulatory/effector subunit, as an architectural
  bridge between PaaAC heterodimers, or in electron transfer from PaaE to
  PaaA.
existing_annotations:
- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct activity at complex level, but overstates the isolated non-catalytic subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Q88HS6 is the PaaB ortholog (NCBIfam TIGR02157 PA_CoA_Oxy2; PIRSF
      PaaB). The orthologous PaaB is essential for epoxidase activity in vitro
      but carries no active site; catalysis resides in PaaA. The enables
      qualifier therefore overstates the isolated subunit; the core-function
      model records that PaaB contributes to the complex activity, as in the
      E. coli PaaB review.
    supported_by:
    - reference_id: file:PSEPK/paaB/paaB-uniprot.txt
      supporting_text: 'NCBIfam; TIGR02157; PA_CoA_Oxy2'
    - reference_id: PMID:21247899
