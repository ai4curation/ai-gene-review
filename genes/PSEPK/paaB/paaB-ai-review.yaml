suggested_questions:
- question: Does KT2440 PaaB primarily control complex assembly, substrate gating, or catalysis?
suggested_experiments:
- description: >-
    Reconstitute PaaACE with and without PaaB and quantify complex assembly,
    electron consumption, and epoxide formation.
