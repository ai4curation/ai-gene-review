id: Q88HS6
gene_symbol: paaB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaB is a structural and assembly subunit of the PaaABCE ring
  1,2-phenylacetyl-CoA epoxidase system in Pseudomonas putida KT2440. It
  contributes to oligomerization of the multicomponent oxygenase during
  aerobic phenylacetate catabolism rather than independently catalyzing the
  complete epoxidation reaction.
existing_annotations:
- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct activity at complex level, but overstates the isolated regulatory subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PaaB is explicitly the regulatory subunit of the multicomponent
      PaaABCE epoxidase. The core-function model therefore records that it
      contributes to, rather than independently enables, the reaction.
    supported_by:
    - reference_id: file:PSEPK/paaB/paaB-uniprot.txt
      record_section: [DE]
      supporting_text: 'SubName: Full=Ring 1,2-phenylacetyl-CoA epoxidase regulatory subunit'
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IC
  original_reference_id: file:PSEPK/paaB/paaB-uniprot.txt
  qualifier: involved_in
  review:
    summary: Missing pathway annotation for the epoxidase regulatory subunit.
    action: NEW
    reason: >-
      Q88HS6 matches the PaaB family signatures (InterPro IPR009359, Pfam
      PF06243, PIRSF030200) and NCBIfam TIGR02157 (PA_CoA_Oxy2), the
      phenylacetate-CoA oxygenase subunit family whose members are
      components of the PaaABC(D)E ring 1,2-epoxidase of aerobic
      phenylacetate catabolism, and it is encoded in the contiguous paa
      locus. The pathway assignment is therefore family- and
      context-based; the submitter-supplied subunit name is not used as
      support. As a structural component of the epoxidase complex that
      performs the first committed ring-activation step, the subunit does
      contribute to the work of the process.
    supported_by:
    - reference_id: file:PSEPK/paaB/paaB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02157; PA_CoA_Oxy2; 1.'
    - reference_id: file:PSEPK/paaB/paaB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR009359; PaaB.'
references:
