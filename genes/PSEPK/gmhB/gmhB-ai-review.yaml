id: Q88RS0
gene_symbol: gmhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GmhB is a cytoplasmic, metal-dependent heptose-bisphosphate phosphatase that removes
  the C-7 phosphate from D-glycero-beta-D-manno-heptose 1,7-bisphosphate, yielding heptose 1-phosphate
  for ADP-heptose donor biosynthesis. Pseudomonas putida KT2440 GmhB has been biochemically characterized;
  its physiological role in supplying lipopolysaccharide core precursors is supported by conserved
  pathway function. Additional sugar-phosphate substrates are hydrolyzed in vitro, without established
  corresponding physiological roles.
