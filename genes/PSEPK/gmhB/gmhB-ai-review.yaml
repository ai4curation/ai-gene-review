      statements replace it as catalytic support.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__adp-heptose-biosynthesis__ppu00541-deep-research-openscientist.md
  title: OpenScientist PSEPK ADP-heptose biosynthesis synthesis
  findings:
  - statement: Generated pathway synthesis flags an unresolved KT2440 terminal epimerase assignment;
      its reported failure to find HldD has not been independently reproduced and does not establish
      biological absence.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Useful research lead, not primary evidence or a demonstrated genome-wide absence
      of HldD. No catalytic or stereochemical endpoint claim depends on this generated report.
- id: PMID:25848029
  title: Panoramic view of a superfamily of phosphatases through substrate profiling.
  findings:
  - statement: Purified Q88RS0 hydrolyzes beta-heptose bisphosphate and four other screened sugar
      phosphates in vitro.
    supporting_text: 'Here, we screened GmhB from Pseudomonas putida (UniProt: Q88RS0 ) and found
      the enzyme dephosphorylated five substrates'
  - statement: The reported beta-HBP catalytic efficiency is 1.8 × 10^6 M−1 s−1.
    supporting_text: k cat / K m = 1.8 × 10 6 M −1 ⋅s −1 for Q88RS0
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text refreshed through the supported fetcher and read. It explicitly assays
      P. putida UniProt Q88RS0, reports five in-vitro substrates and beta-HBP catalytic efficiency.
      Supports target enzymology; does not establish all side substrates as physiological, KT2440
      LPS composition or the terminal L,D endpoint.
- id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  findings:
  - statement: GmhB-mediated dephosphorylation precedes nucleotide activation by HldE.
    supporting_text: We concluded from these experiments that the phosphatases from A. thermoaerophilus
      and E. coli K-12 converted the d -β- d -heptose 1,7-bisphosphate intermediate into d -β- d
      -heptose 1-phosphate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: reconstitution and genetics use E. coli K-12 HldE/GmhB, with A. thermoaerophilus
      enzymes in some mixtures. Supports conserved pathway ordering and LPS precursor production,
      not a KT2440 assay.'
