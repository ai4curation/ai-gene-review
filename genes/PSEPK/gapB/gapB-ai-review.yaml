suggested_questions:
- question: What is the cofactor specificity (NAD+ versus NADP+) of purified PP_2149 (gapB), and what role does its N-terminal extension of about 135 residues play?
suggested_experiments:
- description: Express and purify PP_2149, and measure phosphorylating GAPDH kinetics with NAD+ and with NADP+. Separately, measure the GAPDH activity and growth on glucose and on gluconeogenic substrates of gap-1, gap-2 and double deletion mutants.
  experiment_type: enzymology and gene knockout
