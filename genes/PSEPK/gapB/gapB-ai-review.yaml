id: Q88KZ0
gene_symbol: gapB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  gapB (gap-2, PP_2149) of Pseudomonas putida KT2440 encodes a 487-residue
  member of the type I glyceraldehyde-3-phosphate dehydrogenase (GAPDH-I)
  family. It carries the N-terminal NAD(P)-binding (Gp_dh_N) and C-terminal
  catalytic (Gp_dh_C) domains and the GAPDH active-site signature with the
  catalytic cysteine, preceded by an N-terminal extension of about 135 residues
  that the canonical GapA-type enzyme (gapA, PP_1009) lacks. It is predicted to
  catalyze the reversible phosphorylating oxidation of D-glyceraldehyde
  3-phosphate to 3-phospho-D-glyceroyl phosphate, the first step of the lower
  trunk that carries Entner-Doudoroff-derived triose phosphate toward pyruvate
  and, in reverse, gluconeogenic flux. It belongs to a different PANTHER family
  (PTHR43454) from gapA (PTHR43148), its nicotinamide cofactor preference has
  not been determined, and its gene is transcribed constitutively, whereas
  gap-1 encodes the main glycolytic GAPDH. KT2440 encodes two further GAPDH
  isoforms (PP_0665 and PP_3443). The protein is soluble and cytoplasmic.
existing_annotations:
- term:
    id: GO:0004365
    label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      The phosphorylating GAPDH chemistry is well supported for gapB: it has
      the type I GAPDH family signature (NCBIfam TIGR01534), both Gp_dh domains
      and the PROSITE GAPDH active-site motif containing the catalytic
      cysteine. The NAD+ specificity in this term is not supported. UniProt
      gives only EC 1.2.1.- (not 1.2.1.12) and maps no NAD+-binding residues,
      whereas gapA carries PIRSR000149 NAD+-binding sites. gapB also sits in a
      different PANTHER family (PTHR43454, subfamily SF1) from gapA (PTHR43148),
      and KT2440 extracts contain NADP+-dependent GAPDH activity.
    action: MODIFY
    reason: >-
      The essence of the annotation is sound, but the term commits to NAD+ as
      the acceptor when the cofactor of this divergent GAPDH has not been
      determined. GO:0043891 glyceraldehyde-3-phosphate dehydrogenase
      (phosphorylating, [NAD(P)+]) activity is the direct parent of GO:0004365
      (checked in GO) and states only what the family evidence supports. This
      is where gapB differs from gapA, whose NAD+ specificity rests on PIRSR
      NAD+-binding residues and a GapA-type PANTHER family. The Swiss-Prot
      entry for the P. aeruginosa PA14 ortholog in PTHR43454 (Q02PG5) is also
      named only as a GAPDH-like protein with EC 1.2.1.-. Total GAPDH activity
      in KT2440 extracts was assayed with both NAD+ and NADP+, but it cannot be
      assigned to individual isoforms; the NADP+-dependent activity was
      attributed to PP_3443, not to gapB.
    proposed_replacement_terms:
    - id: GO:0043891
      label: glyceraldehyde-3-phosphate dehydrogenase (phosphorylating, [NAD(P)+] ) activity
    supported_by:
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01534; GAPDH-I; 1.'
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'DR   PROSITE; PS00071; GAPDH; 1.'
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'DR   PANTHER; PTHR43454; GLYCERALDEHYDE-3-PHOSPHATE DEHYDROGENASE; 1.'
    - reference_id: PMID:27933319
      supporting_text: indicated that this enzyme seems to be NADP+ dependent
- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      In KT2440, glucose is catabolized through the Entner-Doudoroff pathway,
      and the glyceraldehyde 3-phosphate it produces passes through the lower
      trunk, starting with GAPDH. Chavarria et al. place Gap-1 and Gap-2 among
      the four GAPDH isoforms at the glyceraldehyde-3-P node, and name them as
      the two that are apparently active in glucose- and fructose-grown cells.
      gap-2 (gapB) is transcribed constitutively, whereas gap-1 (gapA) is the
      main glycolytic GAPDH.
    action: ACCEPT
    reason: >-
      This takes the same action as the gapA row on this term. Because gapB is
      a complete GAPDH-I-family enzyme that is expressed under glucose growth,
      it contributes to the glucose-derived triose-phosphate flux that defines
      this process in KT2440. The evidence on gapB is weaker than on gapA:
      gap-1 is the main glycolytic, HexR-regulated GAPDH, and the share of flux
      carried by gapB has not been measured. That difference does not change
      the claim the row makes. The papers name the gene gap-2. It is identified
      here as PP_2149 because the other three KT2440 GAPDH loci are gap-1
      (PP_1009), PP_0665 and PP_3443.
    supported_by:
    - reference_id: PMID:27933319
      supporting_text: the first biochemical step is catalyzed by the glyceraldehyde-3-P dehydrogenases (Gap-1 and Gap-2) and the two other isoforms of these enzymes, encoded by PP_0665 and PP_3443
    - reference_id: PMID:27933319
      supporting_text: at least Gap-1 and Gap-2, since these are the two variants apparently active as indicated by the transcriptomic data presented above
    - reference_id: PMID:27933319
      supporting_text: gap-2 was highly transcribed across the culture conditions and strains tested, and therefore, its expression seems to be constitutive
    - reference_id: PMID:26350459
      supporting_text: glycolysis is known to proceed almost exclusively through the Entner-Doudoroff (ED) route
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      This term is a correct but generic ancestor of the GAPDH activity. In
      this review the NAD+-specific GO:0004365 row is modified rather than
      accepted, so no accepted MF term entails this one.
    action: MODIFY
    reason: >-
      The term is true but too general. It is refined to GO:0043891, the
      cofactor-neutral phosphorylating GAPDH activity. GO:0043891 is_a
      GO:0016620 (checked in GO), and it is the replacement proposed on the
      GO:0004365 row. It is used rather than GO:0004365 because the cofactor
      of gapB is not established (see the GO:0004365 row).
    proposed_replacement_terms:
    - id: GO:0043891
      label: glyceraldehyde-3-phosphate dehydrogenase (phosphorylating, [NAD(P)+] ) activity
    supported_by:
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01534; GAPDH-I; 1.'
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR020830; GlycerAld_3-P_DH_AS.'
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      This row comes from the generic NAD(P)-binding Rossmann-fold domain
      signature. UniProt records no cofactor and no ligand-binding residues for
      gapB, and the GAPDH-I family includes both NAD+- and NADP+-using enzymes.
      KT2440 extracts contain NADP+-dependent GAPDH activity, but it was
      attributed to the PP_3443 isoform, not to gapB.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Marked over-annotated rather than removed: the Rossmann-fold domain makes binding of NAD+ or NADP+ certain, but this row commits to NADP+, which no gapB-specific evidence establishes; the cofactor-neutral GO:0043891 states what is supported. This differs from gapA, where the same InterPro-derived term is removed
      because PIRSR maps NAD+-only binding residues. gapB has no such residue
      evidence and belongs to a separate PANTHER family, so neither NADP nor
      NAD binding can be confirmed or excluded without an enzyme assay of
      purified PP_2149.
    supported_by:
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR020828; GlycerAld_3-P_DH_NAD(P)-bd.'
    - reference_id: PMID:27933319
      supporting_text: indicated that this enzyme seems to be NADP+ dependent
- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      NAD binding is the family default for bacterial GAPDH-I enzymes, but for
      gapB it rests only on the generic NAD(P)-binding domain signature. UniProt
      records no NAD+-binding residues and no cofactor for this entry.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Marked over-annotated rather than removed: NAD+ is the likely cofactor for a GAPDH-I family member, but no gapB-specific evidence establishes it, and the cofactor-neutral GO:0043891 states what is supported. This differs from gapA, where NAD binding is supported by PIRSR000149
      NAD+-binding residues. gapB is a divergent GAPDH (PANTHER PTHR43454, with
      an N-terminal extension) whose cofactor has not been determined. The
      NADP binding row is treated the same way; the two rows should be
      resolved together by a cofactor-specificity assay.
    supported_by:
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR020828; GlycerAld_3-P_DH_NAD(P)-bd.'
    - reference_id: file:PSEPK/gapB/gapB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'DR   PANTHER; PTHR43454; GLYCERALDEHYDE-3-PHOSPHATE DEHYDROGENASE; 1.'
