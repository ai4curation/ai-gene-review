  label: Pseudomonas putida KT2440
description: SsuC (PP_0239) is the predicted multipass inner-membrane permease of the SsuABC alkanesulfonate
  importer in Pseudomonas putida KT2440. It provides the membrane pathway for substrates captured by SsuA,
  with ATP-dependent transport driven by SsuB. Native combined ssuBC deletion phenotypes support a role
  in uptake of selected sulfonates; exact substrate specificity and transporter stoichiometry are inferred
  from homologous systems.
