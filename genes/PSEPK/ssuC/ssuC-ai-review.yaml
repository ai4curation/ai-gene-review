suggested_questions:
- question: What alkanesulfonate range is translocated by the KT2440 SsuABC assembly, and does Q88R94
    function with any non-cognate binding proteins or ATPases?
suggested_experiments:
- description: Reconstitute SsuABC transport with radiolabeled or mass-spectrometry-detectable sulfonates
    and compare wild type with a clean ssuC deletion and complementation strain.
