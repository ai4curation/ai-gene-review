  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SsuC is the multi-pass inner-membrane permease subunit of the SsuABC
  alkanesulfonate importer. Two SsuC subunits form the translocation pathway for
  aliphatic sulfonates captured by periplasmic SsuA, while cytoplasmic SsuB
  subunits supply ATP hydrolysis.
