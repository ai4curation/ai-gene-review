    summary: ssuC contributes its specialized subunit function to the SsuABC transport activity.
    action: NEW
    reason: The specific ssuC family assignment and the E. coli donor identified in supporting_entities
      support this existing ISS proposal. The weaker contributes_to relation represents a functional subunit
      of the ATP-driven importer, not autonomous transport by an isolated chain. The E. coli deletion/complementation
      study distinguishes the coherent SsuABC complex from interchangeable generic ABC components. KT2440
      substrate ranges and stoichiometry are not claimed as directly measured.
