taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SucA (PP_4189) is the thiamine diphosphate-dependent E1 component of
  the cytosolic 2-oxoglutarate dehydrogenase complex in Pseudomonas putida KT2440.
  It decarboxylates 2-oxoglutarate and transfers the resulting succinyl group to
  the lipoyl arm of SucB, initiating the TCA-cycle conversion of 2-oxoglutarate to
  succinyl-CoA by the SucA/SucB/LpdG multienzyme complex.
existing_annotations:
- term:
    id: GO:0004591
    label: oxoglutarate dehydrogenase (succinyl-transferring) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct E1 activity for the 2-oxoglutarate dehydrogenase complex.
    action: ACCEPT
    reason: No direct purified-enzyme assay exists for PP_4189 itself; the support is family membership.
      Q88FA9 matches the TIGR00239 2-oxoglutarate dehydrogenase E1 family model, the PIRSF000157
      Oxoglu_dh_E1 family and InterPro IPR011603, whose characterized members (e.g. E. coli SucA) are
      the thiamine diphosphate-dependent OGDH E1 enzymes; this family membership is the argument for
      EC 1.2.4.2 activity. (PANTHER places it in subfamily PTHR23152:SF4, named for the 2-oxoadipate
      dehydrogenase E1, a closely related activity; the OGDH-specific TIGR00239/PIRSF models favour
      2-oxoglutarate.) The UniProt function text (ARBA) and the EC line are predictions, and the
      sucA-sucB-lpdG neighborhood reported by the OpenScientist report is a lead, not cited as support.
    supported_by:
