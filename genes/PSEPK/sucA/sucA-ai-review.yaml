  label: Pseudomonas putida KT2440
description: SucA (PP_4189) is the thiamine diphosphate-dependent E1 component of
  the cytosolic 2-oxoglutarate dehydrogenase complex in Pseudomonas putida KT2440.
  It decarboxylates 2-oxoglutarate and transfers the resulting succinyl group to
  the lipoyl arm of SucB, initiating the TCA-cycle conversion of 2-oxoglutarate to
  succinyl-CoA by the SucA/SucB/LpdG multienzyme complex.
