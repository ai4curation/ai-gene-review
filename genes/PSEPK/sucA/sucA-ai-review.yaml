suggested_questions:
- question: Has the KT2440 SucA/SucB/LpdG complex been reconstituted directly, and does LpdG outcompete the other Lpd-family paralogs as the OGDH E3 subunit under TCA-cycle growth conditions?
suggested_experiments:
- description: Purify PP_4189 with SucB and each Lpd-family paralog, then measure 2-oxoglutarate-dependent succinyl-CoA and NADH production to confirm the KT2440 complex composition and SucA substrate specificity.
  experiment_type: enzyme-complex reconstitution
