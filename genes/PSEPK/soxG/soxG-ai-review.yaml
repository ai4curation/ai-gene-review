- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISS
  original_reference_id: PMID:15914915
  qualifier: located_in
  review:
    summary: SoxG is a subunit of the soluble cytosolic SoxABDG sarcosine oxidase.
    action: NEW
    reason: No location annotation exists for this subunit. The protein has no predicted transmembrane segment or
      signal peptide, the orthologous heterotetramer is functionally expressed as a soluble enzyme, and GO:0032921
      sarcosine oxidase complex is part_of cytoplasm; SoxB of the same complex carries the cytoplasm annotation.
    supported_by:
