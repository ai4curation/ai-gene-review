core_functions:
- description: Gamma subunit of the heterotetrameric sarcosine oxidase SoxABDG, in contact with the folate-binding
    alpha subunit; the complex converts sarcosine, tetrahydrofolate and O2 to glycine, 5,10-methylenetetrahydrofolate
    and H2O2 (EC 1.5.3.24). The folate-free formaldehyde-forming reaction (GO:0008115) is a conditional secondary
    activity of the complex.
  proposed_molecular_function: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15946648
    supporting_text: The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding
      structure.
  - reference_id: PMID:35266867
    supporting_text: sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase
      (SoxBDAG)
  - reference_id: PMID:9185627
    supporting_text: the heterotetrameric enzymes catalyzed the formation of 5,10-methylenetetrahydropteroyltriglutamate
proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This is the physiological reaction of heterotetrameric SoxABDG-type sarcosine oxidases (EC 1.5.3.24,
    RHEA:70455). GO:0008115 sarcosine oxidase activity is defined by the formaldehyde-forming reaction (EC 1.5.3.1,
    RHEA:13313), which these enzymes perform only when folate is absent, so no current GO term captures transfer
    of the oxidised methyl group to tetrahydrofolate.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates
      as substrates
  - reference_id: PMID:16934831
    supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine imine
      is hydrolyzed to glycine and formaldehyde.
suggested_questions:
- question: Does SoxG bind folate or participate in channelling the iminium intermediate to the alpha-subunit folate
    site, as its folate-binding-like fold suggests?
suggested_experiments:
- description: Reconstitute KT2440 SoxABD with and without SoxG and compare complex assembly, folate binding and
    the ratio of 5,10-methylenetetrahydrofolate to formaldehyde produced.
