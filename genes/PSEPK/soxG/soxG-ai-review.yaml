id: Q88R08
gene_symbol: soxG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SoxG (PP_0326) is the gamma subunit of the cytosolic SoxABDG sarcosine
  oxidase complex. It contributes to the assembled tetrahydrofolate-coupled
  enzyme that converts sarcosine to glycine and is not an independent
  sarcosine oxidase.
existing_annotations:
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: SoxG contributes to the tetrameric complex activity but cannot catalyze it alone.
      action: REMOVE
      reason: The enables relation is incorrect for the gamma subunit; a separate contributes_to annotation is proposed below.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "Sarcosine oxidase from Corynebacterium sp. U-96 is a heterotetrameric enzyme."
  - term:
      id: GO:0008115
      label: sarcosine oxidase activity
    evidence_type: ISS
    original_reference_id: PMID:15946648
    qualifier: contributes_to
    review:
      summary: SoxG contributes to sarcosine oxidase activity as a subunit of the heterotetramer.
      action: NEW
      reason: The characterized orthologous enzyme is heterotetrameric, and SoxG is not an independent oxidase.
      supported_by:
        - reference_id: PMID:15946648
          supporting_text: "The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding structure."
  - term:
      id: GO:0032921
      label: sarcosine oxidase complex
    evidence_type: NAS
    original_reference_id: PMID:35266867
    qualifier: part_of
    review:
      summary: SoxG is the gamma subunit of tetrameric SoxBDAG.
      action: NEW
      reason: This is a same-species author background statement, not a direct SoxABDG assay or sequence-similarity experiment.
      supported_by:
        - reference_id: PMID:35266867
          supporting_text: "sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase (SoxBDAG)"
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/soxG/soxG-uniprot.txt
    title: UniProtKB entry for soxG (Q88R08)
    findings:
      - statement: Q88R08 is a 210-residue SoxG-family gamma subunit.
  - id: PMID:15946648
    title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
    findings:
      - statement: The characterized gamma subunit contacts the alpha subunit and may contribute to folate binding.
        supporting_text: "The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding structure."
  - id: PMID:35266867
    title: Creatine utilization as a sole nitrogen source in Pseudomonas putida KT2440 is transcriptionally regulated by CahR.
    findings:
      - statement: KT2440 uses tetrameric SoxBDAG to convert sarcosine to glycine.
        supporting_text: "sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase (SoxBDAG)"
  - id: PMID:9185627
    title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
    findings:
      - statement: Heterotetrameric sarcosine oxidases directly use tetrahydrofolate as substrate.
        supporting_text: "only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates"
core_functions:
  - description: Gamma subunit contributing to sarcosine oxidation by the assembled SoxABDG complex.
    contributes_to_molecular_function:
      id: GO:0008115
      label: sarcosine oxidase activity
    in_complex:
      id: GO:0032921
      label: sarcosine oxidase complex
    supported_by:
      - reference_id: PMID:35266867
        supporting_text: "sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase (SoxBDAG)"
proposed_new_terms:
  - proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
    proposed_definition: >-
      Catalysis of the reaction: sarcosine + tetrahydrofolate + oxygen = glycine
      + 5,10-methylenetetrahydrofolate + hydrogen peroxide.
    justification: >-
      The SoxG subunit contributes to the heterotetrameric reaction, whose
      folate-coupled chemistry is absent from GO.
    proposed_parent:
      id: GO:0016645
      label: oxidoreductase activity, acting on the CH-NH group of donors
    supported_by:
      - reference_id: PMID:9185627
        supporting_text: "only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates"
suggested_questions:
  - question: What catalytic or assembly contribution is unique to SoxG?
suggested_experiments:
  - description: Reconstitute SoxABD with and without SoxG and compare complex assembly and sarcosine oxidation.
