  label: Pseudomonas putida KT2440
description: SoxG (PP_0326) is the gamma subunit of the cytosolic heterotetrameric sarcosine oxidase SoxABDG.
  It belongs to the SoxG family, which shares a folate-binding-like fold with the GcvT/TrmE superfamily; in
  the characterised orthologous enzyme the gamma subunit contacts two domains of the folate-binding alpha
  subunit. It is a component of the complex that oxidises sarcosine and transfers its methyl group to
  tetrahydrofolate, forming glycine, 5,10-methylenetetrahydrofolate and hydrogen peroxide. In KT2440 this
  catabolic role is inferred from conserved subunit identity and pathway context; the strain-specific creatine
  study cites SoxBDAG as background rather than directly characterizing the purified complex.
existing_annotations:
- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The formaldehyde-forming reaction is a supported secondary activity of heterotetrameric sarcosine
      oxidase, assigned here as a subunit contribution by orthology.
    action: KEEP_AS_NON_CORE
    reason: GO:0008115 names the formaldehyde-forming oxidation, experimentally supported for heterotetrameric
      enzymes without added tetrahydrofolate. Folate suppresses formaldehyde formation and supports
      5,10-methylenetetrahydrofolate production (PMIDs:9185627,16934831); the proportion of the two outputs in
      KT2440 has not been measured. Retain the conditional formaldehyde activity as non-core, without treating
      the generic KT2440 pathway diagram in PMID:35266867 as a product assay. SoxG contacts the two alpha
      domains; a possible folate-binding fold is not evidence of independent folate chemistry. The reaction
      belongs to the assembled enzyme. Isolated U-96 beta and beta/delta samples lacked flavin and became
      insoluble during further purification (PMID:15914915); these construct-dependent results do not prove
      autonomous activity impossible, but they do not demonstrate it. The core records contribution to the
      oxygen-dependent oxidation parent; the precise folate-coupled activity remains a complex-level proposed
      term.
    supported_by:
    - reference_id: PMID:15946648
      supporting_text: The gamma subunit is in contact with two domains of alpha subunit and has possibly a
        folate-binding structure.
    - reference_id: PMID:16934831
      supporting_text: In a second reaction, TSOX catalyzes the transfer of the oxidized 1-carbon fragment
        from the sarcosine imine
    - reference_id: PMID:16934831
      supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the
        sarcosine imine is hydrolyzed to glycine and formaldehyde.
    - reference_id: file:PSEPK/soxB/soxB-source-analysis/assembly-evidence.md
      supporting_text: Moreover, no flavin was found to be bound to these protein samples.
