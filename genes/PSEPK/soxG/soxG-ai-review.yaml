gene_symbol: soxG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SoxG (PP_0326) is the gamma subunit of the cytosolic heterotetrameric sarcosine oxidase SoxABDG. It
  belongs to the SoxG family, which shares a folate-binding-like fold with the GcvT/TrmE superfamily; in the characterised
  orthologous enzyme the gamma subunit contacts two domains of the folate-binding alpha subunit. It is a component
  of the complex that oxidises sarcosine and transfers its methyl group to tetrahydrofolate, forming glycine, 5,10-methylenetetrahydrofolate
  and hydrogen peroxide. In KT2440 the complex acts in sarcosine catabolism downstream of creatine and glycine betaine
  degradation.
existing_annotations:
- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GO:0008115 describes the folate-free, formaldehyde-forming reaction, a real but conditional activity
      of the SoxABDG complex; the physiological reaction is folate-coupled.
    action: KEEP_AS_NON_CORE
    reason: UniProt combined-IEA row (GO_REF:0000120) from the SoxG signature IPR006280 and the submitter-supplied
      EC 1.5.3.1. GO:0008115 is defined as "H2O + O2 + sarcosine = formaldehyde + glycine + H2O2". Heterotetrameric
      sarcosine oxidases perform this reaction when tetrahydrofolate is absent, so the term is true of the complex,
      but with folate they transfer the oxidised methyl group to tetrahydrofolate instead (EC 1.5.3.24, RHEA:70455),
      which has no GO term (see proposed_new_terms). The formaldehyde branch is therefore a genuine conditional
      secondary activity, kept as non-core, and the physiological activity is recorded in core_functions. The gamma
      subunit carries none of the flavin sites, so it contributes to rather than enables the activity; the qualifier
      defect is recorded for UniProt.
    supported_by:
    - reference_id: PMID:15946648
      supporting_text: The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding
        structure.
    - reference_id: PMID:16934831
      supporting_text: In a second reaction, TSOX catalyzes the transfer of the oxidized 1-carbon fragment from
        the sarcosine imine
    - reference_id: PMID:16934831
      supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine
        imine is hydrolyzed to glycine and formaldehyde.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: PROBABLE
      explanation: Sarcosine oxidase activity of the SoxABDG type belongs to the heterotetramer. The gamma subunit
        contacts the alpha subunit and carries none of the flavin sites, so the row should use contributes_to.
