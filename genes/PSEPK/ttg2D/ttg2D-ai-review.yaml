  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Periplasmic MlaC-family phospholipid carrier in the Ttg2/Mla system. Ttg2D
  binds membrane phospholipids in a hydrophobic pocket and shuttles them
  between the outer-membrane VacJ/MlaA interface and inner-membrane MlaFEDB.
