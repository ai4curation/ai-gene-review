id: Q88P91
gene_symbol: ttg2D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Periplasmic MlaC-family phospholipid carrier in the Ttg2/Mla system. Ttg2D
  binds membrane phospholipids in a hydrophobic pocket and shuttles them
  between the outer-membrane VacJ/MlaA interface and inner-membrane MlaFEDB.
references:
  - id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 Ttg2D (Q88P91)
    findings:
      - statement: Q88P91 has a solved structure and belongs to the MlaC phospholipid-carrier family.
  - id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK ttg2D
    findings:
      - statement: >-
          Apo and lipid-bound crystal structures exist for Q88P91 itself,
          directly supporting a cavity-bearing lipid-carrier architecture.
      - statement: >-
          Quantitative two-diacyl-phospholipid or one-cardiolipin loading and
          broad lipid promiscuity were measured for the P. aeruginosa ortholog,
          not directly for KT2440 Q88P91.
      - statement: >-
          The report identifies no KT2440-specific experiment resolving net
          transfer direction or the outer-membrane docking partner.
core_functions:
  - description: Periplasmic phospholipid binding and shuttling between the two bacterial envelope membranes.
    molecular_function:
      id: GO:0005543
      label: phospholipid binding
    directly_involved_in:
      - id: GO:0120010
        label: intermembrane phospholipid transfer
    locations:
      - id: GO:0030288
        label: outer membrane-bounded periplasmic space
    supported_by:
      - reference_id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
        supporting_text: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAC
      - reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
suggested_questions:
  - question: Which phospholipid classes and acyl-chain compositions are preferred by KT2440 Ttg2D?
  - question: What is the net physiological transfer direction of the KT2440 Ttg2/Mla system, and which outer-membrane protein receives or donates lipid to Ttg2D?
suggested_experiments:
  - description: Measure loading and unloading of purified Ttg2D against VacJ/MlaA and MlaFEDB proteoliposomes with defined lipid mixtures.
    experiment_type: phospholipid-transfer and lipidomics assay
