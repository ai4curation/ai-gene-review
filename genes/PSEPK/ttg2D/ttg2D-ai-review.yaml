id: Q88P91
gene_symbol: ttg2D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Periplasmic MlaC-family phospholipid carrier in the Ttg2/Mla system. Ttg2D
  binds membrane phospholipids in a hydrophobic pocket and shuttles them
  between the outer-membrane VacJ/MlaA interface and inner-membrane MlaFEDB.
existing_annotations:
  - term:
      id: GO:0005543
      label: phospholipid binding
    evidence_type: IDA
    original_reference_id: PDB:5UWB
    qualifier: enables
    review:
      summary: Q88P91 is an MlaC-family carrier with target-specific apo and lipid-bound structures.
      action: NEW
      reason: The solved hydrophobic-pocket architecture directly supports phospholipid binding, while exact loading stoichiometry remains uncertain for KT2440.
      supported_by:
        - reference_id: PDB:5UWB
          supporting_text: Lipid-bound crystal structure of Q88P91/PP_0961.
  - term:
      id: GO:0030288
      label: outer membrane-bounded periplasmic space
    evidence_type: ISS
    original_reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
    qualifier: located_in
    review:
      summary: Ttg2D is the soluble periplasmic carrier between the two membrane interfaces.
      action: NEW
      reason: MlaC-family identity and its carrier role in the diderm envelope support periplasmic localization.
      supported_by:
        - reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
          supporting_text: Consistent with its cleaved Sec signal peptide and the **absence of a lipobox** (i.e., it is not lipid-anchored to a membrane), Ttg2D is a **soluble protein resident in the periplasmic space**.
  - term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence_type: ISS
    original_reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
    qualifier: involved_in
    review:
      summary: Ttg2D shuttles phospholipid between the outer- and inner-membrane Mla interfaces.
      action: NEW
      reason: The MlaC-family assignment and complete local Mla/Ttg2 system support intermembrane transfer without fixing net direction.
      supported_by:
        - reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
          supporting_text: Ttg2D is therefore the mobile lipid-carrier module of this shuttle.
references:
  - id: PMID:33837253
    title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid transporter across the periplasm.
    findings:
      - statement: A directly characterized Pseudomonas ortholog binds and carries multiple glycerophospholipid species.
        supporting_text: >-
          In Pseudomonas aeruginosa, Ttg2D is the soluble periplasmic phospholipid-binding
          component of an ABC transport system thought to be involved in maintaining the
          asymmetry of the outer membrane.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Primary structural, mass-spectrometric, and genetic evidence on the close Pseudomonas aeruginosa ortholog.
  - id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 Ttg2D (Q88P91)
    findings:
      - statement: Q88P91 has a solved structure and belongs to the MlaC phospholipid-carrier family.
  - id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK ttg2D
    findings:
      - statement: >-
          Apo and lipid-bound crystal structures exist for Q88P91 itself,
          directly supporting a cavity-bearing lipid-carrier architecture.
      - statement: >-
          Quantitative two-diacyl-phospholipid or one-cardiolipin loading and
          broad lipid promiscuity were measured for the P. aeruginosa ortholog,
          not directly for KT2440 Q88P91.
      - statement: >-
          The report identifies no KT2440-specific experiment resolving net
          transfer direction or the outer-membrane docking partner.
  - id: PDB:5UWB
    title: Lipid-bound crystal structure of Pseudomonas putida Ttg2D
    findings:
      - statement: The structure directly demonstrates lipid in the binding cavity of Q88P91.
        supporting_text: Lipid-bound crystal structure of Q88P91/PP_0961.
core_functions:
  - description: Periplasmic phospholipid binding and shuttling between the two bacterial envelope membranes.
    molecular_function:
      id: GO:0005543
      label: phospholipid binding
    directly_involved_in:
      - id: GO:0120010
        label: intermembrane phospholipid transfer
    locations:
      - id: GO:0030288
        label: outer membrane-bounded periplasmic space
    supported_by:
      - reference_id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
        supporting_text: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAC
      - reference_id: PDB:5UWB
        supporting_text: Lipid-bound crystal structure of Q88P91/PP_0961.
knowledge_gaps:
  - gap_statement: Binding stoichiometry and phospholipid-class preferences have not been measured directly for Q88P91.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: The target structure establishes lipid binding, whereas quantitative specificity derives from the Pseudomonas aeruginosa ortholog.
suggested_questions:
  - question: Which phospholipid classes and acyl-chain compositions are preferred by KT2440 Ttg2D?
  - question: What is the net physiological transfer direction of the KT2440 Ttg2/Mla system, and which outer-membrane protein receives or donates lipid to Ttg2D?
suggested_experiments:
  - description: Measure loading and unloading of purified Ttg2D against VacJ/MlaA and MlaFEDB proteoliposomes with defined lipid mixtures.
    experiment_type: phospholipid-transfer and lipidomics assay
