id: Q88P91
gene_symbol: ttg2D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Periplasmic MlaC-family phospholipid carrier in the Ttg2/Mla system. Ttg2D binds membrane
  phospholipids in a hydrophobic pocket and shuttles them between the outer-membrane VacJ/MlaA interface
  and inner-membrane MlaFEDB.
existing_annotations:
- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PDB:5UWB
  qualifier: enables
  review:
    summary: Q88P91 is an MlaC-family carrier with target-specific apo and lipid-bound structures.
    action: NEW
    reason: The official 5UWB entity and SIFTS mapping verify KT2440 Q88P91, expressed in E. coli, with
      its full canonical sequence plus a C-terminal tag and selenomethionine substitutions. Re-refined
      lipid density supports phospholipid binding; the paper describes a tetra-acyl cardiolipin-like density
      while the deposited model contains PEF. Neither exact native ligand identity nor the PAO1 two-diacyl-lipid
      loading measurements are assigned directly to KT2440. The historical NEW payload and action are
      preserved.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_mla_intermembrane_phospholipid_transport/existing-review-consultation/evidence.md
      supporting_text: The 5UWB ligand entity is named "DI-PALMITOYL-3-SN-PHOSPHATIDYLETHANOLAMINE" (component
        PEF).
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: ISS
  original_reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
  qualifier: located_in
  review:
    summary: Ttg2D is the soluble periplasmic carrier between the two membrane interfaces.
    action: NEW
    reason: MlaC-family identity and its carrier role in the diderm envelope support periplasmic localization.
    supported_by:
    - reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
      supporting_text: Consistent with its cleaved Sec signal peptide and the **absence of a lipobox**
        (i.e., it is not lipid-anchored to a membrane), Ttg2D is a **soluble protein resident in the periplasmic
        space**.
- term:
    id: GO:0120010
    label: intermembrane phospholipid transfer
  evidence_type: ISS
  original_reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: Ttg2D shuttles phospholipid between the outer- and inner-membrane Mla interfaces.
    action: NEW
    reason: The MlaC-family assignment and complete local Mla/Ttg2 system support intermembrane transfer
      without fixing net direction.
    supported_by:
    - reference_id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
      supporting_text: Ttg2D is therefore the mobile lipid-carrier module of this shuttle.
references:
- id: PMID:33837253
  title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid
    transporter across the periplasm.
  findings:
  - statement: A directly characterized Pseudomonas ortholog binds and carries multiple glycerophospholipid
      species.
    supporting_text: In Pseudomonas aeruginosa, Ttg2D is the soluble periplasmic phospholipid-binding
      component of an ABC transport system thought to be involved in maintaining the asymmetry of the
      outer membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary structural, mass-spectrometric, and genetic evidence on the close Pseudomonas
      aeruginosa ortholog.
- id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
  title: UniProt record for Pseudomonas putida KT2440 Ttg2D (Q88P91)
  findings:
  - statement: Q88P91 has a solved structure and belongs to the MlaC phospholipid-carrier family.
- id: file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md
  title: OpenScientist functional research for PSEPK ttg2D
  findings:
  - statement: The original 4FCZ structure and its lipid-bound re-refinement 5UWB map to Q88P91. Absence
      of a modeled ligand in 4FCZ is not proof of an experimentally delipidated apo state.
  - statement: Quantitative two-diacyl-phospholipid or one-cardiolipin loading and broad lipid promiscuity
      were measured for the P. aeruginosa ortholog, not directly for KT2440 Q88P91.
  - statement: The report identifies no KT2440-specific experiment resolving net transfer direction or
      the outer-membrane docking partner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Useful synthesis that separates the solved Q88P91 structure and lipid-bound re-refinement
      from the P. aeruginosa lipid-loading and broad-specificity assays. It leaves net transport direction
      and KT2440 physiology untested. Provider synthesis retained unchanged as secondary research. Direct
      ATP-coupled retrograde transfer in E. coli is now supported by PMID:34873038; equivalent native
      KT2440 flux remains unmeasured.
- id: PDB:5UWB
  title: Lipid-bound crystal structure of Pseudomonas putida Ttg2D
  findings:
  - statement: The re-refined KT2440 Q88P91 structure contains lipid density; exact ligand identity and
      native stoichiometry are model-limited.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official RCSB/SIFTS identity and canonical sequence checked: Q88P91 residues1–215 plus
      LEHHHHHH, selenomethionine construct, E. coli host. Re-refinement of4FCZ models PEF lipid; the article
      describes a cardiolipin-like density. Supports phospholipid occupancy, not a native cargo-flux assay.'
- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer
    membrane asymmetry.
  findings:
  - statement: E. coli reconstitution provides comparative evidence for ATP-driven retrograde transfer,
      not a direct KT2440 direction or flux measurement.
    supporting_text: Therefore, we have shown that PLs equilibrate between MlaC and MlaFEDB, and ATP hydrolysis
      drives overall transport in the retrograde direction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary read as an E. coli comparator. KT2440 target role is inferred from specific
      family/domain/context evidence; no native target transfer kinetics or partner assay is asserted.
- id: file:analysis/module_audits/bacterial_mla_intermembrane_phospholipid_transport/existing-review-consultation/evidence.md
  title: 'Existing Mla panel: evidence and identity scope'
  findings:
  - statement: Official structural sequence/source mapping establishes the assayed Ttg2D target and bounds
      the lipid model interpretation.
    supporting_text: SIFTS maps both chains to Q88P91 residues 1–215 with identity 1.0.
