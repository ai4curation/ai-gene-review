knowledge_gaps:
- gap_statement: Binding stoichiometry and phospholipid-class preferences have not been measured directly
    for Q88P91.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: The target structure establishes lipid binding, whereas quantitative specificity derives
    from the Pseudomonas aeruginosa ortholog.
suggested_questions:
- question: Which phospholipid classes and acyl-chain compositions are preferred by KT2440 Ttg2D?
- question: What is the net physiological transfer direction of the KT2440 Ttg2/Mla system, and which
    outer-membrane protein receives or donates lipid to Ttg2D?
suggested_experiments:
- description: Measure loading and unloading of purified Ttg2D against VacJ/MlaA and MlaFEDB proteoliposomes
    with defined lipid mixtures.
  experiment_type: phospholipid-transfer and lipidomics assay
