id: Q88NV7
gene_symbol: metG
product_type: PROTEIN
status: DRAFT
taxon:
  id: "NCBITaxon:160488"
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: MetG is the cytoplasmic methionyl-tRNA synthetase of Pseudomonas putida KT2440. It uses ATP to attach L-methionine to elongator tRNA(Met) and initiator tRNA(fMet), supplying charged tRNAs for translation elongation and initiation; these assignments are based on a conserved-family HAMAP rule rather than a direct KT2440 assay.
existing_annotations:
- term: {id: "GO:0000049", label: tRNA binding}
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: tRNA binding is intrinsic to the MetRS reaction but is not defining beside the substrate-specific catalytic term.
    action: KEEP_AS_NON_CORE
    reason: The rule-based record explicitly names tRNA(Met) as substrate; GO:0004825 captures the informative core function.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "Catalyzes the attachment of L-methionine to tRNA(Met)."}]
- term: {id: "GO:0000166", label: nucleotide binding}
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic nucleotide binding is true but uninformative because ATP is the specified reaction substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-specific ligase term defines the function and GO:0005524 separately records ATP binding.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "Reaction=tRNA(Met) + L-methionine + ATP"}]
- term: {id: "GO:0004812", label: aminoacyl-tRNA ligase activity}
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This generic aaRS parent is correct but less informative than methionine-tRNA ligase activity.
    action: MODIFY
    reason: The exact substrates support the existing substrate-specific child term.
    proposed_replacement_terms: [{id: "GO:0004825", label: methionine-tRNA ligase activity}]
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "RecName: Full=Methionine--tRNA ligase"}]
- term: {id: "GO:0004825", label: methionine-tRNA ligase activity}
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the substrate-specific core catalytic activity of MetG.
    action: ACCEPT
    reason: UniProt records the matching ATP-dependent reaction with family-rule rather than direct experimental evidence; homodimerization does not negate the catalytic capability of each MetG polypeptide.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "Reaction=tRNA(Met) + L-methionine + ATP"}]
- term: {id: "GO:0005524", label: ATP binding}
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is a reaction substrate, but binding alone is ancillary to catalysis.
    action: KEEP_AS_NON_CORE
    reason: The rule-based catalytic record explicitly consumes ATP; GO:0004825 remains the defining function.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "Reaction=tRNA(Met) + L-methionine + ATP"}]
- term: {id: "GO:0005737", label: cytoplasm}
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is plausible and explicitly rule-assigned, but is not defining.
    action: KEEP_AS_NON_CORE
    reason: This is a HAMAP-rule localization rather than direct localization evidence.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"}]
- term: {id: "GO:0005829", label: cytosol}
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is compatible with the rule-assigned cytoplasmic location but is generic and inferred.
    action: KEEP_AS_NON_CORE
    reason: The localization supports context, not the defining catalytic role.
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"}]
- term: {id: "GO:0006418", label: tRNA aminoacylation for protein translation}
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The broad translation process is correct but less informative than methionyl-tRNA aminoacylation.
    action: MODIFY
    reason: The record identifies methionine and tRNA(Met), supporting the substrate-specific process.
    proposed_replacement_terms: [{id: "GO:0006431", label: methionyl-tRNA aminoacylation}]
    supported_by: [{reference_id: "file:PSEPK/metG/metG-uniprot.txt", supporting_text: "Catalyzes the attachment of L-methionine to tRNA(Met)."}]
- term: {id: "GO:0006431", label: methionyl-tRNA aminoacylation}
  evidence_type: IEA
