id: Q88NV7
gene_symbol: metG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: MetG charges both elongator tRNA(Met) and initiator tRNA(fMet) with methionine, providing
  substrates for elongation and bacterial translation initiation. It acts in the cytoplasm of Pseudomonas
  putida KT2440, using ATP to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: metG must recognize and bind tRNA(Met) to transfer its activated amino acid.
    action: ACCEPT
    reason: HAMAP MF_00098 supports methionylation of initiator and elongator tRNAs; the C-terminal tRNA-binding
      domain is independently classified. Formylation of initiator methionine is a subsequent reaction
      and is not catalysed by MetG. Substrate-tRNA binding is integral to this reaction and is not rendered
      uninformative merely because the catalytic MF is also annotated.
    supported_by: &id001
    - reference_id: file:PSEPK/metG/metG-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Met) + L-methionine + ATP = L-methionyl-tRNA(Met) + AMP +
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate methionine by metG.
    action: MODIFY
    reason: The MF_00098 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify methionine and tRNA(Met).
    action: MODIFY
    reason: HAMAP MF_00098 supports methionylation of initiator and elongator tRNAs; the C-terminal tRNA-binding
      domain is independently classified. Formylation of initiator methionine is a subsequent reaction
      and is not catalysed by MetG. GO:0004825 is the supported amino-acid-specific descendant of GO:0004812;
      the parent is biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0004825
      label: methionine-tRNA ligase activity
- term:
    id: GO:0004825
    label: methionine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: metG supplies methionine-charged tRNA(Met) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_00098 supports methionylation of initiator and elongator tRNAs; the C-terminal tRNA-binding
      domain is independently classified. Formylation of initiator methionine is a subsequent reaction
      and is not catalysed by MetG. The independently curated MF_00098 reaction supports this specific
      MF; electronic provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to metG-catalysed methionine activation.
    action: ACCEPT
    reason: The curated MF_00098 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: metG is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_00098 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/metG/metG-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
    - &id005
      id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for metG.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_00098 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: metG catalyses the charging step that supplies methionine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00098 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006431
    label: methionyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The methionine-specific charging chemistry remains supported, but this biological-process
      ID is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006431 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain methionine specificity
      in GO:0004825. This is ontology maintenance, not a rejection of the MF_00098 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id004
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
