suggested_questions:
- question: Which surfaces of P. putida Crc contact Hfq and RNA in KT2440 Hfq/Crc assemblies, and are
    they identical to those seen for P. aeruginosa?
- question: Does Crc have any Hfq-independent function, given its retained AP-endonuclease fold?
suggested_experiments:
- hypothesis: Crc residues at the Hfq interface are required for catabolite repression in KT2440.
  experiment_type: mutational_analysis
  description: Introduce point mutations at the Crc-Hfq interfaces defined by cryo-EM into the chromosomal
    crc of KT2440 and measure CA-motif reporter translation and catabolite repression of benzoate or alkane
    pathway genes.
