taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: crc (PP_5292) encodes Crc, the catabolite repression control protein of pseudomonads. Crc
  belongs to the apurinic/apyrimidinic endonuclease (exonuclease III) fold family but has lost the catalytic
  residues and shows no nuclease or DNA-binding activity. It does not bind RNA by itself; instead it acts
  as a co-repressor of the RNA chaperone Hfq. Hfq recognises A-rich catabolite-activity (CA) motifs near
  the translation initiation sites of catabolic mRNAs through its distal face, and Crc joins Hfq to form
  stable, higher-order Hfq/Crc/RNA assemblies that block translation initiation and promote decay of the
  target mRNAs. This sets carbon catabolite repression, the preferential use of favoured carbon sources
  such as succinate or organic acids. Repression is relieved when the CbrA/CbrB-induced small RNAs CrcZ
  and CrcY sequester Hfq/Crc. The Crc/Hfq system is functionally conserved across the Pseudomonadaceae,
  including Azotobacter vinelandii.
