- term:
    id: GO:0030371
    label: translation repressor activity
  evidence_type: ISS
  original_reference_id: PMID:34139006
  qualifier: contributes_to
  review:
    summary: Crc has no RNA-binding activity of its own but, as a co-repressor, joins Hfq on A-rich catabolite-activity
      motifs and stabilises the repressive Hfq/RNA complex, strengthening translational repression. It
      therefore contributes to the translation repressor activity of the Hfq/Crc assembly.
    action: NEW
    reason: Shown biochemically and structurally for the P. aeruginosa ortholog and supported for P. putida
      Crc by co-complex formation with Hfq on CA-motif RNA; contributes_to is used because Hfq, not Crc,
      binds the RNA.
    supported_by:
    - reference_id: PMID:34139006
      supporting_text: Here, Crc was shown to enhance Hfq-mediated translational repression of several
        mRNAs.
    - reference_id: PMID:34139006
      supporting_text: In fact, the presence of Crc resulted in stronger translational repression in vitro
        and in a significantly reduced half-life of the target amiE mRNA in vivo.
    - reference_id: PMID:24803210
      supporting_text: Crc was unable to bind RNA in the absence of Hfq. However, pull-down assays showed
        that Crc and Hfq can form a co-complex with RNA containing a CA motif in vitro.
