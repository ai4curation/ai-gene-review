id: Q88FT9
gene_symbol: tusD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  TusD is the sulfur-bearing subunit of the TusBCD sulfurtransfer complex. It
  receives relay sulfur through TusA and transfers it onward to TusE during
  MnmA-dependent thiolation of tRNA wobble uridine.
existing_annotations:
  - term: {id: "GO:0002143", label: tRNA wobble position uridine thiolation}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: TusD is a core intermediate of the MnmA sulfur relay.
      action: ACCEPT
      reason: The TusD family and neighboring tusBCDE locus support the specific pathway assignment.
  - term: {id: "GO:0005737", label: cytoplasm}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: TusD is a soluble subunit of the cytoplasmic TusBCD complex.
      action: ACCEPT
      reason: The family architecture and UniProt localization mapping support cytoplasm.
  - term: {id: "GO:0005829", label: cytosol}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: TusD is a soluble component of the bacterial cytosol.
      action: KEEP_AS_NON_CORE
      reason: >-
        Cytosol is biologically compatible with the soluble TusBCD complex, but
        it adds little information beyond the accepted cytoplasm annotation.
  - term: {id: "GO:0008033", label: tRNA processing}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Correct but less specific than wobble-uridine thiolation.
      action: KEEP_AS_NON_CORE
      reason: GO:0002143 captures the actual pathway role.
  - term: {id: "GO:0016783", label: sulfurtransferase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: TusD is the catalytic sulfur-bearing subunit of the TusBCD complex.
      action: KEEP_AS_NON_CORE
      reason: >-
        Sulfurtransferase activity is broad but biologically valid because the
        conserved TusD cysteine carries and transfers sulfur; GO:0097163 more
        specifically describes the carrier role.
      additional_reference_ids:
        - PMID:16472754
      supported_by:
        - reference_id: PMID:16472754
          supporting_text: >-
            In vivo mutant analyses revealed that only Cys78, in the TusD
            subunit, participates in sulfur transfer during the s2U modification
            process.
  - term: {id: "GO:0097163", label: sulfur carrier activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: This is the direct role of the sulfur-bearing TusD subunit.
      action: ACCEPT
      reason: TreeGrafter and the TusD-specific InterPro assignment support the carrier role.
  - term: {id: "GO:1990228", label: sulfurtransferase complex}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: part_of
    review:
      summary: TusD is a subunit of TusBCD.
      action: ACCEPT
      reason: The conserved TusBCD architecture supports complex membership.
