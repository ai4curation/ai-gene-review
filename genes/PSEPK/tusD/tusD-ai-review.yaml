  label: Pseudomonas putida KT2440
description: TusD (PP_3993) is the sulfur-carrying subunit of the TusBCD sulfur-transfer complex, encoded
  first in the contiguous tusD-tusC-tusB-tusE locus (PP_3993-PP_3996). By orthology to Escherichia coli
  TusD, whose Cys78 is conserved here, it accepts persulfide sulfur from TusA and passes it to TusE during
  MnmA-dependent 2-thiolation of the wobble uridine (U34) of tRNA.
