  label: Pseudomonas putida KT2440
description: TusD is the predicted covalent sulfur-bearing subunit of the cytosolic TusBCD complex. Its
  conserved carrier cysteine and TusD-specific signatures support transfer of sulfur through the TusA–TusBCD–TusE
  relay toward MnmA-dependent tRNA wobble-uridine thiolation. TusB and TusC provide the accompanying complex
  architecture; TusD is not itself the terminal tRNA thiouridylase.
