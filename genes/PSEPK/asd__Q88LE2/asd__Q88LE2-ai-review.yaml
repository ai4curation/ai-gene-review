  label: Pseudomonas putida KT2440
description: Asd-like PP_1992 is a semialdehyde-dehydrogenase-family protein with an N-terminal NAD(P)-binding
  region and a C-terminal dimerization domain. It is a candidate aldehyde oxidoreductase, but its physiological
  substrate, cofactor usage and contribution to amino-acid biosynthesis in KT2440 remain unresolved.
