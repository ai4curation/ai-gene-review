description: >-
  Q88LE2 (asd, PP_1992) is a predicted aspartate-semialdehyde dehydrogenase
  paralog with semialdehyde-dehydrogenase domains. Unlike canonical PP_1989,
  its record lacks HAMAP MF_02121, an EC assignment, a curated Rhea reaction,
  and UniPathway mappings, leaving its exact activity and physiological role
  unresolved.
