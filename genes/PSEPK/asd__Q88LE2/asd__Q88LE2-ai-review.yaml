  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The Asd-like architecture supports a candidate but does not resolve the native reaction.
    action: UNDECIDED
    reason: No direct PP_1992 assay or locus-specific complementation was recovered. PANTHER PTHR46278:SF2
      also contains a functional Corynebacterium Asd, so family placement and absence of the gamma-type
      HAMAP rule cannot establish loss of Asd activity. Exact substrate and NADP use remain unresolved.
