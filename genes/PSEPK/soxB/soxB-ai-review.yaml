      enzymes without added tetrahydrofolate. Folate suppresses formaldehyde formation and supports 5,10-methylenetetrahydrofolate
      production (PMIDs:9185627,16934831); the proportion of the two outputs in KT2440 has not been measured.
      Retain the conditional formaldehyde activity as non-core, without treating the generic KT2440 pathway
      diagram in PMID:35266867 as a product assay. SoxB supplies the FAD sarcosine-oxidation and FMN oxygen-reduction
      sites within the assembled enzyme. The reaction belongs to the assembled enzyme. Isolated U-96 beta and
      beta/delta samples lacked flavin and became insoluble during further purification (PMID:15914915); these
      construct-dependent results do not prove autonomous activity impossible, but they do not demonstrate
      it. The core records contribution to the oxygen-dependent oxidation parent; the precise folate-coupled
      activity remains a complex-level proposed term.
