core_functions:
- description: Supplies the beta-localized catalytic oxidation of sarcosine to its imine at FAD, followed by
    electron transfer through FMN to oxygen, forming hydrogen peroxide within the assembled sarcosine oxidase.
    The proposed imine-forming activity records this catalytic subreaction, not autonomous activity of purified
    beta. The separate contributes_to function records participation in collective enzyme turnover. Subsequent
    alpha-associated folate capture yields glycine and 5,10-methylenetetrahydrofolate; it is excluded from
    the beta-specific proposal. The beta-site assignment is inferred from the specific SoxB family and characterized
    U-96/other heterotetrameric homologs; this target subunit has not been isolated and assayed. Isolated beta
    and beta/delta constructs lacked flavin under the reported U-96 expression conditions, so active-site localization
    does not prove stand-alone turnover.
