- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GO:0008115 describes the folate-free, formaldehyde-forming reaction, a real but conditional activity
      of the SoxABDG complex; the physiological reaction is folate-coupled.
    action: KEEP_AS_NON_CORE
    reason: UniProt combined-IEA row (GO_REF:0000120) from the SoxB signature IPR006278 and RHEA:13313. GO:0008115
      is defined as "H2O + O2 + sarcosine = formaldehyde + glycine + H2O2". Heterotetrameric sarcosine oxidases
      perform this reaction when tetrahydrofolate is absent, so the term is true of the complex, but with folate
      they transfer the oxidised methyl group to tetrahydrofolate instead (EC 1.5.3.24, RHEA:70455), which has no
      GO term (see proposed_new_terms). The formaldehyde branch is therefore a genuine conditional secondary activity,
      kept as non-core, and the physiological activity is recorded in core_functions. SoxB holds the FAD at which
      sarcosine is oxidised and the FMN that reduces oxygen, so the enables qualifier is correct for SoxB; the accessory
      subunits contribute to the complex activity.
    supported_by:
    - reference_id: PMID:16934831
      supporting_text: Sarcosine binds near FAD where it is oxidized to the corresponding imine, accompanied by
        the formation of 1,5-dihydroFAD (FADH 2 ).
    - reference_id: PMID:16934831
      supporting_text: In a second reaction, TSOX catalyzes the transfer of the oxidized 1-carbon fragment from
        the sarcosine imine
    - reference_id: PMID:16934831
      supporting_text: In the absence of H 4 folate, turnover occurs at a somewhat slower rate and the sarcosine
        imine is hydrolyzed to glycine and formaldehyde.
    - reference_id: PMID:15946648
      supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately
        10A apart.
