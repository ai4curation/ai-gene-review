core_functions:
- description: Catalytic flavoprotein (beta) subunit of the heterotetrameric sarcosine oxidase SoxABDG, which converts
    sarcosine, tetrahydrofolate and O2 to glycine, 5,10-methylenetetrahydrofolate and H2O2 (EC 1.5.3.24); sarcosine
    is oxidised at its FAD and electrons pass via its covalent FMN to oxygen. The folate-free formaldehyde-forming
    reaction (GO:0008115) is a conditional secondary activity of the complex.
  proposed_molecular_function: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  locations:
