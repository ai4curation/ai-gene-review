taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SoxB (PP_0323) is the beta subunit of the cytosolic heterotetrameric sarcosine oxidase SoxABDG.
  It belongs to the FAD-dependent (D-amino-acid-oxidase-like) oxidoreductase fold and, in characterised orthologous
  enzymes, carries the FAD at which sarcosine is oxidised to its imine and a covalently bound FMN that passes
  electrons to oxygen, producing hydrogen peroxide. Together with the folate-binding alpha subunit and the
  small delta and gamma subunits, it forms an enzyme that transfers the oxidised methyl group of sarcosine
  to tetrahydrofolate, yielding glycine and 5,10-methylenetetrahydrofolate, and releases formaldehyde in the
  folate-free reaction. In KT2440 this catabolic role is inferred from conserved subunit identity and pathway
  context; the strain-specific creatine study cites SoxBDAG as background rather than directly characterizing
  the purified complex.
