taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SoxB (PP_0323) is the beta subunit of the cytosolic SoxABDG sarcosine oxidase
  complex. It carries the FAD-dependent oxidoreductase region and contributes
  to tetrahydrofolate-coupled oxidation of sarcosine to glycine, but the full
  activity requires all four subunits.
