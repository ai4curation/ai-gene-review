  label: Pseudomonas putida KT2440
description: >-
  GshB is the ATP-dependent glutathione synthetase that catalyzes the second
  and final reaction of glutathione biosynthesis. It adds glycine to
  gamma-L-glutamyl-L-cysteine to form glutathione and uses magnesium or
  manganese as a catalytic metal.
