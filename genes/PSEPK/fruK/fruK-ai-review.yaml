suggested_questions:
- question: What are the kinetic parameters and allosteric controls of KT2440 FruK
    under physiological fructose 1-phosphate concentrations?
suggested_experiments:
- hypothesis: FruK activity prevents accumulation of fructose 1-phosphate after induction
    of the fruBKA operon.
  description: Quantify fructose 1-phosphate, fructose 1,6-bisphosphate, uptake rate,
    and growth in wild type, a fruK deletion, and a catalytically inactive FruK complement
    across a fructose concentration series.
  experiment_type: targeted metabolomics and genetic complementation
