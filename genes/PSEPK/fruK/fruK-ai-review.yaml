id: Q88PQ4
gene_symbol: fruK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: FruK is the cytosolic 1-phosphofructokinase of the fructose-utilization
  operon. It uses ATP to phosphorylate the fructose 1-phosphate produced by the FruA/FruB
  phosphotransferase system, yielding fructose 1,6-bisphosphate for entry into central
  carbon metabolism. FruK belongs to the PfkB carbohydrate kinase family and is distinct
  from ATP-dependent 6-phosphofructokinases that act on fructose 6-phosphate.
