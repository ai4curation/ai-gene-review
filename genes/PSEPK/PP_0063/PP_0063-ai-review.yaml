taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: PP_0063 is a predicted inner-membrane acyltransferase of the
  LpxL/LpxM-like lipid acyltransferase family. Its physiological lipid acceptor and
  precise role in glycolipid or lipid A remodeling remain unresolved.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: PP_0063 is predicted to be an inner-membrane protein.
    action: ACCEPT
    reason: UniProt subcellular-location mapping supports inner-membrane localization for this family protein.
- term:
    id: GO:0009247
    label: glycolipid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: A role in glycolipid biosynthesis is plausible for this lipid acyltransferase-family protein, but its physiological acceptor has not been established.
    action: UNDECIDED
    reason: Family membership supports lipid acyl transfer but does not establish that the in vivo substrate is a glycolipid or identify a specific pathway.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Membrane is correct but redundant with the more precise plasma membrane annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic membrane term adds no information beyond GO:0005886.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Transferase activity is plausible but is less informative than the supported acyltransferase-family assignment.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0016746 captures the level of direct function currently justified without inventing substrate specificity.
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The conserved lipid acyltransferase-family domain supports acyltransferase activity, while exact donor and acceptor specificity remain unknown.
    action: ACCEPT
    reason: InterPro IPR004960 and related family signatures support acyl transfer, but neither a substrate-specific GO term nor an EC assignment is justified.
