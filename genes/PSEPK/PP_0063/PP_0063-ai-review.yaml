  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: PP_0063 is an inner-membrane secondary acyltransferase of the LpxL/LpxM-like
  lipid acyltransferase family that installs a secondary acyl chain on lipid A. Deletion
  and complementation/overexpression analysis in Pseudomonas putida KT2442 identified it,
  together with its paralog PP_1735 (HtrB/LpxL), as one of the two lipid A secondary
  acyltransferases, with PP_0063 adding the 2-OH-C12:0 chain at the 2-position and
  PP_1735 adding C12:0 at the 2'-position.
