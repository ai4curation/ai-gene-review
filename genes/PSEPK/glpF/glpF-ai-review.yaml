      TreeGrafter IEA (GO_REF:0000118) via PANTHER node PTN002466301 of
      PTHR43829 (aquaporin/aquaglyceroporin family), propagating the PAINT
      plasma-membrane assertion of the aquaglyceroporin lineage.
    action: ACCEPT
    reason: >-
      Q88NX7 has six predicted transmembrane helices and belongs to the MIP
      family; as a bacterial integral membrane channel for nutrient uptake its
      membrane is the cytoplasmic membrane, which GO maps to plasma membrane.
      The E. coli ortholog GlpF is experimentally located in the inner
      membrane. This is the location of the core channel activity.
