taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  glpF (PP_1076) encodes a six-pass aquaglyceroporin in the cytoplasmic membrane
  that facilitates glycerol entry into Pseudomonas putida KT2440. It is the
  transport component of the glpFKRD glycerol-utilization locus: imported
  glycerol is phosphorylated by GlpK and the resulting
  sn-glycerol-3-phosphate is oxidized by GlpD. GlpF is a channel/facilitator,
  not an ATP-coupled transporter.
