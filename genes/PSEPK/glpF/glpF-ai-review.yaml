suggested_questions:
- question: >-
    Is glpF required for growth of KT2440 on glycerol at low concentrations, as
    in E. coli, or can glycerol enter by simple diffusion fast enough at the
    concentrations used in culture?
suggested_experiments:
- hypothesis: >-
    PP_1076 is the main route of glycerol entry in P. putida KT2440.
  description: >-
    Measure [14C]glycerol uptake and growth on a range of glycerol
    concentrations for a clean glpF deletion strain, complemented in trans,
    compared with wild-type KT2440.
  experiment_type: transport assay
