id: Q88NX7
gene_symbol: glpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  glpF (PP_1076) encodes an aquaglyceroporin of the MIP/aquaporin family with six
  predicted transmembrane helices, an ortholog of the Escherichia coli glycerol
  uptake facilitator GlpF. It is the uptake component of the glpFKRD
  glycerol-utilization gene cluster of Pseudomonas putida KT2440, whose
  expression is controlled by the glycerol-3-phosphate-responsive repressor
  GlpR. GlpF acts as a passive channel that lets glycerol diffuse into the cell
  across the cytoplasmic membrane; imported glycerol is then phosphorylated by
  glycerol kinase (GlpK) and the resulting sn-glycerol-3-phosphate is oxidized
  by the membrane-bound dehydrogenase GlpD.
