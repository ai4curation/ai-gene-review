id: P0A116
gene_symbol: dnaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: DnaA is the ATP-dependent bacterial chromosome-replication initiator. It recognizes DnaA boxes at oriC, assembles an origin-bound nucleoprotein filament, and promotes local duplex opening so that the replicative helicase and downstream replisome can be loaded. Its ATP/ADP state couples origin firing to once-per-cell-cycle regulation.
