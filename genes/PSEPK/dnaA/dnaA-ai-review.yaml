taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DnaA is the ATP-dependent bacterial chromosome-replication initiator. It recognizes DnaA
  boxes at oriC, assembles an origin-bound nucleoprotein filament, and promotes local duplex opening so
  that the replicative helicase and downstream replisome can be loaded. Its ATP/ADP state couples origin
  firing to once-per-cell-cycle regulation.
