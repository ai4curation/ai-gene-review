    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: DnaA binds DNA directly, but the generic term is less informative than origin and sequence-specific DNA binding.
    action: KEEP_AS_NON_CORE
    reason: The local reviewed UniProt record identifies a dedicated DnaA-box-binding domain and oriC recognition; generic DNA binding is correct but subordinate to those specific functions.
- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct core activity for recognition and assembly at oriC.
    action: ACCEPT
    reason: The reviewed UniProt record states that ATP-DnaA binds oriC and DnaA boxes to initiate origin opening.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct nucleotide-binding property of the DnaA AAA+ initiator.
    action: ACCEPT
    reason: ATP binding controls the initiation-competent state and is supported by the DnaA AAA+ domain assignment.
