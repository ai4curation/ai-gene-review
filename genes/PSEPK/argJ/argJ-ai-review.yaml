taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ArgJ (PP_1346) is an inferred cytoplasmic ornithine acetyltransferase that transfers the
  acetyl group from N-acetyl-L-ornithine to L-glutamate, releasing ornithine and regenerating N-acetylglutamate
  for L-arginine biosynthesis. Whether the KT2440 enzyme also uses acetyl-CoA efficiently is unresolved;
  endogenous ArgJ does not prevent arginine auxotrophy after loss of ArgA under tested conditions.
