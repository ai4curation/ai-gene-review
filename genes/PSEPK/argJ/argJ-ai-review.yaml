    summary: Acetyl-CoA-dependent initiation is not established for KT2440 ArgJ.
    action: UNDECIDED
    reason: HAMAP assigns this second activity, but mono- and bifunctional ArgJ proteins coexist (PMID10931207),
      and PMID17347518 cautions that sequence-family membership alone does not establish bifunctionality.
      Native argA auxotrophy (PMID31451546) excludes effective replacement in those conditions, not residual
      ArgJ activity. A target substrate assay is needed.
