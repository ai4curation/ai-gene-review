- id: file:PSEPK/argJ/argJ-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgJ
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. Acetyl recycling is a supported ArgJ family inference. Acetyl-CoA initiation
      is UNDECIDED: HAMAP assigns it, but PMID10931207 experimentally distinguishes mono- and bifunctional
      ArgJ proteins and PMID17347518 explicitly warns against blanket bifunctionality transfers. Native
      argA auxotrophy limits physiological replacement, not residual ArgJ catalytic activity. Nonauxotrophy
      of argJ does not prove inactivity or establish which backup pathway operates.'
  findings:
  - statement: The report retrieves both defining ArgJ reactions for the exact target accession. Its claims
      that the cyclic route is dominant in KT2440 and that target-specific inhibition or expression is
      established are not used; the direct KT2440 mutant result above also corrects its statement that
      no knockout phenotype has been published.
    supporting_text: N²-acetyl-L-ornithine + L-glutamate → N-acetyl-L-glutamate + L-ornithine
