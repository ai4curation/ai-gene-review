proposed_new_terms: []
suggested_questions:
- question: What intracellular signal sensed by the CbrA/CbrB system most directly determines CbrB activity
    under different carbon and nitrogen regimes?
- question: Which of the 61 candidate ChIP regions have functional CbrB-dependent regulation, and what
    sigma-factor and binding mechanisms explain repression at oprD, rpoN and glgA?
suggested_experiments:
- hypothesis: CbrB promoter activation has target-specific dependence on phosphorylation and ATPase activity.
  experiment_type: mutational_analysis
  description: Compare wild type cbrB with phospho-acceptor and ATPase-defective alleles using promoter
    reporters, ChIP-seq, and RNA-seq under succinate, oxaloacetate, and histidine growth conditions.
- hypothesis: The upstream signal sensed through CbrA/CbrB is intracellular rather than extracellular
    histidine itself.
  experiment_type: biochemical_assay
  description: Quantify CbrA-to-CbrB phosphotransfer and CbrB-dependent promoter activation after perturbing
    candidate intracellular metabolites that track carbon/nitrogen imbalance.
- hypothesis: Reported biofilm phenotypes attributed to cbrB include indirect effects from secondary mutations
    or downstream circuitry.
  experiment_type: phenotype_analysis
  description: Rebuild clean chromosomal cbrB loss-of-function and truncation alleles in otherwise isogenic
    backgrounds and measure biofilm formation, dispersal, lapD/lapG status, and crcZ/crcY expression.
