  title: Falcon (Edison Scientific) deep research report for cbrB in Pseudomonas putida KT2440
  findings:
  - statement: Provider synthesis used to locate primary work; mechanistic claims were checked against
      PMID:30557364 and PMID:32214184. The protein is not a metabolic catalyst or transporter, but its
      AAA+ domain precludes interpreting this as absence of ATP-dependent activity.
- id: file:PSEPK/cbrB/cbrB-uniprot.txt
  title: UniProt entry Q88DX2
  findings:
  - statement: UniProt identifies the reviewed locus as PP_4696 and names the protein AlgB by homology
  - statement: Domain architecture includes receiver and sigma-54 activator modules
  - statement: UniProt carries alginate-associated keyword and pathway assignments that are not the focus
      of the KT2440 cbrB literature
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The accession/locus and domain architecture identify the KT2440 CbrB response regulator.
      ARBA-derived AlgB naming and alginate pathway text need separate source corrections; the downloaded
      record remains unchanged.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q88DX2
      slot: DE:RecName
      asserted_value: Alginate biosynthesis transcriptional regulatory protein AlgB
      corrected_value: CbrB
      requested_change: CHECK
      confidence: CONFIRMED
      cause: OTHER
      explanation: ARBA00073743 supplies an AlgB name to PP_4696, but the primary KT2440 study identifies
        this exact locus as cbrB and tests CbrAB carbon-source regulation. Replace the preferred name
        with the experimentally established CbrB identity; shared enhancer-binding architecture does not
        establish AlgB pathway specificity.
      supported_by:
      - reference_id: PMID:32214184
        supporting_text: To individually delete cbrA (PP_4695) and cbrB (PP_4696) from the genome of P.
          putida KT2440
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q88DX2
      slot: CC:PATHWAY
      asserted_value: Glycan biosynthesis; alginate biosynthesis [regulation].
      requested_change: CHECK
      confidence: PROBABLE
      cause: OTHER
      explanation: ARBA00060514 assigns an alginate pathway to the CbrB locus. Primary evidence instead
        establishes CbrAB-dependent regulation of crcZ/crcY and carbon control. The pathway assignment
        may reflect the AlgB family-name conflation; request curator review rather than claiming experimental
        disproof of every possible alginate effect.
      supported_by:
      - reference_id: PMID:23692431
        supporting_text: We show that the response regulatory protein CbrB, an activator of σ(N) -dependent
          promoters, directly controls the expression of the small RNAs CrcZ and CrcY in P. putida.
