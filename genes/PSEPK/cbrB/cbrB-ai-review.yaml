references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro-based annotation captures genuine receiver and sigma-54 activator features of
      CbrB but misses the more specific response-regulator and transcription-activator terms needed for
      manual review.
- id: PMID:23692431
  title: Transcriptional activation of the CrcZ and CrcY regulatory RNAs by the CbrB response regulator
    in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: CbrB directly activates the crcZ and crcY regulatory RNAs
    supporting_text: We show that the response regulatory protein CbrB, an activator of σ(N) -dependent
      promoters, directly controls the expression of the small RNAs CrcZ and CrcY in P. putida.
    reference_section_type: ABSTRACT
  - statement: CbrAB controls carbon catabolite repression through the two regulatory RNAs
    supporting_text: Thus, CbrAB constitute a global signal transduction pathway integrated in a higher
      regulatory network that also controls catabolite repression through the expression of the two regulatory
      RNAs CrcZ and CrcY.
    reference_section_type: ABSTRACT
  - statement: Physiological promoter activation normally depends on CbrB phosphorylation
    supporting_text: CbrB phosphorylation is necessary at physiological activation conditions, but a higher
      dose of the protein allows in vitro transcriptional activation in its non-phosphorylated form.
    reference_section_type: ABSTRACT
- id: PMID:30557364
  title: 'The CbrB Regulon: Promoter dissection reveals novel insights into the CbrAB expression network
    in Pseudomonas putida.'
  findings:
  - statement: ChIP selection yielded 61 candidate fragments; individual binding, transcriptional and
      promoter-mutation validations cover a subset, in KT2442 with KT2440 reference coordinates.
    supporting_text: a total of 61 individual DNA fragments following these premises were selected.
    reference_section_type: RESULTS
  - statement: Purified CbrB binds PP2810, oprD/PP1206 and PP3420 promoter fragments.
    supporting_text: We were able to detect a mobility shift for DNA fragments containing the promoter
      regions of PP2810, PP1206 and PP3420 (Fig 1A).
    reference_section_type: RESULTS
  - statement: Expression effects have both signs; oprD, rpoN and glgA are repressed in the tested condition.
    supporting_text: three of the target genes validated by quantitative RT-PCR resulted to be repressed
      (oprD, rpoN and glgA).
    reference_section_type: DISCUSSION
  - statement: Subsite mutagenesis and promoter reporters dissect activation at crcZ, crcY and PP2810.
    supporting_text: In vivo expression of crcZ, crcY and PP2810 of P. putida and point mutagenesis of
      the CbrB binding sites.
    reference_section_type: RESULTS
- id: PMID:20553554
  title: Lack of CbrB in Pseudomonas putida affects not only amino acids metabolism but also different
    stress responses and biofilm development.
  full_text_unavailable: true
  findings:
  - statement: CbrB works with NtrC to support amino-acid uptake and assimilation
    supporting_text: CbrB is involved in coordination with the nitrogen control system activator, NtrC,
      in the uptake and assimilation of several amino acids.
    reference_section_type: ABSTRACT
  - statement: Loss of cbrB affects additional physiological programs beyond amino-acid metabolism
    supporting_text: CbrB affects other carbon utilization pathways and a number of apparently unrelated
      functions, such as chemotaxis, stress tolerance and biofilm development.
    reference_section_type: ABSTRACT
  - statement: CbrB sits high in the regulatory hierarchy of P. putida
    supporting_text: we propose that CbrB is a high-ranked element in the regulatory hierarchy of P. putida
      that directly or indirectly controls a variety of metabolic and behavioural traits required for
      adaptation to changing environmental conditions.
    reference_section_type: ABSTRACT
- id: PMID:22053874
  title: Two small RNAs, CrcY and CrcZ, act in concert to sequester the Crc global regulator in Pseudomonas
    putida, modulating catabolite repression.
  full_text_unavailable: true
  findings:
  - statement: The paper proposes Crc sequestration by CrcZ/CrcY; this is its historical model, not independent
      evidence excluding the subsequently described Hfq/Crc machinery.
    supporting_text: We propose that CrcZ and CrcY act in concert, sequestering and modulating the levels
      of free Crc according to metabolic conditions.
    reference_section_type: ABSTRACT
  - statement: CbrA/CbrB activates crcZ transcription in the catabolite repression network
    supporting_text: The CbrA/CbrB two-component system activated crcZ transcription, but had little effect
      on crcY.
    reference_section_type: ABSTRACT
- id: PMID:27085034
  title: A Pseudomonas putida cbrB transposon insertion mutant displays a biofilm hyperproducing phenotype
    that is resistant to dispersal.
  full_text_unavailable: true
  findings:
  - statement: The biofilm overproduction phenotype in the insertion strain is confounded by additional
      mutations and should not be treated as a clean direct CbrB function
    supporting_text: Also, two additional point mutations in lapG and lapD have been detected in MPO406
      by whole genome sequencing. Combination of these effects provides a robust biofilm overproducing
      phenotype.
    reference_section_type: ABSTRACT
- id: PMID:32214184
  title: Transport and kinase activities of CbrA of Pseudomonas putida KT2440.
  findings:
  - statement: The KT2440 study explicitly identifies cbrB as PP_4696.
    supporting_text: To individually delete cbrA (PP_4695) and cbrB (PP_4696) from the genome of P. putida
      KT2440
    reference_section_type: METHODS
  - statement: Purified CbrA transfers phosphate to CbrB.
    supporting_text: the histidine kinase can autophosphorylate and transfer the phosphoryl group to the
      response regulator CbrB.
    reference_section_type: ABSTRACT
  - statement: The physiological intracellular signal for CbrA remains unidentified; histidine is not
      thereby established as a direct CbrB ligand.
    supporting_text: The lack of an effect of L-histidine leaves open the possibility that a yet to be
      identified intracellular metabolite is perceived by CbrA as a signal.
    reference_section_type: RESULTS
