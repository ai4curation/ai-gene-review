  label: Pseudomonas putida KT2440
description: CbrB is the response regulator of the CbrA/CbrB two-component system in Pseudomonas putida
  KT2440. It receives phosphate from CbrA and functions as a DNA-binding, sigma-54-dependent transcriptional
  activator. Its central outputs include the regulatory RNAs CrcZ and CrcY, which modulate carbon catabolite
  repression. CbrB also regulates additional promoters in response to carbon availability, coordinating
  nutrient utilization with carbon and nitrogen balance. Its receiver, AAA+ activator and DNA-binding
  domains couple signaling to transcription; the upstream physiological signal remains incompletely defined.
