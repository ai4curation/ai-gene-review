- id: cbrB_PP2810_operon
  target:
    name: PP2810-PP2813 operon
    type: operon
    locus: PP_2810
  effect: activates
  directness: direct
  experimental_strain: Pseudomonas putida KT2442 wild type and MPO401 (ΔcbrB); KT2440 reference coordinates
  condition: Minimal medium with oxaloacetate; reporter comparison also includes LB and succinate.
  evidence:
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: Purified-protein EMSA, followed by DNase I footprinting (Fig. 5).
    supporting_text: We were able to detect a mobility shift for DNA fragments containing the promoter
      regions of PP2810, PP1206 and PP3420 (Fig 1A).
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: Promoter subsite mutations and lacZ reporters (Figs. 2-3); Table 2 reports 20.6-fold WT/ΔcbrB
      reporter ratio.
    supporting_text: In vivo expression of crcZ, crcY and PP2810 of P. putida and point mutagenesis of
      the CbrB binding sites.
  interpretation: Direct activation is supported by promoter binding, footprinting and functional promoter
    mutations. The operon is represented by its first locus.
  limitations:
  - Operon membership is reported by the paper; no biochemical function of the encoded proteins is assigned.
- id: cbrB_oprD
  target:
    name: oprD promoter
    type: promoter
    locus: PP_1206
  effect: represses
  directness: direct
  experimental_strain: Pseudomonas putida KT2442 wild type and MPO401 (ΔcbrB); KT2440 reference coordinates
  condition: Oxaloacetate induction; Table 2 WT/ΔcbrB transcript ratio 0.3.
  evidence:
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: Purified-protein EMSA (Fig. 1); ChIP enrichment 3.45.
    supporting_text: We were able to detect a mobility shift for DNA fragments containing the promoter
      regions of PP2810, PP1206 and PP3420 (Fig 1A).
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: RT-qPCR of WT and ΔcbrB (Table 2); Discussion interpretation.
    supporting_text: three of the target genes validated by quantitative RT-PCR resulted to be repressed
      (oprD, rpoN and glgA).
  interpretation: Promoter binding plus the negative expression response support a direct repressive relationship
    under the tested condition.
  limitations:
  - Promoter mutations establishing the causal repressive site were not presented. The authors question
    dependence on sigma-54 for repressed promoters; the precise repression mechanism remains unresolved.
- id: cbrB_PP3420
  target:
    name: PP3420 promoter
    type: promoter
    locus: PP_3420
  effect: activates
  directness: direct
  experimental_strain: Pseudomonas putida KT2442 wild type and MPO401 (ΔcbrB); KT2440 reference coordinates
  condition: Oxaloacetate induction; Table 2 prints the WT/ΔcbrB transcript ratio as 11,7 (decimal comma;
    interpreted as 11.7).
  evidence:
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: Purified-protein EMSA (Fig. 1); ChIP enrichment 3.38.
    supporting_text: We were able to detect a mobility shift for DNA fragments containing the promoter
      regions of PP2810, PP1206 and PP3420 (Fig 1A).
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: 'Table 2, PP3420 row: the columns are locus, product, ChIP enrichment (3.38), then WT/ΔcbrB
      expression ratio (11,7). The decimal-comma conversion is explicit in condition; the source quote
      retains the original table text.'
    supporting_text: PP3420 ... sensor histidine kinase ... 3.38 ... 11,7
  interpretation: Binding and increased transcript abundance in wild type support direct activation.
  limitations:
  - No functional promoter subsite mutation was reported for this target, and activation may also involve
    other regulators. No downstream pathway of the predicted sensor kinase is asserted.
pathway_context:
- process:
    id: GO:0061985
    label: carbon catabolite repression
  name: Carbon-source hierarchy through the CrcZ/CrcY regulatory RNA circuit
  relationship: regulates
  mechanism: Direct activation of crcZ/crcY changes the regulatory RNA arm of Hfq/Crc-mediated control.
    This is regulatory participation, not execution of downstream catabolic reactions.
  evidence:
  - reference_id: PMID:23692431
    source_url: https://doi.org/10.1111/mmi.12270
    assay: 2013 abstract synthesis of promoter and regulatory RNA results.
    supporting_text: Thus, CbrAB constitute a global signal transduction pathway integrated in a higher
      regulatory network that also controls catabolite repression through the expression of the two regulatory
      RNAs CrcZ and CrcY.
