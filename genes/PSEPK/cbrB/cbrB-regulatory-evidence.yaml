regulator:
  accession: Q88DX2
  locus: PP_4696
  taxon: NCBITaxon:160488
relationships:
- id: cbrB_crcZ
  target:
    name: crcZ promoter
    type: promoter
  effect: activates
  directness: direct
  experimental_strain: Pseudomonas putida KT2442 wild type and MPO401 (ΔcbrB); KT2440 reference coordinates
  condition: LB and minimal medium with succinate or oxaloacetate; binding assays with purified CbrB.
  evidence:
  - reference_id: PMID:23692431
    source_url: https://doi.org/10.1111/mmi.12270
    assay: Direct control and in vitro transcription reported in the accessible abstract; full text unavailable.
    supporting_text: We show that the response regulatory protein CbrB, an activator of σ(N) -dependent
      promoters, directly controls the expression of the small RNAs CrcZ and CrcY in P. putida.
  - reference_id: PMID:30557364
    source_url: https://doi.org/10.1371/journal.pone.0209191
    assay: '2018 full text Figures 3-4 and S3: promoter subsite mutations, EMSA and lacZ reporters in
      wild type and ΔcbrB.'
    supporting_text: In vivo expression of crcZ, crcY and PP2810 of P. putida and point mutagenesis of
      the CbrB binding sites.
  interpretation: CbrB binding and promoter activity support direct transcriptional activation of this
    regulatory RNA. This is the cbrb_transcription_activator step in MODULE:pseudomonad_cbr_crc_catabolite_control,
    linked through the gene review references.
  limitations:
  - The 2013 cache is abstract-only; the 2018 full text independently supplies promoter assays. Regulatory
    RNA sequestration and downstream metabolic targets are distinct regulatory layers. No stable RNA locus
    is asserted here.
