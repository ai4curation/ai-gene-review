id: Q88F25
gene_symbol: ligA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:PSEPK
  label: Psepk
description: LigA is the essential bacterial NAD-dependent DNA ligase. It uses NAD to adenylate and seal phosphodiester nicks between adjacent 5'-phosphate and 3'-hydroxyl DNA ends, completing Okazaki-fragment maturation during chromosome replication and also sealing intermediates generated during DNA repair.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct substrate-binding property of DNA ligase.
    action: ACCEPT
    reason: LigA recognizes nicked duplex DNA through multiple DNA-binding domains before phosphodiester-bond formation.
- term:
    id: GO:0003911
    label: DNA ligase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct core catalytic activity with the appropriate bacterial NAD cofactor specificity.
    action: ACCEPT
    reason: The reviewed UniProt record gives the NAD-dependent nick-sealing reaction and EC 6.5.1.2.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Appropriate localization for an intracellular bacterial DNA ligase.
    action: ACCEPT
    reason: LigA acts on chromosomal DNA in the cytosol/nucleoid and has no secretion or membrane-targeting features.
- term:
    id: GO:0006259
    label: DNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: True but too broad relative to replication and repair.
    action: MARK_AS_OVER_ANNOTATED
    reason: The specific DNA replication and DNA repair annotations better define the biological settings for nick sealing.
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct core process annotation.
    action: ACCEPT
    reason: LigA seals nicks left during lagging-strand maturation and is essential for chromosome replication.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct secondary biological role outside the focused replication module.
    action: KEEP_AS_NON_CORE
    reason: The reviewed UniProt record supports DNA repair as a genuine LigA role, while Okazaki-fragment sealing is the core module function.
core_functions:
- description: NAD-dependent sealing of phosphodiester nicks during lagging-strand maturation in bacterial chromosome replication.
