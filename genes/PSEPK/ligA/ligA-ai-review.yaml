    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosolic localization is compatible with chromosome replication and repair in bacteria.
    action: KEEP_AS_NON_CORE
    reason: Location does not distinguish LigA's direct nick-sealing function.
- term:
    id: GO:0006259
    label: DNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: DNA metabolic process is a broad ancestor of LigA's replication and repair roles.
    action: MARK_AS_OVER_ANNOTATED
    reason: DNA replication plus the exact NAD-dependent ligase activity provide the useful biological resolution.
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The target record states that LigA is essential for DNA replication.
    action: ACCEPT
    reason: Nick sealing by the replicative NAD-dependent ligase is a direct part of chromosome replication.
    supported_by:
    - reference_id: file:PSEPK/ligA/ligA-uniprot.txt
      supporting_text: "CC       reaction. It is essential for DNA replication and repair of damaged"
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LigA seals nicks in multiple repair pathways, but this broad term is less informative than its ligase activity and specific pathway roles.
    action: KEEP_AS_NON_CORE
    reason: Retain the true general repair context outside the core annotation set.
