    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LigA necessarily engages nicked DNA, but DNA binding alone does not express its sealing reaction.
    action: KEEP_AS_NON_CORE
    reason: Retain substrate binding as secondary to the exact NAD-dependent DNA ligase activity.
- term:
    id: GO:0003911
    label: DNA ligase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: LigA catalyzes NAD-dependent phosphodiester-bond formation between adjacent DNA ends.
    action: ACCEPT
    reason: The target UniProt function statement and LigA subfamily assignment directly support NAD-dependent DNA ligase activity.
    supported_by:
    - reference_id: file:PSEPK/ligA/ligA-uniprot.txt
      supporting_text: "CC   -!- FUNCTION: DNA ligase that catalyzes the formation of phosphodiester"
