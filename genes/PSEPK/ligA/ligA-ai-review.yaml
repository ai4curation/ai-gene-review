taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: LigA is the replicative NAD-dependent DNA ligase that seals single-strand nicks by forming phosphodiester bonds between adjacent 3-prime-hydroxyl and 5-prime-phosphate DNA ends. It completes DNA replication and multiple repair pathways, including BER.
