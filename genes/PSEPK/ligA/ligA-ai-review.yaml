description: LigA is the essential bacterial NAD-dependent DNA ligase. It uses NAD to adenylate and seal
  phosphodiester nicks between adjacent 5'-phosphate and 3'-hydroxyl DNA ends, completing Okazaki-fragment
  maturation during chromosome replication and also sealing intermediates generated during DNA repair.
