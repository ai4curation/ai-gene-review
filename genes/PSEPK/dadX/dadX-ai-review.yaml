id: Q88CB2
gene_symbol: dadX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DadX is an alanine-specific, pyridoxal-phosphate-dependent racemase that
  reversibly interconverts L-alanine and D-alanine. It is encoded beside dadA
  in a conserved catabolic locus, where D-alanine is proposed to be oxidized
  to pyruvate. DadX is the leading candidate for cytoplasmic D-alanine supply
  in KT2440, but a direct contribution to peptidoglycan synthesis has not been
  demonstrated.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The generic catalytic term is superseded by alanine racemase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008784 captures the experimentally established reaction.
      supported_by:
        - reference_id: PMID:23995642
          supporting_text: >-
            Conversely, the putative catabolic alanine racemase DadX showed narrow substrate specificity, clearly preferring only the alanine stereoisomers as the substrates.
