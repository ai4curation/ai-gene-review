core_functions:
  - description: >-
      Reversibly interconverts L-alanine and D-alanine with narrow substrate
      specificity. The role in the dadAX catabolic route is supported, while
      physiological supply of D-alanine to peptidoglycan remains unresolved.
    molecular_function:
      id: GO:0008784
      label: alanine racemase activity
    supported_by:
      - reference_id: PMID:23995642
        supporting_text: >-
          Conversely, the putative catabolic alanine racemase DadX showed narrow substrate specificity, clearly preferring only the alanine stereoisomers as the substrates.
proposed_new_terms: []
suggested_questions:
  - question: Does DadX provide the cytoplasmic D-alanine used for peptidoglycan synthesis in KT2440?
suggested_experiments:
  - description: >-
      Deplete or delete dadX and measure growth, peptidoglycan composition,
      intracellular D-alanine, and rescue by exogenous D-alanine; include
      isotope tracing from L-alanine into the terminal D-Ala-D-Ala moiety.
    experiment_type: genetics, metabolite rescue, peptidoglycan analysis, and isotope tracing
