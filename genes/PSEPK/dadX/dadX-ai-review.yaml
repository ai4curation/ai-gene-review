        - reference_id: file:PSEPK/dadX/dadX-uniprot.txt
          supporting_text: N6-(pyridoxal phosphate)lysine
  - term:
      id: GO:0030632
      label: D-alanine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: DadX forms D-alanine, but its physiological process assignment is unresolved.
      action: UNDECIDED
      reason: >-
        The reversible chemistry can produce D-alanine, whereas the characterized
        locus and literature frame DadX as catabolic. No dadX genetic, flux, or
        peptidoglycan experiment establishes cell-wall D-alanine supply, so this
        process annotation is not promoted into the core function.
      supported_by:
        - reference_id: PMID:23995642
          supporting_text: >-
            P. putida KT2440 catabolized the d-stereoisomers of lysine, phenylalanine, arginine, alanine, and hydroxyproline as the sole carbon and nitrogen sources.
        - reference_id: PMID:23995642
          supporting_text: >-
            However, DadX did show 6- and 9-fold higher k(cat)/K(m) values than Alr with l- and d-alanine, respectively.
