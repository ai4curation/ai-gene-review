  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasm is correct but general for this soluble ligase.
    action: MODIFY
    reason: >-
      Correct but general. The protein is a soluble ATP-grasp ligase with no
      signal peptide or transmembrane segment, so the specific descendant
      cytosol (GO:0005829) applies, matching the E. coli K-12 DdlA and DdlB
      reviews.
    proposed_replacement_terms:
      - id: GO:0005829
        label: cytosol
    supported_by:
