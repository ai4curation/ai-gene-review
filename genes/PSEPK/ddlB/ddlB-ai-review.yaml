id: Q88N74
gene_symbol: ddlB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DdlB is a cytoplasmic D-alanine-D-alanine ligase of Pseudomonas putida
  KT2440 and one of three annotated Ddl-family paralogs. It uses ATP and
  magnesium or manganese to form the D-Ala-D-Ala dipeptide incorporated by
  MurF into the peptidoglycan stem pentapeptide.
