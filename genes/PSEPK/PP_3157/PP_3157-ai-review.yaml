  review:
    summary: Exact activity supported by HisN equivalog membership and conservation of the HolPase-specific
      motifs.
    action: ACCEPT
    reason: 'PMID:28720084 defined six motifs from 165 HisN orthologs and validated them by complementation
      of a C. glutamicum hisN deletion: a homolog lacking the motif-5 signature failed to complement,
      whereas weakly similar homologs with the motifs did. PP_3157 scores 337.8 bits against TIGR02067
      (trusted cutoff 275.15) and has the motif-5 and motif-6 discriminating residues of HisN (RESULTS.md).
      This is the core molecular function; direct KT2440 biochemistry is still lacking.'
