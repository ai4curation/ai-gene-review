      reference_id: file:PSEPK/PP_3157/PP_3157-bioinformatics/RESULTS.md
      supporting_text: 'KT2440: proteins above the TIGR02067.1 trusted cutoff: tr|Q88I44|Q88I44_PSEPK.'
