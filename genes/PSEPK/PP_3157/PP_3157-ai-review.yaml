taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_3157 encodes an IMPase-like histidinol-phosphate phosphatase (HisN-type; EC 3.1.3.15)
  of Pseudomonas putida KT2440, predicted to hydrolyse L-histidinol phosphate to L-histidinol in the penultimate
  reaction of L-histidine biosynthesis. The 263-residue protein belongs to the metal-dependent inositol
  monophosphatase superfamily and is the only KT2440 protein above the trusted cutoff of the HisN family
  model TIGR02067. It carries the HisN-discriminating sequence motifs defined from experimentally validated
  HolPases, including the motif-5 arginine, glycine and aspartate with flanking aromatic residues and
  a non-glycine residue at the motif-6 discriminating position, which separate HisN enzymes from CysQ,
  SuhB and other IMPase-like proteins; KT2440 encodes a separate CysQ (PP_0261). KT2440 also encodes the
  unrelated HAD-family histidinol-phosphate phosphatase PP_5147. Neither protein has been assayed in KT2440,
  and their relative contributions in vivo are unknown.
existing_annotations:
- term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: HisN-family membership (TIGR02067 above trusted cutoff, all key HisN motifs) supports a catalytic
      role in histidine biosynthesis.
    action: ACCEPT
    reason: 'The previous UNDECIDED rested on the lack of a PP_3157 assay. A reproducible family analysis
      now resolves the family call: PP_3157 is the only KT2440 protein above the TIGR02067 trusted cutoff
      (an equivalog whose members are found only in histidine prototrophs lacking HAD or PHP HolPases
      of the described families), and it carries the motif-5 R/G/D with aromatic flanks and the motif-6
      non-Gly residue that PMID:28720084 showed to separate HolPase-active HisN enzymes from other IMPase-like
      proteins. The CysQ-named PANTHER subfamily (PTHR43200:SF6) is a naming artefact here: KT2440 CysQ
      is the separate TIGR01331 member PP_0261. The enzyme performs the dephosphorylation step of the
      pathway, so it participates in the process; flux sharing with PP_5147 remains open.'
    supported_by:
