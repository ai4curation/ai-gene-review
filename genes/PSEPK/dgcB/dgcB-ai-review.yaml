      record_section: ["CC:FUNCTION"]
      supporting_text: Probably transfers the electrons from N,N-dimethylglycine/sarcosine dehydrogenase
        (DMGDH) to the electron transfer flavoprotein (ETF) EtfA-EtfB (PubMed:32631860).
