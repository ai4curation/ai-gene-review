core_functions:
- description: >-
    Membrane-anchored iron-sulfur electron carrier inferred from its conserved ferredoxin motifs, full-length orthology
    to Csal_0991, and the dimethylglycine-catabolic locus. Native P. aeruginosa dgcB disruption blocks dimethylglycine
    consumption; Chromohalobacter genetics places the ortholog at the same step. Electron transfer is the supported
    family-level function, whereas DgcA as donor, ETF as acceptor, and their order have not been directly reconstituted.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
