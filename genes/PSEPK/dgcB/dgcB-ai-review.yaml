core_functions:
- description: >-
    Membrane-anchored 2[4Fe-4S] ferredoxin that accepts electrons from the DgcA
    dimethylglycine dehydrogenase and is proposed to pass them to the
    PP_0312/PP_0313 electron transfer flavoprotein, during dimethylglycine
    demethylation to sarcosine in glycine betaine catabolism.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
