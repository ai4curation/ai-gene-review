id: Q88R23
gene_symbol: dgcB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DgcB (PP_0311) is the membrane iron-sulfur subunit of the DgcAB
  dimethylglycine dehydrogenase system. Its five N-terminal transmembrane
  helices and C-terminal 4Fe-4S region couple the soluble flavin subunit DgcA to
  a membrane-associated electron-transfer pathway during conversion of
  dimethylglycine to sarcosine. Transfer from reduced DgcB to the adjacent ETF
  is inferred from synteny and the Chromohalobacter pathway model.
