  knowledge_gaps:
  - gap_statement: >-
      Electron transfer from DgcA to DgcB, and from reduced DgcB to the PP_0312/PP_0313 ETF, has not been measured
      for KT2440 or the Chromohalobacter orthologs in the cited primary studies. It is also unknown whether the
      five-helix DUF3483 membrane domain exchanges electrons with the quinone pool or only anchors the protein.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The route from dimethylglycine to the respiratory chain through
      DgcB and ETF is the assumed basis of the DgcAB system, but it has not been
      tested.
suggested_questions:
- question: Does the PP_0312/PP_0313 ETF heterodimer directly accept electrons from reduced DgcB, and where do
    the ETF electrons go next?
suggested_experiments:
- description: >-
    Reconstitute DgcA with DgcB in proteoliposomes, with and without the
    PP_0312/PP_0313 ETF and ubiquinone, and follow DgcB [4Fe-4S] reduction (EPR)
    and ETF reduction during dimethylglycine oxidation.
  experiment_type: in vitro reconstitution
