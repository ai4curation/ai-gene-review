- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: ISS
  original_reference_id: PMID:32631860
  qualifier: enables
  review:
    summary: >-
      DgcB is an inferred membrane-associated ferredoxin electron carrier; its proposed DgcA and ETF partners remain
      untested.
    action: NEW
    reason: >-
      GOA has no molecular function row for DgcB beyond iron-sulfur binding. Several lines support electron transfer
      as its activity, transferred by sequence similarity (ISS) from Csal_0991. The two proteins share 72% identity
      over their full length, conserve the [4Fe-4S] motifs, and lie in the same dehydrogenase-ferredoxin-etfB-etfA
      gene order. The reviewed Csal_0991 entry, curated from PMID:32631860, describes it as the electron carrier
      between the dimethylglycine dehydrogenase and EtfA-EtfB, and its gene is required for dimethylglycine degradation.
      In P. aeruginosa the dgcB ortholog (PA5399) is required for dimethylglycine-to-sarcosine conversion. Neither
      the donor nor acceptor step has been reconstituted for KT2440 or demonstrated directly for Csal_0991 in PMID:32631860.
      The primary measurements used dye-linked DdhC assays; the native relay appears as a proposed mechanism.
    supported_by:
