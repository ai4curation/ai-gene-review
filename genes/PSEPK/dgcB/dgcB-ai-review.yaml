    record_section: ["CC:FUNCTION"]
    supporting_text: Probably transfers the electrons from N,N-dimethylglycine/sarcosine dehydrogenase (DMGDH) to the electron transfer
      flavoprotein (ETF) EtfA-EtfB (PubMed:32631860).
  - reference_id: PMID:17951379
    supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other
      enzymes with demethylase activity, are required for the conversion of DMG to sarcosine
  - reference_id: file:PSEPK/dgcA/dgcA-bioinformatics/RESULTS.md
    supporting_text: DgcB keeps both cysteine motifs of Csal_0991
  knowledge_gaps:
  - gap_statement: >-
      Electron transfer from DgcA to DgcB, and from reduced DgcB to the
      PP_0312/PP_0313 ETF, has not been measured in KT2440 or in any other
      system. It is also unknown whether the five-helix DUF3483 membrane domain
      exchanges electrons with the quinone pool or only anchors the protein.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The route from dimethylglycine to the respiratory chain through
      DgcB and ETF is the assumed basis of the DgcAB system, but it has not been
      tested.
suggested_questions:
- question: Does the PP_0312/PP_0313 ETF heterodimer directly accept electrons from reduced DgcB, and where do the ETF electrons go next?
suggested_experiments:
- description: >-
    Reconstitute DgcA with DgcB in proteoliposomes, with and without the
    PP_0312/PP_0313 ETF and ubiquinone, and follow DgcB [4Fe-4S] reduction (EPR)
    and ETF reduction during dimethylglycine oxidation.
  experiment_type: in vitro reconstitution
