  label: Pseudomonas putida KT2440
description: >-
  DgcB (PP_0311) is a 650-residue membrane-anchored iron-sulfur protein of Pseudomonas putida KT2440. It has five
  N-terminal transmembrane helices, a DUF3483 (Csal_0991-like) region, and a cytoplasmic alpha-helical ferredoxin
  domain with two CxxCxxCxxxC [4Fe-4S] motifs and two cysteine-rich CCG domains. It is a full-length ortholog (72%
  identity) of the Chromohalobacter salexigens ferredoxin Csal_0991. By that orthology and its iron-sulfur architecture,
  DgcB is proposed to accept electrons from the dimethylglycine dehydrogenase flavoprotein DgcA (PP_0310) and is
  thought to pass them to the electron transfer flavoprotein encoded by the adjacent PP_0312/PP_0313 genes. This
  happens during dimethylglycine demethylation to sarcosine, a step of glycine betaine catabolism that needs the
  orthologous dgcAB genes in Pseudomonas aeruginosa. Electron transfer by the KT2440 protein has not been measured.
