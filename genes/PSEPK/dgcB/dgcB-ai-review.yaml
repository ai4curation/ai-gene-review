- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: ISS
  original_reference_id: PMID:32631860
  qualifier: enables
  review:
    summary: >-
      DgcB is the membrane-anchored ferredoxin that carries electrons from DgcA
      toward the pathway ETF, inferred from its Chromohalobacter ortholog
      Csal_0991.
    action: NEW
    reason: >-
      GOA has no molecular function row for DgcB beyond iron-sulfur binding.
      Several lines support electron transfer as its activity, transferred by
      sequence similarity (ISS) from Csal_0991. The two proteins share 72%
      identity over their full length, conserve the [4Fe-4S] motifs, and lie in
      the same dehydrogenase-ferredoxin-etfB-etfA gene order. The reviewed
      Csal_0991 entry, curated from PMID:32631860, describes it as the electron
      carrier between the dimethylglycine dehydrogenase and EtfA-EtfB, and its
      gene is required for dimethylglycine degradation. In P. aeruginosa the dgcB
      ortholog (PA5399) is required for dimethylglycine-to-sarcosine conversion.
      Transfer by the KT2440 protein has not been reconstituted.
    supported_by:
    - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Probably transfers the electrons from N,N-dimethylglycine/sarcosine dehydrogenase (DMGDH) to the electron transfer
        flavoprotein (ETF) EtfA-EtfB (PubMed:32631860).
    - reference_id: file:PSEPK/dgcA/dgcA-bioinformatics/RESULTS.md
      supporting_text: Q88R23 and
        Q1QYW0 share 72.2% identity over their full length
    - reference_id: PMID:17951379
      supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other
        enzymes with demethylase activity, are required for the conversion of DMG to sarcosine
- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: ISS
  original_reference_id: PMID:17951379
  qualifier: involved_in
  review:
    summary: >-
      As the electron acceptor of DgcA, DgcB takes part in the
      dimethylglycine-to-sarcosine step of glycine betaine catabolism, which
      needs its orthologs in P. aeruginosa and C. salexigens.
    action: NEW
    reason: >-
      In P. aeruginosa the dgcAB genes (PA5398-PA5399) are required for the
      dimethylglycine-to-sarcosine step of glycine betaine catabolism, shown by
      13C NMR tracing. In C. salexigens the dgcB ortholog csal_0991 is required
      for that step, and its mutant still grows on sarcosine and glycine. On the
      participation test, DgcB does part of the work of the step: it is the
      2[4Fe-4S] electron acceptor that reoxidizes DgcA in the EC 1.5.7.3
      reaction, much as ETF is for acyl-CoA dehydrogenases. GO:0031457 is defined
      as "The chemical reactions and pathways resulting in the breakdown of
      glycine betaine, N-trimethylglycine". GO has no dimethylglycine catabolic
      process term. The evidence code is ISS because the KT2440 gene has not been
      tested.
    supported_by:
    - reference_id: PMID:17951379
      supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other
        enzymes with demethylase activity, are required for the conversion of DMG to sarcosine
    - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Deletion mutant loses its ability to grow using DMG as the sole nitrogen source but is still capable of utilizing
        sarcosine and glycine as the sole nitrogen source.
