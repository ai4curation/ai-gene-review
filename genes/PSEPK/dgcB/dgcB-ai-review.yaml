- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: ISS
  original_reference_id: PMID:17951379
  qualifier: involved_in
  review:
    summary: >-
      DgcB is inferred to supply electron-carrier work in dimethylglycine catabolism, with native genetic support
      from P. aeruginosa.
    action: NEW
    reason: >-
      In P. aeruginosa the dgcAB genes (PA5398-PA5399) are required for the dimethylglycine-to-sarcosine step of
      glycine betaine catabolism, shown by 13C NMR tracing. In C. salexigens the dgcB ortholog csal_0991 is required
      for that step, and its mutant still grows on sarcosine and glycine. On the participation test, DgcB does part
      of the work of the step: its conserved 2[4Fe-4S] architecture supports redox-carrier work, with DgcA reoxidation
      proposed as the specific role, much as ETF is for acyl-CoA dehydrogenases. GO:0031457 is defined as "The chemical
      reactions and pathways resulting in the breakdown of glycine betaine, N-trimethylglycine". GO has no dimethylglycine
      catabolic process term. The evidence code is ISS because the KT2440 gene has not been tested.
    supported_by:
    - reference_id: PMID:17951379
      supporting_text: strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to
        genes that encode other enzymes with demethylase activity, are required for the conversion of DMG to
        sarcosine
