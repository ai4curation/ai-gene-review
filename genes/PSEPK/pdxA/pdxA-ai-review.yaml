      supporting_text: >-
        Reaction=4-(phosphooxy)-L-threonine + NAD(+) = 3-amino-2-oxopropyl phosphate + CO2
        + NADH; Xref=Rhea:RHEA:32275
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
      record_section:
