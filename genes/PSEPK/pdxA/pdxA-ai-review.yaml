- term:
    id: GO:0050570
    label: 4-hydroxythreonine-4-phosphate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the defining catalytic activity of PdxA.
    action: ACCEPT
    reason: >-
      GO:0050570 matches EC 1.1.1.262 and RHEA:32275 recorded on the entry by HAMAP MF_00536.
      Q88QT5 is in the PdxA family (IPR037510, TIGR00557, PTHR30004:SF5) and the deep-research
      alignment reports conservation of the catalytic and metal-binding residues of the crystallized
      E. coli enzyme, whose AHAP-forming activity was shown directly. No experimental study
      of PP_0402 itself exists.
    supported_by:
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
