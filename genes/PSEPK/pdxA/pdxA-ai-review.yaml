    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Mg2+ is one of the alternative divalent metal cofactors of PdxA.
    action: KEEP_AS_NON_CORE
    reason: >-
      HAMAP MF_00536 transfers the Zn2+/Mg2+/Co2+ cofactor alternatives established for the
      E. coli ortholog (crystal structure with Zn2+ bound by three histidines from both subunits);
      the metal-binding residues are conserved in Q88QT5. Metal binding is required for catalysis
      but is a cofactor property secondary to the defining dehydrogenase activity, so the
      row is kept as non-core, as for E. coli PdxA.
    supported_by:
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: >-
        Binds 1 divalent metal cation per subunit. Can use ions such as Zn(2+), Mg(2+) or
        Co(2+).
    - reference_id: PMID:12896974
      supporting_text: >-
        This divalent metal ion-dependent enzyme has a strict requirement for the phosphate
        ester form of the substrate HTP, but can utilize either NADP+ or NAD+ as redox cofactor.
