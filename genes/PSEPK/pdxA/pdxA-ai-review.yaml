id: Q88QT5
gene_symbol: pdxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PdxA (PP_0402) is the cytoplasmic NAD(P)+-dependent 4-hydroxythreonine-4-phosphate dehydrogenase
  (EC 1.1.1.262) of Pseudomonas putida KT2440. It oxidizes 4-(phosphooxy)-L-threonine to an
  unstable 2-amino-3-oxo intermediate that decarboxylates to 3-amino-2-oxopropyl phosphate,
  the fourth step of the DXP-dependent de novo pyridoxal 5'-phosphate (vitamin B6) pathway;
  PdxJ condenses this aminoketone with 1-deoxy-D-xylulose 5-phosphate to form pyridoxine 5'-phosphate.
  By orthology to the structurally characterized Escherichia coli enzyme it is a homodimer
  with an inter-subunit active site that binds one divalent metal ion (Zn2+, Mg2+ or Co2+).
