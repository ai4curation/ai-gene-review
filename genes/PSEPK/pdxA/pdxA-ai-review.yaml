suggested_questions:
- question: >-
    Is PP_0402 the only PdxA-family enzyme in KT2440, and is a pdxA deletion a pyridoxine
    auxotroph?
suggested_experiments:
- hypothesis: PP_0402 is required for de novo vitamin B6 synthesis in P. putida KT2440.
  description: >-
    Construct a clean PP_0402 deletion and test growth on minimal medium with and without
    pyridoxine; assay purified recombinant PP_0402 for HTP-dependent NAD(P)H formation.
