- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PdxA performs step 4 of the erythrose-derived pyridoxine 5'-phosphate branch.
    action: ACCEPT
    reason: >-
      GO has no 'pyridoxine 5'-phosphate biosynthetic process' term; GO:0008615 is the process
      used for the erythrose 4-phosphate/DXP branch that builds the pyridoxine ring, and PdxA
      catalyses step 4 of that branch (UniPathway UPA00244). The ring is made as PNP rather
      than free pyridoxine, so the term is used in its vitamin-B6-branch sense. Same action
      as on E. coli PdxA.
    supported_by:
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: >-
        PATHWAY: Cofactor biosynthesis; pyridoxine 5'-phosphate biosynthesis; pyridoxine 5'-phosphate
        from D-erythrose 4-phosphate: step 4/5.
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
      record_section:
      - DR:HAMAP
      supporting_text: HAMAP; MF_00536; PdxA; 1.
- term:
    id: GO:0042823
    label: pyridoxal 5'-phosphate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct but general; PdxA acts only in de novo PLP synthesis.
    action: MODIFY
    reason: >-
      Correct but general. PdxA acts only in de novo PLP synthesis (it makes the aminoketone
      PdxJ uses to build the ring) and has no salvage role, so the is_a child GO:0036001 'de
      novo' pyridoxal 5'-phosphate biosynthetic process states the pathway exactly. This replaces
      the earlier separate NEW row for GO:0036001, which this MODIFY now carries, and matches
      the E. coli PdxA review.
    proposed_replacement_terms:
    - id: GO:0036001
      label: '''de novo'' pyridoxal 5''-phosphate biosynthetic process'
    supported_by:
    - reference_id: file:PSEPK/pdxA/pdxA-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: >-
        PATHWAY: Cofactor biosynthesis; pyridoxine 5'-phosphate biosynthesis; pyridoxine 5'-phosphate
        from D-erythrose 4-phosphate: step 4/5.
    - reference_id: PMID:12896974
      supporting_text: >-
        The fourth step is catalyzed by 4-hydroxythreonine-4-phosphate dehydrogenase (PdxA,
        E.C. 1.1.1.262), which converts 4-hydroxy-l-threonine phosphate (HTP) to 3-amino-2-oxopropyl
        phosphate.
