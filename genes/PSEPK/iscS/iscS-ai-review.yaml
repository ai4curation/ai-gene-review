id: Q88PK8
gene_symbol: iscS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: IscS (PP_0842) is a PLP-dependent cysteine desulfurase that mobilizes sulfur from L-cysteine for iron-sulfur cluster biogenesis and other sulfur-transfer pathways. In the Isc system it supplies persulfide sulfur to the IscU scaffold.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: A cytoplasmic location is plausible for the soluble Isc machinery.
      action: KEEP_AS_NON_CORE
      reason: Localization is compatible but not a defining function and lacks direct KT2440 evidence.
  - term:
      id: GO:0030170
      label: pyridoxal phosphate binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: PLP is the conserved cofactor of IscS-family cysteine desulfurases.
      action: KEEP_AS_NON_CORE
      reason: The cofactor call is sound but ancillary to cysteine desulfurase activity.
      supported_by:
        - reference_id: file:PSEPK/iscS/iscS-uniprot.txt
          supporting_text: DR   HAMAP; MF_00331; Cys_desulf_IscS; 1.
  - term:
      id: GO:0031071
      label: cysteine desulfurase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining catalytic activity of IscS.
      action: ACCEPT
      reason: Reviewed UniProt and HAMAP MF_00331 identify Q88PK8 as EC 2.8.1.7 IscS.
      supported_by:
        - reference_id: file:PSEPK/iscS/iscS-uniprot.txt
          supporting_text: DE            EC=2.8.1.7 {ECO:0000255|HAMAP-Rule:MF_00331};
  - term:
      id: GO:0044571
      label: '[2Fe-2S] cluster assembly'
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Sulfur mobilization by IscS is an upstream step in Isc cluster assembly.
      action: ACCEPT
      reason: The reviewed record assigns IscS to this process and the protein is encoded with iscU and the dedicated transfer machinery.
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Q88PK8 can transiently share cluster ligation with IscU through its catalytic persulfide cysteine.
      action: KEEP_AS_NON_CORE
      reason: >-
        The reviewed record supports transient 2Fe-2S ligation during sulfur
        transfer, but cluster binding is mechanistic context rather than the
        defining cysteine-desulfurase function.
      supported_by:
        - reference_id: file:PSEPK/iscS/iscS-deep-research-openscientist.md
          supporting_text: 'Cys328 additionally ligates a [2Fe–2S] cluster "via persulfide group" as a "ligand shared with IscU,"'
references:
  - id: GO_REF:0000104
    title: Electronic Gene Ontology annotations created by transferring manual GO annotations between related proteins based on shared sequence features
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/iscS/iscS-uniprot.txt
    title: UniProtKB entry for iscS (Q88PK8)
    findings:
      - statement: Reviewed HAMAP annotation assigns Q88PK8 as the PLP-dependent IscS cysteine desulfurase.
  - id: file:PSEPK/iscS/iscS-deep-research-openscientist.md
    title: OpenScientist research report for iscS (Q88PK8)
    findings:
      - statement: >-
          The report supports PLP-dependent sulfur mobilization, transfer to
          IscU, and transient shared cluster ligation while noting the absence
          of direct KT2440 enzymology.
core_functions:
  - description: Mobilizes sulfur from L-cysteine and supplies it to the IscU scaffold during Fe-S cluster assembly.
    molecular_function:
      id: GO:0031071
      label: cysteine desulfurase activity
    directly_involved_in:
      - id: GO:0044571
        label: '[2Fe-2S] cluster assembly'
    supported_by:
      - reference_id: file:PSEPK/iscS/iscS-uniprot.txt
        supporting_text: 'DE   RecName: Full=Cysteine desulfurase IscS {ECO:0000255|HAMAP-Rule:MF_00331};'
      - reference_id: file:PSEPK/iscS/iscS-deep-research-openscientist.md
        supporting_text: IscS is a **homodimeric, PLP-dependent L-cysteine desulfurase (EC 2.8.1.7)**
    knowledge_gaps:
      - gap_statement: Sulfur-transfer partners and pathway allocation have not been measured directly in KT2440.
        significance: IscS can supply several sulfur-utilization pathways, so operon context does not establish exclusive flux to IscU.
proposed_new_terms: []
suggested_questions:
  - question: How is Q88PK8 sulfur flux partitioned between IscU and other sulfur acceptors in KT2440?
suggested_experiments:
  - description: Reconstitute sulfur transfer from Q88PK8 to Q88PK7 and quantify persulfide transfer and cluster assembly.
