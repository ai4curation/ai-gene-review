taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: IscS is the cytoplasmic pyridoxal-phosphate-dependent cysteine desulfurase of Pseudomonas
  putida KT2440. It converts L-cysteine to L-alanine while forming an enzyme-bound persulfide, which supplies
  sulfur to acceptors involved in iron-sulfur cluster assembly, tRNA thiolation and cofactor biosynthesis.
  IscU is its cluster-assembly scaffold partner; sulfur allocation among the different acceptor pathways
  is not restricted to the Isc locus.
