- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: A curated shared ligand is plausible, but native target cluster occupancy is unresolved.
    action: UNDECIDED
    reason: The HAMAP-derived target binding feature describes a persulfide-associated ligand shared with
      IscU. However, the structural example discussed in PMID36605734 is an Archaeoglobus fulgidus IscS-IscU(D35A)
      complex with a modified scaffold. This establishes the possibility of persulfide coordination, not
      native KT2440 IscS cluster occupancy. Bacterial cluster-containing IscSU intermediates do not by
      themselves identify a persulfide ligand on IscS. Retain uncertainty about the specific binding claim
      rather than rejecting it because an intermediate is transient or accepting altered-complex structure
      as a target assay.
    supported_by:
    - reference_id: file:PSEPK/iscS/iscS-uniprot.txt
      record_section:
      - FT:BINDING
      supporting_text: ligand shared with IscU
    - reference_id: PMID:36605734
      supporting_text: indicates that persulfide coordination of iron at the cluster site is possible.
