id: Q88PK8
gene_symbol: iscS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  IscS is a pyridoxal-phosphate-dependent cysteine desulfurase that mobilizes
  sulfur from cysteine for delivery to multiple acceptor pathways, including
  iron-sulfur cluster assembly, cofactor biosynthesis, and tRNA thiolation. In
  the MnmA branch, IscS supplies sulfur upstream of the Tus carrier relay.
existing_annotations:
  - term: {id: "GO:0005737", label: cytoplasm}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: IscS is a soluble bacterial sulfur-mobilization enzyme.
      action: ACCEPT
      reason: The curated UniProt record places IscS in the cytoplasm.
  - term: {id: "GO:0030170", label: pyridoxal phosphate binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: PLP is the catalytic cofactor of IscS-family cysteine desulfurases.
      action: ACCEPT
      reason: The IscS UniProt record and conserved family assignment support PLP dependence.
  - term: {id: "GO:0031071", label: cysteine desulfurase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the direct catalytic function of IscS.
      action: ACCEPT
      reason: UniProt assigns EC 2.8.1.7 and describes sulfur removal from cysteine.
  - term: {id: "GO:0044571", label: '[2Fe-2S] cluster assembly'}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: IscS supplies sulfur to IscU during iron-sulfur cluster assembly.
      action: ACCEPT
      reason: This is one established output branch of the multifunctional sulfur donor.
  - term: {id: "GO:0051537", label: '2 iron, 2 sulfur cluster binding'}
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: The record supports sulfur donation to Fe-S assembly, not an Fe-S cofactor bound by IscS itself.
      action: REMOVE
      reason: This appears to conflate participation in Fe-S biogenesis with cluster binding by the enzyme.
  - term: {id: "GO:0002143", label: tRNA wobble position uridine thiolation}
    evidence_type: TAS
    original_reference_id: file:modules/bacterial_mnma_trna_thiolation.yaml
    qualifier: involved_in
    review:
      summary: IscS supplies the sulfur that enters the Tus relay for U34 thiolation.
      action: NEW
      reason: The reviewed UniProt record identifies tRNA modification as an IscS sulfur-delivery branch.
