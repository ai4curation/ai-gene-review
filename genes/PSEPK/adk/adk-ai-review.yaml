  qualifier: enables
  review:
    summary: Correct but broader than AMP kinase activity.
    action: MODIFY
    reason: >-
      Adk is specifically an adenylate kinase rather than an unspecified kinase
      acting on a nucleobase-containing compound.
    proposed_replacement_terms:
      - id: GO:0004017
        label: AMP kinase activity
- term:
    id: GO:0044209
    label: AMP salvage
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct physiological pathway assignment.
    action: ACCEPT
    reason: >-
      The reversible adenylate kinase reaction can regenerate AMP from ADP and
      is assigned to AMP salvage in the exact UniProt record.
