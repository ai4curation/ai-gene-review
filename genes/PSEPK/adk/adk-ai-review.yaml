id: P0A136
gene_symbol: adk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Adk (PP_1506) is the soluble adenylate kinase that reversibly transfers a
  phosphoryl group between ATP and AMP to form two ADP molecules. This reaction
  interconverts adenine nucleotide phosphate states and contributes to cellular
  energy-charge homeostasis.
existing_annotations:
- term:
    id: GO:0004017
    label: AMP kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific molecular function.
    action: ACCEPT
    reason: >-
      UniProt assigns EC 2.7.4.3 and RHEA:12973 for the reversible AMP plus ATP
      to two ADP reaction.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct substrate-binding annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP is a substrate of adenylate kinase, but ATP binding is less informative
      than the enzyme-specific phosphotransferase activity.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
