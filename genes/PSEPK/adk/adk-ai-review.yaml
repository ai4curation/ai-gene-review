    reason: UniProt explicitly assigns adenylate kinase to the cytoplasm.
- term:
    id: GO:0016776
    label: phosphotransferase activity, phosphate group as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but broader than AMP kinase activity.
    action: MODIFY
    reason: >-
      The exact adenylate kinase reaction is represented by GO:0004017.
    proposed_replacement_terms:
      - id: GO:0004017
        label: AMP kinase activity
- term:
    id: GO:0019205
    label: nucleobase-containing compound kinase activity
  evidence_type: IEA
