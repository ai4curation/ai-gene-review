  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_1451 is a small Sec-exported YafK/LdtF-family cysteine hydrolase predicted
  to act in the periplasm. It is predicted to hydrolyze the amide bond that
  covalently links OprI-like outer-membrane lipoproteins to peptidoglycan,
  reversing the tether-forming reaction of an ErfK-family
  L,D-transpeptidase.
