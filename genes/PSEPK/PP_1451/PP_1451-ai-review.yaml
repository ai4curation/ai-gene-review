references:
- id: file:PSEPK/PP_1451/PP_1451-hypotheses/kgap-pp1451-tether-hydrolase/openscientist.md
  title: OpenScientist test of PP_1451 as a peptidoglycan-lipoprotein tether hydrolase and of the KT2440 transpeptidase inventory
  findings:
  - statement: >-
      The catalytic site is competent and carries the hydrolase-diagnostic alanine, the substrate lipoprotein exists in KT2440 with its attachment lysine intact, and three independent censuses confirm the genome has no YcbB-type 3-to-3 cross-linking L,D-transpeptidase; but a competent YkuD-fold hydrolase site does not say which amide bond is cut, and the two most activity-determining specificity residues of the characterised enzyme are not conserved.
    supporting_text: >-
      Tether hydrolysis is the most likely activity, and it is not the only one the sequence permits.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified locally against Q88MW7: 184 residues, the catalytic Cys159 and His137, the hydrolase-diagnostic Ala161, and the two non-conserved specificity positions Phe106 and Met133 where the characterised enzyme has tyrosines, together with the YkuD Pfam domain, a signal peptide at 1..18 and protein-existence level 4. Not verified: the structural superposition and its distances, the measured Cys-His spacings, the three proteome censuses and their scores, the PF20142 absence call, the OprI scan and PP_2322 identity, the alanine-scanning values, and the P. aeruginosa ortholog assignments. The run confirms the stronger half of the inventory gap and declines its weaker form, that KT2440 makes no 3-to-3 cross-links at all. No annotation action was changed.
