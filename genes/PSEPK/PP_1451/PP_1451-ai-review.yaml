proposed_new_terms:
- proposed_name: peptidoglycan-protein cross-link hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond that covalently links a
    protein, such as a Braun-lipoprotein-like outer-membrane lipoprotein, to a
    peptide stem of peptidoglycan.
  justification: >-
    GO:0018104 represents formation of a peptidoglycan-protein cross-link, but
    no molecular-function term identifies the reverse hydrolysis reaction.
    Generic carboxypeptidase activity does not specify the protein-peptidoglycan
    tether substrate.
  proposed_parent:
    id: GO:0016787
    label: hydrolase activity
knowledge_gaps:
- gap_statement: PP_1451 tether-hydrolase activity and substrate specificity have not been tested directly in KT2440.
