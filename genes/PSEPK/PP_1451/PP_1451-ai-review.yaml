proposed_new_terms:
- proposed_name: peptidoglycan-protein cross-link hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond that covalently links a
    protein, such as a Braun-lipoprotein-like outer-membrane lipoprotein, to a
    peptide stem of peptidoglycan.
  justification: >-
    GO:0018104 represents formation of a peptidoglycan-protein cross-link, but
    no molecular-function term identifies the reverse hydrolysis reaction.
    Generic carboxypeptidase activity does not specify the protein-peptidoglycan
    tether substrate.
  proposed_parent:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
knowledge_gaps:
- gap_statement: PP_1451 tether-hydrolase activity and substrate specificity have not been tested directly in KT2440.
  status: OPEN
  gap_kind: [BIOLOGY, CURATION]
  significance: The assignment is supported by exact subfamily correspondence to tentatively assigned Pseudomonas LdtPae3 and experimentally characterized E. coli DpaA but remains inferred for KT2440.
- gap_statement: >-
    The pathway-level OpenScientist report classified PP_1451 as an uncertain
    release candidate because its short-range sequence comparisons did not
    recover E. coli DpaA.
  status: RESOLVED
  gap_kind: [BIOLOGY, CURATION]
  significance: >-
    Exact PTHR36699:SF1 membership places PP_1451 with DpaA/P0AA99 and the
    PA14 LdtPae3 protein A0A0H2ZF55; this family and PAINT evidence is more
    discriminating than the report's k-mer and local-alignment metrics.
