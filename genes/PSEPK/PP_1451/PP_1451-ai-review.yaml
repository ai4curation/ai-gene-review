- id: PMID:37255442
  title: Characterization of Pseudomonas aeruginosa l,d-Transpeptidases and Evaluation of Their Role in Peptidoglycan Adaptation to Biofilm Growth.
  findings:
  - statement: Pseudomonas LdtPae3 is tentatively assigned as a peptidoglycan-OprI tether hydrolase.
    supporting_text: The function of LdtPae3 was tentatively assigned to the release of OprI based on both the absence of detectable amide bond-forming activity (formation of 3→3 and tripeptide→ OprI bonds) and the close similarity between LdtPae3 and E. coli hydrolase YafK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; LdtPae3 hydrolysis is explicitly tentative, while transfer to PP_1451 additionally uses exact PANTHER-subfamily correspondence and direct E. coli DpaA evidence.
- id: PMID:33941679
  title: Cleavage of Braun's lipoprotein Lpp from the bacterial peptidoglycan by a paralog of l,d-transpeptidases, LdtF.
  full_text_unavailable: true
  findings:
  - statement: E. coli LdtF/YafK is a murein endopeptidase that cleaves Lpp from peptidoglycan.
    supporting_text: Here, using genetic and biochemical approaches, we show that LdtF (formerly yafK), a newly identified paralog of l,d-transpeptidases in E. coli, is a murein hydrolytic enzyme that catalyzes cleavage of Lpp from the PG sacculus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract verified; directly establishes the activity of the experimental PTHR36699:SF1 exemplar.
- id: PMID:33947763
  title: DpaA Detaches Braun's Lipoprotein from Peptidoglycan.
  findings:
  - statement: E. coli DpaA/LdtF hydrolyzes the Lpp-peptidoglycan linkage.
    supporting_text: We now show that LdtF hydrolyzes the Lpp-peptidoglycan linkage, detaching Lpp from peptidoglycan, and have renamed LdtF to peptidoglycan meso-diaminopimelic acid protein amidase A (DpaA).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; directly establishes the activity of DpaA/P0AA99, the reviewed PTHR36699:SF1 exemplar.
