id: Q88MW7
gene_symbol: PP_1451
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_1451 is a small Sec-exported YafK/LdtF-family cysteine hydrolase predicted
  to act in the periplasm. Exact PANTHER-subfamily correspondence to
  Pseudomonas aeruginosa LdtPae3 supports hydrolysis of the amide bond that
  covalently links OprI-like outer-membrane lipoproteins to peptidoglycan. This
  reverses the tether-forming reaction of an ErfK-family L,D-transpeptidase;
  the substrate-specific assignment remains an orthology inference for KT2440.
