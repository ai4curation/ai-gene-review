proposed_new_terms:
- proposed_name: peptidoglycan-protein cross-link hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond that covalently links a
    protein, such as a Braun-lipoprotein-like outer-membrane lipoprotein, to a
    peptide stem of peptidoglycan.
  justification: >-
    GO:0018104 represents formation of a peptidoglycan-protein cross-link, but
    no molecular-function term identifies the reverse hydrolysis reaction.
    Generic carboxypeptidase activity does not specify the protein-peptidoglycan
    tether substrate.
  proposed_parent:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
knowledge_gaps:
- gap_statement: PP_1451 tether-hydrolase activity and substrate specificity have not been tested directly in KT2440.
  status: NARROWING
  gap_kind: [BIOLOGY, CURATION]
  significance: The assignment is supported by exact subfamily correspondence to tentatively assigned Pseudomonas LdtPae3 and experimentally characterized E. coli DpaA but remains inferred for KT2440.
  boundary: >-
    An OpenScientist run (kgap-pp1451-tether-hydrolase) finds the catalytic site competent and tether hydrolysis the best-supported activity, while stating plainly that sequence cannot say which amide bond is cut. Structural superposition of the characterised E. coli DpaA onto the PP_1451 model, 126 aligned pairs at 1.56 Angstrom over a 118-residue core, places the catalytic nucleophile on Cys159 at 0.97 Angstrom, the proton donor on His137 at 1.04, and the DpaA-diagnostic alanine on Ala161 at 0.95; the cysteine-histidine spacing measured from coordinates is 4.05 Angstrom here against 4.32 in DpaA. All three positions are confirmed in the local Q88MW7 record, which is 184 residues with the YkuD Pfam domain and a signal peptide at 1..18, consistent with periplasmic placement. The alanine two positions after the cysteine is the residue that separates hydrolases from transpeptidases in this family, and PP_1451 carries the hydrolase form. The substrate exists in the organism: a scan of all 5,527 KT2440 proteins against P. aeruginosa OprI returns a single hit far above background, PP_2322 at 94.0 per cent identity, with the lipobox cysteine and the peptidoglycan attachment lysine both conserved. The limit is explicit and belongs in this gap. A competent cysteine-histidine pair with alanine at the diagnostic position identifies a YkuD-fold hydrolase but does not say which bond it cuts; MEROPS places DpaA-like proteins in the same subfamily as L,D-carboxypeptidases of Helicobacter and Campylobacter, and E. coli LdtF itself also acts as a glycine-specific carboxypeptidase and as an L,D-endopeptidase on transpeptidase products. Two caveats weaken the specificity claim further. Of the six non-catalytic positions alanine scanning tested in DpaA, the two whose mutation cost the most activity, at 0.7 and 4 per cent of wild type, are precisely the two PP_1451 does not conserve, carrying Phe106 and Met133 instead, both confirmed locally. And the closest characterised ortholog, at 57.1 per cent identity, was never purified in soluble form, its deletion changed no muropeptide and its hydrolase assignment was made by exclusion, while the only measured hydrolase biochemistry in the group sits on E. coli DpaA at 29.0 per cent identity. The call therefore runs through two inferences, each reasonable, neither measured in any Pseudomonas protein, so the specificity of PP_1451 should be treated as unmeasured rather than assumed identical to DpaA.
  provenance:
  - reference_id: file:PSEPK/PP_1451/PP_1451-hypotheses/kgap-pp1451-tether-hydrolase/openscientist.md
    supporting_text: >-
      A competent Cys-His pair with Ala at Cys+2 identifies a YkuD-fold hydrolase. It does not say which amide bond is cut.
- gap_statement: >-
    The pathway-level report classified PP_1451 as an uncertain release
    candidate, while the PP_2320 gene-level report instead called PP_1451 a
    short LdtPae1-clade crosslinking candidate; both conclusions relied on
    short-range sequence comparisons that did not recover E. coli DpaA.
  status: RESOLVED
  gap_kind: [BIOLOGY, CURATION]
  significance: >-
    Exact PTHR36699:SF1 membership places PP_1451 with DpaA/P0AA99 and the
    PA14 LdtPae3 protein A0A0H2ZF55; this family and PAINT evidence is more
    discriminating than the report's k-mer and local-alignment metrics.
- gap_statement: KT2440 may lack a dedicated 3-to-3 peptidoglycan-crosslinking L,D-transpeptidase if PP_2320 anchors OprI and PP_1451 releases the tether.
  status: NARROWING
  gap_kind: [BIOLOGY]
  significance: This is a testable genome-level consequence of assigning the organism's two YkuD-family proteins to tether writing and erasing rather than 3-to-3 crosslink formation.
  boundary: >-
    The same OpenScientist run (kgap-pp1451-tether-hydrolase) confirms the stronger half of this proposal and declines the weaker half. Three independent censuses of the KT2440 reference proteome agree that the genome carries exactly two YkuD-family proteins, PP_1451 and PP_2320, with no YcbB/LdtD-type 3-to-3 cross-linking enzyme above background: the best YcbB-like hit anywhere scores 64 against a background of 64, 60, 56, 55 and 54 for unrelated proteins, the YcbB-specific accessory domain PF20142 is absent, and there is no ortholog of the single L,D-transpeptidase that gene deletion showed to be the only peptidoglycan cross-linker in P. aeruginosa. So KT2440 does lack a dedicated 3-to-3 cross-linking L,D-transpeptidase, which is what this gap proposed. The weaker form, that KT2440 therefore makes no 3-to-3 cross-links at all, is not established, because the one L,D-transpeptidase it does carry, PP_2320, was not assignable against E. coli paralogues alone and would have to cover whichever such reactions occur. The run also reports that the hydrolase never occurs without a transpeptidase across the genomes surveyed, which is consistent with the pairing this review proposes but does not by itself assign either enzyme's reaction.
  provenance:
  - reference_id: file:PSEPK/PP_1451/PP_1451-hypotheses/kgap-pp1451-tether-hydrolase/openscientist.md
    supporting_text: >-
      Three methods agree the genome has exactly two YkuD proteins.
