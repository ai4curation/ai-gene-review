      to the dephosphorylation activity of CheZ.
proposed_new_terms: []
suggested_questions:
- question: Does KT2440 CheZ localize to polar chemoreceptor arrays, and if so
    through which partner, given that P. putida has no CheA-short?
- question: Which of the KT2440 CheY paralogs are substrates of CheZ (PP_4339)?
suggested_experiments:
- description: Construct a PP_4339 deletion and measure swimming reversal
    frequency, soft-agar spreading and capillary chemotaxis, with
    complementation by wild-type and DXXXQ-motif mutant alleles.
  hypothesis: Loss of CheZ phosphatase activity raises CheY-P and causes a
    hyper-reversal, chemotaxis-defective phenotype.
  experiment_type: mutant phenotyping
- description: Measure CheY-P dephosphorylation rates with purified KT2440 CheZ
    and each CheY paralog.
  hypothesis: CheZ selectively accelerates dephosphorylation of the
    chemotaxis CheY (PP_4340).
  experiment_type: in vitro phosphatase assay
