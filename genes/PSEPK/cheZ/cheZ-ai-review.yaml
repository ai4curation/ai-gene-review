- term:
    id: GO:0009288
    label: bacterial-type flagellum
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: >-
      CheZ is a cytoplasmic CheY-P phosphatase, not a component of the
      flagellum.
    action: REMOVE
    reason: >-
      The row comes from the InterPro2GO mapping of IPR007439
      (Chemotax_Pase_CheZ) to GO:0009288. CheZ-family phosphatases are soluble
      and, where localized, sit at chemoreceptor arrays (E. coli, via CheA-short)
      or at a cell pole through other partners (H. pylori ChePep); they are not
      part of the filament, hook or basal body. The mapping is wrong for the
      whole family, consistent with the E. coli CheZ review.
    supported_by:
    - reference_id: file:PSEPK/cheZ/cheZ-deep-research-falcon.md
      supporting_text: >-
        In *E. coli*, CheZ localizes to the chemotaxis signaling cluster via
        interaction with CheA/CheA-short (CheAs).
    - reference_id: file:PSEPK/cheZ/cheZ-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR007439
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0009288
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        InterPro's interpro2go file maps IPR007439 (Chemotax_Pase_CheZ) to
        GO:0009288 bacterial-type flagellum, which GOA applies by IEA
        (GO_REF:0000002) to every CheZ, including P. putida KT2440 Q88EW3. CheZ
        is a cytoplasmic CheY-P phosphatase that localizes to chemoreceptor
        arrays, not a flagellar component; the mapping should be removed (the
        same entry's GO:0050920 regulation of chemotaxis mapping is appropriate).
- term:
    id: GO:0050920
    label: regulation of chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      CheZ regulates chemotaxis by dephosphorylating CheY-P to terminate and
      reset the signaling output.
    action: ACCEPT
    reason: >-
      Controlling the level of CheY-P, and with it the rate of direction
      changes, is the core biological role of CheZ. In KT2440 CheZ is encoded in
      the swimming chemotaxis cluster and the genome analysis states that CheY
      activity is regulated by CheZ.
    supported_by:
    - reference_id: file:PSEPK/cheZ/cheZ-deep-research-falcon.md
      supporting_text: >-
        In KT2440, this canonical relationship is explicitly stated: **“The
        activity of the transducer CheY is regulated by the phosphatase CheZ.”**
    - reference_id: file:PSEPK/cheZ/cheZ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        FUNCTION: Plays an important role in bacterial chemotaxis signal
        transduction pathway by accelerating the dephosphorylation of
        phosphorylated CheY (CheY-P).
    - reference_id: PMID:40197389
      supporting_text: >-
        the response regulator CheY and the phosphatase CheZ (two proteins known
        to be associated with CheA) also showed high Log2(fold change) values
core_functions:
- description: >-
    Acts as the chemotaxis signal-terminating phosphatase, accelerating dephosphorylation of the
    phosphorylated response regulator CheY (CheY-P) to reset the chemotaxis signaling output and
    regulate flagellar motor switching. The CheY-P substrate assignment is supported by CheZ
    family conservation and E. coli structural/catalytic experiments; direct substrate-turnover
    measurements for KT2440 PP_4339 were not found.
