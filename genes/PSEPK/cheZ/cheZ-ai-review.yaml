status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  CheZ (PP_4339) is the chemotaxis signal-terminating phosphatase of Pseudomonas
  putida KT2440. It accelerates the dephosphorylation of the phosphorylated
  response regulator CheY (CheY-P), the diffusible output of the chemotaxis
  phosphorelay. By lowering CheY-P levels, CheZ resets the pathway after
  stimulation and sets how much phosphorylated CheY reaches the flagellar motor,
  tuning the balance between runs and direction changes. The protein belongs to
  the CheZ family (Pfam PF04344; InterPro IPR007439) of response-regulator
  aspartyl-phosphate phosphatases, which share a conserved DXXXQ catalytic motif
  and a C-terminal CheY-P binding segment. CheZ is a soluble cytoplasmic
  homodimer; in E. coli and other bacteria it is enriched at chemoreceptor
  arrays through interaction with CheA. In KT2440 the gene lies between cheY and
  cheA2 in a cheYZA cluster of the flagellar/chemotaxis gene region, and CheZ
  co-purifies with CheA from KT2440 cell extracts.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      CheZ is a CheY-P (aspartyl-phosphate) phosphatase; catalytic activity is
      correct but is the root of the catalytic branch.
    action: MODIFY
    reason: >-
      True but general. The specific activity supported for the CheZ family is dephosphorylation
      of a phosphorylated protein (CheY-P), which is GO:0004721 phosphoprotein phosphatase
      activity ("a phosphoprotein + H2O = a protein + phosphate"), an is_a descendant of
      catalytic activity and the module-level activity of CheZ. Current QuickGO searches for
      CheY and phosphoaspartate did not identify a more specific activity term. PMID:12080332
      establishes direct CheZ contribution to the CheY active site in E. coli; this supports
      substrate specificity by family inference, not broad dephosphorylation of arbitrary
      response regulators.
    proposed_replacement_terms:
    - id: GO:0004721
      label: phosphoprotein phosphatase activity
    supported_by:
    - reference_id: file:PSEPK/cheZ/cheZ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        FUNCTION: Plays an important role in bacterial chemotaxis signal
        transduction pathway by accelerating the dephosphorylation of
        phosphorylated CheY (CheY-P).
    - reference_id: file:PSEPK/cheZ/cheZ-uniprot.txt
      record_section: ["FT:SITE"]
      supporting_text: SITE 181 /note="Enhances dephosphorylation of CheY-P"
    - reference_id: file:PSEPK/cheZ/cheZ-deep-research-falcon.md
      supporting_text: >-
        CheZ-family proteins share a conserved **DXXXQ** catalytic motif.
        Multiple experimental systems demonstrate that the corresponding Asp/Gln
        residues are required for phosphatase activity
