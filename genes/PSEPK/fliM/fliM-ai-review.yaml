taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FliM (PP_4358) is the flagellar motor switch protein of the C ring of the polar flagella
  of Pseudomonas putida KT2440. It has an N-terminal region carrying the conserved CheY-P-binding motif,
  a middle FliM domain and a C-terminal FliN-like (SpoA) domain, and belongs to the FliM family (PIRSF002888,
  TIGR01397). By homology with the E. coli and Salmonella motors, FliM forms 1:3 complexes with FliN that
  bind the FliG ring through one-to-one FliG-FliM contacts, building the wall of the cytoplasmic C ring
  that hangs from the MS ring at the base of the basal body. FliM is the primary docking site for the
  phosphorylated response regulator CheY-P; CheY-P binding remodels FliM-FliM and FliM-FliN contacts and
  is relayed through FliG to the stator interface, switching the direction of motor rotation. In KT2440
  this switching underlies the run-reverse-turn swimming pattern by which chemotactic signals control
  polar flagellar motility.
