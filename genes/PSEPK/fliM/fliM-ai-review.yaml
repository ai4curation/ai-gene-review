  review:
    summary: InterPro2GO mapping from the FliM family signature. The GO definition of cytoskeletal motor
      activity covers generation of torque for rotation of a flagellum, but in the flagellar motor torque
      is generated at the stator-rotor interface between MotA and the C-terminal torque helix of FliG,
      not by FliM.
    action: MODIFY
    reason: 'The essence (FliM is a component of the flagellar motor) is sound, but the activity FliM
      itself contributes is structural and regulatory: it forms the C ring wall with FliN and FliG and
      binds CheY-P to switch rotation direction. Torque is generated by stator units (MotA/MotB, or MotC/MotD
      in P. putida) acting on the FliG torque helix. The row is therefore re-typed to the subunit''s own
      activity, structural molecule activity (GO:0005198), which is also the complex-level activity assigned
      to the C ring switch module. This is a lateral correction, not a refinement. The starting motor
      term includes electrochemical rotation; the replacement is chosen to describe this subunit’s demonstrated
      structural switch role, not because flagellar motors fall outside GO0003774.'
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    supported_by:
