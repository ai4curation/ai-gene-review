- id: PMID:31452860
  title: Directional Switching Mechanism of the Bacterial Flagellar Motor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text review of the FliG/FliM/FliN C ring and CheY-P switching in E. coli, Salmonella
      and Thermotoga; ortholog/family evidence for KT2440 FliM.
  findings:
  - statement: FliM forms FliM1/FliN3 complexes that bind FliG to build the C ring wall.
    supporting_text: FliM and FliN together form the FliM1/FliN3 complex consisting of one copy of FliM
      and three copies of FliN [17], and the FliM1/FliN3 complex binds to the FliG ring structure through
      a one-to-one interaction between FliG and FliM to form the continuous C ring wall
  - statement: The FliM N-terminus binds CheY-P.
    supporting_text: FliMN contains a well conserved LSQXEIDALL sequence, which is responsible for the
      interaction with CheY-P [33].
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: KT2440 stator study; used here only for the statement that P. putida does not swarm
      with flagella (cited from earlier work, ref. 16).
  findings:
  - statement: KT2440 FliC S267C background distinguishes fluid swimming and semisolid spreading; these
      are not automatically flagellum-dependent surface swarming.
    supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and is lophotrichously
      flagellated, having multiple flagella at one cell pole (17).
