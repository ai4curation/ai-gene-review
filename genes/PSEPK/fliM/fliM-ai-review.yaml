suggested_questions:
- question: In the lophotrichous KT2440 cell, do all polar motors share a common CheY-P sensitivity, and
    how does FliM-CheY-P binding coordinate reversal of the flagellar bundle into the wrapped mode?
suggested_experiments:
- hypothesis: FliM is required for flagellar rotation and direction switching in KT2440.
  description: Construct an in-frame fliM deletion and CheY-P-binding-motif point mutants, then measure
    swimming, tethered-cell rotation bias and wrapped-mode frequency, and test polar FliM-fluorescent-protein
    foci for exchange in response to attractant addition.
  experiment_type: genetics and single-cell motility imaging
