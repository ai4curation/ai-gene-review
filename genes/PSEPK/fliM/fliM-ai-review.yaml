- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002408987
  review:
    summary: FliM supports flagellar motility, but the transferred swarming-specific claim is not established
      in KT2440.
    action: MARK_AS_OVER_ANNOTATED
    reason: This electronic transfer does not distinguish flagellum-dependent surface swarming from swimming
      through semisolid agar or other surface spreading. The KT2440 stator study explicitly makes that
      distinction. Retain general flagellar motility; do not infer swarming from necessity for an intact
      flagellum. This does not reject swarming experiments in other strains or conditions.
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and is lophotrichously
        flagellated, having multiple flagella at one cell pole (17).
