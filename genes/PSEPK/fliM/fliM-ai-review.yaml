- term:
    id: GO:0050918
    label: positive chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002408987
  review:
    summary: TreeGrafter transfer from the PANTHER FliM node. FliM does part of the work of chemotaxis,
      as the switch component that receives CheY-P and changes the direction of motor rotation, but nothing
      restricts this to movement toward attractants.
    action: MODIFY
    reason: Overly specific. The switch responds to CheY-P irrespective of whether the stimulus is an
      attractant or a repellent, so the same FliM activity serves positive and negative chemotaxis. The
      appropriate term is the parent, chemotaxis (GO:0006935), which is also the term used for FliN and
      for the other relay proteins of this pathway.
    proposed_replacement_terms:
    - id: GO:0006935
      label: chemotaxis
    supported_by:
    - reference_id: PMID:31452860
      supporting_text: FliMN contains a well conserved LSQXEIDALL sequence, which is responsible for the
        interaction with CheY-P [33].
    - reference_id: PMID:31452860
      supporting_text: The binding of CheY-P to FliM and FliN affects subunit-subunit interactions between
        FliMM domains and between FliMC and FliN in the C ring to induce a 180° rotation of FliGCC relative
