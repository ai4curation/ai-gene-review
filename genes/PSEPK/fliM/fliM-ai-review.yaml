- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports the homologous
      role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC, FlgF, FlgG),
      the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC or FljB) and the filament
      cap (FliD)'
- id: PMID:39179739
  title: Structural basis of the bacterial flagellar motor rotational switching.
  findings:
  - statement: Salmonella C-ring cryo-EM with constitutively active CheY D13K/Y106W supports switching
      through FliM/FliG; it is comparative mechanistic evidence rather than an assay of KT2440 proteins.
    supporting_text: The CheY proteins are bound into an open groove between two adjacent protomers on
      the surface of the middle subring of the C ring and interact with the FliG and FliM subunits.
core_functions:
- description: Structural subunit of the flagellar C ring (with FliN and FliG) that binds CheY-P and switches
    the direction of rotation of the polar flagellar motor, the output step of chemotactic signaling.
    The docking and structural mechanism are inferred from comparative C-ring studies, including Salmonella
    active-CheY-bound structures; a KT2440-specific FliM biochemical assay is not established.
