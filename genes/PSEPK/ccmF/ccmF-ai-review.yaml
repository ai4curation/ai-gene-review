- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: CcmF receives and ligates heme, but a membrane-crossing transporter assignment exceeds the
      demonstrated activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: Direct CcmFGH-only product formation establishes heme ligation. Heme binding and proposed
      lateral membrane access do not establish transport across the bilayer. The broader heme-handling
      family includes proteins with distinct transport architectures, so neither the family designation
      nor CcmF transmembrane helices establish this specific activity. This is not a claim that all possible
      CcmF heme movement has been experimentally excluded. This KT2440 assignment is an ortholog inference
      from the frozen family/domain record and characterized E. coli or other system I proteins; no direct
      KT2440 assay is cited.
    supported_by:
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
    - reference_id: PMID:37626034
      supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
- term:
    id: GO:0015886
    label: heme transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: CcmF contributes to intracellular heme handoff at the cytochrome-ligation machinery.
    action: ACCEPT
    reason: GO:0015886 includes directed movement within a cell and therefore does not require bilayer
      crossing. CcmFH receives and handles heme for delivery to apocytochrome; that active handoff supports
      the broad trafficking process as well as the separately retained ligation role. The KT2440 CcmF
      assignment is an ortholog inference from conserved architecture and experimentally characterized
      E. coli CcmFH machinery. No direct purified KT2440 handoff or membrane-crossing assay is claimed.
    supported_by:
    - reference_id: PMID:24397552
      supporting_text: Heme in “holo” (heme bound) CcmE is transferred to the apocytochrome (putatively,
        by the action of CcmFH)
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
