id: Q88EY0
gene_symbol: ccmF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmF is the integral membrane catalytic core of cytochrome c maturation system I. It binds heme and works with CcmH and the heme chaperone CcmE to covalently attach heme to reduced CXXCH motifs of periplasmic apocytochromes.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CcmF is an integral inner-membrane protein.
      action: ACCEPT
      reason: This specific location is integral to CcmF's core role in the membrane heme-ligation machinery.
  - term: {id: "GO:0015232", label: heme transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmF binds heme within the membrane maturation complex.
      action: REMOVE
      reason: Literature places CcmF in the CcmFH heme-reduction and ligation step, not in transmembrane heme transport (PMID:19721088).
  - term: {id: "GO:0015886", label: heme transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmF handles heme during attachment to apocytochromes.
      action: MARK_AS_OVER_ANNOTATED
      reason: The broad transport term obscures the specific heme-ligation role.
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: CcmF is membrane embedded.
      action: MARK_AS_OVER_ANNOTATED
      reason: Redundant, less precise parent of plasma membrane.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmF catalyzes a central step in c-type cytochrome biogenesis.
      action: MODIFY
      reason: GO:1903607 directly names biosynthesis of the c-type cytochrome product, whereas GO:0017004 describes assembly of a cytochrome-containing complex.
      proposed_replacement_terms:
        - {id: "GO:1903607", label: cytochrome c biosynthetic process}
  - term: {id: "GO:0020037", label: heme binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmF binds heme as part of the holocytochrome-c synthetase complex.
      action: ACCEPT
      reason: Conserved CcmF family features support this core MF.
