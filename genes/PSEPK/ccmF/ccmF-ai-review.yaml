  label: Pseudomonas putida KT2440
description: ccmF encodes the membrane heme-ligation platform of cytochrome c maturation system I. Binds
  heme and contributes the membrane catalytic platform for covalent heme attachment to apocytochrome CXXCH
  motifs. Its mechanistic assignment in Pseudomonas putida KT2440 is inferred from conserved features
  and characterized system I orthologs.
