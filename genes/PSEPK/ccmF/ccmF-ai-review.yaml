    title: "Cytochrome c biogenesis: mechanisms for covalent modifications and trafficking of heme and for heme-iron redox control."
  - id: PMID:18753134
    title: The cytochrome c maturation components CcmF, CcmH, and CcmI form a membrane-integral multisubunit heme ligation complex.
aliases: [Q88EY0, PP_4322]
core_functions:
  - description: Forms the membrane heme-attachment core of system I and binds heme for covalent ligation to apocytochromes.
    molecular_function: {id: "GO:0020037", label: heme binding}
    directly_involved_in:
      - {id: "GO:1903607", label: cytochrome c biosynthetic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: PMID:19721088
        supporting_text: Step 2 includes the CcmFH-mediated reduction (to Fe(+2)) of holoCcmE and ligation of the heme to CXXCH.
suggested_questions:
  - question: Which PSEPK CcmF residues coordinate heme and position the apocytochrome CXXCH motif?
  - question: Does direct evidence support assigning holocytochrome-c synthase activity (GO:0004408) to CcmF alone rather than to the CcmF/H machinery?
suggested_experiments:
  - description: Assay holocytochrome formation with targeted mutations in conserved CcmF heme-binding residues.
    experiment_type: holocytochrome maturation assay
