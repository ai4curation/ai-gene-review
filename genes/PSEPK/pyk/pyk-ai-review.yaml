- term:
    id: GO:0030955
    label: potassium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Potassium binding is the family-inferred monovalent-cation feature used by
      many bacterial pyruvate kinases, but it is ancillary to the exact
      catalytic activity and has not been measured for this KT2440 isozyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Preserve the UniRule-supported cofactor annotation as non-core while
      reserving ACCEPT for the catalytic and glycolytic-process annotations.
