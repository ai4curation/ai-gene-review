- term:
    id: GO:0006096
    label: glycolytic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      The PEP to pyruvate reaction is the last step of the glycolytic process.
      In KT2440 this lower trunk carries Entner-Doudoroff-derived triose
      phosphate to pyruvate. GO obsoleted GO:0061688 (glycolysis via ED) with
      replaced_by GO:0006096, so GO:0006096 now also covers ED-route
      glycolysis. The gene-specific context is that pyk belongs to the
      GclR-repressed GCL cluster, which channels glyoxylate-derived glycerate
      through 2-phosphoglycerate and PEP into the same terminal step.
    action: ACCEPT
    reason: >-
      pyk itself catalyzes a step of the glycolytic process, whatever the
      upstream carbon source, so the claim holds. This is the same action as
      the pykA row. The gene-specific difference is regulatory: pyk is
      expressed from the GCL cluster, which is inactive under standard
      conditions, so pykA is probably the main glycolytic isozyme during
      glucose growth. That makes pyk's contribution conditional, but it does
      not make the term wrong.
    supported_by:
    - reference_id: PMID:26350459
      supporting_text: glycolysis is known to proceed almost exclusively through the Entner-Doudoroff (ED) route
    - reference_id: PMID:37067433
      supporting_text: The native GCL pathway (a gene cluster consisting of gcl, hyi, glxR, ttuD, and pyk) is inactive, since the binding of GclR (glyoxylate carboligase repressor) in the promoter region.
    - reference_id: file:PSEPK/pyk/pyk-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'Carbohydrate degradation; glycolysis; pyruvate from D-glyceraldehyde 3-phosphate: step 5/5.'
- term:
    id: GO:0030955
    label: potassium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Many bacterial pyruvate kinases are activated by K+, but some family
      members are K+-independent. For pyk the UniProt K+ cofactor statement
      comes only from an ARBA rule, and no K+-binding residues are mapped. The
      row therefore rests on pyruvate kinase family membership.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the same action as the pykA row. The monovalent-cation
      requirement is a plausible family feature, peripheral to the catalytic
      function, and it has not been measured for either KT2440 isozyme. The
      ARBA-only cofactor line is not cited as support.
    supported_by:
    - reference_id: file:PSEPK/pyk/pyk-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR001697; Pyr_Knase.'
