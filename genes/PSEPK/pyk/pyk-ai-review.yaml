id: Q88EZ9
gene_symbol: pyk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  pyk (PP_4301) encodes one of the two pyruvate kinase isozymes of Pseudomonas
  putida KT2440; the other is pykA (PP_1362). It is a full-length member of the
  pyruvate kinase family, with the TIM-barrel (PK) and C-terminal (PK_C)
  domains and the pyruvate kinase active-site signature. It catalyzes the
  essentially irreversible transfer of the phosphoryl group from
  phosphoenolpyruvate to ADP, giving pyruvate and ATP. This is the last step
  of the lower glycolytic trunk, which in KT2440 carries
  Entner-Doudoroff-derived glyceraldehyde 3-phosphate to pyruvate. Unlike
  pykA, pyk is the last gene of the gcl-hyi-glxR-ttuD-pyk
  (glyoxylate-carboligase, GCL) cluster. GclR represses this cluster under
  standard conditions, which suggests that pyk mainly serves the conversion of
  glyoxylate- or glycerate-derived phosphoglycerate to pyruvate. The enzyme is
  soluble and cytoplasmic.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Pyruvate kinase family enzymes need a divalent cation, normally Mg2+, to
      coordinate the phosphoryl groups of PEP and ADP. The UniProt entry maps
      no metal-binding residues for pyk, so this row rests on family membership
      (TIGR01064, Pfam PK), as it does for pykA.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mg2+ binding is true of the pyruvate kinase family but is a cofactor
      feature, peripheral to the core catalytic activity. This is the same
      action as the pykA row. No gene-specific evidence separates the two
      isozymes on this point.
    supported_by:
    - reference_id: file:PSEPK/pyk/pyk-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01064; pyruv_kin; 1.'
