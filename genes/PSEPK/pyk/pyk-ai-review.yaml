- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Magnesium binding is consistent with the metal-dependent phosphoryl
      transfer catalyzed by pyruvate kinase, but it is ancillary to the exact
      GO:0004743 catalytic annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the required cofactor-binding feature without elevating a generic
      binding term to the enzyme's core function.
