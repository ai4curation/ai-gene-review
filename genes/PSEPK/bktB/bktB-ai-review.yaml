taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  BktB (PP_3754) is a predicted cytoplasmic class II thiolase of Pseudomonas
  putida KT2440, a member of the BktB clade of broad-substrate
  beta-ketothiolases best known from Cupriavidus necator. Its thiolase
  signatures, catalytic cysteine and the two proton-acceptor residues support
  reversible thiolytic cleavage of acetoacetyl-CoA to two acetyl-CoA (and the
  reverse Claisen condensation). The physiological role of the KT2440 protein is
  not established experimentally: it could contribute to the terminal step of
  acetoacetate or short-chain 3-oxoacyl-CoA catabolism or to biosynthetic
  condensation, and the genome encodes several other thiolase paralogs that
  could perform the same chemistry.
