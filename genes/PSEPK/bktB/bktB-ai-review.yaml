suggested_questions:
- question: >-
    Which KT2440 thiolase paralog (BktB, the PP_3355 or PP_2215 thiolases,
    YqeF, or the FadA beta-oxidation thiolases) carries acetoacetyl-CoA
    thiolysis during growth on D-3-hydroxybutyrate or acetoacetate?
- question: >-
    Does KT2440 BktB share the broad chain-length range (3-oxovaleryl-CoA and
    longer 3-oxoacyl-CoAs) reported for Cupriavidus necator BktB?
suggested_experiments:
- description: >-
    Measure growth and transposon fitness of bktB and other thiolase-paralog
    deletions on D-3-hydroxybutyrate and acetoacetate, and assay purified
    Q88GH0 for acetoacetyl-CoA thiolysis and condensation with C4-C8 acyl-CoA
    acceptors.
  experiment_type: genetic fitness and enzyme kinetics
