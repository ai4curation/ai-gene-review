    reason: >-
      Family-level support. Q88GH0 matches the NCBIfam acetyl-CoA
      C-acetyltransferase model TIGR01930 and the BktB-specific NCBIfam model
      NF006552, carries the thiolase active-site signatures PS00098 and PS00099,
      and the curated PIRSR rule places the acyl-thioester-forming cysteine at
