- term:
    id: GO:0033812
    label: 3-oxoadipyl-CoA thiolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:19481
  - EC:2.3.1.174
  review:
    summary: >-
      3-Oxoadipyl-CoA thiolysis is predicted only by an ARBA rule for this
      protein; KT2440 has a dedicated, genetically defined PcaF thiolase for
      that reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only basis for the EC 2.3.1.174 catalytic-activity line in the record
      is ARBA:ARBA00048527, an unvetted association rule, and Q88GH0 does not
      match the PcaF-specific NCBIfam model TIGR02430 that marks the
      beta-ketoadipate-pathway thiolase. KT2440 PcaF-I (PP_1377) is the
      characterized 3-oxoadipyl-CoA thiolase of the beta-ketoadipate pathway.
      Broad-substrate BktB-clade thiolases can in principle accept
      succinyl-CoA in engineered condensation pathways, so the activity is not
      impossible, but there is no evidence that this protein evolved to or
      does catalyse it in KT2440. Not removed because the chemistry is within
      the range of the clade.
    supported_by:
    - reference_id: file:PSEPK/pcaF/pcaF-ai-review.yaml
      supporting_text: >-
        PcaF-I is a degradative thiolase that cleaves 3-oxoadipyl-CoA to
        acetyl-CoA and succinyl-CoA in the shared lower beta-ketoadipate pathway
core_functions:
- description: >-
    Predicted class II thiolase that interconverts acetoacetyl-CoA plus CoA and
    two acetyl-CoA. In KT2440 it is a reaction-capable candidate for the
    terminal thiolysis of acetoacetyl-CoA during D-3-hydroxybutyrate and
    acetoacetate catabolism, but which thiolase paralog carries that flux in
    vivo is not established.
