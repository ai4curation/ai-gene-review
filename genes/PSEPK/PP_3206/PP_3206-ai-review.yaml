description: >-
  PP_3206 encodes an epimerase/dehydratase-fold protein in the KT2440
  flavonoid-degradation locus. KEGG assigns it to FdeJ orthology group K26183
  and reaction R13076, a predicted hydrolytic carbon-carbon cleavage that
  releases oxaloacetate from a ring-opened flavonoid intermediate. Neither the
  target nor its Herbaspirillum counterpart has been assayed directly for this
  reaction, so the substrate and chemistry remain pathway-level predictions.
