proposed_new_terms:
- proposed_name: naringenin-degradation oxaloacetate-releasing hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolytic carbon-carbon cleavage of the ring-opened
    naringenin A-ring intermediate represented by KEGG reaction R13076, yielding
    a hydroxyphenyl oxovalero-lactone and oxaloacetate.
  justification: >-
    GO:0016822 captures only the bond class, while K26183/R13076 specifies the
    predicted FdeJ reaction. The term should not be used experimentally until
    the enzyme and reaction have been characterized.
  proposed_parent:
    id: GO:0016822
    label: hydrolase activity, acting on carbon-carbon bonds
  supported_by:
  - reference_id: file:PSEPK/PP_3206/PP_3206-deep-research-openscientist.md
    supporting_text: FdeJ's specific reaction (oxaloacetate-releasing hydrolysis, KEGG R13076) is therefore a pathway/orthology inference
knowledge_gaps:
- gap_statement: >-
    No FdeJ-family protein has been shown biochemically to catalyze R13076, and
    PP_3206 has not been tested genetically in KT2440.
  boundary: >-
    KEGG orthology and locus context support pathway placement, but the enzyme
    substrate, products, cofactor requirement, and mechanism remain predictions.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    The exact molecular-function annotation should remain provisional until a
    member of the family is characterized.
  resolution: >-
    Reconstitute PP_3206 with the chemically defined R13076 substrate and identify
    products and any dinucleotide requirement; pair this with a native knockout
    metabolomics experiment.
  provenance:
  - reference_id: file:PSEPK/PP_3206/PP_3206-deep-research-openscientist.md
    supporting_text: FdeJ's specific reaction (oxaloacetate-releasing hydrolysis, KEGG R13076) is therefore a pathway/orthology inference
suggested_questions:
- question: >-
    Does PP_3206 directly catalyze R13076, and is its epimerase/dehydratase-fold
    dinucleotide required catalytically or only structurally?
suggested_experiments:
- description: >-
    Purify PP_3206, synthesize or generate the R13076 substrate enzymatically,
    and identify oxaloacetate and the co-product by LC-MS/MS while testing
    NAD(H) and NADP(H) dependence.
  experiment_type: biochemical reconstitution and product analysis
- description: >-
    Compare wild type, a PP_3206 deletion, and a complemented strain during
    naringenin utilization using targeted metabolomics for the R13076 substrate
    and products.
  experiment_type: genetics and targeted metabolomics
