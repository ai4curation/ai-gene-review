- question: Which succinate-semialdehyde dehydrogenase is the physiological partner of Gbd during growth on 4-hydroxybutyrate?
suggested_experiments:
- hypothesis: Gbd and one of the three candidate succinate-semialdehyde dehydrogenases form the physiological 4-hydroxybutyrate oxidation route.
  description: Compare 4-hydroxybutyrate-dependent growth and metabolite accumulation in gbd, sad-I, sad-II, and gabD-II deletion strains.
