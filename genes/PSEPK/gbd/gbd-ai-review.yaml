suggested_questions:
- question: Does purified PP_2650 oxidize free 4-hydroxybutyrate, and how do its substrate and metal preferences
    differ from PP_2049?
suggested_experiments:
- hypothesis: The PP_2650 substrate assignment may differ from the genetically implicated PP_2049 hydroxyacid
    activity.
  description: Assay purified PP_2650 with matched NAD/NADP, metal reconstitution and a panel including
    4-hydroxybutyrate, R/S-3-hydroxybutyrate and representative alcohols. Identify products independently
    of nicotinamide turnover; compare native deletions and complementation without assuming a cognate
    Sad partner.
