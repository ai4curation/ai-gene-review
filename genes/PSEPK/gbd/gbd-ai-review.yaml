- term:
    id: GO:0047577
    label: 4-hydroxybutyrate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The exact PP_2650 4-hydroxybutyrate reaction remains unverified.
    action: UNDECIDED
    reason: The EC-derived row traces to a submitter product assignment. Independent domain signatures
      establish a broad alcohol-dehydrogenase family, not this substrate. PMID:31981617 characterizes
      Cupriavidus Q59104; PMID:32256468 tests the distinct KT2440 PP_2049 protein and reports unsuccessful
      direct 4-hydroxybutyrate assays. These sources neither establish nor disprove PP_2650 activity,
      so the specific claim is unresolved rather than rejected.
    supported_by:
    - *id001
    - reference_id: PMID:31981617
      supporting_text: 'gamma-hydroxybutyrate dehydrogenase (GHBDH, UniProt: Q59104)'
    - reference_id: PMID:32256468
      supporting_text: Attempts to obtain direct biochemical evidence for the oxidation hypothesis with
        dehydrogenase assays on whole cell extracts
