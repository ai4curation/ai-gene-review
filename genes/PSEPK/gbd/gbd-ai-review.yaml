suggested_questions:
- question: Which succinate-semialdehyde dehydrogenase is the physiological partner of Gbd during growth on 4-hydroxybutyrate?
suggested_experiments:
- hypothesis: Gbd and one or more succinate-semialdehyde dehydrogenases form the physiological 4-hydroxybutyrate oxidation route.
  description: Compare 4-hydroxybutyrate-dependent growth and metabolite accumulation in gbd and a genome-wide, non-exhaustive panel of aldehyde-dehydrogenase single and combinatorial deletion strains, including sad-I, sad-II, and gabD-II.
