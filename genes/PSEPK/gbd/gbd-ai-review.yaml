  label: Pseudomonas putida KT2440
description: Gbd (PP_2650) is a predicted metal-dependent, NAD-linked alcohol dehydrogenase of the group
  III Fe-ADH family in Pseudomonas putida KT2440. Its physiological substrate is unresolved. PP_2049,
  a separate gene product, is implicated genetically in hydroxybutyrate utilization.
