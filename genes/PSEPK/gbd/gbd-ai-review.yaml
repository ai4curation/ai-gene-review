  review:
    summary: PP_2650 has independently classified group III alcohol-dehydrogenase architecture; NAD-linked
      alcohol oxidation is retained as a family inference.
    action: ACCEPT
    reason: The Fe-ADH domain and alcohol-dehydrogenase FunFam classification support the enzyme class
      underlying the TreeGrafter assignment. NAD capacity is inferred, not a measured kinetic preference.
      The submitted 4-hydroxybutyrate name and EC mapping do not justify narrowing this true class-level
      claim to an unverified substrate.
