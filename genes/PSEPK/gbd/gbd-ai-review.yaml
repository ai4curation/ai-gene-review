  title: UniProt entry Q88JJ9 for gbd
  findings:
  - statement: Independent domain and functional-family classifications support the retained enzyme class;
      submitted names, EC labels, electronic GO lines and ARBA-only statements are not used as independent
      functional evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact accession and locus inspected. Independent DR domain/functional-family records
      support classification; unreviewed submitted names/EC labels, ARBA-only text and electronic GO lines
      are not used as independent proof.
- id: PMID:31981617
  title: Kinetics aspects of Gamma-hydroxybutyrate dehydrogenase.
  findings:
  - statement: A Group III Fe-dependent GHB/4HB dehydrogenase was assayed in the forward alcohol-to-aldehyde
      direction with NAD.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Characterized Cupriavidus Q59104 comparator; not a PP_2650 experiment and not evidence
      that all Fe-ADH-family proteins share 4HB specificity.
- id: PMID:32256468
  title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, pathway validation and conclusion inspected. PP_2049 is Q88L86, distinct
      from PP_2650/Q88JJ9. The text calls PP_3151 SadI, whereas current locus-resolved nomenclature is
      sad-II; locus identifiers govern attribution.
  findings:
  - statement: KT2440 PP_2049 deletion abolishes growth on tested 4HB/1,4-BDO conditions, but direct 4HB
      biochemical assays were unsuccessful; the paper retains competing routes. PP_3151 is an annotated
      downstream candidate, not an isolated enzyme assay.
    supporting_text: Attempts to obtain direct biochemical evidence for the oxidation hypothesis with
      dehydrogenase assays on whole cell extracts
- id: PMID:7851418
  title: Metabolic pathway for biosynthesis of poly(3-hydroxybutyrate-co-4-hydroxybutyrate) from 4-hydroxybutyrate by Alcaligenes eutrophus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract verified; this is direct growth and enzymology support for
      4-hydroxybutyrate oxidation through succinate semialdehyde in the related
      Cupriavidus/Ralstonia system, not target-specific KT2440 evidence.
  findings:
  - statement: Alcaligenes eutrophus mutants growing on 4-hydroxybutyrate carry a locus encoding 4-hydroxybutyrate dehydrogenase activity.
- id: file:modules/bacterial_4_hydroxybutyrate_oxidation-deep-research-openscientist.md
  title: OpenScientist review of bacterial 4-hydroxybutyrate oxidation
  findings:
  - statement: The report supports the two-reaction chemistry while distinguishing target-specific enzyme
      assignment from family-level evidence.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genuine provider report reused as discovery/context. Consistent with the valid PR4748
      source-boundary assessment, this is not target-specific experimental evidence. Cofactor preferences,
      residue mappings and pathway pairings require independent support; no new catalytic claim rests
      on provider prose. The synthesis does separate free-acid 4-hydroxybutyrate oxidation from
      reverse-flux and archaeal CoA-thioester pathways, and its growth-based 4HB-utilization claims
      were spot-checked against PMID:7851418. Its section 3.1 conflates the Alcaligenes eutrophus
      strains, because the 4HB-growing SK4040 strain was derived from HF39, not H16; H16 was the
      recipient of the cloned 10-kbp locus. That strain slip does not affect the pathway-boundary
      call used here.
