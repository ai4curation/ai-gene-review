id: Q88JJ9
gene_symbol: gbd
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  gbd encodes a predicted NAD-dependent 4-hydroxybutyrate dehydrogenase that
  oxidizes 4-hydroxybutyrate to succinate semialdehyde. It supplies the first
  reaction of a two-step route from 4-hydroxybutyrate to succinate, although
  the physiological succinate-semialdehyde dehydrogenase partner in this strain
  has not been established.
