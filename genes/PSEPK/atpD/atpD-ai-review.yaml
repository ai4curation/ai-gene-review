id: Q88BX4
gene_symbol: atpD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase subunit beta, the catalytic nucleotide-binding subunit of the F1 head whose three copies host the ATP synthesis sites of the plasma-membrane F0F1 complex.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: AtpD directly binds ATP at the catalytic sites of the F1 head.
      action: ACCEPT
      reason: This is a direct biochemical property of the beta subunit.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The peripheral F1 beta subunit is associated with the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate despite AtpD not spanning the membrane.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: The AtpD catalytic subunit directly participates in proton motive force-driven ATP synthesis at the plasma membrane.
      action: MODIFY
      reason: >-
        The process is right but the term is the general parent. P. putida F0F1 is a
        plasma-membrane enzyme, so the plasma-membrane-specific child GO:0042777 is the
        accurate placement. GOA already carries GO:0042777 for atpB and atpG; applying it
        across all eight subunits makes the operon agree on one term for one identical
        process instead of splitting between parent and child by accident of which
        UniRule fired.
      proposed_replacement_terms:
        - id: GO:0042777
          label: proton motive force-driven plasma membrane ATP synthesis
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: located_in
    review:
      summary: AtpD is associated with the membrane-bound ATP synthase but is not itself an integral membrane protein.
      action: MARK_AS_OVER_ANNOTATED
      reason: The more specific plasma-membrane complex-associated localization is already present; this broad term adds no useful precision.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpD is the beta subunit of the F1 sector.
      action: ACCEPT
      reason: This correctly records direct complex membership.
  - term:
      id: GO:0046034
      label: ATP metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: AtpD participates in ATP metabolism through ATP synthesis and hydrolysis in F1.
      action: KEEP_AS_NON_CORE
      reason: Correct but broader than proton motive force-driven ATP synthesis.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: AtpD hosts catalytic sites but cannot independently couple proton transport to ATP synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: This activity requires the complete F0F1 assembly and should be represented as a contribution by AtpD.
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: AtpD participates in coupled proton translocation as the catalytic beta subunit of ATP synthase.
      action: KEEP_AS_NON_CORE
      reason: >-
        Retained, but not core, for the reason given for accepting it: AtpD does not form
        the proton channel. Beta's involvement in translocation is mediated through
        mechanical coupling to the Fo sector, not through conducting protons, so this is
        a true but indirect participation. The core process for this subunit is
        GO:0042777.
