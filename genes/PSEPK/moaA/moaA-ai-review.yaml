- id: file:PSEPK/moaA/moaA-deep-research-openscientist.md
  title: OpenScientist gene research for moaA
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      The conserved GTP cyclase reaction and division of labor with MoaC agree
      with reviewed target UniProt. The report explicitly acknowledges that its
      mechanistic and structural evidence comes from orthologs, but presents
      unsaved target residue/motif analysis, target homodimer and structural
      transfer, heterologous xanthine-oxidase production, and rate-defining or
      nonredundant physiological claims as Q88E69 evidence. Those target-specific
      claims are not propagated, particularly because two divergent KT2440
      MoaA-family paralogs remain unresolved.
  findings:
  - statement: The report gives the canonical MoaA reaction assignment, independently supported by
      reviewed Q88E69 UniProt.
    supporting_text: >-
      MoaA is a **radical S-adenosyl-L-methionine (SAM) metalloenzyme, GTP 3',8-cyclase**, that catalyzes
      the **first and committed step of molybdenum cofactor (Moco) biosynthesis**.
  - statement: The report correctly distinguishes MoaA cyclization from the cyclic-phosphate-forming
      MoaC reaction.
    supporting_text: >-
      MoaA is **not** the enzyme that forms the cyclic phosphate or releases pyrophosphate (that is MoaC)
  - statement: The report presents target-specific residue analysis that was not saved as a
      reproducible local artifact.
    supporting_text: >-
      **N-terminal radical-SAM cluster:** the canonical **CX₃CX₂C** motif at **Cys27–Cys31–Cys34** (…C27-D-F-R-C31-V-Y-C34…),
      matching the SAM-cleaving [4Fe-4S] cluster fingerprint (IPR000385).
  - statement: The report explicitly acknowledges that its mechanistic and structural evidence is
      transferred from orthologs.
    supporting_text: >-
      All mechanistic/structural data derive from **orthologs**, not the *P. putida* KT2440 protein directly;
      however, MoaA family conservation (HAMAP MF_01225) makes transfer of annotation robust.
  - statement: The report overstates Q88E69 as rate-defining despite unresolved KT2440 MoaA-family
      paralogs.
    supporting_text: >-
      Because MoaA sits at the pathway's entry point, its activity is **rate-defining for the supply of
      all Moco-dependent enzymes**
- id: file:PSEPK/moaA/moaA-bioinformatics/RESULTS.md
  title: Reproducible sequence comparison of KT2440 MoaA-family and MobA-like proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified local analysis supporting Q88E69 as the canonical KT2440 MoaA
      among the three compared MoaA-family proteins because it alone carries the
      MoaA-specific InterPro records.
  findings:
  - statement: Q88E69 alone carries the MoaA-specific InterPro records among the three KT2440
      MoaA-family candidates examined.
    supporting_text: |-
      - The reviewed MoaA sequence Q88E69 is the only one of the three with the
        MoaA-specific InterPro entries IPR013483 and IPR000385 in its UniProt record.
        All three share broader MoaA-like/radical-SAM entries and PTHR22960.
