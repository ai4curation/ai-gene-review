- term:
    id: GO:0061799
    label: cyclic pyranopterin monophosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Cyclic pyranopterin monophosphate synthase activity belongs to MoaC, not MoaA.
    action: REMOVE
    reason: MoaA makes the cyclic GTP intermediate 3',8-cH2GTP; the distinct MoaC enzyme converts
      that intermediate to cPMP, and MoaA itself lacks the residues for the rearrangement. KT2440
      encodes a separate HAMAP MF_01224 MoaC. The TreeGrafter transfer comes from the PTHR22960
      node that also holds bifunctional MOCS1 fusions, whose MoaC-like MOCS1B domain carries this
      activity; single-domain MoaA lacks it. Same action as ECOLI/moaA.
    supported_by:
    - reference_id: file:PSEPK/moaA/moaA-deep-research-openscientist.md
      supporting_text: >-
        MoaA is **not** the enzyme that forms the cyclic phosphate or releases pyrophosphate (that is
        MoaC)
    - reference_id: PMID:23627491
      supporting_text: In contrast to GTP cyclohydrolases I, MoaA is incapable of catalyzing the
        rearrangement reactions, presumably due to the lack of appropriate amino acid residues
        in the active-site.
    - reference_id: PMID:23627491
      supporting_text: Instead, 3′,8-cH2GTP is transferred to MoaC where a complex rearrangement
        reaction proceeds.
    - reference_id: file:PSEPK/moaC/moaC-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: "SIMILARITY: Belongs to the MoaC family."
