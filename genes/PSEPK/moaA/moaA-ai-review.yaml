    action: MODIFY
    reason: Per the RADICAL_SAM treatment rule, the generic catalytic-activity row is replaced by the
      specific reaction the gene already carries (GO:0061798, accepted below). Q88E69 is a HAMAP
      MF_01225 MoaA family member, and the HAMAP rule assigns it the GTP 3',8-cyclase reaction.
    proposed_replacement_terms:
    - id: GO:0061798
      label: GTP 3',8'-cyclase activity
