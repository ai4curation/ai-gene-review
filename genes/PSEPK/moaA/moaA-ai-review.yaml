  review:
    summary: The specific [4Fe-4S]-cluster binding annotation is supported but is not the catalytic
      function.
    action: ACCEPT
    reason: >-
      Core cofactor binding: one cluster generates the 5'-deoxyadenosyl radical and the second binds the
      GTP-derived substrate, so GTP 3',8-cyclase activity is not separable from cluster binding. Catalysis
      is established, so ACCEPT rather than KEEP_AS_NON_CORE, as in ECOLI/moaA.
    supported_by:
    - reference_id: file:PSEPK/moaA/moaA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 [4Fe-4S] clusters. Binds 1 [4Fe-4S] cluster coordinated
