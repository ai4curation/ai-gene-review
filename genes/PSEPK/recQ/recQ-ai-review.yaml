  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: RecQ is an ATP-dependent 3-prime-to-5-prime DNA helicase that remodels replication and recombination intermediates. During RecFOR gap repair it cooperates with RecJ to enlarge single-stranded gaps before SSB coating and RecA loading. It also acts on branched DNA structures in other genome-maintenance contexts.
