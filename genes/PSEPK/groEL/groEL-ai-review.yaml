  label: Pseudomonas putida KT2440
description: GroEL (PP_1361) is the cytoplasmic group I chaperonin of
  Pseudomonas putida KT2440. Conserved GroEL domains and curated HAMAP
  assignment support ATP-dependent folding and refolding of non-native proteins
  with the GroES co-chaperonin. Two heptameric GroEL rings form a chamber in
  which GroES capping and ATP-driven conformational changes coordinate client
  encapsulation and release. KT2440 stress-expression studies place GroEL within
  a proteostasis response, while the detailed folding-cycle mechanism is
  inferred from experimentally characterized homologs; the target-specific
  client repertoire remains unresolved.
