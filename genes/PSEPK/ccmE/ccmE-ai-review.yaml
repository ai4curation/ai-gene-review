description: ccmE encodes a membrane-anchored periplasmic heme chaperone of cytochrome c maturation system
  I. Binds heme transiently and covalently as a membrane-anchored periplasmic chaperone and delivers it
  to the heme-ligation machinery. Its mechanistic assignment in Pseudomonas putida KT2440 is inferred
  from conserved features and characterized system I orthologs.
