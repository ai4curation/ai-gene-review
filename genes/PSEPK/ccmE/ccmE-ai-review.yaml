    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: CcmE is anchored in the inner membrane with its heme-binding domain in the periplasm.
      action: ACCEPT
      reason: The membrane anchor positions CcmE's periplasmic heme-chaperone domain for its core function.
  - term: {id: "GO:0017003", label: protein-heme linkage}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: CcmE carries heme to the machinery that covalently attaches it to apocytochromes.
      action: ACCEPT
      reason: This directly captures CcmE's role in system I maturation.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmE contributes to assembly of c-type cytochromes.
      action: KEEP_AS_NON_CORE
      reason: Correct but broader than protein-heme linkage.
  - term: {id: "GO:0020037", label: heme binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmE transiently and covalently binds heme as a chaperone.
      action: ACCEPT
      reason: This is the defining core MF of CcmE.
