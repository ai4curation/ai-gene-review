taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmE is the membrane-anchored periplasmic heme chaperone of cytochrome c maturation system I. It transiently binds heme delivered by CcmC, forming holo-CcmE, and transfers the cofactor to apocytochromes through the CcmF/H ligation machinery.
