id: Q88D11
gene_symbol: tatC-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TatC-II is the multispanning membrane receptor/scaffold of the
  PP_5016-PP_5018 twin-arginine translocation system in Pseudomonas putida
  KT2440. Together with TatB it recognizes folded proteins bearing
  twin-arginine signal peptides and recruits TatA-II to form an active,
  proton-motive-force-dependent translocase.
