id: Q88D11
gene_symbol: tatC-II
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TatC-II (PP_5018) is an inner-membrane component of the PP_5016-PP_5018 twin-arginine translocation
  (Tat) system of Pseudomonas putida KT2440, one of the strain's two complete tatABC loci; both systems
  can export the Tat substrate UxpB. It is the multispanning TatC-family subunit that, with TatB, forms
  the receptor for twin-arginine signal peptides and recruits TatA for translocation. Its activities are
  assigned from the conserved, experimentally characterized E. coli subunit family.
