  full_text_unavailable: true
  findings:
  - statement: The E. coli Imp/LptD depletion study links the protein to outer-membrane biogenesis; this abstract
      does not establish a KT2440 assay or conserved disulfide positions.
    supporting_text: Upon depletion of Imp, lipids and outer membrane proteins appear in a novel membrane fraction
      with higher density than the outer membrane.
- id: PMID:16861298
  title: Identification of a protein complex that assembles lipopolysaccharide in the outer membrane of Escherichia
    coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli LptD/Imp and LptE/RlpB are required for newly synthesized LPS to reach the outer
      leaflet, supporting the outer-membrane assembly role of the pair. Full cached text inspected.
  findings:
  - statement: E. coli LptD/Imp and LptE/RlpB are required for newly synthesized LPS to reach the outer leaflet,
      supporting the outer-membrane assembly role of the pair.
    supporting_text: These data clearly show that in the absence of Imp or RlpB de novo synthesized LPS does
      not reach the outer leaflet of the OM.
- id: PMID:20203010
  title: Characterization of the two-protein complex in Escherichia coli responsible for lipopolysaccharide
    assembly at the outer membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli LptD and LptE form a stable complex; LptE specifically binds LPS and stabilizes LptD.
      These are homolog results, not direct KT2440 measurements. Protected cache is abstract-only; conclusions
      are limited to that text.
  full_text_unavailable: true
  findings:
  - statement: E. coli LptD and LptE form a stable complex; LptE specifically binds LPS and stabilizes LptD.
      These are homolog results, not direct KT2440 measurements.
    supporting_text: We also demonstrate that LptE binds LPS specifically and may serve as a substrate recognition
      site at the OM.
