id: A0A140FVZ0
gene_symbol: lptD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LptD is the outer-membrane beta-barrel subunit of the LptDE translocon. Together with the LptE
  lipoprotein, it receives lipopolysaccharide from the periplasmic Lpt bridge and inserts it into the outer
  leaflet of the Gram-negative outer membrane. Its periplasmic N-terminal domain receives LPS from the bridge,
  and the beta-barrel permits lipid A insertion laterally into the outer leaflet.
