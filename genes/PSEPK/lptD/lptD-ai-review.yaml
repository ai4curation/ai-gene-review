  label: Pseudomonas putida KT2440
description: LptD is the outer-membrane beta-barrel subunit of the LptDE translocon. Together with the
  LptE lipoprotein, it receives lipopolysaccharide from the periplasmic Lpt bridge and inserts it into
  the outer leaflet of the Gram-negative outer membrane.
