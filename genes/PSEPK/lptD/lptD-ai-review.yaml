- id: PMID:29449493
  title: Lipopolysaccharide is transported to the cell surface by a membrane-to-membrane protein bridge.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component. Full cached text inspected.
  findings:
  - statement: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component.
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
      transport to occur.
- id: PMID:24990744
  title: Structural basis for outer membrane lipopolysaccharide insertion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The linked PDB4N4R structure is Salmonella Typhimurium LT2 LptD/LptE expressed in E. coli,
      verified from official entity records. The abstract supports the barrel/plug and lateral-insertion model;
      it is not an E. coli-native or KT2440 structural assay. Protected cache is abstract-only; conclusions
      are limited to that text and official linked structure metadata.
  full_text_unavailable: true
  findings:
  - statement: The linked PDB4N4R structure is Salmonella Typhimurium LT2 LptD/LptE expressed in E. coli, verified
      from official entity records. The abstract supports the barrel/plug and lateral-insertion model; it is
      not an E. coli-native or KT2440 structural assay.
    supporting_text: LptE adopts a roll-like structure located inside the barrel of LptD to form an unprecedented
      two-protein 'barrel and plug' architecture.
