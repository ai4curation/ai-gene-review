id: A0A140FVZ0
gene_symbol: lptD
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LptD is the outer-membrane beta-barrel subunit of the LptDE
  translocon. Together with the LptE lipoprotein, it receives lipopolysaccharide
  from the periplasmic Lpt bridge and inserts it into the outer leaflet of the
  Gram-negative outer membrane.
existing_annotations:
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LptD is an integral beta-barrel protein of the cell outer membrane.
    action: ACCEPT
    reason: The LptD family assignment and UniProt localization directly support this taxon-specific compartment.
- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LptD forms the outer-membrane translocon used in the terminal stage of LPS transport.
    action: ACCEPT
    reason: This biological-process annotation accurately captures LptD pathway participation.
- term:
    id: GO:0019867
    label: outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: LptD is in the outer membrane, but a Gram-negative-specific outer-membrane term is already present.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic term is redundant with cell outer membrane and is less taxonomically informative.
- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LptD-mediated LPS insertion is required for outer-membrane assembly.
    action: ACCEPT
    reason: This is the direct biological outcome of the LptDE translocon.
- term:
    id: GO:0061024
    label: membrane organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LptD contributes to membrane organization through LPS insertion.
    action: KEEP_AS_NON_CORE
    reason: The term is correct but much broader than Gram-negative outer-membrane assembly.
- term:
    id: GO:1990351
    label: transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: LptD is the beta-barrel component of the LptDE outer-membrane transporter complex.
    action: ACCEPT
    reason: Complex membership is supported by the conserved LptD family and its interaction with LptE.
core_functions:
- description: Forms the outer-membrane channel of the LptDE translocon and contributes to LPS insertion into the outer leaflet.
