- id: PMID:12207697
  title: Imp/OstA is required for cell envelope biogenesis in Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The E. coli Imp/LptD depletion study links the protein to outer-membrane biogenesis; this
      abstract does not establish a KT2440 assay or conserved disulfide positions. Protected cache is abstract-only;
