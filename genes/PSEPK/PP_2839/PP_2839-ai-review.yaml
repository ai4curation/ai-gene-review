- id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-nucleotide-excision-repair__ppu03420-deep-research-openscientist.md
  title: OpenScientist PSEPK bacterial nucleotide-excision repair synthesis
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Verified species-aware synthesis that treats PP_2839 as a DinG-family
      iron-sulfur helicase and rejects its KEGG ERCC2/XPD mapping as a
      eukaryotic-map artifact. The report's GO inventory and recommendation are
      not sound for this target: it says PP_2839 carries GO:0006281 even though
      the fetched GOA table has only molecular-function annotations, and it
      recommends GO:0004386 and GO:0051880/GO:0000737-like terms even though
      GO:0004386 is broader than GO:0003678, GO:0051880 is G-quadruplex DNA
      binding, and GO:0000737 is DNA catabolic process. This audit verified the
      DinG/ERCC2 boundary call against the target UniProt and GOA records, not
      the report's uncached PMIDs 35149830 and 38513450.
  findings:
  - statement: The report distinguishes the canonical UvrABC relay from UvrA2, LigB, and the eukaryotic XPD mapping artifact.
- id: file:modules/bacterial_nucleotide_excision_repair.yaml
  title: Bacterial nucleotide-excision repair module
  findings:
  - statement: The reusable module defines the required global-genome and transcription-coupled NER roles.
