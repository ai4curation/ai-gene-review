  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The target protein is assigned to the DinG helicase subfamily.
    action: ACCEPT
    reason: >-
      The UniProt DinG-subfamily SIMILARITY line is ARBA-only, so support rests
      on domain classification: InterPro DinG/Rad3-like (IPR045028) plus the
      Pfam DEAD_2 and Helicase_C_2 helicase domains place PP_2839 in the
      DinG/Rad3 helicase family. The characterized E. coli family member DinG is
      an ATP-dependent DNA helicase (PMID:24738733); that is evidence about the
      E. coli protein and supports this row only by family membership.
    supported_by:
    - reference_id: file:PSEPK/PP_2839/PP_2839-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR045028; DinG/Rad3-like."
