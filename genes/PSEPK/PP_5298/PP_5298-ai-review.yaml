taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_5298 is a PuuD-family gamma-glutamyl-gamma-aminobutyrate hydrolase. It
  hydrolyzes gamma-glutamyl-GABA to release GABA and glutamate in the terminal
  reaction of the gamma-glutamyl putrescine route. KT2440 encodes additional
  EC 3.5.1.94 paralogs, and their relative pathway contributions are unresolved.
