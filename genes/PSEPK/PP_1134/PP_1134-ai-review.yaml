description: >-
  PP_1134 is a 535-residue cytoplasmic protein of the uncharacterized COG2509 / PIRSF038984
  "FAD dependent protein" family (InterPro IPR028348, PANTHER PTHR42842:SF3, KEGG K07137
  "uncharacterized protein"). It has an N-terminal DUF8436 domain (PF28550, residues 1-60), a
  Rossmann-type FAD/NAD(P)-binding domain, and the family-specific C-terminal domain PF21688
  that is inserted into the FAD-binding domain. The closest structurally characterized homolog is
  Vibrio parahaemolyticus VP0956 (67.5% identity over 533 residues), whose structural-genomics
  crystal structure (PDB 3NLC) has FAD bound, so FAD binding can be transferred with
  confidence. No member of the family has a known activity or substrate: the only Swiss-Prot
  homolog detected by BLAST (E <= 1e-5) is the equally uncharacterized Clostridium
  beijerinckii Cbei_0202 (48.0%), and no characterized UbiI/UbiH-type hydroxylase, FixC/ETF-QO,
  geranylgeranyl reductase or other named FAD oxidoreductase is detected at that threshold.
  The FAD-binding fold makes an oxidoreductase activity likely, but whether it acts as a
  dehydrogenase, oxidase or reductase, and on what, is unknown. In KT2440 RB-TnSeq data PP_1134
  mutants show no significant phenotype in 300 experiments (|fitness| <= 0.59, no |t| >= 4),
  cofitness partners are weak (max 0.44), and its neighbours (NhaA, an IS element, uncharacterized
  exported proteins, a Liv-type ABC transporter) do not indicate a pathway. The dashboard query
  NZ_BCAU01000123.1_43 is 99.6% identical to Q88NS1 over 535 aligned residues, differing by an
  8-residue N-terminal extension from an upstream start call and two conservative substitutions.
