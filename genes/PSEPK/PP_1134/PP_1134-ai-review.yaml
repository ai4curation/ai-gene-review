  review:
    summary: >-
      FAD binding transferred from the 67.5%-identical Vibrio VP0956, crystallized with FAD (PDB
      3NLC), and supported by the Rossmann FAD/NAD(P)-binding domain of PP_1134 itself.
    action: NEW
    reason: >-
      GOA has no annotations for Q88NS1. The PDB 3NLC structure of VP0956, which aligns over
      533 of 535 PP_1134 residues at 67.5% identity, contains bound FAD. At this identity over the
      full length the cofactor will carry over. Binding has not been measured for PP_1134.
