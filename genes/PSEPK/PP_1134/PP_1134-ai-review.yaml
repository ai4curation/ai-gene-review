- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_1134/PP_1134-bioinformatics/RESULTS.md
  qualifier: enables
  review:
    summary: >-
      Generic oxidoreductase activity inferred from the FAD/NAD(P)-binding fold; no reaction or
      substrate is known for any family member.
    action: NEW
    reason: >-
      The protein is a FAD-binding Rossmann-fold protein, and COG2509 is named "FAD-dependent
      dehydrogenase". That makes an oxidoreductase activity the most plausible broad class, but
      it rests on fold and family naming only: InterPro describes the family as uncharacterised,
      no member has been assayed, and no characterized homolog was found. Nothing more specific
      than GO:0016491 is justified. This is a hedged prediction.
    supported_by:
    - reference_id: file:PSEPK/PP_1134/PP_1134-bioinformatics/RESULTS.md
      supporting_text: 'InterPro IPR028348 (PIRSF038984) "FAD dependent protein": "This entry represents uncharacterised FAD dependent proteins. Their function is not clear."'
    - reference_id: file:PSEPK/PP_1134/PP_1134-deep-research-claude-code.md
      supporting_text: The most a GO annotation could defensibly say is the broad "oxidoreductase activity" (GO:0016491), and even that is inferred from the fold rather than shown.
