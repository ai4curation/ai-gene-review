    - reference_id: file:PSEPK/PP_1134/PP_1134-dashboard-prediction-evidence/homology_results.json
      supporting_text: '"desc": "Chain A, Uncharacterized protein VP0956 [Vibrio parahaemolyticus]",'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016491
    label: oxidoreductase activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Plausible but not established. An FAD-binding Rossmann protein is most likely a redox
      enzyme, and COG2509 is named "FAD-dependent dehydrogenase", but that name is a
      general-function prediction and InterPro describes IPR028348 as uncharacterised FAD
      dependent proteins of unclear function. No family member has an assayed activity: the
      only Swiss-Prot homolog (Cbei_0202, 48.0%) and the only PDB homolog (VP0956, 67.5%) are
      both uncharacterized, and KT2440 fitness gives no phenotype. Some FAD-binding Rossmann
      proteins are not oxidoreductases in the GO sense, so the fold alone does not settle it.
      Following the rubric's preference for UNC when a novel term rests only on domains, this is
      UNC rather than COR. Nothing refutes it. The companion gene review records the term as a
      hedged ISS proposal, because it is the most specific defensible molecular-function class.
    supported_by:
    - reference_id: file:PSEPK/PP_1134/PP_1134-dashboard-prediction-evidence/homology_results.json
      supporting_text: '"desc": "RecName: Full=Uncharacterized protein Cbei_0202; AltName: Full=ORF1 [Clostridium beijerinckii NCIMB 8052]",'
