description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_BCAU01000123.1_43 is "FAD-dependent dehydrogenase family protein, substrate undetermined"
  (tier B), with two GO terms, GO:0016491 oxidoreductase activity and GO:0071949 FAD binding.
  The query is 99.6% identical to KT2440 PP_1134 (Q88NS1) over 535 aligned residues (it carries
  an 8-residue N-terminal extension, MAGILDPA, from an upstream start call), so it is scored on
  that accession; GOA holds no annotations for Q88NS1. The call is well calibrated. The protein
  belongs to the uncharacterized COG2509 / PIRSF038984 / PTHR42842 "FAD dependent protein"
  family, which InterPro describes as of unclear function; BLAST of Q88NS1 against Swiss-Prot
  finds only the uncharacterized Clostridium Cbei_0202 (48.0%), and against PDB only the
  structural-genomics structure of Vibrio VP0956 (3NLC, 67.5%), which has FAD bound. No
  characterized homolog at >= 40% identity names a substrate, and the protein is not a member
  of the UbiI/UbiH, FixC/ETF-QO or geranylgeranyl-reductase families at a detectable level. The
  annotator correctly rejected the disulfide reductase, amine oxidase and BaiO suggestions,
  which came from weaker homologs (46-49%) or single domain hits on homologs. KT2440 RB-TnSeq
  data (pulled from BERDL because the Fitness Browser returned 403) show no phenotype in 300
  experiments, consistent with the annotator's statement that fitness does not resolve function.
  FAD binding is supported by the FAD-bound 67.5%-identical structure (COR). Oxidoreductase
  activity is the most plausible broad class for an FAD-binding Rossmann protein, but no
  activity has been shown for any family member, so it is scored UNC. The word "dehydrogenase"
  in the call comes from the COG2509 name and is not itself evidence.
