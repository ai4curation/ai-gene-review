- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0071949
    label: FAD binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and novel. The query's InterProScan hits (PIRSF038984 FAD dependent protein,
      Gene3D/SUPERFAMILY FAD/NAD(P)-binding domain) place it in the FAD/NAD(P)-binding Rossmann
      superfamily, and the 67.5%-identical Vibrio VP0956, aligned over 533 of 535 residues, was
      crystallized with FAD bound (PDB 3NLC). GOA holds no annotations for Q88NS1, so this is
      COR rather than CNN. FAD binding has not been measured for PP_1134 itself.
    supported_by:
