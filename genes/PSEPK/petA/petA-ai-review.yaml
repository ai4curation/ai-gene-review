id: Q88N95
gene_symbol: petA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetA is the Rieske 2Fe-2S subunit of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. Its N-terminal transmembrane segment anchors the protein in the cytoplasmic membrane while the cluster-bearing head domain faces the periplasm, where it abstracts the first, high-potential electron from quinol oxidized at the cytochrome b Qo site and passes it to cytochrome c1. Because the 2Fe-2S cluster is assembled in the cytoplasm, the protein is exported folded and cofactor-loaded by the twin-arginine translocation pathway. PetA contributes to the assembled quinol:cytochrome c reductase reaction but does not independently catalyze the complete Q cycle.'
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: PetA is anchored in the bacterial cytoplasmic membrane by a single N-terminal transmembrane segment, with its Rieske head domain exposed to the periplasm.
      action: ACCEPT
      reason: The UniProt record states cell-membrane localization with a single-pass topology, which maps directly onto GO:0005886 for a bacterium.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: Single-pass membrane protein
        - reference_id: file:PSEPK/petA/petA-deep-research-openscientist.md
          supporting_text: It is membrane-anchored with a periplasm-facing head and is imported folded via the Tat pathway (uncleaved signal = anchor).
  - term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        This is the whole-complex EC 7.1.1.8 reaction. PetA supplies the high-potential
        Rieske branch of that reaction but cannot perform quinol oxidation or cytochrome c
        reduction on its own: the petABC operon encodes three subunits and all three are
        required. The subunit-level molecular function PetA itself carries out is electron
        transfer (GO:0009055), which is absent from its GOA. The `enables` qualifier should
        therefore be replaced; GO:0008121 is properly retained as a contributes_to activity
        of complex III, as recorded in core_functions.
      action: MODIFY
      reason: >-
        Correct in substance but over-attributed at the subunit level, the same situation
        handled by MODIFY to GO:0009055 in genes/human/UQCRFS1/UQCRFS1-ai-review.yaml and
        genes/worm/isp-1/isp-1-ai-review.yaml for this same Rieske subunit and term. Since
        petA has no GO:0009055 row of its own, the replacement term must be proposed here
        rather than simply deferred to an existing annotation.
      proposed_replacement_terms:
        - id: GO:0009055
          label: electron transfer activity
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBUNIT: The main subunits of complex b-c1 are: cytochrome b, cytochrome c1 and the Rieske protein.'
        - reference_id: PMID:15948965
          supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
        - reference_id: PMID:23593508
          supporting_text: PetA, the Rieske Fe-S subunit of the ubiquinol-cytochrome c reductase
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Generic membrane localization is redundant with the more precise plasma membrane annotation.
      action: REMOVE
      reason: Retain GO:0005886 instead; the UniProt record specifies cell membrane, so the unqualified parent adds nothing.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetA directly binds the conserved Rieske 2Fe-2S center, one cluster per subunit, and this is the cofactor that makes it an electron carrier.
      action: ACCEPT
      reason: The UniProt cofactor statement and the Rieske family assignment both support direct, subunit-level cluster binding; unlike GO:0008121 this activity is not emergent from the complex.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: Name=[2Fe-2S] cluster; Xref=ChEBI:CHEBI:190135;
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: Note=Binds 1 [2Fe-2S] cluster per subunit.
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'MISCELLANEOUS: The Rieske protein is a high potential 2Fe-2S protein.'
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: >-
        The assembled bc1 complex releases protons to the periplasm during the Q cycle, but
        the proton chemistry itself happens at the PetB Qo and Qi quinone sites. PetA's
        contribution is to force the electron bifurcation that makes the cycle protonmotive,
        not to conduct protons.
      action: KEEP_AS_NON_CORE
      reason: >-
        Retain as a complex-level consequence rather than a PetA function. This is the
        treatment given to the same term on the same subunit type in
        genes/human/UQCRFS1/UQCRFS1-ai-review.yaml. Note the annotation is itself an
        inter-ontology inference from GO:0008121, whose `enables` attribution is being
        modified above.
      supported_by:
        - reference_id: PMID:21996020
          supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
        - reference_id: file:PSEPK/petA/petA-deep-research-openscientist.md
          supporting_text: This bifurcation is the essence of the protonmotive Q-cycle, releasing 2 H⁺ to the periplasm per QH₂ oxidized and doubling the charge separation efficiency of the complex.
  - term:
      id: GO:0045275
      label: respiratory chain complex III
    evidence_type: ISS
    original_reference_id: file:PSEPK/petA/petA-uniprot.txt
    qualifier: part_of
    review:
      summary: >-
        PetA is one of the three main subunits of the cytochrome b-c1 complex, yet complex
        membership is absent from its GOA while the co-operonic petB carries it by IEA.
      action: NEW
      reason: >-
        This is a membership claim, not a process claim: the UniProt SUBUNIT statement names
        the Rieske protein as a main subunit of complex b-c1, and the petABC operon
        architecture is established for bacterial bc1 complexes. The comparator check
        supports it rather than arguing against it -- the orthologous human Rieske subunit
        UQCRFS1 carries GO:0045275 by IDA and IC, and the cytochrome c1 subunit CYC1 by IPI,
        so GO does annotate individual complex III subunits to this term.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBUNIT: The main subunits of complex b-c1 are: cytochrome b, cytochrome c1 and the Rieske protein.'
        - reference_id: PMID:15948965
          supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
        - reference_id: file:PSEPK/petA/petA-deep-research-openscientist.md
          supporting_text: PetA is thus one component of a heteromeric, usually dimeric, membrane enzyme.
  - term:
      id: GO:0022904
      label: respiratory electron transport chain
    evidence_type: ISS
    original_reference_id: file:PSEPK/petA/petA-uniprot.txt
    qualifier: involved_in
    review:
      summary: >-
        PetA itself carries an electron through the respiratory chain -- it accepts one from
        quinol and hands it to cytochrome c1 -- so it does the work of this process rather
        than merely being required for it. The term is absent from petA's GOA though petB
        carries it.
      action: NEW
      reason: >-
        The bc1 complex is the obligatory entry point of the cytochrome c branch of the
        P. putida KT2440 branched aerobic respiratory chain, and PetA is its electron-input
        step. The orthologous human Rieske subunit UQCRFS1 carries GO:0022904 by IMP, so the
        subunit-level attribution is consistent with existing curation practice.
      supported_by:
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'FUNCTION: Component of the ubiquinol-cytochrome c reductase complex'
        - reference_id: PMID:21996020
          supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
        - reference_id: PMID:16958757
          supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
