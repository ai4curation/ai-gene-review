  - id: PMID:15948965
    title: 'Multiple Rieske genes in prokaryotes: exchangeable Rieske subunits in the cytochrome bc-complex of Rubrivivax gelatinosus.'
    findings:
      - statement: The bacterial bc1 complex is encoded by the petABC operon and consists of the Rieske iron-sulphur protein, the b-type cytochrome and the c1-type cytochrome.
        supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
      - statement: Purified bacterial PetA Rieske proteins contain correctly inserted 2Fe-2S clusters with high midpoint potentials, the signature of the respiratory rather than the ring-hydroxylating Rieske class.
        supporting_text: Electron paramagnetic resonance (EPR) spectroscopy and midpoint potential measurements showed typical [2Fe-2S] signals and E(m) values of +275 mV for both Rieske proteins.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quoted text is verbatim. Work is in Rubrivivax gelatinosus,
        not P. putida, so it supports the family-level petABC architecture and the
        high-potential Rieske class assignment by homology, not a P. putida measurement.
  - id: PMID:21996020
    title: X-ray structure of the dimeric cytochrome bc(1) complex from the soil bacterium Paracoccus denitrificans at 2.7-Å resolution.
    findings:
      - statement: The respiratory bc1 complex couples ubiquinol-to-cytochrome-c electron transfer to generation of proton motive force.
        supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Structural work on the Paracoccus
        denitrificans complex, cited here for the conserved mechanism of the bacterial bc1
        complex rather than for P. putida-specific evidence.
  - id: PMID:23593508
    title: Mislocalization of Rieske protein PetA predominantly accounts for the aerobic growth defect of Tat mutants in Shewanella oneidensis.
    findings:
      - statement: PetA is identified directly as the Rieske Fe-S subunit of ubiquinol-cytochrome c reductase, and its Tat signal sequence resists cleavage after membrane insertion, leaving it as an N-terminal anchor.
        supporting_text: PetA, the Rieske Fe-S subunit of the ubiquinol-cytochrome c reductase
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached record has full text from PMC; quote verified verbatim. Experiments are in
        Shewanella oneidensis; cited for the conserved identity and Tat-dependent topology of
        bacterial PetA.
  - id: PMID:17188684
    title: The twin-arginine translocation pathway is necessary for correct membrane insertion of the Rieske Fe/S protein in Legionella pneumophila.
    findings:
      - statement: The Tat pathway is required for correct membrane insertion of bacterial PetA, consistent with export of a pre-folded, cluster-loaded protein.
        supporting_text: We conclude that the Tat pathway is necessary for correct membrane insertion of L. pneumophila PetA.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Legionella pneumophila work, cited for
        the Tat route that explains the periplasmic placement of the Rieske head domain.
  - id: PMID:16958757
    title: Inactivation of the Pseudomonas putida cytochrome o ubiquinol oxidase leads to a significant change in the transcriptome and to increased expression of the CIO and cbb3-1 terminal oxidases.
    findings:
      - statement: P. putida KT2440 respires through a branched aerobic chain with several terminal oxidases, which is the physiological context the bc1 complex feeds.
        supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. This is the one cited paper performed in
        P. putida KT2440 itself, though it concerns the terminal oxidases rather than petA.
  - id: file:PSEPK/petA/petA-uniprot.txt
    title: UniProtKB entry for petA (Q88N95)
    findings:
      - statement: >-
          Unreviewed TrEMBL record, PE 3 inferred from homology. Assigns the Rieske
          iron-sulfur protein family, a single 2Fe-2S cluster per subunit, cell-membrane
          single-pass topology, and the TAT_signal domain (IPR006311).
  - id: file:PSEPK/petA/petA-goa.tsv
    title: QuickGO GOA annotations for petA
    findings:
      - statement: The fetched table is the complete existing-annotation set reviewed here; all five rows are IEA and none asserts GO:0009055, GO:0045275 or GO:0022904.
  - id: file:PSEPK/petA/petA-deep-research-openscientist.md
    title: OpenScientist PSEPK petA synthesis
    findings:
      - statement: >-
          Direct analysis of the Q88N95 sequence confirms the twin-arginine Tat motif at
          residues 10-12 and the His2Cys2 Rieske cluster ligand boxes (Cys124/His126,
          Cys154/His155) with the cluster-stabilizing Cys129-Cys152 disulfide, discriminating
          PP_1317 from the low-potential ring-hydroxylating Rieske oxygenases common in
          Pseudomonas.
