taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetA is the Rieske 2Fe-2S subunit of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. Its membrane-anchored mobile domain accepts the high-potential electron generated by quinol oxidation at cytochrome b and transfers it to cytochrome c1. PetA contributes to the assembled quinol:cytochrome c reductase reaction but does not independently catalyze the complete Q cycle.'
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: PetA is membrane anchored as a subunit of the bacterial bc1 complex.
      action: ACCEPT
      reason: Supported by the UniProt transmembrane segment and cell-membrane localization.
  - term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: PetA contributes the Rieske branch to this assembled-complex reaction but does not independently enable the complete quinol:cytochrome c reductase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: The full reaction requires PetA, PetB, and PetC; retain electron transfer and 2Fe-2S binding as direct subunit functions.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Generic membrane localization is redundant with the more precise plasma membrane annotation.
      action: REMOVE
      reason: Retain GO:0005886 instead.
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetA directly binds the conserved Rieske 2Fe-2S center.
      action: ACCEPT
      reason: Supported by the reviewed family assignment, UniProt cofactor statement, and conserved ligands.
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: The PetABC Q cycle supports vectorial proton movement across the membrane.
      action: ACCEPT
      reason: Appropriate biological-process annotation for a required subunit of the proton-translocating bc1 complex.
