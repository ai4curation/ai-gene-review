suggested_questions:
  - question: What cytochrome c partners accept electrons from the P. putida KT2440 PetABC complex under different respiratory conditions?
  - question: Is the PetA Tat signal peptide retained as a transmembrane anchor in P. putida, as reported for Shewanella oneidensis, or is it cleaved?
suggested_experiments:
  - description: Purify PetABC and measure quinol:cytochrome c reductase kinetics and proton translocation after disrupting the PetA Rieske ligands or hinge mobility.
  - description: Measure the midpoint potential and EPR signature of the P. putida KT2440 PetA 2Fe-2S cluster to confirm the high-potential assignment inferred from sequence and family.
