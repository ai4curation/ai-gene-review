    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000104
    title: Electronic Gene Ontology annotations created by transferring manual GO annotations between related proteins based on shared sequence features
    findings: []
  - id: GO_REF:0000108
    title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: PMID:15948965
    title: 'Multiple Rieske genes in prokaryotes: exchangeable Rieske subunits in the cytochrome bc-complex of Rubrivivax gelatinosus.'
    findings:
      - statement: The bacterial bc1 complex is encoded by the petABC operon and consists of the Rieske iron-sulphur protein, the b-type cytochrome and the c1-type cytochrome.
        supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Work is in Rubrivivax gelatinosus, so it
        supports the family-level petABC architecture by homology rather than a P. putida
        measurement.
  - id: PMID:21996020
    title: X-ray structure of the dimeric cytochrome bc(1) complex from the soil bacterium Paracoccus denitrificans at 2.7-Å resolution.
    findings:
      - statement: The respiratory bc1 complex couples ubiquinol-to-cytochrome-c electron transfer to generation of proton motive force, the coupling that PetB's Qo/Qi sites implement.
        supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Structural work on the Paracoccus
        denitrificans complex, cited for the conserved mechanism of the bacterial bc1 complex.
  - id: PMID:16958757
    title: Inactivation of the Pseudomonas putida cytochrome o ubiquinol oxidase leads to a significant change in the transcriptome and to increased expression of the CIO and cbb3-1 terminal oxidases.
    findings:
      - statement: P. putida KT2440 respires through a branched aerobic chain with several terminal oxidases, the context in which the bc1 complex oxidizes the ubiquinol pool.
        supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Cached abstract verified; quote is verbatim. Performed in P. putida KT2440 itself,
        though it concerns the terminal oxidases rather than petB.
  - id: file:PSEPK/petB/petB-uniprot.txt
    title: UniProtKB entry for petB (Q88N94)
    findings:
      - statement: >-
          Unreviewed TrEMBL record, PE 3 inferred from homology. Assigns the cytochrome b
          family, two non-covalently bound b hemes, multi-pass membrane topology, and the
          PTHR19271 CYTOCHROME B family.
  - id: file:PSEPK/petB/petB-goa.tsv
    title: QuickGO GOA annotations for petB
    findings:
      - statement: The fetched table is the complete existing-annotation set reviewed here; all nine rows are IEA, and it is the only one of the three subunits whose GOA already carries GO:0045275 and GO:0022904.
  - id: file:PSEPK/petA/petA-uniprot.txt
    title: UniProtKB entry for petA (Q88N95)
    findings:
      - statement: The co-operonic Rieske subunit carries an explicit 'Cell membrane' subcellular location, which is the basis for refining petB's generic 'Membrane' to GO:0005886.
