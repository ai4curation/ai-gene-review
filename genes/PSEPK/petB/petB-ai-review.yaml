    contributes_to_molecular_function:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    directly_involved_in:
      - id: GO:0022904
        label: respiratory electron transport chain
      - id: GO:1902600
        label: proton transmembrane transport
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0045275
      label: respiratory chain complex III
    supported_by:
      - reference_id: file:PSEPK/petB/petB-uniprot.txt
        supporting_text: Belongs to the cytochrome b family.
      - reference_id: file:PSEPK/petB/petB-uniprot.txt
        supporting_text: Note=Binds 2 heme groups non-covalently.
suggested_questions:
  - question: Which quinone species and inhibitors define the Qo and Qi site preferences of P. putida KT2440 PetB?
  - question: Does P. putida KT2440 PetB carry a plasma-membrane location assertion in its own right, or should GO:0005886 be inferred only from complex membership with PetA?
suggested_experiments:
  - description: Measure PetABC Q-cycle kinetics, heme spectra, and proton translocation after targeted mutation of conserved PetB Qo/Qi-site residues.
