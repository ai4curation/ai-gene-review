id: Q88N94
gene_symbol: petB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetB is the cytochrome b membrane core of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. It binds the bL and bH hemes, forms the Qo and Qi quinone sites, and conducts the low-potential electron branch of the Q cycle. Because both quinone sites sit within PetB, it is also the subunit at which the protons released to the periplasm and consumed from the cytoplasm are handled. PetB contributes to the assembled quinol:cytochrome c reductase reaction but does not independently perform the complete three-subunit activity.'
existing_annotations:
  - term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetB contains the quinone sites and b-heme relay but does not independently enable the complete PetABC quinol:cytochrome c reductase reaction.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The full activity is emergent from PetA, PetB and PetC; retain electron transfer
        (GO:0009055, already annotated below) as the direct PetB function and GO:0008121 as a
        contributes_to activity of the complex, as recorded in core_functions.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: 'SUBUNIT: The main subunits of complex b-c1 are: cytochrome b, cytochrome c1 and the Rieske protein.'
        - reference_id: PMID:15948965
          supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetB directly transfers electrons through its two non-covalently bound b hemes (bL and bH) during the Q cycle.
      action: ACCEPT
      reason: This is the subunit-level molecular function PetB itself performs, supported by the cytochrome b family assignment and the UniProt statement that it binds two heme groups.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: Belongs to the cytochrome b family.
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: Note=Binds 2 heme groups non-covalently.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: >-
        PetB is an integral multi-pass membrane protein, but the UniProt record gives only the
        unqualified parent term 'Membrane'. In a Gram-negative bacterium a respiratory complex
        III subunit resides in the cytoplasmic (inner) membrane, and the co-operonic petA
        carries GO:0005886 from UniProtKB-SubCell:SL-0039.
      action: MODIFY
      reason: >-
        The essence is correct but the term is under-specific, and the module
        (modules/bacterial_cytochrome_bc1_complex.yaml) already asserts GO:0005886 for this
        subunit. Replacing rather than removing keeps a location on the gene, which plain
        REMOVE (the action used for petA's GO:0016020) would not, because petB has no
        GO:0005886 row of its own. The plasma-membrane inference comes from complex
        membership with PetA rather than from petB's own UniProt subcellular-location line.
      proposed_replacement_terms:
        - id: GO:0005886
          label: plasma membrane
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: Multi-pass membrane protein
        - reference_id: file:PSEPK/petA/petA-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        Broad grouping term. It is a correct ancestor of the complex-level reaction
        GO:0008121, which descends from it via GO:0016679, but it is not an ancestor of
        GO:0009055 electron transfer activity -- that term sits directly under
        molecular_function and is outside the oxidoreductase branch entirely. So GO:0016491 is
        neither redundant with nor subsumed by the direct PetB function; it is simply a much
        less informative way of describing the complex-level chemistry.
      action: KEEP_AS_NON_CORE
      reason: >-
        Correct at a high level and retained as supporting classification, but the informative
        MF for PetB is GO:0009055 and the complex-level reaction is GO:0008121. Ancestry
        checked against the GO hierarchy via OLS rather than assumed.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: 'FUNCTION: Component of the ubiquinol-cytochrome c reductase complex'
  - term:
      id: GO:0022900
      label: electron transport chain
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: >-
        The direct parent of the co-annotated GO:0022904 respiratory electron transport chain
        (ancestry confirmed against the GO hierarchy). Correct but strictly less informative
        than the child term PetB already carries, so it adds no coverage.
      action: KEEP_AS_NON_CORE
      reason: >-
        Retained as a redundant-but-not-incorrect broader annotation rather than promoted
        alongside its own child, which would duplicate the same claim at two granularities.
        GO:0022904 is the term that belongs in core_functions.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: 'KW   Electron transport'
  - term:
      id: GO:0022904
      label: respiratory electron transport chain
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: >-
        PetB performs the committed step of this process: it oxidizes quinol at its Qo site
        and passes the low-potential electron through bL and bH to reduce quinone at Qi. This
        is participation, not mere requirement, and it is the correct granularity for a
        bacterial respiratory chain.
      action: ACCEPT
      reason: >-
        The most informative biological-process term for PetB, and the one recorded in
        core_functions. Supported by the cytochrome b family assignment, the two-heme
        cofactor complement, and the role of bc1 as the entry point of the cytochrome c
        branch of the P. putida KT2440 respiratory chain.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: 'FUNCTION: Component of the ubiquinol-cytochrome c reductase complex'
        - reference_id: PMID:16958757
          supporting_text: Pseudomonas putida KT2440 contains a branched aerobic respiratory chain with several terminal oxidases.
  - term:
      id: GO:0045275
      label: respiratory chain complex III
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: >-
        A membership claim rather than an activity claim, and the best-supported one of the
        three subunits: UniProt names cytochrome b first among the main subunits of complex
        b-c1, and the petABC operon encodes exactly this three-subunit enzyme.
      action: ACCEPT
      reason: >-
        Directly supported by the UniProt SUBUNIT statement and the established petABC operon
        architecture. This is the term from which the other subunit-level assertions in this
        module follow, and the same annotation is proposed for petA and petC where GOA lacks
        it.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: 'SUBUNIT: The main subunits of complex b-c1 are: cytochrome b, cytochrome c1 and the Rieske protein.'
        - reference_id: PMID:15948965
          supporting_text: Bacterial cytochrome bc1-complex encoded by the petABC operon consists of three subunits, the Rieske iron-sulphur protein, the b-type cytochrome, and the c1-type cytochrome.
  - term:
      id: GO:0046872
      label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: PetB binds iron within its two b-type hemes, but this generic metal-binding term is not the most informative description of that cofactor chemistry.
      action: KEEP_AS_NON_CORE
      reason: Retain as supporting cofactor chemistry while prioritizing electron transfer; heme binding would be the specific term, and the iron is a constituent of the heme rather than independently coordinated.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: Name=heme b; Xref=ChEBI:CHEBI:60344;
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: >-
        Unlike PetA and PetC, PetB is the subunit where the proton chemistry actually happens:
        both quinone sites lie within it, so quinol deprotonation releasing protons to the
        periplasm at Qo and quinone protonation from the cytoplasm at Qi are PetB reactions.
        The vectorial proton movement of the Q cycle is therefore a direct PetB contribution.
      action: ACCEPT
      reason: >-
        Retained as a genuine PetB process rather than a complex-level side effect, which is
        why this term is handled differently here than in the petA review, where it is marked
        non-core.
      supported_by:
        - reference_id: file:PSEPK/petB/petB-uniprot.txt
          supporting_text: Note=Binds 2 heme groups non-covalently.
        - reference_id: PMID:21996020
          supporting_text: It couples electron transfer from ubiquinol to cytochrome c with generation of proton motive force which fuels ATP synthesis.
references:
