taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'PetB is the cytochrome b membrane core of the cytochrome bc1 respiratory complex in Pseudomonas putida KT2440. It binds the bL and bH hemes, forms the Qo and Qi quinone sites, and conducts the low-potential electron branch of the Q cycle. PetB contributes to the assembled quinol:cytochrome c reductase reaction but does not independently perform the complete three-subunit activity.'
existing_annotations:
  - term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetB contains the quinone sites and b-heme relay but does not independently enable the complete PetABC quinol:cytochrome c reductase reaction.
      action: MARK_AS_OVER_ANNOTATED
      reason: The full activity is emergent from PetA, PetB, and PetC; retain electron transfer as the direct PetB function.
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: PetB directly transfers electrons through its bL and bH hemes during the Q cycle.
      action: ACCEPT
      reason: Supported by the cytochrome b family assignment and UniProt b-heme cofactor statements.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: PetB is an integral multi-pass membrane protein.
      action: ACCEPT
      reason: Supported by UniProt membrane topology.
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Broad oxidoreductase activity is less informative than the direct electron-transfer role.
      action: KEEP_AS_NON_CORE
      reason: Correct at a high level but subsumed by electron transfer activity and the complex-level reaction.
  - term:
