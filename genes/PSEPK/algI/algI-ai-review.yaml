id: Q88ND2
gene_symbol: algI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgI is a multi-pass inner-membrane member of the membrane-bound acyltransferase
  family that participates in alginate O-acetylation. It is proposed to supply acetyl groups
  to periplasmic AlgJ and the AlgF-associated AlgX machinery, which modifies mannuronate residues
  in the polymer. Its physiological donor, immediate acceptor and detailed transfer chemistry
  remain unresolved.
