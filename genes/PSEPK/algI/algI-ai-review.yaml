    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AlgI participates in alginate O-acetylation, the specific maturation process
      supported by the evidence.
    action: MODIFY
    reason: The broad pathway annotation captures alginate maturation, but the characterized
      role is acetylation rather than synthesis of the mannuronate backbone. P. aeruginosa
      mutants still make unacetylated polymer. Replace with the supported modification process
      specified by this replacement; the correction describes the biological role and does
      not assume an ontology parent-child relationship. Isogenic P. aeruginosa algI deletion
      and complementation establish the ortholog role, and Q88ND2 retains the exact AlgI family,
      topology, and syntenic operon position.
    proposed_replacement_terms:
    - id: GO:0051979
      label: alginic acid acetylation
    supported_by:
    - reference_id: PMID:8636017
      supporting_text: This indicated that the algIJF gene products were not required for
        polymer biosynthesis.
    - reference_id: PMID:12003941
      supporting_text: each mutant produced alginate lacking O-acetyl groups.
    - reference_id: PMID:12003941
      supporting_text: defined nonpolar algI, algJ, and algF deletion mutants of P. aeruginosa
        strain FRD1 were constructed, and each mutant produced alginate lacking O-acetyl groups.
  supporting_entities:
