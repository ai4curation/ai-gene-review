id: Q88ND2
gene_symbol: algI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AlgI is a multi-pass inner-membrane acyltransferase-family component of the
  alginate O-acetylation machinery. With AlgJ and AlgF it transfers an acetyl
  donor across or through the inner-membrane complex for subsequent addition
  to O-2 and O-3 positions of mannuronate residues in periplasmic alginate.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: AlgI is a multi-pass bacterial inner-membrane protein.
      action: ACCEPT
      reason: The reviewed topology and membrane-bound acyltransferase-family assignment support this location.
      supported_by:
        - reference_id: file:PSEPK/algI/algI-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
  - term:
      id: GO:0016746
      label: acyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: AlgI is the membrane-bound acyl-transfer component of the alginate O-acetylation complex.
      action: ACCEPT
      reason: The exact donor and transient acceptor remain unresolved, so this broad valid term is preferable to assigning serine O-acetyltransferase or a fabricated substrate-specific activity.
      supported_by:
        - reference_id: file:PSEPK/algI/algI-uniprot.txt
          supporting_text: Belongs to the membrane-bound acyltransferase family
  - term:
      id: GO:0042121
      label: alginic acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AlgI specifically belongs to the post-polymerization alginate O-acetylation branch.
      action: MODIFY
      reason: GO:0051979 captures the machinery's direct biological process more precisely.
      proposed_replacement_terms:
        - id: GO:0051979
          label: alginic acid acetylation
