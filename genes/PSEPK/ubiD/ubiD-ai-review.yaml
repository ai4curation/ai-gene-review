id: Q88CG8
gene_symbol: ubiD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiD (PP_5213) encodes 3-octaprenyl-4-hydroxybenzoate carboxy-lyase (UbiD family,
  EC 4.1.1.98), a homohexameric decarboxylase that requires prenylated FMN (made by UbiX,
  PP_0548) and a divalent metal ion (Mn2+). It converts 4-hydroxy-3-polyprenylbenzoate to
  2-polyprenylphenol, the third step of ubiquinone biosynthesis, following UbiA
  prenylation. The enzyme is predicted to associate peripherally with the cytoplasmic face
  of the inner membrane, where its prenylated substrate resides. Function is inferred from
  the UbiD family and Escherichia coli genetics; the KT2440 protein has not been assayed.
