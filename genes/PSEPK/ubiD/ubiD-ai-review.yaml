  supporting_entities:
  - PANTHER:PTN002409573
  review:
    summary: >-
      TreeGrafter cytosol from the bacterial UbiD node PTN000764659 (PAINT IBD seeded by E.
      coli UbiD, P0AAB4). Accepted as the core location, as for the E. coli exemplar.
    action: ACCEPT
    reason: >-
      The PAINT curator placed cytosol on the bacterial UbiD node from E. coli UbiD data:
      E. coli UbiD is in the cytosolic proteome and much of its decarboxylase activity is
      recovered in the soluble fraction. PP_5213 has the same non-transmembrane hexameric
      UbiD fold and no experimental location of its own, so the inherited cytosol location
      is the best-supported one. UbiD is not one of the seven proteins of the E. coli Ubi
      metabolon, so this rests on the UbiD data alone.
    supported_by:
    - reference_id: file:PSEPK/ubiD/ubiD-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Homohexamer. {ECO:0000255|HAMAP-Rule:MF_01636}.'
    - reference_id: PMID:782527
