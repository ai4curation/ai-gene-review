    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002830
  - PANTHER:PTN002409573
  review:
    summary: >-
      Family-level carboxy-lyase activity (InterPro IPR002830, PAINT IBD at the PTHR30108 root
      PTN000764648). True but general; refine to the specific decarboxylase.
    action: MODIFY
    reason: >-
      The PTHR30108 family includes decarboxylases with different substrates (UbiD, Fdc1
      ferulic acid decarboxylase), which is why PAINT places only carboxy-lyase activity at
      the root. Q88CG8 is in the bacterial UbiD clade, where the specific activity GO:0008694
