suggested_questions:
- question: >-
    Does Q88CG8 act mainly at the membrane or in a soluble pool, and does it prefer the
    nonaprenyl substrate of KT2440?
suggested_experiments:
- description: >-
    Purify Q88CG8 with UbiX-made prFMN and Mn2+, compare decarboxylation of polyprenyl-chain
    substrate analogues, fractionate KT2440 cells to locate the endogenous protein, and test
    intermediate accumulation in a PP_5213 deletion.
