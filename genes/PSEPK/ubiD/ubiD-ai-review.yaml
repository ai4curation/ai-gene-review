  review:
    summary: >-
      Core molecular function (RHEA:41680, EC 4.1.1.98), chain-length neutral as defined.
    action: ACCEPT
    reason: >-
      Q88CG8 is a HAMAP MF_01636 / InterPro IPR023677 bacterial UbiD with the conserved
      prFMN-binding positions and HAMAP active site. The UbiD/UbiX pair forms a two-component
      prFMN-dependent decarboxylase system. GO:0008694 is defined on a generic
