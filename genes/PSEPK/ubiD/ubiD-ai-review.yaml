- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR023677
  - UniProtKB-SubCell:SL-0039
  - UniRule:UR000081062
  review:
    summary: >-
      HAMAP MF_01636 places UbiD as a peripheral protein of the cell (inner) membrane. Kept
      as a plausible but untested, non-core location, as for the E. coli exemplar.
    action: KEEP_AS_NON_CORE
    reason: >-
      The UbiD substrate, 3-polyprenyl-4-hydroxybenzoate, is the first membrane-bound
      intermediate made by the integral membrane UbiA, so a peripheral, substrate-driven
      association with the inner membrane is plausible, and the curated rule assigns it; no
      transmembrane segment is predicted. The rule rests on the E. coli inference of Leppik
      et al., and the purified E. coli enzyme is soluble. Not tested for PP_5213, so the
      membrane is kept as non-core and cytosol is the core location.
    supported_by:
    - reference_id: file:PSEPK/ubiD/ubiD-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane {ECO:0000255|HAMAP-Rule:MF_01636};
        Peripheral membrane protein {ECO:0000255|HAMAP-Rule:MF_01636}.'
    - reference_id: file:PSEPK/ubiA/ubiA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: generating the first membrane-bound Q intermediate 3-octaprenyl-4-hydroxybenzoate.
