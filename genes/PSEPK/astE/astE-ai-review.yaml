id: Q88EI7
gene_symbol: astE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AstE (PP_4475) is a zinc-dependent succinylglutamate desuccinylase that
  completes the bacterial arginine succinyltransferase pathway. It hydrolyzes
  the amide bond of N-succinyl-L-glutamate to produce L-glutamate and succinate,
  connecting arginine catabolism to central carbon and nitrogen metabolism.
