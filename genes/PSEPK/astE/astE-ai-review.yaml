    label: L-arginine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AstE performs the terminal desuccinylation reaction of the AST arginine-catabolic pathway.
    action: ACCEPT
    reason: The reviewed Q88EI7 pathway assignment and AstE-specific family evidence support this process annotation.
    additional_reference_ids:
    - PMID:9393691
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        The aruR, aruC, aruD, aruB, and aruE genes specify the ArgR regulatory protein, N2-succinylornithine 5-aminotransferase, N-succinylglutamate 5-semialdehyde dehydrogenase, N2-succinylarginine dihydrolase, and N-succinylglutamate desuccinylase, respectively
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Q88EI7 is predicted to bind one catalytic zinc ion per subunit.
    action: KEEP_AS_NON_CORE
    reason: Zinc binding is required supporting chemistry, while GO:0009017 states the informative reaction.
