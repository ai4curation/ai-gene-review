- term:
    id: GO:0009017
    label: succinylglutamate desuccinylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the exact conserved catalytic activity of AstE.
    action: ACCEPT
    reason: The reviewed Q88EI7 record assigns EC 3.5.1.96 and RHEA:15169 with an AstE-specific HAMAP rule.
    supported_by:
    - reference_id: file:PSEPK/astE/astE-uniprot.txt
      supporting_text: Reaction=N-succinyl-L-glutamate + H2O = L-glutamate + succinate;
- term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The ester-bond hydrolase mapping conflicts with the amide hydrolysis catalyzed by AstE.
    action: REMOVE
    reason: >-
      RHEA:15169 and GO:0009017 describe cleavage of the C-N amide bond in
      N-succinyl-L-glutamate, not an ester bond. The domain-level mapping is
      therefore chemically incorrect for this protein.
    supported_by:
    - reference_id: file:PSEPK/astE/astE-uniprot.txt
      supporting_text: Reaction=N-succinyl-L-glutamate + H2O = L-glutamate + succinate;
- term:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: This broad amide-hydrolase parent is chemically consistent with AstE activity.
    action: KEEP_AS_NON_CORE
    reason: GO:0009017 is the informative substrate-specific child term.
