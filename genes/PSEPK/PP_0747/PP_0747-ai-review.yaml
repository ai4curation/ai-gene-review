taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0747 encodes a predicted hypoxanthine-guanine phosphoribosyltransferase
  that uses PRPP to salvage hypoxanthine and guanine as IMP and GMP. The
  protein belongs to the PTHR43340:SF1 hypoxanthine phosphoribosyltransferase
  subfamily, and UniProt assigns both EC 2.4.2.8 reactions in their
  physiological salvage direction. The KT2440 protein is unreviewed and has not
  been directly assayed, so its dual substrate specificity remains an
  orthology- and rule-supported assignment.
