suggested_questions:
  - question: >-
      Does purified PP_0747 efficiently use both hypoxanthine and guanine, and
      how does its substrate preference compare with Xpt?
suggested_experiments:
  - description: >-
      Measure PP_0747 kinetics with hypoxanthine, guanine, xanthine, and PRPP,
      then quantify purine-base salvage in a PP_0747 deletion strain.
    experiment_type: enzyme substrate panel and isotope-tracing metabolomics
