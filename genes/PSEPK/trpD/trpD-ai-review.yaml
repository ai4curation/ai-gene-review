id: Q88QR7
gene_symbol: trpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  trpD (PP_0421) encodes anthranilate phosphoribosyltransferase (EC 2.4.2.18), a
  family-3 glycosyltransferase. In the second step of L-tryptophan
  biosynthesis, it transfers the 5-phosphoribosyl group of
  5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to anthranilate, giving
  N-(5'-phosphoribosyl)-anthranilate and diphosphate. The enzyme is a
  homodimer that binds two Mg2+ ions per monomer to coordinate the
  PRPP-diphosphate group. In Pseudomonas putida KT2440, trpD is the middle
  gene of the trpGDC operon and is a monofunctional enzyme; in enteric
  bacteria the same activity is the C-terminal domain of a TrpG-TrpD fusion. A
  transposon insertion in trpD gives a tryptophan auxotroph that indole, but
  not anthranilate, rescues.
