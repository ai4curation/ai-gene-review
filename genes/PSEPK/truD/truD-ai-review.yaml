core_functions:
- description: >-
    Isomerization of uridine 13 in the D-stem of tRNAs (tRNA(Glu) in the E. coli
    ortholog) to pseudouridine, by a stand-alone cytoplasmic TruD-family enzyme
    with catalytic Asp81; the P. putida tRNA substrates are untested.
  molecular_function:
    id: GO:0160150
    label: tRNA pseudouridine(13) synthase activity
  directly_involved_in:
