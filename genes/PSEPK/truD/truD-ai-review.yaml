- id: PMID:12756329
  title: A novel unanticipated type of pseudouridine synthase with homologs in bacteria, archaea, and eukarya.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery of E. coli TruD (YgbO) as the tRNA(Glu) pseudouridine 13 synthase, with deletion, complementation, in vitro activity and the essential GXKD aspartate. Ortholog of the P. putida protein (37.3% identity).
  findings:
  - statement: E. coli TruD is required for tRNA(Glu) pseudouridine 13 in vivo.
    supporting_text: Deletion of the ygbO gene caused the loss of tRNA(Glu) pseudouridine13 and plasmid-borne restoration of the structural gene restored pseudouridine13.
  - statement: Purified E. coli TruD forms only pseudouridine 13 in a tRNA(Glu) transcript.
    supporting_text: Reaction of the overexpressed gene product, renamed TruD, with a tRNA(Glu) transcript made in vitro also yielded only pseudouridine13.
  - statement: The GXKD aspartate (D80) is essential for activity.
    supporting_text: Clearly, D80 is essential for Ψ activity.
- id: PMID:19664587
  title: Enzymatic characterization and mutational studies of TruD--the fifth family of pseudouridine synthases.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Kinetics and mutagenesis of E. coli TruD; abstract only read.
  findings:
  - statement: A TruD-family-specific Glu is the likely general base.
    supporting_text: Our studies indicate that a Glu, strictly conserved in only TruD family is likely to be the general base in TruD.
- id: PMID:15208439
  title: Crystal structure of the highly divergent pseudouridine synthase TruD reveals a circular permutation of a conserved fold.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: E. coli TruD structure; catalytic domain plus TruD-specific insertion domain.
  findings:
  - statement: The TruD-specific domain may clamp substrate RNA.
    supporting_text: A domain that appears to be unique to TruD/Pus7p family enzymes hinges over the catalytic domain, possibly serving to clasp the substrate RNAs.
- id: PMID:40138658
  title: tRNA pseudouridine synthase D (TruD) from Thermus thermophilus modifies U13 in tRNA(Asp), tRNA(Glu), and tRNA(Gln) and U35 in tRNA(Tyr).
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Distant bacterial ortholog; shows TruD substrate range beyond tRNA(Glu) U13. Abstract only read.
  findings:
  - statement: Thermus TruD modifies U13 of tRNA(Asp), tRNA(Glu) and tRNA(Gln).
    supporting_text: Our data reveal that TruD recognizes tRNAAsp, tRNAGlu, and tRNAGln as substrate tRNAs.
  - statement: Thermus TruD also modifies U35 of tRNA(Tyr).
    supporting_text: In addition, we discover that TruD modifies U35 in tRNATyr, which has previously been reported as a substrate of RluF in Escherichia coli
