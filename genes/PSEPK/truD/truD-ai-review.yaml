description: >-
  TruD (PP_1619) is the 352-residue TruD-family tRNA pseudouridine synthase of
  Pseudomonas putida KT2440. It has the TruD catalytic and insertion domains
  over its full length (HAMAP MF_01082, Pfam PF01142, PROSITE TruD signature)
  and is 37.3% identical over 343 aligned residues to Escherichia coli TruD
  (Q57261). E. coli TruD is the founding member of the family: it was purified
  as the activity that forms pseudouridine 13 in tRNA(Glu), its deletion
  removes that pseudouridine, and the purified enzyme modifies only U13 of an
  in vitro tRNA(Glu) transcript (PMID:12756329). Its essential Asp80 in the
  GXKD motif and the proposed general base Glu31 (PMID:19664587) are both
  conserved in the P. putida protein (GLKD at 78-81, Asp81 and Glu32), as are
  four other annotated E. coli functional residues. By orthology the protein
  is a stand-alone, cytoplasmic tRNA uridine(13) to pseudouridine isomerase
  (EC 5.4.99.27). The protein has not been studied in P. putida, and the set
  of P. putida tRNAs it modifies is unknown. Thermus TruD also modifies U13 of
  tRNA(Asp) and tRNA(Gln) and U35 of tRNA(Tyr) (PMID:40138658), so the
  substrate range may be wider than tRNA(Glu) U13. One miniTn5 insertion in
  PP_1619 was recovered among phenol-tolerant derivatives of a colR mutant
  (PMID:20398259). The downstream gene pcm (PP_1621) was hit four times in
  the same screen, so this phenotype may be a polar effect and says nothing
  about TruD activity.
