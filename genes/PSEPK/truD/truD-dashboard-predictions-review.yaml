predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0160150
    label: tRNA pseudouridine(13) synthase activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct. The query is a full-length TruD-family protein (HAMAP MF_01082
      6-342) that conserves the essential GXKD aspartate (Asp81) and the
      proposed general base (Glu32) of E. coli TruD, whose deletion, rescue and
      in vitro assays establish tRNA pseudouridine 13 synthase activity
      (PMID:12756329, PMID:19664587). The term is already in GOA for Q88MF2
      (IEA, GO_REF:0000120, from the HAMAP/Rhea rule), so it is not novel.
    supported_by:
    - reference_id: PMID:12756329
      supporting_text: Reaction of the overexpressed gene product, renamed TruD, with a tRNA(Glu) transcript made in vitro also yielded only pseudouridine13.
    - reference_id: file:PSEPK/truD/truD-dashboard-prediction-evidence/identity_results.json
      supporting_text: '"note": "Asp80 nucleophile; D80N/T loss of activity (PMID:12756329, 19664587)"'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0006400
    label: tRNA modification
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Correct but less specific than the available annotation. GOA already has
      GO:0031119 tRNA pseudouridine synthesis (UniRule IEA), a descendant of
      tRNA modification, and the companion review accepts it as the core
      process on the basis of the E. coli TruD deletion phenotype
      (PMID:12756329). The call's own text names the pseudouridine reaction,
      so the extractor chose a broader process term than the call supports.
    supported_by:
    - reference_id: PMID:12756329
      supporting_text: Deletion of the ygbO gene caused the loss of tRNA(Glu) pseudouridine13 and plasmid-borne restoration of the structural gene restored pseudouridine13.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005737
    label: cytoplasm
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct and not novel. DeepTMHMM predicts the whole chain cytoplasmic with
      no signal peptide, and TruD acts on tRNA, a cytoplasmic substrate. GOA
      already has the child term GO:0005829 cytosol (TreeGrafter IEA), which
      the companion review accepts. The extractor took the term from the
      phrase "predicted cytoplasmic topology", which here is a sound basis
      rather than a localization default, because the substrate is
      cytoplasmic. Cytoplasm versus cytosol is not a material loss of
      precision for a bacterial soluble enzyme, so CNN rather than LSP.
    supported_by:
    - reference_id: file:PSEPK/truD/truD-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: no signal peptide or membrane-spanning segment
