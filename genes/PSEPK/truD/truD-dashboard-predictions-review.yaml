description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for
  P. putida DOAB01000105.1_3 is "tRNA pseudouridine(13) synthase TruD,
  converting uridine at position 13 of tRNA to pseudouridine" (tier A), with
  three GO terms: GO:0160150 tRNA pseudouridine(13) synthase activity,
  GO:0006400 tRNA modification and GO:0005737 cytoplasm. The query is 99.7%
  identical over its full 352 residues to KT2440 PP_1619 (Swiss-Prot Q88MF2,
  TRUD_PSEPK), so it is scored on that accession. It is 37.3% identical over
  343 residues to E. coli TruD (Q57261), the biochemically characterized
  tRNA(Glu) pseudouridine 13 synthase (PMID:12756329). All six annotated
  E. coli functional residues are conserved, including the essential GXKD
  aspartate (query GLKD 78-81, Asp81) and the proposed general base Glu
  (query Glu32; PMID:19664587). The call is correct. It agrees with the
  UniProt HAMAP annotation and with existing GOA, so none of its terms are
  novel. The evidence the annotator saw was domain signatures, homolog locus
  names and a STRING orthogroup; no TruD biochemistry paper was in the
  PaperBLAST panel. The call's caution about tRNA species specificity is
  appropriate: Thermus TruD modifies U13 of three tRNAs and also U35 of
  tRNA(Tyr) (PMID:40138658). The one P. putida paper naming PP_1619 (a
  transposon hit in a phenol-tolerance screen, PMID:20398259) was rightly not
  used to assign function.
