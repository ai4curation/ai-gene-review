id: Q88DP2
gene_symbol: thiD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  thiD (PP_4782) encodes the ribokinase-fold hydroxymethylpyrimidine (HMP)/HMP-phosphate
  kinase of Pseudomonas putida KT2440, a 265-residue soluble protein of the ThiD/THI20
  family (PANTHER PTHR20858:SF17, NCBIfam HMP-P kinase domain IPR004399, CDD HMPP_kinase).
  By homology with characterised family members it phosphorylates
  4-amino-2-methyl-5-hydroxymethylpyrimidine phosphate (HMP-P), the product of ThiC, to
  the diphosphate HMP-PP (EC 2.7.4.7), the activated pyrimidine that thiamine-phosphate
  synthase ThiE couples to the thiazole phosphate to make thiamine monophosphate; it is
  also expected to phosphorylate free HMP to HMP-P (EC 2.7.1.49), allowing salvage of the
  pyrimidine moiety. thiD lies immediately upstream of thiE (PP_4783) in the genome. The
  enzyme acts in the cytoplasm. No experiment has been reported on the KT2440 protein
  itself; its function rests on family membership and conserved pathway context.
