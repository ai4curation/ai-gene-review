    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027533
  review:
    summary: >-
      ARBA machine-learning assignment of the root molecular-function term catalytic
      activity. The claim is true but uninformative: the protein is an HMP/HMP-P kinase.
    action: MODIFY
    reason: >-
      Correct but far too general. Q88DP2 carries the HMP/HMP-P kinase domain signatures
      (InterPro IPR004399, CDD cd01169) and sits in the ThiD/THI20 subfamily, whose
      characterised members phosphorylate HMP and HMP-P. The two specific kinase terms,
      both already carried by this gene (GO:0008972, GO:0008902), are is_a descendants of
      catalytic activity and replace it.
    proposed_replacement_terms:
    - id: GO:0008972
      label: phosphomethylpyrimidine kinase activity
    - id: GO:0008902
      label: hydroxymethylpyrimidine kinase activity
    supported_by:
    - reference_id: file:PSEPK/thiD/thiD-uniprot.txt
      supporting_text: InterPro; IPR004399; HMP/HMP-P_kinase_dom.
    - reference_id: file:PSEPK/thiD/thiD-uniprot.txt
      supporting_text: CDD; cd01169; HMPP_kinase; 1.
