suggested_questions:
- question: >-
    Does KT2440 ThiD (Q88DP2) phosphorylate both HMP and HMP-P with comparable efficiency,
    and does it contribute to growth on exogenous HMP when thiC is deleted?
suggested_experiments:
- description: >-
    Purify recombinant Q88DP2 and assay HMP and HMP-P kinase activities (ATP-dependent
    formation of HMP-P and HMP-PP by HPLC), and test whether a thiC thiD double mutant is
    rescued by HMP whereas a thiC single mutant is.
  hypothesis: >-
    Q88DP2 is a bifunctional HMP/HMP-P kinase required both for de novo HMP-PP synthesis and
    for salvage of free HMP.
