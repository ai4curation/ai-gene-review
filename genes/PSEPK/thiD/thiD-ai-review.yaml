    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002324930
  review:
    summary: >-
      TreeGrafter transfer of cytosol from the PANTHER ThiD node. ThiD is a soluble
      ribokinase-fold enzyme with no signal peptide or transmembrane segment, acting on
      cytoplasmic pyrimidine intermediates.
    action: ACCEPT
    reason: >-
      A soluble kinase of the cytoplasmic thiamine pathway, with no targeting or membrane
      feature in the 265-residue sequence. The family review for PTHR20858 judges the
      family cytosol IBD sound, and the yeast family member Thi20 is cytosolic by direct
      assay. Cytosol is the appropriate compartment for a bacterial soluble enzyme.
    supported_by:
    - reference_id: file:interpro/panther/PTHR20858/PTHR20858-review.yaml
      supporting_text: >-
        Every reviewed recipient retains this IBA: SPCC18B5.05c (SCHPO), THI20 (yeast), THI21 (yeast),
        THI22 (yeast), thi20 (SCHPO), thi201 (SCHPO).
    - reference_id: file:PSEPK/thiD/thiD-uniprot.txt
      supporting_text: SUPFAM; SSF53613; Ribokinase-like; 1.
- term:
    id: GO:0008902
    label: hydroxymethylpyrimidine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - EC:2.7.1.49
  - PANTHER:PTN002324930
  review:
    summary: >-
      Combined IEA (EC 2.7.1.49 and the PANTHER ThiD node) for HMP kinase activity, the
      phosphorylation of free HMP to HMP-P. ThiD-family enzymes are bifunctional HMP and
      HMP-P kinases; HMP kinase lets the cell salvage free pyrimidine.
    action: ACCEPT
    reason: >-
      HMP kinase activity is demonstrated for the ThiD-like domain of yeast Thi20, which
      shares subfamily SF17 with Q88DP2, and the PTHR20858 family review assesses the HMP
      kinase IBD as sound for the ThiD/THI20 subfamilies. Q88DP2 carries the HMP/HMP-P kinase
      domain and is a full-length single-domain ThiD. In bacteria that make HMP-P de novo
      with ThiC, the HMP kinase half supports salvage rather than the de novo route; the
      activity is genuine and accepted, with the HMP-P kinase step as the primary core
      function.
    supported_by:
    - reference_id: PMID:15967475
      supporting_text: >-
        incubation of Thi20 with HMP
        (4-amino-2-methyl-5-hydroxymethylpyrimidine) and ATP reveals
        that it has HMP kinase and HMP-P (4-amino-2-methyl-5-hydroxymethylpyrimidine phosphate) kinase
        activity.
    - reference_id: PMID:15614489
      supporting_text: >-
        we demonstrate that both Thi20p and Thi21p proteins also have HMP
        kinase activity.
    - reference_id: file:PSEPK/thiD/thiD-uniprot.txt
      supporting_text: PANTHER; PTHR20858:SF17; HYDROXYMETHYLPYRIMIDINE_PHOSPHOMETHYLPYRIMIDINE KINASE THI20-RELATED; 1.
- term:
    id: GO:0008972
    label: phosphomethylpyrimidine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004399
  - PANTHER:PTN002324930
  review:
    summary: >-
      Combined IEA (InterPro IPR004399 and the PANTHER ThiD node) for HMP-P kinase
      activity, HMP-P + ATP -> HMP-PP + ADP. This is the de novo step that activates the
      ThiC product for coupling by ThiE.
    action: ACCEPT
    reason: >-
      Core function. The HMP/HMP-P kinase domain signature, the ThiD/THI20 subfamily
      assignment and the conserved pathway context (thiD adjacent to thiE) all point to
      HMP-P kinase. E. coli mutants lacking phosphomethylpyrimidine kinase are thiamine
      auxotrophs, showing the step is required for de novo synthesis, and the activity is
      directly assayed for the subfamily member Thi20.
    supported_by:
    - reference_id: file:PSEPK/thiD/thiD-uniprot.txt
      supporting_text: InterPro; IPR004399; HMP/HMP-P_kinase_dom.
    - reference_id: PMID:15967475
      supporting_text: >-
        incubation of Thi20 with HMP
        (4-amino-2-methyl-5-hydroxymethylpyrimidine) and ATP reveals
        that it has HMP kinase and HMP-P (4-amino-2-methyl-5-hydroxymethylpyrimidine phosphate) kinase
        activity.
    - reference_id: PMID:6284709
      supporting_text: >-
        intermediate production of thiamine auxotrophs that had lost the enzymatic
        activity of either phosphomethylpyrimidine kinase or thiamine phosphate
        pyrophosphorylase.
- term:
    id: GO:0009228
    label: thiamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004399
  - PANTHER:PTN002324930
  review:
    summary: >-
      Combined IEA for thiamine biosynthetic process. ThiD performs the pyrimidine
      activation step of de novo thiamine synthesis, making the HMP-PP that ThiE couples
      to the thiazole moiety.
    action: ACCEPT
    reason: >-
      ThiD catalyses a step of the pathway (HMP-P to HMP-PP), so it participates directly.
      GO:0009229 thiamine diphosphate biosynthetic process is not an is_a or part_of
      descendant of GO:0009228 in the current ontology, so this is not a general term
      superseded by it; both process terms are kept, as for the yeast family members THI20
      and THI6.
    supported_by:
    - reference_id: PMID:8432721
      supporting_text: >-
        Two precursors [4-methyl-5-(beta-hydroxyethyl)thiazole monophosphate and
        4-amino-5-hydroxymethyl-2-methylpyrimidine pyrophosphate] are coupled to form
        thiamine monophosphate, which is then phosphorylated to make thiamine
        pyrophosphate.
    - reference_id: PMID:6284709
      supporting_text: >-
        intermediate production of thiamine auxotrophs that had lost the enzymatic
        activity of either phosphomethylpyrimidine kinase or thiamine phosphate
        pyrophosphorylase.
- term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00060
  review:
    summary: >-
      UniPathway mapping (UPA00060, thiamine diphosphate biosynthesis). In bacteria the
      de novo route runs HMP-P -> HMP-PP -> TMP -> TPP, so the ThiD step is part of
      thiamine diphosphate biosynthesis.
    action: ACCEPT
    reason: >-
      Thiamine diphosphate is the end product of the bacterial de novo pathway: TMP made by
      ThiE from the ThiD product is phosphorylated directly to TPP by ThiL. ThiD catalyses
      one step of that route.
    supported_by:
    - reference_id: PMID:8432721
      supporting_text: >-
        Two precursors [4-methyl-5-(beta-hydroxyethyl)thiazole monophosphate and
        4-amino-5-hydroxymethyl-2-methylpyrimidine pyrophosphate] are coupled to form
        thiamine monophosphate, which is then phosphorylated to make thiamine
        pyrophosphate.
