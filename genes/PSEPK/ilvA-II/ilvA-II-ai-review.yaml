  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Amino acid metabolic process is correct but too general for IlvA's isoleucine-pathway role.
    action: MODIFY
    reason: >-
      IlvA supplies 2-oxobutanoate for L-isoleucine synthesis, so the broad
      amino acid metabolic process is refined to its descendant GO:1901705
      L-isoleucine biosynthetic process, which the gene already carries. The
      other supported descendant, GO:0006567 L-threonine catabolic process, is
      deliberately not listed as a replacement: it is kept below only as a
      non-core row, not as a refinement of this enzyme's role. The same action
      is applied to E. coli IlvA, S. cerevisiae ILV1 and S. pombe tda1.
    proposed_replacement_terms:
    - id: GO:1901705
      label: L-isoleucine biosynthetic process
