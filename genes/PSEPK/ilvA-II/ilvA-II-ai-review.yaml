- term:
    id: GO:0006565
    label: L-serine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The serine reaction of biosynthetic IlvA is a side reaction that releases toxic 2-aminoacrylate,
      not a serine-degradation role; KT2440 has dedicated L-serine dehydratases for that.
    action: MARK_AS_OVER_ANNOTATED
    reason: Biosynthetic Ser/Thr dehydratases do act on serine, but in the characterized Salmonella IlvA
      this chemistry is the source of the reactive enamine 2-aminoacrylate (2AA), which inactivates PLP
      enzymes and is prevented by isoleucine feedback inhibition of IlvA; it is a damaging by-product
      of the isoleucine-pathway enzyme, not a catabolic route. KT2440 encodes three dedicated
      [4Fe-4S]-type L-serine dehydratases (tdcG-I PP_0297, tdcG-II PP_0987, tdcG-III PP_3144) as the
      candidate serine-degrading enzymes. The TreeGrafter process inference is therefore an
      over-annotation of the side activity; it is kept rather than removed because the chemistry is
      real and no target-specific flux data exclude a minor contribution. The same judgement is applied
      to both KT2440 IlvA paralogs. The quote from the ilvA-I OpenScientist report is cited deliberately, because
      no provider report exists for this paralog. The statement is about ilvA-I, but the same gap (no
      measurement of the serine side reaction in KT2440) applies equally to ilvA-II.
    supported_by:
    - reference_id: PMID:30327426
      supporting_text: A hallmark of the RidA paradigm is that the effects are prevented by the addition
        of isoleucine, which inhibits IlvA and prevents formation of the toxic 2AA.
    - reference_id: PMID:30327426
      supporting_text: 2AA then inactivates target PLP enzymes through covalent modification of active-site
        bound PLP
    - reference_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
      supporting_text: "tdcG-I PP_0297\tL-serine dehydratase (EC 4.3.1.17)"
    - reference_id: file:PSEPK/ilvA-I/ilvA-I-deep-research-openscientist.md
      supporting_text: '**Physiological significance of the serine-dehydratase side reaction / 2AA output
        in KT2440 is untested.**'
- term:
    id: GO:0006567
    label: L-threonine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Threonine is consumed, but the biosynthetic deaminase is not a threonine-degradation enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IlvA reaction does break down L-threonine, so the term is not wrong,
      but the threonine catabolic process belongs to the catabolic
      dehydratases (TdcB/CHA1-type), to which PAINT gives it; the biosynthetic
      branch is not given the term. In yeast, ILV1 contributes to threonine
      utilization only to a limited extent and its review keeps the term as
      non-core. The row is therefore kept, but not as a core function, and the
      same judgement is applied to both KT2440 paralogs.
    supported_by:
    - reference_id: file:PSEPK/ilvA-II/ilvA-II-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-threonine = 2-oxobutanoate + NH4(+)
