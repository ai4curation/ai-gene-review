    action: ACCEPT
    reason: >-
      EC 4.3.1.19, RHEA:22108, InterPro:IPR005787, and the full-length ACT-domain
      architecture support biosynthetic L-threonine deamination.
    supported_by:
    - reference_id: file:PSEPK/ilvA-II/ilvA-II-uniprot.txt
      supporting_text: Full=L-threonine dehydratase
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: IlvA directly performs amino-acid metabolism.
    action: ACCEPT
    reason: Its catalysis consumes L-threonine and supplies 2-oxobutanoate for L-isoleucine synthesis.
      Both the broad amino-acid process and the specific isoleucine biosynthetic process are correct;
      annotation breadth does not imply excess biological scope.
    supported_by:
    - reference_id: file:PSEPK/ilvA-II/ilvA-II-uniprot.txt
      supporting_text: Reaction=L-threonine = 2-oxobutanoate + NH4(+)
- term:
    id: GO:0006565
    label: L-serine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Physiological serine breakdown by this KT2440 paralog remains unresolved.
    action: UNDECIDED
    reason: Family enzyme assays support a serine-dehydratase side activity, and PMID:30327426 shows that
      this chemistry can occur in vivo in a biosynthetic IlvA context. They do not determine the contribution
      of either KT2440 paralog to physiological serine turnover. The isoleucine role does not exclude
      such a contribution; quantitative target-specific flux evidence is missing.
    supported_by:
    - reference_id: file:PSEPK/ilvA-I/ilvA-I-deep-research-openscientist.md
      supporting_text: '**Physiological significance of the serine-dehydratase side reaction / 2AA output
        in KT2440 is untested.**'
    - reference_id: PMID:30327426
      supporting_text: These growth defects are due to 2AA generated by the biosynthetic serine/threonine
        dehydratase (IlvA; EC 4.3.1.19) from serine.
- term:
    id: GO:0006567
    label: L-threonine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The IlvA reaction directly breaks down L-threonine while supplying isoleucine synthesis.
    action: ACCEPT
    reason: GO:0006567 covers chemical reactions resulting in L-threonine breakdown. Conversion to 2-oxobutanoate
      and ammonium satisfies that definition. Subsequent use of the carbon skeleton in biosynthesis does
      not exclude threonine catabolism or require a dedicated energy-generating degradation pathway.
    supported_by:
    - reference_id: file:PSEPK/ilvA-II/ilvA-II-uniprot.txt
      supporting_text: Reaction=L-threonine = 2-oxobutanoate + NH4(+)
