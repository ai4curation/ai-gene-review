      compares the second KT2440 paralog.
    supporting_text: No single experimental study characterizes Q88HB4 directly
    reference_section_type: RESULTS
  - statement: Physiological relevance of the serine side reaction in KT2440 is untested.
    supporting_text: '**Physiological significance of the serine-dehydratase side reaction / 2AA output
      in KT2440 is untested.**'
    reference_section_type: RESULTS
  reference_review:
