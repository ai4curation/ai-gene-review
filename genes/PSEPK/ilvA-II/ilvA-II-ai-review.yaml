id: Q88CN1
gene_symbol: ilvA-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  IlvA-II is a full-length, PLP-dependent biosynthetic threonine deaminase that
  converts L-threonine to 2-oxobutanoate, the entry metabolite for L-isoleucine
  biosynthesis. It contains the catalytic serine/threonine-dehydratase domain
  and two C-terminal ACT-like regulatory domains. KT2440 also encodes the
  closely related IlvA-I, and their relative physiological contributions have
  not been established.
existing_annotations:
- term:
    id: GO:0003941
    label: L-serine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Serine ammonia-lyase activity is a supported secondary family activity, inferred for this
      paralog.
    action: KEEP_AS_NON_CORE
    reason: Direct recombinant enzyme studies demonstrate L-serine use by biosynthetic IlvA homologs (PMID:30226377,
      Mycobacterium smegmatis; PMID:30327426, Salmonella enterica). The target retains the biosynthetic
      Ser/Thr-dehydratase catalytic architecture, supporting the TreeGrafter molecular-activity inference
      even though its main pathway supplies isoleucine. This is comparative evidence, not a target-specific
      kinetic measurement or proof of physiological serine flux.
    supported_by:
    - reference_id: PMID:30226377
      supporting_text: 'We show here that in addition to l-threonine, l-allo-threonine and l-serine are

        also used as substrates by TD'
    - reference_id: PMID:30327426
      supporting_text: the enzyme generates both 2AA (from serine) and 2AC (from threonine)
- term:
    id: GO:0004794
    label: threonine deaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
