taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 
    11950 / KT2440)
description: cyoA encodes the cytochrome bo3 ubiquinol oxidase subunit II that 
  helps form the quinol-input side of the complex in Pseudomonas putida KT2440. 
  The protein acts in a plasma-membrane terminal oxidase branch that reduces 
  oxygen to water and supports aerobic respiratory energy conservation. Its 
  subunit-specific role is distinguished from the emergent catalytic activity of
  the assembled oxidase complex.
existing_annotations:
- term:
    id: GO:0004129
    label: cytochrome-c oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 'cytochrome-c oxidase activity: Wrong electron donor. GO:0004129 is the
      EC 7.1.1.9 reaction (4 Fe(II)-cytochrome c + O2), but cyoA is a subunit of the
      cytochrome bo3 ubiquinol oxidase (EC 7.1.1.3), which takes electrons from the
      quinol pool and lacks the CuA cytochrome c docking site.'
    action: REMOVE
    reason: This is a wrong-donor IEA mapping rather than an over-annotation of
      degree. Cytochrome bo3 is a ubiquinol oxidase (EC 7.1.1.3); GO:0004129 is
      defined as the cytochrome c reaction (EC 7.1.1.9). CyoA is the subunit II
      that in true cytochrome c oxidases carries the CuA center accepting
      electrons from cytochrome c, and this review already REMOVEs GO:0005507
      from cyoA for lacking that center, so there is no cytochrome c entry site
      on this complex at all. GO:0009486 remains as the branch-correct activity.
    supported_by:
    - reference_id: file:PSEPK/cyoA/cyoA-uniprot.txt
      supporting_text: 'DE   RecName: Full=Ubiquinol oxidase subunit 2 {ECO:0000256|PIRNR:PIRNR000292};'
