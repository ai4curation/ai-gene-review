      - CC:SUBCELLULAR LOCATION
      supporting_text: Multi-pass membrane protein
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Signal-peptide removal is direct proteolytic work during lipoprotein maturation.
    action: ACCEPT
    reason: LspA directly hydrolyzes the peptide bond before the lipid-modified cysteine. Proteolysis
      is therefore a true core process, not an overannotation merely because the enzyme recognizes a specialized
      substrate. Lipoprotein biosynthesis captures the pathway context separately. Obsolete GO:0006465
      signal peptide processing is not introduced as a replacement.
    supported_by:
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'PATHWAY: Protein modification; lipoprotein biosynthesis (signal peptide'
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: This protein specifically catalyzes the removal of signal
    - reference_id: PMID:26912896
      supporting_text: 'Posttranslational processing requires a signal peptidase II (LspA)

        that removes the signal peptide.'
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: The membrane annotation is correct but less precise than plasma membrane for this bacterial
      inner-membrane enzyme.
    action: MODIFY
    reason: The generic membrane claim is correct. Target family/topology and ortholog structure support
      the more precise bacterial plasma membrane, already present in this review; MODIFY refines location
      rather than rejecting membrane association.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
- term:
    id: GO:0042158
    label: lipoprotein biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/lspA/lspA-uniprot.txt
  qualifier: involved_in
  review:
    summary: LspA is the signal-peptide cleavage step of bacterial lipoprotein biosynthesis.
    action: NEW
    reason: Retain this inherited proposal because LspA itself catalyzes the signal-peptide cleavage step
      that produces the apolipoprotein terminus for further maturation. This is direct reaction participation,
      independently supported by the conserved target function and characterized ortholog, rather than
      an argument that other pathway members carry the term. No second proposal is added.
    supported_by:
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'PATHWAY: Protein modification; lipoprotein biosynthesis (signal peptide'
    - reference_id: PMID:26912896
      supporting_text: 'Posttranslational processing requires a signal peptidase II (LspA)

        that removes the signal peptide.'
