id: Q88Q91
gene_symbol: lspA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LspA (PP_0604) is an integral inner-membrane aspartyl signal peptidase II. It cleaves the
  peptide bond immediately before the diacylglyceryl-modified lipobox cysteine, removing the signal peptide
  and exposing the amino group used by Lnt in canonical lipoprotein maturation. Conserved peptidase A8
  features support this function in Pseudomonas putida KT2440.
existing_annotations:
- term:
    id: GO:0004190
    label: aspartic-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: LspA is a membrane-embedded peptidase A8/aspartyl protease that removes the signal peptide
      from diacylglyceryl-modified prolipoproteins.
    action: ACCEPT
    reason: The aspartic-type endopeptidase class correctly describes LspA catalysis. Target peptidase
      A8/HAMAP features and catalytic Asp annotations agree with P. aeruginosa structural and mutagenesis
      evidence. GO:0009003 signal peptidase activity is a complementary substrate-defined MF used in core_functions;
      its reinstatement means that a generic signal-peptidase term is available. No target experimental
      structure or essentiality is inferred.
    supported_by:
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=Release of signal peptides from bacterial membrane
    - reference_id: PMID:26912896
      supporting_text: Mutagenesis studies identify LspA as an aspartyl peptidase.
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
      supporting_text: Belongs to the peptidase A8 family.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Plasma membrane is the correct GO cellular-component term for bacterial inner-membrane LspA.
    action: ACCEPT
    reason: The target HAMAP family assignment and polytopic membrane sequence support the bacterial inner
      membrane, represented by plasma membrane. This is a conserved localization inference, not an independent
      KT2440 localization assay; the enzymatic reaction acts at the membrane/periplasm interface.
    supported_by:
    - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
