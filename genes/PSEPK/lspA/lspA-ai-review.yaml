proposed_new_terms:
- proposed_name: lipoprotein signal peptidase activity
  proposed_definition: Catalysis of the hydrolysis of the signal peptide from a bacterial membrane diacylglyceryl-prolipoprotein,
    cleaving immediately N-terminal to the lipid-modified lipobox cysteine.
  justification: GO:0009003 signal peptidase activity is active and covers the general reaction; GO:0004190
    describes its aspartyl mechanism. A narrower lipoprotein-specific term would distinguish cleavage
    of an S-diacylglyceryl-cysteine-containing substrate from other signal-peptide substrates.
  proposed_parent:
    id: GO:0009003
    label: signal peptidase activity
  supported_by:
  - reference_id: file:PSEPK/lspA/lspA-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: This protein specifically catalyzes the removal of signal
suggested_questions:
- question: Would a lipoprotein-specific child of the existing GO:0009003 signal peptidase activity improve
    representation of LspA substrate specificity?
  experts:
  - GO molecular function curators
- question: Is PP_0604 essential under standard KT2440 growth conditions, and what lipoprotein substrates
    accumulate when LspA activity is inhibited or depleted?
  experts:
  - Pseudomonas envelope biogenesis experts
suggested_experiments:
- description: Construct a conditional lspA depletion strain and assay accumulation of unprocessed prolipoproteins,
    envelope stress, and growth defects.
  experiment_type: conditional depletion and lipoproteomics
- description: Reconstitute PP_0604 in membrane mimetics with diacylglyceryl-prolipoprotein peptide substrates
    and test cleavage plus globomycin/myxovirescin inhibition.
  experiment_type: in vitro peptidase assay
