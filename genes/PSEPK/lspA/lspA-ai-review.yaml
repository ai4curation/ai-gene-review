- id: file:PSEPK/lspA/lspA-deep-research-openscientist.md
  title: OpenScientist gene research for lspA
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Genuine existing provider research reused as a literature lead. Primary assay organisms
      and frozen target features were independently checked in the source consultation. Generic essentiality,
      universal pathway order, exact donor preferences and predicted structural geometry are not treated
      as KT2440 measurements. Its sequence claims are independently qualified by the parameter-sensitive
      alignment panel.
  findings:
  - statement: OpenScientist supports LspA as the inner-membrane signal peptidase II step between Lgt
      and Lnt in bacterial lipoprotein maturation and notes that direct KT2440-specific biochemical characterization
      is still inferential from conserved orthologs.
- id: file:analysis/module_audits/bacterial_lipoprotein_maturation/psepk-consultation/evidence.md
  title: PSEPK lipoprotein maturation source and sequence consultation
  findings:
  - statement: Frozen target identities, source assay organisms, current ontology and independent sequence
      checks distinguish conserved chemistry from native KT2440 assays.
    supporting_text: No target-specific assay or essentiality conclusion follows from this identity check.
- id: PMID:26912896
  title: Structural basis of lipoprotein signal peptidase II action and inhibition by the antibiotic globomycin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract explicitly identifies the assay organism and activity. Science full
      text returned403; detailed target kinetics/structure are not claimed.
  findings:
  - statement: P. aeruginosa LspA structure and mutagenesis establish signal-peptide removal by an aspartyl
      peptidase, supporting the conserved target function.
    supporting_text: Mutagenesis studies identify LspA as an aspartyl peptidase.
