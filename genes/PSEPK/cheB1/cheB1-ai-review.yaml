- term:
    id: GO:0050568
    label: protein-glutamine glutaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:16441
  - EC:3.5.1.44
  - UniRule:UR000076362
  review:
    summary: >-
      CheB-family enzymes also deamidate specific glutamine residues of
      chemoreceptors to methyl-accepting glutamates, using the same catalytic
      domain. Assigned to CheB1 by the HAMAP CheB rule.
    action: ACCEPT
    reason: >-
      Receptor glutamine deamidation (EC 3.5.1.44) is a dedicated, evolved
      activity of the CheB family, demonstrated for E. coli CheB on the Tsr
      receptor, and is part of the HAMAP MF_00099 functional assignment that
      covers CheB1. It is accepted as a genuine second activity of the CheB1
      catalytic domain. Whether KT2440 chemoreceptors are synthesized with
      glutamines at the adaptation sites has not been tested, so this activity
      is listed in core_functions with that caveat noted in the notes file.
    supported_by:
    - reference_id: file:PSEPK/cheB1/cheB1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Also mediates the irreversible deamidation of specific glutamine residues to glutamic acid.
    - reference_id: PMID:6304723
      supporting_text: suggests that CheB-dependent modification of MCPI is the enzymatic deamidation of glutamine to methyl-accepting glutamic acid
