- term:
    id: GO:0000156
    label: phosphorelay response regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000673
  - InterPro:IPR008248
  review:
    summary: >-
      InterPro2GO mapping from the CheB response-regulator/methylesterase
      signatures. CheB1 has a canonical receiver (REC) domain (residues 4-121)
      whose phosphorylation at Asp55 by CheA activates the methylesterase
      output domain.
    action: ACCEPT
    reason: >-
      The GO definition of response regulator activity (responds to a
      phosphorelay sensor; regulated by phosphotransfer from a sensor histidine
      to a response-regulator aspartate; many but not all response regulators
      act on transcription) fits CheB, whose output is an enzyme rather than a
      DNA-binding domain. The HAMAP CheB rule (MF_00099) places the receiver
      domain and the phosphoaspartate, and records that phosphorylation by
      CheA activates the esterase. E. coli CheB is the experimental anchor for
      this family-level inference (CheA donates phosphoryl groups to CheY or
      CheB). The receiver-domain activity is integral to how CheB1 is
      regulated, so it is kept with the core methylesterase function.
    supported_by:
