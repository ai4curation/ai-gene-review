  review:
    summary: >-
      CheB-family methylesterases perform the demethylation half of
      chemoreceptor adaptation in chemotaxis; cheB1 is the methylesterase gene
      of the KT2440 flagellar chemotaxis cluster.
    action: ACCEPT
    reason: >-
      CheB does part of the work of chemotaxis (receptor demethylation for
      adaptation); E. coli cheB mutants lacking methylesterase tumble
      incessantly. In KT2440, cheB1 lies in the flagellar/chemotaxis gene
      cluster in the cheBmotAB transcriptional unit (the motAB of that paper
      is the cluster-encoded MotCD pair PP_4336-PP_4335), which anchors it to
      the flagellar pathway rather than to the auxiliary chemosensory
      clusters. A KT2440 cheB1 mutant phenotype has not been reported in the
      cached literature.
    supported_by:
