suggested_questions:
- question: >-
    Is CheB1 the only methylesterase acting on the flagellar-pathway
    chemoreceptors of KT2440, or does the second CheB paralogue (PP_3759)
    contribute, mirroring the CheR2/CheR1 specificity split?
- question: >-
    Do KT2440 chemoreceptors such as McpS carry glutamines at adaptation
    sites that require CheB1 deamidation for function?
suggested_experiments:
- hypothesis: CheB1 is required for chemotactic adaptation in KT2440 and acts specifically on flagellar-pathway receptors.
  description: >-
    Construct a nonpolar cheB1 deletion (preserving motCD expression) and an
    active-site S194A allele, and measure chemotaxis (capillary/soft agar) and
    receptor methylation state (in vivo methyl labelling) relative to
    PP_3759 mutants; assay purified CheB1 for methylesterase and deamidase
    activity on McpS signaling-domain substrates with and without
    phosphorylation by CheA.
  experiment_type: genetics and biochemistry
