  review:
    summary: >-
      CheB1 is a phosphorelay participant: it is phosphorylated by the CheA
      histidine kinase on the receiver-domain aspartate, competing with CheY
      for phospho-CheA.
    action: ACCEPT
    reason: >-
      CheB receives phosphoryl groups from CheA in the His-Asp phosphorelay of
      the chemotaxis system, and this phosphorylation controls its output
      activity; this matches the GO definition of the phosphorelay signal
      transduction system. Family-level (HAMAP MF_00099, PIRSF000876) evidence;
      in E. coli, CheA donates its phosphoryl group to either CheY or CheB,
      which places CheB in the phosphorelay.
