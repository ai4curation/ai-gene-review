id: Q88EW5
gene_symbol: cheB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  CheB1 (PP_4337) is the chemotaxis methylesterase/deamidase of the flagellar
  chemosensory pathway of Pseudomonas putida KT2440. It is a cytoplasmic
  two-domain protein: an N-terminal CheY-like receiver (REC) domain carrying
  the phosphorylatable Asp55, and a C-terminal CheB-type methylesterase
  domain with the Ser/His/Asp catalytic triad (Ser194, His221, Asp314). By
  homology with E. coli CheB, phosphorylation of the receiver domain by the
  histidine kinase CheA relieves inhibition of the catalytic domain, which
  then hydrolyses glutamate 5-O-methyl esters introduced into
  methyl-accepting chemotaxis proteins by CheR and irreversibly deamidates
  specific receptor glutamines to glutamate. This feedback demethylation
  resets receptor sensitivity during adaptation. cheB1 lies in the main
  flagellar/chemotaxis gene cluster, cotranscribed with the downstream MotCD
  stator genes (PP_4336-PP_4335) and adjacent to cheA.
