      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Involved in chemotaxis. Part of a chemotaxis signal transduction system that modulates chemotaxis in response to various stimuli.'
    - reference_id: PMID:23766109
      supporting_text: 'this cluster is comprised of four independent transcriptional units: flhAF, fleNfliA, cheYZA and cheBmotAB'
