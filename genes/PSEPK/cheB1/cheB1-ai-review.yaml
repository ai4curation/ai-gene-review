      Core function. CheB1 is a full-length CheB (HAMAP MF_00099, PIRSF000876,
      Pfam CheB_methylest) with the conserved catalytic triad Ser194, His221
      and Asp314, which hydrolyses receptor glutamate 5-O-methyl esters.
    action: ACCEPT
    reason: >-
      Family membership in the HAMAP CheB family with all catalytic residues
      conserved supports the EC 3.1.1.61 activity, which was established
