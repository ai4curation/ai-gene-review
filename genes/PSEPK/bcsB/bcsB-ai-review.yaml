- id: file:PSEPK/bcsB/bcsB-uniprot.txt
  title: UniProtKB entry for bcsB
  findings:
  - statement: BcsB family membership and the signal peptide/C-terminal membrane-anchor features support
      the structural partner assignment. The inherited c-di-GMP-binding name/function requires correction;
      BcsA carries the established switch.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Family and topology evidence are useful; the direct c-di-GMP-binding function is unsupported
      for this periplasmic BcsB homolog.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q88JL3
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Binds the cellulose synthase activator, bis-(3'-5') cyclic
      corrected_label: Membrane-anchored periplasmic cellulose synthase partner BcsB
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: The cited RuleBase/ARBA statement assigns direct c-di-GMP binding to BcsB. Target topology
        places its major domain in the periplasm, whereas primary BcsAB structures and activation assays
        locate the direct PilZ-domain c-di-GMP switch in BcsA. Reassess the BcsB function and name; no
        target ligand-binding assay establishes this claim.
      supported_by:
      - reference_id: PMID:24704788
        supporting_text: BcsA forms a PilZ domain within its C-terminal intracellular extension
      - reference_id: PMID:23222542
        supporting_text: BcsB is a periplasmic protein that is anchored to the inner membrane via a single,
          C-terminal TM-helix.
