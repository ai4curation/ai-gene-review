  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Plasma membrane is the appropriate bacterial inner-membrane location for BcsB.
    action: ACCEPT
    reason: 'Two independent sequence lines place BcsB in the inner (plasma) membrane: the RuleBase (RU365021)
      sequence features give an N-terminal signal peptide (1..25) and a single C-terminal helical transmembrane
      segment (727..745), the topology of a periplasmic domain anchored in the cytoplasmic membrane; and
      the protein belongs to the BcsB family (Pfam PF03170, InterPro IPR003920 Cell_synth_B), whose members
      are the inner-membrane-anchored regulatory subunits of the BcsA-BcsB cellulose synthase. The UniProt
      SUBCELLULAR LOCATION line itself rests only on an ARBA rule and is not cited. No KT2440 fractionation
      data are cached.'
