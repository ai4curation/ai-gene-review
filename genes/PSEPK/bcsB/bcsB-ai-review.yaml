taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: BcsB (PP_2636) is a predicted noncatalytic partner of the Pseudomonas putida KT2440 cellulose
  synthase. Its signal peptide and C-terminal membrane anchor place most of the protein in the periplasm,
  where BcsB-family proteins support the synthase and organize the passage of nascent cellulose. The direct
  c-di-GMP-binding switch of the characterized BcsAB complex resides in BcsA. The exact KT2440 complex
  stoichiometry and BcsB contacts have not been determined.
