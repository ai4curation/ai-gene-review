- id: PMID:23222542
  title: Crystallographic snapshot of cellulose synthesis and membrane translocation.
  findings:
  - statement: The Rhodobacter sphaeroides structure establishes the membrane-anchored periplasmic BcsB
      partner and its interface with catalytic BcsA.
    supporting_text: BcsB is a periplasmic protein that is anchored to the inner membrane via a single,
      C-terminal TM-helix.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined; this is homolog structural evidence, not KT2440 fractionation or
      a direct Q88JL3 assay.
- id: PMID:24704788
  title: Mechanism of activation of bacterial cellulose synthase by cyclic di-GMP.
  findings:
  - statement: The PilZ c-di-GMP-binding switch maps to BcsA, so neither BcsB family naming nor regulation
      of the whole complex establishes direct BcsB c-di-GMP binding.
    supporting_text: BcsA forms a PilZ domain within its C-terminal intracellular extension
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text Rhodobacter sphaeroides mechanistic study; direct regulation belongs to BcsA.
- id: file:PSEPK/bcsB/bcsB-deep-research-openscientist.md
  title: OpenScientist gene research for bcsB
  findings:
  - statement: OpenScientist identifies Q88JL3 as the membrane-anchored periplasmic BcsB accessory subunit
      and notes that BcsB is non-catalytic while the primary c-di-GMP sensor is BcsA.
    supporting_text: The primary c-di-GMP sensor is the PilZ domain of BcsA, but BcsB is an integral member
      of the regulated complex
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Generated synthesis checked against independent domain assignments and primary publications
      during the taxon audit. It is retained as research provenance; gene-level molecular claims below
      cite the underlying sources. Direct KT2440 biochemistry remains unavailable.
- id: PMID:39242554
  title: Insights into phosphoethanolamine cellulose synthesis and secretion across the Gram-negative
    cell envelope.
  findings:
  - statement: E. coli BcsB contacts the N-terminal TPR region of BcsC. High-resolution interface analysis
      used an engineered BcsC-TPR/BcsB fusion; the architecture is not a KT2440 measurement.
    supporting_text: To improve the resolution of the BcsB-BcsC complex map, BcsC’s TPR#1–4 were fused
      to the N-terminus of BcsB
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. E. coli structural complexes and fusion construct support a conserved
      handoff model, without transferring the exact BcsB copy number to Pseudomonas.
