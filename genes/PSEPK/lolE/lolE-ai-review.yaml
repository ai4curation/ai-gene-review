      - statement: UniProt assigns Q88KY3 to the multi-pass membrane LolC/E subfamily.
  - id: file:PSEPK/lolE/lolE-deep-research-openscientist.md
    title: OpenScientist deep research report on PSEPK LolE (Q88KY3)
    publication_type: DEEP_RESEARCH
    findings:
      - statement: Target-specific topology and synteny support Q88KY3 as the LolE membrane subunit of LolCDE.
        supporting_text: >-
          The syntenic operon order (*lolC–lolD–lolE*) mirrors *E. coli* and
          cleanly resolves the ortholog assignment of Q88KY3 as LolE rather than LolC.
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: Used for target-specific topology, domain, orthology, and synteny synthesis; cargo-cleft asymmetry is ortholog-derived.
core_functions:
  - description: >-
      Integral-membrane LolE contribution to LolCDE-dependent extraction and
      release of mature outer-membrane-destined lipoproteins.
    directly_involved_in:
      - {id: "GO:0044874", label: lipoprotein localization to outer membrane}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: file:PSEPK/lolE/lolE-uniprot.txt
        supporting_text: Belongs to the ABC-4 integral membrane protein family.
knowledge_gaps:
  - gap_statement: The distinct LolE cargo-contacting role relative to LolC has not been tested in KT2440.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: Conserved topology and operon position support LolE identity, but subunit asymmetry is transferred from Escherichia coli structures.
suggested_questions:
  - question: What distinct substrate-contacting role does KT2440 LolE have relative to LolC?
suggested_experiments:
  - description: Reconstitute LolCDE with systematic LolC and LolE substitutions and measure lipoprotein release to LolA.
    experiment_type: proteoliposome transport assay
