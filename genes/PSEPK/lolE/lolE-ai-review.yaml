- id: file:PSEPK/lolE/lolE-deep-research-openscientist.md
  title: OpenScientist deep research report on PSEPK LolE (Q88KY3)
  publication_type: DEEP_RESEARCH
  findings:
  - statement: Target-specific topology and synteny support Q88KY3 as the LolE membrane subunit of LolCDE.
    supporting_text: The syntenic operon order (*lolC–lolD–lolE*) mirrors *E. coli* and cleanly resolves
      the ortholog assignment of Q88KY3 as LolE rather than LolC.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Preserved provider-generated discovery and synthesis report. Mechanistic claims used
      in the current core are independently grounded in the primary publications and target records; this
      report is not direct experimental evidence. No uncited target-specific assay or exact sorting-rule
      transfer is inferred.
- id: PMID:41557797
  title: Liganded LolCDE structures reveal a common substrate-LolE interaction guiding bacterial lipoprotein
    transport.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full cached text inspected: complexes are E. coli LolCDE coexpressed with Lpp, Pal
      or LolB. Structural and transfer results inform LolE substrate engagement. No KT2440 residue mapping
      or independent LolE release activity is claimed.'
  findings:
  - statement: E. coli substrate-bound LolCDE structures resolve lipoprotein interactions with the LolE
      periplasmic cleft; the KT2440 LolE subunit role is inferred, not directly measured.
    supporting_text: The lipoproteins make a sequence-independent but structurally conserved interaction
      with a cleft on the surface of the periplasmic domain of LolE that promotes efficient transport.
- id: PMID:30012603
  title: Insights into bacterial lipoprotein trafficking from a structure of LolA bound to the LolC periplasmic
    domain.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. Structure, binding assays, ATPase assays and E. coli cellular
      experiments distinguish LolC recruitment from LolD ATP hydrolysis. Used as mechanistic ortholog
      support, not direct KT2440 evidence.
  findings:
  - statement: E. coli LolCDE separates the membrane heterodimer from the LolD nucleotide-binding dimer;
      LolC recruits LolA through its periplasmic domain.
    supporting_text: The LolCDE complex is an ABC transporter that comprises a heterodimer of the transmembrane
      proteins LolC and LolE, and a homodimer of cytoplasmic LolD, which forms the nucleotide binding
      domain that hydrolyzes ATP.
