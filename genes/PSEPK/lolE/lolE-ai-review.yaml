knowledge_gaps:
  - gap_statement: The distinct LolE cargo-contacting role relative to LolC has not been tested in KT2440.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: Conserved topology and operon position support LolE identity, but subunit asymmetry is transferred from Escherichia coli structures.
suggested_questions:
  - question: What distinct substrate-contacting role does KT2440 LolE have relative to LolC?
suggested_experiments:
  - description: Reconstitute LolCDE with systematic LolC and LolE substitutions and measure lipoprotein release to LolA.
    experiment_type: proteoliposome transport assay
