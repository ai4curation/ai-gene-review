taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Multi-pass inner-membrane LolE subunit of the LolCDE ABC complex. Together
  with LolC it forms the membrane machinery that extracts
  outer-membrane-destined mature lipoproteins and transfers them to LolA.
