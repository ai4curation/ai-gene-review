  label: Pseudomonas putida KT2440
description: ArgF (PP_1079) is the biosynthetic ornithine carbamoyltransferase (EC 2.1.3.3). It transfers
  the carbamoyl group of carbamoyl phosphate to L-ornithine to form L-citrulline, beginning the three-reaction
  conversion of ornithine to L-arginine. The distinct ArcB enzyme supplies the related catabolic ornithine
  carbamoyltransferase activity.
