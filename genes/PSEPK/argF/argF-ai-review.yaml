- id: file:PSEPK/argF/argF-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgF
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. Native KT2440 argF auxotrophy and curated reaction support anabolic
      ornithine carbamoyltransferase. Amino acid binding and ornithine metabolism are true core-associated
      claims; no narrower experimentally established binding term is invented. Broad amino-acid metabolism
      and carbamoyltransferase annotations are refined. The generic enzyme reaction can be reversible
      without making this target the catabolic ArcB paralog.
  findings:
  - statement: The report identifies the exact accession, retrieves the ornithine-carbamoyltransferase
      reaction, and distinguishes biosynthetic ArgF from catabolic ArcB. Extrapolated regulation and mechanism
      claims are not used here.
    supporting_text: carbamoyl phosphate + L-ornithine → L-citrulline + phosphate
