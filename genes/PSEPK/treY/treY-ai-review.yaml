- id: PMID:8605217
  title: Cloning and sequencing of trehalose biosynthesis genes from Arthrobacter sp. Q36.
  findings:
  - statement: The characterized Arthrobacter locus contains adjacent treY and treZ genes.
    supporting_text: >-
      Sequence analysis of the DNA fragment revealed two open reading frames of
      2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
      maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this provides ortholog and
      pathway context rather than direct evidence for PSEPK TreY.
- id: PMID:8611744
  title: Purification and properties of a novel enzyme, maltooligosyl trehalose synthase, from Arthrobacter sp. Q36.
  findings:
  - statement: Arthrobacter sp. Q36 TreY was purified and its reaction was measured.
    supporting_text: >-
      Arthrobacter sp. Q36 produces a novel enzyme, maltooligosyl trehalose
      synthase, which catalyzes the conversion of maltooligosaccharide into the
      non-reducing saccharide, maltooligosyl trehalose (alpha-maltooligosyl
      alpha-D-glucoside) by intramolecular transglycosylation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this biochemically supports
      the TreY reaction represented by the exact Arthrobacter exemplar, not a
      direct assay of Q88FN6.
core_functions:
- description: >-
    Rearranges an alpha-glucan reducing end to form maltooligosyltrehalose in
    the first reaction of the TreY/TreZ trehalose-biosynthesis route.
  molecular_function:
