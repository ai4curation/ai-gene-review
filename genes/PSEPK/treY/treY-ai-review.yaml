id: Q88FN6
gene_symbol: treY
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TreY is the maltooligosyl trehalose synthase of the TreY/TreZ route. It
  rearranges the reducing-end alpha-1,4 glucosidic linkage of an alpha-glucan
  to an alpha,alpha-1,1 linkage, producing maltooligosyltrehalose for
  hydrolysis by TreZ.
