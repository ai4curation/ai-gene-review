suggested_questions:
- question: Which endogenous KT2440 alpha-glucan pool is the physiological substrate for TreY?
suggested_experiments:
- description: >-
    Measure TreY-dependent maltooligosyltrehalose formation from defined
    glycogen and maltooligosaccharide substrates and test trehalose production
    in a treY deletion strain.
