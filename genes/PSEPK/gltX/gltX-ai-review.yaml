- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: KT2440 GltX loses canonical zinc ligands, but native binding remains unresolved.
    action: UNDECIDED
    reason: The reproduced three-protein alignment maps E. coli C98/C100/C125/H127 and PAO1 C107/C109/C134/H136
      to KT2440 C107/C109/A134/L136. Thus the actual three-cysteine/one-histidine site has lost its last
      two ligands. This establishes divergence of the canonical site, not a negative native zinc-binding
      assay. Full PMID:25686371 separates zinc occupancy, transplanted-domain binding and catalytic requirement;
      alternative coordination motifs exist. No native KT2440 metal-content or affinity measurement was
      found, so the broader zinc-binding claim remains unresolved rather than categorically excluded.
    supported_by:
    - reference_id: file:PSEPK/gltX/gltX-bioinformatics/RESULTS.md
      supporting_text: The primary E. coli ligands C98/C100/C125/H127 map to KT2440 C107/C109/A134/L136.
