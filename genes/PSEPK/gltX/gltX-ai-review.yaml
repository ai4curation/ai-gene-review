- id: file:PSEPK/gltX/gltX-bioinformatics/RESULTS.md
  title: Sequence assessment of the GltX zinc-binding annotation
  findings:
  - statement: The canonical three-cysteine/one-histidine site diverges in KT2440; this does not exclude
      alternative native zinc binding.
    supporting_text: However, this site-specific divergence is insufficient to exclude all native zinc
      binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproduced three-way reference-site mapping corrects the former four-cysteine premise.
      Full PMID:25686371 requires separating native occupancy, binding capacity and catalytic requirement.
- id: PMID:7797500
  title: The zinc-binding site of Escherichia coli glutamyl-tRNA synthetase is located in the acceptor-binding
    domain. Studies by extended x-ray absorption fine structure, molecular modeling, and site-directed
    mutagenesis.
  findings:
  - statement: The E. coli GluRS canonical site contains three cysteines and one histidine, correcting
      the legacy four-cysteine interpretation.
    supporting_text: Cys125 and His127
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The E. coli GluRS canonical site contains three cysteines and one histidine, correcting
      the legacy four-cysteine interpretation.
- id: PMID:25686371
  title: Dispensability of zinc and the putative zinc-binding domain in bacterial glutamyl-tRNA synthetase.
  findings:
  - statement: Domain-swapped E. coli constructs separate metal binding from catalytic requirement; native
      structural absence and a hypothetical target binding capacity are not equivalent.
    supporting_text: whereas the other constructs, all zinc-bound, show impaired function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Domain-swapped E. coli constructs separate metal binding from catalytic requirement;
      native structural absence and a hypothetical target binding capacity are not equivalent.
- id: PMID:14729703
  title: Direct glutaminyl-tRNA biosynthesis and indirect asparaginyl-tRNA biosynthesis in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Native PAO1 uses direct GlnRS and indirect Asn formation; its GatABC also transamidates
      supplied heterologous Glu-tRNA(Gln) in vitro. Do not infer native KT2440 Gln-transamidation flux
      from that capacity.
    supporting_text: The heterotrimeric AdT of P. aeruginosa has no Glu-tRNA Gln substrate in its host,
      but it can transamidate heterologous Glu-tRNA Gln .
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native PAO1 uses direct GlnRS and indirect Asn formation; its GatABC also transamidates
      supplied heterologous Glu-tRNA(Gln) in vitro. Do not infer native KT2440 Gln-transamidation flux
      from that capacity.
