  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The broad tRNA aminoacylation term is true but uninformative beside the substrate-specific process annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006424 already captures the direct GltX process specifically.
    supported_by:
