taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GltX is a cytosolic class-I glutamyl-tRNA synthetase that activates glutamate with ATP and
  attaches it to tRNA(Glu) for translation. Its conserved catalytic architecture includes the HIGH and
  KMSKS regions. Its putative zinc-binding region differs at two positions from the characterized E. coli
  and P. aeruginosa canonical coordination sites.
