- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The zinc-binding call is contradicted by loss of the conserved four-cysteine zinc-binding cluster.
    action: REMOVE
    reason: >-
      Alignment to zinc-binding Escherichia coli GluRS P04805 shows that Q88LF6
      retains the first Cys pair but lacks the downstream cysteine needed to
      preserve the four-cysteine zinc-binding cluster. The InterPro-derived
      zinc-binding transfer is therefore not appropriate for this protein.
    supported_by:
    - reference_id: file:PSEPK/gltX/gltX-bioinformatics/RESULTS.md
      supporting_text: "Q88LF6 therefore does not preserve the four-cysteine zinc-binding cluster present in P04805."
