id: Q88LF6
gene_symbol: gltX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GltX is the class I glutamate--tRNA ligase of Pseudomonas putida KT2440. It
  uses ATP to attach L-glutamate to tRNA(Glu), producing Glu-tRNA(Glu) for
  translation. Whether it also misacylates tRNA(Gln) in this GlnRS-containing
  strain has not been established by the reviewed record.
existing_annotations:
