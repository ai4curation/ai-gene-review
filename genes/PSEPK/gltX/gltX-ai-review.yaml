    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: tRNA binding is inherent to the documented GltX reaction but is less informative than catalysis.
    action: KEEP_AS_NON_CORE
    reason: The reaction explicitly uses tRNA(Glu); GO:0004818 captures the core activity.
    supported_by:
    - reference_id: file:PSEPK/gltX/gltX-uniprot.txt
      supporting_text: "Reaction=tRNA(Glu) + L-glutamate + ATP"
