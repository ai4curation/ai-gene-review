suggested_questions:
- question: >-
    Does Q88LF6 also recognize tRNA(Gln) and generate Glu-tRNA(Gln) under any
    physiological condition despite the presence of GlnS?
suggested_experiments:
- hypothesis: Q88LF6 may discriminate strongly against tRNA(Gln) in this GlnRS-containing strain.
  description: >-
    Compare purified GltX aminoacylation kinetics with native KT2440 tRNA(Glu)
    and tRNA(Gln), and identify charged products by acid-urea electrophoresis or LC-MS.
