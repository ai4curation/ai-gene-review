id: Q88QD9
gene_symbol: acoA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AcoA (PP_0555) is the thiamine-diphosphate-dependent E1 alpha subunit of the
  bacterial acetoin-cleaving system. Together with AcoB, it forms the
  acetoin:DCPIP oxidoreductase E1 component that cleaves acetoin and reductively
  acetylates the lipoyl arm of AcoC; it is an acetoin-catabolic paralog of
  2-oxoacid dehydrogenase E1 proteins, not a pyruvate dehydrogenase subunit.
existing_annotations:
- term:
    id: GO:0004739
    label: pyruvate dehydrogenase (acetyl-transferring) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The propagated pyruvate-specific activity is inappropriate for acetoin-system AcoA.
    action: REMOVE
    reason: >-
      PTN002264059 places this acetoin-specific E1 alpha paralog in a broad
      pyruvate-dehydrogenase lineage. The locus paper instead identifies AcoA as
      E1 alpha of the acetoin-cleaving system. The available GO molecular
      function that captures its complex-level redox chemistry is GO:0016624,
      and AcoA contributes to rather than independently enables that activity;
      that qualifier-correct assertion is added separately below.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: >-
        The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha
        (M(r) 34639), E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida
        acetoin cleaving system
- term:
    id: GO:0006086
    label: pyruvate decarboxylation to acetyl-CoA
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: AcoA participates in acetoin catabolism, not pyruvate decarboxylation.
    action: REMOVE
    reason: >-
      The PTN002264059 process propagation follows the generic E1 fold rather
      than substrate specificity. Gene identity, operon context, and the PpG2
      locus study support acetoin catabolism; the correct process is added as
      a separate NEW annotation below.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: >-
        The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were
        simultaneously induced in Pseudomonas putida PpG2 during growth on
        2,3-butanediol and on acetoin.
- term:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The term captures the E1 redox chemistry, but the alpha subunit acts with AcoB.
    action: REMOVE
    reason: >-
      AcoA and AcoB form an alpha2-beta2 E1 component in the experimentally
      characterized H16 exemplar. The term should therefore use contributes_to
      for this individual subunit rather than enables. The enables assertion is
      removed and replaced by the qualifier-correct row below.
    supported_by:
    - reference_id: PMID:2061286
      supporting_text: >-
        Ao:DCPIP OR consisted of alpha and beta subunits (Mrs, 35,500 and 36,000,
        respectively), and a tetrameric alpha 2 beta 2 structure was most likely
        for the native protein.
- term:
    id: GO:0045150
    label: acetoin catabolic process
  evidence_type: ISS
  original_reference_id: PMID:7813883
  qualifier: involved_in
  review:
    summary: AcoA is the E1 alpha subunit of the inducible acetoin-cleaving system.
    action: NEW
    reason: The PpG2 locus and induction evidence place AcoA directly in acetoin catabolism.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: >-
        The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were
        simultaneously induced in Pseudomonas putida PpG2 during growth on
        2,3-butanediol and on acetoin.
- term:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  evidence_type: ISS
  original_reference_id: PMID:2061286
  qualifier: contributes_to
  review:
    summary: AcoA contributes with AcoB to the assembled E1 redox activity.
    action: NEW
    reason: The alpha and beta subunits form the active alpha2-beta2 E1 component.
    supported_by:
    - reference_id: PMID:2061286
      supporting_text: >-
        Ao:DCPIP OR consisted of alpha and beta subunits (Mrs, 35,500 and 36,000,
        respectively), and a tetrameric alpha 2 beta 2 structure was most likely
