proposed_new_terms:
- proposed_name: acetoin dehydrogenase (acetyl-transferring) activity
  proposed_definition: Catalysis of the oxidative cleavage of acetoin with reductive acetylation of the
    oxidized lipoyl group of the acetoin-system E2 component, producing acetaldehyde and an S-acetyldihydrolipoyl
    group.
  justification: GO:0016624 captures only the broad oxidoreductase class, while the characterized AcoA/AcoB
    E1 complex has acetoin-specific chemistry distinct from pyruvate-dehydrogenase E1.
  proposed_parent:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  supported_by:
  - reference_id: PMID:7813883
    supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r) 34639),
      E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system
suggested_questions:
- question: What are the KT2440 E1 substrate spectrum and oligomeric arrangement, including any measurable
    pyruvate side activity?
- question: Which native lipoyl-dehydrogenase supplies the recycling reaction for this acetoin system?
suggested_experiments:
- description: Reconstitute KT2440 AcoA/AcoB with lipoylated AcoC and a candidate E3; compare acetoin,
    diacetyl and pyruvate while testing clean nonpolar subunit deletions and complementation.
  experiment_type: biochemical reconstitution and reverse genetics
