      (M(r) 34639), E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida
      acetoin cleaving system
suggested_questions:
- question: Does KT2440 AcoA/AcoB show the same acetoin specificity and alpha2-beta2 stoichiometry as the H16 enzyme?
suggested_experiments:
- description: Purify KT2440 AcoA/AcoB and assay acetoin-dependent reductive acetylation of lipoylated AcoC.
  experiment_type: reconstituted enzyme assay
