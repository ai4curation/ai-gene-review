proposed_new_terms:
- proposed_name: acetoin dehydrogenase (acetyl-transferring) activity
  proposed_definition: >-
    Catalysis of the oxidative cleavage of acetoin with reductive acetylation
    of the oxidized lipoyl group of the acetoin-system E2 component, producing
    acetaldehyde and an S-acetyldihydrolipoyl group.
  justification: >-
    GO:0016624 captures only the broad oxidoreductase class, while the
    characterized AcoA/AcoB E1 complex has acetoin-specific chemistry distinct
    from pyruvate-dehydrogenase E1.
  proposed_parent:
    id: GO:0016624
