  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PurT is the ATP- and formate-dependent GAR transformylase that provides an alternative route
  from GAR to FGAR during de novo IMP synthesis. It occupies the same pathway position as folate-dependent
  PurN but uses free formate as the one-carbon donor.
