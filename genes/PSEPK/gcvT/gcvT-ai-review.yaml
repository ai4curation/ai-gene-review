  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GcvT is one of two KT2440 glycine cleavage T proteins. It is an
  aminomethyltransferase that accepts aminomethyl-dihydrolipoyl-H protein,
  releases ammonium, and transfers the one-carbon unit to tetrahydrofolate to
  form 5,10-methylenetetrahydrofolate. It is encoded with the gcvP2/gcvH2 set.
  A homologous second set forms a glycine-responsive gcs2 operon in P.
  aeruginosa, but equivalent KT2440 regulation has not been demonstrated.
