proposed_new_terms:
  - proposed_name: periplasmic lipoprotein carrier activity
    proposed_definition: >-
      Binding a mature lipid-anchored protein released from the bacterial inner
      membrane, shielding its lipid moiety during carriage through the periplasm,
      and presenting it to an outer-membrane acceptor.
    justification: >-
      GO:0042953 and GO:0044874 express the process but GO lacks a molecular-function
      term for the direct carrier activity performed by LolA.
    proposed_parent:
      id: GO:0003674
      label: molecular_function
