      label: lipoprotein carrier activity
    evidence_type: ISS
    original_reference_id: file:PSEPK/lolA/lolA-uniprot.txt
    qualifier: enables
    review:
      summary: LolA is the periplasmic lipoprotein carrier of the Lol pathway.
      action: NEW
      reason: >-
        GO:0140598 lipoprotein carrier activity ("binding to and carrying a
        lipoprotein between two different cellular locations") exactly
        describes the conserved LolA role. Q88FS9 is a reviewed LolA-family
        member (HAMAP MF_00240, PTHR35869:SF1), and the carrier activity is
        established experimentally for E. coli LolA, which forms soluble
        complexes with released outer-membrane lipoproteins and binds them in
        its hydrophobic cavity.
      supported_by:
        - reference_id: file:PSEPK/lolA/lolA-uniprot.txt
          supporting_text: Participates in the translocation of lipoproteins from the
        - reference_id: PMID:7628437
          supporting_text: p20 is a periplasmic carrier protein involved in the translocation of lipoproteins from the inner to the outer membrane
