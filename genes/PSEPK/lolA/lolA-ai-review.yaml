  label: Pseudomonas putida KT2440
description: >-
  Periplasmic LolA-family carrier that accepts outer-membrane-destined mature
  lipoproteins from the inner-membrane LolCDE complex and carries them across
  the periplasm to LolB for outer-membrane delivery.
