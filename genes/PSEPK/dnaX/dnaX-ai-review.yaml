id: Q88F30
gene_symbol: dnaX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: DnaX encodes the gamma/tau subunit of the bacterial DNA polymerase III clamp-loader assembly. As an ATP-dependent structural component of the replisome, DnaX coordinates loading of the DnaN beta clamp onto primed DNA and couples polymerase cores at the replication fork. It contributes to polymerase III function but is not itself the DNA-polymerizing catalytic subunit.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Clamp loaders contact primed DNA, but generic DNA binding is not the defining DnaX function.
    action: KEEP_AS_NON_CORE
    reason: DnaX recognizes primer-template junctions as part of a multisubunit loader; its core role is ATP-dependent clamp loading and replisome organization.
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Incorrect catalytic assignment inherited from the polymerase III complex.
    action: REMOVE
    reason: DnaX is a clamp-loader/coupling subunit; DnaEA is the DNA-polymerizing alpha subunit.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct nucleotide-binding property required for ATP-dependent clamp loading.
    action: ACCEPT
    reason: DnaX contains an AAA+ ATPase domain and uses ATP in clamp-loader operation.
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct core process annotation for an essential replisome organizer.
    action: ACCEPT
    reason: DnaX loads the processivity clamp and couples polymerase cores during chromosome replication.
- term:
    id: GO:0006261
    label: DNA-templated DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct but redundant replication-process annotation.
    action: ACCEPT
    reason: DnaX acts directly in template-dependent chromosome duplication.
- term:
    id: GO:0009360
    label: DNA polymerase III complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: Correct complex-membership annotation.
    action: ACCEPT
    reason: DnaX is the gamma/tau subunit of the DNA polymerase III clamp-loader/replisome assembly.
- term:
    id: GO:0034061
    label: DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: Incorrect individual catalytic assignment.
    action: REMOVE
    reason: Polymerase activity belongs to DnaEA; DnaX contributes structurally and through ATP-dependent clamp loading.
- term:
    id: GO:0071897
    label: DNA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
