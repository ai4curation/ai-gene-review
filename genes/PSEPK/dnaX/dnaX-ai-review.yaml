id: Q88F30
gene_symbol: dnaX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DnaX is the ATPase and organizing subunit of the Pseudomonas putida KT2440 DNA polymerase
  III clamp-loader assembly. It cooperates with delta and delta-prime subunits to load the beta sliding
  clamp onto primed DNA and couples polymerase cores at the replication fork. DnaX does not catalyze DNA
  polymerization. The presence and processing mechanism of a separate gamma product are not established
  here.
