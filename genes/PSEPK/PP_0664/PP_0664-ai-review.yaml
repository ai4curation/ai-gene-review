- id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a branched
    network of many biochemical pathways.
  findings:
  - statement: Review of the branched aspartate-family network; target assignments depend on independent
      target family evidence and, where available, native primary cloning.
    supporting_text: A multibranched web of biochemical pathways of central importance is initiated by
      the action of aspartokinase (Ask) in a reaction that combines aspartate and ATP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read for pathway chemistry and variation in branch/allosteric regulation.
      It is not a native KT2440 enzyme experiment and does not justify transferring a universal feedback
      pattern or essentiality.
