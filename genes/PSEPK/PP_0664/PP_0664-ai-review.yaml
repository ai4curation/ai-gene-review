  label: Pseudomonas putida KT2440
description: PP_0664 is a short-form homoserine dehydrogenase predicted to reduce L-aspartate 4-semialdehyde
  to L-homoserine. It has a conserved homoserine-dehydrogenase catalytic region and inferred NADPH-binding
  and proton-donor sites. Its contribution relative to the longer Hom/PP_1470 enzyme, native cofactor
  preference and regulation remain unresolved.
