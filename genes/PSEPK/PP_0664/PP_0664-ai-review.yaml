- id: file:PSEPK/PP_0664/PP_0664-deep-research-openscientist.md
  title: Existing openscientist research report for PSEPK PP_0664
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Family chemistry is corroborated independently, but preferred NADPH kinetics, native
      feedback and locus-specific auxotrophy are not established by the cited evidence. PMID:29636528
      concerns Sulfolobus, and PMID:20158506 abstract does not identify this locus. Native 2025 Hom is
      PP_1470, not PP_0664.
- id: PMID:29636528
  title: Inhibition of homoserine dehydrogenase by formation of a cysteine-NAD covalent complex.
  findings:
  - statement: Comparative archaeal enzyme study; no native KT2440 paralog assay or transferable donor
      preference.
    supporting_text: HSD from the hyperthermophilic archaeon Sulfolobus tokodaii (StHSD)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary paper read. Sulfolobus tokodaii kinetics, cysteine regulation and structure
      are not assigned to either PSEPK paralog. The discussion also illustrates that cofactor binding
      need not imply productive coenzyme use in every homolog; native NADH/NADPH kinetics remain unresolved.
