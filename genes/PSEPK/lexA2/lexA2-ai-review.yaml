  title: Falcon (Edison Scientific) deep research report on lexA2 (PP_3116, P. putida KT2440)
  findings:
  - supporting_text: LexA2 is a **sequence-specific DNA-binding transcriptional repressor** that
      controls transcription of a small set of DNA damage–responsive loci in KT2440.
  - supporting_text: 'In KT2440, **LexA1 controls 18 transcriptional units**, whereas **LexA2 controls
      only 2 transcriptional units**: **(i)** its own operon **PP_3116-PP_3119 (lexA2-imuA-imuB-dnaE2)**
      and **(ii) PP_3901**, a prophage-associated gene also regulated by LexA1.'
  - supporting_text: '**LexA2 motif:** GTACN4GTGC (divergent).'
  - supporting_text: LexA-family proteins belong to an autoprotease family (often described as peptidase
      S24/LexA-like) and undergo **RecA-stimulated self-cleavage** as a regulatory switch.
  - supporting_text: LexA-family repressors function as **cytosolic DNA-binding transcription factors**
      that act at **chromosomal promoter/operator regions**; no evidence suggests secretion or membrane
      localization.
  - supporting_text: '**lexA2 mutants were viable** and, under tested conditions, showed **no obvious
      growth or mitomycin C survival defect** versus wild type, indicating LexA2 is not the main
      global SOS repressor in KT2440.'
