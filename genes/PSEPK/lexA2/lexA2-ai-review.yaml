id: P59479
gene_symbol: lexA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LexA2 is a DNA-binding transcriptional repressor in Pseudomonas putida KT2440. It directly
  represses the lexA2-imuA-imuB-dnaE2 cassette and the prophage-associated gene PP_3901, forming
  a narrower DNA-damage-responsive regulatory branch than the principal LexA1 regulon. LexA-family
  catalytic machinery supports regulated self-cleavage as a mechanism of derepression, although a
  purified target cleavage assay was not identified. Its narrow regulon includes damage-tolerance
  machinery with condition-dependent mutagenic effects; a small regulon does not make LexA2 unrelated
  to SOS signaling.
