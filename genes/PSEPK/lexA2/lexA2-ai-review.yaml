- term:
    id: GO:0009432
    label: SOS response
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LexA2 regulates a narrow SOS damage-tolerance branch distinct from the larger LexA1 regulon.
    action: ACCEPT
    reason: GO:0009432 does not require a protein to be the sole or principal SOS regulator. KT2440
      LexA2 directly represses its damage-inducible imuABC cassette and PP_3901, and releases that
      repression after damage. Its product performs regulatory work rather than merely being induced.
      The lack of a gross growth phenotype and the larger LexA1 regulon do not negate this role. PaW85,
      described as isogenic to KT2440, also shows ImuC-dependent MMS mutagenesis; stationary-phase
      antimutator behavior is a separate condition. Retain the core SOS assignment with this narrow-regulon
      scope.
