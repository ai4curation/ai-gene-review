  review:
    summary: GalE supplies one reversible UDP-sugar reaction, but KT2440 lacks identifiable GalK and GalT steps required for Leloir catabolism.
    action: REMOVE
    reason: This TreeGrafter process propagation over-interprets a broadly used nucleotide-sugar epimerase as evidence for a complete pathway that is not satisfiable in this proteome.
    supported_by:
    - reference_id: file:PSEPK/galE/galE-deep-research-openscientist.md
      supporting_text: Because KT2440 has no galactokinase (galK) or Gal-1-P uridylyltransferase (galT), the classic catabolic Leloir loop is broken.
