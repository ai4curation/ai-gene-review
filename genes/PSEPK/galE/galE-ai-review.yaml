  title: OpenScientist deep research for PSEPK galE
  findings:
  - statement: >-
      No direct characterization of Q88I72 was found, and the proposed
      anabolic role remains a pathway-context inference.
    supporting_text: "No direct experimental characterization of Q88I72."
  - statement: >-
      The KT2440 pathway inventory lacks the two upstream enzymes needed for
      canonical Leloir galactose catabolism.
    supporting_text: "there is **no galactokinase galK (K00849)** and **no galactose-1-phosphate uridylyltransferase galT (K00965)** ortholog."
  reference_review:
