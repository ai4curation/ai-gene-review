taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: galE encodes a cytoplasmic, NAD-dependent UDP-glucose 4-epimerase that reversibly interconverts UDP-glucose and UDP-galactose. In Pseudomonas putida KT2440, GalE most plausibly supplies UDP-galactose for cell-surface glycan biosynthesis; the proteome lacks identifiable GalK and GalT enzymes required for a complete catabolic Leloir pathway.
