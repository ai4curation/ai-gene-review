    correctness: UNVERIFIED
    review_notes: >-
      On-target provider report. Its proposed LPS/EPS role is a comparative
      pathway-context inference from soluble GalE chemistry, neighboring genes,
      absent GalK/GalT, and other Gram-negative galE phenotypes, not direct
      KT2440 evidence for asserting GO:0009103.
