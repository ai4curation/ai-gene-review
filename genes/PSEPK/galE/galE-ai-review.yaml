id: Q88I72
gene_symbol: galE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  galE (PP_3129) encodes an NAD+-dependent UDP-glucose 4-epimerase that
  reversibly interconverts UDP-alpha-D-glucose and UDP-alpha-D-galactose. In
  KT2440 it is best supported as an activated-sugar interconversion enzyme for
  anabolic glycan precursor supply; a complete canonical Leloir galactose
  catabolic route is not established.
existing_annotations:
- term:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the defining EC 5.1.3.2 activity and agrees with the UniProt
      name, reaction assignment, and GalE-family domain architecture.
    action: ACCEPT
- term:
    id: GO:0006012
    label: galactose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Reversible UDP-glucose/UDP-galactose interconversion is part of
      galactose metabolism broadly, without committing to a catabolic route.
    action: ACCEPT
- term:
    id: GO:0033499
    label: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This TreeGrafter term commits GalE to canonical Leloir catabolism, but
      the expected upstream GalK and GalT route is not established in KT2440.
      GalE is better supported here as an anabolic UDP-galactose supplier.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The catalytic activity is sound, but pathway context does not justify
      the specific beta-D-galactose catabolic process.
