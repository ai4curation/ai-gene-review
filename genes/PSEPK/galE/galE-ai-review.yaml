suggested_questions:
- question: >-
    Does Q88I72 accept only UDP-glucose/UDP-galactose, or also acetylated or
    arabinose nucleotide sugars suggested by neighboring family assignments?
- question: >-
    Can KT2440 use galactose through any Leloir or alternative route under
    defined growth conditions?
suggested_experiments:
- description: >-
    Measure purified Q88I72 activity across UDP-sugar substrates and test
    glycan composition and galactose utilization in a galE mutant.
  experiment_type: comparative enzymology and genetics
