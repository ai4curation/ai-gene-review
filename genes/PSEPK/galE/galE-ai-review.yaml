- id: file:PSEPK/galE/galE-deep-research-openscientist.md
  title: OpenScientist functional review of Pseudomonas putida KT2440 GalE
  findings:
  - statement: The conserved SDR catalytic architecture supports canonical UDP-glucose/UDP-galactose 4-epimerase activity.
  - statement: Absence of GalK and GalT and placement of galE in an exopolysaccharide locus support a biosynthetic nucleotide-sugar role rather than catabolic Leloir flux.
