id: Q88I72
gene_symbol: galE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  galE (PP_3129) encodes an NAD+-dependent UDP-glucose 4-epimerase that
  reversibly interconverts UDP-alpha-D-glucose and UDP-alpha-D-galactose. In
  KT2440 its inferred physiological role is activated-sugar interconversion for
  anabolic glycan precursor supply; the organism lacks a complete canonical
  Leloir galactose catabolic route.
existing_annotations:
- term:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the defining EC 5.1.3.2 activity and agrees with the UniProt
      name, reaction assignment, and GalE-family domain architecture.
    action: ACCEPT
    reason: >-
      UniProt assigns the exact reversible UDP-glucose/UDP-galactose
      epimerization reaction.
    supported_by:
    - reference_id: file:PSEPK/galE/galE-uniprot.txt
      supporting_text: Reaction=UDP-alpha-D-glucose = UDP-alpha-D-galactose;
- term:
    id: GO:0006012
    label: galactose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Reversible UDP-glucose/UDP-galactose interconversion is part of
      galactose metabolism broadly, without committing to a catabolic route.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain this broad substrate-level context without implying that KT2440
      has a complete galactose-catabolic route.
    supported_by:
    - reference_id: file:PSEPK/galE/galE-uniprot.txt
      supporting_text: 'PATHWAY: Carbohydrate metabolism; galactose metabolism.'
- term:
    id: GO:0033499
    label: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This TreeGrafter term commits GalE to canonical Leloir catabolism, but
      the expected upstream GalK and GalT route is not established in KT2440.
      GalE is better supported here as an anabolic UDP-galactose supplier.
    action: REMOVE
    reason: >-
      This electronic propagation assigns a complete catabolic pathway that is
      not satisfiable in KT2440: the proteome lacks identifiable GalK and GalT,
      while GalE is supported as an anabolic nucleotide-sugar epimerase.
    supported_by:
    - reference_id: file:PSEPK/galE/galE-deep-research-openscientist.md
      supporting_text: "there is **no galactokinase galK (K00849)** and **no galactose-1-phosphate uridylyltransferase galT (K00965)** ortholog."
