  label: Pseudomonas putida KT2440
description: PP_0982 encodes LptF, one of the two nonidentical inner-membrane permease subunits of the
  LptB2FG ABC transporter. LptF forms part of the membrane pathway that extracts lipopolysaccharide from
  the inner membrane and passes it to LptC, while ATP hydrolysis is performed by LptB.
