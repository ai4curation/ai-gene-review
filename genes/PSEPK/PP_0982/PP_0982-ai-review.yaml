core_functions:
- description: LptF forms one transmembrane half of the LptB2FG ABC transporter. Together with its partner
    permease it builds the cavity that takes up LPS from the outer leaflet of the inner membrane, and
    ATP hydrolysis by LptB drives the LPS out of the cavity into the periplasmic LptC/LptA/LptD bridge.
