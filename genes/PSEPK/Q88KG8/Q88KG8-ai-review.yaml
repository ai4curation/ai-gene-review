  review:
    summary: OprI is a Braun-lipoprotein-like connector covalently attached to peptidoglycan; peptidoglycan binding is the molecular function its canonical analog Lpp carries.
    action: NEW
    reason: >-
      OprI's C-terminal Lys83 side chain is covalently attached to the
      peptidoglycan stem, so the protein engages peptidoglycan directly. The
      comparator check supports this term over a generic structural term: the
      canonical structural OM lipoprotein, E. coli Braun's lipoprotein Lpp
      (UniProtKB:P69776), is annotated to GO:0042834 peptidoglycan binding (TAS)
      and carries no "structural constituent/molecule" term.
    supported_by:
    - reference_id: PMID:42100858
      supporting_text: Furthermore, we reconstitute this reaction in vitro with the use of purified recombinant PA2854, OprI, and synthetic samples of the cell-wall peptidoglycan, in each case documenting the attachment of the side-chain ε-amino group of Lys83 of OprI to the peptide stem of the peptidoglycan.
