  label: Pseudomonas putida KT2440
description: >-
  OprI is the major outer-membrane lipoprotein of Pseudomonas putida KT2440 and
  the ortholog of the well-studied Pseudomonas aeruginosa OprI. It is a small
  (83-residue) protein with an N-terminal signal peptide and a lipobox cysteine
  (Cys20) that is triacylated, anchoring the mature protein in the inner leaflet
  of the outer membrane; a long coiled-coil (alanine-zipper) region mediates
  oligomerization. Functionally it is a Braun-lipoprotein-like structural
  connector: its C-terminal lysine is the covalent acceptor through which an
  ErfK-family L,D-transpeptidase attaches OprI to a peptidoglycan stem, tethering
  the outer membrane to the sacculus, and a YafK/LdtF-family hydrolase can later
  release it.
