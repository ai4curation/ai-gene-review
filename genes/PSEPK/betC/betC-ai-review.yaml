- id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: KT2440 betC is required to use choline-O-sulfate as a carbon or nitrogen source but not to accumulate it.
    supporting_text: This mutant still accumulated intact COS but failed to use this compound as carbon or nitrogen source.
    reference_section_type: ABSTRACT
  - statement: High salt downregulates betC, supporting metabolism rather than osmoprotection as its main KT2440 role.
    supporting_text: the principal role of this gene lied in COS metabolism, not in osmoprotection
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified; direct KT2440 betC genetics, but not isolated enzyme kinetics.
- id: PMID:9736747
  title: 'Presence of a gene encoding choline sulfatase in Sinorhizobium meliloti bet operon: choline-O-sulfate is metabolized into glycine betaine.'
  full_text_unavailable: true
  findings:
  - statement: Sinorhizobium BetC directly converts choline-O-sulfate and, more slowly, phosphorylcholine to choline.
    supporting_text: a new gene (betC) was identified as encoding a choline sulfatase catalyzing the conversion of choline-O-sulfate and, at a lower rate, phosphorylcholine, into choline.
    reference_section_type: ABSTRACT
  - statement: Loss of betC eliminates choline-sulfatase activity in the ortholog system.
    supporting_text: Choline sulfatase activity was absent from betC but not from betB mutants
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified; direct ortholog genetics and enzymology for reviewed UniProt exemplar O69787.
- id: PMID:29458126
  title: 'Structural and Mechanistic Analysis of the Choline Sulfatase from Sinorhizobium melliloti: A Class I Sulfatase Specific for an Alkyl Sulfate Ester.'
  findings:
  - statement: Purified Sinorhizobium choline sulfatase efficiently hydrolyzes choline-O-sulfate.
    supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the hydrolysis of alkyl sulfate choline-O-sulfate
    reference_section_type: ABSTRACT
  - statement: The crystal structure defines the active site of this BetC exemplar.
    supporting_text: Its 2.8-Å resolution X-ray structure shows a buried, largely hydrophobic active site
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and PubMed identity verified; direct purified-enzyme kinetics and structure for the Sinorhizobium BetC exemplar.
- id: file:PSEPK/betC/betC-deep-research-openscientist.md
  title: OpenScientist deep-research report for PSEPK betC
  findings:
  - statement: The report identifies the exact target and conserved choline-sulfatase motif.
    supporting_text: A direct sequence scan locates the universal sulfatase active-site signature **(C/S)-X-P-X-R** as **C52-A-P-S-R56** near the N-terminus.
    reference_section_type: DISCUSSION
  - statement: The report explicitly notes the absence of purified KT2440 Q88RQ2 enzymology.
    supporting_text: No direct enzymology on the *P. putida* protein itself.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Exact target identity, motif, direct KT2440 phenotype, and absence of
      target-protein kinetics were retained. The report's assertion that the
      adjacent proteins form the importer is rejected: current PP_0075
      architecture is SLC26A/SulP-STAS, and no cognate local ABC ATPase or
      target-specific transport assay is established.
