suggested_questions:
- question: What are the kinetic parameters and in vivo contributions of KT2440 BetC for choline-O-sulfate versus phosphorylcholine?
suggested_experiments:
- description: Purify Q88RQ2 and quantify choline-O-sulfate and phosphorylcholine hydrolysis, then compare metabolite flux and growth in clean betC deletion and complementation strains under carbon-, nitrogen-, and sulfur-source conditions.
