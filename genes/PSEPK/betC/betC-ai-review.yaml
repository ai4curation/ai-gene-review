taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BetC is a cytoplasmic choline sulfatase that hydrolyzes choline-O-sulfate to
  choline, sulfate, and a proton. In Pseudomonas putida KT2440 it supports use
  of choline-O-sulfate as a carbon or nitrogen source; unlike BetA/BetB-mediated
  glycine-betaine production, its principal role is choline-O-sulfate metabolism
  rather than osmoprotection.
