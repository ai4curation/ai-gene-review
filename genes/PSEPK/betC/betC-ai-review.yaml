id: Q88RQ2
gene_symbol: betC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  BetC is a choline sulfatase that hydrolyzes choline-O-sulfate to choline, sulfate, and a proton. In
  Pseudomonas putida KT2440 it supports use of choline-O-sulfate as a carbon or nitrogen source; unlike
  BetA/BetB-mediated glycine-betaine production, its principal role is choline-O-sulfate metabolism rather
  than osmoprotection.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Intact COS accumulation supports uptake before BetC-dependent metabolism, but does not
      resolve the enzyme compartment.
    action: UNDECIDED
    reason: >-
      The existing TreeGrafter cytoplasm inference is plausible and is not contradicted. KT2440 provides
      stronger target physiology than the other BetC comparators: the betC mutant still accumulates intact
      COS while failing to use it as carbon or nitrogen source (PMID:17116241). This favors uptake before
      BetC-dependent hydrolysis, but the accessible abstract does not identify a compartment-resolving
      assay or locate the enzyme. Accumulation alone does not discriminate cytoplasmic enzyme activity
      from another cell compartment. Choline-sulfatase family membership supports the chemistry, not the
      side of the membrane where it occurs. With full experimental localization evidence unavailable,
      retain this original row as UNDECIDED and omit a core location; the supported molecular function
      is unchanged.
    supported_by:
    - reference_id: PMID:17116241
      supporting_text: This mutant still accumulated intact COS but failed to use this compound as
        carbon or nitrogen source.
    - reference_id: file:PSEPK/betC/betC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR017785; Choline-sulfatase.
- term:
    id: GO:0008484
    label: sulfuric ester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Correct but general parent of the choline-sulfatase activity this gene already carries.
    action: MODIFY
    reason: >-
      BetC hydrolyzes a sulfate ester, so the TreeGrafter term is true, but the
      choline-sulfatase family signatures, the KT2440 betC phenotype and the
      direct biochemistry of the Sinorhizobium ortholog support the specific
      child term choline-sulfatase activity (GO:0047753), already accepted on
      this gene. Treated the same way as the S. meliloti ortholog O69787.
    proposed_replacement_terms:
    - id: GO:0047753
      label: choline-sulfatase activity
    supported_by:
    - reference_id: file:PSEPK/betC/betC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR000917; Sulfatase_N.
    - reference_id: PMID:9736747
      supporting_text: a new gene (betC) was identified as encoding a choline sulfatase catalyzing
        the conversion of choline-O-sulfate and, at a lower rate, phosphorylcholine, into choline.
- term:
    id: GO:0047753
    label: choline-sulfatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Accept exact choline-sulfatase activity as the core molecular function.
    action: ACCEPT
    reason: KT2440 betC loss prevents use of accumulated choline-O-sulfate as carbon or nitrogen
      source, and Q88RQ2 carries specific choline-sulfatase family signatures. Recombinant
      1021/O69787 biochemistry supplies comparative evidence for this reaction. Together these
      support the target activity without claiming isolated Q88RQ2 kinetics, transferring
      phosphorylcholine activity, or identifying the COS importer.
    supported_by:
    - reference_id: file:PSEPK/betC/betC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR017785; Choline-sulfatase.
    - reference_id: PMID:17116241
      supporting_text: This mutant still accumulated intact COS but failed to use this compound as
        carbon or nitrogen source.
    - reference_id: PMID:9736747
      supporting_text: a new gene (betC) was identified as encoding a choline sulfatase catalyzing
        the conversion of choline-O-sulfate and, at a lower rate, phosphorylcholine, into choline.
    - reference_id: PMID:29458126
      supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the
        hydrolysis of alkyl sulfate choline-O-sulfate
