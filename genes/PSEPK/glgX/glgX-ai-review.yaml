    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/glgX/glgX-uniprot.txt
    title: UniProtKB entry for glgX (Q88FN4)
    findings:
      - statement: >-
          The unreviewed record assigns EC 3.2.1.33, GlgX-specific GH13
          signatures, GO:0004135, and glycogen catabolic process.
  - id: PMID:15687211
    title: Role of the Escherichia coli glgX gene in glycogen metabolism.
    findings:
      - statement: >-
          E. coli GlgX was experimentally shown to be an isoamylase-type
          debranching enzyme selective for branches of three or four glucose
          residues and predominantly involved in glycogen catabolism.
        supporting_text: >-
          high specificity for hydrolysis of chains consisting of
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed abstract verified; this is direct evidence for the characterized
        E. coli GlgX family exemplar, not for PSEPK Q88FN4 itself.
  - id: PMID:33872310
    title: Trehalose and α-glucan mediate distinct abiotic stress responses in Pseudomonas aeruginosa.
    findings:
      - statement: >-
          Purified P. aeruginosa GlgX released predominantly DP4 and less DP5+
          maltooligosaccharide from glycogen, directly supporting short-chain
          bacterial glycogen debranching in a close Pseudomonas homolog.
        supporting_text: >-
          MALDI-MS showed that the enzyme preferentially liberated a
          maltooligosaccharide with a DP of 4 and significantly less material
          with a DP of 5 and above (Fig 7), supporting its role as a debranching
          enzyme with a short chain-length specificity.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verified; the experiment tests the P. aeruginosa PAO1 homolog,
        so transfer to PSEPK remains a family-level inference.
core_functions:
  - description: >-
      Predicted hydrolysis of short alpha-1,6-linked branches from
      phosphorylase-limit glycogen during bacterial glycogen mobilization.
    molecular_function:
      id: GO:0120549
      label: limit dextrin alpha-1,6-maltotetraose-hydrolase activity
    directly_involved_in:
      - id: GO:0005980
        label: glycogen catabolic process
    supported_by:
      - reference_id: file:PSEPK/glgX/glgX-uniprot.txt
        supporting_text: "DR   GO; GO:0004135; F:amylo-alpha-1,6-glucosidase activity; IEA:UniProtKB-EC."
      - reference_id: PMID:33872310
        supporting_text: >-
          MALDI-MS showed that the enzyme preferentially liberated a
          maltooligosaccharide with a DP of 4 and significantly less material
          with a DP of 5 and above (Fig 7), supporting its role as a debranching
          enzyme with a short chain-length specificity.
    knowledge_gaps:
      - gap_statement: Q88FN4 has not been directly assayed as a glycogen debranching enzyme.
        significance: >-
          Substrate-chain-length preference, branch architecture, and in-vivo
          contribution to KT2440 glycogen mobilization remain unverified.
proposed_new_terms: []
suggested_questions:
  - question: Does Q88FN4 preferentially debranch glycogen made by GlgA or alpha-glucan made by GlgE?
suggested_experiments:
  - description: >-
      Compare purified Q88FN4 activity on defined branched glycogen and
      GlgE-derived alpha-glucan substrates, and profile polymer structure and
      mobilization in a glgX deletion strain.
