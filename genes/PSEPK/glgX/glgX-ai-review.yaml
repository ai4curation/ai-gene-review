id: Q88FN4
gene_symbol: glgX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GlgX (PP_4055) is a predicted bacterial glycogen-debranching enzyme. Its
  GlgX-specific GH13 architecture supports hydrolysis of short alpha-1,6-linked
  branches from phosphorylase-limit glycogen during mobilization, producing a
  more linear alpha-1,4-glucan substrate for continued phosphorylase action.
  Q88FN4 has not been assayed directly, but characterized GlgX enzymes and the
  close Pseudomonas aeruginosa homolog have the short-chain debranching activity
  now classified as EC 3.2.1.196.
existing_annotations:
  - term:
      id: GO:0004135
      label: amylo-alpha-1,6-glucosidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This imported term is a valid parent of the more specific bacterial GlgX activity.
      action: ACCEPT
      reason: >-
        GO:0004135 is a valid parent description of glycogen-limit-dextrin
        debranching. The GlgX-specific InterPro signature IPR011837 and
        experimental work on bacterial GlgX homologs
        support this activity, although EC 3.2.1.196/GO:0120549 is the more
        precise term for release of short branch chains.
      supported_by:
        - reference_id: file:PSEPK/glgX/glgX-uniprot.txt
          supporting_text: "DR   GO; GO:0004135; F:amylo-alpha-1,6-glucosidase activity; IEA:UniProtKB-EC."
  - term:
      id: GO:0004553
      label: hydrolase activity, hydrolyzing O-glycosyl compounds
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This broad GH13 hydrolase term is compatible but non-specific.
      action: KEEP_AS_NON_CORE
      reason: >-
        Hydrolysis of an alpha-1,6-glucosidic linkage is within this parent
        class, while GO:0004135 captures the informative branch-point reaction.
      supported_by:
        - reference_id: file:PSEPK/glgX/glgX-uniprot.txt
          supporting_text: "DR   InterPro; IPR011837; Glycogen_debranch_GlgX."
  - term:
      id: GO:0005975
      label: carbohydrate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: GlgX acts on a carbohydrate polymer, but this process term is broad.
      action: KEEP_AS_NON_CORE
      reason: >-
        The annotation is directionally correct and can be retained as
        non-core; glycogen catabolic process is the informative pathway role.
      supported_by:
        - reference_id: file:PSEPK/glgX/glgX-uniprot.txt
          supporting_text: "DR   InterPro; IPR011837; Glycogen_debranch_GlgX."
  - term:
      id: GO:0005980
      label: glycogen catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Glycogen debranching is a direct step in glycogen catabolism.
      action: ACCEPT
      reason: >-
        The GlgX-specific domain and EC assignment support removal of glycogen
        alpha-1,6 branch points, which is required for complete mobilization of
        branched glycogen.
      supported_by:
        - reference_id: file:PSEPK/glgX/glgX-uniprot.txt
          supporting_text: "DR   GO; GO:0005980; P:glycogen catabolic process; IEA:InterPro."
  - term:
      id: GO:0120549
      label: limit dextrin alpha-1,6-maltotetraose-hydrolase activity
    evidence_type: ISS
    original_reference_id: PMID:33872310
    qualifier: enables
    review:
      summary: >-
        This is the precise bacterial GlgX activity inferred for Q88FN4 from
        direct characterization of a close Pseudomonas homolog.
      action: NEW
      reason: >-
        Purified P. aeruginosa GlgX preferentially released a DP4 branch from
        glycogen, matching GO:0120549 and the characteristic DP3-DP4
        specificity established for E. coli GlgX. Q88FN4 belongs to the same
        GlgX-specific family, but the assignment remains sequence-similarity
        evidence because Q88FN4 itself has not been assayed.
      supported_by:
