  label: Pseudomonas putida KT2440
description: HolA is the delta subunit of the Pseudomonas putida KT2440 DNA polymerase III clamp loader.
  It contributes clamp opening and positioning together with DnaX and HolB, enabling processive DNA replication.
  HolA is a structural loader component and does not itself catalyze DNA polymerization.
