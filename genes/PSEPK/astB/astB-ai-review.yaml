  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO from the AstB family signatures (IPR007079, IPR037031).
    action: MODIFY
    reason: >-
      Correct but general. AstB acts only in arginine breakdown (step 2 of the AST pathway), and the gene
      already carries the specific descendant L-arginine catabolic process.
    proposed_replacement_terms:
    - id: GO:0006527
      label: L-arginine catabolic process
    supported_by:
    - reference_id: file:PSEPK/astB/astB-uniprot.txt
