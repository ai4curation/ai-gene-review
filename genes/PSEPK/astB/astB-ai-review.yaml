id: Q88EI5
gene_symbol: astB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  AstB (PP_4477) is N-succinylarginine dihydrolase, the second enzyme of the bacterial arginine succinyltransferase
  pathway. It hydrolyzes N-succinyl-L-arginine to N-succinyl-L-ornithine, carbon dioxide, and ammonium,
  thereby releasing nitrogen and supplying the substrate for the downstream AstC aminotransferase during
  aerobic arginine catabolism.
