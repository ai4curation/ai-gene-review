- term:
    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the specific conserved catalytic activity of AstB.
    action: ACCEPT
    reason: >-
      Q88EI5 is a reviewed AstB-family protein with the exact EC 3.5.3.23 and RHEA:19533 reaction, corroborated
      by the genetic assignment of the homologous Pseudomonas aeruginosa aruB gene. The E. coli ortholog
      (P76216, same PTHR30420:SF2 subfamily) has the activity confirmed structurally.
    additional_reference_ids:
    - PMID:9393691
    supported_by:
    - reference_id: file:PSEPK/astB/astB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Catalyzes the hydrolysis of N(2)-succinylarginine into N(2)-succinylornithine, ammonia and CO(2).
        {ECO:0000255|HAMAP-Rule:MF_01172}.
    - reference_id: PMID:15703173
      supporting_text: >-
        Structures of the complexes of AstB with the reaction product and a C365S mutant with bound the
        N-succinylarginine substrate suggest a catalytic mechanism that consists of two cycles of hydrolysis
        and ammonia release
