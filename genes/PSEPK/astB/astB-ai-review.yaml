      supporting_text: >-
        pathway; L-glutamate and succinate from L-arginine: step 2/5. {ECO:0000255|HAMAP-Rule:MF_01172}.
    - reference_id: PMID:9393691
      supporting_text: >-
        The aruR, aruC, aruD, aruB, and aruE genes specify the ArgR regulatory protein, N2-succinylornithine
        5-aminotransferase, N-succinylglutamate 5-semialdehyde dehydrogenase, N2-succinylarginine dihydrolase,
        and N-succinylglutamate desuccinylase, respectively
