id: Q88PL4
gene_symbol: secF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SecF is the partner membrane subunit of the bacterial SecDF accessory complex. Together with
  SecD, it uses proton motive force to promote late-stage completion of SecYEG-mediated protein translocation
  after the ATP-driven SecA stage; it is not itself a protein-transporting ATPase.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: secF is a multi-pass subunit of the inner-membrane SecDF complex.
    action: ACCEPT
    reason: The exact family assignment and membrane topology support plasma-membrane localization.
- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: SecDF acts after precursors have been targeted, during late translocation.
    action: MARK_AS_OVER_ANNOTATED
    reason: SecD and SecF (or fused SecDF) assist translocation through SecYEG after the precursor has arrived;
      they are not targeting factors, so protein targeting over-states their role.
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct but general; the protein acts in transmembrane movement of precursors across the cytoplasmic
      membrane.
    action: MODIFY
    reason: 'Intracellular protein transport is true but general. GO:0065002 intracellular protein transmembrane
      transport is its is_a descendant and describes the SecYEG-mediated step; the Sec-complex process is
      recorded in core_functions. Harmonized across the Sec member reviews: a MODIFY replacement must be an
      is_a/part_of descendant of the annotated term, and GO:0043952 protein transport by the Sec complex is
      not a descendant of GO:0006886.'
    proposed_replacement_terms:
    - id: GO:0065002
      label: intracellular protein transmembrane transport
- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct but general; the specific process is protein transport by the Sec complex.
    action: MODIFY
    reason: Protein transport is a true ancestor of GO:0043952 protein transport by the Sec complex, the specific
      process this protein takes part in, so the row is refined to that descendant.
    proposed_replacement_terms:
    - id: GO:0043952
      label: protein transport by the Sec complex
- term:
    id: GO:0015450
    label: protein-transporting ATPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Not a protein-transporting ATPase; ATP hydrolysis in Sec export belongs to SecA.
    action: REMOVE
    reason: This electronic mapping assigns ATP-driven transporter activity to a subunit that does not hydrolyse
      ATP. SecDF uses the proton motive force and SecG is a channel subunit; their real activities (GO:0009977
      or GO:0008320, as contributes_to) are not descendants of GO:0015450, so the row is removed rather than
      modified, and the correct activity is recorded in core_functions.
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: >-
        we propose that SecDF functions as a membrane-integrated chaperone, powered
        by proton motive force, to achieve ATP-independent protein translocation
    - reference_id: PMID:29718185
      supporting_text: >-
        Once SecDF captures the precursor protein on the periplasmic surface, SecDF
        can complete protein translocation even if SecA function is inactivated by
        ATP depletion, implying that SecDF is a protein-translocation motor that
        works independent of SecA
