  label: Pseudomonas putida KT2440
description: >-
  PP_0024 is a 565-residue inner-membrane protein of the phosphoethanolamine (PEA)
  transferase family (COG2194; PANTHER PTHR30443:SF0 EptA subfamily; Pfam PF08019
  EptA_B_N plus PF00884 sulfatase-like catalytic domain). It has five N-terminal
  transmembrane helices and a C-terminal alkaline-phosphatase-fold catalytic domain,
  which by family topology faces the periplasm. The catalytic Thr nucleophile and the
  Zn-binding residues of the Neisseria LptA/EptA structure are all conserved (T296,
  E258, D468, H469, H481 align to N. meningitidis T280, E240, D452, H453, H465). It is
  therefore a predicted-active enzyme that transfers PEA from phosphatidylethanolamine
  to an acceptor (EC 2.7.8 type head-group transfer). Its acceptor is not known. PP_0024
  is about equally related (41-47% identity) to lipid A PEA transferases (E. coli EptA,
  P. aeruginosa EptA PA1972, MCR-1, Neisseria LptA) and to P. aeruginosa PA3310, an
  EptA-like paralog whose primary target is probably not lipid A (PMID:25846400). It
  is not the KT2440 orthologue of the characterized Pseudomonas EptA enzymes. That
  orthologue is the paralog PP_4592 (61% identical to PA1972, 67% to P. syringae
  EptA). In the Fitness Browser, PP_4592 transposon mutants are specifically sensitive
  to polymyxin B, but PP_0024 mutants show no phenotype in any of 300 experiments,
  polymyxin B included. PP_0024 sits in a metal-resistance region near a CzcD-family
  cation exporter (PP_0026) and a heavy-metal two-component system (PP_0029/PP_0030).
  No P. putida lipid A analysis has reported a PEA modification. Best description is a
  "putative phosphoethanolamine transferase, EptA-like paralog, acceptor unknown". Lipid A is
  a plausible but unproven substrate.
