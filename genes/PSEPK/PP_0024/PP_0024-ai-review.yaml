  title: Extracellular zinc induces phosphoethanolamine addition to Pseudomonas aeruginosa lipid A via the ColRS two-component system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Characterizes P. aeruginosa EptA (PA14_39020 = PA1972) as a 4'-phosphate lipid A PEA transferase, and shows that the second EptA-like paralog (PA14_21210 = PA3310) probably does not target lipid A. PP_0024 is about equally distant from both (47.4% and 44.2%).
  findings:
  - statement: P. aeruginosa EptA (PA14_39020) is a functional lipid A 4'-phosphate PEA transferase.
    supporting_text: aeruginosa gene PA14_39020 is a functional pEtN transferase which we have named EptAPa that strictly modifes the 4' phosphate group of lipid A.
  - statement: The EptA-like paralog PA14_21210 (PA3310) is probably not a lipid A enzyme.
    supporting_text: While a very minor amount of lipid A modification is detected by TLC separation of lipid A upon expression of PA14_21210 in PA14, lipid A is probably not the primary target of this enzyme.
