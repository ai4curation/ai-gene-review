  review:
    summary: The acceptor of PP_0024 is unknown, so an LPS core-region process is not supported. It is also not the process of the lipid A enzymes that define this PANTHER subfamily.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TreeGrafter node covers the EptA subfamily. Its characterized members modify lipid A phosphates (PMID:25846400), not the core oligosaccharide, which is the substrate of the distinct EptB and EptC/CptA subfamilies. PP_0024 is not the KT2440 orthologue of the characterized Pseudomonas EptA. That orthologue is PP_4592, and P. aeruginosa's second EptA-subfamily paralog probably does not target lipid A (PMID:25846400). The process this protein takes part in therefore cannot be assigned, and "LPS core region biosynthesis" is not supported.
    supported_by:
    - reference_id: PMID:25846400
      supporting_text: While a very minor amount of lipid A modification is detected by TLC separation of lipid A upon expression of PA14_21210 in PA14, lipid A is probably not the primary target of this enzyme.
