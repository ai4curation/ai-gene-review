suggested_questions:
- question: What is the acceptor of PP_0024? Is it lipid A, LPS core, or another envelope component, and is the gene expressed under metal stress, given its location in a metal-resistance region?
suggested_experiments:
- description: Compare lipid A and LPS core by MS in KT2440 wild type, deltaPP_0024, deltaPP_4592 and the double mutant, with and without Zn2+ or polymyxin, and with PP_0024 overexpressed.
