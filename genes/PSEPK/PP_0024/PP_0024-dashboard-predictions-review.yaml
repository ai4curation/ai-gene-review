description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_CP009974.1_1821 is "Lipid A phosphoethanolamine transferase EptA catalyzing
  addition of phosphoethanolamine to lipid A" (tier A). It comes with GO:0043838 and
  GO:0009103. The query is 100% identical over all 565 residues to KT2440 PP_0024
  (Q88RV5), so it is scored on that accession. The family assignment is right:
  PP_0024 is a catalytically intact member of the EptA subfamily of PEA transferases,
  with the Thr nucleophile and Zn ligands of Neisseria LptA conserved. The substrate,
  and the name EptA, are not supported. KT2440 has two EptA-subfamily paralogs. The
  orthologue of the characterized Pseudomonas lipid A EptA enzymes (P. aeruginosa
  PA1972, 61.4% identical; P. syringae EptA, 67%) is PP_4592, not PP_0024 (41-47% to
  every EptA-clade reference). The homologs the call relies on ("46.10%" P. aeruginosa,
  "45.10%" P. syringae) are therefore outparalogs at paralog distance. In P. aeruginosa,
  the EptA-subfamily paralog at the same distance (PA3310) probably does not target
  lipid A (PMID:25846400). The fitness context is not specific to PP_0024 either. The
  aluminium and polymyxin phenotypes are from 39-45%-identity homologs in other genera
  and could equally belong to PP_4592 orthologues. In KT2440 itself, PP_0024 has no
  phenotype in 300 Fitness Browser experiments, including four polymyxin B
  experiments, whereas PP_4592 is specifically polymyxin-sensitive. No P. putida lipid
  A analysis reports PEA. The dashboard verdict should be "overreach": correct family,
  unsupported substrate and gene name. A defensible annotation is "putative
  phosphoethanolamine transferase, EptA-like paralog (not the EptA orthologue
  PP_4592), acceptor unknown".
