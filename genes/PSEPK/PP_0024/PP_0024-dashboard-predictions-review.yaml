predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0043838
    label: phosphatidylethanolamine:Kdo2-lipid A phosphoethanolamine transferase activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The reaction class is right, but the acceptor is not established. PP_0024 is an
      intact EptA-subfamily PEA transferase (Thr296 nucleophile conserved). It is,
      however, an outparalog of the characterized Pseudomonas lipid A EptA enzymes. The
      KT2440 orthologue of those enzymes is PP_4592 (61.4% to PA1972), which also
      carries the polymyxin-B fitness phenotype expected of a lipid A PEA transferase.
      PP_0024 has no phenotype. In P. aeruginosa the EptA-like paralog at a similar
      distance (PA3310) is probably not a lipid A enzyme. A second lipid A PEA
      transferase cannot be ruled out, so the term is not refuted. That rules out PLI
      and leaves UNC. The safe term is the parent GO:0016780, which the companion review
      adds. The call's overconfidence comes from not separating the two EptA-subfamily
      paralogs.
    supported_by:
    - reference_id: file:PSEPK/PP_0024/PP_0024-dashboard-prediction-evidence/paralog_identity_results.json
      supporting_text: '"PP_4592": 61.4,'
    - reference_id: PMID:25846400
      supporting_text: While a very minor amount of lipid A modification is detected by TLC separation of lipid A upon expression of PA14_21210 in PA14, lipid A is probably not the primary target of this enzyme.
    - reference_id: file:PSEPK/PP_0024/PP_0024-dashboard-prediction-evidence/fitness_results.json
      supporting_text: '"n_abs_fit_ge1_and_abs_t_ge4": 0,'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      LPS biosynthesis would hold if the acceptor is lipid A or the LPS core, which
      covers most characterized family members except OpgE (osmoregulated periplasmic
      glucans). It is not established for PP_0024, for the reasons given for GO:0043838.
      GOA already holds a related IEA, GO:0009244 LPS core region biosynthetic process,
      which the companion review marks as over-annotated. There is no P. putida evidence
      of PEA on LPS (PMID:26579930), and PP_0024 has no envelope-stress fitness
      phenotype.
    supported_by:
    - reference_id: PMID:26579930
      supporting_text: Compared with lipid A of P. aeruginosa, P. putida lipid A has less hydroxylation on the secondary acyl chains and less modification.
