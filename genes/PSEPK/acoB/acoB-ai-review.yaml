  label: Pseudomonas putida KT2440
description: AcoB is the E1 beta subunit of the Pseudomonas putida KT2440 acetoin-cleaving system. AcoA
  and AcoB together supply the thiamine-diphosphate-dependent E1 activity that converts acetoin into acetaldehyde
  while transferring an acetyl group to the lipoyl carrier of E2. The E1 assignment is supported by the
  conserved acetoin-system locus and characterized homologs; native KT2440 operon expression and insertion-mutant
  physiology support the catabolic pathway. Neither isolated-subunit activity nor exact KT2440 oligomer
  stoichiometry has been established by those comparisons.
