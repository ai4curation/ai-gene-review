references:
- id: PMID:7813883
  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  findings:
  - statement: PpG2 induces both butanediol dehydrogenase and acetoin cleavage during growth on either
      substrate.
    supporting_text: The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were simultaneously
      induced in Pseudomonas putida PpG2 during growth on 2,3-butanediol and on acetoin.
  - statement: PpG2 AcoA/B/C assignments were made from sequence similarity to characterized acetoin-system
      components.
    supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r) 34639),
      E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system exhibited striking
      similarities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PpG2 primary: canonical abstract and publisher abstract inspected. Normal forced PMID
      retrieval and publisher PDF recovery did not yield full text. Induction, cloned locus and heterologous
      Adh expression are explicit; exact isolated-subunit activity and stereoisomer tests must not be
      invented.'
- id: PMID:2061286
  title: Identification and molecular characterization of the Alcaligenes eutrophus H16 aco operon genes
    involved in acetoin catabolism.
  findings:
  - statement: The purified H16 E1 contains alpha and beta subunits, with an alpha2-beta2 arrangement
      judged most likely.
    supporting_text: Ao:DCPIP OR consisted of alpha and beta subunits (Mrs, 35,500 and 36,000, respectively),
      and a tetrameric alpha 2 beta 2 structure was most likely for the native protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'H16 comparative primary: available abstract inspected; colleague attempted normal full-text
      recovery. Purified alpha/beta E1 supports component architecture, not direct KT2440 stoichiometry
      or a pyruvate-negative assay.'
- id: PMID:36482024
  title: The acetoin assimilation pathway of Pseudomonas putida KT2440 is regulated by overlapping global
    regulatory elements that respond to nutritional cues.
  findings:
  - statement: The native KT2440 locus contains the E1 alpha, E1 beta and E2 components; AcoX remains
      functionally unresolved.
    supporting_text: The acoX gene codes for a protein of unknown function, while acoABC codes for the
      E1α, E1β and E2 subunits of the acetoin dehydrogenase complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Native KT2440 growth and promoter experiments support the acetoin-system
      locus and conditional expression, not new isolated-subunit catalytic assays.
- id: PMID:42046433
  title: Engineering Pseudomonas putida for the Production of 2,3-Butanediol Isomers and Acetoin.
  findings:
  - statement: An acoB-locus insertion prevents native growth on acetoin and butanediol; operon polarity
      limits subunit-specific necessity inference.
    supporting_text: this acoB mutant was not able to grow on acetoin or 2,3-BDO, while the wt did
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text Results 3.1 and Methods inspected. Native KT2440 acoB::mini-Tn5 growth defect
      is distinct from subsequent Klebsiella budABC engineering. Authors explicitly warn of polar effects
      on acoC/adh and possibly acoA/acoX; this is not a clean single-subunit complementation experiment.
