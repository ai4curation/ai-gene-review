  review:
    summary: AcoB is the E1 beta component of the Pseudomonas acetoin-cleaving locus.
    action: NEW
    reason: >-
      The PpG2 study identifies AcoB as E1 beta of the induced acetoin-cleaving
      system; the matching KT2440 locus and acetoin-specific PANTHER subfamily
      support conservative orthology transfer.
    additional_reference_ids:
    - UniProtKB:P27746
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: >-
        The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha
        (M(r) 34639), E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida
        acetoin cleaving system
