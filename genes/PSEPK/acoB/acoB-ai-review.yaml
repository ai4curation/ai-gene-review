taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AcoB (PP_0554) is the E1 beta subunit of the bacterial acetoin-cleaving
  system. It partners with the TDP-dependent AcoA alpha subunit in an E1
  complex that cleaves acetoin and reductively acetylates the lipoyl arm of
  AcoC. It is an acetoin-system paralog of the beta subunits found in other
  2-oxoacid dehydrogenase E1 complexes.
existing_annotations:
- term:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  evidence_type: ISS
  original_reference_id: PMID:2061286
  qualifier: contributes_to
  review:
    summary: AcoB contributes to the acetoin-cleaving E1 redox activity with AcoA.
    action: NEW
    reason: >-
      The H16 AcoA/AcoB enzyme was purified as an alpha2-beta2 complex, and the
      P. putida locus paper identifies the corresponding AcoB E1 beta subunit.
      PTHR43257:SF3 is acetoin-specific and includes the protein-level H16
      exemplar P27746. This is orthology evidence, not a direct KT2440 assay.
    additional_reference_ids:
    - UniProtKB:P27746
    supported_by:
    - reference_id: PMID:2061286
      supporting_text: >-
        Ao:DCPIP OR consisted of alpha and beta subunits (Mrs, 35,500 and 36,000,
        respectively), and a tetrameric alpha 2 beta 2 structure was most likely
        for the native protein.
