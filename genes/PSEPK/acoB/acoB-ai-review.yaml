    summary: The inherited acetoin-catabolism proposal corresponds to the E1 beta contribution.
    action: NEW
    reason: 'Preserve the original proposal: AcoB is a reaction-performing E1 component. PMID:42046433
      directly links a KT2440 PP0554 insertion to loss of acetoin/butanediol growth, while warning that
      downstream and possibly upstream operon transcription can also be affected. This supports native
      pathway involvement, not an isolated clean-deletion proof or a new engineered biosynthetic role.'
