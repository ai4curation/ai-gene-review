suggested_questions:
- question: What are the KT2440 E1 substrate spectrum and oligomeric arrangement, including any measurable
    pyruvate side activity?
- question: Which native lipoyl-dehydrogenase supplies the recycling reaction for this acetoin system?
suggested_experiments:
- description: Reconstitute KT2440 AcoA/AcoB with lipoylated AcoC and a candidate E3; compare acetoin,
    diacetyl and pyruvate while testing clean nonpolar subunit deletions and complementation.
  experiment_type: biochemical reconstitution and reverse genetics
