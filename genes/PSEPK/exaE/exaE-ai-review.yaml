taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ExaE, called PedR2 in the lanthanide-switch literature, is the LuxR-family
  response regulator cognate to PedS2. Phosphorylated PedR2 binds regulatory
  DNA, strongly activates pedE transcription, and contributes to pedH
  repression when lanthanides are absent. Reduced PedS2 output in the presence
  of lanthanides permits the shift toward PedH-dependent alcohol oxidation.
