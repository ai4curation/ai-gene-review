  review:
    summary: Q88NB9 is proposed as a component of the MoaD-MoaE molybdopterin synthase complex.
    action: NEW
    reason: >-
      Q88NB9 and Escherichia coli MoaD P30748 occupy the same
      PTHR33359:SF1 sulfur-carrier subfamily, and Q88NB9 is encoded directly
      beside its MoaE partner. The E. coli MoaD2-MoaE2 heterotetramer is
      established structurally, so GO:1990140 is supported by sequence similarity
      rather than direct KT2440 complex measurement.
    supported_by:
