    summary: MoaD participates in the transient MoeB-MoaD adenylyltransferase complex during carrier activation.
    action: ACCEPT
    reason: >-
      The GO definition of GO:1990133 names MoeB and MoaD as its E. coli subunits.
      The complex evidence is ortholog evidence: crystal structures of the
      Escherichia coli MoeB-MoaD complex in apo, ATP-bound and MoaD-adenylate forms
      (PMID:11713534). Q88NB9 is placed in the MoaD family by the NCBIfam TIGR01682
      moaD model; no KT2440 complex has been isolated. Same action as genes/ECOLI/moaD.
    supported_by:
