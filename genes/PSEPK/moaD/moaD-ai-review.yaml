id: Q88NB9
gene_symbol: moaD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  moaD (PP_1293) encodes the small sulfur-carrier subunit of molybdopterin synthase, a
  ubiquitin-like beta-grasp protein ending in the conserved Gly-Gly motif. By orthology with
  Escherichia coli MoaD, its C-terminal glycine is adenylated by MoeB and converted to a
  thiocarboxylate; two sulfur-loaded MoaD subunits, bound to the MoaE catalytic subunits of the
  MoaD2-MoaE2 synthase, then donate the dithiolene sulfurs that convert cyclic pyranopterin
  monophosphate into molybdopterin during molybdenum cofactor biosynthesis.
