  review:
    summary: MoaD is the sulfur carrier required for molybdopterin formation.
    action: ACCEPT
    reason: Q88NB9 is in the MoaD family (NCBIfam TIGR01682, PANTHER PTHR33359:SF1 with E. coli
      MoaD). The E. coli ortholog donates the dithiolene sulfurs to precursor Z (PMID:17223713),
      so the protein does work in the process. Same action as genes/ECOLI/moaD.
    supported_by:
    - reference_id: file:PSEPK/moaD/moaD-deep-research-openscientist.md
      supporting_text: |-
        The gene **moaD** (UniProt **Q88NB9**; ordered locus **PP_1293**) of *Pseudomonas putida* strain KT2440 encodes the **small sulfur-carrier subunit of molybdopterin (MPT) synthase**, the enzyme that catalyzes the **second of the four conserved steps of molybdenum cofactor (Moco) biosynthesis**.
    - reference_id: PMID:17223713
      supporting_text: In Escherichia coli, the MoaD protein plays a central role in the conversion
        of precursor Z to molybdopterin (MPT) during molybdenum cofactor biosynthesis.
