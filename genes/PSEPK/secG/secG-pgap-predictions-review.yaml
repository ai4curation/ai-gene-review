id: A0A140FWQ9
gene_symbol: secG
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_5706
description: >-
  NCBI PGAP names WP_020193781.1 "preprotein translocase subunit SecG" from the
  TIGR00810 equivalog HMM and passes on that model's three GO terms: membrane,
  sialic acid transmembrane transporter activity, and sialic acid transport. No
  EC number is predicted. The name is correct: SecG is the small accessory
  integral-membrane subunit of the SecYEG protein-conducting channel. The two
  sialic acid terms are wrong, and the error lies in the GO mapping of the
  TIGR00810 model itself, not in the KT2440 annotation, so every genome whose
  SecG is named by TIGR00810 receives them. SecG has no reported role in
  carbohydrate transport, and the PfamEq model for the same family (NF015779,
  wrapping PF03840) carries the expected protein-secretion terms instead. The
  membrane term is true but less precise than the plasma membrane location
  accepted in the main review.
