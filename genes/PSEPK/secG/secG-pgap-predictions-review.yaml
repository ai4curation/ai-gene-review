  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      SecG is a multi-pass inner-membrane protein, so membrane is true. GOA
      carries the same IEA term, and the main review marks it over-annotated
      because it is redundant with the accepted plasma membrane (GO:0005886).
      The reason given there is generality rather than error, so this is
      less precise than the existing annotation rather than wrong.
