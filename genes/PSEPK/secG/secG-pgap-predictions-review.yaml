- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0015136
    label: sialic acid transmembrane transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      Wrong. SecG is an accessory subunit of the SecYEG preprotein translocase;
      it moves secretory proteins, together with SecYE and the SecA motor, and
      has no reported sialic acid transport activity. The term comes only from
      the GO mapping of the TIGR00810 equivalog, whose own product name is
      "preprotein translocase subunit SecG"; the model's name and its GO
      disagree. The PfamEq model for the same family (NF015779) instead maps
      to protein secretion (GO:0009306), consistent with the main review. The
      error is a curation mistake on the HMM and propagates to every SecG that
      TIGR00810 names.
    supported_by:
    - reference_id: file:PSEPK/secG/secG-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: "product_name: preprotein translocase subunit SecG"
    - reference_id: file:PSEPK/secG/secG-uniprot.txt
      supporting_text: "FUNCTION: Involved in protein export. Participates in an early event of"
    - reference_id: PMID:10074070
      supporting_text: "Protein export in Escherichia coli is mediated by translocase, a multisubunit membrane protein complex with SecA as the peripheral subunit and the SecY, SecE, and SecG proteins as the integral membrane domain."
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0015739
    label: sialic acid transport
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      Wrong, for the same reason as the companion molecular-function term. The
      biological process SecG takes part in is Sec-dependent protein export
      (accepted in the main review as protein transport by the Sec complex and
      intracellular protein transmembrane transport); a B. subtilis SecG
      homologue rescues a secretion defect, not a sugar transport defect. The
      error lies on the TIGR00810 GO mapping.
    supported_by:
    - reference_id: PMID:10074070
      supporting_text: "A chromosomal disruption of the yvaL gene results in mild cold sensitivity and causes a beta-lactamase secretion defect."
    - reference_id: PMID:10074070
      supporting_text: "These results indicate that the yvaL gene codes for a protein that is functionally homologous to SecG."
