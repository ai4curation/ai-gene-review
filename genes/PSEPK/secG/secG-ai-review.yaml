  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: SecG is a small multi-pass inner-membrane subunit of the bacterial SecYEG protein-conducting
  channel. It supports an early stage of Sec-dependent preprotein translocation and improves channel function
  but does not bind or hydrolyze ATP independently.
