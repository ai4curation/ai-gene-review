  label: Pseudomonas putida KT2440
description: >-
  CatA (catA-I, PP_3713) is the principal catechol 1,2-dioxygenase (EC
  1.13.11.1) of Pseudomonas putida KT2440, a cytoplasmic non-heme Fe(III)
  intradiol ring-cleavage dioxygenase that cleaves catechol between its two
  hydroxylated carbons to give cis,cis-muconate. This is the first step of the
  catechol ortho-cleavage branch of the beta-ketoadipate pathway, through which
  KT2440 degrades benzoate and other aromatics funnelled to catechol by the ben
  upper pathway; CatB and CatC then convert cis,cis-muconate to
  beta-ketoadipate enol-lactone. catA lies in the CatR-regulated catBCA region,
  induced by cis,cis-muconate. KT2440 carries a second, ben-linked paralog,
  CatA-II (PP_3166), which relieves catechol surplus during benzoate
  catabolism.
