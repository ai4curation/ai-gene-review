    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 22.12), only 0.34 units behind the correct call. Catechol 2,3-dioxygenase performs
      extradiol (meta) cleavage using non-heme Fe(II) and belongs to the vicinal oxygen chelate superfamily
      - a different fold, different metal oxidation state and different product from the intradiol
      Fe(III) enzyme this protein is. The two are the textbook contrast in aromatic ring cleavage,
      and the retrieval treats them as near-equivalent.
    supported_by:
