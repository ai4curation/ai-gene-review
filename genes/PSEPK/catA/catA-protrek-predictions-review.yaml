  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 21.70). Chlorocatechol 1,2-dioxygenase is the correct chemistry on a halogenated
      substrate; it is a genuinely related intradiol enzyme (ClcA/TfdC) and some catechol 1,2-dioxygenases
      have measurable activity on chlorocatechols, so this cannot be firmly excluded for the KT2440
      enzyme. It is also obsolete in the current GO release and so unusable as an annotation. Recorded
      as uncertain on both grounds.
