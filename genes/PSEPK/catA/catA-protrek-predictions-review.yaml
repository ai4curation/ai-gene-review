  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for catechol 1,2-dioxygenase, the first committed step of the
  catechol branch of the beta-ketoadipate pathway. This is the highest-scoring query in either cohort:
  rank 1 is 22.46 and is the exact core molecular function. But ranks 2 and 3 are the two obvious
  wrong answers at 22.12 and 21.70 - the extradiol (2,3) dioxygenase, a mechanistically different
  enzyme family, and the chlorocatechol variant - all three within 0.8 units. So the model both nails
  the enzyme and demonstrates that its score cannot separate the right ring-cleavage chemistry from
  the wrong one. Assessment: 1 correct not novel (CNN), 1 uncertain (UNC), 1 paralog incorrect (PLI).
