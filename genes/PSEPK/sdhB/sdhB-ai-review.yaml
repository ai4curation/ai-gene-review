taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Iron-sulfur subunit of the membrane-bound succinate dehydrogenase/respiratory Complex II enzyme in Pseudomonas putida KT2440. SdhB transfers electrons from the SdhA flavoprotein catalytic subunit through iron-sulfur clusters toward the membrane anchor/quinone site, contributing to quinone-linked succinate oxidation. This places SdhB at the interface between the tricarboxylic acid cycle and the aerobic respiratory electron transport chain.
existing_annotations:
- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct process annotation for the succinate-to-fumarate step of the TCA cycle.
    action: ACCEPT
    reason: SdhB is part of the succinate dehydrogenase complex that oxidizes succinate to fumarate in the TCA cycle. The support is family classification, not direct P. putida data -- NCBIfam TIGR00384 (dhsB) and PANTHER PTHR11921:SF29 place Q88FA8 in the succinate dehydrogenase iron-sulfur subunit subfamily, whose members act in the TCA-cycle succinate-to-fumarate step as part of SdhABCD. (The UniProt PATHWAY line is ARBA-only and is not cited.) A provider pathway report also places the sdhCDAB operon at this step, as context only.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR00384; dhsB; 1.'
- term:
    id: GO:0008177
    label: succinate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct holoenzyme activity that SdhB contributes to as the iron-sulfur electron-transfer subunit.
    action: ACCEPT
    reason: The complete SdhABCD complex catalyzes quinone-linked succinate oxidation (EC 1.3.5.1). SdhB contributes electron transfer within this complex rather than carrying the flavin active site independently. Support is family membership -- PANTHER PTHR11921 (succinate dehydrogenase iron-sulfur protein) and its SF29 succinate dehydrogenase [ubiquinone] subfamily, plus InterPro IPR004489 -- whose members are the Fe-S subunit of succinate:quinone oxidoreductase; the UniProt CATALYTIC ACTIVITY line is ARBA-only and is not cited.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR004489; Succ_DH/fum_Rdtase_Fe-S.'
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct and subunit-relevant function for the SdhB iron-sulfur protein.
    action: ACCEPT
    reason: SdhB is the iron-sulfur relay between the SdhA flavoprotein site and the membrane quinone-reduction site, so electron transfer is a meaningful subunit-level function.
- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct respiratory-process context for forward succinate dehydrogenase/Complex II.
    action: ACCEPT
    reason: Within the SDH/FRD iron-sulfur protein family, PANTHER places Q88FA8 in the succinate dehydrogenase [ubiquinone] subfamily (SF29) rather than with the fumarate reductases that serve anaerobic respiration, and P. putida KT2440 is a strictly aerobic bacterium, so the complex acts in aerobic respiratory electron transfer. This is a family-level argument; the UniProt FUNCTION text on aerobic vs anaerobic use is ARBA-only and is not cited.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
