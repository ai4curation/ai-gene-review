    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but broad parent of the specific succinate dehydrogenase/electron-transfer role.
    action: KEEP_AS_NON_CORE
