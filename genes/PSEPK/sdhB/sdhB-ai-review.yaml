id: Q88FA8
gene_symbol: sdhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Iron-sulfur subunit of the membrane-bound succinate dehydrogenase/respiratory Complex II enzyme in Pseudomonas putida KT2440. SdhB transfers electrons from the SdhA flavoprotein catalytic subunit through iron-sulfur clusters toward the membrane anchor/quinone site, contributing to quinone-linked succinate oxidation. This places SdhB at the interface between the tricarboxylic acid cycle and the aerobic respiratory electron transport chain.
existing_annotations:
- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct process annotation for the succinate-to-fumarate step of the TCA cycle.
    action: ACCEPT
    reason: SdhB is part of the succinate dehydrogenase complex that oxidizes succinate to fumarate in the TCA cycle. The support is family classification, not direct P. putida data -- NCBIfam TIGR00384 (dhsB) and PANTHER PTHR11921:SF29 place Q88FA8 in the succinate dehydrogenase iron-sulfur subunit subfamily, whose members act in the TCA-cycle succinate-to-fumarate step as part of SdhABCD. (The UniProt PATHWAY line is ARBA-only and is not cited.) A provider pathway report also places the sdhCDAB operon at this step, as context only.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR00384; dhsB; 1.'
- term:
    id: GO:0008177
    label: succinate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The quinone-coupled succinate oxidation is an activity of the assembled SdhABCD complex; SdhB contributes to it as the iron-sulfur electron-transfer subunit but does not enable it alone.
    action: MODIFY
    reason: The complete SdhABCD complex catalyzes quinone-linked succinate oxidation (EC 1.3.5.1); succinate is oxidized at the SdhA flavin site and quinone is reduced at the SdhC/SdhD site. SdhB carries no substrate site and contributes the Fe-S electron relay, so an enables GO:0008177 row over-attributes the complex activity to this subunit. The row's essence (SdhB is a functional Complex II subunit, from PANTHER PTHR11921:SF29 and InterPro IPR004489 family membership) is sound; it is corrected laterally to the activity SdhB itself enables, GO:0009055 electron transfer activity, and the holoenzyme relationship is recorded as contributes_to_molecular_function GO:0008177 in core_functions. This matches the treatment of the orthologous Complex II subunits.
    proposed_replacement_terms:
    - id: GO:0009055
      label: electron transfer activity
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR004489; Succ_DH/fum_Rdtase_Fe-S.'
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct and subunit-relevant function for the SdhB iron-sulfur protein.
    action: ACCEPT
    reason: SdhB is the iron-sulfur relay between the SdhA flavoprotein site and the membrane quinone-reduction site, so electron transfer is the subunit-level core function.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-deep-research-openscientist.md
      supporting_text: It provides the physical conduit of three Fe-S clusters that transfer electrons from FAD to the quinone.
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR00384; dhsB; 1.'
- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct respiratory-process context for forward succinate dehydrogenase/Complex II.
    action: ACCEPT
    reason: Within the SDH/FRD iron-sulfur protein family, PANTHER places Q88FA8 in the succinate dehydrogenase [ubiquinone] subfamily (SF29) rather than with the fumarate reductases that serve anaerobic respiration, and P. putida KT2440 is a strictly aerobic bacterium, so the complex acts in aerobic respiratory electron transfer. This is a family-level argument; the UniProt FUNCTION text on aerobic vs anaerobic use is ARBA-only and is not cited.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11921:SF29; SUCCINATE DEHYDROGENASE [UBIQUINONE] IRON-SULFUR SUBUNIT, MITOCHONDRIAL'
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Oxidoreductase activity belongs to the assembled complex; SdhB's own activity is electron transfer, which is not under GO:0016491.
    action: MARK_AS_OVER_ANNOTATED
    reason: The SdhB-containing complex is an oxidoreductase, but SdhB carries neither the succinate nor the quinone site, so an enables oxidoreductase activity on this subunit restates the complex-level activity (GO:0008177, recorded only as contributes_to). GO:0009055 electron transfer activity, SdhB's own function, is not a descendant of GO:0016491, so TOO_GENERAL does not apply.
- term:
    id: GO:0022904
    label: respiratory electron transport chain
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct process annotation because Complex II feeds electrons from succinate into the quinone pool.
    action: ACCEPT
    reason: SdhB is an electron-transfer subunit of respiratory Complex II. The complex bridges TCA-cycle succinate oxidation to the respiratory electron transport chain.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct cofactor-binding annotation for the succinate dehydrogenase iron-sulfur subunit.
    action: ACCEPT
    reason: SdhB carries an N-terminal plant-type [2Fe-2S] ferredoxin-like domain (Pfam PF13085 Fer2_3) and a C-terminal helical ferredoxin domain with a 4Fe-4S ferredoxin-type signature (PROSITE PS00198/PS51379), consistent with the [2Fe-2S], [4Fe-4S] and [3Fe-4S] clusters of SDH iron-sulfur subunits. Because it binds clusters of several types, the general iron-sulfur cluster binding term is appropriate. Support is domain classification; the UniProt COFACTOR lines are ARBA-only and are not cited. Iron-sulfur cluster binding is intrinsic to SdhB electron transfer.
    supported_by:
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'Pfam; PF13085; Fer2_3; 1.'
    - reference_id: file:PSEPK/sdhB/sdhB-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'PROSITE; PS00198; 4FE4S_FER_1; 1.'
