taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: LiuC is a bacterial methylglutaconyl-CoA hydratase that converts 3-methylglutaconyl-CoA to
  (S)-3-hydroxy-3-methylglutaryl-CoA. It occupies the hydratase position of the distal L-leucine pathway
  and can also support catabolic routes that converge on the same isoprenoid-derived intermediate.
