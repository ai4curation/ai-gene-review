  - reference_id: file:PSEPK/PP_4575/PP_4575-bioinformatics/fitness_results.json
    supporting_text: '"fit": -4.18596317486971'
proposed_new_terms:
- proposed_name: 5-oxo-L-proline catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of 5-oxo-L-proline
    (L-pyroglutamate, CHEBI:16010), a cyclized form of L-glutamate that arises from enzymatic and
    spontaneous cyclization of glutamate, glutamine and glutathione-derived metabolites; typically by
    ATP-dependent ring opening to L-glutamate.
  justification: GO has a 5-oxoprolinase (ATP-hydrolyzing) activity term (GO:0017168) but no process
    term for 5-oxoproline breakdown, so PP_4575 and other PxpABC and OPLAH/Oxp1 proteins can only be
    given L-glutamate biosynthetic process, which misdescribes salvage of a damaged metabolite and its
    use as a nitrogen source as de novo glutamate synthesis.
  proposed_parent:
    id: GO:0042219
    label: modified amino acid catabolic process
  supported_by:
  - reference_id: PMID:28830929
    supporting_text: Inactivation of Bacillus subtilis pxpA, pxpB, or pxpC genes slowed growth, caused OP accumulation in cells and medium, and prevented use of OP as a nitrogen source.
