  qualifier: contributes_to
  review:
    summary: PP_4575 is the PxpC subunit of the KT2440 PxpABC 5-oxoprolinase (PP_4575-PP_4577) and contributes to, but does not alone carry, ATP-dependent 5-oxoprolinase activity.
    action: NEW
    reason: >-
      GOA has no annotation for Q88E91. Niehaus et al. (PMID:28830929) showed
      that B. subtilis and E. coli PxpABC are an ATP-dependent 5-oxoprolinase:
      single deletions abolish activity and growth on 5-oxoproline as nitrogen
      source, and activity was reconstituted only by mixing PxpA with the
      PxpBC complex; neither alone was active. PP_4575 is 35.6% identical to
      B. subtilis PxpC (KipA) and 38.7% identical to E. coli PxpC (YbgK) over
      about 90% of both sequences (homology_results.json), it is encoded next to
      the PxpB-like PP_4576 and PxpA2 (PP_4577), and its KT2440 transposon
      mutants specifically fail on L-pyroglutamate as nitrogen source, with
      PP_4576-PP_4579 as top cofitness partners (fitness_results.json).
      contributes_to is used because the activity belongs to the complex.
    supported_by:
