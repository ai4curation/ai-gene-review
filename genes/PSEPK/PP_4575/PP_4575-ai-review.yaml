references:
- id: PMID:28830929
  title: Discovery of a widespread prokaryotic 5-oxoprolinase that was hiding in plain sight.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines PxpA/PxpB/PxpC as the three subunits of a prokaryotic ATP-dependent 5-oxoprolinase by genetics, metabolite profiling and in vitro reconstitution in B. subtilis, with E. coli overexpression. Notes that P. putida carries pxpABC and is probably the source of the classical three-component OPase.
  findings:
  - statement: PxpA, PxpB and PxpC together reconstitute ATP-dependent 5-oxoprolinase activity.
    supporting_text: 5-Oxoprolinase activity could be reconstituted in vitro by mixing recombinant B. subtilis PxpA, PxpB, and PxpC proteins.
  - statement: Each pxp gene is needed for growth on 5-oxoproline as nitrogen source in B. subtilis.
    supporting_text: Inactivation of Bacillus subtilis pxpA, pxpB, or pxpC genes slowed growth, caused OP accumulation in cells and medium, and prevented use of OP as a nitrogen source.
  - statement: PxpB and PxpC are homologs of allophanate hydrolase subunits renamed for their 5-oxoprolinase role.
    supporting_text: homologs of allophanate hydrolase subunits (renamed pxpB and pxpC)
  - statement: Allophanate hydrolase activity has been shown only for a fused PxpBC homolog clustered with urea carboxylase.
    supporting_text: Allophanate hydrolase activity has only been demonstrated in a fused PxpBC homolog
- id: PMID:21245531
  title: The structure of TTHA0988 from Thermus thermophilus, a KipI-KipA homologue incorrectly annotated as an allophanate hydrolase.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Structure of a PxpB-PxpC (KipI-KipA) fusion; shows that the allophanate hydrolase label in this family is a misannotation for that protein. Abstract only.
  findings:
  - statement: The allophanate hydrolase annotation of a KipI-KipA (PxpBC) fusion protein could not be confirmed.
    supporting_text: TTHA0988 is annotated in various databases as a putative allophanate hydrolase. However, no such activity could be identified
- id: PMID:40342073
  title: The Pxp Complex Detoxifies 5-Oxoproline and Promotes the Growth of Clostridioides difficile.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent confirmation of PxpABC as a 5-oxoproline detoxifying enzyme in C. difficile; states that the P. putida enzyme is a PxpABC complex.
  findings:
  - statement: PxpB and PxpC associate with PxpA in a 5-oxoproline-metabolizing enzyme in several bacteria including P. putida.
    supporting_text: In B. subtilis, Escherichia coli, and Pseudomonas putida, PxpB and PxpC bind with PxpA
- id: PMID:42212642
  title: Growth of Corynebacterium glutamicum on 5-oxo-L-proline (pyroglutamate) as a carbon and nitrogen source requires the PxpR-controlled pxpTABC genes.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: States the current, unproven division of labour among the Pxp subunits.
  findings:
  - statement: PxpB and PxpC are assumed, not shown, to carry out the ATP-dependent phosphorylation step.
    supporting_text: It is assumed that PxpB and PxpC are responsible for ATP-dependent phosphorylation of 5-OP, whereas PxpA catalyzes the decyclization to γ-glutamyl phosphate and subsequent dephosphorylation to L-glutamate
