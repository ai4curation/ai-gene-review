- term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:28830929
  qualifier: involved_in
  review:
    summary: The PxpABC reaction forms L-glutamate from 5-oxoproline, which KT2440 needs in order to use L-pyroglutamate as a nitrogen source.
    action: NEW
    reason: >-
      The Pxp complex converts 5-oxoproline to L-glutamate. In B. subtilis the
      pxp genes are needed for growth on 5-oxoproline as sole nitrogen source
      and to prevent 5-oxoproline accumulation from spontaneous damage
      (PMID:28830929); KT2440 PP_4575 mutants likewise have a specific defect on
      L-pyroglutamate as nitrogen source. GO has no 5-oxoproline catabolic
      process term, so L-glutamate biosynthetic process is the closest process
      term for the reaction. Its physiological role is better described as
      salvage of a damaged metabolite and nitrogen scavenging than as de novo
      glutamate synthesis.
    supported_by:
    - reference_id: PMID:28830929
      supporting_text: Inactivation of Bacillus subtilis pxpA, pxpB, or pxpC genes slowed growth, caused OP accumulation in cells and medium, and prevented use of OP as a nitrogen source.
    - reference_id: file:PSEPK/PP_4575/PP_4575-bioinformatics/fitness_results.json
      supporting_text: '"fit": -3.78256802389425'
