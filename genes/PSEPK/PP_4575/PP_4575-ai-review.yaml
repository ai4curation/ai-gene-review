core_functions:
- description: >-
    C subunit of the three-subunit ATP-dependent prokaryotic 5-oxoprolinase
    PxpABC (with PP_4576 PxpB and PP_4577 PxpA2), which opens 5-oxo-L-proline
    (L-pyroglutamate) to L-glutamate. It allows KT2440 to use L-pyroglutamate
    as a nitrogen source and probably also disposes of 5-oxoproline formed by
    spontaneous metabolite damage. Inferred from characterized B. subtilis and
    E. coli orthologues plus pyroglutamate-specific KT2440 fitness data. Not
    an allophanate hydrolase or urea amidolyase.
  contributes_to_molecular_function:
    id: GO:0017168
    label: 5-oxoprolinase (ATP-hydrolyzing) activity
  directly_involved_in:
