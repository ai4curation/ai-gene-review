  label: Pseudomonas putida KT2440
description: >-
  PP_4575 (Q88E91) is a 305-residue soluble protein of the PxpC/KipA family
  (InterPro IPR052708 PxpC; PANTHER PTHR43309 "5-oxoprolinase subunit C";
  Pfam PF02626 CT_A_B carboxyltransferase subdomains A and B; SMART AHS2) with
  a C-terminal cyclophilin-like region and no transmembrane segment. It is
  encoded in the KT2440 cluster PP_4575 (PxpC-like) - PP_4576 (PxpB-like,
  PF02682) - PP_4577 (PxpA2, LamB/UPF0271), next to an MFS transporter
  (PP_4578) and a divergent LysR regulator (PP_4579). By homology to the
  experimentally characterized B. subtilis and E. coli PxpC proteins (35.6% and
  38.7% identity over about 90% of both sequences) and by its locus, it is the
  C subunit of the three-subunit ATP-dependent prokaryotic 5-oxoprolinase
  PxpABC, which hydrolyses 5-oxo-L-proline (L-pyroglutamate) to L-glutamate
  (Niehaus et al. 2017). KT2440 RB-TnSeq data (BERDL copy of the Fitness
  Browser) support this directly for PP_4575: its only strong phenotypes are
  on L-pyroglutamate as sole nitrogen source (fitness -4.19 and -3.78), shared
  with PP_4576, PP_4577, PP_4578 and PP_4579, which are its top cofitness hits
  (cofitness 0.81 with PP_4576), and it has no phenotype on urea as nitrogen
  source. KT2440 has a second Pxp cluster (PP_2920-PP_2922) whose PxpC paralog
  PP_2922 is instead required on butyrolactam (2-pyrrolidone) and not on
  pyroglutamate, so the two paralogous systems appear to have separate lactam
  substrates. The UniProt name "urea amidolyase-related protein" and the
  "allophanate hydrolase subunit" labels of homologs reflect shared domain
  homology with urea carboxylase / allophanate hydrolase, not activity: PP_4575
  lacks biotin carboxylase and biotin-carrier domains, KT2440 encodes urease
  rather than urea carboxylase, and allophanate hydrolase activity could not be
  found in a fused PxpBC homolog (TTHA0988). PxpC alone is not expected to be
  catalytic; the activity requires PxpA, PxpB and PxpC together, and which
  subunit binds ATP has not been established.
