predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0017168
    label: 5-oxoprolinase (ATP-hydrolyzing) activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and novel. PP_4575 is a PxpC orthologue (35.6% and 38.7% identity
      to B. subtilis and E. coli PxpC over about 90% of both sequences;
      homology_results.json). It is encoded with PxpB-like PP_4576 and PxpA2
      PP_4577. Its KT2440 mutants are specifically and strongly defective on
      L-pyroglutamate as nitrogen source, as are the neighbouring PxpB and PxpA
      genes, which are its top cofitness partners. PxpABC was shown to be an
      ATP-dependent 5-oxoprolinase by genetics and reconstitution
      (PMID:28830929), and the characterized PxpC proteins carry GO:0017168 at
      EXP in GOA. GOA has no annotation for Q88E91. One caveat: the activity
      needs all three subunits, so the precise gene-level statement is
      contributes_to, as used in the companion review. That refines the
      qualifier, not the term.
    supported_by:
    - reference_id: PMID:28830929
      supporting_text: 5-Oxoprolinase activity could be reconstituted in vitro by mixing recombinant B. subtilis PxpA, PxpB, and PxpC proteins.
    - reference_id: file:PSEPK/PP_4575/PP_4575-dashboard-prediction-evidence/homology_results.json
      supporting_text: '"pct_id": 38.7'
    - reference_id: file:PSEPK/PP_4575/PP_4575-dashboard-prediction-evidence/fitness_results.json
      supporting_text: '"fit": -4.18596317486971'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005524
    label: ATP binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Plausible but not established. The extractor derived this term from the
      word "ATP-dependent" in the call, which describes the complex's reaction,
      not a binding site on PxpC. The 5-oxoprolinase reaction consumes ATP
      (PMID:28830929). The current model assigns ATP-dependent phosphorylation
      of 5-oxoproline to the PxpB/PxpC pair, but the source presents this as an
      assumption (PMID:42212642). No ATP-binding motif or residue has been
      mapped to PxpC. The UniProt ATP-binding keyword for Q88E91 is an ARBA
      assertion and is not counted as support. Nothing refutes the term, so it
      is UNC rather than NPI.
    supported_by:
    - reference_id: PMID:42212642
      supporting_text: It is assumed that PxpB and PxpC are responsible for ATP-dependent phosphorylation of 5-OP
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and novel, with a caveat about framing. The PxpABC reaction
      produces L-glutamate from 5-oxoproline (PMID:28830929). In KT2440 this
      conversion is needed for growth on L-pyroglutamate as nitrogen source
      (fitness -4.19 and -3.78 for PP_4575 mutants). GO has no 5-oxoproline
      catabolic process term, so this is the closest available process term,
      and the companion review uses it. Physiologically the role is salvage of
      a damage metabolite and nitrogen scavenging, not de novo glutamate
      biosynthesis. GOA has no annotation for Q88E91.
    supported_by:
    - reference_id: PMID:28830929
      supporting_text: 5-Oxoprolinase activity could be reconstituted in vitro by mixing recombinant B. subtilis PxpA, PxpB, and PxpC proteins.
    - reference_id: file:PSEPK/PP_4575/PP_4575-dashboard-prediction-evidence/fitness_results.json
      supporting_text: '"fit": -4.18596317486971'
