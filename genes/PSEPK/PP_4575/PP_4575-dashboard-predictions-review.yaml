  label: Pseudomonas putida KT2440
status: COMPLETE
description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for
  P. putida NZ_MINF01000031.1_4082 is "5-oxoprolinase subunit C involved in
  ATP-dependent conversion of L-pyroglutamate to L-glutamate" (tier A), with
  three GO terms: GO:0017168 5-oxoprolinase (ATP-hydrolyzing) activity,
  GO:0005524 ATP binding and GO:0097054 L-glutamate biosynthetic process. The
  query is 94.1% identical over its full 305 residues to KT2440 PP_4575
  (Q88E91; 94.4% over 304 aligned pairs by local alignment), so it is scored on
  that accession. The call is supported, and it correctly rejects the
  allophanate hydrolase / urea carboxylase labels. PP_4575 is 35.6-38.7%
  identical to the experimentally characterized B. subtilis and E. coli PxpC
  proteins (PMID:28830929). It sits in a pxpCBA cluster (PP_4575-PP_4577), and
  KT2440 RB-TnSeq shows a specific, strong defect of PP_4575 mutants on
  L-pyroglutamate as nitrogen source, with the same phenotype in the PxpB-like
  and PxpA2 neighbours and no defect on urea. The paralogous KT2440 cluster
  PP_2920-PP_2922 is needed on butyrolactam instead, which argues against
  simple redundancy and against PLI for this call. GOA has no annotation for
  Q88E91, so the correct terms are novel. The activity is a property of the
  PxpABC complex; PxpC contributes to it but is not catalytic alone. The call
  itself flags this ("complex subunit"), but the extractor still emitted the
  activity as an enables-style MF. ATP binding is plausible for the PxpBC pair
  but has not been assigned to PxpC experimentally. The annotator's evidence
  summary was accurate. It did not cite the Niehaus et al. characterization,
  which the PaperBLAST panel did not surface.
