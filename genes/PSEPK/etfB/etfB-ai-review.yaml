id: Q88F96
gene_symbol: etfB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Beta subunit of the electron-transfer flavoprotein (ETF) heterodimer. EtfB
  associates with the FAD-binding alpha subunit EtfA to form a soluble carrier
  that transfers reducing equivalents from flavoprotein dehydrogenases to
  ETF-ubiquinone oxidoreductase. The beta subunit is the dehydrogenase
  recognition surface of the heterodimer and carries a structural AMP. The
  etfA-etfB pair is encoded next to PP_4203, the ETF-ubiquinone oxidoreductase
  that reoxidises it, and that locus is the convergence point for the large
  acyl-CoA dehydrogenase repertoire of Pseudomonas putida KT2440, making
  fatty-acid beta-oxidation a likely major donor pathway; the individual
  donor-acceptor pairings have not been demonstrated experimentally in this
  organism.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfB is the beta subunit of a heterodimeric ETF and an obligate
      structural and partner-recognition component of the assembled electron
      carrier; electron transfer activity is the defining molecular function of
      the ETF beta/FixA family.
    action: ACCEPT
    reason: >-
      Electron transfer activity is the defining function of the assembled
      carrier, and the completed ortholog review in this repository
      (genes/human/ETFB) likewise ACCEPTs enables GO:0009055 and calls it the
      core molecular function. That review places GO:0009055 directly in
      molecular_function; this review instead records it as
      contributes_to_molecular_function, because the single FAD of the
      heterodimer is contributed by the alpha subunit and EtfB supplies the
      partner-recognition surface and the structural AMP rather than the redox
      centre. That is a modelling difference from the human review, not a
      convention it establishes. The previous MARK_AS_OVER_ANNOTATED call would
      have left this gene with no molecular-function term at all.
- term:
    id: GO:0046395
    label: carboxylic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      The broad carboxylic-acid catabolism annotation is an electronic
      pathway-level inference for this ETF beta subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The etfA-etfB-PP_4203 locus sits at the convergence point of KT2440's
      large acyl-CoA dehydrogenase repertoire, so involvement in carboxylic-acid
      catabolism is not wrong in substance: an obligate electron acceptor for
      the pathway dehydrogenases does part of the work of the pathway, which is
      how the human ortholog review genes/human/ETFB treats the equivalent
      GO:0033539 involvement. The objection is breadth, not participation.
      GO:0046395 is a very high-level grouping term reached by electronic
      inference and covers every carboxylic acid the organism degrades,
      including the many routes that never pass through an ETF. A specific
      donor-pathway term such as GO:0033539 carries the same claim without the
      over-reach.
- term:
    id: GO:0016208
    label: AMP binding
  evidence_type: ISS
  original_reference_id: file:PSEPK/etfB/etfB-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      The local UniProt record asserts AMP as a cofactor of EtfB, but GOA
      carries no AMP-binding term for this protein. AMP is the structural
      cofactor of the ETF beta subunit and is part of the definition of the ETF
      complex itself. Propose adding the AMP-binding term.
    action: NEW
    reason: >-
      AMP binding is a direct cofactor-binding property of this polypeptide,
      not a pathway-level inference, and it is asserted in the local UniProt
      record (COFACTOR Name=AMP). It is also structurally canonical for the
      family rather than a novel claim: the GO definition of GO:0045251
      electron transfer flavoprotein complex states that the complex usually
      contains "an alpha and a beta subunit and the structural cofactor
      adenosine monophosphate (AMP)". This parallels the GO:0050660 gap filled
      on the partner ETF-QO PP_4203 in this same batch, where GOA likewise
      omitted a cofactor the UniProt record asserts. Marked ISS because the
      assignment is by family rule rather than direct assay in KT2440.
    supported_by:
    - reference_id: file:PSEPK/etfB/etfB-uniprot.txt
      supporting_text: Name=AMP; Xref=ChEBI:CHEBI:456215;
- term:
    id: GO:0045251
    label: electron transfer flavoprotein complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/etfB/etfB-uniprot.txt
  qualifier: part_of
  review:
    summary: >-
      GOA gives EtfB no cellular-component term, so the assembled carrier it is
      a subunit of is not recorded anywhere. The UniProt record asserts the
      heterodimer, and GO:0045251 is the term for exactly that assembly.
    action: NEW
    reason: >-
      The local UniProt record states SUBUNIT "Heterodimer of an alpha and a
      beta subunit", and the protein is assigned to the ETF beta-subunit/FixA
      family, whose product is the ETF complex by definition. The human
      orthologs in the same role carry GO:0045251 as an experimental (IPI)
      annotation - genes/human/ETFA and genes/human/ETFB both have it from
      PMID:8962055 - so this is a gap in the electronic annotation of the
      bacterial protein rather than a new biological claim. ISS because the
      assembly is asserted by family rule rather than assayed in KT2440.
    supported_by:
    - reference_id: file:PSEPK/etfB/etfB-uniprot.txt
      supporting_text: Heterodimer of an alpha and a beta subunit.
