id: Q88F96
gene_symbol: etfB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Beta subunit of the electron-transfer flavoprotein (ETF) heterodimer. EtfB
  associates with the FAD-binding alpha subunit EtfA to form a soluble carrier
  that transfers reducing equivalents from flavoprotein dehydrogenases to
  ETF-ubiquinone oxidoreductase. The available record does not establish a
  specific upstream donor or catabolic pathway for this ETF pair.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfB is the beta subunit of a heterodimeric ETF and an obligate
      structural and partner-recognition component of the assembled electron
      carrier; electron transfer activity is the defining molecular function of
      the ETF beta/FixA family.
    action: ACCEPT
    reason: >-
      GO's convention for an obligate subunit of a multi-protein electron
      carrier is to ACCEPT the enables annotation and to record the
      subunit-level dependency as contributes_to_molecular_function in
      core_functions, which this review already does. The completed ortholog
      review in this repository (genes/human/ETFB) ACCEPTs enables GO:0009055
      for the same protein and calls it the core molecular function. The
      previous MARK_AS_OVER_ANNOTATED call was inconsistent with that
      convention and would have left this gene with no molecular-function term
      at all.
- term:
    id: GO:0046395
    label: carboxylic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      The broad carboxylic-acid catabolism annotation is an electronic
      pathway-level inference for this ETF beta subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The record establishes an electron-carrier role, and the etfA-etfB-PP_4203
      locus does sit at the convergence point of KT2440's large acyl-CoA
      dehydrogenase repertoire, so carboxylic-acid catabolism is not wrong. But
      GO:0046395 is a very broad pathway-level term reached by electronic
      inference, and EtfB's own contribution is the upstream electron-carrier
      step rather than any carboxylic-acid catabolic reaction, so the term
      over-states what this subunit does.
