id: Q88F96
gene_symbol: etfB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Beta subunit of the electron-transfer flavoprotein (ETF) heterodimer. EtfB
  associates with the FAD-binding alpha subunit EtfA to form a soluble carrier
  that transfers reducing equivalents from flavoprotein dehydrogenases to
  ETF-ubiquinone oxidoreductase. The available record does not establish a
  specific upstream donor or catabolic pathway for this ETF pair.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfB is the beta subunit of a heterodimeric ETF and is required for the
      assembled carrier's electron-transfer function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Electron transfer is a property of the alpha/beta ETF complex. Assigning
      the complete activity with enables to the beta polypeptide is too strong;
      EtfB is better represented as contributing to that activity.
- term:
    id: GO:0046395
    label: carboxylic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      The broad carboxylic-acid catabolism annotation is an electronic
      pathway-level inference for this ETF beta subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The record establishes an electron-carrier role but does not identify
      the physiological donor dehydrogenase or a particular carboxylic-acid
      catabolic pathway in Pseudomonas putida KT2440.
