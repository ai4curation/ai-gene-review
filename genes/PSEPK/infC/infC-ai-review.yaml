id: Q88K26
gene_symbol: infC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Bacterial translation initiation factor IF-3. It binds the 30S ribosomal
  subunit, favors free subunits over vacant 70S ribosomes, and promotes accurate
  selection of initiation complexes before large-subunit joining.
existing_annotations:
- term:
    id: GO:0003743
    label: translation initiation factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Conserved core molecular function of bacterial IF-3.
    action: ACCEPT
    reason: >-
      UniProt identifies IF-3 as a 30S-bound initiation factor that maintains
      initiation-competent free subunits.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct broad location, but redundant with the separately accepted cytosol annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0005737 is compatible with soluble IF-3, but the same GOA set already
      contains the more specific GO:0005829 cytosol annotation, so the broad
      parent adds no useful location information.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct location for soluble IF-3 and 30S initiation complexes.
    action: ACCEPT
    reason: >-
      UniProt assigns IF-3 to the cytoplasm and describes its association with
      the soluble 30S ribosomal subunit.
- term:
    id: GO:0006413
    label: translational initiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Directly captures the core biological role of IF-3.
    action: ACCEPT
    reason: >-
      IF-3 increases the free 30S pool on which bacterial initiation begins.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: IF-3 is a soluble ribosome-associated factor; a generic membrane location is unsupported and likely a TreeGrafter transfer artifact.
    action: REMOVE
    reason: >-
      The exact target record assigns IF-3 to the cytoplasm and contains no
      signal peptide, transmembrane segment, or membrane-localization statement;
      the membrane transfer conflicts with the characterized soluble 30S role.
    supported_by:
    - reference_id: file:PSEPK/infC/infC-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0032790
    label: ribosome disassembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: IF-3 stabilizes separated subunits after RRF/EF-G action, an experimentally supported recycling-to-initiation interface role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Primary biochemical evidence shows that IF3 binds transiently generated
      30S subunits after RRF/EF-G action and prevents reassociation. This makes
      the process annotation valid, but IF3 stabilizes rather than executes the
      primary splitting reaction, so it is not the factor's core initiation
      function.
    supported_by:
    - reference_id: PMID:16043510
      supporting_text: >-
        IF3 stabilizes the dissociation by binding to the transiently formed 30S
        subunits, preventing re-association back to 70S ribosomes.
- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: IF-3 binds specifically to the small ribosomal subunit rather than generically to either ribosomal subunit.
    action: MODIFY
    reason: >-
      The exact record and experimental literature identify direct 30S-subunit
      binding, so GO:0043024 is the more informative binding term.
    proposed_replacement_terms:
    - id: GO:0043024
      label: ribosomal small subunit binding
