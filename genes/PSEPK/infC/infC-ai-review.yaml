    summary: Conserved core molecular function of bacterial IF-3.
    action: ACCEPT
    reason: >-
      UniProt identifies IF-3 as a 30S-bound initiation factor that maintains
      initiation-competent free subunits.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct but redundant with the more specific cytosol annotation.
    action: MODIFY
    reason: >-
      The same GOA record already contains cytosol, so retain the more specific
      child location for this soluble factor.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct location for soluble IF-3 and 30S initiation complexes.
    action: ACCEPT
    reason: >-
      UniProt assigns IF-3 to the cytoplasm and describes its association with
      the soluble 30S ribosomal subunit.
- term:
    id: GO:0006413
    label: translational initiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Directly captures the core biological role of IF-3.
    action: ACCEPT
    reason: >-
      IF-3 increases the free 30S pool on which bacterial initiation begins.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: IF-3 is a soluble ribosome-associated factor; a generic membrane location is unsupported and likely a TreeGrafter transfer artifact.
    action: REMOVE
    reason: >-
      The exact target record assigns IF-3 to the cytoplasm and contains no
      signal peptide, transmembrane segment, or membrane-localization statement;
      the membrane transfer conflicts with the characterized soluble 30S role.
    supported_by:
    - reference_id: file:PSEPK/infC/infC-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0032790
    label: ribosome disassembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: IF-3 favors dissociated 30S and 50S subunits and therefore contributes directly to ribosome disassembly/equilibrium control.
    action: ACCEPT
    reason: >-
      UniProt states that IF-3 shifts the 70S/free-subunit equilibrium toward
      free 50S and 30S subunits.
- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct mechanistic binding, but less informative than translation initiation factor activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      IF-3 binds the 30S subunit directly, while GO:0003743 captures the purpose
      of that binding.
