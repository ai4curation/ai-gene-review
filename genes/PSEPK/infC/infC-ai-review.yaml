- id: PMID:16043510
  title: The role of ribosome recycling factor in dissociation of 70S ribosomes into subunits.
  findings:
  - statement: RRF and EF-G transiently split 70S or post-termination ribosomes, while IF3 stabilizes the resulting 30S subunit and prevents reassociation.
    supporting_text: >-
      IF3 stabilizes the dissociation by binding to the transiently formed 30S
      subunits, preventing re-association back to 70S ribosomes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed- and PMC-verified primary biochemical study with cached full text.
- id: PMID:8858589
  title: Escherichia coli translation initiation factor 3 discriminates the initiation codon in vivo.
  full_text_unavailable: true
  findings:
  - statement: In-vivo start-codon substitutions and IF3 mutants establish IF3 discrimination between efficient and inefficient bacterial initiation codons.
    supporting_text: >-
      Therefore, IF3 is generally able to discriminate between efficient and
      inefficient codons in vivo, consistent with earlier in vitro observations.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary in-vivo study; only the abstract is cached.
