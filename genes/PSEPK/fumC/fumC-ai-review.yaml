id: Q88M20
gene_symbol: fumC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Fumarate hydratase class II (fumarase C, FumC; EC 4.2.1.2), encoded by fumC (fumC-2 / PP_1755), one of three fumarase isoenzymes in Pseudomonas putida KT2440 (alongside fumA/PP_0897 and fumC1/PP_0944). It is a cytoplasmic, iron-independent homotetrameric enzyme that catalyzes the reversible, stereospecific hydration/dehydration of fumarate and (S)-malate ((S)-malate = fumarate + H2O), the step of the tricarboxylic acid (TCA) cycle that interconverts fumarate and L-malate. Unlike class I fumarases, which contain an oxygen-sensitive [4Fe-4S] cluster, class II fumarases lack a metal cofactor and are oxidant-resistant, allowing them to maintain TCA-cycle flux under oxidative/nitrosative stress. The enzyme belongs to the class-II fumarase/aspartase (fumarate lyase) family, with a conserved multi-domain fold; active sites are formed at subunit interfaces and include a catalytic A site and a non-catalytic B site.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Root-level catalytic activity term; true of FumC but uninformative beside the accepted fumarate hydratase activity.
    action: TOO_GENERAL
    reason: GO:0003824 is an ancestor of GO:0004333 (fumarate hydratase activity), which this review accepts as the core molecular function. The claim is correct (FumC is an enzyme) but is entailed by the accepted specific term, so it is TOO_GENERAL rather than an over-annotation.
- term:
    id: GO:0004333
    label: fumarate hydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Core molecular function. FumC is a class II fumarate hydratase (EC 4.2.1.2) catalyzing (S)-malate = fumarate + H2O.
    action: ACCEPT
    reason: Supported by the curated HAMAP rule MF_00743, the class-II fumarase/aspartase family (fumarase subfamily) assignment, and conservation of the HAMAP catalytic residues (His186 proton donor/acceptor, Ser316). There is no KT2440-specific biochemistry for this isozyme, so the assignment rests on family membership and characterization of the E. coli FumC ortholog, which is strong for this well-conserved family. This is the central function of the gene.
    supported_by:
    - reference_id: file:PSEPK/fumC/fumC-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=(S)-malate = fumarate + H2O; Xref=Rhea:RHEA:12460,
    - reference_id: file:PSEPK/fumC/fumC-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the class-II fumarase/aspartase family. Fumarase subfamily.
    - reference_id: file:PSEPK/fumC/fumC-deep-research-openscientist.md
      supporting_text: The assignment is supported by curated annotation, ~61% identity to the biochemically characterized *E. coli* FumC with 100% conservation of the class II catalytic motif and residues
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: FumC is a soluble cytoplasmic enzyme, consistent with its role in the cytosolic bacterial TCA cycle.
    action: ACCEPT
    reason: UniProt subcellular location (HAMAP-Rule MF_00743) and the soluble nature of class II fumarases support cytoplasmic localization. No signal peptide or transmembrane features are annotated.
    supported_by:
    - reference_id: file:PSEPK/fumC/fumC-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_00743}.'
