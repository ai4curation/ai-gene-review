    action: KEEP_AS_NON_CORE
    reason: Accurate given (S)-malate is directly produced/consumed, and not entailed by the TCA-cycle term (GO:0006099 is not a descendant of GO:0006108). Peripheral to the core TCA-cycle role, so kept as non-core.
