taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RuvA is the junction-recognition and motor-loading subunit of the bacterial
  RuvAB Holliday-junction branch-migration complex. It binds four-way DNA,
  opens the junction, and recruits RuvB ATPase rings that drive branch migration;
  RuvC subsequently resolves the migrated junction. RuvA is a DNA-binding
  organizer rather than the ATP-dependent motor itself.
existing_annotations:
  - term:
      id: GO:0000400
      label: four-way junction DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: RuvA specifically recognizes and opens Holliday-junction DNA.
      action: ACCEPT
      reason: This is the defining independent molecular function of the RuvA subunit.
  - term:
      id: GO:0003677
      label: DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but redundant with the exact four-way-junction DNA-binding term.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0000400 captures the biologically relevant substrate specificity.
  - term:
      id: GO:0003678
      label: DNA helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: RuvA organizes the junction but does not provide the ATP-dependent motor activity.
      action: REMOVE
      reason: RuvB is the catalytic branch-migration motor in the RuvAB complex.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Independent ATP binding is not part of the established RuvA mechanism.
      action: REMOVE
      reason: ATP binding and hydrolysis belong to the RuvB motor subunit.
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Consistent with a soluble bacterial chromosome-processing protein but not function-defining.
      action: KEEP_AS_NON_CORE
      reason: Generic cytoplasmic localization adds little beyond the DNA-repair mechanism.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: RuvA participates in recombinational repair by organizing Holliday-junction branch migration.
      action: ACCEPT
      reason: The conserved RuvABC mechanism directly supports this process assignment.
  - term:
      id: GO:0006310
      label: DNA recombination
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: RuvA acts on a central DNA-recombination intermediate.
      action: ACCEPT
      reason: Holliday-junction recognition is a core late step of homologous recombination.
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: Broadly compatible with repair activity but less informative than the direct recombination terms.
      action: KEEP_AS_NON_CORE
      reason: The annotation describes a wider response rather than RuvA's direct mechanistic role.
  - term:
      id: GO:0009378
      label: four-way junction helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The RuvAB complex performs this activity, but RuvA is not the ATP-dependent motor.
      action: REMOVE
      reason: An enables qualifier incorrectly assigns RuvB's catalytic activity to RuvA.
  - term:
      id: GO:0009379
      label: Holliday junction helicase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: RuvA is the junction-binding component of the RuvAB branch-migration complex.
      action: ACCEPT
      reason: Conserved RuvAB complex architecture supports this component annotation.
  - term:
      id: GO:0048476
      label: Holliday junction resolvase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: part_of
    review:
      summary: RuvA participates in the larger RuvABC resolvosome that couples migration to resolution.
      action: ACCEPT
      reason: UniProt describes the conserved DNA-RuvA-RuvB-RuvC assembly.
