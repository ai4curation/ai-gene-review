  label: Pseudomonas putida KT2440
description: RuvA is the Holliday-junction recognition subunit of the Pseudomonas putida RuvAB branch-migration
  complex, encoded in the ruvCAB locus. By conservation with E. coli RuvA, a RuvA homotetramer binds and
  opens the four-way junction and loads RuvB hexameric ATPase rings that pump DNA to migrate the crossover;
  RuvA has no ATPase activity. RuvA also takes part in the RuvABC resolvosome, in which RuvC cleaves the
  migrated junction, and RuvAB acts in recombinational repair and in replication fork reversal.
