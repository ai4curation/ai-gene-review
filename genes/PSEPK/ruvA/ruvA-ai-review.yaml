  - term:
      id: GO:0009378
      label: four-way junction helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: RuvA is required for RuvAB four-way-junction helicase activity but contributes as the junction-binding and motor-loading subunit rather than as the ATPase motor.
      action: MARK_AS_OVER_ANNOTATED
      reason: The term is correct at complex level, but the `enables` qualifier overstates RuvA's direct activity; this should be represented as a contribution to RuvAB helicase activity while RuvB independently enables the motor reaction.
      supported_by:
        - reference_id: PMID:9973614
          supporting_text: RuvA and RuvB promote branch migration of Holliday junctions
        - reference_id: PMID:9501105
          supporting_text: branch migration is catalysed by the RuvB protein, a hexameric DNA helicase that is loaded onto the junction by RuvA
