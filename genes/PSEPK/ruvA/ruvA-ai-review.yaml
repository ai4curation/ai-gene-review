      action: ACCEPT
      reason: Holliday-junction recognition is a core late step of homologous recombination.
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: Broadly compatible with repair activity but less informative than the direct recombination terms.
      action: KEEP_AS_NON_CORE
