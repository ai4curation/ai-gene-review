- id: PMID:42328986
  title: Degradation pathway of (R)-1,3-butanediol in Pseudomonas putida KT2440 and development of its
    biosensor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results Fig. 4 and Methods inspected. His-tagged KT2440 enzyme was expressed in
      E. coli K12 and assayed at 37 C, pH 8 with 10 mM substrate and 0.9 mM NAD. This directly resolves
      R-3HB chemistry, not the older proposed 4HB reaction.
  findings:
  - statement: Purified PP_2049 oxidizes R-3-hydroxybutyrate with NAD to acetoacetate, and native deletion/complementation
      establishes growth dependence. The measured R preference is not absolute S exclusion.
    supporting_text: equimolar NADH and acetoacetate (AA) were generated for both PP_2049 and PP_3073
- id: PMID:37067433
  title: Integration of ARTP Mutation and Adaptive Laboratory Evolution to Reveal 1,4-Butanediol Degradation
    in Pseudomonas putida KT2440.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Transcript induction and engineered downstream GCL phenotypes do
      not establish PP_2049 substrate specificity or a universally dominant free-acid route.
  findings:
  - statement: Evolved KT2440 NB10 shows PP_2049 transcriptional induction alongside beta-oxidation and
      GCL pathway changes.
- id: PMID:32256468
  title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, pathway validation and conclusion inspected. PP_2049 is Q88L86, distinct
      from PP_2650/Q88JJ9. The text calls PP_3151 SadI, whereas current locus-resolved nomenclature is
      sad-II; locus identifiers govern attribution.
  findings:
  - statement: KT2440 PP_2049 deletion abolishes growth on tested 4HB/1,4-BDO conditions, but direct 4HB
      biochemical assays were unsuccessful; the paper retains competing routes. PP_3151 is an annotated
      downstream candidate, not an isolated enzyme assay.
    supporting_text: Attempts to obtain direct biochemical evidence for the oxidation hypothesis with
      dehydrogenase assays on whole cell extracts
