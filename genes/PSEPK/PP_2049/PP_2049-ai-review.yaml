core_functions:
- description: NAD-dependent oxidation of R-3-hydroxybutyrate to acetoacetate, demonstrated with recombinant
    purified PP_2049 and supported by native deletion/complementation. Minor S-enantiomer turnover does
    not imply equivalent efficiency; the tested 1,3-diols showed no activity.
  molecular_function:
    id: GO:0003858
    label: 3-hydroxybutyrate dehydrogenase activity
  supported_by:
  - reference_id: PMID:42328986
    supporting_text: equimolar NADH and acetoacetate (AA) were generated for both PP_2049 and PP_3073
- description: Conserved catalytic metal-binding architecture; the metal species and occupancy are inferred
    rather than measured in the target assay.
  molecular_function:
    id: GO:0046872
    label: metal ion binding
  supported_by:
  - *id001
