suggested_questions:
- question: Does purified PP_2049 oxidize free 4-hydroxybutyrate to succinate semialdehyde, or does its
    native growth phenotype reflect a different reaction or pathway context?
- question: Which metal supports native PP_2049 catalysis, and what are its matched NAD/NADP and R/S-hydroxyacid
    kinetic profiles?
suggested_experiments:
- hypothesis: The measured R-3-hydroxybutyrate activity and the genetic 4-hydroxybutyrate phenotype may
    involve different substrate capabilities.
  description: Measure purified PP_2049 turnover and chemically verify products with 3- versus 4-hydroxybutyrate,
    NAD/NADP and metal controls. Use isotope tracing and native complementation to distinguish free-acid
    SSA production from CoA-dependent routes.
