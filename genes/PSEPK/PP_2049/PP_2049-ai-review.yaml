  label: Pseudomonas putida KT2440
description: PP_2049 encodes a metal-dependent alcohol-dehydrogenase-family enzyme in Pseudomonas putida
  KT2440 with directly demonstrated NAD-dependent oxidation of (R)-3-hydroxybutyrate to acetoacetate.
  Recombinant enzyme favors the R enantiomer, while native deletion and complementation establish an important
  role in growth on R-3-hydroxybutyrate and R-1,3-butanediol. PP_2049 is also required for growth on 4-hydroxybutyrate
  under tested conditions, but direct oxidation of that distinct substrate to succinate semialdehyde remains
  unresolved.
