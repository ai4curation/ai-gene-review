- id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: A KT2440 betC deletion did not prevent accumulation of intact choline-O-sulfate.
    supporting_text: This mutant still accumulated intact COS but failed to use this compound as carbon or nitrogen source.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct KT2440 betC genetics. The cached abstract does not individually assay PP_0075 or identify the transporter responsible for COS uptake.
- id: PMID:21369825
  title: Inducible expression of choline sulfatase and its regulator BetR in Pseudomonas sp. ATCC19151.
  full_text_unavailable: true
  findings:
  - statement: The syntenic BetE homolog is predicted to be a STAS-domain permease.
    supporting_text: BetE is a permease and contains STAS domain.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The BetE transport role is an in-silico assignment rather than a direct substrate-transport assay.
- id: file:PSEPK/PP_0075/PP_0075-deep-research-openscientist.md
  title: OpenScientist deep-research report for PSEPK PP_0075
  findings:
  - statement: The report confirms the target's generic SulP/SLC26 transporter architecture.
    supporting_text: PP_0075 encodes an integral inner-membrane secondary transporter belonging to the **SulP / SLC26 anion-permease superfamily**.
    reference_section_type: DISCUSSION
  - statement: The report acknowledges that no direct target transport assay establishes substrate or direction.
    supporting_text: No direct transport assay exists for PP_0075.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Architecture and absence-of-direct-assay observations were retained. The
      report's proposed sulfate cargo and assignment of intact COS uptake to an
      unspecified ABC route are speculative and are not adopted.
