id: Q88RQ4
gene_symbol: PP_0075
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0075 is a multi-pass SLC26A/SulP-family membrane transporter with a
  cytoplasmic STAS domain. It lies next to the choline-sulfatase gene betC, but
  its transported substrate, coupling mechanism, and proposed role in
  choline-O-sulfate uptake have not been established experimentally.
