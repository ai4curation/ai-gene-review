taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain KT2440)}
description: >-
  FAD-containing catalytic subunit of the periplasmic three-subunit gluconate
  2-dehydrogenase. It contributes substrate oxidation chemistry to the assembled
  Gad complex; the exact complex activity should not be attributed to this
  subunit with an enables qualifier.
existing_annotations:
  - term: {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
    evidence_type: ISS
    qualifier: contributes_to
    review:
      summary: Homology and conserved operon architecture identify the catalytic flavoprotein subunit of Gad.
      action: NEW
      reason: The qualifier records contribution to the multisubunit enzyme rather than autonomous complex activity.
  - term: {id: "GO:0050660", label: flavin adenine dinucleotide binding}
    evidence_type: ISS
    qualifier: enables
    review:
      summary: GMC oxidoreductase domains and the homologous Gad flavoprotein support FAD binding.
      action: NEW
      reason: This is a subunit-specific molecular function independent of the complex-level catalytic annotation.
  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: The Gad complex oxidizes gluconate to 2-ketogluconate in the peripheral glucose route.
      action: NEW
      reason: Adds the specific biological process supported by pathway context.
