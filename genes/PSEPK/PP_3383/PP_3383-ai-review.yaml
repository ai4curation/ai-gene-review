id: Q88HH5
gene_symbol: PP_3383
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  FAD-containing catalytic subunit of the periplasmic three-subunit gluconate
  2-dehydrogenase. It contributes substrate oxidation chemistry to the assembled
  Gad complex rather than independently enabling the complete complex reaction.
existing_annotations:
  - term: {id: "GO:0016614", label: "oxidoreductase activity, acting on CH-OH group of donors"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The catalytic flavoprotein subunit performs the CH-OH substrate oxidation within the assembled Gad complex.
      action: ACCEPT
      reason: This is the appropriate independently enabled reaction class for the catalytic subunit, alongside its contribution to the complete complex activity.
      supported_by:
        - reference_id: file:PSEPK/PP_3383/PP_3383-uniprot.txt
          supporting_text: "DE   SubName: Full=Gluconate 2-dehydrogenase flavoprotein subunit"
  - term: {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: contributes_to
    review:
      summary: Homology and conserved operon architecture identify the catalytic flavoprotein subunit of Gad.
      action: MODIFY
      reason: Replace the GOA enables relation with contributes_to because the GO term describes the assembled multisubunit enzyme.
      proposed_replacement_terms:
        - {id: "GO:0033717", label: gluconate 2-dehydrogenase (acceptor) activity}
      supported_by:
        - reference_id: PMID:9352901
          supporting_text: complete structural genes for a 68-kDa dehydrogenase subunit, a 47-kDa cytochrome c subunit, and a 24-kDa subunit of unknown function
  - term: {id: "GO:0050660", label: flavin adenine dinucleotide binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: GMC oxidoreductase domains and the homologous Gad flavoprotein support FAD binding.
      action: KEEP_AS_NON_CORE
      reason: FAD binding is valid cofactor chemistry but is ancillary to the subunit's catalytic oxidoreductase role.
      supported_by:
        - reference_id: file:PSEPK/PP_3383/PP_3383-uniprot.txt
          supporting_text: "DR   GO; GO:0050660; F:flavin adenine dinucleotide binding; IEA:InterPro."
  - term: {id: "GO:0019595", label: non-phosphorylated glucose catabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: The Gad complex oxidizes periplasmic gluconate to 2-ketogluconate in the oxidative glucose route.
      action: NEW
      reason: This is the pathway-level role of the periplasmic, non-phosphorylative Gad step.
      supported_by:
        - reference_id: PMID:9352901
          supporting_text: The positive clone converted D-gluconate to 2-keto-D-gluconate (2KDG) in the culture medium.
