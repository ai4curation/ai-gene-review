id: Q88DM2
gene_symbol: dacA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  DacA/PBP5 is a periplasmic, membrane-associated peptidase-S11
  D,D-carboxypeptidase that removes the terminal D-Ala from peptidoglycan
  pentapeptide stems. This converts pentapeptides to tetrapeptides and tunes
  the donor pool available for peptidoglycan crosslinking.
