taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3099 is TssC1, the large sheath subunit of the K1 type VI secretion system. The legacy puuD and urate-oxidase assignments are misleading: TssC-specific domains and the experimentally mapped structural operon identify it as a sheath protein.
existing_annotations:
  - term: {id: "GO:0004846", label: urate oxidase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: PP_3099 is a TssC1 sheath protein, not a urate oxidase.
      action: REMOVE
      reason: TssC-specific InterPro/PANTHER assignments and the experimentally mapped K1 structural operon contradict the legacy EC mapping.
      supported_by:
        - reference_id: file:PSEPK/puuD/puuD-uniprot.txt
          supporting_text: T6SS_TssC-like
  - term: {id: "GO:0033103", label: protein secretion by the type VI secretion system}
    evidence_type: TAS
    original_reference_id: PMID:36748579
    qualifier: involved_in
    review:
      summary: Forms the contractile K1 sheath together with TssB1; it is not a urate oxidase.
      action: NEW
      reason: PMID:36748579 and the protein-family/locus evidence place this product in the KT2440 K1-T6SS apparatus.
      supported_by:
        - reference_id: PMID:36748579
          supporting_text: The structural operon harbours a total of 15 genes, 12 of which encode the T6SS core components (TssABCDEFGHJKLM)
