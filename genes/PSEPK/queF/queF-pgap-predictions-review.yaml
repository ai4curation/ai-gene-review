- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0043867
    label: 7-cyano-7-deazaguanine tRNA-ribosyltransferase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      Wrong. GO:0043867 is defined as tRNA guanine + 7-cyano-7-deazaguanine =
      tRNA 7-cyano-7-deazaguanine + guanine, the base-exchange reaction of the
      archaeal tRNA-guanine transglycosylase TgtA (synonyms TgtA, archaeal
      tRNA-guanine transglycosylase activity). That activity belongs to a
      different enzyme in a different lineage. QueF instead reduces free preQ0
      to preQ1, which the bacterial Tgt then inserts into tRNA; QueF has no
      tRNA-ribosyltransferase activity. The shared substrate name
      (7-cyano-7-deazaguanine) is the likely source of the confusion. The
      wrong term sits on the TIGR03138 model's GO list next to the correct
      preQ1 synthase term, so the error is on the HMM and reaches every
      genome; the PfamEq model NF025842 lists only GO:0008616 and GO:0033739.
    supported_by:
    - reference_id: file:PSEPK/queF/queF-uniprot.txt
      supporting_text: "deazaguanine (preQ0) to 7-aminomethyl-7-deazaguanine (preQ1)."
    - reference_id: PMID:15767583
      supporting_text: "Contrary to the predictions based on sequence analysis, we discovered that the enzymes, in fact, catalyze a mechanistically unrelated reaction"
