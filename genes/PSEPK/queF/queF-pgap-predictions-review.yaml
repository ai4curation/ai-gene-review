id: Q88KX9
gene_symbol: queF
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_2160
description: >-
  NCBI PGAP names WP_010953147.1 "NADPH-dependent 7-cyano-7-deazaguanine
  reductase QueF" from the TIGR03138 equivalog HMM and passes on that model's
  EC 1.7.1.13 and three GO terms. The name, the EC number, preQ1 synthase
  activity and tRNA queuosine biosynthesis all agree with the reviewed UniProt
  entry and the main review. The third GO term,
  7-cyano-7-deazaguanine tRNA-ribosyltransferase activity (GO:0043867), is
  wrong: it is the archaeal TgtA reaction that inserts preQ0 into tRNA, a
  different enzyme acting on the same small molecule. QueF reduces free preQ0
  to preQ1 and does not touch tRNA. The error lies in the GO mapping of the
  TIGR03138 model itself, so every QueF named by that model receives it; the
  PfamEq model NF025842 for the same protein carries only the two correct terms.
