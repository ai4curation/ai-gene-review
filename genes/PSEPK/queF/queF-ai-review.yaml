id: Q88KX9
gene_symbol: queF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  QueF is the cytoplasmic, NADPH-dependent preQ1 synthase of Pseudomonas putida
  KT2440. This type 2 QueF homodimer reduces the nitrile of
  7-cyano-7-deazaguanine (preQ0) to the aminomethyl group of
  7-aminomethyl-7-deazaguanine (preQ1), producing the bacterial base substrate
  that Tgt subsequently inserts at tRNA position 34.
