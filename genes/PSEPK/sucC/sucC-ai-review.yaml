- id: file:PSEPK/sucC/sucC-deep-research-openscientist.md
  title: OpenScientist deep research report for sucC
  findings:
  - statement: The report summarizes the SucC/SucD division of labor in the heterotetrameric SCS
      complex.
    supporting_text: SucC contributes the nucleotide chemistry and the dicarboxylate specificity, while SucD carries the catalytic histidine and part of the CoA/succinate site.
    reference_section_type: RESULTS
  - statement: The report records the absence of direct purified Q88FB2 kinetics or structure.
    supporting_text: 'All catalytic, kinetic, and structural conclusions are transferred by homology from *E. coli*, *T. aquaticus*, and mammalian SCS. There is no published crystal structure, purified-enzyme kinetics, or Km/kcat measurement specifically for Q88FB2.'
    reference_section_type: RESULTS
  - statement: The report supports cytosolic localization for the bacterial enzyme.
    supporting_text: 'whereas the bacterial homolog Q88FB2 lacks such a signal and therefore functions as a **soluble cytoplasmic enzyme**'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Provider-generated report; used for SucC/SucD subunit interpretation and the explicit
      lack-of-direct-assay caveat while core catalytic support remains anchored to UniProt.
- id: PMID:12534463
  title: Complete genome sequence and comparative analysis of the metabolically versatile Pseudomonas putida KT2440.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genome sequencing/annotation paper that established the PP_4186 locus (sucC) in P. putida KT2440. PubMed ID matches the UniProt cross-reference. Background/locus provenance rather than direct functional characterization of SucC.
- id: PMID:10671455
  title: Succinyl coenzyme A synthetase of Pseudomonas aeruginosa with a broad specificity for nucleoside triphosphate
    (NTP) synthesis modulates specificity for NTP synthesis by the 12-kilodalton form of nucleoside diphosphate
    kinase.
  findings:
  - statement: P. aeruginosa succinyl-CoA synthetase makes ATP and GTP in about equal amounts when given both
      nucleoside diphosphates.
    supporting_text: Scs synthesizes essentially an equimolar amount of ATP and GTP
  - statement: The enzyme copurifies with nucleoside diphosphate kinase, so the result is not a clean measure
      of intrinsic nucleotide specificity.
    supporting_text: Scs was previously shown to copurify with Ndk, presumably as a complex.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read; the full text is not cached. A direct assay of the enzyme of a congener, P. aeruginosa,
      not of P. putida KT2440. It supports the family-level statement that bacterial succinyl-CoA synthetase with
      a single beta subunit can form GTP, and is the kind of seed behind the PAINT placement of GDP-forming activity.
      The equimolar result is an end-point observation; the abstract gives no kinetic constants, and it notes that
      the enzyme copurifies with nucleoside diphosphate kinase and shows broad NDP kinase activity. It is therefore
      weak evidence about the relative preference for ADP and GDP.
suggested_questions:
- question: Has the KT2440 SucC/SucD complex been purified directly, and what is its ADP/GDP nucleotide preference in the succinyl-CoA cleavage and succinyl-CoA synthesis directions?
suggested_experiments:
- description: Co-express and purify PP_4186/PP_4185 SucC/SucD, then measure Mg2+-dependent succinyl-CoA ligase and synthetase activity with ADP/ATP versus GDP/GTP to establish KT2440 nucleotide preference and reversibility.
  experiment_type: enzyme-complex reconstitution
