- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: The HAMAP rule records the GDP-forming reaction (RHEA:22120) beside the ADP-forming one; GTP use is shown for the P. aeruginosa enzyme and has not been assayed for the KT2440 enzyme.
    action: ACCEPT
    reason: The HAMAP rule records both the ATP and the GTP reaction for Q88FB2. Nucleotide preference has not been measured for the KT2440 enzyme. The nearest assayed enzyme, P. aeruginosa SucCD (beta subunit 94% identical, 363 of 388 residues), formed ATP and GTP in about equal amounts from an equimolar mixture of ADP and GDP (PMID:10671455) and carries experimental annotations for both activities, so neither activity is ranked above the other here. That result is an end-point observation without kinetic constants in the abstract, and the same abstract notes that the enzyme copurifies with nucleoside diphosphate kinase, so it does not show equal intrinsic specificity. The E. coli tenfold preference for ATP (beta subunit 77% identical) is not assumed to transfer.
    supported_by:
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=GTP + succinate + CoA = succinyl-CoA + GDP + phosphate;
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: coupling the hydrolysis of succinyl-CoA to the synthesis of either ATP or GTP
    - reference_id: PMID:10671455
      supporting_text: Scs synthesizes essentially an equimolar amount of ATP and GTP
