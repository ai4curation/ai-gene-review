  findings:
  - statement: The report summarizes the SucC/SucD division of labor in the heterotetrameric SCS
      complex.
    supporting_text: SucC contributes the nucleotide chemistry and the dicarboxylate specificity, while SucD carries the catalytic histidine and part of the CoA/succinate site.
