      is the HAMAP MF_00558 rule: its curated function statement assigns
      nucleotide specificity to the beta subunit, and it maps an ATP-grasp
      domain with ATP-binding residues (46, 53-55, 99, 102, 107) onto Q88FB2.
      These are rule-based family transfers, not a KT2440 binding assay.
