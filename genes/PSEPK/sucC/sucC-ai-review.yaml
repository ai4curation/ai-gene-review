  label: Pseudomonas putida KT2440
description: SucC is the beta subunit of the soluble cytosolic succinyl-CoA synthetase complex in Pseudomonas putida KT2440. With the SucD alpha subunit, it catalyzes the reversible Mg2+-dependent interconversion of succinyl-CoA and succinate in the tricarboxylic acid cycle, with the SucC ATP-grasp domain contributing nucleotide binding and succinate specificity.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Succinyl-CoA synthetase requires Mg2+ as a cofactor; UniProt annotates one Mg2+ per beta subunit with two binding residues (positions 199 and 213).
    action: ACCEPT
    reason: The UniProt HAMAP-based entry explicitly records Mg2+ as the cofactor for Q88FB2, with one Mg2+ ion bound per beta subunit.
    supported_by:
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      supporting_text: 'DR   GO; GO:0000287; F:magnesium ion binding; IEA:UniProtKB-UniRule.'
