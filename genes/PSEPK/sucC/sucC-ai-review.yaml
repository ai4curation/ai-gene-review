taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: SucC is the beta subunit of the soluble cytosolic succinyl-CoA synthetase complex in Pseudomonas putida KT2440. With the SucD alpha subunit, it catalyzes the reversible Mg2+-dependent interconversion of succinyl-CoA and succinate in the tricarboxylic acid cycle (EC 6.2.1.5), coupling succinyl-CoA cleavage to ATP or GTP synthesis at the only substrate-level phosphorylation step of the cycle and running in reverse to supply succinyl-CoA for biosynthesis. SucC contributes nucleotide and succinate specificity through its ATP-grasp and dicarboxylate-binding domains, while SucD provides the CoA- and phosphate-binding sites.
