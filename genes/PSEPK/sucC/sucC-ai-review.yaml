- term:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the canonical molecular function of SucC/SucD - EC 6.2.1.5, the ADP-forming succinate-CoA ligase, mapped via RHEA:17661 and EC:6.2.1.5.
    action: ACCEPT
    reason: Core molecular function. The exact ADP-forming succinate-CoA ligase reaction is recorded in UniProt and supported by conserved bacterial SCS family/domain evidence; the OpenScientist report found no direct PP_4186 enzyme assay, so the assignment remains homology based.
    supported_by:
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      supporting_text: Reaction=succinate + ATP + CoA = succinyl-CoA + ADP + phosphate;
    - reference_id: file:PSEPK/sucC/sucC-deep-research-openscientist.md
      supporting_text: 'All catalytic, kinetic, and structural conclusions are transferred by homology from *E. coli*, *T. aquaticus*, and mammalian SCS. There is no published crystal structure, purified-enzyme kinetics, or Km/kcat measurement specifically for Q88FB2.'
- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: Bacterial succinyl-CoA synthetases, including this enzyme, can use GTP/GDP in addition to ATP/ADP; UniProt annotates the GDP-forming reaction (RHEA:22120) alongside the ADP-forming one.
    action: ACCEPT
    reason: The UniProt entry also records the GTP/GDP reaction for Q88FB2 by Rhea/HAMAP transfer. Retain this activity while noting that the precise ADP-versus-GDP preference has not been directly measured for the P. putida KT2440 enzyme.
    supported_by:
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      supporting_text: Reaction=GTP + succinate + CoA = succinyl-CoA + GDP + phosphate;
    - reference_id: file:PSEPK/sucC/sucC-deep-research-openscientist.md
      supporting_text: The "[ADP-forming]" annotation follows HAMAP-Rule MF_00558 and the *E. coli* precedent.
