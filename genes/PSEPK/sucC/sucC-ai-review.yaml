  review:
    summary: This is the canonical molecular function of SucC/SucD - EC 6.2.1.5, the ADP-forming succinate-CoA ligase, mapped via RHEA:17661 and EC:6.2.1.5.
    action: ACCEPT
    reason: Core molecular function. The exact ADP-forming succinate-CoA ligase reaction is recorded in UniProt and supported by conserved bacterial SCS family/domain evidence; the OpenScientist report found no direct PP_4186 enzyme assay, so the assignment remains homology based.
    supported_by:
    - reference_id: file:PSEPK/sucC/sucC-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=succinate + ATP + CoA = succinyl-CoA + ADP + phosphate;
