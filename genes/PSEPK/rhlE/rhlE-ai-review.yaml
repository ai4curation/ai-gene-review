id: Q88D48
gene_symbol: rhlE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RhlE is a cytosolic DEAD-box RNA helicase that couples RNA-dependent ATP hydrolysis to unwinding
  of double-stranded RNA and contributes to ribosome assembly. RhlE orthologs can participate in RNase
  E-centered RNA-degradation complexes, but direct recruitment of this Pseudomonas putida protein into
  such a complex has not been demonstrated.
