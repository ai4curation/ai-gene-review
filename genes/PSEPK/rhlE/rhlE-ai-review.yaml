suggested_questions:
- question: Does KT2440 RhlE bind RNase E or RNase R under cold or structured-RNA stress conditions?
  experts: []
suggested_experiments:
- description: >-
    Perform reciprocal affinity purification of native RhlE, RNase E, and RNase
    R across growth temperatures, followed by RNA-decay profiling after rhlE
    perturbation.
