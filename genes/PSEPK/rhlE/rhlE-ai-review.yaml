    bacterium Pseudomonas syringae Lz4W.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Same-genus evidence directly identifies an RhlE ortholog in an active RNase E-RNase
      R complex, but does not establish complex membership for the P. putida protein.
  findings:
  - supporting_text: Additionally, the DEAD-box helicase RhlE was identified as part of this protein complex.
  - supporting_text: Fractions comprising the three proteins showed RNase E and RNase R activity and efficiently
      degraded a synthetic stem-loop containing RNA in the presence of ATP.
