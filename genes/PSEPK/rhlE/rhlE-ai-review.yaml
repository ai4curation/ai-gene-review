core_functions:
- description: >-
    Couples RNA-dependent ATP hydrolysis to unwinding of double-stranded RNA
    during ribosome assembly. Its possible use as an alternative helicase in a
    KT2440 RNA-degradation complex remains a pathway-level hypothesis rather
    than an established target-specific function.
  molecular_function:
    id: GO:0003724
    label: RNA helicase activity
