  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GshA is the ATP-dependent glutamate--cysteine ligase that catalyzes the first
  committed reaction of glutathione biosynthesis. It joins L-glutamate and
  L-cysteine to form gamma-L-glutamyl-L-cysteine, which is converted to
  glutathione by GshB.
