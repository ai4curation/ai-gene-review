id: Q88QE6
gene_symbol: ubiX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiX (PP_0548) encodes a flavin prenyltransferase of the UbiX/PAD1 family (EC 2.5.1.129).
  This metal-independent enzyme links the dimethylallyl group of dimethylallyl monophosphate
  to the N5 and C6 atoms of reduced FMN, forming prenylated FMN (prFMN). prFMN is the
  cofactor of UbiD-family decarboxylases, so UbiX is needed for the UbiD
  (PP_5213) decarboxylation of 3-polyprenyl-4-hydroxybenzoate in ubiquinone biosynthesis,
  although UbiX itself catalyses no decarboxylation. Function is inferred from the
  UbiX/PAD1 family and from characterized Escherichia coli UbiX; the KT2440 protein has not
  been assayed.
