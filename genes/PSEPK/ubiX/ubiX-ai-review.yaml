  title: UbiX is a flavin prenyltransferase required for bacterial ubiquinone biosynthesis.
  findings:
  - statement: E. coli UbiX prenylates FMN with dimethylallyl monophosphate, producing the
      cofactor required by UbiD; UbiX itself has no decarboxylase activity.
    supporting_text: UbiX acts as a flavin prenyltransferase, linking a dimethylallyl moiety
      to the flavin N5 and C6 atoms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Defining biochemistry for the UbiX family; experiments on
      E. coli and other homologs, not on PP_0548.
- id: PMID:17889824
  title: The role of UbiX in Escherichia coli coenzyme Q biosynthesis.
  findings:
  - statement: An E. coli ubiX deletion makes very little coenzyme Q and accumulates the UbiD
      substrate 4-hydroxy-3-octaprenylbenzoate.
    supporting_text: Our results suggest that both UbiX and UbiD are required for the decarboxylation
      of 4-hydroxy-3-octaprenyl-benzoate in E. coli coenzyme Q biosynthesis, especially during
      logarithmic growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; genetic evidence for the pathway role of UbiX.
