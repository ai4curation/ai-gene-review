suggested_questions:
- question: >-
    Is PP_0548 the only prFMN supplier in KT2440, and which other UbiD-family decarboxylases
    in the strain depend on it?
suggested_experiments:
- description: >-
    Reconstitute PP_0548 with reduced FMN and dimethylallyl monophosphate, confirm prFMN by
    LC-MS, and test whether the product activates purified PP_5213 UbiD; delete PP_0548 and
    look for accumulation of 3-nonaprenyl-4-hydroxybenzoate.
