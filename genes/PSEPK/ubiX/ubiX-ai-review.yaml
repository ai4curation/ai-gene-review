- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002458738
  review:
    summary: >-
      TreeGrafter carboxy-lyase activity. Wrong: UbiX makes the cofactor of the decarboxylase
      UbiD and has no decarboxylase activity itself.
    action: REMOVE
    reason: >-
      The UbiX/PAD family was long assumed to be the decarboxylase because ubiX and ubiD
      mutants share a phenotype, but purified UbiX shows no decarboxylase activity; it
      prenylates FMN, and UbiD performs the decarboxylation. The current PTHR43374 PAINT
      annotations carry flavin prenyltransferase activity (GO:0106141) at PTN000764671 and no
      carboxy-lyase term, so this TreeGrafter row reflects a stale or mis-propagated
      assignment that conflates cofactor supply with the UbiD reaction.
    supported_by:
    - reference_id: PMID:26083743
      supporting_text: Despite structural and biochemical characterization of UbiX as a flavin
        mononucleotide (FMN)-binding protein, no decarboxylase activity has been detected.
    - reference_id: PMID:26083743
      supporting_text: Here we report that UbiX produces a novel flavin-derived cofactor required
        for the decarboxylase activity of UbiD.
- term:
    id: GO:0106141
    label: flavin prenyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:37743
  - EC:2.5.1.129
  review:
    summary: >-
      Core molecular function: dimethylallyl phosphate + FMNH2 = prenylated FMNH2 +
      phosphate (RHEA:37743), the GO:0106141 definition.
    action: ACCEPT
    reason: >-
      Q88QE6 is a HAMAP MF_01984 UbiX/PAD1-family member with the HAMAP FMN-binding positions.
      E. coli UbiX was shown biochemically and crystallographically to prenylate FMN, and the
      PAINT IBD for GO:0106141 at PTN000764671 is seeded by E. coli UbiX and P. aeruginosa
      UbiX (Q9HX08), a close Pseudomonas relative. Not assayed for PP_0548.
    supported_by:
    - reference_id: file:PSEPK/ubiX/ubiX-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The prenyltransferase is metal-independent and links a dimethylallyl
        moiety from dimethylallyl monophosphate (DMAP) to the flavin N5 and C6 atoms of FMN.
    - reference_id: PMID:26083743
      supporting_text: UbiX acts as a flavin prenyltransferase, linking a dimethylallyl moiety
        to the flavin N5 and C6 atoms.
- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:26083743
  qualifier: involved_in
  review:
    summary: >-
      Proposed: UbiX supplies the prFMN cofactor without which the UbiD decarboxylation step
      of ubiquinone biosynthesis cannot occur.
    action: NEW
    reason: >-
      Participation test: UbiX does not convert a ring intermediate, but it contributes the
      cofactor that the UbiD step depends on (the cofactor case in the project guidelines),
      and E. coli ubiX deletion strains make very little ubiquinone and accumulate the UbiD
      substrate. Comparator check: E. coli UbiX (P0AG03) carries GO:0006744 and is the seed of
      the PTHR43374 PAINT IBD for GO:0006744 at PTN000764671, which covers PP_0548. KT2440 has
      no IBA rows in GOA, so the term is absent only for that reason. The term is not an
      ancestor or descendant of the MF rows.
    supported_by:
    - reference_id: PMID:17889824
      supporting_text: LLI produces very low levels of Q, grows slowly on succinate as the
        sole carbon source, accumulates 4-hydroxy-3-octaprenyl-benzoate, and has reduced UbiG
        O-methyltransferase activity.
    - reference_id: PMID:26083743
      supporting_text: Here we report that UbiX produces a novel flavin-derived cofactor required
        for the decarboxylase activity of UbiD.
    - reference_id: file:PSEPK/ubiX/ubiX-uniprot.txt
