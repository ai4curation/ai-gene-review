id: Q88P32
gene_symbol: hexR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HexR is a metabolite-responsive RpiR-family transcription regulator of central carbon
  metabolism in Pseudomonas putida KT2440. Its N-terminal helix-turn-helix region binds operator
  DNA, while its C-terminal SIS domain is the proposed phosphosugar-sensing region. Its best-characterized
  activity is repression of the gapA (historically gap-1), edd-glk-gltR2-gltS and zwfA-pgl-eda transcription
  units. The Entner-Doudoroff intermediate 2-keto-3-deoxy-6-phosphogluconate (KDPG) relieves operator
  binding, coupling expression of glucose-catabolic enzymes to metabolic state. HexR is monomeric
  in solution and binds its operators with two protein molecules. It also influences broader carbon-source-dependent
  expression, including acetate-associated metabolic programs.
