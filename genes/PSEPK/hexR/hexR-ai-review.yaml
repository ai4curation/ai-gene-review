- id: PMID:18245293
  title: A set of activators and repressors control peripheral glucose pathways in Pseudomonas putida
    to yield a common central intermediate.
  findings:
  - statement: HexR controls glucokinase/glucose-6-phosphate dehydrogenase genes, the Entner-Doudoroff
      enzyme genes, and gap-1 in P. putida KT2440.
  - statement: Glucose is channeled to the central intermediate 6-phosphogluconate via convergent
      pathways regulated by the repressors HexR, GnuR, and PtxS and the activator GltR-2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus indexed primary full-text Methods and Results/Tables 3 and
      6 inspected. KT2440 is explicitly the experimental strain. Repression is supported by mutant
      and promoter-fusion experiments; no purified HexR binding assay is claimed from this paper.
- id: PMID:19506074
  title: 'Regulation of glucose metabolism in Pseudomonas: the phosphorylative branch and entner-doudoroff
    enzymes are regulated by a repressor containing a sugar isomerase domain.'
  findings:
  - statement: HexR is a monomer in solution but binds DNA as a dimer at a pseudopalindromic operator
      with consensus 5'-TTGTN(7-8)ACAA-3', recognizing P(edd), P(zwf), and P(gap-1) with nanomolar
      affinity.
  - statement: KDPG-dependent release of HexR from operator DNA is supported. The exact SIS-domain
      effector-recognition site and proposed residues are based on homology modeling, not direct
      structural determination; glucose, glucose-6-phosphate and 6-phosphogluconate did not cause
      operator dissociation in the reported assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and indexed primary full-text cloning, EMSA, footprinting, DNA-ITC
      and discussion sections inspected. KT2440 DNA was used to clone recombinant HexR. ITC concerns
      DNA binding, with Pzwf oligonucleotides; the SIS pocket is a model. A few full-text operon-order
      phrases appear inconsistent with the abstract and mapped gene organization, so promoter/locus
      identities are retained explicitly. Direct PMC opening challenged the browser and Europe PMC
      XML retrieval failed; the cached publication remains abstract-only.
