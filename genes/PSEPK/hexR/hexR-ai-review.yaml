proposed_new_terms: []
suggested_questions:
- question: Which acetate-associated targets in PMID:41260329 are directly activated by HexR, and
    which positive expression effects are indirect? The full text and supplementary target-level
    ChIP-exo/RNA-seq integration require inspection before expanding the direct-target set.
- question: What are the experimentally resolved structural determinants of KDPG recognition and
    its coupling to DNA release? The SIS-pocket and residue assignments in PMID:19506074 are homology-model
    hypotheses.
suggested_experiments:
- description: Determine a co-crystal or cryo-EM structure of HexR bound to operator DNA and to KDPG
    to define the allosteric mechanism linking effector binding to DNA release.
- description: After inspecting the integrated ChIP-exo/transcriptomic target assignments in PMID:41260329,
    test candidate acetate-associated activating relationships using native-promoter binding-site
    mutations, purified HexR binding assays, and expression measurements in wild-type, hexR-deletion
    and complemented strains across acetate, glucose, succinate and glycerol conditions. Distinguish
    direct activation from indirect network effects rather than repeating a generic regulon-discovery
    experiment.
