core_functions:
- description: Binds cis-regulatory operator DNA at the gapA, edd and zwfA transcription units and
    represses their transcription, controlling expression of glucose-catabolic enzymes. KDPG-dependent
    loss of operator binding couples this activity to metabolic state; the precise effector pocket
    remains inferred.
