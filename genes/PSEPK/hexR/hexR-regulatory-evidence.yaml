pathway_context:
- name: Regulation of glucose metabolism
  relationship: regulates
  mechanism: HexR represses transcription at Pedd, Pzwf and Pgap-1, coordinating the phosphorylative and
    Entner-Doudoroff routes. This is the experimentally supported regulatory step; HexR does not catalyze
    glucose breakdown. The 2026 acetate-associated expanded regulon remains a separate full-text follow-up.
  evidence: *id001
