regulator:
  accession: Q88P32
  locus: PP_1021
  taxon: NCBITaxon:160488
relationships:
- id: PSEPK-hexR-Pedd-repression
  target:
    name: Pedd (edd-glk-gltR2-gltS transcription unit)
    locus: PP_1010
    type: promoter
  effect: represses
  directness: direct
  experimental_strain: Pseudomonas putida KT2440; recombinant KT2440 HexR produced in Escherichia coli
    BL21(DE3) for in-vitro binding assays
  condition: Repression under noninducing citrate-growth conditions; glucose induction in cellular assays.
    Purified HexR binds operator DNA without KDPG, and KDPG releases the complex in vitro.
  evidence: &id001
  - reference_id: PMID:18245293
    assay: KT2440 hexR-mutant transcript comparison; Pedd and Pzwf lacZ promoter fusions (gap-1 supported
      by transcript comparison)
    supporting_text: Expression of the three pathways is mediated by three transcriptional repressors,
      HexR, GnuR, and PtxS
  - reference_id: PMID:19506074
    assay: Purified-protein EMSA and DNase I footprinting; Pzwf DNA-binding ITC
    supporting_text: HexR recognizes the P(edd), P(zwf), and P(gap-1) promoters
  interpretation: Promoter binding combined with the gene-specific repression phenotype supports a direct
    repressive relationship. The locus identifies the promoter-associated first gene, not a distinct binding
    site in every downstream gene.
  limitations:
  - No genomic promoter coordinates are transferred across assembly versions.
  - The direct edge combines functional and binding experiments; the primary 2009 ITC assay should not
    be generalized to every promoter.
  - The 2026 expanded regulon has not been extracted at target level because full text/supplement tables
    were unavailable.
