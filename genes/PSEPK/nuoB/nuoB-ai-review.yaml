          on subunit NuoB.
      - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
        supporting_text: Every one of the seven conserved catalytic core subunits has
          a clean 1:1 bacterial ortholog in the KT2440 candidate list
  - description: Binds the [4Fe-4S] cluster N2 via four conserved cysteines.
    molecular_function:
