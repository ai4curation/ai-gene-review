id: Q88FH6
gene_symbol: nuoB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoB (PP_4120) is the complex I 20 kDa-family (PSST/NDUFS7-type) iron-sulfur
  subunit of the proton-pumping NADH:quinone oxidoreductase (NDH-1, respiratory
  complex I). It is a peripheral subunit on the cytoplasmic side of the inner
  membrane, in the quinone-reducing connecting module, and binds the single
  [4Fe-4S] cluster N2 that is the terminal centre of the intramolecular
  electron-transfer chain and donates electrons to the quinone bound at the
  NuoB/NuoCD interface. Through this role it contributes to the energy-conserving
  NADH:quinone oxidoreduction coupled to proton translocation across the
  cytoplasmic membrane.
existing_annotations:
  - term:
      id: GO:0005506
      label: iron ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: The iron of NuoB is held in a [4Fe-4S] cluster, not as a free iron ion.
      action: MODIFY
      reason: >-
        The UniRule-derived iron ion binding term is a coarse rendering of the
        HAMAP cofactor statement (one [4Fe-4S] cluster, four conserved Cys
        ligands). Cluster-bound iron is represented in GO by the iron-sulfur
        cluster binding branch; the specific term GO:0051539, already carried by
        this gene, is the right replacement. The orthologous E. coli NuoB
        cysteines were shown to ligate cluster N2.
      proposed_replacement_terms:
        - id: GO:0051539
          label: 4 iron, 4 sulfur cluster binding
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Binds 1 [4Fe-4S] cluster.
        - reference_id: PMID:12975362
          supporting_text: From this we conclude that the Fe/S cluster N2 is located
            on subunit NuoB.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: NuoB is a peripheral subunit of the inner-membrane complex I.
      action: ACCEPT
      reason: >-
        HAMAP MF_01356 places NuoB at the cell inner membrane as a peripheral
        protein on the cytoplasmic side; for a Gram-negative bacterium the inner
        membrane is GO plasma membrane. Consistent with the E. coli ortholog,
        purified from cytoplasmic membranes (PMID:7607227).
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: NDH-1 is composed of 13 different subunits. Subunits NuoB,
            CD, E, F, and G constitute the peripheral sector of the complex.
        - reference_id: PMID:7607227
          supporting_text: The second, amphipathic, fragment, which is presumed to
            connect the NADH dehydrogenase fragment with the membrane, contains four
            subunits and at least one EPR-detectable iron-sulfur cluster whose
            spectral properties are reminiscent of the eucaryotic cluster N2.
  - term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Complex-level proton-pumping NADH:ubiquinone oxidoreductase activity.
      action: ACCEPT
      reason: >-
        This is the correct activity of the NDH-1 complex of which NuoB is an
        obligate subunit (HAMAP function statement; E. coli NuoB Cys mutants lose
        complex I activity). NuoB does not catalyse the reaction alone: the core
        function records the activity with contributes_to. A change of relation
        is not expressible as a term replacement, so the term is accepted here
        rather than MODIFYed to itself. HAMAP notes ubiquinone as the probable
        acceptor in this species.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: NDH-1 shuttles electrons from NADH, via FMN and iron-sulfur
            (Fe-S) centers, to quinones in the respiratory chain. The immediate
            electron acceptor for the enzyme in this species is believed to be
            ubiquinone.
        - reference_id: PMID:12975362
          supporting_text: Individual mutation of all four conserved cysteine
            residues in NuoB resulted in a loss of complex I activity
  - term:
      id: GO:0009060
      label: aerobic respiration
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Complex I feeds electrons into the aerobic respiratory chain.
      action: KEEP_AS_NON_CORE
      reason: >-
        True physiological context for the obligately aerobic P. putida, but
        broad; the subunit's direct process is electron transport coupled proton
        transport (core). In E. coli, nuo mutants are defective in aerobic growth
        on acetate.
      supported_by:
        - reference_id: PMID:9495756
          supporting_text: a mutation in any one of the nuo genes tested causes a
            complex I deficiency as measured by the inability of the mutant cells (i)
            to form a inner, aspartate ring on chemotaxis swarm plates, (ii) to grow
            rapidly in TB beyond mid-exponential phase, (iii) to use acetate
            effectively as a sole carbon source
  - term:
      id: GO:0015990
      label: electron transport coupled proton transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: NDH-1 couples NADH:quinone electron transfer to proton translocation.
      action: ACCEPT
      reason: >-
        HAMAP states the coupling of the redox reaction to proton translocation,
        and conserved acidic residues of the E. coli ortholog near cluster N2 are
        implicated in redox-linked protonation. Core process.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Couples the redox reaction to proton translocation (for
            every two electrons transferred, four hydrogen ions are translocated
            across the cytoplasmic membrane), and thus conserves the redox energy
            in a proton gradient.
        - reference_id: PMID:16807239
          supporting_text: We discuss the possible participation of Glu(67) in a
            proton pathway coupled with the redox reaction of N2.
  - term:
      id: GO:0045271
      label: respiratory chain complex I
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: part_of
    review:
      summary: NuoB is a subunit of NDH-1 (complex I).
      action: ACCEPT
      reason: >-
        HAMAP subunit statement and family membership (complex I 20 kDa subunit
        family, TIGR01957 nuoB_fam); PP_4120 lies in the KT2440 nuo operon.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: NDH-1 is composed of 13 different subunits. Subunits NuoB,
            CD, E, F, and G constitute the peripheral sector of the complex.
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Belongs to the complex I 20 kDa subunit family.
  - term:
      id: GO:0048038
      label: quinone binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NuoB lines the quinone-binding cavity together with NuoCD.
      action: KEEP_AS_NON_CORE
      reason: >-
        In E. coli complex I structures the quinone site is formed at the end of a
        crevice between NuoD and NuoB, next to N2; most head-group contacts come
        from the NuoD part of NuoCD. True for NuoB by orthology, but secondary to
        its electron-transfer role.
      supported_by:
        - reference_id: PMID:34308841
          supporting_text: The Q-binding site in complex I is formed at the end of a
            crevice between NuoD and NuoB subunits
  - term:
      id: GO:0050136
      label: NADH dehydrogenase (quinone) (non-electrogenic) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Non-electrogenic NADH:quinone reductase is the NDH-2 reaction, not NDH-1.
      action: REMOVE
      reason: >-
        GO:0050136 describes NADH:quinone reduction without proton translocation,
        the reaction of type II NADH dehydrogenases. NuoB belongs to the
        proton-pumping NDH-1, whose reaction is GO:0008137 (accepted). The
        electronic mapping is demonstrably wrong for Nuo subunits.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Couples the redox reaction to proton translocation (for
            every two electrons transferred, four hydrogen ions are translocated
            across the cytoplasmic membrane), and thus conserves the redox energy
            in a proton gradient.
        - reference_id: PMID:3122832
          supporting_text: an enzyme (NADH dh I) that reacts with deamino-NADH or NADH
            whose turnover leads to generation of a H+ electrochemical gradient at a
            site between the primary dehydrogenase and ubiquinone
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NuoB binds a single [4Fe-4S] cluster.
      action: MODIFY
      reason: >-
        Correct but general; the specific child GO:0051539, already carried by
        this gene, is supported by HAMAP and by the E. coli ortholog.
      proposed_replacement_terms:
        - id: GO:0051539
          label: 4 iron, 4 sulfur cluster binding
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Binds 1 [4Fe-4S] cluster.
  - term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NuoB binds the [4Fe-4S] cluster N2.
      action: ACCEPT
      reason: >-
        HAMAP cofactor annotation with four conserved Cys ligands; the orthologous
        E. coli residues were shown by mutagenesis/EPR to ligate cluster N2.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: Binds 1 [4Fe-4S] cluster.
        - reference_id: PMID:12975362
          supporting_text: Individual mutation of all four conserved cysteine
            residues in NuoB resulted in a loss of complex I activity and of the EPR
            signal of N2 in the cytoplasmic membrane as well as in the isolated
            complex.
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: ISS
    original_reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
    qualifier: enables
    review:
      summary: NuoB's cluster N2 is the terminal electron carrier of complex I.
      action: NEW
      reason: >-
        Transferred from E. coli NuoB (P0AFC7, same PANTHER subfamily
        PTHR11995:SF14 and HAMAP MF_01356), where cluster N2 is ligated by NuoB
        and is reduced by NADH-derived electrons within ~90 microseconds. Electron
        transfer through N2 is the subunit's own molecular activity within the
        complex and the module leaf function for NuoB.
      supported_by:
        - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
          supporting_text: NDH-1 shuttles electrons from NADH, via FMN and iron-sulfur
            (Fe-S) centers, to quinones in the respiratory chain.
        - reference_id: PMID:18316732
          supporting_text: two electrons move via the FMN cofactor to the
            iron-sulfur (Fe/S) centers N1a and N2 with an apparent time constant of
            approximately 90 mus
