suggested_questions:
  - question: >-
      Has the contribution of P. putida KT2440 nuoB to complex I assembly,
      activity, or proton-coupling efficiency been tested directly, and does
      KT2440 complex I reduce ubiquinone-9 in vivo?
suggested_experiments:
  - description: >-
      Construct a clean nuoB deletion or conditional depletion strain and measure
      membrane-associated piericidin-sensitive NADH:quinone oxidoreductase
      activity, N2 EPR signal, respiratory growth, and proton-motive-force
      generation.
    experiment_type: gene deletion with biochemical phenotyping
