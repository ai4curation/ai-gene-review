      Carries the terminal [4Fe-4S] cluster N2 of the complex I electron-transfer
      chain and passes electrons to quinone, contributing to proton-pumping
      NADH:ubiquinone oxidoreduction by plasma-membrane NDH-1.
    molecular_function:
      id: GO:0009055
      label: electron transfer activity
    contributes_to_molecular_function:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    directly_involved_in:
      - id: GO:0015990
        label: electron transport coupled proton transport
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0045271
      label: respiratory chain complex I
    supported_by:
      - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
        supporting_text: Binds 1 [4Fe-4S] cluster.
      - reference_id: PMID:12975362
