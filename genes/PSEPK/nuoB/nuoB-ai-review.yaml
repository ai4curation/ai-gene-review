  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'Nuob is the terminal iron-sulfur subunit adjacent to the quinone-reduction site of the proton-translocating respiratory complex I (NDH-1) in Pseudomonas putida KT2440. It is encoded in the single contiguous nuoA-N locus PP_4119-PP_4131. The assembled complex oxidizes NADH, reduces the quinone pool, and couples electron transfer to proton translocation across the bacterial plasma membrane.'
