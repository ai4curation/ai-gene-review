core_functions:
- description: Transfers a non-amino-acyl 3-hydroxyacyl group between CoA and ACP and supplies precursors
    for medium-chain-length PHA synthesis. Reverse transfer was measured with purified recombinant PhaG;
    the forward ACP-to-CoA model is favored by heterologous product-sink controls, without claiming directly
    measured native forward kinetics.
  molecular_function:
