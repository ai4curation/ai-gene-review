  review:
    summary: PhaG should be connected to poly(3-hydroxyalkanoate) biosynthesis. It acts on ACP-bound de novo fatty-acid-synthesis intermediates and is the originally described "metabolic link" between fatty acid de novo synthesis and PHA accumulation, although the precise route to the CoA-activated PhaC substrate remains unresolved. Deletion reduces but does not abolish PHA, so this involvement is genuine but contributory.
    action: NEW
    reason: Complementation in KT2440 directly linked phaG to PHA synthesis from gluconate, while the reviewed UniProt entry independently places PhaG in polyhydroxyalkanoate biosynthesis. PhaG is contributory rather than indispensable because alternative monomer-supply routes remain available.
