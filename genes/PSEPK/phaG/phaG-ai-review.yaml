suggested_questions:
- question: Is PhaG active on additional 3-hydroxyacyl chain lengths in KT2440, or is 3-hydroxydecanoyl the physiologically dominant donor?
- question: What is the dominant in vivo activity of KT2440 PhaG — direct ACP:CoA transacylation or thioesterase-mediated release of free 3-hydroxy fatty acids followed by acyl-CoA ligase (e.g., AlkK/PP_0763) activation — and does this differ between native KT2440 and heterologous hosts?
suggested_experiments:
- description: Measure purified PhaG activity with a panel of 3-hydroxyacyl-ACP and 3-hydroxyacyl-CoA donors/acceptors to resolve directionality and chain-length specificity, and compare PHA monomer composition in a phaG knockout versus wild-type KT2440.
  experiment_type: enzyme substrate panel and PHA composition assay
- description: Reconstruct the FAS-to-PHA route in a thioesterase-minimized E. coli background with and without an acyl-CoA ligase to discriminate the transacylase versus thioesterase+ligase models for PhaG in vivo.
  experiment_type: heterologous pathway reconstruction with controlled thioesterase/ligase background
