  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: phaG encodes a PhaG-family acyltransferase that connects de novo fatty-acid synthesis to medium-chain-length polyhydroxyalkanoate (mcl-PHA) biosynthesis by routing ACP-bound (R)-3-hydroxyacyl intermediates toward PHA monomer supply. Purified PhaG transfers a 3-hydroxydecanoyl group between CoA and ACP in vitro, but the directionality and exact in vivo mechanism (direct ACP:CoA transacylation versus thioester hydrolysis coupled to an acyl-CoA ligase) remain debated. Deletion genetics in KT2440 show that PhaG is a contributory but non-essential, partially redundant node in monomer supply.
