id: Q88IT1
gene_symbol: treSA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TreSA (PP_2918) is a standalone glycoside-hydrolase-family TreS enzyme that
  reversibly interconverts D-maltose and alpha,alpha-trehalose. Recombinant
  KT2440 TreS has been shown to form trehalose from maltose in vitro; the
  physiological direction and contribution of PP_2918 in native KT2440 cells
  remain unresolved.
existing_annotations:
- term:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      TreSA catalyzes the reversible EC 5.4.99.16 interconversion of maltose
      and alpha,alpha-trehalose.
    action: ACCEPT
    reason: >-
      Q88IT1 is assigned EC 5.4.99.16 and the TreS-specific InterPro family.
      Recombinant TreS cloned from P. putida KT2440 converted maltose to
      trehalose by HPLC, directly supporting the annotated molecular function.
      The PubMed abstract does not name PP_2918, but the N-terminal cloning
      primer reported in the companion full article encodes the exact Q88IT1
      N terminus. The abstract's reported 67-kDa mass conflicts with the
      companion article's approximately 76-kDa value and matches neither
      KT2440 candidate; this identity limitation is documented in treSA-notes.md.
    supported_by:
    - reference_id: file:PSEPK/treSA/treSA-uniprot.txt
      supporting_text: 'EC=5.4.99.16'
    - reference_id: file:PSEPK/treSA/treSA-uniprot.txt
      supporting_text: 'DR   InterPro; IPR012665; Trehalose_synth.'
    - reference_id: PMID:25204684
      supporting_text: >-
        High-pressure liquid chromatography results indicated that this enzyme
        had the ability to catalyze 59% maltose into trehalose, with about 5.1%
        glucose as by-product.
references:
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: file:PSEPK/treSA/treSA-uniprot.txt
  title: UniProtKB entry Q88IT1 for Pseudomonas putida KT2440 treSA
  findings:
  - statement: The exact record assigns the submitted Trehalose synthase A name and EC 5.4.99.16.
    supporting_text: 'SubName: Full=Trehalose synthase A'
    reference_section_type: RESULTS
  - statement: Q88IT1 belongs to the TreS-specific InterPro family.
    supporting_text: 'DR   InterPro; IPR012665; Trehalose_synth.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The accession, locus, submitted name, EC assignment, and InterPro family
      were checked directly. The record itself remains unreviewed and PE 4.
- id: PMID:25204684
  title: Cloning and expression of a trehalose synthase from Pseudomonas putida KT2440 for the scale-up production of trehalose from maltose.
  full_text_unavailable: true
  findings:
  - statement: Recombinant P. putida KT2440 TreS converted maltose to trehalose.
    supporting_text: >-
      High-pressure liquid chromatography results indicated that this enzyme
      had the ability to catalyze 59% maltose into trehalose, with about 5.1%
      glucose as by-product.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked. The abstract establishes an
      assayed KT2440 TreS but omits the locus and reports a 67-kDa enzyme,
      whereas the companion article reports approximately 76 kDa and Q88IT1 is
      predicted to be 75.6 kDa. Because the mass reports conflict, the locus
      assignment remains supported principally by the companion article's
      exact N-terminal primer match and cannot be verified from this PMID alone.
core_functions:
- description: >-
    Reversibly interconverts D-maltose and alpha,alpha-trehalose; the
    trehalose-forming direction provides a one-enzyme route from maltose.
  molecular_function:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  supported_by:
  - reference_id: file:PSEPK/treSA/treSA-uniprot.txt
    supporting_text: 'EC=5.4.99.16'
  - reference_id: PMID:25204684
    supporting_text: >-
      High-pressure liquid chromatography results indicated that this enzyme
      had the ability to catalyze 59% maltose into trehalose, with about 5.1%
      glucose as by-product.
  knowledge_gaps:
  - gap_statement: >-
      The physiological direction and quantitative contribution of TreSA in
      native KT2440 trehalose metabolism have not been established.
    significance: >-
      The recombinant assay proves catalytic capacity but does not show whether
      PP_2918 makes or consumes trehalose under a particular growth or stress condition.
suggested_questions:
- question: >-
    Under which carbon-source or osmotic-stress conditions does native KT2440
    route flux through TreSA rather than TreY-TreZ or TreSB?
suggested_experiments:
- description: >-
    Quantify maltose, trehalose, and alpha-glucan in wild type and single and
    combined treSA, treY-treZ, and treSB mutants across carbon and osmotic-stress conditions.
