  label: Pseudomonas putida KT2440
description: AceF (PP_0338) is the lipoylated E2 dihydrolipoyllysine-residue acetyltransferase of the
  pyruvate dehydrogenase complex of Pseudomonas putida KT2440. Its two lipoyl domains carry the acetyl
  group generated by AceE to the C-terminal acetyltransferase domain, which transfers it to coenzyme A
  to form acetyl-CoA; the catalytic domains assemble into the multimeric core that binds the E1 and E3
  components. The assignment rests on the PDH-specific E2 signatures and on characterised orthologues
  such as Escherichia coli AceF.
