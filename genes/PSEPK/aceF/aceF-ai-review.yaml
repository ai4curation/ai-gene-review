suggested_questions:
- question: Are both KT2440 AceF lipoyl domains lipoylated under PDH-active growth conditions, and do they contribute equivalently to substrate channeling?
suggested_experiments:
- description: Mutate each AceF lipoyl-lysine singly and in combination, then measure lipoylation occupancy and AceE/AceF/LpdG complex activity to test the contribution of each swinging arm.
  experiment_type: cofactor-site mutagenesis
