taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AceF is the lipoylated E2 acetyltransferase component of the cytosolic pyruvate dehydrogenase complex in Pseudomonas putida KT2440. It forms the multimeric PDH core, tethers the AceE E1 and LpdG E3 components, and transfers the E1-generated acetyl group from its lipoyl arm to coenzyme A to form acetyl-CoA.
