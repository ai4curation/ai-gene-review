id: Q88IC5
gene_symbol: bhbP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BhbP is an unreviewed, predicted multi-pass inner-membrane permease. Its
  submitter-supplied D-3-hydroxybutyrate permease name and linkage to hbdH and
  aacs make uptake of this monocarboxylate the leading hypothesis, but direct
  substrate-transport evidence for Q88IC5 is not available.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A plasma-membrane location is consistent with the predicted multi-pass permease.
      action: ACCEPT
      reason: Seven Phobius-predicted transmembrane segments support membrane localization.
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: KW   Membrane {ECO:0000256|SAM:Phobius};
  - term:
      id: GO:0015128
      label: gluconate transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family-level gluconate call is too substrate-specific for BhbP.
      action: MODIFY
      reason: >-
        The gluconate call is an automated mapping from the broad Gnt-family
        InterPro entry, whereas the unreviewed Q88IC5 record carries a
        submitter-supplied D-3-hydroxybutyrate permease name. The broader monocarboxylate
        transporter term captures the supported transport class without
        asserting gluconate as the physiological substrate.
      proposed_replacement_terms:
        - id: GO:0008028
          label: monocarboxylic acid transmembrane transporter activity
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but less informative than the plasma-membrane annotation.
      action: KEEP_AS_NON_CORE
      reason: The generic membrane term is redundant with the more precise plasma membrane call.
  - term:
      id: GO:0035429
      label: gluconate transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The inferred process should be generalized from gluconate to monocarboxylate transport.
      action: MODIFY
      reason: >-
        The gluconate process is inherited from the same family-level InterPro
        mapping. The submitter-supplied D-3-hydroxybutyrate permease name is not
        direct substrate evidence. A broader carboxylic-acid transmembrane
        transport term preserves membrane translocation without retaining the
        unsupported gluconate specificity.
      proposed_replacement_terms:
        - id: GO:1905039
          label: carboxylic acid transmembrane transport
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/bhbP/bhbP-uniprot.txt
    title: UniProtKB entry for PSEPK bhbP
    findings:
      - statement: Q88IC5 is assigned as a D-beta-hydroxybutyrate permease.
core_functions:
  - description: >-
      Imports D-3-hydroxybutyrate across the bacterial plasma membrane for
      subsequent oxidation and CoA activation.
    molecular_function:
      id: GO:0008028
      label: monocarboxylic acid transmembrane transporter activity
    locations:
      - id: GO:0005886
        label: plasma membrane
    supported_by:
      - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
        supporting_text: D-beta-hydroxybutyrate permease
proposed_new_terms: []
suggested_questions:
  - question: Does Q88IC5 transport D-3-hydroxybutyrate directly, and does it also accept gluconate?
suggested_experiments:
  - description: >-
      Measure radiolabeled or LC-MS-based D-3-hydroxybutyrate uptake in wild
      type, bhbP deletion, and complemented KT2440 cells, with gluconate as a
      competition substrate.
    experiment_type: substrate uptake assay
