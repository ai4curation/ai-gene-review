id: Q88IC5
gene_symbol: bhbP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  BhbP (PP_3074) is a predicted multi-pass inner-membrane secondary permease of
  the Gnt (gluconate:H+ symporter) family in Pseudomonas putida KT2440. It is
  encoded next to the D-3-hydroxybutyrate dehydrogenase hbdH and the
  acetoacetyl-CoA synthetase aacs, an arrangement that matches the
  (R)-3-hydroxybutyrate-inducible transporter-bdhA operon conserved among
  Pseudomonas species, so uptake of D-3-hydroxybutyrate for catabolism is its
  most likely role. Direct transport assays on the KT2440 protein have not been
  reported.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A plasma-membrane location is consistent with the predicted multi-pass permease.
      action: ACCEPT
      reason: >-
        Phobius predicts seven helical transmembrane segments (FT TRANSMEM
        29..52, 59..78, 98..127, 177..198, 232..252, 280..303, 439..459), and
        the protein belongs to the Gnt-family gluconate-transporter permeases
        (InterPro IPR003474; PANTHER PTHR30354), which are alpha-helical
        inner-membrane secondary transporters. In a Gram-negative bacterium,
        alpha-helical multi-pass permeases of this family reside in the
        cytoplasmic (plasma) membrane, not the beta-barrel outer membrane.
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        29..52"
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        439..459"
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR003474; Glcn_transporter."
  - term:
      id: GO:0015128
      label: gluconate transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family-level gluconate call is too substrate-specific for BhbP.
      action: MODIFY
      reason: >-
        The gluconate call is an automated InterPro2GO mapping from the
        family-wide Gnt-transporter signature IPR003474, but the family is not
        substrate-uniform: PANTHER PTHR30354 also contains the D-serine
        transporter DsdX, the L-idonate transporter IdnT and the citrate
        transporters CitM/CitN. Q88IC5 sits in subfamily SF7, apart from the
        gluconate-transporter subfamilies. Its genomic context mirrors the
        P. aeruginosa PA2004-bdhA operon, which is induced by and required
        for growth on (R)-3-hydroxybutyrate, so D-3-hydroxybutyrate is the
        more likely substrate. GO has no 3-hydroxybutyrate transporter term;
        the parent GO:0008028 (of which gluconate transporter activity is an
        is_a descendant) covers both hypotheses without asserting gluconate.
      proposed_replacement_terms:
        - id: GO:0008028
          label: monocarboxylic acid transmembrane transporter activity
      supported_by:
        - reference_id: PMID:26311173
          supporting_text: >-
            The bdhA ( PA2003 ) gene is actually part of a bicistronic operon
            that starts with PA2004 , encoding a putative transporter related
            to the H + gluconate symporter family
        - reference_id: PMID:26311173
          supporting_text: >-
            The assimilation of ( R )-3-HB as a main carbon source was
            dependent on the induction of the PA2004 - bdhA operon via
            RpoN-PA2005.
        - reference_id: file:interpro/panther/PTHR30354/PTHR30354-entries.csv
          supporting_text: P08555,D-serine transporter DsdX
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but less informative than the plasma-membrane annotation.
      action: MODIFY
      reason: >-
        The generic membrane term is true but too general. The seven predicted
        transmembrane helices and Gnt-family membership place the protein in
        the cytoplasmic (plasma) membrane, which this gene already carries as
        GO:0005886.
      proposed_replacement_terms:
        - id: GO:0005886
          label: plasma membrane
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        29..52"
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: "DR   InterPro; IPR003474; Glcn_transporter."
  - term:
      id: GO:0035429
      label: gluconate transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The inferred process should be generalized from gluconate to monocarboxylate transport.
      action: MODIFY
      reason: >-
        The gluconate process is inherited from the same family-level InterPro
        mapping, and the family is substrate-heterogeneous. The orthologous
        P. aeruginosa transporter-bdhA operon points to (R)-3-hydroxybutyrate
        rather than gluconate. A broader carboxylic-acid transmembrane
        transport term keeps the supported membrane translocation without the
        unsupported gluconate specificity.
      proposed_replacement_terms:
        - id: GO:1905039
          label: carboxylic acid transmembrane transport
      supported_by:
        - reference_id: PMID:26311173
          supporting_text: >-
            The bdhA ( PA2003 ) gene is actually part of a bicistronic operon
            that starts with PA2004 , encoding a putative transporter related
            to the H + gluconate symporter family
        - reference_id: PMID:26311173
          supporting_text: >-
            The assimilation of ( R )-3-HB as a main carbon source was
            dependent on the induction of the PA2004 - bdhA operon via
            RpoN-PA2005.
        - reference_id: file:interpro/panther/PTHR30354/PTHR30354-entries.csv
          supporting_text: P08555,D-serine transporter DsdX
