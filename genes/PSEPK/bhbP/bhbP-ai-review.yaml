id: Q88IC5
gene_symbol: bhbP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BhbP is a predicted inner-membrane permease for D-3-hydroxybutyrate uptake in
  Pseudomonas putida KT2440. It is encoded next to the HbdH dehydrogenase and
  Aacs acetoacetate-CoA ligase, placing transport upstream of oxidation and
  activation of this monocarboxylate carbon source.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A plasma-membrane location is consistent with the predicted multi-pass permease.
      action: ACCEPT
      reason: UniProt identifies BhbP as a membrane permease in the bacterial cell membrane.
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
  - term:
      id: GO:0015128
      label: gluconate transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family-level gluconate call is too substrate-specific for BhbP.
      action: MODIFY
      reason: >-
        The gluconate call is an automated mapping from the broad Gnt-family
        InterPro entry, whereas the exact Q88IC5 record identifies the product
        as a D-3-hydroxybutyrate permease. The broader monocarboxylate
        transporter term captures the supported transport class without
        asserting gluconate as the physiological substrate.
      proposed_replacement_terms:
        - id: GO:0008028
          label: monocarboxylic acid transmembrane transporter activity
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but less informative than the plasma-membrane annotation.
      action: KEEP_AS_NON_CORE
      reason: The generic membrane term is redundant with the more precise plasma membrane call.
  - term:
      id: GO:0035429
      label: gluconate transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The inferred process should be generalized from gluconate to monocarboxylate transport.
      action: MODIFY
      reason: >-
        The gluconate process is inherited from the same family-level InterPro
        mapping, while the exact Q88IC5 product assignment is a
        D-3-hydroxybutyrate permease. A broader monocarboxylate transport term
        preserves the supported process without retaining the wrong substrate.
      proposed_replacement_terms:
        - id: GO:0015718
          label: monocarboxylic acid transport
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
  - term:
      id: GO:0046952
      label: ketone body catabolic process
    evidence_type: ISS
    original_reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
    qualifier: involved_in
    review:
      summary: BhbP supplies D-3-hydroxybutyrate to the adjacent utilization enzymes.
      action: NEW
      reason: >-
        The substrate-specific permease assignment and conserved local linkage
        to hbdH and aacs support a pathway-level role in ketone-body uptake and
        utilization, while not establishing a narrower transport GO term.
      supported_by:
        - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
          supporting_text: D-beta-hydroxybutyrate permease
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/bhbP/bhbP-uniprot.txt
    title: UniProtKB entry for PSEPK bhbP
    findings:
      - statement: Q88IC5 is assigned as a D-beta-hydroxybutyrate permease.
core_functions:
  - description: >-
      Imports D-3-hydroxybutyrate across the bacterial plasma membrane for
      subsequent oxidation and CoA activation.
    molecular_function:
      id: GO:0008028
      label: monocarboxylic acid transmembrane transporter activity
    directly_involved_in:
      - id: GO:0046952
        label: ketone body catabolic process
    locations:
      - id: GO:0005886
        label: plasma membrane
    supported_by:
      - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
        supporting_text: D-beta-hydroxybutyrate permease
proposed_new_terms:
  - proposed_name: D-3-hydroxybutyrate transmembrane transporter activity
    proposed_definition: >-
      Enables the directed movement of D-3-hydroxybutyrate from one side of a
      membrane to the other.
    justification: >-
      Existing GO terms provide only broader monocarboxylate transport or the
      incorrect family-derived gluconate specificity.
suggested_questions:
  - question: Does Q88IC5 transport D-3-hydroxybutyrate directly, and does it also accept gluconate?
suggested_experiments:
  - description: >-
      Measure radiolabeled or LC-MS-based D-3-hydroxybutyrate uptake in wild
      type, bhbP deletion, and complemented KT2440 cells, with gluconate as a
      competition substrate.
    experiment_type: substrate uptake assay
