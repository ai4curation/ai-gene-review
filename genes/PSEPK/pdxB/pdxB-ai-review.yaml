id: Q88L20
gene_symbol: pdxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PdxB is an NAD-dependent erythronate-4-phosphate dehydrogenase (EC 1.1.1.290). It oxidizes
  4-phospho-D-erythronate to (R)-3-hydroxy-2-oxo-4-phosphooxybutanoate in the second reaction
  of the DXP-dependent bacterial pyridoxine 5'-phosphate pathway. The product is transaminated
  by SerC and ultimately combined with DXP to form the vitamin-B6 ring. Q88L20 (PP_2117) is
  a soluble, homodimeric D-isomer-specific 2-hydroxyacid dehydrogenase of the PdxB subfamily;
  its function is inferred from the characterized Escherichia coli enzyme and the crystallized
  Pseudomonas aeruginosa ortholog, not from direct study of the P. putida protein.
