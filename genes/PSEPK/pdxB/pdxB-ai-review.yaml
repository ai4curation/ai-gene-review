suggested_questions:
- question: >-
    Does P. putida PdxB, like the E. coli enzyme, require an alpha-keto acid to reoxidize
    its tightly bound NADH, and which one is used in vivo?
suggested_experiments:
- hypothesis: PP_2117 is required for de novo PLP synthesis in KT2440.
  description: >-
    Delete PP_2117 and test growth on minimal medium with and without pyridoxine; assay purified
    PP_2117 in a SerC/PdxA-coupled 4PE assay with 2-oxoglutarate.
