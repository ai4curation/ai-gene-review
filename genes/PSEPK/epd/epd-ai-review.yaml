id: Q88D63
gene_symbol: epd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Epd (PP_4964) is the predicted NAD-dependent, non-phosphorylating
  D-erythrose-4-phosphate dehydrogenase (EC 1.2.1.72) of Pseudomonas putida
  KT2440. It is expected to oxidize D-erythrose 4-phosphate to
  4-phospho-D-erythronate, the first reaction of the erythrose-4-phosphate
  branch of the DXP-dependent de novo pyridoxal 5'-phosphate pathway (Epd,
  PdxB, SerC, PdxA, PdxJ, PdxH), all of whose genes are present in the genome.
  It is a soluble glyceraldehyde-3-phosphate dehydrogenase-family protein of
  the Epd subfamily (NCBIfam TIGR01532; InterPro E4P_DH_bac). Function is
  inferred from the experimentally characterized Escherichia coli ortholog; the
  P. putida protein itself has not been studied directly.
