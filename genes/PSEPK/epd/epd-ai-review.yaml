  review:
    summary: Epd is a soluble cytoplasmic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88D63 has no signal peptide or transmembrane segment, and its
      characterized E. coli ortholog is a soluble cytoplasmic tetramer.
      Cytoplasm is as precise as the evidence on this protein allows (no
      cytosol row or direct localization exists for PP_4964), and the location
      is peripheral to the catalytic function.
    supported_by:
