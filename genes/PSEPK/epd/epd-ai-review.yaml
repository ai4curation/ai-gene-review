suggested_questions:
- question: >-
    Does P. putida KT2440 GapA (or another GAPDH paralog) contribute
    4-phosphoerythronate for PLP synthesis, as GapA does in E. coli?
suggested_experiments:
- hypothesis: PP_4964 is a non-phosphorylating E4P dehydrogenase with negligible GAPDH activity.
  description: >-
    Purify recombinant PP_4964 and assay NADH formation with erythrose
    4-phosphate and glyceraldehyde 3-phosphate (with and without phosphate),
    and test whether a PP_4964 deletion lowers PLP or causes conditional
    pyridoxine auxotrophy.
