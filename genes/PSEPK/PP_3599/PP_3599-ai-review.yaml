id: Q88GW8
gene_symbol: PP_3599
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3599 is the reviewed 5-dehydro-4-deoxyglucarate dehydratase (KDGDH) that
  decarboxylates and dehydrates 5-dehydro-4-deoxy-D-glucarate to
  2,5-dioxopentanoate. It is the shared second reaction after either glucarate
  or galactarate entry into the convergent aldarate catabolic route.
existing_annotations:
- term:
    id: GO:0008840
    label: 4-hydroxy-tetrahydrodipicolinate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The TreeGrafter DapA activity conflicts with the resolved KDGDH subfamily.
    action: REMOVE
    reason: >-
      Although KDGDH has a DapA-like TIM-barrel fold, Q88GW8 is a reviewed
      protein assigned to the substrate-specific IPR017655/NF002958/TIGR03249
      families and Rhea 24608. The broad PAINT node propagated the activity of
      a paralogous DapA branch.
    supported_by:
    - reference_id: file:PSEPK/PP_3599/PP_3599-uniprot.txt
      supporting_text: "DR   InterPro; IPR017655; Dehydro-deoxyglucarate_dehyd."
- term:
    id: GO:0016052
    label: carbohydrate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: KDGDH participates in aldarate carbohydrate catabolism.
    action: KEEP_AS_NON_CORE
    reason: >-
      The parent process is compatible with the reaction but adds less
      information than the substrate-specific glucarate and galactarate routes.
- term:
    id: GO:0016829
    label: lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: KDGDH is a lyase, but the annotation is too broad to identify its chemistry.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0047448 captures the exact 5-dehydro-4-deoxyglucarate dehydratase
      activity supported by the reviewed record and should be preferred.
- term:
    id: GO:0042838
    label: D-glucarate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: KDGDH performs the second committed reaction of D-glucarate catabolism.
    action: ACCEPT
    reason: >-
      The reviewed UniPathway assignment explicitly places Q88GW8 at step 2 of
      the D-glucarate-to-2,5-dioxopentanoate route.
    supported_by:
    - reference_id: file:PSEPK/PP_3599/PP_3599-uniprot.txt
      supporting_text: "CC       dioxopentanoate from D-glucarate: step 2/2."
- term:
    id: GO:0047448
    label: 5-dehydro-4-deoxyglucarate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PP_3599 converts 5-dehydro-4-deoxy-D-glucarate to 2,5-dioxopentanoate.
    action: ACCEPT
    reason: >-
      The exact activity is supported by the reviewed HAMAP record, EC
      4.2.1.41, Rhea 24608, and three substrate-specific family classifiers.
    supported_by:
    - reference_id: file:PSEPK/PP_3599/PP_3599-uniprot.txt
      supporting_text: "DR   GO; GO:0047448; F:5-dehydro-4-deoxyglucarate dehydratase activity; IEA:UniProtKB-UniRule."
