  findings:
  - supporting_text: MoaC** is the **cPMP synthase** that converts **3′,8-cH2GTP → cPMP** via a complex rearrangement that constructs the pyranopterin framework and cyclic phosphate.
  - supporting_text: bacterial MoaC is treated in the literature as a **soluble intracellular/cytosolic biosynthetic enzyme** functioning in early Moco biosynthesis rather than a membrane or secreted protein
  - supporting_text: MoaC **forms a hexamer composed of a trimer of dimers**; the **active site lies at the interface of each dimer**
- id: file:PSEPK/moaC/moaC-deep-research-openscientist.md
  title: OpenScientist gene research for moaC
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The conserved Q88NC0 reaction agrees with the target UniProt entry, but the
      report mislabels PP_3457 (mobA) as mogA, overstates PP_1292 as experimentally
      established nonredundant/obligatory, and presents unsaved target alignment,
      residue, coordinate, and operon analyses as evidence. The exact reaction and
      explicit lack of a KT2440 assay are retained; the erroneous or unsaved
      organism-specific claims are not propagated.
  findings:
  - statement: The report states the same MoaC reaction recorded in the target UniProt entry.
    supporting_text: '| Catalytic reaction (UniProt) | 3′,8-cH₂GTP = cyclic pyranopterin phosphate + diphosphate |'
  - statement: The report incorrectly identifies PP_3457 as mogA rather than mobA.
    supporting_text: |-
      (PP_2123, Mo insertase) and *mogA* (PP_3457) — i.e., every step needed to convert GTP into mature
      Moco (KEGG module M00880).
  - statement: The report presents unsaved target-alignment and catalytic-residue analysis.
    supporting_text: |-
      **Quantitative homology evidence (this work):** A pairwise alignment of Q88NC0 against the
      experimentally and structurally characterized *E. coli* MoaC (P0A738) shows **72.7% amino-acid
      identity** (112/154 aligned positions), and the catalytically essential *E. coli* **Asp128
      aligns with an aspartate in the P. putida sequence**.
  - statement: The report acknowledges the absence of direct KT2440 MoaC characterization.
    supporting_text: |-
      - **Organism-specific data:** Direct biochemical/genetic characterization of MoaC has been done
        in *E. coli*, *T. thermophilus*, *M. tuberculosis* and human MOCS1B, **not specifically in
        *P. putida* KT2440**.
