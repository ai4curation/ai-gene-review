id: Q88NC0
gene_symbol: moaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  moaC (PP_1292) of Pseudomonas putida KT2440 encodes cyclic pyranopterin monophosphate (cPMP)
  synthase, the second enzyme of molybdenum cofactor biosynthesis. By orthology with the
  characterised Escherichia coli MoaC, it rearranges (8S)-3',8-cyclo-7,8-dihydroguanosine
  5'-triphosphate, the product of the radical SAM GTP 3',8-cyclase MoaA, into cPMP (precursor Z)
  and diphosphate. cPMP is then converted to molybdopterin by the MoaD-MoaE molybdopterin
  synthase encoded beside moaC. The 156-residue protein carries the MoaC family fold and the
  conserved active-site aspartate; the E. coli enzyme is a cytoplasmic homohexamer with active
  sites at the dimer interfaces.
