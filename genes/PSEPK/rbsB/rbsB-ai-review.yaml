core_functions:
  - description: >-
      Captures a carbohydrate in the periplasm and contributes the
      substrate-binding subunit to the RbsABC D-ribose importer; D-ribose
      specificity is inferred primarily from the complete locus context.
    molecular_function:
      id: GO:0030246
      label: carbohydrate binding
    contributes_to_molecular_function:
      id: GO:0015611
      label: ABC-type D-ribose transporter activity
    directly_involved_in:
      - id: GO:0015752
        label: D-ribose transmembrane transport
    locations:
      - id: GO:0042597
        label: periplasmic space
    in_complex:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    supported_by:
      - reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
        supporting_text: "DE   SubName: Full=Ribose ABC transporter, periplasmic ribose-binding subunit {ECO:0000313|EMBL:AAN68066.1};"
      - reference_id: file:PSEPK/rbsB/rbsB-deep-research-openscientist.md
        supporting_text: "No direct biochemistry on *P. putida* Q88K38."
suggested_questions:
  - question: Does purified Q88K38 preferentially bind D-ribose rather than D-allose or other related sugars?
  - question: Does RbsB also couple ribose availability to chemotaxis in KT2440, as reported for the E. coli ortholog?
suggested_experiments:
  - description: Measure ligand binding by purified mature RbsB and test uptake in an rbsB deletion strain.
    experiment_type: ligand-binding and genetic transport assay
