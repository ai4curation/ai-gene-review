id: Q88K38
gene_symbol: rbsB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RbsB is the signal-peptide-bearing periplasmic substrate-binding component of
  the PP_2454-PP_2459 carbohydrate-import locus. Its position beside RbsA-I,
  RbsC, RbsK, and RbsD supports a D-ribose uptake role, but direct KT2440 ligand
  measurements are unavailable and its PANTHER family is labeled
  D-allose-binding-protein-related.
existing_annotations:
  - term:
      id: GO:0030313
      label: cell envelope
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: >-
        Cell envelope is consistent with a secreted substrate-binding protein
        but is less precise than the periplasmic location implied by the signal
        peptide and ABC-importer architecture.
      action: MODIFY
      reason: Replace the broad envelope term with periplasmic space.
      proposed_replacement_terms:
        - id: GO:0042597
          label: periplasmic space
      supported_by:
        - reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
          supporting_text: "FT   SIGNAL          1..29"
  - term:
      id: GO:0055085
      label: transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: >-
        RbsB participates in transport through the cognate RbsABC complex, but
        the generic process is under-specific for this locus.
      action: MODIFY
      reason: >-
        The contiguous rbsB-rbsA-I-rbsC-rbsR-rbsK-rbsD locus supports the
        D-ribose-specific transport process while RbsB contributes substrate
        capture rather than translocation by itself.
      proposed_replacement_terms:
        - id: GO:0015752
          label: D-ribose transmembrane transport
      supported_by:
        - reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
          supporting_text: "DE   SubName: Full=Ribose ABC transporter, periplasmic ribose-binding subunit {ECO:0000313|EMBL:AAN68066.1};"
        - reference_id: file:PSEPK/rbsB/rbsB-deep-research-openscientist.md
          supporting_text: "No direct biochemistry on *P. putida* Q88K38."
  - term:
      id: GO:0030246
      label: carbohydrate binding
    evidence_type: ISS
    original_reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
    qualifier: enables
    review:
      summary: >-
        Proposed intrinsic substrate-binding activity for the periplasmic
        receptor; direct D-ribose specificity is deliberately not asserted as
        an MF term.
      action: NEW
      supported_by:
        - reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
          supporting_text: "DR   GO; GO:0030246; F:carbohydrate binding; IEA:UniProtKB-ARBA."
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: ISS
    original_reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
    qualifier: part_of
    review:
      summary: >-
        Proposed complex membership from the substrate-binding-protein identity
        and the contiguous rbsB-rbsA-I-rbsC locus.
      action: NEW
      supported_by:
        - reference_id: file:PSEPK/rbsB/rbsB-uniprot.txt
          supporting_text: "DE   SubName: Full=Ribose ABC transporter, periplasmic ribose-binding subunit {ECO:0000313|EMBL:AAN68066.1};"
