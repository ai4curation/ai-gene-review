description: >-
  CysD is the catalytic subunit 2 of the proteobacterial sulfate
  adenylyltransferase complex. Together with the regulatory GTPase subunit CysNC,
  it uses ATP to adenylate sulfate and form adenosine 5'-phosphosulfate (APS),
  initiating the reductive branch of sulfate assimilation.
