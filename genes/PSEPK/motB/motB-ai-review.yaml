- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Modern structures establish 5 A:2 B stator assemblies in several bacteria; this updates
      the old 4:2 model but is not a KT2440 stoichiometry measurement.
    supporting_text: the stoichiometry of MotA:MotB is 5:2
- id: PMID:32929189
  title: Structures of the stator complex that drives rotation of the bacterial flagellum.
  findings:
  - statement: Primary structures in other bacterial species revise the old 4:2 stator model to A5B2.
      The earlier MotA4MotB2 claim is withdrawn; no exact KT2440 stoichiometry measurement is claimed.
    supporting_text: The structures reveal an unexpected asymmetric A5B2 subunit assembly where the five
      A subunits enclose the two B subunits.
