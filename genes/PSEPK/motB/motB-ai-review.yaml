product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  motB (PP_4904) encodes the B subunit of the proton-driven MotAB flagellar
  stator of Pseudomonas putida KT2440. MotB is a single-pass inner-membrane
  protein: its N-terminal transmembrane helix lines the proton channel together
  with the four transmembrane helices of each MotA, a plug segment follows, and
  a large periplasmic C-terminal OmpA-like domain anchors the stator to the
  peptidoglycan layer around the rotor. Proton flow through the MotA4MotB2
  stator drives MotA movement against the FliG rotor, generating torque. KT2440
  has two stators, MotAB (encoded outside the flagellar cluster, next to motA)
  and MotCD; MotAB is the main stator for swimming in liquid, whereas MotCD
  dominates in semisolid agar and at high viscosity.
