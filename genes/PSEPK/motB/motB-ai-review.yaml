product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: MotB (PP_4904) is the single-pass membrane B subunit of the proton-driven MotAB flagellar
  stator in Pseudomonas putida KT2440. Its transmembrane region contributes to the stator ion pathway,
  while its periplasmic OmpA-like domain is inferred to anchor the complex to peptidoglycan. MotAB is
  especially important for swimming in homogeneous fluid. KT2440 also has MotCD, whose contribution differs
  with the physical environment; the two stators are not interchangeable under all conditions.
