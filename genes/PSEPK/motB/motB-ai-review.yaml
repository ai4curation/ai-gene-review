- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  qualifier: contributes_to
  evidence_type: IC
  original_reference_id: PMID:18310339
  review:
    summary: Proposed complex-level activity. The MotAB stator is a proton channel; MotB contributes the
      channel-lining transmembrane helix with the conserved proton-binding aspartate.
    action: NEW
    reason: The proton transmembrane transporter activity belongs to the assembled MotAB stator, so MotB
      contributes to it (contributes_to). This is the module-level activity of the stator. KT2440 pair
      identity is established by PMID:36409076; the paper does not directly measure proton versus sodium
      selectivity. The ion assignment is a homology-supported inference, and a generic MotA/TolQ/ExbB
      or OmpA domain alone would not establish stator identity or proton specificity.
    supported_by:
