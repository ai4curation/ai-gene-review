- id: file:PSEPK/motB/motB-deep-research-falcon.md
  title: Falcon deep research synthesis for motB in Pseudomonas putida KT2440
  findings:
  - statement: In KT2440, motB corresponds to PP4904 and functions with adjacent motA.
    supporting_text: the chromosomal locus **motB (PP4904)** with adjacent/partner **motA (PP4905)** reported
      for KT2440
  - statement: MotB is the B subunit of the MotAB stator and carries a peptidoglycan-binding OmpA-like
      domain.
    supporting_text: MotB is the **B subunit of the MotAB stator complex** ... A C-terminal **OmpA-like
      peptidoglycan-binding domain** that anchors the stator to the **cell wall (peptidoglycan)**.
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida
  findings:
  - statement: In KT2440, the MotAB stator (PP4905-PP4904) is crucial for swimming in liquid; the motAB
      deletion is strongly impaired in aqueous swimming but spreads almost like wild type in soft agar,
      where MotCD is recruited.
    supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote swimming motility,
      so the movement of ΔmotAB mutant cells in aqueous fluids is strongly impaired.
  - statement: The strain called wild type carries FliC S267C, reported not to affect motility. Pair deletion
      establishes a conditional native MotAB requirement in fluids.
    supporting_text: We used the strain P. putida KT2440 FliCS267C.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; KT2440 genetic study of both stators.
- id: PMID:35572622
  title: The Periplasmic Domain of the Ion-Conducting Stator of Bacterial Flagella Regulates Force Generation
  findings:
  - statement: Review of stator structure; MotB/PomB periplasmic domains anchor the stator to peptidoglycan.
    supporting_text: MotB/PomB have a single TM segment at their N-termini and a large periplasmic C-terminal
      region that is anchored to the peptidoglycan (PG) layer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text review of stators in E. coli, Salmonella and Vibrio; not about KT2440.
- id: PMID:18310339
  title: Characterization of the periplasmic domain of MotB and implications for its role in the stator
    assembly of the bacterial flagellar motor
  findings:
  - statement: The MotB periplasmic dimer domain targets and anchors the MotA/MotB complex at the motor
      (Salmonella).
    supporting_text: We propose that the MotB(C) dimer domain plays an important role in targeting and
      stable anchoring of the MotA/MotB complex to putative stator-binding sites of the motor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache; Salmonella MotB.
