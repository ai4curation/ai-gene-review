        the stator generates the rotational force
    - reference_id: file:PSEPK/motB/motB-deep-research-falcon.md
      supporting_text: Ion flow (typically **H\+** for MotAB-type stators) is coupled to torque generation
core_functions:
- description: MotB is the B subunit of the proton-driven MotAB stator. Its periplasmic OmpA-like domain
    anchors the stator to peptidoglycan, while its transmembrane helix contributes to the stator proton
    channel whose ion flow is coupled to torque generation and flagellum-dependent swimming. KT2440 genetics
    establishes the stator-pair motility role; proton specificity is inferred from homologous Pseudomonas
    stators and conserved architecture, not from direct ion-selectivity measurements on this KT2440 complex.
  molecular_function:
    id: GO:0042834
    label: peptidoglycan binding
  contributes_to_molecular_function:
