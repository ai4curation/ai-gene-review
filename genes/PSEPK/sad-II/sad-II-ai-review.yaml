id: Q88I50
gene_symbol: sad-II
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: sad-II (PP_3151) encodes a predicted succinate-semialdehyde dehydrogenase of the GabD1/Sad
  aldehyde-dehydrogenase family in Pseudomonas putida KT2440. It is expected to oxidize succinate semialdehyde
  to succinate with a nicotinamide nucleotide acceptor. Its measured NAD versus NADP preference and physiological
  substrate regime remain unresolved. PP_3151 is induced in a reported vanillin-response study and has
  been included in engineered multigene deletion strains, without an isolated assignment of vanillin turnover.
