  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact accession and locus inspected. Independent DR domain/functional-family records
      support classification; unreviewed submitted names/EC labels, ARBA-only text and electronic GO lines
      are not used as independent proof.
- id: PMID:23229889
  title: Structure and activity of the NAD(P)+-dependent succinate semialdehyde dehydrogenase YneI from
    Salmonella typhimurium.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected; normal forced retrieval found no full-text PMC record. The
      target is Salmonella YneI, not PP_3151. Provider residue mappings are not treated as independently
      reproduced alignments.
  findings:
  - statement: Salmonella YneI accepts both NAD and NADP; the abstract reports higher affinity for NAD.
      This establishes homolog chemistry, not the target protein kinetics.
    supporting_text: YneI can use both NAD(+) and NADP(+) as cofactors
- id: PMID:3355840
  title: Properties and functions of two succinic-semialdehyde dehydrogenases from Pseudomonas putida.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verified; establishes two P. putida SSADH activities but does not identify
      a strain or locus.
  findings:
  - statement: P. putida contains separable NAD-preferring/4-hydroxyphenylacetate-induced and NADP-dependent/putrescine-induced
      SSADH activities, without a locus assignment.
- id: file:PSEPK/sad-II/sad-II-deep-research-openscientist.md
  title: OpenScientist deep-research report for sad-II
  findings:
  - statement: The provider proposes a Sad/YneI-like assignment for Q88I50 and a Lys159 cofactor-determinant
      mapping; these are research leads from its own alignment, not published locus-specific results.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Genuine provider report reused as discovery/context. Consistent with the valid PR4748
      source-boundary assessment, this is not target-specific experimental evidence. Cofactor preferences,
      residue mappings and pathway pairings require independent support; no new catalytic claim rests
      on provider prose.
