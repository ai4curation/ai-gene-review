suggested_questions:
- question: Which substrate regime distinguishes the physiological role of Sad-II from Sad-I and GabD-II?
- question: Does purified PP_3151 accept both NAD and NADP, and are their catalytic efficiencies consistent
    with the NAD-dependent functional-family assignment?
suggested_experiments:
- hypothesis: Sad-II contributes to one of the substrate-induced P. putida SSADH activities and has a
    physiological regime distinct from Sad-I and GabD-II.
  description: Compare sad-II single and combinatorial deletion phenotypes, expression, and NAD- versus
    NADP-linked activity during growth on 4-hydroxyphenylacetate, putrescine, 4-hydroxybutyrate, and GABA.
