id: Q88I50
gene_symbol: sad-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  sad-II encodes a predicted NAD(P)-linked succinate-semialdehyde dehydrogenase
  that oxidizes succinate semialdehyde to succinate. It is a second NAD-linked
  candidate for this reaction in Pseudomonas putida KT2440, but available
  annotation does not establish which physiological pathway it serves.
existing_annotations:
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad parent is compatible but loses the supported succinate-semialdehyde substrate specificity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88I50 contains the conserved aldehyde-dehydrogenase domains, while its
      NAD-specific submitted name conflicts with an NADP keyword. A
      characterized Sad/YneI-family homolog uses both cofactors. The
      substrate-specific GO:0009013 is therefore the better core term while
      Q88I50 cofactor preference remains unresolved.
    additional_reference_ids:
    - PMID:23229889
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
    - reference_id: PMID:23229889
      supporting_text: YneI can use both NAD(+) and NADP(+) as cofactors
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The succinate-semialdehyde substrate is supported, but the NAD-specific qualifier is not resolved.
    action: MODIFY
    reason: >-
      The submitted NAD-specific product/EC conflicts with the record's NADP
      keyword. Replace it with GO:0009013, which retains
      succinate-semialdehyde specificity without choosing NAD or NADP.
    proposed_replacement_terms:
    - id: GO:0009013
      label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root oxidoreductase term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0009013 provides the substrate-specific NAD(P)-linked function without choosing a cofactor.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This mechanistic parent is compatible with an aldehyde dehydrogenase using NAD or NADP.
    action: KEEP_AS_NON_CORE
    reason: It supports the enzyme class but does not resolve substrate or cofactor preference.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
