id: Q88I50
gene_symbol: sad-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  sad-II encodes a predicted NAD(P)-linked succinate-semialdehyde dehydrogenase
  that oxidizes succinate semialdehyde to succinate. It is a second NAD-linked
  candidate for this reaction in Pseudomonas putida KT2440, but available
  annotation does not establish which physiological pathway it serves.
existing_annotations:
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This is the cofactor-neutral working molecular function supported by the aldehyde-dehydrogenase family.
    action: ACCEPT
    reason: The submitted NAD-specific name conflicts with an NADP keyword, so the broader NAD(P)-linked function is retained as core.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: NAD-specific succinate-semialdehyde dehydrogenase activity is plausible but not resolved.
    action: UNDECIDED
    reason: The submitted NAD-specific product/EC conflicts with the record's NADP keyword; no biochemical cofactor assay was found.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root oxidoreductase term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0004030 provides the supported aldehyde-dehydrogenase mechanism without overstating cofactor specificity.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: EC=1.2.1.24
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This mechanistic parent is compatible with an aldehyde dehydrogenase using NAD or NADP.
    action: KEEP_AS_NON_CORE
    reason: It supports the enzyme class but does not resolve substrate or cofactor preference.
    supported_by:
    - reference_id: file:PSEPK/sad-II/sad-II-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
