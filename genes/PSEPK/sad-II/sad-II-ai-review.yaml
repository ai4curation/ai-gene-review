- id: PMID:40410945
  title: Production of Vanillin From Ferulic Acid by Pseudomonas putida KT2440 Using Metabolic Engineering
    and In Situ Product Recovery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text, strain table and target-deletion rationale inspected. This extends standalone
      physiological context without assigning the aggregate multigene phenotype to Sad-II alone.
  findings:
  - statement: PP_3151 is included among multiple deletions in vanillin-production strains, with target
      selection motivated by reported induction. These experiments do not isolate Sad-II turnover or establish
      its cofactor preference.
    supporting_text: protein abundance of PP_3151, PP_5120, and PP_5258
- id: PMID:25026441
  title: Comprehensive proteome analysis of the response of Pseudomonas putida KT2440 to the flavor compound
    vanillin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only original; target-specific PP_3151 induction is reported in the inspected
      full text of PMID:40410945. No direct Sad-II substrate assay is claimed.
  findings:
  - statement: The vanillin-response proteomics study provides the upstream lead cited by the later multigene
      engineering study.
- id: PMID:32256468
  title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, pathway validation and conclusion inspected. PP_2049 is Q88L86, distinct
      from PP_2650/Q88JJ9. The text calls PP_3151 SadI, whereas current locus-resolved nomenclature is
      sad-II; locus identifiers govern attribution.
  findings:
  - statement: KT2440 PP_2049 deletion abolishes growth on tested 4HB/1,4-BDO conditions, but direct 4HB
      biochemical assays were unsuccessful; the paper retains competing routes. PP_3151 is an annotated
      downstream candidate, not an isolated enzyme assay.
    supporting_text: Attempts to obtain direct biochemical evidence for the oxidation hypothesis with
      dehydrogenase assays on whole cell extracts
