    action: ACCEPT
    reason: The exact Q88I50 NAD-dependent SSADH FunFam supplies positive functional-family evidence for
      NAD capacity. For Sad-II, PTHR43217:SF1 is explicitly cofactor-general NAD(P), unlike the NADP-named
