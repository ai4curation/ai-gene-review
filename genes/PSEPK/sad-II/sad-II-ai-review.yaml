      acceptor preference. Retention of GO:0004777 is therefore a compatible family-level inference, not
      a measured target-specific cofactor assignment. The live GO definition describes NAD-supported catalysis
      and does not assert exclusive NAD use or absence of NADP activity. PMID:3355840 separates P. putida
      NAD-preferring and NADP-dependent isoenzymes but does not map either to this locus; Salmonella YneI
      promiscuity in PMID:23229889 is contextual, not a target assay. The ARBA-only NADP keyword is not
      used as independent evidence in either direction. The core and broad-term refinements retain cofactor-general
      SSADH chemistry rather than using this inference to settle physiological acceptor choice.
