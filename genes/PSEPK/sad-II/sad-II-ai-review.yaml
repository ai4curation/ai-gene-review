suggested_questions:
- question: Which substrate regime distinguishes the physiological role of Sad-II from Sad-I and GabD-II?
suggested_experiments:
- hypothesis: Sad-II has a physiological substrate regime distinct from Sad-I and GabD-II.
  description: Compare sad-II single and combinatorial deletion phenotypes during growth on 4-hydroxybutyrate, GABA, and related aldehyde-producing substrates.
