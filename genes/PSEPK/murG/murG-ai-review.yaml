      cannot be treated as an entailed parent. The InterPro2GO mapping has placed the enzyme
      in the wrong process branch, so it is corrected laterally to the pathway the gene actually
      works in, which it already carries. Harmonized with the Escherichia coli K-12 ortholog
      review.
    supported_by:
