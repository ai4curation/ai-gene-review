- term:
    id: GO:0050511
    label: undecaprenyldiphospho-muramoylpentapeptide
      beta-N-acetylglucosaminyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct lipid I N-acetylglucosaminyltransferase activity, but stated on the L-lysine
      lipid I rather than the meso-diaminopimelate one KT2440 makes.
    action: MODIFY
    reason: >-
      GO:0050511 is defined on the L-lysine stem peptide and GO:0051991 on the meso-diaminopimelate
      one; they are siblings under GO:0008375, so neither refines the other and this is a
      lateral substrate correction, the long-standing non-descendant use of MODIFY. KT2440
      MurE inserts meso-diaminopimelate, so GO:0051991, which this gene already carries, is
      the reaction it performs. The enzyme class does not itself select the third stem residue,
      so the row is not false, only the wrong stem variant for this organism; unlike MurF,
      this enzyme has no cross-species evidence of accepting both forms, so it is corrected
      rather than retained as non-core. Harmonized with the Escherichia coli K-12 ortholog
      review.
    supported_by:
    - reference_id: file:PSEPK/murG/murG-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'muramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimeloyl-D-alanyl-D-'
