    summary: >-
      Carbohydrate metabolism is the wrong branch for peptidoglycan synthesis; the pathway
      term is the informative one.
    action: MODIFY
    reason: >-
      GO:0009252 sits under GO:1901137 carbohydrate derivative biosynthetic process and GO:0006022
      aminoglycan metabolic process, which are siblings rather than descendants of GO:0005975
