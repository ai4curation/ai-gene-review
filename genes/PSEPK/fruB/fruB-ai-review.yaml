  label: Pseudomonas putida KT2440
description: FruB is the soluble multiphosphoryl-transfer protein of the fructose phosphotransferase
  system in Pseudomonas putida KT2440. Its sequence arranges an N-terminal EIIA domain, an internal
  HPr domain and a C-terminal enzyme I region. Phosphate flows in the opposite functional order
  from phosphoenolpyruvate through EI, HPr and EIIA to the FruA transporter. Under fructose-grown
  conditions, FruB-dependent phosphotransfer also feeds the nitrogen-related PTS, linking the
  two regulatory systems.
