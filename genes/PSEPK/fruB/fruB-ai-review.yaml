core_functions:
- description: Accepts phosphate from phosphoenolpyruvate through its EI region and relays it
    via HPr and EIIA to FruA. Sequence order is EIIA–HPr–EI; functional phosphate flow is EI→HPr→EIIA.
  molecular_function:
    id: GO:0008965
    label: phosphoenolpyruvate-protein phosphotransferase activity
  directly_involved_in:
  - id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id003
  - *id004
  - reference_id: PMID:18296519
    supporting_text: FruB is a multiphosphoryl transfer protein consisting of a classic EI domain
      fused to an equally standard HPr module and one EIIA
proposed_new_terms:
- proposed_name: PTS EIIA-to-EIIB phosphotransferase activity
  proposed_definition: Catalysis of phosphate transfer from the phosphorylated histidine of
    a phosphoenolpyruvate-dependent sugar phosphotransferase system EIIA domain to the cognate
    EIIB phosphoacceptor.
  justification: GO:0008965 captures phosphate entry from phosphoenolpyruvate through the FruB
    EI domain but does not describe the downstream HPr-EIIA-EIIB relay. KT2440 genetics specifically
    requires the FruB EIIA(Fru) domain for phosphorylation of FruA. Existing GO:0008982, GO:0022877,
    and GO:0090563 describe terminal, transport-coupled transfer from a phosphoprotein to a
    sugar rather than the soluble EIIA-to-EIIB protein relay. GO:0016772 is used here only as
    the proposed parent pending ontology-editor placement; the existing broad GO:0016772 annotation
    remains marked as over-annotated.
  proposed_parent:
    id: GO:0016772
    label: transferase activity, transferring phosphorus-containing groups
  supported_by:
  - reference_id: PMID:18296519
    supporting_text: PtsN cannot replace the EIIA Fru domain of FruB for phosphorylation of
      FruA
suggested_questions:
- question: Which FruB relay domain makes the physiologically dominant contact with PtsN during
    fructose-dependent cross-talk, and how is that branch insulated from FruA phosphorylation?
- question: What are the direct domain-to-partner transfer rates for FruB, FruA, PtsO and PtsN,
    beyond the conditional phosphoflow established genetically in vivo?
suggested_experiments:
- hypothesis: The fused EIIA(Fru) domain of FruB is required for fructose uptake, while a distinct
    relay interface supports phosphate transfer to PtsN.
  description: Complement a fruB deletion with active-site substitutions in the EI, HPr, and
    EIIA(Fru) phosphoacceptor residues, then measure fructose uptake, fructose 1-phosphate accumulation,
    and PtsN phosphorylation in parallel.
  experiment_type: domain-resolved phosphorelay genetics and metabolomics
