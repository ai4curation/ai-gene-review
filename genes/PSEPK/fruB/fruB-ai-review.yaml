gene_symbol: fruB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FruB is the soluble EI-HPr-EIIA(Fru) multiphosphoryl-transfer protein
  of the fructose-specific phosphoenolpyruvate-dependent phosphotransferase system.
  It accepts phosphate from phosphoenolpyruvate and transfers it through its fused
  relay domains to the FruA EIIB'BC transporter, coupling fructose uptake to formation
  of intracellular fructose 1-phosphate. FruB can also transfer phosphate to the nitrogen-related
  PTS under fructose-grown conditions, but that regulatory cross-talk is distinct
  from its core role in fructose uptake.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Accept. FruB is the soluble relay polyprotein of the KT2440 fructose
      PTS; primary literature describes it as the cytoplasmic partner of the
      membrane-bound FruA EIIBC.
    action: ACCEPT
    reason: Correct location for the core FruB phosphorelay activity. The UniProt
      subcellular-location line rests only on an ARBA rule, so the support cited
      here is the KT2440 literature, which contrasts cytoplasmic FruB with
      membrane-bound FruA.
    supported_by:
    - reference_id: PMID:27933319
      supporting_text: 'This Fru-only transport system involves two unique polyproteins:
        EI/HPr/EIIAFru (cytoplasmic, encoded by fruB) and EIIBC (membrane bound,
        encoded by fruA).'
- term:
    id: GO:0008965
    label: phosphoenolpyruvate-protein phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Accept as the core molecular function. FruB carries a classic enzyme
      I domain, belongs to the PTS enzyme I family (NCBIfam TIGR01417, PANTHER
      PTHR46244), and KT2440 genetics shows it is the phosphate donor of the fructose
      PTS and can phosphorylate PtsN in fructose-grown cells.
    action: ACCEPT
    reason: GO:0008965 (PEP + protein L-histidine = pyruvate + protein N(pi)-phospho-L-histidine)
      is the reaction performed by the FruB enzyme I domain, the entry step of
      the fructose phosphorelay. The activity is inferred from domain and family
      membership plus in vivo phosphotransfer genetics; purified KT2440 FruB has
      not been assayed.
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: FruB is a multiphosphoryl transfer protein consisting of a
        classic EI domain fused to an equally standard HPr module and one EIIA Fru
        module.
    - reference_id: PMID:18296519
      supporting_text: Apart from clarifying the flow of P transfer between proteins
        of PTS Ntr , the unanticipated result of this work was the finding that
        in cells exposed to fructose (but not in cells exposed to succinate), FruB
        is able to phosphorylate PtsN.
    - reference_id: file:PSEPK/fruB/fruB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01417; PTS_I_fam; 1.
- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Accept. FruB and FruA form the complete fructose-specific PTS in KT2440,
      with FruB supplying the soluble phosphorelay.
    action: ACCEPT
    reason: This is the direct biological process executed by FruB with FruA; fruB
      mutants cannot transport fructose through FruA.
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: Two of these PTS constituents (FruA and FruB) form a complete
        system for fructose intake.
    - reference_id: PMID:18296519
      supporting_text: FruB mutants cannot transport fructose through the two-domain
        (EIIB Fru and EIIC Fru ) FruA permease ( 39 ), meaning that PtsN cannot
        replace the EIIA Fru domain of FruB for phosphorylation of FruA.
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Over-annotation. FruB is a phosphoenolpyruvate-dependent protein-histidine
      phosphotransferase and phosphocarrier, and GO does not classify that reaction
      under kinase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0016301 is defined as "Catalysis of the transfer of a phosphate
      group, usually from ATP, to a substrate molecule." The accepted FruB activity,
      GO:0008965, is placed by GO under GO:0016772 transferase activity, transferring
      phosphorus-containing groups but not under GO:0016301, so this electronic
      (GO_REF:0000104 rule-based) term is not entailed by the real function and
      adds a misleading ATP-kinase reading.'
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: FruB is a multiphosphoryl transfer protein consisting of a
        classic EI domain fused to an equally standard HPr module and one EIIA Fru
        module.
