id: Q88P76
gene_symbol: valS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ValS charges tRNA(Val) with valine and proofreads threonine errors by hydrolysing mischarged
  Thr-tRNA(Val) at a distinct editing site. It acts in the cytoplasm of Pseudomonas putida KT2440, using
  ATP to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate valine by valS.
    action: MODIFY
    reason: The MF_02004 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/valS/valS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Val) + L-valine + ATP = L-valyl-tRNA(Val) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ValS charges tRNA(Val) with valine and proofreads threonine errors by hydrolysing mischarged
      Thr-tRNA(Val) at a distinct editing site.
    action: ACCEPT
    reason: The assigned posttransfer reaction cleaves Thr-tRNA(Val), which is precisely an incorrectly
      aminoacylated tRNA. The distinct editing site supports fidelity without implying that ValS edits
      every noncognate amino acid. HAMAP MF_02004 supports valylation, posttransfer Thr-tRNA(Val) editing
      and a C-terminal coiled-coil contribution to aminoacylation. These are target-specific family-rule
      assignments, not direct KT2440 assays.
    supported_by:
