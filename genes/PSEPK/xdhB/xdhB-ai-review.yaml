id: Q88F20
gene_symbol: xdhB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  XdhB is the molybdopterin-cofactor catalytic subunit of the two-subunit XdhAB
  xanthine dehydrogenase. It houses the purine-base oxidation center and works
  with the FAD/[2Fe-2S] electron-transfer subunit XdhA to convert hypoxanthine
  to xanthine and xanthine to urate. These reactions have not been measured
  directly for the KT2440 complex and are inferred from subunit-specific domain
  architecture and homologous bacterial XDH biochemistry.
existing_annotations:
- term:
    id: GO:0004854
    label: xanthine dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: contributes_to
  review:
    summary: XdhB contains the molybdenum catalytic center but requires XdhA to form the complete xanthine dehydrogenase.
    action: MODIFY
    reason: >-
      Replace the EC-derived enables relation with contributes_to because XdhB
      supplies only the molybdopterin catalytic module of the assembled XdhAB
      electron-transfer system.
    proposed_replacement_terms:
    - id: GO:0004854
      label: xanthine dehydrogenase activity
    supported_by:
    - reference_id: file:PSEPK/xdhB/xdhB-uniprot.txt
      supporting_text: 'DR   InterPro; IPR014309; Xanthine_DH_Mopterin-bd_su.'
    - reference_id: PMID:11341925
      supporting_text: XDH from P. putida 86 consists of 91.0 kDa and 46.2 kDa
    - reference_id: file:PSEPK/xdhB/xdhB-deep-research-openscientist.md
      supporting_text: >-
        encodes the **large molybdenum-cofactor (molybdopterin)-binding catalytic
        subunit of a two-subunit bacterial xanthine dehydrogenase**
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The XdhB sequence is assigned to the molybdopterin-binding catalytic subunit rather than the Fe-S-bearing subunit.
    action: REMOVE
    reason: >-
      XdhB contains the xanthine-dehydrogenase molybdopterin-binding architecture;
      the complementary XdhA subunit carries the ferredoxin-type [2Fe-2S]
      domains. The broad InterPro iron mapping appears to have crossed the
      multi-subunit enzyme boundary.
    supported_by:
    - reference_id: file:PSEPK/xdhB/xdhB-uniprot.txt
      supporting_text: 'DR   InterPro; IPR014309; Xanthine_DH_Mopterin-bd_su.'
    - reference_id: file:PSEPK/xdhA/xdhA-uniprot.txt
      supporting_text: 'DR   InterPro; IPR006058; 2Fe2S_fd_BS.'
    - reference_id: file:PSEPK/xdhB/xdhB-deep-research-openscientist.md
      supporting_text: >-
        with no FAD- or iron-sulfur-binding regions
