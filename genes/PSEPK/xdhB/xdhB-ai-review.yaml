references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro mappings supplied broad iron and molybdenum-ion annotations that require subunit- and cofactor-aware correction.
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings:
  - statement: EC mapping assigned complete xanthine dehydrogenase activity without distinguishing subunit contribution.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated methods supplied broad oxidoreductase activity.
- id: file:PSEPK/xdhB/xdhB-uniprot.txt
  title: UniProtKB entry for Pseudomonas putida KT2440 XdhB (Q88F20)
  findings:
  - statement: UniProt identifies XdhB as the xanthine-dehydrogenase molybdopterin-binding subunit.
    supporting_text: 'DR   InterPro; IPR014309; Xanthine_DH_Mopterin-bd_su.'
- id: file:PSEPK/xdhA/xdhA-uniprot.txt
  title: UniProtKB entry for Pseudomonas putida KT2440 XdhA (Q88F21)
  findings:
  - statement: The complementary XdhA sequence, rather than XdhB, carries the specific [2Fe-2S]-binding signature.
    supporting_text: 'DR   InterPro; IPR006058; 2Fe2S_fd_BS.'
- id: PMID:11341925
  title: 'Xanthine dehydrogenase from Pseudomonas putida 86: specificity, oxidation-reduction potentials of its redox-active centers, and first EPR characterization.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract directly supports two-subunit P. putida XDH biochemistry,
      but the studied organism is strain 86 rather than KT2440.
  findings:
  - statement: The homologous enzyme oxidized both hypoxanthine and xanthine using NAD+ as preferred acceptor.
    supporting_text: oxidation of hypoxanthine, xanthine, purine, and some aromatic aldehydes, using
  - statement: The enzyme contained distinct large and small subunits.
    supporting_text: XDH from P. putida 86 consists of 91.0 kDa and 46.2 kDa
- id: PMID:26355499
  title: Identification of a chemoreceptor that specifically mediates chemotaxis toward metabolizable purine derivatives.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The abstract directly supports hypoxanthine and xanthine utilization by
      KT2440 at the organism level but does not identify XdhB genetically.
  findings:
  - statement: KT2440 can use hypoxanthine and xanthine as sole nitrogen sources.
    supporting_text: permitting their use as sole nitrogen sources
- id: file:PSEPK/xdhB/xdhB-deep-research-openscientist.md
  title: OpenScientist deep-research report for Pseudomonas putida KT2440 xdhB
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      The target identity and complementary cofactor architecture are useful
      corroboration. The report nevertheless promotes homolog-derived
      stoichiometry, localization, maturation, electron-path, active-site, and
      substrate-range claims to Q88F20; those details were not imported.
  findings:
  - statement: The report correctly assigns Q88F20 to the molybdopterin-bearing catalytic subunit rather than the FAD/Fe-S subunit.
    supporting_text: >-
      with no FAD- or iron-sulfur-binding regions
  - statement: It explicitly identifies the target-specific evidence gap.
    supporting_text: No direct enzymology on Q88F20 itself.
