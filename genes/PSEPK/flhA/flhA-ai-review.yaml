  label: Pseudomonas putida KT2440
description: FlhA forms the membrane-associated export platform and couples ion flow to flagellar
  substrate translocation; its cytoplasmic region docks export partners and substrates. In
  Pseudomonas putida KT2440 these functions are inferred from its conserved flagellar export-family
  identity. The membrane gate normally uses proton motive force; the cytoplasmic ATPase machinery
  improves export efficiency, and bypass conditions can support export without FliHI. ATP-driven
  export without bulk proton motive force has also been reconstituted in Salmonella membrane
  vesicles.
