      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Best available localization for the soluble bacterial AcpP protein.
    action: ACCEPT
    reason: >-
      Cytosol is the more specific existing annotation and is consistent with
      UniProt's cytoplasmic localization and the absence of membrane or
      secretion features. The curated HAMAP rule for the acyl carrier protein
      family places the protein in the cytoplasm, and the record has no FT
      SIGNAL or TRANSMEM features; as a small soluble carrier that shuttles
      acyl intermediates among the soluble type II fatty acid synthase
      enzymes, the cytosol refinement follows from that family-level location.
    supported_by:
    - reference_id: file:PSEPK/acpP/acpP-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_01217}."
    - reference_id: file:PSEPK/acpP/acpP-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_01217; Acyl_carrier; 1."
