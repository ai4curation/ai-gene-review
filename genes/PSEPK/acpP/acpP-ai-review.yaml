    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The existing cytosol annotation is the more specific location for this
      soluble bacterial protein, so retaining both parent and child adds no
      information.
    supported_by:
    - reference_id: file:PSEPK/acpP/acpP-uniprot.txt
