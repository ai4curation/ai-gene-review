  review:
    summary: >-
      PP_2043 is predicted to be a soluble periplasmic protein.
    action: NEW
    reason: >-
      GOA has no annotations for Q88L92. Two independent sequence predictors agree: SignalP places
      a cleavable signal peptide at 1-20 (UniProt), and DeepTMHMM on the 98%-identical dashboard
      sequence predicts a signal peptide and no membrane-spanning segment of either kind (class SP,
      secreted/periplasmic). There is no lipobox, so the protein is not expected to be a
      lipid-anchored outer-membrane lipoprotein like LolB. The DUF1329 protein AmeB of
      C. defragrans was likewise predicted to be periplasmic (PMID:30334144). Secretion beyond the
      outer membrane cannot be excluded from sequence alone, and no fractionation exists, so this
      is a prediction.
