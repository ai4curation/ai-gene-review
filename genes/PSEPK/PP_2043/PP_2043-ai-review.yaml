suggested_questions:
- question: >-
    Does PP_2043 bind a hydrophobic cargo in its predicted LolA-like cavity, and does it interact
    with PP_2042 or affect PP_2042 outer-membrane levels?
suggested_experiments:
- description: >-
    Purify PP_2043 (mature chain 21-442) and identify bound ligands by native mass spectrometry and
    lipidomics; test PP_2042-PP_2043 interaction by co-purification and compare PP_2042
    outer-membrane levels in a PP_2043 deletion strain.
  experiment_type: ligand identification and protein interaction
