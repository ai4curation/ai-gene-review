core_functions:
- description: >-
    Predicted soluble periplasmic DUF1329 (LolA-like) protein of unknown function, co-encoded with
    the outer-membrane DUF1302 beta-barrel PP_2042. It may act as a periplasmic carrier or
    chaperone in a DUF1302/DUF1329 envelope system, but its cargo, partner interactions and
    process are untested, and it has no KT2440 fitness phenotype.
