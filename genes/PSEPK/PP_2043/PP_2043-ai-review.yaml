description: >-
  PP_2043 is a 442-residue DUF1329 (PF07044) protein of unknown function, encoded 4 bp downstream
  of the DUF1302 outer-membrane beta-barrel gene PP_2042 and overlapping the DUF202
  inner-membrane protein gene PP_2044, consistent with one operon. It has a Sec signal peptide
  (SignalP 1-20) and no lipobox or transmembrane segment, so the mature protein is predicted to be
  soluble in the periplasm. STRING places it in COG2834 (outer-membrane lipoprotein-sorting,
  LolA-like), and Fitness Browser curators proposed, for the paralog PP_0766 and other DUF1329
  proteins, that DUF1329 is distantly related to LolB and sorts a DUF1302 adhesin to the outer
  membrane; that is an untested hypothesis. In C. defragrans the DUF1329 protein AmeB is a
  periplasmic component of the AmeABCD RND system needed for growth at high monoterpene
  concentrations, and the DUF1302 family description proposes a role as a LolA-like chaperone in a
  DUF1302/DUF1329/MMPL exporter. PP_2043 belongs to a different subfamily from PP_0766 and from the
  P. aeruginosa PA3922 (about 49-53% identity to each), has no fitness phenotype in 300 KT2440
  RB-TnSeq experiments and is not cofit with PP_2042. Its function, cargo and process are unknown;
  only a periplasmic location is reasonably predicted.
