references:
- id: file:PSEPK/PP_2043/PP_2043-dashboard-prediction-evidence/dashboard_page.txt
  title: gene-annotate dashboard review page for NZ_PJCG01000017.1_25
  findings:
  - statement: The call rests on curated homolog annotations derived from cofitness.
    supporting_text: >-
      Curated homologs at 45.3–50.6% identity are annotated as adhesin-associated sorting proteins
      based on conserved cofitness with putative adhesins.
  - statement: The annotator itself noted that the query is a soluble exported protein.
    supporting_text: >-
      Query topology predicts a cleavable signal peptide and no transmembrane segments, consistent
      with a soluble exported protein.
  - statement: DeepTMHMM predicts a soluble, non-membrane protein.
    supporting_text: >-
      the protein has a cleavable signal peptide and NO membrane-spanning segment of either kind.
      The mature protein is therefore SOLUBLE AND EXPORTED -- periplasmic or secreted -- rather
      than membrane-embedded.
- id: file:PSEPK/PP_2043/PP_2043-bioinformatics/RESULTS.md
  title: >-
    PP_2042/PP_2043 bioinformatics (copy of the pair analysis): identities, N-terminal motifs,
    Fitness Browser data and gene neighbourhoods.
  findings:
  - statement: PP_2043 has no fitness phenotype.
    supporting_text: >-
      PP_2042 and PP_2043 have no fitness phenotype in any of 300 KT2440 experiments, including the
      Tween 20 and butyl stearate experiments in which PP_0765 and PP_0766 are strongly required.
  - statement: PP_2042 and PP_2043 are not cofit.
    supporting_text: PP_0765 vs PP_0766 r = 0.951; PP_2042 vs PP_2043 r = 0.098
  - statement: The sorting-protein reannotation is for the paralog PP_0766.
    supporting_text: >-
      Fitness Browser reannotations exist only for PP_0765 ("putative adhesin (DUF1302)") and
      PP_0766 ("adhesin-associated sorting protein (DUF1329)"); there is none for PP_2042 or
      PP_2043.
- id: file:PSEPK/PP_2043/PP_2043-dashboard-prediction-evidence/dashboard_evidence.json
  title: Full dashboard evidence record for NZ_PJCG01000017.1_25 (as shown to the annotator)
  findings:
  - statement: The curator rationale is a prediction from cofitness and distant LolB similarity.
    supporting_text: >-
      DUF1329 is distantly related to lolB, which inserts lipoproteins into the outer membrane. So
      we predict that DUF1329 is involved in sorting the adhesin to the outer membrane.
