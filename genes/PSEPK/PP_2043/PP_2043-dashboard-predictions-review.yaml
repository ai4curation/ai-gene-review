- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009279
    label: cell outer membrane
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    summary: >-
      The extractor took "outer membrane" from the phrase "targeting to the outer membrane", which
      names the proposed destination of a cargo, not where PP_2043 is located. An outer-membrane
      location for PP_2043 would need a membrane anchor, and the protein has none. It lacks a
      lipobox, so it cannot be a lipid-anchored LolB-like outer-membrane lipoprotein. DeepTMHMM finds
      no membrane-spanning segment of either kind, so it is neither a beta-barrel nor a helical
      membrane protein. SignalP gives a cleavable signal peptide. The annotator's own rationale
      calls it "a soluble exported protein". The best-supported location is the periplasmic space,
      which the companion review adds as NEW. Transient or peripheral contact with the outer
      membrane through PP_2042 is not excluded, but no evidence supports it. The term is absent
      from GOA.
    supported_by:
