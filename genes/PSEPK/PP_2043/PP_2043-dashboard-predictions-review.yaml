description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_PJCG01000017.1_25 is "Putative adhesin-associated sorting protein of the DUF1329 family
  involved in adhesin targeting to the outer membrane" (tier A, Dark-Function stratum), with two GO
  terms: GO:0089705 protein localization to outer membrane and GO:0009279 cell outer membrane. The
  exact-sequence UniProt entries are deleted, so the call is scored on the KT2440 reference-proteome
  entry Q88L92 (PP_2043), 98.0% identical over 440 aligned residues (query 440 aa, subject 442 aa).
  GOA has no annotations for Q88L92.
  The call reproduces a Fitness Browser curator hypothesis made for the paralog PP_0766 and for
  other DUF1329 proteins: DUF1329 is distantly related to LolB and is cofit with a DUF1302
  "adhesin", so it might sort the adhesin to the outer membrane. That hypothesis has never been
  tested. It does not carry over to PP_2043 on its own data: PP_2043 has no fitness phenotype in
  300 KT2440 experiments, is not cofit with PP_2042 (r = 0.098), and is about 49-53% identical to
  both PP_0766 and P. aeruginosa PA3922. The Tween 20 and butyl stearate defects the annotator
  cited are those of PP_0766 and its orthologs. An equally consistent model is the Castellaniella
  AmeABCD system, in which the DUF1329 protein is a periplasmic component of an RND export system
  for hydrophobic compounds rather than a protein-sorting factor.
  The protein is predicted soluble in the periplasm: it has a signal peptide, no lipobox and no
  membrane segment. The extracted outer-membrane CC term confuses the target of the proposed
  process with the protein's own location.
  Recommended dashboard verdict: overreach. Corrected annotation: "DUF1329 family (LolA-like)
  periplasmic protein of unknown function, co-encoded with DUF1302 outer membrane protein PP_2042".
