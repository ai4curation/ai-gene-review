    supporting_text: The second up-regulated protein—AmeB (CDM25260, 451 aa)—was predicted as periplasmic and affiliated to the LolA superfamily (DUF1329).
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0089705
    label: protein localization to outer membrane
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The term restates a Fitness Browser curator hypothesis. That hypothesis rests on distant
      similarity of DUF1329 to LolB and on conserved cofitness of DUF1329 genes with DUF1302
      "adhesins" (PP_0766 with PP_0765 in KT2440). No experiment in any organism shows that a DUF1329
      protein targets a protein to the outer membrane. The KT2440 data give no specific support for
      PP_2043: it has no fitness phenotype in 300 experiments and is not cofit with PP_2042
      (r = 0.098). An alternative is consistent with the same family data: in C. defragrans the
      DUF1329 protein AmeB is a predicted periplasmic, LolA-superfamily component of an RND efflux
      system for hydrophobic compounds (PMID:30334144). On that model the cargo would be a small
      molecule or lipid, not a protein. Nothing refutes protein targeting either, so UNC. The term
      is absent from GOA.
