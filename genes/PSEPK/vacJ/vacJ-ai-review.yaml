id: Q88KX6
gene_symbol: vacJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Outer-membrane VacJ/MlaA-family lipoprotein that forms the outer-membrane
  phospholipid-handling interface of the Mla system and participates in
  intermembrane phospholipid transfer and maintenance of envelope lipid
  organization.
existing_annotations:
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but too broad for an outer-membrane MlaA-family lipoprotein.
      action: MODIFY
      reason: MlaA/VacJ is an outer-membrane component, so GO:0009279 is the informative bacterial membrane location.
      proposed_replacement_terms:
        - id: GO:0009279
          label: cell outer membrane
      supported_by:
        - reference_id: file:PSEPK/vacJ/vacJ-deep-research-openscientist.md
          supporting_text: Located within the outer membrane, MlaA (VacJ) acts as a channel to shuttle phospholipids from the outer leaflet
  - term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Correct process annotation for the outer-membrane Mla interface.
      action: ACCEPT
      reason: Conserved MlaA/VacJ family function places Q88KX6 at the outer-membrane interface of intermembrane phospholipid transfer.
references:
  - id: PMID:33236984
    title: Structure of bacterial phospholipid transporter MlaFEDB with substrate bound.
    findings:
      - statement: The primary structural study places the MlaA outer-membrane interface in the three-part Mla pathway.
        supporting_text: >-
          This system consists of three main parts: (1) an IM ABC transporter complex, MlaFEDB; (2) an OM complex, MlaA-OmpC/F; and (3) a soluble periplasmic protein, MlaC, which has been proposed to shuttle phospholipids between MlaFEDB and MlaA-OmpC/F (Figure 1A).
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Primary MlaFEDB structure paper used for pathway architecture; it is not a target-specific VacJ experiment.
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: file:PSEPK/vacJ/vacJ-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 VacJ/MlaA (Q88KX6)
    findings:
      - statement: UniProt assigns Q88KX6 to the MlaA family.
  - id: file:PSEPK/vacJ/vacJ-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK vacJ
    findings:
      - statement: >-
          The report supports an outer-membrane MlaA/VacJ lipid-handling role
          from conserved-family and ortholog evidence, but found no direct
          experimental characterization of PP_2163.
      - statement: >-
          Net transport direction, N-terminal lipidation, and the identity of
          any KT2440 porin partner remain unresolved for this specific protein.
core_functions:
  - description: Outer-membrane phospholipid handling in the Mla intermembrane transfer system.
    contributes_to_molecular_function:
      id: GO:0120014
      label: phospholipid transfer activity
    directly_involved_in:
      - id: GO:0120010
        label: intermembrane phospholipid transfer
    locations:
      - id: GO:0009279
        label: cell outer membrane
    supported_by:
      - reference_id: file:PSEPK/vacJ/vacJ-uniprot.txt
        supporting_text: Belongs to the MlaA family.
suggested_questions:
  - question: Does KT2440 VacJ/MlaA preferentially extract or receive specific outer-membrane phospholipid species?
  - question: Is PP_2163 lipidated, and does it form an outer-membrane complex with a specific KT2440 porin?
suggested_experiments:
  - description: Reconstitute VacJ/MlaA in asymmetric outer-membrane mimetics and quantify phospholipid exchange with Ttg2D.
    experiment_type: asymmetric membrane lipid-transfer assay
