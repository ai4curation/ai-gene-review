- id: file:PSEPK/argA/argA-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgA
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. ArgA initiation is supported by native KT2440 auxotrophy (PMID31451546)
      and curated ArgA family chemistry. The protein is not functionally replaced by the endogenous ArgJ
      under the tested minimal-medium conditions. PMID22447897 characterizes P. aeruginosa ArgA, not the
      KT2440 enzyme; its regulatory and oligomeric details are comparative, not new target annotations.
  findings:
  - statement: The report identifies the exact accession and retrieves its acetyl-CoA-dependent N-acetylglutamate-synthase
      reaction.
    supporting_text: The gene **argA** (ordered locus **PP_5185**; UniProt **P0A0Z9**) of *Pseudomonas
      putida* (strain ATCC 47054 / DSM 6125 / KT2440) encodes **N-acetylglutamate synthase (NAGS; also
      called amino-acid acetyltransferase or AGS; EC 2.3.1.1)**.
- id: PMID:22447897
  title: Functional dissection of N-acetylglutamate synthase (ArgA) of Pseudomonas aeruginosa and restoration
    of its ancestral N-acetylglutamate kinase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
