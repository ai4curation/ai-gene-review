description: ArgA (PP_5185) is a cytoplasmic N-acetylglutamate synthase that transfers acetyl from acetyl-CoA
  to L-glutamate, supplying N-acetyl-L-glutamate for L-arginine biosynthesis. Loss of argA causes arginine
  auxotrophy in Pseudomonas putida KT2440 despite the presence of ArgJ, whose acetyl-recycling activity
  cannot be assumed to replace pathway initiation.
