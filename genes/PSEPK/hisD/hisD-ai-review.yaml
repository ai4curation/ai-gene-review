    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct cellular context for a soluble bacterial biosynthetic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      This TreeGrafter (GO_REF:0000118) row is correct: the entry carries no
      signal peptide or transmembrane feature and all characterized HisD
      orthologs are soluble. Localization is supporting context rather than the
      defining function, consistent with the other histidine-pathway enzymes.
    supported_by:
    - reference_id: file:PSEPK/hisD/hisD-deep-research-openscientist.md
      supporting_text: >-
        The enzyme is cytoplasmic (no signal peptide or transmembrane segment)
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct soluble location for this cytoplasmic bacterial enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      HisD is a soluble NAD-dependent dehydrogenase with no transmembrane
      segment or signal peptide, and UniProt places the histidine-biosynthesis
      enzymes in the cytoplasm; in a bacterium without organelles the cytosol
      is where that soluble pool resides, so the term is true rather than an
      over-annotation. It is retained as non-core because the informative
      content of this review is the catalytic step, not the location.
    supported_by:
    - reference_id: file:PSEPK/hisD/hisD-deep-research-openscientist.md
      supporting_text: >-
        HisD/PP_0966 is a soluble cytoplasmic biosynthetic oxidoreductase
