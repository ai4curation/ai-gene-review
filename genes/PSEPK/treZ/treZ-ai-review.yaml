- id: file:PSEPK/treZ/treZ-uniprot.txt
  title: UniProtKB entry Q88FN8 for Pseudomonas putida KT2440 treZ
  findings:
  - statement: Q88FN8 matches the TreZ-specific NCBIfam and PIRSF family models.
    record_section: ["DR:NCBIfam"]
    supporting_text: 'DR   NCBIfam; TIGR02402; trehalose_TreZ; 1.'
    reference_section_type: RESULTS
  - statement: UniProt describes hydrolysis of the glucosidic linkage adjacent to the trehalose moiety.
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=hydrolysis of (1->4)-alpha-D-glucosidic linkage in 4-alpha-D-[(1->4)-alpha-D-glucanosyl]n trehalose to yield trehalose and (1->4)-alpha-D-glucan.; EC=3.2.1.141;'
    reference_section_type: RESULTS
  - statement: The record places TreZ in trehalose biosynthesis.
    record_section: ["CC:PATHWAY"]
    supporting_text: 'PATHWAY: Glycan biosynthesis; trehalose biosynthesis.'
    reference_section_type: RESULTS
  - statement: UniProt predicts the target protein to be cytoplasmic.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The exact accession, inferred product, reaction, pathway, localization,
      and family mapping were checked directly in the cited record. This
      verifies the citation and record contents; the target protein lacks
      direct biochemical evidence in the record.
- id: PMID:8605217
  title: Cloning and sequencing of trehalose biosynthesis genes from Arthrobacter sp. Q36.
  findings:
  - statement: The characterized Arthrobacter locus contains adjacent treY and treZ genes.
    supporting_text: >-
      Sequence analysis of the DNA fragment revealed two open reading frames of
      2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
      maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this provides ortholog and
      pathway context rather than direct evidence for PSEPK TreZ.
- id: PMID:8611745
  title: Purification and characterization of a novel enzyme, maltooligosyl trehalose trehalohydrolase, from Arthrobacter sp. Q36.
  findings:
  - statement: Arthrobacter sp. Q36 TreZ was purified and its linkage-specific hydrolysis was measured.
    supporting_text: >-
      The enzyme specifically catalyzed the hydrolysis of the
      alpha-1,4-glucosidic linkage that bound the maltooligosyl and trehalose
      moieties of maltooligosyl trehalose.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this biochemically supports
      the TreZ reaction represented by the exact Arthrobacter exemplar, not a
      direct assay of Q88FN8.
