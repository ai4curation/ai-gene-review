suggested_questions:
- question: Does KT2440 TreZ act preferentially on TreY products derived from glycogen or shorter maltooligosaccharides?
suggested_experiments:
- description: >-
    Reconstitute TreY and TreZ with defined alpha-glucans, quantify trehalose
    release, and test loss and complementation of treZ during osmotic stress.
