- id: PMID:8605217
  title: Cloning and sequencing of trehalose biosynthesis genes from Arthrobacter sp. Q36.
  findings:
  - statement: The characterized Arthrobacter locus contains adjacent treY and treZ genes.
    supporting_text: >-
      Sequence analysis of the DNA fragment revealed two open reading frames of
      2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
      maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this provides ortholog and
      pathway context rather than direct evidence for PSEPK TreZ.
- id: PMID:8611745
  title: Purification and characterization of a novel enzyme, maltooligosyl trehalose trehalohydrolase, from Arthrobacter sp. Q36.
  findings:
  - statement: Arthrobacter sp. Q36 TreZ was purified and its linkage-specific hydrolysis was measured.
    supporting_text: >-
      The enzyme specifically catalyzed the hydrolysis of the
      alpha-1,4-glucosidic linkage that bound the maltooligosyl and trehalose
      moieties of maltooligosyl trehalose.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this biochemically supports
      the TreZ reaction represented by the exact Arthrobacter exemplar, not a
      direct assay of Q88FN8.
