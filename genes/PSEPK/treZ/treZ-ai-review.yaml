id: Q88FN8
gene_symbol: treZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  TreZ is the malto-oligosyltrehalose trehalohydrolase of the TreY/TreZ route.
  It hydrolyzes the alpha-1,4 linkage adjacent to the trehalose moiety of
  maltooligosyltrehalose, releasing trehalose and a shortened alpha-glucan.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: True but general glycosidase parent of the TreZ activity.
    action: MODIFY
    reason: >-
      The mapping from the TreZ-specific InterPro family stops at O-glycosyl
      hydrolase activity. The specific activity, which the gene already
      carries, is GO:0033942, a descendant of GO:0004553; the same action is
      taken on the TreZ orthologs.
    proposed_replacement_terms:
    - id: GO:0033942
      label: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR012768; Trehalose_TreZ.'
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02402; trehalose_TreZ; 1.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Plausible cytoplasmic location for the soluble TreZ enzyme.
    action: ACCEPT
    reason: >-
      The exact UniProt record predicts cytoplasmic localization, consistent
      with the soluble intracellular TreY/TreZ pathway; this remains
      computational rather than experimentally established for Q88FN8.
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: True but general; the GH13 catalytic-domain mapping stops at carbohydrate metabolism.
    action: MODIFY
    reason: >-
      The InterPro GH13 catalytic-domain mapping is correct but stops at the
      root carbohydrate process. The specific process is trehalose
      biosynthesis, a descendant of carbohydrate metabolic process that the
      gene already carries; the same action is taken on the TreZ orthologs.
    proposed_replacement_terms:
    - id: GO:0005992
      label: trehalose biosynthetic process
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR006047; GH13_cat_dom.'
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Glycan biosynthesis; trehalose biosynthesis.'
- term:
    id: GO:0005992
    label: trehalose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct biological process for release of trehalose in the TreY/TreZ route.
    action: ACCEPT
    reason: UniProt assigns the TreZ reaction and explicitly places it in trehalose biosynthesis.
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Glycan biosynthesis; trehalose biosynthesis.'
- term:
    id: GO:0016798
    label: hydrolase activity, acting on glycosyl bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: True but general glycosyl-bond hydrolase parent of the TreZ activity.
    action: MODIFY
    reason: >-
      The UniRule-based transfer stops at glycosyl-bond hydrolase activity. The
      specific activity, which the gene already carries, is GO:0033942, a
      descendant of GO:0016798.
    proposed_replacement_terms:
    - id: GO:0033942
      label: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: 'DR   PIRSF; PIRSF006337; Trehalose_TreZ; 1.'
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02402; trehalose_TreZ; 1.'
- term:
    id: GO:0033942
    label: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct enzyme-specific activity for the TreZ hydrolysis reaction.
    action: ACCEPT
    reason: >-
      Q88FN8 carries the TreZ-specific NCBIfam and PIRSF family signatures,
      and the EC 3.2.1.141 reaction was demonstrated for the purified
      Arthrobacter sp. Q36 ortholog (PMID:8611745). That is ortholog evidence,
      not a KT2440 assay.
    supported_by:
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR02402; trehalose_TreZ; 1.'
    - reference_id: file:PSEPK/treZ/treZ-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: 'DR   PIRSF; PIRSF006337; Trehalose_TreZ; 1.'
    - reference_id: PMID:8611745
      supporting_text: >-
        The enzyme specifically catalyzed the hydrolysis of the
        alpha-1,4-glucosidic linkage that bound the maltooligosyl and trehalose
        moieties of maltooligosyl trehalose.
