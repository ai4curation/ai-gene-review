description: cpsG (PP_1777) encodes a ManB/CpsG-type phosphomannomutase. Its primary reaction is the magnesium-dependent interconversion of mannose 6-phosphate and mannose 1-phosphate, supplying mannose 1-phosphate for GDP-mannose and downstream cell-envelope carbohydrate biosynthesis. Direct evidence for physiologically relevant phosphoglucomutase activity is absent.
