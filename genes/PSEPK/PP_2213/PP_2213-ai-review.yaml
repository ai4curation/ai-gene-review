id: Q88KS6
gene_symbol: PP_2213
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_2213 encodes an AMP-forming acyl-CoA synthetase family enzyme. The domain architecture supports adenylate-forming activation of a carboxylate substrate followed by thioester formation with coenzyme A. It belongs to the medium-chain acyl-CoA synthetase (ACSM) family of the ANL adenylate-forming superfamily and carries no fatty acid synthase domains. Its in vivo acyl substrate has not been determined.
existing_annotations:
- term:
    id: GO:0004321
    label: fatty-acyl-CoA synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Wrong reaction. GO:0004321 is the fatty acid synthase reaction (acetyl-CoA
      + n malonyl-CoA + NAD(P)H -> long-chain acyl-CoA, EC 2.3.1.86), not the
      ATP-dependent acyl-CoA synthetase (ligase, EC 6.2.1) reaction that
      PP_2213 performs. The term is not a broader form of fatty acid ligase
      activity, which is already annotated separately.
    action: REMOVE
    reason: >-
      PP_2213 is an AMP-forming acyl-CoA synthetase (EC 6.2.1.-, Pfam AMP-binding,
      PANTHER PTHR43605 acyl-coenzyme A synthetase) with no ketoacyl synthase,
      reductase, dehydratase or acyl carrier domains, so it cannot catalyse the
      multi-step fatty acid synthase reaction this term defines. The row is a
      synthase/synthetase confusion inherited by TreeGrafter from a PAINT IBD on
      the PTHR43605 root node PTN001944787, whose only seed is an RGD IDA on rat
      Acsm4 (O-MACS) from PMID:12709059. That paper reports acyl-CoA synthetase
      activity for fatty acid activation, i.e. the ligase reaction, not fatty acid
      synthesis. The correct activity, fatty acid ligase activity (GO:0015645),
      is already present as its own accepted row.
    supported_by:
    - reference_id: file:PSEPK/PP_2213/PP_2213-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF00501; AMP-binding; 1.
    - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
      supporting_text: "PTHR43605\tPTN001944787\tGO:0004321\tF\tIBD\tfalse\tRGD:727928\ttaxon:\t20170228"
    - reference_id: PMID:12709059
      supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6
        demonstrated an acyl-CoA synthetase activity for fatty acid activation
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001944787
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004321
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The PAINT IBD placing GO:0004321 fatty-acyl-CoA synthase activity (EC
        2.3.1.86, the fatty acid synthase reaction from acetyl-CoA and
        malonyl-CoA) on PTHR43605 root node PTN001944787 should be retracted.
        PTHR43605 is the acyl-coenzyme A synthetase family of AMP-forming
        ligases (EC 6.2.1); its members activate fatty acids to acyl-CoA and
        have none of the fatty acid synthase domains. The IBD's only seed,
        RGD:727928 (rat Acsm4), carries this term from a paper that measured
        acyl-CoA synthetase (ligase) activity. The same node already carries the
        correct GO:0015645 fatty acid ligase activity. Through TreeGrafter and IBA
        the wrong term reaches thousands of family members (in QuickGO,
        2026-11-01, about 9,000 TreeGrafter rows from PTHR43605 graft nodes and
        89 IBA rows).
    - defect_type: WRONG_TERM
      resource: RGD
      record: RGD:727928
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004321
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IDA annotation of rat Acsm4 (O-MACS) to GO:0004321 fatty-acyl-CoA
        synthase activity from PMID:12709059 appears to confuse acyl-CoA
        synthetase (an ATP-dependent ligase, EC 6.2.1) with fatty-acyl-CoA
        synthase (the fatty acid synthase reaction, EC 2.3.1.86). The abstract
        reports "an acyl-CoA synthetase activity for fatty acid activation".
        Acsm4 already carries a ligase term (decanoate-CoA ligase activity), so
        this row can be deleted. Confidence is PROBABLE because only the
        abstract was read. The row seeds PAINT IBD PTN001944787, which spreads
        the error across the PTHR43605 family.
- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Over-annotation. An acyl-CoA synthetase activates existing fatty acids to
      their CoA thioesters; it does not perform a step of fatty acid synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This TreeGrafter row comes from the same PTHR43605 root node
      (PTN001944787) as the wrong fatty-acyl-CoA synthase term, where it is
      seeded by two mouse ACSM genes (MGI:2152200, MGI:99538) whose evidence was
      not examined here. Nothing places PP_2213 in a fatty acid biosynthetic
      pathway: its substrate is unknown, and in bacteria acyl-CoA synthetases of
      this family typically feed acyl-CoA into degradation or other pathways
      rather than de novo synthesis, which runs on acyl carrier protein. The
      supported process is acyl-CoA metabolic process (GO:0006637), already
      accepted. The row is not removed because the mammalian seeds may support
      a fatty acid biosynthesis role in their own lineage.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
      supporting_text: "PTHR43605\tPTN001944787\tGO:0006633\tP\tIBD\tfalse\tMGI:MGI:2152200|MGI:MGI:99538\ttaxon:\t20170228"
- term:
    id: GO:0006637
    label: acyl-CoA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: acyl-CoA metabolic process is consistent with the curated UniProt name, EC/family evidence, and the gene product role summarized here.
    action: ACCEPT
    reason: This is a specific, biologically appropriate annotation for this gene product.
