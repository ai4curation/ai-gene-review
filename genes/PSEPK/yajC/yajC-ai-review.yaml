description: YajC is a small single-pass inner-membrane protein in the conserved YajC family and occurs
  in SecDF-YajC and bacterial holo-translocon assemblies. Its individual mechanistic contribution to
  Sec-dependent export remains unresolved, and it has no established independent catalytic or transporter
  activity.
