taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PycA (PP_5347) is the biotin carboxylase (alpha) subunit of the two-subunit pyruvate carboxylase
  of Pseudomonas putida KT2440. Encoded next to pycB (PP_5346), whose product carries the carboxyltransferase
  and biotin carboxyl carrier domains, it uses ATP and bicarbonate to carboxylate the biotin on PycB;
  PycB then transfers the carboxyl group to pyruvate to form oxaloacetate, an anaplerotic input to the
  TCA cycle. Although UniProt's automatic annotation names it an acetyl-CoA carboxylase biotin carboxylase,
  KT2440 encodes a separate dedicated acetyl-CoA carboxylase (accABCD).
