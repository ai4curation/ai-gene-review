  - *id003
proposed_new_terms:
- proposed_name: ADP-D-glycero-beta-D-manno-heptose biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of ADP-D-glycero-beta-D-manno-heptose.
  justification: The immediate product of the HldE adenylyltransferase reaction is ADP-D-glycero-beta-D-manno-heptose,
    independently of whether a downstream HldD reaction converts it to the L,D stereoisomer. A product-specific
    child of nucleotide-sugar biosynthetic process would represent this chemistry without asserting
    the terminal epimerization step. No additional process annotation is introduced alongside the
    existing broad process refinement.
  proposed_parent:
    id: GO:0009226
    label: nucleotide-sugar biosynthetic process
  supported_by:
  - *id002
  - *id003
suggested_questions:
- question: What is the experimentally established terminal ADP-heptose stereoisomer in KT2440, and
    which protein, if any, supplies the C-6 epimerization step?
suggested_experiments:
- description: Determine KT2440 LPS inner-core heptose stereochemistry and assay candidate NAD-dependent
    epimerases against ADP-D,D-heptose.
  experiment_type: structural glycomics and targeted enzyme screening
