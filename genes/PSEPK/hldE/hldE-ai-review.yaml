- term:
    id: GO:0097171
    label: ADP-L-glycero-beta-D-manno-heptose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: KT2440 encodes no HldD epimerase, so the L,D endpoint asserted by this term is not reached;
      replace with the D,D-heptose process term already proposed in this review.
    action: MODIFY
    proposed_replacement_terms:
    - id: NTR
      label: ADP-D-glycero-beta-D-manno-heptose biosynthetic process
    reason: HldE makes the D,D-heptose nucleotide sugar, and the L,D stereochemistry this term asserts
      is the product of a downstream C-6 epimerase rather than of either HldE domain. The earlier review
      left this UNDECIDED because an unresolved HldD ortholog is not proof of absence. That proof is now
      available from two independent committed sources. PANTHER's member inventory for the HldD family
      shows KT2440's sole PTHR43103 member to be the uronate dehydrogenase Q88NN6 in the 4-epimerase
      subfamily SF5, while the 161-member heptose 6-epimerase subfamily SF3 that contains PSEAE hldD and
      E. coli P67910 has no KT2440 member at all; KT2440 is itself present in that inventory, so the
      absence is not a sampling artefact. The project deep-research page reaches the same conclusion from
      KEGG, UniProt/UniRef, RefSeq and genome-level similarity search, and this gene's notes file already
      recorded that gap. A reproducible UniProt query script and its raw output, with P. aeruginosa as a
      positive control, are committed under this gene's bioinformatics folder. KT2440 therefore terminates
      this pathway at ADP-D-glycero-beta-D-manno-heptose. Because the L,D endpoint is never reached, this
      GO_REF:0000041 UniPathway mapping is false for KT2440 and REMOVE would be sanctioned; MODIFY is
      chosen as the more informative action, since the gene genuinely does make the D,D nucleotide sugar.
      The replacement is the NTR proposed in this review rather than GO:0009226, which is already the
      replacement for the generic GO:0005975 row here and would erase the heptose chemistry. Treated
      identically to the sibling KT2440 gmhB row.
    supported_by:
    - *id002
    - *id003
    - reference_id: file:interpro/panther/PTHR43103/PTHR43103-entries.csv
      supporting_text: Q88NN6,Uronate dehydrogenase,protein,160488,Pseudomonas putida (strain ATCC 47054
