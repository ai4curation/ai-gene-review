  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  findings:
  - statement: E. coli HldE uses heptose 1-phosphate and ATP to make the D,D-heptose nucleotide sugar.
    supporting_text: Synthetic d -β- d -heptose 1-phosphate was incubated with the RfaE protein and
      ATP, resulting in a peak comigrating with synthetic ADP- d -β- d -heptose
  - statement: The intervening GmhB phosphatase generates the substrate for nucleotide activation.
    supporting_text: We concluded from these experiments that the phosphatases from A. thermoaerophilus
      and E. coli K-12 converted the d -β- d -heptose 1,7-bisphosphate intermediate into d -β- d
      -heptose 1-phosphate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text read: E. coli HldE kinase and adenylyltransferase reactions were reconstituted,
      with an intervening GmhB step; A. thermoaerophilus GmhA/GmhB were used in some mixtures. This
      is primary homolog evidence, not direct Q88D93 enzymology.'
