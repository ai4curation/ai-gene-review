id: Q88D93
gene_symbol: hldE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  HldE is a bifunctional enzyme in ADP-heptose precursor biosynthesis. Its
  N-terminal kinase phosphorylates D-glycero-D-manno-heptose 7-phosphate at
  C-1, and its C-terminal adenylyltransferase converts the resulting heptose
  1-phosphate to ADP-D-glycero-beta-D-manno-heptose. Any subsequent C-6
  epimerization to the L,D stereoisomer is performed by a separate HldD enzyme.
