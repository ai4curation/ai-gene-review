core_functions:
- description: N-terminal ATP-dependent heptose 7-phosphate kinase generating beta-heptose 1,7-bisphosphate;
    assigned to KT2440 by curated HldE-specific domain and rule evidence.
  molecular_function: *id004
  directly_involved_in:
  - *id006
  supported_by:
  - *id001
- description: C-terminal heptose-1-phosphate adenylyltransferase transferring AMP from ATP to the
    GmhB-generated heptose 1-phosphate, producing ADP-D,D-heptose and pyrophosphate; this enzyme
    does not perform terminal C-6 epimerization.
  molecular_function: *id005
  directly_involved_in:
  - *id006
  supported_by:
