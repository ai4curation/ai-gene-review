proposed_new_terms:
  - proposed_name: ADP-D-glycero-beta-D-manno-heptose biosynthetic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the formation of
      ADP-D-glycero-beta-D-manno-heptose.
    justification: >-
      HldE forms the D,D-heptose nucleotide sugar directly, whereas the only
      specific GO process term names the downstream L,D stereoisomer. KT2440
      lacks a resolved HldD ortholog, so the D,D endpoint must be representable
      without asserting terminal C-6 epimerization.
    proposed_parent:
      id: GO:0009226
      label: nucleotide-sugar biosynthetic process
    supported_by:
      - reference_id: file:PSEPK/hldE/hldE-uniprot.txt
        supporting_text: yielding ADP-D-glycero-beta-D-manno-heptose
      - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__adp-heptose-biosynthesis__ppu00541-deep-research-openscientist.md
        supporting_text: >-
          steps 1–4 still make ADP-D-glycero-D-manno-heptose
suggested_questions:
  - question: Does KT2440 incorporate D,D-heptose directly into its LPS core, or is HldD chemistry supplied by a non-orthologous enzyme?
suggested_experiments:
  - description: Determine KT2440 LPS inner-core heptose stereochemistry and assay candidate NAD-dependent epimerases against ADP-D,D-heptose.
    experiment_type: structural glycomics and targeted enzyme screening
