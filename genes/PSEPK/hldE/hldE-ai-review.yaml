- id: file:projects/P_PUTIDA/deep-research/PSEPK__adp-heptose-biosynthesis__ppu00541-deep-research-openscientist.md
  title: OpenScientist PSEPK ADP-heptose biosynthesis synthesis
  findings:
  - statement: Generated pathway synthesis flags an unresolved KT2440 terminal epimerase assignment;
      its reported failure to find HldD has not been independently reproduced and does not establish
      biological absence.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Useful research lead, not primary evidence or a demonstrated genome-wide absence
      of HldD. No catalytic or stereochemical endpoint claim depends on this generated report.
- id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  findings:
  - statement: E. coli HldE uses heptose 1-phosphate and ATP to make the D,D-heptose nucleotide sugar.
    supporting_text: Synthetic d -β- d -heptose 1-phosphate was incubated with the RfaE protein and
      ATP, resulting in a peak comigrating with synthetic ADP- d -β- d -heptose
  - statement: The intervening GmhB phosphatase generates the substrate for nucleotide activation.
    supporting_text: We concluded from these experiments that the phosphatases from A. thermoaerophilus
      and E. coli K-12 converted the d -β- d -heptose 1,7-bisphosphate intermediate into d -β- d
      -heptose 1-phosphate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text read: E. coli HldE kinase and adenylyltransferase reactions were reconstituted,
      with an intervening GmhB step; A. thermoaerophilus GmhA/GmhB were used in some mixtures. This
      is primary homolog evidence, not direct Q88D93 enzymology.'
core_functions:
- description: N-terminal ATP-dependent heptose 7-phosphate kinase generating beta-heptose 1,7-bisphosphate;
    assigned to KT2440 by curated HldE-specific domain and rule evidence.
  molecular_function: *id004
  directly_involved_in:
  - *id006
  supported_by:
  - *id001
- description: C-terminal heptose-1-phosphate adenylyltransferase transferring AMP from ATP to the
    GmhB-generated heptose 1-phosphate, producing ADP-D,D-heptose and pyrophosphate; this enzyme
    does not perform terminal C-6 epimerization.
  molecular_function: *id005
  directly_involved_in:
  - *id006
  supported_by:
  - *id002
  - *id003
proposed_new_terms:
- proposed_name: ADP-D-glycero-beta-D-manno-heptose biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of ADP-D-glycero-beta-D-manno-heptose.
  justification: The immediate product of the HldE adenylyltransferase reaction is ADP-D-glycero-beta-D-manno-heptose,
    independently of whether a downstream HldD reaction converts it to the L,D stereoisomer. A product-specific
    child of nucleotide-sugar biosynthetic process would represent this chemistry without asserting
    the terminal epimerization step. No additional process annotation is introduced alongside the
    existing broad process refinement.
  proposed_parent:
    id: GO:0009226
    label: nucleotide-sugar biosynthetic process
  supported_by:
  - *id002
  - *id003
suggested_questions:
- question: What is the experimentally established terminal ADP-heptose stereoisomer in KT2440, and
    which protein, if any, supplies the C-6 epimerization step?
suggested_experiments:
- description: Determine KT2440 LPS inner-core heptose stereochemistry and assay candidate NAD-dependent
    epimerases against ADP-D,D-heptose.
  experiment_type: structural glycomics and targeted enzyme screening
