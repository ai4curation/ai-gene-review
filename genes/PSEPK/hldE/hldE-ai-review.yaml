- id: file:PSEPK/hldE/hldE-uniprot.txt
  title: UniProtKB reviewed entry for hldE (Q88D93)
  findings:
  - statement: HldE has kinase and adenylyltransferase domains that catalyze separate steps on either
      side of GmhB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'HAMAP and two domain signatures support the bifunctional protein. The C-terminal
      CC:FUNCTION phrase ADP transfer is chemically inaccurate: CC:CATALYTIC ACTIVITY correctly gives
      ATP plus heptose 1-phosphate to ADP-heptose plus diphosphate. Quotes use the reaction equation
      rather than the misleading phrase.'
