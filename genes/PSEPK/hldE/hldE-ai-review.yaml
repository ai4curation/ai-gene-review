  review:
    summary: Cytosolic localization is consistent with soluble HldE-mediated nucleotide-sugar metabolism.
    action: ACCEPT
    reason: Resolved now that the family review for PTHR46969 exists. The descent step matters, so it is
      stated explicitly rather than glossed. This GO_REF:0000118 row is a TreeGrafter assignment whose
      with/from is the graft node PTN005327360, not the PAINT node itself, and the cytosol IBD for this
      family sits at PTN000062036. TreeGrafter grafts the target onto the PANTHER tree and transfers
      terms from PAINT-annotated ancestors, so the row asserts that PTN005327360 lies at or below
      PTN000062036. That ancestry follows from the mechanism rather than from anything checkable in the
      committed PAINT slice, which records IBD rows only and no tree topology, and it is the one
      unverified link in this argument. Granting it, the claim inherits experimental grounding, because
      the PTN000062036 cytosol assertion is seeded by E. coli HldE itself, whose own cytosol rows are IDA
      against the K-12 fractionation proteome and the cytosolic abundance proteome, and the node is
      assessed SOUND in the family review. Independently of the propagation, HldE is a soluble enzyme
      acting on cytoplasmic phosphosugars and E. coli HldE is recovered in the soluble fraction after
      membranes are removed. No competing compartment is proposed for any member of the family. Accepted
      for consistency with the E. coli hldE and gmhB rows, which accept cytosol on the same claim; this
      is the compartment the core activity operates in, so it is not marked non-core.
