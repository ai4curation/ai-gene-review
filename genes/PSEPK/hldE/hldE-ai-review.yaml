id: Q88D93
gene_symbol: hldE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HldE is a bifunctional nucleotide-sugar biosynthetic enzyme of Pseudomonas putida KT2440.
  Its N-terminal kinase domain uses ATP to phosphorylate D-glycero-beta-D-manno-heptose 7-phosphate
  at C-1. After the separate GmhB phosphatase removes the C-7 phosphate, the C-terminal adenylyltransferase
  domain transfers AMP from ATP to heptose 1-phosphate, producing ADP-D-glycero-beta-D-manno-heptose
  and pyrophosphate. Conversion to the L-glycero stereoisomer requires a separate C-6 epimerase reaction.
