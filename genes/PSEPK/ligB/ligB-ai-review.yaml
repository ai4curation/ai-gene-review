description: LigB is a secondary bacterial NAD-dependent DNA ligase that can seal phosphodiester nicks in double-stranded DNA. Its exact biochemical activity is well supported, but its physiological pathway in KT2440 is unresolved and LigA, not LigB, is the required NER ligase.
