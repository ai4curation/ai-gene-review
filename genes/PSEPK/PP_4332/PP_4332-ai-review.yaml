      True but general. CheW acts in the chemotaxis His-Asp phosphorelay by
      coupling receptor signaling to CheA autophosphorylation.
    action: MODIFY
    reason: >-
      Correct but general. CheW is required for receptor-controlled
      activation of CheA autophosphorylation, the first step of the
      chemotaxis phosphorelay; the specific process is phosphorelay signal
      transduction system (GO:0000160, a descendant of signal transduction).
    proposed_replacement_terms:
