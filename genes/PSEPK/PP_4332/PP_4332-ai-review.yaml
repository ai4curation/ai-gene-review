suggested_questions:
- question: >-
    Are PP_4332 and the adjacent CheW-domain protein PP_4333 redundant
    couplers in the flagellar array, or does PP_4333 serve a distinct role
    (e.g. a CheW-like scaffold for a subset of receptors)?
suggested_experiments:
- hypothesis: PP_4332 is the principal CheW required for flagellar chemotaxis in KT2440.
  description: >-
    Make single and double in-frame deletions of PP_4332 and PP_4333, assay
    chemotaxis (capillary and soft-agar) and polar chemoreceptor array
    formation (fluorescent CheA or CheY fusions), and test complementation by
    each paralogue.
  experiment_type: genetics and cell imaging
