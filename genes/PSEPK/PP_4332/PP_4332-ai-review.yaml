- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:11923283
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A964
  review:
    summary: >-
      Proposed new MF: CheW is the adaptor that bridges chemoreceptors and
      CheA in the ternary signaling complex. Inferred from E. coli CheW
      (P0A964) through CheW-subfamily membership.
    action: NEW
    reason: >-
      GOA has no MF for PP_4332. E. coli CheW binds both CheA and the Tar
      receptor and these binding interactions are each required for active
      ternary complex formation and chemotaxis, matching the GO definition of
      molecular adaptor activity (brings together two or more molecules
      through selective non-covalent interactions so they function in a
      coordinated way). PP_4332 is a single-domain CheW of the CheW subfamily
      (PANTHER PTHR22617:SF23; InterPro IPR039315), not a CheA- or CheV-type
      CheW-domain fusion, so the adaptor role is transferred by ISS with E.
      coli CheW as the with/from. This is the module-asserted function for
      CheW.
    supported_by:
    - reference_id: PMID:11923283
      supporting_text: Because CheW can bind to CheA and to Tar, it is thought to serve as an adapter protein in this complex.
    - reference_id: PMID:11923283
      supporting_text: mutations which eliminate CheW binding to Tar (V36M) or to CheA (G57D) result in a complete inability to form active ternary complexes in vitro and render the CheW protein incapable of mediating chemotaxis in vivo
    - reference_id: file:PSEPK/PP_4332/PP_4332-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR22617:SF23; CHEMOTAXIS PROTEIN CHEW; 1.
