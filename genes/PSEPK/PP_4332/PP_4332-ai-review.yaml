  review:
    summary: CheW is an essential core component of the chemotaxis signaling complex; PP_4332 is the CheW
      of the KT2440 flagellar chemotaxis cluster.
    action: ACCEPT
    reason: 'CheW does part of the work of chemotaxis: it couples receptors to CheA within the ternary
      signaling complex. E. coli CheW variants unable to bind Tar or CheA cannot form active ternary complexes
      and cannot mediate chemotaxis. PP_4332 is a member of the CheW subfamily (InterPro IPR039315, PANTHER
      PTHR22617:SF23) and is listed as the CheW of the KT2440 core cascade in the module synthesis. No
      KT2440 PP_4332 mutant phenotype is in the cached literature.'
    supported_by:
