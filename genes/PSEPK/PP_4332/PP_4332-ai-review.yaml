    summary: >-
      TreeGrafter propagation from the PANTHER CheW subfamily node. CheW is a
      soluble cytoplasmic protein that functions at the cytoplasmic face of
      membrane chemoreceptor arrays.
    action: ACCEPT
    reason: >-
      The protein has no transmembrane segment or signal peptide and consists
      solely of the CheW-like domain, consistent with a cytosolic location.
      CheW in E. coli acts in cytoplasmic complexes with CheA and the
      receptor cytoplasmic domains. No KT2440 localization study refines this
      (e.g. to a polar array), so cytosol is kept, consistent with the soluble
      relay proteins of this pathway.
