    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002545
  - InterPro:IPR036061
  - InterPro:IPR039315
  - PANTHER:PTN002332546
  review:
    summary: >-
      CheW is an essential core component of the chemotaxis signaling complex;
      PP_4332 is the CheW of the KT2440 flagellar chemotaxis cluster.
    action: ACCEPT
    reason: >-
      CheW does part of the work of chemotaxis: it couples receptors to CheA
      within the ternary signaling complex. E. coli CheW variants unable to
      bind Tar or CheA cannot form active ternary complexes and cannot
      mediate chemotaxis. PP_4332 is a member of the CheW subfamily
      (InterPro IPR039315, PANTHER PTHR22617:SF23) and is listed as the CheW
      of the KT2440 core cascade in the module synthesis. No KT2440 PP_4332
      mutant phenotype is in the cached literature.
    supported_by:
    - reference_id: PMID:11923283
      supporting_text: mutations which eliminate CheW binding to Tar (V36M) or to CheA (G57D) result in a complete inability to form active ternary complexes in vitro and render the CheW protein incapable of mediating chemotaxis in vivo
    - reference_id: file:PSEPK/PP_4332/PP_4332-uniprot.txt
