  label: Pseudomonas putida KT2440
description: PP_4332 encodes the canonical CheW coupling protein of the flagellar chemotaxis gene cluster
  of Pseudomonas putida KT2440. It is a small (159 aa) soluble protein consisting of a single CheW domain
  (two SH3-like beta-barrel subdomains) and belongs to the CheW subfamily of the CheA/CheW family. By
  homology with E. coli CheW, it acts as an adaptor that binds both the cytoplasmic tips of methyl-accepting
  chemotaxis receptors and the P5 regulatory domain of the histidine kinase CheA, assembling receptor-CheW-CheA
  core signaling units and the extended chemoreceptor arrays in which receptors activate and control CheA
  autophosphorylation. KT2440 encodes a second, adjacent CheW-domain protein (PP_4333) whose relationship
  to PP_4332 is unresolved.
