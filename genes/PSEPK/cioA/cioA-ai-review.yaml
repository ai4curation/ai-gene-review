  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 
    11950 / KT2440)
description: cioA encodes the cyanide-insensitive cytochrome bd-family ubiquinol
  oxidase catalytic subunit I in Pseudomonas putida KT2440. The protein acts in 
  a plasma-membrane terminal oxidase branch that reduces oxygen to water and 
  supports aerobic respiratory energy conservation. Its subunit-specific role is
  distinguished from the emergent catalytic activity of the assembled oxidase 
  complex.
