id: Q88D00
gene_symbol: hutG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutG (PP_5029) is a predicted N-formylglutamate deformylase that hydrolyzes
  N-formyl-L-glutamate to L-glutamate and formate. In KT2440 this is the second
  of two terminal reactions in the formate-producing branch of histidine
  catabolism, acting after HutF. The assignment is supported by the encoded EC
  number and HutG/N-formylglutamate-amidohydrolase family signatures, but not
  by target-specific biochemical evidence.
existing_annotations:
- term:
    id: GO:0050129
    label: N-formylglutamate deformylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: HutG is predicted to hydrolyze N-formyl-L-glutamate to glutamate and formate.
    action: ACCEPT
    reason: >-
      The EC 3.5.1.68 assignment is concordant with the HutG-specific
      IPR010247, N-formylglutamate-amidohydrolase IPR007709, NCBIfam TIGR02017,
      and Pfam FGase signatures. The evidence is predictive, so the review does
      not claim direct KT2440 enzymology.
    supported_by:
    - reference_id: file:PSEPK/hutG/hutG-uniprot.txt
      supporting_text: "DR   GO; GO:0050129; F:N-formylglutamate deformylase activity; IEA:UniProtKB-EC."
    - reference_id: file:PSEPK/hutG/hutG-uniprot.txt
      supporting_text: "DR   InterPro; IPR010247; HutG_amidohyd."
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IC
  original_reference_id: file:modules/histidine_catabolism.yaml
  qualifier: involved_in
  review:
    summary: HutG completes the bacterial formate-producing branch of histidine catabolism.
    action: NEW
    reason: >-
      The accepted N-formylglutamate deformylase activity consumes the HutF
      product and releases the pathway endpoint L-glutamate.
    supported_by:
    - reference_id: file:modules/histidine_catabolism.yaml
      supporting_text: "HutG hydrolyzes N-formylglutamate to L-glutamate and formate"
