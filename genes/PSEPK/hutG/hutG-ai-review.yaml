  title: Organization and multiple regulation of histidine utilization genes in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: The cloned P. putida hut locus identifies hutG as the N-formylglutamate-amidohydrolase gene.
    supporting_text: "hutG, which specifies N-formylglutamate amidohydrolase"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PubMed-cached abstract directly identifies hutG in an experimentally
      mapped P. putida histidine-utilization locus. It does not name KT2440, so
      support for Q88D00 is same-species locus orthology rather than a direct
      KT2440 assay.
