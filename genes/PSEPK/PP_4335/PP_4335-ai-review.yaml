- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  evidence_type: IC
  original_reference_id: PMID:36409076
  qualifier: contributes_to
  review:
    summary: >-
      Proposed new MF (contributes_to): as part of the MotCD stator, MotD
      contributes to the proton channel coupling proton influx to torque.
    action: NEW
    reason: >-
      In MotA/MotB-type stators the B-subunit transmembrane helix forms part of the proton
      channel, and the periplasmic domain gates channel activation and anchors the stator to
      peptidoglycan. P. aeruginosa MotCD uses proton motive force. The activity belongs to the
      assembled complex, hence contributes_to; this is the module-asserted complex activity for
      the MotC/MotD stator. Curator inference (IC); not measured for KT2440 MotCD. KT2440 pair
      identity is established by PMID:36409076; the paper does not directly measure proton
      versus sodium selectivity. The ion assignment is a homology-supported inference, and a
      generic MotA/TolQ/ExbB or OmpA domain alone would not establish stator identity or proton
      specificity.
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: In Pseudomonas aeruginosa, the two stators, MotAB and MotCD, use proton motive force to power the rotation of a single flagellum.
    - reference_id: PMID:31452860
      supporting_text: Each stator unit is composed of two transmembrane proteins, MotA and MotB, and acts as a transmembrane proton channel to couple the proton flow through the channel with torque generation
    - reference_id: PMID:31452860
      supporting_text: The MotA4/MotB2 complex is anchored to the peptidoglycan (PG) layer through direct interactions of the C-terminal periplasmic domain of MotB with the PG layer to become an active stator unit around the rotor [4].
