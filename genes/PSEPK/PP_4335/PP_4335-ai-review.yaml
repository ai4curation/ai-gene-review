gene_symbol: PP_4335
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_4335 encodes MotD, the B-type (MotB-like) subunit of the MotCD
  flagellar stator of Pseudomonas putida KT2440. It is a bitopic
  inner-membrane protein with a single N-terminal transmembrane helix
  followed by a periplasmic plug segment (Pfam MotB_plug) and a C-terminal
  OmpA-like peptidoglycan-binding domain, and it is 70% identical to
  Pseudomonas aeruginosa MotD. Encoded with MotC (PP_4336) in the flagellar
  gene cluster, it forms the proton-driven MotCD stator, one of the two
  stators (with MotAB) that power the polar flagella. By homology with MotB,
  the transmembrane helix lines the stator proton channel together with the
  A subunits, the plug keeps the channel closed until the stator engages the
  rotor, and the OmpA-like domain anchors the active stator to the
  peptidoglycan layer. In KT2440 the MotCD stator is dispensable for
  swimming in liquid but needed for efficient spreading through semisolid
  agar, where its absence causes sessile cell clusters.
