- term:
    id: GO:0071977
    label: bacterial-type flagellum-dependent swimming motility
  evidence_type: IMP
  original_reference_id: PMID:36409076
  qualifier: involved_in
  review:
    summary: >-
      Proposed new process from KT2440 genetics: deletion of motCD
      (PP_4336-PP_4335) slows spreading in semisolid swimming agar; the
      double stator mutant is nonmotile; complementation restores spreading.
    action: NEW
    reason: >-
      As the B subunit of a torque-generating stator, MotD does part of the
      work of flagellar swimming. The cited study deleted PP_4336 and PP_4335
      together and complemented at the native locus, so IMP applies to both
      genes. The phenotype is in swimming through semisolid agar; in liquid
      MotAB suffices.
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: P. putida has a large gene cluster for flagellar motility comprising the genes for the stator MotCD (PP4336 and PP4335).
    - reference_id: PMID:36409076
      supporting_text: For both agar concentrations, the ΔmotAB culture spreads almost as quickly as the wild type, whereas the ΔmotCD culture spreads considerably more slowly.
    - reference_id: PMID:36409076
      supporting_text: The double mutant ΔmotAB ΔmotCD is nonmotile.
