suggested_questions:
- question: >-
    Does the MotD OmpA-like domain bind peptidoglycan in a load-dependent
    manner, and does this underlie MotCD's specific role in semisolid
    environments?
suggested_experiments:
- hypothesis: MotD anchors the MotCD stator to peptidoglycan and gates its proton channel.
  description: >-
    Test purified MotD periplasmic domain for peptidoglycan binding
    (pull-down) and introduce plug and conserved transmembrane Asp mutations
    into chromosomal motD in a motAB background, measuring growth (proton
    leak), stator localization and swimming in semisolid agar.
  experiment_type: biochemistry and genetics
