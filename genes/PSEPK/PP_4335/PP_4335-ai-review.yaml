core_functions:
- description: >-
    B-type subunit of the proton-driven MotCD flagellar stator: its transmembrane helix
    contributes to the stator proton channel and its periplasmic OmpA-like domain is expected to
    anchor the stator to peptidoglycan, supporting KT2440 swimming through semisolid
    environments. KT2440 genetics establishes the stator-pair motility role; proton specificity
    is inferred from homologous Pseudomonas stators and conserved architecture, not from direct
    ion-selectivity measurements on this KT2440 complex.
