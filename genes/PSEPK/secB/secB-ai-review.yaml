id: Q88CX7
gene_symbol: secB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: SecB is a soluble cytoplasmic export chaperone that binds a subset of newly synthesized Sec
  precursors, prevents their premature folding, and delivers them to the SecA motor in a translocation-competent
  state. It functions as a homotetramer in the post-translational branch of bacterial Sec export.
