id: Q88ER4
gene_symbol: flgD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FlgD is the flagellar hook-cap protein of Pseudomonas putida KT2440. Its conserved
  FlgD architecture supports a transient scaffold at the distal end of the growing rod/hook
  that promotes hook assembly. The cap role is inferred from homologous structural and functional
  studies; a target-specific oligomeric structure has not been determined.
references:
- id: file:PSEPK/flgD/flgD-uniprot.txt
  title: Frozen UniProt record for PSEPK flgD
  findings: []
- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports
      the homologous role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
      FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC
      or FljB) and the filament cap (FliD)'
- id: PMID:34785766
  title: Structure of the bacterial flagellar hook cap provides insights into a hook assembly
    mechanism.
  findings:
  - statement: Salmonella FlgD forms a pentameric hook cap; structural, secretion and complementation
      work supports a scaffold role. KT2440 assignment is family-based, not a target assay.
    supporting_text: we report the crystal structure of the hook cap composed of five subunits
      of FlgD from Salmonella enterica at 3.3
