  review:
    action: NEW
    summary: FlgD provides a structural scaffold for hook assembly.
    reason: Comparative crystallography resolves an oligomeric FlgD cap and functional experiments test
      its assembly role. The KT2440 protein has FlgD-specific NCBIfam and InterPro signatures. This supplies
      structure rather than an autonomous enzymatic reaction.
