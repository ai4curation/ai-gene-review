    label: bacterial-type flagellum assembly
  evidence_type: IC
  original_reference_id: PMID:34785766
  review:
    action: NEW
    summary: FlgD directly contributes the hook-assembly scaffold.
    reason: The cap organizes assembly at the growing hook, so FlgD performs structural work rather than
      merely being an exported substrate. Six reviewed FlgD comparators currently have no assembly BP
      in QuickGO (only two retrieved manual binding/location rows); therefore no annotation-gap consensus
      is claimed. The independent positive argument is the resolved cap/scaffold mechanism in PMID34785766
      plus target-specific FlgD architecture. Target-specific genetics remain untested.
    supported_by: *id001
