id: Q88CW7
gene_symbol: betB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: betB (PP_5063) encodes the predicted NAD-dependent betaine-aldehyde dehydrogenase of the
  Pseudomonas putida KT2440 betIBA operon. Its assigned reaction oxidizes betaine aldehyde to glycine
  betaine while reducing NAD+ to NADH. Specific BADH-family signatures and KT2440 betBA genetics support
  its role as the second enzyme in choline oxidation and osmoprotection. Tetrameric organization and potassium
  binding are inferred from the curated family rule rather than direct measurements on Q88CW7.
existing_annotations:
- term:
    id: GO:0008802
    label: betaine-aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reviewed UniProt record and KT2440 pathway literature agree that BetB catalyzes the irreversible
      NAD-dependent aldehyde-to-betaine step.
    action: ACCEPT
    reason: This is the specific core molecular function of the dedicated BetB enzyme. The curated HAMAP
      rule MF_00804 (BADH) assigns the NAD-dependent betaine aldehyde to glycine betaine reaction and
      places the four catalytic residues (ACT_SITE 162, 252, 286, 464); NCBIfam TIGR01804 (BADH) agrees
      on family membership. In KT2440, betBA are genetically required for choline conversion to glycine
      betaine (PMID:17116241, abstract only); that is pathway-level evidence for the betBA pair, not a
      purified-BetB assay.
    supported_by:
    - reference_id: file:PSEPK/betB/betB-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=betaine aldehyde + NAD(+) + H2O = glycine betaine + NADH + 2
    - reference_id: file:PSEPK/betB/betB-uniprot.txt
      record_section:
      - DR:HAMAP
      supporting_text: DR   HAMAP; MF_00804; BADH; 1.
    - reference_id: file:PSEPK/betB/betB-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: DR   NCBIfam; TIGR01804; BADH; 1.
    - reference_id: PMID:17116241
      supporting_text: the betBA genes were required for choline transformation into the highly effective
        compatible solute glycine betaine
