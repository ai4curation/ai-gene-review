  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO metal ion binding from the BADH signature; the curated rule specifies potassium.
    action: MODIFY
    reason: The curated HAMAP MF_00804 assignment specifies potassium-binding sites, supporting refinement
      to GO:0030955 potassium ion binding. This is a rule-based structural/cofactor inference. Salt tolerance
      or activity at high K+ alone is not a direct demonstration of a bound potassium ion, and no target
      metal-binding assay is claimed.
