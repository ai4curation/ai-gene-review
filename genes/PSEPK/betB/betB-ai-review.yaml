id: Q88CW7
gene_symbol: betB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  betB (PP_5063) encodes the dedicated NAD-dependent betaine-aldehyde
  dehydrogenase of the betIBA operon. It irreversibly oxidizes betaine aldehyde,
  produced from choline by BetA, to glycine betaine while reducing NAD+ to NADH.
  The tetrameric potassium-binding enzyme performs the second consecutive step
  of glycine-betaine biosynthesis and supports osmoprotection in Pseudomonas
  putida KT2440.
