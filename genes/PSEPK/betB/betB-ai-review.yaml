    label: glycine betaine biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/betB/betB-notes.md
  qualifier: involved_in
  review:
    summary: BetB performs the terminal aldehyde oxidation in the KT2440 choline-to-glycine-betaine pathway.
    action: NEW
    reason: The accepted betaine-aldehyde dehydrogenase activity and organism-specific betIBA pathway
      reconstruction support this missing process annotation. This row originally proposed GO:0019285
      (glycine betaine biosynthetic process from choline), which was retired in GO release 2026-05-19
      with replaced_by GO:0031456; the choline route is carried by the dehydrogenase MF and by the bacterial_choline_to_glycine_betaine_biosynthesis
      module.
    supported_by:
