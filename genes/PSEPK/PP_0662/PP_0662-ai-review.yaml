taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida KT2440}
description: >-
  PP_0662 encodes a predicted pyridoxal-phosphate-dependent threonine
  synthase-like protein. It shares broad PLP-enzyme and threonine-synthase-like
  signatures with canonical ThrC, but lacks the ThrC-specific NCBIfam and
  InterPro signatures present on PP_1471. Its catalytic activity and in-vivo
  role therefore remain unresolved.
