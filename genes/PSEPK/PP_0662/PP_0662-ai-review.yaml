  label: Pseudomonas putida KT2440
description: PP_0662 is a threonine-synthase-like protein with an N-terminal threonine-synthase domain
  and a PLP-enzyme fold. It shares the conserved lysine-containing catalytic region with ThrC/PP_1471,
  making threonine synthase activity plausible. Its exact substrate specificity and physiological role
  in KT2440 remain unresolved.
