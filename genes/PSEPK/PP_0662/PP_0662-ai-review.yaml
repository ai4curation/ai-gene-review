gene_symbol: PP_0662
product_type: PROTEIN
status: DRAFT
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida KT2440}
description: >-
  PP_0662 encodes a predicted pyridoxal-phosphate-dependent threonine
  synthase-like enzyme. Its family architecture supports the O-phospho-L-
  homoserine-to-L-threonine reaction, but direct catalysis and its contribution
  relative to canonical ThrC/PP_1471 have not been established.
