suggested_questions:
- question: Does PP_0662 catalyze threonine synthesis in vivo, and under which conditions can it complement
    loss of canonical ThrC/PP_1471?
- question: Does the shared PLP-enzyme architecture and conserved Lys112 correspond to threonine synthase
    chemistry or another substrate specificity? Missing signature calls alone do not answer this.
suggested_experiments:
- description: Test purified PP_0662 against O-phospho-L-homoserine and related PLP-enzyme substrates,
    and assay complementation of a thrC deletion.
  experiment_type: biochemical assay and genetic complementation
