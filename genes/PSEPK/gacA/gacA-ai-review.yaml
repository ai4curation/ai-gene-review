suggested_questions:
- question: Which KT2440 promoters besides rsmY and rsmZ are bound directly by phosphorylated GacA?
- question: Is K1-T6SS activation by GacA mediated by the Rsm proteins, RpoS, or direct promoter binding?
suggested_experiments:
- hypothesis: Phosphorylated GacA binds a small set of KT2440 promoters, led by rsmY and rsmZ.
  description: >-
    ChIP-seq of an epitope-tagged chromosomal gacA in wild type and gacS
    backgrounds, with EMSA of purified GacA (with and without
    acetyl-phosphate) on the rsmY and rsmZ upstream regions.
  experiment_type: ChIP-seq and EMSA
- hypothesis: Asp54 phosphorylation is required for GacA-dependent sRNA transcription and biofilm phenotypes.
  description: >-
    Replace gacA with D54A and D54E alleles and measure rsmY/rsmZ promoter
    activity, lapA expression and biofilm biomass.
  experiment_type: targeted mutagenesis and phenotyping
