  title: Curator notes for gacA in Pseudomonas putida KT2440
  findings:
  - statement: KT2440 literature best supports GacA as a phosphorelay response regulator that promotes
      biofilm-associated adhesin expression and other lifestyle outputs.
  - statement: Direct KT2440 evidence is strongest for biofilm regulation and K1-T6SS regulation, while
      other outputs are more strain-specific.
  - statement: GO:0003677 is too general; phosphorelay response regulator activity is a better core molecular-function
      summary.
