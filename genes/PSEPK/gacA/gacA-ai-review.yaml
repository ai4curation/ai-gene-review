  label: Pseudomonas putida KT2440
description: >-
  GacA is the response regulator of the GacS/GacA two-component system, a
  NarL/FixJ-type protein with an N-terminal receiver domain carrying the
  phosphoacceptor Asp54 and a C-terminal LuxR-type helix-turn-helix DNA-binding
  domain. The orthologous GacS/BarA kinases phosphorylate it on the receiver
  aspartate. Phosphorylated GacA then activates transcription of genes for small
  regulatory RNAs (RsmY and RsmZ in KT2440, whose promoters carry conserved
  GacA binding sites). These RNAs sequester the RsmA/CsrA-family translational
  repressors. Through this cascade and RpoS, GacA governs lifestyle traits in
  KT2440: transcription of the LapA and LapF adhesin genes, biofilm formation
  under high c-di-GMP, and activation of the K1 type VI secretion system.
