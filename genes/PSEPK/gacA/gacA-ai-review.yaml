  label: Pseudomonas putida KT2440
description: GacA is the response-regulator output of the GacS/GacA two-component system in Pseudomonas
  putida KT2440. It contains an N-terminal receiver domain and a C-terminal LuxR-type DNA-binding domain.
  Gac signaling controls small-RNA-dependent regulatory cascades and influences adhesin expression, c-di-GMP-dependent
  biofilm development and K1 type VI secretion-system expression. These downstream outputs include indirect
  regulatory steps; the promoter contacts of KT2440 GacA remain incompletely resolved. Conserved GacA-binding
  motifs upstream of the KT2440 rsmY and rsmZ small-RNA genes support their assignment as candidate direct
  targets. These RNAs antagonize Rsm proteins; motif conservation alone does not establish GacA occupancy.
