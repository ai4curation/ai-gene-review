suggested_questions:
- question: Which KT2440 promoters or regulatory RNAs are direct binding targets of phosphorylated GacA?
- question: Is K1-T6SS control by GacA direct, or does it flow through Rsm, FleQ, RpoN, or other intermediate
    regulators?
- question: What environmental or physiological signals activate GacS/GacA during surface growth and interbacterial
    competition in KT2440?
suggested_experiments:
- hypothesis: GacA directly binds a limited set of promoters or sRNA loci that seed the broader KT2440
    Gac regulon.
  description: Construct an epitope-tagged functional GacA strain and perform ChIP-seq under planktonic,
    surface-grown, and stationary-phase conditions, ideally alongside a phosphomimetic or phosphodead
    allele to identify phosphorylation-dependent binding sites.
  experiment_type: ChIP-seq
- hypothesis: The biofilm and T6SS phenotypes attributed to GacA separate into direct and indirect branches
    of the regulon.
  description: Compare RNA-seq profiles of wild type, gacA loss-of-function, gacS loss-of-function, and
    phosphosite-mutant gacA strains during planktonic growth, surface attachment, and late growth, then
    integrate with promoter-reporter assays for lapA, lapF, rpoS, and the K1-T6SS promoters.
  experiment_type: RNA-seq and promoter-reporter analysis
- hypothesis: Phosphorylation of Asp54 is required for the adhesin- and T6SS-regulatory outputs of GacA.
  description: Complement a gacA mutant with wild-type, D54A, and D54E alleles and quantify biofilm biomass,
    lapA/lapF promoter activity, and K1-T6SS expression or competition phenotypes.
  experiment_type: targeted mutagenesis and phenotyping
