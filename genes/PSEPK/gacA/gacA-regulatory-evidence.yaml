- id: gaca-k1-system
  target:
    name: K1-T6SS PS/PV promoters
    type: promoter
  regulatory_level: transcription
  effect: activates
  directness: unresolved
  experimental_strain: P. putida KT2440 and gacS regulatory mutant
  condition: Promoter-expression measurements across growth in the global-regulator panel.
  evidence:
  - reference_id: PMID:36748579
    assay: KT2440 PS/PV-lacZ reporter activities in global-regulator mutants, including gacS; no gacA
      mutant or GacA-binding experiment in this study.
    supporting_text: the two-component system GacS–GacA was found to activate the expression of the two
      K1-T6SS promoters
    source_url: https://pubmed.ncbi.nlm.nih.gov/36748579/
  interpretation: Gac-system signaling promotes both K1-T6SS transcription units; attribution to GacA
    uses its established response-regulator role.
  limitations:
  - The experimental deletion is gacS, not gacA.
  - No GacA binding or promoter-site mutation was demonstrated; intervening Rsm regulation may contribute.
