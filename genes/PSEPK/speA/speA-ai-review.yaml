- id: file:PSEPK/speA/speA-uniprot.txt
  title: UniProtKB entry Q88QC7 for Pseudomonas putida KT2440 SpeA
  findings:
  - statement: Q88QC7 is a reviewed biosynthetic arginine decarboxylase assigned EC 4.1.1.19.
    supporting_text: 'RecName: Full=Biosynthetic arginine decarboxylase'
