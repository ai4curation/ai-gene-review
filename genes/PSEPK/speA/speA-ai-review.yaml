  review:
    summary: SpeA is catalytic, but this root term does not identify its reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0008792 captures the specific L-arginine decarboxylation performed by
      the SpeA family and is already present in this annotation set.
