id: Q88QC7
gene_symbol: speA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SpeA (PP_0567) is the biosynthetic arginine decarboxylase that uses
  pyridoxal 5'-phosphate and magnesium to convert L-arginine to agmatine.
  Agmatine can then be converted to putrescine, placing SpeA at the first step
  of the arginine-derived putrescine route and upstream of spermidine synthesis.
