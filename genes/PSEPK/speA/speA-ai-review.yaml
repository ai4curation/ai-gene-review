core_functions:
- description: >-
    PLP-dependent decarboxylation of L-arginine to agmatine, initiating the
    arginine-derived route to putrescine.
  molecular_function:
    id: GO:0008792
    label: arginine decarboxylase activity
  directly_involved_in:
  - id: GO:0033388
    label: putrescine biosynthetic process from arginine
  supported_by:
  - reference_id: file:PSEPK/speA/speA-uniprot.txt
    supporting_text: 'Reaction=L-arginine + H(+) = agmatine + CO2'
  knowledge_gaps:
  - gap_statement: Q88QC7 has not been biochemically or genetically tested in KT2440.
    significance: >-
      Its catalytic and pathway assignments are strong homology inferences;
      native route usage and condition dependence remain unknown.
suggested_questions:
- question: Under which nutrient or stress conditions does KT2440 route putrescine synthesis through SpeA rather than SpeC?
suggested_experiments:
- description: >-
    Measure agmatine and putrescine in wild type, speA, speC, and speA speC
    mutants and complement the phenotypes with the native genes.
