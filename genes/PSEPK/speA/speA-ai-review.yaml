    label: spermidine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SpeA supplies an upstream precursor for spermidine synthesis through putrescine.
    action: KEEP_AS_NON_CORE
    reason: >-
      This downstream pathway assignment is compatible with SpeA's role in
      polyamine supply, but the immediate and defining route is putrescine
      biosynthesis from arginine.
    supported_by:
    - reference_id: PMID:12634339
      supporting_text: >-
        Putrescine can be synthesized either directly from ornithine by
        ornithine decarboxylase (ODC; the speC product) or indirectly from
        arginine via arginine decarboxylase (ADC; the speA product).
