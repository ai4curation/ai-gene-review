    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Accession, reaction, cofactors, and family assignment were checked
      directly. The protein remains PE 3 and its functional annotation is
      homology-derived rather than supported by a KT2440 assay.
- id: PMID:12634339
  title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase of the arginine decarboxylase pathway.
  full_text_unavailable: true
  findings:
  - statement: Pseudomonas aeruginosa uses alternative SpeA and SpeC routes to make putrescine.
    supporting_text: >-
      Putrescine can be synthesized either directly from ornithine by ornithine
      decarboxylase (ODC; the speC product) or indirectly from arginine via
      arginine decarboxylase (ADC; the speA product).
    reference_section_type: ABSTRACT
  - statement: Either decarboxylase route was sufficient for normal growth in the tested Pseudomonas aeruginosa strain.
    supporting_text: >-
      The activities of the two decarboxylases were similar and each enzyme
      alone appeared to direct sufficient formation of the polyamine for normal growth.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked. This is direct same-genus
      pathway evidence, not a direct experiment on KT2440 Q88QC7.
- id: PMID:28862813
  title: Polyamine is a critical determinant of Pseudomonas chlororaphis O6 for GacS-dependent bacterial cell growth and biocontrol capacity.
  full_text_unavailable: true
  findings:
  - statement: A related pseudomonad requires both SpeA and SpeC disruption to eliminate polyamine production.
    supporting_text: >-
      Polyamine production was reduced in the speC mutant, and was eliminated
      in the speAspeC mutant.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this supports alternative-route
      architecture in a related pseudomonad, not target-specific activity.
