  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      SpeA consumes L-arginine, but its defining physiological role is
      biosynthetic production of agmatine for putrescine synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is chemically compatible with arginine breakdown and is also
      used for characterized bacterial SpeA proteins, but GO:0033388 is the
      more informative pathway description for this biosynthetic enzyme.
    supported_by:
    - reference_id: file:PSEPK/speA/speA-uniprot.txt
      supporting_text: Catalyzes the biosynthesis of agmatine from arginine.
- term:
