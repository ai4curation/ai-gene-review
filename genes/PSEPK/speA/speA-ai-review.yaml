    id: GO:0008792
    label: arginine decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SpeA converts L-arginine to agmatine and carbon dioxide.
    action: ACCEPT
    reason: >-
      The reviewed Q88QC7 record assigns EC 4.1.1.19/RHEA:17641, the
      SpeA-specific HAMAP and PANTHER subfamilies, and the exact reaction.
      Same-genus genetics independently establishes this reaction as the first
      step of an alternative putrescine-synthesis route, although Q88QC7 itself
      has not been assayed.
    supported_by:
    - reference_id: file:PSEPK/speA/speA-uniprot.txt
      supporting_text: 'Reaction=L-arginine + H(+) = agmatine + CO2'
    - reference_id: PMID:12634339
      supporting_text: >-
        Putrescine can be synthesized either directly from ornithine by
        ornithine decarboxylase (ODC; the speC product) or indirectly from
        arginine via arginine decarboxylase (ADC; the speA product).
- term:
    id: GO:0033388
    label: putrescine biosynthetic process from arginine
  evidence_type: IC
  original_reference_id: file:PSEPK/speA/speA-uniprot.txt
  qualifier: involved_in
  review:
    summary: SpeA initiates putrescine biosynthesis from L-arginine by producing agmatine.
    action: NEW
    reason: >-
      The current Q88QC7 UniProt record already associates this specific
      process with SpeA, and the exact catalytic reaction supplies agmatine to
      the downstream route. This term captures the pathway more directly than
      either arginine catabolism or downstream spermidine biosynthesis.
    supported_by:
    - reference_id: file:PSEPK/speA/speA-uniprot.txt
      supporting_text: 'DR   GO; GO:0033388; P:putrescine biosynthetic process from arginine'
