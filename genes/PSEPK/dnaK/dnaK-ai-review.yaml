suggested_questions:
- question: >-
    Which native KT2440 clients depend most strongly on DnaK-DnaJ-GrpE cycling under
    basal growth, heat stress and other proteotoxic conditions?
- question: >-
    Does Q88DU2 display an ATP-independent holdase regime distinct from its established
    ATP-dependent folding cycle under any physiologically relevant condition?
suggested_experiments:
- description: >-
    Reconstitute purified Q88DU2 with KT2440 DnaJ and GrpE and quantify ATP-dependent
    refolding of denatured luciferase or another defined client, alongside ATPase and
    substrate-release kinetics.
  experiment_type: biochemical chaperone-cycle reconstitution
- description: >-
    Compare aggregation suppression with ATP, ADP and nucleotide-free Q88DU2 to determine
    whether a separable ATP-independent holdase activity exists and whether it warrants
    the pending general holdase term.
  experiment_type: aggregation-suppression assay
