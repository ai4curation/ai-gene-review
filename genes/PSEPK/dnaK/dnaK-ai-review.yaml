id: Q88DU2
gene_symbol: dnaK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DnaK is the cytoplasmic Hsp70 chaperone of Pseudomonas putida KT2440. Its nucleotide-binding
  and substrate-binding domains couple ATP turnover to capture and release of non-native protein
  clients. It operates with the J-domain co-chaperone DnaJ and the nucleotide-exchange factor
  GrpE to support protein folding and recovery from proteotoxic stress. Experiments in the KT2440-isogenic
  strain PaW85 link the DnaK C-terminal region to competitive fitness and to the activity of
  the GraT toxin.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      DnaK is an ATP-dependent Hsp70 chaperone whose N-terminal nucleotide-binding
      domain binds ATP; ATP binding and hydrolysis drive the chaperone cycle. ATP binding
      is well established for the Hsp70 family and supported by the conserved actin-like
      ASKHA nucleotide-binding domain fold of this protein.
    action: ACCEPT
    reason: >-
      Core molecular function of an Hsp70 chaperone, strongly supported by family membership,
      conserved nucleotide-binding domain, and the canonical DnaK mechanism. The IEA evidence
      is appropriate and consistent with the biology. The target assignment is an inference
      from its curated DnaK architecture/function; the mechanistic statements in the introduction
      of PMID:33668424 summarize earlier work. That paper experimentally uses PaW85 derivatives,
      not a purified KT2440 KJE reconstitution.
    supported_by:
    - reference_id: PMID:33668424
      supporting_text: >-
        ATP binding and hydrolysis by DnaK NBD allosterically controls the binding of SBD to
        its substrates—short hydrophobic peptide segments that would normally be buried in the
        folded structure.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      DnaK assists folding of non-native polypeptides and prevents aggregation through
      ATP-driven cycles of substrate binding and release, acting in the cytoplasm as
      part of the DnaK-DnaJ-GrpE system. This is the central biological process for
      bacterial Hsp70.
    action: ACCEPT
    reason: >-
      Core biological process for DnaK, well supported by family function and conserved domain
      architecture. Appropriately captured by an IEA annotation. The target assignment is an
      inference from its curated DnaK architecture/function; the mechanistic statements in the
      introduction of PMID:33668424 summarize earlier work. That paper experimentally uses PaW85
      derivatives, not a purified KT2440 KJE reconstitution.
    supported_by:
    - reference_id: PMID:33668424
      supporting_text: >-
        DnaK facilitates the folding through repeated cycles of ATP-dependent binding and release
        of an unfolded protein [6].
    - reference_id: PMID:7937953
      supporting_text: >-
        Several rounds of ATP-dependent interaction with DnaK and DnaJ are required for fully
        efficient folding.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The DnaK nucleotide-binding domain catalyzes ATP hydrolysis, which is allosterically
      coupled to substrate binding in the substrate-binding domain; ATP hydrolysis
      (stimulated by DnaJ) switches DnaK to the high-affinity client-binding state.
      This ATPase activity is intrinsic to and definitional for the Hsp70 family.
    action: ACCEPT
    reason: >-
      Core molecular function of DnaK that powers the chaperone cycle. Strongly supported by
      family membership and conserved catalytic NBD; the IEA annotation is appropriate. The
      target assignment is an inference from its curated DnaK architecture/function; the mechanistic
      statements in the introduction of PMID:33668424 summarize earlier work. That paper experimentally
      uses PaW85 derivatives, not a purified KT2440 KJE reconstitution.
    supported_by:
    - reference_id: PMID:33668424
      supporting_text: >-
        ATP binding and hydrolysis by DnaK NBD allosterically controls the binding of SBD to
        its substrates—short hydrophobic peptide segments that would normally be buried in the
        folded structure.
- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: ISS
  original_reference_id: PMID:7937953
  supporting_entities:
  - UniProtKB:P0A6Y8
  qualifier: enables
  review:
    summary: >-
      Q88DU2 is canonical bacterial DnaK: its ATPase and substrate-binding domains
      drive repeated ATP-dependent client binding and release during protein folding.
      Direct E. coli DnaK/DnaJ/GrpE experiments establish the conserved foldase cycle,
      while the full-text P. putida study describes the same mechanism and shows that
      DnaK chaperone function affects GraT activity and competitive fitness.
    action: NEW
    reason: >-
      GO:0140662 is the evidence-matched current molecular function for an ATP-dependent
      Hsp70 foldase and is more specific than GO:0044183. ISS is used because direct
      reconstitution of folding was performed with E. coli DnaK (UniProtKB:P0A6Y8),
      recorded machine-readably in supporting_entities, whereas the
      KT2440-isogenic P. putida paper supports the conserved DnaK mechanism but does not
      directly reconstitute Q88DU2-mediated client refolding. GO:0051082 is not retained:
      it is obsolete, and client binding here is a mechanistic step in the ATP-dependent
      foldase cycle. A distinct holdase NTR would require context-specific evidence not
      established for Q88DU2 in the cached literature.
    supported_by:
    - reference_id: PMID:7937953
      supporting_text: >-
        The binding and release of substrate protein for folding involves the following ATP hydrolysis-dependent cycle: (i) unfolded luciferase binds initially to DnaJ; (ii) upon interaction with luciferase-DnaJ, DnaK hydrolyzes its bound ATP, resulting in the formation of a stable luciferase-DnaK-DnaJ complex; (iii) GrpE releases ADP from DnaK; and (iv) ATP binding to DnaK triggers the release of substrate protein, thus completing the reaction cycle.
    - reference_id: PMID:33668424
      supporting_text: >-
        DnaK facilitates the folding through repeated cycles of ATP-dependent binding and release of an unfolded protein [6].
core_functions:
- description: >-
    ATP-dependent Hsp70 client remodeling in the DnaK-DnaJ-GrpE cycle, inferred for KT2440 from
    its curated DnaK family/function assignment and direct E. coli cycle experiments. PaW85
    derivatives, explicitly described as isogenic to KT2440, provide physiological evidence
    for the DnaK C-terminal region; the cited study does not directly reconstitute the KT2440
    three-protein cycle.
