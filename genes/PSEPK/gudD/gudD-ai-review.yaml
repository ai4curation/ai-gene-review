id: Q88DR6
gene_symbol: gudD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GudD (PP_4757) is a magnesium-dependent D-glucarate dehydratase that removes
  water from D-glucarate to form 5-dehydro-4-deoxy-D-glucarate. It catalyzes
  the substrate-entry reaction of a convergent aldarate catabolic route whose
  downstream reactions produce 2-oxoglutarate.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GudD is predicted to use Mg2+ in the glucarate-dehydratase reaction.
    action: ACCEPT
    reason: >-
      The metal-binding annotation is supported by the substrate-specific
      PIRSR/UniRule assignment and the UniProt catalytic record explicitly lists
      Mg2+ as the cofactor.
    supported_by:
    - reference_id: file:PSEPK/gudD/gudD-uniprot.txt
      supporting_text: "CC       Name=Mg(2+); Xref=ChEBI:CHEBI:18420;"
- term:
    id: GO:0008872
    label: glucarate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GudD dehydrates D-glucarate to 5-dehydro-4-deoxy-D-glucarate.
    action: ACCEPT
    reason: >-
      The exact activity is concordant across EC 4.2.1.40, Rhea 14573,
      NCBIfam TIGR03247, InterPro IPR017653, and the PANTHER SF4 assignment.
    supported_by:
    - reference_id: file:PSEPK/gudD/gudD-uniprot.txt
      supporting_text: "DR   GO; GO:0008872; F:glucarate dehydratase activity; IEA:UniProtKB-UniRule."
- term:
    id: GO:0042838
    label: D-glucarate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GudD initiates conversion of D-glucarate toward 2-oxoglutarate.
    action: ACCEPT
    reason: >-
      The accepted substrate-specific reaction is step 1 of the UniPathway
      D-glucarate-to-2,5-dioxopentanoate route and is followed by KDGDH.
    supported_by:
    - reference_id: file:PSEPK/gudD/gudD-uniprot.txt
      supporting_text: "CC       dioxopentanoate from D-glucarate: step 1/2."
