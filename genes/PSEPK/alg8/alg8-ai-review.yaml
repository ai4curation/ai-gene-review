      action: ACCEPT
      reason: UniPathway, the reviewed record, the Alg8-specific subfamily, and conserved operon context consistently support this process.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic
  - term:
