id: Q88NC5
gene_symbol: alg8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Alg8 is the multi-pass inner-membrane glycosyltransferase catalytic subunit
  of the alginate synthase complex. Together with the c-di-GMP-responsive
  copolymerase Alg44, it processively polymerizes GDP-mannuronate into nascent
  poly-beta-D-mannuronate for periplasmic maturation and outer-membrane export.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Alg8 is a multi-pass bacterial inner-membrane protein.
      action: ACCEPT
      reason: The reviewed UniProt topology and synthase role support plasma-membrane localization.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
  - term:
      id: GO:0030213
      label: hyaluronan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: This TreeGrafter row transfers the wrong polysaccharide pathway from the broad synthase family.
      action: REMOVE
      reason: Alg8 polymerizes mannuronate in bacterial alginate biosynthesis, not vertebrate-type hyaluronan.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: Glycan biosynthesis; alginate biosynthesis
  - term:
      id: GO:0050501
      label: hyaluronan synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: PTN002740694 assigns the wrong substrate-specific synthase activity.
      action: REMOVE
      reason: >-
        Q88NC5 polymerizes mannuronate in alginate biosynthesis, whereas this
        annotation specifies hyaluronan. The PTHR22913:SF12 label says
        mannuronan synthase but its member export mixes Alg8, HasA, and NodC, so
        it cannot establish substrate specificity by itself; GO:0047643 is the
        correct target-specific molecular function.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic
  - term:
      id: GO:0085029
      label: extracellular matrix assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: >-
        Alginate can contribute to Pseudomonas biofilm architecture, but this
        family-propagated matrix term does not identify Alg8's core polymerase
        step.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The term is conditionally compatible with the extracellular role of
        alginate, but PTN002740694 does not establish it for this target and the
        exact alginic acid biosynthetic process is the defensible core process.
      supported_by:
        - reference_id: PMID:17601783
          supporting_text: Alginate influenced biofilm architecture
  - term:
      id: GO:0042121
      label: alginic acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000041
    qualifier: involved_in
    review:
      summary: Alg8 is the catalytic polymerase subunit of the alginate biosynthetic machinery.
      action: ACCEPT
      reason: UniPathway, the reviewed record, and conserved alginate-operon context consistently support this process.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic
  - term:
      id: GO:0047643
      label: alginate synthase activity
    evidence_type: ISS
    original_reference_id: file:PSEPK/alg8/alg8-uniprot.txt
    qualifier: enables
    review:
      summary: Alg8 provides the catalytic mannuronan-polymerization activity of the Alg8-Alg44 synthase complex.
      action: NEW
      reason: This exact valid GO term replaces the incorrect hyaluronan synthase propagation.
      supported_by:
        - reference_id: file:PSEPK/alg8/alg8-uniprot.txt
          supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic
references:
  - id: GO_REF:0000041
    title: Gene Ontology annotation based on UniPathway vocabulary mapping
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/alg8/alg8-uniprot.txt
    title: UniProtKB reviewed entry for alg8 (Q88NC5)
    findings:
      - statement: The record identifies Alg8 as a multi-pass GT2-family protein in alginate biosynthesis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The family, topology, pathway, and operon position consistently support mannuronan rather than hyaluronan synthesis.
  - id: file:PSEPK/alg8/alg8-goa.tsv
    title: QuickGO GOA annotations for alg8
    findings:
      - statement: The GOA table exposes PTN002740694 as the source of three hyaluronan-branch over-propagations.
  - id: file:interpro/panther/PTHR22913/PTHR22913-entries.csv
    title: Reviewed member export for PANTHER PTHR22913
    findings:
      - statement: >-
          Q88NC5 is labeled PTHR22913:SF12 mannuronan synthase, but the same
          exported subfamily also contains NodC and HasA proteins and is not a
          safe Alg8-specific selector.
  - id: PMID:17601783
    title: Alginate production by Pseudomonas putida creates a hydrated microenvironment and contributes to biofilm architecture and stress tolerance under water-limiting conditions.
    findings:
      - statement: P. putida alginate affects biofilm architecture under water-limiting conditions, making the broad matrix annotation conditionally plausible but non-core.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: The P. putida mt-2 algD phenotype directly supports a conditional extracellular-matrix role for alginate, not Alg8 substrate specificity.
  - id: PMID:25968647
    title: Alginate Polymerization and Modification Are Linked in Pseudomonas aeruginosa.
    findings:
      - statement: P. aeruginosa Alg8 is the catalytic membrane subunit that directly interacts with Alg44; this is ortholog evidence for the KT2440 complex assignment.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text was checked; mechanistic transfer to Q88NC5 is explicitly treated as orthology-based evidence.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-polymerization-export__ppu00543-deep-research-openscientist.md
    title: OpenScientist PSEPK alginate polymerization and export synthesis
    findings:
      - statement: The species-aware report places Alg8 in the complete KT2440 alginate operon and excludes unrelated ppu00543 candidates.
  - id: file:modules/alginate_polymerization_export.yaml
    title: Alginate polymerization and export module
    findings:
      - statement: Alg8 is the catalytic polymerase participant in the inner-membrane synthase part.
