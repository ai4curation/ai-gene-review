  label: Pseudomonas putida KT2440
description: Alg8 is the predicted inner-membrane catalytic glycosyltransferase of the Pseudomonas
  putida KT2440 alginate synthase. Conserved family and operon placement, together with experimentally
  characterized Pseudomonas aeruginosa orthologs, support polymerization of GDP-mannuronate
  into mannuronan in association with the cyclic-di-GMP-responsive subunit Alg44. The product
  undergoes periplasmic modification and export. Conditional biofilm matrix effects are supported
  by related P. putida strains rather than a direct KT2440 Alg8 assay.
