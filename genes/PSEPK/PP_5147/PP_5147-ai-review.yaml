id: Q88CN3
gene_symbol: PP_5147
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_5147 is a predicted monofunctional HAD-family histidinol-phosphate
  phosphatase (EC 3.1.3.15) in Pseudomonas putida KT2440. It is a HAD-family
  homolog of Pseudomonas aeruginosa PA0335, whose phosphatase activity and
  histidine-biosynthesis phenotype have been demonstrated. PP_5147 itself has
  not been assayed, and its local family assignments are not
  histidinol-phosphate specific.
  KT2440 also encodes the unrelated IMPase-like HisN candidate PP_3157, and the
  division of physiological flux between them is unknown.
existing_annotations:
- term:
    id: GO:0004401
    label: histidinol-phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The exact activity is plausible but has not been established for PP_5147.
    action: UNDECIDED
    reason: >-
      Q88CN3 is a HAD-family homolog of the experimentally validated
      P. aeruginosa enzyme PA0335, but its exact local family assignments are
      generic and no reproducible local orthology analysis or direct KT2440
      assay establishes substrate specificity.
    supported_by:
    - reference_id: file:PSEPK/PP_5147/PP_5147-deep-research-openscientist.md
      supporting_text: "67.7% amino-acid identity to the experimentally validated ortholog PA0335"
    - reference_id: PMID:31862725
      supporting_text: "PA0335 was shown to encode Hol-Pase"
