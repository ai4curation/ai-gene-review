  review:
    summary: EC-mapped histidinol-phosphatase activity; PP_5147 is the reciprocal-best-hit ortholog of
      the characterized P. aeruginosa HolPase PA0335 and scores above the trusted cutoff of the Pseudomonas
      HolPase equivalog model.
    action: ACCEPT
    reason: 'The UniProt name and EC number are ARBA predictions, but a reproducible analysis now supports
      the exact activity: PP_5147 is the only KT2440 protein above the trusted cutoff of NCBIfam NF052360
      (HolPasePseu, an equivalog built on PMID:31862725), PA0335 and PP_5147 are reciprocal best hits
      between the two proteomes (about 68% identity over the full length), and the three HAD catalytic/Mg2+
      Asp residues of PA0335 are conserved. PA0335 itself is a genetically and biochemically demonstrated
      HolPase (PMID:31862725). Equivalog membership plus one-to-one orthology to a characterized enzyme
      is sufficient for the activity; it does not establish how much of the KT2440 flux PP_5147 carries
      relative to PP_3157, which is recorded as an open question.'
