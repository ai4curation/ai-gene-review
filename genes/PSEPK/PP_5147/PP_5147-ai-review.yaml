- term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_5147/PP_5147-bioinformatics/RESULTS.md
  review:
    summary: Process inferred from one-to-one orthology to PA0335, whose inactivation causes histidine
      auxotrophy.
    action: NEW
    reason: 'PP_5147 carries only the activity row in GOA, while its ortholog PA0335 carries the process.
      The gene product itself performs a pathway step (histidinol phosphate to histidinol), so the participation
      test is met; PA0335 inactivation produces a histidine-synthesis defect (PMID:31862725) and PP_5147
      is its reciprocal best hit with conserved catalytic residues. Comparator: the other HolPases reviewed
      for this pathway (PA0335, B. subtilis HisJ, yeast HIS2) all carry GO:0000105.'
    supported_by:
    - *id001
    - reference_id: PMID:31862725
      supporting_text: we found that the growth defect was due to incomplete histidine auxotrophy caused
        by PA0335 inactivation.
