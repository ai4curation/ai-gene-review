taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_5147 encodes a monofunctional HAD-family histidinol-phosphate phosphatase (EC 3.1.3.15)
  of Pseudomonas putida KT2440, predicted to hydrolyse L-histidinol phosphate to L-histidinol in the penultimate
  step of L-histidine biosynthesis. The 218-residue protein belongs to the HAD-like hydrolase superfamily
  (subfamily IB, SerB-like fold) and is the reciprocal-best-hit ortholog (about 68% identity) of the experimentally
  characterized P. aeruginosa HolPase PA0335, conserving its Asp nucleophile, Asp proton donor and Mg2+-binding
  Asp. It is the only KT2440 protein above the trusted cutoff of the Pseudomonas HolPase family model
  NF052360. KT2440 also encodes PP_3157, an unrelated IMPase-like HisN-family histidinol-phosphate phosphatase;
  neither protein has been assayed in KT2440, and their relative contributions in vivo are unknown.
