id: Q88CN3
gene_symbol: PP_5147
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_5147 is a HAD-superfamily histidinol-phosphate phosphatase (EC 3.1.3.15)
  of Pseudomonas putida KT2440, predicted to dephosphorylate L-histidinol
  phosphate to L-histidinol in the penultimate step of L-histidine
  biosynthesis. It is 68% identical to Pseudomonas aeruginosa PA0335 (paHisN),
  a HAD-family histidinol-phosphate phosphatase whose activity, histidine
  biosynthesis phenotype and substrate-specificity residues have been
  determined, and it carries the full set of PA0335 residues that distinguish
  these enzymes from the closely related phosphoserine phosphatases. PP_5147
  itself has not been assayed. KT2440 also encodes the unrelated IMPase-like
  HisN candidate PP_3157, and the division of physiological flux between them
  is unknown.
existing_annotations:
- term:
    id: GO:0004401
    label: histidinol-phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      PP_5147 carries the substrate-specificity fingerprint of the characterized
      HolPase PA0335 and passes only the histidinol-phosphatase family model.
    action: ACCEPT
    reason: >-
      A reproducible local analysis now addresses the specificity question left
      open earlier. PP_5147 is 67.7% identical to PA0335 over its full length
      and carries all three residues (D16, D18, Y47) that an alanine scan of
      PA0335 showed to define HolPase rather than phosphoserine phosphatase
      function, plus both supporting residues (Y57, T113). In the same study,
      homologues with this fingerprint, including one at about 48% identity,
      were confirmed as HolPases in vitro. PP_5147 also passes the trusted
      cutoff of the NCBIfam histidinol-phosphatase model NF052360.1 (351.1
      against 280), as PA0335 does, and falls below the noise cutoff of both
      SerB-type phosphoserine phosphatase models. The M. jannaschii SerB
      control shows the reverse pattern. No KT2440 assay exists, so the
      function is inferred, but every available line of evidence points to the
      annotated activity.
    supported_by:
    - reference_id: file:PSEPK/PP_5147/PP_5147-bioinformatics/RESULTS.md
      supporting_text: "| Q88CN3 PP_5147, P. putida KT2440 (query) | 67.7% | 3/3 | D | D | Y | Y | T |"
    - reference_id: file:PSEPK/PP_5147/PP_5147-bioinformatics/RESULTS.md
      supporting_text: "| Q88CN3 | 351.1 / 280.0 (ABOVE_TC) | 242.2 / 400.0 (BELOW_NC) | 33.9 / 144.1 (BELOW_NC) | 16.3 / 413.0 (BELOW_NC) |"
    - reference_id: PMID:38284491
      supporting_text: >-
        Taken together, the residues D16 and D18 form a DxD motif, which is
        indicative for a HolPase, whereas an ExI motif indicates a PSPase.
    - reference_id: PMID:38284491
      supporting_text: >-
        we conclude that all sequences from cluster I that contain all three
        fingerprint residues are HolPases
    - reference_id: PMID:38284491
      supporting_text: >-
        In line with our predictions, the kinetic parameters of Beta1 for both
        HolP and PSer were very close to the ones from paHisN, confirming the
        annotation of Beta1 as HolPase.
    - reference_id: PMID:31862725
      supporting_text: "PA0335 was shown to encode Hol-Pase"
    - reference_id: file:PSEPK/PP_5147/PP_5147-deep-research-openscientist.md
      supporting_text: "67.7% amino-acid identity to the experimentally validated ortholog PA0335"
