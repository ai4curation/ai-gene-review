- id: PMID:38284491
  title: >-
    Improving enzyme functional annotation by integrating in vitro and in silico
    approaches: The example of histidinol phosphate phosphatases.
  findings:
  - statement: >-
      An alanine scan of PA0335 identifies D16, D18 and Y47 as the residues that
      define HolPase function and separate it from phosphoserine phosphatases;
      homologues carrying them were confirmed as HolPases by kinetics.
    supporting_text: >-
      Taken together, the residues D16 and D18 form a DxD motif, which is
      indicative for a HolPase, whereas an ExI motif indicates a PSPase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
