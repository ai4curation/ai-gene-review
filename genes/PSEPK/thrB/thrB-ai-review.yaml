description: >-
  thrB (PP_0121) encodes the Pseudomonas-type homoserine kinase that uses ATP
  to form O-phospho-L-homoserine. This is the first threonine-specific reaction
  after the homoserine branch point in the aspartate-to-threonine pathway.
