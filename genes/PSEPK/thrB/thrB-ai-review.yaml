taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ThrB (PP_0121) is a Pseudomonas-type homoserine kinase that uses ATP to phosphorylate L-homoserine,
  producing O-phospho-L-homoserine for threonine synthase. It belongs to the type II homoserine-kinase
  family with an aminoglycoside-phosphotransferase-like fold. Native ThrB has been coexpressed with ThrC
  and heterologous ThrA in engineered KT2440 to increase threonine production.
