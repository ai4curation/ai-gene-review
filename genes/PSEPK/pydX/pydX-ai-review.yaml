id: Q88FQ1
gene_symbol: pydX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  pydX (PP_4037) encodes the partner subunit of the bacterial heteromeric
  dihydropyrimidine dehydrogenase in reductive pyrimidine catabolism. PydX is an
  iron-sulfur- and flavin-associated redox protein that works with adjacent PydA to
  reduce uracil or thymine to 5,6-dihydrouracil or 5,6-dihydrothymine. Its
  primary role is NADH oxidation and internal electron transfer within the
  assembled PydXA enzyme, not an independently established whole-enzyme
  activity. Whether Q88FQ1 binds FAD or FMN has not been resolved directly.
existing_annotations:
- term:
    id: GO:0004159
    label: dihydropyrimidine dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The term is correct for the assembled PydXA DPD, but PydX is the electron-input subunit rather than an independently active dihydropyrimidine dehydrogenase.
    action: MODIFY
    reason: >-
      Retain the term but change the relation from enables to contributes_to;
      PydX supplies reducing equivalents to the PydA pyrimidine-reduction site.
    proposed_replacement_terms:
    - id: GO:0004159
      label: dihydropyrimidine dehydrogenase (NAD+) activity
    supported_by:
    - reference_id: file:PSEPK/pydX/pydX-deep-research-openscientist.md
      supporting_text: "The 455-amino-acid PydX polypeptide is not the catalytic centre itself; rather, it provides the pyridine-nucleotide oxidation and intramolecular electron-relay machinery that feeds reducing equivalents to the pyrimidine-reducing active site housed on its partner subunit, PydA."
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Generic oxidoreductase activity is true but does not identify the heteromeric DPD reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: The specific DPD activity and iron-sulfur cofactor role are more informative.
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IC
  original_reference_id: file:PSEPK/pydX/pydX-deep-research-openscientist.md
  qualifier: enables
  supporting_entities:
  - GO:0004159
  review:
    summary: PydX performs the NADH-oxidizing input half-reaction and relays reducing equivalents to the PydA catalytic subunit.
    action: NEW
    reason: >-
      GO:0003954 captures the catalytic NADH-to-acceptor reaction enabled by
      PydX, while GO:0004159 remains a contributes_to function of the assembled
      PydXA enzyme.
    supported_by:
    - reference_id: PMID:21169495
      supporting_text: "dihydropyrimidine dehydrogenase is the first member of a novel NADH-dependent subclass of iron-sulfur flavoenzymes"
    - reference_id: file:PSEPK/pydX/pydX-deep-research-openscientist.md
      supporting_text: "The 455-amino-acid PydX polypeptide is not the catalytic centre itself; rather, it provides the pyridine-nucleotide oxidation and intramolecular electron-relay machinery that feeds reducing equivalents to the pyrimidine-reducing active site housed on its partner subunit, PydA."
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The PydX sequence carries the iron-sulfur-binding family signature used by the paired bacterial DPD electron-transfer system.
    action: ACCEPT
    reason: Retain as a mechanistically informative cofactor-binding function of the subunit.
- term:
    id: GO:0072529
    label: pyrimidine-containing compound catabolic process
  evidence_type: IC
  original_reference_id: PMID:22782928
  qualifier: involved_in
  review:
    summary: PydX is the tandem partner of PydA in the reductive pyrimidine-catabolic DPD locus.
    action: NEW
    reason: >-
      The paired-enzyme architecture and locus assignment support the pathway
      role even though the reported KT2440 deletion phenotype is for pydA.
    supported_by:
    - reference_id: PMID:22782928
      supporting_text: "The putative DPD genes, pydX and pydA, are tandemly arranged in the Pseudomonas putida genome."
