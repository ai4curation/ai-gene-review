description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida NC_017530.1_3648 is
  "Putative laminin-binding outer membrane adhesin (DUF1302 family)" (tier A, Dark-Function
  stratum), with three GO terms: GO:0043236 laminin binding, GO:0007155 cell adhesion and
  GO:0009279 cell outer membrane. The exact-sequence UniProt entries are deleted, so the call is
  scored on the KT2440 reference-proteome entry Q88L93 (PP_2042), 98.9% identical over all 617
  residues. GOA has no annotations for Q88L93. The outer-membrane location is well supported (an
  18-strand DeepTMHMM beta-barrel with a signal peptide, and a family-wide beta-barrel fold). The
  laminin and adhesin parts of the call are name transfer. The only evidence is laminin binding by
  P. aeruginosa PA3923 at 47.7% identity and the Fitness Browser reannotation "putative adhesin",
  which was made for the KT2440 paralog PP_0765, not for PP_2042. PA3923 is the reciprocal best hit
  and 76.9%-identical ortholog of PP_0765; PP_2042 is only about 52% identical to it and belongs to
  a separate, uncharacterized subfamily. The KT2440 fitness value the annotator saw (Tween 20, -4.06)
  also belongs to PP_0765. PP_2042 itself has no phenotype in 300 RB-TnSeq experiments and is not
  cofit with its operon partner PP_2043. Laminin is a host extracellular-matrix protein, and its
  binding by a pathogen surface protein says nothing about the role of a soil-bacterium paralog.
  Recommended dashboard verdict: overreach. Corrected annotation: "DUF1302 family outer membrane
  beta-barrel protein of unknown function; co-encoded with DUF1329 periplasmic protein PP_2043".
