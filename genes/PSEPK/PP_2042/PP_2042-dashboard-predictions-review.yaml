- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0043236
    label: laminin binding
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      The term was transferred from P. aeruginosa PA3923, which binds laminin in vitro and is an
      outer-membrane laminin receptor (PMID:31796854). PA3923 is the reciprocal best hit and
      76.9%-identical ortholog of the KT2440 paralog PP_0765. PP_2042 is only about 52% identical to
      PA3923, to PA3422 and to PP_0765, so it belongs to a different, uncharacterized DUF1302
      subfamily. The other supporting evidence the annotator cited also belongs to the paralog: the
      "putative adhesin" Fitness Browser reannotation and the KT2440 fitness value at 48.4%
      identity are both PP_0765. Laminin is a vertebrate host basement-membrane protein, and the
      binding was shown for a pathogen. Nothing ties laminin binding to PP_2042 in a soil
      bacterium, and the binding is not known to be a family-wide property. The term is absent from
      GOA. PLI rather than UNC, because the prediction comes from over-propagation across paralogous
      subfamilies; it is not a test that PP_2042 cannot bind laminin.
