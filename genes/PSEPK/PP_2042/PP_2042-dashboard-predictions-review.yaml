  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0007155
    label: cell adhesion
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The extractor took the term from the word "adhesin" in the call. That label comes from
      PA3923, whose transposon mutants adhered less to immobilized laminin (PMID:31796854), and from
      a curator's reannotation of the paralog PP_0765. No adhesion, biofilm or attachment data exist
      for PP_2042, and PP_2042 has no fitness phenotype in 300 KT2440 experiments. A surface-exposed
      outer-membrane beta-barrel could plausibly take part in attachment, so the term is not refuted.
      It is unsupported by any evidence specific to the PP_2042 subfamily. The term is absent from
      GOA.
    supported_by:
    - reference_id: file:PSEPK/PP_2042/PP_2042-bioinformatics/RESULTS.md
      supporting_text: >-
        PP_2042 and PP_2043 have no fitness phenotype in any of 300 KT2440 experiments, including
        the Tween 20 and butyl stearate experiments in which PP_0765 and PP_0766 are strongly
        required.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009279
    label: cell outer membrane
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel; GOA has no annotations for Q88L93. DeepTMHMM on the
      dashboard sequence predicts a cleavable signal peptide and an 18-strand outer-membrane
      beta-barrel with no inner-membrane helices. Structure-model surveys place DUF1302 among
      transmembrane beta-barrels as a distinct type (PMID:37432995). The family member PA3923 was
      found in the P. aeruginosa outer membrane (PMID:31796854). PP_2042 itself has not been
      fractionated, so this is a strong prediction rather than an observation. The companion review
      adds the same term as NEW.
