core_functions:
- description: >-
    Outer-membrane beta-barrel protein of unknown function, encoded with the periplasmic DUF1329
    protein PP_2043. By analogy with the C. defragrans AmeABCD system it may form the outer-membrane
    component of a DUF1302/DUF1329 envelope export or uptake system for a hydrophobic cargo, but no
    activity, cargo or ligand is known, and it has no KT2440 fitness phenotype.
