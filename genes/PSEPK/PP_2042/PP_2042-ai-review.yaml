suggested_questions:
- question: >-
    Does PP_2042 require PP_2043 for outer-membrane insertion, and does the PP_2042-PP_2044 operon
    export or import a specific hydrophobic molecule?
- question: >-
    Under what conditions is the PP_2041-regulated PP_2042-PP_2044 operon expressed, given that it
    has no phenotype in 300 RB-TnSeq experiments?
suggested_experiments:
- description: >-
    Fractionate KT2440 expressing tagged PP_2042 (sucrose-gradient inner/outer membrane separation,
    surface protease shaving), with and without PP_2043, to confirm outer-membrane insertion and
    test dependence on PP_2043.
  experiment_type: subcellular fractionation
- description: >-
    Identify the inducer of the divergent LysR regulator PP_2041 (reporter fusion to the PP_2042
    promoter screened against fatty acids, alkanes, monoterpenes and detergents), then test
    PP_2042-PP_2044 deletion mutants under inducing conditions.
  experiment_type: reporter assay and mutant phenotyping
