  review:
    summary: >-
      PP_2042 is predicted to be an integral outer-membrane beta-barrel protein.
    action: NEW
    reason: >-
      GOA has no annotations for Q88L93. Three independent lines agree on the outer membrane.
      (1) The sequence has a SignalP signal peptide and DeepTMHMM predicts an 18-strand
      outer-membrane beta-barrel with no inner-membrane helices. (2) Structure-based analysis of
      predicted models places the DUF1302 family among transmembrane beta-barrels, as its own
      barrel type (PMID:37432995, PMID:42605071). (3) The DUF1302 family member PA3923 was found
      in the P. aeruginosa outer membrane by 2D immunoblotting of outer-membrane proteins
      (PMID:31796854), and the C. defragrans DUF1302 protein AmeA is predicted to be an outer
      membrane protein (PMID:30334144). PA3923 is about 52% identical to PP_2042 (a paralog-level
      relationship), so the transfer is of a family-wide topology, not of function. No
      fractionation of PP_2042 itself has been done.
