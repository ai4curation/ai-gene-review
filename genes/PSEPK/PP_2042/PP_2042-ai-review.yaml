description: >-
  PP_2042 is a 617-residue DUF1302 (PF06980) protein of unknown function, encoded in an apparent
  operon with the DUF1329 protein PP_2043 and the DUF202 inner-membrane protein PP_2044. It has a
  Sec signal peptide (1-27) and is predicted to be an 18-strand outer-membrane beta-barrel, and the
  DUF1302 family as a whole has a transmembrane beta-barrel fold; it has no lipobox in the KT2440
  sequence. The only experimentally studied DUF1302 proteins are P. aeruginosa PA3923, a
  laminin-binding outer-membrane protein, and Castellaniella defragrans AmeA, the predicted
  outer-membrane component of an inducible RND system (AmeABCD) needed for growth on high
  monoterpene concentrations. PA3923 is the ortholog of the KT2440 paralog PP_0765 (76.9% identity),
  not of PP_2042 (52.2%); PP_2042 belongs to a separate, uncharacterized subfamily. Unlike
  PP_0765/PP_0766, which are strongly required for growth on Tween 20 and butyl stearate, PP_2042
  has no fitness phenotype in any of 300 KT2440 RB-TnSeq experiments and is not cofit with
  PP_2043. Its outer-membrane location is well predicted; its molecular function, cargo or ligand
  and biological role are unknown. Laminin binding and adhesin function are name transfers from a
  pathogen paralog and are not supported for PP_2042.
