id: Q88CN5
gene_symbol: ptsP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PtsP is the GAF-domain-containing enzyme I(Ntr) that initiates the
  nitrogen-regulatory phosphotransferase relay in Pseudomonas putida KT2440.
  It accepts phosphate from phosphoenolpyruvate and transfers it to the NPr
  phosphocarrier, thereby coupling metabolic state to the phosphorylation state
  of the terminal regulator PtsN.
