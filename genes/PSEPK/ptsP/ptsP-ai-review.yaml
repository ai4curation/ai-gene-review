  qualifier: involved_in
  review:
    summary: PtsP initiates a protein phosphorelay by accepting phosphate from PEP and phosphorylating NPr.
    action: NEW
    reason: >-
      The KT2440 phosphorylation-state study directly establishes PtsP as the
      entry enzyme in the PEP-to-NPr-to-PtsN protein-phosphorylation sequence.
    supported_by:
