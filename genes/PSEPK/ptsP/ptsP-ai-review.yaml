- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PtsP participates in a regulatory phosphorelay, not sugar transport or phosphorylation.
    action: REMOVE
    reason: GO:0009401 is the coupled uptake and phosphorylation of carbohydrate through EI, HPr and a
      sugar-specific EII. PMID:18296519 explicitly describes the PtsP-PtsO-PtsN branch as unrelated to
      sugar traffic; fructose uptake in KT2440 uses the separate FruA/FruB system. The InterPro2GO mapping
      of the EI N-terminal domains cannot distinguish EI(Ntr) from sugar-PTS enzyme I.
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: comprise a branch of the system unrelated to sugar traffic but thought to have
        an influence on coordination of N and C metabolism
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO term
      requested_change: CHECK
      asserted_value: GO:0009401
      confidence: PROBABLE
      explanation: InterPro2GO maps IPR008731 (PTS_EIN) and IPR036618 (PtsI_HPr-bd_sf) to the sugar PTS
        process. These domains are shared by EI(Ntr) (PtsP), which does not participate in sugar transport;
        the mapping should be restricted (for example by excluding NCBIfam NF008283 ptsP members) or dropped
        in favour of the molecular function.
