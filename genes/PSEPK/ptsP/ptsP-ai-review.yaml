    summary: PtsP is the soluble entry enzyme of the PTS(Ntr) phosphorelay.
    action: ACCEPT
    reason: 'The UniProt location line for this unreviewed entry is ARBA-derived and is not cited. The
      location rests on family membership: PtsP is a PTS enzyme I-like protein (InterPro IPR006318, NCBIfam
      TIGR01417) whose E. coli ortholog is a soluble cytoplasmic enzyme, and it phosphorylates the soluble
      NPr in vivo. No compartment finer than cytoplasm is supported.'
