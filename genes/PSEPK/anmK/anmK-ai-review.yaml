- id: PMID:28351914
  title: The N-Acetylmuramic Acid 6-Phosphate Phosphatase MupP Completes the Pseudomonas Peptidoglycan Recycling Pathway Leading to Intrinsic Fosfomycin Resistance.
  findings:
  - statement: >-
      The Pseudomonas anabolic route uses AnmK to convert anhMurNAc to
      MurNAc-6-phosphate upstream of MupP, AmgK, and MurU.
    supporting_text: >-
      the anhMurNAc kinase (AnmK) that phosphorylates anhMurNAc, yielding MurNAc 6P, is conserved
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text is cached and explicitly places AnmK in the P. putida pathway;
      target-specific pathway involvement is also supported by the disruption
      phenotype curated under PMID:23831760, while the exact reaction remains
      family-rule supported.
- id: PMID:23831760
  title: A cell wall recycling shortcut that bypasses peptidoglycan de novo biosynthesis.
  full_text_unavailable: true
  findings:
