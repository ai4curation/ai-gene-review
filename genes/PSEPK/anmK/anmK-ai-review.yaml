id: Q88QQ4
gene_symbol: anmK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AnmK is the ATP-dependent anhydro-N-acetylmuramic acid kinase of
  peptidoglycan recycling. It opens the 1,6-anhydro ring while phosphorylating
  anhMurNAc to MurNAc-6-phosphate, which enters the Pseudomonas anabolic
  recycling route to UDP-MurNAc.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is the phosphate donor for the AnmK reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP binding is valid but less informative than the substrate-specific
      kinase reaction.
    supported_by:
    - reference_id: file:PSEPK/anmK/anmK-uniprot.txt
      supporting_text: Reaction=1,6-anhydro-N-acetyl-beta-muramate + ATP + H2O
- term:
    id: GO:0006040
    label: amino sugar metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: AnmK converts the amino sugar anhMurNAc to MurNAc-6-phosphate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is true but much broader than peptidoglycan turnover and
      anhMurNAc metabolism, which capture the biological role more precisely.
- term:
    id: GO:0009254
    label: peptidoglycan turnover
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AnmK channels an anhydro-muropeptide sugar into recycling.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record and the P. putida pathway study place AnmK in
      peptidoglycan recycling.
    supported_by:
    - reference_id: file:PSEPK/anmK/anmK-uniprot.txt
      supporting_text: 'PATHWAY: Cell wall biogenesis; peptidoglycan recycling.'
    - reference_id: file:PSEPK/anmK/anmK-uniprot.txt
      supporting_text: >-
        Cells lacking this gene accumulate anhMurNAc and
        are fosfomycin sensitive
- term:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the best available GO term for the AnmK reaction class.
    action: ACCEPT
    reason: >-
      GO lacks a substrate-specific term for EC 2.7.1.170. GO:0016773 correctly
      captures phosphorylation of an alcohol group and is retained as the core
      molecular function while the exact AnmK activity is requested below.
- term:
    id: GO:0097175
    label: 1,6-anhydro-N-acetyl-beta-muramic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AnmK consumes 1,6-anhydro-MurNAc during cell-wall sugar recovery.
    action: ACCEPT
    reason: >-
      Ring opening and phosphorylation remove anhMurNAc, even though in
      Pseudomonas the resulting MurNAc-6-phosphate is recycled anabolically
      rather than cleaved by MurQ.
    supported_by:
    - reference_id: file:PSEPK/anmK/anmK-uniprot.txt
      supporting_text: generating MurNAc-6-P
