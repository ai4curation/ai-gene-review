proposed_new_terms:
- proposed_name: 1,6-anhydro-N-acetylmuramic acid kinase activity
  proposed_definition: >-
    Catalysis of the ATP-dependent phosphorylation and ring opening of
    1,6-anhydro-N-acetyl-beta-muramate to form N-acetyl-D-muramate
    6-phosphate, ADP, and a proton.
  justification: >-
    EC 2.7.1.170 and Rhea 24952 define a substrate-specific reaction that is
    currently represented only by a broad phosphotransferase term in GOA.
  proposed_parent:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  supported_by:
  - reference_id: file:PSEPK/anmK/anmK-uniprot.txt
    supporting_text: EC=2.7.1.170
suggested_questions:
- question: >-
    Does KT2440 AnmK have measurable activity on substrates other than
    1,6-anhydro-MurNAc?
suggested_experiments:
- description: >-
    Purify AnmK and compare kinetics for anhMurNAc and related amino sugars,
    coupled to LC-MS confirmation of MurNAc-6-phosphate.
  experiment_type: biochemical activity assay
