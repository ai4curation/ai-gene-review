- term:
    id: GO:0017000
    label: antibiotic biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Over-broad and mischaracterized BP inferred electronically from InterPro. PvdQ participates in biosynthesis of the siderophore pyoverdine, not of an antibiotic; its other documented role is quorum quenching via AHL degradation.
    action: MODIFY
    reason: >-
      The IEA InterPro mapping applies a generic antibiotic biosynthetic process
      to S45 peptidases because the family also contains the penicillin G and
      cephalosporin acylases used in semi-synthetic antibiotic manufacture - and
      even for those the enzymes hydrolyse rather than build the antibiotic, so
      the mapping is doubly ill-fitting here. Pyoverdine is an iron-chelating
      siderophore, not an antibiotic. The supported biological role of PvdQ is
      periplasmic maturation of the pyoverdine precursor, in which the enzyme
      performs the deacylation step itself rather than merely being required for
      it, so involved_in is the right qualifier. The replacement rests on
      orthology and on the NCBIfam bifunctional-acylase model rather than on
      KT2440 data: the deep-research report states plainly that deacylation of a
      pyoverdine precursor by Q88IU8 has not been demonstrated in this organism,
      which is why a confirmatory experiment is suggested.
    proposed_replacement_terms:
    - id: GO:0002049
      label: pyoverdine biosynthetic process
    supported_by:
    - reference_id: file:PSEPK/pvdQ/pvdQ-deep-research-falcon.md
      supporting_text: PvdQ is described as a **periplasmic hydrolase required for pyoverdine production**
