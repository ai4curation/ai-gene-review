- id: file:PSEPK/pvdQ/pvdQ-deep-research-falcon.md
  title: Deep research report (falcon) for pvdQ (Q88IU8 / PP_2901), Pseudomonas putida KT2440
  findings:
  - statement: >-
      The report sets out the identity and the evidence scope explicitly - the
      target is an AHL acylase of the Ntn-hydrolase / peptidase S45 family
      matured from a precursor into alpha and beta subunits, and almost all
      mechanistic detail is orthology-based inference from P. aeruginosa PvdQ.
    supporting_text: direct experimental characterization in *P. putida* KT2440 is limited
    reference_section_type: INTRODUCTION
  - statement: >-
      AHL acylases catalyse irreversible amide hydrolysis of AHLs to homoserine
      lactone plus the corresponding fatty acid, the chemistry that GO:0016811
      describes and the bare GO:0016787 does not.
    supporting_text: catalyze **irreversible amide hydrolysis** of AHLs, producing **homoserine lactone** and the corresponding **fatty acid**
    reference_section_type: INTRODUCTION
  - statement: >-
      Ntn hydrolases of this family are translated as inactive precursors that
      autoproteolyse into alpha and beta subunits, exposing the catalytic
      nucleophile at the start of the beta chain - the maturation that UniProt
      records for this entry as a propeptide and an active site at residue 221.
    supporting_text: they are typically translated as **inactive precursors** that undergo **autoproteolysis** to generate active **α- and β-subunits**
    reference_section_type: INTRODUCTION
  - statement: >-
      The reference P. aeruginosa structure shows a deep hydrophobic pocket
      specialized for long fatty-acyl chains, the structural basis of the C11-C14
      preference UniProt states by similarity for this entry.
    supporting_text: specialized for accommodating **long fatty-acid–like acyl chains** of AHLs
    reference_section_type: RESULTS
  - statement: >-
      In the reference homolog PvdQ is a periplasmic hydrolase required for
      pyoverdine production, removing a fatty-acyl group from an acylated
      pyoverdine precursor in the periplasm - the basis for replacing the
      antibiotic-biosynthesis term with pyoverdine biosynthesis.
    supporting_text: PvdQ is described as a **periplasmic hydrolase required for pyoverdine production**
    reference_section_type: RESULTS
  - statement: >-
      That pyoverdine role has not been demonstrated for the KT2440 protein
      itself, which is why the replacement term is proposed on orthology and
      gene-name evidence rather than asserted as established in this organism.
    supporting_text: direct demonstration of pyoverdine precursor deacylation by Q88IU8 in KT2440 was not retrieved
    reference_section_type: RESULTS
  - statement: >-
      The one direct KT2440 phenotype retrieved is from a 2024 engineered-vesiculation
      study, in which CRISPRi knockdown and deletion of pvdQ both increased outer
      membrane vesicle production. This shows the gene is functional in KT2440 but
      identifies no substrate, and envelope/vesicle phenotypes are too far
      downstream to annotate.
    supporting_text: both yielded increased signals consistent with **enhanced outer membrane vesicle (OMV) production**
    reference_section_type: RESULTS
  - statement: >-
      Periplasmic localization is likewise a strong inference from family biology
      and the precursor annotation, with no KT2440 fractionation experiment
      retrieved.
    supporting_text: periplasmic localization is therefore best treated as a **strong inference** from family biology and precursor annotation
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Target identity (Q88IU8 / PP_2901 / KT2440) is verified in the report, and
      it is unusually explicit about evidence scope, listing what was not found
      for KT2440: no biochemical assay, no localization experiment and no
      demonstration of pyoverdine precursor deacylation. Those limits are carried
      into this review. Its structural and mechanistic claims trace to the Bokhove
      2010 structure cited here as PMID:20080736; its enzyme-engineering
      thermostability, solvent-tolerance and kcat/KM figures concern heterologously
      expressed PvdQ variants and are not used.
- id: PMID:20080736
  title: The quorum-quenching N-acyl homoserine lactone acylase PvdQ is an Ntn-hydrolase with an unusual substrate-binding pocket.
  full_text_unavailable: true
  findings:
  - statement: >-
      The crystal structure of PvdQ shows an alpha/beta heterodimeric
      Ntn-hydrolase fold like penicillin G acylase and cephalosporin acylase,
      which is why the protein carries the penicillin-amidase InterPro signatures
      that the InterPro2GO pipeline mapped to an antibiotic process.
    supporting_text: PvdQ has a typical alpha/beta heterodimeric Ntn-hydrolase fold, similar to penicillin G acylase and cephalosporin acylase.
    reference_section_type: ABSTRACT
  - statement: >-
      The substrate pocket is unusually large and hydrophobic, suited to the C12
      fatty-acid-like chains of long-chain AHLs, giving the structural basis for
      the chain-length preference.
    supporting_text: However, it has a distinct, unusually large, hydrophobic binding pocket, ideally suited to recognize C12 fatty acid-like chains of AHLs.
    reference_section_type: ABSTRACT
  - statement: >-
      A covalent ester intermediate identifies the N-terminal serine of the beta
      chain as the nucleophile, with two oxyanion-hole residues - the
      experimental basis for the nucleophile that UniProt annotates by similarity
      at residue 221 of the KT2440 precursor.
    supporting_text: the structure of a covalent ester intermediate identifies Serbeta1 as the nucleophile and Asnbeta269 and Valbeta70 as the oxyanion hole residues in the AHL degradation process
    reference_section_type: ABSTRACT
  - statement: >-
      The paper frames the enzyme as an AHL amidohydrolase whose action abolishes
      AHL-regulated virulence, i.e. quorum quenching, which is signal degradation
      rather than participation in quorum sensing.
    supporting_text: Enzymatic degradation of these diffusible signals by, e.g., lactonases or amidohydrolases abolishes AHL regulated virulence, a process known as quorum quenching.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Citation-integrity fix: this reference was originally entered as PMID:20133719,
      which actually resolves to an unrelated paper ("Deceptive chemical signals
      induced by a plant virus attract insect vectors") and was a wrong identifier.
      The intended source is Bokhove et al. 2010 PNAS structural study of P. aeruginosa
      PvdQ ("The quorum-quenching N-acyl homoserine lactone acylase PvdQ is an
      Ntn-hydrolase with an unusual substrate-binding pocket", doi:10.1073/pnas.0911839107),
      which establishes the Ntn-hydrolase fold, alpha/beta maturation, Ser-beta1
      nucleophile, and long-chain AHL specificity; orthology basis for the P. putida
      ortholog. The correct PMID was recovered from the DOI via doi_to_pmid and
      independently verified against PubMed (PMID:20080736 -> matching title/DOI).
      The WRONG_IDENTIFIER code records that the original PMID was incorrect; the
      replacement PMID:20080736 is VERIFIED on-topic. The cached entry is
      abstract-only (full_text_available: false), and the work is on the
      P. aeruginosa protein, so it is used here as the orthology basis and not as
      evidence about Q88IU8 itself.
