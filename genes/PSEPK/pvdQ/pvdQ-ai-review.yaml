proposed_new_terms:
- proposed_name: acyl-homoserine lactone acylase activity
  proposed_definition: Catalysis of the reaction - an N-acyl-L-homoserine lactone + H2O = L-homoserine lactone + a carboxylate. This is the amide hydrolysis that releases the acyl chain from the homoserine lactone ring of a quorum-sensing signal, and is distinct from lactonase activity, which opens the ring.
  justification: >-
    EC 3.5.1.97 and RHEA:18937 both exist and are assigned to this entry by
    UniProt, but GO has no corresponding molecular-function term. Searching GO
    for homoserine lactone returns only GO:0061579 N-acyl homoserine lactone
    synthase activity, the signal-synthesising enzyme, so the catabolic half of
    the AHL cycle is unrepresented. The best available term, GO:0016811, is two
    levels above the reaction and groups PvdQ with every other linear-amide
    hydrolase, which is why the same gene also carries the bare GO:0016787 and
    an unrelated antibiotic-biosynthesis term. A term at EC-leaf granularity
    would let curators distinguish AHL acylases from AHL lactonases, the two
    mechanistically distinct quorum-quenching enzyme classes.
  proposed_parent:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
  supported_by:
  - reference_id: file:PSEPK/pvdQ/pvdQ-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=an N-acyl-L-homoserine lactone + H2O = L-homoserine lactone +
    reference_section_type: RESULTS
  - reference_id: PMID:20080736
    supporting_text: Enzymatic degradation of these diffusible signals by, e.g., lactonases or amidohydrolases abolishes AHL regulated virulence, a process known as quorum quenching.
    reference_section_type: ABSTRACT
suggested_questions:
- question: Does KT2440 PvdQ (PP_2901) actually deacylate an acylated ferribactin/pyoverdine precursor, as its P. aeruginosa ortholog does, and is pyoverdine production lost in a pvdQ deletion? The proposed replacement of the antibiotic-biosynthesis term with pyoverdine biosynthesis currently rests on orthology and the NCBIfam bifunctional-acylase model, not on KT2440 data.
- question: Which AHLs does KT2440 PvdQ hydrolyse, and with what chain-length preference? P. putida KT2440 is not itself an AHL producer, so whether the quorum-quenching activity is physiologically relevant or an incidental consequence of the pyoverdine-maturation active site is unresolved.
- question: Should the InterPro2GO mapping from IPR002692 (peptidase S45) to GO:0017000 antibiotic biosynthetic process be narrowed or withdrawn? The family's penicillin and cephalosporin acylases hydrolyse rather than synthesise antibiotics, and its PvdQ members act on siderophore precursors and quorum signals.
- question: Why does deleting or knocking down pvdQ increase outer membrane vesicle production in KT2440? The effect is reproducible but no mechanism links AHL or pyoverdine-precursor hydrolysis to envelope vesiculation, so the phenotype is not currently annotatable.
suggested_experiments:
- hypothesis: PP_2901 performs the periplasmic deacylation step of pyoverdine maturation in KT2440, as its P. aeruginosa ortholog does.
  description: Construct a clean pvdQ deletion and an active-site (Ser221) substitution in KT2440, then compare pyoverdine yield and fluorescence under iron limitation and identify the accumulating acylated ferribactin/pyoverdine precursor by LC-MS; complement with wild-type and catalytically dead alleles to separate the enzymatic step from a structural requirement.
  experiment_type: targeted genetics with siderophore metabolite profiling
- hypothesis: The mature KT2440 enzyme is a periplasmic alpha/beta heterodimer that hydrolyses long-chain AHLs with the C11-C14 preference inferred by similarity.
  description: Express PP_2901 with its native signal peptide, confirm periplasmic localization by osmotic-shock fractionation against cytoplasmic and outer-membrane markers, verify autoproteolytic processing to alpha and beta chains by N-terminal sequencing, and measure kcat and Km across an AHL panel from C4 to C14 alongside the acylated pyoverdine precursor.
  experiment_type: subcellular fractionation with enzyme kinetics
