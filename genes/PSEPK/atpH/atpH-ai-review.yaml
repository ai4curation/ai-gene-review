id: Q88BX1
gene_symbol: atpH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase delta subunit, the peripheral F1-side stator component that joins subunit b to the alpha/beta head and stabilizes the catalytic sector against rotor torque.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpH is a peripheral component of the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate although delta is not membrane-spanning.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Delta contributes stator coupling required for proton-driven ATP synthesis at the plasma membrane.
      action: MODIFY
      reason: >-
        The process is right but the term is the general parent. P. putida F0F1 is a
        plasma-membrane enzyme, so the plasma-membrane-specific child GO:0042777 is the
        accurate placement. GOA already carries GO:0042777 for atpB and atpG; applying it
        across all eight subunits makes the operon agree on one term for one identical
        process instead of splitting between parent and child by accident of which
        UniRule fired.
      proposed_replacement_terms:
        - id: GO:0042777
          label: proton motive force-driven plasma membrane ATP synthesis
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Delta structurally supports the rotary enzyme but does not independently enable its catalytic activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity belongs to the assembled F0F1 complex and should be represented as a contribution.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: file:PSEPK/atpH/atpH-uniprot.txt
    qualifier: part_of
    review:
      summary: AtpH is the delta component of the F1-side peripheral stalk.
      action: NEW
      reason: >-
        GOA has no complex-membership annotation for AtpH, yet the reviewed UniProt
        SUBUNIT description places delta explicitly in the F-type ATPase: it names delta
        as one of the five F1 subunits and as one of the two chains forming the
        peripheral stalk. That is a direct structural statement about the protein, not a
        GO cross-reference line echoing an existing annotation.
      supported_by:
      - reference_id: file:PSEPK/atpH/atpH-uniprot.txt
        supporting_text: 'F(1) has five subunits: alpha(3), beta(3), gamma(1), delta(1), epsilon(1).'
      - reference_id: file:PSEPK/atpH/atpH-uniprot.txt
        supporting_text: while a peripheral stalk is formed by the delta and b chains.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/atpH/atpH-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida AtpH (Q88BX1)
    findings:
      - statement: UniProt identifies AtpH as the delta component of the stalk linking F0 and F1.
core_functions:
  - description: Forms the F1-side delta component of the peripheral stator stalk, mechanically coupling the catalytic head to F0 and contributing to rotational ATP synthesis.
    contributes_to_molecular_function:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    directly_involved_in:
      - id: GO:0042777
        label: proton motive force-driven plasma membrane ATP synthesis
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    supported_by:
      - reference_id: file:PSEPK/atpH/atpH-uniprot.txt
        supporting_text: This protein is part of the stalk that links CF(0) to CF(1).
proposed_new_terms: []
