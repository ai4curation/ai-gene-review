id: Q88HS5
gene_symbol: paaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaA is the predicted catalytic alpha subunit of the soluble PaaABCE ring
  1,2-phenylacetyl-CoA epoxidase system in Pseudomonas putida KT2440. It is a
  ferritin-like diiron-oxygenase family protein that, with PaaC, forms the
  catalytic core of the multicomponent complex and contributes to
  NADPH- and oxygen-dependent epoxidation of the aromatic ring of
  phenylacetyl-CoA during aerobic phenylacetate catabolism.
