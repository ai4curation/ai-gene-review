    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct expected location for the soluble epoxidase system.
    action: ACCEPT
    reason: >-
      PaaA has no predicted signal peptide or transmembrane segment, acts on
      cytoplasmic CoA thioesters, and the orthologous E. coli PaaAC subcomplex
      is a soluble protein complex.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        However, when PaaA and PaaC were coexpressed, they formed a well
        behaved soluble complex.
- term:
