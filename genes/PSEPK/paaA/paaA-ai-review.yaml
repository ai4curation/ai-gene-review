    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct process annotation for the PaaA epoxidase subunit.
    action: ACCEPT
    reason: >-
      Q88HS5 is classified in the PANTHER 1,2-phenylacetyl-CoA epoxidase
      subunit A subfamily and the NCBIfam PaaA family (TIGR02156), and lies in
      the paa catabolic locus. The orthologous PaaABC(D)E complex catalyzes
      the first committed ring-attack step of aerobic phenylacetate
      catabolism.
    supported_by:
    - reference_id: file:PSEPK/paaA/paaA-uniprot.txt
