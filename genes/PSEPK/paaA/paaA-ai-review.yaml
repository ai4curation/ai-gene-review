- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PaaA is the catalytic diiron subunit of the PaaABCE epoxidase; the full
      NADPH-dependent reaction also requires PaaB, PaaC and the reductase PaaE.
    action: ACCEPT
    reason: >-
      GO practice allows the subunit carrying the active site of a
      multisubunit enzyme to be annotated as enabling the activity, with
      accessory subunits annotated contributes_to. Q88HS5 is the PaaA
      ortholog (PANTHER subunit A subfamily; NCBIfam TIGR02156), and in the
      E. coli ortholog structure the di-iron site lies in PaaA, which is the
      catalytic alpha subunit; the activity was demonstrated for the
      reconstituted complex, including the Pseudomonas sp. Y2 enzyme. This
      matches the E. coli PaaA review (ACCEPT), while PaaB, PaaC and PaaE
      carry the activity as contributes_to.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        The anomalous difference map based on crystals soaked with iron
        indicated that the iron binds at the expected site within PaaA.
    - reference_id: PMID:21247899
      supporting_text: >-
        We conclude that PaaAC forms a catalytic core with a monooxygenase fold
        with PaaA being the catalytic α subunit and PaaC, the structural β
        subunit.
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
    - reference_id: PMID:20660314
      supporting_text: PaaABC(D)E thus functions as a ring 1,2-phenylacetyl-CoA epoxidase.
    - reference_id: file:PSEPK/paaA/paaA-uniprot.txt
      supporting_text: 'NCBIfam; TIGR02156; PA_CoA_Oxy1'
