suggested_questions:
- question: >-
    Is the C-terminal APS-kinase-like domain of Q88NA8 catalytically active, or
    is it a retained but inactive fusion remnant in the direct APS-reduction route?
suggested_experiments:
- description: >-
    Reconstitute Q88NA8/Q88NA9 and quantify both APS and PAPS formation, then
    test isolated C-terminal-domain and active-site variants for APS kinase activity.
