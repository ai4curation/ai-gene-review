  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  CysNC is the GTPase-containing regulatory subunit 1 of the proteobacterial
  sulfate adenylyltransferase complex. It couples GTP hydrolysis to the CysD
  reaction that converts sulfate and ATP to APS. The protein also carries a
  C-terminal APS-kinase-like domain, but the catalytic contribution of that
  domain to the KT2440 complex remains unresolved.
