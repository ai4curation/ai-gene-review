id: Q88NA8
gene_symbol: cysNC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: CysNC is the GTPase-containing regulatory subunit 1 of the proteobacterial sulfate adenylyltransferase
  complex. It couples GTP hydrolysis to the CysD reaction that converts sulfate and ATP to APS. The protein
  also carries a C-terminal APS-kinase-like domain, but the catalytic contribution of that domain to the
  KT2440 complex remains unresolved.
