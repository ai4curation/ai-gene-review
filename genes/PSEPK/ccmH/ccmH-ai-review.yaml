  label: Pseudomonas putida KT2440
description: ccmH encodes a membrane-associated thiol-disulfide handling component of cytochrome c maturation
  system I. Contributes thiol-disulfide substrate handling to the CcmF-associated heme-ligation machinery.
  The separate CcmI/CycH accessory factor supplies a distinct substrate-handling component; the exact
  CcmH thiol-exchange reaction remains unresolved. Its mechanistic assignment in Pseudomonas putida KT2440
  is inferred from conserved features and characterized system I orthologs.
