  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmH is a membrane-associated periplasmic component of cytochrome c maturation system I. It cooperates with CcmG in maintaining apocytochrome CXXCH cysteines in a ligation-competent state and with CcmF during covalent heme attachment.
