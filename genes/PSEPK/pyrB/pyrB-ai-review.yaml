suggested_questions:
  - question: >-
      Does the unique N-terminal regulatory region of KT2440 PyrB retain the same
      nucleotide-response profile reported for the P. putida PyrB/PyrC' holoenzyme?
suggested_experiments:
  - description: >-
      Purify KT2440 PyrB with and without PyrC' and compare catalytic activity,
      oligomeric state, and nucleotide responses to test the structural role of
      PyrC' and the regulatory function of the PyrB N-terminal extension.
    experiment_type: biochemical reconstitution and oligomerization assay
