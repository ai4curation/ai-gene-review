  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: pyrB encodes the catalytic subunit of aspartate carbamoyltransferase, which condenses carbamoyl phosphate with L-aspartate to form N-carbamoyl-L-aspartate in the committed ring-assembly step of de novo UMP biosynthesis.
existing_annotations:
  - term:
      id: GO:0004070
      label: aspartate carbamoyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: PyrB catalyzes the Rhea 20013 aspartate carbamoyltransferase reaction.
      action: ACCEPT
      reason: The reviewed UniProt entry directly defines this activity.
      supported_by:
        - reference_id: file:PSEPK/pyrB/pyrB-uniprot.txt
          supporting_text: Reaction=carbamoyl phosphate + L-aspartate = N-carbamoyl-L-aspartate +
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A cytosolic location is plausible but is supported only by phylogenetic inference.
      action: UNDECIDED
      reason: The reviewed UniProt record has no independent localization statement.
  - term:
      id: GO:0006207
      label: '''de novo'' pyrimidine nucleobase biosynthetic process'
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: PyrB acts in de novo pyrimidine synthesis.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retain the more specific de novo UMP biosynthetic process.
      supported_by:
        - reference_id: file:PSEPK/pyrB/pyrB-uniprot.txt
          supporting_text: committed step in the de novo pyrimidine nucleotide biosynthesis
  - term:
      id: GO:0006520
      label: amino acid metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: L-aspartate is a substrate, but the reaction is committed to pyrimidine nucleotide synthesis.
      action: REMOVE
      reason: Substrate use does not justify assigning PyrB to amino acid metabolism.
      supported_by:
        - reference_id: file:PSEPK/pyrB/pyrB-uniprot.txt
          supporting_text: committed step in the de novo pyrimidine nucleotide biosynthesis
  - term:
      id: GO:0016597
      label: amino acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Aspartate binding is implicit in catalysis but this binding term is uninformative.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retain the substrate-specific catalytic activity.
      supported_by:
        - reference_id: file:PSEPK/pyrB/pyrB-uniprot.txt
          supporting_text: condensation of carbamoyl phosphate and
  - term:
