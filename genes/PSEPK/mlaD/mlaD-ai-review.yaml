knowledge_gaps:
  - gap_statement: The physiologically dominant net direction of the KT2440 Mla system has not been established directly.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: >-
      MlaD's binding/interface role is direction-neutral, so the review does
      not project a universal retrograde model onto the PSEPK system.
  - gap_statement: PP_0960 has not been tested directly by biochemical or loss-of-function experiments in KT2440.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: >-
      The first-pass assignment rests on diagnostic sequence architecture,
      operon context, and orthologous MlaD structural and transport studies.
suggested_questions:
  - question: How does KT2440 MlaD exchange phospholipids with Ttg2D/MlaC, and is net transport condition-dependent?
suggested_experiments:
  - description: Reconstitute MlaFEDB and measure lipid exchange with purified Ttg2D using species-resolved phospholipids.
    experiment_type: protein-to-protein phospholipid-transfer assay
