id: Q88P92
gene_symbol: mlaD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Single-pass inner-membrane MCE-domain subunit of the MlaFEDB phospholipid
  transporter. MlaD binds glycerophospholipids and oligomerizes into a
  periplasm-facing interface that exchanges lipid with the soluble MlaC-family
  carrier and the MlaE permease.
existing_annotations:
  - term:
      id: GO:0005543
      label: phospholipid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Correct core molecular function for the lipid-binding MCE-domain subunit.
      action: ACCEPT
      reason: >-
        Q88P92 contains the diagnostic MlaD/MCE domain and a single N-terminal
        membrane anchor; structural work on orthologs places phospholipid
        binding at the periplasm-facing MlaD ring.
  - term:
      id: GO:0015914
      label: phospholipid transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Correct process annotation for the MlaFEDB lipid-transfer interface.
      action: ACCEPT
      reason: >-
        MlaD is the lipid-binding interface of the MlaFEDB complex and exchanges
        glycerophospholipid with the periplasmic MlaC-family carrier. The
        annotation does not require committing to a single net transport
        direction.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: ISM
    original_reference_id: file:PSEPK/mlaD/mlaD-deep-research-openscientist.md
    qualifier: located_in
    review:
      summary: Q88P92 is anchored in the inner/plasma membrane by one N-terminal transmembrane helix.
      action: NEW
      reason: >-
        Target-sequence hydropathy identifies one strong N-terminal membrane
        anchor followed by the periplasm-facing MlaD/MCE domain.
  - term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence_type: ISS
    original_reference_id: file:PSEPK/mlaD/mlaD-deep-research-openscientist.md
    qualifier: involved_in
    review:
      summary: MlaD participates in phospholipid exchange between the inner-membrane MlaFEDB complex and the periplasmic carrier.
      action: NEW
      reason: >-
        The diagnostic MlaD family/domain assignment and mlaFED operon context
        support the conserved intermembrane transfer process without asserting
        a fixed net direction.
