  - id: file:PSEPK/mlaD/mlaD-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK MlaD/Q88P92
    findings:
      - statement: >-
          Q88P92 has a single N-terminal transmembrane anchor followed by one
          MlaD/MCE domain, matching an inner-membrane-anchored,
          periplasm-facing MlaD subunit.
        supporting_text: Q88P92 has one Mce/MlaD domain (Pfam **PF02470**, residues **39–116**) — the short, single-ring MlaD type
      - statement: >-
          The report supports phospholipid binding and a MlaC-facing role but
          notes that transport direction and the precise role of ATP remain
          debated.
        supporting_text: The precise **directionality** (retrograde vs. bidirectional) and the exact **role of ATP hydrolysis** remain debated even in model organisms
