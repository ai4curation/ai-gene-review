taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RuvC is the magnesium-dependent structure-specific endonuclease of the bacterial
  RuvABC Holliday-junction-processing system. Its RNase H-like active site cleaves
  opposing strands of a migrated four-way junction to produce ligatable duplex
  recombination products. The KT2440 protein retains the canonical RuvC family
  assignment and annotated catalytic acidic residues.
existing_annotations:
  - term:
      id: GO:0000287
      label: magnesium ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: RuvC binds catalytic magnesium ions through conserved acidic active-site residues.
      action: KEEP_AS_NON_CORE
      reason: Correct cofactor binding supports, but does not define, the junction-resolvase activity.
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but too broad relative to the structure-specific endonuclease term.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008821 captures the relevant substrate and catalytic activity.
  - term:
      id: GO:0004520
      label: DNA endonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct parent activity but redundant with crossover-junction DNA endonuclease activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: The exact child term GO:0008821 is already present.
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Consistent with chromosome-associated repair but not function-defining.
      action: KEEP_AS_NON_CORE
      reason: Generic cytoplasmic localization is secondary to the direct nuclease mechanism.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: RuvC resolves recombination intermediates generated during DNA repair.
      action: ACCEPT
      reason: This is a conserved biological role of RuvC-family resolvases.
  - term:
      id: GO:0006310
      label: DNA recombination
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Holliday-junction resolution is a direct late step of homologous recombination.
      action: ACCEPT
      reason: The exact RuvC family assignment and catalytic mechanism support this process.
  - term:
      id: GO:0008821
      label: crossover junction DNA endonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: RuvC symmetrically cleaves Holliday-junction DNA at the crossover.
      action: ACCEPT
      reason: This is the defining catalytic activity of the exact RuvC subfamily.
      supported_by:
        - reference_id: file:PSEPK/ruvC/ruvC-uniprot.txt
          supporting_text: Cleaves cruciform DNA by making single-stranded nicks across the HJ at symmetrical positions
        - reference_id: PMID:7923356
          supporting_text: The crystal structure of the RuvC protein, a Holliday junction resolvase from E. coli
  - term:
      id: GO:0048476
      label: Holliday junction resolvase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: part_of
    review:
      summary: RuvC is the catalytic resolvase subunit of the RuvABC assembly.
      action: ACCEPT
      reason: Conserved RuvABC complex architecture supports this annotation.
