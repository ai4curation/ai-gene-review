  label: Pseudomonas putida KT2440
description: RuvC is the magnesium-dependent Holliday-junction resolvase of Pseudomonas putida, encoded
  in the ruvCAB locus. A homodimeric RNase H-like endonuclease, it binds four-way junctions and makes
  symmetrical nicks in opposing strands at consensus sites reached through RuvAB branch migration, producing
  ligatable duplex recombination products with 5'-phosphate and 3'-hydroxyl ends. The protein retains
  the conserved acidic catalytic residues of the RuvC family; function is inferred from conservation with
  characterized RuvC proteins such as E. coli RuvC.
