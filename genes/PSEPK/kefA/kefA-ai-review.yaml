- id: PMID:12374733
  title: Ionic regulation of MscK, a mechanosensitive channel from Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Patch-clamp characterization of E. coli MscK (P77338), 43% identical to PP_5067.
      Establishes tension gating with a requirement for external K+-like cations, and a
      slight anion preference.
  findings:
  - statement: E. coli MscK gating needs membrane tension plus high external K+, NH4+, Rb+ or Cs+.
    supporting_text: >-
      MscK, but not MscS activity appears to be regulated by external ionic environment,
      requiring not only membrane tension but also high concentrations of external K(+),
      NH(4)(+), Rb(+) or Cs(+) to gate
  - statement: MscK is not K+-selective; like MscS it slightly prefers anions.
    supporting_text: While both show a slight anionic preference, MscK appears to be more sensitive to membrane tension.
- id: PMID:36371466
  title: Structural basis for mechanotransduction in a potassium-dependent mechanosensitive ion
    channel.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cryo-EM structures of E. coli MscK in closed, intermediate and open states.
  findings:
  - statement: MscK is a heptamer with a periplasmic N-terminal domain, eleven TM helices and a cytoplasmic C-terminal domain.
    supporting_text: >-
      The MscK channel forms a symmetric heptamer, with each subunit comprised of three
      distinct layers: an N-terminal periplasmic PD, a TMD with eleven TM helices, and a
      C-terminal cytoplasmic CTD
- id: PMID:10202137
  title: 'Protection of Escherichia coli cells against extreme turgor by activation of MscS and
    MscL mechanosensitive channels: identification of genes required for MscS activity.'
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genetic identification of kefA (MscK) in E. coli; abstract only read.
  findings:
  - statement: E. coli KefA/MscK has no major role in hypo-osmotic downshock.
    supporting_text: >-
      The channel determined by KefA does not appear to have a major role in managing the
      transition from high to low osmolarity.
- id: PMID:11985727
  title: Analysis of the kefA2 mutation suggests that KefA is a cation-specific channel involved
    in osmotic adaptation in Escherichia coli.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The E. coli kefA2 missense allele makes growth sensitive to high K+ with betaine or
      proline; abstract only read. The title's "cation-specific" refers to regulation of the
      channel, later shown to be ion-dependent gating rather than K+ selectivity
      (PMID:12374733).
  findings:
  - statement: A kefA missense mutation impairs control of cytoplasmic K+ in high-K+ medium.
    supporting_text: >-
      Analysis of the cytoplasmic pools shows that the mutant cannot regulate the K+ content
      of the cytoplasm when grown in high K+ medium.
- id: PMID:12505982
  title: Domain organization of the MscS mechanosensitive channel of Escherichia coli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Shows the C-terminal MscS-like part of MscK carries the channel function.
  findings:
  - statement: A truncated MscK (C-terminal MscS-like region) protects against downshock.
    supporting_text: >-
      expression of a truncated MscK protein can substitute for MscL and MscS in downshock
      survival assays
