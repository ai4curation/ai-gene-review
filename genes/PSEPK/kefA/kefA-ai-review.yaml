- term:
    id: GO:0009992
    label: intracellular water homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002411127
  review:
    summary: >-
      Family-level osmotic role; plausible but not shown for MscK, whose contribution to
      downshock survival in E. coli is minor.
    action: KEEP_AS_NON_CORE
    reason: >-
      MscS-family channels act as osmotic safety valves, and a truncated MscK channel core can
      protect E. coli MscS/MscL mutants against downshock (PMID:12505982). Full-length E. coli
      MscK, however, does not appear to have a major role in the transition from high to low
      osmolarity (PMID:10202137), and its K+-dependent gating suggests a more specialized role
      (PMID:12374733). No osmotic phenotype has been reported for PP_5067. The term is kept as
      a plausible, non-core family-level process.
    supported_by:
    - reference_id: PMID:10202137
      supporting_text: >-
        The channel determined by KefA does not appear to have a major role in managing the
        transition from high to low osmolarity.
    - reference_id: PMID:12505982
      supporting_text: >-
        expression of a truncated MscK protein can substitute for MscL and MscS in downshock
        survival assays
    - reference_id: file:PSEPK/kefA/kefA-deep-research-claude-code.md
      supporting_text: I found no publication that characterizes PP_5067 experimentally in *P. putida*.
