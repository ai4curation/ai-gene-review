    summary: >-
      Core function by orthology to E. coli MscK, an electrophysiologically characterized
      tension-gated channel.
    action: ACCEPT
    reason: >-
      The protein is a full-length MscK-subfamily member (PANTHER PTHR30347:SF1, NCBIfam
      PRK11281) at 43.1% identity to E. coli MscK over 1077 aligned residues, with the same
      domain order and TM count, and with the periplasmic tryptophan gate residue and the
      gating-sensitive G922 equivalent conserved. E. coli MscK gates in response to membrane
      tension in patch clamp (PMID:12374733). The ion-dependence of E. coli MscK gating is a
      regulatory property, not ion selectivity, so no potassium-channel term is warranted.
      Not tested on the P. putida protein.
    supported_by:
    - reference_id: PMID:12374733
      supporting_text: >-
        MscK, but not MscS activity appears to be regulated by external ionic environment,
        requiring not only membrane tension but also high concentrations of external K(+),
        NH(4)(+), Rb(+) or Cs(+) to gate
