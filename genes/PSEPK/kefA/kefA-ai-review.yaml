description: >-
  PP_5067 (kefA, 1102 aa) is the Pseudomonas putida KT2440 member of the MscK subfamily of
  MscS-type mechanosensitive channels (PANTHER PTHR30347:SF1, NCBIfam PRK11281). It has not
  been studied experimentally in P. putida. It is 43.1% identical over its full length to
  E. coli MscK (KefA, P77338) and shares that protein's architecture: an N-terminal signal or
  anchor segment, a ~465-residue periplasmic region with the MscS porin domain, eleven
  transmembrane helices that align one-to-one with the eleven of E. coli MscK, and a
  C-terminal MscS-like pore helix plus cytoplasmic domain. The MscK periplasmic tryptophan
  gate residue (E. coli W914) and the gating-sensitive glycine (E. coli G922) are conserved.
  E. coli MscK is a tension-gated heptameric channel that needs high external K+, NH4+, Rb+
  or Cs+ to open, with a slight anion preference rather than K+ selectivity; it contributes
  little to downshock survival. By orthology PP_5067 is therefore a mechanosensitive ion
  channel of the plasma membrane. Its ion requirements, physiological role and any
  contribution to antibiotic tolerance in P. putida are untested. The only fitness evidence
  is from homologs; KT2440 Fitness Browser data could not be retrieved. The review is filed on
  the KT2440 reference-proteome entry, which is 98.8% identical to the KBase dashboard
  sequence NZ_LGRH01000055.1_2.
