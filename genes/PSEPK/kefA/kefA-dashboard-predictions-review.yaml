  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct but not novel: GOA already holds this term for Q88CW3 as an IEA (ARBA). The
      query is a full-length MscK-subfamily protein, 43.1% identical to E. coli MscK over
      1077 aligned residues, with all eleven TM helices matching MscK's and the MscK
      periplasmic tryptophan gate residue conserved. E. coli MscK opens under membrane
      tension in patch clamp, with a requirement for external K+-like cations
      (PMID:12374733). The call rightly declines a K+-selective channel term. Inferred by
      orthology; not measured for the P. putida protein.
    supported_by:
