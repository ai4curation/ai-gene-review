description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_LGRH01000055.1_2 (eggNOG name kefA) is "MscK-like small-conductance mechanosensitive ion
  channel associated with polymyxin B tolerance" (tier A), with two GO terms: GO:0008381
  mechanosensitive monoatomic ion channel activity and GO:0034220 monoatomic ion
  transmembrane transport. The exact-sequence UniProt entries are deleted, so the call is
  scored on the KT2440 reference-proteome entry Q88CW3 (PP_5067), 98.8% identical over all
  1102 residues. The channel part of the call is correct: the query is a full-length MscK
  homolog (43.1% identical to E. coli MscK over its whole length) with the MscK topology of a
  periplasmic N-terminal region and eleven TM helices that align one-to-one with those of E.
  coli MscK. Both GO terms are correct and both are already in GOA as IEA, so both are CNN.
  The "polymyxin B tolerance" clause is not a GO term here, but it is the weakest part of the
  call. It rests on one Fitness Browser homolog (P. simiae WCS417, 76% identity) and one
  compound, polymyxin B, at two concentrations (11 experiments, fitness -2.77 to -1.34).
  There is no KT2440 fitness data in the evidence, no cofitness, and no literature linking
  MscK to polymyxin. The second homolog with phenotypes (P. stutzeri RCH2, 61.6%) is
  sensitive to nickel, not polymyxin. The association is therefore a plausible lead for a
  close homolog, not an established property of PP_5067.
