id: Q88KF3
gene_symbol: prpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PrpF is the methylaconitate positional isomerase of the two-component
  AcnD/PrpF branch of the 2-methylcitrate cycle in Pseudomonas putida KT2440.
  It rearranges the distinct methylaconitate product of AcnD to the
  2-methyl-cis-aconitate substrate accepted by the downstream
  aconitase-family hydration step.
existing_annotations:
- term:
    id: GO:0016853
    label: isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: True but more general than the evidence for this PrpF supports.
    action: MODIFY
    reason: >-
      UniProt classifies Q88KF3 in the NCBIfam TIGR02334 PrpF family, and the pathway-level
      family analysis identifies it as the PrpF that converts the AcnD product
      to 2-methyl-cis-aconitate. The characterized Shewanella ortholog moves the
      C=C bond of the AcnD product (probably 4-methyl-cis-aconitate), so
      GO:0016863 (EC 5.3.3), which PAINT asserts for the PrpF clade (PTN002017920),
      is the most precise existing term, matching the SHEON prpF review. The exact
      reaction has no GO term yet (see proposed_new_terms).
    proposed_replacement_terms:
    - id: GO:0016863
      label: intramolecular oxidoreductase activity, transposing C=C bonds
    supported_by:
    - reference_id: PMID:29145506
      supporting_text: PrpF (SoPrpF) protein isomerizes the product of the SoAcnD dehydratase
        (putatively 4-methyl-cis-aconitate (4-MCA) to 2-methyl-cis-aconitate (2-MCA)
    - reference_id: file:PSEPK/prpF/prpF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR02334; prpF; 1.'
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__methylcitrate_cycle__ppu00640-deep-research-openscientist.md
      supporting_text: 'Its product is 2-methyl-*trans*-aconitate, which PrpF (2-methylaconitate isomerase, EC 5.3.3.-) converts to the 2-methyl-*cis*-aconitate accepted by aconitase'
- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
