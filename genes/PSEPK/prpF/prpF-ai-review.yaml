proposed_new_terms:
- proposed_name: methylaconitate isomerase activity
  proposed_definition: >-
    Catalysis of the isomerization of a methylaconitate isomer produced by
    aconitase-like 2-methylcitrate dehydratase (AcnD) to 2-methyl-cis-aconitate.
  justification: >-
    Same proposal as genes/SHEON/prpF (one term for the PrpF reaction). The closest
    existing term, GO:0047614 aconitate delta-isomerase activity, describes the
    unmethylated model reaction only. The AcnD product is probably
    4-methyl-cis-aconitate (positional C=C shift) rather than
    2-methyl-trans-aconitate (cis/trans flip), so the parent is GO:0016863 rather
    than GO:0016859 cis-trans isomerase activity, and the definition is written in
    terms of the product, 2-methyl-cis-aconitate.
  proposed_parent:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  supported_by:
  - reference_id: PMID:29145506
    supporting_text: PrpF (SoPrpF) protein isomerizes the product of the SoAcnD dehydratase
      (putatively 4-methyl-cis-aconitate (4-MCA) to 2-methyl-cis-aconitate (2-MCA)
  - reference_id: file:modules/methylcitrate_cycle-deep-research-openscientist.md
    supporting_text: 'points to **4-methylaconitate**, but the precise structure/stereochemistry'
suggested_questions:
- question: How do KT2440 PrpF kinetics compare between the physiological methylaconitate isomer and unmethylated trans-aconitate?
suggested_experiments:
- description: >-
    Generate the physiological AcnD product enzymatically, assay purified PrpF
    against it and unmethylated trans-aconitate, and identify products by
    targeted LC-MS and NMR.
