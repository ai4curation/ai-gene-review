id: Q88HU9
gene_symbol: PP_3254
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3254 is a predicted 5'-methylthioadenosine/S-adenosylhomocysteine
  nucleosidase of the PTHR46832:SF1 MtnN family. It is expected to hydrolyze
  MTA and S-adenosylhomocysteine to adenine plus the corresponding thioribose,
  supporting sulfur-compound recycling and removal of inhibitory
  S-adenosylmethionine-cycle by-products. Despite carrying a generic nucleoside
  phosphorylase-domain fold, this hydrolytic MtnN assignment does not satisfy
  phosphate-dependent purine-nucleoside phosphorylase activity. Q88HU9 has not
  been characterized directly.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Replace this generic term with the two substrate-specific activities.
      action: MODIFY
      reason: >-
        GO:0008782 and GO:0008930 specify the predicted MtnN reactions, whereas
        catalytic activity alone provides no useful functional information.
      proposed_replacement_terms:
        - id: GO:0008782
          label: adenosylhomocysteine nucleosidase activity
        - id: GO:0008930
          label: methylthioadenosine nucleosidase activity
      supported_by:
        - reference_id: file:PSEPK/PP_3254/PP_3254-goa.tsv
          supporting_text: "GO:0003824\tcatalytic activity"
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosol is plausible context but not a core function.
      action: KEEP_AS_NON_CORE
      reason: >-
        TreeGrafter predicts a soluble cytosolic MtnN-family enzyme; no direct
        localization study exists for Q88HU9.
      supported_by:
        - reference_id: file:PSEPK/PP_3254/PP_3254-goa.tsv
          supporting_text: "GO:0005829\tcytosol"
  - term:
      id: GO:0008782
      label: adenosylhomocysteine nucleosidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: PP_3254 is predicted to hydrolyze S-adenosylhomocysteine.
      action: ACCEPT
      reason: >-
        The exact PTHR46832:SF1 family consists of MtnN proteins with coupled
        MTA and S-adenosylhomocysteine nucleosidase specificity. This is a
        family inference rather than a direct Q88HU9 assay.
      supported_by:
        - reference_id: file:PSEPK/PP_3254/PP_3254-goa.tsv
          supporting_text: "GO:0008782\tadenosylhomocysteine nucleosidase activity"
        - reference_id: file:PSEPK/PP_3254/PP_3254-uniprot.txt
          supporting_text: "PTHR46832:SF1; 5'-METHYLTHIOADENOSINE_S-ADENOSYLHOMOCYSTEINE NUCLEOSIDASE"
        - reference_id: file:PSEPK/PP_3254/PP_3254-deep-research-openscientist.md
          supporting_text: PANTHER classifies it as subfamily **PTHR46832:SF1**
  - term:
      id: GO:0008930
      label: methylthioadenosine nucleosidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: PP_3254 is predicted to hydrolyze 5'-methylthioadenosine.
      action: ACCEPT
      reason: >-
        The exact PTHR46832:SF1 family supports MtnN specificity. This
        hydrolysis differs from MTA phosphorylase and purine-nucleoside
        phosphorylase chemistry.
      supported_by:
        - reference_id: file:PSEPK/PP_3254/PP_3254-goa.tsv
          supporting_text: "GO:0008930\tmethylthioadenosine nucleosidase activity"
        - reference_id: file:PSEPK/PP_3254/PP_3254-uniprot.txt
          supporting_text: "PTHR46832; 5'-METHYLTHIOADENOSINE/S-ADENOSYLHOMOCYSTEINE NUCLEOSIDASE"
  - term:
      id: GO:0009116
      label: nucleoside metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The broad process is compatible with MtnN activity but non-core.
      action: KEEP_AS_NON_CORE
      reason: >-
        Both predicted substrates are modified adenosine nucleosides, so the
        broad process is correct although it does not distinguish sulfur-
        metabolite recycling from canonical purine salvage.
      supported_by:
        - reference_id: file:PSEPK/PP_3254/PP_3254-goa.tsv
          supporting_text: "GO:0009116\tnucleoside metabolic process"
