suggested_questions:
  - question: >-
      Does Q88HU9 use both MTA and S-adenosylhomocysteine efficiently, and does
      it contribute to methionine salvage or quorum-sensing metabolite flux in KT2440?
suggested_experiments:
  - description: >-
      Measure hydrolysis of MTA, S-adenosylhomocysteine, adenosine, inosine,
      and guanosine by purified Q88HU9 with and without phosphate.
