suggested_questions:
- question: >-
    Is KT2440 TrpE feedback-inhibited by L-tryptophan, and does PANTHER's
    placement of it in the isochorismate synthase MenF subfamily
    (PTHR11236:SF48) reflect any difference in regulation or substrate use from
    the TrpE proteins of SF9?
