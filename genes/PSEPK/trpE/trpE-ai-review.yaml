id: Q88QS1
gene_symbol: trpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  trpE (PP_0417) encodes anthranilate synthase component I, the large alpha
  subunit of anthranilate synthase (EC 4.1.3.27). With the glutamine
  amidotransferase subunit TrpG (PP_0420) it forms the heterotetrameric enzyme
  of the first committed step of L-tryptophan biosynthesis. TrpE binds
  chorismate, aminates it with ammonia that TrpG releases from L-glutamine, and
  eliminates pyruvate to give anthranilate. On its own, TrpE can make
  anthranilate from chorismate and high concentrations of free ammonia. The
  enzyme is Mg2+-dependent and belongs to the chorismate-binding
  (anthranilate synthase component I) family. In Pseudomonas putida KT2440,
  trpE is a monocistronic unit, separate from the trpGDC operon. A transposon
  insertion in trpE gives a tryptophan auxotroph that grows when anthranilate,
  indole or tryptophan is supplied.
