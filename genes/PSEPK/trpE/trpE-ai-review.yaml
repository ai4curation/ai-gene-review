  review:
    summary: >-
      TrpE is the chorismate-binding synthase subunit of anthranilate synthase,
      and carries the aminase/lyase chemistry of the reaction.
    action: ACCEPT
    reason: >-
      Core molecular function. The RuleBase (RU364045) function and catalytic
      activity statements, the TrpE-specific NCBIfam model TIGR00564
      (trpE_most) and the Pfam chorismate-binding and Anth_synt_I_N domains
      support it. Anthranilate rescue of the KT2440 trpE mutant confirms it
      genetically. TrpE can act with free ammonia, but in vivo it works with
      TrpG, so the enabled activity is that of the synthase subunit in the
      TrpE-TrpG complex.
