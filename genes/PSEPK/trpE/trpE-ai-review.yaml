core_functions:
- description: >-
    Synthase (component I) subunit of anthranilate synthase. It binds
    chorismate and, with ammonia supplied by the TrpG glutaminase subunit,
    converts it to anthranilate and pyruvate, the first committed step of
    L-tryptophan biosynthesis.
