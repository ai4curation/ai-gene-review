knowledge_gaps:
- gap_statement: GO lacks a molecular-function term that cleanly represents PBP-family D,D-transpeptidation.
  status: OPEN
  gap_kind: [ONTOLOGY]
  significance: The available carboxypeptidase term must not be used as the primary label for peptide crosslinking.
- gap_statement: Direct kinetics, LpoP activation, and redundancy with MrcA have not been tested for KT2440 MrcB.
  status: OPEN
  gap_kind: [BIOLOGY]
  significance: These physiological details are inferred from PBP1B orthologs.
