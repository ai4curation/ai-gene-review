id: Q88DY5
gene_symbol: mrcB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  MrcB/PBP1B is a bitopic inner-membrane class-A penicillin-binding protein
  whose periplasmic GT51 and transpeptidase domains polymerize lipid II into
  glycan strands and form D,D peptide crosslinks. It is a major bifunctional
  peptidoglycan synthase with a central lipoprotein-responsive regulatory domain.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: PBP1B is anchored in the cytoplasmic membrane by an N-terminal helix.
    action: ACCEPT
    reason: The anchor positions its catalytic domains on the periplasmic face.
- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This broad term obscures the substrate and the principal D,D-transpeptidase reaction.
    action: MODIFY
    reason: GO:0009002 is the available specific hydrolytic term, although it still does not name peptide crosslinking.
    proposed_replacement_terms:
    - id: GO:0009002
      label: serine-type D-Ala-D-Ala carboxypeptidase activity
- term:
    id: GO:0008658
    label: penicillin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The transpeptidase active-site serine binds beta-lactam antibiotics covalently.
    action: ACCEPT
    reason: Penicillin binding is a defining property of the intact PBP1B transpeptidase domain.
- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The GT51 domain polymerizes lipid II into peptidoglycan glycan strands.
    action: ACCEPT
    reason: This is one of the two core catalytic roles of PBP1B and is represented cleanly in GO.
- term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PBP1B can hydrolyze terminal D-Ala under some conditions, but its principal PBP reaction is D,D-transpeptidation.
    action: KEEP_AS_NON_CORE
    reason: The term can represent secondary carboxypeptidation but must not substitute for the missing D,D-transpeptidase MF.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PBP1B directly polymerizes and crosslinks peptidoglycan.
    action: ACCEPT
    reason: Both catalytic domains act in late extracytoplasmic sacculus synthesis.
- term:
    id: GO:0009274
    label: peptidoglycan-based cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The cell wall is the product and site of action, not the location of this membrane-anchored enzyme.
    action: REMOVE
    reason: PBP1B is anchored in the cytoplasmic membrane with periplasm-facing catalytic domains.
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The large catalytic region of PBP1B acts in the periplasm.
    action: ACCEPT
    reason: A single N-terminal membrane anchor places both catalytic domains on the periplasmic face.
- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Being a beta-lactam target does not itself establish participation in an antibiotic-response process.
    action: MARK_AS_OVER_ANNOTATED
    reason: No KT2440 evidence shows that MrcB regulates or executes a cellular antibiotic response.
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/mrcB/mrcB-deep-research-openscientist.md
  title: OpenScientist deep research report on PSEPK MrcB/PBP1B (Q88DY5)
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report supports intact glycosyltransferase and transpeptidase roles in PBP1B.
    supporting_text: Its **N-terminal glycosyltransferase family 51 (GT51) domain** (catalytic proton-donor **Glu188**) polymerizes the lipid-linked precursor **lipid II** into linear glycan strands, and its **C-terminal D,D-transpeptidase domain** (catalytic nucleophile **Ser466**, within an intact S-x-x-K motif) cross-links the pentapeptide stems of adjacent glycan chains.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Used as literature retrieval support; no direct experimental study of Q88DY5 was found.
