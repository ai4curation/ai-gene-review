id: Q88FQ3
gene_symbol: hyuC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  hyuC (PP_4034) encodes a zinc-dependent M20-family amidohydrolase near the
  reductive pyrimidine-catabolic locus. Its physiological substrate is
  unresolved: beta-ureidopropionase would complete that pathway, whereas its
  PANTHER/InterPro assignments support allantoate or
  N-carbamoyl-L-amino-acid hydrolysis as alternatives. PP_0614 is a second
  KT2440 protein carrying the same dual beta-ureidopropionase/allantoate
  submitter annotation.
existing_annotations:
- term:
    id: GO:0003837
    label: beta-ureidopropionase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Beta-ureidopropionase is a plausible pathway-completion hypothesis, but the annotation is not independently supported.
    action: UNDECIDED
    reason: >-
      This EC-derived IEA and the submitted protein name trace to the same 2002
      EMBL annotation, so the name cannot independently validate the GO term.
      PTHR32494:SF5 favors an allantoate-family assignment, related hyuC
      exemplars hydrolyze N-carbamoyl-L-amino acids, and PP_0614 is an
      alternative KT2440 candidate for the terminal pyrimidine-catabolic step.
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HyuC is a metal-dependent hydrolase, although this generic activity does not identify its physiological substrate.
    action: ACCEPT
    reason: This is the only seeded catalytic term that remains valid across the competing substrate assignments.
- term:
    id: GO:0016813
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
      in linear amidines
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This EC 3.5.3.- reaction class supports the allantoate/amidine branch and is not a parent of beta-ureidopropionase.
    action: UNDECIDED
    reason: >-
      InterPro IPR010158 supports an amidine-hydrolase family assignment, but
      accepting it would prejudge the unresolved target substrate. The
      alternative beta-ureidopropionase reaction belongs under the linear-amide
      branch GO:0016811.
- term:
    id: GO:0047652
    label: allantoate deiminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC-derived allantoate assignment agrees with PTHR32494:SF5 and GO:0016813, but no KT2440 substrate-specific assay was found.
    action: UNDECIDED
    reason: >-
      The same record is mapped to beta-ureidopropionase and allantoate
      deiminase from one submitter annotation. Family evidence favors this
      branch but does not establish Q88FQ3 substrate turnover, so the activity
      cannot yet be accepted or removed.
- term:
    id: GO:0016810
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds
  evidence_type: IC
  original_reference_id: file:PSEPK/hyuC/hyuC-notes.md
  qualifier: enables
  review:
    summary: The competing beta-ureidopropionase, allantoate, and carbamoyl-amino-acid assignments all imply nonpeptide C-N bond hydrolysis.
    action: NEW
    reason: >-
      This common reaction-class ancestor captures the supported catalytic
      chemistry without selecting an unverified physiological substrate.
    supported_by:
    - reference_id: file:PSEPK/hyuC/hyuC-uniprot.txt
      supporting_text: "DR   InterPro; IPR010158; Amidase_Cbmase."
