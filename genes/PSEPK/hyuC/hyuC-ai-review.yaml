id: Q88FQ3
gene_symbol: hyuC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  hyuC (PP_4034) encodes a zinc-dependent amidohydrolase positioned in the
  reductive pyrimidine-catabolic locus. The best-supported physiological role is
  beta-ureidopropionase (N-carbamoyl-beta-alanine amidohydrolase), hydrolyzing
  the PydB product to beta-alanine, carbon dioxide, and ammonia in the terminal
  pathway step.
existing_annotations:
- term:
    id: GO:0003837
    label: beta-ureidopropionase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The activity matches the terminal beta-alanine synthase step and the gene's placement next to the KT2440 pyd locus.
    action: ACCEPT
    reason: >-
      Genomic context, the annotated N-carbamoyl-beta-alanine amidohydrolase
      name, and the required third reaction of the reductive pathway converge on
      beta-ureidopropionase as the physiological activity.
    supported_by:
    - reference_id: file:PSEPK/hyuC/hyuC-notes.md
      supporting_text: "The pathway is controlled by three enzymes: dihydropyrimidine dehydrogenase (DPD), dihydropyrimidinase and beta-alanine synthase."
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HyuC is a metal-dependent hydrolase, but this generic activity does not identify its physiological substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: The beta-ureidopropionase term is substantially more informative.
- term:
    id: GO:0016813
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
      in linear amidines
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This reaction-class term is compatible with amidohydrolase chemistry but does not resolve beta-ureidopropionate versus allantoate specificity.
    action: KEEP_AS_NON_CORE
    reason: Retain as a family-level parent while treating substrate specificity separately.
- term:
    id: GO:0047652
    label: allantoate deiminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC-derived allantoate assignment is a plausible family alternative, but no KT2440 substrate-specific assay or purine-degradation context was accessible.
    action: UNDECIDED
    reason: >-
      The same record is mapped to beta-ureidopropionase and allantoate
      deiminase. Sequence-family membership alone does not distinguish these
      related amidohydrolase substrates, so the alternative activity cannot be
      accepted or confidently removed.
- term:
    id: GO:0072529
    label: pyrimidine-containing compound catabolic process
  evidence_type: IC
  original_reference_id: file:PSEPK/hyuC/hyuC-notes.md
  qualifier: involved_in
  review:
    summary: HyuC is the best-supported terminal beta-ureidopropionase candidate in the KT2440 pyd locus.
    action: NEW
    reason: >-
      Locus context and the accepted beta-ureidopropionase activity support a
      reductive pyrimidine-catabolic role despite unresolved allantoate
      side-activity.
    supported_by:
    - reference_id: file:PSEPK/hyuC/hyuC-notes.md
      supporting_text: "The pathway is controlled by three enzymes: dihydropyrimidine dehydrogenase (DPD), dihydropyrimidinase and beta-alanine synthase."
