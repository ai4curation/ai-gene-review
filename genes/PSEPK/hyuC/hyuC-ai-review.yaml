    significance: All substrate-specific GO molecular functions remain UNDECIDED.
  - gap_statement: PP_0614 (Q88Q81) carries the same dual EC assignment and has not been compared with Q88FQ3.
    significance: The terminal beta-alanine-synthase candidate in KT2440 cannot be selected from pathway membership alone.
