taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: ThrS is the cytoplasmic homodimeric threonyl-tRNA synthetase of Pseudomonas putida KT2440. It uses ATP to attach L-threonine to tRNA(Thr) and is predicted to edit mischarged L-seryl-tRNA(Thr), supporting accurate translation; catalysis, editing, and oligomerization are conserved-family HAMAP assignments rather than direct KT2440 experiments.
