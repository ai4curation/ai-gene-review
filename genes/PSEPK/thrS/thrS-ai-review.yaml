- id: PMID:11136973
  title: Transfer RNA-mediated editing in threonyl-tRNA synthetase. The class II solution to the double
    discrimination problem.
  findings:
  - statement: The primary abstract identifies a distinct N-terminal ThrRS editing site that hydrolyzes
      mischarged Ser-tRNA(Thr). This supports the conserved editing interpretation; full-text details
      were not recovered in the normal PMID cache.
    supporting_text: hydrolysis of the incorrectly formed ser-tRNA(Thr) is performed at a specific site
      in the N-terminal domain of the enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The primary abstract identifies a distinct N-terminal ThrRS editing site that hydrolyzes
      mischarged Ser-tRNA(Thr). This supports the conserved editing interpretation; full-text details
      were not recovered in the normal PMID cache.
- id: PMID:21241052
  title: Substrate specificity and catalysis by the editing active site of Alanyl-tRNA synthetase from
    Escherichia coli.
  findings:
  - statement: Purified E. coli AlaRS editing assays distinguish mischarged Ser-tRNA(Ala) hydrolysis from
      cognate-product hydrolysis; the paper also discusses differences from ThrRS editing. This informs
      conserved architecture, not KT2440 kinetics.
    supporting_text: The wild-type AlaRS editing domain deacylated Ser-tRNA(Ala)
  reference_review:
    relevance: HIGH
