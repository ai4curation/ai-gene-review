  label: Pseudomonas putida KT2440
description: ThrS is a cytosolic class-II threonyl-tRNA synthetase that attaches threonine to tRNA(Thr)
  using ATP. Its conserved N-terminal editing machinery hydrolyzes mischarged Ser-tRNA(Thr), distinguishing
  productive aminoacylation from post-transfer proofreading and helping maintain translation fidelity.
