id: Q88MG0
gene_symbol: kdsA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  KdsA1 is a cytoplasmic KDO-8-phosphate synthase that condenses
  D-arabinose-5-phosphate with phosphoenolpyruvate to form KDO-8-phosphate. It
  is one of two KT2440 KdsA paralogs supplying KDO for lipopolysaccharide.
