  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: SecY is the pore-forming core subunit of the bacterial SecYEG translocon. Its ten transmembrane
  helices create a gated aqueous channel and lateral gate that conduct unfolded secretory precursors across
  the inner membrane and permits membrane-protein insertion in cooperation with SecE, SecG, SecA, and
  targeting factors.
