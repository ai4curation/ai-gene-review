- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Mfd moves on duplex DNA but does not unwind it; it is a translocase, not a helicase.
    action: MODIFY
    reason: >-
      The TreeGrafter inference reflects the RecG-like SF2 motor, whose essence (an
      ATP-driven motor acting on DNA) is right, but purified E. coli TRCF has no helicase
      activity on any substrate (an IDA NOT annotation on P30958). Replace with the
      experimentally grounded DNA translocase activity.
    proposed_replacement_terms:
    - id: GO:0015616
      label: DNA translocase activity
    supported_by:
    - reference_id: PMID:33480355
      supporting_text: The Mfd SF2 ATPase translocates on the upstream duplex DNA
    - reference_id: PMID:7876262
      supporting_text: >-
        We found that TRCF does not have a helicase activity on any of the substrates
        tested.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      slot: GO term
      requested_change: REPOINT
      asserted_value: GO:0003678
      corrected_value: GO:0015616
      corrected_label: DNA translocase activity
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        TreeGrafter (GO_REF:0000118) assigns DNA helicase activity to the
        transcription-repair coupling factor Q88KZ1. Mfd/TRCF lacks helicase activity
        (E. coli P30958 carries NOT|enables GO:0004386 by IDA, PMID:7876262) and acts as a
        duplex DNA translocase (PMID:33480355); the helicase term belongs to the RecG
        branch of the family. The Mfd subfamily should carry GO:0015616 rather than
        GO:0003678.
