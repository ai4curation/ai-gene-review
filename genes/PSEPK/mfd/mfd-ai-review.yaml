- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Mfd binds duplex DNA upstream of a stalled RNA polymerase during coupling.
    action: KEEP_AS_NON_CORE
    reason: >-
      DNA binding is a valid, separately assayed property of TRCF and the
      substrate-engagement part of the translocase motor; DNA translocation is the defining
