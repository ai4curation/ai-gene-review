id: Q88KZ1
gene_symbol: mfd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Mfd (PP_2148) is the transcription-repair coupling factor of Pseudomonas putida
  KT2440, a 1149-residue cytoplasmic superfamily 2 ATPase with the full TRCF domain
  architecture: an N-terminal UvrB-homology module that binds UvrA, a CarD-like RNA
  polymerase interacting domain, and a C-terminal RecG-like DNA translocase motor. By
  homology with the experimentally characterized Escherichia coli protein, it uses ATP
  hydrolysis to translocate on duplex DNA upstream of RNA polymerase stalled at a
  template-strand lesion, releases the stalled polymerase and its transcript, and recruits
  the UvrA(2)B damage-recognition machinery so that the transcribed strand is repaired
  preferentially by nucleotide-excision repair. The same motor is expected to rescue
  backtracked or roadblocked elongation complexes. No KT2440-specific experimental
  characterization has been reported.
