  review:
    action: ACCEPT
    summary: ATP binding supports the intrinsic ligase reaction.
    reason: The LigD-specific adenylation-domain classification and characterized ATP-dependent ortholog
      ligases support ATP binding as a core catalytic requirement. ATP binding is not an ancestor of DNA
      ligase activity in the checked ontology; it is not made peripheral merely by being less mechanistically
      descriptive. ATP use is inferred from the target LigD adenylation-domain classification and ATP-dependent
      ligation of the experimentally characterized mycobacterial homolog; this is not a KT2440 ATP-binding
      assay. ATP binding is required by the demonstrated ATP-dependent ligase chemistry, rather than inferred
      merely from the occurrence of ATP in an assay buffer.
