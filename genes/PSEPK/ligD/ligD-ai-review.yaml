      loci.
    supporting_text: LigD is dispensable for NHEJ for repair of DSBs generated by Cas9 in KT2440, while
      the presence of Ku is required at some sites.
  - statement: Target sequence and context affect repair outcomes.
    supporting_text: The repair events we observe appear to be highly context-dependent.
