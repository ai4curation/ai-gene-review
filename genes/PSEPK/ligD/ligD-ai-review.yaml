- term:
    id: GO:0046403
    label: polynucleotide 3'-phosphatase activity
  evidence_type: ISS
  original_reference_id: PMID:15897197
  qualifier: enables
  review:
    summary: >-
      The central LigD phosphoesterase (PE) domain (IPR014144 / TIGR02777) is a
      3'-phosphoesterase that removes 3'-phosphate (and 3'-ribonucleotide)
      groups to prepare broken DNA ends for ligation. This is the accurate
      end-processing activity of the PE domain, not a classic exonuclease.
    action: NEW
    reason: >-
      Replaces the imprecise UniProt-keyword-derived exonuclease
      cross-reference (GO:0004527). The LigD PE domain does not act as a
      processive exonuclease. It performs sequential terminal-ribonucleotide
      removal and 3'-phosphate hydrolysis on damaged DNA ends; GO:0046403
      captures the phosphatase half. A general 3'-5' RNA exonuclease term is
      deliberately not added because the demonstrated substrate is a
      ribonucleotide-terminated DNA repair intermediate, not bulk RNA.
    supported_by:
    - reference_id: file:PSEPK/ligD/ligD-uniprot.txt
      supporting_text: InterPro; IPR014144; LigD_PE_domain.
    - reference_id: file:PSEPK/ligD/ligD-uniprot.txt
      supporting_text: NCBIfam; TIGR02777; LigD_PE_dom; 1.
    - reference_id: PMID:15897197
      supporting_text: The 3'-ribonuclease and 3'-phosphatase activities are
    - reference_id: PMID:16023671
      supporting_text: The nuclease domain did not function independently as a 3'-5' exonuclease.
    - reference_id: PMID:25942369
      supporting_text: both phosphoesterase (PE) and polymerase (POL) domains
