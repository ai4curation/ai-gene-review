id: Q88HU3
gene_symbol: ligD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LigD (PP_3260) is a predicted multifunctional DNA end-processing and ATP-dependent ligation
  enzyme of Pseudomonas putida KT2440. Conserved ligase, polymerase and phosphoesterase domains support
  repair of broken DNA ends through the activities characterized in bacterial LigD orthologs. In native
  KT2440, changing LigD abundance alters Cas9-site mutation spectra, but repair persists without LigD
  at the loci tested. Thus LigD can contribute to mutagenic end joining without being obligatory for every
  repair event. Its end-processing domains also influence stationary-phase mutation spectra in P. putida.
