id: Q88HU3
gene_symbol: ligD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  ligD (PP_3260) encodes the predicted multifunctional LigD enzyme of the
  Pseudomonas putida KT2440 bacterial non-homologous end joining system. The
  protein has ATP-dependent DNA ligase signatures and additional LigD polymerase and
  phosphoesterase/end-processing domains, allowing it to process damaged DNA
  ends and seal double-strand break repair intermediates recruited by Ku. Its
  central biological role is therefore DNA end processing and ATP-dependent
  ligation during Ku/LigD-mediated NHEJ. Loss of LigD alters stationary-phase
  mutation spectra in carbon-starved P. putida.
