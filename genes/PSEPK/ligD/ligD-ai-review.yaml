- id: file:analysis/module_audits/bacterial_nonhomologous_end_joining/literature-acquisition-20261107/Sharaev2022-English.txt
  title: 'Sharaev et al. 2022 English full text: Repair of Double-Stranded DNA Breaks Generated by CRISPR–Cas9
    in Pseudomonas putida KT2440'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full English publisher article, DOI 10.1134/S0026893322060152; counterpart of Russian-edition
