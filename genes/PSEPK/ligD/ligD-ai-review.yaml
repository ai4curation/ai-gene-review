  review:
    action: ACCEPT
    summary: ATP-dependent DNA ligation is the conserved LigD catalytic role.
    reason: Q88HU3 has LigD-specific adenylation and ligase-domain signatures. Purified Mycobacterium
      tuberculosis LigD ligase catalyses nick sealing, and P. aeruginosa LigD seals DNA ends in reconstitution.
      These support a conserved-function inference; ARBA reaction text and GO cross-references are not
      independent evidence. Native KT2440 catalysis and cofactor preference have not been measured here.
      ATP use is inferred from the target LigD adenylation-domain classification and ATP-dependent ligation
      of the experimentally characterized mycobacterial homolog; this is not a KT2440 ATP-binding assay.
