  label: Pseudomonas putida KT2440
description: ccmB encodes a membrane coupling subunit of cytochrome c maturation system I. Forms the membrane
  coupling subunit of CcmABCD, connecting CcmA ATP hydrolysis to heme-chaperone handling and release.
  Structural and biochemical studies support heme handling by CcmABCD, while the membrane-crossing route
  and its energetic coupling remain disputed. Its mechanistic assignment in Pseudomonas putida KT2440
  is inferred from conserved features and characterized system I orthologs.
