id: Q88EX6
gene_symbol: ccmB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmB is the integral membrane partner of the CcmA ATPase in cytochrome c
  maturation system I. CcmAB supports ATP-dependent processing of holo-CcmE;
  the transported substrate or conformational change coupled by the complex is
  unresolved.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: CcmB is an integral inner-membrane component.
      action: ACCEPT
      reason: This specific location is integral to CcmB's core role as the membrane subunit of CcmAB.
  - term: {id: "GO:0015232", label: heme transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family has historically been named a heme exporter.
      action: REMOVE
      reason: >-
        This protein's own unreviewed UniProt FUNCTION line repeats the
        historical heme-export model, but direct vesicle experiments found CcmAB
        unnecessary for heme export (PMID:10708391), while ATPase experiments
        support a role in CcmE processing (PMID:17419738). The substrate-specific
        transporter MF is therefore too strong.
      supported_by:
        - reference_id: file:PSEPK/ccmA/ccmA-uniprot.txt
          supporting_text: does not seem to be the case, but its exact role is uncertain.
  - term: {id: "GO:0015886", label: heme transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmB participates in heme handling during cytochrome c maturation.
      action: REMOVE
      reason: The UniProt heme-export statement is an inherited prediction contradicted by direct evidence that CcmAB is not required for heme export (PMID:10708391).
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: CcmB is a membrane protein.
      action: MARK_AS_OVER_ANNOTATED
      reason: This is a redundant, less precise parent of the plasma-membrane annotation.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmB participates in assembly of c-type cytochromes.
      action: KEEP_AS_NON_CORE
      reason: Correct but broader than the existing cytochrome c biosynthetic process annotation.
  - term: {id: "GO:1903607", label: cytochrome c biosynthetic process}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: CcmB is a system I component required for c-type cytochrome biogenesis.
      action: ACCEPT
      reason: This is the appropriately specific core process for the CcmAB membrane subunit.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/ccmA/ccmA-uniprot.txt
    title: UniProtKB entry for CcmA (Q88EX5)
    findings:
      - statement: The cognate ATPase record cautions that CcmAB is not established as a heme exporter.
  - id: file:PSEPK/ccmB/ccmB-uniprot.txt
    title: UniProtKB entry for CcmB (Q88EX6)
    findings:
      - statement: The record establishes the integral membrane family assignment.
  - id: file:PSEPK/ccmB/ccmB-goa.tsv
    title: QuickGO GOA annotations for ccmB
    findings:
      - statement: Complete fetched annotation set reviewed here.
  - id: PMID:10708391
    title: "Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC and CcmAB are not required for haem-membrane association."
  - id: PMID:17419738
    title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and incomplete processing of CcmE.
aliases: [Q88EX6, PP_4326]
core_functions:
  - description: Forms the integral membrane subunit of CcmAB and supports ATP-dependent CcmE cycling during cytochrome c maturation.
    directly_involved_in:
      - {id: "GO:1903607", label: cytochrome c biosynthetic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: PMID:17419738
        supporting_text: The proteins CcmA and CcmB have long been known to be essential for cytochrome c maturation in Escherichia coli.
suggested_questions:
  - question: Does PSEPK CcmB translocate a substrate or instead couple CcmA ATP hydrolysis to release of holo-CcmE?
suggested_experiments:
  - description: Measure CcmE association and release using CcmB transmembrane-site mutants.
    experiment_type: membrane-complex interaction assay
