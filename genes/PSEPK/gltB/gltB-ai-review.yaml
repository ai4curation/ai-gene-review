    proposed_replacement_terms:
    - id: GO:0015930
      label: glutamate synthase activity
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "Glutamate synthase hydrolyzes the amide of glutamine at an N-terminal glutamine amidotransferase (Ntn-hydrolase) domain, liberating ammonia and glutamate."
    - reference_id: file:PSEPK/gltB/gltB-uniprot.txt
      supporting_text: "DR   InterPro; IPR017932; GATase_2_dom."
- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: ISS
  original_reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
  qualifier: enables
  review:
    summary: The GltB large subunit directly hydrolyzes L-glutamine to supply channelled ammonia to the holoenzyme synthase site.
