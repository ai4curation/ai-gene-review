id: Q88CV4
gene_symbol: gltB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: gltB (PP_5076) encodes the large (alpha) chain of glutamate synthase [NADPH] (GOGAT; EC 1.4.1.13), a large iron-sulfur flavoprotein that, together with the small (beta) chain GltD, catalyzes the reductive transfer of the amide nitrogen of L-glutamine to 2-oxoglutarate to yield two molecules of L-glutamate (2 L-glutamate + NADP+ = L-glutamine + 2-oxoglutarate + NADPH + H+). The large chain carries an N-terminal class-II (PurF/Ntn) glutamine amidotransferase domain that hydrolyzes L-glutamine to release ammonia, an FMN-binding central domain where the ammonia is channelled to aminate 2-oxoglutarate, and a [3Fe-4S] cluster; reducing equivalents are supplied by NADPH via the FAD/[4Fe-4S]-containing GltD beta chain. Acting in concert with glutamine synthetase (GlnA), GOGAT constitutes the GS-GOGAT cycle, the high-affinity route of ammonia assimilation that builds L-glutamate (the major cellular amino-group donor) under nitrogen-limiting conditions. The enzyme is a soluble cytoplasmic protein of central nitrogen metabolism in P. putida.
existing_annotations:
- term:
    id: GO:0004355
    label: glutamate synthase (NADPH) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct complex-level EC 1.4.1.13 activity, but GltB is one subunit of the GltB/GltD holoenzyme and does not independently specify the NADPH-linked reaction.
    action: MODIFY
    reason: Retain the term but change the relation from enables to contributes_to; GltB carries the glutamine amidotransferase and FMN-dependent synthase sites while GltD supplies the NADPH-linked electron relay.
    proposed_replacement_terms:
    - id: GO:0004355
      label: glutamate synthase (NADPH) activity
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "The α-subunit carries the glutamine amidotransferase (glutaminase) domain and an FMN cofactor at the 2-oxoglutarate/glutamate synthase site; the β-subunit carries **FAD and the NADPH-binding site**"
- term:
    id: GO:0006541
    label: L-glutamine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Correct biological process. GOGAT consumes L-glutamine, hydrolyzing its amide group and transferring the nitrogen to 2-oxoglutarate; the large chain bears the type-2 glutamine amidotransferase domain (PROSITE PS51278, IPR017932). Consistent with the UniProt function statement. Kept as a supporting process term that is broader than the specific ammonia-assimilation role.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0015930
    label: glutamate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Core donor-agnostic catalytic activity of the GltB large subunit, which carries the glutamine amidotransferase and FMN-dependent synthase sites.
    action: ACCEPT
    reason: Use this term for the catalytic function GltB enables directly while representing the NADPH-specific holoenzyme activity with contributes_to.
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "Glutamate synthase hydrolyzes the amide of glutamine at an N-terminal glutamine amidotransferase (Ntn-hydrolase) domain, liberating ammonia and glutamate."
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Very general oxidoreductase root-level term derived from InterPro signatures. GOGAT is an oxidoreductase, but this term is uninformative relative to the directly enabled glutamate synthase activity GO:0015930.
    action: MARK_AS_OVER_ANNOTATED
- term:
    id: GO:0016638
    label: oxidoreductase activity, acting on the CH-NH2 group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: A reaction-class parent describing oxidation of the CH-NH2 group during glutamate formation. It is correct but less informative than the accepted donor-agnostic glutamate synthase activity GO:0015930.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0019676
    label: ammonia assimilation cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Core biological process. With glutamine synthetase (GlnA), GOGAT forms the GS-GOGAT cycle that assimilates ammonia into glutamate under nitrogen limitation. Well supported for this gene by PANTHER TreeGrafter and the UniProt nitrogen-metabolism pathway annotations.
    action: ACCEPT
