- id: PMID:10785395
  title: Functional properties of recombinant Azospirillum brasilense glutamate synthase, a complex iron-sulfur
    flavoprotein.
  findings:
  - statement: Recombinant Azospirillum GOGAT contains a coupled alpha/beta protomer.
    supporting_text: Its catalytically active alphabeta protomer is composed of two dissimilar subunits
  - statement: The pyridine-nucleotide FAD site is on the beta subunit.
    supporting_text: one FAD (at Site 1, the pyridine nucleotide site within the beta subunit)
  - statement: The FMN-associated 2-oxoglutarate/glutamate site is on the alpha subunit.
    supporting_text: one FMN (at Site 2, the 2-oxoglutarate/L-glutamate site in the alpha subunit)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative biochemical evidence, not a KT2440 assay. Cached abstract explicitly reports
      these findings and comparison with native Azospirillum enzyme. The two 4Fe-4S clusters are described
      as of unknown location in this paper; no stronger small-chain cluster-count attribution is made.
- id: PMID:11188694
  title: Cross-talk and ammonia channeling between active centers in the unexpected domain arrangement
    of glutamate synthase.
  findings:
  - statement: The bacterial large-chain core structure links glutamine hydrolysis and glutamate synthesis
      through an ammonia tunnel.
    supporting_text: Channeling of the ammonia intermediate is brought about by an internal tunnel of
      31 A length, which runs from the site of L-glutamine hydrolysis to the site of L-glutamate synthesis.
  - statement: The two catalytic domains use Ntn-amidotransferase and FMN-binding folds.
    supporting_text: The two catalytic domains have canonical Ntn-amidotransferase and FMN binding (beta/alpha)8
      barrel folds, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative structure, not KT2440. The cached abstract reports the actual large-core
      domains and tunnel. The introductory three-center description is not substituted for subunit-specific
      experimental results.
- id: PMID:35285712
  title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon
    Sequencing.'
  findings:
  - statement: The exact KT2440 GOGAT genes are PP_5076 and PP_5075.
    supporting_text: GltB (PP_5076) and GltD (PP_5075) comprise the glutamate synthase (GOGAT) of P. putida
  - statement: Fitness defects depend strongly on nitrogen source and whether glutamate is supplied by
      the catabolic route.
    supporting_text: We were able to observe particularly strong fitness defects for gltBD in nitrogen
      conditions that either produce free ammonium or do not yield l -glutamate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native KT2440 BarSeq study read. Its pooled mutant phenotypes corroborate metabolic
      participation; they do not measure purified subunit chemistry, prove every nitrogen condition requires
      GOGAT, or assign an autonomous transcriptional regulator activity.
- id: PMID:14624355
  title: A functional gltB gene is essential for utilization of acidic amino acids and expression of periplasmic
    glutaminase/asparaginase (PGA) by Pseudomonas putida KT2440.
  findings:
  - statement: Targeted gltB disruption reproduces the defects observed with insertion mutants.
    supporting_text: we constructed a mutant with a targeted disruption of gltB.
  - statement: The gltB mutant loses induction of a separate periplasmic glutaminase/asparaginase and
      other glutamate-induced proteins.
    supporting_text: failed to express not only PGA but also a number of other Glu-induced proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native KT2440 genetic study; abstract explicitly establishes target disruption and phenotypes.
      Full text was unavailable. These results do not locate GltB in the periplasm or identify it as PGA,
      and no independent transcriptional-regulator or chemotaxis MF is inferred.
suggested_questions:
- question: How are glutamine hydrolysis and FMN-dependent glutamate synthesis coupled in the native KT2440
    GltB/GltD complex, and how does its metabolic activity influence PGA induction?
