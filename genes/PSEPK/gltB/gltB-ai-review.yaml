core_functions:
- description: Glutamine hydrolysis at the large-chain Ntn-amidotransferase center, coupled
    through an internal ammonia channel to FMN-dependent glutamate formation. The complete
    NADPH-linked reaction requires the GltD electron-input module; these mechanistic details
    are conserved-domain and homolog-structure inferences for KT2440.
