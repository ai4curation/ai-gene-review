taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: gltB (PP_5076) encodes the large (alpha) chain of glutamate synthase [NADPH] (GOGAT; EC 1.4.1.13), a large iron-sulfur flavoprotein that, together with the small (beta) chain GltD, catalyzes the reductive transfer of the amide nitrogen of L-glutamine to 2-oxoglutarate to yield two molecules of L-glutamate (L-glutamine + 2-oxoglutarate + NADPH + H+ = 2 L-glutamate + NADP+). The large chain carries an N-terminal class-II (PurF/Ntn) glutamine amidotransferase domain that hydrolyzes L-glutamine to release ammonia, an FMN-binding central domain where the ammonia is channelled to aminate 2-oxoglutarate, and a [3Fe-4S] cluster; reducing equivalents are supplied by NADPH via the FAD/[4Fe-4S]-containing GltD beta chain. Acting in concert with glutamine synthetase (GlnA), GOGAT constitutes the GS-GOGAT cycle, the high-affinity route of ammonia assimilation that builds L-glutamate (the major cellular amino-group donor) under nitrogen-limiting conditions. The enzyme is a soluble cytoplasmic protein of central nitrogen metabolism in P. putida.
existing_annotations:
- term:
    id: GO:0004355
    label: glutamate synthase (NADPH) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct complex-level EC 1.4.1.13 activity, but GltB is one subunit of the GltB/GltD holoenzyme and does not independently specify the NADPH-linked reaction.
    action: MODIFY
    reason: Retain the term but change the relation from enables to contributes_to; GltB carries the glutamine amidotransferase and FMN-dependent synthase sites while GltD supplies the NADPH-linked electron relay.
    proposed_replacement_terms:
    - id: GO:0004355
      label: glutamate synthase (NADPH) activity
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "The α-subunit carries the glutamine amidotransferase (glutaminase) domain and an FMN cofactor at the 2-oxoglutarate/glutamate synthase site; the β-subunit carries **FAD and the NADPH-binding site**"
- term:
    id: GO:0009342
    label: glutamate synthase complex (NADPH)
  evidence_type: IC
  original_reference_id: file:modules/bacterial_ammonia_assimilation.yaml
  qualifier: part_of
  supporting_entities:
  - GO:0004355
  review:
    summary: GltB is the catalytic large subunit of the two-subunit NADPH-dependent glutamate synthase complex.
    action: NEW
    reason: >-
      Complex membership captures the physical context required for GltB and
      GltD to perform the complete NADPH-dependent reaction. Membership of the
      KT2440 protein is inferred from its subunit assignment and conserved
      family architecture rather than a direct complex assay.
    supported_by:
    - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
      supporting_text: "Its catalytically active alphabeta protomer is composed of two dissimilar subunits (alpha subunit, 164.2 kDa; beta subunit, 52.3 kDa) and contains one FAD."
    - reference_id: file:PSEPK/gltB/gltB-uniprot.txt
      supporting_text: "AltName: Full=Glutamate synthase subunit alpha"
- term:
    id: GO:0006541
    label: L-glutamine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Correct biological process. GOGAT consumes L-glutamine, hydrolyzing its amide group and transferring the nitrogen to 2-oxoglutarate; the large chain bears the type-2 glutamine amidotransferase domain (PROSITE PS51278, IPR017932). Consistent with the UniProt function statement. Kept as a supporting process term that is broader than the specific ammonia-assimilation role.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0015930
    label: glutamate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct complex-level parent activity, but GltB lacks the electron-donor-binding machinery needed to perform the complete reaction independently.
    action: MODIFY
    reason: >-
      Change the relation from enables to contributes_to. GO:0015930 remains
      an electron-donor-dependent overall glutamate synthase activity even
