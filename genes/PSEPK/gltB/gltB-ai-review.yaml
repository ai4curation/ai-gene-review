id: Q88CV4
gene_symbol: gltB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GltB (PP_5076) is the large catalytic subunit of the NADPH-dependent glutamate synthase of
  Pseudomonas putida KT2440. Its conserved N-terminal glutamine amidotransferase and FMN-associated synthase
  domains couple glutamine hydrolysis to reductive amination of 2-oxoglutarate, producing two glutamate
  molecules in the complete reaction. GltD supplies the NADPH-linked reducing equivalents. Native KT2440
  gltB disruption and nitrogen-source fitness experiments support its metabolic role; the detailed ammonia-channel
  and redox-cofactor mechanism is inferred from conserved domains and characterized homologs.
