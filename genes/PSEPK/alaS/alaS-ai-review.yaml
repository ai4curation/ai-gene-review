id: Q88EI8
gene_symbol: alaS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Alanyl-tRNA synthetase that uses ATP to attach L-alanine to tRNA(Ala) and contains an editing domain predicted to hydrolyze mischarged aminoacyl-tRNAs, supporting translational fidelity in the bacterial cytoplasm. Catalysis, zinc dependence, and editing are computational or rule-based assignments for this protein.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleotide binding is implicit in the ATP-dependent AlaRS reaction but is too broad to describe the enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-specific alanine-tRNA ligase activity captures the ATP-dependent chemistry more informatively.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "Reaction=tRNA(Ala) + L-alanine + ATP"
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: AlaS is predicted to hydrolyze mischarged Ser-tRNA(Ala) and Gly-tRNA(Ala).
    action: ACCEPT
    reason: Editing is supported by TreeGrafter and the Thr/Ala-tRNA synthetase editing-domain assignment, but is not directly demonstrated for KT2440 AlaS.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "incorrectly charged Ser-tRNA(Ala) and Gly-tRNA(Ala)"
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The protein binds tRNA(Ala), but generic nucleic acid binding obscures that substrate specificity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The AlaRS reaction and editing function establish tRNA recognition rather than an unrestricted nucleic-acid-binding role.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "transferred to the acceptor end of tRNA(Ala)"
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic aminoacyl-tRNA ligase activity is a correct parent of the alanine-specific activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004813 records the known amino-acid and tRNA specificity and is already present.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "RecName: Full=Alanine--tRNA ligase"
- term:
    id: GO:0004813
    label: alanine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Alanine-tRNA ligase activity is the substrate-specific core function of AlaS.
    action: ACCEPT
    reason: The reviewed UniProt record assigns the exact ATP-dependent reaction by HAMAP rule.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "Reaction=tRNA(Ala) + L-alanine + ATP"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is a reaction substrate, but ATP binding alone is ancillary to aminoacylation.
    action: KEEP_AS_NON_CORE
    reason: Retain the binding annotation while using alanine-tRNA ligase activity as the defining molecular function.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "alanine is first activated by ATP"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is assigned by the same HAMAP rule as the AlaRS function.
    action: KEEP_AS_NON_CORE
    reason: The location is biologically coherent but is not the catalytic function and lacks direct KT2440 localization evidence.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is a compatible child localization of the rule-assigned cytoplasm annotation.
    action: KEEP_AS_NON_CORE
    reason: Retain as non-core because TreeGrafter supplies no independent target-level localization experiment.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006419
    label: alanyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AlaS directly produces Ala-tRNA(Ala), the product defining alanyl-tRNA aminoacylation.
    action: ACCEPT
    reason: The exact reaction is assigned by HAMAP rule, although it has not been assayed directly in KT2440.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "attachment of alanine to tRNA(Ala)"
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The reviewed record predicts one structural zinc ion per AlaS subunit.
    action: KEEP_AS_NON_CORE
    reason: Zinc binding supports the enzyme architecture but is not the defining catalytic activity.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "Binds 1 zinc ion per subunit."
- term:
    id: GO:0043039
    label: tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Generic tRNA aminoacylation is correct but less precise than the existing alanine-specific process.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006419 captures the exact amino acid and tRNA substrate already established by the record.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "attachment of alanine to tRNA(Ala)"
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: AlaRS autoregulation is known in bacteria, but conservation of this transcriptional role in KT2440 is unresolved.
    action: UNDECIDED
    reason: The TreeGrafter propagation is not contradicted by AlaRS catalysis, but the local record provides no target-specific regulatory evidence.
- term:
    id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: Editing of mischarged tRNA(Ala) is a direct aminoacyl-tRNA quality-control role.
    action: ACCEPT
    reason: Logical inference from the rule/domain-supported editing annotation; evidence is indirect but the fidelity role is coherent.
    supported_by:
    - reference_id: file:PSEPK/alaS/alaS-uniprot.txt
      supporting_text: "The editing domain removes incorrectly charged amino acids"
