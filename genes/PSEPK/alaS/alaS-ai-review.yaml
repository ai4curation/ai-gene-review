id: Q88EI8
gene_symbol: alaS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlaS is a cytosolic class-II alanyl-tRNA synthetase that attaches alanine to tRNA(Ala) using
  ATP. Its conserved editing machinery hydrolyzes mischarged aminoacyl-tRNAs, including Ser-tRNA(Ala)
  and Gly-tRNA(Ala), helping preserve translation fidelity. A conserved zinc-binding architecture supports
  its biochemical function.
