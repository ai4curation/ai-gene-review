    summary: The broad nucleotidyltransferase prediction is plausible, but the physiological reaction and nucleotide specificity are unresolved.
    action: UNDECIDED
    reason: >-
      KEGG K07141 and modest similarity to E. coli MocA favor a MocA-like
      interpretation, but PTHR43777:SF1 is not MocA-specific and no target assay
      establishes CTP-dependent cytidylyltransferase activity for Q88F68.
