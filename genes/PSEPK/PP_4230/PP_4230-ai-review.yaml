description: >-
  PP_4230 encodes a MobA-like NTP-transferase-domain protein. KEGG and local
  sequence similarity favor a MocA-like assignment, but the broad PANTHER
  family does not distinguish nucleotide specificity and no Q88F68 enzyme assay
  establishes CTP-dependent activity. Its physiological reaction and pathway
  role therefore remain unresolved.
