- question: Is PP_4230 CTP-specific in vitro, and is its MCD product preferentially delivered to the neighboring molybdoenzyme system?
suggested_experiments:
- description: Compare CTP- and GTP-dependent nucleotide transfer from purified Q88F68 to Mo-MPT and test the effect of PP_4230 deletion on MCD-containing enzyme activity.
