suggested_questions:
- question: Under which oxygen, carbon-source, or inhibitor conditions is the 
    terminal-oxidase branch containing cyoB preferentially used in KT2440?
suggested_experiments:
- description: Delete or conditionally deplete cyoB and measure branch-specific 
    oxygen-consumption kinetics, respiratory growth, inhibitor sensitivity, and 
    proton-motive force.
