taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 
    11950 / KT2440)
description: cyoB encodes the cytochrome bo3 ubiquinol oxidase catalytic subunit
  I containing the heme-copper oxygen-reduction center in Pseudomonas putida 
  KT2440. The protein acts in a plasma-membrane terminal oxidase branch that 
  reduces oxygen to water and supports aerobic respiratory energy conservation. 
  Its subunit-specific role is distinguished from the emergent catalytic 
  activity of the assembled oxidase complex.
existing_annotations:
- term:
    id: GO:0004129
    label: cytochrome-c oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 'cytochrome-c oxidase activity: Wrong electron donor. cyoB is subunit
      I of the cytochrome bo3 ubiquinol oxidase (EC 7.1.1.3), which receives electrons
      from ubiquinol and lacks the CuA center; GO:0004129 is the EC 7.1.1.9 cytochrome
      c reaction.'
    action: REMOVE
    reason: This is a wrong-donor IEA mapping rather than an over-annotation of
      degree. UniProt assigns cyoB EC 7.1.1.3 (ubiquinol oxidase), whereas
      GO:0004129 is defined as the cytochrome c reaction (EC 7.1.1.9). Metal
      analysis of the complex shows heme b plus heme o3 and a single copper
      (CuB) with no CuA center, so there is no cytochrome c docking site and a
      bound ubiquinone-8 substitutes for CuA as the fourth-electron donor.
      GO:0009486 remains as the branch-correct activity.
    supported_by:
    - reference_id: file:PSEPK/cyoB/cyoB-uniprot.txt
      supporting_text: 'DE            EC=7.1.1.3 {ECO:0000256|ARBA:ARBA00012941};'
    - reference_id: file:PSEPK/cyoB/cyoB-deep-research-openscientist.md
      supporting_text: CyoB is **not** a cytochrome *c* oxidase (no Cu_A; electrons
        enter from ubiquinol, not cytochrome *c*).
