  title: OpenScientist gene research for cyoB
  findings:
  - statement: Cytochrome bo3 lacks the CuA center and takes electrons from the
      ubiquinol pool rather than from cytochrome c, so the cytochrome-c oxidase
      activity mapping is a wrong-donor annotation for cyoB.
    supporting_text: CyoB is **not** a cytochrome *c* oxidase (no Cu_A; electrons
      enter from ubiquinol, not cytochrome *c*).
