id: Q88PK3
gene_symbol: fdx
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: Fdx (PP_0847) is a small 2Fe-2S ferredoxin encoded in the Isc locus that supplies reducing equivalents during iron-sulfur cluster assembly.
existing_annotations:
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosolic localization is compatible with a soluble Isc ferredoxin.
      action: KEEP_AS_NON_CORE
      reason: The location is plausible but not defining and lacks direct KT2440 localization evidence.
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Reversible electron transfer is the defining function of this ferredoxin.
      action: ACCEPT
      reason: Q88PK3 carries the Isc-specific ferredoxin family and a canonical 2Fe-2S ferredoxin fold.
      supported_by:
        - reference_id: file:PSEPK/fdx/fdx-uniprot.txt
          supporting_text: DR   InterPro; IPR011536; Fdx_isc.
        - reference_id: PMID:39870763
          supporting_text: the persulfide is cleaved into sulfide by the ferredoxin Fdx, leading to a [1Fe-1S] precursor.
  - term:
      id: GO:0022900
      label: electron transport chain
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Generic electron transport chain is broader than the Isc electron-delivery role.
      action: MARK_AS_OVER_ANNOTATED
      reason: A soluble Isc ferredoxin transfers reducing equivalents during cluster assembly and is not necessarily a respiratory chain component.
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The broad cluster-binding term is valid but less informative than the 2Fe-2S child term.
      action: KEEP_AS_NON_CORE
      reason: Retain as compatible family context while using the specific cofactor-binding term for the core function.
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The specific cofactor-binding term matches the 2Fe-2S ferredoxin family.
      action: ACCEPT
      reason: UniProt and InterPro identify Q88PK3 as an Isc-associated 2Fe-2S ferredoxin.
  - term:
      id: GO:0140647
      label: P450-containing electron transport chain
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The P450-specific process conflicts with the Isc-family and locus context.
      action: REMOVE
      reason: Q88PK3 belongs to IPR011536 Fdx_isc and is encoded with iscSUA-hscBA, not a P450 electron-transfer module.
  - term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    evidence_type: ISS
    original_reference_id: file:PSEPK/fdx/fdx-uniprot.txt
    qualifier: involved_in
    review:
      summary: The Isc-specific ferredoxin is predicted to supply reducing equivalents during Fe-S assembly.
      action: NEW
      reason: The IPR011536 Fdx_isc assignment and contiguous iscSUA-hscBA-fdx locus support a cautious process annotation.
      supported_by:
        - reference_id: file:PSEPK/fdx/fdx-uniprot.txt
          supporting_text: DR   InterPro; IPR011536; Fdx_isc.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/fdx/fdx-uniprot.txt
    title: UniProtKB entry for fdx (Q88PK3)
    findings:
      - statement: Q88PK3 is a 2Fe-2S ferredoxin assigned to the Isc-specific IPR011536 family.
  - id: PMID:39870763
    title: The ISC machinery assembles [2Fe-2S] clusters by formation and fusion of [1Fe-1S] precursors.
    findings:
      - statement: Reconstitution of the E. coli ISC machinery places Fdx directly in reductive sulfide formation on IscU.
  - id: PMID:39632806
    title: Two-stage binding of mitochondrial ferredoxin-2 to the core iron-sulfur cluster assembly complex.
    findings:
      - statement: Structural work provides ortholog context for ferredoxin engagement with the core ISC complex.
core_functions:
  - description: Carries a 2Fe-2S cofactor and transfers reducing equivalents in support of Isc-system Fe-S cluster assembly.
    molecular_function:
      id: GO:0009055
      label: electron transfer activity
    directly_involved_in:
      - id: GO:0016226
        label: iron-sulfur cluster assembly
    supported_by:
      - reference_id: file:PSEPK/fdx/fdx-uniprot.txt
        supporting_text: 'DE   RecName: Full=2Fe-2S ferredoxin {ECO:0000256|ARBA:ARBA00019395};'
      - reference_id: PMID:39870763
        supporting_text: the persulfide is cleaved into sulfide by the ferredoxin Fdx, leading to a [1Fe-1S] precursor.
    knowledge_gaps:
      - gap_statement: The reductase partner and necessity of Q88PK3 for KT2440 Isc assembly are unknown.
        significance: Isc electron donors can be replaceable, so the locus association supports but does not prove an obligatory role.
proposed_new_terms: []
suggested_questions:
  - question: Which reductase supplies electrons to Q88PK3, and can another ferredoxin substitute for it?
suggested_experiments:
  - description: Measure electron transfer from candidate reductases through Q88PK3 during reconstituted Q88PK8-Q88PK7 cluster assembly.
