id: Q88PK3
gene_symbol: fdx
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Fdx (PP_0847) is the Isc-associated 2Fe-2S ferredoxin of Pseudomonas putida KT2440. Its specific
  ferredoxin family supports electron transfer during iron-sulfur cluster assembly. In reconstituted bacterial
  homolog systems, reduced Fdx supplies electrons for sulfur reduction at the assembly machinery; the
  physiological reductase partner and dependence on this particular ferredoxin remain unresolved in KT2440.
