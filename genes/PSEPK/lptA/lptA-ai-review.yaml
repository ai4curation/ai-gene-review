      - CC:FUNCTION
      supporting_text: Required for the translocation of LPS from the inner membrane to the outer membrane.
    - reference_id: file:PSEPK/lptA/lptA-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: TIGR03002; outer_YhbN_LptA
    - reference_id: PMID:29449493
      supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
        transport to occur.
    - reference_id: PMID:29449493
      supporting_text: This complex uses ATP hydrolysis to extract LPS from the outer leaflet of the inner
        membrane and transfer it to LptC and then to a periplasmic protein LptA
- term:
    id: GO:0017089
    label: glycolipid transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: LptA does transfer a glycolipid, but a lipopolysaccharide-specific transfer term captures
      the activity more precisely.
    action: MODIFY
    reason: The generic glycolipid term is correct but under-specific for a dedicated LPS carrier. GO:0140332
      is defined as removing a lipopolysaccharide from the outer leaflet of a donor membrane, carrying
      it through the aqueous phase in a hydrophobic pocket, and delivering it to an acceptor membrane,
      which is exactly the periplasmic LptA bridging step. This also brings lptA into line with lptC,
      where GO:0017089 is already deprecated in favour of GO:0140332. Experimental support is from the
      E. coli orthologue lptA (same PANTHER subfamily).
    proposed_replacement_terms:
    - id: GO:0140332
      label: lipopolysaccharide transfer activity
    supported_by:
    - reference_id: file:PSEPK/lptA/lptA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: May form a bridge between the inner membrane and the outer membrane, via interactions
        with LptC and LptD, thereby facilitating LPS transfer across the periplasm.
    - reference_id: PMID:29449493
      supporting_text: We observed that LPS crosslinked to LptA and the extent of crosslinking was strongly
        stimulated by LptC
    - reference_id: PMID:20720015
      supporting_text: In vitro, LptA can displace lipopolysaccharide from LptC (but not vice versa),
        consistent with their locations and their proposed placement in a unidirectional export pathway.
