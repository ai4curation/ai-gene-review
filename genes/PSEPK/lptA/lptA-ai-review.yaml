id: Q88P98
gene_symbol: lptA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LptA is a soluble periplasmic lipopolysaccharide-binding and transfer protein that forms
  the central bridge of the Lpt trans-envelope machinery. It receives lipopolysaccharide from inner-membrane
  LptC and transfers it toward the LptDE outer-membrane translocon for outer-membrane assembly.
existing_annotations:
- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LptA directly binds lipopolysaccharide while carrying it across the periplasm.
    action: ACCEPT
    reason: The LptA family assignment and UniProt functional description support direct LPS binding.
      Experimental support is from the E. coli orthologue lptA (same PANTHER subfamily).
    supported_by:
    - reference_id: file:PSEPK/lptA/lptA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: May form a bridge between the inner membrane and the outer membrane, via interactions
        with LptC and LptD, thereby facilitating LPS transfer across the periplasm.
    - reference_id: PMID:18480051
      supporting_text: Here we provide evidence that LptA binds structurally diverse LPS substrates in
        vitro and demonstrate that it interacts specifically with the lipid A domain of LPS.
    - reference_id: PMID:29449493
      supporting_text: We observed that LPS crosslinked to LptA and the extent of crosslinking was strongly
        stimulated by LptC
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: LptA is a soluble periplasmic bridge protein rather than an outer-membrane resident.
    action: KEEP_AS_NON_CORE
    reason: LptA is a soluble periplasmic protein, but in the assembled trans-envelope bridge it is bound
      to the LptD N-terminal domain and co-fractionates with the outer membrane in the E. coli orthologue.
      The association is real but peripheral to its periplasmic transfer role, matching the E. coli lptA
      review.
    supported_by:
    - reference_id: file:PSEPK/lptA/lptA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: May form a bridge between the inner membrane and the outer membrane, via interactions
        with LptC and LptD, thereby facilitating LPS transfer across the periplasm.
    - reference_id: PMID:20446753
      supporting_text: Remarkably, LptA was also found to co-fractionate almost exclusively with these
        OM fractions (Figure 2B).
    - reference_id: PMID:22668317
      supporting_text: This protein has been proposed to physically link the IM and the OM because it
        is the only periplasmic Lpt component without a membrane tether and because it fractionates with
        both membranes.
