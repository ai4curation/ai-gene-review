  label: Pseudomonas putida KT2440
description: LptA is a soluble periplasmic lipopolysaccharide-binding and transfer protein that forms the central
  bridge of the Lpt trans-envelope machinery. It receives lipopolysaccharide from inner-membrane LptC and transfers
  it toward the LptDE outer-membrane translocon for outer-membrane assembly.
