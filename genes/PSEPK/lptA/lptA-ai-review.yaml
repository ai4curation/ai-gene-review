  review:
    summary: LptA does transfer a glycolipid, but a lipopolysaccharide-specific transfer term captures the
      activity more precisely.
    action: MODIFY
    reason: 'LPS is the specifically supported glycolipid cargo: the target has HAMAP MF_01914/TIGR03002, while
      E. coli LptA binds LPS and can receive it from LptC. Refine the generic activity to GO:0140332. In the
      assembled bridge LptA performs the aqueous-transfer segment of this activity; the complete donor-to-acceptor
      journey is not an isolated-LptA membrane-to-membrane assay.'
