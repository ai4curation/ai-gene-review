- id: PMID:17056748
  title: Characterization of lptA and lptB, two essential genes implicated in lipopolysaccharide transport
    to the outer membrane of Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli LptA/LptB depletion disrupts LPS targeting to the outer membrane. Together with biochemical
      transfer studies this supports a transport role rather than attributing all envelope phenotypes to direct
      catalytic activities. Full cached text inspected.
  findings:
  - statement: E. coli LptA/LptB depletion disrupts LPS targeting to the outer membrane. Together with biochemical
      transfer studies this supports a transport role rather than attributing all envelope phenotypes to direct
      catalytic activities.
    supporting_text: Similar defects are observed in cells in which LptA and LptB are individually depleted
      (Fig. 6 ), indicating that both proteins are required for LPS targeting to the OM.
