id: Q88P98
gene_symbol: lptA
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LptA is a soluble periplasmic lipopolysaccharide-binding and transfer
  protein that forms the central bridge of the Lpt trans-envelope machinery. It
  receives lipopolysaccharide from inner-membrane LptC and transfers it toward the
  LptDE outer-membrane translocon for outer-membrane assembly.
existing_annotations:
- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LptA directly binds lipopolysaccharide while carrying it across the periplasm.
    action: ACCEPT
    reason: The LptA family assignment and UniProt functional description support direct LPS binding.
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: LptA is a soluble periplasmic bridge protein rather than an outer-membrane resident.
    action: MARK_AS_OVER_ANNOTATED
    reason: Contact with LptD at the outer membrane does not establish stable outer-membrane localization.
- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LptA transfers LPS through the periplasm as part of the Lpt pathway.
    action: ACCEPT
    reason: This biological-process term accurately captures LptA pathway participation and is not an MF assignment.
- term:
    id: GO:0017089
    label: glycolipid transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: LptA directly transfers the glycolipid LPS between LptC and LptD.
    action: ACCEPT
    reason: The soluble LptA bridge provides direct glycolipid carrier/transfer activity.
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: LptA occupies the Gram-negative periplasm between the two membranes.
    action: ACCEPT
    reason: This taxon-appropriate periplasmic compartment matches the signal-peptide-dependent localization and LptA role.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LptA is periplasmic, but a more taxon-specific periplasm annotation is already present.
    action: KEEP_AS_NON_CORE
    reason: The term is correct but redundant with outer membrane-bounded periplasmic space.
- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: LptA-mediated delivery of LPS is required for Gram-negative outer-membrane assembly.
    action: ACCEPT
    reason: The process annotation accurately describes the downstream consequence of LPS transport.
- term:
    id: GO:0046836
    label: glycolipid transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: LPS transport is a specific instance of glycolipid transport.
    action: KEEP_AS_NON_CORE
    reason: The broader process is correct but less informative than the existing lipopolysaccharide transport annotation.
core_functions:
- description: Binds and transfers lipopolysaccharide through the periplasmic Lpt bridge.
  molecular_function:
    id: GO:0017089
    label: glycolipid transfer activity
  directly_involved_in:
  - id: GO:0015920
    label: lipopolysaccharide transport
  - id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  locations:
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
