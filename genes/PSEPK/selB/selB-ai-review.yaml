- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GTP hydrolysis is intrinsic to the SelB translational GTPase cycle.
    action: ACCEPT
    reason: >-
      Q88QJ7 contains a complete Tr-type G domain and the conserved P-loop
      NTPase architecture expected for a SelB GTPase.
    supported_by:
    - reference_id: file:PSEPK/selB/selB-uniprot.txt
      supporting_text: "InterPro; IPR000795; T_Tr_GTP-bd_dom."
