suggested_questions:
- question: Which KT2440 selenoprotein mRNAs contain functional SelB-recognized SECIS elements?
suggested_experiments:
- hypothesis: Q88QJ7 binds KT2440 SECIS RNA and delivers Sec-tRNA(Sec) in a GTP-dependent manner.
  description: >-
    Test SECIS binding by fluorescence anisotropy and reconstitute UGA
    readthrough with purified ribosomes, Sec-tRNA(Sec), and wild-type or
    GTPase/winged-helix mutants of SelB.
