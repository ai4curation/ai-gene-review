- term:
    id: GO:0006414
    label: translational elongation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The generic elongation process can be narrowed to SelB-dependent selenocysteine incorporation.
    action: MODIFY
    reason: >-
      SelB does not serve as the general aminoacyl-tRNA delivery factor. Its
      defining role is SECIS-dependent delivery of Sec-tRNA(Sec) at UGA, which
      is captured by GO:0001514.
    proposed_replacement_terms:
