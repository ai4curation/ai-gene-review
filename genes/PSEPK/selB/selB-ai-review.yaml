  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SelB is a specialized translation elongation factor.
    action: ACCEPT
    reason: >-
      The N-terminal portion has canonical translational GTPase/EF-Tu-like
      domains, while the SelB-specific extension provides Sec decoding
      specificity.
    supported_by:
    - reference_id: file:PSEPK/selB/selB-uniprot.txt
