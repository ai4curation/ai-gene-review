id: Q88QJ7
gene_symbol: selB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  SelB is the cytoplasmic, GTP-dependent selenocysteyl-tRNA-specific
  translation elongation factor of Pseudomonas putida KT2440. Its EF-Tu-like
  N-terminal region binds GTP and Sec-tRNA(Sec), while its bacterial
  SelB-specific C-terminal winged-helix domains recognize the mRNA SECIS
  element, coupling UGA decoding to delivery of Sec-tRNA(Sec) at the ribosome.
existing_annotations:
- term:
    id: GO:0001514
    label: selenocysteine incorporation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: SelB is the dedicated bacterial factor for Sec-tRNA(Sec) delivery during UGA recoding.
    action: ACCEPT
    reason: >-
      The protein is annotated as a selenocysteyl-tRNA-specific elongation
      factor and contains the characteristic SelB GTPase and C-terminal
      winged-helix domains.
    supported_by:
    - reference_id: file:PSEPK/selB/selB-uniprot.txt
      supporting_text: "SubName: Full=Selenocysteyl-tRNA-specific translation elongation factor"
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic RNA binding should be narrowed to binding of the bacterial SECIS element.
    action: MODIFY
    reason: >-
      SelB uses its specialized C-terminal winged-helix domains to recognize
      the selenocysteine insertion sequence. PANTHER/PAINT supports
      GO:0035368 on the bacterial SelB branch, making it more informative than
      undifferentiated RNA binding.
    proposed_replacement_terms:
    - id: GO:0035368
      label: selenocysteine insertion sequence binding
    supported_by:
    - reference_id: file:interpro/panther/PTHR43721/PTHR43721-paint.tsv
      supporting_text: "GO:0035368\tF\tIBD\tfalse\tUniProtKB:P14081"
