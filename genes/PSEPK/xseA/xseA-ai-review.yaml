id: Q88P26
gene_symbol: xseA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  XseA is the large subunit of the cytosolic exodeoxyribonuclease VII
  complex. Together with XseB it forms a bidirectional single-stranded DNA
  exonuclease that degrades DNA in either the 5'-to-3' or 3'-to-5' direction
  to nucleoside 5'-phosphates. This chemistry can support excision tracts in
  DNA repair, but a specific requirement for XseA in KT2440 mismatch repair
  has not been demonstrated directly.
