suggested_questions:
  - question: Does the XseA/XseB complex execute either orientation of KT2440 mismatch-excision tracts?
suggested_experiments:
  - hypothesis: Exonuclease VII provides a partially redundant mismatch-excision nuclease in KT2440.
    description: >-
      Measure mutation rates and repair-tract products in xseA, xseB, recJ,
      and sbcB single and combined mutants, with matched protein-expression
      controls.
    experiment_type: combinatorial repair genetics
