      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: True but broad relative to the complex's single-stranded DNA exonuclease activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: The catalytic and complex terms are more informative.
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: >-
        Correct parent location, but cytosol is the nonredundant leaf location
        shared with the obligate XseB partner.
      action: MODIFY
      reason: >-
        Q88P26 is the large subunit of an obligate soluble XseA/XseB complex,
        and the partner Q88QG5 carries the more specific cytosol annotation.
      proposed_replacement_terms:
        - id: GO:0005829
          label: cytosol
      supported_by:
