    id: GO:0004022
    label: alcohol dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: Correct the broad NAD-linked alcohol dehydrogenase assignment to homoserine dehydrogenase.
    action: MODIFY
    reason: The NAD-linked RHEA:15757 reaction rests only on ECO:0000256 ARBA:ARBA00049031.
      Independent RuleBase family membership, PROSITE PS01042 and PIRSR000098-2 NADP/NADPH contacts
      instead support homoserine-dehydrogenase chemistry represented by GO:0004412. Its live QuickGO
      definition specifies NADP+, so this MODIFY is an explicit cofactor correction based on the
      target evidence, not a cofactor-preserving specialization or proof that native NAD use is
      absent. Unlike the curated ECO:0000250 transfer retained for ECOLI/thrA, or the experimentally
      tagged but unresolved citation attribution in CORGL/hom, this NAD reaction has no inspected
      non-ARBA support. See hom-notes.md for the cross-gene comparison. Binding-site inference
      supports capacity, not measured preference or equal donor use.
