id: Q88MU8
gene_symbol: hom
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Hom (PP_1470) is a homoserine dehydrogenase that reduces L-aspartate 4-semialdehyde to L-homoserine,
  the shared precursor of threonine and methionine. Its catalytic and NADP-binding features support NADPH-capable
  chemistry, and it has a C-terminal ACT domain. The native KT2440 protein has been cloned and overproduced,
  while its NADH/NADPH preference and feedback kinetics remain unresolved.
