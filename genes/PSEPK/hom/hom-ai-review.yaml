id: Q88MU8
gene_symbol: hom
product_type: PROTEIN
status: DRAFT
taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida KT2440}
description: >-
  hom (PP_1470) encodes a predicted homoserine dehydrogenase that reduces
  L-aspartate 4-semialdehyde to L-homoserine using NADH. This reaction forms
  the branch-point precursor shared by threonine and methionine biosynthesis.
existing_annotations:
- term: {id: "GO:0004022", label: alcohol dehydrogenase (NAD+) activity}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000116"
  qualifier: enables
  review:
    summary: Rhea-mapped sibling activity that is less precise than homoserine dehydrogenase activity.
    action: MARK_AS_OVER_ANNOTATED
- term: {id: "GO:0004412", label: homoserine dehydrogenase activity}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000120"
  qualifier: enables
  review:
    summary: Specific EC-supported catalytic activity with a complete Rhea reaction.
    action: ACCEPT
    reason: >-
      The UniProt catalytic-activity line is ARBA-only, so support rests on
      family classification instead: the RuleBase-backed homoserine
      dehydrogenase family assignment, the PROSITE homoserine dehydrogenase
      signature (PS01042) and the Pfam Homoserine_dh catalytic domain. These
      place Q88MU8 in a family whose characterized members catalyse EC 1.1.1.3;
      no experimental data exist for the P. putida protein itself.
    supported_by: &hom_support
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the homoserine dehydrogenase family.'
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'DR   PROSITE; PS01042; HOMOSER_DHGENASE; 1.'
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF00742; Homoserine_dh; 1.'
- term: {id: "GO:0006520", label: amino acid metabolic process}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000002"
  qualifier: involved_in
  review:
    summary: Correct but too broad relative to the threonine and methionine biosynthetic roles.
    action: MARK_AS_OVER_ANNOTATED
- term: {id: "GO:0016491", label: oxidoreductase activity}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000002"
  qualifier: enables
  review:
    summary: Redundant top-level parent of the specific homoserine dehydrogenase term.
    action: MARK_AS_OVER_ANNOTATED
- term: {id: "GO:0050661", label: NADP binding}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000002"
  qualifier: enables
  review:
    summary: Domain-derived NADP-binding call conflicts with the current NAD+/NADH Rhea reaction.
    action: MODIFY
    reason: >-
      InterPro IPR005106 is an NAD-binding domain and RHEA:15759 specifies
      NAD+/NADH. Direct cofactor testing is still needed.
    proposed_replacement_terms:
    - id: GO:0051287
      label: NAD binding
- term: {id: "GO:0009088", label: L-threonine biosynthetic process}
  evidence_type: IEA
  original_reference_id: "GO_REF:0000120"
  qualifier: involved_in
  review:
    summary: Correct step-three contribution to threonine biosynthesis, shared with methionine formation.
    action: ACCEPT
    reason: >-
      The UniProt PATHWAY line is ARBA-only. The process call instead follows
      from family membership: homoserine dehydrogenase (homoserine
      dehydrogenase family, PROSITE PS01042) forms L-homoserine, the obligate
      precursor of threonine via homoserine kinase and threonine synthase.
      Inferred from family function, not tested in P. putida.
    supported_by:
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the homoserine dehydrogenase family.'
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'DR   PROSITE; PS01042; HOMOSER_DHGENASE; 1.'
- term: {id: "GO:0071266", label: "'de novo' L-methionine biosynthetic process"}
  evidence_type: ISS
  original_reference_id: file:PSEPK/hom/hom-uniprot.txt
  qualifier: involved_in
  review:
    summary: Correct shared homoserine-forming step in de novo methionine biosynthesis.
    action: NEW
    reason: >-
      The UniProt PATHWAY line is ARBA-only. The process call follows from
      family membership: homoserine dehydrogenase (homoserine dehydrogenase
      family, PROSITE PS01042) forms L-homoserine, which is acylated to start
      the de novo methionine branch. Inferred from family function, not tested
      in P. putida.
    supported_by:
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the homoserine dehydrogenase family.'
    - reference_id: file:PSEPK/hom/hom-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'DR   PROSITE; PS01042; HOMOSER_DHGENASE; 1.'
