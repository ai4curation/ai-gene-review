  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent curated family/domain or catalytic-feature evidence supports the stated
      inference. No raw annotation is edited. Generic record names, GO cross-references and ARBA-only
      functional predictions are not decisive evidence. ARBA supplies an NAD-linked catalytic reaction,
      whereas independent PIRSR assigns NADP/NADPH contacts. Do not equate that automated reaction with
      NADH-only specificity or overwrite the NADP-binding evidence.
- id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a branched
    network of many biochemical pathways.
  findings:
  - statement: Review of the branched aspartate-family network; target assignments depend on independent
      target family evidence and, where available, native primary cloning.
    supporting_text: A multibranched web of biochemical pathways of central importance is initiated by
      the action of aspartokinase (Ask) in a reaction that combines aspartate and ATP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read for pathway chemistry and variation in branch/allosteric regulation.
      It is not a native KT2440 enzyme experiment and does not justify transferring a universal feedback
      pattern or essentiality.
- id: PMID:4391829
  title: Regulation of the biosynthesis of amino acids of the aspartate family in Coliform bacteria and
    Pseudomonads.
  findings:
  - statement: Comparative pseudomonad/coliform work shows variable pyridine-nucleotide use; no exact
      KT2440 paralog identification is available.
    supporting_text: either nicotinamide adenine dinucleotide (NAD) or nicotinamide adenine dinucleotide
      phosphate can serve as a cofactor for this enzyme
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Cofactor variability is a warning against transferring donor preference
      or regulation to either KT2440 paralog.
  full_text_unavailable: true
- id: PMID:5441405
  title: Homoserine dehydrogenase of Pseudomonas putida. Properties and regulation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Bibliographic content only; historical P. putida strain and exact protein were not verified.
      No kinetics or allostery are assigned to this target from this paper.
  full_text_unavailable: true
- id: PMID:29636528
  title: Inhibition of homoserine dehydrogenase by formation of a cysteine-NAD covalent complex.
  findings:
  - statement: Comparative archaeal enzyme study; no native KT2440 paralog assay or transferable donor
      preference.
    supporting_text: HSD from the hyperthermophilic archaeon Sulfolobus tokodaii (StHSD)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary paper read. Sulfolobus tokodaii kinetics, cysteine regulation and structure
      are not assigned to either PSEPK paralog. The discussion also illustrates that cofactor binding
      need not imply productive coenzyme use in every homolog; native NADH/NADPH kinetics remain unresolved.
