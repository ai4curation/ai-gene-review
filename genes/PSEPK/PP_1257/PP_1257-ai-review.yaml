id: Q88NF4
gene_symbol: PP_1257
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1257 is an experimentally characterized
  1-pyrroline-4-hydroxy-2-carboxylate deaminase that hydrolyzes the cyclic imine
  generated during hydroxyproline degradation to 2,5-dioxopentanoate and
  ammonium. It acts after the PP_1255 dehydrogenase and before the
  locus-associated terminal dehydrogenase candidate.
existing_annotations:
- term:
    id: GO:0008840
    label: 4-hydroxy-tetrahydrodipicolinate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The TreeGrafter DapA annotation conflicts with the EC 3.5.4.22 assignment.
    action: REMOVE
    reason: >-
      PP_1257 has a DapA-like fold, but its product name and exact EC mapping
      identify 1-pyrroline-4-hydroxy-2-carboxylate deaminase. The adjacent
      hydroxyproline-pathway enzymes provide independent genomic context, so
      the DapA activity is a paralog transfer.
    supported_by:
    - reference_id: file:PSEPK/PP_1257/PP_1257-uniprot.txt
      record_section: [DE]
      supporting_text: "DE            EC=3.5.4.22"
- term:
    id: GO:0016829
    label: lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The lyase term assigns PP_1257 to the wrong catalytic branch.
    action: REMOVE
    reason: >-
      EC 3.5.4.22 and GO:0047425 describe hydrolytic deamination and place the
      activity under hydrolase/deaminase terms, not lyase activity. The
      DapA/NAL-like fold does not justify transfer of the ancestral lyase class.
    supported_by:
    - reference_id: file:PSEPK/PP_1257/PP_1257-uniprot.txt
      record_section: ["DR:GO"]
      supporting_text: "DR   GO; GO:0047425; F:1-pyrroline-4-hydroxy-2-carboxylate deaminase activity; IEA:UniProtKB-EC."
- term:
    id: GO:0047425
    label: 1-pyrroline-4-hydroxy-2-carboxylate deaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: PP_1257 converts the hydroxyproline-derived cyclic imine to 2,5-dioxopentanoate.
    action: ACCEPT
    reason: >-
      Watanabe et al. (PMID:22833679) identified and biochemically
      characterized the P. putida Pyr4H2C deaminase as a member of the
      dihydrodipicolinate synthase/N-acetylneuraminate lyase family whose
      activity is competitively inhibited by pyruvate. The cached abstract does
      not name the locus; the identification of that enzyme as PP_1257 rests on
      the paper's full text (not cached) and on PP_1257's DapA-family
      classification (PIRSF001365; InterPro DapA-like), which matches the
      family the paper reports. The UniProt EC/name lines are submitter
      imports (ECO:0000313) and are not used as support. The activity is also
      chemically continuous with the flanking PP_1255 and PP_1256 reactions.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        we identified and characterized for the first time two novel enzymes, D-hydroxyproline dehydrogenase and
    - reference_id: PMID:22833679
      supporting_text: >-
        Pyr4H2C deaminase is a unique member of the dihydrodipicolinate synthase/N-acetylneuraminate lyase protein family, and its activity was competitively inhibited by pyruvate
    - reference_id: file:PSEPK/PP_1257/PP_1257-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: "PIRSF; PIRSF001365; DHDPS; 1."
- term:
    id: GO:0019470
    label: trans-4-hydroxy-L-proline catabolic process
  evidence_type: IMP
  original_reference_id: PMID:22833679
  qualifier: involved_in
  review:
    summary: PP_1257 is required for growth on L-hydroxyproline.
    action: NEW
    reason: >-
      Target-gene disruption abolishes growth on L- and D-hydroxyproline while
      sparing growth on proline, directly establishing pathway participation.
    supported_by:
    - reference_id: PMID:22833679
      supporting_text: >-
        disruption of Pyr4H2C deaminase genes led to loss of growth on L-hydroxyproline (as well as D-hydroxyproline) but not L- and D-proline
