  findings:
  - statement: >-
      The record names the EC 3.5.4.22 hydroxyproline-pathway deaminase while
      also exposing the conflicting broad DapA-like family assignment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The EC mapping and locus chemistry agree with the direct biochemical and
      genetic characterization reported in PMID:22833679.
- id: PMID:22833679
  title: >-
    Identification and characterization of D-hydroxyproline dehydrogenase and
    Delta1-pyrroline-4-hydroxy-2-carboxylate deaminase involved in novel
    L-hydroxyproline metabolism of bacteria: metabolic convergent evolution.
  full_text_unavailable: true
  findings:
  - statement: >-
      The deaminase belongs to the DapA/N-acetylneuraminate-lyase fold family,
      and gene disruption abolishes growth on hydroxyproline.
    supporting_text: >-
      disruption of Pyr4H2C deaminase genes led to loss of growth on L-hydroxyproline
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed and PMC identifiers were checked; the paper directly characterizes
      the P. putida Pyr4H2C deaminase biochemically and genetically.
- id: file:modules/hydroxyproline_catabolism.yaml
  title: Bacterial trans-4-hydroxy-L-proline catabolism module
  findings:
  - statement: PP_1257 is the third reaction in the route to 2-oxoglutarate.
