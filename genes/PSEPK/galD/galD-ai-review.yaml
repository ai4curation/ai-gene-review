    label: intramolecular oxidoreductase activity, transposing C=C bonds
  evidence_type: IDA
  original_reference_id: PMID:21219457
  qualifier: enables
  review:
    summary: The activity is real but is filed in the wrong intramolecular oxidoreductase branch; GalD is a keto-enol tautomerase (EC 5.3.2.8), not a C=C-transposing isomerase (EC 5.3.3.-).
    action: MODIFY
    reason: >-
      GalD interconverts the keto and enol tautomers of 4-oxalomesaconate (RHEA:28931, EC 5.3.2.8). GO divides
      intramolecular oxidoreductase activity by EC sub-subclass: GO:0016862 (interconverting keto- and enol-groups)
      covers EC 5.3.2.-, while GO:0016863 (transposing C=C bonds) covers EC 5.3.3.- double-bond migrations such as the
      LigU 1,3-allylic isomerization. Keto-enol tautomerization creates a new C=C bond from the C4 carbonyl rather than
      moving an existing one, so GO:0016862 is the correct term. The experimental basis of this UniProt IDA call is
      sound; only the term choice is corrected.
    proposed_replacement_terms:
    - id: GO:0016862
      label: intramolecular oxidoreductase activity, interconverting keto- and enol-groups
    source_defects:
