      requested_change: REPOINT
      asserted_value: GO:0016863
      corrected_value: GO:0016862
      corrected_label: intramolecular oxidoreductase activity, interconverting keto- and enol-groups
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The UniProt Q88JY0 entry records the GalD reaction as EC 5.3.2.8 (keto-enol tautomerization, RHEA:28931)
        but supplies GOA with GO:0016863, the EC 5.3.3.- C=C-transposing branch. The matching GO branch for
        EC 5.3.2.- is GO:0016862.
