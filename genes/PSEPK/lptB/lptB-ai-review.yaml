  review:
    summary: LptB supplies energy to a transmembrane LPS transport process but does not itself form the membrane
      pathway.
    action: MODIFY
    reason: LptB2FG does not move its substrate across the membrane; it extracts LPS from the outer leaflet
      of the inner membrane and pushes it into the periplasmic bridge. The specific process is lipopolysaccharide
      transport (GO:0015920).
