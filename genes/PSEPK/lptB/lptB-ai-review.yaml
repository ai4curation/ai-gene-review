description: LptB is the cytosolic ATPase subunit of the inner-membrane LptB2FG ABC transporter. ATP binding
  and hydrolysis by the LptB dimer power extraction of lipopolysaccharide from the inner membrane and
  its transfer into the periplasmic Lpt bridge.
