core_functions:
- description: The LptB dimer hydrolyzes ATP on the cytoplasmic face of the inner-membrane extractor, coupling
    nucleotide turnover to LPS release by LptF/LptG. The KT2440 assignment is supported by the LptB-specific
    TIGR04406/IPR030921 signatures and homolog biochemical/structural work; a generic ABC ATPase match alone
    does not determine cargo.
