- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LptB supplies energy to a transmembrane LPS transport process but does not itself form the
      membrane pathway.
    action: MODIFY
    reason: LptB2FG does not move its substrate across the membrane; it extracts LPS from the outer leaflet
      of the inner membrane and pushes it into the periplasmic bridge. The specific process is lipopolysaccharide
      transport (GO:0015920), matching the E. coli lptB review.
    proposed_replacement_terms:
    - id: GO:0015920
      label: lipopolysaccharide transport
    supported_by:
    - reference_id: file:PSEPK/lptB/lptB-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: TIGR04406; LPS_export_lptB
    - reference_id: PMID:19500581
      supporting_text: We report here that both LptF and LptG formed a complex with LptB.
    - reference_id: PMID:29449493
      supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
        transport to occur.
