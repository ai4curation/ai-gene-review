- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: LptB is exposed on the cytosolic face of the inner membrane.
    action: KEEP_AS_NON_CORE
    reason: The specialized soluble LptB ATPase acts on the cytoplasmic side of the extractor, and E. coli
      localization work explicitly assigns LptB to the cytoplasm. Retain this homolog-based soluble/peripheral
      localization as non-core; the active motor is membrane-associated. GO:0005737 excludes the plasma membrane,
      so it is not justified merely by an inward-facing membrane domain. No native KT2440 fractionation is
      claimed.
