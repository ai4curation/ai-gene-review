      of LptB2FG(C); the structures resolve an LPS-binding cavity and coupling. These are homolog experiments
      for KT2440.
    supporting_text: Six lipid acyl chains of LPS tightly fit into a cone-shaped hydrophobic pocket formed
      by TMs 1, 2, and 5 of LptF and LptG
