id: Q88P99
gene_symbol: lptB
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LptB is the cytosolic ATPase subunit of the inner-membrane LptB2FG
  ABC transporter. ATP binding and hydrolysis by the LptB dimer power extraction
  of lipopolysaccharide from the inner membrane and its transfer into the
  periplasmic Lpt bridge.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: LptB binds nucleotides, specifically ATP.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term is true but needlessly broad because ATP binding is separately annotated.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The LptB ABC ATPase directly binds ATP.
    action: ACCEPT
    reason: Conserved ABC ATPase motifs and the LptB family assignment support this direct molecular function.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: LptB is exposed on the cytosolic face of the inner membrane.
    action: KEEP_AS_NON_CORE
    reason: Cytosolic exposure is compatible with ATP hydrolysis, but membrane-associated complex localization is more informative.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LptB associates peripherally with the inner-membrane LptFG permease.
    action: ACCEPT
    reason: The plasma-membrane annotation represents localization of LptB in the assembled LptBFG transporter.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LptB directly hydrolyzes ATP to energize LPS extraction and transport.
    action: ACCEPT
    reason: ATP hydrolysis is the direct catalytic function of this ABC-transporter nucleotide-binding subunit.
- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: LptB is the nucleotide-binding subunit of the LptB2FG ABC transporter.
    action: ACCEPT
    reason: Complex membership is supported by the LptB-specific family assignment and UniProt subunit description.
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LptB supplies energy to a transmembrane LPS transport process but does not itself form the membrane pathway.
    action: KEEP_AS_NON_CORE
    reason: This broad biological-process annotation is correct for complex participation; ATP hydrolysis remains the direct MF.
core_functions:
- description: Binds and hydrolyzes ATP as the cytosolic motor of the LptB2FG inner-membrane transporter.
