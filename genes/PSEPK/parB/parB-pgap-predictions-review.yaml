description: >-
  NCBI PGAP names WP_003253185.1 "ParB/RepB/Spo0J family partition protein"
  from the SPARCLE CDD domain architecture 11445026 (COG1475 Spo0J region,
  described as containing a "ParB-like nuclease domain") and passes on one GO
  term, DNA binding. The identical-protein record links WP_003253185.1 to 586
  assemblies of the P. putida group (2026-10-24). The term is true but less precise than the main review's
  sequence-specific DNA binding. The interesting result is what is missing.
  The protein also matches TIGR00180, whose product name is identical and
  which carries chromosome segregation and cytokinesis as well as DNA
  binding. Because the architecture wins the naming, PGAP passes on only DNA
  binding and drops chromosome segregation, the core process that GOA
  (TreeGrafter) and the main review both have. Neither the architecture nor
  any matched model carries the ParB CTPase activity (GO:0043273), and the
  CDD description of the N-terminal domain as a nuclease predates the
  discovery that this fold binds and hydrolyses CTP.
