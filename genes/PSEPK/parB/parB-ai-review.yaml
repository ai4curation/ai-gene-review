status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ParB (PP_0001) is the centromere-binding protein of the Pseudomonas putida
  ParABS chromosome-partitioning system. Its gene lies beside its partner
  parA, next to oriC, where parS-like
  palindromes also lie. ParB is a 290-residue ParB/Srx-fold protein with an
  N-terminal CTP-binding domain carrying the GERRWRA box, a central
  helix-turn-helix for parS recognition, and a C-terminal dimerization
  domain. It is 79% identical to the experimentally characterized P.
  aeruginosa ParB, which binds parS, hydrolyses CTP in a parS-stimulated
  reaction and spreads onto flanking DNA to form the origin partition
  complex. In P. putida, the parAB genes provide partition activity: parA
  and parB mutations, and deletion of the whole parAB locus, raise the
  frequency of anucleate cells, mainly as cultures in minimal medium enter
  stationary phase and divide without ongoing replication. An oriC-region parS sequence stabilises an unstable
  plasmid in E. coli only when P. putida ParA and ParB are supplied.
