- term:
    id: GO:0007059
    label: chromosome segregation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002433458
  review:
    summary: ParB is the parS-binding component of P. putida chromosome partition.
    action: ACCEPT
    reason: >-
      Core process, supported by P. putida genetics as well as orthology.
      parB mutants produce anucleate cells in minimal medium at the entry
      into stationary phase, and P. putida ParAB reconstitutes partition of
      a parS-carrying plasmid in E. coli. ParB does part of the work of the
      process: it is the parS-bound partition complex that ParA moves.
    supported_by:
    - reference_id: PMID:11832517
      supporting_text: However, in M9-minimal medium different parA and parB mutations gave between 5
        and 10% anucleate cells during the transition from exponential phase to stationary phase.
