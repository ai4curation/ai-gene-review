suggested_questions:
- question: Why is the P. putida par phenotype confined to division without ongoing replication (minimal
    medium, entry into stationary phase), when the P. aeruginosa par mutants are defective during exponential
    growth?
suggested_experiments:
- description: Measure CTP hydrolysis by purified P. putida ParB with and without an oriC-region parS
    DNA, and test a GERRWRA-box mutant in the anucleate-cell assay.
  hypothesis: P. putida ParB is a parS-stimulated CTPase and CTP binding is required for its partition
    function.
  experiment_type: enzyme assay and genetic complementation
