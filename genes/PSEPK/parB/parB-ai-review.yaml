      supporting_text: One was inserted into an unstable mini-F and shown to stabilize it in E. coli in
        a ParAB-dependent manner.
- term:
    id: GO:0045881
    label: positive regulation of sporulation resulting in formation of a cellular spore
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002433458
  review:
    summary: Pseudomonas putida does not sporulate; the term is transferred from B. subtilis Spo0J.
    action: REMOVE
    reason: >-
      The term reaches PANTHER from B. subtilis Spo0J, which antagonises Soj
      inhibition of the Spo0A-dependent sporulation decision. P. putida forms
      no spores and has no Spo0A pathway, and the parAB locus has been studied
      in this species precisely because it has no developmental phase. The
      same term is removed from the P. aeruginosa ortholog's IBA row.
    supported_by:
    - reference_id: PMID:11849535
      supporting_text: We have investigated the role in partition of the parAB locus of a free-living
        bacterium, Pseudomonas putida, not known to pass through developmental phases.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002433458
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          TreeGrafter carries the positive-sporulation term inherited from the
          B. subtilis Spo0J-seeded IBD (PTN002121186) to non-sporulating
          Pseudomonas.
- term:
    id: GO:0043273
    label: CTPase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  supporting_entities:
  - UniProtKB:Q9HT12
  review:
    summary: ParB is predicted to be a parS-stimulated CTPase, like its directly assayed P. aeruginosa
      ortholog.
    action: NEW
    reason: >-
      The 79%-identical P. aeruginosa ParB hydrolyses CTP in a
      parS-stimulated reaction, measured on the purified protein. The P.
      putida protein has the same CTP-binding box (GERRWRA, residues 91-97)
      at the same position. CTP binding and hydrolysis are a conserved
      feature of the ParB family that ancestral reconstruction traces to
      early bacteria. Not in GOA, and absent from NCBI's architecture-based
      annotation, which names the N-terminal domain a nuclease. The P. aeruginosa source rows are themselves proposed (IDA) in the
      genes/PSEAE/parB review and are not yet in GOA, so this transfer
      depends on them being accepted.
    supported_by:
    - reference_id: PMID:38843873
      supporting_text: We found that the same holds true for the P. aeruginosa ParB.
    - reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
      supporting_text: ParB has the CTP-binding box
        GERRWRA at 91-97, which coordinates the CTP phosphates in characterized ParB
        CTPases.
    - reference_id: PMID:41448349
      supporting_text: Loading of ParB onto DNA is regulated by a recently discovered conserved CTPase
        domain
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  supporting_entities:
  - UniProtKB:Q9HT12
  review:
    summary: ParB binds parS palindromes, as shown directly for its P. aeruginosa ortholog.
    action: NEW
    reason: >-
      The replacement proposed for the electronic DNA binding row, recorded
      with its evidence. The 79%-identical P. aeruginosa ParB binds parS
      specifically as a purified protein (IDA in that review), with a parS
      consensus that includes the P. putida sites. In P. putida itself, an
      oriC-region parS-like sequence confers ParAB-dependent plasmid stability,
      the functional signature of ParB-parS recognition. The P. aeruginosa source rows are themselves proposed (IDA) in the
      genes/PSEAE/parB review and are not yet in GOA, so this transfer
      depends on them being accepted.
    supported_by:
    - reference_id: PMID:15466051
      supporting_text: Purified ParB binds specifically to DNA containing a putative parS sequence based
        on the consensus sequence found in the chromosomes of Bacillus subtilis, Pseudomonas putida,
        and Streptomyces coelicolor.
    - reference_id: PMID:11849535
      supporting_text: One was inserted into an unstable mini-F and shown to stabilize it in E. coli in
        a ParAB-dependent manner.
- term:
    id: GO:0002135
    label: CTP binding
  evidence_type: ISM
  original_reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
  review:
    summary: ParB carries the conserved ParB CTP-binding box GERRWRA.
