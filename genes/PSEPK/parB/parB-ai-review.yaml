  supporting_entities:
  - InterPro:IPR004437
  review:
    summary: ParB binds DNA; the defining activity is sequence-specific binding to parS palindromes.
    action: MODIFY
    reason: >-
      True but less specific than the evidence supports. In P. putida, a
      parS-like sequence from the oriC-parAB region confers ParAB-dependent
      plasmid stability, the functional signature of ParB-parS recognition,
      and the curated UniProt function states that ParB binds the origin
      region. The 79%-identical P. aeruginosa ParB binds parS specifically
      (IDA in that review). Sequence-specific DNA binding (GO:0043565), a
      descendant of DNA binding, is the informative term.
    proposed_replacement_terms:
    - id: GO:0043565
      label: sequence-specific DNA binding
    supported_by:
    - reference_id: PMID:11849535
      supporting_text: One was inserted into an unstable mini-F and shown to stabilize it in E. coli in
        a ParAB-dependent manner.
    - reference_id: PMID:15466051
      supporting_text: Purified ParB binds specifically to DNA containing a putative parS sequence based
