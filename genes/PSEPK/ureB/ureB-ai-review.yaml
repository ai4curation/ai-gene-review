id: Q88J05
gene_symbol: ureB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreB is the cytoplasmic beta structural subunit of the three-chain bacterial
  urease. It associates with UreA and the catalytic UreC chain in the UreABC
  apoprotein and contributes to urea hydrolysis by the mature dinickel complex.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The reviewed UniProt record places UreB in the cytoplasm.
      action: ACCEPT
      reason: This is consistent with the soluble UreABC complex.
  - term:
      id: GO:0009039
      label: urease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: UreB contributes structurally to the heteromeric urease activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        UreB does not independently enable urease activity; it contributes to
        activity of UreABC, whose catalytic binickel site is in UreC
        (PMID:8718850).
  - term:
      id: GO:0035550
      label: urease complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: UreB is the beta subunit of the UreABC urease complex.
      action: ACCEPT
      reason: Structural studies define bacterial urease as an alpha-beta-gamma assembly.
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: UreB is a required structural component of the urea-hydrolyzing complex.
      action: ACCEPT
      reason: Mature UreABC directly hydrolyzes urea.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
  - id: PMID:8718850
    title: Structures of the Klebsiella aerogenes urease apoenzyme and two active-site mutants.
    findings:
      - statement: Urease is an alpha-beta-gamma trimer with its binickel center in the alpha chain.
        supporting_text: >-
          Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268,
          998-1004] is an (alpha beta gamma)3 trimer with each alpha-subunit
          having an (alpha beta)8-barrel domain containing a binickel active center.
        full_text_unavailable: true
    full_text_unavailable: true
