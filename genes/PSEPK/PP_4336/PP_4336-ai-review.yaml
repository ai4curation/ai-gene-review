gene_symbol: PP_4336
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_4336 encodes MotC, the A-type (MotA-like) subunit of the MotCD flagellar stator of Pseudomonas
  putida KT2440. It is an inner-membrane protein with predicted transmembrane helices, an N-terminal MotA_N
  region and a MotA/TolQ/ExbB proton-channel domain (Pfam PF01618), and it is 83% identical to Pseudomonas
  aeruginosa MotC. Together with the MotB-like MotD (PP_4335), encoded immediately downstream in the flagellar
  gene cluster and cotranscribed with cheB1, it forms one of the two stators that power the polar flagella;
  the second is MotAB (PP_4905-PP_4904). MotA-family subunits form the membrane ring of the stator that
  conducts protons and engages the FliG torque helix of the rotor. In KT2440 the MotCD stator is dispensable
  for swimming in liquid but is required for efficient spreading through semisolid agar, where its loss
  leads to sessile, nonmotile cell clusters; cells lacking both stators are nonmotile. Proton coupling
  is inferred from the MotA/MotB-type channel architecture; the KT2440 study directly measures motility
  rather than ion flux.
