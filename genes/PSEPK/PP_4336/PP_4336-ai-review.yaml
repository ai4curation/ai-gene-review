  review:
    summary: MotCD can contribute motor torque during chemotactic wrapped-mode movement under increased
      load.
    action: KEEP_AS_NON_CORE
    reason: Native KT2440 gradient experiments show wrapped-mode run-time bias (PMID32766440), and the
      independent stator study finds that MotCD alone can support wrapped mode under increased load, less
      efficiently (PMID36409076). These observations support a conditional mechanical-effector inference
      for MotC in guided movement, not a demonstrated MotC sensory or switching role. The same stator
      study finds that MotCD deletion leaves liquid swimming speed unaffected while promoting sessile
      clustering; its reduced semisolid spreading therefore must not be called a chemotaxis defect. Retain
      the conditional directed-movement context as non-core; neither normal speed after deletion nor a
      spreading phenotype alone settles chemotaxis participation.
