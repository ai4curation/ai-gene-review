  qualifier: contributes_to
  review:
    summary: 'Proposed new MF (contributes_to): as part of the MotCD stator, MotC contributes to the proton
      channel that couples proton influx to torque.'
    action: NEW
    reason: MotC carries the MotA/TolQ/ExbB proton-channel domain, and MotCD stators of the closely related
      P. aeruginosa use proton motive force. Stator units of the MotA/MotB type act as transmembrane proton
      channels coupling proton flow to torque. The activity is a property of the assembled A/B complex,
      hence contributes_to. This is the module-asserted complex-level activity for the MotC/MotD stator.
      Curator inference (IC); proton conduction has not been measured for KT2440 MotCD. The ion species
      is a homolog-based mechanistic inference; PMID36409076 does not directly measure proton flux. The
      inherited proposal is retained with this evidence boundary.
