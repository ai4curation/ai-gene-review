suggested_questions:
- question: Do KT2440 MotCD and MotAB stators differ in ion specificity, load sensitivity or recruitment,
    and does MotCD sense surface contact to suppress sessile cluster formation?
suggested_experiments:
- hypothesis: MotCD is a proton-driven stator whose recruitment increases under mechanical load in KT2440.
  description: Express fluorescent MotD (or MotC) from the native locus and measure stator dynamics at
    polar motors in liquid versus semisolid agar or high viscosity; test sensitivity of MotCD-only (motAB
    deletion) swimming to protonophores and to sodium-motive-force perturbation, and test plug mutations
    for proton leakage.
  experiment_type: cell imaging and motor physiology
