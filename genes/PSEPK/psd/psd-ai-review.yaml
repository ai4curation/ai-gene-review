      supporting_text: "biosynthesis; phosphatidylethanolamine from CDP-diacylglycerol: step"
    - reference_id: file:PSEPK/psd/psd-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_00662; PS_decarb_PSD_B_type1; 1."
