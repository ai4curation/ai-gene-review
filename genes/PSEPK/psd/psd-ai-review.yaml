id: Q88DB9
gene_symbol: psd
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  psd (PP_4908) encodes the type-I phosphatidylserine decarboxylase proenzyme
  that performs the second consecutive step of phosphatidylethanolamine
  biosynthesis. Autocatalytic cleavage generates a membrane-associated beta
  chain and a pyruvoyl-containing alpha chain; the mature heterodimer
  decarboxylates phosphatidylserine made by PssA to phosphatidylethanolamine and
  carbon dioxide at the cytoplasmic membrane.
