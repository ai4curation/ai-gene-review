- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Psd catalyzes the second and terminal step from CDP-diacylglycerol-derived phosphatidylserine to phosphatidylethanolamine.
    action: ACCEPT
    reason: "This is the core biological process. The HAMAP MF_00662 function and pathway statements in the UniProt record place Psd at step 2/2 of phosphatidylethanolamine biosynthesis from CDP-diacylglycerol, and the protein matches the prokaryotic type I PSD-B HAMAP family with the conserved pyruvoyl-forming serine (residue 252); the assignment is by family rule, not an assay on this protein."
