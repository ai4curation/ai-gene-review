- id: file:PSEPK/psd/psd-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK psd
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Supports Q88DB9/Psd as the pyruvoyl-dependent monotopic
      phosphatidylserine decarboxylase that produces PE at the inner membrane,
      based on curated family evidence, conserved motifs, AlphaFold topology,
      organism lipidomics, and ortholog enzymology; direct kinetic analysis of
      the KT2440 protein itself remains absent.
  findings:
  - statement: The report supports the phosphatidylserine decarboxylase assignment through convergent family, motif, structural, and pathway evidence.
