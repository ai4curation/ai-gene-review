id: Q88L14
gene_symbol: moeA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  moeA (PP_2123) encodes the soluble molybdopterin molybdotransferase of Pseudomonas putida
  KT2440. By family membership with Escherichia coli MoeA it inserts molybdate into
  adenylylated molybdopterin (MPT-AMP) with release of AMP, forming Mo-molybdopterin, the
  metal-insertion step of molybdenum cofactor biosynthesis that precedes the optional
  nucleotide additions made by MobA. The protein has the full MoeA four-domain architecture
  (MoeA N-terminal/linker domain, MoaB/Mog-like domain and MoeA C-terminal domain) and a
  Mg2+ cofactor; it has not been characterised directly in KT2440.
