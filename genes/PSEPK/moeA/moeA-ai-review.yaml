      soluble molybdopterin molybdotransferase.
    action: MODIFY
    reason: True but less specific than the evidence supports. The same PANTHER transfer also gives
      cytosol (GO:0005829), a part of the cytoplasm, and the characterised E. coli ortholog MoeA is
      found in the cytosolic fraction; so the row is refined to cytosol, as for ECOLI/moeA. This
      revises the earlier KEEP_AS_NON_CORE from the TreeGrafter re-review, which argued that
      redundancy is not over-annotation; that is right, but a correct-but-general term is a MODIFY
      to the supported descendant, not a non-core keep.
