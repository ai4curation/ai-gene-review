- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The metal bound by MoeA is a Mg2+ cofactor (one per subunit in the E. coli structure).
    action: MODIFY
    reason: Correct but general. The curated RuleBase cofactor line names Mg2+, and the E. coli
      MoeA crystal structure binds one Mg2+ per subunit, so the specific descendant GO:0000287
      magnesium ion binding is supported. Molybdate is a substrate, not a bound metal ion
      cofactor. The earlier draft kept the generic term as non-core while arguing it was less
      informative; that action did not match the reason.
    proposed_replacement_terms:
    - id: GO:0000287
      label: magnesium ion binding
    supported_by:
