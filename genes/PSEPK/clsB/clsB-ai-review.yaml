  review:
    summary: Cardiolipin synthase activity from the ClsB family assignment.
    action: ACCEPT
    reason: The protein matches the ClsB-specific HAMAP rule and InterPro family, which define the PG
      + PG cardiolipin synthase reaction (RHEA:31451). Its E. coli counterpart in the same sub-subfamily
      has direct biochemical evidence for this reaction, and KT2440 membranes contain cardiolipin. No
      enzyme assay on the KT2440 protein itself is available, so the activity rests on family membership.
    supported_by:
