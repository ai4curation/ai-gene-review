status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ClsB (PP_3264) is the Pseudomonas putida KT2440 member of the ClsB sub-subfamily of phospholipase
  D-family cardiolipin synthases. It is a peripheral membrane protein without transmembrane helices and
  has two HKD catalytic motifs. By homology to Escherichia coli ClsB, it forms cardiolipin and glycerol
  from two phosphatidylglycerol molecules; the E. coli enzyme acts mainly in stationary phase and can
  also make phosphatidylglycerol from phosphatidylethanolamine and glycerol. KT2440 also has a ClsA-type
  paralog.
