  qualifier: enables
  review:
    summary: Correct family-level activity retained as non-core beside the substrate-specific term.
    action: KEEP_AS_NON_CORE
    reason: Ivd is an acyl-CoA dehydrogenase, while GO:0008470 captures its informative physiological
      substrate.
