    action: ACCEPT
    reason: The exact Ivd product assignment and EC 1.3.8.4 support this activity.
- term:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
