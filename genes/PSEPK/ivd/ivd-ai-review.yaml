  review:
    summary: Mechanistically correct oxidoreductase parent term.
    action: KEEP_AS_NON_CORE
    reason: Retain the valid parent chemistry as non-core; the substrate-specific dehydrogenase term
      is substantially more informative.
- term:
    id: GO:0016937
    label: short-chain fatty acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The close LiuA ortholog also oxidizes butyryl-CoA, but this is a minor promiscuous
      activity beside its preferred isovaleryl-CoA reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: Do not treat the short-chain activity as the physiological core function; retain the
      exact 3-methylbutanoyl-CoA dehydrogenase activity as core.
    supported_by:
    - reference_id: PMID:18625020
      supporting_text: and butyryl-CoA as substrates.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: FAD is a required cofactor but binding alone is not the core function.
    action: KEEP_AS_NON_CORE
    reason: Retain the genuine cofactor-binding function as non-core beside the catalytic activity.
