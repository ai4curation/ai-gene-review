id: Q88FM5
gene_symbol: ivd
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: Ivd is an FAD-dependent 3-methylbutanoyl-CoA (isovaleryl-CoA) dehydrogenase that forms 3-methylcrotonyl-CoA
  in the distal L-leucine catabolic pathway. It belongs to the acyl-CoA dehydrogenase family and transfers
  reducing equivalents onward through electron-transfer flavoprotein.
