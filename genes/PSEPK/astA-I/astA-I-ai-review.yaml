- id: file:PSEPK/astA-I/astA-I-bioinformatics/RESULTS.md
  title: Reproducible AstA chain sequence comparison
  findings:
  - statement: >-
      Q88EI3 is beta-like: it is 85.6% identical across aligned residues to P. aeruginosa beta chain P80358
      and 38.0% to alpha chain P80357.
    supporting_text: Q88EI3 is therefore beta-like and Q88EI2 is alpha-like.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified against the reproducible pairwise-identity table; the local comparison supports Q88EI3
      beta-chain assignment while explicitly leaving KT2440 complex stoichiometry and catalytic sufficiency
      unmeasured.
