id: Q88EI3
gene_symbol: astA-I
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  AstA-I (PP_4479) is the beta-like component of the split arginine/ornithine N-succinyltransferase found
  in Pseudomonas putida KT2440. Together with the adjacent alpha-like AstA-II chain, it is predicted to
  form the first enzyme of the arginine succinyltransferase pathway, transferring succinyl-CoA to L-arginine
  and also accepting L-ornithine. The reaction commits these amino acids to aerobic catabolism through
  N-succinylated intermediates.
existing_annotations:
- term:
    id: GO:0006527
    label: L-arginine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      AstA-I contributes to the initiating succinylation reaction of the AST arginine-catabolic pathway.
    action: ACCEPT
    reason: >-
      The exact KT2440 protein is assigned to the AstA/AruG family and lies next to the complementary
      AstA-II chain. Pseudomonas aeruginosa genetics and biochemistry establish the homologous two-chain
      transferase as the entry reaction for aerobic arginine utilization.
    additional_reference_ids:
    - PMID:9393691
    - PMID:7523119
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and ornithine N2-succinyltransferases.
    - reference_id: file:PSEPK/astA-I/astA-I-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: NCBIfam; TIGR03244; arg_catab_AstA; 1.
- term:
    id: GO:0008791
    label: L-arginine N-succinyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      L-arginine N-succinyltransferase activity is correct for the enzyme this chain belongs to; only
      the enables qualifier overstates single-chain autonomy.
    action: ACCEPT
    reason: >-
      The purified Pseudomonas enzyme is a heterotetramer of two different chains, so the activity belongs
      to the complex. The term is correct, and contributes_to correctly scopes the claim to the complex;
      the qualifier error is recorded as a WRONG_QUALIFIER source defect (same idiom as the E. coli NuoB/NuoC
      and CysI reviews). The core function uses contributes_to.
    additional_reference_ids:
    - PMID:7523119
    supported_by:
    - reference_id: PMID:7523119
      supporting_text: >-
        After SDS/PAGE two subunits of 35 kDa and 37 kDa were evident, indicating that the enzyme is a
        heterotetramer.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        Q88EI3 is one chain of a split two-chain arginine N-succinyltransferase (the Pseudomonas enzyme
        is a heterotetramer, PMID:7523119); the GO:0008791 row should use contributes_to unless each chain
        is shown to be active alone.
