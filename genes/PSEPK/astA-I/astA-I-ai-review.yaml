      Genetic analysis assigns aruF and aruG to the two transferase chains in the aerobic AST pathway.
    supporting_text: >-
      the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and ornithine N2-succinyltransferases.
  reference_review:
