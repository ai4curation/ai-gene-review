id: Q88EI3
gene_symbol: astA-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AstA-I (PP_4479) is the beta-like component of the split arginine/ornithine
  N-succinyltransferase found in Pseudomonas putida KT2440. Together with the
  adjacent alpha-like AstA-II chain, it is predicted to form the first enzyme of
  the arginine succinyltransferase pathway, transferring succinyl-CoA to
  L-arginine and also accepting L-ornithine. The reaction commits these amino
  acids to aerobic catabolism through N-succinylated intermediates.
existing_annotations:
- term:
    id: GO:0006527
    label: L-arginine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: AstA-I contributes to the initiating succinylation reaction of the AST arginine-catabolic pathway.
    action: ACCEPT
    reason: >-
      The exact KT2440 protein is assigned to the AstA/AruG family and lies next
      to the complementary AstA-II chain. Pseudomonas aeruginosa genetics and
      biochemistry establish the homologous two-chain transferase as the entry
      reaction for aerobic arginine utilization.
    additional_reference_ids:
    - PMID:9393691
    - PMID:7523119
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and ornithine N2-succinyltransferases.
- term:
    id: GO:0008791
    label: L-arginine N-succinyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The molecular-function assignment is correct for the assembled split AstA enzyme, but not demonstrated for AstA-I alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The homologous Pseudomonas aeruginosa enzyme is a heterotetramer containing
      two nonidentical chains. Q88EI3 should therefore contribute to, rather than
      independently enable, the complex-level transferase activity.
    additional_reference_ids:
    - PMID:7523119
    supported_by:
    - reference_id: PMID:7523119
      supporting_text: >-
        After SDS/PAGE two subunits of 35 kDa and 37 kDa were evident, indicating that the enzyme is a heterotetramer.
