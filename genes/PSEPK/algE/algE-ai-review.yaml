id: Q88NC8
gene_symbol: algE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgE is the predicted outer-membrane alginate export channel of Pseudomonas putida
  KT2440. Specific family identity and experimentally characterized Pseudomonas aeruginosa orthologs
  support a beta-barrel pore that provides a route for polymer secretion. A modeled KT2440 AlgEKX
  arrangement links it to the periplasmic AlgK–AlgX complex, but that complete assembly and native
  target polymer transport have not been experimentally established.
