  review:
    action: NEW
    summary: AlgE-family identity supports inferred polysaccharide transport across the outer
      membrane.
    reason: GO:0015159 explicitly describes transfer of a polysaccharide across a membrane and
      therefore includes alginate. The target curated probable alginate-pore function, specific AlgE
      family and Pa structure/flux/loop-mutant evidence support an ISS proposal. Neither existing
