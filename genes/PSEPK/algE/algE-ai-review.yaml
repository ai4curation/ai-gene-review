suggested_questions:
- question: Does KT2440 AlgE form an alginate-specific outer-membrane pore with substrate
    selectivity comparable to characterized AlgE homologs?
suggested_experiments:
- description: Reconstitute AlgE in proteoliposomes or planar bilayers and test alginate-dependent
    channel conductance and polymer passage.
