id: Q88PQ3
gene_symbol: fruA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FruA is the integral inner-membrane component of the fructose phosphotransferase
  system in Pseudomonas putida KT2440. Together with FruB it couples fructose uptake to formation
  of intracellular fructose 1-phosphate. Its sequence contains two EIIB-like domains followed
  by the membrane EIIC domain. The conserved EIIB phosphocysteine mechanism is inferred from
  fructose-PTS family evidence; the catalytic contributions of the two target EIIB-like domains
  have not been individually established.
