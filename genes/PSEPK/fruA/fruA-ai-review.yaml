- term:
    id: GO:0022877
    label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter
      activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Accept as the principal molecular function. FruA couples membrane translocation
      of extracellular fructose to phosphotransfer from the FruB relay, yielding intracellular
      fructose 1-phosphate.
    action: ACCEPT
    reason: FruA carries the fructose-specific EIIB and EIIC family signatures, and
      KT2440 genetics show that FruA-mediated fructose transport depends on phosphate
      delivered by FruB from PEP, yielding fructose 1-phosphate. This matches the
      GO:0022877 reaction (protein N-phosphohistidine + fructose(out) = protein histidine
      + fructose phosphate(in)).
    supported_by:
    - reference_id: file:PSEPK/fruA/fruA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR003353; PTS_IIB_fruc.
    - reference_id: file:PSEPK/fruA/fruA-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR01427; PTS_IIC_fructo; 1.
    - reference_id: PMID:18296519
      supporting_text: FruB mutants cannot transport fructose through the two-domain
        (EIIB Fru and EIIC Fru ) FruA permease
    - reference_id: PMID:27933319
      supporting_text: the source of such a phosphate residue needed for the conversion
        of Fru into F1P is PEP
