id: Q88PQ3
gene_symbol: fruA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FruA is the inner-membrane EIIB'BC component of the fructose-specific
  phosphoenolpyruvate-dependent phosphotransferase system. Its two EIIB type-2 domains
  contain conserved cysteine-bearing motifs and receive phosphate from FruB, while
  its EIIC membrane domain couples fructose translocation to phosphorylation, producing
  intracellular fructose 1-phosphate.
existing_annotations:
- term:
    id: GO:0005351
    label: carbohydrate:proton symporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Remove. FruA is an EIIB'BC phosphotransferase-system permease that
      phosphorylates fructose during import using phosphate relayed from PEP through
      FruB; no proton-coupled symport role is supported.
    action: REMOVE
    reason: The InterPro2GO symporter mapping on the fructose-family EIIC domain
      conflicts with the PEP-driven group-translocation mechanism established for
      the KT2440 FruB/FruA system, in which the energy and phosphate for fructose
      uptake come from PEP rather than a proton gradient.
    supported_by:
    - reference_id: PMID:27933319
      supporting_text: the source of such a phosphate residue needed for the conversion
        of Fru into F1P is PEP
    - reference_id: PMID:18296519
      supporting_text: FruB mutants cannot transport fructose through the two-domain
        (EIIB Fru and EIIC Fru ) FruA permease
