  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Remove. FruA is an EIIB'BC phosphotransferase-system transporter that
      uses a protein phosphorelay to phosphorylate fructose during import; no proton-coupled
      symport role is supported.
    action: REMOVE
    reason: The InterPro-derived proton-symporter mapping conflicts with the exact
      RHEA:49252 phosphotransfer reaction and the experimentally established FruB/FruA
      PTS mechanism.
