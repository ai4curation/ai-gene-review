suggested_questions:
- question: Does FruA form a stable oligomer in the KT2440 inner membrane, and which interface
    coordinates EIIB phosphorylation with EIIC transport?
- question: Which of the two EIIB-like domains and cysteines of Q88PQ3 carries phosphotransfer
    in KT2440, and does the N-terminal domain serve an auxiliary B-prime role as in E. coli?
suggested_experiments:
- hypothesis: The conserved EIIB phosphocysteine is required for both fructose phosphorylation
    and productive transport through EIIC.
  description: Compare wild-type FruA with a phosphocysteine substitution in a fruA-null strain
    using radiolabeled fructose uptake, intracellular fructose 1-phosphate quantification, and
    membrane localization controls.
  experiment_type: transporter phosphosite mutagenesis and uptake assay
