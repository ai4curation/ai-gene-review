- term:
    id: GO:0090563
    label: protein-phosphocysteine-sugar phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Modify this TreeGrafter sugar-generic phosphocysteine term to the fructose-specific
      phosphocysteine-D-fructose PTS transporter activity.
    action: MODIFY
    reason: FruA carries two PROSITE EIIB type-2 domains of the fructose-specific
      IIB family and a fructose-family EIIC domain, so the phosphocysteine-to-sugar
      chemistry is true but the substrate is D-fructose. The is_a descendant GO:0090582
      captures both; this is the same action taken on the E. coli FruA IBA row. Kept
      out of core_functions here because, unlike E. coli FruA (C112S IMP), the KT2440
      EIIB cysteine has not been tested.
    proposed_replacement_terms:
    - id: GO:0090582
      label: protein-phosphocysteine-D-fructose-phosphotransferase system transporter
        activity
