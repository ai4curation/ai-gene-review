taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase F0 subunit b, a single-pass plasma-membrane protein that forms the peripheral stator stalk with delta and mechanically anchors the F1 catalytic head to F0.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AtpF is a single-pass integral plasma-membrane protein.
      action: ACCEPT
      reason: The transmembrane helix anchors the peripheral stalk in F0.
  - term:
      id: GO:0015078
      label: proton transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: AtpF is a stator stalk component rather than a proton-conducting channel subunit.
      action: MARK_AS_OVER_ANNOTATED
      reason: Proton transport is mediated principally by subunits a and c; b structurally couples F0 and F1.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: The stator stalk is required for proton-driven ATP synthesis.
      action: ACCEPT
      reason: AtpF directly participates in the mechanical coupling of this process.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: located_in
    review:
      summary: AtpF is membrane-localized.
      action: MARK_AS_OVER_ANNOTATED
      reason: Correct but redundant with the more specific plasma-membrane annotation.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: AtpF is subunit b of the F0 sector and peripheral stalk.
      action: ACCEPT
      reason: This records direct complex membership.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: AtpF mechanically supports but does not independently enable coupled ATP synthase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: This activity requires the complete F0F1 assembly and should be represented as a contribution.
  - term:
      id: GO:0046961
      label: proton-transporting ATPase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: AtpF is a structural stator subunit rather than an autonomous rotational ATPase.
      action: MARK_AS_OVER_ANNOTATED
      reason: Hydrolytic proton-pumping activity is a property of the assembled complex.
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AtpF participates in the coupled proton-transport process by stabilizing the stator.
      action: ACCEPT
      reason: Process participation is appropriate even though AtpF does not directly conduct protons.
