  qualifier: enables
  review:
    summary: Generic catalytic activity does not resolve the conflicting family assignments.
    action: MARK_AS_OVER_ANNOTATED
    reason: A substrate-specific annotation requires biochemical or stronger comparative evidence.
- term:
    id: GO:0004419
    label: hydroxymethylglutaryl-CoA lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The HMGL-like domain supports this possibility, but the sequence lacks the HMG-CoA lyase
      PROSITE signature found in MvaB.
    action: UNDECIDED
    reason: An alpha-isopropylmalate/homocitrate-synthase signature creates a paralog-specificity conflict
      that a first pass cannot resolve.
