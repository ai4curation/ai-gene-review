    supporting_text: '| mvaB vs. KT2440 paralog PP_3394 | 41.8% |'
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Provider alignment values were not independently reproduced and do not include direct
      PP_3394-versus-LiuE identity.
- id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
  title: OpenScientist focused report on PP_3394 DRE-TIM reaction and pathway specificity
  findings:
  - statement: MvaB/PP_3540, not PP_3394, is the best supported leucine/terpene HMG-CoA lyase in P.
      putida KT2440.
    supporting_text: the leucine/terpene HMG-CoA-lyase function of *P. putida* belongs to **mvaB /
      PP_3540**
    reference_section_type: RESULTS
  - statement: PP_3394 fails the HMG-CoA-lyase-specific active-site signature used to distinguish the
      canonical lyases from related DRE-TIM synthases.
    supporting_text: PP_3394 FAILS the HMG-CoA-lyase-specific PROSITE active-site signature PS01062
      (SVAGLGGCPY)
    reference_section_type: RESULTS
  - statement: PP_3394 should be treated as a catalytically competent DRE-TIM metallolyase of unresolved
      substrate specificity.
    supporting_text: divergent DRE-TIM metallolyase, specificity undetermined by sequence
    reference_section_type: RESULTS
  - statement: The PP_3394-specific discriminators are computational; direct biochemistry or a mutant
      phenotype is still absent.
    supporting_text: All of the discriminating evidence is *computational* (pairwise alignment, PROSITE/motif
      scanning, and a whole-sequence NJ phylogeny). There is **no direct biochemical assay or mutant
      phenotype for PP_3394 itself**
    reference_section_type: RESULTS
  - statement: The bacterial PP_3394 annotation should not carry a mammalian ketone-body biosynthesis
      process term.
    supporting_text: '"Ketone-body biosynthesis" is a mammalian physiological concept and should not
      be transferred to this bacterium regardless of enzyme family.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Focused report checked against the prior unresolved PP_3394/MvaB distinction; it
      resolves the HMG-CoA lyase and leucine-process rows by motif, orthology, and neighborhood evidence,
      while leaving PP_3394's exact substrate open.
- id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
