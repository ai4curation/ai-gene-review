- id: file:PSEPK/mvaB/mvaB-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK mvaB
  findings:
  - statement: The provider reports that MvaB is much closer to characterized P. aeruginosa LiuE than
      it is to PP_3394.
    supporting_text: '| mvaB (PP_3540) vs. *P. aeruginosa* LiuE/PA2011 (characterized HMG-CoA lyase)
      | **78.6%** |'
    reference_section_type: RESULTS
  - statement: The provider reports moderate identity between the two KT2440 paralogs; it does not
      report a direct PP_3394-to-LiuE comparison.
    supporting_text: '| mvaB vs. KT2440 paralog PP_3394 | 41.8% |'
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Provider alignment values were not independently reproduced and do not include direct
      PP_3394-versus-LiuE identity.
