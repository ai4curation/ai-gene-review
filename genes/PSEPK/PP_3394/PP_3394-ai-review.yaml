    supported_by:
    - reference_id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
      supporting_text: divergent DRE-TIM metallolyase, specificity undetermined by sequence
- term:
    id: GO:0046951
    label: ketone body biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Ketone-body biosynthesis is a mammalian pathway frame and should not be transferred to PP_3394.
    action: REMOVE
    reason: The focused PP_3394 audit separates bacterial HMG-CoA lyase chemistry from mammalian ketone-body
      biosynthesis. Even if a KT2440 enzyme cleaves HMG-CoA in leucine or terpene catabolism, that reaction
      is not production of circulating ketone bodies, and PP_3394 is not the supported HMG-CoA lyase paralog.
    supported_by:
    - reference_id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
      supporting_text: Both are candidates for the displaced leucine terminal step; choice is **unresolved**
        and should be flagged.
    - reference_id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
      supporting_text: It is **not applicable** to *P. putida* and should not be assigned to any KT2440 gene
