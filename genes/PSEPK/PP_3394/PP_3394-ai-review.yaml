id: Q88HG4
gene_symbol: PP_3394
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PP_3394 is a DRE-TIM metallolyase-family protein with an HMGL-like domain and an alpha-isopropylmalate/homocitrate-synthase
  signature. Its physiological substrate and reaction in Pseudomonas putida KT2440 remain unresolved.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The enzyme-family evidence supports broad catalytic activity despite unresolved reaction
      specificity.
    action: ACCEPT
    reason: The DRE-TIM/HMGL-like and alpha-isopropylmalate/homocitrate-synthase signatures imply catalysis.
      Their disagreement concerns substrate and reaction class, not whether PP_3394 is catalytic; no target-specific
      loss of catalysis has been established.
    supported_by:
    - reference_id: file:PSEPK/PP_3394/PP_3394-uniprot.txt
      supporting_text: InterPro; IPR002034; AIPM/Hcit_synth_CS.
- term:
    id: GO:0004419
    label: hydroxymethylglutaryl-CoA lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The HMGL-like fold supports DRE-TIM catalysis, but the HMG-CoA lyase specificity is
      over-propagated from the better supported MvaB/PP_3540 paralog.
    action: MARK_AS_OVER_ANNOTATED
    reason: The focused PP_3394 audit confirms that this protein retains a DRE-TIM metallolyase fold
      and is probably catalytic, but it lacks the HMG-CoA-lyase-specific PS01062 active-site signature
      carried by MvaB/PP_3540 and characterized Pseudomonas LiuE. Its exact substrate remains unresolved,
      so a confident HMG-CoA lyase assertion is over-specific for this divergent paralog.
    supported_by:
    - reference_id: file:PSEPK/PP_3394/PP_3394-uniprot.txt
      supporting_text: InterPro; IPR002034; AIPM/Hcit_synth_CS.
    - reference_id: file:PSEPK/mvaB/mvaB-deep-research-openscientist.md
      supporting_text: '| mvaB vs. KT2440 paralog PP_3394 | 41.8% |'
    - reference_id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
      supporting_text: Both are candidates for the displaced leucine terminal step; choice is **unresolved**
        and should be flagged.
    - reference_id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
      supporting_text: PP_3394 FAILS the HMG-CoA-lyase-specific PROSITE active-site signature PS01062
- term:
    id: GO:0006552
    label: L-leucine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The leucine-catabolic HMG-CoA lyase step is better assigned to MvaB/PP_3540, not PP_3394.
    action: MARK_AS_OVER_ANNOTATED
    reason: Do not infer a leucine-catabolic role for PP_3394 from the shared DRE-TIM fold. A focused
      paralog audit found that MvaB/PP_3540, rather than PP_3394, is the 78.6% identical ortholog of
      experimentally characterized Pseudomonas aeruginosa LiuE, while PP_3394 is a divergent paralog
      lacking the HMG-CoA-lyase-specific PROSITE signature.
    supported_by:
    - reference_id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
      supporting_text: Both are candidates for the displaced leucine terminal step; choice is **unresolved**
        and should be flagged.
    - reference_id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
      supporting_text: The pathway's HMG-CoA-lyase step is fully accounted for by mvaB/PP_3540
- term:
    id: GO:0016833
    label: oxo-acid-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Oxo-acid lyase activity depends on an unresolved reaction-class assignment.
    action: UNDECIDED
    reason: GO:0016833 specifies nonhydrolytic, nonoxidative C-C cleavage of a 3-hydroxy acid (QuickGO
      definition checked 2026-09-20). HMG-CoA cleavage fits, whereas a synthase-family assignment alone
      does not establish this cleavage activity. This uncertainty is about chemistry, not excessive generality.
    supported_by:
    - reference_id: file:PSEPK/PP_3394/PP_3394-uniprot.txt
      supporting_text: InterPro; IPR002034; AIPM/Hcit_synth_CS.
    - reference_id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
      supporting_text: Both are candidates for the displaced leucine terminal step; choice is **unresolved**
        and should be flagged.
    - reference_id: file:PSEPK/PP_3394/PP_3394-hypotheses/dre-tim-reaction-and-pathway-specificity/openscientist.md
      supporting_text: divergent DRE-TIM metallolyase, specificity undetermined by sequence
- term:
