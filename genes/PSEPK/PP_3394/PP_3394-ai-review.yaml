- id: PMID:19459965
  title: The Pseudomonas aeruginosa liuE gene encodes the 3-hydroxy-3-methylglutaryl coenzyme A lyase,
    involved in leucine and acyclic terpene catabolism.
  full_text_unavailable: true
  findings:
  - statement: Biochemical characterization of P. aeruginosa LiuE provides the positive HMG-CoA lyase
      comparator against which the conflicting PP_3394 signatures were evaluated.
    supporting_text: cleavage of HMG-CoA to acetyl-CoA and acetoacetate.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verified; this characterizes a comparator ortholog and does not
      resolve PP_3394 itself.
- id: file:PSEPK/mvaB/mvaB-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK mvaB
  findings:
  - statement: The provider reports that MvaB is much closer to characterized P. aeruginosa LiuE than
      it is to PP_3394.
    supporting_text: '| mvaB (PP_3540) vs. *P. aeruginosa* LiuE/PA2011 (characterized HMG-CoA lyase)
      | **78.6%** |'
    reference_section_type: RESULTS
  - statement: The provider reports moderate identity between the two KT2440 paralogs; it does not
      report a direct PP_3394-to-LiuE comparison.
    supporting_text: '| mvaB vs. KT2440 paralog PP_3394 | 41.8% |'
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Provider alignment values were not independently reproduced and do not include direct
      PP_3394-versus-LiuE identity.
- id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-modulepathwaytaxo-d2b7396e.md
  title: Cached OpenScientist BCAA-catabolism module report for Pseudomonas putida KT2440
  findings:
  - statement: The generated module report explicitly leaves PP_3394 versus MvaB unresolved as the
      displaced HMG-CoA lyase candidate.
    supporting_text: Both are candidates for the displaced leucine terminal step; choice is **unresolved**
      and should be flagged.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Actual generated report read and exported using ResearchProcessor from the existing
      provider cache; provenance hashes are recorded beside the export. Candidate coverage is not
      biochemical assignment of PP_3394.
suggested_experiments:
- description: Purify PP_3394 and compare HMG-CoA cleavage with alpha-isopropylmalate- or homocitrate-synthase
    reactions; combine this with mvaB/PP_3394 single- and double-deletion growth tests.
suggested_questions:
- question: Which reaction and physiological substrate belong to PP_3394, given the overlapping DRE-TIM
    signatures and unresolved distinction from MvaB?
