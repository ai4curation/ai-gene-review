    label: bacterial-type RNA polymerase core enzyme binding
  evidence_type: ISS
  original_reference_id: file:PSEPK/rpoZ/rpoZ-uniprot.txt
  qualifier: enables
  review:
    summary: Omega binds the beta-prime subunit of the bacterial core enzyme.
    action: NEW
    reason: >-
      HAMAP-curated omega function (latching beta-prime into the core), experimentally
      established for the E. coli ortholog (genes/ECOLI/rpoZ; PMID:11531998) and placed
      by PAINT at the bacterial omega node PTN002157784, which this protein descends
      from.
    supported_by:
