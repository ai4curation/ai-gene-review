id: Q88C82
gene_symbol: rpoZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  rpoZ (PP_5301) encodes the small omega subunit of the bacterial DNA-directed RNA
  polymerase core enzyme. Omega binds and latches the N- and C-terminal regions of
  the beta-prime subunit, facilitating its interaction with the beta and alpha subunits
  and promoting assembly and stability of the alpha2 beta beta' omega core. It is
  a structural and assembly subunit rather than a contributor of active-site residues.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The fetched IEA record assigns generic DNA binding to RpoZ, but the UniProt
      functional comment emphasizes RNA polymerase assembly/stability rather than
      a direct DNA-binding role for omega.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DNA binding may be an indirect family-level projection from association with
      RNA polymerase. The core RpoZ role is structural assembly/stability of the RNAP
      core enzyme, so generic DNA binding should not be treated as a core function.
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Polymerase activity (DNA-directed RNA polymerase activity) projected onto a
      non-catalytic RNAP subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotation from transferring a complex-level activity to every subunit.
      This subunit does not contribute active-site residues: omega latches beta-prime
      and promotes assembly, and omega-less RNAP remains active. Its informative functions
      are captured by assembly and subunit-specific terms in this review (see projects/PROTEIN_COMPLEX_FUNCTIONS.md).
      Applied identically to the E. coli K-12 ortholog.
    supported_by:
    - reference_id: file:PSEPK/rpoZ/rpoZ-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Promotes RNA polymerase assembly. Latches the N- and C-terminal regions of
        the beta' subunit thereby facilitating its interaction with the beta and alpha
        subunits.
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      RpoZ participates in DNA-templated transcription through its structural role
      in the bacterial RNA polymerase core enzyme.
    action: ACCEPT
    reason: >-
      Correct process annotation for an RNAP core subunit, provided it is understood
      as participation through the assembled complex.
