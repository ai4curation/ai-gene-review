suggested_questions:
- question: >-
    Should UniProt/InterPro-derived DNA-directed RNA polymerase activity continue
    to be propagated with the enables qualifier to non-catalytic bacterial RNAP subunits
    (alpha, omega), rather than restricting contributes_to to the beta and beta-prime
    active-centre subunits?
