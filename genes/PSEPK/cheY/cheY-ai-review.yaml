        (PP_4338)**.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      CheY is a soluble, diffusible response regulator that carries the signal
      from the receptor-associated CheA kinase to the cytoplasmic C-ring of the
      flagellar motor. The single REC domain has no signal peptide or
      transmembrane segment.
    action: ACCEPT
    reason: >-
      Cytoplasm is correct and is the most specific location the evidence
      supports for the protein itself; it acts transiently at arrays and at the
      motor but is not a resident component of either. The UniProt subcellular
      location line rests on an ARBA rule and is not used as evidence here.
    supported_by:
    - reference_id: file:PSEPK/cheY/cheY-deep-research-falcon.md
      supporting_text: >-
        Functionally, CheY is a **diffusible cytosolic** signal carrier between the
        receptor-associated kinase complex and the flagellar motor, acting at the
        **cytoplasmic face** of the motor’s C-ring/switch (via interaction with
        FliM and related switch components).
    - reference_id: PMID:40197389
      supporting_text: >-
        After CheY accepts the phosphate group from CheA, it binds FliM and FliN of
        the motor-switch complex, resulting in a switch in the flagellar rotational
        direction and bacteria tumbling
- term:
    id: GO:0000156
    label: phosphorelay response regulator activity
  evidence_type: IC
  original_reference_id: PMID:40197389
  qualifier: enables
  review:
    summary: >-
      Proposed molecular function. CheY is phosphorylated by CheA on its receiver
      aspartate and in that state regulates the flagellar switch, which is the
      definition of phosphorelay response regulator activity ("regulated by
      transfer of a phosphate from a histidine residue in the sensor, to an
      aspartate residue in the response regulator").
    action: NEW
    reason: >-
      GOA carries no molecular-function row for this protein. The activity is inferred by the
      curator from the P. putida CheA-to-CheY phosphotransfer assay together with the PROSITE
      REC domain and phosphoaspartate site; the cached text does not give the locus tag of the
      CheY used, so IC rather than IDA is used. This is the module-level activity of CheY in the
      chemotaxis signal transduction module. The official Supplementary file 1 was subsequently
      checked: it maps cheA to PP_4338 but supplies no CheY accession or CheY expression primer
      pair, so the target-specific evidence code is not upgraded.
    supported_by:
    - reference_id: PMID:40197389
      supporting_text: >-
        The addition of CheY to phosphorylated CheA led to a labeling of CheY and a
        reduction in the phospholabeling of CheA
