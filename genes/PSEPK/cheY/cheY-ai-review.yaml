  review:
    summary: >-
      CheY is the response regulator of the chemotaxis phosphorelay: it accepts
      the phosphoryl group from the histidine kinase CheA on its conserved
      aspartate. P. putida CheA transfers phosphate to CheY in vitro, and the
      protein carries the REC domain with the phosphoaccepting Asp52.
    action: ACCEPT
    reason: >-
      The GO:0000160 definition (histidine kinase autophosphorylation and transfer
      of the phosphate to an aspartate) describes the CheA-to-CheY step directly.
      The InterPro-based IEA is consistent with the domain architecture and with
      P. putida phosphotransfer data.
    supported_by:
    - reference_id: PMID:40197389
      supporting_text: >-
        The addition of CheY to phosphorylated CheA led to a labeling of CheY and a
        reduction in the phospholabeling of CheA (Figure 2—figure supplement 2a),
        indicating a phosphate transfer happened between CheA and CheY.
