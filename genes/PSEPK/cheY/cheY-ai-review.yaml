taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  CheY (PP_4340) is a chemotaxis response regulator of Pseudomonas putida KT2440. It is a small
  (124 aa) single-domain receiver protein of the CheY-like superfamily, consisting of one REC
  (response regulatory) domain with the conserved phosphoaccepting aspartate (Asp52) and a Mg2+
  cofactor site. The gene lies next to cheZ and cheA2 (PP_4338) in a cheYZA chemotaxis cluster.
  In the chemotaxis pathway, chemoreceptors control the histidine kinase CheA, which
  autophosphorylates and transfers the phosphoryl group to CheY; purified P. putida CheA
  phosphorylates CheY in vitro, and CheY is found associated with CheA in KT2440 cell extracts.
  Phosphorylated CheY diffuses through the cytoplasm to the flagellar motor, where it acts on
  the FliM-containing C-ring switch and changes the direction of flagellar rotation, so that
  receptor and kinase activity is converted into changes in swimming behaviour. Direct docking
  to KT2440 FliN has not been demonstrated. The phosphatase CheZ terminates the signal by
  accelerating CheY-P dephosphorylation.
