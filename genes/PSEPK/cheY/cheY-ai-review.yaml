- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IC
  original_reference_id: PMID:30761113
  qualifier: involved_in
  review:
    summary: >-
      Proposed process. PP_4340 is encoded in the same cluster as cheA2 (PP_4338),
      the CheA paralog that is required for chemotaxis in KT2440, and it is the
      phosphoacceptor of CheA in the chemotaxis phosphorelay.
    action: NEW
    reason: >-
      CheY performs a step of chemotaxis itself (it is the diffusible output that
      switches the motor), so this is participation rather than requirement. No
      KT2440 cheY mutant has been characterised, so the annotation is IC, inferred
      from the cheA2 mutant phenotype, gene neighbourhood and phosphotransfer
      data. Consistent with the chemotaxis annotation on CheA (PP_4338).
    supported_by:
    - reference_id: PMID:30761113
      supporting_text: >-
        mutation of cheA2 abolished chemotaxis, which is consistent with the notion
        the CheA2 forms part of the che chemotaxis pathway
    - reference_id: file:PSEPK/cheY/cheY-deep-research-falcon.md
      supporting_text: >-
        The same work groups PP_4340 within a proposed operon/gene block
        **PP4340–PP4338**, consistent with cheY being part of a chemotaxis/motility
        module under flagellar regulon control.
core_functions:
- description: >-
    Response regulator of the chemotaxis phosphorelay that accepts a phosphoryl group on its
    active-site aspartate (Asp52) from the histidine kinase CheA and, as CheY-P, signals to the
    flagellar motor switch to change rotation direction. The specific PP_4340 assignment is
    inferred from its receiver architecture and cheYZA neighborhood; the 2025 assay and
    supplement name CheY without an accession or listed CheY expression construct.
