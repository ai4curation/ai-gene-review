id: Q88R33
gene_symbol: PP_0301
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0301 encodes the predicted CdhB betainyl-CoA thioesterase of the
  L-carnitine catabolic locus. It is expected to hydrolyze betainyl-CoA to
  glycine betaine and free CoA after 3-dehydrocarnitine cleavage.
existing_annotations:
  - term:
      id: GO:0047617
      label: fatty acyl-CoA hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: The predicted substrate is betainyl-CoA, not a fatty acyl-CoA.
      action: MODIFY
      reason: >-
        PP_0301 is the conserved carnitine-locus ortholog of experimentally
        characterized P. aeruginosa CdhB Q9HTH9. That protein catalyzes
        RHEA:45716, hydrolysis of N,N,N-trimethylglycyl-CoA to glycine betaine
        and CoA. The family-derived fatty-acyl substrate label is misleading.
      proposed_replacement_terms:
        - id: GO:0016289
          label: acyl-CoA hydrolase activity
      supported_by:
        - reference_id: UniProtKB:Q9HTH9
          supporting_text: Catalyzes the cleavage of betainyl-CoA
        - reference_id: file:PSEPK/PP_0301/PP_0301-deep-research-openscientist.md
          supporting_text: PP_0301 is a HotDog-fold thioesterase, not a thiolase
        - reference_id: file:PSEPK/PP_0301/PP_0301-goa.tsv
          supporting_text: "GO:0047617\tfatty acyl-CoA hydrolase activity"
  - term:
      id: GO:0042413
      label: carnitine catabolic process
    evidence_type: ISS
    original_reference_id: PMID:19406895
    qualifier: involved_in
    review:
      summary: Conserved-locus evidence supports a role in carnitine catabolism.
      action: NEW
      reason: >-
        PP_0301 is the KT2440 ortholog of CdhB in the experimentally defined
        Pseudomonas carnitine-catabolism locus.
      supported_by:
        - reference_id: UniProtKB:Q9HTH9
          supporting_text: Is involved in a L-carnitine degradation pathway
references:
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: UniProtKB:Q9HTH9
    title: Reviewed Pseudomonas aeruginosa CdhB entry
    findings:
      - statement: Defines EC 3.1.2.33 and RHEA:45716 for betainyl-CoA hydrolysis.
  - id: PMID:24240508
    title: Revealing the hidden functional diversity of an enzyme family.
    findings:
      - statement: Provides experimental support for the CdhB reaction assigned to Q9HTH9.
  - id: PMID:19406895
    title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
    findings:
      - statement: Establishes the conserved locus as required for carnitine catabolism.
  - id: file:PSEPK/PP_0301/PP_0301-uniprot.txt
    title: UniProtKB record for PP_0301
    findings:
      - statement: Places Q88R33 in the conserved betainyl-CoA thioesterase family and KT2440 carnitine locus.
  - id: file:PSEPK/PP_0301/PP_0301-goa.tsv
    title: QuickGO annotations for PP_0301
    findings:
      - statement: Contains the single annotation reviewed here.
  - id: file:PSEPK/PP_0301/PP_0301-deep-research-openscientist.md
    title: OpenScientist deep research report for PP_0301
    findings:
      - statement: >-
          Supports the CdhB orthology, HotDog thioesterase fold, carnitine-locus
          context, and distinction from the legacy thiolase name.
core_functions:
  - description: Hydrolysis of betainyl-CoA to glycine betaine and CoA in L-carnitine catabolism.
    molecular_function:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    directly_involved_in:
      - id: GO:0042413
        label: carnitine catabolic process
    supported_by:
      - reference_id: UniProtKB:Q9HTH9
        supporting_text: Catalyzes the cleavage of betainyl-CoA
proposed_new_terms:
  - proposed_name: betainyl-CoA thioesterase activity
    proposed_definition: >-
      Catalysis of the reaction N,N,N-trimethylglycyl-CoA + water = glycine
      betaine + CoA + H+.
    justification: >-
      The exact EC 3.1.2.33/RHEA:45716 activity is experimentally established,
      but GO currently exposes only broader acyl-CoA hydrolase terms.
    proposed_parent:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    supported_by:
      - reference_id: UniProtKB:Q9HTH9
        supporting_text: Catalyzes the cleavage of betainyl-CoA
suggested_questions:
  - question: Does purified PP_0301 quantitatively reproduce the Q9HTH9 betainyl-CoA substrate specificity?
suggested_experiments:
  - description: Assay purified PP_0301 against betainyl-CoA and competing acyl-CoA substrates by LC-MS.
    experiment_type: in vitro enzyme assay
