proposed_new_terms:
  - proposed_name: betainyl-CoA thioesterase activity
    proposed_definition: >-
      Catalysis of the reaction: N,N,N-trimethylglycyl-CoA + H2O = glycine
      betaine + CoA + H+.
    justification: >-
      The exact EC 3.1.2.33/RHEA:45716 activity is experimentally established
      for orthologs, but GO exposes only broader acyl-CoA hydrolase terms.
    proposed_parent:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    supported_by:
