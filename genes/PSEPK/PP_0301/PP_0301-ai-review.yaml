id: Q88R33
gene_symbol: PP_0301
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_0301 encodes a 156-residue CdhB-type hotdog-fold acyl-CoA thioesterase in the 
  Pseudomonas putida KT2440 carnitine catabolic locus. Conserved sequence and locus context support 
  hydrolysis of betainyl-CoA to glycine betaine and free CoA, corresponding to the terminal reaction
  characterized for P. aeruginosa CdhB. PDB 2HLJ provides a structure of the KT2440 protein, but its
  betainyl-CoA specificity is inferred from the ortholog rather than established by that structure.
existing_annotations:
- term:
    id: GO:0047617
    label: fatty acyl-CoA hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002422169
  review:
    summary: TreeGrafter supplies the fatty-acyl claim; independent orthology and locus evidence 
      support acyl-CoA hydrolysis, while the secondary substrate range remains unresolved.
    action: MODIFY
    reason: PP_0301 is the carnitine-locus CdhB-type protein, with 57.862% global sequence identity 
      to P. aeruginosa CdhB and a verified KT2440 hotdog-fold structure (2HLJ). The 
      publication-linked CdhB reaction hydrolyzes betainyl-CoA to glycine betaine and CoA 
      (RHEA:45716), an acyl-CoA substrate outside the specific fatty-acyl claim. Retain the 
      supported acyl-CoA hydrolase chemistry; neither a generic hotdog fold nor a family name 
      establishes fatty-acyl specificity, and no exhaustive target substrate screen is claimed. The 
      MODIFY generalization represents supported target chemistry; it does not assert loss of all 
      secondary fatty-acyl activity or identify a phylogenetic pruning boundary.
    proposed_replacement_terms:
    - id: GO:0016289
      label: acyl-CoA hydrolase activity
    supported_by:
    - reference_id: file:PSEAE/cdhB/cdhB-uniprot.txt
