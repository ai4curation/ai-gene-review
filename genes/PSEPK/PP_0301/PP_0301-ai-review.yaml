      - source_id: PANTHER:PTN002422169
        source_label: TreeGrafter node in PTHR31793
        source_status: UNRESOLVED
        comment: The TreeGrafter source records the family transfer. Conserved locus and orthology 
          support the target CdhB-type reaction, but a betainyl substrate preference does not 
          demonstrate fatty-acyl loss across SF2 or establish a pruning point. No target-negative 
          substrate assay is available.
    source_defects:
