id: Q88R33
gene_symbol: PP_0301
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0301 encodes the CdhB-type betainyl-CoA thioesterase of the Pseudomonas
  putida KT2440 L-carnitine catabolic locus, a 156-residue hotdog-fold acyl-CoA
  thioesterase (PANTHER PTHR31793 subfamily SF2) whose fold is confirmed by a
  crystal structure. By orthology with characterized P. aeruginosa CdhB it
  hydrolyzes betainyl-CoA to glycine betaine and free CoA, the last step of
  carnitine catabolism. The legacy submitter name "betainyl-CoA thiolase" is a
  misnomer: the protein is a hydrolase. The KT2440 protein itself has not been
  assayed.
existing_annotations:
  - term:
      id: GO:0047617
      label: fatty acyl-CoA hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002422169
    review:
      summary: >-
        TreeGrafter transfer of fatty acyl-CoA hydrolase activity; the
        predicted substrate is betainyl-CoA, not a fatty acyl-CoA.
      action: MODIFY
      reason: >-
        PP_0301 is the conserved carnitine-locus ortholog of characterized P.
        aeruginosa CdhB, which hydrolyzes N,N,N-trimethylglycyl-CoA to glycine
        betaine and CoA (RHEA:45716). The thioesterase chemistry is right; the
        fatty-acyl substrate is not, so the row is generalized to the parent
        acyl-CoA hydrolase activity, as for the PAINT row on CdhB.
      proposed_replacement_terms:
        - id: GO:0016289
          label: acyl-CoA hydrolase activity
      supported_by:
        - reference_id: file:PSEAE/cdhB/cdhB-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: >-
            Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
            H(+);
        - reference_id: file:PSEPK/PP_0301/PP_0301-deep-research-openscientist.md
          supporting_text: PP_0301 is a HotDog-fold thioesterase, not a thiolase
      propagation_review:
        root_cause: PROPAGATION_BAD
        failure_modes:
          - FUNCTIONAL_DIVERGENCE
        source_entities:
          - source_id: PANTHER:PTN002422169
            source_label: TreeGrafter node in PTHR31793
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: >-
              The fatty-acyl substrate applies to FadM-type members but not to
              the betainyl-CoA thioesterase subfamily SF2 that contains PP_0301.
      source_defects:
        - defect_type: WRONG_TERM
          resource: GO_CENTRAL
          slot: GO ID
          requested_change: REPOINT
          asserted_value: GO:0047617
          corrected_value: GO:0016289
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            TreeGrafter grafts PP_0301 into PTHR31793 and inherits fatty acyl-CoA
            hydrolase activity placed by PAINT at a node that spans the
            betainyl-CoA thioesterase subfamily SF2; the term should be
            restricted to the fatty-acyl branch.
  - term:
      id: GO:0042413
      label: carnitine catabolic process
    evidence_type: ISS
    original_reference_id: PMID:19406895
    qualifier: involved_in
    review:
      summary: Orthology and conserved-locus evidence support a role in carnitine catabolism.
      action: NEW
      reason: >-
        PP_0301 is the KT2440 ortholog of CdhB, which performs the last step of
        carnitine breakdown in P. aeruginosa and whose disruption abolishes
        growth on carnitine.
      supported_by:
        - reference_id: file:PSEAE/cdhB/cdhB-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Is involved in a L-carnitine degradation pathway that allows
            P.aeruginosa to grow on L-carnitine as the sole source of carbon
            and nitrogen (PubMed:19406895).
        - reference_id: PMID:19406895
          supporting_text: >-
            The PA5388-PA5384 region contains the predicted P. aeruginosa
            carnitine dehydrogenase homologue along with other genes required for
            growth on carnitine.
