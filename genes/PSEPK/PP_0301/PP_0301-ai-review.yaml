        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
          H(+);
suggested_questions:
  - question: Does purified PP_0301 quantitatively reproduce the Q9HTH9 betainyl-CoA substrate specificity?
suggested_experiments:
  - description: Assay purified PP_0301 against betainyl-CoA and competing acyl-CoA substrates by LC-MS.
    experiment_type: in vitro enzyme assay
