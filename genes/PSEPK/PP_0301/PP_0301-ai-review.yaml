  review:
    summary: Orthology and conserved-locus evidence support a role in carnitine catabolism.
    action: NEW
    reason: PP_0301 is the KT2440 ortholog of CdhB, which performs the last step of carnitine 
      breakdown in P. aeruginosa and whose disruption abolishes growth on carnitine.
    supported_by:
    - reference_id: file:PSEAE/cdhB/cdhB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Is involved in a L-carnitine degradation pathway that allows P.aeruginosa to 
        grow on L-carnitine as the sole source of carbon and nitrogen (PubMed:19406895).
    - reference_id: PMID:19406895
      supporting_text: The PA5388-PA5384 region contains the predicted P. aeruginosa carnitine 
        dehydrogenase homologue along with other genes required for growth on carnitine.
