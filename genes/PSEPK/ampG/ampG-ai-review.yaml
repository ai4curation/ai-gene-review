id: Q88N61
gene_symbol: ampG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AmpG is a multispanning inner-membrane permease that imports soluble
  GlcNAc-1,6-anhydro-MurNAc muropeptides from the periplasm into the cytoplasm,
  enabling recovery of their amino-sugar and stem-peptide components during
  peptidoglycan turnover.
