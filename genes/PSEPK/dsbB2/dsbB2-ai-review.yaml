id: P59344
gene_symbol: dsbB2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Predicted second inner-membrane DsbB paralog that reoxidizes reduced DsbA and
  transfers reducing equivalents into the quinone pool, sustaining
  periplasmic disulfide-bond formation.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for this integral inner-membrane oxidoreductase.
    action: ACCEPT
    reason: UniProt describes DsbB2 as a multi-pass cell-inner-membrane protein.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DsbB2 is predicted to sustain oxidative folding by regenerating oxidized DsbA.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record states by similarity that DsbB2 is required
      for periplasmic disulfide formation and acts by oxidizing DsbA.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Quinone-linked electron transfer is the directionally unambiguous core activity of DsbB2.
    action: ACCEPT
    reason: >-
      DsbB2 is predicted to relay electrons from reduced DsbA through its
      membrane redox centers to quinone. Unlike GO:0015035, this term does not
      imply an unsupported reductase direction from its label.
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reversible protein-disulfide oxidoreductase definition is compatible with DsbA reoxidation but does not encode DsbB's physiological direction.
    action: KEEP_AS_NON_CORE
    reason: >-
      The official GO definition is "Catalysis of the reaction: a protein with
      reduced sulfide groups = a protein with oxidized disulfide bonds." The
      equality makes the term direction-neutral despite its reductase label;
      GO:0009055 better captures DsbB2's core electron-transfer role.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Correct but less precise than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: The generic membrane location is valid but redundant with plasma membrane.
references:
- id: file:PSEPK/dsbB2/dsbB2-uniprot.txt
  title: UniProtKB entry for Pseudomonas putida KT2440 dsbB2
  findings:
  - statement: UniProt states that DsbB2 is required for periplasmic disulfide formation and acts by oxidizing DsbA.
    supporting_text: Acts by oxidizing the DsbA protein (By similarity).
    reference_section_type: RESULTS
- id: PMID:9342327
  title: Respiratory chain is required to maintain oxidized states of the DsbA-DsbB disulfide bond formation system in aerobically growing Escherichia coli cells.
  findings:
  - statement: Primary in vivo work connects DsbB-dependent DsbA reoxidation to quinones and the respiratory electron-transfer chain.
    supporting_text: >-
      These results suggest that the respiratory electron transfer chain
      participates in the oxidation of DsbA, by acting primarily on DsbB.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed- and PMC-verified primary E. coli DsbA/DsbB study with cached full text.
- id: PMID:12853466
  title: Mechanism of the electron transfer catalyst DsbB from Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Purified-system experiments establish DsbB as an electron-transfer catalyst that oxidizes DsbA through ubiquinone.
    supporting_text: >-
      The membrane protein DsbB from Escherichia coli is essential for
      disulfide bond formation and catalyses the oxidation of the periplasmic
      dithiol oxidase DsbA by ubiquinone.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary mechanistic study; only the abstract is cached.
