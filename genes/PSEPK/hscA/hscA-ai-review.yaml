suggested_questions:
  - question: How strongly do Q88PK5 and Q88PK7 stimulate the Q88PK4 ATPase cycle?
suggested_experiments:
  - description: Reconstitute the Q88PK4-Q88PK5-Q88PK7 cycle and measure ATP turnover and cluster transfer to defined acceptors.
