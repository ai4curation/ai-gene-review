- id: PMID:22782893
  title: Specialized Hsp70 chaperone (HscA) binds preferentially to the disordered form, whereas J-protein
    (HscB) binds preferentially to the structured form of the iron-sulfur cluster scaffold protein (IscU).
  findings:
  - statement: E. coli HscA stabilizes disordered IscU and acts as a holdase in the studied conformational
      cycle.
    supporting_text: HscA decreases the D → S rate and binds to and stabilizes the disordered state of
      IscU
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text E. coli study. This supports the measured specialized mechanism, not universal
      absence of all folding activity or a direct Q88PK4 assay.
core_functions:
- description: HscB-stimulated ATP hydrolysis coupled to IscU scaffold binding and cluster transfer, inferred
    from the curated target HscA function and specialized homolog mechanism.
