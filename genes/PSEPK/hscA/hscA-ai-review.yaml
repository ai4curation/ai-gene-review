core_functions:
- description: HscB-stimulated ATP hydrolysis coupled to IscU scaffold binding and cluster transfer, inferred
    from the curated target HscA function and specialized homolog mechanism.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
