id: Q88PK4
gene_symbol: hscA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HscA (PP_0846) is the specialized Hsp70-family ATPase of the Pseudomonas putida KT2440 Isc
  system. Its ATPase cycle is stimulated by HscB and is coupled to IscU-dependent iron-sulfur cluster
  transfer. The conserved mechanism involves nucleotide-dependent scaffold binding and release; homolog
  studies distinguish this specialized cycle from generic refolding of damaged proteins.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP binding is integral to the scaffold-transfer cycle.
    action: ACCEPT
    reason: ATP binding is required for the HscA nucleotide cycle and is distinct from hydrolysis. It
      is a core mechanistic property, not peripheral merely because a catalytic term is more informative.
      Target curated HscA activity supports the conserved binding claim.
    supported_by:
    - &id001
      reference_id: file:PSEPK/hscA/hscA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Has a low intrinsic ATPase activity which is markedly stimulated by HscB.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: IscU transfer activity does not alone establish or exclude protein folding.
    action: UNDECIDED
    reason: GO0006457 requires assistance toward correct tertiary structure. E. coli HscA stabilizes disordered
      IscU in PMID22782893, and PMID9852006 additionally reports model-client antiaggregation but failed
      luciferase reactivation. These target-homolog results caution against assuming folding from Hsp70
      membership; they are not a negative assay of KT2440 Q88PK4. Whether this protein assists a folding
      endpoint remains genuinely unresolved, so UNDECIDED is retained without implying a demonstrated
      target loss or settled overannotation. The ATPase and scaffold-transfer core remains supported independently.
    supported_by:
    - reference_id: PMID:9852006
      supporting_text: Hsc66 suppressed aggregation of rhodanese and citrate synthase
    - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/ecoli-psepk-consultation/evidence.md
      supporting_text: Hsc66 was also unable to assist refolding of denatured luciferase
    - reference_id: PMID:22782893
      supporting_text: Our finding that HscA decreases the D → S rate and binds to and stabilizes the
        disordered state of IscU implies that it acts as a holdase
- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: HscA supplies ATP-dependent assistance to the cluster-transfer stage.
    action: ACCEPT
    reason: Curated target maturation function and HscA-specific signatures support this role. Homolog
      ATPase-defective mutant experiments show dependence of cluster transfer on the nucleotide cycle;
      they are not KT2440 mutant assays.
    supported_by:
    - reference_id: file:PSEPK/hscA/hscA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Chaperone involved in the maturation of iron-sulfur cluster-containing proteins.
    - reference_id: PMID:18986169
      supporting_text: A mutant form of HscA lacking ATPase activity, HscA(T212V), was unable to accelerate
        cluster transfer
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP hydrolysis is the supported catalytic activity.
    action: ACCEPT
    reason: Hydrolysis drives the specialized scaffold-transfer cycle. The target HAMAP activity and the
      homolog ATPase-defective mutant support a core ATPase assignment; no generic foldase activity is
      needed to make the catalytic claim.
    supported_by:
    - *id001
    - reference_id: PMID:18986169
      supporting_text: A mutant form of HscA lacking ATPase activity, HscA(T212V), was unable to accelerate
        cluster transfer
- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: ISS
  original_reference_id: file:PSEPK/hscA/hscA-uniprot.txt
  qualifier: enables
  review:
    summary: Historical folding-chaperone proposal retained but retired.
    action: NEW
    reason: 'Withdraw this inherited proposal from active use: GO0140662 requires ATP-driven assistance
      to protein folding, whereas the reviewed evidence establishes specialized IscU-state selection and
      cluster transfer. PMID22782893 finds stabilization of disordered IscU, not a target folding endpoint.
      This is insufficient precision for an active NEW assertion, not proof that HscA can never assist
      any folding reaction. The original ISS/file payload and row order are preserved; existing GO0016887
      supplies the supported catalytic core.'
    supported_by:
    - *id001
    - reference_id: PMID:22782893
  retired: true
