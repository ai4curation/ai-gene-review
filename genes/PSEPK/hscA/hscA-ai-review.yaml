- id: PMID:22782893
  title: Specialized Hsp70 chaperone (HscA) binds preferentially to the disordered form, whereas J-protein
    (HscB) binds preferentially to the structured form of the iron-sulfur cluster scaffold protein (IscU).
  findings:
  - statement: E. coli HscA stabilizes disordered IscU and acts as a holdase in the studied conformational
      cycle.
    supporting_text: HscA decreases the D → S rate and binds to and stabilizes the disordered state of
      IscU
  reference_review:
