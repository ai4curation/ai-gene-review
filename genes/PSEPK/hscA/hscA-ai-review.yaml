id: Q88PK4
gene_symbol: hscA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: HscA (PP_0846) is the dedicated Hsp70-family ATPase of the bacterial Isc system. With HscB it remodels cluster-bearing IscU in an ATP-dependent cycle that promotes release and transfer of newly assembled iron-sulfur clusters.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP binding is required for the HscA chaperone cycle.
      action: KEEP_AS_NON_CORE
      reason: This is valid but less informative than ATP hydrolysis activity.
  - term:
      id: GO:0006457
      label: protein folding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Generic protein folding overstates the biological scope of HscA.
      action: MARK_AS_OVER_ANNOTATED
      reason: HscA is specialized for IscU remodeling and Fe-S cluster transfer rather than broad client-protein folding.
  - term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: ATP-dependent IscU remodeling contributes directly to Fe-S cluster assembly and transfer.
      action: ACCEPT
      reason: Reviewed HAMAP and the HscA-specific InterPro assignment establish the dedicated Isc-system role.
      supported_by:
        - reference_id: file:PSEPK/hscA/hscA-uniprot.txt
          supporting_text: DR   InterPro; IPR010236; ISC_FeS_clus_asmbl_HscA.
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: ATP hydrolysis drives the HscA scaffold-remodeling cycle.
      action: ACCEPT
      reason: Q88PK4 is a reviewed HscA-family ATPase with the conserved Hsp70 nucleotide-binding machinery.
