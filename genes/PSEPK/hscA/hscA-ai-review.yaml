    supporting_text: A mutant form of HscA lacking ATPase activity, HscA(T212V), was unable to accelerate
      cluster transfer
  knowledge_gaps:
  - gap_statement: Q88PK4 ATPase stimulation and transfer efficiency have not been measured with the KT2440
      partners.
    significance: Family evidence supports the mechanism, but the organism-specific kinetics remain unknown.
  - gap_statement: Whether Q88PK4 assists a protein-folding endpoint beyond nucleotide-dependent IscU
      cluster transfer is unresolved.
    significance: Conformational state selection and cluster release do not by themselves establish ATP-dependent
      protein folding chaperone activity.
