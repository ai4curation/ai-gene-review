id: Q88QH4
gene_symbol: thiL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  thiL (PP_0519) encodes thiamine-monophosphate kinase (EC 2.7.4.16) of Pseudomonas putida
  KT2440, a 322-residue member of the PurM-like ATP-binding superfamily with N- and
  C-terminal PurM-like domains (PANTHER PTHR30270:SF0, HAMAP MF_02128, NCBIfam TIGR01379,
  PIRSF005303). It catalyses the ATP-dependent phosphorylation of thiamine monophosphate
  (TMP), the product of thiamine-phosphate synthase ThiE, to thiamine diphosphate (TPP),
  the active cofactor form of vitamin B1; this is the last step of bacterial de novo TPP
  synthesis. Structures of ThiL homologs show a homodimer that binds ATP and TMP in a cleft
  with several Mg2+ ions and transfers the gamma-phosphate directly in line, without a
  phosphoenzyme intermediate. The enzyme is cytoplasmic. Its function is inferred from
  family membership; the KT2440 protein has not been characterised experimentally.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000160002
  review:
    summary: >-
      UniRule (HAMAP MF_02128) transfer of magnesium ion binding. ThiL structures show
      several Mg2+ ions bridging the phosphates of ATP and TMP in the active site.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct: the HAMAP rule places multiple Mg2+ ligands in Q88QH4 (e.g. residues 30, 47,
      75), and homolog structures show the metal environment of the bound substrates. Metal
      binding is a cofactor property of the TMP kinase activity rather than a separate
      function, so it is kept as non-core, matching the treatment of cofactor-binding rows
      for THI6 and THI80 (the earlier M. jannaschii thiL review accepted it).
    supported_by:
    - reference_id: PMID:30867460
      supporting_text: >-
        High resolution of the data and
        anomalous diffraction allows for a detailed description of the binding mode of
        substrates and products, and their metal environment.
    - reference_id: file:PSEPK/thiL/thiL-uniprot.txt
      supporting_text: FT                   /ligand="Mg(2+)"
- term:
    id: GO:0005524
    label: ATP binding
