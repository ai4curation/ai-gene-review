- term:
    id: GO:0009030
    label: thiamine-phosphate kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006283
  - RHEA:15913
  - EC:2.7.4.16
  - UniRule:UR000160002
  review:
    summary: >-
      Combined IEA (InterPro IPR006283, RHEA:15913, EC 2.7.4.16, HAMAP MF_02128) for
      thiamine-phosphate kinase activity: TMP + ATP -> TPP + ADP. This is the defining
      activity of the ThiL family.
    action: ACCEPT
    reason: >-
      Core function. Q88QH4 matches every ThiL family signature (HAMAP MF_02128, TIGR01379,
      PIRSF005303, CDD cd02194, PANTHER PTHR30270:SF0, the subfamily of E. coli ThiL).
      E. coli thiL mutants lack TMP kinase activity and require TPP itself, and the
      activity and in-line mechanism are established structurally for the A. aeolicus and
      A. baumannii orthologs. The HAMAP caution that some residues needed to propagate
      feature annotation are not conserved concerns feature transfer; most binding
      positions are still assigned and the family-level evidence for the activity holds.
    supported_by:
    - reference_id: file:PSEPK/thiL/thiL-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Catalyzes the ATP-dependent phosphorylation of thiamine-'
    - reference_id: PMID:6284709
      supporting_text: >-
        the former lacks thiamine kinase activity, and the latter
        lacks thiamine monophosphate kinase activity
    - reference_id: PMID:18311927
      supporting_text: >-
        Thiamin monophosphate kinase (ThiL) catalyzes the ATP-dependent phosphorylation
        of thiamin monophosphate (TMP) to form thiamin pyrophosphate (TPP), the active
        form of vitamin B 1.
- term:
    id: GO:0009228
    label: thiamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006283
  review:
    summary: >-
      InterPro2GO mapping from IPR006283 (ThiL-like) to thiamine biosynthetic process.
      ThiL acts after the thiamine skeleton has been made (as TMP by ThiE): it converts TMP
      to the diphosphate cofactor.
    action: KEEP_AS_NON_CORE
    reason: >-
      ThiL is a step of the overall de novo thiamine cofactor pathway, so the mapping is
      not wrong, but the step it performs is the formation of thiamine diphosphate, which
      GO:0009229 (already carried) describes. GO:0009229 is not an is_a or part_of
      descendant of GO:0009228, so MODIFY to it would be lateral; the row is kept as
      non-core, consistent with the M. jannaschii thiL review.
    supported_by:
    - reference_id: PMID:8432721
      supporting_text: >-
        Two precursors [4-methyl-5-(beta-hydroxyethyl)thiazole monophosphate and
        4-amino-5-hydroxymethyl-2-methylpyrimidine pyrophosphate] are coupled to form
        thiamine monophosphate, which is then phosphorylated to make thiamine
        pyrophosphate.
- term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000160002
  - UniPathway:UPA00060
  review:
    summary: >-
      HAMAP/UniPathway assignment (UPA00060, thiamine diphosphate from thiamine phosphate,
      step 1/1). ThiL catalyses the single step that makes TPP from TMP.
    action: ACCEPT
    reason: >-
      The most specific and accurate process for ThiL: its product is thiamine diphosphate,
      and it performs the final step of the pathway.
    supported_by:
    - reference_id: PMID:30867460
      supporting_text: >-
        Thiamine monophosphate kinase (ThiL) catalyzes the last step of thiamine
        pyrophosphate (TPP) synthesis, the ATP-dependent phosphorylation of
        thiamine monophosphate (TMP) to thiamine pyrophosphate.
    - reference_id: file:PSEPK/thiL/thiL-uniprot.txt
      supporting_text: 'thiamine diphosphate from thiamine phosphate: step 1/1.'
