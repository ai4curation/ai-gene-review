suggested_questions:
- question: >-
    Is PP_0519 the only route to TPP in KT2440, or can exogenous thiamine be converted to
    TPP by a thiamine pyrophosphokinase-independent route (e.g. ThiK plus ThiL)?
suggested_experiments:
- description: >-
    Construct a PP_0519 deletion and test growth on minimal medium supplemented with
    thiamine, TMP or TPP; assay recombinant Q88QH4 for ATP-dependent TMP to TPP conversion.
  hypothesis: >-
    A thiL mutant requires TPP (not thiamine or TMP), and the recombinant protein is an
    ATP-dependent TMP kinase.
