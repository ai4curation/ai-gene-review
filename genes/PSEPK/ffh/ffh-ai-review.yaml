- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Core molecular function. The central G domain of Ffh is a GTPase (EC
      3.6.5.4; UniProt catalytic activity GTP + H2O = GDP + phosphate). GTP hydrolysis
      by Ffh, stimulated reciprocally by the receptor FtsY, drives the targeting reaction.
      Supported by the SRP_G CDD (cd18539), the SRP54 GTPase domain (IPR000897) and
      conserved GTP-binding motifs.
    action: ACCEPT
    reason: UniProt assigns EC 3.6.5.4 and the exact GTP hydrolysis reaction to Ffh;
      this catalytic activity drives the Ffh-FtsY targeting cycle.
    supported_by:
    - reference_id: UniProt:Q88MV7
