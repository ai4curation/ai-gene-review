  review:
    summary: Correct cellular component. UniProt assigns Ffh to the cytoplasm; the
      SRP-RNC complex it forms is subsequently targeted to the inner face of the cytoplasmic
      membrane. Consistent with the soluble cytoplasmic nature of SRP.
    action: ACCEPT
    reason: UniProt explicitly places soluble Ffh in the cytoplasm; transient targeting
      of the SRP-RNC complex to the membrane does not make Ffh an integral membrane
      protein.
