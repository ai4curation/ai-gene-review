suggested_questions:
- question: Is ffh essential in Pseudomonas putida KT2440, and which membrane-protein classes are most sensitive to reduced Ffh abundance?
suggested_experiments:
- description: Use inducible depletion or CRISPRi of ffh in KT2440 with membrane-proteome and nascent-chain targeting readouts to test essentiality and substrate dependence.
  experiment_type: conditional genetics and membrane proteomics
