    label: transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      A broad transaminase activity is supported by the class III
      aminotransferase fold, conserved family assignments, and the submitted
      UniProt product name.
    action: ACCEPT
    reason: >-
      IPR004637, TIGR00709, and PANTHER PTHR43552:SF2 predict a
      diaminobutyrate-type transaminase, but no direct PP_2800 assay establishes
      its preferred in-vivo substrate. KT2440 lacks the downstream ectoine
      enzymes EctA/EctC/EctD, and PP_2800 lies in a GABA/diamine-metabolism
      neighborhood rather than the pyoverdine locus. Retain the experimentally
      safer broad activity until its physiological reaction is resolved.
    supported_by:
