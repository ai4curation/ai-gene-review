  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_2800 encodes a predicted class III pyridoxal-phosphate-dependent
  aminotransferase. Sequence-family assignments are consistent with a
  diaminobutyrate:2-oxoglutarate-type enzyme, but PP_2800 has not been
  characterized experimentally and its preferred physiological substrate and
  pathway remain unresolved. The canonical ectoine interpretation is not
  supported by the KT2440 pathway inventory, which lacks the downstream EctA,
  EctC, and EctD enzymes; PP_2800 instead lies in a GABA/diamine-metabolism
  neighborhood. It is distinct from the close PvdH ortholog PP_4223 that lies
  in the KT2440 pyoverdine biosynthetic locus.
