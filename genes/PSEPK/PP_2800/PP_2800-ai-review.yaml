suggested_questions:
- question: >-
    What is the preferred physiological amino donor and acceptor of PP_2800,
    and what C4 amino-compound pathway recruits it in KT2440?
suggested_experiments:
- hypothesis: >-
    PP_2800 is a C4 omega-amino-compound aminotransferase with substrate
    preferences distinct from the pyoverdine enzyme PvdH.
  description: >-
    Compare purified PP_2800 and PvdH kinetics across
    L-aspartate-4-semialdehyde, L-2,4-diaminobutyrate, GABA, glutamate, and
    2-oxoglutarate, and pair the assay with targeted metabolomics of a clean
    PP_2800 deletion.
  experiment_type: comparative enzymology and metabolomics
