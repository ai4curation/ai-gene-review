id: Q88PA2
gene_symbol: ptsH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PtsH/PP_0948 is the NPr phosphocarrier of the nitrogen-regulatory
  phosphotransferase system in Pseudomonas putida KT2440, historically called
  ptsO in the experimental literature. It relays phosphate from PtsP enzyme
  I(Ntr) to the terminal EIIA(Ntr) regulator PtsN. Under fructose-growth
  conditions, FruB provides an alternative phosphate input into the NPr/PtsN
  branch.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: NPr/PtsH is a soluble phosphocarrier in the PTS(Ntr) relay.
    action: ACCEPT
    reason: UniProt assigns cytoplasmic localization and the protein lacks membrane-spanning segments.
- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: NPr/PtsH participates in a regulatory phosphorelay, not sugar transport or phosphorylation.
    action: REMOVE
    reason: PMID:18296519 explicitly describes the PtsP-PtsO-PtsN branch as unrelated to sugar traffic.
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: NPr is reversibly phosphorylated and transfers phosphate but is not an independent protein kinase.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic kinase term obscures the carrier role established for PtsO/NPr.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: NPr transfers phosphate between PtsP and PtsN.
    action: KEEP_AS_NON_CORE
    reason: The term is correct but too broad for the experimentally defined phosphocarrier role.
- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: TAS
  original_reference_id: PMID:18296519
  qualifier: involved_in
  review:
    summary: NPr is the intermediate phosphocarrier in the PtsP-to-PtsN protein phosphorelay.
    action: NEW
    reason: >-
      In vivo phosphorylation-state analysis places NPr between PtsP and PtsN,
      directly supporting participation in protein phosphorylation.
    supported_by:
      - reference_id: PMID:18296519
        supporting_text: >-
          Our results show that the source of phosphate available to the system is PEP and that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr to EIIA(Ntr).
- term:
    id: GO:0016772
    label: transferase activity, transferring phosphorus-containing groups
  evidence_type: TAS
  original_reference_id: PMID:18296519
  qualifier: enables
  review:
    summary: NPr directly transfers phosphate between PtsP and PtsN.
    action: NEW
    reason: >-
      The experimentally established relay order identifies PP_0948 as the
      intermediate phosphocarrier and therefore supports this phosphotransfer
      molecular function without implying sugar phosphorylation.
    supported_by:
      - reference_id: PMID:18296519
        supporting_text: >-
          Our results show that the source of phosphate available to the system is PEP and that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr to EIIA(Ntr).
