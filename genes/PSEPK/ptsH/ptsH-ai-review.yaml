suggested_questions:
- question: Why does the current UniProt record use ptsH while KT2440 experimental studies use ptsO/NPr?
suggested_experiments:
- description: Quantify direct phosphotransfer rates from PtsP and FruB to PP_0948 and from PP_0948 to
    PtsN under matched metabolite conditions.
  experiment_type: PTS(Ntr) phosphocarrier specificity
proposed_new_terms:
- proposed_name: PTS histidyl phosphocarrier activity
  proposed_definition: Accepting a phosphoryl group on an active-site histidine from a phosphoenolpyruvate-dependent
    enzyme I-type protein and transferring it to the histidine of an EIIA-type domain, as performed by
    HPr-family phosphocarriers of the phosphoenolpyruvate-dependent phosphotransferase system, including
    the NPr carrier of the nitrogen-regulatory branch.
  justification: GO has no molecular-function term for the HPr/NPr phosphocarrier step; the generic GO:0016775
    (phosphotransferase activity, nitrogenous group as acceptor) is used as a stand-in. A dedicated term
    would let HPr and NPr carry an informative activity without implying sugar transport.
  proposed_parent:
