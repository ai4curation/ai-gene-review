    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: NPr/PtsH participates in a regulatory phosphorelay, not sugar transport or phosphorylation.
    action: REMOVE
    reason: GO:0009401 is the coupled uptake and phosphorylation of carbohydrate. PMID:18296519 explicitly
      describes the PtsP-PtsO-PtsN branch as unrelated to sugar traffic; KT2440 fructose uptake uses FruB
      (EI-HPr-EIIA fusion) with FruA. The UniRule assigns the generic HPr sugar-PTS process to the NPr
      paralogue.
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: comprise a branch of the system unrelated to sugar traffic but thought to have
        an influence on coordination of N and C metabolism
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000415716
      requested_change: CHECK
      asserted_value: GO:0009401
      confidence: PROBABLE
      explanation: UniRule UR000415716 transfers the sugar PTS process to PP_0948, the NPr (ptsO) phosphocarrier
        of the regulatory PTS(Ntr) of P. putida KT2440, which is experimentally placed between PtsP and
        PtsN and is unrelated to sugar traffic (PMID:18296519). NPr members (NCBIfam NF008146 npr; rpoN-operon
        ptsO) should be excluded.
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: NPr transfers phosphate from its histidine to the PtsN histidine; the generic kinase term
      is refined.
    action: MODIFY
    reason: Kinase activity (phosphate transfer, usually from ATP) is a loose description of a PTS phosphocarrier,
      which takes the phosphoryl group from phospho-PtsP and donates it to the PtsN histidine. The nitrogenous-acceptor
      phosphotransferase term GO:0016775 states the step accurately without implying ATP use.
    proposed_replacement_terms: &id001
    - id: GO:0016775
      label: phosphotransferase activity, nitrogenous group as acceptor
    supported_by:
    - reference_id: PMID:18296519
      supporting_text: Our results show that the source of phosphate available to the system is PEP and
        that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to
        NPr to EIIA(Ntr).
    - reference_id: file:PSEPK/ptsH/ptsH-uniprot.txt
      record_section:
      - DR:PROSITE
      supporting_text: DR   PROSITE; PS00369; PTS_HPR_HIS; 1.
