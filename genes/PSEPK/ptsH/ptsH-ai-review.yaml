taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PtsH/PP_0948 is the NPr phosphocarrier of the nitrogen-regulatory phosphotransferase system
  in Pseudomonas putida KT2440, historically called ptsO in the experimental literature. It relays phosphate
  from PtsP enzyme I(Ntr) to the terminal EIIA(Ntr) regulator PtsN. Under fructose-growth conditions,
  FruB provides an alternative phosphate input into the NPr/PtsN branch.
