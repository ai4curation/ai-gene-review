  evidence_type: IMP
  original_reference_id: PMID:18296519
  qualifier: involved_in
  review:
    summary: NPr is the intermediate phosphocarrier in the PtsP-to-PtsN protein phosphorelay.
    action: NEW
    reason: 'In vivo phosphorylation-state analysis places NPr between PtsP and PtsN, directly supporting
      participation in protein phosphorylation. Evidence code IMP: PMID:18296519 inferred the relay by
      monitoring the in vivo phosphorylation state of PtsN in ptsP, ptsO and fruB mutant backgrounds.'
    supported_by:
