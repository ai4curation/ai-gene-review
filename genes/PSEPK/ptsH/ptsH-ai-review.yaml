- id: PMID:18296519
  title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of
    the carbohydrate phosphotransferase system of Pseudomonas putida.
  findings:
  - statement: Native KT2440 genetic and in vivo PtsN phosphorylation-state analysis establishes the principal
      PEP–PtsP–NPr–PtsN relay; this is not a purified-protein kinetic measurement.
    supporting_text: Our results show that the source of phosphate available to the system is PEP and
      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr
      to EIIA(Ntr).
  - statement: The nitrogen-regulatory branch is distinct from carbohydrate transport.
    supporting_text: comprise a branch of the system unrelated to sugar traffic
  - statement: Fructose supplies a conditional FruB bypass, so PtsP is not universally required for PtsN
      phosphorylation.
    supporting_text: EIIA(Ntr) can be phosphorylated in a ptsP strain but not in a ptsP fruB double mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The canonical cache contains the abstract and Discussion. Native genetic/phosphorylation-state
      evidence supports relay order and conditional FruB cross-talk; comparative E. coli in vitro results
      in the Discussion are not KT2440 purified-protein experiments. The separately archived complete
      PMC article was also inspected: native means MAD2, a KT2440 derivative, with plasmid-expressed E-tagged
      PtsN and nonpolar PTS mutants; it is not unmodified wild-type protein tracking.'
