aliases:
  - PP_0948
  - ptsO
core_functions:
  - description: >-
      Relays phosphate from PtsP enzyme I(Ntr) to the terminal PtsN EIIA(Ntr)
      regulator.
    supported_by:
      - reference_id: PMID:18296519
        supporting_text: >-
          Our results show that the source of phosphate available to the system is PEP and that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr to EIIA(Ntr).
    contributes_to_molecular_function:
      id: GO:0016772
      label: transferase activity, transferring phosphorus-containing groups
    locations:
      - id: GO:0005737
        label: cytoplasm
suggested_questions:
  - question: Why does the current UniProt record use ptsH while KT2440 experimental studies use ptsO/NPr?
suggested_experiments:
  - description: >-
      Quantify direct phosphotransfer rates from PtsP and FruB to PP_0948 and
      from PP_0948 to PtsN under matched metabolite conditions.
    experiment_type: PTS(Ntr) phosphocarrier specificity
