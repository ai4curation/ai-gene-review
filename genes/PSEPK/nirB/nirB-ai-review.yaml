id: Q88M69
gene_symbol: nirB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  NirB (PP_1705) is the catalytic large subunit of the assimilatory
  NAD(P)H-dependent nitrite reductase of Pseudomonas putida KT2440. It contains
  the FAD/NAD(P)-binding, iron-sulfur, and siroheme catalytic machinery needed
  for six-electron reduction of nitrite to ammonium and acts with the adjacent
  Rieske small subunit NirD. The reaction supplies reduced nitrogen for
  downstream ammonium assimilation.
existing_annotations:
  - term:
      id: GO:0008942
      label: nitrite reductase [NAD(P)H] activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: This term exactly captures the assigned NirB catalytic reaction.
      action: ACCEPT
      reason: Q88M69 carries EC 1.7.1.4, the NirB-specific domains, siroheme, FAD, and iron-sulfur cofactors.
      supported_by:
        - reference_id: file:PSEPK/nirB/nirB-uniprot.txt
          supporting_text: "DE            EC=1.7.1.4"
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The broad parent is redundant with the substrate-specific nitrite-reductase term.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0020037
      label: heme binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NirB binds the specialized heme cofactor siroheme.
      action: ACCEPT
      reason: UniProt identifies one siroheme per subunit and its axial ligand in the catalytic domain.
      supported_by:
        - reference_id: file:PSEPK/nirB/nirB-uniprot.txt
          supporting_text: "Name=siroheme; Xref=ChEBI:CHEBI:60052;"
  - term:
      id: GO:0042128
      label: nitrate assimilation
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Reduction of nitrite to ammonium is the second reductive step of nitrate assimilation.
      action: ACCEPT
      reason: The pathway assignment and adjacency to the candidate nitrate reductase place NirB in assimilatory nitrate use.
      supported_by:
        - reference_id: file:PSEPK/nirB/nirB-uniprot.txt
          supporting_text: "PATHWAY: Nitrogen metabolism; nitrate reduction (assimilation)."
  - term:
      id: GO:0050660
      label: flavin adenine dinucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The N-terminal reductase region is a conserved FAD-binding module.
      action: ACCEPT
      reason: UniProt assigns FAD and identifies the FAD/NAD(P)-binding domain.
      supported_by:
        - reference_id: file:PSEPK/nirB/nirB-uniprot.txt
          supporting_text: '/note="FAD/NAD(P)-binding"'
  - term:
      id: GO:0050661
      label: NADP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Pyridine-nucleotide binding is expected, but NADP specificity is not established for Q88M69.
      action: UNDECIDED
      reason: >-
        The imported catalytic term and product name allow NADH or NADPH, while
        this electronic annotation specifies NADP. Direct donor-specificity
        measurements are unavailable.
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: NirB contains conserved 2Fe-2S and 4Fe-4S centers.
      action: ACCEPT
      reason: UniProt assigns both cluster types and maps the 4Fe-4S ligands.
      supported_by:
        - reference_id: file:PSEPK/nirB/nirB-uniprot.txt
          supporting_text: "Binds 1 [4Fe-4S] cluster per subunit."
  - term:
      id: GO:0098809
      label: nitrite reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but less informative than the NAD(P)H-specific activity.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0009344
      label: nitrite reductase complex [NAD(P)H]
    evidence_type: ISS
    original_reference_id: PMID:32523942
    qualifier: part_of
    review:
      summary: NirB is the catalytic large subunit of the two-subunit NirBD complex.
      action: NEW
      reason: KT2440 literature explicitly assigns PP_1705 and PP_1706 to the assimilatory nitrite reductase.
      supported_by:
        - reference_id: PMID:32523942
          supporting_text: "nirBD (PP_1705, PP_1706)"
