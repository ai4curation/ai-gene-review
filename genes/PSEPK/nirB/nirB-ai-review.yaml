taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NirB (PP_1705) is the catalytic large component of the NirBD assimilatory nitrite reductase
  in Pseudomonas putida KT2440. Its FAD/NAD(P)-binding region, iron-sulfur domains, and siroheme
  center support six-electron reduction of nitrite to ammonium. It acts with the neighboring accessory
  subunit NirD to supply reduced nitrogen for ammonium assimilation. The physiological preference
  for NADH or NADPH remains unresolved.
