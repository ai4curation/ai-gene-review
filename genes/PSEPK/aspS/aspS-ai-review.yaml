  findings:
  - statement: Native PAO1 uses direct GlnRS and indirect Asn formation; its GatABC also transamidates
      supplied heterologous Glu-tRNA(Gln) in vitro. Do not infer native KT2440 Gln-transamidation flux
      from that capacity.
    supporting_text: The heterotrimeric AdT of P. aeruginosa has no Glu-tRNA Gln substrate in its host,
      but it can transamidate heterologous Glu-tRNA Gln .
