taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AspS is a non-discriminating aspartyl-tRNA synthetase that attaches aspartate to both tRNA(Asp)
  and tRNA(Asn). Asp-tRNA(Asp) supplies translation directly, whereas Asp-tRNA(Asn) is the substrate for
  GatABC-dependent conversion to Asn-tRNA(Asn). The enzyme activates aspartate with ATP before transfer
  to tRNA.
