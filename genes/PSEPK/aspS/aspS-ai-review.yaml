taxon: {id: "NCBITaxon:160488", label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: AspS is the cytoplasmic non-discriminating aspartyl-tRNA synthetase of Pseudomonas putida KT2440. It uses ATP to attach L-aspartate both to tRNA(Asp), producing Asp-tRNA(Asp) for translation, and to tRNA(Asn), producing Asp-tRNA(Asn), the precursor used by the indirect route to Asn-tRNA(Asn). These assignments are based on a conserved-family HAMAP rule rather than direct KT2440 assays.
