  knowledge_gaps:
  - gap_statement: >-
      Direct biochemical activity and the relative in-vivo contributions of
      Q88DZ1 and Q88GQ4 have not been measured in KT2440.
    significance: >-
      Q88DZ1 is a strong type-II PssA candidate, but the module does not assign
      it dominant pathway flux.
suggested_questions:
- question: >-
    Do Q88DZ1 and Q88GQ4 contribute redundantly or under different growth
    conditions to phosphatidylserine production?
  experts:
  - bacterial lipid biochemist
  - Pseudomonas physiologist
suggested_experiments:
- description: >-
    Compare single and double deletion strains for phosphatidylserine-synthase
    activity, phosphatidylserine and phosphatidylethanolamine lipid abundance,
    and complementation by each candidate.
  hypothesis: >-
    Q88DZ1 and Q88GQ4 both catalyze phosphatidylserine formation but differ in
    their relative physiological contribution or condition dependence.
