  - Pseudomonas physiologist
suggested_experiments:
- description: >-
    Compare single and double deletion strains for phosphatidylserine-synthase
    activity, phosphatidylserine and phosphatidylethanolamine lipid abundance,
    and complementation by each candidate.
  hypothesis: >-
    Q88DZ1 and Q88GQ4 both catalyze phosphatidylserine formation but differ in
    their relative physiological contribution or condition dependence.
