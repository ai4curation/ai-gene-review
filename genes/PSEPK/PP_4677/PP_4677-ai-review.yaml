id: Q88DZ1
gene_symbol: PP_4677
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_4677 encodes a predicted integral-membrane CDP-diacylglycerol--serine
  O-phosphatidyltransferase. The eight-pass enzyme represents the type-II PssA
  architecture and is predicted to transfer the phosphatidyl group of
  CDP-diacylglycerol to L-serine, forming phosphatidylserine for subsequent
  decarboxylation to phosphatidylethanolamine by Psd.
existing_annotations:
- term:
    id: GO:0003882
    label: CDP-diacylglycerol-serine O-phosphatidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      The EC 2.7.8.8 reaction, IPR004533 assignment, and specific
      PTHR14269:SF61 subfamily all identify a type-II phosphatidylserine
      synthase.
    action: ACCEPT
    reason: >-
      GO:0003882 captures the predicted donor and L-serine acceptor specificity
      of Q88DZ1 and is the most informative available molecular-function term.
    supported_by:
    - reference_id: file:PSEPK/PP_4677/PP_4677-uniprot.txt
      supporting_text: "DR   GO; GO:0003882; F:CDP-diacylglycerol-serine O-phosphatidyltransferase activity; IEA:UniProtKB-EC."
    - reference_id: file:PSEPK/PP_4677/PP_4677-notes.md
      supporting_text: "Q88DZ1 carries the specific IPR004533 and PTHR14269:SF61 phosphatidylserine synthase assignments."
- term:
    id: GO:0008654
    label: phospholipid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Phosphatidylserine formation is a phospholipid-biosynthetic reaction, but
      this term does not identify the downstream phosphatidylethanolamine
      branch.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the valid parent process while using GO:0006646 to represent the
      specific consecutive PssA-Psd pathway.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      UniProt predicts eight transmembrane helices and describes Q88DZ1 as a
      multi-pass membrane protein.
    action: ACCEPT
    reason: >-
      Integral-membrane topology is strongly supported and is characteristic
      of the type-II PssA architecture.
    supported_by:
    - reference_id: file:PSEPK/PP_4677/PP_4677-notes.md
      supporting_text: "PP_4677 is an eight-pass membrane protein predicted to form phosphatidylserine from CDP-diacylglycerol and L-serine."
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: file:PSEPK/PP_4677/PP_4677-uniprot.txt
  qualifier: located_in
  review:
    summary: The predicted eight-pass bacterial membrane enzyme is localized more specifically to the plasma membrane.
    action: NEW
    reason: >-
      Plasma membrane is the informative cellular-component term for this
      integral bacterial membrane topology.
    supported_by:
    - reference_id: file:PSEPK/PP_4677/PP_4677-uniprot.txt
      supporting_text: "Multi-pass membrane protein"
- term:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This broad phosphotransferase term is compatible with the reaction but
      omits the CDP-diacylglycerol donor and L-serine acceptor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003882 captures the same predicted activity with informative
      substrate specificity.
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/PP_4677/PP_4677-notes.md
  qualifier: involved_in
  review:
    summary: >-
      PP_4677 is a candidate phosphatidylserine synthase supplying the
      consecutive Psd reaction in the two-step phosphatidylethanolamine route.
    action: NEW
    reason: >-
      The accepted reaction assignment and the reconstructed KT2440 pathway
      support this more specific process term.
    supported_by:
    - reference_id: file:PSEPK/PP_4677/PP_4677-notes.md
      supporting_text: "The phosphatidylserine product supplies the consecutive Psd reaction in phosphatidylethanolamine biosynthesis."
