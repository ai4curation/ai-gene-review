id: Q88K36
gene_symbol: rbsC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RbsC is the multipass inner-membrane permease of the PP_2454-PP_2459 RbsABC
  importer. Its ribose-import PANTHER subfamily and neighboring rbsB, rbsA-I,
  rbsK, and rbsD genes support D-ribose specificity, but the KT2440 complex has
  not been tested directly.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Correct location for this seven-pass inner-membrane permease.
      action: ACCEPT
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: Correct but redundant with the more precise plasma-membrane annotation.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0022857
      label: transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        The generic activity is under-specific and is performed collectively by
        RbsABC rather than independently by the RbsC permease subunit.
      action: MODIFY
      reason: Retain the specific ABC-type D-ribose transporter activity with a contributes_to qualifier.
      proposed_replacement_terms:
        - id: GO:0015611
          label: ABC-type D-ribose transporter activity
      supported_by:
        - reference_id: file:PSEPK/rbsC/rbsC-uniprot.txt
          supporting_text: "DR   PANTHER; PTHR32196:SF72; RIBOSE IMPORT PERMEASE PROTEIN RBSC; 1."
  - term:
      id: GO:0055085
      label: transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: True but under-specific for the ribose-import locus.
      action: MODIFY
      reason: The specific process is D-ribose transmembrane transport.
      proposed_replacement_terms:
        - id: GO:0015752
          label: D-ribose transmembrane transport
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    evidence_type: ISS
    original_reference_id: file:PSEPK/rbsC/rbsC-uniprot.txt
    qualifier: part_of
    review:
      summary: Proposed complex membership for the membrane-channel subunit.
      action: NEW
