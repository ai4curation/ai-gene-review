  review:
    summary: Generic catalytic activity is true but uninformative beside the separately annotated GatA glutaminase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GatA belongs to the amidase family and GO:0004359 already captures its glutamine-hydrolysis site specifically.
    supported_by:
