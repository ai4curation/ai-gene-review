taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GatA is the catalytic glutaminase subunit of the bacterial GatABC
  amidotransferase in Pseudomonas putida KT2440. Within the heterotrimer it
  hydrolyzes glutamine and supplies ammonia for ATP-dependent conversion of
  misacylated Glu-tRNA(Gln) or Asp-tRNA(Asn) to correctly charged tRNAs.
