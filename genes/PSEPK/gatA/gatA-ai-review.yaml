  review:
    summary: gatA has a defined role in the substrate-specific catalytic reaction.
    action: MODIFY
    reason: Refine the broad activity to the supported glutaminase activity. The exact KT2440 curated
      family/rule assignment supports function by homology, not a purified-target experiment. Whole-complex
      activity includes the real contribution of this subunit; ordinary relationship metadata is not grounds
      for rejecting a supported contribution. The replacement also preserves the supported complete-complex
      activities to which this ammonia-generating subunit contributes; the Gln-forming capacity is comparative
      in vitro evidence.
