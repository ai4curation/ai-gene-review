    summary: GatA contributes glutamine hydrolysis to GatABC-dependent conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn).
    action: NEW
    reason: The conserved GatABC complex, the KT2440 GatB/GatC asparaginyl reaction records, non-discriminating AspS, and the experimentally established Pseudomonas indirect Asn route support this complex-level activity.
