gene_symbol: gatA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GatA is the glutamine-hydrolyzing subunit of the soluble GatABC tRNA-dependent amidotransferase.
  It supplies ammonia for conversion of the amino acid already attached to tRNA, supporting Asn-tRNA(Asn)
  formation from Asp-tRNA(Asn). The conserved complex can also support Gln-forming transamidation when
  Glu-tRNA(Gln) is supplied.
