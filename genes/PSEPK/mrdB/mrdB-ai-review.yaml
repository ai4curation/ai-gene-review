id: Q88DL9
gene_symbol: mrdB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  MrdB/RodA is an integral inner-membrane SEDS-family peptidoglycan
  glycosyltransferase that polymerizes lipid II into glycan strands during
  lateral-wall growth. It forms the glycan-polymerizing half of the elongasome
  synthase, paired with an MrdA/PBP2 D,D-transpeptidase.
existing_annotations:
