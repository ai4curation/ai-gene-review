    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: MrdB is a multipass cytoplasmic-membrane SEDS enzyme.
    action: ACCEPT
    reason: Its membrane-embedded catalytic cavity polymerizes lipid II at the periplasmic face.
- term:
    id: GO:0008360
    label: regulation of cell shape
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: RodA-dependent lateral-wall synthesis directly supports rod shape.
    action: ACCEPT
    reason: The elongasome spatially inserts peptidoglycan along the cell cylinder and thereby maintains morphology.
- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: MrdB is the glycan-polymerizing enzyme of the RodA-PBP2 synthase.
    action: ACCEPT
    reason: SEDS-family RodA proteins polymerize lipid II into peptidoglycan glycan strands.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: MrdB directly catalyzes lateral-wall peptidoglycan synthesis.
    action: ACCEPT
    reason: Its glycosyltransferase reaction builds the glycan backbone of the sacculus.
- term:
    id: GO:0015648
    label: lipid-linked peptidoglycan transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Current evidence identifies RodA as a polymerase rather than a lipid II flippase.
    action: REMOVE
    reason: This TreeGrafter transfer reflects an older SEDS transporter model that is superseded by biochemical glycan-polymerase evidence.
- term:
    id: GO:0015836
    label: lipid-linked peptidoglycan transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: MrdB consumes exported lipid II but is not established as its transporter.
    action: REMOVE
    reason: The logical transfer should not convert substrate use by a SEDS polymerase into a transport process annotation.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Membrane localization is correct but less specific than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: GO:0005886 captures the relevant bacterial membrane.
- term:
    id: GO:0032153
    label: cell division site
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: MrdB/RodA is assigned to lateral-wall elongation, not the septal divisome.
    action: REMOVE
    reason: The cognate septal SEDS paralog is FtsW; no KT2440 evidence places MrdB specifically at the division site.
- term:
    id: GO:0051301
    label: cell division
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The canonical role of MrdB is cell elongation rather than cytokinesis.
    action: REMOVE
    reason: This annotation conflates the lateral RodA-PBP2 system with the septal FtsW-FtsI system.
