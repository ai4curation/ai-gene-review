    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text; KT2440 retS and gacS mutants with promoter fusions and qRT-PCR
      of K1-T6SS genes. The only KT2440 experimental data on retS.
  findings:
  - statement: K1-T6SS genes are upregulated in the KT2440 retS mutant.
    supporting_text: >-
      The three genes were significantly upregulated in the retS mutant,
      with fold-changes >3 for hcp1 and >1.5 for tssB1 and PP3104
