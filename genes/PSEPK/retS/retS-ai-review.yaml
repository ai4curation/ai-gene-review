- term:
    id: GO:0070298
    label: negative regulation of phosphorelay signal transduction system
  qualifier: involved_in
  evidence_type: ISS
  original_reference_id: PMID:29880803
  review:
    summary: >-
      RetS attenuates GacS signalling by phosphoryl-group capture, transmitter
      phosphatase activity and inhibition of GacS autophosphorylation, through
      direct binding to GacS. In KT2440 the retS mutant phenotype (derepression
