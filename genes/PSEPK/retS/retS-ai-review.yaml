- term:
    id: GO:0071474
    label: cellular hyperosmotic response
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter annotation WITH PANTHER:PTN009177399. In the PANTHER 19
      PTHR45339 tree that node is the leaf for Nematostella vectensis A7T7B3,
