      expression, and this activity is repressed only by RetS in the
      exponential phase of growth.
proposed_new_terms:
- proposed_name: negative regulation of protein secretion by the type VI secretion system
  proposed_definition: >-
    Any process that stops, prevents, or reduces the frequency, rate, or
    extent of protein secretion by the type VI secretion system.
  justification: >-
    GO has GO:0033103 for type VI secretion itself but no type VI-specific
    negative-regulation term, so the KT2440 retS phenotype can only be
    recorded with an acts_upstream_of_negative_effect qualifier.
  proposed_parent:
    id: GO:0050709
    label: negative regulation of protein secretion
  supported_by:
  - reference_id: PMID:36748579
    supporting_text: >-
      This effect was not observed in the stationary phase (Fig. 4b), which
      suggests that repression of the K1-T6SS by RetS occurs mainly during
      exponential growth.
suggested_questions:
- question: What ligand does the periplasmic 7TMR-DISM region of KT2440 RetS sense, and does it shift the balance between its phosphatase and GacS-binding modes?
- question: Does KT2440 RetS act on GacS by the same three mechanisms (phosphoryl capture, transmitter phosphatase activity, inhibition of autophosphorylation) shown for P. aeruginosa RetS?
- question: Is there a KT2440 LadS or HptB-type input that counterbalances RetS, as in P. aeruginosa?
suggested_experiments:
- experiment_type: in vitro phosphotransfer and phosphatase assays
  hypothesis: KT2440 RetS dephosphorylates the GacS receiver domain and accepts phosphoryl groups from GacS-P but cannot autophosphorylate.
  description: >-
    Purify the cytoplasmic regions of KT2440 RetS (wild type, T411A H-box
    mutant and D840A receiver mutant) and GacS; test RetS autophosphorylation
    with [gamma-32P]ATP and the half-time of GacS-P dephosphorylation in
    their presence.
- experiment_type: genetics and reporter assays
  hypothesis: RetS represses the K1-T6SS through GacS.
  description: >-
    Measure K1-T6SS promoter activity in retS, gacS and retS gacS double
    mutants and in a retS strain complemented with phosphatase-dead RetS,
    across growth phases.
