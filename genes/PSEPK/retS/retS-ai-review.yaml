      supporting_text: >-
        its HisKA domain retains the conserved H-box including the motif
        (HExxT) needed for transmitter phosphatase activity
    - reference_id: file:PSEPK/retS/retS-bioinformatics/RESULTS.md
      supporting_text: >-
        KT2440 RetS retains the HExxT H-box, the motif needed for
