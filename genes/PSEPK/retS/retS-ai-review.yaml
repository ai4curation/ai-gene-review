- term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  qualifier: enables
  evidence_type: ISS
  original_reference_id: PMID:29880803
  review:
    summary: >-
      Transmitter phosphatase activity: the P. aeruginosa ortholog accelerates
      dephosphorylation of the phospho-aspartate on the GacS receiver domain,
      and this depends on the threonine of its HExxT H-box. KT2440 RetS keeps
      the HEIRT H-box at residue 407.
    action: NEW
    reason: >-
      This is the catalytic activity by which RetS opposes GacS. Evidence is
      biochemistry on the ortholog (61.5% identical) plus conservation of the
      required motif in KT2440 RetS. GO has no transmitter-phosphatase term;
      phosphoprotein phosphatase activity is the most specific existing term
      for dephosphorylation of a phosphorylated protein.
    supported_by:
    - reference_id: PMID:29880803
      supporting_text: >-
        In mechanism 2, RetS has transmitter phosphatase activity that speeds
        up the dephosphorylation of the REC domain of GacS-P.
