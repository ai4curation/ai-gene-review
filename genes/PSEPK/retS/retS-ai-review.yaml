id: Q88DK1
gene_symbol: retS
product_type: PROTEIN
aliases:
- PP_4824
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  retS (PP_4824) encodes RetS, an inner-membrane hybrid sensor protein with a
  periplasmic 7TMR-DISM sensory region flanked by five transmembrane helices, a
  cytoplasmic HisKA-type dimerization/phosphotransfer domain, a degenerate
  HATPase domain that lacks the G1 and G2 ATP-binding boxes, and two
  C-terminal receiver domains. Its Pseudomonas aeruginosa ortholog cannot
  autophosphorylate and instead antagonizes the GacS sensor kinase directly:
  it binds GacS, captures phosphoryl groups from it, dephosphorylates the GacS
  receiver domain by transmitter phosphatase activity, and blocks GacS
  autophosphorylation. KT2440 RetS shares the degenerate HATPase and the
  phosphatase H-box. In KT2440, loss of retS derepresses transcription of the
  K1 type VI secretion system during exponential growth, an output that GacS
  activates, so RetS acts as a negative input into the GacS/GacA lifestyle
  phosphorelay. The signal sensed by its periplasmic domain is unknown.
