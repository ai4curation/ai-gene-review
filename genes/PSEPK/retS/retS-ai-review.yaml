core_functions:
- description: >-
    RetS is an inner-membrane, kinase-dead hybrid sensor that opposes the
    GacS/GacA phosphorelay. By orthology with P. aeruginosa RetS and
    conservation of the HExxT H-box, it dephosphorylates the GacS receiver
    domain (transmitter phosphatase activity), captures phosphoryl groups from
    GacS on its own receiver domain, and inhibits GacS autophosphorylation by
    direct binding. In KT2440 this negative input represses the GacS-activated
    K1 type VI secretion system during exponential growth.
  molecular_function:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  directly_involved_in:
  - id: GO:0070298
    label: negative regulation of phosphorelay signal transduction system
  - id: GO:0000160
    label: phosphorelay signal transduction system
