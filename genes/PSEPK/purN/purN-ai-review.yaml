- id: PMID:8501063
  title: Evidence for a novel glycinamide ribonucleotide transformylase in Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Genetic analysis established PurN and PurT as alternative enzymes at the third
      de novo purine-biosynthesis step.
    supporting_text: >-
      We demonstrate here that Escherichia coli synthesizes two different
      glycinamide ribonucleotide (GAR) transformylases, both catalyzing the
      third step in the purine biosynthetic pathway.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract-only primary research; supports the alternative-route
      architecture but is not direct characterization of the P. putida protein.
