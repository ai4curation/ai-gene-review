  - statement: The report corroborates the PurN reaction and the parallel PurT route while explicitly
      distinguishing orthology-based inference from direct KT2440 characterization.
    supporting_text: No study to date has biochemically or genetically characterized the *P. putida*
      KT2440 purN gene product specifically.
