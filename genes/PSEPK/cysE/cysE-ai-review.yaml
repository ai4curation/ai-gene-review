id: Q88PL0
gene_symbol: cysE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  CysE is a serine O-acetyltransferase that forms O-acetyl-L-serine from
  L-serine and acetyl-CoA. This reaction supplies the activated serine carbon
  skeleton used by CysK- and CysM-family sulfhydrylases during bacterial
  L-cysteine biosynthesis.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct but general location for a soluble serine O-acetyltransferase.
    action: MODIFY
    reason: >-
      Q88PL0 is a soluble hexapeptide-repeat acetyltransferase with no
      transmembrane or signal-peptide feature in its record, so the cytoplasm
      claim holds, but the evidence supports the more specific cytosol. The
      PTHR42811 PAINT curator placed cytosol (GO:0005829) at the family node
      PTN000602332, seeded by E. coli CysE and Arabidopsis cytosolic SATs, and
      the only clade where it is withdrawn is the plant organellar SATs
      (IRD at PTN000602385, taxon 3398). The record's own SUBCELLULAR LOCATION
      line rests on an ARBA rule and is not cited.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: file:interpro/panther/PTHR42811/PTHR42811-paint.tsv
      supporting_text: "PTHR42811\tPTN000602332\tGO:0005829\tC\tIBD\tfalse"
- term:
    id: GO:0009001
    label: L-serine O-acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct reaction-specific molecular function.
    action: ACCEPT
    reason: >-
      Q88PL0 matches the NCBIfam serine O-acetyltransferase family model
      TIGR01172 (cysE) and the InterPro serine O-acetyltransferase entry
      IPR005881; membership in this family supports the EC 2.3.1.30 activity
      (L-serine + acetyl-CoA to O-acetyl-L-serine + CoA). The record's
      CATALYTIC ACTIVITY line is ARBA-derived and is not cited as evidence. No
      KT2440 enzyme assay is cached; the P. aeruginosa ortholog PA3816 (PaCysE)
      was validated as the major serine acetyltransferase (PMID:42278617),
      consistent with the family assignment.
    supported_by:
    - reference_id: file:PSEPK/cysE/cysE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01172; cysE; 1."
    - reference_id: file:PSEPK/cysE/cysE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR005881; Ser_O-AcTrfase."
- term:
    id: GO:0016413
    label: O-acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: True but uninformative parent of the accepted serine O-acetyltransferase activity.
    action: TOO_GENERAL
    reason: >-
      GO:0009001 L-serine O-acetyltransferase activity, accepted in this review,
      is_a GO:0016413 O-acetyltransferase activity and so already entails this
      ARBA-derived parent.
    supported_by:
    - reference_id: file:PSEPK/cysE/cysE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01172; cysE; 1."
- term:
    id: GO:0019344
    label: L-cysteine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct broad biological-process term for cysteine biosynthesis.
    action: ACCEPT
    reason: >-
      Q88PL0 forms O-acetyl-L-serine in the two-step route from L-serine. The
      annotation is correct and is the core process term: the route-specific child
      GO:0006535 (L-cysteine biosynthetic process from L-serine) is obsolete
      since at least GO release 2026-03-25 with replaced_by GO:0019344. UniProt
      still cross-references GO:0006535, but that
      is a stale cross-reference, so no route-specific term is proposed; the
      O-acetylserine route is captured by the
      bacterial_cysteine_biosynthesis_via_o_acetylserine module. Support is
      membership in the NCBIfam cysE serine O-acetyltransferase family
      (TIGR01172), whose product O-acetyl-L-serine is the substrate for
      O-acetylserine sulfhydrylase; the ARBA-derived reaction line is not cited.
    supported_by:
    - reference_id: file:PSEPK/cysE/cysE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01172; cysE; 1."
    - reference_id: file:PSEPK/cysE/cysE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR005881; Ser_O-AcTrfase."
