  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CysE is a serine O-acetyltransferase that forms O-acetyl-L-serine from
  L-serine and acetyl-CoA. This reaction supplies the activated serine carbon
  skeleton used by CysK- and CysM-family sulfhydrylases during bacterial
  L-cysteine biosynthesis.
