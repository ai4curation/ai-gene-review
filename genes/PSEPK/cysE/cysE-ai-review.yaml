suggested_questions:
- question: >-
    Is Q88PL0 the dominant serine O-acetyltransferase in KT2440, and do the
    additional CysE-family proteins PP_0228, PP_1110, or PP_3136 contribute to
    cysteine synthesis under specific sulfur conditions?
suggested_experiments:
- description: >-
    Compare growth and intracellular O-acetyl-L-serine in single and combined
    deletion strains for cysE, PP_0228, PP_1110, and PP_3136, with complementation
    and purified-enzyme assays using L-serine plus acetyl-CoA.
  experiment_type: genetic redundancy and substrate-specificity analysis
