  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: PP_0983 encodes LptG, one of the two nonidentical inner-membrane
  permease subunits of the LptB2FG ABC transporter. LptG forms part of the
  membrane pathway that extracts lipopolysaccharide from the inner membrane and
  passes it to LptC, while ATP hydrolysis is performed by LptB.
