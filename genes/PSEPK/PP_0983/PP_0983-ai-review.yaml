core_functions:
- description: LptG forms one transmembrane half of the LptB2FG ABC transporter. Together with its partner
    permease it builds the cavity that takes up LPS from the outer leaflet of the inner membrane, and ATP hydrolysis
    by LptB drives the LPS out of the cavity into the periplasmic LptC/LptA/LptD bridge. This contribution
    is inferred for KT2440 from its distinct LptG signature and homolog structures; the protein supplies part
    of the joint cargo cavity rather than hydrolyzing ATP or autonomously carrying out the complete transfer.
