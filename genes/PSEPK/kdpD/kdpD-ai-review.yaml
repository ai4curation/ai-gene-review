suggested_questions:
- question: Which ionic or membrane-state signal dominates KdpD activation in KT2440, and is the
    dual (intra/extracellular K+) sensing of E. coli KdpD conserved?
- question: Does the N-terminal KdpD (Walker A/B) domain of Q88FD9 retain the atypical serine kinase
    activity that phosphorylates KdpB in E. coli?
suggested_experiments:
- description: Measure KdpD autophosphorylation, KdpE phosphotransfer and KdpE~P dephosphorylation
    across K+ and osmotic conditions with purified KT2440 proteins.
