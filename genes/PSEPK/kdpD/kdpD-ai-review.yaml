      supporting_text: InterPro; IPR025201; KdpD_TM.
      record_section:
      - DR:InterPro
    - reference_id: PMID:7499326
      supporting_text: KdpD has four membrane-spanning segments in the middle of the polypeptide
        chain, whereas N and C terminus are both cytoplasmic
