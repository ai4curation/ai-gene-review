  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      KdpD is an integral membrane sensor with cytoplasmic signaling domains;
      domain topology does not make the whole protein a cytoplasmic gene
      product.
    action: REMOVE
    reason: >-
      The UniProt record places full-length KdpD in the membrane as a multipass
      membrane protein. Its large cytosolic input and transmitter domains
      explain the inference but do not make the whole protein a cytoplasmic gene
      product, so the ARBA assignment is a localization overreach.
    supported_by:
    - reference_id: file:PSEPK/kdpD/kdpD-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Membrane"
