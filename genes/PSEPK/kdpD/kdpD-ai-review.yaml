- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: ARBA cytoplasm assignment for an integral membrane sensor kinase.
    action: REMOVE
    reason: Q88FD9 has four predicted TM helices (Phobius) and the KdpD_TM signature; in E.
      coli KdpD is an inner-membrane protein whose N- and C-terminal domains face the cytoplasm.
      Cytoplasmic domain orientation does not make the gene product located in the cytoplasm;
      the ARBA rule over-propagates a soluble-protein location. Plasma membrane is accepted
      instead. E. coli KdpD evidence is cited as orthology-based support (same PANTHER subfamily
      PTHR45569:SF1 and KdpD-specific N-terminal/TM signatures).
    supported_by:
    - reference_id: file:PSEPK/kdpD/kdpD-uniprot.txt
      supporting_text: TRANSMEM        387..406
      record_section: &id002
      - FT:TRANSMEM
