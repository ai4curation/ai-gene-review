- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: ARBA cytoplasm assignment for an integral membrane sensor kinase.
    action: REMOVE
    reason: Current GO:0005737 explicitly excludes the plasma membrane. This full-length target has
      four predicted transmembrane segments and the KdpD membrane-domain signature, while E. coli
      topology studies place the homolog in the inner membrane with cytoplasmic input/transmitter
      domains. Those domain orientations do not establish a separate cytoplasmic location for the
      integral membrane protein. The electronic cytoplasm transfer is rejected on topology and term
      scope, not from absence of a target assay.
    supported_by:
    - reference_id: file:PSEPK/kdpD/kdpD-uniprot.txt
      supporting_text: TRANSMEM        387..406
      record_section:
      - FT:TRANSMEM
