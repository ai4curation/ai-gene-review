  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Membrane-associated multiheme cytochrome c subunit of the periplasmic
  three-subunit gluconate 2-dehydrogenase. It transfers electrons within the
  complex but does not independently catalyze gluconate oxidation.
