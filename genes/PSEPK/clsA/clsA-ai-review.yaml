- term:
    id: GO:0008808
    label: cardiolipin synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Cardiolipin synthase activity from the ClsA family assignment.
    action: ACCEPT
    reason: The protein matches the ClsA-specific HAMAP rule and InterPro family, which define the PG
      + PG cardiolipin synthase reaction (RHEA:31451). Its E. coli counterpart in the same sub-subfamily
      has direct biochemical evidence for this reaction, and KT2440 membranes contain cardiolipin. No
      enzyme assay on the KT2440 protein itself is available, so the activity rests on family membership.
    supported_by:
    - &id005
      reference_id: file:PSEPK/clsA/clsA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR030840; CL_synthase_A.
