id: Q88C19
gene_symbol: clsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ClsA (PP_5364) is the Pseudomonas putida KT2440 member of the ClsA sub-subfamily of phospholipase
  D-family cardiolipin synthases. It is anchored in the inner membrane by two N-terminal transmembrane
  helices and carries two HKD catalytic motifs. By homology to the characterized Escherichia coli ClsA,
  it transfers a phosphatidyl group between two phosphatidylglycerol molecules to form cardiolipin and
  glycerol. Cardiolipin is a measured component of KT2440 membranes, and KT2440 also has a ClsB-type paralog.
