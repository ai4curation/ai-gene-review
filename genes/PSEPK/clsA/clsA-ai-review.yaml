suggested_questions:
- question: Is ClsA the main cardiolipin synthase of KT2440 during exponential growth, as in E. coli,
    and how do ClsA and ClsB share cardiolipin synthesis under solvent stress?
suggested_experiments:
- description: Construct single and double clsA/clsB deletions in KT2440 and measure cardiolipin by LC-MS/MS
    across growth phase and n-butanol exposure.
