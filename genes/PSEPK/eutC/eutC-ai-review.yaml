        the interface of the alpha- and beta-subunits
- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: KT2440 lacks recognizable bacterial-microcompartment shell proteins, so this transferred localization is unsupported.
    action: REMOVE
    reason: >-
      The compact PP_0542-PP_0546 locus has no shell genes, and the local
      proteome metadata contain no PF00936 or PF03319 shell-family hits. This
      species-specific absence overrides a generic HAMAP localization transfer.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-deep-research-openscientist.md
      supporting_text: Pfam **PF00936 = 0 hits**, Pfam **PF03319 = 0 hits**
