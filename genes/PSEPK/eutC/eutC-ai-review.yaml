  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: The ethanolamine-specific microcompartment localization is incompatible with the KT2440 locus and proteome inventory.
    action: REMOVE
    reason: >-
      This UniRule transfer is valid in shell-encoding enterobacteria but not in
      the shell-free KT2440 architecture. EutC remains part of the soluble
      enzyme complex, not a polyhedral organelle.
