      record_section:
      - CC:COFACTOR
      supporting_text: Note=Binds 1 AdoCbl between the large and small subunits, with 6 cofactors per
        holoenzyme.
- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: The conventional Eut microcompartment location is not supported for the KT2440 reference
      proteome.
    action: REMOVE
    reason: The reproducible KT2440 reference-proteome inventory detects no PF00936/IPR000249 BMC or PF03319/IPR004992
      vertex signatures, with the E. coli Eut shell set recovered as a positive control; the local eut
      locus also lacks identified shell genes. This supports rejecting a conventional Eut shell-location
      transfer to KT2440. The inference is bounded by signature coverage and could miss divergent shell
      proteins. It does not demonstrate where native KT2440 EutBC activity occurs or establish a free
      cytosolic active state.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
        proteome, while the same queries recover the complete E. coli Eut shell set.
