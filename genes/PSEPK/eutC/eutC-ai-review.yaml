  review:
    summary: EutC is the small subunit of the EutB/EutC enzyme complex.
    action: ACCEPT
    reason: >-
      EutB and EutC encode the large and small subunits, and purified E. coli
      enzyme forms an alpha6-beta6 complex. The exact GOA PTN is
      PTN002446609; canonical local PAINT data independently place
      GO:0009350 at PTN002217404 using P19636 and P19265 as seeds.
    supported_by:
    - reference_id: PMID:19762342
      supporting_text: >-
        The eutB and eutC genes in the eut operon encoded the large and small
        subunits of the enzyme, respectively. The enzyme existed as the
        heterododecamer alpha(6)beta(6).
