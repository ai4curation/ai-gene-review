core_functions:
- description: Small subunit of the adenosylcobalamin-dependent EutB/EutC complex, contributing to ethanolamine
    deamination through the intersubunit cobalamin-binding environment. This KT2440 role is inferred from
    conserved EutC membership and characterized E. coli homologs, not from a native KT2440 structural
    or kinetic assay.
