id: Q88QF2
gene_symbol: eutC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  EutC (PP_0542) is the small beta subunit of the adenosylcobalamin-dependent
  ethanolamine ammonia-lyase. It associates with the EutB large subunit to form
  the active enzyme, completes the intersubunit cobalamin-binding environment,
  and contributes to conversion of ethanolamine into acetaldehyde and ammonium.
  In KT2440 the compact eutBC-transporter-aldehyde-dehydrogenase locus lacks
  recognizable bacterial-microcompartment shell genes.
existing_annotations:
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Ethanolamine is an amino alcohol, and its catabolism is not an amino acid metabolic process.
    action: REMOVE
    reason: >-
      This InterPro mapping is a category over-transfer. GO:0046336 directly
      captures the established pathway and is already present.
    supported_by:
    - reference_id: PMID:19783625
      supporting_text: >-
        Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into
        acetaldehyde and ammonia, is encoded by the gene tandem eutBC.
- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: EutC is required for this activity, but catalysis is performed by the assembled EutB/EutC enzyme.
    action: MODIFY
    reason: >-
      Structural work places the active-site barrel in EutB while EutC covers
      the lower cobalamin surface at the alpha/beta interface. The individual
      EutC subunit should contribute_to GO:0008851 rather than independently enable it.
    proposed_replacement_terms:
    - id: GO:0008851
      label: ethanolamine ammonia-lyase activity
    supported_by:
    - reference_id: PMID:20519496
      supporting_text: >-
        The active site is in the (beta/alpha)(8) barrel of the alpha-subunit;
        the beta-subunit covers the lower part of the cobalamin that is bound in
        the interface of the alpha- and beta-subunits.
    - reference_id: file:PSEPK/eutC/eutC-deep-research-openscientist.md
      supporting_text: EutC is the small (β) subunit of ethanolamine ammonia-lyase
- term:
    id: GO:0009350
    label: ethanolamine ammonia-lyase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: part_of
  review:
    summary: EutC is the small subunit of the EutB/EutC enzyme complex.
    action: ACCEPT
    reason: >-
      EutB and EutC encode the large and small subunits, and purified E. coli
      enzyme forms an alpha6-beta6 complex. The exact GOA PTN is
      PTN002446609; canonical local PAINT data independently place
      GO:0009350 at PTN002217404 using P19636 and P19265 as seeds.
    supported_by:
    - reference_id: PMID:19762342
      supporting_text: >-
        The eutB and eutC genes in the eut operon encoded the large and small
        subunits of the enzyme, respectively. The enzyme existed as the
        heterododecamer alpha(6)beta(6).
