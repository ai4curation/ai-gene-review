gene_symbol: eutC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: EutC (PP_0542) is the small beta subunit of the adenosylcobalamin-dependent ethanolamine
  ammonia-lyase. It associates with the EutB large subunit to form the active enzyme, completes the intersubunit
  cobalamin-binding environment, and contributes to conversion of ethanolamine into acetaldehyde and ammonium.
existing_annotations:
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Ethanolamine is an amino alcohol, and its catabolism is not an amino acid metabolic process.
    action: REMOVE
    reason: This InterPro mapping is a category over-transfer. GO:0046336 directly captures the established
      pathway and is already present.
    supported_by:
    - reference_id: PMID:19783625
      supporting_text: Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into acetaldehyde
        and ammonia, is encoded by the gene tandem eutBC.
- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The ethanolamine ammonia-lyase term is correct for the EutB/EutC enzyme; EutC contributes
      to it as the non-catalytic small subunit.
    action: ACCEPT
    reason: 'The reaction is correctly assigned to the EutB/EutC enzyme. E. coli structural evidence places
      the active-site barrel in EutB and the lower cobalamin-contact surface in EutC; conserved EutC membership
      supports a contribution-qualified core for KT2440. This does not establish that every source enables
      relation is categorically wrong: GO catalytic-subunit semantics do not require isolated-subunit
      activity. The combined electronic source receives a probable, source-specific qualifier caution,
      with its original annotation payload preserved.'
    supported_by:
    - &id001
      reference_id: PMID:20519496
      supporting_text: The active site is in the (beta/alpha)(8) barrel of the alpha-subunit; the beta-subunit
        covers the lower part of the cobalamin that is bound in the interface of the alpha- and beta-subunits.
    - reference_id: PMID:19762342
      supporting_text: The eutB and eutC genes in the eut operon encoded the large and small subunits
        of the enzyme, respectively. The enzyme existed as the heterododecamer alpha(6)beta(6).
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: The GO_REF:0000120 UniProt combined mapping cites ARBA:ARBA00098011, InterPro:IPR009246,
        RHEA:15313, EC:4.3.1.7 and UniRule:UR000033396. A contributes_to relation better expresses the
        small subunit's inferred interfacial cofactor-support role, based on E. coli structures rather
        than a direct KT2440 assay. No individual mapping component is singled out as the proven cause.
        The role-based correction is probable because enables need not imply autonomous isolated-subunit
        catalysis.
      supported_by:
      - *id001
