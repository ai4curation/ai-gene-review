- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: EutC makes direct contacts with the cobalamin cofactor bound at the EutB/EutC interface.
    action: ACCEPT
    reason: In the characterized E. coli ortholog EutC carries experimentally defined adenosylcobalamin-contact
      residues (UniProt positions 207, 228 and 258, from the crystal structures) and covers the lower
      face of the cofactor. It binds cobalamin directly, so `enables` is acceptable, as for EutB.
    supported_by:
    - reference_id: PMID:20519496
      supporting_text: the beta-subunit covers the lower part of the cobalamin that is bound in the interface
        of the alpha- and beta-subunits
