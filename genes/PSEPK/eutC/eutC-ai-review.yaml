suggested_questions:
- question: Where does active EutBC occur in native KT2440, and how is acetaldehyde loss or toxicity controlled?
    Does the adjacent aldB-I aldehyde dehydrogenase couple to the enzyme despite the absence of detected
    conventional BMC shell signatures?
suggested_experiments:
- description: Grow wild type, eutC deletion and complemented strains on ethanolamine with B12, measure
    ethanolamine ammonia-lyase activity and acetaldehyde release, and determine EutC localization by controlled
    fractionation or imaging rather than presupposing a soluble location.
  experiment_type: reverse genetics, enzyme assay and cell fractionation
