    label: ethanolamine degradation polyhedral organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: The ethanolamine-organelle localization is plausible by family transfer but unverified in KT2440.
    action: UNDECIDED
    reason: >-
      Characterized enterobacterial Eut systems can be encapsulated, while the
      available KT2440 evidence neither demonstrates nor rules out that context.
      Direct localization or a reproducible species-specific shell inventory is needed.
