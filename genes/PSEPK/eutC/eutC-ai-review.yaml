taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  EutC (PP_0542) is the small beta subunit of the adenosylcobalamin-dependent
  ethanolamine ammonia-lyase. It associates with the EutB large subunit to form
  the active enzyme, completes the intersubunit cobalamin-binding environment,
  and contributes to conversion of ethanolamine into acetaldehyde and ammonium.
