      A pCHESI-based trpF knockout is a tryptophan auxotroph, though leaky
      (very small colonies without tryptophan), and indole rescues it. RT-PCR
      shows trpF is a single cistron.
    supporting_text: >-
      As expected, the trpF‐deficient clones were found to be auxotrophs for
      tryptophan, although very small colonies were detected on plates without
      tryptophan supplementation.
