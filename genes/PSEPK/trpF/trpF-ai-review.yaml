id: Q88LE0
gene_symbol: trpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  trpF (PP_1995) encodes N-(5'-phosphoribosyl)anthranilate isomerase (PRAI, EC
  5.3.1.24), a 206-residue (beta/alpha)8-barrel enzyme of the TrpF family. In
  the third step of L-tryptophan biosynthesis, it converts
  N-(5-phospho-beta-D-ribosyl)anthranilate to 1-(2-carboxyphenylamino)-1-deoxy-D-ribulose
  5-phosphate through an Amadori rearrangement that opens the ribose ring. In
  Pseudomonas putida KT2440, trpF is a monocistronic gene unlinked to the other
  trp genes and flanked by truA and accD. The trpC gene of this organism
  encodes a monofunctional indole-3-glycerol-phosphate synthase without a PRAI
  domain. A targeted trpF knockout is a tryptophan auxotroph that indole
  rescues.
existing_annotations:
- term:
    id: GO:0000162
    label: L-tryptophan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      TrpF catalyses step 3 of L-tryptophan biosynthesis. A KT2440 trpF
      knockout requires tryptophan, and indole bypasses the block.
    action: ACCEPT
    reason: >-
      Core process, directly confirmed in KT2440 by targeted mutagenesis and
      precursor feeding. Very small colonies of the mutant appear without
      tryptophan, so the block is not absolute.
    supported_by:
    - reference_id: PMID:21261884
      supporting_text: >-
        As expected, the trpF‐deficient clones were found to be auxotrophs for
        tryptophan, although very small colonies were detected on plates without
        tryptophan supplementation.
    - reference_id: PMID:21261884
      supporting_text: >-
        whereas trpD and trpF mutants grew with tryptophan and indole.
    - reference_id: file:PSEPK/trpF/trpF-deep-research-falcon.md
      supporting_text: >-
        Because spontaneous trpF mutants were not recovered, Molina-Henares et
        al. constructed a **site-specific chromosomal trpF (PP_1995) knockout**
        using a pCHESI-based strategy
- term:
    id: GO:0004640
    label: phosphoribosylanthranilate isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      TrpF isomerises N-(5'-phosphoribosyl)-anthranilate to CdRP, the Amadori
      rearrangement of the tryptophan pathway.
    action: ACCEPT
    reason: >-
      Core molecular function. The HAMAP MF_00135 catalytic-activity and family
      assignments and the PRAI Pfam/CDD domains support it, and KT2440 genetics
      are consistent. KT2440 has no PRAI domain on TrpC, so this gene is the
      only PRAI of the pathway.
    supported_by:
    - reference_id: file:PSEPK/trpF/trpF-uniprot.txt
      supporting_text: >-
        EC=5.3.1.24; Evidence={ECO:0000255|HAMAP-Rule:MF_00135};
    - reference_id: file:PSEPK/trpF/trpF-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_00135; PRAI; 1."
    - reference_id: PMID:21261884
      supporting_text: >-
        is proposed to encode a phosphoribosyl anthranilate isomerase.
- term:
    id: GO:0046394
    label: carboxylic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      This ARBA-derived term is a distant ancestor of L-tryptophan
      biosynthesis. It is true, but it says nothing beyond GO:0000162, which
      the gene already carries.
    action: TOO_GENERAL
    reason: >-
      The claim is correct, because L-tryptophan is a carboxylic acid, but it
      is entailed by the accepted GO:0000162 L-tryptophan biosynthetic process
      row. The same handling is used for broad aromatic amino acid
      biosynthesis rows on the yeast TRP genes.
    supported_by:
    - reference_id: file:PSEPK/trpF/trpF-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Amino-acid biosynthesis; L-tryptophan biosynthesis
