suggested_questions:
- question: >-
    What supplies the residual PRAI activity that lets the KT2440 trpF
    knockout form very small colonies without tryptophan? Could it be a
    promiscuous isomerase such as the HisA paralog of histidine biosynthesis?
suggested_experiments:
- description: >-
    Build a trpF hisA double mutant, or overexpress hisA in the trpF
    background, to test whether HisA accounts for the leaky growth of the trpF
    mutant.
  experiment_type: genetics
