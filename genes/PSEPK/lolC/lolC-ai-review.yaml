  label: Pseudomonas putida KT2440
description: >-
  Multi-pass inner-membrane LolC subunit of the LolCDE ABC complex. Together
  with LolE it forms the membrane machinery that extracts
  outer-membrane-destined mature lipoproteins and transfers them to LolA.
