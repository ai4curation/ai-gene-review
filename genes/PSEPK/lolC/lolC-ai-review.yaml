      - statement: LolC and LolE, with the LolD NBD, translocate lipoproteins from the outer face of the inner membrane to a periplasmic chaperone by mechanotransmission rather than transmembrane substrate passage (E. coli comparative background, not KT2440).
  - id: file:PSEPK/lolC/lolC-uniprot.txt
    title: UniProt record for Pseudomonas putida KT2440 LolC (Q88KY5)
    findings:
      - statement: UniProt assigns Q88KY5 to the multi-pass membrane LolC/E subfamily.
  - id: file:PSEPK/lolC/lolC-deep-research-openscientist.md
    title: OpenScientist research for Pseudomonas putida KT2440 LolC
    findings:
      - statement: >-
          LolC is the LolA-docking membrane subunit of the LolCDE extraction
          complex rather than a pore-forming transmembrane transporter.
        supporting_text: LolC operates by mechanotransmission, not by transmembrane substrate passage
        reference_section_type: RESULTS
      - statement: Direct experimental characterization of Q88KY5 was not found.
        supporting_text: No study in the knowledge base characterizes *P. putida* KT2440 LolC
        reference_section_type: DISCUSSION
    reference_review:
      relevance: HIGH
      correctness: UNVERIFIED
      review_notes: >-
        Supports subunit-aware modeling; detailed LolA-docking and
        mechanotransmission evidence derives primarily from E. coli orthologs.
core_functions:
  - description: >-
      Integral-membrane LolC contribution to LolCDE-dependent extraction and
      release of mature outer-membrane-destined lipoproteins, including the
      LolA-docking interface. Support is LolC/E family membership (NCBIfam
      TIGR02212, InterPro IPR011925), Phobius transmembrane helices, and
      comparative E. coli LolCDE mechanism summarized in the MacB-superfamily
      study; the LolA-docking role is inferred from E. coli work that is not
      cached here, and no KT2440 experiment exists.
    directly_involved_in:
