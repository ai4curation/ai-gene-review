      - reference_id: PMID:29109272
        supporting_text: LolC and LolE collaborate with NBDs encoded by LolD to translocate lipoproteins from the outer face of the inner membrane to a periplasmic chaperone during outer membrane biogenesis
      - reference_id: PMID:29109272
        supporting_text: LolCDE and FtsEX do not transport substrates across the inner membrane, but instead use cytoplasmic ATP hydrolysis to perform work in the periplasm
proposed_new_terms:
  - proposed_name: LolA recruitment activity
    proposed_definition: >-
      Recruiting the periplasmic lipoprotein carrier LolA to a bacterial
      lipoprotein-extraction complex and priming LolA to receive lipid-anchored cargo.
    justification: >-
      LolC provides the experimentally defined LolA-docking interface, but GO has no
      molecular-function term that distinguishes this role from the extraction activity
      of the assembled LolCDE complex.
    proposed_parent:
      id: GO:0003674
      label: molecular_function
    supported_by:
      - reference_id: file:PSEPK/lolC/lolC-deep-research-openscientist.md
        supporting_text: LolA, initially primed to receive lipoprotein by interaction with LolC
suggested_questions:
  - question: What distinct substrate-contacting role does KT2440 LolC have relative to LolE?
suggested_experiments:
  - description: Reconstitute LolCDE with systematic LolC and LolE substitutions and measure lipoprotein release to LolA.
    experiment_type: proteoliposome transport assay
