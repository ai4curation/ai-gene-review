- id: file:PSEPK/hisB/hisB-deep-research-openscientist.md
  title: OpenScientist functional report for PSEPK HisB
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      On-target provider report that corroborates monofunctional IGPD activity
      and the absence of a fused histidinol-phosphatase domain. The separate
      phosphatase assignment remains unresolved here: this report and the
      pathway-level histidine report favor IMPase-family PP_3157 over PP_5147,
      but PP_5147's review keeps the HAD-family candidate plausible because it
      is 67.7% identical to experimentally validated P. aeruginosa PA0335.
      No direct KT2440 HisB enzymology is cited.
  findings:
  - statement: >-
      Corroborates the monofunctional IGPD assignment and absence of a fused
      histidinol-phosphatase domain.
- id: file:PSEPK/PP_5147/PP_5147-ai-review.yaml
  title: Manual review of PSEPK PP_5147 histidinol-phosphate phosphatase evidence
  findings:
  - statement: >-
      Keeps the PP_5147 EC 3.1.3.15 assignment undecided because the HAD-family
      enzyme is 67.7% identical to experimentally validated Pseudomonas
      aeruginosa PA0335, even though direct KT2440 enzymology is absent.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__histidine_biosynthesis__ppu00340-deep-research-openscientist.md
  title: OpenScientist PSEPK histidine-biosynthesis pathway report
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Pathway-level generated report that identifies PP_3157 as the likely
      IMPase-family HisN but excludes PP_5147 without addressing the PA0335
      orthology that keeps the HAD-family candidate plausible in PP_5147's
      gene-level review.
  findings:
  - statement: >-
      Resolves the separate histidinol-phosphate phosphatase step exclusively
      to PP_3157 and recommends excluding PP_5147 from the module.
    supporting_text: >-
      PP_3157 should be curated as HisN; PP_1721 and PP_5147 should be excluded
      from the module.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - file:PSEPK/PP_5147/PP_5147-ai-review.yaml
      review_notes: >-
        The PP_3157 call is plausible but not decisive against PP_5147 because
        the report weighs fold and UniProt keyword evidence but not PP_5147's
        close identity to the experimentally validated P. aeruginosa PA0335
        HolPase.
      supported_by:
      - reference_id: file:PSEPK/PP_5147/PP_5147-ai-review.yaml
        supporting_text: 67.7% amino-acid identity to the experimentally validated ortholog PA0335
