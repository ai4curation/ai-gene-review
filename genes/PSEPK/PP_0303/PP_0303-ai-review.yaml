core_functions:
  - description: >-
      Transfer of the betainyl fragment of 3-dehydrocarnitine to CoA from
      acetyl-CoA, forming betainyl-CoA and acetoacetate (EC 2.3.1.317, by
      orthology).
    molecular_function:
      id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    directly_involved_in:
      - id: GO:0042413
        label: carnitine catabolic process
    supported_by:
      - reference_id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
        supporting_text: KEGG assigns PP_0303 to **KO K27837 (cdhC)** and **EC 2.3.1.317** (an EC number created in 2024), whose reaction (R13359) is **3-dehydrocarnitine + acetyl-CoA = acetoacetate + betainyl-CoA**, explicitly classified as a BKACE reaction.
      - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
          + acetoacetate;
proposed_new_terms:
  - proposed_name: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
    proposed_definition: >-
      Catalysis of the reaction: 3-dehydrocarnitine + acetyl-CoA =
      N,N,N-trimethylglycyl-CoA + acetoacetate.
    justification: >-
      The EC 2.3.1.317/RHEA:47044 activity is experimentally established for
      orthologs, while GO:0043720 describes another substrate in the diverse
      BKACE family.
    proposed_parent:
      id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    supported_by:
      - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
          + acetoacetate;
suggested_questions:
  - question: Does purified PP_0303 have the same substrate profile and zinc dependence as Q9HTH7?
suggested_experiments:
  - description: Reconstitute the PP_0303 reaction with 3-dehydrocarnitine and acetyl-CoA and quantify both products by LC-MS.
    experiment_type: in vitro enzyme assay
