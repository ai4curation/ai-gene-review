id: Q88R31
gene_symbol: PP_0303
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0303 encodes the predicted CdhC 3-dehydrocarnitine:acetyl-CoA
  trimethylamine transferase of L-carnitine catabolism. It is expected to form
  betainyl-CoA and acetoacetate from 3-dehydrocarnitine and acetyl-CoA.
existing_annotations:
  - term:
      id: GO:0043720
      label: 3-keto-5-aminohexanoate cleavage activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This beta-keto-acid family term assigns the wrong physiological substrate.
      action: REMOVE
      reason: >-
        PP_0303 is embedded beside lcdH and the predicted CdhB thioesterase and
        is the ortholog of experimentally characterized P. aeruginosa CdhC
        Q9HTH7. CdhC uses 3-dehydrocarnitine and acetyl-CoA (RHEA:47044), not
        3-keto-5-aminohexanoate. A distinct substrate-specific GO term is needed.
      supported_by:
        - reference_id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
          supporting_text: It is 82% identical to the experimentally studied P. aeruginosa ortholog CdhC (PA5387)
        - reference_id: UniProtKB:Q9HTH7
          supporting_text: Catalyzes the condensation of dehydrocarnitine and acetyl-CoA
        - reference_id: file:PSEPK/PP_0303/PP_0303-goa.tsv
          supporting_text: "GO:0043720\t3-keto-5-aminohexanoate cleavage activity"
  - term:
      id: GO:0042413
      label: carnitine catabolic process
    evidence_type: ISS
    original_reference_id: PMID:19406895
    qualifier: involved_in
    review:
      summary: Conserved-locus evidence supports a role in carnitine catabolism.
      action: NEW
      reason: >-
        PP_0303 is the KT2440 ortholog of CdhC in the experimentally defined
        Pseudomonas carnitine-catabolism locus.
      supported_by:
        - reference_id: UniProtKB:Q9HTH7
          supporting_text: Is involved in a L-carnitine degradation pathway
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: UniProtKB:Q9HTH7
    title: Reviewed Pseudomonas aeruginosa CdhC entry
    findings:
      - statement: Defines EC 2.3.1.317 and RHEA:47044 for 3-dehydrocarnitine cleavage.
  - id: PMID:24240508
    title: Revealing the hidden functional diversity of an enzyme family.
    findings:
      - statement: Provides experimental support for the CdhC reaction assigned to Q9HTH7.
  - id: PMID:19406895
    title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
    findings:
      - statement: Establishes the conserved locus as required for carnitine catabolism.
  - id: file:PSEPK/PP_0303/PP_0303-uniprot.txt
    title: UniProtKB record for PP_0303
    findings:
      - statement: Identifies Q88R31 as a dehydrocarnitine cleavage enzyme in the KT2440 locus.
  - id: file:PSEPK/PP_0303/PP_0303-goa.tsv
    title: QuickGO annotations for PP_0303
    findings:
      - statement: Contains the single annotation reviewed here.
  - id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
    title: OpenScientist deep research report for PP_0303
    findings:
      - statement: >-
          Supports the CdhC assignment through 82% identity to the studied
          P. aeruginosa ortholog, conserved catalytic residues, and locus context,
          while noting that PP_0303 itself has not been assayed directly.
core_functions:
  - description: >-
      Transfer of the trimethylamine-containing fragment of
      3-dehydrocarnitine to acetyl-CoA, forming betainyl-CoA and acetoacetate.
    directly_involved_in:
      - id: GO:0042413
        label: carnitine catabolic process
    supported_by:
      - reference_id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
        supporting_text: The chief caveat is that PP_0303 itself has not been purified and assayed
      - reference_id: UniProtKB:Q9HTH7
        supporting_text: Catalyzes the condensation of dehydrocarnitine and acetyl-CoA
proposed_new_terms:
  - proposed_name: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
    proposed_definition: >-
      Catalysis of the reaction 3-dehydrocarnitine + acetyl-CoA =
      N,N,N-trimethylglycyl-CoA + acetoacetate.
    justification: >-
      The exact EC 2.3.1.317/RHEA:47044 activity is experimentally established,
      while GO:0043720 describes another substrate in the diverse BKACE family.
    proposed_parent:
      id: GO:0016740
      label: transferase activity
    supported_by:
      - reference_id: UniProtKB:Q9HTH7
        supporting_text: Catalyzes the condensation of dehydrocarnitine and acetyl-CoA
suggested_questions:
  - question: Does purified PP_0303 have the same substrate profile and zinc dependence as Q9HTH7?
suggested_experiments:
  - description: Reconstitute the PP_0303 reaction with 3-dehydrocarnitine and acetyl-CoA and quantify both products by LC-MS.
    experiment_type: in vitro enzyme assay
