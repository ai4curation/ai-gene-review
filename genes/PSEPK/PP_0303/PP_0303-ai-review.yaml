  qualifier: enables
  review:
    summary: Target-specific screening signals prevent rejection, but the KAH positive-call threshold
      is unresolved.
    action: UNDECIDED
    reason: PMID:24240508 Dataset 2 maps Q88R31 (KT2440 PP_0303) to BKACE_511; Dataset 4 includes BKACE511
      with dehydrocarnitine screening values 146.407/237.1 and (S)-KAH values 50.55/81.021. These are
      pre-process screen values, not target kinetic constants. The supplemental statistical description
      requires a substrate-specific cutoff, which was not recovered from accessible main text. Thus the
      previous categorical wrong-substrate interpretation is unwarranted, but a confirmed KAH activity
      or native lysine-degradation role cannot be asserted from these values alone. Keep UNDECIDED pending
      the processed KAH call or complete assay analysis; the carnitine role has independent conserved-locus,
      target-screen and characterized-ortholog support.
