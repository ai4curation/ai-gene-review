  - statement: Data Set 2 maps Q88R31 to BKACE_511, and Data Set 4 reports target-specific screening signals
      with dehydrocarnitine and (S)-KAH. This corrects the prior claim that PP_0303 was unassayed.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Protected abstract-only cache unchanged; publisher supplementary PDF and Data Sets 2/4
      consulted. Q88R31 is BKACE_511 and is present in the screen, including KAH and dehydrocarnitine
      columns. These pre-process values do not supply target kinetic constants or the processed substrate-specific
      positive calls. The unrelated Table 6 G5 kinetic constants must not be attributed to PP_0303.
- id: PMID:19406895
  title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
  findings:
