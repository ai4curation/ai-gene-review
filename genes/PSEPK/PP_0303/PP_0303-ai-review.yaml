id: Q88R31
gene_symbol: PP_0303
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0303 encodes the CdhC-type 3-dehydrocarnitine:acetyl-CoA trimethylamine
  transferase of the Pseudomonas putida KT2440 L-carnitine catabolic locus, a
  beta-keto acid cleavage enzyme (BKACE family). By orthology with the
  characterized P. aeruginosa CdhC (82% identity) and S. meliloti BcoG, it
  condenses 3-dehydrocarnitine with acetyl-CoA to form betainyl-CoA and
  acetoacetate, between the LcdH dehydrogenase and the CdhB-type thioesterase
  PP_0301. The KT2440 protein itself has not been assayed.
existing_annotations:
  - term:
      id: GO:0043720
      label: 3-keto-5-aminohexanoate cleavage activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This beta-keto acid family term assigns the wrong physiological substrate.
      action: MODIFY
      reason: >-
        PP_0303 lies beside lcdH and the CdhB-type thioesterase and is the
        ortholog of characterized P. aeruginosa CdhC, which uses
        3-dehydrocarnitine and acetyl-CoA (RHEA:47044), not
        3-keto-5-aminohexanoate. The substrate-specific term is incorrect, but
        the acyltransferase parent is valid.
      proposed_replacement_terms:
        - id: GO:0016747
          label: acyltransferase activity, transferring groups other than amino-acyl groups
      supported_by:
        - reference_id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
          supporting_text: It is 82% identical to the experimentally studied P. aeruginosa ortholog CdhC (PA5387)
        - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: >-
            Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
            + acetoacetate;
      source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          slot: GO ID
          requested_change: REPOINT
          asserted_value: GO:0043720
          corrected_value: GO:0016747
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            InterPro2GO maps IPR008567 (BKACE) to the substrate-specific
            3-keto-5-aminohexanoate cleavage activity, although the family is
            substrate-diverse and the CdhC orthologs act on 3-dehydrocarnitine.
  - term:
      id: GO:0042413
      label: carnitine catabolic process
    evidence_type: ISS
    original_reference_id: PMID:19406895
    qualifier: involved_in
    review:
      summary: Orthology and conserved-locus evidence support a role in carnitine catabolism.
      action: NEW
      reason: >-
        PP_0303 is the KT2440 ortholog of CdhC, which performs the cleavage step
        of carnitine breakdown in P. aeruginosa and whose disruption abolishes
        growth on carnitine.
      supported_by:
        - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Is involved in a L-carnitine degradation pathway that allows
            P.aeruginosa to grow on L-carnitine as the sole source of carbon
            and nitrogen (PubMed:19406895).
        - reference_id: PMID:19406895
          supporting_text: >-
            The PA5388-PA5384 region contains the predicted P. aeruginosa
            carnitine dehydrogenase homologue along with other genes required for
            growth on carnitine.
        - reference_id: file:PSEPK/PP_0303/PP_0303-deep-research-openscientist.md
          supporting_text: It is 82% identical to the experimentally studied P. aeruginosa ortholog CdhC (PA5387)
