status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_0303 is a 294-residue CdhC-type beta-keto acid cleavage enzyme in the Pseudomonas putida
  KT2440 carnitine catabolic locus. Its sequence is approximately 82% identical to P. aeruginosa CdhC,
  and its placement beside LcdH and the CdhB-type thioesterase supports a role converting 3-dehydrocarnitine
  and acetyl-CoA into betainyl-CoA and acetoacetate. The target protein occurs in a published enzyme screen
  with dehydrocarnitine and additional substrates; its complete substrate-specific kinetic profile and
  physiological alternatives remain unresolved.
