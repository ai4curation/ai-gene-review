core_functions:
- description: Transfer of the betainyl fragment of 3-dehydrocarnitine to CoA from acetyl-CoA, forming
    betainyl-CoA and acetoacetate (EC 2.3.1.317, by orthology).
  proposed_molecular_function: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
  directly_involved_in:
  - id: GO:0042413
    label: carnitine catabolic process
  supported_by:
  - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA + acetoacetate;
  - reference_id: file:analysis/module_audits/bacterial_l_carnitine_catabolism/psepk-consultation/evidence.md
proposed_new_terms:
- proposed_name: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
  proposed_definition: 'Catalysis of the reaction: 3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
    + acetoacetate.'
  justification: EC 2.3.1.317/RHEA:47044 specifies the dehydrocarnitine reaction supported by characterized
    ortholog chemistry, conserved locus context and target screening. GO:0043720 names another substrate
    and cannot represent this core reaction even if the enzyme also shows KAH promiscuity.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA + acetoacetate;
suggested_questions:
- question: What processed positive/negative call and substrate-specific cutoff were applied to the BKACE511
    (S)-KAH screen, and was its secondary activity confirmed independently?
- question: Does purified PP_0303 have the same substrate profile and zinc dependence as Q9HTH7?
suggested_experiments:
- description: Reconstitute the PP_0303 reaction with 3-dehydrocarnitine and acetyl-CoA and quantify both
    products by LC-MS.
  experiment_type: in vitro enzyme assay
