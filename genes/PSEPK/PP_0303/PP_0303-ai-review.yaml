  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; full PMC Results/Table 1 inspected. PAO1 cdhC insertion
      and PA14 cdhCA double deletion support the catabolic locus; the NADH assay is not a purified CdhC
      substrate-specificity assay.
