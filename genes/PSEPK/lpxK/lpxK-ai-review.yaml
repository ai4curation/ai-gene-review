id: Q88LM9
gene_symbol: lpxK
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LpxK is an ATP-dependent tetraacyldisaccharide 4'-kinase that
  phosphorylates lipid A disaccharide 1-phosphate to form lipid IVA during lipid A
  biosynthesis.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is the phosphate donor used by LpxK.
    action: ACCEPT
    reason: ATP binding is integral to the kinase reaction and is supported by the LpxK P-loop NTPase family assignment.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: LpxK acts at the inner membrane on a lipid-linked substrate.
    action: ACCEPT
    reason: Membrane localization is phylogenetically supported and is coherent with the hydrophobic lipid A disaccharide substrate.
- term:
    id: GO:0009029
    label: lipid-A 4'-kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term precisely describes ATP-dependent phosphorylation of lipid A disaccharide at the 4' position.
    action: ACCEPT
    reason: The exact activity is supported by LpxK-specific HAMAP, InterPro, NCBIfam, and PANTHER signatures and the UniProt catalytic reaction.
- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: LpxK makes lipid IVA within lipid A biosynthesis, not the oligosaccharide core region of lipopolysaccharide.
    action: REMOVE
    reason: This TreeGrafter process assignment crosses from lipid A assembly into the distinct downstream LPS core-region biosynthetic process.
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LpxK catalyzes the final phosphorylation step producing lipid IVA.
    action: ACCEPT
    reason: Lipid A biosynthesis is the direct pathway context of LpxK.
core_functions:
- description: Uses ATP to phosphorylate lipid A disaccharide 1-phosphate at the 4' position, producing lipid IVA at the inner membrane.
  molecular_function:
    id: GO:0009029
    label: lipid-A 4'-kinase activity
  directly_involved_in:
  - id: GO:0009245
    label: lipid A biosynthetic process
  locations:
