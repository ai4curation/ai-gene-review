id: Q88MZ4
gene_symbol: sdhE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'SdhE is the conserved cytoplasmic FAD assembly factor for succinate dehydrogenase in Pseudomonas putida KT2440. It promotes covalent attachment of FAD to the SdhA flavoprotein subunit before assembly of respiratory complex II and may also act on other flavinylated proteins. SdhE is an assembly factor rather than a stoichiometric SdhABCD subunit.'
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is correct; this IEA is redundant with the curator-reviewed ISS cytoplasm annotation rather than wrong.
      action: ACCEPT
      reason: GO_REF:0000044 maps the UniProt SUBCELLULAR LOCATION line, which is itself ECO:0000250|UniProtKB:G4V4G2, so it is not independent of the ISS annotation but derives from the same orthology transfer. The localization it asserts is correct, so the annotation is retained; duplication with the ISS row is a redundancy for GOA to resolve, not grounds for removal.
  - term:
      id: GO:0006105
      label: succinate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: SdhE is required for succinate oxidation by complex II, but only indirectly - it matures SdhA rather than acting on succinate itself.
      action: KEEP_AS_NON_CORE
      reason: SdhE is the FAD assembly factor required for SdhA flavinylation, so deleting it abolishes succinate oxidation. That is a downstream consequence of the maturation step, not a reaction SdhE performs; the direct function is covalent FAD attachment to SdhA (GO:0018293), which is what core_functions now records. Retained as a true but non-core pathway-level term.
      supported_by:
      - reference_id: PMID:22474332
        supporting_text: SdhE was required for growth on succinate as a sole carbon source and for the function, but not stability, of succinate dehydrogenase
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: ISS
    original_reference_id: GO_REF:0000024
    qualifier: located_in
    review:
      summary: SdhE is a soluble cytoplasmic assembly factor that acts on folded SdhA before holoenzyme assembly.
      action: ACCEPT
      reason: Supported by the reviewed UniProt localization and curator-reviewed orthology transfer.
      supported_by:
      - reference_id: PMID:22474332
        supporting_text: The bacterial SdhE is a soluble monomer that interacted weakly and/or transiently with SdhA.
  - term:
      id: GO:0018293
      label: protein-FAD linkage
    evidence_type: ISS
    original_reference_id: PMID:22474332
    qualifier: involved_in
    review:
      summary: Covalent attachment of FAD to the SdhA flavoprotein is the step SdhE itself performs, and it is currently absent from the PSEPK GOA record.
      action: NEW
      reason: >-
        GOA records only the downstream pathway term GO:0006105 for this protein, leaving the
        direct activity unannotated. The orthologous eukaryotic assembly factor carries exactly
        this term - human SDHAF2 has GO:0018293 by IMP from PMID:19628817 - and PSEPK sdhE is
        in the same Pfam Sdh5 / InterPro SdhE_FAD_assembly_factor family, so the term is the
        established convention for this factor family rather than a novel extension of it.
        SdhE performs the work of the linkage (it binds FAD and is required for its
        incorporation into SdhA) rather than being the substrate of it, so involved_in is
        warranted. Proposed at ISS strength because the experiment was done in the Serratia
        ortholog, not in KT2440.
      supported_by:
      - reference_id: PMID:22474332
        supporting_text: SdhE interacted with the flavoprotein SdhA, directly bound the flavin adenine dinucleotide co-factor, and was required for the flavinylation of SdhA.
      - reference_id: file:PSEPK/sdhE/sdhE-uniprot.txt
        supporting_text: Required for flavinylation (covalent attachment of FAD) of the flavoprotein subunit SdhA of SDH
references:
  - id: GO_REF:0000024
    title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment of sequence similarity
    findings: []
  - id: GO_REF:0000044
    title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied by conservative changes to GO terms applied by UniProt
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: PMID:22474332
    title: SdhE is a conserved protein required for flavinylation of succinate dehydrogenase in bacteria
    findings:
      - statement: SdhE binds FAD, interacts with the flavoprotein SdhA, and is required for flavinylation of SdhA; this is the first protein shown to be required for FAD incorporation in bacteria, contradicting the prior autocatalytic-flavinylation model.
        reference_section_type: RESULTS
        supporting_text: SdhE interacted with the flavoprotein SdhA, directly bound the flavin adenine dinucleotide co-factor, and was required for the flavinylation of SdhA.
      - statement: Loss of sdhE blocks growth on succinate and abolishes succinate dehydrogenase function without destabilising the complex, showing that SdhE acts on cofactor maturation rather than on assembly or on succinate itself.
        reference_section_type: RESULTS
        supporting_text: SdhE was required for growth on succinate as a sole carbon source and for the function, but not stability, of succinate dehydrogenase
      - statement: The pleiotropy of sdhE deletion suggests SdhE may act as a cofactor chaperone for flavoproteins beyond SdhA, which is the experimental basis for the UniProt "and other flavinylated proteins as well" claim currently carried only as an ECO:0000250 by-similarity transfer.
        reference_section_type: DISCUSSION
        supporting_text: SdhE might have co-factor chaperone-like functions to assist FAD incorporation into other flavoproteins.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: McNeil et al., J Biol Chem 2012;287:18418-28; full text cached. Serratia/E. coli SdhE, the characterised ortholog of PSEPK Q88MZ4 (same SdhE FAD assembly factor family). Supplies the primary experimental grounding for FAD binding, SdhA interaction, flavinylation dependence and the soluble cytoplasmic behaviour that UniProt Q88MZ4 carries only as ECO:0000250|UniProtKB:G4V4G2.
core_functions:
  - description: Cytoplasmic FAD assembly factor that binds FAD and interacts with the unflavinylated SdhA flavoprotein, licensing covalent attachment of FAD to SdhA before complex II assembles. SdhE is catalytically inert with respect to succinate and is not a stoichiometric SdhABCD subunit; the pleiotropy of sdhE loss suggests it may assist FAD incorporation into other flavoproteins as well.
    molecular_function:
      id: GO:0044183
      label: protein folding chaperone
    directly_involved_in:
      - id: GO:0018293
        label: protein-FAD linkage
    locations:
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - reference_id: PMID:22474332
        supporting_text: SdhE interacted with the flavoprotein SdhA, directly bound the flavin adenine dinucleotide co-factor, and was required for the flavinylation of SdhA.
      - reference_id: PMID:22474332
        supporting_text: Our results contradict this autocatalytic flavinylation model and show that SdhE proteins are required for the incorporation of FAD into SdhA.
      - reference_id: PMID:22474332
        supporting_text: The bacterial SdhE is a soluble monomer that interacted weakly and/or transiently with SdhA.
      - reference_id: file:PSEPK/sdhE/sdhE-uniprot.txt
        supporting_text: Required for flavinylation (covalent attachment of FAD) of the flavoprotein subunit SdhA of SDH
suggested_questions:
  - question: Does P. putida KT2440 SdhE flavinylate substrates other than SdhA, and how strong is the residual SdhA autocatalytic flavinylation in its absence?
suggested_experiments:
  - description: Delete sdhE and quantify SdhA covalent FAD loading, SdhABCD activity, respiratory growth on succinate, and flavinylation of other candidate substrates.
