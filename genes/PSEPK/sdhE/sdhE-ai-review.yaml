taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: 'SdhE is the conserved cytoplasmic FAD assembly factor for succinate dehydrogenase in Pseudomonas putida KT2440. It promotes covalent attachment of FAD to the SdhA flavoprotein subunit before assembly of respiratory complex II and may also act on other flavinylated proteins. SdhE is an assembly factor rather than a stoichiometric SdhABCD subunit.'
