  findings:
  - statement: The report found no direct biochemical characterization of the exact KT2440 protein.
    supporting_text: No direct biochemical characterization of the KT2440 protein itself.
    reference_section_type: CONCLUSIONS
  - statement: The report treats the GSNO-reductase role as a conserved-family inference that has not been demonstrated directly in KT2440.
    supporting_text: GSNO-reductase role not experimentally demonstrated in KT2440.
    reference_section_type: CONCLUSIONS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The family-level reaction synthesis is useful, but target-specific
      localization, oligomeric-state, kinetic, and pathway-source claims were
      not imported without direct KT2440 evidence.
- id: PMID:21261833
  title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The full-text KT2440 study directly supports formaldehyde induction and a formaldehyde-sensitive PP_1616 mutant phenotype, but not the exact FrmA reaction.
  findings:
  - statement: PP_1616 was induced 9.2-fold by formaldehyde, and its insertion mutant failed to grow in 1.5 mM formaldehyde; this establishes physiological relevance without directly assaying the proposed enzyme chemistry.
