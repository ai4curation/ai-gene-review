description: >-
  GuaB (PP_1031) is inosine-5'-monophosphate dehydrogenase. It oxidizes IMP to
  XMP with NAD+, providing the committed first reaction of guanine nucleotide
  synthesis upstream of the GuaA-catalyzed formation of GMP.
