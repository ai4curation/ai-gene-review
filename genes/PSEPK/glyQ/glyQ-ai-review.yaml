id: Q88RR8
gene_symbol: glyQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GlyQ is the alpha subunit of the bacterial alpha2-beta2 glycyl-tRNA synthetase, paired with
  GlyS. Its class-II catalytic architecture recognizes glycine and ATP, while cooperation with the beta
  subunit stabilizes substrate coordination and enables efficient tRNA(Gly) aminoacylation in the cytosol.
