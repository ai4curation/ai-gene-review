  title: X-shaped structure of bacterial heterotetrameric tRNA synthetase suggests cryptic prokaryote
    functions and a rationale for synthetase classifications.
  findings:
  - statement: EcGlyRS structure and functional assays show that the beta subunit contributes ATP coordination
      as well as tRNA recognition. The substrate-bound structure uses a beta-terminal truncation, so do
      not describe every structural observation as full-length native KT2440.
