- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Logical inference from GO:0008137 to proton transmembrane transport.
    action: KEEP_AS_NON_CORE
    reason: >-
      Protons are translocated by the membrane arm; NuoF has no transmembrane segment.
      It supplies the input of the coupled reaction (NADH-derived electrons whose
      transfer to quinone drives pumping), so its involvement is real but peripheral
      to the translocation itself. Same judgement as the E. coli NuoF review.
    supported_by:
    - reference_id: file:ECOLI/nuoF/nuoF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Couples the redox reaction to proton translocation (for every
        two electrons transferred, four hydrogen ions are translocated across the
        cytoplasmic membrane), and thus conserves the redox energy in a proton
        gradient.
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: ISS
  original_reference_id: PMID:19061856
  review:
    summary: >-
      NuoF catalyses the NADH-oxidation half-reaction at its FMN (subunit-level
      activity), by orthology to E. coli NuoF.
    action: NEW
    reason: >-
      The subunit's own chemistry is NADH oxidation with an unspecified acceptor
      (its FMN), the part of the complex I reaction attributable to a single subunit.
      PAINT asserts GO:0003954 at the bacterial NuoF node seeded by E. coli NuoF, and
      E. coli NuoF variants at the nucleotide site change NADH oxidation kinetics.
      P. putida NuoF shares the NADH-, FMN- and N3-binding signatures. This is the
      NuoF leaf function of the bacterial complex I module.
    supported_by:
    - reference_id: PMID:19061856
      supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
        FMN-binding NuoF subunit of E. coli Complex I decreased NADH oxidation
        activity 2.5-4.8 times
    - reference_id: file:PSEPK/nuoF/nuoF-deep-research-openscientist.md
      supporting_text: NuoF's specific contribution is the **NADH‑oxidation half‑reaction**
