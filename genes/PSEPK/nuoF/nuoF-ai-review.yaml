    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Retain the complex-level catalytic term but correct `enables` to `contributes_to`.
      action: MODIFY
      reason: NuoF directly performs the NADH-oxidation half-reaction at FMN and is the catalytic entry subunit of NADH:quinone oxidoreductase. The full quinone-reduction reaction remains a property of assembled complex I, so contributes_to is the most precise qualifier even though the term itself is appropriate.
