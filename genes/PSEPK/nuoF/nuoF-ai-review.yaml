  review:
    summary: >-
      InterPro2GO mapping from the complex I 51 kDa subunit signatures to the
      complex-level NADH:ubiquinone activity.
    action: ACCEPT
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: OTHER
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        NADH dehydrogenase (ubiquinone) activity (GO:0008137) is the reaction of the assembled
        respiratory complex I (NDH-1). nuoF is a subunit that contributes to that activity and
        does not catalyse it on its own, so by the GO convention for complex subunits this IEA row
        (assigned by InterPro) should carry contributes_to rather than enables.
    reason: >-
      Correct for the complex: P. putida NuoF carries the complex I 51 kDa subunit
      signatures (NCBIfam nuoF_fam, Pfam Complex1_51K, PROSITE COMPLEX1_51K) and the
      curated UniRule function statement for NDH-1. The quinone-reducing,
      proton-pumping reaction needs the whole complex, so the claim is read as a
      contribution, while the NuoF-specific activity is NADH oxidation (GO:0003954,
      NEW below); this matches the E. coli NuoF review. The earlier MODIFY that
      proposed the identical term only to change the qualifier is withdrawn
      (qualifier changes are not term replacements).
