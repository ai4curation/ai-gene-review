taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoF (PP_4123) is the 453-residue NADH-oxidising flavoprotein of the
  proton-pumping NADH:quinone oxidoreductase NDH-1 (respiratory complex I) of
  Pseudomonas putida, orthologous to Escherichia coli NuoF, Thermus/Paracoccus
  Nqo1 and the mitochondrial 51 kDa subunit NDUFV1. It carries the NADH-binding
  site, a non-covalently bound FMN and one [4Fe-4S] cluster (N3; ligands Cys361,
  Cys364, Cys367, Cys408). NADH transfers a hydride to the FMN, which passes
  electrons one at a time to N3 and down the iron-sulfur wire of the peripheral arm
  to the quinone site, where quinone reduction drives proton pumping by the
  membrane arm. With NuoE and NuoG it forms the NADH dehydrogenase (N) module at
  the tip of the peripheral arm, held at the cytoplasmic membrane by the rest of
  the complex; it is the electron-entry subunit of NDH-1 in the respiratory chain.
