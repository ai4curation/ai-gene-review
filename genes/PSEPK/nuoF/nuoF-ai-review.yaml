suggested_questions:
- question: >-
    Under which growth conditions does P. putida KT2440 rely on NDH-1 rather than
    its non-electrogenic NDH-2 enzymes for NADH reoxidation, and does nuoF loss
    change NADH/NAD+ balance during aromatic-compound catabolism?
suggested_experiments:
- description: >-
    Construct a clean nuoF deletion in KT2440 and measure membrane
    deamino-NADH:quinone oxidoreductase activity, proton-motive force, growth on
    glucose versus succinate, and intracellular NADH/NAD+ ratios.
  experiment_type: genetic
