taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Apt (PP_4266) is the adenine phosphoribosyltransferase of the purine salvage
  pathway. It transfers a phosphoribosyl group from PRPP to adenine to form AMP
  and diphosphate, returning preformed adenine to the adenylate pool. The KT2440
  assignment is supported by the reviewed UniProt entry, HAMAP rule MF_00004,
  Rhea reaction 16609, and the adenine phosphoribosyltransferase family rather
  than by a direct biochemical study of this protein.
