  - id: file:PSEPK/apt/apt-deep-research-openscientist.md
    title: OpenScientist functional review of PSEPK apt
    findings:
      - statement: >-
          The report independently recovers Q88F33 as the type I adenine
          phosphoribosyltransferase responsible for adenine-to-AMP salvage.
        supporting_text: >-
          encodes **adenine phosphoribosyltransferase (APRT, EC 2.4.2.7)**
      - statement: >-
          No target-specific structure, kinetics, or knockout phenotype was
          found for Q88F33, so ortholog-derived mechanistic and physiological
          details were not treated as KT2440 evidence.
        supporting_text: >-
          There is no published crystal structure, kinetic characterization,
          or knockout phenotype study for the PP_4266 gene product itself.
    reference_review:
      relevance: MEDIUM
      correctness: MISCITED
      review_notes: >-
        The report correctly identifies the target and exact salvage reaction,
        but presents ortholog-derived oligomeric, mechanistic, MTAN-coupling,
        essentiality, and toxic-analog claims as target-level conclusions.
        Those stronger claims were not imported.
