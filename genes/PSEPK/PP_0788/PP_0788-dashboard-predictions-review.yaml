description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_CAKNDZ010000038.1_57 (737 aa, tier A, Dark-Function stratum) is "DUF1631
  family protein associated with motility and tolerance to nitrate, choline
  chloride, and bacitracin stress." The dashboard's GO extractor drew no GO terms
  from this call, so there are no term predictions to score. The exact-sequence
  UniProt entries are deleted, so the call is filed on KT2440 PP_0788 (Q88PR0).
  Q88PR0 is 94.7% identical over 717 aligned residues and differs only in a
  non-conserved N-terminal leader: 36 residues before the conserved RTPHPCLP motif
  in the query versus 18 in PP_0788. GOA for Q88PR0 is empty.

  The family part of the call is correct: the query's only InterProScan domain is
  DUF1631 (PF07793, 40-731). The call was also right to reject both enzymatic
  labels in its evidence. "Thymidine phosphorylase" is a propagated ProtNLM or
  legacy gene-description name, and Q88PR0 lacks the glycosyltransferase family 3
  domains of real thymidine phosphorylases. COG1570 (XseA) is contradicted by a
  genuine XseA (PP_1027) in KT2440. The phenotype part is weaker than its tier A
  wording suggests. Every phenotype comes from one 53.6%-identical ortholog, P.
  simiae WCS417 GFF773. Its motility defect recurs across five soft-agar
  experiments (fitness -1.13 to -1.85). Its stress defects are single experiments
  of moderate size (nitrate 200 mM -1.64, choline chloride 300 mM -1.56,
  bacitracin -1.30), and none is a Fitness Browser "specific phenotype". They do
  not replicate across orthologs: the S. stutzeri RCH2 ortholog is fitter in
  nitrate 250 mM (+1.67). KT2440 PP_0788 itself has no phenotype in 300
  experiments, but KT2440 was never assayed for motility or nitrate stress.
  Transposon insertions could also be polar on the co-directional ampD-ampE genes
  88 bp downstream.

  The call omits the strongest direct evidence for the KT2440 gene, which was in
  its own PaperBLAST panel: direct repression by FleQ/c-di-GMP (PMID:33975969).
  Recommended dashboard verdict: supported for the DUF1631 family assignment and
  for not naming an activity. The phenotype clause would be better as "reduced
  motility of a P. simiae ortholog mutant". Suggested annotation: "DUF1631 family
  protein of unknown function; FleQ/c-di-GMP-repressed; orthologue mutant
  (P. simiae) impaired in swimming motility". The empty GO set is appropriate: no
  GO process term for motility would be justified from transposon fitness of an
  ortholog alone.
