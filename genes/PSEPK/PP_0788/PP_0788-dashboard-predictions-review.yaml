  findings:
  - statement: All stress phenotypes the call cites come from the P. simiae WCS417 homolog at 53.6% identity.
    supporting_text: 'Disruption of the 53.6%-identical Pseudomonas simiae homolog impairs motility and fitness under nitrate, choline chloride, and bacitracin stress.'
- id: file:PSEPK/PP_0788/PP_0788-bioinformatics/RESULTS.md
  title: 'PP_0788 bioinformatics: identity to the dashboard protein, start codon, and Fitness Browser data via BERDL'
  findings:
  - statement: Ortholog stress phenotypes are inconsistent; reduced motility is the most reproducible signal.
    supporting_text: So "nitrate tolerance" goes in opposite directions in the two Pseudomonads where it was measured.
  - statement: KT2440 PP_0788 has no fitness phenotype.
    supporting_text: No experiment has |fit| >= 1 and |t| >= 4, and there is no specific phenotype.
- id: PMID:33975969
  title: Identification of c-di-GMP/FleQ-Regulated New Target Genes, Including cyaA, Encoding Adenylate Cyclase, in Pseudomonas putida.
  findings:
  - statement: c-di-GMP/FleQ directly represses PP_0788 transcription.
    supporting_text: c-di-GMP/FleQ inhibited the transcription of PP_0788 and cyaA and promotes the transcription of PP_0681, lapE, and PP_5586.
