- id: PMID:33975969
  title: Identification of c-di-GMP/FleQ-Regulated New Target Genes, Including cyaA, Encoding Adenylate Cyclase, in Pseudomonas putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct KT2440 study of PP_0788: transcriptomics, EMSA, bacterial one-hybrid,
      DNase I footprinting and promoter fusions show FleQ binds the PP_0788 promoter
      and c-di-GMP/FleQ represses it. The protein itself was not characterized.
  findings:
  - statement: c-di-GMP/FleQ directly represses PP_0788 transcription.
    supporting_text: c-di-GMP/FleQ inhibited the transcription of PP_0788 and cyaA and promotes the transcription of PP_0681, lapE, and PP_5586.
  - statement: The function of PP_0788 is unknown.
    supporting_text: The remaining three target genes, PP_0681, PP_0788, and PP_5586, encode hypothetical proteins with unknown functions.
- id: PMID:35706385
  title: Genome-wide identification of fitness determinants in the Xanthomonas campestris bacterial pathogen during early stages of plant infection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Characterizes XC_3388, a distant DUF1631 family member in X. campestris.
      Gives family-level context only; identity to PP_0788 was not determined here.
  findings:
  - statement: Deletion of the X. campestris DUF1631 protein XC_3388 is pleiotropic, including hypermotility.
    supporting_text: The ΔXC_3388 mutant displayed pleiotropic physiological alterations including hypermotility on swimming plates, reduced extracellular amylase activity, low EPS production and disturbed biofilm formation
  - statement: No molecular function is known for DUF1631.
    supporting_text: XC_3388 possesses a domain of unknown function, DUF1631, for which no information is available.
- id: PMID:39608507
  title: Functional characterization, transcriptome and metabolome analyses reveal that pacR possesses multifaceted physiological roles in Xanthomonas campestris pathovar campestris.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Distant DUF1631 family member (PacR) in X. campestris; pleiotropic mutant phenotypes, no molecular activity.
  findings:
  - statement: A pacR (DUF1631) mutant is defective in attachment, EPS production and virulence.
    supporting_text: had decreased bacterial attachment, exopolysaccharide production, hypersensitive response and virulence.
