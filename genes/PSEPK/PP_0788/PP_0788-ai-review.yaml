knowledge_gaps:
- gap_statement: >-
    The molecular activity of DUF1631 proteins, including PP_0788, is unknown. The
    protein has no recognizable catalytic motif, no characterized family member, and
    no KT2440 fitness phenotype under the conditions tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    PP_0788 is a direct FleQ/c-di-GMP target, and DUF1631 mutants in Pseudomonas
    simiae and Xanthomonas have motility and envelope-stress phenotypes, so the family
    may be an unrecognized component of lifestyle switching.
  provenance:
  - reference_id: PMID:33975969
    supporting_text: The remaining three target genes, PP_0681, PP_0788, and PP_5586, encode hypothetical proteins with unknown functions.
  - reference_id: PMID:35706385
    supporting_text: XC_3388 possesses a domain of unknown function, DUF1631, for which no information is available.
- gap_statement: >-
    It is untested whether loss of PP_0788 affects swimming motility or biofilm
    formation in KT2440, or whether the P. simiae WCS417 ortholog's motility and stress
    phenotypes are intrinsic or arise from polar effects on the downstream ampD-ampE genes.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
