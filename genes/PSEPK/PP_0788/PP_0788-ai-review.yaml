knowledge_gaps:
- gap_statement: >-
    The molecular activity of DUF1631 proteins, including PP_0788, is unknown. The
    protein has no recognizable catalytic motif, no characterized family member, and
    no KT2440 fitness phenotype under the conditions tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  boundary: >-
    An OpenScientist run (kgap-pp0788-duf1631-activity) carries out the Foldseek search this review had
    proposed as an experiment, and returns a clear negative on catalysis with one assignable fold. It also
    refutes the premise of the hypothesis that was sent to it, and the error there was mine rather than
    the run's or this review's: the prompt supposed that a single domain of unknown function in a large
    protein usually sits beside something informative, whereas this review's description already records
    that the entire protein is DUF1631 and nothing else. The run confirms that independently and
    quantifies it: the four tandem modules cover 523 of 719 residues at the boundaries the local Q88PR0
    record carries, PF07793 at 25-217, PF26671 at 285-433, PF26672 at 465-578 and PF26670 at 630-696, and
    1965 of 2720 PF07793 proteins in UniProt, 72 per cent, have exactly that architecture and nothing
    else, so there is no intramolecular partner to read a function from in this family at all. The
    simplest alternative reading is also excluded: a Smith-Waterman self-comparison shows the four modules
    are not copies of one repeat, all six pairwise z-scores falling between -0.99 and +0.96 against
    shuffled nulls, so a TPR- or HEAT-like solenoid scaffold is not available either. On fold, the three
    N-terminal all-alpha modules return no significant Foldseek match against either pdb100 or
    AFDB-SwissProt, and only the C-terminal region 585-719 is assignable, as a Royal-superfamily Tudor
    beta-barrel at probability 0.975 to 1.0. Every significant match in the whole search falls in one
    class, nucleic-acid-binding or methyl-mark-reading beta-barrels: no Rossmann or P-loop
    nucleotide-binding fold, no enzymatic fold, and no catalytic triad, metal site or phosphate-binding
    constellation anywhere in the model. A measurement then removes the methyl-reader reading as well: the
    PP_0788 Tudor carries four aromatics and no three-ring cage at any threshold, matching the two
    bacterial ProQ domains and separating it from five eukaryotic readers that have six to thirty
    aromatics and cages at 3.9 to 6.8 Angstrom. What survives is generic macromolecule binding, with RNA
    binding as a ProQ-based analogy and nothing to test it; the run notes that ProQ's principal
    RNA-binding surface is in its FinO-like N-terminal domain, which PP_0788 does not have. The ProtNLM
    name is refuted directly rather than by argument: thymidine phosphorylase is represented in the PDB by
    dozens of structures and Foldseek returns no hit to any of them at any significance, with no
    nucleoside-phosphorylase fold and no pyrimidine- or phosphate-binding site in any of the four modules.
    The artefact is widespread, 560 of 2720 family members carrying that name against 1114 named DUF1631
    domain-containing protein, so it is a naming block and not a judgement about this protein; PP_0788 is
    the only DUF1631 protein in KT2440, so paralogue confusion within the organism is not its source. The
    family-level convergence on c-di-GMP signalling is reproduced from three further angles, and the run
    is careful to say it is a family signal and not a PP_0788 signal, since PP_0788 itself carries no
    GGDEF, EAL or PilZ domain: 190 of 2720 family members are natively fused to one of those modules,
    roughly 70-fold above the UniProt background for GGDEF and spread across more than 20 genera, a PilZ
    gene recurs within two genes of the DUF1631 gene in 6 of 63 genomes against none in a matched distal
    control, and the one experimental line comes from another genus and hedges with possibly. That
    convergence is corroborated by a stronger organism-specific fact the run did not have, already
    recorded in this review: PP_0788 is a direct FleQ target in KT2440. Finally, the absence of annotation
    is confirmed as real rather than as a gap in our copy of it: QuickGO returns zero annotations of any
    kind, not even IEA, for Q88PR0 and for the P. aeruginosa and X. campestris representatives alike,
    which matches the header-only GOA file here, and no phenotype, interaction or expression measurement
    exists for PP_0788 or for any Pseudomonas DUF1631 protein. Every structural statement rests on an
    AlphaFold model, since no DUF1631 structure exists in the PDB, so the activity class remains
    unassignable: the strongest defensible statement is a binding module, probably
    nucleic-acid-associated, on fold similarity alone, and no molecular function should be asserted.
  status: NARROWING
  significance: >-
    PP_0788 is a direct FleQ/c-di-GMP target, and DUF1631 mutants in Pseudomonas
    simiae and Xanthomonas have motility and envelope-stress phenotypes, so the family
    may be an unrecognized component of lifestyle switching.
  provenance:
  - reference_id: PMID:33975969
    supporting_text: The remaining three target genes, PP_0681, PP_0788, and PP_5586, encode hypothetical proteins with unknown functions.
  - reference_id: PMID:35706385
    supporting_text: XC_3388 possesses a domain of unknown function, DUF1631, for which no information is available.
  - reference_id: file:PSEPK/PP_0788/PP_0788-hypotheses/kgap-pp0788-duf1631-activity/openscientist.md
    supporting_text: >-
      Nucleotide-binding folds (Rossmann, P-loop): zero. Enzymatic folds: zero
- gap_statement: >-
    It is untested whether loss of PP_0788 affects swimming motility or biofilm
    formation in KT2440, or whether the P. simiae WCS417 ortholog's motility and stress
    phenotypes are intrinsic or arise from polar effects on the downstream ampD-ampE genes.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: >-
    An OpenScientist run (kgap-pp0788-duf1631-activity) retrieved the KT2440 feature table directly and
    makes the polar-effect concern precise rather than resolving it. The gene order is nadC on the minus
    strand ending 243 base pairs before PP_0788, then PP_0788 at 903742-905901 on the plus strand, then an
    88 base-pair gap, then ampD at 905990-906562 on the plus strand, then ampE at 906559-907389
    overlapping ampD by 4 bases. All three genes are on the same strand with short or negative spacing,
    which is the standard signature of a single transcription unit, so a transposon insertion in PP_0788
    is well placed to be polar on ampDE and the alternative this gap raises is the more likely one, not
    the remote one. The adjacency is also not a P. putida accident: across 63 DUF1631 genes from 63
    distinct species, AmpD falls within two genes in 10 of 63 genomes against 1 of 63 in a matched
    4-to-10-gene distal control, an odds ratio of 11.70 at a false-discovery rate of 0.012, and it is the
    same-strand immediately downstream gene in 7 of 63, in genomes scattered across unrelated genera. It
    is nonetheless a minority pattern holding in about a sixth of genomes, and NadC recurs at least as
    often, 11 of 63 at q = 0.0033, so the ampD link is facultative rather than definitional for the
    family. Two honest limits: the run reports that it had mis-anchored two of the 63 genomes on the first
    pass and recomputed the table, which strengthened the AmpD association, and it could not query the LBL
    Fitness Browser at all, all three endpoints returning HTTP 403 behind a JavaScript challenge, so no
    KT2440 fitness value for PP_0788 was obtained and none is reported. Nothing here tests motility or
    biofilm formation, so this gap is unchanged in substance.
  status: OPEN
  provenance:
  - reference_id: file:PSEPK/PP_0788/PP_0788-bioinformatics/RESULTS.md
    supporting_text: Transposon insertions could be polar on ampDE
  - reference_id: file:PSEPK/PP_0788/PP_0788-hypotheses/kgap-pp0788-duf1631-activity/openscientist.md
    supporting_text: >-
      All three of PP_0788, *ampD* and *ampE* are on the same strand with short or negative spacing,
      which is the standard signature of a single transcription unit.
suggested_experiments:
- description: >-
    Construct an in-frame, non-polar KT2440 deletion of PP_0788 (with
    complementation) and assay swimming in soft agar, biofilm formation and
    bacitracin/phosphomycin/nitrate tolerance, alongside ampD expression to exclude
    polar effects.
  experiment_type: genetic
- description: >-
    Use the AlphaFold model of Q88PR0 for Foldseek searches and test the protein for
    c-di-GMP binding and for interaction with FleQ-regulated motility or adhesion
    machinery (e.g. pull-down or bacterial two-hybrid).
  experiment_type: biochemical
