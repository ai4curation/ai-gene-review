    supporting_text: Transposon insertions could be polar on ampDE
suggested_experiments:
- description: >-
    Construct an in-frame, non-polar KT2440 deletion of PP_0788 (with
    complementation) and assay swimming in soft agar, biofilm formation and
    bacitracin/phosphomycin/nitrate tolerance, alongside ampD expression to exclude
    polar effects.
  experiment_type: genetic
- description: >-
    Use the AlphaFold model of Q88PR0 for Foldseek searches and test the protein for
    c-di-GMP binding and for interaction with FleQ-regulated motility or adhesion
    machinery (e.g. pull-down or bacterial two-hybrid).
  experiment_type: biochemical
