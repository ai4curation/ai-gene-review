  - term:
      id: GO:0016614
      label: oxidoreductase activity, acting on CH-OH group of donors
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        This parent oxidoreductase term is technically compatible with G6PDH
        chemistry but is redundant with the specific glucose-6-phosphate
        dehydrogenase activity annotation.
      action: MODIFY
      reason: True but uninformative parent of GO:0004345 glucose-6-phosphate dehydrogenase activity,
        which the gene carries; MODIFY to the specific activity, as for the other G6PDH orthologs.
      proposed_replacement_terms:
      - id: GO:0004345
        label: glucose-6-phosphate dehydrogenase activity
      supported_by:
        - reference_id: file:PSEPK/zwfA/zwfA-uniprot.txt
          record_section: ["DR:HAMAP"]
          supporting_text: 'DR   HAMAP; MF_00966; G6PD; 1.'
  - term:
      id: GO:0050661
      label: NADP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        NADP binding is supported by UniProt feature and GO annotations and is
        biologically meaningful for KT2440 G6PDH isozymes, whose different cofactor
        preferences help balance NADPH and NADH production.
      action: KEEP_AS_NON_CORE
      reason: NADP binding is true, NADP+ being the electron acceptor of the reaction, but it is
        part of the catalytic activity rather than a separate function; kept as non-core, consistently
        with the other G6PDH and 6PGDH orthologs.
      supported_by:
        - reference_id: file:PSEPK/zwfA/zwfA-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR022674; G6P_DH_NAD-bd.'
        - reference_id: PMID:33727391
          supporting_text: |-
            We propose that gene duplication
            and relaxation in cofactor specificity is an evolutionary strategy toward
            balancing the relative production of NADPH and NADH.
core_functions:
  - description: >-
      Major KT2440 glucose-6-phosphate dehydrogenase isozyme that oxidizes
      D-glucose 6-phosphate to 6-phosphogluconolactone, supplying the oxidative
      pentose-phosphate/Entner-Doudoroff interface and contributing to redox
      cofactor balance.
    molecular_function:
      id: GO:0004345
      label: glucose-6-phosphate dehydrogenase activity
    directly_involved_in:
