  qualifier: enables
  review:
    summary: >-
      PP_0313 is a predicted ETF beta subunit and should participate in
      electron transfer as part of the PP_0312/PP_0313 heterodimer.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The complete electron-transfer activity belongs to the assembled ETF
      carrier. The beta polypeptide contributes to that function but is not
      established as independently enabling it.
