  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Appropriate molecular function for an ETF beta subunit.
      action: ACCEPT
      reason: >-
        The ETF beta/FixA family assignment and conserved placement beside
        DgcAB support electron transfer as the intrinsic function.
      supported_by:
