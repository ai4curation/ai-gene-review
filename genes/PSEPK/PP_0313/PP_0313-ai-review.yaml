- id: file:PSEPK/PP_0312/PP_0312-bioinformatics/RESULTS.md
  title: 'PP_0312 / PP_0313: dimethylglycine-locus ETF versus canonical ETF paralogs'
  findings:
  - statement: >-
      PP_0313 is 60.2% identical to Chromohalobacter dgc-locus EtfB but about
      32-34% identical to KT2440 PP_4202 and human ETFB.
- id: PMID:32631860
  title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
  findings:
  - statement: >-
      Disruption and complementation show that all four Chromohalobacter
      locus genes participate in dimethylglycine conversion; transfer of
      the pathway role to PP_0313 depends on conserved synteny and orthology.
    supporting_text: the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG
      degradation to sarcosine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full primary text read. Chromohalobacter salexigens DSM 3043 derivative ZW4-1 genetics and purified recombinant
      DdhC support dimethylglycine oxidation. Csal_0991 and ETF roles derive from genetics and architecture; the
      ordered electron-transfer sequence is proposed, not measured. These are ortholog inferences for KT2440.
  full_text_unavailable: true
- id: PMID:8962055
  title: Three-dimensional structure of human electron transfer flavoprotein to 2.1-A resolution.
  findings:
  - statement: Human ETF is an alpha/beta heterodimer that shuttles electrons between flavoprotein
      dehydrogenases and ETF-ubiquinone oxidoreductase.
core_functions:
- description: >-
    Beta subunit of the PP_0312/PP_0313 ETF heterodimer, inferred from conserved synteny and orthology to carry
    electrons from the DgcAB dimethylglycine dehydrogenase system, probably via the DgcB ferredoxin; the terminal
    acceptor is unresolved. The specific DgcB donor and respiratory acceptor are proposed partners; the cited primary
    work did not reconstitute their electron transfer.
  contributes_to_molecular_function:
    id: GO:0009055
    label: electron transfer activity
  supported_by:
