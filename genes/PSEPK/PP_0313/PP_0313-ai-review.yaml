id: Q88R21
gene_symbol: PP_0313
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Predicted beta subunit of a second electron-transfer flavoprotein (ETF) pair,
  encoded adjacent to the alpha-subunit gene PP_0312. PP_0313 has the conserved
  ETF beta-subunit domain architecture and is expected to help form a soluble
  heterodimeric electron carrier. The pair lies immediately downstream of the
  dimethylglycine dehydrogenase subunit genes dgcA (PP_0310) and dgcB
  (PP_0311), both EC 1.5.8.- flavin-acceptor oxidoreductases, and KEGG groups
  all four genes in glycine, serine and threonine metabolism (ppu00260) with the
  glycine-betaine and sarcosine oxidation genes gbcAB and soxABDG, which points
  to methylated-glycine oxidation as the likely donor pathway. The
  donor-acceptor pairing has not been demonstrated experimentally.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0313 is a predicted ETF beta subunit, the obligate structural and
      partner-recognition component of the PP_0312/PP_0313 heterodimeric
      carrier; electron transfer activity is the defining molecular function of
      the ETF beta/FixA family.
    action: ACCEPT
    reason: >-
      Electron transfer activity is the defining function of the assembled
      carrier, and the completed ortholog review in this repository
      (genes/human/ETFB) likewise ACCEPTs enables GO:0009055 for the same term.
      That review places GO:0009055 directly in molecular_function; this review
      instead records it as contributes_to_molecular_function, because the
      flavin is contributed by the alpha subunit PP_0312 and the beta subunit
      supplies the partner-recognition surface rather than the redox centre.
      That is a modelling difference from the human review, not a convention it
      establishes. The previous MARK_AS_OVER_ANNOTATED call would have left this
      gene with no molecular-function term at all.
- term:
    id: GO:0045251
    label: electron transfer flavoprotein complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_0313/PP_0313-uniprot.txt
  qualifier: part_of
  review:
    summary: >-
      GOA gives PP_0313 no cellular-component term, so the assembled carrier it
      is a subunit of is not recorded anywhere. GO:0045251 is the term for
      exactly that assembly, and core_functions already grounds this protein in
      it.
    action: NEW
    reason: >-
      The local UniProt record assigns this protein to the ETF
      beta-subunit/FixA family, whose product is the ETF complex by definition,
      and the alpha-subunit partner PP_0312 is encoded immediately adjacent.
      Unlike etfA/etfB this record carries no SUBUNIT line, so the assembly is
      asserted from family membership and gene neighbourhood rather than from a
      curated subunit statement - hence ISS, and hence the heterodimer is left
      as the family expectation rather than a demonstrated pairing. Added so
      the in_complex grounding in core_functions has a corresponding annotation
      entry, as it does for the etfA-etfB pair in this same batch.
    supported_by:
    - reference_id: file:PSEPK/PP_0313/PP_0313-uniprot.txt
      supporting_text: Belongs to the ETF beta-subunit/FixA family.
