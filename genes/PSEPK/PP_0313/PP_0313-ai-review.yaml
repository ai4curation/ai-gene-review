status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Predicted beta subunit of a second electron-transfer flavoprotein (ETF) pair,
  encoded adjacent to the alpha-subunit gene PP_0312. PP_0313 has the conserved
  ETF beta-subunit domain architecture and is expected to help form a soluble
  heterodimeric electron carrier. The pair lies immediately downstream of the
  dimethylglycine dehydrogenase subunit genes dgcA (PP_0310) and dgcB
  (PP_0311), both EC 1.5.8.- flavin-acceptor oxidoreductases, and KEGG groups
  all four genes in glycine, serine and threonine metabolism (ppu00260) with the
  glycine-betaine and sarcosine oxidation genes gbcAB and soxABDG, which points
  to methylated-glycine oxidation as the likely donor pathway. The
  donor-acceptor pairing has not been demonstrated experimentally.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0313 is a predicted ETF beta subunit, the obligate structural and
      partner-recognition component of the PP_0312/PP_0313 heterodimeric
      carrier; electron transfer activity is the defining molecular function of
      the ETF beta/FixA family.
    action: ACCEPT
    reason: >-
      GO's convention for an obligate subunit of a multi-protein electron
      carrier is to ACCEPT the enables annotation and to record the
      subunit-level dependency as contributes_to_molecular_function in
      core_functions, as this review does. The completed ortholog review in this
      repository (genes/human/ETFB) ACCEPTs enables GO:0009055 for the same
      term. The previous MARK_AS_OVER_ANNOTATED call was inconsistent with that
      convention and would have left this gene with no molecular-function term
      at all.
