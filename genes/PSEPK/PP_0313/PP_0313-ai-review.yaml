taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0313 is the beta subunit of a heterodimeric electron-transfer
  flavoprotein (ETF) encoded immediately downstream of the DgcAB
  dimethylglycine dehydrogenase genes and next to the alpha-subunit gene
  PP_0312. It belongs to the ETF beta-subunit/FixA family. Together with the
  FAD-binding alpha subunit PP_0312, it is thought to carry reducing
  equivalents generated during dimethylglycine conversion to sarcosine. This
  assignment rests on conserved synteny and on genetics of the orthologous
  Chromohalobacter salexigens locus, not on biochemistry of the KT2440
  proteins. KT2440 encodes a second, sequence-divergent ETF pair,
  PP_4201-PP_4202.
