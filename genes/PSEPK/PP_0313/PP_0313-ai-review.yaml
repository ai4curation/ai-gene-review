  - id: PMID:32631860
    title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
    findings:
      - statement: >-
          Disruption and complementation show that all four Chromohalobacter
          locus genes participate in dimethylglycine conversion; transfer of
          the pathway role to PP_0313 depends on conserved synteny.
        supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
core_functions:
  - description: >-
      Beta subunit of an ETF heterodimer inferred from conserved synteny to
      participate downstream of reduced DgcB; its terminal acceptor is
      unresolved.
    molecular_function:
      id: GO:0009055
      label: electron transfer activity
    supported_by:
      - reference_id: PMID:32631860
        supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
    knowledge_gaps:
      - gap_statement: Direct electron transfer from reduced KT2440 DgcB to PP_0312/PP_0313 has not been reconstituted.
        significance: Biochemical reconstitution is needed to establish the donor, kinetics, and terminal acceptor.
proposed_new_terms: []
suggested_questions:
  - question: What respiratory-chain component accepts electrons from the PP_0312/PP_0313 ETF heterodimer?
suggested_experiments:
  - description: Reconstitute reduced DgcB with PP_0312/PP_0313 and candidate downstream acceptors while monitoring electron transfer.
