id: Q88R21
gene_symbol: PP_0313
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0313 is the beta subunit of a heterodimeric electron-transfer flavoprotein
  encoded immediately downstream of the DgcAB dimethylglycine dehydrogenase
  system. Together with the FAD-binding alpha subunit PP_0312, it is inferred to
  carry reducing equivalents generated during dimethylglycine conversion to
  sarcosine. The pathway assignment rests on conserved synteny and the
  genetically required Chromohalobacter four-gene locus rather than direct
  KT2440 biochemistry.
