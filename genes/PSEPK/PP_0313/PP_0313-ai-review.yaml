  supporting_entities:
  - InterPro:IPR012255
  - PANTHER:PTN002327631
  review:
    summary: Appropriate molecular function for an ETF beta subunit.
    action: ACCEPT
    reason: >-
      Combined automated annotation (GO_REF:0000120) from the InterPro ETF
      beta-subunit family (IPR012255) mapping and PANTHER node PTN002327631
      (PTHR21294, whose electron-transfer IBD sits on PTN007689635). Q88R21
      also matches the Pfam ETF domain. Electron transfer between partner
      flavoenzymes and downstream acceptors is the defining function of the
      ETF heterodimer (PMID:8962055), and the 60.2%-identical Chromohalobacter
      ortholog EtfB is genetically required for dimethylglycine degradation
      (PMID:32631860). The UniProt SIMILARITY line is ARBA-only and is not
      cited. The beta subunit does not hold the FAD, so core_functions records
      the activity as contributes_to_molecular_function, as in the human ETFB
      review; the GOA term itself is correct.
    supported_by:
