- id: file:PSEPK/argB/argB-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. ATP-dependent kinase chemistry and ATP binding are core. Native KT2440
      argB insertion-mutant auxotrophy supports the biosynthetic process. Broad kinase activity is refined,
      not treated as a false over-annotation. Pseudomonas putida A90 regulation in PMID176312 and plant
      PII regulation are not direct KT2440 regulation measurements.
  findings:
  - statement: The report retrieves the exact ArgB reaction for P59300. Its target-specific claims about
      rate limitation, hexamerization, arginine inhibition, and absence of PII regulation are comparative
      inferences and are not promoted here; the direct KT2440 auxotrophy result above also supersedes
      its suggestion that this knockout remains to be tested.
    supporting_text: N-acetyl-L-glutamate + ATP = N-acetyl-L-glutamyl 5-phosphate + ADP
