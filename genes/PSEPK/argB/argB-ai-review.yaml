description: ArgB (PP_5289) is an ATP-dependent acetylglutamate kinase (EC 2.7.2.8) that phosphorylates
  N-acetyl-L-glutamate to N-acetyl-L-glutamyl 5-phosphate. It catalyzes the second reaction of the acetylated-ornithine
  route from glutamate to L-ornithine during L-arginine biosynthesis.
