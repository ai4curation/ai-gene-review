gene_symbol: nuoN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NuoN (PP_4131) is a multi-pass integral inner-membrane subunit of the proton-translocating
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I), the homologue of mitochondrial ND2 (complex
  I subunit 2 family). It is the antiporter-like subunit closest to the junction of the membrane and peripheral
  arms; like NuoL and NuoM it is built from two inverted five-helix repeats forming proton half-channels
  with a conserved lysine. NuoN carries no redox cofactor; it relays the conformational and electrostatic
  signal generated by quinone reduction along the membrane arm and contributes to proton translocation,
  so that the complex pumps four protons per two electrons and conserves the energy of NADH oxidation
  as proton-motive force.
