- term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The non-electrogenic NADH:quinone oxidoreductase term contradicts the proton-pumping NDH-1
      of which NuoN is a subunit.
    action: REMOVE
    reason: GO:0050136 (RHEA:46160) is the non-electrogenic reaction typified by type II NADH dehydrogenase
      (NDH-2; PP_0626 in P. putida), whose turnover does not generate a proton gradient. NDH-1 translocates
      four protons per two electrons, the reaction captured by GO:0008137 (RHEA:29091), already accepted
      on this gene. The UniRule mapping is therefore demonstrably wrong for this complex.
    supported_by:
    - *id002
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh II) that reacts with NADH exclusively whose turnover does not
        lead to generation of a H+ electrochemical gradient
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
      supporting_text: a non-homologous, non-proton-pumping single-subunit alternative that must not be
        mapped onto any Complex I core step
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: Proton transmembrane transport is correct but general; the specific process for NuoN is electron
      transport coupled proton transport.
    action: MODIFY
    reason: GO:0015990 electron transport coupled proton transport is an is_a descendant of GO:1902600
      (via energy coupled proton transmembrane transport) and captures that the proton movement is driven
      by electron transfer from NADH to quinone. E. coli NuoN Lys395 participates in proton translocation,
      and the three antiporter-like subunits are proposed to pump by a similar mechanism. P. putida KT2440
      NuoN (PP_4131) is covered by HAMAP rule MF_00445 (NDH1_NuoN_1) and the NuoN/ND2-specific InterPro
      IPR010096 and NCBIfam TIGR01770 signatures shared with E. coli NuoN (P0AFF0), so E. coli experimental
      evidence is transferred by orthology.
    proposed_replacement_terms:
    - id: GO:0015990
      label: electron transport coupled proton transport
    supported_by:
    - &id005
      reference_id: PMID:23864658
      supporting_text: Our mutation study on NLys(395) suggests that this residue participates in the
        proton translocation.
    - reference_id: PMID:23864658
      supporting_text: It seems likely that NuoL, NuoM, and NuoN pump protons by a similar mechanism.
    - *id002
