- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: NADH dehydrogenase (ubiquinone) activity is the correct molecular function of NDH-1, to which
      NuoN contributes.
    action: ACCEPT
    reason: The proton-pumping NADH:quinone oxidoreduction is the defining activity of NDH-1 (HAMAP).
      NuoN contributes to, rather than independently enables, it; core_functions records contributes_to.
      The InterPro2GO pipeline cannot carry that qualifier and proposing the same id as a MODIFY replacement
      would be a no-op, so the term is accepted. E. coli nuoN deletion abolishes complex I activity. P.
      putida KT2440 NuoN (PP_4131) is covered by HAMAP rule MF_00445 (NDH1_NuoN_1) and the NuoN/ND2-specific
      InterPro IPR010096 and NCBIfam TIGR01770 signatures shared with E. coli NuoN (P0AFF0), so E. coli
      experimental evidence is transferred by orthology.
    supported_by:
    - &id002
      reference_id: file:PSEPK/nuoN/nuoN-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every two electrons transferred,
        four hydrogen ions are translocated across the cytoplasmic membrane), and thus conserves the redox
        energy in a proton gradient.
    - &id003
      reference_id: file:PSEPK/nuoN/nuoN-uniprot.txt
      supporting_text: InterPro; IPR010096; NADH-Q_OxRdtase_suN/2.
    - reference_id: PMID:12718520
      supporting_text: the gene for subunit N was disrupted by a 163 bp deletion in the chromosome, resulting
        in the loss of Complex I function
