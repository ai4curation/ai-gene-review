id: Q88D67
gene_symbol: fba
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  fba (PP_4960) of Pseudomonas putida KT2440 encodes a class II (zinc-dependent,
  type B) fructose-1,6-bisphosphate aldolase. It binds a catalytic and a
  structural Zn2+ ion per subunit and reversibly interconverts
  beta-D-fructose 1,6-bisphosphate with dihydroxyacetone phosphate and
  D-glyceraldehyde 3-phosphate. KT2440 lacks a functional
  Embden-Meyerhof-Parnas pathway, has no 6-phosphofructokinase, and
  catabolizes glucose through the Entner-Doudoroff pathway. Its physiological
  direction is therefore the aldol condensation of triose phosphates into
  fructose 1,6-bisphosphate, which serves gluconeogenesis and the EDEMP cycle.
  In that cycle, part of the ED-derived triose phosphate is recycled to hexose
  phosphates, favouring NADPH formation during growth on glucose. The enzyme
  is soluble and cytoplasmic.
