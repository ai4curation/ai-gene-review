- term:
    id: GO:0004332
    label: fructose-bisphosphate aldolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the defining activity of fba. It is a class II FBP aldolase
      (PIRSF001359, NCBIfam TIGR01521 FruBisAldo_II_B, both class II aldolase
      PROSITE signatures). PIRSR maps the proton-donor active site, the Zn2+
      ligands and the DHAP-binding residues. RuleBase RU365019 assigns the
      RHEA:14729 reaction.
    action: ACCEPT
    reason: >-
      Family signatures, the conserved active site and Zn2+/DHAP-binding
      residues, and the RuleBase reaction all support FBP aldolase activity.
      The activity is reversible and is described here independent of
      direction.
    supported_by:
