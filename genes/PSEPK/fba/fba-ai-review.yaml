- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      This broad metabolic parent comes from InterPro. It is true of fba, but
      no accepted biological-process term in this review entails it, because
      the glycolytic-process row is kept as non-core. The specific process fba
      serves in KT2440 is gluconeogenic hexose-phosphate formation from triose
      phosphates, both on gluconeogenic substrates and within the EDEMP cycle.
    action: MODIFY
    reason: >-
      The term is correct but too general. It is refined to GO:0006094
      gluconeogenesis, which is is_a GO:0005975 (checked in GO). The RuleBase
      function statement places the condensation direction in gluconeogenesis,
      and KT2440 runs the upper EMP enzymes gluconeogenically (PMID:26350459).
      The other descendant, GO:0006096 glycolytic process, already has its own
      row (non-core) in this review.
    proposed_replacement_terms:
    - id: GO:0006094
      label: gluconeogenesis
    supported_by:
    - reference_id: file:PSEPK/fba/fba-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: to form fructose 1,6-bisphosphate (FBP) in gluconeogenesis
    - reference_id: PMID:26350459
      supporting_text: the EMP (operating in a gluconeogenic fashion)
- term:
    id: GO:0006096
    label: glycolytic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      FBP aldolase catalyzes step 4 of the upper EMP route by convention, and
      the RuleBase pathway line places it there. KT2440 lacks a functional EMP
      pathway, glycolysis runs almost exclusively through the ED route, and the
      upper EMP enzymes operate gluconeogenically. During glucose catabolism,
      fba participates in the EDEMP cycle, which recycles about 10% of the
      ED-derived triose phosphate back to hexose phosphates. So the reaction
      belongs to glycolysis, and the enzyme acts during glucose catabolism, but
      its physiological direction is gluconeogenic.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is not wrong. FBP aldolase is a glycolytic enzyme, and in KT2440
      it works within the glucose-catabolic EDEMP cycle. It is not the core
      role of fba in this organism, where no FBP is formed by a kinase to be
      cleaved in the glycolytic direction. The same action is used for this
      term on pgi1 and pgi2, the other upper-EMP enzymes that run
      gluconeogenically in the EDEMP cycle.
    supported_by:
    - reference_id: PMID:26350459
      supporting_text: lacks a functional Embden-Meyerhof-Parnas (EMP) pathway
    - reference_id: PMID:26350459
      supporting_text: about 10% of the triose phosphates were found to be recycled back to form hexose phosphates
    - reference_id: PMID:26350459
      supporting_text: the EMP (operating in a gluconeogenic fashion)
    - reference_id: PMID:27933319
      supporting_text: it can be recycled upward for the production of FBP, fructose-6-P, and glucose-6-P to generate reducing power
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Class II aldolases are Zn2+ metalloenzymes. PIRSR001359 maps the Zn2+
      ligands of fba (positions 84, 105, 142, 198 and 232) and assigns two
      Zn2+ ions per subunit, one catalytic and one structural.
    action: KEEP_AS_NON_CORE
    reason: >-
      Zn2+ binding is well supported by PIRSR binding-site evidence, but it is
      a cofactor feature that serves the aldolase activity, so it is kept as
      non-core.
    supported_by:
    - reference_id: file:PSEPK/fba/fba-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 2 Zn(2+) ions per subunit. One is catalytic and the other provides a structural contribution.
