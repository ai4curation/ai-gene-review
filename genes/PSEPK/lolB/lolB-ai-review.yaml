  review:
    summary: LolB performs the terminal delivery and incorporation step of lipoprotein transport.
    action: NEW
    reason: The reviewed Q88PX4 UniProt record identifies LolB as the terminal lipoprotein-incorporation
      component, supporting the missing pathway process annotation by conserved-family inference. Q88PX4
      is a curated HAMAP MF_00233 LolB-family protein with a signal peptide and lipidated mature N-terminal
      cysteine; outer-membrane placement and terminal delivery are supported by the curated rule. Assignment
