suggested_questions:
  - question: Which KT2440 outer-membrane lipoproteins depend most strongly on LolB for insertion?
suggested_experiments:
  - description: Deplete LolB and quantify membrane partitioning of representative outer-membrane lipoproteins, followed by complementation with Q88PX4.
    experiment_type: membrane fractionation and complementation
