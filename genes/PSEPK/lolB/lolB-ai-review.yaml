proposed_new_terms:
  - proposed_name: outer-membrane lipoprotein insertion activity
    proposed_definition: >-
      Accepting a mature lipoprotein from a periplasmic carrier and promoting
      incorporation of its lipid anchor into the bacterial outer membrane.
    justification: >-
      Existing GO biological-process terms capture lipoprotein transport and
      localization, but no molecular-function term captures LolB-mediated terminal
      delivery and membrane insertion.
    proposed_parent:
      id: GO:0003674
      label: molecular_function
    supported_by:
