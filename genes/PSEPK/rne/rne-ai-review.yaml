taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  RNase E is the membrane-associated endoribonuclease and organizing scaffold
  of the bacterial RNA degradosome. It cleaves single-stranded RNA, initiates
  decay of most mRNAs, and participates in maturation of 5S and 16S rRNA and
  many tRNAs. The catalytic N-terminal region binds RNA and Mg2+, whereas the
  extended protein assembles the degradosome with RhlB, PNPase, and enolase.
