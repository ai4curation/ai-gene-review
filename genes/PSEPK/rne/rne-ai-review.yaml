taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RNase E is the membrane-associated endoribonuclease and organizing scaffold of the bacterial
  RNA degradosome. It cleaves single-stranded RNA, initiates decay of most mRNAs, and participates in
  maturation of 5S and 16S rRNA and many tRNAs. The catalytic N-terminal region binds RNA and Mg2+, whereas
  the extended C-terminal region organizes a degradosome that recruits RNA-decay partners. The exact helicase
  and exonuclease partners recruited by the KT2440 scaffold have not been resolved experimentally.
