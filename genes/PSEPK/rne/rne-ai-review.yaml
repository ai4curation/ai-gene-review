- id: PMID:33089610
  title: Ribonucleases control distinct traits of Pseudomonas putida lifestyle.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct KT2440 deletion study that distinguishes RNase E from RNase G and other RNases
      at the physiological level; it does not directly establish catalytic mechanism or degradosome composition.
  findings:
  - supporting_text: Each mutant lacked either one exoribonuclease (PNPase, RNase R) or one endoribonuclease
      (RNase E, RNase III, RNase G).
  - supporting_text: the physiological responses of P. putida to the absence of each enzyme diverged significantly
      from those known previously in Escherichia coli.
