    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      gpmI is a soluble monomeric glycolytic enzyme. Its feature table has only
      the chain, the active site and ligand-binding residues, with no signal
      peptide or transmembrane feature, which fits a cytosolic location.
    action: ACCEPT
    reason: >-
      Cytosol is the appropriate specific location for a soluble enzyme of the
      lower glycolytic trunk. It is accepted on the same basis as the cytosol
      rows of pgk, pgi1 and pgi2.
