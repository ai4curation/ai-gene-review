  qualifier: enables
  review:
    summary: >-
      This generic metal-binding term comes from the InterPro metalloenzyme
      domain. The metal is known: HAMAP assigns two Mn2+ ions per subunit.
    action: MODIFY
    reason: >-
      The term is correct but too general. It is refined to GO:0030145
      manganese ion binding, which is is_a GO:0046872 (checked in GO) and is
      already carried by this gene, supported by HAMAP Mn2+-binding residues.
      The manganese row is non-core, so this term is not entailed by an
      accepted term, and MODIFY is used rather than TOO_GENERAL.
    proposed_replacement_terms:
    - id: GO:0030145
      label: manganese ion binding
    supported_by:
    - reference_id: file:PSEPK/gpmI/gpmI-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 2 manganese ions per subunit.
