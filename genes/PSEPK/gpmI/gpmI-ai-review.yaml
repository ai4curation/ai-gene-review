- term:
    id: GO:0004619
    label: phosphoglycerate mutase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the defining activity of gpmI. The reviewed entry is assigned to
      HAMAP MF_01038 (GpmI), with the RHEA:15901 reaction, a phosphoserine
      active site (Ser64), and the iPGM family signatures TIGR01307 and
      PIRSF001492.
    action: ACCEPT
    reason: >-
      The HAMAP rule, the conserved active site and the substrate- and
      Mn2+-binding residues all support the cofactor-independent
      phosphoglycerate mutase activity.
    supported_by:
    - reference_id: file:PSEPK/gpmI/gpmI-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the interconversion of 2-phosphoglycerate and 3-phosphoglycerate.
