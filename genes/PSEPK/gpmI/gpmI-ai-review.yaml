- term:
    id: GO:0006007
    label: glucose catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      In KT2440, glucose catabolism runs through the Entner-Doudoroff pathway
      to glyceraldehyde 3-phosphate and pyruvate. The glyceraldehyde
      3-phosphate is then converted to pyruvate by the lower trunk, in which
      phosphoglycerate mutase catalyzes the 3PG to 2PG step. gpmI therefore
      performs a step of glucose catabolism in this organism. The term is not
      entailed by GO:0006096 in GO.
    action: ACCEPT
    reason: >-
      gpmI is the only phosphoglycerate mutase on the ED-derived route from
      triose phosphate to pyruvate during glucose growth, and the term states a
      real, gene-relevant process that GO:0006096 does not entail. Acceptance
      matches the gapA row on the related GO:0006006 glucose metabolic process.
    supported_by:
    - reference_id: PMID:26350459
      supporting_text: glycolysis is known to proceed almost exclusively through the Entner-Doudoroff (ED) route
    - reference_id: file:PSEPK/gpmI/gpmI-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Carbohydrate degradation; glycolysis; pyruvate from D-glyceraldehyde 3-phosphate: step 3/5.'
- term:
    id: GO:0006096
    label: glycolytic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Phosphoglycerate mutase catalyzes step 3 of the 5 steps that convert
      glyceraldehyde 3-phosphate to pyruvate. In KT2440 this lower trunk
      carries the triose phosphate made by the Entner-Doudoroff pathway, the
      main glucose catabolic route. GO obsoleted GO:0061688 (glycolysis via ED)
      with replaced_by GO:0006096, so this term covers ED-route glycolysis.
    action: ACCEPT
    reason: >-
      gpmI performs a step of the lower glycolytic trunk that operates during
      glucose catabolism in KT2440. This is the same action as the other
      lower-trunk enzymes (gapA, gapB, pgk, eno, pykA, pyk).
    supported_by:
    - reference_id: file:PSEPK/gpmI/gpmI-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Carbohydrate degradation; glycolysis; pyruvate from D-glyceraldehyde 3-phosphate: step 3/5.'
    - reference_id: PMID:26350459
      supporting_text: glycolysis is known to proceed almost exclusively through the Entner-Doudoroff (ED) route
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      HAMAP MF_01038 assigns two Mn2+ ions per subunit and maps the
      coordinating residues (positions 14, 64, 400, 404, 441, 442 and 460), as expected for the iPGM metalloenzyme fold.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mn2+ binding is well supported by HAMAP binding-site evidence, but it is
      a cofactor feature that serves the catalytic activity rather than a
      separate function, so it is kept as non-core.
    supported_by:
    - reference_id: file:PSEPK/gpmI/gpmI-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 2 manganese ions per subunit.
