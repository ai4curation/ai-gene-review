gene_symbol: gpmI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  gpmI (pgm, PP_5056) of Pseudomonas putida KT2440 encodes the
  2,3-bisphosphoglycerate-independent phosphoglycerate mutase (iPGM), a
  monomeric enzyme of the alkaline-phosphatase-like metalloenzyme superfamily.
  It binds two Mn2+ ions per subunit and works through a phosphoserine
  intermediate. It catalyzes the reversible interconversion of
  3-phosphoglycerate and 2-phosphoglycerate between the phosphoglycerate
  kinase and enolase steps of the lower trunk. In KT2440, glucose is
  catabolized through the Entner-Doudoroff pathway, and this trunk carries the
  glyceraldehyde 3-phosphate it produces to pyruvate. The same reversible step
  is used in the opposite direction during gluconeogenic growth. The enzyme
  is soluble and cytoplasmic.
