id: Q88RC0
gene_symbol: davD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DavD is the glutarate-semialdehyde dehydrogenase of the Dav pathway. It
  oxidizes 5-oxopentanoate to glutarate after the DavT reaction, completing
  conversion of L-lysine-derived 5-aminovalerate to glutarate. Orthology to
  Pseudomonas aeruginosa DavD supports NADP+ use, although Q88RC0 cofactor
  preference has not been measured directly.
