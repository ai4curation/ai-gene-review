id: Q88RC0
gene_symbol: davD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DavD is the glutarate-semialdehyde dehydrogenase of the Dav pathway. It
  oxidizes 5-oxopentanoate to glutarate after the DavT reaction, completing
  conversion of L-lysine-derived 5-aminovalerate to glutarate. Orthology to
  Pseudomonas aeruginosa DavD supports NADP+ use, although Q88RC0 cofactor
  preference has not been measured directly.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Succinate-semialdehyde activity transferred from the SSADH family over-annotates a glutarate-semialdehyde
      dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DavD is assigned to oxidation of 5-oxopentanoate in the lysine-derived
      Dav pathway, whereas GO:0004777 specifies succinate semialdehyde. DavD
      sits in PANTHER subfamily SF5 with the succinate-semialdehyde
      dehydrogenases, so activity on the one-carbon-shorter aldehyde is
      chemically plausible, but no assay of a DavD protein tests it. The term
      is therefore a family-level transfer that over-annotates the
      characterized activity rather than a demonstrated second function; the
      same judgement is applied to the GABA rows of P. aeruginosa DavD and of
      both DavT orthologs. This substrate question is independent of the
      unresolved NAD versus NADP preference of Q88RC0.
    supported_by:
    - reference_id: file:PSEPK/davD/davD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+)
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Plausible electronic localization that is not part of the core functional claim.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cytosol is consistent with a soluble bacterial metabolic enzyme of the
      aldehyde dehydrogenase family, which has no signal peptide or
      transmembrane segment. The annotation is electronic and no direct
      localization evidence was found, so it is kept as non-core context.
    supported_by:
    - reference_id: file:PSEPK/davD/davD-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR015590; Aldehyde_DH_dom.
- term:
    id: GO:0009013
    label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Substrate-generalized succinate-semialdehyde activity over-annotates DavD.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro IPR010102 succinate-semialdehyde dehydrogenase signature
      matches the whole SSADH-like clade. Family membership does not override the exact 5-oxopentanoate reaction assigned to DavD,
      and activity on succinate semialdehyde has not been tested, so the
      term is treated as over-annotation, as for GO:0004777.
    supported_by:
    - reference_id: file:PSEPK/davD/davD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+)
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Family-transferred GABA-catabolism role over-annotates a lysine-pathway enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DavD is established in the 5-aminovalerate pathway, but the available
      evidence does not test whether Q88RC0 also accepts succinate semialdehyde
      or contributes to GABA catabolism. The process follows only from the
      succinate-semialdehyde activity marked as over-annotation above, so it is
      treated the same way.
    supported_by:
