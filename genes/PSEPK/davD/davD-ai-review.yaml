    summary: Incorrect succinate-semialdehyde substrate assignment transferred from a broad family node.
    action: REMOVE
    reason: >-
      DavD is assigned to oxidation of 5-oxopentanoate in the lysine-derived
      Dav pathway, whereas GO:0004777 specifies succinate semialdehyde. This
      substrate mismatch is independent of the unresolved NAD versus NADP
      preference of Q88RC0.
    supported_by:
