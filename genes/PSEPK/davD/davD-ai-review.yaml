- id: file:PSEPK/davD/davD-uniprot.txt
  title: UniProtKB entry Q88RC0 for Pseudomonas putida KT2440 davD
  findings:
  - statement: The reviewed record identifies DavD as glutarate-semialdehyde dehydrogenase.
    supporting_text: 'RecName: Full=Glutarate-semialdehyde dehydrogenase'
    reference_section_type: RESULTS
  - statement: The assigned reaction uses 5-oxopentanoate and NADP+ to form glutarate.
    supporting_text: Reaction=5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Exact reviewed UniProtKB accession and Rhea-linked reaction verified.
      The 5-oxopentanoate/NADP reaction itself is assigned by similarity to
      UniProtKB:Q9I6M5, not measured directly for Q88RC0.
- id: PMID:31064836
  title: Massively Parallel Fitness Profiling Reveals Multiple Novel Enzymes in Pseudomonas putida Lysine
    Metabolism.
  findings:
  - statement: Fitness profiling connects davD to growth on both 5AVA and L-lysine.
    supporting_text: Only 3 genes shared fitness defects between 5AVA and l-lysine (davT, davD, and lghO),
      and all three have been previously implicated in 5AVA metabolism
    reference_section_type: RESULTS
  - statement: DavD abundance responds most strongly to 5AVA.
    supporting_text: As previously observed, DavT and DavD were most strongly upregulated on 5AVA
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text KT2440 fitness and proteomics study; identifier and quoted claims verified.
- id: file:PSEPK/davD/davD-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK davD
  findings:
  - statement: >-
      OpenScientist recovered Q88RC0/PP_0213 as glutarate semialdehyde
      dehydrogenase but inferred NAD+/EC 1.2.1.20 rather than the UniProt
      NADP+ Rhea reaction.
    supporting_text: >-
      **Supported:** DavD is a cytoplasmic NAD⁺-dependent
      glutarate-semialdehyde dehydrogenase catalyzing glutarate semialdehyde →
      glutarate (EC 1.2.1.20) as the terminal step of the 5-aminovalerate branch
      of L-lysine catabolism.
    reference_section_type: LITERATURE_REVIEW
    finding_review:
      finding_status: DISPUTED
      review_notes: >-
        The report's NAD+ cofactor claim is inferred from related enzymes and
        conflicts with the NADP+ Rhea reaction in the exact UniProtKB record.
      supported_by:
      - reference_id: file:PSEPK/davD/davD-uniprot.txt
        supporting_text: Reaction=5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+)
  - statement: The report notes that PP_0213 cofactor preference has not been directly measured.
    supporting_text: >-
      NAD⁺ dependence is expected for the catabolic direction and consistent
      with family membership, but the strict NAD⁺-vs-NADP⁺ preference of
      PP_0213 has not been directly measured in the reviewed papers.
    reference_section_type: LITERATURE_REVIEW
    finding_review:
      finding_status: CURRENT
      review_notes: >-
        This limitation matches the KT2440 review's suggested experiment on
        NADP+ versus NAD+ discrimination.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Provider-generated gene report useful for the glutarate semialdehyde
      dehydrogenase assignment, but its NAD+/EC 1.2.1.20 conclusion conflicts
      with the exact UniProtKB record's NADP+ Rhea reaction; do not use it as
      support for KT2440 DavD cofactor specificity.
core_functions:
- description: >-
    Oxidizes 5-oxopentanoate to glutarate in the terminal reaction of the
    four-step Dav pathway. Orthology supports NADP+ as the acceptor, but direct
    Q88RC0 cofactor measurements are unavailable.
  molecular_function:
    id: GO:0102810
    label: glutarate-semialdehyde dehydrogenase (NADP+) activity
  directly_involved_in:
