      and all three have been previously implicated in 5AVA metabolism
suggested_questions:
- question: How strongly does KT2440 DavD discriminate 5-oxopentanoate from succinate semialdehyde and
    NADP+ from NAD+?
suggested_experiments:
- description: Measure DavD steady-state kinetics across glutarate semialdehyde and succinate semialdehyde
    with both nicotinamide cofactors, and test davD complementation during growth on 5AVA.
