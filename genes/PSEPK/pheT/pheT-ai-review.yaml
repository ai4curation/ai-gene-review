- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Direct ATP binding by KT2440 PheT remains unresolved.
    action: UNDECIDED
    reason: The ATP-dependent reaction is catalyzed by the alpha/beta complex, but PheT classification
      and whole-complex reaction alone do not resolve an ATP-binding site on this beta subunit. Its curated
      magnesium-binding and tRNA-recognition features do not settle ATP binding. Preserve uncertainty
      rather than infer absence or transfer the alpha catalytic site automatically.
    supported_by:
    - *id002
