id: Q88K22
gene_symbol: pheT
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Beta subunit of the bacterial phenylalanyl-tRNA synthetase alpha2-beta2 complex. PheT provides tRNA-recognition architecture and contributes with PheS to phenylalanine-specific tRNA aminoacylation; it is not an independently complete phenylalanyl-tRNA synthetase. The local assignment is HAMAP-rule based.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PheT contributes tRNA-recognition architecture to the alpha2-beta2 PheRS complex.
    action: ACCEPT
    reason: The reviewed record assigns tRNA(Phe) as a complex substrate and identifies PheT as the beta subunit.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "Reaction=tRNA(Phe) + L-phenylalanine + ATP"
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Magnesium ions support PheRS catalysis but do not define PheT function.
    action: KEEP_AS_NON_CORE
    reason: The reviewed record explicitly assigns two magnesium ions per alpha2-beta2 tetramer.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "Binds 2 magnesium ions per tetramer."
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: RNA binding is compatible with PheT's tRNA-recognition role but is less specific than tRNA binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The separately present tRNA-binding annotation better describes the substrate class.
- term:
    id: GO:0004826
    label: phenylalanine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PheT contributes to phenylalanine-tRNA ligase activity as the beta subunit of heterotetrameric PheRS.
    action: MARK_AS_OVER_ANNOTATED
    reason: Activity belongs to the alpha2-beta2 PheRS complex; PheT contributes tRNA recognition/editing functions but should not be modeled as independently enabling complete ligase catalysis.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "Tetramer of two alpha and two beta subunits."
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is a substrate of the PheRS complex, but the local record does not establish an ATP-binding site on the beta subunit itself.
    action: UNDECIDED
    reason: Complex-level reaction evidence is insufficient to confirm that PheT directly binds ATP.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is appropriate for this bacterial translation enzyme.
    action: KEEP_AS_NON_CORE
    reason: The reviewed record explicitly assigns cytoplasmic localization, although by HAMAP rule.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006432
    label: phenylalanyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PheT participates in phenylalanyl-tRNA aminoacylation as an essential beta subunit of PheRS.
    action: ACCEPT
    reason: The reviewed record assigns the matching reaction and alpha2-beta2 complex organization.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "Reaction=tRNA(Phe) + L-phenylalanine + ATP"
- term:
    id: GO:0009328
    label: phenylalanine-tRNA ligase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: PheT is the beta subunit of the bacterial phenylalanine-tRNA ligase complex.
    action: ACCEPT
    reason: The reviewed record explicitly describes a tetramer containing two alpha and two beta subunits.
    supported_by:
    - reference_id: file:PSEPK/pheT/pheT-uniprot.txt
      supporting_text: "Tetramer of two alpha and two beta subunits."
