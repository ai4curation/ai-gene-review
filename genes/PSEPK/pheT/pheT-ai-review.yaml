description: Beta subunit of the bacterial phenylalanyl-tRNA synthetase alpha2-beta2 complex. PheT provides tRNA-recognition architecture and contributes with PheS to phenylalanine-specific tRNA aminoacylation; it is not an independently complete phenylalanyl-tRNA synthetase. The local assignment is HAMAP-rule based.
