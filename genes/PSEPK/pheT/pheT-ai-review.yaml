id: Q88K22
gene_symbol: pheT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PheT is the beta subunit of the bacterial alpha2-beta2 phenylalanyl-tRNA synthetase. It contributes
  tRNA recognition and complex architecture to phenylalanylation by the PheS/PheT enzyme and participates
  in a conserved magnesium-binding site shared with the alpha subunit. Its conserved B3/B4 editing region
  is inferred to hydrolyze mischarged Tyr-tRNA(Phe), separating post-transfer quality control from amino-acid
  activation in the alpha subunit.
