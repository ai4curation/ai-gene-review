id: Q88F18
gene_symbol: guaD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GuaD is the predicted zinc-dependent guanine deaminase that hydrolytically
  converts guanine to xanthine and ammonium, supplying xanthine to downstream
  purine-base oxidation. The exact KT2440 protein has not been characterized
  biochemically; its assignment is supported by the diagnostic guanine-deaminase
  family classification, conserved reaction annotation, and PANTHER phylogenetic
  propagation from characterized orthologs.
