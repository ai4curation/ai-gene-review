id: Q88BX2
gene_symbol: atpA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: ATP synthase subunit alpha, the regulatory nucleotide-binding subunit of the membrane-associated F1 catalytic head that couples proton flow through F0 to ATP synthesis.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: AtpA is the nucleotide-binding regulatory alpha subunit of F1.
      action: ACCEPT
      reason: The reviewed UniProt record identifies a nucleotide-binding site and the alpha subunit is a well-conserved nucleotide-binding component.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The peripheral F1 alpha subunit is associated with the plasma-membrane F0F1 complex.
      action: ACCEPT
      reason: Complex-associated localization is appropriate even though AtpA is not an integral membrane protein.
  - term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AtpA contributes its regulatory alpha subunit to proton motive force-driven ATP synthesis, which in this bacterium occurs at the plasma membrane.
      action: MODIFY
      reason: >-
        The process is right but the term is the general parent. P. putida F0F1 is a
        plasma-membrane enzyme, so the plasma-membrane-specific child GO:0042777 is the
        accurate placement. GOA already carries GO:0042777 for atpB and atpG; applying it
        across all eight subunits makes the operon agree on one term for one identical
        process instead of splitting between parent and child by accident of which
        UniRule fired.
      proposed_replacement_terms:
        - id: GO:0042777
          label: proton motive force-driven plasma membrane ATP synthesis
  - term:
      id: GO:0032559
      label: adenyl ribonucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This broad nucleotide-binding term is consistent with ATP and ADP binding by AtpA.
      action: KEEP_AS_NON_CORE
      reason: Correct but less informative than the specific ATP- and ADP-binding annotations.
  - term:
      id: GO:0043531
      label: ADP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: AtpA binds adenine nucleotides, including ADP, in the F1 alpha/beta head.
      action: KEEP_AS_NON_CORE
      reason: >-
        Correct and a direct subunit property, but not core. Alpha's nucleotide sites are
        non-catalytic and regulatory, and the core molecular function recorded for this
        subunit is ATP binding (GO:0005524); ADP binding is a true adjunct of the same
        site rather than a separate core activity.
  - term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: part_of
    review:
      summary: AtpA is an alpha subunit of the F1 sector of the F0F1 ATP synthase.
      action: ACCEPT
      reason: This is direct complex membership rather than attribution of whole-complex catalysis.
  - term:
      id: GO:0046034
      label: ATP metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: AtpA participates in ATP metabolism through the F-type ATP synthase.
      action: KEEP_AS_NON_CORE
      reason: Correct but substantially broader than proton motive force-driven ATP synthesis.
  - term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: AtpA contributes to this activity as one subunit of the multisubunit F0F1 enzyme.
      action: MARK_AS_OVER_ANNOTATED
      reason: No individual alpha subunit enables coupled proton transport and ATP synthesis; the activity belongs to the assembled complex.
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: AtpA participates indirectly in proton translocation as part of the coupled ATP synthase.
      action: KEEP_AS_NON_CORE
      reason: >-
        Retained, but not core. The reason for accepting it is precisely that AtpA does
        not form the proton channel: translocation is done by the a-subunit/c-ring
        interface, and alpha's involvement is mediated through the coupled complex. That
        is a true but indirect participation, which is what KEEP_AS_NON_CORE records; the
        core process for this subunit is GO:0042777.
