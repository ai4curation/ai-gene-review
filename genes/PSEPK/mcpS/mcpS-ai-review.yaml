- id: PMID:20498372
  title: 'Identification of a chemoreceptor for tricarboxylic acid cycle intermediates: differential chemotactic response towards receptor ligands.'
  findings:
  - statement: Experimental work identified McpS as the sole chemoreceptor for TCA-cycle intermediates in KT2440, determined its ligand profile by ITC of the purified ligand-binding domain, and showed loss of chemotaxis in an mcpS mutant restored by complementation.
    supporting_text: McpS recognizes TCA cycle intermediates but does not bind very close structural homologues and derivatives like maleate, aspartate, or tricarballylate.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Lacal et al. 2010 J Biol Chem; abstract-only in cache, cited by UniProt (ECO:0000269) for the FUNCTION and DISRUPTION PHENOTYPE lines.
- id: PMID:21360620
  title: Physiologically relevant divalent cations modulate citrate recognition by the McpS chemoreceptor.
  findings:
  - statement: Free citrate binds McpS-LBD and reduces chemotaxis to malate, whereas citrate complexed with Mg2+ or Ca2+ is not recognized.
    supporting_text: The ligand binding domain of McpS (McpS-LBD) was found to bind free citrate, but not complexes with physiologically relevant Mg(2+) and Ca(2+).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache; source of the UniProt ACTIVITY REGULATION line.
