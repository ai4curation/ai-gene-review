  label: Pseudomonas putida KT2440
description: McpS (PP_4658) is a methyl-accepting chemotaxis protein (MCP) chemoreceptor of Pseudomonas putida KT2440. It is an inner-membrane receptor with two transmembrane helices flanking a large periplasmic helical bimodular (HBM) ligand-binding domain, followed by a cytoplasmic HAMP domain and a methyl-accepting signaling domain that couples to the CheA/CheW chemosensory array. The ligand-binding domain binds six TCA-cycle intermediates (succinate, fumarate, malate, oxaloacetate, citrate, isocitrate) as well as butyrate and acetate; malate, succinate, fumarate and oxaloacetate cause the strongest responses, and ligand binding stabilizes the receptor dimer. McpS is the only chemoreceptor for TCA-cycle intermediates in KT2440, and free citrate (but not its Mg2+ or Ca2+ complexes) antagonizes chemotaxis to malate. The receptor is methylated by CheR2 for sensory adaptation.
