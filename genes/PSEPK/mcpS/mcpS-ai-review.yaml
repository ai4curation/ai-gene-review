  qualifier: involved_in
  review:
    summary: InterPro2GO mapping of MCP/HAMP signatures to signal transduction. True, but general.
    action: MODIFY
    reason: "True but general. McpS signaling starts with an extracellular ligand binding its periplasmic domain at the cell surface and ends with control of flagellar behaviour through CheA/CheY, which is GO:0007166 cell surface receptor signaling pathway ('The series of molecular signals initiated by an extracellular ligand binding to a receptor located on the cell surface'), an is_a child of signal transduction. No more specific signaling term is carried by the gene, so MODIFY rather than TOO_GENERAL; this matches the treatment of the same row on E. coli Tar."
    proposed_replacement_terms:
    - id: GO:0007166
      label: cell surface receptor signaling pathway
    supported_by:
    - reference_id: file:PSEPK/mcpS/mcpS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Chemotactic-signal transducers respond to changes in the concentration of attractants and repellents in the environment, transduce a signal from the outside to the inside of the cell, and facilitate sensory adaptation through the variation of the level of methylation.
    - reference_id: file:PSEPK/mcpS/mcpS-deep-research-falcon.md
      supporting_text: '**MCP chemoreceptors** detect chemoeffectors and modulate the activity of the histidine kinase **CheA** (via coupling proteins such as CheW), which then controls the phosphorylation state of downstream regulators (e.g., CheY) that alter swimming behavior'
