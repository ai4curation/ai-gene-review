  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3205 encodes a fumarylacetoacetate-hydrolase-family protein in the KT2440
  flavonoid-degradation locus. KEGG assigns it to FdeI orthology group K26185
  and predicts two late reactions: decarboxylation of a flavonoid-derived
  beta-keto acid (R13078) followed by water elimination (R13079). Neither
  reaction has been demonstrated directly, so only the carboxy-lyase class of
  the explicitly drawn decarboxylation is proposed.
