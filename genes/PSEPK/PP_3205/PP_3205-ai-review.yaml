core_functions:
- description: >-
    Predicted FdeI FAH-fold enzyme of late bacterial naringenin degradation,
    assigned by KEGG to decarboxylation of a flavonoid-derived beta-keto acid
    (R13078) and water elimination (R13079); no reaction-specific molecular
    function is established.
  directly_involved_in:
