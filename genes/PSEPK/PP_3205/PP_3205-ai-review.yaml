proposed_new_terms:
- proposed_name: flavonoid-derived beta-keto acid decarboxylase activity
  proposed_definition: >-
    Catalysis of decarboxylation of
    5-hydroxy-5-(4-hydroxyphenyl)-3-oxopentanoate to
    4-hydroxy-4-(4-hydroxyphenyl)-butan-2-one and carbon dioxide.
  justification: >-
    KEGG R13078 specifies the predicted FdeI substrate and product. The term
    is proposed for use if the reaction is demonstrated; it is not asserted
    for PP_3205 now.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: file:PSEPK/PP_3205/PP_3205-bioinformatics/RESULTS.md
    supporting_text: 'R13078 is a predicted decarboxylation'
knowledge_gaps:
- gap_statement: Neither R13078 nor R13079 has been demonstrated for PP_3205 or Hsero_1011.
  boundary: >-
    Orthology supports an FdeI pathway role, and KEGG predicts a carboxy-lyase
    reaction (R13078), but neither reaction has been assayed and R13079 may be
    a second FdeI activity or a spontaneous step.
  gap_kind: [BIOLOGY]
  status: OPEN
  significance: Direct assays are needed before treating either substrate-specific reaction as established.
  resolution: Reconstitute PP_3205 sequentially with the R13078 and R13079 substrates and identify products by LC-MS.
  provenance:
  - reference_id: file:PSEPK/PP_3205/PP_3205-bioinformatics/RESULTS.md
    supporting_text: Neither reaction has been demonstrated for either protein.
suggested_questions:
- question: Does PP_3205 catalyze both R13078 and R13079, or is water elimination spontaneous or enzyme-independent?
suggested_experiments:
- description: >-
    Purify PP_3205 and assay the two predicted substrates separately and
    sequentially, measuring carbon dioxide release and product formation.
  experiment_type: biochemical reconstitution and targeted metabolomics
