  qualifier: enables
  review:
    summary: Catalytic activity is correct but uninformative for the predicted FdeI decarboxylation.
    action: MODIFY
    reason: >-
      K26185/R13078 predicts nonhydrolytic loss of carbon dioxide from a
      flavonoid-derived beta-keto acid, which is captured by carboxy-lyase
      activity. The second R13079 chemistry remains unresolved.
    proposed_replacement_terms:
    - id: GO:0016831
      label: carboxy-lyase activity
    supported_by:
    - reference_id: file:PSEPK/PP_3205/PP_3205-bioinformatics/RESULTS.md
      supporting_text: 'R13078 is a predicted decarboxylation'
