taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_3205 encodes a fumarylacetoacetate-hydrolase-family protein in the KT2440
  flavonoid-degradation locus. KEGG assigns it to FdeI orthology group K26185
  and predicts two late reactions: decarboxylation of a flavonoid-derived
  beta-keto acid (R13078) followed by water elimination (R13079). Neither
  reaction has been demonstrated directly, and KEGG marks both as unclear, so
  its molecular function is unresolved.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Catalytic activity is as specific as the evidence allows: FAH-fold
      membership establishes an enzyme, but not which reaction class.
    action: ACCEPT
    reason: >-
      FAH-family catalytic-domain membership supports enzymatic activity. A
      more specific term is not supported: the FAH fold includes hydrolases,
      decarboxylases, isomerases and hydratases, and both K26185 reactions
      (R13078 decarboxylation, R13079 water elimination) are KEGG predictions
      that neither this protein nor Hsero_1011 has been shown to catalyse, so
      catalytic activity is as specific as the evidence supports. The predicted decarboxylase role is
      carried in the knowledge gap and proposed term, matching the Hsero_1011,
      FdeH and FdeJ reviews.
    supported_by:
    - reference_id: file:PSEPK/PP_3205/PP_3205-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR011234; Fumarylacetoacetase-like_C.'
    - reference_id: file:PSEPK/PP_3205/PP_3205-bioinformatics/RESULTS.md
      supporting_text: Neither reaction has been demonstrated for either protein.
