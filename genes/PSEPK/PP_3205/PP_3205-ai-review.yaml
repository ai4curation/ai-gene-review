knowledge_gaps:
- gap_statement: Neither R13078 nor R13079 has been demonstrated for PP_3205 or Hsero_1011.
  boundary: >-
    Orthology supports an FdeI pathway role, and R13078 defines a carboxy-lyase
    reaction, but R13079 may be a second FdeI activity or a spontaneous step.
  gap_kind: [BIOLOGY, CURATION]
  status: OPEN
  significance: Direct assays are needed before treating either substrate-specific reaction as established.
  resolution: Reconstitute PP_3205 sequentially with the R13078 and R13079 substrates and identify products by LC-MS.
  provenance:
  - reference_id: file:PSEPK/PP_3205/PP_3205-bioinformatics/RESULTS.md
    supporting_text: Neither reaction has been demonstrated for either protein.
suggested_questions:
- question: Does PP_3205 catalyze both R13078 and R13079, or is water elimination spontaneous or enzyme-independent?
suggested_experiments:
- description: >-
    Purify PP_3205 and assay the two predicted substrates separately and
    sequentially, measuring carbon dioxide release and product formation.
  experiment_type: biochemical reconstitution and targeted metabolomics
