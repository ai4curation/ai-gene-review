- id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-notes.md
  title: Curation notes for Pseudomonas putida KT2440 fadA
  findings:
  - statement: >-
      KT2440 catabolizes phenylacetate through a dedicated paa operon whose own thiolase paaJ is separately
      annotated, so GO:0010124 on fadA is thiolase-fold propagation rather than a FadA-specific role.
  - statement: >-
      paaJ receives the phenylacetate term from a different TreeGrafter node than the one that placed
      it on fadA, which corroborates but does not by itself establish the REMOVE.
