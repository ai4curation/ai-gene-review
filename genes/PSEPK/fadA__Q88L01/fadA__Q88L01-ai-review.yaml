- term:
    id: GO:0036125
    label: fatty acid beta-oxidation multienzyme complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
  qualifier: part_of
  review:
    summary: FadA is inferred to be the beta subunit of the matched KT2440 FadBA complex.
    action: NEW
    reason: Preserve the historical ISS proposal. The curated HAMAP subunit assignment, conserved FadA/FadB
      architecture and independent native PP_2136/PP_2137 fitness support the compatible assembly inference.
      This is structural participation, not a new assertion made merely because FadB carries a complex
      annotation. Purified E. coli complex evidence is comparative; neither target stoichiometry nor arbitrary
      mixed-species compatibility has been measured.
    supported_by:
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: Heterotetramer of two alpha chains (FadB) and two beta chains (FadA).
    - reference_id: PMID:368024
      supporting_text: Evidence is presented in support of the proposed association of all five enzyme
        activities with one protein which apparently is composed of two types of subunits and which can
        exist in several aggregated forms.
