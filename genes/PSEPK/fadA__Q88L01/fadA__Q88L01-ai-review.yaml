- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The reviewed FadA record supports fatty acid beta-oxidation, not phenylacetate catabolism.
    action: REMOVE
    reason: >-
      This is a TreeGrafter electronic inference (GO_REF:0000118, WITH/FROM
      PANTHER:PTN002466592) with no experimental grounding. KT2440 catabolizes
      phenylacetate through a dedicated paa operon that supplies its own
      thiolase, paaJ (Q88HS3, PP_3280), which receives GO:0010124 from a
      different TreeGrafter node (PANTHER:PTN001291485); the flanking paa steps
      are likewise covered by paaH (Q88HS1, PP_3282) and paaF (Q88HR9, PP_3284).
      Q88L01 is instead assigned to the FadA-specific PANTHER subfamily
      PTHR43853:SF11 and typed by HAMAP rule MF_01620, both of which confine it
      to fatty acid beta-oxidation. The phenylacetate term therefore reaches this
      entry by thiolase-fold propagation rather than by any FadA-specific role.
    supported_by:
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      supporting_text: PANTHER; PTHR43853:SF11; 3-KETOACYL-COA THIOLASE FADA; 1.
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-notes.md
      supporting_text: paaJ receives GO:0010124 from a
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-notes.md
      supporting_text: KT2440 runs phenylacetate catabolism
