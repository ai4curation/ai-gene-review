- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Phenylacetate-pathway participation is not established or excluded for this FadA thiolase.
    action: UNDECIDED
    reason: Q88L01 is a HAMAP FadA/SF11 protein with supported native fatty-acid-catabolic function. The
      propagated phenylacetate claim is questionable across the broad thiolase family, but a dedicated
      PaaJ route does not by itself prove that FadA cannot contribute. Moreover, the previous argument
      identified PP_3280 as the dedicated PaaJ, while full primary32826213 names PP_3275; the frozen PP_3280
      symbol/domain record therefore cannot serve as decisive target-exclusion evidence. No exact target
      loss or negative phenylacetate assay is established. Retain uncertainty pending locus/phylogeny/functional
      resolution rather than infer loss from the donor count.
    supported_by:
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      record_section:
      - DR:PANTHER
      supporting_text: PANTHER; PTHR43853:SF11; 3-KETOACYL-COA THIOLASE FADA; 1.
