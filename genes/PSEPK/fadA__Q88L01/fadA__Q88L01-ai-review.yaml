- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The reviewed FadA record supports fatty acid beta-oxidation, not phenylacetate catabolism.
    action: REMOVE
    reason: >-
      KT2440 catabolizes phenylacetate through a dedicated paa operon whose
      thiolase step is already filled by paaJ (Q88HS3, PP_3280, EC 2.3.1.174),
      with the flanking steps covered by paaH (Q88HS1, PP_3282) and paaF
      (Q88HR9, PP_3284), while Q88L01 is assigned to the FadA-specific PANTHER
      subfamily PTHR43853:SF11 and typed by HAMAP rule MF_01620, both of which
      confine it to fatty acid beta-oxidation. The term is an unreviewed
      TreeGrafter inference (GO_REF:0000118, WITH/FROM PANTHER:PTN002466592) and
      reaches this entry by thiolase-fold propagation rather than by any
      FadA-specific role. That paaJ receives GO:0010124 from a different node
      (PANTHER:PTN001291485) corroborates this but is not decisive on its own,
      since two thiolase clades could in principle both act in the pathway. Note
      that PTN002466592 is also among the sources of the GO:0006635 annotation
      accepted above, there joined by UniRule:UR000080052 and
      UniPathway:UPA00659: the node is a beta-oxidation node, and it is the
      phenylacetate term sitting on it that is anomalous, so this REMOVE does not
      undercut that ACCEPT.
    supported_by:
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      supporting_text: PANTHER; PTHR43853:SF11; 3-KETOACYL-COA THIOLASE FADA; 1.
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-goa.tsv
      supporting_text: GO:0010124 phenylacetate catabolic process biological_process
        ECO:0007826 IEA GO_REF:0000118 PANTHER:PTN002466592
    - reference_id: file:PSEPK/paaJ/paaJ-goa.tsv
      supporting_text: GO:0010124 phenylacetate catabolic process biological_process
        ECO:0007826 IEA GO_REF:0000118 PANTHER:PTN001291485
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-notes.md
      supporting_text: paaJ receives GO:0010124 from a different TreeGrafter node
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-notes.md
      supporting_text: KT2440 runs phenylacetate catabolism through a dedicated
