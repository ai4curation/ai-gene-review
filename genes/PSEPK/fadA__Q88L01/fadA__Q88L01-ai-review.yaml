taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  fadA (PP_2137) encodes 3-ketoacyl-CoA thiolase, the beta subunit of the cytoplasmic FadBA fatty acid
  oxidation complex of Pseudomonas putida KT2440, orthologous to Escherichia coli FadA. It cleaves a 3-oxoacyl-CoA
  with coenzyme A to release acetyl-CoA and a fatty acyl-CoA two carbons shorter, the final reaction of
  each turn of beta-oxidation.
