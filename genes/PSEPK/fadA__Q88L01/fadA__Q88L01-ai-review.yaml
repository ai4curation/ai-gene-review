id: Q88L01
gene_symbol: fadA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FadA (PP_2137; Q88L01) is the inferred beta subunit of the cytoplasmic FadBA fatty-acid oxidation
  complex in Pseudomonas putida KT2440. It catalyzes thiolytic cleavage of a 3-oxoacyl-CoA with coenzyme
  A to form acetyl-CoA and an acyl-CoA shortened by two carbons. Native transposon fitness supports fatty-acid
  utilization, especially longer substrates, while exact enzyme specificity and complex stoichiometry
  remain comparative assignments.
