- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: TreeGrafter phenylacetate catabolic process from PTN002466592.
    action: REMOVE
    reason: >-
      KT2440 catabolizes phenylacetate through a dedicated paa operon whose thiolase step is filled by
      paaJ (PP_3280, PTHR43853:SF2), while Q88L01 is in the FadA-specific subfamily SF11 and typed by
      HAMAP rule MF_01620, both of which place it in fatty acid beta-oxidation. In the PAINT snapshot
      the phenylacetate term reaches FadA orthologues from a thiolase node seeded for that term only by
      E. coli PaaJ, so it arrives by over-propagation, not by any FadA-specific role.
    supported_by:
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      record_section:
      - DR:PANTHER
      supporting_text: PANTHER; PTHR43853:SF11; 3-KETOACYL-COA THIOLASE FADA; 1.
    - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
      record_section:
      - DR:HAMAP
      supporting_text: HAMAP; MF_01620; FadA; 1.
    - reference_id: file:PSEPK/paaJ/paaJ-uniprot.txt
      record_section:
      - DR:PANTHER
      supporting_text: PANTHER; PTHR43853:SF2; 3-OXOADIPYL-COA_3-OXO-5,6-DEHYDROSUBERYL-COA THIOLASE;
        1.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      asserted_value: GO:0010124
      requested_change: CHECK
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        TreeGrafter grafts Q88L01 into the FadA subfamily PTHR43853:SF11 (node PTN002466592) and inherits
        GO:0010124 from the PAINT thiolase node PTN001823071, where the term is seeded only by E. coli
        PaaJ (P0C7L2, SF2). FadA is a beta-oxidation thiolase; the term should be confined to the PaaJ
        subfamily.
      supported_by:
      - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
        record_section:
        - DR:PANTHER
        supporting_text: PANTHER; PTHR43853:SF11; 3-KETOACYL-COA THIOLASE FADA; 1.
      - reference_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
