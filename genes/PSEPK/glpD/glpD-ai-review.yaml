id: Q88NY0
gene_symbol: glpD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  glpD (PP_1073) encodes the FAD-dependent, membrane-associated aerobic
  glycerol-3-phosphate dehydrogenase of the KT2440 glp locus. It oxidizes
  sn-glycerol-3-phosphate to dihydroxyacetone phosphate while reducing a quinone
  acceptor; organism-specific pathway work identifies ubiquinone as the
  physiological acceptor. GlpD therefore links glycerol catabolism to the
  respiratory quinone pool and is not the soluble NAD-dependent
  glycerol-3-phosphate dehydrogenase used in the opposite biosynthetic
  direction.
existing_annotations:
- term:
    id: GO:0004368
    label: glycerol-3-phosphate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The EC/Rhea assignment and direct KT2440 pathway description agree that GlpD oxidizes G3P with ubiquinone/quinone as acceptor.
    action: ACCEPT
    reason: This is the specific core catalytic function; an NAD-dependent term would be incorrect.
    supported_by:
    - reference_id: file:PSEPK/glpD/glpD-notes.md
      supporting_text: "Glycerol-3-P is then oxidized in an ubiquinone-dependent reaction catalyzed by the membrane-bound GlpD"
    - reference_id: file:PSEPK/glpD/glpD-deep-research-openscientist.md
      supporting_text: "Its primary function is to catalyze the oxidation of *sn*-glycerol-3-phosphate (G3P) to dihydroxyacetone phosphate (DHAP), transferring the abstracted electron pair through a non-covalently bound FAD prosthetic group to a membrane quinone."
- term:
    id: GO:0006072
    label: glycerol-3-phosphate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GlpD consumes sn-glycerol-3-phosphate, so participation in its metabolism is correct.
    action: KEEP_AS_NON_CORE
    reason: The directional glycerol-3-phosphate catabolic term is more informative.
- term:
    id: GO:0009331
    label: glycerol-3-phosphate dehydrogenase (FAD) complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: part_of
  review:
    summary: The transferred complex term is not supported by target-specific subunit or oligomerization evidence for KT2440 GlpD.
    action: UNDECIDED
    reason: >-
      Q88NY0 is a single aerobic glpD gene with no identified GlpB/GlpC
      partners, and the available sources do not establish whether a
      homomeric assembly warrants this complex term.
    supported_by:
    - reference_id: file:PSEPK/glpD/glpD-deep-research-openscientist.md
      supporting_text: "a single *glpD* gene within *glpFKRD*, with **no adjacent glpB/glpC subunit genes**"
- term:
    id: GO:0005886
