proposed_new_terms: []
suggested_questions:
- question: >-
    The in_complex GO:0009331 (glycerol-3-phosphate dehydrogenase (FAD)
    complex) for Q88NY0 is homology-based: it rests on about 57% identity to
    E. coli GlpD, whose homodimer is known from the crystal structure, and not
    on a KT2440 oligomerization assay. Is KT2440 GlpD a homodimer, and should
    the complex term be kept as IEA/ISS only until it is tested?
suggested_experiments:
- hypothesis: >-
    KT2440 GlpD is a ubiquinone-reducing, inner-membrane-associated enzyme that
    carries most glycerol-derived G3P oxidation.
  description: >-
    Purify KT2440 GlpD (PP_1073) and measure steady-state kinetics with
    sn-glycerol-3-phosphate and a panel of ubiquinone and menaquinone analogues.
    Use fractionation or a GlpD-fluorescent-protein fusion to confirm
    inner-membrane association, and test a clean deletion for growth on glycerol
    with and without lanthanum to separate GlpD from the PQQ-dependent
    glycerol-oxidation route.
  experiment_type: biochemical assay and genetic deletion
