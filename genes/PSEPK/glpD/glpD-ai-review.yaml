      glycerol-3-phosphate"). The gene already carries GO:0046168 (TreeGrafter
      IEA), so the general term is refined to it. The same refinement is made for
      the E. coli ortholog.
    proposed_replacement_terms:
    - id: GO:0046168
      label: glycerol-3-phosphate catabolic process
    supported_by:
    - reference_id: PMID:25827416
      supporting_text: "G3P is the substrate for GlpD, a membrane-bound G3P dehydrogenase that yields dihydroxyacetone-P"
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR000447; G3P_DH_FAD-dep."
- term:
    id: GO:0009331
    label: glycerol-3-phosphate dehydrogenase (FAD) complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: part_of
  review:
    summary: >-
      UniRule (UR000067708) sequence-feature transfer (GO_REF:0000104) of the
      FAD G3P dehydrogenase complex term. GO defines this complex to include the
      aerobic GlpD homodimer, and Q88NY0 is an aerobic GlpD.
    action: ACCEPT
    reason: >-
      GO:0009331 is defined as "An enzyme complex that catalyzes the oxidation
      of sn-glycerol 3-phosphate to dihydroxyacetone phosphate, with concurrent
      reduction of flavin adenine dinucleotide (FAD) to FADH2. In E. coli, the
      complex is either a GlpA-GlpB-GlpC heterotrimer that functions in
      anaerobic conditions, or a GlpD homodimer that functions in aerobic
      conditions." The term does not require GlpB/GlpC partners: the GlpD
      homodimer is an explicit instance. Q88NY0 is the aerobic GlpD-type enzyme.
      It is about 57% identical to E. coli GlpD, against about 27% to GlpA,
      shares PANTHER subfamily PTHR11985:SF15 with P13035, and has no glpB/glpC
      neighbours. The E. coli crystal structures show a physiological homodimer
      whose interface helps form the active site. That makes dimerization a
      structural requirement of the catalytic fold, likely conserved at this
      level of identity. The IEA rests on homology, not a KT2440 oligomerization
      assay. The same term is accepted for the E. coli ortholog on IDA.
    additional_reference_ids:
    - PMID:18296637
    supported_by:
    - reference_id: PMID:18296637
      supporting_text: >-
        In GlpD, the monomer interface form extensive interactions with a
        contact (buried) surface area of 1,626.4 Å ( 2 ), strongly signifying
        that the dimeric structural state determined crystallographically is
        the physiologically relevant dimer.
    - reference_id: PMID:18296637
      supporting_text: >-
        Dehydrogenation occurs at a protected active site formed via the dimer
        interface and through the folded protein scaffold
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11985:SF15; GLYCEROL-3-PHOSPHATE DEHYDROGENASE, MITOCHONDRIAL; 1."
    - reference_id: file:PSEPK/glpD/glpD-deep-research-openscientist.md
      supporting_text: "a single *glpD* gene within *glpFKRD*, with **no adjacent glpB/glpC subunit genes**"
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:18296637
  qualifier: located_in
  review:
    summary: >-
      Proposed location: GlpD is a monotopic flavoenzyme on the cytoplasmic face
      of the bacterial inner (plasma) membrane, transferred by sequence
      similarity from the E. coli ortholog P13035.
    action: NEW
    reason: >-
      GOA has no cellular-component row for Q88NY0 other than the complex. The
      UniProt record has no SUBCELLULAR LOCATION comment and no transmembrane
      feature, consistent with a monotopic rather than an integral protein.
      Three independent lines agree on plasma-membrane association. (1) The
      E. coli ortholog P13035 (about 57% identical, same PTHR11985:SF15
      subfamily) localizes to the cytoplasmic membrane. Its structure shows a
      monotopic membrane-embedded base and a hydrophobic ubiquinone-binding
      plateau (PMID:18296637). (2) The KT2440 glycerol study describes GlpD as
      membrane-bound and ubiquinone-dependent (Nikel et al. 2015, quoted in the
      notes). (3) The quinone acceptor is a membrane-resident lipid, so the
      reaction only makes sense at the membrane. Evidence is ISS from P13035,
      with the ortholog paper as the reference.
    additional_reference_ids:
    - PMID:25827416
    supported_by:
    - reference_id: PMID:18296637
      supporting_text: >-
        GlpD is localized to the cytoplasmic membrane in E. coli and may
        constitute as much as 10% of the inner membrane proteins in constitutive
        strains, exhibiting membrane-dependency for activity
    - reference_id: PMID:18296637
      supporting_text: >-
        we estimate that GlpD embeds to depths of ≈12–15 Å into the lipid
        bilayer
    - reference_id: PMID:25827416
      supporting_text: "Glycerol-3-P is then oxidized in an ubiquinone-dependent reaction catalyzed by the membrane-bound GlpD"
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11985:SF15; GLYCEROL-3-PHOSPHATE DEHYDROGENASE, MITOCHONDRIAL; 1."
- term:
    id: GO:0046168
    label: glycerol-3-phosphate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter assignment (GO_REF:0000118, PANTHER:PTN002279478) of
      glycerol-3-phosphate catabolism. GlpD converts G3P to DHAP in the
      glycerol-utilization direction.
    action: ACCEPT
    reason: >-
      TreeGrafter places Q88NY0 in the PTHR11985 tree and transfers PAINT
      annotations from the ancestral nodes. In the PAINT data, PTN008531994
      carries GO:0046168 by IBD, seeded by E. coli GlpA (P0A9C0) and GlpD
