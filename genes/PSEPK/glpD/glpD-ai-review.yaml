    label: glycerol-3-phosphate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Combined electronic assignment (GO_REF:0000120; EC 1.1.5.3, RHEA:18977,
      InterPro IPR000447, ARBA and the TreeGrafter node PTN002279478) of
      quinone-dependent glycerol-3-phosphate dehydrogenase activity. The KT2440
      pathway literature and the E. coli ortholog agree.
    action: ACCEPT
    reason: >-
      GO:0004368 is defined as "Catalysis of the reaction: sn-glycerol
      3-phosphate + a quinone = glycerone phosphate + a quinol." Q88NY0 carries
      the diagnostic FAD-dependent G3P dehydrogenase family signatures
      (IPR000447, both PROSITE FAD_G3PDH motifs) and the RuleBase-assigned
      quinone reaction. The KT2440 glycerol paper (Nikel et al. 2015, full text
      checked and quoted in the notes) describes the enzyme as membrane-bound and
      ubiquinone-dependent. The structurally characterized E. coli ortholog
      P13035 (about 57% identical) passes electrons from FAD to ubiquinone. This
      is the core activity. An NAD-dependent G3P dehydrogenase term would be
      wrong.
