  evidence_type: ISS
  original_reference_id: file:PSEPK/glpD/glpD-deep-research-openscientist.md
  qualifier: located_in
  review:
    summary: GlpD is a monotopic enzyme associated with the cytoplasmic face of the bacterial plasma membrane.
    action: NEW
