- term:
    id: GO:0046168
    label: glycerol-3-phosphate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter assignment (GO_REF:0000118, PANTHER:PTN002279478) of
      glycerol-3-phosphate catabolism. GlpD converts G3P to DHAP in the
      glycerol-utilization direction.
    action: ACCEPT
    reason: >-
      TreeGrafter places Q88NY0 in the PTHR11985 tree and transfers PAINT
      annotations from the ancestral nodes. In the PAINT data, PTN008531994
      carries GO:0046168 by IBD, seeded by E. coli GlpA (P0A9C0) and GlpD
      (P13035). GO:0046168 is "The chemical reactions and pathways resulting in
      the breakdown of glycerol-3-phosphate". GlpD carries out that breakdown:
      it oxidizes the GlpK product G3P to DHAP within the KT2440 glpFKRD
      glycerol pathway. This is the direct, specific process for its catalytic
      step.
    supported_by:
    - reference_id: PMID:25827416
      supporting_text: "G3P is the substrate for GlpD, a membrane-bound G3P dehydrogenase that yields
        dihydroxyacetone-P"
    - reference_id: PMID:25827416
      supporting_text: >-
        Either deleting glpR (encoding the G3P-responsive transcriptional
        repressor that controls the expression of the glpFKRD gene cluster) or
        altering G3P formation (by overexpressing glpK, encoding glycerol
        kinase) abolished the bimodal glpD expression.
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11985; GLYCEROL-3-PHOSPHATE DEHYDROGENASE; 1."
