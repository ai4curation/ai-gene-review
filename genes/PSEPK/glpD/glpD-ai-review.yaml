id: Q88NY0
gene_symbol: glpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: glpD (PP_1073) encodes the FAD-dependent, membrane-associated aerobic glycerol-3-phosphate
  dehydrogenase of the KT2440 glpFKRD glycerol-utilization locus. It oxidizes sn-glycerol-3-phosphate,
  the product of glycerol kinase GlpK, to dihydroxyacetone phosphate while reducing a respiratory quinone,
  with ubiquinone assigned in the KT2440 pathway literature rather than identified by an isolated Q88NY0
  acceptor-specificity assay. By analogy with the structurally characterized Escherichia coli ortholog
  (57.2% identity across aligned residue pairs), it is inferred to be a monotopic homodimeric flavoenzyme
  that dips into the cytoplasmic face of the inner membrane. GlpD thereby links glycerol catabolism to
  the respiratory quinone pool; it is distinct from the soluble NAD-dependent glycerol-3-phosphate dehydrogenase
  that works in the biosynthetic direction.
