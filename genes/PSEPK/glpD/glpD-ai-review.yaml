id: Q88NY0
gene_symbol: glpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  glpD (PP_1073) encodes the FAD-dependent, membrane-associated aerobic
  glycerol-3-phosphate dehydrogenase of the KT2440 glpFKRD glycerol-utilization
  locus. It oxidizes sn-glycerol-3-phosphate, the product of glycerol kinase
  GlpK, to dihydroxyacetone phosphate while reducing a respiratory quinone, with
  ubiquinone described as the physiological acceptor in KT2440. By analogy with
  the structurally characterized Escherichia coli ortholog (about 57% identical),
  it is a monotopic homodimeric flavoenzyme that dips into the cytoplasmic face
  of the inner membrane. GlpD thereby links glycerol catabolism to the
  respiratory quinone pool; it is distinct from the soluble NAD-dependent
  glycerol-3-phosphate dehydrogenase that works in the biosynthetic direction.
existing_annotations:
- term:
    id: GO:0004368
    label: glycerol-3-phosphate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Combined electronic assignment (GO_REF:0000120; EC 1.1.5.3, RHEA:18977,
      InterPro IPR000447, ARBA and the TreeGrafter node PTN002279478) of
      quinone-dependent glycerol-3-phosphate dehydrogenase activity. The KT2440
      pathway literature and the E. coli ortholog agree.
    action: ACCEPT
    reason: >-
      GO:0004368 is defined as "Catalysis of the reaction: sn-glycerol
      3-phosphate + a quinone = glycerone phosphate + a quinol." Q88NY0 carries
      the diagnostic FAD-dependent G3P dehydrogenase family signatures
      (IPR000447, both PROSITE FAD_G3PDH motifs) and the RuleBase-assigned
      quinone reaction. The KT2440 glycerol paper (Nikel et al. 2015, full text
      checked and quoted in the notes) describes the enzyme as membrane-bound and
      ubiquinone-dependent. The structurally characterized E. coli ortholog
      P13035 (about 57% identical) passes electrons from FAD to ubiquinone. This
      is the core activity. An NAD-dependent G3P dehydrogenase term would be
      wrong.
    additional_reference_ids:
    - PMID:18296637
    supported_by:
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=a quinone + sn-glycerol 3-phosphate = dihydroxyacetone phosphate + a quinol; Xref=Rhea:RHEA:18977"
    - reference_id: file:PSEPK/glpD/glpD-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR000447; G3P_DH_FAD-dep."
    - reference_id: PMID:25827416
      supporting_text: "Glycerol-3-P is then oxidized in an ubiquinone-dependent reaction catalyzed by the membrane-bound GlpD"
    - reference_id: PMID:18296637
      supporting_text: >-
        GlpD catalyzes the oxidation of G3P to dihydroxyacetone phosphate
        (DHAP), with concurrent reduction of flavin adenine dinucleotide (FAD)
        to FADH 2 , and passes electrons on to ubiquinone (UQ) and ultimately to
        oxygen or nitrate
- term:
    id: GO:0006072
    label: glycerol-3-phosphate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Combined electronic assignment (GO_REF:0000120; InterPro IPR000447 and
      UniRule UR000067708) of the parent G3P metabolic-process term. GlpD
      consumes sn-glycerol-3-phosphate, so the claim is true but less specific
      than the evidence allows.
    action: MODIFY
    reason: >-
      GO:0006072 is "The chemical reactions and pathways involving
      glycerol-3-phosphate". GlpD oxidizes G3P to DHAP in the catabolic
      direction, which is captured by the is_a child GO:0046168
