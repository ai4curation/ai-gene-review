  review:
    summary: FliJ organizes and activates the export ATPase/gate, rather than generating flagellar
      motor torque.
    action: REMOVE
    reason: The KT2440 assignment is inferred from the target-specific NCBIfam/InterPro classification
      and conserved export-system context; the mechanistic experiments cited here used Salmonella,
      not KT2440. The verified GO definition requires force generation producing movement
      or torque. A central-stalk resemblance and promotion of FliI oligomerization do not
      establish an independently enabled cytoskeletal motor activity. The flagellar assembly/export
      role is mechanistically distinct from rotation of the external flagellum.
    supported_by:
