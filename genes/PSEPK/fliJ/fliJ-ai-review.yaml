  review:
    summary: The flagellar export machinery supports the locomotor apparatus, but the extent
      of its participation in chemotaxis is not resolved by the available evidence.
    action: UNDECIDED
    reason: GO:0006935 describes directed movement in response to a chemical stimulus, not
      only sensory signaling. Absence of a receptor or phosphorelay role therefore does not
      by itself refute this annotation. The cited mechanistic sources establish flagellar
      export and motility, but do not isolate a chemotaxis-specific contribution of this export
      component. E. coli FliH/FliJ carry NAS chemotaxis claims from PMID31337100, so a blanket
      assembly-only exclusion would overrule an existing convention without adequate evidence.
      Retain uncertainty instead of converting the lack of a signaling role into a confident
      negative judgement.
