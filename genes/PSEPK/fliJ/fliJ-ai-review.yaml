taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FliJ is the soluble central-stalk component of the flagellar export ATPase apparatus.
  It promotes FliI ring formation and connects ATPase assembly to activation of FlhA-dependent
  protein export. In Pseudomonas putida KT2440 these functions are inferred from its conserved
  flagellar export-family identity. The membrane gate normally uses proton motive force; the
  cytoplasmic ATPase machinery improves export efficiency, and bypass conditions can support
  export without FliHI. ATP-driven export without bulk proton motive force has also been reconstituted
  in Salmonella membrane vesicles.
