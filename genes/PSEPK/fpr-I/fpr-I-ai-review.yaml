    summary: Orthology transfers the genetically established DSM 3601 FprA role to KT2440 Fpr-I.
    action: NEW
    reason: >-
      The fprA phenotype was measured in P. putida DSM 3601, not in a Q88MD5
      mutant. Q88MD5 is the KT2440 type-1 FprA ortholog at PP_1638, adjacent to
      finR at PP_1637, so ISO rather than IMP represents this transfer.
