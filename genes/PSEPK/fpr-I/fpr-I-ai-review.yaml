id: Q88MD5
gene_symbol: fpr-I
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Fpr-I (FprA; PP_1638) is an NADPH-linked flavin reductase that transfers electrons to ferredoxin
  and flavodoxin redox partners. The characterized Pseudomonas putida enzyme favors flavodoxin among tested
  carriers and contributes to oxidative-stress defense. Pseudomonad genetics implicate FprA in electron
  supply for assimilatory sulfite reduction, while the immediate carrier linking it to KT2440 CysI remains
  unresolved.
existing_annotations:
- term:
    id: GO:0004324
    label: ferredoxin-NADP+ reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Ferredoxin reduction is a supported activity despite preference for flavodoxin.
    action: ACCEPT
    reason: P. putida FprA reduces tested redox partners, with higher catalytic efficiency toward flavodoxin.
      Relative preference does not establish absence of ferredoxin reductase activity. This reaction assignment
      does not identify the physiological CysI carrier.
    supported_by:
    - &id002
      reference_id: PMID:19122206
      supporting_text: 'The catalytic efficiency of FprA is higher when Fld is present

        as its redox partner'
    - &id001
      reference_id: PMID:19122206
      supporting_text: 'Fprs in P. putida function as diaphorase,

        Fd/Fld reductases'
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Refine oxidoreductase activity to the supported ferredoxin-NADP reductase activity.
    action: MODIFY
    reason: The broad redox term is true; the measured Fd/Fld-reductase chemistry supports the existing
      more specific ferredoxin-NADP reductase term.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - id: GO:0004324
      label: ferredoxin-NADP+ reductase activity
- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Fpr-I contributes to defense against oxidative stress in KT2440.
    action: KEEP_AS_NON_CORE
    reason: The native KT2440 study reports stress induction and functional protection by fpr/finR, rather
      than relying on a generic redox-enzyme annotation. This contextual physiological role is retained
      outside the catalytic core.
    supported_by:
    - reference_id: PMID:16360643
      supporting_text: 'We have shown that the fpr and finR gene products can

        counteract the effects of oxidative and osmotic stresses.'
- term:
    id: GO:0042167
    label: heme catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Heme-catabolic electron transfer is not resolved for this KT2440 reductase.
    action: UNDECIDED
    reason: The sulfate-assimilation paper cites direct P. aeruginosa Fpr–heme oxygenase coupling, but
      that is a different species/enzyme context. No inspected source establishes the corresponding KT2440
      Fpr-I partner or physiological heme-catabolic role. This does not imply absence of activity.
    supported_by:
    - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3754593/
      supporting_text: It has been shown that P. aeruginosa FprA efficiently transfers electrons from
        NADPH to heme oxygenase
- term:
    id: GO:0000103
    label: sulfate assimilation
  evidence_type: ISO
  original_reference_id: PMID:23794620
  qualifier: involved_in
  review:
    summary: FprA contributes reducing power to sulfate assimilation.
    action: NEW
    reason: Preserve the existing proposal, supported by reduced-sulfur growth phenotypes and rescue with
      fprA or E. coli cysJI. Major experiments are in DSM3601 and transferred to the KT2440 ortholog;
      the carrier and possible direct CysI interaction remain unresolved.
    supported_by:
    - &id003
      reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3754593/
      supporting_text: These data indicate that fprA is necessary for effective sulfate assimilation by
        P. putida
    - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3754593/
      supporting_text: it also remains possible that FprA transfers electrons directly to CysI.
