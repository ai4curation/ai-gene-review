suggested_questions:
- question: Which KT2440 ferredoxin or flavodoxin transfers electrons from Fpr-I to CysI, and can Q88MD5
    reduce CysI directly?
suggested_experiments:
- description: Compare Q88MD5-supported CysI activity with direct Fpr-I/CysI mixtures and with a panel
