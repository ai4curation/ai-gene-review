id: Q88MD5
gene_symbol: fpr-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Fpr-I (PP_1638) is a type-1 FAD-dependent ferredoxin--NADP reductase. In the
  Pseudomonas sulfate-assimilation system, the corresponding FprA activity is
  required for efficient sulfite reduction and is proposed to supply electrons
  by regenerating a reduced ferredoxin or related carrier for CysI; the exact
  KT2440 carrier remains to be established experimentally.
