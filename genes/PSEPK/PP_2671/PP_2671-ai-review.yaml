  label: Pseudomonas putida KT2440
description: >-
  PedS2 is a membrane sensor histidine kinase in the PedS2/PedR2 two-component
  system. Without usable lanthanides it phosphorylates PedR2, promoting pedE
  transcription and contributing to pedH repression. Lanthanum lowers PedS2
  kinase output by a direct or indirect mechanism, shifting periplasmic
  PQQ-dependent alcohol oxidation toward lanthanide-dependent PedH.
