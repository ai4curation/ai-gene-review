  label: Pseudomonas putida KT2440
description: 'AlgG is the predicted periplasmic mannuronan C5-epimerase of Pseudomonas putida
  KT2440. It converts polymeric beta-D-mannuronate residues into alpha-L-guluronate during
  alginate maturation. The specific family assignment and characterized Pseudomonas orthologs
  support this activity and a separable role in protecting nascent polymer during export.
  Typical native Pseudomonas polymer composition does not define an absolute catalytic restriction:
  purified P. aeruginosa AlgG can generate adjacent guluronates in vitro. Target-specific
  residue requirements and product distributions have not been measured.'
