proposed_new_terms:
- proposed_name: mannuronan C5-epimerase activity
  proposed_definition: 'Catalysis of the polymer-level epimerization of beta-D-mannuronate
    residues in alginate to alpha-L-guluronate residues.

    '
  justification: 'GO currently has alginic acid biosynthetic process and broad epimerase terms,
    but it lacks a specific molecular function term for the defining AlgG reaction (EC 5.1.3.37).
    This forces curators to use the generic carbohydrate epimerase parent and loses the polymer-level
    substrate specificity that distinguishes AlgG from small-molecule epimerases.

    '
