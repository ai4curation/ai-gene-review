proposed_new_terms:
- proposed_name: mannuronan C5-epimerase activity
  proposed_definition: 'Catalysis of C5 epimerization of beta-D-mannuronate residues within a (1->4)-linked
    mannuronan chain to alpha-L-guluronate residues, producing alginate without cleaving the glycosidic
    backbone.'
  justification: 'GO:0016857 covers alteration of chiral centers in carbohydrate molecules, including
    polymer-bound residues, and is the valid current annotation. A specific term would preserve the polymer-level
    mannuronan substrate and C5 stereochemistry of EC 5.1.3.37 (RHEA:45572), distinguishing this reaction
    from small-molecule sugar epimerases. The precise term is an ontology proposal, not an additional
    redundant NEW annotation.'
  proposed_parent:
    id: GO:0016857
    label: racemase and epimerase activity, acting on carbohydrates and derivatives
