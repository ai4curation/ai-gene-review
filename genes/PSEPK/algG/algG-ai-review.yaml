suggested_questions:
- question: How important is AlgG's non-catalytic scaffolding role in KT2440 relative to its
    epimerase activity during native alginate production?
  experts:
  - Svein Valla
  - Dennis E. Ohman
- question: Under which physiological conditions does KT2440 deploy AlgG-dependent alginate
    remodeling most strongly?
  experts:
  - P. Lynne Howell
  - Martin Gimmestad
suggested_experiments:
- description: Create an algG deletion strain and catalytic-site mutants in the DPHD motif, then
    compare polymer yield and uronate composition under alginate-inducing conditions.
  hypothesis: Catalytic-dead mutants will separate guluronate formation from the structural role of
    AlgG in polymer protection/export.
- description: Measure secreted alginate composition by NMR or linkage-sensitive enzymology in wild
    type, algG-null, and complemented strains.
  hypothesis: AlgG activity and its biosynthetic context jointly determine guluronate content and
    block distribution; compare native polymers with purified-enzyme products rather than assume a
    catalytic ban on adjacent guluronates.
- description: Test physical or genetic interactions between AlgG and AlgK, AlgX, AlgE, and AlgL in
    KT2440.
  hypothesis: AlgG participates in a periplasmic biosynthetic complex that channels alginate away
    from AlgL during export.
