knowledge_gaps:
- gap_statement: >-
    The molecular activity of UbiK is unknown: it binds UbiJ and is needed for efficient
    ubiquinone synthesis, but whether it assembles the Ubi complex, tethers it to the membrane,
    or helps release ubiquinone into the membrane has not been tested.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does UbiK assemble the Ubi complex, target it to the membrane, or help release finished
    ubiquinone, and is its role the same in KT2440, whose complex would contain Coq7?
suggested_experiments:
- description: >-
    Delete PP_5235 in KT2440 and measure UQ-9 and 2-nonaprenylphenol under aerobic growth;
    compare Ubi-complex integrity (size-exclusion, pull-down of tagged UbiJ) in wild type and
    the ubiK mutant.
