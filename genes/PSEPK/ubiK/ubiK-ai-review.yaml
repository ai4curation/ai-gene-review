- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001223894
  - UniPathway:UPA00232
  review:
    summary: >-
      Core process. UbiK is a non-catalytic structural partner of UbiJ in the Ubi complex.
    action: ACCEPT
    reason: >-
      Participation test: UbiK catalyses no step, but as a UbiJ-binding component of the Ubi
      complex it contributes to the structure the steps depend on. E. coli ubiK mutants make
      less UQ and accumulate octaprenylphenol, indicating a pathway-wide rather than step-specific
      contribution. The molecular mechanism remains undefined.
    supported_by:
    - reference_id: file:PSEPK/ubiK/ubiK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Required for efficient ubiquinone (coenzyme Q) biosynthesis. UbiK is probably
        an accessory factor of Ubi enzymes and facilitates ubiquinone biosynthesis by acting as
        an assembly factor, a targeting factor, or both.
    - reference_id: PMID:28559279
      supporting_text: We found that both proteins are likely to contribute to global UQ biosynthesis
        rather than to a specific biosynthetic step, because both ubiK and ubiJ mutants accumulated
        octaprenylphenol, an early intermediate of the UQ biosynthetic pathway.
    - reference_id: file:PSEPK/ubiK/ubiK-deep-research-openscientist.md
      supporting_text: It does not catalyze any step of the pathway itself.
- term:
    id: GO:0110142
    label: ubiquinone biosynthesis complex
  evidence_type: ISS
  original_reference_id: PMID:28559279
  qualifier: part_of
  review:
    summary: >-
      Proposed: UbiK is one of the seven E. coli Ubi complex proteins and binds UbiJ.
    action: NEW
    reason: >-
      UbiK is named in the GO:0110142 definition and binds the C-terminal part of UbiJ. Q88CE6 is
      a HAMAP MF_02216 UbiK with the C-terminal coiled coil, and KT2440 has UbiJ (PP_5012). The
      composition of a P. putida complex is untested, so this is an orthology inference; it is
      the most specific statement available for a protein with no defined molecular function.
    supported_by:
    - reference_id: PMID:28559279
      supporting_text: Using several methods, we demonstrated that the UbiK protein forms a complex
        with the C-terminal part of UbiJ, another UQ biogenesis factor we previously identified.
    - reference_id: PMID:30686758
      supporting_text: Here, we demonstrate that seven Ubi proteins form the Ubi complex, a stable
        metabolon that catalyzes the last six reactions of the UQ biosynthetic pathway in Escherichia
        coli.
