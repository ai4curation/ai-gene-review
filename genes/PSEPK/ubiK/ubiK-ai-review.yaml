id: Q88CE6
gene_symbol: ubiK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiK (PP_5235) encodes the ubiquinone biosynthesis accessory factor UbiK, a small
  (88-residue) soluble protein of the UbiK family with a C-terminal coiled coil. By orthology to
  Escherichia coli UbiK, it binds the C-terminal region of the lipid-binding scaffold UbiJ
  (forming a UbiJ-UbiK2 heterotrimer) as part of the cytoplasmic Ubi complex, and is needed for
  efficient aerobic ubiquinone synthesis without catalysing any pathway step; whether it acts
  as an assembly or targeting factor is unknown. Function is inferred from the UbiK family and
  E. coli/Salmonella work; the KT2440 protein has not been studied.
