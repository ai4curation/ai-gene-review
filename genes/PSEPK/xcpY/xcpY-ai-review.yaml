  qualifier: located_in
  review:
    summary: XcpY is an integral subunit of the T2SS inner-membrane platform.
    action: NEW
    reason: >-
      The exact XcpY/GspL identity, GspL periplasmic domain, and hydrophobic
      membrane-spanning segment support bacterial inner-membrane localization.
      Note on the cited signature: the current InterPro release has withdrawn the
      IPR025691 match for this protein, which now matches only the ATPase
      nucleotide-binding superfamily IPR043129, while the P. aeruginosa GspL
      P25060 still carries IPR025691 with Pfam PF12693 and NCBIfam TIGR01709
      (checked against the InterPro API on 2026-11-17). The GspL identity is
      unaffected: it rests on the xcp locus and on the ortholog, and the
      withdrawal looks like a model or threshold change. It is recorded so that a
      refresh of this record reads as a signature change rather than a new error.
