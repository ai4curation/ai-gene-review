suggested_experiments:
- description: Measure HMG-CoA cleavage by purified MvaB across Mg2+, Mn2+, and metal-chelated
    conditions, and compare leucine growth phenotypes of mvaB, PP_3394, and double deletions.
suggested_questions:
- question: How is mvaB expression coordinated with the physically separated ivd-mccB-liuC-mccA
    cluster during growth on leucine or isovalerate?
