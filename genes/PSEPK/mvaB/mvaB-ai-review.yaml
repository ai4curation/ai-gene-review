  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: MvaB is a hydroxymethylglutaryl-CoA lyase that cleaves (S)-3-hydroxy-3-methylglutaryl-CoA
  to acetoacetate and acetyl-CoA. This shared terminal reaction can receive HMG-CoA from distal L-leucine
  catabolism and from other degradative pathways.
