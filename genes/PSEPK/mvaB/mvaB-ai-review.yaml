- id: file:PSEPK/mvaB/mvaB-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK mvaB
  findings:
  - statement: The report supports MvaB as the principal HMG-CoA lyase candidate while retaining
      uncertainty about the PP_3394 paralog and direct KT2440 biochemistry.
    supporting_text: No direct biochemistry on PP_3540 itself.
    reference_section_type: CONCLUSIONS
  - statement: The provider reports high sequence identity between MvaB and characterized P.
      aeruginosa LiuE.
    supporting_text: '| mvaB (PP_3540) vs. *P. aeruginosa* LiuE/PA2011 (characterized HMG-CoA lyase) | **78.6%** |'
    reference_section_type: RESULTS
  - statement: The provider reports that mvaB is genomically separated from the clustered upstream
      leucine-catabolism genes.
    supporting_text: By contrast, **mvaB/PP_3540 is located ~500 genes away** from this cluster
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Provider synthesis retained as secondary context; reported identity, active-site,
      pathway-presence, and localization analyses were not independently reproduced.
