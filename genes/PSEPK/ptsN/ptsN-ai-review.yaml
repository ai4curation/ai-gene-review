core_functions:
- description: Non-phosphorylated PtsN inhibits cellular PDH activity in association with AceE, coupling
    the terminal phosphostate of the PtsP–NPr–PtsN relay to metabolic output. Evidence combines native
    cellular association, extract activity and localization; purified binary inhibition kinetics are not
    established by the accessible abstract.
