aliases:
  - PP_0950
core_functions:
  - description: >-
      Acts as the terminal phosphorylation-state-dependent EIIA(Ntr) regulator
      downstream of PtsP and NPr.
    supported_by:
      - reference_id: PMID:18296519
        supporting_text: >-
          Our results show that the source of phosphate available to the system is PEP and that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr to EIIA(Ntr).
      - reference_id: PMID:17416664
        supporting_text: >-
          enzyme I(Ntr) (EI(Ntr); encoded by ptsP), NPr (ptsO), and EII(Ntr) (ptsN) act in concert to control the intracellular accumulation of polyhydroxyalkanoates
    contributes_to_molecular_function:
      id: GO:0016772
      label: transferase activity, transferring phosphorus-containing groups
suggested_questions:
  - question: Which KT2440 proteins interact directly with phosphorylated versus dephosphorylated PtsN?
suggested_experiments:
  - description: >-
      Perform phosphorylation-state-specific affinity proteomics with wild-type
      PtsN and a phosphoacceptor-site mutant, followed by target validation.
    experiment_type: PtsN regulatory target discovery
