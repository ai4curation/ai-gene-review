id: Q88PA0
gene_symbol: ptsN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PtsN is the terminal EIIA(Ntr) component of the nitrogen-regulatory
  phosphotransferase system in Pseudomonas putida KT2440. It receives phosphate
  from NPr/PtsO and acts as a phosphorylation-state-dependent regulatory adaptor.
  It directly controls KdpD-dependent potassium-transport regulation and, in its
  non-phosphorylated form, binds and inhibits pyruvate dehydrogenase E1/AceE; it
  is not a sugar-transport enzyme.
existing_annotations:
- term:
    id: GO:0008982
    label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PtsN is an EIIA-like regulatory phosphoprotein but does not transfer phosphate to carbohydrate.
    action: REMOVE
    reason: PMID:18296519 shows that this PTS(Ntr) branch is unrelated to sugar traffic.
- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PtsN belongs to a regulatory phosphorelay, not a sugar uptake PTS.
    action: REMOVE
    reason: The experimentally characterized KT2440 branch lacks a permease and does not phosphorylate sugar.
- term:
    id: GO:0030295
    label: protein kinase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: PtsN directly regulates KdpD, but the direction of the regulatory output is lineage dependent.
    action: MODIFY
    reason: >-
      Dephosphorylated E. coli IIA(Ntr) activates KdpD, whereas KT2440 PtsN,
      mainly in its phosphorylated state, represses kdpFABC transcription through
      direct KdpD interaction. Protein kinase regulator activity captures the
      conserved mechanism without incorrectly fixing the direction as activation.
    proposed_replacement_terms:
      - id: GO:0019887
        label: protein kinase regulator activity
    additional_reference_ids:
      - PMID:19400808
      - PMID:26224366
    supported_by:
      - reference_id: PMID:19400808
        supporting_text: >-
          Two-hybrid data and biochemical analysis revealed that IIA(Ntr) interacts with sensor kinase KdpD and stimulates kinase activity, resulting in increased levels of phosphorylated response regulator KdpE.
      - reference_id: PMID:26224366
        supporting_text: >-
          Measurements of kdpFp promoter activity in different pts mutants showed that PtsN is responsible for repression of kdpFABC transcription.
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: TAS
  original_reference_id: PMID:18296519
  qualifier: involved_in
  review:
    summary: PtsN is the terminal phospho-state signal readout of the intracellular PTS(Ntr) relay.
    action: NEW
    reason: >-
      The KT2440 study establishes ordered phosphate flow to PtsN, whose
      phosphorylation state controls downstream regulatory interactions.
    supported_by:
      - reference_id: PMID:18296519
        supporting_text: >-
          Our results show that the source of phosphate available to the system is PEP and that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr to EIIA(Ntr).
- term:
    id: GO:1901379
    label: regulation of potassium ion transmembrane transport
  evidence_type: IDA
  original_reference_id: PMID:26224366
  qualifier: involved_in
  review:
    summary: PtsN controls transcription of the high-affinity KdpFABC potassium transporter through KdpD.
    action: NEW
    reason: >-
      KT2440 promoter assays and bacterial two-hybrid analysis directly connect
      PtsN-KdpD interaction to phosphorylation-state-dependent regulation of
      kdpFABC expression.
    supported_by:
      - reference_id: PMID:26224366
        supporting_text: >-
          Bacterial two-hybrid assays demonstrated that kdpFp regulation is implemented through direct interaction of the PtsN protein with the sensor kinase KdpD of the KdpD/KdpE two-component system.
- term:
    id: GO:0004857
    label: enzyme inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:21236318
  qualifier: enables
  review:
    summary: Non-phosphorylated PtsN directly inhibits pyruvate dehydrogenase through AceE interaction.
    action: NEW
    reason: >-
      Target-organism interaction and activity assays establish direct,
      non-covalent inhibition of PDH by the non-phosphorylated PtsN species.
    supported_by:
      - reference_id: PMID:21236318
        supporting_text: >-
          Both genetic and biochemical evidence revealed that the non-phosphorylated form of PtsN is the protein species that inhibits PDH.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:21236318
  qualifier: located_in
  review:
    summary: PtsN is a soluble cytoplasmic regulator that also contacts KdpD at the inner-membrane face.
    action: NEW
    reason: Confocal microscopy directly demonstrated cytoplasmic co-localization of PtsN and AceE in KT2440.
    supported_by:
      - reference_id: PMID:21236318
        supporting_text: >-
          Expression of PtsN and AceE proteins fused to different fluorescent moieties and confocal laser microscopy indicated a significant co-localization of the two proteins in the bacterial cytoplasm.
