id: Q88PA0
gene_symbol: ptsN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PtsN is the terminal EIIA(Ntr) component of the nitrogen-regulatory
  phosphotransferase system in Pseudomonas putida KT2440. It receives phosphate
  from NPr/PtsO, and its phosphorylation state controls interactions with
  downstream metabolic and transport targets; it is not a sugar-transport
  enzyme.
existing_annotations:
- term:
    id: GO:0008982
    label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PtsN is an EIIA-like regulatory phosphoprotein but does not transfer phosphate to carbohydrate.
    action: REMOVE
    reason: PMID:18296519 shows that this PTS(Ntr) branch is unrelated to sugar traffic.
- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PtsN belongs to a regulatory phosphorelay, not a sugar uptake PTS.
    action: REMOVE
    reason: The experimentally characterized KT2440 branch lacks a permease and does not phosphorylate sugar.
- term:
    id: GO:0030295
    label: protein kinase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: PtsN has phosphorylation-state-dependent regulatory effects, but kinase activation is not its established core mechanism.
    action: REMOVE
    reason: The TreeGrafter term is not supported by the KT2440 phosphorelay studies and is too mechanistically specific.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings: []
- id: PMID:18296519
  title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida.
  findings:
    - statement: The study measures PtsN phosphorylation in vivo and places it at the relay terminus.
- id: PMID:17416664
  title: The phosphotransferase system formed by PtsP, PtsO, and PtsN proteins controls production of polyhydroxyalkanoates in Pseudomonas putida.
  findings:
    - statement: Genetic analysis connects the three-protein system to regulation of PHA accumulation.
