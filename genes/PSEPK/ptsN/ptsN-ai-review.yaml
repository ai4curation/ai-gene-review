suggested_questions:
- question: Does PtsN alter KdpD kinase activity, phosphatase activity, or both in KT2440, and how do
    external potassium and PtsN phosphorylation determine the outcome?
- question: Can the PtsN–AceE interaction and PDH inhibition be reproduced with purified components, and
    which molecular contacts control inhibition?
suggested_experiments:
- description: Perform phosphorylation-state-specific affinity proteomics with wild-type PtsN and a phosphoacceptor-site
    mutant, followed by target validation.
