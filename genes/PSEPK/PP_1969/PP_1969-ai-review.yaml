id: Q88LG4
gene_symbol: PP_1969
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1969 encodes a MoaA-family radical-SAM protein, one of three MoaA paralogs in
  P. putida KT2440. It has the N-terminal radical-SAM CxxxCxxC [4Fe-4S] motif and
  the C-terminal MoaA twitch domain with the second set of cluster cysteines, and
  the GTP-, S-adenosyl-L-methionine- and cluster-binding residues annotated on
  canonical KT2440 MoaA are conserved. It forms a closely related pair with PP_2482
  that falls below the function-level MoaA family models and differs from all
  characterized MoaA proteins at several otherwise invariant positions. Its gene
  neighbourhood contains no molybdenum-cofactor or molybdoenzyme genes. Whether it
  cyclizes GTP like canonical MoaA or has diverged to another reaction is unknown.
