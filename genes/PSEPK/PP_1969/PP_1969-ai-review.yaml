  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Catalytic activity is plausible for this radical-SAM family member, but the exact reaction is unresolved.
    action: UNDECIDED
    reason: >-
      Restored to UNDECIDED (2026-10-16). It had been marked TOO_GENERAL beside an
      accepted GO:0061798, which is again UNDECIDED. Intact cluster and SAM sites make
      catalysis likely, but the reaction is not resolved, and this row is not used as
      a stand-in for it.
    supported_by:
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        The divergence of PP_1969 and PP_2482 from canonical KT2440 MoaA does not touch the
        annotated GTP-, SAM- or cluster-binding residues.
    - reference_id: file:PSEPK/PP_1969/PP_1969-bioinformatics/RESULTS.md
      supporting_text: >-
        Ligand-site conservation is expected of a MoaA-derived paralog whatever its
        present substrate, so it cannot by itself separate a GTP 3',8-cyclase from a
        diverged MoaA-like enzyme.
    - reference_id: file:PSEPK/moaA/moaA-bioinformatics/RESULTS.md
      supporting_text: |-
