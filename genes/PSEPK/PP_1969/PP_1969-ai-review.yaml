id: Q88LG4
gene_symbol: PP_1969
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1969 encodes a MoaA-family radical-SAM protein, one of three MoaA paralogs in
  P. putida KT2440, and is most likely a GTP 3',8'-cyclase acting in the first step
  of molybdenum cofactor biosynthesis. It carries the N-terminal radical-SAM
  CxxxCxxC [4Fe-4S] motif and the C-terminal MoaA twitch domain with the second
  [4Fe-4S]-cluster cysteines, and every GTP-, S-adenosyl-L-methionine- and
  cluster-binding residue annotated on reviewed KT2440 MoaA is conserved. It forms
  a closely related pair with PP_2482 and is about as similar to characterized
  E. coli MoaA as the canonical KT2440 enzyme is. No PP_1969-specific assay exists,
  and how the three paralogs share cofactor synthesis in vivo is unknown.
