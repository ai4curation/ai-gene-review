- term:
    id: GO:0061799
    label: cyclic pyranopterin monophosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: cPMP synthase is the distinct MoaC reaction and should not be assigned to a stand-alone MoaA-family protein.
    action: REMOVE
    reason: >-
      Wrong step of a two-enzyme sequence, verifiable from the term definition.
      GO:0061799 is defined as (8S)-3',8-cyclo-7,8-dihydroguanosine 5'-triphosphate =
      cyclic pyranopterin phosphate + diphosphate - that is, it consumes the product of
      the MoaA reaction, and is the MoaC step. This protein is a MoaA-type radical SAM
      enzyme: Pfam PF04055 Radical_SAM plus PF06463 Mob_synth_C with the MoaA_twitch
      domain (InterPro IPR010505, IPR040064 MoaA-like), the architecture that performs
      GTP 3',8-cyclase chemistry (GO:0061798, propagated by the same node and retained as
      UNDECIDED here pending target-specific evidence). It has no MoaC-type
      pyranopterin synthase fold. P. putida KT2440 encodes a dedicated moaC,
      so the cPMP step is accounted for by a separate gene.
      The joint annotation comes from InterPro IPR050105, which lumps MoaA and MoaC
      into one MoCo-biosynthesis grouping; the two activities are nonetheless distinct
      reactions on distinct substrates.
    supported_by:
    - reference_id: file:PSEPK/moaA/moaA-uniprot.txt
      record_section: [DE]
      supporting_text: "DE   RecName: Full=GTP 3',8-cyclase {ECO:0000255|HAMAP-Rule:MF_01225};"
    - reference_id: file:PSEPK/moaC/moaC-uniprot.txt
      record_section: [DE]
      supporting_text: "DE   RecName: Full=Cyclic pyranopterin monophosphate synthase {ECO:0000255|HAMAP-Rule:MF_01224};"
