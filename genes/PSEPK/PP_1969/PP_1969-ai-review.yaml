      subfamily as reviewed Q88E69; the local motif table gives the same cysteine
      positions; and a new site mapping shows that all seven GTP-binding positions,
      all four SAM-binding positions and all six cluster cysteines annotated on Q88E69
      align to identical residues in Q88LG4, except V266, which is Leu here as in
      characterized E. coli MoaA. The PS01305 failure is explained by two
      substitutions at non-ligand positions (CNYAC for C-[NDP]-[LIVMF]-[DNQRS]-C), so
      the two analyses agree on the facts and differ only in how much weight the
      missing signatures carry. Retaining the GTP-binding set argues against a change
      of substrate. No PP_1969 assay exists, so this remains a sequence-based call;
      it is not a claim about how much flux PP_1969 carries relative to its paralogs.
