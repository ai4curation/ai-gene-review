- id: file:PSEPK/PP_1969/PP_1969-hypotheses/function-hypothesis-go-0061798/openscientist.md
  title: OpenScientist TreeGrafter stress test of PP_1969 GTP 3',8'-cyclase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Blinded run (batch openscientist-controls-2026-10-14; local bioinformatics
      withheld). Its decisive claims were checked against repository data: PANTHER
      PTHR22960:SF0, PF04055 + PF06463 and IPR010505 are in the UniProt record; the
      cluster cysteine positions match the local motif table; and an independent
      site mapping (PP_1969-bioinformatics/RESULTS.md) confirms and extends the
      active-site claim to the GTP- and SAM-binding residues. Its identity figures
      differ from ours with a different aligner (40.9% vs 37.11% to E. coli MoaA)
      but agree qualitatively. Cited literature (PMID:16632608, PMID:41183211) is
      not cached and is not relied on. AlphaFold geometry claims were not re-run.
  findings:
  - statement: The run judges GO:0061798 supported, at the right granularity, with no failure mode applying.
    supporting_text: '**Verdict: SUPPORTED.** PP_1969 (UniProt Q88LG4, *Pseudomonas putida* KT2440) is a'
  - statement: The run reports both [4Fe-4S]-cluster cysteine triads intact.
    supporting_text: 2. **Pseudo-enzyme — PASS.** All six catalytic cysteines of **both** [4Fe-4S]
  - statement: The run states the call is computational, without a P. putida assay.
    supporting_text: '- **No direct PSEPK assay:** The function is inferred from orthology + residue'
