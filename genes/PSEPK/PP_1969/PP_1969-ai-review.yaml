suggested_questions:
- question: >-
    PP_1969 keeps every annotated MoaA ligand residue but falls below the TIGR02666
    and HAMAP MF_01225 MoaA models, with substitutions at positions all
    characterized MoaA conserve (e.g. Q88E69 R30 and R78). Does it still cyclize
    GTP, act on another substrate, or provide condition-specific redundancy with
    canonical moaA?
suggested_experiments:
- description: Compare purified PP_1969 with canonical MoaA for GTP turnover and cyclic intermediate formation, and test complementation of a moaA deletion.
  experiment_type: comparative enzyme assay and genetic complementation
