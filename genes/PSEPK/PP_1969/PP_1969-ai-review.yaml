    supporting_text: >-
      The divergence of PP_1969 and PP_2482 from canonical KT2440 MoaA does not touch the
      annotated GTP-, SAM- or cluster-binding residues.
  - statement: The PROSITE PS01305 failure reflects substitutions at non-ligand positions.
    supporting_text: >-
      The failure of the signature therefore reflects substitutions at non-ligand
