  - statement: Both paralogs fail the HAMAP MF_01225_B level-0 cutoff while meeting all of the rule's FT conditions.
    supporting_text: So the HAMAP non-match is a profile-score failure only.
  - statement: The model-score loss is spread along the protein, not at annotated ligand positions or in one missing segment.
