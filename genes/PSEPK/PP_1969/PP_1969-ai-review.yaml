  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      GTP 3',8'-cyclase activity is supported for PP_1969: it has the MoaA domain
      architecture and retains every GTP-, SAM- and [4Fe-4S]-binding residue
      annotated on reviewed KT2440 MoaA.
    action: ACCEPT
    reason: >-
      Previously UNDECIDED because Q88LG4 lacks the MoaA-specific database records of
      reviewed Q88E69 (NCBIfam TIGR02666, HAMAP MF_01225, PROSITE PS01305, InterPro
      IPR013483/IPR000385) and is only 37.85% identical to it. A blinded OpenScientist
      run, which did not see the local analyses, found the target in PANTHER
      PTHR22960:SF0 with the PF04055 radical-SAM plus PF06463 twitch architecture and
      all six cluster cysteines intact (C36/C40/C43 and C268/C271/C285). Checked here:
