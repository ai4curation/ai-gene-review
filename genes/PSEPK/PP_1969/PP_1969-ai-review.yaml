suggested_questions:
- question: >-
    PP_1969 keeps the full MoaA GTP-binding site, yet KT2440 also has canonical moaA
    (PP_4597) and the PP_2482 paralog. Under which conditions does PP_1969 supply
    cyclic pyranopterin precursor, and does the PP_1969/PP_2482 pair serve particular
    molybdoenzymes?
suggested_experiments:
- description: Compare purified PP_1969 with canonical MoaA for GTP turnover and cyclic intermediate formation, and test complementation of a moaA deletion.
  experiment_type: comparative enzyme assay and genetic complementation
