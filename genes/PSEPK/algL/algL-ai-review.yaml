id: Q88ND1
gene_symbol: algL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AlgL is a periplasmic poly-beta-D-mannuronate lyase in the alginate
  biosynthesis operon. It cleaves alginate by beta elimination and is proposed
  to remove polymer that escapes the protected secretion conduit, providing
  periplasmic quality control rather than serving as a nutrient-catabolic
  alginate lyase.
existing_annotations:
  - term:
      id: GO:0016829
      label: lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: AlgL is a lyase, but this parent term omits the polysaccharide substrate.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0045135 captures the exact annotated molecular function.
  - term:
      id: GO:0016837
      label: carbon-oxygen lyase activity, acting on polysaccharides
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This term correctly narrows AlgL to a polysaccharide carbon-oxygen lyase.
      action: MARK_AS_OVER_ANNOTATED
      reason: The valid substrate-specific GO:0045135 term is more informative.
  - term:
      id: GO:0042122
      label: alginic acid catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AlgL cleaves alginate, but its conserved operon context supports periplasmic quality control during biosynthesis.
      action: MODIFY
      reason: The enzyme is not assigned to an alginate-utilization pathway; GO:0042121 better captures its physiological module context.
      proposed_replacement_terms:
        - id: GO:0042121
          label: alginic acid biosynthetic process
      supported_by:
        - reference_id: file:PSEPK/algL/algL-uniprot.txt
          supporting_text: May serve to degrade mislocalized alginate
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: AlgL acts on mislocalized nascent alginate in the periplasm.
      action: ACCEPT
      reason: The signal peptide, HAMAP rule, and reviewed subcellular annotation support this location.
      supported_by:
        - reference_id: file:PSEPK/algL/algL-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
  - term:
      id: GO:0045135
      label: poly(beta-D-mannuronate) lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the exact AlgL beta-elimination activity on mannuronate-rich alginate.
      action: ACCEPT
      reason: The reviewed record, HAMAP rule, EC 4.2.2.3, UniRule, and PL5 family assignment agree.
      supported_by:
        - reference_id: file:PSEPK/algL/algL-uniprot.txt
          supporting_text: EC=4.2.2.3
