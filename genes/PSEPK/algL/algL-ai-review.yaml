id: Q88ND1
gene_symbol: algL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgL is a predicted periplasmic PL5 alginate lyase in Pseudomonas putida KT2440.
  It cleaves mannuronate-rich alginate by beta elimination. Characterized P. aeruginosa orthologs
  clear polymer that accumulates in the periplasm during alginate production, providing a
  homeostatic degradative pathway rather than a polymerization reaction. The effect of losing
  AlgL depends on regulatory background; neither universal essentiality nor stable incorporation
  into the secretion complex is established for KT2440.
