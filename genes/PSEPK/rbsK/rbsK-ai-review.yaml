  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RbsK is a cytosolic ribokinase that uses ATP to phosphorylate D-ribose at O-5,
  producing D-ribose 5-phosphate for central carbon and biosynthetic metabolism.
  Its specific function is supported by convergent HAMAP, InterPro, EC, Rhea,
  and PANTHER assignments, although KT2440-specific enzymology is unavailable.
