suggested_questions:
- question: >-
    Which nucleotide sugar is the physiological substrate of PP_0501, and is
    its pathway linked to the adjacent deoxy-sugar biosynthesis gene PP_0500?
- question: >-
    Should the KEGG K01784 UDP-glucose 4-epimerase mapping be removed from
    PP_0501 in favor of a substrate-neutral family assignment?
suggested_experiments:
- description: >-
    Purify PP_0501 and screen UDP-, dTDP-, and GDP-linked hexose and deoxyhexose
    substrates using LC-MS product identification, followed by a knockout and
    cell-surface glycan analysis.
  experiment_type: substrate-screening enzymology and glycomics
