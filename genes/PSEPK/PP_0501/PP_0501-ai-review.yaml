id: Q88QJ1
gene_symbol: PP_0501
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_0501 encodes a predicted soluble NAD-dependent nucleotide-sugar
  epimerase/dehydratase-family protein. Sequence/domain evidence supports an
  extended-SDR nucleotide-sugar enzyme, but its substrate and reaction remain
  unresolved. It should not be treated as a second UDP-glucose 4-epimerase
  while the canonical GalE/PP_3129 is present.
