taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TatB-I (PP_1040) is an inner-membrane component of the PP_1039-PP_1041 twin-arginine translocation
  (Tat) system of Pseudomonas putida KT2440, one of the strain's two complete tatABC loci; both systems
  can export the Tat substrate UxpB. It is the TatB-family receptor subunit that, with TatC-I, binds twin-arginine
  signal peptides and folded precursors before TatA is recruited. Its activities are assigned from the
  conserved, experimentally characterized E. coli subunit family.
