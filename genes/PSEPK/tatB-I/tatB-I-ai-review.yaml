id: Q88P13
gene_symbol: tatB-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TatB-I is the TatB-family receptor component of the PP_1039-PP_1041
  twin-arginine translocation system in Pseudomonas putida KT2440. Together
  with TatC-I it forms the membrane receptor for folded proteins carrying a
  twin-arginine signal peptide and promotes recruitment of TatA-I for the
  translocation phase.
existing_annotations:
- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The assembled Tat translocon has protein transmembrane transporter activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: TatB is a receptor subunit that contributes to, but does not independently enable, transport.
- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: TatB-I participates specifically in folded-protein transport by the Tat complex.
    action: KEEP_AS_NON_CORE
    reason: The broad parent process is correct but less informative than GO:0043953.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: TatB-I is a single-pass membrane protein.
    action: MODIFY
    reason: UniProt and conserved TatB topology support the more specific bacterial plasma-membrane location.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
- term:
    id: GO:0033281
    label: TAT protein transport complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  review:
    summary: TatB-I is a conserved receptor subunit of the Tat protein-transport complex.
    action: ACCEPT
    reason: The TatB-specific InterPro assignment and tatCBA locus support complex membership.
- term:
    id: GO:0043953
    label: protein transport by the Tat complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: TatB-I organizes the receptor used in Tat-dependent folded-protein export.
    action: ACCEPT
    reason: This is the defining conserved biological process of TatB-family proteins.
