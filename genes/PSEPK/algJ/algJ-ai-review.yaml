knowledge_gaps:
- gap_statement: The physiological substrate and direction of the AlgJ-catalyzed step in the
    periplasmic acetyl relay are unresolved.
  boundary: >-
    KT2440 Q88ND3 has direct structural, surrogate-substrate acetylesterase and AlgF-binding
    evidence. The proposed physiological acyl-transfer reaction, including its donor and acceptor,
    has not been reconstructed. An OpenScientist run (kgap-algj-acetyl-relay-direction) settles
    the enzymology and the orientation but not the direction. Measured directly from PDB 4O8V,
    which the local record confirms is this very protein at 1.82 Angstrom over residues 75-370
    rather than a homolog, the SGNH triad is complete and geometrically competent, with Ser288
    OG 2.56 Angstrom from His192 NE2 and His192 ND1 2.74 Angstrom from Asp190 OD1, and a
    modelled oxyanion position accepting three donors from Tyr289 and Thr287; Asp190, His192,
    Thr287, Ser288, Tyr289 and Ser290 are the UniProt active-site and adjacent residues in the
    local sequence and are identical in all 20 Pseudomonas and Azotobacter orthologs surveyed.
    The catalytic domain faces the periplasm, with a single N-terminal hydrophobic segment and a
    positive-inside N-terminus, consistent with the published fractionation evidence. The
    informative new argument is electrostatic: the net formal charge within 12 Angstrom of the
    catalytic serine is minus seven in AlgJ against minus one to plus one for every SGNH enzyme
    in the comparison panel whose polymer acceptor is experimentally demonstrated, AlgX from the
    same operon included. That is a structural explanation for the already measured binding
    asymmetry, in which AlgJ shows weak or no detectable polymer binding while AlgX binds
    polymannuronic acid specifically. What the structure cannot settle is the identity of the
    acetyl donor or acceptor, and so not the direction: an acidic active-site surface and the
    absence of a carbohydrate-binding module argue against AlgJ acetylating the alginate chain
    at its own catalytic site, but they are not evidence that an acetyl group passes from AlgJ to
    AlgX, no structure places AlgJ in contact with AlgI, AlgF or AlgX, and no published assay
    measures transfer between any two of them. One premise of the question put to the run was
    wrong and is corrected here rather than in the review, which never asserted it: there are no
    Pseudomonas aeruginosa AlgJ structures, and 4O8V is the KT2440 protein, so this entry has
    structural evidence of a grade usually reserved for the organism under review while the
    P. aeruginosa side has only a predicted model.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  provenance:
  - reference_id: PMID:25165982
