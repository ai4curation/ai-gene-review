    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/algJ/algJ-uniprot.txt
    title: UniProtKB reviewed entry for algJ (Q88ND3)
    findings:
      - statement: The record assigns the AlgJ family, SGNH-like architecture, periplasmic membrane association, and alginate O-acetylation role.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The role is transferred from characterized Pseudomonas machinery and is consistent with the exact family and operon context.
  - id: file:PSEPK/algJ/algJ-goa.tsv
    title: QuickGO GOA annotations for algJ
    findings:
      - statement: The fetched GOA table contains the three annotations reviewed here.
  - id: PMID:12003941
    title: Mutant analysis and cellular localization of the AlgI, AlgJ, and AlgF proteins required for O acetylation of alginate in Pseudomonas aeruginosa.
    findings:
      - statement: Nonpolar algJ deletion abolishes O-acetylation, complementation restores it, and localization experiments place AlgJ on the periplasmic face of the inner membrane.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The paper directly establishes the P. aeruginosa ortholog's requirement and topology.
  - id: PMID:8636017
    title: Identification of algI and algJ in the Pseudomonas aeruginosa alginate biosynthetic gene cluster which are required for alginate O acetylation.
    findings:
      - statement: Genetic analysis separates AlgJ-dependent acetylation from polymer synthesis and C5 epimerization.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The abstract and cached text were checked.
  - id: PMID:25165982
    title: P. aeruginosa SGNH hydrolase-like proteins AlgJ and AlgX have similar topology but separate and distinct roles in alginate acetylation.
    findings:
      - statement: The study solves the KT2440 Q88ND3 soluble-domain structure and distinguishes in-vitro acetylesterase activity from the unresolved in-vivo relay role.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The paper explicitly identifies PpAlgJ as Q88ND3 and uses the KT2440 sequence for the crystallized construct.
  - id: PMID:31900562
    title: Analysis of the alginate O-acetylation machinery in Pseudomonas aeruginosa.
    findings:
      - statement: AlgJ interacts with AlgI and AlgF in the O-acetylation complex, but AlgJ and AlgX do not mutually determine stability.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The abstract was checked and is used as ortholog evidence for complex organization.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-o-acetylation__ppu00543-deep-research-openscientist.md
    title: OpenScientist PSEPK alginate O-acetylation synthesis
    findings:
      - statement: The report distinguishes the AlgJ SGNH relay role from the terminal polymer O-acetyltransferase role of AlgX.
  - id: file:modules/alginate_o_acetylation.yaml
    title: Alginate O-acetylation module
    findings:
      - statement: AlgJ implements the periplasm-facing acetyl-relay part.
core_functions:
  - description: >-
      Periplasm-facing, inner-membrane-associated SGNH-family component of the
      AlgI-AlgJ-AlgF acetyl-transfer relay for alginate O-acetylation.
    directly_involved_in:
      - id: GO:0051979
        label: alginic acid acetylation
    locations:
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0042597
        label: periplasmic space
    supported_by:
      - reference_id: PMID:12003941
        supporting_text: each mutant produced alginate lacking O-acetyl groups.
      - reference_id: PMID:25165982
        supporting_text: structure of Pseudomonas putida AlgJ75–370
knowledge_gaps:
  - gap_statement: >-
      The physiological substrate and direction of the AlgJ-catalyzed step in
      the periplasmic acetyl relay are unresolved.
    boundary: >-
      Q88ND3 has a directly solved SGNH-like structure, and the characterized
      Pseudomonas proteins show acetylesterase activity in vitro and an in-vivo
      requirement for alginate acetylation; these observations do not yet
      establish a specific physiological molecular function.
    gap_kind:
      - BIOLOGY
      - CURATION
    provenance:
      - reference_id: PMID:25165982
        supporting_text: AlgJ exhibits acetylesterase activity in vitro.
proposed_new_terms: []
suggested_questions:
  - question: Does KT2440 AlgJ transfer an acetyl intermediate in vivo, or primarily provide esterase-like processing within the relay?
suggested_experiments:
  - description: Compare acetyl-transfer and esterase activities of purified AlgJ and catalytic-triad variants in the presence of AlgI and AlgF.
    experiment_type: enzyme relay reconstruction
