id: Q88ND3
gene_symbol: algJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgJ is an SGNH hydrolase-like protein associated with the periplasmic face of
  the inner membrane and involved in alginate O-acetylation. Its soluble domain hydrolyzes
  a synthetic acetylester substrate and binds AlgF. AlgJ is proposed to act upstream of AlgX
  in an acetyl-transfer relay, but its physiological donor and acceptor remain unresolved.
