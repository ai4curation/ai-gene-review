references:
- id: file:PSEPK/algJ/algJ-hypotheses/kgap-algj-acetyl-relay-direction/openscientist.md
  title: OpenScientist analysis of the AlgJ active site and the direction of the periplasmic acetyl relay
  findings:
  - statement: >-
      The AlgJ SGNH triad and oxyanion hole are complete and periplasm-facing, and the active-site
      surface carries a net charge of minus seven against minus one to plus one for SGNH enzymes
      with demonstrated polymer acceptors, which explains AlgJ's weak polymer binding but does not
      establish the direction of acetyl transfer.
    supporting_text: >-
      The acceptor site is wrong for a polyanion
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The active-site residues Asp190, His192 and Ser288, the adjacent Thr287, Tyr289 and Ser290,
      the N-terminal sequence and the PDB 4O8V cross-reference covering residues 75-370 of this
      accession were all confirmed in the local Q88ND3 record, which independently bears out the
      run's correction that 4O8V is the KT2440 protein. The coordinate distance measurements, the
      oxyanion grid search, the AlgX superposition, the active-site charge comparison and the
      20-ortholog conservation survey were not independently checked.
