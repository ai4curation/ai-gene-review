id: Q88ND3
gene_symbol: algJ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AlgJ is an SGNH-family, peripheral inner-membrane protein exposed on the
  periplasmic side. It acts with AlgI and AlgF in the acetyl-transfer relay that
  supplies AlgX-mediated O-acetylation of mannuronate residues in nascent
  alginate; its precise in-vivo relay chemistry is not yet resolved.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: AlgJ is peripherally associated with the bacterial inner membrane.
      action: ACCEPT
      reason: The reviewed topology places AlgJ at the inner membrane on its periplasmic side.
      supported_by:
        - reference_id: file:PSEPK/algJ/algJ-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
  - term:
      id: GO:0042121
      label: alginic acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AlgJ acts in post-polymerization alginate maturation rather than polymer formation itself.
      action: KEEP_AS_NON_CORE
      reason: >-
        GO:0051979 is not an ontology descendant of GO:0042121, so replacing
        this row would discard broader alginate-pathway context. The parent is
        retained as non-core and the exact acetylation process is added
        separately. Although AlgJ has acetylesterase activity in vitro, its
        physiological relay substrate is unresolved, so no molecular function
        is proposed here.
      supported_by:
        - reference_id: PMID:8636017
          supporting_text: This indicated that the algIJF gene products were not required for polymer biosynthesis.
  - term:
      id: GO:0051979
      label: alginic acid acetylation
    evidence_type: ISS
    original_reference_id: PMID:12003941
    qualifier: involved_in
    review:
      summary: AlgJ is an essential periplasm-facing component of the alginate O-acetylation relay.
      action: NEW
      reason: >-
        P. aeruginosa deletion and complementation establish the ortholog role;
        Q88ND3 is the syntenic KT2440 AlgJ and its soluble domain was directly
        structurally characterized in PMID:25165982.
      supported_by:
        - reference_id: PMID:12003941
          supporting_text: each mutant produced alginate lacking O-acetyl groups.
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: The functional domain of membrane-associated AlgJ is exposed to the periplasm.
      action: ACCEPT
      reason: This location complements rather than duplicates the inner-membrane annotation by specifying sidedness.
      supported_by:
        - reference_id: file:PSEPK/algJ/algJ-uniprot.txt
          supporting_text: Periplasmic side
references:
