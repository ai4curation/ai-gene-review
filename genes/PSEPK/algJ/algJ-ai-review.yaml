    action: MODIFY
    reason: The broad pathway annotation captures alginate maturation, but the characterized
      role is acetylation rather than synthesis of the mannuronate backbone. P. aeruginosa
      mutants still make unacetylated polymer. Replace with the supported modification process
      specified by this replacement; the correction describes the biological role and does
      not assume an ontology parent-child relationship. P. aeruginosa deletion/complementation
      establishes the ortholog process role. KT2440 Q88ND3 was directly crystallized and assayed
      for surrogate-substrate acetylesterase activity in PMID:25165982, and binds KT2440 AlgF
      in PMID:37797696. These findings strengthen transfer of the process assignment without
      proving the proposed AlgI-to-AlgJ-to-AlgX chemical relay.
