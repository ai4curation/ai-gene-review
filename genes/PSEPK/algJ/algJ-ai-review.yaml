- id: file:PSEPK/algJ/algJ-uniprot.txt
  title: UniProtKB reviewed entry for algJ (Q88ND3)
  findings:
  - statement: The record assigns the AlgJ family, SGNH-like architecture, periplasmic membrane
      association, and alginate O-acetylation role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified target identity and curated family/domain and localization statements.
      ECO:0000250 functional statements are explicitly homology-based; primary papers distinguish
      direct target assays from ortholog evidence.
- id: PMID:12003941
  title: Mutant analysis and cellular localization of the AlgI, AlgJ, and AlgF proteins required
    for O acetylation of alginate in Pseudomonas aeruginosa.
  findings:
  - statement: Nonpolar algJ deletion abolishes O-acetylation, complementation restores it,
      and localization experiments place AlgJ on the periplasmic face of the inner membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The paper directly establishes the P. aeruginosa ortholog's requirement
      and topology.
- id: PMID:8636017
  title: Identification of algI and algJ in the Pseudomonas aeruginosa alginate biosynthetic
    gene cluster which are required for alginate O acetylation.
  findings:
  - statement: Genetic analysis separates AlgJ-dependent acetylation from polymer synthesis
      and C5 epimerization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: P. aeruginosa genetics distinguish polymer formation from acetylation. This
      supports refinement to the modification process, not a claim that alginate synthesis
      is chemically performed by AlgI or AlgJ.
- id: PMID:25165982
  title: P. aeruginosa SGNH hydrolase-like proteins AlgJ and AlgX have similar topology but
    separate and distinct roles in alginate acetylation.
  findings:
  - statement: KT2440 Q88ND3 residues75–370 were crystallized and directly assayed with 3-carboxyumbelliferyl
      acetate. D190/H192/S288 substitutions reduced activity; this assay does not identify
      the physiological transfer acceptor.
    supporting_text: PaAlgJ79–379 and PpAlgJ75–370 were both assayed to demonstrate that the
      enzymes are functionally equivalent.
  - statement: The mannuronate-binding comparison used PaAlgJ79–379 and PaAlgX27–474; absent
      or weak PaAlgJ binding should not be mislabeled a direct KT2440 binding measurement.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods and Results checked. PpAlgJ75–370 is KT2440 Q88ND3; a figure-caption
      species typo calls PpAlgJ P. aeruginosa, but strain, construct and accession resolve
      the target. Both orthologs were assayed, not only structurally compared.
- id: PMID:31900562
  title: Analysis of the alginate O-acetylation machinery in Pseudomonas aeruginosa.
  findings:
  - statement: AlgJ interacts with AlgI and AlgF in the O-acetylation complex, but AlgJ and
      AlgX do not mutually determine stability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The cache contains the abstract and a repository landing-page extract,
      not complete experimental methods. Findings are restricted to the explicit abstract:
      P. aeruginosa PDO300 mutants, mutual stability and pull-down observations; these do
      not establish direct chemical transfer.'
- id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-o-acetylation__ppu00543-deep-research-openscientist.md
  title: OpenScientist PSEPK alginate O-acetylation synthesis
  findings:
