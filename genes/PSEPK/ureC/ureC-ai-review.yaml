suggested_questions:
  - question: Is Q88J04 active-site occupancy and carbamylation nickel-limited in KT2440?
suggested_experiments:
  - hypothesis: UreDEFG increases Q88J04 lysine carbamylation and dinickel occupancy to generate active UreABC.
    description: Purify KT2440 UreABC and quantify UreC nickel occupancy, lysine carbamylation, and urea-hydrolysis kinetics before and after UreDEFG activation.
    experiment_type: Native complex purification, metal analysis, mass spectrometry, and enzyme kinetics
