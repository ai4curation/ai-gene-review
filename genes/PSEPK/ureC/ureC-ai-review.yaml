id: Q88J04
gene_symbol: ureC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreC is the cytoplasmic alpha and catalytic subunit of the three-chain
  bacterial urease. Within the UreABC complex it supplies the carbamylated
  lysine and ligands of the dinickel active site that hydrolyzes urea to
  ammonia and carbon dioxide after UreDEFG-dependent maturation.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: UreC is a cytoplasmic subunit of soluble bacterial urease.
      action: ACCEPT
      reason: The reviewed UniProt localization is coherent with the UreABC complex.
  - term:
      id: GO:0009039
      label: urease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: UreC is the catalytic subunit that contains the complete dinickel urease active site.
      action: ACCEPT
      reason: >-
        Requiring assembly with UreA and UreB does not make UreC a noncatalytic
        subunit. Structural evidence places the complete catalytic center in
        the UreC-equivalent alpha chain (PMID:8718850).
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: UreC contains the urease dinickel catalytic center.
      action: ACCEPT
      reason: The alpha-subunit binickel site is directly established structurally (PMID:8718850).
  - term:
      id: GO:0016787
      label: hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This is a broad parent of the supported urease activity.
      action: KEEP_AS_NON_CORE
      reason: The ancestor is biologically true, but GO:0009039 is the informative reaction-specific function.
  - term:
      id: GO:0016810
      label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This carbon-nitrogen hydrolase parent is compatible but less precise than urease activity.
      action: KEEP_AS_NON_CORE
      reason: This ancestor is biologically true, while GO:0009039 captures the exact EC 3.5.1.5 reaction.
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: UreC provides the active site for the urea-catabolic reaction.
      action: ACCEPT
      reason: Mature urease directly hydrolyzes urea.
  - term:
      id: GO:0035550
      label: urease complex
    evidence_type: IEA
    original_reference_id: file:PSEPK/ureC/ureC-uniprot.txt
    qualifier: part_of
    review:
      summary: UreC is the catalytic alpha subunit of the UreABC urease complex.
      action: NEW
      reason: Reviewed UniProt and alpha-beta-gamma structural evidence support explicit complex membership.
