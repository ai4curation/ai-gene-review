suggested_questions: []
suggested_experiments:
- hypothesis: P59392 is an active Mg2+-dependent selenophosphate synthetase despite the misleading PANTHER SF0 name.
  description: >-
    Measure AMP and selenophosphate production from ATP and selenide with
    purified SelD, including catalytic-Cys and Mg2+-site mutants.
