id: P59392
gene_symbol: selD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  SelD is the ATP-dependent selenophosphate synthetase of Pseudomonas putida
  KT2440. This cytoplasmic homodimer uses selenide, ATP, water, and Mg2+ to
  produce selenophosphate, the activated selenium donor consumed by SelA during
  conversion of Ser-tRNA(Sec) to Sec-tRNA(Sec).
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Mg2+ is an assigned SelD cofactor and is coordinated at predicted catalytic sites.
    action: ACCEPT
    reason: >-
      The reviewed UniProt/HAMAP record states that one Mg2+ is bound per
      monomer and annotates three Mg2+-contacting positions.
    supported_by:
    - reference_id: file:PSEPK/selD/selD-uniprot.txt
      supporting_text: "Binds 1 Mg(2+) ion per monomer."
- term:
    id: GO:0004756
    label: selenide, water dikinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term precisely represents the selenophosphate-forming SelD reaction.
    action: ACCEPT
    reason: >-
      Reviewed UniProt, HAMAP, NCBIfam, TIGRFAM, and the PANTHER family all
      support selenide, water dikinase identity. The PANTHER SF0 display name
      says "inactive ...-like," but that subfamily also contains canonical
      bacterial selD proteins and conflicts with the conserved catalytic
      cysteine and ATP/Mg2+ sites in P59392; it is not credible negative
      evidence for this target.
    supported_by:
    - reference_id: file:PSEPK/selD/selD-uniprot.txt
      supporting_text: "Synthesizes selenophosphate from selenide and ATP."
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is a substrate in selenophosphate synthesis and has multiple predicted contacts.
    action: ACCEPT
    reason: >-
      The reviewed reaction consumes ATP and forms AMP, and UniProt maps
      several ATP-binding residues across the dimer interface.
    supported_by:
    - reference_id: file:PSEPK/selD/selD-uniprot.txt
      supporting_text: "Reaction=hydrogenselenide + ATP + H2O"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm is the appropriate location for this soluble bacterial enzyme.
    action: ACCEPT
    reason: >-
      TreeGrafter assigns cytoplasm, and the reviewed sequence lacks signal
      peptide and transmembrane features.
    supported_by:
    - reference_id: file:PSEPK/selD/selD-uniprot.txt
      supporting_text: "GO; GO:0005737; C:cytoplasm"
- term:
    id: GO:0016260
    label: L-selenocysteine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SelD supplies the activated selenium donor required for bacterial Sec-tRNA synthesis.
    action: ACCEPT
    reason: >-
      Selenophosphate made from selenide and ATP is the substrate used by SelA.
      This pathway assignment covers donor synthesis only and does not assign
      SelD any function of the downstream selenoprotein.
    supported_by:
    - reference_id: PMID:7665581
      supporting_text: "Selenophosphate is synthesized from selenide and ATP by the selD gene product"
