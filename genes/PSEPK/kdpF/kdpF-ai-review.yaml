description: >-
  Very small membrane subunit of the KdpFABC high-affinity potassium pump. KdpF
  remains associated with the complex and stabilizes the purified,
  detergent-solubilized pump in vitro, but is dispensable for low-potassium
  growth and near-wild-type membrane-bound ATPase activity in Escherichia coli.
