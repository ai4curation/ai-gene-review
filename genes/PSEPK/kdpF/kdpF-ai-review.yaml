    label: P-type potassium transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: P-type potassium transporter activity belongs to the KdpFABC pump (KdpB ATPase plus KdpA
      K+ pathway), not to the KdpF peptide.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'InterPro2GO maps the KdpF family signature (IPR011726) to the activity of the whole pump.
      KdpF is a single transmembrane helix that neither hydrolyses ATP nor forms the K+ pathway. Evidence
      from the E. coli ortholog (orthology-based support): E. coli KdpF is dispensable for growth on low
      K+ and for membrane-bound ATPase activity and acts as a stabilising element of the isolated complex.
      Asserting that KdpF enables P-type potassium transporter activity overstates its role; its relationship
      to the pump is captured by GO:0031004 complex membership.'
    supported_by:
