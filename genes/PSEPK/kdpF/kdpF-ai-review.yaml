id: A0A140FWL2
gene_symbol: kdpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpF is a 29-residue single-pass transmembrane peptide of Pseudomonas putida KT2440, encoded
  immediately upstream of kdpA in the kdpFABC operon, and a subunit of the KdpFABC high-affinity ATP-driven
  potassium uptake complex of the inner membrane. By orthology with Escherichia coli KdpF, it forms one
  transmembrane helix at the KdpA-KdpB interface and stabilises the complex; it has no catalytic or transport
  activity of its own and the E. coli peptide is dispensable for low-potassium growth.
