taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpF (PP_5660) is a 29-residue membrane peptide of Pseudomonas putida KT2440 encoded
  next to kdpA. Its KdpF-family signature and single transmembrane helix identify it as an accessory
  subunit of the KdpFABC potassium pump. By homology with Escherichia coli KdpF, it supports the
  KdpA-KdpB interface and stability of the transporter assembly; its structural contribution is
  distinct from the ATP-hydrolyzing machinery in KdpB.
