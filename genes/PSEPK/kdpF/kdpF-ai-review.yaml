- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: KdpF supports the assembled pump; the recorded enables relation overstates its activity
      attribution.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The InterPro mapping identifies an accessory pump subunit, but whole-pump activity needs
      a contribution relation on that subunit. KdpF stabilizes the assembled complex: deletion strongly
      impairs detergent-solubilized activity and addition of purified KdpF restores it. Near-normal activity
      in native membranes and low-potassium growth without KdpF delimit this requirement to the tested
      context; universal native necessity is not claimed. Transfer of this structural role to KT2440
      is a conserved-subunit inference, not a target transport assay. The overannotation concerns the
      recorded relation, not a negative judgment on participation. Retain contributes_to_molecular_function
      in the core and request a source relation correction; preserve the original row unchanged.'
    supported_by:
    - reference_id: file:PSEPK/kdpF/kdpF-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR011726; KdpF.
    - reference_id: PMID:10608856
      supporting_text: Although KdpF is not essential for the function of the Kdp complex in vivo,
        it is part of the complex and functions as a stabilizing element in vitro.
    - reference_id: PMID:10608856
      supporting_text: In the absence of KdpF, the ATPase activity of the membrane-bound Kdp complex
        was almost indistinguishable from that of the wild type.
    source_defects:
