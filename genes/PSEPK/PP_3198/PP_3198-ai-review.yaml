  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3198 encodes a compact Rieske [2Fe-2S]-binding ferredoxin-domain protein
  in the KT2440 flavonoid-degradation locus. KEGG assigns it to FdeD orthology
  group K26179 and the predicted naringenin hydroxylation step R13074. Its
  cofactor-binding role is well supported, but its electron donor, electron
  acceptor, and requirement for the proposed reaction remain untested.
