  review:
    summary: Withdraw the inherited pathway-participation proposal; no FdeD-catalyzed or cofactor-dependent
      step has been established.
    action: REMOVE
    reason: The locus, K26179 assignment and Rieske architecture identify a candidate, but neither PP_3198
      nor Hsero_1006 has an established physiological electron donor, acceptor or flavonoid-catabolic
      step. Purified FdeE works without added FdeD; that does not exclude another role, but it supplies
      no positive evidence of participation by FdeD. The same-role comparators Hsero_1006 and bll6426
      likewise decline a process assertion. Retain this inherited row for provenance while marking the
      proposal as over-annotation; cluster binding remains supported and native pathway involvement remains
      a knowledge gap. No assertion of biological absence is made. The retired flag records deliberate
      withdrawal of this curator-authored proposal from the active set; it does not report disappearance
      of an upstream GOA annotation. REMOVE records withdrawal of this earlier curator-authored NEW proposal,
      not removal of a current GOA assertion. It does not claim that the protein is biologically incapable
      of participating in flavonoid catabolism.
    supported_by:
