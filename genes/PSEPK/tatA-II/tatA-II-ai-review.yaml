taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TatA-II (PP_5016) is an inner-membrane component of the PP_5016-PP_5018 twin-arginine translocation
  (Tat) system of Pseudomonas putida KT2440, one of the strain's two complete tatABC loci; both systems
  can export the Tat substrate UxpB. It is the TatA-family subunit that is recruited to the substrate-bound
  receptor formed by TatC-II and TatB and assembles with them into the proton-motive-force-dependent translocase.
  Its activities are assigned from the conserved, experimentally characterized E. coli subunit family.
