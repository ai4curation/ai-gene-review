id: Q88D13
gene_symbol: tatA-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TatA-II is the TatA-family inner-membrane component of the PP_5016-PP_5018
  twin-arginine translocation system in Pseudomonas putida KT2440. It is
  recruited to substrate-bound TatBC and contributes to the dynamic,
  proton-motive-force-dependent assembly that moves folded proteins across the
  cytoplasmic membrane.
