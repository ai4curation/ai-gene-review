id: Q88CI8
gene_symbol: gcvH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  GcvH2 is one of two KT2440 glycine cleavage H proteins. It is a small,
  non-catalytic carrier with a covalently attached lipoyl arm that accepts the
  glycine-derived aminomethyl group from GcvP, presents the intermediate to
  GcvT, and is subsequently reoxidized by a shared dihydrolipoyl dehydrogenase.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytoplasm is correct for this small soluble bacterial lipoyl carrier but is entailed by the cytosol row.
      action: TOO_GENERAL
      reason: >-
        The H protein is a soluble component of the bacterial glycine cleavage
        system with no signal peptide or transmembrane feature, so the
        TreeGrafter cytoplasm call is true. The more specific GO:0005829
        cytosol row from the same TreeGrafter source, kept in this review,
        already entails it. The TreeGrafter location descends from the
        bacterial PTHR11715 PAINT node PTN000196915, seeded by E. coli GcvH
        (P0A6T9).
      supported_by:
        - reference_id: file:interpro/panther/PTHR11715/PTHR11715-paint.tsv
          supporting_text: "PTHR11715\tPTN000196915\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:P0A6T9\ttaxon:2"
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: A soluble cytosolic location is plausible for the bacterial carrier but is not a core function.
      action: KEEP_AS_NON_CORE
      reason: >-
        TreeGrafter propagation from the bacterial PTHR11715 PAINT node
        PTN000196915, whose cytosol IBD is seeded by E. coli GcvH (P0A6T9).
        KT2440 GcvH proteins are bacterial members of that clade with no
        targeting or membrane feature, so the location holds; it is context
        rather than core function.
      supported_by:
        - reference_id: file:interpro/panther/PTHR11715/PTHR11715-paint.tsv
          supporting_text: "PTHR11715\tPTN000196915\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:P0A6T9\ttaxon:2"
  - term:
      id: GO:0005960
      label: glycine cleavage complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: GcvH2 is the lipoyl-bearing carrier component of the four-protein system.
      action: ACCEPT
      reason: The reviewed UniProt record explicitly identifies P, H, T, and L proteins as system components.
      supported_by:
        - reference_id: file:PSEPK/gcvH2/gcvH2-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: 'The glycine cleavage system is composed of four proteins: P, T, L and H.'
  - term:
      id: GO:0009249
      label: protein lipoylation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: GcvH2 is a lipoylation substrate; in the E. coli-type LipB/LipA route of KT2440 it does not relay the lipoyl group.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        GcvH is an active lipoyl-relay intermediate only in lineages that
        build lipoyl domains through an H-protein relay (Firmicute
        LipM/LipL, yeast Lip2/Lip5 with Gcv3). KT2440 encodes the E. coli-type
        octanoyltransferase LipB (PP_4801) and lipoyl synthase LipA (PP_4800),
        which octanoylate and then sulfurate each apo-lipoyl domain directly,
        so GcvH1/GcvH2 are substrates of lipoylation, not participants. No
        PAINT IBD on PTHR11715 asserts protein lipoylation; the TreeGrafter
        row over-propagates a lineage-specific relay role to a protein that
        is only modified.
      supported_by:
        - reference_id: PMID:20508247
          supporting_text: LipB transfers an octanoyl group from octanoyl acyl carrier protein (octanoyl-ACP) to the apoprotein.
        - reference_id: PMID:20508247
          supporting_text: >-
            Thus, in E. coli the lipoate synthesis pathway relies on LipA and
            either LipB or LplA to produce lipoylated proteins
  - term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Intermediate shuttling by GcvH2 is required for this exact process.
      action: ACCEPT
      reason: UniProt describes transfer of the methylamine group from P protein to T protein on GcvH2.
      supported_by:
        - reference_id: file:PSEPK/gcvH2/gcvH2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: The H protein shuttles the methylamine group of glycine from the P protein to the T protein.
  - term:
      id: GO:0031405
      label: lipoic acid binding
    evidence_type: ISS
    original_reference_id: file:PSEPK/gcvH2/gcvH2-uniprot.txt
    qualifier: enables
    review:
      summary: This captures the covalently lipoylated carrier function omitted from current GOA.
      action: NEW
      reason: The reviewed HAMAP-backed record states that GcvH2 binds one lipoyl cofactor covalently.
      supported_by:
        - reference_id: file:PSEPK/gcvH2/gcvH2-uniprot.txt
          record_section: ["CC:COFACTOR"]
          supporting_text: Binds 1 lipoyl cofactor covalently.
