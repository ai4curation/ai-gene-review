  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  DacB is a periplasmic low-molecular-mass penicillin-binding protein 4 of the
  peptidase S13 family. It hydrolyzes peptidoglycan stem-peptide bonds through
  both D,D-endopeptidase and D,D-carboxypeptidase reactions, with the
  Pseudomonas ortholog showing predominant cleavage of 4-3 crosslinks and a
  secondary role in removing terminal D-alanine from pentapeptide stems. The
  KT2440 assignment is supported by close orthology and conserved catalytic
  architecture rather than direct enzymology of Q88L37.
