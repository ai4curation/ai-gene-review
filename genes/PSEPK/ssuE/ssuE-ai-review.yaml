  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SsuE is an NADPH-dependent FMN reductase that supplies diffusible reduced FMN
  to the SsuD alkanesulfonate monooxygenase. It forms the reductase arm of a
  two-component desulfonation system that releases sulfite from imported
  alkanesulfonates. Alternative flavin reductases can substitute for SsuE in
  some Pseudomonas backgrounds and growth conditions.
