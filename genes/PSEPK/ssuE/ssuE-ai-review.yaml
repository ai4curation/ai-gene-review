suggested_questions:
- question: Which flavin reductases supply KT2440 SsuD under each sulfur condition, and does purified
    Q88R97 use NADH as well as NADPH?
- question: Does the UniProt by-similarity growth requirement reflect an inverted S-313 statement, or
    is there independent KT2440 evidence?
suggested_experiments:
- description: Reconstitute KT2440 SsuE/SsuD activity, then compare ssuE deletion and candidate reductase
    deletions during growth on aliphatic sulfonates as sole sulfur sources.
