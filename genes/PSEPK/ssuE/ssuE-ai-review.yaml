  original_reference_id: PMID:10781557
  qualifier: involved_in
  review:
    summary: Reduced-flavin production is an active catalytic contribution to the coupled desulfonation
      cycle.
    action: NEW
    reason: The retained ISS process proposal rests on cofactor production for SsuD, rather than on SsuE
      being indispensable for growth. Purified E. coli enzyme studies establish this coupled reaction,
      and the target SsuE family and operon context support transfer. Native S-313 can bypass SsuE for
      aliphatic sulfonates; neither that dispensability nor its opposite is asserted for KT2440. Defined
      interactions improve flavin transfer in the characterized system, but transfer exclusively by diffusion
      is not assumed.
    supported_by:
    - reference_id: file:PSEPK/ssuE/ssuE-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the SsuE family.
    - reference_id: PMID:10480865
      supporting_text: SsuE is the FMN reducing enzyme providing SsuD with FMNH(2).
    - reference_id: PMID:10781557
      supporting_text: 'The flavin reductase SsuE was not required for growth with

        aliphatic sulfonates or methionine'
    - reference_id: PMID:26634408
      supporting_text: 'optimal transfer of reduced flavin

        from SsuE to SsuD requires defined protein-protein interactions, but diffusion

        can occur under specified conditions.'
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q88R97
      slot: CC:FUNCTION
      asserted_value: Required for growth on aliphatic sulfonates or methionine but not arylsulfonates
        (By similarity).
      requested_change: CHECK
      confidence: SUSPECTED
      explanation: 'The by-similarity requirement statement appears to transfer an inverted S-313 claim:
