  label: Pseudomonas putida KT2440
description: SsuE (PP_0236) is an NADPH-capable FMN reductase of the SsuE family in Pseudomonas putida
  KT2440. It is inferred to supply reduced flavin for SsuD-dependent alkanesulfonate desulfonation. Its
  target-specific cofactor preference, transfer mechanism and requirement under different sulfur conditions
  remain unresolved. Related Pseudomonas strains can use alternative reduced-flavin supply for some substrates.
