suggested_questions:
- question: >-
    Does Q88MC0 preferentially use thiosulfate to form S-sulfocysteine, as
    observed for Pseudomonas aeruginosa CysM, or mainly substitute for CysK in
    sulfide-dependent cysteine synthesis?
suggested_experiments:
- description: >-
    Measure purified Q88MC0 kinetics and products with sulfide versus
    thiosulfate, then compare growth of cysM, cysK, and double mutants with
    sulfate, sulfide, or thiosulfate as the sulfur source.
  experiment_type: substrate-specificity enzyme assay and genetic epistasis
