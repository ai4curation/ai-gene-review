  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CysM is a pyridoxal-5'-phosphate-dependent cysteine synthase B-family enzyme.
  Its supported reaction incorporates sulfide into O-acetyl-L-serine to form
  L-cysteine and acetate. Related Pseudomonas CysM enzymes can also favor
  thiosulfate-dependent S-sulfocysteine formation, but that specialization has
  not been demonstrated directly for Q88MC0.
