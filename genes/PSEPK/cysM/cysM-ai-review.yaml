core_functions:
- description: >-
    Catalyzes PLP-dependent sulfide incorporation into O-acetyl-L-serine to
    produce L-cysteine and acetate as a CysM-family alternative to CysK.
  molecular_function:
    id: GO:0004124
    label: cysteine synthase activity
