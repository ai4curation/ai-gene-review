  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PP_1348 is a MutT-family Nudix hydrolase predicted to sanitize the nucleotide pool by hydrolyzing mutagenic 8-oxo-dGTP and 8-oxo-GTP. This prevents oxidized guanine nucleotides from being incorporated into DNA or RNA.
existing_annotations:
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: PP_1348 sanitizes oxidized nucleotide pools upstream of DNA synthesis rather than repairing a DNA lesion directly.
    action: KEEP_AS_NON_CORE
    reason: Retain the broad protective-process annotation outside the core function, which is captured by the two substrate-specific pyrophosphatase activities.
- term:
    id: GO:0008413
    label: 8-oxo-7,8-dihydroguanosine triphosphate pyrophosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The target record assigns hydrolysis of 8-oxo-GTP to 8-oxo-GMP and diphosphate.
    action: ACCEPT
    reason: The explicit target reaction supports the oxidized ribonucleotide activity.
    supported_by:
    - reference_id: file:PSEPK/PP_1348/PP_1348-uniprot.txt
      supporting_text: "CC       Reaction=8-oxo-GTP + H2O = 8-oxo-GMP + diphosphate + H(+);"
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Hydrolase activity is true of PP_1348 but does not identify its oxidized guanine nucleotide substrates.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0008413 and GO:0035539 capture the two explicit target reactions and supersede this generic catalytic parent.
