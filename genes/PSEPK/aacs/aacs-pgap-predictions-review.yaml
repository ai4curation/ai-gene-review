id: Q88IC8
gene_symbol: aacs
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_3071
description: >-
  NCBI PGAP names WP_010953970.1 "acetoacetate--CoA ligase" from the TIGR01217
  equivalog HMM and passes on EC 6.2.1.16 with two GO terms. The name, the EC
  number and acetoacetate-CoA ligase activity are consistent with the
  InterPro, PANTHER and NCBIfam family assignments and with the main review.
  The process term, isopentenyl diphosphate biosynthesis via the mevalonate
  pathway (GO:0019287), is wrong for this organism. KT2440 makes isopentenyl
  diphosphate by the methylerythritol phosphate (DXP/MEP) route (Dxs, Dxr and
  IspD-H are present) and has no annotated HMG-CoA synthase, HMG-CoA reductase
  or mevalonate kinase, so acetoacetyl-CoA from Aacs cannot feed a mevalonate
  pathway. The mevalonate link reflects the mammalian cytosolic AACS, which
  supplies cholesterol synthesis; in bacteria the enzyme activates
  acetoacetate in poly-3-hydroxybutyrate and 3-hydroxybutyrate utilization.
  The error lies in the GO mapping of the TIGR01217 model itself, which
  imposes a lineage-specific pathway on every genome whose Aacs it names.
