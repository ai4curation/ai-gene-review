    error_type: PATHWAY_CONTEXT_IGNORED
    summary: >-
      Wrong for KT2440. The organism makes isopentenyl diphosphate by the
      DXP/MEP pathway: the reviewed Dxr and IspH entries for KT2440 are
      assigned to "isopentenyl diphosphate biosynthesis via DXP pathway". A
      UniProt search of KT2440 (taxon 160488, run 2026-10-19 while preparing
      this review) returned entries for the MEP enzymes (EC 2.2.1.7 Dxs,
      1.1.1.267 Dxr, 4.6.1.12 IspF, 1.17.7.3 IspG) but none for the
      mevalonate-pathway enzymes HMG-CoA synthase (2.3.3.10), HMG-CoA
      reductase (1.1.1.34, 1.1.1.88), mevalonate kinase (2.7.1.36),
      phosphomevalonate kinase (2.7.4.2) or diphosphomevalonate decarboxylase
      (4.1.1.33). Bacterial acetoacetyl-CoA synthetases instead activate
      acetoacetate in the PHB cycle, consistent with the aacs neighbourhood
      (hbdH, bhbP) noted in the main review. The mevalonate term is a
      mammalian AACS context written onto the TIGR01217 model, so the error is
      on the HMM; it would be valid only in the minority of bacteria that do
      carry a mevalonate pathway.
