suggested_questions:
  - question: Is Aacs the principal acetoacetate-activation route during KT2440 growth on D-3-hydroxybutyrate?
suggested_experiments:
  - description: >-
      Compare acetoacetate-CoA ligase activity, acetoacetyl-CoA abundance, and
      growth on D-3-hydroxybutyrate in wild type, aacs deletion, and
      complemented KT2440 strains.
    experiment_type: targeted metabolomics and carbon-source growth assay
