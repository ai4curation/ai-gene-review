id: Q88IC8
gene_symbol: aacs
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Aacs is a predicted acetoacetate-CoA ligase that activates acetoacetate to
  acetoacetyl-CoA using ATP and coenzyme A. In KT2440 it is encoded near hbdH
  and bhbP, supporting a bacterial D-3-hydroxybutyrate utilization route that
  may use direct ATP-dependent acetoacetate activation; the physiological route
  and flux contribution of Q88IC8 have not been demonstrated directly.
existing_annotations:
  - term:
      id: GO:0006629
      label: lipid metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This broad InterPro-derived process overstates what is known for the KT2440 protein.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The mapping imports a broad lipid-process context from InterPro. The
        predicted ligase chemistry does not by itself establish that Q88IC8
        participates in lipid metabolism in KT2440; evidence from mammalian
        AACS is not transferable to this bacterial candidate.
  - term:
      id: GO:0030729
      label: acetoacetate-CoA ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining EC- and family-supported Aacs reaction.
      action: ACCEPT
      reason: >-
        UniProt assigns EC 6.2.1.16 and both InterPro IPR005914 and
        PTHR42921:SF1 identify acetoacetyl-CoA synthetase.
      supported_by:
        - reference_id: file:PSEPK/aacs/aacs-uniprot.txt
          supporting_text: Acetoacetyl-coenzyme A synthetase
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/aacs/aacs-uniprot.txt
    title: UniProtKB entry for PSEPK aacs
    findings:
      - statement: Q88IC8 is assigned EC 6.2.1.16 and the acetoacetyl-CoA synthetase family.
  - id: PMID:7140777
    title: Purification and characterization of acetoacetyl-CoA synthetase from Zoogloea ramigera I-16-M.
    findings:
      - statement: A bacterial acetoacetyl-CoA synthetase directly activates acetoacetate with ATP and CoA.
        supporting_text: >-
          The enzyme absolutely required ATP, CoA, a monovalent cation
          (K+, Rb+, Cs+ or NH+4) and a divalent cation (Mg2+, Mn2+, Ca2+ or Ni2+) for the activation
          of acetoacetate, yielding acetoacetyl-CoA, AMP and pyrophosphate in equimolar
          amounts.
  - id: PMID:10735852
    title: Requirement for the enzymes acetoacetyl coenzyme A synthetase and poly-3-hydroxybutyrate (PHB) synthase for growth of Sinorhizobium meliloti on PHB cycle intermediates.
    findings:
      - statement: A bacterial homolog is required for acetoacetate activation in a PHB-cycle context.
        supporting_text: >-
          These findings suggest that acetoacetyl-CoA
          synthetase, rather than CoA transferase, activates acetoacetate to
          acetoacetyl-CoA in the S. meliloti poly-3-hydroxybutyrate cycle.
