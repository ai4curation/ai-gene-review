id: Q88IC8
gene_symbol: aacs
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Aacs is a predicted acetoacetate-CoA ligase that activates acetoacetate to
  acetoacetyl-CoA using ATP and coenzyme A. In KT2440 it is encoded near hbdH
  and bhbP, supporting a bacterial D-3-hydroxybutyrate utilization route that
  uses direct ATP-dependent acetoacetate activation.
existing_annotations:
  - term:
      id: GO:0006629
      label: lipid metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This broad InterPro-derived process is compatible with Aacs chemistry but is not its defining function.
      action: KEEP_AS_NON_CORE
      reason: >-
        Acetoacetate activation can feed several metabolic contexts, so the
        broad lipid-metabolism parent is not incorrect. It is retained as
        non-core because the substrate-specific acetoacetate-CoA ligase
        activity and local KT2440 pathway context are more informative.
  - term:
      id: GO:0030729
      label: acetoacetate-CoA ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining EC- and family-supported Aacs reaction.
      action: ACCEPT
      reason: >-
        UniProt assigns EC 6.2.1.16 and both InterPro IPR005914 and
        PTHR42921:SF1 identify acetoacetyl-CoA synthetase.
      supported_by:
        - reference_id: file:PSEPK/aacs/aacs-uniprot.txt
          supporting_text: Acetoacetyl-coenzyme A synthetase
  - term:
      id: GO:0046952
      label: ketone body catabolic process
    evidence_type: ISS
    original_reference_id: file:PSEPK/aacs/aacs-uniprot.txt
    qualifier: involved_in
    review:
      summary: Aacs activates the acetoacetate produced from D-3-hydroxybutyrate.
      action: NEW
      reason: >-
        The exact acetoacetate-CoA ligase reaction and conserved local linkage
        to hbdH and bhbP support this pathway placement.
      supported_by:
        - reference_id: file:PSEPK/aacs/aacs-uniprot.txt
          supporting_text: EC=6.2.1.16
