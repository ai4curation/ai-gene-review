id: Q88D60
gene_symbol: metK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  metK (PP_4967) encodes the soluble S-adenosylmethionine synthase that converts
  L-methionine and ATP to S-adenosyl-L-methionine (SAM), phosphate, and
  diphosphate. This magnesium- and potassium-dependent enzyme supplies the
  principal methyl donor used by cellular methyltransferases and forms the entry
  reaction of the methionine cycle.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Magnesium binding is a supported catalytic cofactor feature of MetK.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt records two divalent ions per subunit for the methionine
      adenosyltransferase reaction. Magnesium binding supports catalysis, while
      GO:0004478 captures the defining molecular function.
    supported_by:
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "Name=Mg(2+)"
    - reference_id: file:PSEPK/metK/metK-goa.tsv
      supporting_text: "GO:0000287\tmagnesium ion binding"
- term:
    id: GO:0004478
    label: methionine adenosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Methionine adenosyltransferase activity is the core MetK function.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record assigns EC 2.5.1.6 and RHEA:21080 for
      ATP-dependent SAM formation, exactly matching GO:0004478.
    supported_by:
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "Catalyzes the formation of S-adenosylmethionine (AdoMet) from"
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "Xref=Rhea:RHEA:21080"
    - reference_id: file:PSEPK/metK/metK-goa.tsv
      supporting_text: "GO:0004478\tmethionine adenosyltransferase activity"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is directly required for the MetK reaction but is not its defining function.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP is a substrate in RHEA:21080 and multiple ATP-contacting residues are
      annotated in UniProt. The specific catalytic activity GO:0004478 remains
      the core molecular function.
    supported_by:
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "Reaction=L-methionine + ATP + H2O = S-adenosyl-L-methionine + phosphate"
    - reference_id: file:PSEPK/metK/metK-goa.tsv
      supporting_text: "GO:0005524\tATP binding"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is appropriate for this soluble bacterial enzyme.
    action: ACCEPT
    reason: >-
      The reviewed UniProt entry explicitly assigns MetK to the cytoplasm and
      contains no signal peptide or membrane-spanning feature.
    supported_by:
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
    - reference_id: file:PSEPK/metK/metK-goa.tsv
      supporting_text: "GO:0005737\tcytoplasm"
- term:
    id: GO:0006556
    label: S-adenosylmethionine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: MetK performs the single reaction of SAM biosynthesis from methionine.
    action: ACCEPT
    reason: >-
      UniProt places MetK in S-adenosyl-L-methionine biosynthesis and identifies
      its reaction as the sole step from L-methionine.
    supported_by:
    - reference_id: file:PSEPK/metK/metK-uniprot.txt
      supporting_text: "S-adenosyl-L-methionine from L-methionine: step 1/1"
    - reference_id: file:PSEPK/metK/metK-goa.tsv
      supporting_text: "GO:0006556\tS-adenosylmethionine biosynthetic process"
