proposed_new_terms: []
suggested_questions:
- question: >-
    How strongly does KT2440 MetK control the intracellular SAM:SAH ratio under
    carbon-source or sulfur limitation?
suggested_experiments:
- description: >-
    Titrate metK expression and quantify methionine, SAM, SAH, and homocysteine
    during growth on defined carbon and sulfur sources.
  experiment_type: targeted expression and metabolomics
