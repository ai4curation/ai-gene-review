id: Q88D60
gene_symbol: metK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: metK (PP_4967) encodes the soluble S-adenosylmethionine synthase that converts L-methionine
  and ATP to S-adenosyl-L-methionine (SAM), phosphate, and diphosphate. This magnesium- and potassium-dependent
  enzyme supplies the principal methyl donor used by cellular methyltransferases and forms the entry reaction
  of the methionine cycle.
