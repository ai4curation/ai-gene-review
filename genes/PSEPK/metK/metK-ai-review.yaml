    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The target's catalytic MetK substrate/cofactor binding is core.
    action: ACCEPT
    reason: UniProt records two divalent ions per subunit for the methionine adenosyltransferase reaction.
      Magnesium binding supports catalysis, while GO:0004478 captures the defining molecular function.
      These HAMAP-supported catalytic substrate/cofactor contacts are integral to the conserved reaction
      rather than peripheral; ACCEPT reflects that role without claiming a direct KT2440 assay.
    supported_by:
