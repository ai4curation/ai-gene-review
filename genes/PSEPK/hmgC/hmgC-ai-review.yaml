id: Q88E49
gene_symbol: hmgC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  HmgC is the glutathione-dependent maleylacetoacetate isomerase of the
  Pseudomonas putida KT2440 homogentisate pathway. It converts
  maleylacetoacetate to fumarylacetoacetate between the HmgA ring-cleavage and
  HmgB hydrolysis reactions during aromatic-compound catabolism.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but uninformative parent-level catalytic annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Q88E49 matches the NCBIfam maiA (TIGR01262) maleylacetoacetate isomerase
      model and acts as HmgC in the characterized P. putida homogentisate
      pathway, so the specific GO:0016034 activity should replace generic
      catalytic activity.
    supported_by:
    - reference_id: file:PSEPK/hmgC/hmgC-uniprot.txt
      supporting_text: 'DR   NCBIfam; TIGR01262; maiA; 1.'
- term:
    id: GO:0004364
    label: glutathione transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Family-level transferase term that overstates the supported HmgC chemistry.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Q88E49 does carry the GST-zeta signature, and the TreeGrafter/PANTHER term
      descends from the family-root IBD at PTN001344486, which is seeded by
      members with measured (if weak) conjugating activity such as human GSTZ1
      and E. coli YfcF. For the dedicated maiA/maleylpyruvate-isomerase branch
      that Q88E49 belongs to, however, the structurally characterized relative
      shows glutathione acting as a regenerated cofactor rather than as a
      cosubstrate, and no transferase assay exists for this protein. GO:0016034
      captures the supported substrate-specific isomerase function; the
      family-level transferase term is retained in GOA but is an over-annotation
      for this gene. See interpro/panther/PTHR42673/PTHR42673-review.yaml.
    supported_by:
    - reference_id: file:PSEPK/hmgC/hmgC-uniprot.txt
      supporting_text: 'DR   InterPro; IPR005955; GST_Zeta.'
    - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
      supporting_text: "PTN001344486\tGO:0004364\tF\tIBD"
    - reference_id: PMID:18824004
      supporting_text: >-
        glutathione is a true cofactor rather than a substrate in the reaction
      full_text_unavailable: true
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Consistent localization for a soluble intracellular pathway enzyme.
    action: ACCEPT
    reason: >-
      HmgC acts between the soluble HmgA and HmgB reactions in the intracellular
      homogentisate pathway and has no signal peptide or membrane role.
- term:
    id: GO:0006559
    label: L-phenylalanine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Correct pathway annotation for phenylalanine degradation through homogentisate.
    action: ACCEPT
    reason: >-
      The P. putida pathway study establishes that phenylalanine is converted
      to homogentisate and then catabolized by HmgABC.
    supported_by:
    - reference_id: PMID:15262943
      supporting_text: >-
        Pseudomonas putida metabolizes Phe and Tyr through a peripheral pathway
        involving hydroxylation of Phe to Tyr (PhhAB), conversion of Tyr into
        4-hydroxyphenylpyruvate (TyrB), and formation of homogentisate (Hpd) as
        the central intermediate.
      full_text_unavailable: true
- term:
    id: GO:0006749
    label: glutathione metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Over-propagated process annotation from the GST-zeta enzyme family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Glutathione is a catalytic cofactor for maleylacetoacetate isomerization,
      regenerated in each turnover rather than consumed; that cofactor
      requirement does not make HmgC part of glutathione biosynthesis,
      degradation, or homeostasis. The term descends from the family-root IBD at
      PTN001344486, seeded by GSTZ1-type members, and records cofactor use
      rather than a role in glutathione metabolism. Its established biological
      process is homogentisate catabolism.
    supported_by:
    - reference_id: PMID:18824004
      supporting_text: >-
        glutathione is a true cofactor rather than a substrate in the reaction
      full_text_unavailable: true
    - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
      supporting_text: "PTN001344486\tGO:0006749\tP\tIBD"
- term:
    id: GO:0009072
    label: aromatic amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Broad, redundant process annotation for HmgC's defined pathway role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      HmgC can receive homogentisate-derived carbon from aromatic amino-acid
      catabolism, but this broad umbrella term is redundant with the specific
      GO:1902000 homogentisate catabolic process annotation added below.
    supported_by:
    - reference_id: PMID:15262943
      supporting_text: >-
        Homogentisate is then catabolized by a central catabolic pathway that
        involves three enzymes, homogentisate dioxygenase (HmgA),
        fumarylacetoacetate hydrolase (HmgB), and maleylacetoacetate isomerase
        (HmgC), finally yielding fumarate and acetoacetate.
      full_text_unavailable: true
