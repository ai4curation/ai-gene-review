- id: PMID:15262943
  title: 'The homogentisate pathway: a central catabolic pathway involved in the degradation
    of L-phenylalanine, L-tyrosine, and 3-hydroxyphenylacetate in Pseudomonas putida.'
  findings:
  - statement: HmgC is one of the three enzymes of the P. putida homogentisate pathway.
    supporting_text: >-
      Homogentisate is then catabolized by a central catabolic pathway that
      involves three enzymes, homogentisate dioxygenase (HmgA),
      fumarylacetoacetate hydrolase (HmgB), and maleylacetoacetate isomerase
      (HmgC), finally yielding fumarate and acetoacetate.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary P. putida pathway study. The cached record is
      abstract-only but explicitly identifies HmgC and the pathway products.
- id: PMID:18824004
  title: Structure of bacterial glutathione-S-transferase maleyl pyruvate isomerase
    and implications for mechanism of isomerisation.
  findings:
  - statement: In the bacterial GST-zeta isomerases, glutathione is a cofactor regenerated
      during catalysis rather than a cosubstrate consumed in a transfer reaction.
    supporting_text: >-
      glutathione is a true cofactor rather than a substrate in the reaction
    reference_section_type: ABSTRACT
  - statement: Maleylpyruvate isomerase and maleylacetoacetate isomerase are closely
      related GST-zeta enzymes catalysing analogous glutathione-dependent isomerizations
      of ring-cleavage products.
    supporting_text: >-
      MPI has significant sequence similarity to maleylacetoacetate isomerase (MAAI),
      which performs an analogous reaction in the catabolism of phenylalanine and tyrosine
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structural/mechanistic study of the Ralstonia GST-zeta
      maleylpyruvate isomerase (NagL), a close bacterial relative of HmgC in the
      same PANTHER family. Cited for the mechanistic point that glutathione is a
      regenerated cofactor, not a transfer cosubstrate. Cached record is
      abstract-only.
