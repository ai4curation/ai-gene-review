- term:
    id: GO:0008963
    label: phospho-N-acetylmuramoyl-pentapeptide-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct MraY translocase activity, but stated on the L-lysine pentapeptide rather than
      the meso-diaminopimelate one KT2440 makes.
    action: MODIFY
    reason: >-
      GO:0008963 is defined on the L-lysine stem peptide and GO:0051992 on the meso-diaminopimelate
      one; they are siblings under GO:0016780, so neither refines the other and this is a
      lateral substrate correction, the long-standing non-descendant use of MODIFY. KT2440
      MurE inserts meso-diaminopimelate, so GO:0051992, which this gene already carries, is
      the reaction it performs. The enzyme class does not itself select the third stem residue,
      so the row is not false, only the wrong stem variant for this organism; unlike MurF,
      this enzyme has no cross-species evidence of accepting both forms, so it is corrected
      rather than retained as non-core. Harmonized with the Escherichia coli K-12 ortholog
      review.
    supported_by:
    - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Xref=Rhea:RHEA:28386, ChEBI:CHEBI:57865,
    - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: NCBIfam; TIGR00445; mraY; 1.
    proposed_replacement_terms:
    - id: GO:0051992
      label:
        UDP-N-acetylmuramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimelyl-D-alanyl-D-alanine:undecaprenyl-phosphate
        transferase activity
