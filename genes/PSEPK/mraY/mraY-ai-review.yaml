- term:
    id: GO:0071555
    label: cell wall organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: MraY contributes to building the peptidoglycan cell wall, so this broader
      cell wall organization process is correct but generic given that the specific
      peptidoglycan biosynthetic process (GO:0009252) is also annotated and captures the
      role precisely.
    action: KEEP_AS_NON_CORE
    reason: >-
      Assembly of the peptidoglycan sacculus is a genuine downstream
      consequence of MraY's lipid I synthesis, and UniProt files the protein
      under cell wall biogenesis/degradation, so the term is true rather than
      wrong. It is kept as non-core because MraY's direct activity is the
      substrate-level transferase reaction (GO:0008963 / GO:0051992) within
      GO:0009252, and cell wall organization describes the wider pathway
      outcome rather than MraY's own step.
    supported_by:
    - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'PATHWAY: Cell wall biogenesis; peptidoglycan biosynthesis.'
