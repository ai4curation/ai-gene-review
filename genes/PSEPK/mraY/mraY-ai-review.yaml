suggested_questions:
- question: Is P. putida KT2440 MraY essential for viability, and how does its activity
    integrate with the de novo and recycling routes that supply UDP-MurNAc-pentapeptide?
  experts:
  - Bacterial cell-wall biosynthesis experts
- question: Does Pseudomonas MraY display the same nucleoside-antibiotic (e.g.
    muraymycin, tunicamycin) inhibition profile observed for other bacterial MraY
    enzymes?
  experts:
  - Antibacterial target / translocase inhibitor experts
suggested_experiments:
- description: Heterologously express and purify P. putida MraY in membrane/detergent
    and assay lipid I formation from UDP-MurNAc-pentapeptide and undecaprenyl phosphate,
    confirming EC 2.7.8.13 activity and Mg2+ dependence.
  experiment_type: in vitro membrane transferase (lipid I formation) assay
- description: Test essentiality and effect on cell shape/division via conditional
    depletion or attempted deletion of mraY (PP_1334) in KT2440, monitoring
    peptidoglycan precursor pools and morphology.
  experiment_type: conditional gene depletion and phenotypic / morphological analysis
