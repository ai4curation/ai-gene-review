taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Phosphate acetyltransferase Pta (PP_0774) is a cytoplasmic enzyme of Pseudomonas putida KT2440
  that catalyzes reversible acetyl transfer between acetyl-CoA and inorganic phosphate, producing acetyl
  phosphate and free CoA in the forward direction. Pta activity is detected in cell-free extracts and
  depends on an intact pta gene. The 695-residue protein contains an N-terminal CobB/CobQ-like region
  and a C-terminal phosphate acetyltransferase region. Native Pta can supply acetyl phosphate to an introduced
  Escherichia coli acetate kinase for ATP and acetate production, but this engineered coupling does not
  establish a complete native AckA–Pta pathway or the physiological importance of reverse acetyl-CoA synthesis.
