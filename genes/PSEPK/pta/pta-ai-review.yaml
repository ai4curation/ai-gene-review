- term:
    id: GO:0006085
    label: acetyl-CoA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: Native acetyl-CoA biosynthesis through Pta is unresolved despite its reversible molecular
      activity.
    action: UNDECIDED
    reason: The UniPathway mapping assigns the reverse acetate-assimilation route, but reaction reversibility
      alone does not establish a native process. PMID23149123 verifies Pta activity while reporting that
      KT2440 lacks acetate kinase and that native Pta physiological relevance remains uncertain. Its demonstrated
      energy-coupling experiment introduces E. coli AckA and consumes acetyl-CoA. Other acetyl-phosphate
      sources or physiological reverse flux are not excluded, so the native biosynthetic-process claim
      is unresolved rather than disproven. Do not infer a native pathway merely from the engineered strain
      or a pathway diagram.
    supported_by:
    - reference_id: file:PSEPK/pta/pta-source-analysis/PMID23149123-scoped-evidence.md
      supporting_text: P. putida KT2440 only encodes a pta (PP0774, annotated as phosphate acetyltransferase;
        Fig. 2A) and completely lacks an acetate kinase gene.
    - reference_id: file:PSEPK/pta/pta-source-analysis/PMID23149123-scoped-evidence.md
      supporting_text: These results suggest that Pta is indeed active in P. putida KT2440 in a growth-phase
        dependent fashion, but its relevance (if any) on the cell physiology remains uncertain.
    - *id001
core_functions:
- description: Catalyzes reversible acetyl-CoA/phosphate interconversion with acetyl phosphate/CoA. Direct
    KT2440 extract and pta-mutant assays establish Pta activity; coupling to acetate kinase for ATP production
    was demonstrated with a heterologous E. coli AckA. A native acetate-assimilation process is not asserted
    from this chemistry alone.
  molecular_function:
    id: GO:0008959
    label: phosphate acetyltransferase activity
  supported_by:
  - *id001
  - *id002
