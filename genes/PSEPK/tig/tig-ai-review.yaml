      based on the UniProt entry and trigger factor literature.
- id: file:interpro/panther/PTHR30560/PTHR30560-metadata.yaml
  title: PANTHER family PTHR30560 (TRIGGER FACTOR CHAPERONE AND PEPTIDYL-PROLYL CIS/TRANS
    ISOMERASE) and subfamily PTHR30560:SF3 (TRIGGER FACTOR-LIKE PROTEIN TIG, CHLOROPLASTIC)
  findings:
  - statement: tig (Q88KJ1) is classified in PANTHER family PTHR30560 and subfamily
      PTHR30560:SF3.
  - statement: The family name "TRIGGER FACTOR CHAPERONE AND PEPTIDYL-PROLYL CIS/TRANS
      ISOMERASE" confirms the dual trigger-factor chaperone plus PPIase function of
      tig, while the ", CHLOROPLASTIC" tag on the SF3 subfamily is a eukaryote-biased
      naming artifact and does not imply chloroplast localization for this bacterial
      protein.
- id: file:interpro/panther/PTHR30560/PTHR30560-paint.tsv
  title: Current PAINT assertions for PANTHER family PTHR30560
  findings:
  - statement: Current cached PAINT data place five IBD assertions at ancestral node
      PTN001254607, including PPIase activity, ribosome binding, protein folding chaperone,
      protein unfolding, and de novo cotranslational protein folding; the four non-PPIase
      assertions are seeded by experimentally annotated E. coli trigger factor P0A850.
- id: file:projects/UNFOLDED_PROTEIN_BINDING.md
  title: Unfolded protein binding annotation review project
  findings:
  - statement: GO:0051082 is obsolete, GO:0140309 is restricted to carrier-holdases
      that escort clients to a defined acceptor or location, and GO:0044183 is the
      current term for protein-folding chaperone activity.
