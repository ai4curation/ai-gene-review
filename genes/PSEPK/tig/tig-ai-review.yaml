  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: This TreeGrafter/PANTHER transfer describes trigger factor as involved
      in protein unfolding. Full-text work on the experimental E. coli P0A850 seed
      shows that multivalent substrate binding can retain proteins unfolded and can
      actively unfold transient structures when trigger factor is ribosome-colocalized.
