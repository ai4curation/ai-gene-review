    reason: The current PAINT IBD assertion is experimentally seeded by E. coli trigger
      factor P0A850, and PMID:24812405 directly supports context-dependent unfoldase
      behavior. Retain the propagated BP for P. putida Tig, but as non-core because
      free-cytosolic unfoldase activity is weak and ribosome-enhanced unfolding is
      one mechanism within the broader cotranslational chaperone role. The physical
      TreeGrafter row cites PTN002412671 whereas the current cached PAINT node is
      PTN001254607; this node-version drift does not negate the experimental seed.
