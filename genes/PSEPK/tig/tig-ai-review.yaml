  title: Structural basis for protein antiaggregation activity of the trigger factor
    chaperone.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text directly characterizes E. coli trigger factor P0A850,
      the experimental seed for the PANTHER protein-unfolding assertion, by NMR and
      aggregation assays.
  findings:
  - statement: Multivalent trigger-factor binding holds PhoA in an extended, unfolded
      state, protects exposed hydrophobic regions from aggregation, and can actively
      unfold transient structures when trigger factor is colocalized with its substrate
      at the ribosome.
