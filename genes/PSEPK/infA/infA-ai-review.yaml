suggested_questions:
- question: Which Pseudomonas-specific initiation or stress-response phenotypes are most sensitive to reduced IF-1 abundance?
suggested_experiments:
- description: Quantify 30S and 70S initiation-complex formation after controlled infA depletion.
  experiment_type: ribosome profiling and biochemical initiation assay
