  findings: []
core_functions:
- description: >-
    Acts as translation initiation factor IF-1 on the bacterial 30S subunit,
    stabilizing the other initiation factors and supporting productive
    preinitiation-complex assembly.
  molecular_function:
    id: GO:0003743
    label: translation initiation factor activity
  directly_involved_in:
  - id: GO:0006413
    label: translational initiation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:PSEPK/infA/infA-uniprot.txt
    supporting_text: >-
      Stabilizes the binding of IF-2 and IF-3 on the 30S subunit to which
      N-formylmethionyl-tRNA(fMet) subsequently binds.
  - reference_id: PMID:11228145
    supporting_text: >-
      Binding of IF1 occludes the ribosomal A site and flips out the functionally
      important bases A1492 and A1493 from helix 44 of 16S RNA
proposed_new_terms: []
suggested_questions:
- question: Which Pseudomonas-specific initiation or stress-response phenotypes are most sensitive to reduced IF-1 abundance?
suggested_experiments:
- description: Quantify 30S and 70S initiation-complex formation after controlled infA depletion.
  experiment_type: ribosome profiling and biochemical initiation assay
