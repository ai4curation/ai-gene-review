core_functions:
- description: >-
    Acts as translation initiation factor IF-1 on the bacterial 30S subunit,
    organizing the decoding center and supporting productive initiation-complex assembly.
  molecular_function:
    id: GO:0003743
    label: translation initiation factor activity
  directly_involved_in:
