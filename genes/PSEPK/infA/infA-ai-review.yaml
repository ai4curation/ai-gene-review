id: P65117
gene_symbol: infA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Bacterial translation initiation factor IF-1. It binds the 30S ribosomal
  subunit, occupies the A site during initiation, and promotes assembly of a
  productive initiation complex with IF-2, IF-3, mRNA, and initiator tRNA.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The term is true but too broad and redundant with existing RNA-binding and initiation-factor annotations.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003676 adds no information beyond the separately annotated
      GO:0003723 RNA binding and accepted GO:0003743 translation initiation
      factor activity terms.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: RNA contact is intrinsic to ribosome binding but is not the most informative core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      IF-1 acts on the 30S preinitiation complex, but RNA binding alone does not
      capture its defining initiation-factor role.
- term:
    id: GO:0003743
    label: translation initiation factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the conserved core molecular function of bacterial IF-1.
    action: ACCEPT
    reason: >-
      UniProt describes IF-1 as an essential initiation component that stabilizes
      IF-2 and IF-3 on the 30S subunit.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct broad location, but redundant with the separately accepted cytosol annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0005737 is a correct, directly supported broad location for the soluble
      factor. It is retained as non-core because the same GOA set already
      contains the more specific GO:0005829 cytosol annotation.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct location for the soluble bacterial translation factor and ribosomal initiation complexes.
    action: ACCEPT
    reason: >-
      The UniProt cytoplasmic assignment and soluble 30S-complex role support a
      cytosolic location.
- term:
    id: GO:0006413
    label: translational initiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Directly captures the core biological process in which IF-1 acts.
    action: ACCEPT
    reason: >-
      IF-1 stabilizes the bacterial 30S preinitiation complex and is released
      when the mature 70S initiation complex forms.
- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: IF-1 contacts 16S rRNA on the 30S subunit, but this binding term is subordinate to its initiation-factor activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      rRNA contact is mechanistically valid for a 30S-bound factor but is not a
      substitute for the specific initiation-factor activity.
- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: IF-1 binds specifically to the small ribosomal subunit rather than generically to either ribosomal subunit.
    action: MODIFY
    reason: >-
      Structural evidence places IF-1 directly on the bacterial 30S subunit, so
      GO:0043024 is the more informative binding term.
    proposed_replacement_terms:
    - id: GO:0043024
      label: ribosomal small subunit binding
references:
- id: file:PSEPK/infA/infA-uniprot.txt
  title: UniProtKB entry for Pseudomonas putida KT2440 infA
  findings:
  - statement: UniProt identifies P65117 as bacterial translation initiation factor IF-1.
    supporting_text: 'RecName: Full=Translation initiation factor IF-1'
    reference_section_type: RESULTS
  - statement: The exact record places IF-2 and IF-3 before IF-1 in predominant preinitiation-complex assembly.
    supporting_text: >-
      Component of the 30S ribosomal translation pre-initiation complex which
      assembles on the 30S ribosome in the order IF-2 and IF-3, IF-1 and
      N-formylmethionyl-tRNA(fMet)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact target accession, product line, and assembly-order text in the fetched UniProt record.
- id: PMID:11228145
  title: Crystal structure of an initiation factor bound to the 30S ribosomal subunit.
  full_text_unavailable: true
  findings:
  - statement: A bacterial 30S-IF1 crystal structure places IF1 in the A site and shows its effect on decoding-center bases A1492 and A1493.
    supporting_text: >-
      Binding of IF1 occludes the ribosomal A site and flips out the functionally
      important bases A1492 and A1493 from helix 44 of 16S RNA
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary structural study; only the abstract is cached.
- id: PMID:22562136
  title: Real-time assembly landscape of bacterial 30S translation initiation complex.
  full_text_unavailable: true
  findings:
  - statement: Real-time kinetic measurements identify IF1 joining an initially unstable 30S-IF2-IF3 complex to stabilize the 30S preinitiation complex.
    supporting_text: >-
      IF3 and IF2 are the first factors to arrive, forming an unstable
      30S-IF2-IF3 complex. Subsequently, IF1 joins and locks the factors in a
      kinetically stable 30S PIC
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary real-time kinetic study; only the abstract is cached.
