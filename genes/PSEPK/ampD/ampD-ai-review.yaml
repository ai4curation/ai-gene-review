id: Q88PQ9
gene_symbol: ampD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AmpD is a cytoplasmic zinc-dependent
  1,6-anhydro-N-acetylmuramyl-L-alanine amidase. It cleaves the lactyl-amide
  bond between anhMurNAc and the stem peptide in imported muropeptides, allowing
  the sugar and peptide components to re-enter peptidoglycan recycling.
