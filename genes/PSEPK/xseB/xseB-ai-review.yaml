id: Q88QG5
gene_symbol: xseB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  XseB is the small subunit of the exodeoxyribonuclease VII complex. It
  assembles with XseA to support bidirectional single-stranded DNA degradation
  to nucleoside 5'-phosphates. The complex is a plausible orientation-flexible
  nuclease for mismatch-excision tracts, but its specific participation in
  KT2440 mismatch repair remains untested.
