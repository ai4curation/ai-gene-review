  - id: file:PSEPK/xseB/xseB-deep-research-openscientist.md
    title: OpenScientist deep research report for PSEPK xseB
    findings:
      - statement: >-
          OpenScientist independently recovered Q88QG5/PP_0529 as the
          noncatalytic small subunit of the Exodeoxyribonuclease VII complex.
        supporting_text: >-
          XseB is a **non-catalytic, architectural/stabilizing subunit** that
          decorates and stabilizes the central α-helical spine of XseA.
      - statement: The cognate XseA large subunit is present at PP_0528, adjacent to xseB.
        supporting_text: cognate XseA present (PP_0528)
        finding_review:
          finding_status: OVERTURNED
          superseded_by:
            - file:PSEPK/xseA/xseA-uniprot.txt
          review_notes: >-
            The fetched UniProt record places PSEPK xseA at PP_1027, not
            PP_0528, so the inferred PP_0528/PP_0529 adjacent-operon model is
            rejected.
          supported_by:
            - reference_id: file:PSEPK/xseA/xseA-uniprot.txt
              supporting_text: OrderedLocusNames=PP_1027
    reference_review:
      relevance: HIGH
      correctness: LOW_QUALITY
      review_notes: >-
        Report correctly identifies Q88QG5/PP_0529 as the ExoVII small subunit
        and supports the noncatalytic XseB contribution to the XseA/XseB
        nuclease. It also makes a concrete locus error by placing xseA at the
        adjacent PP_0528 locus; the real PSEPK xseA is Q88P26/PP_1027, so the
        asserted adjacent operon model was rejected.
