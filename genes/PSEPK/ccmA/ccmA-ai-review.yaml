id: Q88EX5
gene_symbol: ccmA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmA is the cytoplasmic ATPase of the inner-membrane CcmAB complex in cytochrome c maturation system I. It supplies ATP hydrolysis for CcmAB-dependent heme handling and CcmE cycling during c-type cytochrome biogenesis; current evidence does not support interpreting the complex as a conventional heme exporter.
existing_annotations:
  - term: {id: "GO:0005524", label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP binding is intrinsic to the CcmA ABC-family ATPase.
      action: MARK_AS_OVER_ANNOTATED
      reason: This broad substrate-binding parent is true but less informative than the existing ATP hydrolysis activity annotation.
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CcmA associates with the inner-membrane CcmB subunit.
      action: ACCEPT
      reason: Membrane association with CcmB is part of the location context for CcmA's core energy-coupling function.
  - term: {id: "GO:0015439", label: ABC-type heme transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: CcmA energizes CcmAB, but the transported substrate is unresolved.
      action: REMOVE
      reason: The UniProt function note explicitly states that CcmAB was once thought to export heme but no longer appears to do so; a literal heme-transporter MF is therefore unsupported.
      supported_by:
        - reference_id: file:PSEPK/ccmA/ccmA-uniprot.txt
          supporting_text: does not seem to be the case, but its exact role is uncertain.
  - term: {id: "GO:0016887", label: ATP hydrolysis activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmA hydrolyzes ATP to energize the CcmAB complex.
      action: ACCEPT
      reason: The ABC ATPase domain architecture and annotated energy-coupling role support this as the core MF.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmA participates specifically in c-type cytochrome maturation.
      action: MODIFY
      reason: The annotation is directionally correct but GO:1903607 is the more specific process.
      proposed_replacement_terms:
        - id: GO:1903607
          label: cytochrome c biosynthetic process
  - term: {id: "GO:0022857", label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This generic transporter assignment derives from the historical exporter model.
      action: REMOVE
      reason: CcmA is an ATPase rather than a membrane-spanning transporter, and the substrate transported by CcmAB is unresolved.
  - term: {id: "GO:0035351", label: heme transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: CcmA supports heme handling during CcmE loading but is not established to transport heme across the membrane.
      action: REMOVE
      reason: The explicit heme-export model is contradicted by the current UniProt functional assessment.
  - term: {id: "GO:0055085", label: transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: This broad process is propagated from an uncertain transporter interpretation.
      action: REMOVE
      reason: The supported biological role is cytochrome c maturation, not generic transmembrane transport.
