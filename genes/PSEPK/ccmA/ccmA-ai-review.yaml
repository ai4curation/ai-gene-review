id: Q88EX5
gene_symbol: ccmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ccmA encodes the cytoplasmic ATPase subunit of cytochrome c maturation system I. Hydrolyzes
  ATP as the nucleotide-binding subunit of CcmABCD, coupling energy to release of heme-loaded CcmE during
  cytochrome c maturation. Structural and biochemical studies support heme handling by CcmABCD, while
  the membrane-crossing route and its energetic coupling remain disputed. Its mechanistic assignment in
  Pseudomonas putida KT2440 is inferred from conserved features and characterized system I orthologs.
