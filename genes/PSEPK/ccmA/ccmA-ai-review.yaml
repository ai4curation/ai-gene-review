aliases: [Q88EX5, PP_4327]
core_functions:
  - description: Hydrolyzes ATP as the energy-coupling subunit of CcmAB during system I cytochrome c maturation.
    molecular_function: {id: "GO:0016887", label: ATP hydrolysis activity}
    directly_involved_in:
      - {id: "GO:1903607", label: cytochrome c biosynthetic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: file:PSEPK/ccmA/ccmA-uniprot.txt
        supporting_text: Responsible for energy coupling to the transport system.
      - reference_id: PMID:17419738
        supporting_text: We have purified a complex of these proteins, and found it to have ATP hydrolysis activity.
suggested_questions:
  - question: What molecular substrate or conformational transition is directly coupled to ATP hydrolysis by PSEPK CcmAB?
suggested_experiments:
  - description: Compare CcmE heme loading and release in wild type, ccmA deletion, and ATPase-site mutants.
    experiment_type: CcmE heme-loading assay
