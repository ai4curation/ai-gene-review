id: Q88EX5
gene_symbol: ccmA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmA is the cytoplasmic ATPase of the inner-membrane CcmAB complex in
  cytochrome c maturation system I. ATP hydrolysis supports CcmAB-dependent
  processing and release of holo-CcmE during c-type cytochrome biogenesis; the
  molecular substrate or conformational transition coupled to CcmAB remains
  unresolved.
existing_annotations:
  - term: {id: "GO:0005524", label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP binding is intrinsic to the CcmA ABC-family ATPase.
      action: KEEP_AS_NON_CORE
      reason: ATP binding is a valid, distinct binding function of this ABC-family ATPase, but ATP hydrolysis is the defining catalytic activity.
      supported_by:
        - reference_id: file:PSEPK/ccmA/ccmA-uniprot.txt
          supporting_text: ligand="ATP"
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CcmA associates with the inner-membrane CcmB subunit.
      action: ACCEPT
      reason: Membrane association with CcmB is part of the location context for CcmA's core energy-coupling function.
  - term: {id: "GO:0015439", label: ABC-type heme transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: CcmA energizes CcmAB, but the transported substrate is unresolved.
      action: REMOVE
      reason: >-
        The same UniProt record is internally contradictory: its FUNCTION note
        says the heme-export model no longer appears correct, while its legacy
        RHEA:19261/EC:7.6.2.5 catalytic mapping and this GOA row still encode
        heme b(in)-to-heme b(out) transport. Direct membrane-vesicle experiments
        found CcmAB unnecessary for heme export (PMID:10708391), and revised
        biochemical models instead place CcmAB in CcmE handling
        (PMID:17419738). The substrate-specific transporter MF is therefore
        removed as an obsolete EC-derived inference.
      supported_by:
        - reference_id: file:PSEPK/ccmA/ccmA-uniprot.txt
          supporting_text: does not seem to be the case, but its exact role is uncertain.
  - term: {id: "GO:0016887", label: ATP hydrolysis activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmA hydrolyzes ATP to energize the CcmAB complex.
      action: ACCEPT
      reason: The ABC ATPase domain architecture and annotated energy-coupling role support this as the core MF.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmA participates specifically in c-type cytochrome maturation.
      action: MODIFY
      reason: GO:1903607 directly names biosynthesis of the c-type cytochrome product, whereas GO:0017004 describes assembly of a cytochrome-containing complex.
      proposed_replacement_terms:
        - id: GO:1903607
          label: cytochrome c biosynthetic process
  - term: {id: "GO:0022857", label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This generic transporter assignment derives from the historical exporter model.
      action: REMOVE
      reason: CcmA is an ATPase rather than a membrane-spanning transporter, and experiments do not establish CcmAB as the heme-export route (PMID:10708391).
  - term: {id: "GO:0035351", label: heme transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: CcmA supports heme handling during CcmE loading but is not established to transport heme across the membrane.
      action: REMOVE
      reason: The explicit heme-export inference conflicts with both the UniProt FUNCTION caveat and direct evidence that CcmAB is not required for heme export (PMID:10708391).
  - term: {id: "GO:0055085", label: transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: This broad process is propagated from an uncertain transporter interpretation.
      action: REMOVE
      reason: The experimentally supported role is ATP-dependent CcmE processing during cytochrome c maturation, not generic transmembrane transport (PMID:17419738).
