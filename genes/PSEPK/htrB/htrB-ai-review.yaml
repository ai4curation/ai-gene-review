    summary: This term captures transfer of a fatty acyl chain from acyl-ACP to Kdo2-lipid IVA.
    action: ACCEPT
    reason: The exact activity is supported by the HtrB/LpxL HAMAP and NCBIfam signatures and the matching UniProt reaction.
