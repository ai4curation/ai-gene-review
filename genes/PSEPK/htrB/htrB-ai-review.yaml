    summary: HtrB is a single-pass inner-membrane protein.
    action: ACCEPT
    reason: The localization is explicitly supported by the HtrB/LpxL-specific HAMAP rule and a predicted transmembrane segment.
- term:
    id: GO:0008913
    label: Kdo2-lipid IVA acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
