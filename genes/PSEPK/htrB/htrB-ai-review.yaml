core_functions:
- description: >-
    Transfers a fatty acyl chain from acyl-ACP to Kdo2-lipid IVA during secondary
    acylation of lipid A at the inner membrane. In Pseudomonas putida this gene
    (ordered locus PP_1735) installs the C12:0 chain at the 2'-position, while its
    paralog PP_0063 installs 2-OH-C12:0 at the 2-position.
