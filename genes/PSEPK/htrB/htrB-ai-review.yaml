description: HtrB (LpxL), the product of ordered locus PP_1735, is an inner-membrane
  lipid A acyltransferase that transfers a fatty acyl chain from acyl carrier protein
  to Kdo2-lipid IVA during secondary acylation of lipid A. Gene deletion and
  reciprocal overexpression in Pseudomonas putida KT2442 identified it, together with
  its paralog PP_0063, as one of the two lipid A secondary acyltransferases, with
  PP_1735 adding C12:0 at the 2'-position and PP_0063 adding 2-OH-C12:0 at the
  2-position.
