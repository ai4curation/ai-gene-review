- id: PMID:28655819
  title: Functional Role of Lanthanides in Enzymatic Activity and Transcriptional Regulation of
    Pyrroloquinoline Quinone-Dependent Alcohol Dehydrogenases in Pseudomonas putida KT2440.
  full_text_unavailable: false
  findings:
  - statement: Purified target proteins oxidize both primary and secondary alcohols; artificial
      acceptor assays do not establish their native cytochrome partner.
    supporting_text: Similarly, 2-phenylethanol, the secondary alcohol 2-butanol, cinnamyl alcohol,
      and the acyclic sesquiterpene farnesol were efficiently converted, with specific activities
      ranging from 6.7 ± 1.1 to 2.0 ± 0.3 U mg−1.
  - statement: Target proteins were purified recombinantly from E. coli; that host is not the native
      organism.
    supporting_text: A one-step affinity chromatography method produced soluble C-terminally
      His-tagged PedE and PedH to visible purity (see Fig. S1 in the supplemental material) from
      cell lysates of Escherichia coli BL21(DE3).
  - statement: Calcium-dependent PedE contrasts with lanthanide-dependent PedH.
    supporting_text: While PedE showed enzyme activity at concentrations of 10 µM to 10 mM CaCl2,
      with a peak in activity at 1 mM
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected. Native KT2440 genetics is distinguished from
      recombinant protein assays. No native cytochrome-c partner assay is inferred.
- id: PMID:30158283
  title: The PedS2/PedR2 Two-Component System Is Crucial for the Rare Earth Element Switch in
    Pseudomonas putida KT2440.
  full_text_unavailable: false
  findings:
  - statement: Both proteins are type I quinoproteins in a native periplasmic oxidation system.
    supporting_text: For efficient capture and metabolism of such VOCs, P. putida makes use of two
      pyrroloquinoline quinone (PQQ)-dependent ethanol dehydrogenases (PQQ-EDHs)—namely, PedE and
      PedH—to carry out the initial oxidation steps in the periplasm of the cell (7, 8).
  - statement: PedS2/PedR2 controls expression; PedH-dependent feedback has an unresolved mechanism.
    supporting_text: In addition, the transcription of pedH is activated via a yet unknown pathway,
      in which a functional PedH protein is an essential component, most likely by acting as a
      lanthanide sensor (8).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected. Native KT2440 genetics is distinguished from
      recombinant protein assays. No native cytochrome-c partner assay is inferred.
- id: PMID:34513815
  title: Dehydrogenation Mechanism of Three Stereoisomers of Butane-2,3-Diol in Pseudomonas putida
