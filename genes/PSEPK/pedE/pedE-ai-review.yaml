  label: Pseudomonas putida KT2440
description: PedE is a calcium-dependent, pyrroloquinoline quinone (PQQ)-using alcohol dehydrogenase of
  Pseudomonas putida KT2440. It acts in the periplasm on diverse primary and secondary alcohols, including
  aromatic substrates, and also oxidizes some aldehydes. Together with the alternative metal-dependent
  paralog it provides condition-dependent entry into (2S,3S)-2,3-butanediol utilization. The PedS2/PedR2
  regulatory system adjusts expression to lanthanide availability. A cytochrome c acceptor is assigned
  by enzyme-family homology; the specific physiological KT2440 electron-transfer partner remains unresolved.
