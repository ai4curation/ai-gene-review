- term:
    id: GO:0016614
    label: oxidoreductase activity, acting on CH-OH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    action: ACCEPT
    reason: Retain this enzyme-class activity as core because it covers the demonstrated primary and
      secondary alcohol substrates. GO:0052934 additionally represents the inferred
      cytochrome-c-dependent primary-alcohol branch, but does not cover secondary-alcohol-to-ketone
      chemistry such as (2S,3S)-butanediol entry. The broad term is therefore needed to preserve the
      supported substrate scope.
    supported_by:
    - *id001
    - *id002
    summary: Primary and secondary alcohol oxidation are both supported catalytic activities.
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    action: REMOVE
    reason: The target is a type I quinoprotein, not a heme-containing quinohemoprotein. Its bound
      redox cofactor is PQQ; a separate cytochrome electron acceptor does not imply a heme
      prosthetic group within this enzyme. The ARBA-derived heme assignment conflates those enzyme
      classes.
    supported_by:
    - *id003
    - &id005
      reference_id: PMID:28655819
      supporting_text: The reaction mechanism of PQQ-ADHs is still not completely resolved but most
        likely proceeds via an ion-assisted direct hydride transfer from the substrate to C-5 of the
        noncovalently bound cofactor PQQ (10–12).
    summary: PQQ, rather than a heme prosthetic group, is the bound redox cofactor.
