suggested_questions:
- question: Which native KT2440 electron-transfer partner reoxidizes the enzyme-bound PQQ, and can that
    transfer be reconstituted with purified components?
- question: What is the quantitative stereospecificity for (2S,3S)-butanediol versus the other isomers
    under native metal conditions?
suggested_experiments:
- description: Reconstitute electron transfer using candidate native cytochromes and quantify alcohol
    oxidation, independently of PMS/DCPIP.
- description: Compare purified-enzyme kinetics for all three 2,3-butanediol stereoisomers with matched
    PQQ and metal conditions.
