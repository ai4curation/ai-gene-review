  full_text_unavailable: false
  findings:
  - statement: Native deletion and lanthanum rescue distinguish condition-dependent
      (2S,3S)-butanediol entry; this is not a purified stereospecificity assay.
    supporting_text: Double-knockout strain P. putida KT2440 (ΔpedEΔpedH) was completely unable to
      utilize (2S,3S)-2,3-BDO both in the presence and absence of La3+ (Figures 5C,D)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected. Native KT2440 genetics is distinguished from
      recombinant protein assays. The sentence reversing lanthanide effects on pedE/pedH expression
      conflicts with this paper's own rescue results and the 2017/2018 primary mechanism; use the
      primary regulatory studies for switch direction.
