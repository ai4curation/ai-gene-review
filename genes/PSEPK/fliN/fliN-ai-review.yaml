  review:
    summary: >-
      Combined IEA from the FliN family signature and UniRule. The GO term
      covers generation of torque for rotation of a flagellum, but torque is
      generated by the stator units acting on FliG, not by FliN.
    action: MODIFY
    reason: >-
      The motor-component assignment is sound, but FliN contributes the structure of the lower C
      ring rather than an independent cytoskeletal motor activity. Comparative C-ring structures
      support FliM/FliN organization (PMID:38632342); torque transmission involves stator
      contacts with FliG. Refine laterally to structural molecule activity (GO:0005198). Direct
      CheY-P contact with FliN is not assumed for KT2440.
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    supported_by:
