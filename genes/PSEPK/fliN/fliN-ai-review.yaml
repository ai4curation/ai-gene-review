  label: Pseudomonas putida KT2440
description: >-
  FliN (PP_4357) is the small flagellar motor switch protein of the C ring of the polar flagella
  of Pseudomonas putida KT2440. It consists of a disordered N-terminal region and a C-terminal
  FliN/SpoA domain and belongs to the FliN/MopA/SpaO family (TIGR02480). By homology with the E.
  coli and Salmonella motors, three FliN subunits associate with the C-terminal domain of each
  FliM to form FliM1/FliN3 units whose spiral at the bottom edge of the C ring underlies the
  cytoplasmic face of the basal body. FliN contributes the structural base of the
  CheY-responsive switch and, by homology, provides docking sites for FliH of the flagellar type
  III export apparatus. Direct CheY-P binding to FliN was reported in E. coli, whereas a later
  active-CheY-bound Salmonella structure shows contacts with FliM/FliG rather than FliN; the
  direct docking interface in KT2440 is unresolved. FliN therefore acts in both flagellar motor
  switching during chemotaxis and efficient flagellar assembly.
