- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001172
  - InterPro:IPR012826
  review:
    summary: >-
      FliN does part of the work of chemotaxis: it is part of the CheY-P
      binding site of the switch whose occupancy reverses motor rotation.
    action: ACCEPT
    reason: >-
      FliN contributes the structural base of the C-ring switch that translates
      response-regulator signaling into rotation changes, so it performs structural work in the
      chemotactic output. E. coli studies support direct CheY-P binding (PMID:20439729), but the
      active-mutant-bound Salmonella structure instead shows FliM/FliG contacts and no FliN
      contact (PMID:39179739). Retain chemotaxis based on the conserved switch role, without
      asserting that the direct docking interface is universal or measured in KT2440.
    supported_by:
    - reference_id: PMID:31452860
      supporting_text: CheY-P binds to FliNC in a FliM-dependent manner [38].
    - reference_id: PMID:31452860
      supporting_text: The binding of CheY-P to FliM and FliN affects subunit-subunit interactions between FliMM domains and between FliMC and FliN in the C ring to induce a 180° rotation of FliGCC relative to MotAC, thereby allowing the motor to rotate in CW direction [34].
    - reference_id: file:PSEPK/fliN/fliN-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: This complex interacts with the CheY and CheZ chemotaxis proteins, in addition to contacting components of the motor that determine the direction of flagellar rotation.
