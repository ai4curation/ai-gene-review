- id: PMID:31452860
  title: Directional Switching Mechanism of the Bacterial Flagellar Motor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text review of the C ring and CheY-P switching in E. coli, Salmonella and Thermotoga; ortholog/family evidence for KT2440 FliN.
  findings:
  - statement: CheY-P binds the FliN C-terminal domain in a FliM-dependent manner.
    supporting_text: CheY-P binds to FliNC in a FliM-dependent manner [38].
- id: PMID:39179739
  title: Structural basis of the bacterial flagellar motor rotational switching.
  findings:
  - statement: Salmonella C-ring cryo-EM with constitutively active CheY D13K/Y106W supports switching
      through FliM/FliG; it is comparative mechanistic evidence rather than an assay of KT2440 proteins.
    supporting_text: The CheY proteins are bound into an open groove between two adjacent protomers
      on the surface of the middle subring of the C ring and interact with the FliG and FliM subunits.
  - statement: The active-mutant-bound Salmonella structure does not show direct CheY–FliN contact.
      This limits transfer of the older E. coli direct-binding model without negating FliN structural
      participation in the switch.
    supporting_text: CheY** has no interactions with FliN and the bottom subring in the structure.
- id: PMID:20439729
  title: Chemotaxis signaling protein CheY binds to the rotor protein FliN to control the direction
    of flagellar rotation in Escherichia coli.
  findings:
  - statement: Earlier E. coli biochemical experiments support an interaction with FliN after CheY-P
      capture by FliM; this finding is retained as comparative evidence rather than generalized to
      every bacterial motor.
    supporting_text: Here, we show that this interaction serves to capture CheY(P) and that the switch
      to CW rotation involves the subsequent interaction of CheY(P) with FliN.
- id: PMID:38632342
  title: CryoEM structures reveal how the bacterial flagellum rotates and switches direction.
  findings:
  - statement: Primary Salmonella C-ring structures support the conserved structural FliM/FliN organization;
      exact KT2440 architecture is inferred.
    supporting_text: The switch is housed within the C-ring and is composed of the FliG, FliM and
      FliN subunits.
core_functions:
- description: >-
    Homology-supported structural subunit of the lower C ring, forming FliM/FliN units that
    support chemotactic switching and flagellar motility. FliH docking is supported by
    comparative family studies; direct CheY-P binding to KT2440 FliN is not established and is
    not required for the structural participation claim.
