suggested_questions:
- question: >-
    Does KT2440 FliN, like E. coli FliN, dock FliH and contribute to
    flagellar export, and does a fliN mutant lack flagella or only switching?
suggested_experiments:
- hypothesis: FliN is required both for flagellar assembly and for CheY-P-dependent switching in KT2440.
  description: >-
    Construct fliN deletion and C-terminal CheY-P-interface point mutants;
    score flagellation by staining, swimming and tethered-cell reversal
    frequency, and FliH co-purification.
  experiment_type: genetics and motility phenotyping
