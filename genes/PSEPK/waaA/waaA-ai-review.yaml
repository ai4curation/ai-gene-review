id: Q88D99
gene_symbol: waaA
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: WaaA is the inner-membrane-associated Kdo transferase that transfers
  3-deoxy-D-manno-octulosonate from CMP-Kdo to lipid IVA, initiating assembly of
  the Kdo-linked inner core of lipopolysaccharide.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: WaaA is associated with the cytoplasmic side of the bacterial inner membrane.
    action: ACCEPT
    reason: Membrane localization is supported by UniProt family annotation and is coherent with the lipid IVA acceptor.
- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: WaaA initiates the Kdo-containing inner core by transferring Kdo to lipid IVA.
    action: ACCEPT
    reason: This is a direct pathway consequence of the Kdo transferase reaction.
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Kdo addition modifies the lipid IVA precursor during formation of the lipid A-core junction.
    action: ACCEPT
    reason: The broad lipid A biosynthetic annotation is compatible with WaaA's role at the transition between lipid A and core assembly.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: Membrane is correct but redundant with the more precise plasma membrane annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic cellular-component term adds no information beyond GO:0005886.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Transferase activity is true but too generic relative to the Kdo transferase term.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0043842 captures the direct biochemical function.
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: WaaA is a glycosyltransferase, but this parent term is less specific than Kdo transferase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-defined child term should represent the core molecular function.
- term:
    id: GO:0043842
    label: Kdo transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: This term directly captures transfer of Kdo from CMP-Kdo to lipid IVA.
    action: ACCEPT
    reason: The activity is supported by Kdo-transferase-specific InterPro and NCBIfam signatures and the matching UniProt catalytic reaction.
core_functions:
- description: Transfers Kdo from CMP-Kdo to lipid IVA at the cytoplasmic face of the inner membrane, initiating the Kdo-linked LPS inner core.
  molecular_function:
    id: GO:0043842
    label: Kdo transferase activity
  directly_involved_in:
  - id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:PSEPK/waaA/waaA-uniprot.txt
    supporting_text: Catalyzes the transfer of 3-deoxy-D-manno-octulosonate (Kdo) residue(s)
