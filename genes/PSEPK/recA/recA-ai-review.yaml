- id: PMID:33393180
  title: The faulty SOS response of Pseudomonas putida KT2440 stems from an inefficient RecA-LexA interplay
  full_text_unavailable: true
  findings:
  - statement: P. putida KT2440 is very sensitive to DNA damage and recombines poorly; the weak SOS response is attributed to inefficient RecA-LexA interplay, with high basal recA and lexA1 expression and promoters the repressor cannot shut down entirely in the absence of damage.
    supporting_text: sensitive to DNA damage and displays poor homologous recombination efficiencies.
    reference_section_type: ABSTRACT
  - statement: The provider report attributes to this paper the result that activated P. putida RecA can cleave LexA1 entirely, which is not stated in the cached abstract and is used here only as a secondary attribution.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Organism-specific (P. putida KT2440/EM173) primary study. PMID recovered
      from deep-research DOI 10.1111/1462-2920.15384 (Akkaya et al. 2021);
      PubMed-verified, title matches. Only the abstract is cached, and it
      establishes the weak SOS response, the high basal recA/lexA1 expression and
      the poor recombination efficiency. The stronger claim that RecA*PP cleaves
      LexA1 entirely comes from the full text via the provider report and could
      not be verified here; the review therefore does not rest any annotation on
      it.
