- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: RecA recognizes and binds ssDNA generated at damaged/stalled DNA sites, a key step in recombinational repair and SOS activation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct in substance: RecA loads on the single-stranded DNA that DNA damage
      and fork stalling generate, which is how it senses damage. The row is a
      UniRule transfer applied consistently across RecA proteins, including
      E. coli RecA, and there is no assay of lesion binding as such for this
      protein; the core binding activity is single-stranded DNA binding, so this
      is kept as true but non-core rather than promoted.
    supported_by:
    - reference_id: file:PSEPK/recA/recA-deep-research-falcon.md
      supporting_text: >-
        In canonical bacterial SOS regulation, DNA damage yields ssDNA substrates
        that support formation of the activated RecA nucleoprotein filament
        (often denoted RecA*).
    - reference_id: file:PSEPK/recA/recA-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'DR   HAMAP; MF_00268; RecA; 1.'
- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: RecA nucleates and binds single-stranded DNA to form the helical nucleoprotein filament that performs homology search and strand exchange.
    action: ACCEPT
    reason: >-
      A core molecular function. The curated HAMAP function statement records
      ATP-dependent uptake of single-stranded DNA by duplex DNA, which requires
      ssDNA binding, and filament nucleation on ssDNA is the defining property of
      the family. KT2440 RecA itself has not been assayed, so the activity rests
      on the curated family rule plus the organism-specific LexA-cleavage work
      that requires an activated filament.
    supported_by:
    - reference_id: file:PSEPK/recA/recA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'CC       stranded DNA, the ATP-dependent uptake of single-stranded DNA by duplex'
    - reference_id: file:PSEPK/recA/recA-deep-research-falcon.md
      supporting_text: >-
        RecA filament formation proceeds through nucleation and extension phases,
        nucleates preferentially on ssDNA, and filament growth is directionally
        biased (noted as 5′→3′ extension in a recent MMBR review).
