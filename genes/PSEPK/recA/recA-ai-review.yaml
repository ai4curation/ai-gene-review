    action: ACCEPT
    reason: Single-stranded DNA binding is intrinsic to the curated RecA filament and strand-exchange
      mechanism. HAMAP independently assigns this target the ATP-dependent uptake of ssDNA by duplex
      DNA. This is conserved-role inference, not a claim that a purified KT2440 binding assay was
      read; the EM173 SOS study is regulatory context, not an ssDNA-binding measurement.
