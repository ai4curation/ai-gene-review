id: Q88ME4
gene_symbol: recA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RecA is the conserved recombinase of Pseudomonas putida KT2440. It binds single-stranded
  DNA and assembles ATP-dependent nucleoprotein filaments that promote homologous DNA pairing and
  strand exchange, supporting recombination and recombinational repair. ATP turnover contributes
  to filament dynamics. Activated DNA-bound RecA also promotes LexA autocleavage in SOS signaling;
  it is a cofactor for the repressor's self-cleavage rather than the protease that cuts LexA. These
  molecular properties are supported by curated RecA-family evidence. Experiments in the prophage-free
  KT2440 derivative EM173 show unusually high basal recA/lexA1 expression and modest induction by
  norfloxacin, so the strength of the response differs from the canonical E. coli system.
