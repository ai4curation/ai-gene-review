- id: PMID:33393180
  title: The faulty SOS response of Pseudomonas putida KT2440 stems from an inefficient RecA-LexA
    interplay
  full_text_unavailable: true
  findings:
  - statement: In the prophage-free KT2440 derivative EM173, recA/lexA1 promoter measurements show
      high basal expression and modest norfloxacin induction. This supports a weak regulatory response,
      not a purified strand-exchange assay or independently verified complete LexA1 cleavage.
    supporting_text: Basal expression of recA and lexA1 of P. putida were high in the absence of
      DNA damage and only moderately induced by norfloxacin.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; publisher full-text and author-page retrieval
      did not provide the full primary experiment. EM173 is explicitly identified in the abstract.
      The old provider complete-cleavage assertion is omitted from review conclusions rather than
      silently treated as primary evidence.
- id: PMID:37212693
  title: Generation and repair of postreplication gaps in Escherichia coli
  findings:
  - statement: Authoritative review of RecA-centered recombination, describing RecA nucleation on
      ssDNA, helical filament formation, homology search, and ATP-coupled strand exchange in recombinational
      repair.
    reference_section_type: LITERATURE_REVIEW
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Conserved-mechanism review (E. coli) used to frame core RecA molecular function.
      PMID recovered from deep-research DOI 10.1128/mmbr.00078-22 (Cox et al. 2023); PubMed-verified,
      title matches.
- id: PMID:21261833
  title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification
  findings:
  - statement: P. putida KT2440 recA (PP_1629) mutants are hypersensitive to lethal (10 mM) formaldehyde,
      with killing rates 3-4 orders of magnitude higher than the parental strain, indicating RecA-dependent
      DNA repair contributes to stress survival.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Organism-specific phenotype evidence for recA in stress/DNA-damage survival. PMID
      recovered deterministically from deep-research DOI 10.1111/j.1751-7915.2007.00014.x (doi_to_pmid
      -> 21261833); cached PubMed title matches (Roca et al., P. putida formaldehyde detoxification).
