id: Q88JX6
gene_symbol: galP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GalP is an OprD-family outer-membrane porin encoded in the Pseudomonas putida gallate-catabolic
  cluster. Disrupting galP in the gallate-adapted KTGAL derivative reduces cellular uptake at low gallate
  concentration without abolishing growth under the tested conditions. This supports a contribution to
  gallate entry, while the substrate range and selectivity of an isolated GalP channel remain unresolved.
existing_annotations:
- term:
    id: GO:0015288
    label: porin activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GalP has an inferred OprD-family porin activity, supported by a native uptake phenotype.
    action: ACCEPT
    reason: Curated outer-membrane porin membership and the IPR005318/PF03573 signatures support a channel
      activity. In the primary 2011 study, galP disruption in KTGAL reduced uptake of 10 micromolar gallate
      from 7.4 to 4.2 nmol/min/mg protein. This corroborates transport participation but is not an isolated-channel
      specificity assay. KTGAL differs from KT2440 in restoration of GalT; its GalP sequence is unchanged.
    supported_by:
    - reference_id: file:PSEPK/galP/galP-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the outer membrane porin (Opr) (TC 1.B.25)
    - reference_id: file:analysis/module_audits/bacterial_gallate_catabolism/review-20261107/publisher-evidence.md
      supporting_text: uptake of 10 µM GA
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Generic membrane localization is correct but should be refined to cell outer membrane for
      this porin-like protein.
    action: MODIFY
    reason: Curated Opr outer-membrane porin membership, OprD domain signatures and an N-terminal export
      signal support cell outer membrane as an inference. This is a more specific membrane compartment,
      not a claim of direct native fractionation. The KTGAL uptake phenotype corroborates transport but
      alone does not localize the protein.
    proposed_replacement_terms:
    - id: GO:0009279
      label: cell outer membrane
    supported_by:
    - reference_id: file:PSEPK/galP/galP-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: outer membrane porin
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: GalP contributes to cellular uptake in the gallate-adapted KTGAL background.
    action: ACCEPT
    reason: The KTGAL galP mutant retains growth but has reduced gallate uptake at 10 micromolar substrate.
      Combined with outer-membrane porin architecture, this supports transmembrane transport. No narrower
      substrate-selective channel activity is established by this whole-cell phenotype, and uptake is
      not demonstrated in unadapted KT2440 with its defective GalT.
    supported_by:
    - reference_id: file:PSEPK/galP/galP-uniprot.txt
