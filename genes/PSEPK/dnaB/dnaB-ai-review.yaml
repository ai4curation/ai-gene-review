    label: DNA replication, synthesis of primer
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: The target record places DnaB in the primosome and assigns primer synthesis, but helicase activity remains its defining role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The biological-process annotation does not assert that DnaB catalyzes RNA
      synthesis. The target UniProt record assigns both primosome-complex
      membership and this primer-synthesis process, supporting retention as
      non-core without inferring an undocumented target-specific interaction.
    supported_by:
