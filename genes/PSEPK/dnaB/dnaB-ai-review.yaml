id: Q88DF2
gene_symbol: dnaB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: DnaB is the hexameric ATP-dependent replicative DNA helicase. It translocates 5'-to-3' on one DNA strand ahead of the bacterial replisome, coupling ATP hydrolysis to parental-duplex unwinding during chromosome-replication initiation and elongation. DnaB also recruits and stimulates DnaG primase during primer synthesis.
