    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: True but nonspecific relative to ATP binding and ATP-dependent helicase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: DnaB is specifically an ATP-dependent P-loop helicase, so generic nucleotide binding adds little value.
