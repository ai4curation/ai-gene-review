  label: Pseudomonas putida KT2440
description: DnaB is the hexameric ATP-dependent replicative DNA helicase. It translocates 5'-to-3' on
  one DNA strand ahead of the bacterial replisome, coupling ATP hydrolysis to parental-duplex unwinding
  during chromosome-replication initiation and elongation. DnaB also recruits and stimulates DnaG primase
  during primer synthesis.
