taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PurD is phosphoribosylamine--glycine ligase, the ATP-dependent enzyme that adds glycine to
  5-phosphoribosylamine to form GAR in the second reaction of de novo IMP synthesis.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: Correct but less informative than the enzyme-specific activity.
    action: MODIFY
    reason: Replace the generic catalytic parent with phosphoribosylamine-glycine ligase activity.
    proposed_replacement_terms:
    - id: GO:0004637
      label: phosphoribosylamine-glycine ligase activity
- term:
    id: GO:0004637
    label: phosphoribosylamine-glycine ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific molecular function.
    action: ACCEPT
    reason: The exact Phosphoribosylamine--glycine ligase product assignment supports this activity.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Valid substrate binding, but not the core function of PurD.
    action: KEEP_AS_NON_CORE
    reason: ATP is consumed by the ligase reaction, while the enzyme-specific activity captures the core function.
- term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct pathway assignment.
    action: ACCEPT
    reason: This enzyme catalyzes a required reaction between PRPP and IMP.
- term:
    id: GO:0009113
    label: purine nucleobase biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Nucleobase-process annotation does not match the nucleotide product of this pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PRPP-to-IMP pathway produces a purine nucleotide, not a free purine
      nucleobase; GO:0009113 is therefore not a broader parent of GO:0006189.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Valid cofactor binding, but not the core function of PurD.
    action: KEEP_AS_NON_CORE
    reason: Metal binding supports catalysis, while the enzyme-specific activity captures the core function.
