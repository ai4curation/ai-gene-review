id: Q88KF5
gene_symbol: prpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PrpC is the citrate-synthase-family 2-methylcitrate synthase of Pseudomonas
  putida KT2440. It condenses propionyl-CoA with oxaloacetate to produce
  2-methylcitrate, committing propionate-derived carbon to the methylcitrate
  cycle. The protein may retain secondary citrate-synthase chemistry typical
  of the family, but its principal physiological role is distinct from the
  housekeeping TCA-cycle citrate synthase GltA.
