    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Module-boundary over-annotation; PrpC is not the canonical TCA citrate synthase step.
    action: MARK_AS_OVER_ANNOTATED
    reason: UniProt includes a TCA/citrate-synthase-family mapping, but the pathway-level review identifies prpC as K01659 2-methylcitrate synthase rather than the canonical TCA citrate synthase. GltA is the unambiguous TCA citrate synthase in KT2440, so PrpC should not be used to satisfy the core TCA citrate synthase step.
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__tca_cycle__ppu00020-deep-research-openscientist.md
      supporting_text: Reassign to methylcitrate cycle; NOT step 1
- term:
    id: GO:0036440
    label: citrate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Genuine but minor side activity of PrpC-type 2-methylcitrate synthases; not PrpC's core function in this organism.
    action: KEEP_AS_NON_CORE
    reason: PrpC belongs to the citrate synthase family, and the characterized E. coli PrpC ortholog retains citrate synthase activity as a minor component, so the activity is plausible for KT2440 PrpC rather than over-annotated. The organism-level pathway review nevertheless assigns PP_2335 to methylcitrate/propionate metabolism and identifies GltA as the canonical TCA citrate synthase, so the core activity for PrpC is 2-methylcitrate synthase and this term is kept as non-core.
    supported_by:
    - reference_id: PMID:9579066
