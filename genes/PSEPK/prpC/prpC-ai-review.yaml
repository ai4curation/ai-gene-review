    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Correct expected localization for a soluble bacterial citrate-synthase-family enzyme.
    action: ACCEPT
    reason: PrpC is a soluble central-carbon/organic-acid metabolic enzyme and is expected to act in the bacterial cytoplasm.
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Broad and potentially misleading process annotation for a propionate/methylcitrate-cycle enzyme; the right process is propionate catabolism.
    action: REMOVE
    reason: 'Re-review: the rejection stands. PrpC condenses propanoyl-CoA
      with oxaloacetate to form 2-methylcitrate in the 2-methylcitrate cycle of
      propionate catabolism (pathway report; CDD Ec2MCS_like classification), so the
      carbon handled is an organic acid, not a carbohydrate. GO:0005975 is a wrong-branch propagation from
      the citrate synthase node rather than a term that is merely too coarse, so
      MODIFY does not apply. The correct process, GO:0019543 propionate catabolic
      process, is asserted on its own IC row below, so no replacement term is
      proposed here.'
    supported_by:
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__methylcitrate_cycle__ppu00640-deep-research-openscientist.md
      supporting_text: '2. Condensation of propionyl-CoA + oxaloacetate → **(2S,3S)-2-methylcitrate** — PrpC (2-methylcitrate synthase).'
