id: Q88FM2
gene_symbol: mccA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: MccA is the biotin-carboxylase and biotin-carrier alpha subunit of bacterial 3-methylcrotonyl-CoA
  carboxylase. In the assembled MCC complex it uses ATP and bicarbonate to carboxylate its covalently
  attached biotin, enabling MccB to carboxylate 3-methylcrotonyl-CoA during distal L-leucine catabolism.
