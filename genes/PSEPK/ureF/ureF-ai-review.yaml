  - id: file:PSEPK/ureF/ureF-deep-research-openscientist.md
    title: OpenScientist research report for PSEPK UreF
    findings:
      - statement: The report found no support for UreF as the primary nickel-binding carrier.
        supporting_text: UreF is a nickel metallochaperone that itself binds/delivers nickel as the primary carrier — not supported;
        reference_section_type: DISCUSSION
      - statement: No direct experimental study of KT2440 UreF was identified.
        supporting_text: No study focuses on the *P. putida* KT2440 UreF protein specifically;
        reference_section_type: DISCUSSION
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Used as a retrieval and orthology synthesis aid. Mechanistic claims
        remain grounded in the cached primary UreF/UreG study.
core_functions:
