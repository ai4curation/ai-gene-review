id: Q88J01
gene_symbol: ureF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreF is a cytoplasmic urease-maturation factor that joins UreD-bound
  apo-urease, recruits UreG, and gates UreG nucleotide turnover so nickel is
  installed productively in the UreC active site rather than as a noncognate metal.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: UreF acts in the cytoplasmic urease activation complex.
      action: ACCEPT
      reason: The localization agrees with reviewed UniProt and conserved UreDFG biochemistry.
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Nickel binding is not the supported direct function of UreF.
      action: REMOVE
      reason: >-
        The target GOA row is a UniRule inference. Conserved-system evidence
        assigns nickel delivery to UreE and nickel handling to UreG, whereas
        UreF binds and gates UreG in the activation complex (PMID:22369361).
        Neither target-level nor family-level evidence supports direct nickel
        binding by UreF.
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: UreE functions as a metallochaperone that delivers Ni to a UreD-UreF-UreG complex bound to urease apoprotein, with UreG serving as a GTPase during enzyme activation.
        - reference_id: file:PSEPK/ureF/ureF-deep-research-openscientist.md
          supporting_text: UreF is a nickel metallochaperone that itself binds/delivers nickel as the primary carrier — not supported;
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: ISS
    original_reference_id: PMID:22369361
    qualifier: involved_in
    review:
      summary: UreF gates productive maturation of the urease responsible for urea catabolism.
      action: NEW
      reason: Conserved-complex mutagenesis links orthologous UreF function to mature urease activity; this is an orthology-based inference for Q88J01, not a direct KT2440 assay.
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: >-
            Further experiments with these complexes provided evidence that UreF
            gates the GTPase activity of UreG to enhance the fidelity of urease
            metallocenter assembly, especially in the presence of the noncognate metal Zn.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
  - id: PMID:22369361
    title: 'Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation.'
    findings:
      - statement: UreF gates UreG activity to improve fidelity of metallocenter assembly.
        supporting_text: >-
          Further experiments with these complexes provided evidence that UreF
          gates the GTPase activity of UreG to enhance the fidelity of urease
          metallocenter assembly, especially in the presence of the noncognate metal Zn.
  - id: file:PSEPK/ureF/ureF-uniprot.txt
    title: UniProtKB entry for PSEPK ureF (Q88J01)
