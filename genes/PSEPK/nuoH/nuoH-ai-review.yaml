  label: Pseudomonas putida KT2440
description: >-
  NuoH (PP_4125; NADH-quinone oxidoreductase subunit H, complex I subunit 1
  family, ND1/Nqo8 homologue) is a 335-residue, eight-transmembrane-helix
  subunit of the cytoplasmic-membrane, proton-pumping NADH:quinone
  oxidoreductase NDH-1 (respiratory complex I). By orthology to the
  structurally characterised Escherichia coli NuoH and Thermus thermophilus
  Nqo8, it anchors the peripheral arm to the membrane arm, frames the entry of
  the enclosed quinone-binding chamber (it may bind ubiquinone) and forms the
  first half-channel of the glutamate-rich E-channel proton pathway. It has no
  redox cofactor and contributes to the activity of the complex, which couples
  NADH-to-ubiquinone electron transfer with proton translocation, supplying
  proton-motive force for the aerobic respiration of this obligately aerobic
  bacterium.
