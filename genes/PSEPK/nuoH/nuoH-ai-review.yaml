taxon:
  id: NCBITaxon:PSEPK
  label: Psepk
description: 'Nuoh is the membrane-interface subunit adjacent to the quinone-reduction site of the proton-translocating respiratory complex I (NDH-1) in Pseudomonas putida KT2440. It is encoded in the single contiguous nuoA-N locus PP_4119-PP_4131. The assembled complex oxidizes NADH, reduces the quinone pool, and couples electron transfer to proton translocation across the bacterial plasma membrane.'
