id: Q88GA4
gene_symbol: galU
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GalU (PP_3821) is the predicted UTP:glucose-1-phosphate
  uridylyltransferase of Pseudomonas putida KT2440. It reversibly forms
  UDP-alpha-D-glucose and diphosphate from glucose 1-phosphate and UTP,
  supplying a nucleotide-sugar branch point used by multiple envelope and
  carbohydrate pathways. In the glgC-negative Pseudomonas alpha-glucan
  architecture, GalU is the leading candidate donor-supply enzyme for a
  UDP-glucose-dependent GlgA route, although that Q88GA4-to-Q88FN9 connection
  has not been directly tested in KT2440.
existing_annotations:
  - term:
      id: GO:0003983
      label: UTP:glucose-1-phosphate uridylyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This term exactly represents the predicted GalU reaction.
      action: ACCEPT
      reason: >-
        Q88GA4 carries EC 2.7.7.9/RHEA:19889, the bacterial GalU family
        signature, and the matching substrate-specific GO annotation.
      supported_by:
        - reference_id: file:PSEPK/galU/galU-uniprot.txt
          supporting_text: "DR   GO; GO:0003983; F:UTP:glucose-1-phosphate uridylyltransferase activity; IEA:UniProtKB-EC."
  - term:
      id: GO:0006011
      label: UDP-alpha-D-glucose metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: GalU directly forms and consumes UDP-alpha-D-glucose.
      action: ACCEPT
      reason: >-
        UDP-alpha-D-glucose is a direct product in the assigned reversible
        RHEA:19889 reaction. This process annotation does not restrict the
        metabolite to glycogen or any one downstream pathway.
      supported_by:
        - reference_id: file:PSEPK/galU/galU-uniprot.txt
          supporting_text: "Reaction=alpha-D-glucose 1-phosphate + UTP + H(+) = UDP-alpha-D-glucose"
