  qualifier: enables
  review:
    summary: >-
      This is the defining EC 2.7.7.9 activity and agrees with the UniProt
      name, family, and conserved nucleotidyltransferase architecture.
    action: ACCEPT
- term:
    id: GO:0006011
    label: UDP-alpha-D-glucose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      GalU directly produces UDP-alpha-D-glucose, so this process annotation
      appropriately captures its primary metabolic role.
    action: ACCEPT
