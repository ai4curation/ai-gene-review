id: Q88GA4
gene_symbol: galU
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  galU (PP_3821) encodes a bacterial UTP--glucose-1-phosphate
  uridylyltransferase that reversibly forms UDP-glucose and diphosphate from
  UTP and alpha-D-glucose 1-phosphate. UDP-glucose is an activated-sugar
  precursor used by multiple glycoconjugate and polysaccharide pathways.
