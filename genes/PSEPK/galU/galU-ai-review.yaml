  - id: PMID:33872310
    title: Trehalose and α-glucan mediate distinct abiotic stress responses in Pseudomonas aeruginosa.
    findings:
      - statement: >-
          In the homologous PAO1 system, GalU is present, glgC is absent, and
          purified GlgA preferentially uses UDP-glucose.
        supporting_text: "Although PAO1 also contains genes for the phosphoglucomutase PgmA and the UDP-glucose pyrophosphorylase GalU, the ADP-glucose phosphorylase gene glgC is not present."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verifies the Pseudomonas family architecture and downstream
        GlgA assay; it does not directly assay KT2440 Q88GA4.
core_functions:
  - description: >-
      Reversibly forms UDP-alpha-D-glucose from alpha-D-glucose 1-phosphate and
      UTP, supplying a nucleotide-sugar branch point for carbohydrate and
      envelope metabolism.
    molecular_function:
      id: GO:0003983
      label: UTP:glucose-1-phosphate uridylyltransferase activity
    directly_involved_in:
      - id: GO:0006011
        label: UDP-alpha-D-glucose metabolic process
    supported_by:
      - reference_id: file:PSEPK/galU/galU-uniprot.txt
        supporting_text: "Reaction=alpha-D-glucose 1-phosphate + UTP + H(+) = UDP-alpha-D-glucose"
    knowledge_gaps:
      - gap_statement: >-
          Direct flux from Q88GA4-produced UDP-glucose into Q88FN9-dependent
          alpha-glucan has not been demonstrated in KT2440.
        significance: >-
          This is the key organism-specific link selecting the Pseudomonas
          UDP-glucose synthesis variant over the canonical GlgC route.
proposed_new_terms: []
suggested_questions:
  - question: How much of the GalU-produced UDP-glucose pool is consumed by GlgA under glycogen/alpha-glucan-producing conditions?
suggested_experiments:
  - description: >-
      Combine galU depletion or conditional knockdown with nucleotide-sugar
      metabolomics, Q88FN9 donor assays, and alpha-glucan quantification to test
      the proposed GalU-to-GlgA connection.
