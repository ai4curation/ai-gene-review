existing_annotations:
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PhaC2 transfers non-amino-acyl hydroxyalkanoyl groups during polyester synthesis.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    supported_by:
    - reference_id: PMID:31468725
      supporting_text: These CoA monomers can then be polymerized into mcl‐PHAs via the PHA synthases,
        PhaC1 and PhaC2 (Ren et al., 2009)
    reason: The acyltransferase genus is sound; GO:0016747 is its supported non-amino-acyl descendant.
      Class II synthase signatures and KT2440 pathway evidence support this assignment, without treating
      another strain's purified enzyme or overexpression phenotype as a native target assay.
- term:
    id: GO:0042619
    label: poly-hydroxybutyrate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: PhaC2 participates in medium-chain-length PHA biosynthesis; a specifically PHB-restricted
      process is not established.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0042621
      label: poly(3-hydroxyalkanoate) biosynthetic process
    supported_by:
    - reference_id: PMID:31468725
      supporting_text: These CoA monomers can then be polymerized into mcl‐PHAs via the PHA synthases,
        PhaC1 and PhaC2 (Ren et al., 2009)
    reason: GO:0042619 specifies the C4 hydroxybutyrate polymer. Native KT2440 produces medium-chain-length
      PHA and encodes this class II synthase. Generalize to GO:0042621 to represent the supported polymer
      chemistry. This does not assert absolute inability to incorporate any C4 monomer under untested
      conditions.
