    - reference_id: PMID:20937103
      supporting_text: These granule-associated proteins include PHA polymerases (PhaC), PHA depolymerase
        (PhaZ) [9-11], phasins (PhaF and PhaI) [7,12,13] and acyl-CoA synthetase [14].
core_functions:
- description: Catalyzes polymerization of (R)-3-hydroxyacyl-CoA monomers into intracellular poly(3-hydroxyalkanoate)
    storage polyester (C6-C14 mcl-PHA). As a class II PhaC synthase it is inferred to be granule-associated,
    acting at the surface of cytoplasmic PHA storage granules. GO:0016747 is the most specific available
    molecular-function term pending a dedicated PHA synthase term.
  molecular_function:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  directly_involved_in:
  - id: GO:0042621
    label: poly(3-hydroxyalkanoate) biosynthetic process
  locations:
