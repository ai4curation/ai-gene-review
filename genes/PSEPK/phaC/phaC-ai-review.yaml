    id: GO:0070088
    label: polyhydroxyalkanoate granule
  evidence_type: ISS
  original_reference_id: PMID:20937103
  qualifier: located_in
  review:
    summary: Class II PhaC polymerases act as granule-associated enzymes in characterized Pseudomonas
      mcl-PHA systems.
    action: NEW
    reason: The historical ISS proposal is retained as an inference from the class II granule-associated
      polymerase role. PMID20937103 assays P. putida U, not isolated KT2440 PhaC2. Native KT2440 supplementary
