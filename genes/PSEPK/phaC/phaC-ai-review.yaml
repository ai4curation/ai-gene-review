    supporting_text: These CoA monomers can then be polymerized into mcl‐PHAs via the PHA synthases, PhaC1
      and PhaC2 (Ren et al., 2009)
  - reference_id: PMID:38608840
    supporting_text: although PhaI, PhaC, and PhaZ are all located on the PHA granule and involved in
      PHA metabolism
proposed_new_terms:
- proposed_name: poly(3-hydroxyalkanoate) synthase activity
  proposed_definition: Catalysis of the transfer and polymerization of 3-hydroxyacyl groups from (R)-3-hydroxyacyl-CoA
    to a growing poly(3-hydroxyalkanoate) chain, releasing coenzyme A.
  justification: GO already contains process terms for poly(3-hydroxyalkanoate) biosynthesis, but it lacks
    the corresponding catalytic molecular-function term. This forces PHA polymerases such as PhaC-II/PhaC2
    into the overly broad parent term acyltransferase activity.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: PMID:31468725
    supporting_text: These CoA monomers can then be polymerized into mcl‐PHAs via the PHA synthases, PhaC1
      and PhaC2 (Ren et al., 2009)
  - reference_id: file:PSEPK/phaC/phaC-deep-research-falcon.md
    supporting_text: PhaC polymerases (including PhaC2) use **(R)-3-hydroxyacyl-CoA** substrates to synthesize
      intracellular PHA polyesters. This reaction is the committed polymerization step converting the
      soluble monomer pool into stored polymer.
suggested_questions:
- question: How do PhaC1 and PhaC2 differ in native KT2440 substrate preference and quantitative contribution
    across carbon sources and growth phases?
suggested_experiments:
- hypothesis: PhaC-II contributes condition-specific polymerization activity that is masked in the wild-type
    dual-synthase background.
  description: Construct clean single-polymerase KT2440 strains and complementation series for phaC1 and
    phaC-II, then compare PHA yield and monomer composition across gluconate, fatty acids, and aromatic
    substrates.
  experiment_type: genetics and metabolite/polymer phenotyping
- hypothesis: KT2440 PhaC-II has a substrate range biased toward medium-chain R-3-hydroxyacyl-CoA substrates
    and may differ measurably from PhaC1 in chain-length preference.
  description: Purify KT2440 PhaC-II and measure polymerization activity against a panel of R-3-hydroxyacyl-CoA
    substrates spanning short- to medium-chain monomers.
  experiment_type: biochemical enzyme assay
- hypothesis: PhaC-II has a distinct role in granule nucleation or granule occupancy during nitrogen-limited
    PHA accumulation.
  description: Tag PhaC1 and PhaC-II separately and compare granule association by fluorescence microscopy
    or granule proteomics during PHA accumulation.
  experiment_type: cell biology and proteomics
