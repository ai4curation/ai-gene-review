  label: Pseudomonas putida KT2440
description: Class II poly(3-hydroxyalkanoate) synthase (PhaC-II/PhaC2) encoded in the phaC1-phaZ-phaC2-phaD locus of Pseudomonas putida KT2440. It polymerizes medium-chain-length (R)-3-hydroxyacyl-CoA substrates into intracellular PHA storage polyester and is one of two related synthases in the locus. Its relative contribution and substrate preferences compared with PhaC1 remain unresolved in native KT2440.
