id: Q88D23
gene_symbol: phaC
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for PhaC2, a class II poly(3-hydroxyalkanoate) synthase. Rank
  1 scores 19.32 with a 4.5-unit margin - the widest in the cohort - and is an exact GOA match, but
  it names the wrong polymer class: poly-hydroxybutyrate is the short-chain-length product of class
  I and III synthases, whereas this review identifies PhaC2 as a class II synthase making medium-chain-length
  PHA. The correct process is present at rank 3. The wide score margin here tracks confidence in the
  family, not correctness of the specific call. Assessment: 1 correct novel (COR), 1 less precise
  (LSP), 1 nonparalog incorrect (NPI).
