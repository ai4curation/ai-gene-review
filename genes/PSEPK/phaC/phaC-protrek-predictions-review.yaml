  predicted_term:
    id: GO:0042619
    label: poly-hydroxybutyrate biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 19.32), an exact GOA match with a 4.46-unit lead over rank 2. PHB biosynthesis
      is the scl-PHA branch performed by class I (Cupriavidus PhaC) and class III synthases; P. putida
      class II synthases polymerise C6-C14 (R)-3-hydroxyacyl-CoA into mcl-PHA and do not make PHB.
      Scored LSP rather than an error because the term is present in GOA for this entry and because
      a curator climbing to the shared PHA-biosynthesis parent recovers the right annotation - which
      ProTrek itself supplies at rank 3.
    supported_by:
