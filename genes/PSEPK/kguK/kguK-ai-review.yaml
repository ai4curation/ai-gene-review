taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Cytosolic 2-dehydrogluconokinase of the kgu pathway. It phosphorylates imported
  2-ketogluconate to 2-dehydro-6-phospho-D-gluconate before reduction to
  6-phosphogluconate. Broad PfkB/PANTHER membership alone is not an exact selector.
