description: >-
  CysK is a pyridoxal-5'-phosphate-dependent cysteine synthase A-family enzyme.
  It catalyzes sulfide incorporation into O-acetyl-L-serine to form L-cysteine
  and acetate in the terminal step of cysteine biosynthesis from serine.
