suggested_questions:
- question: >-
    Does KT2440 CysK supply most sulfide-dependent cysteine synthesis, and does
    it form a regulatory cysteine synthase complex with Q88PL0 CysE?
suggested_experiments:
- description: >-
    Measure Q88E95 kinetics with O-acetyl-L-serine and sulfide versus
    thiosulfate, then test binding to the Q88PL0 C-terminal peptide and compare
    sulfate-supported growth of cysK, cysM, and double mutants.
  experiment_type: enzyme kinetics, interaction assay, and genetic epistasis
