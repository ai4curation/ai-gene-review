taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ribA (PP_0522) of Pseudomonas putida KT2440 encodes a monofunctional GTP cyclohydrolase II
  (RibA), a soluble zinc-dependent enzyme that converts GTP to 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone
  5'-phosphate, formate and phosphate. This is the first step of the GTP-derived pyrimidine branch of
  riboflavin biosynthesis. It is the only KT2440 protein that retains the catalytic zinc-binding cysteines
  of the GTP cyclohydrolase II fold; the two RibBX-like DHBP synthases (ribAB-I, ribAB-II) carry only
  degenerate copies of this domain. Function is inferred from family membership with intact catalytic
  residues; no KT2440 enzymology is reported.
