    summary: Combined IEA (HAMAP MF_00179, InterPro RibA IPR000926, RHEA:23704, EC 3.5.4.25) for GTP cyclohydrolase
      II.
    action: ACCEPT
    reason: 'KT2440 ribA (PP_0522) is a 205-residue monofunctional RibA. It matches HAMAP MF_00179 and
      NCBIfam TIGR00505, and it retains the zinc-binding cysteine triad (Cys54, Cys65, Cys67) and the
      active-site residues annotated by the HAMAP rule. It is the only KT2440 protein with an intact GTP
      cyclohydrolase II active site: the C-terminal GTP cyclohydrolase II-like domains of ribAB-I and
      ribAB-II lack the zinc cysteines (see the ribAB-I bioinformatics check). No KT2440 enzyme assay
      exists; the activity is by family membership with intact catalytic residues.'
