  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: MutY is the adenine DNA glycosylase of the bacterial 8-oxoguanine defense system. It removes adenine from 8-oxoG:A mispairs, leaving the oxidized guanine for MutM-dependent repair; it does not itself excise 8-oxoG.
