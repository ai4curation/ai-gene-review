id: Q88EN2
gene_symbol: gabD-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  gabD-II (PP_4422) encodes a soluble aldehyde-dehydrogenase-family protein in
  a neighborhood compatible with ectoine catabolism. Candidate physiological
  roles include DoeC-like aspartate-4-semialdehyde oxidation and
  succinate-semialdehyde oxidation, but its substrate has not been
  experimentally resolved. It belongs to the GabD-type omega-semialdehyde
  dehydrogenase clade, retains the catalytic cysteine and glutamate, and is
  roughly equidistant in sequence from characterized succinate-,
  glutarate- and aspartate-semialdehyde dehydrogenases; its preferred
  cofactor (NAD+ or NADP+) is also unmeasured.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Still unresolved after the blinded OpenScientist control run. The run
      showed that Q88EN2 is a catalytically intact member of the GabD-type
      omega-semialdehyde dehydrogenase clade and argued that the NAD+ cofactor
      qualifier is over-specified, recommending GO:0009013. It did not test
      the DoeC (aspartate-4-semialdehyde dehydrogenase) alternative that the
      doe-like locus raises, and DoeC belongs to the same PANTHER subfamily, so
      the substrate, and with it any SSADH term, remains undecided.
    action: UNDECIDED
    reason: >-
      No direct Q88EN2 assay establishes either cofactor or substrate.
      Re-review against the OpenScientist control report: its decisive facts
      were checked. A BLOSUM62 global alignment gives Q88EN2 50.8% identity to
      NADP+-specific E. coli GabD (P25526; report 51.7%), 48.4% to human
      ALDH5A1 and 31.6% to E. coli Sad/YneI, so the GabD-clade placement and
      the rejection of the pseudo-enzyme and mis-placement modes stand. But the
      same alignment gives 52.2% to Halomonas elongata DoeC (E1V7V8) and 50.2%
      to KT2440 glutarate-semialdehyde dehydrogenase DavD (Q88RC0), neither of
      which was in the report's panel, so sequence identity cannot choose among
      succinate-, glutarate- and aspartate-semialdehyde. DoeC sits in the same
      PANTHER subfamily (UniProt E1V7V8 lists PTHR43353:SF5, as Q88EN2 does),
      so the TreeGrafter SSADH term is a subfamily-level label that does not
      discriminate these substrates. KEGG independently places PP_4422 between
      PP_4421 (K15785 L-2,4-diaminobutyrate transaminase, DoeD-type) and
      PP_4423 (K15784 N2-acetyl-L-2,4-diaminobutanoate deacetylase, DoeB-type),
      the gene arrangement of the ectoine-degrading doe locus. The cofactor
      argument is also not decisive: the report's NADP+ lean rests on a
      2'-pocket fingerprint, while UniProt records the characterized DoeC as
      NAD+-dependent (by curator inference). The report's MODIFY to GO:0009013
      would still assert succinate semialdehyde as substrate, so it is not
      adopted. The deciding experiment is a substrate and cofactor panel
      (L-aspartate-4-semialdehyde, succinate semialdehyde, glutarate
      semialdehyde; NAD+ and NADP+) on purified Q88EN2, plus growth of a
      PP_4422 deletion on ectoine versus GABA.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-hypotheses/function-hypothesis-go-0004777/openscientist.md
      supporting_text: "The recommended curation lead is to **retain the SSADH function but generalize or replace the cofactor**"
    - reference_id: file:PSEPK/gabD-II/gabD-II-hypotheses/function-hypothesis-go-0004777/openscientist.md
      supporting_text: "We did not find primary biochemical data for Q88EN2 itself, so the cofactor call remains a sequence-based lean rather than a measured fact, and we flag it as such."
    - reference_id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
      supporting_text: "Because PP_4422 is ~53% identical to all three, **sequence identity cannot by itself decide whether the substrate is succinate-, glutarate-, or aspartate-semialdehyde.**"
    - reference_id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
      supporting_text: "No direct enzymatic assay of the KT2440 PP_4422 protein exists in the literature; the DoeC assignment is therefore a strong bioinformatic inference built on diagnostic operon context and homology to characterized orthologs, rather than a demonstrated activity in this specific organism."
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The GABA-shunt assignment is a family-level prediction, while the local
      doe-like locus points toward ectoine catabolism.
    action: UNDECIDED
    reason: >-
      No KT2440 phenotype or direct enzyme assay ties Q88EN2 to GABA
      catabolism; the competing ectoine-catabolic interpretation must be
      resolved experimentally.
