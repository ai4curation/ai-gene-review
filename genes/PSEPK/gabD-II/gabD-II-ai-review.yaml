id: Q88EN2
gene_symbol: gabD-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  gabD-II encodes a predicted NAD(P)-linked succinate-semialdehyde
  dehydrogenase that oxidizes succinate semialdehyde to succinate. Electronic
  annotation links it to GABA catabolism, but its contribution relative to the
  other succinate-semialdehyde dehydrogenases in Pseudomonas putida KT2440 has
  not been experimentally resolved.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The succinate-semialdehyde substrate is supported, but the NAD-specific TreeGrafter qualifier conflicts with the NADP-specific submitted assignment.
    action: MODIFY
    reason: >-
      Both cofactor assignments are indirect: GO:0004777 is transferred from a
      PANTHER ancestral node, while GO:0036243 derives from an unreviewed
      submitted product/EC record. Replace both cofactor-specific alternatives
      with GO:0009013, which retains the shared substrate-specific activity.
    proposed_replacement_terms:
    - id: GO:0009013
      label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: Full=Succinate-semialdehyde dehydrogenase (NADP+)
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: GABA catabolism is a plausible TreeGrafter pathway prediction for a GabD-like
      enzyme, but no KT2440-specific physiological evidence is available here.
    action: UNDECIDED
    reason: The same succinate-semialdehyde reaction can serve GABA catabolism,
      4-hydroxybutyrate oxidation, or another aldehyde-producing route. Family context
      alone does not establish which pathway this paralog serves in vivo.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0009013 retains both the succinate-semialdehyde substrate and NAD(P)-acceptor uncertainty.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This mechanistic parent is compatible but loses the supported succinate-semialdehyde substrate specificity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88EN2 contains the conserved aldehyde-dehydrogenase domains. Structural
      work on E. coli GabD independently establishes NADP-linked SSADH chemistry,
      while the conflicting Q88EN2 electronic annotations prevent a
      cofactor-specific conclusion; GO:0009013 captures the supported common
      substrate-specific mechanism.
    additional_reference_ids:
    - PMID:20174634
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
    - reference_id: PMID:20174634
      supporting_text: >-
        In the E. coli SSADH structure, electron density for the complete NADP+
        cofactor in the binding sites is clearly evident
- term:
    id: GO:0036243
    label: succinate-semialdehyde dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The succinate-semialdehyde substrate is supported, but the NADP-specific qualifier is not resolved.
    action: MODIFY
    reason: >-
      The submitted NADP-specific product/EC conflicts with an NAD-specific
      TreeGrafter transfer. Replace it with GO:0009013, which retains
      succinate-semialdehyde specificity without choosing NAD or NADP.
    proposed_replacement_terms:
    - id: GO:0009013
      label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: Full=Succinate-semialdehyde dehydrogenase (NADP+)
