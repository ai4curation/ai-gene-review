- id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
  title: OpenScientist deep research for PSEPK gabD-II
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The doe-locus hypothesis is strongly corroborated by local gene-neighborhood
      metadata, but the report's literature links and quantitative homology claims
      have not been independently verified and no direct Q88EN2 assay was found.
      The immediate PP_4421-PP_4423 cluster is the strongest contextual evidence;
      the report's description of the broader region as one same-strand operon is
      not retained because the broader neighborhood contains strand changes.
  findings:
  - statement: >-
      The report identifies a competing DoeC-like aspartate-semialdehyde
      dehydrogenase hypothesis from the surrounding ectoine-catabolic locus.
    supporting_text: "No direct enzymatic assay of the KT2440 PP_4422 protein exists in the literature; the DoeC assignment is therefore a strong bioinformatic inference built on diagnostic operon context and homology to characterized orthologs, rather than a demonstrated activity in this specific organism."
- id: file:PSEPK/gabD-II/gabD-II-notes.md
  title: Manual evidence notes for gabD-II
  findings:
  - statement: The notes record unresolved cofactor and pathway assignments and non-exhaustive paralog enumeration.
core_functions:
- description: >-
    Predicted NAD(P)-linked aldehyde oxidation in a doe-like ectoine-catabolic
    locus; the physiological aldehyde substrate remains unresolved.
  molecular_function:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
    supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is PP_4422 the DoeC-like aspartate-4-semialdehyde dehydrogenase of ectoine
    catabolism, or does it instead act on succinate or another semialdehyde?
suggested_experiments:
- hypothesis: PP_4422 is a DoeC-like enzyme whose physiological substrate is L-aspartate-4-semialdehyde.
  description: >-
    Compare purified PP_4422 kinetics with L-aspartate-4-semialdehyde, succinate
    semialdehyde, and glutarate semialdehyde, then test a PP_4422 deletion for
    growth on ectoine, GABA, and 4-hydroxybutyrate.
