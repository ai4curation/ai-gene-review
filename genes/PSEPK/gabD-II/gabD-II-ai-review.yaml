id: Q88EN2
gene_symbol: gabD-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  gabD-II encodes a predicted NAD(P)-linked succinate-semialdehyde
  dehydrogenase that oxidizes succinate semialdehyde to succinate. Electronic
  annotation links it to GABA catabolism, but its contribution relative to the
  other succinate-semialdehyde dehydrogenases in Pseudomonas putida KT2440 has
  not been experimentally resolved.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The NAD-specific TreeGrafter prediction conflicts with the submitted
      NADP-dependent product name and EC 1.2.1.79 assignment.
    action: UNDECIDED
    reason: >-
      Both cofactor assignments are indirect: GO:0004777 is transferred from a
      PANTHER ancestral node, while GO:0036243 derives from an unreviewed
      submitted product/EC record. Without a cofactor-specific biochemical assay,
      the NAD call cannot be confidently removed or accepted.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: Full=Succinate-semialdehyde dehydrogenase (NADP+)
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: GABA catabolism is a plausible TreeGrafter pathway prediction for a GabD-like
      enzyme, but no KT2440-specific physiological evidence is available here.
    action: UNDECIDED
    reason: The same succinate-semialdehyde reaction can serve GABA catabolism,
      4-hydroxybutyrate oxidation, or another aldehyde-producing route. Family context
      alone does not establish which pathway this paralog serves in vivo.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0016620 retains the aldehyde-group and NAD(P)-acceptor mechanism without overstating cofactor preference.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: EC=1.2.1.79
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This is the cofactor-neutral working molecular function supported by the aldehyde-dehydrogenase family.
    action: ACCEPT
    reason: It captures aldehyde oxidation with NAD or NADP while the two cofactor-specific electronic annotations conflict.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: Full=Succinate-semialdehyde dehydrogenase (NADP+)
- term:
    id: GO:0036243
    label: succinate-semialdehyde dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: NADP-specific succinate-semialdehyde dehydrogenase activity is plausible but not resolved.
    action: UNDECIDED
    reason: The submitted NADP-specific product/EC conflicts with an NAD-specific TreeGrafter transfer; no biochemical cofactor assay was found.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: Full=Succinate-semialdehyde dehydrogenase (NADP+)
