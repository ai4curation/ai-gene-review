id: Q88EN2
gene_symbol: gabD-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  gabD-II (PP_4422) encodes a soluble aldehyde-dehydrogenase-family protein in
  a neighborhood compatible with ectoine catabolism. Candidate physiological
  roles include DoeC-like aspartate-4-semialdehyde oxidation and
  succinate-semialdehyde oxidation, but its substrate has not been
  experimentally resolved.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      The NAD-specific TreeGrafter assignment conflicts with the submitted
      NADP-specific annotation, and the doe-like locus challenges the shared
      succinate-semialdehyde substrate assignment itself.
    action: UNDECIDED
    reason: >-
      No direct Q88EN2 assay establishes either cofactor or substrate. Immediate
      gene-neighborhood context instead supports a DoeC-like ectoine-catabolic
      hypothesis, so neither the current term nor a cofactor-neutral SSADH
      replacement is justified confidently.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
      supporting_text: "No direct enzymatic assay of the KT2440 PP_4422 protein exists in the literature; the DoeC assignment is therefore a strong bioinformatic inference built on diagnostic operon context and homology to characterized orthologs, rather than a demonstrated activity in this specific organism."
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The GABA-shunt assignment is a family-level prediction, while the local
      doe-like locus points toward ectoine catabolism.
    action: UNDECIDED
    reason: >-
      No KT2440 phenotype or direct enzyme assay ties Q88EN2 to GABA
      catabolism; the competing ectoine-catabolic interpretation must be
      resolved experimentally.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root term is compatible but uninformative.
    action: MODIFY
    reason: >-
      The aldehyde-dehydrogenase domains support the more informative,
      substrate-neutral aldehyde dehydrogenase [NAD(P)+] activity term, but not
      a resolved physiological aldehyde.
    proposed_replacement_terms:
    - id: GO:0004030
      label: aldehyde dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Conserved aldehyde-dehydrogenase domains support this substrate-neutral
      molecular function despite disagreement over the physiological aldehyde.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88EN2 contains conserved aldehyde-dehydrogenase domains, so the broad
      enzyme-class annotation is compatible. It is subsumed by the more
      informative substrate-neutral GO:0004030 core function and does not
      resolve the physiological aldehyde.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
- term:
    id: GO:0036243
    label: succinate-semialdehyde dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      The submitted NADP-specific annotation is unreviewed, and the doe-like
      locus challenges the succinate-semialdehyde substrate assignment.
    action: UNDECIDED
    reason: >-
      No direct Q88EN2 assay establishes the annotated EC reaction. Retain the
      row as unresolved until comparative substrate kinetics or genetics
      distinguishes SSADH from DoeC-like activity.
    supported_by:
    - reference_id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
      supporting_text: "No direct enzymatic assay of the KT2440 PP_4422 protein exists in the literature; the DoeC assignment is therefore a strong bioinformatic inference built on diagnostic operon context and homology to characterized orthologs, rather than a demonstrated activity in this specific organism."
