- id: file:PSEPK/gabD-II/gabD-II-hypotheses/function-hypothesis-go-0004777/openscientist.md
  title: OpenScientist TreeGrafter stress test of GO:0004777 for Q88EN2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Blinded control run. Its GabD-clade placement, intact Cys/Glu catalytic
      pair and identity values were reproduced locally within about 1 point
      (see gabD-II-notes.md). Its comparison panel omitted DoeC and DavD, which
      are as close to Q88EN2 as GabD, and it was blinded to the doe-like gene
      neighbourhood, so its MODIFY-to-GO:0009013 recommendation was not
      adopted. Its literature citations (PMID:32966327, PMID:23500184 and
      others) are not cached here and were not used.
core_functions:
- description: >-
    Predicted NAD(P)-linked aldehyde oxidation in a doe-like ectoine-catabolic
    locus; the physiological aldehyde substrate remains unresolved.
  molecular_function:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: file:PSEPK/gabD-II/gabD-II-uniprot.txt
    supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
proposed_new_terms:
- proposed_name: L-aspartate-4-semialdehyde dehydrogenase (non-phosphorylating) activity
  proposed_definition: >-
    Catalysis of the reaction: L-aspartate 4-semialdehyde + NAD(P)+ + H2O =
    L-aspartate + NAD(P)H + 2 H+.
  justification: >-
    The DoeC step of ectoine catabolism oxidizes L-aspartate-4-semialdehyde to
    L-aspartate without phosphate (Rhea RHEA:45764, NAD+ form). GO has only the
    phosphorylating biosynthetic aspartate-semialdehyde dehydrogenase
    (GO:0004073, EC 1.2.1.11) and carries RHEA:45764 only as a narrowMatch of
    the generic GO:0004029 aldehyde dehydrogenase (NAD+) activity, so DoeC
    orthologs receive either a generic ALDH term or, by subfamily
    propagation, a succinate-semialdehyde dehydrogenase term. A specific term
    would let a DoeC assignment for PP_4422 be stated if an assay confirms it.
    It is not used as a core function here because the substrate of Q88EN2 is
    unresolved. The mapping predicate follows SKOS (as SSSOM does), with the
    proposed term as subject: "proposed skos:narrowMatch RHEA:45764" says the
    Rhea reaction, the NAD+ form only, is narrower than the NAD(P)+ term.
  proposed_parent:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  proposed_mappings:
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:45764
      label: L-aspartate 4-semialdehyde + NAD(+) + H2O = L-aspartate + NADH + 2 H(+)
  supported_by:
  - reference_id: file:PSEPK/gabD-II/gabD-II-deep-research-openscientist.md
    supporting_text: "diaminobutyrate transaminase (DoeD) and aspartate-semialdehyde dehydrogenase (DoeC)"
suggested_questions:
- question: >-
    Is PP_4422 the DoeC-like aspartate-4-semialdehyde dehydrogenase of ectoine
    catabolism, or does it instead act on succinate or another semialdehyde?
suggested_experiments:
- hypothesis: PP_4422 is a DoeC-like enzyme whose physiological substrate is L-aspartate-4-semialdehyde.
  description: >-
    Compare purified PP_4422 kinetics with L-aspartate-4-semialdehyde, succinate
    semialdehyde, and glutarate semialdehyde, then test a PP_4422 deletion for
    growth on ectoine, GABA, and 4-hydroxybutyrate.
