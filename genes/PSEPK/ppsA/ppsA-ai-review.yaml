id: Q88L53
gene_symbol: ppsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ppsA (PP_2082) of Pseudomonas putida KT2440 encodes phosphoenolpyruvate
  synthase (pyruvate, water dikinase), a Mg2+-dependent enzyme of the
  PEP-utilizing enzyme family. It converts pyruvate, ATP and water into
  phosphoenolpyruvate, AMP and phosphate. The reaction proceeds through a
  phosphohistidine intermediate carried on a swivelling mobile domain between
  the N-terminal ATP/AMP-binding (PPDK_N) domain and the C-terminal
  PEP/pyruvate-binding TIM-barrel domain. Because the reaction consumes two
  phosphoanhydride bonds, it is effectively irreversible and serves as the
  gluconeogenic route from pyruvate back to PEP. This lets KT2440 regenerate
  PEP and hexose phosphates when it grows on substrates that enter central
  metabolism at the level of pyruvate or the TCA cycle. The enzyme is soluble
  and cytoplasmic.
