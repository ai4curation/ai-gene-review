      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the phosphorylation of pyruvate to phosphoenolpyruvate.
    - reference_id: PMID:26350459
      supporting_text: the EMP (operating in a gluconeogenic fashion)
core_functions:
- description: >-
    Mg2+- and ATP-dependent phosphoenolpyruvate synthase that converts pyruvate
    to phosphoenolpyruvate through a swivelling phosphohistidine intermediate.
    It provides the gluconeogenic entry of pyruvate-level carbon into PEP in
    KT2440.
