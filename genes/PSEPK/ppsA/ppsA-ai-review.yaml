  review:
    summary: >-
      This is the defining activity of ppsA. The entry carries the PEP synthase
      signatures NCBIfam TIGR01418 and PIRSF000854, all three PEP-utilizing
      enzyme domains, and the PROSITE PEP-utilizing enzyme phosphohistidine
      site. PIRNR000854 assigns the RHEA:11364 reaction.
    action: ACCEPT
