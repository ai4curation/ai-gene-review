    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      ATP is the phosphoryl donor of PEP synthase. It binds in the N-terminal
      PPDK_N (AMP/ATP-binding, ATP-grasp-like) domain, which Pfam PF01326 maps
      to residues 17-346 of ppsA.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP binding is true and supported by the family domain architecture and
      the PIRNR reaction, but it is a co-substrate feature that serves the
      dikinase activity, so it is kept as non-core, as for the
      nucleotide-binding rows of pgk and glk.
