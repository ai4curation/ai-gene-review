  label: Pseudomonas putida KT2440
description: PpsA (PP_2082) is the phosphoenolpyruvate synthase (pyruvate, water dikinase) of Pseudomonas
  putida KT2440. It converts pyruvate, ATP and water to phosphoenolpyruvate, AMP and phosphate through
  a phosphohistidine on its mobile central domain, with an N-terminal ATP-binding domain and a C-terminal
  pyruvate-binding domain. PpsA regenerates phosphoenolpyruvate from pyruvate for gluconeogenesis and
  PEP-dependent biosynthesis when cells grow on substrates that enter metabolism at the level of pyruvate.
