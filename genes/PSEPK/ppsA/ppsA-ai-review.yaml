- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      PEP synthase converts pyruvate to PEP, the first committed step of
      gluconeogenesis from pyruvate-level substrates, and PIRNR000854 assigns
      it to the gluconeogenesis pathway. KT2440 runs its EMP enzymes
      gluconeogenically, so PEP made by ppsA feeds the reversible lower-trunk
      enzymes and the fbp-dependent route to hexose phosphates.
    action: ACCEPT
    reason: >-
      ppsA catalyzes a gluconeogenic step itself, the ATP-driven
      phosphorylation of pyruvate to PEP, so it participates in
      gluconeogenesis.
    supported_by:
