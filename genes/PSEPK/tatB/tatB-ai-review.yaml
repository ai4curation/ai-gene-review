      label: TAT protein transport complex
suggested_questions:
  - question: Does the PP_5016-PP_5018 system recognize a distinct Tat substrate set?
suggested_experiments:
  - description: >-
      Test Tat-signal precursor binding and export in tatB-I and tatB
      deletion strains using matched reporter substrates.
    experiment_type: Tat receptor specificity
