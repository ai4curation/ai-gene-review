  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: TatB organizes the receptor used in Tat-dependent folded-protein export.
    action: ACCEPT
    reason: This is the defining conserved biological process of TatB-family proteins.
    supported_by:
