id: Q88D12
gene_symbol: tatB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TatB is the TatB-family receptor component of the PP_5016-PP_5018
  twin-arginine translocation system in Pseudomonas putida KT2440. Together
  with TatC-II it directly participates in recognition and temporary
  accommodation of folded twin-arginine-signal substrates before TatA-II is
  recruited for translocation.
existing_annotations:
