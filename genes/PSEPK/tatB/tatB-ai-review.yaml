    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: TatB is a single-pass component of the bacterial inner-membrane Tat apparatus.
    action: ACCEPT
    reason: UniProt/HAMAP explicitly assigns Q88D12 to the cell inner membrane.
    supported_by:
      - reference_id: file:PSEPK/tatB/tatB-uniprot.txt
        supporting_text: Cell inner membrane
- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The assembled Tat translocon has protein transmembrane transporter activity.
    action: KEEP_AS_NON_CORE
    reason: The translocase-family assignment supports participation in transporter activity, but TatB's more informative conserved role is organization of the TatBC substrate receptor.
    supported_by:
      - reference_id: file:PSEPK/tatB/tatB-uniprot.txt
        supporting_text: TatB may form an oligomeric binding site that transiently accommodates folded Tat precursor proteins before their translocation.
