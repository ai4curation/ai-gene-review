  title: The type II secretion system (Xcp) of Pseudomonas putida is active and involved
    in the secretion of phosphatases.
  findings:
    - statement: >-
        Both complete P. putida Tat systems can support UxpB export, providing
        system-level evidence for the PP_5016-PP_5018 locus that contains tatB.
      supporting_text: Both Tat systems appeared to be capable of transporting the UxpB protein.
      reference_section_type: ABSTRACT
