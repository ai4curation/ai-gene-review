      Forms the TatB portion of the TatBC substrate receptor and couples signal
      recognition to TatA recruitment.
    supported_by:
      - reference_id: file:PSEPK/tatB/tatB-uniprot.txt
        supporting_text: Together with TatC, TatB is part of a receptor directly interacting with Tat signal peptides.
      - reference_id: PMID:23530902
        supporting_text: Both Tat systems appeared to be capable of transporting the UxpB protein.
