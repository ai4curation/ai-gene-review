  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GspE is the cytosolic ATPase of the type II secretion system. It associates
  with the inner-membrane platform and hydrolyzes ATP to power pseudopilus
  assembly and secretion of folded periplasmic substrates through the
  outer-membrane secretin.
