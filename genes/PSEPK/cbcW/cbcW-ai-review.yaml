        - {id: 'GO:0015871', label: choline transport}
        - {id: 'GO:0031460', label: glycine betaine transport}
      supported_by:
        - reference_id: file:PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
          supporting_text: "| GO:1902603 | carnitine transmembrane transport | no | no | yes |"
        - reference_id: file:PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
          supporting_text: "| GO:0015871 | choline transport | no | no | no |"
  - term: {id: 'GO:0015871', label: choline transport}
