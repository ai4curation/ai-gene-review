  - term: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002410106
    review:
      summary: CbcW contributes to but does not alone enable carnitine transport.
      action: REMOVE
      reason: >-
        Rejection confirmed on re-review as a qualifier correction. Carnitine
        selectivity is supplied by the CaiX substrate-binding protein and ATP
        coupling by CbcV; the CbcXWV core without CaiX transports choline and
        betaine but not carnitine, so the enables qualifier misattributes a
        complex-level, SBP-determined activity to the permease subunit. The
        term is retained below with contributes_to.
      supported_by:
      - reference_id: PMID:19919675
        supporting_text: 'CaiX, a carnitine-specific binding protein, is required for Cbc-mediated uptake of L-carnitine'
      source_defects:
        - defect_type: WRONG_QUALIFIER
          resource: GO_CENTRAL
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            TreeGrafter (PTN002410106) propagates the PAINT carnitine transporter
            activity of P. aeruginosa CbcW to this permease subunit with enables;
            the carnitine specificity belongs to the CaiX-containing complex.
