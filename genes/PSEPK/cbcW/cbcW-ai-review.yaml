id: Q88R39
gene_symbol: cbcW
product_type: PROTEIN
aliases:
  - PP_0295
status: COMPLETE
taxon: {id: 'NCBITaxon:160488', label: "Pseudomonas putida KT2440"}
description: >-
  cbcW (PP_0295) encodes the six-pass integral membrane permease subunit of the
  modular Cbc ABC importer of Pseudomonas putida KT2440. With the CbcV ATPase it
  forms the shared core that imports choline, glycine betaine or L-carnitine,
  according to which periplasmic binding protein (CbcX, BetX or CaiX) docks to
  it. CbcW provides the translocation pathway; it has no substrate specificity
  of its own.
existing_annotations:
  - term: {id: 'GO:0005275', label: amine transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002410106
    review:
      summary: >-
        Transport is right but the substrate class is wrong; GO does not place
        carnitine, glycine betaine or choline transport under amine transport.
      action: MODIFY
      reason: >-
        An OLS4 query of the GO hierarchy (cbcW-bioinformatics/RESULTS.md,
        hierarchicalAncestors, run 2026-11-04) shows that none of the Cbc
        substrate terms (GO:0015226, GO:1902603, GO:0015879, GO:0031460,
        GO:0015220), nor GO:0015418 or GO:0015651, sits under GO:0005275 or
        GO:0015837; carnitine and betaine transport sit under quaternary
        ammonium group transport (GO:0015697/GO:0015651). This is a lateral
        mis-placement rather than a true-but-broad ancestor, so the term is
        replaced by the correct sibling branch instead of being kept as
        non-core. The genes/human/SLC22A5 review keeps GO:0015837 on a carnitine
        transporter as correct but general; the difference from that precedent
        is deliberate and follows the OLS placement. This supersedes the
        batch-03 TreeGrafter re-review, which removed the row as a
        qualifier-only correction (PR #5954). The enables qualifier is also
        wrong for a permease subunit and is recorded as a source defect.
      proposed_replacement_terms:
        - {id: 'GO:0015418', label: ABC-type quaternary ammonium compound transporting activity}
      supported_by:
        - reference_id: file:PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
          supporting_text: "| GO:0015226 | carnitine transmembrane transporter activity | no | no | yes |"
        - reference_id: file:PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
          supporting_text: "| GO:0015418 | ABC-type quaternary ammonium compound transporting activity | no | no | yes |"
        - reference_id: PMID:19919675
          supporting_text: >-
            Quaternary ammonium compounds (QACs), including glycine betaine,
            choline and carnitine, are found in many microbial environments
      source_defects:
        - defect_type: WRONG_TERM
          resource: GO_CENTRAL
          slot: GO ID
          requested_change: REPOINT
          asserted_value: GO:0005275
          corrected_value: GO:0015418
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            PAINT places amine transmembrane transporter activity at
            PTN000766131, seeded by E. coli ProW and P. aeruginosa CbcW, whose
            substrates are quaternary ammonium compounds that GO classifies
            outside the amine branch; TreeGrafter propagates it here.
        - defect_type: WRONG_QUALIFIER
          resource: GO_CENTRAL
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            A permease subunit contributes to, but does not by itself enable,
            the transporter activity of the ABC importer.
  - term: {id: 'GO:0005886', label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
