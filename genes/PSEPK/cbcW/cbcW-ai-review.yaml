  - term: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002410106
    review:
      summary: >-
        Correct activity of the CaiX-CbcWV complex that CbcW belongs to; the
        enables qualifier should be contributes_to.
      action: ACCEPT
      reason: >-
        The carnitine transporter activity is the right term for the complex:
        CaiX supplies carnitine selectivity and CbcWV the translocation path.
        The row is kept and the qualifier error recorded as a source defect,
        the convention used for the CaiX (Q9HTH6) and CbcV rows and for the BenB
        subunit in genes/ACIAD/benB; the core function records CbcW with
        contributes_to. This supersedes the batch-03 TreeGrafter re-review,
        which removed the row as a qualifier correction (PR #5954).
      supported_by:
      - reference_id: PMID:19919675
        supporting_text: 'CaiX, a carnitine-specific binding protein, is required for Cbc-mediated uptake of L-carnitine'
      source_defects:
        - defect_type: WRONG_QUALIFIER
          resource: GO_CENTRAL
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            TreeGrafter (PTN002410106) propagates the PAINT carnitine transporter
            activity of P. aeruginosa CbcW to this permease subunit with enables;
            the activity belongs to the CaiX-containing complex.
  - term: {id: 'GO:0015837', label: amine transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    supporting_entities:
