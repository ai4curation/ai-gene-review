id: Q88R39
gene_symbol: cbcW
product_type: PROTEIN
aliases:
  - PP_0295
status: COMPLETE
taxon: {id: 'NCBITaxon:160488', label: "Pseudomonas putida KT2440"}
description: >-
  cbcW (PP_0295) encodes the six-pass integral membrane permease subunit of the
  modular Cbc ABC importer of Pseudomonas putida KT2440. With the CbcV ATPase it
  forms the shared core that imports choline, glycine betaine or L-carnitine,
  according to which periplasmic binding protein (CbcX, BetX or CaiX) docks to
  it. CbcW provides the translocation pathway; it has no substrate specificity
  of its own.
existing_annotations:
  - term: {id: 'GO:0005275', label: amine transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002410106
    review:
      summary: CbcW contributes the membrane path but does not transport alone.
      action: REMOVE
      reason: >-
        Rejection confirmed on re-review, as a qualifier correction rather than
        a denial of the chemistry. CbcW is the six-pass permease subunit only;
        translocation requires the CbcV ATPase for ATP coupling and a
        periplasmic substrate-binding protein (CbcX, BetX or CaiX) for
        substrate capture, so CbcW does not "enable" the transporter activity
        on its own. The Cbc substrates are quaternary ammonium compounds, so
        the subunit's contribution is recorded below with contributes_to on
        ABC-type quaternary ammonium compound transporting activity and on the
        carnitine term.
      supported_by:
      - reference_id: PMID:19919675
        supporting_text: >-
          In addition to the core transporter comprised of a transmembrane
          protein (CbcW) and an ATPase (CbcV), the Cbc transporter system
          interacts with at least three SBPs
      source_defects:
        - defect_type: WRONG_QUALIFIER
          resource: GO_CENTRAL
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            TreeGrafter (PTN002410106) propagates complex-level transporter
            activity to the permease subunit with enables; contributes_to is the
            relation for a single subunit of an ABC importer.
