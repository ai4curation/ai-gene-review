    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: fliI supports the function of the motility organelle through export of its structural
      components.
    action: KEEP_AS_NON_CORE
    reason: Retain the existing broad functional participation claim, while identifying export/assembly
      as the direct core work. Same-role E. coli and Salmonella FliH/FliJ proteins consistently
      carry this term, including E. coli NAS annotations from PMID31337100. Current GO:0071973
      describes flagellum-driven locomotion; it is not restricted to ATPase torque-generating
      subunits. The independent primary mechanism establishes export and bypass-mutant studies
      connect this machinery to motility, but do not establish a direct torque-generating
      activity. This acceptance does not create a new motility assertion or equate phenotype
      with the catalytic mechanism.
