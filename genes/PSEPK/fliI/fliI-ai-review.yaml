id: Q88ET7
gene_symbol: fliI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  FliI is the cytoplasmic ATPase of the flagellar type III export apparatus. It
  hydrolyzes ATP to support docking, unfolding, and delivery of flagellar substrates
  to the membrane export gate during flagellum assembly; it is not an ATP synthase.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: FliI is a P-loop ATPase and binds ATP as its catalytic substrate.
    action: KEEP_AS_NON_CORE
    reason: Correct but less informative than the catalytic activity annotation.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: FliI is a peripheral cytoplasmic ATPase recruited to the export apparatus.
    action: ACCEPT
    reason: Correct localization for the soluble catalytic component.
- term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: FliI couples ATP hydrolysis to handling of proteins exported by the flagellar apparatus.
    action: ACCEPT
    reason: This is the most specific supported molecular function for FliI.
- term:
    id: GO:0015986
    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: FliI consumes ATP during flagellar export and does not synthesize ATP from proton motive force.
    action: REMOVE
    reason: This erroneous inference confuses homology to rotary ATPases with FliI's export ATPase role.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP hydrolysis is the catalytic reaction performed by FliI.
    action: ACCEPT
    reason: Correct catalytic activity, retained alongside the more contextual protein-exporting ATPase term.
    supported_by:
    - reference_id: file:PSEPK/fliI/fliI-deep-research-openscientist.md
      supporting_text: The core catalytic activity is ATP hydrolysis (ATP + H₂O → ADP + Pᵢ).
- term:
    id: GO:0030254
    label: protein secretion by the type III secretion system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: FliI powers substrate handling in the flagellar type III export system.
    action: ACCEPT
    reason: Correct process assignment for the flagellar export ATPase.
- term:
    id: GO:0030257
    label: type III protein secretion system complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: FliI associates with the cytoplasmic face of the flagellar type III export apparatus.
    action: ACCEPT
    reason: Correct complex-level localization without assigning the whole apparatus activity to other subunits.
- term:
    id: GO:0044780
    label: bacterial-type flagellum assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: FliI-dependent export supports ordered flagellar assembly.
    action: ACCEPT
    reason: Core biological process for this dedicated export ATPase.
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: FliI hydrolyzes ATP for protein export and is not a proton-transporting ATP synthase.
    action: REMOVE
    reason: Phylogenetic transfer across homologous ATPase families produced a contradicted molecular-function assignment.
- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Functional flagellar export is required upstream for construction of a motile flagellum.
    action: KEEP_AS_NON_CORE
    reason: Correct downstream phenotype, but assembly/export is the more direct process.
