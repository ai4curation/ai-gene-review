taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FliI is the ATP-hydrolyzing subunit of the cytoplasmic flagellar type III export
  apparatus. FliH and FliJ organize its assembly and coupling to the membrane export gate.
  In Pseudomonas putida KT2440 these functions are inferred from its conserved flagellar export-family
  identity. The membrane gate normally uses proton motive force; the cytoplasmic ATPase machinery
  improves export efficiency, and bypass conditions can support export without FliHI. ATP-driven
  export without bulk proton motive force has also been reconstituted in Salmonella membrane
  vesicles.
