- term:
    id: GO:0006261
    label: DNA-templated DNA replication
  evidence_type: IC
  original_reference_id: PMID:21955458
  review:
    action: NEW
    summary: The psi accessory component contributes physical organization of the replicative clamp loader.
    reason: HolD contributes physical assembly and stabilization of the chi-containing clamp-loader accessory
      unit rather than merely being necessary for growth. The KT2440 clone-to-locus mapping and direct
      chi–psi complex characterization combine with characterized Pseudomonas clamp-loader reconstitution
      to support participation in DNA-templated DNA replication. The process uses parental DNA, matching
      GO:0006261 and the core function; RNA-templated replication is not the demonstrated context. Same-role
      loader accessory comparators support this annotation convention, not the experimental claim itself.
      This proposal was authored in PR6117 commit 47acac27a0 and is refined here under an explicit archived-proposal
      exception; it was inherited only by a later review-round snapshot, not from upstream GOA or main.
      No redundant ancestor proposal is retained, and no KT2440 knockout-essentiality, firing regulation
      or function of the untested upstream extension is asserted.
    supported_by:
    - reference_id: file:PSEPK/holC/holC-source-analysis/README.md
