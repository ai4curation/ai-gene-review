core_functions:
- description: Contributes the divergent psi accessory subunit to the chi–psi clamp-loader assembly, supporting
    efficient loading and replisome organization. The identity is grounded by the KT2440 expression insert;
    the loader mechanism is inferred from characterized Pseudomonas homologs, with the corrected native
    start distinguished from the longer database translation.
