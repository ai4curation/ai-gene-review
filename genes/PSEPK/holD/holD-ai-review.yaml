- id: file:PSEPK/holD/holD-uniprot.txt
  title: UniProt entry Q88Q02 for holD
  findings:
  - statement: The frozen sequence/accession identifies PP_0696. Its ProtNLM Energy transducer TonB label
      is a machine prediction contradicted by primary clone-to-sequence mapping and is not used as functional
      evidence.
  reference_review:
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q88Q02
      slot: SQ:SEQUENCE
      requested_change: CHECK
      asserted_value: SQ   SEQUENCE   291 AA;  31887 MW;  54C90E27531A85C2 CRC64;
      cause: SEQUENCE_MISMAPPING
      confidence: PROBABLE
      explanation: 'The frozen Q88Q02 model contains 291 residues. The literature-selected TTG initiation
        codon at AE015451.2 position 809524 predicts 261 residues, corresponding to database positions
        31–291 with initiator methionine replacing the internal leucine at position 31. Independently
        mapping the published KT2440 primers identifies a 260-residue GST-fusion insert at database positions
        32–291, excluding the native initiator; the fusion was cleaved during purification. Thus the reviewed
        functional construct excludes the upstream 30-residue extension. The upstream start-site correction
        is PROBABLE: the literature and construct-coordinate mapping support it, but there is no newly
        demonstrated native N-terminal sequence and not every possible alternative initiation product
        has been excluded. Review the annotated translation start against the published primers and genomic
        TTG; do not replace the native protein with the initiator-free expression insert.'
      supported_by:
      - &id001
        reference_id: file:PSEPK/holC/holC-source-analysis/README.md
        supporting_text: The primary expression insert begins at the second codon after the corrected
          TTG start at809524 and corresponds to current residues32–291 (260 native residues), expressed
          as a GST fusion and cleaved during purification.
suggested_questions:
