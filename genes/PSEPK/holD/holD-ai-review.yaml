  label: Pseudomonas putida KT2440
description: HolD is the divergent psi accessory subunit of the Pseudomonas putida KT2440 clamp-loader
  system, encoded at PP_0696. It forms a complex with HolC/chi and is inferred to connect and stabilize
  the accessory assembly on the DnaX-containing loader. Purified KT2440 chi–psi binds single-stranded
  DNA under low-salt conditions; experiments on homologous Pseudomonas complexes attribute this binding
  to the psi N-terminal region. The literature uses a corrected noncanonical start predicting a 261-residue
  native protein, whereas Q88Q02 retains an older 291-residue translation. The characterized fusion insert
  corresponds to database residues 32–291 and does not establish a function for the upstream extension.
