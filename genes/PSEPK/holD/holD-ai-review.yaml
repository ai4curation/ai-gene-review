  review:
    action: NEW
    summary: The divergent psi accessory subunit contributes to the multisubunit clamp loader.
    reason: "Primer mapping establishes PP_0696/Q88Q02 as the KT2440 holD locus used for chi\u2013psi\
      \ expression in PMID21955458. The original Pseudomonas psi discovery/reconstitution (PMID16210315)\
      \ assigns the chi\u2013psi accessory assembly to stimulation of the DnaX loader, and E. coli experiments\
      \ (PMID17210572) dissect psi-dependent stabilization. This is a conserved contribution to complex\
      \ activity, not complete clamp loading by isolated HolD. The full older291-residue translation was\
      \ not tested: the mapped insert covers residues32\u2013291 and the corrected native261-residue start\
      \ is documented. No seed MF exists and this proposal does not duplicate the separate ssDNA-binding\
      \ function."
