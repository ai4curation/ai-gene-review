      supporting_text: "P. putida (Ppu) \u03C7\u03C8, similarly to Pae\u03C7\u03C8, increased the sedimentation\
        \ coefficient of poly(dT), indicating ssDNA-binding"
- term: &id005
    id: GO:0006260
    label: DNA replication
  evidence_type: IC
  original_reference_id: PMID:21955458
  review:
    action: NEW
    summary: The psi accessory component contributes physical organization of the replicative clamp loader.
    reason: "HolD participates by assembling and stabilizing the chi-containing loader accessory unit,\
      \ rather than merely being required for growth or being a substrate. The KT2440 clone-to-locus mapping\
      \ and direct chi\u2013psi complex characterization combine with Pseudomonas loader reconstitution\
      \ to support that role. Current GO0006260 concerns duplication of DNA and its parents are nucleic-acid\
      \ metabolic processes; this physical replisome component executes work in that process. Same-role\
      \ accessory/structural loader comparators E. coli HolA/P28630, HolB/P28631 and HolC/P28905 each\
      \ carry replication annotations in current QuickGO; this is a convention check, not biological evidence.\
      \ No existing BP row or redundant BP ancestor/descendant is proposed, and Q88Q02 has no cached GO-CAM\
      \ entry. No KT2440 knockout-essentiality, chromosome-firing regulation or activity of the untested\
      \ N-terminal extension is asserted."
    supported_by:
    - *id001
    - *id002
    - *id003
core_functions:
- description: "Contributes the divergent psi accessory subunit to the chi\u2013psi clamp-loader assembly,\
    \ supporting efficient loading and replisome organization. The identity is grounded by the KT2440\
    \ expression insert; the loader mechanism is inferred from characterized Pseudomonas homologs, with\
    \ the corrected native start distinguished from the longer database translation."
