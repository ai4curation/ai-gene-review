    label: single-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:21955458
  qualifier: contributes_to
  review:
    action: NEW
    summary: "The KT2440 chi\u2013psi complex binds ssDNA in vitro, with psi assigned the DNA-engaging\
      \ contribution."
    reason: Sedimentation experiments directly show ssDNA binding by the purified KT2440 complex under
      low-salt conditions. Chimeric and N-terminal truncation experiments in the homologous P. aeruginosa
      system assign direct DNA engagement to psi. The contributes_to qualifier preserves the complex-level
      nature of the KT2440 measurement; isolated Q88Q02 was not assayed. Identity maps to the corrected-start
      expression construct, not the old upstream extension. The native significance and affinity at physiological
      ionic strength remain unresolved, so this capability is not presented as a separate established
      core role. It is not a duplicate of the ATP-driven clamp-loader contribution.
