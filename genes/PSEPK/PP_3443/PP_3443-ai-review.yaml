  label: Pseudomonas putida KT2440
description: PP_3443 encodes an aldehyde dehydrogenase-superfamily enzyme submitted as glyceraldehyde-3-phosphate dehydrogenase [NAD(P)+] (phosphorylating), EC 1.2.1.59. The sequence is distinct from canonical type I GAPDH and carries the aldehyde dehydrogenase fold and active-site cysteine signature; its domain classification matches the NADP-dependent non-phosphorylating GAPDH (ALDH family 11) subgroup, so it is best described as an NAD(P)+-dependent aldehyde dehydrogenase whose physiological substrate, and whether it acts on glyceraldehyde 3-phosphate with or without phosphorylation, is unresolved.
