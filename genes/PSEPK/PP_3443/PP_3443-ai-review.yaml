      supporting_text: "DR   PROSITE; PS00070; ALDEHYDE_DEHYDR_CYS; 1."
    - reference_id: file:PSEPK/PP_3443/PP_3443-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: "DR   CDD; cd07082; ALDH_F11_NP-GAPDH; 1."
- term:
    id: GO:0043891
    label: glyceraldehyde-3-phosphate dehydrogenase [NAD(P)+] (phosphorylating) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The phosphorylating GAPDH activity rests on the submitter-imported name and EC 1.2.1.59; the record's own domain classification points to a non-phosphorylating ALDH-family enzyme.
    action: MODIFY
    reason: This row is an EC-mapping of EC 1.2.1.59, whose only source in the record is the
      submitter-imported name (ECO:0000313). PP_3443 has the aldehyde dehydrogenase fold and
      active-site cysteine signature rather than the canonical type I GAPDH fold, and its CDD and
      FunFam matches are to the ALDH family 11 non-phosphorylating, NADP-dependent GAPDH subgroup.
      The essence (an NAD(P)+-dependent aldehyde oxidoreductase) is sound, so MODIFY to GO:0016620,
      which the gene already carries and uses as its core function; whether it acts on
      glyceraldehyde 3-phosphate, with or without phosphorylation, is unresolved.
    proposed_replacement_terms:
    - id: GO:0016620
      label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
    supported_by:
    - reference_id: file:PSEPK/PP_3443/PP_3443-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00171; Aldedh; 1."
    - reference_id: file:PSEPK/PP_3443/PP_3443-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: "DR   PROSITE; PS00070; ALDEHYDE_DEHYDR_CYS; 1."
    - reference_id: file:PSEPK/PP_3443/PP_3443-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: "DR   CDD; cd07082; ALDH_F11_NP-GAPDH; 1."
