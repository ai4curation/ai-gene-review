  qualifier: enables
  review:
    summary: oxidoreductase activity is a broad parent or generic domain-derived term that adds little beyond the specific catalytic annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The annotation is not necessarily false, but it is less informative than the specific molecular function already present.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: NAD(P)+-dependent aldehyde oxidoreductase activity is as specific as the evidence for PP_3443 allows, and is the core function.
    action: ACCEPT
    reason: The record places PP_3443 in the aldehyde dehydrogenase superfamily (Pfam Aldedh, with the
      ALDH active-site cysteine PROSITE signature) and in the CDD ALDH family 11 non-phosphorylating
      GAPDH subgroup, which supports an NAD(P)+-dependent aldehyde oxidoreductase. The more specific
      phosphorylating GAPDH term rests only on the submitter-imported name and EC number, and the
      physiological substrate has not been assayed, so this parent term is the most specific one
      supported. The support is family-level, not a KT2440 assay.
    supported_by:
