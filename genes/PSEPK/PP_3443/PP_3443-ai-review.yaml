core_functions:
- description: >-
    NAD(P)+-dependent aldehyde dehydrogenase of the ALDH superfamily. The
    phosphorylating GAPDH name and EC 1.2.1.59 are submitter-imported
    (ECO:0000313) and not supported by the record's own classification: the
    Pfam Aldedh domain and ALDH active-site cysteine signature place it in the
    aldehyde dehydrogenase fold, not the type I GAPDH fold, and the CDD
    cd07082 and FunFam matches point to the NADP-dependent non-phosphorylating
    GAPDH (ALDH family 11) subgroup. The core function is therefore stated at
    the aldehyde-dehydrogenase level; the substrate is unresolved.
  supported_by:
