- id: PMID:2129540
  title: FlgB, FlgC, FlgF and FlgG. A family of structurally related proteins in the flagellar
    basal body of Salmonella typhimurium.
  findings:
  - supporting_text: FlgG is known to lie within the distal portion of the rod, in the region
      where it is surrounded by the L and P rings, just before the rod-hook junction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract directly establishes the conserved distal-rod role in Salmonella;
      transfer to Q88ER8 is orthology-based.
- id: PMID:2181149
  title: Stoichiometric analysis of the flagellar hook-(basal-body) complex of Salmonella typhimurium.
  findings:
  - supporting_text: The distal rod protein (FlgG) is present at approximately 26 subunits
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract supports the polymeric structural role; KT2440 stoichiometry is not
      directly measured.
- id: file:PSEPK/flgG/flgG-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK flgG
  findings:
  - statement: The report supports the FlgG subtype assignment and identifies the absence of
      direct KT2440 structural or mutational evidence.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: On-target provider report; useful for FlgG distal-rod family synthesis and
      for documenting that direct KT2440 structural or mutational evidence was not found.
- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports
      the homologous role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
      FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC
      or FljB) and the filament cap (FliD)'
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  findings:
  - statement: KT2440 FliC S267C background distinguishes fluid swimming and semisolid spreading;
      these are not automatically flagellum-dependent surface swarming.
    supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and
      is lophotrichously flagellated, having multiple flagella at one cell pole (17).
- id: PMID:33931760
  title: Molecular structure of the intact bacterial flagellar basal body.
  findings:
  - statement: Salmonella basal-body structure resolves the FlgG distal rod; this supports the
      homologous KT2440 assignment, not a target subunit count.
    supporting_text: The proximal rod is composed of four different proteins, FliE, FlgB, FlgC
      and FlgF, while the distal rod is composed of multiple copies of just one protein, FlgG
