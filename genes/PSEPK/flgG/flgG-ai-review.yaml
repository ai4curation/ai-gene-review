taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FlgG is the structural subunit of the distal flagellar rod. Its polymer forms the
  periplasm-spanning segment of the basal body that connects the proximal rod to the hook; it
  has no independent motor activity.
