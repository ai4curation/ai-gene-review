id: Q88C55
gene_symbol: PP_5328
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PstC-like permease subunit of the Pho-linked PP_5326-PP_5329 high-affinity
  phosphate-import locus. PP_5328 is predicted to partner with PP_5327 in the
  membrane-spanning pathway of the PstSACB transporter and contributes to the
  collective phosphate transporter activity.
