      supporting_text: The stator complex is composed of two integral membrane proteins, PomA and PomB, for the sodium-driven motor and MotA and MotB for the proton-driven motor.
- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Chemotaxis is too broad and mechanistically indirect for MotA. MotA powers flagellar motor rotation, which can support taxis behavior, but it is not a chemotaxis signaling protein. Falcon deep research is explicit that directional switching (and hence chemotactic responses) is not executed by MotA itself but by chemotaxis signaling proteins; MotA only supplies torque at the rotor-stator interface.
    action: MARK_AS_OVER_ANNOTATED
    reason: The claim that MotA takes part in chemotaxis exceeds what the protein does. MotA supplies torque for rotation in both directions; the chemotactic step (CheY-P-driven switching of the C ring) is performed by the chemotaxis proteins and the C-ring switch (FliG/FliM/FliN), not by the stator. Loss of MotAB in KT2440 impairs swimming itself, which is a motility defect rather than evidence of participation in chemotactic signaling. The direct stator roles are captured by flagellum-dependent cell motility and proton transmembrane transport.
    supported_by:
    - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
      supporting_text: Direction switching is not executed by MotA itself but by chemotaxis signaling that reorients the rotor interface MotA engages
- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: MotA is the A subunit of the MotAB stator that powers flagellar rotation. In KT2440 the MotAB stator is required for efficient swimming in liquid; no swarming phenotype of motA has been described.
    action: MARK_AS_OVER_ANNOTATED
    reason: The swarming claim exceeds what is known for KT2440. The KT2440 stator study states (citing earlier work) that P. putida does not swarm in a flagella-dependent manner; the motility documented for the MotAB stator is swimming in liquid. The general motility process is captured by the NEW GO:0071973 row (IMP). This matches the treatment of the same swarming term on the KT2440 FliM and MotC (PP_4336) reviews.
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and is lophotrichously flagellated, having multiple flagella at one cell pole (17).
    - reference_id: PMID:36409076
      supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote swimming motility, so the movement of ΔmotAB mutant cells in aqueous fluids is strongly impaired.
- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:36409076
  review:
    summary: MotA should be annotated to bacterial-type flagellum-dependent cell motility, the process the MotAB stator directly powers.
    action: NEW
    reason: In KT2440, deletion of motAB (PP4905-PP4904) strongly impairs swimming in liquid, and the MotAB stator generates the torque that rotates the flagellum. Swarming is too specific without gene-specific support. The deletion removes both stator genes, so the same IMP applies to MotB.
    supported_by:
