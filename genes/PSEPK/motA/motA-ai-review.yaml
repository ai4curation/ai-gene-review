  findings:
  - supporting_text: KT2440 literature explicitly identifies **motA (PP4905)** and **motB (PP4904)** as stator genes outside the main flagellar cluster
  - supporting_text: MotA is required for **stator-dependent torque generation** that powers **flagellar rotation** (swimming motility).
  - supporting_text: MotA forms the **A-subunit ring** of the stator complex and provides the **cytoplasmic interface to the rotor** (FliG) that converts ion-driven conformational changes into rotor torque.
  - supporting_text: MotA is an **inner-membrane** protein with **multiple transmembrane helices** and large **cytoplasmic helices/domains** that contact the rotor
  - supporting_text: an ion-driven torque-generating complex that powers flagellar rotation rather than flagellar assembly itself
  - supporting_text: Direction switching is not executed by MotA itself but by chemotaxis signaling that reorients the rotor interface MotA engages
core_functions:
- description: >-
    MotA is the A subunit of the MotAB proton-driven flagellar stator. In the inner membrane, it
    contributes to proton translocation by the stator complex, coupling proton motive force to
    torque generation and bacterial-type flagellum-dependent cell motility. KT2440 genetics
    establishes the stator-pair motility role; proton specificity is inferred from homologous
    Pseudomonas stators and conserved architecture, not from direct ion-selectivity measurements
    on this KT2440 complex.
