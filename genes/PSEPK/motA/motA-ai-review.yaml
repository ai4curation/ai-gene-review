    review_notes: Full cached paper read. Gradient response is measured directly at cell/run-mode level,
      not a knockout assay of this stator. Combine with PMID36409076 without presenting the two studies
      as one experiment.
core_functions:
- description: MotA is the A subunit of the MotAB proton-driven flagellar stator. In the inner membrane,
    it contributes to proton translocation by the stator complex, coupling proton motive force to torque
    generation and bacterial-type flagellum-dependent cell motility. KT2440 genetics establishes the stator-pair
    motility role; proton specificity is inferred from homologous Pseudomonas stators and conserved architecture,
    not from direct ion-selectivity measurements on this KT2440 complex.
