- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: MotAB torque contributes to the execution of gradient-guided flagellar movement.
    action: KEEP_AS_NON_CORE
    reason: 'Chemotaxis requires movement guided by a chemical concentration gradient, not just swimming.
      Native KT2440 gradient experiments identify chemotactic run-time bias in wrapped-mode runs (PMID32766440);
      independent KT2440 stator experiments connect MotAB loss to impaired wrapped-mode formation and
      altered motor bias (PMID36409076). Together these support an inferred mechanical-effector contribution:
      MotA supplies torque during the motor execution of the response, rather than merely being required
      to build a motor. Retain as a non-core physiological context of torque generation. This is not a
      claim that MotA senses gradients, nor that a MotA-specific gradient perturbation was performed.'
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote swimming motility,
        so the movement of ΔmotAB mutant cells in aqueous fluids is strongly impaired.
    - reference_id: PMID:32766440
      supporting_text: there is a significant run-time bias in the wrapped mode
    - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
      supporting_text: Direction switching is not executed by MotA itself but by chemotaxis signaling
        that reorients the rotor interface MotA engages
  qualifier: involved_in
