description: motA encodes the A subunit of the MotAB flagellar stator in P. putida KT2440. MotA is an inner-membrane component of the proton-coupled stator module that converts proton motive force into torque for bacterial-type flagellum-dependent motility.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This location annotation is appropriate. MotA is an inner-membrane stator component of the flagellar motor.
    action: ACCEPT
    reason: >-
      Retain plasma membrane as the GO cellular-component location, while the
      stator complex is captured in the synthesized core function. Two
      independent lines agree: Phobius predicts four helical transmembrane
      segments (31..48, 69..85, 171..190, 202..220; two are quoted), and the
      protein is classified in the MotA stator family (NCBIfam TIGR03818
      MotA1, Pfam PF01618 MotA_ExbB), whose members are described in a cached
      review as integral membrane stator proteins of proton-driven flagellar
      motors. That review is about MotA in general (E. coli, Salmonella,
      Vibrio PomA), not the KT2440 protein. The UniProt SUBCELLULAR LOCATION
      and SIMILARITY lines rest only on ARBA rules and are not cited.
    supported_by:
