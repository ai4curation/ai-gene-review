- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:36409076
  review:
    summary: MotA should be annotated to bacterial-type flagellum-dependent cell motility, the process
      the MotAB stator directly powers.
    action: NEW
    reason: In KT2440, deletion of motAB (PP4905-PP4904) strongly impairs swimming in liquid, and the
      MotAB stator generates the torque that rotates the flagellum. Swarming is too specific without gene-specific
      support. The deletion removes both stator genes, so the same IMP applies to MotB. Assays used KT2440
      FliC S267C (reported motility-neutral), not an isolated MotA or MotB protein. MotAB and MotCD have
      condition-dependent effects; MotAB is not universally required for flagellar assembly or every mode
      of motility.
    supported_by:
