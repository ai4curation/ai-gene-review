suggested_questions:
- question: Under which growth or viscosity conditions does KT2440 preferentially use the MotAB stator containing MotA rather than alternative stator systems?
suggested_experiments:
- hypothesis: MotA is required for proton-driven MotAB stator function and contributes to swimming under a subset of motility conditions.
  description: Construct motA, motB, and alternative-stator mutants with chromosomal complementation, then quantify swimming, torque proxies, and stator localization across viscosity and ion-motive-force perturbations.
  experiment_type: targeted genetics and motor physiology
