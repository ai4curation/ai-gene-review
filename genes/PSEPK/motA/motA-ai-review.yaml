- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida
  findings:
  - statement: In KT2440, the MotAB stator (PP4905-PP4904) is crucial for swimming in liquid; a motAB
      deletion is strongly impaired in aqueous swimming but spreads almost like wild type in soft agar,
      where MotCD is recruited.
    supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote swimming motility,
      so the movement of ΔmotAB mutant cells in aqueous fluids is strongly impaired.
  - statement: KT2440 FliC S267C background distinguishes fluid swimming and semisolid spreading; these
      are not automatically flagellum-dependent surface swarming.
    supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and is lophotrichously
      flagellated, having multiple flagella at one cell pole (17).
  - statement: The strain called wild type carries FliC S267C, reported not to affect motility. Pair deletion
      establishes a conditional native MotAB requirement in fluids.
    supporting_text: We used the strain P. putida KT2440 FliCS267C.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the KT2440-specific genetic study of both stators.
- id: PMID:35572622
  title: The Periplasmic Domain of the Ion-Conducting Stator of Bacterial Flagella Regulates Force Generation.
  findings:
  - statement: Review of bacterial flagellar stator structure, ion conductance, and MotA/MotB composition.
- id: file:PSEPK/motA/motA-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for PSEPK motA (Q88DC2/PP_4905)
  findings:
  - supporting_text: KT2440 literature explicitly identifies **motA (PP4905)** and **motB (PP4904)** as
      stator genes outside the main flagellar cluster
  - supporting_text: MotA is required for **stator-dependent torque generation** that powers **flagellar
      rotation** (swimming motility).
  - supporting_text: MotA forms the **A-subunit ring** of the stator complex and provides the **cytoplasmic
      interface to the rotor** (FliG) that converts ion-driven conformational changes into rotor torque.
  - supporting_text: MotA is an **inner-membrane** protein with **multiple transmembrane helices** and
      large **cytoplasmic helices/domains** that contact the rotor
  - supporting_text: an ion-driven torque-generating complex that powers flagellar rotation rather than
      flagellar assembly itself
  - supporting_text: Direction switching is not executed by MotA itself but by chemotaxis signaling that
      reorients the rotor interface MotA engages
- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Modern structures establish 5 A:2 B stator assemblies in several bacteria; this updates
      the old 4:2 model but is not a KT2440 stoichiometry measurement.
    supporting_text: the stoichiometry of MotA:MotB is 5:2
- id: PMID:32766440
  title: Chemotaxis strategies of bacteria with multiple run modes.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Native KT2440 chemical-gradient experiments identify run-time bias in the wrapped swimming
      mode. This provides movement context; stator-specific participation is inferred jointly with the
      independent stator study.
    supporting_text: there is a significant run-time bias in the wrapped mode
  reference_review:
