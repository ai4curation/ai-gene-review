  label: Pseudomonas putida KT2440
description: caiX (PP_0304) encodes the periplasmic L-carnitine-binding protein of the Pseudomonas
  putida KT2440 Cbc ABC importer. By orthology with characterized P. aeruginosa and P. syringae CaiX,
  it carries a signal peptide and an OpuAC-type substrate-binding domain, binds L-carnitine, and
  docks to the shared CbcWV permease-ATPase core to confer carnitine specificity on uptake. The gene
  lies in the carnitine catabolic locus beside lcdH and the CdhB- and CdhC-type enzymes; The substrate
  assignment is inferred from characterized orthologs; a direct KT2440 CaiX assay was not identified.
