    summary: Carnitine transport is the specific process mediated by CaiX with CbcWV.
    action: NEW
    reason: CaiX supplies the substrate-recognition step of transport together with CbcWV, rather
      than merely being required for growth. The characterized Pseudomonas systems in PMID:19919675
