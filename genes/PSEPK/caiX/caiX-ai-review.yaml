id: Q88R30
gene_symbol: caiX
product_type: PROTEIN
status: DRAFT
taxon: {id: 'NCBITaxon:160488', label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: >-
  CaiX is the periplasmic L-carnitine-binding component that supplies substrate
  specificity to the shared CbcWV ABC importer during carnitine uptake.
existing_annotations:
  - term: {id: 'GO:0015871', label: choline transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CaiX is carnitine-selective rather than the choline-selective CbcX protein.
      action: REMOVE
      reason: Orthologous CaiX is required for carnitine uptake, whereas CbcX supplies choline recognition.
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'CaiX, a carnitine-specific binding protein, is required for Cbc-mediated uptake of L-carnitine'}
  - term: {id: 'GO:0022857', label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review: {summary: CaiX is a soluble binding component and does not span the membrane., action: REMOVE, reason: It contributes substrate recognition to the CbcWV transporter complex.}
  - term: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: contributes_to
    review:
      summary: CaiX contributes carnitine recognition to the CbcWV importer.
      action: NEW
      reason: Pseudomonas CaiX is experimentally required for Cbc-mediated carnitine uptake.
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'CaiX-mediated carnitine uptake'}
        - reference_id: file:PSEPK/caiX/caiX-deep-research-openscientist.md
          supporting_text: caiX sits in a carnitine-catabolic gene cluster
  - term: {id: 'GO:0033265', label: choline binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family mapping assigns the CbcX substrate to carnitine-selective CaiX.
      action: MODIFY
      reason: >-
        Experimental ortholog evidence identifies CaiX as carnitine-specific,
        not choline-specific. Monocarboxylic-acid binding remains a valid broad
        molecular function until GO provides an L-carnitine-binding term.
      proposed_replacement_terms:
        - {id: 'GO:0033293', label: monocarboxylic acid binding}
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'carnitine-specific SBP CaiX'}
  - term: {id: 'GO:0042597', label: periplasmic space}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review: {summary: CaiX acts as a periplasmic substrate-binding protein., action: ACCEPT, reason: Its signal peptide and role in a Gram-negative ABC importer support this location.}
  - term: {id: 'GO:0043190', label: 'ATP-binding cassette (ABC) transporter complex'}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: CaiX is an interchangeable substrate-binding component of the Cbc importer.
      action: ACCEPT
      reason: It associates with the CbcWV core when carnitine is transported.
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'The core transporter CbcWV also interacts with the carnitine-specific SBP CaiX'}
  - term: {id: 'GO:0055085', label: transmembrane transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review: {summary: Correct broad process but less informative than carnitine transport., action: KEEP_AS_NON_CORE, reason: CaiX participates in transport as the substrate-recognition component.}
  - term: {id: 'GO:1902603', label: carnitine transmembrane transport}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: involved_in
    review:
      summary: Carnitine transport is the specific process mediated by CaiX with CbcWV.
      action: NEW
      reason: Direct Pseudomonas genetic and uptake evidence supports this role.
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'CaiX-mediated carnitine uptake'}
references:
  - {id: 'GO_REF:0000002', title: Gene Ontology annotation through association of InterPro records with GO terms, findings: []}
  - id: PMID:19919675
    title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple substrate-binding proteins with strong specificity for distinct quaternary ammonium compounds.
    findings: [{statement: Establishes CaiX as the carnitine-selective binding component used with CbcWV.}]
  - {id: 'file:PSEPK/caiX/caiX-uniprot.txt', title: UniProtKB record for caiX, findings: [{statement: Identifies Q88R30 as the carnitine uptake periplasmic component.}]}
  - {id: 'file:PSEPK/caiX/caiX-goa.tsv', title: QuickGO annotations for caiX, findings: [{statement: Contains the six GOA annotations reviewed here.}]}
  - id: file:PSEPK/caiX/caiX-deep-research-openscientist.md
    title: OpenScientist deep research report for caiX
    findings:
      - statement: >-
          Supports CaiX orthology, periplasmic localization, CbcWV recruitment,
          and the absence of direct KT2440 binding assays.
core_functions:
  - description: Periplasmic L-carnitine recognition for the CbcWV ABC importer.
    molecular_function: {id: 'GO:0033293', label: monocarboxylic acid binding}
    contributes_to_molecular_function: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    directly_involved_in: [{id: 'GO:1902603', label: carnitine transmembrane transport}]
    locations: [{id: 'GO:0042597', label: periplasmic space}]
    in_complex: {id: 'GO:0043190', label: 'ATP-binding cassette (ABC) transporter complex'}
    supported_by:
      - {reference_id: 'PMID:19919675', supporting_text: 'The core transporter CbcWV also interacts with the carnitine-specific SBP CaiX'}
proposed_new_terms:
  - proposed_name: L-carnitine binding
    proposed_definition: Binding to L-carnitine.
    justification: >-
      CaiX is a substrate-binding protein specific for L-carnitine, but GO has
      no substrate-specific binding term that captures this direct activity.
    proposed_parent: {id: 'GO:0033293', label: monocarboxylic acid binding}
    supported_by:
      - reference_id: PMID:19919675
        supporting_text: the carnitine-specific SBP CaiX (K(m), 24 microM)
suggested_questions:
  - question: What is the binding affinity and substrate range of KT2440 CaiX itself?
suggested_experiments:
  - {description: Measure Q88R30 binding to L-carnitine and related quaternary amines and test CbcWV-dependent uptake., experiment_type: ligand-binding and transport assay}
