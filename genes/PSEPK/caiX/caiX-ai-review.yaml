id: Q88R30
gene_symbol: caiX
product_type: PROTEIN
aliases:
  - PP_0304
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  caiX (PP_0304) encodes the periplasmic L-carnitine-binding protein of the
  Pseudomonas putida KT2440 Cbc ABC importer. By orthology with characterized
  P. aeruginosa and P. syringae CaiX, it carries a signal peptide and an
  OpuAC-type substrate-binding domain, binds L-carnitine, and docks to the
  shared CbcWV permease-ATPase core to confer carnitine specificity on uptake.
  The gene lies in the carnitine catabolic locus beside lcdH and the CdhB- and
  CdhC-type enzymes; KT2440 CaiX itself has not been assayed.
existing_annotations:
  - term: {id: 'GO:0015871', label: choline transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: InterPro2GO from the choline-binding-protein signature; CaiX is carnitine-selective.
      action: REMOVE
      reason: >-
        With CaiX as sole binding protein, CbcWV transports carnitine but not
        choline, and choline does not compete for CaiX binding; choline uptake
        uses the CbcX binding protein (Q88R38 in KT2440).
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: >-
            Choline and betaine do not compete with carnitine for binding to
            CaiX, as indicated by the lack of competition by choline or betaine
            in the absence of CbcX (Table 7) and by the lack of choline or
            betaine uptake when CaiX was the sole SBP (Table 5)
      source_defects:
        - defect_type: WRONG_TERM
          resource: INTERPRO
          slot: GO ID
          requested_change: DELETE_ROW
          asserted_value: GO:0015871
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            InterPro2GO maps IPR017783 (ABC_choline_sub-bd) to choline
            transport; the signature also matches carnitine-specific CaiX.
  - term: {id: 'GO:0022857', label: transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: True of the complex CaiX belongs to, but much less specific than its role.
      action: MODIFY
      reason: >-
        The informative activity is carnitine transmembrane transport by the
        CaiX-CbcWV complex (GO:0015226, a descendant of this term), to which
        CaiX contributes the substrate-binding role; it is recorded with
        contributes_to below.
      proposed_replacement_terms:
        - {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: >-
            demonstrating that CaiX was sufficient for, and specific to,
            carnitine uptake (Table 5).
  - term: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: contributes_to
    review:
      summary: CaiX contributes carnitine recognition to the CbcWV importer.
      action: NEW
      reason: >-
        Pseudomonas CaiX is experimentally required and, with CbcWV, sufficient
        for carnitine uptake; the KT2440 protein is its locus-conserved ortholog.
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: >-
