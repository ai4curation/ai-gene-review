            carnitine uptake (Table 5).
        - reference_id: file:PSEPK/caiX/caiX-deep-research-openscientist.md
          supporting_text: caiX sits in a carnitine-catabolic gene cluster
  - term: {id: 'GO:0033265', label: choline binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The family mapping assigns the CbcX ligand to carnitine-selective CaiX.
      action: MODIFY
      reason: >-
        Ortholog evidence identifies CaiX as carnitine-specific, not
