  review:
    summary: InterPro2GO from the choline-binding-protein signature; CaiX is carnitine-selective.
    action: REMOVE
    reason: In PMID:19919675, characterized P. aeruginosa/P. syringae CaiX systems and heterologous
      expression distinguish carnitine-selective CaiX from choline-selective CbcX. CaiX as the sole
      binding protein supports carnitine but not choline uptake. Q88R30 is the conserved carnitine-locus
      CaiX ortholog, whereas Q88R38 is the distinct KT2440 CbcX. This supports rejecting the generic
      choline-signature transfer; it is not a native KT2440 negative binding assay.
    supported_by:
