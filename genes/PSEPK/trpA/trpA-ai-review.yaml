    reference_section_type: RESULTS
  - statement: >-
      Only tryptophan rescues the trpA mutant; indole does not.
    supporting_text: >-
      The trpA mutant grew on M9 minimal medium if and only if tryptophan (0.6
      mM) was added
    reference_section_type: RESULTS
