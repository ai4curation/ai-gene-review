- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Bacterial tryptophan synthase is a soluble enzyme. No localization assay
      exists for the KT2440 protein, and the sequence has no signal peptide or
      transmembrane segment.
    action: ACCEPT
    reason: >-
      This TreeGrafter inference rests on the soluble TrpA family. The record
      has no FT TRANSMEM or FT SIGNAL feature, and the TIM-barrel enzyme
      functions with TrpB in a soluble alpha2-beta2 complex. The deep-research
      report likewise found no direct localization experiment and infers
      cytosolic location from these features.
    supported_by:
    - reference_id: file:PSEPK/trpA/trpA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Tetramer of two alpha and two beta chains.
    - reference_id: file:PSEPK/trpA/trpA-deep-research-falcon.md
      supporting_text: >-
        No direct subcellular localization experiments (e.g., fluorescent
        tagging, fractionation) were present in the retrieved full-text
        excerpts. However, the function of TrpA as a core enzyme in amino-acid
        biosynthesis and its role as a soluble subunit in a cytosolic enzyme
        complex strongly supports **cytosolic localization** in bacteria.
core_functions:
- description: >-
    Alpha subunit of the alpha2-beta2 tryptophan synthase. It cleaves
    indole-3-glycerol phosphate to indole and D-glyceraldehyde 3-phosphate and
    passes the indole through the intersubunit tunnel to TrpB, in the final step
    of L-tryptophan biosynthesis.
