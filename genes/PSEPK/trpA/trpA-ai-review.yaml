      supporting_text: >-
        The insertion site of mini‐Tn5 in the Aux‐1 mutant was located at the
        7th codon after the first ATG of the gene‐encoding PP0082
    - reference_id: PMID:21261884
      supporting_text: >-
        The trpA mutant grew on M9 minimal medium if and only if tryptophan (0.6
        mM) was added
