suggested_questions:
- question: >-
    Why does indole not rescue the KT2440 trpA mutant (PMID:21261884)? Does the
    TrpB beta reaction need TrpA for activity in vivo in P. putida, or is
    exogenous indole not taken up efficiently?
suggested_experiments:
- description: >-
    Assay purified KT2440 TrpB alone and the TrpA2-TrpB2 complex for the
    indole + L-serine beta reaction, and measure indole uptake in the trpA
    mutant, to explain why the mutant cannot use indole.
  experiment_type: enzyme assay and uptake measurement
