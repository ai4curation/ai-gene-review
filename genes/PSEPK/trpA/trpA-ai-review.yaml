gene_symbol: trpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  trpA (PP_0082) encodes the alpha subunit of tryptophan synthase (EC
  4.2.1.20), the enzyme of the final step of L-tryptophan biosynthesis. The
  alpha subunit catalyses the retro-aldol cleavage of (1S,2R)-1-C-(indol-3-yl)glycerol
  3-phosphate (indole-3-glycerol phosphate) to indole and D-glyceraldehyde
  3-phosphate. The indole is channelled through an intramolecular tunnel to the
  pyridoxal 5'-phosphate-dependent beta subunit (TrpB), where it is condensed
  with L-serine to give L-tryptophan; the functional enzyme is an
  alpha2-beta2 tetramer. In Pseudomonas putida KT2440 trpA forms an operon with
  trpB, and a transposon insertion near the start of trpA causes tryptophan
  auxotrophy. The protein is a soluble enzyme of the TrpA family with a
  ribulose-phosphate-binding (TIM) barrel fold.
