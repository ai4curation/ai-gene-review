  qualifier: involved_in
  review:
    summary: >-
      TrpA performs the alpha half-reaction of tryptophan synthase, the last
      step of L-tryptophan biosynthesis from chorismate. In KT2440, a mini-Tn5
      insertion in PP0082 gives a tryptophan auxotroph.
    action: ACCEPT
    reason: >-
      Core process. The HAMAP-backed pathway assignment is confirmed by KT2440
      genetics: the Aux-1 insertion at codon 7 of PP0082 abolishes
      tryptophan prototrophy, and the mutant grows only when tryptophan is
      added.
    supported_by:
