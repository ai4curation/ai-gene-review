suggested_questions:
- question: Is PP_2483 CTP- or GTP-specific in vitro, and does it act on the molybdenum cofactor used by the neighboring molybdoenzyme system?
suggested_experiments:
- description: Compare CTP- and GTP-dependent nucleotide transfer from purified Q88K10 to Mo-MPT and test how PP_2483 deletion affects the neighboring molybdoenzyme system.
  experiment_type: substrate-specificity assay and targeted genetics
