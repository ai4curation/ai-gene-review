id: Q88K10
gene_symbol: PP_2483
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_2483 encodes a MobA-like NTP-transferase-domain protein. KEGG assigns it
  to MocA orthology K07141, but the broad PANTHER family does not distinguish
  MobA from MocA-like activities and local pairwise comparisons place Q88K10
  closer to Escherichia coli MobA than MocA. Its physiological substrate,
  nucleotide specificity, and pathway role therefore remain unresolved.
existing_annotations:
- term:
    id: GO:0016779
    label: nucleotidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The broad nucleotidyltransferase prediction is plausible, but the physiological reaction and nucleotide specificity are unresolved.
    action: ACCEPT
    reason: >-
      The MobA-like domain and KEGG K07141 assignment support an NTP-transferase
      family placement, but PTHR43777:SF1 is not MocA-specific and the saved
      sequence comparison places Q88K10 closer to E. coli MobA than MocA.
      Neither CTP-dependent MocA activity nor GTP-dependent MobA activity has
      been demonstrated for Q88K10.
    supported_by:
    - reference_id: file:PSEPK/moaA/moaA-bioinformatics/mob_like_kegg_orthology.tsv
      supporting_text: "PP_2483\tQ88K10\tppu:PP_2483\tko:K07141"
    - reference_id: file:PSEPK/moaA/moaA-bioinformatics/RESULTS.md
      supporting_text: |-
        - PP_2483 is more similar to the E. coli MobA control (39.29%) than to the E. coli
          MocA control (28.49%), whereas PP_4230 is more similar to MocA (39.62%) than to
          MobA (28.74%). PP_2483 and PP_4230 are 48.13% identical to one another.
        - The generated KEGG link table maps both PP_2483 and PP_4230 to K07141. It maps
          the reviewed E. coli controls to distinct MobA (K03752) and MocA (K07141)
          orthologies, respectively.
    - reference_id: file:PSEPK/PP_2483/PP_2483-deep-research-openscientist.md
      supporting_text: >-
        **No direct experimental data** exist for PP_2483; the annotation is
        inferred from orthology, conserved domains, genomic context, and
        characterized homologs. Q88K10 is an unreviewed TrEMBL entry.
