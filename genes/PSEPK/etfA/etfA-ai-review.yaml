id: Q88F97
gene_symbol: etfA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Alpha subunit of the electron-transfer flavoprotein (ETF) heterodimer. The
  alpha subunit binds FAD and, together with the beta subunit EtfB, forms a
  soluble electron carrier that accepts reducing equivalents from
  flavoprotein dehydrogenases and passes them to ETF-ubiquinone
  oxidoreductase. The etfA-etfB pair is encoded next to PP_4203, the
  ETF-ubiquinone oxidoreductase that reoxidises it, and this locus is the
  convergence point for the large acyl-CoA dehydrogenase repertoire of
  Pseudomonas putida KT2440, making fatty-acid beta-oxidation a likely major
  donor pathway; the individual donor-acceptor pairings have not been
  demonstrated experimentally in this organism.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfA is the FAD-bearing alpha subunit of a heterodimeric ETF, and
      electron transfer activity is the defining molecular function of the ETF
      alpha/FixB family. The alpha subunit carries the redox-active flavin that
      is reduced by partner dehydrogenases.
    action: ACCEPT
    reason: >-
      Electron transfer activity is the core molecular function of the ETF
      alpha subunit, and the completed ortholog reviews in this repository
      (genes/human/ETFA, genes/human/ETFB) likewise ACCEPT enables GO:0009055
      and call it the core molecular function. Those two reviews place
      GO:0009055 directly in molecular_function; this review instead records it
      as contributes_to_molecular_function because the single FAD of the
      bacterial heterodimer sits at the alpha/beta interface and neither
      polypeptide carries the activity alone. That is a modelling difference
      from the human reviews, not a convention they establish. The previous
      MARK_AS_OVER_ANNOTATED call would have left this gene with no
      molecular-function term for its defining activity.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This annotation assigns the ETF alpha subunit specifically to fatty-acid
      beta-oxidation using acyl-CoA dehydrogenase, one of several donor
      pathways that feed a bacterial ETF.
    action: KEEP_AS_NON_CORE
    reason: >-
      ETFs accept electrons from many flavoprotein dehydrogenases, so this term
      names one donor pathway rather than the subunit's function. But it is a
      likely genuine one here: etfA-etfB sit next to PP_4203, the ETF-ubiquinone
      oxidoreductase that reoxidises the pair, and that locus is the obligatory
      reoxidation node for KT2440's large acyl-CoA dehydrogenase repertoire
      (see genes/PSEPK/PP_4203/PP_4203-notes.md). The human ortholog review
      genes/human/ETFB treats involvement in GO:0033539 as supported on exactly
      this electron-acceptor basis. Keeping it as non-core rather than marking
      it over-annotated: the donor-acceptor pairing has not been demonstrated
      experimentally in this organism, and this ETF is not dedicated to
      beta-oxidation, so the term should not be read as a core function.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The alpha subunit is predicted to bind one FAD in the ETF heterodimer,
      with multiple FAD-contacting residues identified by the family rule.
    action: ACCEPT
    reason: >-
      FAD binding is a direct property of the alpha polypeptide and is
      supported by the ETF alpha family assignment and the predicted
      cofactor-binding features.
- term:
    id: GO:0045251
    label: electron transfer flavoprotein complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/etfA/etfA-uniprot.txt
  qualifier: part_of
  review:
    summary: >-
      GOA gives EtfA no cellular-component term, so the assembled carrier it is
      a subunit of is not recorded anywhere. The UniProt record asserts the
      heterodimer, and GO:0045251 is the term for exactly that assembly.
    action: NEW
    reason: >-
      The local UniProt record states SUBUNIT "Heterodimer of an alpha and a
      beta subunit", and the protein is assigned to the ETF alpha-subunit/FixB
      family, whose product is the ETF complex by definition. The human
      orthologs in the same role carry GO:0045251 as an experimental (IPI)
      annotation - genes/human/ETFA and genes/human/ETFB both have it from
      PMID:8962055 - so this is a gap in the electronic annotation of the
      bacterial protein rather than a new biological claim. ISS because the
      assembly is asserted by family rule rather than assayed in KT2440.
    supported_by:
    - reference_id: file:PSEPK/etfA/etfA-uniprot.txt
      supporting_text: Heterodimer of an alpha and a beta subunit.
