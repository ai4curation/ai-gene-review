id: Q88F97
gene_symbol: etfA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Alpha subunit of the electron-transfer flavoprotein (ETF) heterodimer. The
  alpha subunit binds FAD and, together with the beta subunit EtfB, forms a
  soluble electron carrier that accepts reducing equivalents from
  flavoprotein dehydrogenases and passes them to ETF-ubiquinone
  oxidoreductase. The available record does not establish which upstream
  dehydrogenases use this ETF pair in Pseudomonas putida KT2440.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfA is the FAD-bearing alpha subunit of a heterodimeric ETF, and
      electron transfer activity is the defining molecular function of the ETF
      alpha/FixB family. The alpha subunit carries the redox-active flavin that
      is reduced by partner dehydrogenases.
    action: ACCEPT
    reason: >-
      Electron transfer activity is the core molecular function of the ETF
      alpha subunit. GO's convention for an obligate subunit of a multi-protein
      carrier is to ACCEPT the enables annotation while recording the
      subunit-level dependency as contributes_to_molecular_function in
      core_functions, which this review already does. This matches the completed
      ortholog reviews in this repository: genes/human/ETFA and
      genes/human/ETFB both ACCEPT enables GO:0009055 for the same protein pair
      and call it the core molecular function. The previous
      MARK_AS_OVER_ANNOTATED call was inconsistent with that convention and
      would have left this gene with no molecular-function term for its
      defining activity.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This annotation assigns the ETF alpha subunit specifically to fatty-acid
      beta-oxidation using acyl-CoA dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ETFs can receive electrons from multiple flavoprotein dehydrogenases,
      and neither the local UniProt record nor the family-based annotation
      establishes donor specificity for fatty-acid beta-oxidation in this
      organism.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The alpha subunit is predicted to bind one FAD in the ETF heterodimer,
      with multiple FAD-contacting residues identified by the family rule.
    action: ACCEPT
    reason: >-
      FAD binding is a direct property of the alpha polypeptide and is
      supported by the ETF alpha family assignment and the predicted
      cofactor-binding features.
