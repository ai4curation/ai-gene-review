id: Q88F97
gene_symbol: etfA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Alpha subunit of the electron-transfer flavoprotein (ETF) heterodimer. The
  alpha subunit binds FAD and, together with the beta subunit EtfB, forms a
  soluble electron carrier that accepts reducing equivalents from
  flavoprotein dehydrogenases and passes them to ETF-ubiquinone
  oxidoreductase. The available record does not establish which upstream
  dehydrogenases use this ETF pair in Pseudomonas putida KT2440.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EtfA is the FAD-binding alpha subunit of a heterodimeric ETF. Electron
      transfer is performed by the assembled alpha/beta carrier rather than
      by an independently acting alpha polypeptide.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The family assignment supports participation in electron transfer, but
      the enables qualifier assigns the complete carrier activity to one
      component. EtfA is better represented as contributing to this molecular
      function.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      This annotation assigns the ETF alpha subunit specifically to fatty-acid
      beta-oxidation using acyl-CoA dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ETFs can receive electrons from multiple flavoprotein dehydrogenases,
      and neither the local UniProt record nor the family-based annotation
      establishes donor specificity for fatty-acid beta-oxidation in this
      organism.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The alpha subunit is predicted to bind one FAD in the ETF heterodimer,
      with multiple FAD-contacting residues identified by the family rule.
    action: ACCEPT
    reason: >-
      FAD binding is a direct property of the alpha polypeptide and is
      supported by the ETF alpha family assignment and the predicted
      cofactor-binding features.
