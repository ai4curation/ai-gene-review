    - &id002
      reference_id: file:PSEPK/glyS/glyS-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the class-II aminoacyl-tRNA synthetase family. {ECO:0000255|HAMAP-Rule:MF_00255}.
- term:
    id: GO:0004820
    label: glycine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: glyS supports its substrate-specific tRNA-ligase activity.
    action: ACCEPT
    reason: The exact native protein has the corresponding curated HAMAP family/domain and reaction assignment.
      This supports conserved catalytic capability by homology, not direct KT2440 purification. As an
      alpha/beta complex subunit, it contributes to the whole reaction; ordinary relationship metadata
      does not turn this into an unsupported isolated-subunit claim.
    supported_by: &id004
    - *id001
    - *id002
    - reference_id: file:PSEPK/glyS/glyS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Tetramer of two alpha and two beta subunits. {ECO:0000255|HAMAP-Rule:MF_00255}.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: glyS contributes integral ATP recognition to its enzymatic reaction.
    action: ACCEPT
    reason: ATP binding is an integral biochemical property, not a non-core activity merely because it
      is binding. The curated reaction/architecture supports it by homology for KT2440. Full EcGlyRS structure
      directly places beta-subunit Arg326 against the ATP-analogue gamma phosphate; the corresponding
      bacterial GlyS architecture supports the target inference, without claiming a KT2440 affinity measurement.
    supported_by:
    - *id001
    - reference_id: PMID:34390350
      supporting_text: Importantly, Arg326 from the β-subunit B3 domain was observed to form direct charge
        interactions with the γ-phosphate of AMP-PNP (Figure 2B and C)
