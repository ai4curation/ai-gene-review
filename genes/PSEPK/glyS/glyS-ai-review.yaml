- term:
    id: GO:0004814
    label: arginine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GlyS is the beta subunit of GlyRS, not an arginine-activating synthetase.
    action: REMOVE
    reason: The exact curated GlyS beta-subunit family and glycyl-tRNA reaction contradict the arginine-ligase
      transfer. Homology of an anticodon-binding domain to ArgRS does not supply the class-I arginine-activation
      catalytic architecture. Retain genuine GlyRS complex contributions.
    supported_by:
