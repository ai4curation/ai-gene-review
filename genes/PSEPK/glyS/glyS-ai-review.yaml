  qualifier: enables
  review:
    summary: glyS binds ATP as part of its aminoacylation machinery.
    action: MODIFY
    reason: Nucleotide binding is true but broad. The curated glycine reaction and relevant subunit architecture
      support the more specific ATP-binding claim; this is integral substrate recognition, not a peripheral
      role.
