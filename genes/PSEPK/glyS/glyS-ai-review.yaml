  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: Beta subunit of the bacterial heterotetrameric glycyl-tRNA synthetase, working with GlyQ to attach glycine to tRNA(Gly) for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleotide binding is compatible with aminoacyl-tRNA synthetase chemistry but is too broad to define the substrate-specific function.
    action: MARK_AS_OVER_ANNOTATED
    reason: Nucleotide binding is compatible with ATP-dependent catalysis but is less defining than the complex's substrate-specific ligase activity.
- term:
    id: GO:0004814
    label: arginine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The arginine-tRNA ligase activity assignment conflicts with the exact glycine--tRNA ligase beta-subunit record.
    action: REMOVE
    reason: This InterPro-only arginine assignment is a cross-family electronic mapping error; the reviewed record specifies the glycyl-tRNA reaction.
- term:
    id: GO:0004820
    label: glycine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: GlyS contributes to the substrate-specific activity of heterotetrameric GlyRS.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The reviewed record supports the glycyl-tRNA reaction, but the beta
      subunit does not independently enable the whole-complex activity; the
      qualifier should be contributes_to.
    supported_by:
    - reference_id: file:PSEPK/glyS/glyS-uniprot.txt
      supporting_text: Reaction=tRNA(Gly) + glycine + ATP = glycyl-tRNA(Gly) + AMP +
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Atp binding is compatible with aminoacyl-tRNA synthetase chemistry but is too broad to define the substrate-specific function.
    action: KEEP_AS_NON_CORE
    reason: ATP binding is a valid ancillary capability of the ligase complex rather than its defining function.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
