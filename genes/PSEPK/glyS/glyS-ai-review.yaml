id: Q88RR9
gene_symbol: glyS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GlyS is the beta subunit of the bacterial alpha2-beta2 glycyl-tRNA synthetase, paired with
  GlyQ. Its multidomain architecture contributes tRNA recognition, assembly and stabilization of ATP coordination
  in the complete enzyme. Together the subunits attach glycine to tRNA(Gly); an ArgRS-like recognition
  domain does not confer arginine-activation activity.
