id: Q88M10
gene_symbol: ubiG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiG (PP_1765) encodes the ubiquinone biosynthesis O-methyltransferase (UbiG/COQ3 family of
  class I SAM-dependent methyltransferases). It transfers methyl groups from
  S-adenosyl-L-methionine to two different ring hydroxyls of ubiquinone intermediates: early in
  the pathway it methylates 3-polyprenylbenzene-1,2-diol (2-polyprenyl-6-hydroxyphenol, made
  by the UbiI-type VisC) to 2-methoxy-6-polyprenylphenol, and in the final step it methylates
  3-demethylubiquinol (made by Coq7) to ubiquinol-9. Function is inferred from the UbiG family
  and from Escherichia coli UbiG, which catalyses both O-methylations; the KT2440 protein has
  not been assayed.
