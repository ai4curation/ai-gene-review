  review:
    summary: >-
      TreeGrafter methyltransferase activity (PAINT IBD at PTN002459972, seeds include E. coli
      UbiG P17993). True but general; refine to the two specific O-methyltransferase
      activities carried by this gene.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports. UbiG catalyses two defined
      SAM-dependent O-methylations, GO:0102208 (early) and GO:0061542 (final), both carried by
      this gene and supported by the curated HAMAP reactions and E. coli enzymology. Both are
      listed as replacements because both are core.
    proposed_replacement_terms:
    - id: GO:0102208
      label: 2-polyprenyl-6-hydroxyphenol methylase activity
    - id: GO:0061542
      label: 3-demethylubiquinol 3-O-methyltransferase activity
    supported_by:
    - reference_id: file:PSEPK/ubiG/ubiG-uniprot.txt
      record_section: ["CC:FUNCTION"]
