suggested_questions:
- question: >-
    Does PP_1765 methylate the early and late substrates with similar efficiency, and does it
    form part of a KT2440 Ubi complex with Coq7 supplying the final substrate?
suggested_experiments:
- description: >-
    Delete PP_1765 in KT2440 and profile accumulated intermediates (expected
    3-nonaprenylbenzene-1,2-diol and 3-demethylubiquinol-9); assay purified PP_1765 with SAM
    and farnesylated analogues of both substrates.
