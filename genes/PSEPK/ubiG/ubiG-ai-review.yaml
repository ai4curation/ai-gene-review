        biosynthetic pathway.
- term:
    id: GO:0010420
    label: polyprenyldihydroxybenzoate methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010233
  - PANTHER:PTN002460086
  review:
    summary: >-
      InterPro2GO/PANTHER transfer of the eukaryotic Coq3 first-methylation activity, whose
      substrate (3,4-dihydroxy-5-polyprenylbenzoate) still carries the carboxyl group. That
      compound is not an intermediate of the bacterial pathway, where decarboxylation by UbiD
      precedes the first hydroxylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      E. coli UbiG can methylate a farnesyl analogue of the eukaryotic intermediate in lysates,
      so the activity is not chemically excluded, but in bacteria UbiD removes the carboxyl
      group before the ring is hydroxylated, and the bacterial first O-methylation substrate
      is 2-polyprenyl-6-hydroxyphenol (GO:0102208, carried by this gene). This is real in
      vitro activity of no known physiological relevance in KT2440; the InterPro2GO mapping of
      IPR010233 to GO:0010420 is right for eukaryotic Coq3 but over-reaches for bacterial UbiG.
      PAINT places GO:0010420 only at the eukaryotic node PTN000566263.
    supported_by:
    - reference_id: PMID:8703953
      supporting_text: In vitro methyltransferase assays with E. coli cell lysates and synthetically
        prepared farnesylated-substrate analogs indicate that UbiG methylates both the derivative
        of the eukaryotic intermediate, 3,4-dihydroxy-5-farnesylbenzoate, as well as that of
        the E. coli intermediate, 2-farnesyl-6-hydroxyphenol.
    - reference_id: file:PSEPK/ubiG/ubiG-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=a 3-(all-trans-polyprenyl)benzene-1,2-diol + S-adenosyl-L-
        methionine = a 2-methoxy-6-(all-trans-polyprenyl)phenol + S-adenosyl-
        L-homocysteine + H(+);
