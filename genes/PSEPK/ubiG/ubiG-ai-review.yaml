- id: PMID:8703953
  title: 'Complementation of coq3 mutant yeast by mitochondrial targeting of the Escherichia
    coli UbiG polypeptide: evidence that UbiG catalyzes both O-methylation steps in ubiquinone
    biosynthesis.'
  findings:
  - statement: E. coli UbiG rescues yeast coq3 when targeted to mitochondria, and in lysates
      methylates both the bacterial and eukaryotic first-methylation substrate analogues.
    supporting_text: The current study shows that the ubiG gene is able to restore respiration
      in the yeast coq3 mutant, provided ubiG is modified to contain a mitochondrial leader sequence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Basis for treating GO:0010420 as real in vitro but
      non-physiological activity for bacterial UbiG.
