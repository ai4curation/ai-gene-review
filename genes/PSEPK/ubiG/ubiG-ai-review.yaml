      Ortholog biochemistry and the reviewed record support both UbiG O-methylations; PP_1765
      itself has not been characterized.
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Core assignment is sound. Its claim of an anaerobic UbiU/UbiV/UbiT route in P. putida is
      wrong for KT2440, which lacks those genes (project pathway report); metabolon statements
      are E. coli analogies.
