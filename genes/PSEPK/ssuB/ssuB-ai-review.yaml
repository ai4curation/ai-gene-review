  label: Pseudomonas putida KT2440
description: SsuB (PP_0240) is the nucleotide-binding ATPase component of the SsuABC alkanesulfonate importer
  in Pseudomonas putida KT2440. It couples ATP binding and hydrolysis to transport through the SsuC membrane
  component. Its family architecture supports association with the cytoplasmic side of the inner membrane;
  native combined ssuBC deletion phenotypes corroborate a role in sulfonate uptake, while individual ATPase
  kinetics remain unmeasured.
