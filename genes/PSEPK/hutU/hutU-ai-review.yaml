id: Q88CZ6
gene_symbol: hutU
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutU (PP_5033) is a soluble NAD+-dependent urocanate hydratase that converts
  trans-urocanate to 4-imidazolone-5-propanoate in the cytoplasmic
  L-histidine-catabolic pathway. It performs the reaction immediately after
  HutH and before HutI; the bound NAD+ acts as a cofactor rather than as a
  redox cosubstrate.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: HutU is predicted to be a soluble cytoplasmic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cytoplasmic localization is explicitly assigned by HAMAP and is
      biologically compatible with histidine catabolism, but it is secondary
      to the catalytic reaction and not experimentally measured in KT2440.
    supported_by:
    - reference_id: file:PSEPK/hutU/hutU-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: HutU performs the urocanate-hydration step of L-histidine catabolism.
    action: ACCEPT
    reason: >-
      The reviewed pathway annotation places HutU at step 2/3 from histidine to
      N-formimidoyl-L-glutamate. This records participation without assigning
      the terminal reactions to HutU.
    supported_by:
    - reference_id: file:PSEPK/hutU/hutU-uniprot.txt
      supporting_text: "N-formimidoyl-L-glutamate from L-histidine: step 2/3."
- term:
    id: GO:0016153
    label: urocanate hydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: HutU hydrates trans-urocanate to 4-imidazolone-5-propanoate.
    action: ACCEPT
    reason: >-
      The reviewed HAMAP record assigns EC 4.2.1.49/RHEA:13101, an
      urocanase-specific InterPro signature, and the PTHR12216:SF4 urocanate
      hydratase subfamily.
    supported_by:
    - reference_id: file:PSEPK/hutU/hutU-uniprot.txt
      supporting_text: "Reaction=4-imidazolone-5-propanoate = trans-urocanate + H2O"
    - reference_id: file:interpro/panther/PTHR12216/PTHR12216-entries.csv
      supporting_text: "Q88CZ6,Urocanate hydratase"
