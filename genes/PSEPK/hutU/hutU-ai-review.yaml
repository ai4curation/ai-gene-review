id: Q88CZ6
gene_symbol: hutU
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutU (PP_5033) is a soluble NAD+-dependent urocanate hydratase that converts
  trans-urocanate to 4-imidazolone-5-propanoate in the cytoplasmic
  L-histidine-catabolic pathway. It performs the reaction immediately after
  HutH and before HutI; the bound NAD+ acts as a cofactor rather than as a
  redox cosubstrate.
