id: Q88ES7
gene_symbol: fliD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  FliD is the secreted flagellar filament-cap protein. A FliD oligomer sits at
  the distal filament tip and promotes efficient incorporation of exported
  flagellin during filament elongation; it is not a stable hook component.
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The mature FliD cap is exposed at the distal extracellular filament tip.
    action: ACCEPT
    reason: Correct broad localization.
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: FliD is a filament assembly factor; a direct adhesion role is not established for KT2440.
    action: REMOVE
    reason: This family-level mapping is not supported by the core conserved cap function and is taxon/context dependent.
- term:
    id: GO:0009288
    label: bacterial-type flagellum
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: FliD is a distal component of the bacterial flagellum.
    action: ACCEPT
    reason: Correct broad component assignment.
- term:
    id: GO:0009421
    label: bacterial-type flagellum filament cap
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: FliD oligomerizes to form the flagellar filament cap.
    action: ACCEPT
    reason: This is the most specific core component annotation.
- term:
    id: GO:0009424
    label: bacterial-type flagellum hook
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: FliD caps the filament tip and is not a stable constituent of the hook.
    action: REMOVE
    reason: The annotation conflates the filament-cap protein with hook structural proteins.
- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Proper filament elongation requires FliD and supports flagellum-dependent motility.
    action: KEEP_AS_NON_CORE
    reason: Correct downstream process; filament assembly is the direct role.
