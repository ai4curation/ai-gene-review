    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad aldehyde oxidation claim can be refined to the inherited SSADH reaction of PP_2488.
    action: MODIFY
    reason: The exact Q88K05 FunFam and GabD1-like CDD classifications support succinate-semialdehyde
      oxidation with NAD as an inferred accepted cosubstrate. GO:0004777 already occurs in this review.
      This refinement states the supported reaction rather than treating a general catalytic ancestor
      as non-core; it does not assign a dedicated 4-hydroxybutyrate, GABA or putrescine pathway, nor exclude
      NADP use.
