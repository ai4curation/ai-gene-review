proposed_new_terms: []
suggested_questions:
- question: Under which carbon or nitrogen sources is sad-I the physiologically dominant succinate-semialdehyde dehydrogenase?
suggested_experiments:
- hypothesis: Sad-I contributes to the NAD-preferring SSADH activity induced by 4-hydroxyphenylacetate rather than the NADP-dependent activity induced by putrescine.
  description: Compare sad-I expression, deletion phenotypes, and NAD- versus NADP-linked succinate-semialdehyde oxidation during growth on 4-hydroxyphenylacetate, putrescine, 4-hydroxybutyrate, and GABA.
