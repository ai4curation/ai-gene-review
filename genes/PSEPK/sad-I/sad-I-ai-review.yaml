suggested_questions:
- question: Under which carbon or nitrogen sources is sad-I the physiologically dominant succinate-semialdehyde
    dehydrogenase?
- question: Does purified PP_2488 accept both NAD and NADP, and are their catalytic efficiencies consistent
    with the NAD-dependent functional-family assignment?
suggested_experiments:
- hypothesis: Sad-I contributes to the NAD-preferring SSADH activity induced by 4-hydroxyphenylacetate
    rather than the NADP-dependent activity induced by putrescine.
  description: Compare sad-I expression, deletion phenotypes, and NAD- versus NADP-linked succinate-semialdehyde
    oxidation during growth on 4-hydroxyphenylacetate, putrescine, 4-hydroxybutyrate, and GABA.
