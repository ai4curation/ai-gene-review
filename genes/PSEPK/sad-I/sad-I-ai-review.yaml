  label: Pseudomonas putida KT2440
description: sad-I (PP_2488) encodes a predicted NAD-capable succinate-semialdehyde dehydrogenase of the
  GabD1/Sad aldehyde-dehydrogenase family in Pseudomonas putida KT2440. It is expected to oxidize succinate
  semialdehyde to succinate. Its measured NAD versus NADP preference and physiological substrate regime
  have not been resolved for this exact protein.
