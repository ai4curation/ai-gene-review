  qualifier: enables
  review:
    summary: NAD-dependent succinate-semialdehyde oxidation is retained for PP_2488 as an explicit functional-family
      inference.
    action: ACCEPT
    reason: Q88K05 is independently assigned to the NAD-dependent SSADH FunFam and the GabD1-like CDD
      family. This supports NAD capacity without claiming measured target kinetics or exclusion of NADP.
      The old rationale incorrectly treated an ARBA NADP keyword and an NADP-named PANTHER subfamily as
      conflicting experimental evidence. PMID:23229889 establishes cofactor promiscuity in Salmonella
      YneI, and PMID:3355840 does not map its Pseudomonas isoenzymes to this locus.
    supported_by:
    - *id001
    - *id002
    - reference_id: PMID:23229889
      supporting_text: YneI can use both NAD(+) and NADP(+) as cofactors
