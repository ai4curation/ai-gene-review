  review:
    summary: The aldehyde-dehydrogenase substrate class is resolved to succinate-semialdehyde oxidation
      without selecting one nicotinamide cofactor.
    action: MODIFY
    reason: PANTHER, the SSADH FunFam and GabD1-like CDD classification agree on succinate-semialdehyde
      oxidation. They are computational classifications, not independent target enzyme assays. For Sad-I,
      the NADP-named PTHR43217:SF2 subgroup is a substantive competing cofactor classification against
      the NAD-dependent FunFam. Neither is dismissed as experimental or privileged merely because it matches
      GOA. This is a substrate-specific semantic refinement to GO:0009013; live QuickGO does not currently
      place GO:0009013 below GO:0004030, so no is_a relationship between that pair is claimed. Neither
      the P. putida isoenzymes in PMID:3355840 nor Salmonella YneI in PMID:23229889 establishes a locus-specific
