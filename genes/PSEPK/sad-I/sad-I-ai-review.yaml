id: Q88K05
gene_symbol: sad-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  sad-I encodes a predicted NAD(P)-linked succinate-semialdehyde dehydrogenase
  that oxidizes succinate semialdehyde to succinate. It is one of multiple
  enzymes in Pseudomonas putida KT2440 capable of covering this reaction; its
  physiological pathway assignment, including a possible role downstream of
  4-hydroxybutyrate oxidation, remains unresolved.
existing_annotations:
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This is the cofactor-neutral working molecular function supported by the aldehyde-dehydrogenase family.
    action: ACCEPT
    reason: The submitted NAD-specific name conflicts with NADP-oriented family metadata, so the broader NAD(P)-linked function is retained as core.
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: NAD-specific succinate-semialdehyde dehydrogenase activity is plausible but not resolved.
    action: UNDECIDED
    reason: The submitted NAD-specific product/EC conflicts with an NADP-oriented PANTHER subfamily and NADP keyword; no biochemical cofactor assay was found.
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root oxidoreductase term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0004030 provides the supported aldehyde-dehydrogenase mechanism without overstating cofactor specificity.
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: EC=1.2.1.24
