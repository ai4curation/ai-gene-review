- question: Under which carbon or nitrogen sources is sad-I the physiologically dominant succinate-semialdehyde dehydrogenase?
suggested_experiments:
- hypothesis: Sad-I supplies the dominant NAD-linked succinate-semialdehyde dehydrogenase activity under a restricted substrate regime.
  description: Measure sad-I expression and NAD-dependent succinate-semialdehyde oxidation during growth on 4-hydroxybutyrate and GABA.
