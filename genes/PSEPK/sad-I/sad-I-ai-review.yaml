id: Q88K05
gene_symbol: sad-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  sad-I encodes a predicted NAD(P)-linked succinate-semialdehyde dehydrogenase
  that oxidizes succinate semialdehyde to succinate. It is one of multiple
  enzymes in Pseudomonas putida KT2440 capable of covering this reaction; its
  physiological pathway assignment, including a possible role downstream of
  4-hydroxybutyrate oxidation, remains unresolved.
existing_annotations:
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad parent is compatible but loses the supported succinate-semialdehyde substrate specificity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88K05 contains the conserved aldehyde-dehydrogenase domains, while its
      NAD-specific submitted name conflicts with NADP-oriented family metadata.
      A characterized Sad/YneI-family homolog uses both cofactors. The
      substrate-specific GO:0009013 is therefore the better core term while
      Q88K05 cofactor preference remains unresolved.
    additional_reference_ids:
    - PMID:23229889
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
    - reference_id: PMID:23229889
      supporting_text: YneI can use both NAD(+) and NADP(+) as cofactors
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The succinate-semialdehyde substrate is supported, but the NAD-specific qualifier is not resolved.
    action: MODIFY
    reason: >-
      The submitted NAD-specific product/EC conflicts with an NADP-oriented
      PANTHER subfamily and NADP keyword. Replace it with GO:0009013, which
      retains succinate-semialdehyde specificity without choosing NAD or NADP.
    proposed_replacement_terms:
    - id: GO:0009013
      label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: Full=NAD+-dependent succinate semialdehyde dehydrogenase
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This root oxidoreductase term is compatible but uninformative.
    action: KEEP_AS_NON_CORE
    reason: GO:0009013 provides the substrate-specific NAD(P)-linked function without choosing a cofactor.
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      supporting_text: InterPro; IPR015590; Aldehyde_DH_dom.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/sad-I/sad-I-uniprot.txt
  title: UniProt entry Q88K05 for sad-I
  findings:
  - statement: The record assigns NAD-dependent succinate-semialdehyde dehydrogenase and EC 1.2.1.24.
- id: PMID:23229889
  title: Structure and activity of the NAD(P)+-dependent succinate semialdehyde dehydrogenase YneI from Salmonella typhimurium.
  findings:
  - statement: A characterized Sad/YneI-family enzyme uses both nicotinamide cofactors with NAD preference, supporting caution about binary cofactor labels.
- id: PMID:3355840
  title: Properties and functions of two succinic-semialdehyde dehydrogenases from Pseudomonas putida.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verified; establishes two P. putida SSADH activities but does not identify a strain or locus.
  findings:
  - statement: P. putida contains separable NAD-preferring/4-hydroxyphenylacetate-induced and NADP-dependent/putrescine-induced SSADH activities, without a locus assignment.
- id: file:PSEPK/sad-I/sad-I-deep-research-openscientist.md
  title: OpenScientist deep-research report for sad-I
  findings:
  - statement: The provider proposes a Sad/YneI-like assignment for Q88K05 and a Lys157 cofactor-determinant mapping; these are research leads from its own alignment, not published locus-specific results.
- id: file:modules/bacterial_4_hydroxybutyrate_oxidation-deep-research-openscientist.md
  title: OpenScientist review of bacterial 4-hydroxybutyrate oxidation
  findings:
  - statement: The report treats Sad-family enzymes as NAD-preferring but potentially cofactor-promiscuous.
- id: file:PSEPK/sad-I/sad-I-notes.md
  title: Manual evidence notes for sad-I
  findings:
  - statement: The notes record the unresolved cofactor and pathway assignments.
core_functions:
- description: Predicted NAD(P)-linked oxidation of succinate semialdehyde to succinate; cofactor preference and physiological pathway assignment remain unresolved.
  molecular_function:
