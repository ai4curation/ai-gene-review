- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PP_2488 retains a qualified NAD-capacity inference; its measured acceptor preference is unresolved.
    action: ACCEPT
    reason: The exact Q88K05 NAD-dependent SSADH FunFam supplies positive functional-family evidence for
      NAD capacity. For Sad-I, the NADP-named PTHR43217:SF2 subgroup is a substantive competing cofactor
      classification against the NAD-dependent FunFam. Neither is dismissed as experimental or privileged
      merely because it matches GOA. Retention of GO:0004777 is therefore a contested family-level inference,
      not a resolved cofactor assignment. The live GO definition describes NAD-supported catalysis and
      does not assert exclusive NAD use or absence of NADP activity. PMID:3355840 separates P. putida
      NAD-preferring and NADP-dependent isoenzymes but does not map either to this locus; Salmonella YneI
      promiscuity in PMID:23229889 is contextual, not a target assay. The ARBA-only NADP keyword is not
      used as independent evidence in either direction. The core and broad-term refinements retain cofactor-general
      SSADH chemistry rather than using this inference to settle physiological acceptor choice.
    supported_by:
    - reference_id: file:PSEPK/sad-I/sad-I-uniprot.txt
      record_section: ["DR:FunFam"]
      supporting_text: FunFam; 3.40.605.10:FF:000012; NAD-dependent succinate-semialdehyde dehydrogenase;
