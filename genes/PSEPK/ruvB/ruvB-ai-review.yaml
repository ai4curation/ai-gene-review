- id: file:projects/P_PUTIDA/deep-research/PSEPK__ruvabc-holliday-junction-processing__ppu03440-deep-research-openscientist.md
  title: OpenScientist PSEPK RuvABC Holliday-junction-processing synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The sidecar directly supports RuvB as the homology-grade ATP-dependent branch-migration
      motor in the intact PSEPK ruvCAB locus, and uses the RuvCAB/RecG boundary analysis to separate it
      from RuvA junction loading, RuvC resolution, and upstream recombination steps. The Q88NJ0 accession,
      PP_1217 locus, and 348 aa length were confirmed against the fetched UniProt record. Its RuvB-L268S
      discussion appropriately tempers the assignment to homology grade because an in-vitro-active E.
      coli RuvB can still fail in vivo.
  findings:
  - statement: The report places RuvB as the ATP-dependent motor between RuvA junction recognition and
      RuvC resolution.
    supporting_text: Branch-migration motor. Walker A and Walker B ATP-binding motifs are annotated
- id: file:PSEPK/ruvB/ruvB-deep-research-falcon.md
  title: Falcon deep research for PSEPK RuvB
  findings:
