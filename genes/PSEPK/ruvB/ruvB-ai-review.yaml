taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RuvB is the ATP-dependent motor subunit of the Pseudomonas putida RuvAB Holliday-junction
  branch-migration complex, encoded in the ruvCAB locus. A AAA+ ATPase, it forms two homohexameric rings
  on opposite arms of a junction held open by RuvA and uses ATP hydrolysis to pump duplex DNA through
  the complex, moving the crossover so that RuvC can find and cleave its consensus site. Function is inferred
  from strong family and domain conservation with E. coli RuvB.
