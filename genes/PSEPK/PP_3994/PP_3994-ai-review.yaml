  label: Pseudomonas putida KT2440
description: PP_3994 is a TusC-family structural subunit predicted to join TusB and the sulfur-bearing
  TusD subunit in the soluble TusBCD complex. Its specific family signatures and neighboring tusD, tusB
  and tusE loci support participation in sulfur delivery for MnmA-dependent thiolation of tRNA wobble
  uridine U34. TusC organizes the relay complex rather than independently catalyzing tRNA thiolation.
