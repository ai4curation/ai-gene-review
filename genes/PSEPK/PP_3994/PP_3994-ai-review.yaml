description: PP_3994 encodes the TusC subunit of the TusBCD sulfur-transfer complex, encoded in the contiguous
  tusD-tusC-tusB-tusE locus (PP_3993-PP_3996) and carrying the TusC-family signatures. By orthology to
  Escherichia coli TusC it is a structural subunit of the heterohexameric TusBCD complex, whose TusD subunit
  carries persulfide sulfur from TusA to TusE in the relay that forms 2-thiouridine at the wobble position
  (U34) of tRNA. It has no gene symbol in UniProt.
