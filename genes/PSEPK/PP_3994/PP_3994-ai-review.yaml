  title: Mechanistic insights into sulfur relay by multiple sulfur mediators involved in thiouridine biosynthesis
    at tRNA wobble positions.
  full_text_unavailable: true
  findings:
  - statement: The E. coli study reconstitutes thiolation with IscS, TusA, TusBCD, TusE and MnmA and resolves
      intermediate sulfur-transfer interactions.
    supporting_text: Efficient 2-thiouridine formation in vitro was reconstituted with recombinant TusA,
      a TusBCD complex, TusE, and previously identified IscS and MnmA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; full primary text not obtained. The explicitly reported reconstitution
      and transfer results support conserved roles, not direct KT2440 activity or an independently resolved
      terminal covalent handoff.
- id: PMID:16472754
  title: Structural basis for sulfur relay to RNA mediated by heterohexameric TusBCD complex.
  full_text_unavailable: true
  findings:
  - statement: E. coli TusBCD is a heterohexamer, and active-site mutagenesis places the sulfur-bearing
      role on TusD Cys78.
    supporting_text: Here, we solved the 2.15 angstroms crystal structure of the E. coli TusBCD complex,
      a sulfur transfer mediator, forming a heterohexamer composed of a dimer of the heterotrimer.
  - statement: TusD, rather than TusB or TusC, supplies the implicated covalent sulfur-transfer residue.
    supporting_text: In vivo mutant analyses revealed that only Cys78, in the TusD subunit, participates
      in sulfur transfer during the s2U modification process.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract explicitly reports E. coli structural and mutant results; full primary
      text inaccessible. KT2440 complex composition and site correspondence are inferred from specific
      signatures, sequence alignment and locus context.
