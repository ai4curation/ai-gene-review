description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  CP069317.1_106 is "DUF7844 family exported protein involved in tolerance to
  benzethonium chloride and benzalkonium chloride" (tier A, Dark-Function), with two GO
  terms: GO:0009410 response to xenobiotic stimulus and GO:0005576 extracellular region.
  The exact-sequence UniProt entries are deleted, so the call is scored on the KT2440
  reference-proteome entry Q88RI0 (PP_0149), 97.1% identical over all 651 residues. The
  call's text is accurate as far as it goes. The domain (DUF7844 plus Lnb_N) and the
  export (Sec signal peptide, no membrane segment) are right. Orthologues at about 75%
  identity are required for fitness under benzethonium or benzalkonium chloride in five
  Pseudomonas strains, and the Fitness Browser calls these specific phenotypes. But the
  phenotype is not specific to this gene in the sense of a dedicated QAC function: each
  QAC experiment flags 58-176 genes, mostly envelope-maintenance genes, the P. stutzeri
  orthologue is also needed under bacitracin and polymyxin B, and the orthologues are
  cofit with FtsEX, lytic transglycosylases, Pqi/MCE and the DUF1302 outer membrane
  protein. QAC tolerance is therefore best read as an envelope-integrity phenotype. In
  KT2440 itself PP_0149 has no phenotype in 300 experiments, none with QACs. The call
  also missed the invariant HExxH zincin-like motif in DUF7844 and the operon partner
  PP_0150 (DUF2388), whose orthologue is the second-best cofitness partner and shares the
  QAC phenotype; the dashboard's neighbourhood block omits PP_0150 altogether. Both
  extracted GO terms are scored UNC. GO:0009410 rests on necessity (mutant
  sensitivity), not on a response process, and is not tested in KT2440. GO:0005576
  over-translates "exported": the evidence fits the periplasm better than the medium.
  The recommended dashboard verdict is "supported" with caveats, and the suggested
  corrected annotation is "Exported, probably periplasmic, DUF7844/Lnb_N protein with a
  conserved HExxH zincin-like motif; orthologues required for tolerance to quaternary
  ammonium biocides and other envelope stresses; molecular function unknown."
