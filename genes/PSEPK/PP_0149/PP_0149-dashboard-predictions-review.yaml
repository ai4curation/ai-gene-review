predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The term is not in GOA for Q88RI0. Its basis is that orthologues about 75%
      identical to PP_0149 are required for fitness under benzethonium or benzalkonium
      chloride in five Pseudomonas strains (strongest fit -5.2, t -23 in FW300-N2C3),
      which the Fitness Browser calls specific phenotypes. That is necessity evidence:
      it shows mutants are sensitive, not that the protein takes part in a process
      triggered by the compound. The phenotype is also shared widely. Each QAC experiment
      flags 58-176 genes, mostly envelope-maintenance genes; the P. stutzeri orthologue
      is also needed under bacitracin and polymyxin B; and the orthologues are cofit with
      FtsEX and envelope genes. Together these point to an envelope barrier role, a
      pleiotropic effect rather than a xenobiotic response. KT2440 was never tested with
      QACs and shows no phenotype in 300 other experiments. Nothing refutes a role in QAC
      tolerance, so the score is UNC rather than incorrect. What is missing is a direct
      QAC test in P. putida and any mechanism linking the protein to the compound.
