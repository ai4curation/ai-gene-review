- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005576
    label: extracellular region
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      GOA has no location for Q88RI0. The evidence supports export across the inner
      membrane: SignalP and DeepTMHMM both predict a cleavable Sec signal peptide at
      1-22 with no membrane segment and no lipobox. DeepTMHMM itself says "periplasmic
      or secreted", though, and the extractor turned "exported" into extracellular
      region. Several lines favour the periplasm instead (GO:0042597, proposed as NEW
      in the companion review). The Lnb_N domain is defined by Pfam as a periplasmic
      domain. The orthologues give strong cell-autonomous defects in pooled fitness
      assays, which is unexpected for a secreted public good. They are also cofit with
      periplasmic envelope machinery. No secretion-system signal or fractionation data
      exist for any family member, so release to the medium is neither shown nor
      excluded. UNC; the missing evidence is cell fractionation or secretome data.
    supported_by:
    - reference_id: file:PSEPK/PP_0149/PP_0149-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: The mature protein is therefore SOLUBLE AND EXPORTED -- periplasmic or secreted -- rather than membrane-embedded.
    - reference_id: file:PSEPK/PP_0149/PP_0149-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: The term 'exported protein' and the trace's conclusion that it is a 'soluble exported protein' support the cellular component 'extracellular region' (CC).
