product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0149 encodes a 651-residue exported protein of unknown molecular function. It has a
  cleavable Sec signal peptide (residues 1-22, no lipobox) and no membrane-spanning
  segment, followed by an N-terminal DUF7844 domain (PF25226, residues 25-254) and a
  central Lnb_N domain (PF13387, 272-430); the last ~220 residues have no domain
  assignment. Pfam describes DUF7844 as predicted to resemble the M90 (MtfA)
  metallopeptidase fold, and PP_0149 carries an HExxH motif (H123-E124-x-x-H127) that is
  invariant across 32 family representatives (27-69% identity), together with a
  downstream Glu (E209) conserved in every aligned representative, as expected for a
  gluzincin-type zinc site. Lnb_N is the periplasmic catalytic domain of the Bacteroides
  lipoprotein N-acyltransferase Lnb, an NlpC/P60-like Cys enzyme; the Lnb_N region of
  PP_0149 has conserved His300, Cys308, Cys318 and an Asn409-Cys410 pair. No member of
  the DUF7844 family (576 UniProtKB entries, almost all Gammaproteobacteria, all but two
  with Lnb_N) has been characterized, so whether either putative active site is
  catalytic, and on what substrate, is unknown. PP_0149 lies at the end of a likely
  operon with PP_0150 and PP_0151, two small exported DUF2388 proteins (PP_0150 overlaps
  the PP_0149 start codon by 4 bp). In KT2440 PP_0149 transposon mutants have no fitness
  phenotype in 300 Fitness Browser experiments, none of which used quaternary ammonium
  compounds. In five of eight other Pseudomonas strains, the orthologues (about 75%
  identical) are required for fitness under benzethonium chloride or benzalkonium
  chloride (strongest: fit -5.2 in P. fluorescens FW300-N2C3), and in P. stutzeri RCH2
  also under bacitracin and polymyxin B. This is a real and conserved phenotype but not a
  dedicated one: each such experiment flags 58-176 genes, dominated by
  envelope-maintenance systems (Mla, Pqi/MCE, FtsEX and amidases, lytic
  transglycosylases, LPS core kinases), and the orthologues are strongly cofit with the
  PP_0150 orthologue, with the DUF1302 outer membrane protein (PP_0765 orthologue) and
  with FtsEX and other envelope genes. PP_0149 is best described as an exported, probably
  periplasmic, putative zinc peptidase-like protein that contributes to cell envelope
  integrity; its biochemical activity is not known.
existing_annotations:
- term:
    id: GO:0008237
    label: metallopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR024079
  review:
    summary: >-
      Plausible by sequence: the DUF7844 domain is predicted to adopt an M90-like zincin
      fold and carries an invariant HExxH motif plus a conserved downstream Glu, but no
      member of the family has been assayed.
    action: ACCEPT
    reason: >-
      The InterPro2GO mapping comes from a weak Gene3D metallopeptidase catalytic domain
      superfamily hit (IPR024079; residues 118-257, E = 5.6e-05). It is backed by two
      stronger, independent sequence observations. The Pfam curators describe DUF7844 as
      predicted to resemble the glucose-regulated M90 metallopeptidase (MtfA), whose
      E. coli member is a zinc-dependent aminopeptidase. In our alignment of Q88RI0
      against 32 DUF7844 representatives from 30 genera (27-69% identity), H123, E124 and
      H127 of the HExxH zinc-binding motif are conserved in all of them, and E209, a
      candidate third zinc ligand of a gluzincin site, is conserved in every aligned
      sequence (one representative has a gap there). That pattern argues for a retained
      catalytic site rather than a pseudo-peptidase. The term is kept at the general
      metallopeptidase level: the substrate, the exo/endo mode and even the activity are
      untested, and a more specific term (such as metalloaminopeptidase activity by
      analogy to MtfA) would over-reach for a divergent two-domain, exported relative.
      This is a sequence inference, not an observation on PP_0149.
    supported_by:
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/family_pfam_interpro.txt
      supporting_text: It is predicted to fold onto a structure with significant similarity to Glucose-regulated metallo-peptidase M90.
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
      supporting_text: 'H123: conserved in 100% of representatives'
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
      supporting_text: 'H127: conserved in 100% of representatives'
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
      supporting_text: 'E209: conserved in 97% of representatives'
    - reference_id: file:PSEPK/PP_0149/PP_0149-deep-research-claude-code.md
      supporting_text: A scan of the Q88RI0 sequence finds one HExxH motif, **H123-E124-L-T-H127**, in the context `ATVLHELTHLYDRARLW`.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IC
  original_reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
  qualifier: located_in
  review:
    summary: >-
      PP_0149 is exported across the inner membrane and most likely resides in the
      periplasm.
    action: NEW
    reason: >-
      GOA has no location term for Q88RI0. Three lines point to a periplasmic, rather
      than a secreted, soluble protein. (1) SignalP (UniProt) and DeepTMHMM (dashboard
      query, 97.1% identical) both predict a cleavable Sec signal peptide at 1-22 and no
      membrane-spanning segment; the N-terminus has no lipobox, so it is not a
      lipoprotein. (2) Its Lnb_N domain is, by its Pfam definition, the periplasmic
      domain of the Bacteroides lipoprotein N-acyltransferase Lnb. (3) In pooled
      transposon fitness assays the orthologues have strong, cell-autonomous defects
      (fit -5.2 in FW300-N2C3), which is hard to reconcile with a freely secreted protein
      whose loss would be complemented by the rest of the pool, and the orthologues are
      cofit with periplasmic envelope machinery. No fractionation has been done, so
      release to the medium is not excluded; this is an inference (IC) from sequence and
      fitness data.
    supported_by:
    - reference_id: file:PSEPK/PP_0149/PP_0149-uniprot.txt
      record_section:
      - FT:SIGNAL
      supporting_text: SIGNAL          1..22
    - reference_id: file:PSEPK/PP_0149/PP_0149-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: 'Membrane-spanning segments: none (neither alpha-helical nor beta-strand)'
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
      supporting_text: 'lipobox in signal-peptide cleavage region: False'
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/family_pfam_interpro.txt
      supporting_text: PF13387 Lnb N-terminal periplasmic domain
    - reference_id: file:PSEPK/PP_0149/PP_0149-bioinformatics/PP_0149_summary.txt
