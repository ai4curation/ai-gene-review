suggested_questions:
- question: Is the DUF7844 HExxH site of PP_0149 an active zinc peptidase, and does the Lnb_N Cys410 (or Cys308/Cys318) form a second Cys-dependent active site?
- question: Do PP_0149, PP_0150 and PP_0151 act together with the DUF1302/DUF1329 outer membrane system (PP_0765/PP_0766) on a shared envelope substrate, as the conserved cofitness of their orthologues suggests?
- question: Does deletion of PP_0149 sensitize KT2440 to benzalkonium or benzethonium chloride, which the KT2440 Fitness Browser experiments never tested?
suggested_experiments:
- description: Test a clean KT2440 PP_0149 deletion, with complementation and H123A/E124A and C410S point mutants, for MIC and growth under benzalkonium chloride, benzethonium chloride, polymyxin B and bacitracin, and assay outer membrane permeability (NPN uptake).
  experiment_type: targeted genetics and physiology
- description: Purify the mature protein (23-651) and assay zinc-dependent peptidase activity on aminoacyl-pNA substrates and envelope peptides, with EDTA/phenanthroline inhibition; determine localization by cell fractionation of a tagged protein.
  experiment_type: biochemistry and localization
