core_functions:
- description: >-
    Exported, probably periplasmic, two-domain protein with a conserved HExxH
    zincin-like (M90-like) motif in its DUF7844 domain and a conserved Cys/His Lnb_N
    (NlpC/P60-like) domain, encoded with the small exported DUF2388 proteins PP_0150 and
    PP_0151. Orthologues in other Pseudomonas species are required for tolerance of
    quaternary ammonium biocides (benzethonium and benzalkonium chloride) and, in
    P. stutzeri, of bacitracin and polymyxin B, together with many envelope-maintenance
    genes, consistent with a contribution to cell envelope integrity. Its catalytic
    activity, substrate and molecular role are unknown; the metallopeptidase activity is
    a sequence-based inference.
  molecular_function:
    id: GO:0008237
    label: metallopeptidase activity
  locations:
