- id: PMID:39495918
  title: Identification and characterization of the lipoprotein N-acyltransferase in Bacteroides.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Defines the function of the founding Lnb_N (DUF4105) protein: Bacteroides Lnb is a
      membrane lipoprotein N-acyltransferase whose periplasmic DUF4105 domain resembles
      NlpC/P60 Cys enzymes, with Cys148 essential. PP_0149 shares only the Lnb_N domain,
      lacks Lnb's five transmembrane helices and has a different domain partner
      (DUF7844), and gammaproteobacteria such as P. putida have the canonical Lnt. The
      paper informs the likely fold and Cys-dependent chemistry of the PP_0149 Lnb_N
      region, not its substrate.
  findings:
  - statement: Lnb is a lipoprotein N-acyltransferase distinct from Lnt.
    supporting_text: Herein, we have identified a protein distinct from Lnt responsible for the same process in Bacteroides, named lipoprotein N-acyltransferase in Bacteroides (Lnb).
  - statement: Lnb is a polytopic membrane protein whose periplasmic domain is DUF4105 (now Lnb_N).
    supporting_text: At 398 amino acids, Lnb is predicted to have five transmembrane helices and a periplasmic domain containing a DUF4105
  - statement: A Cys in the NlpC/P60-like periplasmic domain is essential for Lnb activity.
    supporting_text: Only Lnb(C198S) could restore N-acylation activity to Δlnb cells, suggesting that C148 is essential for activity of Lnb
