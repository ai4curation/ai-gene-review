description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_BCBP01000038.1_47 is "AsmA-related inner membrane protein involved in outer
  membrane biogenesis" (tier B), with two GO terms: GO:0043165 Gram-negative-
  bacterium-type cell outer membrane assembly and GO:0005886 plasma membrane.
  The query is 99.1% identical over its full 978 residues to KT2440 PP_4704
  (Q88DW4), so it is scored on that accession. The call is supported, and
  better supported than the annotator could show. PP_4704 is the
  reciprocal-best-hit orthologue of P. aeruginosa PA4735 (EpaF; 64.9% identity
  over 977 aligned residues in this review's alignment; the dashboard reports
  58.1% for the same PAO1 homolog). It is not an orthologue of E. coli AsmA,
  TamB, YhdP, YdbH, YicH or YhjG, with which it shares only the AsmA-like/DUF748
  family. Sposato et al. 2024 (PMID:38305166) showed genetically that EpaF is
  one of four redundantly essential AsmA-like proteins needed for growth and
  outer-membrane integrity in P. aeruginosa, and that overexpressed EpaF alone
  can replace YhdP, TamB and YdbH. The dashboard evidence showed only snippets
  of that paper, and the annotator did not identify its homolog as EpaF or
  state that the genetic data are for the orthologue. No data exist for the
  P. putida protein: KT2440 RB-TnSeq (300 experiments, BERDL copy of the
  Fitness Browser) shows no phenotype for PP_4704 mutants, as expected under
  redundancy with TamB (PP_2893) and YhdP (PP_0938). The process claim therefore
  rests on orthology to a genetically characterized protein, not on data for
  this gene. The "OmpA-like C-terminal domain" mentioned in the call is a weak
  Gene3D/SUPERFAMILY superfamily hit (HMM coverage 0.8%) and should not be read
  as a peptidoglycan-binding OmpA domain.
