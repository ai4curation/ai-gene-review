- id: PMID:38305166
  title: Redundant essentiality of AsmA-like proteins in Pseudomonas aeruginosa.
  findings:
  - statement: PA4735 is one of four redundantly essential AsmA-like proteins in P. aeruginosa.
    supporting_text: four AsmA-like proteins are redundantly essential for growth and OM integrity in P. aeruginosa, including a novel AsmA-like protein (PA4735) that is not present in E. coli.
  - statement: Overexpressed PA4735 replaces YhdP, TamB and YdbH.
    supporting_text: when overexpressed, PA4735 is able to sustain growth and OM integrity even in the absence of the other essential AsmA-like proteins YhdP, TamB, and YdbH.
  - statement: All P. aeruginosa AsmA-like proteins have an N-terminal transmembrane helix.
    supporting_text: All P. aeruginosa AsmA-like proteins are predicted to share an N-terminal TMH and an elongated tube-like structure rich in β-strands with a lateral opening along the long axis
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and novel (GOA for Q88DW4 has only plasma membrane and a
      TreeGrafter "regulation of protein targeting to membrane"). PP_4704 is the
      full-length reciprocal-best-hit orthologue of P. aeruginosa EpaF/PA4735
      (homology_results.json). Genetic work on EpaF shows that it is redundantly
      essential, with YhdP, TamB and YdbH, for growth and outer-membrane
      integrity, and that it can replace all three when overexpressed
      (PMID:38305166). Participation in outer-membrane biogenesis is therefore
      a well-grounded orthology transfer. It is an inference: PP_4704 itself has
      not been tested, and its KT2440 RB-TnSeq profile is flat
      (asma_paralog_fitness.json), which fits redundancy with TamB and YhdP and
      neither supports nor refutes the claim. The annotator reached the right
      answer from family labels and paper snippets without identifying the
      homolog as EpaF.
    supported_by:
    - reference_id: PMID:38305166
      supporting_text: four AsmA-like proteins are redundantly essential for growth and OM integrity in P. aeruginosa, including a novel AsmA-like protein (PA4735) that is not present in E. coli.
    - reference_id: PMID:38305166
      supporting_text: when overexpressed, PA4735 is able to sustain growth and OM integrity even in the absence of the other essential AsmA-like proteins YhdP, TamB, and YdbH.
    - reference_id: file:PSEPK/PP_4704/PP_4704-dashboard-prediction-evidence/homology_results.json
      supporting_text: '"pct_id": 64.9'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct but not novel: GO:0005886 is already in GOA for Q88DW4 as a
      TreeGrafter IEA. The query has one N-terminal transmembrane helix
      (residues 4-32) and no signal peptide, with the remaining 946 residues
      outside the cytoplasm. That is the inner-membrane anchor that Sposato et
      al. predict for all P. aeruginosa AsmA-like proteins. Localization has not
      been determined experimentally for PP_4704 or EpaF.
    supported_by:
