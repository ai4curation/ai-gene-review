      supporting_text: '"pct_id": 64.9'
    - reference_id: PMID:38305166
      supporting_text: when overexpressed, PA4735 is able to sustain growth and OM integrity even in the absence of the other essential AsmA-like proteins YhdP, TamB, and YdbH.
- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: ISS
  original_reference_id: PMID:38305166
  qualifier: involved_in
  review:
    summary: By orthology with P. aeruginosa EpaF (PA4735), which is redundantly essential for growth and outer-membrane integrity.
    action: NEW
    reason: >-
      PP_4704 and PA4735 are reciprocal best hits among the KT2440 and PAO1
      AsmA-like proteins (64.9% identity over 977 aligned residues covering both
      full sequences; homology_results.json). In P. aeruginosa, deleting PA4735
      worsens the growth and outer-membrane permeability defects of tamB yhdP
      mutants. A tamB yhdP ydbH PA4735 quadruple mutant could not be obtained,
      and overexpressing PA4735 rescues growth and vancomycin resistance of the
      triple mutant (PMID:38305166). This is genetic evidence for a role in
      outer-membrane biogenesis, transferred by orthology. PP_4704 itself has not
      been tested.
    supported_by:
    - reference_id: PMID:38305166
      supporting_text: four AsmA-like proteins are redundantly essential for growth and OM integrity in P. aeruginosa, including a novel AsmA-like protein (PA4735) that is not present in E. coli.
    - reference_id: PMID:38305166
      supporting_text: Several attempts to obtain a quadruple deletion mutant in tamB, yhdP, ydbH, and PA4735 failed, corroborating the hypothesis that PA4735 could be essential in YhdP-, TamB-, and YdbH-deficient cells.
    - reference_id: file:PSEPK/PP_4704/PP_4704-bioinformatics/homology_results.json
