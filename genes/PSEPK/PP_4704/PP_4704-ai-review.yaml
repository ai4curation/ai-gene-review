core_functions:
- description: >-
    Inner-membrane-anchored AsmA-like (bridge-like, repeating beta-groove)
    protein of the Pseudomonas-specific EpaF subfamily that contributes,
    redundantly with TamB and YhdP, to outer-membrane biogenesis, probably by
    moving glycerophospholipids from the inner to the outer membrane. Inferred
    from its P. aeruginosa orthologue PA4735; untested in P. putida.
  directly_involved_in:
