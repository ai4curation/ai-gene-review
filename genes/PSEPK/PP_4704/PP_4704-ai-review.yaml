  review:
    summary: Inner (plasma) membrane location is consistent with the single N-terminal transmembrane anchor shared by AsmA-like proteins.
    action: ACCEPT
    reason: >-
      DeepTMHMM predicts one alpha-helical transmembrane segment at residues
      4-32, with no signal peptide and the remaining 946 residues outside the
      cytoplasm, which fits an inner-membrane anchor with a large periplasmic
      domain. Sposato et al. report that all P. aeruginosa AsmA-like proteins,
      including the orthologue PA4735, share an N-terminal TMH. Localization has
      not been tested experimentally for either protein.
