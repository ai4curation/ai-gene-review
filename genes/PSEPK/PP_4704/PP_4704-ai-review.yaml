suggested_questions:
- question: >-
    Does PP_4704 (or its orthologue EpaF/PA4735) move glycerophospholipids
    between the inner and outer membranes? The genetics show only that
    overexpressed EpaF is sufficient to replace YhdP, TamB and YdbH; no lipid
    transfer has been measured, and the E. coli comparators themselves carry
    only the broader GO:0015914 phospholipid transport in GOA, not GO:0120010.
