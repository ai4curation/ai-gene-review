description: >-
  PP_4704 (Q88DW4) is a 978-residue AsmA-like protein of the PTHR30441 family
  (subfamily SF8) with a DUF748 (PF05359) region and a single N-terminal
  transmembrane helix (DeepTMHMM residues 4-32), the rest of the protein
  predicted to lie outside the cytoplasm. It is the reciprocal-best-hit
  orthologue of Pseudomonas aeruginosa PA4735 (EpaF, Q9HV64; 64.9% identity
  over 977 aligned residues, full length of both), a Pseudomonas-specific
  AsmA-like protein that is absent from E. coli. It is not an orthologue of any
  E. coli AsmA-like protein (AsmA, TamB, YhdP, YdbH, YicH, YhjG); local
  alignments to these cover at most about a quarter of PP_4704. Its KT2440
  AsmA-like paralogues are TamB (PP_2893), YhdP (PP_0938), YhjG (PP_4857), AsmA
  (PP_0287) and the short DUF748 protein PP_4572 (orthologue of PA2708); KT2440
  has no YdbH orthologue. In P. aeruginosa, EpaF is redundantly essential with
  YhdP, TamB and YdbH. A quadruple mutant could not be made, and
  overexpressed EpaF alone restores growth and outer-membrane integrity to a
  tamB yhdP ydbH triple mutant (PMID:38305166). Because YhdP, TamB and YdbH are
  the proposed bridge-like inner-to-outer-membrane phospholipid transporters
  (PMID:34781743, PMID:38748582), PP_4704 is best described by orthology as an
  inner-membrane-anchored AsmA-like protein that contributes to outer-membrane
  biogenesis, probably by moving glycerophospholipids across the periplasm.
  Nothing has been measured for PP_4704 itself. In KT2440 RB-TnSeq (300
  experiments, BERDL copy of the Fitness Browser) its transposon mutants have no
  phenotype (fitness between -0.72 and +0.31), including under polymyxin B. That
  is expected for a redundant member of this family and says nothing either
  way. Lipid-transfer activity has not been shown biochemically for EpaF.
