  review:
    summary: Not supported for PP_4704; the family-level term traces back to the old E. coli AsmA phenotype, not to anything known about the EpaF subfamily.
    action: REMOVE
    reason: >-
      This TreeGrafter term is propagated across PTHR30441 and appears to stem
      from E. coli AsmA, which was named for suppressing the assembly of
      mutant OmpF. PP_4704 is in subfamily SF8 and is not an AsmA orthologue
      (local alignment to E. coli AsmA covers 73 residues; homology_results.json).
      Its true orthologue, P. aeruginosa EpaF (PA4735), acts with YhdP, TamB and
      YdbH in outer-membrane lipid homeostasis (PMID:38305166). There is no
      evidence that any of these proteins regulates protein targeting to a
      membrane.
    supported_by:
