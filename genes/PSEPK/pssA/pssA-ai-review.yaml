id: Q88GQ4
gene_symbol: pssA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  pssA (PP_3664) encodes CDP-diacylglycerol--serine
  O-phosphatidyltransferase, the phosphatidylserine synthase that catalyzes the
  first of two consecutive reactions in the major bacterial
  phosphatidylethanolamine pathway. It transfers the phosphatidyl group of
  CDP-diacylglycerol to L-serine to form phosphatidylserine, which is then
  decarboxylated by Psd.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Generic catalytic activity is true but provides no information beyond the specific phosphatidyltransferase term.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003882 is the appropriate specific catalytic annotation.
- term:
    id: GO:0003882
    label: CDP-diacylglycerol-serine O-phosphatidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The submitted protein name, EC 2.7.8.8 assignment, and UniProt EC-to-GO mapping all support phosphatidylserine synthase activity.
    action: ACCEPT
    reason: This is the specific core molecular function of PssA.
    supported_by:
    - reference_id: file:PSEPK/pssA/pssA-deep-research-openscientist.md
      supporting_text: "The core function of PP_3664 is synthesis of phosphatidylserine as the obligatory precursor of phosphatidylethanolamine."
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: PssA lacks transmembrane helices, but cytoplasm is redundant with the more specific cytosol annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005829 already captures the soluble compartment at useful specificity.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble/peripheral phosphatidylserine synthase is assigned to the cytosol by TreeGrafter.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the soluble-state location, but do not use it as the core
      catalytic location because type-I PssA is active at the membrane surface.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:39693441
  qualifier: located_in
  review:
    summary: Type-I PssA carries out phosphatidylserine synthesis while peripherally associated with the cytoplasmic face of the inner membrane.
    action: NEW
    reason: >-
      The experimentally characterized E. coli type-I ortholog is active at
      the inner membrane surface, and Q88GQ4 has the same PLD-superfamily
      architecture.
    supported_by:
    - reference_id: PMID:39693441
      supporting_text: "the active state of PssA is associated with the inner membrane surface, contributing to PS synthesis, while the cytosolic form is inactive in this synthesis process"
- term:
    id: GO:0006793
    label: phosphorus metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: Phosphorus metabolism is technically true but far too broad to represent phosphatidylserine synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The specific lipid-biosynthetic reaction and pathway are more informative.
- term:
    id: GO:0008444
    label: CDP-diacylglycerol-glycerol-3-phosphate 3-phosphatidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This is phosphatidylglycerophosphate synthase activity, using glycerol-3-phosphate rather than serine, and is a distinct enzyme reaction.
    action: REMOVE
    reason: >-
      PssA is assigned EC 2.7.8.8 and GO:0003882. GO:0008444 corresponds to the
      PgsA reaction and conflicts with the protein name and substrate
      specificity; the InterPro mapping has over-propagated a different
      phospholipid-synthase activity.
    supported_by:
    - reference_id: file:PSEPK/pssA/pssA-notes.md
      supporting_text: "PssA uses L-serine to form phosphatidylserine; GO:0008444 instead denotes transfer to glycerol-3-phosphate."
- term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Cardiolipin biosynthesis proceeds through phosphatidylglycerol and cardiolipin synthase, not through the PssA phosphatidylserine reaction.
    action: REMOVE
    reason: >-
      This process annotation is inherited from the same inappropriate
      phosphatidylglycerol/cardiolipin family mapping as GO:0008444. PssA instead
      supplies phosphatidylserine to Psd for phosphatidylethanolamine
      biosynthesis.
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/pssA/pssA-notes.md
  qualifier: involved_in
  review:
    summary: PssA supplies phosphatidylserine to the terminal Psd reaction in phosphatidylethanolamine biosynthesis.
    action: NEW
    reason: >-
      The accepted phosphatidylserine-synthase activity and consecutive
      PssA-Psd pathway support this missing process annotation.
    supported_by:
    - reference_id: file:PSEPK/pssA/pssA-notes.md
      supporting_text: "PssA forms phosphatidylserine, which is the substrate for the consecutive Psd decarboxylation reaction."
