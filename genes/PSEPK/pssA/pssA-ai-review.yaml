- term:
    id: GO:0003882
    label: CDP-diacylglycerol-serine O-phosphatidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Combined electronic annotation (EC mapping plus TreeGrafter placement at
      the PAINT phosphatidylserine-synthase node PTN001758495). Q88GQ4 carries
      the PssA-specific NCBIfam and PIRSF signatures, and its type-I ortholog in
      E. coli is the biochemically characterized phosphatidylserine synthase.
    action: ACCEPT
    reason: This is the specific core molecular function of PssA.
    supported_by:
    - reference_id: file:PSEPK/pssA/pssA-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; NF006946; PRK09428.1; 1."
    - reference_id: file:PSEPK/pssA/pssA-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: "DR   PIRSF; PIRSF000850; Phospholipase_D_PSS; 1."
    - reference_id: PMID:39693441
      supporting_text: "Type I PssA belongs to the phospholipase D (PLD) superfamily"
    - reference_id: file:PSEPK/pssA/pssA-deep-research-openscientist.md
      supporting_text: "The core function of PP_3664 is synthesis of phosphatidylserine as the obligatory precursor of phosphatidylethanolamine."
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: PssA lacks transmembrane helices, but cytoplasm is redundant with the more specific cytosol annotation.
    action: TOO_GENERAL
    reason: >-
      True, but entailed by GO:0005829 cytosol, kept in this review; the active
      location is the cytoplasmic face of the inner membrane (GO:0005886).
    supported_by:
    - reference_id: PMID:39693441
      supporting_text: >-
        A peripheral membrane protein PssA can associate with the cellular
        membrane in its active state or exist in the cytosol in an inactive
        form.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble/peripheral phosphatidylserine synthase is assigned to the cytosol by TreeGrafter.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the soluble-state location, but do not use it as the core
      catalytic location because type-I PssA is active at the membrane surface.
    supported_by:
    - reference_id: PMID:39693441
      supporting_text: >-
        the active state of PssA is associated with the inner membrane surface,
        contributing to PS synthesis, while the cytosolic form is inactive in
        this synthesis process
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:39693441
  qualifier: located_in
  review:
    summary: Type-I PssA carries out phosphatidylserine synthesis while peripherally associated with the cytoplasmic face of the inner membrane.
    action: NEW
    reason: >-
      The experimentally characterized E. coli type-I ortholog is active at
      the inner membrane surface, and Q88GQ4 has the same PLD-superfamily
      architecture.
    supported_by:
    - reference_id: PMID:39693441
      supporting_text: "the active state of PssA is associated with the inner membrane surface, contributing to PS synthesis, while the cytosolic form is inactive in this synthesis process"
- term:
    id: GO:0008444
    label: CDP-diacylglycerol-glycerol-3-phosphate 3-phosphatidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This is phosphatidylglycerophosphate synthase activity, using glycerol-3-phosphate rather than serine, and is a distinct enzyme reaction.
    action: REMOVE
    reason: >-
      PssA is assigned EC 2.7.8.8 and GO:0003882. GO:0008444 corresponds to the
      PgsA reaction and conflicts with the protein name and substrate
      specificity; the InterPro mapping has over-propagated a different
      phospholipid-synthase activity.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0008444
      confidence: CONFIRMED
      explanation: >-
        The InterPro2GO mapping IPR016270 (PGS1) to GO:0008444 is applied to
        Q88GQ4, a type-I phosphatidylserine synthase (EC 2.7.8.8) that uses
        L-serine rather than glycerol-3-phosphate. IPR016270 spans eukaryotic
        PGS1 and bacterial type-I PssA; the mapping should be suppressed for
        the PssA members.
    supported_by:
    - reference_id: file:ECOLI/pssA/pssA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the conversion of cytidine diphosphate diacylglycerol (CDP-DG)
        and L-serine into phosphatidylserine (PubMed:39693441, PubMed:8824831).
    - reference_id: file:PSEPK/pssA/pssA-notes.md
      supporting_text: "PssA uses L-serine to form phosphatidylserine; GO:0008444 instead denotes transfer to glycerol-3-phosphate."
- term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Cardiolipin biosynthesis proceeds through phosphatidylglycerol and cardiolipin synthase, not through the PssA phosphatidylserine reaction.
    action: REMOVE
    reason: >-
      This process annotation is inherited from the same inappropriate
      phosphatidylglycerol/cardiolipin family mapping as GO:0008444. PssA instead
      supplies phosphatidylserine to Psd for phosphatidylethanolamine
      biosynthesis; in the E. coli type-I ortholog, loss of PssA raises rather
      than lowers phosphatidylglycerol and cardiolipin.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0032049
      confidence: CONFIRMED
      explanation: >-
        The InterPro2GO mapping IPR016270 (PGS1) to GO:0032049 is applied to
        Q88GQ4, a type-I phosphatidylserine synthase; the PGS1 cardiolipin
        process does not apply to bacterial PssA members of IPR016270.
    supported_by:
    - reference_id: PMID:179992
      supporting_text: >-
        while the combined levels of phosphatidylglycerol and cardiolipin rise
        from 34 to 68%.
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/pssA/pssA-notes.md
  qualifier: involved_in
  review:
    summary: PssA supplies phosphatidylserine to the terminal Psd reaction in phosphatidylethanolamine biosynthesis.
    action: NEW
    reason: >-
      The accepted phosphatidylserine-synthase activity and consecutive
      PssA-Psd pathway support this missing process annotation.
    supported_by:
    - reference_id: file:PSEPK/pssA/pssA-notes.md
      supporting_text: "PssA forms phosphatidylserine, which is the substrate for the consecutive Psd decarboxylation reaction."
