  title: OpenScientist deep research for pssA
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Supports Q88GQ4/PssA as the PLD-superfamily
      CDP-diacylglycerol-serine O-phosphatidyltransferase upstream of Psd and
      helps reject phosphatidylglycerophosphate/cardiolipin cross-mappings, but
      transfers the detailed biochemistry and membrane-association mechanism
      from orthologs rather than direct PP_3664 assays and mislabels the
      bacterial PLD-superfamily peripheral-membrane PssA architecture as type
      II instead of primary-literature type I.
  findings:
  - statement: >-
      The report supports the phosphatidylserine-synthase reaction and PLD
      architecture; its bacterial type label is corrected against primary
      literature in the manual notes.
- id: PMID:179992
  title: Phosphatidylserine synthetase mutants of Escherichia coli. Genetic mapping
    and membrane phospholipid composition.
  findings:
  - statement: >-
      E. coli pss mutants lose phosphatidylethanolamine and accumulate
      phosphatidylglycerol and cardiolipin.
