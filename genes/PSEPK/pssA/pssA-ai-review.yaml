id: Q88GQ4
gene_symbol: pssA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  pssA (PP_3664) encodes CDP-diacylglycerol--serine
  O-phosphatidyltransferase, the phosphatidylserine synthase that catalyzes the
  first of two consecutive reactions in the major bacterial
  phosphatidylethanolamine pathway. It transfers the phosphatidyl group of
  CDP-diacylglycerol to L-serine to form phosphatidylserine, which is then
  decarboxylated by Psd.
