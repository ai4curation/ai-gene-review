- id: PMID:39693441
  title: >-
    Structural basis for membrane association and catalysis by
    phosphatidylserine synthase in Escherichia coli
  findings:
  - statement: >-
      The primary structure study defines PLD-superfamily PssA as type I and
      characterizes its peripheral membrane association and catalytic
      mechanism.
