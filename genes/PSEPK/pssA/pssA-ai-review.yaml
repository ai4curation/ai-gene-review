    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic catalytic activity is true but provides no information beyond the specific phosphatidyltransferase term.
    action: TOO_GENERAL
    reason: >-
      True, but entailed by GO:0003882 CDP-diacylglycerol-serine
