- id: file:PSEPK/flgM/flgM-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on P. putida KT2440 flgM (PP_4395;
    UniProt Q88EQ8)
  findings:
  - statement: FlgM is a **protein anti-sigma factor** that binds the flagellar sigma factor
      **FliA (σ28)** and inhibits FliA-dependent transcription of late/class III-IV flagellar
      genes until assembly reaches the proper checkpoint.
  - statement: whose primary molecular role is to **bind/sequester FliA**, preventing FliA from
      associating with RNA polymerase and thereby blocking FliA-dependent transcription until
      a defined assembly checkpoint is satisfied.
  - statement: FlgM is a **cytoplasmic anti-σ factor** that antagonizes **FliA (σ28)**, thereby
      acting as a **negative regulator of late flagellar gene expression** (including flagellin/filament
      genes).
  - statement: FlgM must access FliA and therefore acts **in the cytoplasm** where σ factors
      and core RNA polymerase interact.
  - statement: FlgM represses FliA-dependent transcription **until HBB completion**, and **FlgM
      export/secretion** via the flagellar type III secretion system (FT3SS) relieves this repression
      by physically removing FlgM from the cytoplasm, freeing FliA.
  - statement: 'In *P. putida* KT2440, **flgM** is not an isolated gene: it is co-transcribed
      in a **flgM–flgN–pp4397 (flgZ)** tricistronic operon, experimentally supported by RT-PCR.'
  - statement: PP_4395** is explicitly annotated as **“Negative regulator of flagellin synthesis
      FlgM”** and is downregulated when FliA is absent, matching the canonical FliA–FlgM regulatory
      pair.
  - statement: '**Biological process:** timing/checkpoint control of late flagellar gene expression
      (filament and motility program) during flagellum biogenesis; integrates into three-tier
      flagellar transcriptional cascade.'
core_functions:
- description: FlgM is an anti-sigma-28 factor that binds and inhibits FliA (sigma-28), negatively
    regulating transcription of FliA-dependent late flagellar genes (including flagellin) to
    time their expression with the flagellar assembly checkpoint.
