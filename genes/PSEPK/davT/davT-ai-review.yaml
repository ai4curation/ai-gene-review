taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: DavT is a pyridoxal-phosphate-dependent 5-aminovalerate aminotransferase. It transfers the
  amino group of 5-aminovalerate to 2-oxoglutarate, producing 5-oxopentanoate and L-glutamate in the Dav
  route of L-lysine catabolism.
