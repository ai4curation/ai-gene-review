    supporting_text: "sets of data suggest that the product of this gene has delta-aminovalerate \naminotransferase\
      \ activity."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract claims verified; full text is unavailable locally.
