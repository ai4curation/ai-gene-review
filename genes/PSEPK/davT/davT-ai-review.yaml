suggested_questions:
- question: Does KT2440 DavT have physiologically relevant GABA transaminase activity, or is that annotation
    solely a family-level transfer?
suggested_experiments:
- description: Compare purified DavT kinetics with 5-aminovalerate and GABA, then test a davT deletion
    on each substrate as sole carbon source.
