description: >-
  KdsC is the magnesium-dependent KDO-8-phosphate phosphatase of CMP-KDO
  biosynthesis. It hydrolyzes KDO-8-phosphate to free KDO, which KdsB then
  activates for lipopolysaccharide inner-core assembly.
