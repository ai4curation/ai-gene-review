- term:
    id: GO:0019294
    label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
  qualifier: involved_in
  review:
    summary: KdsC produces free KDO, the last step of KDO formation.
    action: NEW
    reason: >-
      KDO 8-phosphate hydrolysis is the final reaction of KDO biosynthesis, as established for the E.
      coli ortholog YrbI/KdsC; Q88P96 belongs to the same KdsC family (TIGR01670, PIRSF006118).
    supported_by:
    - reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the hydrolysis of 3-deoxy-D-manno-octulosonate 8-phosphate (KDO 8-P) to 3-deoxy-D-manno-octulosonate
        (KDO) and inorganic phosphate
    - reference_id: PMID:12639950
      supporting_text: >-
        is the last enzyme in the KDO biosynthetic pathway for which the gene has not been identified
- term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
  qualifier: involved_in
  review:
    summary: KdsC supplies KDO for lipopolysaccharide inner-core assembly.
    action: NEW
    reason: >-
      KDO made by KdsC is activated by KdsB and transferred to lipid A by WaaA; the E. coli kdsC locus
      is part of the KDO biosynthesis genes required for the LPS inner core. Ortholog inference, not KT2440
      evidence.
    supported_by:
    - reference_id: PMID:16765569
      supporting_text: Two recently identified genes involved in KDO biosynthesis, kdsD and kdsC
    - reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01670; KdsC-phosphatas; 1.
