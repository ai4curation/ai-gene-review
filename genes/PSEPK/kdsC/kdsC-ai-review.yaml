      supporting_text: >-
        Catalyzes the hydrolysis of 3-deoxy-D-manno-octulosonate 8-phosphate (KDO 8-P) to 3-deoxy-D-manno-octulosonate
        (KDO) and inorganic phosphate
    - reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
