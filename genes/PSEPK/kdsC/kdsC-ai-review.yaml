id: Q88P96
gene_symbol: kdsC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  KdsC is the magnesium-dependent KDO-8-phosphate phosphatase of CMP-KDO biosynthesis. It hydrolyzes KDO-8-phosphate
  to free KDO, which KdsB then activates for lipopolysaccharide inner-core assembly.
existing_annotations:
- term:
    id: GO:0008781
    label: N-acylneuraminate cytidylyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      This TreeGrafter transfer of CMP-sialic acid synthetase activity conflicts with the KdsC phosphatase
      assignment.
    action: REMOVE
    reason: >-
      GO:0008781 is defined as "CTP + N-acylneuraminate = diphosphate + CMP-N-acylneuraminate". Q88P96
      is a 174-residue HAD-superfamily KdsC (TIGR01670, PIRSF006118) that hydrolyses KDO 8-phosphate and
      has no cytidylyltransferase domain. PTHR21485 mixes CMAS/NeuA cytidylyltransferases with standalone
      KdsC phosphatases; the PAINT IBD at PTN000486303 is seeded only by cytidylyltransferases, and no
      KdsC protein is a leaf of the PANTHER tree, so the TreeGrafter call is an over-propagation to a
      protein lacking the transferase chemistry.
    supported_by:
    - reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01670; KdsC-phosphatas; 1.
    - reference_id: file:PSEPK/kdsC/kdsC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the hydrolysis of 3-deoxy-D-manno-octulosonate 8-phosphate (KDO 8-P) to 3-deoxy-D-manno-octulosonate
        (KDO) and inorganic phosphate
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      requested_change: DELETE_ROW
      asserted_value: GO:0008781
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        TreeGrafter assigns N-acylneuraminate cytidylyltransferase activity from PTHR21485 node PTN000486303
        to Q88P96, a standalone HAD-family KDO 8-phosphate phosphatase (KdsC, TIGR01670) without a cytidylyltransferase
        domain. The PAINT IBD at PTN000486303 is seeded only by CMAS/NeuA cytidylyltransferases and no
        KdsC protein is a leaf of the family tree; KdsC-only members of PTHR21485 should not inherit GO:0008781.
- term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
