suggested_questions:
- question: To what extent does cognate SsuE versus alternative KT2440 flavin reductases supply FMNH2
    to SsuD under different sulfur-limitation conditions?
- question: What is the in vivo alkanesulfonate substrate range of KT2440 SsuD, and does it show the same
    chain-length dependence (poor short-chain turnover) reported for other SsuD enzymes?
suggested_experiments:
- description: Assay SsuD desulfonation activity (sulfite release and aldehyde product formation) reconstituted
    with the cognate SsuE FMN reductase across a range of Cn-alkanesulfonates, and monitor KT2440 wild-type
    vs ΔssuD growth on representative alkanesulfonates as sole sulfur sources under sulfate limitation.
  experiment_type: enzyme reconstitution and sulfur-source growth assay
