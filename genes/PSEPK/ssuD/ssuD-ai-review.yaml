  label: Pseudomonas putida KT2440
description: SsuD (PP_0238) is an FMNH2-dependent alkanesulfonate monooxygenase in Pseudomonas putida
  KT2440. Its SsuD-family chemistry is the oxidative cleavage of alkanesulfonates to an aldehyde and sulfite,
  supporting sulfur acquisition. Reduced FMN is supplied by a separate reductase such as SsuE. Native
  ssuD deletion affects growth on selected sulfonates, while purified-target substrate kinetics and the
  relative contributions of different flavin suppliers remain unresolved.
