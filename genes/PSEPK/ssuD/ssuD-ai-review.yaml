  findings:
  - statement: Native KT2440 ssuD deletion reduces growth with several tested sulfonates; this is physiological
      evidence, not purified-target turnover.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Garret William O'Connell, Refactoring native metabolism in Pseudomonas putida towards
      production and incorporation of novel fluorinated building blocks (DTU doctoral thesis, 2024), chapter
      1. Methods, strain tables, Results, Figure 4 (PDF pages 37-38) and locus map inspected. The chapter
      was a manuscript in preparation at thesis submission; no journal version was established. Growth
      is a composite fitness score, not direct transport flux. Possible sulfate contamination affects
      some substrate conditions, so no broad PFAS or arylsulfonate activity is inferred.
