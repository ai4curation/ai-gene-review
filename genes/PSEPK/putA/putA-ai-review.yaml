- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: The exact membrane-face localization of KT2440 PutA remains unresolved.
    action: UNDECIDED
    reason: The frozen UniProt cross-reference traces this location to TreeGrafter, not a target
      localization assay or an independently curated subcellular-location statement. Family quinone
      chemistry makes membrane interaction plausible, but the available KT2440/KT2442 promoter experiments
      and isolated PpPutA45 DNA-binding fragment do not establish where the full-length enzyme performs
      catalysis. Unlike GsPutA, no target quinone-site/membrane-approach structure is available;
      unlike the reviewed BjPutA PAINT inference, target placement in the available tree could not
      be resolved. The broad family review cannot by itself settle this precise side-of-membrane
      claim. Retain the source row as UNDECIDED, consistently with the unresolved CfPutA and G27
      location rows, without claiming that membrane association is absent.
    supported_by:
    - reference_id: PMID:28712849
      supporting_text: Bifunctional PutAs must interact with the membrane to couple electron transfer
        from proline to quinone electron acceptors in the membrane, thus completing the proline:ubiquinone
        oxidoreductase catalytic cycle.
