id: Q88D80
gene_symbol: putA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  putA encodes a large fused proline-utilization protein with FAD-dependent
  proline dehydrogenase and NAD-dependent glutamate-5-semialdehyde dehydrogenase
  domains. It converts L-proline to L-glutamate in two coupled oxidative steps
  and also represses the divergently transcribed putA and putP promoters.
existing_annotations:
  - term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: The N-terminal PutA RHH domain binds the conserved put control DNA sequence.
      action: ACCEPT
      reason: >-
        Direct structural and binding experiments with the P. putida PutA
        N-terminal domain establish sequence-specific binding to put control DNA.
      supported_by:
        - reference_id: PMID:18767154
          supporting_text: PpPutA45 was shown to bind a 14 base-pair DNA oligomer
  - term:
      id: GO:0001217
      label: DNA-binding transcription repressor activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: DNA-binding transcription repressor activity is directly supported for P. putida PutA.
      action: ACCEPT
      reason: putA knockout causes constitutive expression of both put promoters, while a catalytically inactive PutA retains regulation.
      supported_by:
        - reference_id: PMID:11097893
          full_text_unavailable: true
          supporting_text: The PutA protein acts as a repressor of put gene expression in P. putida
        - reference_id: PMID:11097893
          full_text_unavailable: true
          supporting_text: This regulatory activity is independent of the catabolic activity of PutA
  - term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The generic transcription-factor term is sound but less informative than the supported repressor term.
      action: MODIFY
      reason: Direct P. putida evidence establishes repression rather than an unspecified transcription-factor activity.
      proposed_replacement_terms:
        - id: GO:0001217
          label: DNA-binding transcription repressor activity
      supported_by:
        - reference_id: PMID:11097893
          full_text_unavailable: true
          supporting_text: The PutA protein acts as a repressor of put gene expression in P. putida
  - term:
      id: GO:0003842
      label: L-glutamate gamma-semialdehyde dehydrogenase (NAD+) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The NAD-dependent second oxidation step is a core PutA activity.
      action: ACCEPT
      reason: The exact UniProt record assigns EC 1.2.1.88 and RHEA:30235, and the P. putida study identifies the corresponding C-terminal domain.
      supported_by:
        - reference_id: file:PSEPK/putA/putA-uniprot.txt
          supporting_text: "Reaction=L-glutamate 5-semialdehyde + NAD(+) + H2O = L-glutamate + NADH"
        - reference_id: PMID:10613867
          full_text_unavailable: true
          supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
  - term:
      id: GO:0004657
      label: proline dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: FAD-dependent proline dehydrogenase is the first core PutA activity.
      action: ACCEPT
      reason: The exact record assigns EC 1.5.5.2 and RHEA:23784, and direct P. putida work places the proline-dehydrogenase region in PutA.
      supported_by:
        - reference_id: file:PSEPK/putA/putA-uniprot.txt
          supporting_text: "Reaction=L-proline + a quinone = (S)-1-pyrroline-5-carboxylate"
        - reference_id: PMID:10613867
          full_text_unavailable: true
          supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
  - term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The generic regulation term is correct but less informative than the supported negative-regulation child.
      action: MODIFY
      reason: Promoter-expression experiments establish repression, which is captured specifically by GO:0045892.
      proposed_replacement_terms:
        - id: GO:0045892
          label: negative regulation of DNA-templated transcription
      supported_by:
        - reference_id: PMID:11097893
          full_text_unavailable: true
          supporting_text: expression from the put promoters is constitutive in a host background with a knockout putA gene
  - term:
      id: GO:0006562
      label: L-proline catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: PutA performs both oxidative steps of L-proline catabolism to glutamate.
      action: ACCEPT
      reason: A putA insertion prevents growth on proline as sole carbon and nitrogen source, and the fused protein carries both catalytic domains.
      supported_by:
        - reference_id: PMID:10613867
          full_text_unavailable: true
          supporting_text: unable to grow with proline as the sole carbon and nitrogen source
        - reference_id: PMID:10613867
          full_text_unavailable: true
          supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
        - reference_id: file:PSEPK/putA/putA-deep-research-openscientist.md
          supporting_text: PutA thus enables *P. putida* to use proline as a **carbon, nitrogen, and energy source.**
  - term:
      id: GO:0009898
      label: cytoplasmic side of plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The membrane-facing location is mechanistically plausible but is not the sole state of this regulatory enzyme.
      action: KEEP_AS_NON_CORE
      reason: Type C PutA proteins switch between soluble DNA-bound and peripheral membrane-associated states; the exact KT2440 location has not been directly measured in the cited studies.
      supported_by:
        - reference_id: PMID:28712849
          supporting_text: flavin redox dependent changes in subcellular location and function in response to proline
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This parent term is true but obscures the two known substrate-specific activities.
      action: MODIFY
      reason: GO:0004657 and GO:0003842 separately capture both catalytic activities with exact reaction support.
      proposed_replacement_terms:
        - id: GO:0004657
          label: proline dehydrogenase activity
        - id: GO:0003842
          label: L-glutamate gamma-semialdehyde dehydrogenase (NAD+) activity
      supported_by:
        - reference_id: file:PSEPK/putA/putA-uniprot.txt
          supporting_text: "EC=1.5.5.2"
        - reference_id: file:PSEPK/putA/putA-uniprot.txt
          supporting_text: "EC=1.2.1.88"
  - term:
      id: GO:0043168
      label: anion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Generic anion binding does not describe a distinct PutA function.
      action: MARK_AS_OVER_ANNOTATED
      reason: This ARBA parent-level binding prediction is uninformative beside the two specific catalytic activities and lacks direct KT2440 binding evidence.
      supported_by:
        - reference_id: file:PSEPK/putA/putA-goa.tsv
          supporting_text: "GO:0043168\tanion binding"
  - term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: Negative transcriptional regulation is experimentally established for PutA.
      action: ACCEPT
      reason: Loss of putA causes constitutive expression from both divergent put promoters.
      supported_by:
        - reference_id: PMID:11097893
          full_text_unavailable: true
          supporting_text: The PutA protein acts as a repressor of put gene expression in P. putida
  - term:
      id: GO:0055129
      label: L-proline biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: The biosynthesis annotation is a directionally incorrect propagation from the shared semialdehyde-dehydrogenase domain.
      action: REMOVE
      reason: Direct P. putida evidence and both exact reactions place PutA in oxidative proline catabolism to glutamate, not glutamate-to-proline biosynthesis.
      supported_by:
        - reference_id: PMID:10613867
          full_text_unavailable: true
          supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
        - reference_id: file:PSEPK/putA/putA-uniprot.txt
          supporting_text: "glutamate; L-glutamate from L-proline: step 1/2."
  - term:
      id: GO:0098562
      label: cytoplasmic side of membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: located_in
    review:
      summary: This broader membrane-side annotation is plausible but secondary and redundant with GO:0009898.
      action: KEEP_AS_NON_CORE
      reason: PutA membrane association is conditional in the characterized regulatory class, and the exact KT2440 subcellular switch remains inferred.
      supported_by:
        - reference_id: PMID:28712849
          supporting_text: flavin redox dependent changes in subcellular location and function in response to proline
  - term:
      id: GO:1901363
      label: heterocyclic compound binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Generic heterocycle binding is not an informative standalone PutA function.
      action: MARK_AS_OVER_ANNOTATED
      reason: Binding of FAD, NAD, and proline is already inherent in the specific catalytic activities; no separate generic binding role is established.
      supported_by:
        - reference_id: file:PSEPK/putA/putA-goa.tsv
          supporting_text: "GO:1901363\theterocyclic compound binding"
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings:
      - statement: InterPro mappings supplied broad transcription, catabolism, and oxidoreductase annotations reviewed here.
  - id: GO_REF:0000108
    title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
    findings:
      - statement: Logical inference supplied negative regulation from the repressor molecular function.
  - id: GO_REF:0000117
    title: Electronic Gene Ontology annotations created by ARBA machine learning models
    findings:
      - statement: ARBA supplied DNA-binding, repressor, membrane-side, and generic binding predictions reviewed here.
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings:
      - statement: Combined automated mappings supplied both catalytic activities, membrane association, and the erroneous biosynthesis process.
  - id: PMID:10613867
    title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put genes in the presence of root exudates.'
    findings:
      - statement: Direct P. putida genetics links PutA to growth on proline and identifies both catalytic regions in one protein.
        supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed identity and abstract were checked; the cached record is abstract-only.
  - id: PMID:11097893
    title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
    findings:
      - statement: Direct promoter studies establish PutA-dependent repression independent of catalytic activity.
        supporting_text: This regulatory activity is independent of the catabolic activity of PutA
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed identity and abstract were checked; the cached record is abstract-only.
  - id: PMID:18767154
    title: Solution structure of the Pseudomonas putida protein PpPutA45 and its DNA complex.
    findings:
      - statement: The P. putida PutA RHH domain binds a defined put control DNA oligomer.
        supporting_text: PpPutA45 was shown to bind a 14 base-pair DNA oligomer
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text directly reports NMR and DNA-binding experiments on the P. putida PutA N-terminal domain.
  - id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    findings:
      - statement: The review supports the conserved two-step chemistry and redox-dependent localization switch of PutA proteins.
        supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed identity and cached full text were checked; this is family-level mechanistic support.
  - id: file:PSEPK/putA/putA-uniprot.txt
    title: UniProtKB entry Q88D80 for Pseudomonas putida KT2440 PutA
    findings:
      - statement: The exact record assigns both catalytic reactions, FAD, the PutA RHH domain, and the proline-degradation pathway.
  - id: file:PSEPK/putA/putA-goa.tsv
    title: QuickGO GOA annotations for putA
    findings:
      - statement: The fetched table contains the fourteen source rows reviewed above.
  - id: file:PSEPK/putA/putA-deep-research-openscientist.md
    title: OpenScientist deep research report on putA (Q88D80)
    findings:
      - statement: The generated report retrieved direct P. putida studies and family-level PutA mechanistic literature used for source discovery.
