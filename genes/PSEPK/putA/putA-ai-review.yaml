id: Q88D80
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PutA is a fused proline-catabolic enzyme containing FAD-dependent proline dehydrogenase and
  NAD-dependent glutamate-semialdehyde dehydrogenase domains. It converts L-proline to L-glutamate through
  pyrroline-5-carboxylate and its ring-opened semialdehyde. Its N-terminal ribbon-helix-helix domain binds
  put control DNA, and PutA represses expression of the divergent putA and putP genes. Regulation and
  catalysis are separable functions of this protein.
