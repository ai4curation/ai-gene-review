references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro mappings supplied broad transcription, catabolism, and oxidoreductase annotations
      reviewed here.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  findings:
  - statement: Logical inference supplied negative regulation from the repressor molecular function.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA supplied DNA-binding, repressor, membrane-side, and generic binding predictions reviewed
      here.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated mappings supplied both catalytic activities, membrane association, and
      the erroneous biosynthesis process.
- id: PMID:10613867
  title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put
    genes in the presence of root exudates.'
  findings:
  - statement: KT2442 native proline-utilization genetics and sequence-based assignment of PutA catalytic
      domains and PutP proline uptake; KT2442 is a KT2440 derivative.
    supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single
      polypeptide
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The frozen cache remains abstract-only. Independently acquired official PMC full text
      confirms KT2442 native genetics, not a direct purified KT2440 catalytic or sodium-transport assay.
      See the shared PSEPK PutA source-scope analysis.
- id: PMID:11097893
  title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
  findings:
  - statement: Direct promoter studies establish PutA-dependent repression independent of catalytic activity.
    supporting_text: This regulatory activity is independent of the catabolic activity of PutA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The abstract names KT2440; full Table1 identifies KT2442 as its Rif-r derivative, and
      Figure3 compares KT2442, S14D2 and KT2442-Pro21. Methods uses KT2440-Pro21 for the spontaneous mutant.
      This supports lineage-specific put-gene regulation; it does not measure transport coupling.
- id: PMID:18767154
  title: Solution structure of the Pseudomonas putida protein PpPutA45 and its DNA complex.
  findings:
  - statement: The P. putida PutA RHH domain binds a defined put control DNA oligomer.
    supporting_text: PpPutA45 was shown to bind a 14 base-pair DNA oligomer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary studies residues1–45 with a retained C-terminal His6 tag, expressed in
      BL21(DE3)pLysS. RCSB2JXG entity sequence exactly matches Q88D80 residues1–45; no full-length structure
      or membrane-switch experiment is implied.
- id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  findings:
  - statement: Comparative review of the two catalytic reactions and diversity of PutA architectures;
      the experimentally characterized E. coli redox-localization switch is not direct evidence of universal
      switching or KT2440 substrate channeling.
    supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde
      dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and cached full text were checked; this is family-level mechanistic
      support.
- id: file:PSEPK/putA/putA-uniprot.txt
  title: UniProtKB entry Q88D80 for Pseudomonas putida KT2440 PutA
  findings:
  - statement: The exact record assigns both catalytic reactions, FAD, the PutA RHH domain, and the proline-degradation
      pathway.
- id: file:PSEPK/putA/putA-goa.tsv
  title: QuickGO GOA annotations for putA
  findings:
  - statement: The fetched table contains the fourteen source rows reviewed above.
- id: file:PSEPK/putA/putA-deep-research-openscientist.md
  title: OpenScientist deep research report on putA (Q88D80)
  findings:
  - statement: The generated report retrieved direct P. putida studies and family-level PutA mechanistic
      literature used for source discovery.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Generated OpenScientist synthesis that matches Q88D80/PP_4947 to PutA, retrieves direct
      KT2440 put-gene studies, and keeps Q88D80 structure, channeling, redox-switch, and purified-enzyme
      details as ortholog-based inferences rather than direct P. putida measurements; useful as secondary
      triage, not independently verified primary evidence.
- id: file:PSEPK/putA/putA-source-analysis/primary-scope.md
  title: Primary strain and fragment-identity boundaries for Pseudomonas PutA/PutP
  findings:
  - statement: KT2442 derivative backgrounds and the exact Q88D80 N-terminal sequence bridge distinguish
      native genetics from fragment and comparative mechanistic experiments.
