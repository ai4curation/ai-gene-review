proposed_new_terms: []
suggested_questions:
  - question: Does KT2440 PutA undergo the same directly measurable FAD-redox-dependent membrane switch as E. coli PutA?
  - question: What is the identity of the sigma-54-dependent positive regulator required for full put promoter induction?
suggested_experiments:
  - description: Measure coupled proline-to-glutamate turnover and intermediate channeling with purified Q88D80 and catalytic-domain mutants.
    experiment_type: coupled enzyme kinetics
  - description: Compare membrane association and operator binding of oxidized and proline-reduced Q88D80.
    experiment_type: membrane-binding and DNA-binding assay
