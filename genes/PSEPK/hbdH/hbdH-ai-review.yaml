taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  HbdH is a predicted soluble D-3-hydroxybutyrate dehydrogenase that oxidizes
  D-3-hydroxybutyrate to acetoacetate. Its placement next to bhbP and aacs links
  this reaction to uptake and CoA activation of D-3-hydroxybutyrate in KT2440.
