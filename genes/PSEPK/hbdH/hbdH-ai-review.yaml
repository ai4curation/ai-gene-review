suggested_questions:
  - question: What are the cofactor preference and in vivo reaction direction of KT2440 HbdH?
suggested_experiments:
  - description: >-
      Purify Q88IC6 and measure reversible D-3-hydroxybutyrate/acetoacetate
      kinetics with NAD(H) and NADP(H), then test growth of an hbdH deletion on
      D-3-hydroxybutyrate.
    experiment_type: enzyme kinetics and carbon-source growth assay
