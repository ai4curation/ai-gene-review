taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  HbdH is a predicted soluble D-3-hydroxybutyrate dehydrogenase. Its EC and
  family assignments support oxidation of D-3-hydroxybutyrate to acetoacetate,
  while its precise contribution to this reaction in KT2440 remains untested.
