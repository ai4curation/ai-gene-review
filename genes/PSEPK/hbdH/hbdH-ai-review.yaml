  - id: PMID:17958702
    title: Cosubstrate-induced dynamics of D-3-hydroxybutyrate dehydrogenase from Pseudomonas putida.
    findings:
      - statement: A P. putida D-3-hydroxybutyrate dehydrogenase has structural support for NAD+ and substrate binding.
        supporting_text: >-
          D-3-Hydroxybutyrate dehydrogenase from Pseudomonas putida belongs to the family
          of short-chain dehydrogenases/reductases.
  - id: PMID:26311173
    title: The metabolism of (R)-3-hydroxybutyrate is regulated by the enhancer-binding protein PA2005 and the alternative sigma factor RpoN in Pseudomonas aeruginosa PAO1.
    findings:
      - statement: A Pseudomonas homolog converts R-3-hydroxybutyrate to acetoacetate during utilization.
        supporting_text: >-
          Essential to this utilization is the NAD+-dependent
          dehydrogenase BdhA that converts (R)-3-HB into acetoacetate
