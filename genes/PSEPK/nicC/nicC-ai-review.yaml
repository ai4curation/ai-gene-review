- id: PMID:27218267
  title: Structural and Biochemical Characterization of 6-Hydroxynicotinic Acid 3-Monooxygenase, A Novel
    Decarboxylative Hydroxylase Involved in Aerobic Nicotinate Degradation.
  findings:
  - statement: Both RB50 and KT2440 NicC were expressed and characterized; the Pseudomonas structure contains
      FAD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Local record contains bibliographic metadata without an abstract. Publisher abstract
      was independently read and explicitly identifies both homologs; curated UniProt summarizes publication-linked
      experimental evidence. No title fragment is used as a functional quote.
- id: PMID:18678916
  title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster
    from Pseudomonas putida KT2440.'
  findings:
  - statement: KT2440 NicC expression supports 6-hydroxynicotinate conversion with added NADH and FAD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Main article read at PMC2516282; local fetch remained abstract-only at initial inspection.
      Direct enzyme conversion complements native mutant evidence.
- id: PMID:38104959
  title: Ligand bound structure of a 6-hydroxynicotinic acid 3-monooxygenase provides mechanistic insights.
  findings:
  - statement: Pseudomonas H47Q NicC binds FAD and a non-substrate contaminant, 2-mercaptopyridine, in
      solved structures.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text read. Introduction erroneously names 2,6-dihydroxypyridine; Scheme1 and reaction
      experiments identify 2,5-dihydroxypyridine. This typo does not establish a second product. The ligand
      is a contaminant bound to a mutant, not a physiological substrate.
