    id: GO:1901848
    label: nicotinate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: NicC directly performs the second oxidative reaction in nicotinate catabolism.
    action: ACCEPT
    reason: Heterologous expression produces an enzyme converting 6-hydroxynicotinate to 2,5-dihydroxypyridine
      with NADH/FAD; this establishes catalytic participation independently of the nicC disruption phenotype.
      The native KT2440 pathway assigns this reaction between NicAB and NicX.
