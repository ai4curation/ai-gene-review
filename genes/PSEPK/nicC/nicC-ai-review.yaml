id: Q88FY2
gene_symbol: nicC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NicC is a class A FAD-dependent 6-hydroxynicotinate 3-monooxygenase that couples NADH oxidation
  and molecular oxygen consumption to decarboxylative hydroxylation of 6-hydroxynicotinate. It produces
  2,5-dihydroxypyridine and carbon dioxide in the aerobic nicotinate-degradation pathway, supplying the
  substrate for NicX ring cleavage.
