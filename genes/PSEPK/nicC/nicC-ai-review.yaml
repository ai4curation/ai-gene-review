- term:
    id: GO:0043731
    label: 6-hydroxynicotinate 3-monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: NicC catalyzes NADH-dependent decarboxylative hydroxylation of 6-hydroxynicotinate.
    action: ACCEPT
    reason: The reaction is supported by direct enzymology, not merely the enzyme name or pathway disruption.
      NADH reduces bound FAD, oxygen is required, and 2,5-dihydroxypyridine plus carbon dioxide are the
      products. The 2016 work assayed both Pseudomonas and Bordetella homologs; the 2019 mechanistic study
      specifically assayed Bordetella.
    supported_by: *id001
- term:
    id: GO:0071949
    label: FAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: FAD is the catalytic flavin cofactor of NicC.
    action: ACCEPT
    reason: FAD binding is integral to the core monooxygenase mechanism. Publication-linked cofactor annotation
      and flavin-bound structural/biochemical characterization support retaining this precise molecular
      function as core.
    supported_by:
    - &id005
      reference_id: file:PSEPK/nicC/nicC-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=FAD; Xref=ChEBI:CHEBI:57692;
