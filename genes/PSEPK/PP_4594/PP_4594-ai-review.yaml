- id: PMID:10482527
  title: Pathways of assimilative sulfur metabolism in Pseudomonas putida.
  findings:
  - statement: In P. putida strain S-313 (not KT2440) no cystathionine gamma-lyase activity
      was detected, while methionine was desulfurized by methionine gamma-lyase.
    supporting_text: "P. putida desulfurized methionine by the conversion of methionine to methanethiol, catalyzed by methionine γ-lyase"
