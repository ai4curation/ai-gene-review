gene_symbol: PP_4594
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_4594 encodes a PLP-dependent Cys/Met-metabolism enzyme near the
  cysteine, methionine, and selenocompound pathway boundary. Its sequence annotations
  place it near cystathionine gamma-synthase and cystathionine gamma-lyase family
  functions, leaving its physiological substrate and reaction direction unresolved.
  It is a gamma-subfamily member of the trans-sulfuration enzyme family with an intact
  catalytic PLP lysine (K205), and is roughly equidistant (38-45% identity) from
  characterized cystathionine gamma-lyases, cystathionine gamma-synthases and methionine
  gamma-lyases. It is distinct from the KT2440 cystathionine gamma-synthase MetB
  (PP_0659), the O-succinylhomoserine sulfhydrylase MetZ (PP_2001) and the methionine
  gamma-lyase MdeA (PP_1308), and has not been characterized biochemically.
existing_annotations:
- term:
    id: GO:0004123
    label: cystathionine gamma-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Cystathionine gamma-lyase activity is a plausible but low-confidence sibling
      call; sequence cannot separate it from cystathionine gamma-synthase or methionine
      gamma-lyase, and no assay exists.
    action: UNDECIDED
    reason: GOA/PANTHER assign cystathionine gamma-lyase activity, while UniProt's
      submitted protein name says cystathionine gamma-synthase. A blinded OpenScientist
      control run found the term partially supported - the protein is a catalytically
      intact gamma-subfamily enzyme (not a pseudo-enzyme, not a beta-lyase) - but could
      not choose among sibling activities. A local placement check, withheld from the
      run, agrees on the facts - top characterized hit Mtb cystathionine gamma-synthase
      (45.1%), mammalian cystathionine gamma-lyases 44.0-44.5%, methionine gamma-lyases
      about 42%, beta-lyase MetC 29.0%. The PANTHER subfamily that drives the graft,
      PTHR11808:SF15, is itself mixed, containing both mammalian/yeast cystathionine
      gamma-lyases and the Mtb cystathionine gamma-synthase, so membership does not
      settle the reaction. Genomic context leans away from a biosynthetic role, since
      KT2440 has a separate MetB (PP_0659), MetZ and methionine gamma-lyase MdeA (PP_1308,
      the ortholog of P. putida P13254); and the only P. putida enzymology available
      (strain S-313, not KT2440) detected no cystathionine gamma-lyase. Neither line
      decides the activity, so the row stays UNDECIDED pending a substrate-profiling assay.
    supported_by:
    - reference_id: file:PSEPK/PP_4594/PP_4594-uniprot.txt
      supporting_text: "SubName: Full=Cystathionine gamma-synthase"
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__methionine_biosynthesis__ppu00270-deep-research-openscientist.md
      supporting_text: "best interpreted as a reverse-transsulfuration enzyme (cysteine formation), not the forward metB"
    - reference_id: file:PSEPK/PP_4594/PP_4594-deep-research-openscientist.md
      supporting_text: "the exact substrate specificity and reaction direction remain to be confirmed by direct biochemical characterization"
    - reference_id: file:PSEPK/PP_4594/PP_4594-hypotheses/function-hypothesis-go-0004123/openscientist.md
      supporting_text: "**Verdict: PARTIALLY SUPPORTED / sibling-activity ambiguity (failure mode 1 — granularity / family-vs-subfamily).**"
    - reference_id: file:PSEPK/PP_4594/PP_4594-hypotheses/function-hypothesis-go-0004123/openscientist.md
      supporting_text: "Treat GO:0004123 as a plausible-but-low-confidence computational sibling call; do NOT assert it as directly demonstrated."
    - reference_id: file:PSEPK/PP_4594/PP_4594-bioinformatics/RESULTS.md
      supporting_text: "PTHR11808:SF15 (official name \"CYSTATHIONINE GAMMA-LYASE\") is itself mixed"
    - reference_id: file:PSEPK/PP_4594/PP_4594-bioinformatics/RESULTS.md
      supporting_text: "Sequence identity does not separate the sibling activities."
    - reference_id: PMID:10482527
      supporting_text: "no cystathionine γ-lyase, the key enzyme of the reverse transsulfuration pathway, was found in this species"
