suggested_questions:
- question: Is PP_4594 a cystathionine gamma-lyase, a cystathionine gamma-synthase
    paralog, or a selenocompound/cysteine-pathway enzyme outside methionine biosynthesis?
suggested_experiments:
- description: Compare PP_4594 and MetB substrate preferences using cystathionine,
    O-succinylhomoserine, O-acetylhomoserine, cysteine, and selenium analogs.
  experiment_type: comparative PLP-enzyme substrate profiling
- description: Assay recombinant PP_4594 for cystathionine gamma-elimination (cystathionine
    to cysteine, 2-oxobutanoate and ammonia), methionine gamma-elimination (to methanethiol),
    and cystathionine formation from O-succinyl- or O-acetyl-L-homoserine plus cysteine,
    and compare active-site specificity residues in an AlphaFold model against CGL and
    CGS structures.
  experiment_type: in vitro enzyme assay
