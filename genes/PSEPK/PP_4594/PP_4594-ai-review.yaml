- term:
    id: GO:0016846
    label: carbon-sulfur lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Carbon-sulfur lyase activity is a safe broad family-level function.
    action: KEEP_AS_NON_CORE
    reason: A PLP-dependent cystathionine gamma-lyase/synthase-family enzyme is expected
      to be a carbon-sulfur lyase or related C-S transfer enzyme, but the exact
      physiological activity remains unresolved. This broad term holds if PP_4594 is
      a gamma-lyase (cystathionine or methionine gamma-lyase, both EC 4.4.1.-) but not
      if it is a cystathionine gamma-synthase (a transferase, EC 2.5.1.48), which sequence
      cannot exclude; genomic context (a separate MetB in KT2440) makes the lyase reading
      more likely, so it is kept as non-core rather than asserted as core.
    supported_by:
    - reference_id: file:PSEPK/PP_4594/PP_4594-uniprot.txt
      supporting_text: "PTHR11808:SF15; CYSTATHIONINE GAMMA-LYASE"
    - reference_id: file:PSEPK/PP_4594/PP_4594-deep-research-openscientist.md
      supporting_text: "a **cytoplasmic, cysteine-inducible, accessory PLP-dependent γ-family enzyme"
