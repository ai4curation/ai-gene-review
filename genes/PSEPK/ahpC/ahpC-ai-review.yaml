        peroxide-degrading enzymes in P. putida.
    - reference_id: file:PSEPK/ahpC/ahpC-uniprot.txt
      supporting_text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide and organic
        hydroperoxides to water and alcohols, respectively.

- term:
    id: GO:0008379
    label: thioredoxin peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: The historical thioredoxin-peroxidase assignment is best represented by the current peroxiredoxin
      activity term.
    action: MODIFY
    reason: QuickGO checked on 2026-09-20 marks GO:0008379 obsolete; preserve the source GOA identifier
      and refine its review to the active peroxiredoxin term. Independently, the existing reports support
      a typical AhpC/AhpF system and distinguish its immediate protein reductant from free thioredoxin.
      Their donor discussion does not undermine peroxide reduction, antioxidant activity or H2O2 catabolism.
    proposed_replacement_terms:
    - id: GO:0051920
      label: peroxiredoxin activity
    supported_by:
    - reference_id: PMID:12483614
      supporting_text: The most abundantly produced 24-kDa soluble protein was found to be similar to AhpC,
        the small subunit of alkyl hydroperoxide reductase.
    - reference_id: file:PSEPK/ahpC/ahpC-deep-research-falcon.md
      supporting_text: In P. putida, the AhpC catalytic cycle is coupled to a dedicated reductase AhpF,
        characterized as a flavoprotein/disulfide reductase that uses NADH as the reducing equivalent to
        restore AhpC from its oxidized form.
    - reference_id: file:PSEPK/ahpC/ahpC-hypotheses/function-hypothesis-go-0008379/openscientist.md
      supporting_text: 'Verdict: Partially supported / too general - failure mode #1 (granularity / family-vs-subfamily).'
    - reference_id: file:PSEPK/ahpC/ahpC-hypotheses/function-hypothesis-go-0008379/openscientist.md
      supporting_text: '**The peroxidase activity is authentic and fully supported.**'
    - reference_id: file:PSEPK/ahpC/ahpC-hypotheses/function-hypothesis-go-0008379/falcon.md
      supporting_text: the physiological reductant is AhpF, a dedicated NADH:peroxiredoxin oxidoreductase
        co-transcribed with AhpC in an operon

