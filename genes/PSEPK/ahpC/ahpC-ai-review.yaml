- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: AhpC is a soluble cytosolic bacterial protein.
    action: ACCEPT
    reason: The current cytosol definition excludes organelles but includes soluble proteins and protein
      complexes. It applies to bacteria; the existing cytoplasm annotation does not justify replacing this
      correct, more specific localization.
    supported_by:
    - reference_id: file:PSEPK/ahpC/ahpC-uniprot.txt
