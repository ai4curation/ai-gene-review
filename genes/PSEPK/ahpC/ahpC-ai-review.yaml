core_functions:
- description: >-
    AhpC is the peroxiredoxin component of the AhpCF alkyl hydroperoxide
    reductase system. In the cytoplasm it reduces hydrogen peroxide and organic
    hydroperoxides, thereby contributing directly to cellular oxidant
    detoxification and oxidative-stress defense.
  supported_by:
  - reference_id: file:PSEPK/ahpC/ahpC-uniprot.txt
    supporting_text: >-
      Thiol-specific peroxidase that catalyzes the reduction of hydrogen
      peroxide and organic hydroperoxides to water and alcohols,
      respectively. Plays a role in cell protection against oxidative stress by
      detoxifying peroxides.
  - reference_id: PMID:17107553
    supporting_text: >-
      These results are consistent with the conclusion, distinct from those
      observed in an opportunistic pathogen Pseudomonas aeruginosa, that OxyR
      controlled expression of all the principal peroxide-degrading enzymes in
      P. putida.
  molecular_function:
    id: GO:0051920
    label: peroxiredoxin activity
  directly_involved_in:
  - id: GO:0098869
    label: cellular oxidant detoxification
  locations:
  - id: GO:0005737
    label: cytoplasm
proposed_new_terms: []
suggested_questions:
- question: >-
    What is the in vivo substrate preference of P. putida AhpC for hydrogen
    peroxide versus organic hydroperoxides under different stress conditions?
- question: >-
    Does P. putida AhpC function exclusively with AhpF in vivo, or can it also
    draw reducing equivalents from thioredoxin-dependent systems?
suggested_experiments:
- description: >-
    Purify P. putida AhpC together with AhpF and measure steady-state kinetics
    against hydrogen peroxide and several organic hydroperoxides to resolve
    substrate preference and donor coupling.
  experiment_type: Enzyme kinetics with purified proteins
  hypothesis: >-
    P. putida AhpC will show higher catalytic efficiency toward organic
    hydroperoxides than toward hydrogen peroxide under AhpF/NADH-coupled assay
    conditions.
- description: >-
    Construct an ahpC deletion mutant and quantify growth, survival, and oxidant
    sensitivity during exposure to hydrogen peroxide, tert-butyl hydroperoxide,
    phenol, and toluene, followed by complementation with wild-type ahpC.
  experiment_type: Targeted knockout and stress-phenotyping assay
  hypothesis: >-
    Loss of ahpC will disproportionately sensitize P. putida to organic
    hydroperoxides and solvent-associated oxidative stress.
