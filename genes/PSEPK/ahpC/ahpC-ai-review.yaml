- term:
    id: GO:0102039
    label: NADH-dependent peroxiredoxin activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This term likely reflects the chemistry of the AhpCF system rather than the AhpC subunit alone.
      AhpC is the peroxiredoxin component, whereas AhpF provides the NADH-linked reductant flow.
    action: MODIFY
    reason: The coupled AhpCF system is NADH-dependent, as recognized by both existing reports. AhpC directly
      reduces peroxide while AhpF supplies electrons from NADH. Retain the donor-independent single-subunit
      refinement to peroxiredoxin activity; this is a gene-product scope distinction, not a claim that NADH-dependent
      AhpCF physiology is absent. Whether GO:0102039 is conventionally assigned to the catalytic AhpC subunit
      itself remains a useful curation second opinion.
    proposed_replacement_terms:
    - id: GO:0051920
      label: peroxiredoxin activity
    supported_by:
    - reference_id: PMID:12483614
      supporting_text: Molecular cloning of the P. putida ahpC based on the N-terminal sequence allowed
        cloning of closely located ahpF, the large subunit of alkyl hydroperoxide reductase.
    - reference_id: file:PSEPK/ahpC/ahpC-deep-research-falcon.md
      supporting_text: In P. putida, the AhpC catalytic cycle is coupled to a dedicated reductase AhpF,
        characterized as a flavoprotein/disulfide reductase that uses NADH as the reducing equivalent to
        restore AhpC from its oxidized form.

