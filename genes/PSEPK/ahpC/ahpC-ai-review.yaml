id: Q88K52
gene_symbol: ahpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  ahpC encodes the cytoplasmic peroxiredoxin/alkyl hydroperoxide reductase C
  subunit of the AhpCF peroxide-detoxification system in Pseudomonas putida
  KT2440. It reduces hydrogen peroxide and organic hydroperoxides, contributes
  to cellular oxidant detoxification and oxidative-stress defense, and is under
  OxyR control.
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: AhpC reduces peroxides through its peroxiredoxin active site.
    action: ACCEPT
    reason: Peroxiredoxin activity is peroxidase activity. The broad parent does not become wrong because
      the catalytic subfamily is known.
    supported_by:
    - reference_id: file:PSEPK/ahpC/ahpC-uniprot.txt
      supporting_text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide and organic
        hydroperoxides to water and alcohols, respectively.
    - reference_id: file:PSEPK/ahpC/ahpC-uniprot.txt
      supporting_text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide and organic
        hydroperoxides to water and alcohols, respectively.

