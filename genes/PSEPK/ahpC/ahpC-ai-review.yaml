- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: AhpC directly detoxifies peroxide during oxidative stress.
    action: ACCEPT
    reason: Direct peroxide reduction performs work in the oxidative-stress response. The more specific
