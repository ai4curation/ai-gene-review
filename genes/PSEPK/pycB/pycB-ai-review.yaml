- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Gluconeogenesis is the vertebrate/yeast context of PC, not shown for KT2440 PycB.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TreeGrafter node inherits gluconeogenesis from liver and yeast PCs. In bacteria such as
      KT2440 the demonstrated role of pyruvate carboxylation is anaplerotic oxaloacetate supply; no evidence
      places PycAB in gluconeogenic flux. Treated as for B. subtilis PycA.
    supported_by:
    - reference_id: file:PSEPK/pycB/pycB-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43778; PYRUVATE CARBOXYLASE; 1.
    propagation_review:
