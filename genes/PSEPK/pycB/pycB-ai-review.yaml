      source_entities:
      - source_id: PANTHER:PTN001821756
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Gluconeogenesis is physiological for liver and yeast PCs; the bacterial descendant's
          shown role is anaplerosis.
- term:
    id: GO:0006814
    label: sodium ion transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Sodium ion transport is the OadA-complex process and does not apply to PycB.
    action: REMOVE
    reason: Na+ pumping is done by the membrane OadB subunit of oxaloacetate decarboxylase; the shared
      OadA carboxyltransferase signature does not make the soluble PC beta subunit a sodium transporter.
    supported_by:
    - reference_id: file:PSEPK/pycB/pycB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01108; oadA; 1.
- term:
    id: GO:0008948
    label: oxaloacetate decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Oxaloacetate decarboxylase is the OadA paralog function, not that of PycB.
    action: REMOVE
    reason: IPR005776 (OadA) is shared by the carboxyltransferase domains of PC and of the Na+-pumping
      oxaloacetate decarboxylase alpha subunit. PycB is paired with the biotin carboxylase PycA (the PC
      architecture), not with OadB/OadG membrane subunits, so the decarboxylase activity is a wrong family-signature
      mapping.
    supported_by:
    - reference_id: file:PSEPK/pycB/pycB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01108; oadA; 1.
    - reference_id: PMID:27708276
      supporting_text: the PC enzyme is encoded by two separate genes
- term:
    id: GO:0006107
    label: oxaloacetate metabolic process
  evidence_type: IC
  original_reference_id: PMID:24157795
  qualifier: involved_in
  review:
    summary: PycB forms oxaloacetate from pyruvate (anaplerosis).
    action: NEW
    reason: The carboxyltransferase reaction on PycB produces oxaloacetate, so PycB does the work of oxaloacetate
      formation; GO has no anaplerosis term, and this matches the process used for E. coli Ppc and B.
      subtilis PycA.
    supported_by:
    - reference_id: PMID:24157795
      supporting_text: The carboxyltransferase (CT) domain of PC catalyzes the transfer of a carboxyl
        group from carboxybiotin to the accepting substrate, pyruvate.
