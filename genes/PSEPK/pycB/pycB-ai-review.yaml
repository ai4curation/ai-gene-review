  label: Pseudomonas putida KT2440
description: PycB (PP_5346) is the beta subunit of the two-subunit pyruvate carboxylase of Pseudomonas
  putida KT2440. It carries the pyruvate carboxyltransferase domain and a C-terminal biotin carboxyl carrier
  domain. After the PycA subunit carboxylates the biotin, PycB transfers the carboxyl group to pyruvate,
  forming oxaloacetate as an anaplerotic input to the TCA cycle.
