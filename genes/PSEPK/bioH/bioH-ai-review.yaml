id: Q88QX0
gene_symbol: bioH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  BioH is the predicted alpha/beta-hydrolase that hydrolyzes pimeloyl-ACP
  methyl ester after fatty-acid-synthase elongation in the BioC-BioH route.
  Demethylation releases pimeloyl-ACP for condensation with L-alanine by BioF
  during de novo biotin biosynthesis.
existing_annotations:
- term:
    id: GO:0090499
    label: pimelyl-[acyl-carrier protein] methyl ester esterase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: This is the substrate-specific predicted BioH activity.
    action: ACCEPT
    reason: >-
      Family-membership evidence, no experiment on the KT2440 protein. Q88QX0 is classified in
      the BioH subfamily of the alpha/beta-hydrolase fold family (PANTHER PTHR43194:SF5,
      InterPro IPR050228), and the deep-research synthesis assigns it the pimeloyl-ACP methyl
      ester hydrolysis characterized for E. coli BioH. The gene lies in the P. putida bioBFHCD
      locus, which reconstitutes biotin synthesis in E. coli (PMID:33666816).
    supported_by:
    - reference_id: file:PSEPK/bioH/bioH-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43194:SF5; PIMELOYL-[ACYL-CARRIER PROTEIN] METHYL ESTER ESTERASE; 1.
    - reference_id: file:PSEPK/bioH/bioH-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR050228; Carboxylesterase_BioH.
    - reference_id: file:PSEPK/bioH/bioH-deep-research-openscientist.md
      supporting_text: The defining function of BioH is the hydrolysis of **pimeloyl-ACP methyl ester → pimeloyl-ACP + methanol**, the reaction assigned to Q88QX0 as EC 3.1.1.85.
- term:
    id: GO:0106435
    label: carboxylesterase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: This generic esterase term is redundant with GO:0090499.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The specific pimeloyl-ACP methyl ester substrate is already captured by
      GO:0090499.
- term:
    id: GO:0009102
    label: biotin biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/bioH/bioH-uniprot.txt
  qualifier: involved_in
  review:
    summary: BioH should be annotated to biotin biosynthesis.
    action: NEW
    reason: >-
      By family membership (PANTHER PTHR43194:SF5 BioH subfamily) this protein hydrolyses
      pimeloyl-ACP methyl ester, the step that supplies pimeloyl-ACP to BioF in the early
      stage of biotin synthesis, so the enzyme itself performs a step of the process. bioH
      lies in the P. putida bioBFHCD cluster, which reconstitutes biotin production in E. coli
      (PMID:33666816).
    supported_by:
    - reference_id: file:PSEPK/bioH/bioH-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43194:SF5; PIMELOYL-[ACYL-CARRIER PROTEIN] METHYL ESTER ESTERASE; 1.
    - reference_id: file:PSEPK/bioH/bioH-deep-research-openscientist.md
      supporting_text: 'Together with BioC, it produces pimeloyl-ACP. This thioester precursor then enters the conserved **late stage**: it is condensed with L-alanine by BioF'
    - reference_id: PMID:33666816
      supporting_text: bioBFHCD cluster and a bioA gene, was engineered into Escherichia coli for
