id: Q88CZ3
gene_symbol: hutF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  HutF (PP_5036) is a predicted zinc-dependent formimidoylglutamate deiminase
  that hydrolyzes N-formimidoyl-L-glutamate to N-formyl-L-glutamate and
  ammonia. It initiates the two-enzyme terminal formate branch of histidine
  catabolism; HutG then converts N-formyl-L-glutamate to glutamate and formate.
existing_annotations:
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: A cytosolic location is compatible with a soluble HutF enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      HutF belongs to a soluble metal-dependent amidohydrolase family and
      has no predicted signal peptide or transmembrane segment, so a
      cytosolic location is plausible, but no target-specific localization
      experiment is available and localization is secondary to the reaction.
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR011059; Metal-dep_hydrolase_composite."
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF01979; Amidohydro_1; 1."
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: HutF is hydrolytic, but the root hydrolase term is uninformative.
    action: MODIFY
    reason: >-
      Correct but maximally general. The InterPro2GO mapping fires from
      generic amidohydrolase signatures; the HutF-specific NCBIfam and
      InterPro signatures support the specific descendant GO:0050416
      formimidoylglutamate deiminase activity, already accepted on another
      row of this review.
    proposed_replacement_terms:
    - id: GO:0050416
      label: formimidoylglutamate deiminase activity
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR02022; hutF; 1."
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR010252; HutF."
- term:
    id: GO:0016810
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This carbon-nitrogen hydrolase class is compatible but nonspecific.
    action: MODIFY
    reason: >-
      Correct but general: FIGLU deimination is a carbon-nitrogen (linear
      amidine) hydrolysis, but the class term omits the substrate. Refine to
      the descendant GO:0050416, already accepted on another row of this
      review.
    proposed_replacement_terms:
    - id: GO:0050416
      label: formimidoylglutamate deiminase activity
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR02022; hutF; 1."
- term:
    id: GO:0019239
    label: deaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      HutF releases ammonia from a formimidoyl amidine, but GO:0019239
      deaminase activity is not a parent of its activity in the current
      ontology.
    action: MODIFY
    reason: >-
      The essence (hydrolytic release of ammonia) is right, but the term
      names the wrong chemistry class: GO:0050416 formimidoylglutamate
      deiminase activity sits under GO:0016813 (linear amidines), whereas
      GO:0019239 is defined as removal of an amino group. The TreeGrafter
      assignment was carried over from the guanine-deaminase members of
      PANTHER PTHR11271, to which HutF's subfamily SF48 is grafted. As for
      the P. aeruginosa ortholog, this is a lateral correction to the
      specific activity the gene already carries.
    proposed_replacement_terms:
    - id: GO:0050416
      label: formimidoylglutamate deiminase activity
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11271; GUANINE DEAMINASE; 1."
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11271:SF48; AMIDOHYDROLASE-RELATED DOMAIN-CONTAINING PROTEIN; 1."
- term:
    id: GO:0050416
    label: formimidoylglutamate deiminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      HutF is predicted to deiminate N-formimidoyl-L-glutamate to
      N-formyl-L-glutamate and ammonia.
    action: ACCEPT
    reason: >-
      The NCBIfam TIGR02022 assignment supplies EC 3.5.3.13, and the sequence
      carries HutF-specific IPR010252 plus a HutF N-terminal domain. PANTHER
      places the protein only in a broad amidohydrolase-related subfamily, so
      the HutF-specific NCBIfam/InterPro evidence is decisive.
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR010252; HutF."
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR02022; hutF; 1."
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IC
  original_reference_id: PMID:2842309
  qualifier: involved_in
  review:
    summary: HutF initiates the two-reaction terminal formate branch of the bacterial Hut pathway.
    action: NEW
    reason: >-
      A same-species hut-locus study identifies hutF as encoding
      formiminoglutamate hydrolase. Its accepted
      formimidoylglutamate-deiminase reaction consumes the intermediate made
      by the upstream HutH-HutU-HutI sequence and supplies
      N-formyl-L-glutamate to HutG.
    supported_by:
    - reference_id: PMID:2842309
      supporting_text: "hutF, encoding formiminoglutamate hydrolase"
