id: Q88CZ3
gene_symbol: hutF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  HutF (PP_5036) is a predicted zinc-dependent formimidoylglutamate deiminase
  that hydrolyzes N-formimidoyl-L-glutamate to N-formyl-L-glutamate and
  ammonia. It initiates the two-enzyme terminal formate branch of histidine
  catabolism; HutG then converts N-formyl-L-glutamate to glutamate and formate.
