- term:
    id: GO:0050416
    label: formimidoylglutamate deiminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      HutF is predicted to deiminate N-formimidoyl-L-glutamate to
      N-formyl-L-glutamate and ammonia.
    action: ACCEPT
    reason: >-
      The NCBIfam TIGR02022 assignment supplies EC 3.5.3.13, and the sequence
      carries HutF-specific IPR010252 plus a HutF N-terminal domain. PANTHER
      places the protein only in a broad amidohydrolase-related subfamily, so
      the HutF-specific NCBIfam/InterPro evidence is decisive.
    supported_by:
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      supporting_text: "RecName: Full=Formimidoylglutamate deiminase"
    - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
      supporting_text: "DR   NCBIfam; TIGR02022; hutF; 1."
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IC
  original_reference_id: PMID:2842309
  qualifier: involved_in
  review:
    summary: HutF initiates the two-reaction terminal formate branch of the bacterial Hut pathway.
    action: NEW
    reason: >-
      A same-species hut-locus study identifies hutF as encoding
      formiminoglutamate hydrolase. Its accepted
      formimidoylglutamate-deiminase reaction consumes the intermediate made
      by the upstream HutH-HutU-HutI sequence and supplies
      N-formyl-L-glutamate to HutG.
    supported_by:
    - reference_id: PMID:2842309
      supporting_text: "hutF, encoding formiminoglutamate hydrolase"
