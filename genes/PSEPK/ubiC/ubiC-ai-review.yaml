- id: file:PSEPK/ubiC/ubiC-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK ubiC
  findings:
  - statement: >-
      The report confirms the Rhea reaction, UbiC family identity and the adjacent
      ubiC-ubiA gene pair in KT2440.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Reaction, family and ubiC-ubiA synteny statements agree with UniProt. Its claim that
      product inhibition was "demonstrated directly in the target strain" and describes
      "the actual target protein" overreaches: the cited KT2440 engineering study
      (PMID:30861344) is described in the same report as using a "heterologously expressed
      UbiC", so it is host-level context, not a property of PP_5317. Not used as evidence
      for any row.
