id: Q88C66
gene_symbol: ubiC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiC (PP_5317) encodes chorismate pyruvate-lyase (UbiC family, EC 4.1.3.40), a small
  soluble cofactor-independent enzyme that removes the enolpyruvyl group from chorismate
  with aromatization of the ring, releasing 4-hydroxybenzoate and pyruvate. This is the
  first committed step of ubiquinone (coenzyme Q-9) biosynthesis in Pseudomonas putida:
  the 4-hydroxybenzoate head group is passed to the inner-membrane prenyltransferase UbiA,
  encoded by the directly adjacent ubiA gene (PP_5318). The function is inferred from the
  conserved UbiC family and from the purified Escherichia coli enzyme; the KT2440 protein
  itself has not been assayed.
