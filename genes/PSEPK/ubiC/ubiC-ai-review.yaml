  review:
    summary: >-
      Combined UniRule/InterPro/UniPathway assignment of ubiquinone biosynthesis. UbiC
      catalyses the first committed step, making the 4-hydroxybenzoate head group.
    action: ACCEPT
    reason: >-
      UbiC performs a step of the pathway (chorismate to 4-hydroxybenzoate), so it does
      work within ubiquinone biosynthesis rather than merely being required for it. In
      E. coli chorismate lyase is the first enzyme of the pathway and the sole in vivo
      source of 4-hydroxybenzoate. Q88C66 is a HAMAP MF_01632 UbiC-family member encoded
      next to ubiA, and KT2440 makes ubiquinone-9 as its respiratory quinone.
    supported_by:
