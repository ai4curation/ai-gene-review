suggested_questions:
- question: >-
    Is PP_5317 the only source of 4-hydroxybenzoate for ubiquinone-9 synthesis in KT2440,
    or can 4-hydroxybenzoate from aromatic catabolism feed UbiA when ubiC is deleted?
suggested_experiments:
- description: >-
    Delete PP_5317 in KT2440 and measure ubiquinone-9 and aerobic growth on succinate,
    with and without exogenous 4-hydroxybenzoate; assay purified PP_5317 for chorismate
    lyase kinetics and 4-hydroxybenzoate product inhibition.
