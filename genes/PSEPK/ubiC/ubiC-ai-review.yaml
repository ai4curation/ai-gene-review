- term:
    id: GO:0008813
    label: chorismate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007440
  - RHEA:16505
  - EC:4.1.3.40
  - PANTHER:PTN002446048
  - UniRule:UR000080086
  review:
    summary: >-
      Core molecular function. HAMAP MF_01632 assigns RHEA:16505 (chorismate =
      4-hydroxybenzoate + pyruvate), which is exactly the GO:0008813 definition.
    action: ACCEPT
    reason: >-
      The GO term is defined by the reaction chorismate = 4-hydroxybenzoate + pyruvate.
      Q88C66 carries the UbiC-family signatures (Pfam PF04345, InterPro IPR007440, HAMAP
      MF_01632) and its three HAMAP substrate-binding positions. The E. coli ortholog was
      purified and characterized kinetically (Km 6.1 uM; kcat 1.7 s-1, Km 29 uM) and needs
      no metal cofactor. The same term is carried by the PAINT IBD at the
      gammaproteobacterial UbiC node PTN002214686. Activity has not been measured for the
      KT2440 protein.
    supported_by:
    - reference_id: file:PSEPK/ubiC/ubiC-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=chorismate = 4-hydroxybenzoate + pyruvate;
    - reference_id: PMID:8012607
      supporting_text: Chorismate pyruvate-lyase from Escherichia coli converts chorismate
        to 4-hydroxybenzoate.
    - reference_id: PMID:11825618
      supporting_text: By removing the enolpyruvyl group from chorismate, chorismate lyase
        (CL) produces p-hydroxybenzoate (p-HB) for the ubiquinone biosynthetic pathway.
- term:
    id: GO:0042866
    label: pyruvate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000080086
  review:
    summary: >-
      UniRule process term derived from pyruvate being a product of the reaction. Pyruvate
      is a coproduct, not the purpose of the step.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UbiC does release pyruvate, so the term is not chemically false, but the enzyme
      exists to supply 4-hydroxybenzoate to ubiquinone biosynthesis. Pyruvate is made in
      bulk by glycolysis; the trace released by UbiC is a by-product of committing
      chorismate to the quinone branch. Annotating UbiC to pyruvate biosynthesis treats a
      coproduct as a pathway output.
    supported_by:
    - reference_id: file:PSEPK/ubiC/ubiC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Removes the pyruvyl group from chorismate, with concomitant aromatization
        of the ring, to provide 4-hydroxybenzoate (4HB) for the ubiquinone pathway.
    - reference_id: PMID:11825618
      supporting_text: By removing the enolpyruvyl group from chorismate, chorismate lyase
        (CL) produces p-hydroxybenzoate (p-HB) for the ubiquinone biosynthetic pathway.
