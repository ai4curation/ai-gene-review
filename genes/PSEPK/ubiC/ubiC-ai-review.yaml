    summary: >-
      UniRule/HAMAP MF_01632 cytoplasm location. True, but UbiC is a soluble enzyme acting
      on a soluble metabolite, and the more specific cytosol term is carried by this gene.
    action: MODIFY
    reason: >-
      Correct but general. UbiC has no transmembrane segment or signal peptide, and the
      E. coli ortholog was purified to homogeneity as a soluble overexpressed protein
      (PMID:1644758) that hands its product on to the membrane-bound UbiA (PMID:11825618).
      In a bacterium the soluble cytoplasmic compartment is the cytosol, which this gene
      already carries (GO:0005829, TreeGrafter). Refine to cytosol.
