id: Q88K33
gene_symbol: rbsD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RbsD is a cytosolic D-ribose pyranase that interconverts
  beta-D-ribopyranose and beta-D-ribofuranose, accelerating formation of the
  furanose form used by RbsK. The assignment is supported by HAMAP, EC
  5.4.99.62, RHEA:25432, a specific PANTHER subfamily, and experimentally
  characterized Escherichia coli RbsD; KT2440-specific enzymology is
  unavailable.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Correct broad location but redundant with the more precise cytosol annotation.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Appropriate specific location for this soluble ribose-catabolic enzyme.
      action: ACCEPT
  - term:
      id: GO:0005996
      label: monosaccharide metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Correct broad parent of D-ribose catabolism.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0016853
      label: isomerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Correct broad parent of the specific pyranase activity.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0016866
      label: intramolecular transferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Correct ontology parent of D-ribose pyranase activity.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0016872
      label: intramolecular lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        This mapping conflicts with the current GO lineage of D-ribose pyranase
        activity, which descends through intramolecular transferase activity,
        not intramolecular lyase activity.
      action: REMOVE
      reason: >-
        Q88K33 is assigned EC 5.4.99.62 and GO:0062193; GO:0016872 is not an
        ancestor of the specific pyranase term and should not be propagated as
        a catalytic parent.
  - term:
      id: GO:0019303
      label: D-ribose catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Direct pathway context for accelerating formation of the RbsK substrate form.
      action: ACCEPT
  - term:
      id: GO:0048029
      label: monosaccharide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Catalytic substrate binding is already entailed by D-ribose pyranase
        activity and does not describe a separate evolved function.
      action: MARK_AS_OVER_ANNOTATED
  - term:
      id: GO:0062193
      label: D-ribose pyranase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Specific core catalytic activity supported by EC 5.4.99.62 and RHEA:25432.
      action: ACCEPT
