- id: PMID:36494359
  title: Structure of the AlgKX modification and secretion complex required for alginate production
    and biofilm attachment in Pseudomonas aeruginosa.
  findings:
  - statement: The KT2440 AlgKX complex was crystallized to2.5Å (PDB7ULA), establishing direct
      target-specific complex architecture.
  - statement: KT2440 AlgX alone directly binds polyM and polyMG oligosaccharides; the increasing-affinity
      polyM-length trend of PaAlgX was absent.
    supporting_text: AlgXPa was previously shown to bind longer polyM ligands with increasing
      Ka19, however, we did not observe this trend with AlgXPp.
  - statement: The complex shows greater binding for some oligosaccharides than isolated proteins,
      consistent with cooperation in modification/export. Surrogate acetylesterase assays
      are not direct product-identification assays for polymer transfer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked. Methods explicitly identify KT2440 AlgX Q88ND0 and AlgK
      Q88NC7. Structural and binding experiments are on P. putida proteins; genetic secretion/biofilm
      phenotypes are in P. aeruginosa.
- id: PMID:37797696
  title: Pseudomonas aeruginosa AlgF is a protein-protein interaction mediator required for
    acetylation of the alginate exopolysaccharide.
  findings:
  - statement: KT2440 AlgX directly binds AlgF and was tested in surrogate acetylesterase
      assays.
    supporting_text: We found that AlgJPp and AlgXPp bind to AlgFPp with Kd values of 86 ±
      12 μM and 178 ± 5 μM, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods and Results checked; KT2440 AlgX was codon optimized for expression
      in E. coli. No target-specific native polymer-transfer chemistry is established by the
      hydrolysis assay.
