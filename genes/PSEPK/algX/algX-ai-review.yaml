id: Q88ND0
gene_symbol: algX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgX is a periplasmic alginate maturation protein with an N-terminal SGNH hydrolase-like
  domain and a C-terminal carbohydrate-binding module. It binds alginate oligosaccharides
  and forms a complex with AlgK, linking polymer modification to export. It is the probable
  terminal alginate O-acetyltransferase, based on conserved architecture, direct surrogate-substrate
  hydrolysis and the polymer-transfer activity of its Pseudomonas aeruginosa ortholog.
