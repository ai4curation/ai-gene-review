id: Q88ND0
gene_symbol: algX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AlgX is a periplasmic two-domain alginate maturation protein. Its N-terminal
  SGNH-family domain is the probable terminal O-acetyltransferase that modifies
  mannuronate residues, while its C-terminal carbohydrate-binding module binds
  the polymer and helps protect nascent alginate from AlgL during passage
  through the secretion apparatus.
existing_annotations:
  - term:
      id: GO:0042121
      label: alginic acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: AlgX has both polymer-modification and chain-protection roles in alginate biosynthesis.
      action: ACCEPT
      reason: The broad process remains appropriate for the dual function, while GO:0051979 is added for the specific O-acetylation branch.
      supported_by:
        - reference_id: file:PSEPK/algX/algX-uniprot.txt
          supporting_text: Plays two roles in the biosynthesis of the exopolysaccharide
        - reference_id: PMID:23779107
          supporting_text: this protein is essential for polymer production
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: AlgX modifies and protects alginate in the periplasm.
      action: ACCEPT
      reason: The signal peptide, reviewed location, and solved P. putida AlgX structure support this compartment.
      supported_by:
        - reference_id: file:PSEPK/algX/algX-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
  - term:
      id: GO:0016413
      label: O-acetyltransferase activity
    evidence_type: ISS
    original_reference_id: PMID:25165982
    qualifier: enables
    review:
      summary: AlgX is the probable terminal polymer O-acetyltransferase in the Pseudomonas machinery.
      action: NEW
      reason: >-
        The characterized P. aeruginosa Q51372 ortholog directly O-acetylates
        polymannuronate in vitro. No alginate-substrate-specific MF term exists,
        so the valid generic term is paired with exact substrate and process
        context.
      supported_by:
        - reference_id: PMID:25165982
          supporting_text: AlgX was capable of utilizing the surrogate acetyl-donor 4-nitrophenyl acetate to catalyze the O-acetylation of polymannuronic acid.
  - term:
      id: GO:0030247
      label: polysaccharide binding
    evidence_type: ISS
    original_reference_id: PMID:25165982
    qualifier: enables
    review:
      summary: The AlgX carbohydrate-binding module recognizes mannuronate oligomers in alginate.
      action: NEW
      reason: >-
        Direct binding measurements on the P. aeruginosa Q51372 ortholog show
        specific, length-dependent polymannuronate binding, and Q88ND0 retains
        the corresponding C-terminal carbohydrate-binding module.
      supported_by:
        - reference_id: PMID:25165982
          supporting_text: AlgX binds polymannuronic acid specifically in a length-dependent manner.
  - term:
      id: GO:0051979
      label: alginic acid acetylation
    evidence_type: ISS
    original_reference_id: PMID:23779107
    qualifier: involved_in
    review:
      summary: AlgX performs the terminal transfer to mannuronate residues in the alginate polymer.
      action: NEW
      reason: This specific process term captures the experimentally defined ortholog role and conserved KT2440 machinery.
      supported_by:
        - reference_id: PMID:23779107
          supporting_text: site-specific mutation of these residues results in non-acetylated alginate.
