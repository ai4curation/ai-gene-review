    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: AlgX has both polymer-modification and chain-protection roles in alginate biosynthesis.
    action: ACCEPT
    reason: AlgX contributes polymer binding and interaction with AlgK to the modification/export
      assembly, in addition to acetylation. The KT2440 complex is directly structurally characterized,
      and disruption of the corresponding AlgX-AlgK interface impairs production in P. aeruginosa.
      Thus the broader biosynthesis annotation covers a supported assembly role not exhausted
      by the acetylation process.
    supported_by:
