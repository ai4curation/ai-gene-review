- term:
    id: GO:0016413
    label: O-acetyltransferase activity
  evidence_type: ISS
  original_reference_id: PMID:25165982
  qualifier: enables
  review:
    summary: AlgX is the probable terminal polymer O-acetyltransferase in the Pseudomonas
      machinery.
    action: NEW
    reason: P. aeruginosa Q51372 directly transfers acetate from the surrogate donor 4-nitrophenyl
      acetate to polymannuronate (PMID:25165982). KT2440 Q88ND0 has direct AlgKX structure,
      polymer-binding and surrogate ester-hydrolysis evidence (PMIDs:36494359,37797696), supporting
      the conserved terminal-transfer assignment. Hydrolysis alone does not demonstrate polymer
      acetylation, and the native donor remains unresolved.
    supported_by:
    - reference_id: PMID:25165982
      supporting_text: AlgX was capable of utilizing the surrogate acetyl-donor 4-nitrophenyl
        acetate to catalyze the O-acetylation of polymannuronic acid.
- term:
    id: GO:0030247
    label: polysaccharide binding
  evidence_type: ISS
  original_reference_id: PMID:25165982
  qualifier: enables
  review:
    summary: KT2440 AlgX directly binds alginate oligosaccharides containing mannuronate or
      mixed mannuronate/guluronate.
    action: NEW
    reason: The original ortholog-based proposal is strengthened by direct KT2440 Q88ND0 ESI-MS
      binding measurements in PMID:36494359. AlgX alone and its AlgK complex bind polyM and
      polyMG. Unlike the P. aeruginosa protein, KT2440 AlgX did not show increasing affinity
      with polyM length under these conditions; that species-specific trend is not transferred.
    supported_by:
    - reference_id: PMID:36494359
      supporting_text: As expected, we were able to detect the binding of polyM substrates
        by AlgXPp.
    - reference_id: PMID:36494359
      supporting_text: AlgXPa was previously shown to bind longer polyM ligands with increasing
        Ka19, however, we did not observe this trend with AlgXPp.
- term:
    id: GO:0051979
    label: alginic acid acetylation
  evidence_type: ISS
  original_reference_id: PMID:23779107
  qualifier: involved_in
  review:
    summary: AlgX is inferred to perform terminal O-acetylation of mannuronate residues in
      KT2440 alginate.
    action: NEW
    reason: The P. aeruginosa ortholog directly transfers acetyl groups to polymer, while
      KT2440 AlgX has specific family/domain identity, direct polymer binding and surrogate
      ester hydrolysis. This supports inferred catalytic participation; the native KT2440
      transfer reaction was not assayed. This specific process term captures the experimentally
      defined ortholog role and conserved KT2440 machinery. Exact-term comparisons confirm
      experimental acetylation annotations on P. aeruginosa AlgI/AlgJ/AlgF and A. vinelandii
      AlgF; these are convention checks rather than evidence. AlgF has two same-role ortholog
      comparators. The term describes active protein machinery, not the polymer substrate;
      GO-CAM contains no target entry and this term is not an ancestor/descendant duplicate
      of retained biosynthesis.
    supported_by:
    - reference_id: PMID:23779107
      supporting_text: site-specific mutation of these residues results in non-acetylated
        alginate.
