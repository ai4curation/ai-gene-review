  full_text_unavailable: true
  findings:
  - statement: The bacterial AIR-carboxylation route requires PurK and PurE, with PurK supplying
      the N5-CAIR intermediate.
    supporting_text: >-
      Conversion of 5-aminoimidazole ribonucleotide (AIR) to
      4-carboxyaminoimidazole ribonucleotide (CAIR) in Escherichia coli
      requires two proteins - PurK and PurE.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract-only primary research; supports the two-enzyme route
      architecture but is not direct characterization of the P. putida protein.
