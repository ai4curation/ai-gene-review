taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PurK is the ATP-dependent N5-CAIR synthetase that carboxylates AIR to N5-CAIR. PurE then
  rearranges N5-CAIR to CAIR, so the bacterial AIR-carboxylation stage is divided between two enzymes.
