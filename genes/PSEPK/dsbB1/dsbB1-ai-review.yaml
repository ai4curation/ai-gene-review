id: P59345
gene_symbol: dsbB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Inner-membrane DsbB paralog that reoxidizes reduced DsbA and transfers
  reducing equivalents into the quinone pool, sustaining periplasmic
  disulfide-bond formation.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for this integral inner-membrane oxidoreductase.
    action: ACCEPT
    reason: UniProt describes DsbB1 as a multi-pass cell-inner-membrane protein.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DsbB1 sustains oxidative folding by regenerating oxidized DsbA.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record states that DsbB1 is required for periplasmic
      disulfide formation and acts by oxidizing DsbA.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Electron transfer is mechanistically correct but less specific than the DsbB disulfide-redox activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      DsbB1 relays reducing equivalents from reduced DsbA toward quinone, but
      the term does not identify the protein-disulfide substrate.
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the current specific GO assignment for DsbB-family reoxidation of DsbA; physiological direction is DsbA oxidation.
    action: ACCEPT
    reason: >-
      GO:0015035 is defined in the reduced-protein to oxidized-protein
      direction, matching UniProt's statement that DsbB1 oxidizes DsbA.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Correct but less precise than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: The generic membrane location is valid but redundant with plasma membrane.
