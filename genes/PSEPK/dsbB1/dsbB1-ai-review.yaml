- term:
    id: GO:0016672
    label: oxidoreductase activity, acting on a sulfur group of donors, quinone or similar compound as
      acceptor
  evidence_type: IC
  original_reference_id: PMID:12853466
  review:
    summary: DsbB-family sulfur-donor oxidation coupled to quinone reduction.
    action: NEW
    reason: DsbB-specific family membership, four-pass topology, and both conserved redox cysteine pairs
      independently support this catalytic inference from characterized E. coli and PA14 enzymes. No existing
      oxidoreductase-ancestor row is available to refine; neither the protein-disulfide term nor electron-transfer
      term is an ancestor/descendant of GO:0016672. This adds the donor/acceptor-specific MF without manufacturing
      a process or asserting measured KT2440 kinetics, native pairing, or paralog equivalence.
    supported_by:
    - *id001
    - *id003
    - *id002
