gene_symbol: dsbB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Predicted inner-membrane DsbB paralog that reoxidizes reduced DsbA and
  transfers reducing equivalents into the quinone pool, sustaining
  periplasmic disulfide-bond formation.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct location for this integral inner-membrane oxidoreductase.
    action: ACCEPT
    reason: UniProt describes DsbB1 as a multi-pass cell-inner-membrane protein.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DsbB1 sustains oxidative folding by regenerating oxidized DsbA.
    action: ACCEPT
    reason: >-
      The reviewed UniProt record states by similarity that DsbB1 is required
      for periplasmic disulfide formation and acts by oxidizing DsbA.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Generic electron transfer is sound but less specific than the DsbB quinone-coupled sulfur-donor oxidoreductase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      DsbB1 is predicted to relay electrons from reduced DsbA through its
      membrane redox centers to quinone. GO:0009055 captures that relay
      generically, but GO:0016672 more precisely captures DsbB as a
      sulfur-donor oxidoreductase using quinone-like acceptors.
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reversible protein-disulfide oxidoreductase claim captures DsbA reoxidation, but GO:0016672 is the DsbB-specific activity.
    action: MODIFY
    reason: >-
      DsbB1 is inferred to reoxidize reduced DsbA and pass reducing equivalents
      to the quinone pool. The direction-neutral GO:0015035 term is compatible
      with this DsbA oxidation step, but GO:0016672 is more specific for the
      membrane quinone-linked DsbB reaction.
    proposed_replacement_terms:
    - id: GO:0016672
      label: >-
        oxidoreductase activity, acting on a sulfur group of donors, quinone or
        similar compound as acceptor
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Correct but less precise than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: The generic membrane location is valid but redundant with plasma membrane.
