- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: DsbB1 sustains oxidative folding by regenerating oxidized DsbA.
    action: ACCEPT
    reason: DsbB catalyzes regeneration of oxidized DsbA and transfers the resulting electrons to quinone,
      a chemical step of oxidative folding demonstrated by purified reconstitution. Participation follows
      from catalysis, not only necessity. The KT2440 assignment is an inference from DsbB-family architecture;
      PA14 paralog interchangeability is not transferred.
    supported_by:
    - *id001
    - &id003
      reference_id: PMID:12853466
      supporting_text: The membrane protein DsbB from Escherichia coli is essential for disulfide bond
        formation and catalyses the oxidation of the periplasmic dithiol oxidase DsbA by ubiquinone.
    - &id002
      reference_id: PMID:24327342
      supporting_text: In vitro reconstitution of the pathway confirms that both PaDsbB1 and PaDsbB2 shuttle
        electrons from PaDsbA1 to membrane-bound quinones.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: DsbB directs electron transfer from DsbA to the quinone pool.
    action: ACCEPT
    reason: The current definition of electron transfer activity includes enzyme-mediated directed electron
      movement, which is the DsbB redox relay itself. GO:0016672 is not an is_a/part_of descendant of
      this term; no supported narrower descendant is established here. Retain the core electron-transfer
      claim while the catalytic core specifies sulfur donor and quinone acceptor. This assignment is inferred
      for the exact KT2440 reference protein from its family/domain and catalytic architecture; PMID:24327342
      experimentally studies P. aeruginosa PA14, not KT2440. No native KT2440 paralog redundancy or quantitative
      rate is asserted.
    supported_by:
    - *id001
    - *id002
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: DsbB oxidizes the protein substrate DsbA through thiol-disulfide exchange.
    action: ACCEPT
    reason: The reversible GO:0015035 definition includes conversion of reduced protein sulfides to disulfides.
      Reduced DsbA is the protein electron donor; quinone is the terminal acceptor of the DsbB catalytic
      reaction. GO:0016672 describes the acceptor axis and is not an ontology descendant of GO:0015035,
      so substituting it as a granularity refinement would erase a compatible protein-substrate claim.
      Both describe the core reaction. This assignment is inferred for the exact KT2440 reference protein
      from its family/domain and catalytic architecture; PMID:24327342 experimentally studies P. aeruginosa
      PA14, not KT2440. No native KT2440 paralog redundancy or quantitative rate is asserted.
    supported_by:
    - *id001
    - *id003
