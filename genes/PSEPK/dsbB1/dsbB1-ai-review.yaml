- id: PMID:9342327
  title: Respiratory chain is required to maintain oxidized states of the DsbA-DsbB disulfide bond formation system in aerobically growing Escherichia coli cells.
  findings:
  - statement: Primary in vivo work connects DsbB-dependent DsbA reoxidation to quinones and the respiratory electron-transfer chain.
    supporting_text: >-
      These results suggest that the respiratory electron transfer chain
      participates in the oxidation of DsbA, by acting primarily on DsbB.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed- and PMC-verified primary E. coli DsbA/DsbB study with cached full text.
- id: PMID:12853466
  title: Mechanism of the electron transfer catalyst DsbB from Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Purified-system experiments establish DsbB as an electron-transfer catalyst that oxidizes DsbA through ubiquinone.
    supporting_text: >-
      The membrane protein DsbB from Escherichia coli is essential for
      disulfide bond formation and catalyses the oxidation of the periplasmic
      dithiol oxidase DsbA by ubiquinone.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary mechanistic study; only the abstract is cached.
