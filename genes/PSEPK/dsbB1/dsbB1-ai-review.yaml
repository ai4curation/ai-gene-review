taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DsbB1 is a predicted inner-membrane DsbB-family oxidoreductase of Pseudomonas putida KT2440.
  Its two redox-active cysteine pairs support oxidation of reduced DsbA and transfer of electrons to membrane
  quinones during oxidative protein folding. The relative contributions and native partner preferences
  of the two KT2440 DsbB paralogs remain unresolved.
