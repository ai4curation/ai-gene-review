taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: CatA-II (PP_3166, Q88I35) is a second catechol 1,2-dioxygenase paralog in Pseudomonas putida
  KT2440. It catalyzes Fe(III)-dependent intradiol ortho-cleavage of catechol to cis,cis-muconate, the
  first step of the catechol branch of the beta-ketoadipate pathway. Unlike the primary CatA-I/PP_3713
  enzyme in the cat regulon, CatA-II is located downstream of the benABCD benzoate upper-pathway operon.
  KT2440 proteomics identifies PP_3166 as its second catechol 1,2-dioxygenase, while work on the corresponding
  ben-linked paralog in P. putida mt-2 supports a safety-valve role that relieves catechol surplus during
  benzoate-induced aromatic catabolism.
aliases:
- PP_3166
- catA2
