        the carboxylic acid group of the carboxyl-terminal glycine into a thiocarboxylate.
- term:
    id: GO:0052837
    label: thiazole biosynthetic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_5105/PP_5105-bioinformatics/RESULTS.md
  review:
    summary: Proposed BP; ThiS supplies the thiazole sulfur atom.
    action: NEW
    reason: >-
      ThiS takes part in thiazole biosynthesis, not only being required for it: its
      thiocarboxylate supplies the sulfur atom that becomes S1 of the thiazole ring (the chemistry
      case in which a carrier contributes atoms to the product). The PAINT IBD at PTN002157649 places this term
      on the ThiS family root, and E. coli ThiS has it by direct assay. The locus lies next to
      thiG (PP_5104; consecutive locus tags and EMBL protein ids AAN70669.1 and AAN70670.1), the
      enzyme that receives the sulfur.
    supported_by:
    - reference_id: PMID:9632726
      supporting_text: Identification of ThiS thiocarboxylate as the immediate sulfur donor in the
        thiazole formation.
    - reference_id: PMID:17403671
      supporting_text: Reconstitution of the [4Fe-4S] cluster in ThiH was essential for activity, as
        was the use of ThiS in the thiocarboxylate form.
    - reference_id: file:PSEPK/PP_5105/PP_5105-uniprot.txt
      record_section: ["DR:EMBL"]
      supporting_text: EMBL; AE015451; AAN70670.1; -; Genomic_DNA.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    The 92-residue Q88CS5 model begins about 21-26 residues upstream of the start used by
    Pseudomonas ThiS orthologs. In a local alignment with 340 Pseudomonas IPR010035 entries whose
    N-terminus could be placed, ortholog Met1 aligns to Q88CS5 Met27 (301 entries, 66 aa) or Met22
    (38 entries, 71 aa). Only one other entry aligns from Q88CS5 residue 1. Residues 1-21 are
    therefore probably not part of the expressed protein. The ThiS beta-grasp core and C-terminal
    Gly-Gly are unaffected, so the functional assignment stands; only residue numbering would
    change.
  evidence_types:
  - ORTHOLOG_COMPARISON
  supported_by:
  - reference_id: file:PSEPK/PP_5105/PP_5105-bioinformatics/RESULTS.md
    supporting_text: 'Output line: "(ortholog length, Q88CS5 residue aligned to ortholog Met1): {(66,
      np.int64(27)): 301, (71, np.int64(22)): 38, (92, np.int64(1)): 1}"'
