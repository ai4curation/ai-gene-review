core_functions:
- description: >-
    Ubiquitin-like sulfur carrier: once its C-terminal glycine is converted to a thiocarboxylate
    with IscS/ThiI-mobilised sulfur, ThiS delivers that sulfur to thiazole synthase ThiG (PP_5104)
    for formation of the thiazole moiety of thiamine.
