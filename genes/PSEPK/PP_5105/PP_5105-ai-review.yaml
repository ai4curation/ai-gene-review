- term:
    id: GO:0097163
    label: sulfur carrier activity
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_5105/PP_5105-bioinformatics/RESULTS.md
  review:
    summary: Proposed MF for the ThiS sulfur carrier; GOA has no annotation for this entry.
    action: NEW
    reason: >-
      Q88CS5 matches the ThiS-specific signatures IPR010035 and TIGR01683, and its ThiS core aligns
      end to end with E. coli ThiS, whose C-terminal glycine is converted to the thiocarboxylate
      that serves as the immediate sulfur donor for thiazole formation. The C-terminal Gly-Gly that
      carries the sulfur is conserved. ThiS does the work of sulfur delivery: it covalently holds
      the sulfur as its own C-terminal thiocarboxylate and hands it to ThiG, which matches the GO
      definition ("Covalently binding to sulfur and delivering it to an acceptor molecule").
      Comparator check: E. coli ThiS (O32583) carries this term by IDA, and E. coli and
      B. subtilis ThiS carry it by IBA from PAINT node PTN002157649 at the root of PTHR34472, the
      family that contains Q88CS5 (subfamily SF1). The absence of a GOA row for Q88CS5 is
      therefore not a curator decision; the entry simply has no propagated annotation.
