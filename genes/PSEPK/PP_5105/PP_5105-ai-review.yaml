suggested_questions:
- question: KT2440 has no dedicated thiF gene. Which enzyme adenylylates the ThiS C-terminus here?
    Is it the MoaD-activating MoeB (PP_0735) or an unannotated E1-like protein?
- question: Which start codon is used for PP_5105 in vivo (Met1, Met22 or Met27)?
suggested_experiments:
- description: Delete PP_5105 in KT2440 and test for a thiamine requirement on minimal medium, with
    complementation by the 66- or 71-residue form.
  experiment_type: genetic knockout and complementation
- description: Purify ThiS from KT2440 or a heterologous host and use intact-protein mass spectrometry
    to detect the C-terminal thiocarboxylate (+16 Da) and the N-terminus. Repeat in a moeB mutant
    background to test whether MoeB activates ThiS.
  experiment_type: mass spectrometry
