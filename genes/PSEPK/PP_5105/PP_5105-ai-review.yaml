  label: Pseudomonas putida KT2440
description: >-
  PP_5105 encodes the sulfur carrier protein ThiS of Pseudomonas putida KT2440, a small
  ubiquitin-like beta-grasp protein (ThiS/MoaD superfamily; InterPro IPR010035, NCBIfam
  TIGR01683, Pfam PF02597) that ends in the conserved Gly-Gly motif. In the bacterial thiazole
  pathway the C-terminal glycine of ThiS is adenylylated by an E1-like enzyme and converted to a
  thiocarboxylate with sulfur mobilised from cysteine by IscS and ThiI. ThiS thiocarboxylate then
  donates that sulfur to thiazole synthase ThiG, which builds it into the thiazole phosphate
  moiety of thiamine. PP_5105 is the locus immediately following thiG (PP_5104). KT2440 has no
  dedicated thiF gene, so the enzyme that activates ThiS in this organism is not known. The
  annotated 92-residue model carries an N-terminal extension of about 21-26 residues that
  Pseudomonas ThiS orthologs lack; the ThiS core is residues 27-92. Function is inferred from
  family membership and pathway context; the protein has not been studied experimentally.
