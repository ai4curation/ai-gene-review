  title: 'Identification and characterization of D-hydroxyproline dehydrogenase and Delta1-pyrroline-4-hydroxy-2-carboxylate deaminase involved in novel L-hydroxyproline metabolism of bacteria: metabolic convergent evolution.'
  full_text_unavailable: true
  findings:
  - statement: Pseudomonas hydroxyproline-pathway catalytic genes occur in a genomic cluster.
    supporting_text: "These genes were clustered together with genes encoding other catalytic enzymes on the bacterial genomes."
    reference_section_type: ABSTRACT
