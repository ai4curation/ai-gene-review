id: Q88NF5
gene_symbol: PP_1256
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1256 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme and candidate terminal 2,5-dioxopentanoate oxidoreductase in the
  KT2440 hydroxyproline-catabolism locus. Its KGSADH-family assignment supports
  alpha-ketoglutaric-semialdehyde chemistry, while its cofactor preference and
  contribution relative to the other KT2440 paralogs remain unresolved.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but uninformative root oxidoreductase term; the supported specific activity is substrate-specific 2,5-dioxovalerate dehydrogenase without a cofactor claim.
    action: MODIFY
    reason: >-
      PP_1256 is an oxidoreductase, but this InterPro-domain mapping says
      nothing about the substrate. Membership in the KGSADH subgroup
      (IPR044151), which it shares with the characterized A. baylyi KgsD,
      supports a substrate-specific descendant. The replacement is the
      proposed cofactor-neutral term rather than the NADP+-specific
      GO:0047533 this protein carries, because the row below MODIFIES that
      term away on cofactor grounds, and the two must agree.
    proposed_replacement_terms:
    - id: NTR
      label: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct reaction class, and the only existing term that spans both cofactors; the substrate-specific neutral term proposed below is better still.
    action: MODIFY
    reason: >-
      The NAD(P)-aldehyde-oxidoreductase class is right, and it is the one
      existing term here that leaves the cofactor open, which this protein's
      evidence requires. It is nevertheless substrate-general: the KGSADH
      subgroup signature and the characterized members of PTHR43353:SF3
      identify the substrate as 2,5-dioxopentanoate. The replacement is
      therefore the proposed term, which keeps the substrate and drops the
      cofactor, and the same replacement as the two other rows.
    proposed_replacement_terms:
    - id: NTR
      label: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
        2 H(+); Xref=Rhea:RHEA:11296
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The 2,5-dioxopentanoate substrate is well supported, but the NADP+ cofactor branch is not; the cofactor-neutral term proposed below is the right level.
    action: MODIFY
    reason: >-
      The substrate claim is sound on three lines: PP_1256 carries the KGSADH
      subgroup signature IPR044151, it sits in PANTHER PTHR43353:SF3 whose
      Swiss-Prot members are almost all EC 1.2.1.26 KGSADHs, and it is encoded
      next to the KT2440 hydroxyproline genes proR, PP_1255 and PP_1257.
      The cofactor is the weak half, and this term names it. PP_1256 has not
      been assayed, and the characterized members of its own subfamily use
      both cofactors: A. brasilense LhpG, the hydroxyproline-pathway isozyme,
      carries both reactions and prefers NADP+ about 75-fold on Km, with a
      higher Vmax for NAD+; its paralog KGSADH-II prefers NAD+; and
      P. aeruginosa PA2217 is curated NAD+-first. GO splits the reaction into
      an NADP+ child (this term) and an NAD+ child (GO:0044104) with no
      substrate-specific neutral parent, so for an unassayed protein either
      child asserts more than the evidence. The replacement is therefore the
      proposed cofactor-neutral term below, not the sibling NAD+ child. It is
      also preferred to GO:0004030, the existing cofactor-neutral parent that
      the sibling PP_3602 review uses: GO:0004030 drops the cofactor claim but
      also the substrate, and the substrate is the well-supported half here.
      Once the proposed term exists it should serve both paralogs. This is a
      cofactor judgement, not a doubt about the reaction: A. baylyi KgsD and
      LhpG, which were assayed, keep the cofactor child their own measurements
      support. PP_1256 also remains the candidate for the
      terminal step rather than a proven one, since PP_2585 and PP_3602 carry
      the same EC assignment.
    proposed_replacement_terms:
    - id: NTR
      label: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
        2 H(+); Xref=Rhea:RHEA:11296, ChEBI:CHEBI:15377, ChEBI:CHEBI:15378,
        ChEBI:CHEBI:16810, ChEBI:CHEBI:57783, ChEBI:CHEBI:58136,
        ChEBI:CHEBI:58349; EC=1.2.1.26;
        Evidence={ECO:0000269|PubMed:18364348};
    - reference_id: PMID:17202142
      supporting_text: "NAD(+)-dependent KGSADH-II and NADP(+)-dependent KGSADH-III"
    - reference_id: file:AZOBR/LhpG/LhpG-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Prefers NADP(+) to NAD(+) as a cosubstrate.
    - reference_id: file:AZOBR/LhpG/LhpG-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=1.136 mM for NAD(+) (at 25 degrees Celsius and pH 7.2)
    - reference_id: PMID:22833679
      supporting_text: "These genes were clustered together with genes encoding other catalytic enzymes on the bacterial genomes."
