core_functions:
- description: >-
    Oxidation of 2,5-dioxopentanoate to 2-oxoglutarate with NADP+ (and predicted
    activity with NAD+).
  molecular_function:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  supported_by:
