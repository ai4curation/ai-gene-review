id: Q88NF5
gene_symbol: PP_1256
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_1256 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme and candidate terminal 2,5-dioxopentanoate oxidoreductase in the
  KT2440 hydroxyproline-catabolism locus. Its KGSADH-family assignment supports
  alpha-ketoglutaric-semialdehyde chemistry, while its cofactor preference and
  contribution relative to the other KT2440 paralogs remain unresolved.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but uninformative root oxidoreductase term; the supported specific activity is 2,5-dioxovalerate dehydrogenase.
    action: MODIFY
    reason: >-
      PP_1256 is an oxidoreductase, but this InterPro-domain mapping says
      nothing about the substrate. Membership in the KGSADH subgroup
      (IPR044151), which it shares with the characterized A. baylyi KgsD,
      supports the specific descendant GO:0047533 that this protein already
      carries.
    proposed_replacement_terms:
    - id: GO:0047533
      label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct reaction class, but the KGSADH subgroup assignment supports the substrate-specific activity.
    action: MODIFY
    reason: >-
      The NAD(P)-aldehyde-oxidoreductase class is right. The KGSADH subgroup
      signature and the characterized members of PTHR43353:SF3 identify the
      substrate as 2,5-dioxopentanoate, so the specific descendant
      GO:0047533, already on this protein, is preferred.
    proposed_replacement_terms:
    - id: GO:0047533
      label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
        2 H(+); Xref=Rhea:RHEA:11296
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: 2,5-dioxovalerate dehydrogenase is the best-supported specific activity; NADP+ use is inferred from characterized relatives.
    action: ACCEPT
    reason: >-
      PP_1256 has not been assayed. Three lines support the activity. It
      carries the KGSADH subgroup signature (IPR044151). It is in the same
      PANTHER subfamily (PTHR43353:SF3) as A. baylyi KgsD, whose purified
      enzyme UniProt curates with the NADP+-coupled Rhea 11296 reaction from
      experiment. And it is encoded next to the KT2440 hydroxyproline genes
      proR, PP_1255 and PP_1257, matching the hydroxyproline-inducible
      KGSADH-III of A. brasilense, which is NADP+-dependent. The NADP+
      specificity is therefore an inference. If PP_1256 proves to prefer
      NAD+, the cofactor-neutral term proposed below would replace it. PP_1256
      is the candidate enzyme for the terminal step, not a proven one: the
      paralogs PP_2585 and PP_3602 have the same EC assignment.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
        2 H(+); Xref=Rhea:RHEA:11296, ChEBI:CHEBI:15377, ChEBI:CHEBI:15378,
        ChEBI:CHEBI:16810, ChEBI:CHEBI:57783, ChEBI:CHEBI:58136,
        ChEBI:CHEBI:58349; EC=1.2.1.26;
        Evidence={ECO:0000269|PubMed:18364348};
    - reference_id: PMID:17202142
      supporting_text: "NAD(+)-dependent KGSADH-II and NADP(+)-dependent KGSADH-III"
    - reference_id: PMID:22833679
      supporting_text: "These genes were clustered together with genes encoding other catalytic enzymes on the bacterial genomes."
