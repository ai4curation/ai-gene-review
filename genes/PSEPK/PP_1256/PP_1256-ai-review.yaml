id: Q88NF5
gene_symbol: PP_1256
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_1256 is a predicted 2,5-dioxovalerate dehydrogenase that oxidizes
  2,5-dioxopentanoate to 2-oxoglutarate using NAD+ or NADP+. Its position next
  to the characterized KT2440 hydroxyproline enzymes
  makes it the leading terminal-step candidate, but two additional KT2440
  EC 1.2.1.26 paralogs preclude a definitive pathway assignment.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_1256 is an oxidoreductase, but this term omits its defining substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The exact EC-mapped 2,5-dioxovalerate dehydrogenase term is available and
      is supported by the alpha-ketoglutaric-semialdehyde dehydrogenase
      subfamily.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term is compatible but less specific than GO:0047533.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UniProt predicts both NAD+- and NADP+-coupled oxidation, while GO:0047533
      captures the exact substrate and the EC-defined NADP+ form.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "DE            EC=1.2.1.26"
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: PP_1256 oxidizes 2,5-dioxopentanoate to 2-oxoglutarate.
    action: ACCEPT
    reason: >-
      EC 1.2.1.26, Rhea 11296 and 47152, and the substrate-specific InterPro
      IPR044151 signature support the exact reaction. These data do not resolve
      which of the three KT2440 paralogs carries hydroxyproline-pathway flux.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
