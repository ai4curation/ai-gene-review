id: Q88NF5
gene_symbol: PP_1256
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_1256 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme. Its position beside characterized KT2440 hydroxyproline-catabolism
  enzymes makes it a candidate for terminal 2,5-dioxopentanoate oxidation in
  that route, but its physiological substrate and NAD+ versus NADP+ preference
  have not been tested directly.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_1256 is an oxidoreductase, but this term omits its defining substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The exact EC-mapped 2,5-dioxovalerate dehydrogenase term is available and
      is supported by the alpha-ketoglutaric-semialdehyde dehydrogenase
      subfamily.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term captures the supported cofactor range without choosing NAD+ or NADP+.
    action: ACCEPT
    reason: >-
      The KGSADH-family assignment supports aldehyde oxidation with NAD(P)+,
      whereas both cofactor-specific UniProt reactions are computational.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "CC       Reaction=2,5-dioxopentanoate + NAD(+) + H2O = 2-oxoglutarate + NADH + 2"
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts NADP+-coupled oxidation of 2,5-dioxopentanoate.
    action: UNDECIDED
    reason: >-
      InterPro IPR044151 supports KGSADH chemistry, but the EC assignment and
      both Rhea reactions are automated. No assay establishes NADP+ specificity
      or resolves which KT2440 paralog carries hydroxyproline-pathway flux.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
  title: UniProtKB entry for PP_1256 (Q88NF5)
  findings:
  - statement: >-
      The record assigns 2,5-dioxovalerate dehydrogenase EC 1.2.1.26 and
      predicts NAD+- and NADP+-coupled oxidation to 2-oxoglutarate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Reaction and subfamily evidence are concordant, but the target lacks a
      direct biochemical reference.
- id: file:modules/hydroxyproline_catabolism.yaml
  title: Bacterial trans-4-hydroxy-L-proline catabolism module
  findings:
  - statement: PP_1256 is the synteny-favored terminal dehydrogenase candidate.
core_functions:
- description: >-
    Predicted oxidation of an aldehyde or oxo-group substrate with NAD+ or
    NADP+; synteny suggests a possible terminal role in hydroxyproline
    catabolism.
  molecular_function:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
  supported_by:
  - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
    supporting_text: "DE   RecName: Full=2,5-dioxovalerate dehydrogenase"
proposed_new_terms: []
suggested_questions:
- question: >-
    Does PP_1256, rather than the PP_2585 or PP_3602 paralog, carry the terminal
    2,5-dioxopentanoate-dehydrogenase flux during hydroxyproline growth?
suggested_experiments:
- description: >-
    Compare hydroxyproline growth and 2,5-dioxopentanoate accumulation in
    PP_1256, PP_2585, and PP_3602 single and combinatorial deletion strains.
  experiment_type: paralog-resolved pathway genetics and metabolite profiling
