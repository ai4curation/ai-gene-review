id: Q88NF5
gene_symbol: PP_1256
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_1256 is a predicted alpha-ketoglutaric-semialdehyde dehydrogenase-family
  enzyme and candidate terminal 2,5-dioxopentanoate oxidoreductase in the
  KT2440 hydroxyproline-catabolism locus. Its KGSADH-family assignment supports
  alpha-ketoglutaric-semialdehyde chemistry, while its cofactor preference and
  contribution relative to the other KT2440 paralogs remain unresolved.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: PP_1256 is an oxidoreductase, but this term omits its defining substrate.
    action: KEEP_AS_NON_CORE
    reason: >-
      This broad parent is chemically correct but does not capture either
      aldehyde-dehydrogenase chemistry or the KGSADH substrate class.
- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors,
      NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reaction-class term captures the supported cofactor range without identifying aldehyde dehydrogenase chemistry.
    action: KEEP_AS_NON_CORE
    reason: >-
      The KGSADH-family assignment supports aldehyde oxidation with NAD(P)+,
      whereas both cofactor-specific UniProt reactions are computational.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
- term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: The EC mapping predicts NADP+-coupled oxidation of 2,5-dioxopentanoate.
    action: UNDECIDED
    reason: >-
      InterPro IPR044151 supports KGSADH chemistry, but the EC assignment and
      both Rhea reactions are automated. No assay establishes NADP+ specificity
      or resolves which KT2440 paralog carries hydroxyproline-pathway flux.
    supported_by:
    - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
      supporting_text: "DR   GO; GO:0047533; F:2,5-dioxovalerate dehydrogenase (NADP+) activity; IEA:UniProtKB-EC."
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: ISS
  original_reference_id: PMID:17202142
  qualifier: enables
  review:
    summary: PP_1256 has KGSADH-family aldehyde dehydrogenase chemistry with unresolved NAD+ versus NADP+ usage.
    action: NEW
    reason: >-
      GO:0004030 is the most specific current cofactor-neutral MF. IPR044151 and
      characterized KGSADH isozymes support alphaKGSA oxidation, while the
      proposed term below records the missing substrate-specific neutral term.
    supported_by:
    - reference_id: PMID:17202142
      supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
  title: UniProtKB entry for PP_1256 (Q88NF5)
  findings:
  - statement: >-
      The record assigns 2,5-dioxovalerate dehydrogenase EC 1.2.1.26 and
      predicts NAD+- and NADP+-coupled oxidation to 2-oxoglutarate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Reaction and subfamily evidence are concordant, but the target lacks a
      direct biochemical reference.
- id: file:modules/hydroxyproline_catabolism.yaml
  title: Bacterial trans-4-hydroxy-L-proline catabolism module
  findings:
  - statement: PP_1256 is the synteny-favored terminal dehydrogenase candidate.
- id: PMID:22833679
  title: 'Identification and characterization of D-hydroxyproline dehydrogenase and Delta1-pyrroline-4-hydroxy-2-carboxylate deaminase involved in novel L-hydroxyproline metabolism of bacteria: metabolic convergent evolution.'
  full_text_unavailable: true
  findings:
  - statement: Pseudomonas hydroxyproline-pathway catalytic genes occur in a genomic cluster.
    supporting_text: "These genes were clustered together with genes encoding other catalytic enzymes on the bacterial genomes."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract supports pathway clustering in P. putida, not a direct assay of PP_1256.
- id: PMID:17202142
  title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic convergent evolution.
  full_text_unavailable: true
  findings:
  - statement: A. brasilense KGSADH isozymes share alphaKGSA specificity but differ in cofactor preference.
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract explicitly identifies A. brasilense; it supplies family-level enzymology, not KT2440 evidence.
- id: PMID:16835232
  title: 'A novel alpha-ketoglutaric semialdehyde dehydrogenase: evolutionary insight into an alternative pathway of bacterial L-arabinose metabolism.'
  full_text_unavailable: true
  findings:
  - statement: A. brasilense ALDH shows high catalytic efficiency with alphaKGSA.
    supporting_text: "Higher catalytic efficiency of ALDH was found with alphaKGSA and succinic semialdehyde among the tested aldehyde substrates."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Orthologous biochemical evidence supports the substrate class, not PP_1256 pathway assignment.
core_functions:
- description: >-
    Predicted alpha-ketoglutaric-semialdehyde oxidation with NAD+ or NADP+;
    synteny favors a terminal role in hydroxyproline catabolism.
  molecular_function:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: PMID:17202142
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
proposed_new_terms:
- proposed_name: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
  proposed_definition: Catalysis of 2,5-dioxopentanoate oxidation to 2-oxoglutarate using either NAD+ or NADP+ as electron acceptor.
  justification: >-
    GO:0047533 specifies NADP+, while bacterial KGSADH orthologs and the KT2440
    records support the same substrate-specific reaction with either cofactor.
  proposed_parent:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: PMID:17202142
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
suggested_questions:
- question: >-
    Does PP_1256, rather than the PP_2585 or PP_3602 paralog, carry the terminal
    2,5-dioxopentanoate-dehydrogenase flux during hydroxyproline growth?
suggested_experiments:
- description: >-
    Compare hydroxyproline growth and 2,5-dioxopentanoate accumulation in
    PP_1256, PP_2585, and PP_3602 single and combinatorial deletion strains.
  experiment_type: paralog-resolved pathway genetics and metabolite profiling
