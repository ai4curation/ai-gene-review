core_functions:
- description: >-
    Predicted NAD(P)+-dependent oxidation of 2,5-dioxopentanoate
    (alpha-ketoglutaric semialdehyde) to 2-oxoglutarate. The cofactor is left
    open because the characterized members of this subfamily use both. Synteny
    with the KT2440 hydroxyproline genes makes PP_1256 the leading candidate
    for the terminal step of hydroxyproline catabolism.
  proposed_molecular_function: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: file:PSEPK/PP_1256/PP_1256-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
  - reference_id: PMID:17202142
    supporting_text: "NAD(+)-dependent KGSADH-II and NADP(+)-dependent KGSADH-III"
  - reference_id: file:AZOBR/LhpG/LhpG-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Prefers NADP(+) to NAD(+) as a cosubstrate.
proposed_new_terms:
- proposed_name: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity
  proposed_definition: Catalysis of 2,5-dioxopentanoate oxidation to 2-oxoglutarate using either NAD+ or NADP+ as electron acceptor.
  justification: >-
    GO:0047533 specifies NADP+, while bacterial KGSADH orthologs and the KT2440
    records support the same substrate-specific reaction with either cofactor.
  proposed_parent:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  supported_by:
  - reference_id: PMID:17202142
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
suggested_questions:
- question: >-
    Does PP_1256, rather than the PP_2585 or PP_3602 paralog, carry the terminal
    2,5-dioxopentanoate-dehydrogenase flux during hydroxyproline growth?
suggested_experiments:
- description: >-
    Compare hydroxyproline growth and 2,5-dioxopentanoate accumulation in
    PP_1256, PP_2585, and PP_3602 single and combinatorial deletion strains.
  experiment_type: paralog-resolved pathway genetics and metabolite profiling
