  label: Pseudomonas putida KT2440
description: TusA (PP_2116) is a small cytoplasmic sulfur carrier of the TusA family with a CPxP-motif
  active-site cysteine (Cys17). By homology to Escherichia coli TusA it accepts persulfide sulfur from
  the cysteine desulfurase IscS and passes it to TusD of the TusBCD complex, feeding the TusBCD-TusE-MnmA
  relay that forms the 2-thio group of the modified wobble uridine (U34) in tRNA. KT2440 also encodes
  a second, more distant TusA-like protein (PP_1233) that lacks the TusA-specific IPR022931 signature.
