id: Q88L21
gene_symbol: tusA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TusA is a small cytosolic sulfur-carrier protein with a conserved reactive cysteine. The
  KT2440 homolog is predicted to accept persulfide sulfur from IscS and supply the TusBCD relay for MnmA-dependent
  tRNA U34 thiolation. This assignment does not restrict TusA to a single sulfur-utilization pathway;
  the allocation of sulfur to other acceptors in KT2440 remains uncharacterized.
