      id: GO:0004831
      label: tyrosine-tRNA ligase activity
- term:
    id: GO:0004831
    label: tyrosine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: tyrS supplies tyrosine-charged tRNA(Tyr) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_02007 identifies the type 2 TyrRS reaction, while the S4-like RNA-binding region
      at residues 336–396 supports tRNA engagement. This does not imply unrestricted binding to other
      nucleic acids. The independently curated MF_02007 reaction supports this specific MF; electronic
      provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to tyrS-catalysed tyrosine activation.
    action: ACCEPT
    reason: The curated MF_02007 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: tyrS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_02007 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/tyrS/tyrS-uniprot.txt
