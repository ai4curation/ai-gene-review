id: Q88QQ2
gene_symbol: tyrS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TyrS is a class I tyrosyl-tRNA synthetase that forms a tyrosyl-adenylate intermediate and
  transfers tyrosine to tRNA(Tyr); its C-terminal RNA-binding region helps recognize the tRNA substrate.
  It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA substrate
  for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate tyrosine by tyrS.
    action: MODIFY
    reason: The MF_02007 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/tyrS/tyrS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Tyr) + L-tyrosine + ATP = L-tyrosyl-tRNA(Tyr) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The supported nucleic-acid partner of tyrS is tRNA(Tyr).
    action: MODIFY
    reason: HAMAP MF_02007 identifies the type 2 TyrRS reaction, while the S4-like RNA-binding region
      at residues 336–396 supports tRNA engagement. This does not imply unrestricted binding to other
      nucleic acids. The charged tRNA is an actual enzyme substrate, so tRNA binding is a supported refinement
      of the broader binding term rather than an unrelated ancillary effect.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0000049
      label: tRNA binding
