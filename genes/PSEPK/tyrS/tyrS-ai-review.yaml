- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for tyrS.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_02007 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: tyrS catalyses the charging step that supplies tyrosine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_02007 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006437
    label: tyrosyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The tyrosine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006437 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain tyrosine specificity
      in GO:0004831. This is ontology maintenance, not a rejection of the MF_02007 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0043039
    label: tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: tyrS-mediated tRNA(Tyr) charging supplies protein translation.
    action: MODIFY
    reason: HAMAP MF_02007 identifies the type 2 TyrRS reaction, while the S4-like RNA-binding region
      at residues 336–396 supports tRNA engagement. This does not imply unrestricted binding to other
      nucleic acids. Current GO:0043039 is tRNA charging; its descendant GO:0006418 specifies the supported
      translational use of the charged product. The original fetched label is preserved.
    supported_by: *id001
    proposed_replacement_terms:
