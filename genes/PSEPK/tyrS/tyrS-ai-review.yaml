    action: MODIFY
    reason: HAMAP MF_02007 identifies the type 2 TyrRS reaction, while the S4-like RNA-binding region
      at residues 336–396 supports tRNA engagement. This does not imply unrestricted binding to other
      nucleic acids. GO:0004831 is the supported amino-acid-specific descendant of GO:0004812; the parent
      is biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
