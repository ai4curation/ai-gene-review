id: Q88KT1
gene_symbol: phnX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  phnX (PP_2208) encodes the phosphonoacetaldehyde hydrolase/phosphonatase of
  the Pseudomonas putida KT2440 2-aminoethylphosphonate degradation route. It
  is a HAD-like, magnesium-dependent hydrolase that cleaves
  phosphonoacetaldehyde to acetaldehyde and
  inorganic phosphate, completing carbon-phosphorus bond cleavage after the
  upstream PhnW transaminase step.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      Magnesium binding is correct for this PhnX phosphonatase.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt records a magnesium cofactor and one magnesium ion bound per
      subunit for the HAMAP-supported PhnX enzyme. This is an ancillary
      catalytic property rather than the defining molecular function.
    supported_by:
    - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
      supporting_text: Binds 1 Mg(2+) ion per subunit.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Generic catalytic activity is true but uninformative for a characterized
      phosphonoacetaldehyde hydrolase.
    action: MODIFY
    reason: >-
      Replace the broad catalytic parent with the specific PhnX molecular
      function already present in GOA.
    proposed_replacement_terms:
    - id: GO:0050194
      label: phosphonoacetaldehyde hydrolase activity
    supported_by:
    - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
      supporting_text: Reaction=phosphonoacetaldehyde + H2O = acetaldehyde + phosphate
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Cytosol is appropriate for a soluble bacterial phosphonate-catabolic
      enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      TreeGrafter assigns cytosol, and the UniProt entry has no membrane or
      secretion features suggesting another location. The localization is
      plausible but not directly tested in KT2440.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      DNA repair is not supported for PhnX and conflicts with the reviewed
      phosphonoacetaldehyde hydrolase function.
    action: REMOVE
    reason: >-
      This TreeGrafter annotation appears to be an automated family-transfer
      artifact. The reviewed UniProt record and pathway context support
      phosphonate catabolism instead.
- term:
    id: GO:0008967
    label: phosphoglycolate phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Phosphoglycolate phosphatase activity is a wrong sibling-family label
      propagated from the broader HAD/PGP-like family.
    action: REMOVE
    reason: >-
      PSEPK PhnX is reviewed as phosphonoacetaldehyde hydrolase with EC
      3.11.1.1 and a matching Rhea reaction. Use the substrate-specific
      phosphonoacetaldehyde hydrolase term as the core molecular function.
    supported_by:
    - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
      supporting_text: 'DR   PANTHER; PTHR43434:SF19; PHOSPHONOACETALDEHYDE HYDROLASE; 1.'
- term:
    id: GO:0019700
    label: organic phosphonate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Organic phosphonate catabolism is the correct pathway context for PhnX.
    action: ACCEPT
    reason: >-
      PhnX cleaves phosphonoacetaldehyde, the downstream intermediate generated
      by PhnW during 2-aminoethylphosphonate degradation.
    supported_by:
    - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
      supporting_text: Involved in phosphonate degradation.
    - reference_id: PMID:9841125
      supporting_text: >-
        The results point to the presence of a substrate inducible 2-aminoethylphosphonic acid
        biodegradation pathway in the isolated strain of Pseudomonas putida.
- term:
    id: GO:0050194
    label: phosphonoacetaldehyde hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the specific core molecular function of PhnX.
    action: ACCEPT
    reason: >-
      UniProt records the EC 3.11.1.1/Rhea reaction converting
      phosphonoacetaldehyde and water to acetaldehyde and phosphate.
    supported_by:
    - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
      supporting_text: Reaction=phosphonoacetaldehyde + H2O = acetaldehyde + phosphate
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__phosphonoacetaldehyde_degradation__ppu00440-deep-research-openscientist.md
      supporting_text: >-
        phnX = PP_2208 (UniProt Q88KT1; EC 3.11.1.1; KEGG ortholog K05306)
        encodes the phosphonoacetaldehyde hydrolase (phosphonatase) that cleaves
        the carbon–phosphorus bond of phosphonoacetaldehyde to yield
        acetaldehyde and inorganic phosphate.
    - reference_id: PMID:10956028
      supporting_text: >-
        Phosphonoacetaldehyde hydrolase (phosphonatase) catalyzes the hydrolysis of
        phosphonoacetaldehyde to acetaldehyde and phosphate using Mg(II) as cofactor.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      InterPro-derived organic phosphonate catabolism is consistent with the
      reviewed PhnX phosphonatase function.
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
  - statement: >-
      UniRule-derived magnesium binding is consistent with the PhnX cofactor.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      ARBA generic catalytic activity reviewed as too broad and replaced by the
      specific PhnX hydrolase activity.
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
  - statement: >-
      Cytosol is retained, but DNA repair and phosphoglycolate phosphatase are
      not treated as core PhnX biology.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined IEA source for the specific phosphonoacetaldehyde hydrolase
      molecular function.
- id: file:PSEPK/phnX/phnX-uniprot.txt
  title: UniProtKB reviewed entry for PSEPK phnX
  findings:
  - supporting_text: Involved in phosphonate degradation.
  - supporting_text: Reaction=phosphonoacetaldehyde + H2O = acetaldehyde + phosphate
  - supporting_text: Binds 1 Mg(2+) ion per subunit.
  - supporting_text: Belongs to the HAD-like hydrolase superfamily. PhnX family.
- id: PMID:9841125
  title: Phosphate starvation-independent 2-aminoethylphosphonic acid biodegradation in a newly isolated strain of Pseudomonas putida, NG2.
  findings:
  - statement: >-
      A P. putida isolate expressed inducible AEP:pyruvate aminotransferase and
      phosphonoacetaldehyde hydrolase activities and used AEP as carbon,
      nitrogen, and phosphorus source.
    supporting_text: >-
      A strain of Pseudomonas putida that utilized the biogenic organophosphonate
      2-aminoethylphosphonic acid as sole carbon and energy, nitrogen and phosphorus
      source contained 2-aminoethylphosphonic acid: pyruvate aminotransferase and
      phosphonoacetaldehyde hydrolase (phosphonatase) activities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract verified; this is direct P. putida NG2 pathway evidence,
      not a direct assay of KT2440 Q88KT1.
- id: PMID:35229442
  title: 2-Aminoethylphosphonate utilization in Pseudomonas putida BIRD-1 is controlled by multiple master regulators.
  findings:
  - statement: >-
      Genetic work in P. putida BIRD-1 identifies PhnWX as its
      2-aminoethylphosphonate transaminase-phosphonatase system.
    supporting_text: >-
      Mutation of a LysR-type regulator, termed AepR, upstream of the 2AEP
      transaminase-phosphonatase system (PhnWX), confirmed this dual regulatory
      mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text verified; direct pathway genetics concern BIRD-1 rather than
      KT2440, so transfer to Q88KT1 remains comparative.
- id: PMID:10956028
  title: 'The crystal structure of bacillus cereus phosphonoacetaldehyde hydrolase: insight into catalysis of phosphorus bond cleavage and catalytic diversification within the HAD enzyme superfamily.'
  findings:
  - statement: >-
      Structural analysis directly establishes the magnesium-dependent
      phosphonoacetaldehyde hydrolase reaction and HAD-family mechanism.
    supporting_text: >-
      Phosphonoacetaldehyde hydrolase (phosphonatase) catalyzes the hydrolysis of
      phosphonoacetaldehyde to acetaldehyde and phosphate using Mg(II) as cofactor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract verified; direct structural evidence is for the Bacillus
      cereus family exemplar, not PSEPK Q88KT1.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__phosphonoacetaldehyde_degradation__ppu00440-deep-research-openscientist.md
  title: OpenScientist pathway research for PSEPK phosphonoacetaldehyde degradation
  findings:
  - statement: >-
      The species-aware pathway report identifies Q88KT1 as the single-copy
      PhnX step and supports the assignment with a substrate-specific family
      signature, operon context, and activity in other P. putida strains.
    supporting_text: >-
      Substrate-specific signature: **IPR006323 (PhnX family)** — a
      phosphonatase-specific TIGRFAM, not merely the broad HAD fold.
