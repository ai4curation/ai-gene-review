id: Q88KT1
gene_symbol: phnX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PhnX (PP_2208) is a predicted soluble magnesium-dependent
  phosphonoacetaldehyde hydrolase of the PhnWX 2-aminoethylphosphonate
  degradation route. It is a HAD-superfamily enzyme with a cap domain that
  supplies the Schiff-base-forming lysine. PhnX cleaves the carbon-phosphorus
  bond of phosphonoacetaldehyde to produce acetaldehyde and inorganic phosphate,
  acting immediately downstream of the adjacent PhnW aminotransferase.
existing_annotations:
  - term:
      id: GO:0000287
      label: magnesium ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Conserved catalytic cofactor property, secondary to the hydrolase activity.
      action: KEEP_AS_NON_CORE
      reason: >-
        The PhnX-specific HAMAP rule predicts a magnesium cofactor and coordinating residues for Q88KT1.
        The Bacillus cereus PhnX structure independently establishes magnesium at the catalytic site (PMID:10956028).
        This accessory cofactor property is accepted as non-core relative to the defining hydrolase activity,
        with the KT2440 metal dependence still inferred.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "Note=Binds 1 Mg(2+) ion per subunit."
          record_section: ["CC:COFACTOR"]
        - reference_id: PMID:10956028
          supporting_text: "phosphonoacetaldehyde to acetaldehyde and phosphate using Mg(II) as cofactor."
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Correct but uninformative relative to the exact PhnX activity.
      action: MODIFY
      reason: >-
        Q88KT1 has a substrate- and reaction-specific annotation supported by
        EC 3.11.1.1, RHEA:18905, HAMAP MF_01375, and InterPro IPR006323.
      proposed_replacement_terms:
        - id: GO:0050194
          label: phosphonoacetaldehyde hydrolase activity
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "DR   InterPro; IPR006323; Phosphonoacetald_hydro."
          record_section: ["DR:InterPro"]
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosolic localization is plausible but lacks independent target-specific support.
      action: UNDECIDED
      reason: >-
        The cached UniProt record contains only the electronic TreeGrafter GO assertion for cytosol, which
        cannot support itself. The intracellular catabolic pathway makes a cytosolic location plausible,
        but the retrieved biochemical studies do not establish localization of Q88KT1 in KT2440. Retain
        this as unresolved pending independent localization or sequence-based evidence; absence of a localization
        assay is not evidence of a different location.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: DNA repair is not supported for this specialized phosphonatase.
      action: REMOVE
      reason: >-
        The PhnX-specific HAMAP rule, InterPro signature, catalytic-site annotation and adjacent phnW
        gene support organic phosphonate catabolism. PMID:9649311 characterizes the corresponding phosphonatases
        in Bacillus and Salmonella. Membership in the broader HAD superfamily does not establish a DNA-repair
        role in KT2440. The co-occurring TreeGrafter phosphoglycolate-phosphatase annotation reflects
        a different substrate specialization; it is not evidence that PhnX processes damaged DNA. No verified
        ancestral-node placement is claimed here.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: Belongs to the HAD-like hydrolase superfamily. PhnX family.
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: DR   InterPro; IPR006323; Phosphonoacetald_hydro.
  - term:
      id: GO:0008967
      label: phosphoglycolate phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Wrong paralog-family activity propagated from the broad PANTHER family.
      action: REMOVE
      reason: >-
        Phosphoglycolate phosphatase hydrolyzes a phosphate ester, whereas PhnX uses substrate Schiff-base
        formation to enable carbon-phosphorus bond cleavage in phosphonoacetaldehyde (PMID:9649311). Q88KT1
        matches the PhnX-specific HAMAP and InterPro classifiers, and its PANTHER subfamily is PTHR43434:SF19.
        The broader parent family label is not sufficient evidence for a second substrate specificity.
        Remove the electronic phosphoglycolate claim while retaining the supported PhnX activity.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          record_section: ["DR:PANTHER"]
          supporting_text: DR   PANTHER; PTHR43434:SF19; PHOSPHONOACETALDEHYDE HYDROLASE; 1.
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: Belongs to the HAD-like hydrolase superfamily. PhnX family.
  - term:
      id: GO:0019700
      label: organic phosphonate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Direct pathway role in hydrolytic cleavage of a phosphonate intermediate.
      action: ACCEPT
      reason: >-
        PhnX cleaves the phosphonoacetaldehyde supplied by PhnW, releasing phosphate in the terminal PhnWX
        reaction. The curated HAMAP assignment and exact family classifiers support this role for Q88KT1.
        PMID:9841125 measures the pathway in P. putida NG2; PMID:9649311 establishes purified phosphonatase
        chemistry in Bacillus and Salmonella. These are independent family/pathway evidence, not direct
        assays of KT2440 PhnX.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "FUNCTION: Involved in phosphonate degradation."
          record_section: ["CC:FUNCTION"]
        - reference_id: PMID:9841125
          supporting_text: "point to the presence of a substrate inducible 2-aminoethylphosphonic acid"
  - term:
      id: GO:0050194
      label: phosphonoacetaldehyde hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Exact core molecular function for the predicted PhnX enzyme.
      action: ACCEPT
      reason: >-
        The curated HAMAP rule MF_01375 assigns phosphonoacetaldehyde hydrolysis to Q88KT1, with concordant
        InterPro IPR006323 and PANTHER PTHR43434:SF19 membership. The purified Bacillus cereus and Salmonella
        enzymes catalyze this reaction (PMID:9649311). Q88KT1 has no retrieved strain-specific activity
        assay, so this is a strong family-based inference.
      supported_by: &id001
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: Reaction=phosphonoacetaldehyde + H2O = acetaldehyde + phosphate + H(+);
        - reference_id: PMID:9649311
          supporting_text: the genes encoding phosphonatase in Bacillus cereus and in Salmonella
            typhimurium were cloned
