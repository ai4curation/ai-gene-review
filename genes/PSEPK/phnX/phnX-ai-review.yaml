core_functions:
  - description: >-
      Magnesium-dependent cleavage of phosphonoacetaldehyde to acetaldehyde and
      inorganic phosphate in the terminal reaction of PhnWX
      2-aminoethylphosphonate degradation.
    molecular_function:
      id: GO:0050194
      label: phosphonoacetaldehyde hydrolase activity
    directly_involved_in:
      - id: GO:0019700
        label: organic phosphonate catabolic process
    supported_by: *phnx_reaction_support
proposed_new_terms: []
suggested_questions:
  - question: Under which phosphate and 2-aminoethylphosphonate conditions is the adjacent phnX-phnW pair induced in KT2440?
suggested_experiments:
  - description: >-
      Purify Q88KT1 and measure magnesium-dependent phosphonoacetaldehyde
      hydrolysis, then test growth and phosphate release in phnX and phnW
      deletion strains supplied with 2-aminoethylphosphonate.
