id: Q88KT1
gene_symbol: phnX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PhnX (PP_2208) is a predicted magnesium-dependent phosphonoacetaldehyde
  hydrolase of the PhnWX 2-aminoethylphosphonate degradation route. It cleaves
  the carbon-phosphorus bond of phosphonoacetaldehyde to produce acetaldehyde
  and inorganic phosphate, acting immediately downstream of the adjacent PhnW
  aminotransferase.
existing_annotations:
  - term:
      id: GO:0000287
      label: magnesium ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Conserved catalytic cofactor property, secondary to the hydrolase activity.
      action: KEEP_AS_NON_CORE
      reason: >-
        The PhnX-specific HAMAP rule predicts one magnesium ion per subunit and
        identifies three coordinating residues, but metal binding is not the
        defining molecular function.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "Note=Binds 1 Mg(2+) ion per subunit."
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Correct but uninformative relative to the exact PhnX activity.
      action: MODIFY
      reason: >-
        Q88KT1 has a substrate- and reaction-specific annotation supported by
        EC 3.11.1.1, RHEA:18905, HAMAP MF_01375, and InterPro IPR006323.
      proposed_replacement_terms:
        - id: GO:0050194
          label: phosphonoacetaldehyde hydrolase activity
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "DR   InterPro; IPR006323; Phosphonoacetald_hydro."
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Plausible location for the soluble PhnWX pathway, but not a core function.
      action: KEEP_AS_NON_CORE
      reason: >-
        The TreeGrafter prediction is compatible with a soluble enzyme lacking
        membrane or secretion features, but Q88KT1 has no direct localization study.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "DR   GO; GO:0005829; C:cytosol; IEA:TreeGrafter."
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Unsupported family-level over-propagation from a different HAD-family role.
      action: REMOVE
      reason: >-
        The exact PhnX family, HAMAP rule, catalytic reaction, and genomic
        pairing with phnW support phosphonate catabolism. No feature of the
        Q88KT1 record supports a DNA-repair role.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "Belongs to the HAD-like hydrolase superfamily. PhnX family."
  - term:
      id: GO:0008967
      label: phosphoglycolate phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Wrong paralog-family activity propagated from the broad PANTHER family.
      action: REMOVE
      reason: >-
        Q88KT1 is assigned the PhnX-specific PANTHER subfamily, HAMAP rule,
        InterPro signature, and phosphonoacetaldehyde reaction. Those exact
        classifiers override the broad phosphoglycolate-phosphatase family label.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "DR   PANTHER; PTHR43434:SF19; PHOSPHONOACETALDEHYDE HYDROLASE; 1."
  - term:
      id: GO:0019700
      label: organic phosphonate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Direct pathway role in hydrolytic cleavage of a phosphonate intermediate.
      action: ACCEPT
      reason: >-
        PhnX cleaves phosphonoacetaldehyde produced by PhnW, releasing phosphate
        in the terminal reaction of the two-step PhnWX route.
      supported_by:
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "FUNCTION: Involved in phosphonate degradation."
  - term:
      id: GO:0050194
      label: phosphonoacetaldehyde hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Exact core molecular function for the predicted PhnX enzyme.
      action: ACCEPT
      reason: >-
        The reviewed UniProt record assigns EC 3.11.1.1 and RHEA:18905 through
        the PhnX-specific HAMAP rule, with concordant InterPro and PANTHER
        subfamily assignments.
      supported_by: &phnx_reaction_support
        - reference_id: file:PSEPK/phnX/phnX-uniprot.txt
          supporting_text: "Reaction=phosphonoacetaldehyde + H2O = acetaldehyde + phosphate + H(+);"
        - reference_id: file:PSEPK/phnX/phnX-deep-research-openscientist.md
          supporting_text: "The gene *phnX* (PP_2208; UniProt **Q88KT1**) of *Pseudomonas putida* KT2440 encodes **phosphonoacetaldehyde hydrolase**, commonly called **\"phosphonatase\"** (EC 3.11.1.1)."
