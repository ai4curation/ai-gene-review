- id: file:PSEPK/pqqA/pqqA-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep-research report for pqqA (Q88QV4 / PP_0380), Pseudomonas putida KT2440
  findings:
  - statement: KT2440 literature identifies pqqA as locus PP_0380 and as the peptide precursor for PQQ biosynthesis, confirming that the target accession and the gene discussed in the literature are the same.
    supporting_text: pqqA is explicitly identified as PP_0380 and as the peptide precursor for PQQ biosynthesis
    reference_section_type: RESULTS
  - statement: PqqA is not an enzyme but a short ribosomally synthesized peptide that is post-translationally modified and processed into the small-molecule cofactor PQQ, which is why its only defensible GO annotation is a biological process rather than a molecular function.
    supporting_text: it is a short ribosomally synthesized precursor peptide that is post-translationally modified and processed to generate the small-molecule redox cofactor pyrroloquinoline quinone (PQQ)
    reference_section_type: INTRODUCTION
  - statement: The conserved glutamate and tyrosine of the PqqA core supply the atoms that are cross-linked and remodelled into the PQQ ring system, so the peptide is the biosynthetic substrate of the pathway.
    supporting_text: It is the **substrate/precursor peptide** from which PQQ is biosynthesized. The conserved **glutamate (E)** and **tyrosine (Y)** in the PqqA “core” provide the atoms that become cross-linked and transformed into the PQQ scaffold.
    reference_section_type: RESULTS
  - statement: Because PqqA is made on the ribosome, its synthesis and the early maturation steps acting on it are cytosolic, even though the mature cofactor is used elsewhere.
    supporting_text: Because PqqA is **ribosomally translated**, it is synthesized in the **cytosol**.
    reference_section_type: DISCUSSION
  - statement: PqqD is the RiPP recognition element that binds PqqA and presents it to PqqE in a ternary complex, so PqqA acts as a recognised peptide substrate rather than a free-standing component.
    supporting_text: PqqD binds PqqA and forms a complex with PqqE to position the PqqA core for chemistry
    reference_section_type: RESULTS
  - statement: The first committed tailoring step is a regioselective radical-SAM C-C coupling by PqqE between the conserved glutamate and tyrosine of PqqA; PqqE, not PqqA, performs the chemistry.
    supporting_text: PqqE catalyzes a **regioselective C–C coupling** between the conserved glutamate and tyrosine in PqqA
    reference_section_type: RESULTS
  - statement: Localization is split between biosynthesis and use - maturation acts on the peptide in the cytosol, whereas mature PQQ serves periplasmic quinoprotein dehydrogenases - so a periplasmic location should not be annotated to PqqA itself.
    supporting_text: Initial maturation occurs on the peptide precursor in the **cytosol**; mature PQQ is then used mainly by **periplasmic quinoproteins** in Gram-negative bacteria.
    reference_section_type: DISCUSSION
  - statement: Barcoded transposon-sequencing fitness data in KT2440 link the PQQ biosynthetic genes to PQQ-dependent dehydrogenase metabolism and name pqqA (PP_0380) as the peptide precursor, while noting that pqqA's own fitness calls are uncertain because small genes receive few insertions.
    supporting_text: The study explicitly identifies **pqqA (PP_0380)** as the peptide precursor for PQQ
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Target identity is verified in the report itself (Q88QV4 / PP_0380 /
      KT2440). The peptide-precursor role, the PqqD/PqqE mechanism and the
      cytosol-versus-periplasm split are consistent across the cited reviews and
      primary work and are used here. The quantitative KT2440 phosphate/PQQ and
      phosphate-solubilization data it reports concern downstream PQQ-dependent
      glucose dehydrogenase physiology, not pqqA's own activity, and are
      deliberately not converted into annotations on this gene.
- id: file:PSEPK/pqqA/pqqA-deep-research-openscientist.md
  title: OpenScientist gene research for pqqA (Q88QV4)
  findings:
  - statement: Read directly off the target's own 23-residue sequence, the diagnostic PqqA core motif is Glu15-x-x-x-Tyr19, identifying Glu15 and Tyr19 as the residues cross-linked to seed PQQ and the preceding segment as the PqqD-bound leader.
    supporting_text: "**Glu15** and **Tyr19** are therefore the specific reactive residues cross-linked (Glu-Cγ → Tyr-Cε) to seed PQQ."
    reference_section_type: RESULTS
  - statement: The report independently confirms that PqqA is a consumable substrate rather than a catalyst in the PQQ pathway.
    supporting_text: PqqA thus functions as a **consumable substrate**, not a catalyst.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The report correctly identifies Q88QV4 as the 23-residue PQQ precursor
      and its Glu15/Tyr19 reactive pair. Its conservation artifact embeds 25
      sequences without source accessions, so the exact conservation
      percentages and leader-boundary inference are not independently
      reproducible. The curated function uses the target UniProt sequence and
      established ortholog biochemistry, not those quantitative claims.
