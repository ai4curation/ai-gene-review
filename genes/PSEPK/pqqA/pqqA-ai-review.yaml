id: Q88QV4
gene_symbol: pqqA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  pqqA (PP_0380) encodes the 23-residue ribosomally synthesized precursor
  peptide for pyrroloquinoline quinone (PQQ) biosynthesis in Pseudomonas putida
  KT2440. PqqA is a pathway substrate rather than an enzyme. Its conserved
  glutamate (Glu15) and tyrosine (Tyr19) provide the atoms used to construct
  PQQ: a PqqD-family chaperone presents the peptide to the radical-SAM enzyme
  PqqE for carbon-carbon cross-linking, after which proteolytic processing and
  PqqB/PqqC-dependent oxidative maturation produce the cofactor. Mature PQQ is
  used principally by periplasmic quinoprotein dehydrogenases.
