- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The single GOA row on this entry was asserted from three concordant sources at once - InterPro:IPR011725 (PQQ_synth_PqqA), UniRule UR000098295 (the HAMAP rule MF_00656) and UniPathway UPA00539 - so although the evidence code is IEA, the assignment rests on a curated family rule rather than on an unvetted association rule.
- id: file:PSEPK/pqqA/pqqA-uniprot.txt
  title: UniProtKB entry for pqqA (Coenzyme PQQ synthesis protein A)
  findings:
  - statement: UniProt states that PqqA is required for PQQ biosynthesis and that PQQ is formed by cross-linking a specific glutamate to a specific tyrosine of the peptide and excising those residues, i.e. the peptide is consumed by the pathway rather than catalysing it.
    record_section: ["CC:FUNCTION"]
    supporting_text: Required for coenzyme pyrroloquinoline quinone (PQQ)
    reference_section_type: RESULTS
  - statement: The entry is placed in the PqqA family, which is also recognised by the curated HAMAP rule MF_00656 and by NCBIfam TIGR02107 and Pfam PF08042 on the same record.
    record_section: ["CC:SIMILARITY"]
    supporting_text: Belongs to the PqqA family
    reference_section_type: RESULTS
  - statement: The entry is assigned to the pyrroloquinoline quinone biosynthesis pathway (UniPathway UPA00539), the same pathway identifier used as a WITH/FROM source for the GOA row.
    record_section: ["CC:PATHWAY"]
    supporting_text: Cofactor biosynthesis; pyrroloquinoline quinone biosynthesis.
    reference_section_type: RESULTS
  - statement: A curated cross-link feature records the pyrroloquinoline quinone (Glu-Tyr) linkage between residues 15 and 19 of the 23-residue chain, naming the two residues of this protein that become the PQQ scaffold.
    record_section: ["FT:CROSSLNK"]
    supporting_text: Pyrroloquinoline quinone (Glu-Tyr)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed (Swiss-Prot) entry; accession, locus tag PP_0380 and the
      23-residue sequence match the target. The FUNCTION and CROSSLNK statements
