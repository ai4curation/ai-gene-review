- question: Which PqqA residues and processing intermediates can be detected directly in P. putida KT2440 during PQQ biosynthesis?
suggested_experiments:
- hypothesis: PqqA supplies the Glu-Tyr precursor required for PQQ production in KT2440.
  description: Delete pqqA and complement with wild-type and Glu/Tyr substitution variants, then quantify cellular or secreted PQQ and activity of PQQ-dependent dehydrogenases.
