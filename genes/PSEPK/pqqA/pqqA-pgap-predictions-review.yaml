predictions:
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0003824
    label: catalytic activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      Wrong. PqqA is the precursor peptide of PQQ: PqqE (with the chaperone
      PqqD) cross-links its conserved Glu and Tyr side chains, and PqqF/G,
      PqqB and PqqC process the excised product. PqqA is acted upon and
      catalyses nothing, and the main review describes it as a pathway
      substrate rather than an enzyme. The root-level term carries no
      information and is false here. It comes from the TIGR02107 model's GO
      list, which contradicts the model's own product name ("precursor
      peptide"), so the mistake is on the HMM and propagates to every genome.
    supported_by:
    - reference_id: PMID:26961875
      supporting_text: "The radical S -adenosylmethionine (SAM) protein PqqE is predicted to function in the pyrroloquinoline quinone (PQQ) biosynthetic pathway via catalysis of carbon-carbon bond formation between a glutamate and tyrosine side chain within the small peptide substrate PqqA."
    - reference_id: PMID:30811189
      supporting_text: "The first step is a C-C crosslinking reaction between the conserved Glu and Tyr residues within the peptide substrate PqqA"
    - reference_id: file:PSEPK/pqqA/pqqA-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: "product_name: pyrroloquinoline quinone precursor peptide PqqA"
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
