    summary: >-
      Correct and already in GOA (UniRule IEA), accepted by the main review as
      PqqA's core role. PqqA supplies the Glu and Tyr atoms that become PQQ,
      the scaffold case in which a substrate does part of the work of the
      process.
    supported_by:
