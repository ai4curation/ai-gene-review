id: Q88QV4
gene_symbol: pqqA
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
locus_tag: PP_0380
description: >-
  NCBI PGAP names WP_003243383.1 "pyrroloquinoline quinone precursor peptide
  PqqA" from the TIGR02107 equivalog HMM and passes on two GO terms; no EC
  number is predicted. The name and the process term, pyrroloquinoline quinone
  biosynthetic process, are correct and match the main review. The function
  term, catalytic activity (GO:0003824), is wrong: PqqA is a 23-residue
  ribosomally made peptide whose conserved glutamate and tyrosine are
  cross-linked by the radical SAM enzyme PqqE and then excised to become PQQ.
  It is the pathway's substrate, not one of its enzymes. The model's own product
  name calls the protein a precursor peptide, so the error lies in the GO
  mapping of TIGR02107 itself and reaches every genome whose PqqA it names; the
  domain model NF019654 for the same family carries only the process term.
