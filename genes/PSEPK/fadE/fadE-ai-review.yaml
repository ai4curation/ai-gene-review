  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: fadE encodes an FAD-dependent acyl-CoA dehydrogenase that oxidizes medium- and long-chain fatty acyl-CoA substrates to trans-2-enoyl-CoA while reducing electron-transfer flavoprotein, initiating each turn of the fatty acid beta-oxidation spiral.
