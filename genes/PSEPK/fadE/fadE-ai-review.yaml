      On-target provider report; useful for the medium/long-chain FadE
      synthesis and direct-assay caveat, while the chain-length window and
      membrane-association claims remain inferred for PP_1893.
core_functions:
- description: >-
    FadE oxidizes long-chain fatty acyl-CoA to the corresponding trans-2-enoyl-CoA
    while reducing electron-transfer flavoprotein. The chain-length assignment rests
    on FadE-clade family membership (FadE_C / ACDH_C C-terminal extension); no
    enzyme-level study of PP_1893 itself has measured its chain-length optimum
    directly, so the precise substrate window remains inferred rather than measured.
  molecular_function:
