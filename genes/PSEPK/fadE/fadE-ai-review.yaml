suggested_questions:
- question: Is FadE membrane-associated in KT2440, and what is the physiological chain-length range of its substrates?
  experts:
  - Pseudomonas fatty acid metabolism experts
suggested_experiments:
- description: Measure growth and intracellular acyl-CoA profiles for a fadE deletion and complemented strain across defined medium- and long-chain fatty acids, coupled with membrane fractionation of tagged FadE.
  experiment_type: targeted genetics, lipid metabolomics, and subcellular fractionation
