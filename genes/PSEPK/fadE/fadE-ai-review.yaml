    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: FadE initiates each turn of the fatty acid beta-oxidation spiral.
    action: ACCEPT
    reason: >-
      Family-level support only; the UniProt PATHWAY line is an ARBA prediction and is
      not cited. Membership in the acyl-CoA dehydrogenase family and the FadE clade
