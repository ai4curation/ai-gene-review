proposed_new_terms:
- proposed_name: acyl-CoA dehydrogenase activity (acceptor unspecified)
  proposed_definition: Catalysis of the oxidation of a 2,3-saturated acyl-CoA to the corresponding trans-(2E)-enoyl-CoA,
    with transfer of reducing equivalents to an electron acceptor whose molecular identity is not specified.
  justification: Current GO acyl-CoA dehydrogenase terms explicitly specify ETF. Bacterial FadE chemistry
    can be supported while the physiological electron-transfer partner remains unresolved; the broader
    reaction does not assert that ETF is impossible.
  proposed_parent:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  supported_by:
  - *id001
  - *id002
suggested_questions:
- question: Is FadE membrane-associated in KT2440, and what is the physiological chain-length range of
    its substrates?
  experts:
  - Pseudomonas fatty acid metabolism experts
- question: Which physiological electron-transfer partner reoxidizes PP_1893, and in which conditions
    does it contribute beyond the PP_0368/PP_0370 routes?
suggested_experiments:
- description: Measure growth and intracellular acyl-CoA profiles for a fadE deletion and complemented
    strain across defined medium- and long-chain fatty acids, coupled with membrane fractionation of tagged
    FadE.
  experiment_type: targeted genetics, lipid metabolomics, and subcellular fractionation
