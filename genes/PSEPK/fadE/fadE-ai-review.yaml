id: Q88LN6
gene_symbol: fadE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  fadE (PP_1893) encodes an FAD-dependent acyl-CoA dehydrogenase of the bacterial FadE clade, orthologous
  to Escherichia coli FadE. It oxidizes medium- and long-chain fatty acyl-CoA substrates to trans-2-enoyl-CoA
  while reducing electron-transfer flavoprotein, the first reaction of each turn of the fatty acid beta-oxidation
  spiral. The assignment rests on subfamily membership and the FadE-specific C-terminal extension; PP_1893
  itself has not been characterized biochemically.
existing_annotations:
- term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: FadE is an acyl-CoA dehydrogenase of the bacterial FadE clade.
    action: ACCEPT
    reason: >-
      PP_1893 is in the same PANTHER subfamily (PTHR48083:SF18) and carries the same FadE_C/ACDH_C C-terminal
      extension as E. coli FadE (Q47146), the experimentally characterized fad-regulon acyl-CoA dehydrogenase.
      The UniProt reaction, EC and pathway lines on this unreviewed entry are ARBA predictions and are
      not cited. The general acyl-CoA dehydrogenase term is kept beside the chain-length-specific terms
      because it names the reaction class and is the module's term for this step.
    supported_by:
