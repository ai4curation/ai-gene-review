id: Q88LN6
gene_symbol: fadE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: fadE encodes an FAD-dependent acyl-CoA dehydrogenase that oxidizes medium- and long-chain fatty acyl-CoA substrates to trans-2-enoyl-CoA while reducing electron-transfer flavoprotein, initiating each turn of the fatty acid beta-oxidation spiral.
existing_annotations:
- term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: FadE is an acyl-CoA dehydrogenase, but this term is less informative than the supported medium- and long-chain activities.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain the chain-length-specific molecular functions as the core annotations.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the acyl-CoA dehydrogenase family.
- term:
    id: GO:0004466
    label: long-chain fatty acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: FadE catalyzes electron-transfer-flavoprotein-dependent dehydrogenation of long-chain fatty acyl-CoA.
    action: ACCEPT
    reason: >-
      Family-level support only. The UniProt reaction and EC lines for this entry are
      ARBA predictions and are not cited. PP_1893 carries the full acyl-CoA dehydrogenase
      domain set plus the bacterial-type C-terminal extension that defines the FadE clade
      (InterPro FadE_C, Pfam ACDH_C), the clade of the E. coli FadE ETF-dependent
      medium/long-chain acyl-CoA dehydrogenase. Membership supports the activity; the
      chain-length window of PP_1893 itself has not been measured.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR015396; FadE_C.
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF09317; ACDH_C; 1.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is inferred phylogenetically, while the sequence also has a predicted N-terminal transmembrane segment.
    action: UNDECIDED
    reason: No direct localization evidence is available, and the membrane-associated topology prediction makes an unqualified cytoplasm annotation uncertain.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: TRANSMEM        43..64
- term:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad oxidoreductase parent is consistent with the reaction but does not identify the acyl-CoA substrate or ETF acceptor.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain the specific fatty acyl-CoA dehydrogenase activities.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the acyl-CoA dehydrogenase family.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: FadE performs the acyl-CoA dehydrogenase step of fatty acid beta-oxidation.
    action: ACCEPT
    reason: >-
      Family-level support only; the UniProt PATHWAY line is an ARBA prediction and is
      not cited. The InterPro acyl-CoA dehydrogenase family match and the FadE-clade
      C-terminal domain place PP_1893 with the bacterial acyl-CoA dehydrogenases that
      catalyse the first, dehydrogenation step of each beta-oxidation turn, which is
      what this term describes. No pathway genetics on PP_1893 itself is cached.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR050741; Acyl-CoA_dehydrogenase.
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR015396; FadE_C.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: FAD is the annotated cofactor for the acyl-CoA dehydrogenase reaction.
    action: KEEP_AS_NON_CORE
    reason: Cofactor binding supports catalysis but is not the primary molecular function.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=FAD; Xref=ChEBI:CHEBI:57692;
- term:
    id: GO:0070991
    label: medium-chain fatty acyl-CoA dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: FadE catalyzes electron-transfer-flavoprotein-dependent dehydrogenation of medium-chain fatty acyl-CoA.
    action: ACCEPT
    reason: >-
      Family-level support only. The UniProt reaction and EC lines for this entry are
      ARBA predictions and are not cited. PP_1893 belongs to the FadE clade of bacterial
      acyl-CoA dehydrogenases (InterPro FadE_C, Pfam ACDH_C C-terminal extension), whose
      characterized member, E. coli FadE, acts on medium- as well as long-chain acyl-CoA.
      Membership supports the activity; the chain-length window of PP_1893 itself has not
      been measured.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR015396; FadE_C.
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF09317; ACDH_C; 1.
