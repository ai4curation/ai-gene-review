  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The FadE-type oxidation is inferred, but this GO reaction also requires an unverified ETF
      acceptor.
    action: UNDECIDED
    reason: Current QuickGO definitions of GO:0003995, GO:0004466 and GO:0070991 explicitly include oxidized/reduced
      electron-transfer flavoprotein. FadE-clade membership and the FadE_C architecture support acyl-CoA
      dehydrogenation, but neither the E. coli genetic work nor the 2025 P. aeruginosa assays establishes
      native ETF coupling for KT2440 PP_1893. The precise KT2440 substrate range is also unmeasured; E.
      coli growth phenotypes and P. aeruginosa paralog preferences cannot be relabeled as PP_1893 kinetics.
      Keep the original annotation unresolved, not disproven. The core records the supported acceptor-unspecified
      reaction.
