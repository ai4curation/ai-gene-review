id: Q88LN6
gene_symbol: fadE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FadE (PP_1893) of Pseudomonas putida KT2440 is a predicted FAD-dependent acyl-CoA dehydrogenase
  with the extended bacterial FadE architecture. It is inferred to oxidize a saturated acyl-CoA to trans-2-enoyl-CoA
  in fatty-acid beta-oxidation. Its physiological electron acceptor, substrate-chain-length range and
  membrane association have not been established. Other KT2440 dehydrogenase paralogs have stronger native
  fitness evidence under the tested fatty-acid conditions.
