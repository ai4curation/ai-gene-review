- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: TreeGrafter cytoplasm from PTN002466402.
    action: ACCEPT
    reason: >-
      PP_1893 has a Phobius-predicted helix at residues 43-64, which is valid computational evidence for
      membrane association. Two observations outweigh it for this term: the experimentally characterized
      E. coli orthologue FadE (same subfamily SF18) has the same hydrophobic N-terminal stretch but no
      curated transmembrane segment, and E. coli acyl-CoA dehydrogenase activity is recovered in the soluble
      fraction. Even on the membrane-tethered topology argued in the OpenScientist report, the catalytic
      domains face the cytoplasm, so the activity takes place there. Cytoplasm is accepted; membrane association
      is left as an open question.
    supported_by:
    - reference_id: file:PSEPK/fadE/fadE-uniprot.txt
      record_section:
      - FT:TRANSMEM
      supporting_text: TRANSMEM        43..64
    - reference_id: PMID:334745
      supporting_text: >-
        acyl-CoA dehydrogenase, 3-hydroxyacyl-CoA dehydrogenase, enoyl-CoA hydratase, and 3-ketoacyl-CoA
        thiolase activities that utilized both C4 and C16 acyl-CoA substrates were isolated from the soluble
        fraction.
    - reference_id: file:ECOLI/fadE/fadE-uniprot.txt
      record_section:
      - DR:PANTHER
      supporting_text: PANTHER; PTHR48083:SF18; ACYL-COENZYME A DEHYDROGENASE; 1.
    - reference_id: file:PSEPK/fadE/fadE-deep-research-openscientist.md
      supporting_text: >-
        It works in the cytoplasm while tethered to the cytoplasmic (inner) membrane through an N-terminal
        transmembrane helix, and it operates within the fatty-acid degradation (β-oxidation) pathway together
        with FadD (acyl-CoA synthetase), FadB (multifunctional hydratase/dehydrogenase) and FadA (thiolase).
