- term:
    id: GO:0051289
    label: protein homotetramerization
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    action: REMOVE
    summary: The homotetramer claim is contradicted by the traced donor measurement and target homodimer
      prediction.
    reason: The ISS donor is Alcaligenes faecalis MaiA O24766. PMID:9345272 measures an approximately
      60 kDa dimer of 28 kDa subunits, and the target UniProt record independently carries a HAMAP-derived
      homodimer statement. Thus the available evidence supporting this homology transfer points to a dimer,
      not a tetramer. Removing the specific tetramer assertion does not claim that every possible target
      assembly state has been experimentally excluded. No replacement assembly-process annotation is manufactured
      from a stoichiometry inference; target solution-state measurement remains useful.
    supported_by:
    - reference_id: PMID:9345272
      supporting_text: 'The

        molecular weight of maleate isomerase was estimated as 60 kDa, consisting of a

        28 kDa dimer'
    - reference_id: file:PSEPK/maiA/maiA-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: 'SUBUNIT: Homodimer.'
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:O24766
        source_label: Alcaligenes faecalis MaiA
        source_status: SOURCE_BAD
        comment: 'The transferred tetramer assertion is unsupported by the traced donor evidence: PMID:9345272
          reports a dimer, as does the curated donor account. This concerns the oligomerization assertion,
          not the sound donor maleate-isomerase assay.'
- term:
    id: GO:1901848
    label: nicotinate catabolic process
  evidence_type: IC
  original_reference_id: PMID:18678916
  qualifier: involved_in
  review:
    action: NEW
    summary: MaiA catalyzes the assigned terminal reaction of the native KT2440 nicotinate pathway.
    reason: 'The existing proposal is retained because the product itself performs maleate-to-fumarate
      chemistry in the characterized nic cluster, rather than being a substrate or merely a required factor.
      The primary assigns this role by enzyme-family similarity and pathway reconstruction, so the IC
      evidence is not upgraded to a direct target assay. The proposal is not based on neighboring enzymes
      carrying the term. Comparator maleate isomerases from other feeding pathways do not automatically
      receive nicotinate catabolism: S16 Iso has the same reaction but its strain failed nicotinate degradation
      in the tested conditions. No redundant process parent or descendant is added.'
    supported_by:
    - reference_id: file:PSEPK/maiA/maiA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'Catalyzes cis-trans isomerization of the C2-C3 double bond in

