taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: MaiA, also called NicE, is a maleate cis-trans isomerase of the aerobic nicotinate catabolic
  cluster in Pseudomonas putida KT2440. It converts maleate generated by NicF into fumarate, connecting
  the lower maleamate pathway with central carbon metabolism. Its reaction assignment is supported by
  maleate-isomerase family membership and pathway context; the original KT2440 study assigned this final
  enzyme by sequence comparison.
