  label: Pseudomonas putida KT2440
description: FleQ is a c-di-GMP-binding transcriptional regulator in Pseudomonas putida KT2440 that coordinates
  flagellar gene expression with biofilm-associated surface functions. Its sigma-54-interaction/AAA+ architecture
  supports the flagellar transcription cascade, while promoter-specific activation and repression control
  adhesin production, export and other targets. Directly supported targets include lapA, bcs, lapE and
  cyaA; with FleN, FleQ also represses the K1 type VI secretion structural operon. Regulatory sign depends
  on the target and c-di-GMP conditions.
