proposed_new_terms:
- proposed_name: sigma-54-dependent DNA-binding transcription activator activity
  proposed_definition: Activation of transcription by a bacterial enhancer-binding protein
    that binds specific DNA sequences and uses ATP-dependent remodeling to activate RNA polymerase containing
    sigma-54 at target promoters.
  justification: FleQ and related enhancer-binding proteins are currently forced into generic DNA-binding
    transcription activator activity and ATP binding terms, which do not capture the sigma-54-specific
    promoter class or ATP-dependent remodeling mechanism.
  proposed_parent:
    id: GO:0001216
    label: DNA-binding transcription activator activity
suggested_questions:
- question: Which binding-site mutations separate FleQ activation from repression at individual KT2440
    promoters, and how does FleN alter each response?
- question: Which additional ChIP candidate regions have a demonstrated functional response, beyond the
    target subset supported by binding and promoter assays?
suggested_experiments:
- description: ChIP-seq across low- and high-c-di-GMP states with matched RNA-seq in KT2440 to separate
    constitutive FleQ binding from c-di-GMP-dependent transcriptional output
  experiment_type: Differential ChIP-seq plus transcriptomics
  hypothesis: FleQ occupancy will remain at many promoters while c-di-GMP changes the transcriptional
    outcome and cofactor usage rather than simple DNA binding
- description: Promoter mutagenesis and in vitro transcription assays for fleS-fliF, flhA, lapA, bcs,
    and lapE promoters using purified FleQ with ATP, c-di-GMP, and FleN
  experiment_type: Promoter mutagenesis, EMSA, and in vitro transcription
  hypothesis: Distinct promoter architectures encode the activator-versus-repressor logic of FleQ and
    explain the opposite responses of lapA and bcs
- description: Separation-of-function FleQ mutants targeting ATPase versus c-di-GMP-binding surfaces tested
    for motility, attachment, biofilm, and root colonization phenotypes
  experiment_type: Allelic replacement with phenotypic profiling
  hypothesis: ATPase-deficient alleles will preferentially collapse the flagellar branch, whereas c-di-GMP-response
    mutants will uncouple motility from biofilm regulation
status: COMPLETE
