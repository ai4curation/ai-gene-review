- id: fleq-k1-structural
  target:
    name: K1-T6SS structural-operon promoter
    type: promoter
  regulatory_level: transcription
  effect: represses
  directness: direct
  experimental_strain: P. putida KT2440; FleQ-FleN complex
  condition: High c-di-GMP produced by Wsp signaling promotes FleQ-FleN promoter binding and transcriptional
    repression.
  evidence:
  - reference_id: PMID:35178858
    assay: KT2440 K1-T6SS transcription assays under Wsp/c-di-GMP and FleQ/FleN perturbation.
    supporting_text: Transcriptional regulator FleQ and ATPase FleN functioned as repressors in the Wsp
      system-modulated K1-T6SS transcription.
    source_url: https://pubmed.ncbi.nlm.nih.gov/35178858/
  - reference_id: PMID:35178858
    assay: In vitro binding of the FleQ-FleN complex to the K1-T6SS structural promoter.
    supporting_text: FleQ-FleN complex bound directly to the promoter of K1-T6SS structural operon in
      vitro, and c-di-GMP promoted the binding.
    source_url: https://pubmed.ncbi.nlm.nih.gov/35178858/
  interpretation: The direct binding assay applies to the structural promoter. Repression of vgrG1 expression
    is not expanded here into an independently proven direct contact.
  limitations:
  - Both FleQ and FleN participate; this is not evidence for FleQ acting alone.
  - Local primary cache is abstract-only; binding-site mutagenesis and exact promoter coordinates were
    not inspected.
  - PMID:36748579 describes low-c-di-GMP binding in its discussion, conflicting with this primary high-c-di-GMP
    result; the primary result is retained.
pathway_context:
- name: Adhesin production, export and biofilm matrix control
  relationship: regulates
  mechanism: Promoter-specific regulation of lapA, lapE and bcs controls matrix and adhesion outputs;
    FleQ does not synthesize or export the matrix itself.
