- id: fleq-lapE
  target:
    name: lapE promoter
    type: promoter
    locus: PP_4519
  regulatory_level: transcription
  effect: activates
  directness: direct
  experimental_strain: P. putida KT2440 expression perturbations; purified-protein binding and a heterologous
    bacterial one-hybrid reporter assay.
  condition: Wild-type and increased c-di-GMP via multicopy wspR, with target-promoter reporters.
  evidence:
  - reference_id: PMID:33975969
    assay: KT2440 transcriptomics and promoter reporters under altered FleQ/c-di-GMP conditions; WspR
      overexpression increases c-di-GMP.
    supporting_text: FleQ and c-di-GMP coordinately inhibit transcription of PP_0788 and cyaA and promote
      transcription of PP_0681, lapE, and PP_5586
    source_url: https://pubmed.ncbi.nlm.nih.gov/33975969/
  - reference_id: PMID:33975969
    assay: In vitro EMSA and pTRG/pBXcmT bacterial one-hybrid reporter assay; the latter is not native
      KT2440 occupancy profiling.
    supporting_text: Both in vitro and in vivo assays show that FleQ binds directly to promoters of the
      five genes.
    source_url: https://pubmed.ncbi.nlm.nih.gov/33975969/
  interpretation: Concordant target binding and promoter regulation establish a functional direct edge.
  limitations:
  - This supports the named target under tested c-di-GMP conditions, not all FleQ occupancy peaks.
  - Directness is binding plus expression evidence; it does not imply every molecular contact was resolved.
  - The in vivo binding assay is heterologous bacterial one-hybrid; its exact reporter-host strain is
    not assigned from the plasmid-propagation strain.
