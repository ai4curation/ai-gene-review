relationships:
- id: fleq-lapA
  target:
    name: lapA promoter
    type: promoter
    locus: PP_0168
  regulatory_level: transcription
  effect: activates
  directness: direct
  experimental_strain: P. putida KT2440
  condition: Target-specific regulation under baseline and manipulated c-di-GMP levels; do not extrapolate
    one sign across all conditions.
  evidence:
  - reference_id: PMID:27120564
    assay: KT2440 target-promoter expression and in vitro DNA-binding experiments reported in the cached
      abstract.
    supporting_text: FleQ acts as an activator of lapA, but a repressor of bcs
    source_url: https://pubmed.ncbi.nlm.nih.gov/27120564/
  - reference_id: PMID:27120564
    assay: Purified-protein promoter-binding experiments.
    supporting_text: FleQ binds to lapA and bcs promoter DNA
    source_url: https://pubmed.ncbi.nlm.nih.gov/27120564/
  interpretation: Promoter binding and functional expression effects support a direct regulatory relationship.
  limitations:
  - Abstract-only local cache; exact site architecture and condition-specific magnitudes were not extracted.
  - A promoter/operon result is not expanded into separate contacts for each downstream gene.
