id: Q88PI6
gene_symbol: speC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  SpeC (PP_0864) is the candidate cytoplasmic, pyridoxal-5'-phosphate-dependent
  ornithine decarboxylase that converts L-ornithine directly to putrescine and
  carbon dioxide. It provides a one-reaction alternative to the SpeA-SpeB
  arginine/agmatine route.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: SpeC is catalytic, but this root term does not identify its reaction.
    action: TOO_GENERAL
    reason: >-
      The claim is true but uninformative: GO:0004586 ornithine decarboxylase
      activity, accepted elsewhere in this review, is a descendant of
      catalytic activity and names the specific reaction.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002433; Orn_de-COase.'
- term:
    id: GO:0004586
    label: ornithine decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SpeC converts L-ornithine directly to putrescine and carbon dioxide.
    action: ACCEPT
    reason: >-
      Q88PI6 matches the ornithine-decarboxylase-specific InterPro entry
      IPR002433, the PRINTS ornithine decarboxylase fingerprint, the CDD
      PLPDE_III_ODC model and the ODC1-related PANTHER subfamily PTHR11482:SF6,
      whose characterized members (e.g. yeast SPE1) are ornithine
      decarboxylases. Same-genus genetics establishes SpeC as the ornithine
      decarboxylase of an alternative putrescine-synthesis route. The UniProt
      EC and reaction lines rest only on ARBA rules and are not cited; Q88PI6
      itself remains unassayed.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002433; Orn_de-COase.'
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:PRINTS"]
      supporting_text: 'DR   PRINTS; PR01182; ORNDCRBXLASE.'
    - reference_id: PMID:12634339
      supporting_text: >-
        Putrescine can be synthesized either directly from ornithine by
        ornithine decarboxylase (ODC; the speC product) or indirectly from
        arginine via arginine decarboxylase (ADC; the speA product).
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is plausible for this soluble metabolic enzyme.
    action: ACCEPT
    reason: >-
      The fetched UniProt record has no SIGNAL, TRANSMEM or Phobius/SignalP
      (SAM) features and no CC SUBCELLULAR LOCATION comment, and SpeC belongs
      to the soluble PLP-dependent ornithine decarboxylase family (InterPro
      Orn_de-COase, CDD PLPDE_III_ODC). The location therefore rests on absent
      export/membrane signals plus family membership; it remains a
      computational location assignment, not a localization assay.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002433; Orn_de-COase.'
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: 'DR   CDD; cd00622; PLPDE_III_ODC; 1.'
- term:
    id: GO:0006596
    label: polyamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: SpeC directly forms putrescine, a polyamine and polyamine precursor.
    action: KEEP_AS_NON_CORE
    reason: >-
      Accurate pathway-level context: putrescine is itself a polyamine and the
      precursor of spermidine, so SpeC participates in cellular polyamine
      synthesis. Retained as non-core pathway context beside the step-level
      GO:0009446 putrescine biosynthetic process, which is the core process.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002433; Orn_de-COase.'
    - reference_id: PMID:28862813
      supporting_text: >-
        Polyamine production was reduced in the speC mutant, and was eliminated
        in the speAspeC mutant.
- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This broad lyase parent is chemically correct but uninformative.
    action: TOO_GENERAL
    reason: >-
      The claim is true but uninformative: GO:0004586 ornithine decarboxylase
      activity, accepted elsewhere in this review, is a descendant of
      carboxy-lyase activity and specifies both the ornithine substrate and the
      decarboxylase reaction.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR000183; Orn/DAP/Arg_de-COase.'
- term:
    id: GO:0009446
    label: putrescine biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/speC/speC-uniprot.txt
  qualifier: involved_in
  review:
    summary: SpeC performs the terminal ornithine-to-putrescine reaction of this route.
    action: NEW
    reason: >-
      The exact Q88PI6 enzyme reaction directly forms putrescine from ornithine.
      This row originally proposed the route-specific GO:0033387 (putrescine
      biosynthetic process from arginine, via ornithine), which is obsolete in
      the GO release 2026-07-26 with replaced_by GO:0009446; the ornithine route
      is now expressed by the ornithine decarboxylase MF rather than a variant BP
      term. Ornithine supply itself is outside this module. Support is family
      membership (InterPro ornithine decarboxylase entry, PANTHER ODC1-related
      subfamily) plus same-genus genetics: in P. aeruginosa the speC product is
      the ornithine decarboxylase of the direct ornithine-to-putrescine route,
      and in P. chlororaphis a speC mutant has reduced polyamine production.
      Those are ortholog studies, not KT2440 evidence, and the UniProt reaction
      line is an ARBA assignment that is not used here.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002433; Orn_de-COase.'
    - reference_id: PMID:12634339
      supporting_text: >-
        Putrescine can be synthesized either directly from ornithine by
        ornithine decarboxylase (ODC; the speC product) or indirectly from
        arginine via arginine decarboxylase (ADC; the speA product).
    - reference_id: PMID:28862813
      supporting_text: >-
        Polyamine production was reduced in the speC mutant, and was eliminated
        in the speAspeC mutant.
