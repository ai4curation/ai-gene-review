  knowledge_gaps:
  - gap_statement: Q88PI6 has not been biochemically or genetically tested in KT2440.
    significance: >-
      Its reaction and route are strong homology inferences, while native flux
      and redundancy with SpeA-SpeB remain unmeasured.
suggested_questions:
- question: Is SpeC constitutive in KT2440, and when does its route dominate over SpeA-SpeB?
suggested_experiments:
- description: >-
    Measure ornithine decarboxylase activity and putrescine pools in wild type,
    speC, speA, and speA speC strains across nitrogen and osmotic conditions.
