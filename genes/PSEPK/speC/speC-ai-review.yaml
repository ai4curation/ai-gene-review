id: Q88PI6
gene_symbol: speC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  SpeC (PP_0864) is the candidate cytoplasmic, pyridoxal-5'-phosphate-dependent
  ornithine decarboxylase that converts L-ornithine directly to putrescine and
  carbon dioxide. It provides a one-reaction alternative to the SpeA-SpeB
  arginine/agmatine route.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: SpeC is catalytic, but this root term does not identify its reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0004586 captures the specific ornithine decarboxylase reaction and is
      already present in the same annotation set.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'Reaction=L-ornithine + H(+) = putrescine + CO2'
- term:
    id: GO:0004586
    label: ornithine decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SpeC converts L-ornithine directly to putrescine and carbon dioxide.
    action: ACCEPT
    reason: >-
      Q88PI6 carries EC 4.1.1.17/RHEA:22964, the exact reaction, the
      ornithine-decarboxylase InterPro family, and a specific PANTHER
      subfamily. Same-genus genetics establishes SpeC as an alternative
      putrescine-synthesis route, though Q88PI6 itself remains unassayed.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'Reaction=L-ornithine + H(+) = putrescine + CO2'
    - reference_id: PMID:12634339
      supporting_text: >-
        Putrescine can be synthesized either directly from ornithine by
        ornithine decarboxylase (ODC; the speC product) or indirectly from
        arginine via arginine decarboxylase (ADC; the speA product).
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is plausible for this soluble metabolic enzyme.
    action: ACCEPT
    reason: >-
      The TreeGrafter annotation places the PANTHER ortholog in cytoplasm, and
      the exact sequence has no signal peptide or transmembrane topology in the
      fetched record. This remains a computational location assignment.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'DR   GO; GO:0005737; C:cytoplasm; IEA:TreeGrafter.'
- term:
    id: GO:0006596
    label: polyamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: SpeC directly forms putrescine, a polyamine and polyamine precursor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The exact reaction produces putrescine and Pseudomonas genetics supports
      cellular polyamine production, but GO:0033387 captures the route more
      specifically and is retained as the core biological process.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'Reaction=L-ornithine + H(+) = putrescine + CO2'
    - reference_id: PMID:28862813
      supporting_text: >-
        Polyamine production was reduced in the speC mutant, and was eliminated
        in the speAspeC mutant.
- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: This broad lyase parent is chemically correct but uninformative.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0004586 specifies both the ornithine substrate and the decarboxylase
      reaction and is already present.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'EC=4.1.1.17'
- term:
    id: GO:0033387
    label: putrescine biosynthetic process from arginine, via ornithine
  evidence_type: IC
  original_reference_id: file:PSEPK/speC/speC-uniprot.txt
  qualifier: involved_in
  review:
    summary: SpeC performs the terminal ornithine-to-putrescine reaction of this route.
    action: NEW
    reason: >-
      The current Q88PI6 record already associates this route-specific process
      with SpeC, and the exact enzyme reaction directly forms putrescine from
      ornithine. GO names the bacterial ornithine route from its upstream
      arginine precursor; ornithine supply itself is outside this module.
    supported_by:
    - reference_id: file:PSEPK/speC/speC-uniprot.txt
      supporting_text: 'DR   GO; GO:0033387; P:putrescine biosynthetic process from arginine, via ornithine'
