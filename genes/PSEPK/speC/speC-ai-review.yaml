  findings:
  - statement: Q88PI6 is assigned the EC 4.1.1.17 ornithine decarboxylase reaction.
    supporting_text: 'Reaction=L-ornithine + H(+) = putrescine + CO2'
    reference_section_type: RESULTS
  - statement: Q88PI6 maps to an ornithine-decarboxylase-specific PANTHER subfamily.
    supporting_text: 'PTHR11482:SF6; ORNITHINE DECARBOXYLASE 1-RELATED'
    reference_section_type: RESULTS
  - statement: The target record places the reaction in the one-step ornithine pathway.
    supporting_text: 'putrescine from L-ornithine: step 1/1.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Accession, reaction, cofactor, family, pathway, and GO associations were
      checked directly. The entry is unreviewed and PE 3 with no target assay.
- id: PMID:12634339
  title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase of the arginine decarboxylase pathway.
  full_text_unavailable: true
  findings:
  - statement: Pseudomonas aeruginosa SpeC provides a direct ornithine route to putrescine.
    supporting_text: >-
      Putrescine can be synthesized either directly from ornithine by ornithine
      decarboxylase (ODC; the speC product) or indirectly from arginine via
      arginine decarboxylase (ADC; the speA product).
    reference_section_type: ABSTRACT
  - statement: Loss of both SpeA and SpeC caused putrescine auxotrophy in the tested strain.
    supporting_text: A mutant defective in both speA and speC was a putrescine auxotroph.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked. This is direct same-genus
      pathway evidence, not a direct assay of Q88PI6.
- id: PMID:28862813
  title: Polyamine is a critical determinant of Pseudomonas chlororaphis O6 for GacS-dependent bacterial cell growth and biocontrol capacity.
  full_text_unavailable: true
  findings:
  - statement: A related pseudomonad showed reduced polyamine production after speC disruption.
    supporting_text: >-
      Polyamine production was reduced in the speC mutant, and was eliminated
      in the speAspeC mutant.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract were checked; this supports the route in a
      related pseudomonad rather than directly in KT2440.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_putrescine_biosynthesis__ppu00330-deep-research-openscientist.md
  title: OpenScientist PSEPK putrescine-biosynthesis module and pathway review
  findings:
