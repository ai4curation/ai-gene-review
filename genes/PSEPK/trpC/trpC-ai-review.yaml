- term:
    id: GO:0004640
    label: phosphoribosylanthranilate isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      This TreeGrafter row (PANTHER:PTN002338157, family PTHR22854) transfers
      the PRAI activity of bifunctional TrpC-TrpF proteins onto a monofunctional
      IGPS.
    action: REMOVE
    reason: >-
      The protein is 277 residues and carries only an IGPS domain, with no PRAI
      (Pfam PF00697) or TrpF family signature. KT2440 has a separate trpF
      (PP_1995), and knocking it out makes the strain a tryptophan auxotroph,
      so TrpC cannot supply the PRAI step. PTHR22854 groups standalone IGPS
      enzymes with TrpC-TrpF fusions, and the PRAI term belongs only to the
      fusion members. This is an over-propagated electronic inference argued
      against on domain and genetic grounds.
    supported_by:
    - reference_id: file:PSEPK/trpC/trpC-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00218; IGPS; 1."
    - reference_id: PMID:21261884
      supporting_text: >-
        As expected, the trpF‐deficient clones were found to be auxotrophs for
        tryptophan, although very small colonies were detected on plates without
        tryptophan supplementation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      record: PANTHER:PTN002338157
      slot: TreeGrafter GO annotation
      requested_change: DELETE_ROW
      asserted_value: GO:0004640
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        TreeGrafter assigns phosphoribosylanthranilate isomerase activity to
        the monofunctional IGPS Q88QR6, which has no PRAI domain. The term fits
        only the TrpC-TrpF fusion members of PTHR22854 and should not reach
        standalone IGPS proteins such as this one, whose organism has a
        separate, essential TrpF.
