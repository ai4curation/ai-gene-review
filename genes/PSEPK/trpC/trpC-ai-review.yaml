  label: Pseudomonas putida KT2440
description: >-
  trpC (PP_0422) encodes indole-3-glycerol-phosphate synthase (IGPS, EC
  4.1.1.48), the enzyme of the fourth step of L-tryptophan biosynthesis. It
  converts 1-(2-carboxyphenylamino)-1-deoxy-D-ribulose 5-phosphate (CdRP) into
  (1S,2R)-1-C-(indol-3-yl)glycerol 3-phosphate in an irreversible
  decarboxylative ring closure that releases CO2 and water. The 277-residue
  protein is a single (beta/alpha)8-barrel IGPS domain. Unlike the bifunctional
  TrpC-TrpF proteins of enteric bacteria, it has no fused phosphoribosylanthranilate
  isomerase domain; that step is catalysed by the separate TrpF (PP_1995). In
  Pseudomonas putida KT2440, trpC is the last gene of the co-transcribed trpGDC
  operon, and a transposon insertion in it gives a tryptophan auxotroph.
