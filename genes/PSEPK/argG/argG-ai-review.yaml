id: P59604
gene_symbol: argG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ArgG (PP_1088) is argininosuccinate synthase (EC 6.3.4.5), a predicted homotetrameric cytoplasmic
  enzyme that catalyzes the penultimate reaction of L-arginine biosynthesis. Using ATP, it condenses L-citrulline
  with L-aspartate to form argininosuccinate, releasing AMP and diphosphate. ArgH then cleaves argininosuccinate
  to yield L-arginine and fumarate.
existing_annotations:
- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: ArgG biosynthetic chemistry alone does not establish a complete urea-cycle role in KT2440.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0000050 requires arginine synthesis followed by cleavage yielding urea and regenerated
      ornithine; it does not require ureotelic excretion. Native KT2440 genetics supports arginine synthesis
      (PMID31451546), whereas primary BarSeq data supports AST, ADAD and APT catabolism (PMID35285712),
      not closure of the ornithine/urea cycle through ArgG. The broadly propagated pathway claim exceeds
      established native pathway scope. Absence of an annotated arginase in proteome metadata is not proof
      of absence, so the former categorical REMOVE is not retained.
    supported_by:
    - reference_id: PMID:35285712
      supporting_text: The use of l -arginine as the sole nitrogen source led to significant growth phenotypes
        in both the common arginine succinyltransferase (AST) pathway
    - reference_id: file:PSEPK/argG/argG-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: 'Reaction=L-citrulline + L-aspartate + ATP = 2-(N(omega)-L-

        CC         arginino)succinate + AMP + diphosphate + H(+);'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000172504
        source_status: UNRESOLVED
        comment: This inspected family node asserts both catalytic/biosynthetic functions and urea cycle;
          KT2440 catalytic conservation does not establish the latter pathway closure. This is a pathway-context
          issue, not donor-count criticism.
