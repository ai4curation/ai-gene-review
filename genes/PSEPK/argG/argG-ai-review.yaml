- id: file:PSEPK/argG/argG-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgG
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. Native KT2440 argG deletion is arginine auxotrophic; primary31451546
      supports biosynthesis. Urea-cycle REMOVE is replaced with MARK_AS_OVER_ANNOTATED: live QuickGO0000050
      requires ornithine-to-arginine synthesis followed by cleavage yielding urea and regenerated ornithine,
      but no ureotelic excretion. PMID35285712 experimentally supports AST, ADAD and APT catabolic routes
      in KT2440, not closure of this cycle through ArgG. Absence of an annotated arginase in a metadata
      file is insufficient negative evidence. PAINT PTN000172504 is a relevant proximate pathway transfer
      whose target scope is at issue, not its donor count.'
  findings:
  - statement: The report identifies the exact accession and retrieves the ATP-dependent argininosuccinate-synthase
      reaction. Its broader claims about rate limitation, regulation, and signaling are not used here.
    supporting_text: L-citrulline + L-aspartate + ATP → N-(L-argininosuccinate) + AMP + PPi
