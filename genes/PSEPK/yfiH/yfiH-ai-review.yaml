        supporting_text: YfiH hydrolyzes UDP-MurNAc-monopeptide into UDP-MurNAc
      - reference_id: PMID:28612943
        supporting_text: yfiH orthologs from other Gram-positive genera were able to compensate the absence of yfiH in E. coli indicating a conserved pathway in bacterial kingdom
proposed_new_terms:
  - proposed_name: UDP-N-acetylmuramoyl-L-serine amidase activity
    proposed_definition: >-
      Catalysis of the hydrolysis of UDP-N-acetylmuramoyl-L-serine to
      UDP-N-acetylmuramate and L-serine, editing an incorrect peptidoglycan
      precursor produced by MurC.
    justification: >-
      GO:0016811 captures only the broad bond class and cannot represent PgeF's
      substrate-specific proofreading activity.
    proposed_parent:
      id: GO:0016811
      label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
    supported_by:
      - reference_id: PMID:35164571
        supporting_text: YfiH hydrolyzes UDP-MurNAc-monopeptide into UDP-MurNAc
suggested_questions:
  - question: >-
      Does Q88Q72 preferentially edit UDP-MurNAc-L-serine and
      UDP-MurNAc-glycine in KT2440, as predicted from PgeF orthology?
  - question: >-
      Does the weak in vitro PNP activity of bacterial PgeF contribute
      measurable purine flux under any KT2440 growth condition?
  - question: >-
      Should PgeF precursor proofreading remain represented by peptidoglycan
      biosynthetic process, or does GO need a dedicated peptidoglycan-precursor
      quality-control process term?
suggested_experiments:
  - description: >-
      Purify Q88Q72 and compare hydrolysis of UDP-MurNAc-L-alanine,
      UDP-MurNAc-L-serine, and UDP-MurNAc-glycine; profile muropeptides and
      beta-lactam sensitivity in a yfiH deletion strain.
    experiment_type: enzyme substrate panel and peptidoglycan mass spectrometry
