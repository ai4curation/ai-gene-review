description: >-
  YfiH (PP_0624), also called PgeF, is a predicted cytoplasmic peptidoglycan
  precursor-editing amidase. YfiH-family enzymes hydrolyze misligated
  UDP-MurNAc-L-serine and UDP-MurNAc-glycine products of MurC, preventing their
  incorporation into peptidoglycan in place of the normal L-alanine-containing
  precursor. Q88Q72 belongs to the PTHR30616:SF2 PgeF family and retains the
  catalytic Cys-centered YfiH fold. Bacterial YfiH proteins can display weak
  purine-nucleoside phosphorylase activity in vitro, but recent genetics and
  comparative enzymology found no physiological PNP role in E. coli. The
  current UniProt product name and ARBA purine reactions therefore do not
  establish Q88Q72 as a purine-salvage pathway component.
