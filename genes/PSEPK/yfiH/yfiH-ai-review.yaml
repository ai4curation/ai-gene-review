core_functions:
  - description: >-
      Proofreads cytoplasmic peptidoglycan precursor synthesis by hydrolyzing
      incorrect UDP-MurNAc-L-serine or UDP-MurNAc-glycine products, preventing
      their incorporation into the cell wall.
    molecular_function:
      id: GO:0016811
      label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
    directly_involved_in:
      - id: GO:0009252
        label: peptidoglycan biosynthetic process
    supported_by:
