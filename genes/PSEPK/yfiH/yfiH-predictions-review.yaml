    source_version: entry version 106, 2026-01-28
    predicted_term:
      id: GO:0004731
      label: purine-nucleoside phosphorylase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Recombinant bacterial YfiH-family proteins show adenosine and inosine
        phosphorolysis in vitro, but PgeF requires over 500-fold more protein
        for PNP than precursor editing and does not rescue PNP loss in E. coli.
        Q88Q72 itself has not been assayed, so biochemical capability is
        plausible but physiological purine-salvage function is unsupported.
      error_type: IN_VITRO_NOT_IN_VIVO
      supported_by:
