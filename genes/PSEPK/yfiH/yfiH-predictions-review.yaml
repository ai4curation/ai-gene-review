id: Q88Q72
gene_symbol: yfiH
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
status: COMPLETE
description: >-
  UniProt ARBA/RuleBase predicts three purine reactions for Q88Q72. Related
  bacterial YfiH proteins can catalyze these reactions weakly in vitro, but
  direct genetic and kinetic comparison supports peptidoglycan-precursor
  editing as the physiological bacterial function. The biochemical activities
  remain uncertain for Q88Q72 and are not used to satisfy purine salvage.
