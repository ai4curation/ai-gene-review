  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: XdhA's metal content is the iron of its two [2Fe-2S] clusters.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
