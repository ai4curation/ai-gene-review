id: Q88F21
gene_symbol: xdhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  XdhA is the FAD- and [2Fe-2S]-binding electron-transfer subunit of the
  two-subunit XdhAB xanthine dehydrogenase. XdhA relays electrons from the
  XdhB molybdenum catalytic subunit toward the terminal acceptor and contributes,
  with XdhB, to oxidation of hypoxanthine to xanthine and xanthine to urate.
  The KT2440 complex has not been characterized directly; the reaction assignment
  rests on subunit-specific domain architecture and homologous bacterial XDHs.
existing_annotations:
- term:
    id: GO:0004854
    label: xanthine dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: XdhA contributes the FAD/[2Fe-2S] electron-transfer module of XdhAB but does not catalyze the complete xanthine reaction alone.
    action: MODIFY
    reason: >-
      The term is right for the XdhAB complex, but the relation is not: replace
      the GOA enables relation with contributes_to (same term). Substrate
      oxidation occurs at the molybdenum center in XdhB, whereas XdhA supplies
      the electron-transfer arm of the assembled enzyme. The qualifier error is
      recorded as a source defect.
    proposed_replacement_terms:
    - id: GO:0004854
      label: xanthine dehydrogenase activity
    supported_by:
    - reference_id: file:PSEPK/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR014307; Xanthine_DH_ssu.'
    - reference_id: PMID:11341925
      supporting_text: XDH from P. putida 86 consists of 91.0 kDa and 46.2 kDa
    - reference_id: file:PSEPK/xdhA/xdhA-deep-research-openscientist.md
      supporting_text: "**XdhA's role is electron transfer**"
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The combined automated (GO_REF:0000120) row assigns the complete
        xanthine dehydrogenase activity (EC 1.17.1.4) to XdhA with enables.
        XdhA is the FAD/[2Fe-2S] small subunit of a two-subunit XdhAB enzyme
        whose purine-hydroxylating molybdenum site is on XdhB, so the
        subunit should carry contributes_to.
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: XdhA binds iron only as part of its two [2Fe-2S] clusters, not as free iron ions.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row comes from the IPR016208 aldehyde oxidase/xanthine dehydrogenase
      superfamily mapping, which spans both subunits and the fused eukaryotic
      enzymes. XdhA's iron is bound only within its two [2Fe-2S] clusters;
      iron-sulfur cluster binding is not a descendant of iron ion binding in
      GO, and GO:0051537 is the accurate cofactor term for XdhA. Free iron ion
      binding is therefore an over-annotation.
    supported_by:
    - reference_id: file:PSEPK/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR016208; Ald_Oxase/xanthine_DH-like.'
    - reference_id: PMID:11341925
      supporting_text: Resonances from FeSI and FeSII were detected at 15 K.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: XdhA is a redox-active subunit whose FAD site reduces NAD+ with electrons received from the molybdenum center.
    action: KEEP_AS_NON_CORE
    reason: >-
      Within XdhAB the XdhA flavin is the site at which electrons are passed to
      NAD+, so a generic oxidoreductase claim is true of the subunit itself and
      no more specific subunit-level catalytic term exists. It is peripheral to
      the core description, which uses electron transfer activity plus
      contributes_to the two complete purine-base oxidations.
    supported_by:
    - reference_id: file:PSEPK/xdhA/xdhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002346; Mopterin_DH_FAD-bd.'
    - reference_id: PMID:11341925
      supporting_text: >-
        The midpoint potentials determined for the molybdenum, FeSI and FAD redox
        couples are close to each other
