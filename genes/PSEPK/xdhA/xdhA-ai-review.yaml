- id: PMID:11341925
  title: 'Xanthine dehydrogenase from Pseudomonas putida 86: specificity, oxidation-reduction potentials of its redox-active centers, and first EPR characterization.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract directly supports the two-subunit P. putida XDH reaction and
      cofactor architecture, but the studied organism is strain 86 rather than KT2440.
  findings:
  - statement: The purified strain-86 enzyme oxidized hypoxanthine and xanthine with NAD+ as preferred electron acceptor.
    supporting_text: oxidation of hypoxanthine, xanthine, purine, and some aromatic aldehydes, using
  - statement: The enzyme contained distinct large and small subunits and spectroscopically detected FAD and two iron-sulfur centers.
