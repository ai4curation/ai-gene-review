- id: PMID:26355499
  title: Identification of a chemoreceptor that specifically mediates chemotaxis toward metabolizable purine derivatives.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The abstract directly supports hypoxanthine and xanthine utilization by
      KT2440 at the organism level but does not identify XdhA genetically.
  findings:
  - statement: KT2440 can use hypoxanthine and xanthine as sole nitrogen sources.
    supporting_text: permitting their use as sole nitrogen sources
- id: file:PSEPK/xdhA/xdhA-deep-research-openscientist.md
  title: OpenScientist deep-research report for Pseudomonas putida KT2440 xdhA
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Useful synthesis of target architecture and homologous XDH biochemistry,
      but several exact electron-path, localization, maturation, and oligomeric
      claims are extrapolated from other strains or species.
  findings:
  - statement: The report correctly distinguishes the XdhA electron-transfer subunit from the XdhB catalytic molybdenum subunit.
    supporting_text: "Importantly, XdhA is **not** the molybdenum-cofactor catalytic subunit"
  - statement: It explicitly identifies the target-specific evidence gap.
    supporting_text: No direct biochemical study of the KT2440 protein.
