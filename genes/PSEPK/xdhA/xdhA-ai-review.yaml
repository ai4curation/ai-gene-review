  qualifier: contributes_to
  review:
    summary: XdhA contributes the FAD/[2Fe-2S] electron-transfer module of XdhAB but does not catalyze the complete xanthine reaction alone.
    action: MODIFY
    reason: >-
      Replace the GOA enables relation with contributes_to. Substrate oxidation
      occurs at the molybdenum center in XdhB, whereas XdhA supplies the
      electron-transfer arm of the assembled enzyme.
    proposed_replacement_terms:
