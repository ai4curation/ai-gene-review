  label: Pseudomonas putida KT2440
description: AceE (PP_0339) is the thiamine diphosphate- and Mg2+-dependent E1 component of the pyruvate
  dehydrogenase complex of Pseudomonas putida KT2440. Encoded next to the E2 gene aceF, it decarboxylates
  pyruvate and reductively acetylates the lipoyl arms of AceF, the first step in the cytosolic oxidative
  conversion of pyruvate to acetyl-CoA. Its assignment rests on the homodimeric PDH E1 family signatures
  and on characterised orthologues such as Escherichia coli AceE; it has not been assayed in KT2440.
