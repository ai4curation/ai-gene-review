description: AceE is the thiamine diphosphate- and Mg2+-dependent E1 component of the pyruvate dehydrogenase complex in Pseudomonas putida KT2440. It decarboxylates pyruvate and reductively acetylates the lipoyl arm of the AceF E2 component, initiating cytosolic conversion of pyruvate to acetyl-CoA by the AceE/AceF/LpdG multienzyme complex.
