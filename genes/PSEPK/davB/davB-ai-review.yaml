taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: DavB is the flavin-dependent lysine 2-monooxygenase that initiates the bacterial Dav pathway
  by oxidatively decarboxylating L-lysine to 5-aminopentanamide. DavA then hydrolyzes this intermediate
  to 5-aminovalerate.
