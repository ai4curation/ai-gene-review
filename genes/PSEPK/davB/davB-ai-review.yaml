    supporting_text: >-
      Mutants with mutations in either pathway failed to use L-lysine as the
      sole carbon and nitrogen source
    reference_section_type: ABSTRACT
  - statement: The study identifies davB and davA as the first two aminovalerate-pathway genes.
    supporting_text: >-
      New genes were identified in both pathways, including the davB and davA
