suggested_questions:
- question: Which active-site determinants distinguish DavB lysine 2-monooxygenases from tryptophan 2-monooxygenases?
suggested_experiments:
- description: Measure purified DavB turnover with L-lysine and L-tryptophan, identify the flavin cofactor,
