  findings:
  - statement: Mutations in either KT2440 lysine-catabolic pathway impair use of L-lysine.
    supporting_text: >-
      Mutants with mutations in either pathway failed to use L-lysine as the
      sole carbon and nitrogen source
    reference_section_type: ABSTRACT
  - statement: The study identifies davB and davA as the first two aminovalerate-pathway genes.
    supporting_text: >-
      New genes were identified in both pathways, including the davB and davA
      genes that encode the enzymes involved in the oxidation of L-lysine to
      delta-aminovaleramide and the hydrolysis of the latter to
      delta-aminovalerate, respectively.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract were checked; this is the primary KT2440
      genetic assignment of davB and davA to the aminovalerate pathway.
- id: PMID:25012259
  title: Enzymatic production of 5-aminovalerate from L-lysine using L-lysine monooxygenase and 5-aminovaleramide
    amidohydrolase.
  findings:
  - statement: Purified P. putida KT2440 DavB directly catalyzes oxidative decarboxylation of L-lysine.
    supporting_text: DavB is a FAD-dependent monooxygenase that catalyzes oxidative decarboxylation
      of l-lysine
    reference_section_type: RESULTS
  - statement: Purified DavB alone converts L-lysine to 5-aminovaleramide, and DavA is needed for efficient
      conversion onward to 5-aminovalerate.
    supporting_text: Catalytic conversion of 4.5 g/L l-lysine resulted in the accumulation of 5-aminovaleramide
      in the reaction mixture
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text purified-enzyme study; identifier and quoted catalytic assignment verified.
