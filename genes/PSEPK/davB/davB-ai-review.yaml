id: Q88QV1
gene_symbol: davB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DavB is the FAD-dependent L-lysine 2-monooxygenase that initiates the bacterial Dav
  (5-aminovalerate) route of L-lysine catabolism. It oxidatively decarboxylates L-lysine with O2 to
  5-aminopentanamide (5-aminovaleramide), CO2 and water; the adjacent davA gene product then hydrolyzes
  this amide to 5-aminovalerate. DavB is a soluble enzyme of the flavin amine oxidase fold (Pfam
  PF01593), and davB is required, together with davA, for use of L-lysine as sole carbon and nitrogen
  source.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct but uninformative oxidoreductase parent of the DavB activity.
    action: MODIFY
    reason: >-
      DavB is an oxidoreductase, so the term is true, but it is far less
      specific than the evidence supports. Purified DavB oxidatively
      decarboxylates L-lysine, which is GO:0050067 L-lysine 2-monooxygenase
      activity, a descendant of this term that the gene already carries on
      another row.
    proposed_replacement_terms:
    - id: GO:0050067
      label: L-lysine 2-monooxygenase activity
    supported_by:
    - reference_id: PMID:25012259
      supporting_text: DavB is a FAD-dependent monooxygenase that catalyzes oxidative decarboxylation
        of l-lysine
- term:
    id: GO:0050067
    label: L-lysine 2-monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific activity for the DavB reaction.
    action: ACCEPT
    reason: >-
      Purified KT2440 DavB directly oxidizes L-lysine to
