  findings: []
- id: file:PSEPK/davB/davB-uniprot.txt
  title: UniProtKB entry Q88QV1 for Pseudomonas putida KT2440 davB
  findings:
  - statement: The record places DavB in the flavin amine oxidase fold through the Pfam PF01593 domain.
    record_section: ["FT:DOMAIN"]
    supporting_text: /note="Amine oxidase"
    reference_section_type: RESULTS
  - statement: >-
      The record's protein name (tryptophan 2-monooxygenase), EC number,
      catalytic activity and auxin pathway lines rest only on ARBA association
      rules and conflict with the purified-enzyme L-lysine activity; they are
      not used as evidence in this review.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The accession and gene identity are verified, but the automated tryptophan/auxin function
      conflicts with KT2440 Dav-pathway evidence.
