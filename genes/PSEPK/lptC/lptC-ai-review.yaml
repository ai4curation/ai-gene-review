- id: PMID:16765569
  title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia
    coli yrbG-yhbG locus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli conditional expression and complementation establish essentiality of the yrbK/lptC-containing
      distal locus under the tested conditions; this is pathway-context evidence, not a direct KT2440 LPS-transfer
      assay. Protected cache is abstract-only; conclusions are limited to that text.
  full_text_unavailable: true
  findings:
  - statement: E. coli conditional expression and complementation establish essentiality of the yrbK/lptC-containing
      distal locus under the tested conditions; this is pathway-context evidence, not a direct KT2440 LPS-transfer
      assay.
    supporting_text: the three distal genes (yrbK, yhbN and yhbG) are essential for E. coli viability.
- id: PMID:18424520
  title: Functional analysis of the protein machinery required for transport of lipopolysaccharide to the outer
    membrane of Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli localization and depletion distinguish cytoplasmic LptB, membrane-anchored LptC and
      periplasmic LptA within one LPS-assembly pathway. Full cached text inspected.
  findings:
  - statement: E. coli localization and depletion distinguish cytoplasmic LptB, membrane-anchored LptC and
      periplasmic LptA within one LPS-assembly pathway.
    supporting_text: 'Thus, we have identified an essential LPS transport component in every cellular compartment:
      LptB in the cytoplasm, LptC in the IM, LptA in the periplasm, and LptD and LptE in the OM.'
- id: PMID:20720015
  title: Structure and functional analysis of LptC, a conserved membrane protein involved in the lipopolysaccharide
    export pathway in Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli LptC binds LPS and transfers it directionally to LptA; cysteine-accessibility experiments
      orient its soluble domain toward the periplasm. Full cached text inspected.
  findings:
  - statement: E. coli LptC binds LPS and transfers it directionally to LptA; cysteine-accessibility experiments
      orient its soluble domain toward the periplasm.
    supporting_text: In vitro, LptA can displace lipopolysaccharide from LptC (but not vice versa), consistent
      with their locations and their proposed placement in a unidirectional export pathway.
- id: PMID:29449493
  title: Lipopolysaccharide is transported to the cell surface by a membrane-to-membrane protein bridge.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component. Full cached text inspected.
  findings:
  - statement: Purified E. coli Lpt components reconstitute ATP-dependent membrane-to-membrane LPS movement.
      Necessity/sufficiency refers to the tested assembled seven-protein system, not autonomous transport by
      every component.
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
      transport to occur.
- id: PMID:30894744
  title: Structural basis of lipopolysaccharide extraction by the LptB(2)FGC complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli K-12 lpt genes expressed in BL21(DE3) support nanodisc structural and ATPase analyses
      of LptB2FG(C); the structures resolve an LPS-binding cavity and coupling. These are homolog experiments
      for KT2440. Full cached text inspected.
  findings:
  - statement: E. coli K-12 lpt genes expressed in BL21(DE3) support nanodisc structural and ATPase analyses
      of LptB2FG(C); the structures resolve an LPS-binding cavity and coupling. These are homolog experiments
      for KT2440.
    supporting_text: Six lipid acyl chains of LPS tightly fit into a cone-shaped hydrophobic pocket formed
      by TMs 1, 2, and 5 of LptF and LptG
- id: PMID:41407669
  title: Structural snapshots of Pseudomonas aeruginosa LptB(2)FG and LptB(2)FGC reveal insights into lipopolysaccharide
    recognition and transport.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: P. aeruginosa PAO1-LAC genes expressed in E. coli support structural/biochemical characterization
      of LptB2FG(C); tagged LptB variants partly complement a P. aeruginosa conditional mutant. The reported
      Pa-LptC/Ec-LptC incompatibility cites earlier work and concerns assembly compatibility, not loss of the
      native LptC role. No KT2440 assay is presented. Full cached text inspected.
  findings:
  - statement: P. aeruginosa PAO1-LAC genes expressed in E. coli support structural/biochemical characterization
      of LptB2FG(C); tagged LptB variants partly complement a P. aeruginosa conditional mutant. The reported
      Pa-LptC/Ec-LptC incompatibility cites earlier work and concerns assembly compatibility, not loss of the
      native LptC role. No KT2440 assay is presented.
    supporting_text: each gene (lptB, lptC, lptF and lptG) had been amplified from P. aeruginosa PAO1-LAC genomic
