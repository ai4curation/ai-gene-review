  label: Pseudomonas putida KT2440
description: LptC is an inner-membrane-anchored, periplasmic lipopolysaccharide transfer protein in the Lpt
  trans-envelope machinery. It accepts LPS from the LptBFG extractor and passes it to LptA, coupling inner-membrane
  extraction to transport across the periplasm.
