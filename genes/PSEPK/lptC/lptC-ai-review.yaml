id: Q88P97
gene_symbol: lptC
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LptC is an inner-membrane-anchored, periplasmic lipopolysaccharide
  transfer protein in the Lpt trans-envelope machinery. It accepts LPS from the
  LptBFG extractor and passes it to LptA, coupling inner-membrane extraction to
  transport across the periplasm.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LptC is anchored in the inner membrane by an N-terminal transmembrane helix.
    action: ACCEPT
    reason: The LptC family and UniProt localization support plasma-membrane localization.
- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LptC participates in transfer of LPS from LptBFG to LptA.
    action: ACCEPT
    reason: This is the specific biological process executed by LptC and is distinct from molecular function.
- term:
    id: GO:0017089
    label: glycolipid transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: LptC transfers a glycolipid, but a specific LPS transfer term is also present.
    action: MARK_AS_OVER_ANNOTATED
    reason: The broad MF adds no useful information beyond lipopolysaccharide transfer activity.
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The functional domain of membrane-anchored LptC projects into the periplasm.
    action: ACCEPT
    reason: Periplasmic localization is integral to transfer from LptBFG to LptA.
- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: LptC-dependent LPS delivery supports construction of the Gram-negative outer membrane.
    action: ACCEPT
    reason: The process annotation accurately reflects the biological outcome of LptC activity.
- term:
    id: GO:0046836
    label: glycolipid transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: LPS transport is a specific glycolipid transport pathway.
    action: KEEP_AS_NON_CORE
    reason: Correct but broader and less informative than lipopolysaccharide transport.
- term:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LptC directly transfers LPS from the inner-membrane extractor to LptA.
    action: ACCEPT
    reason: This specific term best captures the direct molecular function of LptC.
core_functions:
- description: Transfers lipopolysaccharide from the inner-membrane LptBFG extractor to periplasmic LptA.
