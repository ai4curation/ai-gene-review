id: Q88RS4
gene_symbol: PP_0055
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0055 encodes HpdR, a 295-residue LysR-type transcriptional regulator (LTTR) with an
  N-terminal winged helix-turn-helix DNA-binding domain and a C-terminal LysR
  substrate-binding (periplasmic-binding-protein-like) effector domain. It is transcribed
  divergently from PP_0056 (hpdH), which encodes a GMC-family choline/3-hydroxypropionate
  dehydrogenase needed for 3-hydroxypropionate (3-HP) catabolism. HpdR binds the
  hpdR-hpdH intergenic promoter region and activates hpdH transcription when 3-HP is
  present. A conserved 40-nucleotide element upstream of the hpdH -35 box is required for
  this activation. The same switch also responds to both enantiomers of
  3-hydroxybutyrate and to levulinic acid. HpdR binds the promoter even without inducer,
  which suggests that, like many LTTRs, it may also repress its own transcription.
