- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001286648
  - UniRule:UR000400807
  review:
    summary: >-
      HpdR is a promoter-specific regulator that controls when hpdH is transcribed. It is
      not a component of the transcription machinery (RNA polymerase, sigma factors or
      general elongation factors). Its process role is captured by regulation of
      DNA-templated transcription, not by the transcription process itself.
    action: MODIFY
    reason: >-
      Under GO practice, sequence-specific transcription factors are annotated to
      regulation of transcription, not to the transcription process itself. The essence of
      the row (HpdR acts on transcription) is sound, so it is redirected laterally to the
      regulatory process the evidence supports, positive regulation of DNA-templated
      transcription (GO:0045893), which is also the replacement proposed for GO:0006355.
    proposed_replacement_terms:
    - id: GO:0045893
      label: positive regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:28496205
      supporting_text: a conserved 40-nucleotide sequence in the hpdH promoter, which plays a
        key role in HpdR-mediated transcription activation
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000847
  - InterPro:IPR058163
  - UniRule:UR000400807
  review:
    summary: >-
      Correct. The demonstrated direction is positive: HpdR activates PhpdH transcription
      in response to 3-HP, with 23-fold induction in E. coli and more than 500-fold
      induction in C. necator.
    action: MODIFY
    reason: >-
      The term is correct but general. The experimental evidence supports positive
      regulation of DNA-templated transcription (GO:0045893), a descendant of this term.
      Negative autoregulation of hpdR is only inferred from inducer-independent EMSA
      binding, so GO:0045892 is not proposed.
    proposed_replacement_terms:
    - id: GO:0045893
      label: positive regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:28496205
      supporting_text: PpHpdR/PhpdH demonstrates the highest level of normalized fluorescence
        and the strongest induction values; 23.3-fold in E. coli and more than 500-fold in C.
    - reference_id: PMID:28496205
      supporting_text: This shows that their corresponding LTTRs are required for transcription
        activation and that E. coli and C. necator do not have cross-reacting regulator homologues.
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001286648
  review:
    summary: >-
      Correct. HpdR binds the native hpdH promoter region in vitro (EMSA), and mutating
      the most conserved nucleotides of two cis-acting regulatory elements (CRE1, CRE2)
      in a conserved 40-nt region upstream of the hpdH -35 box abolishes 3-HP-inducible
      expression. These elements are unusual for an LTTR: the authors note that neither
      contains the typical LysR T-N11-A binding motif. The binding is to a promoter
      cis-regulatory region, so the more specific child term cis-regulatory region
      sequence-specific DNA binding (GO:0000987) is supported.
    action: MODIFY
    reason: >-
      The family-level TreeGrafter term is correct but less specific than the EMSA and
      promoter-mutagenesis data for this protein, which show binding to the hpdH promoter
      cis-regulatory region. GO:0000987 is an is_a descendant of GO:0043565 (via
      GO:0000976 and GO:1990837).
    proposed_replacement_terms:
    - id: GO:0000987
      label: cis-regulatory region sequence-specific DNA binding
    supported_by:
    - reference_id: PMID:28496205
      supporting_text: These mutations abolish the ability of the promoter to mediate controllable
        gene expression
    - reference_id: PMID:28496205
      supporting_text: neither CRE1 nor CRE2 contains the typical LysR T-N11-A binding motif
    - reference_id: PMID:28496205
      supporting_text: we confirmed in vitro binding of HpdR to the native hpdH promoter region
        by EMSA
    - reference_id: PMID:28496205
