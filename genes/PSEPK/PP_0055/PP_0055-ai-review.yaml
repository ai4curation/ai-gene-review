suggested_questions:
- question: Does HpdR (PP_0055) negatively autoregulate hpdR transcription from the shared
    intergenic region, as its inducer-independent EMSA binding suggests? If so, it would
    also warrant negative regulation of DNA-templated transcription (GO:0045892).
  experts:
  - LysR regulator experts
- question: Does HpdR regulate any genes beyond hpdH in KT2440, such as the downstream
    transporter PP_0057, or the PP_0056-0057 induction seen on 1,4-butanediol?
  experts:
  - Pseudomonas putida metabolism experts
- question: Is 3-HP itself the physiological effector bound by the HpdR substrate-binding
    domain, or a downstream metabolite such as malonate semialdehyde?
  experts:
  - LysR regulator experts
suggested_experiments:
- description: Construct a KT2440 PP_0055 deletion and measure PP_0056 transcript levels and
    3-HP consumption with and without 3-HP, to confirm the HpdR-hpdH link in the native host.
  experiment_type: genetic knockout with expression analysis
- description: Run ChIP-seq or DAP-seq for HpdR with and without 3-HP to map its regulon and
    test for autoregulatory binding at the hpdR promoter.
  experiment_type: regulon mapping
- description: Measure binding of 3-HP, 3-hydroxybutyrate enantiomers and levulinate to the purified
    HpdR effector-binding domain by isothermal titration calorimetry.
  experiment_type: biophysical characterization
