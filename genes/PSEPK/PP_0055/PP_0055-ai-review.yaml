  review:
    summary: >-
      Correct: PP_0055 is an LTTR, and as HpdR it is a sequence-specific DNA-binding
      transcription factor. Experimentally it acts as an activator. The PhpdH promoter is
      not induced by 3-HP without HpdR, HpdR binds the hpdH promoter in vitro, and a
      conserved 40-nt promoter element is required for HpdR-mediated activation. The
      evidence therefore supports the more specific child term DNA-binding transcription
      activator activity (GO:0001216).
    action: MODIFY
    reason: >-
      The term is correct but less specific than the evidence supports. Reporter and EMSA
      data from Hanko et al. 2017 show that HpdR is a 3-HP-dependent activator of hpdH, so
      the term should be refined to GO:0001216, an is_a descendant of GO:0003700.
      Repression (autoregulation) is only suggested, not tested, so GO:0001217 is not added.
    proposed_replacement_terms:
    - id: GO:0001216
      label: DNA-binding transcription activator activity
    supported_by:
    - reference_id: PMID:28496205
      supporting_text: This shows that their corresponding LTTRs are required for transcription
        activation and that E. coli and C. necator do not have cross-reacting regulator homologues.
    - reference_id: PMID:28496205
