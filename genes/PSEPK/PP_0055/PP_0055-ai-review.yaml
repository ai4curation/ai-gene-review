- id: PMID:28496205
  title: Characterisation of a 3-hydroxypropionic acid-inducible system from Pseudomonas putida
    for orthogonal gene expression control in Escherichia coli and Cupriavidus necator.
  findings:
  - statement: The PpHpdR/PhpdH system from KT2440 is 3-HP-inducible and orthogonal in E. coli
      and C. necator, and it requires HpdR for activation.
    supporting_text: This shows that their corresponding LTTRs are required for transcription
      activation and that E. coli and C. necator do not have cross-reacting regulator homologues.
  - statement: HpdR binds the native hpdH promoter region in vitro (EMSA).
    supporting_text: we confirmed in vitro binding of HpdR to the native hpdH promoter region
      by EMSA
  - statement: Binding without inducer suggests negative autoregulation, which was not tested
      directly.
    supporting_text: Protein-DNA complex formation occurs even under uninduced conditions likely
      indicating that HpdR is involved in negative autoregulation of hpdR transcription.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary characterisation of HpdR (full text cached, PMC5431877). The paper does not
      print the locus tag; PP_0055 is identified as hpdR from its divergent position next to
      PP_0056 (hpdH) with an intergenic region of about 230 bp.
- id: PMID:41390427
  title: Development of an ethanol-based microbial platform for 3-hydroxypropionic acid production
    using engineered Pseudomonas putida KT2440.
  findings:
  - statement: The divergent partner gene PP_0056 is the 3-HP dehydrogenase (hpdH) and is needed
      for residual 3-HP catabolism.
    supporting_text: 3-hpdh (PP_0056) is located in a separate operon and encodes a choline/3-hydroxypropionate
      dehydrogenase
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes the locus tag of hpdH (PP_0056) and its in vivo role in 3-HP
      degradation; does not test PP_0055 directly.
- id: PMID:34508142
  title: Inducible and tunable gene expression systems for Pseudomonas putida KT2440.
  findings:
  - statement: hpdR and hpdH form one divergent regulatory unit in KT2440, and the HpdR/PhpdH
      system is also induced by levulinic acid.
    supporting_text: hpdH and its regulator hpdR in one operon
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Uses HpdR/PhpdH as an expression system in KT2440; extends the effector range
      to levulinic acid.
- id: PMID:32256468
  title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
  findings:
  - statement: The HpdR target PP_0056 (BetA-I) and the adjacent transporter PP_0057 are strongly
      induced during growth on 1,4-butanediol.
    supporting_text: These include the GMC family oxidoreductase PP_0056 (BetA-I, along with its
      associated transporter PP_0057)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Transcriptomic context for the HpdR target operon; PP_0055 itself is not studied.
