predictions:
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0003677
    label: DNA binding
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Correct but less precise. HpdR binds the hpdH promoter region in vitro, so DNA binding
      is true. However, GOA already carries the more specific sequence-specific DNA binding
      (GO:0043565), which the main review refines to cis-regulatory region sequence-specific
      DNA binding (GO:0000987). The main review marks this term TOO_GENERAL because
      GO:0000987 and the activator activity GO:0001216 entail it. It comes from the SPARCLE naming
      architecture 11426483. No error type applies, because the term is not wrong.
    supported_by:
    - reference_id: file:PSEPK/PP_0055/PP_0055-pgap-prediction-evidence/WP_010951464.1.gp
      supporting_text: Domain architecture ID 11426483
    - reference_id: PMID:28496205
      supporting_text: we confirmed in vitro binding of HpdR to the native hpdH promoter region
        by EMSA
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Correct but less precise. PP_0055 is HpdR, an LTTR whose divergent target PhpdH is not
      induced by 3-HP when HpdR is absent and needs a conserved 40-nt element for
      HpdR-mediated activation. Its function is therefore DNA-binding transcription activator
      activity (GO:0001216), a child of the predicted term. This agrees with the main
      review's MODIFY of the GOA GO:0003700 row to GO:0001216. A family-level LysR
      architecture cannot tell activators from repressors, so the general term is the best
      such a model can give.
    supported_by:
    - reference_id: file:PSEPK/PP_0055/PP_0055-pgap-prediction-evidence/WP_010951464.1.gp
      supporting_text: GO:0003700 - DNA-binding transcription factor activity
    - reference_id: PMID:28496205
      supporting_text: This shows that their corresponding LTTRs are required for transcription
        activation and that E. coli and C. necator do not have cross-reacting regulator homologues.
    - reference_id: PMID:28496205
      supporting_text: a conserved 40-nucleotide sequence in the hpdH promoter, which plays a
        key role in HpdR-mediated transcription activation
- source_method: NCBI PGAP
  source_version: GCF_000007565.2-RS_2026_02_04 (live); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Correct but less precise. The demonstrated role of HpdR is 3-HP-dependent activation
      of hpdH transcription, with 23-fold induction in E. coli and more than 500-fold
      induction in C. necator. That is positive regulation of DNA-templated transcription
      (GO:0045893), the replacement the main review proposes for the GOA GO:0006355 row.
      Negative autoregulation is only suggested, so the general parent is not needed to
      cover both directions.
    supported_by:
    - reference_id: file:PSEPK/PP_0055/PP_0055-pgap-prediction-evidence/pgap_models.yaml
      supporting_text: 'WP_010951464.1: ArchId:11426483'
    - reference_id: PMID:28496205
      supporting_text: PpHpdR/PhpdH demonstrates the highest level of normalized fluorescence
        and the strongest induction values; 23.3-fold in E. coli and more than 500-fold in C.
