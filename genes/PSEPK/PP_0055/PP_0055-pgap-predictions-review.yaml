description: >-
  NCBI PGAP names WP_010951464.1 (PP_0055) "LysR family transcriptional regulator" from
  CDD/SPARCLE domain architecture 11426483. That architecture carries GO, so the protein
  receives three IEA terms: DNA binding (GO:0003677), DNA-binding transcription factor
  activity (GO:0003700) and regulation of DNA-templated transcription (GO:0006355). The
  domain HMM NF012354 (LysR HTH, wrapping PF00126) maps the same GO:0003700 and GO:0006355,
  but it was not the naming model, so it adds nothing. All three PGAP terms are correct and
  are also in GOA. PP_0055 is HpdR, the divergent LysR activator of hpdH (PP_0056,
  3-hydroxypropionate dehydrogenase). It binds the hpdH promoter (EMSA) and is required for
  3-HP-inducible PhpdH transcription. Each PGAP term is therefore less precise than what is
  known: the protein is a DNA-binding transcription activator (GO:0001216) that positively
  regulates transcription (GO:0045893). Family-level architecture cannot provide the
  activator direction or the 3-HP/hpdH specificity. Unlike PP_0661, which is named from an
  architecture without GO and so gets no GO, this LysR protein receives a correct
  family-level GO set. The difference comes from which model names the protein, not from
  any difference in the biology.
