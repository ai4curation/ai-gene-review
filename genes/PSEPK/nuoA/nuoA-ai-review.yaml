- term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000051415
  review:
    summary: UniRule mapping to the non-electrogenic NADH:quinone reductase activity.
    action: REMOVE
    reason: GO:0050136 is defined by the non-pumping reaction NADH + H+ + a quinone
      = NAD+ + a quinol (NDH-2 type). NuoA belongs to the electrogenic NDH-1, whose
      HAMAP-curated reaction (RHEA:57888) includes translocation of four protons;
      in E. coli the two enzyme classes are explicitly distinguished by gradient
      generation. The mapping is demonstrably wrong for this complex.
    supported_by:
    - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every
        two electrons transferred, four hydrogen ions are translocated across the cytoplasmic
        membrane), and thus conserves the redox energy in a proton gradient.
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh II) that reacts with NADH exclusively whose
        turnover does not lead to generation of a H+ electrochemical gradient between
        the primary dehydrogenase and ubiquinone 1
