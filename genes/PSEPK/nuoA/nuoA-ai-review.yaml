core_functions:
- description: Small three-helix membrane subunit of proton-pumping NDH-1 (complex
    I) at the peripheral-arm/membrane-arm junction, stabilising the quinone-site
    interface and lining a proton-translocation pathway, thereby contributing to
    the NADH:ubiquinone oxidoreductase activity of the assembled complex (inferred
    from HAMAP family membership and orthology to E. coli NuoA).
