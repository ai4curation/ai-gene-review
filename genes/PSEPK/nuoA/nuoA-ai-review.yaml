suggested_questions:
- question: Has the contribution of P. putida KT2440 nuoA to complex I assembly, activity,
    or proton-coupling efficiency been tested directly?
suggested_experiments:
- description: Construct a clean nuoA deletion or conditional depletion strain and
    measure membrane-associated deamino-NADH:quinone oxidoreductase activity, respiratory
    growth, and proton-motive-force generation.
