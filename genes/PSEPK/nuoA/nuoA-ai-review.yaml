  label: Pseudomonas putida KT2440
description: >-
  NuoA (PP_4119; NADH-quinone oxidoreductase subunit A, complex I subunit 3
  family, ND3/Nqo7 homologue) is a small (137-residue) three-transmembrane-helix
  subunit of the cytoplasmic-membrane, proton-pumping NADH:quinone
  oxidoreductase NDH-1 (respiratory complex I), encoded first in the single
  nuoA-N operon (PP_4119-PP_4131). By orthology to the structurally
  characterised Escherichia coli and Thermus thermophilus subunits, it sits at
  the junction of the peripheral and membrane arms, where its first cytoplasmic
  loop wraps around NuoH and stabilises the quinone-site interface, and it lines
  a proton-translocation pathway with NuoN, NuoK and NuoJ. It has no redox
  cofactor of its own and contributes to the activity of the complex, which
  couples electron transfer from NADH to ubiquinone with translocation of four
  protons across the membrane to generate proton-motive force for aerobic
  respiration.
