taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NuoA is a small integral-membrane subunit at the quinone-site coupling interface of respiratory complex I. It helps transmit redox-linked conformational changes from the peripheral arm into the proton-translocating membrane arm.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: 'plasma membrane is supported for NuoA and is retained.'
      action: ACCEPT
      reason: NuoA is the small membrane-interface subunit of respiratory complex I. The HAMAP rule MF_01394 (curated UniRule) places NdhA/NuoA in the cell inner membrane as a multi-pass membrane protein, and the record carries three HAMAP-predicted helical TRANSMEM segments (12-32, 66-86, 95-115); in a Gram-negative bacterium the inner membrane is the plasma membrane. This is rule-based, not experimental, evidence for P. putida.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane"
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        12..32"
  - term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: 'Retain NADH dehydrogenase (ubiquinone) activity for NuoA with a contributes_to qualifier.'
      action: MODIFY
      reason: NuoA contributes an essential subunit role to assembled respiratory complex I but does not independently catalyze the complete NADH:quinone reaction; retain the term and replace enables with contributes_to.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
      proposed_replacement_terms:
        - id: GO:0008137
          label: NADH dehydrogenase (ubiquinone) activity
  - term:
      id: GO:0016651
      label: oxidoreductase activity, acting on NAD(P)H
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: 'oxidoreductase activity, acting on NAD(P)H reflects whole-complex or broad chemistry rather than this subunit direct activity.'
      action: MARK_AS_OVER_ANNOTATED
      reason: The complete NADH:quinone oxidoreductase reaction is an emergent activity of assembled complex I; this subunit contributes to it but does not independently enable the full reaction.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
  - term:
      id: GO:0030964
      label: NADH dehydrogenase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: part_of
    review:
      summary: 'NADH dehydrogenase complex is correct but general; refine to respiratory chain complex I.'
      action: MODIFY
      reason: The HAMAP rule MF_01394 (curated UniRule) and the HAMAP/InterPro family memberships (NDH1_NuoA, complex I subunit 3 family) place NuoA in the 13-subunit proton-translocating NDH-1, whose membrane sector it forms with NuoH, J, K, L, M and N. That is respiratory chain complex I (GO:0045271, an is_a descendant of NADH dehydrogenase complex), the complex already used in this review's core function, so the general term is refined to it. Rule-based, not experimental, evidence for P. putida.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: "NDH-1 is composed of 13 different subunits. Subunits NuoA, H,"
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["DR:HAMAP"]
          supporting_text: "HAMAP; MF_01394; NDH1_NuoA; 1."
      proposed_replacement_terms:
        - id: GO:0045271
          label: respiratory chain complex I
  - term:
      id: GO:0050136
      label: NADH dehydrogenase (quinone) (non-electrogenic) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: 'NADH dehydrogenase (quinone) (non-electrogenic) activity is inappropriate for this subunit and should be removed.'
      action: REMOVE
      reason: This term explicitly describes a non-electrogenic quinone reductase, whereas Nuo is the proton-translocating NDH-1 complex.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: 'proton transmembrane transport is supported for NuoA and is retained.'
      action: ACCEPT
      reason: NuoA is a membrane-sector subunit of respiratory complex I. The curated HAMAP rule MF_01394 function statement says NDH-1 couples the redox reaction to proton translocation across the cytoplasmic membrane, and NuoA belongs to the membrane sector (with NuoH, J, K, L, M, N) that carries out that translocation. The evidence is family/rule-level and applies to the assembled complex, to which NuoA contributes.
      supported_by:
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "Couples the redox reaction to proton translocation (for"
        - reference_id: file:PSEPK/nuoA/nuoA-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: "J, K, L, M, N constitute the membrane sector of the complex."
