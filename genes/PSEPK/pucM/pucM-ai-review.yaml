  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Broad purine-nucleobase metabolism is valid pathway context but less
      informative than the specific urate-catabolic role.
    action: KEEP_AS_NON_CORE
    reason: >-
      PucM acts on a urate-oxidation intermediate, so the broad parent process
      is true. The core process is GO:0019628 urate catabolic process.
    supported_by:
    - reference_id: file:PSEPK/pucM/pucM-uniprot.txt
      supporting_text: >-
        Catalyzes the hydrolysis of 5-hydroxyisourate (HIU) to 2-oxo-
