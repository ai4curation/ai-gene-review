- id: file:PSEPK/pucM/pucM-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK pucM
  findings:
  - statement: >-
      The report independently recovers the Q88F14 identity, exact HIU-to-OHCU
      reaction, and second-step pathway role.
    supporting_text: >-
      encodes **5-hydroxyisourate hydrolase (HIU hydrolase; HIUHase; EC
