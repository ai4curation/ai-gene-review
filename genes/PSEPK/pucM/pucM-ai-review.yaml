  - statement: >-
      No Q88F14-specific enzyme assay or structure was found.
    supporting_text: No direct biochemical characterization of Q88F14.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      The identity and pathway step are useful corroboration, but the report
      promotes homolog-derived tetramer, residue, and localization claims to
      Q88F14 and incorrectly places it beside a soluble uricase. Those details
      were not imported into the PuuD-linked KT2440 review.
core_functions:
- description: >-
    Hydrolysis of 5-hydroxyisourate to OHCU in the second step of urate
    catabolism, rapidly processing a metastable intermediate before terminal
    decarboxylation.
