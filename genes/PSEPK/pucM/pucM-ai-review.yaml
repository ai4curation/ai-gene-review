id: Q88F14
gene_symbol: pucM
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PucM (PP_4285) is a transthyretin-fold 5-hydroxyisourate hydrolase
  (EC 3.5.2.17) that performs the second reaction of urate oxidation. It
  hydrolyzes the metastable 5-hydroxyisourate produced by the first-step urate
  oxidoreductase to OHCU, which is then decarboxylated to (S)-allantoin.
