description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for
  P. putida CP069317.1_1962 is "AsmA-related integral inner membrane protein"
  (tier B, "Dark (no prior function)"), with one GO term, GO:0005886 plasma
  membrane. The query is 97.2% identical over its full 357 residues to KT2440
  PP_4572 (Q88E94), so it is scored on that accession. The call is supported.
  "AsmA-related" is justified at the family level. PP_4572 is in the AsmA-like
  family (IPR052894 / PANTHER PTHR30441:SF4) and is the full-length orthologue
  (71.7% identity) of P. aeruginosa PA2708, one of the seven AsmA-like proteins
  of that species (PMID:38305166). Its N-terminal transmembrane helix plus a
  strand-rich periplasmic region is the family architecture. The family label
  rests on PANTHER and orthology: DUF748 (PF05359) is matched on orthologues
  but not on the query, and similarity to the E. coli AsmA-like proteins is
  weak and partial. The annotator rightly withheld a lipid-transport activity
  and an outer-membrane-biogenesis process. PA2708 is dispensable and is
  thought too short to span the periplasm, and PP_4572 has no KT2440 fitness
  phenotype in 300 experiments. The single GO term is correct but already in
  GOA as a TreeGrafter IEA, so it is CNN. The call missed the PA2708 orthology
  and the one experiment on it, and the dashboard's PaperBLAST panel showed
  only a table snippet of that paper.
