- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct but not novel. DeepTMHMM predicts a single alpha-helical
      transmembrane segment at residues 7-30, with the N-terminus cytoplasmic,
      no signal peptide and residues 31-357 outside the cytoplasm. A hydropathy
      scan finds no other hydrophobic segment (homology_topology_results.json).
      This matches the inner-membrane-anchored architecture reported for all
      P. aeruginosa AsmA-like proteins, including the 71.7%-identical orthologue
      PA2708 (PMID:38305166). In bacteria GO:0005886 is the inner membrane.
      GOA already has GO:0005886 for Q88E94 as a TreeGrafter IEA, so the
      prediction is not novel. The location is inferred from sequence and has
      not been tested experimentally.
