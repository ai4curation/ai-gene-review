  label: Pseudomonas putida KT2440
description: >-
  PP_4572 (Q88E94) is a 357-residue member of the AsmA-like protein family
  (InterPro IPR052894; PANTHER PTHR30441, subfamily SF4) with a single
  N-terminal transmembrane helix (DeepTMHMM residues 7-30, N-terminus in the
  cytoplasm) and a C-terminal region of about 325 residues predicted to lie in
  the periplasm. Its AlphaFold model of that region is strand-rich and extends
  about 86 A, consistent with the short tube-like AsmA fold. The UniProt name
  "DUF748 domain-containing protein" is a ProtNLM prediction: no Pfam DUF748
  (PF05359) match is recorded for Q88E94 itself, although its orthologues carry
  it. PP_4572 is the full-length orthologue of P. aeruginosa PA2708 (Q9I0D4;
  71.7% identity over 357 aligned residues), a Pseudomonas-specific AsmA-like
  protein absent from E. coli. Sposato et al. 2024 found PA2708 dispensable,
  even in a strain depleted of the redundantly essential AsmA-like
  phospholipid-transport proteins TamB, YhdP and YdbH, and argued that it is
  too short to bridge the periplasm unless it has an outer-membrane partner;
  its role is unknown. PP_4572 aligns only weakly and partially to the E. coli
  AsmA-like proteins (at best 24-26% identity over 126-195 residues), so it is
  not an orthologue of AsmA, TamB, YhdP, YdbH, YicH or YhjG. KT2440 RB-TnSeq
  (300 experiments, BERDL copy of the Fitness Browser) shows no phenotype for
  PP_4572 mutants (fitness range -0.39 to +0.39) and no informative cofitness
  (top cofitness 0.27). It is not part of the neighbouring PxpABC
  5-oxoprolinase cluster: PP_4575-PP_4579 mutants are defective on
  L-pyroglutamate, PP_4572 mutants are not. Best description: an
  inner-membrane-anchored, periplasm-facing AsmA-like protein of unknown
  function; any role in intermembrane lipid transport or outer-membrane
  biogenesis is untested.
