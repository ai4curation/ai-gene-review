- id: PMID:38305166
  title: Redundant essentiality of AsmA-like proteins in Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genetic analysis of the seven P. aeruginosa AsmA-like proteins. It includes the only experiment on PA2708, the orthologue of PP_4572, which was dispensable even when TamB was depleted in a yhdP ydbH background.
  findings:
  - statement: PA2708 is much shorter than the other AsmA-like proteins and is probably too short to span the periplasm.
    supporting_text: Notably, the P. aeruginosa protein PA2708 is much smaller than the other AsmA-like proteins of both P. aeruginosa and E. coli (Table 1), and the length of its periplasmic domain is likely not sufficient to span the entire periplasmic space
  - statement: Deleting PA2708 did not worsen the growth defect of a TamB-depleted yhdP ydbH mutant, so PA2708 is not required for growth.
    supporting_text: PA2708, which was not investigated in the initial genetic screening, is not required for P. aeruginosa growth
  - statement: The role of PA2708 is unknown.
    supporting_text: Further studies are required to uncover its role in Pseudomonas physiology.
  - statement: P. aeruginosa AsmA-like proteins share an N-terminal transmembrane helix and a beta-rich tube.
    supporting_text: All P. aeruginosa AsmA-like proteins are predicted to share an N-terminal TMH and an elongated tube-like structure rich in β-strands with a lateral opening along the long axis
- id: PMID:34781743
  title: YhdP, TamB, and YdbH Are Redundant but Essential for Growth and Lipid Homeostasis of the Gram-Negative Outer Membrane.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes the large E. coli AsmA-like proteins as redundant envelope-biogenesis factors linked to outer-membrane lipid homeostasis. This is family context only; PP_4572 is not an orthologue of these proteins.
  findings:
  - statement: TamB, YhdP and YdbH are redundantly essential for envelope biogenesis in E. coli.
    supporting_text: Using a genetic approach, we found that TamB, YhdP, and YdbH are redundant in performing a function that is essential in envelope biogenesis.
