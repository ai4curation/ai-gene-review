  review:
    summary: Correct. PP_4572 has a single N-terminal transmembrane helix that anchors it in the inner (cytoplasmic) membrane, as for other AsmA-like proteins.
    action: ACCEPT
    reason: >-
      DeepTMHMM predicts one alpha-helical transmembrane segment at residues
      7-30 with the N-terminus in the cytoplasm and no signal peptide, and a
      Kyte-Doolittle scan finds only this one hydrophobic segment
      (homology_topology_results.json). Sposato et al. report the same
      N-terminal transmembrane helix plus a beta-rich tube for all
      P. aeruginosa AsmA-like proteins, including the orthologue PA2708
      (PMID:38305166). In bacteria GO:0005886 is the inner membrane. Membrane
      location is a sequence-based inference; it has not been tested
      experimentally.
    supported_by:
    - reference_id: file:PSEPK/PP_4572/PP_4572-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: 'Topology: cytoplasmic 1-6; ALPHA-HELICAL TRANSMEMBRANE SEGMENT 7-30; extracellular/outside 31-357'
    - reference_id: PMID:38305166
      supporting_text: All P. aeruginosa AsmA-like proteins are predicted to share an N-terminal TMH and an elongated tube-like structure rich in β-strands with a lateral opening along the long axis
- term:
    id: GO:0090313
    label: regulation of protein targeting to membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002411697
  review:
    summary: Not supported. This is a family-wide propagation that goes back to the historical E. coli AsmA outer-membrane-protein assembly suppressor phenotype; nothing links PP_4572 or its orthologue PA2708 to protein targeting.
    action: REMOVE
    reason: >-
      The PANTHER PTHR30441 family term reflects early work on E. coli AsmA,
      whose mutations suppressed an OmpF assembly defect, an effect later judged
      to be indirect. The current model for the family is
      inner-to-outer-membrane phospholipid transport by the large bridge-forming
      members (PMID:34781743). PP_4572 is not an orthologue of AsmA. Its
      orthologue PA2708 has no known function and is dispensable for growth
      (PMID:38305166), and PP_4572 itself has no fitness phenotype in KT2440.
      There is no evidence that it regulates protein targeting to the membrane.
    supported_by:
    - reference_id: PMID:38305166
      supporting_text: PA2708, which was not investigated in the initial genetic screening, is not required for P. aeruginosa growth
    - reference_id: file:PSEPK/PP_4572/PP_4572-bioinformatics/homology_topology_results.json
      supporting_text: '"pct_id": 24.1'
    - reference_id: file:PSEPK/PP_4572/PP_4572-deep-research-claude-code.md
      supporting_text: No PP_4572-specific evidence supports it.
