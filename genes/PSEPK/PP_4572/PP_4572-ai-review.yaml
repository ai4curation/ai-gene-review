core_functions:
- description: >-
    Inner-membrane-anchored, periplasm-facing AsmA-like protein of the
    Pseudomonas-specific PA2708 subfamily. Its molecular function and process
    are unknown. By family membership it may bind lipids in an AsmA-type
    groove or work with an outer-membrane partner, but it is too short to
    bridge the periplasm on its own, its orthologue is dispensable, and no
    phenotype is known in P. putida.
