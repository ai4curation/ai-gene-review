taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  KdsD is an arabinose-5-phosphate isomerase that interconverts
  D-ribulose-5-phosphate and D-arabinose-5-phosphate. In KT2440 it is the
  housekeeping candidate for supplying the first dedicated intermediate of
  CMP-KDO biosynthesis for lipopolysaccharide inner-core assembly.
