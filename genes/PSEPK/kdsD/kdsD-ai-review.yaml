  title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia coli yrbG-yhbG locus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Escherichia coli kdsD is individually non-essential because early KDO
      biosynthetic functions are genetically redundant.
    supporting_text: >-
      were shown to be non-essential, indicating genetic redundancy for these two functions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Comparative E. coli evidence supports the paralog-redundancy question but
      is not target-strain evidence for KT2440.
- id: PMID:24891442
  title: Analysis of the arabinose-5-phosphate isomerase of Bacteroides fragilis provides insight into regulation of single-domain arabinose phosphate isomerases.
  full_text_unavailable: true
  findings:
  - statement: >-
      A Bacteroides fragilis API is feedback-inhibited by CMP-KDO, establishing
      a comparative mechanism for end-product control at the first pathway step.
    supporting_text: >-
      is subject to feedback regulation by CMP-Kdo
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      This paper studies a B. fragilis single-domain API; feedback inhibition is
      retained as pathway context and is not transferred to KT2440 KdsD.
