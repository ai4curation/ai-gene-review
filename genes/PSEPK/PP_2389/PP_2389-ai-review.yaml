      supporting_text: 'no signal peptide and no membrane-spanning segment: the protein is predicted to be CYTOPLASMIC (globular).'
references:
- id: PMID:41221789
  title: A Dynamic Gate Enables Regioselective Hydroxylation of Free Arginine by a Non-Canonical Heme Enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Crystal structures of AglA, the prototypical YqcI/YcgG enzyme, showing heme ligated by Cys44
      and a Phe152/Arg179/Phe182 substrate gate. The cached record holds the abstract; the open
      full text (PMC12866846) was read for the residue-level details.
  findings:
  - statement: The YqcI/YcgG family comprises heme-dependent guanidine N-H hydroxylases with a non-canonical fold.
    supporting_text: The YqcI/YcgG family of heme-dependent enzymes catalyzes guanidine N-H hydroxylation, a critical yet enigmatic step in bioactive natural product biosynthesis.
  - statement: Substrate positioning in AglA depends on loop L2 and residues Phe152, Arg179 and Phe182.
    supporting_text: substrate-induced remodeling of loop L2 and key residues (Phe152, Arg179, Phe182) spatially constrains the guanidine group of aminomethylphosphonate-linked arginine (AMPn-Arg)
- id: PMID:35616638
  title: Biosynthesis of Argolaphos Illuminates the Unusual Biochemical Origins of Aminomethylphosphonate and N(ε)-Hydroxyarginine Containing Natural Products.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: First biochemical characterization of a YqcI/YcgG protein (AglA). Abstract only was read.
  findings:
  - statement: AglA is a heme-dependent monooxygenase that hydroxylates AMPn-Arg.
    supporting_text: AglA was revealed to be an unusual heme-dependent monooxygenase that hydroxylated the Nε position of AMPn-Arg.
  - statement: AglA was the first biochemically characterized YqcI/YcgG member, and the family is distinct from P450s.
    supporting_text: As the first biochemically characterized member of the YqcI/YcgG protein family, AglA enlightens the potential functions of this elusive group, which remains biochemically distinct from the well-established P450 monooxygenases.
- id: PMID:22547619
  title: Heme protein and hydroxyarginase necessary for biosynthesis of D-cycloserine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Genetic and spectroscopic evidence that DcsA, the closest characterized homolog of PP_2389
      (38.4% identity over 224 aligned residues), is a heme protein needed to make
      N(omega)-hydroxy-L-arginine. The hydroxylation itself was not reconstituted in vitro.
  findings:
  - statement: DcsA is a heme protein.
    supporting_text: Spectroscopic analyses of the recombinant DcsA revealed that it is a heme protein, supporting an idea that DcsA is an enzyme catalyzing hydroxylation.
  - statement: DcsA is essential in vivo for formation of N(omega)-hydroxy-L-arginine.
    supporting_text: These results indicate that the dcsA gene product, DcsA, is an enzyme essential to generate NHA as a precursor in the DCS biosynthetic pathway.
- id: PMID:35583956
  title: Biosynthesis of Guanitoxin Enables Global Environmental Detection in Freshwater Cyanobacteria.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      In vitro demonstration that the YqcI/YcgG member GntA is an NADPH-dependent heme
      N-hydroxylase acting on a tertiary amine, which widens the family's substrate range beyond
      guanidines and argues against assuming any one substrate for an uncharacterized member.
  findings:
  - statement: GntA is a heme-containing enzyme that mono-oxygenates a tertiary amine using NADPH.
    supporting_text: In the presence of the unusual heme-containing GntA and excess NADPH under ambient aerobic conditions, we observed the selective mono-oxygenation of tertiary amine 7 to product 8 (Figure S15).
