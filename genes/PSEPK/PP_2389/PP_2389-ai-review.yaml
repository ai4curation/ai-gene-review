- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: ISS
  original_reference_id: PMID:35616638
  qualifier: enables
  review:
    summary: >-
      Predicted heme-dependent N-hydroxylation (monooxygenation) of an undetermined nitrogenous
      substrate, inferred from AglA, DcsA and GntA. No activity has been assayed for PP_2389.
    action: NEW
    reason: >-
      Every YqcI/YcgG member with an assigned activity is a heme-dependent N-hydroxylase: AglA
      hydroxylates the N-epsilon of AMPn-Arg (PMID:35616638, PMID:41221789), DcsA is required to
      form N(omega)-hydroxy-L-arginine (PMID:22547619), and GntA mono-oxygenates a tertiary amine
      with NADPH (PMID:35583956). PP_2389 conserves the catalytic cysteine and the AglA
      substrate-gate residues (Phe152/Arg179/Phe182 align to PP_2389 Phe153/Arg180/Phe183). The
      broad term monooxygenase activity is used deliberately: the substrate is unknown, and
      characterized members act on substrates as different as an arginine conjugate and a tertiary
      amine, so no substrate-level or EC-level term is justified. This is an inference at 34-38%
      identity from proteins in natural-product pathways that PP_2389 does not share, so it should
      be read as a hypothesis to test, not an established activity.
    supported_by:
    - reference_id: PMID:35616638
      supporting_text: AglA was revealed to be an unusual heme-dependent monooxygenase that hydroxylated the Nε position of AMPn-Arg.
    - reference_id: PMID:35583956
      supporting_text: In the presence of the unusual heme-containing GntA and excess NADPH under ambient aerobic conditions, we observed the selective mono-oxygenation of tertiary amine 7 to product 8 (Figure S15).
    - reference_id: file:PSEPK/PP_2389/PP_2389-bioinformatics/RESULTS.md
      supporting_text: and the substrate-gate residues Phe152, Arg179 and Phe182 to Phe153, Arg180 and Phe183.
    - reference_id: file:PSEPK/PP_2389/PP_2389-deep-research-claude-code.md
      supporting_text: The best-supported hypothesis is that PP_2389 is a cytoplasmic, heme-dependent guanidine (arginine-type) N-hydroxylase whose physiological substrate is unknown.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_2389/PP_2389-dashboard-prediction-evidence/dashboard_page.txt
  qualifier: located_in
  review:
    summary: >-
      Soluble cytoplasmic protein. No signal peptide or transmembrane segment is predicted, and
      the characterized family members are soluble enzymes.
    action: NEW
    reason: >-
      DeepTMHMM run on this sequence predicts no signal peptide and no membrane-spanning segment
      across residues 1-262. AglA and DcsA were purified as soluble recombinant heme proteins, and
      the AglA structures come from protein expressed in E. coli. Localization has not been tested
      experimentally for PP_2389 or any family member, so this remains a prediction.
    supported_by:
