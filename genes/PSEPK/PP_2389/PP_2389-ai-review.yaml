core_functions:
- description: >-
    Predicted cysteine-ligated heme N-hydroxylase (monooxygenase) of the YqcI/YcgG family,
    acting on an undetermined nitrogenous substrate in the cytoplasm. The assignment is by
    homology only, from characterized members at 34-38% identity (AglA, DcsA, GntA) and
    conservation of the heme-ligating cysteine and substrate-gate residues; no activity, heme
    content or substrate has been determined for PP_2389, and it is not in a biosynthetic gene
    cluster, so the physiological reaction remains unknown.
