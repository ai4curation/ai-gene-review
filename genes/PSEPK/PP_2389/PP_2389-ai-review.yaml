description: >-
  PP_2389 is a 262-residue soluble protein of the YqcI/YcgG family (Pfam PF08892, InterPro
  IPR014988, PANTHER PTHR40045, COG3403). No KT2440 member of this family has been studied, and
  GOA holds no annotations for Q88KA1. Since 2012, several family members from natural-product
  gene clusters have been characterized as heme-dependent N-hydroxylases: DcsA (38.4% identical
  to PP_2389 over 224 aligned residues) is a heme protein required for N(omega)-hydroxy-L-arginine
  formation in D-cycloserine biosynthesis; AglA is a heme-dependent monooxygenase that
  hydroxylates aminomethylphosphonate-linked arginine; and GntA is a heme N-hydroxylase acting on
  a tertiary amine in guanitoxin biosynthesis. AglA crystal structures define a non-canonical
  "sandwich" fold with the heme iron ligated by Cys44. PP_2389 conserves that cysteine (Cys46, in
  the family FPC motif), the three residues that salt-bridge the heme propionates, and the
  Phe/Arg/Phe substrate gate. The best-supported inference is therefore that PP_2389 is a
  cysteine-ligated heme N-hydroxylase (monooxygenase), but this rests on homology at 34-38%
  identity; no activity, heme content or substrate has been measured for PP_2389 or for any
  Pseudomonas member, and the protein does not sit in a biosynthetic gene cluster. It is likely
  co-transcribed with the LysE-family exporter PP_2388 (3 bp downstream) and lies beside a
  divergent LysR-family regulator, PP_2390. In KT2440 RB-TnSeq data, PP_2389 insertion mutants
  grow better on DL-2-aminobutyrate (fitness +4.0) and L-methionine (+2.0) as nitrogen sources,
  and weakly so on a few other amino acids; the PP_2390 and PP_2388 mutants share the same gain
  and PP_2389 is cofit with both. That pattern marks a costly, co-regulated locus rather than a
  role for PP_2389 in using these nitrogen sources, and no molecular activity follows from it.
existing_annotations:
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: ISS
  original_reference_id: PMID:41221789
  qualifier: enables
  review:
    summary: >-
      Predicted binding of a cysteine-ligated heme, inferred from the YqcI/YcgG members AglA
      (crystal structures) and DcsA (spectroscopy). Not measured for PP_2389.
    action: NEW
    reason: >-
      GOA has no annotations for Q88KA1, so this term is new. The AglA structures show that this
      family binds heme through a cysteine thiolate, and mutating that cysteine abolishes activity
      (PMID:41221789). Recombinant DcsA, 38.4% identical to PP_2389 over 224 aligned residues,
      gives heme absorption spectra (PMID:22547619). In pairwise alignment, PP_2389 Cys46 aligns to
      AglA Cys44 and the heme-propionate contacts Arg166/Lys196/Arg200 align to PP_2389
      Arg167/Arg198/Arg202. Heme binding by PP_2389 itself has not been tested, so the evidence is
      homology only.
    supported_by:
    - reference_id: PMID:41221789
      supporting_text: The YqcI/YcgG family of heme-dependent enzymes catalyzes guanidine N-H hydroxylation, a critical yet enigmatic step in bioactive natural product biosynthesis.
    - reference_id: PMID:22547619
      supporting_text: Spectroscopic analyses of the recombinant DcsA revealed that it is a heme protein, supporting an idea that DcsA is an enzyme catalyzing hydroxylation.
