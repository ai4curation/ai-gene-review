  title: gene-annotate dashboard review page for NZ_CP026332.1_3351
  findings:
  - statement: The dashboard call is a cytoplasmic family-level annotation tied to a fitness association.
    supporting_text: Cytoplasmic YqcI/YcgG family protein associated with fitness modulation during utilization of DL-2-aminobutyrate and L-methionine as nitrogen sources.
