- id: PMID:35616638
  title: Biosynthesis of Argolaphos Illuminates the Unusual Biochemical Origins of Aminomethylphosphonate and N(ε)-Hydroxyarginine Containing Natural Products.
  findings:
  - statement: The YqcI/YcgG family has a characterized biochemical activity, contrary to the family labels the annotator saw.
    supporting_text: AglA was revealed to be an unusual heme-dependent monooxygenase that hydroxylated the Nε position of AMPn-Arg.
- id: PMID:41221789
  title: A Dynamic Gate Enables Regioselective Hydroxylation of Free Arginine by a Non-Canonical Heme Enzyme.
  findings:
  - statement: The family is defined structurally as heme-dependent guanidine N-H hydroxylases.
    supporting_text: The YqcI/YcgG family of heme-dependent enzymes catalyzes guanidine N-H hydroxylation, a critical yet enigmatic step in bioactive natural product biosynthesis.
- id: PMID:22547619
  title: Heme protein and hydroxyarginase necessary for biosynthesis of D-cycloserine.
  findings:
  - statement: The closest characterized homolog of PP_2389 is a heme protein.
    supporting_text: Spectroscopic analyses of the recombinant DcsA revealed that it is a heme protein, supporting an idea that DcsA is an enzyme catalyzing hydroxylation.
- id: PMID:35583956
  title: Biosynthesis of Guanitoxin Enables Global Environmental Detection in Freshwater Cyanobacteria.
  findings:
  - statement: A third family member is an NADPH-dependent heme N-hydroxylase, acting on a non-guanidine substrate.
    supporting_text: In the presence of the unusual heme-containing GntA and excess NADPH under ambient aerobic conditions, we observed the selective mono-oxygenation of tertiary amine 7 to product 8 (Figure S15).
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005737
    label: cytoplasm
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel. DeepTMHMM run on the query sequence itself finds no
      signal peptide and no membrane-spanning segment over residues 1-262, and the characterized
      members of this family (AglA, DcsA, GntA) are soluble enzymes purified from bacterial
      cytoplasmic fractions, with AglA solved crystallographically. GOA holds no annotations for
      Q88KA1, so the term is not already curated, which is why this is COR rather than CNN. LSP
      does not apply because no more specific curated compartment term exists. The term is not
      merely a localization default: the sequence has no features that would place it elsewhere,
      and the family's biochemistry is cytoplasmic. The companion gene review adds this term as
      NEW, alongside GO:0020037 and GO:0004497, which this single-term prediction does not
      capture because the annotator's family labels read "uncharacterised".
    supported_by:
    - reference_id: file:PSEPK/PP_2389/PP_2389-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: 'no signal peptide and no membrane-spanning segment: the protein is predicted to be CYTOPLASMIC (globular).'
    - reference_id: PMID:22547619
      supporting_text: Spectroscopic analyses of the recombinant DcsA revealed that it is a heme protein, supporting an idea that DcsA is an enzyme catalyzing hydroxylation.
