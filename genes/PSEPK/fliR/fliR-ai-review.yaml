core_functions:
- description: FliR supplies a distinct structural subunit of the FliPQR polypeptide channel,
    participating in gating and the interface with the proximal flagellar rod. Mechanistic
    transfer to KT2440 is supported by its dedicated export-family signatures; precise stoichiometry
    and ATP/ion coupling remain unmeasured in this strain. The FliP/FliR tip also templates
    initial rod assembly in Salmonella structures; this scaffold role is transferred by family
    inference, not directly measured in KT2440.
