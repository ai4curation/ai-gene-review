    action: MODIFY
    reason: Target-specific NicAB studies establish nicotinate hydroxylation. NicA supplies Fe-S electron
      transfer and NicB supplies the catalytic/cytochrome regions; activity is executed by the assembled
      enzyme. GO:0050138 is NADP-specific and is not an appropriate replacement for this cytochrome-linked
      system.
