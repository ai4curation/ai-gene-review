taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NicA (NdhS; PP_3947) is the small iron-sulfur subunit of the NicAB nicotinate hydroxylase
  in Pseudomonas putida KT2440. Its ferredoxin domains support electron transfer during conversion of
  nicotinate to 6-hydroxynicotinate, initiating aerobic degradation through the maleamate pathway. The
  catalytic molybdopterin and cytochrome regions are supplied by partner NicB.
