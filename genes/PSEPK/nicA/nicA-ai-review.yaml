references:
- id: GO_REF:0000120
  title: Combined automated GO annotation using multiple IEA methods.
  findings:
  - statement: Combined automated methods provide provisional GO annotations that require gene-level review.
- id: file:PSEPK/nicA/nicA-uniprot.txt
  title: UniProtKB reviewed entry for nicA
  findings:
  - statement: UniProt identifies NicA as the small subunit of NicAB nicotinate dehydrogenase, with 2Fe-2S
      cluster binding and nicotinate-catabolic pathway placement.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reviewed entry separates experimentally supported NicAB chemistry from similarity-based
      cofactors and predicted topology.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms.
  findings:
  - statement: InterPro2GO supplies domain/family-based automated annotations that require review against
      the gene-specific UniProt and literature context.
- id: PMID:18678916
  title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster
    from Pseudomonas putida KT2440.'
  findings:
  - statement: The nic cluster paper identified NicAB as catalyzing nicotinate hydroxylation in aerobic
      nicotinic acid degradation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary target-gene experiments. Full article read at PMC2516282, particularly Fig.2
      and NicAB section; supported cache refresh remained abstract-only. Full-text mechanistic findings
      are paraphrased in notes, not fabricated cache quotations.
- id: PMID:19118407
  title: Cloning, heterologous expression, and functional characterization of the nicotinate dehydrogenase
    gene from Pseudomonas putida KT2440.
  findings:
  - statement: Additional biochemical work supports NicAB nicotinate dehydrogenase activity.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target KT2440 ndhSL (nicAB) study; abstract explicitly reports subunit architecture,
      heterologous activity, knockout and recovery. Full text unavailable.
- id: file:PSEPK/nicA/nicA-deep-research-falcon.md
  title: Falcon deep research on nicA (Edison Scientific Literature)
  findings:
  - statement: Generated research assisted literature discovery; primary and curated record evidence anchor
      reviewed functions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Generated secondary synthesis inspected; not primary assay evidence. The reported NicA
      23.8 kDa is inconsistent with the current 157-aa, 16.686-kDa sequence and is not propagated. Physiological
      oxidase coupling remains proposed.
