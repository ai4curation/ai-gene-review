proposed_new_terms:
- proposed_name: nicotinate dehydrogenase (cytochrome) activity
  proposed_definition: 'Catalysis of the reaction: nicotinate + H2O + 2 ferricytochrome = 6-hydroxynicotinate
    + 2 H+ + 2 ferrocytochrome.'
  justification: An acceptor-specific term is needed for assembled NicAB (EC 1.17.2.1; RHEA:27417). GO:0050138
    explicitly specifies NADP+ and is chemically different. The individual subunits contribute to the
    proposed complex activity; their core_functions retain independently supported subunit functions and
    a GO parent for the contributed reaction.
  proposed_parent:
    id: GO:0016725
    label: oxidoreductase activity, acting on CH or CH2 groups
