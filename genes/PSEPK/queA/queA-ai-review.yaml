id: Q88PL8
gene_symbol: queA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  QueA is the cytoplasmic S-adenosylmethionine:tRNA
  ribosyltransferase-isomerase of Pseudomonas putida KT2440. It acts after
  bacterial Tgt has inserted preQ1 at tRNA position 34, transferring and
  rearranging the ribose moiety of S-adenosyl-L-methionine onto preQ1-tRNA to
  produce epoxyqueuosine-tRNA, the substrate for QueG.
existing_annotations:
- term:
    id: GO:0002099
    label: tRNA wobble guanine modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: QueA modifies the preQ1 substituent already attached to wobble position 34.
    action: ACCEPT
    reason: >-
      The reaction converts preQ1-tRNA at position 34 to
      epoxyqueuosine(34)-tRNA, so it directly participates in wobble guanine
      modification.
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "epoxyqueuosine(34) in tRNA"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasm is appropriate for this soluble bacterial tRNA-modifying enzyme.
    action: ACCEPT
    reason: >-
      Reviewed UniProt explicitly assigns QueA to the cytoplasm and predicts no
      membrane or export features.
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006400
    label: tRNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Generic tRNA modification should be narrowed to the queuosine pathway.
    action: MODIFY
    reason: >-
      QueA performs the specific preQ1-tRNA to epoxyqueuosine-tRNA conversion,
      so GO:0008616 is the informative process term.
    proposed_replacement_terms:
    - id: GO:0008616
      label: tRNA queuosine(34) biosynthetic process
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "PATHWAY: tRNA modification; tRNA-queuosine biosynthesis."
- term:
    id: GO:0008616
    label: tRNA queuosine(34) biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: QueA catalyzes the middle tRNA-bound step of bacterial queuosine synthesis.
    action: ACCEPT
    reason: >-
      QueA converts preQ1-tRNA from Tgt into epoxyqueuosine-tRNA for QueG,
      directly linking the two flanking enzymatic steps.
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "7-aminomethyl group of 7-deazaguanine (preQ1-tRNA)"
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Generic transferase activity should be replaced by QueA's defined bifunctional activity.
    action: MODIFY
    reason: >-
      GO:0051075 captures transfer of the AdoMet ribose moiety and the coupled
      rearrangement that yields epoxyqueuosine-tRNA.
    proposed_replacement_terms:
    - id: GO:0051075
      label: S-adenosylmethionine:tRNA ribosyltransferase-isomerase activity
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "RecName: Full=S-adenosylmethionine:tRNA ribosyltransferase-isomerase"
- term:
    id: GO:0016853
