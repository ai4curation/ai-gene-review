    action: MODIFY
    reason: >-
      The isomerization is inseparable from QueA's substrate-specific
      AdoMet-to-preQ1-tRNA transfer reaction; GO:0051075 records the complete
      chemistry.
    proposed_replacement_terms:
    - id: GO:0051075
      label: S-adenosylmethionine:tRNA ribosyltransferase-isomerase activity
    supported_by:
    - reference_id: file:PSEPK/queA/queA-uniprot.txt
      supporting_text: "Transfers and isomerizes the ribose moiety from AdoMet"
- term:
