- term:
    id: GO:0160308
    label: succinate dehydrogenase (FAD) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Describes the FAD-dependent succinate->fumarate half-reaction occurring at the SdhA flavin site, prior to electron transfer to quinone.
    action: KEEP_AS_NON_CORE
    reason: >-
      The InterPro-mapped term describes the reductive half-reaction at the SdhA
      flavin site, which is real. GO:0160308 is written with FAD as a
      co-substrate (FAD + succinate + H+ = fumarate + FADH2), whereas SdhA's FAD
      is a covalently attached prosthetic group that is reoxidized by the SdhB
      relay rather than released. The net activity SdhA enables is therefore
      kept at GO:0000104 succinate dehydrogenase activity (acceptor
      unspecified), consistent with the orthologous flavoprotein reviews, and
      this more specific half-reaction term is kept as non-core.
