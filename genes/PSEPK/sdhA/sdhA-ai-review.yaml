- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Succinate dehydrogenase catalyses the succinate-to-fumarate step of the TCA cycle; this is a core biological process for SdhA.
    action: ACCEPT
    reason: Supported by UniProt pathway annotation (tricarboxylic acid cycle; fumarate from succinate, step 1/1) and conserved enzyme function.
- term:
    id: GO:0008177
    label: succinate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The complete quinone-coupled reaction (succinate + quinone = fumarate + quinol, EC 1.3.5.1) is an activity of the assembled SdhABCD complex; SdhA performs the succinate-oxidation half and contributes to the holoenzyme activity.
    action: MODIFY
    reason: >-
      SdhA performs the FAD-dependent succinate-oxidation half-reaction, but
      quinone reduction requires the SdhB iron-sulfur relay and the SdhC/SdhD
      quinone site, so no single subunit enables GO:0008177. The essence of the
      row (SdhA is a succinate dehydrogenase) is sound, so it is modified to the
      parent GO:0000104 succinate dehydrogenase activity, which SdhA does enable;
      the holoenzyme relationship is recorded as contributes_to_molecular_function
      GO:0008177 in core_functions. This is the same treatment given to the
      orthologous flavoprotein subunits (human SDHA, S. pombe sdh1).
    proposed_replacement_terms:
    - id: GO:0000104
      label: succinate dehydrogenase activity
    supported_by:
    - reference_id: file:PSEPK/sdhA/sdhA-deep-research-openscientist.md
      supporting_text: From the reduced flavin, electrons pass one at a time to the iron–sulfur clusters of the partner subunit SdhB and ultimately reduce the membrane quinone pool.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: SdhA participates in electron transfer, passing electrons abstracted from succinate via FAD toward the iron-sulfur clusters of SdhB and the quinone pool.
    action: KEEP_AS_NON_CORE
    reason: The reduced covalent FAD passes electrons on to the SdhB clusters, so SdhA takes part in electron transfer, but it is an enzyme rather than an electron carrier and the term is not a parent of succinate dehydrogenase activity. Peripheral to the core catalytic role; kept as non-core.
- term:
    id: GO:0009061
    label: anaerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: This subunit is the forward/aerobic succinate dehydrogenase flavoprotein (TIGR01816 sdhA_forward), not the fumarate reductase used in anaerobic respiration.
    action: MARK_AS_OVER_ANNOTATED
    reason: UniProt notes that two distinct FAD enzymes interconvert fumarate and succinate, with fumarate reductase (FrdA) used in anaerobic growth and succinate dehydrogenase used in aerobic growth. The forward SdhA is assigned to aerobic respiration; this TreeGrafter-propagated anaerobic respiration term reflects the broader SdhA/FrdA family and over-annotates the aerobic SdhA.
