taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Flavoprotein (catalytic) subunit of succinate dehydrogenase (respiratory Complex II) in Pseudomonas putida KT2440. SdhA carries a covalently bound FAD cofactor and the succinate/fumarate active site, catalysing the oxidation of succinate to fumarate with transfer of electrons into the membrane quinone pool (EC 1.3.5.1). This reaction couples the tricarboxylic acid (TCA) cycle to the aerobic respiratory electron transport chain. SdhA forms the soluble catalytic head of the four-subunit enzyme together with the iron-sulfur subunit SdhB (PP_4190) and the membrane anchor subunits SdhD (PP_4192) and SdhC (PP_4193), to which it is peripherally attached on the cytoplasmic face of the inner (plasma) membrane. FAD incorporation (flavinylation) depends on the accessory assembly factor SdhE.
existing_annotations:
- term:
    id: GO:0000104
    label: succinate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: SdhA is the flavoprotein catalytic subunit of succinate dehydrogenase (Complex II); succinate dehydrogenase activity is its core molecular function.
    action: ACCEPT
    reason: Supported by family/domain assignment (NCBIfam TIGR01816 sdhA_forward, Pfam FAD_binding_2 and Succ_DH_flav_C, FRD/SDH subfamily), the covalent 8alpha-FAD histidine, and 70% identity to the characterized E. coli SdhA with conserved catalytic residues. SdhA itself oxidizes succinate at its flavin site and passes the electrons on to the SdhB relay, i.e. succinate + acceptor = fumarate + reduced acceptor. This is the subunit-level core function; the complete quinone-coupled reaction (GO:0008177) is a complex activity to which SdhA contributes.
    supported_by:
    - reference_id: file:PSEPK/sdhA/sdhA-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: TIGR01816; sdhA_forward
    - reference_id: file:PSEPK/sdhA/sdhA-deep-research-openscientist.md
      supporting_text: The primary function of SdhA is to **oxidize the C4-dicarboxylate succinate to fumarate** at a single, dicarboxylate-specific active site, transferring the two abstracted electrons (as a hydride) onto a **covalently bound FAD cofactor**
