id: Q88FP9
gene_symbol: PP_4040
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_4040 encodes a small predicted vicinal-oxygen-chelate (VOC) domain protein.
  Its sequence is assigned broadly to the glyoxalase/bleomycin-resistance/
  dioxygenase superfamily, but no substrate, catalytic reaction, metal
  dependence, or physiological role has been established for Q88FP9.
existing_annotations: []
references:
  - id: file:PSEPK/PP_4040/PP_4040-uniprot.txt
    title: UniProtKB entry for PP_4040 (Q88FP9)
    findings:
      - supporting_text: 'SubName: Full=Enzyme of the glyoxalase family'
      - supporting_text: 'PANTHER; PTHR33993:SF1; GLYOXALASE FAMILY PROTEIN; 1.'
      - supporting_text: 'DOMAIN          9..116'
      - supporting_text: 'PE   4: Predicted'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        The exact Q88FP9 record supports only a predicted single-VOC-domain
        glyoxalase-family protein. It supplies no EC, Rhea, pathway, GO, or
        residue-level catalytic assignment.
  - id: file:interpro/panther/PTHR33993/PTHR33993-metadata.yaml
    title: PANTHER PTHR33993 family metadata
    findings:
      - statement: >-
          The parent family spans proteins associated with several secondary-
          metabolism and possible detoxification roles, so family membership
          alone is not substrate-specific evidence.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Used to establish the breadth of the parent family, not to infer a
        molecular function for Q88FP9.
core_functions: []
proposed_new_terms: []
suggested_questions:
  - question: >-
      What substrate and divalent metal, if any, are used by the PP_4040 VOC
      domain protein in vivo?
  - question: >-
      Does PP_4040 participate in methylglyoxal detoxification, secondary-
      metabolite chemistry, or a different VOC-superfamily reaction?
suggested_experiments:
  - description: >-
      Purify Q88FP9 and screen glyoxalase-I hemithioacetal, bleomycin-resistance,
      fosfomycin-resistance, and representative aromatic-ring-cleavage
      substrates across a divalent-metal panel.
    experiment_type: biochemical substrate and metal screen
  - description: >-
      Compare a PP_4040 deletion with gloA and gloB mutants during methylglyoxal
      challenge using growth, methylglyoxal, S-lactoylglutathione, and D-lactate
      measurements.
    experiment_type: genetic and targeted-metabolomics analysis
