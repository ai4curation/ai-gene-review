  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for PvdA, the ornithine N5-monooxygenase of pyoverdine biosynthesis.
  This entry has a single GOA term, so the cohort's annotation-poorest gene is a fair test of the
  model unaided. ProTrek identifies the enzyme class and the siderophore context correctly and then
  names the wrong siderophore three times: pyochelin, aerobactin and ferrichrome, never pyoverdine.
  Its free-text channel gets it right at 20.16, naming pyoverdine explicitly. Assessment: 3 paralog
  incorrect (PLI).
