    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 18.19). Pyochelin is the second Pseudomonas siderophore and is built by
      a non-ribosomal peptide synthetase pathway from salicylate and cysteine - it contains no hydroxamate
      and requires no ornithine hydroxylation. PvdA is dedicated to pyoverdine. Right organism, right
      general role (siderophore biosynthesis), wrong siderophore, and the error would be invisible
      to anyone not checking the chemistry.
