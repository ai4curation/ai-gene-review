    label: aerobactin biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 18.08). Aerobactin is an E. coli/Klebsiella hydroxamate siderophore made from
      lysine by the N6-hydroxylase IucD - which is the enzyme ProTrek names at rank 3. The hydroxamate
      chemistry is genuinely shared, so the retrieval has found the right enzyme family; the substrate
      amino acid (lysine versus ornithine) and the product siderophore are both wrong.
    supported_by:
    - reference_id: file:PSEPK/pvdA/pvdA-uniprot.txt
      supporting_text: >-
        Belongs to the lysine N(6)-hydroxylase/L-ornithine N(5)-monooxygenase family
