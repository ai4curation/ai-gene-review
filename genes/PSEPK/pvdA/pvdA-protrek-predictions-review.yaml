  predicted_term:
    id: GO:0047091
    label: L-lysine 6-monooxygenase (NADPH) activity
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 17.76), the molecular-function form of the rank-2 error: L-lysine 6-monooxygenase
      is IucD's activity, not PvdA's. UniProt's own family line for this entry names both members
      of the pair, so the ambiguity is inherited from the family definition; distinguishing them requires
      the substrate specificity that only sequence-level or experimental evidence provides. Three
      consecutive calls in the right family with the wrong substrate is the cohort's clearest single
      example of the substrate-lottery failure.
    supported_by:
    - reference_id: file:PSEPK/pvdA/pvdA-uniprot.txt
      supporting_text: >-
        L-ornithine 5-monooxygenase
