id: Q88M07
gene_symbol: serC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  SerC is a PLP-dependent class-V aminotransferase (EC 2.6.1.52) shared by two biosynthetic
  pathways. It reversibly transaminates 3-phosphohydroxypyruvate in L-serine biosynthesis
  and (R)-3-hydroxy-2-oxo-4-phosphooxybutanoate in DXP-dependent de novo PLP biosynthesis.
  In the vitamin-B6 route it forms 4-(phosphooxy)-L-threonine for the PdxA reaction. Q88M07
  (PP_1768) is a soluble homodimeric SerC-subfamily enzyme; its activities are inferred from
  the characterized Escherichia coli SerC and other SerC/PSAT orthologs, not from direct study
  of the P. putida protein.
existing_annotations:
- term:
    id: GO:0004648
    label: O-phospho-L-serine:2-oxoglutarate transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term captures the phosphoserine aminotransferase reaction.
    action: ACCEPT
    reason: >-
      GO:0004648 matches the phosphoserine reaction (RHEA:14329) assigned by the HAMAP SerC
      rule and the SerC-specific NCBIfam/PIRSF models, and measured on the E. coli ortholog.
      SerC also catalyzes the distinct phosphohydroxythreonine reaction, for which no dedicated
      GO molecular-function term currently exists (proposed below).
    supported_by:
    - reference_id: file:PSEPK/serC/serC-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: HAMAP; MF_00160; SerC_aminotrans_5; 1.
    - reference_id: file:PSEPK/serC/serC-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR01364; serC_1; 1.
    - reference_id: file:PSEPK/serC/serC-deep-research-openscientist.md
      supporting_text: phosphoserine aminotransferase (PSAT; EC 2.6.1.52)
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: SerC is a soluble cytoplasmic metabolic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
