id: Q88EQ0
gene_symbol: bkdB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BkdB is the lipoyl-bearing E2 core of the bacterial branched-chain 2-oxoacid
  dehydrogenase complex. Its lipoyl arm accepts decarboxylated branched-chain
  acyl groups from BkdAA/BkdAB, and its acyltransferase domain transfers those
  groups to coenzyme A before LpdV reoxidizes the reduced lipoyl group.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is compatible with a soluble bacterial BCKDH complex.
    action: KEEP_AS_NON_CORE
    reason: Location is plausible but does not define BkdB's core E2 chemistry.
- term:
    id: GO:0016407
    label: acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: BkdB is an acyltransferase, but the generic acetyltransferase term obscures its branched-chain acyl specificity.
    action: MODIFY
    reason: >-
      Operon context and the PTHR43178:SF5 assignment identify this protein as
      BCKDH E2 rather than a pyruvate-dehydrogenase acetyltransferase.
    proposed_replacement_terms:
    - id: GO:0043754
      label: dihydrolipoamide branched chain acyltransferase activity
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad parent should be replaced by the BCKDH E2-specific acyltransferase term.
    action: MODIFY
    reason: The exact PANTHER subfamily and bkd operon establish a branched-chain lipoamide acyltransferase role.
    proposed_replacement_terms:
