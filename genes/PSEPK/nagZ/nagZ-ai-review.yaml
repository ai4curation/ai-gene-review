id: Q88KZ4
gene_symbol: nagZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  NagZ is a cytoplasmic beta-N-acetylglucosaminidase of peptidoglycan
  recycling. It removes terminal beta-1,4-linked N-acetylglucosamine from
  imported anhydromuropeptides, releasing GlcNAc and anhMurNAc-containing
  products for downstream sugar and peptide salvage.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: NagZ is a glycoside hydrolase, but this parent term is uninformative.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0016231 captures the beta-N-acetylglucosaminidase activity more
      specifically.
- term:
    id: GO:0004563
    label: beta-N-acetylhexosaminidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The activity is correct but a GlcNAc-specific child term is available.
    action: MODIFY
    reason: >-
      The HAMAP assignment, glycoside-hydrolase-3 NagZ subfamily, and pathway
      chemistry support EC 3.2.1.52. PAINT node PTN000766292 supplies the more
      specific GO:0016231 beta-N-acetylglucosaminidase activity.
    proposed_replacement_terms:
    - id: GO:0016231
      label: beta-N-acetylglucosaminidase activity
