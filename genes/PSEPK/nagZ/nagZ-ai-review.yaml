  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: NagZ processes muropeptides after AmpG-mediated import.
    action: ACCEPT
    reason: >-
      Cytoplasmic localization is the specific compartment in which NagZ acts
      on AmpG-imported muropeptides.
    supported_by:
