knowledge_gaps:
- gap_statement: FdeH's biochemical contribution to the shared R13075 step is unknown.
  boundary: >-
    Orthology and locus conservation support pathway participation, but neither
    the cupin fold nor the KEGG co-assignment distinguishes a catalyst from an
    accessory or stabilizing component.
  gap_kind: [BIOLOGY, CURATION]
  status: OPEN
  significance: A molecular-function annotation would be speculative until FdeH is tested independently and with FdeC.
  resolution: Compare R13075 turnover by purified FdeC alone and with FdeH, and test metal binding and catalytic-residue substitutions in FdeH.
  provenance:
  - reference_id: file:PSEPK/PP_3204/PP_3204-bioinformatics/RESULTS.md
    supporting_text: these records do not establish an independent molecular function for FdeH
suggested_questions:
- question: Is PP_3204 catalytic, metal-binding, or an accessory factor for PP_3197 during R13075?
suggested_experiments:
- description: >-
    Reconstitute PP_3197 with and without PP_3204 using the R13075 substrate,
    measuring turnover, metal dependence, complex formation, and product identity.
  experiment_type: biochemical reconstitution and interaction analysis
