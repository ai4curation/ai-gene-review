  supporting_entities:
  - UniProtKB:D8J0X2
  qualifier: involved_in
  review:
    summary: PP_3204 is predicted to be the FdeH component of bacterial naringenin degradation.
    action: NEW
    reason: >-
      PP_3204 maps to K26182/FdeH, shares 57.6% aligned-pair identity and the
      cupin architecture with Hsero_1010 in the Herbaspirillum fde locus, and
      lies in the conserved KT2440 pathway cluster. This supports pathway
      participation without defining an independent catalytic activity.
    supported_by:
    - reference_id: file:PSEPK/PP_3204/PP_3204-bioinformatics/RESULTS.md
      supporting_text: 'KEGG target mapping: `ppu:PP_3204\tko:K26182`'
    - reference_id: file:PSEPK/PP_3204/PP_3204-bioinformatics/RESULTS.md
      supporting_text: 'Pairwise identity over aligned residue pairs: 57.6%'
