id: Q88HZ8
gene_symbol: PP_3204
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3204 encodes a cupin type-2 domain protein in the KT2440
  flavonoid-degradation locus. KEGG assigns it to FdeH orthology group K26182,
  one of two proteins associated with the predicted R13075 dioxygenation and
  A-ring-cleavage step. Its contribution to that reaction is unresolved, so no
  molecular-function term is assigned independently of the FdeC catalyst.
