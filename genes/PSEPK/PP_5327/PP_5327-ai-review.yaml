  qualifier: enables
  review:
    summary: The PstA permease contributes to phosphate transport by the assembled PstSACB complex.
    action: MODIFY
    reason: A single non-catalytic permease subunit contributes to, rather than independently enables, the collective transporter activity.
    proposed_replacement_terms:
