id: Q88C56
gene_symbol: PP_5327
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PstA permease subunit of the Pho-linked PP_5326-PP_5329 high-affinity
  phosphate-import locus. PP_5327 is predicted to partner with PP_5328 in the
  inner membrane and to contribute the phosphate translocation pathway of a
  PstSACB ABC transporter; it does not independently enable the collective
  transporter activity.
