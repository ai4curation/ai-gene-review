id: Q88EX7
gene_symbol: ccmC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmC is an integral membrane heme-handling protein of cytochrome c maturation
  system I. Conserved histidines support direct heme interaction, and CcmC
  promotes covalent loading of the periplasmic heme chaperone CcmE.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: CcmC is an integral inner-membrane protein.
      action: ACCEPT
      reason: This specific location is integral to CcmC's core membrane-associated heme-handling function.
  - term: {id: "GO:0015232", label: heme transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmC handles membrane-associated heme for CcmE loading.
      action: REMOVE
      reason: >-
        This protein's own unreviewed UniProt FUNCTION line repeats the
        historical heme-export model. Genetic and biochemical evidence instead
        identifies CcmC as the component strictly required for heme transfer and
        attachment to CcmE and explicitly questions CcmAB export
        (PMID:10339610); literal transmembrane transporter activity is not
        established.
  - term: {id: "GO:0015886", label: heme transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmC transfers heme within the maturation machinery.
      action: MARK_AS_OVER_ANNOTATED
      reason: The broad transport term obscures the specific CcmE-loading role and can imply unsupported membrane translocation.
  - term: {id: "GO:0016020", label: membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: CcmC is membrane embedded.
      action: MARK_AS_OVER_ANNOTATED
      reason: Redundant, less precise parent of the plasma-membrane annotation.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmC participates specifically in c-type cytochrome biogenesis.
      action: MODIFY
      reason: GO:1903607 better captures the specific maturation process.
      proposed_replacement_terms:
        - {id: "GO:1903607", label: cytochrome c biosynthetic process}
  - term: {id: "GO:0020037", label: heme binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmC binds heme for transfer to CcmE.
      action: ACCEPT
      reason: Conserved CcmC family features and its CcmE-loading role support heme binding as the core MF.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/ccmC/ccmC-uniprot.txt
    title: UniProtKB entry for CcmC (Q88EX7)
    findings:
      - statement: The record supplies membrane topology and CcmC-family evidence.
  - id: file:PSEPK/ccmC/ccmC-goa.tsv
    title: QuickGO GOA annotations for ccmC
    findings:
      - statement: Complete fetched annotation set reviewed here.
  - id: PMID:10339610
    title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein, which may function independently of the ABC-transporter CcmAB.
aliases: [Q88EX7, PP_4325]
core_functions:
  - description: Binds membrane-associated heme and supports its covalent loading onto CcmE.
    molecular_function: {id: "GO:0020037", label: heme binding}
    directly_involved_in:
      - {id: "GO:1903607", label: cytochrome c biosynthetic process}
    locations:
      - {id: "GO:0005886", label: plasma membrane}
    supported_by:
      - reference_id: PMID:10339610
        supporting_text: it is the only Ccm protein that is strictly required for heme transfer and attachment to CcmE.
suggested_questions:
  - question: Which conserved CcmC residues coordinate heme during loading of PSEPK CcmE?
suggested_experiments:
  - description: Quantify holo-CcmE formation after mutating predicted CcmC heme-coordination residues.
    experiment_type: heme-loading assay
