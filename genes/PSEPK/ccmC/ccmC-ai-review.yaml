  label: Pseudomonas putida KT2440
description: ccmC encodes a membrane heme-handling protein of cytochrome c maturation system I. Binds
  heme in the periplasmic WWD site and positions it for covalent loading onto the CcmE chaperone. Structural
  and biochemical studies support heme handling by CcmABCD, while the membrane-crossing route and its
  energetic coupling remain disputed. Its mechanistic assignment in Pseudomonas putida KT2440 is inferred
  from conserved features and characterized system I orthologs.
