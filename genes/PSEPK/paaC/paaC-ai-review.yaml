  title: Bacterial phenylalanine and phenylacetate catabolic pathway revealed.
  findings:
  - statement: The PaaABC(D)E multicomponent oxygenase is a ring 1,2-phenylacetyl-CoA epoxidase.
    supporting_text: PaaABC(D)E thus functions as a ring 1,2-phenylacetyl-CoA epoxidase.
