  findings:
  - statement: PaaC is the structural beta subunit of the PaaAC core.
    supporting_text: >-
      This structure shows that PaaA is the catalytic subunit, whereas PaaC
      is the structural subunit.
    reference_section_type: RESULTS
  - statement: PaaA, PaaB, PaaC and PaaE are all required for activity in vitro.
    supporting_text: >-
      In vitro reconstitution of the oxygenase subunits showed that each of
      the PaaA, B, C, and E subunits are necessary for catalysis, whereas
      PaaD is not essential.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structural and reconstitution study of the E. coli
      ortholog complex.
- id: file:PSEPK/paaC/paaC-deep-research-openscientist.md
  title: OpenScientist deep research for PSEPK paaC
  findings:
  - statement: Ortholog evidence identifies PaaC as the structural beta subunit.
    supporting_text: >-
      PaaAC forms a catalytic core with a monooxygenase fold with PaaA being
      the catalytic α subunit and PaaC, the structural β subunit
    reference_section_type: RESULTS
  - statement: Direct structural work was not performed on the KT2440 target.
    supporting_text: >-
      Direct biochemical/structural characterization has been performed
      largely on *E. coli* (and *Azoarcus/Thermus/Aromatoleum*) orthologs; the
      specific *P. putida* KT2440 PaaC has been characterized chiefly by
      genomic/regulatory studies and by orthology, not by its own crystal
      structure.
    reference_section_type: CONCLUSIONS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The exact-target domain and locus context support the structural-beta
      assignment, but the direct biochemical and structural evidence is from
      orthologous systems. Mechanistic, regulatory, and localization details
      beyond the curated subunit role were not imported.
