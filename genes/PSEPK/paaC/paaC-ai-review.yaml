id: Q88HS7
gene_symbol: paaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaC is the predicted structural beta subunit of the soluble PaaABCE ring
  1,2-phenylacetyl-CoA epoxidase system in Pseudomonas putida KT2440. It is a
  ferritin-like PaaA/PaaC-family protein that pairs with the catalytic PaaA
  subunit to form the oxygenase core and contributes to NADPH- and
  oxygen-dependent epoxidation of the aromatic ring of phenylacetyl-CoA
  during aerobic phenylacetate catabolism.
existing_annotations:
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Correct expected location for the soluble epoxidase system.
    action: ACCEPT
    reason: >-
      PaaC has no predicted signal peptide or transmembrane segment, acts on
      cytoplasmic CoA thioesters, and the orthologous E. coli PaaAC subcomplex
      is a soluble protein complex.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        However, when PaaA and PaaC were coexpressed, they formed a well
        behaved soluble complex.
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct process annotation for the PaaC epoxidase subunit.
    action: ACCEPT
    reason: >-
      Q88HS7 is classified in the PANTHER 1,2-phenylacetyl-CoA epoxidase
      subunit C subfamily and the NCBIfam PaaC family (TIGR02158), and lies in
      the paa catabolic locus. The orthologous PaaABC(D)E complex catalyzes
      the first ring-attack step of aerobic phenylacetate catabolism.
    supported_by:
    - reference_id: file:PSEPK/paaC/paaC-uniprot.txt
      supporting_text: 'PANTHER; PTHR30458:SF0; 1,2-PHENYLACETYL-COA EPOXIDASE, SUBUNIT C'
    - reference_id: PMID:20660314
      supporting_text: PaaABC(D)E thus functions as a ring 1,2-phenylacetyl-CoA epoxidase.
    - reference_id: file:PSEPK/paaC/paaC-deep-research-openscientist.md
      supporting_text: >-
        PaaAC forms a catalytic core with a monooxygenase fold with PaaA being
        the catalytic α subunit and PaaC, the structural β subunit
- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct activity at complex level, but not independently enabled by PaaC alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PaaC is the structural (non-catalytic) beta subunit of the PaaABCE
      epoxidase system; in reconstitution experiments with the E. coli
      orthologs PaaA, B, C and E were each required for activity. The
      inherited enables qualifier overstates the isolated subunit; the
      core-function model instead records that PaaC contributes to the
      complex activity.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        This structure shows that PaaA is the catalytic subunit, whereas PaaC
        is the structural subunit.
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
- term:
    id: GO:0062077
    label: phenylacetyl-CoA 1,2-epoxidase complex
  evidence_type: ISS
  original_reference_id: PMID:21247899
  qualifier: part_of
  review:
    summary: Missing complex membership for the structural beta subunit.
    action: NEW
    reason: >-
      Q88HS7 is the PaaC ortholog (PANTHER subunit C subfamily). E. coli PaaC
      forms stable PaaAC, PaaBC and PaaABC subcomplexes, and the Pseudomonas
      sp. Y2 PaaC copurified with PaaA, PaaB and PaaE as the epoxidase.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        We expressed the subunits PaaA, B, C, D, and E of the PA-CoA oxygenase
        and showed that PaaABC, PaaAC, and PaaBC form stable subcomplexes that
        can be purified.
    - reference_id: PMID:20660314
      supporting_text: Subunits PaaB, PaaC, and PaaE copurified with PaaA
