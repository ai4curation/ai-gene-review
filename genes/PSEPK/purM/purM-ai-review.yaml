- term:
    id: GO:0046084
    label: adenine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: PurM contributes the conserved AIR-synthesis step to adenine biosynthesis under established
      GO usage.
    action: ACCEPT
    reason: 'The term is broader than a terminal free-base-release enzyme: current experimental GO:0046084
      annotations include Candida ADE5:7 (A0A1D8PE67; PMID:17600079), an AIR-synthetase/GARS fusion, as
      well as yeast ADE8 and fission-yeast ade7. The Candida primary abstract reports an adenine-deficient
      deletion mutant; UniProt independently confirms its AIRS activity. PurM performs that conserved
      ring-building step. The comparator convention and adenine-salvage child term argue against restricting
      GO:0046084 to free-base release. A local IMP-module boundary does not negate biological participation.'
    supported_by:
    - reference_id: PMID:17600079
      supporting_text: resulting mutants were adenine deficient
    - reference_id: file:PSEPK/purM/purM-uniprot.txt
      supporting_text: Purine metabolism; IMP biosynthesis via de novo pathway
