description: PurM is phosphoribosylformylglycinamidine cyclo-ligase (AIR synthetase), which cyclizes FGAM
  to AIR during de novo IMP synthesis. It is a separate bacterial enzyme rather than the PurD-like activity
  transferred from a eukaryotic trifunctional PANTHER grouping.
