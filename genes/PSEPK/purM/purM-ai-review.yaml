taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PurM is a soluble cytoplasmic phosphoribosylformylglycinamidine cyclo-ligase (AIR synthetase)
  that uses ATP to cyclize FGAM to AIR during de novo purine nucleotide synthesis. It supplies the
  purine-ring pathway leading to IMP and subsequently adenine and guanine nucleotides.

existing_annotations:
- term:
    id: GO:0004637
    label: phosphoribosylamine-glycine ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The GARS/PurD molecular activity belongs to a different catalytic domain of the fused eukaryotic
      family.
    action: REMOVE
    reason: Q88MA9 contains AIRS and AIRS_C domains (Pfam PF00586/PF02769) with PurM-specific IPR004733.
      It is the standalone FGAM cyclase, whereas phosphoribosylamine-glycine ligation requires the distinct
      GARS/PurD domain present in bifunctional ADE5,7 or trifunctional GART. PTN002237315 therefore conflates
      different catalytic portions of a fused family for this molecular function; the shared pathway annotations
      do not inherit that defect.
    supported_by:
    - reference_id: file:PSEPK/purM/purM-uniprot.txt
      supporting_text: Pfam; PF00586; AIRS; 1.
    - reference_id: file:PSEPK/purM/purM-uniprot.txt
      supporting_text: Pfam; PF02769; AIRS_C; 1.
    - reference_id: file:projects/TREEGRAFTER/rereview-2026-09-20/cache-reports/openscientist-commissioned-review-brief-revi-1a1f035d.md
      supporting_text: '| 5 | AIR formation | PurM | GART (AIRS domain) | ATP-dependent cyclo-ligase;
        conserved dimer (PMID: 26515187) |'
