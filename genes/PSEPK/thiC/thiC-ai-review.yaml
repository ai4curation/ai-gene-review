- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000100976
  review:
    summary: HAMAP-modelled active-site divalent metal (Zn2+) ligated by conserved His430 and His494; the
      physiological identity of the metal is uncertain.
    action: KEEP_AS_NON_CORE
    reason: HAMAP MF_00089 places Zn(2+) binding features at positions 430 and 494 of the KT2440 sequence,
      reflecting a conserved second metal site adjacent to the AIR-binding pocket that is part of the ThiC
      catalytic architecture. However, the family's own representative structure (Arabidopsis ThiC, PDB
      4S28) was solved with Fe rather than Zn at this site, so zinc may not be the physiological metal.
      The metal site is a genuine, conserved property of the protein but is peripheral to the core
      HMP-P synthase activity as captured in GO, and the specific metal identity is not established for
      the KT2440 enzyme; it is therefore kept as non-core rather than accepted.
