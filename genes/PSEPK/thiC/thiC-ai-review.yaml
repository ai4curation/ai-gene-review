suggested_questions:
- question: Is the conserved active-site divalent metal of KT2440 ThiC zinc or iron in vivo, and does
    its identity depend on growth conditions or metal availability?
- question: Is thiC (PP_4922) expression in KT2440 controlled by a ThDP riboswitch, as in enteric
    bacteria, and is the gene essential in the absence of exogenous thiamine?
suggested_experiments:
- description: Anaerobically purify and reconstitute KT2440 ThiC, assay AIR-dependent HMP-P and
    5'-deoxyadenosine formation, and determine the active-site metal by ICP-MS.
  experiment_type: in vitro enzyme assay with metal analysis
- description: Test growth of a KT2440 thiC deletion mutant on minimal medium with and without thiamine
    or HMP supplementation.
  experiment_type: genetic auxotrophy test
