id: Q88DA5
gene_symbol: thiC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: ThiC (PP_4922) is the phosphomethylpyrimidine synthase (HMP-P synthase, EC 4.1.99.17)
  of Pseudomonas putida KT2440, a soluble cytoplasmic radical S-adenosyl-L-methionine (SAM) enzyme of
  the ThiC family. It converts the purine-pathway intermediate 5-aminoimidazole ribonucleotide (AIR)
  into 4-amino-2-methyl-5-(phosphooxymethyl)pyrimidine (HMP-P), the pyrimidine moiety of thiamine,
  releasing formate, CO, 5'-deoxyadenosine and L-methionine. Catalysis depends on a C-terminal
  [4Fe-4S] cluster ligated by three cysteines (Cys574, Cys577, Cys582) and an exchangeable SAM, which
  is reductively cleaved to a 5'-deoxyadenosyl radical that initiates a complete rearrangement of the
  AIR imidazole ribotide; a second, active-site divalent metal (modelled as Zn2+ by HAMAP) is bound by
  conserved residues near the substrate pocket. The enzyme is predicted to act as a homodimer. HMP-P
  is subsequently phosphorylated to HMP-PP by ThiD and coupled to the thiazole moiety by ThiE, so ThiC
  catalyses the committed first step of the pyrimidine branch of de novo thiamine diphosphate
  biosynthesis. All functional knowledge for the KT2440 protein is inferred from the well-conserved
  ThiC family (HAMAP MF_00089); the enzyme itself has not been characterised biochemically.
