  review:
    summary: ThiC catalyses the formation of HMP-P, the pyrimidine moiety of thiamine, a direct step of
      de novo thiamine biosynthesis.
    action: ACCEPT
    reason: The product of ThiC, HMP-P, is incorporated into thiamine (after ThiD phosphorylation and
      ThiE coupling), so ThiC performs a catalytic step of thiamine biosynthesis rather than merely
      being required for it. The row is supported by the ThiC-family InterPro signatures, the PAINT
      IBD on GO:0009228 at the family root node (PTN000777474, seeded by Arabidopsis THIC, E. coli and
      Salmonella ThiC) and the HAMAP rule. GO:0009228 is not an ancestor of GO:0009229 (thiamine
      diphosphate biosynthetic process); both are correct and complementary, and the module uses
      GO:0009228 as the parent process grounding.
    supported_by:
