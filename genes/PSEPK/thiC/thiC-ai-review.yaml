  - UniPathway:UPA00060
  review:
    summary: ThiC catalyses the first committed step of the pyrimidine branch of de novo thiamine
      diphosphate (ThDP) biosynthesis.
    action: ACCEPT
    reason: In bacteria the de novo pathway terminates in ThDP (ThiE produces thiamine monophosphate and
      ThiL phosphorylates it to ThDP), and HMP-P made by ThiC is the pyrimidine precursor of that
      product. The HAMAP/UniPathway assignment (UPA00060, thiamine diphosphate biosynthesis) is
      appropriate for a bacterial ThiC, and this is the specific process grounding used by the thiamine
      diphosphate biosynthesis module.
