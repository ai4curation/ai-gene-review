id: Q88NX8
gene_symbol: glpK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  glpK (PP_1075) encodes glycerol kinase (EC 2.7.1.30), an ATP-dependent enzyme of the FGGY carbohydrate
  kinase family that phosphorylates glycerol to sn-glycerol 3-phosphate (glycerol + ATP = sn-glycerol
  3-phosphate + ADP + H+). In Pseudomonas putida KT2440 it is encoded in the glpFKRD gene cluster, which
  is repressed by the sn-glycerol 3-phosphate-responsive regulator GlpR. The kinase performs the first
  intracellular step of glycerol catabolism: it traps glycerol that enters through the GlpF facilitator,
  and its product is oxidized by the quinone-linked GlpD dehydrogenase to dihydroxyacetone phosphate.
  Because sn-glycerol 3-phosphate is also the GlpR inducer, changes in GlpK-dependent G3P formation help
  control the switch from non-growing to growing cells on glycerol. Cell-extract kinase assays and glpFK
  overexpression support this catalytic assignment in KT2440. By homology to the characterized Escherichia
  coli enzyme it is a soluble cytosolic protein with an actin-like two-domain ATPase fold, and the conserved
  HAMAP rule predicts allosteric inhibition by fructose 1,6-bisphosphate.
