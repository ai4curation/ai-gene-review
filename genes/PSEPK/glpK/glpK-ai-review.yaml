- term:
    id: GO:0006072
    label: glycerol-3-phosphate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005999
  review:
    summary: >-
      InterPro2GO (GO_REF:0000002) mapping from IPR005999 glycerol kinase;
      GlpK produces sn-glycerol 3-phosphate.
    action: MODIFY
    reason: >-
      GO:0006072 is defined as "The chemical reactions and pathways involving
      glycerol-3-phosphate, a phosphoric monoester of glycerol." The term is
      true but more general than the evidence: GlpK's reaction forms
      sn-glycerol 3-phosphate, which is the is_a child GO:0046167
      glycerol-3-phosphate biosynthetic process ("The chemical reactions and
      pathways resulting in the formation of glycerol-3-phosphate"). This
      mirrors the glpD review, where the same term is refined on the substrate
      side to GO:0046168 glycerol-3-phosphate catabolic process. The refined
      term is about the product only; it does not claim a role in
      phospholipid-precursor supply, and GO:0019563 glycerol catabolic process
      remains the core process. In-repo corroboration: PAINT itself assigns
      GO:0046167 by IBD to the eukaryotic glycerol kinase node PTN000023394 of
      PTHR10196, seeded by human GK P32189, mouse Gk and the Drosophila Gk1/Gk2
      genes. That node does not cover the bacterial GlpK clade, so the IBD is
      not propagated to this P. putida protein; it shows only that the curators
      read glycerol kinase activity as glycerol-3-phosphate biosynthesis.
    proposed_replacement_terms:
    - id: GO:0046167
      label: glycerol-3-phosphate biosynthetic process
    supported_by:
    - reference_id: file:PSEPK/glpK/glpK-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=glycerol + ATP = sn-glycerol 3-phosphate + ADP + H(+);
    - reference_id: file:interpro/panther/PTHR10196/PTHR10196-paint.tsv
      supporting_text: "PTHR10196\tPTN000023394\tGO:0046167\tP\tIBD\tfalse"
    - reference_id: PMID:25827416
      supporting_text: Since the physiological agonist of GlpR is G3P, the arrangement of metabolic
        and regulatory components at this checkpoint merges a positive feedback loop with a
        nonlinear transcriptional response
