suggested_questions:
- question: >-
    Is KT2440 GlpK inhibited by fructose 1,6-bisphosphate as the HAMAP rule
    predicts, given that Pseudomonas lacks a glucose PTS EIIA-Glc and uses the
    Entner-Doudoroff route, so that inducer exclusion as in E. coli cannot
    apply?
suggested_experiments:
- experiment_type: enzyme kinetics
  description: >-
    Purify KT2440 GlpK and measure glycerol kinase kinetics and inhibition by
    fructose 1,6-bisphosphate, to test whether the E. coli allosteric control
    is conserved in a bacterium without a glucose PTS.
