    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP binding by DnaJ is not established by its role in an ATP-dependent DnaK
      cycle.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The electronic annotation exceeds the mechanism supported here: DnaJ binds clients
      and stimulates ATP hydrolysis by DnaK, whereas DnaK carries the nucleotide. PMID:1826368
      directly separates those roles in E. coli. Neither ATP-dependent complex formation nor
      absence of a Walker motif establishes a direct DnaJ ATP-binding assay. This is an unsupported
      extension of the co-chaperone role, not proof that every possible DnaJ-nucleotide interaction
      is impossible.'
    supported_by:
    - reference_id: PMID:1826368
      supporting_text: the presence of DnaJ alone leads to an acceleration in the rate of
        hydrolysis of the DnaK-bound ATP.
