  - reference_id: PMID:1826368
    supporting_text: the presence of DnaJ alone leads to an acceleration in the rate of
      hydrolysis of the DnaK-bound ATP.
- description: Binds the protein-folding chaperone DnaK during client handoff and ATPase
    regulation. This is a chaperone-partner interaction inferred from the curated KT2440
    DnaJ architecture/function and E. coli cycle experiments; binding unfolded clients is
    a separate interaction and is not what GO:0051087 denotes.
  molecular_function:
    id: GO:0051087
    label: protein-folding chaperone binding
