  review:
    summary: Correct and specific. DnaJ binds two structural Zn(2+) ions per monomer
      through its cysteine-rich (CR-type) zinc-finger domain (eight coordinating Cys
      residues). Zinc center 1 supports the autonomous chaperone activity and zinc center
      2 is required for interaction with DnaK. This is a specific metal-ion term (no broad
      'metal ion binding' annotation is present in this GOA to down-rank).
    action: ACCEPT
    reason: Two zinc ions per monomer are supported for this type I DnaJ by its
      cysteine-rich architecture and the curated HAMAP cofactor assignment. The
      center-specific functional experiments are comparative, not purified KT2440
      measurements.
    supported_by:
