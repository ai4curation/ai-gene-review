references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: The InterPro method identifies the source of electronic assertions, not
      independent biochemical evidence. The DnaJ ATP-binding claim is over-annotated
      relative to the demonstrated DnaK-activation mechanism.
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
  - statement: UniRule correctly transfers zinc ion binding, consistent with the two
      structural Zn(2+) ions coordinated by the CR-type zinc finger.
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
  - statement: TreeGrafter correctly propagates protein refolding from the DnaJ/Hsp40
      family tree.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined methods correctly assign cytoplasmic localization for this
      soluble chaperone.
- id: file:PSEPK/dnaJ/dnaJ-uniprot.txt
  title: UniProt entry Q88DU3 (DNAJ_PSEPK)
  findings:
  - statement: 'HAMAP-based comparative assignment, not a direct KT2440 assay: DnaJ participates
      in the response to heat and hyperosmotic shock by preventing aggregation of stress-denatured
      proteins and disaggregating them, including in an autonomous, DnaK-independent fashion.'
  - statement: 'HAMAP-based comparative assignment, not a direct KT2440 assay: Unfolded proteins
      bind initially to DnaJ; interaction with the DnaJ-bound substrate triggers DnaK to hydrolyze
      ATP and form a stable complex, with GrpE and ATP rebinding completing the iterative folding
      cycle.'
  - statement: 'HAMAP-based comparative assignment, not a direct KT2440 assay: DnaJ is a cytoplasmic
      homodimer that binds two structural Zn(2+) ions per monomer; the J domain is necessary
      and sufficient to stimulate DnaK ATPase activity, and the two zinc centers have distinct
      roles in autonomous chaperone activity and DnaK interaction.'
- id: file:PSEPK/dnaJ/dnaJ-notes.md
  title: Curator notes for dnaJ (Q88DU3)
  findings:
  - statement: Manual notes distinguish curated comparative functional assignments from
      direct KT2440 assays; the current audit supersedes earlier categorical ATP-binding
      and autonomous-disaggregation language.
- id: file:interpro/panther/PTHR43096/PTHR43096-metadata.yaml
  title: PANTHER family PTHR43096 (DnaJ homolog 1, mitochondrial-related) and subfamily
    PTHR43096:SF48 (chaperone protein DnaJ)
  findings:
  - statement: UniProt classifies dnaJ (Q88DU3) in PANTHER family PTHR43096 and subfamily
      PTHR43096:SF48 (CHAPERONE PROTEIN DNAJ), confirming its assignment as a DnaJ/Hsp40
      co-chaperone.
  - statement: The PTHR43096:SF48 subfamily classification corroborates the J-domain
      co-chaperone identity used to support the ATPase activator and chaperone-binding
      functions in this review.
- id: PMID:1826368
  title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase
    activity of DnaK.
  findings:
  - statement: E. coli DnaJ accelerates hydrolysis of DnaK-bound ATP; GrpE instead
      accelerates nucleotide release.
    supporting_text: the presence of DnaJ alone leads to an acceleration in the rate of
      hydrolysis of the DnaK-bound ATP.
    reference_section_type: ABSTRACT
- id: PMID:7937953
  title: The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system
    DnaK, DnaJ, and GrpE.
  findings:
  - statement: The E. coli luciferase reaction separates DnaJ client capture, DnaK ATP
      hydrolysis and GrpE nucleotide release.
    supporting_text: (i) unfolded luciferase binds initially to DnaJ; (ii) upon
      interaction with luciferase-DnaJ, DnaK hydrolyzes its bound ATP, resulting in the
      formation of a stable luciferase-DnaK-DnaJ complex; (iii) GrpE releases ADP from
      DnaK;
    reference_section_type: ABSTRACT
- id: PMID:11162122
  title: Regulation of ATPase and chaperone cycle of DnaK from Thermus thermophilus by the
    nucleotide exchange factor GrpE.
  findings:
  - statement: Thermus provides an explicit limit to extrapolating DnaJ ATPase stimulation
      across bacteria; it is not a negative assay of the reviewed E. coli or Pseudomonas
      protein.
    supporting_text: Here, DnaJ does not stimulate the DnaK-mediated ATP hydrolysis
    reference_section_type: ABSTRACT
core_functions:
- description: The J-domain co-chaperone engages DnaK and stimulates its ATP hydrolysis
    during client capture. For KT2440 this is supported by the curated HAMAP MF_01152
    assignment and comparison with direct E. coli biochemistry, not a purified Q88DU3
    kinetic assay. The Thermus counterexample prevents treating this kinetic role as
    universal to all J proteins.
