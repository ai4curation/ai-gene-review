taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DnaJ is a cytoplasmic type I J-domain co-chaperone in Pseudomonas putida
  KT2440. It has an N-terminal J domain, a cysteine-rich zinc-binding region and
  client-binding regions. Its conserved role is to capture non-native proteins and engage
  DnaK, promoting ATP hydrolysis by DnaK during client capture and folding. Together with
  DnaK and GrpE it supports protein quality control under heat and other proteotoxic
  stresses.
