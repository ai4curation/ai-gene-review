- term:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: CcmG supplies protein-disulfide reducing activity during maturation.
    action: MODIFY
    reason: Protein-disulfide reductase activity is the supported specific descendant. Purified leaderless
      E. coli DsbE weakly reduces insulin; direct apocytochrome/mixed-disulfide kinetics are established
      for R. capsulatus, and the P. aeruginosa study considers a mixed-disulfide physiological substrate.
      These support reductase chemistry without asserting the exact substrate pair has been assayed in
      every species. This KT2440 assignment is an ortholog inference from the frozen family/domain record
      and characterized E. coli or other system I proteins; no direct KT2440 assay is cited.
    supported_by:
    - reference_id: PMID:11843181
      supporting_text: low activity in accelerating the reduction of insulin
    - reference_id: PMID:28634234
      supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
        a mixed disulfide bond
    proposed_replacement_terms:
    - id: GO:0015035
      label: protein-disulfide reductase activity
