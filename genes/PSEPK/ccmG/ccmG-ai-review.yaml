  label: Pseudomonas putida KT2440
description: ccmG encodes a membrane-anchored periplasmic thioredoxin of cytochrome c maturation system
  I. Provides periplasmic protein-disulfide reducing activity to the cytochrome c maturation pathway.
  Its mechanistic assignment in Pseudomonas putida KT2440 is inferred from conserved features and characterized
  system I orthologs.
