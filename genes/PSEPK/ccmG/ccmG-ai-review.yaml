- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: CcmG is anchored to the inner membrane with a periplasmic thioredoxin domain.
    action: ACCEPT
    reason: 'The target-specific DsbE family/signature assignments support transfer of the characterized
      CcmG architecture: an N-terminal membrane tether and a periplasm-facing thioredoxin domain. The
      frozen target record has no explicit transmembrane feature; its ARBA-only location prose is not
      used. Periplasmic orientation comes from conserved CcmG topology evidence, not from a generic redoxin
      fold or a hydrophobic segment alone. This KT2440 location is an explicit conserved-architecture
      inference, not a direct native KT2440 localization assay.'
    supported_by:
    - &id001
      reference_id: file:PSEPK/ccmG/ccmG-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR004799; Periplasmic_diS_OxRdtase_DsbE.
