  title: Structural and functional characterization of CcmG from Pseudomonas aeruginosa, a key component
    of the bacterial cytochrome c maturation apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' This source does not directly assay the KT2440 target; mechanistic use here is comparative
      ortholog inference.'
- id: PMID:28634234
  title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures
    stereo-specificity during cytochrome c maturation.
  findings:
  - statement: R. capsulatus CcmG reduces apocytochrome disulfides and resolves CcmH-apocytochrome mixed
      disulfides.
    supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
      a mixed disulfide bond
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Refreshed full text read. Direct thiol-exchange kinetics and complex interactions concern
      R. capsulatus, whose CcmH and CcmI are separate. Exact substrate and cysteine-partner assignments
      cannot be silently treated as direct E. coli or KT2440 evidence. CcmH stereospecific mixed-disulfide
      chemistry differs from calling CcmH a demonstrated net reductase. This source does not directly
      assay the KT2440 target; mechanistic use here is comparative ortholog inference.
- id: PMID:11843181
  title: 'Structural and redox properties of the leaderless DsbE (CcmG) protein: both active-site cysteines
    of the reduced form are involved in its function in the Escherichia coli periplasm.'
  findings:
  - statement: Purified leaderless E. coli DsbE has weak insulin-disulfide reducing activity.
    supporting_text: low activity in accelerating the reduction of insulin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly reports the purified N-terminally truncated construct and insulin
      reduction. This supports reductase activity, but is not a direct assay of the physiological apocytochrome
      substrate. This source does not directly assay the KT2440 target; mechanistic use here is comparative
      ortholog inference.
