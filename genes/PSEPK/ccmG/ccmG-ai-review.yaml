id: Q88EY1
gene_symbol: ccmG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  CcmG, also called DsbE, is a membrane-anchored periplasmic thioredoxin of
  cytochrome c maturation system I. It supplies reducing equivalents during
  preparation of apocytochrome CXXCH motifs, acting through direct reduction of
  apocytochrome disulfides and/or resolution of CcmH-apocytochrome
  mixed-disulfide intermediates depending on the system I architecture.
existing_annotations:
  - term: {id: "GO:0005886", label: plasma membrane}
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: CcmG is anchored to the inner membrane with a periplasmic thioredoxin domain.
      action: ACCEPT
      reason: The membrane anchor and periplasmic catalytic domain are integral to CcmG function, and complement the periplasm annotation.
  - term: {id: "GO:0015036", label: disulfide oxidoreductase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: CcmG supplies thiol-reducing activity to apocytochrome maturation, directly and through CcmH-linked intermediates.
      action: ACCEPT
      reason: Biochemical studies support both direct apocytochrome reduction and resolution of CcmH-apocytochrome mixed disulfides (PMID:20544959; PMID:28634234).
  - term: {id: "GO:0016491", label: oxidoreductase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CcmG is an oxidoreductase.
      action: MARK_AS_OVER_ANNOTATED
      reason: This broad parent adds no information beyond disulfide oxidoreductase activity.
  - term: {id: "GO:0017004", label: cytochrome complex assembly}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: CcmG prepares apocytochromes for c-type cytochrome maturation.
      action: MODIFY
      reason: GO:1903607 directly names biosynthesis of the c-type cytochrome product, whereas GO:0017004 describes assembly of a cytochrome-containing complex.
      proposed_replacement_terms:
        - {id: "GO:1903607", label: cytochrome c biosynthetic process}
  - term: {id: "GO:0030288", label: outer membrane-bounded periplasmic space}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    review:
      summary: The catalytic thioredoxin domain of CcmG faces the periplasm.
      action: ACCEPT
      reason: The periplasmic location is function-defining for CcmG reduction of exported apocytochrome substrates.
  - term: {id: "GO:0045454", label: cell redox homeostasis}
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: CcmG contributes to a localized periplasmic redox pathway.
      action: KEEP_AS_NON_CORE
      reason: Biologically compatible, but broader than its specific apocytochrome-reduction role.
