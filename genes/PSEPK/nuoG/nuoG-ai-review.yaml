description: 'Nuog is the large iron-sulfur electron-relay subunit in the peripheral arm of the proton-translocating respiratory complex I (NDH-1) in Pseudomonas putida KT2440. It is encoded in the single contiguous nuoA-N locus PP_4119-PP_4131. The assembled complex oxidizes NADH, reduces the quinone pool, and couples electron transfer to proton translocation across the bacterial plasma membrane.'
