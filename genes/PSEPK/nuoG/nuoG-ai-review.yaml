  label: Pseudomonas putida KT2440
description: >-
  NuoG (PP_4124) is the largest subunit (complex I 75 kDa family; NDUFS1/Nqo3
  type) of the peripheral NADH dehydrogenase module of the proton-pumping
  NADH:quinone oxidoreductase (NDH-1, respiratory complex I). Its N-terminal
  region binds one [2Fe-2S] and three [4Fe-4S] clusters that relay electrons
  from the FMN of NuoF along the peripheral arm towards NuoI and the terminal
  cluster N2 of NuoB. Its C-terminal region is homologous to the
  molybdopterin-binding domains of formate dehydrogenase/nitrate
  reductase-type enzymes, but complex I carries no molybdenum cofactor. NuoG
  is a peripheral subunit on the cytoplasmic side of the inner membrane and
  contributes to energy-conserving NADH:quinone oxidoreduction coupled to
  proton translocation.
existing_annotations:
  - term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: Generic NADH dehydrogenase activity; the complex-level activity is GO:0008137.
      action: MODIFY
      source_defects:
      - defect_type: WRONG_QUALIFIER
        resource: GO_CENTRAL
        slot: Qualifier
        requested_change: REPOINT
        asserted_value: enables
        corrected_value: contributes_to
        confidence: PROBABLE
        explanation: >-
          NADH dehydrogenase activity (GO:0003954), refined in this review to GO:0008137, is a
          reaction of the assembled respiratory complex I (NDH-1). nuoG is a subunit that
          contributes to that activity and does not catalyse it on its own, so by the GO convention
          for complex subunits this IEA row (assigned by TreeGrafter) should carry contributes_to
          rather than enables.
      reason: >-
        Correct but general. NuoG has no NADH or FMN site (FMN is in NuoF in the
        E. coli ortholog); it contributes its iron-sulfur relay to the
        proton-coupled NADH:ubiquinone oxidoreductase activity of complex I,
        GO:0008137, an is_a descendant of GO:0003954 already carried by this gene.
      proposed_replacement_terms:
        - id: GO:0008137
          label: NADH dehydrogenase (ubiquinone) activity
      supported_by:
        - reference_id: file:PSEPK/nuoG/nuoG-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: NDH-1 shuttles electrons from NADH, via FMN and iron-sulfur
            (Fe-S) centers, to quinones in the respiratory chain.
        - reference_id: PMID:18603533
          supporting_text: The primary electron acceptor of complex I is a
            noncovalently bound flavin mononucleotide (FMN) located in the NuoF
            subunit.
  - term:
