suggested_questions:
  - question: >-
      Does P. putida KT2440 NuoG carry an off-pathway [4Fe-4S] cluster N7 like
      E. coli NuoG, and does its molybdopterin-like C-terminal domain contribute to
      complex stability?
suggested_experiments:
  - description: >-
      Construct a clean nuoG deletion and complemented strains in KT2440 and
      measure membrane piericidin-sensitive NADH:quinone oxidoreductase activity,
      EPR-detectable Fe-S clusters, respiratory growth and proton-motive force.
    experiment_type: gene deletion with biochemical phenotyping
