suggested_questions:
- question: >-
    What reduces the PP_0427 di-iron centre in vivo (NADH directly, as proposed for human COQ7,
    or a dedicated reductase), and would the NADH-specific term GO:0160224 apply to bacterial
    Coq7?
- question: >-
    Does PP_0427 join a soluble Ubi complex in place of UbiF, or act only at the membrane?
suggested_experiments:
- description: >-
    Express PP_0427 in an E. coli ubiF deletion strain and score UQ-8 restoration; delete
    PP_0427 in KT2440 and quantify DMQ-9 accumulation; purify the protein, reconstitute the
    di-iron centre and test NADH- versus NADPH-driven hydroxylation of a DMQ analogue.
