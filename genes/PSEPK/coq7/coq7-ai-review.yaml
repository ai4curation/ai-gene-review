  review:
    summary: >-
      HAMAP MF_01658 cell membrane, peripheral. Accepted; Coq7 is modelled as an interfacial
      membrane protein acting on a membrane-partitioned lipid substrate.
    action: ACCEPT
    reason: >-
      The curated rule places Coq7 as a peripheral cell-membrane protein, and the founding study
      that cloned P. aeruginosa Coq7 proposed an interfacial integral membrane model from the
      di-iron carboxylate fold. No transmembrane helix is predicted. The bacterial cell
      membrane is the plasma membrane. Membrane association has not been measured for PP_0427,
      and whether a pool joins a soluble Ubi complex (as UbiF does in E. coli) is unknown.
    supported_by:
    - reference_id: file:PSEPK/coq7/coq7-uniprot.txt
