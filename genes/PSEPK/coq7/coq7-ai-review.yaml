  review:
    summary: >-
      Core molecular function (RHEA:50908, EC 1.14.99.60), defined with a generic donor-H2,
      which fits a di-iron enzyme whose physiological reductant in bacteria is unknown.
    action: ACCEPT
    reason: >-
      Q88QR1 is a HAMAP MF_01658 COQ7 with the six HAMAP iron-binding positions (two E-x-x-H
      motifs plus two bridging Glu). P. aeruginosa Coq7 replaces UbiF in vivo, and the human
      ortholog was shown spectroscopically to hydroxylate demethoxyubiquinone with its
      carboxylate-bridged di-iron centre. GO:0008682 is defined with an unspecified donor;
      the newer NADH-specific term GO:0160224 (PAINT, family root) rests on eukaryotic
      seeds, and the bacterial donor is untested, so the generic term is the right level.
