id: Q88QR1
gene_symbol: coq7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  coq7 (PP_0427) encodes 3-demethoxyubiquinol 3-hydroxylase (COQ7 family, EC 1.14.99.60), a
  ferritin-like carboxylate-bridged di-iron monooxygenase with the conserved four-glutamate,
  two-histidine iron-ligand set. It hydroxylates demethoxyubiquinol at the last unsubstituted
  ring position (C-6 in the numbering of Pelosi et al.; C-5 in older literature) to give
  3-demethylubiquinol, which UbiG then O-methylates to ubiquinol-9. Pseudomonas lacks the
  flavin monooxygenase UbiF that performs this step in Escherichia coli and uses Coq7
  instead; Pseudomonas aeruginosa Coq7 complements an E. coli ubiF mutant. The protein is
  predicted to be a peripheral (interfacial) protein of the cytoplasmic face of the inner
  membrane. Function is inferred from the COQ7 family and the P. aeruginosa ortholog; the
  KT2440 protein has not been assayed.
