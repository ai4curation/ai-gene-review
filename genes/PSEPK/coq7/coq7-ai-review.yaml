      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane {ECO:0000255|HAMAP-Rule:MF_01658};
        Peripheral membrane protein {ECO:0000255|HAMAP-Rule:MF_01658}.'
    - reference_id: PMID:11435415
      supporting_text: Based on the similarities to other well studied di-iron carboxylate proteins,
        we propose a structural model for Coq7 as an interfacial integral membrane protein.
