      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        tryptophan from indole and L-serine.
    - reference_id: file:PSEPK/trpB/trpB-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_00133; Trp_synth_beta; 1."
    - reference_id: PMID:21261884
      supporting_text: >-
        In the first cluster two ORFs, trpA and trpB, encoded the two subunits
        of tryptophan synthase.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Tryptophan synthase is a soluble bacterial enzyme. The KT2440 protein has
      no signal peptide or transmembrane segment and has not been localized
      experimentally.
    action: ACCEPT
    reason: >-
      This TreeGrafter inference rests on the soluble TrpB family. The record
      has no FT TRANSMEM or FT SIGNAL feature, and the enzyme works as a
      subunit of the soluble alpha2-beta2 complex. Cytoplasm is the only
      location row for this gene. The sibling TrpA carries the more specific
      cytosol, but no separate cytosol row exists here to refine to, so the
      row is kept as stated.
    supported_by:
    - reference_id: file:PSEPK/trpB/trpB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Tetramer of two alpha and two beta chains.
    - reference_id: file:PSEPK/trpB/trpB-deep-research-falcon.md
      supporting_text: >-
        No experimental evidence for alternative localization (e.g., membrane
        association or secretion) has been reported for *P. putida* KT2440
        trpB. Bacterial tryptophan synthases are typically soluble, cytoplasmic
        enzymes
