id: Q88RP6
gene_symbol: trpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  trpB (PP_0083) encodes the beta chain of tryptophan synthase (EC 4.2.1.20), a
  fold-type II pyridoxal 5'-phosphate (PLP) enzyme. It catalyses the final
  (beta) reaction of L-tryptophan biosynthesis, condensing indole with L-serine
  to give L-tryptophan and water. PLP is bound as an internal aldimine to Lys95.
  TrpB assembles with the alpha subunit (TrpA) into the alpha2-beta2
  tryptophan synthase, and indole made by TrpA from indole-3-glycerol phosphate
  is channelled to the TrpB active site through an intramolecular tunnel. In
  Pseudomonas putida KT2440, trpB is co-transcribed with trpA as a trpBA
  operon. Transcriptome work reports that its expression rises when cells are
  exposed to indole.
