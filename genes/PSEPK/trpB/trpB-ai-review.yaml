    label: L-tryptophan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      TrpB catalyses the terminal step (step 5/5) of L-tryptophan
      biosynthesis from chorismate and is encoded in the KT2440 trpBA operon.
    action: ACCEPT
    reason: >-
      Core process. The HAMAP-backed pathway assignment is supported by KT2440
      operon mapping, which shows trpA and trpB encode the two tryptophan
      synthase subunits and are co-transcribed. The original screen isolated no
      trpB mutant, so there is no direct genetic test of trpB itself in
      KT2440.
    supported_by:
    - reference_id: file:PSEPK/trpB/trpB-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Amino-acid biosynthesis; L-tryptophan biosynthesis
    - reference_id: PMID:21261884
      supporting_text: >-
        The trpA and trpB overlapped by one nucleotide, suggesting that they
        formed part of an operon, which was confirmed with reverse transcription
        (RT)‐PCR assays (Fig. 3B).
- term:
