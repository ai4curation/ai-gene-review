  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      TrpB performs the PLP-dependent beta reaction of tryptophan synthase,
      condensing indole with L-serine. GO:0004834 is the term used for both
      subunits of the enzyme.
    action: ACCEPT
    reason: >-
      Core molecular function. It is supported by the HAMAP MF_00133 function
      statement, the conserved PLP-binding lysine (N6-(pyridoxal
      phosphate)lysine at 95), and the TrpB family signatures (TIGR00263,
      PIRSF001413, PROSITE PS00168).
    supported_by:
