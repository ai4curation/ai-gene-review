id: Q88NB8
gene_symbol: moaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  moaE (PP_1294) encodes the catalytic subunit of molybdopterin synthase. By orthology with
  Escherichia coli MoaE, two MoaE subunits form the central dimer of a MoaD2-MoaE2
  heterotetramer and use the thiocarboxylated C termini of the sulfur-loaded MoaD carrier
  subunits to incorporate two sulfurs into cyclic pyranopterin monophosphate, forming the
  dithiolene of molybdopterin during molybdenum cofactor biosynthesis.
