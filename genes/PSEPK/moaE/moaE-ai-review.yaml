  review:
    summary: MoaE catalyzes the molybdopterin-forming step of Mo-cofactor biosynthesis.
    action: ACCEPT
    reason: Q88NB8 matches the InterPro and Pfam MoaE models that define the catalytic subunit of
      molybdopterin synthase. The E. coli ortholog converts precursor Z to molybdopterin, so the
      protein does work in the process. Same action as genes/ECOLI/moaE.
