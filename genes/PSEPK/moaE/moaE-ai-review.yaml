- term:
    id: GO:1990140
    label: molybdopterin synthase complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/moaE/moaE-uniprot.txt
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P30749
  review:
    summary: Q88NB8 is the catalytic subunit of the MoaD2-MoaE2 molybdopterin synthase complex.
    action: NEW
    reason: >-
      The UniProt SUBUNIT line of Q88NB8 (2 MoaD + 2 MoaE heterotetramer) is an ARBA
      prediction and is not cited as evidence. Support is family membership:
      Q88NB8 matches the Pfam MoaE, CDD MoaE and InterPro
      Mopterin_biosynth_MoaE models, which define the large (catalytic) subunit
      of molybdopterin synthase; in the characterised E. coli member (P30749,
      the ISS source) that subunit forms the MoaD2-MoaE2 heterotetramer. The
      paired KT2440 moaD/moaE genes are consistent with this. No KT2440 complex
      has been isolated, so this is a family-level inference.
    supported_by:
    - reference_id: file:PSEPK/moaE/moaE-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF02391; MoaE; 1."
    - reference_id: file:ECOLI/moaE/moaE-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Heterotetramer of 2 MoaD subunits and 2 MoaE subunits.'
