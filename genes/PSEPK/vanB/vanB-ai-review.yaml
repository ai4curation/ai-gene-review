- term:
    id: GO:0018489
    label: vanillate monooxygenase activity
  qualifier: contributes_to
  evidence_type: IC
  original_reference_id: PMID:33741529
  review:
    summary: vanB should carry a curator-proposed complex-level annotation to vanillate
      monooxygenase activity. The gene product is the reductase subunit of the two-component
      VanAB enzyme, so the proper qualifier is contributes_to rather than enables.
    action: NEW
    reason: The current GOA set misses the vanillate-specific catalytic context of
      VanB. Adding the complex activity with a contributes_to qualifier is more informative
      and avoids overclaiming that VanB alone performs the full monooxygenase reaction.
      The kinetic evidence (PMID:33741529, abstract only) is for the KT2440 VanAB
      two-component enzyme as a whole, not for VanB alone; VanB's place in it as
      the reductase component rests on its domain architecture (PRINTS PR00409
      phthalate dioxygenase reductase signature, PROSITE PS51384 FAD-binding
      ferredoxin-reductase-type domain, and a C-terminal 2Fe-2S ferredoxin
      domain). The UniProt name is a submitter-imported label and is not cited.
    supported_by:
    - reference_id: PMID:33741529
      supporting_text: >-
        O-demethylated to gallate by VanAB, a two-component
        monooxygenase
    - reference_id: PMID:33741529
      supporting_text: >-
        the specificity (kcat/KM) of VanAB for syringate was within 25% that for
        vanillate
    - reference_id: file:PSEPK/vanB/vanB-uniprot.txt
      record_section: ["DR:PRINTS"]
      supporting_text: "DR   PRINTS; PR00409; PHDIOXRDTASE."
