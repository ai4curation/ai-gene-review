taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: vanB encodes the reductase component of the VanAB two-component vanillate
  O-demethylase in Pseudomonas putida KT2440. The protein is a flavin- and 2Fe-2S-containing
  electron-transfer subunit that supplies reducing equivalents from NADH to the oxygenase
  component VanA during conversion of vanillate to protocatechuate and formaldehyde.
  VanB belongs to the phthalate dioxygenase reductase (PDR) class of Rieske-oxygenase
  reductases, with an N-terminal flavin-binding domain, an NAD-binding region and a
  C-terminal plant-type [2Fe-2S] ferredoxin domain.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  qualifier: enables
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: VanB is an NADH-dependent oxidoreductase, but this parent term hides
      its specific reductase chemistry.
    action: MODIFY
    reason: Correct but general. VanB has the FAD-binding FR-type and NAD-binding
      domains of the ferredoxin-NADP(H) reductase superfamily plus a C-terminal plant-type
      [2Fe-2S] ferredoxin domain, the architecture of the phthalate dioxygenase reductase
      class of Rieske-oxygenase reductases. These pass electrons from NADH through flavin
      and their [2Fe-2S] centre to the Rieske cluster of the oxygenase, the reaction
      class GO represents as ferredoxin-NAD+ reductase activity (GO:0008860). That
      is_a descendant is used here, as for the benzoate dioxygenase reductase BenC
      in the same PANTHER family (PTHR47354), whose family review includes SF1, the
      VanB subfamily, in the scope of GO:0008860 (excluding only the SF7 flavin
      reductases). The earlier choice of electron transfer activity
      (GO:0009055) is not a descendant of oxidoreductase activity and loses the NADH
      oxidation that VanB performs.
    proposed_replacement_terms:
    - id: GO:0008860
      label: ferredoxin-NAD+ reductase activity
    supported_by:
    - reference_id: file:PSEPK/vanB/vanB-uniprot.txt
      record_section: ["DR:PRINTS"]
      supporting_text: "DR   PRINTS; PR00409; PHDIOXRDTASE."
    - reference_id: file:PSEPK/vanB/vanB-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: 'FT   DOMAIN          1..101 FT                   /note="FAD-binding FR-type"'
    - reference_id: file:PSEPK/vanB/vanB-deep-research-falcon.md
      supporting_text: VanB supplies reducing equivalents from NAD(P)H to the oxygenase component (VanA)
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  qualifier: enables
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: This parent term is not wrong, but the UniProt/InterPro evidence supports
      a specific 2Fe-2S ferredoxin-type cofactor rather than an unspecified iron-sulfur
      cluster.
    action: MODIFY
    reason: Correct but general. 2 iron, 2 sulfur cluster binding (GO:0051537), the
