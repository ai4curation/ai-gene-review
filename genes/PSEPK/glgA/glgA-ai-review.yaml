id: Q88FN9
gene_symbol: glgA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GlgA (PP_4050) is the glycogen/alpha-glucan synthase of Pseudomonas putida
  KT2440. It is predicted to extend non-reducing alpha-1,4-glucan ends using an
  UDP-glucose donor, supplying polymer to the connected trehalose and
  branched-alpha-glucan network. The experimentally characterized Pseudomonas
  aeruginosa PAO1 ortholog is a UDP-glucose-preferring enzyme in the same
  PANTHER subfamily; Q88FN9 donor specificity has not been assayed directly.
existing_annotations:
  - term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Strong ortholog and pathway-architecture evidence supports UDP-glucose specificity.
      action: ACCEPT
      reason: >-
        Purified P. aeruginosa PAO1 GlgA preferentially uses UDP-glucose, and
        the paper explicitly relates this specificity to the absence of glgC
        across Pseudomonas spp. Q88FN9 and the assayed PAO1 enzyme share
        PTHR45825:SF8, and KT2440 likewise lacks canonical GlgC. This supports
        transfer of the UDP-specific function while retaining direct Q88FN9
        kinetics as a knowledge gap.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "Synthesizes alpha-1,4-glucan chains using ADP-glucose."
        - reference_id: PMID:33872310
          supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
  - term:
      id: GO:0005978
      label: glycogen biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: GlgA supplies the integrated Pseudomonas pathway that produces branched storage alpha-glucan.
      action: ACCEPT
      reason: >-
        The reviewed HAMAP assignment places Q88FN9 in glycogen biosynthesis,
        and experimental analysis of the close P. aeruginosa pathway shows
        GlgA-dependent formation of linear alpha-1,4-glucan. PAO1 GlgB can
        branch that product when overexpressed in a sensitized background, but
        physiological flux normally runs rapidly through TreY/TreZ toward
        trehalose or maltose and then through GlgE/GlgB to branched polymer.
        The biological-process annotation captures participation in that
        integrated biosynthetic pathway; it does not require a dominant direct
        GlgA-to-GlgB route.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "PATHWAY: Glycan biosynthesis; glycogen biosynthesis."
        - reference_id: PMID:33872310
          supporting_text: "the cluster of genes including glgA is entirely geared towards the production of either trehalose or maltose in vivo."
  - term:
      id: GO:0009011
      label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The HAMAP-derived ADP-glucose assignment conflicts with Pseudomonas ortholog and pathway evidence.
      action: REMOVE
      reason: >-
        UniProt/HAMAP assigns EC 2.4.1.21/RHEA:18189 and ADP-glucose to Q88FN9.
        In contrast, purified P. aeruginosa PAO1 GlgA preferentially
        polymerizes UDP-glucose, and the study links this result to the absence
        of glgC in Pseudomonas spp. The matching glgC-negative KT2440 pathway
        architecture and the independent UDP-glucose-specific InterPro mapping
        make the ADP-glucose-specific electronic annotation questionable, but
        the ADP-glucose-specific electronic annotation unsupported. The same-
        subfamily PAO1 ortholog is UDP-preferring, and KT2440 lacks the GlgC
        source of ADP-glucose; GO:0009011 therefore represents the wrong donor-
        specific sibling activity for this Pseudomonas enzyme.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "DR   GO; GO:0009011; F:alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity; IEA:UniProtKB-UniRule."
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
  - term:
      id: GO:0016757
      label: glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but less informative than the supported UDP-glucose-specific activity.
      action: MODIFY
      reason: >-
        GlgA is securely a glycosyltransferase, but GO:0004373 captures both
        alpha-1,4-glucan chain extension and the supported UDP-glucose donor.
      proposed_replacement_terms:
        - id: GO:0004373
          label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "Belongs to the glycosyltransferase 1 family."
  - term:
      id: GO:0030979
      label: alpha-glucan biosynthetic process
    evidence_type: ISS
    original_reference_id: PMID:33872310
    qualifier: involved_in
    review:
      summary: GlgA-dependent linear glucan formation supports the broader alpha-glucan biosynthetic process.
      action: NEW
      reason: >-
        Purified PAO1 GlgA forms linear alpha-glucan, and Q88FN9 is the close
        KT2440 family member in the conserved Pseudomonas alpha-glucan locus.
        This term records formation of the immediate linear alpha-glucan
        product alongside participation in integrated glycogen biosynthesis.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
