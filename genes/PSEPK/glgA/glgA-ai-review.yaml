id: Q88FN9
gene_symbol: glgA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GlgA (PP_4050) is the glycogen/alpha-glucan synthase of Pseudomonas putida
  KT2440. It is predicted to extend non-reducing alpha-1,4-glucan ends using an
  NDP-glucose donor, supplying polymer to the connected trehalose and
  branched-alpha-glucan network. The experimentally characterized Pseudomonas
  aeruginosa PAO1 homolog prefers UDP-glucose, whereas the Q88FN9 HAMAP record
  predicts ADP-glucose; Q88FN9 donor specificity has not been assayed.
existing_annotations:
  - term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: UDP-glucose specificity is plausible from the PAO1 homolog but untested for Q88FN9.
      action: UNDECIDED
      reason: >-
        Purified P. aeruginosa PAO1 GlgA preferentially uses UDP-glucose, and
        the paper explicitly relates this specificity to the absence of glgC
        across Pseudomonas spp. KT2440 likewise lacks canonical GlgC and Q88FN9
        carries the InterPro-derived UDP-glucose-specific GO annotation. This
        comparative evidence does not establish donor specificity for Q88FN9,
        so the annotation remains unresolved pending a direct assay.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "Synthesizes alpha-1,4-glucan chains using ADP-glucose."
        - reference_id: PMID:33872310
          supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
  - term:
      id: GO:0005978
      label: glycogen biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: GlgA forms linear alpha-glucan, but the glycogen-specific process boundary is unresolved in KT2440.
      action: UNDECIDED
      reason: >-
        The reviewed HAMAP assignment places Q88FN9 in glycogen biosynthesis,
        and experimental analysis of the close P. aeruginosa pathway shows
        GlgA-dependent formation of linear alpha-1,4-glucan. In Pseudomonas,
        however, that product feeds an integrated TreY/TreZ and
        TreS-Mak-GlgE alpha-glucan network rather than a demonstrated direct
        GlgA-to-GlgB glycogen route. The broader alpha-glucan biosynthetic role
        is secure, but the glycogen-specific process term is not directly
        established for Q88FN9.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "PATHWAY: Glycan biosynthesis; glycogen biosynthesis."
  - term:
      id: GO:0009011
      label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The HAMAP-derived ADP-glucose assignment conflicts with comparative Pseudomonas evidence.
      action: UNDECIDED
      reason: >-
        UniProt/HAMAP assigns EC 2.4.1.21/RHEA:18189 and ADP-glucose to Q88FN9.
        In contrast, purified P. aeruginosa PAO1 GlgA preferentially
        polymerizes UDP-glucose, and the study links this result to the absence
        of glgC in Pseudomonas spp. The matching glgC-negative KT2440 pathway
        architecture and the independent UDP-glucose-specific InterPro mapping
        make the ADP-glucose-specific electronic annotation questionable, but
        they do not establish that Q88FN9 cannot use ADP-glucose. Absence of a
        recognized GlgC argues against in-vivo ADP-glucose flux, but an MF term
        describes catalytic capability rather than pathway flux, so the donor
        assignment remains unresolved pending direct enzyme assays.
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "DR   GO; GO:0009011; F:alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity; IEA:UniProtKB-UniRule."
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
  - term:
      id: GO:0016757
      label: glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but less informative than the donor-neutral NDP-glucose activity.
      action: MODIFY
      reason: >-
        GlgA is securely a glycosyltransferase, and this donor-neutral parent
        remains correct, but GO:0033840 captures chain extension without
        overcommitting to either disputed nucleotide-sugar donor.
      proposed_replacement_terms:
        - id: GO:0033840
          label: alpha-1,4-glucan glucosyltransferase (NDP-glucose donor) activity
      supported_by:
        - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
          supporting_text: "Belongs to the glycosyltransferase 1 family."
  - term:
      id: GO:0030979
      label: alpha-glucan biosynthetic process
    evidence_type: ISS
    original_reference_id: PMID:33872310
    qualifier: involved_in
    review:
      summary: GlgA-dependent linear glucan formation supports the broader alpha-glucan biosynthetic process.
      action: NEW
      reason: >-
        Purified PAO1 GlgA forms linear alpha-glucan, and Q88FN9 is the close
        KT2440 family member in the conserved Pseudomonas alpha-glucan locus.
        This broader process term avoids asserting that the immediate GlgA
        product is itself branched glycogen.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
