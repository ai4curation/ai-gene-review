  - id: PMID:33872310
    title: Trehalose and α-glucan mediate distinct abiotic stress responses in Pseudomonas aeruginosa.
    findings:
      - statement: >-
          Purified PAO1 GlgA produced linear alpha-glucan from UDP-glucose and
          showed the highest polymerase activity with UDP-glucose in a
          glgC-negative Pseudomonas genome.
        supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verifies donor-specific assays of the close PAO1 GlgA homolog;
        it is comparative evidence, not a direct assay of Q88FN9.
core_functions:
  - description: >-
      UDP-glucose-dependent extension of alpha-1,4-glucan chains during
      alpha-glucan and glycogen biosynthesis.
    molecular_function:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    directly_involved_in:
      - id: GO:0030979
        label: alpha-glucan biosynthetic process
    supported_by:
      - reference_id: file:PSEPK/glgA/glgA-uniprot.txt
        supporting_text: "DE   RecName: Full=Glycogen synthase"
      - reference_id: PMID:33872310
        supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
    knowledge_gaps:
      - gap_statement: >-
          Q88FN9 nucleotide-sugar donor specificity has not been directly
          measured.
        significance: >-
          Direct kinetics would test the strong UDP-glucose assignment inferred
          from the same-subfamily PAO1 ortholog and GlgC-negative architecture.
proposed_new_terms: []
suggested_questions:
  - question: Does Q88FN9 use UDP-glucose like PAO1 GlgA, or ADP-glucose as predicted by UniProt/HAMAP?
suggested_experiments:
  - description: >-
      Assay purified Q88FN9 with ADP-glucose and UDP-glucose and measure donor
      preference, then combine targeted nucleotide-sugar metabolomics with
      galU disruption or depletion to test the in-vivo donor-supply route.
