taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AcoC is the lipoyl-bearing E2 acetyltransferase assigned to the acetoin-cleaving system of
  Pseudomonas putida KT2440. Its close similarity to PpG2 AcoC, conserved lipoyl-binding domain and acetoin-system
  locus support transfer of the E2 chemistry. During acetoin cleavage it accepts the E1-derived acetyl
  group on its lipoyl carrier and transfers it to coenzyme A. Its alpha/beta-hydrolase catalytic-domain
  architecture differs from classical E2 acetyltransferase folds; a native E3 partner and specific catalytic-residue
  mechanism remain unresolved.
