  qualifier: enables
  review:
    summary: AcoC supplies the lipoyl-carrier acetyltransfer step of acetoin degradation.
    action: ACCEPT
    reason: The publication-linked PpG2 locus assignment, lipoyl-domain architecture and 94.86%
      full-alignment identity support an inferred E2 acetyltransferase role in KT2440, corroborated
      by its native operon context. The PpG2 UniProt reaction statement represents the assigned EC
      chemistry; it has no experimental ECO tag and is not independent purified-enzyme evidence for
      that same EC-derived row. The alpha/beta-hydrolase architecture remains distinct from
      canonical E2 folds, and exact-target kinetics and catalytic residues remain unresolved.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r)
        34639), E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system
        exhibited striking similarities
    - reference_id: file:PSEPU/adh/adh-bioinformatics/RESULTS.md
      supporting_text: Q59695 and Q88QE1 AcoC have 351 identical residues across 370 alignment
        columns, with two gap positions (94.86% identity).
