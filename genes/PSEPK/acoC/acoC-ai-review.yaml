taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AcoC (PP_0553) is the lipoyl-bearing E2 acetyltransferase of the
  acetoin-cleaving system. Its lipoyl arm accepts the acetyl group generated by
  AcoA/AcoB-dependent acetoin cleavage, and its catalytic domain transfers that
  group to coenzyme A. This produces acetyl-CoA while the system releases the
  other acetoin-derived carbon pair as acetaldehyde.
