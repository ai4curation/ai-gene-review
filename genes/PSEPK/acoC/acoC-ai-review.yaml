references:
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
- id: PMID:7813883
  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  findings:
  - statement: PpG2 induces both butanediol dehydrogenase and acetoin cleavage during growth on
      either substrate.
    supporting_text: The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were
      simultaneously induced in Pseudomonas putida PpG2 during growth on 2,3-butanediol and on
      acetoin.
  - statement: PpG2 AcoA/B/C assignments were made from sequence similarity to characterized
      acetoin-system components.
    supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r)
      34639), E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system
      exhibited striking similarities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PpG2 primary: canonical abstract and publisher abstract inspected. Normal forced PMID
      retrieval and publisher PDF recovery did not yield full text. Induction, cloned locus and heterologous
      Adh expression are explicit; exact isolated-subunit activity and stereoisomer tests must not be
      invented.'
- id: file:PSEPU/adh/adh-bioinformatics/RESULTS.md
  title: Sequence comparison results
  findings:
  - statement: The PpG2 and KT2440 dehydrogenases are near-identical over their full lengths.
    supporting_text: Q59696 Adh and Q88QE2 BdhA have 354 identical residues in an ungapped
      362-residue alignment (97.79% identity).
  - statement: Both AcoC sequences preserve closely related full-length architecture.
    supporting_text: Q59695 and Q88QE1 AcoC have 351 identical residues across 370 alignment
      columns, with two gap positions (94.86% identity).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible global pairwise comparisons of unchanged UniProt sequences; no
      inferred tree or experimentally measured kinetics.
- id: file:PSEPU/acoC/acoC-uniprot.txt
  title: UniProtKB record acoC
  findings:
  - statement: The record expresses the assigned E2 acetyl-transfer chemistry; this untagged
      catalytic statement is assignment context, not independent biochemical validation.
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=N(6)-[(R)-dihydrolipoyl]-L-lysyl-[protein] + acetyl-CoA =
      N(6)-[(R)-S(8)-acetyldihydrolipoyl]-L-lysyl-[protein] + CoA;
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The lipoyl-domain and pathway record contextualize the PpG2 homolog. Its
      catalytic-activity statement lacks an experimental ECO tag and repeats the assigned EC
      chemistry; locus sequence evidence and the reproducible KT2440 comparison carry the functional
      inference.
- id: PMID:36482024
  title: The acetoin assimilation pathway of Pseudomonas putida KT2440 is regulated by overlapping
    global regulatory elements that respond to nutritional cues.
  findings:
  - statement: The native KT2440 locus contains the E1 alpha, E1 beta and E2 components; AcoX
      remains functionally unresolved.
    supporting_text: The acoX gene codes for a protein of unknown function, while acoABC codes for
      the E1α, E1β and E2 subunits of the acetoin dehydrogenase complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Native KT2440 growth and promoter experiments support the
      acetoin-system locus and conditional expression, not new isolated-subunit catalytic assays.
- id: PMID:42046433
  title: Engineering Pseudomonas putida for the Production of 2,3-Butanediol Isomers and Acetoin.
  findings:
  - statement: An acoB-locus insertion prevents native growth on acetoin and butanediol; operon
      polarity limits subunit-specific necessity inference.
    supporting_text: this acoB mutant was not able to grow on acetoin or 2,3-BDO, while the wt did
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text Results 3.1 and Methods inspected. Native KT2440 acoB::mini-Tn5 growth
      defect is distinct from subsequent Klebsiella budABC engineering. Authors explicitly warn of
      polar effects on acoC/adh and possibly acoA/acoX; this is not a clean single-subunit
      complementation experiment.
