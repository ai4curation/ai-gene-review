suggested_questions:
- question: >-
    GO:0008681 is defined on the octaprenyl substrate of E. coli. Should GO add a
    chain-length-neutral NAD(P)H-dependent 2-polyprenyl-6-methoxyphenol 4-hydroxylase term
    (parallel to GO:0019168 and GO:0008682) for UbiH proteins of organisms making UQ-9 or
    UQ-10?
- question: >-
    Does PP_5199 retain strict C-1 regioselectivity, or can it, like the generalist UbiL/UbiM
    enzymes, hydroxylate a second ring position?
suggested_experiments:
- description: >-
    Express PP_5199 in an E. coli ubiH deletion strain and test restoration of UQ-8 and
    aerobic growth on succinate; delete PP_5199 in KT2440 and profile accumulated
    2-nonaprenyl-6-methoxyphenol.
