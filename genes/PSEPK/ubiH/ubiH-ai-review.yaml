- id: PMID:27822549
  title: 'Evolution of Ubiquinone Biosynthesis: Multiple Proteobacterial Enzymes with Various
    Regioselectivities To Catalyze Three Contiguous Aromatic Hydroxylation Reactions.'
  findings:
  - statement: Pseudomonas aeruginosa uses UbiH, UbiI and Coq7 instead of the E. coli UbiH,
      UbiI and UbiF set; UbiH and UbiI regioselectivities (C-1 and C-5) are expected to be
      conserved in beta- and gammaproteobacteria.
    supporting_text: Interestingly, the two gammaproteobacteria Pseudomonas aeruginosa and Thiobacillus
      ferrooxidans (also called Acidithiobacillus ferrooxidans) lack ubiF but possess instead
      a Coq7 homolog, which has been shown to complement the C-6 hydroxylation defect of an
      E. coli strain in which ubiF is deleted (16).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC). Uses the UbiA-product ring numbering (UbiH C-1, UbiI
      C-5, UbiF/Coq7 C-6), which differs from the older C-4/C-6/C-5 numbering of PMID:10802164.
- id: PMID:23709220
  title: ubiI, a new gene in Escherichia coli coenzyme Q biosynthesis, is involved in aerobic
    C5-hydroxylation.
  findings:
  - statement: The crystal structure of E. coli UbiI shows the FAD-dependent PHBH fold of the
      UbiH/UbiI/UbiF family.
    supporting_text: This structure shares many features with the canonical FAD-dependent para-hydroxybenzoate
      hydroxylase and represents the first structural characterization of a monooxygenase involved
      in Q biosynthesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; paralog (UbiI) structure used as family template.
- id: file:PSEPK/ubiH/ubiH-uniprot.txt
  title: UniProt entry Q88CI2 for ubiH
  findings:
  - statement: Unreviewed entry; its FAD cofactor, pathway and family comments are ARBA-only and
      are not used as support. Family signatures (NCBIfam TIGR01984 UbiH, InterPro IPR011295,
      PANTHER PTHR43876:SF8) are used.
- id: file:PSEPK/visC/visC-bioinformatics/RESULTS.md
  title: Pairwise identity of P. putida KT2440 ring hydroxylases to E. coli UbiI, UbiH and UbiF
  findings:
  - statement: Global alignment places Q88CI2 closest to E. coli UbiH (40.5%) and Q88CI4 closest
      to E. coli UbiI (46.7%).
- id: file:PSEPK/ubiH/ubiH-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK ubiH
  findings:
  - statement: The report supports PP_5199 as the UbiH C-1 (para) hydroxylase by orthology,
      family motifs and KEGG.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Core UbiH assignment is consistent with family evidence. Its genome-context section has
      errors: it calls the neighbour PP_5197 "ubiV", although PP_5197 is the UbiI-type VisC
      and KT2440 has no UbiT/UbiU/UbiV system (project pathway report); it lists PP_5013 as
      ubiC (PP_5013 is ubiB; ubiC is PP_5317) and PP_0548 as a UbiF-type monooxygenase
      (PP_0548 is ubiX). Pairwise identities (51%) use a different denominator from the
      review's own analysis.
