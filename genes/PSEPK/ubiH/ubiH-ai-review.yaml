  - InterPro:IPR010971
  review:
    summary: >-
      InterPro2GO family-level term from IPR010971 (UbiH/COQ6). True but general; refine to the
      specific UbiH activity carried by this gene.
    action: MODIFY
    reason: >-
      Class A flavoprotein monooxygenases use NAD(P)H and O2, so the paired-donor oxygenase
      term is correct, but the family covers UbiH, UbiI, UbiF and Coq6 with different
      regioselectivities. For a UbiH-clade member the specific term GO:0008681 is supported
      and already carried.
    proposed_replacement_terms:
    - id: GO:0008681
      label: 2-octaprenyl-6-methoxyphenol hydroxylase activity
    supported_by:
    - reference_id: PMID:27822549
      supporting_text: Class A FMOs are a widely distributed subset of FMOs that use a flavin
        adenine dinucleotide (FAD) cofactor, NAD(P)H as the electron donor, and dioxygen in order
        to catalyze aromatic hydroxylation reactions (12).
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010971
  review:
    summary: >-
      Cofactor binding inferred from the UbiH/COQ6 family. True (class A FMOs carry FAD and
      cycle it between oxidized and reduced forms), but a cofactor property, not the core
      activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88CI2 has the FAD_binding_3 (PF01494) domain of class A flavoprotein monooxygenases,
      which bind FAD and reduce it with NAD(P)H during catalysis; GO:0050660 covers both
      oxidized and reduced FAD. It is as precise as warranted for a cofactor-binding
      statement and is peripheral to the hydroxylase function.
    supported_by:
    - reference_id: file:PSEPK/ubiH/ubiH-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF01494; FAD_binding_3; 1.
    - reference_id: PMID:27822549
      supporting_text: Class A FMOs are a widely distributed subset of FMOs that use a flavin
        adenine dinucleotide (FAD) cofactor, NAD(P)H as the electron donor, and dioxygen in order
        to catalyze aromatic hydroxylation reactions (12).
- term:
    id: GO:0071949
    label: FAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002938
  review:
    summary: >-
      InterPro2GO from the FAD-binding domain IPR002938. True and non-core, consistent with
      the GO:0050660 row.
    action: KEEP_AS_NON_CORE
    reason: >-
      The resting enzyme of PHBH-fold monooxygenases binds oxidized FAD non-covalently;
      the E. coli paralog UbiI was crystallized with this fold and needs flavin-pocket
      residues for activity. Cofactor binding is non-core relative to the hydroxylase activity.
    supported_by:
    - reference_id: file:PSEPK/ubiH/ubiH-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR002938; FAD-bd.
    - reference_id: PMID:23709220
      supporting_text: This structure shares many features with the canonical FAD-dependent
        para-hydroxybenzoate hydroxylase and represents the first structural characterization
        of a monooxygenase involved in Q biosynthesis.
