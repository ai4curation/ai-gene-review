- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010971
  - InterPro:IPR011295
  - UniPathway:UPA00232
  review:
    summary: >-
      Core process. UbiH catalyses one of the three ring hydroxylations of ubiquinone
      biosynthesis.
    action: ACCEPT
    reason: >-
      UbiH performs a pathway step. In E. coli UbiH is the C-1 hydroxylase of the pathway,
      and Pseudomonas aeruginosa, a close relative, uses the UbiH + UbiI + Coq7 hydroxylase
      set. Q88CI2 is the UbiH member of that set in KT2440 (UbiH-specific NCBIfam TIGR01984
      and InterPro IPR011295; closest E. coli homolog UbiH). PAINT places GO:0006744 at
      PTHR43876 node PTN008453628, the ancestor of the bacterial UbiH, UbiI and UbiF clades.
    supported_by:
    - reference_id: PMID:27822549
      supporting_text: Prior to our study, four UQ hydroxylases (the di-iron monooxygenase Coq7
        and the three FMOs UbiF, UbiH, and UbiI) had been characterized, constituting two different
        protein sets in E. coli (UbiF, UbiH, and UbiI) (11) and in P. aeruginosa and A. ferrooxidans
        (UbiH, UbiI, and Coq7) (16).
    - reference_id: file:PSEPK/ubiH/ubiH-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR011295; UbiH.
    - reference_id: file:PSEPK/ubiH/ubiH-deep-research-openscientist.md
      supporting_text: The gene is annotated as *ubiH* in UniProt, KEGG (ppu:PP_5199, orthology
        K03185, EC 1.14.13.-), and InterPro
- term:
    id: GO:0008681
    label: 2-octaprenyl-6-methoxyphenol hydroxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011295
  - PANTHER:PTN002466902
  review:
    summary: >-
      Core molecular function, from InterPro IPR011295 (UbiH) and the PANTHER UbiH node
      (PAINT IBD at PTN000350242, seed E. coli UbiH P25534). Accepted with a chain-length
      caveat.
    action: ACCEPT
    reason: >-
      This is the UbiH reaction (C-1 hydroxylation of 2-polyprenyl-6-methoxyphenol). Q88CI2
      carries the UbiH-specific NCBIfam TIGR01984 and the PANTHER subfamily PTHR43876:SF8, is
      closest to E. coli UbiH in pairwise identity (40.5% vs 34-36% to UbiI/UbiF), and the
      regioselectivity of UbiH is expected to be conserved across beta- and
      gammaproteobacteria. The GO term as defined names the octaprenyl substrate of E. coli;
      KT2440 makes ubiquinone-9, so its physiological substrate is the nonaprenyl homolog.
      GO has no chain-length-neutral NAD(P)H-dependent term for this step (GO:0120538 is
      the ferredoxin-dependent version), so GO:0008681 is the closest available term.
    supported_by:
    - reference_id: PMID:27822549
      supporting_text: (iii) Both Coq7 and UbiF also co-occur with UbiH and UbiI, which in E.
        coli have preferences for C-1 and C-5, respectively (11, 20), and we expect the regioselectivities
        of UbiH and UbiI to be conserved in most beta- and gammaproteobacterial proteins, given
        their strong co-occurrence properties (Fig. S6).
