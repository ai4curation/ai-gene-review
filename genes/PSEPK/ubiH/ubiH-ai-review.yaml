id: Q88CI2
gene_symbol: ubiH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  ubiH (PP_5199) encodes a class A flavoprotein monooxygenase of the UbiH/COQ6 family that
  uses FAD, NAD(P)H and O2 to hydroxylate the aromatic ring of a ubiquinone intermediate.
  By orthology to Escherichia coli UbiH it introduces the C-1 (para) hydroxyl of
  2-polyprenyl-6-methoxyphenol, giving 2-polyprenyl-6-methoxy-1,4-benzoquinol, the
  substrate of the UbiE C-methyltransferase. It is one of the three oxygen-dependent ring
  hydroxylases of Pseudomonas putida, together with the UbiI-type VisC (PP_5197, encoded two
  genes away) and the di-iron Coq7 (PP_0427), which replaces the UbiF hydroxylase of E. coli.
  The assignment rests on UbiH-specific family signatures and sequence similarity; the
  KT2440 protein has not been assayed.
