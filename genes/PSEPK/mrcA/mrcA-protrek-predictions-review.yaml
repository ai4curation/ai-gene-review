    label: penicillin metabolic process
  predicted_term_type: GO_BP
  review:
    assessment: REP
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 14.09) and the identical term that headed MrdA's list in E. coli. PBPs
      are inhibited by beta-lactams, they do not metabolise them; penicillin metabolic process belongs
      to beta-lactamases and to penicillin biosynthesis. Two unrelated PBPs from two organisms drawing
      the same wrong term at rank 1 makes this a repetition artefact of the penicillin-associated
      text in SwissProt rather than a judgement about either protein.
