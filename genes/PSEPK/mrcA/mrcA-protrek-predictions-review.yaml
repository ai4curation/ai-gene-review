gene_symbol: mrcA
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for PBP1A, the bifunctional class A penicillin-binding protein.
  Ranks 2 to 5 are four consecutive exact GOA matches that between them recover all three of this
  review's core functions - penicillin binding, D,D-transpeptidase activity and peptidoglycan glycosyltransferase
  activity - which is a complete result for a bifunctional enzyme. Rank 1 repeats the penicillin metabolic
  process error made for MrdA, so the same wrong term heads the list for both PBPs in the cohort.
  Assessment: 2 correct not novel (CNN), 1 repetition (REP).
