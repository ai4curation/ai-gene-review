proposed_new_terms:
- proposed_name: peptidoglycan D,D-transpeptidase activity
  proposed_definition: >-
    Catalysis of the formation of 4-3 peptide crosslinks in peptidoglycan by
    transferring the penultimate D-alanine residue from position 4 of one stem
    peptide to meso-diaminopimelate at position 3 of an acceptor stem peptide
    on a neighboring glycan strand. This differs from L,D-transpeptidase
    activity, which forms 3-3 crosslinks.
  justification: >-
    GO has GO:0071972 for peptidoglycan L,D-transpeptidase activity but no
    corresponding D,D-transpeptidase term. Class-B and class-A PBPs catalyze
    this distinct crosslinking reaction; GO:0009002 is an unsuitable proxy
    because it names hydrolytic carboxypeptidation rather than transpeptidation.
  proposed_parent:
    id: GO:0016755
    label: aminoacyltransferase activity
knowledge_gaps:
- gap_statement: GO lacks a molecular-function term that cleanly represents PBP-family D,D-transpeptidation.
  status: OPEN
  gap_kind: [ONTOLOGY]
  significance: The available carboxypeptidase term must not be used as the primary label for peptide crosslinking.
- gap_statement: Direct kinetics, LpoA activation, and paralog redundancy have not been tested for KT2440 MrcA.
  status: OPEN
  gap_kind: [BIOLOGY]
  significance: These physiological details are inferred from class-A PBP orthologs.
