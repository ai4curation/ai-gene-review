  title: OpenScientist deep research report on PSEPK MrcA/PBP1A (Q88CU6)
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report supports the bifunctional class-A PBP architecture.
    supporting_text: one enzyme performs the two chemically distinct reactions needed to grow the bacterial cell wall — building the sugar (glycan) polymer, and stitching those polymers together through peptide cross-links
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Used as literature retrieval support; no direct biochemical characterization of Q88CU6 was found.
core_functions:
- description: >-
    Bifunctional class-A PBP1A that polymerizes lipid II glycan strands and
    crosslinks peptide stems by D,D-transpeptidation.
  molecular_function:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  directly_involved_in:
