id: Q88CU6
gene_symbol: mrcA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  MrcA/PBP1A is a bitopic inner-membrane class-A penicillin-binding protein
  whose periplasmic GT51 and transpeptidase domains polymerize lipid II into
  glycan strands and form D,D peptide crosslinks. It is one of the major
  bifunctional peptidoglycan synthases of Gram-negative bacteria.
existing_annotations:
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: The large catalytic region of PBP1A acts in the periplasm.
    action: ACCEPT
    reason: A single N-terminal membrane anchor places both catalytic domains on the periplasmic face.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: This root term is uninformative for a bifunctional peptidoglycan synthase.
    action: REMOVE
    reason: Specific glycosyltransferase and crosslinking roles are established.
- term:
    id: GO:0004180
    label: carboxypeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Carboxypeptidation is a possible secondary outcome of the PBP active-site chemistry.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0009002 is already present for possible secondary carboxypeptidation, while neither term names the core D,D-transpeptidase reaction.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: PBP1A is anchored in the cytoplasmic membrane.
    action: ACCEPT
    reason: Its N-terminal transmembrane helix is a defining feature of class-A PBPs.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Peptidoglycan crosslinking is not a generic proteolysis process.
    action: REMOVE
    reason: This keyword transfer mistakes PBP acyl-enzyme chemistry for protein degradation.
- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: This broad term obscures the substrate and the primary crosslinking reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0009002 is already present for possible secondary hydrolysis, while D,D-transpeptidation remains the principal PBP role.
- term:
    id: GO:0008360
    label: regulation of cell shape
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: PBP1A-dependent wall synthesis affects morphology but is not primarily a shape regulator.
    action: KEEP_AS_NON_CORE
    reason: This is a downstream cellular consequence of sacculus synthesis rather than the direct catalytic role.
- term:
    id: GO:0008658
    label: penicillin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: The transpeptidase active-site serine binds beta-lactam antibiotics covalently.
    action: ACCEPT
    reason: Penicillin binding is a defining property of the intact PBP1A transpeptidase domain.
- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: The GT51 domain polymerizes lipid II into peptidoglycan glycan strands.
    action: ACCEPT
    reason: This is one of the two core catalytic roles of PBP1A and is represented cleanly in GO.
- term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  review:
    summary: PBP1A can hydrolyze terminal D-Ala under some conditions, but its principal PBP reaction is D,D-transpeptidation.
    action: KEEP_AS_NON_CORE
    reason: The term can represent secondary carboxypeptidation but must not substitute for the missing D,D-transpeptidase MF.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: PBP1A directly polymerizes and crosslinks peptidoglycan.
    action: ACCEPT
    reason: Both catalytic domains act in late extracytoplasmic sacculus synthesis.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: This root transferase term is redundant with the specific glycosyltransferase annotation.
    action: REMOVE
    reason: GO:0008955 identifies the relevant reaction.
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: The activity is correct but less specific than the peptidoglycan glycosyltransferase term.
    action: MODIFY
    reason: GO:0008955 captures the lipid II polymerization reaction.
    proposed_replacement_terms:
    - id: GO:0008955
      label: peptidoglycan glycosyltransferase activity
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: This root hydrolase term is too broad to describe conditional carboxypeptidation.
    action: REMOVE
    reason: It adds no useful information beyond the specific secondary GO:0009002 annotation.
- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Being a beta-lactam target does not itself establish participation in an antibiotic-response process.
    action: MARK_AS_OVER_ANNOTATED
    reason: No KT2440 evidence shows that MrcA regulates or executes a cellular antibiotic response.
- term:
    id: GO:0071555
    label: cell wall organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: PBP1A directly builds and crosslinks the peptidoglycan cell wall.
    action: ACCEPT
    reason: Its two catalytic reactions organize the load-bearing sacculus.
