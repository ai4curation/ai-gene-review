taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_3199 encodes a predicted FAD-dependent monooxygenase in the KT2440
  flavonoid-degradation locus. Sequence similarity and conserved locus context
  identify it as an FdeE-like enzyme predicted to hydroxylate naringenin and
  related flavonoids before A-ring cleavage. The target protein has not been
  characterized directly, so its substrate range, C-8 regioselectivity, and
  pyridine-nucleotide preference remain unverified in P. putida.
