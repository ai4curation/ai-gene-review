proposed_new_terms:
- proposed_name: flavonoid 8-monooxygenase activity
  proposed_definition: >-
    Catalysis of the C-8 hydroxylation of a flavonoid using reduced pyridine
    nucleotide and molecular oxygen, with incorporation of one oxygen atom into
    the flavonoid and reduction of the other oxygen atom to water.
  justification: >-
    The characterized Hsero_1007/FdeE enzyme performs C-8 hydroxylation across
    several flavonoid classes, whereas GO:0016709 captures only the general
    monooxygenase reaction class.
  proposed_parent:
    id: GO:0016709
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen
  supported_by:
  - reference_id: PMID:39107441
    supporting_text: the fdeE, the FMO from Herbaspirillum seropedicae SmR1 that is a part of the naringenin degradation pathway and is active towards a wide range of flavonoids-flavanones, flavones, isoflavones, and flavonols.
knowledge_gaps:
- gap_statement: >-
    PP_3199's physiological substrate range, hydroxylation position, and
    NADH-versus-NADPH preference have not been measured directly in KT2440.
  boundary: >-
    Reciprocal best-hit orthology supports an FdeE-like flavonoid monooxygenase,
    but 40.4% identity is insufficient to assume identical specificity without
    target assays.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Direct evidence is required before assigning a future C-8
    flavonoid-monooxygenase term experimentally to PP_3199.
  resolution: >-
    Purify PP_3199 and identify products from naringenin and representative
    flavonoids using NADH and NADPH separately.
  provenance:
