    supporting_text: 'Pairwise identity over aligned residue pairs: 40.4%'
suggested_questions:
- question: >-
    Does PP_3199 catalyze C-8 hydroxylation of naringenin in KT2440, and does it
    use NADPH, NADH, or both?
suggested_experiments:
- description: >-
    Purify PP_3199 and assay naringenin, flavones, isoflavones, and flavonols
    with FAD, oxygen, and each reduced pyridine nucleotide, identifying products
    by LC-MS/MS and NMR.
  experiment_type: biochemical reconstitution and product identification
- description: >-
    Compare wild type, a PP_3199 deletion, and a complemented strain during
    growth on naringenin, measuring substrate loss and hydroxylated-intermediate
    accumulation.
  experiment_type: genetics and targeted metabolomics
