  findings: []
- id: PMID:20305657
  title: Self-poisoning of Mycobacterium tuberculosis by targeting GlgE in an alpha-glucan
    pathway.
  findings:
  - statement: >-
      Experimental work in Mycobacterium established the conserved four-step
      TreS-Mak-GlgE-GlgB route and identifies maltose 1-phosphate as the GlgE
      donor; it supports the pathway architecture but is not a direct assay of
      Pseudomonas TreSB.
    supporting_text: >-
      We describe a new pathway from trehalose to alpha-glucan in
      Mycobacterium tuberculosis comprising four enzymatic steps mediated by
      TreS, Pep2, GlgE (which has been identified as a maltosyltransferase that
      uses maltose 1-phosphate) and GlgB.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary research supporting the conserved pathway
      topology; the assayed proteins are from Mycobacterium tuberculosis, not
      Pseudomonas putida KT2440.
- id: file:PSEPK/treSB/treSB-deep-research-openscientist.md
  title: OpenScientist functional-annotation report for treSB
  findings:
