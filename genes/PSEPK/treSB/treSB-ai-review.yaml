id: Q88FN0
gene_symbol: treSB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  TreSB (PP_4059) is a large bifunctional carbohydrate enzyme with an
  N-terminal GH13 TreS domain and a C-terminal maltokinase domain. It
  interconverts maltose and alpha,alpha-trehalose (EC 5.4.99.16) and separately
  phosphorylates maltose with ATP to produce alpha-maltose 1-phosphate (EC
  2.7.1.175), the donor used by adjacent GlgE. Both reactions are predicted
  from sequence and automated rules; no KT2440-specific biochemical study was
  found in the local publication cache.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: TreSB is catalytic, but this root term hides both specific reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0047471 captures the TreS reaction and a separate kinase annotation is
      needed for maltose phosphorylation, so the root catalytic term should
      not be propagated as an independent function.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "EC=2.7.1.175"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "EC=5.4.99.16"
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Both TreSB reactions directly interconvert carbohydrate metabolites.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is correct but too broad to describe TreSB's role. It is
      retained as non-core without assigning the protein every downstream
      reaction in trehalose or alpha-glucan metabolism.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "Reaction=D-maltose = alpha,alpha-trehalose"
- term:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The TreS domain interconverts D-maltose and alpha,alpha-trehalose.
    action: ACCEPT
    reason: >-
      The record assigns EC 5.4.99.16/RHEA:15145, a TreS-specific N-terminal
      domain, and PTHR10357:SF219 named maltose alpha-D-glucosyltransferase.
      This supports one half of the bifunctional protein but not its separate
      maltokinase reaction.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "Reaction=D-maltose = alpha,alpha-trehalose"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "DR   InterPro; IPR012810; TreS/a-amylase_N."
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IC
  original_reference_id: file:PSEPK/treSB/treSB-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      The C-terminal maltokinase domain phosphorylates D-maltose with ATP to
      produce alpha-maltose 1-phosphate.
    action: NEW
    reason: >-
      UniProt assigns EC 2.7.1.175/RHEA:31915 and a TreS-maltokinase C-terminal
      domain, but the seeded GOA lacks the kinase half of this bifunctional
      protein. GO:0016301 is used provisionally because the local GO snapshot
      has no substrate-specific maltokinase activity term.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "Reaction=D-maltose + ATP = alpha-maltose 1-phosphate + ADP + H(+)"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "DR   InterPro; IPR012811; TreS_maltokin_C_dom."
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: file:PSEPK/treSB/treSB-uniprot.txt
  title: UniProtKB entry for treSB (Q88FN0)
  findings:
  - statement: >-
      The unreviewed record assigns two reactions to one 1106-aa protein:
      EC 5.4.99.16/RHEA:15145 for maltose-trehalose interconversion and EC
      2.7.1.175/RHEA:31915 for ATP-dependent maltose phosphorylation.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The two reactions agree with the TreS and maltokinase domain architecture,
      but both are automated predictions without target-specific biochemistry.
- id: file:interpro/panther/PTHR10357/PTHR10357-paint.tsv
  title: PANTHER PAINT annotations for PTHR10357
  findings:
  - statement: >-
      A bacterial PTHR10357 ancestral node carries GO:0047471 with IBD
      evidence. The local PTHR10357 member snapshot does not contain Q88FN0,
      so PAINT is treated only as family-level corroboration.
core_functions:
- description: >-
    Interconverts D-maltose and alpha,alpha-trehalose through the GH13 TreS
    catalytic domain.
  molecular_function:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  supported_by:
  - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
    supporting_text: "Reaction=D-maltose = alpha,alpha-trehalose"
- description: >-
    Uses ATP to phosphorylate D-maltose to alpha-maltose 1-phosphate through
    the fused C-terminal maltokinase domain.
  molecular_function:
    id: GO:0016301
    label: kinase activity
  supported_by:
  - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
    supporting_text: "Reaction=D-maltose + ATP = alpha-maltose 1-phosphate + ADP + H(+)"
proposed_new_terms:
- proposed_name: maltokinase activity
  proposed_definition: >-
    Catalysis of the reaction D-maltose + ATP = alpha-maltose 1-phosphate +
    ADP + H(+).
  justification: >-
    TreSB has an explicitly assigned EC 2.7.1.175/RHEA:31915 maltokinase
    reaction and a TreS-maltokinase C-terminal domain, but the local GO
    ontology has no substrate-specific molecular-function term for this
    activity.
  proposed_parent:
    id: GO:0016301
    label: kinase activity
