id: Q88FN0
gene_symbol: treSB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  TreSB (PP_4059) is a large bifunctional carbohydrate enzyme with an
  N-terminal GH13 TreS domain and a C-terminal maltokinase domain. It
  interconverts maltose and alpha,alpha-trehalose (EC 5.4.99.16) and separately
  phosphorylates maltose with ATP to produce alpha-maltose 1-phosphate (EC
  2.7.1.175), the donor used by adjacent GlgE.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: TreSB is catalytic, but this root term hides both specific reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0047471 captures the TreS reaction and a separate kinase annotation is
      needed for maltose phosphorylation, so the root catalytic term should
      not be propagated as an independent function.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "EC=2.7.1.175"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      supporting_text: "EC=5.4.99.16"
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Both TreSB reactions directly interconvert carbohydrate metabolites.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The annotation is correct but too broad to describe TreSB's role. It is
      marked as over-annotated without assigning the protein every downstream
      reaction in trehalose or alpha-glucan metabolism.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=D-maltose = alpha,alpha-trehalose"
- term:
    id: GO:0047471
    label: maltose alpha-D-glucosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The TreS domain interconverts D-maltose and alpha,alpha-trehalose.
    action: ACCEPT
    reason: >-
      The record assigns EC 5.4.99.16/RHEA:15145, a TreS-specific N-terminal
      domain, and PTHR10357:SF219 named maltose alpha-D-glucosyltransferase.
      This supports one half of the bifunctional protein but not its separate
      maltokinase reaction.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=D-maltose = alpha,alpha-trehalose"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR012810; TreS/a-amylase_N."
- term:
    id: GO:0019200
    label: carbohydrate kinase activity
  evidence_type: IC
  original_reference_id: file:PSEPK/treSB/treSB-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      The C-terminal maltokinase domain phosphorylates D-maltose with ATP to
      produce alpha-maltose 1-phosphate.
    action: NEW
    reason: >-
      UniProt assigns EC 2.7.1.175/RHEA:31915 and a TreS-maltokinase C-terminal
      domain, but the seeded GOA lacks the kinase half of this bifunctional
      protein. GO lacks a substrate-specific maltokinase term, and
      GO:0019200 is the most specific available parent for phosphorylation of
      a carbohydrate substrate.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=D-maltose + ATP = alpha-maltose 1-phosphate + ADP + H(+)"
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR012811; TreS_maltokin_C_dom."
- term:
    id: GO:0030979
    label: alpha-glucan biosynthetic process
  evidence_type: IC
  original_reference_id: file:PSEPK/treSB/treSB-uniprot.txt
  qualifier: involved_in
  review:
    summary: The fused maltokinase activity supplies alpha-maltose 1-phosphate directly to the adjacent GlgE polymer-extension reaction.
    action: NEW
    reason: >-
      The Mak half of TreSB produces the dedicated donor consumed by GlgE,
      supporting direct participation of the fused protein in alpha-glucan
      biosynthesis without assigning the reversible TreS reaction alone to
      that process. The evidence is indirect and of two kinds: the C-terminal
      region of Q88FN0 is classified as a TreS-fused maltokinase domain
      (InterPro IPR012811, NCBIfam TIGR02457), and the
      TreS-Pep2(maltokinase)-GlgE-GlgB route to alpha-glucan, with maltose 1-phosphate as the GlgE
      donor, was established experimentally in Mycobacterium tuberculosis
      (PMID:20305657), not in P. putida. The ARBA-only UniProt reaction line
      and the neighbouring glgE record are not cited.
    supported_by:
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR012811; TreS_maltokin_C_dom."
    - reference_id: file:PSEPK/treSB/treSB-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "NCBIfam; TIGR02457; TreS_Cterm; 1."
    - reference_id: PMID:20305657
      supporting_text: >-
        We describe a new pathway from trehalose to alpha-glucan in
        Mycobacterium tuberculosis comprising four enzymatic steps mediated by
        TreS, Pep2, GlgE (which has been identified as a maltosyltransferase that
        uses maltose 1-phosphate) and GlgB.
