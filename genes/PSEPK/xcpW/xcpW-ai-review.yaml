core_functions:
- description: >-
    Minor pseudopilin contributing to initiation and tip architecture of the
    T2SS pseudopilus. The record carries a prepilin-type N-terminal methylation
    signature and a single N-terminal transmembrane helix, both shared by type
    IV pilins and T2SS pseudopilins, and two GspJ-specific family assignments
    that place the protein in the GspJ clade rather than among the pilins:
    InterPro IPR051621 (Type II secretion system protein J) and PANTHER
    PTHR39583:SF2. The xcp locus context and the XcpW name agree with that
    assignment. No experimental evidence exists for this protein itself, so the
    functional detail comes from the characterized orthologs.
