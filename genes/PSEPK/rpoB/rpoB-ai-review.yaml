id: Q88QP2
gene_symbol: rpoB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  rpoB (PP_0447) encodes the beta subunit of the bacterial DNA-directed RNA
  polymerase core enzyme. Together with the beta-prime subunit RpoC, RpoB forms
  the catalytic cleft of the alpha2-beta-beta-prime-omega RNAP core, binding
  nucleic-acid substrates and incoming ribonucleotides during RNA-chain
  elongation. RpoB is therefore a core catalytic-cleft subunit that contributes
  to DNA-directed RNA polymerase activity and DNA-templated transcription as
  part of the assembled core enzyme.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      DNA binding is plausible for the beta subunit as part of the RNAP
      catalytic cleft, but it is a broad supporting activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain as non-core supporting context. The more informative function is
      contribution to complex-level DNA-directed RNA polymerase activity.
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      RpoB is a core catalytic-cleft subunit of bacterial RNAP and is required
      for RNA synthesis, but activity is performed by the assembled complex.
    action: ACCEPT
    reason: >-
      RpoB is one of the two large catalytic-cleft subunits and directly
      participates in nucleotide addition by the assembled core. Retain the
      annotation while the synthesis below records contribution to the
      complex-level function rather than activity by isolated RpoB.
    supported_by:
    - reference_id: file:PSEPK/rpoB/rpoB-uniprot.txt
      supporting_text: DNA-dependent RNA polymerase catalyzes the transcription of
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      RpoB directly participates in DNA-templated transcription as an essential
      beta subunit of the bacterial RNA polymerase core enzyme.
    action: ACCEPT
    reason: >-
      Correct process annotation for a core RNAP subunit.
- term:
    id: GO:0032549
    label: ribonucleoside binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Ribonucleoside binding is consistent with the beta subunit's role in the
      RNA polymerase catalytic cleft and with InterPro domain annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the InterPro projection as supporting substrate-contact context,
      but it is broad and less informative than RpoB's catalytic-cleft role in
      the assembled polymerase.
- term:
    id: GO:0034062
    label: 5'-3' RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      The Rhea-derived polymerase reaction reflects RNA-chain elongation by the
      assembled RNAP core.
    action: ACCEPT
    reason: >-
      RpoB is a required catalytic-cleft subunit that directly participates in
      5'-3' RNA-chain extension by the assembled core. This term is retained as
      a core catalytic-subunit function, not a claim about isolated RpoB.
    supported_by:
    - reference_id: file:PSEPK/rpoB/rpoB-uniprot.txt
      supporting_text: DNA-dependent RNA polymerase catalyzes the transcription of
- term:
