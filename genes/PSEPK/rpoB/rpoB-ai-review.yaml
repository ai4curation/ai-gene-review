  qualifier: part_of
  review:
    summary: >-
      RpoB is part of the bacterial DNA-directed RNA polymerase core complex.
    action: NEW
    reason: >-
      UniProt records Q88QP2 as the beta subunit in the alpha2-beta-beta-prime-
      omega RNAP catalytic core, so explicit complex membership is useful for
