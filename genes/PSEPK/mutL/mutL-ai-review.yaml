id: Q88DD1
gene_symbol: mutL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  MutL is the ATP-dependent coordinator and inferred strand-incision
  endonuclease of the MutH-independent mismatch repair pathway. It is recruited
  after MutS recognizes a replication mismatch, uses its N-terminal GHKL
  ATPase cycle to organize repair, and dimerizes through a C-terminal domain
  that is strongly inferred to nick duplex DNA. KT2440 lacks MutH, placing
  MutL-mediated incision in a methylation-independent repair architecture.
existing_annotations:
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Retain as non-core. ATP binding supports the MutL conformational cycle,
        while ATP hydrolysis is the more informative catalytic function.
      action: KEEP_AS_NON_CORE
      reason: Correct property of the N-terminal GHKL ATPase domain.
  - term:
      id: GO:0006259
      label: DNA metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: This broad parent process adds no information beyond mismatch repair.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0006298 is the direct pathway term.
  - term:
      id: GO:0006298
      label: mismatch repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: >-
        Accept. Transient loss of MutL activity was used directly to expose the
        mismatch-correction hierarchy in KT2440.
      action: ACCEPT
      reason: Core process with direct P. putida genetic support.
      supported_by:
        - reference_id: PMID:31599106
          supporting_text: "permanent deletion of mutS or transient loss of mutL activity"
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Accept as the catalytic function of the conserved GHKL ATPase domain.
      action: ACCEPT
      reason: >-
        Pseudomonas MutL ATPase-site mutations cause defective mismatch repair,
        and Q88DD1 retains the conserved domain.
      supported_by:
        - reference_id: PMID:11952911
          supporting_text: "residue known to be essential for its ATPase activity."
  - term:
      id: GO:0030983
      label: mismatched DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Remove. MutL can bind DNA in the repair complex, but mismatch-specific
        recognition is the role of MutS; direct mismatch specificity is not
        established for MutL.
      action: REMOVE
      reason: InterPro propagation conflates recruitment to mismatch-bound MutS with mismatch sensing.
  - term:
      id: GO:0032300
      label: mismatch repair complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: part_of
    review:
      summary: Accept. MutL is a defining component recruited by mismatch-bound MutS.
      action: ACCEPT
      reason: Correct complex membership without assigning MutS's recognition function to MutL.
  - term:
      id: GO:0140664
      label: ATP-dependent DNA damage sensor activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Remove. MutL is an ATP-dependent coordinator and endonuclease recruited
        by MutS, not the protein that initially senses the mismatch.
      action: REMOVE
      reason: The sensor term belongs to MutS in this pathway.
  - term:
      id: GO:1990238
      label: double-stranded DNA endonuclease activity
    evidence_type: ISS
    original_reference_id: PMID:23969026
    qualifier: enables
    review:
      summary: >-
        Add by close-ortholog inference. Pseudomonas aeruginosa MutL directly
        nicks duplex plasmid DNA, and a reproducible global alignment finds 521
        identical residues among 627 aligned residue pairs (83.1%) between its
        reviewed protein Q9HUL8 and KT2440 Q88DD1.
      action: NEW
      reason: >-
        The direct biochemical exemplar is a close Pseudomonas ortholog with
        the same MutH-independent architecture; a direct Q88DD1 assay is still
        needed.
      additional_reference_ids:
        - UniProtKB:Q9HUL8
      supported_by:
        - reference_id: PMID:23969026
          supporting_text: "PaMutL was able to nick covalently closed circular plasmids"
        - reference_id: file:PSEPK/mutL/mutL-bioinformatics/RESULTS.md
          supporting_text: "of which 521 are identical (83.0941%)."
