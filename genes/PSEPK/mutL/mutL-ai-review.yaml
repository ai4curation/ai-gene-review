suggested_questions:
  - question: >-
      Does Q88DD1 nick the nascent strand directly, and is its activity oriented
      or stimulated by the KT2440 beta clamp?
suggested_experiments:
  - hypothesis: Q88DD1 is the strand-incision endonuclease of KT2440 MMR.
    description: >-
      Purify Q88DD1 and test metal-dependent nicking of covalently closed
      duplex DNA with MutS, mismatch-containing substrates, ATP/ADP, and the
      KT2440 beta clamp; compare catalytic-site and clamp-binding mutants.
    experiment_type: reconstituted MutH-independent mismatch incision assay
