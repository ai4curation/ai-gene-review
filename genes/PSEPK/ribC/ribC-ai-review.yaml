taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: 'ribC (PP_2916) of Pseudomonas putida KT2440 encodes riboflavin synthase (EC 2.5.1.9), which
  catalyses the dismutation of two molecules of 6,7-dimethyl-8-ribityllumazine to riboflavin and 5-amino-6-(D-ribitylamino)uracil,
  the last step of riboflavin biosynthesis. The protein has the two lumazine-binding repeats typical of
  bacterial riboflavin synthase and is a soluble cytoplasmic enzyme. It is encoded outside the main rib
  gene cluster. KT2440 carries a second intact riboflavin synthase, ribE (PP_0515). Note that the symbol
  follows the Pseudomonas convention: the E. coli genes of the same names encode different steps (E. coli
  ribE is lumazine synthase and ribC is riboflavin synthase). Function is inferred from family membership;
  no KT2440 enzymology is reported.'
