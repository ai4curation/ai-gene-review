    action: ACCEPT
    reason: 'ribC (PP_2916) has the full riboflavin synthase architecture: two lumazine-binding repeats
      (Pfam Lum_binding x2), NCBIfam TIGR00187 and PIRSF000498, the family of the characterised E. coli
      and yeast riboflavin synthases that seed the PAINT node. KT2440 has two such paralogs, ribC and
      ribE (PP_0515); both are intact, and which is physiologically dominant is unknown. Activity is by
      family membership; no KT2440 assay is reported.'
