id: Q88FE0
gene_symbol: kdpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpE (PP_4157; Q88FE0) is the predicted OmpR/PhoB-family response regulator of
  the KdpD/KdpE two-component system of Pseudomonas putida KT2440, encoded next to kdpD. It
  has an N-terminal receiver domain with the phosphorylatable Asp55 and a C-terminal OmpR/PhoB
  winged helix-turn-helix DNA-binding domain. By orthology with E. coli KdpE, phosphorylation
  by KdpD activates KdpE to bind the cis-regulatory sequence upstream of the kdpFABC promoter
  and activate transcription of the high-affinity K+ uptake pump KdpFABC.
