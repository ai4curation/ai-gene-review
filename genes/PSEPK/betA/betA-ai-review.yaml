suggested_questions:
- question: >-
    Does KT2440 BetA oxidize betaine aldehyde with a respiratory acceptor, as A. baumannii BetA does in
    vitro, or is it choline-specific like purified E. coli BetA? If acceptor-linked aldehyde oxidation
    is real, GO lacks a betaine-aldehyde dehydrogenase (acceptor) term to record it.
suggested_experiments:
- hypothesis: >-
    KT2440 BetA is choline-specific and does not oxidize betaine aldehyde in physiologically relevant
    amounts.
  description: >-
    Purify KT2440 BetA in SMA nanodiscs and assay betaine-aldehyde oxidation with artificial (DCPIP/PMS)
    and quinone acceptors, alongside a betB deletion strain grown on choline at high salt.
