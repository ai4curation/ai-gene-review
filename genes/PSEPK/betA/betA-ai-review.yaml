id: Q88CW6
gene_symbol: betA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  betA (PP_5064) encodes a membrane-associated FAD-dependent choline
  dehydrogenase in the betIBA glycine-betaine biosynthetic locus. Its
  well-supported core reaction oxidizes choline to betaine aldehyde, supplying
  the dedicated BetB aldehyde dehydrogenase that completes glycine-betaine
  formation. A possible secondary NAD-dependent betaine-aldehyde dehydrogenase
  activity has not been demonstrated for KT2440.
existing_annotations:
- term:
    id: GO:0008802
    label: betaine-aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: UniProt/HAMAP assigns this second activity, but no Q88CW6-specific biochemical assay was found.
    action: UNDECIDED
    reason: >-
      The GO row is an EC/Rhea-derived IEA from HAMAP MF_00750, so its support
      is family-level rather than organism-specific. Co-occurrence of the
      dedicated BetB enzyme is not evidence against BetA bifunctionality, but
      no target-specific biochemical assay establishes the second activity.
    supported_by:
    - reference_id: file:PSEPK/betA/betA-uniprot.txt
      supporting_text: "CC       betaine aldehyde to glycine betaine at the same rate."
- term:
    id: GO:0008812
    label: choline dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The reviewed UniProt record, FAD enzyme family, and KT2440 pathway assignment all support oxidation of choline to betaine aldehyde.
    action: ACCEPT
    reason: This is the primary core molecular function of BetA.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: BetA is a membrane-associated choline dehydrogenase, consistent with the TreeGrafter localization.
    action: ACCEPT
    reason: Retain as a valid cellular-component annotation.
    supported_by:
    - reference_id: file:PSEPK/betA/betA-deep-research-openscientist.md
      supporting_text: "BetA was found to be associated with the membrane and to contain a flavin"
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Generic oxidoreductase activity is true but uninformative beside choline dehydrogenase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-specific function should carry the biological interpretation.
- term:
    id: GO:0016614
    label: oxidoreductase activity, acting on CH-OH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Choline oxidation acts on a donor CH-OH group, so this reaction-class parent is correct.
    action: KEEP_AS_NON_CORE
    reason: Retain as a mechanistic parent subordinate to GO:0008812.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
