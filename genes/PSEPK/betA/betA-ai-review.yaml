- id: file:PSEPK/betA/betA-deep-research-openscientist.md
  title: OpenScientist functional-annotation report for betA
  findings:
  - statement: The report corroborates the target identity, primary choline dehydrogenase function, membrane
      association, and role in the KT2440 choline-to-glycine-betaine pathway.
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Primary choline-oxidation and family/localization inferences are useful. The summary
      incorrectly presents secondary aldehyde turnover as established for Q88CW6 and labels it EC1.2.1.8,
      despite acknowledging no target enzymology. PMS-dependent Acinetobacter evidence does not establish
      NAD-specific or KT2440 activity; those claims are not adopted.
- id: PMID:39510372
  title: Purification and catalysis of choline dehydrogenase from Escherichia coli.
  findings:
  - statement: Purified E. coli BetA (ortholog) oxidizes choline but not betaine aldehyde.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Normal force-fetch still yields the abstract. It explicitly reports purified E. coli
      CHDH failing to oxidize betaine aldehyde under the tested conditions, in contrast to older crude-membrane
      measurements. The accessible text does not identify an exact source strain/accession or expose all
      assay conditions; do not universalize the negative result across BetA homologs.
  full_text_unavailable: true
- id: PMID:34431198
  title: 'The choline dehydrogenase BetA of Acinetobacter baumannii: a flavoprotein responsible for osmotic
    stress protection.'
  findings:
  - statement: A. baumannii BetA is a membrane-associated flavoprotein that also oxidizes betaine aldehyde
      in vitro.
  - statement: The external full-text assay uses PMS as primary electron acceptor, with oxygen consumed
      upon its reoxidation; no NAD-dependent aldehyde reaction is established by this assay.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full publisher article consulted externally at https://enviromicro-journals.onlinelibrary.wiley.com/doi/10.1111/1462-2920.15741;
      local cache remains abstract-only. Source is A. baumannii ATCC19606 HMPREF0010_01460, recombinantly
      expressed with a His tag in E. coli. Results and coupled-assay methods explicitly use PMS as primary
      acceptor; oxygen consumption follows PMS reoxidation. The enriched preparation also contained a
      peptidyl-prolyl isomerase. Aldehyde turnover is an in vitro capability, not evidence of NAD reduction,
      native BetB dispensability, or KT2440 secondary activity.
  full_text_unavailable: true
- id: PMID:3512525
  title: Choline-glycine betaine pathway confers a high level of osmotic tolerance in Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: The E. coli source distinguishes the soluble NAD-dependent aldehyde enzyme from membrane-linked
      oxidation.
    supporting_text: Also, a soluble, NAD-dependent dehydrogenase oxidized glycine betaine aldehyde.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract explicitly separates the activities and assigns NAD/NADP kinetics to the soluble
      enzyme; comparative source-tracing evidence, not a KT2440 assay.
