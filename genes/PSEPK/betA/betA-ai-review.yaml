taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: betA (PP_5064) encodes the predicted FAD-dependent choline dehydrogenase of Pseudomonas putida
  KT2440, a GMC-family oxidoreductase in the betIBA locus. It oxidizes choline to betaine aldehyde, which
  the dedicated NAD-dependent BetB enzyme converts to glycine betaine. KT2440 betBA genetics support choline
  utilization as a carbon or nitrogen source and glycine-betaine-mediated salt tolerance. Peripheral inner-membrane
  association and respiratory electron transfer are inferred from characterized relatives; the physiological
  electron acceptor and any secondary aldehyde-oxidation activity have not been established for isolated
  Q88CW6.
existing_annotations:
- term:
    id: GO:0008802
    label: betaine-aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: EC 1.2.1.8 (NAD+-dependent betaine-aldehyde dehydrogenase) propagated by HAMAP MF_00750 as
      a second BetA activity.
    action: REMOVE
    reason: The NAD+-specific reaction is propagated by HAMAP MF_00750 from a BetA assignment whose E.
      coli source conflates a membrane electron-transfer-linked activity with a separate soluble NAD-dependent
      enzyme. This is a source-reaction mapping problem, not a negative assay of Q88CW6. The Acinetobacter
      comparator uses PMS as primary acceptor and establishes no NAD reduction, while purified E. coli
      BetA lacks measurable aldehyde oxidation under the reported conditions. Neither result establishes
      KT2440 secondary specificity. Remove this unsupported NAD-specific propagation while leaving acceptor-linked
      aldehyde oxidation unresolved; the presence of FAD alone is not grounds to rule out NAD chemistry.
    supported_by:
    - &id001
      reference_id: PMID:39510372
      supporting_text: highly pure E. coli CHDH could only oxidize choline to betaine aldehyde but failed
        to further oxidize betaine aldehyde to betaine
    - &id002
      reference_id: PMID:34431198
      supporting_text: BetA was found to be associated with the membrane and to contain a flavin, indicative
        for BetA donating electrons into the respiratory chain.
    - reference_id: PMID:34431198
      supporting_text: We found that BetA is a choline dehydrogenase but also mediates in vitro the oxidation
        of glycine betaine aldehyde to glycine betaine.
    - reference_id: PMID:3512525
      supporting_text: Also, a soluble, NAD-dependent dehydrogenase oxidized glycine betaine aldehyde.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q88CW6
      slot: CC:CATALYTIC ACTIVITY
      requested_change: CHECK
      asserted_value: EC:1.2.1.8
      confidence: PROBABLE
      explanation: HAMAP MF_00750 propagates RHEA:15305/EC1.2.1.8, a specifically NAD-dependent aldehyde
        reaction, to this BetA record. The E. coli source separates membrane electron-transfer activity
        from the soluble NAD-dependent enzyme; the Acinetobacter aldehyde assay uses PMS. No isolated
        KT2440 NAD-dependent aldehyde activity is established. Reassess this mapping without treating
        FAD binding as proof against every possible NAD reaction or assuming E. coli secondary specificity
        transfers to Q88CW6.
      supported_by:
      - *id001
