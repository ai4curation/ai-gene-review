  label: Pseudomonas putida KT2440
description: >-
  betA (PP_5064) encodes the FAD-dependent choline dehydrogenase of Pseudomonas putida KT2440, a GMC-family
  oxidoreductase in the betIBA glycine-betaine biosynthetic locus. It oxidizes choline to betaine aldehyde,
  passing electrons to the respiratory chain at the cytoplasmic membrane. The dedicated NAD-dependent
  BetB enzyme oxidizes the aldehyde to glycine betaine. In KT2440, betBA are required to convert choline
  to glycine betaine, for salt tolerance, and for growth on choline as a carbon or nitrogen source. Whether
  BetA-family enzymes also oxidize betaine aldehyde is contested: the purified E. coli enzyme does not,
  while Acinetobacter BetA does in vitro. In neither case is the reaction NAD-dependent.
existing_annotations:
- term:
    id: GO:0008802
    label: betaine-aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      EC 1.2.1.8 (NAD+-dependent betaine-aldehyde dehydrogenase) propagated by HAMAP MF_00750 as a second
      BetA activity.
    action: REMOVE
    reason: >-
      GO:0008802 requires NAD+ as acceptor. BetA is a flavoprotein that passes electrons to the respiratory
      chain, and no BetA-family enzyme has been shown to reduce NAD+. A. baumannii BetA oxidizes betaine
      aldehyde in vitro, but the paper does not name the acceptor; our inference is that it is not NAD+,
      because GMC flavoproteins carry FAD and have no NAD-binding site. Purified E. coli BetA, the source
      of the HAMAP second reaction, does not oxidize betaine aldehyde at all. The NAD-dependent step in
      KT2440 is performed by BetB (Q88CW7). This replaces the earlier UNDECIDED: the term is wrong for
      BetA whatever the status of that side reaction. The same call is made for E. coli BetA (P17444).
    supported_by:
    - &id001
      reference_id: PMID:39510372
      supporting_text: >-
        highly pure E. coli CHDH could only oxidize choline to betaine aldehyde but failed to further
        oxidize betaine aldehyde to betaine
    - &id002
      reference_id: PMID:34431198
      supporting_text: >-
        BetA was found to be associated with the membrane and to contain a flavin, indicative for BetA
        donating electrons into the respiratory chain.
    - reference_id: PMID:34431198
      supporting_text: >-
        We found that BetA is a choline dehydrogenase but also mediates in vitro the oxidation of glycine
        betaine aldehyde to glycine betaine.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q88CW6
      slot: CC:CATALYTIC ACTIVITY
      requested_change: CHECK
      asserted_value: EC:1.2.1.8
      confidence: PROBABLE
      explanation: >-
        HAMAP rule MF_00750 assigns the NAD-dependent betaine-aldehyde reaction (RHEA:15305, EC 1.2.1.8)
        to all BetA choline dehydrogenases. BetA is a respiratory-chain-linked flavoprotein; purified
        E. coli BetA does not oxidize betaine aldehyde (PubMed:39510372), and the aldehyde oxidation reported
        for A. baumannii BetA (PubMed:34431198) is, by inference from its FAD-only GMC fold, unlikely
        to use NAD+. The rule should drop EC 1.2.1.8, or replace it with an acceptor-linked reaction if
        one is demonstrated.
      supported_by:
      - *id001
