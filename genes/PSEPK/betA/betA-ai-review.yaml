    label: glycine betaine biosynthetic process from choline
  evidence_type: IC
  original_reference_id: file:PSEPK/betA/betA-notes.md
  qualifier: involved_in
  review:
    summary: BetA performs the first oxidation in the KT2440 choline-to-glycine-betaine pathway.
    action: NEW
    reason: >-
      The accepted choline dehydrogenase activity and organism-specific
      betIBA pathway reconstruction support this missing process annotation.
    supported_by:
    - reference_id: PMID:17116241
      supporting_text: "the betBA genes were required for choline"
