- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IC
  original_reference_id: file:PSEPK/mdh/mdh-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: Proposed process annotation for the NAD-dependent malate-to-oxaloacetate step of the TCA cycle, absent from GOA.
    action: NEW
    reason: Mdh catalyzes the malate-to-oxaloacetate oxidation, itself a step of the TCA cycle, so it does the work of the process when that step runs through the NAD-linked enzyme. KT2440 also carries three malate:quinone oxidoreductases, and the pathway report argues that the quinone branch may carry most oxidative flux; that is a question of how much of the step Mdh carries, not of whether it catalyzes a TCA-cycle reaction. Inferred by curator from the accepted L-malate dehydrogenase (NAD+) activity.
    supported_by:
    - reference_id: file:PSEPK/mdh/mdh-deep-research-openscientist.md
      supporting_text: Within this network, *mdh* performs the last oxidative step of the TCA cycle, regenerating oxaloacetate to condense with acetyl-CoA at citrate synthase.
    - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__tca_cycle__ppu00020-deep-research-openscientist.md
      supporting_text: Biochemical evidence from close relatives — *P. aeruginosa* and *P. pseudoalcaligenes* — shows that NAD-MDH activity is often undetectable and that MQO is the physiologically dominant, and sometimes essential, route for malate oxidation.
