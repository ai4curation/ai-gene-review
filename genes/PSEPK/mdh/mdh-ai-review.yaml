- term:
    id: GO:0004459
    label: L-lactate dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: TreeGrafter over-propagation from the LDH/MDH superfamily; this protein is a malate dehydrogenase, not a lactate dehydrogenase.
    action: REMOVE
    reason: This TreeGrafter IEA follows from PANTHER grafting Q88Q44 into the L-lactate dehydrogenase subfamily (PTHR43128:SF16) of the shared LDH/MDH superfamily. InterPro places it in the type-3 malate dehydrogenase family (Malate_DH_type3, IPR011275), and it retains the active-site loop arginine that confers C4-dicarboxylate (malate/oxaloacetate) rather than lactate/pyruvate specificity. L-lactate dehydrogenase activity has not been reported for this protein and is argued against by that specificity determinant, so this is an over-propagated electronic inference to remove.
    supported_by:
    - reference_id: file:PSEPK/mdh/mdh-deep-research-openscientist.md
      supporting_text: including the specificity-determining active-site loop arginine that discriminates the C4 dicarboxylate (malate/oxaloacetate) from the C3 substrate (lactate/pyruvate) of the homologous lactate dehydrogenases.
