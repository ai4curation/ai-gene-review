taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: AlgK is an outer-membrane-anchored periplasmic repeat protein of the Pseudomonas
  putida KT2440 alginate modification/export machinery. The target AlgK–AlgX complex has been
  structurally characterized, and isolated AlgK directly binds alginate oligosaccharides.
  Related Pseudomonas studies support lipid anchoring, correct positioning of the AlgE pore
  and coupling to the synthase apparatus. The complete AlgEKX assembly and the detailed polymer
  route remain modeled; AlgK is not a polymerase or acetyltransferase.
