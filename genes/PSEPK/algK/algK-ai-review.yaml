suggested_questions:
- question: Do native KT2440 localization and secretion phenotypes confirm the assembly role
    supported by its direct AlgKX structure and polymer-binding assays?
- question: Does P. putida AlgK organize the same AlgEKX outer-membrane complex in vivo, and
    is the AlgK-AlgX interface (AlgX N-terminus to AlgK TPRs 9-10) required for alginate export
    in KT2440?
suggested_experiments:
- description: Generate a KT2440 algK deletion and complement strain and measure alginate
    polymer production, polymer molecular weight, and AlgE outer-membrane localization, testing
    whether loss of AlgK yields low-molecular-weight uronic acids and AlgE mislocalization
    as seen in P. aeruginosa.
  experiment_type: alginate production and AlgE localization assay
- description: Test native KT2440 AlgK–AlgE contacts and the effects of AlgK–AlgX interface
    substitutions on localization and export, extending the already established purified KT2440
    AlgKX complex.
  experiment_type: protein-protein interaction and complex-assembly assay
