  findings:
  - statement: AlgK is an outer-membrane-anchored periplasmic TPR/Sel1-like repeat scaffold
      protein required for alginate export.
    supporting_text: AlgK is an outer-membrane (OM)–anchored, periplasmic TPR/Sel1-like repeat
      protein
  - statement: AlgK is a non-catalytic assembly/scaffolding factor, not an enzyme; it is essential
      for efficient alginate polymer production and export.
    supporting_text: AlgK is not an enzyme catalyzing a chemical reaction; rather, it is a
      **non-catalytic assembly/scaffolding factor** essential for efficient alginate polymer
      production and export.
  - statement: AlgK connects the OM export channel AlgE with periplasmic modifying enzyme
      AlgX and the inner-membrane polymerization components Alg8/Alg44.
    supporting_text: connects the OM export channel (AlgE) with periplasmic modifying enzymes
      (notably AlgX) and IM polymerization components (Alg8/Alg44)
  - statement: A 2.5 A crystal structure of the AlgK-AlgX complex was solved using P. putida
      proteins, providing direct P. putida evidence for the AlgK-AlgX scaffold interface.
    supporting_text: a **2.5 Å crystal structure of the AlgK–AlgX complex** was solved using
      the *Pseudomonas putida* proteins, defining a direct interface (AlgX N-terminus with
      AlgK TPRs 9–10)
  - statement: AlgK is tethered to the outer membrane via N-terminal lipidation, confirmed
      by in vivo palmitate labeling and outer-membrane fractionation in P. aeruginosa.
    supporting_text: 'in vivo lipidation** was confirmed by palmitate labeling,

      - AlgK localized to **outer-membrane–enriched fractions** by sucrose-gradient fractionation,'
  - statement: Loss of algK causes AlgE mislocalization, indicating AlgK positions/stabilizes
      the AlgE export porin in the secretion machinery.
    supporting_text: algK deletion caused **AlgE mislocalization** to both inner and outer
      membrane fractions instead of being exclusively OM-localized
  - statement: algK deletion mutants fail to export high-molecular-weight alginate and instead
      secrete low-molecular-weight uronic acids (AlgL degradation products).
    supporting_text: ΔalgK mutants fail to export high-molecular-weight alginate** and instead
      show secretion of **low-molecular-weight uronic acids**
  - statement: No KT2440 (PP_1285/Q88NC7)-specific wet-lab paper was retrieved; KT2440 function
      is inferred by orthology from the conserved AlgK family.
    supporting_text: no KT2440 (PP_1285/Q88NC7)-specific wet-lab paper** was retrieved
