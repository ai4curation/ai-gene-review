id: Q88JP1
gene_symbol: PP_2608
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_2608 encodes RifI2, an experimentally characterized member of the
  shikimate-dehydrogenase structural family with unusual substrate and cofactor
  preferences. Purified RifI2 has much lower activity with shikimate than the
  canonical biosynthetic AroE enzyme, strongly prefers NAD(+) over NADP(+), and
  has only trace activity with quinate. Its structure was solved in complex with
  NAD(+) and Mn(2+). These results establish an NAD-dependent
  shikimate-dehydrogenase-like oxidoreductase activity, but do not establish a
  physiological role in chorismate biosynthesis or shikimate metabolism.
existing_annotations:
- term:
    id: GO:0004764
    label: shikimate 3-dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The experimentally characterized protein is RifI2, which has low activity
      with shikimate and strongly prefers NAD(+) rather than NADP(+).
    action: MODIFY
    reason: >-
      The shikimate substrate component is experimentally detectable, but the
      NADP-specific GO term contradicts the measured cofactor preference. A
      broader NAD/NADP-dependent alcohol-group oxidoreductase term captures the
      demonstrated chemistry without assigning the wrong cofactor or claiming
      canonical AroE activity; the direct biochemical study is identified in the
      UniProt record as PMID:23142411.
    proposed_replacement_terms:
    - id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    additional_reference_ids:
    - file:PSEPK/PP_2608/PP_2608-uniprot.txt
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      RifI2 is a soluble enzyme lacking signal-peptide or transmembrane features,
      so a cytosolic location is consistent with its sequence and purified
      biochemical behavior.
    action: ACCEPT
    reason: >-
      The localization is a reasonable phylogenetic inference and is not
      contradicted by the structural or sequence evidence.
- term:
    id: GO:0009423
    label: chorismate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Family propagation places PP_2608 in chorismate biosynthesis, but direct
      characterization identifies it as the divergent RifI2 enzyme rather than a
      canonical biosynthetic AroE.
    action: REMOVE
    reason: >-
      RifI2 has atypically low shikimate activity and NAD(+) preference, and the
      study does not establish a physiological role in chorismate biosynthesis.
      P. putida also encodes multiple canonical AroE-family candidates, so the
      whole-pathway assignment is an unsupported paralog-level inference
      (direct-study citation PMID:23142411 in the UniProt record).
    additional_reference_ids:
    - file:PSEPK/PP_2608/PP_2608-uniprot.txt
- term:
    id: GO:0019632
    label: shikimate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      RifI2 can oxidize shikimate in vitro, but this low-efficiency activity does
      not establish that shikimate metabolism is its physiological process.
    action: REMOVE
    reason: >-
      This biological-process annotation overinterprets family membership and an
      in vitro side activity. The experimentally characterized protein belongs to
      the divergent RifI class, and its in vivo substrate and pathway remain
      unresolved (direct-study citation PMID:23142411 in the UniProt record).
    additional_reference_ids:
    - file:PSEPK/PP_2608/PP_2608-uniprot.txt
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      The crystallographic and kinetic evidence instead supports NAD(+) binding
      and a strong preference for NAD(+) over NADP(+).
    action: MODIFY
    reason: >-
      NADP binding is a family-propagated cofactor assignment contradicted by the
      directly characterized cofactor preference and the NAD(+)-bound 4K28
      structure. Replace it with NAD binding; the structural study is identified
      in the UniProt record as PMID:23142411.
    proposed_replacement_terms:
    - id: GO:0051287
      label: NAD binding
    additional_reference_ids:
    - file:PSEPK/PP_2608/PP_2608-uniprot.txt
core_functions:
- description: >-
    NAD-dependent shikimate-dehydrogenase-family oxidoreductase (RifI2) with
    experimentally observed low activity toward shikimate; its physiological
    substrate and biological pathway remain unresolved.
  molecular_function:
