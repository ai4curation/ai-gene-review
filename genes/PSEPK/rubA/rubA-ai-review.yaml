  title: OpenScientist gene research for rubA
  findings:
  - statement: OpenScientist supports RubA as a cytosolic one-electron rubredoxin carrier and flags the alkane catabolism annotation as over-propagated for KT2440 because the strain lacks an alkane monooxygenase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified the Q88C68/PP_5315 identity, short cytosolic rubredoxin-carrier
      assignment, and KT2440 genome check for absence of AlkB/KO K00496. The
      sidecar is the sole source contradicting UniProt's alkane-catabolism
      pathway transfer, while leaving the physiological terminal electron
      acceptor unresolved.
