    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct, but not novel. The query is an integral membrane protein with six predicted
      alpha-helical transmembrane segments, no signal peptide and no beta-barrel character
      (DeepTMHMM; Phobius in UniProt). Its helices align to those of the E. coli family member
      YedI (65.8% identity), which is annotated as a multi-pass inner-membrane protein.
      GO:0005886 is already in GOA for Q88F06 as an IEA from PANTHER/TreeGrafter. No more
      specific curated location exists, so LSP does not apply. The call proposes no molecular
      function or process term, which is right: no DUF808 protein has a demonstrated activity,
      and KT2440 fitness data show no phenotype.
