description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_CP015876.1_1546 is "YedI-family integral inner membrane protein of unknown molecular
  function" (tier B, Prior-annotated), with one GO term, GO:0005886 plasma membrane. The
  exact-sequence UniProt entries are deleted, so the call is scored on the KT2440
  reference-proteome entry Q88F06 (PP_4294). The two are 97.0% identical over all 304 residues.
  GOA already has GO:0005886 for Q88F06 (IEA, TreeGrafter from PANTHER PTN000766748).
  The call is correct and appropriately cautious. The query is a DUF808/PF05661 protein with six
  DeepTMHMM transmembrane helices that align to the predicted helices of E. coli YedI (P46125),
  an inner-membrane protein 65.8% identical to the query. No family member has a known activity.
  The annotator correctly rejected the ABC transporter, GGDEF and DNA-repair labels. These came
  from PaperBLAST and STRING text about distant homologs, and the DNA-repair label goes back to a
  single overexpression result for V. cholerae MutK (PMID:9922251). The annotator did not see
  KT2440 fitness data: PP_4294 has no phenotype in 300 experiments and no strong cofitness
  partner, which is consistent with "unknown function". Recommended dashboard verdict:
  supported. Corrected annotation (wording only): "YedI/DUF808 family integral inner membrane
  protein (6 TM), molecular function unknown".
