- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt P46125 (E. coli YedI) for topology. Only the abstract was read; the
      YedI-specific C-terminus result is in supplementary data that was not checked, and the
      UniProt topological domains for P46125 carry predicted (ECO:0000255) evidence.
  findings:
  - statement: Large-scale C-terminal reporter fusion study defining topology of E. coli inner-membrane proteins, the context for the inner-membrane annotation of E. coli YedI.
    supporting_text: Using C-terminal tagging with the alkaline phosphatase and green fluorescent protein, we established the periplasmic or cytoplasmic locations of the C termini for 601 inner membrane proteins.
- id: PMID:9922251
  title: 'The mutK gene of Vibrio cholerae: a new gene involved in DNA mismatch repair.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Origin of the COG2354 "may be involved in DNA repair" label. MutK (Q9ZAK8, 163 aa) carries
      PF05661/DUF808 but is half the length of YedI-family proteins. The anti-mutator effect was
      seen only on heterologous overexpression in E. coli repair mutants, and the knockout had no
      phenotype. A membrane protein acting directly in mismatch repair is implausible, and no
      follow-up exists, so no DNA-repair term is transferred.
  findings:
  - statement: Cloned MutK lowered spontaneous mutation frequency in E. coli mismatch-repair mutants.
    supporting_text: The product of the mutK gene cloned in either high- or low-copy-number vectors can reduce the spontaneous mutation frequency of Escherichia coli mutS, mutL, mutU, and dam mutants.
  - statement: A chromosomal mutK knockout had no mutator phenotype.
    supporting_text: The spontaneous mutation frequency of a chromosomal mutK knockout mutant was almost identical to that of wild-type V. cholerae cells
