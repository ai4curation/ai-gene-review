    summary: Plasma (inner) membrane localization is well supported by the predicted six-helix integral membrane topology and by family membership with E. coli YedI, an inner-membrane protein.
    action: ACCEPT
    reason: >-
      The query and PP_4294 have six predicted alpha-helical transmembrane segments and no signal
      peptide (DeepTMHMM on the dashboard sequence; Phobius in UniProt). The helix positions align
      to those predicted for E. coli YedI (P46125, 65.8% identity), which is annotated as a
      multi-pass inner-membrane protein and was part of the E. coli inner-membrane topology study
      (PMID:15919996). The PANTHER/TreeGrafter transfer is therefore sound. It is the only
      defensible GO annotation for this protein, and it is the core (location-only) function
      recorded below.
