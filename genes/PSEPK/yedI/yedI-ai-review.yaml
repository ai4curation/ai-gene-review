core_functions:
- description: >-
    Integral inner (cytoplasmic) membrane protein of the YedI/DUF808 family, with six predicted
    transmembrane helices and a cytoplasmic N-terminal region. Its molecular function and
    biological process are unknown. There is no characterized family member and no KT2440
    fitness phenotype. A DNA-repair role (from V. cholerae MutK) is not supported.
  locations:
