description: >-
  PP_4294 (yedI) is a 304-residue integral inner-membrane protein of the YedI/DUF808 family
  (Pfam PF05661, PIRSF016660, PANTHER PTHR30503). It has a soluble, charged N-terminal region
  of about 65 residues followed by six predicted transmembrane helices arranged as three
  closely spaced hairpins (DeepTMHMM 66-83, 87-107, 147-165, 174-195, 231-251, 273-293), with
  both termini predicted cytoplasmic. Phobius in UniProt merges the first hairpin into one
  long segment (71-100); the helix positions match those of E. coli YedI (P46125), to which it
  is 65.8% identical over 298 aligned residues. No member of the family has a known molecular
  function. E. coli YedI, the only Swiss-Prot member, is annotated only as a multi-pass
  inner-membrane protein. The COG2354 label "may be involved in DNA repair" traces to Vibrio
  cholerae MutK, a 163-residue DUF808 fragment whose overexpression lowered mutation frequency
  in E. coli mismatch-repair mutants, while the chromosomal knockout had no mutator phenotype
  (PMID:9922251). That is indirect, heterologous evidence and is not transferred. In KT2440,
  transposon mutants of PP_4294 have no fitness phenotype in 300 Fitness Browser experiments
  (all |fitness| < 0.6), and its strongest cofitness partner reaches only r = 0.31, so the
  fitness data give no functional clue. The gene is divergent from a TetR-family regulator
  (PP_4295), a pairing conserved in other pseudomonads, and lies near purine and glyoxylate
  catabolism genes (uacT, gcl, hyi), but no link to these pathways has been shown. Function:
  unknown; localization: plasma membrane.
