suggested_questions:
- question: >-
    What does the conserved YedI/DUF808 membrane protein do? Does it have transport or
    membrane-enzyme activity, and is its expression controlled by the divergently encoded
    TetR-family regulator PP_4295?
suggested_experiments:
- description: >-
    Measure PP_4294 expression in a PP_4295 deletion strain. Screen a PP_4294 deletion and an
    overexpression strain for phenotypes under conditions not yet in the Fitness Browser set,
    including purine/urate and glyoxylate-pathway substrates suggested by the neighbourhood.
    Map topology with PhoA/GFP fusions.
  experiment_type: genetic and expression analysis
