    supporting_text: FAD lies in a cleft between the two subunits, with most of the FAD molecule residing in
      the C-terminal portion of the alpha subunit.
core_functions:
- description: >-
    FAD-binding alpha subunit of the PP_0312/PP_0313 ETF heterodimer, inferred from conserved synteny and orthology
    to receive electrons from the DgcAB dimethylglycine dehydrogenase system, probably via the DgcB ferredoxin.
    The electron-transfer activity belongs to the heterodimer; its terminal acceptor is unresolved. The specific
    DgcB donor and respiratory acceptor are proposed partners; the cited primary work did not reconstitute their
    electron transfer.
  molecular_function:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  contributes_to_molecular_function:
    id: GO:0009055
    label: electron transfer activity
  supported_by:
  - reference_id: PMID:32631860
    supporting_text: the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG
      degradation to sarcosine.
  - reference_id: file:PSEPK/PP_0312/PP_0312-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: InterPro; IPR014731; ETF_asu_C.
  - reference_id: PMID:32631860
    supporting_text: a possible reaction mechanism of DdhC toward DMG was proposed
  knowledge_gaps:
  - gap_statement: Direct electron transfer from reduced KT2440 DgcB to PP_0312/PP_0313 has not been
      reconstituted.
    gap_kind:
    - BIOLOGY
    significance: Biochemical reconstitution is needed to establish the donor, kinetics, and terminal
      acceptor.
proposed_new_terms: []
suggested_questions:
- question: What respiratory-chain component accepts electrons from the PP_0312/PP_0313 ETF heterodimer?
- question: >-
    GO:0045251 electron transfer flavoprotein complex is defined as facilitating
    electron transfer from an acyl-CoA molecule to ubiquinone. Should the
    definition be broadened so it can also describe ETF heterodimers with other
    donors, such as this dimethylglycine-locus ETF?
suggested_experiments:
- description: Reconstitute reduced DgcB with PP_0312/PP_0313 and candidate downstream acceptors while
    monitoring electron transfer.
- description: >-
    Delete PP_0312 in KT2440 and test growth on dimethylglycine, sarcosine and
    long-chain fatty acids, to separate the dgc-locus ETF from the PP_4201-PP_4202
    pair.
