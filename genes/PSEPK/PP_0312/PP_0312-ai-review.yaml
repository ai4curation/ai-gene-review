  review:
    summary: Appropriate molecular function for an ETF alpha subunit.
    action: ACCEPT
    reason: >-
      Combined automated annotation (GO_REF:0000120) from the InterPro
      IPR001308 ETF alpha/FixB family mapping and PANTHER node PTN002249443.
      The ETF alpha/FixB family assignment (InterPro, Pfam ETF_alpha, PANTHER
      PTHR43153) and the conserved placement beside DgcAB support electron
      transfer as the intrinsic function: ETF is an electron carrier between
      flavoprotein dehydrogenases and respiratory acceptors (PMID:8962055),
      and the 65.5%-identical Chromohalobacter ortholog EtfA is genetically
      required for dimethylglycine degradation (PMID:32631860). This is
      family-level and orthology inference without a KT2440 assay. The
      UniProt SIMILARITY line rests only on an ARBA rule and is not cited. As
      in the human ETFA review, core_functions records the activity as
      contributes_to_molecular_function because it belongs to the heterodimer;
      the GOA term itself is correct.
    supported_by:
