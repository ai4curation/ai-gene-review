id: Q88R22
gene_symbol: PP_0312
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_0312 is the alpha subunit of a heterodimeric electron-transfer flavoprotein
  encoded immediately downstream of the DgcAB dimethylglycine dehydrogenase
  system. It binds FAD and, together with PP_0313, is inferred to accept
  reducing equivalents during dimethylglycine conversion to sarcosine. The
  pathway assignment is supported by conserved locus organization and the
  genetically required Chromohalobacter four-gene locus and conserved synteny
  rather than by direct reconstitution of the KT2440 proteins.
existing_annotations:
  - term:
      id: GO:0009055
      label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Appropriate molecular function for an ETF alpha subunit.
      action: ACCEPT
      reason: >-
        The ETF alpha/FixB family assignment and conserved placement beside
        DgcAB support electron transfer as the intrinsic function.
      supported_by:
        - reference_id: file:PSEPK/PP_0312/PP_0312-uniprot.txt
          supporting_text: "CC   -!- SIMILARITY: Belongs to the ETF alpha-subunit/FixB family."
  - term:
      id: GO:0033539
      label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: The generic ETF-family pathway propagation is inappropriate for this dedicated paralog.
      action: REMOVE
      reason: >-
        PP_0312 lies in the DgcAB dimethylglycine-catabolism locus, and the
        analogous four-gene system is required for dimethylglycine degradation
        in Chromohalobacter. This is locus-based paralog inference, but no
        evidence specifically connects PP_0312 to fatty-acid beta oxidation.
      supported_by:
        - reference_id: PMID:32631860
          supporting_text: "the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
  - term:
      id: GO:0050660
      label: flavin adenine dinucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: FAD binding is a conserved property of ETF alpha subunits.
      action: ACCEPT
      reason: The ETF alpha-subunit fold contains the flavin-binding portion of the heterodimer.
