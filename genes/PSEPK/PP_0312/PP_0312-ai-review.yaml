id: Q88R22
gene_symbol: PP_0312
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0312 is the alpha subunit of a heterodimeric electron-transfer
  flavoprotein (ETF) encoded immediately downstream of dgcA and dgcB, the two
  subunits of the DgcAB dimethylglycine dehydrogenase system, and beside the
  beta-subunit gene PP_0313. It belongs to the ETF alpha-subunit/FixB family
  and carries the ETF alpha C-terminal domain that binds FAD. With PP_0313 it is
  thought to accept reducing equivalents generated during dimethylglycine
  conversion to sarcosine and pass them toward the respiratory chain. This
  assignment rests on the conserved dgcA-dgcB-ETF gene arrangement and on
  genetics of the orthologous locus in Chromohalobacter salexigens, not on
  biochemistry of the KT2440 proteins. KT2440 encodes a second ETF pair,
  PP_4201-PP_4202, from which PP_0312 is clearly divergent in sequence.
