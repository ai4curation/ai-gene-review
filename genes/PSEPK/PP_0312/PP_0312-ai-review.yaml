id: Q88R22
gene_symbol: PP_0312
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Predicted alpha subunit of a second electron-transfer flavoprotein (ETF)
  pair, encoded adjacent to the beta-subunit gene PP_0313. PP_0312 contains ETF
  alpha and FAD-binding-family domains and is expected to contribute the flavin
  center of the heterodimeric electron carrier. The PP_0312-PP_0313 pair lies
  immediately downstream of dgcA (PP_0310) and dgcB (PP_0311), the two subunits
  of dimethylglycine dehydrogenase (EC 1.5.8.-, i.e. an oxidoreductase acting on
  a CH-NH donor with a flavin acceptor), and KEGG assigns all four genes to
  glycine, serine and threonine metabolism (ppu00260) together with the
  glycine-betaine and sarcosine oxidation genes gbcAB and soxABDG. The locus
  therefore points to methylated-glycine oxidation as the likely donor pathway
  for this ETF pair, though the donor-acceptor pairing has not been demonstrated
  experimentally.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0312 is a predicted ETF alpha subunit carrying the redox-active flavin
      of the heterodimeric carrier; electron transfer activity is the defining
      molecular function of the ETF alpha/FixB family.
    action: ACCEPT
    reason: >-
      Electron transfer activity is the core molecular function of an ETF alpha
      subunit, and GO's convention for an obligate subunit of a multi-protein
      carrier is to ACCEPT the enables annotation while recording the
      subunit-level dependency as contributes_to_molecular_function in
      core_functions, as this review does. The completed ortholog reviews in
      this repository (genes/human/ETFA, genes/human/ETFB) ACCEPT enables
      GO:0009055 on the same term. The previous MARK_AS_OVER_ANNOTATED call was
      inconsistent with that convention.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The TreeGrafter annotation assigns this second ETF alpha subunit
      specifically to fatty-acid beta-oxidation using acyl-CoA dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ETF family membership alone does not show that fatty-acid beta-oxidation
      is this pair's physiological pathway, and the genomic context argues
      positively against it: PP_0312-PP_0313 lie immediately downstream of the
      dimethylglycine dehydrogenase subunit genes dgcA (PP_0310) and dgcB
      (PP_0311), which are EC 1.5.8.- enzymes and therefore ETF-dependent by
      definition, and KEGG places all four in glycine, serine and threonine
      metabolism (ppu00260) rather than in fatty-acid degradation. The
      TreeGrafter term is thus a family-level default that conflicts with the
      donor actually encoded next to this pair. Note that KT2440's fatty-acid
      beta-oxidation electrons are instead expected to reach the quinone pool
      via the etfA-etfB-PP_4203 locus.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0312 contains the ETF alpha/FixB and FAD-binding-family architecture
      expected for the flavin-bearing subunit of an ETF pair.
    action: ACCEPT
    reason: >-
      FAD binding is a direct predicted property of this alpha polypeptide and
      is supported by its conserved ETF alpha domain architecture.
