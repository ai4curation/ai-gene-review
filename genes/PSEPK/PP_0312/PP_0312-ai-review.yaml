      supporting_text: "DR   InterPro; IPR001308; ETF_a/FixB."
    - reference_id: file:PSEPK/PP_0312/PP_0312-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00766; ETF_alpha; 1."
    - reference_id: file:PSEPK/PP_0312/PP_0312-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR43153; ELECTRON TRANSFER FLAVOPROTEIN ALPHA; 1."
    - reference_id: PMID:8962055
      supporting_text: They function as electron shuttles between primary flavoprotein dehydrogenases involved
        in mitochondrial fatty acid and amino acid catabolism and the membrane-bound electron transfer
        flavoprotein ubiquinone oxidoreductase.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002249443
  review:
    summary: >-
      TreeGrafter pathway transfer from a PAINT IBD seeded by human ETFA; the
      dimethylglycine-locus ETF paralog is not supported in this specific
      acyl-CoA dehydrogenase partnership, though it is not shown to be
      excluded from it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      TreeGrafter IEA (GO_REF:0000118): Q88R22 is grafted to PTN002249443 and inherits the GO:0033539 IBD that PAINT
      placed on PTN000097951 in PTHR43153, supported by human ETFA (P13804) with no taxon constraint in the family
      PAINT file. GO defines the term as beta-oxidation in which "the initial step of each oxidation cycle, which
      converts an acyl-CoA to a trans-2-enoyl-CoA, is catalyzed by acyl-CoA dehydrogenase", so it names a specific
      donor partnership. Reading the phylogeny: KT2440 has two ETF alpha genes, PP_0312 and PP_4201, both placed
      in PTHR43153:SF1, but they belong to different paralog groups. PP_4201 is 62.1% identical to the human seed,
      whereas PP_0312 is 33.1% identical to human ETFA and 65.5% identical to the Chromohalobacter dgc-locus EtfA
      (file:PSEPK/PP_0312/PP_0312-bioinformatics/RESULTS.md). The matching PAINT IBD in the beta family PTHR21294
      (PTN000480319) is restricted to Eukaryota, so PAINT itself does not assert this process for bacterial ETF
      beta subunits, including the partner PP_0313. The locus evidence points to a different donor: PP_0312 sits
      downstream of dgcA-dgcB, and the orthologous four-gene locus is genetically required for dimethylglycine degradation
      in Chromohalobacter (PMID:32631860). That is positive evidence for a different assignment, but not evidence
      that PP_0312 cannot act in beta-oxidation. ETFs can serve several dehydrogenases, and no KT2440 test with
      an acyl-CoA dehydrogenase has been reported. The row therefore attributes more pathway membership than the
      evidence supports without being demonstrably false. It is marked over-annotated rather than removed, as recorded
      in the TreeGrafter re-review (projects/TREEGRAFTER/rereview-2026-09-24/batch-02.yaml). This judgment challenges
      the breadth of the ancestral donor-partnership inference, not the number of experimental seeds. The current
      paint-losses helper cannot resolve Q88R22 as a tree leaf, so no target-lineage loss conclusion is drawn.
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
        csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine.
    - reference_id: file:PSEPK/PP_0312/PP_0312-bioinformatics/RESULTS.md
      supporting_text: The dgc-locus ETF is therefore a distinct paralog group conserved between the two
        genera, not the ortholog of the human acyl-CoA-dehydrogenase ETF.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002249443
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Graft node inheriting the PTHR43153 GO:0033539 IBD on PTN000097951, supported by human ETFA; the target
          belongs to the divergent dimethylglycine-locus ETF paralog group with a different expected electron donor.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001308
  - PANTHER:PTN002249443
  review:
    summary: FAD binding is a conserved property of ETF alpha subunits.
    action: ACCEPT
    reason: >-
      Combined automated annotation (GO_REF:0000120) from the InterPro
      IPR001308 mapping and the PANTHER node. PP_0312 has the ETF alpha
      C-terminal domain (InterPro IPR014731, Pfam ETF_alpha), which in the
      human ETF structure holds most of the single FAD (PMID:8962055). Its
      Chromohalobacter ortholog carries Swiss-Prot FAD-binding residues by
      similarity. FAD binding has not been measured for PP_0312; the claim
      rests on conserved domain architecture.
    supported_by:
    - reference_id: file:PSEPK/PP_0312/PP_0312-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR014731; ETF_asu_C.
    - reference_id: PMID:8962055
      supporting_text: FAD lies in a cleft between the two subunits, with most of the FAD molecule residing in
        the C-terminal portion of the alpha subunit.
