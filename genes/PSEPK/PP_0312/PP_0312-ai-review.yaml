id: Q88R22
gene_symbol: PP_0312
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Predicted alpha subunit of a second electron-transfer flavoprotein (ETF)
  pair, encoded adjacent to the beta-subunit gene PP_0313. PP_0312 contains ETF
  alpha and FAD-binding-family domains and is expected to contribute the flavin
  center of the heterodimeric electron carrier. Its physiological donor
  dehydrogenase and associated catabolic pathway have not been established.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0312 is a predicted ETF alpha subunit and is expected to participate
      in electron transfer when assembled with the adjacent beta subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The family assignment supports contribution to ETF activity, but not
      independent execution of the complete electron-transfer function by the
      alpha polypeptide.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The TreeGrafter annotation assigns this second ETF alpha subunit
      specifically to fatty-acid beta-oxidation using acyl-CoA dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      No donor specificity is established for the PP_0312/PP_0313 pair. ETF
      family membership alone does not show that fatty-acid beta-oxidation is
      its physiological pathway.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_0312 contains the ETF alpha/FixB and FAD-binding-family architecture
      expected for the flavin-bearing subunit of an ETF pair.
    action: ACCEPT
    reason: >-
      FAD binding is a direct predicted property of this alpha polypeptide and
      is supported by its conserved ETF alpha domain architecture.
