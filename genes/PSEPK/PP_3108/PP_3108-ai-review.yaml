- term:
    id: GO:0031640
    label: killing of cells of another organism
  evidence_type: IC
  original_reference_id: PMID:28045455
  qualifier: involved_in
  review:
    summary: >-
      New annotation, inferred by the curator. The K1-T6SS kills a broad range of bacteria.
      Tke2 is a toxic effector that this system secretes, and Tki2 neutralises it. No tke2
      deletion has been tested in competition, so Tke2's own share of the killing is not
      measured.
    action: NEW
    reason: >-
      The annotation is curator inference (IC) from the demonstrated toxicity and the
      T6SS-dependent secretion. The authors' statement that Tke2 contributes to antibacterial
      activity rests on the same evidence. It is not based on a tke2-specific killing phenotype.
    supported_by:
    - reference_id: PMID:28045455
      supporting_text: >-
        We show that the K1-T6SS is a potent antibacterial device, which secretes a toxic
        Rhs-type effector Tke2. Remarkably, P. putida eradicates a broad range of bacteria in
        a K1-T6SS-dependent manner
    - reference_id: PMID:28045455
      supporting_text: >-
        Here we show that suitable preys for the K1-T6SS are bacterial cells, and that the Tke2
        toxin contributes to the antibacterial activity.
core_functions:
- description: >-
    Specialized PAAR-Rhs antibacterial effector of the K1-T6SS. The N-terminal class I
    prePAAR and PAAR region loads Tke2 onto the VgrG1 spike, helped by the adjacent Eag-family
    chaperone PP_3107. The Rhs/YD-repeat shell encapsulates the C-terminal HNH/colicin-like
    nuclease toxin domain, which is delivered into competing bacteria and neutralised in
    sister cells by the immunity protein Tki2 (PP_3109).
