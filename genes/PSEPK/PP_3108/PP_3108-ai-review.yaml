taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_3108 encodes Tke2, a 1,385-residue "specialized" type VI secretion system (T6SS)
  effector of the polymorphic-toxin PAAR-Rhs class. It is encoded in the vgrG1 operon of
  the KT2440 K1-T6SS cluster, after vgrG1 (PP_3106) and a DUF1795/Eag-family chaperone gene
  (PP_3107), and upstream of its immunity gene tki2 (PP_3109). The locus-tag assignment rests
  on this gene order and on UniProt/PaperBLAST; the papers name the gene only as tke2. The
  architecture is a class I prePAAR region (residues 1-58) with a hydrophobic, putatively
  transmembrane stretch, a PAAR motif (about 69-140) that caps the VgrG spike, a DUF6531
  domain, an Rhs/YD-repeat shell ending in the VTQDPIGL (DPxGL) motif at residue 1249, and a
  roughly 110-130-residue C-terminal toxin domain. The toxin domain is an HNH/colicin
  E7/pyocin S1-like DNase of the His-Me finger superfamily (InterPro IPR037146). Bernal et
  al. 2017 showed that Tke2 is secreted in a K1-T6SS-dependent manner and that its expression
  in E. coli inhibits growth, which is rescued by co-expression of Tki2. Its toxicity is
  therefore established, while its nuclease activity is inferred from the domain and has not
  been assayed. KT2440 kills a broad range of competitors, including phytopathogens, through
  the K1-T6SS. The dashboard protein NZ_SPUT01000035.1_2 (P. putida KB3, WP_135192713.1) is
  recorded here as an alias because it is the same locus (89.9% identity overall). It shares
  the N-terminal delivery module with PP_3108 (prePAAR and PAAR 98.9-100% identical, Rhs shell
  95.6%) but carries a different C-terminal toxin, an LHH-family nuclease domain only 21.6%
  identical to PP_3108, and a different immunity gene. Toxin-specific statements here apply to
  KT2440 Tke2 only.
existing_annotations:
- term:
    id: GO:0004519
    label: endonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR037146
  review:
    summary: >-
      This term comes from the InterPro colicin/pyocin DNase superfamily (IPR037146), which
      matches the C-terminal toxin domain of PP_3108. Bernal et al. (2017) assign this domain
      to the HNH nuclease superfamily, close to colicin E7 and pyocin S1. They also showed that
      expressing Tke2 inhibits E. coli growth and that its immunity protein Tki2 neutralises the
      effect. Nuclease activity on DNA or RNA has not been measured for Tke2, so the term
      remains a domain-based inference. Endonuclease activity is the expected mechanism of the
      toxic domain and is general enough to be safe.
    action: ACCEPT
    reason: >-
      The domain assignment is consistent with the authors' description of Tke2 as a nuclease
      toxin and with its toxicity in E. coli. IEA is the appropriate evidence level, because no
      nuclease assay has been done. The substrate (DNA or RNA) is not established, so no more
      specific term is proposed.
    supported_by:
    - reference_id: PMID:28045455
      supporting_text: >-
        The C-terminal region of Tke2 or Tke4 (110 and 102 amino acid long, respectively)
        carries a cytotoxic domain. This domain is similar in both proteins and belongs to the
        HNH superfamily of nucleases, for example, colicin E7 and pyocin S1
    - reference_id: PMID:36748579
      supporting_text: the Tke2 nuclease toxin and its cognate immunity protein Tki2
    - reference_id: file:PSEPK/PP_3108/PP_3108-deep-research-claude-code.md
      supporting_text: No nuclease assay on Tke2 has been published.
- term:
    id: GO:0090729
    label: toxin activity
  evidence_type: IDA
  original_reference_id: PMID:28045455
  qualifier: enables
  review:
    summary: >-
      New annotation. Expressing tke2 in E. coli significantly impaired growth, and
      co-expressing tki2 (PP_3109) rescued it. Tke2 is secreted by the K1-T6SS, the system
      KT2440 uses to kill competing bacteria.
    action: NEW
    reason: >-
      This is the experimentally demonstrated activity of Tke2. The molecular target of the
      toxin is unknown, so the general term is used.
    supported_by:
    - reference_id: PMID:28045455
      supporting_text: >-
        On induction of the effector gene tke2, E. coli growth was significantly impaired
        (Figures 6a and b) but growth could readily be rescued on co-expression of the putative
        Tki2 immunity protein (Figures 6a and b). This suggests that Tke2/Tki2 is a genuine EI
        pair.
- term:
    id: GO:0033103
    label: protein secretion by the type VI secretion system
  evidence_type: IDA
  original_reference_id: PMID:28045455
  qualifier: involved_in
  review:
    summary: >-
      New annotation. A chromosomal Tke2-V5 fusion was detected in the culture supernatant of
      an rpoN background with an intact K1-T6SS, but not of the isogenic tssA1 mutant. Tke2 is
      a PAAR-domain ("specialized") effector. PAAR proteins sit at the tip of the VgrG spike,
      so Tke2 is both cargo and part of the secreted puncturing device. It is not just a
      passive substrate.
    action: NEW
    reason: >-
      T6SS-dependent export of Tke2 has been shown directly. Its N-terminal PAAR domain gives
      it a structural role in the secreted spike.
    supported_by:
    - reference_id: PMID:28045455
      supporting_text: >-
        Tke2 was produced in both the rpoN strain and the isogenic T6SS mutant (rpoNΔtssA1),
        but was only found in the supernatant of the strain with an intact T6SS (Figure 6c).
        Our results show that Tke2 is an effector of the K1-T6SS and its activity is
        antagonized by the Tki2 immunity protein.
    - reference_id: PMID:28045455
      supporting_text: >-
        Tke2 and Tke4 proteins share a similar structure, both containing an N-terminal PAAR
        motif
- term:
