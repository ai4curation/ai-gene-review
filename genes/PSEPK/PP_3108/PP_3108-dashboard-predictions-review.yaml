description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_SPUT01000035.1_2 (strain KB3, WP_135192713.1, 1409 aa) is "PAAR-containing Rhs-family
  type VI secretion system effector protein" (tier A), with one GO term, GO:0033103 protein
  secretion by the type VI secretion system. The exact-sequence UniProt entries are deleted,
  so the call is filed on KT2440 PP_3108 (Q88I91, Tke2), which is 89.9% identical over 1381
  aligned pairs. That figure is an average over two parts. The N-terminal delivery module is
  nearly identical to Tke2: prePAAR 100%, PAAR 98.9%, Rhs/YD shell 95.6%. The C-terminal toxin
  after the DPxGL motif is only 25% identical, and the query's LHH nuclease domain
  (PF14411, 1313-1397) has no significant similarity to the colicin/HNH-like Tke2 toxin. The
  gene directly downstream of the query, in the tki2 position, is unrelated to Tki2. The
  flanking DUF1795/Eag chaperone (100% identical to PP_3107) and VgrG (76.2% identical to
  VgrG1 PP_3106) match the KT2440 K1-T6SS vgrG1 operon. The call and its single GO term
  concern the delivery module, which transfers from Tke2: Tke2 is secreted K1-T6SS-dependently
  (PMID:28045455). The call is therefore correct, and it was right not to name a specific
  nuclease or deaminase activity. The Tke2 toxicity and Tki2 neutralisation data do not
  transfer to the query's toxin domain. GOA for Q88I91 holds only an IEA endonuclease
  annotation, so the process term is novel.
