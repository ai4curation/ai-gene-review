      but was only found in the supernatant of the strain with an intact T6SS (Figure 6c).
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0033103
    label: protein secretion by the type VI secretion system
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct for the dashboard sequence. Its N-terminal class I prePAAR,
      PAAR and Rhs shell are 95.6-100% identical to KT2440 Tke2 (PP_3108). Tke2 was found in
      the culture supernatant only when the K1-T6SS was intact (PMID:28045455). The query also
      lies in the same vgrG1-operon arrangement: an adjacent VgrG (76.2% identical to PP_3106)
      and a DUF1795/Eag chaperone 100% identical to PP_3107. PAAR proteins sit at the tip of
      the VgrG spike, so the protein takes part in T6SS secretion both as cargo and as a
      spike component. The transfer rests on this conserved delivery module and not on the
      toxin domain. The query's C-terminal LHH toxin differs from Tke2's, but secretion does
      not depend on the toxin domain. This is an inference by homology and synteny; secretion
      of the KB3 protein has not been observed. The term is absent from GOA for Q88I91 (GOA
      holds only an IEA endonuclease activity), so it is novel. The extractor's rationale, that
      effectors are the cargo of the system, understates the PAAR protein's structural role
      but reaches the right term.
    supported_by:
    - reference_id: PMID:28045455
      supporting_text: >-
        Tke2 was produced in both the rpoN strain and the isogenic T6SS mutant (rpoNΔtssA1),
        but was only found in the supernatant of the strain with an intact T6SS (Figure 6c).
    - reference_id: PMID:28045455
