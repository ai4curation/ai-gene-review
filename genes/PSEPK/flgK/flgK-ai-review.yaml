      supporting_text: 'SUBCELLULAR LOCATION: Bacterial flagellum'
    - reference_id: file:PSEPK/flgK/flgK-deep-research-falcon.md
      supporting_text: |-
        FlgK functions in the **extracellular axial structure** at the interface between hook and filament, i.e., outside the cytoplasm in the assembled flagellum.
- term:
    id: GO:0009288
    label: bacterial-type flagellum
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This cellular-component annotation is correct. FlgK is a component of the bacterial flagellum.
    action: ACCEPT
    reason: The broad flagellum term is appropriate and complements the more specific hook-associated annotation. The UniProt subcellular location line is an ARBA prediction, so the support is family membership (InterPro IPR002371 FlgK) plus comparative evidence that FlgK is a hook-filament junction protein of the flagellum in Salmonella; no P. putida localization experiment exists.
    supported_by:
