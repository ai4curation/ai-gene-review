      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR02492; flgK_ends; 1.'
    - reference_id: PMID:9168617
      supporting_text: hook-associated proteins HAP1 and HAP3 connect the flagellar filament to the
        hook and are required for the last stage of flagellar assembly
