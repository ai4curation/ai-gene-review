  label: Pseudomonas putida KT2440
description: flgK encodes flagellar hook-associated protein 1, a structural component of the hook-filament junction in the P. putida KT2440 bacterial flagellum. Its core role is flagellar structure and assembly rather than enzymatic activity.
existing_annotations:
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: This is the appropriate molecular-function annotation for FlgK. FlgK is a flagellar hook-associated structural protein, not an enzyme.
    action: ACCEPT
    reason: Structural molecule activity is the best current MF term for this flagellar junction component. Q88ES2 has not been assayed directly; the claim rests on its membership in the FlgK family (InterPro IPR002371 FlgK, NCBIfam TIGR02492 flgK_ends, PRINTS FLGHOOKAP1) and on comparative evidence from other bacteria that FlgK (HAP1) is the hook-filament junction protein that physically connects hook and filament (Borrelia and Salmonella papers, not P. putida).
    supported_by:
    - reference_id: file:PSEPK/flgK/flgK-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR002371; FlgK.'
