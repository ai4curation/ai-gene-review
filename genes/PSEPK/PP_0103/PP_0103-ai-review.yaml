description: PP_0103 encodes the aa3 cytochrome c oxidase subunit II that 
  accepts electrons from periplasmic cytochrome c in Pseudomonas putida KT2440. 
  The protein acts in a plasma-membrane terminal oxidase branch that reduces 
  oxygen to water and supports aerobic respiratory energy conservation. Its 
  subunit-specific role is distinguished from the emergent catalytic activity of
  the assembled oxidase complex.
