proposed_new_terms:
- proposed_name: RecA recombinase regulator activity
  proposed_definition: Modulates the activity of the RecA recombinase, for example by binding RecA nucleoprotein filaments to promote their disassembly or limit their extension, thereby regulating RecA-dependent DNA pairing, strand exchange, ATPase and co-protease activities.
  justification: >-
    GOA captures RecX only at the biological-process level (regulation of DNA
    repair), and the best existing molecular function for it is the generic
    GO:0030234. A RecA-specific enzyme-regulator term would represent the core
    molecular role described in UniProt and consistently reported in the
    RecX-family literature. Existing candidates were checked and none fits: the
    sibling GO:0120230 recombinase activator activity is sign-specific in the
    wrong direction, GO:0004857 enzyme inhibitor activity would over-commit on
    sign given that RecX's net effect on recombination is inhibitory in some
    bacteria and facilitative in others, and GO:0140776
    protein-containing complex destabilizing activity names a mechanism rather
    than a target and would not record that the regulated enzyme is RecA. A term
    at the requested granularity would also give PAINT a place to put the
    family-level assertion for PTHR33602, whose 21522 members resolve into a
    single subfamily.
  proposed_parent:
    id: GO:0030234
    label: enzyme regulator activity
  supported_by:
  - reference_id: file:PSEPK/recX/recX-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Modulates RecA activity
    reference_section_type: RESULTS
  - reference_id: file:PSEPK/recX/recX-deep-research-falcon.md
    supporting_text: suppresses RecA ATPase, DNA pairing, strand exchange, and co-protease activities
    reference_section_type: RESULTS
suggested_questions:
- question: Does KT2440 RecX inhibit RecA filament extension, promote disassembly, or modulate a different RecA activity in vivo, and is its net effect on homologous recombination inhibitory or facilitative as seen in some other bacteria?
- question: Is the recA-recX co-transcript the only form in which KT2440 recX is expressed, or is there a separate recX promoter that would let RecX levels be set independently of RecA during the SOS response?
- question: Would GO benefit from a sign-neutral molecular-function term for regulation of a named recombinase, given that GO:0120230 recombinase activator activity exists but has no inhibitory or sign-neutral counterpart?
suggested_experiments:
- hypothesis: KT2440 RecX acts as a negative modulator of RecA, so losing it raises RecA-dependent recombination and prolongs the SOS response, while overexpressing it does the reverse.
  description: Measure RecA filament dynamics (single-molecule or in-cell imaging) and DNA-damage survival/recombination phenotypes in recX deletion and overexpression strains of P. putida KT2440.
  experiment_type: RecA filament and DNA-damage survival assay
- hypothesis: KT2440 RecX binds RecA directly and the three tandem winged-helix modules of the 156-residue protein are the interaction surface.
  description: Purify recombinant PP_1630 and KT2440 RecA, test direct binding and the effect of RecX on RecA-mediated ATP hydrolysis and strand exchange in vitro, and map the interaction by truncating or substituting each of the three winged-helix modules.
  experiment_type: reconstituted biochemistry with structure-guided mutagenesis
