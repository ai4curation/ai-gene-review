id: Q88ME3
gene_symbol: recX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: recX encodes RecX (PP_1630), a small cytoplasmic regulatory protein of the RecX family that modulates (and predominantly negatively regulates) the RecA recombinase. RecX binds RecA nucleoprotein filaments and promotes their disassembly/limits their extension, thereby tuning homologous recombination and the timing/magnitude of the LexA-controlled SOS DNA-damage response. In P. putida KT2440, recX is co-transcribed with recA (PP_1629) as a single transcriptional unit within the LexA1 (SOS) regulon. Direct biochemical/genetic data are from RecX-family orthologs (E. coli, B. subtilis); KT2440-specific evidence is currently limited to genomic context and SOS-regulon membership.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: RecX is a soluble cytoplasmic protein that acts on RecA nucleoprotein filaments; the cytoplasm annotation is correct but is not the core function. Family-level evidence (B. subtilis RecX-YFP) shows RecX is intracellular and nucleoid-associated near RecA filaments, with no signal peptide or membrane association, consistent with a cytosolic location.
    action: KEEP_AS_NON_CORE
    reason: >-
      RecX is a cytoplasmic DNA-repair regulator; the location is accurate but
      the core biological role is RecA filament modulation rather than the
      compartment itself. The row rests on a curated source rather than a
      prediction: its WITH/FROM names UniProtKB-SubCell SL-0086 together with
      UniRule UR000038450, which is HAMAP-Rule MF_01114, the rule that also
      supplies the entry's name and FUNCTION statement. The entry has no signal
      peptide, no transmembrane segment and no lipobox, and a protein whose
      substrate is the cytoplasmic RecA-DNA filament can only act there, so the
      claim is consistent with the activity rather than merely inherited. Not
      MODIFYed to a sub-compartment: GO has no term for the nucleoid-associated
      pool of a bacterial cytoplasmic protein that would be supported here.
    supported_by:
    - reference_id: file:PSEPK/recX/recX-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    - reference_id: file:PSEPK/recX/recX-deep-research-falcon.md
      supporting_text: most evidence-consistent localization for *P. putida* RecX is **intracellular (cytosol) with functional association to nucleoid/RecA filament sites**
- term:
    id: GO:0006282
    label: regulation of DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Regulation of DNA repair is the correct biological-process annotation for RecX. RecX modulates RecA activity, controlling the magnitude and timing of RecA-dependent homologous recombination and SOS signaling. In P. putida KT2440 specifically, recX lies in the LexA1-controlled SOS regulon co-transcribed with recA, supporting a role in DNA-damage-inducible recombination control.
    action: ACCEPT
    reason: >-
      Conserved RecX-family function (negative modulation of the RecA recombinase
      that drives recombinational DNA repair) plus KT2440-specific SOS-regulon
      membership together support regulation of DNA repair as a core process. The
      row's WITH/FROM is InterPro:IPR003783 (Regulatory_RecX) plus UniRule
      UR000038450 (HAMAP-Rule MF_01114), a curated rule rather than an
      association rule, and IPR003783 is the family-defining signature rather
      than a generic helix-turn-helix match. The term was not MODIFYed to a more
      specific descendant: GO:0062110 negative regulation of DNA recombinase
      disassembly has the wrong sign for RecX, which promotes rather than
      prevents filament disassembly, and no corresponding positive-regulation
      term exists; the generic regulation term is as precise as the evidence
      allows while the net in vivo direction in KT2440 is untested.
    supported_by:
    - reference_id: file:PSEPK/recX/recX-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Modulates RecA activity
    - reference_id: file:PSEPK/recX/recX-deep-research-falcon.md
      supporting_text: controlling the magnitude/timing of RecA-dependent recombination and SOS activation
    - reference_id: file:PSEPK/recX/recX-deep-research-falcon.md
      supporting_text: co-transcribed with **recA / PP_1629** as a single transcriptional unit within the **LexA1 (SOS) regulon**
- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: ISS
  original_reference_id: file:PSEPK/recX/recX-uniprot.txt
  qualifier: enables
  review:
    summary: Add the molecular function that the fetched GOA set omits entirely. GOA gives RecX a regulatory process and a location but no activity, even though UniProt's own curated statement for this entry is an activity claim.
    action: NEW
    reason: >-
      HAMAP-Rule MF_01114 states that the protein modulates RecA activity, and
      the entry is placed in the RecX family by that rule, by InterPro IPR003783
      and by PANTHER PTHR33602. Modulating the activity of a recombinase is an
      enzyme regulator activity, so the generic term is directly entailed by the
      curated statement; it is proposed at this level rather than deeper because
      the sign and mechanism in KT2440 are untested. Two more specific existing
      terms were checked and rejected: GO:0120230 recombinase activator activity
      has the wrong sign, and GO:0140776 protein-containing complex destabilizing
      activity would assert the filament-disassembly mechanism, which rests on
      E. coli and B. subtilis biochemistry rather than on anything shown for this
      protein. A RecA-specific regulator term is offered in proposed_new_terms.
    supported_by:
    - reference_id: file:PSEPK/recX/recX-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Modulates RecA activity
    - reference_id: file:PSEPK/recX/recX-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the RecX family'
    - reference_id: file:PSEPK/recX/recX-deep-research-falcon.md
      supporting_text: primary role is to **modulate (often inhibit) RecA filament growth and/or stability**
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Both GOA rows on this entry were asserted by the combined pipeline from
      UniRule UR000038450, which is HAMAP-Rule MF_01114, together with
      UniProtKB-SubCell SL-0086 for the location and InterPro:IPR003783 for the
      process. Despite the IEA code neither row rests on an ARBA association
      rule, and both trace to the same curated family rule that names the entry.
- id: file:PSEPK/recX/recX-uniprot.txt
  title: UniProtKB reviewed entry Q88ME3 for Pseudomonas putida KT2440 recX (PP_1630)
  findings:
  - statement: >-
      The entry's whole curated functional content is a single clause written
      under HAMAP-Rule MF_01114 - that the protein modulates RecA activity -
      which is an activity claim, and is the basis for proposing the molecular
      function that GOA omits.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: Modulates RecA activity'
    reference_section_type: RESULTS
  - statement: >-
      The same rule places the entry in the RecX family, as do InterPro
      IPR003783, NCBIfam NF001054 and PANTHER PTHR33602 on the record; the
      domain content is three tandem winged-helix modules (Pfam PF21982, PF02631,
      PF21981) with no catalytic signature, consistent with a
      protein-interaction regulator rather than an enzyme.
    record_section: ["CC:SIMILARITY"]
    supporting_text: 'Belongs to the RecX family'
    reference_section_type: RESULTS
  - statement: >-
      The curated subcellular location is cytoplasm, the compartment in which the
      RecA-DNA filament that RecX acts on resides; the record carries no signal
      peptide, transmembrane segment or lipobox.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed (Swiss-Prot) entry; accession, locus tag PP_1630 and the
      156-residue chain match the target. Everything curated on the record comes
      from HAMAP-Rule MF_01114, a curated UniRule rather than an ARBA association
      rule, so it is admissible as support; but protein existence is level 3 and
      the entry cites only the KT2440 genome paper, so no statement on it is an
      experimental observation of this protein.
- id: file:interpro/panther/PTHR33602/PTHR33602-metadata.yaml
  title: PANTHER family metadata for PTHR33602 (regulatory protein RecX family)
  findings:
  - statement: >-
      PANTHER places RecX in the regulatory protein RecX family PTHR33602, which
      is integrated with InterPro IPR003783 - the same signature used as the
      WITH/FROM source of the regulation-of-DNA-repair row - confirming that the
      annotation came from the family-defining signature rather than from a
      generic winged-helix match.
    supporting_text: 'integrated: IPR003783'
    reference_section_type: RESULTS
  - statement: >-
      The family is large and ancient (21522 member proteins across 13925
      proteomes) but resolves into a single subfamily, so PANTHER itself offers
      no finer functional subdivision within which a more specific term for this
      protein could be sought.
    supporting_text: 'subfamilies: 1'
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Used only to confirm the PTHR33602-IPR003783 correspondence and the lack of
      subfamily structure. The file is a fetched InterPro/PANTHER metadata record
      and makes no functional claim of its own.
- id: file:PSEPK/recX/recX-deep-research-falcon.md
  title: Falcon deep research report for recX (PP_1630; Q88ME3) in Pseudomonas putida KT2440
  findings:
  - statement: >-
      In KT2440 recX is co-transcribed with recA (PP_1629) as a single
      transcriptional unit inside the LexA1-controlled SOS regulon, the one piece
      of organism-specific evidence tying this gene to DNA-damage-inducible
      recombination control.
    supporting_text: co-transcribed with **recA / PP_1629** as a single transcriptional unit within the **LexA1 (SOS) regulon**
    reference_section_type: RESULTS
  - statement: The report verifies that locus PP_1630 is the recX gene, matching the target accession.
    supporting_text: PP_1630 as recX
    reference_section_type: RESULTS
  - statement: >-
      The conserved family role is to modulate, and usually to inhibit, RecA
      filament growth or stability - an activity claim about the protein rather
      than about the process it regulates.
    supporting_text: primary role is to **modulate (often inhibit) RecA filament growth and/or stability**
    reference_section_type: RESULTS
  - statement: >-
      The consequence of that modulation is control over how much and how long
      RecA-dependent recombination and SOS signalling occur, which is what the
      regulation-of-DNA-repair annotation captures.
    supporting_text: controlling the magnitude/timing of RecA-dependent recombination and SOS activation
    reference_section_type: DISCUSSION
  - statement: >-
      In vitro, RecX binding causes net shortening of RecA filaments, consistent
      with active stimulation of disassembly rather than passive blocking of
      extension.
    supporting_text: RecX binds RecA filaments and drives net filament shortening, consistent with stimulation of disassembly
    reference_section_type: RESULTS
  - statement: >-
      RecX is characterized as a negative modulator able to actively disassemble
      RecA nucleoprotein filaments; this mechanism comes from ortholog
      biochemistry, which is why the molecular function proposed here stays at
      the generic enzyme-regulator level rather than asserting a complex-destabilizing activity.
    supporting_text: negative modulator that can **actively disassemble RecA nucleoprotein filaments**
    reference_section_type: RESULTS
  - statement: >-
      The suppression extends across all four measured RecA activities - ATPase,
      DNA pairing, strand exchange and co-protease - so RecX regulates the
      recombinase as a whole rather than one of its partial reactions.
    supporting_text: suppresses RecA ATPase, DNA pairing, strand exchange, and co-protease activities
    reference_section_type: RESULTS
  - statement: >-
      The physiological output is tuning of homologous recombination and SOS
      signalling, the two RecA-dependent outputs.
    supporting_text: tuning **homologous recombination** and **SOS signaling**
    reference_section_type: DISCUSSION
  - statement: >-
      No localization experiment exists for the KT2440 protein; the defensible
      reading is an intracellular, cytosolic protein functionally associated with
      nucleoid and RecA-filament sites, which supports the cytoplasm row without
      licensing a sub-compartment term.
    supporting_text: most evidence-consistent localization for *P. putida* RecX is **intracellular (cytosol) with functional association to nucleoid/RecA filament sites**
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Target identity (Q88ME3 / PP_1630 / KT2440) is verified in the report. Its
      mechanistic claims about RecA filament disassembly and the suppression of
      RecA ATPase, pairing, strand-exchange and co-protease activities come from
      E. coli and B. subtilis biochemistry, not from this protein, and are used
      here only as family-level context; the one KT2440-specific claim adopted is
      the recA-recX co-transcription within the LexA1 regulon. The report also
      notes that RecX's net effect on recombination is inhibitory in some
      bacteria and facilitative in others, which is why no sign-specific term is
      asserted.
