core_functions:
- description: >-
    Membrane-associated, c-type cytochrome-dependent oxidation of urate at the
    first step of the PuuD-linked urate-to-allantoin pathway. GO:0009055 captures
    the electron-transfer component, but no current GO MF captures the
    substrate-specific PuuD reaction without incorrectly asserting production
    of hydrogen peroxide.
