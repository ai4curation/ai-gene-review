proposed_new_terms:
- proposed_name: membrane cytochrome c-dependent urate oxidoreductase activity
  proposed_definition: >-
    Catalysis of the oxidation of urate to 5-hydroxyisourate by an integral
    membrane protein, with urate-derived electrons transferred through a fused
    c-type cytochrome domain to a physiological acceptor.
  justification: >-
    GO:0004846 and RHEA:21368 require oxygen reduction to hydrogen peroxide,
    whereas PuuD-dependent urate oxidation does not generate the same
    hydrogen-peroxide response and its terminal electron acceptor is unresolved.
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  supported_by:
  - reference_id: PMID:26349049
    supporting_text: >-
      urate oxidation by PuuD proceeds through cytochrome c-mediated electron
      transfer
suggested_questions:
- question: >-
    What is the physiological terminal electron acceptor for PP_4289/PuuD, and
    what complete stoichiometry should define a PuuD-specific GO/Rhea reaction?
suggested_experiments:
- description: >-
    Delete and complement PP_4289, quantify urate disappearance and HIU/OHCU or
    allantoin formation, and measure electron transfer to candidate respiratory
    acceptors without relying on a soluble-Uox assay.
  experiment_type: genetics, targeted metabolomics, and membrane redox assay
