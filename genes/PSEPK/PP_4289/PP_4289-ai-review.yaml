id: Q88F11
gene_symbol: PP_4289
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_4289 encodes the predicted KT2440 PuuD, an eight-pass membrane
  oxidoreductase with a C-terminal c-type cytochrome domain. Its COG3748 and
  urate-oxidase N-terminal-domain assignments, conserved PuuD architecture, and
  placement beside the downstream urate-oxidation genes support a role in
  converting urate to 5-hydroxyisourate while transferring electrons through
  its heme-containing cytochrome domain. The physiological terminal electron
  acceptor and complete reaction stoichiometry remain unresolved.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Electron transfer is an integral part of the PuuD cytochrome c-dependent
      urate-oxidation mechanism.
    action: ACCEPT
    reason: >-
      Q88F11 carries a C-terminal cytochrome c domain, and work on the
      experimentally tested A. fabrum PuuD homolog supports cytochrome-mediated
      electron transfer without the hydrogen-peroxide response caused by
      soluble Uox.
    supported_by:
    - reference_id: file:PSEPK/PP_4289/PP_4289-uniprot.txt
      supporting_text: InterPro; IPR009056; Cyt_c-like_dom
    - reference_id: PMID:26349049
      supporting_text: >-
        urate oxidation by PuuD proceeds through cytochrome c-mediated electron
        transfer
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Heme binding is supported by the C-terminal c-type cytochrome domain but
      is cofactor context rather than the substrate-specific primary function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The c-type cytochrome domain and CXXCH motif support covalent heme use in
      electron transfer. The more informative core role is PuuD-dependent urate
      oxidation, for which GO currently lacks a mechanism-appropriate term.
    supported_by:
    - reference_id: file:PSEPK/PP_4289/PP_4289-uniprot.txt
      supporting_text: InterPro; IPR009056; Cyt_c-like_dom
    - reference_id: PMID:26349049
      supporting_text: >-
        PuuD proteins are also characterized by the presence of the heme-binding
        cytochrome c domain
- term:
    id: GO:0019628
    label: urate catabolic process
  evidence_type: ISS
  original_reference_id: PMID:26349049
  qualifier: involved_in
  review:
    summary: >-
      Q88F11 is the sequence- and neighborhood-supported PuuD first-step enzyme
      of the KT2440 urate-to-allantoin route.
    action: NEW
    reason: >-
      Q88F11 matches the full-length COG3748 PuuD architecture defined by the
      tested A. fabrum homolog and is encoded with PucM/UraH and PucL/UraD
      pathway components. This supports an orthology-based process annotation,
      while direct biochemical evidence for Q88F11 itself is not available.
    supported_by:
    - reference_id: file:PSEPK/PP_4289/PP_4289-uniprot.txt
      supporting_text: eggNOG; COG3748; Bacteria
    - reference_id: file:PSEPK/PP_4289/PP_4289-uniprot.txt
      supporting_text: InterPro; IPR010389; Urate_ox_N
    - reference_id: PMID:26349049
      supporting_text: >-
        Atu2314 and homologous genes belonging to COG3748 are responsible for
        urate oxidation
    - reference_id: file:PSEPK/PP_4289/PP_4289-deep-research-openscientist.md
      supporting_text: No direct biochemistry on PP_4289 itself.
