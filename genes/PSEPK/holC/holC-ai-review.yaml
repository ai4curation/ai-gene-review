id: Q88P74
gene_symbol: holC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: HolC is the chi accessory subunit of the Pseudomonas putida KT2440 DNA polymerase III clamp-loader
  system. It forms a complex with the psi subunit and is inferred to couple SSB-coated templates to the
  replicase through the conserved chi–SSB interface. The KT2440 chi–psi complex binds single-stranded
  DNA, although the corresponding direct DNA-binding activity is assigned to psi in mechanistic studies
  of Pseudomonas homologs. HolC supports efficient replication without being a universally conserved minimal-loader
  subunit.
