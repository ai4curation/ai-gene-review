    label: protein targeting
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The sorting role is a Fitness Browser curator hypothesis built on cofitness with
      PP_0765 and on a distant LolB relationship. PP_0766 has no detectable sequence
      similarity to E. coli LolA or LolB (global alignment z = -1.7 for LolB against
      shuffled sequences), so the relationship is a fold classification only, and that
      fold is shared by LppX-type carriers of lipids rather than proteins. PP_0766 has no
      cysteine and therefore no lipobox, so it is not itself a lipoprotein like LolB. The
      Pfam family description places DUF1329 in an MMPL exporter system, and a
      structure-prediction study places it between an RND inner membrane protein and the
      outer membrane barrel PP_0765; both imply a small hydrophobic cargo rather than
      protein targeting. No experiment tests whether PP_0766 is needed for PP_0765
      insertion or for any protein's localization, so the term is neither supported nor
      refuted. The GO extractor's own reasoning invoked sortases, which are unrelated
      Gram-positive transpeptidases.
