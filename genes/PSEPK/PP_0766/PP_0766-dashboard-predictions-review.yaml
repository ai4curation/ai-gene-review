description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_KZ987399.1_4512 is "Putative adhesin-associated sorting protein of the DUF1329
  family" (tier A), with two GO terms: GO:0006605 protein targeting and GO:0007155 cell
  adhesion. The exact-sequence UniProt entries are deleted, so the call is scored on the
  KT2440 reference-proteome entry Q88PT2 (PP_0766), 99.6% identical over all 454
  residues. The call is a direct copy of the Fitness Browser reannotation, whose rationale
  is cofitness with PP_0765 (itself called an adhesin only by transfer from P. aeruginosa
  PA3923) and a distant resemblance of DUF1329 to the outer membrane lipoprotein receptor
  LolB. The pairing with PP_0765 is well supported: the genes are 25 bp apart on the same
  strand, have near-identical fitness profiles, and are predicted to contact each other.
  The specific role is not. PP_0766 has a cleavable signal peptide and no transmembrane
  segment, contains no cysteine (so it is neither a lipoprotein nor lipobox-bearing), and
  has no detectable sequence similarity to E. coli LolA or LolB (global alignment below
  shuffled background); its LolA/LolB/LppX resemblance is a fold classification (CDD
  cd16329, Gene3D 2.50.20.10), a fold also used by carriers of lipids and other
  hydrophobic cargo. No experiment shows that PP_0766 targets or sorts any protein, or
  that the pair mediate adhesion in P. putida. Its only phenotype is a specific growth
  defect on the fatty acid esters Tween 20 and butyl stearate, which the published
  analyses interpret as an untested esterase (PMID:32826213) or as part of an envelope
  transport system with PP_0765 and the RND protein PP_2019 (PMID:38306398); the Pfam
  DUF1302 description likewise casts DUF1329 as a LolA-like chaperone of an MMPL exporter
  system, which would carry a non-protein cargo. Both GO terms are therefore UNC.
