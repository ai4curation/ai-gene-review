- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0007155
    label: cell adhesion
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Cell adhesion reaches PP_0766 at two removes: from in vitro laminin binding and
      laminin-surface biofilm of the P. aeruginosa DUF1302 orthologue PA3923, to the
      "putative adhesin" label on PP_0765, to PP_0766 by cofitness. Neither PP_0766 nor
      its P. aeruginosa orthologue PA3922 has any adhesion or biofilm phenotype, and the
      KT2440 phenotype is a specific growth defect on fatty acid esters as carbon source.
      Nothing refutes a role in adhesion, so UNC; the missing evidence is any attachment
      assay of a DUF1329 mutant.
