  review:
    summary: PP_0766 is predicted to be a soluble periplasmic protein with a cleavable signal peptide, no transmembrane segment and no lipobox.
    action: NEW
    reason: >-
      GOA holds no annotation for Q88PT2. SignalP (UniProt) and DeepTMHMM (on the
      dashboard query, 99.6% identical to Q88PT2) both predict a cleavable signal peptide
      at residues 1-24, and DeepTMHMM predicts no membrane-spanning segment of either kind
      in the mature chain. The protein has no cysteine at all, so it lacks the lipobox
      cysteine needed for lipidation and outer membrane lipoprotein sorting. Its
      LolA/LolB/LppX-like fold classification is typical of periplasmic carriers, and an
      AlphaFold-based study predicts contacts with an outer membrane beta-barrel (PP_0765)
      and an inner membrane RND protein (PP_2019), consistent with a periplasmic location
      (PMID:38306398). No experiment has localized PP_0766, so this is a curator
      judgment of sequence-model predictions only.
