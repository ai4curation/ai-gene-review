suggested_questions:
- question: Does PP_0766 bind a hydrophobic ligand (fatty acyl ester, fatty acid, or an exported envelope lipid) in its LolA-like cavity?
- question: Is PP_0766 the periplasmic link between PP_2019 (RND/MMPL) and PP_0765, analogous to LolA- or LppX-like carriers in lipid export systems?
suggested_experiments:
- description: Purify mature PP_0766 (residues 25-454) and screen ligand binding (fatty acids, acyl esters, Tween 20 fragments, envelope lipids) by thermal shift or native mass spectrometry; assay esterase activity alone and with PP_0765.
  experiment_type: biochemistry
- description: Confirm periplasmic localization by osmotic-shock fractionation and test in vivo crosslinking of PP_0766 with PP_0765 and PP_2019.
  experiment_type: localization and interaction
