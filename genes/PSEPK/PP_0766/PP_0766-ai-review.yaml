description: >-
  PP_0766 is a 454-residue DUF1329 (PF07044) family protein with a cleavable Sec signal
  peptide (residues 1-24) and no transmembrane segment. It contains no cysteine, so it
  cannot be a lipoprotein, and the mature protein is predicted to be soluble in the
  periplasm. CDD and Gene3D place it in the LolA/LolB/LppX fold, a structural class of
  periplasmic or envelope proteins that bind acyl chains or other hydrophobic cargo in a
  cavity; it has no detectable sequence similarity to Escherichia coli LolA or LolB.
  PP_0766 is encoded 25 bp downstream of, and on the same strand as, PP_0765, a DUF1302
  predicted outer membrane beta-barrel, and the two genes very likely form an operon. Its
  molecular function is unknown. In genome-wide transposon fitness assays in KT2440,
  PP_0766 and PP_0765 mutants grow poorly specifically on long-chain fatty acid esters
  (Tween 20, butyl stearate) as sole carbon source. An untested published hypothesis
  proposes that the pair are esterases. Structure prediction instead places PP_0766 in
  the periplasm in contact with PP_0765 and the RND-family inner membrane protein PP_2019,
  as part of a transport system for an unidentified hydrophobic substrate; the Pfam
  DUF1302 family description likewise proposes that DUF1329 proteins are LolA-like
  chaperones of an MMPL-family exporter system. The P. aeruginosa orthologue PA3922 (78%
  identical) is detected in outer membrane vesicles but has not been characterized. A
  paralogous DUF1329 protein, PP_2043, is about 47% identical.
