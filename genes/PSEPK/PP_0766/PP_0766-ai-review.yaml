core_functions:
- description: >-
    Soluble periplasmic protein with a LolA/LolB/LppX-like fold and unknown molecular
    function, operonic with the outer membrane DUF1302 protein PP_0765 and required with it
    for growth on long-chain fatty acid esters (Tween 20, butyl stearate). It may carry a
    hydrophobic ligand across the periplasm between an RND/MMPL inner membrane protein and
    PP_0765, but neither the cargo, the direction of transport nor any catalytic activity
    has been shown; it is not a lipoprotein and there is no evidence that it sorts
    proteins.
