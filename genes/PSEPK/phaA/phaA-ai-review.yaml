suggested_questions:
- question: How do PhaC1 and PhaC2 differ in native KT2440 substrate preference and quantitative contribution
    across carbon sources and growth phases?
suggested_experiments:
- description: In vitro reconstitution of PhaC1 activity with defined (R)-3-hydroxyalkanoyl-CoA substrates
    of varying chain lengths to establish kinetic parameters and determine the minimum and maximum chain
    length accepted.
- description: In vitro enzyme assays with purified PhaC1 using different chain-length 3-hydroxyalkanoyl-CoA
    substrates to determine substrate specificity and kinetic parameters.
