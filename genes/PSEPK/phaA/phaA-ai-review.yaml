- term:
    id: GO:0070088
    label: polyhydroxyalkanoate granule
  evidence_type: ISS
  original_reference_id: PMID:38608840
  qualifier: located_in
  review:
    summary: PHA synthases are integral components of PHA granules. The GO term GO:0070088 (polyhydroxyalkanoate
      granule) description explicitly states that PHA synthase is one of the proteins associated with
      PHA granules. PhaC1 catalyzes the polymerization reaction at the granule surface and is physically
      associated with PHA granules in vivo. This is a well-established localization for Class II PHA synthases
      in Pseudomonas species.
    action: NEW
    reason: The historical ISS proposal is retained. Native KT2440 PhaC1-eYFP was an established-localization
      positive control in PMID38608840; the image/control supports granule association but is not a new
      independent discovery. Native fraction proteomics also detects Q88D25. No evidence-code rewrite
      is needed.
    supported_by:
    - reference_id: PMID:38608840
      supporting_text: eYPF fusions to PhaI and PhaC1 served as positive controls since both are reported
        to localize to the carbonosome
