core_functions:
- description: Catalyzes polymerization of (R)-3-hydroxyalkanoyl-CoA thioesters (preferentially medium-chain-length,
    C6-C14) into polyhydroxyalkanoates (mcl-PHAs) with concomitant release of CoA. Functions as one of
    the two class II PHA synthases in P. putida KT2440.
