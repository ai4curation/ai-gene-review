taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: Poly(3-hydroxyalkanoate) polymerase 1 (PhaC1), a Class II PHA synthase that catalyzes polymerization
  of (R)-3-hydroxyalkanoyl-CoA thioesters into medium-chain-length polyhydroxyalkanoates (mcl-PHAs, C6-C14).
  PhaC1 is one of two PHA synthases in P. putida KT2440 and is encoded as the first gene in the phaC1-phaZ-phaC2-phaD
  operon (PP_5003). PHAs accumulate as intracellular granules serving as carbon and energy storage reserves
  under nutrient-limiting conditions. The gene is designated phaA in the KT2440 genome annotation but
  referred to as phaC1 in the broader PHA literature.
