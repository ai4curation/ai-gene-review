id: Q88P67
gene_symbol: gcvT-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  GcvT-I is one of two KT2440 glycine cleavage T proteins. It is an
  aminomethyltransferase that accepts aminomethyl-dihydrolipoyl-H protein,
  releases ammonium, and transfers the one-carbon unit to tetrahydrofolate to
  form 5,10-methylenetetrahydrofolate. It is encoded with the gcvP1/gcvH1 set.
existing_annotations:
  - term:
      id: GO:0004047
      label: aminomethyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining glycine-cleavage T-protein activity.
      action: ACCEPT
      reason: >-
        The UniProt EC and Rhea reaction lines are ARBA predictions and are not
        cited as evidence. Support is family membership: Q88P67 matches the
        NCBIfam TIGR00528 gcvT model, the InterPro GcvT signature and the PIRSF
        GcvT family, whose characterised members are glycine cleavage T-protein
        aminomethyltransferases (EC 2.1.2.10). Membership in that family is the
        basis for accepting the activity; no KT2440-specific assay exists.
      supported_by:
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: DR   NCBIfam; TIGR00528; gcvT; 1.
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: DR   InterPro; IPR006223; GcvT.
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:PIRSF"]
          supporting_text: DR   PIRSF; PIRSF006487; GcvT; 1.
  - term:
      id: GO:0005960
      label: glycine cleavage complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: GcvT-I supplies the T-protein reaction in the glycine cleavage system.
      action: ACCEPT
      reason: >-
        The UniProt name and reaction lines are ARBA predictions and are not
        cited. Complex membership is inferred from family classification: the
        TIGR00528 gcvT and InterPro GcvT (IPR006223) models define the T protein
        of the glycine cleavage system, which acts with the P, H and L proteins.
        This is a family-level inference; no KT2440 complex isolation exists.
      supported_by:
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: DR   NCBIfam; TIGR00528; gcvT; 1.
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: DR   InterPro; IPR006223; GcvT.
  - term:
      id: GO:0006546
      label: glycine catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The T reaction participates in glycine catabolism, but this term is broader than the exact system process.
      action: KEEP_AS_NON_CORE
      reason: Retain as a valid parent while using GO:0019464 in the core summary.
  - term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
    evidence_type: ISS
    original_reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
    qualifier: involved_in
    review:
      summary: The exact T-protein reaction is an obligate step in this process.
      action: NEW
      reason: >-
        The T-protein aminomethyltransferase step is itself a step of glycine
        cleavage, so the protein performs part of the process. Support is
        family membership (NCBIfam TIGR00528 gcvT, PIRSF GcvT); the ARBA
        reaction line is not cited. The reviewed paralog carries the same
        process term.
      supported_by:
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: DR   NCBIfam; TIGR00528; gcvT; 1.
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          record_section: ["DR:PIRSF"]
          supporting_text: DR   PIRSF; PIRSF006487; GcvT; 1.
