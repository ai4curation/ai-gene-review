id: Q88P67
gene_symbol: gcvT-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GcvT-I is one of two KT2440 glycine cleavage T proteins. It is an
  aminomethyltransferase that accepts aminomethyl-dihydrolipoyl-H protein,
  releases ammonium, and transfers the one-carbon unit to tetrahydrofolate to
  form 5,10-methylenetetrahydrofolate. It is encoded with the gcvP1/gcvH1 set.
existing_annotations:
  - term:
      id: GO:0004047
      label: aminomethyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining glycine-cleavage T-protein activity.
      action: ACCEPT
      reason: UniProt assigns EC 2.1.2.10 and the exact Rhea 16945 one-carbon-transfer reaction.
      supported_by:
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-goa.tsv
          supporting_text: RHEA:16945|EC:2.1.2.10
  - term:
      id: GO:0005960
      label: glycine cleavage complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: GcvT-I supplies the T-protein reaction in the glycine cleavage system.
      action: ACCEPT
      reason: The InterPro assignment, catalytic reaction, and conserved GcvT family all support complex membership.
  - term:
      id: GO:0006546
      label: glycine catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The T reaction participates in glycine catabolism, but this term is broader than the exact system process.
      action: KEEP_AS_NON_CORE
      reason: Retain as a valid parent while using GO:0019464 in the core summary.
  - term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
    evidence_type: ISS
    original_reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
    qualifier: involved_in
    review:
      summary: The exact T-protein reaction is an obligate step in this process.
      action: NEW
      reason: The Rhea 16945 reaction and GcvT family assignment support the same specific process already assigned to the reviewed paralog.
      supported_by:
        - reference_id: file:PSEPK/gcvT-I/gcvT-I-uniprot.txt
          supporting_text: Rhea:RHEA:16945
