  - id: PMID:27303730
    title: GcsR, a TyrR-Like Enhancer-Binding Protein, Regulates Expression of the Glycine Cleavage System in Pseudomonas aeruginosa PAO1.
    findings:
      - statement: P. aeruginosa carries two GCS sets and specifically regulates its second set as a gcs2 operon.
        supporting_text: these five genes are transcribed together as a single operon
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified comparative Pseudomonas evidence; it does not establish KT2440 paralog pairing.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__glycine_cleavage_system__ppu00260-deep-research-openscientist.md
    title: OpenScientist PSEPK glycine cleavage system synthesis
    reference_review:
      relevance: MEDIUM
      correctness: LOW_QUALITY
      review_notes: >-
        Useful species-aware synthesis for grouping gcvT-I with gcvP1 and gcvH1
        as one KT2440 glycine-cleavage P/H/T set, but the report itself states
        that all KT2440 gcv calls are homology-based and that operon division of
        labor is inferred from P. aeruginosa.
    findings:
      - statement: The report identifies gcvT-I/gcvP1/gcvH1 as one complete P/H/T set.
  - id: file:modules/glycine_cleavage_system.yaml
    title: Glycine cleavage system module
    findings:
      - statement: GcvT-I is a KT2440 exemplar for the third of four mechanistic roles.
