  review:
    summary: The extracellular-region term is too broad for a Gram-negative solute-binding protein; periplasmic space is more informative.
    action: MODIFY
    reason: >-
      The N-terminal signal peptide supports export from the cytoplasm, and
      the mature protein carries the expected periplasmic-binding-protein domain.
    proposed_replacement_terms:
