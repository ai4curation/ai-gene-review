taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Periplasmic phosphate-binding component of a Pst ABC uptake system. PstS
  captures inorganic phosphate outside the cytoplasmic membrane and presents
  it to the PstA/PstC permease for ATP-coupled import. In KT2440, this protein
  is encoded in the PP_2656-PP_2659 Pst-like operon.
