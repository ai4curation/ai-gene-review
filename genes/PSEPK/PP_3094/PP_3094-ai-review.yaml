core_functions:
  - description: >-
      Provides the outer-membrane anchor of the K1 TssJLM complex. This rests
      on family membership (Pfam T6SS-SciN / InterPro T6SS_SciN, the TssJ
      family; NCBIfam TIGR03352) and a PROSITE prokaryotic lipoprotein
      signal, together with the general T6SS architecture in which TssJLM
      anchors the apparatus to the envelope (PMID:36748579 describes the
      K1-T6SS cluster but does not assay TssJ1 itself). The ProtNLM-generated
      protein name is not used as evidence.
