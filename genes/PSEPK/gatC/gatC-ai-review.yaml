- term:
    id: GO:0006450
    label: regulation of translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The conserved GatC scaffold helps maintain accurate aminoacyl-tRNA supply.
    action: ACCEPT
    reason: GatC stabilizes the GatABC complex that converts mischarged Asp-tRNA(Asn) into the cognate
      translation substrate. The broad fidelity term includes this control of charged-tRNA identity; it
      does not require direct regulation of ribosomal decoding. Native Mycobacterium smegmatis GatC perturbation
      changes mistranslation, and PAO1 transamidosome biochemistry demonstrates protection of the mischarged
      intermediate. Together with the target HAMAP-supported GatC architecture, these support a conserved
      role. Neither source measures KT2440 error rates, and the mycobacterial adaptive antibiotic-tolerance
      phenotype is not transferred.
    supported_by:
    - &id003
      reference_id: file:PSEPK/gatC/gatC-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: Heterotrimer of A, B and C subunits. {ECO:0000255|HAMAP- Rule:MF_00122}.
    - *id001
    - reference_id: PMID:33072044
      supporting_text: Our results suggest that mutations in all three constituent members of gatCAB may
        result in adaptive mistranslation
    - reference_id: PMID:34225495
      supporting_text: trehalose supplementation of cultures of mycobacterial strains expressing wild-type
        GatCAB caused a reduction in translational errors specifically for the indirect tRNA aminoacylation
        pathway.
- term:
    id: GO:0070681
    label: glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: GatABC modifies a charged amino acid; the former pathway-variant BP is obsolete.
    action: MODIFY
    reason: Current QuickGO explicitly retires GO:0070681 and distinguishes GatCAB modification of already-charged
      tRNA from charging itself. KT2440 conserved GatABC and non-discriminating AspS support the Asn-forming
      modification route by inference. PAO1 shows an additional in vitro Gln-forming capacity with supplied
      heterologous substrate, not a native KT2440 Gln-transamidation pathway. Replace the obsolete overly
      specific pathway claim with the supported modification process.
    supported_by:
    - *id002
    - *id001
    - reference_id: PMID:14729703
      supporting_text: The heterotrimeric AdT of P. aeruginosa has no Glu-tRNA Gln substrate in its host,
        but it can transamidate heterologous Glu-tRNA Gln .
    proposed_replacement_terms:
