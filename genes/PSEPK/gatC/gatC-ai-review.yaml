id: Q88PB8
gene_symbol: gatC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GatC is the small structural subunit of the heterotrimeric GatABC
  tRNA-dependent amidotransferase in Pseudomonas putida KT2440. It supports the
  GatA/GatB complex that converts misacylated Glu-tRNA(Gln) or Asp-tRNA(Asn) to
  correctly charged Gln-tRNA(Gln) or Asn-tRNA(Asn).
