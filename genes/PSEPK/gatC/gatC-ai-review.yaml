taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GatC is the small structural subunit of the soluble GatABC tRNA-dependent amidotransferase.
  It supports the assembly that couples GatA glutamine hydrolysis to GatB-mediated modification of a tRNA-bound
  amino acid, including conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn). GatC contributes to the complete
  complex reaction without being an autonomous aminoacyl-tRNA ligase or glutaminase.
