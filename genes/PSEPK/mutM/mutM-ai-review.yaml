description: MutM/Fpg is a bifunctional formamidopyrimidine and 8-oxoguanine DNA glycosylase/AP lyase. It removes oxidized purines and cleaves the backbone at the resulting abasic site as part of the bacterial 8-oxoguanine defense system.
