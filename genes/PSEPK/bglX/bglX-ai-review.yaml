suggested_questions:
- question: Which beta-glucosides are transported to and hydrolyzed by periplasmic BglX in KT2440?
suggested_experiments:
- description: >-
    Purify BglX and measure hydrolysis across beta-glucoside and beta-glucan
    substrates, then test substrate utilization in a bglX deletion strain.
  experiment_type: biochemical substrate panel and genetics
