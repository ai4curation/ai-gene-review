taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  bglX encodes a signal-peptide-bearing glycoside hydrolase family 3 protein
  predicted to act as a periplasmic beta-glucosidase. Its supported role is
  hydrolysis of terminal non-reducing beta-D-glucosyl residues during
  carbohydrate utilization; its physiological substrate remains unknown.
