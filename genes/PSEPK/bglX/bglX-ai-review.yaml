knowledge_gaps:
- gap_statement: The physiological beta-glucoside or glucan substrate of bglX is unknown.
  boundary: >-
    GH3 family membership supports beta-glucosidase chemistry, but does not link
    bglX to a particular environmental carbohydrate or to flavonoid catabolism.
  gap_kind: [BIOLOGY]
  status: OPEN
  significance: Substrate identification is needed to place bglX in a specific catabolic route.
  resolution: Purify BglX and test a panel of beta-glucosides and beta-glucans.
