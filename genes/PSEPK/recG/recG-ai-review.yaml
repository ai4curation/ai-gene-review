  title: OpenScientist PSEPK RuvABC Holliday-junction-processing synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Useful module-boundary synthesis that places Q88C73/PP_5310 as an intact RecG branch-migration
      helicase parallel to RuvAB, not as a junction resolvase, and keeps the presynaptic recombination
      genes out of the RuvABC/RecG Holliday-junction-processing step.
  findings:
  - statement: The report places RecG as a parallel branch-migration route rather than a resolvase.
    supporting_text: Provides RuvAB-independent branch migration and can convert stalled replication forks
      into Holliday junctions
- id: PMID:18375550
  title: Repair and antirepair DNA helicases in Helicobacter pylori.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative primary genetics supports RecG and RuvABC as separate branch-migration routes
      and cautions that downstream resolution is taxon-dependent.
  findings:
  - statement: RecG and RuvABC can form independent Holliday-junction branch-migration pathways, with
      taxon-dependent repair outcomes.
    supporting_text: Orthologs of RecG and RuvABC are highly conserved among prokaryotes; in Escherichia
      coli, they participate in independent pathways that branch migrate Holliday junctions during recombinational
      DNA repair.
