id: Q88C73
gene_symbol: recG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  RecG is an ATP-dependent 3-prime-to-5-prime DNA helicase and branch-migration
  translocase that remodels branched DNA intermediates during recombination,
  DNA repair, and stalled-replication-fork processing. It provides a route for
  Holliday-junction branch migration that is mechanistically parallel to RuvAB,
  and can regress blocked replication forks into four-way structures.
existing_annotations:
