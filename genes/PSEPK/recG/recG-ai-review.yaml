  - term:
      id: GO:0003678
      label: DNA helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Correct parent term but redundant with the exact 3-prime-to-5-prime activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0043138 is the more informative existing annotation.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: ATP binding is required for RecG catalysis but is subordinate to ATP hydrolysis and directional helicase activity.
      action: KEEP_AS_NON_CORE
      reason: The binding term is valid but does not independently summarize the biological mechanism.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: RecG remodels branched repair and stalled-fork intermediates.
      action: ACCEPT
      reason: DNA repair is a conserved central process for RecG-family helicases.
  - term:
      id: GO:0006310
      label: DNA recombination
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: RecG catalyzes branch migration of recombination intermediates.
      action: ACCEPT
      reason: This process follows directly from the conserved RecG mechanism.
  - term:
      id: GO:0016787
      label: hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Correct parent term but too broad relative to ATP hydrolysis.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0016887 captures the actual hydrolysis substrate.
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: RecG hydrolyzes ATP to power DNA translocation and branch migration.
      action: ACCEPT
      reason: The conserved helicase domains and Rhea reaction support this catalytic activity.
  - term:
      id: GO:0043138
      label: 3'-5' DNA helicase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: RecG couples ATP hydrolysis to DNA unwinding and branch migration with 3-prime-to-5-prime polarity.
      action: ACCEPT
      reason: This is the exact directional motor activity of the RecG subfamily.
