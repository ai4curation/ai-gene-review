      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Correct but uninformative relative to ATP binding and hydrolysis.
      action: MARK_AS_OVER_ANNOTATED
      reason: More specific nucleotide-dependent activities are already annotated.
  - term:
