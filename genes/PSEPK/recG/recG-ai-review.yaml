taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RecG is an ATP-dependent 3'-5' DNA helicase of Pseudomonas putida that is specific for branched
  DNA. By conservation with E. coli RecG it uses an N-terminal wedge domain to engage forks and Holliday
  junctions, branch-migrates Holliday junctions independently of RuvAB, and regresses stalled replication
  forks into junctions that can be resolved. It provides a route parallel to RuvAB for processing recombination
  intermediates in DNA repair.
