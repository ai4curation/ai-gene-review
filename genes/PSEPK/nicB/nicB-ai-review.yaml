    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: The NicB cytochrome region participates in electron transfer.
    action: ACCEPT
    reason: The full primary PMID18678916 reports truncation, artificial-acceptor bypass and complementation
      in trans, supporting the electron-transfer role. Delivery to a particular cytochrome oxidase is
      a mechanistic proposal, not a directly identified partner.
    supported_by:
    - &id001
      reference_id: file:PSEPK/nicB/nicB-uniprot.txt
      record_section:
      - CC:DOMAIN
      supporting_text: The cytochrome c domains probably enable interaction with the electron transfer
        chain, possibly by delivering the electrons to a cytochrome oxidase.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: Membrane association is supported for the NicB architecture.
    action: ACCEPT
    reason: The predicted transmembrane helix and curated membrane assignment support this core physical
