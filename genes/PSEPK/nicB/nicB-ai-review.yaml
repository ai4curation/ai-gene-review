  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: nicB encodes the large catalytic subunit of the membrane-associated NicAB nicotinate dehydrogenase. Its Mo-molybdopterin cytosine dinucleotide center participates in conversion of nicotinate to 6-hydroxynicotinate, while its C-terminal multi-heme cytochrome c region relays electrons during the first step of aerobic nicotinate degradation.
