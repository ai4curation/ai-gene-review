id: Q88FX8
gene_symbol: nicB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NicB (NdhL; PP_3948) is the large subunit of the NicAB nicotinate hydroxylase in Pseudomonas
  putida KT2440. It combines a molybdopterin-containing catalytic region with three cytochrome c domains
  and a predicted membrane-spanning segment. Together with the iron-sulfur subunit NicA it converts nicotinate
  to 6-hydroxynicotinate, initiating aerobic degradation through the maleamate pathway. Its cytochrome
  region couples the reaction to electron transfer; the physiological terminal oxidase partner remains
  unresolved.
existing_annotations:
