references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms.
  findings:
  - statement: InterPro2GO supplies domain/family-based automated annotations that require review against the gene-specific UniProt and literature context.
- id: file:PSEPK/nicB/nicB-uniprot.txt
  title: UniProtKB reviewed entry for nicB
  findings:
  - statement: UniProt identifies NicB as the large subunit of NicAB nicotinate dehydrogenase, with membrane localization and nicotinate-catabolic pathway placement.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping.
  findings:
  - statement: UniProt subcellular-location mapping provides automated component annotations based on reviewed-entry location vocabulary.
- id: PMID:18678916
  title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster from Pseudomonas putida KT2440.'
  findings:
  - statement: The nic cluster paper identified NicAB as catalyzing nicotinate hydroxylation in aerobic nicotinic acid degradation.
- id: PMID:19118407
  title: Cloning, heterologous expression, and functional characterization of the nicotinate dehydrogenase gene from Pseudomonas putida KT2440.
  findings:
  - statement: Additional biochemical work supports NicAB nicotinate dehydrogenase activity.
- id: file:PSEPK/nicB/nicB-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for nicB (Q88FX8), Pseudomonas putida KT2440
  findings:
  - supporting_text: 'NicB is the **molybdopterin (MCD)-binding large subunit** of **NicAB nicotinic acid hydroxylase**, catalyzing the first step in aerobic nicotinate degradation: **nicotinic acid → 6-hydroxynicotinic acid**'
  - supporting_text: A **C-terminal cytochrome c (CytC) domain** containing **three heme-binding motifs** (Cys–X2–Cys–His-like CytC motifs), which is unusual among xanthine dehydrogenase family members and is proposed to participate in electron transfer to the terminal acceptor
  - supporting_text: 'Activity is **O2-dependent** and coupled via the CytC domain to a KCN-sensitive terminal oxidase; **PMS** can serve as an artificial electron acceptor in vitro'
  - supporting_text: A **truncated NicAB** lacking the NicB CytC domain lost activity; activity could be restored by supplying the CytC domain **in trans** or by using **PMS**
  - supporting_text: Disruption of **nicA** or **nicB** abolished growth on NA but did not prevent growth on 6HNA (indicating NicAB is needed for the NA→6HNA step specifically)
  - supporting_text: the hydroxylase activity was reported as **highly specific for NA**
  - supporting_text: Direct experimental localization (e.g., cytosolic vs periplasmic vs membrane-associated) for NicB/NicAB was **not provided** in the retrieved KT2440-focused excerpts
