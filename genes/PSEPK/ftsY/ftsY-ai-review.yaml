status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Signal recognition particle (SRP) receptor FtsY is a membrane-associated
  GTPase (EC 3.6.5.4) that functions as the bacterial receptor for the SRP-ribosome-nascent
  chain complex. FtsY contains an NG module (N-terminal regulatory subdomain fused
  to a Ras-like G GTPase subdomain) and an acidic A-domain that mediates membrane
  association. Upon interaction with SRP-bound ribosome-nascent chain complexes, FtsY
  facilitates transfer of nascent membrane proteins to the SecYEG translocon for co-translational
  insertion. Both FtsY and its SRP partner Ffh hydrolyze GTP to drive the targeting
  cycle.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: FtsY is indeed a nucleotide-binding protein, specifically binding GTP
      via its NG domain. However, this annotation is too general and redundant with
      the more specific GO:0005525 (GTP binding) annotation. The UniProt record confirms
      GTP binding sites at residues 297-304, 379-383, and 443-446 (HAMAP-Rule:MF_00920).
    action: MODIFY
    reason: The annotation is directionally correct but too broad. Replace it with
      GO:0005525, which names the nucleotide bound by the FtsY G domain and is already
      present in the annotation set.
    proposed_replacement_terms:
    - id: GO:0005525
      label: GTP binding
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Belongs to the GTP-binding SRP family. FtsY subfamily.
  qualifier: enables
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: GTPase activity is a core molecular function of FtsY. The exact record
      assigns EC 3.6.5.4 and places hydrolysis by Ffh and FtsY during transfer to
      Sec and dissociation of the targeting complex.
    action: ACCEPT
    reason: This is a well-established core function of FtsY. The catalytic reaction
      (GTP + H2O = GDP + phosphate + H+) is documented in UniProt with HAMAP-Rule
      evidence, and the function statement places hydrolysis directly in the SRP
      targeting cycle.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Reaction=GTP + H2O = GDP + phosphate + H(+); Xref=Rhea:RHEA:19669
  qualifier: enables
- term:
    id: GO:0005047
    label: signal recognition particle binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: SRP binding is a core molecular function of FtsY. The exact UniProt
      function statement identifies FtsY as the receptor for the SRP-RNC complex.
    action: ACCEPT
    reason: This annotation accurately describes one of the core molecular functions
      of FtsY. Receptor engagement of SRP-RNC is the defining interaction that precedes
      transfer of the RNC to Sec.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Acts as a receptor for the complex formed by the signal recognition
        particle (SRP) and the ribosome-nascent chain (RNC)
  qualifier: enables
- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: GTP binding is a core molecular function of FtsY. The protein contains
      a P-loop NTPase domain with specific GTP binding sites. UniProt documents three
      GTP binding regions at residues 297-304, 379-383, and 443-446. The G domain
      of FtsY adopts a Ras-like fold characteristic of GTPases.
    action: ACCEPT
    reason: This annotation correctly describes a fundamental molecular function of
      FtsY. GTP binding is required for the SRP-FtsY interaction and subsequent targeting
      cycle. Multiple domain annotations (IPR000897, IPR013822) and feature annotations
      in UniProt confirm the presence of GTP binding sites.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Belongs to the GTP-binding SRP family. FtsY subfamily.
  qualifier: enables
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: FtsY is indeed found in the cytoplasm as part of its functional cycle.
      UniProt documents cytoplasmic localization (HAMAP-Rule:MF_00920). However, FtsY
      dynamically associates with the plasma membrane via its acidic A-domain, and
      its primary function occurs at the membrane-cytoplasm interface.
    action: KEEP_AS_NON_CORE
    reason: UniProt explicitly assigns both cytoplasm and peripheral association with
      the cytoplasmic face of the inner membrane. These are dynamic FtsY states rather
      than redundant alternative annotations.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Cytoplasm {ECO:0000256|HAMAP-Rule:MF_00920}
  qualifier: located_in
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Plasma membrane localization is accurate. UniProt places FtsY at the
      cell inner membrane as a peripheral protein on the cytoplasmic side.
    action: ACCEPT
    reason: This is the primary cellular localization where FtsY carries out its function.
      As a peripheral membrane protein, FtsY associates with the cytoplasmic face
      of the plasma membrane to receive SRP-RNC complexes and transfer them to the
      Sec translocase.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Cell inner membrane {ECO:0000256|HAMAP-Rule:MF_00920}
  qualifier: located_in
- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: FtsY is involved in protein targeting, specifically the targeting of
      nascent membrane and secretory proteins to the plasma membrane. However, this
      term is very general and redundant with the more specific annotations for 'protein
      targeting to membrane' (GO:0006612) and 'SRP-dependent cotranslational protein
      targeting to membrane' (GO:0006614).
    action: MODIFY
    reason: This parent term is correct but too broad. Replace it with GO:0006614,
      which captures the SRP-dependent cotranslational mechanism documented for FtsY.
    proposed_replacement_terms:
    - id: GO:0006614
      label: SRP-dependent cotranslational protein targeting to membrane
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Involved in targeting and insertion of nascent membrane proteins
        into the cytoplasmic membrane
  qualifier: involved_in
- term:
    id: GO:0006612
    label: protein targeting to membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  review:
    summary: FtsY is indeed involved in protein targeting to membrane. This annotation
      is accurate but less specific than GO:0006614 (SRP-dependent cotranslational
      protein targeting to membrane). FtsY specifically functions in the SRP-dependent
      co-translational pathway, not in post-translational targeting mechanisms.
    action: MODIFY
    reason: The membrane-targeting statement is correct, but GO:0006614 provides
      the known SRP-dependent cotranslational mechanism and should replace this parent.
    proposed_replacement_terms:
    - id: GO:0006614
      label: SRP-dependent cotranslational protein targeting to membrane
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Involved in targeting and insertion of nascent membrane proteins
        into the cytoplasmic membrane
  qualifier: involved_in
- term:
    id: GO:0006614
    label: SRP-dependent cotranslational protein targeting to membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: This is the most specific existing biological-process annotation for
      FtsY. UniProt identifies FtsY as the receptor that transfers SRP-bound RNCs
      to the Sec translocase.
    action: ACCEPT
    reason: This annotation precisely describes the core biological process in which
      FtsY participates. FtsY is the bacterial SRP receptor that, together with SRP
      (Ffh + 4.5S RNA), mediates co-translational targeting of nascent membrane and
      secretory proteins to the SecYEG translocon. This is the primary and defining
      function of FtsY across bacteria.
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Part of the signal recognition particle protein translocation
        system, which is composed of SRP and FtsY. SRP is a ribonucleoprotein composed
        of Ffh and a 4.5S RNA molecule.
  qualifier: involved_in
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: While FtsY is membrane-associated, this annotation is too general. The
      protein is a peripheral membrane protein specifically associated with the plasma
      membrane (inner membrane in bacteria). GO:0005886 (plasma membrane) provides
      the appropriate level of specificity.
    action: MODIFY
    reason: The parent localization is correct but underspecified. Replace it with
      GO:0005886, which corresponds to the bacterial inner/cell membrane localization
      stated by UniProt.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: UniProt:Q88CR9
      supporting_text: Cell inner membrane {ECO:0000256|HAMAP-Rule:MF_00920}
  qualifier: located_in
