taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PP_2589 is an NAD(P)+-dependent aldehyde dehydrogenase of the ALDH superfamily in Pseudomonas
  putida KT2440 and the leading candidate for the PuuC step of gamma-glutamyl putrescine catabolism, oxidizing
  4-(gamma-L-glutamylamino)butanal. Its KEGG orthology and a PuuC/GABA-aldehyde-dehydrogenase conserved-domain
  assignment support this placement, but its physiological aldehyde substrate has not been tested, and
  KT2440 encodes other aldehyde dehydrogenases that act on aminoaldehydes.
