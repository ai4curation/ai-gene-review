id: Q88JR0
gene_symbol: PP_2589
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_2589 is an NAD(P)-linked aldehyde dehydrogenase and the leading KT2440
  candidate for the PuuC step of gamma-glutamyl putrescine catabolism. KEGG
  orthology and a PuuC/GABA-aldehyde-dehydrogenase conserved-domain assignment
  support this placement, but the local UniProt record remains substrate-generic
  and no KT2440-specific assay establishes gamma-glutamyl aminoaldehyde turnover.
existing_annotations:
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This generic oxidoreductase parent adds little beyond the aldehyde-dehydrogenase class assignment.
      action: MARK_AS_OVER_ANNOTATED
      reason: The UniProt record supports GO:0004030, while substrate-specific PuuC function remains untested.
  - term:
      id: GO:0016620
      label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: The chemistry class is sound, but UniProt provides the more informative aldehyde-dehydrogenase term.
      action: MODIFY
      reason: Replace this broad class term with GO:0004030 without asserting a specific physiological aldehyde substrate.
      proposed_replacement_terms:
        - id: GO:0004030
          label: aldehyde dehydrogenase [NAD(P)+] activity
      supported_by:
        - reference_id: file:PSEPK/PP_2589/PP_2589-uniprot.txt
          supporting_text: DR   GO; GO:0004030; F:aldehyde dehydrogenase [NAD(P)+] activity; IEA:UniProtKB-ARBA.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000117
    title: Electronic Gene Ontology annotations created by ARBA machine learning models
    findings: []
  - id: file:PSEPK/PP_2589/PP_2589-uniprot.txt
    title: UniProtKB entry for PP_2589 (Q88JR0)
    findings:
      - statement: The record supports NAD(P)-linked aldehyde dehydrogenase activity and carries the ALDH_GABALDH-PuuC conserved-domain assignment.
  - id: file:PSEPK/PP_2589/PP_2589-goa.tsv
    title: QuickGO GOA annotations for PP_2589
    findings:
      - statement: The fetched table contains the two broad existing molecular-function annotations reviewed here.
  - id: file:interpro/panther/PTHR11699/PTHR11699-metadata.yaml
    title: PANTHER aldehyde-dehydrogenase-related family metadata
    findings:
      - statement: The family is broad and cannot by itself establish the PuuC substrate.
  - id: PMID:15590624
    title: A novel putrescine utilization pathway involves gamma-glutamylated intermediates of Escherichia coli K-12.
    findings:
      - statement: Defines dehydrogenation of gamma-glutamyl-gamma-aminobutyraldehyde as the third enzyme reaction of the Puu route.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified pathway chemistry from E. coli; it does not establish Q88JR0 substrate specificity.
  - id: PMID:18192388
    title: Transcriptome analysis of agmatine and putrescine catabolism in Pseudomonas aeruginosa PAO1.
    findings:
      - statement: Places gamma-glutamylation as an alternative Pseudomonas route and therefore limits assumptions about target-strain flux.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified comparative route context, not a biochemical assay of PP_2589.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__gamma-glutamyl-putrescine-catabolism__ppu00330-deep-research-openscientist.md
    title: OpenScientist PSEPK gamma-glutamyl putrescine catabolism synthesis
    findings:
      - statement: The report identifies PP_2589 as the leading K09472 PuuC candidate but also records the absence of direct KT2440 substrate evidence.
  - id: file:modules/gamma_glutamyl_putrescine_catabolism.yaml
    title: Gamma-glutamyl putrescine catabolism module
    findings:
      - statement: PP_2589 is retained as a candidate-uncertain target implementation for reaction three.
core_functions:
  - description: >-
      NAD(P)-linked aldehyde dehydrogenase; gamma-glutamyl-gamma-aminobutyraldehyde
      is a pathway-supported candidate substrate rather than an established core specificity.
    molecular_function:
      id: GO:0004030
      label: aldehyde dehydrogenase [NAD(P)+] activity
    supported_by:
      - reference_id: file:PSEPK/PP_2589/PP_2589-uniprot.txt
        supporting_text: DR   GO; GO:0004030; F:aldehyde dehydrogenase [NAD(P)+] activity; IEA:UniProtKB-ARBA.
proposed_new_terms:
  - proposed_name: 4-(gamma-glutamylamino)butanal dehydrogenase activity
    proposed_definition: >-
      Catalysis of the oxidation of 4-(gamma-L-glutamylamino)butanal with
      NAD+ or NADP+ and water to form 4-(gamma-L-glutamylamino)butanoate,
      NADH or NADPH, and protons.
    justification: >-
      The EC 1.2.1.99 reactions Rhea 28410 and Rhea 42340 lack a
      substrate-specific GO molecular-function term. This term proposal does
      not by itself assert that PP_2589 has the activity.
    proposed_parent:
      id: GO:0004030
      label: aldehyde dehydrogenase [NAD(P)+] activity
suggested_questions:
  - question: Does PP_2589 oxidize 4-(gamma-L-glutamylamino)butanal in vivo, and which pyridine nucleotide does it prefer?
suggested_experiments:
  - description: Test purified Q88JR0 against gamma-glutamyl aminoaldehyde and a panel of competing aldehydes with NAD+ and NADP+.
    experiment_type: substrate and cofactor profiling
