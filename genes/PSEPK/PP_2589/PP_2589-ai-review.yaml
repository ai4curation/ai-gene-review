suggested_questions:
- question: Does PP_2589 oxidize 4-(gamma-L-glutamylamino)butanal in vivo, and which pyridine nucleotide
    does it prefer?
suggested_experiments:
- description: Test purified Q88JR0 against gamma-glutamyl aminoaldehyde and a panel of competing aldehydes
    with NAD+ and NADP+.
  experiment_type: substrate and cofactor profiling
knowledge_gaps:
- gap_statement: Whether PP_2589 oxidizes 4-(gamma-L-glutamylamino)butanal in vivo, and whether it is
    the KT2440 PuuC, is untested.
  gap_kind:
  - BIOLOGY
  boundary: The ALDH_GABALDH-PuuC conserved-domain assignment and KEGG orthology make it the leading PuuC
    candidate; KT2440 also has other GABA-aldehyde dehydrogenases, and E. coli PuuC is itself nonspecific.
