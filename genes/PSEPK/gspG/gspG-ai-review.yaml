  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  GspG is the major pseudopilin of the type II secretion system. Mature GspG
  subunits assemble from the inner membrane into the pseudopilus that couples
  ATP-driven extension to displacement of folded substrates through the
  outer-membrane secretin.
