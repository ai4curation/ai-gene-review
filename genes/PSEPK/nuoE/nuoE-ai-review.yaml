  review:
    summary: >-
      Involvement in the respiratory electron transport chain, by orthology with
      E. coli NuoE (PAINT asserts the term at the 24 kDa family root).
    action: NEW
    reason: >-
      NDH-1 is the entry enzyme for NADH-derived electrons into the respiratory
