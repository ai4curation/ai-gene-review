    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      [2Fe-2S] cluster binding, consistent with the PIRSF-rule cluster and the four
      conserved cysteine ligands.
    action: ACCEPT
    reason: >-
      The curated PIRSR rule for the NADH dehydrogenase 24 kDa family places four
      cysteine [2Fe-2S] ligands at Cys91, Cys96, Cys132 and Cys136, matching the
      ligands of cluster N1a in E. coli NuoE, which were demonstrated by EPR and
      mutagenesis. Core cofactor binding.
    supported_by:
