    - reference_id: PMID:28509551
      supporting_text: we individually substituted the cysteine residues
        coordinating N1a of Escherichia coli complex I by alanine and serine residues
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: ISS
  original_reference_id: PMID:18316732
  review:
    summary: >-
      Proposed subunit-level molecular function, by orthology to E. coli NuoE, whose
      [2Fe-2S] cluster N1a is reduced by NADH via the FMN of NuoF.
    action: NEW
    reason: >-
      The only activity this subunit can perform on its own is redox exchange
      through its [2Fe-2S] cluster. In E. coli complex I the orthologous cluster N1a
      is reduced by NADH via the flavin very rapidly and lies within
      electron-transfer distance of the FMN, on a side path to the main wire.
      P. putida NuoE shares the family signatures and all four cluster ligands, so
      the same activity is inferred; it is the subunit MF beneath the complex-level
      contributes_to GO:0008137.
    supported_by:
    - reference_id: PMID:18316732
      supporting_text: The major part of N1a undergoes very fast reduction with a
        time constant
    - reference_id: PMID:28509551
      supporting_text: Binuclear Fe-S cluster N1a is not part of this long chain but
        is located within electron transfer distance on the opposite site of FMN.
    - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: PROSITE; PS01099; COMPLEX1_24K; 1.
- term:
    id: GO:0045271
    label: respiratory chain complex I
  evidence_type: ISS
  original_reference_id: PMID:7607227
  review:
    summary: >-
      Membership of NuoE in respiratory chain complex I, by orthology with E. coli
      NuoE.
    action: NEW
    reason: >-
      P. putida KT2440 encodes a complete nuo locus (nuoA-N with fused nuoCD), and
      NuoE is the 24 kDa subunit family member of it (NCBIfam nuoE_fam). The E. coli
      orthologue is a subunit of the purified 14-subunit complex. The GOA record
      carries only the generic NADH dehydrogenase complex (MODIFY above).
    supported_by:
    - reference_id: PMID:7607227
      supporting_text: The subunits were assigned to the 14 genes of the nuo operon
    - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR01958; nuoE_fam; 1.
