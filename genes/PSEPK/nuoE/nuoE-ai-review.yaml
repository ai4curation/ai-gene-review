- description: >-
    Small [2Fe-2S] (N1a) subunit of the NADH dehydrogenase module of NDH-1, inferred
    from the E. coli orthologue: its cluster exchanges electrons with the reduced
    FMN of NuoF and the subunit contributes to proton-translocating NADH:quinone
    oxidoreduction by complex I at the cytoplasmic membrane.
