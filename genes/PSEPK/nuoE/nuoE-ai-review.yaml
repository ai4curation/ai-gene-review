id: Q88FH4
gene_symbol: nuoE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NuoE is the small 2Fe-2S electron-transfer subunit of the respiratory complex I NADH-input arm. It relays electrons within the peripheral arm but does not itself catalyze NADH oxidation.
existing_annotations:
  - term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: 'NADH dehydrogenase activity is the generic ancestor of the complex-level NADH:ubiquinone oxidoreductase activity; retain as contributes_to GO:0008137 rather than reject.'
      action: MODIFY
      reason: >-
        GO:0003954 (NADH + H+ + acceptor = NAD+ + reduced acceptor) is an is_a ancestor of GO:0008137 NADH dehydrogenase (ubiquinone) activity, the reaction catalysed by the assembled 13-subunit NDH-1 complex of which NuoE is an obligate component. NuoE carries a single [2Fe-2S] cluster and no FMN or NADH-binding site (UniProt Q88FH4 cofactor: 'Binds 1 [2Fe-2S] cluster'); NADH oxidation occurs at the FMN of NuoF, so the subunit does not enable the generic reaction on its own. The TreeGrafter inference (PANTHER node from the GOA WITH/FROM column) is therefore not wrong but too coarse and mis-qualified: GOA carries no GO:0008137 row for this subunit, but the sibling Nuo reviews (nuoG, nuoL, nuoM) handle their UniProt-sourced GO:0008137 rows as MODIFY with a contributes_to qualifier, and the ancestor term should be treated identically here. Replace with GO:0008137 (contributes_to); this term is the more specific, complex-level activity and is consistent with the core_functions entry.
      supported_by:
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
      proposed_replacement_terms:
        - id: GO:0008137
          label: NADH dehydrogenase (ubiquinone) activity
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: 'oxidoreductase activity reflects whole-complex or broad chemistry rather than this subunit direct activity.'
      action: MARK_AS_OVER_ANNOTATED
      reason: The complete NADH:quinone oxidoreductase reaction is an emergent activity of assembled complex I; this subunit contributes to it but does not independently enable the full reaction.
      supported_by:
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
  - term:
      id: GO:0030964
      label: NADH dehydrogenase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: part_of
    review:
      summary: 'NuoE is a subunit of the NADH dehydrogenase complex; the specific complex is respiratory chain complex I, which the review already uses in core_functions.'
      action: MODIFY
      reason: >-
        Correct but general. NuoE belongs to the complex I 24 kDa (NuoE/NDUFV2) subunit family by NCBIfam TIGR01958, PIRSF000216 and PROSITE PS01099 COMPLEX1_24K, whose members are peripheral-arm subunits of NDH-1/complex I; membership in the complex is argued from that family classification, not from a KT2440 purification (none is cached). GO:0045271 respiratory chain complex I is an is_a descendant of GO:0030964 and is the complex used in this review's core_functions, so the row is refined to it. (The UniProt protein name and SUBUNIT text are ARBA predictions and are not cited.)
      supported_by:
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: 'DR   NCBIfam; TIGR01958; nuoE_fam; 1.'
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: ["DR:PIRSF"]
          supporting_text: 'DR   PIRSF; PIRSF000216; NADH_DH_24kDa; 1.'
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: ["DR:PROSITE"]
          supporting_text: 'DR   PROSITE; PS01099; COMPLEX1_24K; 1.'
      proposed_replacement_terms:
        - id: GO:0045271
          label: respiratory chain complex I
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: '2 iron, 2 sulfur cluster binding is supported for NuoE and is retained.'
      action: ACCEPT
      reason: The curated PIRSR000216 rule (UniRule) records one [2Fe-2S] cluster bound by four cysteine positions (FT BINDING 91, 96, 132, 136) in Q88FH4, and the protein carries the Pfam 2Fe-2S_thioredx domain; together these support 2Fe-2S cluster binding as the subunit's direct cofactor function.
      supported_by:
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: ["CC:COFACTOR"]
          supporting_text: 'Note=Binds 1 [2Fe-2S] cluster. {ECO:0000256|PIRSR:PIRSR000216-1};'
        - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: 'DR   Pfam; PF01257; 2Fe-2S_thioredx; 1.'
