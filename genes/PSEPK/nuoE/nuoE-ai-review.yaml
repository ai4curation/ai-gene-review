id: Q88FH4
gene_symbol: nuoE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoE (PP_4122) is the small [2Fe-2S] subunit of the proton-pumping NADH:quinone
  oxidoreductase NDH-1 (respiratory complex I) of Pseudomonas putida, orthologous
  to Escherichia coli NuoE, Thermus/Paracoccus Nqo2 and the mitochondrial 24 kDa
  subunit NDUFV2. The 165-residue protein has a thioredoxin-like fold and binds one
  binuclear iron-sulfur cluster (N1a) through four conserved cysteines (Cys91,
  Cys96, Cys132, Cys136). With NuoF (NADH- and FMN-binding) and NuoG it forms the
  NADH dehydrogenase (N) module at the tip of the peripheral arm, which is attached
  through NuoB and the fused NuoCD subunit to the membrane arm at the cytoplasmic
  membrane. By analogy with the characterised orthologues, its cluster exchanges
  electrons with the reduced FMN of NuoF on a side path to the main iron-sulfur
  wire, and the subunit is needed for assembly and stability of the N module and
  hence for NADH:quinone oxidoreduction coupled to proton translocation.
existing_annotations:
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      TreeGrafter transfer of the PAINT NADH dehydrogenase activity assertion of the
      24 kDa subunit family root to P. putida NuoE.
    action: ACCEPT
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: GO_CENTRAL
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        NADH dehydrogenase activity (GO:0003954) is the NADH-oxidising activity of the N-module of
        respiratory complex I (NDH-1). nuoE is a subunit that contributes to that activity and
        does not catalyse it on its own, so by the GO convention for complex subunits this IEA row
        (assigned by TreeGrafter) should carry contributes_to rather than enables.
    reason: >-
      The source PAINT assertion (root node PTN000042735 of PANTHER PTHR10371,
      seeded by E. coli NuoE and human NDUFV2) is a contributes_to claim: NuoE has no
      NADH or FMN site of its own (both are on NuoF) but is an obligate component of
      the three-subunit NADH dehydrogenase fragment that oxidises NADH. P. putida NuoE
      is in the same subfamily (PTHR10371:SF3) as E. coli NuoE and carries the
      complex I 24 kDa subunit signatures, so the transfer is sound when read as a
      contribution to the N-module activity. The earlier MODIFY to GO:0008137 is
      withdrawn: GO:0003954 (acceptor unspecified) is the correct N-module
      activity, and the complex-level activity is recorded separately in
      core_functions as contributes_to GO:0008137.
    supported_by:
    - reference_id: PMID:7607227
      supporting_text: One of these fragments is a water-soluble NADH dehydrogenase
        fragment which is composed of three subunits bearing at least four iron-sulfur
        clusters (N1b, N1c, N3 and N4) that can be reduced with NADH, one of them
        bearing FMN.
    - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR01958; nuoE_fam; 1.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from the NuoE-like signature (IPR002023) to generic
      oxidoreductase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      NuoE binds a single [2Fe-2S] cluster and no substrate; it does not by itself
      catalyse an oxidoreduction. The oxidoreductase chemistry belongs to the N
      module and the assembled complex, to which NuoE contributes; the subunit's own
      activity is electron transfer through its cluster (GO:0009055, NEW below).
      Treated identically in the E. coli NuoE review.
    supported_by:
    - reference_id: file:PSEPK/nuoE/nuoE-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 1 [2Fe-2S] cluster.
- term:
    id: GO:0030964
    label: NADH dehydrogenase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  review:
    summary: >-
      ARBA assignment of NuoE to the generic NADH dehydrogenase complex.
    action: MODIFY
    reason: >-
      Correct but less specific than warranted. NuoE belongs to the
      proton-translocating NDH-1, i.e. respiratory chain complex I (GO:0045271, an
