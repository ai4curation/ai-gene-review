suggested_questions:
- question: >-
    Is P. putida KT2440 nuoE (and complex I as a whole) required for growth on
    particular carbon sources or under oxidative stress, given that KT2440 also
    encodes non-electrogenic NDH-2 enzymes?
- question: >-
    Does the N1a cluster of P. putida NuoE have the high midpoint potential seen in
    E. coli, and does it limit flavin-derived reactive oxygen species?
suggested_experiments:
- description: >-
    Construct a clean nuoE deletion (and an N1a cysteine-ligand variant) in KT2440
    and measure membrane deamino-NADH:quinone oxidoreductase activity, proton-motive
    force generation, growth on gluconate/succinate, and H2O2 production.
  experiment_type: genetic
