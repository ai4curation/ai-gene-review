      reference_id: file:PSEPK/nuoM/nuoM-uniprot.txt
      supporting_text: PANTHER; PTHR43507:SF1; NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 4; 1.
    - &id001
      reference_id: file:ECOLI/nuoM/nuoM-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every two electrons transferred,
