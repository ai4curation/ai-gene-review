id: Q88FG6
gene_symbol: nuoM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: NuoM (PP_4130) is a multi-pass integral membrane subunit of the proton-translocating NADH:quinone
  oxidoreductase NDH-1 (respiratory complex I), the homologue of mitochondrial ND4. It is the middle of
  three homologous antiporter-like subunits (NuoL, NuoM, NuoN) of the membrane arm; each is built from
  two inverted five-helix repeats forming proton half-channels with conserved lysine/glutamate residues.
  NuoM carries no redox cofactor; redox energy released by quinone reduction at the peripheral/membrane-arm
  interface is transmitted along the membrane arm to drive proton translocation, so that the complex pumps
  four protons per two electrons and generates proton-motive force for aerobic respiration in the plasma
  (cytoplasmic) membrane.
existing_annotations:
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: TreeGrafter NADH dehydrogenase activity is correct only as a contribution to the complex-level,
      proton-pumping NADH:ubiquinone oxidoreductase activity; refine to GO:0008137.
    action: MODIFY
    reason: GO:0003954 is an is_a ancestor of GO:0008137 NADH dehydrogenase (ubiquinone) activity, the
      reaction catalysed by assembled NDH-1. NuoM is a cofactor-free antiporter-like membrane subunit
      that contributes to, rather than independently enables, this activity; the qualifier cannot be changed
      within a review, but the term should be refined to the specific descendant GO:0008137, which this
      gene already carries. This replaces the earlier KEEP_AS_NON_CORE, which conflicted with the rule
      that correct-but-general terms are MODIFY. P. putida KT2440 NuoM (PP_4130) lies in the complete
      syntenic nuo locus and carries the NuoM/ND4-specific InterPro (IPR010227), NCBIfam (TIGR01972) and
      PANTHER PTHR43507:SF1 signatures shared with E. coli NuoM (P0AFE8), so E. coli experimental evidence
      is transferred by orthology.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
