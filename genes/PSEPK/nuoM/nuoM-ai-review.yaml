- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: 'Ubiquinone binding as a NuoM function is an over-annotation: the catalytic quinone site
      lies at the peripheral-arm/NuoH interface, not in the antiporter-like subunits.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The TreeGrafter inference derives from the PANTHER PTHR43507 IBD whose only seed is E. coli
      NuoM azido-ubiquinone photoaffinity labelling (PMID:12730198). Complex I structures place the quinone-binding
      chamber at the interface of Nqo4/6/8 (NuoCD/NuoB/NuoH), with no cofactors in the membrane arm, and
      NuoM mutants still retain bound ubiquinone. Changed from the earlier REMOVE to MARK_AS_OVER_ANNOTATED
      for consistency with the E. coli NuoM review, where the photoaffinity observation itself is not
      disputed.
    supported_by:
    - reference_id: PMID:23417064
      supporting_text: there are no cofactors in the membrane and the antiporter-like subunits
    - reference_id: PMID:12730198
      supporting_text: subunit NuoM was heavily labeled, suggesting that this protein houses the Q-binding
        site
