id: Q88KW1
gene_symbol: puuA-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PuuA-I is a glutamate-putrescine ligase that catalyzes ATP-dependent
  gamma-glutamylation of putrescine, the committed activation step of the
  gamma-glutamyl putrescine catabolic route. This route is an alternative to
  the major SpuC transaminase route described in Pseudomonas. KT2440 encodes at
  least one additional PuuA-like ligase, so the relative physiological
  contribution of PuuA-I is not yet established.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This generic catalytic term is uninformative beside the exact ligase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0034024 captures the substrate-specific reaction.
  - term:
      id: GO:0004356
      label: glutamine synthetase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This is a paralog-family transfer from glutamine synthetases rather than the assigned PuuA reaction.
      action: REMOVE
      reason: >-
        Q88KW1 shares the mixed PTHR43785:SF12 subfamily with experimentally
        characterized E. coli PuuA P78061 and lies beside a PuuD-family
        gamma-glutamyl-GABA hydrolase in the PP_2178-PP_2180 polyamine locus.
        SF12 also contains bona fide glutamine synthetases, so subfamily
        membership alone is not discriminating; the PuuA exemplar plus target
        synteny support removal of the glutamine-synthetase transfer.
      supported_by:
        - reference_id: file:interpro/panther/PTHR43785/PTHR43785-entries.csv
          supporting_text: P78061,Gamma-glutamylputrescine synthetase PuuA
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__gamma-glutamyl-putrescine-catabolism__ppu00330-deep-research-openscientist.md
  - term:
      id: GO:0006598
      label: polyamine catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: PuuA-I initiates catabolism of the polyamine putrescine.
      action: MODIFY
      reason: The substrate is specifically putrescine, so replace this generic polyamine parent with GO:0009447.
      proposed_replacement_terms:
        - id: GO:0009447
          label: putrescine catabolic process
  - term:
      id: GO:0016874
      label: ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This broad ligase parent adds no information beyond GO:0034024.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retain the exact substrate-specific molecular function instead.
  - term:
      id: GO:0034024
      label: glutamate-putrescine ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: This is the defining EC 6.3.1.11 PuuA activity.
      action: ACCEPT
      reason: >-
        Experimentally characterized E. coli PuuA P78061 shares
        PTHR43785:SF12 with Q88KW1, while the target lies in a polyamine locus
        beside a PuuD-family hydrolase. The subfamily is functionally mixed, so
        the ortholog exemplar and synteny, rather than its label, ground the
        target assignment.
      supported_by:
        - reference_id: file:PSEPK/puuA-I/puuA-I-uniprot.txt
          supporting_text: DR   GO; GO:0034024; F:glutamate-putrescine ligase activity; IEA:UniProtKB-EC.
        - reference_id: file:interpro/panther/PTHR43785/PTHR43785-entries.csv
          supporting_text: P78061,Gamma-glutamylputrescine synthetase PuuA
        - reference_id: PMID:18495664
          supporting_text: Purified non-tagged PuuA
