  label: Pseudomonas putida KT2440
description: puuA-I (PP_2178) is one of two Pseudomonas putida KT2440 PuuA-like glutamine synthetase-fold
  ligases annotated as glutamate-putrescine ligase (EC 6.3.1.11). By membership of the PuuA/PauA lineage
  of PANTHER PTHR43785, inheritance of the PuuA-clade polyamine-catabolism annotation, and gene context,
  it is predicted to catalyse ATP-dependent gamma-glutamylation of putrescine, the committed first step
  of the gamma-glutamyl route of putrescine catabolism. It is encoded beside spuA (PP_2179), a PuuD-family
  gamma-glutamyl-GABA hydrolase, and spuC-I (PP_2180), a polyamine aminotransferase. KT2440 also encodes
  the GlnA glutamine synthetase of a separate family and further gamma-glutamylpolyamine synthetase paralogs;
  no KT2440 PuuA paralog has been assayed, so the amine substrate preferred by each paralog is not established.
