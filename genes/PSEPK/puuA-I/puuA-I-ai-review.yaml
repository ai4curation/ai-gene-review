id: Q88KW1
gene_symbol: puuA-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PuuA-I is a glutamate-putrescine ligase that catalyzes ATP-dependent
  gamma-glutamylation of putrescine, the committed activation step of the
  gamma-glutamyl putrescine catabolic route. KT2440 encodes at least one
  additional PuuA-like ligase, so the relative physiological contribution of
  PuuA-I is not yet established.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This generic catalytic term is uninformative beside the exact ligase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0034024 captures the substrate-specific reaction.
  - term:
      id: GO:0004356
      label: glutamine synthetase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: This is a paralog-family transfer from glutamine synthetases rather than the assigned PuuA reaction.
      action: REMOVE
      reason: The protein is named and EC-mapped as glutamate-putrescine ligase, not glutamine synthetase.
      supported_by:
        - reference_id: file:PSEPK/puuA-I/puuA-I-uniprot.txt
          supporting_text: DR   GO; GO:0034024; F:glutamate-putrescine ligase activity; IEA:UniProtKB-EC.
  - term:
      id: GO:0006598
      label: polyamine catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: PuuA-I initiates catabolism of the polyamine putrescine.
      action: ACCEPT
      reason: The exact EC assignment and pathway architecture support this process.
  - term:
      id: GO:0016874
      label: ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This broad ligase parent adds no information beyond GO:0034024.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retain the exact substrate-specific molecular function instead.
  - term:
      id: GO:0034024
      label: glutamate-putrescine ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: This is the defining EC 6.3.1.11 PuuA activity.
      action: ACCEPT
      reason: The gene name, protein name, EC mapping, PANTHER parent-family name, and pathway context converge on this reaction.
      supported_by:
        - reference_id: file:PSEPK/puuA-I/puuA-I-uniprot.txt
          supporting_text: DR   GO; GO:0034024; F:glutamate-putrescine ligase activity; IEA:UniProtKB-EC.
  - term:
      id: GO:0009447
      label: putrescine catabolic process
    evidence_type: ISS
    original_reference_id: file:modules/gamma_glutamyl_putrescine_catabolism.yaml
    qualifier: involved_in
    review:
      summary: PuuA-I performs the committed first reaction of putrescine catabolism through gamma-glutamylated intermediates.
      action: NEW
      reason: This substrate-specific process is more informative than the existing polyamine parent term.
