suggested_questions:
- question: Which amines (putrescine, spermidine, cadaverine, diaminopropane) do puuA-I and puuA-II prefer,
    and how do they divide work with the spuB and spuI glutamylpolyamine synthetases?
suggested_experiments:
- description: Purify puuA-I and puuA-II, measure kinetics with putrescine, other polyamines and ammonium,
    and test single and combined deletions for growth on putrescine.
  experiment_type: comparative enzyme kinetics and genetics
