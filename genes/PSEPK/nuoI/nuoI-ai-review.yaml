- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: ISS
  original_reference_id: PMID:22474289
  qualifier: enables
  review:
    summary: Proposed new annotation. The two [4Fe-4S] clusters of NuoI relay
      electrons from cluster N5 to cluster N2 within complex I.
    action: NEW
    reason: Electron transfer through its own Fe-S clusters is the activity NuoI
      performs. Mutagenesis of the E. coli orthologue shows that clusters N6a
      and N6b are essential for NDH-1 electron transfer, and the KT2440 protein
      has the same HAMAP family and two ferredoxin-type cluster domains. This is
      the module-level function for the NuoI step.
    supported_by:
    - reference_id: PMID:22474289
      supporting_text: biochemical data, including the activity and assembly of
        NDH-1 together with EPR data of the mutants, unequivocally affirmed that
        clusters N6a and N6b are essential for electron transfer of NDH-1.
    - reference_id: file:PSEPK/nuoI/nuoI-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the complex I 23 kDa subunit family.'
- term:
    id: GO:0022904
    label: respiratory electron transport chain
  evidence_type: ISS
  original_reference_id: PMID:22474289
  qualifier: involved_in
  review:
    summary: Proposed new annotation. NuoI carries part of the electron path
      from NADH to quinone in complex I.
    action: NEW
    reason: The HAMAP function states that NDH-1 shuttles electrons from NADH to
      quinones through Fe-S centres, and NuoI's clusters are part of that wire.
      NuoI does part of the work of the respiratory electron transport chain,
      so the process annotation passes the participation test. It replaces the
      broader aerobic respiration as the core process.
    supported_by:
    - reference_id: PMID:22474289
      supporting_text: plays a role in bridging the electron transfer from cluster
        N5 to the terminal cluster N2
    - reference_id: file:PSEPK/nuoI/nuoI-uniprot.txt
      supporting_text: NDH-1 shuttles electrons from NADH, via FMN and iron-sulfur
        (Fe-S) centers, to quinones in the respiratory chain.
