taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoI (PP_4126) is the TYKY-type (NDUFS8-homologous) iron-sulfur subunit of
  the proton-translocating NADH:quinone oxidoreductase NDH-1 (respiratory
  complex I). Its two tandem 4Fe-4S ferredoxin-type domains bind two [4Fe-4S]
  clusters (N6a and N6b in the E. coli orthologue). In the peripheral arm,
  bound to the cytoplasmic side of the inner membrane, these clusters relay
  electrons from cluster N5 to the terminal cluster N2, between the
  NADH-oxidising module and the quinone-reduction site. NuoI thereby
  contributes to NADH:quinone oxidoreduction coupled to proton translocation
  in the respiratory chain.
existing_annotations:
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: TreeGrafter assignment of the generic NADH dehydrogenase activity,
      an is_a ancestor of the complex-level NADH:ubiquinone oxidoreductase
      activity.
    action: MODIFY
    reason: GO:0003954 is an is_a ancestor of GO:0008137, the proton-coupled
      reaction of the assembled NDH-1. NuoI has no FMN or NADH site; NADH is
      oxidised at NuoF. NuoI is an obligate electron-relay subunit, so the
      correct claim is contributes_to GO:0008137, which matches the core
      function.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
    - reference_id: file:PSEPK/nuoI/nuoI-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for
        every two electrons transferred, four hydrogen ions are translocated
        across the cytoplasmic membrane), and thus conserves the redox energy in
        a proton gradient.
