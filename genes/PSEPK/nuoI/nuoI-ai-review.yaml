core_functions:
- description: >-
    NuoI relays electrons through its two [4Fe-4S] clusters (N6a/N6b) from
    cluster N5 to the terminal cluster N2 in the peripheral arm of the
    plasma-membrane NDH-1. It thereby contributes to the proton-coupled
    NADH:ubiquinone oxidoreductase activity of respiratory complex I. The
    assignment is by orthology to E. coli NuoI.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
