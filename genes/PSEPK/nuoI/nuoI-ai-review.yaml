      Rule:MF_01351};
suggested_questions:
- question: Has the contribution of P. putida KT2440 nuoI to complex I assembly,
    electron transfer or proton-coupling efficiency been tested directly?
suggested_experiments:
- description: Construct a clean nuoI deletion and cluster-ligand Cys-to-Ser
    variants in KT2440, then measure membrane NADH:ubiquinone oxidoreductase
    activity, EPR signals of N6a/N6b and proton-motive-force generation.
