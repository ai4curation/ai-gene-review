taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  EutB (PP_0543) is the large alpha subunit of adenosylcobalamin-dependent
  ethanolamine ammonia-lyase. It contains the catalytic TIM-barrel region and
  works with EutC, which completes the intersubunit cofactor environment, to
  convert ethanolamine into acetaldehyde and ammonium during ethanolamine catabolism.
