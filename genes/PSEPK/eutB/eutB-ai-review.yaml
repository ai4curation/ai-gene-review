suggested_questions:
- question: Without a microcompartment, how does KT2440 limit loss and toxicity of the acetaldehyde produced by cytoplasmic EutBC, for example by coupling to the adjacent aldB-I aldehyde dehydrogenase?
suggested_experiments:
- description: Assay ethanolamine ammonia-lyase activity in soluble extracts of wild type, eutB deletion and complemented strains grown on ethanolamine plus B12, and measure acetaldehyde release and growth.
  experiment_type: reverse genetics and enzyme assay
