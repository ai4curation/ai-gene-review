proposed_new_terms: []
suggested_questions:
- question: Where does active EutBC occur in native KT2440, and how is acetaldehyde loss or toxicity controlled?
    Does the adjacent aldB-I aldehyde dehydrogenase couple to the enzyme despite the absence of detected
    conventional BMC shell signatures?
suggested_experiments:
- description: Assay ethanolamine ammonia-lyase activity in soluble extracts of wild type, eutB deletion
    and complemented strains grown on ethanolamine plus B12, and measure acetaldehyde release and growth.
  experiment_type: reverse genetics and enzyme assay
