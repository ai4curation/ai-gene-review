  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: part_of
  review:
    summary: EutB is the large subunit of the EutB/EutC complex.
    action: ACCEPT
    reason: Purified E. coli enzyme contains equal large and small subunits in an alpha6-beta6 assembly.
    supported_by:
    - reference_id: PMID:19762342
      supporting_text: The eutB and eutC genes in the eut operon encoded the large and small subunits
        of the enzyme, respectively. The enzyme existed as the heterododecamer alpha(6)beta(6).
- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: EutB makes direct contacts with the cobalamin cofactor bound at the EutB/EutC interface.
    action: ACCEPT
    reason: In the characterized E. coli ortholog EutB carries experimentally defined adenosylcobalamin-contact
      residues (UniProt positions 194, 246, 295 and 401, from the crystal structures); the cofactor sits
      at the subunit interface and both subunits bind it directly, so `enables` is acceptable.
    supported_by:
    - reference_id: file:ECOLI/eutB/eutB-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: Note=Binds 1 AdoCbl between the large and small subunits, with 6 cofactors per
        holoenzyme.
    - reference_id: PMID:20519496
      supporting_text: the beta-subunit covers the lower part of the cobalamin that is bound in the interface
        of the alpha- and beta-subunits
- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: The conventional Eut microcompartment location is not supported for the KT2440 reference
      proteome.
    action: REMOVE
    reason: The reproducible KT2440 reference-proteome inventory detects no PF00936/IPR000249 BMC or PF03319/IPR004992
      vertex signatures, with the E. coli Eut shell set recovered as a positive control; the local eut
      locus also lacks identified shell genes. This supports rejecting a conventional Eut shell-location
      transfer to KT2440. The inference is bounded by signature coverage and could miss divergent shell
      proteins. It does not demonstrate where native KT2440 EutBC activity occurs or establish a free
      cytosolic active state.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
        proteome, while the same queries recover the complete E. coli Eut shell set.
