  qualifier: part_of
  review:
    summary: EutB is the large subunit of the EutB/EutC complex.
    action: ACCEPT
    reason: Purified E. coli enzyme contains equal large and small subunits in an alpha6-beta6 assembly.
    supported_by:
    - reference_id: PMID:19762342
      supporting_text: >-
        The eutB and eutC genes in the eut operon encoded the large and small
        subunits of the enzyme, respectively. The enzyme existed as the
        heterododecamer alpha(6)beta(6).
- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The cobalamin-binding environment spans the EutB/EutC interface.
    action: REMOVE
    reason: >-
      EutB does not provide the complete binding environment independently.
      The source `enables` assertion is replaced by `contributes_to` below.
    supported_by:
    - reference_id: PMID:20519496
      supporting_text: >-
        the beta-subunit covers the lower part of the cobalamin that is bound in
