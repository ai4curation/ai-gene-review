id: Q88QF1
gene_symbol: eutB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  EutB (PP_0543) is the large alpha subunit of adenosylcobalamin-dependent
  ethanolamine ammonia-lyase. It contains the catalytic TIM-barrel region and
  works with EutC, which completes the intersubunit cofactor environment, to
  convert ethanolamine into acetaldehyde and ammonium during ethanolamine catabolism.
existing_annotations:
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: TreeGrafter places KT2440 EutB in the cytosol.
    action: ACCEPT
    reason: >-
      KT2440 EutB/EutC is a soluble enzyme. The proteome-wide shell inventory
      finds no microcompartment shell protein in KT2440, so the enzyme cannot be
      encapsulated and must act in the cytoplasm; cytosol is the correct and
      core location.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: >-
        With no
        shell protein there can be no microcompartment, so EutB/EutC in KT2440 must act as a
        free cytoplasmic enzyme.
    - reference_id: PMID:19762342
      supporting_text: >-
        A truncated enzyme was highly soluble even in the absence of detergent
- term:
