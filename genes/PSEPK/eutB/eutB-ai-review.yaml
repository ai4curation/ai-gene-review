references:
- id: PMID:2197274
  title: Cloning, sequencing, and expression of the genes encoding the adenosylcobalamin-dependent ethanolamine ammonia-lyase of Salmonella typhimurium.
  findings:
  - supporting_text: we have cloned the genes for the 2 subunits of the S. typhimurium enzyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct Salmonella genetic evidence for the two-subunit enzyme; KT2440 transfer is by conserved family and locus.
- id: PMID:19762342
  title: Purification and some properties of wild-type and N-terminal-truncated ethanolamine ammonia-lyase of Escherichia coli.
  findings:
  - supporting_text: >-
      The eutB and eutC genes in the eut operon encoded the large and small
      subunits of the enzyme, respectively. The enzyme existed as the
      heterododecamer alpha(6)beta(6).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical evidence for the E. coli EutB/EutC complex.
- id: PMID:20519496
  title: Crystal structures of ethanolamine ammonia-lyase complexed with coenzyme B12 analogs and substrates.
  findings:
  - supporting_text: >-
      The active site is in the (beta/alpha)(8) barrel of the alpha-subunit;
      the beta-subunit covers the lower part of the cobalamin that is bound in
      the interface of the alpha- and beta-subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct E. coli structural evidence for the catalytic large-subunit role.
- id: PMID:19783625
  title: Comparative genomics of ethanolamine utilization.
  findings:
  - supporting_text: >-
      Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into
      acetaldehyde and ammonia, is encoded by the gene tandem eutBC.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative-genomics support for the conserved EutBC pathway assignment.
