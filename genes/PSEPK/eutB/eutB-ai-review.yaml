    summary: Eut organelle location transferred by UniRule; KT2440 encodes no shell proteins.
    action: REMOVE
    reason: >-
      Same over-propagation as the GO:0031469 row: GO:0031471 is_a GO:0031469,
      and without any BMC or EutN/CcmL shell protein in the KT2440 proteome
