- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: EutB is the catalytic large subunit of ethanolamine ammonia-lyase.
    action: ACCEPT
    reason: KT2440 EutB carries the EutB family signature and is encoded in tandem with eutC. In the characterized
      E. coli ortholog the active site and the substrate-binding residues lie in the EutB TIM barrel,
      so `enables` is the correct relation for the large subunit (EutC, by contrast, contributes_to).
    supported_by:
    - reference_id: PMID:20519496
      supporting_text: The active site is in the (beta/alpha)(8) barrel of the alpha-subunit; the beta-subunit
        covers the lower part of the cobalamin that is bound in the interface of the alpha- and beta-subunits.
    - reference_id: file:PSEPK/eutB/eutB-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: Pfam; PF06751; EutB; 1.
