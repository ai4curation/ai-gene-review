- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosolic activity is plausible for KT2440 EutB, but its native activity location is not
      established by the cited evidence.
    action: UNDECIDED
    reason: The KT2440 inventory detects no conventional BMC shell signatures and argues against the transferred
      Eut microcompartment location. Absence of these signatures does not by itself demonstrate a free
      cytosolic active enzyme. PMID:19762342 assays E. coli enzyme and reports enhanced solubility of
      an N-terminal-truncated construct, not localization of native KT2440 EutB. The TreeGrafter cytosol
      claim remains unresolved pending target-specific localization evidence; this is not a challenge
      based on donor count.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: 'the inventory depends on UniProt''s InterPro/Pfam match data for the

        reference proteome; a highly divergent shell protein missed by both Pfam models

        would not be detected.'
    - reference_id: PMID:19762342
      supporting_text: A truncated enzyme was highly soluble even in the absence of detergent
