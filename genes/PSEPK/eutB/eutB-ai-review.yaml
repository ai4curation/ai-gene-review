- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: The transferred microcompartment localization has not been established directly in KT2440.
    action: UNDECIDED
    reason: >-
      The cytosol IEA and compact local locus make encapsulation uncertain, but
      neither observation excludes regulated recruitment to a microcompartment.
      No reproducible KT2440 proteome-wide shell analysis is available in-tree.
- term:
    id: GO:0031471
    label: ethanolamine degradation polyhedral organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: The ethanolamine-organelle localization is plausible by family transfer but unverified in KT2440.
    action: UNDECIDED
    reason: >-
      Characterized enterobacterial Eut systems can be encapsulated, whereas the
      available KT2440 evidence does not establish a shell-containing organelle.
      A reproducible species-specific localization or shell inventory is needed.
