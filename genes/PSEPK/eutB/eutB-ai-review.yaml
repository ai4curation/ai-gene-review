id: Q88QF1
gene_symbol: eutB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  EutB (PP_0543) is the large alpha subunit of adenosylcobalamin-dependent
  ethanolamine ammonia-lyase. It contains the catalytic TIM-barrel region and
  works with EutC, which completes the intersubunit cofactor environment, to
  convert ethanolamine into acetaldehyde and ammonium during ethanolamine catabolism.
existing_annotations:
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: TreeGrafter places KT2440 EutB in the cytosol.
    action: ACCEPT
    reason: This is consistent with a soluble EutB/EutC enzyme, although it does not by itself exclude regulated microcompartment encapsulation.
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Ethanolamine is an amino alcohol rather than an amino acid.
    action: REMOVE
    reason: GO:0046336 directly captures the established ethanolamine-catabolic role, whereas this InterPro mapping transfers an incorrect chemical category.
    supported_by:
    - reference_id: PMID:19783625
      supporting_text: >-
        Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into
        acetaldehyde and ammonia, is encoded by the gene tandem eutBC.
- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The function is correct, but EutB is one active subunit of the EutB/EutC enzyme.
    action: REMOVE
    reason: >-
      The assembled heteromeric enzyme performs catalysis. The source `enables`
      assertion is replaced below by a paired `contributes_to` assertion.
    supported_by:
    - reference_id: PMID:19762342
      supporting_text: >-
        The eutB and eutC genes in the eut operon encoded the large and small
        subunits of the enzyme, respectively. The enzyme existed as the
        heterododecamer alpha(6)beta(6).
- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: ISS
  original_reference_id: PMID:2197274
  qualifier: contributes_to
  review:
    summary: EutB contributes the catalytic large subunit of the EutB/EutC enzyme.
    action: NEW
    reason: >-
      The KT2440 family assignment, tandem with eutC, and characterized
      E. coli and Salmonella orthologs support the corrected complex-subunit relation.
    additional_reference_ids:
    - UniProtKB:P0AEJ6
    supported_by:
    - reference_id: PMID:2197274
      supporting_text: we have cloned the genes for the 2 subunits of the S. typhimurium enzyme
