- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: ISS
  original_reference_id: PMID:20519496
  qualifier: contributes_to
  review:
    summary: EutB contributes to the intersubunit cobalamin-binding environment.
    action: NEW
    reason: Structural evidence shows that the complete cofactor site requires both subunits.
    additional_reference_ids:
    - UniProtKB:P0AEJ6
    supported_by:
    - reference_id: PMID:20519496
      supporting_text: >-
        The active site is in the (beta/alpha)(8) barrel of the alpha-subunit;
        the beta-subunit covers the lower part of the cobalamin that is bound in
