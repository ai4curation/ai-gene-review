core_functions:
- description: Catalytic large subunit of the adenosylcobalamin-dependent EutB/EutC enzyme, carrying the
    active-site barrel that cleaves ethanolamine into acetaldehyde and ammonium within the assembled enzyme.
    The KT2440 assignment is inferred from its family and conserved EutBC organization together with characterized
    E. coli homologs; the native activity location has not been demonstrated.
