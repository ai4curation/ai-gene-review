      record_section: ["CC:COFACTOR"]
      supporting_text: >-
        Note=Binds 1 AdoCbl between the large and small subunits, with 6
        cofactors per holoenzyme.
    - reference_id: PMID:20519496
      supporting_text: >-
        the beta-subunit covers the lower part of the cobalamin that is bound in
        the interface of the alpha- and beta-subunits
- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Microcompartment location transferred from the HAMAP rule; KT2440 encodes no shell proteins.
    action: REMOVE
    reason: >-
      A bacterial microcompartment is by definition a proteinaceous shell. A
      proteome-wide query of the KT2440 reference proteome finds no BMC-domain
      (PF00936/IPR000249) or EutN/CcmL vertex (PF03319/IPR004992) protein,
      while the same queries recover the full E. coli Eut shell set, and the
      KT2440 eut locus (PP_0542-PP_0546) contains no shell genes. The
      location is over-propagated from shell-encoding enterobacterial eut
      operons; EutBC acts as a free cytoplasmic enzyme in KT2440, consistent
      with the TreeGrafter cytosol row.
    supported_by:
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: >-
        KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
        proteome, while the same queries recover the complete E. coli Eut shell set.
