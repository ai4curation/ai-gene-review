- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: EutB makes direct contacts with the cobalamin cofactor bound at the EutB/EutC interface.
    action: ACCEPT
    reason: >-
      In the characterized E. coli ortholog EutB carries experimentally defined
      adenosylcobalamin-contact residues (UniProt positions 194, 246, 295 and
      401, from the crystal structures); the cofactor sits at the subunit
      interface and both subunits bind it directly, so `enables` is acceptable.
    supported_by:
