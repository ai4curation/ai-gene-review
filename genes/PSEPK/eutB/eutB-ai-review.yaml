  review:
    summary: EutB contributes the catalytic large subunit of the EutB/EutC enzyme.
    action: NEW
    reason: >-
      The KT2440 HAMAP assignment, exact EutB family placement, tandem with
      eutC, and experimentally characterized E. coli/Salmonella orthologs
      support this complex-subunit annotation. It is not a direct KT2440 assay.
