suggested_questions:
- question: Which helicase substitutes for UvrD in residual KT2440 mismatch repair?
suggested_experiments:
- hypothesis: UvrD is the preferred but partially redundant helicase for KT2440 MMR.
  description: Reconstitute MutS/MutL-directed unwinding with Q88C31 and test candidate backup helicases genetically
    and biochemically in single and combined deletion backgrounds.
  experiment_type: repair reconstitution and synthetic-mutant analysis
