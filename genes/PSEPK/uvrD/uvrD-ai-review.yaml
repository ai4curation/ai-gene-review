id: Q88C31
gene_symbol: uvrD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  UvrD is a cytosolic ATP-dependent 3'-to-5' DNA helicase that unwinds duplex
  DNA during several repair pathways. In Pseudomonas putida it contributes to
  both nucleotide excision repair and mismatch repair and helps suppress
  spontaneous mutation. Loss of UvrD elevates mutation frequency but does not
  completely abolish either pathway, indicating that UvrD is important without
  being the only helicase capable of supporting these reactions.
