  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: UvrD is a 3-prime-to-5-prime ATP-dependent DNA helicase shared among nucleotide-excision repair, mismatch repair, replication-associated repair, and recombination control. In bacterial NER it removes the damage-containing oligonucleotide and helps release UvrB after incision.
