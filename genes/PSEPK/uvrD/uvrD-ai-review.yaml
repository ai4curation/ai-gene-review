- id: file:PSEPK/uvrD/uvrD-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK uvrD
  findings:
  - statement: OpenScientist independently recovered Q88C31/PP_5352 as a conserved UvrD/DNA helicase II ortholog.
    supporting_text: Q88C31 is UvrD (DNA helicase II), encoded by *uvrD*/PP_5352 in *Pseudomonas putida* KT2440.
  - statement: OpenScientist corroborated the ATP-dependent 3'-to-5' DNA motor assignment.
    supporting_text: It is an **ATP-dependent, superfamily-1A (SF1A) DNA helicase / single-stranded-DNA (ssDNA)
      translocase** that moves along DNA with **3'→5' polarity** and hydrolyzes ATP in a DNA-stimulated manner (EC
      5.6.2.4).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Report corroborates Q88C31/PP_5352 as a conserved SF1A UvrD and the ATP-dependent 3'-to-5' DNA
      helicase assignment. Its NER/MMR/TCR and anti-recombinase synthesis is mostly ortholog-derived and it missed
      the direct P. putida deletion evidence in PMID:30292721, so only the conserved molecular-function material
      is used here.
