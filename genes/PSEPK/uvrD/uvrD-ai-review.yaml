  review:
    summary: Add mismatch repair. A P. putida uvrD deletion is a mutator, with MMR impaired but not abolished; an
      ATP-site uvrD allele of P. aeruginosa is MMR-defective.
    action: NEW
    reason: 'Direct organism-specific mutant phenotype plus close-species allele evidence; the ortholog''s MMR role
      is established biochemically. The participation test is met: UvrD unwinds the error-containing strand in MMR
      rather than being a substrate.'
    supported_by:
    - &id013
      reference_id: PMID:30292721
      supporting_text: UvrD helicase is essential to prevent the emergence of mutations
    - &id011
      reference_id: PMID:30292721
      supporting_text: NER or MMR pathways are not completely abolished in UvrD-deficient P. putida.
    - &id014
      reference_id: PMID:11952911
      supporting_text: the uvrD strain had three amino acid substitutions within the conserved ATP binding site
        of the deduced UvrD polypeptide, showing defective mismatch repair activity.
- term:
    id: GO:0006289
    label: nucleotide-excision repair
  evidence_type: IMP
  original_reference_id: PMID:30292721
  qualifier: involved_in
  review:
    summary: Add nucleotide-excision repair. P. putida uvrD deletion reduces survival of DNA damage while NER is
      not abolished.
    action: NEW
    reason: Organism-specific mutant evidence, together with the ortholog's biochemically defined post-incision
      role in releasing the excised oligonucleotide, supports UvrD participation in NER. The P. aeruginosa ATP-site
      allele that is MMR-defective but NER-proficient shows the pathways are separable, so this rests on the P.
      putida deletion phenotype.
    supported_by:
    - reference_id: PMID:30292721
      supporting_text: UvrD was also found to be necessary to survive DNA damage
