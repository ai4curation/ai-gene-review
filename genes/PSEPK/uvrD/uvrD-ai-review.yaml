id: Q88C31
gene_symbol: uvrD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: UvrD (DNA helicase II, PP_5352) of Pseudomonas putida KT2440 is a cytosolic superfamily 1A ATP-dependent
  DNA helicase of the UvrD/Rep/PcrA family that unwinds duplex DNA with 3'-to-5' polarity. By orthology with Escherichia
  coli UvrD it acts after dual incision in nucleotide excision repair and in methyl-directed mismatch repair, and
  it counteracts RecA at blocked replication forks. In P. putida loss of uvrD raises spontaneous mutation frequency
  and reduces survival of DNA damage, but neither nucleotide excision repair nor mismatch repair is completely abolished,
  so UvrD is important without being the only helicase able to support these reactions.
