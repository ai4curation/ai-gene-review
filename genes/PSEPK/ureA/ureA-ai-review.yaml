suggested_questions:
  - question: Has the PP_2843 UreA subunit been tested directly for assembly of active KT2440 urease?
suggested_experiments:
  - hypothesis: Q88J06 is required for assembly of catalytically competent KT2440 UreABC.
    description: Delete ureA and test restoration of UreABC assembly and urease activity by complementation with Q88J06.
    experiment_type: Gene deletion, complementation, native complex analysis, and urease assay
