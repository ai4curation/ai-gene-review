id: Q88J06
gene_symbol: ureA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreA is the cytoplasmic gamma structural subunit of the three-chain bacterial
  urease. It assembles with UreB and UreC to form the UreABC apoprotein and
  contributes to urease-catalyzed urea hydrolysis after UreDEFG-dependent
  installation of the dinickel active site in UreC.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: The reviewed UniProt record places the UreA subunit in the cytoplasm.
      action: ACCEPT
      reason: Cytoplasmic localization is consistent with assembly and activity of the soluble UreABC complex.
  - term:
      id: GO:0009039
      label: urease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: UreA is required for the heteromeric urease complex but does not independently catalyze urea hydrolysis.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The activity term is biologically relevant, but the enables qualifier
        overstates an individual structural subunit. UreA contributes to the
        UreABC complex activity; the dinickel catalytic center resides in UreC
        (PMID:8718850).
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The InterPro transfer assigns nickel binding to UreA, although the urease nickel site resides in UreC.
      action: REMOVE
      reason: >-
        Structural evidence places the binickel active center in the alpha/UreC
        subunit, not in the gamma/UreA chain (PMID:8718850); no target-specific
        evidence supports a separate nickel-binding role for Q88J06.
  - term:
      id: GO:0019627
      label: urea metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: UreA participates specifically in urea catabolism as part of urease.
      action: KEEP_AS_NON_CORE
      reason: The broader ancestor is biologically true but less informative than the supported child term GO:0043419.
  - term:
      id: GO:0043419
      label: urea catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: UreA is a required structural component of the urea-hydrolyzing urease complex.
      action: ACCEPT
      reason: The UreABC complex directly performs the defining reaction of urea catabolism.
  - term:
      id: GO:0035550
      label: urease complex
    evidence_type: IEA
    original_reference_id: file:PSEPK/ureA/ureA-uniprot.txt
    qualifier: part_of
    review:
      summary: UreA is the gamma structural subunit of the UreABC urease complex.
      action: NEW
      reason: Reviewed UniProt and alpha-beta-gamma structural evidence support explicit complex membership.
  - term:
      id: GO:0005198
      label: structural molecule activity
    evidence_type: ISS
    original_reference_id: PMID:8718850
    qualifier: enables
    review:
      summary: UreA supplies structural integrity to the heteromeric urease complex.
      action: NEW
      reason: The gamma chain is a noncatalytic structural subunit of the alpha-beta-gamma assembly.
      supported_by:
        - reference_id: PMID:8718850
          supporting_text: >-
            Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268,
            998-1004] is an (alpha beta gamma)3 trimer with each alpha-subunit
            having an (alpha beta)8-barrel domain containing a binickel active center.
