  label: Pseudomonas putida KT2440
description: Ppc (PP_1505) is the type-1 phosphoenolpyruvate carboxylase of Pseudomonas putida KT2440,
  a soluble enzyme that carboxylates phosphoenolpyruvate with bicarbonate to form oxaloacetate and phosphate.
  It acts as an anaplerotic enzyme at the phosphoenolpyruvate-pyruvate-oxaloacetate node, replenishing
  oxaloacetate for the tricarboxylic acid cycle and for biosynthesis, alongside the two-subunit pyruvate
  carboxylase PycAB. Bacterial type-1 PEPCs such as the characterised Escherichia coli enzyme are allosterically
  activated by acetyl-CoA and fructose 1,6-bisphosphate and inhibited by aspartate and malate; this regulation
  has not been tested in KT2440.
