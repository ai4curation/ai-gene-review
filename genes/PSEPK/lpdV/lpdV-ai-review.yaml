- id: PMID:1902462
  title: Cloning and sequence analysis of the LPD-glc structural gene of Pseudomonas putida.
  findings:
  - statement: P. putida LPD-val is the specific E3 of the branched-chain keto acid dehydrogenase complex.
    supporting_text: >-
      LPD-val, which is the specific E3 component of the branched-chain keto acid
      dehydrogenase complex
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. putida paralog evidence; transfer to KT2440 LpdV is reinforced by its bkd-operon position.
- id: PMID:6546487
  title: Oxidation of glycine by Pseudomonas putida requires a specific lipoamide dehydrogenase.
  findings:
  - statement: P. putida glycine oxidation uses LPD-glc rather than LPD-val.
    supporting_text: >-
      The partially purified glycine oxidation system from P. putida was
      stimulated by LPD-glc but not by LPD-val
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical evidence against LPD-val as the physiological glycine-oxidation E3.
- id: file:projects/P_PUTIDA/batches/ppu00260_glycine_cleavage_system.md
  title: PSEPK glycine cleavage system batch
  findings:
  - statement: LpdV is excluded from the physiological GCS L role because it is the bkd-linked LPD-val paralog.
