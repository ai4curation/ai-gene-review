taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  LpdV (PP_4404) is the LPD-val dihydrolipoyl dehydrogenase of the branched-chain
  2-oxoacid dehydrogenase complex. It uses FAD and NAD+ to reoxidize the
  protein-bound dihydrolipoyl group and is encoded with the other bkd complex
  components.
