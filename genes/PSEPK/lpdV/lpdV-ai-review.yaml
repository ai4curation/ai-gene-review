id: Q88EP9
gene_symbol: lpdV
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  LpdV is the FAD-dependent E3 dihydrolipoyl dehydrogenase of the bacterial
  branched-chain 2-oxoacid dehydrogenase complex. It reoxidizes the reduced
  lipoyl arm of BkdB with NAD+, producing NADH and permitting continued
  oxidative decarboxylation of leucine-, isoleucine-, and valine-derived
  2-oxo acids. In Pseudomonas putida, LpdV is biochemically specialized for
  BCKDH rather than the 2-oxoglutarate dehydrogenase complex.
existing_annotations:
- term:
    id: GO:0004148
    label: dihydrolipoyl dehydrogenase (NADH) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: LpdV catalyzes the E3 dihydrolipoyl dehydrogenase reaction in the BCKDH complex.
    action: ACCEPT
    reason: >-
      The exact record supplies EC 1.8.1.4/RHEA:15045, and biochemical
      reconstitution summarized by OpenScientist found that BCKDH specifically
      requires LPD-val rather than the housekeeping LPD-glc paralog.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        A purified preparation of branched-chain keto acid dehydrogenase, which
        was deficient in lipoamide dehydrogenase, was stimulated 10-fold by
        LPD-val but not by LPD-glu, which suggested that the branched-chain keto
        acid dehydrogenase of P. putida has a specific requirement for LPD-val.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is compatible with a soluble bacterial BCKDH complex.
    action: KEEP_AS_NON_CORE
    reason: >-
      The UniProt subcellular-location mapping supports this broad bacterial
      location, but localization does not define the enzyme's core catalytic
      or pathway role.
- term:
    id: GO:0006103
    label: 2-oxoglutarate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The 2-oxoglutarate-pathway assignment conflicts with LpdV's experimentally established BCKDH specificity.
    action: REMOVE
    reason: >-
      This TreeGrafter transfer appears to conflate specialized LPD-val with a
      housekeeping E3 paralog. Purified BCKDH was activated by LPD-val, whereas
      2-oxoglutarate dehydrogenase was activated by LPD-glc and not LPD-val.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        This demonstrates that the *P. putida* BCKAD complex has a **specific
        requirement for LPD-val**, and that LPD-val is not interchangeable with
        the housekeeping E3.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: oxidoreductase activity is a broad parent or generic domain-derived term that adds little beyond the specific catalytic annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The annotation is not necessarily false, but it is less informative than the specific molecular function already present.
- term:
    id: GO:0016668
    label: oxidoreductase activity, acting on a sulfur group of donors, NAD(P) as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This parent oxidoreductase term is correct but less informative than GO:0004148.
    action: KEEP_AS_NON_CORE
    reason: Retain as a supporting/non-core annotation rather than using it as the main functional summary.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: FAD binding is valid cofactor information for the LpdV flavoprotein.
    action: KEEP_AS_NON_CORE
    reason: Retain as a supporting/non-core annotation rather than using it as the main functional summary.
- term:
    id: GO:0009083
    label: branched-chain amino acid catabolic process
  evidence_type: ISS
  original_reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
  qualifier: involved_in
  review:
    summary: LpdV is the dedicated E3 of the P. putida BCKDH complex.
    action: NEW
    reason: >-
      Operon structure and biochemical reconstitution establish the pathway
      role more specifically than the erroneous 2-oxoglutarate process transfer.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        This demonstrates that the *P. putida* BCKAD complex has a **specific
        requirement for LPD-val**, and that LPD-val is not interchangeable with
        the housekeeping E3.
- term:
    id: GO:0160157
    label: branched-chain alpha-ketoacid dehydrogenase complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
  qualifier: part_of
  review:
    summary: LpdV is the E3 component of the BCKDH complex.
    action: NEW
    reason: The bkdAA-bkdAB-bkdB-lpdV operon and complex-specific reconstitution establish membership.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
