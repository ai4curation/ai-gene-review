  label: Pseudomonas putida KT2440
description: pykA (PP_1362) encodes one of the two pyruvate kinase isozymes of Pseudomonas putida KT2440,
  the other being pyk (PP_4301). Pyruvate kinase transfers the phosphoryl group of phosphoenolpyruvate
  to ADP, forming pyruvate and ATP in the final, essentially irreversible step of lower glycolysis. In
  KT2440, which catabolises glucose almost exclusively through the Entner-Doudoroff route, this reaction
  sits at the PEP-pyruvate branch point that partitions carbon between pyruvate oxidation and PEP-consuming
  anaplerotic and biosynthetic reactions.
