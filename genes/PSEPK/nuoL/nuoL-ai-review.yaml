    label: electron transport coupled proton transport
  - id: GO:0042773
    label: ATP synthesis coupled electron transport
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:PSEPK/nuoL/nuoL-uniprot.txt
    supporting_text: 'NCBIfam; TIGR01974; NDH_I_L; 1.'
  - reference_id: PMID:36104567
    supporting_text: This mechanism explains why protons exit exclusively from the NuoL
      subunit and is supported by our mutagenesis data.
  - reference_id: PMID:36920092
    supporting_text: ALS share a cation/proton antiporter MRP fold [34] of two inverted
      symmetric five TM repeats forming one half of the putative proton translocating
      channel each
suggested_questions:
- question: Has the contribution of P. putida KT2440 nuoL to complex I assembly, activity,
    or proton-coupling efficiency been tested directly?
suggested_experiments:
- description: Construct a clean nuoL deletion and measure membrane NADH:quinone
    oxidoreductase activity, H+/e- stoichiometry in inverted vesicles, respiratory growth,
    and proton-motive-force generation.
