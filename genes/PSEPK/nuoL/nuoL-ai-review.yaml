core_functions:
- description: >-
    Distal antiporter-like proton-pumping subunit of the NDH-1 membrane arm. By orthology
    to E. coli NuoL it supplies the proton half-channels and the periplasmic proton exit,
    contributing the proton-translocation part of the proton-pumping NADH:ubiquinone
    oxidoreductase activity of the assembled complex in aerobic respiration.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
