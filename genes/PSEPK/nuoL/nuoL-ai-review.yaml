- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO mapping from the chain 5 (NuoL/ND5) signatures to NADH
      dehydrogenase (ubiquinone) activity.
    action: ACCEPT
    reason: >-
      Correct term for the complex activity to which NuoL contributes. The term's
      definition includes proton translocation (5 H+ in, 4 H+ out), and in the E. coli
      orthologue NuoL carries part of that pumping: its deletion halves the
      stoichiometry (PMID:21417432). The activity belongs to the assembled complex, so
      the subunit's role is contributes_to. This is recorded here rather than as a
      MODIFY because the term id itself is correct. Core function.
    supported_by:
    - reference_id: file:PSEPK/nuoL/nuoL-uniprot.txt
      supporting_text: 'NCBIfam; TIGR01974; NDH_I_L; 1.'
    - reference_id: PMID:21417432
      supporting_text: Our data suggest that the H+/2e- stoichiometry of the ΔNuoL variant
        is 2
    - reference_id: PMID:23864658
      supporting_text: It seems likely that NuoL, NuoM, and NuoN pump protons by a similar
        mechanism.
