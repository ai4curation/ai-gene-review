- term:
    id: GO:0045271
    label: respiratory chain complex I
  evidence_type: ISS
  original_reference_id: file:PSEPK/nuoL/nuoL-uniprot.txt
  qualifier: part_of
  review:
    summary: >-
      Proposed complex membership. PP_4129 is the NDH-1 subunit L (NCBIfam TIGR01974) in
      the complete PP_4119-PP_4131 nuo operon, and its E. coli orthologue is an
      experimentally established subunit of respiratory complex I.
    action: NEW
    reason: >-
      No complex-membership term is present in GOA for this protein, although the sibling
      PSEPK Nuo subunits and E. coli NuoL (IDA, PMID:17722886; IBA PTN000511881) carry
      GO:0045271. NuoL is a structural subunit of the complex, not a substrate or
      regulator, so the assertion is a genuine part_of relationship.
    supported_by:
    - reference_id: file:PSEPK/nuoL/nuoL-uniprot.txt
      supporting_text: 'NCBIfam; TIGR01974; NDH_I_L; 1.'
    - reference_id: PMID:17722886
      supporting_text: The preparation is pure and monodisperse and comprises all known
        subunits and cofactors.
