taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoL (PP_4129, 617 residues, 16 predicted transmembrane helices) is the ND5-type
  antiporter-like subunit of the proton-pumping NADH:quinone oxidoreductase (NDH-1,
  respiratory complex I) in the cytoplasmic membrane. It is encoded in the PP_4119-PP_4131
  nuo operon. It carries the Mrp-type cation/proton antiporter fold shared with NuoM and
  NuoN: two inverted five-helix repeats forming proton half-channels linked by conserved
  charged residues. By orthology to the well-characterised Escherichia coli NuoL, it is the
  most distal subunit of the membrane arm, and pumped protons exit to the periplasm
  through it; its C-terminal amphipathic helix runs along the membrane arm and is needed
  for full coupling. NuoL has no redox cofactor; it contributes the proton-translocation
  part of the proton-pumping NADH:ubiquinone oxidoreductase activity of the assembled
  complex, which conserves respiratory redox energy as proton-motive force.
