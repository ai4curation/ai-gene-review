description: NuoL is one of three homologous antiporter-like subunits in the distal membrane arm of respiratory complex I. It contributes directly to the conformationally coupled proton-translocation machinery.
existing_annotations:
  - term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: 'NADH dehydrogenase activity is the generic ancestor of the complex-level NADH:ubiquinone oxidoreductase activity; retain as contributes_to GO:0008137 rather than reject.'
      action: MODIFY
      reason: >-
        GO:0003954 (NADH + H+ + acceptor = NAD+ + reduced acceptor) is an is_a ancestor of GO:0008137 NADH dehydrogenase (ubiquinone) activity, the reaction catalysed by the assembled 13-subunit NDH-1 complex of which NuoL is an obligate component. NuoL is a 16-TM antiporter-like subunit of the membrane sector (UniProt: 'Subunits NuoA, H, J, K, L, M, N constitute the membrane sector') with no redox cofactor; NADH oxidation occurs at the FMN of NuoF in the peripheral arm, so the subunit does not enable the generic reaction on its own. The TreeGrafter inference (PANTHER node from the GOA WITH/FROM column) is therefore not wrong but too coarse and mis-qualified: the same review already handles the UniProt-sourced GO:0008137 row as MODIFY with a contributes_to qualifier, and the ancestor term should be treated identically. Replace with GO:0008137 (contributes_to); this term is the more specific, complex-level activity and is consistent with the core_functions entry. Re-reviewed 2026-09-24 (projects/TREEGRAFTER/rereview-2026-09-24/batch-06a.yaml).
      supported_by:
        - reference_id: file:PSEPK/nuoL/nuoL-goa.tsv
          supporting_text: GO:0003954
        - reference_id: file:PSEPK/nuoL/nuoL-uniprot.txt
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
      proposed_replacement_terms:
        - id: GO:0008137
          label: NADH dehydrogenase (ubiquinone) activity
