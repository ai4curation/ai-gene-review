id: Q88MG8
gene_symbol: lpxA
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LpxA is the cytoplasmic UDP-N-acetylglucosamine acyltransferase that
  catalyzes the first step of lipid A biosynthesis, transferring a 3-hydroxyacyl
  group from acyl carrier protein to UDP-N-acetylglucosamine.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: LpxA is a soluble enzyme and UniProt/HAMAP places it in the cytoplasm.
    action: ACCEPT
    reason: Cytoplasmic localization is consistent with the soluble early steps of lipid A biosynthesis and the LpxA family model.
- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: LpxA catalyzes an acyl-transfer step in lipid biosynthesis.
    action: ACCEPT
    reason: This broad process annotation is correct, although lipid A biosynthetic process is more informative.
- term:
    id: GO:0008780
    label: acyl-[acyl-carrier-protein]-UDP-N-acetylglucosamine O-acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the defining LpxA activity and precisely describes transfer of a 3-hydroxyacyl group from acyl-ACP to UDP-N-acetylglucosamine.
    action: ACCEPT
    reason: The assignment is supported by the LpxA-specific HAMAP, InterPro, NCBIfam, and PANTHER signatures and the matching UniProt catalytic reaction.
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: LpxA catalyzes the first committed assembly reaction in the lipid A pathway.
    action: ACCEPT
    reason: Lipid A biosynthesis is the canonical pathway role of LpxA.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Transferase activity is true but substantially less informative than the existing LpxA-specific acyltransferase term.
    action: MARK_AS_OVER_ANNOTATED
    reason: The generic parent term adds no useful functional specificity when GO:0008780 is assigned.
core_functions:
- description: Catalyzes the first step of lipid A biosynthesis by acylating UDP-N-acetylglucosamine with a 3-hydroxyacyl group from acyl-ACP.
  molecular_function:
    id: GO:0008780
    label: acyl-[acyl-carrier-protein]-UDP-N-acetylglucosamine O-acyltransferase activity
  directly_involved_in:
  - id: GO:0009245
    label: lipid A biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:PSEPK/lpxA/lpxA-uniprot.txt
    supporting_text: Involved in the biosynthesis of lipid A
references:
