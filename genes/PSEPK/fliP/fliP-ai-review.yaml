core_functions:
- description: FliP supplies the major repeated subunit of the FliPQR polypeptide channel
    and its gate, enabling axial subunits to cross the cytoplasmic membrane during flagellar
    construction. Mechanistic transfer to KT2440 is supported by its dedicated export-family
    signatures; precise stoichiometry and ATP/ion coupling remain unmeasured in this strain.
    The FliP/FliR tip also templates initial rod assembly in Salmonella structures; this scaffold
    role is transferred by family inference, not directly measured in KT2440.
