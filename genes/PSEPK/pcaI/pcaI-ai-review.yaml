- id: PMID:1624453
  title: Characterization of the genes encoding beta-ketoadipate 
    succinyl-coenzyme A transferase in Pseudomonas putida
  findings:
  - statement: >-
      The pcaI/pcaJ locus encodes the beta-ketoadipate:succinyl-CoA
      transferase required for aromatic-compound catabolism through the
      beta-ketoadipate route.
    supporting_text: >-
      beta-Ketoadipate:succinyl-coenzyme A transferase
      (beta-ketoadipate:succinyl-CoA transferase) (EC 2.8.3.6) carries out the
      penultimate step in the conversion of benzoate and 4-hydroxybenzoate to
      tricarboxylic acid cycle intermediates in bacteria utilizing the
      beta-ketoadipate pathway.
  - statement: >-
      The study showed that the enzyme is composed of two nonidentical
      subunits, establishing that pcaI functions in a heteromeric transferase.
    supporting_text: >-
      two proteins of sizes appropriate to encode the two nonidentical subunits
      of the enzyme were produced in Escherichia coli
