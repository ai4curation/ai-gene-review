- term:
    id: GO:0008854
    label: exodeoxyribonuclease V activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: RecC contributes to Exonuclease V holoenzyme activity but does not independently catalyze DNA cleavage.
    action: MARK_AS_OVER_ANNOTATED
    reason: The `enables` qualifier incorrectly treats a complex-level activity as an intrinsic RecC molecular function. RecC is the DNA-recognition and processivity subunit; the nuclease active site resides in RecB.
    supported_by:
    - reference_id: file:PSEPK/recC/recC-uniprot.txt
