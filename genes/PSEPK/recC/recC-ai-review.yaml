  - statement: The report resolves the complete recD-recB-recC operon and the Pseudomonas Chi-recognition caveat.
- id: PMID:20195537
  title: All three subunits of RecBCD enzyme are essential for DNA repair and low-temperature growth in the Antarctic Pseudomonas syringae Lz4W.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct pseudomonad deletion, complementation, and RecBCD-complex evidence; used comparatively rather than as a KT2440 experiment.
  findings:
  - statement: P. syringae recC deletion disables DNA repair, and all three cognate subunits are required for the functional pseudomonad complex.
    supporting_text: essential for DNA repair and growth of P. syringae at low temperatures
- id: PMID:2559208
  title: Activation of Chi recombinational hotspots by RecBCD-like enzymes from enteric bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary P. aeruginosa and P. putida clone experiments establish recombination competence without E. coli Chi activation.
  findings:
  - statement: Pseudomonas recBCD-like genes restore recombination but do not activate the E. coli Chi sequence.
    supporting_text: Three clones from Pseudomonas aeruginosa and Ps. putida conferred recombination proficiency and ATP-dependent nuclease activity, but neither Chi hotspot activity nor Chi-dependent DNA cleavage.
