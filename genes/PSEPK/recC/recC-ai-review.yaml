    - reference_id: PMID:16126227
      supporting_text: These data suggest that both RecBC and RecBCD helicases can destabilize or "melt
        out" six base-pairs upon binding to a blunt DNA duplex end in the absence of ATP
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: UniRule transfers DNA helicase activity to RecC, but the helicase motors of RecBCD are RecB
      and RecD.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'RecC contributes to holoenzyme unwinding by stimulating RecB processivity and splitting the
      duplex, but it is not itself a helicase: it lacks the Walker A motif present in KT2440 RecB and
      RecD, and in the E. coli enzyme isolated RecC has no holoenzyme activity. The enables qualifier
      attributes a motor activity to the non-motor subunit; at most contributes_to would be correct. Previously
      REMOVE in the draft; changed because the holoenzyme helicase claim is real and RecC participates
      in it, so the problem is overstatement, not falsity.'
    supported_by:
    - &id002
      reference_id: file:PSEPK/recC/recC-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: while RecC stimulates the ATPase and processivity of the RecB helicase and contributes
        to recognition of the Chi site
    - &id001
      reference_id: file:analysis/module_audits/bacterial_recbcd_end_resection/WALKER_A_RESULTS.md
      supporting_text: Neither RecC sequence contains a Walker A motif, under the strict or the relaxed
        pattern, whereas every RecB and RecD control has one near its N-terminal motor domain
    - &id003
      reference_id: PMID:1618858
      supporting_text: none of the individual RecB, RecC, or RecD subunits have readily detectable activities
        of the holoenzyme, except RecB protein which had previously been shown to exhibit DNA-dependent
        ATPase activity
    source_defects:
