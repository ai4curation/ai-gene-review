        helicase processivity; the GO line should be contributes_to or be dropped from the RecC rule.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: UniRule transfers ATP binding to RecC; RecC has no ATP-binding site.
    action: REMOVE
    reason: KT2440 RecC has no Walker A motif (strict or relaxed), whereas KT2440 RecB and RecD each have
      one, and the record annotates no nucleotide-binding site. RecC stimulates the ATPase of RecB rather
