id: Q88DZ4
gene_symbol: recC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RecC is the largest, non-motor subunit of the RecBCD helicase-nuclease that processes double-strand
  DNA ends in Pseudomonas putida. It has helicase-like folds but no ATPase motor or nuclease active site;
  within the holoenzyme it binds the DNA end, splits the duplex, channels the 3' strand towards RecB and
  stimulates RecB helicase processivity, contributing to end resection and RecA loading for double-strand
  break repair by homologous recombination. Pseudomonas RecBCD enzymes do not respond to the Escherichia
  coli Chi octamer, and the sequence that regulates the KT2440 enzyme is unknown.
existing_annotations:
- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: RecC is an obligate subunit of RecBCD, which initiates repair of double-strand breaks by
      homologous recombination.
    action: ACCEPT
    reason: KT2440 RecC is the RecC subunit of the recD-recB-recC operon. Pseudomonad recBCD genes restore
      recombination and ATP-dependent nuclease activity to an E. coli recBCD deletion, and deletion of
      recC in P. syringae causes severe repair defects (UV and mitomycin C sensitivity). RecC does part
      of the end-processing work (duplex splitting, channelling of the 3' strand) rather than merely being
      required.
    supported_by:
    - &id009
      reference_id: PMID:20195537
      supporting_text: essential for DNA repair and growth of P. syringae at low temperatures
    - &id004
      reference_id: PMID:2559208
      supporting_text: Three clones from Pseudomonas aeruginosa and Ps. putida conferred recombination
        proficiency and ATP-dependent nuclease activity, but neither Chi hotspot activity nor Chi-dependent
        DNA cleavage
    - &id005
      reference_id: file:PSEPK/recC/recC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The Chi-altered holoenzyme produces a long 3'-ssDNA overhang and facilitates RecA-binding
        to the ssDNA for homologous DNA recombination and repair
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: RecC binds DNA within RecBCD, specifically engaging the double-strand DNA end.
    action: MODIFY
    reason: DNA binding is correct but general. RecBCD binds DSB ends; in the E. coli enzyme RecBC binds
      blunt duplex ends and melts out six base pairs without ATP, and the duplex is split across RecC
      itself. KT2440 RecC is the orthologous subunit (same family, HAMAP MF_01486), so the informative
      term is DNA end binding (GO:0045027, is_a DNA binding), as in the E. coli RecC review.
    proposed_replacement_terms:
