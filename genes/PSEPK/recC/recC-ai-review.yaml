    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The imported ATP-binding term is not supported for the non-motor RecC subunit.
    action: REMOVE
    reason: >-
      This overrides the transferred UniProt ATP-binding keyword: the target
      record provides no nucleotide-binding site or RecC ATPase reaction and
      instead says that RecC stimulates the ATPase of RecB. Lack of ATPase
      catalysis alone would not disprove binding, but the available record
      supplies no independent positive evidence for ATP binding by RecC.
    supported_by:
    - reference_id: file:PSEPK/recC/recC-uniprot.txt
      supporting_text: RecC stimulates the ATPase and processivity
