taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: RecC is the non-motor recognition and scaffold subunit of the bacterial RecBCD helicase-nuclease complex. It binds DNA within the holoenzyme, stimulates RecB processivity, and helps convert DNA-end unwinding into regulated resection and RecA loading. Pseudomonas RecBCD enzymes do not respond to the Escherichia coli Chi octamer, and the corresponding KT2440 regulatory signal remains unknown.
