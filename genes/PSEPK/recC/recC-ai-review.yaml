    - &id008
      reference_id: file:PSEPK/recC/recC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Binds to DSBs and unwinds DNA via a highly rapid and processive ATP-dependent bidirectional
        helicase activity
    - reference_id: PMID:15538360
      supporting_text: In this initiation complex, the DNA duplex has been split across the RecC subunit
