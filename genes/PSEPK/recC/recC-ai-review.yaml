  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: RecC is a structural and functional subunit of the Exonuclease V complex.
    action: ACCEPT
    reason: The target record explicitly identifies the RecB-RecC-RecD heterotrimer, and pseudomonad deletion/complementation experiments require cognate subunits for a functional complex.
    supported_by:
    - reference_id: file:PSEPK/recC/recC-uniprot.txt
      supporting_text: Heterotrimer of RecB, RecC and RecD.
    - reference_id: PMID:20195537
