- term:
    id: GO:0140097
    label: catalytic activity, acting on DNA
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: No independent DNA-catalytic activity is established for RecC.
    action: REMOVE
    reason: RecC recognizes DNA and stimulates RecB helicase processivity, whereas RecB and RecD supply motor activity and RecB supplies nuclease catalysis. A generic catalytic-DNA term therefore misrepresents RecC's direct role.
    supported_by:
    - reference_id: file:PSEPK/recC/recC-uniprot.txt
      supporting_text: RecC stimulates the ATPase and processivity
