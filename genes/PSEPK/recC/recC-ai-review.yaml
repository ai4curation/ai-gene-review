    summary: RecC participates in RecBCD-dependent homologous DNA recombination.
    action: ACCEPT
    reason: P. aeruginosa and P. putida recBCD-like clones restore recombination proficiency, while the target record places RecC in the holoenzyme that prepares and loads recombinogenic DNA ends.
