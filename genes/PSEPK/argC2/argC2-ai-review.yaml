description: ArgC2 (PP_3633) is a type 2 N-acetyl-gamma-glutamyl-phosphate reductase (EC 1.2.1.38). It
  uses NADPH to reduce N-acetyl-L-glutamyl 5-phosphate to N-acetyl-L-glutamate 5-semialdehyde in the acetylated-ornithine
  route to L-arginine. KT2440 also encodes the structurally distinct type 1 isoenzyme ArgC1.
