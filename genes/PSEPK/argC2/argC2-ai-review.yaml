- id: file:PSEPK/argC2/argC2-deep-research-openscientist.md
  title: OpenScientist functional synthesis for PSEPK ArgC2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing provider report reused for discovery; primary sources and native locus assignments
      were independently checked. Type2 reductase membership and NADPH chemistry are supported by HAMAP.
      Comparative PMID17316682 establishes the enzyme-class NADP interaction, not a direct structure or
      kinetic assay of P59308. No direct measurement assigning relative ArgC1/ArgC2 flux was found. NAD
      binding is refined without declaring absent NAD affinity.
  findings:
  - statement: The report identifies the exact accession as a type 2 ArgC protein and retrieves the NADPH-dependent
      AGPR reaction. Its accessory-isoenzyme and expression hypotheses are not used here.
    supporting_text: N-acetyl-L-glutamyl-5-phosphate + NADPH + H⁺ → N-acetyl-L-glutamate-5-semialdehyde
      + phosphate + NADP⁺
