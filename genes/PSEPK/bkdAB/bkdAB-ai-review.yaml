id: Q88EQ1
gene_symbol: bkdAB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BkdAB is the E1 beta subunit of the bacterial branched-chain 2-oxoacid
  dehydrogenase complex. It forms an alpha2-beta2 E1 heterotetramer with BkdAA
  that decarboxylates branched-chain 2-oxo acids and reductively acylates the
  lipoyl arm of BkdB during leucine, isoleucine, and valine catabolism.
existing_annotations:
- term:
    id: GO:0003863
    label: branched-chain 2-oxo acid dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The function is correct for assembled E1, but BkdAB is its beta subunit
      and does not independently enable the heterotetrameric activity.
    action: ACCEPT
    reason: >-
      Retain GO:0003863 for the E1 beta subunit; collective contribution
      semantics are represented in core_functions. The exact
      record assigns EC 1.2.4.4/RHEA:13457 and specifies an alpha2-beta2 E1
      assembly.
    supported_by:
    - reference_id: file:PSEPK/bkdAB/bkdAB-uniprot.txt
      supporting_text: Full=2-oxoisovalerate dehydrogenase subunit beta
- term:
    id: GO:0007584
    label: response to nutrient
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: This broad TreeGrafter process is not an informative annotation of BkdAB function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      BCKDH expression responds to BCAA availability, but BkdAB is a catalytic
      complex subunit rather than a nutrient-response effector. GO:0009083
      captures the direct biological role.
- term:
    id: GO:0009083
    label: branched-chain amino acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The Bkd E1 beta subunit acts in BCAA catabolism.
    action: ACCEPT
    reason: >-
      The four-gene bkd operon encodes the BCKDH complex that consumes
      leucine-, isoleucine-, and valine-derived 2-oxo acids.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
- term:
    id: GO:0160157
    label: branched-chain alpha-ketoacid dehydrogenase complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
  qualifier: part_of
  review:
    summary: BkdAB is the E1 beta subunit of the BCKDH complex.
    action: NEW
    reason: The four-gene bkd operon and alpha2-beta2 E1 record establish complex membership.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
