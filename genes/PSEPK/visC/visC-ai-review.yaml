- term:
    id: GO:0110142
    label: ubiquinone biosynthesis complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00089351
  review:
    summary: >-
      ARBA complex membership. Holds for E. coli UbiI, which belongs to the seven-protein Ubi
      complex; KT2440 has the UbiJ and UbiK accessory factors, but no complex has been
      purified from P. putida.
    action: KEEP_AS_NON_CORE
    reason: >-
      The GO term is defined from the E. coli complex (UbiE, F, G, H, I, J, K). KT2440 encodes
      UbiI, UbiH, UbiG, UbiE, UbiJ and UbiK but uses Coq7 instead of UbiF, so the composition of
      any P. putida complex is not known. The association is a reasonable orthology inference
      for the UbiI protein and is retained, but as non-core context rather than a core
      location.
    supported_by:
    - reference_id: PMID:30686758
      supporting_text: Here, we demonstrate that seven Ubi proteins form the Ubi complex, a
        stable metabolon that catalyzes the last six reactions of the UQ biosynthetic pathway
        in Escherichia coli.
