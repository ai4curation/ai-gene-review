- id: PMID:23709220
  title: ubiI, a new gene in Escherichia coli coenzyme Q biosynthesis, is involved in aerobic
    C5-hydroxylation.
  findings:
  - statement: E. coli visC is ubiI, the FAD-dependent aerobic C5 hydroxylase; an unrelated
      enzyme does this step anaerobically.
    supporting_text: We also demonstrate that UbiI is only implicated in aerobic Q biosynthesis
      and that an alternative enzyme catalyzes the C5-hydroxylation reaction in the absence of
      oxygen.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; experimental exemplar for PP_5197 (E. coli P25535).
- id: PMID:27822549
  title: 'Evolution of Ubiquinone Biosynthesis: Multiple Proteobacterial Enzymes with Various
    Regioselectivities To Catalyze Three Contiguous Aromatic Hydroxylation Reactions.'
  findings:
  - statement: P. aeruginosa uses UbiH, UbiI and Coq7; UbiI regioselectivity (C-5) is expected
      to be conserved in beta- and gammaproteobacteria.
    supporting_text: Prior to our study, four UQ hydroxylases (the di-iron monooxygenase Coq7
      and the three FMOs UbiF, UbiH, and UbiI) had been characterized, constituting two different
      protein sets in E. coli (UbiF, UbiH, and UbiI) (11) and in P. aeruginosa and A. ferrooxidans
      (UbiH, UbiI, and Coq7) (16).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC). Phylogenomics plus complementation.
- id: PMID:30686758
  title: A Soluble Metabolon Synthesizes the Isoprenoid Lipid Ubiquinone.
  findings:
  - statement: E. coli UbiI is one of seven proteins of a soluble 1-MDa Ubi complex.
    supporting_text: We purify the Ubi complex from cytoplasmic extracts and demonstrate that
      UQ biosynthesis occurs in this fraction, challenging the current thinking of a membrane-associated
      biosynthetic process.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; E. coli complex context, not a P. putida result.
- id: file:PSEPK/visC/visC-uniprot.txt
  title: UniProt entry Q88CI4 for visC
  findings:
  - statement: Unreviewed entry; FAD cofactor, pathway, subunit and family comments are
      ARBA-only and not used as support. Family signatures (TIGR01988, IPR010971, IPR018168,
      PF01494, PTHR43876:SF7) are used.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The submitter-imported protein name is misleading; see source_defects.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q88CI4
      slot: DE
      requested_change: CHECK
      asserted_value: Oxidoreductase involved in anerobic synthesis of ubiquinone, FAD/NAD(P)-binding
        domain
      cause: LEGACY_ALIAS
      confidence: PROBABLE
      explanation: >-
        The SubName (imported from EMBL AAN70762.1) describes PP_5197 as involved in anaerobic
        ubiquinone synthesis. PP_5197 is the UbiI/VisC ortholog, and E. coli UbiI acts only in
        aerobic, O2-dependent ubiquinone biosynthesis; the anaerobic C5 hydroxylation uses a
        different system (UbiU/UbiV/UbiT), which KT2440 lacks. A name such as
        "2-polyprenylphenol 6-hydroxylase UbiI" (EC 1.14.13.240) would be appropriate.
      supported_by:
      - reference_id: PMID:23709220
        supporting_text: We also demonstrate that UbiI is only implicated in aerobic Q biosynthesis
          and that an alternative enzyme catalyzes the C5-hydroxylation reaction in the absence
          of oxygen.
- id: file:PSEPK/visC/visC-bioinformatics/RESULTS.md
  title: Pairwise identity of P. putida KT2440 ring hydroxylases to E. coli UbiI, UbiH and UbiF
  findings:
  - statement: Global alignment places Q88CI4 closest to E. coli UbiI (46.7%; UbiF 42.1%, UbiH
      35.3%) and Q88CI2 closest to E. coli UbiH.
- id: file:projects/P_PUTIDA/deep-research/PSEPK__ubiquinone_biosynthesis__ppu00130-deep-research-openscientist.md
  title: OpenScientist PSEPK ubiquinone pathway assessment
  findings:
  - statement: >-
      The species-level reconstruction identifies PP_5197 as the UbiI/VisC aerobic hydroxylase
      and reports that KT2440 lacks UbiF and the UbiT/UbiU/UbiV anaerobic system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Pathway-level synthesis, consistent with family evidence. One sentence calls VisC the
      "C5 (2-methoxy-6-polyprenylphenol) hydroxylase", which names the UbiH substrate; the
      UbiI substrate is 2-polyprenylphenol.
- id: file:PSEPK/visC/visC-deep-research-openscientist.md
  title: OpenScientist functional review of PSEPK visC
  findings:
  - statement: >-
      Orthology, KEGG K18800, legacy symbol and gene neighbourhood support a UbiI-type aerobic
      hydroxylase assignment; exact regioselectivity and complex membership are untested for
      PP_5197.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Consistent with PANTHER placement and the review's own identity analysis (which gives
      46.7% to UbiI rather than the report's 48%, from a different denominator).
