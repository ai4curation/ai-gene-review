suggested_questions:
- question: >-
    Does PP_5197 hydroxylate only C-5, or does it also act at C-6 as a backup for Coq7, given
    that UbiI and UbiF are sister clades?
- question: >-
    Do KT2440 UbiI, UbiH, UbiG, UbiE, Coq7, UbiJ and UbiK assemble into a soluble Ubi complex
    like the E. coli metabolon, and does Coq7 take the place of UbiF in it?
suggested_experiments:
- description: >-
    Express PP_5197 in E. coli ubiI and ubiF deletion strains and score UQ-8 restoration; delete
    PP_5197 in KT2440 and profile accumulated 2-nonaprenylphenol; pull down tagged PP_5197
    from KT2440 cytoplasmic extracts to test Ubi-complex membership.
