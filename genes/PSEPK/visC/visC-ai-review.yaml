    summary: >-
      TreeGrafter transfer; the term descends from the gammaproteobacterial UbiI node
      PTN000350245 (PAINT IBD seeded by E. coli UbiI, P25535), the only PTHR43876 node carrying
      GO:0019168. Core molecular function.
    action: ACCEPT
    reason: >-
      GO:0019168 is the UbiI reaction (2-polyprenylphenol to 3-polyprenylbenzene-1,2-diol,
