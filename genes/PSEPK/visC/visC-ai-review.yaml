id: Q88CI4
gene_symbol: visC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  visC (PP_5197) encodes the Pseudomonas putida ortholog of Escherichia coli UbiI (formerly
  VisC), a class A flavoprotein monooxygenase of the UbiH/COQ6 family. Using FAD, NAD(P)H and
  O2, it hydroxylates 2-polyprenylphenol at C-5 of the ring (the "6-hydroxylase" of the
  phenol nomenclature), the first of three ring hydroxylations of aerobic ubiquinone
  biosynthesis; the product is then O-methylated by UbiG. Its partners in KT2440 are the UbiH
  hydroxylase (PP_5199, two genes away) and the di-iron Coq7 (PP_0427), which replaces E. coli
  UbiF. In E. coli UbiI is a member of the soluble cytoplasmic Ubi complex; whether the KT2440
  protein forms an equivalent complex is untested. Despite its submitted product name, the
  enzyme is part of the oxygen-dependent route: KT2440 has no UbiT/UbiU/UbiV anaerobic
  hydroxylation system. The assignment rests on family placement and similarity; the
  KT2440 protein has not been assayed.
