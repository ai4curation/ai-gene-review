core_functions:
- description: ATP-dependent glutamine synthesis from ammonium and L-glutamate, the entry reaction of
    the GS–GOGAT cycle. Catalytic specificity, magnesium binding and oligomeric architecture are conserved
    RuleBase/PIRSR inferences for Q88CY3, corroborated by native nitrogen-responsive expression and metabolic
    context.
