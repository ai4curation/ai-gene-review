taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GlnA (PP_5046) is the type I glutamine synthetase of Pseudomonas putida KT2440. It uses ATP
  to ligate ammonium to L-glutamate, producing L-glutamine for nitrogen assimilation and biosynthesis.
  Its conserved architecture predicts a magnesium-dependent dodecamer of two hexameric rings and a cytoplasmic
  enzyme pool. Together with the GltB/GltD glutamate-synthase complex, GlnA supports the GS–GOGAT cycle;
  nitrogen-dependent expression is documented in the KT2440/KT2442 lineage.
