  qualifier: enables
  review:
    summary: Nth binds damaged DNA as a substrate, but unqualified DNA binding does not identify its lesion specificity.
    action: KEEP_AS_NON_CORE
    reason: Keep substrate binding outside the core, which records oxidized-pyrimidine excision and AP-lyase cleavage.
- term:
