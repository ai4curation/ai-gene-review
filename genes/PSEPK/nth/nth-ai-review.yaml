  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: Nth is a predicted endonuclease III-family bifunctional DNA glycosylase/AP lyase. It removes oxidized pyrimidines and cleaves the DNA backbone 3-prime to the resulting abasic site during base-excision repair.
