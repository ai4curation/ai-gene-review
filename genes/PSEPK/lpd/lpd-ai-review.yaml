  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Lpd (PP_5366) is a dihydrolipoyl dehydrogenase E3 enzyme. It uses FAD and
  NAD+ to reoxidize protein-bound dihydrolipoyllysine to lipoyllysine, producing
  NADH for reuse of the lipoyl carrier in multienzyme systems.
