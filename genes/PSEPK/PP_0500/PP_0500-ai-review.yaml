    label: O antigen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      The reductase-family assignment does not establish a direct role in
      O-antigen biosynthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PP_0500 is outside the complete rfb cluster and its physiological
      substrate is unresolved. Propagating a downstream O-antigen process to
      this orphan paralog is more specific than the available evidence.
- term:
    id: GO:0019305
    label: dTDP-rhamnose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      The automated pathway assignment is plausible, but the physiological
      role of this isolated reductase paralog is unresolved.
    action: UNDECIDED
    reason: >-
      UniProt places Q88QJ2 in dTDP-L-rhamnose biosynthesis, but module-level
      OpenScientist research found that PP_0500 is divergent from and outside
      the complete PP_1782-PP_1785 cluster. Direct substrate or genetic evidence
      is unavailable, so the pathway annotation cannot yet be confirmed.
    supported_by:
