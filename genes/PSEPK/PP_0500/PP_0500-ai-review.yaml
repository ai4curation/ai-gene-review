id: Q88QJ2
gene_symbol: PP_0500
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_0500 encodes a cytosolic RmlD-family NADP-dependent reductase in
  Pseudomonas putida KT2440. Sequence-family and automated database evidence
  support dTDP-4-dehydrorhamnose reductase activity (EC 1.1.1.133), but this
  protein is an isolated paralog of the cluster-encoded RfbD and its
  physiological substrate and pathway contribution have not been established.
