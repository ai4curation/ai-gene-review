id: Q88IU4
gene_symbol: cysS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: CysS is a class I cysteinyl-tRNA synthetase with a conserved zinc-binding site and ATP-dependent
  cysteine activation. It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA
  substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate cysteine by cysS.
    action: MODIFY
    reason: The MF_00041 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/cysS/cysS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Cys) + L-cysteine + ATP = L-cysteinyl-tRNA(Cys) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify cysteine and tRNA(Cys).
    action: MODIFY
    reason: HAMAP MF_00041 assigns cysteinyl-tRNA formation and one zinc ion per subunit; the mapped zinc
      ligands are residues 28, 209, 234 and 238. GO:0004817 is the supported amino-acid-specific descendant
      of GO:0004812; the parent is biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0004817
      label: cysteine-tRNA ligase activity
- term:
    id: GO:0004817
    label: cysteine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: cysS supplies cysteine-charged tRNA(Cys) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_00041 assigns cysteinyl-tRNA formation and one zinc ion per subunit; the mapped zinc
      ligands are residues 28, 209, 234 and 238. The independently curated MF_00041 reaction supports
      this specific MF; electronic provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to cysS-catalysed cysteine activation.
    action: ACCEPT
    reason: The curated MF_00041 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: cysS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_00041 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/cysS/cysS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
    - &id005
      id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for cysS.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_00041 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: cysS catalyses the charging step that supplies cysteine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00041 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006423
    label: cysteinyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The cysteine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006423 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain cysteine specificity
      in GO:0004817. This is ontology maintenance, not a rejection of the MF_00041 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id004
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: A conserved zinc-binding site is assigned to cysS.
    action: ACCEPT
    reason: HAMAP MF_00041 assigns cysteinyl-tRNA formation and one zinc ion per subunit; the mapped zinc
      ligands are residues 28, 209, 234 and 238. Zinc binding is an integral property of this enzyme architecture,
      not a peripheral physiological response. The one-ion assignment is explicitly a HAMAP inference,
      not a measured KT2440 occupancy or a claim that zinc is consumed by aminoacylation.
    supported_by:
    - reference_id: file:PSEPK/cysS/cysS-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 zinc ion per subunit.
