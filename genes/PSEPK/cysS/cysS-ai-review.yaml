  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleotide binding is compatible with ATP-dependent CysRS catalysis but is not substrate-specific.
    action: KEEP_AS_NON_CORE
    reason: Broad InterPro IEA; the specific ligase term is defining.
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Generic aminoacyl-tRNA ligase activity is correct but less informative than cysteine-tRNA ligase activity.
    action: KEEP_AS_NON_CORE
    reason: Broad IEA retained as non-core.
- term:
