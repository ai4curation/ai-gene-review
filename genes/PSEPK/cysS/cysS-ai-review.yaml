  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Cysteinyl-tRNA synthetase that uses ATP to attach L-cysteine to tRNA(Cys), generating cysteinyl-tRNA for translation in the bacterial cytoplasm. The reviewed UniProt assignment, including a zinc cofactor, is based on HAMAP rule MF_00041.
