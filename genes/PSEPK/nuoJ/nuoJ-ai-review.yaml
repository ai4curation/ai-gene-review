core_functions:
- description: Five-helix membrane subunit of proton-pumping NDH-1 (complex I) in
    the proximal membrane arm that forms part of the E-channel and N/K/J/A proton
    pathways, contributing to the energy-coupled NADH:ubiquinone oxidoreductase
    activity of the assembled complex (inferred from family membership and orthology
    to E. coli NuoJ).
