  label: Pseudomonas putida KT2440
description: NuoJ is a small integral-membrane subunit in the proximal membrane arm of respiratory complex I. It contributes structural coupling between the quinone-reactive region and the distal antiporter-like proton-pumping subunits.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: 'plasma membrane is supported for NuoJ and is retained.'
      action: ACCEPT
      reason: "NuoJ is the small proximal membrane subunit of respiratory complex I. The UniRule (RU004429) feature table predicts five helical transmembrane segments (6-21 through 138-160), and membership in the complex I subunit 6 family (Pfam Oxidored_q3) places it in the membrane arm of NDH-1, which in a Gram-negative bacterium sits in the inner (plasma) membrane. Evidence is sequence-feature and family based, not an assay on this protein."
      supported_by:
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        6..21"
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: "FT   TRANSMEM        138..160"
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: "SIMILARITY: Belongs to the complex I subunit 6 family."
  - term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: 'Retain NADH dehydrogenase (ubiquinone) activity for NuoJ with a contributes_to qualifier.'
      action: MODIFY
      reason: NuoJ contributes an essential subunit role to assembled respiratory complex I but does not independently catalyze the complete NADH:quinone reaction; retain the term and replace enables with contributes_to.
      supported_by:
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: [DE]
          supporting_text: "RecName: Full=NADH-quinone oxidoreductase subunit"
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
          supporting_text: "Respiratory Complex I (NADH:ubiquinone oxidoreductase) is the largest enzyme of the electron transport chain and its main entry point"
      proposed_replacement_terms:
        - id: GO:0008137
          label: NADH dehydrogenase (ubiquinone) activity
  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: 'proton transmembrane transport is supported for NuoJ and is retained.'
      action: ACCEPT
      reason: "NuoJ belongs to the complex I subunit 6 family (Pfam Oxidored_q3; InterPro IPR042106 NuoJ). The UniRule RU004429 function statement describes NDH-1 as a whole coupling electron transfer to proton translocation across the cytoplasmic membrane; NuoJ takes part as a membrane-arm subunit of the proton-translocating sector. Evidence is family-level and describes the complex, not an assay on this protein."
      supported_by:
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "reaction to proton translocation (for every two electrons transferred,"
        - reference_id: file:PSEPK/nuoJ/nuoJ-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: "DR   Pfam; PF00499; Oxidored_q3; 1."
