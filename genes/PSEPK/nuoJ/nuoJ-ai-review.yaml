  label: Pseudomonas putida KT2440
description: >-
  NuoJ (PP_4127; NADH-quinone oxidoreductase subunit J, complex I subunit 6
  family, ND6/Nqo10 homologue) is a 166-residue, five-transmembrane-helix
  subunit of the cytoplasmic-membrane, proton-pumping NADH:quinone
  oxidoreductase NDH-1 (respiratory complex I). By orthology to the
  characterised Escherichia coli NuoJ and Thermus thermophilus Nqo10, it sits
  in the proximal membrane arm between NuoH and NuoN, forms with NuoK the second
  half-channel of the E-channel proton pathway, and borders the proton channel
  at the NuoN/NuoK/NuoJ/NuoA interface; conserved residues in its central
  transmembrane segment are needed for energy-coupled electron transfer and
  proton translocation. It has no redox cofactor and contributes to the
  activity of the complex, which couples NADH-to-quinone electron transfer with
  proton pumping across the membrane.
