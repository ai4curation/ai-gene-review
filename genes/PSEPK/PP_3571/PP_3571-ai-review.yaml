id: Q88GZ4
gene_symbol: PP_3571
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PP_3571 (Q88GZ4) encodes an uncharacterized M20A-family (ArgE/DapE clan)
  zinc-dependent metallohydrolase predicted to hydrolyse the amide bond of an
  N-acylated amino acid. Its di-metal active site is fully conserved relative to
  E. coli acetylornithine deacetylase, but it is a divergent paralog of the
  KT2440 acetylornithine deacetylase (PP_5186, ArgE) and of the
  succinyl-diaminopimelate desuccinylase (PP_1525, DapE). Its physiological
  substrate is unresolved and could be acetylornithine, N-acetylcitrulline,
  succinyldiaminopimelate or another N-acyl amino acid. A direct role in
  L-arginine biosynthesis has not been established.
existing_annotations:
- term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: A role in L-arginine biosynthesis is plausible but not established for PP_3571.
    action: UNDECIDED
    reason: >-
      The annotation is propagated from a broad M20A/ArgE-like family without
      direct KT2440 evidence. The same PANTHER subfamily contains proteins with
      DapE and N-acetylcitrulline-deacetylase assignments, and PP_3571 is not in
      an arginine-biosynthesis gene neighborhood.
    supported_by:
    - reference_id: file:PSEPK/PP_3571/PP_3571-deep-research-openscientist.md
      supporting_text: >-
        However, the specific-substrate assignment of "acetylornithine
        deacetylase" for PP_3571 is a homology inference with no experimental
        characterization of this particular protein.
- term:
    id: GO:0008777
    label: acetylornithine deacetylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      PP_3571 is a catalytically intact M20A (ArgE/DapE-clan) N-acyl-amino-acid
      amidohydrolase, but it is not the KT2440 acetylornithine deacetylase
      ortholog; the substrate-specific acetylornithine term is not supported and
      should be generalized to the shared linear-amide C-N hydrolase parent.
    action: MODIFY
    reason: >-
      Re-reviewed after a blinded OpenScientist control run (file:PSEPK/PP_3571/PP_3571-hypotheses/function-hypothesis-go-0008777/openscientist.md). The run and
      a local re-computation agree on the facts: (i) all seven E. coli ArgE
      (P23908) active-site and Zn-ligand residues (H80, D82, D112, E144, E145,
      E169, H355) map to conserved residues in PP_3571 (H77, D79, D109, E141,
      E142, E169, H363), so this is not a pseudo-enzyme; (ii) KT2440 already has
      a canonical ArgE ortholog, PP_5186/argE (Q88CJ5, PANTHER PTHR43808:SF1),
      about 50% identical to E. coli ArgE, whereas PP_3571 is a roughly
      equidistant paralog (about 32-37% identity to E. coli ArgE, E. coli DapE,
      KT2440 DapE PP_1525, KT2440 ArgE PP_5186 and Xanthomonas N-acetylcitrulline
      deacetylase Q8P8J5; local Needleman-Wunsch/BLOSUM62 identities over aligned
      columns). Identity at this level does not transfer substrate specificity.
      The run's suggestion that the SF31 subfamily label makes N-acetylcitrulline
      deacetylase (GO:0043909) the best specific lead is not adopted: the local
      PANTHER member snapshot shows SF31 is dominated by succinyl-diaminopimelate
      desuccinylases (about 380 of its named members, including KT2440 DapE
      Q88MP5), so the SF31 name is not substrate-informative. The run's
      pathway-context argument (Pseudomonas uses the cyclic ArgJ route) rests on
      papers not cached here and is recorded only as a lead. GO:0008777 is
      therefore replaced with its parent GO:0016811, which covers acetylornithine,
      acetylcitrulline and succinyl-diaminopimelate hydrolysis alike, pending a
      substrate-panel assay.
    proposed_replacement_terms:
    - id: GO:0016811
      label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
    supported_by:
    - reference_id: file:PSEPK/PP_3571/PP_3571-hypotheses/function-hypothesis-go-0008777/openscientist.md
      supporting_text: Every one of the seven ArgE catalytic and metal-binding residues has a conserved counterpart in PP_3571
    - reference_id: file:PSEPK/PP_3571/PP_3571-hypotheses/function-hypothesis-go-0008777/openscientist.md
      supporting_text: The identity gradient says the specific-substrate call belongs on PP_5186.
    - reference_id: file:PSEPK/PP_3571/PP_3571-hypotheses/function-hypothesis-go-0008777/openscientist.md
      supporting_text: GO:0008777 vs GO:0043909 cannot be decided from sequence alone.
    - reference_id: file:PSEPK/argE/argE-uniprot.txt
      supporting_text: PTHR43808:SF1; ACETYLORNITHINE DEACETYLASE
    - reference_id: file:interpro/panther/PTHR43808/PTHR43808-entries.csv
      supporting_text: Q88MP5,Succinyl-diaminopimelate desuccinylase
    - reference_id: file:PSEPK/PP_3571/PP_3571-deep-research-openscientist.md
      supporting_text: >-
        However, the specific-substrate assignment of "acetylornithine
        deacetylase" for PP_3571 is a homology inference with no experimental
        characterization of this particular protein.
