- id: file:PSEPK/PP_3571/PP_3571-hypotheses/function-hypothesis-go-0008777/openscientist.md
  title: OpenScientist TreeGrafter stress test for PP_3571 acetylornithine deacetylase activity
  findings:
  - statement: >-
      Blinded run found the ArgE catalytic and Zn-ligand residues fully
      conserved and PP_3571 a divergent paralog of the KT2440 ArgE ortholog
      PP_5186; verdict partially supported / too general with paralog confusion.
    supporting_text: Every one of the seven ArgE catalytic and metal-binding residues has a conserved counterpart in PP_3571
  - statement: >-
      Lead only (supporting PMIDs not cached): Pseudomonas uses the cyclic ArgJ
      arginine pathway, so no ArgE-family paralog is forced to be the
      acetylornithine deacetylase.
    supporting_text: A dedicated ArgE acetylornithine-deacetylase step is therefore **not the principal arginine-biosynthetic route** in *Pseudomonas*.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Active-site mapping and the PP_5186 vs PP_3571 identity gradient were
      reproduced locally (Biopython global alignment to UniProt P23908, Q8P8J5,
