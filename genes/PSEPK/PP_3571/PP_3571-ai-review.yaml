suggested_questions:
- question: >-
    Which N-acetylated or N-succinylated amino-acid substrate is preferred by
    Q88GZ4, and does loss of PP_3571 cause arginine or lysine auxotrophy?
  experts:
  - microbial amino-acid metabolism
  - M20 metallohydrolases
suggested_experiments:
- description: >-
    Purify recombinant PP_3571 (with PP_5186 as a control) and assay
    deacylation of N-acetyl-L-ornithine, N-acetyl-L-citrulline,
    N-succinyl-L,L-diaminopimelate and other N-acyl amino acids with Zn2+/Co2+;
    score PP_3571 and PP_5186 single and double deletions for arginine or lysine
    auxotrophy.
