id: Q88Q64
gene_symbol: pilD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PilD is an integral inner-membrane prepilin leader peptidase and
  N-methyltransferase. It cleaves short leaders from type IV prepilin-like
  substrates and methylates the newly exposed N terminus, thereby maturing
  subunits used in both type IV pili and the type II secretion pseudopilus.
