    summary: PilD proteolytically removes the leader peptide from prepilin-like substrates.
    action: ACCEPT
    reason: The UniProt record assigns EC 3.4.23.43 and describes cleavage of the conserved Gly-Phe junction by this peptidase A24-family enzyme.
