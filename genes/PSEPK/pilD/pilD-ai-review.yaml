    summary: PilD methylates the newly exposed N-terminal amino group after leader cleavage.
    action: NEW
    reason: UniProt explicitly describes S-adenosyl-L-methionine-dependent N-terminal methylation, while the current GOA fetch lacks this second catalytic activity.
- term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence_type: ISS
  original_reference_id: file:PSEPK/pilD/pilD-uniprot.txt
  qualifier: involved_in
  review:
    summary: PilD matures the pseudopilins required for type II secretion.
    action: NEW
    reason: The UniProt functional statement explicitly assigns PilD an essential role in type II pseudopilus formation; this does not imply that its parallel type IV pilus role is part of the T2SS module.
