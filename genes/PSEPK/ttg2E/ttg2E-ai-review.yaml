    title: UniProt record for Pseudomonas putida KT2440 Ttg2E (Q88P90)
    findings:
      - statement: Q88P90 is a 100-residue STAS-domain protein in the mlaFEDB-like operon.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_mla_intermembrane_phospholipid_transport__ppu02010-deep-research-openscientist.md
    title: OpenScientist PSEPK Mla pathway satisfiability research
    findings:
      - statement: >-
          PP_0962 is the single-copy K07122 MlaB assignment and lies directly
          after mlaF-mlaE-mlaD-ttg2D, strongly supporting the MlaB-equivalent
          identity while leaving its exact target-specific regulatory mechanism untested.
  - id: file:PSEPK/ttg2E/ttg2E-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK Ttg2E/Q88P90
    findings:
      - statement: Q88P90 is a small single-STAS-domain protein without a signal peptide or transmembrane helix.
        supporting_text: a 100-residue protein consisting solely of a STAS domain is the diagnostic architecture of **MlaB**
      - statement: Operon context strongly supports Ttg2E as the MlaB-equivalent accessory subunit.
        supporting_text: This gene order (F‑E‑D‑C‑B) is identical to the canonical *E. coli* `mlaFEDCB` operon, unambiguously assigning **ttg2E = MlaB**.
      - statement: Direct experiments on orthologs support assembly and activity roles but do not establish the precise KT2440 mechanism.
        supporting_text: MlaB plays critical roles in both the assembly and activity of the transporter
