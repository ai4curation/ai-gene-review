id: Q88P90
gene_symbol: ttg2E
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Small STAS-domain MlaB-like cytoplasmic subunit encoded with MlaF, MlaE,
  MlaD, and the Ttg2D/MlaC carrier. Ttg2E is assigned a structural or
  regulatory role in assembly and activity of the inner-membrane MlaFEDB
  phospholipid transport complex.
