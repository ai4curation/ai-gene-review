knowledge_gaps:
  - gap_statement: The exact effect of KT2440 Ttg2E on MlaFEDB assembly, stability, and MlaF ATPase activity is untested.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: >-
      STAS architecture and operon position establish MlaB-equivalent identity,
      but no catalytic molecular function or precise regulatory mechanism is assigned.
  - gap_statement: Ttg2E has not been individually tested for solvent tolerance or envelope phenotypes in KT2440.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: The historical toluene-tolerance name is pathway-level phenotype context, not a direct molecular-function annotation.
suggested_questions:
  - question: How does Ttg2E affect KT2440 MlaFEDB assembly, stability, and MlaF ATPase coupling?
suggested_experiments:
  - description: Compare MlaFEDB assembly, ATPase activity, and phospholipid transfer with and without Ttg2E.
