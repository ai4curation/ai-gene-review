  - term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence_type: ISS
    original_reference_id: file:PSEPK/ttg2E/ttg2E-deep-research-openscientist.md
    qualifier: involved_in
    review:
      summary: Ttg2E is the MlaB-like accessory subunit of the MlaFEDB phospholipid-transfer complex.
      action: NEW
      reason: Its single STAS domain and mlaF-mlaE-mlaD-ttg2D-ttg2E operon position support the conserved MlaB role.
  - term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
