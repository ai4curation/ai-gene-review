description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_BCAQ01000003.1_61 is "Erythromycin esterase-like family hydrolase, substrate specificity
  undetermined" (tier B). It carries three GO terms: GO:0016787 hydrolase activity, GO:0016788
  hydrolase activity, acting on ester bonds, and GO:0005737 cytoplasm. The query is 100%
  identical to KT2440 PP_3231 (Q88HX2), so it is scored on that accession. GOA holds only an
  InterPro2GO "response to antibiotic" IEA, so all three predicted terms are novel. The
  family-level call is correct. PP_3231 is an Ere-family protein (Pfam PF05139, PIRSF036794) that
  conserves all five EreC catalytic residues (E60, H63, E91, R268, H297 for EreC E47, H50, E78,
  R261, H289), and every characterized Ere-family member is a metal-independent ester hydrolase.
  The call rightly declines to assign erythromycin esterase activity or an antibiotic-resistance
  role. PP_3231 is only 24-28% identical to EreA, EreB, EreC, EreD and to the non-macrolide
  esterase Bcr136, and it has no significant RB-TnSeq phenotype in 300 KT2440 experiments, none
  of which used a macrolide. The call's evidence did not include the catalytic-residue check or
  the Ere-family biochemistry, so the residue-level support comes from this review. The eggNOG
  and KEGG "protein-L-isoaspartate O-methyltransferase" label on the dashboard page is a
  propagated annotation that the call correctly ignored.
