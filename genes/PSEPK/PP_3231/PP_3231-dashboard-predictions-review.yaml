predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016787
    label: hydrolase activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel, because GOA for Q88HX2 has no molecular-function term.
      PP_3231 is an Ere-family protein. Every characterized member of that family, EreA, EreB,
      EreC, EreD and Bcr136, is a hydrolase that activates water with a histidine general base
      (PMID:33741980, PMID:22303981). PP_3231 keeps all five EreC catalytic residues, with the
      general-base His50 at His63 (catalytic_site_results.json), so a catalytically active
      hydrolase is a justified family transfer rather than a domain stereotype. This is an
      inference, and PP_3231 itself has not been assayed. The term is broad, but it is not LSP,
      because no more specific curated annotation exists. The more specific predicted term
      GO:0016788 is also supported.
    supported_by:
    - reference_id: PMID:33741980
      supporting_text: allowed for the proposal of a detailed catalytic mechanism for the Ere family of enzymes, labeling them as metal-independent hydrolases.
    - reference_id: file:PSEPK/PP_3231/PP_3231-dashboard-prediction-evidence/catalytic_site_results.json
      supporting_text: '"query_pos": 63'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is supported by family transfer and is novel, because it is not in GOA.
      The characterized Ere-family members are all carboxylic-ester hydrolases. EreA, EreB, EreC
      and EreD open the macrolactone ester (PMID:33741980), and Bcr136, which does not inactivate
      macrolides, is still an esterase (PMID:22303981). The ester-bond activity is therefore
      conserved across the substrate divergence within the family. PP_3231 retains the full
      catalytic set (E60, H63, E91, R268, H297), so the transfer is justified. The substrate is
      unknown, and the call correctly withholds erythromycin esterase activity. This is an
      inference from sequence, and no PP_3231 assay exists.
    supported_by:
    - reference_id: PMID:22303981
      supporting_text: Biochemical characterization of Bcr136 confirms that it is an esterase that is, however, unable to inactivate macrolides.
    - reference_id: file:PSEPK/PP_3231/PP_3231-dashboard-prediction-evidence/catalytic_site_results.json
      supporting_text: '"identity_pct_over_aligned": 27.7'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005737
    label: cytoplasm
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      DeepTMHMM finds no signal peptide or membrane-spanning segment on the query and predicts it
      is cytoplasmic over residues 1-455. The UniProt entry has no signal or transmembrane
      features. The term is not in GOA. This is not a default localization. Some Ere-family
      homologues, such as Bcr136, carry an N-terminal lipoprotein signal, and PP_3231 lacks one,
      so the sequence evidence specifically favours the cytoplasm. Localization has not been
      tested experimentally.
    supported_by:
    - reference_id: file:PSEPK/PP_3231/PP_3231-dashboard-prediction-evidence/dashboard_call.json
      supporting_text: 'Meaning: no signal peptide and no membrane-spanning segment: the protein is predicted to be CYTOPLASMIC (globular).'
