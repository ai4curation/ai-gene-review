  review:
    summary: >-
      Family-level InterPro2GO mapping from the erythromycin esterase domain. It is not supported for
      this uncharacterized chromosomal Ere-family protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IPR007815 covers the whole Ere family. The family includes enzymes that hydrolyse
      macrolides, such as EreA, EreB, EreC and EreD, but it also includes homologues that do not.
      Bcr136 from B. cereus is an esterase that cannot inactivate macrolides (PMID:22303981).
      PP_3231 is about equally distant from both groups (24-28% identity), so family membership
      does not show that it acts on antibiotics. There is no experiment on PP_3231. The KT2440
      RB-TnSeq data show no significant phenotype in 300 experiments, and no macrolide was tested.
      The term is therefore not refuted, but it has no support beyond the domain stereotype.
    supported_by:
    - reference_id: PMID:22303981
      supporting_text: Biochemical characterization of Bcr136 confirms that it is an esterase that is, however, unable to inactivate macrolides.
    - reference_id: file:PSEPK/PP_3231/PP_3231-bioinformatics/RESULTS.md
      supporting_text: 'No experiment uses a macrolide or any other ribosome-targeting antibiotic'
- term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  evidence_type: ISS
  original_reference_id: PMID:33741980
  qualifier: enables
  review:
    summary: >-
      Ere-family ester hydrolase activity, inferred from family membership and from a fully conserved
      Ere catalytic site. The substrate is unknown.
    action: NEW
    reason: >-
      Every biochemically characterized member of the Ere family is a metal-independent
      carboxylic-ester hydrolase that uses a histidine as general base to activate water. These are
      the macrolactone-hydrolysing EreA, EreB, EreC and EreD (PMID:33741980, PMID:22303981) and
      Bcr136, which hydrolyses esters such as p-nitrophenyl butyrate. PP_3231 keeps E60, H63, E91,
      R268 and H297, which align to the EreC catalytic residues E47, H50, E78, R261 and H289. The
      ester-bond term is used because no more specific activity can be justified. Erythromycin
      esterase activity is not proposed, because Bcr136 shows that the catalytic set does not imply
      macrolide hydrolysis.
    supported_by:
    - reference_id: PMID:33741980
      supporting_text: These three residues coordinate the catalytic water, positioning it correctly for a nucleophilic attack. The conformation of the H50 side chain is further stabilized via interaction with E47, decreasing its pKa and increasing the histidine’s ability to act as a catalytic base.
    - reference_id: PMID:22303981
      supporting_text: We rule out the possibility of a Ser/Thr nucleophile and show that one histidine, H46 (EreB numbering), is essential for catalytic function.
    - reference_id: file:PSEPK/PP_3231/PP_3231-bioinformatics/RESULTS.md
      supporting_text: 'PP_3231 residues at the EreC catalytic positions: **E60, H63, E91, R268, H297**. All five are conserved.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: file:PSEPK/PP_3231/PP_3231-dashboard-prediction-evidence/dashboard_call.json
  qualifier: located_in
  review:
    summary: Predicted cytoplasmic. The protein has no signal peptide and no membrane-spanning segment.
    action: NEW
    reason: >-
      DeepTMHMM finds no signal peptide or transmembrane segment on the query, which is identical to
      Q88HX2, and predicts it is cytoplasmic over residues 1-455. The UniProt entry has no signal or
      transmembrane features. Some Ere-family homologues are secreted lipoproteins, for example
      Bcr136, which begins with a lipobox signal. PP_3231 lacks such an N-terminus, so a
      cytoplasmic location is the best-supported prediction. It has not been tested.
    supported_by:
