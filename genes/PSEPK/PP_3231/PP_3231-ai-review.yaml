- id: PMID:33741980
  title: Structural and functional insights into esterase-mediated macrolide resistance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      First crystal structures in the Ere family (EreC). The paper proposes the catalytic mechanism
      with H50 as general base, E47, E78, H289 and R261, and reports macrolide substrate spectra for
      EreB, EreC and EreD. The full text was read.
  findings:
  - statement: Ere enzymes are metal-independent hydrolases.
    supporting_text: allowed for the proposal of a detailed catalytic mechanism for the Ere family of enzymes, labeling them as metal-independent hydrolases.
  - statement: The EreC catalytic water is positioned by H50, E78 and H289, and H50 is tuned by E47.
    supporting_text: These three residues coordinate the catalytic water, positioning it correctly for a nucleophilic attack. The conformation of the H50 side chain is further stabilized via interaction with E47, decreasing its pKa and increasing the histidine’s ability to act as a catalytic base.
  - statement: The distant Bcr135 and Bcr136 homologues are esterases on simple esters.
    supporting_text: The closest structural model available is of distantly related enzymes that are capable of esterase activity on molecules, such as p-nitrophenyl butyrate, thought to be involved in succinoglycan biosynthesis in Bacillus cereus (BcR135 and BcR136)
- id: PMID:22303981
  title: Mechanism and diversity of the erythromycin esterase family of enzymes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Genomic enzymology of the Ere family. It shows that a conserved His is essential and that the
      chromosomal homologue Bcr136 is an esterase that does not inactivate macrolides. Only the
      abstract was read.
  findings:
  - statement: A conserved His (EreB H46, equivalent to EreC H50) is essential; there is no Ser/Thr nucleophile.
    supporting_text: We rule out the possibility of a Ser/Thr nucleophile and show that one histidine, H46 (EreB numbering), is essential for catalytic function.
  - statement: Bcr136, an Ere-family homologue, is an esterase that cannot inactivate macrolides.
    supporting_text: Biochemical characterization of Bcr136 confirms that it is an esterase that is, however, unable to inactivate macrolides.
- id: PMID:40843929
  title: 'A Catalytic Perspective on Erythromycin Hydrolysis by Erythromycin Esterase C: Combined CpHMD and QM/MM Metadynamics Study.'
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
