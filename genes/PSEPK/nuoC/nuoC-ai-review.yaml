core_functions:
- description: >-
    The NuoD (49-kDa) segment of fused NuoCD forms, with NuoB, the
    quinone-binding site of the plasma-membrane-associated NDH-1 peripheral
    arm, so NuoCD contributes to the proton-coupled NADH:ubiquinone
    oxidoreductase activity of respiratory complex I. The assignment is by
    orthology to E. coli NuoCD and Thermus Nqo4.
  molecular_function:
    id: GO:0048038
    label: quinone binding
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
