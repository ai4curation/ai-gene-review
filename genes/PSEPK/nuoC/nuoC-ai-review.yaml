      label: NADH dehydrogenase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review:
      summary: 'NADH dehydrogenase complex is correct but general; refine to respiratory chain complex I.'
      action: MODIFY
      reason: NuoC is a subunit of the NADH dehydrogenase complex, but the more specific respiratory chain complex I (GO:0045271, an is_a descendant already used as this review's core_functions in_complex) is supported. The curated HAMAP rule MF_01359 places NuoCD among the 13 subunits of the proton-translocating NDH-1, which is bacterial complex I (family-rule support, not experimental).
      supported_by:
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:SUBUNIT"]
          supporting_text: "NDH-1 is composed of 13 different subunits. Subunits NuoB, CD,"
