  label: Pseudomonas putida KT2440
description: NuoC is a fused NuoC/D polypeptide that supplies two conserved structural roles in the quinone-reduction arm of respiratory complex I. It helps form the quinone-reactive cavity but does not bind NAD(H) at the NuoF catalytic input site.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: 'plasma membrane is supported for NuoC and is retained.'
      action: ACCEPT
      reason: NuoC is the fused NuoC/D quinone-site scaffold of respiratory complex I. The UniProt HAMAP rule MF_01359 (curated UniRule) places it at the cell inner membrane as a peripheral membrane protein on the cytoplasmic side, i.e. bound to the bacterial plasma membrane through the membrane arm of NDH-1 rather than as an integral protein; plasma membrane is the appropriate GO term for the Gram-negative inner membrane.
      supported_by:
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane"
