  - term:
      id: GO:1902600
      label: proton transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    review:
      summary: 'proton transmembrane transport is supported for NuoC and is retained.'
      action: ACCEPT
      reason: NuoC is a peripheral-arm subunit and does not itself span the membrane; the proton translocation is performed by the membrane-arm antiporter-like subunits of the assembled complex. The curated HAMAP rule MF_01359 states that NDH-1 couples the redox reaction to proton translocation across the cytoplasmic membrane, so involvement is retained at the level of the complex, as for the other complex I subunits.
      supported_by:
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "Couples the redox reaction to proton translocation"
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "across the cytoplasmic membrane), and thus conserves the redox energy"
