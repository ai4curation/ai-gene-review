    supporting_text: In the C-terminal section; belongs to the complex I 49 kDa
      subunit family.
  - reference_id: PMID:25545070
    supporting_text: residues Tyr273 and His224 were considered candidates for
      having important interactions with the quinone headgroup
suggested_questions:
- question: Has the contribution of P. putida KT2440 nuoCD to complex I assembly,
    quinone reduction or proton-coupling efficiency been tested directly, and
    does KT2440 complex I use ubiquinone-9 exclusively?
suggested_experiments:
- description: Construct a clean nuoC(D) deletion and a NuoD Tyr-to-Phe point
    mutant at the position equivalent to E. coli Tyr273 in KT2440, then measure
    membrane NADH:ubiquinone oxidoreductase activity, inhibitor sensitivity and
    proton-motive-force generation.
