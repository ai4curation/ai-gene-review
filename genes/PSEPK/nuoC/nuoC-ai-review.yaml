      supporting_text: NDH-1 is composed of 13 different subunits. Subunits NuoB,
        CD, E, F, and G constitute the peripheral sector of the complex.
    - reference_id: PMID:11997136
      supporting_text: All 13 different subunits were detected in the purified
        enzyme by either N-terminal sequencing or matrix-assisted laser
        desorption/ionization time-of-flight mass spectral analysis.
