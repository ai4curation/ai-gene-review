- term:
    id: GO:0045271
    label: respiratory chain complex I
  evidence_type: ISS
  original_reference_id: PMID:11997136
  qualifier: part_of
  review:
    summary: Proposed new annotation. NuoCD is a core peripheral-arm subunit of
      NDH-1 (respiratory complex I).
    action: NEW
    reason: GOA gives only the general GO:0030964 parent. HAMAP places PP_4121 in
      the peripheral sector of the 13-subunit NDH-1, and its E. coli orthologue
