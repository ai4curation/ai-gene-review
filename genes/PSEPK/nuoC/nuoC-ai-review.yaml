    review:
      summary: 'respiratory electron transport chain is supported for NuoC and is retained.'
      action: ACCEPT
      reason: NuoC is the fused NuoC/D quinone-site scaffold of respiratory complex I. The curated HAMAP rule MF_01359 function statement for NDH-1 describes electron transfer from NADH to quinones in the respiratory chain, and its SUBUNIT note places NuoCD in the peripheral sector of that complex; this is family-rule (not experimental) support at the level of the complex in which NuoC participates.
      supported_by:
