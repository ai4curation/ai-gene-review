          label: respiratory chain complex I
  - term:
      id: GO:0048038
      label: quinone binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: 'quinone binding is supported for NuoC and is retained.'
      action: ACCEPT
      reason: The C-terminal (NuoD) section of this fused polypeptide belongs to the complex I 49 kDa subunit family (Pfam Complex1_49kDa, PROSITE COMPLEX1_49K), the family whose members line the quinone-reduction cavity of complex I; the Sazanov structural review (PMID:36920092; E. coli, Thermus and mitochondrial complex I, not the P. putida enzyme) names a 49 kDa/NuoCD loop among those lining the Q-binding cavity. Support is family membership plus homolog structural evidence; no experimental quinone-binding data exist for the P. putida protein, and the cavity is formed jointly with NuoB and NuoH.
      supported_by:
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: "In the C-terminal section; belongs to the complex I 49 kDa"
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: "Pfam; PF00346; Complex1_49kDa; 1."
        - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "to quinones in the respiratory chain"
        - reference_id: PMID:36920092
          supporting_text: "The cavity is lined by flexible loops: 49 kDa/NuoCD"
