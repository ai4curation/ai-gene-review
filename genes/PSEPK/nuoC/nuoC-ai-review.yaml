gene_symbol: nuoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  NuoC (NuoCD, PP_4121) is the fused C/D subunit of the proton-translocating
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I). A single
  593-residue polypeptide carries an N-terminal segment of the complex I
  30-kDa (NuoC/NDUFS3) family and a C-terminal segment of the 49-kDa
  (NuoD/NDUFS2) family. It has no redox cofactor of its own. In the peripheral
  arm, on the cytoplasmic side of the inner membrane, the NuoD segment lines
  the quinone-binding cavity together with NuoB, which carries the terminal
  [4Fe-4S] cluster N2. Conserved head-group ligands there position ubiquinone
  for reduction, and the NuoC segment contributes to the structural integrity
  of the complex. The subunit is part of the complex-level reaction in which
  NADH oxidation and quinone reduction are coupled to proton translocation
  across the cytoplasmic membrane.
