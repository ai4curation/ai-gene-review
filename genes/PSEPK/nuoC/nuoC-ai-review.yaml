- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO from the NuoD/49-kDa signature (IPR001135). The NuoD
      segment lines the quinone-binding cavity of complex I.
    action: ACCEPT
    reason: The C-terminal segment belongs to the 49-kDa family. In the
      Thermus and E. coli structures this family supplies the tyrosine and
      histidine that ligate the quinone head group near cluster N2 (Nqo4
      Tyr87/His38; E. coli NuoD Tyr273/His224). Orthology across the fused
      gamma-proteobacterial NuoCD supports quinone binding as the core
      molecular function.
    supported_by:
    - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
      supporting_text: In the C-terminal section; belongs to the complex I 49 kDa
        subunit family.
    - reference_id: PMID:23417064
      supporting_text: hydrogen-bonded to 4_Tyr87, while another interacts,
        unexpectedly, with 4_His38
    - reference_id: PMID:34308841
      supporting_text: Both DTyr273 and DHis224, found in the proximity of bound
        decylubiquinone (Baradaran et al., 2013) are conserved in E. coli and
