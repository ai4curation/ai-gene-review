- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO mapping of the complex I activity to the fused C/D
      subunit.
    action: ACCEPT
    reason: The term is the correct activity of the complex NuoCD belongs to,
      the proton-coupled NADH:ubiquinone oxidoreductase. As a subunit without an
      NADH site, NuoCD contributes to rather than independently enables this
      activity, and the core function records it as
      contributes_to_molecular_function. A MODIFY proposing the same id would
      be meaningless, so the term is accepted with this note. E. coli
      mutagenesis of the orthologous NuoC segment abolishes energy-transducing
      NDH-1 activity.
    supported_by:
    - reference_id: file:PSEPK/nuoC/nuoC-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for
        every two electrons transferred, four hydrogen ions are translocated
        across the cytoplasmic membrane), and thus conserves the redox energy in
        a proton gradient.
    - reference_id: PMID:20979355
      supporting_text: residues Glu-138, Glu-140, and Asp-143 that are thought to
        be in the third α-helix are absolutely required for the
        energy-transducing NDH-1 activities and the assembly of the whole enzyme
