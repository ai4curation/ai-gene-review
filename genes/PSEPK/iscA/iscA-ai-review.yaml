id: Q88PK6
gene_symbol: iscA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: IscA (PP_0844) is an A-type iron-sulfur assembly protein in the Isc locus. It binds a 2Fe-2S cluster and is predicted to act in late cluster assembly or transfer to recipient proteins rather than as the initial IscU scaffold.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is compatible with a soluble Isc protein.
      action: KEEP_AS_NON_CORE
      reason: Plausible location, but not a defining activity and not directly measured in KT2440.
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: This is redundant with the cytoplasm annotation in a bacterium.
      action: MARK_AS_OVER_ANNOTATED
      reason: Retaining both nested location terms adds no useful biological specificity.
  - term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: The IscA family acts in downstream Fe-S cluster assembly and delivery.
      action: ACCEPT
      reason: Q88PK6 carries the proteobacterial IscA and Fe-S assembly/transfer family signatures.
      supported_by:
        - reference_id: file:PSEPK/iscA/iscA-uniprot.txt
          supporting_text: DR   InterPro; IPR050322; Fe-S_cluster_asmbl/transfer.
  - term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Cluster binding is valid but the chaperone term better represents delivery.
      action: MODIFY
      reason: IscA carries a cluster as part of assembly or transfer, not as an end-state cofactor protein.
      proposed_replacement_terms:
        - id: GO:0140132
          label: iron-sulfur cluster chaperone activity
  - term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: The specific cluster-binding term is consistent with the conserved IscA family.
      action: ACCEPT
      reason: IscA-family proteins use conserved cysteines to coordinate a 2Fe-2S cluster during transfer.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000118
    title: TreeGrafter-generated GO annotations
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: file:PSEPK/iscA/iscA-uniprot.txt
    title: UniProtKB entry for iscA (Q88PK6)
    findings:
      - statement: Q88PK6 carries proteobacterial IscA and Fe-S assembly/transfer family assignments.
  - id: file:PSEPK/iscA/iscA-deep-research-openscientist.md
    title: OpenScientist research report for iscA (Q88PK6)
    findings:
      - statement: >-
          The report distinguishes IscA as a downstream A-type carrier or iron
          chaperone rather than the initial IscU scaffold and emphasizes
          condition-dependent redundancy.
core_functions:
  - description: Binds and carries a 2Fe-2S cluster during downstream Isc-system assembly or transfer.
    molecular_function:
      id: GO:0140132
      label: iron-sulfur cluster chaperone activity
    directly_involved_in:
      - id: GO:0016226
        label: iron-sulfur cluster assembly
    supported_by:
      - reference_id: file:PSEPK/iscA/iscA-uniprot.txt
        supporting_text: DR   InterPro; IPR011302; IscA_proteobact.
      - reference_id: file:PSEPK/iscA/iscA-deep-research-openscientist.md
        supporting_text: IscA is best described as an **iron chaperone / cluster carrier acting downstream of the IscU scaffold**
    knowledge_gaps:
      - gap_statement: The direct cluster donors and recipients of Q88PK6 are unknown in KT2440.
        significance: IscA-family proteins can be accessory or partially redundant, so operon membership does not establish a mandatory linear step.
proposed_new_terms: []
suggested_questions:
  - question: Is Q88PK6 required broadly for Fe-S maturation or only for a subset of recipient proteins?
suggested_experiments:
  - description: Compare Fe-S target maturation in wild type and an iscA deletion and reconstitute transfer from IscU to representative acceptors.
