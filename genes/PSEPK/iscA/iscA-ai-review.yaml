- id: file:PSEPK/iscA/iscA-deep-research-openscientist.md
  title: OpenScientist research report for iscA (Q88PK6)
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Supports Q88PK6 as an Isc-system A-type Fe-S cluster/iron carrier acting downstream
      of IscU, with the canonical isc operon context and conserved cluster-ligating cysteines; recombinant
      PP_0844 cluster binding, target handoff, and the inferred reduced SufA buffering in KT2440 are not
      directly demonstrated.
  findings:
  - statement: The report distinguishes IscA as a downstream A-type carrier or iron chaperone rather than
      the initial IscU scaffold and emphasizes condition-dependent redundancy.
- id: PMID:34781750
  title: Bacterial Approaches for Assembling Iron-Sulfur Proteins.
  findings:
  - statement: Bacterial IscA homologs are A-type cluster carriers; E. coli interactions support carrier-to-carrier
      handoff, while structural and biochemical studies in other bacteria demonstrate cluster coordination.
    supporting_text: This suggests that the ATC-II carriers pass their Fe-S clusters to ATC-I for delivery
      to their final destinations
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text comparative review, not a target assay. The same review discusses E. coli
      iron-loading studies and cautions that a physiological free-iron donor role remains unsettled. No
      iron-delivery-only model is imposed on KT2440.
- id: PMID:16730357
  title: The asymmetric IscA homodimer with an exposed [2Fe-2S] cluster suggests the structural basis
    of the Fe-S cluster biosynthetic scaffold.
  findings:
  - statement: Thermosynechococcus elongatus IscA coordinates a partially exposed 2Fe-2S cluster across
      two protomers.
    supporting_text: one partially exposed [2Fe-2S] cluster is coordinated by two conformationally distinct
      IscA protomers
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract explicitly identifies Thermosynechococcus elongatus. This supports conserved
      carrier-cluster coordination, not target oligomer stoichiometry or ligand residue numbering in KT2440.
