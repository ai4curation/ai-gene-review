  label: Pseudomonas putida KT2440
description: IscA (PP_0844) is a small A-type iron-sulfur cluster carrier of Pseudomonas putida KT2440.
  Its IscA-specific sequence signatures support transient cluster binding and transfer within the Isc
  maturation network. Homologs can carry different cluster types and exchange clusters with other carriers;
  neither an obligatory linear IscU-IscA-client route nor a unique target-protein repertoire is established
  for KT2440.
