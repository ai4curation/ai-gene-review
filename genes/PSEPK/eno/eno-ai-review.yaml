- id: PMID:15003462
  title: Is 2-phosphoglycerate-dependent automodification of bacterial enolases implicated in their export?
  findings:
  - statement: >-
      A significant fraction of E. coli enolase is exported into the medium, and every Lys341
      substitution that prevents 2-phosphoglycerate automodification also prevents export; the
      K341E mutant retains near-wild-type activity, so loss of export tracks loss of
      modification rather than loss of glycolytic activity.
    supporting_text: >-
      As reported for other bacteria, a significant fraction of E.coli enolase was found to
      be exported into the medium.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached from PubMed (abstract only). This is the source behind the experimental
      GO:0005576 annotation on E. coli enolase P0A6P9 seen in the cross-ortholog QuickGO
      audit. It is cited here only to establish that non-classical enolase export is a real,
      experimentally-supported phenomenon in another organism; it makes no claim about
      P. putida KT2440 and does not support the GO:0005576 annotation on this gene.
