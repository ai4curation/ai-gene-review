taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PvdD (PP_4219) is a large cytosolic nonribosomal peptide synthetase required for pyoverdine
  biosynthesis in Pseudomonas putida KT2440. Its repeated adenylation, condensation and phosphopantetheine
  carrier domains assemble the peptide scaffold, and its terminal thioesterase supports product release.
  Loss of pvdD abolishes pyoverdine production and impairs siderophore-dependent iron acquisition.
  The precise monomer specificity of its three modules has not been established in the inspected
  target-specific evidence.
