proposed_new_terms:
- proposed_name: pyoverdine synthetase complex
  proposed_definition: A multienzyme complex composed of pyoverdine biosynthetic enzymes that assemble and offload the pyoverdine peptide scaffold during pyoverdine biosynthesis.
  justification: Automated annotations currently over-transfer the enterobactin-specific complex term to pyoverdine NRPS proteins because GO lacks a pyoverdine-specific synthetase complex term.
suggested_questions:
- question: Which amino acid substrate is selected by each adenylation module of KT2440 PvdD, and how does that map onto the G4R/G4R A pyoverdine peptide products?
- question: Does PvdD form a stable biosynthetic complex with PvdI, PvdJ, and PvdL, or are the pyoverdine NRPS proteins coordinated through transient module handoffs?
- question: Which phosphopantetheinyl transferase activates the three carrier domains of PvdD in KT2440, and is that activation regulated by iron availability?
suggested_experiments:
- hypothesis: PvdD adenylation modules have distinct substrate specificities that determine the KT2440 pyoverdine peptide sequence.
  experiment_type: biochemical assay
  description: Clone and purify individual adenylation modules or module pairs from PvdD and test substrate preference by ATP-PPi exchange or adenylation assays with candidate amino acids from the KT2440 pyoverdine peptide.
- hypothesis: The carrier domains of PvdD are required as active phosphopantetheine-tethered intermediates during pyoverdine assembly.
  experiment_type: mutagenesis study
  description: Mutate the conserved phosphopantetheinylated serine in each carrier domain and measure pyoverdine production and intermediate accumulation by LC-MS.
- hypothesis: PvdD participates in a coordinated pyoverdine NRPS assembly line in the cytosol.
  experiment_type: protein interaction study
  description: Test interaction of PvdD with PvdI, PvdJ, and PvdL by co-immunoprecipitation, cross-linking mass spectrometry, or bacterial two-hybrid assays under iron-limited conditions.
