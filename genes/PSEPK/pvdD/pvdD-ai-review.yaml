- id: file:PSEPK/pvdD/pvdD-deep-research-falcon.md
  title: 'Falcon deep research report: functional annotation of pvdD (Q88F79 / PP_4219) in Pseudomonas
    putida KT2440'
  findings:
  - statement: PvdD is verified as the pyoverdine nonribosomal peptide synthetase encoded by PP_4219
      in P. putida KT2440, with a pvdD mutant unable to produce pyoverdine.
    supporting_text: pvdD is explicitly identified as PP_4219 encoding a pyoverdine nonribosomal
      peptide synthetase
  - statement: A pvdD mutant does not produce pyoverdine, consistent with PvdD being essential for
      siderophore biosynthesis under iron limitation.
    supporting_text: consistent with PvdD being an essential biosynthetic enzyme for siderophore
      formation under iron limitation
  - statement: Pyoverdine precursor assembly is carried out by large modular NRPSs using a thiotemplate
      mechanism of adenylation, carrier, and condensation domains.
    supporting_text: NRPSs are large modular enzymes that assemble peptides via a thiotemplate mechanism
  - statement: The peptidyl carrier protein domain covalently tethers the activated monomer on a
      phosphopantetheine arm during NRPS assembly.
    supporting_text: covalently tethers the activated monomer on a phosphopantetheine arm
  - statement: P. aeruginosa PvdD has the terminal thioesterase; the target Q88F79 also carries a
      terminal thioesterase domain, supporting analogous product release without imposing the same
      module substrates.
    supporting_text: PvdD is the only NRPS ending in a thioesterase domain
  - statement: PvdD assembly occurs in the cytoplasm, before precursor export across the inner membrane
      and periplasmic maturation.
    supporting_text: pyoverdine synthesis begins in the cytoplasm
  - statement: P. aeruginosa single-molecule imaging places PvdI/PvdJ/PvdD in the cytoplasm; this
      is comparative localization evidence for the KT2440 target.
    supporting_text: PvdI/PvdJ/PvdD explore the cytoplasm
  - statement: Comparative P. aeruginosa pyoverdine schemes assign these residues to PvdJ/PvdD; they
      are not a validated substrate map for KT2440 Q88F79.
    supporting_text: PvdJ and PvdD catalyze addition of L-Lys, L-hfOrn, and two L-Thr residues
  - statement: In KT2440, a pvdD mutant leaves more iron in supernatants than wild type, indicating
      reduced pyoverdine-mediated iron acquisition.
    supporting_text: pvdD mutant left more iron in supernatants than wild type
  - statement: pvdD transcription is condition-responsive, increasing roughly 3-5 fold in arginine-biosynthesis
      mutants of KT2440.
    supporting_text: pvdD and pvdA expression increased ~3
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: 'Full report distinguishes target PP_4219 mutant evidence from P. aeruginosa module-specificity
      and localization experiments. Preserve this distinction: KT2440 substrate/module mapping was
      not established by the report.'
