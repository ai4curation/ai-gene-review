product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PP_0860 is a large predicted membrane-associated flavoprotein with
  flavodoxin-like, FAD/NAD-binding, and PepSY-associated transmembrane features.
  Its deposited product name suggests a sulfite-reductase flavoprotein
  component, but its architecture and PANTHER assignment are atypical for a
  canonical soluble CysJ. Its physiological electron acceptor and relationship,
  if any, to sulfur metabolism remain unresolved.
