- id: PMID:23794620
  title: Role for ferredoxin:NAD(P)H oxidoreductase (FprA) in sulfate assimilation and siderophore biosynthesis in Pseudomonads.
  findings:
  - statement: Pseudomonas sulfate assimilation uses sulfite-reduction enzymology distinct from E. coli CysJI.
    supporting_text: pseudomonads utilize sulfite reduction enzymology distinct from that of E. coli
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. This is evidence against forcing a
      CysJ-like candidate into the core Pseudomonas sulfate-assimilation module.
suggested_questions:
- question: >-
    What physiological electron acceptor and membrane-associated process does
    PP_0860 serve, and does it make any measurable contribution to sulfate assimilation?
- question: >-
    Do the soluble domains bind both FMN and FAD, and would direct FAD-binding
    evidence justify adding GO:0050660?
suggested_experiments:
- description: >-
    Compare sulfate-, sulfite-, and cysteine-supported growth of a clean
    PP_0860 deletion with fpr-I and cysI mutants, then assay purified soluble
    domains against candidate flavin and quinone electron acceptors.
  experiment_type: targeted genetics and biochemical substrate screen
