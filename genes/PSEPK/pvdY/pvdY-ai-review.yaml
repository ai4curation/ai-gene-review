id: Q88F54
gene_symbol: pvdY
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PvdY is an MbtK/IucB-like acyltransferase associated with pyoverdine
  biosynthesis. The characterized Pseudomonas aeruginosa PvdYII ortholog
  acetylates hydroxyornithine and is required for type II pyoverdine synthesis.
  KT2440 PP_4245 is therefore best interpreted as a cytoplasmic pyoverdine
  precursor-tailoring enzyme, although its substrate specificity and reaction
  have not been tested directly.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Cytoplasm is consistent with PvdY acting before cytoplasmic NRPS assembly
      and periplasmic pyoverdine maturation, but PP_4245 has not been localized
      experimentally.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the conservative localization inference while keeping the direct
      acyltransferase reaction and pyoverdine pathway role as the core claims.
    supported_by:
    - reference_id: file:PSEPK/pvdY/pvdY-deep-research-openscientist.md
      supporting_text: "Subcellular localization is inferred."
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The broad acyltransferase term is supported by the MbtK/IucB-like domain
      architecture and by the hydroxyornithine-acetylating activity of the
      characterized PvdYII ortholog.
    action: ACCEPT
    reason: >-
      GO does not provide a verified substrate-specific PvdY term here, so the
      broad catalytic parent is retained and the inferred reaction is recorded
      in prose.
    additional_reference_ids:
    - PMID:16585778
    supported_by:
    - reference_id: file:PSEPK/pvdY/pvdY-uniprot.txt
      supporting_text: "DR   InterPro; IPR019432; Acyltransferase_MbtK/IucB-like."
    - reference_id: PMID:16585778
      supporting_text: "Bioinformatic, genetic, and biochemical approaches indicate that the PvdYII enzyme catalyzes acetylation of hydroxyornithine."
- term:
    id: GO:0019290
    label: siderophore biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      PvdYII loss prevents pyoverdine synthesis in the experimentally studied
      Pseudomonas aeruginosa system, and PP_4245 has the corresponding gene name,
      acyltransferase fold, and KT2440 pyoverdine-locus context.
    action: MODIFY
    reason: >-
      The annotation is biologically correct but GO:0002049 pyoverdine
      biosynthetic process is the more informative direct process term.
    proposed_replacement_terms:
    - id: GO:0002049
      label: pyoverdine biosynthetic process
    additional_reference_ids:
    - PMID:16585778
    - PMID:19459056
    supported_by:
    - reference_id: file:PSEPK/pvdY/pvdY-uniprot.txt
      supporting_text: "GN   Name=pvdY"
    - reference_id: PMID:16585778
      supporting_text: "A mutation in pvdY(II) prevented pyoverdine synthesis."
- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:16585778
  qualifier: involved_in
  review:
    summary: >-
      Proposed specific pathway annotation based on the characterized PvdYII
      ortholog and the matching KT2440 pvdY locus and protein-family context.
    action: NEW
    reason: >-
      PvdY-family hydroxyornithine acetylation supplies a tailored precursor for
      pyoverdine synthesis; the evidence for PP_4245 is orthology based rather
      than direct KT2440 genetics or enzymology.
    supported_by:
    - reference_id: PMID:16585778
      supporting_text: "A mutation in pvdY(II) prevented pyoverdine synthesis."
