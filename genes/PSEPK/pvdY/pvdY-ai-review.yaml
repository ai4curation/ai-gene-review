suggested_questions:
- question: >-
    Does KT2440 PvdY acetylate free or NRPS-bound hydroxyornithine, which acyl
    donor does it use, and which KT2440 pyoverdine residue depends on the step?
suggested_experiments:
- hypothesis: >-
    PP_4245 supplies an acetylated hydroxyornithine precursor required for
    KT2440 pyoverdine assembly.
  description: >-
    Purify PP_4245 and assay candidate acyl donors against free and
    carrier-protein-bound hydroxyornithine substrates, then compare pyoverdine
    production and LC-MS/MS structures in wild type, a clean pvdY deletion, and
    a complemented strain.
  experiment_type: enzymology and targeted metabolomics
