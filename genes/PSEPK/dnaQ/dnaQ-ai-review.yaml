- term:
    id: GO:0071897
    label: DNA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Epsilon contributes to DNA synthesis as a functional component of the polymerase core, while
      its own catalytic activity is proofreading.
    reason: Accept as a conserved-role inference, not as intrinsic polymerase activity. Purified E. coli
      alpha-epsilon cores support faster DNA synthesis than alpha alone (PMID8702818), demonstrating a
      functional contribution beyond a knockout requirement. Pseudomonas aeruginosa reconstitution directly
      uses the alpha-epsilon core for primer elongation (PMID15611049); the target DnaQ family and editing-subunit
      assignment support transfer to KT2440. The E. coli kinetic magnitude is not asserted for this target.
      GO0071897 is not an ancestor of the existing replication-proofreading term in the checked ontology,
      so a lateral replacement would not be a valid refinement.
    supported_by:
    - reference_id: PMID:8702818
      supporting_text: 'The rate of DNA

        synthesis by alpha-reconstituted holoenzyme using tau complex was about 5-fold

        less than that of alphaepsilon or alphaepsilontheta-reconstituted holoenzyme as

        determined by a gel analysis.'
    - reference_id: PMID:15611049
      supporting_text: 'Efficient primer elongation

        requires the presence of alphaepsilon, beta, and tau(3)deltadelta''.'
