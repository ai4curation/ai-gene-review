description: DnaQ is the epsilon proofreading subunit of bacterial DNA polymerase III. Within the polymerase III core it uses 3'-to-5' exonuclease activity to remove misincorporated nucleotides from nascent DNA, increasing replication fidelity. It contributes editing activity to the replisome but does not catalyze DNA-chain polymerization.
