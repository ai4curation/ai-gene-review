  review:
    action: MODIFY
    summary: Epsilon proofreads DNA through 3′–5′ DNA exonucleolysis.
    reason: The target DnaQ-specific domain and RuleBase editing function agree with the separate epsilon
      exonuclease in the Pseudomonas replicase. This supports proofreading nuclease chemistry without
      assigning polymerase chemistry. The demonstrated substrate context is DNA proofreading, so GO:0008296
      specifies the supported DNA substrate within the broader nucleic-acid exonuclease term GO:0008408.
      This refinement does not allege loss of the ancestral activity or exclude every possible additional
      substrate.
