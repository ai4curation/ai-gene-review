id: Q88FT6
gene_symbol: tusE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: TusE is a small cytosolic sulfur-carrier protein with a conserved C-terminal reactive cysteine.
  Its family and genomic context support a role downstream of TusBCD in sulfur delivery to the MnmA–tRNA
  reaction. Direct covalent loading of MnmA by TusE and the exact terminal incorporation mechanism remain
  unresolved; the KT2440 relay assignment is inferred from the characterized enterobacterial system.
existing_annotations:
- term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Retain the supported tRNA wobble position uridine thiolation annotation.
    action: ACCEPT
    reason: Specific target family evidence and the complete E. coli reconstitution support the conserved
      reaction role. The biochemical and structural comparator is E. coli; this is a KT2440 homolog inference,
      not a direct target assay. The protein contributes sulfur delivery or the terminal thiolation chemistry
      itself, rather than merely showing a perturbation phenotype. PTHR37010:SF1 discriminates TusE from
      the broader TIGR03342 DsrC/TusE/DsvC grouping; the PP_3993–PP_3996 neighborhood supports the matched
      relay inference, not cotranscription.
    supported_by:
    - reference_id: file:PSEPK/tusE/tusE-uniprot.txt
      supporting_text: DR   PANTHER; PTHR37010:SF1; SULFURTRANSFERASE TUSE; 1.
      record_section:
      - DR:PANTHER
    - reference_id: PMID:16387657
      supporting_text: Efficient 2-thiouridine formation in vitro was reconstituted with recombinant TusA,
        a TusBCD complex, TusE, and previously identified IscS and MnmA.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Refine cytoplasm to cytosol.
    action: MODIFY
    reason: Cytoplasm is true but broader than the supported soluble reaction compartment. The target-specific
      family together with the soluble characterized relay and cytosolic tRNA-substrate mechanism supports
      an inferred cytosol location (a descendant of cytoplasm). This is not direct target localization,
      and ARBA-only text or absent membrane features alone is not used as proof.
    supported_by:
    - reference_id: file:PSEPK/tusE/tusE-uniprot.txt
      supporting_text: DR   PANTHER; PTHR37010:SF1; SULFURTRANSFERASE TUSE; 1.
      record_section:
      - DR:PANTHER
    - reference_id: file:analysis/module_audits/bacterial_mnma_trna_thiolation/existing-review-consultation/evidence.md
      supporting_text: The inferred location of this soluble relay and its tRNA substrate reaction is
        the cytosol.
