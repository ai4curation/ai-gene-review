  label: Pseudomonas putida KT2440
description: TusE (PP_3996) is a small cytoplasmic sulfur carrier of the DsrC/TusE family, encoded last
  in the tusD-tusC-tusB-tusE locus (PP_3993-PP_3996), with a conserved C-terminal cysteine (Cys110). By
  orthology to Escherichia coli TusE it accepts persulfide sulfur from TusD of the TusBCD complex and
  delivers it to MnmA for 2-thiolation of the wobble uridine (U34) of tRNA.
