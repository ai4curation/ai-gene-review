id: Q88Q92
gene_symbol: ileS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: IleS charges tRNA(Ile) with isoleucine and proofreads near-cognate valine through pretransfer
  hydrolysis of Val-AMP and posttransfer deacylation of Val-tRNA(Ile). It acts in the cytoplasm of Pseudomonas
  putida KT2440, using ATP to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ileS must recognize and bind tRNA(Ile) to transfer its activated amino acid.
    action: ACCEPT
    reason: HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit.
      The two valine-editing reactions are family-rule inferences for this sequence. Substrate-tRNA binding
      is integral to this reaction and is not rendered uninformative merely because the catalytic MF is
      also annotated.
    supported_by: &id001
    - reference_id: file:PSEPK/ileS/ileS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Ile) + L-isoleucine + ATP = L-isoleucyl-tRNA(Ile) + AMP +
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate isoleucine by ileS.
    action: MODIFY
    reason: The MF_02002 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: IleS charges tRNA(Ile) with isoleucine and proofreads near-cognate valine through pretransfer
      hydrolysis of Val-AMP and posttransfer deacylation of Val-tRNA(Ile).
    action: ACCEPT
    reason: Hydrolysis of Val-tRNA(Ile) is the posttransfer reaction covered by GO:0002161. The separately
      inferred Val-AMP pretransfer reaction acts on an adenylate, so it must not be called tRNA deacylation.
      HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit.
      The two valine-editing reactions are family-rule inferences for this sequence.
    supported_by:
    - reference_id: file:PSEPK/ileS/ileS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: editing and involves deacylation of mischarged Val-tRNA(Ile).
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify isoleucine and tRNA(Ile).
    action: MODIFY
    reason: HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit.
      The two valine-editing reactions are family-rule inferences for this sequence. GO:0004822 is the
      supported amino-acid-specific descendant of GO:0004812; the parent is biologically correct, not
      over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0004822
      label: isoleucine-tRNA ligase activity
- term:
    id: GO:0004822
    label: isoleucine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ileS supplies isoleucine-charged tRNA(Ile) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit.
      The two valine-editing reactions are family-rule inferences for this sequence. The independently
      curated MF_02002 reaction supports this specific MF; electronic provenance does not make a central
      catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to ileS-catalysed isoleucine activation.
    action: ACCEPT
    reason: The curated MF_02002 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: ileS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_02002 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/ileS/ileS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
    - &id005
      id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for ileS.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_02002 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: ileS catalyses the charging step that supplies isoleucine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_02002 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006428
    label: isoleucyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The isoleucine-specific charging chemistry remains supported, but this biological-process
      ID is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006428 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain isoleucine specificity
      in GO:0004822. This is ontology maintenance, not a rejection of the MF_02002 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id004
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: A conserved zinc-binding site is assigned to ileS.
    action: ACCEPT
    reason: HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit.
      The two valine-editing reactions are family-rule inferences for this sequence. Zinc binding is an
      integral property of this enzyme architecture, not a peripheral physiological response. The one-ion
      assignment is explicitly a HAMAP inference, not a measured KT2440 occupancy or a claim that zinc
      is consumed by aminoacylation.
    supported_by:
    - reference_id: file:PSEPK/ileS/ileS-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 zinc ion per subunit.
- term:
    id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: ileS proofreading protects aminoacyl-tRNA fidelity.
    action: ACCEPT
    reason: Hydrolysis of Val-tRNA(Ile) is the posttransfer reaction covered by GO:0002161. The separately
      inferred Val-AMP pretransfer reaction acts on an adenylate, so it must not be called tRNA deacylation.
      Cleavage of the incorrect charged product is direct biochemical participation in fidelity, not merely
      an inferred growth requirement.
    supported_by:
    - reference_id: file:PSEPK/ileS/ileS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: editing and involves deacylation of mischarged Val-tRNA(Ile).
