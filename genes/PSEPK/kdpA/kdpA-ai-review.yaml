  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Potassium-selective membrane subunit of the high-affinity KdpFABC pump. KdpA
  binds and translocates potassium ions while coupling physically to the KdpB
  P-type ATPase that supplies transport energy.
