- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The term correctly describes the collective KdpFABC pump activity, but
      KdpA supplies potassium selection and translocation rather than the full
      ATP-coupled activity independently.
    action: ACCEPT
    reason: >-
      The term is correct in substance. The qualifier should ideally be
      contributes_to rather than enables because the complete activity belongs
      to the heteromeric pump; this relationship is captured in core_functions.
