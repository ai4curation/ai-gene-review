  label: Pseudomonas putida KT2440
description: KdpA (PP_4161) is the potassium-binding and potassium-translocating subunit of the KdpFABC
  high-affinity ATP-driven potassium uptake pump of the Pseudomonas putida inner membrane. By orthology
  with the structurally characterized Escherichia coli KdpA, it is a ten-helix member of the superfamily
  of potassium transporters whose KcsA-derived selectivity filter (TNGGG motif conserved in this protein)
  binds periplasmic K+ and forms the K+-selective pathway, while the P-type ATPase subunit KdpB supplies
  the energy for transport. The gene lies in a kdpABC operon with the KdpD/KdpE two-component regulatory
  system.
