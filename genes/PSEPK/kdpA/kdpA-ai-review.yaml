  review:
    summary: KdpA is a subunit of the KdpFABC potassium ion-transporting ATPase complex; this
      complex term is absent from GOA for the PSEPK protein.
    action: NEW
    reason: The PSEPK protein is a HAMAP-classified KdpA family member encoded in a kdp operon; the
      E. coli ortholog is a structurally resolved KdpFABC subunit, and GO:0031004 is the complex
      term whose definition names the KdpFABC subunits. Membership of the complex is a
      cellular-component claim directly entailed by orthology, matching the E. coli GOA annotation.
      This historical proposal is retained as an inference from target family/locus identity and
      homolog structural membership; the original donor accession and evidence payload are
      preserved, and no KT2440 complex purification is claimed.
