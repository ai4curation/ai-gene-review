taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: KdpA (PP_4161) is the potassium-selective entry subunit of the high-affinity KdpFABC
  uptake pump in the Pseudomonas putida KT2440 inner membrane. Its ten-helix transporter
  architecture includes a KcsA-like selectivity filter with a TNGGG motif. By homology with
  structurally and biochemically characterized Escherichia coli KdpFABC, KdpA captures periplasmic
  potassium and delivers it through an intramembrane tunnel to KdpB, whose ATPase cycle drives
  transfer and release into the cytoplasm. The kdp locus couples this pump to KdpD/KdpE regulation.
