    summary: KdpFABC ATP-driven K+ uptake activity transferred from the KdpA family and PANTHER
      node.
    action: ACCEPT
    reason: KdpA supplies potassium selection and the entry/tunnel segment of the assembled pump;
      KdpB couples ATP hydrolysis to ion transfer and cytoplasmic release. The target KdpA family
