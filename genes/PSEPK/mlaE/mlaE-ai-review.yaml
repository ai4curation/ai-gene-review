  - id: file:PSEPK/mlaE/mlaE-deep-research-openscientist.md
    title: OpenScientist functional research for PSEPK MlaE/Q88P93
    findings:
      - statement: Q88P93 is a five-pass MlaE-family inner-membrane permease.
        supporting_text: a **266-residue protein** with **five predicted helical transmembrane segments**
      - statement: MlaE provides the transmembrane substrate pathway of MlaFEDB.
        supporting_text: MlaE thus provides both the binding pocket and the transmembrane conduit.
      - statement: MlaE's permease role is secure even though the physiological direction of the system has been debated.
        supporting_text: Under either interpretation, MlaE remains the inner-membrane permease that moves phospholipid across the IM; the debate concerns net physiological directionality, not MlaE's molecular role.
