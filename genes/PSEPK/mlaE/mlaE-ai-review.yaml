- id: file:PSEPK/mlaE/mlaE-deep-research-openscientist.md
  title: OpenScientist functional research for PSEPK MlaE/Q88P93
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The report directly supports Q88P93 as the five-pass inner-membrane MlaE permease and
      substrate conduit of MlaFEDB, while keeping net physiological direction unresolved. Provider synthesis
      retained unchanged as secondary research. Direct ATP-coupled retrograde transfer in E. coli is now
      supported by PMID:34873038; equivalent native KT2440 flux remains unmeasured.
  findings:
  - statement: Q88P93 is a five-pass MlaE-family inner-membrane permease.
    supporting_text: a **266-residue protein** with **five predicted helical transmembrane segments**
  - statement: MlaE provides the transmembrane substrate pathway of MlaFEDB.
    supporting_text: MlaE thus provides both the binding pocket and the transmembrane conduit.
  - statement: MlaE's permease role is secure even though the physiological direction of the system has
      been debated.
    supporting_text: Under either interpretation, MlaE remains the inner-membrane permease that moves
      phospholipid across the IM; the debate concerns net physiological directionality, not MlaE's molecular
      role.
- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer
    membrane asymmetry.
  findings:
  - statement: E. coli reconstitution provides comparative evidence for ATP-driven retrograde transfer,
      not a direct KT2440 direction or flux measurement.
    supporting_text: Therefore, we have shown that PLs equilibrate between MlaC and MlaFEDB, and ATP hydrolysis
      drives overall transport in the retrograde direction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary read as an E. coli comparator. KT2440 target role is inferred from specific
      family/domain/context evidence; no native target transfer kinetics or partner assay is asserted.
core_functions:
- description: Inner-membrane permease contribution to MlaFEDB phospholipid transport. Support is MlaE
    family classification (Pfam MlaE, NCBIfam TIGR00056) and predicted transmembrane helices in the KT2440
    protein; the transport-pathway role comes from the MlaFEDB cryo-EM structure of a homologous complex
    (PMID:33236984), not from a KT2440 experiment.
