knowledge_gaps:
  - gap_statement: The physiologically dominant net direction and substrate spectrum of KT2440 MlaFEDB have not been established directly.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: MlaE's permease role is direction-neutral, so no fixed directional connection is authored.
  - gap_statement: Q88P93 has not been tested directly in a purified KT2440 complex or a KT2440 loss-of-function strain.
    status: OPEN
    gap_kind: [BIOLOGY]
    significance: The assignment rests on diagnostic topology, family and operon context, and orthologous MlaFEDB structures.
suggested_questions:
