id: Q88NS5
gene_symbol: pdxH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PdxH (PP_1129) is the FMN-dependent pyridoxine/pyridoxamine 5'-phosphate oxidase (EC 1.4.3.5)
  of Pseudomonas putida KT2440. By orthology to the characterized Escherichia coli enzyme
  it is a cytoplasmic homodimeric flavoenzyme that oxidizes pyridoxine 5'-phosphate or pyridoxamine
  5'-phosphate to pyridoxal 5'-phosphate (PLP) with O2, producing hydrogen peroxide. It catalyses
  the terminal step of DXP-dependent de novo PLP biosynthesis, after PdxJ forms pyridoxine
  5'-phosphate, and also serves vitamin B6 salvage.
