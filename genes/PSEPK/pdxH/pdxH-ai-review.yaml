  title: OpenScientist functional report for PSEPK PdxH
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Supports PP_1129 as the FMN-dependent PNP/PMP oxidase where de novo PLP biosynthesis
      and B6 salvage converge, using PNPOx family/domain evidence and E. coli ortholog enzymology;
      substrate oxidation, oligomerization, allosteric PLP handling, and nonredundancy in
      KT2440 remain inferred rather than directly measured.
  findings:
  - statement: >-
      Supports the exact PNP/PMP oxidase reaction and its convergence role in de novo PLP
      synthesis and salvage. No direct PP_1129 study was found; organism-specific essentiality,
      oligomerization, allosteric regulation, and PLP hand-off claims are not adopted.
