- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Wrong process: PdxH consumes PNP to form PLP; it does not build the pyridoxine ring.
    action: MODIFY
    reason: >-
      GO:0008615 is used for the PdxA/PdxJ branch that makes PNP; PdxH acts after it. The
      correct process is GO:0042823 PLP biosynthetic process, already carried by this entry.
      Changed from the draft's REMOVE to MODIFY so the term is treated as in the E. coli PdxH
      review (the claim that PdxH is in vitamin B6 synthesis is right; only the specific process
      is wrong).
    proposed_replacement_terms:
    - id: GO:0042823
      label: pyridoxal 5'-phosphate biosynthetic process
    supported_by:
    - reference_id: file:PSEPK/pdxH/pdxH-uniprot.txt
