      supporting_text: >-
        Catalyzes the oxidation of either pyridoxine 5'-phosphate (PNP) or pyridoxamine 5'-phosphate
        (PMP) into pyridoxal 5'-phosphate (PLP).
    - reference_id: file:PSEPK/pdxH/pdxH-deep-research-openscientist.md
      supporting_text: >-
        PdxH sits at the **convergence point of de novo PLP biosynthesis and B6 salvage**
- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: PdxH binds one FMN per subunit as its catalytic prosthetic group.
    action: ACCEPT
    reason: >-
      FMN accepts the hydride removed from C4' of the substrate, so FMN binding is integral
      to the oxidase mechanism (shown for the E. coli ortholog, whose FMN-contacting residues
      are conserved here). Accepted, as for E. coli PdxH, yeast PDX3 and human PNPO; the draft's
      KEEP_AS_NON_CORE is revised for family consistency.
    supported_by:
    - reference_id: file:PSEPK/pdxH/pdxH-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: Binds 1 FMN per subunit.
    - reference_id: PMID:11786019
      supporting_text: >-
        A hydrogen atom is removed from C4' during the oxidation and a pair of electrons is
        transferred to tightly bound FMN.
