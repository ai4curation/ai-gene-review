- term:
    id: GO:0004733
    label: pyridoxamine phosphate oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term captures both PNP and PMP oxidation reactions.
    action: ACCEPT
    reason: >-
      GO:0004733 is defined as PMP + H2O + O2 = PLP + NH4+ + H2O2 and also covers PNP oxidation
      to PLP, the two reactions HAMAP MF_01629 assigns to Q88NS5 (RHEA:15817, RHEA:15149).
      The protein is in PTHR10851:SF0 with the E. coli and human enzymes and retains their
      catalytic, FMN and phosphate-binding residues (hypothesis-run alignment). No direct
      assay of PP_1129 exists.
    supported_by:
