id: Q88QH3
gene_symbol: pgpA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PgpA is an inner-membrane lipid phosphatase that hydrolyzes phosphatidylglycerol phosphate to phosphatidylglycerol, completing the phosphatidylglycerol branch downstream of PgsA.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Accept plasma-membrane localization for this phosphatidylglycerol-phosphate phosphatase.
      action: ACCEPT
      reason: PgpA is a membrane lipid phosphatase acting in phosphatidylglycerol biosynthesis.
      supported_by:
        - reference_id: file:PSEPK/pgpA/pgpA-uniprot.txt
          supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane"
  - term:
      id: GO:0006629
      label: lipid metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The lipid metabolic process parent is biologically related but less specific than the phosphatidylglycerol branch assignment.
      action: MODIFY
      reason: Use phosphatidylglycerol biosynthetic process for this PgpA enzyme rather than the broad lipid metabolic process parent.
      supported_by:
        - reference_id: file:PSEPK/pgpA/pgpA-goa.tsv
          supporting_text: "GO:0006629\tlipid metabolic process"
      proposed_replacement_terms:
        - id: GO:0006655
          label: phosphatidylglycerol biosynthetic process
  - term:
      id: GO:0008962
      label: phosphatidylglycerophosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Accept the specific phosphatidylglycerophosphatase activity.
      action: ACCEPT
      reason: The EC/PIRNR-supported UniProt identity and GOA row identify PgpA as phosphatidylglycerophosphatase A.
      supported_by:
        - reference_id: file:PSEPK/pgpA/pgpA-goa.tsv
          supporting_text: "GO:0008962\tphosphatidylglycerophosphatase activity"
        - reference_id: file:PSEPK/pgpA/pgpA-uniprot.txt
          supporting_text: Full=Phosphatidylglycerophosphatase A
  - term:
      id: GO:0006655
      label: phosphatidylglycerol biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000041
    qualifier: involved_in
    review:
      summary: Accept phosphatidylglycerol biosynthetic process as the pathway context.
      action: ACCEPT
      reason: PgpA dephosphorylates phosphatidylglycerol phosphate in the phosphatidylglycerol biosynthetic branch.
      supported_by:
        - reference_id: file:PSEPK/pgpA/pgpA-uniprot.txt
          supporting_text: "PATHWAY: Phospholipid metabolism; phosphatidylglycerol biosynthesis;"
