  review:
    summary: Accept plasma-membrane localization for this phosphatidylglycerol-phosphate phosphatase.
    action: ACCEPT
    reason: UniProt places PgpA in the inner membrane, and Phobius predicts three transmembrane helices
      (59-76, 97-123, 143-166), as in E. coli PgpA, whose inner-membrane location is experimental. Plasma
      membrane is the GO term for the Gram-negative inner membrane.
