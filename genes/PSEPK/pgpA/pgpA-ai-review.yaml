taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PgpA (PP_0520; UniProt Q88QH3) is the Pseudomonas putida KT2440 member of the PgpA family
  of small inner-membrane, Mg2+-dependent phosphatidylglycerophosphate phosphatases. By homology to Escherichia
  coli PgpA it hydrolyses the terminal phosphate of phosphatidylglycerol phosphate to give phosphatidylglycerol,
  the second step of phosphatidylglycerol synthesis from CDP-diacylglycerol, downstream of PgsA. Phosphatidylglycerol
  is a major KT2440 membrane lipid and the substrate of cardiolipin synthesis.
