- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:28655819
  review:
    action: UNDECIDED
    reason: Withdraw the inherited author-created process proposal pending evidence that PedH itself
      performs regulatory work. Native promoter reporters establish PedH-dependent positive
      feedback, and the later study proposes a sensor role, but an essential component can act
      indirectly through metabolism. The experiments do not distinguish direct sensory participation
      from a signal produced by alcohol oxidation. This is uncertainty about participation, not
      evidence that the feedback phenotype is false. The retired flag records withdrawal of a prior
      proposal absent from GOA, not removal of a historical GOA annotation.
    supported_by:
    - reference_id: PMID:28655819
      supporting_text: Notably, the expression from the pedH promoter was dramatically reduced
        (2-fold versus 37-fold) in the ΔpedH strain in comparison with that in the strains capable
        of producing a functional PedH protein.
    - reference_id: PMID:30158283
      supporting_text: In addition, the transcription of pedH is activated via a yet unknown
        pathway, in which a functional PedH protein is an essential component, most likely by acting
        as a lanthanide sensor (8).
    summary: PedH-dependent expression feedback is measured; regulatory participation remains
      unresolved.
