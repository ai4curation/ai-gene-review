- term:
    id: GO:0006066
    label: alcohol metabolic process
  evidence_type: IC
  review:
    action: NEW
    reason: This is an inherited proposal, not a newly added annotation. Retain because the enzyme
      itself catalyzes alcohol oxidation, supported by purified-protein substrate measurements and
      native catabolic phenotypes. It is not inferred solely from knockout necessity. The broader
      process includes the condition-dependent secondary-butanediol entry, so no redundant new
      butanediol process is proposed. The author-controlled proposal uses IC from measured
      target-enzyme turnover, replacing its inherited IEA placeholder; this does not edit a GOA
      assertion.
