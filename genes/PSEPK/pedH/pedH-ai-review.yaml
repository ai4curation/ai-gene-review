taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PedH is a lanthanide-dependent, pyrroloquinoline quinone (PQQ)-using alcohol dehydrogenase
  of Pseudomonas putida KT2440. It acts in the periplasm on diverse primary and secondary alcohols, including
  aromatic substrates, and also oxidizes some aldehydes. Together with the alternative metal-dependent
  paralog it provides condition-dependent entry into (2S,3S)-2,3-butanediol utilization. The PedS2/PedR2
  regulatory system adjusts expression to lanthanide availability. A cytochrome c acceptor is assigned
  by enzyme-family homology; the specific physiological KT2440 electron-transfer partner remains unresolved.
  PedH also contributes a positive expression-feedback phenotype whose signaling mechanism is unresolved.
existing_annotations:
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    action: MARK_AS_OVER_ANNOTATED
    reason: This electronic calcium assignment overextends the calcium-dependent quinoprotein model
      to the lanthanide-dependent PedH active site. Purified PedH is inactive under the calcium
      conditions that activate PedE, but active with tested early lanthanides; the PedH 6ZCW
      structure contains praseodymium and PQQ. These observations establish the functional metal
      distinction, not an absolute inability to bind calcium nonspecifically.
    supported_by:
    - reference_id: PMID:28655819
      supporting_text: When we assayed purified PedH under the optimized reaction conditions used
        for PedE, no activity was observed with any of the substrates tested (data not shown).
    - &id005
      reference_id: PMID:28655819
      supporting_text: However, in the presence of the lanthanide La3+, Ce3+, Pr3+, Nd3+, Sm3+,
        Gd3+, or Tb3+ at 1 µM, enzymatic activity was detected, with maximal specific activity
        observed with Pr3+ and Nd3+ and only very low activity observed with Gd3+ and Tb3+.
    summary: Calcium supports PedE catalysis, whereas PedH uses lanthanides under the tested
      conditions.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    action: MARK_AS_OVER_ANNOTATED
    reason: The mapping to membrane overextends the broader PQQ-dehydrogenase group, which includes
      membrane-bound and soluble classes. These target proteins are classified as type I
      quinoproteins and perform periplasmic oxidation; soluble recombinant purification agrees with
      that assignment. The membrane claim is not established by these observations, but neither
      absence of a transmembrane helix nor purification alone excludes transient peripheral membrane
      contact.
    supported_by:
    - &id004
      reference_id: PMID:30158283
      supporting_text: In a recent study, we found that these two type I quinoproteins (9, 10)
        exhibit a similar substrate scope but require different metal cofactors (8).
    - &id001
      reference_id: PMID:30158283
      supporting_text: For efficient capture and metabolism of such VOCs, P. putida makes use of two
        pyrroloquinoline quinone (PQQ)-dependent ethanol dehydrogenases (PQQ-EDHs)—namely, PedE and
        PedH—to carry out the initial oxidation steps in the periplasm of the cell (7, 8).
    - reference_id: PMID:28655819
      supporting_text: A one-step affinity chromatography method produced soluble C-terminally
