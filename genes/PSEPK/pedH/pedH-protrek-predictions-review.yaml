  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950/ KT2440)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for PedH, the lanthanide-dependent PQQ alcohol dehydrogenase.
  Ranks 1 to 3 are all correct: the cytochrome c(L) and cytochrome c alcohol dehydrogenase activities
  and the PQQ cofactor binding, matching two of this review's core functions. What no call captures
  is the feature that made this protein notable - its strict requirement for trivalent lanthanides
  rather than calcium, and the lanthanide-sensing regulatory role. The free-text channel returns acetic-acid-producing
  quinoprotein systems, also missing the lanthanide biology. Assessment: 1 correct novel (COR), 2
  correct not novel (CNN).
