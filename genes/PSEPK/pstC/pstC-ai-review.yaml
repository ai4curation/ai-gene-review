      A same-species PRS2000 study established PstSCAB-dependent phosphate
      uptake, but it does not identify Q88JJ2 or the KT2440 PP_2656 operon.
    supporting_text: >-
      The pstSCAB genes of Pseudomonas putida PRS2000, encoding the phosphate
