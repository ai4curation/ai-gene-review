id: Q88JJ2
gene_symbol: pstC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PstC membrane permease subunit of a bacterial phosphate ABC transporter.
  Together with PstA it forms the translocation pathway that accepts
  PstS-bound phosphate and couples to the PstB ATPase. In KT2440, this protein
  is encoded in the PP_2656-PP_2659 Pst-like operon.
existing_annotations:
- term:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The function is correct at the assembled-permease level, but PstC is one
      subunit of the PstA/PstC membrane pair and does not independently enable it.
    action: MODIFY
    reason: Retain GO:0005315 with contributes_to rather than enables.
    proposed_replacement_terms:
    - id: GO:0005315
      label: phosphate transmembrane transporter activity
    supported_by:
    - reference_id: file:PSEPK/pstC/pstC-uniprot.txt
      supporting_text: >-
        Part of the binding-protein-dependent transport system for phosphate;
        probably responsible for the translocation of the substrate across the membrane.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Correct location for this multipass membrane subunit.
    action: ACCEPT
- term:
    id: GO:0006817
    label: phosphate ion transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The broad transport process should be refined to transmembrane phosphate transport.
    action: MODIFY
    reason: >-
      UniProt assigns PstC to translocation of phosphate across the membrane,
      supporting the membrane-specific child of the existing term.
    proposed_replacement_terms:
    - id: GO:0035435
      label: phosphate ion transmembrane transport
    supported_by:
    - reference_id: file:PSEPK/pstC/pstC-uniprot.txt
      supporting_text: >-
        Part of the binding-protein-dependent transport system for phosphate;
        probably responsible for the translocation of the substrate across the membrane.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Correct but less precise than the plasma-membrane annotation.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: part_of
  review:
    summary: PstC is a membrane component of a substrate-binding-subunit-containing PstSACB transporter.
    action: MODIFY
    reason: Use the specific ABC importer complex term that explicitly includes a substrate-binding subunit.
    proposed_replacement_terms:
    - id: GO:0055052
      label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
