gene_symbol: pgi2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  pgi2 (pgi-2, PP_4701) encodes the second glucose-6-phosphate isomerase
  (phosphoglucose isomerase) of Pseudomonas putida KT2440, a paralog of pgi1
  (PP_1808). Both are 554-residue proteins of the GPI family and the same
  PANTHER subfamily. pgi2 is a soluble, cytoplasmic SIS-domain enzyme that
  catalyzes the reversible aldose-ketose isomerization between D-glucose
  6-phosphate and D-fructose 6-phosphate. KT2440 lacks a functional
  Embden-Meyerhof-Parnas pathway and catabolizes glucose through the
  Entner-Doudoroff route. Its upper EMP enzymes, including phosphoglucose
  isomerase, therefore operate in the gluconeogenic direction. They make
  glucose 6-phosphate from fructose 6-phosphate on gluconeogenic substrates
  and within the EDEMP cycle, which returns part of the ED-derived triose
  phosphate to glucose 6-phosphate and favours NADPH formation through
  glucose-6-phosphate dehydrogenase.
