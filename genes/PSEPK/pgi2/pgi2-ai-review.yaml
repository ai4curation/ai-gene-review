- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      In KT2440 the upper EMP enzymes operate gluconeogenically. Phosphoglucose
      isomerase converts fructose 6-phosphate to glucose 6-phosphate both
      during growth on gluconeogenic substrates and in the EDEMP cycle. HAMAP
      assigns the enzyme to the gluconeogenesis pathway.
    action: ACCEPT
    reason: >-
      Gluconeogenesis is the physiological direction of this reaction in
      KT2440. This is the same action as on pgi1. No evidence separates the
      roles of the two paralogs.
    supported_by:
    - reference_id: file:PSEPK/pgi2/pgi2-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Carbohydrate biosynthesis; gluconeogenesis.'
    - reference_id: PMID:26350459
      supporting_text: the EMP (operating in a gluconeogenic fashion)
- term:
    id: GO:0006096
    label: glycolytic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      This row comes from the HAMAP pathway assignment (glycolysis step 2/4).
      KT2440 lacks a functional EMP pathway, and glucose is catabolized almost
      exclusively through the ED route. During glucose catabolism, however,
      the EDEMP cycle recycles about 10% of the triose phosphate to hexose
      phosphates, and Pgi takes part in that recycling. So the reaction belongs
      to glycolysis, and the enzyme acts during glucose catabolism, but its
      physiological direction is gluconeogenic.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is not wrong: Pgi is a glycolytic enzyme and works within the
      glucose-catabolic EDEMP cycle. It is not the core role of the enzyme in
      KT2440, where gluconeogenesis is. The same action is used for this term
      on pgi1 and on the class II aldolase fba.
    supported_by:
    - reference_id: PMID:26350459
      supporting_text: lacks a functional Embden-Meyerhof-Parnas (EMP) pathway
    - reference_id: PMID:26350459
      supporting_text: about 10% of the triose phosphates were found to be recycled back to form hexose phosphates
    - reference_id: PMID:27933319
      supporting_text: it can be recycled upward for the production of FBP, fructose-6-P, and glucose-6-P to generate reducing power
