id: Q88HS9
gene_symbol: paaE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaE is the FAD- and [2Fe-2S]-containing reductase subunit of the PaaABCE
  ring 1,2-phenylacetyl-CoA epoxidase system in Pseudomonas putida KT2440. It
  supplies reducing equivalents to the multicomponent oxygenase during
  aerobic phenylacetate catabolism.
existing_annotations:
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct process annotation for the epoxidase reductase subunit.
    action: ACCEPT
    reason: >-
      Q88HS9 matches the dedicated PaaE family models (NCBIfam TIGR02160,
      InterPro IPR011884, PANTHER PTHR47354:SF8), which define the reductase
      component of the PaaABCE ring 1,2-phenylacetyl-CoA epoxidase that
      initiates aerobic phenylacetate catabolism. Support is family membership;
      the submitter-imported UniProt name is not used, and no KT2440 assay of
      this subunit was found.
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR02160; PA_CoA_Oxy5; 1."
