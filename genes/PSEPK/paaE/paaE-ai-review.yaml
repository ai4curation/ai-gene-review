id: Q88HS9
gene_symbol: paaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaE is the predicted FAD- and [2Fe-2S]-containing NAD(P)H reductase
  subunit of the PaaABCE ring 1,2-phenylacetyl-CoA epoxidase system in
  Pseudomonas putida KT2440. It combines an N-terminal plant-type ferredoxin
  domain with a ferredoxin-reductase-type FAD- and NAD(P)-binding module and,
  by orthology to the E. coli enzyme, transfers electrons from NADPH to the
  diiron PaaA oxygenase subunit during aerobic phenylacetate catabolism.
existing_annotations:
- term:
    id: GO:0010124
    label: phenylacetate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Correct process annotation for the epoxidase reductase subunit.
    action: ACCEPT
    reason: >-
      Q88HS9 is classified in the PANTHER 1,2-phenylacetyl-CoA epoxidase
      subunit E subfamily and the NCBIfam PaaE family (TIGR02160), lies in the
      paa locus, and its orthologs are required for the phenylacetyl-CoA
      epoxidase that initiates aerobic phenylacetate catabolism.
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      supporting_text: 'PANTHER; PTHR47354:SF8; 1,2-PHENYLACETYL-COA EPOXIDASE, SUBUNIT E'
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct but very general for the NAD(P)H-oxidizing reductase subunit.
    action: MODIFY
    reason: >-
      The evidence supports the more specific descendant GO:0016651
      oxidoreductase activity, acting on NAD(P)H: the E. coli PaaE ortholog is
      an NADPH-preferring FAD reductase that reduces cytochrome c and drives
      the PaaABC oxygenase, and Q88HS9 carries the corresponding FAD-binding
      ferredoxin-reductase and NAD-binding domains. No GO term exists for the
      physiological electron transfer to the PaaA diiron site. This matches
      the E. coli PaaE review.
    proposed_replacement_terms:
    - id: GO:0016651
      label: oxidoreductase activity, acting on NAD(P)H
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        The PaaE subunit is a reductase with a preference for NADPH and FAD,
        capable of reducing cytochrome c
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      supporting_text: 'PROSITE; PS51384; FAD_FR'
    - reference_id: file:PSEPK/paaE/paaE-deep-research-openscientist.md
      supporting_text: >-
        an NAD(P)H:oxidoreductase carrying FAD and a [2Fe-2S] cluster that
        feeds electrons into the diiron oxygenase.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Correct cofactor-binding property ancillary to electron transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q88HS9 contains a ferredoxin-reductase-type FAD-binding domain and the
      E. coli ortholog prefers FAD as its flavin cofactor; cofactor binding is
      a component of the reductase activity captured as the core function.
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      supporting_text: 'PROSITE; PS51384; FAD_FR'
    - reference_id: PMID:21247899
      supporting_text: >-
        The measured activity was 8.5 times higher in the presence of NADPH
        than in the presence of NADH and 3 times higher in the presence of FAD
        than in the presence of FMN
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct but general; PaaE carries a plant-type [2Fe-2S] ferredoxin domain.
    action: MODIFY
    reason: >-
      Refine to the specific descendant GO:0051537 2 iron, 2 sulfur cluster
      binding, which this gene already carries. Q88HS9 matches the [2Fe-2S]
      ferredoxin signatures, and the E. coli ortholog shows a [2Fe-2S]
      ferredoxin-like absorption spectrum.
    proposed_replacement_terms:
    - id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      supporting_text: 'PROSITE; PS51085; 2FE2S_FER_2'
    - reference_id: PMID:21247899
      supporting_text: >-
        The spectrum with maxima at 325, 415, and 460 nm closely resembles
        that of spinach [2Fe-2S] ferredoxin
- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct specific cofactor-binding property.
    action: KEEP_AS_NON_CORE
    reason: >-
      PaaE contains a plant-type [2Fe-2S] ferredoxin domain (conserved
      cysteine signature PS00197), but cluster binding is ancillary to its
      reductase role in the epoxidase system.
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      supporting_text: 'PROSITE; PS00197; 2FE2S_FER_1'
    - reference_id: PMID:21247899
      supporting_text: >-
        The spectrum with maxima at 325, 415, and 460 nm closely resembles
        that of spinach [2Fe-2S] ferredoxin
- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: Correct activity at complex level, but overstates the isolated reductase subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PaaE transfers electrons to the PaaABC oxygenase components and is
      required for activity, but the epoxidation itself occurs at the PaaA
      diiron site. The enables qualifier overstates the isolated subunit; the
      core-function model records contribution to the assembled system, as
      in the E. coli PaaE review.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
    - reference_id: PMID:20660314
      supporting_text: >-
        PaaE likely functions as an iron-sulfur oxidoreductase transferring
        electrons from NADPH to the active center of the oxygenase complex
- term:
    id: GO:0062077
    label: phenylacetyl-CoA 1,2-epoxidase complex
  evidence_type: ISS
  original_reference_id: PMID:20660314
  qualifier: part_of
  review:
    summary: Missing complex membership for the reductase subunit.
    action: NEW
    reason: >-
      The Pseudomonas sp. Y2 PaaE ortholog copurified with tagged PaaA
      together with PaaB and PaaC, and PaaE is required for the
      NADPH-dependent reaction that defines the complex. In E. coli the
      PaaE-PaaABC interaction was not stable enough to survive pull-down, so
      the association may be transient.
    supported_by:
    - reference_id: PMID:20660314
      supporting_text: Subunits PaaB, PaaC, and PaaE copurified with PaaA
    - reference_id: PMID:21247899
      supporting_text: >-
        No evidence for the formation of a stable complex between PaaD or PaaE
        and other proteins (or their combinations) was found.
