suggested_questions:
- question: What is the physiological electron donor to KT2440 PaaE, and does it associate stably or transiently with PaaABC?
suggested_experiments:
- description: >-
    Purify Q88HS9, determine its flavin and Fe-S content, and compare electron
    transfer from NADPH and NADH to reconstituted PaaABC.
