    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Broad but valid molecular function for the electron-transfer subunit.
    action: ACCEPT
    reason: >-
      PaaE carries an FAD-binding FR-type domain, an NAD(P)-binding domain and a
      2Fe-2S ferredoxin-type domain (PROSITE PS51384, Pfam PF00175, PROSITE
      PS51085), the flavin-ferredoxin reductase architecture of an electron
      donor, and belongs to the PaaE family (TIGR02160). Support is domain and
      family classification, not a KT2440 assay. No more specific supported GO
      term was identified in this first pass.
    supported_by:
    - reference_id: file:PSEPK/paaE/paaE-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: "DR   PROSITE; PS51384; FAD_FR; 1."
