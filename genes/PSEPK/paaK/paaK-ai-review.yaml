  label: Pseudomonas putida KT2440
description: >-
  PaaK is the phenylacetate-CoA ligase of Pseudomonas putida KT2440, an
  adenylate-forming (ANL superfamily) enzyme of the phenylacetyl-CoA ligase
  family. It uses ATP and CoA to convert phenylacetate to phenylacetyl-CoA,
  the first step of the aerobic phenylacetate catabolic pathway.
