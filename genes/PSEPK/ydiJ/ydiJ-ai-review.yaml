        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Graft includes the E. coli YdiJ specificity donor. Direct negative ortholog lactate
          assay plus target D-2HG phenotype supersede the broad ancestral lactate substrate transfer.
