- term:
    id: GO:0004458
    label: D-lactate dehydrogenase (cytochrome) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: The characterized YdiJ source ortholog has a directly tested D-2-hydroxyglutarate-specific
      substrate profile.
    action: MODIFY
    reason: The frozen TG graft PTN001714929 lies below broad lactate IBD PTN000202298 but itself
      contains the characterized E. coli YdiJ P77748, in PTHR11748 SF119. PMID:36144368 purified
      E. coli and Pantoea YdiJ and found no D-lactate activity at 5-10 mM in PES/DCIP assays.
      Together with PP_4493 mutant D-2HG accumulation in PMID:31064836, this supports correcting
      the substrate inference to D-2HG. This is ortholog-specific negative substrate evidence,
      not merely a preferred alternative. The physiological electron acceptor remains unknown;
      FAD dependence alone would not exclude NAD or cytochrome as terminal acceptors. The exact
      Pseudomonas enzyme was not purified in these studies.
    proposed_replacement_terms:
    - id: GO:0051990
      label: (R)-2-hydroxyglutarate dehydrogenase activity
