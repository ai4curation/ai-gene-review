- term:
    id: GO:0009228
    label: thiamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Dxs directly supplies DXP to thiamine biosynthesis.
    action: ACCEPT
    reason: >-
      DXP is a shared branch-point metabolite used in both the MEP isoprenoid
      route and thiamine biosynthesis. The latter remains a core biological
      role of Dxs even though it lies outside this module boundary. The cited
      HAMAP-rule (MF_00315) FUNCTION and PATHWAY text establish only that Dxs
      catalyses DXP formation from pyruvate and glyceraldehyde 3-phosphate;
      the link to thiamine rests on DXP being the established precursor of
      the thiazole moiety of thiamine in bacteria (general biochemistry
      characterized in E. coli, not a KT2440 result, and no publication for
      it is cached here). The UniProt Thiamine biosynthesis keyword restates
      the annotation and is not cited. Dxs passes the participation test: it
      catalyses the reaction that forms DXP, a step of the bacterial thiazole
      branch (DXP is condensed by ThiG with the ThiS thiocarboxylate and
      dehydroglycine), rather than merely being required for it.
    supported_by:
    - reference_id: file:PSEPK/dxs/dxs-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        and 3 of pyruvate and glyceraldehyde 3-phosphate to yield 1-deoxy-D-
    - reference_id: file:PSEPK/dxs/dxs-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_00315; DXP_synth; 1."
    - reference_id: file:PSEPK/dxs/dxs-deep-research-openscientist.md
      supporting_text: >-
        feeds into three separate essential pathways for bacterial central
        metabolism: ThDP synthesis, pyridoxal phosphate (PLP) synthesis, and the
        MEP pathway for isoprenoid synthesis
- term:
    id: GO:0016114
    label: terpenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Dxs makes the precursor of the isoprenoid building blocks, not terpenoids themselves; the terpenoid process overstates its role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In the local GO release GO:0016114 terpenoid biosynthetic process is not
      an ancestor of GO:0019288 (the MEP-pathway IPP process is_a isopentenyl
      diphosphate biosynthetic process, under isoprenoid biosynthesis), so this
      is not a redundant parent but a different, downstream claim. Dxs forms
      DXP, which the MEP pathway converts to IPP and DMAPP; terpenoids
      (in KT2440 chiefly the polyprenyl side chain of ubiquinone-9) are built
      from those precursors by prenyltransferases several steps later. Dxs is
      upstream of, but performs no step of, terpenoid formation itself, and DXP
      also feeds thiamine biosynthesis. The row (UniRule-based combined IEA) is
      therefore an over-annotation; the correct pathway role is captured by the
      GO:0019288 row. Same action as for the other KT2440 MEP-pathway enzymes
      (ispE, ispF, ispG, ispH).
    supported_by:
    - reference_id: file:PSEPK/dxs/dxs-deep-research-openscientist.md
      supporting_text: >-
        This is the **first, committed, and rate-limiting step of the
        mevalonate-independent 2-C-methyl-D-erythritol-4-phosphate (MEP) pathway**
- term:
    id: GO:0016744
    label: transketolase or transaldolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: A true is_a ancestor of the specific DXP synthase activity already annotated, and therefore uninformative here.
    action: TOO_GENERAL
    reason: >-
      QuickGO places GO:0016744 on the is_a ancestor path of GO:0008661
      1-deoxy-D-xylulose-5-phosphate synthase activity, which is annotated on
      another row and carries the core call. The ancestor describes transfer of
      an aldehyde or ketonic group between compounds, which is exactly the
      acyloin condensation Dxs performs on pyruvate and glyceraldehyde
      3-phosphate, and UniProt places the protein in the transketolase family,
      DXPS subfamily. The term is true, but it is entailed by GO:0008661, which
      is asserted on the gene, so it adds nothing (TOO_GENERAL rather than an
      over-annotation).
    supported_by:
    - reference_id: file:PSEPK/dxs/dxs-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the transketolase family. DXPS subfamily.
