suggested_questions:
- question: >-
    How is DXP partitioned in P. putida KT2440 between the MEP pathway and
    thiazole (thiamine) synthesis, and does thiamine or ThDP availability feed
    back on Dxs activity or expression?
- question: >-
    Is dxs essential in KT2440 under all growth conditions, or can DXP
    shortage be bypassed by an alternative route (for example via
    1-deoxy-D-xylulose salvage)?
suggested_experiments:
- description: >-
    Purify KT2440 Dxs and measure kinetics with pyruvate and
    D-glyceraldehyde 3-phosphate, testing feedback inhibition by IPP/DMAPP as
    reported for plant DXS.
  experiment_type: enzyme kinetics
- description: >-
    Construct a conditional dxs depletion strain and quantify thiamine,
    pyridoxal phosphate and ubiquinone-9 levels, with and without
    1-deoxy-D-xylulose supplementation.
  experiment_type: conditional depletion and metabolite profiling
