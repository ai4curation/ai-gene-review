taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  dxs (PP_0527) encodes 1-deoxy-D-xylulose-5-phosphate synthase (DXS, EC
  2.2.1.7), a cytosolic, homodimeric, thiamine diphosphate- and Mg2+-dependent
  enzyme of the transketolase family (DXPS subfamily). It catalyses the
  decarboxylative acyloin condensation of pyruvate with D-glyceraldehyde
  3-phosphate to form 1-deoxy-D-xylulose 5-phosphate (DXP) and CO2. DXP is a
  branch-point metabolite: it is the first intermediate of the
  methylerythritol 4-phosphate (MEP) pathway, the sole route to the isoprenoid
  precursors isopentenyl and dimethylallyl diphosphate in P. putida, and it is
  also the five-carbon precursor condensed by ThiG into the thiazole moiety of
  thiamine (and, in bacteria with the PdxA/PdxJ route, pyridoxal phosphate).
