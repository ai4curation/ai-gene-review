id: Q88NB7
gene_symbol: rhlB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: RhlB is a DEAD-box RNA helicase that couples RNA-dependent ATP hydrolysis to unwinding of
  structured RNA during RNA degradation. RhlB-family proteins can associate with RNase E and PNPase, but
  the exact helicase composition of the KT2440 degradosome remains unresolved among several DEAD-box paralogs.
