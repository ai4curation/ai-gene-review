  qualifier: enables
  review:
    summary: Nucleic acid binding is correct but less specific than RNA binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: RhlB is an RNA-directed DEAD-box helicase and GO:0003723 captures its substrate class.
