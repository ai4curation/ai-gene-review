core_functions:
- description: Functions as an ATP-dependent DEAD-box RNA helicase, coupling ATP hydrolysis to unwinding
    of structured RNA during RNA catabolism. It is a candidate helicase partner of the KT2440 RNase E-centered
    degradosome, whose exact helicase composition remains unresolved.
