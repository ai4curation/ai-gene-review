  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Isoprenoid biosynthesis is correct but less specific than the MEP pathway term.
    action: MODIFY
    reason: >-
      True but general: GO:0019288 is a descendant of GO:0008299 and is already accepted on this gene. The HAMAP-rule
      pathway statement places Dxr in the DXP (MEP) pathway, so the row is refined to that term, as for the E. coli
      ortholog.
    supported_by:
