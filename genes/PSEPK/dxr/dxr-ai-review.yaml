- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Metal ion binding is correct but less specific than the magnesium and manganese binding the record describes.
    action: MODIFY
    reason: >-
      True but general. The HAMAP rule records either Mg2+ or Mn2+ as the active-site divalent cation, with the same
      rule-based evidence for both and no experiment on the P. putida enzyme to choose between them, so both
      descendants of GO:0046872 are proposed: GO:0000287 magnesium ion binding and GO:0030145 manganese ion binding
      (the latter already carried by this gene). The E. coli ortholog is refined to manganese binding alone because
      its manganese site was observed directly.
    supported_by:
    - reference_id: file:PSEPK/dxr/dxr-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=Mg(2+)
    - reference_id: file:PSEPK/dxr/dxr-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=Mn(2+)
    proposed_replacement_terms:
    - id: GO:0000287
      label: magnesium ion binding
    - id: GO:0030145
      label: manganese ion binding
- term:
    id: GO:0070402
    label: NADPH binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: NADPH binding is required mechanistic context for the reductive reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      NADPH is the physiological reductant, but the substrate-specific
      reductoisomerase term captures the core function.
    supported_by:
    - reference_id: file:PSEPK/dxr/dxr-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: NADPH-dependent rearrangement and reduction
