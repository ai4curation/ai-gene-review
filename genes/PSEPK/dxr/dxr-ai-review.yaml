      placement in KT2440.
  - statement: >-
      Detailed kinetics, structure, essentiality, localization, and inhibitor
      claims are ortholog-derived; the KT2440 engineering study establishes
      pathway use but is not a direct biochemical assay of Q88MH4 or an
      isolated dxr flux-control measurement.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      On-target provider report that correctly places Q88MH4 in the
      NADPH-dependent MEP-pathway reductoisomerase family; detailed kinetic,
      structural, essentiality, localization, and inhibitor statements are
      carried as the report's own ortholog-derived or inferred limitations
      rather than demonstrated KT2440 Dxr facts.
