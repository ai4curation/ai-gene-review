taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  PstB-like ATP-binding component encoded in the Pho-linked PP_5326-PP_5329
  phosphate-uptake locus. It is predicted to hydrolyze ATP to energize
  Pst-family phosphate transport through the separately encoded PP_5327/PP_5328
  permease pair; it is not assigned to the PP_2656-PP_2659 Pst-like complex.
existing_annotations:
