id: Q88C57
gene_symbol: pstB2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Second PstB-like ATP-binding component of the Pseudomonas putida phosphate
  uptake system. It is predicted to hydrolyze ATP to energize Pst-family
  phosphate transport. Its preferred membrane-partner assembly is not established,
  and assignment to the PP_2656-PP_2659 PstSACB1 complex remains provisional.
existing_annotations:
- term:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The phosphate-transporter assignment is supported at family level, but
      PstB2 contributes energy coupling rather than independently forming a transporter.
    action: MODIFY
    reason: >-
      Retain GO:0005315 with contributes_to rather than enables; the cognate
      membrane partner has not been established experimentally.
    proposed_replacement_terms:
    - id: GO:0005315
      label: phosphate transmembrane transporter activity
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct substrate binding but subordinate to ATP hydrolysis and energy coupling.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt predicts peripheral association with the inner membrane, but the
      specific membrane-transporter partner used by PstB2 remains unresolved.
    action: ACCEPT
- term:
    id: GO:0015415
    label: ATPase-coupled phosphate ion transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the predicted collective function of a Pst transporter containing
      PstB2, not an independently enabled activity of the ATPase subunit.
    action: MODIFY
    reason: >-
      Retain GO:0015415 with contributes_to rather than enables while leaving
      the cognate PstA/PstC-like partner unresolved.
    proposed_replacement_terms:
    - id: GO:0015415
      label: ATPase-coupled phosphate ion transmembrane transporter activity
- term:
