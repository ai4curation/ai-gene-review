- id: PMID:16232467
  title: Cloning and characterization of Pseudomonas putida genes encoding the phosphate-specific transport system.
  findings:
  - statement: >-
      A same-species PRS2000 study established PstSCAB-dependent phosphate
      uptake; transfer to the orthologous KT2440 PP_5326-PP_5329 locus remains
      a genomic-context inference rather than strain-direct evidence.
    supporting_text: >-
      The resultant mutant, designated PNT1, failed to take up 32Pi even under
      conditions of Pi limitation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Primary same-species evidence for PstSCAB-dependent phosphate uptake in
      PRS2000, not a direct experiment on KT2440 PstB2.
