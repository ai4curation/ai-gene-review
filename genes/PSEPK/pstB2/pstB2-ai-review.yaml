    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The phosphate-transporter assignment is supported at family level, but
      PstB2 contributes energy coupling rather than independently forming a transporter.
    action: MODIFY
    reason: >-
      Retain GO:0005315 with contributes_to rather than enables. PP_5327 and
      PP_5328 are the predicted cognate permeases, but this partnership has not
      been established experimentally in KT2440.
    proposed_replacement_terms:
    - id: GO:0005315
      label: phosphate transmembrane transporter activity
