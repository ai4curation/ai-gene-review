id: Q88J03
gene_symbol: ureE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  UreE is a cytoplasmic nickel-binding metallochaperone for urease maturation.
  It is inferred to supply metal to the UreD-UreF-UreG activation machinery for
  installation of the UreC dinickel active site; it is not a general protein-
  folding chaperone.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: UreE is a soluble cytoplasmic metallochaperone.
      action: ACCEPT
      reason: Cytoplasmic localization was demonstrated for the characterized bacterial ortholog (PMID:8318889) and is assigned by reviewed UniProt.
  - term:
      id: GO:0006457
      label: protein folding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: The InterPro mapping generalizes from chaperone-like architecture to protein folding.
      action: REMOVE
      reason: UreE is a nickel-binding maturation factor proposed to donate metal during metallocenter assembly; no evidence supports a general protein-folding role for Q88J03.
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Nickel binding is the direct molecular function of UreE.
      action: ACCEPT
      reason: Purified UreE binds nickel and functions in urease metallocenter assembly (PMID:8318889).
  - term:
      id: GO:0019627
      label: urea metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: UreE is required upstream of urease activity, but a more specific child process is available.
      action: MODIFY
      reason: UreE specifically supplies nickel for the enzyme responsible for urea catabolism; GO:0043419 is more informative than the broad urea metabolic parent.
      proposed_replacement_terms:
        - id: GO:0043419
          label: urea catabolic process
  - term:
      id: GO:0065003
      label: protein-containing complex assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: This generic assembly term obscures UreE's specific metallocenter-delivery role.
      action: REMOVE
      reason: UreE transfers nickel during metallocenter maturation but does not assemble the UreABC protein complex; transient interaction is insufficient for this generic assembly process.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
  - id: PMID:8318889
    title: 'Purification and characterization of Klebsiella aerogenes UreE protein: a nickel-binding protein that functions in urease metallocenter assembly.'
    findings:
      - statement: Purified UreE binds nickel and is proposed to donate it to urease apoprotein.
        supporting_text: >-
          We hypothesize that UreE binds intracellular nickel ion and functions
          as a nickel donor during metallocenter assembly into the urease apoprotein.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: 'Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation.'
  - id: file:PSEPK/ureE/ureE-uniprot.txt
    title: UniProtKB entry for PSEPK ureE (Q88J03)
  - id: file:PSEPK/ureE/ureE-goa.tsv
    title: QuickGO annotations for PSEPK ureE (Q88J03)
core_functions:
  - description: Nickel-binding metallochaperone inferred to supply metal for urease active-site maturation.
    molecular_function:
      id: GO:0016151
      label: nickel cation binding
    directly_involved_in:
      - id: GO:0043419
        label: urea catabolic process
    locations:
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - reference_id: PMID:8318889
        supporting_text: >-
          We hypothesize that UreE binds intracellular nickel ion and functions
          as a nickel donor during metallocenter assembly into the urease apoprotein.
proposed_new_terms:
  - proposed_name: urease metallocenter assembly
    proposed_definition: >-
      The assembly of the carbamylated dinickel catalytic center of urease in
      the preformed urease apoprotein.
    justification: >-
      UreD, UreE, UreF, and UreG act directly in urease activation, whereas
      GO:0043419 urea catabolic process describes the downstream reaction and
      GO:0065003 protein-containing complex assembly describes protein-subunit
      assembly rather than metallocenter maturation.
suggested_questions:
  - question: Does PSEPK UreE transfer nickel directly to UreG or to the UreDFG-apo-urease complex?
suggested_experiments:
  - hypothesis: Q88J03 transfers nickel through UreG to the UreDFG-bound UreABC apoprotein.
    description: Quantify nickel transfer among purified Q88J03, Q88J00, and UreDFG-bound apo-UreABC using metal-occupancy and activity assays.
    experiment_type: Metallochaperone transfer and urease activation assay
