id: Q88N56
gene_symbol: groES
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GroES (PP_1360) is the cytoplasmic Cpn10 co-chaperonin of
  Pseudomonas putida KT2440. Its conserved heptameric lid binds the GroEL ring
  and helps create an enclosed folding chamber, contributing to ATP-dependent
  protein folding by the assembled GroEL/GroES machinery. ATP turnover occurs in
  GroEL; GroES supplies the capping and allosteric cofactor function. Curated
  HAMAP function and GroES-specific domains support this role in KT2440, with
  detailed chamber dynamics inferred from characterized homologs.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The earlier GroES azido-ATP labeling result was challenged by
      direct equilibrium-binding and calorimetric experiments.
    action: UNDECIDED
    reason: The 1993 E. coli photolabeling report (PMID:7901771) was challenged
      by direct equilibrium-binding and calorimetric counter-assays
      (PMID:7867782). Those results establish a problem with treating the E.
      coli co-chaperonin as an ATP-binding protein, but they do not by
      themselves exclude ATP affinity in every homolog. No Q88N56 binding assay
      or source-specific reconstruction establishing how the InterPro mapping
      inherited the disproven claim was located. Retain uncertainty for KT2440;
      the supported core is GroEL binding and folding-cofactor activity, not
      intrinsic ATP binding.
    supported_by:
    - reference_id: PMID:7867782
      supporting_text: Using rigorous physical methods, isothermal calorimetry
        and equilibrium binding, no interaction between GroES and nucleotides
        could be detected.
