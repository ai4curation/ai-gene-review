    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: GroES-family metal binding has positive mycobacterial evidence, but
      its transfer to this target remains unresolved.
    action: UNDECIDED
    reason: PMID:11477217 demonstrates cation-dependent, EDTA-reversible changes
      in the Mycobacterium tuberculosis Cpn10 dome loop, and PMID:11807250
      identifies metal-binding sites in that loop. The PTHR10772 PAINT assertion
      GO:0046872 at PTN000080668 is an ancestral judgment, not a pairwise
      transfer invalidated by a short donor list. No target-specific loss or
      counter-assay was found. Absence of a curated metal site in this target
      record cannot establish absence of binding; conversely the exact
      coordination-site conservation and target affinity have not been
      established here. Keep the claim unresolved rather than assert it as a
      core function or reject it.
    supported_by:
    - reference_id: PMID:11807250
      supporting_text: The binding sites for metal ions in the dome loop of
        cpn10 have been identified, suggesting the role of metal ions in the
        stabilization of the protein.
