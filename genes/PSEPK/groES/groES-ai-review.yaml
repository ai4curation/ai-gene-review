core_functions:
- description: Conserved GroEL-binding co-chaperonin that supplies the lid and
    chamber remodeling needed for folding by the assembled ATP-dependent
    GroEL/GroES machine. The ATPase activity belongs to GroEL; KT2440 function
    is supported by curated HAMAP assignment and comparative biochemical
    mechanism.
