id: Q88CW9
gene_symbol: betT-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  betT-I (PP_5061) encodes a predicted multi-pass cytoplasmic-membrane choline
  transporter of the betaine/choline/carnitine transporter family. It is the
  BetT paralog adjacent and divergently oriented to the betIBA choline-oxidation
  operon. Comparative Pseudomonas evidence assigns BetT-I and BetT-III to
  choline uptake, whereas BetT-II is associated with glycine-betaine uptake;
  direct substrate kinetics for the KT2440 BetT-I protein have not been
  reported.
