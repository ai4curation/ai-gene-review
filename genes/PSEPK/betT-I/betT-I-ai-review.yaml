id: Q88CW9
gene_symbol: betT-I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  betT-I (PP_5061) encodes a predicted multi-pass cytoplasmic-membrane
  transporter of the betaine/choline/carnitine transporter family. It is the
  BetT paralog adjacent and divergently oriented to the betIBA choline-oxidation
  operon. Choline uptake is therefore a plausible substrate assignment, but
  direct transport measurements and checkable literature evidence that
  distinguish BetT-I from the other KT2440 BCCT paralogs are unavailable.
