id: Q88CW9
gene_symbol: betT-I
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: betT-I (PP_5061) encodes a predicted multipass inner-membrane BCCT-family transporter in
  Pseudomonas putida KT2440. Its position adjacent and divergent to the betIBA choline-oxidation operon
  makes choline uptake a plausible role, but its physiological cargo and coupling mechanism remain unresolved.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Predicted transmembrane helices and BCCT architecture support inner-membrane localization.
    action: ACCEPT
    reason: The target has twelve predicted transmembrane helices and BCCT-family signatures. Together
      with experimentally characterized bacterial BCCT topology, this supports an inner-membrane location
      by inference; the E. coli BetT experiment is comparative evidence, not a localization measurement
      on Q88CW9.
