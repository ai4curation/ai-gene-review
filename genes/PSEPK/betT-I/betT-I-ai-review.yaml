    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Twelve predicted transmembrane helices and the BBCT-family assignment support localization in the bacterial plasma membrane.
    action: ACCEPT
    reason: This is the appropriate specific location for the transporter.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Membrane localization is correct but redundant with the more specific plasma-membrane term.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005886 already captures the location at useful specificity.
- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The BCCT-family assignment and predicted membrane topology support transmembrane transporter activity.
    action: ACCEPT
    reason: >-
      Retain the substrate-neutral molecular function. The adjacent betIBA
      locus makes choline specificity plausible, but the available evidence
      does not justify replacing this term with GO:0015220.
- term:
