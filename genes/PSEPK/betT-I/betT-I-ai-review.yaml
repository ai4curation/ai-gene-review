      supporting_text: DR   InterPro; IPR000060; BCCT_transptr.
    - reference_id: PMID:17322201
      supporting_text: the predictions that BetT comprised 12 membrane-spanning regions and that its N-
        and C-terminal extensions of about 12 and 180 amino acid residues, respectively, were situated
        in the cytoplasm were confirmed
