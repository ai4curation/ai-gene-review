    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: A multi-pass BCCT-family transporter is appropriately annotated to transmembrane transport.
    action: ACCEPT
    reason: >-
      Retain the substrate-neutral process until direct or fully checkable
      evidence distinguishes the transported substrate.
