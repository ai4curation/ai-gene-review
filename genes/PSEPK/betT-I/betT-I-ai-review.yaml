- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The BCCT-family assignment and predicted membrane topology support transmembrane transporter
      activity.
    action: ACCEPT
    reason: The BCCT domain and multipass architecture support transmembrane transporter activity. BCCT
      family members can differ in cargo and coupling; a subfamily label or adjacency to betIBA does not
      by itself demonstrate choline transport by Q88CW9. No directly attributable target assay was established
      from the sources examined, so retain the substrate-neutral activity.
    supported_by:
