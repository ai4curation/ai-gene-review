- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The BCCT-family assignment and predicted membrane topology support transmembrane transporter activity.
    action: ACCEPT
    reason: >-
      Retain the substrate-neutral molecular function. The BCCT family (PTHR30047) and its SF7 subfamily,
      where BetT-I is classified, carry choline, glycine betaine, ectoine and trimethylamine. Adjacency
      to betIBA makes choline plausible but does not justify GO:0015220 without a transport assay. Term
      as precise as the evidence allows.
    supported_by:
    - *id002
