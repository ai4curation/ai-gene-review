taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  LpdG (PP_4187) is a class-I pyridine nucleotide-disulfide oxidoreductase with
  dihydrolipoyl dehydrogenase activity. It uses FAD and NAD+ to reoxidize
  protein-bound dihydrolipoyllysine, allowing it to serve as a shared E3 enzyme
  for lipoyl-dependent multienzyme systems. It is the KT2440 homolog of the P.
  putida LPD-glc enzyme used by pyruvate and 2-oxoglutarate dehydrogenases and
  by the glycine oxidation system.
