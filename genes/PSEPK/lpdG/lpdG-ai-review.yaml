  title: Asta deep-research retrieval for lpdG
  findings:
  - statement: Asta retrieval was run for this first-pass pathway curation; direct organism-specific literature was limited for several common enzyme names, so UniProt/family evidence carries the main review weight.
- id: file:PSEPK/lpdG/lpdG-deep-research-openscientist.md
  title: OpenScientist deep research report for lpdG
  findings:
  - statement: The report identifies LpdG as the KT2440 LPD-glc homolog while preserving the cross-strain evidence caveat.
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Useful locus-specific synthesis for treating Q88FB1 as the KT2440 LPD-glc
      homolog, but the direct P. putida lpdG/LPD-glc literature still requires
      transfer to the exact KT2440 locus by orthology and sucA-sucB-lpdG operon
      context.
- id: PMID:1902462
  title: Cloning and sequence analysis of the LPD-glc structural gene of Pseudomonas putida.
  findings:
  - statement: P. putida lpdG encodes LPD-glc, the E3 for pyruvate and 2-oxoglutarate dehydrogenases and the L-factor for glycine oxidation.
    supporting_text: >-
      LPD-glc, which is the E3 component of the pyruvate and 2-ketoglutarate
      dehydrogenase complexes and the L-factor for the glycine oxidation system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. putida lpdG evidence; transfer to the KT2440 ortholog is supported by conserved identity and operon context.
- id: PMID:6546487
  title: Oxidation of glycine by Pseudomonas putida requires a specific lipoamide dehydrogenase.
  findings:
  - statement: Biochemical tests distinguish LPD-glc as the E3 used for P. putida glycine oxidation rather than LPD-val.
    supporting_text: >-
      These results indicate that LPD-glc is specifically utilized for glycine
      oxidation in P. putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. putida biochemical evidence; the abstract does not identify the KT2440 strain.
