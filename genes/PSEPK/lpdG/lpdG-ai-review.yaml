id: Q88FB1
gene_symbol: lpdG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  LpdG (PP_4187) is a class-I pyridine nucleotide-disulfide oxidoreductase with
  dihydrolipoyl dehydrogenase activity. It uses FAD and NAD+ to reoxidize
  protein-bound dihydrolipoyllysine, allowing it to serve as a shared E3 enzyme
  for lipoyl-dependent multienzyme systems. Orthology and operon context support
  its assignment as the KT2440 counterpart of characterized P. putida LPD-glc,
  which serves pyruvate and 2-oxoglutarate dehydrogenases and the glycine
  oxidation system in the characterized strains. The glycine-cleavage role has
  not been tested directly in KT2440.
