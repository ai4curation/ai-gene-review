suggested_questions:
- question: Does KT2440 LpdG supply the glycine-cleavage L-protein activity in vivo, as predicted from the experimentally characterized P. putida LPD-glc enzyme?
- question: Should the Q88FB1 UniProt ARBA function text be corrected because it describes the branched-chain complex assigned to LpdV?
suggested_experiments:
- description: Compare glycine-dependent growth and native GCS activity across lpdG, lpd, and lpdV mutants, followed by biochemical complementation.
  experiment_type: genetics and enzyme-complex reconstitution
