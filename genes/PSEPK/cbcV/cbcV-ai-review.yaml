          supporting_text: PROSITE; PS00211; ABC_TRANSPORTER_1; 1.
  - term: {id: 'GO:0006970', label: response to osmotic stress}
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: Osmotic-stress involvement is possible but not the established role of CbcV.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Characterized Pseudomonas Cbc systems import quaternary amines for
        catabolism under low-osmolarity conditions; osmoprotection is not shown
        for this importer.
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: is required for the uptake of QACs under low-osmolarity conditions
  - term: {id: 'GO:0015220', label: choline transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Correct activity of the CbcX-CbcWV complex that CbcV belongs to; the
        enables qualifier should be contributes_to.
      action: ACCEPT
      reason: >-
        Choline transport is the right activity for the complex, which needs
        CbcW and the CbcX binding protein as well as the CbcV ATPase. The row is
        kept and the qualifier error recorded as a source defect, the
        convention used for the CbcW and CaiX (Q9HTH6) rows and for the BenB
        subunit in genes/ACIAD/benB.
      supported_by:
