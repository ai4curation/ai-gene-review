  review:
    summary: Osmotic-stress involvement is possible but not the established role of CbcV.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:19919675 distinguishes the low-osmolarity, catabolism-associated Cbc importer from
      osmoregulatory OpuC/BetT systems. The ARBA osmotic-stress claim exceeds the established function
      of this KT2440 ortholog; import of compatible solutes does not by itself demonstrate an osmotic
