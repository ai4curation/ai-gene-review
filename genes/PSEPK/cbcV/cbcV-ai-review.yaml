id: Q88R40
gene_symbol: cbcV
product_type: PROTEIN
aliases:
  - PP_0294
status: COMPLETE
taxon: {id: 'NCBITaxon:160488', label: "Pseudomonas putida KT2440"}
description: >-
  cbcV (PP_0294) encodes the cytoplasmic ATP-binding (nucleotide-binding
  domain) subunit of the modular Cbc ABC importer of Pseudomonas putida
  KT2440. With the CbcW permease it forms the shared core that, depending on
  which periplasmic binding protein docks (CbcX, BetX or CaiX), imports
  choline, glycine betaine or L-carnitine. CbcV hydrolyzes ATP to power
  translocation; substrate specificity comes from the binding proteins.
