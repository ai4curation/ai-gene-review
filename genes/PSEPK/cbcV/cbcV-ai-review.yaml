  label: Pseudomonas putida KT2440
description: CbcV (PP_0294) is the ATP-binding subunit of the predicted Cbc ABC importer in Pseudomonas
  putida KT2440. It has the conserved ABC nucleotide-binding architecture and is inferred to hydrolyze
  ATP to power the CbcW permease. Characterized Pseudomonas orthologs use this shared core with distinct
  periplasmic binding proteins for choline, glycine betaine or L-carnitine uptake; CaiX supplies
  the carnitine-recognition component. Direct transport or ATPase measurements for KT2440 CbcV were
  not identified.
