id: Q88R40
gene_symbol: cbcV
product_type: PROTEIN
status: DRAFT
taxon: {id: 'NCBITaxon:160488', label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)}
description: >-
  CbcV is the cytoplasmic ATP-coupling subunit of the modular Cbc ABC importer.
  Together with CbcW and interchangeable periplasmic receptors, it powers uptake
  of choline, glycine betaine, or L-carnitine.
existing_annotations:
  - term: {id: 'GO:0000166', label: nucleotide binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review: {summary: Correct but less informative than ATP binding and hydrolysis., action: KEEP_AS_NON_CORE, reason: CbcV is a canonical ABC ATPase.}
  - term: {id: 'GO:0005524', label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review: {summary: ATP binding is required by the CbcV nucleotide-binding domain., action: ACCEPT, reason: The protein is the ATP-binding subunit of the Cbc importer.}
  - term: {id: 'GO:0006970', label: response to osmotic stress}
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: Osmotic-stress involvement is possible but not the established core role of CbcV.
      action: MARK_AS_OVER_ANNOTATED
      reason: Characterized Cbc systems primarily import quaternary amines for catabolism under low-osmolarity conditions; osmoprotection is context dependent.
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: The Cbc transporter of Pseudomonas spp. is required for the uptake of QACs under low-osmolarity conditions
  - term: {id: 'GO:0015220', label: choline transmembrane transporter activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: CbcV contributes ATP coupling but cannot transport choline alone.
      action: REMOVE
      reason: Whole-complex activity requires CbcW and a substrate-binding protein.
  - term: {id: 'GO:0015220', label: choline transmembrane transporter activity}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: contributes_to
    review:
      summary: CbcV contributes ATP hydrolysis to choline transport by the Cbc complex.
      action: NEW
      reason: Experimental Pseudomonas work establishes CbcWV as the shared transporter core.
      supported_by:
        - reference_id: PMID:19919675
          supporting_text: >-
            The core transporter CbcWV also interacts with the carnitine-specific
            SBP CaiX (K(m), 24 microM) and the betaine-specific SBP BetX (K(m), 0.6 microM).
  - term: {id: 'GO:0015871', label: choline transport}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review: {summary: CbcV powers Cbc-dependent choline uptake., action: ACCEPT, reason: CbcWV is the experimentally established shared core for choline uptake.}
  - term: {id: 'GO:0016887', label: ATP hydrolysis activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP hydrolysis is the direct catalytic function of CbcV.
      action: ACCEPT
      reason: CbcV is the nucleotide-binding ATPase subunit of an ABC importer.
      supported_by:
        - reference_id: file:PSEPK/cbcV/cbcV-deep-research-openscientist.md
          supporting_text: cbcV encodes the ATP-hydrolyzing (nucleotide-binding) subunit
  - term: {id: 'GO:0055052', label: 'ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing'}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: part_of
    review: {summary: CbcV is the ATPase unit of a substrate-binding-protein-dependent ABC importer., action: ACCEPT, reason: CbcWV recruits interchangeable periplasmic binding proteins.}
  - term: {id: 'GO:0015226', label: carnitine transmembrane transporter activity}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: contributes_to
    review:
      summary: CbcV powers carnitine uptake when CbcWV is coupled to CaiX.
      action: NEW
      reason: CaiX supplies carnitine specificity to the shared CbcWV core.
      supported_by:
        - {reference_id: 'PMID:19919675', supporting_text: 'CaiX, a carnitine-specific binding protein, is required for Cbc-mediated uptake of L-carnitine'}
  - term: {id: 'GO:1902603', label: carnitine transmembrane transport}
    evidence_type: ISS
    original_reference_id: PMID:19919675
    qualifier: involved_in
    review: {summary: CbcV participates in CaiX-CbcWV carnitine import., action: NEW, reason: The shared core is required for carnitine uptake in characterized Pseudomonas systems.}
