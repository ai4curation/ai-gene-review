  - term: {id: 'GO:0005524', label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: ATP binding by the CbcV nucleotide-binding domain; subsidiary to ATP hydrolysis.
      action: KEEP_AS_NON_CORE
      reason: >-
        The ABC transporter signature establishes ATP binding; the term is as
        precise as warranted, but the core activity is ATP hydrolysis coupled to
