    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Correct but less specific than ATP binding, which is already on this gene.
      action: MODIFY
      reason: CbcV is an ABC ATPase whose nucleotide-binding domain binds ATP.
      proposed_replacement_terms:
        - {id: 'GO:0005524', label: ATP binding}
      supported_by:
        - reference_id: file:PSEPK/cbcV/cbcV-uniprot.txt
