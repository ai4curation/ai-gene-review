  review:
    summary: CbcV powers carnitine uptake when CbcWV is coupled to CaiX.
    action: NEW
    reason: CaiX supplies carnitine recognition and CbcV supplies ATP coupling in the shared CbcWV
      core. PMID:19919675 establishes this transport assembly with characterized Pseudomonas proteins,
      including heterologous uptake; KT2440 membership is inferred from conserved architecture and
      locus. Retain the historical proposal as a complex contribution, not autonomous transport.
    supported_by:
