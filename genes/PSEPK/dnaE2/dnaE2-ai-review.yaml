gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: DnaE2 (PP_3119, ImuC) is the specialized DNA polymerase of the LexA2-regulated ImuABC
  cassette in Pseudomonas putida KT2440. Curated DnaE2-family evidence supports DNA synthesis during
  lesion bypass rather than bulk chromosome replication. Native studies in PaW85, described as isogenic
  to KT2440, establish alkylation-damage tolerance and MMS-induced mutagenesis under defined temperature
  and repair-background conditions. Older stationary-phase and UV studies report antimutator effects.
  These outcomes are conditional; neither defines an invariant fidelity state for all lesions. Direct
  purified-target lesion specificity and proofreading activity remain unresolved.
