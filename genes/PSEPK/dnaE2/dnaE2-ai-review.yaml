      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: DNA repair is correct but insufficiently specific for the specialized damage-bypass polymerase.
      action: MODIFY
      reason: Error-prone translesion synthesis more accurately describes lesion bypass and mutagenesis than broad DNA repair.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
