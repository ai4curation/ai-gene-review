core_functions:
  - description: Performs specialized, error-prone DNA synthesis across or beyond damage-stalled replication intermediates with ImuA and ImuB.
    molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
        supporting_text: DR   InterPro; IPR023073; DnaE2.
    knowledge_gaps:
      - gap_statement: Q88I82 lesion specificity, fidelity, and dependence on Q88I84/Q88I83 have not been measured directly.
        significance: Family evidence establishes a mutagenic polymerase but not its exact KT2440 substrate spectrum or mutation signature.
proposed_new_terms: []
suggested_questions:
  - question: Which DNA lesions are bypassed by Q88I82, and what mutation spectrum does it generate?
suggested_experiments:
  - description: Reconstitute Q88I82 with Q88I83 and the beta clamp on defined damaged templates and compare damage survival and mutation spectra in cassette deletion strains.
