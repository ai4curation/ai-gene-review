id: Q88I82
gene_symbol: dnaE2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: DnaE2 (PP_3119) is the specialized error-prone DNA polymerase of the LexA2-regulated ImuA-ImuB-DnaE2 cassette. Following DNA damage, it performs damage-tolerant DNA synthesis with the ImuA and ImuB accessory proteins, promoting survival at the cost of increased mutagenesis; it is not the housekeeping chromosome-replication polymerase.
existing_annotations:
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: DNA-template binding is intrinsic to polymerase activity but this term is broad.
      action: KEEP_AS_NON_CORE
      reason: Retain as compatible context while using DNA-directed DNA polymerase activity as the core MF.
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Catalytic activity is true but uninformative for DnaE2.
      action: MARK_AS_OVER_ANNOTATED
      reason: The specific DNA-directed DNA polymerase term is separately present.
  - term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining catalytic activity of DnaE2.
      action: ACCEPT
      reason: Reviewed HAMAP MF_01902 assigns Q88I82 as EC 2.7.7.7 error-prone DNA polymerase.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          supporting_text: 'DE   RecName: Full=Error-prone DNA polymerase {ECO:0000255|HAMAP-Rule:MF_01902};'
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is consistent with action on the bacterial chromosome.
      action: KEEP_AS_NON_CORE
      reason: Valid but not defining and not based on direct KT2440 localization.
  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Generic DNA replication risks conflating DnaE2 with the housekeeping DnaE replicase.
      action: MARK_AS_OVER_ANNOTATED
      reason: DnaE2 performs inducible damage-bypass synthesis; error-prone translesion synthesis is the informative process.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: DnaE2 promotes damage tolerance but does not restore the original sequence faithfully.
      action: MODIFY
      reason: Error-prone translesion synthesis more accurately describes lesion bypass and mutagenesis than broad DNA repair.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: DnaE2 is induced and acts in response to DNA damage.
      action: KEEP_AS_NON_CORE
      reason: Correct context, while error-prone translesion synthesis captures the direct effector process.
  - term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The PHP-domain mapping suggests proofreading chemistry, but this conflicts with the defining error-prone role.
      action: UNDECIDED
      reason: No direct Q88I82 assay establishes an active 3'-5' exonuclease, and family-domain presence alone does not establish retained catalytic residues or physiological proofreading.
  - term:
      id: GO:0034061
      label: DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000116
    qualifier: enables
    review:
      summary: The broad polymerase term is valid but redundant with its DNA-directed child.
      action: KEEP_AS_NON_CORE
      reason: Retain as reaction-mapping context; GO:0003887 is the core MF.
  - term:
      id: GO:0071897
      label: DNA biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: DNA synthesis occurs, but the parent process lacks the damage-bypass context.
      action: KEEP_AS_NON_CORE
      reason: Valid parent term; error-prone translesion synthesis is substantially more informative.
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
    qualifier: involved_in
    review:
      summary: DnaE2 is the catalytic polymerase of the damage-induced lesion-bypass cassette.
      action: NEW
      reason: Reviewed HAMAP annotation explicitly assigns damage-induced mutagenesis and the exact gene lies in the LexA2-ImuA-ImuB cassette.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
