    findings:
      - statement: Reviewed HAMAP MF_01902 assigns Q88I82 as an error-prone DNA polymerase involved in damage-induced mutagenesis.
  - id: file:PSEPK/dnaE2/dnaE2-deep-research-openscientist.md
    title: OpenScientist research report for dnaE2 (Q88I82)
    findings:
      - statement: The report synthesizes DnaE2 catalytic, mutasome, and translesion-synthesis evidence.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        On-target provider report used only as synthesis-level support for the
        DnaE2 catalytic role; the review's physiological assertions are anchored
        to the Pseudomonas genetics papers and the UniProt/HAMAP entry.
  - id: PMID:17331811
    title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
    findings:
      - statement: P. putida DnaE2 has context-dependent mutation effects and can suppress base substitutions in starving cells.
        supporting_text: "it acted as an anti-mutator in accumulation of base substitution"
  - id: PMID:28118378
    title: DNA Polymerases ImuC and DinB Are Involved in DNA Alkylation Damage Tolerance in Pseudomonas aeruginosa and Pseudomonas putida.
    findings:
      - statement: P. putida DnaE2/ImuC contributes to tolerance of methylating DNA damage.
        supporting_text: "polymerases ImuC and DinB ensured a protective role against N- and O-methylation"
  - id: PMID:20615954
    title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis in Mycobacterium tuberculosis.
    findings:
      - statement: Catalytic-residue substitution establishes DnaE2 as the polymerase active component of the orthologous mutasome.
        supporting_text: "replacement of DnaE2 catalytic residues reproduces the dnaE2 gene"
core_functions:
  - description: >-
      Performs specialized DNA synthesis at damage-stalled replication
      intermediates with ImuA and ImuB; fidelity and mutation outcome are
      condition dependent in P. putida.
    molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
      - id: GO:0019985
        label: translesion synthesis
    supported_by:
      - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
        record_section: ["DR:InterPro"]
        supporting_text: DR   InterPro; IPR023073; DnaE2.
      - reference_id: PMID:28118378
        supporting_text: "polymerases ImuC and DinB ensured a protective role against N- and O-methylation"
      - reference_id: PMID:17331811
        supporting_text: "Pseudomonas putida ImuB and DnaE2 have"
    knowledge_gaps:
      - gap_statement: Q88I82 lesion specificity, fidelity, and the basis of its context-dependent mutation effects remain unresolved.
        significance: P. putida genetics establish physiological function but not the purified enzyme's lesion spectrum or mutation signature.
proposed_new_terms: []
suggested_questions:
  - question: Which DNA lesions are bypassed by Q88I82, and what mutation spectrum does it generate?
suggested_experiments:
  - description: Reconstitute Q88I82 with Q88I83 and the beta clamp on defined damaged templates and compare damage survival and mutation spectra in cassette deletion strains.
