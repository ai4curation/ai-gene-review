id: Q88I82
gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  DnaE2 (PP_3119; also called ImuC) is the specialized DNA polymerase of the
  LexA2-regulated ImuA-ImuB-DnaE2 cassette. It performs damage-tolerant DNA
  synthesis with ImuA and ImuB and is not the housekeeping chromosome
  replicase. P. putida experiments support a protective role during alkylation
  damage but show context-dependent mutation effects, including an
  anti-mutator effect on stationary-phase base substitutions.
existing_annotations:
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: DNA-template binding is intrinsic to polymerase activity but this term is broad.
      action: MODIFY
      reason: >-
        True but less specific than the evidence supports, and not an ancestor of
        the activity asserted as core: GO:0003887 has no is_a path to GO:0003676,
        so this is a refinement rather than a TOO_GENERAL case. The row is mapped
        from IPR004365, a generic OB-fold nucleic-acid-binding domain shared with
        tRNA-binding proteins, but this protein's curated activity is
        DNA-templated synthesis on a DNA primer-template, so DNA binding is the
        supported child term.
      proposed_replacement_terms:
        - id: GO:0003677
          label: DNA binding
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR004365; NA-bd_OB_tRNA.'
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Catalytic activity is true but uninformative for DnaE2.
      action: TOO_GENERAL
      reason: >-
        True of the protein but uninformative: GO:0003887, accepted in this
        review, is an is_a descendant of catalytic activity and so already
        entails it. The row was mapped from the PHP domain IPR004013, whose own
        candidate activity is judged unsupported here, but the root term itself
        is not a false claim, so TOO_GENERAL rather than over-annotation.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'DR   InterPro; IPR004013; PHP_dom.'
  - term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining catalytic activity of DnaE2.
      action: ACCEPT
      reason: >-
        HAMAP MF_01902 places Q88I82 in the DnaE2 subfamily of type-C DNA
        polymerases and its curated function statement describes a DNA
        polymerase acting in damage-induced mutagenesis; the activity is a
        family-rule inference, as the purified KT2440 enzyme has not been
        assayed.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: DNA polymerase involved in damage-induced mutagenesis and
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["DR:HAMAP"]
          supporting_text: 'DR   HAMAP; MF_01902; DNApol_error_prone; 1.'
        - reference_id: file:PSEPK/dnaE2/dnaE2-deep-research-openscientist.md
          supporting_text: >-
            Most bacteria replicate their chromosome with a single, essential
            replicative polymerase DnaE (the α catalytic subunit of DNA Pol
            III).
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasmic localization is consistent with action on the bacterial chromosome.
      action: KEEP_AS_NON_CORE
      reason: >-
        Correct and as precise as a bacterial cytoplasmic protein is annotated,
        but it comes from the HAMAP rule rather than any KT2440 localization
        experiment, and it is not what the gene is for.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_01902}.'
  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Generic DNA replication risks conflating DnaE2 with the housekeeping DnaE replicase.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Mapped from the alpha-subunit domains IPR004805 and IPR011708 that DnaE2
        shares with the replicative polymerase. The curated HAMAP function
        statement denies that role explicitly, and DnaE2 proteins lack the
        C-terminal region through which the replicative alpha subunit engages the
        clamp loader; damage-induced bypass synthesis is the real process.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'CC       translesion synthesis (TLS). It is not the major replicative DNA'
        - reference_id: PMID:20615954
          supporting_text: >-
            All major DNA polymerase IIIα structural/functional domains ( 23 , 24
            ) are readily identified in DnaE2, except for the very C-terminal
            region which in E. coli has been implicated in the interaction of α
            with the clamp-loader subunit, τ ( 28 , 29 ).
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: DNA repair is correct but insufficiently specific for the specialized damage-bypass polymerase.
      action: MODIFY
      reason: >-
        A UniRule transfer. P. putida genetics place DnaE2 in lesion tolerance
        rather than lesion removal, so translesion synthesis is the supported
        term. The mutagenic child term GO:0042276 is deliberately not used for
        this organism: KT2440 DnaE2 acts as an anti-mutator for stationary-phase
        base substitutions, so unlike the Caulobacter and mycobacterial
        orthologs its output is not established as error-prone.
      proposed_replacement_terms:
        - id: GO:0019985
          label: translesion synthesis
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
        - reference_id: PMID:17331811
          supporting_text: it acted as an anti-mutator in accumulation of base substitution
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: DnaE2 is induced and acts in response to DNA damage.
      action: TOO_GENERAL
      reason: >-
        The claim is true and independently supported: the cassette is a
        LexA-regulated, DNA-damage-inducible operon in this organism. It is
        nonetheless an is_a ancestor of GO:0019985, which this review asserts, so
        it adds nothing beyond it. (The row itself is an ARBA association rule,
        which is not evidence; the quote below is.)
      supported_by:
        - reference_id: PMID:15458417
          supporting_text: these genes constitute a DNA damage-inducible operon
  - term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The PHP-domain mapping suggests proofreading chemistry, but this conflicts with the defining error-prone role.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The term comes from the generic DnaE/PHP mappings IPR004805 and
        IPR011708, shared with the replicative polymerase. Published comparison
        of the PHP domains shows that DnaE1 retains every residue associated with
        exonuclease activity whereas they are absent in DnaE2, and a proofreading
        activity would sit awkwardly with the damage-tolerance role. No
        exonuclease assay exists for any DnaE2, so the activity is flagged as
        unsupported rather than asserted absent.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            The corresponding domain of Mtb DnaE1 retains all amino acids
            associated with exonuclease activity ( 34 – 36 ), whereas key
            residues are absent in DnaE2.
  - term:
      id: GO:0034061
      label: DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000116
    qualifier: enables
    review:
      summary: The broad polymerase term is valid but redundant with its DNA-directed child.
      action: TOO_GENERAL
      reason: >-
        GO:0003887, accepted here as the core molecular function, is an is_a
        child of DNA polymerase activity and entails it, so the parent term is
        true but carries no additional information.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: 'CC         diphosphate; Xref=Rhea:RHEA:22508, Rhea:RHEA-COMP:17339, Rhea:RHEA-'
  - term:
      id: GO:0071897
      label: DNA biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: DNA synthesis occurs, but the parent process lacks the damage-bypass context.
      action: TOO_GENERAL
      reason: >-
        A true is_a ancestor of GO:0019985, which is asserted separately in this
        review; translesion synthesis is substantially more informative, so this
        term adds nothing.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
  - term:
      id: GO:0019985
      label: translesion synthesis
    evidence_type: ISS
    original_reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
    qualifier: involved_in
    review:
      summary: DnaE2 is the catalytic polymerase of the damage-induced lesion-bypass cassette.
      action: NEW
      reason: Reviewed HAMAP annotation explicitly assigns damage-induced mutagenesis and the exact gene lies in the LexA2-ImuA-ImuB cassette.
      supported_by:
        - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
        - reference_id: PMID:28118378
          supporting_text: "polymerases ImuC and DinB ensured a protective role against N- and O-methylation"
