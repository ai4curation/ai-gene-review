    review:
      summary: Cytoplasmic localization is consistent with action on the bacterial chromosome.
      action: KEEP_AS_NON_CORE
      reason: Valid but not defining and not based on direct KT2440 localization.
  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Generic DNA replication risks conflating DnaE2 with the housekeeping DnaE replicase.
      action: MARK_AS_OVER_ANNOTATED
      reason: DnaE2 performs inducible damage-bypass synthesis; error-prone translesion synthesis is the informative process.
  - term:
