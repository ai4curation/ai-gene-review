        supporting_text: "replacement of DnaE2 catalytic residues reproduces the dnaE2 gene"
core_functions:
  - description: >-
      Performs specialized DNA synthesis at damage-stalled replication
      intermediates with ImuA and ImuB; fidelity and mutation outcome are
      condition dependent in P. putida.
    molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
