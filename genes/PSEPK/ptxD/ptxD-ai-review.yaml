id: Q88HI1
gene_symbol: ptxD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PP_3376 is named ptxD in the current record, but direct KT2440 genetics identify
  this kgu-locus protein as KguD, the 2-ketogluconate-6-phosphate reductase
  candidate that returns the pathway to 6-phosphogluconate. KEGG assigns K00032
  and EC 1.1.1.43. No direct evidence shows phosphite oxidation by Q88HI1, and
  purified target-protein biochemistry is still needed to confirm reaction and
  cofactor specificity.
existing_annotations:
  - term: {id: "GO:0005829", label: cytosol}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosolic localization is consistent with the intracellular KguK-KguD arm and absence of export features.
      action: ACCEPT
      reason: The localization is plausible and compatible with the pathway evidence.
  - term: {id: "GO:0016491", label: oxidoreductase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This generic term is consistent with a dehydrogenase but lacks reaction specificity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008114 is the appropriate pathway-grounded molecular function.
  - term: {id: "GO:0016616", label: "oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The broad chemistry is compatible with KguD but should be replaced by the specific EC 1.1.1.43 term.
      action: MODIFY
      reason: Direct locus genetics, pathway order, and KEGG K00032 support phosphogluconate 2-dehydrogenase activity more specifically.
      proposed_replacement_terms:
        - {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0016618", label: "hydroxypyruvate reductase [NAD(P)H] activity"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: This TreeGrafter transfer conflicts with the direct kgu-locus genetics and pathway assignment.
      action: REMOVE
      reason: There is no target-specific hydroxypyruvate-reductase evidence.
  - term: {id: "GO:0030267", label: glyoxylate reductase (NADPH) activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: This TreeGrafter transfer conflicts with the direct kgu-locus genetics and pathway assignment.
      action: REMOVE
      reason: There is no target-specific glyoxylate-reductase evidence.
  - term: {id: "GO:0050609", label: phosphonate dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: The EC mapping follows the legacy ptxD name; no direct Q88HI1 phosphite assay was found.
      action: REMOVE
      reason: Direct KT2440 genetics and kgu-locus context instead support a KguD role.
      supported_by:
        - reference_id: file:genes/PSEPK/ptxD/ptxD-deep-research-openscientist.md
          supporting_text: "dedicated literature searches for *P. putida* KT2440–specific phosphite oxidation / PP_3376 characterization returned **no direct studies**"
  - term: {id: "GO:0051287", label: NAD binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The generic NAD-binding term is inconsistent with the NADP-linked KguD reaction assignment.
      action: MODIFY
      reason: Replace it with NADP binding, while retaining the caveat that target-protein cofactor preference requires biochemical confirmation.
      proposed_replacement_terms:
        - {id: "GO:0050661", label: NADP binding}
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: IMP
    qualifier: involved_in
    review:
      summary: PP_3376 disruption and the ordered kgu pathway place this protein in the 2-ketogluconate loop.
      action: NEW
      reason: This process covers the intracellular phosphorylative use of 2-ketogluconate without misclassifying it as a non-phosphorylated reaction.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
