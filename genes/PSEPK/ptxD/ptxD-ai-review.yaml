core_functions:
  - description: >-
      KguD candidate enabling the NAD(P)-linked interconversion represented by
      EC 1.1.1.43, physiologically used in the reductive direction to form
      6-phosphogluconate in the 2-ketogluconate loop.
    molecular_function: {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
    directly_involved_in:
      - {id: "GO:0019521", label: D-gluconate metabolic process}
    supported_by:
      - reference_id: PMID:39770733
        supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
      - reference_id: PMID:29607620
        supporting_text: "kguT, kguK and kguD that form another operon with ptxS"
proposed_new_terms:
  - proposed_name: 2-dehydro-D-gluconate catabolic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the breakdown of
      2-dehydro-D-gluconate, including its conversion to 6-phospho-D-gluconate.
    justification: >-
      GO:0019521 covers D-gluconate generally but does not distinguish the
      phosphorylative 2-dehydro-D-gluconate pathway completed by KguD.
    proposed_parent: {id: "GO:0072329", label: monocarboxylic acid catabolic process}
suggested_questions:
  - question: Does purified Q88HI1 prefer 2-dehydro-6-phospho-D-gluconate/NADPH, and is any phosphite oxidation detectable?
suggested_experiments:
  - description: >-
      Compare purified Q88HI1 kinetics for the KguD reaction, glyoxylate,
      hydroxypyruvate and 2-ketogluconate reduction (NADPH and NADH), and
      phosphite/NAD+ oxidation, then complement a PP_3376 deletion and quantify
      pathway intermediates.
