id: Q88HI1
gene_symbol: ptxD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Kgu-locus oxidoreductase assigned as the KguD candidate that reduces
  2-dehydro-6-phospho-D-gluconate to 6-phospho-D-gluconate in the cytosolic arm
  of the 2-ketogluconate pathway. Its sequence classification and conserved
  locus context are consistent with EC 1.1.1.43.
existing_annotations:
  - term: {id: "GO:0005829", label: cytosol}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosolic localization is compatible with the intracellular KguK-KguD arm but is inherited from TreeGrafter rather than directly shown for Q88HI1.
      action: KEEP_AS_NON_CORE
      reason: Retain the plausible localization as ancillary; pathway order supports intracellular action but does not directly resolve cytosol versus broader cytoplasm.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "2KGA in the periplasmic space is transported into the cell by the 2KGA transporter KguT and phosphorylated into 2-keto-6-phosphogluconate by the 2-keto-6-phosphogluconate kinase KguK, which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0016491", label: oxidoreductase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This generic term is consistent with a dehydrogenase but lacks reaction specificity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008114 is the appropriate pathway-grounded molecular function.
  - term: {id: "GO:0016616", label: "oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The broad chemistry is compatible with KguD but should be replaced by the specific EC 1.1.1.43 term.
      action: MODIFY
      reason: Direct locus genetics and conserved pathway order support phosphogluconate 2-dehydrogenase activity more specifically.
      proposed_replacement_terms:
        - {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0016618", label: "hydroxypyruvate reductase [NAD(P)H] activity"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: This TreeGrafter transfer conflicts with the direct kgu-locus genetics and pathway assignment.
      action: REMOVE
      reason: There is no target-specific hydroxypyruvate-reductase evidence.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   GO; GO:0016618; F:hydroxypyruvate reductase [NAD(P)H] activity; IEA:TreeGrafter."
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0030267", label: glyoxylate reductase (NADPH) activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: This TreeGrafter transfer conflicts with the direct kgu-locus genetics and pathway assignment.
      action: REMOVE
      reason: There is no target-specific glyoxylate-reductase evidence.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   GO; GO:0030267; F:glyoxylate reductase (NADPH) activity; IEA:TreeGrafter."
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0050609", label: phosphonate dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: The EC mapping follows the legacy ptxD name; no direct Q88HI1 phosphite assay was found.
      action: REMOVE
      reason: >-
        The D-isomer-specific 2-hydroxyacid dehydrogenase fold is shared with
        genuine PtxD and does not discriminate the activities. Removal rests on
        the kgu-locus/pathway assignment and absence of a Q88HI1 phosphite assay.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-deep-research-openscientist.md
          supporting_text: "dedicated literature searches for *P. putida* KT2440–specific phosphite oxidation / PP_3376 characterization returned **no direct studies**"
  - term: {id: "GO:0051287", label: NAD binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The NAD-binding domain supports dinucleotide binding, but Q88HI1 cofactor preference is not established.
      action: KEEP_AS_NON_CORE
      reason: EC 1.1.1.43 is NAD(P)-dependent and InterPro IPR006140 supports an NAD-binding fold; retain this as ancillary pending target-protein cofactor measurements.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   InterPro; IPR006140; D-isomer_DH_NAD-bd."
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: PP_3376 disruption and the ordered kgu pathway place this protein in the 2-ketogluconate loop.
      action: NEW
      reason: This process covers the intracellular phosphorylative use of 2-ketogluconate without misclassifying it as a non-phosphorylated reaction.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
        - reference_id: PMID:29607620
          supporting_text: "kguT, kguK and kguD that form another operon with ptxS"
references:
  - {id: "GO_REF:0000002", title: Gene Ontology annotation through association of InterPro records with GO terms}
  - {id: "GO_REF:0000003", title: Gene Ontology annotation based on Enzyme Commission mapping}
  - {id: "GO_REF:0000117", title: Electronic Gene Ontology annotations created by ARBA machine learning models}
  - {id: "GO_REF:0000118", title: TreeGrafter-generated GO annotations}
  - id: PMID:17483213
    title: "Convergent peripheral pathways catalyze initial glucose catabolism in Pseudomonas putida: genomic and flux analysis."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Primary KT2440 pathway study; its cached abstract establishes the route, while the PP_3376 assignment was checked against the article and conserved kgu-locus context.
  - id: PMID:39770733
    title: Characterization and Transcriptional Regulation of the 2-Ketogluconate Utilization Operon in Pseudomonas plecoglossicida.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Primary Pseudomonas genetics and complementation support KguD participation and the ordered intracellular route.
  - id: PMID:29607620
    title: Regulation of carbohydrate degradation pathways in Pseudomonas involves a versatile set of transcriptional regulators.
    findings:
      - statement: Pseudomonas kguT, kguK, and kguD form a pathway operon with ptxS.
        supporting_text: "kguT, kguK and kguD that form another operon with ptxS"
        reference_section_type: LITERATURE_REVIEW
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full-text pathway synthesis independently places KguD after KguK in the Pseudomonas 2-ketogluconate route.
  - id: file:PSEPK/ptxD/ptxD-deep-research-openscientist.md
    title: OpenScientist retrieval report for Q88HI1
    reference_review:
      relevance: MEDIUM
      correctness: MISCITED
      review_notes: >-
        Useful for retrieving authentic phosphite-dehydrogenase literature, but
        its Q88HI1 conclusion transfers PtxD activity from other proteins without
        direct target evidence and misses the direct PP_3376 kguD genetics.
core_functions:
  - description: >-
      KguD candidate enabling the NAD(P)-linked interconversion represented by
      EC 1.1.1.43, physiologically used in the reductive direction to form
      6-phosphogluconate in the 2-ketogluconate loop.
    molecular_function: {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
    directly_involved_in:
      - {id: "GO:0019521", label: D-gluconate metabolic process}
    supported_by:
      - reference_id: PMID:39770733
        supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
      - reference_id: PMID:29607620
        supporting_text: "kguT, kguK and kguD that form another operon with ptxS"
proposed_new_terms:
  - proposed_name: 2-dehydro-D-gluconate catabolic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the breakdown of
      2-dehydro-D-gluconate, including its conversion to 6-phospho-D-gluconate.
    justification: >-
      GO:0019521 covers D-gluconate generally but does not distinguish the
      phosphorylative 2-dehydro-D-gluconate pathway completed by KguD.
    proposed_parent: {id: "GO:0072329", label: monocarboxylic acid catabolic process}
suggested_questions:
  - question: Does purified Q88HI1 prefer 2-dehydro-6-phospho-D-gluconate/NADPH, and is any phosphite oxidation detectable?
suggested_experiments:
  - description: >-
      Compare purified Q88HI1 kinetics for the KguD reaction and phosphite/NAD+
      oxidation, then complement a PP_3376 deletion and quantify pathway intermediates.
