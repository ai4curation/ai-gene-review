id: Q88HI1
gene_symbol: ptxD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Kgu-locus oxidoreductase assigned as the KguD candidate that reduces
  2-dehydro-6-phospho-D-gluconate to 6-phospho-D-gluconate in the cytosolic arm
  of the 2-ketogluconate pathway. It belongs to the GhrB-type
  glyoxylate/hydroxypyruvate reductase subfamily of D-isomer-specific
  2-hydroxyacid dehydrogenases, retains the family catalytic residues, and
  lacks the phosphite-binding lysine of true phosphite dehydrogenase PtxD, so
  the legacy ptxD name does not reflect its activity. Its conserved locus
  context is consistent with EC 1.1.1.43; whether it also reduces glyoxylate or
  hydroxypyruvate, as E. coli GhrB does, has not been measured.
existing_annotations:
  - term: {id: "GO:0005829", label: cytosol}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Cytosolic localization is compatible with the intracellular KguK-KguD arm but is inherited from TreeGrafter rather than directly shown for Q88HI1.
      action: KEEP_AS_NON_CORE
      reason: Retain the plausible localization as ancillary; pathway order supports intracellular action but does not directly resolve cytosol versus broader cytoplasm.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "2KGA in the periplasmic space is transported into the cell by the 2KGA transporter KguT and phosphorylated into 2-keto-6-phosphogluconate by the 2-keto-6-phosphogluconate kinase KguK, which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0016491", label: oxidoreductase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: This generic term is consistent with a dehydrogenase but lacks reaction specificity.
      action: MARK_AS_OVER_ANNOTATED
      reason: GO:0008114 is the appropriate pathway-grounded molecular function.
  - term: {id: "GO:0016616", label: "oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The broad chemistry is compatible with KguD but should be replaced by the specific EC 1.1.1.43 term.
      action: MODIFY
      reason: Direct locus genetics and conserved pathway order support phosphogluconate 2-dehydrogenase activity more specifically.
      proposed_replacement_terms:
        - {id: "GO:0008114", label: phosphogluconate 2-dehydrogenase activity}
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0016618", label: "hydroxypyruvate reductase [NAD(P)H] activity"}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: >-
        Unresolved. Q88HI1 has no experimentally determined substrate, and the
        KguD assignment used elsewhere in this review is itself an inference from
        kgu-locus context rather than biochemistry on this protein, so it does not
        exclude hydroxypyruvate reduction. Family members are commonly promiscuous
        across 2-oxoacid substrates; needs a Q88HI1 assay.
      action: UNDECIDED
      reason: >-
        Re-review: changed from REMOVE
        to UNDECIDED. The stated ground was only the absence of a target-specific
        assay, which is not by itself a refutation of a phylogenetic inference.
        Q88HI1 carries no experimentally determined substrate: UniProt gives only
        the EMBL-derived SubName "Phosphonate dehydrogenase" and the generic
        D-isomer specific 2-hydroxyacid dehydrogenase family (PANTHER
        PTHR10996:SF283 GLYOXYLATE/HYDROXYPYRUVATE REDUCTASE B, the node this
        term comes from), while the KguD assignment used in this review is itself
        an inference from kgu-locus context (PMID:29607620, PMID:39770733). Members
        of this family are commonly promiscuous across 2-oxoacid substrates, so
        GO:0016618 can be neither confirmed nor refuted without a Q88HI1 assay.
        The blinded OpenScientist control run (see the paired GO:0030267 row)
        recommended adding this term as the second half of a GhrB-type dual
        activity; its homology and active-site facts were reproduced locally,
        but it did not weigh the kgu-locus KguD context, so the row stays
        UNDECIDED.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   GO; GO:0016618; F:hydroxypyruvate reductase [NAD(P)H] activity; IEA:TreeGrafter."
        - reference_id: file:PSEPK/ptxD/ptxD-hypotheses/function-hypothesis-go-0030267/openscientist.md
          supporting_text: "keep GO:0030267 and also retain/add **GO:0016618** (hydroxypyruvate reductase). Both are consistent with the GhrB nearest neighbor."
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0030267", label: glyoxylate reductase (NADPH) activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: >-
        Still unresolved after the blinded OpenScientist control run. The run
        confirmed, and local re-alignment reproduced, that Q88HI1 is a
        catalytically intact GhrB-subfamily D-2-hydroxyacid dehydrogenase
        (about 53% identical to E. coli GhrB) and not a phosphite dehydrogenase,
        so the TreeGrafter placement is sound. But the run did not consider the
        kgu-locus context, in which PP_3376 is the KguD 2-keto-6-phosphogluconate
        reductase; glyoxylate reduction may be a side activity of the
        subfamily-wide active site, but it has never been measured for Q88HI1.
      action: UNDECIDED
      reason: >-
        Re-reviewed against the OpenScientist control report, which recommended
        retaining GO:0030267 and adding GO:0016618 on the grounds that the
        nearest characterized homolog is E. coli GhrB (P37666). Verified in this
        re-review: a BLOSUM62 global alignment gives 53.1% identity of Q88HI1
        to GhrB, 40.0% to human GRHPR and 38.4% to phosphite dehydrogenase PtxD
        (O69054); the PtxD phosphite-pocket Lys76 aligns to Val75 in Q88HI1,
        while the Arg237/Glu266/His285 triad and the GMGRIG Rossmann motif at
        position 152 are present. The report's claim of a PtxD Trp314 was not
        reproduced (O69054 position 314 is Gln). These facts rule out the
        pseudo-enzyme and mis-placement failure modes, and they support removal
        of GO:0050609. They do not settle the substrate. The run was blinded to
        gene context, and KEGG places PP_3376 (K00032, EC 1.1.1.43) immediately
        downstream of kguT (PP_3377), kguK (PP_3378) and kguE (PP_3379) beside
        ptxS (PP_3380), the kgu operon whose KguD member reduces
        2-keto-6-phosphogluconate (PMID:39770733). GhrB itself is promiscuous
        (UniProt P37666 also lists 2-ketogluconate reductase, EC 1.1.1.215), so
        a 2-ketoaldonate reductase physiological role and a glyoxylate side
        activity are both plausible for this subfamily, but nothing measured on
        Q88HI1 or a KguD ortholog shows glyoxylate reduction. The analyses agree
        on the facts and differ on interpretation; the deciding experiment is a
        substrate panel (2-keto-6-phosphogluconate, glyoxylate, hydroxypyruvate,
        2-ketogluconate) with NADPH and NADH on purified Q88HI1.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   GO; GO:0030267; F:glyoxylate reductase (NADPH) activity; IEA:TreeGrafter."
        - reference_id: file:PSEPK/ptxD/ptxD-hypotheses/function-hypothesis-go-0030267/openscientist.md
          supporting_text: "By independent global pairwise alignment the 320-aa query is **53.4% identical to the biochemically characterized *E. coli* GhrB**"
        - reference_id: file:PSEPK/ptxD/ptxD-hypotheses/function-hypothesis-go-0030267/openscientist.md
          supporting_text: "All conclusions rest on sequence/structure homology; no direct enzymology exists for the *P. putida* protein."
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
  - term: {id: "GO:0050609", label: phosphonate dehydrogenase activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    review:
      summary: The EC mapping follows the legacy ptxD name; no direct Q88HI1 phosphite assay was found.
      action: REMOVE
      reason: >-
        The D-isomer-specific 2-hydroxyacid dehydrogenase fold is shared with
        genuine PtxD and does not discriminate the activities. Removal rests on
        the kgu-locus/pathway assignment and absence of a Q88HI1 phosphite assay,
        and is now reinforced by the blinded OpenScientist control run, whose
        key residue finding was reproduced locally: the PtxD phosphite-binding
        Lys76 aligns to Val75 in Q88HI1, and Q88HI1 is far closer to GhrB (53%)
        than to characterized PtxD O69054 (38%). The ptxD symbol and EC 1.20.1.1
        come only from the EMBL submitter name.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-hypotheses/function-hypothesis-go-0030267/openscientist.md
          supporting_text: "The query **lacks PtxD's distinctive phosphite-binding residues**"
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DE   SubName: Full=Phosphonate dehydrogenase {ECO:0000313|EMBL:AAN68980.1};"
        - reference_id: file:PSEPK/ptxD/ptxD-deep-research-openscientist.md
          supporting_text: "dedicated literature searches for *P. putida* KT2440–specific phosphite oxidation / PP_3376 characterization returned **no direct studies**"
  - term: {id: "GO:0051287", label: NAD binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: The NAD-binding domain supports dinucleotide binding, but Q88HI1 cofactor preference is not established.
      action: KEEP_AS_NON_CORE
      reason: EC 1.1.1.43 is NAD(P)-dependent and InterPro IPR006140 supports an NAD-binding fold; retain this as ancillary pending target-protein cofactor measurements.
      supported_by:
        - reference_id: file:PSEPK/ptxD/ptxD-uniprot.txt
          supporting_text: "DR   InterPro; IPR006140; D-isomer_DH_NAD-bd."
  - term: {id: "GO:0019521", label: D-gluconate metabolic process}
    evidence_type: ISS
    qualifier: involved_in
    review:
      summary: PP_3376 disruption and the ordered kgu pathway place this protein in the 2-ketogluconate loop.
      action: NEW
      reason: This process covers the intracellular phosphorylative use of 2-ketogluconate without misclassifying it as a non-phosphorylated reaction.
      supported_by:
        - reference_id: PMID:39770733
          supporting_text: "which is then reduced to 6-phosphogluconate by the 2-keto-6-phosphogluconate reductase KguD"
        - reference_id: PMID:29607620
          supporting_text: "kguT, kguK and kguD that form another operon with ptxS"
