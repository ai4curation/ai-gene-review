- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The ETF-QO family architecture includes a C-terminal iron-sulfur-binding
      region, and the protein is predicted to bind one [4Fe-4S] cluster.
    action: KEEP_AS_NON_CORE
    reason: >-
      Iron-sulfur cluster binding is correct but less specific than the
