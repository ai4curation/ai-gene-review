- id: file:PSEPK/PP_4203/PP_4203-deep-research-openscientist.md
  title: OpenScientist deep research report for PSEPK PP_4203 (Q88F95)
  findings:
  - statement: >-
      Localization of PP_4203 to the cytoplasmic membrane and its monotopic
      topology are transferred from ortholog structures and are not supported by
      any direct measurement on the P. putida protein.
    supporting_text: there is no direct topological/proteomic membrane-localization
      datum for PP_4203
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Machine-generated report; used here only for its explicit statement of what
      is inferred rather than measured. Its citations were spot-checked against
      PubMed: PMID:24794972 and PMID:20937244 resolve as described, but
      PMID:42239388 is a 2026 bioRxiv preprint and PMID:18625020 is about
      Pseudomonas aeruginosa, not P. putida, so neither is cited in this review.
      See PP_4203-notes.md.
