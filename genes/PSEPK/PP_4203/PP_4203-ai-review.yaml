id: Q88F95
gene_symbol: PP_4203
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Electron-transfer flavoprotein-ubiquinone oxidoreductase (ETF-QO; EC
  1.5.5.1). This FAD- and [4Fe-4S]-containing oxidoreductase accepts electrons
  directly from reduced electron-transfer flavoprotein and reduces ubiquinone,
  connecting ETF-dependent dehydrogenation reactions to the respiratory
  electron-transport chain. The available record supports the ETF-to-quinone
  reaction but does not identify the upstream substrate dehydrogenases.
existing_annotations:
- term:
    id: GO:0004174
    label: electron-transferring-flavoprotein dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_4203 is assigned the defining ETF-QO reaction: oxidation of reduced
      ETF coupled to reduction of ubiquinone.
    action: ACCEPT
    reason: >-
      The term is a direct molecular function of this single-chain enzyme and
      is supported by the ETF-QO-specific family, EC 1.5.5.1, and RHEA:24052
      assignments in the UniProt record.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      ARBA predicts a generic cytoplasmic localization for PP_4203.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ETF-QO transfers electrons to ubiquinone at the respiratory membrane.
      A generic cytoplasm term omits that functional membrane association and
      is not supported by an explicit localization statement in the local
      record.
- term:
    id: GO:0022900
    label: electron transport chain
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      PP_4203 transfers electrons from reduced ETF into the ubiquinone pool.
    action: ACCEPT
    reason: >-
      This is the direct pathway consequence of the enzyme's defined
      ETF:ubiquinone oxidoreductase reaction and is appropriately represented
      as involvement in an electron-transport chain.
- term:
    id: GO:0022904
    label: respiratory electron transport chain
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Reduction of respiratory ubiquinone by PP_4203 feeds ETF-derived
      electrons into the respiratory electron-transport chain.
    action: ACCEPT
    reason: >-
      The process annotation follows directly from the accepted ETF-QO
      molecular function and correctly describes the respiratory destination
      of the transferred electrons.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      The ETF-QO family architecture includes a C-terminal iron-sulfur-binding
      region, and the protein is predicted to bind one [4Fe-4S] cluster.
    action: KEEP_AS_NON_CORE
    reason: >-
      Iron-sulfur cluster binding is correct but less specific than the
      accompanying 4 iron, 4 sulfur cluster binding annotation.
- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      PP_4203 is predicted by the ETF-QO family rule to bind one [4Fe-4S]
      cluster used in intramolecular electron transfer.
    action: ACCEPT
    reason: >-
      This is a direct cofactor-binding property supported by the conserved
      ETF-QO/FixX iron-sulfur domain and the UniRule cofactor assignment.
