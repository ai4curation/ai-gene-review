- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      PP_4203 is predicted by the ETF-QO family rule to bind one [4Fe-4S]
      cluster used in intramolecular electron transfer.
    action: ACCEPT
    reason: >-
      This is a direct cofactor-binding property supported by the conserved
      ETF-QO/FixX iron-sulfur domain and the UniRule cofactor assignment.
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: ISS
  original_reference_id: file:PSEPK/PP_4203/PP_4203-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      GOA captures the [4Fe-4S] cofactor of PP_4203 but not its FAD, even though
      the UniProt record asserts both from the same RuleBase rule (RU366068) and
      the flavin is the catalytically decisive centre: in the ortholog structures
      it is the FAD, not the cluster, that reduces the quinone. Propose adding
      the FAD-binding term.
    action: NEW
    reason: >-
      FAD binding is a direct cofactor-binding property of this polypeptide, not
      a pathway-level inference, and it is asserted in the local UniProt record
      by the same rule that produced the already-annotated GO:0051539. The
      stoichiometry is conserved across the characterized orthologs, including
      the bacterial Rhodobacter sphaeroides enzyme, which each contain one FAD
      and one [4Fe-4S] cluster (PMID:18037314). The paralogous ETF alpha subunit
      etfA already carries GO:0050660 in GOA, so this is a gap in the electronic
      annotation of PP_4203 rather than a new biological claim.
    supported_by:
    - reference_id: file:PSEPK/PP_4203/PP_4203-uniprot.txt
      supporting_text: Name=FAD; Xref=ChEBI:CHEBI:57692;
    - reference_id: PMID:18037314
      supporting_text: sphaeroides ETF-QO each contain a single [4Fe-4S](2+,1+) cluster
        and one equivalent of FAD
