- term:
    id: GO:0022904
    label: respiratory electron transport chain
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Reduction of respiratory ubiquinone by PP_4203 feeds ETF-derived
      electrons into the respiratory electron-transport chain.
    action: ACCEPT
    reason: >-
      The process annotation follows directly from the accepted ETF-QO
