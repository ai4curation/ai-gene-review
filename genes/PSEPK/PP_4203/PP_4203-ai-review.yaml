- id: PMID:17050691
  title: Structure of electron transfer flavoprotein-ubiquinone oxidoreductase and electron
    transfer to the mitochondrial ubiquinone pool.
  findings:
  - statement: >-
      The pig-liver ETF-QO crystal structure shows a single structural domain
      carrying the FAD-, 4Fe4S- and ubiquinone-binding regions, and establishes
      that the enzyme is a monotopic integral membrane protein rather than a
      soluble one.
    supporting_text: is a monotopic integral membrane protein
  - statement: >-
      The flavin, not the iron-sulfur cluster, is the immediate electron donor to
      ubiquinone.
    supporting_text: the very similar redox potentials of FAD and the cluster strongly
      suggest that the flavin, not the cluster, transfers electrons to UQ
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Zhang, Frerman & Kim, PNAS 2006). Structural work on the
      pig-liver enzyme, transferred to PP_4203 on the basis of shared ETF-QO
      domain architecture; the localization and topology claims for PP_4203 are
      therefore inferred from this ortholog, not measured.
- id: PMID:18037314
  title: Electron spin relaxation enhancement measurements of interspin distances in
    human, porcine, and Rhodobacter electron transfer flavoprotein-ubiquinone oxidoreductase
    (ETF-QO).
  findings:
  - statement: >-
      Human, porcine and Rhodobacter sphaeroides ETF-QO each carry one FAD and one
      [4Fe-4S] cluster, so the cofactor stoichiometry is conserved from bacteria
      to mammals.
    supporting_text: sphaeroides ETF-QO each contain a single [4Fe-4S](2+,1+) cluster
      and one equivalent of FAD
  - statement: ETF-QO is a membrane-bound protein linking flavoprotein dehydrogenases
      to the respiratory chain.
    supporting_text: membrane-bound electron transfer protein that links primary flavoprotein
      dehydrogenases with the main respiratory chain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Fielding et al., J Magn Reson 2008). Includes the
      bacterial R. sphaeroides enzyme alongside the mammalian ones, which is what
      makes the one-FAD/one-cluster stoichiometry usable for a bacterial ETF-QO.
