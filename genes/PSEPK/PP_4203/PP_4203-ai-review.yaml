taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  Electron-transfer flavoprotein-ubiquinone oxidoreductase (ETF-QO; EC
  1.5.5.1). This FAD- and [4Fe-4S]-containing oxidoreductase accepts electrons
  directly from reduced electron-transfer flavoprotein and reduces ubiquinone,
  connecting ETF-dependent dehydrogenation reactions to the respiratory
  electron-transport chain. Because ETF can only be reoxidised by ETF-QO, the
  enzyme is the single obligatory return path for electrons collected by the
  organism's flavoprotein dehydrogenases, notably the acyl-CoA dehydrogenases of
  fatty-acid beta-oxidation and of branched-chain amino-acid and isovalerate
  catabolism. In the mammalian and Rhodobacter orthologs the protein is a
  single-domain monotopic integral membrane protein in which the FAD, rather
  than the iron-sulfur cluster, is the immediate electron donor to the quinone;
  the bacterial enzyme is correspondingly expected at the cytoplasmic membrane.
existing_annotations:
- term:
    id: GO:0004174
    label: electron-transferring-flavoprotein dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PP_4203 is assigned the defining ETF-QO reaction: oxidation of reduced
      ETF coupled to reduction of ubiquinone.
    action: ACCEPT
    reason: >-
      The term is a direct molecular function of this single-chain enzyme and
      is supported by the ETF-QO-specific family, EC 1.5.5.1, and RHEA:24052
      assignments in the UniProt record.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      ARBA predicts a generic cytoplasmic localization for PP_4203, but ETF-QO
      is a membrane protein: it reduces the membrane quinone pool, and the
      characterized orthologs are monotopic integral membrane proteins. The
      bacterial equivalent of the mitochondrial inner membrane is the plasma
      (cytoplasmic) membrane, GO:0005886.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    reason: >-
      The substrate of this enzyme is a membrane-embedded quinone, so a soluble
      cytoplasmic assignment is not merely imprecise but misplaces the activity.
      The pig-liver crystal structure shows ETF-QO is a monotopic integral
      membrane protein with a hydrophobic membrane-binding plateau
      (PMID:17050691), and the enzyme is described as membrane-bound across
      human, porcine and Rhodobacter sphaeroides forms (PMID:18037314), the last
      of which is bacterial. PP_4203 shares the full ETF-QO domain architecture
      including the ubiquinone-binding and FixX-type C-terminal regions.
      GO:0005886 carries "cytoplasmic membrane" and "bacterial inner membrane"
      as exact synonyms and is the correct target for a bacterial monotopic
      membrane flavoenzyme. MODIFY rather than MARK_AS_OVER_ANNOTATED is used so
      the gene retains a cellular-component term; note that the localization is
      inferred from the orthologs and from the quinone substrate, not measured
      for PP_4203, which has no SUBCELLULAR LOCATION line or Membrane keyword in
      its UniProt record.
    supported_by:
    - reference_id: PMID:17050691
      supporting_text: is a monotopic integral membrane protein
    - reference_id: PMID:18037314
      supporting_text: membrane-bound electron transfer protein that links primary flavoprotein
        dehydrogenases with the main respiratory chain
    - reference_id: file:PSEPK/PP_4203/PP_4203-deep-research-openscientist.md
      supporting_text: Subcellular localization is at the cytoplasmic membrane (the
        bacterial equivalent of the mitochondrial inner membrane)
    knowledge_gaps:
    - gap_statement: >-
        Whether PP_4203 is in fact membrane-associated in Pseudomonas putida is
        undetermined; the cytoplasmic-membrane assignment is transferred from
        ortholog structures rather than measured.
      boundary: >-
        The catalytic assignment is secure (EC 1.5.5.1, RHEA:24052, full ETF-QO
        domain architecture including the ubiquinone-binding and FixX-type
        C-terminal regions), and the pig-liver and Rhodobacter sphaeroides
        orthologs are established monotopic integral membrane proteins.
      gap_kind:
      - BIOLOGY
      dark_aspect: CC_DARK
      resolution: >-
        Cell fractionation with immunoblot, or a fluorescent fusion, to confirm
        cytoplasmic-membrane association and monotopic topology for Q88F95.
      provenance:
      - reference_id: file:PSEPK/PP_4203/PP_4203-deep-research-openscientist.md
        supporting_text: there is no direct topological/proteomic membrane-localization
          datum for PP_4203
- term:
    id: GO:0022900
    label: electron transport chain
