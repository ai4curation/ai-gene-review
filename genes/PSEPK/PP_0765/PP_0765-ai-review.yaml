description: >-
  PP_0765 is a 628-residue DUF1302 (PF06980) family protein with a cleavable N-terminal
  signal peptide (residues 1-29) and a predicted 18-stranded outer membrane beta-barrel.
  It is encoded 25 bp upstream of, and on the same strand as, PP_0766, which encodes a
  DUF1329 protein with a LolA/LolB/LppX-like fold; the two genes very likely form an
  operon, and a medium-chain fatty acid-CoA ligase gene lies immediately upstream. Its
  molecular function is unknown. In genome-wide transposon fitness assays in KT2440,
  PP_0765 and PP_0766 mutants grow poorly specifically when long-chain fatty acid esters
  (Tween 20, butyl stearate) are the sole carbon source. The published hypothesis that the
  pair act as esterases has not been tested, and a structure-prediction study instead
  models PP_0765 as an outer membrane beta-barrel that, with periplasmic PP_0766 and the
  RND-family inner membrane protein PP_2019, forms a transport system for an unidentified
  hydrophobic substrate. The 77%-identical Pseudomonas aeruginosa orthologue PA3923 is an
  outer membrane protein whose recombinant form binds human laminin in vitro and whose
  transposon mutants adhere less to laminin and form less biofilm on laminin-coated
  surfaces. This host-matrix binding has not been examined in P. putida, a soil
  saprophyte, and the UniProt name "Adhesin" is a machine-generated (ProtNLM) label. A
  paralogous DUF1302/DUF1329 pair, PP_2042/PP_2043, is about 50% identical to
  PP_0765/PP_0766.
