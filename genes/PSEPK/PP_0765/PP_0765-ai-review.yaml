references:
- id: PMID:31796854
  title: Pseudomonas aeruginosa uses multiple receptors for adherence to laminin during infection of the respiratory tract and skin wounds.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Characterizes the P. aeruginosa orthologue PA3923 (76.9% identical to PP_0765) as
      one of several outer membrane proteins that bind human laminin-111 in vitro
      (biolayer interferometry KD 6.9 nM), with reduced laminin adherence of a transposon
      mutant. The same assay found laminin binding by porins (OprD, OprG), an esterase
      autotransporter (EstA) and an ABC substrate-binding protein (Paf), all via the
      heparin-binding LG4/LG5 domains, so the binding is not diagnostic of a dedicated
      adhesin. P. putida was not studied.
  findings:
  - statement: PA3923 was identified in the outer membrane of P. aeruginosa as a high-affinity laminin-binding protein.
    supporting_text: Four new high-affinity laminin receptors were identified in the outer membrane; EstA, OprD, OprG and PA3923.
  - statement: Laminin binding by all tested P. aeruginosa outer membrane proteins, including porins, maps to the heparin-binding LG4/LG5 domains.
    supporting_text: All bacterial receptors bound to the heparin-binding domains on LG4 and LG5 of the laminin alpha chain as assessed with truncated laminin fragments, transmission electron microscopy and inhibition by heparin.
  - statement: The authors describe PA3923 as a hypothetical protein of unknown cellular function.
    supporting_text: The P. aeruginosa protein derived from gene PA3923 is a previously hypothetical protein with unknown function in the bacterial cell.
- id: PMID:33758032
  title: GAUGE-Annotated Microbial Transcriptomic Data Facilitate Parallel Mining and High-Throughput Reanalysis To Form Data-Driven Hypotheses.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Transcriptomic co-regulation of PA3923 with biofilm genes in P. aeruginosa and a biofilm defect of PA3923 transposon mutants on laminin-coated plates. Orthologue only; not a molecular function.
  findings:
  - statement: PA3923 transposon mutants in P. aeruginosa PA14 form less biofilm on a laminin-coated surface.
    supporting_text: Experimental evidence suggests that PA3923 mediates biofilm on laminin-coated surfaces.
- id: PMID:32826213
  title: 'Fatty Acid and Alcohol Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon Sequencing.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the KT2440 fitness data. Only the abstract could be read
      programmatically. The preprint (bioRxiv 10.1101/2020.07.04.188060), read through a
      web-fetch summary, names PP_0765 and PP_0766 among the genes with severe fitness
      defects specific to Tween 20 versus laurate and to butyl stearate versus myristate,
      and offers the esterase idea only as a hypothesis alongside an envelope-export
      alternative. Those preprint statements are not quoted here.
  findings:
  - statement: Fitness profiling led the authors to hypothesize, without testing, that DUF1302/DUF1329 proteins are esterases.
    supporting_text: Fitness data from mutant pools grown on fatty acids of varying chain lengths indicated specific enzyme substrate preferences and enabled us to hypothesize that DUF1302/DUF1329 family proteins potentially function as esterases.
- id: PMID:38306398
  title: 'Foldy: An open-source web application for interactive protein structure analysis.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: AlphaFold-based case study of PP_0765/PP_0766 with PP_2018/PP_2019. Prediction only; contact probabilities between PP_0765 and PP_0766 are described as weak.
  findings:
  - statement: PP_0765 is predicted to be an outer membrane beta-barrel that contacts periplasmic PP_0766.
    supporting_text: PP_0766 is predicted to interact with both PP_2019 and PP_0765, which, along with PP_0765’s distinctive transmembrane beta barrel structure, suggest that PP_0766 may be localized to the periplasm, and PP_0765 may be localized to the outer membrane (Fig 4).
  - statement: The authors propose a transport system rather than a hydrolase.
    supporting_text: Altogether this suggests that PP_0765 and PP_0766, which were previously suspected of being involved in hydrolase activity [19], may actually be components of a novel transport system.
  - statement: The fitness partners are a periplasmic BNR-domain protein and an RND-family transporter required for growth on Tween 20.
    supporting_text: 'Prior RB-TnSeq experiments show the function of PP_0765 and PP_0766 correlates with two other genes which are essential for growth on Tween20: a periplasmic protein (PP_2018) and a multidrug efflux transporter (PP_2019) [19].'
- id: PMID:42605071
  title: 'ECLIPSE: exploring the dark proteome of ESKAPE pathogens through the sequence similarity network of the Protein Universe Atlas.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Computational; places DUF1302 in a beta-barrel fold with no solved structure and notes co-localization with a LuxR-type regulator in P. aeruginosa.
  findings:
  - statement: DUF1302 is a structurally uncharacterized beta-barrel fold family.
    supporting_text: Structural characterization of one of the top-ranked ESKAPE-enriched dark components revealed that it belongs to the beta-barrel fold DUF1302 (PF06980) family, for which no experimentally solved three-dimensional structure exists in the PDB.
