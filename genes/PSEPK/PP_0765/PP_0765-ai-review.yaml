  review:
    summary: PP_0765 is predicted to be an integral outer membrane beta-barrel protein, and its 77%-identical P. aeruginosa orthologue PA3923 was isolated from the outer membrane fraction.
    action: NEW
    reason: >-
      GOA holds no annotation for Q88PT3. Three independent lines agree on outer
      membrane residence. First, DeepTMHMM on the dashboard query (98.7% identical to
      Q88PT3 over all 628 residues) predicts a cleavable signal peptide followed by an
      18-stranded beta-barrel and no alpha-helical transmembrane segment. Second, the
      Pfam family description classes DUF1302 as predicted outer membrane beta-barrel
      proteins. Third, PA3923, 76.9% identical over 624 aligned residues, was among the
      laminin-binding proteins identified in purified outer membrane preparations of
      P. aeruginosa PAO1 (PMID:31796854). The ISS is to that orthologue; the
      topology prediction on PP_0765 itself is consistent with it.
    supported_by:
