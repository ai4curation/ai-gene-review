core_functions:
- description: >-
    Outer membrane beta-barrel protein of unknown molecular function, operonic with the
    periplasmic DUF1329 protein PP_0766 and required with it for growth on long-chain
    fatty acid esters (Tween 20, butyl stearate) but not the corresponding free fatty
    acids. Whether it acts in ester hydrolysis, ester or fatty acid uptake, or export of an
    envelope component is unresolved; laminin binding shown for the P. aeruginosa
    orthologue in vitro is not established as its physiological role.
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:31796854
    supporting_text: Four new high-affinity laminin receptors were identified in the outer membrane; EstA, OprD, OprG and PA3923.
  - reference_id: PMID:38306398
    supporting_text: Altogether this suggests that PP_0765 and PP_0766, which were previously suspected of being involved in hydrolase activity [19], may actually be components of a novel transport system.
  - reference_id: file:PSEPK/PP_0765/PP_0765-dashboard-prediction-evidence/dashboard_call.json
    supporting_text: 'Fitness (log-change abundance): -4.064'
suggested_questions:
- question: Is PP_0765 needed to hydrolyse, import, or gain access to fatty acid esters, or to export an envelope component whose loss blocks ester use?
- question: Does the PP_0765/PP_0766 pair work with PP_2018 (BNR) and PP_2019 (RND/MMPL) as one envelope-spanning system, and how does it differ in substrate from the paralogous PP_2042/PP_2043 pair?
- question: Is laminin binding by the P. aeruginosa orthologue a specific property of DUF1302 proteins, or the same heparin-binding-domain interaction seen for porins in that assay?
suggested_experiments:
- description: Grow clean PP_0765 and PP_0766 deletion mutants, with complementation, in monoculture on Tween 20, butyl stearate, laurate and stearate, and measure extracellular esterase activity and ester uptake.
  experiment_type: targeted genetics and physiology
- description: Confirm outer membrane localization of PP_0765 by sucrose-gradient fractionation and heat-modifiability, and test co-purification or crosslinking with PP_0766 and PP_2019.
  experiment_type: localization and interaction
