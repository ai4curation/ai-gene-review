description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_NBWA01000007.1_52 is "Putative laminin-binding outer membrane adhesin of the DUF1302
  family" (tier A), with three GO terms: GO:0043236 laminin binding, GO:0007155 cell
  adhesion and GO:0019867 outer membrane. The exact-sequence UniProt entries are deleted,
  so the call is scored on the KT2440 reference-proteome entry Q88PT3 (PP_0765), 98.7%
  identical over all 628 residues. The outer membrane location is well supported: an
  18-stranded beta-barrel is predicted on the query, the Pfam family is described as
  predicted outer membrane beta-barrels, and the 76.9%-identical P. aeruginosa orthologue
  PA3923 was isolated from outer membranes. GOA is empty, so that term is correct and
  novel. The laminin-binding and adhesion terms rest on one chain of transfer: recombinant
  PA3923 binds human laminin in vitro and a PA3923 transposon mutant adheres less to
  laminin and forms less biofilm on laminin-coated plates (PMID:31796854, PMID:33758032),
  and the Fitness Browser curator then renamed PP_0765 "putative adhesin" on that basis.
  Nothing in P. putida, a soil saprophyte, links PP_0765 to laminin or to adhesion, and in
  the same P. aeruginosa assay porins and an ABC substrate-binding protein bound laminin
  just as tightly through its heparin-binding domains, so the in vitro binding is not
  diagnostic of a dedicated adhesin. The only KT2440 phenotype, which the annotator saw
  and set aside, is a strong and specific fitness defect on the fatty acid esters
  Tween 20 and butyl stearate, shared with the operon partner PP_0766. The published
  interpretations of that phenotype are an untested esterase hypothesis (PMID:32826213)
  and a predicted envelope transport system (PMID:38306398). The two orthologue-derived
  terms are therefore scored UNC rather than incorrect, since nothing refutes them, but
  they do not describe the protein's demonstrated role in KT2440.
