  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The adhesion evidence is a reduced adherence of a P. aeruginosa PA3923 transposon
      mutant to immobilized laminin (PMID:31796854) and reduced biofilm on laminin-coated
      plates (PMID:33758032), both with a mammalian matrix substrate. There is no adhesion,
      attachment or biofilm phenotype for PP_0765 in P. putida; its strongest KT2440
      fitness phenotype is a specific defect on Tween 20 and butyl stearate as carbon
      sources. Nothing refutes a contribution to adhesion, so UNC rather than an incorrect
      category; the missing evidence is any attachment or biofilm assay of a P. putida
      DUF1302 mutant.
