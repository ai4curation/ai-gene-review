- id: PMID:31796854
  title: Pseudomonas aeruginosa uses multiple receptors for adherence to laminin during infection of the respiratory tract and skin wounds.
  findings:
  - statement: PA3923 is one of several P. aeruginosa outer membrane proteins that bind laminin.
    supporting_text: Four new high-affinity laminin receptors were identified in the outer membrane; EstA, OprD, OprG and PA3923.
  - statement: All of these proteins bind the heparin-binding domains of laminin.
    supporting_text: All bacterial receptors bound to the heparin-binding domains on LG4 and LG5 of the laminin alpha chain as assessed with truncated laminin fragments, transmission electron microscopy and inhibition by heparin.
- id: PMID:33758032
  title: GAUGE-Annotated Microbial Transcriptomic Data Facilitate Parallel Mining and High-Throughput Reanalysis To Form Data-Driven Hypotheses.
  findings:
  - statement: PA3923 mutants form less biofilm on laminin-coated surfaces.
    supporting_text: Experimental evidence suggests that PA3923 mediates biofilm on laminin-coated surfaces.
- id: PMID:32826213
  title: 'Fatty Acid and Alcohol Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon Sequencing.'
  findings:
  - statement: The KT2440 fitness study proposes an untested esterase role for DUF1302/DUF1329 proteins.
    supporting_text: Fitness data from mutant pools grown on fatty acids of varying chain lengths indicated specific enzyme substrate preferences and enabled us to hypothesize that DUF1302/DUF1329 family proteins potentially function as esterases.
- id: PMID:38306398
  title: 'Foldy: An open-source web application for interactive protein structure analysis.'
  findings:
  - statement: Structure prediction places PP_0765 in the outer membrane as part of a putative transport system.
    supporting_text: Altogether this suggests that PP_0765 and PP_0766, which were previously suspected of being involved in hydrolase activity [19], may actually be components of a novel transport system.
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0043236
    label: laminin binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Laminin binding has been measured only for the 76.9%-identical P. aeruginosa
      orthologue PA3923, as recombinant protein binding human laminin-111 in vitro
      (PMID:31796854). Orthologue transfer at that identity is reasonable for a physical
      property, so the term is not refuted. But it is not a demonstrated or plausible
      physiological function of a soil saprophyte's outer membrane protein: the same assay
      found equally tight laminin binding by porins and an ABC substrate-binding protein,
      all through the heparin-binding LG4/LG5 domains, which suggests a generic
      polycationic-site interaction rather than a dedicated receptor. No P. putida protein
      has been tested. The term was carried into the call through the Fitness Browser
      "putative adhesin" reannotation, which is itself a transfer from PA3923, so the
      apparent corroboration is not independent. The KT2440 fitness data point to a role in
      fatty acid ester utilization instead (PMID:32826213).
    supported_by:
    - reference_id: PMID:31796854
      supporting_text: All bacterial receptors bound to the heparin-binding domains on LG4 and LG5 of the laminin alpha chain as assessed with truncated laminin fragments, transmission electron microscopy and inhibition by heparin.
