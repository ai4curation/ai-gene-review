    summary: >-
      Correct and novel (GOA for Q88PT3 is empty). DeepTMHMM predicts a cleavable signal
      peptide and an 18-stranded beta-barrel on the query, the Pfam DUF1302 description
      classes the family as predicted outer membrane beta-barrels, and the 76.9%-identical
      orthologue PA3923 was identified in purified P. aeruginosa outer membranes
      (PMID:31796854). The companion review uses the more specific GO:0009279 cell outer
      membrane; GO:0019867 is its parent and is not wrong. A structure-prediction study
      independently places PP_0765 in the outer membrane (PMID:38306398).
