id: Q88HR9
gene_symbol: paaF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  PaaF is a crotonase-superfamily enoyl-CoA hydratase in the aerobic
  phenylacetate degradation pathway of Pseudomonas putida KT2440. By
  orthology to the Pseudomonas sp. Y2 and E. coli enzymes, it hydrates
  2,3-dehydroadipyl-CoA to 3-hydroxyadipyl-CoA in the beta-oxidation-like
  lower segment of the pathway after aromatic-ring opening, and may form a
  hetero-oligomeric complex with the PaaG isomerase.
