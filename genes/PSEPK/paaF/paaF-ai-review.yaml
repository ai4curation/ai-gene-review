        superfamily** (EC 4.2.1.17)
- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Likely family-level over-annotation rather than the physiological pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The rejection is
      retained on substrate grounds, not merely because the source is a family
      transfer. GO:0006635 is defined as the process that "results in the
      complete oxidation of a long-chain fatty acid" through successive
      two-carbon shortenings. PaaF is encoded inside the phenylacetate (paa)
      catabolic locus and acts on the CoA-thioester of a short dicarboxylic
      enoyl intermediate generated by ring opening of phenylacetyl-CoA, which is
      not a long-chain fatty acid; KT2440 encodes a separate fad complement for
      genuine fatty-acid beta-oxidation. The chemistry is beta-oxidation-like
      but the pathway is aromatic catabolism, so the term attributes more than
      the evidence supports. Marked over-annotated rather than removed, because
      crotonase-superfamily hydratases can show broad acyl-CoA tolerance and no
      experiment excludes a minor contribution.
    supported_by:
    - reference_id: file:PSEPK/paaF/paaF-deep-research-openscientist.md
      supporting_text: >-
        The physiological substrate is the CoA-thioester of a short
        **dicarboxylic** enoyl intermediate produced by ring opening of
        phenylacetyl-CoA — not generic long-chain fatty enoyl-CoAs.
