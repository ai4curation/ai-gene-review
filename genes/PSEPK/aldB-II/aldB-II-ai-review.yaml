core_functions:
- description: NAD+-dependent aldehyde dehydrogenase of the Ped alcohol-oxidation cluster, oxidizing alcohol-derived
    aldehydes to carboxylates; by orthology to P. putida U PedI most likely phenylacetaldehyde in 2-phenylethanol
    catabolism, and proposed to oxidize glycolaldehyde in the KT2440 ethylene glycol response. No substrate has been
    assayed on the KT2440 protein.
