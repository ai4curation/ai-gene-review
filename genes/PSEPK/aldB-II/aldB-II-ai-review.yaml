    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: NAD+-dependent aldehyde dehydrogenase activity matches the protein's aldehyde dehydrogenase
      family membership (Pfam Aldedh, the PROSITE catalytic-cysteine signature, NCBIfam ExaC-type
      acetaldehyde dehydrogenase) and its orthology to the PedI and ExaC pathway aldehyde dehydrogenases.
    action: ACCEPT
    reason: The EC-mapping row supports aldehyde dehydrogenase (NAD+) activity and nothing narrower. A
      phenylacetaldehyde-specific term (GO:0008957) rests on orthology to P. putida U PedI and has not been
      assayed on the KT2440 protein, and the KT2440 ethylene glycol work implicates glycolaldehyde as well,
      so this row is kept at the level its evidence reaches. An earlier duplicate review of this protein
      (folder pedI, merged here) proposed MODIFY to GO:0008957; the substrate question is recorded under
      suggested_questions instead.
    supported_by:
    - reference_id: file:PSEPK/aldB-II/aldB-II-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "DR   Pfam; PF00171; Aldedh; 1."
    - reference_id: file:PSEPK/aldB-II/aldB-II-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: "DR   PROSITE; PS00070; ALDEHYDE_DEHYDR_CYS; 1."
    - reference_id: PMID:23023748
      supporting_text: In addition to the upregulation of proteins involved in the degradation of glyoxylic
        acid, our proteome analysis of ethylene glycol-induced cells of KT2440 and JM37 revealed the upregulation
        of the two PQQ-dependent ADHs PedE and PedH, as well as that of the NADH-dependent ALDHs PedI and PP_0545.
- term:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: NAD(P)+-dependent aldehyde dehydrogenase activity is the parent of the NAD+-specific term and is
      true of the protein, but it is less specific than GO:0004029, which the same family evidence supports.
    action: KEEP_AS_NON_CORE
    reason: The ARBA prediction is correct but broader than the NAD+-specific activity accepted above; it is
      kept as a supporting annotation rather than the functional summary. The merged duplicate review (pedI)
      had marked it over-annotated; it is not wrong, so it is kept.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: oxidoreductase activity is a high-level parent of aldehyde dehydrogenase activity and adds no
      information once that activity is annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The annotation is not false, but it is far less informative than the specific aldehyde
      dehydrogenase activity already present. Both earlier reviews of this protein agreed.
- term:
    id: GO:0046185
    label: aldehyde catabolic process
  evidence_type: ISS
  review:
    summary: PP_2680 is the aldehyde dehydrogenase of a conserved aldehyde-oxidation module downstream of
      alcohol oxidation. In P. putida U the Ped pathway oxidizes 2-phenylethanol to phenylacetic acid via
      phenylacetaldehyde, and in KT2440 PedI is induced in the ethylene glycol response, where PedI and PP_0545
      are proposed to oxidize glycolaldehyde.
    action: NEW
    reason: The enzyme catalyses the oxidation step of these pathways, so a process term capturing aldehyde
      catabolism is warranted. It is broader and safer than naming any one aldehyde as the KT2440 substrate.
    supported_by:
    - reference_id: PMID:18177365
      supporting_text: for its oxidation to phenylacetic acid via phenylacetaldehyde.
    - reference_id: PMID:23023748
      supporting_text: In KT2440, this pathway is initiated by the PQQ-dependent ADHs PedE and PedH and the
        ALDHs PedI and PP_0545 producing glyoxylic acid via the intermediates glycolaldehyde and glycolic acid
