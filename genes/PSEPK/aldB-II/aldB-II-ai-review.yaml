taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: aldB-II (PP_2680, also called PedI) encodes an NAD+-dependent aldehyde dehydrogenase
  of the aldehyde dehydrogenase superfamily that oxidizes aldehydes to carboxylates. PP_2680 sits at
  the end of the KT2440 Ped alcohol-oxidation cluster (PP_2664-PP_2680) and is 97% identical to PedI
  of Pseudomonas putida U and 88% identical to ExaC of Pseudomonas aeruginosa, the aldehyde
  dehydrogenases downstream of the PQQ-dependent alcohol dehydrogenases in those pathways. By that
  orthology it most likely oxidizes phenylacetaldehyde to phenylacetate in 2-phenylethanol catabolism.
  In KT2440 it is induced with the PQQ-dependent alcohol dehydrogenases PedE and PedH during growth on
  ethylene glycol, where it and PP_0545 are proposed to oxidize glycolaldehyde toward glyoxylate. No
  substrate has been assayed on the KT2440 protein.
existing_annotations:
