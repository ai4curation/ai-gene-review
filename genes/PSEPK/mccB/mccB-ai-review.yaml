description: MccB is the carboxyltransferase beta subunit of bacterial 3-methylcrotonyl-CoA carboxylase.
  It accepts a carboxyl group from MccA-bound carboxybiotin and transfers it to 3-methylcrotonyl-CoA,
  forming 3-methylglutaconyl-CoA in distal L-leucine catabolism.
