id: Q88DU1
gene_symbol: grpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GrpE is a dimeric nucleotide-exchange factor for the DnaK chaperone. Its helical dimer and
  DnaK-binding domain promote release of bound adenyl nucleotides, enabling ATP rebinding and repeated
  cycles of client capture and release. It cooperates with DnaK and DnaJ in protein folding and recovery
  from protein stress.
existing_annotations:
- term:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the defining molecular function of GrpE - it is the nucleotide exchange factor for
      DnaK (Hsp70), promoting ADP release so that ATP can rebind. The annotation is from InterPro (IPR000740,
      the GrpE family signature) plus PANTHER and is fully consistent with the UniProt FUNCTION statement
      and the entire GrpE literature.
    action: ACCEPT
    reason: Curated HAMAP MF_01151 and the GrpE domain architecture independently support the DnaK nucleotide-exchange
      role. E. coli biochemistry directly separates exchange from ATP hydrolysis (PMID:1826368); the assignment
      to KT2440 is comparative, without a target-specific kinetic measurement.
    supported_by:
    - reference_id: file:PSEPK/grpE/grpE-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: GrpE releases ADP from DnaK; ATP binding to DnaK triggers the release of the substrate
        protein
    - reference_id: PMID:1826368
      supporting_text: The presence of GrpE alone increases the rate of release of bound ATP or ADP without
        affecting the rate of hydrolysis.
    - reference_id: file:PSEPK/grpE/grpE-deep-research-falcon.md
      supporting_text: member of the conserved **GrpE family**.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: GrpE is a soluble cytosolic DnaK cofactor.
    action: MODIFY
    reason: The existing TreeGrafter cytosol assertion is retained as a conserved bacterial GrpE inference,
      supported by the target family architecture and characterized E. coli GrpE. The cached PAINT tree
      lacks a Q88DU1 leaf, so exact target descent from PTN008575294 was not established. Target curated
      cytoplasmic localization is compatible but not alone compartment-resolving. Cytosol is retained
      as an explicitly phylogenetic inference, not as a result of the purified nucleotide-exchange assay.
      The loss tool could not assess this target lineage; no negative or positive node placement is invented.
      Refine the true broader cytoplasm term to this supported descendant already present in the review;
      an existing descendant is a reason to refine rather than create another annotation.
    proposed_replacement_terms:
