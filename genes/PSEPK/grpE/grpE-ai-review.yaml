id: Q88DU1
gene_symbol: grpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GrpE is the cytoplasmic nucleotide-exchange cofactor of the DnaK Hsp70
  chaperone in Pseudomonas putida KT2440. It forms a homodimer and binds DnaK to
  accelerate ADP release, allowing ATP rebinding and client release during protein
  folding. Its GrpE family architecture supports this conserved role in the DnaK-DnaJ-GrpE
  cycle; kinetic and structural details are established primarily in other experimentally
  characterized bacterial systems.
existing_annotations:
- term:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the defining molecular function of GrpE - it is the nucleotide
      exchange factor for DnaK (Hsp70), promoting ADP release so that ATP can rebind. The
      annotation is from InterPro (IPR000740, the GrpE family signature) plus PANTHER and
      is fully consistent with the UniProt FUNCTION statement and the entire GrpE
      literature.
    action: ACCEPT
    reason: Curated HAMAP MF_01151 and the GrpE domain architecture independently support
      the DnaK nucleotide-exchange role. E. coli biochemistry directly separates exchange
      from ATP hydrolysis (PMID:1826368); the assignment to KT2440 is comparative, without
      a target-specific kinetic measurement.
    supported_by:
    - reference_id: file:PSEPK/grpE/grpE-uniprot.txt
      supporting_text: GrpE releases ADP from DnaK; ATP binding to DnaK triggers the
        release of the substrate protein
    - reference_id: PMID:1826368
      supporting_text: The presence of GrpE alone increases the rate of release of bound
        ATP or ADP without affecting the rate of hydrolysis.
    - reference_id: file:PSEPK/grpE/grpE-deep-research-falcon.md
      supporting_text: member of the conserved **GrpE family**.
