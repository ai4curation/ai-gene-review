    label: protein-folding chaperone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GrpE binds directly to the Hsp70 chaperone DnaK (a protein-folding chaperone), docking onto
      its nucleotide-binding domain. This binding is the basis of its NEF activity. InterPro-based annotation
      is appropriate and more informative than generic protein binding.
    action: ACCEPT
    reason: GrpE's physical interaction with the DnaK chaperone is central to its function. The term correctly
      describes this binding to a folding chaperone rather than an uninformative generic protein binding
      term.
    supported_by:
