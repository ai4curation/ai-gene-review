  findings: []
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:38110031
  title: New insights into the structure and function of the complex between the
    Escherichia coli Hsp70, DnaK, and its nucleotide-exchange factor, GrpE
  findings:
  - statement: 'Comparative E. coli evidence, not KT2440: GrpE is the dimeric nucleotide exchange
      factor for DnaK; binding to the DnaK nucleotide-binding domain opens the nucleotide-binding
      cleft (movement of subdomain IIB), accelerating ADP release. Its coiled-coil is thermolabile.'
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2024, doi:10.1016/j.jbc.2023.105574,
      PMID:38110031). Provides the current structural/mechanistic basis for GrpE NEF
      activity used in this review. Describes the conserved E. coli DnaK-GrpE mechanism
      applicable to the P. putida ortholog.
- id: PMID:38253530
  title: Structure of the M. tuberculosis DnaK-GrpE complex reveals how key DnaK roles are
    controlled
  findings:
  - statement: 'Comparative Mycobacterium tuberculosis structure, not KT2440: Cryo-EM reveals
      an asymmetric 1:2 DnaK:GrpE complex; the GrpE dimer "ratchets" to remodel both the nucleotide-binding
      and substrate-binding domains of DnaK, coupling ADP release to substrate release.'
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nat Commun 2024, doi:10.1038/s41467-024-44933-9,
      PMID:38253530). Supports the dimeric/allosteric NEF mechanism; bacterial DnaK-GrpE
      system relevant to the conserved P. putida ortholog.
- id: PMID:16109938
  title: The heat shock genes dnaK, dnaJ, and grpE are involved in regulation of putisolvin biosynthesis in Pseudomonas putida PCL1445
  findings:
  - statement: In P. putida PCL1445, grpE, dnaK, and dnaJ are genomically linked (dnaK downstream of grpE, upstream of dnaJ), supporting a conserved Pseudomonas KJE chaperone gene cluster.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Bacteriol 2005, doi:10.1128/JB.187.17.5967-5976.2005, PMID:16109938). Provides Pseudomonas-genus genomic/operon context for grpE; downstream effects on putisolvin biosynthesis are most parsimoniously indirect consequences of chaperone-network perturbation.
- id: file:PSEPK/grpE/grpE-uniprot.txt
  title: UniProt Q88DU1 GrpE record
  findings:
  - statement: Curated HAMAP MF_01151 assigns DnaK nucleotide exchange, homodimerization
      and cytoplasmic location; these are comparative assignments, not a purified KT2440
      assay.
- id: PMID:1826368
  title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase
    activity of DnaK.
  findings:
  - statement: E. coli GrpE increases DnaK nucleotide release without accelerating the
      hydrolysis step.
    supporting_text: The presence of GrpE alone increases the rate of release of bound ATP
      or ADP without affecting the rate of hydrolysis.
    reference_section_type: ABSTRACT
- id: PMID:7937953
  title: The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system
    DnaK, DnaJ, and GrpE.
  findings:
  - statement: E. coli folding reconstitution places GrpE nucleotide release within the
      productive client cycle.
    supporting_text: (i) unfolded luciferase binds initially to DnaJ; (ii) upon
      interaction with luciferase-DnaJ, DnaK hydrolyzes its bound ATP, resulting in the
      formation of a stable luciferase-DnaK-DnaJ complex; (iii) GrpE releases ADP from
      DnaK;
    reference_section_type: ABSTRACT
suggested_questions:
- question: Does the proposed thermosensor behavior of the GrpE coiled-coil operate at physiologically relevant temperatures for P. putida, given its mesophilic environmental lifestyle?
suggested_experiments:
- description: Determine the operon structure and promoter(s) of the grpE-dnaK-dnaJ locus (PP_4728 region) in P. putida KT2440 (e.g. by RNA-seq/transcription start site mapping and co-transcription assays) to confirm the inferred Pseudomonas chaperone gene cluster organization.
- description: Test whether a grpE conditional/depletion mutant in KT2440 impairs growth and protein refolding under heat and solvent (phenol) stress, to directly link the NEF function to stress-tolerance phenotypes in this organism.
