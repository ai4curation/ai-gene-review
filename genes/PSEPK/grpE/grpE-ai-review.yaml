- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: GrpE is an integral component of the DnaK/DnaJ/GrpE chaperone machine, which
      assists de novo protein folding and refolding of stress-denatured proteins. Several
      rounds of GrpE-driven nucleotide exchange are required for efficient folding.
      InterPro-based annotation is well supported.
    action: ACCEPT
    reason: GrpE performs the nucleotide-release step of the productive DnaK folding
      cycle; participation is mechanistic, not inferred solely from necessity. The direct
      reconstitution is E. coli (PMID:7937953), transferred to KT2440 using its curated
      GrpE assignment.
    supported_by:
    - reference_id: PMID:7937953
      supporting_text: (i) unfolded luciferase binds initially to DnaJ; (ii) upon
        interaction with luciferase-DnaJ, DnaK hydrolyzes its bound ATP, resulting in the
        formation of a stable luciferase-DnaK-DnaJ complex; (iii) GrpE releases ADP from
        DnaK;
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GrpE functions as a homodimer; dimerization (via the coiled-coil) is
      essential for its NEF activity and for engaging DnaK in the asymmetric 1:2 DnaK:GrpE
      complex. UniProt SUBUNIT annotates Homodimer. Well supported by InterPro and
      structural studies.
    action: KEEP_AS_NON_CORE
    reason: The curated HAMAP subunit assignment supports a homodimer. Retain this
      architectural property separately from the defining DnaK nucleotide-exchange
      activity, as in the E. coli GrpE review. No KT2440 oligomerization assay is
      asserted.
    supported_by:
    - reference_id: file:PSEPK/grpE/grpE-uniprot.txt
      supporting_text: 'SUBUNIT: Homodimer.'
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GrpE binds directly to the Hsp70 chaperone DnaK (a protein-folding
      chaperone), docking onto its nucleotide-binding domain. This binding is the basis of
      its NEF activity. InterPro-based annotation is appropriate and more informative than
      generic protein binding.
    action: ACCEPT
    reason: GrpE's physical interaction with the DnaK chaperone is central to its
      function. The term correctly describes this binding to a folding chaperone rather
      than an uninformative generic protein binding term.
    supported_by:
