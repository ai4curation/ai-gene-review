id: Q88CS3
gene_symbol: mtgA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  MtgA is a membrane-anchored monofunctional GT51-family peptidoglycan
  glycosyltransferase. Its periplasmic catalytic domain polymerizes lipid II
  into glycan strands but lacks the peptide-crosslinking domain of class-A
  penicillin-binding proteins.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: MtgA is anchored in the cytoplasmic membrane by an N-terminal helix.
    action: ACCEPT
    reason: The membrane anchor positions the GT51 catalytic domain on the periplasmic face.
- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: MtgA polymerizes lipid II into peptidoglycan glycan strands.
    action: ACCEPT
    reason: This is the specific core molecular function of monofunctional biosynthetic peptidoglycan transglycosylases.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: MtgA supplies accessory glycan-polymerization capacity during peptidoglycan synthesis.
    action: ACCEPT
    reason: Its EC 2.4.99.28 reaction directly builds the glycan backbone from lipid II.
- term:
    id: GO:0009274
    label: peptidoglycan-based cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Peptidoglycan is the product and site of action, not the location of this membrane-anchored enzyme.
    action: REMOVE
    reason: MtgA is anchored in the cytoplasmic membrane with a periplasmic catalytic domain rather than residing in the cell wall.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Membrane localization is correct but less specific than plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: GO:0005886 captures the relevant bacterial membrane.
- term:
    id: GO:0016763
    label: pentosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad glycosyltransferase mapping does not identify the lipid II polymerization reaction.
    action: MODIFY
    reason: GO:0008955 specifically represents the established peptidoglycan glycosyltransferase activity.
    proposed_replacement_terms:
    - id: GO:0008955
      label: peptidoglycan glycosyltransferase activity
