id: Q88CU1
gene_symbol: argS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: The class I ArgRS core activates arginine as arginyl-AMP before esterifying the acceptor
  end of tRNA(Arg). It acts in the cytoplasm of Pseudomonas putida KT2440, using ATP to form the aminoacyl-tRNA
  substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate arginine by argS.
    action: MODIFY
    reason: The MF_00123 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/argS/argS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Arg) + L-arginine + ATP = L-arginyl-tRNA(Arg) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify arginine and tRNA(Arg).
    action: MODIFY
    reason: CDD ArgRS_core and HAMAP MF_00123 independently identify the arginine-specific enzyme; this
      is not an assignment from its submitted name. GO:0004814 is the supported amino-acid-specific descendant
      of GO:0004812; the parent is biologically correct, not over-annotation.
    supported_by: *id001
    proposed_replacement_terms:
    - &id002
      id: GO:0004814
      label: arginine-tRNA ligase activity
- term:
    id: GO:0004814
    label: arginine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: argS supplies arginine-charged tRNA(Arg) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: CDD ArgRS_core and HAMAP MF_00123 independently identify the arginine-specific enzyme; this
      is not an assignment from its submitted name. The independently curated MF_00123 reaction supports
      this specific MF; electronic provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to argS-catalysed arginine activation.
    action: ACCEPT
    reason: The curated MF_00123 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: argS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: ACCEPT
    reason: The MF_00123 subcellular-location statement supports this native compartment as a conserved
      functional inference. No finer localization is established in the inspected record; this is the
      core cellular setting rather than a peripheral process.
    supported_by:
    - reference_id: file:PSEPK/argS/argS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: argS catalyses the charging step that supplies arginine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00123 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006420
    label: arginyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The arginine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006420 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain arginine specificity
      in GO:0004814. This is ontology maintenance, not a rejection of the MF_00123 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id003
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
