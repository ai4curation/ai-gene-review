id: Q88CU1
gene_symbol: argS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Arginyl-tRNA synthetase that uses ATP to attach L-arginine to tRNA(Arg), producing arginyl-tRNA for translation in the bacterial cytoplasm. The reviewed UniProt assignment is rule-based and the protein is predicted to act as a monomer.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleotide binding is consistent with the ATP-dependent ArgRS reaction but is less informative than the substrate-specific activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: Broad InterPro IEA; ATP use is inherent in the rule-assigned ArgRS reaction.
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The protein is an aminoacyl-tRNA ligase, but the generic parent term is not defining when arginine-tRNA ligase activity is present.
    action: MARK_AS_OVER_ANNOTATED
    reason: Correct broad IEA, superseded for core-function synthesis by GO:0004814.
- term:
    id: GO:0004814
    label: arginine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ArgRS catalyzes ATP-dependent formation of L-arginyl-tRNA(Arg).
    action: ACCEPT
    reason: Substrate-specific UniRule/InterPro/Rhea/EC-supported IEA agrees with the reviewed UniProt record.
    supported_by:
    - reference_id: file:PSEPK/argS/argS-uniprot.txt
      supporting_text: "Reaction=tRNA(Arg) + L-arginine + ATP = L-arginyl-tRNA(Arg) + AMP +"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is mechanistically expected but is not the defining ArgRS function.
    action: KEEP_AS_NON_CORE
    reason: Rule-based IEA supported by the ATP-dependent catalytic reaction.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is plausible for bacterial ArgRS but is not a defining function.
    action: KEEP_AS_NON_CORE
    reason: UniProt subcellular-location IEA is explicitly HAMAP-rule based.
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: ArgRS participates in translation-associated tRNA aminoacylation, but this is broader than arginyl-tRNA aminoacylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006420 already captures the defining substrate-specific process.
- term:
    id: GO:0006420
    label: arginyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: ArgRS produces arginyl-tRNA(Arg) for protein synthesis.
    action: ACCEPT
    reason: Substrate-specific process follows directly from the rule-assigned catalytic reaction.
    supported_by:
    - reference_id: file:PSEPK/argS/argS-uniprot.txt
      supporting_text: "Reaction=tRNA(Arg) + L-arginine + ATP = L-arginyl-tRNA(Arg) + AMP +"
