proposed_new_terms:
- proposed_name: O-succinylhomoserine sulfhydrylase activity
  proposed_definition: >-
    Catalysis of the reaction: O-succinyl-L-homoserine + hydrogen sulfide =
    L-homocysteine + succinate.
  justification: >-
    MetZ-type enzymes (HAMAP MF_02056, InterPro IPR006234) perform the direct
    sulfhydrylation step of methionine biosynthesis in Pseudomonas and other
    bacteria, but GO has no term for this reaction. The O-acetylhomoserine analog
    has a term (GO:0051009, RHEA:27822, EC 2.5.1.49) and the cysteine-using
    O-succinylhomoserine reaction has one (GO:0003962, cystathionine gamma-synthase,
    EC 2.5.1.48), while RHEA:27826 has no GO xref and no EC number. Lacking it,
    TreeGrafter falls back to the wrong-class carbon-sulfur lyase term and UniRule
    to the transferase parent. The parent follows GO:0003962 and GO:0003961, which
    are direct children of GO:0016765.
  proposed_parent:
    id: GO:0016765
    label: transferase activity, transferring alkyl or aryl (other than methyl) groups
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:27826
      label: O-succinyl-L-homoserine + hydrogen sulfide = L-homocysteine + succinate
  supported_by:
  - reference_id: file:PSEPK/metZ/metZ-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: "Reaction=O-succinyl-L-homoserine + hydrogen sulfide = L-homocysteine +"
  - reference_id: file:PSEPK/metZ/metZ-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: "FUNCTION: Catalyzes the formation of L-homocysteine from O-succinyl-L-"
  - reference_id: file:PSEPK/metZ/metZ-hypotheses/function-hypothesis-go-0016846/openscientist.md
    supporting_text: "If a more specific child term for O-succinylhomoserine sulfhydrylase exists or is created, prefer it"

suggested_questions:
- question: Is MetZ the dominant KT2440 sulfhydrylase under sulfide-replete conditions,
    or does PP_2528 provide a parallel O-acetylhomoserine-dependent route?
suggested_experiments:
- description: Measure in vitro sulfhydrylase activity of purified MetZ with O-succinyl-L-homoserine
    and sulfide, comparing O-acetyl-L-homoserine as an alternate substrate.
  experiment_type: enzymology
