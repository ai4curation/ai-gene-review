    label: transferase activity, transferring alkyl or aryl (other than methyl) groups
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: The transferase parent is the most specific existing GO term in the correct
      reaction class for O-succinylhomoserine sulfhydrylation.
    action: ACCEPT
    reason: UniRule (HAMAP MF_02056) classifies MetZ as EC 2.5.1.- and maps it to this
