- term:
    id: GO:0016846
    label: carbon-sulfur lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Carbon-sulfur lyase activity is the wrong reaction class for MetZ; it is a
      TreeGrafter propagation from a PANTHER node that also contains true gamma-lyases.
    action: REMOVE
    reason: GO:0016846 is defined as catalysis of the elimination of hydrogen sulfide
      or substituted H2S (EC 4.4.-.-). MetZ does the opposite, consuming sulfide to
      form the new C-S bond of L-homocysteine (RHEA:27826), and UniProt/HAMAP classify
      it as a transferase (EC 2.5.1.-). A blinded OpenScientist control run refuted
      the term as a within-superfamily mis-placement, and a local placement check
      agrees on the facts (82.1% identity to the characterized P. aeruginosa O-succinylhomoserine
      sulfhydrylase P55218, at most 40% to any characterized C-S lyase; PLP lysine
      K219 intact). One detail of the run is corrected here; human cystathionine
      gamma-lyase is in PTHR11808:SF15, not in MetZ's subfamily SF80. SF80 instead
      groups MetZ with methionine gamma-lyases (MdeA, EC 4.4.1.11, genuine C-S lyases)
      and the KT2440 cystathionine gamma-synthase MetB, so the node PTN002273776 spans
      both elimination and replacement chemistry and the lyase term over-propagates
      to the replacement members. The correct activity is captured by GO:0016765 (accepted)
      and the proposed O-succinylhomoserine sulfhydrylase term. Any residual gamma-elimination
      side activity of MetZ is untested and would not justify this as its molecular function.
    supported_by:
    - reference_id: file:PSEPK/metZ/metZ-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=O-succinyl-L-homoserine + hydrogen sulfide = L-homocysteine +"
    - reference_id: file:PSEPK/metZ/metZ-deep-research-openscientist.md
      supporting_text: "encodes **O-succinylhomoserine sulfhydrylase (OSHS)**"
    - reference_id: file:PSEPK/metZ/metZ-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "PANTHER; PTHR11808:SF80; CYSTATHIONINE GAMMA-LYASE; 1."
    - reference_id: file:PSEPK/metZ/metZ-hypotheses/function-hypothesis-go-0016846/openscientist.md
      supporting_text: "**Verdict: REFUTED — Within-superfamily mis-placement (Failure Mode 3).**"
    - reference_id: file:PSEPK/metZ/metZ-hypotheses/function-hypothesis-go-0016846/openscientist.md
      supporting_text: "metZ does the chemical opposite: it nets the **addition** of sulfide (H₂S) across O-succinylhomoserine to build homocysteine"
    - reference_id: file:PSEPK/metZ/metZ-bioinformatics/RESULTS.md
      supporting_text: "Correction to the report: human CTH (P32929) is in PTHR11808:SF15, not SF80."
    - reference_id: PMID:10482527
      supporting_text: "Both these organisms used direct sulfhydrylation of O -succinylhomoserine for the synthesis of methionine"
