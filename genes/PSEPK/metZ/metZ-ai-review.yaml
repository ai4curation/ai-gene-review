id: Q88LD4
gene_symbol: metZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: metZ (PP_2001) encodes a cytosolic PLP-dependent O-succinylhomoserine
  sulfhydrylase that converts O-succinyl-L-homoserine and sulfide to L-homocysteine
  and succinate in the direct sulfhydrylation branch of de novo L-methionine biosynthesis.
  The enzyme belongs to the gamma subfamily of the trans-sulfuration (Cys/Met-metabolism
  PLP-dependent) enzyme family and is the ortholog of the characterized Pseudomonas
  aeruginosa MetZ. Its reaction is a gamma-replacement that adds sulfide to form
  a new carbon-sulfur bond (a transferase reaction, EC 2.5.1.-), not the gamma-elimination
  of sulfide carried out by the carbon-sulfur lyases of the same family.
