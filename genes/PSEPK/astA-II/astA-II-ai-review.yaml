id: Q88EI2
gene_symbol: astA-II
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  AstA-II (PP_4480) is the alpha-like component of the split
  arginine/ornithine N-succinyltransferase of Pseudomonas putida KT2440. It is
  predicted to assemble with the adjacent beta-like AstA-I chain to catalyze the
  succinyl-CoA-dependent first reaction of the arginine succinyltransferase
  pathway. The assembled enzyme can direct both L-arginine and L-ornithine into
  aerobic catabolism through N-succinylated intermediates.
existing_annotations:
- term:
    id: GO:0006527
    label: L-arginine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: AstA-II contributes to the initiating succinylation reaction of the AST arginine-catabolic pathway.
    action: ACCEPT
    reason: >-
      Q88EI2 carries the alpha-subunit signature and is adjacent to the
      complementary AstA-I chain. The homologous Pseudomonas aeruginosa aruF/aruG
      pair forms the arginine/ornithine succinyltransferase of the aerobic AST pathway.
    additional_reference_ids:
    - PMID:9393691
    - PMID:7523119
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and ornithine N2-succinyltransferases.
    - reference_id: file:PSEPK/astA-II/astA-II-uniprot.txt
      supporting_text: NCBIfam; TIGR03245; arg_AOST_alph; 1.
- term:
    id: GO:0008791
    label: L-arginine N-succinyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The activity belongs to the assembled split enzyme; catalytic sufficiency of AstA-II alone has not been shown.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Biochemical purification of the homologous Pseudomonas enzyme established
      a heterotetramer with two nonidentical chains. The precise gene-product
      relationship is therefore contributes_to for Q88EI2.
    additional_reference_ids:
    - PMID:7523119
    supported_by:
    - reference_id: PMID:7523119
      supporting_text: >-
        After SDS/PAGE two subunits of 35 kDa and 37 kDa were evident, indicating that the enzyme is a heterotetramer.
