      Q88EI2 is alpha-like: it is 85.8% identical across aligned residues to
      P. aeruginosa alpha chain P80357 and 40.4% to beta chain P80358.
    supporting_text: Q88EI3 is therefore beta-like and Q88EI2 is alpha-like.
