id: Q88QJ8
gene_symbol: selA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  SelA is the cytoplasmic, pyridoxal-5'-phosphate-dependent
  L-seryl-tRNA(Sec) selenium transferase of Pseudomonas putida KT2440. It uses
  selenophosphate supplied by SelD to convert Ser-tRNA(Sec) into
  Sec-tRNA(Sec), completing the bacterial charged-tRNA biosynthetic step that
  precedes SelB-dependent translation.
existing_annotations:
- term:
    id: GO:0001514
    label: selenocysteine incorporation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: SelA makes Sec-tRNA(Sec) but does not itself execute ribosomal Sec insertion.
    action: MODIFY
    reason: >-
      The direct SelA reaction is conversion of Ser-tRNA(Sec) to
      Sec-tRNA(Sec). GO:0001717 records that bounded biosynthetic step without
      assigning SelA the downstream SelB/ribosome incorporation event.
    proposed_replacement_terms:
    - id: GO:0001717
      label: conversion of seryl-tRNAsec to selenocys-tRNAsec
    supported_by:
    - reference_id: file:PSEPK/selA/selA-uniprot.txt
      supporting_text: "Converts seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec)"
- term:
    id: GO:0001717
    label: conversion of seryl-tRNAsec to selenocys-tRNAsec
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: This is the direct biological process catalyzed by bacterial SelA.
    action: ACCEPT
    reason: >-
      UniProt records the one-step bacterial route from Ser-tRNA(Sec) and
      selenophosphate to Sec-tRNA(Sec), and PANTHER assigns Q88QJ8 to the SelA
      subfamily.
    supported_by:
    - reference_id: file:PSEPK/selA/selA-uniprot.txt
      supporting_text: "selenocysteinyl-tRNA(Sec) from L-seryl-tRNA(Sec)"
- term:
    id: GO:0004125
    label: L-seryl-tRNA(Sec) selenium transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This term precisely represents the SelA selenium-transfer reaction.
    action: ACCEPT
    reason: >-
      The reviewed entry assigns EC 2.9.1.1 and a reaction consuming
      L-seryl-tRNA(Sec) plus selenophosphate to form
      L-selenocysteinyl-tRNA(Sec).
    supported_by:
    - reference_id: file:PSEPK/selA/selA-uniprot.txt
      supporting_text: "Reaction=L-seryl-tRNA(Sec) + selenophosphate"
- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IEA
  original_reference_id: file:PSEPK/selA/selA-uniprot.txt
  qualifier: enables
  review:
    summary: PLP binding is valid cofactor information for SelA.
    action: NEW
    reason: >-
      The exact Q88QJ8 record assigns pyridoxal 5'-phosphate and a
      PLP-linked active-site lysine, but the fetched GOA snapshot lacks the
      corresponding cofactor-binding annotation.
    supported_by:
    - reference_id: file:PSEPK/selA/selA-uniprot.txt
      supporting_text: "Name=pyridoxal 5'-phosphate"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: A cytoplasmic location is consistent with soluble bacterial Sec-tRNA synthesis.
    action: ACCEPT
    reason: >-
      UniProt explicitly assigns SelA to the cytoplasm and predicts no membrane
      or export features.
    supported_by:
    - reference_id: file:PSEPK/selA/selA-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
