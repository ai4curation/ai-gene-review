suggested_experiments:
- hypothesis: Q88QJ8 converts KT2440 Ser-tRNA(Sec) to Sec-tRNA(Sec) using SelD-derived selenophosphate.
  description: >-
    Reconstitute the reaction with purified SelA, Ser-tRNA(Sec), and
    selenophosphate, and quantify Sec-tRNA(Sec) formation with and without PLP.
