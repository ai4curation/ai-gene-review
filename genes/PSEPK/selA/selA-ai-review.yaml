    supporting_text: "**SelA (PP_0493) is a pyridoxal-5\u2032-phosphate (PLP)-dependent selenocysteine synthase (EC 2.9.1.1) that catalyzes the terminal, committed step of selenocysteine (Sec, the 21st amino acid) biosynthesis in the bacterial cytoplasm.**"
  knowledge_gaps:
