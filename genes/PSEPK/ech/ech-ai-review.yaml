id: Q88HJ8
gene_symbol: ech
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: >-
  Ech (PP_3358) is the feruloyl-CoA hydratase/lyase of the non-beta-oxidative
  hydroxycinnamate catabolic route of Pseudomonas putida KT2440. A member of
  the enoyl-CoA hydratase/isomerase (crotonase) superfamily, it hydrates the
  double bond of feruloyl-CoA and cleaves the resulting beta-hydroxy thioester
  by a retro-aldol reaction to vanillin and acetyl-CoA. It acts after the
  feruloyl-CoA synthetase Fcs and supplies vanillin to the vanillin
  dehydrogenase Vdh; the three genes are clustered, and inactivation of ech
  abolishes growth on ferulic acid. Crystal structures of the KT2440 protein
  have been solved in complex with CoA.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Ech is catalytic, but this root-level term hides its established substrate and products.
      action: MODIFY
      reason: >-
        Correct but general. The InterPro enoyl-CoA hydratase/isomerase
        signature only places Ech in the crotonase superfamily. KT2440 ech and
        fcs together convert ferulic acid to vanillin in E. coli, and the
        characterized P. fluorescens ortholog performs the composite hydration
        and retro-aldol cleavage, so the specific descendant feruloyl-CoA
        hydratase/lyase activity (GO:0050547) is the supported replacement.
      proposed_replacement_terms:
        - id: GO:0050547
          label: feruloyl-CoA hydratase/lyase activity
      supported_by:
        - reference_id: PMID:12764569
          supporting_text: Recombinant strains harboring fcs and ech were able to transform ferulic acid to vanillin.
        - reference_id: file:PSEPK/ech/ech-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: 'CC   -!- SIMILARITY: Belongs to the enoyl-CoA hydratase/isomerase family.'
  - term:
      id: GO:0008300
      label: isoprenoid catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: This TreeGrafter process is a wrong-substrate propagation from the broad PTHR42964 enoyl-CoA hydratase family.
      action: MODIFY
      reason: >-
        PTHR42964 has a single subfamily (SF1), and the TreeGrafter terms for
        SF1 come from the root node PTN001733227, whose only seed is the
        Pseudomonas aeruginosa LiuC methylglutaconyl-CoA hydratase of the
        leucine/acyclic-terpene utilization pathway (see the PTHR42964 family
        review). Ech instead acts on an aromatic hydroxycinnamoyl-CoA thioester,
        and the ech insertion mutant cannot grow on ferulic acid. The essence of
        the row (a catabolic role) holds, but the substrate is wrong; ferulate
        catabolic process (GO:1901067) is the correct process.
      proposed_replacement_terms:
        - id: GO:1901067
          label: ferulate catabolic process
      supported_by:
        - reference_id: PMID:12764569
          supporting_text: >-
            The essential involvement of fcs, ech and vdh in the catabolism of
            ferulic acid in P. putida KT2440 was proven by separately
            inactivating each gene by insertion of Omega-elements.
        - reference_id: PMID:12764569
          supporting_text: >-
            The corresponding mutant strains KT2440 fcsOmegaKm, KT2440
            echOmegaKm, and KT2440 vdhOmegaKm were not able to grow on ferulic
            acid.
        - reference_id: file:interpro/panther/PTHR42964/PTHR42964-paint.tsv
          supporting_text: "PTHR42964\tPTN001733227\tGO:0046247\tP\tIBD\tfalse\tUniProtKB:Q9I298"
      source_defects:
        - defect_type: WRONG_TERM
          resource: GO_CENTRAL
          slot: GO_ID
          requested_change: REPOINT
          asserted_value: GO:0008300
          corrected_value: GO:1901067
          corrected_label: ferulate catabolic process
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            GO_REF:0000118 (TreeGrafter) assigns isoprenoid catabolic process to
            UniProtKB:Q88HJ8 from PANTHER PTHR42964:SF1, whose process terms derive
            from the root node PTN001733227 seeded only by P. aeruginosa LiuC
            (UniProtKB:Q9I298). Q88HJ8 is the KT2440 feruloyl-CoA hydratase/lyase;
            its insertion mutant fails to grow on ferulic acid (PMID:12764569).
            The family mixes hydroxycinnamoyl-CoA hydratase-lyases, FabM isomerases,
            PksH-type polyketide dehydratases and LiuC, so a LiuC-derived process
            should not descend to the whole subfamily.
