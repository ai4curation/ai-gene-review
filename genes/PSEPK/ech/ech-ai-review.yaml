  - id: PMID:9461612
    title: Metabolism of ferulic acid to vanillin. A bacterial gene of the enoyl-SCoA hydratase/isomerase superfamily encodes an enzyme for the hydration and cleavage of a hydroxycinnamic acid SCoA thioester.
    findings:
      - statement: The P. fluorescens ortholog (HCHL, UniProtKB:O69762) was shown to hydrate and cleave feruloyl-CoA to vanillin and acetyl-CoA.
        supporting_text: >-
          A gene encoding a novel enoyl-SCoA hydratase/lyase enzyme for the
          hydration and nonoxidative cleavage of feruloyl-SCoA to vanillin and
          acetyl-SCoA was isolated and characterized from a strain of
          Pseudomonas fluorescens.
        reference_section_type: ABSTRACT
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Ortholog evidence (P. fluorescens), used only to define the reaction chemistry that the KT2440 phenotype implies.
  - id: file:projects/P_PUTIDA/deep-research/PSEPK__hydroxycinnamate-vanillate-catabolism__ppu00627-deep-research-openscientist.md
    title: OpenScientist PSEPK hydroxycinnamate and vanillate catabolism synthesis
    reference_review:
