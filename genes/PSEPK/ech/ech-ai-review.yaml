id: Q88HJ8
gene_symbol: ech
product_type: PROTEIN
status: DRAFT
aliases:
  - PP_3358
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  Ech is the feruloyl-CoA hydratase/lyase of the non-beta-oxidative
  hydroxycinnamate catabolic route. It hydrates and cleaves feruloyl-CoA to
  vanillin and acetyl-CoA after Fcs activation, providing the substrate for
  vanillin dehydrogenase Vdh. The KT2440 protein has direct structural evidence
  in complex with CoA and target-strain genetic support for this pathway role.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Ech is catalytic, but this root-level term hides its established substrate and products.
      action: MODIFY
      reason: GO:0050547 is the current exact molecular-function term for the composite feruloyl-CoA hydration and cleavage reaction.
      proposed_replacement_terms:
        - id: GO:0050547
          label: feruloyl-CoA hydratase/lyase activity
      supported_by:
        - reference_id: file:PSEPK/ech/ech-uniprot.txt
          supporting_text: Hydroxycinnamoyl-CoA hydratase-lyase
  - term:
      id: GO:0008300
      label: isoprenoid catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: This TreeGrafter process is a wrong-subfamily propagation from the broad enoyl-CoA hydratase fold.
      action: MODIFY
      reason: Ech acts on aromatic hydroxycinnamoyl-CoA thioesters in ferulate catabolism, not on isoprenoids.
      proposed_replacement_terms:
        - id: GO:1901067
          label: ferulate catabolic process
      supported_by:
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__hydroxycinnamate-vanillate-catabolism__ppu00627-deep-research-openscientist.md
          supporting_text: Hydration + retro-aldol cleavage
  - term:
      id: GO:0050547
      label: feruloyl-CoA hydratase/lyase activity
    evidence_type: ISS
    original_reference_id: file:PSEPK/ech/ech-uniprot.txt
    qualifier: enables
    review:
      summary: This exact term captures both stages of the Ech composite reaction.
      action: NEW
      reason: Rhea 62412 and the characterized Pseudomonas ortholog define conversion of feruloyl-CoA to vanillin and acetyl-CoA.
      supported_by:
        - reference_id: file:PSEPK/ech/ech-uniprot.txt
          supporting_text: EC=4.1.2.41
        - reference_id: file:PSEPK/ech/ech-uniprot.txt
          supporting_text: X-RAY CRYSTALLOGRAPHY (1.65 ANGSTROMS) IN COMPLEX WITH COA
