id: Q88IA4
gene_symbol: clpV
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  ClpV1/TssH1 is the AAA+ ATPase of the K1 type VI secretion system. It uses ATP hydrolysis to disassemble contracted TssBC sheath and recycle sheath subunits for subsequent firing cycles.
existing_annotations:
  - term: {id: "GO:0005524", label: ATP binding}
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: ATP binding is required for ClpV1 AAA+ ATPase activity.
      action: MARK_AS_OVER_ANNOTATED
      reason: ATP binding is true for the ClpV AAA+ ATPase but is an uninformative substrate-binding parent of the more diagnostic ATP hydrolysis activity annotation.
  - term: {id: "GO:0005737", label: cytoplasm}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: ClpV1 acts on the cytoplasmic face of the contracted sheath.
      action: KEEP_AS_NON_CORE
      reason: Cytoplasmic localization is compatible with sheath disassembly but is contextual rather than ClpV1's core molecular function.
  - term: {id: "GO:0016887", label: ATP hydrolysis activity}
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the direct catalytic activity that powers sheath disassembly.
      action: ACCEPT
      reason: ClpV1 is a T6SS-specific AAA+ ATPase.
  - term: {id: "GO:0034605", label: cellular response to heat}
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: The heat-response term is propagated from general ClpA/B family membership.
      action: REMOVE
      reason: The ClpV-specific domain and K1 locus establish T6SS sheath recycling rather than a heat-shock role.
  - term: {id: "GO:0033103", label: protein secretion by the type VI secretion system}
    evidence_type: ISS
    original_reference_id: PMID:36748579
    qualifier: involved_in
    review:
      summary: Uses ATP hydrolysis to disassemble and recycle the contracted K1 sheath.
      action: NEW
      reason: PMID:36748579 and the protein-family/locus evidence place this product in the KT2440 K1-T6SS apparatus.
      supported_by:
        - reference_id: PMID:36748579
          supporting_text: At the structural level, these proteins and the ATPase that recycles the sheath (ClpV) are highly conserved among the T6SS clusters, with few exceptions.
        - reference_id: file:PSEPK/clpV/clpV-uniprot.txt
          supporting_text: DR   InterPro; IPR017729; ATPase_T6SS_ClpV1.
