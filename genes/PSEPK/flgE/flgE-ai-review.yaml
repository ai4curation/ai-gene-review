taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: FlgE polymerizes into the flagellar hook of Pseudomonas putida KT2440. This flexible
  axial connector joins the basal-body rod to the filament and transmits torque while permitting
  changes in filament orientation. Its hook assignment is supported by conserved FlgE architecture
  and comparative flagellar structures.
