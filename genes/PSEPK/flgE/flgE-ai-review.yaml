- id: PMID:39766194
  title: Structure and Dynamics of the Bacterial Flagellar Motor Complex.
  findings:
  - statement: Comparative structural synthesis, principally Salmonella; architecture supports
      the homologous role, not an exact KT2440 stoichiometry.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
      FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC
      or FljB) and the filament cap (FliD)'
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  findings:
  - statement: KT2440 FliC S267C background distinguishes fluid swimming and semisolid spreading;
      these are not automatically flagellum-dependent surface swarming.
    supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16) and
      is lophotrichously flagellated, having multiple flagella at one cell pole (17).
existing_annotations:
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: FlgE forms the exported hook; a stable cytosolic localization is not established.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mature structural role is extracellular in the hook. A pre-export cytosolic
      pool is possible, so export is not a direct negative assay of all cytosolic presence.
      The electronic cytosol claim is insufficiently supported for the functional protein.
    supported_by:
    - reference_id: PMID:39766194
      supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC,
        FlgF, FlgG), the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament
        (FliC or FljB) and the filament cap (FliD)'
