- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  review:
    summary: This annotation is acceptable and captures a core biological process for FlgE.
      A functional hook is required to mechanically couple the motor to the filament, so hook
      assembly directly supports flagellum-dependent motility even though FlgE is not itself
      a regulatory factor.
    action: ACCEPT
    supported_by:
    - reference_id: file:PSEPK/flgE/flgE-deep-research-falcon.md
      supporting_text: The hook’s mechanical role is as a “universal joint”
    - *id002
    - *id003
    reason: The flexible hook polymer assignment is supported by the conserved protein architecture
      and comparative flagellar structures. The annotation is assessed for the KT2440 homolog;
      no isolated target-protein experiment is implied.
- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: FlgE supports flagellar motility, but the transferred swarming-specific claim is
      not established in KT2440.
    action: MARK_AS_OVER_ANNOTATED
    reason: This electronic transfer does not distinguish flagellum-dependent surface swarming
      from swimming through semisolid agar or other surface spreading. The KT2440 stator study
      explicitly makes that distinction. Retain general flagellar motility; do not infer swarming
      from necessity for an intact flagellum. This does not reject swarming experiments in other
      strains or conditions.
    supported_by:
    - reference_id: PMID:36409076
      supporting_text: However, P. putida does not swarm in a flagella-dependent manner (16)
        and is lophotrichously flagellated, having multiple flagella at one cell pole (17).
