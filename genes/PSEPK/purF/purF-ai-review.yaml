id: Q88LD5
gene_symbol: purF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: PurF is the glutamine amidophosphoribosyltransferase that commits 5-phosphoribosyl diphosphate
  to de novo purine synthesis by forming 5-phosphoribosylamine. It catalyzes the first PRPP-to-IMP reaction.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Valid cofactor binding, but not the core function of PurF.
    action: KEEP_AS_NON_CORE
    reason: Magnesium supports catalysis, while the enzyme-specific activity captures the core function.
- term:
    id: GO:0004044
    label: amidophosphoribosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Correct enzyme-specific molecular function.
    action: ACCEPT
    reason: The exact Amidophosphoribosyltransferase product assignment supports this activity.
- term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Correct pathway assignment.
    action: ACCEPT
    reason: This enzyme catalyzes a required reaction between PRPP and IMP.
- term:
    id: GO:0006541
    label: L-glutamine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: Correct supporting process for use of glutamine as the amide donor.
    action: KEEP_AS_NON_CORE
    reason: >-
      PurF consumes L-glutamine and releases L-glutamate during phosphoribosylamine
      formation, but de novo IMP biosynthesis is its defining pathway role.
- term:
    id: GO:0009113
    label: purine nucleobase biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Nucleobase-process annotation does not match the nucleotide product of this pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PRPP-to-IMP pathway produces a purine nucleotide, not a free purine
      nucleobase; GO:0009113 is therefore not a broader parent of GO:0006189.
