- id: PMID:37735577
  title: Identification of enzymatic functions of osmo-regulated periplasmic glucan biosynthesis proteins
    from Escherichia coli reveals a novel glycoside hydrolase family.
  findings:
  - statement: BL21-derived recombinant OpgG has weak intrinsic beta-1,2-glucan hydrolysis; specific pocket
      conservation supports an ISS capability inference to KT2440, while the native reaction remains unresolved.
    supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was
      very low
  - statement: The authors leave OpgG transglycosylation open, so this paper does not establish an obligatory
      native hydrolytic maturation step.
    supporting_text: The possibility that EcOpgG is in fact a transglycosylase of the β-1,6-glucose side
      chain remains open.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. BL21(DE3) CAQ31569.1 precursor is sequence-identical to K-12 P33136;
      assays use signal-deleted C-terminal His6 protein. D361N is the structural mutant, not the wild-type
      activity assay. No KT2440 biochemical or native-flux assay; hydrolase capability and physiological
      pathway role are distinct.
