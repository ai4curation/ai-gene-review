- term:
    id: GO:0033913
    label: glucan endo-1,2-beta-glucosidase activity
  evidence_type: ISS
  original_reference_id: PMID:37735577
  qualifier: enables
  review:
    summary: Historical homology-based proposal for intrinsic beta-1,2-glucan hydrolysis, with the native
      OpgG reaction unresolved.
    action: NEW
    reason: Retain the historical NEW assertion as an ISS chemical-capability inference, not as a demonstrated
      KT2440 assay or native OPG-processing step. PMID37735577 directly measured weak hydrolysis by signal-deleted,
      C-terminal His6 BL21(DE3) OpgG (CAQ31569.1, precursor sequence identical to K-12 P33136). Its specific
      activity was 0.11 U/mg and relative activity 0.79% of OpgD at 8 mg/mL substrate. KT2440 OpgG-specific
      classification and mapped D268/R327/D356 plus Loop A S410/L412 support the transfer beyond generic
      GH186 membership. The measured reaction matches GO:0033913, but low activity, possible cofactor
      dependence and alternative transglycosylation leave the evolved physiological reaction uncertain.
      No identical kinetics, OpgD interchangeability or in-vivo hydrolytic maturation is asserted; therefore
      this specific chemistry is not used as the core pathway reaction.
    supported_by:
    - reference_id: PMID:37735577
      supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was
        very low
    - reference_id: PMID:37735577
      supporting_text: The relative activity against EcOpgD was only 0.79% at 8.0 mg/mL β-1,2-glucan
    - reference_id: PMID:37735577
      supporting_text: The possibility that EcOpgG is in fact a transglycosylase of the β-1,6-glucose
        side chain remains open.
    - reference_id: file:PSEPK/opgG/opgG-source-analysis/evidence-scope.md
