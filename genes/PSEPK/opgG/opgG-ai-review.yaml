taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: OpgG is a predicted periplasmic OpgG-family protein in the osmoregulated periplasmic glucan
  biosynthetic pathway of Pseudomonas putida KT2440. Its conserved glycan-binding and catalytic-pocket
  architecture supports beta-1,2-glucan interaction and an inferred hydrolytic capability. The physiological
  reaction by which OpgG contributes to glucan formation remains unresolved; intrinsic hydrolysis has
  been measured in an Escherichia coli homolog, but cleavage, branching and cofactor dependence have not
  been established for the KT2440 protein.
