- id: file:PSEPK/opgG/opgG-deep-research-openscientist.md
  title: OpenScientist gene research for opgG
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Genuine preserved provider report; identity/family and pathway context are useful. Its
      claim that the enzyme class now defines the native backbone-processing role overstates the primary
      paper, which leaves cofactor dependence and transglycosylation open. The provider percent-identity
      calculation is not relied upon; an independently parameterized residue mapping is supplied. No direct
      KT2440 catalysis, knockout, product chemistry or physical OpgG-OpgH complex evidence was found.
  findings:
  - statement: Provider synthesis supports OpgG-family identity and proposes hydrolytic processing; the
      latter physiological assignment remains unproven and is not adopted as core chemistry.
