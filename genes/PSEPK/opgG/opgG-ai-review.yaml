suggested_questions:
- question: Is intrinsic beta-1,2-glucan hydrolysis an evolved physiological OpgG reaction in KT2440,
    or does the native system favor transglycosylation or a cofactor-dependent activity?
- question: What glucan products and linkage changes depend on KT2440 OpgG, and is there direct physical
    or functional coupling to OpgH?
suggested_experiments:
- description: Compare OPG amount and size distribution in wild-type, opgG, opgH, and opgGH mutant strains
    under low-osmolarity conditions.
  experiment_type: targeted genetics and glucan profiling
- description: Assay purified periplasmic OpgG against defined beta-1,2-glucan oligosaccharides to confirm
    GH186 beta-1,2-glucanase activity and substrate-length preference.
  experiment_type: in vitro glycoside hydrolase assay
