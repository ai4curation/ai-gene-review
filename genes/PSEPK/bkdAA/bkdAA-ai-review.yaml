id: Q88EQ2
gene_symbol: bkdAA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  BkdAA is the thiamine-diphosphate-dependent E1 alpha subunit of the bacterial
  branched-chain 2-oxoacid dehydrogenase complex. Together with BkdAB it
  oxidatively decarboxylates 2-oxo acids derived from leucine, isoleucine, and
  valine and transfers the resulting acyl group to the lipoyl arm of BkdB.
existing_annotations:
- term:
    id: GO:0003863
    label: branched-chain 2-oxo acid dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The function is correct for assembled E1, but BkdAA is its alpha subunit
      and does not independently enable the heterotetrameric activity.
    action: MODIFY
    reason: >-
      Retain GO:0003863 with contributes_to rather than enables. The exact
      Q88EQ2 record assigns EC 1.2.4.4 and RHEA:13457, and the PP_4401-PP_4404
      operon encodes the four BCKDH components.
    proposed_replacement_terms:
    - id: GO:0003863
      label: branched-chain 2-oxo acid dehydrogenase activity
    supported_by:
    - reference_id: file:PSEPK/bkdAA/bkdAA-uniprot.txt
      supporting_text: Full=2-oxoisovalerate dehydrogenase subunit alpha
- term:
    id: GO:0009083
    label: branched-chain amino acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: The Bkd E1 alpha subunit acts in BCAA catabolism.
    action: ACCEPT
    reason: >-
      BkdAA is part of the inducible BCKDH complex that consumes the three
      branched-chain 2-oxo acids produced from leucine, isoleucine, and valine.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
- term:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: This broad mechanistic parent is compatible with E1 chemistry but less informative than GO:0003863.
    action: KEEP_AS_NON_CORE
    reason: >-
      E1 transfers the decarboxylated acyl group to an oxidized protein-bound
      lipoyl disulfide, but the BCKDH-specific function should define the core
      annotation.
- term:
    id: GO:0160157
    label: branched-chain alpha-ketoacid dehydrogenase complex
  evidence_type: ISS
  original_reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
  qualifier: part_of
  review:
    summary: BkdAA is the E1 alpha subunit of the BCKDH complex.
    action: NEW
    reason: The four-gene bkd operon and E1 family assignment establish complex membership.
    supported_by:
    - reference_id: file:PSEPK/lpdV/lpdV-deep-research-openscientist.md
      supporting_text: >-
        The **bkd operon** encodes the four proteins of the BCKAD multienzyme
        complex: **E1α (bkdA1/bkdAA)**, **E1β (bkdA2/bkdAB)**, **E2
        dihydrolipoyl transacylase (bkdB)**, and **E3 dihydrolipoyl
        dehydrogenase (lpdV)**.
