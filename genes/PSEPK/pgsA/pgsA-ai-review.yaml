id: Q88FJ8
gene_symbol: pgsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: PgsA (PP_4097; UniProt Q88FJ8) is the Pseudomonas putida KT2440 CDP-diacylglycerol--glycerol-3-phosphate
  3-phosphatidyltransferase. It is a four-helix integral membrane protein of the CDP-alcohol phosphatidyltransferase
  class-I family that transfers the phosphatidyl group of CDP-diacylglycerol to sn-glycerol 3-phosphate,
  forming phosphatidylglycerol phosphate. This is the first, committed step of phosphatidylglycerol synthesis,
  which in turn supplies cardiolipin synthesis. Phosphatidylglycerol and cardiolipin are major KT2440
  membrane lipids.
