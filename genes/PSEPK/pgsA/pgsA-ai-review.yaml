id: Q88FJ8
gene_symbol: pgsA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
description: >-
  PgsA is an integral membrane phosphatidyltransferase that transfers a phosphatidyl group from CDP-diacylglycerol to glycerol 3-phosphate, forming phosphatidylglycerol phosphate in the phosphatidylglycerol biosynthetic pathway.
existing_annotations:
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: located_in
    review:
      summary: >-
        ARBA-assigned cytoplasm contradicts the multi-pass membrane topology recorded for PgsA in its own UniProt entry.
      action: REMOVE
      reason: >-
        PgsA is an integral membrane enzyme. UniProt records it as a membrane, multi-pass protein, Phobius predicts four transmembrane helices (6..23, 71..97, 133..151, 157..176), and the donor substrate CDP-diacylglycerol is a bilayer lipid, so catalysis occurs at the membrane surface rather than free in the cytosol. This row comes from an ARBA machine-learned model with no supporting feature anywhere in the entry, while the plasma membrane and membrane rows in the same GOA set already record the correct compartment. No soluble cytoplasmic form of a class-I CDP-alcohol phosphatidyltransferase is known, so this is a localization overcall rather than a second genuine location.
      supported_by:
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: "SUBCELLULAR LOCATION: Membrane"
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: "TRANSMEM        6..23"
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: "TRANSMEM        157..176"
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: Belongs to the CDP-alcohol phosphatidyltransferase class-I
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: >-
        Plasma membrane is the correct specific compartment for this multi-pass phosphatidyltransferase.
      action: ACCEPT
      reason: >-
        UniProt assigns PgsA to the membrane as a multi-pass membrane protein and Phobius predicts four transmembrane helices. In a Gram-negative bacterium the glycerophospholipid biosynthetic machinery operates in the inner (plasma) membrane, and lipidomics of Pseudomonas putida confirms that phosphatidylglycerol, the product of this branch, is a major membrane constituent of this organism. The TreeGrafter plasma-membrane call is therefore the appropriate specific compartment and is the location that should carry the core function.
      supported_by:
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: "SUBCELLULAR LOCATION: Membrane"
        - reference_id: file:PSEPK/pgsA/pgsA-uniprot.txt
          supporting_text: "TRANSMEM        6..23"
        - reference_id: PMID:21895997
          supporting_text: phosphatidylglycerol was the second most abundant class accounting for approximately one
