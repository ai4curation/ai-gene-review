      id: GO:0005829
      label: cytosol
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: The soluble cytosolic charging pool is the supported location for leuS.
    action: ACCEPT
    reason: The TreeGrafter location inference is coherent with the independently curated MF_00049 cytoplasmic
      assignment and the enzyme's delivery of aminoacyl-tRNA to bacterial translation. Retain the conserved
      localization judgment without presenting it as a fractionation assay or inferring exclusion from
      every other compartment.
    supported_by: *id002
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: leuS catalyses the charging step that supplies leucine to ribosomal protein synthesis.
    action: ACCEPT
    reason: The MF_00049 reaction directly performs aminoacylation, rather than merely affecting translation
      through a downstream phenotype. Live QuickGO verifies GO:0006418 as current; the old amino-acid-specific
      biological-process term is obsolete and is not a reason to mark this correct process as over-annotated.
    supported_by: *id001
- term:
    id: GO:0006429
    label: leucyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The leucine-specific charging chemistry remains supported, but this biological-process ID
      is obsolete.
    action: MODIFY
    reason: The live QuickGO snapshot verifies GO:0006429 as obsolete. Preserve the original machine-sourced
      ID and label and represent the biological process with current GO:0006418; retain leucine specificity
      in GO:0004823. This is ontology maintenance, not a rejection of the MF_00049 reaction.
    supported_by: *id001
    proposed_replacement_terms:
    - &id004
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
- term:
    id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: leuS proofreading protects aminoacyl-tRNA fidelity.
    action: ACCEPT
    reason: The target has the LeuRS editing-domain classification IPR025709, independently of the generic
      synthetase assignment. This supports the conserved deacylation function without asserting a particular
      noncognate substrate or a KT2440 turnover measurement. Cleavage of the incorrect charged product
      is direct biochemical participation in fidelity, not merely an inferred growth requirement.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR025709; Leu_tRNA-synth_edit.
