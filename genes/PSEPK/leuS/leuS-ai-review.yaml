- term:
    id: GO:0004823
    label: leucine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: leuS supplies leucine-charged tRNA(Leu) through ATP-dependent aminoacylation.
    action: ACCEPT
    reason: The leucine reaction is assigned by HAMAP MF_00049; InterPro IPR025709 and the editing-domain
      Gene3D assignment support proofreading. The retrieved record does not establish the exact edited
      substrate spectrum in KT2440. The independently curated MF_00049 reaction supports this specific
      MF; electronic provenance does not make a central catalytic function peripheral.
    supported_by: *id001
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP binding is integral to leuS-catalysed leucine activation.
    action: ACCEPT
    reason: The curated MF_00049 reaction specifically consumes ATP, and the target retains the corresponding
      synthetase architecture. This is an essential biochemical property of the charging activity, even
      though direct KT2440 binding constants have not been measured in the retrieved sources.
    supported_by: *id001
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: leuS is assigned to the bacterial cytoplasm for translational tRNA charging.
    action: MODIFY
    reason: The MF_00049 subcellular-location statement supports this native compartment as a conserved
      functional inference. The independently retained cytosol assignment gives a more precise compartment
      within the cytoplasm; this is not a direct KT2440 imaging claim.
    supported_by: &id002
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    proposed_replacement_terms:
