id: Q88DN1
gene_symbol: leuS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: LeuS is a class I leucyl-tRNA synthetase that supplies Leu-tRNA(Leu) and contains an editing
  domain associated with removal of incorrectly charged amino acids. It acts in the cytoplasm of Pseudomonas
  putida KT2440, using ATP to form the aminoacyl-tRNA substrate for protein synthesis.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP is the nucleotide used to activate leucine by leuS.
    action: MODIFY
    reason: The MF_00049 reaction consumes ATP during formation of the aminoacyl adenylate and releases
      AMP plus diphosphate. Refine generic nucleotide binding to its supported ATP-binding descendant,
      without implying that all nucleotides bind equally.
    supported_by: &id001
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=tRNA(Leu) + L-leucine + ATP = L-leucyl-tRNA(Leu) + AMP +
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LeuS is a class I leucyl-tRNA synthetase that supplies Leu-tRNA(Leu) and contains an editing
      domain associated with removal of incorrectly charged amino acids.
    action: ACCEPT
    reason: The target has the LeuRS editing-domain classification IPR025709, independently of the generic
      synthetase assignment. This supports the conserved deacylation function without asserting a particular
      noncognate substrate or a KT2440 turnover measurement. The leucine reaction is assigned by HAMAP
      MF_00049; InterPro IPR025709 and the editing-domain Gene3D assignment support proofreading. The
      retrieved record does not establish the exact edited substrate spectrum in KT2440.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR025709; Leu_tRNA-synth_edit.
