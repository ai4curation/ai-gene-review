id: Q88DN1
gene_symbol: leuS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: Leucyl-tRNA synthetase that uses ATP to attach L-leucine to tRNA(Leu) and contains a predicted editing domain that hydrolyzes mischarged aminoacyl-tRNAs, thereby supporting translational fidelity in the bacterial cytoplasm. The catalytic and editing assignments are computational or HAMAP-rule based for this protein.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Nucleotide binding is expected for ATP-dependent LeuRS chemistry but is too broad to describe its molecular function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-specific leucine-tRNA ligase annotation is more informative.
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: LeuS contains the characteristic editing domain used to hydrolyze mischarged aminoacyl-tRNA.
    action: ACCEPT
    reason: InterPro identifies the conserved LeuRS editing domain; the activity is plausible but remains rule/domain based for KT2440 LeuS.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      supporting_text: "InterPro; IPR025709; Leu_tRNA-synth_edit."
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Aminoacyl-tRNA ligase activity is correct but less specific than leucine-tRNA ligase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The separately annotated substrate-specific child term captures the known activity.
- term:
    id: GO:0004823
    label: leucine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Leucine-tRNA ligase activity is the substrate-specific core function of LeuS.
    action: ACCEPT
    reason: The reviewed record assigns the matching ATP-dependent reaction by HAMAP rule rather than direct KT2440 experimentation.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      supporting_text: "Reaction=tRNA(Leu) + L-leucine + ATP"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is a required substrate for leucyl-tRNA synthesis, but ATP binding alone is ancillary.
    action: KEEP_AS_NON_CORE
    reason: The complete catalytic activity is captured by leucine-tRNA ligase activity.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      supporting_text: "Reaction=tRNA(Leu) + L-leucine + ATP"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is appropriate for this soluble bacterial translation enzyme.
    action: KEEP_AS_NON_CORE
    reason: Localization is explicitly assigned in the reviewed record but is not a molecular function.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is compatible with the cytoplasmic localization of LeuS.
    action: KEEP_AS_NON_CORE
    reason: This inferred localization is contextual and redundant with cytoplasm.
    supported_by:
    - reference_id: file:PSEPK/leuS/leuS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
