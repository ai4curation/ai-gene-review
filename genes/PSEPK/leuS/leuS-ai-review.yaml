    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The broad ligase annotation can specify leucine and tRNA(Leu).
    action: MODIFY
    reason: The leucine reaction is assigned by HAMAP MF_00049; InterPro IPR025709 and the editing-domain
