taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
description: GlnS is a cytosolic class-I glutaminyl-tRNA synthetase. It activates glutamine with ATP and
  transfers it directly to tRNA(Gln), producing the charged tRNA used to decode glutamine codons. This
  direct route is chemically distinct from GatABC-dependent amidation of Glu-tRNA(Gln).
