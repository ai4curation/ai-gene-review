id: Q88IU5
gene_symbol: glnS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GlnS is the class I glutamine--tRNA ligase of Pseudomonas putida KT2440. It
  uses ATP to activate L-glutamine and transfers it directly to tRNA(Gln),
  producing Gln-tRNA(Gln) for translation.
