id: Q88IU5
gene_symbol: glnS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: >-
  GlnS is the class I glutamine--tRNA ligase of Pseudomonas putida KT2440. It
  uses ATP to activate L-glutamine and transfers it directly to tRNA(Gln),
  producing Gln-tRNA(Gln) for translation.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: GlnS binds ATP rather than an unspecified nucleotide.
    action: MODIFY
    reason: The exact reaction consumes ATP, and UniProt records ATP-contacting residues.
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0004812
    label: aminoacyl-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The generic ligase term is correct but less informative than the known GlnRS activity.
    action: MODIFY
    reason: The reviewed record assigns glutamine--tRNA ligase and EC 6.1.1.18.
    proposed_replacement_terms:
    - id: GO:0004819
      label: glutamine-tRNA ligase activity
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "RecName: Full=Glutamine--tRNA ligase"
- term:
    id: GO:0004819
    label: glutamine-tRNA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This is the substrate-specific catalytic activity of GlnS.
    action: ACCEPT
    reason: UniProt assigns the direct tRNA(Gln), L-glutamine, and ATP reaction.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: ATP is the activating substrate in the GlnRS reaction.
    action: ACCEPT
    reason: The catalytic record consumes ATP and produces AMP plus diphosphate.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Cytoplasmic localization is appropriate for this soluble bacterial GlnRS.
    action: ACCEPT
    reason: The reviewed entry explicitly assigns GlnS to the cytoplasm.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytosol is consistent with the reviewed cytoplasmic localization.
    action: ACCEPT
    reason: The bacterial soluble compartment is supported by UniProt; no membrane or export feature is present.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Cytoplasm"
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: GlnS supports translation by supplying Gln-tRNA(Gln), but translation is broader than its direct process.
    action: KEEP_AS_NON_CORE
    reason: The immediate role is glutaminyl-tRNA aminoacylation; translation is a downstream process context.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0006418
    label: tRNA aminoacylation for protein translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The broad translational charging term can be replaced by glutaminyl-tRNA aminoacylation.
    action: MODIFY
    reason: GlnS has a defined amino acid and cognate tRNA substrate.
    proposed_replacement_terms:
    - id: GO:0006425
      label: glutaminyl-tRNA aminoacylation
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0006424
    label: glutamyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: GlnS does not catalyze glutamyl-tRNA aminoacylation.
    action: REMOVE
    reason: >-
      The exact reviewed reaction uses L-glutamine and tRNA(Gln), not
      L-glutamate and tRNA(Glu); this electronic transfer conflicts with the
      substrate-specific record.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0006425
    label: glutaminyl-tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: GlnS directly forms Gln-tRNA(Gln).
    action: ACCEPT
    reason: The catalytic reaction exactly matches glutaminyl-tRNA aminoacylation.
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
- term:
    id: GO:0043039
    label: tRNA aminoacylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The broad tRNA aminoacylation term is correct but can be made substrate-specific.
    action: MODIFY
    reason: GO:0006425 captures the direct GlnRS process more precisely.
    proposed_replacement_terms:
    - id: GO:0006425
      label: glutaminyl-tRNA aminoacylation
    supported_by:
    - reference_id: file:PSEPK/glnS/glnS-uniprot.txt
      supporting_text: "Reaction=tRNA(Gln) + L-glutamine + ATP"
