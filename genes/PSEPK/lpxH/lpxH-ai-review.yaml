id: Q88IU7
gene_symbol: lpxH
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950
    / KT2440)
description: LpxH is a manganese-dependent UDP-2,3-diacylglucosamine hydrolase
  associated with the cytoplasmic face of the inner membrane. It hydrolyzes the
  UDP-linked lipid precursor to lipid X and UMP during lipid A biosynthesis.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: LpxH acts on the cytoplasmic face of the inner membrane rather than as a freely cytoplasmic protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The more precise extrinsic plasma-membrane localization is supported by the LpxH family model and should be preferred.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: LpxH is a peripheral protein on the cytoplasmic side of the bacterial inner membrane.
    action: ACCEPT
    reason: This localization is explicitly assigned by the LpxH-specific HAMAP rule.
- term:
    id: GO:0008758
    label: UDP-2,3-diacylglucosamine hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: This precisely describes hydrolysis of UDP-2,3-diacylglucosamine to lipid X and UMP.
    action: ACCEPT
    reason: The activity is supported by LpxH-specific HAMAP, InterPro, NCBIfam, and PANTHER signatures and the matching UniProt reaction.
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: LpxH generates lipid X in the conserved lipid A assembly pathway.
    action: ACCEPT
    reason: Lipid A biosynthesis is the canonical pathway role of LpxH.
- term:
    id: GO:0016462
    label: pyrophosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Pyrophosphatase activity is mechanistically correct but less specific than the existing substrate-defined LpxH term.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0008758 captures the biologically relevant reaction more precisely.
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Hydrolase activity is true but is an uninformative ancestor of the specific LpxH activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The substrate-specific hydrolase term should represent the core function.
- term:
    id: GO:0019897
    label: extrinsic component of plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: LpxH is peripherally associated with the cytoplasmic face of the inner membrane.
    action: ACCEPT
    reason: This is the most precise available localization and is supported by the LpxH-specific HAMAP rule.
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: LpxH uses a binuclear manganese center for catalysis.
    action: ACCEPT
    reason: The LpxH-specific HAMAP annotation records two manganese ions per subunit.
core_functions:
- description: Hydrolyzes UDP-2,3-diacylglucosamine to lipid X and UMP using a binuclear manganese center on the cytoplasmic face of the inner membrane.
  molecular_function:
    id: GO:0008758
    label: UDP-2,3-diacylglucosamine hydrolase activity
  directly_involved_in:
  - id: GO:0009245
    label: lipid A biosynthetic process
  locations:
  - id: GO:0019897
    label: extrinsic component of plasma membrane
  supported_by:
  - reference_id: file:PSEPK/lpxH/lpxH-uniprot.txt
    supporting_text: Hydrolyzes the pyrophosphate bond of UDP-2,3-
