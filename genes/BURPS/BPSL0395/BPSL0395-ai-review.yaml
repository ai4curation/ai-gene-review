  supporting_entities:
  - InterPro:IPR004821
  review:
    summary: Refine the catalytic or nucleotidyltransferase class to heptose-1-phosphate adenylyltransferase
      activity.
    action: MODIFY
    reason: 'The HldC literature, RfaE-domain-II architecture and structure-matched Q63XZ4 sequence support
      the specific physiological adenylyltransferase assignment. PMID:33733972 measures activity with
      beta-glucose-1-phosphate as a surrogate: those inhibitor assays support catalytic activity but are
      not native-heptose kinetic measurements. The AMP moiety is transferred to an already phosphorylated
      sugar.'
