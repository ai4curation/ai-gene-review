- term:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011914
  review:
    summary: The alcohol-acceptor phosphotransferase annotation conflates HldC with the HldA kinase domain.
    action: REMOVE
    reason: GO:0016773 requires transfer to an alcohol acceptor. HldC transfers AMP to the phosphate group
      of heptose 1-phosphate; it does not phosphorylate a sugar hydroxyl. Q63XZ4 is a 161-residue RfaE-domain-II
      nucleotidyltransferase, lacking the HldA PfkB kinase architecture. The exact adenylyltransferase
      function is retained through refinement of the other molecular-function rows.
    supported_by:
    - *id001
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR011914
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: RfaE domain II corresponds to the adenylyltransferase part; the alcohol-acceptor kinase
          function of bifunctional HldE belongs to domain I and should not be transferred to this isolated
          domain-II protein.
