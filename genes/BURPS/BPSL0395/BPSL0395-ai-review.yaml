id: Q63XZ4
gene_symbol: BPSL0395
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272560
  label: Burkholderia pseudomallei K96243
description: BPSL0395 encodes HldC, a monofunctional heptose-1-phosphate adenylyltransferase in Burkholderia
  pseudomallei. It transfers AMP from ATP to D-glycero-beta-D-manno-heptose 1-phosphate, supplying ADP-D-glycero-beta-D-manno-heptose
  for subsequent epimerization and lipopolysaccharide-core precursor synthesis. The small nucleotidyltransferase
  corresponds to the C-terminal domain of bifunctional HldE; heptose 7-phosphate phosphorylation is performed
  by a separate HldA enzyme.
