suggested_questions:
- question: What are the native KdpE-directed kinase and phosphatase rates, and which phosphorylation
    source maintains KdpE output without KdpD?
suggested_experiments:
- description: Measure dephosphorylation of purified phosphorylated NA1000 KdpE by matched wild-type
    KdpD and F832L, including KdpE-alone autodephosphorylation controls and appropriate membrane
    reconstitution. Compare kinase and phosphatase rates across the growth-related potassium conditions
    implicated by native genetics.
  experiment_type: direct matched-protein phosphatase and phosphotransfer kinetics
