    supporting_text: CcCnoX protected CS from thermal aggregation when present in sufficient amounts (from
      8:1 CcCnoX to CS)
suggested_questions:
- question: Does CnoX engage Caulobacter GroEL stably or transfer clients directly, or do protected clients
    dissociate before capture by the folding chamber?
- question: Which trapped redox clients are direct physiological substrates, and how much do the holdase
    and reductase client sets overlap?
