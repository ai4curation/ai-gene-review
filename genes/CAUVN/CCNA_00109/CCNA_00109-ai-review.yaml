- id: PMID:30482828
  title: The Chaperone and Redox Properties of CnoX Chaperedoxins Are Tailored to the Proteostatic Needs
    of Bacterial Species.
  findings:
  - statement: Caulobacter CnoX preserves unfolded citrate synthase for subsequent recovery by the Caulobacter
      GroEL/GroES system in the presence of ATP.
    supporting_text: In contrast, addition of GroEL/ES or DnaK/J/GrpE led to ∼60% or ∼30% recovery of
      initial CS activity, respectively
  - statement: CnoX is a constitutive holdase; the capture assay does not require prior bleach activation.
    supporting_text: CcCnoX protected CS from thermal aggregation when present in sufficient amounts (from
      8:1 CcCnoX to CS)
  - statement: CnoX is a thioredoxin reductase-recycled protein-disulfide reductase.
    supporting_text: When recycled by TrxR, CcCnoX also catalyzes the reduction of MsrA and DsbDα, two
      classical Trx substrates
  - statement: Stable mixed-disulfide protection is not the Caulobacter redox mechanism.
    supporting_text: CcCnoX does not protect its substrates from overoxidation by forming stable mixed-disulfide
      complexes with them, but rather functions as an oxidoreductase that contributes to redox homeostasis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official supplementary Table S2/Text S1 read. CB15N is the NA1000 strain
      synonym in the frozen accession records. BL21 is the recombinant host. CcCnoX and GroEL are untagged;
      GroES is C-terminally His-tagged. Recovery supports biochemical cooperation, not stable CnoX binding
      or direct channeling.
