  label: Caulobacter vibrioides NA1000
description: CCNA_00109 encodes CnoX, a cytosolic chaperedoxin of Caulobacter vibrioides NA1000 with an
  N-terminal thioredoxin domain and a C-terminal tetratricopeptide-repeat region. CnoX constitutively
  prevents aggregation of non-native proteins and maintains clients that can subsequently be refolded
  by GroEL/GroES or DnaK/DnaJ/GrpE. Its WCGPC active site reduces protein disulfides, with thioredoxin
  reductase recycling the oxidized enzyme. This reductase mechanism differs from the stable mixed-disulfide
  protection and HOCl-dependent holdase activation characterized in Escherichia coli CnoX.
