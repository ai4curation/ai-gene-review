core_functions:
- description: Reduction of protein disulfides through the WCGPC thioredoxin active site, with oxidized
    CnoX recycled by thioredoxin reductase. Transient catalytic mixed disulfides are distinguished from
    the stable protective complexes of E. coli CnoX.
