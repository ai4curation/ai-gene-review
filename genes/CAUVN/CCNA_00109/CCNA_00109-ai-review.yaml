proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its aggregation without
    actively catalyzing refolding. The holdase maintains the client in a soluble, folding-competent state.
  justification: Direct aggregation suppression establishes a general holdase function. GO:0051082 is
    obsolete; carrier-specific GO:0140309 requires escort to an acceptor or specific location. Recovery
    with downstream foldases alone does not resolve a direct escort mechanism, so the general holdase
    proposal is used without asserting that carrier-specific activity.
  proposed_parent:
