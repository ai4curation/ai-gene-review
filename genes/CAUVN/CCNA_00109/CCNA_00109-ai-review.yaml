  review:
    summary: CnoX is a protein-disulfide reductase recycled by thioredoxin reductase.
    action: ACCEPT
    reason: The primary study measures insulin reduction, recycling by Caulobacter TrxR, and reduction
      of MsrA and DsbDalpha, with catalytic cysteines reduced in vivo. The frozen CCNA_00109 sequence
      has the WCGPC motif at residues46-50 (C47/C50), matching the characterized Caulobacter mechanism.
      This is stronger evidence than the propagated family inference and must not be replaced by the redox-inactive
      E. coli SXXC model.
    supported_by:
    - reference_id: PMID:30482828
      supporting_text: When recycled by TrxR, CcCnoX also catalyzes the reduction of MsrA and DsbDα, two
        classical Trx substrates
