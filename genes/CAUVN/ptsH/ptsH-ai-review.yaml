- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415716
  review:
    summary: Remove propagation of the sugar-transport process to the native non-permease regulatory branch.
    action: REMOVE
    reason: The native study separates this PtsP–HPr–PtsN regulatory relay from carbohydrate permeases.
      Transferring the sugar-transport process from shared PTS domains misidentifies the experimentally
      characterized role. This is a wrong functional propagation, not a claim that phosphate exchange
      is impossible. This target belongs to the experimentally separated non-permease relay, and no target-specific
      cross-system sugar-phosphorylation result is available to soften the erroneous electronic process
      transfer.
    supported_by:
    - reference_id: PMID:27109061
      supporting_text: In contrast to its EIIA paralog, the EIIANtr component is not associated with permeases,
        but rather carries out regulatory functions, by interacting with its target(s).
    - reference_id: PMID:27109061
      supporting_text: Besides ptsP (EINtr), we found a unique HPr homologue (ptsH, CCNA_00241) and another
        nitrogen-related PTSNtr component, EIIANtr (ptsN, CCNA_03710).
