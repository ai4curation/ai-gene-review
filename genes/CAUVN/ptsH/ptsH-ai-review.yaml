- id: PMID:27109061
  title: Phosphotransferase-dependent accumulation of (p)ppGpp in response to glutamine deprivation in
    Caulobacter crescentus.
  findings:
  - statement: The experimental Caulobacter strains are NA1000-derived, matching the target taxon; the
      bacterial two-hybrid host is E. coli.
    supporting_text: All Caulobacter crescentus strains used in this study are derived from the synchronizable
      wild-type strain NA1000
  - statement: Caulobacter HPr restores phosphostate-dependent downstream interaction in an E. coli npr
      mutant; this supports relay competence, not isolated native transfer kinetics.
    supporting_text: the expression of Caulobacter ptsH (HPr) from the inducible pBAD promoter (pBAD33-ptsHCc)
      in a Δnpr background restored the interaction between EIIANtr and SpoT only when arabinose was added
      to the medium
  - statement: The tested HPr forms did not bind SpoT in the two-hybrid assay; its downstream effect is
      indirect in this model.
    supporting_text: no interaction was detected between HPr (or HPrH18A) and SpoT (or SpoTD81G) on MacConkey
      maltose agar plates
