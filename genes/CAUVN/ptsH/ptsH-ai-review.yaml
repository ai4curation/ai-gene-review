- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000415716
  review:
    summary: HPr transfers phosphoryl groups to a nitrogenous acceptor in a protein-histidine relay.
    action: MODIFY
    reason: This is a lateral chemical-acceptor refinement, not a claimed descendant of kinase activity.
      Kinase activity is not rejected merely because the donor is not ATP. HPr supplies phosphoryl transfer
      to PtsN histidine, supported by native pathway genetics, the HPr phosphohistidine-site signature,
      and restoration of PtsN–SpoT interaction by Caulobacter HPr in an E. coli npr deletion background.
      This is not purified native forward kinetics. ATP-specific protein histidine kinase and hybrid-kinase/response-regulator
      phosphotransfer terms would assert different reactions.
    supported_by:
    - reference_id: PMID:27109061
      supporting_text: the expression of Caulobacter ptsH (HPr) from the inducible pBAD promoter (pBAD33-ptsHCc)
        in a Δnpr background restored the interaction between EIIANtr and SpoT only when arabinose was
        added to the medium
    - reference_id: PMID:27109061
      supporting_text: Besides ptsP (EINtr), we found a unique HPr homologue (ptsH, CCNA_00241) and another
        nitrogen-related PTSNtr component, EIIANtr (ptsN, CCNA_03710).
    proposed_replacement_terms:
    - &id001
      id: GO:0016775
      label: phosphotransferase activity, nitrogenous group as acceptor
