- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415716
  review:
    summary: Regulatory phosphotransfer does not establish the mapped sugar/mannose transport function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The shared InterPro/UniRule PTS features support phosphorelay identity but do not establish
      sugar transport. The term describes coupled sugar uptake/phosphorylation, not every PEP-dependent
      regulatory phosphorelay. The native NA1000 study identifies a nitrogen-responsive PtsP–HPr–PtsN
      regulatory system and separates it from permease-coupled sugar PTS. The source mapping extends shared
      PTS chemistry or architecture into a substrate/transport role not established for this target. MARK_AS_OVER_ANNOTATED
      judges that over-specific assignment; it is not a claim that every possible secondary carbohydrate
      role has been experimentally excluded.
    supported_by:
    - reference_id: PMID:27109061
      supporting_text: In contrast to its EIIA paralog, the EIIANtr component is not associated with permeases,
        but rather carries out regulatory functions, by interacting with its target(s).
    - reference_id: PMID:27109061
      supporting_text: Besides ptsP (EINtr), we found a unique HPr homologue (ptsH, CCNA_00241) and another
        nitrogen-related PTSNtr component, EIIANtr (ptsN, CCNA_03710).
