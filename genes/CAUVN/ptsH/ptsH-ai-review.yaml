id: A0A0H3C344
gene_symbol: ptsH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: HPr (CCNA_00241) is the small histidine phosphocarrier of the nitrogen-responsive PtsP–HPr–PtsN
  relay in Caulobacter vibrioides NA1000. It accepts and transfers phosphoryl groups through a conserved
  histidine and couples upstream PtsP signaling to PtsN. Native genetic and phosphostate studies and heterologous
  phosphorelay complementation support this role. HPr also influences (p)ppGpp production through an incompletely
  resolved branch; the tested two-hybrid assay did not detect HPr–SpoT binding. Its established role is
  regulatory rather than mannose uptake.
