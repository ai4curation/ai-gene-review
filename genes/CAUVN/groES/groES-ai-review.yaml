- id: PMID:30482828
  title: The Chaperone and Redox Properties of CnoX Chaperedoxins Are Tailored to the Proteostatic Needs
    of Bacterial Species.
  findings:
  - statement: Caulobacter CnoX preserves unfolded citrate synthase for subsequent recovery by the Caulobacter
      GroEL/GroES system in the presence of ATP.
    supporting_text: In contrast, addition of GroEL/ES or DnaK/J/GrpE led to ∼60% or ∼30% recovery of
      initial CS activity, respectively
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official supplementary Table S2/Text S1 read. CB15N is the NA1000 strain
      synonym in the frozen accession records. BL21 is the recombinant host. CcCnoX and GroEL are untagged;
      GroES is C-terminally His-tagged. Recovery supports biochemical cooperation, not stable CnoX binding
      or direct channeling.
- id: file:CAUVN/groES/groES-uniprot.txt
  title: UniProt record for Caulobacter groES (B8H164)
  findings:
  - statement: Reference record establishes the NA1000/CB15N strain and locus identity; curated HAMAP
      statements or domain signatures are distinguished from direct experimental evidence.
- id: PMID:7867782
  title: 'GroES and the chaperonin-assisted protein folding cycle: GroES has no affinity for nucleotides.'
  findings:
  - statement: Direct nucleotide-binding measurements on E. coli GroES were negative; this is comparator
      evidence, not an assay on Caulobacter GroES.
    supporting_text: Using rigorous physical methods, isothermal calorimetry and equilibrium binding,
      no interaction between GroES and nucleotides could be detected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly identifies E. coli. Its negative result challenges a universal GroES
      ATP-binding assignment but cannot by itself establish target-specific absence in Caulobacter.
core_functions:
- description: GroEL-binding co-chaperonin cap that contributes to ATP-dependent protein folding by the
    GroEL/GroES complex. ATP-driven system function does not establish an ATP-binding or hydrolytic activity
    intrinsic to GroES.
