id: B8H164
gene_symbol: groES
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: GroES is the cytoplasmic heptameric co-chaperonin of Caulobacter vibrioides NA1000. It binds
  the apical surface of GroEL and caps its folding chamber, contributing to ATP-dependent protein folding
  by the GroEL/GroES system. Purified Caulobacter GroES and GroEL recover citrate synthase activity after
  CnoX has preserved the unfolded client.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018369
  - InterPro:IPR020818
  review:
    summary: Direct ATP binding by Caulobacter GroES is unresolved.
    action: UNDECIDED
    reason: The ATP dependence of the complete folding system does not assign nucleotide binding to its
      GroES cap. PMID:7867782 found no nucleotide binding by E. coli GroES, but that is not a Caulobacter
      assay. The current InterPro mappings do not supply target-specific positive evidence, and their
      underlying transfer has not been demonstrated faulty for this sequence; retain an explicit unresolved
      judgment rather than claiming absence.
    supported_by:
    - reference_id: PMID:7867782
      supporting_text: Using rigorous physical methods, isothermal calorimetry and equilibrium binding,
        no interaction between GroES and nucleotides could be detected.
