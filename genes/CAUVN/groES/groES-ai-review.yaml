  review:
    summary: GroES assists folding through binding the GroEL complex.
    action: ACCEPT
    reason: The current GO:0044183 definition includes binding to a protein-containing complex to assist
      folding. GroES capping satisfies this cofactor mechanism; lack of autonomous ATP hydrolysis or direct
      client refolding is not a reason to reject this broad activity. The core separately records contribution
      to ATP-dependent folding rather than asserting independent GroES ATPase activity.
