- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002583588
  review:
    summary: Metal binding by this Caulobacter GroES has not been established.
    action: UNDECIDED
    reason: The TreeGrafter ancestral-node inference is not a direct measurement on B8H164. The reviewed
      source provides no metal coordination site or target-specific metal-binding assay. Absence of cysteine/histidine
      is not evidence against metal binding because acidic residues can coordinate ions. Species-specific
      GroES metal effects therefore cannot be generalized here without checking the propagated site and
      target evidence.
    supported_by:
    - reference_id: file:CAUVN/groES/groES-uniprot.txt
      supporting_text: Belongs to the GroES chaperonin family.
