- id: PMID:27109061
  title: Phosphotransferase-dependent accumulation of (p)ppGpp in response to glutamine deprivation in
    Caulobacter crescentus.
  findings:
  - statement: The experimental Caulobacter strains are NA1000-derived, matching the target taxon; the
      bacterial two-hybrid host is E. coli.
    supporting_text: All Caulobacter crescentus strains used in this study are derived from the synchronizable
      wild-type strain NA1000
  - statement: Wild-type and H66E PtsN support SpoT binding in two-hybrid assays; H66E is a phosphomimetic,
      not phosphohistidine itself.
    supporting_text: both the wild-type EIIANtr (ptsN) and the phosphomimetic mutant of EIIANtr (EIIANtrH66E)
      were able to interact with SpoT versions
  - statement: Engineered native cells separating RelA synthesis from SpoT hydrolysis support PtsN-dependent
      hydrolase inhibition; purified binary inhibition kinetics were not measured.
    supporting_text: these findings demonstrate that EIIANtr∼P inhibits hydrolase activity of SpoT to
      modulate (p)ppGpp accumulation upon nitrogen availability.
