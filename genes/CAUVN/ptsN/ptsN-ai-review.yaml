  review:
    summary: Remove the erroneous mannose transporter EC mapping and its derived process.
    action: REMOVE
    reason: EC:2.7.1.191 identifies the coupled mannose transporter system, not a soluble HPr carrier
      or regulatory EIIA. The native NA1000 study identifies the PtsP–HPr–PtsN regulatory route and explicitly
      distinguishes EIIANtr from permease-associated EIIA. GO:0015761 is automatically inferred from the
      same incorrect GO:0022870 mapping. Remove this demonstrably wrong electronic mapping rather than
      retaining it as an uncertain physiological role.
