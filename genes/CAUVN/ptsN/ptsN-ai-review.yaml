      process assignment is over-annotation rather than an absolute negative. Bona fide E. coli/Bacillus
      HPr controls retain the sugar process because they feed sugar-specific EIIA proteins in the native
      carbohydrate route; common ancestry at PTN002135312 does not erase this functional divergence.'
