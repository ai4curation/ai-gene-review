- term:
    id: GO:0030295
    label: protein kinase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002412133
  review:
    summary: The measured NA1000 output is SpoT hydrolase inhibition; a protein kinase target remains
      unresolved.
    action: UNDECIDED
    reason: GO:0030295 requires activation of a protein kinase. SpoT alarmone synthetase/hydrolase control
      does not establish that activity. Nevertheless, a different measured regulatory output does not
      exclude additional kinase targets. The source is TreeGrafter node PTN002412133; the locally retrieved
      PAINT slice contains a different kinase-activation node (PTN002021052) with an E. coli positive
      anchor, while the exact NA1000 accession has no leaf in the retrieved reference tree. Target ancestry
      or a lineage loss cannot therefore be asserted. Retain uncertainty in this particular functional
      transfer, not a conclusion that kinase activation is biologically impossible.
    supported_by:
    - reference_id: PMID:27109061
      supporting_text: these findings demonstrate that EIIANtr∼P inhibits hydrolase activity of SpoT to
        modulate (p)ppGpp accumulation upon nitrogen availability.
