core_functions:
- description: Phosphorylation-dependent inhibition of SpoT (p)ppGpp hydrolase regulates alarmone accumulation.
    This synthesis combines phosphostate-dependent two-hybrid binding with hydrolase-dissection assays
    in engineered NA1000 cells; it does not imply purified binary inhibition kinetics or a universal PtsN
    kinase target.
