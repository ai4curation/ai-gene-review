  review:
    summary: ATP binding by NA1000 KdpC is unresolved.
    action: UNDECIDED
    reason: The UniRule transfer reflects an older Escherichia coli ATP-dependent KdpC/KdpB model. The
      accessible PMID:21711450 abstract reports ATP-related effects, whereas the later structure places
      the KdpC soluble domain periplasmically. Topology challenges that physiological model but does not
      prove absence of binding. No NA1000 assay resolves transfer of this activity, so neither confident
      acceptance nor rejection is warranted.
    supported_by:
