  - InterPro:IPR003820
  - PANTHER:PTN004738422
  review:
    summary: KdpC supports the assembled pump; the recorded enables relation overstates its activity
      attribution.
    action: MARK_AS_OVER_ANNOTATED
    reason: The combined electronic mapping supports membership in the KdpC machinery, but not execution
      of the coupled pump reaction by KdpC. Intact-complex structures support a KdpC structural contribution
      at the KdpA interface, whereas KdpA/B provide the ion pathway and KdpB the ATPase machinery. Non-labelling
      of KdpC by an inhibitor is not evidence that it has no functional contribution. NA1000 locus genetics
      and conserved subunit architecture support participation, but do not isolate the accessory subunit
      reaction. The overannotation concerns the recorded relation, not a negative judgment on participation.
      Retain contributes_to_molecular_function in the core and request a source relation correction;
      preserve the original row unchanged.
