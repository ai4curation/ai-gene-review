  label: Caulobacter vibrioides NA1000
description: KdpC (CCNA_01665) is a single-pass membrane accessory subunit of the KdpABC potassium uptake
  complex in Caulobacter vibrioides NA1000. KdpC-family conservation and the native requirement for the
  KdpABC locus under potassium limitation support a structural contribution to the assembled transport
  machinery. Homolog structures place the large soluble domain on the periplasmic side, although this
  orientation has not been measured for NA1000 KdpC. The ATP-hydrolyzing catalytic center resides in KdpB.
  An older model assigning KdpC an ATP-dependent catalytic-chaperone role remains uncertain for this protein.
