gene_symbol: groEL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: GroEL is the cytoplasmic ATP-dependent chaperonin of Caulobacter vibrioides NA1000. Its double-ring
  assembly cooperates with the GroES cap to provide a protected environment for protein folding. Purified
  Caulobacter GroEL/GroES restores activity to chemically denatured citrate synthase preserved by the
  constitutive holdase CnoX, linking the folding machinery to client protection and recovery.
