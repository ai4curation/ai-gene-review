    summary: GroEL binds ATP in its conserved chaperonin nucleotide pocket.
    action: ACCEPT
    reason: The curated HAMAP ATP-binding sites and ATP-coupled GroEL family mechanism support this core
      ligand-binding activity. The Caulobacter reconstitution uses Mg-ATP; that experiment establishes
      system function rather than measuring an isolated binding affinity.
