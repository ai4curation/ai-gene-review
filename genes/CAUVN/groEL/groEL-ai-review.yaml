  review:
    summary: GroEL directly assists protein folding with GroES.
    action: ACCEPT
    reason: GroEL performs the folding step; it is not merely a stress-response marker. HAMAP family mechanism
      supports physiological protein folding, and the same-strain reconstitution demonstrates refolding
      of a model client. Protein folding encompasses both normal folding and stress recovery, so the narrower
      refolding row does not exhaust this function.
    supported_by:
