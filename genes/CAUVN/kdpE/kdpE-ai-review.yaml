gene_symbol: kdpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: KdpE (CCNA_01667) is the receiver-domain and OmpR/PhoB-type DNA-binding response regulator
  that activates the kdpABCDE potassium uptake locus in Caulobacter vibrioides NA1000. Native ChIP-seq
  identifies the kdp promoter as its confident direct target, and deletion, complementation, promoter
  reporters and Asp56 mutants support phosphorylation-dependent transcriptional activation under potassium
  limitation. KdpD influences KdpE signaling but is not the only proposed phosphorylation source. Broader
  transcriptome changes do not establish direct binding to every affected gene. KdpE is a soluble regulator
  acting on intracellular chromosomal DNA, rather than an ion-translocating pump subunit.
