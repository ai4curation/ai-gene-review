id: B8GX72
gene_symbol: opgH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: 'OpgH is an essential multipass membrane GT2/OpgH-family protein in Caulobacter vibrioides
  NA1000. Its conserved glycosyltransferase motif and UDP-glucose accumulation after depletion support
  an inferred glucosyltransferase function. Depletion causes asymmetric bulging, disruption of cell-growth
  machinery and eventual lysis, and a D247A motif mutant fails to restore growth. Its glycan product remains
  unidentified: the native study did not detect OPGs or directly demonstrate OpgH-dependent OPG synthesis.'
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  - PANTHER:PTN008122824
  - UniRule:UR000066664
  review:
    action: ACCEPT
    summary: OpgH is a multipass inner-membrane protein.
    reason: The frozen membrane topology and conserved OpgH architecture agree with the primary study
      of NA1000 CCNA_02097. This location does not establish the chemical identity or periplasmic destination
      of its unknown product.
    supported_by:
    - reference_id: file:genes/CAUVN/opgH/opgH-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
- term:
    id: GO:0009250
    label: glucan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000066664
  review:
    action: UNDECIDED
    summary: Glucan synthesis is a plausible but unverified product assignment.
    reason: The UniRule assignment is consistent with OpgH orthology, but the exact-strain study explicitly
      reports failed OPG detection and lacks direct evidence of OpgH-dependent OPG synthesis. UDP-glucose
      accumulation and D247A non-rescue support enzymatic involvement without identifying the acceptor
      or final glycan. Essentiality, morphology and a cyclic hexamer linked to EstG do not independently
      establish this protein produces that glucan. Retain uncertainty rather than declaring the family
      inference false.
    supported_by:
    - reference_id: PMID:39145657
      supporting_text: However, we do not yet have direct evidence that Caulobacter OpgH can synthesize
        OPGs.
- term:
    id: GO:0016758
    label: hexosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR023725
  - PANTHER:PTN008122824
  - UniRule:UR000066664
  review:
    action: MODIFY
    summary: The inferred hexose-transfer reaction is specifically glucose-dependent.
    reason: GO:0046527 is a verified descendant of GO:0016758. GT2/OpgH-family architecture, the conserved
      DAD motif, increased UDP-glucose on depletion and failure of D247A to rescue support an inferred
      glucosyltransferase activity. These findings do not constitute a purified catalytic assay or identify
      the acceptor/product; consequently the glucan process remains UNDECIDED rather than being inserted
      into the core.
    proposed_replacement_terms:
    - id: GO:0046527
      label: glucosyltransferase activity
    supported_by:
    - reference_id: file:genes/CAUVN/opgH/opgH-uniprot.txt
      supporting_text: Belongs to the glycosyltransferase 2 family. OpgH
    - reference_id: PMID:39145657
      supporting_text: Although our data support the hypothesis that OpgH converts UDP-glucose to OPGs,
        further biochemical studies are necessary to determine if this cyclic OPG is, in fact, the product
        of OpgH.
