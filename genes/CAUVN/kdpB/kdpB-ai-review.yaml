  label: Caulobacter vibrioides NA1000
description: KdpB (CCNA_01664) is the membrane-embedded P-type ATPase subunit of the KdpABC potassium
  uptake system in Caulobacter vibrioides NA1000. Conserved type-IA ATPase architecture, the annotated
  phosphorylatable Asp314, and ATP- and magnesium-binding features support an ATP-driven catalytic cycle
  coupled to potassium uptake by the assembled complex. Native KdpABC deletion impairs growth in potassium-limited
  medium, while the detailed ATPase, transport kinetics and coupling stoichiometry of this strain have
  not been measured in the cited study. KdpE regulates expression of the locus, and KdpD modifies that
  regulation in a growth-phase-dependent manner.
