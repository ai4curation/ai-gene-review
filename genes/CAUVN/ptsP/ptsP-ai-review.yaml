gene_symbol: ptsP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:565050
  label: Caulobacter vibrioides NA1000
description: PtsP (enzyme I Ntr; CCNA_00892) initiates a nitrogen-responsive phosphotransfer relay in
  Caulobacter vibrioides NA1000. It uses phosphoenolpyruvate to phosphorylate a protein histidine and
  supplies the HPr–PtsN signaling pathway that controls SpoT-dependent (p)ppGpp accumulation and cell-cycle
  progression. NA1000 PtsP-containing fractions show glutamine-sensitive autophosphorylation; a GAF-domain
  L83Q variant loses this response. PtsP also associates with SpoT in cellular affinity-purification experiments.
  These results connect nitrogen availability to alarmone signaling without establishing direct glutamine
  binding or an isolated PtsP–SpoT regulatory reaction.
