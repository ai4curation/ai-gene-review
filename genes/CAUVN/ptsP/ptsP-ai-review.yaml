core_functions:
- description: PEP-dependent protein-histidine phosphotransfer initiates the nitrogen-responsive relay.
    Native PtsP-enriched fraction assays demonstrate autophosphorylation and glutamine responsiveness;
    HPr delivery is supported by pathway genetics. PtsP–SpoT co-complex association does not establish
    an independent direct activation mechanism.
