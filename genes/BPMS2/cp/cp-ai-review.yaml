taxon:
  id: NCBITaxon:12022
  label: Escherichia phage MS2
description: Major coat protein (CP) of Escherichia phage MS2 that forms non-covalent homodimers and self-assembles into a
  T=3 quasi-icosahedral capsid composed of 89 CP dimers and a single maturation protein. In addition to its structural role
  in encapsidating the single-stranded genomic RNA via dispersed stem-loop packaging signals, a CP dimer binds with high affinity
  to the 19-nucleotide translational operator (TR) hairpin spanning the replicase start codon to repress viral replicase translation
  late in infection and nucleate capsid assembly.
