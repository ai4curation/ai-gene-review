suggested_questions:
- question: How do the dispersed low-affinity packaging signals across the MS2 genomic RNA coordinate with the high-affinity
    TR operator to prevent off-pathway capsid intermediates in vivo?
suggested_experiments:
- description: Single-molecule fluorescence correlation spectroscopy and cryo-EM analysis of co-transcriptional MS2 capsid
    assembly on nascent viral RNA transcripts with synonymous mutations ablating dispersed packaging hairpins.
  hypothesis: Co-transcriptional folding presents packaging signals sequentially to incoming CP dimers, guiding a deterministic
    assembly trajectory around the viral genome.
