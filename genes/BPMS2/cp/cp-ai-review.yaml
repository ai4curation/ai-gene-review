- id: PMID:23810697
  title: The asymmetric structure of an icosahedral virus bound to its receptor suggests a mechanism for genome release.
  findings:
  - statement: The MS2 capsid is built from 89 coat protein homodimers adopting asymmetric (A/B) and symmetric (C/C) quasi-equivalent
      conformations, plus a single maturation protein.
    supporting_text: The building block of the MS2 capsid is a CP dimer, and two distinct types of this dimer are found in
      the capsid; an asymmetric (A/B) dimer, and a symmetric (C/C) dimer
