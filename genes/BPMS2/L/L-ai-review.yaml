- id: PMID:2656650
  title: Specific localization of the lysis protein of bacteriophage MS2 in membrane
    adhesion sites of Escherichia coli.
  findings:
  - statement: >-
      MS2 L protein localizes to specific adhesion sites between the inner and outer
      membranes of Escherichia coli to mediate host cell lysis.
    supporting_text: >-
      It is concluded that lysis of the host, E. coli, was a result of the formation of specific L-protein-mediated membrane adhesion sites.
- id: PMID:3053640
  title: Induction of the autolytic system of Escherichia coli by specific insertion
    of bacteriophage MS2 lysis protein into the bacterial cell envelope.
  findings:
  - statement: >-
      Membrane fractionation demonstrates that MS2 L protein inserts predominantly
      into the host cytoplasmic membrane and intermediate-density envelope fractions.
    supporting_text: >-
      After extensive separation of the membranes by isopycnic sucrose gradient centrifugation, the lysis protein was present predominantly in the cytoplasmic membrane and in a fraction of intermediate density and, to a lesser degree, in the outer membrane, irrespective of the conditions of growth.
- id: file:BPMS2/L/L-uniprot.txt
  title: UniProtKB entry for BPMS2 L (P03609)
  findings:
  - statement: >-
      MS2 lysis protein induces membrane adhesion sites between the inner and outer
      membranes, leading to host cell lysis.
    supporting_text: >-
      Induces the formation of specific membrane adhesion sites between the inner and outer membranes, apparently leading to host cell lysis. Lysis may be performed via activation of host murein hydrolases.
suggested_questions:
- question: >-
    What is the precise molecular mechanism by which the MS2 L protein and its
    interaction with the host chaperone DnaJ trigger envelope failure and murein
    hydrolase activation at inner-outer membrane adhesion sites?
suggested_experiments:
- description: >-
    Cryo-electron tomography and cross-linking mass spectrometry of Escherichia coli
    inner-outer membrane complexes containing wild-type or lysis-defective P-domain
    mutants of MS2 L protein in the presence and absence of functional DnaJ.
  hypothesis: >-
    DnaJ promotes the oligomerization or insertion of L into trans-envelope spanning
    complexes that destabilize peptidoglycan-outer membrane tethering and activate
    autolysis.
