  original_reference_id: PMID:3053640
  qualifier: located_in
  review:
    summary: >-
      Isopycnic sucrose gradient membrane fractionation shows MS2 L protein is
      located predominantly in the host cytoplasmic membrane.
    action: ACCEPT
    reason: >-
      PMID:3053640 separated Escherichia coli envelope fractions by isopycnic sucrose
      gradient centrifugation and demonstrated that the L protein resides predominantly
      in the cytoplasmic membrane and intermediate-density fractions.
    supported_by:
    - reference_id: PMID:3053640
      supporting_text: >-
        After extensive separation of the membranes by isopycnic sucrose gradient centrifugation, the lysis protein was present predominantly in the cytoplasmic membrane and in a fraction of intermediate density and, to a lesser degree, in the outer membrane, irrespective of the conditions of growth.
