id: P03609
gene_symbol: L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:12022
  label: Escherichia phage MS2
description: >-
  Single-gene lysis (L) protein of Escherichia phage MS2, a 75-amino-acid polypeptide
  encoded in an overlapping reading frame spanning the 3' end of the coat protein gene
  and the 5' end of the replicase gene. It inserts into the host Escherichia coli cell
  envelope—predominantly the cytoplasmic membrane and inner-outer membrane adhesion
  zones—where it compromises cell envelope integrity and induces the host autolytic
  system to cause cytolytic release of progeny virions.
