  review:
    summary: >-
      Immunoelectron microscopy demonstrates localization of MS2 L protein to the
      host cytoplasmic membrane and inner-outer membrane adhesion sites.
    action: ACCEPT
    reason: >-
      PMID:2656650 directly localizes the MS2 lysis protein in the Escherichia coli
      cell envelope, showing enrichment at membrane adhesion sites connecting the
      inner (plasma) and outer membranes.
    supported_by:
    - reference_id: PMID:2656650
      supporting_text: >-
        It is concluded that lysis of the host, E. coli, was a result of the formation of specific L-protein-mediated membrane adhesion sites.
- term:
