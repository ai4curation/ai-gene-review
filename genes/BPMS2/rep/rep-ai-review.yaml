  review:
    summary: >-
      The RdRp catalytic subunit binds ribonucleoside 5'-triphosphate substrates
      during RNA polymerization; valid but ancillary to its specific polymerase
      activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      As an RNA-directed RNA polymerase (EC 2.7.7.48), rep binds ribonucleoside
      5'-triphosphate substrates; this broad binding term is true but secondary to
      its core catalytic annotation GO:0003968.
