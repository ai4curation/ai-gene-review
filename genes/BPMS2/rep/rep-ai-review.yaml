      Plasmid-expressed MS2 replicase replicates negative-strand MS2 RNA into
      infectious positive-strand phage progeny in Escherichia coli spheroplasts.
    supporting_text: >-
      Transcribed, negative-strand MS2 RNA was infectious to spheroplasts containing either MS2 replicase or related bacteriophage Q beta replicase.
- id: file:BPMS2/rep/rep-uniprot.txt
  title: UniProtKB entry for BPMS2 rep (P00585)
  findings:
  - statement: >-
      MS2 rep is the catalytic beta subunit of the viral RNA-dependent RNA polymerase
      complex that replicates (+)-stranded viral genomes via a (-)-stranded
      intermediate.
    supporting_text: >-
      This is the catalytic subunit of the viral RNA-dependent RNA polymerase complex. This complex is involved in viral RNA replication that produces (+)-stranded genomes via a complementary, (-)-stranded intermediate.
  - statement: >-
      Forms the viral replicase holoenzyme together with host ribosomal protein S1,
      EF-Tu, and EF-Ts.
    supporting_text: >-
      Part of the viral RNA-dependent RNA polymerase complex, the other subunits are probably the host ribosomal protein S1, EF-Tu and EF-Ts.
suggested_questions:
- question: >-
    Why is the MS2 replicase holoenzyme substantially more labile in vitro than the
    homologous Qbeta replicase complex, and which differences at the beta-subunit
    interfaces with host EF-Tu and EF-Ts account for this stability difference?
suggested_experiments:
- description: >-
    Determine the cryo-EM structure of the assembled MS2 replicase holoenzyme (rep
    beta subunit bound to Escherichia coli EF-Tu, EF-Ts, and S1) stalled on a 3'-end
    MS2 genomic RNA template.
  hypothesis: >-
    Reduced hydrophobic buriability at the finger/thumb interface with EF-Tu:EF-Ts
    compared with Qbeta rep makes the MS2 replicase complex more dynamic and dependent
    on template RNA engagement for stabilization.
