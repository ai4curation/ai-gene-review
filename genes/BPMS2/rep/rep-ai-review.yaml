id: P00585
gene_symbol: rep
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:12022
  label: Escherichia phage MS2
description: >-
  Catalytic beta subunit of the Escherichia phage MS2 RNA-directed RNA polymerase
  (replicase) complex. It associates with host Escherichia coli translation elongation
  factors EF-Tu and EF-Ts and ribosomal protein S1 to form the active replicase
  holoenzyme that catalyzes viral RNA genome replication, synthesizing complementary
  negative-strand RNA intermediates and progeny positive-strand genomic RNAs.
