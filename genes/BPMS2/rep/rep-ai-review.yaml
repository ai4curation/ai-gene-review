core_functions:
- description: >-
    Catalyzes RNA-directed 5'-3' RNA polymerization as the catalytic beta subunit of
    the MS2 replicase holoenzyme (with host EF-Tu, EF-Ts, and ribosomal protein S1)
    to replicate the viral single-stranded RNA genome via a negative-strand
    intermediate.
  molecular_function:
    id: GO:0003968
    label: RNA-directed RNA polymerase activity
  directly_involved_in:
  - id: GO:0039694
    label: viral RNA genome replication
  supported_by:
