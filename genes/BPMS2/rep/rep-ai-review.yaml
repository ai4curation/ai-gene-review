  review:
    summary: >-
      Logical inference from RNA-directed RNA polymerase activity; in positive-strand
      ssRNA phages, synthesis of (+)-strand RNA also generates viral mRNA.
    action: KEEP_AS_NON_CORE
    reason: >-
      Because the positive-sense genomic RNA of MS2 also serves directly as mRNA,
      RNA-templated RNA synthesis produces coding transcripts; however, the primary
      biological process is viral RNA genome replication (GO:0039694).
