  review:
    summary: >-
      Cryo-electron tomography of MS2 bound to the F-pilus demonstrates that the
      single-copy maturation protein mediates attachment to the host pilus.
    action: ACCEPT
    reason: >-
      PMID:23810697 resolves the asymmetric structure of the MS2 virion bound to its
      F-pilus receptor, showing that the maturation protein occupies a 2-fold capsid
      position and forms the pilus attachment interface.
    supported_by:
