suggested_questions:
- question: >-
    How does F-pilus retraction trigger proteolytic cleavage of the maturation protein
    and release of the circularized genomic RNA-maturation protein complex from the
    T=3 capsid?
suggested_experiments:
- description: >-
    Perform time-resolved cryo-electron microscopy of MS2 virions bound to retracting
    Escherichia coli F-pili to capture structural intermediates of maturation protein
    detachment and genomic RNA ejection.
  hypothesis: >-
    Mechanical tension during F-pilus retraction pulls thepilus-bound maturation
    protein out of its two-fold axis slot, opening a portal for the attached 5' and
    3' genomic RNA ends to exit the capsid.
