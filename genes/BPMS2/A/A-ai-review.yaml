id: P03610
gene_symbol: A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:12022
  label: Escherichia phage MS2
description: >-
  Single-copy viral maturation protein (A protein) of Escherichia phage MS2 that
  replaces one coat protein dimer at a two-fold axis of the T=3 icosahedral capsid.
  It binds specific stem-loop sequences near both the 5' and 3' ends of the positive-sense
  single-stranded genomic RNA, circularizing the packaged genome, and mediates phage
  adsorption to the side of the host Escherichia coli F-pilus and subsequent delivery
  of the viral genome into the host cell.
