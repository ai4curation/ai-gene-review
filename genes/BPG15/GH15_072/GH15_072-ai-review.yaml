core_functions:
- description: >-
    Class II holin of bacteriophage GH15: an integral protein of the infected host cell's
    cytoplasmic membrane which, having accumulated there during virion morphogenesis,
    triggers to permeabilise and rupture that membrane, collapsing the proton motive force
    and releasing the cytoplasmic contents. This is the inner-membrane step of phage lysis
    and the event that allows the endolysin LysGH15 to reach the peptidoglycan, so that
    the cell bursts and the mature progeny virions are released. Both transmembrane
    domains are required for the activity, and premature triggering by 2,4-dinitrophenol
    identifies the protein as a true holin rather than a generically toxic membrane
    protein. No GO molecular function term is asserted: GO's two holin terms (GO:0015176,
    GO:0015832) were obsoleted as classes of gene products with only GO:0019835 cytolysis
    offered in their place, and GO:0140911 pore-forming activity is defined for insertion
    into the membrane of another cell, which does not describe a holin acting on the
    membrane of the cell that produced it. The broad-spectrum bactericidal activity of
    purified HolGH15 against non-host species is a property of the isolated protein and an
    antibacterial application, not a step of the phage life cycle, so it is deliberately
    not annotated as an interspecies process.
  supported_by:
  - reference_id: PMID:26873847
    supporting_text: >-
      This protein exhibited the structural characteristics of class II holins and
      belonged to the phage_holin_1 superfamily
    reference_section_type: ABSTRACT
  - reference_id: PMID:26873847
    supporting_text: >-
