    label: host cell plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:26873847
  qualifier: located_in
  review:
    summary: >-
      CACAO row (assigned_by CACAO, dated 2025-03-31, evidence ECO:0006042). What the
      cited paper shows for this gene: HolGH15 is ORF72 of the Staphylococcus aureus phage
      GH15 genome, a protein with two hydrophobic transmembrane helices and the structural
      characteristics of a class II holin of the phage_holin_1 superfamily; on expression
      in Escherichia coli BL21 it arrests host growth, the arrest is triggered prematurely
      by the proton-motive-force uncoupler 2,4-dinitrophenol, transmission electron
      microscopy shows loss of cytoplasmic membrane and cell wall integrity with release
      of intracellular components, and both transmembrane domains are indispensable for
      that activity. The term matches: a holin's site of action and residence is the
      cytoplasmic (plasma) membrane of the infected host cell, and GO:0020002 is the
      interspecies cellular-component term for exactly that compartment. The UniProt entry
      independently carries two Phobius transmembrane helices (25-44, 56-73), Pfam PF04531
      Phage_holin_1, NCBIfam TIGR01598 holin_phiLC3 and InterPro IPR006485
      Phage-like_holin, and DNP-triggerable arrest only makes sense for a protein embedded
      in an energised membrane.
    action: ACCEPT
    reason: >-
      Correct, appropriately specific, and the location where the core activity happens,
      so it is retained as a core function location. Two caveats were examined and neither
      changes the action. First, the cached publication is abstract-only (Europe PMC:
      isOpenAccess N, no PMC record; the publisher returns HTTP 403) and the abstract's
      membrane statements are predictions ("predicted to encode a membrane protein",
      "potentially consisted of two hydrophobic transmembrane helices"), so whatever direct
      localisation experiment backs the IDA is in the full text that the student curator
      read and this review cannot. Under the curator-deference rule that is not grounds to
      downgrade an experimental annotation whose claim is independently well supported.
      Second, the cells used were E. coli BL21, a heterologous expression host rather than
      GH15's host S. aureus, which brushes against the batch-1 CACAO shape
      "heterologous-system localization read as a host location" (Sindbis 6K in frog
      oocytes, phi29 p3 in a mammalian host cell nucleus). It does not instantiate it: the
      heterologous cell is itself a bacterium whose cytoplasmic membrane is the same
      structure as the real host's, GO:0020002 names no species, and the same paper shows
      the protein acting on S. aureus itself. The corpus precedent is sieA (BPP22), where
      GO:0020002 located_in is accepted for a phage protein in the bacterial inner
      membrane.
