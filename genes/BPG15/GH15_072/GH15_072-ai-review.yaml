gene_symbol: GH15_072
aliases:
- HolGH15
- ORF72
- holin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:760530
  label: Staphylococcus phage G15
description: >-
  GH15_072 (ORF72, named HolGH15 in the literature) is the holin of the virulent
  Staphylococcus aureus bacteriophage GH15, a 167-residue protein with two hydrophobic
  transmembrane helices and a long acidic, intrinsically disordered C-terminal tail. Its
  N-terminal domain organisation, two-helix topology and membership of the Phage_holin_1
  (PF04531) superfamily identify it as a class II holin. Holins are the inner-membrane
  arm of the two-component phage lysis system: synthesised late in infection, they
  accumulate harmlessly in the cytoplasmic membrane of the infected cell until, at a time
  programmed into the protein's own sequence, they trigger, collapsing the proton motive
  force and tearing large non-specific lesions in the membrane. That event both destroys
  membrane integrity and releases the soluble endolysin into the periplasm to hydrolyse
  the peptidoglycan, so the cell bursts and the mature progeny virions escape. Heterologous
  expression of HolGH15 reproduces the canonical holin behaviour - growth and respiration
  arrest, premature triggering by the proton-motive-force uncoupler 2,4-dinitrophenol, and
  loss of cytoplasmic membrane and cell wall integrity with escape of cell contents - and
  both of its transmembrane domains are required for that activity. Purified HolGH15 is
  also bactericidal when applied from outside the cell, permeabilising the membranes of
  S. aureus, Listeria monocytogenes and several unrelated Gram-positive and Gram-negative
  species; this broad antibacterial activity is a property of the isolated protein rather
  than a role in the phage life cycle, and has been pursued as an antibacterial and
  food-safety application. GH15 also encodes the well-characterised endolysin LysGH15,
  the muralytic partner predicted by the holin-endolysin model.
references:
- id: PMID:26873847
  title: 'Identification and characterization of HolGH15: the holin of Staphylococcus
    aureus bacteriophage GH15.'
  findings:
  - statement: >-
      ORF72 of the Staphylococcus aureus phage GH15 genome, designated HolGH15, encodes a
      predicted membrane protein with two hydrophobic transmembrane helices that has the
      structural characteristics of a class II holin and belongs to the phage_holin_1
      superfamily.
    supporting_text: >-
      The ORF72 gene (also designated HolGH15) derived from the genome of the
      Staphylococcus aureus phage GH15 was predicted to encode a membrane protein
    reference_section_type: ABSTRACT
  - statement: >-
      HolGH15 has the structural hallmarks of a class II holin (two transmembrane domains)
      and belongs to the phage_holin_1 family, the family UniProt also assigns from Pfam
      PF04531 and NCBIfam TIGR01598.
    supporting_text: >-
      This protein exhibited the structural characteristics of class II holins and
      belonged to the phage_holin_1 superfamily
    reference_section_type: ABSTRACT
  - statement: >-
      Expression of HolGH15 in E. coli arrests host growth, and the arrest is triggered
      prematurely by the proton-motive-force uncoupler 2,4-dinitrophenol - the
      diagnostic behaviour of a genuine holin rather than of a generically toxic membrane
      protein.
    supporting_text: >-
      Expression of HolGH15 in Escherichia coli BL21 cells resulted in growth retardation
      of the host cells, which was triggered prematurely by the addition of
      2,4-dinitrophenol
    reference_section_type: ABSTRACT
  - statement: >-
      Transmission electron microscopy of cells expressing HolGH15 shows loss of
      cytoplasmic membrane and cell wall integrity with release of intracellular
      contents, i.e. cytolysis.
    supporting_text: >-
      The expression of HolGH15 caused morphological alterations in engineered E. coli
      cells, including loss of the cell wall and cytoplasmic membrane integrity and
      release of intracellular components, which were visualized by transmission electron
      microscopy
    reference_section_type: ABSTRACT
  - statement: >-
      Both transmembrane domains are required for HolGH15 activity, tying the membrane
      lesion to the membrane-embedded part of the protein.
    supporting_text: >-
      Mutation analysis indicated that the two transmembrane domains of HolGH15 were
      indispensable for the activity of the full-length protein
    reference_section_type: ABSTRACT
  - statement: >-
      Applied from outside the cell, purified HolGH15 kills S. aureus and Listeria
      monocytogenes by evoking release of cellular contents, and inhibits a range of
      unrelated species. This is the isolated protein acting as an antibacterial agent,
      not a step of the GH15 life cycle.
    supporting_text: >-
      At the minimal inhibitory concentration, HolGH15 evoked the release of cellular
      contents and resulted in the shrinkage and death of Staphylococcus aureus and
      Listeria monocytogenes cells
    reference_section_type: ABSTRACT
  - statement: >-
      The paper's stated novelty is the heterologous antibacterial activity of a
      staphylococcal phage holin; no phage infection, lysis-timing or progeny-release
      experiment is reported in the abstract.
    supporting_text: >-
      this study is the first report of a Staphylococcus aureus phage holin that exerts
      antibacterial activity against heterogeneous pathogens
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified: the title, authors and journal in the cached record match the
      identifier, and the paper is specifically about this protein (GH15 ORF72 = HolGH15),
      so this is the right paper for both GOA rows. The cached entry is abstract-only
      (full_text_available: false); Europe PMC reports isOpenAccess N with no PMC record,
      and the publisher site returns HTTP 403, so the figures and methods could not be
      read. Judgements here therefore follow the curator-deference rule.
- id: PMID:32955931
  title: The Phage Holin HolGH15 Exhibits Potential As an Antibacterial Agent to Control
    Listeria monocytogenes.
  findings:
  - statement: >-
      Externally applied HolGH15 permeabilises the Listeria monocytogenes cytoplasmic
      membrane, releasing cytoplasmic beta-galactosidase, and kills the cells by
      destroying membrane integrity.
    supporting_text: >-
      In membrane permeabilization assays, the cytoplasmic β-galactosidase of L.
      monocytogenes treated with HolGH15 was released via an increase in the permeability
      of the membrane
    reference_section_type: ABSTRACT
  - statement: >-
      Electron microscopy attributes the bactericidal effect of HolGH15 specifically to
      membrane permeabilisation and loss of membrane integrity, confirming that the
      protein's activity is on the membrane itself.
    supporting_text: >-
      Electron microscopy observations indicated that HolGH15 exhibited excellent
      bactericidal potency by permeabilizing the cell membrane, damaging membrane
      integrity, and inducing cellular content shrinkage or loss
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified follow-up from the same work on the same protein; cached
      abstract-only. Relevant because it localises the activity to the membrane, but the
      organism treated is a non-host species and the protein is applied exogenously, so
      it supports the molecular activity rather than any life-cycle process term. Not
      cited by either GOA row.
- id: PMID:24585055
  title: 'Phage lysis: three steps, three choices, one outcome.'
  findings:
  - statement: >-
      In canonical phage lysis the holin itself ruptures the cytoplasmic membrane: it
      accumulates harmlessly there and then triggers to form micron-scale holes.
    supporting_text: >-
      the holin, accumulates harmlessly in the cytoplasmic membrane until triggering at an
      allele-specific time to form micron-scale holes
    reference_section_type: ABSTRACT
  - statement: >-
      Cryo-electron microscopy and tomography show that holin triggering alone produces
      massive interruptions in the cytoplasmic membrane, and that the lesions depend
      solely on the holin protein - the holin performs the membrane rupture, it does not
      merely permit it.
    supporting_text: >-
      ranging in scale up to > 1μm, is dependent solely on the function of the S105
      protein
    reference_section_type: RESULTS
  - statement: >-
      Holin triggering in the absence of any endolysin halts growth and respiration, bleeds
      cytoplasmic ions and small molecules to the medium and collapses the proton motive
      force - the phenotype Song et al. observed on heterologous expression of HolGH15.
    supporting_text: >-
      At the culture level, triggering of a holin, in the absence of endolysin function,
      is detected as a sudden halt in culture growth and respiration, with a loss of
      cytoplasmic ions and small molecules to the medium and a collapse of the proton
      motive force (pmf)
    reference_section_type: RESULTS
  - statement: >-
      Premature triggering by the uncoupler 2,4-dinitrophenol is the single most
      diagnostic property of a holin, which is what makes the DNP result in PMID:26873847
      identify HolGH15 as a genuine holin.
    supporting_text: >-
      The most important holin-specific feature that should be used is DNP-inducible
      triggering
    reference_section_type: DISCUSSION
  - statement: >-
      The alternative reading of holin function - that it acts upstream by letting the
      endolysin out - is about the endolysin's access to the peptidoglycan, not about
      whether the holin participates in lysis.
    supporting_text: >-
      the holin would form non-specific channels, or holes, in the cytoplasmic membrane
      allowing the endolysin to escape and attack the peptidoglycan
    reference_section_type: INTRODUCTION
  - statement: >-
      Lysis is what releases the progeny virions: when the final step is blocked the
      virions stay trapped inside the cell.
    supporting_text: >-
      Without spanin function, lysis is blocked and progeny virions are trapped in dead
      spherical cells
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Authoritative review of phage lysis by Ry Young, whose laboratory defined the
      holin-endolysin model; full text available in the cache. Used here for the mechanism
      of canonical holins and, decisively, for whether a holin performs or merely enables
      membrane rupture. Not a paper about GH15, so it supports the general mechanism
      rather than any claim specific to this protein.
- id: PMID:11018145
  title: 'Holins: the protein clocks of bacteriophage infections.'
  findings:
  - statement: >-
      Holins are small membrane proteins that accumulate in the membrane and, at a
      genetically programmed time, permeabilise it to the folded endolysin; destruction of
      the murein and bursting of the cell follow immediately.
    supporting_text: >-
      Destruction of the murein and bursting of the cell are immediate sequelae
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified classic review; cached abstract-only. Cited for the definition of
      the holin class and for the immediacy of lysis after triggering, which is why the
      holin sits inside the lysis process rather than upstream of it. Background, not
      evidence about GH15.
