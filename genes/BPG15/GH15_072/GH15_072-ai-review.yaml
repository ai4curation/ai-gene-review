- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IDA
  original_reference_id: PMID:26873847
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row (assigned_by CACAO, dated 2025-03-03, evidence ECO:0001847). What the cited
      paper shows for this gene: HolGH15 is the holin of phage GH15 and behaves as a
      canonical one - heterologous expression halts host growth, 2,4-dinitrophenol triggers
      it prematurely, electron microscopy shows loss of cytoplasmic membrane and cell wall
      integrity with release of intracellular components, and both transmembrane domains
      are required. The term matches the biology: GO:0044659 is defined as "The
      dissemination of mature viral particles from a host cell by the rupture of cell
      membranes and the loss of cytoplasm", and the holin performs the membrane-rupture
      step of that process, after which wall hydrolysis by the endolysin and escape of the
      progeny follow at once. It is also the term the rest of GOA uses for lysis-system
      proteins, including lambda S (the archetypal canonical holin) and LysGH15, this same
      phage's endolysin. The defect in this row is the qualifier, and a second, weaker
      concern is the evidence code; both are recorded in source_defects.
    action: ACCEPT
    reason: >-
      The claim is correct and the term is the right one, so the row is kept as a core
      function; what is wrong is the GAF qualifier.
      acts_upstream_of_or_within_positive_effect describes a gene product that influences a
      process it does not itself carry out, and this is the question the batch-3 screen
      raises for a holin, because a holin can be described either way: GO's own obsoleted
      holin term (GO:0015176) says the "Primary function of holins appears to be transport
      of murein hydrolases across the cytoplasmic membrane to the cell wall", and Young's
      review describes the holin as forming holes "allowing the endolysin to escape and
      attack the peptidoglycan". That upstream reading is about the endolysin's access to
      the wall, not about the process GO:0044659 names. The definition of GO:0044659
      includes "the rupture of cell membranes and the loss of cytoplasm", and the holin
      executes that rupture itself: cryo-EM shows the micron-scale membrane lesions are
      "dependent solely on the function of the S105 protein", holin triggering with no
      endolysin present already collapses the proton motive force and bleeds the cytoplasm,
      and "Destruction of the murein and bursting of the cell are immediate sequelae".
      HolGH15 is a class II (two-TMD) canonical holin, not a pinholin, and the paper's own
      TEM shows it destroying membrane integrity and releasing cell contents. So the
      protein is within the process and the correct qualifier is involved_in. The
      comparator evidence is unusually clean: of the 50 experimental annotations to
      GO:0044659 in GOA, 44 use involved_in, among them lambda S (P03705, IDA, UniProt),
      PRD1 endolysin XV (P13559, IDA, CACAO) and LysGH15 (D6QY02, IDA, CACAO) - the
      endolysin of this same phage, from the same laboratory. All six experimental rows on
      this term carrying a non-standard positive-effect qualifier are CACAO rows, and two
      of those genes (Q9T1W9, Q9T1X2) have a paired UniProt row with the same term, same
      reference and same evidence code qualified involved_in, so a professional curator
      working from identical input chose involved_in. Separately, no experiment in the
      cited paper follows an infection or measures release of progeny virions: every assay
      is heterologous expression or exogenous application of purified protein, which is the
      situation in which this project's LysK review deliberately chose IC over an
      experimental code. That is recorded as a second, SUSPECTED defect rather than a
      reason to reject the claim, since the inaccessible full text could contain an
      infection experiment the abstract does not mention. Neither defect touches the term,
      the reference or the gene product.
