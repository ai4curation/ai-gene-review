  knowledge_gaps:
  - gap_statement: >-
      Nothing is known about the lysis timing programmed into HolGH15 during a real GH15
      infection of Staphylococcus aureus. The holin has never been studied in an infected
      cell: there is no measurement of when it triggers, of the burst size, of the latent
      period, or of whether a holin-defective GH15 derivative fails to release progeny.
    boundary: >-
      What is established: HolGH15 is a class II holin of the phage_holin_1 family, both of
      its transmembrane domains are required, heterologous expression arrests growth and
      destroys cytoplasmic membrane and cell wall integrity, and 2,4-dinitrophenol triggers
      it prematurely, which is the diagnostic behaviour of a genuine holin. What is not:
      any observation of the protein during infection.
    gap_kind:
    - BIOLOGY
    significance: >-
      This is the evidential basis on which the GO:0044659 viral release row rests, and the
      reason the evidence code on that row is questioned above: the life-cycle outcome is
      inferred from holin class rather than observed.
    resolution: >-
      Lysis-timing and single-burst experiments on GH15-infected S. aureus, with a
      holin-defective derivative as comparator (see suggested_experiments).
    provenance:
    - reference_id: PMID:26873847
      supporting_text: >-
        this study is the first report of a Staphylococcus aureus phage holin that exerts
        antibacterial activity against heterogeneous pathogens
      reference_section_type: ABSTRACT
    - reference_id: PMID:24585055
      supporting_text: >-
        The most important holin-specific feature that should be used is DNP-inducible
        triggering
      reference_section_type: DISCUSSION
  - gap_statement: >-
      It is not known what kind of lesion HolGH15 makes. Canonical holins trigger to form a
      few micron-scale holes while pinholins form roughly a thousand small heptameric
      channels that only depolarise the membrane, and the two imply different partners and
      different molecular activities. HolGH15 has been assigned to class II on topology
      alone; no ultrastructural or channel measurement has been made on it.
    boundary: >-
      What is established: two hydrophobic transmembrane helices, both indispensable;
      membership of phage_holin_1 (PF04531) / TIGR01598; DNP-triggerable premature
      triggering; destruction of membrane and wall integrity with escape of cell contents
      in whole cells. What is not: the size, number or architecture of the lesion, and
      whether the long acidic disordered C-terminal tail (residues 114-167) has a
      regulatory role.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      The lesion type is what would determine whether any pore-forming molecular function
      term could ever apply, and whether GH15 lysis runs through a soluble endolysin or a
      SAR endolysin activated by depolarisation.
    resolution: >-
      Cryo-electron tomography of triggered cells plus electrophysiology on reconstituted
      HolGH15 (see suggested_experiments).
    provenance:
    - reference_id: PMID:24585055
      supporting_text: >-
        ranging in scale up to > 1μm, is dependent solely on the function of the S105
        protein
      reference_section_type: RESULTS
    - reference_id: PMID:26873847
      supporting_text: >-
        Mutation analysis indicated that the two transmembrane domains of HolGH15 were
        indispensable for the activity of the full-length protein
      reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    GO obsoleted both of its holin terms (GO:0015176 molecular function, GO:0015832
    biological process) as classes of gene products, offering only GO:0019835 cytolysis in
    their place, and GO:0140911 pore-forming activity is defined for insertion into the
    membrane of another cell. Would GO consider an activity-level term for programmed
    permeabilisation of the membrane of the cell in which the protein is produced, so that
    holins can be annotated at the molecular function level and not only to process terms?
- question: >-
    When does HolGH15 trigger during a GH15 infection of Staphylococcus aureus, and does a
    holin-defective GH15 derivative fail to release progeny virions? This is the one
    experiment that would make the GO:0044659 annotation direct rather than inferred from
    holin class.
- question: >-
    Does HolGH15 form the micron-scale lesions of a canonical holin, or the small heptameric
    channels of a pinholin? The class II topology assignment rests on hydropathy alone, and
    the answer determines whether LysGH15 escapes through holes or is a
    depolarisation-activated enzyme.
- question: >-
    What does the long acidic, intrinsically disordered C-terminal region (residues
    114-167, with an acidic stretch at 124-142) do? In lambda S and other holins the
    charged cytoplasmic tail influences triggering time, but it has not been tested in
    HolGH15, whose mutational analysis addressed only the two transmembrane domains.
- question: >-
    Why is purified HolGH15 bactericidal from outside the cell, and against species as
    distant as Pseudomonas aeruginosa and Klebsiella pneumoniae? A holin's natural substrate
    is the membrane of the cell that produced it, so exogenous activity on unrelated
    Gram-negative species implies a non-physiological route of insertion that is worth
    distinguishing from the life-cycle activity before the protein is developed as an
    antibacterial.
suggested_experiments:
- hypothesis: >-
    HolGH15 is the lysis clock of phage GH15: it triggers at an allele-specific time during
    infection, and loss of its function blocks release of progeny virions.
  description: >-
    Follow one-step growth of GH15 on Staphylococcus aureus, measuring optical density,
    proton motive force (with a membrane-potential dye) and extracellular versus
    intracellular plaque-forming units to separate the moment of membrane depolarisation
    from the moment of virion release. Repeat with an amber or deletion derivative of
    GH15_072 complemented in trans, and test whether 2,4-dinitrophenol advances lysis in
    the infected culture as it does on heterologous expression.
  experiment_type: phage one-step growth / lysis timing
- hypothesis: >-
    HolGH15 is a canonical holin that forms a small number of micron-scale lesions, rather
    than a pinholin forming many small channels.
  description: >-
    Image triggered cells by cryo-electron tomography, as was done for lambda S105, P2 Y and
    T4 T, counting and sizing the membrane interruptions; in parallel reconstitute purified
    HolGH15 into planar bilayers or proteoliposomes and record conductance to distinguish
    discrete heptameric channels from large non-specific lesions.
  experiment_type: cryo-electron tomography and electrophysiology
- hypothesis: >-
    HolGH15 and LysGH15 are the functional holin-endolysin pair of GH15, and the holin is
    what gives LysGH15 access to the peptidoglycan.
  description: >-
    Co-express HolGH15 and LysGH15 in a Gram-positive surrogate and compare lysis with
    either protein alone, assaying peptidoglycan hydrolysis and release of a cytoplasmic
    reporter; test whether a holin-independent SAR-type signal peptide is present in
    LysGH15 by probing its membrane association before triggering.
  experiment_type: reconstitution of the lysis system
- hypothesis: >-
    The acidic disordered C-terminal tail of HolGH15 tunes its triggering time.
  description: >-
    Make progressive C-terminal truncations and charge-neutralising substitutions across
    residues 114-167, express each in E. coli and measure the time to growth arrest and the
    2,4-dinitrophenol sensitivity, so that advance, delay and abolition of triggering can
    be distinguished as they are for lambda S alleles.
  experiment_type: structure-function analysis
- hypothesis: >-
    Exogenous bactericidal activity of purified HolGH15 proceeds by a different route of
    membrane insertion from the one used in the phage life cycle.
  description: >-
    Compare the concentration dependence, lipid requirement and energy dependence of
    killing by externally applied HolGH15 with the properties of triggering on internal
    expression, using liposomes of defined composition, de-energised cells and the
    transmembrane-domain mutants already shown to abolish the internal activity. If the
    mutants retain exogenous killing, the two activities are mechanistically distinct.
  experiment_type: comparative membrane permeabilization assay
