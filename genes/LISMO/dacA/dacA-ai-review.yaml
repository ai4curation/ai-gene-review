  label: Listeria monocytogenes EGD-e
description: DacA (CdaA) is the membrane-anchored diadenylate cyclase of Listeria monocytogenes. Its cytoplasmic
  DAC domain condenses two ATP molecules into cyclic di-AMP, a second messenger important for bacterial ionic
  and osmotic homeostasis. The catalytic domains must approach in a productive face-to-face arrangement; the
  isolated catalytic protein is dimeric in solution. Secreted cyclic di-AMP can also be sensed by host innate
  immune pathways, a consequence distinct from the bacterial enzyme reaction.
