proposed_new_terms:
- proposed_name: cyclic di-AMP biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of cyclic di-AMP (3′,3′-cyclic
    diadenosine monophosphate).
  justification: QuickGO searches on 2026-11-04 for cyclic di-AMP biosynthesis and cyclic dinucleotide biosynthesis
    found no specific biological-process term. GO:0106408 describes the catalytic activity, not the process.
    GO:0006171 specifies monomeric cAMP and is chemically incorrect here. GO:0009190 was checked but defines
    a phosphate diester linking two positions on one sugar residue, which does not describe the two-sugar cyclic
    dinucleotide unambiguously. The broader GO:0009165 nucleotide biosynthetic process is used as the proposed
    parent. Diadenylate cyclases directly perform the two-ATP condensation that produces c-di-AMP, so this
    proposal concerns a biosynthetic participant rather than a consumed substrate or an indirect phenotype.
    The definition, parent and justification are shared across the CdaA/DacA proposals.
  proposed_parent:
    id: GO:0009165
    label: nucleotide biosynthetic process
  supported_by:
  - reference_id: PMID:25605729
    supporting_text: both truncated DACs form c-di-AMP in vivo
