id: A0A1S3Y076
gene_symbol: A0A1S3Y076
taxon:
  id: NCBITaxon:4097
  label: Nicotiana tabacum
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a tobacco protein-only RNase P (PRORP), a
  PPR-family single-subunit enzyme that removes 5' leaders from pre-tRNAs. The protein
  has no GOA annotations. ProTrek identifies the RNase P biology confidently - this query
  produces the highest free-text Function score in the benchmark (20.0, retrieving the
  PRORP description verbatim: "Endonuclease RNase P responsible for the 5' maturation of
  tRNA precursors") - but its GO channel converts that into the *animal* mitochondrial
  RNase P holoenzyme picture: a multi-subunit complex at rank 1 and mitochondrial tRNA
  processing terms below it. Plant PRORPs are single-subunit enzymes and the Arabidopsis
  paralogs split between organelles and nucleus, so neither the complex nor the exclusive
  mitochondrial placement follows. The core molecular function, ribonuclease P activity
  (GO:0004526), never appears in the top 25 - only a parent term (endonuclease activity,
  active with either ribo- or deoxyribonucleic acids, producing 5'-phosphomonoesters) at
  rank 20. Two of the top-three calls also resolve to obsoleted GO terms.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/TOBAC/A0A1S3Y076/A0A1S3Y076-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0030678
      label: mitochondrial ribonuclease P complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Top-ranked hit (score 17.85). This term denotes the animal mitochondrial RNase P
        holoenzyme (TRMT10C/MRPP1, HSD17B10/MRPP2, PRORP/MRPP3). Plants replaced the
        ribonucleoprotein RNase P entirely with single-subunit PRORP enzymes that act
        without partner subunits, so a plant PRORP is not part of this complex. The call
        also fixes the localisation to mitochondria, whereas Arabidopsis PRORP1 is
        dual-targeted to chloroplasts and mitochondria and PRORP2/3 are nuclear; the tobacco
        paralog's compartment is not established. The retrieval has found the right enzyme
        and imported the wrong kingdom's architecture with it.
      supported_by:
        - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-deep-research-falcon.md
          supporting_text: >-
            [PRORP] catalyzes the essential endonucleolytic removal of 5-prime leader sequences
            from precursor transfer RNAs (pre-tRNAs)
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0072684
      label: mitochondrial tRNA 3'-trailer cleavage, endonucleolytic
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 17.00). Wrong end of the tRNA: PRORP performs 5'-leader removal, while
        3'-trailer cleavage is the job of RNase Z (ELAC2). The two activities are adjacent
        steps in tRNA maturation and are frequently described together in the same UniProt
        entries, which is likely how the retrieval conflated them - but for annotation
        purposes they are different enzymes. The term is additionally obsolete in the current
        GO release.
      supported_by:
        - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-deep-research-falcon.md
          supporting_text: >-
            [PRORP] catalyzes the essential endonucleolytic removal of 5-prime leader sequences
            from precursor transfer RNAs (pre-tRNAs)
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1905267
      label: endonucleolytic cleavage involved in tRNA processing
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 15.92). Biologically this is correct and appropriately general - PRORP
        is exactly an endonuclease acting in tRNA processing - and it is the closest the GO
        channel comes to the review's core process (tRNA 5'-leader removal, GO:0001682). It
        is recorded as UNC rather than as a correct call because GO obsoleted the term after
        ProTrek's index was built, so it cannot be entered as an annotation; the usable
        equivalent would have to be chosen by a curator. This is the clearest single case in
        the benchmark where index staleness, not model error, blocks a correct prediction.
      supported_by:
        - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-deep-research-falcon.md
          supporting_text: >-
            [PRORP] catalyzes the essential endonucleolytic removal of 5-prime leader sequences
            from precursor transfer RNAs (pre-tRNAs)
