id: A0A1S3Y076
gene_symbol: A0A1S3Y076
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:4097
  label: Nicotiana tabacum
description: >-
  A0A1S3Y076 (LOC107770656) encodes a nuclear-type proteinaceous RNase P (PRORP) of common tobacco,
  a single-polypeptide endonuclease that removes the 5' leader from precursor tRNAs (EC 3.1.26.5).
  The 540-residue protein consists of an N-terminal pentatricopeptide repeat (PPR) region that
  recognises the pre-tRNA body, a central zinc-binding region and a C-terminal NYN-type
  metallonuclease domain; all four catalytic aspartates and the four zinc ligands of characterised
  plant PRORPs are conserved. It belongs to the PRORP2 subfamily of the PRORP family, together with
  Arabidopsis PRORP2, and lacks the organellar transit peptide carried by the chloroplast and
  mitochondrial enzyme PRORP1. By analogy with Arabidopsis PRORP2, which localises to the nucleus,
  requires Mg2+ for catalysis and processes nuclear-encoded pre-tRNAs, the tobacco protein is
  expected to carry out 5' maturation of nuclear-encoded (cytosolic) tRNAs. In land plants
  protein-only enzymes of this family supply RNase P activity in the nucleus and in the organelles,
  in place of the ribonucleoprotein RNase P found in most other eukaryotes. No experimental data
  exist for the tobacco protein itself.

existing_annotations:
- term:
    id: GO:0004526
    label: ribonuclease P activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      PAINT assertion at PANTHER node PTN001005190, a eukaryote-wide node over plant PRORP1/2/3 and
      animal and trypanosome PRORPs, seeded by Arabidopsis PRORP1/2/3, Drosophila mldr, human PRORP
      and two Trypanosoma brucei proteins. The tobacco protein lies inside this clade (PTHR13547:SF13,
      the same subfamily as Arabidopsis PRORP2) and retains the complete NYN catalytic site.
    action: ACCEPT
    reason: >-
      Ribonuclease P activity is the defining activity of the family and has been measured directly
      for the subfamily member Arabidopsis PRORP2, which cleaves nuclear pre-tRNAs in a Mg2+-dependent
      manner. The target sits within the PAINT clade and has all catalytic aspartates (D310, D386,
      D387, D405) and zinc ligands of PRORP1 conserved, so there is no indication of loss of activity.
      Plant PRORPs are active as single proteins, so the activity is properly attributed to the
      polypeptide.
    supported_by:
    - reference_id: PMID:26655022
      supporting_text: >-
        Our biochemical studies indicate that PRORP2 requires Mg(2+) for catalysis and catalyzes the
        maturation of nuclear encoded substrates up to 10-fold faster than mitochondrial encoded
        precursor nad6 t-element under single-turnover conditions.
    - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        All eight PRORP1 metal-binding residues are conserved in the target
    - reference_id: PMID:22549728
      supporting_text: >-
        protein-only RNase P enzymes called PRORP (for proteinaceous RNase P) support
        RNase P activity in vivo in both organelles and the nucleus in Arabidopsis.

- term:
    id: GO:0001682
    label: tRNA 5'-leader removal
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PAINT assertion at PTN001005190 seeded by Arabidopsis PRORP1, PRORP2 and PRORP3, whose in vivo
      roles in organellar and nuclear pre-tRNA 5' maturation were shown genetically. The enzyme
      itself catalyses the step, so this is genuine process participation.
    action: ACCEPT
    reason: >-
      tRNA 5'-leader removal is the process directly executed by RNase P activity. The tobacco protein
      is in the PRORP2 subfamily and is catalytically intact. The seed set includes the subfamily
      member PRORP2, for which nuclear RNase P function in vivo is documented.
    supported_by:
    - reference_id: PMID:26655022
      supporting_text: >-
        thaliana PRORP2 and PRORP3 can catalyze the maturation of the 5′ ends of two nuclear
        pre-tRNA substrates in vivo, confirming their predicted roles as RNase Ps in the nucleus
    - reference_id: PMID:22549728
      supporting_text: >-
        RNase P is an essential enzyme that cleaves the 5' leader sequence of tRNA
        precursors.

