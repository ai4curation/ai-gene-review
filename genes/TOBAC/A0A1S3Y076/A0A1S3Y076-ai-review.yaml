- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: PMID:26655022
  qualifier: located_in
  review:
    summary: >-
      Proposed location. The tobacco protein is in PANTHER subfamily PTHR13547:SF13 with Arabidopsis
      PRORP2, a nuclear protein, and is about equally close to the other nuclear paralog PRORP3; it is
      more distant from the organellar PRORP1 (SF1) and has no N-terminal transit-peptide extension.
    action: NEW
    reason: >-
      Compartment is the property that distinguishes the plant PRORP subfamilies (PRORP1 organellar,
      PRORP2/PRORP3 nuclear), so subfamily membership plus absence of a targeting presequence supports
      nuclear localisation. PAINT made no cellular-component assertion for the plant PRORP nodes, so
      this does not contradict a curator decision. Direct localisation in tobacco has not been tested.
    supported_by:
    - reference_id: PMID:26655022
      supporting_text: >-
        PRORP2 and PRORP3 localize to the nucleus and PRORP1 localizes to the chloroplast and the
        mitochondria
    - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        extension corresponding to the PRORP1 organellar transit peptide

