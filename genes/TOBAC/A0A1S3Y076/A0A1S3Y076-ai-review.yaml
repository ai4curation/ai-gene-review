proposed_new_terms: []

suggested_questions:
- question: >-
    Tobacco is allotetraploid; does A0A1S3Y076 have a homeolog, and are both copies of the nuclear
    PRORP expressed and functionally redundant, as Arabidopsis PRORP2 and PRORP3 are?
- question: >-
    Does the tobacco nuclear PRORP associate with TRM1-type m2,2G26 methyltransferases as
    Arabidopsis PRORP2 does?

suggested_experiments:
- description: >-
    Fluorescent-protein fusion of A0A1S3Y076 transiently expressed in N. benthamiana or tobacco
    leaves, imaged with nuclear, plastid and mitochondrial markers.
  hypothesis: >-
    A0A1S3Y076 localises to the nucleus and not to organelles, as expected for a PRORP2-subfamily
    protein lacking a transit peptide.
- description: >-
    In vitro cleavage assay with recombinant A0A1S3Y076 on a nuclear-encoded pre-tRNA, with a
    D386A/D387A catalytic mutant as negative control.
  hypothesis: >-
    The protein cleaves the 5' leader at the canonical RNase P site in a Mg2+-dependent manner and
    the catalytic mutant is inactive.
