id: A0A1S3Y076
gene_symbol: A0A1S3Y076
taxon:
  id: NCBITaxon:4097
  label: Nicotiana tabacum
status: COMPLETE
description: >-
  Nuclear-type proteinaceous RNase P (PRORP2 subfamily) of tobacco. Its single ProtNLM2 prediction, tRNA
  processing, is correct but is an ancestor of the accepted tRNA 5'-leader removal annotation.
source_documents:
  - genes/TOBAC/A0A1S3Y076/A0A1S3Y076-uniprot.txt
  - genes/TOBAC/A0A1S3Y076/A0A1S3Y076-goa.tsv
  - publications/PMID_22549728.md
  - publications/PMID_26655022.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0008033
      label: tRNA processing
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target is a catalytically intact PRORP in PANTHER subfamily PTHR13547:SF13 with Arabidopsis
        PRORP2, and the gene already carries tRNA 5'-leader removal (GO:0001682, IBA and IEA), which the
        gene review accepts. Arabidopsis PRORP2 and PRORP3 mature nuclear pre-tRNA 5' ends in vivo
        (PMID:26655022) and PRORPs supply RNase P activity in plants (PMID:22549728), justifying the
        subfamily transfer. GO:0008033 tRNA processing is an is_a ancestor of GO:0001682 (OLS4), so the
        prediction is correct but less specific than the existing supported annotation. No tobacco-specific
        experimental literature was found in PubMed.
      supported_by:
        - reference_id: file:TOBAC/A0A1S3Y076/A0A1S3Y076-uniprot.txt
          supporting_text: >-
            DR   PANTHER; PTHR13547:SF13; PROTEINACEOUS RNASE P 2; 1.
        - reference_id: PMID:26655022
          supporting_text: >-
            thaliana PRORP2 and PRORP3 can catalyze the maturation of the 5′ ends of two nuclear
            pre-tRNA substrates in vivo, confirming their predicted roles as RNase Ps in the nucleus
        - reference_id: PMID:22549728
          supporting_text: >-
            cleaves the 5' leader sequence of tRNA precursors
