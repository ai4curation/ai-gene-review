suggested_questions:
- question: >-
    Is Mri1 required for methionine recycling in flies, and does its loss phenocopy Adi1 mutants (fecundity
    defect under dietary restriction rescued by methionine)?
suggested_experiments:
- description: >-
    Generate Mri1 mutants and measure 5-methylthioribose 1-phosphate and methionine levels in ovaries
    under dietary restriction.
  hypothesis: >-
    Mri1 loss blocks methionine salvage and reduces fecundity under dietary restriction, as for Adi1.
