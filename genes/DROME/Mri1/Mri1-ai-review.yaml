taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Mri1 encodes the methylthioribose-1-phosphate isomerase of Drosophila melanogaster, a member of the
  eIF-2B alpha/beta/delta subunit-like family that catalyses the second step of the methionine salvage
  pathway, the isomerization of 5-methylthioribose 1-phosphate (produced by Mtap from 5'-methylthioadenosine)
  to 5-methylthioribulose 1-phosphate. Its activity and cytosolic localization are inferred from orthology
  to the characterized yeast and human enzymes; the fly protein has not been studied experimentally.
