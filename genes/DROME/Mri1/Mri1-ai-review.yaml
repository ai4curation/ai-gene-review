- term:
    id: GO:0033353
    label: L-methionine cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002460138
  - SGD:S000006322
  - UniProtKB:Q9BV20
  review:
    summary: L-methionine cycle (IBA) from PTN002460138; donors yeast MRI1, human MRI1 Q9BV20.
    action: MODIFY
    reason: >-
      GO:0033353 is defined as the SAM cycle (SAM, S-adenosylhomocysteine, homocysteine, methionine).
      Mri1 acts instead in the 5'-methylthioadenosine (MTA) salvage pathway that regenerates methionine
      from MTA, which matches L-methionine salvage (GO:0071267, "generates L-methionine from derivatives
      of it"). GO:0033353 is the replacement GO assigned to the obsoleted "L-methionine salvage from methylthioadenosine"
      term, so this row is a legacy migration; GO:0071267 is the more accurate term. Same replacement
      applied to all five methionine salvage enzymes (Mtap, Mri1, CG11134, Enoph, Adi1).
    proposed_replacement_terms:
    - &id001
      id: GO:0071267
      label: L-methionine salvage
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
