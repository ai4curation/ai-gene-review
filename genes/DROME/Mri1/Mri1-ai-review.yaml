  review:
    summary: Nucleus (IEA).
    action: KEEP_AS_NON_CORE
    reason: >-
      HAMAP assigns cytoplasm and nucleus to this enzyme family, and the vertebrate orthologs are detected
      in both compartments. A small soluble enzyme may enter the nucleus, but the salvage pathway is cytosolic
      and no fly data address nuclear localization; kept as non-core. Same treatment for all salvage enzymes
      carrying this term.
