descriptions:
- source: UniProt
  text: 'Component of the Rad9-Rad1-Hus1 (9-1-1) checkpoint clamp complex. . [Isoform
    A]: Targets the 9-1-1 complex to the nuclear periphery (PubMed:22666434). Targeting
    to the nuclear periphery is disrupted in the presence of persistent double stranded
    break DNA damage, possibly as a function of the meiotic checkpoint (PubMed:22666434).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/O96533
