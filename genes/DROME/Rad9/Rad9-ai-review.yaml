taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rad9 encodes the Drosophila ortholog of RAD9, the subunit of the Rad9-Rad1-Hus1 (9-1-1) checkpoint
  clamp that carries the C-terminal tail used to direct the complex and engage checkpoint activators.
  DmRad9 interacts directly with Hus1 and co-precipitates with Rad1 and Hus1. Two splice forms differ
  at the C terminus. DmRad9B is nuclear, whereas DmRad9A uses a 32-residue C-terminal extension to target
  the 9-1-1 complex to the nuclear envelope. DmRad9A localization is altered when the meiotic checkpoint
  is activated by DNA repair defects, suggesting a role at the nuclear periphery in the meiotic DNA damage
  response. Rad9 associates with Brca2, and Rad9 mutant females show persistent meiotic DSB signals and
  karyosome defects, with the Rad9B isoform being most effective at restoring efficient early meiotic
  break repair.
