suggested_questions:
- question: Does the Drosophila Rad9 C-terminal tail contain a TopBP1 (mus101)-binding motif needed to
    activate MEI-41, and do the two splice isoforms differ in checkpoint activity?
- question: Is the reported 3'-5' exonuclease activity of RAD9 intrinsic to the protein, or should the
    ISS transfer to Drosophila be withdrawn?
suggested_experiments:
- hypothesis: The nuclear-envelope-targeted Rad9A isoform is specifically required for the meiotic checkpoint.
  description: Generate isoform-specific Rad9 alleles and test meiotic checkpoint activation (Vasa modification,
    dorsal-ventral patterning) in DSB-repair mutant backgrounds.
