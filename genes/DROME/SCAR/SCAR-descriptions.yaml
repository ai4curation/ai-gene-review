descriptions:
- source: UniProt
  text: Downstream effector molecule involved in the transmission of signals from
    tyrosine kinase receptors and small GTPases to the actin cytoskeleton. Promotes
    formation of actin filaments. Part of the WAVE complex that regulates lamellipodia
    formation. The WAVE complex regulates actin filament reorganization via its interaction
    with the Arp2/3 complex.
  source_type: curated
  url: https://www.uniprot.org/uniprot/X2J5L4
  source_id: X2J5L4
