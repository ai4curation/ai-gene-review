- source: Alliance_Automated
  text: Predicted to enable Arp2/3 complex binding activity and protein kinase A regulatory
    subunit binding activity. Involved in several processes, including actin cytoskeleton
    organization; generation of neurons; and positive regulation of cellular component
    organization. Located in several cellular components, including apical part of
    cell; basal part of cell; and nucleus. Part of SCAR complex. Is expressed in adult
    head; indirect flight muscle cell; larval longitudinal connective; presumptive
    embryonic/larval central nervous system; and symmetrical commissure. Human ortholog(s)
    of this gene implicated in epilepsy. Orthologous to human WASF1 (WASP family member
    1); WASF2 (WASP family member 2); and WASF3 (WASP family member 3).
