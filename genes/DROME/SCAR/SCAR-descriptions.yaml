    overall_notes: 'Correct: links RTK and GTPase signals to actin, part of the WAVE
      complex for lamellipodia, acts through Arp2/3.'
- source: Alliance_Imported
  text: SCAR (SCAR) encodes a primary regulator of the Arp2/3 complex, which promotes
    actin polymerization and influences cell shape and motility. It is involved in
    myoblast fusion, eye morphogenesis and axogenesis.
