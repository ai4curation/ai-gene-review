id: X2J5L4
gene_symbol: SCAR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SCAR (WAVE) is the single Drosophila member of the SCAR/WAVE subfamily of WASP-family nucleation-promoting
  factors. Its C-terminal VCA region binds actin monomers and the Arp2/3 complex and stimulates nucleation
  of branched actin filament networks. SCAR is held inactive within the five-subunit WAVE regulatory complex
  (with Cyfip/Sra-1, Hem/Kette, Abi and HSPC300), which stabilises it against proteasomal degradation
  and couples its activation to Rac signalling and to membrane receptors carrying WIRS motifs. SCAR drives
  lamellipodia and other cortical protrusions in cultured cells, macrophages and epithelia, and is required
  for myoblast fusion, axon growth and guidance, neuronal migration, egg chamber development and integrity
  of integrin junctions.
