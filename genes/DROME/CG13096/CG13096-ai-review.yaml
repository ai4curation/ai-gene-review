- id: file:DROME/CG13096/CG13096-deep-research-falcon.md
  title: CG13096 falcon deep research report
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Its gene-specific content comes almost entirely from one unpublished doctoral thesis
      (Hoecker 2022, Heidelberg, doi:10.11588/heidok.00031917, "The role of a satellite III
      RNA-associated nucleolar complex in Drosophila oogenesis"). I could not open the thesis (the
      repository returned an access-denied page). A web search snippet from the repository does
      confirm the thesis exists and describes the Centagon complex as nucleolar in ovarian germ and
      somatic cells, with RNAi germline defects. The CG13096-specific details (Centagon 3 naming,
      EMSA, GFP knock-in) are relayed by the LLM report and not independently verified. Its
      statement that RSL1D1 is the human orthologue matches the orthology resources but not
      PANTHER. Used only for hedged statements.
existing_annotations: []
core_functions:
- description: >-
    Putative nucleolar RNA-binding protein of the divergent eukaryotic ribosomal-L1-domain (RSL1D1/Utp30/Cic1-like)
    lineage, presumably acting in ribosome biogenesis. The RNA-binding activity and nucleolar location are
    reported only in unpublished thesis work, and the family placement is contested (PANTHER puts CG13096 in a
    separate family). No specific step in ribosome assembly or rRNA processing has been shown.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: file:DROME/CG13096/CG13096-deep-research-falcon.md
    supporting_text: Subsequent in-vitro binding assays showed that Centagon 3 bound both satellite-III
      RNA and a tubulin transcript.
  - reference_id: file:DROME/CG13096/CG13096-deep-research-falcon.md
    supporting_text: Its GFP signal overlapped the nucleolar marker Modulo
  - reference_id: file:DROME/CG13096/CG13096-bioinformatics/RESULTS.md
    supporting_text: all place CG13096 with the RSL1D1/UTP30/CIC1 lineage of nucleolar ribosomal-L1-domain
      proteins, with human RSL1D1 and worm F53F4.11 as the closest metazoan relatives.
  knowledge_gaps:
  - gap_statement: >-
      It is not known which RNA(s) CG13096 binds in vivo, whether it associates with pre-ribosomal
      particles, and which ribosomal subunit's biogenesis (if either) depends on it. RNA binding was
      reportedly not sequence-specific in vitro.
    gap_kind:
    - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    Is CG13096 the Drosophila counterpart of human RSL1D1 (as OrthoFinder, OrthoInspector, PhylomeDB,
    SonicParanoid, eggNOG KOG1685 and OrthoDB suggest), or does PANTHER's separation of it into PTHR48162,
    with Candida NRI1 and Dictyostelium DDB_G0279335, reflect a real lineage-specific split? A PAINT node
    for the RSL1D1/Utp30/Cic1 lineage would decide whether any IBA transfer to CG13096 is appropriate.
- question: >-
    Will the Centagon thesis data (nucleolar GFP knock-in, RNA binding, germline RNAi phenotypes) be
    published so that FlyBase can replace the current ND annotations on Q9VLK2 with experimental ones?
suggested_experiments:
- description: >-
    Check whether CG13096 co-sediments with pre-40S or pre-60S particles, and map pre-rRNA processing
    intermediates (northern blot or pulse-chase) after CG13096 RNAi in S2 cells, with an RNAi-resistant
    rescue construct to rule out off-target effects.
  experiment_type: Sucrose gradient fractionation and pre-rRNA processing analysis
- description: >-
    Identify the RNAs bound by endogenous CG13096 in vivo with CLIP/eCLIP from a tagged knock-in line,
    to test whether it contacts specific rRNA sites as the uL1 fold does in the ribosome.
  experiment_type: CLIP-seq
