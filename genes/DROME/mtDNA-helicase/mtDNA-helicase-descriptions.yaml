- source: Alliance_Imported
  text: mitochondrial DNA helicase (mtDNA-helicase) encodes the replicative mitochondrial
    DNA helicase, which is responsible for NTPase-dependent double-stranded DNA unwinding
    during mitochondrial DNA replication. It has roles in mitochondrial genome maintenance,
    and mitochondrial function.
