descriptions:
- source: UniProt
  text: Mitochondrial helicase involved in mtDNA replication (PubMed:17272269, PubMed:19063859,
    PubMed:22952820, PubMed:25023283). Might have a role in mtDNA repair (By similarity).
    Has DNA strand separation activity needed to form a processive replication fork
    for leading strand synthesis which is catalyzed by the formation of a replisome
    complex with POLG and mtSDB (By similarity). Preferentially unwinds DNA substrates
    with pre-existing 5'-and 3'- single-stranded tails but is also active on a 5'-
    flap substrate (By similarity). Can dissociate the invading strand of immobile
    or mobile D-loop DNA structures irrespective of the single strand polarity of
    the third strand (By similarity). In addition to its DNA strand separation activity,
    also has DNA strand annealing, DNA strand-exchange and DNA branch migration activities
    (By similarity).
  source_type: curated
