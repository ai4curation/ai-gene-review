- source: Alliance_Automated
  text: Enables 2 iron, 2 sulfur cluster binding activity; DNA binding activity; and
    lipid binding activity. Involved in mitochondrial DNA replication. Located in
    mitochondrion. Used to study autosomal dominant progressive external ophthalmoplegia
    with mitochondrial DNA deletions 3 and autosomal dominant progressive external
    ophthalmoplegia with mitochondrial DNA deletions 5. Human ortholog(s) of this
    gene implicated in Perrault syndrome; autosomal dominant progressive external
    ophthalmoplegia with mitochondrial DNA deletions 3; chronic progressive external
    ophthalmoplegia; and mitochondrial DNA depletion syndrome 7. Orthologous to human
    TWNK (twinkle mtDNA helicase).
