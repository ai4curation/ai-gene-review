gene_symbol: mtDNA-helicase
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'mtDNA-helicase encodes the Drosophila ortholog of human TWINKLE, the hexameric superfamily
  4 replicative DNA helicase of the mitochondrial replisome, related to the bacteriophage T7 gene 4 primase-helicase.
  Its C-terminal domain carries the NTPase and 5''-3'' duplex-unwinding activity, whereas the N-terminal
  primase-like domain has lost primase activity but coordinates a 2Fe-2S cluster, binds single- and double-stranded
  DNA, and binds cardiolipin-rich membranes in vitro. The helicase acts with DNA polymerase gamma and
  mtSSB at mtDNA nucleoids: RNAi knockdown lowers mtDNA copy number about five-fold, overexpression raises
  it, and active-site or disease-analogous mutants deplete mtDNA in a dominant-negative manner.'
