suggested_questions:
- question: Does the 2Fe-2S cluster in the N-terminal domain of the fly mtDNA helicase sense redox or
    DNA-mediated charge transfer to regulate replication, beyond stabilizing the protein?
suggested_experiments:
- description: Purify full-length fly mtDNA helicase and measure unwinding polarity and rate, with and
    without an intact 2Fe-2S cluster, alone and with Pol gamma and mtSSB.
