suggested_questions:
- question: >-
    Is Drosophila Arfrp1 (CG7039) N-terminally acetylated on Met1 by Drosophila NatC (Naa30A /
    CG11412) and required in vivo to recruit Arl1 (Arf72A), Sec71, and dGolgin-245 to the
    trans-Golgi in S2 cells and polarized epithelia?
suggested_experiments:
- description: >-
    Generate CRISPR knockout and C-terminally tagged endogenous knock-in alleles of CG7039
    (Arfrp1) in Drosophila S2 cells and wing-disc epithelia, testing whether loss of CG7039 or
    NatC (CG11412) or Sys1 (CG7578) displaces Arl1 (Arf72A), Sec71, and dGolgin-245 from the
    trans-Golgi and impairs DE-cadherin surface delivery.
