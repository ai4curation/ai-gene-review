- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: >-
      FlyBase ND annotation recording the absence of direct Drosophila melanogaster literature
      establishing endogenous subcellular localization for CG7039; accept per ND guideline
      with nd_case INFERABLE.
    action: ACCEPT
    reason: >-
      Per the ND annotation policy, an ND row asserts that literature on this gene product in
      Drosophila melanogaster identifies no cellular component, and IBA/IEA rows do not make
      it stale. Targeted searches of PubMed and FlyBase references for CG7039 / FBgn0030088 /
      Arfrp1 retrieved PMID:22291037 (which replaced the N-terminal amphipathic helix of
      CG7039 with a His10 tag for in vitro liposome affinity chromatography and never assayed
      in vivo localization), PMID:19001129, and PMID:37891180, confirming zero primary
      localization experiments on Drosophila Arfrp1 while Golgi localization is clearly
      inferable from orthologs (nd_case: INFERABLE).
    nd_case: INFERABLE
    additional_reference_ids:
    - PMID:22291037
    - PMID:19001129
    - PMID:37891180
    supported_by:
    - reference_id: file:DROME/Arfrp1/Arfrp1-notes.md
      supporting_text: >-
        Search log (2026-11-15): PubMed and FlyBase literature queries for CG7039,
        FBgn0030088, and Drosophila Arfrp1 or ARP1 retrieved PMID:22291037 (Christis and Munro
        2012, which expressed His10-tagged truncated CG7039 on liposomes in vitro without
        detecting candidate effectors and did not assay endogenous subcellular localization or
        in vivo biological process in Drosophila), PMID:19001129 (Sinka et al. 2008 on
        Drosophila golgins and Arl1), and PMID:37891180 (2023 study of Drosophila NatC CG11412
        mentioning human ARFRP1 and yeast Arl3 only as background examples), confirming that
        no published study in Drosophila melanogaster establishes an in vivo cellular
        component or biological process for Arfrp1.
