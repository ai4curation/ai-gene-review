    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Unreviewed TrEMBL record for Drosophila melanogaster Arfrp1 (CG7039) carries accurate
      PANTHER PTHR45909:SF1 and InterPro Arf/Sar domain cross-references, but contains two
      erroneous automated text assertions: ARBA00037377 over-propagates mammalian intestinal
      chylomicron and hepatic VLDL lipidation phenotypes into an insect lacking a vertebrate
      liver and chylomicron/VLDL lipoproteins, and PROSITE-ProRule PRU00753 misclassifies this
      Arf-family GTPase into the Rab family.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9W389
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Required for the lipidation of chylomicrons in the intestine and
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: >-
        Automated rule ARBA:ARBA00037377 asserts in CC -!- FUNCTION that Drosophila Arfrp1 is
        "Required for the lipidation of chylomicrons in the intestine and required for VLDL
        lipidation in the liver." Insects lack a vertebrate liver and do not assemble
        chylomicrons or hepatic VLDL particles (transporting dietary lipids via lipophorin in
        hemolymph); restrict the mammalian lipoprotein-lipidation sentences of ARBA00037377 to
        Vertebrata/Mammalia while retaining the conserved trans-Golgi ARL1-targeting sentences.
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9W389
      slot: CC:SIMILARITY
      requested_change: CHECK
      asserted_value: Belongs to the small GTPase superfamily. Rab family.
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Automated rule PROSITE-ProRule:PRU00753 asserts "Belongs to the small GTPase
        superfamily. Rab family." on UniProtKB:Q9W389, whereas Q9W389 matches PS51417 (ARF),
        IPR006689 (Small_GTPase_ARF/SAR), IPR024156 (Small_GTPase_ARF), and PANTHER
        PTHR45909:SF1 and is an Arf-family GTPase ("Belongs to the small GTPase superfamily.
        Arf family.").
