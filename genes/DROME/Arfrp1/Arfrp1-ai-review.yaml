core_functions:
- description: >-
    Golgi-associated Arf-related small GTPase ortholog of human ARFRP1 and yeast Arl3p that
    binds and hydrolyzes GTP to promote Golgi recruitment of Arl1/golgin tethering machinery
    and Golgi-to-plasma-membrane protein transport.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0034067
    label: protein localization to Golgi apparatus
  - id: GO:0043001
    label: Golgi to plasma membrane protein transport
  - id: GO:0006886
    label: intracellular protein transport
  locations:
  - id: GO:0005794
    label: Golgi apparatus
  supported_by:
  - reference_id: PMID:9920936
    supporting_text: >-
      Biochemical studies of purified recombinant yARL3 protein revealed properties similar to
      those of ARF and ARL proteins, including the ability to bind and hydrolyze GTP.
  - reference_id: PMID:22291037
    supporting_text: >-
      Two of the Arls, ARFRP1 and Arl1, are known to be localized on the trans-Golgi and to
      have been proposed to function in both exocytosis and in retrograde traffic from
      endosomes (Lowe et al., 1996; Behnia et al., 2004; Nishimoto-Morita et al., 2009; Cheryl
      Chia and Gleeson, 2011).
