taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  ADP-ribosylation factor-related protein 1 (Arfrp1; annotation ID CG7039) is a 200-residue
  Drosophila melanogaster monomeric Arf-family small GTPase and the single 1:1 insect ortholog
  of human ARFRP1 and Saccharomyces cerevisiae Arl3p in PANTHER subfamily PTHR45909:SF1. Like
  its fungal and mammalian orthologs, Drosophila Arfrp1 lacks a Gly2 myristoylation site and
  conserves an N-terminal amphipathic helix starting with Met1-Tyr2 (1-MYTLMHGFYKYMTQ-14)
  suited for NatC-mediated N-acetylation and Sys1 (CG7578) binding at the Golgi apparatus,
  alongside an intact Walker A P-loop (24-GLDNAGKT-31), Switch II catalytic glutamine
  (75-DLGGQ-79), and G4 guanine-specificity motif (134-NKQD-137) supporting Golgi effector
  recruitment (Arl1/Arf72A and GRIP-domain golgins) and post-Golgi protein transport.
