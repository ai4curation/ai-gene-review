  findings:
  - statement: >-
      Expressed His10-tagged N-terminally truncated Drosophila CG7039 (Arfrp1) in GDP- and
      GTP-locked states on Ni-NTA liposomes incubated with S2 cell extracts and observed no
      differential effector enrichment without native membrane context.
    supporting_text: >-
      In the case of ARFRP1, the population of proteins bound to the GTP form appeared similar
      to that bound to the GDP form, and, thus, no candidate effectors could be identified
      (Fig. 2 A).
