taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG5611 encodes a 326-residue protein with a single crotonase-fold (enoyl-CoA
  hydratase/isomerase-like, PF00378) domain spanning residues 47-290. It belongs to PANTHER
  subfamily PTHR43802:SF1, whose members include the Drosophila paralog Srlp (CG5844) and
  bacterial enzymes with chemically distinct activities, including carbon-carbon bond-cleaving
  hydrolases. CG5611 keeps the oxyanion-hole glycine and the first catalytic glutamate of the
  crotonase fold, but the second catalytic glutamate of canonical enoyl-CoA hydratase appears to be
  replaced by asparagine. Its reaction, substrate, subcellular location and physiological role have
  not been determined experimentally; the only gene-specific data are from a large-scale RNAi
  behavioural screen.
