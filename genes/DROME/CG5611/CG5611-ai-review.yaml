core_functions: []
suggested_questions:
- question: Does CG5611 retain hydratase or isomerase activity on any 2- or 3-enoyl-CoA, given that
    the second catalytic glutamate of canonical enoyl-CoA hydratase appears to be replaced by asparagine?
- question: Is CG5611 targeted to the mitochondrial matrix like its PTHR43802:SF1 paralog Srlp (CG5844),
    and is its arginine-rich N-terminus a cleaved targeting presequence?
suggested_experiments:
- description: Express recombinant CG5611 and screen enoyl-CoA, 3-enoyl-CoA and beta-ketoacyl/oxo
    CoA-thioester substrates of different chain lengths, identifying products by LC-MS/MS. Test the
    N171E and E151Q mutants to establish which acid/base residues the reaction needs.
  experiment_type: enzyme activity assay
- description: Tag endogenous CG5611 and co-stain with mitochondrial and peroxisomal markers, then confirm
    the location by subcellular fractionation and protease-protection assays.
  experiment_type: subcellular localization
