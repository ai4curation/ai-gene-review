  review:
    action: ACCEPT
    summary: No molecular function has been demonstrated for CG5611, and the family evidence is not
      specific enough to assign one.
    reason: The crotonase fold establishes family membership but not a reaction. PTHR43802:SF1 holds
      enzymes with different chemistries (6-oxocamphor and 6-oxocyclohexene-carbonyl-CoA hydrolases,
      as well as predicted hydratases). No human or mouse ortholog lies in this PANTHER family, and the
      second catalytic glutamate of canonical enoyl-CoA hydratase appears to be replaced by asparagine
      in CG5611. The literature search found no biochemical study, so the ND placeholder stands.
    supported_by:
    - reference_id: file:DROME/CG5611/CG5611-deep-research-falcon.md
      supporting_text: However, no CG5611-specific biochemical study was found that identifies a reaction,
        substrate, product, kinetic parameters, catalytic residues, pathway, or intracellular compartment.
    - reference_id: file:DROME/CG5611/CG5611-bioinformatics/RESULTS.md
      supporting_text: The exact reaction remains unresolved
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    action: ACCEPT
    summary: No experimental localization exists for CG5611.
    reason: The fly paralog Srlp in the same PANTHER subfamily has an IDA mitochondrial matrix
      annotation, and the N-terminus of CG5611 is arginine-rich. Neither establishes that CG5611 is
      mitochondrial, and no targeting analysis or localization experiment for CG5611 is available.
      The ND placeholder stands.
    supported_by:
    - reference_id: file:DROME/CG5611/CG5611-deep-research-falcon.md
      supporting_text: CG5611's functional compartment is **unknown**.
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: No biological process has been established for CG5611.
    reason: The reaction is unknown, so no metabolic process can be assigned. The olfactory-conditioning
      screen hit (Walkinshaw et al. 2015) is a confounded RNAi phenotype and does not show that the
      protein takes part in memory formation, so it does not justify a process annotation.
    supported_by:
    - reference_id: file:DROME/CG5611/CG5611-deep-research-falcon.md
      supporting_text: Consequently, no specific biochemical pathway can presently be assigned to CG5611
        with high confidence.
