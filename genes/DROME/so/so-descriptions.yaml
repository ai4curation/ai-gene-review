- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific;
    sequence-specific DNA binding activity; and transcription coregulator binding
    activity. Involved in several processes, including eye morphogenesis; insect visual
    primordium formation; and ring gland development. Located in nucleus. Is expressed
    in several structures, including embryonic neuroblast; epithelium; imaginal disc;
    light-sensitive neurons; and photoreceptor. Human ortholog(s) of this gene implicated
    in auditory system disease (multiple); branchiootic syndrome 3; branchiootorenal
    syndrome; and disease of cellular proliferation (multiple). Orthologous to several
    human genes including SIX1 (SIX homeobox 1).
