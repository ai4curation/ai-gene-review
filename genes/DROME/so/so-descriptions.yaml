- source: Alliance_Imported
  text: sine oculis (so) encodes a homeobox-containing transcription factor that functions
    with the product of eya as a transcriptional co-activator. It contributes to both
    cell and tissue fate specification, promotion of cell proliferation and suppression
    of apoptosis.
