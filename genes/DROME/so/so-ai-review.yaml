taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'sine oculis (so) encodes the Drosophila founding member of the SIX family of homeodomain
  transcription factors (Six1/2 subfamily), with an N-terminal SIX domain that mediates cofactor binding
  and a divergent SIX-type homeodomain that binds DNA. So is a nuclear, sequence-specific DNA-binding
  transcription factor of the retinal determination network: its eye/ocellus enhancer is directly activated
  by Eyeless and Twin of eyeless, and So in turn binds cis-regulatory elements of target genes including
  atonal, lozenge, hedgehog, eyeless and its own autoregulatory enhancer. So lacks strong intrinsic transactivation
  capacity and acts largely through partner proteins - with the cofactor-phosphatase Eyes absent (Eya),
  which supplies transactivation, it forms a So/Eya activator complex, whereas binding of the corepressor
  Groucho converts So into a repressor. So is required for proliferation, patterning and survival of the
  eye disc epithelium ahead of the morphogenetic furrow, for compound eye, ocellus and Bolwig''s organ
  (larval eye) formation, and for invagination of the embryonic optic lobe primordium; together with Eya
  it can induce ectopic eyes. Outside the visual system So is required in somatic cyst cells of the testis
  for spermatocyte development and in progenitors of the corpus cardiacum of the ring gland.'
