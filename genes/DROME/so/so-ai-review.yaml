core_functions:
- description: So is a SIX-family homeodomain, sequence-specific DNA-binding transcription factor that
    binds cis-regulatory elements of RNA polymerase II target genes (atonal and lozenge eye enhancers,
    hedgehog, eyeless, its own autoregulatory enhancer) in the nucleus and, as the DNA-binding subunit
    of the So/Eya complex, activates their transcription to drive compound eye development.
