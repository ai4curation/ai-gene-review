suggested_questions:
- question: Which So target genes are repressed by So-Groucho versus activated by So-Eya in vivo, and
    does Eya binding displace Groucho at shared enhancers?
- question: Does the So-Fl(2)d complex regulate transcription of So targets or So-dependent splicing,
    and is there an informative GO molecular function for it?
suggested_experiments:
- description: CUT&RUN for endogenously tagged So and Eya in eye-antennal discs, combined with so and
    eya clonal RNA-seq, to define the direct So/Eya target set and separate activated from Groucho-repressed
    targets.
