  text: Contributes to guanyl-nucleotide exchange factor activity. Involved in endosome
    to lysosome transport via multivesicular body sorting pathway. Located in cytosol.
    Part of Mon1-Ccz1 complex. Is expressed in adult head. Orthologous to human CCZ1
    (CCZ1 vacuolar protein trafficking and biogenesis associated) and CCZ1B (CCZ1B
    vacuolar protein trafficking and biogenesis associated).
