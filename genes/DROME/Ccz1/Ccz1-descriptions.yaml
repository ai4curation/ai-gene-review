- source: Alliance_Imported
  text: Caffeine, calcium, zinc sensitivity 1 (Ccz1) encodes a protein that forms
    a complex with the product of Mon1 and acts as an exchange factor of the small
    G-protein encoded by Rab7. The Ccz1/Mon1 complex activates and recruits the product
    of Rab7 to the maturing endosome, where it organizes the fusion of the matured
    endosome with the lysosome. Ccz1/Mon1 complex loss of function results in Rab7
    phenotypes.
