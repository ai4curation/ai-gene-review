taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ccz1 is the Drosophila ortholog of the yeast Ccz1 longin-domain protein and forms, with Mon1,
  the guanine nucleotide exchange factor that activates Rab7 on maturing endosomes; in metazoa the heterodimer
  is further bound by the scaffold subunit Bulli (RMC1). The Mon1-Ccz1 longin-domain core contacts Rab7
  and promotes GDP release, and the complex is recruited and stimulated on membranes by Rab5, driving
  Rab5-to-Rab7 conversion. Through Rab7 activation the complex is required for endosome maturation, delivery
  of endocytic cargo to lysosomes and fusion of autophagosomes with lysosomes.
