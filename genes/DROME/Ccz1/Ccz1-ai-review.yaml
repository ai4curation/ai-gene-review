core_functions:
- description: Ccz1 forms the catalytic Mon1-Ccz1 heterodimer that acts as a Rab7 guanine nucleotide exchange
    factor on Rab5-positive maturing endosomes, driving Rab5-to-Rab7 conversion and endosome-lysosome
    trafficking. The same GEF recruits Rab7 to PI3P-positive autophagosomes and is required for their
    fusion with lysosomes during starvation-induced autophagy.
  contributes_to_molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
