  - SGD:S000000335
  review:
    summary: Autophagy, transferred from yeast Ccz1.
    action: ACCEPT
    reason: Yeast Mon1-Ccz1 is required for autophagosome-vacuole fusion, and in Drosophila the transfer
      is confirmed directly by Hegedus et al. 2016 (PMID:27559127). In starved larval fat cells a Ccz1-null
      allele prevents Rab7 colocalisation with Atg8a-positive autophagosomes, autophagosomes and p62/Atg8a-II
      accumulate, and autolysosomes are absent, so Ccz1-Mon1 is required for autophagosome-lysosome fusion.
      The GEF performs the Rab7 recruitment/activation step on the autophagosome, so the gene does part
      of the work of the process rather than merely being necessary for it. The specific step is autophagosome-lysosome
      fusion; autophagy is a core process of Ccz1 alongside endosome maturation and is listed in core_functions.
    supported_by:
    - &id030
      reference_id: PMID:27559127
      supporting_text: Thus the Ccz1-Mon1-Rab7 module is required for autophagosome-lysosome fusion
    - reference_id: PMID:27559127
      supporting_text: In contrast, the mutation of either Ccz1 or Mon1 prevented the colocalization of
        Atg8a with Rab7
    - reference_id: PMID:27559127
      supporting_text: Rab7, Ccz1, and Mon1 mutants accumulate autophagosomes and that autolysosomes are
        absent from these cells
    - reference_id: PMID:37216550
      supporting_text: the assembly of RMC1 with Mon1-Ccz1 is required for cellular RAB7A activation,
        autophagic functions and organismal development in zebrafish
