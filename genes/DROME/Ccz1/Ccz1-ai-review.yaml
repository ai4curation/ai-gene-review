suggested_questions:
- question: Does Drosophila Ccz1 have Mon1-independent roles, or are all ccz1 loss-of-function phenotypes
    explained by loss of Rab7 activation?
- question: Should Mon1-Ccz1 carry GO:0061909 autophagosome-lysosome fusion? Drosophila fat-body data
    (PMID:27559127) show the GEF recruits Rab7 to autophagosomes and is required for their fusion with
    lysosomes, and another Rab GEF (C9orf72) carries the term in human, but no MON1/CCZ1 ortholog is
    currently annotated to it.
suggested_experiments:
- hypothesis: Ccz1 loss phenocopies Mon1 loss in endosome maturation and autophagy in fly tissues.
  description: Generate ccz1 null clones in fat body and nephrocytes and compare Rab7 recruitment, endosome
    size and autophagic flux with Mon1 mutant clones, with rescue by a Rab7 GTP-locked mutant.
