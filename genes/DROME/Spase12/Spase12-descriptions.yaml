descriptions:
- source: UniProt
  text: Component of the signal peptidase complex (SPC) which catalyzes the cleavage
    of N-terminal signal sequences from nascent proteins as they are translocated
    into the lumen of the endoplasmic reticulum (By similarity). Dispensable for SPC
    enzymatic activity (By similarity). . (Microbial infection) Plays an important
    role in infection by flaviviruses such as West Nile virus and Dengue virus type
    2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VAL0
