taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Spase12 encodes the Drosophila ortholog of SPCS1 (yeast Spc1), the smallest accessory subunit
  of the endoplasmic reticulum signal peptidase complex (SPC), a two-pass ER membrane protein. With the
  catalytic subunit twr (SEC11) and the accessory subunits Spase25 (SPCS2) and Spase22-23 (SPCS3), it
  forms the complex that cleaves N-terminal signal peptides from secretory and membrane proteins entering
  the ER. Its yeast counterpart is dispensable for SPC activity, but spase12 null alleles are embryonic
  lethal in flies, and loss-of-function clones disrupt eye, wing, leg and antenna development, cell differentiation
  and support-cell patterning, and promote melanotic masses.
