- source: Alliance_Imported
  text: Death caspase-1 (Dcp-1) encodes an effector caspase that cleaves specific
    proteins during apoptosis. It typically acts downstream of the initiator caspase
    encoded by Dronc. It is also involved in non-apoptotic processes such as autophagy.
  source_type: curated
