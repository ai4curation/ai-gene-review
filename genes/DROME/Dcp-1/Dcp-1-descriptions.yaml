- source: Alliance_Automated
  text: Enables BIR domain binding activity and cysteine-type endopeptidase activity.
    Involved in several processes, including negative regulation of cell communication;
    neuron remodeling; and nurse cell apoptotic process. Located in mitochondrial
    matrix; neuronal cell body; and neuronal ribonucleoprotein granule. Is expressed
    in several structures, including anterior endoderm; anterior endoderm anlage;
    clypeo-labral primordium; embryonic/larval midgut primordium; and gut section.
    Human ortholog(s) of this gene implicated in several diseases, including breast
    cancer; gastrointestinal system cancer (multiple); lung disease (multiple); myocarditis;
    and neurodegenerative disease (multiple). Orthologous to several human genes including
    CASP3 (caspase 3).
