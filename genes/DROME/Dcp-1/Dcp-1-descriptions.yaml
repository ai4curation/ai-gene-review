descriptions:
- source: UniProt
  text: Involved in the activation cascade of caspases responsible for apoptosis execution
    (By similarity). Proteolytically cleaves Poly [ADP-ribose] polymerase 1 (Parp1).
    Loss of zygotic DCP-1 function causes larval lethality and melanotic tumors.
  source_type: curated
