id: O02002
gene_symbol: Dcp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Dcp-1 is a Drosophila short-prodomain C14 effector caspase that is activated
  downstream of Dronc and works with DrICE to execute apoptosis in selected developmental
  and stress contexts. Beyond this conserved apoptotic protease role, Dcp-1 has more
  restricted non-core outputs in nurse-cell death and oocyte cytoplasmic dumping,
  starvation-induced ovarian macroautophagy through mitochondrial SesB and ATP control,
  Toll/NF-kappaB dampening through DIF cleavage, and Eiger-dependent neuromuscular
  degeneration.'
