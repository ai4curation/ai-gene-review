suggested_questions:
- question: Which endogenous Dcp-1 substrates distinguish lethal apoptotic 
    execution from nonlethal mitochondrial SesB/autophagy and DIF/Toll signaling
    outputs?
- question: Does Dcp-1 bind DIAP1 through a defined BIR-domain interface in 
    vivo, or are most BIR-domain contacts in the fly effector-caspase branch 
    mediated by DrICE?
- question: Is Dcp-1 directly required for dendrite or axon pruning in 
    developmental neuron remodeling, or do the neurite-pruning data support only
    a broader effector-caspase requirement?
suggested_experiments:
- hypothesis: Apoptotic Dcp-1 proteolysis and the SesB-dependent macroautophagy 
    branch use separable Dcp-1 surfaces.
  description: Engineer endogenous dcp-1 alleles that preserve catalytic 
    activation but alter SesB binding, then compare apoptotic substrate 
    cleavage, SesB abundance, ATP levels, mitochondrial morphology, and 
    GFP-mCherry-Atg8a flux in starved midstage egg chambers.
  experiment_type: structure-guided endogenous separation-of-function genetics
- hypothesis: Dcp-1 contributes to nurse-cell apoptosis, vCrz neuron apoptosis, 
    and DrICE buffering by cleaving a substrate set distinct from the bulk DrICE
    execution repertoire.
  description: Run quantitative N-terminomics in matched wild-type, dcp-1-null, 
    Drice-null, and double-mutant fly tissues undergoing eye-disc apoptosis, 
    nurse-cell death, and vCrz neuron programmed cell death.
  experiment_type: comparative caspase degradomics
