- source: Alliance_Automated
  text: Enables ubiquitin protein ligase activity. Involved in several processes,
    including mitochondrion organization; protein ubiquitination; and regulation of
    mitochondrion organization. Located in mitochondrion. Is expressed in germarium
    region 2b; head; and oocyte. Used to study Parkinson's disease; Parkinson's disease
    2; Parkinson's disease 6; cardiomyopathy; and opportunistic bacterial infectious
    disease. Human ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's
    disease 2; lung cancer; and ovarian cancer. Orthologous to human PRKN (parkin
    RBR E3 ubiquitin protein ligase).
