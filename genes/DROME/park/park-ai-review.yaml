  review:
    summary: IBA part_of ubiquitin ligase complex from the RBR family node PTN000188395.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node is seeded by ARIH1, ARIH2, C. elegans pdr-1 and human PRKN. Stable membership of
      a ubiquitin ligase complex is an Ariadne-clade property (ARIH1/2 work bound to neddylated cullin-RING
      ligases). Fly parkin is a single-subunit RBR E3 that engages E2s only transiently through RING1;
      there is no fly evidence that it is a stable subunit of a larger ligase complex.
    supported_by:
    - reference_id: PMID:17456438
      supporting_text: D. melanogaster Parkin as an E3 ligase interacts with UbcH8 through its RING1 domain
    - reference_id: file:genes/DROME/park/park-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: 'They interact with E2 conjugating enzymes and function like HECT-type E3 enzymes:
        they bind E2s via the first RING domain, but require an obligate trans-thiolation step during
        the ubiquitin transfer'
