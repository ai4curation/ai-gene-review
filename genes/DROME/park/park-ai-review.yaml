suggested_questions:
- question: Is parkin required for basal mitophagy in fly neurons and muscle in vivo, or mainly for stress-induced
    (depolarization-triggered) mitophagy, given that basal mitophagy reporters show modest parkin dependence?
- question: Which outer membrane substrates (Marf, Porin, Miro, Tom20) carry which chain types in vivo,
    and how does parkin choose mono- versus polyubiquitination of Porin?
- question: FlyBase IMP GO:1901526 is attributed to PMID:28435104, which does not assay mitophagy; should
    the row be re-referenced?
suggested_experiments:
- description: Quantify mitophagy with mt-Keima or mito-QC reporters in park null flies rescued with wild-type,
    C449S, S94A and T433N parkin, in flight muscle and DA neurons, to separate catalytic, activation and
    Porin-monoubiquitination requirements in vivo.
- description: Ubiquitin-remnant (diGly) proteomics of mitochondria from wild-type and park mutant flies
    after depolarization, to define the endogenous substrate set and linkage types.
