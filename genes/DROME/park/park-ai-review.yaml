id: Q7KTX7
gene_symbol: park
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'park encodes Drosophila parkin, a cytosolic RBR (RING-between-RING) E3 ubiquitin ligase
  and the ortholog of human PRKN. It has an N-terminal ubiquitin-like domain followed by RING0, RING1,
  IBR and RING2 zinc-binding domains. It binds E2 enzymes through RING1 and transfers ubiquitin to substrates
  through a thioester with the RING2 catalytic cysteine (Cys449). Parkin is autoinhibited at rest. When
  mitochondria lose membrane potential, PINK1 phosphorylates parkin (Ser94 in the Ubl domain) and ubiquitin,
  and parkin is recruited from the cytosol to the mitochondrial surface and activated. There it mono-
  and polyubiquitinates outer membrane proteins such as mitofusin (Marf), Porin/VDAC and Miro. This limits
  fusion of damaged mitochondria and marks them for autophagic removal (mitophagy). It also ubiquitinates
  the transcriptional repressor Paris for proteasomal degradation, which supports mitochondrial biogenesis.
  Loss of park causes mitochondrial swelling and dysfunction in tissues with high energy demand: degeneration
  of indirect flight muscle, defective spermatid mitochondrial derivatives and male sterility, female
  sterility, degeneration of dopaminergic neurons, locomotor defects and reduced lifespan.'
