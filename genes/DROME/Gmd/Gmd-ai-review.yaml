core_functions:
- description: Gmd catalyses the NADP(+)-dependent dehydration of GDP-alpha-D-mannose to GDP-4-dehydro-6-deoxy-D-mannose
    in the cytosol, the first committed step of de novo GDP-L-fucose synthesis, supplying the fucose donor
    for Notch O-fucosylation and N-glycan fucosylation.
