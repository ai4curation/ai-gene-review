suggested_questions:
- question: Is Gmd activity feedback-inhibited by GDP-fucose in Drosophila, as reported for mammalian
    GMDS, and does this set GDP-fucose levels available to O-fut1 and the Golgi fucosyltransferases?
suggested_experiments:
- description: Measure GDP-fucose pools by HPLC-MS in Gmd hypomorphs and in wing discs overexpressing
    Gmd to test whether GDP-fucose supply is limiting for Notch O-fucosylation in vivo.
