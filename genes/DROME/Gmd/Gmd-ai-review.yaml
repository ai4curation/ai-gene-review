id: Q9VMW9
gene_symbol: Gmd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gmd encodes the Drosophila GDP-mannose 4,6-dehydratase, an NADP(+)-dependent cytosolic enzyme
  of the NAD(P)-dependent epimerase/dehydratase family that converts GDP-alpha-D-mannose to GDP-4-dehydro-6-deoxy-D-mannose,
  the first of the two enzymatic steps of the de novo pathway that makes GDP-L-fucose. Drosophila lacks
  the fucose salvage pathway, so Gmd is required for essentially all fucosylation, including O-fucosylation
  of Notch EGF repeats by O-fut1 and core fucosylation of N-glycans. Gmd loss reduces Notch signaling,
  causing larval lethality, failure of Notch-dependent commitment of intestinal stem cell daughters and
  defects in early oogenesis.
