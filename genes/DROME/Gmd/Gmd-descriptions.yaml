descriptions:
- source: UniProt
  text: Catalyzes the conversion of GDP-D-mannose to GDP-4-dehydro-6- deoxy-D-mannose
    (also known as GDP-4-keto-6-deoxy-D-mannose or GDP-4- dehydro-alpha-D-rhamnose),
    an essential step in the synthesis of GDP- fucose from GDP-mannose (PubMed:16650000).
    Involved in Notch signaling during wing imaginal disc development; involved in
    providing GDP-fucose for Notch fucosylation (PubMed:15692013).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VMW9
