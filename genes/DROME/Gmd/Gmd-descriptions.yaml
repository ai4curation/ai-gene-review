    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 5
    overall_notes: 'Correct: the first step of de novo GDP-fucose synthesis. No Notch
      link.'
- source: Alliance_Automated
  text: Enables GDP-mannose 4,6-dehydratase activity. Involved in several processes,
    including 'de novo' GDP-L-fucose biosynthetic process; oogenesis; and positive
    regulation of Notch signaling pathway. Predicted to be active in cytosol. Is expressed
    in several structures, including adult head; anterior endoderm; anterior endoderm
    anlage; embryonic/larval midgut primordium; and ganglia. Human ortholog(s) of
    this gene implicated in open-angle glaucoma. Orthologous to human GMDS (GDP-mannose
    4,6-dehydratase).
  source_type: automated
