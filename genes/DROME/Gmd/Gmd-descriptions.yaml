- source: Alliance_Imported
  text: GDP-mannose 4,6-dehydratase (Gmd) encodes an enzyme that catalyzes the conversion
    of GDP-D-mannose to GDP-4-dehydro-6-deoxy-D-mannose (also known as GDP-4-dehydro-alpha-D-rhamnose),
    the first step in the 'de novo' synthesis of GDP-L-fucose from GDP-mannose.
  source_type: curated
  url: https://flybase.org/reports/Gmd.html
  source_id: FB:FBgn0031661
  review:
