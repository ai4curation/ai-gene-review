id: Q94527
gene_symbol: Rel
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Relish (Rel) is a compound NF-kappaB family transcription factor of Drosophila, homologous
  to mammalian p105/p100, with an N-terminal Rel homology DNA-binding domain and a C-terminal IkappaB-like
  ankyrin-repeat domain. In the immune deficiency (Imd)/peptidoglycan recognition protein pathway, Relish
  is phosphorylated by the IKKbeta/Kenny complex and endoproteolytically cleaved in a Dredd caspase-dependent
  manner; the released Rel homology domain (REL-68) translocates to the nucleus, binds kappaB sites and,
  alone or as dimers with Dif or Dorsal, activates RNA polymerase II transcription of antimicrobial peptide
  genes such as Diptericin, Attacin and Cecropin, while the IkappaB-like fragment remains cytoplasmic.
  Relish is essential for humoral defense against Gram-negative bacteria and mediates STING- and cGAMP-induced
  antiviral gene expression. It also drives negative-feedback regulators that restore immune homeostasis
  and has context-specific roles in neural development, stress and metabolic responses.
