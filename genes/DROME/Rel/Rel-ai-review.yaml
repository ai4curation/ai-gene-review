- description: Signal-activated NF-kappaB transcription activator; after IKK phosphorylation and Dredd-dependent
    cleavage, the Rel homology domain enters the nucleus, binds kappaB sites and activates RNA Pol II
    transcription of antimicrobial peptide genes in the Imd/PGRP pathway.
