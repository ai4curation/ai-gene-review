- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription activator activity,
    RNA polymerase II-specific; RNA polymerase II transcription regulatory region
    sequence-specific DNA binding activity; and lncRNA binding activity. Involved
    in several processes, including antiviral innate immune response; neuron development;
    and regulation of defense response. Located in cytosol; euchromatin; and nucleus.
    Is expressed in several structures, including Malpighian tubule; amnioserosa;
    embryonic/larval midgut primordium; germline cell; and gut section. Used to study
    neurodegenerative disease and opportunistic bacterial infectious disease. Human
    ortholog(s) of this gene implicated in several diseases, including HTLV-1-associated
    myelopathy/tropical spastic paraparesis; common variable immunodeficiency (multiple);
    liver disease (multiple); lung non-small cell carcinoma; and prostate cancer.
    Orthologous to human NFKB1 (nuclear factor kappa B subunit 1) and NFKB2 (nuclear
    factor kappa B subunit 2).
