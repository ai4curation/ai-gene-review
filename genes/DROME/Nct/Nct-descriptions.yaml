      Notch.'
- source: Alliance_Automated
  text: Involved in several processes, including amyloid-beta formation; lateral inhibition;
    and membrane protein proteolysis. Located in late endosome and recycling endosome.
    Part of gamma-secretase complex. Is expressed in adult head; central brain primordium;
    embryonic brain; larval ventral nerve cord; and ventral nerve cord primordium.
    Used to study Alzheimer's disease. Human ortholog(s) of this gene implicated in
    Alzheimer's disease; hidradenitis suppurativa; and schizophrenia. Orthologous
    to human NCSTN (nicastrin).
