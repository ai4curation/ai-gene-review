core_functions:
- description: Nicastrin is an essential structural subunit of gamma-secretase that is required for Presenilin
    stability and maturation and for the complex to perform intramembrane cleavage of ligand-activated
    Notch and other type I membrane proteins. Nicastrin carries no catalytic residues (the aspartyl protease
    active site is in Presenilin), so it is modelled, like Aph-1, as a non-catalytic scaffold of the complex
    rather than as contributing to the peptidase activity itself.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0007220
    label: Notch receptor processing
  - id: GO:0031293
    label: membrane protein intracellular domain proteolysis
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0070765
    label: gamma-secretase complex
  supported_by:
  - *id007
  - *id009
  - *id013
suggested_questions:
- question: Does the Drosophila Nicastrin ectodomain directly recognise the N-terminal stub of shed Notch,
    or is its requirement fully explained by Presenilin stabilisation and complex maturation?
suggested_experiments:
- hypothesis: The Nct ectodomain contributes substrate selectivity in vivo.
  description: Replace endogenous Nct with ectodomain point mutants that preserve complex assembly and
    compare cleavage of Notch, Appl and other substrates in transgenic reporter assays.
