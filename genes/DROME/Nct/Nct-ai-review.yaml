id: Q9VC27
gene_symbol: Nct
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nicastrin (Nct) is a type I transmembrane glycoprotein and an essential non-catalytic subunit
  of gamma-secretase, the intramembrane aspartyl protease complex formed with Presenilin (Psn), aph-1
  and pen-2. Its large glycosylated ectodomain sits on the luminal/extracellular face of the complex,
  and Nct is required for Presenilin stability, endoproteolytic maturation and assembly of the active
  enzyme. Gamma-secretase containing Nct performs the S3 intramembrane cleavage of ligand-activated Notch
  that releases the Notch intracellular domain, so Nct loss abolishes Notch signaling and produces neurogenic
  phenotypes in lateral inhibition and eye photoreceptor development. The complex also cleaves other type
  I membrane proteins, including human APP expressed in flies.
