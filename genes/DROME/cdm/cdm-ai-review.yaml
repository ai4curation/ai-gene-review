  label: Drosophila melanogaster
description: 'Cadmus (cdm; also Imp13, CG7212) is the Drosophila importin-13, a 971-residue member of the importin-beta
  (karyopherin-beta) superfamily built from HEAT repeats with an N-terminal importin-beta/Ran-binding region. It
  is a bidirectional nucleocytoplasmic transport receptor: it binds cargo in the cytoplasm and carries it through
  nuclear pores, with RanGTP binding in the nucleus releasing import cargo. In Drosophila it forms a ring-like structure
  that encircles the exon junction complex core heterodimer Mago-Y14 for nuclear import; by orthology with vertebrate
  importin-13 it is also expected to export selected proteins such as eIF1A. The tagged protein is found in and
  around nuclei of neurons and muscles. Cadmus is essential for viability, and mutants show defective photoreceptor
  responses and, at the larval neuromuscular junction, a muscle-dependent homeostatic increase in presynaptic transmitter
  release.'
