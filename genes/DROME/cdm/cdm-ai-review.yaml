  review:
    action: KEEP_AS_NON_CORE
    summary: Cadmus loss perturbs visual-system transmission and synaptic homeostasis.
    reason: Cadmus loss perturbs visual-system transmission and synaptic homeostasis. Mutant and genomic-rescue
      experiments connect CG7212/imp13 to the original visual screen; at the NMJ the protein acts in muscle
      to alter presynaptic release. These are supported organismal consequences of a nuclear transport
      receptor rather than a transmitter receptor or direct vesicle-release factor.
    supported_by:
    - reference_id: PMID:19403829
      supporting_text: every aspect of the eye phenotype is rescued by the genomic transgene
    - reference_id: PMID:19403829
      supporting_text: 'imp13 is required in the muscles to

        control presynaptic release.'
