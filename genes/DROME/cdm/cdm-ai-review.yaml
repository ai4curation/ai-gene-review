  label: Drosophila melanogaster
description: Cadmus is Drosophila importin-13, a Ran-regulated karyopherin that shuttles protein cargo
  between cytoplasm and nucleus. It recognizes the Mago-Y14 heterodimer through a conserved folded interaction
  surface. Cadmus is expressed in and around neuronal and muscle nuclei and supports synaptic homeostasis,
  including postsynaptic control of presynaptic transmitter release.
existing_annotations:
- term:
    id: GO:0005049
    label: nuclear export signal receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000270925
  - SGD:S000002984
  review:
    action: ACCEPT
    summary: Cadmus is the bidirectional importin-13 transport receptor.
    reason: Cadmus is the bidirectional importin-13 transport receptor. Fly Imp13 is structurally characterized
      with its import cargo Mago-Y14, while mammalian Imp13 directly exports eIF1A; the conserved importin-13
      mechanism and curated phylogenetic assignment support nuclear export without claiming a fly eIF1A
      assay.
    supported_by:
    - &id003
      reference_id: PMID:20122403
      supporting_text: 'The heterodimer is imported back into the nucleus by Importin 13

        (Imp13), a member of the karyopherin-beta family of transport factors. We have

        elucidated the structural basis of the Mago-Y14 nuclear import cycle. The 3.35 A

        structure of the Drosophila Imp13-Mago-Y14 complex shows that Imp13 forms a

        ring-like molecule, reminiscent of Crm1, and encircles the Mago-Y14 cargo with a

        conserved interaction surface.'
    - &id005
      reference_id: PMID:11447110
      supporting_text: Imp13 also shows export activity towards the translation initiation factor eIF1A
