  supporting_entities:
  - PANTHER:PTN000270925
  - SGD:S000002984
  review:
    action: ACCEPT
    summary: Importin-13 subfamily receptor that also carries export cargo; inherited via PANTHER SF33 / PAINT.
    reason: Cadmus is in PANTHER subfamily PTHR12363:SF33 (IMPORTIN-13) together with human IPO13, which exports
      eIF1A from the nucleus in a RanGTP-coupled manner; the PAINT node PTN000270925 places this activity on the
      importin-13 lineage. There is no Drosophila-specific export assay, so the claim rests on subfamily inheritance
      rather than a fly experiment. The PTHR12363 family review records the family-wide distribution of this term
      as unresolved because the transportin-3 branch differs, but the fly protein sits in the importin-13 branch
      with the experimentally characterised exporter. Accepted as part of the bidirectional transport receptor function;
      note that Imp13 export is atypical (eIF1A binding is only indirectly Ran-regulated), so the term should be
      read as export receptor activity rather than leucine-rich NES recognition.
    supported_by:
