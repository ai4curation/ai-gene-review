    label: neuron-neuron synaptic transmission
  evidence_type: IMP
  original_reference_id: PMID:14504225
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Mutant ERG transmission defects are a supported but indirect consequence of loss of a nuclear transport
      receptor.
    reason: Clonal loss of cdm/imp13 abolishes ERG on/off transients and genomic rescue restores them, so the genetic
      requirement is solid. However the photoreceptors also have reduced phototransduction responses, indicating
      broad cellular dysfunction rather than a direct role in the transmission machinery. The source screen is abstract-only
      here, so the curated IMP is retained as non-core rather than downgraded further.
    supported_by:
