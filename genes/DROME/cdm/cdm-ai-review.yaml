- term:
    id: GO:0050804
    label: modulation of chemical synaptic transmission
  evidence_type: IMP
  original_reference_id: PMID:19403829
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The NMJ release phenotype is a homeostatic response to muscle defects, which the authors describe as
      indirect.
    reason: In imp13 mutants quantal content is increased at low Ca2+, and muscle (not neuronal) expression rescues
      it; the authors conclude the increased release is a synaptic homeostatic response to muscular defects and
      that imp13 "might be indirectly linked" to homeostasis. A nuclear transport receptor acting in muscle does
      not itself modulate chemical synaptic transmission; the annotation records necessity, not participation. Retained
      as over-annotation rather than removed because the phenotype is real and curator-assigned.
    supported_by:
