- term:
    id: GO:0043243
    label: positive regulation of protein-containing complex disassembly
  evidence_type: NAS
  original_reference_id: PMID:17287812
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Cargo release is disassembly of Cadmus's own transport complex, triggered by RanGTP, not regulation
      of disassembly of other complexes.
    reason: The NAS derives from a general review of the import cycle (abstract-only). In the importin-13 cycle
      RanGTP binding releases Mago-Y14 by steric hindrance, and eIF1A release in the cytoplasm is triggered by import-cargo
      loading; in both cases the receptor is a component of the complex being dismantled, with Ran or the competing
      cargo as the effector. Describing the receptor as positively regulating complex disassembly over-reads this
      mechanism, and there is no evidence that Cadmus disassembles the EJC on mRNA.
    supported_by:
    - *id001
    - reference_id: PMID:11447110
      supporting_text: the cytoplasmic release of eIF1A from Imp13 is triggered by the loading of import substrates
        onto Imp13
