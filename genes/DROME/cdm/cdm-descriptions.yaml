- source: Alliance_Automated
  text: Predicted to enable nuclear export signal receptor activity and nuclear import
    signal receptor activity. Involved in modulation of chemical synaptic transmission;
    neuron-neuron synaptic transmission; and phototaxis. Part of NLS-dependent protein
    nuclear import complex. Is expressed in larval brain; larval somatic muscle cell;
    larval ventral nerve cord; and spermatozoon. Orthologous to human IPO13 (importin
    13).
