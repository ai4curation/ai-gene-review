- source: Alliance_Imported
  text: cadmus (cdm) encodes a member of the importin beta family of nucleocytoplasmic
    cargo shuttling proteins. It functions at the neuromuscular junction to maintain
    normal subsynaptic reticulum structure and presynaptic probability of release.
