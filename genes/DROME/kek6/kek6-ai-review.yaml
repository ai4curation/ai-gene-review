description: >-
  Kekkon 6 (Kek-6) is a single-pass transmembrane protein of the Drosophila Kekkon family,
  with an extracellular region of leucine-rich repeats and one immunoglobulin domain and
  no cytoplasmic tyrosine kinase domain, resembling the truncated, kinase-less isoforms of
  vertebrate Trk neurotrophin receptors. It is expressed in central interneurons and
  motoneurons and is located in motoneuron axons and presynaptic boutons at the larval
  neuromuscular junction. Kek-6 binds the Drosophila neurotrophin DNT2 (Spz5), and
  promiscuously DNT1, and acts presynaptically downstream of muscle-derived DNT2, through
  the intracellular partners CaMKII and VAP33A, to promote neuromuscular junction growth,
  axonal branching and active zone formation. Kek-6 binds the other DNT2 receptor, Toll-6,
  and the two receptors together regulate structural synaptic plasticity and homeostasis
  at the neuromuscular junction and synapse number, dendrite growth and survival of
  dopaminergic neurons in the adult brain.
