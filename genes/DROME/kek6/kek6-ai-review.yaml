    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Checked each claim against PMID:28846707. Co-receptor for spz5 (DNT2) with Toll-6 as
      the other receptor: supported (Kek-6 binds DNT2 and Toll-6; proposed DNT2 receptor
      complex). Activates CaMKII: supported (pCaMKII reduced in mutants, raised on
      overexpression). Induces synaptogenesis and axonal branching at the NMJ: supported
      (overexpression increased branching and active zone density). Omits DNT1 binding,
      VAP33A, and the adult dopaminergic-circuit role (PMID:39704728).
