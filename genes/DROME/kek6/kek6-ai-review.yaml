suggested_questions:
- question: Does Kek-6 transduce a signal on its own (CaMKII activation through its cytoplasmic
    tail) or chiefly as a co-receptor modifying Toll-6 signalling, and would GO:0015026
    coreceptor activity describe it better than neurotrophin receptor activity?
suggested_experiments:
- description: Measure direct DNT2-Kek-6 ectodomain binding affinity (SPR/BLI) alone and with
    the Toll-6 ectodomain, to test whether Kek-6 and Toll-6 form a ternary DNT2 receptor
    complex.
- description: Map the Kek-6 cytoplasmic region needed for CaMKII and VAP33A binding and test
    a tail-deletion kek6 transgene for rescue of kek6 NMJ phenotypes.
