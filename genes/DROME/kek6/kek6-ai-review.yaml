- description: Kinase-less Trk-like transmembrane receptor for the neurotrophin DNT2 (and
    DNT1) at presynaptic motoneuron terminals; acting with Toll-6 and through CaMKII and
    VAP33A, it promotes NMJ growth, branching and active zone formation and regulates
    structural synaptic plasticity.
