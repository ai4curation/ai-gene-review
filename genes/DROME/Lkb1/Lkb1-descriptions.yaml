- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activator activity and protein serine/threonine
    kinase activity. Involved in several processes, including determination of adult
    lifespan; germ cell development; and regulation of intracellular signal transduction.
    Located in cell cortex; endosome; and nucleus. Is active in cytoplasmic side of
    plasma membrane. Human ortholog(s) of this gene implicated in Peutz-Jeghers syndrome;
    familial melanoma; female reproductive organ cancer (multiple); pancreatic cancer;
    and testicular disease. Orthologous to human STK11 (serine/threonine kinase 11).
  source_type: automated
