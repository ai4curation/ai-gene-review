descriptions:
- source: Alliance_Imported
  text: Lkb1 kinase (Lkb1) encodes a serine/threonine kinase that plays a master role
    for activating the AMP-dependent protein kinase (AMPK) family kinases. It is a
    well-characterized tumor suppressor and regulates processes like cell polarity,
    metabolism, apoptosis, and cell growth.
  source_type: curated
