descriptions:
- source: Alliance_Automated
  text: Enables D-type glycerophospholipase activity. Involved in several processes,
    including gastrulation involving germ band extension; phototransduction; and positive
    regulation of Golgi vesicle fusion to target membrane. Located in cytoplasmic
    vesicle. Is expressed in several structures, including adult head; embryonic anal
    pad; embryonic epipharynx; embryonic hypopharynx; and embryonic large intestine.
    Human ortholog(s) of this gene implicated in developmental cardiac valvular defect.
    Orthologous to human PLD1 (phospholipase D1) and PLD2 (phospholipase D2).
  source_type: automated
