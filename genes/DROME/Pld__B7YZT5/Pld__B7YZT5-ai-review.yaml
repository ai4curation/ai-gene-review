    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached and read. It is the foundational genetic study. Its
      phototransduction interpretation was later refined by PMID:27848911, which found no primary
      ERG defect in dPLD3.1 and placed Pld in membrane recycling.
- id: PMID:17156430
  title: A role for Phospholipase D in Drosophila embryonic cellularization.
  findings:
  - statement: Expressed Pld has classical, HKD-dependent PLD (transphosphatidylation) activity that
      is stimulated by ARF1.
    supporting_text: Taken together, these findings demonstrate that Pld is a bona fide PLD and can
      be regulated by ARF GTPases
  - statement: Endogenous Pld is on small cytoplasmic vesicles in cellularizing embryos.
    supporting_text: In cellularizing embryos, Pld localized to the cytoplasm and/or to cytosolic
      vesicles of uniform small size evenly distributed between apical and basal regions of the blastoderm
  - statement: Pld-null embryos have enlarged Golgi and fail to insert Golgi-derived vesicles into
      the plasma membrane.
    supporting_text: Thus, Nrt appears to exit the Golgi into secretory vesicles and translocate apically,
      but then is not inserted into the plasma membrane
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Main source of the FlyBase IDA/IMP annotations, giving
      direct activity, localization and embryonic trafficking evidence.
- id: PMID:27848911
  title: Phospholipase D activity couples plasma membrane endocytosis with retromer
    dependent recycling.
  findings:
  - statement: dPLD3.1 flies lack in vivo PLD transphosphatidylation activity and have less PA.
    supporting_text: Under these conditions, multiple species of PEth were detected in wild-type flies,
      no PEth could be detected in dPLD3
  - statement: Pld catalytic activity is needed to clear endocytosed rhodopsin vesicles through Arf1-
      and retromer-dependent recycling during illumination.
    supporting_text: suggesting that the ability of dPLD to regulate RLV turnover is dependent on its
      catalytic activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (eLife, PMC5125754) and read. It is the strongest in vivo
      functional study of fly Pld and is not yet reflected in GOA.
- id: PMID:30369483
  title: Functional analysis of mammalian phospholipase D enzymes.
  findings:
  - statement: In a maximum-likelihood phylogeny, insect PLDs group closer to chordate PLD1 than to
      PLD2. hPLD1 fully rescues dPLD3.1 retinal degeneration, while hPLD2 rescues it less well.
    supporting_text: These insect PLD sequences appear to be evolutionarily closer to PLD1 sequences
      of chordates than to the PLD2 subcluster
  - statement: Endogenous dPLD is at the base of the rhabdomere microvilli, by the SMC-plasma
      membrane contact site; which of the two membranes carries it is unresolved.
    supporting_text: Presently it is unclear if dPLD is localized to the membrane of the SMC or to
      the microvillar plasma membrane in this area
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC6435507) and read. It supplies the phylogenetic grounding for
      relating fly Pld to human PLD1 and the in vivo localization in photoreceptors.
