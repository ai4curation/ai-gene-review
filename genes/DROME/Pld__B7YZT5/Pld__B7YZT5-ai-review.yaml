- term:
    id: GO:2001137
    label: positive regulation of endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:27848911
  qualifier: involved_in
  review:
    summary: Thakur et al. 2016 studied the dPLD3.1 loss-of-function allele and catalytic-dead rescue
      constructs in photoreceptors. During illumination, PLD activity is needed for endocytosed
      rhodopsin-containing vesicles to be cleared from Rab7 compartments and recycled to the
      rhabdomere through Arf1 and retromer, and raising PLD activity speeds that clearance.
    action: NEW
    reason: This is the best-characterized in vivo role of fly Pld, from a full-text primary paper
      that is not represented in GOA. Loss of Pld gives more Rab7-positive rhodopsin vesicles, less
      rhodopsin and a smaller rhabdomere under light. Overexpression of active Pld, but not the
      catalytically inactive K/R mutant, clears these vesicles in a way that depends on Arf1-GTP
      and retromer, so Pld positively regulates the recycling step through its product PA. The
      claim is made as regulation rather than direct participation, since retromer and Arf1 do the
      sorting and Pld supplies the lipid signal. It refines the accepted IBA regulation of
      vesicle-mediated transport.
    supported_by:
    - reference_id: PMID:27848911
      supporting_text: suggesting that the ability of dPLD to regulate RLV turnover is dependent on
        its catalytic activity
    - reference_id: PMID:27848911
      supporting_text: the number of Rab7-positive RLVs were significantly greater in dPLD3.1 compared
        to controls
    - reference_id: PMID:27848911
      supporting_text: We find that photoreceptors have a light-regulated PLD activity that is required
        to maintain PA levels during illumination and support apical membrane size.
