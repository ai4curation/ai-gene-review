- term:
    id: GO:0007030
    label: Golgi organization
  evidence_type: IMP
  original_reference_id: PMID:17156430
  qualifier: involved_in
  review:
    summary: In Pld-null cellularizing embryos, Lva-marked Golgi structures were about 8-fold larger
      and stained more intensely. The authors read this as a role in Golgi fission that generates
      secretory vesicles.
    action: KEEP_AS_NON_CORE
    reason: The curator-made IMP rests on a clear, quantified phenotype in the full text. The step
      Pld performs is PA production. Abnormal Golgi morphology is a consequence of altered vesicle
      fission or trafficking and is not evidence that Pld organizes the Golgi as a structural
      component. Overexpression of Pld did not change Golgi morphology. Kept as non-core and
      embryo-specific.
    supported_by:
    - reference_id: PMID:17156430
      supporting_text: This observation of abnormal Golgi structure suggests a role for Pld in facilitating
        the Golgi fissioning required to generate the vesicles destined to be transported via Lva
        to the embryonic cortex.
