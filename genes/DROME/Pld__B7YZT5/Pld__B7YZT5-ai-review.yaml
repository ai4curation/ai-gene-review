  review:
    summary: InterPro2GO mapping from the PX domain (IPR001683/IPR036871) to phosphatidylinositol
      binding.
    action: KEEP_AS_NON_CORE
    reason: B7YZT5 has a PX domain (residues 232-434). The fly protein also has a PH domain and a
