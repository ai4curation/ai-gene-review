id: B7YZT5
gene_symbol: Pld
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Pld (CG12110, FBgn0286511) encodes the single conventional HKD-type phospholipase D
  of Drosophila melanogaster. B7YZT5 is the UniProt gene-centric canonical sequence
  (1364 aa); it has an N-terminal PX domain, a PH domain and two HKD
  (PLD phosphodiesterase) catalytic motifs. The enzyme hydrolyses phosphatidylcholine
  to phosphatidic acid (PA) and choline, and can transfer the phosphatidyl group to
  primary alcohols (transphosphatidylation). Activity of the fly enzyme has been shown
  directly by heterologous expression, where it depends on the second HKD motif and is
  stimulated by PMA, receptor signalling and ARF1. In vivo, flies lacking Pld make no
  phosphatidylethanol and have less PA. In adult photoreceptors Pld sits at the base of
  the rhabdomere microvilli, near the submicrovillar cisternae, and its PA output is
  needed under illumination for Arf1- and retromer-dependent recycling of endocytosed
  rhodopsin-containing membrane back to the rhabdomere. Without it, the rhabdomere
  shrinks and the retina degenerates. In the cellularizing embryo Pld is found on small
  cytoplasmic vesicles. There it supports Golgi structure and the delivery and
  plasma-membrane insertion of Golgi-derived secretory vesicles. Pld sits in the animal
  PLD1/PLD2 clade and is phylogenetically closer to chordate PLD1. Human PLD1 rescues
  the fly mutant better than PLD2 does.
