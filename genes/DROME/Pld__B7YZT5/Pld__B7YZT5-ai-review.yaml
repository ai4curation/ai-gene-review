suggested_questions:
- question: Which membrane carries Pld at the base of the rhabdomere, the microvillar plasma membrane
    or the submicrovillar cisterna (smooth ER)? The answer decides between plasma membrane and
    subrhabdomeral cisterna as the fly-specific location term.
- question: Which PA effector links Pld activity to Arf1/retromer-dependent recycling of rhodopsin
    vesicles?
- question: The PAINT node PTN001051940 propagates plasma membrane to fly Pld from mammalian PLD1
    and PLD2. Should fly-specific evidence for a rhabdomere-base/SMC location prompt a narrower or
    additional location annotation?
suggested_experiments:
- description: Immunogold electron microscopy of endogenous Pld in photoreceptors, to resolve whether
    it is on the submicrovillar cisterna or the base of the microvillar plasma membrane.
  experiment_type: localization
- description: Lipid-binding assays with recombinant PX and PH domains of fly Pld across a phosphoinositide
    panel, to test the domain-inferred phosphatidylinositol binding.
