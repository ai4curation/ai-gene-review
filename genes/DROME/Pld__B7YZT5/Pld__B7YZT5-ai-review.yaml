- term:
    id: GO:0007602
    label: phototransduction
  evidence_type: IMP
  original_reference_id: PMID:15883198
  qualifier: involved_in
  review:
    summary: LaLonde et al. 2005 found that Pld-null flies had lower light sensitivity in ERGs and
      that Pld overexpression restored visual signalling in rdgB mutants. They proposed that Pld-made
      PA helps keep the PIP2 supply that PLC uses.
    action: MARK_AS_OVER_ANNOTATED
    reason: Pld is not a component of the phototransduction cascade. It is not activated by
      light-triggered rhodopsin signalling in that study, and its proposed contribution is indirect,
      maintaining substrate lipid and membrane. A later study with the dPLD3.1 loss-of-function allele
      found no primary defect in the light response. It placed Pld in light-dependent membrane
      recycling of the rhabdomere, which supports apical membrane size during illumination. The
      phototransduction phenotype is therefore secondary and partly contested. The process that
      Pld-generated PA serves in photoreceptors is better captured as regulation of endocytic
      recycling (NEW below). The IMP is not removed, since the original ERG data stand.
    supported_by:
    - reference_id: PMID:15883198
      supporting_text: indicating that the contribution of Pld to phototransduction responses is not
        mediated by the rhodopsin-triggered activation of Pld and conversion of the ensuing PA to DAG
    - reference_id: PMID:27848911
      supporting_text: photoreceptors did not exhibit a primary defect in the electrical response
        to light in electroretinograms
