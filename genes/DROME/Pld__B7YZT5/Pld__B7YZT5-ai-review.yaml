- term:
    id: GO:0048215
    label: positive regulation of Golgi vesicle fusion to target membrane
  evidence_type: IMP
  original_reference_id: PMID:17156430
  qualifier: involved_in
  review:
    summary: In Pld-null embryos, Neurotactin-containing Golgi-derived vesicles reached the apical
      cortex but were not inserted into the plasma membrane. The authors infer that Pld promotes
      fusion of these vesicles, in addition to Golgi fission.
    action: KEEP_AS_NON_CORE
    reason: The curator-made IMP reflects the authors' interpretation of a well-described
