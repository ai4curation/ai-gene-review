  review:
    summary: PAINT IBA from PTN001051940, the animal PLD1/PLD2 ancestral node. The fly Pld
      descends from it, and the experimental grounding comes from mammalian PLD1 and PLD2.
    action: KEEP_AS_NON_CORE
    reason: The fly protein falls inside PTN001051940, so the inheritance claim is phylogenetically
      sound. However, the plasma membrane is not where Pld has been shown to act in the fly. Plasma
      membrane staining appears only with heterologous expression in COS7 cells. In cellularizing
      embryos Pld was explicitly not seen at the plasma membrane or furrows. In photoreceptors it
      concentrates at the base of the rhabdomere microvilli, and the authors could not tell whether
      it sits on the microvillar plasma membrane or on the apposed submicrovillar cisterna. The term
      is therefore plausible for a subpool but not established for the fly protein, and it is kept
      as non-core.
