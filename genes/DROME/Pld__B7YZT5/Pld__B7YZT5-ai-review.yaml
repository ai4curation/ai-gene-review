  review:
    summary: LaLonde et al. 2006 expressed Drosophila Pld in HEK293 cells that stably express
      the m3 muscarinic receptor. They measured PLD activity in vivo as phosphatidylbutanol formation
      by transphosphatidylation, which is the standard PLD assay.
      Wild-type Pld was active and stimulated by carbachol and ARF1, whereas the H1095N
      second-HKD mutant was not.
    action: ACCEPT
    reason: This is direct experimental evidence for the core catalytic activity of the fly protein,
      with a catalytic-site mutant as control. It agrees with the in vivo loss of PLD-dependent
      phosphatidylethanol and the lower PA levels in dPLD3.1 flies (PMID:27848911). The substrate
      in the assay is phosphatidylcholine, which fits GO:0004630 (cleavage releasing phosphatidic
      acid).
