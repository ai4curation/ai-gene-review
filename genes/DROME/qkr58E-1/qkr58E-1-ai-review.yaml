suggested_questions:
- question: Does qkr58E-1 retain the QUA1 dimerization and QUA2 RNA-contact elements of KHDRBS/Sam68
    proteins, and what RNA sequence does its KH-QUA2 unit recognise?
- question: Are the seven fly SF140 paralogs (qkr58E-1, -2, -3, nsr, CG10384, CG4021, CG3927) functionally
    redundant splicing regulators, or have they subfunctionalised by tissue?
- question: Which of the fly KHDRBS-clade proteins correspond to mammalian KHDRBS1/2/3 in splice-site
    selection, given that the fly genes are lineage-specific duplicates under PTN000879731?
suggested_experiments:
- description: CLIP-seq or iCLIP of endogenous qkr58E-1 in S2R+ cells or adult heads to map direct binding
    sites and test overlap with m6A sites and with fl(2)d and other YT521-B-dependent splice events.
  experiment_type: CLIP-seq
- description: In vitro binding (EMSA or SELEX) with purified KH-QUA2 protein to define its recognition
    motif.
  experiment_type: biochemical binding assay
