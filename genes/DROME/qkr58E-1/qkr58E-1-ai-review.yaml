taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: qkr58E-1 (CG3613) encodes a nuclear KH-domain RNA-binding protein of the STAR (signal
  transduction and activation of RNA) family. Despite its quaking-related name, it belongs to an
  insect-specific expansion of the KHDRBS (Sam68/SLM) clade of STAR proteins rather than to the QKI/How
  subfamily. The protein has a single central type-I KH domain flanked by long disordered, basic and
  low-complexity regions. In cultured Drosophila cells it associates with many mRNAs, with targets
  enriched for genes that produce many transcript isoforms and for 5' UTR binding. It co-purifies with
  spliceosomal B and C complexes and with U2 snRNP proteins, and it co-immunoprecipitates with the nuclear
  m6A reader YT521-B. Knockdown alters fl(2)d alternative splicing, which supports a role as a regulator
  of selected alternative-splicing events. Its RNA recognition sequence, direct targets in vivo and organismal function have not been
  defined. The UniProt entry Q9W255 is the 396-residue PA product, the longest of three annotated
  polypeptides.
