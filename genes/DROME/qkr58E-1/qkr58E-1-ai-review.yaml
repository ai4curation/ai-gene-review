  review:
    summary: Inherited from the KHDRBS (Sam68/SLM) clade node PTN000879731, which contains qkr58E-1 and
      the other SF140 fly paralogs; corroborated by direct fly knockdown data.
    action: ACCEPT
    reason: PTN000879731 is the KHDRBS clade node (descendants include human KHDRBS1/2/3, rodent Khdrbs
      genes, qkr54B and every fly SF140 member, including qkr58E-1), and its donors include KHDRBS1/Sam68
      (Q07666), a well-characterised regulator of alternative splicing. qkr58E-1 sits inside that clade,
      so the inheritance is phylogenetically sound. Independent target-specific support comes from
      PMID:27919077 Extended Data Fig. 10b, where Qkr58E-1 knockdown altered fl(2)d splicing, and from
      RIP-seq showing that its RNA targets are strongly enriched for ultracomplex (isoform-rich) genes.
      This supports regulation of selected events, not a general requirement for splicing.
