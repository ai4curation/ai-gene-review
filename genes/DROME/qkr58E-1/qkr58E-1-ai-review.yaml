  review:
    summary: Curator inference from the protein's recovery in affinity-purified Drosophila spliceosomal
      B and C complexes. True in the sense of acting within spliceosomes, but peripheral to its regulatory
      role.
    action: KEEP_AS_NON_CORE
    reason: FlyBase inferred participation in splicing from the HDA spliceosome-complex assignments. The
      primary table lists QKR58E-1 among the fly proteins recovered, and PMID:26294687 adds protein
      interactions with the U2 snRNP proteins CG2807 (SF3B1) and CG16941 (SF3A1). Its relatives in the
      KHDRBS clade are splicing regulators, not core spliceosome components, and no evidence shows that
      qkr58E-1 is required for constitutive splicing. The curator's inference is retained but kept as
      non-core; regulation of alternative splicing (GO:0000381) is the core process.
