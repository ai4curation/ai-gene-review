taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: qkr58E-1 encodes a nuclear KH-domain RNA-binding protein associated with spliceosomal complexes.
  Its conserved RNA-binding architecture and recovery in Drosophila spliceosome preparations support a
  role in pre-mRNA processing and regulation of splicing. The native PA product is 396 residues; it regulates
  selected alternative-splicing events, while its exact RNA recognition sequence and any universal requirement
  in splicing remain unresolved.
