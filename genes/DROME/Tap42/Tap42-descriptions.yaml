- source: Alliance_Automated
  text: Enables protein phosphatase inhibitor activity. Involved in mitotic spindle
    organization and wing disc morphogenesis. Part of protein phosphatase type 2A
    complex. Is expressed in antennal disc; haltere disc; mesothoracic leg disc; metathoracic
    leg disc; and wing disc. Human ortholog(s) of this gene implicated in corpus callosum
    agenesis-intellectual disability-coloboma-micrognathia syndrome. Orthologous to
    several human genes including IGBP1 (immunoglobulin binding protein 1).
