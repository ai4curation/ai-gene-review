core_functions:
- description: Atypical regulatory subunit that binds the catalytic subunits of PP2A (Mts), PP4 and
    PP6 (PPV) directly and controls PP2Ac abundance and cytoplasmic retention; this phosphatase
    regulation underlies Tap42's essential roles in mitotic progression, cell survival and imaginal
    disc development, independently of TOR.
  molecular_function:
    id: GO:0019888
    label: protein phosphatase regulator activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22701670
    supporting_text: Western analysis of the immune complexes revealed that Tap42 interacts with all
      three Drosophila phosphatase catalytic subunits (Fig. 6-A).
  - reference_id: PMID:22701670
    supporting_text: These findings indicate that the Tap42RNAi-induced phenotypes are entirely due
      to the impaired interactions between Tap42 and PP2A family members
  - reference_id: PMID:15802506
    supporting_text: Thus, Tap42 acts independently of TOR to limit PP2Ac expression levels and to restrict
      its localization to the cytoplasm.
suggested_questions:
- question: Does Drosophila Tap42 inhibit, stabilize, or redirect Mts/PP4/PPV catalytic activity
    biochemically, and is the effect substrate-dependent as reported for mammalian alpha4?
- question: Should a Tap42-PP2Ac heterodimer lacking the A scaffold subunit be annotated to GO:0000159
    protein phosphatase type 2A complex, or is a distinct complex term (or binding term only) more
    appropriate for alpha4/TAP42-family proteins?
- question: Is the TOR signaling IBA at PTN000101130 correctly placed for metazoans, given that fly
    Tap42 is dispensable for TOR signaling?
suggested_experiments:
- description: In vitro phosphatase assays of purified Mts, PP4c and PPV with wild-type versus Tap42ED
    protein on several phosphosubstrates, to determine whether Tap42 is an inhibitor or a specificity
    modifier.
- description: Measure PP2Ac ubiquitination and half-life in Tap42-depleted S2 cells to test whether
    Tap42 promotes PP2Ac turnover as alpha4/MID1 does in mammals.
