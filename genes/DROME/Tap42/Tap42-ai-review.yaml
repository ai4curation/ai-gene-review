id: Q9VJZ5
gene_symbol: Tap42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tap42 (CG31852) is the single Drosophila member of the IGBP1/TAP42 (alpha4) family
  of atypical regulatory subunits of the PP2A-family serine/threonine phosphatases. It binds the
  catalytic subunits of PP2A (Mts), PP4 and PP6 (PPV) directly, through a conserved central region
  (Arg152/Lys155 are required), and in vivo restrains PP2Ac abundance and keeps PP2Ac in the
  cytoplasm. Tap42 is essential for cell viability and larval development; null cells arrest
  before anaphase with disorganized spindles, activate JNK signaling and caspases and die, and
  wing-disc knockdown disrupts HH, DPP and JNK signaling and thorax/wing development, defects that
  are suppressed by reducing Mts dosage and rescued only by phosphatase-binding-competent Tap42.
  Unlike yeast Tap42, the fly protein is not required for TOR signaling.
