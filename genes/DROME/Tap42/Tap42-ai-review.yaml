  review:
    summary: A heterozygous hypomorphic mts allele (mtsXE2258, reduced phosphatase activity) suppresses
      the thorax/wing defects and lethality of Tap42 RNAi, consistent with Tap42 restraining Mts activity
      in vivo; Tap42 loss also raises PP2Ac levels (PMID:15802506).
    action: KEEP_AS_NON_CORE
    reason: The inhibitory direction is inferred genetically only; no phosphatase assay with fly Tap42
      has been reported, and other data (preanaphase arrest resembling PP2A loss; Tap42-dependent
      PP2Ac localization) indicate a context-dependent regulator rather than a simple inhibitor. The
      broader protein phosphatase regulator activity is retained as the core MF; this more specific
      inhibitor claim is kept as a non-core, genetically supported facet.
    supported_by:
    - reference_id: PMID:22701670
      supporting_text: The partial rescue by mtsXE2258 suggests that the defects seen in the Tap42RNAi
        flies are due, in part, to unregulated Mts activity, possibly as a result of increased Mts levels
        or enzymatic activity.
    - reference_id: PMID:15802506
      supporting_text: Thus, Tap42 acts independently of TOR to limit PP2Ac expression levels and to
        restrict its localization to the cytoplasm.
