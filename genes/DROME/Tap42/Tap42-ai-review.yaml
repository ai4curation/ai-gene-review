    supporting_text: In contrast to wild type Tap42 (Tap42WT), Tap42ED failed to interact with the Drosophila
      phosphatases (Fig. 6-A).
  - statement: Tap42 function in development requires phosphatase binding.
    supporting_text: These findings indicate that the Tap42RNAi-induced phenotypes are entirely due
      to the impaired interactions between Tap42 and PP2A family members
  - statement: Reduced Mts dosage suppresses Tap42 RNAi lethality.
    supporting_text: These findings demonstrate that Tap42's modulation of Mts plays an active role in
      Drosophila tissue development and viability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC3368869) read. Source of the FlyBase IDA, IGI and IMP rows.
