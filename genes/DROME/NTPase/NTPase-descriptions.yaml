descriptions:
- source: Alliance_Automated
  text: Enables GDP phosphatase activity; IDP phosphatase activity; and UDP phosphatase
    activity. Predicted to be involved in UDP catabolic process and protein N-linked
    glycosylation. Located in cytoplasm. Is expressed in adult head; adult heart;
    embryonic/larval salivary gland; embryonic/larval salivary gland body; and salivary
    gland body primordium. Orthologous to human ENTPD5 (ectonucleoside triphosphate
    diphosphohydrolase 5 (inactive)) and ENTPD6 (ectonucleoside triphosphate diphosphohydrolase
    6).
