- id: PMID:19467631
  title: The single NTPase gene of Drosophila melanogaster encodes an intracellular nucleoside triphosphate
    diphosphohydrolase 6 (NTPDase6).
  findings:
  - statement: The cloned fly enzyme hydrolyses UDP, GDP and IDP about equally well; other NDPs and
      NTPs are poor substrates.
    supporting_text: The enzyme hydrolyzed UDP, GDP, and IDP equally well whereas other NDP and NTP
      were poor substrates.
  - statement: Activity is latent in intact transfected S2 cells and the protein is mainly in the ER.
    supporting_text: Fluorescence microscopy revealed that the protein was located primarily in the
      ER.
  - statement: Disulfide-linked dimer formation, which inhibits activity, depends on C42 (transmembrane)
      and C447 (exoplasmic); these positions match O76268 (NTPase-PA) numbering.
    supporting_text: dimer formation required C42 in the transmembrane domain and C447 in the exoplasmic
      domain
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The only primary characterisation of the fly enzyme, and the source of all IDA
      rows. Only the abstract was available. The residue numbering in the abstract matches O76268
      (PA), not PE or PF, so this accession is the characterised product.
- id: PMID:15102851
  title: ire-1-dependent transcriptional up-regulation of a lumenal uridine diphosphatase from Caenorhabditis
    elegans.
  findings:
  - statement: UDA-1, the C. elegans member of the same PANTHER subfamily (SF127), is a UDP/GDPase
      with a luminal active site in a secretory-pathway compartment.
    supporting_text: UDA-1, is a UDP/GDPase encoded by the gene uda-1
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Characterises the closest experimentally studied relative, which shares the fly
      protein's PANTHER subfamily. Used as phylogenetically grounded corroboration of substrate class
      and luminal topology, and for the hypothesised role in glycoprotein re-glycosylation. Only the
      abstract was available.
- id: file:DROME/NTPase/NTPase-bioinformatics/RESULTS-rereview.md
  title: NTPase (O76268) re-review isoform identity and subfamily relatives
  findings:
  - statement: O76268 (PA) is a full-length isoform. PE and PF differ at the N-terminus or by an
      internal insertion, and the 271-residue PC/PD product lacks the transmembrane segment and ACR1.
    supporting_text: O76268 is a full-length isoform, not a fragment.
