id: O76268
gene_symbol: NTPase
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: NTPase encodes an intracellular NTPDase6-family nucleoside diphosphate phosphohydrolase.
  The 461-residue membrane-associated product hydrolyzes GDP, UDP and IDP efficiently and is localized
  predominantly to the endoplasmic reticulum in transfected Drosophila S2 cells. Its specificity and lumen-facing
  topology are consistent with nucleotide turnover associated with glycoprotein processing, rather than
  a general cell-surface ATP apyrase.
