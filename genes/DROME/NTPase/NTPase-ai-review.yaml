  review:
    action: ACCEPT
    summary: The enzyme is a nucleoside diphosphate phosphohydrolase.
    reason: Direct assays of the cloned fly protein establish GDP, UDP and IDP turnover with poor turnover
      of other NDPs and NTPs. This supports a diphosphatase interpretation more precisely than the historical
      apyrase name.
    supported_by:
