suggested_questions:
- question: Does loss of NTPase alter ER UDP/GDP levels, nucleotide-sugar import, or N-glycan processing
    and reglucosylation in fly tissues such as the salivary gland, where it is strongly expressed?
- question: Is the N-terminally truncated 271-residue PC/PD product, which lacks the transmembrane
    segment and ACR1, translated and catalytically active, or is it a non-functional gene-model
    product?
- question: Is fly NTPase, like its nematode subfamily co-member uda-1, induced by the unfolded protein
    response through Ire1?
suggested_experiments:
- description: Tag the endogenous protein to determine its localisation and topology in vivo, and use
    an NTPase null allele (for example the existing CRISPR sgRNA lines) with ER glycoproteomics and
    measurements of nucleotide and nucleotide-sugar pools.
- description: Express PA, PE, PF and PC/PD separately and compare their activity, localisation, and
    cross-linking-dependent dimerisation.
