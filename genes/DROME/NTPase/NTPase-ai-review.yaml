  review:
    action: UNDECIDED
    summary: Extracellular localization is not established for this input product.
    reason: The cloned fly NTPDase6 is predominantly ER-localized and becomes accessible after detergent.
      A distinct secreted isoform could explain a locus-level annotation, but the present 461-residue
      membrane product is not directly shown to be secreted.
