- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027128
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: No evidence that the fly enzyme is released; the characterised product is an ER membrane
      protein.
    reason: Some vertebrate relatives, such as ENTPD5 and ENTPD6, are known to be shed or secreted,
      but they sit in other PANTHER subfamilies (SF35, SF99). The fly protein is in SF127 with
      nematode UDA-1, which is a luminal membrane enzyme. In S2 cells the expressed fly protein is
      mainly in the ER, and its activity is latent in intact cells. None of the four annotated
      isoforms has a cleavable signal peptide that would generate a soluble secreted form, and the
      271-residue PC/PD product lacks the transmembrane segment entirely. The term is not
      impossible, but nothing specific to the fly supports it.
    supported_by:
    - reference_id: PMID:19467631
      supporting_text: S2 cells stably transfected with the Drosophila NTPDase6 cDNA displayed strong
        UDPase activity only after addition of NP-40, indicating the intracellular location of the
        enzyme.
    - reference_id: PMID:19467631
      supporting_text: Fluorescence microscopy revealed that the protein was located primarily in the
        ER.
    - reference_id: file:DROME/NTPase/NTPase-bioinformatics/RESULTS-rereview.md
      supporting_text: is an N-terminally truncated product identical to O76268 residues 191-461.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:19467631
  qualifier: located_in
  review:
    action: MODIFY
    summary: The direct localisation data support endoplasmic reticulum, a more specific part of the
      cytoplasm.
    reason: The same paper that supports this IDA row reports that the protein is located mainly in
      the ER. Cytoplasm is correct because it includes the ER, but it is less specific than the
      evidence allows. Endoplasmic reticulum is the supported refinement. A membrane-level term
      would also fit the single predicted transmembrane helix and the detergent-dependent activity.
    supported_by:
    - reference_id: PMID:19467631
      supporting_text: Fluorescence microscopy revealed that the protein was located primarily in the
        ER.
    proposed_replacement_terms:
