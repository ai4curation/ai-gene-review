id: O76268
gene_symbol: NTPase
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: NTPase (CG3059, also called NTPDase6) is the only GDA1/CD39-family nucleoside
  triphosphate diphosphohydrolase gene in Drosophila melanogaster. Its full-length products are
  type II membrane proteins with one N-terminal transmembrane segment and a large catalytic domain
  containing the apyrase conserved regions. The characterised 461-residue product hydrolyses UDP,
  GDP and IDP about equally well and turns over other nucleoside di- and triphosphates poorly. In
  transfected S2 cells the protein sits mainly in the endoplasmic reticulum, and its activity is
  latent until the membranes are permeabilised with detergent, which places the catalytic domain on
  the luminal side and not at the cell surface. Oxidative cross-linking through a transmembrane
  cysteine and an exoplasmic cysteine produces disulfide-linked dimers and inactivates the enzyme.
  In the GDA1/CD39 tree it groups with the nematode ER-luminal UDP/GDPase UDA-1, not with the
  ATP-hydrolysing cell-surface NTPDases. Like UDA-1, it probably clears the nucleoside
  diphosphates released by glycosyltransferases in the secretory pathway, but no loss-of-function
  study in the fly has tested that role.
