      label: endoplasmic reticulum
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028708
  review:
    action: UNDECIDED
    summary: A minor Golgi or pre-Golgi pool is plausible but has not been shown.
    reason: The fly enzyme was found mainly in the ER, a wording that does not exclude a minor pool
      elsewhere. The SF127 co-member UDA-1, expressed in yeast, fractionated with vesicles of density
      between ER and Golgi. The Golgi assignment itself comes from an ARBA rule that is driven by
      Golgi-resident family members such as yeast GDA1 and human ENTPD6, which are in other
      subfamilies. The evidence does not settle whether any of the fly protein resides in the Golgi.
    supported_by:
    - reference_id: PMID:19467631
      supporting_text: Fluorescence microscopy revealed that the protein was located primarily in the
        ER.
    - reference_id: PMID:15102851
      supporting_text: has a lumenal active site in vesicles displaying an intermediate density between
        those of the ER and GA when expressed in S. cerevisiae
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027801
  review:
    action: REMOVE
    summary: The direct data argue against a cell-surface location for the fly enzyme.
    reason: If the catalytic domain were at the cell surface, intact cells would hydrolyse
      extracellular UDP. In fact, transfected S2 cells show strong UDPase activity only after
      detergent permeabilisation, and microscopy places the protein mainly in the ER. Several
      inhibitors of the cell-surface NTPDases also fail to inhibit the fly enzyme, or inhibit it only
      partly. The fly protein belongs to the intracellular SF127 subfamily, so the plasma membrane
      location of the vertebrate ENTPD1-3 and ENTPD8 ectoenzymes should not be transferred to it.
    supported_by:
    - reference_id: PMID:19467631
      supporting_text: S2 cells stably transfected with the Drosophila NTPDase6 cDNA displayed strong
        UDPase activity only after addition of NP-40, indicating the intracellular location of the
        enzyme.
    - reference_id: PMID:19467631
      supporting_text: It was not or only partially inhibited by several modulators of the cell surface
        NTPDases
