id: O18645
gene_symbol: AMPKalpha
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: AMPKalpha (SNF1A) is the single catalytic alpha subunit of Drosophila AMP-activated protein
  kinase, a heterotrimeric serine/threonine kinase (with the beta subunit Alicorn and the gamma subunit
  SNF4Agamma) that senses cellular energy status. AMPKalpha is activated by phosphorylation of Thr184
  in its activation loop by LKB1 and by AMP binding to the gamma subunit when ATP is depleted. The active
  kinase phosphorylates metabolic and signalling substrates, including acetyl-CoA carboxylase, the TSC2
  homolog Gigas, and myosin regulatory light chain, thereby inhibiting TORC1-dependent anabolic growth,
  promoting autophagy and lipid catabolism, and maintaining energy homeostasis. It is present in the cytoplasm
  and nucleus. In the whole animal AMPKalpha is required for viability, starvation resistance and feeding/locomotor
  behaviour, visceral muscle function and nutrient uptake, mitosis, and maintenance of neurons including
  dendrites.
