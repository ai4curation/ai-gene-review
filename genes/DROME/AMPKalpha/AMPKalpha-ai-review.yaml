- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:36899949
  qualifier: involved_in
  review:
    summary: Proliferation annotation from a study of LKB1 phosphorylation by PDK1 and its effect on AMPK.
    action: MODIFY
    reason: The paper's title ("Phosphorylation of LKB1 by PDK1 Inhibits Cell Proliferation and Organ
      Growth by Decreased Activation of AMPK") reads as if AMPK promotes proliferation, but its Results
      and Discussion say the opposite. Decreased AMPK/mTOR activation leads to increased cell size and
      proliferation, and overactivation of the AMPK axis reduces body size by decreasing proliferation.
      This matches the same paper's TORC1 data (enhanced AMPK, decreased mTOR) on which the GO:1904263
      to GO:1904262 correction is based. AMPK therefore negatively regulates cell population proliferation
      in this system, a context-specific, non-core role.
    proposed_replacement_terms:
    - id: GO:0008285
      label: negative regulation of cell population proliferation
    supported_by:
    - reference_id: PMID:36899949
      supporting_text: thus resulting in decreased activation of AMPK and its downstream target mTOR,
        which leads to increased cell size and proliferation
    - reference_id: PMID:36899949
      supporting_text: adult flies exhibit a reduced body size due to decreased cell proliferation upon
        overactivation of the AMPK/mTOR axis
