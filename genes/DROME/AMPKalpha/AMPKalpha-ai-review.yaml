  title: Phosphorylation of LKB1 by PDK1 Inhibits Cell Proliferation and Organ Growth by Decreased Activation
    of AMPK.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Internally inconsistent on the direction of AMPK effects. The title says PDK1 phosphorylation
      of LKB1 inhibits proliferation by decreasing AMPK activation, and one Discussion sentence says increased
      AMPK activation results in increased mTOR activation; but the Results report that phospho-deficient
      LKB1 gives enhanced AMPK activation, decreased mTOR (phospho-S6K) activity and reduced cell size,
      and the Discussion concludes that decreased AMPK/mTOR activation leads to increased cell size and
      proliferation. Annotations derived from this paper (positive regulation of TORC1 signaling, positive
      regulation of cell population proliferation) were reviewed against the Results.
