      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Catalytic alpha subunit of AMPK conserving energy is correct. 'Usually
      active when TOR is inhibited' inverts the causal order the review gives (AMPK
      inhibits TORC1). No LKB1 activation or substrates.
- source: Alliance_Automated
  text: Enables AMP-activated protein kinase activity. Involved in several processes,
    including behavioral response to starvation; negative regulation of cell size;
    and regulation of TORC1 signaling. Located in basolateral part of cell; endosome;
    and nucleus. Is expressed in adult head. Used to study Parkinson's disease and
    obesity. Human ortholog(s) of this gene implicated in Huntington's disease; breast
    cancer; colon cancer; hyperinsulinism; and type 2 diabetes mellitus. Orthologous
    to several human genes including PRKAA2 (protein kinase AMP-activated catalytic
    subunit alpha 2).
  source_type: automated
  url: https://flybase.org/reports/AMPKα.html
  source_id: FB:FBgn0023169
