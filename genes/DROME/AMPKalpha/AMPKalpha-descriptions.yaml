descriptions:
- source: Alliance_Imported
  text: AMP-activated protein kinase &agr; subunit (AMPK&agr;) encodes the &agr; subunit
    of the AMP-activated protein kinase (AMPK) complex. In general AMPK helps cells
    conserve energy through inhibition of energy consuming processes (fatty acid synthesis,
    protein synthesis). AMPK is usually active when the TOR pathway is inhibited.
  source_type: curated
  url: https://flybase.org/reports/AMPKα.html
  source_id: FB:FBgn0023169
  review:
    reviewer: AI
    rubrics:
