      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: one of three Dorsocross T-box factors needed for amnioserosa
      differentiation and survival, cardiogenesis and ectodermal patterning. No Dpp
      input or targets named.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific
    and RNA polymerase II transcription regulatory region sequence-specific DNA binding
    activity. Involved in several processes, including anterior Malpighian tubule
    development; determination of wing disc primordium; and positive regulation of
    transcription by RNA polymerase II. Acts upstream of with a positive effect on
    imaginal disc fusion, thorax closure. Predicted to be active in chromatin and
    nucleus. Is expressed in several structures, including anlage in statu nascendi;
    epithelium; germ layer; gut section; and head epidermis primordium. Human ortholog(s)
    of this gene implicated in spondylocostal dysostosis 5. Orthologous to human TBX6
    (T-box transcription factor 6).
  source_type: automated
  url: https://flybase.org/reports/Doc1.html
  source_id: FB:FBgn0028789
