descriptions:
- source: Alliance_Imported
  text: Dorsocross1 (Doc1) encodes one of the three tissue-specific T-box transcription
    factors encoded by the Dorsocross cluster. It is crucial for completion of differentiation,
    cell proliferation arrest and survival of amnioserosa cells, as well as for cardiogenesis
    and the patterning and morphogenesis of particular ectodermal derivatives.
  source_type: curated
  url: https://flybase.org/reports/Doc1.html
  source_id: FB:FBgn0028789
