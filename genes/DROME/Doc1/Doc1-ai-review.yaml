taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dorsocross1 (Doc1) encodes a T-box transcription factor of the Tbx6-related subfamily, one
  of three closely related, clustered and functionally redundant paralogs (Doc1, Doc2, Doc3) with identical
  embryonic expression. Doc proteins bind T-box (GTG-containing) sites in enhancers via the T-box domain
  and act in the nucleus as activators or repressors of RNA polymerase II target genes. Doc genes are
  direct targets of high-level Dpp/Screw (BMP) signaling. In the early embryo they are required for differentiation
  and survival of the extraembryonic amnioserosa and for patterning of the dorsolateral ectoderm. In the
  dorsal mesoderm they are induced at the intersection of Dpp and Wingless signals and act with Tinman
  to activate pannier; mutual cross-regulation among Doc, Tinman and Pannier specifies cardiac progenitors,
  and Doc is required for all myocardial and most pericardial cells. Later Doc is re-expressed in a segmental
  subset of cardioblasts (restricted by Tinman) that form the ostia (inflow valves), where Doc activates
  targets such as Toll. Doc genes also function in wing disc primordium formation, anterior Malpighian
  tubule budding, and as Dpp mediators in leading-edge cells during pupal thorax closure.
