suggested_questions:
- question: Given the complete redundancy of Doc1, Doc2 and Doc3, which loss-of-function annotations derived
    from deficiencies removing all three genes should be propagated equally to each paralog?
- question: Does Doc physically interact with Tinman or Pannier on shared cardiac enhancers, as TBX5 does
    with NKX2-5 and GATA4 in vertebrates?
- question: Is there a GO term suitable for specification of the ostial (inflow valve) cardioblast fate
    in arthropod hearts?
suggested_experiments:
- description: Single-paralog CRISPR nulls of Doc1, Doc2 and Doc3 to test whether any paralog has a non-redundant
    function in heart or amnioserosa development.
- description: Co-immunoprecipitation and ChIP/CUT&RUN of Doc with Tinman and Pannier in embryonic cardiac
    mesoderm to test for a physical cardiogenic complex.
