- source: Alliance_Automated
  text: Enables RISC complex binding activity and siRNA binding activity. Involved
    in several processes, including female germ-line stem cell asymmetric division;
    miRNA metabolic process; and regulation of gene expression. Located in cytosol.
    Part of RISC-loading complex. Is expressed in several structures, including adult
    head; central brain primordium; embryonic/larval midgut primordium; ganglia; and
    glial cell. Human ortholog(s) of this gene implicated in dystonia 16. Orthologous
    to several human genes including TARBP2 (TARBP2 subunit of RISC loading complex).
