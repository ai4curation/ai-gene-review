descriptions:
- source: UniProt
  text: '[Isoform PA]: Double-stranded RNA-binding protein which can function in gene
    silencing by acting with Dcr-1 to enhance its ATP- independent processing of a
    specific subset of precursor micro-RNAs (pre-miRNAs) to mature miRNAs (PubMed:19635780,
    PubMed:26769856, PubMed:27184838). Some reports found it was able to enhance the
    efficiency of pre-miRNA processing by Dcr-1, and can shift the cleavage site of
    Dcr-1 altering the length of the mature miRNAs produced by Dcr- 1 alone (PubMed:17320391,
    PubMed:23063653, PubMed:29373753). However, in contrast to isoform PB, it is not
    necessary or sufficient for enhancing miRNA biogenesis, and is not required for
    development or female germline stem cell (GSC) maintenance (PubMed:17320391, PubMed:23063653).
    Another report also found that it decreases binding of Dcr-1 to the miRNA substrate
    let-7 (PubMed:17928574). . [Isoform PB]: Double-stranded RNA-binding protein which
    functions in gene silencing by acting with Dcr-1 to enhance its ATP- independent
    processing of a specific subset of precursor micro-RNAs (pre-miRNAs) to mature
    miRNAs (PubMed:15918769, PubMed:15985611, PubMed:17666393, PubMed:17928574, PubMed:19635780,
    PubMed:26769856, PubMed:27184838, PubMed:36182693). Function is essential for
    development and female germline stem cell (GSC) maintenance (PubMed:15985611,
    PubMed:17320391, PubMed:23063653). Functions in miRNA-mediated gene silencing
    by enhancing the binding affinity and specific pre-miRNA processing activity of
    Dcr-1, and as part of the loqs-PB-Dcr-1 complex, is involved in substrate discrimination,
    correctly positioning the pre-miRNA in the Dcr-1 catalytic center for cleavage,
    and miRNA loading into the Argonaute 1 (Ago1)-containing RNA- induced silencing
    complex (miRISC) (PubMed:15918769, PubMed:17666393, PubMed:17928574, PubMed:23063653,
    PubMed:27184838, PubMed:36182693). Increases the binding affinity of Dcr-1 to
    pre-miRNAs, thereby increasing dicing efficiency and broadening the range of substrates
    that can be processed by the dicer (PubMed:17928574, PubMed:23063653, PubMed:27184838,
    PubMed:36182693). It may also confer the substrate specificity of Dcr-1 towards
    pre-miRNAs, as in its absence Dcr-1 displays siRNA-generating activity towards
    long dsRNA substrates (PubMed:15918769). It can also shift the cleavage site of
    Dcr-1 for a small number of pre-miRNAs, changing the length of the mature miRNAs
    produced by Dcr-1 alone (PubMed:23063653, PubMed:29373753). Increases the range
    of pre-miRNAs that can be processed by Dcr-1, by enhancing the dicing of suboptimal
    hairpin substrates including ones with mismatches at the dicing site (PubMed:27184838,
    PubMed:29373753). This function may also promote the generation of novel miRNA
    genes as it appears to have an important role in processing evolutionarily young
    miRNA genes, suggesting that it may also enhance dicing of substrates that have
    not acquired hairpin features required for efficient miRNA processing (PubMed:27184838).
    As newly emerged miRNAs can have deleterious or beneficial effects on fitness,
    this function is likely part of a regulatory system that prevents excessive emergence
    of active miRNA genes and thus keeps them within an optimal range (PubMed:27184838).
    Also forms a RISC loading complex (miRLC) with Dcr-1 to mediate Ago1-loading of
    mature miRNAs into the RNA-induced silencing complex (miRISC) (PubMed:15918769,
    PubMed:36182693). In female ovaries, required for Dcr-1 to generate the twenty-three
    nucleotide isomiR variant of miR-307a which is able to repress its targets Gk2
    and tara (PubMed:23063653). . [Isoform PD]: Double-stranded RNA-binding protein
    which has an essential role in gene silencing (RNAi) by acting with Dcr-2 to enhance
    its ATP-dependent processing of a subset of endogenous (endo) and exogenous (exo)
    dsRNAs into short interfering RNAs (siRNAs) (PubMed:19635780, PubMed:19644447,
    PubMed:21245036, PubMed:23063653, PubMed:25891075, PubMed:27184838, PubMed:28874570,
    PubMed:29040648, PubMed:29550490, PubMed:34590626). Functions in RNAi by increasing
    the initial binding affinity of Dcr-2 to certain dsRNA substrates, and in the
    absence of r2d2, may also function in siRNA loading into the Argonaute 2 (AGO2)-containing
    RNA-induced silencing complex (siRISC) and guide strand selection for target silencing
    by the siRISC (PubMed:19635780, PubMed:19644447, PubMed:21245036, PubMed:29550490).
    Promotes Dcr-2 cleavage of a subset of dsRNAs, including endo-dsRNAs derived from
    convergent transcription, inverted repeats and transposons (PubMed:19635780, PubMed:19644447,
    PubMed:21245036, PubMed:23063653, PubMed:29550490). Also enables Dcr-2 to produce
    hairpin-derived endo- siRNAs in the presence of cellular inhibitory inorganic
    phosphate, likely by increasing the binding affinity of the enzyme to the hairpin
    dsRNAs allowing the dsRNA to displace phosphate bound to Dcr-2 (PubMed:29550490).
    According to many reports, the cleavage reaction mode of Dcr-2 changes according
    to the termini of the dsRNA substrate, with the enzyme displaying a preference
    for processing blunt termini (BLT), likely non-self dsRNAs, over dsRNAs with 2
    nucleotides 3'' overhanging (3''ovr) termini, which are typically the structure
    of endo- dsRNAs (PubMed:25891075, PubMed:29550490, PubMed:34590626). According
    to many reports, interaction with Loqs-PD modifies the molecular recognition mechanisms
    of Dcr-2 towards sub-optimal 3''ovr dsRNA substrates and thus enables the dicer
    to cleave endo-dsRNA templates with diverse termini (PubMed:25891075, PubMed:29550490).
    However, according to another report, the mode of cleavage reaction is not affected
    by the presence or absence of loqs-PD (PubMed:34590626). In the absence of r2d2,
    may also form an alternative RISC loading complex (siRLC) with Dcr-2 to mediate
    AGO2-loading of endo- and exo-siRNAs into the RNA-induced silencing complex (siRISC)
    (PubMed:21245036, PubMed:29040648). Many reports suggest that loqs-PD and r2d2
    function independently with dcr-2 in distinct siRNA pathways, and may even compete
    for binding to the enzyme (PubMed:21245036, PubMed:29040648). Loaded siRNAs serve
    as a guide to direct the siRISC to complementary RNAs to degrade them or prevent
    their translation (PubMed:29040648). The siRLC plays an important role in the
    ATP-dependent asymmetry sensing of the duplex, and is therefore also responsible
    for the selection of the strand that ultimately acts as the guide siRNA for the
    siRISC (PubMed:29040648). Thermodynamically asymmetric endo-siRNAs can be pre-oriented
    in the siRLC by the Loqs-PD and DCr-2 complex, which preferentially binds to the
    most thermodynamically stable strand prior to loading into the siRISC (PubMed:29040648).
    Appears to be involved in promoting double-strand breaks (DSBs) following exposure
    to a low- dose/dose-rate (LDR) of ionizing radiation (PubMed:36057690).'
