id: Q9VJY9
gene_symbol: loqs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Loquacious (loqs, R3D1) encodes a family of cytoplasmic double-stranded RNA-binding proteins
  related to mammalian TRBP and PACT. They act as non-catalytic partners of the two Drosophila
  Dicer ribonucleases, and alternative splicing and polyadenylation sort them between the
  miRNA and siRNA pathways. The canonical isoform Loqs-PB (465 aa) carries three
  dsRNA-binding domains (DRBMs). DRBM1 and DRBM2 bind RNA; DRBM2 binds the pre-miRNA stem;
  DRBM3, with the linker before it, binds the helicase domain of Dicer-1. Loqs-PB forms a 1:1
  heterodimer with Dicer-1 that raises the affinity of Dicer-1 for pre-miRNAs and stimulates
  their cleavage. In the complex, the dsRBDs of Dicer-1 and Loqs-PB wrap the pre-miRNA stem
  and place the scissile bonds in the RNase III active sites, and for some pre-miRNAs (e.g.
  pre-miR-307a) Loqs-PB shifts where Dicer-1 cuts. Loqs-PB also co-purifies with Dicer-1 and
  AGO1 in a miRNA RISC-loading complex. It is absent from mature AGO1-GW182 miRISC and is not
  required for miRISC assembly. Isoform Loqs-PA also binds Dicer-1 and supports viability.
  Isoform Loqs-PD lacks DRBM3 and has a unique C-terminus that binds the helicase domain of
  Dicer-2. Loqs-PD enhances Dicer-2 processing of endogenous (hairpin, transposon, cis-NAT)
  and exogenous dsRNAs into siRNAs, for example by lowering the KM of Dicer-2 and relieving
  phosphate inhibition. Its DRBMs bind siRNA duplexes, and with Dicer-2 it can form an
  alternative RISC-loading complex that selects the guide strand of endo-siRNAs. Loss of loqs
  causes pre-miRNA accumulation, embryonic and larval lethality, and Loqs-PB-dependent loss of
  female germline stem cells and fertility.
