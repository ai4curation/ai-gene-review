core_functions:
- description: Loqs-PB binds the double-stranded stem of pre-miRNA hairpins through its DRBMs
    (principally DRBM2) and, with the Dicer-1 dsRBD, positions the substrate for Dicer-1
    cleavage into mature miRNAs in the cytoplasm.
  molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  directly_involved_in:
  - id: GO:0031054
    label: pre-miRNA processing
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:17666393
    supporting_text: Loqs-PB uses the second dsRNA-binding domain to bind pre-miRNA and the third dsRNA-binding
      domain to interact with Dcr-1.
  - reference_id: PMID:36182693
    supporting_text: form a tight belt around the pre-miRNA, distorting the RNA helix to place the scissile
      phosphodiester bonds in the RNase III active sites
- description: Loqs-PB binds Dicer-1 through DRBM3 as a 1:1 heterodimer. It increases Dicer-1 affinity
    for pre-miRNAs, stimulates miRNA production and tunes the cleavage site, acting as an activating
    cofactor of the RNase III enzyme within the Dcr-1/Loqs-PB/AGO1 miRNA RISC-loading complex.
  molecular_function:
    id: GO:0170054
    label: ribonuclease activator activity
  directly_involved_in:
  - id: GO:0031054
    label: pre-miRNA processing
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0070578
    label: RISC-loading complex
  supported_by:
  - reference_id: PMID:17666393
    supporting_text: Both domains of Loqs-PB are required for efficient miRNA production by enhancing
      the affinity of Dcr-1 for pre-miRNA.
  - reference_id: PMID:15985611
    supporting_text: recombinant R3D1-L enhances miRNA production by Dicer-1 in vitro
  - reference_id: PMID:19451544
    supporting_text: we consider the AGO1-DCR-1-LOQS complex as miRLC in Drosophila
- description: Loqs-PD binds the helicase domain of Dicer-2 through its unique C-terminus and binds
    dsRNA through its two DRBMs. It enhances Dicer-2 cleavage of endogenous and exogenous dsRNA
    precursors into siRNAs, including otherwise refractory substrates.
  molecular_function:
    id: GO:0170054
    label: ribonuclease activator activity
  directly_involved_in:
  - id: GO:0030422
    label: siRNA processing
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:28874570
    supporting_text: Loqs-PD enhances the rate of dsRNA cleavage by Dicer-2 and also enables processing
      of substrates normally refractory to cleavage
  - reference_id: PMID:21245036
    supporting_text: Loqs-PD can interact via the C-terminus unique to this isoform with the DExH/D-helicase
      domain of Drosophila Dcr-2
- description: The Loqs-PD DRBMs bind siRNA duplexes, preferring the thermodynamically more stable
    end. With Dicer-2 they form an alternative RISC-loading complex that pre-orients the guide
    strand of endo-siRNAs for AGO2 loading. This is a secondary route alongside the canonical
    Dcr-2/R2D2 RLC.
  molecular_function:
    id: GO:0035197
    label: siRNA binding
  in_complex:
    id: GO:0070578
    label: RISC-loading complex
  supported_by:
  - reference_id: PMID:29040648
    supporting_text: Two canonical dsRBDs in Loqs-PD bind to siRNAs with enhanced affinity compared
      to miRNA/miRNA* duplexes.
  - reference_id: PMID:29040648
    supporting_text: forms an alternative RLC with Dcr-2 that is required for strand choice of endogenous
      siRNAs in S2 cells
suggested_questions:
- question: Does Loqs-PA, which binds Dicer-1 and supports viability but cannot sustain germline stem
    cells, differ from Loqs-PB in Dicer-1 stimulation or in which pre-miRNAs it supports?
- question: How much do the Loqs-PD/Dicer-2 alternative RLC and the canonical R2D2/Dicer-2 RLC each
    contribute to endo-siRNA loading in intact animal tissues, as opposed to S2 cells?
- question: Is there any isoform-specific nuclear pool of Loqs (as for its family member blanks), or
    is the PTHR46205 family-level nucleus propagation not applicable to Loqs?
suggested_experiments:
- description: Profile miRNA cleavage sites and Dicer-1 binding kinetics in loqs-null flies rescued
    with Loqs-PA versus Loqs-PB, to define PB-specific substrates that explain the germline stem
    cell requirement.
- description: In loqs-PD-specific and r2d2 mutant fly tissues, measure Ago2 loading and guide-strand
    selection of endo-siRNAs (oxidation-resistant small-RNA sequencing) to quantify the in vivo
    contribution of the Loqs-PD/Dcr-2 alternative RLC.
