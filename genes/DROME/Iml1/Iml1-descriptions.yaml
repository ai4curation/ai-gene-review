- source: Alliance_Automated
  text: Predicted to enable GTPase activator activity. Involved in several processes,
    including germarium-derived cystoblast division; germline cell cycle switching,
    mitotic to meiotic cell cycle; and negative regulation of TORC1 signaling. Located
    in lysosome. Part of Seh1-associated complex. Is expressed in adult head. Used
    to study familial focal epilepsy with variable foci 1. Human ortholog(s) of this
    gene implicated in developmental and epileptic encephalopathy 111 and familial
    focal epilepsy with variable foci 1. Orthologous to human DEPDC5 (DEP domain containing
    5, GATOR1 subcomplex subunit).
