- source: Alliance_Imported
  text: Increased minichromosome loss 1 (Iml1) encodes a component of the highly conserved
    GAP Activity Towards Rags 1 (GATOR1) complex, which inhibits the  activity of
    the product of mTor in response to amino acid starvation. The product of Iml1,
    as well as the other GATOR1 components encoded by Nprl2 and Nprl3, regulates early
    meiotic progression.
