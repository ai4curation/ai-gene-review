descriptions:
- source: Alliance_Automated
  text: Enables actin filament binding activity. Involved in actomyosin contractile
    ring organization and wound healing. Predicted to be located in mitochondrion.
    Predicted to be part of septin complex. Predicted to be active in cell division
    site; cytoskeleton; and synaptic vesicle. Is expressed in several structures,
    including adult head; brain; central brain primordium; dopaminergic neurons; and
    embryonic dorsal vessel. Used to study neurodegenerative disease. Human ortholog(s)
    of this gene implicated in spermatogenic failure 99. Orthologous to several human
    genes including SEPTIN5 (septin 5).
