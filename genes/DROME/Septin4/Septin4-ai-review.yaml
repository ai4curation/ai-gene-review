id: Q0KHR7
gene_symbol: Septin4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Septin4 (Sep4) is a Drosophila SEPT2-class septin GTPase, paralogous to Sep1, that assembles
  with Septin5 and Peanut into the Sep4-Sep5-Pnut hetero-oligomer. This complex is recruited to wounds
  independently of Anillin, overlaps the actomyosin ring, and bends actin bundles into wider rings than
  the Sep1-Sep2-Pnut complex; Sep4 knockdown delays actomyosin ring disassembly during single-cell wound
  repair. Purified Sep4 binds and bundles actin filaments.
