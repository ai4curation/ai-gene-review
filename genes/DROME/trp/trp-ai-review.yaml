    label: cellular response to anoxia
  evidence_type: IGI
  original_reference_id: PMID:10908615
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0005614
  review:
    summary: TRP and TRPL open under anoxia and mediate the resulting depolarization and Ca2+ influx.
    action: KEEP_AS_NON_CORE
    reason: PMID:10908615 (full text) shows trpl;trp double mutants lack anoxia-induced depolarization
      and Ca2+ influx; TRP is a direct target of metabolic stress. This is a genuine but peripheral response.
    supported_by:
    - reference_id: PMID:10908615
      supporting_text: Genetic elimination of both TRP and TRPL channels prevented the effects of anoxia,
        mitochondrial uncouplers, and depletion of ATP, thus demonstrating that the TRP and TRPL channels
        are specific targets of metabolic stress.
    - *id024
- term:
    id: GO:0030424
    label: axon
  evidence_type: IDA
  original_reference_id: PMID:22952921
  qualifier: located_in
  review:
    summary: TRP is present in photoreceptor axons and synaptic terminals in the lamina.
    action: NEW
    reason: Direct immunohistochemical localization in brain slices (PMID:22952921, full text read) shows
      TRP in R1-R6 photoreceptor axons in the lamina, where TRP/TRPL support store-dependent Ca2+ entry.
      This is a secondary location beside the rhabdomere. The accompanying exocytosis defect in mutants
      is phenotype evidence only, so no process term is proposed.
    supported_by:
    - reference_id: PMID:22952921
      supporting_text: Immunohistochemical images revealed considerable expression in photoreceptors axons
        at the lamina.
    - reference_id: PMID:22952921
      supporting_text: These channels appear to be activated by a store-depletion mechanism and may contribute
        to Ca2+-dependent vesicle exocytosis.
