    label: retina homeostasis
  evidence_type: IMP
  original_reference_id: PMID:27054334
  qualifier: involved_in
  review:
    summary: Retinal degeneration in the constitutively active TrpP365 allele is a consequence of Ca2+
      overload, not a TRP activity that maintains the retina.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:27054334 (full text read) studies degeneration caused by the gain-of-function TrpP365
      channel and its suppression by PINK1/Parkin. That excessive TRP-mediated Ca2+ entry kills photoreceptors,
      and that null alleles also degenerate (PMID:16301334), shows TRP activity affects retinal survival,
      but TRP does not perform a homeostatic process; the effect is indirect.
    supported_by:
    - &id011
      reference_id: PMID:27054334
      supporting_text: These results suggest that the death of TrpP365 mutant photoreceptor cells primarily
        resulted from the disruption of mitochondrial function caused by calcium overload.
    - &id019
      reference_id: PMID:10632594
      supporting_text: Whole-cell recordings clarified the mechanism underlying the retinal degeneration
        by showing that the TRP channels of Trp(P365) are constitutively active.
    - reference_id: PMID:16301334
      supporting_text: disruption of channel function caused profound light-induced cell death
