        terminus, and this interaction was required for localization of INAD.
    - &id014
      reference_id: PMID:10995445
      supporting_text: Rather, the primary function of the TRP/ INAD complex is to form the core unit
        required for localization of the signalplex to the rhabdomeres.
    - &id020
      reference_id: PMID:16301334
      supporting_text: Drosophila transient receptor potential (TRP) serves dual roles as a cation channel
