  review:
    summary: TRP sits in the photoreceptor plasma membrane of the rhabdomere, at the base of the microvilli.
    action: MODIFY
    reason: Correct but general. TRP is a multipass plasma-membrane channel, and the specific supported
      location is the rhabdomere membrane (PMID:2516726, PMID:7751943), which the gene already carries;
      refine to it. TRP is also detected in photoreceptor axons (PMID:22952921), recorded as a separate
      NEW row. The PAINT node placement (TRPC clade) is sound; only the granularity is refined.
    supported_by:
