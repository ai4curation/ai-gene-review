  review:
    summary: TRP is the pore-forming, Ca2+-selective subunit of the major light-activated channel of fly
      photoreceptors.
    action: ACCEPT
    reason: Core function. The trp mutation abolishes the Ca2+-permeable light-activated conductance (PMID:1314617),
      and mutation of Asp621 in the pore eliminates Ca2+ permeation in vivo (PMID:17234592). The ISS rows
      transfer from mammalian TRPC1, a weaker source, but the claim is established directly for TRP; the
      IEA row reflects the TRPC_channel signature.
