      it (PMID:9930700). Mammalian TRPC IP3-related data concern interaction with IP3 receptors rather
      than direct ligand binding. The term likely over-propagates.
    supported_by:
    - *id025
    - reference_id: PMID:9930700
      supporting_text: Here we show that both of these fatty acids reversibly activate native light-sensitive
        channels (transient receptor potential (TRP) and TRP-like (TRPL)) in Drosophila photoreceptors
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      source_entities:
      - source_id: PANTHER:PTN000012230
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The TRPC-clade node propagates IP3 binding seeded by mammalian TRPC data; no target evidence
          supports IP3 binding by the founding Drosophila TRP.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - SOURCE_EVIDENCE_WEAK
