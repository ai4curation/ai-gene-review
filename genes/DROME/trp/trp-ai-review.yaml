id: P19334
gene_symbol: trp
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: trp encodes TRP (transient receptor potential), the founding member of the TRP cation channel
  superfamily (TRPC subfamily). It is a 1275-residue protein with N-terminal ankyrin repeats, six transmembrane
  helices with a pore loop, a TRP domain and a long cytoplasmic C-terminus. In the microvillar photoreceptors
  of the compound eye, TRP subunits assemble as homotetramers that form the major Ca2+-selective light-activated
  channel, opened downstream of rhodopsin, Gq and phospholipase C (NORPA); Asp621 in the pore forms the
  Ca2+ selectivity filter. Together with the related TRPL channel it carries the light-induced current,
  and TRP-mediated Ca2+ entry drives response amplification, adaptation and inactivation. TRP localizes
  to the rhabdomere membrane, where its C-terminus binds PDZ3 of the scaffold INAD, anchoring the INAD
  signalplex (PLC, eye-PKC) in the rhabdomere; auxiliary INAF subunits stabilize it. TRP is phosphorylated
  by eye-PKC and is also present in photoreceptor axon terminals. Loss of channel function or constitutive
  activity causes light-dependent retinal degeneration.
