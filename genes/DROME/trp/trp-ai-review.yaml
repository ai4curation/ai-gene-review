suggested_questions:
- question: What is the physiological gating mechanism of TRP in the rhabdomere (DAG/PUFA, PIP2 depletion,
    protons, or membrane mechanics), and is any of it shared with the store-dependent activation reported
    in photoreceptor axons?
- question: Does trp contribute directly to olfactory adaptation or hearing, and if so in which cells,
    given that TRP expression is not detected in the mature antenna?
- question: Should the TRPC-clade PAINT node carrying store-operated calcium channel activity and IP3
    binding be reconsidered for invertebrate TRP channels?
suggested_experiments:
- experiment_type: Cryo-EM structure
  hypothesis: Native TRP tetramers bind DAG or PUFA at a defined lipid site that couples PLC activity
    to gating.
  description: Purify TRP from fly heads or heterologous cells, determine structures with and without
    candidate lipid agonists, and test site mutants by in vivo whole-cell recording.
- experiment_type: Cell-specific rescue
  hypothesis: TRP in photoreceptor axon terminals contributes to synaptic transmission independently of
    its rhabdomeric role.
  description: Express rhabdomere-excluded or terminal-targeted TRP in trpl;trp mutants and measure lamina
    ERG on-transients and FM dye uptake.
