- source: Alliance_Automated
  text: Enables calcium channel activity; protein heterodimerization activity; and
    protein homodimerization activity. Involved in several processes, including cellular
    response to anoxia; detection of light stimulus; and olfactory learning. Located
    in rhabdomere microvillus membrane. Part of cation channel complex and inaD signaling
    complex. Is expressed in several structures, including adult antennal nerve; light-sensitive
    neurons; organism subdivision; photoreceptor; and rhabdomere. Used to study neurodegenerative
    disease. Human ortholog(s) of this gene implicated in lung cancer. Orthologous
    to several human genes including TRPC4 (transient receptor potential cation channel
    subfamily C member 4) and TRPC5 (transient receptor potential cation channel subfamily
    C member 5).
