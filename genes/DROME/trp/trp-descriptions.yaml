    overall_notes: 'Correct: light-sensitive Ca2+ channel downstream of PLC, acting
      with TRPL, activated by fatty acids and metabolic stress; olfactory adaptation
      added. Hedged on TRP/TRPL assembly and silent on INAD.'
- source: Alliance_Imported
  text: transient receptor potential (trp) encodes a non-selective plasma membrane
    cation channel with high Ca[2+] permeability. It is highly eye-enriched and contributes
    to the electrical response to light in photoreceptors.
