descriptions:
- source: UniProt
  text: A light-sensitive calcium channel that is required for inositide-mediated
    Ca(2+) entry in the retina during phospholipase C (PLC)-mediated phototransduction.
    Ca(2+) influx may then feed back and inhibit PLC, thereby facilitating phosphatidylinositol
    4,5 bisphosphate (PIP2) recycling. Trp and trpl act together in the light response,
    though it is unclear whether as heteromultimers or as distinct units, and are
    activated by fatty acids and metabolic stress. Also required for olfactory adaptation
    and may be involved in olfactory system development.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19334
  source_id: P19334
