    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Ketolysis and ketogenesis at the acetoacetyl-CoA node are correct.
      The claim of a role in the last step of beta-oxidation belongs to the 3-ketoacyl-CoA
      thiolase (Acaa) and is not in the review. Omits isoleucine catabolism.
- source: Alliance_Automated
  text: Predicted to enable acetyl-CoA C-acetyltransferase activity. Predicted to
    be involved in L-isoleucine catabolic process; acetyl-CoA biosynthetic process;
    and lipid catabolic process. Located in mitochondrion. Is active in mitochondrial
    matrix. Is expressed in adult head; adult heart; and embryonic/larval midgut.
    Human ortholog(s) of this gene implicated in beta-ketothiolase deficiency and
    carbohydrate metabolic disorder. Orthologous to human ACAT1 (acetyl-CoA acetyltransferase
    1).
  source_type: automated
