descriptions:
- source: Alliance_Imported
  text: Acetyl-CoA acetyltransferase 1 (Acat1) encodes a mitochondrial enzyme that
    catalyzes the thiolytic cleavage of acetoacetyl-CoA in the last step of ketolysis.
    Acat1 is also involved in beta oxidation last step in which fatty acids are broken
    down to acetyl-CoA. Acat1 activity is reversible catalyzing the condensation of
    two acetyl-CoA into acetoacetyl-CoA in the first step of ketogenesis.
  source_type: curated
  url: https://flybase.org/reports/Acat1.html
  source_id: FB:FBgn0029969
