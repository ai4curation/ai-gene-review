    overall_notes: 'Correct and cited: ATPase-driven client maturation with co-chaperones,
      canalization with Hop and Piwi, and piRNA loading into PIWI proteins. Omits
      centrosome and exosome roles.'
- source: Alliance_Automated
  text: Enables TPR domain binding activity; insulin receptor binding activity; and
    protein folding chaperone. Involved in several processes, including cold acclimation;
    multivesicular body fusion to apical plasma membrane; and protein-containing complex
    assembly. Located in centrosome; perinuclear region of cytoplasm; and polytene
    chromosome interband. Part of endoplasmic reticulum chaperone complex and protein
    folding chaperone complex. Is expressed in several structures, including anlage
    in statu nascendi; embryonic/larval midgut primordium; germline cell; head epidermis
    primordium; and sensory nervous system primordium. Human ortholog(s) of this gene
    implicated in infertility and multiple sclerosis. Orthologous to several human
    genes including HSP90AB1 (heat shock protein 90 alpha family class B member 1).
  source_type: automated
