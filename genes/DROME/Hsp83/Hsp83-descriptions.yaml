descriptions:
- source: UniProt
  text: Molecular chaperone that promotes the maturation, structural maintenance and
    proper regulation of specific target proteins involved for instance in cell cycle
    control and signal transduction (PubMed:18344983, PubMed:21186352, PubMed:22902557).
    Undergoes a functional cycle that is linked to its ATPase activity. This cycle
    probably induces conformational changes in the client proteins, thereby causing
    their activation. Interacts dynamically with various co- chaperones that modulate
    its substrate recognition, ATPase cycle and chaperone function. Together with
    Hop and piwi, mediates canalization, also known as developmental robustness, likely
    via epigenetic silencing of existing genetic variants and suppression of transposon-induced
    new genetic variation. Required for piRNA biogenesis by facilitating loading of
    piRNAs into PIWI proteins (PubMed:21186352, PubMed:22902557).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P02828
  source_id: P02828
