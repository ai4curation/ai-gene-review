    summary: >-
      Top-ranked hit (score 16.40), an exact GOA match with IPI evidence. TPR-domain binding is the
      mechanistically right thing to say about an HSP90: the C-terminal MEEVD motif recruits TPR co-chaperones
      such as Hop, and this review lists Hop, Shu, Dpit47 and Morgana as partners. Correct and specific,
      already annotated.
