id: P02828
gene_symbol: Hsp83
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Hsp83, the sole Drosophila HSP90 chaperone. Rank 1 is an
  exact GOA match supported by IPI and captures the co-chaperone interface that defines HSP90 biology;
  rank 2 names the HSP90-CDC37 kinase-loading complex. The chaperone activity itself - this review's
  core molecular function, ATP-dependent protein folding chaperone - never appears in the top five,
  so the list describes what Hsp83 binds without saying what it does. Ranks 3 to 5 drift into Drosophila
  developmental phenotypes. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 nonparalog
  incorrect (NPI).
