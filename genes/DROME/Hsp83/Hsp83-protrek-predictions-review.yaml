  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 14.97), absent from GOA and a strict descendant of the annotated cytoplasm. The
      HSP90-CDC37 complex is the canonical kinase-client loading module and is conserved in Drosophila,
      where Cdc37 is required for Hsp83-dependent kinase maturation. A correct, specific and novel
      complex assignment - the kind of call that is useful precisely because the existing annotation
      set records only generic chaperone complexes.
    supported_by:
