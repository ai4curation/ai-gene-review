suggested_questions:
- question: Is Tdh catalytic activity required in neurons specifically for the sleep phenotype,
    or does elevated circulating threonine from peripheral tissues drive it?
- question: Does Tdh contribute substantially to glycine pools in flight muscle, where its
    knockdown impairs function, or is the muscle phenotype due to threonine accumulation?
suggested_experiments:
- hypothesis: The muscle and sleep phenotypes of Tdh loss depend on its dehydrogenase activity.
  description: Rescue Tdh mutants with wild-type versus catalytically inactive (NAD-binding motif
    mutant) Tdh transgenes and measure threonine, glycine, sleep latency and flight performance.
