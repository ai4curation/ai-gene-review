  label: Drosophila melanogaster
description: Tdh (CG5955) encodes the Drosophila mitochondrial L-threonine 3-dehydrogenase (EC
  1.1.1.103), an NAD(+)-dependent short-chain dehydrogenase of the NAD(P)-dependent
  epimerase/dehydratase family. It catalyzes the first step of the threonine dehydrogenase
  pathway, oxidizing L-threonine to 2-amino-3-oxobutanoate, which the downstream ligase Gcat
  converts to glycine and acetyl-CoA. Hypomorphic Tdh mutants accumulate threonine and show
  increased sleep drive, and Tdh is among the glycine-metabolism genes induced by time-restricted
  feeding whose muscle-specific knockdown impairs flight muscle function and causes ectopic lipid
  accumulation.
