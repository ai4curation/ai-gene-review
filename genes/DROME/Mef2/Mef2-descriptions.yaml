    overall_notes: Correct but partly hedged ('could be', 'may be required') on mesoderm
      differentiation; cited myoblast fusion and sing activation. Omits fat-body,
      immune and clock roles.
- source: Alliance_Imported
  text: Myocyte enhancer factor 2 (Mef2) encodes a protein that belongs to the MADS-box
    family of transcription factors and is required for muscle development. It directly
    activates a large number of muscle protein genes. It also regulates gene expression
    in other tissues, including the fat body and neural tissue.
  source_type: curated
  url: https://flybase.org/reports/Mef2.html
  source_id: FB:FBgn0011656
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: MADS-box TF required for muscle development, activating
      muscle genes, also acting in fat body and neural tissue. No named partners.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific
    and cis-regulatory region sequence-specific DNA binding activity. Involved in
    several processes, including anterior midgut development; muscle cell differentiation;
    and regulation of gene expression. Located in nucleus. Is expressed in several
    structures, including Kenyon cell; adult pacemaker neurons; dorsal vessel wall
    cell; muscle cell; and synaptic neuropil subdomain. Used to study attention deficit
    hyperactivity disorder and neurodegenerative disease. Human ortholog(s) of this
    gene implicated in dilated cardiomyopathy; myocardial infarction; and neurodevelopmental
    disorder with hypotonia, stereotypic hand movements, and impaired language. Orthologous
    to several human genes including MEF2A (myocyte enhancer factor 2A) and MEF2C
    (myocyte enhancer factor 2C).
