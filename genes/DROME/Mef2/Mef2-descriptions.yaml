descriptions:
- source: UniProt
  text: Transcription factor that could be a key player in early mesoderm differentiation
    and may be required for subsequent cell fate specifications within the somatic
    and visceral/heart mesodermal layers (PubMed:7839146, PubMed:8052612, PubMed:8202544).
    Essential for myoblast fusion and consequently muscle formation in adults (PubMed:25797154).
    During embryonic and pupal development, binds to the enhancer of the myoblast
    fusion gene sing and activates its transcription (PubMed:25797154).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40791
  source_id: P40791
