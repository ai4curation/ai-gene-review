    structures, including Kenyon cell; adult pacemaker neurons; dorsal vessel wall
    cell; muscle cell; and synaptic neuropil subdomain. Used to study attention deficit
    hyperactivity disorder and neurodegenerative disease. Human ortholog(s) of this
    gene implicated in dilated cardiomyopathy and neurodevelopmental disorder with
    hypotonia, stereotypic hand movements, and impaired language. Orthologous to several
    human genes including MEF2A (myocyte enhancer factor 2A) and MEF2C (myocyte enhancer
