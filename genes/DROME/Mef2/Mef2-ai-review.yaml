id: P40791
gene_symbol: Mef2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mef2 (D-mef2) encodes the single Drosophila member of the MEF2 family of MADS-box transcription factors.
  It is expressed throughout the mesoderm after gastrulation as a Twist target and is then maintained in somatic,
  visceral and cardiac muscle lineages, with its cardiac expression driven by a Tinman-dependent enhancer. D-MEF2
  dimerizes through its MADS/MEF2 domains and binds A/T-rich MEF2 sites in enhancers of muscle structural genes,
  fusion genes (e.g. singles bar) and microRNA genes (miR-92b, which feeds back to limit Mef2 levels), activating
  transcription alone or with cofactors such as CF2. It is not needed for myoblast specification but is required
  for differentiation of somatic, visceral and cardiac muscle, for myoblast fusion in embryos and pupae, and for
  adult flight muscle formation, with different targets responding to different Mef2 activity levels. Outside muscle,
  Mef2 is required in clock neurons for circadian behavioral rhythms and in the adult fat body, where it promotes
  lipogenic and glycogenic gene expression and, upon infection, partners with TBP to induce antimicrobial peptides.
