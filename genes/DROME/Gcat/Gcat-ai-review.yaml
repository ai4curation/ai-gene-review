suggested_questions:
- question: How much of Drosophila glycine is produced through the Tdh/Gcat threonine pathway
    versus serine hydroxymethyltransferase, and does this vary with diet or tissue?
- question: Does Gcat physically associate with Tdh in the mitochondrial matrix to channel the
    unstable 2-amino-3-oxobutanoate intermediate, as proposed for the bacterial enzymes?
suggested_experiments:
- hypothesis: Gcat loss in flies diverts 2-amino-3-oxobutanoate to aminoacetone and elevates
    threonine, phenocopying Tdh hypomorphs (for example, increased sleep drive).
  description: Generate a Gcat null allele and measure threonine, glycine and aminoacetone by
    targeted metabolomics, then test sleep latency and muscle performance alongside Tdh mutants.
