id: Q9VTN9
gene_symbol: Gcat
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gcat (CG10361) encodes the Drosophila mitochondrial 2-amino-3-ketobutyrate coenzyme A
  ligase (glycine C-acetyltransferase, EC 2.3.1.29), a pyridoxal 5'-phosphate-dependent member of
  the class-II aminotransferase (alpha-oxoamine synthase) family. It catalyzes the second step of
  the threonine dehydrogenase pathway, cleaving 2-amino-3-oxobutanoate produced by the
  mitochondrial L-threonine 3-dehydrogenase (Tdh) with coenzyme A to yield glycine and
  acetyl-CoA, thereby linking L-threonine catabolism to glycine production in the mitochondrial
  matrix. Its function in flies is inferred from strong conservation with the characterized
  vertebrate and bacterial enzymes; no fly-specific biochemical or genetic study is available.
