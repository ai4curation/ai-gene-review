- source: Alliance_Automated
  text: Predicted to enable glycine C-acetyltransferase activity. Predicted to be
    involved in L-threonine catabolic process and glycine biosynthetic process. Predicted
    to be active in mitochondrion. Is expressed in several structures, including adult
    head; adult heart; embryonic dorsal epidermis; larval somatic muscle cell; and
    sensory nervous system primordium. Orthologous to human GCAT (glycine C-acetyltransferase).
