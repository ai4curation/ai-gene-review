- source: Alliance_Imported
  text: Glycine C-acetyltransferase (Gcat) encodes a mitochondrial enzyme that is
    predicted to catalyze the conversion of 2-amino-3-oxobutanoate and CoA to glycine
    and acetyl-CoA in the last step of glycine biosynthesis from L-threonine.
