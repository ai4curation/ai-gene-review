id: P40797
gene_symbol: pnut
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Peanut (Pnut) is the Drosophila SEPT7-class septin, a filament-forming GTPase that is the
  shared central subunit of both fly septin hetero-oligomers, Sep1-Sep2-Pnut and Sep4-Sep5-Pnut. Purified
  from embryos as a complex with Sep1 and Sep2, it binds and hydrolyses GTP and polymerises into filaments,
  a process stimulated by Orc6 binding to the Pnut coiled-coil. Pnut localizes to the cell cortex, the
  cleavage furrow, the contractile ring and the intercellular bridge, and is required for cytokinesis
  of proliferating cells; pnut mutant imaginal tissues become multinucleate. Septin complexes containing
  Pnut bind, bundle and bend actin filaments into curved rings, organising actomyosin rings during cellularization,
  cytokinesis and single-cell wound repair, and also contribute to border cell migration and other cortical
  processes.
