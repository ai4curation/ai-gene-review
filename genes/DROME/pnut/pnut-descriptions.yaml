    - rubric: specificity
      score: 4
    overall_notes: 'Correct: septin GTPase forming the complex with Sep1 and Sep2,
      in cytokinesis and cortical organization.'
- source: Alliance_Automated
  text: Enables several functions, including GTP binding activity; cytoskeletal protein
    binding activity; and protein homodimerization activity. Involved in several processes,
    including border follicle cell migration; cytoskeleton-dependent cytokinesis;
    and positive regulation of imaginal disc growth. Located in several cellular components,
    including apical plasma membrane; cleavage furrow; and septin ring. Part of septin
    complex. Is expressed in adult head; central nervous system; follicle cell; furrow
    canal; and light-sensitive neurons. Orthologous to human SEPTIN7 (septin 7).
  source_type: automated
