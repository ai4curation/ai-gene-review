- source: Alliance_Imported
  text: peanut (pnut) encodes a protein that belongs to the septin family of polymerizing
    GTPases. Together with the products of Septin1 and Septin2, it forms the septin
    complex. It participates in cytokinesis and other processes that involve organization
    of the cell cortex.
  source_type: curated
