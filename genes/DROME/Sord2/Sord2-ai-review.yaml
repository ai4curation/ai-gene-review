taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sord2 (Sodh-2, Sdh-2, CG4649) encodes one of two Drosophila sorbitol dehydrogenases, a zinc-dependent
  medium-chain dehydrogenase/reductase about 90% identical to Sord1 that oxidizes sorbitol (D-glucitol)
  and related polyols with NAD(+), converting sorbitol to fructose in the second step of the polyol pathway.
  Sord2 mutants accumulate sorbitol in the head and show age-dependent synaptic degeneration and locomotor
  decline that are rescued by aldose reductase inhibitors, modelling SORD-deficiency neuropathy. Together
  with Sord1 it is required for sorbitol clearance, polyol-pathway-dependent glucose sensing through Mondo,
  and production of circulating fructose.
