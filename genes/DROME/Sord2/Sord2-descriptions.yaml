    overall_notes: 'Correct: same text as Sord1, NAD-dependent polyol oxidation and
      fructose synthesis. No neuronal sorbitol accumulation phenotype.'
- source: Alliance_Automated
  text: Enables D-sorbitol dehydrogenase (acceptor) activity and L-iditol 2-dehydrogenase
    (NAD+) activity. Involved in D-sorbitol catabolic process and fructose biosynthetic
    process. Predicted to be active in cytosol. Is expressed in adult head; amnioserosa;
    embryonic/larval midgut; and yolk nucleus. Used to study autosomal recessive distal
    hereditary motor neuronopathy 8. Human ortholog(s) of this gene implicated in
    autosomal recessive distal hereditary motor neuronopathy 8. Orthologous to human
    SORD (sorbitol dehydrogenase).
  source_type: automated
