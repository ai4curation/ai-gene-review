descriptions:
- source: Alliance_Imported
  text: Sorbitol dehydrogenase 2 (Sord2) encodes an enzyme that catalyzes the reversible
    NAD(+)-dependent oxidation of various sugar alcohols including D-sorbitol and
    xylitol. It is involved in the biosynthesis of D-fructose from D-glucose and possibly
    in the catabolism of D-glucuronate to xylulose 5-phosphate.
  source_type: curated
  url: https://flybase.org/reports/Sord2.html
  source_id: FB:FBgn0022359
