- source: Alliance_Automated
  text: Involved in patched ligand maturation; primordial germ cell migration; and
    regionalization. Located in cytoneme. Is expressed in adult head; imaginal disc;
    and wing disc. Human ortholog(s) of this gene implicated in microphthalmia. Orthologous
    to human DISP1 (dispatched RND transporter family member 1) and DISP2 (dispatched
    RND transporter family member 2).
