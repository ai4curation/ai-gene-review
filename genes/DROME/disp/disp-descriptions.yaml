descriptions:
- source: UniProt
  text: Segment polarity protein which functions in hedgehog (Hh) signaling. Regulates
    the trafficking and the release of cholesterol- modified hedgehog protein from
    cells of the posterior compartment (P cells) and is hence required for the effective
    production of the Hh signal.
  source_type: curated
