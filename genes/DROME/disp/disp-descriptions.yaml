    overall_notes: 'Correct: segment polarity protein releasing cholesterol-modified
      Hh from producing cells.'
- source: Alliance_Imported
  text: dispatched (disp) encodes a multipass transmembrane protein and a member of
    the RND transporter family. It is required for the release and long-range activity
    of the lipid-modified product of hh from producing cells. The products of hh and
    disp control cell growth, survival, fate, and patterning.
  source_type: curated
  url: https://flybase.org/reports/disp.html
