gene_symbol: disp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dispatched (Disp) is a twelve-pass transmembrane protein of the RND/Patched superfamily that
  carries a sterol-sensing domain and acts in Hedgehog-producing cells. It is required to release the
  dually lipid-modified (cholesterol- and palmitate-modified) Hedgehog ligand from the surface of secreting
  cells so that Hedgehog can move through the tissue and reach responding cells; in its absence cholesterol-modified
  Hedgehog is retained in producing cells, whereas cholesterol-free Hedgehog is released normally. Loss
  of disp therefore phenocopies hh loss, causing segment-polarity defects in the embryo and loss of Hedgehog-dependent
  patterning in imaginal discs. Disp localizes to the plasma membrane and to basal cytoneme protrusions
  of wing disc cells, and residues conserved with bacterial RND transporters are required for its release
  activity, suggesting a transporter-like mechanism.
