- term:
    id: GO:0007225
    label: patched ligand maturation
  evidence_type: IMP
  original_reference_id: PMID:10619433
  qualifier: involved_in
  review:
    summary: Disp is required to release cholesterol-modified Hedgehog from producing cells.
    action: MODIFY
    reason: GO:0007225 is defined (QuickGO) as "The posttranslational modification of members of the Hedgehog
      family of signaling proteins in order for Hedgehog to exert its biological activity. These modifications
      include cleavage of its signal sequence, autocatalytic protein cleavage and the attachment of sterol
      groups." The disp mutant data show that Hedgehog is still cholesterol-modified in disp mutants but
      is retained in producing cells, so Disp acts on release of the already-mature ligand rather than
      its maturation. GO has no Hedgehog-specific secretion term (unlike GO:0061355 Wnt protein secretion),
      so protein secretion is the best available replacement.
    proposed_replacement_terms:
    - id: GO:0009306
      label: protein secretion
    supported_by:
    - reference_id: PMID:10619433
      supporting_text: In the absence of Disp, cholesterol-modified but not cholesterol-free Hh is retained
        in these cells, indicating that Disp functions to release cholesterol-anchored Hh.
