  review:
    summary: Phylogenetic inference that Disp participates in Hedgehog (smoothened) signaling.
    action: KEEP_AS_NON_CORE
    reason: Disp acts in the Hedgehog-sending cell, upstream of Patched and Smoothened, by releasing the
