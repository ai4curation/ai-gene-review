core_functions:
- description: Disp acts at the plasma membrane of Hedgehog-producing cells to release dually lipid-modified
    Hedgehog from the cell surface, a prerequisite for long-range Hedgehog signaling. It shares a sterol-sensing
    domain with Patched and RND-transporter residues required for release, but no GO molecular function
    has been experimentally established for the fly protein.
  directly_involved_in:
  - id: GO:0009306
    label: protein secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0035230
    label: cytoneme
  supported_by:
  - reference_id: file:DROME/disp/disp-deep-research-falcon.md
    supporting_text: Cholesterol-free Hh bypasses the requirement for Disp
  - reference_id: PMID:10619433
    supporting_text: In the absence of Disp, cholesterol-modified but not cholesterol-free Hh is retained
      in these cells, indicating that Disp functions to release cholesterol-anchored Hh.
  - reference_id: PMID:12372301
    supporting_text: This activity is disrupted by alteration of residues functionally conserved in Patched
      and in a related family of bacterial transmembrane transporters
suggested_questions:
- question: Does fly Disp bind the cholesterol moiety of Hedgehog directly and hand it to an extracellular
    carrier (as proposed for vertebrate DISP1 and Scube2), and should GO gain a Hedgehog-specific secretion
    term analogous to GO:0061355 Wnt protein secretion so that Disp is no longer annotated to patched
    ligand maturation?
suggested_experiments:
- description: Reconstitute purified Drosophila Disp in proteoliposomes with cholesterol-modified HhN
    and test transfer of HhN to lipoprotein particles or soluble acceptors, comparing wild type with mutants
    in the conserved RND transmembrane residues.
