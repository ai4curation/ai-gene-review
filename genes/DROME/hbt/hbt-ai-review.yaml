core_functions:
- description: >-
    Multipass Rost-family membrane protein of sensory sheath cells and glia that is required for normal
    larval head-touch sensitivity and for full mechanically evoked responses of terminal-organ
    chordotonal neurons, acting from the cells that surround the sensory dendrites. Its molecular
    activity is unknown.
  directly_involved_in:
  - id: GO:0051931
    label: regulation of sensory perception
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:32761438
    supporting_text: Molecular Basis for Cephalic Mechanosensitivity of Drosophila Larvae
  - reference_id: file:DROME/hbt/hbt-bioinformatics/RESULTS.md
    supporting_text: Isoform D retains the entire Rost (PF21534) region and all six predicted transmembrane
      helices
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of Headbutt is unknown, including whether the Rost/PTHR12242 region retains
      the Thr/His pair proposed to make the family AIG1/ADTRP-like hydrolases, and how its presence in
      sheath cells and glia tunes the mechanosensitivity of the neurons they wrap (extracellular matrix
      or lymph composition, dendrite attachment, or signalling).
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
suggested_questions:
- question: Does the PTHR12242 (Rost) family, including Headbutt, retain the catalytic Thr and His of the
    AIG1/ADTRP hydrolases at structurally equivalent positions, and does Headbutt react with
    fluorophosphonate probes?
- question: Which hbt isoforms are expressed in the larval sheath cells and glia, and is the N-terminally
    truncated isoform D sufficient to rescue the hbt touch defect?
- question: Is the FlyBase IMP to regulation of sensory perception (currently on isoform E) intended to apply
    to all hbt products, given that the knockout removes every isoform?
suggested_experiments:
- description: >-
    Express isoform D (Q9VK03) and isoform E separately in sheath cells (prospero-Gal4) of hbt knockout
    larvae and test rescue of the gentle-touch response and chordotonal Ca2+ responses; in parallel
    mutate candidate conserved Thr/His residues of the Rost region and test activity-based probe
    labelling of tagged Headbutt in membrane fractions.
