id: Q9VK03
gene_symbol: hbt
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Headbutt (hbt, CG43778) is a Drosophila multipass membrane protein of the Rost family
  (PANTHER PTHR12242, subfamily SF49), distantly related to Rolling stone, which is required for
  myoblast fusion. The gene encodes four products; Q9VK03 (isoform D, 451 aa) is an N-terminally
  truncated form identical to residues 513-963 of the 1003-aa canonical isoform E, and it retains the
  complete Rost region with six predicted transmembrane helices followed by a disordered Gly-rich
  tail. In the larva, an endogenous GFP knock-in shows Headbutt in non-neuronal support cells: sheath
  (thecogen-type) cells that wrap sensory dendrites in the terminal and dorsal organs, glia ensheathing
  chordotonal neurons, and a glia-like sheath around the brain and ventral nerve cord. hbt mutants
  have a strongly reduced gentle head-touch response and reduced calcium responses in terminal-organ
  chordotonal neurons, so Headbutt acts from these surrounding cells to support neuronal
  mechanosensitivity. Its molecular activity is unknown; a distant, profile-level resemblance of the
  family to the AIG1/ADTRP threonine hydrolases has been noted but not tested.
