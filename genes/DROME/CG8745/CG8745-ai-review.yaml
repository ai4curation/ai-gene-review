  review:
    action: ACCEPT
    summary: PLP binding is well supported by the conserved class-III PLP-enzyme fold and the conserved
      Schiff-base lysine.
    reason: CG8745 carries the Aminotrans_3 (PF00202) domain and the PROSITE class-III aminotransferase
      PLP-attachment signature, and K291 aligns with the PLP lysine of human ETNPPL (K278) and PHYKPL (K278)
      in the re-review alignment. Every characterised member of the family uses PLP. This is a cofactor-binding
      function rather than the catalytic activity itself, but it is a core, as-specific-as-warranted feature.
