core_functions:
- description: PLP-dependent phospho-lyase activity that eliminates phosphate (and ammonia) from a phosphorylated
    amino compound. This is the reaction shared by its vertebrate co-orthologs ETNPPL (phosphoethanolamine)
    and PHYKPL (5-phosphohydroxy-L-lysine). The physiological substrate in Drosophila is unresolved.
  molecular_function:
    id: GO:0016838
    label: carbon-oxygen lyase activity, acting on phosphates
  supported_by:
  - reference_id: PMID:22241472
    supporting_text: AGXT2L1 catalyzed a similar reaction on phosphoethanolamine, converting it to ammonia,
      inorganic phosphate, and acetaldehyde.
  - reference_id: file:DROME/CG8745/CG8745-bioinformatics/RESULTS-rereview.md
    supporting_text: CG8745 and C. elegans eppl-1 branch at the base of a clade that holds vertebrate ETNPPL
- description: Binds the PLP cofactor through the conserved Schiff-base lysine K291 of the class-III
    PLP-enzyme fold.
