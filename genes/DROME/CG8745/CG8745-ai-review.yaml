suggested_questions:
- question: Is the physiological substrate of CG8745 phosphoethanolamine, 5-phosphohydroxy-L-lysine, or
    both, given that the fly protein predates the vertebrate ETNPPL/PHYKPL duplication?
- question: Does Drosophila encode a 5-hydroxylysine kinase (HYKK/AGPHD1 ortholog)? Without one, 5-phosphohydroxy-L-lysine
    would be an unlikely physiological substrate for CG8745.
suggested_experiments:
- description: Purify recombinant CG8745 and assay ammonia, phosphate and aldehyde release from phosphoethanolamine
    and 5-phosphohydroxy-L-lysine (with a K291A mutant as control) to determine substrate preference and
    kinetics.
- description: Measure phosphoethanolamine and phosphohydroxylysine in CG8745 null flies by targeted metabolomics,
    and determine subcellular localisation by endogenous tagging.
