- term:
    id: GO:0035094
    label: response to nicotine
  evidence_type: IEP
  original_reference_id: PMID:17237783
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Transcript-abundance association with nicotine resistance; an expression observation, not a
      mechanistic role.
    reason: PMID:17237783 scanned adult female head transcripts for association with nicotine resistance.
      The cached record is abstract-only and names ornithine aminotransferase as the strongest hit; the
      FlyBase curator who made this IEP read the full gene tables, so the row is not overruled. An IEP
      "response to" annotation only records that transcript level varies with the treatment or trait; it
      does not say that CG8745 participates in nicotine detoxification. It is retained as non-core and
      should not be used to infer function.
    supported_by:
    - reference_id: PMID:17237783
      supporting_text: We performed a scan for such quantitative trait transcripts in adult female heads
        of the fruit fly (Drosophila melanogaster) that might explain variation for nicotine resistance.
- term:
    id: GO:0050459
    label: ethanolamine-phosphate phospho-lyase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8TBG4
  review:
    action: MODIFY
    summary: The phospho-lyase chemistry is well supported phylogenetically, but the specific substrate
      (phosphoethanolamine) is not; generalise to the parent term.
    reason: The ISS donor is human ETNPPL (Q8TBG4), which purified enzyme assays show converts phosphoethanolamine
      to ammonia, phosphate and acetaldehyde (PMID:22241472). The re-review alignment and tree place CG8745
      basal to the vertebrate clade containing both ETNPPL (PANTHER SF1, 54% identity) and its paralog PHYKPL
      (SF6, 50-51% identity), which performs the same elimination on 5-phosphohydroxy-L-lysine. CG8745 is
      thus a co-ortholog of both enzymes, and sequence similarity cannot pick one substrate. The PAINT curator
      placed GO:0050459 at a Euteleostomi node (PTN002904331) that does not include CG8745, which is consistent
      with this. CG8745 itself sits in the mixed PANTHER SF13, alongside a bacterial decarboxylase and racemase,
      so subfamily membership cannot be used for transfer either. The supported claim is the chemistry that
      ETNPPL and PHYKPL share, a PLP-dependent carbon-oxygen lyase that eliminates phosphate. The generalisation
      is GO:0016838, the direct parent of GO:0050459.
    proposed_replacement_terms:
    - id: GO:0016838
      label: carbon-oxygen lyase activity, acting on phosphates
    supported_by:
    - reference_id: PMID:22241472
      supporting_text: AGXT2L1 catalyzed a similar reaction on phosphoethanolamine, converting it to ammonia,
        inorganic phosphate, and acetaldehyde.
    - reference_id: PMID:22241472
      supporting_text: The phosphorylation product made by this enzyme was metabolized by AGXT2L2, which
        converted it to ammonia, inorganic phosphate, and 2-aminoadipate semialdehyde.
    - reference_id: file:DROME/CG8745/CG8745-bioinformatics/RESULTS-rereview.md
      supporting_text: CG8745 is about equally similar to the two vertebrate ammoniophospholyase paralogs,
        ETNPPL (54%) and PHYKPL (50-51%), and clearly less similar to the AGXT2 transaminases (37-42%).
