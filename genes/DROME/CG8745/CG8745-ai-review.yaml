id: Q9VU95
gene_symbol: CG8745
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG8745 encodes a 494-residue class-III pyridoxal 5'-phosphate (PLP)-dependent enzyme of the
  AGXT2-related family, with the PLP-binding lysine (K291) conserved. Phylogenetically it is the single
  Drosophila representative of the lineage that in vertebrates gave rise to two ammoniophospholyases,
  ethanolamine-phosphate phospho-lyase (ETNPPL) and 5-phosphohydroxy-L-lysine phospho-lyase (PHYKPL),
  which eliminate phosphate and ammonia from phosphoethanolamine and phosphohydroxylysine respectively.
  CG8745 is therefore predicted to be a PLP-dependent phospho-lyase acting on a phosphorylated amino
  compound, but its substrate, its subcellular location and its physiological role have not been tested
  in flies. Despite its historical "alanine-glyoxylate aminotransferase 2-like" name, its closest
  characterised relatives do not act as transaminases. The only direct fly data are transcriptional,
  including an expression association with nicotine resistance.
