    reason: HOAP is a DNA-binding protein that binds telomere-associated sequence in vitro and, with HipHop,
      occupies the duplex region of chromosome ends independently of sequence. Drosophila telomeres are
      retrotransposon arrays without short telomeric repeats, so GO:0042162 (binding a telomeric DNA repeat
