id: Q95RV2
gene_symbol: cav
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: cav (caravaggio) encodes HOAP (HP1/ORC-associated protein), a rapidly evolving Drosophila
  DNA-binding protein with an HMG-like domain that is the founding subunit of terminin, the sequence-independent
  telomere-capping complex of telomerase-less Drosophila. HOAP binds HP1a through a C-terminal peptide
  repeat, forms the HipHop-HOAP subcomplex that occupies the duplex region of chromosome ends, and anchors
  the Moi-Tea-Ver subcomplex. HOAP is enriched at all telomeres throughout the cell cycle, with minor
  pericentric staining, and its loading depends on ATM, ATR and the MRN complex. cav mutants show extensive
  telomere-telomere fusions in larval neuroblasts, and HOAP also contributes to heterochromatin-induced
  silencing.
