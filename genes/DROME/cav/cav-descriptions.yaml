descriptions:
- source: UniProt
  text: Part of the HipHop-HOAP complex that recruits the MTV complex to form the
    terminin telomere-capping complex, which binds to chromosome ends in a sequence-independent
    manner and prevents telomere fusion (PubMed:11408576, PubMed:12510197, PubMed:12826664,
    PubMed:19181850, PubMed:19190990, PubMed:20057353). Telomere capping is independent
    of the origin recognition complex (ORC) (PubMed:12510197).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95RV2
  source_id: Q95RV2
