- source: Alliance_Automated
  text: Enables L-aspartate:2-oxoglutarate transaminase activity. Involved in 2-oxoglutarate
    metabolic process; L-aspartate catabolic process; and L-glutamate biosynthetic
    process. Located in cytosol. Is expressed in several structures, including adult
    brain cell body rind; adult head; adult heart; gut section; and larval muscle
    cell. Human ortholog(s) of this gene implicated in amyloidosis; amyotrophic lateral
    sclerosis; pancreatic ductal adenocarcinoma; and transient cerebral ischemia.
    Orthologous to several human genes including GOT1 (glutamic-oxaloacetic transaminase
    1).
  source_type: automated
