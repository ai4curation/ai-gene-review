descriptions:
- source: Alliance_Imported
  text: Glutamate oxaloacetate transaminase 1 (Got1) encodes a cytosolic enzyme that
    catalyzes the interconversion of L-aspartate and alpha-ketoglutarate to oxaloacetate
    and L-glutamate. It is involved in glutamate and aspartate biosynthesis, gluconeogenesis
    and the malate-aspartate shuttle.
  source_type: curated
  url: https://flybase.org/reports/Got1.html
  source_id: FB:FBgn0001124
