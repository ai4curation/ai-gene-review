      melanogaster
suggested_questions:
- question: Does Got1 contribute to neurotransmitter glutamate supply in glutamatergic neurons (for example
    DN1 clock neurons), as opposed to the mitochondrial Got2?
suggested_experiments:
- description: Measure cytosolic NADH/NAD+ (e.g. with a Peredox-type sensor) and aspartate levels in Got1
    mutant fat body or muscle to test its contribution to the malate-aspartate shuttle in vivo.
