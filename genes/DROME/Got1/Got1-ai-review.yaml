core_functions:
- description: Got1 reversibly transaminates L-aspartate and 2-oxoglutarate to oxaloacetate and L-glutamate
    in the cytosol, acting as the cytosolic aminotransferase of the malate-aspartate shuttle.
  molecular_function:
    id: GO:0004069
    label: L-aspartate:2-oxoglutarate transaminase activity
  directly_involved_in:
