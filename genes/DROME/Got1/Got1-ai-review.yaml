gene_symbol: Got1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Got1 (CG8430) encodes the cytoplasmic aspartate aminotransferase (glutamate oxaloacetate
  transaminase 1) of Drosophila melanogaster, a homodimeric pyridoxal 5'-phosphate-dependent class I aminotransferase.
  It reversibly transfers the amino group of L-aspartate to 2-oxoglutarate, interconverting aspartate/oxaloacetate
  and glutamate/2-oxoglutarate in the cytosol. Together with cytosolic malate dehydrogenase (Mdh1) and
  the mitochondrial isozyme Got2 it forms the cytosolic arm of the malate-aspartate shuttle that moves
  NADH reducing equivalents into mitochondria, and it links amino-acid and carbon metabolism, including
  the supply of glutamate. Like mammalian GOT1 it may also transaminate cysteine and related amino acids.
  GOT activity is differentially distributed in the adult central nervous system and musculature, and
  a low-activity Got1 allele was among the first mutations used to probe glutamate metabolism in flies.
