    - rubric: specificity
      score: 3
    overall_notes: Abl-interacting protein regulating actin in adhesion, oogenesis,
      muscle attachment and axogenesis is correct. Does not name the WAVE regulatory
      complex, its main context.
- source: Alliance_Automated
  text: Enables cadherin binding activity. Involved in several processes, including
    centripetally migrating follicle cell migration; plasma membrane bounded cell
    projection organization; and regulation of actin filament organization. Located
    in several cellular components, including basal cortex; lamellipodium membrane;
    and perinuclear region of cytoplasm. Part of SCAR complex. Is expressed in several
    structures, including adult head; ganglia; light-sensitive neurons; neuron projection
    bundle; and synaptic neuropil. Orthologous to several human genes including ABI1
    (abl interactor 1).
  source_type: automated
  url: https://flybase.org/reports/Abi.html
