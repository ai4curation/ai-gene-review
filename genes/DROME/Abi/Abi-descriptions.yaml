- source: RefSeq
  text: Enables cadherin binding activity. Involved in several processes, including
    centripetally migrating follicle cell migration; plasma membrane bounded cell
    projection organization; and positive regulation of cellular component biogenesis.
    Located in several cellular components, including basal cortex; lamellipodium
    membrane; and perinuclear region of cytoplasm. Part of SCAR complex. Is expressed
    in several structures, including adult head; ganglia; neuron projection bundle;
    photoreceptor neurons; and synaptic neuropil. Orthologous to several human genes
    including ABI1 (abl interactor 1). [provided by Alliance of Genome Resources,
