descriptions:
- source: Alliance_Imported
  text: Abelson interacting protein (Abi) encodes a protein that interacts with the
    non-receptor tyrosine kinase encoded by Abl. It contributes to the regulation
    of actin cytoskeleton organization. It is involved in multiple actin dependent
    processes including cell adhesion, cell morphogenesis, oogenesis, muscle attachment
    and axogenesis.
  source_type: curated
  url: https://flybase.org/reports/Abi.html
  source_id: FB:FBgn0020510
