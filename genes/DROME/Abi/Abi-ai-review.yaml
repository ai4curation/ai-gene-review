core_functions:
- description: Abi is an adaptor subunit of the WAVE regulatory complex that stabilises SCAR, forms part
    of the WIRS receptor-binding surface and links the WRC to Ena/VASP, WASp and Abl, promoting Arp2/3-dependent
    lamellipodial and cortical actin assembly at the membrane.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0030866
    label: cortical actin cytoskeleton organization
  - id: GO:0030032
    label: lamellipodium assembly
  locations:
  - id: GO:0031258
    label: lamellipodium membrane
  in_complex:
    id: GO:0031209
    label: SCAR complex
  supported_by:
  - reference_id: PMID:21900504
    supporting_text: Abi represents a multi-domain adaptor protein that is not only an integral component
      of the WAVE complex
  - reference_id: PMID:21900504
    supporting_text: In abi mutants, WAVE is unstable but restored by reexpression of Abi, confirming
      that Abi controls the integrity of the WAVE complex in vivo.
  - reference_id: PMID:14588242
    supporting_text: Abi and two components of a recently identified SCAR complex, Sra1 (p140/PIR121/CYFIP)
      and Kette (Nap1/Hem), protect SCAR from proteasome-mediated degradation and are critical for SCAR
      localization and for the generation of Arp2/3-dependent protrusions
  - reference_id: PMID:25203209
    supporting_text: We demonstrate that Ena/VASP and the WRC control actin polymerization in a cooperative
      manner through the interaction of the Ena/VASP EVH1 domain with an extended proline rich motif in
      Abi.
  - reference_id: PMID:26903538
    supporting_text: A purified GST-fusion of dFat2-CT binds to the wild-type WRC, but not to a mutant
      whose WIRS binding surface is disrupted by mutations
