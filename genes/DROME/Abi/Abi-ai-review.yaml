id: A0A0B4K774
gene_symbol: Abi
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Abi (Abelson interactor) is a multi-domain adaptor protein and core subunit of the WAVE regulatory
  complex (WRC), where its N-terminal region binds SCAR and Hem/Kette and, together with Cyfip/Sra-1,
  forms the conserved surface that binds WIRS motifs in membrane receptors such as the atypical cadherin
  Fat2. Abi stabilises SCAR, and its C-terminal SH3 domain and proline-rich motifs also bind and activate
  WASp, bind the Abl tyrosine kinase (which phosphorylates Abi and controls its membrane recruitment and
  stability) and recruit Ena/VASP to enhance WRC-driven Arp2/3 actin assembly. Through these interactions
  Abi promotes lamellipodia and cortical actin protrusions, and is required for axon guidance and synapse
  growth, bristle development, follicle cell collective migration and oogenesis.
