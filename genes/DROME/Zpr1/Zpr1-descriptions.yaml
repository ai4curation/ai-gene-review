- source: Alliance_Imported
  text: Zpr1 (Zpr1) encodes a protein that functions downstream of the EGFR and other
    tyrosine kinase receptors. It also contributes to the assembly of spliceosome
    snRNPs. In the developing tracheal system it is required for terminal cell lumen
    formation.
