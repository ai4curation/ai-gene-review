- source: Alliance_Automated
  text: Predicted to enable protein folding chaperone; translation elongation factor
    binding activity; and translation initiation factor binding activity. Involved
    in cell surface receptor protein tyrosine kinase signaling pathway and open tracheal
    system development. Predicted to be active in Cajal body and cytoplasm. Is expressed
    in adult head. Human ortholog(s) of this gene implicated in alopecia. Orthologous
    to human ZPR1 (ZPR1 zinc finger).
