- id: PMID:23029159
  title: Drosophila Zpr1 (Zinc finger protein 1) is required downstream of both EGFR
    and FGFR signaling in tracheal subcellular lumen formation.
  findings:
  - statement: >-
      A nonsense allele (31ZZ, stop at codon 58) is lethal and, in MARCM clones, blocks
      maturation of the gas-filled subcellular lumen and higher-order branching in tracheal
      terminal cells. Both defects are rescued by a genomic transgene.
    supporting_text: This mutation results in a premature termination codon at amino acid
      position 58.
  - statement: >-
      Zpr1 loss is epistatic to the extra lumens caused by overexpressing EGFR or activated
      Btl/FGFR. No pathway read-out was measured, and binding to FGFR was not tested.
    supporting_text: interaction with the FGFR has not been directly tested.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text (PMC3445489) read. It is the only Drosophila Zpr1 paper and the source of
      all four FlyBase experimental rows. The genetics is sound. The interpretation that
      Zpr1 acts "downstream" of the RTKs rests on epistasis alone.
- id: PMID:36630955
  title: Zinc-finger protein Zpr1 is a bespoke chaperone essential for eEF1A biogenesis.
  findings:
  - statement: >-
      Yeast Zpr1 is an essential chaperone dedicated to folding eEF1A. Without it, newly
      made eEF1A misfolds and causes proteotoxic stress.
    supporting_text: Zpr1 depletion causes acute proteotoxicity driven by biosynthesis of
      misfolded eukaryotic translation elongation factor 1A (eEF1A).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This paper establishes the family's molecular function in yeast;
      the fly function is inferred by orthology.
- id: PMID:37597513
  title: A Zpr1 co-chaperone mediates folding of eukaryotic translation elongation factor
    1A via a GTPase cycle.
  findings:
  - statement: >-
      Zpr1-mediated folding of eEF1A requires GTP hydrolysis by the client, and the
      co-chaperone Aim29 regulates the cycle.
    supporting_text: folding of eEF1A by Zpr1 requires GTP hydrolysis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; mechanistic follow-up in yeast.
- id: PMID:9852145
  title: Interaction of ZPR1 with translation elongation factor-1alpha in proliferating
    cells.
  findings:
  - statement: >-
      Mammalian and yeast ZPR1 bind eEF1A. EGF stimulation of mammalian cells moves ZPR1
      and eEF1A into the nucleus.
    supporting_text: We report that ZPR1 binds to eukaryotic translation elongation factor-1α
      (eEF-1α).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This is the source of the human IPI row that GOA annotates to
      translation *initiation* factor binding (with P68104, EEF1A1). That term is wrong;
      the binding partner is an elongation factor.
- id: PMID:9763455
  title: The cytoplasmic zinc finger protein ZPR1 accumulates in the nucleolus of proliferating
    cells.
  findings:
  - statement: Mammalian ZPR1 accumulates in the nucleolus of proliferating cells.
    supporting_text: Here we demonstrate that ZPR1 accumulates in the nucleolus of proliferating
      cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background on ortholog nuclear localisation.
- id: PMID:8650580
  title: Binding of zinc finger protein ZPR1 to the epidermal growth factor receptor.
  findings:
  - statement: >-
      Mammalian ZPR1 binds the EGFR kinase domain through its zinc fingers and is released
      when the receptor is activated.
    supporting_text: ZPR1 is a zinc finger protein that binds to the cytoplasmic tyrosine
      kinase domain of the epidermal growth factor receptor (EGFR).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. It provides ortholog support for the EGFR connection.
- id: PMID:11283611
  title: Spinal muscular atrophy disrupts the interaction of ZPR1 with the SMN protein.
  findings:
  - statement: >-
      Mammalian ZPR1 binds SMN, co-localises with it in gems and Cajal bodies, and is
      needed for SMN to localise to nuclear bodies.
    supporting_text: Our data show that ZPR1 is required for the localization of SMN in nuclear
      bodies.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Source of the human rows to Cajal body and to pre-mRNA catabolic
      process. The abstract does not support the latter.
