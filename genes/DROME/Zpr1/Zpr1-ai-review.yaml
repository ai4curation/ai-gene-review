      highly biosynthetic cell rather than a dedicated morphogenetic activity, so it is kept
      as non-core.
    supported_by:
    - reference_id: PMID:23029159
      supporting_text: the conclusion from both our staining and EM analysis is that Zpr1-mutant
        terminal cells initiate lumen formation, but that progression to a mature, gas-filled
