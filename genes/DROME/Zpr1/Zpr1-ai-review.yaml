- term:
    id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:23029159
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0285896
  review:
    summary: >-
      Based on Zpr1 loss being epistatic to the extra lumens caused by overexpressing a
      constitutively active Breathless (lambda-btl) FGFR in terminal cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      I read the full text. The only evidence is suppression of an overexpression
      phenotype of activated Btl by a null Zpr1 allele. Loss of Btl could not be tested,
      there is no FGFR pathway read-out, and the authors say the Zpr1-FGFR interaction
      has not been tested. A cell lacking an essential eEF1A chaperone is expected to fail
      any growth-factor-driven program. This epistasis therefore shows that Zpr1 is
      necessary for the lumen, not that it takes part in FGFR signal transduction.
      Unlike EGFR, there is no ortholog binding data for FGFR. The defensible process
      claim is the lumen and branching phenotype, already carried by GO:0035149 and
      GO:0007430.
    supported_by:
