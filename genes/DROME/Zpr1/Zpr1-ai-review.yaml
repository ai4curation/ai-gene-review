core_functions:
- description: >-
    ATP-independent molecular chaperone dedicated to the biogenesis of translation
    elongation factor eEF1A. Zpr1 binds newly synthesised eEF1A through its zinc-finger and
    beta-helix domains and folds it into its native conformation in the cytoplasm. This
    activity is inferred from the conserved yeast and mammalian orthologues; it has not been
    shown for the fly protein.
