    label: lumen formation, open tracheal system
  evidence_type: IGI
  original_reference_id: PMID:23029159
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003731
  review:
    summary: >-
      Zpr1 mutant terminal cells start a subcellular lumen, but it does not mature: there is
      no cuticle, the lumen is occluded and it never fills with gas. Zpr1 loss also blocks
      the extra lumens caused by EGFR overexpression.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the best-supported fly phenotype: fully penetrant, rescued by a transgene,
      and seen with both the mutant and RNAi. Strictly, the defect is in lumen maturation
      rather than initiation, but GO has no more specific open-tracheal-system term for it.
