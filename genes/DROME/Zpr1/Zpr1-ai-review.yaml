  review:
    summary: >-
      Based on genetic interaction with Egfr in tracheal terminal cells. Zpr1 loss is
      epistatic to the extra lumens caused by overexpressing wild-type or activated EGFR,
      and EGFR loss partially phenocopies Zpr1 loss.
    action: KEEP_AS_NON_CORE
    reason: >-
      I read the full text. The epistasis is real and the curator transcribed the authors'
      conclusion correctly. Mammalian ZPR1 binds the EGFR kinase domain directly
