      chaperone tailored to the biogenesis of one of the most abundant proteins in the cell.
  - reference_id: PMID:37597513
    supporting_text: Zinc-finger protein 1 (Zpr1) is an essential ATP-independent chaperone
      dedicated to the biogenesis of eukaryotic translation elongation factor 1A (eEF1A)
