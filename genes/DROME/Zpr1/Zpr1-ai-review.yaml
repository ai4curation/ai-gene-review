suggested_questions:
- question: >-
    Does the Drosophila Zpr1 requirement in tracheal terminal cells reflect a dedicated role
    in RTK (EGFR/FGFR) signal transduction, or a general need for eEF1A folding in a
    terminal cell growing quickly and making a lot of protein?
- question: >-
    The human ZPR1 IPI row on PMID:9852145 (with P68104, EEF1A1) is annotated to translation
    initiation factor binding (GO:0031369). Should UniProt and FlyBase repoint it, and its ISS
    copies, to translation elongation factor binding (GO:0061770)?
- question: >-
    What is the basis of the human ZPR1 IMP row to pre-mRNA catabolic process (GO:1990261) on
    PMID:11283611, and should it be propagated by ISS to other species?
suggested_experiments:
- description: >-
    Test whether fly Zpr1 folds eEF1A. Deplete Zpr1 in S2 cells or in tracheal terminal
    cells and look for misfolded or aggregated eEF1A1/eEF1A2 and for induction of the
    integrated stress response. Check whether the lumen phenotype is rescued by yeast or
    human ZPR1, or partly suppressed by raising eEF1A levels.
  experiment_type: genetic and biochemical complementation
- description: >-
    Measure EGFR and FGFR pathway output (dpERK, pointed/argos reporters) in Zpr1 mutant
    terminal-cell clones. This would tell whether Zpr1 acts in signal transduction or
    downstream of the signalling, as a general requirement for the cell to function.
  experiment_type: mosaic clonal analysis with pathway reporters
