id: Q9W379
gene_symbol: Zpr1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Zpr1 (CG9060) is the single Drosophila member of the ZPR1 family, a group of essential
  proteins conserved across eukaryotes and archaea. It is built from two repeats, each
  with a C4-type zinc finger and a ZPR1 A/B (beta-helix) domain. In budding yeast, the
  orthologue is a dedicated ATP-independent chaperone. It binds newly made translation
  elongation factor eEF1A and drives it to its native fold, in a cycle regulated by the
  client's own GTP hydrolysis. Mammalian ZPR1 also binds eEF1A. Mammalian ZPR1 moves
  between the cytoplasm and the nucleus, and in the nucleus it is found in the nucleolus
  and in gems and Cajal bodies with SMN. No biochemistry has been done on the fly protein,
  and its chaperone function is inferred from these orthologues. In the fly, a nonsense
  allele is lethal. In mosaic analysis, mutant larval tracheal terminal cells start a
  subcellular lumen but cannot mature it into a gas-filled tube, and they make fewer
  higher-order branches. Loss of Zpr1 blocks the extra lumens caused by overactive EGFR
  or FGFR (Breathless). The authors take this to mean that Zpr1 acts downstream of these
  receptor tyrosine kinases. A general requirement for this essential chaperone has not
  been ruled out.
