  text: Enables deubiquitinase activity. Involved in negative regulation of Notch
    signaling pathway; negative regulation of ubiquitin-dependent protein catabolic
    process; and positive regulation of canonical Wnt signaling pathway. Part of peptidase
    complex. Is expressed in embryonic/larval midgut interstitial cell; ganglia; gut
    section; and salivary gland body primordium. Orthologous to several human genes
    including USP12 (ubiquitin specific peptidase 12).
