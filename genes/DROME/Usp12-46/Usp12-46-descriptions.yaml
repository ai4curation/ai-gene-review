descriptions:
- source: UniProt
  text: Catalytic component of the Usp12-46 deubiquitylase complex (PubMed:37798281).
    Deubiquitylates the wg/wingless-signaling receptor arr/arrow, which stabilizes
    the receptor and increases its concentration at the cell surface; this enhances
    the sensitivity of cells to wg/wingless-signal stimulation (PubMed:37798281).
    This increases the amplitude and spatial range of the signaling response to the
    wg/wingless morphogen gradient, facilitating the precise, concentration-dependent
    regulation of its target genes (PubMed:37798281). Required for wg/wingless-mediated
    signaling in the wing imaginal disc and for wg/wingless-dependent regulation of
    adult intestinal stem cell proliferation (PubMed:37798281). Negative regulator
    of Notch signaling, possibly by regulating lysosomal degradation of N/Notch and
    affecting cell surface receptor levels; this may be context and cell-type specific
    function involved in external sensory organ development but not in wing imaginal-disc
    dorsoventral boundary signaling (Probable) (PubMed:22778262). Protects against
    HTT/huntingtin-induced polyglutamine expansion-dependent neurodegeneration (PubMed:30266909).
  source_type: curated
