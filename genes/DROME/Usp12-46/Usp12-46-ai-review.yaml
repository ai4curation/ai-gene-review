- description: Usp12-46 is the catalytic cysteine-type deubiquitinase of the Usp12-46-Uaf1-Wdr20 complex;
    activated and stabilized by Uaf1 and Wdr20, it deubiquitylates the Wingless co-receptor Arrow, reducing
    its turnover and increasing Wingless signaling strength.
