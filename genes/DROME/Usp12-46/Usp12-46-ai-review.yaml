suggested_questions:
- question: Which E3 ligase ubiquitinates Arrow for lysosomal turnover in the absence of Usp12-46 activity?
- question: Does fly Usp12-46 act on Notch through the same Uaf1-Wdr20 complex?
suggested_experiments:
- hypothesis: Catalytic activity of Usp12-46 is required for Arrow stabilization in vivo.
  description: Rescue Usp12-46 knockdown in wing discs with wild-type versus catalytic-cysteine mutant
    Usp12-46 and measure Arrow surface levels and Senseless expression.
