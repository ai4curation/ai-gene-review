id: Q9VCT9
gene_symbol: Usp12-46
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Usp12-46 is the single Drosophila ortholog of the paralogous human ubiquitin-specific proteases
  USP12 and USP46, a cysteine-type deubiquitinase of the USP family. It is the catalytic subunit of the
  Usp12-46-Uaf1- Wdr20 deubiquitylase complex, in which the WD40 proteins Uaf1 and Wdr20 stabilize it
  and allosterically raise its catalytic turnover. The complex removes ubiquitin from the Wingless co-receptor
  Arrow/LRP6, reducing its lysosomal turnover and increasing its cell-surface levels, which raises the
  sensitivity of cells to the Wingless morphogen and the amplitude and range of Wingless signaling. Usp12-46
  also negatively regulates Notch signaling, consistent with USP12-dependent deubiquitination that routes
  unactivated Notch toward lysosomal degradation in mammalian cells. It is present in the cytosol and
  nucleus.
