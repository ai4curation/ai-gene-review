    - rubric: specificity
      score: 3
    overall_notes: Correct ADAM sheddase description. Emphasises Notch alongside Kuzbanian,
      which the review treats as a minor overexpression effect, and omits Eiger shedding,
      the best-characterized substrate.
- source: Alliance_Automated
  text: Enables metalloendopeptidase activity. Involved in several processes, including
    cell surface receptor signaling pathway; commissural neuron axon guidance; and
    membrane protein ectodomain proteolysis. Predicted to be located in membrane.
    Predicted to be active in plasma membrane. Is expressed in spermatozoon and ventral
    nerve cord. Human ortholog(s) of this gene implicated in Alzheimer's disease;
    hypotrichosis; neonatal inflammatory skin and bowel disease 1; and type 2 diabetes
    mellitus. Orthologous to human ADAM17 (ADAM metallopeptidase domain 17).
  source_type: automated
