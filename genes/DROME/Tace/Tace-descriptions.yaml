descriptions:
- source: Alliance_Imported
  text: Tace (Tace) encodes a transmembrane anchored, cell surface metalloprotease
    and member of the ADAM family of proteins. The product of Tace, along with the
    related ADAM protease encoded by kuz, performs ectodomain shedding by cleaving
    cell surface receptors and/or ligands to affect cell-cell signaling or adhesion.
    Both proteases are implicated in the Notch signaling pathway.
  source_type: curated
  url: https://flybase.org/reports/Tace.html
  source_id: FB:FBgn0039734
