  label: Drosophila melanogaster
description: 'Tace (CG7908) is the single Drosophila ortholog of the mammalian sheddase ADAM17/TACE, a
  single-pass type I transmembrane zinc metalloprotease of the ADAM family that cleaves the extracellular
  juxtamembrane region of membrane proteins to release their ectodomains. Its best-characterized substrate
  is the TNF ligand Eiger: Tace sheds Eiger to trigger TNF signaling through the Grindelwald receptor,
  which protects the ageing retina from lipid droplet accumulation and degeneration, and Tace is required
  for Eiger-dependent effects in oncogenic Ras-driven growth and fat-body-to-brain nutrient signaling.
  Tace also cleaves the netrin receptor Frazzled, acting as a bidirectional regulator of commissural axon
  guidance, and when overexpressed can process Notch and Delta, although Kuzbanian is the principal Notch
  S2 protease in flies.'
