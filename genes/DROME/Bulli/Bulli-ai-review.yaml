  review:
    summary: Bulli/RMC1 family is involved in regulation of autophagy.
    action: KEEP_AS_NON_CORE
    reason: RMC1 assembly with Mon1-Ccz1 is required for autophagic functions in zebrafish, consistent
      with Rab7 roles in autophagosome-lysosome fusion. This is a downstream consequence of Rab7 activation
      rather than the defining function. In Drosophila, the Ccz1-Mon1 partners of Bulli are required
      for autophagosome-lysosome fusion in starved fat cells (PMID:27559127), but that study did not test
      Bulli itself, so for Bulli the autophagy role remains inferred from the complex and from zebrafish
      RMC1 rather than shown by fly loss-of-function data.
