suggested_questions:
- question: 'Since the Mon1-Ccz1 dimer is catalytically active in vitro, what does Bulli add in vivo:
    complex stability, membrane targeting, or regulation by Rab5 and other upstream factors?'
suggested_experiments:
- hypothesis: Bulli is required for stability and membrane targeting of Mon1-Ccz1 rather than catalysis.
  description: Measure Mon1 and Ccz1 protein levels and endosomal recruitment in bulli null nephrocytes,
    and rescue with Bulli interface mutants that disrupt Mon1 or Ccz1 binding.
