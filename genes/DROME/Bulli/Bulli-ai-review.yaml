id: Q9VRX1
gene_symbol: Bulli
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Bulli (CG8270) is the Drosophila ortholog of RMC1 (regulator of MON1-CCZ1), a beta-propeller/alpha-solenoid
  protein that forms the third subunit of the Mon1-Ccz1 guanine nucleotide exchange factor for Rab7; RMC1
  is absent from budding yeast but widely distributed among other eukaryotes. Bulli binds Mon1 and Ccz1
  on the face opposite the Rab7-binding site, scaffolding the complex and, through a basic patch on its
  beta-propeller, promoting association of the GEF with anionic endosomal membranes; it is not required
  for catalysis by the Mon1-Ccz1 dimer in vitro. Bulli localises with the complex to Rab7-positive late
  endosomes, and in nephrocytes its loss enlarges Rab5-positive, non-acidified endosomes, impairs Rab7
  recruitment and endosome maturation, reduces scavenger uptake and shortens lifespan.
