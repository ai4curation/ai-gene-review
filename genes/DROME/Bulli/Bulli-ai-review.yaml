core_functions:
- description: Bulli binds Mon1 and Ccz1 opposite the Rab7-binding site and scaffolds the trimeric Mon1-Ccz1-Bulli
    Rab7 GEF, helping target it to endosomal membranes and supporting Rab7 recruitment and Rab5-to-Rab7
    conversion on maturing late endosomes.
