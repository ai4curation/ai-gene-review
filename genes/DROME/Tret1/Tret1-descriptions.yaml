descriptions:
- source: UniProt
  text: Low-capacity facilitative transporter for trehalose (PubMed:20035867, PubMed:34032568).
    Can also transport glucose (PubMed:34032568). Does not transport maltose, sucrose,
    lactose or fructose (PubMed:20035867, PubMed:34032568). Mediates the bidirectional
    transfer of trehalose (PubMed:20035867). Responsible for the transport of trehalose
    synthesized in the fat body and the incorporation of trehalose into other tissues
    that require a carbon source, thereby regulating trehalose levels in the hemolymph
    (PubMed:20035867). Required in glial cells of the blood brain barrier to fuel
    glycolysis but not required in neurons (PubMed:26235423). Neurons rely on the
    citric acid cycle for their energy needs and utilise alanine and lactate, by-products
    of glial cell glycolysis released into the hemolymph, as fuel (PubMed:26235423).
    Increased expression in glial cells of the blood brain barrier during starvation
    and increased cell surface localization enhances carbohydrate uptake to protect
    the central nervous system from restricted nutrient availability (PubMed:34032568).
  source_type: curated
