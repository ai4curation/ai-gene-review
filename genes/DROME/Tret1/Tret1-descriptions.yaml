- source: Alliance_Automated
  text: Enables D-glucose transmembrane transporter activity and trehalose transmembrane
    transporter activity. Involved in D-glucose transmembrane transport and trehalose
    transport. Located in plasma membrane and vesicle. Is expressed in several structures,
    including adult head; amnioserosa; embryonic/larval fat body; glial cell; and
    larval central nervous system. Orthologous to human SLC2A6 (solute carrier family
    2 member 6) and SLC2A8 (solute carrier family 2 member 8).
