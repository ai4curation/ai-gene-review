- source: Alliance_Imported
  text: Trehalose transporter 1 (Tret1) encodes a transmembrane protein that mediates
    the bidirectional transport of trehalose. It exports trehalose synthesized in
    the fat body into the hemolymph and imports it into other tissues that require
    a carbon source for energy production. It does not transport maltose, sucrose
    or lactose.
