    supporting_text: In addition, Tret1-1PA can facilitate uptake of glucose, while fructose is not taken
      up efficiently
    reference_section_type: RESULTS
suggested_questions:
- question: Does Tret1 export trehalose from the fat body in vivo, as proposed, or is its main physiological
    role uptake into peripheral tissues and the brain?
suggested_experiments:
- description: Measure hemolymph trehalose and fat-body trehalose after fat-body-specific Tret1 knockdown,
    compared with knockdown in perineurial glia.
