gene_symbol: Tret1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tret1 (Trehalose transporter 1; Tret1-1) encodes a facilitative sugar transporter of the
  major facilitator superfamily (SLC2/GLUT-like, most similar to mammalian GLUT6 and GLUT8). It mediates
  bidirectional, high-affinity transport of the disaccharide trehalose across the plasma membrane and
  also facilitates glucose uptake, but not fructose uptake. Trehalose is the main hemolymph sugar of insects;
  Tret1 is expressed in fat body, muscle and testis and, prominently, in the perineurial glia of the blood-brain
  barrier, where it supplies carbohydrate to the nervous system. In perineurial glia, Tret1-1 cycles between
  intracellular vesicles and the plasma membrane in a Rab7- and Rab10-dependent manner, and its expression
  rises during starvation under TGF-beta signaling control.
