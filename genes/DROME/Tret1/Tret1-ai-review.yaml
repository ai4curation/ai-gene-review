core_functions:
- description: Tret1 is a plasma membrane facilitative transporter that moves trehalose, the main hemolymph
    sugar, between hemolymph and cells, releasing it from the fat body and importing it into peripheral
    tissues and the blood-brain barrier glia.
  molecular_function:
    id: GO:0015574
    label: trehalose transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015771
    label: trehalose transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:20035867
    supporting_text: insect TRET1 is responsible for the release of trehalose from the fat body and the
      incorporation of trehalose into other tissues
    reference_section_type: ABSTRACT
  - reference_id: file:DROME/Tret1/Tret1-deep-research-falcon.md
    supporting_text: Its experimentally supported substrates are **trehalose and glucose**.
- description: Tret1-1 also facilitates glucose uptake, contributing to carbohydrate supply across the
    blood-brain barrier, especially during starvation.
  molecular_function:
    id: GO:0055056
    label: D-glucose transmembrane transporter activity
  directly_involved_in:
  - id: GO:1904659
    label: D-glucose transmembrane transport
  locations:
