  findings:
  - statement: Drosophila Pcf11 is required for Pol II termination at hsp70, localises to transcribed
      loci, and dismantles paused elongation complexes by bridging the CTD to nascent RNA.
    supporting_text: dPcf11 dismantles elongation complexes by a CTD-dependent but nucleotide-independent
      mechanism and that dPcf11 forms a bridge between the CTD and RNA
