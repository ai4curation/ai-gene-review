- term:
    id: GO:0031124
    label: mRNA 3'-end processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR045154
  review:
    summary: >-
      Correct. As the CFII subunit, Pcf11 takes part in pre-mRNA cleavage and in choosing the
      poly(A) site.
    action: ACCEPT
    reason: >-
      Human CFII (PCF11-CLP1) is active in reconstituted cleavage reactions, and yeast Pcf11 is needed
      for 3'-end processing. Both are in the same subfamily as A1Z9W4. In Drosophila spermatocytes,
      knocking down Pcf11 or cbc shifted cleavage from proximal to distal sites at many genes, and
      overexpressing CFII in spermatogonia moved cleavage to proximal sites. This is direct fly evidence
      that Pcf11 takes part in 3'-end cleavage site selection, which is a part of mRNA 3'-end
      processing. The alternative-polyadenylation child term is proposed as a NEW annotation below.
      This broader term remains correct for the general cleavage role, which has been shown in the
      orthologs.
    supported_by:
    - reference_id: PMID:39111825
      supporting_text: Knockdown of PCF11 or cbc in spermatocytes caused dysregulation of APA, with
        many transcripts normally cleaved at a proximal site in spermatocytes now cleaved at their
        distal site, as in spermatogonia.
    - reference_id: PMID:30139799
      supporting_text: The heterodimer is active in partially reconstituted cleavage reactions, whereas
        hClp1 by itself is not.
