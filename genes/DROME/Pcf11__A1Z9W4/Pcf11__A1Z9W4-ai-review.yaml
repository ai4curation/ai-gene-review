- term:
    id: GO:0141006
    label: transposable element silencing by piRNA-mediated heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:40015272
  qualifier: involved_in
  review:
    summary: >-
      Supported by fly genetics and tethering experiments. It is a specialised germline use of the
      Pcf11 termination machinery, not the core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      An RNAi screen identified Pcf11 as needed for piRNA-guided silencing in the Drosophila germline.
      Tethered Pcf11 by itself caused co-transcriptional repression and Pol II stalling, which depended
      on its alpha-helical, condensate-forming region (residues ~190-224 in A1Z9W4, PF20845). This
      shows that Pcf11 does part of the work of silencing (stalling Pol II at piRNA-targeted loci) and
      is not just required for it. The authors describe the mechanism as piRNAs exploiting a
      termination property of Pcf11, so the term is accepted as a non-core, context-specific process.
      The cached record is abstract-only. The FlyBase curator read the full text, and the abstract is
      consistent with the annotation.
    supported_by:
    - reference_id: PMID:40015272
      supporting_text: Through RNA interference screening, we discovered Pcf11 and PNUTS as essential
        for piRNA-guided silencing in Drosophila germ line.
    - reference_id: PMID:40015272
      supporting_text: Enforced tethering of Pcf11 leads to co-transcriptional repression and RNA polymerase
        II (RNA Pol II) stalling, and both are dependent on an α-helical region of Pcf11 capable of
        forming condensates.
    - reference_id: PMID:40015272
      supporting_text: a property exploited by piRNAs to silence transposons and initiate RNA-mediated
        heterochromatin formation
- term:
    id: GO:0110104
    label: mRNA alternative polyadenylation
  evidence_type: IMP
  original_reference_id: PMID:39111825
  qualifier: involved_in
  review:
    summary: >-
      New. Fly loss- and gain-of-function experiments show that Pcf11-containing CFII sets the choice
      between proximal and distal poly(A) sites in the male germline.
    action: NEW
    reason: >-
      Participation test: CFII is one of the four cleavage/polyadenylation subcomplexes that make the
      3' cut, so Pcf11 does part of the work of site selection and is not just needed upstream of it.
      Knockdown of Pcf11 (with two independent RNAi lines) shifted many transcripts to distal sites,
      and overexpression in spermatogonia shifted some to proximal sites. Comparator check: other
      cleavage-factor subunits in the same role, such as CPSF6 and CPSF7 of CFIm, carry GO:0110104 in
      GOA, so the convention puts cleavage-factor subunits on this term. GO:0110104 is a descendant
      of the accepted GO:0031124, and it records the fly-specific experimental finding that the
      family-level IEA does not capture.
    supported_by:
    - reference_id: PMID:39111825
      supporting_text: Knockdown of PCF11 or cbc in spermatocytes caused dysregulation of APA, with
        many transcripts normally cleaved at a proximal site in spermatocytes now cleaved at their
        distal site, as in spermatogonia.
    - reference_id: PMID:39111825
      supporting_text: Forced overexpression of CFII components in spermatogonia switched cleavage of
        some transcripts to the proximal site normally used in spermatocytes.
