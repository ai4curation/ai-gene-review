knowledge_gaps:
- gap_statement: It is not known which RNA sequences or structures fly Pcf11 recognises, or whether
    its conserved C-terminal zinc-finger region binds RNA as in human PCF11.
  boundary: Fly Pcf11 bridges the CTD to nascent RNA in vitro, and human CFII binds G-rich RNA through
    the Pcf11 zinc fingers. Neither the RNA-binding region nor any sequence preference has been mapped
    for the fly protein.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Map RNA binding of recombinant fly Pcf11 C-terminal fragments (with and without Cbc)
    by EMSA or CLIP, with zinc-finger cysteine mutants.
  provenance:
  - reference_id: PMID:30139799
    supporting_text: Binding is mediated mostly by the two zinc fingers in the C-terminal region of hPcf11.
- gap_statement: It is not known how the long Pcf11 product and the 573-residue RB product, which shares
    residues 1-372 with it, divide the CTD-binding, termination and CFII functions between them in vivo.
  boundary: The fly biochemistry used N-terminal constructs and an N-terminal antibody that recognise
    both products, and only the long forms were recovered with Cbc.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Isoform-specific CRISPR alleles or rescue constructs, assayed for termination readthrough
    at hsp70 and for proximal poly(A)-site use in spermatocytes.
  provenance:
  - reference_id: PMID:39111825
    supporting_text: The 70 kDa isoform of PCF11 was not detected in the immunoprecipitate
suggested_questions:
- question: Should the FlyBase gene-level experimental annotations for Pcf11, which come from N-terminal
    constructs and antibodies, be given to the long product A1Z9W4 as the reference isoform? This review
    assumes they should, because A1Z9W4 contains all the tested regions.
- question: Is GO:0003729 mRNA binding or GO:0036002 pre-mRNA binding the better molecular-function
    term for Pcf11 proteins, which bind nascent transcripts at the 3' end?
suggested_experiments:
- description: Make point mutations in the fly CID that abolish CTD binding and in the conserved first
    zinc-finger motif (residues 1368-1390), and test which mutations affect hsp70 termination and which
    affect proximal poly(A)-site choice in spermatocytes. This would show whether the separation of
    CTD-binding and processing functions seen in yeast also holds in the fly.
