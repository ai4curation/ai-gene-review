  review:
    summary: >-
      Core function, inherited within the Pcf11 subfamily and shown directly in Drosophila.
    action: ACCEPT
    reason: >-
      Yeast Pcf11 needs CTD binding for termination, and A1Z9W4 shares that function by descent. In
