- id: file:DROME/Pcf11__A1Z9W4/Pcf11__A1Z9W4-deep-research-flybase.md
  title: FlyBase gene description for Pcf11__A1Z9W4 (DROME)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: RNA binding is supported (an IDA row, and nascent-RNA binding in PMID:16387654). The claim
      that Pcf11 is involved in RNA splicing regulation was checked and is not supported. No GO annotation of
      Pcf11 refers to splicing, a PubMed search for Pcf11 or CG10228 with Drosophila and splicing returned no
      papers, and the fly literature describes Pcf11 as the cleavage factor II subunit acting in 3'-end
      processing, poly(A)-site choice and Pol II termination (PMID:16387654, PMID:22992452, PMID:39111825).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0264962
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Protein 1 of cleavage and polyadenylation factor 1 (Pcf11) encodes an RNA binding protein
        involved in RNA splicing regulation.
      confidence: PROBABLE
      explanation: The FlyBase description calls Pcf11 "an RNA binding protein involved in RNA splicing
        regulation". We found no Drosophila study linking Pcf11 to splicing, and no Pcf11 GO annotation refers
        to it. Fly studies show that Pcf11, as part of cleavage factor II with Cbc, is required for RNA
        polymerase II termination downstream of the poly(A) signal, bridges the Pol II CTD to nascent RNA and
        dismantles elongation complexes, and, in spermatocytes, promotes use of upstream poly(A) sites. The
        description should name pre-mRNA 3'-end processing and transcription termination instead of splicing,
        unless a splicing study supports the current wording.
      supported_by:
      - reference_id: PMID:16387654
        supporting_text: dPcf11 dismantles elongation complexes by a CTD-dependent but nucleotide-independent
          mechanism and that dPcf11 forms a bridge between the CTD and RNA
core_functions:
- description: >-
    Pcf11 is the Pol II CTD-binding subunit of cleavage factor II. Its N-terminal CID binds the
    CTD, it contacts nascent RNA, and it dismantles paused elongation complexes. In this way it
    couples 3'-end formation to poly(A)-dependent termination of RNA polymerase II transcription on
    transcribed chromatin.
