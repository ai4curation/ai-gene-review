  review:
    summary: >-
      Correct and core. Fly Pcf11 is needed for Pol II termination downstream of the poly(A) signal.
      The poly(A)-coupled child term fits the fly data better.
    action: MODIFY
    reason: >-
      RNAi depletion of Drosophila Pcf11 causes Pol II to read through the normal termination region
      of hsp70. Pcf11 is concentrated at the hsp70 3' end and dismantles paused elongation complexes.
      At a tandem gene pair whose termination occurs downstream of the poly(A) signal, termination
      depends on Pcf11. At a closely spaced pair it is Pcf11-independent, which shows that the
      requirement is for poly(A)-dependent termination specifically. The more specific term
      termination of RNA polymerase II transcription, poly(A)-coupled (GO:0030846), which the gene
      also carries by IBA, is the precise supported term.
    proposed_replacement_terms:
