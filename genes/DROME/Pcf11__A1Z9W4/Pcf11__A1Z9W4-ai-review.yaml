id: A1Z9W4
gene_symbol: Pcf11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Pcf11 (Inr-a, CG10228) encodes the Drosophila subunit of cleavage factor II (CFII), the
  pre-mRNA 3'-end cleavage factor it forms with Cbc, the fly Clp1 homolog. A1Z9W4 is the
  1953-residue long product of the locus. It has an N-terminal RNA polymerase II CTD-interacting
  domain (CID, residues ~11-149), a helical region, a conserved C2H2-like zinc-finger motif and a
  Pcf11 C-terminal domain, and it is in the same PANTHER subfamily (PTHR15921:SF3) as yeast and
  human Pcf11. In Drosophila cells Pcf11 is a nuclear, chromatin-associated protein. It is
  concentrated at the 3' end of hsp70 and found at most transcribed loci on polytene chromosomes.
  It is needed for RNA polymerase II to terminate downstream of the poly(A) signal. In vitro its
  N-terminal region binds the CTD and nascent RNA, and this bridge dismantles paused elongation
  complexes without nucleotide hydrolysis. The protein has no known catalytic activity. In the male
  germline the long Pcf11 forms co-immunoprecipitate with Cbc. Higher CFII levels in spermatocytes
  favour cleavage at upstream poly(A) sites at many genes, which shortens their 3' UTRs. In the
  female germline Pcf11 is required for piRNA-guided transposon silencing. Tethered Pcf11 stalls
  RNA polymerase II through condensates formed by its helical region with unphosphorylated Spt5.
  Loss-of-function alleles are recessive lethal, and the dose of Pcf11 inversely affects expression
  of a white reporter.
