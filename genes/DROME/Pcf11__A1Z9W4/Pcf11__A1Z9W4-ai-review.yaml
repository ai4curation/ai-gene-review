        of dPcf11 with RNAi causes Pol II to readthrough the normal region of termination.
    - reference_id: PMID:22992452
      supporting_text: In contrast, analysis of a tandem gene pair containing a longer intergenic region
        reveals that termination occurs farther downstream of the poly(A) signal and is, in this case,
        dependent on Pcf11 and Xrn2.
