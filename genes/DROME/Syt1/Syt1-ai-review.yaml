  review:
    summary: IBA from a synaptotagmin family-level node (PTN000001283); fly Syt1 is itself among the descendant
      evidence.
    action: ACCEPT
    reason: Syt1 binds t-SNAREs and the assembled SNARE complex, weakly without Ca2+ and much more strongly with
      it; this interaction is one of the two effector interactions (with anionic membranes) through which the Ca2+
      signal drives fusion, and disrupting it impairs synchronous release and the clamp. Fly SYT1 shows the Ca2+-promoted
