suggested_questions:
- question: Is fly Syt1 present on dense-core vesicles in motor and peptidergic neurons, and is it needed for neuropeptide
    release alongside or instead of Syt-alpha and Syt-beta?
- question: How much of the spontaneous-release clamp at fly synapses is Syt1's own, given that complexin is the
    dominant clamp in invertebrates?
- question: Is the tracheal lysosomal secretion of acid sphingomyelinase Ca2+-triggered through Syt1's C2 domains,
    or does Syt1 act there in a Ca2+-independent way?
suggested_experiments:
- experiment_type: Endogenous tagging and live imaging
  description: Image endogenously tagged Syt1 together with a dense-core vesicle cargo (ANF-GFP or an endogenous
    neuropeptide) at larval NMJ boutons, and measure activity-evoked neuropeptide release in syt1 null and Ca2+-binding
    mutants rescued with Syt-alpha or Syt-beta.
  hypothesis: Syt1 is on dense-core vesicles in motor neurons and contributes to their Ca2+-triggered release.
- experiment_type: Structure-function rescue in trachea
  description: Rescue tracheal Syt1 loss with C2A/C2B Ca2+-binding mutants and score dASM secretion and airway gas
    filling.
  hypothesis: Lysosomal dASM secretion in the trachea needs Ca2+ binding by Syt1.
