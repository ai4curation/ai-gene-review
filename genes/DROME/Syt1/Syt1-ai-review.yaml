  review:
    summary: IBA from the synaptotagmin family-level node (PTN000001283). The fly donors are Syt4, Syt7 and Syt-alpha;
      fly Syt1 is not among the descendant evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The node sits above many paralogs that do reside in or act at the plasma membrane (fly Syt-alpha co-fractionates
      with plasma membrane, Syt7 is a peri-active-zone protein, several mammalian synaptotagmins are surface proteins),
      so for the family as a whole the call is reasonable. For fly Syt1 it over-reaches. Syt1 is a single-pass integral
      protein of the synaptic vesicle, co-fractionates with synaptic vesicle proteins and not with plasma membrane
      markers, and acts from the vesicle: plasma-membrane-tethered Syt1 fails to restore synchronous release or
      to clamp spontaneous release. Its C2B domain engages plasma membrane PIP2 and SNAREs in trans, which is binding
      to the target membrane, not residence in it. Syt1 does pass through the plasma membrane after fusion and is
      trapped there when endocytosis is blocked, so the location is not false, but ''is_active_in plasma membrane''
      misstates where the protein works. Not removed, because a transient post-fusion pool exists and the endocytic
      role acts on it.'
    supported_by:
    - reference_id: PMID:15263020
      supporting_text: Syt 1 comigrates with other synaptic vesicle proteins such as n-Synaptobrevin
    - reference_id: PMID:25775572
      supporting_text: Transgenic animals expressing only the cytoplasmic C2 domains or full-length Syt1 tethered
        to the plasma membrane failed to restore synchronous synaptic vesicle fusion, and also failed to clamp spontaneous
        vesicle release.
    - reference_id: PMID:15824135
      supporting_text: The synaptic vesicle protein synaptotagmin is trapped on the presynaptic plasma membrane
        and diffuses along the axon of shits2 nerve terminals stimulated at elevated temperatures
    - reference_id: PMID:33619613
      supporting_text: SYT1 is prepositioned at the SV-plasma membrane interface in part through its C2B polybasic
        stretch and more fully by its C2B SNARE-binding interaction
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
