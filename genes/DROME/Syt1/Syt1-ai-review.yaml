  review:
    summary: IBA from the Syt1/Syt2-type node (PTN000740739), seeded by mouse and rat Syt1.
    action: ACCEPT
    reason: 'Fly Syt1 regulates synaptic vesicle exocytosis in both directions: it triggers synchronous fusion,
      suppresses asynchronous fusion and restrains spontaneous fusion. Spontaneous release rises in null mutants,
      and vesicle-tethering mutants lose the clamp. The undirected regulation term fits that dual role; the triggering
      half is also captured by the accepted GO:0099502. In invertebrates complexin is the more prominent clamp,
      but the Syt1 contribution is shown genetically. The node placement holds for the fly gene.'
    supported_by:
    - reference_id: PMID:7938019
      supporting_text: Our data support a model in which synaptotagmin functions as a negative regulator of spontaneous
        vesicle fusion and acts to increase the efficiency of excitation-secretion coupling during synaptic transmission.
    - reference_id: PMID:25775572
      supporting_text: Transgenic animals expressing only the cytoplasmic C2 domains or full-length Syt1 tethered
        to the plasma membrane failed to restore synchronous synaptic vesicle fusion, and also failed to clamp spontaneous
        vesicle release.
    - reference_id: PMID:12467593
      supporting_text: These results indicate that synaptotagmin is the major Ca(2+) sensor for evoked release and
        functions to trigger synchronous fusion in response to Ca(2+), while suppressing asynchronous release.
    - reference_id: PMID:33619613
      supporting_text: In addition to activating release, SYT1 also inhibits spontaneous fusion through a clamping
        mechanism similar to the role of CPX
