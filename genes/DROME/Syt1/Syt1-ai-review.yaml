- id: file:DROME/Syt1/Syt1-uniprot.txt
  title: UniProt entry P21521 (Syt1)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Reviewed Swiss-Prot entry. Topology, the two C2 domains, the Stoned A/B interaction and synaptic
      vesicle membrane location are accurate. The CC FUNCTION text dates from the 1991 cloning paper (PubMed:1840599)
      and describes only a possible regulatory role in vesicle membrane interactions plus acidic phospholipid binding;
      it does not say that fly Syt1 is the Ca2+ sensor for synchronous neurotransmitter release, which fly genetics
      established from 1993 on.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P21521
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: May have a regulatory role in the membrane interactions during trafficking of synaptic vesicles
        at the active zone of the synapse.
      confidence: CONFIRMED
      explanation: 'The FUNCTION comment "May have a regulatory role in the membrane interactions during trafficking
        of synaptic vesicles at the active zone of the synapse" is the hedged wording of the 1991 cloning paper.
        Drosophila genetics has since shown that Syt1 is the major Ca2+ sensor for evoked, synchronous neurotransmitter
        release: synchronous release is abolished in syt1 null mutants (PMID:12467593) and mutating the C2B Ca2+-binding
        aspartates cuts evoked release by more than 95% (PMID:12110842). Syt1 also suppresses asynchronous and spontaneous
        release and acts in compensatory endocytosis (PMID:14634669). Suggested text: Synaptic vesicle Ca2+ sensor
        that triggers fast, synchronous neurotransmitter release by Ca2+-dependent binding of its C2 domains to
        anionic phospholipids and SNARE complexes; also suppresses asynchronous and spontaneous release and is required
        for efficient synaptic vesicle endocytosis.'
      supported_by:
      - reference_id: PMID:12467593
        supporting_text: These results indicate that synaptotagmin is the major Ca(2+) sensor for evoked release
          and functions to trigger synchronous fusion in response to Ca(2+), while suppressing asynchronous release.
      - reference_id: PMID:12110842
        supporting_text: These studies show that the Ca(2+)-binding motif of the C(2)B domain of synaptotagmin is
          essential for synaptic transmission.
- id: file:DROME/Syt1/Syt1-deep-research-flybase.md
  title: FlyBase gene description for Syt1 (DROME)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'One sentence, every claim traced: synaptic vesicle protein (PMID:15263020, the only synaptotagmin
      on fly synaptic vesicles), Ca2+ binding (PMID:22279210, PMID:12110842) and fast Ca2+ sensor for neurotransmitter
      release (PMID:12467593). Accurate but narrow: it omits the suppression of asynchronous and spontaneous release,
      the endocytic role and the tracheal lysosomal-secretion role.'
