  review:
    summary: IBA from the Syt1/Syt2-type node (PTN000740739), seeded by mouse Syt1 and Syt9, rat Syt1 and worm SNT-2.
    action: UNDECIDED
    reason: 'The node placement is sound for the mammalian proteins: Syt1 sits on dense-core vesicles and is a Ca2+
      sensor for their release in mammalian neuroendocrine cells and neurons. Fly data neither confirm nor exclude
      it. Drosophila has two neuroendocrine-specific isoforms, Syt-alpha and Syt-beta, that are on dense-core vesicles
      and are presumed to be their Ca2+ sensors. Whether fly Syt1 is also on dense-core vesicles, or acts in their
      fusion, has not been tested; a 2021 review of fly synaptotagmins calls it unclear, though likely. Fly Syt1
      was found only on synaptic vesicles in fractionation, but those experiments did not look for dense-core vesicles.
      Without fly localization or a requirement in neuropeptide release, the row can be neither accepted nor marked
      as over-annotation.'
