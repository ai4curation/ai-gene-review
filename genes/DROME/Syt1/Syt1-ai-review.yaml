gene_symbol: Syt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Synaptotagmin 1 (Syt1) is the synaptic vesicle Ca2+ sensor of Drosophila and the only synaptotagmin
  found on synaptic vesicles in the fly. It is a single-pass integral vesicle membrane protein whose cytoplasmic
  region carries two C2 domains, C2A and C2B, which bind Ca2+ through clusters of aspartate residues. A polybasic
  surface of C2B binds PI(4,5)P2 in the plasma membrane even without Ca2+, helping to position the vesicle; on Ca2+
  entry the C2 domains bind phosphatidylserine-containing membranes and SNARE complexes, and the C2B domain penetrates
  the target membrane. These interactions couple Ca2+ binding to fast, synchronous fusion of docked vesicles. Ca2+
  binding by C2B drives synchronous release, while Ca2+ binding by C2A contributes to the trigger and suppresses
  the slower asynchronous release that is unmasked in syt1 mutants. Syt1 also restrains spontaneous fusion, and
  it works only when anchored in the vesicle membrane. Independently of Ca2+, it supports vesicle docking and compensatory
  endocytosis, and its C2B domain binds the endocytic adaptor Stoned. Null mutants lose synchronous neurotransmitter
  release, show more asynchronous and spontaneous release, and are severely uncoordinated, mostly dying before adulthood.
  Outside neurons, Syt1 acts with Rab39 and Syntaxin 1A in the secretion of lysosomal acid sphingomyelinase that
  lines the embryonic airways for gas filling. Other fly synaptotagmins occupy different compartments: Syt4 is postsynaptic,
  Syt7 lies in a peri-active-zone compartment, and Syt-alpha and Syt-beta sit on dense-core vesicles of neuroendocrine
  cells.'
