descriptions:
- source: UniProt
  text: May have a regulatory role in the membrane interactions during trafficking of synaptic
    vesicles at the active zone of the synapse. It binds acidic phospholipids with a specificity
    that requires the presence of both an acidic head group and a diacyl backbone.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21521
  source_id: P21521
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'The 1991 cloning-paper text: a hedged "may have a regulatory role" in vesicle
      membrane interactions plus acidic phospholipid binding specificity. Not wrong, but outdated:
      it does not say that Syt1 is the Ca2+ sensor for synchronous release, which fly genetics
      established, nor mention the clamp or endocytic roles.'
- source: Alliance_Imported
  text: Synaptotagmin 1 (Syt1) encodes a synaptic vesicle calcium binding protein that functions
    as the fast calcium sensor for neurotransmitter release at synapses.
  source_type: curated
  url: https://flybase.org/reports/Syt1.html
  source_id: FB:FBgn0004242
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Accurate and to the point: synaptic vesicle Ca2+-binding protein and fast
      Ca2+ sensor for neurotransmitter release. Omits the suppression of asynchronous and spontaneous
      release, the endocytic role and the tracheal lysosomal-secretion role.'
- source: Alliance_Automated
  text: Enables several functions, including calcium ion binding activity; phospholipid binding
    activity; and protein homodimerization activity. Involved in several processes, including
    modulation of chemical synaptic transmission; secretion of lysosomal enzymes; and synaptic
    vesicle cycle. Located in neuromuscular junction; synaptic vesicle; and terminal bouton.
    Is expressed in several structures, including adult brain; adult somatic muscle cell; ganglia;
    neuromuscular junction; and presumptive embryonic/larval system. Used to study congenital
    myasthenic syndrome; congenital myasthenic syndrome 7; and neuromuscular junction disease.
    Human ortholog(s) of this gene implicated in congenital myasthenic syndrome; congenital
    myasthenic syndrome 7; and disease of mental health. Orthologous to several human genes
    including SYT2 (synaptotagmin 2).
  source_type: automated
  url: https://flybase.org/reports/Syt1.html
  source_id: FB:FBgn0004242
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: 'True but generic: leads with calcium ion binding, phospholipid binding and
      homodimerization rather than Ca2+-sensor activity, and gives secretion of lysosomal enzymes
      equal weight with the synaptic vesicle cycle. Locations are right. Long expression and
      disease lists; names SYT2 as ortholog.'
