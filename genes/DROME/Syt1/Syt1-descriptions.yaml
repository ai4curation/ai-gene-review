findings:
- category: discrepancy
  text: UniProt's FUNCTION says Syt1 "may have a regulatory role" in vesicle membrane interactions;
    fly genetics shows it is the major Ca2+ sensor for synchronous neurotransmitter release,
    as the FlyBase text says.
  sources:
  - UniProt
  - Alliance_Imported
- category: gap
  text: No source mentions that Syt1 suppresses asynchronous and spontaneous release or that
    it is needed for compensatory synaptic vesicle endocytosis.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: insight
  text: Only the automated text records the non-neuronal role in tracheal secretion of lysosomal
    acid sphingomyelinase (secretion of lysosomal enzymes), though it gives it the same weight
    as the synaptic role.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources place Syt1 on synaptic vesicles in neurotransmission. FlyBase states
    the Ca2+-sensor role; UniProt's text predates it, and the automated text describes it only
    through generic binding activities.
