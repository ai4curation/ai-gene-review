id: P98149
gene_symbol: Dif
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dif (Dorsal-related immunity factor) encodes a Rel/NF-kappaB family transcription factor,
  a paralogue of Dorsal encoded at an adjacent locus, with an N-terminal Rel homology domain for kappaB-site
  DNA binding and dimerization and a C-terminal transactivation region. In unchallenged larval and adult
  fat body Dif is held in the cytoplasm by the IkappaB homologue Cactus. Infection by fungi or Gram-positive
  bacteria activates the Toll receptor through the cleaved cytokine Spaetzle; signalling via Myd88, Tube
  and Pelle leads to Cactus degradation, and Dif enters the nucleus, binds kappaB-like motifs and, with
  Mediator, activates antimicrobial peptide genes such as drosomycin, metchnikowin and defensin. Dif is
  the Toll-pathway transcription factor required for antifungal and anti-Gram-positive defence in adults
  and acts redundantly with Dorsal in larvae; it does not take part in embryonic dorsoventral patterning.
  It forms homodimers and heterodimers with Dorsal and Relish, the latter able to activate targets of
  both Toll and Imd pathways. Dif and Dorsal also sustain hemocyte number, and an alternative Dif B isoform
  is expressed in the larval mushroom bodies.
