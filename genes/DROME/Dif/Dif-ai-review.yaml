suggested_questions:
- question: Wu and Anderson (1998) reported that Toll is not required for larval Dif nuclear import, whereas
    later genetics place Dif downstream of Toll for drosomycin. Which upstream pathway controls Dif import
    in larval fat body?
- question: Should the Toll-Cactus-Dif branch carry canonical NF-kappaB signal transduction (GO:0007249),
    whose definition requires IKK, given that drosomycin induction is ird5/IKKbeta-independent?
- question: How much of adult antimicrobial peptide induction is carried by Dif-Relish heterodimers in
    vivo, as opposed to Dif homodimers?
suggested_experiments:
- description: Compare Dif ChIP-seq in adult fat body after fungal versus Gram-positive infection, and
    in relish mutants, to separate homodimer and Dif-Relish heterodimer targets.
- description: Test Dif nuclear import in larval fat body of Toll and pelle null clones to resolve the
    Toll-independent import reported in larvae.
