- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific
    and RNA polymerase II transcription regulatory region sequence-specific DNA binding
    activity. Involved in several processes, including Toll signaling pathway; regulation
    of gene expression; and salivary gland histolysis. Located in cytosol and nucleus.
    Is expressed in adult heart; embryonic/larval fat body; embryonic/larval posterior
    spiracle; and embryonic/larval salivary gland. Used to study bacterial infectious
    disease. Human ortholog(s) of this gene implicated in breast disease (multiple);
    carcinoma (multiple); immunodeficiency 53; immunodeficiency 92; and lymphoma.
    Orthologous to several human genes including RELA (RELA proto-oncogene, NF-kB
    subunit) and RELB (RELB proto-oncogene, NF-kB subunit).
