    overall_notes: Correct on kappaB binding and larval immune response, but centred
      on older and peripheral findings (CecA1 enhancer, melanization via Spn27A, cell
      competition, PNS development). Does not say Dif is the main Toll-pathway factor
      in adult antifungal defence.
- source: Alliance_Imported
  text: Dorsal-related immunity factor (Dif) encodes a transcription factor that contributes
    to zygotic function of the Toll pathway, notably the regulation of antimicrobial
    peptides, but it is not involved in dorsoventral patterning of the embryo.
