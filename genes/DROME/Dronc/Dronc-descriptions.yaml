descriptions:
- source: UniProt
  text: Involved in the activation cascade of caspases responsible for apoptosis execution
    (PubMed:10200258, PubMed:10675329, PubMed:10984473). Effector of steroid-mediated
    apoptosis during insect metamorphosis (PubMed:10984473). Overexpression promotes
    programmed cell death (PubMed:10200258, PubMed:10675329, PubMed:10984473). Interaction
    with Diap1 is required to suppress Dronc-mediated cell death; via Diap1-mediated
    ubiquitination of Dronc (PubMed:10675329, PubMed:14517550). Rate-limiting caspase
    in rpr, grim and hid death pathway (PubMed:10984473, PubMed:14517550). Recruited
    to the Dark apoptosome, an adapter protein complex that mediates activation of
    the caspase cascade in programmed cell death initiated by the intrinsic apoptosis
    pathway (PubMed:21220123, PubMed:25644603). Association with the Dark apoptosome
    stimulates autocatalytic cleavage and activation of Dronc, promoting Dronc-mediated
    cleavage of downstream effector caspases such as Drice (PubMed:21220123, PubMed:25644603).
  source_type: curated
