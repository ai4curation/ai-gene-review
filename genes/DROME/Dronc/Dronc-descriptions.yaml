- source: Alliance_Automated
  text: Enables cysteine-type endopeptidase activity and protein homodimerization
    activity. Involved in several processes, including nervous system development;
    programmed cell death involved in cell development; and protein processing. Located
    in cytoplasm; nucleus; and plasma membrane. Part of apoptosome. Is expressed in
    several structures, including clypeo-labral primordium; cystic bulge; germline
    cyst; gut section; and salivary gland. Used to study testicular cancer. Human
    ortholog(s) of this gene implicated in autosomal recessive intellectual developmental
    disorder. Orthologous to human CASP2 (caspase 2).
