suggested_questions:
- question: Can the catalysis-independent p53/Dronc germ-cell necrosis branch be represented in GO 
    without implying apoptosome assembly or cysteine-endopeptidase activity?
- question: Which Dronc substrates distinguish lethal apoptotic execution from the local 
    nonapoptotic proteolysis used in spermatid individualization, dendrite pruning, and 
    sensory-organ precursor patterning?
- question: How should Eiger/TNF-like signaling to Dronc be modularized in flies, given that JNK 
    input can drive both Dronc-dependent apoptosis and Dronc-dependent necrosis?
suggested_experiments:
- hypothesis: Distinct Dronc docking surfaces route effector-caspase activation, spermatid 
    individualization, and catalysis-independent germ-cell necrosis.
  description: Introduce endogenous Dronc separation-of-function alleles affecting the CARD, 
    catalytic cysteine, DIAP1-binding motif, and substrate exosites, then measure DrICE cleavage, 
    spermatid individualization, Shaggy cleavage, and spermatogonial necrosis in parallel.
  experiment_type: endogenous structure-function rescue
- hypothesis: Dark-Dronc apoptosome geometry determines whether Dronc activates DrICE productively 
    or is held in a restrained zymogen state.
  description: Use purified Dark-Dronc variants and single-particle cryo-EM plus DrICE cleavage 
    kinetics to compare wild-type complexes with CARD-interface mutants identified from the 
    Dronc-CARD/Dark apoptosome structures.
  experiment_type: structure-guided reconstitution
