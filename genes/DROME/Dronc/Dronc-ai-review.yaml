id: Q9XYF4
gene_symbol: Dronc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Dronc is the Drosophila CARD-containing initiator caspase that couples Dark apoptosome assembly
  to activation of downstream effector caspases such as DrICE and DCP-1. It is synthesized as a zymogen,
  recruited to Dark through CARD-domain contacts, activated by autocatalytic cleavage and homodimerization,
  and restrained by DIAP1-dependent binding and ubiquitination until RHG proteins or other death signals
  relieve that inhibition. Dronc is central to developmental and stress-induced apoptosis and is also
  reused in restricted nonapoptotic contexts including spermatid individualization, sensory-organ precursor
  patterning, compensatory proliferation from undead cells, and programmed germ-cell necrosis.'
