descriptions:
- source: Alliance_Imported
  text: Sterol regulatory element binding protein (SREBP) encodes a membrane protein
    that functions as a master-regulator of lipogenesis. It activates transcription
    of lipogenic genes upon reduction of lipid or cholesterol levels.
  source_type: curated
  url: https://flybase.org/reports/SREBP.html
  source_id: FB:FBgn0261283
