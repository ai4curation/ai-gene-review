      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Master regulator of lipogenesis activated by low lipid levels is
      correct. 'Or cholesterol levels' does not fit flies, where phosphatidylethanolamine
      regulates processing.
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific.
    Involved in SREBP signaling pathway; fatty acid homeostasis; and lipid droplet
    formation. Located in endoplasmic reticulum membrane and nuclear membrane. Is
    expressed in several structures, including Malpighian tubule primordium; embryonic/larval
    midgut cell; embryonic/larval midgut primordium; gut section; and oenocyte. Used
    to study heart conduction disease. Human ortholog(s) of this gene implicated in
    several diseases, including alopecia; artery disease (multiple); glucose metabolism
    disease (multiple); prostate cancer; and vascular dementia. Orthologous to several
    human genes including SREBF2 (sterol regulatory element binding transcription
    factor 2).
  source_type: automated
