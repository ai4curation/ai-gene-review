taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SREBP (HLH106) is the single Drosophila sterol regulatory element-binding protein, a membrane-bound
  basic helix-loop-helix leucine zipper transcription factor. The precursor resides in the ER membrane
  in a complex with SCAP; when membrane phosphatidylethanolamine is low, it is transported to the Golgi
  and sequentially cleaved, releasing the N-terminal bHLH-Zip domain, which enters the nucleus, binds
  sterol regulatory elements and E-boxes as a dimer, and activates RNA polymerase II transcription of
  genes for fatty acid and phospholipid synthesis. dSREBP is essential for larval fatty acid synthesis
  and growth (mutants are fatty acid auxotrophs), and it also influences lipid droplet formation in specific
  cell types.
