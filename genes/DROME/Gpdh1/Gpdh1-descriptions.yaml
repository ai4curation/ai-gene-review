descriptions:
- source: Alliance_Imported
  text: Glycerol-3-phosphate dehydrogenase 1 (Gpdh1) encodes an enzyme that catalyzes
    the reduction of dihydroxyacetone phosphate to glycerol 3-phosphate with the concomitant
    oxidation of NADH to NAD(+). It is involved in triglyceride metabolism and is
    part of the glycerophosphate shuttle.
  source_type: curated
  url: https://flybase.org/reports/Gpdh1.html
  source_id: FB:FBgn0001128
