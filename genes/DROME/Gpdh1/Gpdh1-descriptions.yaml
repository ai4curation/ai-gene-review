- source: Alliance_Automated
  text: Enables glycerol-3-phosphate dehydrogenase (NAD+) activity. Involved in several
    processes, including flight behavior; glycerol-3-phosphate biosynthetic process;
    and nicotinamide nucleotide metabolic process. Located in M band; Z disc; and
    cytosol. Is expressed in adult head; adult heart; and flight muscle cell. Human
    ortholog(s) of this gene implicated in Brugada syndrome 2 and lipid metabolism
    disorder. Orthologous to several human genes including GPD1 (glycerol-3-phosphate
    dehydrogenase 1).
  source_type: automated
