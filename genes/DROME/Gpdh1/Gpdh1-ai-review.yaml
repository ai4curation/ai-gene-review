core_functions:
- description: >-
    Cytosolic NAD+-dependent glycerol-3-phosphate dehydrogenase that reduces glycolytic
    dihydroxyacetone phosphate to sn-glycerol 3-phosphate with NADH. This supplies G3P for
    glycerolipid (triglyceride) synthesis in larval fat body and regenerates cytosolic NAD+,
    in parallel with lactate dehydrogenase. The activity is experimentally established for this
    gene product in D. melanogaster (purified enzyme, isozyme kinetics, null alleles, metabolomics).
  supported_by:
  - reference_id: PMID:35536221
    supporting_text: GPDH1 relies on the cofactor NAD+/NADH to interconvert the glycolytic intermediate
      DHAP to G3P.
  - reference_id: PMID:405967
    supporting_text: mutations at the Gpdh locus obliterate all isozymatic species of alpha-GPDH
      in all developmental stages
  molecular_function:
    id: GO:0141152
    label: glycerol-3-phosphate dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0046167
    label: glycerol-3-phosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
- description: >-
    Cytosolic enzyme of the glycerol-3-phosphate shuttle in adult flight muscle. Gpdh1 oxidizes
    cytosolic NADH while reducing DHAP to G3P; mitochondrial glycerophosphate oxidase then
    reoxidizes the G3P, delivering electrons to the respiratory chain to power flight. The
    flight-muscle isoform (UniProt isoform C, C-terminal QNL) is targeted to sarcomeric Z-discs
    and M-lines, which is needed for co-localization of other glycolytic enzymes and for flight.
    This isoform-specific targeting depends on the C-terminal tripeptide and should not be
    transferred to paralogs lacking it.
  supported_by:
  - reference_id: PMID:35536221
    supporting_text: G3P is used as a precursor for TAG synthesis and functions in the G3P electron
      shuttle to transfer reducing equivalents to the mitochondria.
  - reference_id: PMID:9307964
    supporting_text: transgenic flies that synthesize only GPDH-3, lacking the C-terminal tripeptide,
      do not show the periodic banding pattern of localization at Z-discs and M-lines for GPDH
  molecular_function:
    id: GO:0141152
    label: glycerol-3-phosphate dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0006127
    label: glycerol-3-phosphate shuttle
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0030018
    label: Z disc
  - id: GO:0031430
    label: M band
proposed_new_terms: []
suggested_questions:
- question: >-
    Does Gpdh1 contribute directly to ethanol metabolism (for example by reoxidizing NADH
    generated by alcohol dehydrogenase), or is the ethanol-tolerance effect of GPDH activity an
    indirect consequence of lipid or energy metabolism?
- question: >-
    Which C-terminal features beyond the QNL tripeptide, and which sarcomeric partners (GAPDH,
    PGLYM identified by two-hybrid), anchor the flight-muscle isoform at Z-discs and M-lines?
- question: >-
    Is the requirement for maternal Gpdh1 in oogenesis and embryogenesis explained by G3P supply
    for lipid synthesis, by cytosolic NAD+ regeneration, or by another role?
suggested_experiments:
- hypothesis: The oogenesis defect of Gpdh1 nulls reflects loss of cytosolic NAD+ regeneration rather
    than loss of G3P supply for lipid synthesis.
  description: >-
    Rescue germline-specific Gpdh1 loss with a catalytically dead K206A transgene, with wild-type
    Gpdh1, or by co-expressing a cytosolic NADH oxidase (e.g. LbNOX). Measure egg chamber
    progression, ovarian TAG and NAD+/NADH ratios.
- hypothesis: Gpdh1 activity contributes to ethanol clearance by reoxidizing ADH-generated NADH.
  description: >-
    Measure ethanol clearance, cytosolic NADH/NAD+ (e.g. with a genetically encoded sensor) and
    13C-ethanol incorporation into G3P and lipid in Gpdh1 null, wild-type and duplication flies.
