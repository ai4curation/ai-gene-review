id: P13706
gene_symbol: Gpdh1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Gpdh1 (CG9042) encodes the cytosolic NAD+-dependent glycerol-3-phosphate dehydrogenase
  of Drosophila melanogaster (EC 1.1.1.8), a 360-residue homodimeric enzyme with an
  N-terminal NAD-binding Rossmann domain and a C-terminal substrate-binding domain. It
  interconverts dihydroxyacetone phosphate (DHAP) and sn-glycerol 3-phosphate (G3P) with
  NADH/NAD+, and in vivo mainly reduces glycolytic DHAP to G3P, regenerating cytosolic NAD+.
  The G3P it makes supplies the glycerol backbone for triglyceride synthesis in the larval
  fat body. In adult flight muscle it is the cytosolic half of the glycerol-3-phosphate
  shuttle: mitochondrial glycerophosphate oxidase reoxidizes the G3P, delivering reducing
  equivalents to the respiratory chain. The classical larval and adult isozymes come from one
  gene through alternative splicing of the last exon. Only the flight-muscle isoform (GPDH-1,
  UniProt isoform C), whose C-terminus ends in Gln-Asn-Leu, is targeted to sarcomeric Z-discs
  and M-lines. There it is needed for co-localization of other glycolytic enzymes and for
  flight. Null mutants are subviable, with slow larval growth, low G3P and triglyceride,
  reduced flight capacity, female sterility with defective oogenesis, and short adult lifespan.
