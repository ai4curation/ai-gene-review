  review:
    summary: Reduced GPDH activity lowers the adult triglyceride pool; Gpdh1 supplies the G3P
      backbone for triglyceride synthesis.
    action: KEEP_AS_NON_CORE
    reason: Gpdh1 makes the glycerol-3-phosphate precursor for glycerolipid synthesis. It
