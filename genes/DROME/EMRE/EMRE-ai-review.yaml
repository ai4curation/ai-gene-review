suggested_questions:
- question: Does Drosophila EMRE, like human EMRE, bind MICU1 through its C-terminal acidic tail to keep
    the MCU pore under gatekeeper control?
suggested_experiments:
- description: Express EMRE lacking the C-terminal acidic tail in EMRE null flies and measure low-calcium
    leak through the uniporter in isolated mitochondria.
