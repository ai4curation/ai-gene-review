gene_symbol: EMRE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: EMRE (CG17680) encodes the Drosophila essential MCU regulator, a small single-pass protein
  of the inner mitochondrial membrane and a metazoan-specific subunit of the mitochondrial calcium uniporter.
  As in other animals, fly MCU cannot conduct calcium without EMRE; EMRE's transmembrane helix associates
  with the MCU pore and stabilizes its open state, and in mammals its acidic C-terminal tail also couples
  the pore to the MICU gatekeepers. Loss of EMRE abolishes fast mitochondrial calcium uptake, and co-overexpression
  of EMRE with MCU causes MICU1-suppressible tissue loss, while EMRE null flies are viable with a shortened
  lifespan.
