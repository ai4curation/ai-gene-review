taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Spätzle (spz) is a secreted cystine-knot cytokine of Drosophila melanogaster and the principal
  ligand of the Toll receptor. It is made as a disulfide-linked dimeric pro-protein, encoded by many maternally
  supplied splice isoforms that share a C-terminal cystine-knot domain related to the neurotrophins (NGF
  family) and differ in their pro-domains. The pro-domain is needed for folding and secretion and masks
  the receptor-binding surface. Extracellular serine protease cascades cleave pro-Spätzle after Arg220
  to release the active C-106 dimer: in the early embryo the ventrally activated protease Easter does
  so in the perivitelline space, and during infection or tissue damage the Spätzle-processing enzyme SPE
  (and other proteases downstream of Persephone, Hayan and the ModSP/Grass pathway) does so in the haemolymph.
  Mature Spätzle binds the concave face of the N-terminal leucine-rich-repeat region of the Toll ectodomain
  with nanomolar affinity, releasing the pro-domain and driving formation of a signalling-competent Toll
  dimer that recruits MyD88, Tube and Pelle and ends in degradation of Cactus and nuclear entry of Dorsal
  and Dif. Unlike vertebrate Toll-like receptors, Toll is thus activated by an endogenous cytokine rather
  than by microbial molecules. Through this pathway Spätzle specifies the embryonic dorsal-ventral axis,
  and in larvae and adults it drives induction of antifungal and antibacterial peptides such as drosomycin
  and is required for defence against fungi and Gram-positive bacteria. Spätzle also binds Toll-7, has
  neurotrophic activity (neuronal survival and motor axon targeting) shared with its paralogues DNT1 and
  DNT2, and acts through Toll in muscle patterning, wound-induced epidermal gene expression, cell competition
  and responses to tumours.'
