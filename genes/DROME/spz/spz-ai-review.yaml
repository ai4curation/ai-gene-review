core_functions:
- molecular_function:
    id: GO:0005125
    label: cytokine activity
  description: 'Proteolytically activated Spätzle C-106 dimer is the extracellular cytokine ligand of
    Toll: it binds the N-terminal LRR region of the Toll ectodomain and triggers Toll signalling, leading
    to Dorsal/Dif-dependent gene expression. This single activity underlies dorsal-ventral patterning
    of the embryo and the Toll-dependent antifungal and anti-Gram-positive immune response.'
  directly_involved_in:
  - id: GO:0008063
    label: Toll signaling pathway
  - id: GO:0009950
    label: dorsal/ventral axis specification
  - id: GO:0061760
    label: antifungal innate immune response
  - id: GO:0050830
    label: defense response to Gram-positive bacterium
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:12872120
    supporting_text: in vitro experiments showed that the mature form of Spätzle bound to the Toll ectodomain
      with high affinity and with a stoichiometry of one Spätzle dimer to two receptors
  - reference_id: PMID:24733933
    supporting_text: Spätzle binds to the concave surface of the membrane-distal LRR domain, in contrast
      to the flanking ligand interactions observed for mammalian Toll-like receptors, with asymmetric
      contributions from each Spätzle protomer.
  - reference_id: PMID:9533958
    supporting_text: An active form of Easter protease cleaves the Spätzle protein, generating a carboxyterminal
      polypeptide fragment which, when microinjected into the perivitelline space of a spätzle deficient
      embryo, directs production of ventrolateral pattern elements.
  - reference_id: PMID:8808632
    supporting_text: the extracellular Toll ligand, spätzle, control expression of the antifungal peptide
      gene drosomycin in adults
- molecular_function:
    id: GO:0008083
    label: growth factor activity
  description: 'Neurotrophin-like trophic activity: Spätzle, acting with Toll, supports survival of CNS
    neurons and targeting of SNa motor axons in the late embryo, partly redundantly with DNT1 and DNT2.'
  directly_involved_in:
  - id: GO:0043524
    label: negative regulation of neuron apoptotic process
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:19018662
    supporting_text: Apoptosis increases in the CNS of spz2 and Tollr3/Df(3R)ro80b mutant embryos, indicating
      that both Spz and Toll are required for neuronal survival
  - reference_id: PMID:19018662
    supporting_text: Altogether, these data show that spz also has neurotrophic function, but it is weaker
      than DNT1.
suggested_questions:
- question: Which protease processes pro-Spätzle when SPE is absent (e.g. after M. luteus challenge of
    SPE mutant larvae), and does it cut at the same Arg220 site?
- question: Does the pro-domain-associated form of Spätzle circulating in haemolymph have any signalling
    activity of its own, and do the maternal isoforms that lack the cleavage site (8.24, 11.27) have a
    function?
- question: Should the enzyme-substrate relationship between SPE/Easter and Spätzle be captured with has_input
    on the protease activity (e.g. in a GO-CAM of the Toll ligand activation cascade), rather than by
    annotating Spätzle to GO:0160032?
- question: Is Spätzle required for defence against any Gram-negative bacterium, as asserted by the IMP
    annotation from PMID:26843333?
suggested_experiments:
- description: Survival and drosomycin/AMP induction assays in spz null flies infected with a panel of
    Gram-negative bacteria (including Lys-type peptidoglycan-containing strains), with Relish mutants
    as controls, to settle whether spz contributes to Gram-negative defence.
- description: Mass spectrometry of haemolymph Spätzle fragments in SPE, Hayan and psh single and double
    mutants after infection or sterile injury to identify alternative processing sites and proteases.
- description: In vivo binding and signalling assays of Spätzle C-106 with Toll-7 and other Toll paralogues
    in neurons to test which receptors mediate its neurotrophic function.
