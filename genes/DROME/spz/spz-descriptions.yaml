    - rubric: specificity
      score: 4
    overall_notes: 'Correct: secreted protein cleaved by Easter or SPE that dimerizes
      Toll, in dorsal-ventral patterning and antimicrobial peptide regulation.'
- source: Alliance_Automated
  text: Enables Toll binding activity; growth factor activity; and protein homodimerization
    activity. Involved in several processes, including Toll signaling pathway; defense
    response to bacterium; and positive regulation of antimicrobial peptide biosynthetic
    process. Located in extracellular region. Is expressed in A1-7 lateral transverse
    muscle cell; embryonic/larval hemocyte; gut section; ovary; and ventral midline
    of embryo.
