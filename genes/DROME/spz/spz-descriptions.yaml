- source: Alliance_Imported
  text: spatzle (spz) encodes a secreted protein which, after cleavage by an extracellular
    serine protease (encoded by ea or SPE), can induce the dimerization of the product
    of Tl, and the subsequent activation of the Toll pathway. It contributes to function
    of the Toll signaling cascade, which plays a key role in various developmental
    and immune processes, notably embryonic dorso-ventral patterning and regulation
    of antimicrobial peptides.
  source_type: curated
  url: https://flybase.org/reports/spz.html
  source_id: FB:FBgn0003495
