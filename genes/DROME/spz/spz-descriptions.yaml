descriptions:
- source: UniProt
  text: The activated form, spaetzle C-106, acts as a ligand for the Toll receptor
    (PubMed:12872120). Binding to Toll activates the Toll signaling pathway and induces
    expression of the antifungal peptide drosomycin (PubMed:8808632). Component of
    the extracellular signaling pathway that establishes dorsal-ventral polarity in
    the embryo (PubMed:11212919, PubMed:8124709).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48607
  source_id: P48607
