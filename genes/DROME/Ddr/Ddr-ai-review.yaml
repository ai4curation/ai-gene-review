gene_symbol: Ddr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Discoidin domain receptor (Ddr), the single Drosophila member of the DDR receptor family.
  The full-length 1054-residue product is a type I transmembrane receptor with an extracellular discoidin
  (F5/8 type C) domain, a single transmembrane helix and a cytoplasmic tyrosine-kinase-like domain; a
  shorter isoform lacks the transmembrane and kinase regions. Ddr is required in peripheral wrapping glia
  for ensheathment of larval axons, and glial Ddr is needed in adult wing nerves for normal axon caliber
  and long-term survival of sensory neurons. It interacts genetically with the type XV/XVIII collagen
  Multiplexin, which is a candidate ligand, but no ligand has been shown to bind or activate fly Ddr.
  Unlike vertebrate DDR1/DDR2, the dipteran kinase domain lacks the beta3 lysine, catalytic-loop asparagine
  and DFG aspartate, so Ddr is predicted to be a pseudokinase, and the residues forming the vertebrate
  collagen-binding pocket are not conserved.
existing_annotations:
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001245
  review:
    summary: InterPro kinase-domain mapping (IPR001245) to protein kinase activity. Ddr has a full-length
      kinase domain, but the 1054-residue receptor has lost the beta3 lysine, the catalytic-loop asparagine
      and the DFG aspartate, a pattern shared with other dipteran Ddr orthologues.
    action: MARK_AS_OVER_ANNOTATED
    reason: The domain match is real, but the mapping assumes catalytic competence. Alignment with human
      DDR2 shows Ala789 at the beta3 lysine (DDR2 Lys608), Ser897 at the catalytic-loop asparagine (Asn715)
      and Ser910 at the DFG aspartate (Asp728); D. virilis and Anopheles Ddr have the same three losses,
      whereas Tribolium DDR and C. elegans ddr-2 keep all three (the honeybee model keeps two and C. elegans
      ddr-1 one, with a different pattern). Dipteran Ddr is therefore predicted to be a pseudokinase.
      Kinase activity of fly Ddr has never been assayed (PMID:36355066 studied only genetics), so the
      loss is a prediction rather than a measurement; the annotation is marked as an over-annotation instead
      of removed.
    supported_by:
    - &id001
      reference_id: file:DROME/Ddr/Ddr-bioinformatics/RESULTS.md
      supporting_text: D. melanogaster Ddr retains the HRD aspartate but has lost three residues that
        are required for phosphotransfer in canonical protein kinases
    - &id003
      reference_id: file:DROME/Ddr/Ddr-bioinformatics/RESULTS.md
      supporting_text: Dipteran Ddr is therefore predicted to be a pseudokinase
