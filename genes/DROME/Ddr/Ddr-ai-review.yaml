  title: 'Ddr (Q59DZ7) bioinformatics: collagen-pocket and kinase catalytic residues'
  findings:
  - statement: Dipteran Ddr (D. melanogaster, D. virilis, Anopheles) has lost the beta3 lysine, catalytic-loop
      asparagine and DFG aspartate; Tribolium DDR and C. elegans ddr-2 keep all three, the Apis model
      keeps two (no beta3 lysine) and C. elegans ddr-1 one (the catalytic-loop asparagine).
    supporting_text: Dipteran Ddr is therefore predicted to be a pseudokinase
  - statement: The vertebrate DDR collagen-binding pocket residues Trp52 and Asp69 are not conserved in
      fly Ddr or other invertebrate DDRs.
    supporting_text: The pocket that recognises the GVMGFO motif of fibrillar collagens in vertebrates
      is thus not conserved in invertebrates
