core_functions:
- description: Transmembrane receptor of peripheral wrapping glia required for glial ensheathment of axons
    in larval nerves; the extracellular discoidin domain is thought to sense an extracellular-matrix signal
    (Multiplexin is the genetic candidate) but the ligand and the signalling mechanism, given a predicted
    catalytically inactive kinase domain, are unknown.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0032285
    label: non-myelinated axon ensheathment
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:36355066
    supporting_text: Similar phenotypes were observed in Ddr loss-of-function animals and could be rescued
      by resupplying Ddr specifically in wrapping glia, confirming the specificity of our RNAi results.
