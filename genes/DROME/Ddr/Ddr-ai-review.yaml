- id: PMID:36355066
  title: Discoidin domain receptor regulates ensheathment, survival and caliber of peripheral axons.
  findings:
  - statement: An in vivo RNAi screen in peripheral wrapping glia identified Ddr as required for axon
      ensheathment.
    supporting_text: In an in vivo RNA interference screen to identify glial genes required for axon ensheathment,
      we identified the conserved receptor tyrosine kinase Discoidin domain receptor (Ddr).
  - statement: CRISPR null alleles of Ddr are viable; the locus encodes a 1054-aa receptor and a 380-aa
      short isoform lacking the transmembrane and kinase regions.
    supporting_text: 'Ddr encodes two potential isoforms: a short isoform (380 amino acids) that lacks
      transmembrane and kinase domains, and a full-length isoform that encodes a 1054 amino acid protein.'
  - statement: Mutant ensheathment defects are rescued by Ddr expressed only in wrapping glia.
    supporting_text: Similar phenotypes were observed in Ddr loss-of-function animals and could be rescued
      by resupplying Ddr specifically in wrapping glia, confirming the specificity of our RNAi results.
  - statement: In adult wing nerves, loss of Ddr reduces long-term sensory neuron survival and axon caliber
      without overt ensheathment defects.
    supporting_text: In adult nerves, loss of Ddr decreased long-term survival of sensory neurons and
      significantly reduced axon caliber without overtly affecting ensheathment.
  - statement: Ddr and the collagen Multiplexin interact genetically (double heterozygotes); Mp is proposed,
      not shown, to be a Ddr ligand.
    supporting_text: the strong genetic interaction we observed between Ddr and Mp is consistent with
      a model in which Mp acts as a collagen ligand for Ddr during axonal ensheathment
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read (PMC10112903). The only primary study of Drosophila Ddr function.
      Genetic and imaging data only; no biochemistry, no kinase or ligand-binding assay. Supports the
      ensheathment and axon-caliber NEW annotations; does not establish collagen binding or kinase activity.
- id: PMID:20004161
  title: Crystallographic insight into collagen recognition by discoidin domain receptor 2.
  findings:
  - statement: The DDR2 discoidin domain binds collagen through an amphiphilic pocket lined by Trp52,
      Thr56, the Cys73-Cys177 disulfide, Asp69, Arg105, Glu113 and Asn175.
    supporting_text: One wall and the floor of the pocket are essentially apolar (Trp52, Thr56, and Cys73-Cys177
      disulfide bridge), whereas the other wall is dominated by three charged residues (Asp69, Arg105,
      and Glu113) interacting with a string of water molecules.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human DDR2 structure paper; used only as the source of the collagen-pocket residue list
      checked for conservation in fly Ddr.
- id: PMID:37919278
  title: Cross species systems biology discovers glial DDR2, STOM, and KANK2 as therapeutic targets in
    progressive supranuclear palsy.
  findings:
  - statement: RNAi of the fly DDR2 orthologue modified tau neurotoxicity in a Drosophila eye model.
    supporting_text: Nevertheless one of the top prioritized genes DDR2, has congruent findings in Drosophila
      when suppressed with RNAi as in other in vitro and in vivo models
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Disease-model modifier screen; says nothing about normal Ddr function and is not used
      for any annotation.
