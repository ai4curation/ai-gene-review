    summary: PAINT IBA from the receptor tyrosine kinase node PTN001230349 for cell surface receptor protein
      tyrosine kinase signaling pathway.
    action: UNDECIDED
    reason: Fly Ddr is a family member of the receptor tyrosine kinases and is required in wrapping glia,
      alongside EGFR and Heartless, for axon ensheathment, so participation in a receptor-tyrosine-kinase-type
      pathway is plausible. But its kinase domain lacks the catalytic residues, and nothing is known about
