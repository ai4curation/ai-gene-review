  review:
    summary: PAINT IBA from the DDR node PTN002400507 for protein tyrosine kinase collagen receptor activity,
      seeded by human DDR1/DDR2 (IDA) and mouse/rat orthologues.
    action: MODIFY
    reason: 'The term claims three things: a transmembrane receptor, a tyrosine kinase, and collagen as
      ligand. Only the first is supported for fly Ddr. The IBD is sound for vertebrate DDRs, and the target
      is inside the clade, but there is target-specific evidence of divergence: dipteran Ddr has lost
      the beta3 lysine, catalytic-loop asparagine and DFG aspartate (predicted pseudokinase), and the
      vertebrate collagen-binding pocket is not conserved. No collagen has been shown to bind or activate
      fly Ddr; Multiplexin is a genetic candidate only (module collagen_ddr_signaling records this as
      a knowledge gap). The receptor part is supported by the type I transmembrane architecture and by
      the requirement for Ddr within wrapping glia, rescued by glial Ddr. Replace with transmembrane signaling
      receptor activity, which keeps the receptor claim without asserting kinase activity or a collagen
      ligand.'
    proposed_replacement_terms:
