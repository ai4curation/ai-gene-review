- term:
    id: GO:0032285
    label: non-myelinated axon ensheathment
  evidence_type: IMP
  original_reference_id: PMID:36355066
  qualifier: involved_in
  review:
    summary: Ddr is required in Drosophila peripheral wrapping glia for ensheathment of larval axons;
      null mutants and glial RNAi reduce wrapping, and wrapping-glia-specific Ddr rescues the mutant.
    action: NEW
    reason: 'Participation test: Ddr acts in the wrapping glia, the cells that perform the ensheathment,
      and glial re-expression rescues the defect, so it is part of the ensheathing cell machinery rather
      than a substrate or a remote requirement. Fly wrapping glia ensheath axons without myelin, so non-myelinated
      axon ensheathment is the right specificity; GO:0032294 was avoided because its definition is restricted
      to Schwann cells. Comparator: FlyBase annotates other wrapping-glia genes (e.g. bdl, wrapper, fray,
      Nrg) to the parent GO:0008366 axon ensheathment by IMP; this paper has not been curated to GO for
      Ddr.'
    supported_by:
    - reference_id: PMID:36355066
      supporting_text: In an in vivo RNA interference screen to identify glial genes required for axon
        ensheathment, we identified the conserved receptor tyrosine kinase Discoidin domain receptor (Ddr).
    - *id006
    - reference_id: PMID:36355066
      supporting_text: In larval peripheral nerves, loss of Ddr resulted in severely reduced ensheathment
        of axons and reduced axon caliber
- term:
