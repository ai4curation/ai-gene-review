    label: regulation of axon diameter
  evidence_type: IMP
  original_reference_id: PMID:36355066
  qualifier: involved_in
  review:
    summary: Glial Ddr is required for normal caliber of the identified dTSM sensory axon in the adult
      wing nerve, even where ensheathment looks normal.
    action: NEW
    reason: Both whole-animal Ddr mutants and wrapping-glia-specific RNAi reduce dTSM axon caliber by
      up to about 50%, separable from the larval wrapping defect. The effect is non-cell-autonomous (glia
      to axon), which fits a regulation term. Kept out of core functions because the signal from glia
      to axon is unknown.
    supported_by:
    - reference_id: PMID:36355066
      supporting_text: We found that in both glial-specific Ddr knockdown and Ddr whole animal mutant
        nerves the caliber of the dTSM axon was significantly reduced compared with controls
    - reference_id: PMID:36355066
      supporting_text: The reductions in caliber were similar between Ddr mutants and glial-specific DdrRNAi,
        supporting a non-cell-autonomous role for glial Ddr in regulating axon caliber.
