  review:
    summary: PAINT IBA from the DDR node PTN002400507, seeded by human/mouse/rat DDR1 and DDR2 collagen
      binding. No binding of any collagen to fly Ddr has been shown.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The IBD at PTN002400507 is well grounded for vertebrate DDRs, and fly Ddr is inside that
      clade. The question is whether the inherited collagen recognition holds on the dipteran branch.
      Target-specific evidence argues for divergence: the DDR2 residues that line the collagen pocket
      (Trp52, Asp69, Thr56, Asn175) are replaced in fly Ddr (His128, Gly146, Val133, Thr252) and in every
      invertebrate DDR examined, and insects lack the fibrillar collagens that carry the GVMGFO DDR-binding
      motif. The only fly collagen candidate, Multiplexin, comes from a dominant genetic interaction that
      the authors present as a model, not a binding result. Collagen binding is therefore plausible but
      unestablished; not removed because a different binding mode for a non-fibrillar collagen cannot
      be excluded.'
    supported_by:
    - &id004
      reference_id: file:DROME/Ddr/Ddr-bioinformatics/RESULTS.md
      supporting_text: The pocket that recognises the GVMGFO motif of fibrillar collagens in vertebrates
        is thus not conserved in invertebrates
    - &id005
      reference_id: PMID:36355066
      supporting_text: the strong genetic interaction we observed between Ddr and Mp is consistent with
        a model in which Mp acts as a collagen ligand for Ddr during axonal ensheathment
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002400507
        source_status: UNRESOLVED
        comment: The node correctly captures vertebrate DDR1/DDR2 collagen binding; whether it holds for
          dipteran Ddr is unresolved because the vertebrate collagen-binding pocket residues are not conserved
          and no fly binding assay exists.
