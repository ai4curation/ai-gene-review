knowledge_gaps:
- gap_statement: 'The extracellular ligand of Drosophila Ddr is unknown: no collagen or other matrix protein
    has been shown to bind or activate it, and the vertebrate collagen-binding pocket is not conserved.'
  boundary: 'Established: Ddr is required in wrapping glia for larval axon ensheathment and interacts
    genetically (dominantly) with the type XV/XVIII collagen Multiplexin. Not established: any physical
    interaction.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: Decides whether the collagen-DDR pathway exists in insects, and whether the IBA collagen-binding
    annotation holds for the dipteran branch.
  resolution: Binding assays of the Ddr ectodomain with Multiplexin and collagen IV (Col4a1/viking), and
    Ddr phosphorylation or partner recruitment after ligand exposure in S2 cells or glia.
- gap_statement: 'How Ddr signals is unknown: its kinase domain lacks the beta3 lysine, catalytic-loop
    asparagine and DFG aspartate, and no phosphorylation, partner or downstream effector has been identified.'
  boundary: 'Established by sequence: full kinase-like domain with lost catalytic residues, conserved
    in Diptera. Established genetically: Ddr acts in the same glia as EGFR and Heartless, which are each
    required for ensheathment.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: Determines whether Ddr is a scaffold or pseudokinase co-receptor (as ERBB3 is) and which
    pathway terms apply.
  resolution: In vitro kinase and nucleotide-binding assays of the Ddr intracellular domain; rescue of
    Ddr mutants with kinase-domain deletion or with the beta3 Ala reverted to Lys; co-immunoprecipitation
    with EGFR and Heartless from glia.
suggested_questions:
- question: Is Drosophila Ddr a pseudokinase, and does it act as a co-receptor for EGFR or Heartless in
    wrapping glia?
- question: Should the PAINT DDR node PTN002400507 carry an IRD/loss for kinase activity and collagen
    binding on the dipteran branch, given the shared loss of the catalytic lysine, asparagine and DFG
    aspartate?
- question: 'What is the role of the 380-residue extracellular-only Ddr isoform: a decoy receptor or a
    secreted matrix-binding protein?'
suggested_experiments:
- description: Test kinase activity and ATP binding of the purified Ddr intracellular domain (thermal-shift
    with ATP/Mg2+, autophosphorylation), with human DDR1 as positive control.
- description: Test direct binding of the Ddr ectodomain to Multiplexin and to collagen IV, and whether
    Mp increases Ddr tyrosine phosphorylation in cultured cells or glia.
- description: Rescue Ddr nulls in wrapping glia with kinase-domain-deleted Ddr and with a variant restoring
    Lys789, to ask whether the kinase-like domain is needed for ensheathment and axon caliber.
