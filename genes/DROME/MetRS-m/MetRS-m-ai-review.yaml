taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MetRS-m (Aats-met, CG31322) encodes the Drosophila mitochondrial methionyl-tRNA synthetase, the ortholog
  of human MARS2. It is a nuclear-encoded class I aminoacyl-tRNA synthetase with an N-terminal mitochondrial transit
  peptide and the HIGH and KMSKS catalytic motifs, and it uses ATP to attach methionine to mitochondrial tRNA(Met)
  in the mitochondrial matrix, supplying Met-tRNA for initiation and elongation of mitochondrially encoded proteins.
  Hypomorphic missense alleles (V42D, S224L) cause reduced cell proliferation, Complex I deficiency, elevated reactive
  oxygen species, a mitochondrial unfolded protein response, glial lipid droplet accumulation and progressive photoreceptor
  degeneration, and null alleles are lethal; these defects are rescued by fly or human MARS2 cDNA, which established
  MARS2 as the gene mutated in autosomal recessive spastic ataxia with leukoencephalopathy (ARSAL).
