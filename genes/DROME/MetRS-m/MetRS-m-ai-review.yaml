- id: PMID:26761199
  title: The aminoacyl-tRNA synthetases of Drosophila melanogaster.
  findings:
  - statement: MetRS-m (CG31322) is the mitochondrial MetRS, ortholog of MARS2.
    supporting_text: Fly MetRS-m was identified in a screen for genes required for neuronal survival and function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Catalogue review of fly aaRSs; Table lists CG31322 MetRS-m as mitochondrial, MARS2 ortholog. Basis
      of the TAS rows.
- id: PMID:22448145
  title: Mutations in the mitochondrial methionyl-tRNA synthetase cause a neurodegenerative phenotype in flies and
    a recessive ataxia (ARSAL) in humans.
  findings:
  - statement: Aats-met (MetRS-m) is the fly mitochondrial MetRS, 44% identical to MARS2; fly and human cDNAs rescue
      lethality of mutant alleles.
    supporting_text: The fly and human cDNAs rescued the lethality associated with FB/Df and HV/Df, the strongest
      allelic combinations.
  - statement: Mutant mitochondria show reduced Complex I activity, consistent with loss of mitochondrial translation.
    supporting_text: We observed a significant decrease in Complex I activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Genetics, rescue and mitochondrial physiology in flies; no direct enzymatic assay
      of the fly protein; mitochondrial translation measured only in human patient cells.
- id: PMID:25594180
  title: Glial lipid droplets and ROS induced by mitochondrial defects promote neurodegeneration.
  findings:
  - statement: Aats-met mutant clones accumulate glial lipid droplets, an indirect consequence of mitochondrial
      dysfunction.
    supporting_text: Lastly, Aats-met is the Drosophila homolog of mitochondrial methionyl-tRNA synthase 2, or MARS2.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Uses Aats-met as one of several mitochondrial mutants; phenotypic only, no new GO terms justified.
