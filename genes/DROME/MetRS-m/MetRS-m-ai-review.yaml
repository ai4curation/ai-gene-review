suggested_questions:
- question: Does the fly MetRS-m charge the single mitochondrial tRNA(Met) used for both initiation (after formylation)
    and elongation, and do the V42D and S224L substitutions reduce catalytic rate, tRNA affinity or protein stability?
- question: Is mitochondrial translation measurably reduced in Aats-met mutant fly tissue, as it is in ARSAL patient
    cells?
suggested_experiments:
- description: In vitro aminoacylation of transcribed Drosophila mt-tRNA(Met) with recombinant wild-type, V42D and
    S224L MetRS-m to measure kinetic parameters.
- description: 35S-methionine pulse labelling of mitochondrial translation products in Aats-met mutant larvae, with
    rescue by fly and human cDNAs.
