id: P04412
gene_symbol: Egfr
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Egfr encodes the Drosophila epidermal growth factor receptor, a
  plasma-membrane receptor tyrosine kinase activated by EGF-family ligands such
  as Spitz, Gurken, Vein, and Keren. Ligand-dependent Egfr activation signals
  primarily through the Drk/Sos/Ras85D/Raf/Dsor1/Rolled MAPK cascade to control
  embryonic patterning, photoreceptor recruitment, dorsal closure, tracheal
  branching, oogenesis, and other developmental responses.
