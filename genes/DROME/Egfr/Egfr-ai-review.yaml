  id: P04412-1
- name: Type II
  id: P04412-2
  sequence_note: VSP_002897
existing_annotations:
- term:
    id: GO:0001654
    label: eye development
  evidence_type: IMP
  original_reference_id: PMID:14536058
  qualifier: involved_in
  review:
    summary: >-
      Basal plasma membrane localization is a plausible EGFR-family inference, but this seed does not
      expose Drosophila evidence for basal Egfr activity.
    action: UNDECIDED
    reason: >-
      The PAINT row projects basal-plasma-membrane activity from the EGFR-family node, but the seeded
      Drosophila evidence supports plasma membrane generally and an apical receptor pool in imaginal
      discs. Without target-specific basal Egfr evidence in the local cache, this narrower polarity term
      is left undecided.
    supported_by:
    - reference_id: PMID:14536058
      supporting_text: Phospholipid membrane composition affects EGF receptor and Notch signaling
        through effects on endocytosis during Drosophila development.
- term:
    id: GO:0001742
    label: oenocyte differentiation
  evidence_type: IMP
  original_reference_id: PMID:28715417
  qualifier: involved_in
  review:
    summary: >-
      Egfr has been detected in the apical region of imaginal-disc epithelial cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Egfr is a single-pass plasma-membrane receptor as its core localization. The apical plasma membrane
      row is kept as a real but epithelial-context-specific active site rather than as a separate core
      molecular function.
    supported_by:
    - reference_id: PMID:28715417
      supporting_text: A Hox complex activates and potentiates the Epidermal Growth Factor signaling
        pathway to specify Drosophila oenocytes.
- term:
    id: GO:0001751
    label: compound eye photoreceptor cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:16377567
  qualifier: involved_in
  review:
    summary: >-
      Egfr can localize to Drosophila cytonemes in a tissue-specific signaling context.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cytoneme colocalization row is a specific receptor-transport/signaling localization, not the
      general active site for Egfr kinase signaling. It is retained as non-core alongside the broader
      plasma-membrane localization.
    supported_by:
    - reference_id: PMID:16377567
      supporting_text: A microRNA mediates EGF receptor signaling and promotes photoreceptor
        differentiation in the Drosophila eye.
- term:
    id: GO:0002009
    label: morphogenesis of an epithelium
  evidence_type: IMP
  original_reference_id: PMID:9927461
  qualifier: involved_in
  review:
    summary: >-
      Egfr signaling contributes to this Drosophila developmental output, but it is a tissue-specific
      phenotype rather than Egfr's core molecular role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Egfr is a repeatedly used Drosophila receptor tyrosine kinase, so this developmental or stress-response
      phenotype is a valid context-specific output of Egfr signaling. It is kept as non-core because the
      conserved molecular identity of Egfr is ligand-dependent receptor tyrosine kinase activity at the
      plasma membrane, upstream of Ras/MAPK signaling.
    supported_by:
    - reference_id: PMID:9927461
      supporting_text: Identification of genes controlling malpighian tubule and other epithelial
        morphogenesis in Drosophila melanogaster.
