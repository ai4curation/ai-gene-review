  review:
    summary: >-
      The transmembrane receptor protein tyrosine kinase activity assertion is part of Egfr core receptor
      tyrosine kinase signaling biology.
    action: ACCEPT
    reason: >-
      This row captures the conserved core of Drosophila Egfr: ligand-responsive epidermal growth factor
