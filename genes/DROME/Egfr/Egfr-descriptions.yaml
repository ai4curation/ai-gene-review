- source: Alliance_Automated
  text: Enables epidermal growth factor receptor activity. Involved in several processes,
    including compound eye morphogenesis; imaginal disc development; and open tracheal
    system development. Located in plasma membrane. Is active in apical plasma membrane.
    Colocalizes with cytoneme. Is expressed in several structures, including anlage
    in statu nascendi; anterior-posterior subdivision of organism; epithelium; gut
    section; and imaginal disc. Used to study alcohol use disorder; cancer; carcinoma;
    cardiomyopathy; and intestinal cancer. Human ortholog(s) of this gene implicated
    in several diseases, including amyotrophic lateral sclerosis type 19; disease
    of cellular proliferation (multiple); lethal congenital contracture syndrome 2;
    neonatal nephrocutaneous inflammatory syndrome; and neuronal intestinal dysplasia
    type A. Orthologous to several human genes including ERBB4 (erb-b2 receptor tyrosine
    kinase 4).
