- source: RefSeq
  text: Predicted to enable transmembrane receptor protein tyrosine kinase activity.
    Predicted to be involved in several processes, including epidermal growth factor
    receptor signaling pathway; positive regulation of MAPK cascade; and positive
    regulation of epithelial cell proliferation. Predicted to be part of signaling
    receptor complex. Predicted to be active in basal plasma membrane. Is expressed
    in several structures, including anlage in statu nascendi; anterior-posterior
    subdivision of organism; epithelium; gut section; and imaginal disc. Used to study
    alcohol use disorder; cancer; carcinoma; cardiomyopathy; and intestinal cancer.
    Human ortholog(s) of this gene implicated in several diseases, including amyotrophic
    lateral sclerosis type 19; carcinoma (multiple); gastrointestinal system cancer
    (multiple); lung disease (multiple); and reproductive organ cancer (multiple).
    Orthologous to several human genes including ERBB4 (erb-b2 receptor tyrosine kinase
    4). [provided by Alliance of Genome Resources, Jun 2026]
