- source: Alliance_Imported
  text: Epidermal growth factor receptor (Egfr) encodes the transmembrane tyrosine
    kinase receptor for signaling ligands (encoded by grk, spi, vn, and Krn) in the
    TGF&agr; family, which utilises the intracellular MAP kinase pathway. The product
    of Egfr contributes to growth regulation, cell survival and developmental patterning.
