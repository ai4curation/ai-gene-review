- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific.
    Involved in several processes, including insulin receptor signaling pathway; positive
    regulation of catabolic process; and regulation of gene expression. Located in
    cytosol and nucleus. Part of RNA polymerase II transcription regulator complex.
    Is expressed in embryonic/larval crystal cell. Human ortholog(s) of this gene
    implicated in several diseases, including artery disease (multiple); bone disease
    (multiple); lung non-small cell carcinoma; polycythemia (multiple); and type 2
    diabetes mellitus. Orthologous to several human genes including EPAS1 (endothelial
