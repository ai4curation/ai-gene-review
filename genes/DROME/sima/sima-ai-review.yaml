id: Q24167
gene_symbol: sima
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Sima (Similar) is the Drosophila HIF-alpha ortholog, a bHLH-PAS transcription factor that
  heterodimerizes with Tango (HIF-beta/ARNT) to form hypoxia-inducible factor. Sima is constitutively
  transcribed but regulated by oxygen post-translationally: in normoxia the prolyl hydroxylase Fatiga
  hydroxylates its oxygen-dependent degradation domain, leading to dVHL-dependent degradation and CRM1-dependent
  nuclear export, so that Sima is mainly cytoplasmic; in hypoxia it is stabilized, accumulates in the
  nucleus and, with Tango, activates target genes such as the FGF receptor breathless. Insulin/PI3K/TOR
  signaling also promotes Sima accumulation and nuclear localization. HIF/Sima drives hypoxia-induced
  tracheal branching, restrains cell growth when the oxygen sensor is lost, modulates border cell migration,
  promotes aerobic glycolysis in activated macrophages, limits NF-kappaB-dependent immune gene expression,
  and can induce autophagy. sima null flies are viable in normoxia but cannot adapt to hypoxia.'
