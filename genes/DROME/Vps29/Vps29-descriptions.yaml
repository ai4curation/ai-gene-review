descriptions:
- source: UniProt
  text: Component of the commander complex that is essential for endosomal recycling
    of transmembrane cargos; the commander complex is composed of the Csubcomplex
    and the retriever subcomplex. Component of the retriever complex, which is a heterotrimeric
    complex related to retromer cargo-selective complex (CSC) and essential for retromer-
    independent retrieval and recycling of numerous cargos. Component of the retromer
    cargo-selective complex (CSC). The CSC is believed to be the core functional component
    of retromer or respective retromer complex variants acting to prevent missorting
    of selected transmembrane cargo proteins into the lysosomal degradation pathway.
    In the endosomes, retriever complex drives the retrieval and recycling of NxxY-motif-containing
    cargo proteins by coupling to snx17, a cargo essential for the homeostatic maintenance
    of numerous cell surface proteins associated with processes that include cell
    migration, cell adhesion, nutrient supply and cell signaling. The recruitment
    of the retriever complex to the endosomal membrane involves Cand WASH complexes.
