  - reference_id: PMID:32286230
    supporting_text: Vps29 phenotypes are suppressed by reducing Rab7 or overexpressing the GTPase activating
      protein, TBC1D5
suggested_questions:
- question: Does fly Vps29 also act in a retriever (Vps35L-Vps26C-Vps29) complex, and do some Vps29 mutant
    phenotypes reflect loss of retriever rather than retromer?
suggested_experiments:
- description: Test whether Vps29 point mutants that abolish TBC1D5 binding but preserve Vps35 binding
    reproduce the neuronal retromer-mislocalization phenotype of Vps29 nulls.
