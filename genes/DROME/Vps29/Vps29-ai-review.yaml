taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Vps29 (CG4764) is the Drosophila ortholog of VPS29, a small catalytically inactive metallophosphoesterase-fold
  subunit of the retromer cargo-selective complex (Vps35-Vps26-Vps29), which retrieves transmembrane cargo
  from endosomes to the trans-Golgi network or the plasma membrane. Vps29 binds the C-terminal region
  of Vps35 and serves as a platform for regulators such as the Rab7 GAP TBC1D5; by homology it is also
  a subunit of the related retriever complex. In flies Vps29 is dispensable for embryogenesis but required
  for retromer function in adults: without it Vps35 and Vps26 still assemble but retromer is mislocalized
  from the neuropil to neuronal cell bodies together with Rab7, leading to synaptic vesicle endocytosis
  and transmission defects at the neuromuscular junction, retinal degeneration and age-dependent endolysosomal
  dysfunction. In the larval fat body mCherry-Vps29 forms Vps35-dependent puncta that associate mainly
  with Rab4/Rab5 early endosomes, and human VPS29 can substitute for the fly protein.'
