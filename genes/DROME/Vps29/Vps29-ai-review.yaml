core_functions:
- description: As a subunit of the retromer cargo-selective complex, Vps29 contributes to cargo retrieval
    from endosomes and is required for correct retromer localization in neurons, likely by recruiting
    the Rab7 GAP TBC1D5 to limit Rab7 activity.
  contributes_to_molecular_function:
