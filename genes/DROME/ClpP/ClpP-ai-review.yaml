suggested_questions:
- question: Which fly mitochondrial proteins besides DmLRPPRC1 are ClpXP substrates in vivo, and do they
    include unfolded-protein-response triggers?
- question: Is ClpP required for the mitochondrial unfolded protein response in flies, as in C. elegans?
suggested_experiments:
- hypothesis: ClpXP has a restricted set of matrix substrates in fly tissues that includes respiratory-chain
    assembly factors.
  description: Express a catalytically inactive ClpP (S124A) substrate-trap in flight muscle and identify
    trapped proteins by mass spectrometry, then validate candidates by cycloheximide-chase in ClpP mutant
    tissue.
