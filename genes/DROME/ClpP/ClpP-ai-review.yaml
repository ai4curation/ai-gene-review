taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: ClpP (CG5045) encodes the proteolytic subunit of the Drosophila mitochondrial ClpXP protease,
  a member of peptidase family S14. ClpP subunits form a tetradecameric barrel of two heptameric rings
  whose sequestered chamber contains Ser-His-Asp catalytic sites; the AAA+ partner ClpX recognizes, unfolds
  and translocates substrates into the chamber using ATP. In the mitochondrial matrix ClpXP degrades specific
  proteins, including the RNA-binding protein DmLRPPRC1, thereby regulating mitochondrial mRNA levels,
  transcript processing and translation, and it contributes to mitochondrial protein quality control alongside
  the Lon protease.
