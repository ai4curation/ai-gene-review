gene_symbol: Caf1-105
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Caf1-105 (p105) is the middle subunit of Drosophila chromatin assembly factor 1 (CAF-1),
  a heterotrimeric histone H3-H4 chaperone composed of Caf1-180, Caf1-105 and Caf1-55 that deposits newly
  synthesized H3-H4 onto DNA during replication and repair. Caf1-105 is a WD40-repeat protein related
  to yeast Cac2 and human CHAF1B; it binds the large subunit Caf1-180 and directly contacts the H3-H4
  chaperone Asf1, linking the Asf1-bound H3-H4 supply to CAF-1-mediated deposition. A C-terminally truncated
  p75 form exists in separate CAF-1 complexes. Caf1-105 is nuclear and associates with chromatin on polytene
  chromosomes.
