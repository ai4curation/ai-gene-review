- source: Alliance_Imported
  text: Chromatin assembly factor 1, p105 subunit (Caf1-105) encodes one of the three
    subunits of Drosophila chromatin assembly factor 1 (CAF-1). It binds to histones
    and contributes to heterochromatin formation and maintenance, chromatin assembly,
    and developmental signal transduction such the Notch signaling pathway.
