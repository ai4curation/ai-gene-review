taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'twin of eyeless (toy) encodes one of the two Drosophila Pax6 transcription factors, arising
  from an insect-lineage duplication of the ancestral Pax6 gene; Toy is more similar to vertebrate Pax6
  than its paralog Eyeless (Ey). It carries an N-terminal paired domain and a paired-type homeodomain,
  both DNA-binding, and a C-terminal transactivation region, and acts in the nucleus as a sequence-specific
  RNA polymerase II transcription factor. Toy is expressed early in the embryonic head, brain and visual
  primordia and sits at the top of the retinal determination gene network: it directly binds and activates
  the eye-specific enhancer of eyeless, so it is required to initiate ey expression, and ectopic Toy induces
  ectopic eyes largely through Ey. Toy also binds enhancers of sine oculis and the Clock locus. Together
  with ey it is required for growth and development of the entire eye-antennal imaginal disc (strong mutants
  are headless), and it is the principal Pax6 gene for development of the dorsal ocelli, where it initiates
  eyes absent and sine oculis expression with Hedgehog signalling. Toy also contributes to embryonic brain
  patterning and mushroom body development, and regulates Clock expression in circadian pacemaker neurons.'
existing_annotations:
- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:15790965
  qualifier: enables
  review:
    summary: Blanco et al. 2005 assayed the chicken delta1-crystallin DC5 enhancer in Drosophila. Although
      D-Pax2 is the physiological DC5 regulator in cone cells, the full text (checked online; cache is
      abstract-only) shows that His-TOY binds DC5 in EMSA and that Toy with SoxN activates DC5 in S2 cells
      and in vivo, demonstrating sequence-specific DNA-binding transactivation by Toy.
    action: ACCEPT
    reason: Toy is a paired/homeodomain Pax6 transcription factor. This IDA is consistent with independent
      direct evidence that Toy binds and activates the ey eye enhancer (Czerny et al. 1999) and the so10
      enhancer (Punzo et al. 2002). It is the core MF of the gene.
    supported_by:
    - &id009
      reference_id: PMID:15790965
      supporting_text: DC5 contains PAX6 and SOX2 binding sites, and its activity depends on the cooperative
        binding of these two transcription factors
    - &id001
