      supporting_text: Toy functions upstream of ey by directly regulating the eye-specific enhancer of
        ey
    - &id002
      reference_id: PMID:11830564
      supporting_text: both Drosophila Pax6 proteins namely EY and TOY bind and positively regulate so10
        expression through different binding sites
