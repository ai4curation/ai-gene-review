suggested_questions:
- question: Which direct Toy target genes (beyond ey, so and Clk) distinguish its ocellar specification
    role from Ey's compound-eye role, and are they bound via the paired domain or the homeodomain?
- question: Does Toy's regulation of Clock in small ventrolateral neurons represent a conserved Pax6 role
    in circadian neuron specification, warranting a process annotation?
suggested_experiments:
- description: Genome-wide ChIP-seq/CUT&RUN for endogenously tagged Toy versus Ey in embryonic eye primordia
    and late larval eye-antennal discs to define shared and paralog-specific direct targets.
- description: Domain-swap knock-ins exchanging the Toy and Ey C-terminal transactivation regions at the
    endogenous loci to test whether transactivation differences explain ocellar versus compound-eye specialization.
