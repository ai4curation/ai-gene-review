- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific
    and RNA polymerase II transcription regulatory region sequence-specific DNA binding
    activity. Involved in brain development; ocellus development; and regulation of
    gene expression. Predicted to be active in nucleus. Is expressed in several structures,
    including anlage in statu nascendi; embryonic neuromere; head epidermis primordium;
    neuroblasts; and transmedullary neurons. Human ortholog(s) of this gene implicated
    in bilateral optic nerve hypoplasia; eye disease (multiple); glucose intolerance;
    and paranoid schizophrenia. Orthologous to human PAX6 (paired box 6).
  source_type: automated
  url: https://flybase.org/reports/toy.html
