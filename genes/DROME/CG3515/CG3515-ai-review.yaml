    - reference_id: file:DROME/CG3515/CG3515-bioinformatics/RESULTS-rereview.md
      supporting_text: CG3515 is only about 35% identical to either, less similar to the animal WDR82
        proteins than fly Wdr82 is to yeast Swd2.
