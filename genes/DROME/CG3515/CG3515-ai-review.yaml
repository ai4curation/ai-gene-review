  label: Drosophila melanogaster
description: CG3515 is a Swd2/WDR82-family WD-repeat protein inferred to associate with nuclear chromatin
  and the Set1C/COMPASS histone-methylation machinery. It is distinct from the Drosophila Wdr82/CG17293
  paralog. Its precise complex partners and physiological role have not been characterized directly.
