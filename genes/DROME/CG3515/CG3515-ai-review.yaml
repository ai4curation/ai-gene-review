- term:
    id: GO:0016070
    label: RNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028985
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Broad ARBA process assignment with no CG3515-specific basis; the RNA-processing role of the
      family is a yeast CPF-associated function that PAINT did not propagate to this node.
    reason: This row comes from an ARBA machine-learning rule and is very broad. The RNA-related role in
      the family is the yeast Swd2 function in CPF-associated transcription termination and snoRNA/mRNA
      3' end formation (PMID:15024081, PMID:15146080). PAINT propagated chromatin binding and Set1C/COMPASS
      membership from the Swd2/WDR82 node but no RNA-processing term, which should be read as a deliberate
      decision. Transcription regulation through COMPASS would formally fall under RNA metabolism, but
      that would be a downstream consequence of a chromatin complex, not participation in RNA metabolic
      chemistry, and CG3515 has no RNA-related evidence of its own. The term is not demonstrably false,
      so it is marked as an over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:15024081
      supporting_text: "Swd2, an essential WD repeat protein in Saccharomyces cerevisiae, is a component
        of two very different complexes: the cleavage and polyadenylation factor CPF and the Set1 methylase,
        which modifies lysine 4 of histone H3 (H3-K4)."
- term:
    id: GO:0048188
    label: Set1C/COMPASS complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0032030
  - PANTHER:PTN000458398
  - PomBase:SPBC18H10.06c
  - SGD:S000001501
  - UniProtKB:Q6UXN9
  - dictyBase:DDB_G0278945
  review:
    action: ACCEPT
    summary: Phylogenetic inference from the Swd2/WDR82 node, seeded by experimentally characterized
      COMPASS subunits including fly Wdr82; CG3515 itself was not detected in fly Set1 complex purifications
      from S2 cells.
    reason: Set1C/COMPASS membership is the defining, deeply conserved property of the Swd2/WDR82 subfamily
      (yeast Swd2, S. pombe Swd2, human WDR82, fly Wdr82, Dictyostelium donors). CG3515 sits inside that
      subfamily, so the IBA follows from descent. Two caveats are recorded. First, the experimentally
      characterized fly COMPASS subunit is Wdr82 (CG17293, FBgn0032030), which co-purifies with dSet1,
      dCXXC1, dDpy30, dRbbp5, Ash2 and Wds in S2 cells (PMID:21875999); CG3515 is not reported in those
      preparations. Second, CG3515 is highly diverged and testis-biased, so any COMPASS association is
      expected to be a testis-specific variant, which has not been tested. Absence from S2-cell purifications
      is not evidence of loss for a testis-biased protein, so the PAINT inference is retained.
    supported_by:
    - reference_id: PMID:21875999
      supporting_text: MudPIT analysis of dWdr82-FLAG eluate showed the presence of all the homologous
        components of yeast COMPASS and human COMPASS, namely, dSet1, dCXXC1, dDpy30, dRbbp5, Ash2, and
        Wds
    - reference_id: PMID:18838538
      supporting_text: Wdr82, which associates with chromatin in a histone H2B ubiquitination-dependent
        manner, is a specific component of Set1 complexes but not that of MLL1-4 complexes.
    - reference_id: file:DROME/CG3515/CG3515-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR19861:SF0; WD REPEAT-CONTAINING PROTEIN 82; 1.
