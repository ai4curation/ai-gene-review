suggested_questions:
- question: Does CG3515 assemble into a testis-specific Set1/COMPASS variant in place of, or alongside,
    Wdr82 in spermatocytes, or has it acquired a role outside COMPASS?
- question: At what point in insect evolution did the CG3515/Wdr82 duplication occur, and is the CG3515
    lineage testis-biased across Drosophila species?
suggested_experiments:
- description: Affinity purification-mass spectrometry of tagged CG3515 from adult testes, compared with
    tagged Wdr82, to determine whether CG3515 co-purifies with dSet1, dCXXC1, Ash2, Rbbp5, Dpy30 and Wds.
  experiment_type: proteomics
- description: Germline-specific CG3515 knockdown or CRISPR null, assaying spermatocyte H3K4me3 levels
    and male fertility, with Wdr82 knockdown as comparator.
  experiment_type: genetic perturbation
