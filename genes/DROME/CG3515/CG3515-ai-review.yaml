  review:
    action: ACCEPT
    summary: Phylogenetic inference from the Swd2/WDR82 node; CG3515 lies inside PTHR19861:SF0 with
      fly Wdr82 and human WDR82, whose chromatin association is experimentally established.
    reason: The PAINT node PTN000458398 covers the Swd2/WDR82 subfamily, and CG3515 is a member of
      PTHR19861:SF0 together with fly Wdr82 (Q9VLN1) and human WDR82 (Q6UXN9). Mammalian WDR82 associates
      with chromatin in an H2B ubiquitination-dependent manner (PMID:18838538), and the same behaviour
      is described for the yeast and human proteins in the fly COMPASS study (PMID:21875999). CG3515 is
      a strongly diverged paralog (about 35% identity to Wdr82/WDR82, versus 69% between fly Wdr82 and
      human WDR82), which lowers confidence that every family property is retained. However, there is
      no CG3515-specific evidence of loss, and chromatin binding is the broad, family-level property
      PAINT chose to propagate, so the inference is accepted as the best current statement. It is not
      a direct CG3515 assay.
    supported_by:
    - reference_id: PMID:18838538
      supporting_text: Wdr82, which associates with chromatin in a histone H2B ubiquitination-dependent
        manner, is a specific component of Set1 complexes but not that of MLL1-4 complexes.
