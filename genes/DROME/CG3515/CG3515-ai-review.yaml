    reason: CG3515 is a Swd2/WDR82-family WD-repeat protein with a curated ancestral assignment to chromatin
      and Set1C/COMPASS. Characterized WDR82 associates with chromatin and Set1 complexes, providing a
      biological basis for conserved nuclear chromatin-complex function. CG3515 is distinct from the experimentally
      studied fly Wdr82/CG17293 paralog; this is a family-based assignment, not a direct CG3515 localization
      or interaction assay.
