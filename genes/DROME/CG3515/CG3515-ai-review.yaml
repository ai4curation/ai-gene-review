gene_symbol: CG3515
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG3515 encodes a 395-residue WD40-repeat protein of the Swd2/WDR82 family (PANTHER PTHR19861:SF0),
  the family whose members are non-catalytic subunits of Set1/COMPASS H3K4 methyltransferase complexes
  and, in yeast, also act in RNA polymerase II transcription termination. It is a rapidly diverging Drosophila
  paralog of the conserved fly WDR82 ortholog Wdr82 (CG17293), sharing only about 35% identity with
  either fly Wdr82 or human WDR82, and it carries a C-terminal extension absent from those proteins. Its
  expression is strongly testis-biased. By phylogenetic inference it is a nuclear, chromatin-associated
  Set1/COMPASS-type subunit, but it has not been studied directly. The fly Set1/COMPASS complex purified
  from S2 cells contains Wdr82, not CG3515, so whether CG3515 forms a testis-specific variant complex,
  or has another role, is unknown.
