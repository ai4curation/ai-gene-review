suggested_questions:
- question: Does purified Drosophila Tango5, in either the short (Q7KVQ7) or the long (Q9W2S1) form, scramble
    phospholipids in proteoliposomes, and does the disordered N-terminal extension of the long form have
    any function?
- question: Is the increased mitochondria-ER contact seen in vmp1-depleted fly cells due to excess contact
    formation or to a failure to disassemble contacts, and does it require scramblase activity?
- question: Are the secretion and Golgi-ER fusion phenotypes from the S2 screen direct consequences of
    loss of ER lipid scrambling, or secondary to impaired autophagy or ER stress?
suggested_experiments:
- description: Reconstitute purified Tango5 isoforms in NBD-lipid proteoliposomes to measure scramblase
    activity, and test rescue of vmp1(delta) lethality and autophagy with scramblase-dead point mutants
    in the conserved VTT core.
