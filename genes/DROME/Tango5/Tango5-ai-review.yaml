- term:
    id: GO:0007030
    label: Golgi organization
  evidence_type: IMP
  original_reference_id: PMID:16452979
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: In S2 cells, Tango5 depletion causes Golgi membranes to fuse with the ER. The phenotype is
      genuine but probably secondary to its ER membrane role.
    reason: Bard et al. classified Tango5 among the screen genes whose depletion redistributes Golgi membranes
      into the ER (more than 50% of treated cells, according to FlyBase curation of the full text). A PAINT
      curator also propagated Golgi organization at PTN000031591, using the fly experimental annotation
      as a donor. The protein resides in the ER and is inferred to scramble lipids there, so its effect
      on Golgi integrity is best viewed as a consequence of ER membrane homeostasis rather than a core
      activity. Only the abstract is cached, so I defer to the curator on the phenotype.
    supported_by:
    - reference_id: PMID:16452979
      supporting_text: Here we show that depletion of class A genes redistributes Golgi membranes into
        the endoplasmic reticulum
    - reference_id: file:genes/DROME/Tango5/Tango5-flybase.txt
      supporting_text: results in fusion of Golgi membranes with the endoplasmic reticulum in more than
        50% of the treated cells
- term:
    id: GO:0009306
    label: protein secretion
  evidence_type: IMP
  original_reference_id: PMID:16452979
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Tango5 is required for constitutive secretion in S2 cells. This is a screen-level phenotype
      that is probably an indirect effect.
    reason: The genome-wide RNAi screen identified Tango5 as needed for constitutive secretion, and the
      experimental annotation stands. However, the evidence is necessity in a screen. When the PAINT curator
      placed the gene's other experimental process (Golgi organization) on the VMP1 node, protein secretion
      was not propagated, which I treat as a deliberate decision. The likely mechanism is indirect, through
      ER membrane lipid homeostasis and Golgi integrity, so the row is kept as non-core.
    supported_by:
    - reference_id: PMID:16452979
      supporting_text: We performed a genome-wide RNA-mediated interference screen in a Drosophila cell
        line to identify genes required for constitutive protein secretion.
    - reference_id: file:genes/DROME/Tango5/Tango5-flybase.txt
      supporting_text: dsRNA directed against Tango5 inhibits protein secretion in S2 cells
