id: Q7KVQ7
gene_symbol: Tango5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tango5, also called Vmp1, is the Drosophila member of the VMP1 subfamily of DedA/VTT-domain
  multipass membrane proteins and is the ortholog of human VMP1 (PANTHER PTHR10281:SF1). The gene encodes
  a longer and a shorter protein that differ only by a disordered N-terminal extension. The UniProt
  entry Q7KVQ7 is the shorter form, which starts at the internal Met103 of the 530-residue product.
  Endogenously tagged Vmp1 resides in the endoplasmic reticulum membrane. By orthology to VMP1, whose
  reconstituted protein is an ATP- and calcium-independent phospholipid scramblase, Tango5 is inferred
  to equilibrate phospholipids between the two leaflets of the ER membrane. In flies Vmp1 is essential
  for viability. It is required for autophagosome formation and autophagic flux in the larval intestine,
  and acts genetically upstream of Vps13D and Marf in clearing mitochondria and limiting mitochondria-ER
  contact. An RNAi screen in S2 cells also found that its depletion impairs constitutive secretion and
  causes Golgi membranes to fuse with the ER.
