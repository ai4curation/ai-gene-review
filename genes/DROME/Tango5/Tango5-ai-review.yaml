- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    action: ACCEPT
    summary: The 2006 no-data placeholder is superseded by the phylogenetically inferred phospholipid
      scramblase activity.
    reason: >-
      No literature on this gene product, in this species, identifies a function in this
      aspect, so the ND follows the evidence-code guideline and is accepted
      (projects/NO_DATA.md). Inferred rows in the same aspect do not make it stale.
      Earlier action MODIFY, because: The ND row records that FlyBase had no data on
      molecular function in 2006. Since then, reconstitution of human VMP1 has
      established phospholipid scramblase activity. A PAINT curator placed that function
      at PTN000031590, a node whose descendants include the fly Tango5 product Q9W2S1,
      which is in the same PANTHER subfamily (PTHR10281:SF1) as VMP1. Q7KVQ7 contains
      the entire conserved membrane core of Q9W2S1, so the placeholder should be
      replaced by the specific inferred activity. The proposed term now sits on its own
      NEW row.
    nd_case: INFERABLE
- term:
    id: GO:0005774
    label: vacuolar membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0271
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The vacuolar-membrane location comes from the historical family name, not from any localization
      of the fly protein.
    reason: The UniProt SubCell line behind this row is an ARBA prediction. It traces to the name "vacuole
      membrane protein 1", which was given to the rodent protein because it is induced during pancreatitis-associated
      vacuolization. Endogenously GFP-tagged fly Vmp1 co-localizes with the ER markers Sec61beta and
      SERCA, and no fly data place it on vacuoles or lysosomes. A minor endolysosomal pool cannot be excluded,
      but this term overstates what is known.
    supported_by:
    - reference_id: PMID:34019822
      supporting_text: GFP-Vmp1 co-localizes with the ER markers Sec61β and SERCA in intestine cells
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:16452979
  qualifier: located_in
  review:
    action: MODIFY
    summary: Tango5 is in the ER, and more precisely it is an integral ER membrane protein.
    reason: The direct-assay ER localization from the Bard et al. secretion screen is correct. It is confirmed
      by the co-localization of endogenous GFP-Vmp1 with Sec61beta and SERCA in fly intestine. Tango5
      is a multipass protein with an intact VMP1/DedA membrane core, so the specific supported location
      is the ER membrane (GO:0005789), which is where the inferred scramblase acts.
    proposed_replacement_terms:
