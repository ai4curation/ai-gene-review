taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: skl encodes Sickle, a short Drosophila RHG-region IAP antagonist. Its exposed N-terminal IAP-binding motif
  binds BIR domains in DIAP1 and DIAP2 and thereby relieves IAP-mediated caspase inhibition, allowing apoptotic caspase
  activation together with Reaper, Hid, and Grim. Sickle is induced in several developmental and genotoxic contexts and
  usually acts as a potentiating RHG factor rather than as a lone death trigger, including Tao-1-dependent potentiation of
  Hid in Nanos-deficient pole cells and a minor, backup role alongside Grim in metamorphic corazonergic-neuron death.
