core_functions:
- description: Sickle uses its N-terminal IAP-binding motif to bind DIAP1 and DIAP2 BIR domains, neutralize IAP-mediated
    caspase inhibition, and promote apoptotic caspase activation as part of the Drosophila RHG/IAP-antagonist signaling
    module.
  molecular_function:
    id: GO:1990525
    label: BIR domain binding
  directly_involved_in:
  - id: GO:0097190
    label: apoptotic signaling pathway
  supported_by:
  - reference_id: PMID:11818063
    supporting_text: The above data indicate that Skl is a bona fide IAP binding protein and that its interactions with
      IAPs are mediated by its N-terminal IBM
  - reference_id: PMID:11818063
    supporting_text: Skl, like Smac/DIABLO, is able to disrupt the interaction of caspases with IAPs to promote caspase
      activation
  - reference_id: PMID:11818065
    supporting_text: the N terminus of this protein specifically bound to the BIR2 domain of DIAP1
    reference_section_type: ABSTRACT
