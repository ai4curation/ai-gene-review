suggested_questions:
- question: Should FlyBase add an experimental `BIR domain binding` assertion for Sickle from the DIAP1-BIR2 structural
    and binding data, mirroring the more specific BIR-domain annotations on other Drosophila RHG proteins?
- question: Which endogenous apoptotic tissues require Sickle uniquely rather than as a potentiator of Grim, Hid, or
    Reaper?
suggested_experiments:
- description: Use CRISPR replacement at the endogenous skl locus to compare a clean null with N-terminal IBM point
    mutants in pole-cell, vCrz-neuron, embryonic CNS, and genotoxic-stress apoptosis assays; quantify DIAP1 occupancy,
    active DrICE/Dcp-1, and genetic synergy with grim, hid, and rpr.
- description: Image a functional endogenously tagged Sickle protein during damage-induced and developmental apoptosis
    to determine whether Sickle remains cytosolic, concentrates at DIAP1/caspase complexes, or uses a distinct subcellular
    pool from Reaper/Grim GH3-family mitochondrial antagonists.
