    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: B' PP2A subunit regulating insulin and Akt signalling is in the
      review; the Hedgehog role is not. Meiotic cohesion and Hippo roles are missing.
- source: Alliance_Automated
  text: Predicted to enable protein phosphatase activator activity. Involved in several
    processes, including determination of adult lifespan; negative regulation of lipid
    storage; and regulation of signal transduction. Predicted to be located in nucleoplasm.
    Predicted to be part of protein phosphatase type 2A complex. Predicted to be active
    in cytosol and nucleus. Is expressed in several structures, including adult head;
    cuboidal/columnar epithelium; embryonic/larval proventriculus; gastric caecum;
    and larval central nervous system. Orthologous to several human genes including
    PPP2R5E (protein phosphatase 2 regulatory subunit B'epsilon).
