descriptions:
- source: Alliance_Imported
  text: widerborst (wdb) encodes a B' regulatory subunit of the serine/threonine phosphatase
    complex PP2A. It regulates Hedgehog, protein kinase B and insulin receptor signaling
    pathways.
  source_type: curated
  url: https://flybase.org/reports/wdb.html
  source_id: FB:FBgn0027492
