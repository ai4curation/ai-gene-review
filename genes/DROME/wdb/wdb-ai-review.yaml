taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: widerborst (wdb) encodes one of the two Drosophila B56 (B', PR61) family regulatory subunits
  of protein phosphatase 2A (the other is well rounded, wrd). Wdb assembles with the scaffold Pp2A-29B
  and the catalytic subunit Microtubule star into a PP2A-B56 holoenzyme and directs it to particular substrates
  and locations. In female meiosis PP2A-B56 is recruited to centromeres by BubR1, MEI-S332 and SPC105R
  and, partly redundantly with Wrd, maintains sister chromatid cohesion, stabilizes end-on kinetochore-microtubule
  attachments, sustains metaphase I arrest and, together with PP2A-B55, balances Aurora B activity on
  the acentrosomal spindle. Wdb-containing PP2A also acts in planar cell polarity, in insulin/PI3K/TOR
  signaling upstream of TOR in starvation-induced autophagy, and upstream of Salvador and Rassf in Hippo
  pathway regulation of the eye disc.
