  review:
    summary: Meiotic spindle assembly (author statement).
    action: MODIFY
    reason: The paper shows that PP2A-B55 and PP2A-B56 antagonize the Aurora B spindle-assembly activity,
      i.e. they regulate (restrain) oocyte spindle assembly rather than build the spindle; regulation
      of spindle assembly (GO:0090169) captures the role without asserting direct participation.
    proposed_replacement_terms:
