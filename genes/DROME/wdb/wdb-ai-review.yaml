suggested_questions:
- question: Which of the three proposed oocyte PP2A-B56 pools (two SPC105R-dependent, one spindle-associated)
    uses Wdb versus Wrd, and do the paralogs differ in substrate choice or only in expression?
suggested_experiments:
- hypothesis: Wdb and Wrd provide distinct SPC105R-dependent B56 pools in oocytes.
  description: Combine germline-specific wdb and wrd knockdowns with SPC105R and BubR1 domain mutants,
    then measure centromeric B56 levels, cohesion and end-on attachment frequency in metaphase I oocytes.
  experiment_type: germline RNAi with kinetochore mutants
