- term:
    id: GO:0003015
    label: heart process
  evidence_type: IMP
  original_reference_id: PMID:20523889
  qualifier: involved_in
  review:
    summary: Rhomboid-3-dependent activation of the Spitz-EGFR pathway is required for adult heart
      function.
    action: KEEP_AS_NON_CORE
    reason: The adult cardiac phenotype is a real physiological output of the Rho/Spi/EGFR pathway,
      but it is a tissue-specific role downstream of the secreted ligand activity.
    supported_by:
