id: Q01083
gene_symbol: spi
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  spi encodes Spitz, a Drosophila EGF-family ligand synthesized as a
  membrane-tethered precursor in the secretory pathway. After Star-dependent
  trafficking and Rhomboid-dependent intramembrane proteolysis, processed Spitz
  is released to bind and activate the EGF receptor in neighboring cells. Spitz
  drives EGFR/Ras/MAPK signaling during embryonic ectoderm patterning,
  photoreceptor recruitment, glial migration, muscle development, and other
  local inductive events.
