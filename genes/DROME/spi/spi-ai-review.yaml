- term:
    id: GO:0001713
    label: ectodermal cell fate determination
  evidence_type: IMP
  original_reference_id: PMID:7601354
  qualifier: involved_in
  review:
    summary: Secreted Spitz is required in a ventral-ectoderm EGFR patterning context.
    action: KEEP_AS_NON_CORE
    reason: This is a genuine developmental output of the Spi-EGFR ligand pathway, but ectodermal
      fate determination is a context-specific embryonic role rather than the core molecular
      function of Spitz.
    supported_by:
