    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15329724
  qualifier: enables
  supporting_entities:
  - FB:FBgn0004569
  review:
    summary: The Argos-Spitz interaction is real, but generic protein binding is not an informative
      Spi molecular function.
    action: REMOVE
    reason: This IPI row reflects Argos sequestration of the Spitz ligand. That interaction
      modulates signaling extracellularly, but GO:0005515 says only that two proteins bind and loses
      the specific biology; there is no more specific Argos-binding MF term to substitute here.
    supported_by:
    - reference_id: PMID:15329724
      supporting_text: "Argos binds tightly to the EGF motif of Spitz and\nforms a 1:1 (Spitz:Argos) complex"
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18500331
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q00805
  review:
    summary: The crystal structure establishes an Argos-Spitz complex, but generic protein binding
      is not an informative Spi molecular function.
    action: REMOVE
    reason: The paper defines how Argos clamps Spitz to sequester an EGFR ligand. That is a real
      protein-protein interaction, but the bare GO:0005515 annotation is too generic and should not
      be retained as a functional assertion for Spi.
    supported_by:
    - reference_id: PMID:18500331
      supporting_text: Argos bound to an EGFR ligand
