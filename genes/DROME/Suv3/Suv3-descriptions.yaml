descriptions:
- source: UniProt
  text: Major helicase player in mitochondrial RNA metabolism and maintenance (PubMed:26152302).
    Likely component of the mitochondrial degradosome (mtEXO) complex, that degrades
    3' overhang double-stranded RNA with a 3'-to-5' directionality in an ATP-dependent
    manner (By similarity). ATPase and ATP-dependent multisubstrate helicase, able
    to unwind double-stranded (ds) DNA and RNA, and RNA/DNA heteroduplexes in the
    5'-to-3' direction (By similarity). Regulates mRNA stability and is required for
    the correct processing and maturation of mitochondrial transcripts (PubMed:26152302).
  source_type: curated
