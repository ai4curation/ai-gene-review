id: Q9VN03
gene_symbol: Suv3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Suv3 (CG9791) is the Drosophila ortholog of the mitochondrial Ski2-like DExH-box RNA helicase
  SUPV3L1. It is an ATP-dependent helicase that resides in mitochondria and, with polynucleotide phosphorylase
  (PNPase), forms the mitochondrial degradosome that degrades mitochondrial mRNAs and antisense transcripts.
  Independently of PNPase, Suv3 is required for efficient processing of polycistronic mitochondrial transcripts,
  so its loss depletes mitochondrial tRNAs, accumulates precursor RNAs and mRNAs, reduces mitochondrial
  translation and respiratory chain activity, and causes lethality.
