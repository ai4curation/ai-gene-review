  label: Drosophila melanogaster
description: 'GatA (CG6007; formerly benedict, bene) encodes the A subunit of the mitochondrial glutamyl-tRNA(Gln)
  amidotransferase (GatCAB). Mitochondria lack a glutaminyl-tRNA synthetase, so mitochondrial tRNA(Gln)
  is first charged with glutamate and then converted by GatCAB to Gln-tRNA(Gln). GatA is the amidase-family
  glutaminase subunit: it hydrolyses glutamine and channels the released ammonia to GatB, which activates
  the misacylated glutamate by phosphorylation and amidates it. The complex is required for synthesis
  of Gln-tRNA(Gln) used in mitochondrial translation. GatA is mitochondrial, and bene/gatA mutations,
  recovered in a genetic screen for nuclear genes with mitochondrial function, cause growth defects in
  mitotic and endoreplicating tissues.'
