descriptions:
- source: UniProt
  text: Catalytic subunit of the mitochondrial Glu-tRNA(Gln) amidotransferase complex
    GatCAB. GatCAB allows the formation of correctly charged Gln-tRNA(Gln) through
    the transamidation of misacylated Glu-tRNA(Gln) in the mitochondria. The reaction
    takes place in the presence of glutamine and ATP through an activated gamma- phospho-Glu-tRNA(Gln).
    This subunit probably catalyzes the hydrolysis of the amido donor Gln, releasing
    ammonia that is sequestered within a channel in the GatCAB complex and made available
    to subunit B for downstream aminolysis of Glu-tRNA(Gln).
  source_type: curated
