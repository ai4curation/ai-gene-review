    overall_notes: Names four UDP-sugars; UDP-glucuronate and UDP-GlcNAc are core,
      but UDP-glucose transport is contested in the review (a NOT annotation from
      Selva et al.). Downstream proteoglycan and Notch roles not mentioned.
- source: Alliance_Automated
  text: Enables antiporter activity and pyrimidine nucleotide-sugar transmembrane
    transporter activity. Involved in several processes, including imaginal disc development;
    pyrimidine nucleotide-sugar transmembrane transport; and segment polarity determination.
    Located in Golgi medial cisterna. Is expressed in adult fat body and adult head.
    Human ortholog(s) of this gene implicated in schneckenbecken dysplasia. Orthologous
    to several human genes including SLC35D1 (solute carrier family 35 member D1).
  source_type: automated
