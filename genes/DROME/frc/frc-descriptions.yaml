- source: Alliance_Imported
  text: fringe connection (frc) encodes a multifunctional Golgi nucleotide sugar transporter
    that imports UDP-D-glucuronate, UDP-N-acetylglucosamine, UDP-D-glucose and UDP-N-acetylgalactosamine
    from the cytosol into the Golgi lumen.
