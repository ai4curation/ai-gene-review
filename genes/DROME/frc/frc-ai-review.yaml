id: Q95YI5
gene_symbol: frc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: fringe connection (frc; UST74c) encodes a Golgi-localized multi-pass nucleotide-sugar transporter
  of the TPT/SLC35D subfamily, related to C. elegans SQV-7 and human SLC35D1. Frc imports UDP-glucuronic
  acid and UDP-N-acetylglucosamine (and possibly UDP-xylose) from the cytosol into the Golgi lumen as
  an antiporter that can exchange UDP-sugars for UMP or UDP. It supplies the sugar donors for heparan
  sulfate and chondroitin sulfate chain synthesis and for Fringe-mediated GlcNAc elongation of O-fucose
  on Notch. frc mutants therefore show defects in Wingless, Hedgehog and FGF signaling and in both Fringe-dependent
  and Fringe-independent Notch signaling, with segment polarity, wing and eye patterning phenotypes.
