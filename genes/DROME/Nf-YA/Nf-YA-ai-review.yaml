id: Q9VSY9
gene_symbol: Nf-YA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nf-YA is the sequence-specific DNA-binding subunit of the Drosophila CCAAT-binding factor
  NF-Y, a conserved heterotrimer of NF-YA with the histone-fold heterodimer NF-YB/NF-YC. Its C-terminal
  NFYA/HAP2 domain contacts the CCAAT box while the NF-YB/NF-YC dimer contacts flanking DNA, and all three
  subunits are required for complex formation and DNA binding. Drosophila NF-Y binds CCAAT boxes in promoters
  such as sevenless and debcl and is required for their expression; it is needed for R7 photoreceptor
  differentiation and its misexpression perturbs eye disc specification.
