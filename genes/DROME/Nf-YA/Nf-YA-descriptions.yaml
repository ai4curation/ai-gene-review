  text: Enables transcription cis-regulatory region binding activity. Contributes
    to sequence-specific DNA binding activity. Involved in R7 cell differentiation
    and positive regulation of DNA-templated transcription. Part of CCAAT-binding
    activity factor complex. Is expressed in embryonic brain and larval ventral nerve
    cord. Orthologous to human NFYA (nuclear transcription factor Y subunit alpha).
