      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: retromer component recycling membrane proteins to the
      Golgi or plasma membrane. No Wntless or synaptic roles.'
- source: Alliance_Automated
  text: Enables cargo receptor activity and small GTPase binding activity. Involved
    in several processes, including endosomal transport; positive regulation of cell
    communication; and response to rotenone. Located in late endosome; presynaptic
    active zone; and subsynaptic reticulum. Is active in several cellular components,
    including dopaminergic synapse; early endosome; and presynaptic endocytic zone.
    Is expressed in several structures, including adult head; adult heart; anterior
    endoderm; anterior endoderm anlage; and embryonic/larval midgut primordium. Used
    to study Parkinson's disease and brain cancer. Human ortholog(s) of this gene
    implicated in Parkinson's disease and Parkinson's disease 17. Orthologous to human
    VPS35 (VPS35 retromer complex component).
  source_type: automated
