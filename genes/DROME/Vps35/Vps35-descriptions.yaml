descriptions:
- source: Alliance_Imported
  text: Vacuolar protein sorting 35 (Vps35) encodes a component of the retromer complex
    that acts to recycle membrane proteins to the Golgi or plasma membrane from endocytosed
    vesicles.
  source_type: curated
  url: https://flybase.org/reports/Vps35.html
  source_id: FB:FBgn0034708
