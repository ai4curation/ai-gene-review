id: Q9W277
gene_symbol: Vps35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps35 (CG5625) is the Drosophila ortholog of VPS35, the large alpha-solenoid backbone subunit
  of the retromer cargo-selective complex, which binds Vps26 at its N-terminal region and Vps29 at its
  C-terminal region. Recruited to endosomes by Rab GTPases and sorting nexins, the Vps35-Vps26-Vps29 trimer
  recognizes transmembrane cargo and retrieves it to the trans-Golgi network or recycles it to the plasma
  membrane, sparing it from lysosomal degradation. In flies Vps35 is required to retrieve the Wnt cargo
  receptor Wntless to the Golgi and hence for Wingless (but not Hedgehog) secretion, to recycle the luminal
  protein Serpentine via Rab9-positive late endosomes in the trachea, and to retrieve Notch in neural
  progenitors. Vps35 loss also impairs endocytosis, synaptic vesicle recycling at the neuromuscular junction
  and dopaminergic transmission, and it interacts genetically with the Parkinson's disease kinase LRRK2.
  At larval neuromuscular junctions Vps35 is present pre- and postsynaptically and limits loading of APP-like
  cargo into extracellular vesicles.
