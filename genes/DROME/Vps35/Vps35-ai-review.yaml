core_functions:
- description: As the backbone of the retromer cargo-selective complex, Vps35 contributes to recognition
    of transmembrane cargo such as Wntless, Notch and Serpentine on early and Rab9-positive late endosomes,
    and to their retrieval to the trans-Golgi network or recycling to the cell surface.
