core_functions:
- description: olf413 is a membrane-anchored copper type II ascorbate-dependent monooxygenase of the MOXD1
    subfamily, related to Tbh, whose physiological substrate is unknown; loss of olf413 reduces octopamine
    levels and disrupts embryonic motor axon growth and pathfinding.
  molecular_function:
    id: GO:0016715
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
