    supporting_text: olf413 has been annotated as a protein coding gene with predicted copper type II
      ascorbate-dependent monooxygenase domain, tyramine/dopamine beta- hydroxylase signature domains
    reference_section_type: DISCUSSION
  - reference_id: file:DROME/olf413/olf413-deep-research-falcon.md
    supporting_text: decreased octopamine in a mutant demonstrates a pathway association, not that purified
      Olf413 converts tyramine directly into octopamine
  knowledge_gaps:
  - gap_statement: The substrate and reaction of olf413 are unknown. It is unresolved whether olf413 hydroxylates
      tyramine (contributing directly to octopamine synthesis), acts on another amine or peptide substrate,
      or reduces octopamine indirectly through effects on neuronal development.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does recombinant olf413 hydroxylate tyramine or dopamine in vitro, and does it bind copper
    like Tbh?
- question: In which membrane compartment (ER, secretory vesicles, plasma membrane) does olf413 reside?
suggested_experiments:
- description: Express and purify the olf413 luminal domain and assay ascorbate-dependent hydroxylation
    of tyramine, dopamine and other phenylethylamines, alongside Tbh as a positive control.
- description: Measure octopamine and tyramine in Tbh; olf413 double mutants and in olf413 mutants rescued
    with a catalytically dead olf413 (copper-ligand His mutations) to distinguish direct from indirect
    effects.
