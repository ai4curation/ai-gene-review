- term:
    id: GO:0004836
    label: tyramine-beta hydroxylase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000016555
  - WB:WBGene00006541
  review:
    summary: Tyramine-beta hydroxylase activity inferred from an ecdysozoan node (PTN000016555) seeded
      only by C. elegans tbh-1.
    action: UNDECIDED
    reason: 'The question is node placement. PAINT asserted tyramine beta-hydroxylase activity at an ecdysozoan
      node (PTN000016555) whose descendants include olf413, whereas Drosophila Tbh inherits the activity
      from a separate protostome TBH node (PTN002562791). olf413 belongs to the MOXD1-homolog subfamily
      (PTHR10157:SF40), a paralogous lineage to the DBH/TBH subfamily that contains Tbh (SF29), and MOXD1-subfamily
      members have no demonstrated substrate. Target-specific evidence also argues against inheritance
      of the TBH role: Tbh null flies are reported to be octopamine-less, so olf413 cannot substitute
      for Tbh, and olf413 mutants show only reduced octopamine with no enzymatic assay. Both this IBA
      and the FlyBase ISS were curated recently (2025), so this is a deliberate call we cannot overturn
      without biochemistry; UNDECIDED.'
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000016555
        source_status: UNRESOLVED
        comment: Ecdysozoan node seeded only by worm tbh-1; olf413 is in the MOXD1-homolog subfamily,
