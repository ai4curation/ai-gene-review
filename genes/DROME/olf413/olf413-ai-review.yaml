  label: Drosophila melanogaster
description: olf413 (MOXD1 homolog 2) encodes a membrane-anchored member of the copper type II ascorbate-dependent
  monooxygenase family in Drosophila melanogaster, related to tyramine beta-hydroxylase (Tbh) and to mammalian
  dopamine beta-hydroxylase and MOXD1. It carries the DOMON domain and the two copper monooxygenase domains
  characteristic of the family, flanked by N-terminal and C-terminal hydrophobic segments. Its substrate
  has not been determined biochemically. olf413 is expressed in the embryonic ventral nerve cord, peripheral
  nervous system and somatic muscles, and loss-of-function mutants show reduced head octopamine levels,
  embryonic lethality, and defects in motor axon growth, branching and pathfinding.
