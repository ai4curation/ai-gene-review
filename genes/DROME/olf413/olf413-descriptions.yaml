      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: States it is a putative tyramine beta hydroxylase converting tyramine
      to octopamine. The review keeps the substrate unknown and records only reduced
      octopamine levels in mutants; motor axon guidance is not mentioned.
- source: Alliance_Automated
  text: Predicted to enable tyramine-beta hydroxylase activity. Involved in octopamine
    biosynthetic process. Predicted to be located in membrane. Predicted to be active
    in extracellular region and secretory granule membrane. Is expressed in several
    structures, including adult brain cell body rind; adult head; central brain primordium;
    dorsal ectoderm; and ganglia. Orthologous to human MOXD1 (monooxygenase DBH like
    1).
  source_type: automated
