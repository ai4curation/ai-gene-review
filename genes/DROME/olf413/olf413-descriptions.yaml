descriptions:
- source: Alliance_Imported
  text: olf413 encodes a putative tyramine &bgr; hydroxylase that is predicted to
    catalyze the conversion of tyramine to octopamine. It is involved in octopamine
    synthesis.
  source_type: curated
  url: https://flybase.org/reports/olf413.html
  source_id: FB:FBgn0037153
