  review:
    action: UNDECIDED
    summary: Nuclear localization is shown for the human SF43 ortholog under stress, but not for native
      fly TyrRS; the UniProt location line rests on an ARBA rule.
    reason: Human YARS1, in the same PANTHER subfamily, translocates to the nucleus on serum starvation,
      heat shock or ER stress (PMID:25533949), and the lysine-rich segment that lies in the human nuclear-entry
      region is conserved in the fly protein. However, no study has localized endogenous fly TyrRS to the
      nucleus (fly CMT-model nuclear data use transgenic human YARS1), PAINT did not propagate the human
      nuclear annotations from PTN000236303, and the UniProt subcellular-location statement is ARBA-derived.
      The evidence neither establishes nor refutes a nuclear pool of the fly protein.
    supported_by:
