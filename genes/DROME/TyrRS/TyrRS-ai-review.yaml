id: Q9VV60
gene_symbol: TyrRS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: TyrRS is the cytoplasmic tyrosyl-tRNA synthetase of Drosophila melanogaster. It charges tRNA(Tyr)
  through an ATP-dependent aminoacyl-adenylate intermediate, supplying tyrosine for protein synthesis.
  During cell competition, loser cells secrete TyrRS through a JNK- and Kish-dependent mechanism. Extracellular
  proteolysis produces an EMAP fragment that attracts haemocytes for removal of dying cells. Fly S2 cells
  also secrete TyrRS after serum deprivation. The gene encodes a 525-residue polypeptide distinct from
  mitochondrial TyrRS-m.
