suggested_questions:
- question: Does endogenous fly TyrRS enter the nucleus under stress, as human YARS1 does, given that the
    lysine-rich segment of the human nuclear-entry region is conserved?
- question: What haemocyte receptor mediates the response to the EMAP fragment of secreted fly TyrRS?
suggested_experiments:
- description: Endogenously tag TyrRS by CRISPR knock-in and image its distribution in imaginal discs
    and fat body under heat shock, ER stress and nutrient deprivation, to test for a nuclear pool of the
    native protein.
- description: Express a non-cleavable TyrRS variant in loser cells to test whether MMP processing is
    required for haemocyte recruitment.
