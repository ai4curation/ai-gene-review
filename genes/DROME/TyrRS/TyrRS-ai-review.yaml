- term:
    id: GO:0006950
    label: response to stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026300
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: ARBA-derived stress-response term; for native fly TyrRS the stress-associated evidence is
      that the protein is released, not that it performs a step of a stress response.
    reason: The ARBA rule reflects the vertebrate stress-induced nuclear TyrRS-PARP1 mechanism (PMID:25533949),
      which PAINT did not propagate from the SF43 node and which has not been tested for the fly protein.
      In flies, TyrRS is secreted by apoptotic loser cells and by serum-deprived S2 cells (PMID:26658841);
      in those settings TyrRS is the secreted cargo whose extracellular fragment then signals to haemocytes,
      which is captured by the chemoattractant and extracellular-region annotations. Being released under
      a stress condition does not show that TyrRS does any of the work of a cellular stress response,
      so neither this term nor its descendant response to starvation is proposed for the fly gene.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-ncomms10022.txt
      supporting_text: presence of secreted TyrRS-HA in the supernatant 24 h after serum deprivation
    - reference_id: PMID:25533949
      supporting_text: Either serum starvation or RSV treatment promoted nuclear translocation of endogenous
        TyrRS in HeLa cells
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:26658841
  review:
    action: NEW
    summary: Endogenous TyrRS is detected outside loser cells in wing discs and in larval haemolymph during
      cell competition.
    reason: Direct fly evidence (endogenous TyrRS extracellular staining and haemolymph immunoblots, with
      Kish- and JNK-dependence) establishes a regulated extracellular pool in addition to the cytoplasmic
      enzyme. This location is conditional, not the steady-state site of the core activity.
    supported_by:
    - reference_id: PMID:26658841
      supporting_text: JNK signalling and Kish, a component of the secretory pathway, are autonomously required
        for the active secretion of TyrRS by the loser cells
    - reference_id: file:DROME/TyrRS/TyrRS-ncomms10022.txt
      supporting_text: endogenous TyrRS in haemolymph of larvae with or without cell competition
- term:
    id: GO:0042056
    label: chemoattractant activity
  evidence_type: IDA
  original_reference_id: PMID:26658841
  review:
    action: NEW
    summary: Secreted TyrRS, after MMP cleavage, releases an EMAP fragment that attracts haemocytes and
      activates PI3K in them.
    reason: The fly paper shows that secreted TyrRS and its EMAP fragment attract haemocytes in larvae
      and trigger a PI3K-activity reporter in them; TyrRS itself supplies the signalling moiety, so this
      is the product doing the work rather than serving as cargo. The haemocyte receptor is unknown. The
      activity is a conditional, non-core function of the processed extracellular protein and is supported
      by fly-specific evidence, not by transfer from the human cytokine data.
    supported_by:
    - reference_id: PMID:26658841
      supporting_text: EMAP acts as a guiding cue for macrophage migration in the Drosophila larvae, as
        it attracts the haemocytes to the apoptotic loser cells
    - reference_id: file:DROME/TyrRS/TyrRS-ncomms10022.txt
      supporting_text: The extracellular TyrRS is then capable of activating PI3K in haemocytes acting
        as a chemoattractant
