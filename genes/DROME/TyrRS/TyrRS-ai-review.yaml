gene_symbol: TyrRS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: TyrRS (CG4561, Aats-tyr) is the cytoplasmic tyrosyl-tRNA synthetase of Drosophila melanogaster,
  a class-I aminoacyl-tRNA synthetase of 525 residues and the fly ortholog of human YARS1 (68% identity;
  both in PANTHER subfamily PTHR11586:SF43). It activates L-tyrosine with ATP to form tyrosyl-adenylate
  and transfers the tyrosyl group to cytoplasmic tRNA(Tyr), supplying Tyr-tRNA(Tyr) for cytoplasmic protein
  synthesis; mitochondrial tRNA(Tyr) is charged by the separate TyrRS-m enzyme. The protein has an N-terminal
  Rossmann-fold catalytic domain with the class-I HIGH and KMSSS signatures, an anticodon-recognition region,
  and a C-terminal EMAP-II-like tRNA-binding domain. Outside translation, apoptotic loser cells in imaginal
  discs undergoing cell competition actively secrete TyrRS through a JNK- and Kish-dependent route; extracellular
  matrix metalloproteinase cleavage yields MiniTyr and EMAP fragments, and EMAP acts as a chemoattractant
  that activates PI3K in haemocytes and guides them to the dying cells. Cultured S2 cells also release
  TyrRS after serum deprivation. Fly TyrRS has been used to model YARS1-associated dominant-intermediate
  Charcot-Marie-Tooth neuropathy, where disease variants act through a gain of function rather than loss
  of aminoacylation.
