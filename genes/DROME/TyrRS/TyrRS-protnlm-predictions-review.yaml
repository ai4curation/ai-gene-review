  source_reference_id: file:DROME/TyrRS/TyrRS-protnlm-source.json
  predicted_term:
    id: GO:0042594
    label: response to starvation
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: The primary fly study detects TyrRS-HA secretion from S2 cells after serum deprivation, with
      membrane-integrity and tubulin controls excluding release by cell lysis. GO:0042594 includes secretion
      changes in response to nourishment deprivation, so this cellular experiment supports the broad claim.
      Existing target GOA contains only a broader stress annotation. This does not establish organismal
      starvation tolerance or the rat donor’s detailed nuclear mechanism; original training-set novelty
      is not known. The function was described in fly literature before this prediction release, so it
      is correct but not biologically novel (CNN); actual inclusion in the model training set is not established.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-ncomms10022.txt
      supporting_text: presence of secreted TyrRS-HA in the supernatant 24 h after serum deprivation
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  source_reference_id: file:DROME/TyrRS/TyrRS-protnlm-source.json
  predicted_term:
    id: GO:1905594
    label: resveratrol binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    summary: Resveratrol binding is curationally refuted as a GO prediction. The fly TyrRS tyrosine pocket
      likely can accommodate resveratrol by homology to human YARS1, but GO:1905594 is now obsolete
      because resveratrol binding is not an evolved molecular function, has no replacement term, and
      has no annotations in GO. The sole direct experiment is the human pharmacological study, which
      was curated to general small-molecule binding rather than a resveratrol-specific term; there is
      no direct fly evidence to support even that general term.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-flybase.txt
      supporting_text: TyrRS-PA FBpp0075168 58.2 525 6.86 Q9VV60 NP_648895 AAF49462
    - reference_id: file:DROME/TyrRS/TyrRS-GO-1905594-quickgo.json
      supporting_text: The reason for obsoletion is that binding to resveratrol is not an evolved molecular
        function.
    - reference_id: PMID:25533949
      supporting_text: 'Here we present a 2.1 Å

        co-crystal structure of resveratrol bound to the active site of TyrRS.'
    - reference_id: file:DROME/TyrRS/TyrRS-hypotheses/fly41-resveratrol-recognition/openscientist.md
      supporting_text: The QuickGO/EBI ontology record for GO:1905594 shows `isObsolete=True`,
        `name="obsolete resveratrol binding"`, `aspect=molecular_function`
