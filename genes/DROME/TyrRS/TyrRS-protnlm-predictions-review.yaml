- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  source_reference_id: file:DROME/TyrRS/TyrRS-protnlm-source.json
  predicted_term:
    id: GO:1905594
    label: resveratrol binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    summary: The exact predicted term, GO:1905594 resveratrol binding, is obsolete, replacement-less
      and explicitly out of scope for evolved molecular functions. OpenScientist found the fly tyrosine
      active-site pocket conserved with the human YARS1 pocket that binds resveratrol, so in-vitro binding
      by fly Q9VV60 remains plausible by homology but unmeasured. That possibility does not validate
      an obsolete xenobiotic-specific GO molecular-function annotation or a physiological fly function.
      Human TyrRS is the only directly assayed ortholog and GO curators did not annotate it to GO:1905594;
      no equivalent positive target annotation exists.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-hypotheses/fly41-resveratrol-recognition/openscientist.md
      supporting_text: Fly TyrRS almost certainly *can* accommodate resveratrol in its conserved tyrosine
        pocket (68.4% identity to human, all nine contact residues identical), but this has never been
        measured in *Drosophila*, represents a xenobiotic pharmacological interaction rather than an evolved
        function, and the specific GO term (GO:1905594) is obsolete, replacement-less, and unannotated
        in every organism — including the human protein where resveratrol binding was actually demonstrated.
    - reference_id: file:DROME/TyrRS/TyrRS-flybase.txt
      supporting_text: TyrRS-PA FBpp0075168 58.2 525 6.86 Q9VV60 NP_648895 AAF49462
    - reference_id: file:DROME/TyrRS/TyrRS-GO-1905594-quickgo.json
      supporting_text: The reason for obsoletion is that binding to resveratrol is not an evolved molecular
        function.
    - reference_id: PMID:25533949
      supporting_text: 'Here we present a 2.1 Å

        co-crystal structure of resveratrol bound to the active site of TyrRS.'
