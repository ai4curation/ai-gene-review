gene_symbol: TyrRS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
status: COMPLETE
description: Fly TyrRS has established aminoacylation and regulated extracellular functions. Its secretion
  upon serum deprivation supports the broad starvation-response prediction; the specific resveratrol-binding
  prediction uses an obsolete, non-evolved GO term and is not assignable for the native fly enzyme.
