    summary: Resveratrol recognition is a specific ligand-binding claim beyond the conserved tyrosyl-tRNA
      synthetase reaction. The source donor is rat Q4KM49; no binding assay or ligand-pocket analysis
      establishes the same interaction for the native fly Q9VV60 protein. QuickGO identifies GO:1905594
      as obsolete because resveratrol binding is not an evolved molecular function, but this ontology
      judgment does not prove absence of biochemical binding. Preserve the original prediction and use
      UNC for its unverified biological content; no equivalent positive target annotation exists.
