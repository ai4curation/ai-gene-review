id: Q9VV60
gene_symbol: TyrRS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
status: COMPLETE
description: Fly TyrRS has established aminoacylation and regulated extracellular functions. Its release
  from serum-deprived S2 cells shows TyrRS as secreted cargo of a starvation-exposed cell, not a participant
  doing the work of a starvation response, and the vertebrate nuclear starvation mechanism is untested in
  flies, so the response-to-starvation prediction is unresolved. The specific resveratrol-binding GO term
  is obsolete and direct fly binding is unmeasured.
