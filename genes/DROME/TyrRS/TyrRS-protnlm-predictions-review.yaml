  findings:
  - statement: OpenScientist found the fly resveratrol pocket plausible by homology but direct fly binding
      unmeasured and the exact GO term unassignable.
    supporting_text: The seed hypothesis is **biochemically plausible but curationally refuted.** Fly
      TyrRS almost certainly *can* accommodate resveratrol in its conserved tyrosine pocket (68.4% identity
      to human, all nine contact residues identical), but this has never been measured in *Drosophila*,
      represents a xenobiotic pharmacological interaction rather than an evolved function, and the specific
      GO term (GO:1905594) is obsolete, replacement-less, and unannotated in every organism — including
      the human protein where resveratrol binding was actually demonstrated.
