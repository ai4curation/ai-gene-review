- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  source_reference_id: file:DROME/TyrRS/TyrRS-protnlm-source.json
  predicted_term:
    id: GO:0042594
    label: response to starvation
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The fly study detects TyrRS-HA in S2-cell supernatant after serum deprivation, with membrane-integrity
      and tubulin controls excluding release by cell lysis. That shows TyrRS is released by a starvation-exposed
      cell, but TyrRS is the secreted cargo there; release does not show that the protein performs a step
      of a starvation response, and the gene review marks the broader ARBA-derived response-to-stress
      annotation as over-annotated on the same grounds. The participatory mechanism that would justify
      the term, starvation-induced nuclear translocation of YARS1 and PARP1 activation, is documented for
      the vertebrate SF43 ortholog but was not propagated by PAINT and has not been tested for fly TyrRS.
      No fly study links TyrRS to a starvation response (PubMed search of Drosophila TyrRS with starvation
      or nutrient terms returned no records). Available evidence neither validates nor refutes the prediction.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-ncomms10022.txt
      supporting_text: presence of secreted TyrRS-HA in the supernatant 24 h after serum deprivation
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  source_reference_id: file:DROME/TyrRS/TyrRS-protnlm-source.json
  predicted_term:
    id: GO:1905594
    label: resveratrol binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: The exact predicted term, GO:1905594 resveratrol binding, is obsolete, replacement-less
      and explicitly out of scope for evolved molecular functions. OpenScientist found the fly tyrosine
      active-site pocket conserved with the human YARS1 pocket that binds resveratrol, so in-vitro binding
      by fly Q9VV60 remains plausible by homology but unmeasured. The biological prediction therefore
      cannot be validated or refuted with available evidence, and the obsolete xenobiotic-specific GO
      term should not be curated even if an in-vitro fly-binding assay is eventually positive.
    supported_by:
    - reference_id: file:DROME/TyrRS/TyrRS-hypotheses/fly41-resveratrol-recognition/openscientist.md
      supporting_text: Fly TyrRS almost certainly *can* accommodate resveratrol in its conserved tyrosine
        pocket (68.4% identity to human, all nine contact residues identical), but this has never been
        measured in *Drosophila*, represents a xenobiotic pharmacological interaction rather than an evolved
        function
    - reference_id: file:DROME/TyrRS/TyrRS-flybase.txt
      supporting_text: TyrRS-PA FBpp0075168 58.2 525 6.86 Q9VV60 NP_648895 AAF49462
    - reference_id: file:DROME/TyrRS/TyrRS-GO-1905594-quickgo.json
      supporting_text: The reason for obsoletion is that binding to resveratrol is not an evolved molecular
        function.
    - reference_id: PMID:25533949
      supporting_text: 'Here we present a 2.1 Å

        co-crystal structure of resveratrol bound to the active site of TyrRS.'
