- source: Alliance_Imported
  text: Mitochondrial calcium uniporter (MCU) encodes an inner mitochondrial membrane
    channel that transports calcium from the mitochondrial intermembrane space to
    the matrix. It is the main component of the mitochondrial calcium signaling pathway
    and functions in metabolism, cell death, and olfactory memory.
