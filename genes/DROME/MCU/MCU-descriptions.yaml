descriptions:
- source: UniProt
  text: Mitochondrial inner membrane calcium uniporter that mediates calcium uptake
    into mitochondria (PubMed:28726639, PubMed:33296646). Constitutes a pore-forming
    and calcium-conducting subunit (PubMed:28726639, PubMed:33296646). Mitochondrial
    calcium homeostasis plays key roles in cellular physiology and regulates cell
    bioenergetics, cytoplasmic calcium signals and activation of cell death pathways
    (PubMed:28726639). Together with Itpr, has a role in oxidative stress-induced
    ER-mitochondria calcium transfer (PubMed:28726639). During pupation, required
    for memory function in mushroom body neurons (PubMed:27568554).
  source_type: curated
