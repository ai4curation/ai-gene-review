  text: Enables calcium channel activity. Involved in several processes, including
    calcium import into the mitochondrion; memory; and mitochondrial calcium ion homeostasis.
    Located in mitochondrial inner membrane. Is expressed in adult brain; adult head;
    and adult optic lobe. Orthologous to several human genes including MCU (mitochondrial
    calcium uniporter).
