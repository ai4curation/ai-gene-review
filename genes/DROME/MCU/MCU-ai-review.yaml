id: Q8IQ70
gene_symbol: MCU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MCU (CG18769) encodes the pore-forming subunit of the Drosophila mitochondrial calcium uniporter,
  a two-transmembrane-helix protein of the inner mitochondrial membrane that oligomerizes to form a calcium-selective
  channel. Like other metazoan MCU proteins it requires the small subunit EMRE to conduct calcium, and
  its activity is gated by the EF-hand regulators MICU1 and MICU3. MCU mediates fast, ruthenium red-sensitive
  calcium uptake into the mitochondrial matrix, including endoplasmic reticulum-to-mitochondria calcium
  transfer through IP3 receptors. MCU null flies are viable but short-lived; MCU is needed for oxidative
  stress-induced mitochondrial calcium overload and cell death, and uniporter activity in mushroom body
  neurons during pupal development is required for normal adult olfactory memory.
