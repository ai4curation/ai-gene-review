suggested_questions:
- question: Why does loss of MCU, which abolishes fast mitochondrial calcium uptake, have such mild organismal
    consequences in flies, and what slower calcium entry pathways compensate?
suggested_experiments:
- description: Measure matrix calcium and bioenergetics in MCU null neurons under sustained stimulation
    to identify MCU-independent mitochondrial calcium entry routes.
