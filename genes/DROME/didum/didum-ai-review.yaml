- term:
    id: GO:0047497
    label: mitochondrion transport along microtubule
  evidence_type: IDA
  original_reference_id: PMID:20592219
  qualifier: involved_in
  review:
    summary: RNAi depletion of myosin V in cultured neurons increases MT-based mitochondrial velocity
      and duty cycle in both directions.
    action: MODIFY
    reason: The data show MyoV opposes, rather than performs, microtubule-based mitochondrial transport;
      MyoV is an actin motor. The positive process term misstates the sign. No 'negative regulation of
      organelle transport along microtubule' term exists and the anterograde-only term does not cover
      the bidirectional effect, so regulation of organelle transport along microtubule is proposed.
    supported_by:
    - reference_id: PMID:20592219
      supporting_text: we observed a significant increase in mitochondrial transport during myosin V depletion
    - reference_id: PMID:20592219
      supporting_text: they oppose, rather than complement, protracted MT-based movements and perhaps
        facilitate organelle docking
    proposed_replacement_terms:
