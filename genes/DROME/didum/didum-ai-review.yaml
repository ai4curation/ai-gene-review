id: A1Z6Z8
gene_symbol: didum
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'didum (Myosin V, MyoV, CG2146) encodes the single class V unconventional myosin heavy chain
  of Drosophila melanogaster: an N-terminal actin-based motor domain, six IQ motifs that bind calmodulin
  and the essential light chain Mlc-c, a coiled-coil dimerization region and a C-terminal globular (Dilute)
  cargo-binding tail. Unlike vertebrate myosin Va it is a non-processive, low-duty-ratio motor that works
  in ensembles; its actin-activated ATPase is autoinhibited by the tail and activated by Ca2+ and by GTP-bound
  Rab11. In photoreceptors MyoV, in a complex with Rab11 and dRip11, carries post-Golgi rhodopsin-bearing
  vesicles through the actin-rich terminal web to the rhabdomere base; it is stabilized there by Crumbs,
  and loss of MyoV causes cytoplasmic rhodopsin accumulation, stunted and ectopic rhabdomeres. Via the
  adaptor Lightoid it also pulls pigment granules to the rhabdomere in bright light (the longitudinal
  pupil). In the oocyte MyoV anchors oskar mRNA/Staufen at the posterior actin cortex, counterbalancing
  kinesin-1, making didum a posterior-group gene. It is essential for larval development and is required
  for spermatid individualization; it also delivers Crumbs apically in follicle cells.'
