- term:
    id: GO:0030050
    label: vesicle transport along actin filament
  evidence_type: IMP
  original_reference_id: PMID:17517962
  review:
    summary: MyoV, bound to Rab11 on post-Golgi rhodopsin-bearing vesicles, moves them through the actin-rich
      rhabdomere terminal web to the rhabdomere base.
    action: NEW
    reason: MyoV is the actin motor that performs the transport step (it is not a cargo or substrate);
      loss of MyoV prevents vesicles from approaching the rhabdomere base. The same actin-based vesicle
      transport delivers Crumbs apically in follicle cells. GO:0030050 is the more specific is_a
      descendant of GO:0030048 actin filament-based movement, the existing ACCEPTed row.
    supported_by:
    - reference_id: PMID:17517962
      supporting_text: In MyoV mutants, rhodopsin 1 (Rh1) is not delivered to the growing rhabdomere,
        but instead accumulates in photoreceptor cytoplasm; rhodopsin-bearing vesicles, and the Rab11
        and dRip11 they carry, do not approach the rhabdomere base.
    - reference_id: PMID:17517962
      supporting_text: Binary yeast two hybrids and in vitro protein-protein interaction predict a ternary
        complex assembled by independent dRip11 and MyoV binding to Rab11.
    - reference_id: PMID:31881198
      supporting_text: polarized trafficking of Crb is mediated by transport along microtubules by the
        motor protein Dynein and along actin filaments by the motor protein Myosin-V (MyoV)
