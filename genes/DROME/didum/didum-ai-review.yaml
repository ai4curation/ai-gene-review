  review:
    summary: Endocytosis propagated from node PTN008546178.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node PTN008546178 is deep in the myosin tree; its experimental seeds are mainly class
      VI and VII myosins (human, pig and chicken MYO6, mouse Myo6 and Myo7a) plus yeast MYO2, the only
      class V seed. Endocytic uptake is a hallmark of myosin VI (minus-end directed) rather than of class
      V motors, whose documented roles in Drosophila are secretory/recycling transport toward the plasma
      membrane (Rh1 vesicles, Crumbs vesicles), pigment granule movement and oskar RNP anchoring. There
      is no Drosophila evidence for didum in endocytosis, so the propagation to the class V branch is
      likely an over-annotation.
    supported_by:
    - reference_id: PMID:17517962
