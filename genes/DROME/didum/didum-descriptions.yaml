descriptions:
- source: Alliance_Imported
  text: dilute class unconventional myosin (didum) encodes a class V unconventional
    myosin that binds actin and hydrolyzes ATP. It functions in mRNA localization
    in the oocyte, spermatid individualization during spermatogenesis, transport of
    pigment granules in photoreceptors and mitochondrial transport in neuronal cells.
  source_type: curated
  url: https://flybase.org/reports/didum.html
  source_id: FB:FBgn0261397
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: class V myosin with actin binding and ATPase activity,
      in oocyte mRNA localization, spermatid individualization, pigment granule transport
      and neuronal mitochondrial transport. Omits the Rab11-dependent rhodopsin vesicle
      transport.'
- source: Alliance_Automated
  text: Enables several functions, including ATP binding activity; calcium-dependent
    ATPase activity; and cytoskeletal protein binding activity. Involved in several
    processes, including positive regulation of germ plasm oskar mRNA localization;
    rhabdomere development; and sperm individualization. Located in neuronal cell
    body and rhabdomere. Part of myosin V complex. Is expressed in adult head; embryonic/larval
    hindgut; female germline cell; and gonad. Human ortholog(s) of this gene implicated
    in Griscelli syndrome type 1; microvillus inclusion disease; and progressive familial
    intrahepatic cholestasis. Orthologous to human MYO5A (myosin VA); MYO5B (myosin
    VB); and MYO5C (myosin VC).
  source_type: automated
