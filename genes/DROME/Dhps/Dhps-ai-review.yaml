id: Q9VSF4
gene_symbol: Dhps
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dhps (CG8005) is Drosophila deoxyhypusine synthase, the enzyme that performs the first step
  of eIF5A hypusination. Using NAD+, it oxidatively cleaves spermidine and transfers the 4-aminobutyl
  moiety to a specific lysine of the eIF5A precursor, forming deoxyhypusine, which the hydroxylase nero
  then converts to hypusine. Hypusinated eIF5A is required for efficient translation elongation and termination
  at difficult motifs; in flies, reducing eIF5A hypusination impairs brain mitochondrial respiration and
  accelerates age-related decline of locomotion and memory.
