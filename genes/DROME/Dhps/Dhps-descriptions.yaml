  text: Deoxyhypusine synthase (Dhps) encodes an enzyme that catalyzes the NAD(+)-dependent
    oxidative cleavage of spermidine and the subsequent transfer of its butylamine
    group to the epsilon-amino group of a lysine residue of the eukaryotic translation
    elongation factor 5 eEF5 to form the intermediate deoxyhypusine.
