- term:
    id: GO:0051931
    label: regulation of sensory perception
  evidence_type: IMP
  original_reference_id: PMID:32761438
  qualifier: involved_in
  review:
    summary: >-
      Experimentally established in D. melanogaster: hbt loss-of-function alleles strongly reduce the
      larval gentle head-touch response and the Ca2+ responses of terminal-organ chordotonal neurons,
      with the protein expressed in the sheath and glial cells around these neurons.
    action: ACCEPT
    reason: >-
      Zhang et al. 2020 (PMID:32761438; PMC7475148 HTML full text read, local cache abstract-only
      because the Letter has no abstract and the publisher blocks XML download) identified CG43778 in
      a larval head-touch RNA-seq plus behavioural screen as the hit with the most severe touch
      defect and named it headbutt. A MiMIC insertion, a back-crossed CRISPR full knockout and their
      trans-heterozygote all gave an equally severe touch defect, and terminal-organ chordotonal
      neurons of mutants showed reduced Ca2+ responses. An endogenous GFP knock-in placed the protein
      in prospero-positive sheath cells and glia wrapping the sensory dendrites, not in the neurons,
      and the authors conclude that hbt functions in the cells surrounding the dorsal and terminal
      organs to regulate neuronal mechanosensitivity. A regulatory process term, rather than direct
      participation in sensory perception of touch or mechanotransduction, therefore fits the
      non-neuronal site of action. This is the only experimental annotation for the gene and the one
      that later transfers should use as the reference. More specific terms exist (GO:1905789
      positive regulation of detection of mechanical stimulus involved in sensory perception of touch;
      GO:1905792 positive regulation of mechanosensory behavior), but the mechanism by which the sheath
      cells influence the neurons is not known, and the curator's choice is as specific as the
      published evidence safely supports; the refinement is raised as a question rather than a MODIFY.
      Only the title can be quoted verbatim from the cache; the findings are recorded as statements
      and in the notes file.
    supported_by:
    - reference_id: PMID:32761438
      supporting_text: Molecular Basis for Cephalic Mechanosensitivity of Drosophila Larvae
