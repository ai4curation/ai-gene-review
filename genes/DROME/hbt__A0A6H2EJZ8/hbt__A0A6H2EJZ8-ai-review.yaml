- id: PMID:9230076
  title: The mesodermal expression of rolling stone (rost) is essential for myoblast fusion in Drosophila
    and encodes a potential transmembrane protein.
  findings:
  - statement: >-
      Rolling stone (PTHR12242:SF46), the experimental seed of the PAINT membrane node, is enriched in
      embryonic membrane fractions and is required in the mesoderm for myoblast fusion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Primary study of Rolling stone, the IDA donor behind the membrane IBA. Its myoblast-fusion role
      is subfamily-specific (SF46) and was not propagated by PAINT; it is not transferred to hbt.
