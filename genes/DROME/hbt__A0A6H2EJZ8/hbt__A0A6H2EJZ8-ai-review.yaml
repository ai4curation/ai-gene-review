gene_symbol: hbt
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Headbutt (hbt, CG43778, FBgn0264308) is a Drosophila multipass membrane protein of the Rost
  family (PANTHER PTHR12242, subfamily SF49), distantly related to Rolling stone (SF46), which is
  required for myoblast fusion. A0A6H2EJZ8 is isoform E (1003 aa), the longest hbt product and the
  UniProt gene-centric canonical. Its N-terminal half (about residues 1-512) carries two predicted
  coiled-coil segments and a disordered low-complexity region; the
  Rost region (about residues 552-762) carries six predicted transmembrane helices, and it ends in a
  disordered Gly-rich tail. Shorter hbt isoforms (A, C, D) share all or part of the membrane core.
  In the larva an endogenous C-terminal GFP knock-in shows Headbutt in non-neuronal support cells:
  sheath cells that wrap sensory dendrites in the terminal and dorsal organs, glia that ensheath
  chordotonal neurons, and a sheath around the brain and ventral nerve cord. hbt mutants have a
  strongly reduced response to gentle head touch and reduced calcium responses in terminal-organ
  chordotonal neurons, so Headbutt acts from these surrounding cells to support neuronal
  mechanosensitivity. Its molecular activity is unknown; a distant, profile-level resemblance of
  the family to the AIG1/ADTRP threonine hydrolases has been reported but not tested.
