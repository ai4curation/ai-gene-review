- id: file:DROME/hbt/hbt-bioinformatics/RESULTS.md
  title: hbt isoform and family-relationship analysis
  findings:
  - statement: >-
      Isoform D (Q9VK03) residues 1-451 are identical to isoform E residues 513-963; the Rost region
      with six predicted helices maps to E 552-762. Isoform D is 30.7% identical to Rolling stone over
      218 residues; a pairwise comparison with human AIG1 was not significant.
core_functions:
- description: >-
    Multipass Rost-family membrane protein of sensory sheath cells and glia that is required for normal
    larval head-touch sensitivity and for full mechanically evoked responses of terminal-organ
    chordotonal neurons, acting non-cell-autonomously from the cells that surround the sensory
    dendrites. Its molecular activity is unknown.
  directly_involved_in:
  - id: GO:0051931
    label: regulation of sensory perception
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:32761438
    supporting_text: Molecular Basis for Cephalic Mechanosensitivity of Drosophila Larvae
  - reference_id: file:DROME/hbt__A0A6H2EJZ8/hbt__A0A6H2EJZ8-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: DR   Pfam; PF21534; Rost; 1.
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of Headbutt is unknown, including whether the Rost/PTHR12242 region
      retains the Thr/His pair proposed to make the family AIG1/ADTRP-like hydrolases, what the long
      N-terminal coiled-coil and disordered region of isoform E contributes, and how its presence in
      sheath cells and glia tunes the mechanosensitivity of the neurons they wrap (extracellular matrix
      or lymph composition, dendrite attachment, or signalling).
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
suggested_questions:
- question: Would GO:1905789 (positive regulation of detection of mechanical stimulus involved in sensory
    perception of touch) be a more appropriate refinement of the IMP to GO:0051931, given that hbt acts
    from sheath cells rather than the touch neurons?
- question: Which hbt isoforms are expressed in larval sheath cells and glia, and does the C-terminal GFP
    knock-in tag isoform E (which extends 40 residues beyond the C-terminus shared by isoforms A and D)?
- question: Does the PTHR12242 (Rost) family, including Headbutt, retain catalytic Thr and His residues at
    positions structurally equivalent to those of AIG1/ADTRP, and does Headbutt react with fluorophosphonate
    activity-based probes?
suggested_experiments:
- description: >-
    Express isoform E and the N-terminally truncated isoform D separately in sheath cells
    (prospero-Gal4) of hbt knockout larvae and test rescue of the gentle-touch response and
    chordotonal Ca2+ responses; in parallel, mutate candidate conserved Thr/His residues of the Rost
    region and test activity-based probe labelling of tagged Headbutt in membrane fractions.
