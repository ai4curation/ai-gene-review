  review:
    summary: >-
      Membrane localisation is a family-level property placed by PAINT at a deep PTHR12242 node and
      is consistent with the six predicted transmembrane helices of isoform E.
    action: ACCEPT
    reason: >-
      The IBA comes from PANTHER node PTN001387085, a deep PTHR12242 ancestor whose descendants
      include animal and plant Rost-family proteins (the same IBA reaches several hundred plant and
      protist members in QuickGO). The only experimental seed is Rolling stone (FBgn0011705, SF46),
      whose membrane association was shown by IDA (enrichment in embryonic membrane fractions,
      PMID:9230076). hbt sits in a different subfamily (SF49) but within the clade below the node, and
      the target has its own independent support: the complete Rost (PF21534) region with six
      Phobius-predicted transmembrane helices (553-762). The PAINT curator propagated only membrane
      from Rost and not Rost's experimental myoblast-fusion process (GO:0007520, IMP), which is
      read as a deliberate decision that the process is not ancestral; it is not transferred here
      either. The GFP knock-in shows Headbutt in sheath-like structures around dendrites and glia
      but does not resolve plasma versus internal membranes, so the general term is as precise as the
      evidence allows.
