- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific
    and RNA polymerase II cis-regulatory region sequence-specific DNA binding activity.
    Involved in several processes, including adult walking behavior; nervous system
    development; and regulation of insulin-like growth factor receptor signaling pathway.
    Predicted to be active in nucleus. Is expressed in several structures, including
    Kenyon cell; adult optic lobe intrinsic neurons; somatic stem cell; synaptic neuropil
    domain; and synaptic neuropil subdomain. Human ortholog(s) of this gene implicated
    in diabetic ketoacidosis; maturity-onset diabetes of the young type 9; type 1
    diabetes mellitus; and type 2 diabetes mellitus. Orthologous to human PAX4 (paired
    box 4).
