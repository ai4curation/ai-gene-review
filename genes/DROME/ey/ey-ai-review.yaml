id: O18381
gene_symbol: ey
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'eyeless (ey) encodes the Drosophila ortholog of vertebrate Pax6, a nuclear transcription
  factor with an N-terminal paired domain (PAI and RED subdomains), a paired-type homeodomain and a C-terminal
  transactivation region. Expressed in the embryonic eye primordium, throughout the undifferentiated eye
  portion of the eye-antennal imaginal disc, and in parts of the brain, ey acts downstream of its paralog
  twin of eyeless (toy) and at the top of the retinal determination network: it binds eye-specific enhancers
  and activates sine oculis, eyes absent, dachshund, Optix and the proneural gene atonal, specifying eye-field
  identity and enabling compound eye formation. Loss of ey reduces or eliminates the compound eye, and
  targeted ectopic expression induces morphologically normal ectopic eyes on legs, wings and antennae.
  Its paired domain drives retinal determination, whereas the homeodomain promotes tissue growth and antagonizes
  paired-domain activity. Outside the eye, ey is required for mushroom body and central complex development
  in the brain and for differentiation and function of the insulin-producing neurons, where it directly
  activates dilp5.'
