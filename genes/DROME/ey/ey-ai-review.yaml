core_functions:
- description: Ey is a sequence-specific RNA polymerase II DNA-binding transcription activator that binds
    eye-specific enhancers of retinal determination genes (sine oculis, eyes absent, Optix, atonal) via
    its paired domain and activates their transcription in the nucleus.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0048749
    label: compound eye development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10207149
    supporting_text: the EY protein activates transcription of sine oculis by direct interaction with
      an eye-specific enhancer in the long intron of the so gene
  - reference_id: PMID:16533912
    supporting_text: Initial analysis reveals three genes, eyes absent, shifted, and Optix, as novel direct
      targets of Ey.
  - reference_id: PMID:15973436
    supporting_text: Most interestingly, Eyg acts exclusively as a repressor, whereas Ey is an activator.
- description: Ey binds cis-regulatory sequences of RNA polymerase II-transcribed genes (so intronic eye
    enhancer, atonal 3' enhancer, dilp5) and, acting as the eye selector, its activity specifies eye-field
    identity so that ectopic expression induces complete ectopic compound eyes.
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0001745
    label: compound eye morphogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7892602
    supporting_text: By targeted expression of the ey complementary DNA in various imaginal disc primordia
      of Drosophila, ectopic eye structures were induced on the wings, the legs, and on the antennae.
  - reference_id: PMID:17108002
    supporting_text: the RD factors Eyeless and Sine oculis function as direct regulators
  - reference_id: PMID:9584118
    supporting_text: During normal eye development, eyeless is expressed earlier than and is required
      for the expression of sine oculis and eyes absent, but not vice versa.
suggested_questions:
- question: Should Ey carry 'specification of animal organ identity' (GO:0010092), given that ectopic
    ey converts non-retinal imaginal disc cells to eye identity, and do toy and vertebrate Pax6 carry
    this term?
- question: How much of endogenous Ey function in the eye disc is paired-domain-dependent versus homeodomain-dependent,
    given that HD-deleted Ey induces ectopic eyes but fails to rescue ey mutants?
- question: Is the IDA for RNA pol II transcription factor activity from the chicken DC5 crystallin enhancer
    study (PMID:15790965) based on Ey acting on DC5 in vitro, given that DC5 is regulated by D-Pax2/SoxN
    in vivo?
suggested_experiments:
- description: Genome-wide CUT&RUN or ChIP-seq for endogenously tagged Ey in eye-antennal discs and larval
    brain (mushroom body, IPCs), combined with ey mutant RNA-seq, to define direct targets and compare
    paired-domain versus homeodomain-mediated binding.
- description: CRISPR knock-in of isoform-specific or domain-specific (PD-only, HD-only) ey alleles at
    the endogenous locus to separate eye specification from growth-promoting activities without overexpression
    artefacts.
