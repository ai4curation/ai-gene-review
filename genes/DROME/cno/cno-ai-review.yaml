taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Canoe (Cno) is the Drosophila ortholog of mammalian afadin (AF-6), a large multidomain scaffold with
  two N-terminal Ras-association (RA) domains, FHA, dilute and PDZ domains and a long C-terminal intrinsically disordered
  region containing actin-binding sequences. Canoe localizes to the cell cortex and is concentrated at adherens
  junctions, especially tricellular junctions, where it is recruited by active Rap1 and F-actin. It binds activated
  Rap1, F-actin and DE-cadherin and links the apical actomyosin network to adherens junctions, so that actomyosin
  contraction is transmitted into cell shape change during apical constriction of the mesoderm, germband extension,
  head involution and dorsal closure; it also contributes to apical-basal polarity establishment. In mitotic neuroblasts
  and induced-polarity S2 cells, a C-terminal Pins-binding domain binds the Pins TPR domain and the RA domains bind
  RanGTP, and Canoe/RanGTP is required to recruit Mud (NuMA) to Pins cortical crescents for Pins/Mud/dynein-mediated
  spindle orientation during asymmetric cell division. Canoe also acts in eye morphogenesis, optic lobe development
  (Ser-Notch-Canoe complex), JNK activation during dorsal closure and Slit-Robo axon guidance.
