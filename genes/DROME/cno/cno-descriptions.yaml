- source: Alliance_Automated
  text: Enables protein domain specific binding activity and small GTPase binding
    activity. Involved in several processes, including morphogenesis of an epithelium;
    regulation of signal transduction; and second mitotic wave involved in compound
    eye morphogenesis. Located in several cellular components, including adherens
    junction; cytoplasmic side of plasma membrane; and rhabdomere. Is expressed in
    several structures, including epithelium; germ layer; gut section; larval optic
    anlage; and synaptic neuropil domain. Orthologous to human AFDN (afadin, adherens
    junction formation factor).
