    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: septin GTP-binding protein forming hetero-oligomers with
      actin; with Sep5 and Pnut bundles actin in wing adhesion.'
- source: Alliance_Automated
  text: Enables several functions, including GTP binding activity; protein homodimerization
    activity; and ubiquitin protein ligase binding activity. Involved in several processes,
    including border follicle cell migration; cytoskeleton-dependent cytokinesis;
    and imaginal disc-derived wing morphogenesis. Located in cleavage furrow and septin
    ring. Part of septin complex. Colocalizes with contractile ring. Is expressed
    in several structures, including adult head; brain; embryonic dorsal epidermis;
    embryonic ventral epidermis; and larval nervous system. Orthologous to human SEPTIN2
    (septin 2).
  source_type: automated
