- source: Alliance_Imported
  text: Septin 1 (Septin1) encodes a member of the septin family of GTP-binding proteins.
    Septins form hetero-oligomeric filaments and rings that associate with filamentous
    actin. Septin1, together with Septin5 and pnut, is required for the bundling of
    actin filaments into compact cytoskeleton cables during dorsoventral wing adhesion.
  source_type: curated
  url: https://flybase.org/reports/Septin1.html
  source_id: FB:FBgn0011710
