id: P42207
gene_symbol: Septin1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Septin1 (Sep1) is a Drosophila SEPT2-class septin GTPase that assembles with Peanut and Septin2
  into the Sep1-Sep2-Pnut hetero-oligomer purified from embryos. Sep1 binds and hydrolyses GTP, and intact
  GTP-binding/hydrolysis motifs of Sep1 are needed for complex function. It concentrates at the leading
  edge of cleavage and cellularization furrows and at other cortical sites, and directly binds and bundles
  actin filaments. In the Sep1-Sep2-Pnut complex, recruited by Anillin, it bends F-actin into tight rings
  and is required for assembly and maintenance of the actomyosin ring during cell wound repair; it also
  contributes to border cell migration.
