    reason: Each of the five Drosophila septins, purified individually, binds and bundles F-actin in vitro,
      and the assembled Sep1/Sep2/Pnut and Sep4/Sep5/Pnut complexes additionally bend the bundles into
      rings. Direct F-actin binding is a core activity linking septins to the actomyosin cytoskeleton.
