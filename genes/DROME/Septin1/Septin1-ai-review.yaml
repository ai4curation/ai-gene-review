- term:
    id: GO:0044837
    label: actomyosin contractile ring organization
  evidence_type: IMP
  original_reference_id: PMID:38728140
  qualifier: involved_in
  review:
    summary: Septins organise the actomyosin ring during single-cell wound repair.
    action: ACCEPT
    reason: In the Drosophila embryo cell-wound model, knockdown or mutation of each septin perturbs actomyosin
      ring assembly, contraction or disassembly; the two complexes bend actin bundles to different curvatures.
      Core process for the septin complexes.
    supported_by:
    - reference_id: PMID:38728140
      supporting_text: Sep1 knockdown and Sep2 mutant embryos exhibit delayed wound closure, reduced recruitment
        of actin to the actomyosin ring, and premature actomyosin ring disassembly
    - reference_id: PMID:38728140
      supporting_text: Interestingly, we observe curved F-actin bundles induced by two separate Septin
        complexes, whereas individual Septins can only bind to and bundle F-actin.
