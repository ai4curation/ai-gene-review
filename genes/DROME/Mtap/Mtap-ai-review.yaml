- term:
    id: GO:0033353
    label: L-methionine cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000224684
  - SGD:S000004007
  review:
    summary: L-methionine cycle (IBA) from PTN000224684; donor yeast MEU1.
    action: MODIFY
    reason: >-
      GO:0033353 is defined as the SAM cycle (SAM, S-adenosylhomocysteine, homocysteine, methionine).
      Mtap acts instead in the 5'-methylthioadenosine (MTA) salvage pathway that regenerates methionine
      from MTA, which falls under L-methionine salvage (GO:0071267, "generates L-methionine from derivatives
      of it"). This row carries GO:0033353 because the specific term GO:0019509 "L-methionine salvage
      from methylthioadenosine" is obsolete in the current GO release, with replaced_by GO:0033353 (checked
      in QuickGO and in OLS, GO release 2026-07-26), and existing annotations were migrated to the replacement.
      GO:0019509 cannot be used, so GO:0071267 is the most specific live term that matches the pathway;
      FlyBase curators themselves used GO:0071267 for the Adi1 mutant phenotype (IMP, PMID:25037729).
      Same replacement applied to all five methionine salvage enzymes (Mtap, Mri1, CG11134, Enoph, Adi1).
    proposed_replacement_terms:
    - *id001
    supported_by:
    - reference_id: PMID:25037729
      supporting_text: >-
        In summary, these results suggest that ADI1, an MTA cycle enzyme, affects fly fecundity through
        the regulation of methionine metabolism.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
