suggested_questions:
- question: >-
    GO:0019509 (L-methionine salvage from methylthioadenosine) was obsoleted with replaced_by GO:0033353
    (L-methionine cycle), whose definition covers only the SAM cycle; should migrated MTA-salvage annotations
    instead be placed under GO:0071267 L-methionine salvage, or should the GO:0033353 definition be broadened
    to include the MTA cycle?
- question: >-
    Does loss of Mtap in flies lead to MTA accumulation that inhibits polyamine synthesis or protein arginine
    methyltransferases, as in MTAP-deleted human cancers?
suggested_experiments:
- description: >-
    Measure MTA, SAM, polyamines and methionine in Mtap null larvae on methionine-restricted diet.
  hypothesis: >-
    Mtap loss causes MTA accumulation and reduces methionine recycling under dietary methionine restriction.
