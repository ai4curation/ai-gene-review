taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Mtap encodes the S-methyl-5'-thioadenosine phosphorylase of Drosophila melanogaster, a homotrimeric
  purine nucleoside phosphorylase-family enzyme that phosphorolytically cleaves 5'-methylthioadenosine
  (MTA), the by-product of polyamine (spermidine and spermine) synthesis from decarboxylated S-adenosylmethionine,
  into adenine and 5-methylthioribose 1-phosphate. This is the first step of the methionine salvage pathway,
  which recycles the methylthio group of MTA back to methionine, and it also releases adenine for purine
  salvage. The fly enzyme has been purified and kinetically characterized and is expressed in embryonic
  fat body and visceral mesoderm. It acts in the cytoplasm (cytosol) and is also detected in the nucleus
  in vertebrates.
