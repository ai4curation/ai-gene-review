- source: Alliance_Automated
  text: Enables S-methyl-5-thioadenosine phosphorylase activity and identical protein
    binding activity. Predicted to be involved in L-methionine cycle. Predicted to
    be located in cytoplasm and nucleus. Predicted to be active in cytosol. Is expressed
    in adult head; fat body primordium; and visceral trunk mesoderm. Human ortholog(s)
    of this gene implicated in biliary tract benign neoplasm and diaphyseal medullary
    stenosis with malignant fibrous histiocytoma. Orthologous to human MTAP (methylthioadenosine
    phosphorylase).
