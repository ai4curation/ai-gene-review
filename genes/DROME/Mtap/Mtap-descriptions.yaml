- source: Alliance_Imported
  text: Methylthioadenosine phosphorylase (Mtap) encodes a cytosolic enzyme that catalyzes
    the phosphorolytic cleavage of S-methyl-5'-thioadenosine (MTA), a by-product of
    the polyamine biosynthesis, to 5-(methylsulfanyl)-alpha-D-ribose 1-phosphate and
    adenine. Mtap plays a key role in the L-methionine salvage pathway and in the
    production of endogenous cellular adenine.
  source_type: curated
  url: https://flybase.org/reports/Mtap.html
  source_id: FB:FBgn0034215
