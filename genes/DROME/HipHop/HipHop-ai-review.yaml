id: Q7JWP6
gene_symbol: HipHop
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: HipHop (HP1-HOAP-interacting protein) is a rapidly evolving Drosophila telomere-capping protein
  that forms the HipHop-HOAP subcomplex of terminin with HOAP (cav) and interacts with HP1a. HipHop and
  HOAP stabilize each other and occupy a broad region of more than 10 kb at chromosome ends independently
  of the underlying DNA sequence, under the control of ATM and the MRN complex; the subcomplex covers
  the duplex region of the telomere and recruits the Moi-Tea-Ver subcomplex. Loss of HipHop causes telomere
  fusions, and a hypomorphic allele de-represses telomeric retrotransposons in the female germline. Its
  male-germline paralog K81 replaces it to maintain paternal telomere capping through spermiogenesis.
