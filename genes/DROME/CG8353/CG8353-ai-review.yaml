  review:
    action: ACCEPT
    summary: Cytidine deamination is supported by the CDA-like branch and compact enzyme architecture.
    reason: The 170-residue target has a complete cytidine-deaminase-like zinc-binding domain and the
      tetrameric cytidine-deaminase family signature. These agree with the curated PAINT inference of
      free-nucleoside deamination; the broad CMP/dCMP-type domain label alone would not resolve substrate
      specificity.
    supported_by:
