suggested_questions:
- question: Do the three tandem fly CDA paralogs (CG8353, CG8360, CG8349) differ in substrate preference
    (cytidine, 2'-deoxycytidine, nucleoside analogues) or tissue of expression, or are they redundant?
suggested_experiments:
- description: Express recombinant CG8353 and measure kcat/Km for cytidine and 2'-deoxycytidine, with
    C78A/E80A mutants as controls; determine oligomeric state by SEC-MALS.
