  review:
    action: KEEP_AS_NON_CORE
    summary: Self-association is expected for a small-chain tetrameric CDA but is not measured for CG8353.
    reason: >-
      CG8353 has the single-domain architecture of the homotetrameric CDA class (TIGR01354), in which the
      active site is completed across subunits; human CDA in the same subfamily is a crystallographic
      homotetramer. The ARBA call is therefore biologically plausible but peripheral to the catalytic
      function and untested in flies.
