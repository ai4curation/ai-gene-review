  review:
    action: ACCEPT
    summary: Cytidine deamination directly produces uridine.
    reason: >-
      The catalysed reaction (cytidine + H2O -> uridine + NH4+) is itself a uridine-forming step, so the
      enzyme does the work of this process; the PAINT curator placed it at PTN000182087 with the activity.
      It does not imply a role in de novo pyrimidine synthesis.
