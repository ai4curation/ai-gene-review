id: Q9VLR2
gene_symbol: CG8353
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG8353 is a compact CDA-like zinc-dependent deaminase associated with pyrimidine nucleoside
  salvage. Its cytidine-deaminase family signature supports hydrolytic conversion of cytidine and deoxycytidine
  to the corresponding uridine nucleosides. Cytosolic localization and the reaction assignment are evolutionary
  inferences; direct fly substrate kinetics and oligomerization measurements are not established.
