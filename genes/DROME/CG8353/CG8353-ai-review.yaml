id: Q9VLR2
gene_symbol: CG8353
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG8353 encodes a 170-residue, single-domain zinc-dependent cytidine deaminase of the small-chain
  (homotetrameric) CDA class, one of three tandem fly paralogs (with CG8360 and CG8349) in the PANTHER
  cytidine deaminase subfamily that contains human CDA and yeast CDD1. It retains the three zinc-ligand
  cysteines and the catalytic glutamate of the family, and by descent from characterised cytidine
  deaminases is expected to hydrolytically deaminate cytidine and 2'-deoxycytidine to uridine and
  2'-deoxyuridine plus ammonia in the cytosol, a step of pyrimidine nucleoside salvage and catabolism.
  Its activity, substrate preference, oligomeric state and localisation have not been measured
  directly in Drosophila; RNAi knockdown in the eye enhances the toxicity of expanded CGG-repeat RNA in
  a fly model of fragile X-associated tremor/ataxia syndrome.
