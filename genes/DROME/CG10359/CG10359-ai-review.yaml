knowledge_gaps:
- gap_statement: >-
    The molecular activity of CG10359 is unknown: no ligand of its fibrinogen-related domain and
    no receptor has been shown, and no member of its PANTHER subfamily (SF327) has been
    characterised.
  boundary: >-
    Established are secretion into larval hemolymph from several tissues, a FReD without a
    transmembrane anchor, and neuronal RNAi phenotypes at the neuromuscular junction. The
    proposed Mew interaction is a computational ligand-receptor prediction.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Determines whether CG10359 is a lectin-like recognition protein (as FIBCD1 and ficolins
    are), an integrin ligand, or a growth-factor-like signal, and therefore which, if any,
    homology-based annotations apply.
  resolution: >-
    Binding assays of recombinant CG10359 FReD with acetylated glycans/chitin and with the Mew
    ectodomain, and tests of whether neuronal or muscle-specific loss alters Mew-dependent
    imaginal disc or neuromuscular-junction phenotypes.
suggested_questions:
- question: Does the CG10359 fibrinogen-related domain retain the acetyl-group binding pocket and calcium
    site that FIBCD1 and ficolins use for ligand recognition, or has the insect SF327 subfamily diverged
    in ligand specificity?
- question: Is the predicted muscle-secreted CG10359 to imaginal-disc Mew interaction a direct physical
    binding, and does CG10359 act as an integrin ligand?
suggested_experiments:
- description: Express the CG10359 FReD (shared by all isoforms) and test binding to chitin, chitin oligomers,
    acetylated BSA and glycosaminoglycans, with FIBCD1 FReD as a positive control.
- description: Test direct binding of CG10359 to the Mew (alphaPS1) integrin ectodomain and, in vivo,
    whether muscle-specific CG10359 knockdown phenocopies or modifies mew loss in imaginal discs.
