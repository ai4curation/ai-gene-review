id: B7Z0B2
gene_symbol: CG10359
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG10359 encodes a secreted protein of about 460-485 residues (B7Z0B2 is the longest of
  several isoforms) with an N-terminal signal peptide, no transmembrane segment, and a single
  C-terminal fibrinogen-related domain (FReD) of the kind that in other proteins forms
  ligand-recognition and receptor-binding surfaces. It belongs to an insect/nematode-specific
  subfamily of fibrinogen-domain proteins that has no experimentally characterised member. In
  third-instar larvae the protein is secreted from muscle, heart, wing imaginal disc and neurons
  into the circulating hemolymph, and an interaction-prediction analysis proposes it as a
  muscle-derived ligand of the integrin alpha subunit Multiple edematous wings (Mew) in imaginal
  discs. RNAi knockdown is lethal or semi-lethal when ubiquitous and, when neuronal, alters
  larval neuromuscular-junction morphology and reduces adult climbing. Its ligand, receptor and
  molecular activity have not been determined; it has been described both as an
  angiopoietin-like and as a FIBCD1-like protein on the basis of its fibrinogen domain.
