  review:
    action: MODIFY
    summary: The PAINT matrix term should be generalized to extracellular region for CG10359.
    reason: PTN000441162 is a taxon-unrestricted PAINT matrix-localization node, and the cached evidence
      does not establish enough tree divergence or target-specific loss to treat the IBA as a bad propagation.
      CG10359 has a signal peptide, a fibrinogen-like extracellular region, and direct evidence as a
      circulating larval secretome protein; the specific extracellular-matrix localization remains unresolved.
      GO:0005576 extracellular region preserves the supported extracellular placement without asserting matrix
      retention.
    proposed_replacement_terms:
