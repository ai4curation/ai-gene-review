  - UniProtKB:P55918
  - UniProtKB:Q9UQP3
  review:
    action: REMOVE
    summary: The root-level extracellular-matrix IBD overpropagates across a heterogeneous fibrinogen-domain
      family.
    reason: PTN000441162 places extracellular matrix at the root of PTHR19143 from vertebrate MFAP4 and
      related seeds, then propagates that matrix-localization call into the divergent CG10359-containing
      FI21813P1-related subfamily. CG10359 has a signal peptide and was detected as a circulating secretome
      protein in larval hemolymph from muscle, heart, wing disc and neurons, but the newer secretome and
      dFibcd1 RNAi studies do not show retention in a collagen-containing extracellular matrix.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000441162
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The IBD is placed at the PTHR19143 root, while CG10359 is the fly representative of the
          divergent FI21813P1-related SF327 branch rather than the vertebrate MFAP4 SF225 branch represented
          among UniProt seeds.
    supported_by:
