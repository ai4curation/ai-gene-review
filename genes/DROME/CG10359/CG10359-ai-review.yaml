- term:
    id: GO:0008061
    label: chitin binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N539
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: FIBCD1 chitin binding is transferred across PANTHER subfamilies; untested for CG10359.
    reason: >-
      The donor, human FIBCD1, binds chitin and acetylated compounds through its fibrinogen domain
      (PMID:19710473). CG10359 was called a potential FIBCD1 orthologue on the basis of FReD
      similarity (PMID:35916241), but PANTHER places FIBCD1 in vertebrate-only SF45 and CG10359 in
      insect/nematode SF327, and the CG10359 FReD is about as similar to FIBCD1 (41%) as to MFAP4
      or FGL1, and closer still to its own fly paralogs. The acetyl-binding pocket has not been
      examined and no binding assay has been done on CG10359; the fly paper assayed GAG binding
      only for vertebrate FIBCD1. Chitin is abundant in insects, so the activity is plausible, but
      it rests only on a cross-subfamily domain transfer.
    supported_by:
    - reference_id: PMID:19710473
      supporting_text: Functional analysis showed a high-affinity and calcium-dependent  binding
        of acetylated components to the fibrinogen domain
    - reference_id: PMID:35916241
      supporting_text: we identified the D. melanogaster gene CG10359 as a potential orthologue of
        FIBCD1
    - reference_id: file:DROME/CG10359/CG10359-bioinformatics/RESULTS-rereview.md
      supporting_text: Human FIBCD1 (Q8N539) is in PTHR19143:SF45 (vertebrate members only)
    - reference_id: file:DROME/CG10359/CG10359-bioinformatics/RESULTS-rereview.md
      supporting_text: The analysis does not test whether CG10359 binds acetylated ligands; binding-pocket
        residues were not examined.
