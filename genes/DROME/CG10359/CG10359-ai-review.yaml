  review:
    action: UNDECIDED
    summary: Secreted CG10359 lacks the human FIBCD1 transmembrane architecture.
    reason: Human FIBCD1 is a type 2 transmembrane receptor, whereas CG10359 carries a predicted signal
      peptide and soluble fibrinogen-like region but no retained transmembrane segment. Peripheral membrane
      binding remains possible, so the broad membrane ISS transfer is unresolved rather than refuted.
