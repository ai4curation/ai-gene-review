    label: G protein-coupled receptor binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:O00602
  review:
    action: REMOVE
    summary: Ficolin-specific GPR43 docking transferred across PANTHER subfamilies to a protein that is not a ficolin.
    reason: >-
      The donor is human M-ficolin (FCN1, O00602), whose GPCR binding rests on its docking onto
      monocyte GPR43 (PMID:21037097), a property of a vertebrate soluble collagen-like lectin.
      CG10359 sits in PANTHER PTHR19143:SF327, an insect/nematode subfamily, whereas FCN1 is in
      SF377; CG10359 lacks the ficolin collagen-like region, and its FReD is no more similar to
      FCN1 than to angiopoietin-1 (about 38-39% identity). PAINT curators placed the family's
      signaling-receptor-binding IBD (PTN000441539) at a chordate-restricted node and did not
      propagate any receptor-binding function to fly members, a deliberate omission. Neither
      the GPCR partner nor any receptor interaction has been tested for CG10359, so this
      subfamily-specific function should not be transferred.
    supported_by:
    - reference_id: PMID:21037097
      supporting_text: M-ficolin, a conserved soluble CL of monocyte origin, overcomes its lack of
        membrane-anchor domain by docking constitutively onto a monocyte transmembrane receptor, G
        protein-coupled receptor 43 (GPCR43)
    - reference_id: file:DROME/CG10359/CG10359-bioinformatics/RESULTS-rereview.md
      supporting_text: FCN1 (O00602) is in PTHR19143:SF377.
    - reference_id: file:DROME/CG10359/CG10359-bioinformatics/RESULTS-rereview.md
      supporting_text: FIBCD1 is no closer to CG10359 than MFAP4 or FGL1, and the ficolin FCN1 is
        about as distant as angiopoietin-1.
