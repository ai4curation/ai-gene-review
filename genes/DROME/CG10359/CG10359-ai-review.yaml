  findings:
  - statement: Fly dFibcd1/CG10359 knockdown produces neuromuscular-junction defects and motor-related
      behavioral deficits.
    supporting_text: Gene knockdown in flies resulted in morphological disruption of the neuromuscular
      junction and motor-related behavioural deficits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked; supports CG10359/dFibcd1 neuronal RNAi effects at the larval
      neuromuscular junction and in adult climbing, while the CS-4S/GAG binding assays are on vertebrate
      FIBCD1 rather than fly CG10359.
- id: PMID:42009678
  title: Multi-omic mapping of Drosophila protein secretomes reveals tissue-specific origins and
    inter-organ trafficking.
  full_text_unavailable: false
  findings:
  - statement: The larval tissue-secretome map identifies B7Z0B2/CG10359 in the high-confidence
      tissue-secreted protein set from muscle, heart, wing disc and neurons.
    supporting_text: We removed B7Z0B3 (CG10359) from muscle, because B7Z0B2 (CG10359) was identified
      from muscle/heart/wingdisc/neurons.
  - statement: FlyPhoneDB2 predicts CG10359 as a candidate muscle-secreted ligand for imaginal-disc Mew,
      an integrin alpha subunit; this is suggestive of an extracellular interaction but does not by itself
      prove matrix residence or justify a new binding annotation.
    supporting_text: candidate inter-organ ligands, including muscle-secreted CG10359 binding to Multiple
      edematous wings (Mew) in imaginal discs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked; places CG10359/B7Z0B2 in the high-confidence larval secretome map
      and predicts a muscle-to-imaginal-disc CG10359-Mew candidate interaction.
