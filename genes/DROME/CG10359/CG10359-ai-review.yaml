  review:
    action: REMOVE
    summary: The donor's membrane location comes from a transmembrane anchor that CG10359 lacks.
    reason: >-
      FIBCD1 is a type II transmembrane receptor (PMID:19710473, PMID:35916241), so its membrane
      location is a consequence of its N-terminal transmembrane segment. No CG10359 isoform has
      a transmembrane segment; all have a cleavable signal peptide, and the protein is secreted
      from several larval tissues into the hemolymph (PMID:42009678). Transferring a membrane
      location from a transmembrane donor to a soluble secreted protein is not supported, and
      no membrane association of CG10359 has been reported.
    supported_by:
