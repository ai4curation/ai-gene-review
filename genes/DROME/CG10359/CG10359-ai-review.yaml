    label: extracellular matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2665790
  - MGI:MGI:99516
  - PANTHER:PTN000441162
  - RGD:3886
  - UniProtKB:P55083
  - UniProtKB:P55918
  - UniProtKB:Q9UQP3
  review:
    action: MODIFY
    summary: Root-node matrix localization is broader in scope than the evidence for this secreted protein; generalize to extracellular region.
    reason: >-
      The row descends from PTN000441162, the PTHR19143 root node, where PAINT placed
      extracellular-matrix localization on the basis of vertebrate matrix proteins (MFAP4,
      tenascins and related donors). CG10359 is inside the family, carries a signal peptide and
      is secreted, so an extracellular location is well supported by its own evidence: it is
      among the high-confidence tissue-secreted hemolymph proteins of larvae (PMID:42009678).
      The family also contains soluble serum lectins and circulating hormone-like proteins, and
      nothing shows that CG10359 is retained in a matrix rather than circulating. The supported
      claim is extracellular location; matrix residence is not refuted but is not established
      for this subfamily. GO:0005576 extracellular region keeps the extracellular placement
      without asserting matrix retention.
    proposed_replacement_terms:
    - id: GO:0005576
      label: extracellular region
    propagation_review:
