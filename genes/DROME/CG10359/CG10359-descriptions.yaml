  text: Predicted to enable G protein-coupled receptor binding activity and chitin
    binding activity. Predicted to be involved in G protein-coupled receptor signaling
    pathway. Predicted to be located in membrane. Predicted to be active in extracellular
    matrix. Is expressed in several structures, including dorsal head epidermis; embryonic
    hypopharynx; embryonic salivary gland duct; ganglia; and glial cell. Human ortholog(s)
    of this gene implicated in muscular disease. Orthologous to human TNN (tenascin
    N) and TNR (tenascin R).
