suggested_questions:
- question: Does the Drosophila 9-1-1 clamp activate MEI-41 through a Rad9 C-terminal TopBP1 (mus101)
    binding motif, as in vertebrates, and why is Hus1 dispensable for the G2-M checkpoint after X-rays?
- question: Does Hus1-like restrain sensory axon regeneration as part of a loaded 9-1-1 clamp, given that
    the ATR-Chk1 pathway inhibits regeneration without an apparent DNA damage trigger?
suggested_experiments:
- hypothesis: The S-phase checkpoint defect of hus1 reflects failure to activate MEI-41 at stalled forks.
  description: Measure Grapes/Chk1 phosphorylation and RPA/gamma-H2Av foci after HU in hus1, Rad9 and
    mei-41 mutant imaginal discs, with and without a Rad9 C-terminal truncation.
