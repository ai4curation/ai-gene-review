id: Q9VN60
gene_symbol: Hus1-like
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hus1-like encodes the Drosophila ortholog of HUS1, one of the three PCNA-like subunits of
  the Rad9-Rad1-Hus1 (9-1-1) checkpoint clamp that is loaded onto damaged DNA to support ATR-dependent
  checkpoint signaling and DNA repair. Hus1 binds Rad9 directly and links it to Rad1. Overexpressed alone
  it is cytoplasmic, but with Rad9 isoform A and Rad1 it is targeted to the nuclear envelope. hus1 null
  flies are viable but female sterile. They are sensitive to hydroxyurea and methyl methanesulfonate but
  not to X-rays, consistent with an S-phase checkpoint role, and they are not required for the G2-M checkpoint.
  In oogenesis Hus1 is essential for the meiotic checkpoint that responds to unrepaired DSBs and is also
  required for efficient homologous recombination repair of meiotic DSBs, normal synaptonemal complex
  disassembly and karyosome formation.
