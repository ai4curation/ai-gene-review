descriptions:
- source: UniProt
  text: Component of the 9-1-1 checkpoint clamp complex (PubMed:17327271, PubMed:22666434).
    Involved in both meiotic and somatic DNA damage responses (PubMed:17327271). Essential
    for activation of the meiotic checkpoint in response to double-strand DNA breaks;
    required for the S-phase checkpoint but not the G2-M phase checkpoint (PubMed:17327271).
    Involved in double strand break repair by homologous recombination during meiosis;
    influences the organization of chromosomal DNA in the meiotic nucleus (PubMed:17327271,
    PubMed:19501158).
  source_type: curated
