  text: Involved in several processes, including female pronucleus assembly; negative
    regulation of cell cycle phase transition; and oogenesis. Located in cytosol and
    nuclear envelope. Part of checkpoint clamp complex. Is expressed in ovary. Orthologous
    to several human genes including HUS1B (HUS1 checkpoint clamp component B).
