descriptions:
- source: UniProt
  text: Involved in development of tracheal vasculature. Probably involved in halting
    cell migration at the end of vascular tube outgrowth. Possesses E3 ubiquitin ligase
    activity when in complex with Elongin BC complex, Cul2 and Rox1a/Rbx1, and can
    target sima/Hif1a for ubiquitination. May play a critical role in promoting microtubule
    stabilization when tubulins are correctly folded by the prefoldin complex. If
    tubulin is incorrectly folded, may promote its degradation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V3C1
  source_id: Q9V3C1
