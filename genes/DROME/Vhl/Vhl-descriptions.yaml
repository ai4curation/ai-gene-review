    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct on trachea and follicular epithelium, Sima degradation
      and microtubule stabilization. Stabilization of the endocytic factor Awd is
      not covered in the review.
- source: Alliance_Automated
  text: Predicted to enable transcription corepressor activity and ubiquitin-like
    ligase-substrate adaptor activity. Involved in several processes, including microtubule
    cytoskeleton organization; protein export from nucleus; and respiratory system
    development. Part of Cul2-RING ubiquitin ligase complex and VCB complex. Is expressed
    in embryonic/larval tracheal dorsal trunk; embryonic/larval tracheal transverse
    connective; and embryonic/larval visceral tracheal branch. Used to study von Hippel-Lindau
    disease. Human ortholog(s) of this gene implicated in several diseases, including
    pancreatic cancer (multiple); pheochromocytoma; polycythemia (multiple); renal
    cell carcinoma; and von Hippel-Lindau disease. Orthologous to several human genes
    including VHL (von Hippel-Lindau tumor suppressor).
  source_type: automated
