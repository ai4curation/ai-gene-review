      Breathless endocytosis.'
- source: Alliance_Imported
  text: von Hippel-Lindau (Vhl) encodes a protein that regulates morphogenesis of
    trachea and follicular epithelium via its scaffolding functions. It promotes proteosomal
    degradation of the hypoxia inducible factor encoded by sima during normoxia. It
    also promotes vesicle transport via stabilization of microtubules and the endocytic
    factor encoded by awd.
  source_type: curated
  url: https://flybase.org/reports/Vhl.html
  source_id: FB:FBgn0041174
  review:
