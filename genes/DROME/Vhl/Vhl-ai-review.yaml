taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Vhl is the Drosophila ortholog of the von Hippel-Lindau tumor suppressor, the substrate
  receptor of the VCB-Cul2 cullin-RING ubiquitin ligase. Through its BC-box it binds Elongin C (and EloB),
  which links it to Cul2 and the RING protein Roc1a; its beta-domain recognizes the oxygen-dependent degradation
  domain of HIF-alpha (Sima) after prolyl hydroxylation, so that Sima is ubiquitinated and degraded in
  normoxia and its nuclear export is promoted. Through this oxygen-sensing pathway Vhl restrains hypoxia-induced
  tracheal branching. Vhl also has HIF-independent roles: it promotes endocytosis of the FGF receptor
  Breathless during tracheal branch migration and lumen clearance, stabilizes microtubules and aPKC to
  maintain follicular epithelial polarity, and cooperates with the prefoldin subunit Mgr in tubulin quality
  control and spindle assembly.'
