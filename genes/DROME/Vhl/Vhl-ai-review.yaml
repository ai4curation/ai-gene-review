suggested_questions:
- question: Are the HIF-independent Vhl roles in Breathless endocytosis, microtubule stability and tubulin
    quality control mediated by the VCB-Cul2 ligase or by ligase-independent Vhl functions?
suggested_experiments:
- hypothesis: Vhl HIF-independent tracheal and epithelial roles require EloC binding (ligase assembly).
  description: Rescue Vhl mutants with BC-box-mutant Vhl and test tracheal branch migration, Breathless
    surface levels and follicle-cell aPKC localization, alongside Sima stability.
