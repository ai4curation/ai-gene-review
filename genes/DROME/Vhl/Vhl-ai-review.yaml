core_functions:
- description: 'Vhl is the BC-box substrate receptor of the VCB-Cul2 ligase: bound to EloB/C, Cul2 and
    Roc1a, it recognizes prolyl-hydroxylated HIF-alpha/Sima in normoxia and targets it for ubiquitination,
    nuclear export and proteasomal degradation, restraining the hypoxia response.'
