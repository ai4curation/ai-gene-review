core_functions:
- description: >-
    Non-catalytic WD40 subunit specific to the Set1/COMPASS H3K4 methyltransferase
    complex on nuclear chromatin. It is required for H3K4 trimethylation, which marks
    active promoters. Shown experimentally in Drosophila, and inherited from the
    Swd2/WDR82 subfamily (PAINT PTN000458398).
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
