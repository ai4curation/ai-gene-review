id: Q9VLN1
gene_symbol: Wdr82
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Wdr82 (CG17293) is the Drosophila member of the Swd2/WDR82 subfamily of WD40-repeat
  proteins (PANTHER PTHR19861:SF0), the conserved ortholog of yeast Swd2 and human WDR82.
  It is a non-catalytic nuclear protein with a seven-bladed WD40 beta-propeller fold. In
  Drosophila S2 cells, Wdr82 is a specific subunit of the Set1/COMPASS complex, which
  also contains dSet1, Wds (WDR5), Rbbp5, Ash2, Dpy-30L1 and Cfp1 (CXXC1). That complex
  is the major histone H3 lysine 4 trimethyltransferase in flies. Wdr82 is not part of
  the Trx or Trr COMPASS-like complexes. Depleting Wdr82 lowers global H3K4
  trimethylation, and in heart cells it lowers H3K4 dimethylation. Wdr82 also forms a
  separate complex with the nuclear RNA-binding protein Su(sable). Su(s)-Wdr82 blocks
  RNA polymerase II elongation through promoter-proximal repetitive elements at an Hsp70
  locus, and it promotes the down-regulation of the resulting non-canonically
  polyadenylated, unstable transcripts. This resembles the transcription-termination
  roles of yeast Swd2 and human WDR82. Wdr82 also co-purifies with the
  dosage-compensation MSL complex on chromatin. Knocking it down in the heart causes
  lethality at eclosion and defects in cardiac structure and function.
