- term:
    id: GO:0071027
    label: nuclear RNA surveillance
  evidence_type: IDA
  original_reference_id: PMID:26577379
  qualifier: involved_in
  review:
    summary: >-
      Wdr82 knockdown, like Su(s) knockdown, causes unstable, heterogeneously
      polyadenylated transcripts from Hsp70-alpha-beta repeat elements to accumulate.
      Su(s) was already known to promote exosome-mediated degradation of these RNAs, and
      the two proteins act in a common pathway.
    action: ACCEPT
    reason: >-
      Nuclear RNA surveillance covers the termination-coupled clearance of aberrant
      extragenic transcripts that Su(s)-Wdr82 carries out. The authors leave open whether
      Wdr82 acts mainly on termination, on RNA degradation, or on both. Either way it does
      part of the work of the surveillance process: it is a subunit of the complex that
      triggers early termination and RNA turnover, not just a substrate. This is
      experimental fly evidence and was not propagated by PAINT.
    supported_by:
    - reference_id: PMID:26577379
      supporting_text: These results indicate that Su(s) and Wdr82 regulate αβ RNA through a common
        pathway.
    - reference_id: PMID:26577379
      supporting_text: The results presented here indicate that Su(s)-Wdr82 induces transcription
        termination in the promoter-proximal region of Hsp70-αβ through a novel mechanism that
        is coupled to noncanonical polyadenylation and RNA degradation.
