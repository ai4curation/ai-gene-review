- term:
    id: GO:0006338
    label: chromatin remodeling
  evidence_type: IMP
  original_reference_id: PMID:39417277
  qualifier: involved_in
  review:
    summary: >-
      Heart-specific Wdr82 RNAi (4XHand-Gal4, two independent lines) significantly lowered
      H3K4me2 in cardiomyocyte nuclei. Earlier, ubiquitous RNAi had specifically lowered
      H3K4me3 (PMID:21875999). Both results show that Wdr82 is required for Set1/COMPASS
      deposition of H3K4 methylation.
    action: ACCEPT
    reason: >-
      In current GO, histone-modification processes such as H3K4 methylation are covered
      by chromatin remodeling (GO:0006338). The specific process terms were obsoleted in
      favour of MF terms (for example GO:0051568 is obsolete). So this is the right
      process level for a Set1/COMPASS subunit that is needed for H3K4 methylation, and it
      is a core role of the gene. The two fly papers disagree on which methylation state
      is affected (me3 in whole animals or cells, me2 in heart nuclei). Both show
      participation in Set1C-mediated H3K4 methylation.
    supported_by:
    - reference_id: PMID:39417277
      supporting_text: Wdr82-RNAi did not change H3K4me1 levels, but significantly reduced H3K4me2
    - reference_id: PMID:21875999
      supporting_text: we observed a significant reduction only in the levels of H3K4 trimethylation,
        but not of dimethylation
- term:
    id: GO:0007507
    label: heart development
  evidence_type: IMP
  original_reference_id: PMID:39417277
  qualifier: involved_in
  review:
    summary: >-
      Hand-Gal4-driven Wdr82 RNAi caused high lethality at eclosion, a shortened adult
      lifespan, disorganised cardiac actin filaments, reduced myofibre density and changed
      systolic and diastolic diameters.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is real and was reproduced with two RNAi lines. Wdr82, however, is a
      general subunit of the major H3K4 trimethyltransferase complex and is expressed
      broadly. The heart defects follow from losing Set1/COMPASS activity in cardiac cells.
      They do not reflect a heart-specific activity, and the same paper reports the same
      defects for every COMPASS subunit tested. The term is kept as a non-core,
      pleiotropic developmental consequence rather than as the gene's function.
    supported_by:
    - reference_id: PMID:39417277
      supporting_text: Together these findings show that each of the three unique COMPASS complex
        components, Wdr82, Mnn1, and Ptip, is required for normal heart structure and function.
- term:
    id: GO:0032785
    label: negative regulation of DNA-templated transcription, elongation
  evidence_type: IDA
  original_reference_id: PMID:26577379
  qualifier: involved_in
  review:
    summary: >-
      Pol II ChIP showed that Wdr82 knockdown, like Su(s) knockdown, increased Pol II
      occupancy downstream of the promoter-proximal region of heat-shocked
      Hsp70-alpha-beta elements, without changing promoter pausing or recruitment.
      Su(s)-Wdr82 therefore blocks elongation into these regions, coupled to termination
      and degradation of the RNA.
    action: ACCEPT
    reason: >-
      These are direct fly data on this gene. The phenotype is a specific
      transcriptional readout (Pol II distribution), not a downstream organismal
      phenotype. The role matches the conserved transcription-termination function of
      yeast Swd2. That function was not propagated by PAINT, so in Drosophila it rests on
      this experimental evidence.
    supported_by:
    - reference_id: PMID:26577379
      supporting_text: These results demonstrate that Su(s) and Wdr82 block elongation into the
        downstream region of Hsp70-αβ.
    - reference_id: PMID:15024081
      supporting_text: The essential WD repeat protein Swd2 has dual functions in RNA polymerase
        II transcription termination and lysine 4 methylation of histone H3.
