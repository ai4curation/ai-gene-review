  review:
    summary: >-
      PAINT node PTN000458398 (Swd2/WDR82 subfamily, PTHR19861:SF0) propagates chromatin
      binding from mouse Wdr82. Q9VLN1 is a member of this subfamily. Mammalian WDR82
      associates with chromatin in an H2B-ubiquitination-dependent manner. In fly,
      ChIP-MS recovers Wdr82 in chromatin-associated protein complexes.
    action: ACCEPT
    reason: >-
      Q9VLN1 is inside the clade (PTHR19861:SF0) where PAINT placed the IBD, and there is
      no evidence that Drosophila Wdr82 has lost or changed the function. Chromatin
      association is the established molecular role of this non-catalytic WD40 subunit:
      it links Set1/COMPASS and the Su(s) termination machinery to transcribed chromatin.
      The fly ChIP-MS data agree with this. No more specific MF term (for example a
      defined histone-mark reader activity) has been shown for the fly protein.
    supported_by:
    - reference_id: PMID:18838538
      supporting_text: Wdr82, which associates with chromatin in a histone H2B ubiquitination-dependent
        manner, is a specific component of Set1 complexes but not that of MLL1-4 complexes.
