    supporting_text: These results demonstrate that Su(s) and Wdr82 block elongation into the downstream
      region of Hsp70-αβ.
  - reference_id: PMID:26577379
    supporting_text: These experiments confirm that Su(s) and Wdr82 interact stably with each other.
suggested_questions:
- question: >-
    Should fly Wdr82 carry contributes_to histone H3K4 trimethyltransferase activity
    (GO:0140999)? FLAG-Wdr82 complexes methylate H3K4 in vitro and Wdr82 RNAi lowers
    H3K4me3 (PMID:21875999), but neither FlyBase nor the PAINT node for the subfamily
    asserts any methyltransferase-related MF.
- question: >-
    Does Su(s)-Wdr82 act mainly by triggering Pol II termination or by targeting the
    nascent RNA for exosome degradation? And is it a functional counterpart of the
    mammalian ZC3H4-WDR82 complex?
- question: >-
    Why does Wdr82 depletion reduce H3K4me3 in whole animals or cells (PMID:21875999)
    but H3K4me2 in cardiomyocyte nuclei (PMID:39417277)?
suggested_experiments:
- description: >-
    Make Wdr82 point mutants that separately disrupt binding to dSet1 and to Su(s), then
    measure promoter H3K4me3 and Hsp70-alpha-beta readthrough transcription. This would
    show whether the two roles can be separated.
  experiment_type: genetic perturbation
- description: >-
    Run tagged Wdr82 and CG3515 side by side in affinity purification-mass spectrometry
    from testis and S2 cells. Compare their Set1/COMPASS and Su(s) partners to see which
    Wdr82 functions the paralog keeps.
  experiment_type: proteomics
