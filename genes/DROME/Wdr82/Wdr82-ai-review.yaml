    label: nucleus
  in_complex:
    id: GO:0048188
    label: Set1C/COMPASS complex
  supported_by:
  - reference_id: PMID:21875999
    supporting_text: MudPIT analysis of dWdr82-FLAG eluate showed the presence of all the homologous
      components of yeast COMPASS and human COMPASS, namely, dSet1, dCXXC1, dDpy30, dRbbp5, Ash2,
      and Wds
  - reference_id: PMID:21875999
    supporting_text: we observed a significant reduction only in the levels of H3K4 trimethylation,
      but not of dimethylation
- description: >-
    Partner of Su(sable) in a nuclear complex that stops Pol II elongation through
    promoter-proximal repetitive elements and promotes termination-coupled clearance of
    the aberrant transcripts. Shown experimentally in Drosophila S2 cells. This role is
    not propagated by PAINT to the subfamily.
  directly_involved_in:
  - id: GO:0032785
    label: negative regulation of DNA-templated transcription, elongation
  - id: GO:0071027
    label: nuclear RNA surveillance
  locations:
