- source: Alliance_Automated
  text: Predicted to enable chromatin binding activity. Involved in several processes,
    including heart development; negative regulation of DNA-templated transcription,
    elongation; and nuclear RNA surveillance. Located in nucleus. Part of Set1C/COMPASS
    complex. Is expressed in several structures, including adult head; central brain
    primordium; ganglia; larval central nervous system; and ventral nerve cord primordium.
    Used to study congenital heart disease. Orthologous to human WDR82 (WD repeat
    domain 82).
