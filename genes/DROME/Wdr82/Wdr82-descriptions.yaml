descriptions:
- source: UniProt
  text: Component of the SET1 complex that specifically di- and trimethylates 'Lys-4'
    of histone H3 (PubMed:21694722, PubMed:21875999). Together with su(sable), part
    of a transcription termination checkpoint that promotes transcription termination
    of aberrant RNAs and their subsequent degradation by the nuclear exosome (PubMed:26577379).
  source_type: curated
