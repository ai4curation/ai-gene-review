- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including learning; regionalization; and regulation of signal transduction. Located
    in several cellular components, including female germline ring canal; fusome;
    and microtubule cytoskeleton. Part of beta-catenin destruction complex. Is expressed
    in several structures, including brain; epithelium; germ layer; gut section; and
    synaptic neuropil domain. Used to study Alzheimer's disease and neurodegenerative
    disease. Human ortholog(s) of this gene implicated in several diseases, including
    bipolar disorder; endometrial disease; neurodegenerative disease (multiple); oral
    squamous cell carcinoma; and schizophrenia. Orthologous to several human genes
    including GSK3B (glycogen synthase kinase 3 beta).
