descriptions:
- source: UniProt
  text: Required for several developmental events such as syncytial blastoderm formation
    and embryonic segmentation. Is involved in transcriptional regulation. Required
    for arm phosphorylation. Wg signaling operates by inactivating the sgg repression
    of en autoactivation. Negatively controls the neuromuscular junction (NMJ) growth
    in presynaptic motoneurons. Plays a role in the regulation of microtubule dynamics
    and actin cytoskeleton during embryogenesis. Required for phosphorylation of sra
    in activated eggs. Essential for completion of meiosis, possibly by triggering
    calcineurin activation via sra phosphorylation. Phosphorylates microtubule-associated
    protein futsch in axons.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P18431
  source_id: P18431
