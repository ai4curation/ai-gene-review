id: P18431
gene_symbol: sgg
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Shaggy (Sgg; also zeste-white 3, Zw3) is the Drosophila ortholog of glycogen synthase kinase-3
  (GSK3A/GSK3B), a CMGC-family protein serine/threonine kinase expressed maternally and zygotically as
  several splice isoforms. Sgg characteristically phosphorylates substrates that have been primed by another
  kinase, generating phospho-degrons or otherwise altering substrate stability and localisation. As the
  kinase of the cytoplasmic Axin/APC destruction complex it phosphorylates Armadillo (beta-catenin) after
  CK1alpha priming, targeting it for SCF(Slimb)-mediated degradation; Sgg is therefore the classic negative
  regulator of Wingless/canonical Wnt signalling, and sgg loss phenocopies constitutive Wingless signalling
  in embryonic segment polarity, wing margin and bristle patterning. In Hedgehog signalling, Sgg is recruited
  by the kinesin-related scaffold Costal2 and phosphorylates PKA-primed Cubitus interruptus, promoting
  its processing to the repressor form. Sgg also phosphorylates Timeless to control PER/TIM nuclear entry
  and circadian period, phosphorylates the Mad linker to restrict BMP signalling, promotes dMyc degradation
  downstream of insulin/TOR inhibition, phosphorylates Sarah/RCAN to activate calcineurin for completion
  of female meiosis, and acts presynaptically through the microtubule-associated protein Futsch to limit
  neuromuscular junction growth. Sgg is found in the cytoplasm/cytosol and nucleus, and is enriched at
  centrosomes, the mitotic spindle and presynaptic terminals.
