  review:
    summary: Sgg binds the scaffold Axin within the destruction complex.
    action: REMOVE
    reason: The Axin–Sgg interaction is real and is the physical basis of destruction-complex assembly
      (full text verified), but bare 'protein binding' carries no functional information and GO has no
      informative Axin-binding MF term. The biology is captured by the beta-catenin destruction complex
