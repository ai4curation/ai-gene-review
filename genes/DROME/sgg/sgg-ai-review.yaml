suggested_questions:
- question: Which of Sgg's many substrate-specific roles (Arm, Ci, Mad, TIM, dMyc, Sarah, Futsch) are
    carried out by distinct isoforms (e.g. caspase-activated Sgg46 versus the major zygotic isoform),
    and should isoform-specific annotations be captured?
- question: Should the Hedgehog/Ci and circadian/TIM roles of Sgg, which are well supported in fly, be
    considered for PAINT propagation at a bilaterian node of PTHR24057 alongside the metazoan Wnt terms,
    or are they lineage-specific substrate wirings?
- question: Is the Axin-Sgg interaction worth a dedicated GO molecular-function term (e.g. scaffold-dependent
    kinase recruitment), given that protein binding is uninformative and beta-catenin destruction complex
    membership captures only the location?
suggested_experiments:
- hypothesis: Sgg phosphorylates Timeless directly at primed sites in vivo, and those sites are required
    for normal circadian period.
  description: Map Sgg-dependent TIM phosphosites by quantitative phosphoproteomics in sgg hypomorphs
    versus overexpression, then test phospho-null/phospho-mimetic TIM knock-in alleles for period length
    and PER/TIM nuclear entry timing.
- hypothesis: The presynaptic NMJ function of Sgg depends on direct phosphorylation of Futsch at primed
    sites.
  description: Generate Futsch phosphosite mutants at candidate GSK3 sites by genome editing and test
    whether they phenocopy or suppress sgg loss-of-function bouton overgrowth and microtubule loop formation.
