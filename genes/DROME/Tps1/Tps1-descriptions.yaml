descriptions:
- source: Alliance_Imported
  text: Trehalose-6-phosphate synthase 1 (Tps1) encodes the trehalose synthesis enzyme
    with an N-terminal trehalose-6-phosphate (T6P) synthase domain that catalyzes
    the production of T6P using glucose-6-phosphate and UDP-glucose. Its C-terminal
    T6P phosphatase domain dephosphorylates T6P to generate trehalose.
  source_type: curated
  url: https://flybase.org/reports/Tps1.html
  source_id: FB:FBgn0027560
