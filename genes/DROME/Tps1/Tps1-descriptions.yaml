    overall_notes: 'Correct and specific on both domains: T6P synthase from G6P and
      UDP-glucose, and T6P phosphatase to trehalose.'
- source: Alliance_Automated
  text: Enables alpha,alpha-trehalose-phosphate synthase (UDP-forming) activity and
    trehalose-phosphatase activity. Involved in trehalose biosynthetic process. Predicted
    to be located in cytoplasm. Predicted to be active in cytosol. Is expressed in
    adult head; adult heart; spermatozoon; and yolk nucleus.
