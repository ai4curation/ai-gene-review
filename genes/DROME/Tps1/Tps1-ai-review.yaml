taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tps1 encodes the Drosophila trehalose-6-phosphate synthase/phosphatase, a bifunctional cytosolic
  enzyme with an N-terminal glycosyltransferase family 20 synthase (TPS) domain and a C-terminal haloacid
  dehalogenase-like trehalose-6-phosphate phosphatase (TPP) domain. The TPS domain transfers glucose from
  UDP-glucose to glucose-6-phosphate to form trehalose-6-phosphate, and the TPP domain dephosphorylates
  it to trehalose; both domains are required. Expressed mainly in the fat body, Tps1 is solely responsible
  for de novo synthesis of trehalose, the main hemolymph sugar. Tps1 mutants lack trehalose, are sensitive
  to starvation and to low-sugar diets, have reduced circulating glucose and poor desiccation tolerance,
  and die before eclosion.
