suggested_questions:
- question: Does trehalose-6-phosphate act as a signaling metabolite in Drosophila, as it does in yeast
    and plants, and does Tps1 activity feed back on glycolytic flux in the fat body?
suggested_experiments:
- description: Express TPS-only and TPP-dead Tps1 variants in Tps1 nulls and measure trehalose-6-phosphate,
    glycolytic intermediates and growth on low-sugar diets.
