suggested_questions:
- question: Why does dietary glucosamine-6-phosphate rescue gfat2 but not gfat1 null flies? Is this due to tissue
    access (e.g. epidermis and trachea), timing of the embryonic requirement, or a Gfat1 role beyond GlcN6P supply?
- question: Are Gfat1 and Gfat2 subject to the same UDP-GlcNAc feedback and kinase regulation (PKA, AMPK) in vivo,
    and does this explain their non-redundant tissue requirements?
suggested_experiments:
- description: Purify recombinant Gfat1-PA and Gfat2 and compare kinetic parameters, UDP-GlcNAc inhibition constants,
    and the effects of PKA/AMPK phosphorylation-site mutants.
- description: Rescue gfat1 null embryos with tissue-restricted (epidermal, tracheal) UAS-Gfat1 versus UAS-Gfat2,
    or with a catalytic Cys2Ala mutant, to test whether the zygotic requirement is purely catalytic and tissue-autonomous.
