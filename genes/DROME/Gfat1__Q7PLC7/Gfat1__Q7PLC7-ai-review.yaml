gene_symbol: Gfat1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Gfat1 (zeppelin) encodes glutamine:fructose-6-phosphate amidotransferase 1, one of two Drosophila
  GFAT paralogs (with Gfat2). It catalyses the first committed, rate-limiting step of the hexosamine biosynthetic
  pathway: D-fructose 6-phosphate + L-glutamine -> D-glucosamine 6-phosphate + L-glutamate. This step supplies UDP-N-acetylglucosamine
  for chitin synthesis, glycosylation and O-GlcNAcylation. The full-length 694-residue Gfat1-PA protein has an N-terminal
  glutamine amidotransferase type-2 (Ntn) domain, whose Cys2 nucleophile releases ammonia from glutamine, and two
  C-terminal SIS isomerase domains that bind sugar phosphates and convert fructose 6-phosphate to glucosamine 6-phosphate.
  The fly enzyme expressed in yeast is active, is feedback-inhibited by UDP-GlcNAc and is regulated by PKA. It is
  a soluble cytosolic protein. Gfat1 is essential: zygotic loss gives embryonic lethality with an expanded ("blimp")
  cuticle, consistent with a shortfall of chitin precursor, and it is required in the trachea. Gfat1 and Gfat2 transgenes
  rescue each other''s mutants, but the two genes differ in embryonic expression and tissue requirements. The gene
  lies in 3R pericentric heterochromatin in D. melanogaster.'
