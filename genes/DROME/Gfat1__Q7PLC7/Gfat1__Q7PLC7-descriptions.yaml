    overall_notes: 'Correct for the full-length enzyme: fructose 6-phosphate to glucosamine
      6-phosphate for UDP-GlcNAc, chitin and glycosylation. Calls the amidotransferase
      reaction a transamination; no regulation or phenotype.'
- source: Alliance_Automated
  text: Enables L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity.
    Involved in UDP-N-acetylglucosamine metabolic process. Located in cytoplasm. Is
    active in cytosol. Is expressed in several structures, including adult fat body;
    adult head; embryonic head epidermis; epidermis; and gland. Human ortholog(s)
    of this gene implicated in congenital myasthenic syndrome 12; familial hyperlipidemia;
    glucose metabolism disease (multiple); kidney disease; and obesity. Orthologous
    to several human genes including GFPT2 (glutamine--fructose-6-phosphate transaminase
    2).
