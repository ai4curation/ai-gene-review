descriptions:
- source: Alliance_Imported
  text: Glutamine:fructose-6-phosphate aminotransferase 1 (Gfat1) encodes an enzyme
    that catalyzes the transamination of fructose 6-phosphate to D-glucosamine 6-phosphate.
    It is involved in the biosynthesis of UDP-N-acetylglucosamine, a precursor for
    chitin biosynthesis and protein glycosylation.
  source_type: curated
  url: https://flybase.org/reports/Gfat1.html
