- source: Alliance_Automated
  text: Predicted to enable ferric iron binding activity and ferrous iron binding
    activity. Involved in intracellular iron ion homeostasis. Is active in mitochondrial
    matrix. Is expressed in adult Malpighian tubule; adult gut; anterior-posterior
    subdivision of organism; spermatozoon; and testis. Used to study candidiasis.
    Human ortholog(s) of this gene implicated in several diseases, including basal
    ganglia disease; hemochromatosis type 5; hyperferritinemia-cataract syndrome;
    iron metabolism disease; and neurodegeneration with brain iron accumulation (multiple).
    Orthologous to several human genes including FTHL17 (ferritin heavy chain like
    17) and FTMT (ferritin mitochondrial).
  source_type: automated
