gene_symbol: Fer3HCH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Fer3HCH encodes the Drosophila mitochondrial ferritin, an H-type ferritin subunit expressed
  mainly in testis and produced from an intron-containing gene. It carries an N-terminal mitochondrial
  targeting sequence and localizes to mitochondria, and it retains the conserved H-chain ferroxidase-center
  residues, so it is expected to oxidize Fe(2+) and store iron as a ferric core inside mitochondria, analogous
  to mammalian mitochondrial ferritin. Overexpression of Fer3HCH does not change total body iron or iron
  bound to secreted ferritin but reduces the viability of iron-deficient flies, consistent with sequestration
  of mitochondrial iron.
