suggested_questions:
- question: What is the physiological role of testis-enriched mitochondrial ferritin, for example protection
    of spermatogenic mitochondria from iron-driven oxidative damage?
- question: Does Fer3HCH form homopolymeric 24-mer cages in the mitochondrial matrix, as mammalian FTMT
    does?
suggested_experiments:
- hypothesis: Fer3HCH protects male germline mitochondria from iron-induced oxidative stress.
  description: Generate Fer3HCH null flies and assess male fertility, testis mitochondrial iron (for example
    with mitochondrial iron sensors), aconitase activity and oxidative damage under dietary iron loading.
