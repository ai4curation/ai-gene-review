core_functions:
- molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  description: Notch-induced bHLH-O repressor that binds N-box/class C E-box sites as homo- or heterodimer
    and represses proneural (Ac/Sc-Da) activated transcription, implementing lateral inhibition.
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0050767
    label: regulation of neurogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8078474
    supporting_text: We found that two products of the complex, HLH-M5 and ENHANCER OF SPLIT, are capable
      of binding as homo-and heterodimers to a sequence in the promoters of the Enhancer of split and
      achaete genes, called the N-box, which differs slightly from the consensus binding site (the E-box)
      for other bHLH proteins.
  - reference_id: PMID:8078474
    supporting_text: In transient expression assays in cell culture, both proteins were found to attenuate
      the transcriptional activation mediated by the proneural bHLH proteins LETHAL OF SCUTE and DAUGHTERLESS
      at the Enhancer of split promoter.
  - reference_id: PMID:10373509
    supporting_text: The most immediate transcriptional target genes of Notch activation in Drosophila
      melanogaster encode seven bHLH proteins (Mδ, Mβ, Mγ, M3, M5 M7, and M8) which are clustered in the
      Enhancer of split complex [ E(spl)-C ] ( 14 , 36 , 37 ).
- molecular_function:
    id: GO:0001222
    label: transcription corepressor binding
  description: Recruits the corepressor Groucho via its C-terminal WRPW motif; Groucho is required for
    all E(spl)-mediated repression.
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9371806
    supporting_text: It does interact with the non-HLH protein Groucho, which itself interacts with all
      E(spl) basic HLH proteins, but with none of the proneural proteins or Da.
  - reference_id: PMID:12466194
    supporting_text: Irrespective of whether E(spl) are recruited via direct DNA binding or interaction
      with proneural proteins, the co-repressor Groucho is always needed for target gene repression.
suggested_questions:
- question: Should Notch-target bHLH-O repressors such as E(spl)m8 be annotated to the Notch signaling
    pathway itself, or only to the downstream repression processes? (GO convention differs between HES
    family members across species.)
- question: How much of m8's function is redundant with the other six E(spl) bHLH proteins, and which
    specific properties (CK2 site, bristle-biased activity) are unique to the m5/m7/m8 subgroup?
suggested_experiments:
- description: Generate single-gene E(spl)m8 null alleles (e.g. CRISPR) and phospho-site (S159A/D) knock-ins
    to test its non-redundant contribution to SOP and R8 lateral inhibition.
  experiment_type: CRISPR knock-in genetics
