    reason: E(spl)m8 is a Notch-induced inhibitor of neural fate in proneural clusters; regulation of
      neurogenesis is an appropriate process.
    supported_by:
    - reference_id: PMID:15975935
      supporting_text: SOPs use N signaling to activate in neighboring PNC cells the expression of multiple
        genes that inhibit the SOP fate.
    - reference_id: PMID:10373509
      supporting_text: Furthermore, Mβ, M8, M7, and Mδ are all able to suppress both veins and sensory
        organ development when ectopically expressed in the imaginal discs ( 12 , 47 , 63 ), although
        some degree of specificity in function has been observed ( 12 , 40 ).
