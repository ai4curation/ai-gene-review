id: P13098
gene_symbol: E(spl)m8-HLH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: E(spl)m8-HLH (Enhancer of split m8; the original 'Enhancer of split' protein) is one of seven
  basic helix-loop-helix-Orange (bHLH-O, HES family) transcriptional repressors encoded by the Enhancer
  of split complex of Drosophila. Its transcription is directly activated by Notch/Su(H) signalling, making
  it a primary Notch target and effector. m8 forms homo- and heterodimers (e.g. with E(spl)m5), binds
  N-box/E-box-like class C sites (optimal site TGGCACGTG(C/T)(C/T)A) in target promoters such as achaete
  and E(spl) genes, and recruits the corepressor Groucho through its C-terminal WRPW motif to repress
  proneural (Achaete/Scute-Daughterless) driven transcription. It thereby implements Notch-mediated lateral
  inhibition, restricting sensory organ precursor and R8 photoreceptor fate in the peripheral nervous
  system and eye. m8 is phosphorylated by CK2 at Ser159, a site predicted to be shared only with m5 and
  m7.
