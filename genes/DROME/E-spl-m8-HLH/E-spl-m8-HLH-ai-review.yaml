  review:
    summary: Anterior/posterior pattern specification is propagated from vertebrate HES/Her segmentation-clock
      genes (PTN000105428).
    action: MARK_AS_OVER_ANNOTATED
    reason: The node's experimental support is from vertebrate Hes/Her genes acting in the somite segmentation
      clock. Drosophila segmentation is driven by the gap/pair-rule hierarchy and is Notch-independent,
      and E(spl)m8 functions are documented in neural lateral inhibition, not A/P patterning. The vertebrate-specific
      somitogenesis role is unlikely to apply to fly E(spl)m8.
    supported_by:
    - reference_id: PMID:10373509
      supporting_text: The most immediate transcriptional target genes of Notch activation in Drosophila
        melanogaster encode seven bHLH proteins (Mδ, Mβ, Mγ, M3, M5 M7, and M8) which are clustered in
        the Enhancer of split complex [ E(spl)-C ] ( 14 , 36 , 37 ).
    - reference_id: PMID:10373509
      supporting_text: Furthermore, Mβ, M8, M7, and Mδ are all able to suppress both veins and sensory
        organ development when ectopically expressed in the imaginal discs ( 12 , 47 , 63 ), although
        some degree of specificity in function has been observed ( 12 , 40 ).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000105428
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Experimental descendants are vertebrate Hes/Her segmentation-clock genes (plus one C.
          elegans gene); the somitogenesis role is supported for them but Drosophila segmentation is Notch-independent
          and no fly E(spl) gene is a donor for this term.
