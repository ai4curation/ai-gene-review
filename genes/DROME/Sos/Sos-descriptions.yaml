    overall_notes: 'Correct: Ras GEF in Sevenless and EGFR signaling. Older text;
      no Drk recruitment or Torso.'
- source: Alliance_Automated
  text: Enables guanyl-nucleotide exchange factor activity. Involved in several processes,
    including cell surface receptor protein tyrosine kinase signaling pathway; open
    tracheal system development; and positive regulation of small GTPase mediated
    signal transduction. Located in cytosol and rhabdomere microvillus membrane. Is
    extrinsic component of cytoplasmic side of plasma membrane. Is expressed in embryonic/larval
    tracheal section; larval central nervous system; leg; spermatozoon; and tarsal
    segment. Human ortholog(s) of this gene implicated in Noonan syndrome (multiple);
    atrial heart septal defect; gingival fibromatosis (multiple); and pulmonary valve
    stenosis. Orthologous to several human genes including SOS1 (SOS Ras/Rac guanine
    nucleotide exchange factor 1).
  source_type: automated
