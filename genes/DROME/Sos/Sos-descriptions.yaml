descriptions:
- source: UniProt
  text: Promotes the exchange of Ras-bound GDP by GTP. Functions in signaling pathways
    initiated by the sevenless and epidermal growth factor receptor tyrosine kinases;
    implies a role for the ras pathway in neuronal development.
  source_type: curated
