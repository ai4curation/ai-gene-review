id: P26675
gene_symbol: Sos
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Sos encodes the Drosophila Son of sevenless Ras guanine-nucleotide exchange
  factor. Drk recruits Sos to activated receptor tyrosine kinase complexes,
  where Sos promotes GDP release from Ras85D to activate Ras-dependent Raf/MAPK
  signaling downstream of EGFR, Sevenless, Torso, Pvr, and FGF receptors. Sos
  also links receptors to Rac activation in axon guidance and cytoskeletal
  contexts.
