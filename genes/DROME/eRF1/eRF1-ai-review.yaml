id: Q9VPH7
gene_symbol: eRF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: eRF1 is the Drosophila class I eukaryotic peptide chain release factor. In the ribosomal
  A site it recognizes all three stop codons (UAA, UAG, UGA) and, through its conserved GGQ motif, triggers
  hydrolysis of peptidyl-tRNA to release the nascent polypeptide. eRF1 is delivered to terminating ribosomes
  in a complex with the GTPase eRF3. Its GGQ glutamine is methylated by HemK2, which is needed for efficient
  protein synthesis and mRNA stability in the female germline, and eRF1 loss-of-function alleles cause
  maternal-effect nonsense suppression and larval lethality.
