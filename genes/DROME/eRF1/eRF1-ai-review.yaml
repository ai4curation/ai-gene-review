- hypothesis: Unmethylated eRF1 slows termination and causes ribosome collisions at stop codons in germline
    cells.
  description: Ribosome profiling and disome profiling of ovaries expressing GGQ-methylation-deficient
    eRF1, scoring stop-codon dwell time and 3' UTR readthrough.
  experiment_type: ribosome profiling
