knowledge_gaps:
- gap_statement: >-
    The molecular activity, subcellular location and biological role of CG13494 are entirely
    unknown. It is a young, melanogaster-group-restricted gene with no recognised domain, so no
    function can be transferred from a characterised homolog. Whether the predicted transmembrane
    helix is a real membrane anchor, and on which membrane, has not been tested.
  boundary: >-
    Established: a 120-residue product with one Phobius-predicted transmembrane helix (37-61), a
    Gly/Cys-rich C-terminal tail, orthologs only within the melanogaster species group (OMA), no
    InterPro signature, and testis/spermatid-enriched transcript expression (Bgee). No
    gene-specific publication exists. An OpenScientist run (kgap-cg13494-origin-and-features) predicts a
    small single-pass membrane peptide with disordered flanks and no folded domain, not a secreted protein
    (internal hydrophobic helix, no signal peptide). Coding sequences in four melanogaster-group species
    translate to the annotated protein and show purifying selection (dN/dS about 0.13 to 0.28), and the
    invariant transmembrane core IICLP[LI]LC (present in the local UniProt sequence) defines orthologs in
    six species. The gene is reported as intronless with no overlapping gene, and syntenic outgroups carry
    only the neighbouring CG43405, so de novo origin beside CG43405 is favoured over tandem duplication.
    Public orthology groups that link it to unrelated proteins are composition artefacts. Molecular
    activity remains unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: NARROWING
  provenance:
