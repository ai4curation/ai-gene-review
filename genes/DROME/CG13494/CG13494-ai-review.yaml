id: Q8MZA7
gene_symbol: CG13494
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG13494 encodes a 120-residue protein found only in the Drosophila melanogaster species group,
  with orthologs in close relatives such as D. simulans, D. yakuba, D. erecta and D. suzukii. It has
  a Ser/Thr-rich N-terminal segment, a single predicted transmembrane helix (residues 37-61), and a
  low-complexity C-terminal tail rich in glycine, cysteine and aspartate (20 cysteines in total). It
  has no recognised protein family or domain and no characterised homolog in any species. Its
  transcript is reported mainly in testis, in elongating spermatids. Nothing is known experimentally
  about its molecular activity, subcellular location or biological role; the transmembrane helix
  suggests a membrane-anchored protein.
