knowledge_gaps:
- gap_statement: >-
    The molecular activity, subcellular location and biological role of CG13494 are entirely
    unknown. It is a young, melanogaster-group-restricted gene with no recognised domain, so no
    function can be transferred from a characterised homolog. Whether the predicted transmembrane
    helix is a real membrane anchor, and on which membrane, has not been tested.
  boundary: >-
    Established: a 120-residue product with one Phobius-predicted transmembrane helix (37-61), a
    Gly/Cys-rich C-terminal tail, orthologs only within the melanogaster species group (OMA), no
    InterPro signature, and testis/spermatid-enriched transcript expression (Bgee). No
    gene-specific publication exists.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
suggested_questions:
- question: >-
    Is CG13494 a de novo or rapidly evolving testis gene of the melanogaster group, and does its
    Gly/Cys-rich tail point to a structural role in the spermatid or sperm (for example, a
    disulfide-crosslinked component like the cysteine-rich sperm and keratin-associated proteins it
    resembles only in composition)?
- question: >-
    Should a membrane (GO:0016020) annotation be made from the Phobius transmembrane prediction
    alone, given that the 25-residue hydrophobic segment carries four cysteines and sits between two
    low-complexity regions?
suggested_experiments:
- description: >-
    Tag endogenous CG13494 (CRISPR knock-in) and image it in testes to find where in the
    spermatid it localises, with membrane fractionation to test whether the predicted helix
    anchors it.
  experiment_type: Endogenous tagging, microscopy and fractionation
- description: >-
    Make a CRISPR null allele and test male fertility and sperm development (sperm counts, sperm
    storage, competition), with genomic rescue to rule out effects on neighbouring genes.
  experiment_type: CRISPR knockout and fertility assays
