    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Homology-based account of the MUS81-EME1 nuclease substrates (3'-flaps,
      D-loops, forks, nicked HJs). Hedged meiotic role conflicts with fly data that
      MUS81 is not needed for meiotic crossovers, and it names EME1 rather than fly
      MMS4.
