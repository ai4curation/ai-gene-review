descriptions:
- source: UniProt
  text: Interacts with EME1 to form a DNA structure-specific endonuclease with substrate
    preference for branched DNA structures with a 5'-end at the branch nick. Typical
    substrates include 3'-flap structures, D-loops, replication forks and nicked Holliday
    junctions. May be required in mitosis for the processing of stalled or collapsed
    replication fork intermediates. May be required in meiosis for the repair of meiosis-specific
    double strand breaks subsequent to single- end invasion (SEI).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V3T1
  source_id: Q9V3T1
  review:
    reviewer: AI
    rubrics:
