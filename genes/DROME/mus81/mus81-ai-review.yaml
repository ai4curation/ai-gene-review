- term:
    id: GO:0031297
    label: replication fork processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00086530
  review:
    summary: >-
      ARBA annotation to replication fork processing. In flies the Blm synthetic
      lethality is interpreted as failure to process replication-fork structures, and
      camptothecin sensitivity points to replication-associated breaks.
    action: ACCEPT
    reason: >-
      Fork cleavage is the conserved in vivo role of MUS81, and the fly double-mutant
      analyses converge on processing of blocked or regressed forks as the function that
      becomes essential without BLM. The fly evidence is genetic and model-based.
    supported_by:
    - reference_id: PMID:22022278
      supporting_text: This suggests that synthetic lethality between Gen and mus309 and
        between mus81 and mus309 are not due to inability to dissolve dHJs or disrupt
        D-loops, but to inability to process replication fork structures.
- term:
    id: GO:0031573
    label: mitotic intra-S DNA damage checkpoint signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000335543
  - PomBase:SPCC4G3.05c
  review:
    summary: >-
      Phylogenetic inference of a role in intra-S checkpoint signalling, grounded in
      S. pombe Mus81, which acts downstream of Cds1 in checkpoint-dependent slowing of
      replication.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PomBase:SPCC4G3.05c
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mus81 acts downstream of Cds1 in checkpoint-dependent replication slowing in S. pombe, as an effector of the checkpoint kinase rather than a signalling component.
    reason: >-
      Mus81 is an effector of the Cds1 checkpoint kinase, not a component of
      checkpoint signalling: in fission yeast it is a downstream target that acts in
      checkpoint-dependent slowing of replication. In Drosophila there is no evidence
      for a checkpoint role, and fly mus81 mutants are, if anything, hyposensitive to
      HU, which argues against an inherited checkpoint signalling function. The node
      places an effector role under a signalling term.
    supported_by:
    - reference_id: PMID:28369583
      supporting_text: These data indicate that in flies, DmGen facilitates repair of
        HU-induced stalled or slowed replication forks, whereas Mus81 may exacerbate
        problems caused by HU.
