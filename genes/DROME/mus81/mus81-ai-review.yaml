- id: PMID:22022278
  title: Three structure-selective endonucleases are essential in the absence of BLM
    helicase in Drosophila.
  findings:
  - statement: MUS81-MMS4, GEN and MUS312-SLX1 are each essential in the absence of BLM
      (mus309); mus81; mus309 double mutants die as pharate adults.
    supporting_text: Therefore, three putative HJ resolvases – MUS81–MMS4, GEN, and
      MUS312–SLX1 are essential in the absence of DmBLM.
  - statement: The authors attribute mus81; mus309 lethality to failure to process
      replication fork structures.
    supporting_text: This suggests that synthetic lethality between Gen and mus309 and
      between mus81 and mus309 are not due to inability to dissolve dHJs or disrupt
      D-loops, but to inability to process replication fork structures.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3192830); source of the FlyBase IGI DNA repair row
      with mus309.
- id: PMID:17603121
  title: Synthetic lethality of Drosophila in the absence of the MUS81 endonuclease and
    the DmBlm helicase is associated with elevated apoptosis.
  findings:
  - statement: Drosophila MUS81-MMS4 has no detectable role in meiotic crossing over.
    supporting_text: Unlike the case in fungi, we did not find any role for MUS81-MMS4
      in meiotic crossing over.
  - statement: mus81 and mms4 mutants are hypersensitive to camptothecin but not to
      other replication-blocking agents.
    supporting_text: A possible role for this endonuclease in repairing double-strand
      breaks that arise during DNA replication is suggested by the finding that mus81
      and mms4 mutants are hypersensitive to camptothecin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC1950608); primary characterisation of fly mus81
      and mms4 mutants.
- id: PMID:25205745
  title: Drosophila FANCM helicase prevents spontaneous mitotic crossovers generated
    by the MUS81 and SLX1 nucleases.
  findings:
  - statement: MUS81 or SLX1, with MUS312, are needed for spontaneous mitotic crossovers
      in Fancm mutants.
    supporting_text: Spontaneous mitotic crossovers that occur in the absence of FANCM
      require the MUS312 nuclease scaffold protein and either MUS81 or SLX1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC4224181).
- id: PMID:28369583
  title: Substrate preference of Gen endonucleases highlights the importance of branched
    structures as DNA damage repair intermediates.
  findings:
  - statement: In Drosophila MUS81 plays a secondary role to GEN in repair of induced
      DNA damage.
    supporting_text: The increased sensitivity of mus81 Gen double mutants indicates
      that in flies, Mus81 plays a secondary role to DmGen.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read (PMC5435919); the biochemistry is on GEN, the fly mus81
      data are genetic.
