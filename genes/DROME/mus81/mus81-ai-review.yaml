  - SGD:S000002794
  review:
    summary: >-
      Phylogenetic inference of a role in break-induced replication, seeded from budding
      yeast Mus81. Plausible for a conserved fork/D-loop nuclease, but there is no
      Drosophila evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Break-induced replication is one specialised DSB-repair pathway in which MUS81
      cleaves D-loop/fork intermediates in yeast. The fly protein retains the conserved
      nuclease domain and the DSB-repair evidence in flies (camptothecin and IR
      sensitivity) is compatible with this, but the specific pathway has not been tested
      in Drosophila. Kept as a non-core, inherited annotation.
    supported_by:
