id: Q9V3T1
gene_symbol: mus81
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  mus81 (CG3026) encodes the Drosophila ortholog of the MUS81 structure-selective
  endonuclease, a 426-residue XPF/ERCC4-family nuclease with an HhH DNA-binding region
  and a C-terminal winged-helix domain. It is the catalytic subunit of the heterodimeric
  MUS81-MMS4 endonuclease, which by homology cleaves branched DNA such as 3'-flaps,
  replication-fork structures and nicked Holliday junctions. In flies MUS81-MMS4 is not
  needed for meiotic crossing over and mus81 single mutants have only mild DNA-damage
  hypersensitivity (camptothecin, HN2), because the GEN nuclease is the predominant
  structure-selective endonuclease in Drosophila. MUS81 becomes essential in the absence
  of the BLM helicase (mus309), acts as a backup to GEN in repair of induced damage, and
  together with SLX1 and the MUS312 scaffold generates spontaneous mitotic crossovers
  when FANCM is absent, consistent with a role in processing replication-fork and
  recombination intermediates in the nucleus.
existing_annotations:
- term:
    id: GO:0000712
    label: resolution of meiotic recombination intermediates
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000335543
  - PomBase:SPCC4G3.05c
  - SGD:S000002794
  - WB:WBGene00016602
  review:
    summary: >-
      Phylogenetic inference that MUS81 resolves meiotic recombination intermediates,
      seeded from fission yeast, budding yeast and worm. Mutant analysis of the fly gene
      found no role for MUS81-MMS4 in meiotic crossing over, even in a mei-9 background.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PomBase:SPCC4G3.05c
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Fission yeast Mus81 is required for most meiotic crossovers; fly mus81 mutants show no meiotic crossover defect.
    reason: >-
      The meiotic-resolvase function is real in fungi and worms, but Drosophila meiotic
      crossovers depend on MEI-9-ERCC1-MUS312 and fly mus81 and mms4 mutants have no
      detectable meiotic crossover defect. The fly therefore appears to have lost or never
      used this role, so the IBA over-propagates to Drosophila. It is not removed because
      the paper could not rule out a small contribution to a subset of crossovers.
    supported_by:
    - reference_id: PMID:17603121
      supporting_text: Unlike the case in fungi, we did not find any role for MUS81-MMS4
        in meiotic crossing over.
    - reference_id: PMID:17603121
      supporting_text: Our sample size was not large enough to rule out the possibility
        that Drosophila MUS81-MMS4 has a role in generating a subset of crossovers
    - reference_id: PMID:25205745
      supporting_text: No role in generating meiotic crossovers has been detected for MUS81
