suggested_questions:
- question: Does purified Drosophila MUS81-MMS4 (with its unusually short MMS4 and
    shortened MUS81 N-terminus) retain the 3'-flap and nicked-HJ cleavage activities of
    the yeast and human enzymes, and does it cleave intact Holliday junctions together
    with SLX1-MUS312?
- question: Why has Drosophila shifted the primary structure-selective endonuclease role
    from MUS81 to GEN, and is the absence of a meiotic MUS81 role linked to the
    MEI-9-ERCC1-MUS312 meiotic resolvase?
