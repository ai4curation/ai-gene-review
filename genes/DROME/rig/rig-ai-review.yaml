- term:
    id: GO:0007591
    label: molting cycle, chitin-based cuticle
  evidence_type: IMP
  original_reference_id: PMID:14645129
  qualifier: involved_in
  review:
    summary: rig mutants show molting defects, larval lethality and defective puparium formation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The phenotype is real but organismal: it shows that rig is necessary for larval molting, not that Rig
      performs a step of the molting cycle. Rig is an essential SMN complex subunit, so molting defects may be a
      downstream consequence of impaired housekeeping snRNP biogenesis, or of the proposed but unconfirmed nuclear-receptor
      cofactor role. Following the participation test, this is not a process the gene product executes.'
    supported_by:
    - reference_id: PMID:14645129
      supporting_text: rig mutants display defects in molting, delayed larval development, larval lethality, duplicated
        mouth parts, and defects in puparium formation
