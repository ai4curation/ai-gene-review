    label: spliceosomal snRNP assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005299808
  - UniProtKB:Q8TEQ6
  review:
    summary: IBA from PAINT node PTN005299808 (Gemin5 clade) assigning spliceosomal snRNP assembly to rig.
    action: ACCEPT
    reason: 'rig is in PANTHER PTHR46362:SF1 with human GEMIN5 and is itself an experimental donor to the Gemin5
      PAINT node PTN005299808, so it lies inside the clade to which snRNP assembly was assigned. Fly-specific support
      is membership of the endogenous SMN complex in embryos (PMID:30563832), U-body colocalisation with SMN (PMID:20452345)
      and genetic interaction with Gemin3 (PMID:26098872). As an SMN complex subunit, Rig is a component of the
      machine that performs Sm-core assembly, which meets the participation test. Caveats: no fly snRNP assembly
      assay after rig depletion was found, and in S2 cells Rig was not stably associated with SMN while the fly
      SMN complex still bound U snRNAs (PMID:18621711), so the precise step Rig contributes in flies (and whether
      it recognises snRNAs as human GEMIN5 does) is not established.'
    supported_by: &id001
