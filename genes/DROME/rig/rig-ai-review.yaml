id: Q86BY9
gene_symbol: rig
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'rig (rigor mortis; Gemin5, Gem5, CG30149) encodes the Drosophila ortholog of Gemin5, a 1235-residue
  protein with two N-terminal WD40 beta-propeller regions and a C-terminal TPR-like region, placed with vertebrate
  GEMIN5 in PANTHER subfamily PTHR46362:SF1. Rig is a subunit of the minimal fly survival motor neuron (SMN) complex
  (Smn, Gemin2, Gemin3, Gemin4 paralogs and Gemin5): endogenous Rig co-purifies with SMN expressed from its native
  promoter in embryos and colocalises with SMN, Gemin2 and Gemin3 in cytoplasmic U bodies. By orthology to the vertebrate
  SMN complex it is inferred to take part in Sm-class snRNP assembly, although direct snRNA binding or an snRNP
  assembly defect has not been shown for the fly protein, which is fast-evolving and lacks the human Sm-site contact
  residues at aligned positions. Rig is cytoplasmic in most larval tissues and moves into the nucleus of salivary
  gland and midgut cells at stage-specific times. It is essential: mutants and knockdowns show larval or pupal lethality,
  molting and puparium defects, a defective ecdysone-triggered E74 isoform switch, and age-dependent loss of climbing
  and flight when depleted in muscle or neurons. Rig also binds several nuclear receptors (EcR, USP, DHR3, SVP,
  betaFTZ-F1) in vitro and carries an LXXLL motif, which led to a proposed role as an ecdysone-receptor cofactor.'
