core_functions:
- description: Subunit of the cytoplasmic SMN complex (with Smn, Gemin2, Gemin3 and Gemin4) that assembles Sm-class
    spliceosomal snRNPs; complex membership and U-body localisation are experimentally established in Drosophila,
    while participation in snRNP assembly is inferred from the conserved Gemin5 clade.
  directly_involved_in:
  - id: GO:0000387
    label: spliceosomal snRNP assembly
  in_complex:
    id: GO:0032797
    label: SMN complex
  locations:
  - id: GO:0071254
    label: cytoplasmic U snRNP body
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:30563832
    supporting_text: we also identified Gemin2, Gemin3, Gemin5 and CG2941 as highly-enriched SMN binding partners
  - reference_id: PMID:20452345
    supporting_text: Our cytological investigations show that Gemin2, Gemin3 and Gemin5 colocalise with SMN in U
      bodies.
  - reference_id: file:DROME/rig/rig-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: PTHR46362:SF1; GEM-ASSOCIATED PROTEIN 5
  knowledge_gaps:
  - gap_statement: Which step of Sm-core assembly Drosophila Rig contributes to, and whether it binds U snRNAs (the
      human Sm-site recognition residues are not conserved, and the fly SMN complex binds snRNAs in S2 cells without
      stably bound Rig).
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does Drosophila Rig bind U snRNAs or the m7G cap directly, and if so through which region, given that
    the human GEMIN5 Sm-site contact residues are not conserved?
- question: Is the ecdysone-response phenotype of rig mutants a direct nuclear-receptor cofactor function or an
    indirect consequence of reduced snRNP biogenesis?
- question: Should PAINT node PTN005299808 continue to carry mRNA 3'-UTR binding for insect members, which have
    no RNA-binding data?
suggested_experiments:
- description: UV crosslinking/CLIP of endogenous tagged Rig in embryos or ovaries to test direct U snRNA and mRNA
    binding in vivo.
- description: In vitro Sm-core assembly or snRNP level measurements (e.g. U snRNA immunoprecipitation with Sm antibody)
    in rig mutant or knockdown larvae, with rescue by wild-type and N-terminal deletion transgenes.
- description: Test whether ecdysone-target gene misregulation in rig mutants is reproduced by Smn or Gemin2 loss
    of comparable severity, to separate SMN-complex from nuclear-receptor cofactor roles.
