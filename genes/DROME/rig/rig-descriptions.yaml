- source: Alliance_Automated
  text: Predicted to enable mRNA 3'-UTR binding activity. Involved in flight behavior;
    molting cycle; and response to ecdysone. Located in cytoplasm and nucleus. Part
    of SMN complex. Is active in cytoplasmic U snRNP body. Is expressed in adult head;
    nurse cell; and oocyte. Used to study neurodevelopmental disorder with cerebellar
    atrophy and motor dysfunction. Human ortholog(s) of this gene implicated in neurodevelopmental
    disorder with cerebellar atrophy and motor dysfunction. Orthologous to human GEMIN5
    (gem nuclear organelle associated protein 5).
