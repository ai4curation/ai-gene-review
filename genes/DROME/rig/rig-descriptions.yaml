- source: Alliance_Imported
  text: rigor mortis (rig) encodes a component of the cytoplasmic U snRNP body and
    a member of the SMN-Gemins complex. It is required in the motor system for viability
    and motor behaviour. It also works as a nuclear receptor interacting protein required
    for ecdysone signalling during larval development.
