descriptions:
- source: UniProt
  text: Component of the survival motor neuron (SMN) complex that catalyzes the assembly
    of small nuclear ribonucleoproteins (snRNPs), the building blocks of the spliceosome,
    and thereby plays an important role in the splicing of cellular pre-mRNAs (PubMed:30563832).
    Nuclear receptor cofactor for the ecdysone-regulated processes of molting and
    puparium formation (PubMed:14645129). Acts downstream from ecdysone biosynthesis
    and release to control the expression of specific ecdysone-regulated genes such
    as Eip74EF (E74) (PubMed:14645129). Essential in muscle and neuronal tissues for
    motor function, including climbing ability and flight (PubMed:24391840).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86BY9
