descriptions:
- source: UniProt
  text: '[Ninjurin-A]: Effector of non-apoptotic necrotic cell death that mediates
    plasma membrane rupture (cytolysis): oligomerizes in response to death stimuli
    and promotes plasma membrane rupture by introducing hydrophilic faces of 2 alpha
    helices into the hydrophobic membrane, leading to release intracellular molecules
    that propagate the inflammatory response (PubMed:23028562, PubMed:33472215). Also
    acts as a homophilic transmembrane adhesion molecule that promotes cell adhesion
    by mediating homophilic interactions via its extracellular region (By similarity).
    . [Secreted ninjurin-A]: Secreted form generated by cleavage, which acts as a
    negative regulator of cell adhesion (PubMed:16815999). Promotes the loss of cell
    adhesion in a cell non-autonomous manner (PubMed:16815999).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8MPP0
  source_id: Q8MPP0
