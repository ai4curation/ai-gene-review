- source: Alliance_Imported
  text: Ninjurin A (NijA) encodes a transmembrane protein of the conserved Ninjurin
    family. It is upregulated in response to injury and infection, suggesting a role
    in immune or stress responses. When overexpressed the product of NijA causes cell
    death.
