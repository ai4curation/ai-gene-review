suggested_questions:
- question: Does endogenous NijA execute plasma membrane rupture in any physiological Drosophila lytic
    cell death setting (for example in hemocytes or fat body after septic injury), given that the null
    mutant shows no death phenotype?
- question: Do Drosophila ninjurins mediate homophilic cell-cell adhesion like the vertebrate ninjurins,
    or is the adhesion activity at the PANTHER ninjurin node a vertebrate-specific trait that should
    not be propagated to NijA?
- question: Is NijA's requirement for glial infiltration and axon debris clearance after nerve injury
    an adhesion, membrane-remodelling or signalling function?
suggested_experiments:
- description: Express NijA in Drosophila or mammalian NINJ1-deficient cells and measure LDH release
    and membrane rupture, with alpha1/alpha2 helix mutants, to test whether NijA has NINJ1-like membrane
    destabilizing activity; image NijA oligomers by super-resolution or cryo-ET.
- description: Test cell aggregation of S2 cells expressing NijA (with Mmp1 knockdown or cleavage-resistant
    NijA) to determine whether full-length NijA mediates homophilic adhesion.
