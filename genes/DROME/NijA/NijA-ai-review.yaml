      failed), so assay details behind the IMP/IGI rows were not inspected.
- id: PMID:23028562
  title: Drosophila Ninjurin A induces nonapoptotic cell death.
  findings:
  - statement: Ectopic NijA induces nonapoptotic, cell-autonomous cell death that requires surface
      localization.
    supporting_text: These dying cells did not display hallmarks of apoptotic cells including TUNEL
      staining and inhibition by p35, indicating that NijA induced nonapoptotic cell death.
  - statement: NijA null mutants have no detectable phenotype.
    supporting_text: NijAD3 homozygous mutants were viable and fertile with no obvious developmental
      abnormalities
  - statement: NijA is not required for apoptosis.
    supporting_text: indicating that NijA is not an essential component of the cell death machinery
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Death phenotype is from overexpression; endogenous requirement not
      shown.
- id: PMID:33472215
  title: NINJ1 mediates plasma membrane rupture during lytic cell death.
  full_text_unavailable: true
  findings:
  - statement: NINJ1 oligomerizes via a conserved extracellular domain to drive plasma membrane rupture.
    supporting_text: Mechanistically, NINJ1 used an evolutionarily conserved extracellular domain for
      oligomerization and subsequent PMR.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only; establishes the family mechanism. The abstract does not mention Drosophila,
      so whether NijA was assayed (as the GOA IDA and UniProt citation imply) could not be confirmed.
- id: PMID:41448502
  title: Nerve injury promotes glial immune responses through a Draper/Ninjurin A pathway.
  findings:
  - statement: NijA is induced in ensheathing glia after nerve injury downstream of Draper and is required
      for glial infiltration and debris clearance.
    supporting_text: In NijA mutants, glia fail to properly infiltrate areas that contain severed olfactory
      nerves, and degenerating axonal debris is not cleared from the CNS.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Loss-of-function phenotype in glial injury response; the molecular role of NijA in
      it is not defined, so no process term was proposed from it.
