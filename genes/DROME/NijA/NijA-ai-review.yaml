gene_symbol: NijA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Ninjurin A (NijA, CG6449) is one of three Drosophila members of the ninjurin family of small
  cell-surface proteins, with a long N-terminal extracellular region carrying the conserved
  amphipathic alpha1/alpha2 helices and two C-terminal transmembrane helices. NijA is expressed
  at the plasma membrane of tracheal, fat-body and blood cells; its levels rise and it is
  redistributed to the cell surface after septic injury, under control of the Toll pathway, and
  it is transcriptionally induced in ensheathing glia after nerve injury in a Draper-dependent
  manner. Elevated NijA kills cells cell-autonomously by a nonapoptotic, p35-insensitive
  mechanism that requires surface localization, consistent with the role of its mammalian
  ortholog NINJ1 as the oligomerizing effector of plasma membrane rupture in lytic cell death.
  NijA also binds the matrix metalloproteinase Mmp1, which cleaves it to release the N-terminal
  ectodomain; the shed ectodomain acts nonautonomously to reduce cell adhesion to substrates.
  NijA null flies are viable and fertile, but glia lacking NijA fail to infiltrate and clear
  degenerating axons after olfactory nerve injury.
