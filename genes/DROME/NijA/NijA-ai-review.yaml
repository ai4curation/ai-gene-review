  review:
    summary: Proposed molecular activity underlying NijA-mediated cytolysis, by similarity to NINJ1.
    action: NEW
    reason: NINJ1 ruptures the plasma membrane by inserting the amphipathic alpha1/alpha2 helices of
      its conserved extracellular region and oligomerizing; UniProt annotates this helix region in NijA
      by similarity. NijA kills cells nonapoptotically and cell-autonomously, requires cell-surface
      localization to do so, and the dead cells become permeable to acridine orange. This is an MF
      (what NijA does to the membrane), not a process inference from phenotype; it supplies the
      activity for the accepted cytolysis annotations. An ISS from human NINJ1 (UniProtKB:Q92982) is
      used here while the GO:0098632 adhesion IBA from mouse Ninj1 is rejected because the plasma
      membrane rupture mechanism sits in the conserved extracellular helix region and has fly-side
      support (the requirement for surface localization to kill, and acridine orange uptake by dying
      cells), whereas homophilic adhesion has no fly-side support and NijA is anti-adhesive.
