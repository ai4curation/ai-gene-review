      (PMID:23028562, PMID:33472215) and the shed ectodomain acting as a negative regulator of cell
      adhesion (PMID:16815999) agree with the review. The homophilic adhesion sentence is a By similarity
      transfer from mouse Ninj1 (O70131); no Drosophila ninjurin has been tested for homophilic adhesion,
      and the only fly adhesion data show that NijA expression reduces adhesion.
