taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Tmlh (CG4335, TMLHE) encodes the Drosophila melanogaster trimethyllysine dioxygenase, an Fe(II)- and
  2-oxoglutarate-dependent dioxygenase of the gamma-BBH/TMLD family that is orthologous to human TMLHE.
  By homology it catalyses the first committed step of L-carnitine biosynthesis, the 3-hydroxylation of
  free N6,N6,N6-trimethyl-L-lysine (released by turnover of proteins carrying methylated lysines) to 3-hydroxy-N6,N6,N6-trimethyl-L-lysine,
  coupled to oxidative decarboxylation of 2-oxoglutarate, in the mitochondrial matrix. In the larval fat
  body Tmlh expression is required for carnitine production; it is transcriptionally repressed by NetrinB-Unc-5
  signalling from Ras-transformed tissue, and fat-body knockdown of Tmlh aggravates tumour-induced organismal
  lethality, which is rescued by dietary carnitine or acetyl-CoA. The catalytic activity itself has not
  been assayed for the fly enzyme.
