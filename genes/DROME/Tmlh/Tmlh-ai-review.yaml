proposed_new_terms: []
suggested_questions:
- question: >-
    Is Tmlh the rate-limiting step of carnitine synthesis in the fly fat body, and is trimethyllysine
    supply (from protein turnover) or Tmlh expression the main control point?
- question: >-
    How does NetrinB-Unc-5 signalling repress Tmlh transcription, and is Tmlh regulated by nutrient state
    (insulin signalling) under normal conditions?
suggested_experiments:
- description: >-
    Assay recombinant Tmlh for 2-oxoglutarate-coupled hydroxylation of trimethyllysine and measure trimethyllysine,
    hydroxytrimethyllysine and carnitine in Tmlh null mutants by LC-MS/MS.
  hypothesis: >-
    Tmlh is the sole fly trimethyllysine dioxygenase; mutants accumulate trimethyllysine and lack endogenous
    carnitine synthesis.
