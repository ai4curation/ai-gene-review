      Tumour (RasV12)-derived NetrinB acts via Unc-5 to suppress TMLHE (Tmlh) transcription in the fat
      body, reducing carnitine and acetyl-CoA production; fat-body Tmlh knockdown aggravates survival
      under oncogenic stress, and carnitine or acetyl-CoA supplementation rescues.
