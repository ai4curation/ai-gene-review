  review:
    summary: Iron ion binding from the InterPro trimethyllysine dioxygenase signature (IPR012776).
    action: MODIFY
    reason: >-
      Correct but too general. Like other members of the gamma-BBH/TMLD family, Tmlh is expected to use
      ferrous iron as its catalytic cofactor (UniProt cofactor Fe(2+)), so ferrous iron binding (GO:0008198)
      is the more specific term. This is a cofactor-binding statement, not the core function.
    proposed_replacement_terms:
