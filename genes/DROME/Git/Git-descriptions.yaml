      vesicle recycling.
- source: Alliance_Imported
  text: G protein-coupled receptor kinase interacting ArfGAP (Git) encodes an Arf-GAP
    that forms a scaffold with the Rho-type guanine nucleotide exchange factor encoded
    by RtGEF aiding in activation of the kinase encoded by Pak. The product of Git
    has roles in muscle morphogenesis, synaptic vesicle recycling, and regulation
    of tissue growth.
  source_type: curated
