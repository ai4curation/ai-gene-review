- source: Alliance_Automated
  text: Enables molecular adaptor activity. Involved in several processes, including
    mushroom body development; negative regulation of organ growth; and positive regulation
    of hippo signaling. Located in cell leading edge; cytoplasm; and presynaptic active
    zone. Colocalizes with cytoskeleton of presynaptic active zone. Is expressed in
    several structures, including adult head; dorsal pharyngeal muscle primordium;
    larval muscle cell; larval muscle system; and somatic muscle primordium. Human
    ortholog(s) of this gene implicated in attention deficit hyperactivity disorder.
    Orthologous to several human genes including GIT2 (GIT ArfGAP 2).
