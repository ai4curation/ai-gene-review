descriptions:
- source: UniProt
  text: GTPase-activating protein for ADP ribosylation factor family members, including
    ARF1. Multidomain scaffold protein that interacts with numerous proteins and therefore
    participates in many cellular functions, including receptor internalization, focal
    adhesion remodeling, and signaling by both G protein-coupled receptors and tyrosine
    kinase receptors (By similarity). Through Pak activation, may positively regulate
    microtubule nucleation during interphase. May play a role in the regulation of
    cytokinesis (By similarity). During embryogenesis, promotes proper muscle morphogenesis
    and proper guidance and targeting of subsets of myotubes (PubMed:18996366). Required
    for the recruitment of Pak to muscle attachments in the embryo, probably indirectly
    through pix/dPIX (PubMed:18996366). May be important for brain development (PubMed:25792865).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95RG8
  source_id: Q95RG8
