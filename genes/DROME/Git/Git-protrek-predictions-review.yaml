    label: positive regulation of ARF protein signal transduction
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 17.98). Git stimulates GTP hydrolysis on Arf79F, converting ARF-GTP to
      ARF-GDP and thereby switching ARF signalling off; this review states that inactivating ARF signalling
      is how Git promotes Hippo pathway activation. Positive regulation is the GEF role, not the GAP
      role. Scored MORE_SPECIFIC by closure because GOA carries the unsigned parent, which again means
      an ontology-only score would count a sign inversion as a refinement.
    supported_by:
