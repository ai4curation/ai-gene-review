id: Q95RG8
gene_symbol: Git
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Drosophila Git, the ARF GTPase-activating protein and dPix-Git-PAK
  scaffold. All four top calls are ARF signalling terms and the free-text channel scores 22.87, so
  the family identification is emphatic - but ranks 1 and 2 are the positive and negative regulation
  of ARF signalling offered adjacently, and the positive one wins. A GAP inactivates its GTPase, so
  the correct sign is negative. The adaptor/scaffold functions that make up three of this review's
  four core functions are not reached. Assessment: 1 correct novel (COR), 1 correct not novel (CNN),
  1 nonparalog incorrect (NPI).
