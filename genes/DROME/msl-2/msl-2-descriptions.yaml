- source: Alliance_Automated
  text: Enables several functions, including histone H2B ubiquitin ligase activity;
    lncRNA binding activity; and molecular condensate scaffold activity. Involved
    in dosage compensation by hyperactivation of X chromosome; protein localization
    to chromatin; and protein polyubiquitination. Located in nuclear chromosome. Part
    of MSL complex and X chromosome located dosage compensation complex, transcription
    activating. Is active in X chromosome. Is expressed in adult midgut epithelial
    cell; adult posterior midgut; ganglia; and somatic precursor cell. Human ortholog(s)
    of this gene implicated in disease of mental health. Orthologous to human MSL2
    (MSL complex subunit 2).
