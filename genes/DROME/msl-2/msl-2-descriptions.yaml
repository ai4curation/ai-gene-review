- source: Alliance_Imported
  text: male-specific lethal 2 (msl-2) encodes the key male-specific subunit of the
    male-specific-lethal dosage compensation complex. It induces or stabilizes all
    other components. Homozygous mutant males die, while msl-2 ectopic expression
    kills females.
