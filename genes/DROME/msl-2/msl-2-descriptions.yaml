descriptions:
- source: UniProt
  text: 'Limiting component of the male-specific lethal (MSL) histone acetyltransferase
    complex, a multiprotein complex essential for elevating transcription of the single
    X chromosome in the male (X chromosome dosage compensation) (PubMed:18724933,
    PubMed:23084835, PubMed:23870142, PubMed:27580037, PubMed:31320325, PubMed:33208948,
    PubMed:7588059, PubMed:7781064, PubMed:7796814). The MSL complex specifically
    associates with the single X chromosome in males and mediates formation of H4K16ac,
    promoting a two-fold activation of X chromosome (PubMed:16543150). Msl-2 is only
    produced in males, constituting the limiting component of the MSL complex (PubMed:7781064).
    Within the MSL complex, msl-2 mediates the selective binding to the X chromosome
    and recruitment of the MSL complex via two different mechanisms (PubMed:18724933,
    PubMed:20139418, PubMed:25452275, PubMed:27580037, PubMed:31320325, PubMed:33208948,
    PubMed:37602401). Recognizes DNA motifs that are enriched on X chromosome, named
    PionX sites, which are characterized by sequence features and distinct DNA conformation
    (base roll) (PubMed:18724933, PubMed:25452275, PubMed:27580037, PubMed:31320325,
    PubMed:37602401). Specific recognition of the X chromosome is also mediated by
    the formation of a gel-like state: msl-2 undergoes liquid-liquid phase separation
    upon binding to roX1 and roX2 non-coding RNAs, leading to nucleate the MSL complex
    on the X chromosome (PubMed:33208948). Msl-2 is also required for translation
    and/or stability of msl-1 in males (PubMed:7588059, PubMed:7781064, PubMed:7796814).
    Also acts as an E3 ubiquitin ligase: in complex with msl-1, mediates ubiquitination
    of histone H2B at ''Lys-34'' (H2BK34Ub) (PubMed:21726816). Also catalyzes ubiquitination
    of msl-1, msl-3 and mof components of the MSL complex (PubMed:23084834, PubMed:28510597).'
