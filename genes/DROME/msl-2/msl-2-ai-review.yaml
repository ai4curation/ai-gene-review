suggested_questions:
- question: What is the in vivo contribution of H2B ubiquitylation by MSL2 to the two-fold upregulation
    of X-linked genes, separate from its role in controlling MSL subunit levels?
suggested_experiments:
- description: Rescue msl-2 mutant males with a RING-dead MSL2 transgene and measure MSL subunit levels,
    H2B ubiquitylation on the X, X-linked transcription and male viability.
