id: P50534
gene_symbol: msl-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: msl-2 (male-specific lethal 2) encodes a RING-finger E3 ubiquitin ligase that is the male-specific
  organizer of the MSL dosage compensation complex. Translation of msl-2 mRNA is repressed in females
  by Sex-lethal, so MSL2 protein and the complex form only in males, and ectopic MSL2 is sufficient to
  assemble the complex on female X chromosomes. MSL2 binds MSL1 and, through its zinc-containing CXC domain
  and a proline/basic-rich region, binds GA-rich MSL recognition elements and PionX sites on the X chromosome;
  it also binds the ubiquitous zinc-finger protein CLAMP. Its low-complexity C-terminal domain binds the
  roX lncRNAs and forms condensates with them that confine the complex to the X-chromosome territory.
  As a ubiquitin ligase, MSL2 ubiquitylates histone H2B and the other MSL proteins (MSL1, MSL3, MOF and
  itself), which controls complex stoichiometry and stability.
