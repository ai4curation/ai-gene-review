id: A1Z8P9
gene_symbol: Mgtor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mgtor (Megator, Mtor; Bx34) is the Drosophila ortholog of vertebrate TPR and yeast Mlp1/Mlp2,
  a 2346-residue nuclear protein with a long N-terminal coiled-coil domain and an acidic, largely disordered
  C-terminal region. In interphase it forms the nucleoplasmic basket of the nuclear pore complex and also
  occupies the intranuclear extrachromosomal space and nuclear matrix. At the pore it binds the N-terminus
  of Mad1 and docks the Mad1-C-Mad2 checkpoint complex; Mps1 phosphorylation of Mgtor in prophase releases
  Mad1 so that Mad1-C-Mad2 can load onto unattached kinetochores. During open mitosis Mgtor reorganizes,
  with Skeletor, Chromator and EAST, into a dynamic nuclear-derived spindle matrix that embeds the microtubule
  spindle and concentrates Mad2, and it promotes efficient recruitment of Mad2 and Mps1 to kinetochores;
  loss shortens mitosis and weakens the spindle assembly checkpoint. On chromatin, Mgtor occupies large
  transcriptionally active domains, associates with the MOF/MSL dosage compensation complex, and attenuates
  transcription of male X-linked genes by limiting RNA polymerase II Ser5 phosphorylation. The gene is
  essential; in testes it is needed for germline stem cell maintenance and asymmetric division.
