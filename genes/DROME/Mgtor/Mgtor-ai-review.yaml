suggested_questions:
- question: Is the Mtor spindle matrix a distinct functional compartment, or a passive retention of nuclear
    basket protein around the spindle, and does it contribute to SAC signalling independently of interphase
    NPC docking of Mad1?
- question: 'How does Mtor limit Ser5 phosphorylation of RNAPII at MSL targets: by excluding TFIIH/CDK7,
    by tethering MOF-bound loci to pores, or another mechanism?'
- question: Does Mtor contribute to bulk mRNA export in Drosophila as Tpr/Mlp proteins do elsewhere, given
    that its transcriptional effects are independent of export?
- question: The UniProt record lists a kinetochore location citing PMID:19273613, whereas the paper and
    FlyBase record NOT kinetochore; should the UniProt subcellular location be revised?
suggested_experiments:
- description: Replace endogenous Mtor with a Mad1-binding-deficient coiled-coil mutant (CRISPR knock-in)
    and measure SAC strength, mitotic timing and segregation fidelity in neuroblasts, separating the NPC
    docking role from spindle-matrix roles.
- description: Poly(A)+ RNA FISH and nuclear/cytoplasmic RNA-seq after acute Mtor degradation (degron)
    to test whether Mtor is required for mRNA export in fly cells.
- description: CUT&RUN for TFIIH/CDK7 and RNAPII Ser5P at male X MSL targets after acute Mtor depletion
    to define how Mtor restrains transcription initiation.
