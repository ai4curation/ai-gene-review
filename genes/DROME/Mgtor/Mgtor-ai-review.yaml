- term:
    id: GO:0000022
    label: mitotic spindle elongation
  evidence_type: IMP
  original_reference_id: PMID:19273613
  qualifier: involved_in
  review:
    summary: Mtor RNAi slowed anaphase half-spindle elongation in S2 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The same paper shows the slower spindle elongation is a secondary effect of the accelerated,
      checkpoint-weakened mitosis: when anaphase onset was delayed with MG132, Mtor-depleted cells elongated
      their spindles at control rates, and Mad2-depleted cells showed the same defect. FlyBase itself
      records NOT regulation of mitotic spindle elongation from this paper. Mtor does not perform spindle
      elongation.'
    supported_by:
    - reference_id: PMID:19273613
      supporting_text: We found no difference in half-spindle elongation velocity between Mtor RNAi (0.7
        ± 0.1 µm/min) and control cells (0.7 ± 0.2 µm/min) treated with MG132
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:34133927
  qualifier: involved_in
  review:
    summary: Mtor depletion causes selective upregulation of MSL-target genes on the male X at the level
      of nascent transcription; Mtor restrains the hypo-phosphorylated to Ser5P RNAPII transition.
    action: ACCEPT
    reason: Well-supported by nascent-transcript (TT-seq) and RNAPII ChIP data; Mtor acts as a transcriptional
      attenuator of dosage-compensated genes, with autosomal genes largely unaffected. Accepted as one
      of the gene's chromatin-level functions.
    supported_by:
    - reference_id: PMID:34133927
      supporting_text: These results suggest that normally Mtor may restrict gene expression by regulating
        the transition from hypo-phosphorylated to Ser5P RNAPII and thus the initial entry into transcription
        initiation.
    - reference_id: PMID:34133927
      supporting_text: These results support the notion that Mtor co-functions with MOF to restrict dosage-compensated
        expression across different cell types.
