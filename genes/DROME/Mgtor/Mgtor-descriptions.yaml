- source: Alliance_Imported
  text: Megator (Mgtor) encodes a nuclear pore protein that is found in the nuclear
    matrix surrounding the chromosomes at interphase. During mitosis Mgtor product
    dynamically reorganizes, together with other nuclear and cytoplasmic proteins
    (such as those encoded by Skel, Chro, east, and Asator), to form a gel-like spindle
    matrix embedding the microtubule spindle apparatus. Mgtor product is important
    for normal cell cycle progression, functioning as a spatial regulator of cell
    cycle factors.
