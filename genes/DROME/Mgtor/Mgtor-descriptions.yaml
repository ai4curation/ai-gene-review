- source: Alliance_Automated
  text: Enables chromatin DNA binding activity and histone acetyltransferase binding
    activity. Involved in several processes, including regulation of gene expression;
    regulation of mitotic nuclear division; and spindle organization. Located in several
    cellular components, including cytoskeleton; euchromatin; and nucleus. Part of
    nuclear pore. Colocalizes with mitotic spindle. Is expressed in adult brain cell
    body rind; adult head; adult optic lobe; male germline cell; and somatic cell
    of testis. Human ortholog(s) of this gene implicated in autosomal recessive intellectual
    developmental disorder. Orthologous to human TPR (translocated promoter region,
    nuclear basket protein).
