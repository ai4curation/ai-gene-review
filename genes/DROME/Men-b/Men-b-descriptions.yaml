- source: Alliance_Imported
  text: Malic enzyme b (Men-b) encodes a mitochondrial enzyme that catalyzes the oxidation
    of malate to pyruvate, with the concomitant reduction of NADP[+] to NADPH. It
    is involved in NADPH regeneration.
