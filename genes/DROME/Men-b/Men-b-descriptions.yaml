- source: Alliance_Automated
  text: Predicted to enable malate dehydrogenase (decarboxylating) (NADP+) activity.
    Involved in NADPH regeneration and glucose homeostasis. Predicted to be active
    in mitochondrial matrix. Is expressed in several structures, including adult head;
    adult heart; ganglia; gut section; and nephrocyte. Orthologous to several human
    genes including ME3 (malic enzyme 3).
