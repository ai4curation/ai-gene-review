suggested_questions:
- question: >-
    Is Men-b NADP- or NAD-dependent (ME3-like or ME2-like), is it imported into mitochondria, and in which
    tissues is it expressed relative to Men?
- question: >-
    Is the complex I assembly defect after Men-b knockdown caused by loss of matrix NADPH (as proposed
    for IDH2), and can it be rescued by an NADPH-generating enzyme targeted to mitochondria?
suggested_experiments:
- description: >-
    Express Men-b recombinantly and measure kinetics with NAD+ and NADP+; tag endogenous Men-b and image
    co-localization with a mitochondrial matrix marker.
  hypothesis: Men-b is a mitochondrial NADP-malic enzyme.
