id: E1JIZ4
gene_symbol: Men-b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Men-b (CG5889, also called dME3) encodes a Drosophila melanogaster malic enzyme paralogous to the cytosolic
  Men. It has the malic enzyme N-terminal and NAD(P)-binding domains and an N-terminal extension rich
  in basic and hydroxylated residues typical of a mitochondrial presequence, and it is most similar to
  the mitochondrial NADP+-dependent malic enzyme ME3 of mammals. By homology it is expected to oxidatively
  decarboxylate (S)-malate to pyruvate and CO2 with reduction of NADP+ to NADPH in the mitochondrial matrix.
  Its catalytic properties, cofactor preference and localization have not been determined experimentally
  in flies. Knockdown of Men-b in flight muscle impairs assembly of mitochondrial respiratory complex
  I, as does loss of the mitochondrial NADP-isocitrate dehydrogenase, suggesting that matrix NADPH supply
  supports complex I biogenesis; Men-b knockdown also causes early adult lethality and, in a genome-scale
  RNAi screen, altered circulating sugar levels.
