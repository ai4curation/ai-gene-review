- source: Alliance_Automated
  text: Predicted to enable several functions, including heme binding activity; iron
    ion binding activity; and monooxygenase activity. Involved in tergite morphogenesis.
    Predicted to be located in mitochondrial membrane. Is expressed in several structures,
    including adult integumentary system; embryonic epipharynx; embryonic head epidermis;
    epithelium; and gut section. Human ortholog(s) of this gene implicated in several
    diseases, including asthma (multiple); bone disease (multiple); gastrointestinal
    system cancer (multiple); lung disease (multiple); and viral hepatitis (multiple).
    Orthologous to several human genes including CYP24A1 (cytochrome P450 family 24
    subfamily A member 1); CYP27A1 (cytochrome P450 family 27 subfamily A member 1);
    and CYP27B1 (cytochrome P450 family 27 subfamily B member 1).
