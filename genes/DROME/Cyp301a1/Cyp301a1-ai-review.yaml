- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001128
  - InterPro:IPR002401
  - InterPro:IPR036396
  review:
    summary: InterPro P450 signatures map to monooxygenase activity. Cyp301a1 is a full-length P450
      with the conserved heme-thiolate cysteine and is a member of the insect mitochondrial P450 clan,
      so a heme-dependent monooxygenase activity is the expected family function.
    action: ACCEPT
    reason: No biochemical data exist for CYP301A1, so this family-level term is as precise as the evidence
      allows. Mitochondrial-clan P450s normally take electrons from adrenodoxin, which would place the
      protein under GO:0016713. The Tyr that replaces the conserved Phe in the heme-binding motif of every
      CYP301A1 ortholog is the kind of change seen in atypical P450s such as allene oxide synthase and
      thromboxane synthase. So a refinement is not asserted, and this caveat is recorded as a suggested
      question.
    supported_by:
