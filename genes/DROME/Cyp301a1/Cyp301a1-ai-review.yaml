    supporting_text: all Cyp301a1 RNAi progeny showed a similar range of cuticle phenotypes
  - reference_id: file:DROME/Cyp301a1/Cyp301a1-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: IPR050479; CYP11_CYP27_families
suggested_questions:
- question: What is the endogenous substrate of CYP301A1? Is it an ecdysteroid, as the partial suppression
    by 20E might suggest, or another lipid or sterol signal?
- question: Does the Tyr in the heme-binding motif (PYGYG...C) that is conserved in all CYP301A1 orthologs
    make CYP301A1 an atypical P450 (isomerase or dehydrase-like) rather than an adrenodoxin-dependent
    monooxygenase? This determines whether the GO:0016713 refinement is appropriate.
- question: Is CYP301A1 actually in the mitochondrial inner membrane, as predicted for mitochondrial-clan
    P450s?
suggested_experiments:
- hypothesis: CYP301A1 is an adrenodoxin-dependent monooxygenase acting on an ecdysteroid or sterol
    substrate.
  description: Reconstitute recombinant CYP301A1 with Drosophila adrenodoxin and adrenodoxin reductase,
    screen ecdysteroids and sterols by LC-MS, and test whether a Tyr-to-Phe mutation alters the activity.
- hypothesis: CYP301A1 localizes to the mitochondrial inner membrane in the abdominal epidermis and
    histoblasts.
  description: Express a tagged CYP301A1 knock-in and co-stain with inner-membrane and matrix markers,
    or use protease-protection assays on isolated mitochondria.
- hypothesis: Cyp301a1 is required cell-autonomously in histoblasts for dorsal closure of the adult
    abdomen.
  description: Use a CRISPR null allele and histoblast-specific RNAi with live imaging of histoblast
    spreading and larval epidermal cell extrusion during metamorphosis, and measure ecdysteroid titres
    in the mutants.
