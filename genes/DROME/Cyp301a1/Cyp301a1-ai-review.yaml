- term:
    id: GO:0007490
    label: tergite morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:22574182
  qualifier: involved_in
  review:
    summary: In Sztal et al. 2012, a piggyBac insertion allele and three independent ubiquitous RNAi lines
      both produced a partially penetrant defect along the dorsal midline of the adult abdomen, with
      malformed or unfused tergites. Precise excision of the insertion reverted the phenotype.
    action: KEEP_AS_NON_CORE
    reason: The genetic evidence is sound, with two independent perturbations and an excision revertant,
      and FlyBase curators made the annotation from the full text, which I also read. The mechanism is
      unknown. The authors suggest failed histoblast spreading or larval epidermal cell replacement, which
      may be linked to 20E. The P450 may therefore act upstream or indirectly, for example by making a
      signalling metabolite, rather than as a component of tergite morphogenesis itself. The row is kept
      as the best available process annotation but is non-core, because the molecular basis is
      unresolved.
    supported_by:
    - reference_id: PMID:22574182
      supporting_text: revealed a cuticle phenotype in both males and females, ranging from a slight malformation
        of the cuticle between the tergites to a complete loss of the tanned cuticle layer down the dorsal
        midline of the abdomen
    - reference_id: PMID:22574182
      supporting_text: all Cyp301a1 RNAi progeny showed a similar range of cuticle phenotypes
    - reference_id: PMID:22574182
      supporting_text: Phenotypic analysis of the Cyp301a1-exf02301 flies raised at 25°C showed a significant
        decrease in appearance of the cuticle malformation phenotype
    - reference_id: file:DROME/Cyp301a1/Cyp301a1-deep-research-manual.md
      supporting_text: No biochemical substrate, product, or subcellular localization was determined.
    - reference_id: PMID:22574182
      supporting_text: Histological analyses revealed an improper fusion of tergites along the abdomen,
        which may be caused by an abnormal proliferation of the adult cuticle.
