id: Q9V6D6
gene_symbol: Cyp301a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cyp301a1 encodes a cytochrome P450 of the insect mitochondrial clan (CYP11/CYP27-like
  family), with a predicted N-terminal mitochondrial transit peptide and a heme-thiolate active site
  (axial Cys502). It is conserved as a single-copy ortholog across insects, and its heme-binding motif
  carries a Tyr (PYGYGARMCLG) in place of the usual Phe. That substitution is shared by all CYP301A1
  orthologs and may indicate atypical P450 chemistry. Its substrate and product are unknown. The gene is
  expressed throughout development, in the embryonic epidermis, the hindgut at all stages and the adult
  integument. Loss of function by a piggyBac insertion or by ubiquitous RNAi gives a partially penetrant
  defect in the adult abdominal cuticle along the dorsal midline, where tergites fail to fuse and the
  region lacks cells, chitin and bristles. Feeding larvae 20-hydroxyecdysone partially suppresses the
  defect, so Cyp301a1 may act in ecdysteroid-dependent formation of the adult abdominal epidermis, but
  its direct role is not established.
