- id: file:DROME/Cyp301a1/Cyp301a1-deep-research-flybase.md
  title: FlyBase gene description for Cyp301a1 (DROME)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: The FlyBase text is a generic statement about the cytochrome P450 family. Membership
      of the P450 family and a mitochondrial location (predicted transit peptide, mitochondrial clan)
      are consistent with the review. No study shows a detoxification role for Cyp301a1. The only
      functional study (PMID:22574182) links it to adult abdominal cuticle formation, and its authors
      contrast conserved, single-copy P450s like Cyp301a1 with the detoxification P450s.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0033753
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Cyp301a1 (Cyp301a1) encodes a member of the cytochrome P450 family, which have
        both mitochondrial and cytosolic roles in the detoxification of compounds.
      confidence: PROBABLE
      explanation: The description attributes the family's "roles in the detoxification of compounds"
        to Cyp301a1, but there is no evidence that Cyp301a1 detoxifies anything. It is a conserved,
        single-copy insect P450 of the mitochondrial clan, and Sztal et al. 2012 (PMID:22574182) showed
        that piggyBac insertion and RNAi knockdown disrupt the adult abdominal cuticle along the dorsal
        midline. The description could instead state that Cyp301a1 is a mitochondrial-clan P450 required
        for formation of the adult abdominal cuticle.
      supported_by:
      - reference_id: PMID:22574182
        supporting_text: Disruption of Cyp301a1 function, as demonstrated by both Cyp301a1 piggybac and
          RNAi knockdown experiments, produced adult flies with a distinct morphological disruption to
          the cuticle.
      - reference_id: PMID:22574182
        supporting_text: Thus genes involved in essential developmental processes are likely to be retained
          whereas those involved in specific detoxification responses, depending on an organism's environment,
          may not be under the same functional constraints.
core_functions:
- description: A heme-thiolate cytochrome P450 of the insect mitochondrial clan, with an unknown substrate
    and a predicted mitochondrial membrane location. Its function is required for normal formation of the
    adult abdominal epidermis and cuticle at the dorsal midline (tergite closure), possibly through
    metabolism of an ecdysteroid or another signalling lipid.
  molecular_function:
    id: GO:0004497
    label: monooxygenase activity
  locations:
