  title: A cytochrome p450 conserved in insects is involved in cuticle formation.
  findings:
  - statement: Cyp301a1 is single-copy and conserved across insects. All CYP301A1 orthologs carry a Tyr
      in place of the conserved Phe in the heme-binding motif.
    supporting_text: Cyp301A1 in all insect species analysed has a Tyr (Y) instead of the highly conserved
      Phe (F) present in the second position of the heme-binding domain (PFxxGxxxCxG)
  - statement: Insertion and RNAi loss of function both cause a defect in the adult abdominal cuticle and
      tergite closure along the dorsal midline.
    supporting_text: revealed a cuticle phenotype in both males and females, ranging from a slight malformation
      of the cuticle between the tergites to a complete loss of the tanned cuticle layer down the dorsal
      midline of the abdomen
  - statement: Feeding 20E partially suppresses the phenotype, but the authors do not claim that Cyp301a1
      has a direct role in 20E regulation.
    supporting_text: Although we cannot conclude that CYP301A1 is directly involved in 20E regulation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The full text (PMC3344891) was read. This is the only functional study of Cyp301a1 and
      the source of the FlyBase IMP row. The phenotype is partially penetrant (about 35-40% of flies
      affected), and the insertion allele alters only the last five residues, so it may be hypomorphic.
