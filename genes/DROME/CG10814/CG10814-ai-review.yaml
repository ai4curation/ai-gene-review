proposed_new_terms: []
suggested_questions:
- question: >-
    Does recombinant CG10814 hydroxylate gamma-butyrobetaine to L-carnitine, and is it the only gamma-butyrobetaine
    dioxygenase in Drosophila (the fly genome has other gamma-BBH/TMLD family members)?
- question: >-
    In which tissues is CG10814 expressed, and does the fly make most of its carnitine endogenously (fat
    body) or obtain it from the diet?
suggested_experiments:
- description: >-
    Measure carnitine and gamma-butyrobetaine levels by LC-MS/MS in CG10814 mutant or RNAi larvae and
    adults on a carnitine-free diet, with dietary carnitine rescue.
  hypothesis: >-
    Loss of CG10814 causes gamma-butyrobetaine accumulation and carnitine depletion, reversible by dietary
    carnitine.
- description: >-
    Express CG10814 recombinantly and assay gamma-butyrobetaine hydroxylation (succinate release or carnitine
    formation) in the presence of Fe(II), 2-oxoglutarate and ascorbate.
  hypothesis: CG10814 is a functional gamma-butyrobetaine dioxygenase.
