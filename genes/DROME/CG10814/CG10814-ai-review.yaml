  review:
    summary: >-
      Cytosolic localization transferred by sequence similarity from rat gamma-butyrobetaine dioxygenase
      (Q9QZU7), which has a direct (IDA) cytosolic localization in GOA.
    action: ACCEPT
    reason: >-
      Gamma-butyrobetaine hydroxylase is the cytosolic enzyme of the mammalian carnitine pathway (in contrast
      to the mitochondrial trimethyllysine dioxygenase). The ISS transfer from the rat ortholog is reasonable
      for the fly protein and no fly data contradict it. No cached source states the localization of the
      fly protein, so no quote is given.
    supported_by:
    - reference_id: PMID:33371457
      supporting_text: >-
        [39] suggested that the CG10814 gene was the most likely ortholog for the hγ-BBH1 gene, sharing
        with this the lack of a mitochondrial targeting sequence.
