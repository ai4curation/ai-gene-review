  label: Drosophila melanogaster
description: >-
  CG10814 (synonyms dGBBD, gamma-BBH) is the Drosophila melanogaster homolog of gamma-butyrobetaine dioxygenase
  (BBOX1), an Fe(II)- and 2-oxoglutarate-dependent dioxygenase of the gamma-BBH/TMLD family. It carries
  the N-terminal GBBH-like domain and the C-terminal TauD/TfdA-like double-stranded beta-helix dioxygenase
  domain, and PANTHER places it in the gamma-butyrobetaine dioxygenase subfamily (PTHR10696:SF33). By
  orthology it is expected to catalyse the final step of L-carnitine biosynthesis, the hydroxylation of
  gamma-butyrobetaine to L-carnitine with concomitant decarboxylation of 2-oxoglutarate to succinate and
  CO2, in the cytosol. Its enzymatic activity, localization and physiological role have not been examined
  experimentally in flies; all functional assignments rest on homology to the characterized mammalian
  enzymes.
