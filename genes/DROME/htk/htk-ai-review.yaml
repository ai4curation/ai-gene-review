taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nuclear chromatin-associated transcriptional coregulator in Drosophila melanogaster (single invertebrate ortholog of vertebrate ARID4A and ARID4B) containing N-terminal Tudor, central sequence-nonspecific ARID, and chromobarrel domains. Hat-trick associates with the Drosophila SIN3-RPD3 histone deacetylase complex, maintains heterochromatin clustering and karyosome architecture in the oocyte nucleus, and directly cooperates with the Notch intracellular domain and Suppressor of Hairless (Su(H)) at Enhancer of split chromatin to activate RNA polymerase II transcription.
core_functions:
- description: Chromatin-binding transcriptional coactivator that binds Notch-ICD and Suppressor of Hairless (Su(H)) to activate Notch target gene transcription by RNA polymerase II.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:31142544
    supporting_text: Using a yeast two-hybrid screen, we identiﬁed the Drosophila DNA-binding protein Hat-trick (Htk) to be an interacting partner of Notch-intracellular domain (Notch-ICD); their physical interaction was further validated by co-immunoprecipitation experiments.
  - reference_id: PMID:31142544
    supporting_text: Here, we also show that Htk cooperates with Notch-ICD and Suppressor of Hairless to form an activation complex and binds to the regulatory sequences of Notch downstream targets such as Enhancer of Split complex genes, to direct their expression.
- description: Binds DNA-binding transcription factor Su(H) and the Notch-ICD coregulator to assemble an activation complex on target enhancers.
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:31142544
    supporting_text: Using a yeast two-hybrid screen, we identiﬁed the Drosophila DNA-binding protein Hat-trick (Htk) to be an interacting partner of Notch-intracellular domain (Notch-ICD); their physical interaction was further validated by co-immunoprecipitation experiments.
  - reference_id: PMID:31142544
    supporting_text: Here, we also show that Htk cooperates with Notch-ICD and Suppressor of Hairless to form an activation complex and binds to the regulatory sequences of Notch downstream targets such as Enhancer of Split complex genes, to direct their expression.
- description: Chromatin-associated subunit of the Drosophila SIN3 histone deacetylase corepressor complex involved in RNA polymerase II transcriptional regulation.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  in_complex:
    id: GO:0070822
    label: Sin3-type complex
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:20566628
    supporting_text: To gain insight into how SIN3 isoform-specific function contributes to the growth and development of a metazoan organism, we have affinity-purified two SIN3 isoform-specific complexes, SIN3 187 and 220, from Drosophila S2 cells and embryos.
  - reference_id: PMID:29367451
    supporting_text: Here, we have shown that the chromodomain-containing protein Hat-trick is predominantly expressed within the oocyte nucleus, specifically within the heterochromatinized karyosome, and that a mild expression is observed in follicle cells.
