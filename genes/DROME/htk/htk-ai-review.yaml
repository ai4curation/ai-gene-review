  review:
    summary: IBA annotation over-propagated from Opisthokont root PTN000359478 seeded solely by human ARID5B.
    action: REMOVE
    reason: Drosophila Hat-trick is the invertebrate ortholog of sequence-nonspecific vertebrate ARID4A/ARID4B, substituting Val364 at the vertebrate ARID5 Thr388 major-groove AT-recognition site. At Notch target enhancers, Htk is recruited to chromatin through physical association with the sequence-specific transcription factor Suppressor of Hairless (Su(H)) and Notch-ICD rather than direct sequence-specific cis-regulatory DNA recognition.
    supported_by:
    - reference_id: PMID:15640446
      supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
    - reference_id: PMID:31142544
      supporting_text: Here, we also show that Htk cooperates with Notch-ICD and Suppressor of Hairless to form an activation complex and binds to the regulatory sequences of Notch downstream targets such as Enhancer of Split complex genes, to direct their expression.
    - reference_id: file:DROME/htk/htk-notes.md
      supporting_text: ARID domain (`aa 296-389`) retains Helix-1/Loop-L1 `311-RGTPL-315` (`Gly312`) and Helix-4 core `Trp350`, but carries `Val364`
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000359478
        source_label: PTN000359478
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeded solely by human ARID5B (UniProtKB:Q14865, PTHR13964:SF37) on the Opisthokont root PTN000359478; Drosophila Htk (metazoan PTHR13964:SF27) lacks the ARID5 Loop-L2/Helix-5 AT-selective motif (Val364 vs Thr388) and relies on Su(H) for cis-regulatory targeting.
