- id: PMID:20566628
  title: Drosophila SIN3 isoforms interact with distinct proteins and have unique biological functions.
  findings:
  - statement: Affinity purification of Drosophila SIN3 187 and SIN3 220 complexes from S2 cells and embryos identifies Hat-trick (CG34422) as a SIN3-associated protein.
    supporting_text: To gain insight into how SIN3 isoform-specific function contributes to the growth and development of a metazoan organism, we have affinity-purified two SIN3 isoform-specific complexes, SIN3 187 and 220, from Drosophila S2 cells and embryos.
  full_text_unavailable: true
- id: PMID:25294944
  title: Subcellular localisations of the CPTI collection of YFP-tagged proteins in Drosophila embryos.
  findings:
  - statement: Characterizes nuclear localization of CPTI YFP-tagged Hat-trick across Drosophila embryogenesis.
    supporting_text: The Cambridge Protein Trap Consortium generated, via piggyBac transposition, over 600 novel YFP-trap proteins tagging just under 400 Drosophila loci. Here, we characterise the subcellular localisations and expression patterns of these insertions, called the CPTI lines, in Drosophila embryos.
- id: PMID:31142544
  title: Regulation of Notch signaling by the chromatin-modeling protein Hat-trick.
  findings:
  - statement: Identifies Hat-trick as a direct physical interactor of Notch-ICD by yeast two-hybrid and co-immunoprecipitation.
    supporting_text: Using a yeast two-hybrid screen, we identiﬁed the Drosophila DNA-binding protein Hat-trick (Htk) to be an interacting partner of Notch-intracellular domain (Notch-ICD); their physical interaction was further validated by co-immunoprecipitation experiments.
  - statement: Shows that Htk forms an activation complex with Notch-ICD and Su(H) on Enhancer of split regulatory chromatin to drive Pol II transcription.
    supporting_text: Here, we also show that Htk cooperates with Notch-ICD and Suppressor of Hairless to form an activation complex and binds to the regulatory sequences of Notch downstream targets such as Enhancer of Split complex genes, to direct their expression.
  full_text_unavailable: true
- id: PMID:29367451
  title: Pleiotropic Functions of the Chromodomain-Containing Protein Hat-trick During Oogenesis in Drosophila melanogaster.
  findings:
  - statement: Demonstrates Htk enrichment with HP1 in the heterochromatinized oocyte karyosome and its requirement for karyosome clustering, DSB repair, and Gurken-mediated dorsoventral patterning.
    supporting_text: Here, we have shown that the chromodomain-containing protein Hat-trick is predominantly expressed within the oocyte nucleus, specifically within the heterochromatinized karyosome, and that a mild expression is observed in follicle cells.
- id: PMID:26234214
  title: Age-Dependent TDP-43-Mediated Motor Neuron Degeneration Requires GSK3, hat-trick, and xmas-2.
  findings:
  - statement: Identifies loss-of-function mutations in hat-trick as suppressors of age-dependent TDP-43(Q331K) motor neuron degeneration in adult Drosophila legs.
    supporting_text: The two additional novel suppressors, hat-trick and xmas-2, function in chromatin modeling and RNA export, two processes recently implicated in human ALS.
- id: PMID:15640446
  title: DNA-binding properties of ARID family proteins.
  findings:
  - statement: Shows that ARID subfamilies lacking the ARID5 AT-rich major-groove determinants bind DNA without sequence specificity.
    supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
- id: file:DROME/htk/htk-notes.md
  title: Curation Notes for Drosophila melanogaster htk (UniProtKB:Q9VWP5)
  findings:
  - statement: Documents Htk ARID domain sequence conservation (Trp350 hydrophobic core, Val364 substituting for the ARID5 Thr388 major-groove residue).
    supporting_text: ARID domain (`aa 296-389`) retains Helix-1/Loop-L1 `311-RGTPL-315` (`Gly312`) and Helix-4 core `Trp350`, but carries `Val364`
knowledge_gaps:
- gap_statement: Direct histone-mark specificity of the Hat-trick chromobarrel domain and how Htk switches between SIN3-RPD3 corepression and Notch/Su(H) coactivation remain biochemically uncharacterized.
  boundary: SIN3 co-purification (PMID:20566628), HP1/karyosome colocalization (PMID:29367451), and Notch-ICD/Su(H) co-IP (PMID:31142544) are established in vivo, but purified domain-level Kd measurements on modified histone tails and DNA are lacking.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Clarifies whether Drosophila Htk reads H4K20me3/H3K9me3 at the oocyte karyosome analogously to the human ARID4A chromobarrel domain.
suggested_questions:
- question: Does the chromobarrel domain of Hat-trick directly recognize H3K9me3 or H4K20me3 to promote HP1-associated heterochromatin clustering in the Drosophila oocyte karyosome?
- question: Are SIN3-RPD3 binding and Notch-ICD/Su(H) coactivation mediated by distinct Hat-trick splice isoforms or mutually exclusive C-terminal interactions?
suggested_experiments:
- description: Measure binding affinities of purified recombinant Htk Tudor, ARID, and chromobarrel domains against dsDNA and methylated histone peptide arrays (H3K9me3, H4K20me3, H3K4me3) by ITC and NMR.
- description: Perform ChIP-seq for endogenous Htk alongside SIN3, RPD3, and Su(H) in Drosophila wing imaginal discs before and after Notch pathway activation.
