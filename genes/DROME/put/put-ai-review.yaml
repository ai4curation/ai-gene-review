id: Q24468
gene_symbol: put
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Punt is a Drosophila type II receptor serine/threonine kinase shared by activin-family and
  BMP-family signaling. It forms ligand-responsive complexes with Baboon to activate Smox-dependent signaling
  and with the BMP type I receptors Thickveins or Saxophone to activate Mad-dependent signaling. Punt
  binds activin and supports complex-dependent BMP binding. Its membrane distribution is tissue dependent:
  predominantly basolateral in wing-disc and salivary epithelia, but both apical and basolateral in ovarian
  follicle cells. These receptor functions regulate embryonic patterning, organ development, neuronal
  connectivity and metabolic responses.'
