      experimental claim.
- term:
    id: GO:0032924
    label: activin receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:10320478
  qualifier: involved_in
  review:
    summary: Punt transduces activin-family signaling with Babo.
    action: ACCEPT
    reason: Native dACT/Daw signaling activates Smox through Babo and Punt; independent biochemical
      receptor assembly establishes the core role. Early assays with vertebrate activin are used for
      receptor biochemistry, not as native Actbeta proof.
    supported_by:
    - reference_id: PMID:18820452
      supporting_text: Only Drosophila Activin (dACT) and the Activin-like ligand Dawdle (DAW)
        signal through BABO in combination with the type II receptor PUNT and activate dSMAD2.
    - reference_id: PMID:19766717
      supporting_text: In cell culture, Dawdle signaling is active in the presence of the Type-II
        receptor Punt but not Wit, demonstrating that the Type-II receptor also contributes to the
        specificity of the signaling complex.
    - reference_id: PMID:8289834
      supporting_text: Atr-I binds activin efficiently when coexpressed with the distantly related
        Drosophila activin receptor Atr-II, with which it forms a heteromeric complex.
