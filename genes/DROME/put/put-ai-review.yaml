- id: file:DROME/put/put-uniprot.txt
  title: Curated UniProt record for Drosophila put
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only curated functional, location or sequence-feature statements are used; not GO
      lines, names, protein-existence levels or ARBA-only predictions.
  findings:
  - statement: Punt uses ATP in its receptor-kinase catalytic domain.
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=L-seryl-[receptor-protein] + ATP = O-phospho-L-seryl-
      [receptor-protein] + ADP + H(+);
  - statement: Punt occupies tissue-dependent plasma-membrane domains.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: Highly restricted to the basolateral cell membrane in wing disc epithelial
      cells; basolateral localization is dependent on the BLT motif and on the AP-1 adapter protein
      complex
  - statement: Punt-dependent signaling contributes to embryonic dorsal closure.
    record_section: ["CC:DISRUPTION PHENOTYPE"]
    supporting_text: Failure of dorsal closure resulting in a large hole in the dorsal cuticle
      (PubMed:7697719, PubMed:7697720, PubMed:9504926).
  - statement: Punt is required for motoneuron axon guidance.
    record_section: ["CC:FUNCTION"]
    supporting_text: Required in motoneurons for axon guidance or outgrowth of ISNb and SNa axons
      (PubMed:17119022).
  - statement: Punt contributes to development of the embryonic tracheal system.
    record_section: ["CC:FUNCTION"]
    supporting_text: Involved in dpp/BMP-like signaling during development of the embryonic gut
      tracheal system (PubMed:7697719, PubMed:7697720).
  - statement: Dpp-receptor signaling supports primary tracheal branch morphogenesis.
    record_section: ["CC:DISRUPTION PHENOTYPE"]
    supporting_text: Tracheal dorsal branches fail to develop in parasegments 6 and 7
      (PubMed:7697719).
  - statement: Punt-dependent BMP signaling contributes to wing morphogenesis.
    record_section: ["CC:FUNCTION"]
    supporting_text: Involved in adult wing development and wing- vein formation (PubMed:7697720).
  - statement: Punt mutants have head-involution defects.
    record_section: ["CC:DISRUPTION PHENOTYPE"]
    supporting_text: Defects in head involution (PubMed:7697720).
  - statement: Punt-dependent BMP signaling patterns the embryonic dorsal–ventral axis.
    record_section: ["CC:FUNCTION"]
    supporting_text: Involved in dpp-signaling-dependent dorsoventral patterning of the epidermis
      during embryogenesis (PubMed:7697719, PubMed:7697720, PubMed:9504926).
  - statement: Punt is a core BMP-pathway type II receptor.
    record_section: ["CC:FUNCTION"]
    supporting_text: Activation by BMP-like ligands, including gbb and dpp, results in
      phosphorylation of the R-SMAD Mad (PubMed:18820452, PubMed:19766717).
  - statement: Punt contributes to BMP-dependent wing-disc pattern formation.
    record_section: ["CC:FUNCTION"]
    supporting_text: Required for dpp/BMP-like signaling involved in imaginal disc development
      (PubMed:9504926).
  - statement: Punt contributes to development of adult-specific neurons.
    record_section: ["CC:FUNCTION"]
    supporting_text: Involved in differentiation of dorsal cluster and ellipsoid body adult-specific
      neurons prior to metamorphosis (PubMed:16437159).
