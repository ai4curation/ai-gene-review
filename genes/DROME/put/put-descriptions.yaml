- source: Alliance_Imported
  text: punt (put) encodes a transforming growth factor beta type II receptor that
    functions in both Dpp/BMP and Activin signaling. Pathway specificity in signaling
    output is determined by which type I receptor (Dpp/BMP or Activin one) is engaged
    in the complex with the product of put.
