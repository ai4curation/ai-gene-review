descriptions:
- source: UniProt
  text: Type II transmembrane receptor serine/threonine kinase involved in activin-like
    TGF-beta signaling and dpp/BMP-like signaling pathways (PubMed:19766717, PubMed:22563507,
    PubMed:7697719, PubMed:7697720, PubMed:8289834, PubMed:8415726). Forms a complex
    with type I transmembrane receptor serine/threonine kinases, and upon activation
    by signaling ligands induces the type I receptor to phosphorylate downstream receptor-regulated
    SMAD (R-SMAD) transcription factors, inducing their nuclear localization and resulting
    in regulation of ligand-responsive genes (PubMed:17119022, PubMed:18820452, PubMed:7697720,
    PubMed:8289834). Receptor for the activin-like TGF-beta ligands daw and Actbeta/activin
    when in complex with the type I receptor babo (PubMed:10320478, PubMed:17119022,
    PubMed:18820452, PubMed:8289834). Activation by daw requires babo isoform C (PubMed:19766717).
    Receptor for the BMP-like ligand dpp when associated with the type I receptors
    tkv or sax (PubMed:7697719, PubMed:7697720). Activation by activin-like TGF-beta
    ligands, including daw and Actbeta/activin, results in phosphorylation of the
    R-SMAD Smox/SMAD2 (PubMed:10320478, PubMed:17119022, PubMed:18820452, PubMed:19766717,
    PubMed:8289834). Activation by BMP-like ligands, including gbb and dpp, results
    in phosphorylation of the R-SMAD Mad (PubMed:18820452, PubMed:19766717). Involved
    in dpp-signaling-dependent dorsoventral patterning of the epidermis during embryogenesis
    (PubMed:7697719, PubMed:7697720, PubMed:9504926). Involved in axonal and dendritic
    pruning and neural remodeling of mushroom body gamma neurons during metamorphosis,
    probably through regulating expression of the ecdysteroid receptor EcR; functions
    redundantly with wit (PubMed:12581521). Involved in dpp/BMP-like signaling during
    development of the embryonic gut tracheal system (PubMed:7697719, PubMed:7697720).
    Required for dpp/BMP-like signaling involved in imaginal disc development (PubMed:9504926).
    Involved in differentiation of dorsal cluster and ellipsoid body adult-specific
    neurons prior to metamorphosis (PubMed:16437159). Required in motoneurons for
    axon guidance or outgrowth of ISNb and SNa axons (PubMed:17119022). Required in
    somatic cyst cells for regulation of germ cell proliferation in testis (PubMed:9334286).
    Involved in adult wing development and wing- vein formation (PubMed:7697720).
