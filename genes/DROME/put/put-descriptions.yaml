- source: Alliance_Automated
  text: Enables BMP receptor activity; activin binding activity; and activin receptor
    activity, type II. Contributes to BMP binding activity. Involved in several processes,
    including morphogenesis of an epithelium; transforming growth factor beta receptor
    superfamily signaling pathway; and wing disc development. Located in apical plasma
    membrane. Part of BMP receptor complex and activin receptor complex. Is active
    in basolateral plasma membrane. Is expressed in several structures, including
    adult head; anterior endoderm; embryonic/larval midgut primordium; germline cell;
    and gut section. Used to study juvenile polyposis syndrome. Human ortholog(s)
    of this gene implicated in several diseases, including Lynch syndrome; acute kidney
    failure; colon cancer; prostate disease; and visceral heterotaxy (multiple). Orthologous
    to human ACVR2A (activin A receptor type 2A) and ACVR2B (activin A receptor type
    2B).
