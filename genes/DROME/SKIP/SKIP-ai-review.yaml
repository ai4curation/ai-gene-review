id: A0A0B4K6C1
gene_symbol: SKIP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SKIP (Shal K+ channel interacting protein, CG31163) is a neuronal Drosophila gene
  of the SAM- and SH3-domain (SASH1/SAMSN1) adaptor family. It encodes several isoforms built
  from an N-terminal SAM domain, an SH3 domain and a second, C-terminal SAM domain in
  different combinations. A0A0B4K6C1 is a long 1034-residue isoform carrying all three
  domains, separated by disordered regions, and has no predicted transmembrane segment. The
  short isoform SKIP3, which consists of the first SAM domain plus a tail ending in eight
  unique residues, binds the cytoplasmic C terminus of the Kv4-family channel Shal through
  that octapeptide. In embryonic neurons SKIP3 increases the share of Shal channels with
  slower fast inactivation. Long isoforms such as this one lack the Shal-binding octapeptide,
  and no partner or activity is known for them. When expressed in neurons, tagged SKIP
  proteins are cytoplasmic and are found in cell bodies and in puncta along neurites. SKIP
  is expressed throughout the embryonic central and peripheral nervous system and in adult
  antennae. A gene-trap insertion in the SKIP 5' UTR reduces olfactory-driven trap
  behaviour, and precise excision reverts this, but electroantennogram responses are
  normal.
