  review:
    summary: Electronic cytoplasm annotation derived from an ARBA rule (UniProt subcellular-location
      line). It agrees with direct imaging of tagged SKIP isoforms in neurons and with the
      soluble adaptor architecture of the protein.
    action: ACCEPT
    reason: The ARBA source is not used as support. Independently, myc-tagged SKIP1 (a long
      isoform with the same SAM1-SH3-SAM2 architecture as A0A0B4K6C1) and SKIP3 were imaged in
      the soma and in puncta along processes of cultured Drosophila neurons. The authors propose
      that SKIP3 may recruit cytosolic regulators. A0A0B4K6C1 has no predicted transmembrane helix or
      signal peptide, and its annotated features are SAM and SH3 protein-interaction domains and
      disordered regions. Cytoplasm is the most specific location supported for the whole
      protein. It is kept at this level, and the neuronal cell body term is added as a NEW row.
    supported_by:
    - reference_id: PMID:19463952
      supporting_text: We found that myc-SKIP3 and myc-SKIP1 are localized to neuronal cell bodies
        and in puncta along neuronal processes (Fig. 3)
- term:
    id: GO:0007608
    label: sensory perception of smell
  evidence_type: IMP
  original_reference_id: PMID:22530061
  qualifier: involved_in
  review:
    summary: FlyBase IMP from an olfactory gene-trap screen. Line BG00076, carrying a pGT insertion
      in the SKIP 5' UTR, shows reduced olfactory trap responses in both sexes. Precise excision
      reverts the defect, and SKIP transcript is reduced about five-fold.
    action: KEEP_AS_NON_CORE
    reason: The full text was read. The genetics are sound (two independent precise excisions
      restore behaviour, and transcript levels are reduced), so the annotation is supported at
      the gene level and is kept. It is non-core. The assay measures olfactory-driven trap
      behaviour, and electroantennograms are normal, so primary odorant transduction is
      unaffected. The authors suggest a central or synaptic role. The insertion lowers SKIP
      transcript but is not mapped to particular isoforms, and the SKIP products that bind Shal
      (SKIP3) differ from this long isoform. The annotation records a phenotype-level
      requirement and does not identify which part of olfactory perception SKIP performs.
    supported_by:
    - reference_id: PMID:22530061
      supporting_text: For BG00076 we found that precise excision of the pGT element in two independent
        excision lines rescued the olfactory response in both females and males (Figure 4A and
        4B), confirming that the olfactory behaviour defect is due to the pGT element insertion.
    - reference_id: PMID:22530061
      supporting_text: There was no effect on the EAG, but a limited set of odours was tested, and
        in addition if the gene is involved in synaptic transmission then we would not expect to
        see a primary EAG defect.
    - reference_id: file:DROME/SKIP/SKIP-deep-research-manual.md
      supporting_text: Which isoforms the insertion affects is not known.
- term:
    id: GO:0043025
    label: neuronal cell body
  evidence_type: IDA
  original_reference_id: PMID:19463952
  qualifier: located_in
  review:
    summary: Proposed location. In elav-GAL4 primary neuronal cultures, myc-tagged long isoform
      SKIP1 and short isoform SKIP3 localize to neuronal cell bodies and to puncta along
      processes.
    action: NEW
    reason: This is direct imaging of a tagged protein. The authors repeated it in a SKIP-deficient
      background to address overexpression artefacts. SKIP1 (Q8SZS0) shares the SAM1-SH3-SAM2
      architecture of A0A0B4K6C1 and is identical to it over the N-terminal SAM1 region. The
      localization therefore applies to the long isoforms, not only to the Shal-binding SKIP3.
      The punctate signal along processes has no assigned compartment, so no neuron projection
      sub-compartment term is proposed.
    supported_by:
    - reference_id: PMID:19463952
      supporting_text: We found that myc-SKIP3 and myc-SKIP1 are localized to neuronal cell bodies
        and in puncta along neuronal processes (Fig. 3)
    - reference_id: file:DROME/SKIP/SKIP-bioinformatics/RESULTS.md
      supporting_text: A0A0B4K6C1 is a long isoform like SKIP1
