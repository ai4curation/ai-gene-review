- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:22530061
  title: A screen for genes expressed in the olfactory organs of Drosophila melanogaster identifies
    genes involved in olfactory behaviour.
  findings:
  - statement: Gene-trap line BG00076 (pGT insertion in the SKIP 5' UTR) has reduced olfactory
      trap responses, and precise excision restores them.
    supporting_text: For BG00076 we found that precise excision of the pGT element in two independent
      excision lines rescued the olfactory response in both females and males
  - statement: The insertion reduces SKIP transcript about five-fold.
    supporting_text: There is an approximately five fold decrease of Skip transcription in line BG00076.
  - statement: SKIP is expressed in antennae, head and body but not in maxillary palps.
    supporting_text: These experiments showed that the SKIP gene was expressed endogenously in antennae,
      head, and body but not in four separate preparations of maxillary palp tissue (Figure S4).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read (PMC3329464). PMID and title match the cached record. This is
      the source of the FlyBase IMP. The genetics are sound for olfactory behaviour, but there
      is no mechanism and the EAG is normal.
- id: PMID:19463952
  title: Fast inactivation of Shal (K(v)4) K+ channels is regulated by the novel interactor SKIP3
    in Drosophila neurons.
  findings:
  - statement: SKIP encodes isoforms with SAM and SH3 domains. SKIP1 has SAM1, SH3 and SAM2,
      SKIP2 has SH3 and SAM2, and SKIP3 has SAM1 only.
    supporting_text: SKIP1 contains both SAM1 and SAM2 domains, while SKIP2 contains only the SAM2
      domain and SKIP3 contains only the SAM1 domain.
  - statement: Shal binding requires the eight C-terminal residues unique to SKIP3, so SKIP3 is
      proposed to be the only Shal-binding isoform.
    supporting_text: Thus, SKIP3 is likely to be the only SKIP isoform that interacts with Shal
      channels.
  - statement: In SKIP-deficient embryonic neurons more cells show very fast-inactivating Shal
      currents, and myc-SKIP3 expression reverses this.
    supporting_text: We found that myc-SKIP3 expression in ΔSKIP neurons indeed decreased the percentage
      of neurons with such a rapidly inactivating Shal current to 35%
  - statement: Tagged SKIP1 and SKIP3 localize to neuronal cell bodies and to puncta along processes.
    supporting_text: We found that myc-SKIP3 and myc-SKIP1 are localized to neuronal cell bodies
      and in puncta along neuronal processes (Fig. 3)
  - statement: SAM-SAM homo- or heterotypic interactions between SKIP SAM domains were not detected.
    supporting_text: None of these combinations of SAM domains tested positive for an interaction
      (data not shown).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC2730949). Verified with PubMed (doi 10.1016/j.mcn.2009.05.003).
      This is the defining paper for SKIP. Its Shal-binding and channel-regulation data are
      specific to the short SKIP3 isoform. The localization data include the long isoform SKIP1.
