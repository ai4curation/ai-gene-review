core_functions:
- description: Cytoplasmic multi-domain adaptor of neurons. The long SAM1-SH3-SAM2 isoform
    A0A0B4K6C1 has no demonstrated molecular activity or binding partner. Its SAM and SH3
    domains suggest a scaffolding role, but SKIP SAM domains do not self-associate, and the
    Shal K+ channel-binding octapeptide that underlies the known function of the short
    isoform SKIP3 is absent from it. No molecular function term is asserted for this product.
  locations:
  - id: GO:0043025
    label: neuronal cell body
  supported_by:
  - reference_id: PMID:19463952
    supporting_text: We found that myc-SKIP3 and myc-SKIP1 are localized to neuronal cell bodies
      and in puncta along neuronal processes (Fig. 3)
  - reference_id: PMID:19463952
    supporting_text: Given that SAM and SH3 domains have been shown to mediate protein-protein interactions,
      SKIP proteins are likely to function as a family of adaptor or scaffolding proteins.
  - reference_id: file:DROME/SKIP/SKIP-bioinformatics/RESULTS.md
    supporting_text: Shal binding and Shal-inactivation regulation demonstrated for SKIP3 cannot be
      transferred to it.
  knowledge_gaps:
  - gap_statement: The binding partners of the SAM1, SH3 and SAM2 domains of the long SKIP
      isoforms are unknown, as is whether these isoforms take part in Shal channel regulation,
      for example by competing with SKIP3 for a SAM1 partner.
    boundary: Shal binding and regulation of Shal inactivation are established only for the short
      SKIP3 isoform, through its unique C-terminal octapeptide.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does the BG00076 5' UTR insertion reduce all SKIP isoforms or only some, and is the
    olfactory behaviour defect due to loss of SKIP3 (Shal regulation) or of the long SAM1-SH3-SAM2
    isoforms?
- question: Should the Shal-binding and Shal-inactivation regulation data of PMID:19463952 be
    annotated by FlyBase to the SKIP3 product (UniProt A0A0B4KH49), for example as ion channel
    binding and regulation of potassium ion transmembrane transport, rather than at gene level?
- question: What do the SH3 and SAM2 domains of the long SKIP isoforms bind? Do they share
    partners with mammalian SASH1/SAMSN1 family proteins?
suggested_experiments:
- description: Make isoform-specific CRISPR alleles (deleting the SKIP3-specific 3' exon versus
    the SH3/SAM2-encoding exons) and test olfactory trap behaviour and Shal current inactivation
    in each.
  experiment_type: genetic perturbation
- description: Affinity-purify tagged long SKIP isoforms from fly heads and identify partners by
    mass spectrometry. Then map the binding of candidates to individual SAM1, SH3 and SAM2 domains.
  experiment_type: proteomics / biochemistry
