descriptions:
- source: Alliance_Automated
  text: Involved in sensory perception of smell. Predicted to be located in cytoplasm.
    Is expressed in several structures, including central brain primordium; dorsal
    epidermis primordium; embryonic/larval midgut primordium; ganglia; and gut section.
    Human ortholog(s) of this gene implicated in dyschromatosis universalis hereditaria;
    immunodeficiency 102; and squamous cell carcinoma. Orthologous to several human
    genes including SASH1 (SAM and SH3 domain containing 1); SASH3 (SAM and SH3 domain
    containing 3); and SAMSN1 (SAM domain, SH3 domain and nuclear localization signals
    1).
