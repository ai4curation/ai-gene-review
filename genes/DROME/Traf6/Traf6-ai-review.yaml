  evidence_type: TAS
  original_reference_id: PMID:10449347
  qualifier: involved_in
  review:
    summary: Dorsal closure, from a 1999 review of JNK signalling in morphogenesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The review is abstract-only here and its abstract names no TRAF. In 1999 the only TRAF linked to
      the dorsal-closure JNK pathway was DTRAF1 (now Traf4): the Misshapen kinase binds DTRAF1 but not
      DTRAF2 (this gene). Traf6 null mutants develop into adults with no morphological defects, whereas
      failure of dorsal closure is embryonic lethal, and no later study implicates Traf6 in dorsal closure.
