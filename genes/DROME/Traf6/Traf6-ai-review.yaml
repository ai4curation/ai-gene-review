core_functions:
- description: >-
    Adaptor of the Eiger/TNF pathway: Traf6 binds the intracellular regions of the TNF receptors Grindelwald
    and Wengen and acts upstream of dTAK1 to activate the JNK cascade, driving Eiger-induced cell death
    and tumour invasiveness.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
