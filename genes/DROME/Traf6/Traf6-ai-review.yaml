suggested_questions:
- question: >-
    Is Traf6 required in vivo for Toll-dependent defence against Gram-positive bacteria and fungi, given
    that the null is viable and resists Gram-negative infection?
- question: >-
    What is the E3 ligase of the Imd pathway, if not Traf6, and do Traf6 and Diap2 act redundantly there?
- question: >-
    Do Traf4 (DTRAF1) and Traf6 act redundantly in embryonic JNK-dependent morphogenesis such as dorsal
    closure?
- question: >-
    Should PAINT add a loss of GO:0031663 lipopolysaccharide-mediated signaling pathway at the arthropod
    TRAF6 node (PTN008494381), or move the IBD to a vertebrate node?
- question: >-
    Is Traf6 present at the larval neuromuscular junction or at central synapses, and does it act there
    in Eiger/Wengen or Toll-family signalling?
suggested_experiments:
- description: >-
    Challenge Traf6 null and Traf4;Traf6 double mutants with Gram-positive bacteria, fungi and Gram-negative
    bacteria, measuring survival and Drosomycin/Diptericin induction alongside Toll and Imd pathway controls.
- description: >-
    Generate a RING-dead Traf6 knock-in (zinc-ligand cysteine substitutions) and test Eiger-induced JNK
    activation, Bendless-dependent polyubiquitination and Toll signalling in vivo.
- description: >-
    Tag endogenous Traf6 and image it in larval motor neurons, muscles and imaginal discs, with Grindelwald
    and Wengen co-staining, to test membrane recruitment and synaptic localisation.
