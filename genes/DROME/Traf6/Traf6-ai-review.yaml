id: Q9W3I9
gene_symbol: Traf6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Traf6 (formerly DTRAF2) is the Drosophila ortholog of mammalian TRAF6, a cytoplasmic signalling protein
  with an N-terminal RING domain, zinc fingers, a coiled coil and a C-terminal MATH (TRAF) domain. Through
  its TRAF domain it binds the intracellular regions of the fly TNF receptors Grindelwald and Wengen and
  the Toll-pathway kinase Pelle. With the E2 Bendless (Ubc13) and dUev1a it takes part in K63-linked polyubiquitination,
  and it is itself polyubiquitinated; the deubiquitinase CYLD removes these chains and stabilises it. Downstream of the TNF
  Eiger and its receptors, Traf6 acts upstream of dTAK1 to activate the JNK cascade, which drives Eiger-induced
  cell death and the invasive growth of polarity-deficient tumours. In immunity it promotes Toll signalling
  and NF-kappaB (Dif, Dorsal and Relish) activation and antimicrobial peptide induction, and it is needed
  for antiviral autophagy against Rift Valley fever virus and for intestinal immune homeostasis
  during ageing; null mutants are viable and morphologically normal and still resist Gram-negative infection,
  so Traf6 is not essential for Imd-pathway defence. Traf6 also binds the Notch intracellular domain and,
  with Deltex, negatively regulates Notch signalling in wing discs.
