  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:108072
  - PANTHER:PTN008494376
  review:
    summary: >-
      Lipopolysaccharide-mediated signalling, inherited at the TRAF6 clade node from mouse Traf6.
    action: REMOVE
    reason: >-
      GO:0031663 starts with LPS binding to a cell-surface receptor. The IBD at PTN008494376 (TRAF6 orthologs,
      Eumetazoa) is seeded only by mouse Traf6 (MGI IGI/IMP on TLR-TRAF6 signalling), and it is placed
      deep enough to cover all invertebrate TRAF6s. LPS sensing through TLR4, MD-2 and CD14 is a vertebrate
