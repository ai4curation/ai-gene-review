      names does not exist in the fly lineage. PAINT already records a loss of this term on a tick TRAF6
      leaf (PTN000805675); a loss on the arthropod TRAF6 node (PTN008494381), or moving the IBD to a vertebrate
      node, would fix the propagation.
    supported_by:
