  review:
    summary: Signalling adaptor activity, inherited at the eumetazoan TRAF duplication node.
    action: ACCEPT
    reason: >-
      The IBD sits at PTN008301857, the Eumetazoa duplication node that gave rise to the TRAF1/2, TRAF3/5,
      TRAF4 and TRAF6 clades, and is seeded by mouse Traf2. PAINT placed losses on the insect TRAF1/2
      clade (which holds fly Traf-like), on an ecdysozoan clade and on two vertebrate nodes, but not on
      the TRAF6 clade, so fly Traf6 inherits the activity. Fly evidence fits: Traf6 binds the intracellular
