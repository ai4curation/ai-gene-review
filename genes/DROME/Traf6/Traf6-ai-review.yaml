- id: file:DROME/Traf6/Traf6-deep-research-flybase.md
  title: FlyBase gene description for Traf6 (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Each claim was traced. Adaptor family member interacting with cell-surface receptors: binding to
      the Wengen (PMID:12894227) and Grindelwald (PMID:25874673, PMID:33824334) receptor tails. Toll and
      related receptor signalling: Pelle binding and Dorsal activation (PMID:11447260), Dif/Relish activation
      and drosomycin induction (PMID:14585960), antiviral autophagy, studied as a Toll-7-triggered response (PMID:24374193); "pro-inflammatory"
      is mammalian wording for what in the fly is antimicrobial and antiviral defence. Egr-induced JNK-dependent
      cell death: PMID:17765686, PMID:24162658, PMID:25874673. Nothing is wrong. The text omits the ubiquitin
      ligase role with Bendless and dUev1a, Notch regulation, and the evidence that Traf6 is not needed
      for Imd-dependent resistance (PMID:16894030).
