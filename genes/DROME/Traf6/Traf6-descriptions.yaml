findings:
- category: discrepancy
  text: The automated text places Traf6 in the nucleus and at glutamatergic synapses; the
    review marks both over-annotated (an ARBA rule and an IBA seeded by one rodent SynGO study,
    with no fly data).
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: FlyBase does not mention the RING E3 ligase activity with Bendless (Ubc13) and dUev1a
    or the negative regulation of Notch; the automated text does not mention Toll signalling
    or immunity.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: Both texts describe a TRAF adaptor in TNF/JNK signalling. FlyBase adds Toll
    signalling, and the automated text adds the E3 activity but also two over-annotated locations.
