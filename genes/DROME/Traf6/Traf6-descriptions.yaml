descriptions:
- source: Alliance_Imported
  text: TNF-receptor-associated factor 6 (Traf6) encodes a protein that belongs to a family
    of adaptor proteins involved in transducing downstream signaling by interacting with cell
    surface receptors. It mediates the pro-inflammatory effects of Toll and related receptor
    signaling, and the cell death induced by JNK activation via the product of egr.
  source_type: curated
  url: https://flybase.org/reports/Traf6.html
  source_id: FB:FBgn0265464
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Adaptor binding cell-surface receptors, Toll-pathway signalling and Egr-induced
      JNK-dependent cell death are all traced to fly papers. 'Pro-inflammatory' is mammalian
      wording for antimicrobial and antiviral defence. Omits the RING E3 role with Bendless
      and dUev1a, Notch regulation, and the dispensability of Traf6 for Imd-dependent resistance.
- source: Alliance_Automated
  text: Enables tumor necrosis factor receptor superfamily binding activity and ubiquitin
    protein ligase activity. Involved in several processes, including positive regulation
    of signal transduction; protein K63-linked ubiquitination; and tumor necrosis factor-mediated
    signaling pathway. Predicted to be located in nucleus. Predicted to be active in cytoplasm;
    cytoplasmic side of plasma membrane; and glutamatergic synapse. Is expressed in eye disc
    posterior to the morphogenetic furrow. Orthologous to human TRAF6 (TNF receptor associated
    factor 6).
  source_type: automated
  url: https://flybase.org/reports/Traf6.html
  source_id: FB:FBgn0265464
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: TNF receptor superfamily binding, ubiquitin ligase activity, K63-linked
      ubiquitination and TNF signalling are correct. 'Predicted to be located in nucleus'
      and 'active in glutamatergic synapse' come from an ARBA rule and a rodent-seeded IBA
      that the review marks over-annotated. No mention of Toll or immunity.
