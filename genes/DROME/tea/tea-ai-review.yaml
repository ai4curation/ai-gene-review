  label: Drosophila melanogaster
description: tea (telomere ends associated) encodes a large (about 1,900 residue) Drosophila-specific
  telomere-capping protein that is enriched specifically at chromosome ends and prevents telomere fusion.
  Tea forms the MTV complex with Moi and Ver and recruits these proteins to telomeres; the MTV complex
  binds and protects single-stranded DNA in a sequence-independent manner and associates with the HipHop-HOAP
  subcomplex to make up terminin, functionally analogous to CST or TPP1-POT1 in telomerase-based organisms.
