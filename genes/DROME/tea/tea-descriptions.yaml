descriptions:
- source: UniProt
  text: Part of the MTV complex that associates with the HipHop-HOAP complex to form
    the terminin telomere-capping complex involved in telomere maintenance and prevention
    of telomere fusion (PubMed:27835648). As part of the MTV complex binds single
    stranded DNA in a sequence-independent manner, protecting it from degradation
    (PubMed:27835648). May mediate recruitment of the MTV complex at telomeres through
    interaction with components of the HipHop-HOAP complex (PubMed:27835648).
  source_type: curated
