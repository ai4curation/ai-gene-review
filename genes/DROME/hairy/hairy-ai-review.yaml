core_functions:
- description: Sequence-specific DNA-binding transcriptional repressor of the bHLH-Orange
    (HES) family; binds N-box/class-C sites in target cis-regulatory regions through a
    repressor-type bHLH domain and actively represses RNA polymerase II transcription of
    target genes such as achaete and fushi tarazu.
  supported_by:
  - reference_id: PMID:7958929
    supporting_text: transcriptional repressor
  - reference_id: PMID:7958929
    supporting_text: direct downstream target of h regulation in vivo
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0007366
    label: periodic partitioning by pair rule gene
  - id: GO:0050767
    label: regulation of neurogenesis
  locations:
  - id: GO:0005634
    label: nucleus
- description: Recruits the Groucho (Gro/TLE) transcriptional corepressor to target promoters
    via its C-terminal WRPW tetrapeptide, converting DNA-bound Hairy into an active long-range
    repressor complex; the corepressor-recruitment activity is the mechanistic basis of
    Hairy-mediated repression.
  supported_by:
  - reference_id: PMID:8649374
    supporting_text: recruited by the 4-amino acid protein-protein interaction domain, WRPW
  - reference_id: PMID:9371806
    supporting_text: It does interact with the non-HLH protein Groucho
