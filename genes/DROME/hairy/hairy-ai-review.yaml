suggested_questions:
- question: >-
    To what extent does Hairy repress through the N-box (CACNAG) versus E-box/class-C
    sites genome-wide, and does binding-site type correlate with distinct target-gene
    classes (segmentation vs. proneural vs. metabolic)?
- question: >-
    How is the balance between Groucho- and CtBP-dependent repression by Hairy set at
    individual target loci, given the evidence that the two corepressors act through
    separate, sometimes antagonistic, pathways?
suggested_experiments:
- description: >-
    Genome-wide binding (CUT&RUN or ChIP-seq) of Hairy in staged embryos combined with
    motif analysis to quantify N-box vs. E-box occupancy and integrate with target-gene
    expression.
- description: >-
    Structure-function dissection separating the WRPW/Groucho and PLSLV/CtBP interaction
    surfaces (point mutants) with transcriptional readouts at segmentation and proneural
    targets to define corepressor-specific target sets.
