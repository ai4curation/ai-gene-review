id: P14003
gene_symbol: hairy
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'hairy (h) is a basic helix-loop-helix-Orange (bHLH-O), HES-family sequence-specific
  DNA-binding transcriptional repressor of Drosophila melanogaster. Through a repressor-type
  bHLH domain bearing a helix-interrupting proline it binds N-box (CACNAG) and related
  class-C/E-box sites in target promoters, and it represses transcription by recruiting
  the Groucho (Gro/TLE) corepressor through its C-terminal WRPW tetrapeptide, with an
  accessory, weaker interaction with the CtBP corepressor. Hairy is a primary pair-rule
  segmentation gene that patterns the anterior-posterior axis of the early embryo, repressing
  targets such as fushi tarazu, and it also patterns the adult peripheral nervous system,
  setting sensory bristle (chaeta) spacing by directly repressing the proneural achaete-scute
  genes. It acts in the nucleus and functions as a long-range transcriptional repressor.
  Its repressive activity is modulated post-translationally by RING/SUMO-targeted ubiquitin
  ligases (Topors, Degringolade) that bind Hairy and antagonize Groucho recruitment or
  trigger its degradation. Additional context-dependent roles include repression of metabolic
  genes contributing to hypoxia tolerance and, indirectly through its target genes, effects
  on epithelial tube (e.g. salivary gland) morphogenesis.'
