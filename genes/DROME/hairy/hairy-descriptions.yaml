- source: Alliance_Automated
  text: Enables DNA-binding transcription repressor activity, RNA polymerase II-specific;
    E-box binding activity; and transcription corepressor binding activity. Involved
    in several processes, including negative regulation of transcription by RNA polymerase
    II; response to hypoxia; and salivary gland morphogenesis. Predicted to be active
    in nucleus. Is expressed in several structures, including adult CNS glial cell;
    anal pad; germ layer; gut section; and imaginal disc. Orthologous to human HES1
    (hes family bHLH transcription factor 1) and HES4 (hes family bHLH transcription
    factor 4).
