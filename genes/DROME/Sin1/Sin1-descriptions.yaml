descriptions:
- source: UniProt
  text: Component of the target of rapamycin complex 2 (TORC2), which transduces signals
    from growth factors to pathways involved in proliferation, cytoskeletal organization
    and anabolic output (PubMed:16919458, PubMed:17043309). In response to growth
    factors, TORC2 phosphorylates and activates AGC protein kinase family members,
    such as Akt1 (PubMed:16919458, PubMed:17043309). Within the TORC2 complex, Sin1
    acts as a substrate adapter which recognizes and binds AGC protein kinase family
    members for phosphorylation by mTor (By similarity).
  source_type: curated
