id: Q9V393
gene_symbol: krz
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Kurtz (Krz) is the single non-visual (beta-)arrestin of Drosophila melanogaster,
  a cytoplasmic member of the arrestin family with two arrestin domains. As a
  canonical arrestin, it binds activated/phosphorylated G-protein-coupled receptors
  and receptor-family proteins and acts as an adaptor that promotes their
  clathrin-mediated internalization, desensitization and downregulation; conserved
  residues required for GPCR targeting to clathrin-coated pits and for clathrin
  binding are functionally important. Krz is essential for viability and neural
  function and, because it is the only non-visual arrestin in the fly, has broad
  pleiotropic roles as an attenuator of multiple developmental and immune signalling
  pathways. It limits receptor-tyrosine-kinase/MAPK (ERK) signalling by directly
  binding and sequestering inactive ERK away from its activating kinase MEK, thereby
  restraining the Torso pathway in the early embryo; it limits Toll/NF-kappaB (Dorsal)
  signalling in part by binding and stabilizing the IkappaB orthologue Cactus and,
  in larvae, through a functional interaction with the SUMO protease Ulp1; it can
  promote internalization and proteasomal degradation of the GPCR-family receptor
  Smoothened (antagonizing Hedgehog signalling when over-expressed) and facilitates
  Smoothened desumoylation via Ulp1; and it forms a Notch-Deltex-Kurtz complex that
  drives ubiquitination-dependent degradation of the Notch receptor. In the adult
  nervous system Krz is required for exploratory locomotor behaviour. The protein is
  predominantly cytoplasmic/cytosolic, acting transiently at the plasma membrane and
  endocytic compartments during receptor internalization.
existing_annotations:
- term:
    id: GO:0007600
    label: sensory perception
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic (IBA) annotation reflecting the arrestin family's conserved role in
      sensory/GPCR signalling; Krz controls Drosophila olfaction and other sensory GPCR
      responses. A real but distal, pleiotropic role rather than the gene's core
      biochemical function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Consistent with Krz functioning as a GPCR regulator that controls sensory
      responses such as olfaction, but this is a downstream physiological outcome of the
      core arrestin activity rather than the molecular function itself; kept as non-core.
    supported_by:
    - reference_id: PMID:20802461
      supporting_text: controls Drosophila olfaction, behaviour, sensitivity to osmotic stress
- term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Core, evolutionarily conserved molecular function of a non-visual arrestin: binding
      activated/phosphorylated GPCRs (and GPCR-family receptors such as Smoothened) to
      desensitize them and drive their internalization.
    action: ACCEPT
    reason: >-
      Well supported both by the canonical arrestin mechanism and by direct experimental
      demonstration in Drosophila that Krz binds the GPCR-family receptor Smoothened. This
      is a central, defining molecular function of Krz and is retained as core.
    supported_by:
    - reference_id: PMID:21437272
      supporting_text: Krz binds to Smo and internalizes it via clathrin-coated vesicles
    - reference_id: PMID:20802461
      supporting_text: promote internalization of GPCRs on receptor activation
