suggested_questions:
- question: >-
    Does Krz bind clathrin and/or the AP-2 adaptor directly in Drosophila (as predicted by the
    conserved Leu440/IsoLeu441/Leu443 clathrin-binding motif), and can a specific clathrin-binding
    or clathrin-adaptor molecular function be experimentally assigned?
- question: >-
    Which endogenous GPCRs (beyond Smoothened) are physiological Krz substrates in vivo, and is
    Krz's ERK-sequestration mechanism used downstream of GPCRs as well as RTKs?
suggested_experiments:
- description: >-
    Endogenous co-immunoprecipitation / proximity-labeling of Krz to identify its receptor and
    adaptor (clathrin, AP-2) interactome under basal versus receptor-activated conditions.
- description: >-
    Live imaging of tagged endogenous Krz to test transient recruitment to the plasma membrane and
    endosomes during agonist-induced receptor internalization.
