- term:
    id: GO:0045746
    label: negative regulation of Notch signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:16284625
  qualifier: involved_in
  review:
    summary: >-
      Krz forms a trimeric Notch-Deltex-Kurtz complex that promotes ubiquitination-dependent
      degradation of the Notch receptor, thereby down-regulating Notch signalling. GOA carries
      this term as two IGI rows from the same reference, one per genetic-interaction partner
