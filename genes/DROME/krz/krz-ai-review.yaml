- term:
    id: GO:0045879
    label: negative regulation of smoothened signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:21437272
  qualifier: involved_in
  review:
    summary: >-
      Over-expression of Krz phenocopies loss of Hedgehog signalling and reduces Hh target-gene
      expression (Ptc, En) by promoting Smoothened internalization and degradation. Note the
      effect is seen only on over-expression; krz loss-of-function has no Smo phenotype.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported antagonism of Smoothened/Hh signalling, but manifested only upon
