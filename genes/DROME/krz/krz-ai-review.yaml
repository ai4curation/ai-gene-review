- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20802461
  qualifier: enables
  review:
    summary: >-
      Bare 'protein binding' from the interaction between Krz and ERK (rolled), the
      WITH/FROM = UniProtKB:P40417 row of this IPI pair. Uninformative as annotated; the
      specific, experimentally supported activity is binding of the MAP kinase ERK, which
      Krz sequesters in its inactive form. The second partner from the same reference
      (UniProtKB:Q03017, Cactus) is adjudicated in the entry below.
    action: MODIFY
    reason: >-
      'protein binding' conveys no functional information. The IPI evidence (Krz directly binds
      ERK/rolled; IntAct NbExp=12) supports the more informative molecular function
      'mitogen-activated protein kinase binding' (GO:0051019).
    proposed_replacement_terms:
    - id: GO:0051019
      label: mitogen-activated protein kinase binding
    supported_by:
    - reference_id: PMID:20802461
      supporting_text: Krz can directly bind and sequester an inactive form of ERK, thus preventing its activation by the upstream kinase, MEK
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20802461
  qualifier: enables
  review:
    summary: >-
      The second IPI row from the same reference, WITH/FROM = UniProtKB:Q03017 (Cactus, the
      Drosophila IkappaB orthologue). Co-immunoprecipitation from S2 cells and an in vitro
      translated-protein assay support a direct Krz-Cactus interaction; Krz stabilizes Cactus
      and thereby limits Toll/Dorsal signalling. Unlike the ERK interaction, Cactus binding is
      insensitive to the 'pre-activated' Krz-R209E conformation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Bare 'protein binding' conveys no functional information and should not stand as a
      molecular function. Unlike the ERK partner, there is no specific GO molecular-function
      term for binding an IkappaB/Cactus-family inhibitor (GO has no 'I-kappaB binding' MF;
      GO:0051059 NF-kappaB binding is the wrong target, since Cactus is the inhibitor, not the
      Rel factor), so no replacement term is proposed rather than forcing an inaccurate one.
      The biology this interaction supports is already captured by the GO:0045751 negative
      regulation of Toll signaling pathway annotation, which cites the same experiments.
    supported_by:
    - reference_id: PMID:20802461
      supporting_text: We detected an interaction using co-immunoprecipitation from S2 cells
        ( Figure 7J ), as well as using in vitro translated proteins ( Supplementary Figure
        S7 ), suggesting a direct binding.
    - reference_id: PMID:20802461
      supporting_text: We observed that Krz can directly bind to the Drosophila orthologue of
        IκBα, Cactus
- term:
    id: GO:0045751
    label: negative regulation of Toll signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:24077307
  qualifier: involved_in
  review:
    summary: >-
      Krz limits Toll/NF-kappaB signalling in larvae/immunity, acting together with the SUMO
      protease Ulp1; loss of krz produces an inflammatory phenotype with nuclear accumulation
      of Toll effectors Dorsal and Dif.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported inhibitory role in Toll signalling and inflammation, but a
      pleiotropic downstream regulatory role rather than the core arrestin biochemical function.
    supported_by:
    - reference_id: PMID:24077307
      supporting_text: Loss of function of krz or Ulp1 in Drosophila larvae results in a similar inflammatory phenotype
- term:
    id: GO:0120177
    label: negative regulation of torso signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:20802461
  qualifier: involved_in
  review:
    summary: >-
      Krz restrains the Torso RTK pathway in the early embryo by limiting ERK activity;
      maternal loss of krz expands and intensifies dpERK and Torso target-gene expression.
    action: KEEP_AS_NON_CORE
    reason: >-
      Directly supported by maternal krz mutant analysis (increased/expanded dpERK; upregulated
