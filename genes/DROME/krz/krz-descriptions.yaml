descriptions:
- source: Alliance_Imported
  text: kurtz (krz) encodes a &bgr;-arrestin (non-visual arrestin) involved in the
    desensitization and endocytic internalization of G protein coupled receptors,
    thus downregulating their activity. It also controls other signaling pathways,
    including Notch, receptor tyrosine kinase, Hedgehog, and Toll. It is required
    maternally for normal embryonic patterning and zygotically for larval viability.
  source_type: curated
  url: https://flybase.org/reports/krz.html
  source_id: FB:FBgn0040206
