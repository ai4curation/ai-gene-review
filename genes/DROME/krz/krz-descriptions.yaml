- source: Alliance_Automated
  text: Predicted to enable G protein-coupled receptor binding activity. Involved
    in several processes, including locomotory exploration behavior; negative regulation
    of signal transduction; and positive regulation of protein desumoylation. Located
    in cytosol. Is expressed in several structures, including adult head; cuticular
    specialization; epithelium; female germline cell; and imaginal disc. Human ortholog(s)
    of this gene implicated in glioblastoma; myopia; nicotine dependence; opiate dependence
    (multiple); and retinal disease (multiple). Orthologous to several human genes
    including ARRB1 (arrestin beta 1).
  source_type: automated
