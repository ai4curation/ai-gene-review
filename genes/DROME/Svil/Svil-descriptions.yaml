descriptions:
- source: Alliance_Automated
  text: Predicted to enable actin filament binding activity and phosphatidylinositol-4,5-bisphosphate
    binding activity. Predicted to be involved in actin filament severing; actin polymerization
    or depolymerization; and barbed-end actin filament capping. Predicted to be active
    in actin cytoskeleton. Is expressed in several structures, including adult head;
    anlage in statu nascendi; central brain anlage in statu nascendi; dorsal ectoderm;
    and dorsal ectoderm anlage. Human ortholog(s) of this gene implicated in myofibrillar
    myopathy 10. Orthologous to human SVIL (supervillin).
  source_type: automated
  url: https://flybase.org/reports/Svil.html
  source_id: FB:FBgn0266696
