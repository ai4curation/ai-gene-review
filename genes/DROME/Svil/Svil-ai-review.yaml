  qualifier: is_active_in
  review:
    summary: FlyBase root-term ND placeholder (2006) for cellular component. No experimental
      localization of any Svil product has been published, and M9MRN1 itself has never been
      studied as a protein.
    action: ACCEPT
    reason: A manual PubMed search found no Drosophila study that localizes Svil protein. The
      only localization-relevant information for M9MRN1 is a single Phobius-predicted C-terminal
      transmembrane helix in the isoform-specific tail. One sequence prediction is not enough to
      replace the ND row with a membrane term. Vertebrate supervillin is membrane-associated
      through its N-terminal region and gelsolin-like/headpiece regions, not through a
      transmembrane helix, so the ortholog cannot be used to corroborate it. The ND row remains
      an accurate statement of current knowledge.
    supported_by:
    - reference_id: file:DROME/Svil/Svil-deep-research-manual.md
      supporting_text: No Drosophila paper was found that studies the Svil protein biochemically,
        localizes it, or characterizes a specific Svil mutant allele.
