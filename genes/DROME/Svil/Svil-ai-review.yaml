- id: PMID:22530061
  title: A screen for genes expressed in the olfactory organs of Drosophila melanogaster identifies
    genes involved in olfactory behaviour.
  findings:
  - statement: Gene-trap line BG02427, mapped by BDGP to CG42669 (now Svil), shows reduced olfactory
      trap responses in females and males. 3' RACE instead placed the vector in CG42699, and both
      genes remain candidates.
    supporting_text: For BG02427, the RACE results showed the vector was spliced to the CG42699 gene
      at cytological region 5C2, contradicting the BDGP prediction at 62E1 in the CG42669 gene.
  - statement: No peripheral olfactory defect was detected by electroantennogram in any of the lines
      tested.
    supporting_text: No mutant EAG phenotypes were observed for any of the pGT lines with these odours
  reference_review:
    relevance: LOW
