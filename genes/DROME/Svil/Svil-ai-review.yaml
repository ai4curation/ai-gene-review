core_functions:
- description: No molecular activity has been established for this Svil product. M9MRN1 contains
    the N-terminal region shared with the long Svil isoforms, followed by an isoform-specific
    coiled-coil and low-complexity tail ending in a predicted C-terminal transmembrane helix. It
    lacks the gelsolin-like repeats and villin headpiece through which supervillins bind F-actin,
    so actin-binding activity cannot be inferred for it.
  supported_by:
  - reference_id: file:DROME/Svil/Svil-bioinformatics/RESULTS.md
    supporting_text: The gelsolin-repeat and headpiece regions that confer F-actin binding on
      vertebrate supervillin are absent from this product
  - reference_id: PMID:36067835
    supporting_text: We also found that three Mib2 interacting proteins, RhoGAP19D, Supervillin, and
      Myosin heavy chain-like, affect border cell migration.
  knowledge_gaps:
  - gap_statement: The molecular activity, subcellular location and partners of the domain-less
      Svil isoforms AG/AH are unknown. It is not known whether the C-terminal hydrophobic segment
      anchors them in a membrane, or whether the shared N-terminal region binds actin or myosin
      as the vertebrate supervillin N terminus does.
    boundary: Vertebrate supervillin and the domain-bearing fly Svil isoforms carry gelsolin-like
      and headpiece actin-binding regions that M9MRN1 lacks.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Which Svil isoforms were detected in Mib2 complexes and depleted in the border cell
    migration experiments of PMID:36067835? Do the domain-less isoforms such as AG/AH contribute,
    or only the gelsolin/headpiece-bearing ones?
- question: Is the predicted C-terminal transmembrane helix of isoforms AG/AH used as a tail anchor,
    and if so in which membrane?
- question: Did the BG02427 gene-trap insertion (PMID:22530061) disrupt Svil (formerly CG42669) or
    CG42699? This decides whether Svil has any link to olfactory behaviour.
suggested_experiments:
- description: Express tagged isoform AG/AH in S2 cells or fly tissues and test membrane association
    (carbonate extraction, protease protection) and organelle co-localization, with and without the
    C-terminal hydrophobic segment.
  experiment_type: cell biology / localization
- description: Use isoform-specific RNAi or CRISPR deletion of the AG/AH-specific 3' exons to test
    whether the domain-less isoforms are needed for border cell migration, and compare with
    removal of the gelsolin/headpiece-encoding exons.
  experiment_type: genetic perturbation
- description: Test the shared Svil N-terminal region for F-actin and myosin II binding in
    co-sedimentation assays, by analogy with the N-terminal binding sites of vertebrate supervillin.
  experiment_type: biochemistry
