  title: The flightless I protein and the gelsolin family in nuclear hormone receptor-mediated signalling.
  findings:
  - statement: Gelsolin-family proteins, including supervillin, contain gelsolin-like repeats and may
      carry a C-terminal villin headpiece.
    supporting_text: Members of the gelsolin family generally contain three or six copies of a 125-amino-acid
      residue gelsolin-related repeating unit, and may contain additional domains including the C-terminal
      villin-related 'headpiece'
  reference_review:
    relevance: LOW
