- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: FlyBase root-term ND placeholder (2006) for biological process. Since then, two
      papers have reported phenotype-level data that may involve Svil. Neither establishes how
      Svil takes part in a process.
    action: ACCEPT
    reason: PMID:22530061 reports reduced olfactory trap responses in gene-trap line BG02427.
      BDGP mapped that line to CG42669, which is now part of Svil, but 3' RACE showed the vector
      spliced to CG42699, and the authors leave both genes as candidates. Excision reversion was
      not done for this line, and electroantennograms were normal, so the behaviour defect cannot
      be assigned to Svil. PMID:36067835 (abstract only) reports that Supervillin co-purifies with
      Mib2 and that its depletion affects border cell migration. This is a perturbation
      phenotype, and the isoforms involved cannot be checked. Under the participation bar
      neither finding supports a specific process term, so the ND row is kept. The border cell
      migration lead is recorded as a suggested question.
    supported_by:
    - reference_id: PMID:22530061
      supporting_text: For both these lines we were unable to obtain polytene chromosome in situ
        results and thus for each line both genes remain candidates
    - reference_id: PMID:36067835
      supporting_text: We also found that three Mib2 interacting proteins, RhoGAP19D, Supervillin,
        and Myosin heavy chain-like, affect border cell migration.
    - reference_id: file:DROME/Svil/Svil-deep-research-manual.md
      supporting_text: Drosophila Svil is a gelsolin-family (supervillin) gene with no direct functional
        characterization.
