id: M9MRN1
gene_symbol: Svil
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Svil (Supervillin) is the Drosophila member of the supervillin branch of the
  gelsolin superfamily. It is a large, extensively spliced locus on chromosome arm 3L that
  encodes more than 25 protein products. In vertebrates, supervillin binds F-actin and myosin
  II through its N-terminal region, gelsolin-like repeats and C-terminal villin headpiece,
  links the actin cytoskeleton to the plasma membrane and has been linked to nuclear-receptor
  signalling. Only some fly Svil products carry the gelsolin-like and headpiece signatures.
  M9MRN1 (isoforms AG and AH, 1872 aa) is not one of them. Its first 1292 residues are
  identical to the N-terminal region of the longest isoform. The rest is an isoform-specific
  tail with two predicted coiled coils, extensive disordered low-complexity regions and a
  single predicted transmembrane helix at the extreme C terminus, which suggests a possible
  tail-anchored membrane protein. No Svil protein has been studied directly in Drosophila.
  Supervillin has been reported in Mind bomb 2 (Mib2) protein complexes, and its depletion
  affects border cell migration in the ovary. A gene-trap line that may disrupt Svil reduces
  olfactory trap responses, but the gene assignment of that line is ambiguous.
