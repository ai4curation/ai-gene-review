id: O02194
gene_symbol: Psn
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Psn (Presenilin, peptidase family A22A) is the sole Drosophila presenilin and the catalytic
  subunit of gamma-secretase, a multi-pass membrane aspartyl protease complex with Nicastrin (Nct), Aph-1
  and Pen-2. After assembly, Psn undergoes Pen-2-dependent endoproteolysis into N- and C-terminal fragments
  that together form the active site. Psn cleaves type I transmembrane proteins within their transmembrane
  domain after prior ectodomain shedding, with substrate selection governed largely by the size of the
  remaining extracellular stub. Its best established physiological substrate is Notch: following ligand-induced
  S2 cleavage by the ADAM protease Kuzbanian, Psn-dependent S3 cleavage releases the Notch intracellular
  domain, which enters the nucleus to activate Su(H)-dependent transcription. Psn null mutants abolish
  Notch signalling and show neurogenic phenotypes. Psn also cleaves APP-family proteins (Appl and transgenic
  human APP), is required for neuronal survival in the aging fly brain, and interacts with Sanpodo, which
  promotes Notch activation in the pIIa cell of the sensory organ lineage.'
