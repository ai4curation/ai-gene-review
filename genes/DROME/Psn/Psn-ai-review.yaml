  supported_by:
  - reference_id: PMID:10206646
    supporting_text: Here we show that null mutations in the Drosophila Presenilin gene abolish Notch
      signal transduction and prevent its intracellular domain from entering the nucleus. Furthermore,
      we provide evidence that presenilin is required for the proteolytic release of the intracellular
      domain from the membrane following activation of Notch by ligand.
  - reference_id: PMID:11134525
    supporting_text: Our results indicate that transmembrane cleavage and signal transduction are strictly
      correlated, supporting the cleavage model for signal transduction by LIN-12/Notch and a role for
      Presenilin in mediating the ligand-induced transmembrane cleavage.
  - reference_id: PMID:20421416
    supporting_text: In agreement with previous cell culture and yeast studies, coexpression of these
      four components promotes the efficient assembly of mature, proteolytically active gamma-secretase.
  - reference_id: PMID:12660785
    supporting_text: Thus, APH-1 stabilizes the presenilin holoprotein in the complex, whereas PEN-2 is
      required for endoproteolytic processing of presenilin and conferring gamma-secretase activity to
      the complex.
  - reference_id: file:DROME/Psn/Psn-deep-research-falcon.md
    supporting_text: Psn is absolutely required for Notch receptor cleavage and signal transmission, making
      it essential for developmental cell-fate decisions and tissue patterning
suggested_questions:
- question: Should the Psn-Sanpodo interaction, which is required for Notch activation in pIIa cells,
    be captured by a more specific molecular function or by a GO-CAM causal relation rather than protein
    binding?
- question: Is the reported presenilin ER calcium-leak function conserved in Drosophila Psn, independently
    of gamma-secretase activity?
suggested_experiments:
- description: Compare catalytically dead (active-site aspartate) Psn knock-in with Psn null in the aging
    brain and in Notch-dependent tissues to separate protease-dependent from protease-independent (e.g.
    calcium) functions.
  experiment_type: knock-in genetics
