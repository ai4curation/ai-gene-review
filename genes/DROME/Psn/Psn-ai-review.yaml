    label: apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:10491396
  qualifier: involved_in
  review:
    summary: Psn loss or overexpression increases apoptosis in developing tissues, blocked by activated
      Notch.
    action: KEEP_AS_NON_CORE
    reason: Psn does not execute apoptosis. In this paper the increased cell death is suppressed by constitutive
      Notch activation and interpreted as elimination of improperly specified cells, i.e. largely a consequence
      of impaired Notch signalling. Later work summarized in deep research suggests a gamma-secretase-independent
      requirement of Psn for Debcl-mediated cell death, so a more direct role cannot be excluded. Retained
      as non-core.
    supported_by:
    - reference_id: PMID:10491396
      supporting_text: Presenilin-induced apoptosis is cell autonomous and can be blocked by constitutive
        Notch activation, suggesting that the increased cell death is due to a developmental mechanism
        that eliminates improperly specified cell types.
    - reference_id: file:DROME/Psn/Psn-deep-research-falcon.md
      supporting_text: Genetic experiments indicate that Debcl-mediated cell death requires Psn, and this
        function appears independent of γ-secretase activity since reducing Nicastrin does not prevent
        the death phenotype
