descriptions:
- source: UniProt
  text: Probable catalytic subunit of the gamma-secretase complex, an endoprotease
    complex that catalyzes the intramembrane cleavage of integral membrane proteins
    such as Notch receptor. Required for S3 cleavage of Notch, which releases activated
    Notch protein from the cell membrane. Involved in the patterning of the optic
    lobes.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O02194
  source_id: O02194
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: catalytic subunit of gamma-secretase, required for S3
      cleavage of Notch. Calls it ''probable'' and adds optic lobe patterning; no
      APP cleavage or neuronal survival.'
- source: Alliance_Automated
  text: Enables aspartic endopeptidase activity, intramembrane cleaving and protein
    homodimerization activity. Involved in several processes, including amyloid-beta
    formation; learning or memory; and membrane protein proteolysis. Located in apical
    plasma membrane; late endosome; and recycling endosome. Part of gamma-secretase
    complex. Is expressed in several structures, including anterior-posterior subdivision
    of organism; female germline cell; imaginal disc; pigment cell; and wing vein.
    Used to study Alzheimer's disease; Alzheimer's disease 3; dilated cardiomyopathy;
    early-onset Parkinson's disease; and neurodegenerative disease. Human ortholog(s)
    of this gene implicated in Alzheimer's disease (multiple); breast cancer; dilated
    cardiomyopathy (multiple); frontotemporal dementia (multiple); and hidradenitis
    suppurativa. Orthologous to several human genes including PSEN2 (presenilin 2).
  source_type: automated
  url: https://flybase.org/reports/Psn.html
  source_id: FB:FBgn0284421
