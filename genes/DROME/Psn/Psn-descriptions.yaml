    anterior-posterior subdivision of organism; female germline cell; imaginal disc;
    pigment cell; and wing vein. Used to study Alzheimer's disease; Alzheimer's disease
    3; dilated cardiomyopathy; early-onset Parkinson's disease; and neurodegenerative
    disease. Human ortholog(s) of this gene implicated in Alzheimer's disease (multiple);
    breast cancer; dilated cardiomyopathy (multiple); frontotemporal dementia (multiple);
