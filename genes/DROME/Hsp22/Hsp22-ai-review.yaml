taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Drosophila melanogaster Hsp22 is an alpha-crystallin-domain small heat shock protein that forms oligomers and acts primarily in the mitochondrial matrix. Its N-terminal targeting sequence directs mitochondrial import. Hsp22 binds damaged or unfolded proteins and prevents their aggregation, preserving clients for later refolding by other chaperones. Purified Hsp22 protects citrate synthase and luciferase during heat treatment and enhances subsequent luciferase recovery. It is strongly induced by heat and increases with age. Altering its expression changes heat and oxidative-stress resistance, locomotor maintenance and adult lifespan; the direction and magnitude of these effects depend on expression and experimental context.
