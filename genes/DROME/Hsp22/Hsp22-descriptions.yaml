- source: Alliance_Automated
  text: Enables unfolded protein holdase activity. Involved in several processes,
    including determination of adult lifespan; protein refolding; and response to
    heat. Located in mitochondrial matrix. Is expressed in ectoderm. Human ortholog(s)
    of this gene implicated in adult-onset myofibrillar myopathy 2A; cataract 16 multiple
    types; cataract 9 multiple types; dilated cardiomyopathy 1II; and infantile-onset
    myofibrillar myopathy-2B. Orthologous to human CRYAA (crystallin alpha A); CRYAB
    (crystallin alpha B); and HSPB2 (heat shock protein family B (small) member 2).
  source_type: automated
