descriptions:
- source: Alliance_Imported
  text: Heat shock protein 22 (Hsp22) encodes a molecular chaperone that is encoded
    in the nucleus and targeted to the mitochondrial matrix. Hsp22 expression is dramatically
    increased during aging, and both Hsp22 mutation and over-expression are reported
    to modulate adult life span and stress resistance.
  source_type: curated
  url: https://flybase.org/reports/Hsp22.html
