core_functions:
- description: As a core subunit shared by GARP and EARP, Vps52 contributes to the tethering of endosome-derived
    carriers at the trans-Golgi network (GARP) and at recycling endosomes (EARP), acting as an effector
    of GTP-bound Arl5 and Rab4 that brings vesicle and target membranes together before SNARE-mediated
    fusion.
