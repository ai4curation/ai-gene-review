gene_symbol: Vps52
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps52 (CG7371) is the Drosophila ortholog of VPS52, a CATCHR-family subunit shared by two
  related multisubunit tethering complexes. Together with Vps51 and Vps53 it forms the core of the Golgi-associated
  retrograde protein (GARP) complex, which additionally contains Vps54 (scattered) and tethers endosome-derived
  carriers at the trans-Golgi network, and of the endosome-associated recycling protein (EARP) complex,
  which contains Vps50 (syndetin) in place of Vps54 and supports recycling of endocytosed cargo to the
  plasma membrane. In fly tissues a GFP-tagged Vps52 is a peripheral protein of the trans-Golgi network
  whose Golgi recruitment is aided by the Arf-like GTPase Arl5, and in S2 cell lysates the Vps51-Vps52-Vps53
  core binds the GTP-bound forms of Rab4 and Arl5. Like other GARP/EARP subunits it engages SNAREs to
  promote vesicle tethering and fusion.
