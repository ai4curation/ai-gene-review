suggested_questions:
- question: Do fly Vps52 loss-of-function mutants disrupt recycling of endocytosed cargo to the plasma
    membrane as well as retrieval of the M6PR homolog Lerp to the TGN, i.e. are both the GARP and EARP
    roles conserved in Drosophila tissues?
suggested_experiments:
- description: Compare Lerp (M6PR) localization and transferrin-receptor-like cargo recycling in Vps52,
    scat (Vps54) and Vps50 mutant or RNAi tissues to separate GARP- and EARP-dependent functions of the
    shared Vps52 subunit.
