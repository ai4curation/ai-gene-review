knowledge_gaps:
- gap_statement: The molecular activity, ligands or binding partners, membrane topology and
    physiological role of CG14662 are all unknown.
  boundary: Sequence analysis predicts a membrane protein with a glycosylated extracellular LRR region,
    a Ser/Thr-rich stalk, a cysteine-rich juxtamembrane segment and a cytoplasmic tail without a known
    signalling domain. Orthologs exist only in Brachycera, and none is characterized.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Endogenous tagging to determine localization and topology, extracellular-domain
    interaction screens and a null-allele phenotype screen.
  provenance:
  - reference_id: file:DROME/CG14662/CG14662-bioinformatics/RESULTS-rereview.md
    supporting_text: No member of the group is experimentally characterized.
suggested_questions:
- question: Is the first hydrophobic segment (29-50) a cleaved signal peptide or an uncleaved signal
    anchor? The answer decides whether CG14662 is a single-pass or a two-pass (N-in, C-in) membrane
    protein.
- question: Does the extracellular LRR/Ser-Thr/Cys-rich region bind a partner on neighbouring cells,
    as in other single-pass LRR adhesion or guidance proteins? Or does it bind a soluble ligand?
- question: Is the PANTHER PTHR24365:SF541 (Toll-related) HMM match reported by InterPro meaningful for
    a protein without a TIR domain, or is it a spurious match driven by the LRR region?
suggested_experiments:
- description: Tag the endogenous protein at its C terminus by CRISPR knock-in. Determine its tissue
    and subcellular distribution, and use antibody access to an extracellular epitope tag together with
    PNGase F sensitivity to test topology and N-glycosylation.
- description: Generate a CRISPR null allele and screen viability, fertility, nervous-system and
    immune phenotypes. Perform affinity purification or a cell-surface interaction screen with the
    purified extracellular region to identify binding partners.
