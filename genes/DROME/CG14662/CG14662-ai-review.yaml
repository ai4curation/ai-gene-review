    action: ACCEPT
    summary: No molecular activity has been demonstrated, so the ND placeholder is correct.
    reason: Dedicated literature searches found only an architectural catalogue entry (Dolan et al.
      2007) and a passing mention near a GWAS locus. The LRR-superfamily region suggests some protein or
      ligand interaction, but it does not identify a specific activity. The lineage-restricted orthogroup
      contains no characterized member from which an activity could be inherited. The weak InterPro match
      to PANTHER PTHR24365:SF541 (Toll-related) is not part of PANTHER's own classification of this
      protein. It also covers no TIR domain, so it gives no basis for transferring signaling receptor
      activity. The ND statement therefore holds.
