    reason: >-
      No literature on this gene product, in this species, identifies a function in this
      aspect, so the ND follows the evidence-code guideline and is accepted
      (projects/NO_DATA.md). Inferred rows in the same aspect do not make it stale.
      Earlier action MODIFY, because: Phobius places helical transmembrane segments at
      29-50 and 421-447, and an independent Kyte-Doolittle scan recovers both. The
      intervening region carries all seven N-glycosylation sequons, which fits a type-I
      or N-in two-pass integral membrane protein. GO:0016020 membrane is therefore the
      most specific location the evidence supports. The protein most likely ends up in
      the plasma membrane, but no localization experiment exists, and a membrane protein
      with YxxΦ motifs in its tail could equally reside in endosomes. Plasma membrane is
      therefore not asserted. Earlier this row was left UNDECIDED. It is revised here
      because the ND placeholder is less informative than a well-supported prediction of
      membrane residence. The proposed term now sits on its own NEW row.
