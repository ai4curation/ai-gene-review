  label: Drosophila melanogaster
description: CG14662 encodes an uncharacterized 550-residue membrane protein with an extracellular
  (or luminal) leucine-rich-repeat region. Two hydrophobic segments are predicted (residues 29-50 and
  421-447). The first lies after a positively charged 28-residue N-terminus, so it may act as an
  uncleaved signal anchor, although a comparative survey of extracellular LRR proteins called it a signal
  sequence. Either way, the region between the two segments faces the outside of the cell or the lumen.
  It carries all seven N-glycosylation sequons, an LRR-superfamily domain of about six degenerate
  repeats, a Ser/Thr-rich disordered stretch that could form a mucin-like stalk, and a cysteine-rich
  segment next to the membrane. The roughly 100-residue cytoplasmic tail has no recognisable signalling
  domain. The protein has no TIR domain and is not a Toll-family receptor. Its orthologs occur only in
  higher flies (Brachycera), and none has been characterized. No ligand, binding partner, expression-based
  role or loss-of-function phenotype has been reported. The protein most likely mediates
  extracellular recognition or adhesion, as many single-pass LRR proteins do, but this remains a
  hypothesis based on its domains.
