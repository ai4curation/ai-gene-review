- source: Alliance_Automated
  text: Involved in several processes, including negative regulation of neuromuscular
    synaptic transmission; positive regulation of synaptic assembly at neuromuscular
    junction; and short-term memory. Located in neuromuscular junction; presynaptic
    periactive zone; and terminal bouton. Is expressed in several structures, including
    ganglia; nerve; neuromuscular junction; presumptive embryonic/larval system; and
    sensory neurons. Used to study Alzheimer's disease; epilepsy; and intellectual
    disability. Human ortholog(s) of this gene implicated in heart disease (multiple).
    Orthologous to human ANK2 (ankyrin 2).
