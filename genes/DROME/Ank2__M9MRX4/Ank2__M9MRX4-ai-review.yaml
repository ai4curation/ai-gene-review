      supporting_text: In wild type animals Ank2-L is highly abundant in motoneuron axons and enriched
        within the presynaptic nerve terminal at the NMJ
    - reference_id: PMID:12056839
      supporting_text: whereas the long Dank2 isoforms are localized specifically to axons
- term:
    id: GO:0099558
    label: maintenance of synapse structure
  evidence_type: IMP
  original_reference_id: PMID:18439406
  review:
    summary: The giant Ank2 isoforms are needed to keep established NMJs intact. Without them
      presynaptic boutons retract, active zones disassemble, and the synaptic microtubule cytoskeleton
      disintegrates. Ank2 itself is part of the presynaptic scaffold that is maintained.
    action: NEW
    reason: The NMJ development rows are accurate but do not single out the maintenance role. Two
      independent screens identified Ank2 as a synapse-stability gene. Ank2 performs part of this
      process. It is a structural component of the presynaptic membrane cytoskeleton that anchors
      synaptic microtubules and organizes adhesion molecules, so this is participation and not
      only necessity. The term is GO's own definition of preserving the synaptic cytoskeleton
      and scaffolds.
    supported_by:
    - reference_id: PMID:18439406
      supporting_text: Ank2 functions downstream of spectrin in the anchorage of synaptic microtubules,
        providing the cytoskeletal scaffold that is essential for synaptic stability.
    - reference_id: PMID:18439405
      supporting_text: We demonstrate that loss of presynaptic Ank2-L results in the inappropriate
        destabilization and retraction of the presynaptic nerve terminal at the NMJ.
