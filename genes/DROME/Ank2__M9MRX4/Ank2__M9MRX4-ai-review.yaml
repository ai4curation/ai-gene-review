  review:
    summary: Pielage et al. 2008 identified ank2-L mutations in a screen for NMJ destabilization.
      Loss of presynaptic Ank2-L disorganizes and eventually eliminates the synaptic microtubule
      cytoskeleton. The isoform-specific C-terminal tail binds microtubules directly in vitro and
      reorganizes them in S2 cells. This segment (Ank2-L 1682-2089) is present at the same
      position in M9MRX4.
    action: ACCEPT
    reason: Ank2 does part of this work itself. It binds microtubules directly and is required
      for the organization of presynaptic microtubules, so this is participation and not only
      necessity. This is core to the giant isoforms. The full text is available, and the
      bioinformatics analysis shows that the assayed segment is part of M9MRX4.
    supported_by:
