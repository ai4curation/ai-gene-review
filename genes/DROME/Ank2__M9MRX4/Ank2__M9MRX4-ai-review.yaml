id: M9MRX4
gene_symbol: Ank2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Ank2 (Ankyrin 2) is one of the two ankyrin genes of Drosophila. Unlike
  the ubiquitous Ank, it is expressed only in neurons. M9MRX4 (isoform U, 13,559 aa)
  is the longest product of the locus. It contains the complete giant Ank2-XL sequence
  followed by the C-terminal tail of the giant Ank2-L isoform. Like other ankyrins it
  has an N-terminal domain of 24 ankyrin repeats that binds membrane proteins, a
  ZU5-ZU5-UPA spectrin-binding cassette and a death domain. These are followed by
  very long isoform-specific C-terminal regions. The giant Ank2 isoforms are
  membrane-associated cytoskeletal adaptors in axons and presynaptic terminals. The
  ankyrin-repeat domain binds the L1-type cell adhesion molecule Neuroglian, and
  C-terminal segments of both Ank2-L and Ank2-XL bind microtubules directly. Ank2-L
  and Ank2-XL form a membrane-associated microtubule-organizing complex with the MAP1B
  homolog Futsch that sets microtubule spacing and axon caliber. In motoneurons they
  organize the presynaptic microtubule cytoskeleton and synaptic adhesion molecules
  and so maintain the stability of the larval neuromuscular junction. Loss of the
  giant isoforms causes synapse retraction and disassembly. In sensory neurons a giant
  Ank2 isoform is needed for a diffusion barrier in the proximal axon.'
