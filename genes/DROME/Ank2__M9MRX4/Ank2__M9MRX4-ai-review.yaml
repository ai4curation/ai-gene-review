- id: file:DROME/Ank2__M9MRX4/Ank2__M9MRX4-bioinformatics/analysis-output.txt
  title: PANTHER 19 placement and isoform coverage of Ank2 M9MRX4
  findings:
  - statement: In PANTHER 19, Ank2 is in PTHR24123:SF141, outside the bilaterian ankyrin PAINT
      node PTN002380879 (PTHR24133), which holds fly Ank and human ANK1/2/3.
    supporting_text: "FBgn0261788\tPTHR24123\tPTHR24123:SF141"
  - statement: M9MRX4 contains the full Ank2-XL sequence and the Ank2-L microtubule-binding segment.
    supporting_text: 'identical N-terminal prefix shared by M9MRX4 and X2JCM1: 11629 aa'
suggested_questions:
- question: Is the PANTHER 19 placement of fly Ank2 and worm unc-44 (PTHR24123:SF141, sister to
    ASB4/ASB10/ANKRD55) a tree-building artefact of the giant isoforms? Should Ank2 instead join
    fly Ank and ANK1/2/3 under PTN002380879 (PTHR24133), as the Jegla et al. 2016 ankyrin phylogeny
    and the ZU5-ZU5-UPA architecture suggest? If it were moved, PAINT propagation of spectrin binding,
    cytoskeletal adaptor activity and protein localization to plasma membrane would reach Ank2.
- question: Is the 13,559-aa isoform U (Ank2-XL exon plus Ank2-L tail) made in vivo? Or are Ank2-L
    and Ank2-XL the only giant products? Which isoform should carry the experimental annotations?
- question: Does fly Ank2 bind beta-spectrin directly through its ZU5-ZU5-UPA cassette? So far the
    fly data show only genetic epistasis ("downstream of spectrin").
- question: Did Yamamoto et al. 2006 (PMID:16920632) assay ank2 or ank alleles for the da-neuron
    axonal sprouting phenotype, and is axon extension the right term for it?
suggested_experiments:
- description: Microtubule co-sedimentation and spectrin pull-down assays with recombinant Ank2 ZU5-ZU5-UPA
    and the isoform-U-specific junction region, to test direct spectrin binding and any extra microtubule
    binding.
  experiment_type: biochemical
- description: Long-read RNA sequencing or isoform-specific antibodies on larval CNS, to find out whether
    the isoform U transcript (XL exon spliced to the L tail) is expressed.
  experiment_type: expression
