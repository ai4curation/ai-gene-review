    reason: Axonal localization of the giant isoforms is a defining, repeatedly shown property
      (Hortsch et al. 2002; Pielage et al. 2008; Schwartz et al. 2023), and M9MRX4 has no axon
      annotation in GOA. Presynaptic locations alone leave out where most of the protein is.
    supported_by:
