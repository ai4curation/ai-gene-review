    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000488
  review:
    summary: This InterPro2GO mapping comes from the death domain (IPR000488). In ankyrins the death
      domain is a conserved structural module downstream of the ZU5-ZU5-UPA cassette. Ank2 does
      not act as a signal transducer.
    action: REMOVE
    reason: The death-domain-to-signal-transduction mapping fits apoptotic and immune adaptors.
      Ankyrins are not such adaptors. No experiment places Ank2 in a signalling pathway as a
      transducer. Where Ank2 has been placed in signalling, it is the downstream target, as with
      CK2 phosphorylation and Go signalling, not the transducer. Its experimentally supported
      roles are structural, as a membrane-cytoskeleton adaptor and in microtubule binding and
      organization. This is an over-propagated electronic inference.
    supported_by:
