id: Q9VHA8
gene_symbol: P58IPK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: P58IPK (CG8286, dIPK) is the single Drosophila member of the DNAJC3/P58IPK family of J-domain
  cochaperones and is the ortholog of vertebrate DNAJC3. The 498-residue protein has an N-terminal signal
  peptide, an array of tetratricopeptide (TPR) repeats, and a C-terminal J domain with a conserved HPD
  motif (H424). By descent from the ancestral family function, it is expected to enter the endoplasmic
  reticulum, bind misfolded client proteins through its TPR region, and use its J domain to engage the
  ER Hsp70 chaperone BiP (Hsc70-3) and hand clients over for folding. Direct experiments on the fly protein
  are limited to overexpression studies, in which it co-immunoprecipitated with polyglutamine-expanded
  huntingtin (HTT103Q) and reduced its aggregation in yeast, S2 cells and larval hemocytes. Its endogenous
  localization, clients and Hsp70 partner have not been determined, and the eIF2-alpha kinase inhibitory
  activity described for mammalian DNAJC3 has not been shown for the fly protein.
