  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001941043
  - SGD:S000003609
  review:
    action: ACCEPT
    summary: ER protein folding is the ancestral family role, inherited from the Eukaryota node.
    reason: The cochaperone itself does part of the work of the process, capturing misfolded clients
      through its TPR region and coupling their release to BiP via its J domain. The mouse ortholog shows
      this directly, and the fly protein retains the HPD histidine (H424) corresponding to the P58 H422
      required for the BiP interaction. The node is placed at Eukaryota by PAINT and the fly gene shows
      no sign of loss of the J domain or TPR array.
    supported_by:
    - reference_id: PMID:18923430
      supporting_text: These findings are consistent with a model whereby localized activation of the
        Hsp70-type partner is sufficient to promote substrate handover from the J-domain co-chaperone.
    - reference_id: file:DROME/P58IPK/P58IPK-bioinformatics/RESULTS-rereview.md
      supporting_text: The J-domain HPD tripeptide of Q9VHA8 is at residues 424-426
    - reference_id: file:DROME/P58IPK/P58IPK-bioinformatics/RESULTS-rereview.md
      supporting_text: The PAINT IBD assertions are all placed at the Eukaryota root node PTN001941043
