  review:
    action: ACCEPT
    summary: J-domain-mediated binding to the ER Hsp70 BiP is the core cochaperone activity.
    reason: In mouse P58/DNAJC3, the J domain interacts with BiP through the invariant HPD histidine H422,
      and BiP plus ATP drives client release. Q9VHA8 conserves the HPD motif (H424) within its J domain,
      and the activity is inherited from the eukaryote root PAINT node. The fly Hsp70 partner (presumably
      Hsc70-3/BiP) is not experimentally identified.
    supported_by:
    - reference_id: PMID:18923430
      supporting_text: BiP-induced dissociation of P58 from its substrate depends on the presence of ATP
        and on interactions with P58's J-domain, which are mediated by invariant residues BiP R197 and
        P58 H422
    - reference_id: file:DROME/P58IPK/P58IPK-bioinformatics/RESULTS-rereview.md
      supporting_text: The J-domain HPD tripeptide of Q9VHA8 is at residues 424-426
