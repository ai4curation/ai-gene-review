  label: Drosophila melanogaster
description: P58IPK is a DNAJC3-family cochaperone with tetratricopeptide repeats, an N-terminal signal
  peptide, and a C-terminal J domain. It assists protein folding in the endoplasmic reticulum through
  chaperone and unfolded-client interactions. Its secretory targeting is compatible with an ER-lumen cochaperone,
  while stable ER-membrane attachment is not established.
