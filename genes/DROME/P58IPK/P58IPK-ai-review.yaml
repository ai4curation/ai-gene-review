suggested_questions:
- question: Is endogenous fly P58IPK ER-luminal, as its signal peptide and the mammalian ortholog suggest,
    and how does an overexpressed signal-peptide protein colocalize with cytoplasmic HTT103Q aggregates?
- question: Does fly P58IPK inhibit PEK (fly PERK) or GCN2 as mammalian DNAJC3 inhibits eIF2-alpha kinases,
    or is the kinase-inhibitory role a vertebrate-lineage addition? PAINT did not propagate it to any ancestral
    node.
- question: Is fly P58IPK induced by ER stress (Ire1/Xbp1 or Atf6 dependent) as DNAJC3 is in mammals?
suggested_experiments:
- description: Endogenous tagging (CRISPR knock-in) of P58IPK with ER-lumen and cytosol markers and protease-protection
    assays to establish its topology and compartment.
- description: Purified P58IPK with Hsc70-3 (BiP) in ATPase stimulation and client-release assays, comparing
    wild type with an H424Q J-domain mutant.
- description: P58IPK null alleles assayed for ER stress sensitivity, eIF2-alpha phosphorylation and PEK
    epistasis.
