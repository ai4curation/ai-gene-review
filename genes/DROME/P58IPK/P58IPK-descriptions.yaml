- source: Alliance_Automated
  text: Predicted to enable misfolded protein binding activity and protein-folding
    chaperone binding activity. Predicted to be involved in protein folding in endoplasmic
    reticulum. Located in endomembrane system. Is expressed in several structures,
    including adult head; embryonic/larval garland cell; embryonic/larval midgut primordium;
    gut section; and somatic trunk mesoderm derivative. Human ortholog(s) of this
    gene implicated in diabetes mellitus. Orthologous to human DNAJC3 (DnaJ heat shock
    protein family (Hsp40) member C3).
