descriptions:
- source: UniProt
  text: Component of the extracellular signaling pathway that establishes the dorsal-ventral
    pathway of the embryo (PubMed:11486795). A protease cascade involving ndl, gd,
    snk and ea results in activation of the spz Toll receptor ligand; acts downstream
    of ndl and gd (PubMed:20605458). Activation of ea requires both activation of
    the ndl-gd-snk protease cascade and sulfation of a vitelline membrane component
    by pip (PubMed:20605458). Localized activation of the Toll receptor in the ventral
    region of the embryo defines cell identities along the dorsal-ventral continuum
    (Probable).
