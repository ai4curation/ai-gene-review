id: P05049
gene_symbol: snk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: snake (snk) encodes a secreted clip-domain serine protease of the trypsin (S1A) family that is supplied maternally
  to the egg and acts in the perivitelline space surrounding the early embryo. It is the third protease of the extracellular
  Nudel-Gastrulation Defective-Snake-Easter cascade that generates the ventral ligand for the Toll receptor and so specifies
  embryonic dorsal-ventral polarity. The Snake zymogen is cleaved and activated by Gastrulation Defective at the Leu185-Ile186
  bond, independently of the ventral Pipe cue; active Snake then binds the Easter zymogen through its N-terminal prodomain
  and cleaves it at Arg127-Ile128, a step that depends on the Pipe-sulfated ventral eggshell cue and is the first spatially
  restricted reaction of the cascade. Active Easter cleaves Spatzle to the Toll ligand. Snake has an intact His-Asp-Ser catalytic
  triad and its processed form reacts with an active-site serine protease probe. No immune role has been demonstrated.
