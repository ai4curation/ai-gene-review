- term:
    id: GO:0009950
    label: dorsal/ventral axis specification
  evidence_type: IGI
  original_reference_id: PMID:1425342
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0000533
  review:
    summary: Chasan et al. showed that a constitutively active Easter (ea deltaN) bypasses the requirement for snake and four
      other maternal dorsal-group genes.
    action: ACCEPT
    reason: snake is a maternal-effect dorsal-group gene; Snake protease performs a catalytic step (Easter zymogen activation)
      in the extracellular cascade that generates the ventral Toll ligand and thereby specifies the embryonic dorsal-ventral
      axis. The epistasis data (activated Easter bypasses snake; loss of the inhibitor Spn27A ventralizes) place Snake upstream
      of Easter in this pathway. This is the organismal process in which Snake's activity is experimentally established, and
      it is the only one.
    supported_by:
    - reference_id: PMID:1425342
      supporting_text: The ea delta N mutant bypasses the requirement for five other maternal effect genes, indicating that
        these five genes exert their effects on dorsal-ventral patterning solely by controlling the activation of the easter
        zymogen.
    - &id012
      reference_id: PMID:11486795
      supporting_text: The maternal effect gene snake is required for the establishment of the dorsal-ventral axis during
        the embryonic development of Drosophila.
    - &id014
      reference_id: PMID:20605458
      supporting_text: Gastrulation Defective cleaves and activates Snake, which processes and activates Easter, which cleaves
        Spätzle to form the activating ligand for the Toll receptor.
