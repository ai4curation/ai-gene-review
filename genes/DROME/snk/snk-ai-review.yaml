  review:
    summary: PAINT propagation of innate immune response from ancestor PTN000667087, seeded by immune clip-domain proteases
      (psh, MP1, spirit, SPE, grass, modSP, sphinx1/2).
    action: MARK_AS_OVER_ANNOTATED
    reason: snk is not one of the donors and, in PANTHER 19.0, sits in subfamily SF147, separate from every donor subfamily.
      All experimental work on Snake places it in the maternal embryonic dorsal-ventral protease cascade; we found no experimental
      report of a Snake role in the immune response. The immune Toll pathway in adults is activated by a different extracellular
      protease set (ModSP-Grass-SPE, which are among the donors), and Lemaitre et al. assigned the immune role of the dorsal-ventral
      gene cassette to spatzle and the intracellular components, not to the upstream embryonic proteases. The immune function
      is plausibly ancestral for the node but is not established for this lineage, and snk shows target-specific evidence
      of a dedicated developmental role; treat as over-annotation rather than remove, because no study has excluded an immune
      contribution.
    additional_reference_ids:
    - PMID:8808632
    supported_by:
    - reference_id: file:DROME/snk/snk-bioinformatics/RESULTS.md
      supporting_text: Every FlyBase donor listed in the WITH/FROM of the two IBA rows (extracellular region; innate immune
        response; PAINT node PTN000667087) falls in a PTHR24260 subfamily other than SF147 (SF134, SF135, SF136, SF140, SF144,
        SF145). snk itself is not among the donors of either IBA row.
    - reference_id: file:DROME/snk/snk-bioinformatics/RESULTS.md
      supporting_text: The PANTHER 19.0 classification assigns snk (FBgn0003450) to PTHR24260:SF147 (EG:BACR7A4.3 PROTEIN-RELATED),
        a Drosophila-only subfamily of 27 fruit-fly proteins in the reference set
    - reference_id: PMID:8808632
