suggested_questions:
- question: What is the molecular mechanism by which the Pipe-sulfated vitelline membrane cue makes Snake cleavage of Easter
    productive only on the ventral side, given that Snake and Easter associate in a complex even in pipe mutant embryos?
- question: Does Snake have any role outside embryonic dorsal-ventral patterning, for example in the adult or larval immune
    Toll pathway, as the PAINT innate immune response propagation would predict?
- question: Which cleavage within the Snake prodomain does Easter make, and does it act as positive or negative feedback?
suggested_experiments:
- description: Test snk null adults and larvae for drosomycin induction and survival after fungal and Gram-positive infection,
    alongside SPE and grass mutants, to test the propagated innate immune response annotation.
- description: Reconstitute Snake-Easter cleavage in vitro with purified proteins in the presence and absence of Pipe-sulfated
    vitelline membrane proteins to identify the cofactor and measure its effect on kcat/Km.
