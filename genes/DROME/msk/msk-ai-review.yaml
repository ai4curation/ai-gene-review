- term:
    id: GO:0030619
    label: U1 snRNA binding
  evidence_type: IDA
  original_reference_id: PMID:23885126
  qualifier: enables
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The assay detected U snRNAs co-precipitating with GFP-Msk from S2 cytoplasmic lysate, i.e. association
      with assembled snRNP/snurportin cargo, not binding of Msk to the RNA.
    reason: In PMID:23885126 (full text) U1, U2 and U4 snRNAs co-immunoprecipitate with GFP-Msk and with GFP-dSNUP,
      and the Msk-dSNUP interaction is Ran- and RNA-dependent. Co-precipitation from lysate cannot distinguish
      direct RNA contact from association via snurportin or Sm proteins, and importin-beta-type receptors recognize
      cargo through protein adaptors (snurportin binds the TMG cap). The data support snRNP cargo association
      by an import receptor; an snRNA-binding molecular function for Msk is an over-interpretation.
    supported_by: &id009
    - *id002
