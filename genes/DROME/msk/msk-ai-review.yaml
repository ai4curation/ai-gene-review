gene_symbol: msk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Moleskin is the Drosophila importin-7 nuclear transport receptor. It mediates nuclear accumulation
  of activated ERK, phosphorylated Mad and Yorkie, and participates in snurportin-associated import of
  spliceosomal snRNPs, including delivery to Cajal bodies. Regulated cortical and nucleocytoplasmic distribution
  links signaling to tissue growth and differentiation, while its snRNP-transport role supports nuclear
  RNA-processing machinery.
