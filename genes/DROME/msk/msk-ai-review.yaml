suggested_questions:
- question: PANTHER places Moleskin in PTHR10997:SF18 with yeast Nmd5, Arabidopsis SAD2 and fission-yeast
    SPCC550.11, while vertebrate importin-7 (SF27) and importin-8 (SF26) form separate subfamilies. Is Msk the
    single pre-duplication ortholog of both vertebrate IPO7 and IPO8, and are any IPO8-specific cargoes (for
    example Argonaute or SRP19) imported by Msk in flies?
- question: FlyBase captured the snRNP import defect of msk mutants as protein import into nucleus. Would
    GO:0061015 snRNA import into nucleus be the more appropriate process term for a receptor that imports
    snurportin-bound TMG-capped snRNPs, or is the RNP cargo better described as protein import?
suggested_experiments:
- description: Test direct binding of recombinant Msk to purified dSNUP, Sm core particles and naked U snRNAs
    in the presence of RanGTP or RanGDP, to determine whether Msk contacts the RNA or only the protein adaptors
    of snRNP cargo.
