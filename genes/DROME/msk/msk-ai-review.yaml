id: Q9VSD6
gene_symbol: msk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Moleskin (DIM-7) is the Drosophila importin-7 nuclear transport receptor, a soluble importin-beta-family
  karyopherin with an N-terminal Ran-binding importin-beta domain. It mediates nuclear accumulation
  of activated ERK, phosphorylated Mad and Yorkie, and participates in snurportin-associated import of
  spliceosomal snRNPs, including delivery to Cajal bodies. Regulated cortical and nucleocytoplasmic distribution
  links signaling to tissue growth and differentiation, while its snRNP-transport role supports nuclear
  RNA-processing machinery. Moleskin also has a cytoplasmic role in the embryonic musculature. It becomes
  enriched at muscle attachment sites in an integrin-dependent manner, acts in the muscle upstream of the
  Elmo-Mbc-Rac module, and signals to tendon cells through the EGFR ligand Vein, so msk mutant embryos
  fail to form stable muscle-tendon attachments.
