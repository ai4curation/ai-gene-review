- term:
    id: GO:0043524
    label: negative regulation of neuron apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:16540506
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: msk-null eye clones are lost, but the data show a cell-viability consequence of losing a general
      import receptor rather than regulation of neuronal apoptosis.
    reason: In PMID:16540506 (full text) larval msk clones are small but do not stain for activated Caspase-3,
      and p35 expression does not rescue clone size; only msk-null cells that persist to the pupal stage die
      with caspase activation. Neither observation shows Msk acting in the control of apoptosis, nor that the
      dying cells are neurons specifically. Late death of import-deficient cells is a pleiotropic downstream
      outcome of loss of nuclear import, so the regulatory process term over-states the evidence.
    supported_by:
    - reference_id: PMID:16540506
      supporting_text: Larval msk clones do not stain for activated Caspase-3, a marker for apoptosis (data
        not shown).
    - reference_id: PMID:16540506
      supporting_text: To test for this, we overexpressed p35 to inhibit apoptosis, but this failed to rescue
        clone size
    - reference_id: PMID:16540506
      supporting_text: msk null cells that survive into phase 2 eventually die in the pupal stage, a time
        when we can detect activated Caspase 3
