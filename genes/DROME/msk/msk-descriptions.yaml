descriptions:
- source: Alliance_Imported
  text: moleskin (msk) encodes an importin that contributes to protein import into
    the nucleus. It is involved in eye development, muscle attachment and wing cell
    fate specification.
  source_type: curated
  url: https://flybase.org/reports/msk.html
  source_id: FB:FBgn0026252
