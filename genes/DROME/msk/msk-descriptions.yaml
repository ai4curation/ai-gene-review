      score: 3
    - rubric: specificity
      score: 2
    overall_notes: Correct on nuclear import and eye and wing roles; no cargoes named,
      and the muscle attachment role is not covered in the review.
- source: Alliance_Automated
  text: Enables U1 snRNA binding activity; U2 snRNA binding activity; and U4 snRNA
    binding activity. Involved in several processes, including Cajal body organization;
    compound eye morphogenesis; and wing disc development. Located in several cellular
    components, including Cajal body; cell cortex; and perinuclear region of cytoplasm.
    Is expressed in several structures, including embryonic/larval midgut primordium;
    ganglia; germline cell; gut section; and larval muscle cell. Human ortholog(s)
    of this gene implicated in connective tissue disease. Orthologous to several human
    genes including IPO7 (importin 7).
  source_type: automated
