- source: Alliance_Imported
  text: Monensin sensitivity 1 (Mon1) encodes a protein that forms a complex with
    the product of Ccz1 and acts as an exchange factor of the small G-protein encoded
    by Rab7. It activates and recruits the product of Rab7 to the maturing endosome,
    inducing the fusion of the matured endosome with the lysosome. Mon1/Ccz1 complex
    loss of function results in Rab7 phenotypes.
