  review:
    summary: The Mon1 N-terminal domain autoinhibits the GEF activity of Mon1-Ccz1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The experiments show intramolecular/intra-complex autoinhibition by the disordered Mon1 N-terminus
      of the complex Mon1 itself belongs to. This is a regulatory feature of the GEF rather than an activity
      of Mon1 acting on another GEF, so annotating Mon1 with GEF inhibitor activity overstates it.
    supported_by:
