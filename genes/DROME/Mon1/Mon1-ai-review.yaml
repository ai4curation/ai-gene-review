core_functions:
- description: Mon1, with Ccz1, forms the Rab7 guanine nucleotide exchange factor that is recruited by
    Rab5 to maturing endosomes and loads Rab7 with GTP, driving Rab5-to-Rab7 conversion and endosome-lysosome
    trafficking.
