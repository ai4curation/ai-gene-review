gene_symbol: Mon1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mon1 (Dmon1, Sand1 family) is the Drosophila ortholog of yeast Mon1 and, with Ccz1, forms
  the guanine nucleotide exchange factor that activates Rab7 on maturing endosomes; in metazoa the heterodimer
  is joined by the scaffold subunit Bulli (RMC1). The complex is recruited to and stimulated on Rab5-positive
  membranes through a conserved Rab5-binding site in Mon1, while the disordered Mon1 N-terminus autoinhibits
  Rab5-dependent GEF activity. Loss of Dmon1 enlarges maturing endosomes, which accumulate Notch and other
  transmembrane cargo and fail to acquire Rab7. Mon1 mutants are short-lived with motor defects and show
  altered neuromuscular junction bouton morphology and elevated postsynaptic glutamate receptor levels.
