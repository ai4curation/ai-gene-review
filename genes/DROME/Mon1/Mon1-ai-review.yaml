suggested_questions:
- question: How does loss of Mon1 in motor neurons raise postsynaptic GluRIIA levels, and is this explained
    by defective presynaptic endolysosomal trafficking or by a secreted/transsynaptic pool of Mon1?
suggested_experiments:
- hypothesis: The NMJ phenotypes of Dmon1 mutants arise from loss of presynaptic Rab7 activation.
  description: Express GTP-locked Rab7 presynaptically in Dmon1 mutants and test whether bouton morphology
    and GluRIIA levels are rescued; in parallel, test for extracellular Mon1 at the NMJ by non-permeabilised
    immunostaining.
