  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Checked each claim. Paralog of spz: true (PTHR23199; PMID:19018662). Ligand for Toll-6
      and kek6: true (PMID:23892553, PMID:28846707, PMID:39704728); the text omits Toll-7, Toll-1 (PMID:30361090)
      and Toll-2 (PMID:42552905) but is not wrong. Promotes neuron survival, axonal and dendritic growth
      and branching, and structural synaptic plasticity: true (PMID:28846707, PMID:39704728). Larval locomotion
      (PMID:28846707 crawling) and adult locomotion and long-term memory (PMID:39704728): true. Uncited
      and undated, but current.'
