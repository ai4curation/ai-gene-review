id: Q9VZX1
gene_symbol: spz5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'spz5 (DNT2, neurotrophin 2) encodes a secreted Spätzle-family cystine-knot protein. Its
  prepro-protein is cleaved by furin, and it is secreted mainly as the mature cystine-knot domain. DNT2
  is a neurotrophin: it binds the Toll-family receptors Toll-6 and Toll-7 and the kinase-less Trk-like
  receptor Kek-6, and activates NF-kappaB (Dorsal/Dif) and ERK pro-survival signaling. Together with DNT1
  it maintains neuronal survival in the embryonic CNS and contributes to motor axon targeting. Produced
  by muscle, it acts as a retrograde factor at the larval neuromuscular junction, where with Kek-6 and
  Toll-6 it regulates NMJ growth and structural synaptic plasticity. In the adult brain DNT2 neurons connect
  with dopaminergic neurons, and DNT2 with Toll-6 and Kek-6 maintains dopaminergic neuron survival, dendrite
  growth and synaptogenesis, influencing locomotion and long-term memory; in the visual system it promotes
  neuronal survival together with Toll-2. Spz5 is also a ligand of Toll-1 that contributes to Toll-1 ligand
  activity in larvae, and apoptotic neurons release processed Spz5 to activate Toll-6 signaling in glia
  that primes them for engulfment.'
