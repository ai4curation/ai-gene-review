    summary: >-
      An uninformative ARBA process term for a product with no demonstrated activity.
    reason: >-
      This is an ARBA machine-learning association. Gene expression is a very high-level parent of
      the specific termination and 3'-end processing roles of full-length Pcf11, and none of those
      roles can be attributed to the 86-residue RC product, which lacks the functional regions
