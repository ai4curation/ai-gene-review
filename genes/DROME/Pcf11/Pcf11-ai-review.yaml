knowledge_gaps:
- gap_statement: It is unknown whether the Pcf11-RC transcript is translated into a stable 86-residue
    protein in vivo, and if so what that protein does.
  boundary: The RC product shares Pcf11 residues 1-62, which contain about a third of the CID, and has
    a unique 24-residue tail. A protein of the expected size was not seen in testis with an N-terminal
    antibody, although the RC transcript is abundant.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Ribosome profiling or tagged-allele detection of the RC product, followed by CTD-binding
    and localization assays if it is made.
  provenance:
  - reference_id: PMID:39111825
    supporting_text: no protein product corresponding to PCF11-RC was observed despite a seemingly high
      level of the PCF11-RC transcript isoform detected by snRNA-seq of Drosophila testis tissue
suggested_questions:
- question: Should the gene-level FlyBase experimental annotations for Pcf11 be carried onto the 86-residue
    RC product (C0P8M6/E1JH69), or only onto the long and RB isoforms whose sequences contain the full
    CID?
suggested_experiments:
- description: Tag the unique C-terminal tail of the RC product at the endogenous locus, or use ribosome
    profiling of testis and embryo, to test whether the 86-residue protein is made. If it is, test recombinant
    RC protein for binding to Ser2/Ser5-phosphorylated CTD peptides beside the full CID (residues 1-149).
