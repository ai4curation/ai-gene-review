- term:
    id: GO:0031124
    label: mRNA 3'-end processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR045154
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      CFII-dependent 3'-end processing belongs to the long Pcf11 isoforms, not the RC product.
    reason: >-
      Pcf11-containing CFII regulates poly(A)-site choice in Drosophila spermatocytes, and Cbc
      co-immunoprecipitated with the >250 kDa long Pcf11 forms (PMID:39111825). Pcf11 homologs
      bind Cbc/Clp1 through a region near the C terminus that C0P8M6 lacks. Yeast Pcf11 3'-end
      processing also depends on regions separable from CTD binding (PMID:12727883). The 86-residue
      product has none of these regions, so the family-level IEA overstates it.
    supported_by:
    - reference_id: PMID:39111825
      supporting_text: PCF11 homologs in mammals and yeast have been shown to bind Cbc homologs
        through a region close to the C terminus of PCF11
    - reference_id: file:DROME/Pcf11/Pcf11-bioinformatics/RESULTS-rereview.md
      supporting_text: C0P8M6 has none of the regions C-terminal to the CID that the longer products
        carry.
