id: C0P8M6
gene_symbol: Pcf11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  C0P8M6 (cDNA clone MIP05908p) is the 86-residue protein predicted from the short Pcf11-RC
  transcript of the Drosophila Pcf11 (Inr-a, CG10228) locus, and is identical in sequence to
  the FlyBase-derived isoform C entry E1JH69. It shares only residues 1-62 with the 573-residue
  and ~1950-residue Pcf11 products, so it carries about the first third of the RNA polymerase II
  CTD-interacting domain (CID, residues 11-146 in the longer products) followed by a unique
  24-residue C-terminal tail. It lacks the rest of the CID and every region C-terminal to it.
  A protein corresponding to Pcf11-RC was not detected in testis extracts with an antibody
  raised against residues 1-283, even though the RC transcript is abundant. Its activity and
  location are therefore unknown, and it is not known whether it is translated. The long Pcf11
  proteins encoded by the same gene are nuclear, chromatin-associated components of cleavage
  factor II (with Cbc). They promote RNA polymerase II transcription termination by bridging
  the polymerase CTD to the nascent transcript and dismantling paused elongation complexes, and
  they regulate poly(A)-site choice. None of these activities has been shown for, or can be
  structurally inferred for, the 86-residue product.
existing_annotations:
- term:
    id: GO:0000993
    label: RNA polymerase II complex binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR045154
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      Family-level InterPro2GO transfer to a product that keeps only about a third of the CID.
    reason: >-
      IPR045154 (PCF11-like) is a family signature, and CTD binding is a real property of the
      full-length Drosophila Pcf11, which binds the CTD and nascent RNA (PMID:16387654). That
      activity is carried by the complete CID helical bundle (residues 11-146 in the longer
      products). C0P8M6 shares only residues 1-62 with them and then ends in a unique 24-residue
      tail (file:DROME/Pcf11/Pcf11-bioinformatics/RESULTS-rereview.md), and the Genes Dev study
      describes the CID as only partially present in the RC product. A truncated helical bundle is
      not expected to fold into a CTD-binding module, and the RC protein has not been detected in
      vivo. The term is correct for the gene but over-annotated on this product.
    supported_by:
    - reference_id: PMID:39111825
      supporting_text: PCF11 has a CID (Pol II C-terminal binding domain) present in both the
        PCF11-long and the 63 kDa PCF11-RB isoforms but only partially present in the short protein
        encoded by PCF11-RC.
    - reference_id: file:DROME/Pcf11/Pcf11-bioinformatics/RESULTS-rereview.md
      supporting_text: C0P8M6 retains residues 11-62 of the CID (about 38% of it) plus an unrelated
        C-terminal tail.
    - reference_id: PMID:16387654
      supporting_text: dPcf11 forms a bridge between the CTD and RNA.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IDA
  original_reference_id: PMID:16387654
  qualifier: enables
  review:
    action: UNDECIDED
    summary: >-
      A valid gene-level experimental result whose attachment to the 86-residue RC product cannot
      be verified.
    reason: >-
      Zhang and Gilmour showed that Drosophila Pcf11 bridges the CTD to nascent RNA, so RNA binding
      is well supported for the gene. FlyBase made this annotation at gene level and it is carried
      onto C0P8M6. Only the abstract is cached, and it does not say which construct was assayed.
      It is very unlikely to have been the 86-residue RC product, since the RC protein has not
      been detected and lacks most of the CID and all C-terminal regions. The curator's
      experimental call for the gene is not disputed. Whether this exact product binds RNA is
      undetermined, so the row is left UNDECIDED rather than accepted as a function of C0P8M6.
    supported_by:
    - reference_id: PMID:16387654
      supporting_text: dPcf11 forms a bridge between the CTD and RNA.
    - reference_id: PMID:39111825
      supporting_text: no protein product corresponding to PCF11-RC was observed despite a seemingly
        high level of the PCF11-RC transcript isoform detected by snRNA-seq of Drosophila testis
        tissue
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR045154
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      Family-level transfer of an RNA-binding activity the truncated product has no region to carry.
    reason: >-
      In Pcf11 proteins RNA contact is made by regions outside the N-terminal CID. Reconstituted
      mammalian CFII places RNA binding in the Pcf11 zinc fingers (PMID:30139799), which lie well
      C-terminal to the CID. C0P8M6 ends at residue 86 and keeps only residues 1-62 of the shared
      sequence. The family signature cannot transfer an activity whose structural basis is
      absent from this product.
    supported_by:
    - reference_id: file:DROME/Pcf11/Pcf11-bioinformatics/RESULTS-rereview.md
      supporting_text: C0P8M6 has none of the regions C-terminal to the CID that the longer products
        carry.
    - reference_id: PMID:39111825
      supporting_text: PCF11 has a CID (Pol II C-terminal binding domain) present in both the
        PCF11-long and the 63 kDa PCF11-RB isoforms but only partially present in the short protein
        encoded by PCF11-RC.
- term:
    id: GO:0006369
    label: termination of RNA polymerase II transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR045154
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      True of the Pcf11 gene but not supported for this truncated, undetected product.
    reason: >-
      Drosophila Pcf11 is a termination factor: RNAi causes Pol II readthrough at hsp70, and the
      protein dismantles elongation complexes in a CTD-dependent manner (PMID:16387654). The
      mechanism requires CTD binding and RNA contact, and C0P8M6 has neither the complete CID nor
      the C-terminal regions. The RC protein was also not detected in testis, so there is no
      evidence that this product takes part in termination. The family-level IEA is therefore an
      over-annotation of this accession. It should stay on the long isoforms.
    supported_by:
    - reference_id: PMID:16387654
      supporting_text: We show that Pcf11 is directly involved in termination in Drosophila.
    - reference_id: PMID:39111825
      supporting_text: no protein product corresponding to PCF11-RC was observed despite a seemingly
        high level of the PCF11-RC transcript isoform detected by snRNA-seq of Drosophila testis
        tissue
