description: The C0P8M6 Pcf11 record encodes an 86-residue protein consisting largely of a CTD-interacting
  domain. Full-length Drosophila Pcf11 participates in RNA polymerase II transcription termination, but
  the activities and intracellular distribution of this short translation product are unresolved.
