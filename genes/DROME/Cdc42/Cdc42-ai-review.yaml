core_functions:
- description: GTP/GDP-cycling Rho GTPase switch at the plasma membrane and cell cortex. In the GTP state
    it recruits Par-6/aPKC to the apical cortex downstream of Bazooka and relieves Par-6 inhibition of
    aPKC, establishing apical-basal polarity in neuroblasts, the oocyte and epithelia.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0007266
    label: Rho protein signal transduction
  - id: GO:0045200
    label: establishment of neuroblast polarity
  - id: GO:0030010
    label: establishment of cell polarity
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:17726059
    supporting_text: Cdc42 colocalizes with Par-6/aPKC at the apical cortex in a Bazooka-dependent manner,
      and is required for Par-6/aPKC localization
  - reference_id: PMID:17726059
    supporting_text: In addition to regulating Par-6/aPKC localization, Cdc42 increases aPKC activity
      by relieving Par-6 inhibition.
  - reference_id: PMID:11468292
    supporting_text: Here we demonstrate that Drosophila RotundRacGAP is active in vitro on Drac1 and
      Dcdc42 but not Drho1
- description: GTP-dependent binding and activation of serine/threonine kinase effectors (the PAK-family
    kinases Mbt and Pak, and the MRCK-like kinase Gek). Cdc42 also recruits Mbt to adherens junctions.
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  directly_involved_in:
  - id: GO:0071902
    label: positive regulation of protein serine/threonine kinase activity
  - id: GO:0071896
    label: protein localization to adherens junction
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12490550
    supporting_text: the GTPase binding domain, which specifically interacts with GTP-loaded Cdc42, are
      important for Mbt function
  - reference_id: PMID:12490550
    supporting_text: Besides regulation of kinase activity, another important function of Cdc42 is to
      recruit Mbt to adherens junctions
  - reference_id: PMID:8628256
    supporting_text: DPAK bound to activated (GTP-bound) Drosophila Rac (DRacA) and Drosophila Cdc42
  - reference_id: PMID:9371783
    supporting_text: which binds to Dcdc42 in a GTP-dependent and effector domain-dependent manner
- description: GTP-dependent engagement of the GTPase-binding domains of actin-regulatory effectors (the
    formin Frl, and the WASp/Arp2/3 pathway through Nwk and dCIP4) to promote localized actin polymerization
    and filopodial protrusion.
  molecular_function:
    id: GO:0032427
    label: GBD domain binding
  directly_involved_in:
  - id: GO:0030838
    label: positive regulation of actin filament polymerization
  - id: GO:0051491
    label: positive regulation of filopodium assembly
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:26801180
    supporting_text: FrlGBD-DID-DD-CC bound to Cdc42 with about an eightfold increase of the active, GTP-bound
      form of Cdc42 over GDP-Cdc42
  - reference_id: PMID:18701694
    supporting_text: functions together with Cdc42 to promote WASp-mediated actin polymerization in vitro
      and to regulate synaptic growth in vivo
  - reference_id: PMID:8947551
    supporting_text: We find that Cdc42 is required for localized actin polymerization in the extending
      hair.
suggested_questions:
- question: Which step of adult cardiac function does Cdc42 itself perform? Myofibril alignment via Pak,
    or transcriptional support of Tinman targets such as dSUR and slowpoke (PMID:21690310)? The answer
    decides whether a heart contraction process term is warranted.
- question: Should GO provide a cell-level wound repair process term, distinct from tissue 'wound healing',
    for the Rho GTPase arrays that repair single-cell wounds in the syncytial embryo (PMID:24388847, PMID:28923977)?
- question: Does Cdc42 have any nuclear pool in Drosophila cells, as implied by the IDA nucleus annotation
    from PMID:19498173, or does that reflect the overexpressed biosensor?
- question: Does Drosophila Cdc42 directly activate Hep/JNK signalling (e.g. through Pak or an MLK) in
    thorax and dorsal closure, given that dominant-negative Cdc42 did not alter JNK target expression
    in embryos (PMID:11468292)?
suggested_experiments:
- description: Heart-specific Cdc42 knockdown combined with Pak or Frl loss and live myofibril imaging,
    with transcript profiling of dSUR and slowpoke, to separate a direct cytoskeletal role of Cdc42 in
    cardiomyocytes from a transcriptional cooperation with Tinman.
- description: Endogenously tagged Cdc42 (CRISPR knock-in) imaged with nucleotide-state biosensors in
    neuroblasts, oocytes and hemocytes, to map the active pool and test for any nuclear localization without
    overexpression.
