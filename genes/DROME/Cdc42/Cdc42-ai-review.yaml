id: P40793
gene_symbol: Cdc42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Cdc42 is the single Drosophila member of the CDC42 subfamily of Rho-family small GTPases.
  It is a prenylated GDP/GTP molecular switch: in its GTP-bound state it binds effectors at the plasma
  membrane and cell cortex, and GAPs such as RotundRacGAP return it to the inactive GDP state. Its effectors
  include PAK-family kinases (Mbt, Pak), the MRCK-like kinase Gek, the FMNL formin Frl, WASp-pathway F-BAR
  proteins (Nwk, dCIP4) and the Par-6/aPKC polarity complex. Through these effectors Cdc42 has two broad
  roles. It drives localized actin polymerization and filopodial protrusion, and it recruits and activates
  Par-6/aPKC to set apical-basal polarity in neuroblasts, oocytes and epithelia. These activities underlie
  its requirement in many developmental and physiological contexts: dorsal closure, wing hair outgrowth,
  tracheal branch fusion and terminal-cell branching, photoreceptor morphogenesis and ommatidial rotation,
  border cell and hemocyte migration, epithelial and single-cell wound repair, dendrite and axon morphogenesis,
  NMJ growth and homeostasis, immune encapsulation, and adult heart function. Endogenous Cdc42 activity
  is tightly restricted in space and time in vivo.'
