- source: Alliance_Automated
  text: Enables GTPase activating protein binding activity; GTPase activity; and protein
    kinase binding activity. Involved in several processes, including generation of
    neurons; morphogenesis of an epithelium; and regulation of plasma membrane bounded
    cell projection organization. Located in several cellular components, including
    growth cone; lamellipodium; and rhabdomere. Is expressed in several structures,
    including Malpighian tubule primordium; embryonic/larval midgut primordium; female
    germline cell; gut section; and larval muscle cell. Used to study kidney disease
    and myelofibrosis. Human ortholog(s) of this gene implicated in fibrosarcoma and
    intellectual disability. Orthologous to human CDC42 (cell division cycle 42).
  source_type: automated
