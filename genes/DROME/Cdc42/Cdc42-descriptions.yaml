descriptions:
- source: UniProt
  text: Regulates mbt kinase activity and is also required to recruit mbt to adherens
    junctions (PubMed:12490550). Together with mbt and Frl, regulates photoreceptor
    cell morphogenesis (PubMed:12490550, PubMed:26801180). Together with Frl, has
    a role in the neuronal development of mushroom bodies (PubMed:26801180).
  source_type: curated
