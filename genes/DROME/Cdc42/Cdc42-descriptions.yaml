- source: Alliance_Imported
  text: Cell division cycle 42 (Cdc42) encodes a GTPase signaling protein that acts
    as a molecular switch and functions as key regulator of the actin cytoskeleton.
    It plays a central role in diverse biological processes including actin cytoskeleton
    organization, morphogenesis, hemocyte migration, cell polarity, and wound repair.
  source_type: curated
  url: https://flybase.org/reports/Cdc42.html
  source_id: FB:FBgn0010341
