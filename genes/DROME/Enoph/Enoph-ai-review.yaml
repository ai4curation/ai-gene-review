id: Q9VN95
gene_symbol: Enoph
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Enoph encodes the enolase-phosphatase E1 of Drosophila melanogaster, a Mg2+-dependent HAD-superfamily
  enzyme that performs the fourth step of the methionine salvage pathway. It enolizes 2,3-diketo-5-methylthiopentyl-1-phosphate
  and dephosphorylates the resulting enol to the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene,
  the substrate of acireductone dioxygenase (Adi1). Its activity and cytosolic localization are inferred
  from orthology to the characterized human enzyme (ENOPH1); the fly protein has not been studied experimentally.
