suggested_questions:
- question: >-
    Is Enoph required for methionine recycling and female fecundity under dietary restriction, as Adi1
    is?
suggested_experiments:
- description: >-
    Assay recombinant Enoph with 2,3-diketo-5-methylthiopentyl-1-phosphate and measure acireductone formation;
    profile methionine-salvage intermediates in Enoph mutants.
  hypothesis: Enoph is the sole fly acireductone synthase.
