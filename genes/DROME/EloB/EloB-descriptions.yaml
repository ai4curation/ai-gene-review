descriptions:
- source: UniProt
  text: SIII, also known as elongin, is a general transcription elongation factor
    that increases the RNA polymerase II transcription elongation past template-encoded
    arresting sites. Subunit A is transcriptionally active and its transcription activity
    is strongly enhanced by binding to the dimeric complex of the SIII regulatory
    subunits B and C (elongin BC complex). In embryonic stem cells, the elongin BC
    complex is recruited by EPOP to Polycomb group (PcG) target genes in order generate
    genomic region that display both active and repressive chromatin properties, an
    important feature of pluripotent stem cells.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q7KSB2
  source_id: Q7KSB2
