    overall_notes: Describes the Elongin (SIII) transcription elongation complex and
      mammalian EPOP recruitment in embryonic stem cells, generic mammalian text.
      Omits the Cul2/Cul5 ubiquitin ligase adaptor role that is central in the review.
- source: Alliance_Imported
  text: Elongin B (EloB) encodes an essential protein for development that participates
    in the control of wing cell identity. EloB, EloC and EloA encode for subunits
    of the Elongin complex, which interacts in vivo with the chromatin factor encoded
    by corto. The proteins encoded by EloB and EloC form an adaptor subcomplex of
    a Cul2-RING ubiquitin ligase complex.
  source_type: curated
  url: https://flybase.org/reports/EloB.html
  source_id: FB:FBgn0023212
