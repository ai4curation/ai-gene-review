    - rubric: specificity
      score: 4
    overall_notes: 'Correct: essential, wing cell identity, Elongin complex with EloA
      and EloC interacting with Corto, and EloB/C adaptor of Cul2 ligases. No substrate
      receptors named.'
- source: Alliance_Automated
  text: Involved in several processes, including imaginal disc-derived wing vein specification;
    larval somatic muscle development; and target-directed miRNA degradation. Part
    of Cul2-RING ubiquitin ligase complex; Cul3-RING ubiquitin ligase complex; and
    elongin complex. Is expressed in several structures, including adult head; adult
    heart; anterior endoderm; anterior endoderm anlage; and embryonic/larval midgut
    primordium. Orthologous to human ELOB (elongin B).
  source_type: automated
