suggested_questions:
- question: Which fly BC-box receptors besides Vhl, Socs36E and Dora use EloB/C, and with which cullin
    (Cul2 versus Cul5)?
suggested_experiments:
- hypothesis: EloB is required for Vhl-dependent Sima degradation in vivo.
  description: Measure Sima-ODD reporter stability and hypoxia target expression in EloB mutant clones
    in normoxia, with Vhl and Cul2 knockdowns as references.
