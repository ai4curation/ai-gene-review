  label: Drosophila melanogaster
description: Elongin B (EloB) is a ubiquitin-like protein that binds Elongin C to form the EloB/C heterodimer.
  As part of cullin-RING ligases, EloB/C links BC-box substrate receptors such as Vhl, Socs36E and the
  ZSWIM8 ortholog Dora to Cul2 or Cul5 and the RING protein Roc1a; EloB stabilizes EloC and contacts the
  cullin. These ligases ubiquitinate HIF-alpha/Sima for proteasomal degradation, attenuate ligand-stimulated
  JAK/STAT signaling through the Domeless receptor, and promote target-directed miRNA degradation. With
  EloA, EloB/C also forms the Elongin transcription elongation complex that stimulates RNA polymerase
  II elongation, and EloB acts in wing vein versus intervein specification. The host Cul2-EloB/C ligase
  can be hijacked by the Cricket paralysis virus 1A protein to degrade Argonaute-2. EloB is found in the
  nucleus and cytoplasm.
