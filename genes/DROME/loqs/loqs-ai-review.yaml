    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17666393
  qualifier: enables
  supporting_entities:
  - FB:FBgn0039016
  review:
    action: MODIFY
    summary: The IPI with Dcr-1 is real, but bare protein binding is uninformative. The same paper
      shows that the binding increases Dcr-1 affinity for pre-miRNA and miRNA output, which is
      ribonuclease activator activity.
    reason: Loqs-PB binds Dcr-1 (FBgn0039016) through DRBM3 and the linker before it, and this binding
      raises Dcr-1 affinity for pre-miRNA and stimulates miRNA production (PMID:17666393, PMID:15985611,
      PMID:15918769, PMID:17928574). GO:0170054, defined as binding to and increasing the activity of
      a ribonuclease, describes that function exactly. The interaction itself is not in doubt; per the
      protein-binding policy the bare term is replaced. One caveat applies to this accession. PF lacks
      PB Lys384, which lies in that Dcr-1-binding linker two residues after the LLKL motif whose
      mutation strongly reduces Dcr-1 activity. No experiment has tested whether the missing lysine
      matters, so the transfer to PF is by sequence identity.
    supported_by:
    - reference_id: PMID:17666393
      supporting_text: Both domains of Loqs-PB are required for efficient miRNA production by enhancing
        the affinity of Dcr-1 for pre-miRNA.
    - reference_id: PMID:15985611
      supporting_text: recombinant R3D1-L enhances miRNA production by Dicer-1 in vitro
    - reference_id: PMID:26769856
