  review:
    action: UNDECIDED
    summary: Valid for the loqs gene through the Dcr-2 partner isoform Loqs-PD. Not established for
      this PB-like isoform F accession.
    reason: Marques et al. show Loqs is needed for Dcr-2 dsRNA processing, and later work assigns
      that role to Loqs-PD, which arises by alternative polyadenylation, lacks DRBM3 and has a unique
