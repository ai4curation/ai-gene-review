    label: RISC-loading complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00085164
  review:
    action: ACCEPT
    summary: Loqs-PB co-purifies with Dcr-1 in a functional pre-miRNA processing complex that also
      loads AGO1 (the miRLC). Membership holds even though Loqs is not required for miRISC assembly.
    reason: GO:0070578 describes the Dicer/dsRBP/Argonaute assembly that processes the precursor
      and loads RISC. Immunopurified Dcr-1/Loqs complexes process pre-miRNA (PMID:15918769), and the
      curated UniProt PB entry records Loqs-PB in the miRLC with Dcr-1 and AGO1. Liu et al. 2007
      (PMID:17928574) found that loqs-null flies still assemble miRISC, so Loqs is a member of the
      complex but not essential for the loading step. The complex term is kept and no RISC-assembly
      process is asserted. The mammalian DICER1/TARBP2/AGO2 composition is not transferred
      (TARBP2 is in a different PANTHER subfamily, SF1).
    supported_by:
    - reference_id: PMID:15918769
