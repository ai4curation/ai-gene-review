  review:
    action: UNDECIDED
    summary: The biochemistry behind this row is Loqs-PD lowering the KM of Dicer-2 for long dsRNA.
      That is a PD-specific activity, not shown for this PB-like isoform.
    reason: In Cenik et al. (full text), recombinant Loqs-PD lowers the KM of Dcr-2 for long dsRNA
