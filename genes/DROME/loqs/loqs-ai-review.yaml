id: X2J5X6
gene_symbol: loqs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Loquacious (loqs) encodes a family of double-stranded RNA-binding proteins related to
  mammalian TRBP and PACT that act as cofactors of the two Drosophila Dicer ribonucleases.
  The 464-residue isoform F (X2J5X6) is identical to the miRNA-pathway isoform PB except for
  the absence of one lysine (PB Lys384) in the linker before the third dsRNA-binding domain
  (DRBM). Like PB, it carries three DRBMs: DRBM1 and DRBM2 bind RNA, DRBM2 binds the pre-miRNA
  hairpin, and DRBM3 with its preceding linker binds Dicer-1. In the cytoplasm Loqs-PB binds
  Dicer-1, raises its affinity for pre-miRNAs and stimulates and directs their cleavage to
  mature miRNAs. Loqs-PB also associates with Dicer-1 and AGO1 in a miRNA RISC-loading complex,
  although loqs-null flies still assemble miRISC. A different isoform, Loqs-PD, which lacks
  DRBM3 and has its own C-terminus, partners Dicer-2 in endogenous and exogenous siRNA
  production. Through miRNA production the gene is required for female germline stem-cell
  maintenance, fertility and normal development.
