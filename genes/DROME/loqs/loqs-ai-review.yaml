taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Loquacious is a double-stranded RNA-binding cofactor that helps Dicer enzymes produce regulatory
  small RNAs. The 464-residue PF isoform retains the three-domain architecture of the miRNA-processing
  PB isoform, supporting RNA recognition and association with Dcr-1 in cytoplasmic pre-miRNA processing.
  Other splice isoforms, especially PD, specialize in Dcr-2-dependent siRNA production. Small-RNA regulation
  connects loqs to development and germline stem-cell maintenance.
