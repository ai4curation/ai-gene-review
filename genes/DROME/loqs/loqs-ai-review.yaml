      only PB statement in the paper argues against PB restricting Dcr-1 to the miRNA pathway. The
      regulatory effect is real for the gene but was measured with PD, which lacks DRBM3. X2J5X6 is
      PB-like, so the row is left undecided for this accession rather than removed.
