- term:
    id: GO:0009047
    label: dosage compensation by hyperactivation of X chromosome
  evidence_type: IGI
  original_reference_id: PMID:22554892
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0019660
  - FB:FBgn0019661
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The evidence is a viability modifier (loqs f00791 lowers survival of roX1 roX2 males),
      which does not show that Loqs does any step of X-chromosome hyperactivation.
    reason: The study, read in full text, scores adult male survival in a sensitized roX mutant
      background; the loqs allele removes all isoforms, including the miRNA-pathway PB, and the authors
      list both miRNA and endo-siRNA roles of loqs. The phenotype establishes that the small-RNA
      pathways are needed in a sensitized background, a necessity argument. It identifies no step of
      MSL recruitment or X hyperactivation that Loqs performs, and the siRNA-related mechanism belongs
      to the PD isoform rather than this PB-like product. The annotation is not wrong as a genetic
      observation but overstates participation.
    supported_by:
    - reference_id: PMID:22554892
      supporting_text: While loqs has a prominent role in miRNA biogenesis, an isoform of Loqs has been
        implicated in the biogenesis of endo-siRNA from structured loci and transposons
    - reference_id: PMID:22554892
      supporting_text: Our findings are consistent with a role for siRNA in selective recognition of
        X chromatin.
