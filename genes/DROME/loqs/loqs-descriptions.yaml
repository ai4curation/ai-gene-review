descriptions:
- source: Alliance_Imported
  text: loquacious (loqs) encodes a double-stranded RNA binding protein with multiple
    splicing isoforms. loqs-PB and loqs-PA associate with the product of Dcr-1 to
    facilitate processing of precursor miRNA into mature miRNA, whereas loqs-PD interacts
    with the product of Dcr-2 to enhance processing of dsRNA into siRNA.
  source_type: curated
  url: https://flybase.org/reports/loqs.html
  source_id: FB:FBgn0032515
