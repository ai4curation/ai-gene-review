suggested_questions:
- question: How does Piwi-piRISC engagement of a nascent transcript signal to Asterix/Panoramix, given
    that Piwi slicer activity is dispensable?
- question: Is the GSC-maintenance function of Piwi piRNA-dependent, given that it does not require nuclear
    localization?
suggested_experiments:
- experiment_type: Structure-function analysis
  hypothesis: A target-engaged conformation of Piwi exposes a surface recognized by Asterix/Panoramix.
  description: Cryo-EM of Piwi-piRNA-target RNA complexes with Asterix, combined with surface mutants
    tested for silencing in OSCs.
