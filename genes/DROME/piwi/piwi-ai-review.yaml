id: Q9VKM1
gene_symbol: piwi
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Piwi is the nuclear PIWI-clade Argonaute of Drosophila, expressed in ovarian somatic follicle
  and germline cells and in testes. Loaded in the cytoplasm (Yb bodies and on mitochondria, with Armitage
  and Zucchini-dependent processing) with antisense, 5-uridine primary/phased piRNAs, mature Piwi-piRISC
  is imported into the nucleus, where it scans nascent transcripts and, via Asterix/Gtsf1, Panoramix/SFiNX,
  SUMOylation and Eggless/SetDB1, establishes H3K9me3 heterochromatin and co-transcriptional silencing
  of transposons. Its slicer activity exists in vitro but is dispensable for silencing. Piwi is also required
  in somatic niche cells and germline for germline stem cell self-renewal, and maternal Piwi in polar
  granules contributes to pole cell formation.
