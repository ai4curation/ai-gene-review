    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16949822
  qualifier: enables
  supporting_entities:
  - FB:FBgn0028734
  review:
    summary: Protein-protein interaction of Piwi with a piRNA-pathway cofactor (PMID:16949822).
    action: REMOVE
    reason: Generic protein binding is uninformative about Piwi function. The reported partners (e.g.
      Papi, Vreteno, Panoramix/Asterix, Nxf2/SFiNX, Nup358, HP1a-pathway factors) are real piRNA-pathway
      cofactors, but the interaction alone does not establish a more specific Piwi molecular function.
      Removal does not imply the interaction is false.
