- source: Alliance_Automated
  text: Enables RNA endonuclease activity; chromatin DNA binding activity; and piRNA
    binding activity. Involved in several processes, including germ cell development;
    pole cell formation; and regulatory ncRNA-mediated gene silencing. Located in
    several cellular components, including chromatin; chromocenter; and nucleoplasm.
    Part of protein-containing complex. Is active in Yb body; cytosol; and nucleus.
    Is expressed in several structures, including adult brain; adult fat body; germline
    cell; gonad; and somatic cell of testis. Used to study primary ovarian insufficiency.
    Orthologous to human PIWIL1 (piwi like RNA-mediated gene silencing 1); PIWIL3
    (piwi like RNA-mediated gene silencing 3); and PIWIL4 (piwi like RNA-mediated
    gene silencing 4).
