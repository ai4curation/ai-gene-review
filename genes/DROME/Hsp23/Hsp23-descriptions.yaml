- source: Alliance_Automated
  text: Enables unfolded protein holdase activity. Involved in several processes,
    including cold acclimation; protein refolding; and response to heat. Located in
    cytosol. Is expressed in several structures, including adult head; adult heart;
    ganglia; primary neurons; and somatic precursor cell. Human ortholog(s) of this
    gene implicated in adult-onset myofibrillar myopathy 2A; cataract 16 multiple
    types; cataract 9 multiple types; dilated cardiomyopathy 1II; and infantile-onset
    myofibrillar myopathy-2B. Orthologous to human CRYAA (crystallin alpha A) and
    CRYAB (crystallin alpha B).
