core_functions:
- molecular_function: *id003
  description: Hsp23 binds non-native client proteins and suppresses heat-induced aggregation
    without an ATP-driven folding cycle. It preserves clients for subsequent reactivation by the
    cellular chaperone machinery. Purified Hsp23 directly improves luciferase recovery in an
    ATP-supplemented reticulocyte-lysate assay; the small chaperone performs the protective holding
    step.
