- id: PMID:9514881
  title: Cloning and developmental expression of a nuclear ubiquitin-conjugating enzyme (DmUbc9)
    that interacts with small heat shock proteins in Drosophila melanogaster.
  findings:
  - statement: DmUbc9 interacts with Hsp23 in yeast two-hybrid and co-immunoprecipitation assays.
    supporting_text: In a two hybrid screen designed to identify proteins that interact with small
      heat shock proteins (sHsps), a Drosophila melanogaster homologue of yeast and human ubc9
      (Dmubc9) was found to interact with Drosophila Hsp23
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly identifies Hsp23 two-hybrid and co-IP interaction with DmUbc9.
      DmUbc9 is the SUMO E2; its nuclear location cannot be assumed to be that of Hsp23. No SUMO
      catalytic activity is assigned to Hsp23.
- id: PMID:16313561
  title: Cold hardening and transcriptional change in Drosophila melanogaster.
  findings:
  - statement: Hsp23 is among stress proteins differentially expressed during cold hardening
      treatment.
    supporting_text: Taken together, these assays suggest that stress proteins, including Hsp23,
      Hsp26, Hsp83 and Frost as well as membrane-associated proteins may contribute to the cold
      hardening response.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract identifies Hsp23 among cold-hardening-responsive transcripts. Full paper
      unavailable after source search; retain the curated expression-based contextual response
      without claiming target-specific causal protection.
- id: PMID:16572729
  title: Differences in the chaperone-like activities of the four main small heat shock proteins of
    Drosophila melanogaster.
  findings:
  - statement: All four sHSPs have chaperone-like activity; Hsp23 requires 5-fold molar excess for
      equivalent efficiency.
    supporting_text: A 5 M excess of Hsp23 and Hsp26 was required to obtain the same efficiency with
      either citrate synthase or luciferase as substrate.
  - statement: Approximately 30% of luciferase activity is recovered with Hsp23 in refolding assays.
    supporting_text: In an in vitro refolding assay with reticulocyte lysate, more than 50% of
      luciferase activity was recovered when heat denaturation was performed in the presence of
      Hsp22, 40% with Hsp27, and 30% with Hsp23 or Hsp26.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full Methods/Results read: purified full-length Drosophila Hsp22 and Hsp23; heat aggregation,
      sucrose gradients and reticulocyte-lysate/ATP recovery. Hsp23 was purified through urea, with matched
      Hsp22 purification controls. Luciferase recovery was54.9±2.8% for Hsp22 and30.7±6.7% for Hsp23.
      These are direct holdase/refolding-participation assays, not proof that either independently folds
      clients.'
- id: PMID:19401761
  title: Distinct mechanisms underlying tolerance to intermittent and constant hypoxia in Drosophila
    melanogaster.
  findings:
  - statement: Hsp23 is upregulated during constant hypoxia; P-element lines show increased
      survival.
    supporting_text: Heat shock proteins up-regulation (specifically Hsp23 and Hsp70) led to a
      significant increase in adult survival (as compared to controls) of P-element lines during CH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Fig2 read. Hsp23 P-element line has elevated expression and increased
      constant-hypoxia survival. Excision-rescue and tissue-specific transgene tests concern Hsp70,
      not Hsp23. Supports response annotation without assigning the same detailed mechanism or
      controls to both.
