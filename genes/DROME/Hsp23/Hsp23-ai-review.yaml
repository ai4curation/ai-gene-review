- id: PMID:32437379
  title: Small heat shock proteins determine synapse number and neuronal activity during
    development.
  findings:
  - statement: Hsp23 and Hsp26 colocalize in the cytoplasm of CNS cells and physically interact.
    supporting_text: The data show that sHSP23 and sHSP26 localize in the cytoplasm of CNS cells, in
      particular in the optic lobes and the central nerve cord (Fig 2A and 2B`)
  - statement: Hsp23 and Hsp26 modulate synapse number during development.
    supporting_text: we suggest that sHSP23 and sHSP26 together form a complex that promotes synapse
      formation in presynaptic neurons, Pkm is an anti-synaptogenic element in neurons through, but
      not restricted to, the modulation of sHsp23 and sHsp26 (Fig 5C).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results read. Targeted Hsp23/Hsp26 co-IP, CNS/bouton imaging and dosage
      perturbations. Hsp23 knockdown alone does not significantly alter synapse number;
      overexpression alone reduces it, whereas joint Hsp23/Hsp26 overexpression increases it.
      Nuclear CalexA/NFAT reporter translocation is not Hsp23 nuclear imaging.
