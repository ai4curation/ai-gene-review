taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Drosophila melanogaster Hsp23 is an alpha-crystallin-domain small heat shock protein with
  ATP-independent holdase activity. It protects unfolded clients against aggregation and preserves their
  ability to be refolded by other chaperones. Hsp23 is predominantly cytoplasmic, including neuronal cytoplasm
  and synaptic boutons; older imaging studies report heat-dependent nuclear or nucleolar redistribution,
  with antibody and preparation limitations. Hsp23 associates with Hsp26 and the SUMO-conjugating enzyme
  Ubc9. Its expression and protective effects vary with development and stress: it supports heat tolerance
  and proteostasis, and increased expression is associated with resistance to constant hypoxia. Hsp23/Hsp26
  dosage also alters synapse number in developing motor neurons.'
