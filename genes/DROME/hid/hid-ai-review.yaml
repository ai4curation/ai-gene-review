id: Q24106
gene_symbol: hid
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'hid encodes Head involution defective, a Drosophila RHG-family IAP antagonist that promotes
  apoptotic caspase activation. Hid is a mitochondrial tail-anchored protein whose N-terminal IAP-binding
  motif binds DIAP1 and DIAP2 BIR domains, displacing Dronc and DrICE from IAP control and cooperating
  with Reaper and Grim to drive apoptotic signaling during development, steroid-triggered tissue remodeling,
  cell competition, and genotoxic stress responses.'
