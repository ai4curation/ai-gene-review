suggested_questions:
- question: Which developmental apoptosis contexts require Hid-DIAP2 antagonism in addition to the 
    genetically dominant Hid-DIAP1 axis?
- question: How do Hid mitochondrial insertion, RHG oligomerization, and BIR binding combine at 
    endogenous protein levels to set the threshold for DIAP1 and DIAP2 inhibition?
- question: Which upstream survival pathways phosphorylate or otherwise restrain Hid directly in 
    tissues where EGFR/Ras, Ack, or microRNAs buffer developmental apoptosis?
suggested_experiments:
- hypothesis: Hid requires separable N-terminal BIR-binding and C-terminal mitochondrial-tail-anchor
    surfaces for efficient IAP antagonism in vivo.
  description: Generate endogenous hid alleles that selectively disrupt the IAP-binding motif, 
    predicted tail anchor, and candidate oligomerization or Reaper-binding surfaces, then quantify 
    DIAP1/DIAP2 occupancy, Dronc and DrICE reporter activity, and cell survival in embryos, eye 
    discs, larval midgut, and salivary glands.
  experiment_type: endogenous separation-of-function allele series with live caspase reporters and 
    IAP co-immunoprecipitation
- hypothesis: DIAP2 buffering of Hid is context-specific and is only visible when the 
    DIAP1-controlled Dronc threshold is partially compromised.
  description: Combine Hid reporters with Diap2 BIR2, BIR3, and RING point mutants at the endogenous
    locus under weak genotoxic stress, steroid-triggered larval tissue death, and EGFR-loss 
    epidermal apoptosis, then compare SCAT3/drICE activity and cell loss against Diap1 sensitized 
    backgrounds.
  experiment_type: structure-guided endogenous DIAP2 mutant rescue in Hid-dependent apoptosis assays
