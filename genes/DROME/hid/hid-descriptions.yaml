findings:
- category: gap
  text: FlyBase says Ras/MAPK directly phosphorylates Hid to suppress apoptosis; the
    review covers only Ras-mediated down-regulation of hid expression and leaves direct
    phosphorylation as a question.
  sources:
  - Alliance_Imported
- category: gap
  text: UniProt says Hid acts on the caspase Dredd; the review does not mention Dredd.
  sources:
  - UniProt
review:
