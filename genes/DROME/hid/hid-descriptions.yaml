descriptions:
- source: UniProt
  text: Activator of apoptosis, with grim and rpr, that acts on the effector Dredd
    (PubMed:22615583, PubMed:9740659). Seems to act genetically upstream of baculoviral
    anti-apoptotic p35 (PubMed:7622034). Blocks Diap2 from binding and inactivating
    the effector caspase Drice (PubMed:18166655). Might regulate apoptosis downstream
    of Clbn/NEMF (PubMed:22964637).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24106
  source_id: Q24106
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Blocking Diap2 inactivation of Drice is correct; 'acts on Dredd'
      and the genetic placement upstream of p35 are dated, and DIAP1 binding is not
      stated.
- source: Alliance_Imported
  text: head involution defective (hid) encodes a member of the RHG (Reaper-Hid-Grim)
    family that promotes apoptosis by binding to and inhibiting the inhibitor of apoptosis
    protein Diap1, thereby enabling caspase activation and cell death. Hid functions
    within the intrinsic apoptotic pathway and is a key effector of developmental
    and stress-induced apoptosis throughout Drosophila development. Its activity is
    negatively regulated by the Ras/MAPK signaling pathway through direct phosphorylation,
    which suppresses Hid-mediated apoptosis and promotes cell survival.
  source_type: curated
  url: https://flybase.org/reports/hid.html
  source_id: FB:FBgn0003997
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 5
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and current: RHG protein binding DIAP1 to allow caspase
      activation in developmental and stress apoptosis, restrained by Ras/MAPK phosphorylation.
      Mitochondrial anchoring not mentioned.'
- source: Alliance_Automated
  text: Enables several functions, including BIR domain binding activity; protein
    sequestering activity; and ubiquitin protein ligase binding activity. Involved
    in several processes, including autophagic cell death; cellular response to gamma
    radiation; and instar larval or pupal morphogenesis. Located in mitochondrion;
    nucleus; and plasma membrane. Is active in mitochondrial outer membrane. Is expressed
    in several structures, including Malpighian tubule; gut section; head epidermis
    primordium; imaginal disc; and salivary gland. Used to study cancer and disease
    of cellular proliferation.
  source_type: automated
  url: https://flybase.org/reports/hid.html
  source_id: FB:FBgn0003997
