- source: Alliance_Imported
  text: Cyclin A (CycA) encodes a protein that binds to the product of Cdk1, thereby
    promoting Cdk1's protein kinase activity. The CycA-Cdk1 complex controls important
    aspects of progression through the cell cycle, including entry into mitosis. During
    the G2 phase, this complex is important for prevention of premature DNA re-replication.
    During mitosis and G1, the product of CycA is rapidly degraded (involving APC/C
    and the proteasome), resulting in inactivation of Cdk1 protein kinase activity.
  source_type: curated
  url: https://flybase.org/reports/CycA.html
  source_id: FB:FBgn0000404
