descriptions:
- source: UniProt
  text: Essential for the control of the cell cycle at the G2/M (mitosis) transition.
    Interacts with the Cdk1 and Cdk2 protein kinases to form MPF. G2/M cyclins accumulate
    steadily during G2 and are abruptly destroyed at mitosis.
  source_type: curated
