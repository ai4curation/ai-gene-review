- term:
    id: GO:0007096
    label: regulation of exit from mitosis
  evidence_type: IMP
  original_reference_id: PMID:16854973
  qualifier: involved_in
  review:
    summary: Reber et al. show that, before terminal mitoses, CycA negatively regulates Fzr/Cdh1. Without
      CycA, premature APC/C-Fzr activity degrades cyclin B, cyclin B3 and String, and cells cannot enter
      mitosis 16. The phenotype is a failure of mitotic entry, not of mitotic exit.
    action: MODIFY
    reason: The cached abstract describes CycA inhibiting Fzr/Cdh1 to prevent premature APC/C-mediated
      degradation in G2, which is a requirement for entering mitosis. Regulation of exit from mitosis
      does not match this. The mechanistic finding is best captured as negative regulation of APC-dependent
      catabolism, which CycA-Cdk1 performs by inhibiting Fzr. This is a lateral correction, not a refinement.
      The full text was not available, so the curator may have seen additional exit-related data.
    proposed_replacement_terms:
    - id: GO:1905785
      label: negative regulation of anaphase-promoting complex-dependent catabolic process
    supported_by:
    - reference_id: PMID:16854973
      supporting_text: In the absence of Cyclin A, premature Fizzy-related/Cdh1 activity results in the
        premature degradation of the Cdk1 activators Cyclin B and Cyclin B3
    - reference_id: PMID:15203007
      supporting_text: CycA-dependent kinase activity is required to inhibit one inhibitor of mitosis,
        the Fzr protein.
