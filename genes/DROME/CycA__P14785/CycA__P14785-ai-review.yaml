  review:
    summary: IBA to microtubule organizing center from node PTN007424001. That node is seeded only by
      B-type cyclins and cyclin F (fission yeast cdc13/cig2, human CCNB1, CCNB2, CCNF, rat cyclin B, budding
      yeast Clb). No A-type cyclin is among the seeds.
    action: MARK_AS_OVER_ANNOTATED
    reason: The MTOC/centrosome association in the seed set is a B-type cyclin feature. In syncytial Drosophila
      embryos, cyclin B is concentrated around centrosomes and spindle poles, while cyclin A is cytoplasmic
      in interphase and binds condensing chromosomes in mitosis, which goes against the B-cyclin pattern.
      The node is deep enough to reach CycA, but no Drosophila CycA centrosome localization was found
      in the literature we read. We therefore treat this as over-propagation of a B-cyclin location rather
      than a demonstrated CycA location.
    supported_by:
    - reference_id: PMID:1531147
      supporting_text: Cyclin B is seen mainly, but not exclusively, in the vicinity of microtubules throughout
        the mitotic cycle. It is most conspicuous around the centrosomes.
    - reference_id: PMID:1531147
      supporting_text: It associates with the condensing chromosomes during prophase, segregates into
        daughter nuclei in association with chromosomes during anaphase
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
