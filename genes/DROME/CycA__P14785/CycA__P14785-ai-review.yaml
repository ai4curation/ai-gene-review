id: P14785
gene_symbol: CycA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Cyclin A (CycA, CG5940) is the single A-type cyclin of Drosophila melanogaster and a member
  of the cyclin AB subfamily. It is a non-catalytic regulatory subunit of cyclin-dependent kinases: through
  its N-terminal and C-terminal cyclin-box folds it binds and activates Cdk1 (Cdc2) and also associates
  with Cdc2c (Cdk2), and a hydrophobic patch on the first cyclin box contributes to substrate recognition
  and is the binding site of the cyclin inhibitor Fruhstart. CycA is expressed in all proliferating cells;
  in interphase it is mostly cytoplasmic, kept there by nuclear export, and in some germline cells it
  is enriched on the spectrosome/fusome. It enters the nucleus around prophase and is destroyed by APC/C-dependent
  proteolysis during metaphase via a complex N-terminal degradation signal. CycA-Cdk1 drives entry into
  mitosis, acting synergistically with cyclins B and B3, and it is the only mitotic cyclin essential for
  mitosis in the embryo. Its essential mitotic role is to keep the APC/C activator Fizzy-related (Fzr/Cdh1)
  inactive in G2 so that mitotic cyclins and String/Cdc25 are not degraded prematurely, which is critical
  before terminal divisions. CycA must be degraded for sister chromatid disjunction at the metaphase-anaphase
  transition. Residual or overexpressed CycA can drive the G1/S transition, an activity restrained in
  G1 by APC/C-mediated destruction, inhibitory phosphorylation of Cdk1 and the inhibitor Roughex.'
