core_functions:
- description: Non-catalytic regulatory subunit of Cdk1 (and Cdc2c/Cdk2) that activates the kinase and
    contributes to substrate recognition through its hydrophobic patch. CycA-Cdk1 drives the G2/M transition,
    acting synergistically with cyclins B and B3. Established experimentally in Drosophila.
  molecular_function:
    id: GO:0016538
    label: cyclin-dependent protein serine/threonine kinase regulator activity
  directly_involved_in:
  - id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  supported_by:
  - reference_id: PMID:8428595
    supporting_text: cyclin A has a mitotic function and that it acts synergistically with cyclin B during
      the G2-M transition
  - reference_id: PMID:11027291
    supporting_text: Cyclin A interacts with both Cdc2 and Cdc2c, the Drosophila Cdk2 homolog
  - reference_id: PMID:17431409
    supporting_text: We propose that binding of Frs to cyclins blocks the hydrophobic patch to interfere
      with Cdk1 substrate recognition.
- description: CycA-dependent kinase activity keeps the APC/C activator Fzr/Cdh1 inactive in G2. This
    prevents premature degradation of cyclins B and B3 and String/Cdc25, and is the essential mitotic
    function of CycA in embryonic (especially terminal) divisions. Established experimentally in Drosophila.
  molecular_function:
    id: GO:0016538
    label: cyclin-dependent protein serine/threonine kinase regulator activity
  directly_involved_in:
  - id: GO:1905785
    label: negative regulation of anaphase-promoting complex-dependent catabolic process
  supported_by:
  - reference_id: PMID:15203007
    supporting_text: CycA-dependent kinase activity is required to inhibit one inhibitor of mitosis, the
      Fzr protein.
  - reference_id: PMID:16854973
    supporting_text: In the absence of Cyclin A, premature Fizzy-related/Cdh1 activity results in the
      premature degradation of the Cdk1 activators Cyclin B and Cyclin B3
suggested_questions:
- question: Should Drosophila CycA-Cdk1 be annotated to a cyclin A-CDK1 complex term? The existing GO
    complex terms (cyclin A1-CDK1, cyclin A2-CDK1, cyclin A2-CDK2) name vertebrate paralogs, and the fly
    has a single pre-duplication A-type cyclin.
- question: Is the PTN007424001 microtubule organizing center IBA, seeded only by B-type cyclins and cyclin
    F, meant to reach A-type cyclins such as Drosophila CycA?
- question: Which Fzr residues does CycA-Cdk1 phosphorylate in G2, and is this phosphorylation sufficient
    to explain the mitosis-16 requirement?
suggested_experiments:
- description: Phosphoproteomics of CycA-Cdk1 versus CycB-Cdk1 immunoprecipitates from staged embryos
    (cycle 16) to define CycA-specific substrates, including Fzr sites, and test their phospho-mutants
    for rescue of CycA-null mitosis 16.
- description: Endogenously tagged CycA live imaging in neuroblasts and syncytial embryos to test whether
    any CycA pool localizes to centrosomes/MTOCs.
