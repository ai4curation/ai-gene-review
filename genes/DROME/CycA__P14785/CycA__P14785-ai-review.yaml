    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:11369230
  qualifier: involved_in
  review:
    summary: Parry and O'Farrell expressed non-degradable cyclins in embryos and found that stable cyclin
      A blocked or prolonged sister chromatid disjunction, arresting cells in metaphase. The evidence
      shows that CycA has to be destroyed for sister separation. It does not show that CycA does part
      of the work of chromatid segregation.
    action: MODIFY
    reason: This is a gain-of-function (stabilized protein) result. It places CycA as a negative regulator
      of sister chromatid separation, whose removal is required for disjunction. It does not make CycA
      a participant in segregation itself. A regulation term describes the finding more accurately than
      the segregation process term.
    proposed_replacement_terms:
