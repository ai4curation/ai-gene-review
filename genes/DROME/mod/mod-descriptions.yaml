descriptions:
- source: UniProt
  text: Its capacity to bind DNA and protein(s), and its differential expression during
    development suggest a role in the regulation of gene expression during Drosophila
    development. It could, in interaction with other factors, be required for the
    translation of instructions provided by pattern forming genes and controls, via
    chromatin changes, the activity of genes critical for the process of morphogenesis
    of several embryonic territories.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13469
  source_id: P13469
