      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 1
    overall_notes: 'Dated and speculative: DNA and protein binding ''suggest'' a developmental
      regulatory role via chromatin. No nucleolin identity, Myc, germline or PEV roles.'
- source: Alliance_Imported
  text: modulo (mod) encodes a nucleolar protein that is required for growth of proliferative
    cells through its association with the proto-oncogene Myc. The mod protein is
    essential for transcription of spermatid-differentiation genes and for high expression
    of meiotic arrest genes. The product of mod is phosphorylated, which in turn regulates
    its localization.
  source_type: curated
  url: https://flybase.org/reports/mod.html
  source_id: FB:FBgn0002780
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: nucleolar protein required for growth via Myc, for spermatid-differentiation
      gene transcription and meiotic arrest genes, and regulated by phosphorylation.'
- source: Alliance_Automated
  text: Enables sequence-specific DNA binding activity. Predicted to be involved in
    regulation of alternative mRNA splicing, via spliceosome. Located in cytoplasm
    and nucleolus. Part of protein-containing complex. Is expressed in several structures,
    including adult heart; anterior-posterior subdivision of organism; cuboidal/columnar
    epithelium; gut section; and mitotic domain.
  source_type: automated
