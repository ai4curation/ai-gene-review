id: P13469
gene_symbol: mod
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Modulo (mod, CG2050) is the Drosophila nucleolin-like protein, a 542-residue nuclear
  phosphoprotein with an acidic, disordered N-terminal region, four RNA recognition motifs
  and a basic C-terminal tail. It binds both RNA and DNA: the central RRM region recognises a
  specific RNA motif class, while the basic terminal regions bind DNA, an interaction that is
  down-regulated by phosphorylation. The phosphorylated pool resides in the nucleolus within
  a ribonucleoprotein particle, and the unphosphorylated pool associates with condensed
  chromatin, heterochromatin and repetitive DNA; in mitosis Modulo moves to the chromosome
  periphery and cytoplasm. Modulo is a dominant suppressor of position-effect variegation, a
  direct dMyc target needed for growth of proliferating cells, and is required for embryonic
  morphogenesis, male germline transcription of spermatid-differentiation genes, neuroblast
  maintenance, piRNA-directed transposon silencing in the ovary and centromere integrity. It
  interacts with the coactivator dCBP (nejire), the CENP-A assembly factor CAL1 and Piwi.
  Null mutants are recessive lethal with melanotic tumours.
