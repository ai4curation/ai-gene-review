suggested_questions:
- question: Does Modulo bind DNA sequence-specifically (as the Sdic promoter purification suggested) or
    non-specifically (as in vitro domain mapping indicated), and is specificity conferred by partners?
- question: Which molecular step does Modulo perform in CAL1 nucleolar retention and centromeric CID maintenance,
    and in Piwi-directed H3K9me3 deposition at transposons, i.e. does it act as an RNA-binding scaffold,
    a histone chaperone like nucleolin, or indirectly through ribosome biogenesis?
- question: Is Modulo a functional nucleolin ortholog in ribosome biogenesis (pre-rRNA binding/processing),
    given the Minute-like clone phenotype and the lack of a GAR domain?
suggested_experiments:
- experiment_type: CLIP-seq / iCLIP
  description: Map direct RNA targets of Modulo in S2 cells and ovaries to test binding to pre-rRNA,
    centromeric and transposon transcripts.
- experiment_type: In vitro histone chaperone assay
  description: Test whether recombinant Modulo binds histones or CID-H4 and assists nucleosome assembly,
    as described for nucleolin.
