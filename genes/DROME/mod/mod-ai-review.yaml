- description: RRM-mediated RNA binding by the phosphorylated nucleolar pool of Modulo, as part of a
    nucleolar ribonucleoprotein particle; recognises a motif-specific RNA class and associates with
    numerous transcripts.
  molecular_function:
    id: GO:0003723
    label: RNA binding
