      sequence-/motif-specific RNA class
  - reference_id: PMID:39700092
    supporting_text: Mod targets were identified using RNA immunoprecipitation coupled to Sequencing (RiP-Seq)
- description: DNA binding by the basic terminal regions of unphosphorylated Modulo, associating with
    condensed chromatin, heterochromatin and repetitive DNA; underlies its activity as a suppressor of
    position-effect variegation.
  molecular_function:
