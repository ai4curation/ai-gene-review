- source: Alliance_Automated
  text: Enables several functions, including eukaryotic initiation factor 4E binding
    activity; protein-RNA adaptor activity; and translation repressor activity. Involved
    in several processes, including meiotic nuclear division; negative regulation
    of eukaryotic translation initiation factor 4F complex assembly; and negative
    regulation of translation. Located in several cellular components, including mitochondrial
    cloud; neuromuscular junction; and neuronal ribonucleoprotein granule. Is active
    in P-body. Colocalizes with endoplasmic reticulum exit site. Is expressed in several
    structures, including adult brain; adult brain cell body rind; adult head; germline
    cell; and gonad. Orthologous to human EIF4ENIF1 (eukaryotic translation initiation
    factor 4E nuclear import factor 1).
