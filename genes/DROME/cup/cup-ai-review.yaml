    - reference_id: PMID:16469699
      supporting_text: The eIF4E binding protein Cup interacts with Bruno and inhibits oskar translation
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1921453
  - PANTHER:PTN001283523
  review:
    summary: mRNA binding propagated by IBA across the 4E-T/Cup family.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cup associates with target mRNAs within RNPs, but recruitment is through sequence-specific
      RNA-binding partners (Bruno, Smaug) and via eIF4E at the cap. Direct, sequence-independent mRNA
      binding by Cup has not been demonstrated, so the propagated mRNA binding term overstates its molecular
      activity relative to its eIF4E-binding and repressor functions.
    supported_by:
    - reference_id: PMID:14685270
      supporting_text: Cup mediates an indirect interaction between Smaug and eIF4E
    - reference_id: PMID:14691132
      supporting_text: Thus, Cup is a translational repressor of oskar that is required to assemble the
        oskar mRNA localization machinery
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001283523
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family members associate with mRNPs, but Drosophila Cup is recruited to its targets indirectly
          through Bruno, Smaug and eIF4E; mRNP association is conflated with direct mRNA binding.
