id: Q9VMA3
gene_symbol: cup
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cup is a large germline-enriched eIF4E-binding protein of the 4E-T family that represses
  translation of localized maternal mRNAs in the Drosophila ovary and early embryo. Recruited to oskar
  mRNA by Bruno and to nanos mRNA by Smaug, Cup binds the cap-binding factor eIF4E1 through a canonical
  YXXXXL motif and a non-canonical lateral motif, displacing eIF4G and blocking 43S ribosome recruitment;
  an eIF4E-independent effector domain recruits the CCR4-NOT deadenylase and decapping activators, leaving
  targets deadenylated but protected from decay. Cup is a component of germline P bodies with Me31B and
  Tral, is required for oskar localization (recruiting Barentsz), gurken regulation and oogenesis, shuttles
  between nucleus and cytoplasm, and also acts at larval neuromuscular junctions.
existing_annotations:
- term:
    id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  evidence_type: TAS
  original_reference_id: PMID:36951092
  qualifier: involved_in
  review:
    summary: Cup is a co-repressor in the Smaug-nanos RNP that recruits CCR4-NOT and promotes deadenylation
      of target mRNAs.
    action: ACCEPT
    reason: Reconstitution and tethering studies show that Cup is part of the Smaug-dependent repressor
      complex that induces CCR4-NOT deadenylation, and that the Cup effector domain associates with CAF1-CCR4-NOT
      and promotes deadenylation of bound mRNAs. Cup therefore contributes mechanistically to poly(A)
      shortening of its targets.
    supported_by:
    - reference_id: PMID:36951092
      supporting_text: The Smaug-dependent complex represses translation of nanos and induces its deadenylation
        by the CCR4-NOT deadenylase
    - reference_id: PMID:21937713
      supporting_text: CUP maintains mRNA targets in a repressed state by promoting their deadenylation
        and protects deadenylated mRNAs from further degradation
    - reference_id: PMID:21937713
      supporting_text: This domain associates with the deadenylase complex CAF1-CCR4-NOT and decapping
        activators
