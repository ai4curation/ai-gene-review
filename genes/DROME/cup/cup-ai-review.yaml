  review:
    summary: RNA binding by Cup, attributed to the Bruno/oskar silencing study.
    action: UNDECIDED
    reason: Cup has no recognized RNA-binding domain and is recruited to oskar and nanos mRNAs by the
      RNA-binding proteins Bruno and Smaug. The cached abstract describes Cup as an eIF4E-binding protein
      that interacts with Bruno; it does not show direct RNA binding by Cup, and the full text was not
      available to check the assay behind this IDA.
