  review:
    summary: NOT annotation stating that Cup is not located in P bodies, based on GFP-Cup expressed in
      human HeLa cells.
    action: REMOVE
    reason: The negative result was obtained by heterologous expression of Drosophila Cup in HeLa cells,
      where the authors themselves attribute it to the absence of fly cofactors. In its native context
      Cup is a well-documented P-body component in Drosophila egg chambers, so the NOT statement does
      not describe Cup biology and is contradicted by several FlyBase IDA annotations.
    supported_by:
    - reference_id: PMID:24335285
      supporting_text: we observed that Drosophila Cup, which lacks these sequences, does not localize
        to P-bodies in HeLa cells
    - reference_id: PMID:24335285
      supporting_text: could simply reflect the lack of appropriate fly cofactors in mammalian cells
    - reference_id: PMID:37553798
