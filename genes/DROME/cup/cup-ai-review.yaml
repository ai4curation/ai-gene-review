- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:15465908
  qualifier: located_in
  review:
    summary: Cup can enter the nucleus.
    action: KEEP_AS_NON_CORE
    reason: Cup is a nucleocytoplasmic shuttling protein that accumulates in the nucleus when CRM1 export
      is blocked, but at steady state it is retained in the cytoplasm by eIF4E binding, where its repressor
      functions are executed. Nuclear localization is real but not the site of its core activity.
    supported_by:
    - reference_id: PMID:15465908
      supporting_text: Cup is a nucleocytoplasmic shuttling protein and that the interaction with eIF4E
        promotes retention of the Cup protein in the cytoplasm
