core_functions:
- description: Binds eIF4E1 through canonical and non-canonical eIF4E-binding motifs, displacing eIF4G
    and blocking eIF4F assembly and cap-dependent initiation on target mRNAs.
  molecular_function:
    id: GO:0008190
    label: eukaryotic initiation factor 4E binding
  directly_involved_in:
  - id: GO:0045947
    label: negative regulation of translational initiation
  - id: GO:1905536
    label: negative regulation of eukaryotic translation initiation factor 4F complex assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:14685270
    supporting_text: Cup is an eIF4E-binding protein that blocks the binding of eIF4G to eIF4E
  - reference_id: PMID:22832024
    supporting_text: Comparison with the binding mode of eIF4G to eIF4E suggests that Cup and eIF4G binding
      would be mutually exclusive at both binding sites
- description: Acts as a co-repressor recruited by Bruno and Smaug to oskar and nanos mRNAs, repressing
    their translation and promoting CCR4-NOT-dependent deadenylation while protecting the mRNAs from decapping.
  molecular_function:
    id: GO:0030371
    label: translation repressor activity
  directly_involved_in:
  - id: GO:0007319
    label: negative regulation of oskar mRNA translation
  - id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  locations:
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:14723848
    supporting_text: Cup is required to repress precocious osk translation
  - reference_id: PMID:21937713
    supporting_text: CUP maintains mRNA targets in a repressed state by promoting their deadenylation
      and protects deadenylated mRNAs from further degradation
suggested_questions:
- question: How do the eIF4E-dependent and eIF4E-independent (effector-domain) repression mechanisms of
    Cup divide the work of silencing oskar, nanos and gurken mRNAs in vivo?
- question: Does Cup nuclear shuttling have a function, for example loading Cup onto mRNPs before export,
    or is it a consequence of free Cup lacking eIF4E?
suggested_experiments:
- hypothesis: The Cup effector domain, independently of eIF4E binding, is sufficient to repress and deadenylate
    oskar mRNA in the oocyte.
  description: Express endogenous-locus Cup variants lacking the canonical and non-canonical eIF4E-binding
    motifs, or lacking the effector domain, and measure Oskar protein, oskar poly(A) tail length and P-body
    recruitment in stage 1-8 egg chambers.
  experiment_type: endogenous structure-function rescue
