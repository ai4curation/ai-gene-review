- source: Alliance_Automated
  text: Predicted to enable calcium ion binding activity. Involved in anesthesia-resistant
    memory; calcium import into the mitochondrion; and medium-term memory. Is active
    in mitochondrial intermembrane space. Is expressed in several structures, including
    adult head; anterior endoderm; anterior endoderm anlage; embryonic/larval midgut;
    and head mesoderm. Used to study myopathy with extrapyramidal signs. Human ortholog(s)
    of this gene implicated in myopathy with extrapyramidal signs. Orthologous to
    human MICU1 (mitochondrial calcium uptake 1).
