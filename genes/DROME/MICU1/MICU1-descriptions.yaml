descriptions:
- source: UniProt
  text: Calcium sensor of the mitochondrial calcium uniporter (MCU) channel, which
    senses calcium level via its EF-hand domains (PubMed:27568554). At low calcium
    levels, MICU1 occludes the pore of the MCU channel, preventing mitochondrial calcium
    uptake (By similarity). At higher calcium levels, calcium-binding to MICU1 induces
    a conformational change that weakens MCU-MICU1 interactions and moves MICU1 away
    from the pore, allowing calcium permeation through the MCU channel (By similarity).
    Also required to protect against manganese toxicity by preventing manganese uptake
    by MCU (By similarity). During development, required in alpha/beta or gamma mushroom
    body neurons to support olfactory intermediate-term memory in the adult (PubMed:27568554).
  source_type: curated
