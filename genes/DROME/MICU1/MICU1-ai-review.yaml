id: A2VEI2
gene_symbol: MICU1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MICU1 (CG4495) encodes the Drosophila ortholog of mitochondrial calcium uptake 1, an EF-hand
  calcium-sensing protein that sits in the mitochondrial intermembrane space on the outer face of the
  inner membrane and acts as the principal gatekeeper of the mitochondrial calcium uniporter. By analogy
  with the mammalian protein, MICU1 occludes the MCU pore at resting cytosolic calcium and, on calcium
  binding to its EF hands, permits rapid uptake when cytosolic calcium rises. In flies, MICU1 co-expression
  suppresses the tissue damage caused by overexpressed MCU and EMRE, its knockdown in mushroom body neurons
  lowers evoked mitochondrial calcium uptake and impairs intermediate-term and anesthesia-resistant memory,
  and MICU1 null mutants die as larvae with mitochondrial transport and ATP defects that are not rescued
  by removing MCU or EMRE, suggesting additional uniporter-independent roles.
