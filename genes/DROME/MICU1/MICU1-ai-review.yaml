suggested_questions:
- question: What uniporter-independent function of MICU1 explains the larval lethality of MICU1 null flies,
    which is not rescued by loss of MCU or EMRE?
suggested_experiments:
- description: Identify MICU1 interactors in MCU null fly mitochondria by proximity labelling, and test
    whether EF-hand mutant MICU1 rescues MICU1 null lethality.
