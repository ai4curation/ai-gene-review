suggested_questions:
- question: Does the Borr-Shrub interaction at the midbody inhibit Shrub polymerization in Drosophila
    cells, and is it required for the Aurora B abscission-delay function in germline stem cells?
- question: Is DNA binding by Borr required for CPC centromere targeting in vivo, or is targeting driven
    mainly by histone-mark recognition by Deterin?
suggested_experiments:
- hypothesis: Borr-Shrub binding is required for abscission timing.
  description: Map and mutate the Shrb-binding region of Borr, rescue borr mutants with the mutant protein,
    and assay midbody Shrb dynamics and abscission timing in S2 cells and germline stem cells.
  experiment_type: structure-function rescue
