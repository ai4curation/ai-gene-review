core_functions:
- description: Borealin subunit of the mitotic chromosomal passenger complex that binds Incenp and DNA
    and, with Deterin, targets the CPC to centromeres and then to the central spindle, required to localize
    Aurora B and Incenp to the mitotic spindle for chromosome segregation and cytokinesis.
