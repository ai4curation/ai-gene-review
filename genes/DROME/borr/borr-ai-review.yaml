gene_symbol: borr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Borealin-related (borr) encodes Drosophila Borealin, a subunit of the mitotic chromosomal
  passenger complex (CPC) with Aurora B, Incenp and Deterin (Survivin). Borr binds Incenp directly, self-associates
  and binds DNA in vitro, and with Deterin forms the localization module that targets the CPC. It is nuclear
  in interphase, associates with chromosome arms and centromeres/kinetochores from prophase to metaphase,
  then transfers to the central spindle and concentrates at the spindle midzone and midbody. Borr is needed
  to localize Aurora B and Incenp to the mitotic spindle; borr mutant cells lose histone H3 serine-10
  phosphorylation, arrest transiently in prometaphase, form multipolar spindles and become polyploid.
  Borr is present in all mitotic tissues and acts in acentrosomal female meiosis, where it supports chromatin
  recruitment of the CPC and its transfer to the central spindle, but is absent from male meiotic divisions,
  where its paralog Australin replaces it. In late cytokinesis Borr binds the ESCRT-III protein Shrub
  at the midbody.
