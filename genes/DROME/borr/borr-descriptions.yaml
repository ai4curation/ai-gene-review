    overall_notes: Correct CPC role in cohesion, kinetochore targeting and segregation.
      'No function in meiotic histone phosphorylation or spindle formation' is copied
      from the Australin finding; the review says borr mutants lose H3S10 phosphorylation.
- source: Alliance_Imported
  text: borealin-related (borr) encodes one of the three targeting subunits for the
    product of aurB in the chromosomal passenger complex. It helps to target the complex
    to the centromere region of chromosomes and the cleavage furrow during cytokinesis.
    At centromeres the complex is involved both in pausing mitotic progression when
    there are chromosome mis-attachments and in correcting those mis-attachments.
    At the cleavage furrow, the complex is involved in regulating the process of abscission
    (cell separation).
  source_type: curated
