descriptions:
- source: UniProt
  text: Component of the chromosomal passenger complex (CPC), a complex that acts
    as a key regulator of embryonic mitosis. The CPC complex has essential functions
    at the centromere for ensuring sister chromatid cohesion, recruitment of the CPC
    to kinetochores, and chromosome alignment and segregation. There is no function
    in meiotic histone phosphorylation or spindle formation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VLD6
  source_id: Q9VLD6
