    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: major rhodopsin of the largest photoreceptor class; light
      activation drives G protein signalling, TRP/TRPL opening and depolarization.
      No degeneration or rhabdomere morphogenesis role.'
- source: Alliance_Automated
  text: Enables G protein-coupled photoreceptor activity. Involved in several processes,
    including detection of light stimulus; negative regulation of compound eye retinal
    cell programmed cell death; and photoreceptor cell development. Located in early
    endosome and subrhabdomeral cisterna. Part of inaD signaling complex. Colocalizes
    with perinuclear endoplasmic reticulum. Is expressed in adult head; light-sensitive
    neurons; photoreceptor; retina; and rhabdomere. Used to study retinal degeneration;
    retinal disease; retinitis pigmentosa; and retinitis pigmentosa 4. Orthologous
    to human OPN4 (opsin 4).
  source_type: automated
  url: https://flybase.org/reports/ninaE.html
