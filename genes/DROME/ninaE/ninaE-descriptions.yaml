- source: Alliance_Imported
  text: neither inactivation nor afterpotential E (ninaE) encodes a protein that plays
    a major role in light detection and vision. It is the rhodopsin expressed in the
    largest class of photoreceptors in the adult retina. The stimulation by light
    of the product of ninaE induces G-protein signaling activation, the opening of
    the channels encoded by trp and trpl and photoreceptor cell membrane depolarization.
  source_type: curated
  url: https://flybase.org/reports/ninaE.html
  source_id: FB:FBgn0002940
  review:
