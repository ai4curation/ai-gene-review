suggested_questions:
- question: Is Rh1 a stable component of the INAD signalplex in vivo, or only transiently associated with it through
    the TRP/NORPA complex?
- question: How does Rh1 act in larval thermotaxis without light, and which chromophore state (if any) is required?
- question: Is the morphogenetic requirement for Rh1 in rhabdomere development independent of its G protein signalling
    activity?
suggested_experiments:
- experiment_type: Genetic rescue
  description: Express signalling-dead (G protein-uncoupled) Rh1 variants in ninaE-null eyes during the pupal window
    to test whether rhabdomere morphogenesis needs Rh1 signalling or only its structural presence.
- experiment_type: Proximity labelling
  description: Use rhabdomere-targeted proximity labelling in dark- and light-adapted flies to determine whether
    Rh1 is stably associated with INAD complexes.
