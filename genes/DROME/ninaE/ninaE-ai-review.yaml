core_functions:
- description: 'Light-activated G protein-coupled photoreceptor (rhodopsin) of R1-R6 photoreceptors: photoisomerisation
    of the bound chromophore converts Rh1 to metarhodopsin, which activates eye Gq and thereby NorpA PLC-beta in
    the rhabdomere membrane.'
