id: P06002
gene_symbol: ninaE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: ninaE encodes Rh1, the major rhodopsin of Drosophila, expressed in the R1-R6 outer photoreceptors of
  the compound eye. Rh1 is a class A seven-transmembrane G protein-coupled receptor whose chromophore, 3-hydroxy-11-cis
  retinal, is attached by a Schiff base to Lys319 (absorption maximum about 480 nm, with a secondary UV sensitivity).
  Photoisomerisation converts rhodopsin to metarhodopsin, which activates the eye Gq heterotrimer and thereby NorpA
  phospholipase C-beta, opening TRP/TRPL channels in the rhabdomere microvillar membrane. Metarhodopsin is inactivated
  by phosphorylation and arrestin 2 binding and is turned over by clathrin-mediated endocytosis. Rh1 is synthesised
  in the ER (requiring the cyclophilin NinaA and PAPLA1-dependent COPII export) and delivered to the rhabdomere
  by MyoV/Rab11-dependent transport. Beyond vision it is needed for rhabdomere morphogenesis during a pupal critical
  window and has a light-independent role in larval thermotaxis; misfolding or constitutively active alleles cause
  photoreceptor degeneration, modelling human retinitis pigmentosa.
