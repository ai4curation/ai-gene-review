gene_symbol: unc79
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: unc79 (CG5237, dunc79) encodes the Drosophila ortholog of UNC79, a very large cytosolic HEAT/armadillo-repeat
  accessory subunit of the NALCN-type sodium leak channel. UNC79 forms a complex with the pore subunit
  NA (narrow abdomen) and with UNC80 in the fly brain, and loss of any one of the three lowers the protein
  levels of the others by a post-transcriptional mechanism. UNC79 acts in circadian pacemaker neurons
  to promote robust circadian locomotor rhythms, with requirements beyond stabilizing NA, and unc79 mutants
  share the altered volatile-anesthetic sensitivity of na mutants.
