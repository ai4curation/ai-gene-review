    label: sodium channel activity
  evidence_type: IC
  original_reference_id: PMID:24223770
  qualifier: contributes_to
  review:
    summary: UNC79 is a non-pore accessory subunit required for the function of the NA sodium leak channel
      complex.
    action: NEW
    reason: UNC79 co-immunoprecipitates with the NA pore subunit and is required for NA channel function
      beyond maintaining NA levels; the orthologous human UNC79-UNC80 assembly docks intracellularly onto
      the NALCN-FAM155A pore and is required for channel function. Contributing to, rather than enabling,
      sodium channel activity is the correct representation for this subunit, and matches the contributes_to
      core function. The same NEW row is added for unc79 and unc80.
    supported_by:
    - reference_id: PMID:24223770
      supporting_text: These data indicate functional requirements for UNC79 and UNC80 beyond promoting
        channel subunit expression.
      reference_section_type: ABSTRACT
    - reference_id: PMID:24223770
      supporting_text: Immunoprecipitation experiments also confirm that UNC79 and UNC80 form a complex
        with NA in the Drosophila brain.
      reference_section_type: ABSTRACT
    - reference_id: PMID:34929720
      supporting_text: NALCN requires FAM155A, UNC79 and UNC80 to function
      reference_section_type: ABSTRACT
