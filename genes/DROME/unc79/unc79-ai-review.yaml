suggested_questions:
- question: Do UNC79 and UNC80 bind NA directly in flies, or does UNC80 bridge UNC79 to the pore as in
    mammalian cells?
suggested_experiments:
- description: Co-immunoprecipitate NA, UNC79 and UNC80 from heads of each single mutant to map which
    subunit pairs can associate independently.
