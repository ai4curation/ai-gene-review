- source: Alliance_Automated
  text: Predicted to enable acetyl-CoA C-acetyltransferase activity. Involved in fatty
    acid beta-oxidation. Located in mitochondrion. Is expressed in several structures,
    including adult head; adult heart; embryonic dorsal epidermis; germline cell;
    and gut section. Used to study lipid metabolism disorder; mitochondrial trifunctional
    protein deficiency; and steatotic liver disease. Human ortholog(s) of this gene
    implicated in mitochondrial metabolism disease and mitochondrial trifunctional
    protein deficiency 2. Orthologous to human HADHB (hydroxyacyl-CoA dehydrogenase
    trifunctional multienzyme complex subunit beta).
  source_type: automated
