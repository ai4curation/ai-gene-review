descriptions:
- source: Alliance_Imported
  text: Mitochondrial trifunctional protein &bgr; subunit (Mtp&bgr;) encodes a subunit
    of the mitochondrial trifunctional protein. Mtp&bgr; catalyzes the last of the
    four reactions of fatty acid beta-oxidation which consists in the thiolytic cleavage
    of 3-oxoacyl-CoA into acetyl-CoA and a fatty acyl-CoA shortened by two carbon
    atoms.
  source_type: curated
