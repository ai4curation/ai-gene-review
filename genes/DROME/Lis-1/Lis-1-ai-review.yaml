id: Q7KNS3
gene_symbol: Lis-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Lis-1 (DLis-1, CG8440) is the Drosophila ortholog of human LIS1 (PAFAH1B1), a WD40 beta-propeller protein
  with an N-terminal LisH dimerization motif that binds and regulates cytoplasmic dynein. Lis1 co-purifies with
  dynein and dynactin, promotes their association and their recruitment to cargoes such as mRNA localization complexes,
  the nuclear surface, spindle poles and kinetochores, and colocalizes with them on centrosomes, spindle and kinetochore
  microtubules and the oocyte cortex. Through dynein it drives nuclear positioning (oocyte nucleus migration that
  patterns the dorsal-ventral axis; nucleus-centrosome coupling in spermatocytes), centrosome separation and bipolar
  spindle assembly in neuroblasts, poleward stripping of checkpoint proteins from kinetochores, minus-end-directed
  mRNA transport in embryos, and axonal and dendritic transport in neurons. Loss of Lis1 is lethal and causes defects
  in germline cyst divisions, fusome integrity, oocyte determination and growth, spermatogenesis, neuroblast proliferation,
  dendrite arborization, border cell migration and germline stem cell maintenance. The fly protein is highly conserved
  with mammalian LIS1 but does not bind the Drosophila PAF-AH alpha subunit homolog.
