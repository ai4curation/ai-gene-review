core_functions:
- description: 'Lis1 binds cytoplasmic dynein and dynactin and regulates dynein: it promotes dynein-dynactin association
    and recruitment of the motor to cargoes (mRNA localization complexes, the nuclear surface, spindle poles, kinetochores),
    driving dynein-dependent nuclear positioning, centrosome separation/positioning, spindle assembly and minus-end-directed
    transport.'
