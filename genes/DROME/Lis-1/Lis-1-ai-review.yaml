suggested_questions:
- question: Is the Lis1-Mad (SMAD) interaction and BMP-signalling role in ovarian germline stem cells direct and
    conserved, or an indirect consequence of dynein-dependent trafficking of receptor/SMAD complexes?
  experts:
  - Drosophila germline stem cell biologists
  - TGF-beta/BMP signalling researchers
- question: Should LIS1 orthologs carry cytoskeletal motor activator activity (GO:0140660) rather than the regulator
    parent GO:0140659, given fly evidence that Lis1 promotes dynein-dynactin assembly and cargo recruitment?
  experts:
  - dynein motor biophysicists
  - GO molecular function editors
suggested_experiments:
- description: Test whether a dynein-binding-deficient Lis1 point mutant (e.g. at the conserved propeller-dynein
    interface) rescues oocyte nucleus migration, neuroblast spindle assembly and GSC maintenance, to separate dynein-dependent
    from putative dynein-independent (Mad-binding) functions.
