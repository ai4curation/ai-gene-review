- source: Alliance_Automated
  text: Enables dynein complex binding activity. Involved in several processes, including
    nervous system development; oogenesis; and transport along microtubule. Located
    in several cellular components, including growth cone; microtubule cytoskeleton;
    and neuronal cell body. Part of dynactin complex and dynein complex. Colocalizes
    with kinetochore; kinetochore microtubule; and spindle pole centrosome. Is expressed
    in several structures, including anterior-posterior subdivision of organism; embryonic/larval
    midgut primordium; ganglia; germline cell; and gut section. Human ortholog(s)
    of this gene implicated in lissencephaly; lissencephaly 1; and nervous system
    disease. Orthologous to human PAFAH1B1 (platelet activating factor acetylhydrolase
    1b regulatory subunit 1).
