- source: Alliance_Imported
  text: Lissencephaly-1 (Lis-1) encodes a regulator of the cytoplasmic dynein-1 motor
    complex, binding to Dynein heavy chain and regulating dynein force production,
    microtubule affinity and velocity. It is involved in the transport of many of
    dynein's cargoes, including mRNPs, mitochondria and nuclei. The Lis-1 product
    is also a non-catalytic subunit of platelet-activating factor acetylhydrolase.
  source_type: curated
  url: https://flybase.org/reports/Lis-1.html
  source_id: FB:FBgn0015754
