    summary: Conventional metalloendopeptidase activity is refuted by specific disruption of the M13 catalytic
      apparatus. Exact-sequence alignments map human H584/E585 to Nepl19 Q511/Q512, replacing a zinc ligand
      and catalytic glutamate; the downstream zinc-binding/catalytic region remains aligned. Two MAFFT
      strategies agree, and the active mouse control preserves all five sites. The published Nepl classification
      and existing NOT peptidase annotations agree with this independently reproduced sequence finding.
      This is pseudoenzyme overannotation, without a claim that the protein lacks a noncatalytic role.
    supported_by:
    - reference_id: file:DROME/Nepl19/Nepl19-bioinformatics/RESULTS.md
      supporting_text: The reference HEITH motif at 584–588 maps to QQLAH at Nepl19 511–515. Nepl19 retains
        the M13 fold and downstream ENIAD region but replaces the first zinc-binding histidine and catalytic
        glutamate with glutamines.
    - reference_id: PMID:34189422
      supporting_text: The 21 Nepl-genes encode proteins that exhibit significant similarity to neprilysins
        in their primary structure, but lack one or more of the motifs required for catalysis.
    error_type: PSEUDOENZYME_OVERANNOTATION
