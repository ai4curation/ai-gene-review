  review:
    action: MODIFY
    summary: This electronic plasma-membrane location comes from an ARBA-predicted "single-pass type
      II membrane protein" subcellular-location line. The Nepl19 sequence contradicts that prediction,
      because it has an N-terminal signal peptide and no membrane anchor.
    reason: The UniProt subcellular-location statement behind this row rests only on an ARBA rule, which
      copies the type II membrane topology of active neprilysins. The Nepl19 sequence has a SignalP
      signal peptide and no transmembrane segment, and the Drosophila Nep/Nepl survey classifies most
      Nepl proteins as secreted. The row matches the IBA row and is modified to extracellular region in
      the same way.
