  review:
    action: MODIFY
    summary: Nepl19 descends from the PAINT node PTN000199753, whose ancestral M13 proteins are type II
      membrane ectoenzymes. Nepl19 itself has a cleavable signal peptide and no transmembrane segment,
      so it has diverged from that membrane-anchored ancestral state. It is predicted to be secreted.
    reason: The PAINT placement of a plasma-membrane location at PTN000199753 is sound for the ancestral
      membrane-anchored neprilysins (MME, ECE1, KEL, PHEX donors). Nepl19, however, belongs to the
      secreted class of Drosophila Nepl proteins. Its sequence has a SignalP signal peptide at residues
      1-24 and no hydrophobic anchor, which is evidence that the inherited location has been lost in this
      lineage. The location supported for this protein is the extracellular region. No experiment has
      localized the protein, so the replacement remains a prediction and is not proposed as core.
