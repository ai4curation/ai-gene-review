- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000718
  - InterPro:IPR008753
  - InterPro:IPR018497
  review:
    action: UNDECIDED
    summary: Intrinsic conventional neprilysin catalysis is contradicted by loss of essential residues.
      Participation in proteolysis could nevertheless occur through noncatalytic peptide binding or regulation,
      but that role is not established for Nepl19. Preserve the process unresolved rather than infer either
      participation or exclusion solely from catalytic loss.
    reason: Intrinsic conventional neprilysin catalysis is contradicted by loss of essential residues.
      Participation in proteolysis could nevertheless occur through noncatalytic peptide binding or regulation,
      but that role is not established for Nepl19. Preserve the process unresolved rather than infer either
      participation or exclusion solely from catalytic loss.
    supported_by:
    - &id002
      reference_id: file:DROME/Nepl19/Nepl19-bioinformatics/RESULTS.md
      supporting_text: The reference HEITH motif at 584–588 maps to QQLAH at Nepl19 511–515. Nepl19 retains
        the M13 fold and downstream ENIAD region but replaces the first zinc-binding histidine and catalytic
        glutamate with glutamines.
    - &id003
      reference_id: PMID:34189422
      supporting_text: The 21 Nepl-genes encode proteins that exhibit significant similarity to neprilysins
        in their primary structure, but lack one or more of the motifs required for catalysis.
