taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nepl19 (CG14523) is a neprilysin-like protein of the M13 metallopeptidase family in Drosophila
  melanogaster. Its gene is one of five tandemly duplicated Nepl genes (Nepl17-Nepl21) at cytological band
  98F1, and it belongs to the insect-specific PANTHER subfamily PTHR11733:SF238. The 671-residue protein
  has an N-terminal signal peptide and no transmembrane anchor, so it is predicted to be secreted. It keeps
  the M13 N-terminal and C-terminal peptidase domains and the downstream ENIAD zinc-ligand motif. In the
  HExxH motif, however, both the first zinc-binding histidine and the catalytic glutamate are replaced by
  glutamine (QQLAH), so Nepl19 is predicted to be a non-catalytic pseudopeptidase. Its closest tandem
  paralogs keep an intact HExxH motif, which places the loss in the Nepl19 lineage. The gene is
  transcribed, but no experimental study of the protein exists. Any ligand, binding partner or
  physiological role is unknown. Binding and sequestering neuropeptides that active neprilysins would
  otherwise cleave has been proposed for secreted Nepl proteins in general, but this has not been tested
  for Nepl19.
