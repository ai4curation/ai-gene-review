knowledge_gaps:
- gap_statement: It is not known whether Nepl19 binds any peptide or protein ligand, and its molecular
    activity is therefore undetermined. The protein is predicted to be non-catalytic, and no binding
    partner, ligand or activity has been identified.
  boundary: Nepl19 is a transcribed M13-family protein that is predicted to be secreted. It keeps the
    M13 fold and the ENIAD motif, but the HExxH zinc ligand and catalytic glutamate are replaced by
    glutamine, so it is predicted to lack peptidase activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Express the secreted protein, test it for binding to neuropeptides that are known
    neprilysin substrates, and study loss-of-function phenotypes.
  provenance:
  - reference_id: PMID:34189422
    supporting_text: One function of the secreted Nepl proteins may be to bind and sequester peptide targets
      of the catalytically active neprilysins.
suggested_questions:
- question: Does secreted Nepl19 bind neuropeptides that are cleaved by the active neprilysins (Nep2,
    Nep4) and thereby sequester or protect them? In which tissue would this happen?
- question: Did the HExxH loss in Nepl19, which is absent from its intact 98F1 tandem paralogs, follow a
    shift to a binding-only role, and is the motif loss conserved in Nepl19 orthologs of other Drosophila
    species?
suggested_experiments:
- description: Express epitope-tagged Nepl19 in S2 cells or in vivo and confirm that it is secreted and
    not retained at the membrane, for example by western blot of conditioned medium against cell lysate.
- description: Assay recombinant Nepl19 for hydrolysis of standard neprilysin peptide substrates, with
    Nep2 as a positive control and Nepl19 in which Q511 and Q512 are reverted to H and E. This would test
    whether the motif substitutions alone account for the predicted loss of activity.
- description: Make a Nepl19-specific loss-of-function allele, which is difficult because of the 98F1
    tandem paralogs, and profile its phenotypes in tissues where Nepl19 is expressed, including the
    spermatheca.
