  review:
    action: ACCEPT
    summary: This NOT peptidase activity assertion is accepted. FlyBase made it from the Drosophila
      Nep/Nepl motif survey, which classifies Nepl19 among the Nepl genes that lack catalytic motifs.
      The survey's conclusion matches the exact-sequence finding that HExxH has become QQLAH.
    reason: The cited survey checked every fly M13 protein for the HExxH, ENIAD, CxxW and NAY/FY motifs
      and placed Nepl19 in the motif-deficient Nepl class. The independent alignment reproduces the
      missing zinc ligand and catalytic glutamate. This is the same claim as the GO_REF:0000047 IKR row,
      and both are accepted.
