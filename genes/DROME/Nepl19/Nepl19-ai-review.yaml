  label: Drosophila melanogaster
description: Nepl19 is a secreted neprilysin-like M13-family protein. It retains the peptidase-like architecture
  but replaces essential residues in the conserved catalytic zinc-binding motif, supporting a noncatalytic
  pseudopeptidase identity. Its physiological ligand and biological role remain unknown; peptide binding
  or modulation of extracellular peptide availability are possibilities rather than established functions.
