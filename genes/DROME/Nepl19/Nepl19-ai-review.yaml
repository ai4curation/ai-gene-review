- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000718
  - InterPro:IPR008753
  - InterPro:IPR018497
  review:
    action: REMOVE
    summary: InterPro2GO assigns proteolysis to every protein that matches the M13 peptidase family and
      domain signatures. Nepl19 matches those signatures only because it keeps the M13 fold. It has lost
      the first zinc ligand and the catalytic glutamate of HExxH, and it carries a NOT peptidase activity
      annotation (IKR) that this review accepts.
    reason: Under GO, a gene product is involved in proteolysis only if it does some of the work, normally
      by hydrolysing the peptide bond. Here the term was inferred from a domain signature alone, and the
      catalytic residues that signature normally implies are missing (H584 and E585 of human neprilysin
      map to Q511 and Q512). Nepl19 has no known substrate, no known partner protease and no known
      regulatory activity that could support participation by another route. Keeping a positive
      proteolysis assertion next to the accepted NOT peptidase activity rows would contradict them. This
      is an electronic mapping that fails for a pseudoenzyme, so the row is removed. If a role in a
      neprilysin-regulated process is ever shown, for example by peptide sequestration, it would need its
      own experimental annotation.
    supported_by:
    - &id002
      reference_id: file:DROME/Nepl19/Nepl19-bioinformatics/RESULTS.md
      supporting_text: The reference HEITH motif at 584–588 maps to QQLAH at Nepl19 511–515. Nepl19 retains
        the M13 fold and downstream ENIAD region but replaces the first zinc-binding histidine and catalytic
        glutamate with glutamines.
    - &id003
      reference_id: PMID:34189422
      supporting_text: The 21 Nepl-genes encode proteins that exhibit significant similarity to neprilysins
        in their primary structure, but lack one or more of the motifs required for catalysis.
- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IKR
  original_reference_id: GO_REF:0000047
  qualifier: enables
  supporting_entities:
  - MEROPS:M13.UNW
  negated: true
  review:
    action: ACCEPT
    summary: This NOT peptidase activity assertion is accepted. In the exact Q9VAS1 sequence, the first
      zinc-binding histidine and the catalytic glutamate of the HExxH motif are replaced by glutamines.
      Two independent alignment strategies place these substitutions consistently, and an active mouse
      neprilysin control keeps all of the sites.
    reason: The IKR rests on loss of key residues, and the exact-sequence alignments confirm that loss.
      The re-review subfamily alignment shows that Nepl19's closest tandem paralogs (Nepl17, Nepl18,
      Nepl20, Nepl21) keep HExxH, so the loss belongs to Nepl19 and is not an artefact of family-level
      transfer. Mutagenesis of neprilysin metal ligands is known to abolish catalysis. No experimental
      peptidase assay exists for Nepl19, but the residue evidence is strong and consistent with the
      published classification of Nepl proteins as motif-deficient.
    supported_by:
    - *id002
    - *id003
    - &id005
      reference_id: file:DROME/Nepl19/Nepl19-bioinformatics/RESULTS-rereview.md
      supporting_text: Within the 98F1 cluster, only Nepl19 has lost the HExxH zinc ligand and catalytic
        glutamate.
