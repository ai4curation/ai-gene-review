descriptions:
- source: Alliance_Imported
  text: rough deal (rod) encodes the major subunit of the Rod-Zw10-Zwilch (RZZ) complex.
    RZZ is an essential component of the outer kinetochore during mitosis. RZZ helps
    monitor and correct kinetochore-microtubule attachments during prometaphase, and
    consequently it regulates mitotic progression.
  source_type: curated
  url: https://flybase.org/reports/rod.html
