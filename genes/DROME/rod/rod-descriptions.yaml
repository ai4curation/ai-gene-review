      recruitment not named.'
- source: Alliance_Automated
  text: Enables small GTPase binding activity. Involved in several processes, including
    mitotic sister chromatid segregation; mitotic spindle assembly checkpoint signaling;
    and protein localization to kinetochore. Located in Golgi apparatus; kinetochore;
    and spindle. Part of RZZ complex. Is expressed in larval brain and spermatocyte.
    Used to study cancer. Orthologous to human KNTC1 (kinetochore associated 1).
