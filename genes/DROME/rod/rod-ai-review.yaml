core_functions:
- description: As the scaffold subunit of RZZ at the kinetochore corona, Rod contributes to recruitment
    of Spindly-dynein- dynactin and Mad1-Mad2 to unattached kinetochores, enabling spindle assembly checkpoint
    signalling and accurate chromosome segregation.
  contributes_to_molecular_function:
    id: GO:0140483
    label: kinetochore adaptor activity
  directly_involved_in:
  - id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  - id: GO:0034501
    label: protein localization to kinetochore
  locations:
  - id: GO:0000776
    label: kinetochore
  in_complex:
    id: GO:1990423
    label: RZZ complex
  supported_by:
  - reference_id: PMID:15886105
    supporting_text: Rod/Zw10 thus contributes to checkpoint activation by promoting Mad2 recruitment
      and to checkpoint inactivation by recruiting dynein/dynactin
  - reference_id: PMID:10523511
    supporting_text: necessary for the recruitment of two known kinetochore components, Zw10 and cytoplasmic
      dynein
