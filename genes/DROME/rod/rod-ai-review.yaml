id: Q9V9W7
gene_symbol: rod
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: rod (Rough deal) encodes the largest subunit of the Rod-Zw10-Zwilch (RZZ) complex, a ~2,100-residue
  KNTC1/ROD-family protein with N-terminal beta-propeller and extended alpha-solenoid regions. Rod is
  recruited to unattached kinetochores in prometaphase as part of the fibrous corona, where RZZ recruits
  Spindly-dynein-dynactin and Mad1-Mad2, enabling spindle assembly checkpoint signalling and accurate
  sister chromatid segregation; after microtubule attachment Rod streams off kinetochores along kinetochore
  microtubules and exchanges rapidly with a cytosolic pool, contributing to checkpoint silencing. rod
  mutants missegregate chromosomes and fail to arrest after spindle damage. Rod is also concentrated at
  the Golgi in spermatocytes and is needed for normal Golgi morphology, and binds GTP-bound Rab18 with
  Zw10.
