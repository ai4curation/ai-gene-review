    overall_notes: 'Transferred from human TDRD3: spliceosome assembly, histone H3R17me2a/H4R3me2a
      reading, stress granules with G3BP1. None of these appear in the review, which
      describes a Top3beta scaffold linking it to FMRP and RISC.'
- source: Alliance_Automated
  text: Enables protein-macromolecule adaptor activity; single-stranded DNA binding
