gene_symbol: Tdrd3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tdrd3 (CG13472, dTDRD3) encodes the Drosophila ortholog of Tudor domain-containing protein
  3, a non-catalytic scaffold and nucleic-acid-binding cofactor of the RNA/DNA topoisomerase Top3beta.
  Its RMI1-like OB fold, through an insertion loop, binds Top3beta and its Tudor region associates with
  FMRP (Fmr1), so it links Top3beta to FMRP, AGO2 and p68 in the RNA-induced silencing complex. Purified
  Tdrd3 binds single-stranded DNA and RNA in preference to duplexes. It stimulates Top3beta relaxation
  of hypernegatively supercoiled DNA and Top3beta-mediated annealing of RNA circles. Tdrd3 is mainly cytoplasmic.
  It co-sediments with polyribosomes, where it retains Top3beta, and in ovarian germ cells it is enriched
  in perinuclear nuage. The Top3beta-Tdrd3 complex is implicated in RNAi-dependent heterochromatin silencing,
  translation of neuronal mRNAs and germline piRNA biology.
