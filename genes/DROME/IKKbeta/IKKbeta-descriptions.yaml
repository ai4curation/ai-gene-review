    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct on Relish activation, antibacterial and antiviral immunity,
      but says IKKbeta phosphorylates and degrades Cactus. The review places Relish
      S528/S529 as the substrate and says IKKbeta is not needed for Toll-pathway Dif
      and Dorsal activation.
- source: Alliance_Imported
  text: I-kappaB kinase &bgr; (IKK&bgr;) encodes a a component of the I&kgr;B Kinase
    (IKK) complex together with the product of key. IKK complex participates in the
    activation of the transcription factor encoded by Rel in the immune deficiency
    pathway. This pathway regulates the antibacterial response and other less characterized
    cellular processes.
  source_type: curated
  url: https://flybase.org/reports/IKKβ.html
  source_id: FB:FBgn0024222
  review:
