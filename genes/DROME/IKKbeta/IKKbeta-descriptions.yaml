      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: IKK complex with Kenny activating Relish in the Imd pathway
      for antibacterial defence. Typo ''a a''.'
- source: Alliance_Automated
  text: Enables identical protein binding activity and protein serine/threonine kinase
    activity. Involved in several processes, including cellular response to hypoxia;
    positive regulation of canonical NF-kappaB signal transduction; and regulation
    of defense response. Located in cytoplasm. Is expressed in adult Malpighian tubule;
    fat body/gonad primordium; germline cell; gonad; and primordial germ cell. Human
    ortholog(s) of this gene implicated in several diseases, including combined immunodeficiency
    (multiple); fetal encasement syndrome; popliteal pterygium syndrome; prostate
    cancer (multiple); and type 2 diabetes mellitus. Orthologous to human CHUK (component
    of inhibitor of nuclear factor kappa B kinase complex) and IKBKB (inhibitor of
    nuclear factor kappa B kinase subunit beta).
