- term:
    id: GO:0030163
    label: protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:11018014
  qualifier: involved_in
  review:
    summary: Annotation based on IKK requirement for signal-dependent Relish cleavage.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IKK complex is required for endoproteolytic processing of Relish, which is executed by
      the caspase Dredd, and IKK contributes noncatalytically to that cleavage (PMID:19497884). Relish
      processing is activation by limited proteolysis rather than protein catabolism, and IKKbeta does
      not perform the proteolysis; protein catabolic process overstates and misdescribes IKKbeta's role.
    supported_by:
    - reference_id: PMID:11018014
      supporting_text: We show that this complex is required for the signal-dependent cleavage of Relish
    - reference_id: PMID:19497884
      supporting_text: IKK functions noncatalytically to support Dredd-mediated cleavage of Relish
- term:
