  - UniProtKB:O14920
  - UniProtKB:O15111
  review:
    summary: IBA transfer of TNF-mediated signaling pathway from mammalian IKKs.
    action: MARK_AS_OVER_ANNOTATED
    reason: In mammals IKKs act downstream of TNF receptors, but in Drosophila the TNF ortholog Eiger
      signals mainly through JNK, and IKKbeta acts in the Imd (PGRP) pathway, which is only TNFR-like
      by analogy. The fly-specific terms (peptidoglycan recognition protein signaling pathway, cGAS/STING
      signaling) describe its pathway roles; the TNF-mediated pathway term is not supported for the fly
      protein.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000540281
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Vertebrate IKKalpha/IKKbeta (human O14920, O15111; mouse Chuk) act downstream of TNF
          receptors, but the fly ortholog acts in the TNFR-like Imd/PGRP pathway rather than in Eiger/TNF
          signalling.
