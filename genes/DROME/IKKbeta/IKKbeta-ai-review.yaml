id: Q9VEZ5
gene_symbol: IKKbeta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: IKKbeta (ird5/DLAK) is the catalytic subunit of the Drosophila IkappaB kinase (IKK) complex,
  a cytoplasmic serine/threonine protein kinase that partners with the regulatory subunit Kenny (IKKgamma/NEMO
  ortholog). Activated downstream of TAK1 in the Imd pathway, it phosphorylates the NF-kappaB precursor
  Relish on serines 528/529, a modification needed for RNA polymerase II recruitment to antimicrobial
  peptide promoters, and it additionally supports Dredd-mediated endoproteolytic cleavage of Relish in
  a kinase-independent manner. IKKbeta is required for the antibacterial humoral immune response against
  Gram-negative bacteria but not for Toll-pathway activation of Dif and Dorsal. It also acts downstream
  of dSTING in an NF-kappaB-dependent antiviral pathway and contributes to hypoxia-induced NF-kappaB activation.
