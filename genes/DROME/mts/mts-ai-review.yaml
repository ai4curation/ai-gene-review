suggested_questions:
- question: Which PP2A holoenzyme (Tws, Wdb or Wrd) mediates the opposite-sign effects of Mts on Hedgehog
    signaling (Smo dephosphorylation restricting signaling versus Ci dephosphorylation promoting it)?
suggested_experiments:
- hypothesis: Distinct Mts holoenzymes mediate the opposing effects of PP2A on Hh signaling.
  description: In wing discs, compare Smo and Ci phosphorylation and Hh target expression after clonal
    depletion of tws, wdb or wrd individually, alongside mts and Pp2A-29B controls.
  experiment_type: clonal RNAi with phospho-specific readouts
