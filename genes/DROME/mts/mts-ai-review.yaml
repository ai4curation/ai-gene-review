    label: metaphase/anaphase transition of mitotic cell cycle
  - id: GO:0007099
    label: centriole replication
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:9004035
    supporting_text: have reduced levels of PP2A mRNA and reduced PP2A catalytic activity against four
      different substrates compared to wild type
- description: Catalytic subunit of the STRIPAK PP2A complex that keeps the Hippo kinase dephosphorylated
    and inactive, promoting Yorkie activity.
  molecular_function:
