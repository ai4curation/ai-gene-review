id: P23696
gene_symbol: mts
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'microtubule star (mts) encodes the catalytic C subunit of Drosophila protein phosphatase
  2A (PP2A), a serine/threonine protein phosphatase. Mts forms a core dimer with the PR65/A scaffold Pp2A-29B
  and joins one of several regulatory subunits: the B55 subunit Twins, the B56 subunits Widerborst and
  Well rounded, or the striatin Cka within the STRIPAK complex. It is also recruited, with Pp2A-29B, to
  the Integrator complex (INTAC), where it dephosphorylates the RNA polymerase II C-terminal domain and
  Spt5 at promoter-proximal pauses to restrain productive elongation. Mts is essential for mitosis: hypomorphic
  mts embryos arrest between prophase and anaphase with over-condensed chromatin and supernumerary centrosomes,
  and depletion causes monoastral spindles; PP2A-Tws stabilizes Plk4 for centriole duplication. Through
  its different holoenzymes Mts restrains Hippo kinase (STRIPAK), opposes Aurora B in oocyte meiosis,
  maintains meiotic cohesion (B56), regulates aPKC-dependent neuroblast polarity and self-renewal, insulin/Akt
  signaling, Hedgehog, Wingless and Ras/MAPK signaling, and photoreceptor signaling via INAD dephosphorylation.'
