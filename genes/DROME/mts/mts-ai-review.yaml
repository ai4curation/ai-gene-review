core_functions:
- description: Catalytic subunit of PP2A holoenzymes (with the Pp2A-29B scaffold and a Tws, Wdb or Wrd
    regulatory subunit) that dephosphorylates Cdk1 and other mitotic-kinase substrates to control mitotic
    progression, spindle assembly and centriole duplication.
