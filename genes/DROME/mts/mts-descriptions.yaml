- source: Alliance_Automated
  text: Enables RNA polymerase II CTD heptapeptide repeat phosphatase activity and
    phosphatase regulator activity. Involved in several processes, including generation
    of neurons; membraneless organelle assembly; and regulation of signal transduction.
    Located in cytoplasm. Part of FAR/SIP/STRIPAK complex; INTAC complex; and protein
    phosphatase type 2A complex. Is active in chromatin and nucleus. Colocalizes with
    centriole. Is expressed in several structures, including adult brain cell body
    rind; adult head; brain; female germline cell; and midgut. Orthologous to human
    PPP2CA (protein phosphatase 2 catalytic subunit alpha) and PPP2CB (protein phosphatase
    2 catalytic subunit beta).
