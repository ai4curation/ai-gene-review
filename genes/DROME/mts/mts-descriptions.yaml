descriptions:
- source: UniProt
  text: 'Catalytic subunit of protein phosphatase 2A (PP2A), a serine/threonine phosphatase
    involved in the regulation of a wide variety of enzymes, signal transduction pathways,
    and cellular events (By similarity). PP2A is the major phosphatase for microtubule-
    associated proteins (MAPs) (By similarity). Key mediator of a quality checkpoint
    during transcription elongation as part of the Integrator- PP2A (INTAC) complex
    (PubMed:32966759). The INTAC complex drives premature transcription termination
    of transcripts that are unfavorably configured for transcriptional elongation:
    within the INTAC complex, mts/PP2A catalyzes dephosphorylation of the C-terminal
    domain (CTD) of Pol II subunit POLR2A/RPB1 and Spt5, thereby preventing transcriptional
    elongation (PubMed:32966759, PubMed:37995689).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23696
