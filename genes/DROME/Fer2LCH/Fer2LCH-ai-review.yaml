gene_symbol: Fer2LCH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Fer2LCH encodes the light-chain homolog (L subunit) of Drosophila secreted ferritin and is
  the predominant ferritin subunit at all life stages. Twelve Fer2LCH and twelve Fer1HCH subunits assemble
  in the secretory pathway into a 24-mer iron-storage cage that is loaded with iron in the Golgi and secreted
  into hemolymph; the L subunits supply nucleation sites for the ferrihydrite iron core, whereas the H
  subunits provide the ferroxidase center. Ferritin is required in midgut enterocytes for dietary iron
  absorption, exporting iron toward the hemolymph, and in other tissues for sequestering and detoxifying
  excess iron, and Fer2LCH mutants die during embryogenesis.
