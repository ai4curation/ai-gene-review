suggested_questions:
- question: Why does fly secreted ferritin maintain a strict 1:1 H:L ratio when Fer2LCH mRNA lacks an
    IRE, and what post-transcriptional mechanism enforces it?
suggested_experiments:
- hypothesis: Fer2LCH nucleation residues are required for iron loading but not for cage assembly or secretion.
  description: Rescue Fer2LCH mutants with transgenes mutating the predicted interior acidic nucleation
    residues and measure holoferritin iron content, secretion and viability.
