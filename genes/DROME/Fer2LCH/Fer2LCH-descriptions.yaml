- source: Alliance_Imported
  text: Ferritin 2 light chain homologue (Fer2LCH) encodes one of two subunits of
    the major iron storage complex, the ferritin molecule. In insects, ferritin is
    assembled from 12 Fer1HCH and 12 Fer2LCH subunits and can be found in the secretory
    pathway of cells and in hemolymph. The product of Fer2LCH provides iron nucleation
    sites in the internal cavity of the complex required for iron mineralization and
    is essential for embryogenesis.
  source_type: curated
