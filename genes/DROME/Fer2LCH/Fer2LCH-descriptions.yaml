  text: Enables ferrous iron binding activity. Involved in detoxification of iron
    ion and iron ion import across plasma membrane. Located in Golgi apparatus and
    extracellular region. Part of ferritin complex. Is expressed in several structures,
    including adult brain cell body rind; anterior-posterior subdivision of organism;
    circulatory system primordium; embryonic/larval hemocyte; and epithelium.
