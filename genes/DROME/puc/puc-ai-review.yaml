core_functions:
- description: JNK-specific dual-specificity MAP kinase phosphatase that dephosphorylates and inactivates
    the JNK Basket; as an immediate-early JNK target gene product it closes a negative feedback loop that
    limits JNK signalling in morphogenesis, apoptosis and stress responses.
  molecular_function:
    id: GO:0008579
    label: JUN kinase phosphatase activity
  directly_involved_in:
