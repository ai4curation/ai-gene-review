- term:
    id: GO:0017017
    label: MAP kinase tyrosine/serine/threonine phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000191382
  - MGI:MGI:2387107
  - PANTHER:PTN002562845
  - SGD:S000001375
  - UniProtKB:Q16828
  - UniProtKB:Q16829
  - WB:WBGene00006923
  review:
    summary: MAP kinase tyrosine/serine/threonine phosphatase activity inherited from PTN002562845 (Eukaryota),
      seeded by MKPs from yeast to human.
    action: ACCEPT
    reason: 'IBA verdict: inherited. The node unites the VH1-type MAP kinase phosphatases (fungal Msg5/Pmp1
      relatives, worm VHP-1, human DUSP6/7, mouse DUSP16 among the seeds); puc sits inside it in the DUSP10
      clade, with an intact catalytic motif and no recorded loss. Fly evidence that the inherited activity
      is retained is strong: puc mutants hyperactivate DJNK, Puc is JNK-specific among fly MAPKs, and
      Puc down-regulates Bsk by dephosphorylation. JNK is a MAP kinase, so this term is correct; the more
      exact GO:0008579 JUN kinase phosphatase activity is asserted from the fly paper. (In the current
      ontology GO:0008579 is not placed under GO:0033549 MAP kinase phosphatase activity, which is why
      this IBA is not covered by the IMP row.)'
    supported_by:
    - reference_id: PMID:9472024
      supporting_text: We show that puckered mutations result in the hyperactivation of DJNK, and that
        overexpression of puc mimics basket mutant phenotypes.
    - reference_id: PMID:16079158
      supporting_text: Puckered (Puc), the sole Drosophila Jun N-terminal kinase (JNK)-specific MKP
    - reference_id: PMID:22266315
      supporting_text: In Drosophila, Puckered has been identified as a DUSP, exhibiting specificity towards
        the c-Jun-N-terminal kinase (JNK).
    - reference_id: PMID:34830088
      supporting_text: puc is an immediate-early gene responding to JNK activity, that encodes a dual-specificity
        MAPK phosphatase that acts to down-regulate DJNK/Bsk activity through dephosphorylation
- term:
    id: GO:0030036
    label: actin cytoskeleton organization
  evidence_type: IMP
  original_reference_id: PMID:9472024
  qualifier: involved_in
  review:
    summary: 'Actin cytoskeleton organization: puc mutants have cytoskeletal defects in dorsal closure.'
    action: KEEP_AS_NON_CORE
    reason: The leading-edge actin defects of puc mutants are a downstream consequence of unrestrained
      JNK signalling; Puc does not act on actin. Puc restrains JNK activity, and this phenotype is one
      of many JNK-dependent processes in which puc mutants or Puc overexpression have been scored. The
      experimental annotation stands, but the process is a context in which the core JNK-phosphatase function
      is required, not a separate function of Puc.
    supported_by:
    - reference_id: PMID:9472024
      supporting_text: Mutations in this gene lead to cytoskeletal defects that result in a failure in
        dorsal closure related to those associated with mutations in basket, the Drosophila JNK homolog.
