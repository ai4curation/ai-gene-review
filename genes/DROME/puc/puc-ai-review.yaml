    supporting_text: The latter is mediated by a subset of phosphatases with dual specificity (VH-1 family).
      Here, we describe a new member of this family encoded by the puckered gene of Drosophila.
  - reference_id: PMID:9472024
    supporting_text: We show that puckered mutations result in the hyperactivation of DJNK, and that overexpression
      of puc mimics basket mutant phenotypes.
