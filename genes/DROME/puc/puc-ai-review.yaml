      supporting_text: The latter is mediated by a subset of phosphatases with dual specificity (VH-1
        family). Here, we describe a new member of this family encoded by the puckered gene of Drosophila.
    - reference_id: PMID:22266315
      supporting_text: Dual-Specificity Phosphatases (DUSPs) are enzymes that remove phosphate groups
        from both phospho-tyrosine and phospho-serine/threonine residues.
