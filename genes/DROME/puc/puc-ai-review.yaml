    label: negative regulation of tumor necrosis factor-mediated signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:12894227
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0033483
  review:
    summary: 'Negative regulation of TNF-mediated signaling: Puc suppresses Eiger-induced phenotypes.'
    action: KEEP_AS_NON_CORE
    reason: Puc expression suppresses the cell death and tissue phenotypes induced by Eiger/TNF, which
      signals through Grindelwald/Wengen to JNK. Puc acts on JNK, the effector arm of the pathway, so
      it negatively regulates the output of TNF signalling; in these papers Puc is used mainly as a tool
      to block JNK. Kept as non-core.
    supported_by:
    - reference_id: PMID:12894227
      supporting_text: Forced expression of Eiger-L, Eiger-s or Wengen, caused apoptotic cell death which
        could be rescued by caspase inhibitors or the JNK phosphatase Puckered.
