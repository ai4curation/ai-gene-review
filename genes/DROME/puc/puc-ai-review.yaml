  review:
    summary: MAP kinase tyrosine phosphatase activity inherited from PTN002562845, seeded by fly Mkp3,
      fission yeast Pmp1 and a budding yeast MKP.
    action: KEEP_AS_NON_CORE
    reason: 'IBA verdict: inherited, but as a partial description. puc is inside the node and a dual-specificity
      MKP does hydrolyse the phosphotyrosine of the MAPK activation loop, so the term is not wrong. It
      names only the tyrosine half of the reaction; the Puc activity is better stated by GO:0017017 and
