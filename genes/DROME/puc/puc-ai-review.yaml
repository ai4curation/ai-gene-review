suggested_questions:
- question: Does Puc dephosphorylate p38 as well as Basket in vivo? Puc binds and is phosphorylated by
    p38, and its vertebrate ortholog DUSP10 acts on both p38 and JNK.
- question: Where is endogenous Puc in the cell (cytoplasm, nucleus, or both), and is the ER/Golgi localization
    attributed to the Bard et al. secretion screen reproducible?
- question: GO:0008579 JUN kinase phosphatase activity is placed under protein tyrosine/serine/threonine
    phosphatase activity but not under GO:0033549 MAP kinase phosphatase activity, although JNK is a MAP
    kinase. Should it be a child of GO:0017017 MAP kinase tyrosine/serine/threonine phosphatase activity?
- question: Does the basic N-terminal stretch of Puc (around residues 51-63) act as a kinase interaction
    motif that docks Basket, as in vertebrate MKPs?
suggested_experiments:
- description: Dephosphorylate doubly phosphorylated Basket in vitro with recombinant Puc and the catalytic
    C216S mutant, and read the threonine and tyrosine sites separately with phospho-specific antibodies
    or mass spectrometry, to establish residue specificity.
- description: Tag endogenous puc by CRISPR knock-in and image the protein in leading-edge and wound-edge
    cells, with ER, Golgi and nuclear markers, to settle its subcellular localization.
