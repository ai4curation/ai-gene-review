id: Q9VHV8
gene_symbol: puc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'puckered (puc) encodes the only JNK-specific MAP kinase phosphatase of Drosophila, a VH1-family
  dual-specificity (tyrosine/threonine) phosphatase orthologous to vertebrate DUSP10/MKP-5. It has a single
  dual-specificity phosphatase domain with the catalytic cysteine (Cys216) flanked by long disordered
  regions. puc is an immediate-early target of JNK/AP-1 signalling, and Puc dephosphorylates and inactivates
  the JNK Basket, so it forms a negative feedback loop that limits the strength and duration of JNK signalling;
  Puc does not affect ERK signalling. Puc is itself phosphorylated by JNK and p38 and is turned over by
  the ubiquitin-proteasome system. Through this feedback, puc is required wherever JNK activity must be
  kept in check: dorsal closure and the differentiation of the dorsal epidermis, imaginal disc eversion
  and thorax closure, wound healing, follicle cell and dorsal appendage morphogenesis, the left-right
  looping of the embryonic gut and the rotation of the male genitalia. Loss of Puc in epithelia raises
  basal JNK activity and causes apoptosis, while puc expression is widely used as a reporter of JNK activity.
  Reduced puc dosage increases oxidative-stress tolerance, pathogen resistance and lifespan. The protein
  is presumed cytoplasmic like its substrate; its subcellular localization has not been determined directly.'
