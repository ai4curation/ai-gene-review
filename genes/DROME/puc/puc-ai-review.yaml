      and regulates the JNK pathway) is correct and traced to PMID:9472024. The enzyme class is wrong:
      Puc is a VH1-family dual-specificity (tyrosine/threonine) MAP kinase phosphatase of the protein
      tyrosine phosphatase superfamily, not a serine/threonine protein phosphatase. The text also omits
      the JNK specificity and the gene''s main developmental roles.'
