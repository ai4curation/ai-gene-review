descriptions:
- source: Alliance_Imported
  text: puckered (puc) encodes a serine/threonine protein phosphatase that mediates a feedback
    loop that regulates the Jun-N-terminal kinase pathway.
  source_type: curated
  url: https://flybase.org/reports/puc.html
  source_id: FB:FBgn0243512
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: 'The feedback loop on the JNK pathway is correct and is the gene''s defining
      role. The enzyme class is wrong: Puc is a VH1-family dual-specificity (tyrosine/threonine)
      MAP kinase phosphatase, not a serine/threonine protein phosphatase. Omits JNK specificity,
      the DUSP10 orthology and the developmental and apoptotic roles.'
- source: Alliance_Automated
  text: Enables JUN kinase phosphatase activity. Involved in several processes, including egg
    chorion assembly; imaginal disc morphogenesis; and negative regulation of signal transduction.
    Located in Golgi apparatus and endoplasmic reticulum. Is expressed in several structures,
    including amnioserosa; anterior-posterior compartment boundary of the genital disc; cuboidal/columnar
    epithelium; epithelial cell; and imaginal disc. Used to study carcinoma. Orthologous to
    human DUSP10 (dual specificity phosphatase 10).
  source_type: automated
  url: https://flybase.org/reports/puc.html
  source_id: FB:FBgn0243512
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: JUN kinase phosphatase activity and the DUSP10 orthology are correct, and
      egg chorion assembly and imaginal disc morphogenesis are real JNK-dependent contexts.
      The Golgi and ER locations come from a secretion screen the review could not verify (puc
      is a class D gene there) and are unlikely for a soluble cytoplasmic phosphatase. 'Negative
      regulation of signal transduction' is vaguer than the JNK feedback role, and the expression
      list adds little.
