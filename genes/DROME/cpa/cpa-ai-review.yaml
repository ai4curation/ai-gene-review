core_functions:
- description: Cpa, as the alpha subunit of the obligate alpha/beta capping protein heterodimer, binds
    actin filament barbed ends and blocks monomer addition and loss, limiting F-actin accumulation in
    the cortex, lamellipodia, filopodia and muscle Z-discs.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
