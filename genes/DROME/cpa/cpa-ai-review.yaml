  - *id010
suggested_questions:
- question: Is the requirement for capping protein specifically in Vestigial-expressing wing blade cells
    due to a distinct cortical actin architecture there, or to a non-capping function of Cpa?
suggested_experiments:
- hypothesis: The wing-blade-specific extrusion of cpa mutant cells requires loss of barbed-end capping
    rather than another Cpa function.
  description: Rescue cpa mutant clones with wild-type Cpa or a Cpa actin-binding (C-terminal tentacle)
    mutant that still heterodimerises with Cpb, and score cell extrusion, F-actin levels and JNK activity.
