gene_symbol: cpa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: cpa (scorched) encodes the alpha subunit of Drosophila capping protein, the CapZ-family alpha/beta
  heterodimer that binds the barbed ends of actin filaments and blocks addition and loss of actin monomers.
  The two subunits are mutually dependent for stability, and the heterodimer limits F-actin accumulation
  throughout development. Loss of cpa causes F-actin accumulation, extrusion and apoptosis of wing blade
  cells and late degeneration of eye tissue, and capping protein is needed for lamellipodium formation,
  filopodium regulation, oocyte determination and nurse cell integrity. Through its control of F-actin,
  capping protein restrains Src/JNK signaling and Yorkie-driven growth. Capping protein also caps the
  Arp1 filament of dynactin, associates with the WASH machinery, and localises to muscle Z-discs.
