- source: Alliance_Automated
  text: Enables protein heterodimerization activity. Involved in several processes,
    including barbed-end actin filament capping; germarium-derived oocyte fate determination;
    and regulation of plasma membrane bounded cell projection assembly. Located in
    apical plasma membrane. Part of F-actin capping protein complex. Is active in
    Z disc. Colocalizes with adherens junction. Is expressed in adult head; adult
    heart; and embryonic/larval midgut. Used to study developmental disorder of mental
    health.
  source_type: automated
