- source: Alliance_Imported
  text: capping protein alpha (cpa) encodes an actin-binding protein that, along with
    the product of cpb, binds to the fast growing ends of actin filaments to restrict
    the addition or loss of actin monomers. It limits the nuclear translocation of
    the Hippo pathway mediator encoded by yki and restricts JNK signaling. It maintains
    epithelial integrity and controls the balance between proliferation and apoptosis
    in the wing imaginal disc. It plays important roles during oogenesis, as well
    as maintaining neuronal homeostasis.
  source_type: curated
  url: https://flybase.org/reports/cpa.html
