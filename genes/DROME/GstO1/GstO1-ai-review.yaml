  review:
    summary: GstO1 binds the BMP ligand Gbb in larval muscle and is required and sufficient for Gbb S-glutathionylation
      at Cys354/Cys420; no Gbb-SSG is detected in GstO1 nulls and overexpression increases it.
    action: NEW
    reason: 'GstO1 is the proposed enzyme performing the modification step (a GSH-binding Omega GST that
      physically associates with its substrate), not merely a required upstream factor; Grx1 acts as the
      opposing deglutathionylase. The comparator check is satisfied: the paralog GstO2 is annotated to
      protein glutathionylation for ATP synthase beta. A cell-free assay with recombinant GstO1 was not
      reported, so the evidence code is IMP rather than IDA.'
