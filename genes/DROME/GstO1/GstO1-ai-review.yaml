        GstO1 was overexpressed in postsynaptic muscles compared with WT (Fig. 6 A).
    - &id008
      reference_id: PMID:37389657
      supporting_text: In third-instar muscles, Gbb was co-IPed with Flag-tagged endogenous GstO1 by anti-Flag
        but was absent in mouse IgG IPed controls
    - reference_id: PMID:37389657
