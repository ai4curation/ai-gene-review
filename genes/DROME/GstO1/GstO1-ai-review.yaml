suggested_questions:
- question: Should GstO1 be annotated to negative regulation of BMP signaling pathway or negative regulation
    of synapse growth at the neuromuscular junction, given that it acts on the BMP ligand Gbb itself (glutathionylation
    leading to degradation) rather than on the signalling machinery?
- question: Is the in vitro DHAR and thiol transferase activity of GstO1 comparable to GstO2B, and which
    of the four Drosophila Omega GSTs carries most DHAR flux in ovary and testis where GstO1 is reported
    to be highly expressed?
- question: Does Kim et al. 2012 (PMID:22219196) need a FlyBase/UniProt synonym note, since its "DmGSTO1"
    (CG6673/GstO2) is easily confused with FlyBase GstO1 (CG6662), and GstO1 UniProt synonyms also list
    DmGSTO1?
suggested_experiments:
- description: Incubate purified recombinant GstO1, a C30A active-site mutant and the Gbb C-terminal fragment
    with GSH (with or without GSSG) and measure Gbb-SSG formation at Cys354/Cys420 by LC-MS/MS.
  hypothesis: GstO1 directly catalyses Gbb S-glutathionylation via its active-site Cys30.
- description: Fractionate larval muscle and use protease protection with ER-luminal and cytosolic markers
    to determine whether GstO1 faces the cytosol or the ER lumen.
  hypothesis: GstO1 is a peripheral protein on the cytosolic face of ER and endosomal membranes.
