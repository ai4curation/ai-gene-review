gene_symbol: GstO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: GstO1 (CG6662) is one of four Omega-class cytosolic glutathione S-transferases encoded in
  a cluster on chromosome 3L of Drosophila melanogaster, alongside sepia, GstO2 and GstO3. It has the
  thioredoxin-like GST N-terminal domain with the Omega-class N-terminal extension and an active-site
  cysteine (Cys30, CPYA motif), and an all-alpha GST C-terminal domain. Like other Omega GSTs, recombinant
  GstO1 has glutathione-dependent thiol transferase and dehydroascorbate reductase activities and only
  weak activity toward 1-chloro-2,4-dinitrobenzene, and unlike its paralog sepia it lacks pyrimidodiazepine
  synthase activity. In larval body-wall muscle GstO1 associates with ER and early/recycling endosome
  membranes, binds the BMP ligand Glass bottom boat (Gbb) and promotes S-glutathionylation of Gbb at Cys354
  and Cys420, which favours Ctrip-dependent ubiquitination and proteasomal degradation of Gbb; loss of
  GstO1 raises Gbb levels and BMP signalling and causes neuromuscular junction overgrowth. Loss-of-function
  flies are also hypersensitive to hydrogen peroxide and to ethanol sedation, with neuronal GstO1 required
  for both responses. Note that the name DmGSTO1 used in some earlier work (e.g. Kim et al. 2012) refers
  to CG6673, now GstO2.
