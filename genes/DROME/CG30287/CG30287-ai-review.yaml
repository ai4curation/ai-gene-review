  label: Drosophila melanogaster
description: CG30287 (also called SP224, and historically SPH37) encodes a predicted secreted serine endopeptidase
  of the S1A (trypsin/chymotrypsin) family. The 284-residue protein has an N-terminal signal peptide,
  a 20-residue propeptide with no clip domain, and a single Peptidase S1 domain. That domain has an intact
  His82-Asp136-Ser232 catalytic triad and a candidate activation cleavage site after Arg41. It belongs
  to an insect-specific PANTHER subfamily (PTHR24256:SF553) of uncharacterized Drosophila paralogs that
  includes Jon99Ciii and CG4914. Its substrate specificity, activating protease, tissue of action and
  biological role have not been studied.
