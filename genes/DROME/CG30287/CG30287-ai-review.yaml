suggested_questions:
- question: Is CG30287 catalytically active after cleavage at Arg41, given its atypical VINGK mature N-terminus,
    and what is its P1 specificity?
- question: Do the nine Drosophila PTHR24256:SF553 paralogs, which include Jon99Ciii, form a gut-expressed
    digestive cluster, or are they secreted into hemolymph?
suggested_experiments:
- description: Express recombinant pro-CG30287, activate it with trypsin or enteropeptidase at Arg41,
    and profile its specificity with a positional-scanning fluorogenic peptide library. Use an S232A mutant
    as the inactive control.
- description: Test labelling of the endogenous protein by a fluorophosphonate activity-based probe in
    adult tissues, and map tissue expression with an endogenously tagged allele.
