    action: ACCEPT
    summary: Inherited serine-type endopeptidase activity is consistent with the sequence and the PAINT
      tree.
    reason: The IBD sits at the deep node PTN001207268. Easter (FBgn0000533) is among its donors. PAINT
      curators carved out the lineages that lost the catalytic triad with NOT|GO:0004252 IKR nodes, and
      none of them is an ancestor of CG30287 in the PANTHER 19.0 tree. The exact sequence keeps His82,
      Asp136 and Ser232 in a canonical GDSGGP motif, so the "SPH37" name (serine protease homolog) does
      not indicate a loss of catalysis. No activity has been measured.
