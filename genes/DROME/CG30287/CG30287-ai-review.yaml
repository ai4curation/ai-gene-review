description: CG30287 is a predicted secreted S1-family serine endopeptidase with an intact annotated catalytic
  triad. The 284-residue product is also called SP224 and historically SPH37, but the latter name alone
  does not establish catalytic inactivity. Its physiological substrates and relationship to vertebrate
  PRSS55 remain unresolved.
