- source: Alliance_Automated
  text: Enables L-malate dehydrogenase (NAD+) activity. Involved in malate metabolic
    process and oxaloacetate metabolic process. Located in cytosol. Is expressed in
    adult head and adult heart. Human ortholog(s) of this gene implicated in developmental
    and epileptic encephalopathy 88. Orthologous to human MDH1 (malate dehydrogenase
    1).
