- source: Alliance_Imported
  text: Malate dehydrogenase 1 (Mdh1) encodes a cytosolic enzyme that reversibly catalyzes
    the oxidation of S-malate to oxaloacetate using the reduction of NAD+ to NADH.
    It is involved in gluconeogenesis and the malate-aspartate shuttle.
