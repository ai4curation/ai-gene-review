- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000600336
  - UniProtKB:P9WK13
  review:
    summary: Tricarboxylic acid cycle, phylogenetic inference from the MDH family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TCA cycle runs in the mitochondrial matrix, where it uses the mitochondrial MDH (Mdh2).
      Mdh1 is the cytoplasmic isozyme; it catalyses the same chemistry but in the cytosol, where it serves
      the malate-aspartate shuttle and pyruvate-malate cycling rather than the TCA cycle. The IBA reflects
      a deep node shared with TCA-cycle MDHs; for the cytosolic member the process assignment is an over-propagation.
    supported_by:
    - reference_id: PMID:19033156
      supporting_text: This observation strongly suggests the operation of pyruvate-malate and, in particular,
        pyruvate-citrate cycling in adaptation to alcohol exposure.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000600336
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral MDH node covering both mitochondrial (TCA-cycle) and cytosolic malate dehydrogenases;
          the TCA-cycle role holds for the mitochondrial descendants but not for the cytosolic Mdh1, whose
          matrix counterpart is Mdh2.
