suggested_questions:
- question: How do partial versus complete losses of Mdh1 produce opposite effects on ethanol tolerance,
    and which cycle (pyruvate-malate or pyruvate-citrate) mediates this?
suggested_experiments:
- description: Use 13C-glucose tracing in Mdh1 null and hypomorphic adults to quantify flux through the
    malate-aspartate shuttle and pyruvate-citrate cycling.
