gene_symbol: Mdh1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mdh1 (CG5362) encodes the cytoplasmic NAD-dependent malate dehydrogenase of Drosophila melanogaster,
  a member of the LDH/MDH superfamily (MDH type 2 family) that reversibly oxidises L-malate to oxaloacetate
  with NAD+. Working with cytosolic aspartate aminotransferase (Got1) and their mitochondrial counterparts
  it forms the cytosolic arm of the malate-aspartate shuttle, reducing oxaloacetate to malate to carry
  glycolytic NADH equivalents into mitochondria, and it participates in pyruvate-malate and pyruvate-citrate
  cycling between mitochondria and cytosol. Natural allozymes and induced null alleles have been characterised
  biochemically; Mdh1 nulls are viable but have reduced adult ethanol tolerance, whereas partial reductions
  of cytosolic MDH activity can increase tolerance.
