- source: Alliance_Automated
  text: Predicted to enable protein-membrane adaptor activity. Involved in nuclear
    migration. Located in nuclear envelope; nuclear periphery; and perinuclear region
    of cytoplasm. Is expressed in several structures, including Malpighian tubule
    primordium; adult head; adult heart; embryonic/larval midgut primordium; and gut
    section. Orthologous to human SUN1 (Sad1 and UNC84 domain containing 1) and SUN2
    (Sad1 and UNC84 domain containing 2).
