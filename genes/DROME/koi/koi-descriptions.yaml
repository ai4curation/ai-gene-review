- source: UniProt
  text: Component of the LINC (LInker of Nucleoskeleton and Cytoskeleton) complex
    involved in the connection between the nuclear lamina and the cytoskeleton (By
    similarity). Is required to nuclear migration in eye and to anchor klar in the
    nuclear membrane (PubMed:18820457).
