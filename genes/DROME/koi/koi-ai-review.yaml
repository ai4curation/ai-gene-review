  review:
    summary: Meiotic nuclear membrane microtubule tethering complex (PAINT).
    action: MODIFY
    reason: Koi is a SUN component of LINC complexes, but its documented roles (eye-disc nuclear migration
      with Klar, myonuclear positioning with Klar/Msp300) are somatic; there is no evidence for a meiotic
      role of Koi in Drosophila. Following the convention of the human SUN1/SUN2 reviews and the LINC
      module, the somatic parent GO:0106094 nuclear membrane microtubule tethering complex better reflects
      the inherited complex membership; the Koi-Klar complex links the NE to microtubules.
