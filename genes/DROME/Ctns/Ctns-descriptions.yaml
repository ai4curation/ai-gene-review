- source: Alliance_Automated
  text: Enables L-cystine transmembrane transporter activity. Involved in L-cystine
    transmembrane transport from lysosomal lumen to cytosol. Located in lysosomal
    membrane. Is expressed in several structures, including anterior-posterior subdivision
    of organism; embryonic central brain neurons; embryonic head sensory system; embryonic
    hindgut; and embryonic precursor of adult hindgut. Human ortholog(s) of this gene
    implicated in cystinosis; eye disease; and nephrotic syndrome. Orthologous to
    human CTNS (cystinosin, lysosomal cystine transporter).
