descriptions:
- source: UniProt
  text: Cystine/H(+) symporter that mediates export of cystine, the oxidized dimer
    of cysteine, from lysosomes (PubMed:35175796). Involved in cysteine homeostasis
    during periods of fasting, which indirectly regulates mTORC1-mediated signaling
    by supporting de novo CoA synthesis, the TCA cycle and amino acid metabolism during
    periods of food shortage (PubMed:35175796). Important for maintaining autophagy,
    and for development and survival during periods of fasting (PubMed:35175796).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VCR7
  source_id: Q9VCR7
