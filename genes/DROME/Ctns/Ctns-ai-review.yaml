id: Q9VCR7
gene_symbol: Ctns
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ctns encodes cystinosin, a lysosomal membrane transporter that exports cystine for cytosolic
  cysteine metabolism. In the Drosophila fat body, lysosomal cystine mobilization during fasting supports
  metabolic adaptation and modulates TORC1 reactivation and autophagy. Loss of Ctns causes cystine accumulation
  and heightened starvation sensitivity.
