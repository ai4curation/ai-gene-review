id: Q9VCR7
gene_symbol: Ctns
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ctns (CG17119) encodes Drosophila cystinosin (dCTNS), a seven-transmembrane PQ-loop protein
  of the lysosomal membrane and the fly member of the cystinosin subfamily that includes human CTNS and
  yeast ERS1. It exports cystine, the disulfide-linked dimer of cysteine, from the lysosomal lumen to the
  cytosol; by analogy with human cystinosin this efflux is proton-coupled. In the larval fat body, cystine
  released from lysosomes during fasting replenishes cytosolic cysteine, which feeds coenzyme A synthesis
  and acetyl-CoA, the TCA cycle and other amino acid metabolism. Loss of Ctns causes cystine accumulation,
  lower cysteine levels during fasting, increased TORC1 reactivation with failure to maintain autophagy,
  developmental delay on a low-protein diet and reduced survival under starvation; these effects on TORC1
  signalling and growth are downstream consequences of the transport activity.
