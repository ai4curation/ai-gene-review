- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity; DNA binding activity; and catalytic
    activity, acting on DNA. Involved in several processes, including oogenesis; regulation
    of double-strand break repair via homologous recombination; and specification
    of axis polarity. Predicted to be located in cytoplasm and nucleus. Predicted
    to be active in condensed nuclear chromosome. Is expressed in anterior midgut
    primordium; central brain primordium; embryonic brain; embryonic/larval midgut;
    and posterior midgut primordium. Human ortholog(s) of this gene implicated in
    Fanconi anemia complementation group R; breast cancer; mirror movements 2; and
    ovarian cancer. Orthologous to human RAD51 (RAD51 recombinase).
