      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Strand exchange, DNA binding and ATPase (by similarity) are right.
      The egg-axis text presents Gurken and oocyte positioning defects as direct roles,
      which the review treats as secondary to the meiotic checkpoint.
- source: Alliance_Imported
  text: spindle A (spn-A) encodes a protein that forms a filament on single-stranded
    DNA, does a homology search of double-stranded DNA, and catalyzes strand exchange,
    swapping the single-strand DNA in and displacing the partner of the complementary
    strand.
  source_type: curated
  url: https://flybase.org/reports/spn-A.html
