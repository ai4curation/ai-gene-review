descriptions:
- source: UniProt
  text: Plays an important role in homologous strand exchange, a key step in DNA repair
    through homologous recombination (HR) (By similarity). Binds to single and double-stranded
    DNA and exhibits DNA- dependent ATPase activity. Underwinds duplex DNA (By similarity).
    Spindle genes are required for each of the symmetry-breaking steps that generate
    polarity during egg axis formation; oocyte positioning at the posterior of the
    cyst to generate the first AP polarity and inhibition of gurken (grk) signaling
    to the follicle cell layer to polarize first the AP axis and then DV axis. May
    have a role in female meiosis (PubMed:8625736, PubMed:9362456).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q27297
  source_id: Q27297
  review:
    reviewer: AI
