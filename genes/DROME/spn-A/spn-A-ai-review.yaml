id: Q27297
gene_symbol: spn-A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: spn-A (spindle-A) encodes Drosophila Rad51 (DmRad51), the RecA-family recombinase of the
  RAD51 subfamily. SPN-A forms ATP-dependent nucleoprotein filaments on resected single-stranded DNA and
  catalyses homology search, DNA strand invasion and strand exchange with a homologous duplex, working
  with the Rad54 motor protein Okra (strand pairing is stimulated on chromatin) and loaded with the help
  of DmBRCA2. In the nucleus it is recruited to DNA double-strand break sites, a step that requires the
  exosome ribonuclease Rrp6. In vivo it is required for gene-conversion and synthesis-dependent strand
  annealing repair of double-strand breaks and gaps in somatic and germline cells, and for repair of Mei-W68
  (Spo11)-induced meiotic breaks in oocytes. Null mutants are viable but sensitive to ionizing radiation;
  mutant females are sterile because persistent meiotic breaks activate a Chk2-dependent meiotic recombination
  checkpoint that secondarily disrupts Gurken signalling, oocyte selection and egg axis polarity (the
  'spindle' eggshell phenotype). Strand exchange by SPN-A also generates recombination intermediates that
  must be processed by DmBLM or the structure-selective nucleases MUS81, GEN and MUS312-SLX1.
