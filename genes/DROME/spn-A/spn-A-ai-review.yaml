suggested_questions:
- question: In the absence of a Drosophila Dmc1, does SPN-A itself catalyse interhomolog strand exchange
    for meiotic crossovers, or is this shared with or delegated to the Rad51 paralogs spn-B and spn-D?
    Do spn-A nulls reduce crossover frequency?
- question: Should the GO:0010569 (regulation of DSB repair via HR) IMP row from PMID:24368780 be repointed
    by FlyBase to GO:0000724, since Rad51 executes rather than regulates HR?
- question: Is the InterPro2GO mapping of the RecA ATP-binding domain (IPR020588) to GO:0140664 ATP-dependent
    DNA damage sensor activity appropriate for RAD51-subfamily recombinases?
suggested_experiments:
- experiment_type: Genetic recombination mapping
  hypothesis: SPN-A is required for meiotic crossover formation in oocytes.
  description: Measure X-chromosome and 2L crossover frequencies and nondisjunction in spn-A null females
    in a chk2 background (to bypass checkpoint-mediated sterility), compared with spn-B and spn-D.
- experiment_type: Cytology / ChIP
  hypothesis: SPN-A localises to meiotic DSB sites on oocyte chromatin.
  description: Immunostain SPN-A (or tagged knock-in) with gamma-His2Av and C(3)G in germarium region
    2A/2B and test dependence on mei-W68 and DmBRCA2.
