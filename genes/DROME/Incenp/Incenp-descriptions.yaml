descriptions:
- source: Alliance_Imported
  text: Inner centromere protein (Incenp) encodes a component of the chromosomal passenger
    complex, acting as a subunit that targets and activates the product of aurB. It
    controls different processes during cell division, including regulation of chromosome
    structure, kinetochore-microtubule error correction, chromosome segregation and
    cytokinesis.
  source_type: curated
  url: https://flybase.org/reports/Incenp.html
  source_id: FB:FBgn0260991
