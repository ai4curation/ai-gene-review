      score: 4
    overall_notes: 'Correct and compact: CPC subunit that targets and activates Aurora
      B, controlling chromosome structure, error correction, segregation and cytokinesis.
      Omits the meiotic roles (MEI-S332, female spindle assembly).'
- source: Alliance_Automated
  text: Enables microtubule binding activity. Involved in several processes, including
    chromosome organization; metaphase chromosome alignment; and spindle assembly.
    Located in kinetochore; meiotic spindle midzone; and mitotic spindle midzone.
    Part of chromosome passenger complex. Colocalizes with condensed chromosome and
    midbody. Orthologous to human INCENP (inner centromere protein).
  source_type: automated
  url: https://flybase.org/reports/Incenp.html
  source_id: FB:FBgn0260991
