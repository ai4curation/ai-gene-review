taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Incenp (inner centromere protein) is the scaffold subunit of the Drosophila chromosomal passenger
  complex (CPC). Its N-terminal region binds the Survivin/Deterin and Borealin (mitosis) or Australin
  (male meiosis) localization subunits, and its conserved C-terminal IN-box binds and activates the Aurora
  B kinase, so that Incenp both stimulates Aurora B and targets it to its substrates. With the CPC, Incenp
  concentrates on chromatin and centromeres from prophase to metaphase, then transfers to the spindle
  midzone in anaphase and to the midbody in telophase. Incenp is required for histone H3 serine-10 phosphorylation,
  chromosome condensation and segregation, central spindle organization and cytokinesis in mitosis; in
  male meiosis it binds the Shugoshin MEI-S332 and is needed for its centromeric localization and for
  sister chromatid cohesion; in acentrosomal female meiosis it drives chromosome-mediated spindle microtubule
  assembly and stabilizes the spindle equator together with the kinesin-6 Subito. Null mutants are polyploid
  and show defective asymmetric segregation of Prospero in neuroblasts.
