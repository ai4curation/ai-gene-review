suggested_questions:
- question: Does the Drosophila Incenp IN-box activate Aurora B by the same TSS-motif phosphorylation
    feedback described for vertebrate INCENP, and does it differ between the mitotic Borr-containing and
    the meiotic Aust-containing CPC?
- question: How does Incenp promote chromosome-driven spindle microtubule assembly in oocytes independently
    of its Subito-dependent role at the spindle equator?
suggested_experiments:
- hypothesis: The Incenp IN-box is required and sufficient for Aurora B activation in flies.
  description: Rescue incenp null embryos or oocytes with IN-box point mutants (TSS motif and Aurora B
    contact residues) and measure Aurora B autophosphorylation, H3S10 phosphorylation and spindle assembly.
  experiment_type: genetic rescue with structure-function mutants
