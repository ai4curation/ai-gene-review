- source: Alliance_Automated
  text: Enables RNA 7-methylguanosine cap binding activity; cap-dependent translation
    initiation factor activity; and eukaryotic initiation factor 4G binding activity.
    Involved in RNA metabolic process and cytoplasmic translational initiation. Located
    in cytosol; neuronal ribonucleoprotein granule; and nuclear body. Part of eukaryotic
    translation initiation factor 4F complex. Is active in P-body and muscle cell
    postsynaptic specialization. Is expressed in several structures, including embryonic/larval
    midgut primordium; germline cell; gonad; gut section; and somatic cell of testis.
    Human ortholog(s) of this gene implicated in autistic disorder. Orthologous to
    human EIF4E (eukaryotic translation initiation factor 4E) and EIF4E1B (eukaryotic
    translation initiation factor 4E family member 1B).
