descriptions:
- source: UniProt
  text: Recognizes and binds the 7-methylguanosine (m7G)-containing mRNA cap during
    an early step in the initiation of protein synthesis and facilitates ribosome
    binding by inducing the unwinding of the mRNAs secondary structures (PubMed:8663200).
    In 0-1 hour embryos, forms a complex with me31B, cup, tral and pAbp which binds
    to various mRNAs including maternal mRNAs, and down-regulates their expression
    during the maternal-to-zygotic transition (PubMed:28875934).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48598
