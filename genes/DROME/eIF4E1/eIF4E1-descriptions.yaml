- source: Alliance_Imported
  text: eukaryotic translation initiation factor 4E1 (eIF4E1) encodes a component
    of the eIF4F cap-binding complex that is essential for cap-dependent translation
    of mRNA. The product of eIF4E1 binds the 7-methyl-guanosine cap structure of mRNA.
