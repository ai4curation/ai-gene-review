id: P48598
gene_symbol: eIF4E1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: eIF4E1 is the canonical, ubiquitously expressed Drosophila cap-binding translation initiation
  factor. It binds the 7-methylguanosine cap of mRNAs and, through a dorsal binding surface, eIF4G1, assembling
  the eIF4F complex with eIF4A to recruit the 43S preinitiation complex in cap-dependent cytoplasmic translation
  initiation. eIF4E1 is the major cap-binding isoform in embryos and is the target of eIF4E-binding repressors
  including Thor (4E-BP), Cup, 4E-T and Me31B, which compete with eIF4G and sequester eIF4E1 with repressed
  maternal mRNAs in P bodies. It also accumulates postsynaptically at the larval neuromuscular junction.
