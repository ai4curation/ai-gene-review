  - UniProtKB:Q14573
  review:
    summary: Direct Ca2+ binding at the regulatory sites of the IP3 receptor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD at PTN001010185 (the IP3 receptor clade, Eumetazoa) is seeded by rat Itpr2/Itpr3 and by
      human ITPR3, whose Ca2+-bound cryo-EM structures resolve Ca2+ sites in the cytoplasmic region. IP3
      receptors have no EF-hands; Ca2+ binds as a co-agonist that regulates gating biphasically. The fly
      channel is regulated by Ca2+ in bilayers, and a coupling-domain mutation changes that regulation,
      so the fly receptor is inside the clade that inherited the property and nothing suggests loss. Direct
      binding has not been measured on the fly protein. Ca2+ binding is a regulatory property of the channel,
      not a separate function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:15189860
      supporting_text: wc703 channels have increased sensitivity to modulation by Ca(2+)
    - reference_id: PMID:15189860
      supporting_text: >-
