suggested_questions:
- question: >-
    Does the fly IP3 receptor have a functional plasma-membrane or secretory-vesicle pool in any cell
    type, or is it confined to the ER, as all fly localization data so far suggest?
- question: >-
    Which Ca2+ sites seen in mammalian IP3 receptor structures are conserved in the fly receptor, and
    does the wc703 coupling-domain mutation act on one of them?
- question: >-
    Should PAINT repoint the GO:0035091 phosphatidylinositol binding IBD at PTN001010185 to GO:0070679,
    given that its seeds are IP3-binding studies?
- question: >-
    Is the receptor in the sarcoplasmic reticulum of larval body-wall or adult flight muscle, and does
    muscle IP3R contribute to excitation-contraction or only to mitochondrial Ca2+ loading?
suggested_experiments:
- description: >-
    Express an endogenously tagged Itpr (CRISPR knock-in) and co-stain with ER, sarcoplasmic reticulum
    (for example SERCA) and plasma-membrane markers in muscle, neurons and the prothoracic gland, with
    surface biotinylation to test for a plasma-membrane pool.
- description: >-
    Measure 45Ca2+ or fluorescent Ca2+ binding to the purified fly cytoplasmic region and test mutants
    of residues aligned with the mammalian Ca2+ sites in bilayer recordings.
- description: >-
    Test binding of PI(4,5)P2 and other phosphoinositides to the purified fly receptor in liposome flotation
    assays, alongside IP3 displacement.
