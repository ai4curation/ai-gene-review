- term:
    id: GO:0000280
    label: nuclear division
  evidence_type: IDA
  original_reference_id: PMID:16216922
  qualifier: involved_in
  review:
    summary: >-
      IP3-dependent Ca2+ release is needed for the syncytial nuclear divisions of the early embryo.
    action: KEEP_AS_NON_CORE
    reason: >-
      In syncytial embryos, injected IP3 releases Ca2+ through the receptor, and an IP3 sponge or heparin
      blocks nuclear division. The perturbation is of IP3 and of IP3 binding, so the receptor is the inferred
      target (the fly has only one IP3 receptor), and Ca2+ release is a regulatory input to mitosis rather
      than part of the division machinery. Kept as a non-core developmental role.
    supported_by:
    - reference_id: PMID:16216922
      supporting_text: >-
        Fig. 3 A shows that InsP3 receptors are functional in early embryos; the microinjection of InsP3
        leads to calcium release.
    - reference_id: PMID:16216922
      supporting_text: Constructs that chelate InsP3 also prevent nuclear division.
