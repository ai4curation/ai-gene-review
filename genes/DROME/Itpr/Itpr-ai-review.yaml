- id: file:DROME/Itpr/Itpr-uniprot.txt
  title: UniProtKB P29993 (ITPR_DROME) Swiss-Prot record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Reviewed Swiss-Prot record. The receptor, ER-mitochondria Ca2+ transfer (PMID:28726639) and ethanol
      tolerance (PMID:29444420) sentences, the ER membrane location, the domain description and the muscle
      RNAi disruption phenotype agree with the cited papers. The sentence on visual and olfactory transduction
      and myoblast proliferation is outdated for vision: three studies show phototransduction without
      the receptor. The myoblast clause rests on antibody staining in a later paper (PMID:7556937), not
      on the cited PMID:1322910. The topology features label the luminal loops "Extracellular", which
      for an ER channel should be the ER lumen.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P29993
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: >-
        May be involved in visual and olfactory transduction, and myoblast proliferation (PubMed:1322910).
      confidence: CONFIRMED
      explanation: >-
        The visual-transduction clause repeats an expression-based suggestion from the 1992 cloning paper.
        Mosaic eyes lacking the receptor transduce light normally (PMID:9208856, PMID:10833300), and a
        re-examination with itpr-null mosaics and RNAi found no effect on photoreceptor responses or Ca2+
        signals (PMID:28660247), so vision should be dropped from the sentence. The myoblast clause is
        also only a suggestion from expression, and comes from Raghu and Hasan 1995 (PMID:7556937), not
        from PMID:1322910, whose abstract mentions muscle-rich tissue but not myoblasts. Suggested text:
        drop visual transduction; if the myoblast clause is kept, cite PMID:7556937 and keep it hedged.
      supported_by:
      - reference_id: PMID:9208856
        supporting_text: >-
          demonstrate that phototransduction, a model PLC pathway thought to require InsP3R, does not
          require InsP3R for signaling.
      - reference_id: PMID:10833300
        supporting_text: >-
          These results indicate that InsP(3)R-mediated store depletion does not underlie TRP and TRPL
          activation in Drosophila photoreceptors.
      - reference_id: PMID:28660247
        supporting_text: >-
          we found no effect of IP3R RNAi or mutation on photoreceptor responses or Ca2+ signals, indicating
          that the IP3R plays little or no role in Drosophila phototransduction.
      - reference_id: PMID:7556937
        supporting_text: >-
          Our results suggest that in Drosophila the IP3 signalling pathway is used during muscle development,
          primarily when myoblasts undergo rapid multiplication, in both embryos and pupae.
