  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Every claim was traced. Intracellular ligand-gated Ca2+ channel: PMID:1322910 (IP3 binding) and
      PMID:15189860 (bilayer recordings). Downstream of Gq/PLCbeta-coupled GPCRs: PMID:22928859 (GBP-PLC
      in S3 cells) and PMID:26544939 (Gq and PLC knockdown in the prothoracic gland). Ecdysone release:
      PMID:26544939. Nutritional stress and lipid metabolism: PMID:23471909 and PMID:29017032. Flight:
      PMID:15356199 and PMID:16899722. Nothing is wrong. The text omits the ER location, the larval feeding
      and growth requirement, and the finding that the receptor is not needed for phototransduction. "1,4,5,-trisphosphate"
      has a stray comma.
