core_functions:
- description: >-
    IP3-gated Ca2+ release channel of the ER membrane: IP3 produced by PLC downstream of Gq-coupled receptors
    binds the N-terminal ligand-binding region and opens the tetrameric channel, with cytosolic Ca2+ as
    co-regulator, releasing Ca2+ from the ER store into the cytosol.
