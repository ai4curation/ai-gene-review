- term:
    id: GO:0035091
    label: phosphatidylinositol binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96623
  - MGI:MGI:96624
  - MGI:MGI:99418
  - PANTHER:PTN001010185
  review:
    summary: Phosphatidylinositol (lipid) binding, propagated from IP3-binding seed annotations.
    action: MODIFY
    reason: >-
      GO:0035091 is binding of inositol-containing glycerophospholipids. The receptor's ligand is the
      soluble head-group product inositol 1,4,5-trisphosphate (GO:0070679), which is not a phospholipid
      and is not under GO:0035091 in GO. The IBD at PTN001010185 is seeded only by mouse Itpr1/Itpr2/Itpr3;
      their IDA rows cite IP3-binding studies (by title: isoform-specific IP3-binding affinity, mutational
      analysis of the IP3 binding site) and an mRNA isoform study, none about phosphoinositide lipids.
      The inherited ligand claim is IP3 binding, which this row's seeds and the fly's own cloning study
      support and which the gene already carries. No study tests lipid binding by the fly receptor. Hence
      MODIFY to the correct ligand rather than REMOVE.
    proposed_replacement_terms:
    - id: GO:0070679
      label: inositol 1,4,5 trisphosphate binding
    supported_by:
    - reference_id: PMID:1322910
      supporting_text: >-
        The polypeptide encoded by the cDNA was functionally expressed and showed characteristic InsP3-binding
        activity.
    - reference_id: file:DROME/Itpr/Itpr-notes.md
      supporting_text: none tests binding of a phosphoinositide lipid to the fly receptor
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: PANTHER:PTN001010185
        source_label: IP3 receptor clade (Eumetazoa)
        source_status: SOURCE_BAD
        comment: Seeds are mouse IDA rows from IP3-binding papers annotated to the phospholipid term.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001010185
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0035091
      corrected_value: GO:0070679
      corrected_label: inositol 1,4,5 trisphosphate binding
      cause: LABEL_WITHOUT_DEFINITION
      confidence: PROBABLE
      explanation: >-
        The IBD of GO:0035091 phosphatidylinositol binding at PTN001010185 (IP3 receptor clade) is seeded
        by mouse Itpr1, Itpr2 and Itpr3 MGI IDA rows that cite PMID:17327232, PMID:8663526 and PMID:8063813.
        By title these are studies of IP3 binding by the receptor's ligand-binding domain and of IP3R
        mRNA isoforms; none is about phosphoinositide lipids, and GO:0070679 inositol 1,4,5 trisphosphate
        binding is not a descendant of GO:0035091. The seed rows (resource MGI) and the IBD look like
        a ligand mis-mapping. Candidate correction: repoint the IBD to GO:0070679, which the node already
        carries, and ask MGI to check the three seed rows. Based on titles and the GO definitions; the seed
        papers were not read.
