id: P29993
gene_symbol: Itpr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Itpr encodes the only inositol 1,4,5-trisphosphate (IP3) receptor of Drosophila melanogaster, a large
  multi-pass ion channel of the endoplasmic reticulum membrane. Its N-terminal cytoplasmic region binds
  IP3 and its C-terminal transmembrane region forms a Ca2+-permeable pore; the fly channel has conductance,
  gating and IP3 and Ca2+ sensitivity like those of mammalian type 1 receptors, and it assembles as a
  homotetramer. IP3 made by phospholipase C downstream of Gq-coupled receptors opens the channel and releases
  Ca2+ from the ER into the cytosol, which in turn drives store-operated Ca2+ entry and Ca2+ transfer
  to mitochondria. The receptor is expressed throughout development and is required for larval growth
  and survival. Ca2+ release through Itpr in particular cells underlies the development and modulation
  of the flight circuit (aminergic and insulin-producing neurons), larval and adult feeding, release of
  ecdysone from the prothoracic gland, starvation-induced lipolysis and adipokine control in the fat body,
  autophagy during salivary gland cell death, sugar taste, and ethanol tolerance in perineurial glia.
  Photoreceptors lacking the receptor transduce light normally, so it is not required for phototransduction.
