findings:
- category: discrepancy
  text: UniProt says the receptor may be involved in visual transduction; the review accepts
    the NOT phototransduction annotation, because null mosaics and RNAi photoreceptors respond
    to light normally.
  sources:
  - UniProt
- category: gap
  text: No source states the ER membrane location of the channel except as smooth ER in the
    automated text; FlyBase and UniProt give no location.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The automated text lists peripheral processes (autophagic cell death, ethanol response,
    fatty acid homeostasis) instead of ER Ca2+ release downstream of PLC-coupled GPCRs, which
    the review takes as the core process.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources agree on an IP3-gated Ca2+ release channel. UniProt keeps an
    outdated visual-transduction clause, and the automated text foregrounds peripheral processes.
