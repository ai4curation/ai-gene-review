descriptions:
- source: UniProt
  text: Receptor for inositol 1,4,5-trisphosphate, a second messenger that mediates the release
    of intracellular calcium (PubMed:1322910). Together with MCU, has a role in oxidative
    stress-induced ER- mitochondria calcium transfer (PubMed:28726639). May be involved in
    visual and olfactory transduction, and myoblast proliferation (PubMed:1322910). May be
    involved in ethanol tolerance (PubMed:29444420).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P29993
  source_id: P29993
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'IP3 receptor releasing intracellular Ca2+, the MCU-linked ER-mitochondria
      transfer and ethanol tolerance are correct. The hedged visual-transduction clause is
      outdated: photoreceptors without the receptor transduce light normally. The myoblast
      clause is an expression-based guess, cited to the wrong paper. No ER location, no PLC/GPCR
      coupling.'
- source: Alliance_Imported
  text: Inositol 1,4,5,-trisphosphate receptor (Itpr) encodes an intracellular ligand gated
    calcium channel. It functions downstream of G-protein coupled receptors that activate
    Gq/PLCbeta signaling and generate inositol tris-phosphate. Itpr depletion affects ecdysone
    release, response to nutritional stress, lipid metabolism and flight.
  source_type: curated
  url: https://flybase.org/reports/Itpr.html
  source_id: FB:FBgn0010051
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Every claim traced: intracellular IP3-gated Ca2+ channel downstream of
      Gq/PLCbeta GPCRs, and roles in ecdysone release, nutritional stress, lipid metabolism
      and flight. Omits the ER location, larval feeding and growth, and the negative phototransduction
      result.'
- source: Alliance_Automated
  text: Enables inositol 1,4,5-trisphosphate-gated calcium channel activity. Involved in several
    processes, including autophagic cell death; cellular response to ethanol; and fatty acid
    homeostasis. Located in axonal growth cone and smooth endoplasmic reticulum. Is expressed
    in several structures, including imaginal disc; organism subdivision; sense organ; sensory
    organ cell; and somatic muscle cell. Used to study autosomal dominant cerebellar ataxia
    and obesity. Human ortholog(s) of this gene implicated in several diseases, including
    Gillespie syndrome; amyotrophic lateral sclerosis; autosomal dominant cerebellar ataxia
    (multiple); immunodeficiency 133; and isolated anhidrosis with normal sweat glands. Orthologous
    to human ITPR1 (inositol 1,4,5-trisphosphate receptor type 1); ITPR2 (inositol 1,4,5-trisphosphate
    receptor type 2); and ITPR3 (inositol 1,4,5-trisphosphate receptor type 3).
  source_type: automated
  url: https://flybase.org/reports/Itpr.html
  source_id: FB:FBgn0010051
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: The channel activity is right, but the three processes picked (autophagic
      cell death, ethanol response, fatty acid homeostasis) are peripheral contexts, and the
      locations given are axonal growth cone and smooth ER rather than the ER membrane. Most
      of the text is expression, disease and ortholog boilerplate.
