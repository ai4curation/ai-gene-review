id: Q9VJV8
gene_symbol: PolG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: PolG2 encodes the accessory (beta) subunit of mitochondrial DNA polymerase gamma, a 35 kDa
  protein structurally related to class II aminoacyl-tRNA synthetases that heterodimerizes with the catalytic
  subunit PolG1 (tamas) through multiple contacts with its exonuclease and spacer regions. PolG2 does
  not itself contact DNA in the holoenzyme but raises the catalytic efficiency and processivity of PolG1
  roughly fifty-fold. Null mutants lose mtDNA and mitochondrial mass, show reduced cell proliferation
  in the central nervous system and die at early pupation, establishing PolG2 as essential for mtDNA replication
  and maintenance.
