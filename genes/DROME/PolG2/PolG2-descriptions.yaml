- source: Alliance_Automated
  text: Enables DNA/RNA hybrid binding activity and single-stranded RNA binding activity.
    Involved in mitochondrial DNA replication. Located in mitochondrion. Part of gamma
    DNA polymerase complex. Used to study autosomal dominant progressive external
    ophthalmoplegia with mitochondrial DNA deletions 4. Human ortholog(s) of this
    gene implicated in autosomal dominant progressive external ophthalmoplegia with
    mitochondrial DNA deletions 4; mitochondrial DNA depletion syndrome 16; and mitochondrial
    DNA depletion syndrome 16B. Orthologous to human POLG2 (DNA polymerase gamma 2,
    accessory subunit).
