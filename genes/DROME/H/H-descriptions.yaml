descriptions:
- source: UniProt
  text: Is a potent antagonist of neurogenic gene activity during sensory organ development.
    The expression of distinct cell fates by the trichogen (shaft) / tormogen (socket)
    sister cell pair depends on the level of H activity. A certain threshold level
    of H activity is required, below which both sister cells adopt the tormogen fate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02308
  source_id: Q02308
