- source: Alliance_Automated
  text: Enables transcription corepressor activity. Involved in several processes,
    including intestinal stem cell homeostasis; sensory organ precursor cell fate
    determination; and wing disc development. Part of RNA polymerase II transcription
    repressor complex. Is expressed in several structures, including anterior-posterior
    subdivision of organism; germline cell; gut section; imaginal disc; and somatic
    precursor cell.
