    overall_notes: 'Dated but correct: antagonist of neurogenic genes in sensory organ
      development, with dosage controlling shaft versus socket fate. No Su(H)/Groucho/CtBP
      mechanism.'
- source: Alliance_Imported
  text: Hairless (H) encodes the major antagonist of Notch signaling activity during
    imaginal development. It silences target genes of the product of N by assembling
    a transcriptional repressor complex, which includes the transcription factor encoded
    by Su(H) and general co-repressors like those encoded by gro and CtBP.
  source_type: curated
  url: https://flybase.org/reports/H.html
  source_id: FB:FBgn0001169
