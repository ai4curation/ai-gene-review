id: Q02308
gene_symbol: H
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Hairless (H) is a large, largely disordered nuclear protein, found in insects and other
  arthropods but without an identified vertebrate ortholog, that is the principal antagonist of Notch
  signalling in Drosophila. H binds the C-terminal domain of the CSL transcription factor Suppressor of
  Hairless [Su(H)] with high affinity and acts as an adaptor that recruits the general corepressors Groucho
  and CtBP through distinct short motifs (an eh1-like YSIHSLLG octapeptide for Groucho and a C-terminal
  PLNLS motif for CtBP), converting Su(H) into a repressor of Notch target genes such as the E(spl) complex
  in the absence of signalling ("default repression"). H competes with the Notch intracellular domain
  for Su(H), has an additional Gro/CtBP-independent repressive mode, recruits the histone chaperone Asf1,
  and shuttles between cytoplasm and nucleus, carrying Su(H) into the nucleus. H dosage is critical: H
  is required for sensory organ precursor selection and for shaft/socket fate choice in the bristle lineage,
  for wing margin and vein patterning, and for intestinal stem cell maintenance.'
