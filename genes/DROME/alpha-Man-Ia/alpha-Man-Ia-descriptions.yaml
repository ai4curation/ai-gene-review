- source: Alliance_Imported
  text: '&agr;-Mannosidase class I a (&agr;-Man-Ia) encodes a transmembrane enzyme
    that catalyzes the sequential removal of &agr;-1,2-linked mannose residues from
    protein N-linked glycan Man(9)GlcNAc(2) to produce Man(5)GlcNAc(2). It is involved
    in the processing of protein N-glycans in the Golgi apparatus.'
  source_type: curated
