- source: Alliance_Automated
  text: Enables mannosyl-oligosaccharide 1,2-alpha-mannosidase activity. Involved
    in Golgi apparatus N-glycan mannose trimming. Located in endomembrane system.
    Is expressed in several structures, including adult head; lamina monopolar neuron
    L5; larval muscle system; presumptive embryonic/larval central nervous system;
    and synaptic neuropil domain. Orthologous to several human genes including MAN1A1
    (mannosidase alpha class 1A member 1) and MAN1A2 (mannosidase alpha class 1A member
    2).
