  review:
    action: UNDECIDED
    summary: ER residence requires distinction from the established Golgi role.
    reason: The experimentally supported role is Golgi N-glycan trimming. ER entry during biosynthesis
      does not establish persistent ER residence; the inherited ER annotation may reflect another GH47
      branch, but the exact PAINT node and target trafficking evidence do not resolve that distinction
      here.
    supported_by:
    - reference_id: PMID:9654102
      supporting_text: The mas-1 gene of Drosophila melanogaster encodes Golgi mannosidase I (MAS-1)
