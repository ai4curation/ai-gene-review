  review:
    action: ACCEPT
    summary: The enzyme removes alpha-1,2-linked mannose from oligomannosidic N-glycans.
    reason: Recombinant mas-1 is active toward oligomannosidic glycans, and mas-1 deletion causes Man8GlcNAc2
      accumulation. Together these support the catalytic annotation on alpha-Man-Ia rather than transfer
      solely from a GH47 family label.
    supported_by:
    - reference_id: PMID:23979800
      supporting_text: 'Some of the recombinant mannosidases were demonstrably

        active towards oligomannosidic glycans, specifically, the Co(II)-requiring

        ManIIb, two ''acidic'' mannosidases and the class I mas-1 mannosidase.'
    - reference_id: PMID:9654102
      supporting_text: 'There is

        an accumulation of the Man8GlcNAc2 which is one of the substrates for the MAS-1

        enzyme.'
