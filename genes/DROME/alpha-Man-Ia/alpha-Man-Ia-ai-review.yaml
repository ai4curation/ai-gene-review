  review:
    action: UNDECIDED
    summary: A dedicated ERAD role is not established for the Golgi-trimming enzyme.
    reason: GH47 includes ER quality-control mannosidases as well as Golgi-processing enzymes. The target
      mutant and recombinant assays demonstrate N-glycan trimming but do not directly show degradation
      commitment or ERAD participation. This is a branch-specific functional uncertainty, not evidence
      that all GH47 proteins lack ERAD roles.
    supported_by:
    - reference_id: PMID:23979800
      supporting_text: 'Some of the recombinant mannosidases were demonstrably

        active towards oligomannosidic glycans, specifically, the Co(II)-requiring

        ManIIb, two ''acidic'' mannosidases and the class I mas-1 mannosidase.'
    - reference_id: PMID:9654102
