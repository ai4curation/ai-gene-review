gene_symbol: alpha-Man-Ia
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Alpha-Man-Ia (mas-1, CG32684) is a Golgi class I alpha-1,2-mannosidase of glycoside hydrolase
  family 47 (GH47) that trims alpha-1,2-linked mannose residues from high-mannose (Man9/Man8GlcNAc2) N-glycans
  on glycoproteins, a step that precedes the action of Golgi mannosidase II and GlcNAc-transferase I in
  N-glycan maturation. Two promoters produce isoforms that are single-pass type II membrane proteins with
  different cytoplasmic N-termini and a shared luminal Ca2+-dependent catalytic domain. Recombinant enzyme
  trims oligomannosidic glycans, and null flies are viable but accumulate Man8GlcNAc2 and show low-penetrance
  defects in the embryonic peripheral nervous system, wing and eye, reflecting partial redundancy with other
  mannose-trimming routes. The gene is expressed maternally and zygotically, with prominent expression in
  lobula plate giant neurons.
