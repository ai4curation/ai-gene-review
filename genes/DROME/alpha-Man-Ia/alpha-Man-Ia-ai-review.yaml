  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: ER residence is over-propagated from the ER mannosidase branch onto a Golgi-branch enzyme.
    reason: The ER IBD sits on the GH47 root node PTN000201533, and all of its seeds come from the ER
      mannosidase I (SF55 MAN1B1, yeast and Candida MNS1) and MNL2 (SF103) lineages. Drosophila
      alpha-Man-Ia is in PTHR11742:SF6, together with its paralog alpha-Man-Ic, C. elegans mans-1 and
      Arabidopsis MNS1. It also descends from PTN000201534, where PAINT separately placed Golgi membrane
      using the Golgi class I enzymes (Arabidopsis MNS1/MNS2, mouse Man1a1/Man1a2). The fly product is
      described as Golgi mannosidase I, a type II membrane protein. A type II Golgi enzyme passes through
      the ER on the way to the Golgi, so transient ER presence is expected, but "is active in ER" is a
      property of the ER-mannosidase branch. No fly-specific localization study places alpha-Man-Ia activity
      in the ER. I treat this as compartmental over-propagation from a GH47 ancestor placed too deep for
      cellular component. The ER assertion is correct for the ER-branch seeds, so I mark it as over-annotated
      rather than removing it.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
