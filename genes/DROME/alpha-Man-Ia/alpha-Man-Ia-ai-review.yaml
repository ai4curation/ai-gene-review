id: P53624
gene_symbol: alpha-Man-Ia
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Alpha-Man-Ia (mas-1) is a Golgi glycoside hydrolase of family GH47 that trims alpha-1,2-linked
  mannose residues during N-glycan maturation. Its N-terminal membrane anchor presents the catalytic domain
  to the secretory-pathway lumen. Loss of the enzyme changes glycan proportions and causes Man8GlcNAc2
  accumulation, while alternative processing routes retain substantial glycosylation.
