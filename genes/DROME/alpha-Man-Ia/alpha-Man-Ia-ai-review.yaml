  review:
    action: UNDECIDED
    summary: A dedicated ERAD role is not established for the Golgi-trimming enzyme.
    reason: The ERAD IBD sits on the GH47 root node PTN000201533. Its seeds include ER-branch enzymes
      (MAN1B1, yeast MNS1 and MNL2, fission yeast SPAC2E1P5.01c) and one Golgi class IA enzyme, human
      MAN1A1 (SF31). Including MAN1A1 shows that the PAINT curator deliberately extended ERAD participation
      to Golgi-type class I mannosidases, so the call cannot be dismissed as a simple ER-branch leak. The
      Drosophila evidence neither supports nor refutes it. The mas-1 studies measured steady-state N-glycan
      profiles and developmental phenotypes, and none tested degradation of a misfolded glycoprotein. The
      fly enzyme is also in a different subfamily (SF6) from the MAN1A1 seed. Recombinant activity on
      oligomannosidic glycans fits the mannose trimming that marks ERAD substrates, but it does not show
      that the fly enzyme takes part in ERAD. The cached literature does not let me check the MAN1A1 ERAD
      evidence behind the seed, so I leave this undecided rather than accept or remove it.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000201533
        source_label: PANTHER:PTN000201533
        source_status: UNRESOLVED
        comment: PTN000201533's ERAD seed set mixes ER-associated GH47 descendants with human
          MAN1A1, a Golgi class-IA enzyme; the node therefore needs source-level adjudication
          before transfer to Drosophila alpha-Man-Ia can be accepted or rejected.
