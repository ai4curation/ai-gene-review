  review:
    action: KEEP_AS_NON_CORE
    summary: Calcium binding is a cofactor feature of the GH47 catalytic apparatus.
    reason: The calcium-dependent GH47 mechanism makes this binding annotation reasonable; it is ancillary
      to glycan hydrolysis rather than a distinct calcium-signaling function.
    supported_by:
    - reference_id: PMID:23979800
      supporting_text: 'Some of the recombinant mannosidases were demonstrably

