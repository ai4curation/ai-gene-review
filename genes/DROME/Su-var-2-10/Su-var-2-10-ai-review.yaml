      signalling and epithelial homeostasis; no innate immune response readout (e.g. antimicrobial peptide
      induction, IMD/Toll activation, phagocytosis) was shown to be increased by Su(var)2-10. Positive
      regulation of innate immune response overstates the evidence. The infection-survival phenotype is
      better captured by the defense response row (kept as non-core).
