    supporting_text: Thus, the JAK-STAT pathway activation in the gut negatively regulates survival in
      response to an intestinal S. marcescens infection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genome-wide screen with targeted follow-up of PIAS; supports a peripheral role via JAK-STAT
      inhibition, not an innate immune effector role.
- id: PMID:11390354
  title: The Drosophila Su(var)2-10 locus regulates chromosome structure and function and encodes a member
    of the PIAS protein family.
  findings:
  - statement: Su(var)2-10 encodes a PIAS family protein, is essential, localises to nuclear lamina and
      telomeres in interphase, and is required for chromosome inheritance, condensation and interphase
      telomere organisation.
    supporting_text: We conclude that telomere–telomere and telomere–lamina associations are severely
      disrupted in Su(var)2-10 mutant polytene nuclei, demonstrating that SU(VAR)2-10 plays a role in
      the organization of chromosomes in the interphase nucleus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational cloning and characterisation paper (full text cached).
