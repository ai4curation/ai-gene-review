taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Su(var)2-10 (dPIAS, ZIMP, CG8068) is the single PIAS-family SP-RING-type SUMO (Smt3) E3
  ligase of Drosophila melanogaster. It has the conserved PIAS architecture: an N-terminal SAP domain
  (DNA/chromatin binding), a PINIT domain, a zinc-coordinating SP-RING (MIZ-type) zinc finger that engages
  the SUMO-charged E2 Ubc9, and a disordered C-terminal region. Mutation of the SP-RING (C341S) abolishes
  its auto-SUMOylation and its ability to SUMOylate chromatin targets. Su(var)2-10 is a nuclear protein
  found at the nuclear lamina, at some polytene telomeres and in the nucleoplasm, and is largely absent
  from condensed mitotic chromosomes. Its best-characterised role is in transcriptional silencing by H3K9
  trimethylation: in the ovarian germline it physically associates with Piwi and its partners Panoramix
  and Asterix and, through local SUMOylation (including auto-SUMOylation), recruits the SUMO-binding SetDB1
  (Eggless)/Windei histone methyltransferase complex to piRNA-targeted transposons, so linking piRNA-guided
  target recognition to heterochromatin formation. The same SUMO/Su(var)2-10/SetDB1 axis deposits most
  H3K9me3 in ovarian cells, represses tissue-inappropriate euchromatic genes (in part by SUMOylating the
  TIF1 homologue Bonus) and suppresses spurious transcription in heterochromatin. Originally identified
  as a dominant suppressor of position-effect variegation, Su(var)2-10 is essential for viability and
  is needed for normal interphase chromosome organisation (telomere clustering and telomere-lamina association),
  mitotic chromosome condensation and chromosome inheritance. As in other PIAS proteins it also antagonises
  activated Stat92E, negatively regulating JAK/STAT signalling in eye and blood-cell development.'
