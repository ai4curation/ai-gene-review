  review:
    summary: From a genome-wide in vivo RNAi screen for survival after oral Serratia marcescens infection.
      Global or gut-specific RNAi of PIAS caused earlier death, while gut-specific PIAS overexpression
      increased survival; the authors attribute this to JAK-STAT control of intestinal stem cell proliferation
