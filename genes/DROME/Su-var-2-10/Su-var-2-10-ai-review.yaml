suggested_questions:
- question: Which Su(var)2-10 SUMOylation substrates (beyond itself and Bonus) at piRNA target loci are
    required for SetDB1/Wde recruitment, and is Su(var)2-10 auto-SUMOylation sufficient?
- question: Do the chromosome-organisation phenotypes (telomere clustering, telomere-lamina association,
    mitotic condensation) require Su(var)2-10 SUMO ligase activity, or a scaffolding function of the protein?
- question: Does Su(var)2-10 inhibit Stat92E by SUMOylating it, by blocking its DNA binding (as human
    PIAS1 does for STAT1), or by H3K9me3 silencing of Stat92E target genes?
- question: Are the Su(var)2-10 isoforms (e.g. isoform A, Q7KNF5, versus A1Z7P5) functionally distinct,
    or should GO annotations be consolidated on one gene-level accession?
suggested_experiments:
- hypothesis: Su(var)2-10 SUMO ligase activity, not scaffolding, is required for telomere-lamina association.
  description: Rescue Su(var)2-10 null larvae with wild-type versus C341S transgenes and measure telomere
    clustering and telomere-lamina distances by FISH in salivary gland nuclei, alongside H3K9me3 at telomeric
    retrotransposon arrays.
  experiment_type: genetic complementation
- hypothesis: A defined set of chromatin proteins is SUMOylated by Su(var)2-10 at piRNA target loci.
  description: SUMO-site proteomics in ovaries after germline knockdown of Su(var)2-10, or in C341S rescue
    lines, compared with controls, followed by SIM-binding assays with SetDB1/Wde.
  experiment_type: proteomics
- hypothesis: dPIAS inhibition of Stat92E is independent of its ligase activity.
  description: Overexpress wild-type and C341S dPIAS with ey-Gal4 in hop gain-of-function backgrounds and
    assay eye size and a 10xSTAT-GFP reporter; test Stat92E SUMOylation and DNA binding in S2 cells.
  experiment_type: genetic interaction
