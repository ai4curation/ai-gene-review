      essential for tethering-induced repression and H3K9me3. Comparator check: the other pathway components
      in equivalent roles (piwi, Panx, arx, egg/SetDB1, wde, Su(var)205) all carry GO:0141006 in FlyBase
      GOA, and Su(var)2-10 itself carries it on isoform accession A1Z7P5 (IPI, IMP), so its absence from
      Q7KNF5 is an isoform-accession gap rather than a curatorial convention.'
    supported_by:
    - reference_id: PMID:31901446
      supporting_text: Here, we show that in Drosophila the small ubiquitin-like protein
        SUMO and the SUMO E3 ligase Su(var)2-10 are required for piRNA-guided deposition
        of repressive chromatin marks and transcriptional silencing of piRNA targets.
    - reference_id: PMID:31901446
      supporting_text: Taken together, our results suggest that SUMOylation of protein targets by Su(var)2–10
