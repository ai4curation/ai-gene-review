      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Correct on PIAS family, chromosome structure and JAK/STAT regulation
      in eye development. Omits SUMO E3 ligase activity and piRNA-guided H3K9me3 silencing,
      the best-characterized role.
- source: Alliance_Automated
  text: Enables STAT family protein binding activity and SUMO ligase activity. Involved
    in several processes, including positive regulation of somatic stem cell division;
    regulation of signal transduction; and transposable element silencing by piRNA-mediated
    heterochromatin formation. Located in chromosome, telomeric region; cytoplasm;
    and nuclear lumen. Is expressed in egg chamber; embryonic brain; larval ventral
    nerve cord; and ventral nerve cord. Used to study hematologic cancer. Orthologous
    to several human genes including PIAS1 (protein inhibitor of activated STAT 1);
    PIAS2 (protein inhibitor of activated STAT 2); and PIAS3 (protein inhibitor of
    activated STAT 3).
  source_type: automated
