descriptions:
- source: Alliance_Imported
  text: Suppressor of variegation 2-10 (Su(var)2-10) encodes a member of the PIAS
    protein family that regulates chromosome structure and function. As a JAK/STAT
    pathway regulator, it contributes to eye formation and eye determination.
  source_type: curated
  url: https://flybase.org/reports/Su(var)2-10.html
  source_id: FB:FBgn0003612
