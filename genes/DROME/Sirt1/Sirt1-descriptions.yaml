      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: 'Every claim traced (NAD+-dependent deacetylase, euchromatic and heterochromatic
      silencing, neuronal function, apoptosis, metabolism, development). Accurate but general:
      no substrates, no fat-body role, no mention of the lifespan dispute.'
- source: Alliance_Automated
  text: Enables histone H4K deacetylase activity; histone deacetylase activity, NAD-dependent;
    and transcription coactivator binding activity. Involved in several processes, including
    behavioral response to ethanol; determination of adult lifespan; and regulation of gene
    expression. Located in chromosome; cytoplasm; and nucleoplasm. Is expressed in several structures,
    including embryonic/larval garland cell; embryonic/larval salivary gland; germ band; larval
    central nervous system; and ventral nerve cord. Used to study alcohol use disorder and type
    2 diabetes mellitus. Human ortholog(s) of this gene implicated in Huntington's disease.
    Orthologous to human SIRT1 (sirtuin 1).
  source_type: automated
