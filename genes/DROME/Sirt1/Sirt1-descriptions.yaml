descriptions:
- source: UniProt
  text: NAD-dependent histone deacetylase involved in heterochromatic silencing. Mildly suppresses
    the heterochromatin-mediated silencing phenomenon known as position-effect variegation (PEV).
    Required for epigenetic silencing of the polycomb group proteins. Has histone H4 deacetylase
    activity in vitro. Required maternally for establishing proper segmentation of the embryo.
    Involved in sex determination. May be involved in the regulation of life span.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VK34
  source_id: Q9VK34
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct on the NAD-dependent histone deacetylase and H4 activity. The PEV
      sentence inverts the direction (mutants suppress PEV, so the protein promotes silencing),
      the Polycomb sentence says the PcG proteins are silenced, and the maternal segmentation
      and sex-determination claims were not reproduced with clean nulls. Omits metabolic roles
      and non-histone substrates.
- source: Alliance_Imported
  text: Sirtuin 1 (Sirt1) encodes an NAD<up>+</up>-dependent deacetylase that functions during
    euchromatic and heterochromatic gene silencing. Sirt1 product contributes to many biological
    pathways including neuronal function, apoptosis, metabolism, and development.
  source_type: curated
  url: https://flybase.org/reports/Sirt1.html
  source_id: FB:FBgn0024291
  review:
    reviewer: AI
    rubrics:
