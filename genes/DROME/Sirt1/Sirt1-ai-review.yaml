suggested_questions:
- question: Which histone sites does Sirt1 deacetylate in vivo in flies (for example H4K16ac, H3K9ac,
    H3K56ac in specific tissues), given that cell-culture depletion raises acetylation broadly?
- question: Is the maternal segmentation and sex-ratio phenotype of dSir2(ex10) due to a second-site mutation,
    as the clean dsir2(17) null suggests?
- question: Does fly Sirt1 act at the rDNA or nuclear periphery at all, or are these SIRT1 roles vertebrate-specific?
- question: Under which conditions (dose, tissue, diet, genetic background) does Sirt1 affect adult lifespan?
suggested_experiments:
- description: Quantify histone acetylation by mass spectrometry in Sirt1 null versus rescued flies (fat
    body, brain) to define in vivo sites, with catalytic-dead rescue to separate enzymatic from scaffolding
    roles.
- description: Map Sirt1 binding genome-wide (CUT&RUN) and test rDNA and telomere-associated sequence
    chromatin in Sirt1 nulls.
- description: Re-test lifespan and dietary restriction responses with titrated, inducible Sirt1 expression
    in backcrossed, matched genetic backgrounds.
