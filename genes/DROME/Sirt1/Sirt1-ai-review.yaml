- id: file:DROME/Sirt1/Sirt1-deep-research-flybase.md
  title: FlyBase gene description for Sirt1 (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Checked each claim. NAD+-dependent deacetylase (PMID:11281647, PMID:12524341); euchromatic
      silencing (Polycomb, PMID:15498488; Hairy-family repressors, PMID:12086602) and heterochromatic
      silencing (PEV, PMID:12524341, PMID:12663533); neuronal function (ethanol responses in mushroom
      bodies, PMID:27170122; feeding via sNPF neurons, PMID:22876196); apoptosis (PMID:18562277); metabolism
      (PMID:21085633, PMID:22411915, PMID:27058248); development (Notch-dependent SOP specification and
      wing development, PMID:27623778). All traced. The text is accurate but general: it gives no substrate,
      omits the fat-body metabolic role and does not mention the disputed lifespan role.'
- id: file:DROME/Sirt1/Sirt1-uniprot.txt
  title: UniProtKB Q9VK34 (SIRT1_DROME) Swiss-Prot record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Curated catalytic, subunit and localisation lines agree with the literature. Three
      FUNCTION sentences are wrong or outdated: the PEV sentence inverts the direction of the effect,
      the Polycomb sentence says the PcG proteins are silenced, and the maternal segmentation and sex-determination
      claims rest on one allele (ex10) and were not reproduced with clean null alleles.'
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9VK34
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Mildly suppresses the heterochromatin-mediated silencing phenomenon known as position-effect
        variegation (PEV).
      confidence: CONFIRMED
      explanation: 'The data show the reverse: dSir2 mutant alleles are weak recessive suppressors of
        PEV, so the wild-type protein promotes heterochromatic silencing (it is required for silencing).
        Suggest ''Required for heterochromatin-mediated silencing; loss-of-function mutations weakly suppress
        position-effect variegation (PEV).'''
      supported_by:
      - &id001
        reference_id: PMID:12524341
        supporting_text: The dSir2 mutants are viable, fertile, and recessive suppressors of position-effect
          variegation (PEV)
      - &id008
        reference_id: PMID:12663533
        supporting_text: We did observe a modest, strictly recessive suppression of white(m4) position-effect
          variegation and a shortening of life span in dsir2 homozygous mutants
      - &id002
        reference_id: PMID:12086602
        supporting_text: is required for heterochromatic silencing, but unlike ySir2, is not required
          for silencing at telomeres
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9VK34
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Required for epigenetic silencing of the polycomb group proteins.
      confidence: CONFIRMED
      explanation: The cited paper shows that SIR2 takes part in silencing by (mediated by) the Polycomb
        group proteins, not silencing of them. Suggest 'Required for epigenetic silencing mediated by
        the Polycomb group proteins.'
      supported_by:
      - &id012
        reference_id: PMID:15498488
        supporting_text: Evidence is presented that Drosophila SIR2 is also involved in epigenetic silencing
          by the Polycomb group proteins.
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9VK34
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Required maternally for establishing proper segmentation of the embryo. Involved
        in sex determination.
      confidence: PROBABLE
      explanation: Both claims come from Rosenberg & Parkhurst 2002, using the P-mobilisation allele dSir2(ex10).
        A clean null (dsir2(17)) had no effect on viability, developmental rate or sex ratio, complemented
        ex10, and a genetic test ruled out the reported effect on Sex-lethal; other null alleles are viable
        and fertile. The sex-determination claim is directly refuted; the maternal segmentation claim
        is not reproduced (mutant mothers are fertile), hence PROBABLE for the pair. Suggest removing
        both sentences or stating that they were not confirmed.
      supported_by:
      - reference_id: PMID:12663533
        supporting_text: homozygosity for dsir2(17) had no apparent deleterious effects on viability,
          developmental rate, or sex ratio, and it fully complemented sir2(ex10)
      - reference_id: PMID:12663533
        supporting_text: Moreover, through a genetic test, we ruled out the reported effect of dSir2(ex10)
          on Sex-lethal expression.
      - *id001
      - reference_id: PMID:19951294
        supporting_text: These Sir2 null mutant flies were fully viable and fertile, and showed no obvious
          morphological or behavioral defects.
