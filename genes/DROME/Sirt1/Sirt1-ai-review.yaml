id: Q9VK34
gene_symbol: Sirt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Sirt1 (Sir2, dSir2) encodes the fly ortholog of yeast Sir2 and mammalian SIRT1, an NAD+-dependent
  protein lysine deacetylase of the class I sirtuin family that releases nicotinamide and O-acetyl-ADP-ribose.
  Purified dSir2 deacetylates many histone lysines in vitro (including H3K9, H3K14 and H4K16), and also
  H3K56ac. In cells its histone specificity is broad, and it deacetylates non-histone proteins such as
  HNF4, FOXO, Suppressor of Hairless and fatty acid synthase. The protein is mainly nuclear, binds many
  euchromatic sites on polytene chromosomes and is also found in the cytoplasm. It contributes to heterochromatic
  silencing (mutants weakly suppress position-effect variegation), Polycomb silencing and copia repression,
  but unlike yeast Sir2 it is not needed for telomeric silencing. It binds Hairy-family bHLH repressors
  and dCBP. Null mutants are viable and fertile. Sirt1 acts in the fat body to limit fat storage, mobilise
  fat and maintain insulin sensitivity. It also promotes Notch signalling, neuronal ethanol responses
  and feeding, and influences apoptosis. Its effect on lifespan is disputed: lifespan extension by overexpression,
  and a requirement for it in dietary restriction, were not reproduced with matched genetic controls,
  though modest induction can extend lifespan.'
