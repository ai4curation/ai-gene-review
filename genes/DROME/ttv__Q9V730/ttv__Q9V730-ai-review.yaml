    reason: The EXT co-polymerase backbone is shared by heparan sulfate and heparin, so
      the mapping is mechanistically understandable, but heparin proteoglycan (the
      highly sulfated serglycin-borne form made by vertebrate mast cells) has not been
      described in Drosophila. Glycosaminoglycan analyses of fly tissues and ttv mutants
      report heparan sulfate and chondroitin sulfate only. The experimentally supported
      process is heparan sulfate proteoglycan biosynthesis (GO:0015012).
    supported_by:
    - reference_id: PMID:10806213
      supporting_text: likewise does not affect chondroitin sulfate synthesis but reduces
        all forms of heparan sulfate to below the limit of detection
