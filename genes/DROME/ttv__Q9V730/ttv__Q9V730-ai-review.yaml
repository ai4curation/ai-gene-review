- term:
    id: GO:0006024
    label: glycosaminoglycan biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:10644674
  qualifier: involved_in
  review:
    summary: ttv mutant larvae have markedly reduced heparan sulfate but normal
      chondroitin sulfate.
    action: ACCEPT
    reason: Ttv polymerizes the heparan sulfate glycosaminoglycan chain itself, so it
      does the work of glycosaminoglycan biosynthesis. GO has no heparan sulfate chain
      biosynthesis term below GO:0006024 (its children are peptidoglycan and hyaluronan
      biosynthesis), and the proteoglycan-level term GO:0015012 is not a descendant, so
      GO:0006024 is the most precise chain-level term and is accepted alongside GO:0015012.
    supported_by:
    - reference_id: PMID:10644674
      supporting_text: Analysis of total glycosaminoglycans from tout-velu mutant larvae
        show marked reductions in heparan sulfate but not chondroitin sulfate, consistent
        with its proposed function as a heparan sulfate co-polymerase.
