id: Q9V730
gene_symbol: ttv
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Tout-velu (Ttv, DEXT1) is the Drosophila ortholog of vertebrate exostosin-1 (EXT1), a
  760-residue single-pass type II membrane glycosyltransferase of the GT47/GT64 exostosin
  family that resides in the endoplasmic reticulum and Golgi apparatus. With its paralog
  Sister of tout-velu (Sotv, the EXT2 ortholog) it forms a heteromeric heparan sulfate
  co-polymerase. Ttv itself transfers both beta-1,4-linked glucuronic acid (GlcAT-II) and
  alpha-1,4-linked N-acetylglucosamine (GlcNAcT-II) from UDP-sugars onto the growing chain,
  and co-expression with Sotv strongly increases both activities. Unlike human EXT1, the
  Ttv-Sotv complex has no chain-initiating GlcNAcT-I activity; initiation on the linkage
  tetrasaccharide is performed by Brother of tout-velu (Botv, the EXTL3 ortholog). Loss of
  ttv abolishes detectable heparan sulfate without affecting chondroitin sulfate, so
  glypicans such as Dally and Dally-like lack their HS chains. Through this role in
  heparan sulfate proteoglycan synthesis, Ttv is required for the extracellular movement
  and gradient formation of the Hedgehog, Decapentaplegic and Wingless morphogens; its
  Golgi residence is regulated by the GOLPH3 homolog Rotini.
