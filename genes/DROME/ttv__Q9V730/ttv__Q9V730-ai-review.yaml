suggested_questions:
- question: Human EXT1-EXT2 is reported to have GlcNAcT-I (chain initiation) activity
    whereas Drosophila Ttv-Sotv does not (PMID:16303756). Should transfer of EXT1-clade
    functions to insect orthologs exclude GlcNAcT-I, and is the loss lineage-specific?
- question: The cached PANTHER 19.0 HMM classification places ttv in PTHR11062:SF129
    with C. elegans rib-1, separate from vertebrate EXT1 (PTHR11062:SF97), while UniProt
    lists PTHR48261:SF3. Which subfamily placement is current, and do both share the
    PAINT node PTN000869020?
- question: Should the UniPathway-based heparin proteoglycan biosynthesis mapping be
    restricted to taxa that make heparin, given that no heparin has been described in
    Drosophila?
suggested_experiments:
- description: Assay purified Ttv-Sotv versus Ttv alone on defined acceptors to measure
    each subunit's contribution to GlcAT-II and GlcNAcT-II activity, and test catalytic-site
    mutants of each subunit in vivo for rescue of HS synthesis.
- description: Germline-clone and zygotic analysis of an independent ttv null allele
    with quantitative germ cell counts, to resolve the conflicting germ cell migration
    reports (PMID:17409068 versus PMID:19389345).
