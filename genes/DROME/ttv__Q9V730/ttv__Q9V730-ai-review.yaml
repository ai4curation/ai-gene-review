    (GlcAT-II). Ttv, in the Ttv-Sotv (EXT1-EXT2) complex in the Golgi membrane,
    transfers beta-1,4-linked GlcA from UDP-GlcA onto the non-reducing GlcNAc of
    growing heparan sulfate chains on glypicans and other core proteins. Directly
    assayed for Drosophila Ttv.
