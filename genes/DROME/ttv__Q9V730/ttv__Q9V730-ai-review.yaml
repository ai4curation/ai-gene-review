- term:
    id: GO:0008354
    label: primordial germ cell migration
  evidence_type: IMP
  original_reference_id: PMID:17409068
  qualifier: involved_in
  review:
    summary: Deshpande et al. reported mild germ cell migration defects in zygotic and
      maternal ttv loss-of-function embryos and defects on ttv overexpression.
    action: REMOVE
    reason: Full text of both papers read. Even taken at face value, the effect is indirect; the authors themselves
      attribute it to somatic, extracellular HSPG-dependent distribution of Hedgehog, not
      to Ttv doing any step of germ cell migration. The result was also directly
      contested by Renault et al. (PMID:19389345), who used the verified null allele
      ttv l(2)00681 and found wild-type migration in maternal-only and zygotic-only mutant
      embryos. An organismal consequence of a biosynthetic enzyme's loss is not process
      participation.
    supported_by:
    - reference_id: PMID:17409068
      supporting_text: it seems likely that ttv activity is required in the soma, not the
        germline
    - reference_id: PMID:19389345
      supporting_text: Taken together our results suggest that ttv loss of function has
        no effect on germ cell migration.
- term:
    id: GO:0008354
    label: primordial germ cell migration
  evidence_type: IMP
  original_reference_id: PMID:19389345
  qualifier: involved_in
  negated: true
  review:
    summary: NOT annotation; ttv null maternal or zygotic mutant embryos show normal germ
      cell migration.
    action: KEEP_AS_NON_CORE
    reason: Full text read. The negative result uses a verified null allele and germline
      clones, and no ttv alleles were recovered in a dedicated germ cell migration screen
      of the chromosome arm. The NOT statement is well supported and consistent with Ttv
      being a biosynthetic enzyme with no direct role in germ cell guidance; it is
      peripheral to the core function.
    supported_by:
    - reference_id: PMID:19389345
      supporting_text: Taken together our results suggest that ttv loss of function has
        no effect on germ cell migration.
