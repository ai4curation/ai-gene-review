- id: PMID:10549295
  title: Hedgehog movement is regulated through tout velu-dependent synthesis of a
    heparan sulfate proteoglycan.
  findings:
  - statement: ttv is required in vivo for HSPG biosynthesis; Ttv localized to ER and
      Golgi (per GOA IDA).
    supporting_text: we present in vivo evidence that ttv is involved in heparan sulfate
      proteoglycan (HSPG) biosynthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Its claim that FGF and Wg signaling are unaffected
      in ttv mutants was later revised (PMID:14645127, PMID:14998928, PMID:15056609).
- id: PMID:10644674
  title: Structural analysis of glycosaminoglycans in Drosophila and Caenorhabditis
    elegans and demonstration that tout-velu, a Drosophila gene related to EXT tumor
    suppressors, affects heparan sulfate in vivo.
  findings:
  - statement: ttv mutant larvae have reduced heparan sulfate but not chondroitin sulfate.
    supporting_text: Analysis of total glycosaminoglycans from tout-velu mutant larvae
      show marked reductions in heparan sulfate but not chondroitin sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:10806213
  title: Structural analysis of glycosaminoglycans in animals bearing mutations in
    sugarless, sulfateless, and tout-velu. Drosophila homologues of vertebrate genes
    encoding glycosaminoglycan biosynthetic enzymes.
  findings:
  - statement: A ttv mutation reduces all heparan sulfate below detection without
      affecting chondroitin sulfate.
    supporting_text: reduces all forms of heparan sulfate to below the limit of detection
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:11832488
  title: 'Demonstration of a novel gene DEXT3 of Drosophila melanogaster as the essential
    N-acetylglucosamine transferase in the heparan sulfate biosynthesis: chain initiation
    and elongation.'
  findings:
  - statement: Botv/DEXT3 (EXTL3 ortholog) has GlcNAcT-I and GlcNAcT-II activity; it,
      not Ttv, initiates HS chains.
    supporting_text: The results suggest that DEXT3 is the ortholog of human EXTL3
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primarily about the paralog Botv/DEXT3; abstract-only cache does not
      show the ttv experiment behind the GOA IMP row, so that row is accepted by
      deference to the curator.
- id: PMID:14645127
  title: Three Drosophila EXT genes shape morphogen gradients through synthesis of
    heparan sulfate proteoglycans.
  findings:
  - statement: ttv, sotv and botv are each non-redundantly required for HSPG biosynthesis
      and for Hh, Dpp and Wg morphogen distribution.
    supporting_text: Mutation in any of these genes impaired biosynthesis of HSPGs in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:14998928
  title: Distinct and collaborative roles of Drosophila EXT family proteins in morphogen
    signalling and gradient formation.
  findings:
  - statement: Ttv and Sotv form a complex and co-localize; Ttv and Sotv are redundant
      for Wg signaling.
    supporting_text: We demonstrate further that Ttv and Sotv form a complex and are
      co-localized in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
