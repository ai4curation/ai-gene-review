- id: PMID:17409068
  title: toutvelu, a regulator of heparan sulfate proteoglycan biosynthesis, controls
    guidance cues for germ-cell migration.
  findings:
  - statement: Reported germ cell migration defects in ttv loss- and gain-of-function
      embryos, attributed to somatic Hh distribution.
    supporting_text: it seems likely that ttv activity is required in the soma, not the
      germline
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: Full text read. The loss-of-function germ cell migration phenotype was
      not reproduced with a verified null allele (PMID:19389345).
- id: PMID:19389345
  title: Hedgehog does not guide migrating Drosophila germ cells.
  findings:
  - statement: ttv null maternal-only or zygotic-only mutants have normal germ cell
      migration; ttv overexpression did not cause migration defects.
    supporting_text: Taken together our results suggest that ttv loss of function has
      no effect on germ cell migration.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; supports the NOT annotation.
