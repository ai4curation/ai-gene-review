- source: Alliance_Imported
  text: tout-velu (ttv) encodes a glycosyltransferase that forms a complex with sotv
    to catalyze the alternating transfer of glucuronic acid (GlcA) and N-acetylglucosamine
    (GlcNAc) to their respective acceptors, GlcNAc and GlcA, during the elongation
    of the heparan sulfate glycosaminoglycan chain.
  source_type: curated
