- source: Alliance_Automated
  text: Enables N-acetylglucosaminyl-proteoglycan 4-beta-glucuronosyltransferase activity
    and glucuronosyl-N-acetylglucosaminyl-proteoglycan 4-alpha-N-acetylglucosaminyltransferase
    activity. Involved in glycosaminoglycan biosynthetic process; heparan sulfate
    proteoglycan biosynthetic process; and primordial germ cell migration. Located
    in Golgi apparatus and endoplasmic reticulum. Part of EXT1-EXT2 complex. Used
    to study germ cell cancer. Human ortholog(s) of this gene implicated in chondrosarcoma
    and hereditary multiple exostoses. Orthologous to several human genes including
    EXT1 (exostosin glycosyltransferase 1).
