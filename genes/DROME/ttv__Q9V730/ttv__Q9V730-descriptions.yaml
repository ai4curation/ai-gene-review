descriptions:
- source: UniProt
  text: Glycosyltransferase required for the biosynthesis of heparan- sulfate and
    responsible for the alternating addition of beta-1-4-linked glucuronic acid (GlcA)
    and alpha-1-4-linked N-acetylglucosamine (GlcNAc) units to nascent heparan sulfate
    chains. Botv is the trigger of heparan sulfate chain initiation and polymerization
    takes place by a complex of ttv and sotv. Plays a central role in the diffusion
    of morphogens hedgehog (hh), wingless (wg) and decapentaplegic (dpp) via its role
    in heparan sulfate proteoglycans (HSPGs) biosynthesis which are required for movement
    of hh, dpp and wg morphogens.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V730
