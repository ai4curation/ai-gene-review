  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: One of the three mouse cryo-EM papers behind the mouse Efhb IDA rows (sperm DMT location
      and flagellated sperm motility) that seed PAINT nodes PTN000250051 and PTN000949412. It is a
      structural localization study; it reports no Efhb loss-of-function motility data.
