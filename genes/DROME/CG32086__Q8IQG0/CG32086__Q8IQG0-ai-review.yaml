- term:
    id: GO:0061891
    label: calcium ion sensor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004335498
  - UniProtKB:Q8N7U6
  review:
    summary: Calcium-sensor activity propagated from human EFHB; the fly protein lacks the calcium-binding
      loop on which that activity depends.
    action: REMOVE
    reason: The only seed is human EFHB, from a single cell-line study in which EFHB dissociates from STIM1
      in a Ca2+-dependent manner. Human EFHB has one canonical EF-hand calcium-binding loop (610
      DVDNDGFINYLE). In CG32086-RA the aligned positions lack it. Loop ligand positions 1 and 3 are
      leucine and valine instead of aspartates, position 12 is aspartate instead of the bidentate
      glutamate, and an insertion interrupts the loop. The two fly EFHB-subfamily paralogs also lack a
      canonical loop. This is target-specific loss of the structural feature that the propagated activity
      requires, so the inherited calcium-sensor claim does not hold for the fly protein. Metal binding by
      a non-canonical site cannot be excluded, but it would need direct evidence and would not be this
      inherited sensor activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN004335498
        source_label: PTN004335498
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeded by human EFHB alone (PMID:30481768). Human EFHB keeps a canonical calcium-binding
          loop; the fly EFHB-subfamily proteins, including CG32086, have lost its coordinating residues.
    supported_by:
    - reference_id: file:DROME/CG32086__Q8IQG0/CG32086__Q8IQG0-bioinformatics/RESULTS.md
      supporting_text: Q8IQG0 lacks the one canonical calcium-binding EF-hand loop of human EFHB.
    - reference_id: PMID:30481768
      supporting_text: EFHB interacts with STIM1 upon store depletion and dissociates through a Ca2+-dependent
        mechanism.
