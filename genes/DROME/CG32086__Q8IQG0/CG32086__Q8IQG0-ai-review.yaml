core_functions:
- description: Predicted microtubule inner protein of the sperm flagellar axoneme. By EFHB-subfamily
    membership and descent from the family-wide PAINT node for axonemal microtubule location, the protein
    is expected to bind the lumen of axonemal doublet microtubules in elongating spermatids and sperm.
    This is inferred, not experimentally established in Drosophila. Its molecular activity is unknown, and
    the calcium-sensor activity of human EFHB is not supported by the fly sequence.
  locations:
  - id: GO:0005879
    label: axonemal microtubule
  supported_by:
  - reference_id: file:DROME/CG32086/CG32086-bioinformatics/RESULTS-rereview.md
    supporting_text: So CG32086 sits in PTHR12086:SF12 (EF-HAND DOMAIN-CONTAINING FAMILY MEMBER B)
  - reference_id: PMID:38538594
    supporting_text: Another distinct repeat type named GFG-repeat was uncovered by our analysis of FAP21
      and its human homolog EFHB. These MIPs have been shown to localize to the cilia outer doublet
knowledge_gaps:
- gap_statement: Whether the CG32086 product is a microtubule inner protein of Drosophila sperm flagellar
    doublet microtubules, as its algal and vertebrate EFHB relatives are, is untested. Also untested are
    whether its non-canonical EF-hand region binds any metal ion, whether it keeps the GFG
    microtubule-binding repeats, and whether loss of function, alone or with its two EFHB-subfamily
    paralogs FBgn0053489 and FBgn0053490, has a phenotype.
  boundary: The gene is an EFHB-subfamily (PTHR12086:SF12) member expressed in elongating spermatids, and
    the encoded protein lacks the canonical calcium-binding EF-hand loop of human EFHB.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
suggested_questions:
- question: PAINT node PTN004335498 (calcium ion sensor activity, regulation of store-operated calcium
    entry) is placed at taxon Eukaryota on a single human EFHB seed. Should it be moved down to the
    vertebrate EFHB clade, given that the Drosophila EFHB-subfamily proteins lack the canonical
    calcium-binding loop?
- question: Is the mouse Efhb flagellated sperm motility IDA, which comes from cryo-EM localization rather
    than a motility assay, a sound seed for propagating a sperm motility process term across Eumetazoa?
suggested_experiments:
- description: Tag endogenous CG32086 and image elongating spermatids and mature sperm, and look for the
    protein in cryo-EM or proteomic analyses of fly sperm axonemal doublet microtubules.
  hypothesis: CG32086 is a microtubule inner protein of the sperm flagellar axoneme.
  experiment_type: localization
- description: Generate a CG32086 null allele, alone and combined with loss of the two EFHB-subfamily
    paralogs, and assay male fertility, sperm motility and axoneme ultrastructure.
  hypothesis: The fly EFHB-subfamily proteins are redundantly required for sperm axoneme stability.
  experiment_type: genetic loss of function
- description: Test calcium binding of purified CG32086 C-terminal EF-hand region by ITC or fluorescence
    spectroscopy, using the corresponding human EFHB region as a positive control.
  hypothesis: The fly EF-hand region does not bind calcium with physiologically relevant affinity.
  experiment_type: biochemical binding assay
