id: Q8IQG0
gene_symbol: CG32086
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG32086 (FlyBase FBgn0052086; synonym CG6100) encodes an uncharacterized Drosophila
  member of the EFHB (EF-hand domain-containing family member B, CFAP21) subfamily of the EFHC/EFHB
  protein family (PANTHER PTHR12086:SF12). Q8IQG0 is the 491-residue CG32086-RA product; a second
  isoform (M9NF85) lacks a 16-residue internal segment. The protein carries the C-terminal EFHB-type
  EF-hand domain (residues 415-485) but, unlike vertebrate EFHB, lacks a canonical calcium-binding
  EF-hand loop. The fly EFHB subfamily has two further paralogs (FBgn0053489, FBgn0053490). The gene is
  expressed in elongating spermatids, the cells that assemble the motile sperm flagellum. Vertebrate and
  algal EFHB proteins are microtubule inner proteins bound to the lumen of axonemal doublet
  microtubules, and the fly protein is predicted by subfamily membership to occupy the same location.
  No experimental study of the localization, binding activity or loss-of-function phenotype of CG32086
  has been reported; only high-throughput yeast two-hybrid and co-purification interactions exist.
