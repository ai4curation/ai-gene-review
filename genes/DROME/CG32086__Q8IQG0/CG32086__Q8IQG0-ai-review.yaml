- id: PMID:30481768
  title: EFHB is a Novel Cytosolic Ca2+ Sensor That Modulates STIM1-SARAF Interaction.
  findings:
  - statement: In human cell lines, EFHB interacts with STIM1 upon store depletion, dissociates in a
      calcium-dependent manner, and is required for full SOCE and NFAT nuclear translocation.
    supporting_text: EFHB interacts with STIM1 upon store depletion and dissociates through a Ca2+-dependent
      mechanism.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Sole experimental source for the calcium-sensor, SOCE and calcineurin-NFAT seeds (human
      EFHB) at PTN004335498 and PTN000949412. A single cell-line study (RNAi and overexpression), abstract
      only in the cache. Its Ca2+-dependent mechanism depends on an EF-hand loop that the fly protein
      does not keep.
