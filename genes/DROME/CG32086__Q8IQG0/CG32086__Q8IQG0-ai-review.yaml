- id: PMID:38538594
  title: Uncovering structural themes across cilia microtubule inner proteins with implications for
    human cilia function.
  findings:
  - statement: FAP21 (Chlamydomonas) and its human homolog EFHB are microtubule inner proteins of the
      ciliary outer doublet, bound to the tubulin lattice near the A-tubule seam through GFG repeats.
    supporting_text: Another distinct repeat type named GFG-repeat was uncovered by our analysis of FAP21
      and its human homolog EFHB. These MIPs have been shown to localize to the cilia outer doublet
  - statement: MIP-binding modules, including the GFG repeats, are conserved in ciliated species and
      absent from non-ciliated species.
    supporting_text: All MIP modules uncovered in our analysis are with few exceptions universally conserved
      in all ciliate species and excluded in non-ciliate species
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the axonemal MIP role of the EFHB/FAP21 lineage across algae and mammals,
      which is the deep phylogenetic basis for the axonemal microtubule IBA. Does not analyse insect EFHB
      proteins.
- id: PMID:37989994
  title: In-cell structural insight into the stability of sperm microtubule doublet.
  findings:
  - statement: In mouse sperm axonemal doublet microtubules, CFAP21 (EFHB) is modelled as an A-tubule MIP
      that may stabilise the A-tubule wall.
    supporting_text: The additional MIPs that may play the role of stabilizing A-tubule wall include MNS1,
