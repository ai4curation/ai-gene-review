id: P50536
gene_symbol: msl-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: msl-3 (male-specific lethal 3) encodes an MRG-family protein with an N-terminal chromo-barrel
  domain and a C-terminal MRG domain. In males MSL3 is a subunit of the MSL dosage compensation complex,
  bound to the scaffold MSL1. Its chromo-barrel domain recognizes histone H3 lysine 36 trimethylation
  (H3K36me3) on nucleosomes of transcribed genes, which lets the complex spread from its X-chromosome
  entry sites to the bodies and 3' ends of active X-linked genes, where MOF acetylates H4K16; the domain
  also binds mono- and dimethylated H4K20 in vitro. Loss of msl-3 is male-lethal. Independently of the
  rest of the MSL complex, MSL3 is expressed in the female germline, where it acts as an H3K36me3 reader
  that promotes transcription of genes needed for germline stem cell differentiation.
