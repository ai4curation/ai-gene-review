core_functions:
- description: Chromo-barrel histone reader that binds H3K36me3 nucleosomes and contributes to spreading
    of the MSL complex from entry sites to active genes along the male X chromosome; whether H3K36me3
    is an obligatory physiological spreading signal is contested by histone-replacement studies.
  molecular_function:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  directly_involved_in:
  - id: GO:0009047
    label: dosage compensation by hyperactivation of X chromosome
  locations:
  - id: GO:0000805
    label: X chromosome
  in_complex:
    id: GO:0072487
    label: MSL complex
  supported_by:
  - reference_id: PMID:17936709
    supporting_text: recombinant MSL3 protein preferentially binds nucleosomes marked by H3K36me3 in vitro
  - reference_id: PMID:19029895
    supporting_text: chromodomain mutants lack preferential affinity for nucleosomes containing H3K36me3
      in vitro
  - reference_id: file:DROME/msl-3/msl-3-deep-research-falcon.md
    supporting_text: A direct methyl-mark-to-spreading model is now contested.
- description: In the female germline, independently of the MSL complex, reads H3K36me3 and promotes transcription
    of genes such as RpS19b that drive germline stem cell differentiation.
  molecular_function:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
