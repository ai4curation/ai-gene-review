    label: nucleus
  supported_by:
  - reference_id: PMID:34878097
    supporting_text: Msl3, acting independently of the rest of the male-specific lethal complex, promotes
      transcription of genes, including a germline-enriched ribosomal protein S19 paralog RpS19b.
suggested_questions:
- question: Does MSL3 bind H4K16ac-containing nucleosomes at all, given that H4K16 acetylation antagonizes
    binding of its chromodomain to H4K20me1 in vitro?
- question: How do H3K36me3 and H4K20me1 recognition by the MSL3 chromo-barrel combine in vivo to direct
    MSL spreading?
suggested_experiments:
- description: Nucleosome pull-downs with recombinant MSL3 on designer nucleosomes carrying H3K36me3,
    H4K20me1 and H4K16ac alone and in combination, with DNA present, to define its combinatorial reading
    preference.
