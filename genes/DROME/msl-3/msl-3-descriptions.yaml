descriptions:
- source: UniProt
  text: 'Component of the male-specific lethal (MSL) histone acetyltransferase complex,
    a multiprotein complex essential for elevating transcription of the single X chromosome
    in the male (X chromosome dosage compensation) (PubMed:17936709, PubMed:19029895,
    PubMed:7768187). The MSL complex specifically associates with the single X chromosome
    in males and mediates formation of H4K16ac, promoting a two-fold activation of
    X chromosome (PubMed:16543150, PubMed:18510926). Acts as a histone reader that
    specifically recognizes and binds histone H3 trimethylated at ''Lys-36'' (H3K36me3)
    and histone H4 monomethylated at ''Lys-20'' (H4K20me1) (PubMed:17936709, PubMed:19029895).
    Within the MSL complex, mediates the spreading of the MSL complex from initiation
    sites on the male X chromosome to flanking chromatin (PubMed:19029895). Following
    initial recruitment of the MSL complex to male X chromosome by msl-2, msl-3 binds
    H3K36me3 and promotes spreading of the MSL complex in cis (PubMed:19029895). In
    addition to its role in dosage compensation in males, promotes germline stem cell
    differentiation in females: recognizes and binds H3K36me3, promoting recruitment
    of the ATAC complex and transcription of genes, such as RpS19b (PubMed:34878097).'
  source_type: curated
