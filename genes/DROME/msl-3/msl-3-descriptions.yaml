- source: Alliance_Imported
  text: male-specific lethal 3 (msl-3) encodes a chromodomain protein, reported to
    interact with H3K36me3, H4K20me1 and DNA. It is a member of the Male-Specific-Lethal
    dosage compensation complex, which increases male X chromosome transcription approximately
    two-fold. Homozygous mutant males die as larvae, while females are viable.
