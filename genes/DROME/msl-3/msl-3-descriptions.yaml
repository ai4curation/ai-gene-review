- source: Alliance_Automated
  text: Enables chromatin binding activity; histone reader activity; and lncRNA binding
    activity. Involved in dosage compensation by hyperactivation of X chromosome;
    oocyte development; and regulation of hemocyte proliferation. Located in chromocenter
    and nuclear chromosome. Part of MSL complex and X chromosome located dosage compensation
    complex, transcription activating. Is active in X chromosome. Human ortholog(s)
    of this gene implicated in Basilicata-Akhtar syndrome. Orthologous to several
    human genes including MSL3 (MSL complex subunit 3).
