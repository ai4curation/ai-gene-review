suggested_questions:
- question: FlyBase attaches phenotypes of the R* dominant PKA inhibitor (a mutant Pka-R1 transgene) to
    Pka-R1. Should GO annotations from R* experiments go to the catalytic subunit Pka-C1, or to Pka-R1
    with the opposite sign, or to neither?
- question: Do the N-terminally truncated Pka-R1 isoforms, which lack the dimerization/docking domain,
    form holoenzymes and have distinct localizations or tissue roles?
- question: Does Pka-R1 bind radial spoke protein 3 or other AKAPs through its dimerization/docking domain
    in vivo, for example in testis axonemes, as type I R subunits do in mammals?
suggested_experiments:
- description: Measure cAMP binding and catalytic-subunit release with purified wild-type and R* (G196E/G321D)
    Pka-R1 and Pka-C1, to give direct fly evidence for the two core activities.
- description: 'Test Pka-R1 loss of function (null or tissue-specific RNAi) for the processes now annotated
    only from R* overexpression: oocyte actin and microtubule polarity, larval molting and feeding.'
