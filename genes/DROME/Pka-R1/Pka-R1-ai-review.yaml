  title: UniProt entry P16905 (Pka-R1)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reviewed Swiss-Prot entry. SUBUNIT and PTM comments, the domain features (D/D region,
      pseudophosphorylation motif, two cAMP-binding domains) and the family assignment agree with the
      review. The entry has no FUNCTION comment.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P16905
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:P16905
      confidence: CONFIRMED
      explanation: 'The reviewed entry has no FUNCTION comment. Fly evidence supports one: Pka-R1 is the
        type I regulatory subunit of PKA, loss of which raises cAMP-independent PKA activity in adult
        heads (PMID:9348350) and causes premature, ectopic Oskar accumulation in the oocyte that is suppressed
        by reducing catalytic subunit dosage (PMID:14993189); mutants are defective in olfactory learning.
        A sentence on inhibition of the catalytic subunit in the absence of cAMP, and on these phenotypes,
        should be added.'
      supported_by:
      - reference_id: PMID:9348350
        supporting_text: PKA activity in the absence of exogenous cAMP also was significantly higher than
          normal in homogenates from mutant adult heads.
      - reference_id: PMID:14993189
        supporting_text: This phenotype is due to misregulation of PKA catalytic subunit activity and
          is suppressed by reducing catalytic subunit gene dosage.
      - reference_id: PMID:9348350
        supporting_text: Flies homozygous for either of two mutant alleles showed specific defects in
          olfactory learning but not in subsequent memory decay.
- id: file:DROME/Pka-R1/Pka-R1-deep-research-flybase.md
  title: FlyBase gene description for Pka-R1 (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Checked each claim. 'cAMP-dependent protein kinase regulator' is correct (PMID:3215511,
      PMID:9348350). 'Contributes to actin filament and microtubule organization' traces to Baum et al.
      2000 (PMID:10985383), whose only Pka-R1 experiment was germline overexpression of the R* PKA inhibitor
      to phenocopy the pka-C1 null; it describes PKA catalytic activity, not Pka-R1. Of the second sentence,
      molting (PMID:11333238) is a dominant-negative PKA phenotype, the synaptic transmission paper (PMID:15295025)
      concerns central interneuron-motoneuron synapses and does not mention PKA in its abstract, and the
      ethanol paper (PMID:18675322) is about PKC; none is a Pka-R1 loss-of-function finding. The text
      omits the inhibitory mechanism and the genuine mutant phenotypes (olfactory learning, courtship
      memory, Oskar restriction).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0259243
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Protein kinase, cAMP-dependent, regulatory subunit type 1 (Pka-R1) encodes a cAMP-dependent
        protein kinase regulator that contributes to actin filament and microtubule organization.
      confidence: PROBABLE
      explanation: 'The actin and microtubule claim comes from Baum et al. 2000 (PMID:10985383), where
        the only Pka-R1 experiment was germline expression of UAS-pka-R1 (the R* dominant PKA inhibitor)
        to phenocopy the pka-C1 null; the organization defects belong to loss of PKA catalytic activity.
        No Pka-R1 loss-of-function study reports an actin or microtubule defect; the documented oocyte
        phenotype of Pka-R1 mutants is premature, ectopic Oskar accumulation caused by excess catalytic
        subunit activity. Suggested wording: ''...encodes the type I regulatory subunit of PKA, which
        binds cAMP and inhibits the catalytic subunit Pka-C1 in its absence.'' Confidence is PROBABLE
        because the methods text was read from the authors'' PDF and is not in the cached abstract.'
      supported_by:
      - reference_id: PMID:14993189
        supporting_text: Mutations in PKA-R1 cause premature and ectopic accumulation of Oskar protein
          throughout the oocyte.
      - reference_id: PMID:14993189
        supporting_text: This phenotype is due to misregulation of PKA catalytic subunit activity and
          is suppressed by reducing catalytic subunit gene dosage.
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0259243
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: It is involved in neuromuscular synaptic transmission, molting and response to ethanol.
      confidence: PROBABLE
      explanation: The three processes come from experiments that do not test Pka-R1 itself. The molting
        study (PMID:11333238) used dominant-negative and dominant-active PKA transgenes; the synaptic
        study (PMID:15295025) concerns transmission between central interneurons and motoneurons, not
        neuromuscular synapses, and its abstract does not mention PKA; the ethanol study (PMID:18675322)
        is about PKC in NPF neurons. The best-supported Pka-R1 processes are olfactory learning and courtship
        memory (PMID:9348350, PMID:10858819) and restriction of Oskar to the oocyte posterior (PMID:14993189).
      supported_by:
      - reference_id: PMID:11333238
        supporting_text: The two pathways act in parallel to affect molting, as judged by phenotypes obtained
          through expression of dominant negative and dominant active forms of protein kinase A (PKA)
          in tissues that normally express the InsP(3) receptor.
      - reference_id: PMID:15295025
        supporting_text: To test this hypothesis, retrograde signaling between postsynaptic motoneurons
          and their presynaptic interneurons is examined.
      - reference_id: PMID:18675322
        supporting_text: Here we report a critical role of the conserved protein kinase C (PKC) pathway
          in mediating the intoxicating effect of ethanol.
      - reference_id: PMID:9348350
        supporting_text: Flies homozygous for either of two mutant alleles showed specific defects in
          olfactory learning but not in subsequent memory decay.
