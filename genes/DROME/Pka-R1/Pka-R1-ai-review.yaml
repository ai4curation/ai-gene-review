- term:
    id: GO:2000253
    label: positive regulation of feeding behavior
  evidence_type: IGI
  original_reference_id: PMID:22876196
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0036934
  review:
    summary: Positive regulation of feeding behavior, from sNPF/sNPFR1-Gs-PKA-CREB signalling to minibrain.
    action: MARK_AS_OVER_ANNOTATED
    reason: The experiment overexpressed a Pka-R1 transgene as a dominant inhibitor of PKA (R*, a Pka-R1
      mutant in both cAMP-binding sites that locks the catalytic subunit in the holoenzyme). The phenotype
      shows that PKA catalytic activity is needed, not that endogenous Pka-R1 acts in the process; wild-type
      Pka-R1 restrains PKA, so its own effect, if any, would be expected in the opposite direction. The
      full text is cached and names the construct as a dominant-negative form of PKA; the signalling chain
      it supports is sNPFR1 to Gs, PKA and CREB.
    supported_by:
    - reference_id: PMID:22876196
      supporting_text: UAS-PKA-DN (a dominant-negative form of PKA)
    - reference_id: PMID:22876196
      supporting_text: In sNPFR1 neurons of flies, as in isolated cells, Gαs, PKA, and CREB may work downstream
        of sNPFR1 to regulate mnb expression.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: FLYBASE
      requested_change: CHECK
      asserted_value: FB:FBgn0259243
      cause: OTHER
      confidence: PROBABLE
      explanation: The paper expressed UAS-PKA-DN, the R* transgene (Pka-R1 mutated in both cAMP-binding
        sites), as a dominant inhibitor of PKA in sNPFR1 neurons and found reduced feeding. That result
        reports a requirement for PKA catalytic activity (Pka-C1), not an activity of endogenous Pka-R1,
        and the positive sign is the opposite of what an inhibitory regulatory subunit would contribute.
        Consider moving the annotation to the catalytic subunit or dropping it from Pka-R1.
      supported_by:
      - reference_id: PMID:22876196
        supporting_text: UAS-PKA-DN (a dominant-negative form of PKA)
      - reference_id: PMID:22876196
        supporting_text: In sNPFR1 neurons of flies, as in isolated cells, Gαs, PKA, and CREB may work
          downstream of sNPFR1 to regulate mnb expression.
