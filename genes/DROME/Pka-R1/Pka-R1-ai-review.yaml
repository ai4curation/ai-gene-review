  review:
    summary: cAMP-dependent protein kinase inhibitor activity inherited from PTN004280545, the eukaryotic
      PKA regulatory-subunit clade.
    action: ACCEPT
    reason: 'IBA verdict: inherited. PTN004280545 contains all PKA R subunits (vertebrate RIalpha/beta
      and RIIalpha/beta, fly Pka-R1 and Pka-R2, worm KIN-2, yeast Bcy1, fission yeast Cgs1); Pka-R1 sits
      in its bilaterian RI branch with PRKAR1A, keeps the pseudosubstrate motif and both cAMP-binding
      domains, and no loss is recorded on its lineage. Fly evidence confirms the inhibitory role: basal
      (cAMP-independent) PKA activity is raised in Pka-R1 mutant heads, and the Oskar defect of Pka-R1
      mutants is due to misregulated catalytic subunit activity and is suppressed by lowering catalytic
      subunit dosage.'
