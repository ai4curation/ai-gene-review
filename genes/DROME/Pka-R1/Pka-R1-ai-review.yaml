id: P16905
gene_symbol: Pka-R1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Pka-R1 encodes the single type I regulatory subunit (RI) of cAMP-dependent protein kinase
  (PKA) in Drosophila, about 70% identical to mammalian RI. Alternative promoters and splicing give a
  full-length protein and N-terminally truncated forms. The full-length protein has an N-terminal dimerization
  and docking domain, a pseudosubstrate segment that occupies the catalytic site of the PKA catalytic
  subunit, and two tandem cAMP-binding domains. In the absence of cAMP two Pka-R1 subunits hold two catalytic
  subunits (chiefly Pka-C1) in an inactive R2C2 holoenzyme in the cytoplasm; binding of cAMP, produced
  by receptor-activated adenylyl cyclase, releases active catalytic subunits. Pka-R1 thus sets basal PKA
  activity and couples it to cAMP: Pka-R1 mutants have raised cAMP-independent PKA activity, defective
  olfactory learning and short-lived courtship memory, and premature, ectopic accumulation of Oskar protein
  in the oocyte, which is suppressed by reducing catalytic subunit dosage. Pka-R1 mutants also alter neuropeptide-neuron
  marker expression in the ventral nerve cord. A Pka-R1 form mutated in both cAMP-binding sites (R*) is
  the standard transgenic inhibitor of PKA in flies, and many PKA-dependent phenotypes, in Hedgehog signalling,
  oocyte cytoskeleton, molting and feeding, were obtained with it.'
