findings:
- category: discrepancy
  text: FlyBase and the automated text credit Pka-R1 with actin, microtubule or cytoskeleton
    organization; the review traces this to germline overexpression of the R* PKA inhibitor
    in Baum et al. 2000, which reports a requirement for PKA catalytic activity, and marks the
    rows as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: FlyBase lists neuromuscular synaptic transmission, molting and response to ethanol;
    the review finds no Pka-R1 loss-of-function evidence for any of them (dominant-negative
    PKA for molting, central synapses and an unseen experiment for transmission, a PKC paper
    for ethanol).
  sources:
  - Alliance_Imported
- category: gap
  text: 'No text says how Pka-R1 works: it binds and inhibits the catalytic subunit in the R2C2
    holoenzyme and releases it when cAMP binds its two cyclic-nucleotide-binding domains.'
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: None of the texts mentions the oocyte phenotype of Pka-R1 mutants, premature and ectopic
    Oskar accumulation caused by excess catalytic subunit activity, or the courtship memory
    defect.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: insight
  text: Many PKA-dependent phenotypes in flies were obtained with R*, a Pka-R1 transgene mutated
    in both cAMP-binding sites, and FlyBase attaches them to Pka-R1; this explains why the curated
    description lists processes that Pka-R1 mutants were never shown to affect.
  sources:
  - Alliance_Imported
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: The texts agree that Pka-R1 is a PKA regulator. The FlyBase text and, to a
    lesser degree, the automated text describe its roles through phenotypes of a PKA-inhibitor
    transgene, while the review rests on Pka-R1 mutant data.
