descriptions:
- source: Alliance_Imported
  text: Protein kinase, cAMP-dependent, regulatory subunit type 1 (Pka-R1) encodes a cAMP-dependent
    protein kinase regulator that contributes to actin filament and microtubule organization.
    It is involved in neuromuscular synaptic transmission, molting and response to ethanol.
  source_type: curated
  url: https://flybase.org/reports/Pka-R1.html
  source_id: FB:FBgn0259243
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 2
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Calls Pka-R1 a cAMP-dependent protein kinase regulator, which is correct,
      but every process it then names comes from experiments that did not test Pka-R1 itself:
      actin and microtubule organization and molting are phenotypes of the R* dominant PKA inhibitor,
      the synaptic paper concerns central synapses, and the ethanol paper is about PKC. Omits
      the inhibitory mechanism, cAMP binding and the genuine mutant phenotypes (olfactory learning,
      courtship memory, Oskar restriction).'
- source: Alliance_Automated
  text: Enables cAMP-dependent protein kinase regulator activity. Involved in several processes,
    including cytoskeleton organization; olfactory learning; and regulation of smoothened signaling
    pathway. Located in cytoplasm. Is expressed in several structures, including Malpighian
    tubule primordium; adult head; embryonic/larval midgut; female germline cell; and ovary.
    Human ortholog(s) of this gene implicated in Carney complex; adrenal gland hyperfunction;
    connective tissue disease (multiple); disease of mental health; and primary pigmented nodular
    adrenocortical disease 1. Orthologous to several human genes including PRKAR1B (protein
    kinase cAMP-dependent type I regulatory subunit beta).
  source_type: automated
  url: https://flybase.org/reports/Pka-R1.html
  source_id: FB:FBgn0259243
