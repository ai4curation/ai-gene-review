id: Q9W429
gene_symbol: Efr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Efr (ER GDP-fucose transporter; CG3774) is the Drosophila ortholog of human SLC35B4, a multi-pass
  nucleotide-sugar transporter retained in the endoplasmic reticulum by a C-terminal dilysine motif. Efr
  transports GDP-fucose, UDP-N-acetylglucosamine and UDP-xylose but not CMP-sialic acid, UDP-glucuronate,
  GDP-mannose or UDP-glucose. By importing GDP-fucose into the ER lumen it supplies O-fucosyltransferase
  1 for O-fucosylation of Notch EGF repeats, redundantly with the Golgi transporter Gfr, and it is also
  required for heparan sulfate glycosaminoglycan chain synthesis, consistent with UDP-xylose and UDP-GlcNAc
  supply. Unlike Gfr, Efr contributes little to N-glycan fucosylation.
