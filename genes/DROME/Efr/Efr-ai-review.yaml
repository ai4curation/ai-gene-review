core_functions:
- description: Efr is an ER-resident SLC35B4-type transporter that imports cytosolic GDP-fucose into the
    ER lumen, supplying O-fut1 for Notch O-fucosylation redundantly with Gfr.
  molecular_function:
    id: GO:0005457
    label: GDP-fucose transmembrane transporter activity
  directly_involved_in:
  - id: GO:0036084
    label: GDP-fucose import into endoplasmic reticulum lumen
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:19948734
    supporting_text: We also found that Gfr and Efr function redundantly in the O-fucosylation of Notch
    reference_section_type: ABSTRACT
- description: Efr also transports UDP-xylose and UDP-N-acetylglucosamine, consistent with its requirement
    for heparan sulfate glycosaminoglycan chain synthesis.
  molecular_function:
    id: GO:0005464
    label: UDP-xylose transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015790
    label: UDP-xylose transmembrane transport
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:19948734
    supporting_text: Efr is a multifunctional nucleotide sugar transporter involved in the biosynthesis
      of heparan sulfate-glycosaminoglycan chains
    reference_section_type: ABSTRACT
suggested_questions:
- question: Is the heparan sulfate defect of Efr mutants due to loss of UDP-xylose import (needed by O-xylosyltransferase
    Oxt in the ER) or of UDP-GlcNAc import?
suggested_experiments:
- description: Compare HS chain initiation (xylosylation) and elongation in Efr mutant discs rescued with
    Efr variants engineered to lose UDP-xylose versus UDP-GlcNAc transport.
