descriptions:
- source: UniProt
  text: Sugar transporter that specifically mediates the transport of UDP-N-acetylglucosamine
    (UDP-GlcNAc), GDP-fucose and UDP-xylose. Functions redundantly with Gfr in the
    O-fucosylation of Notch, positively regulating Notch signaling. Involved in the
    biosynthesis of heparan sulfate-glycosaminoglycan (HS-GAG) and in Dpp signaling
    in the wing imaginal disk.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W429
  source_id: Q9W429
