- source: Alliance_Automated
  text: Enables GDP-fucose transmembrane transporter activity; UDP-N-acetylglucosamine
    transmembrane transporter activity; and UDP-xylose transmembrane transporter activity.
    Involved in GDP-fucose transmembrane transport; UDP-N-acetylglucosamine transmembrane
    transport; and UDP-xylose transmembrane transport. Is active in endoplasmic reticulum
    membrane. Is expressed in adult head. Orthologous to human SLC35B4 (solute carrier
    family 35 member B4).
