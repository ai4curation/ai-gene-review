  text: ER GDP-fucose transporter (Efr) encodes a multifunctional endoplasmic reticulum
    nucleotide sugar transporter that transports GDP-fucose, UDP-N-acetylglucosamine
    and UDP-xylose from the cytosol into the ER lumen.
