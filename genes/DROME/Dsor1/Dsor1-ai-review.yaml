id: Q24324
gene_symbol: Dsor1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Dsor1 encodes the Drosophila MEK/MAP2K in the canonical Ras/Raf/ERK cascade.
  Raf-dependent activation of Dsor1 allows this dual-specificity kinase to
  phosphorylate and activate Rolled/ERK, transmitting EGFR, Torso, Sevenless,
  Pvr, FGF, and other receptor inputs to ERK-dependent developmental and
  stress-response outputs.
