    overall_notes: 'Correct and concise: MAP kinase kinase activated by Raf, downstream
      of Torso, Egfr and Sevenless.'
- source: Alliance_Automated
  text: Enables MAP kinase kinase activity and kinase binding activity. Involved in
    several processes, including cell surface receptor protein tyrosine kinase signaling
    pathway; intracellular signal transduction; and regionalization. Located in condensed
    chromosome. Colocalizes with nuclear envelope. Is expressed in adult brain; adult
    head; and adult pars intercerebralis. Used to study RASopathy and cancer. Human
    ortholog(s) of this gene implicated in several diseases, including carcinoma (multiple);
    cardiofaciocutaneous syndrome 3; cardiofaciocutaneous syndrome 4; high grade glioma;
    and melorheostosis. Orthologous to human MAP2K1 (mitogen-activated protein kinase
    kinase 1) and MAP2K2 (mitogen-activated protein kinase kinase 2).
  source_type: automated
