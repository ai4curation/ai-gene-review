    overall_notes: 'Dated but correct: acts downstream of Raf in Sevenless, Torso
      and EGFR pathways and regulates tll. Does not say it is a MEK that phosphorylates
      ERK/Rolled.'
- source: Alliance_Imported
  text: Downstream of raf1 (Dsor1) encodes a serine/threonine kinase that phosphorylates
    MAP kinase. It is activated by the product of Raf and acts downstream of receptor
    tyrosine kinases such as those encoded by tor, Egfr, and sev.
  source_type: curated
  url: https://flybase.org/reports/Dsor1.html
  source_id: FB:FBgn0010269
