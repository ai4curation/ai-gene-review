descriptions:
- source: UniProt
  text: Required downstream of Raf in the sevenless (sev), torso (tor), and Drosophila
    EGF receptor homolog (DER) signal transduction pathways. Involved in both positive
    regulation (at the posterior terminus) and negative regulation (at the anterior
    domain) of tll, as in other terminal class gene products, maybe via the ERK-A
    kinase.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24324
  source_id: Q24324
