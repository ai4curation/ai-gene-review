- id: PMID:9811580
  title: The transcription factors KNIRPS and KNIRPS RELATED control cell migration
    and branch morphogenesis during Drosophila tracheal development.
  findings:
  - statement: knirps/knirps-related redundantly control tracheal cell migration and dorsal/ventral
      branch formation, mediating Dpp signaling and repressing spalt.
    supporting_text: knirps/knirps related activity is necessary to mediate DPP signaling which
      is required for tracheal cell migration and formation of the dorsal and ventral branches
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary tracheal-development paper; abstract available. Supports the tracheal
      cell migration/branching role and direct repression of spalt.
suggested_questions:
- question: What are the direct, physiological genome-wide target genes of Knirps in the
    abdominal segmentation network versus in the trachea and gut, and how much target selection
    is shared with its paralog knrl?
- question: Does Knirps have any endogenous small-molecule ligand or regulatory metabolite
    despite lacking a canonical ligand-binding domain, or is it strictly a constitutive orphan
    factor?
suggested_experiments:
- description: ChIP-seq plus tissue-specific RNA-seq of knirps loss- and gain-of-function in
    blastoderm, tracheal primordia, and gut to define direct targets and separate core
    (segmentation) from redeployed (tracheal/gut) regulatory programs.
- description: Structure-guided separation-of-function mutants of the dCtBP (PxDLS) and Groucho
    (eh1-like) motifs to quantify the contribution of each corepressor to repression at distinct
    enhancers in vivo.
