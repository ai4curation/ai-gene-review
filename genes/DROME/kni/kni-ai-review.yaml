id: P10734
gene_symbol: kni
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Knirps (Kni) is a Drosophila melanogaster zinc-finger transcription factor and a member of
  the nuclear receptor superfamily (subfamily NR0A). Unlike canonical nuclear receptors it
  consists essentially of a single N-terminal C4-type (two-zinc-finger) DNA-binding domain
  followed by a largely intrinsically disordered region, and it lacks a C-terminal
  ligand-binding domain; it therefore behaves as a ligand-independent ("orphan")
  sequence-specific factor rather than a hormone-activated receptor. Knirps acts in the nucleus
  as a short-range transcriptional repressor: bound to cis-regulatory elements it locally
  quenches nearby activators and blocks basal promoters over distances of about 100 bp, an
  activity it executes by recruiting the corepressors dCtBP (via a C-terminal PxDLS-type motif)
  and Groucho (via an eh1-like motif). As one of the zygotic gap genes it patterns the
  anterior-posterior axis of the embryonic trunk/abdomen by refining the expression boundaries
  of other gap genes and establishing pair-rule stripes such as even-skipped. Beyond early
  segmentation it is redeployed in later development: acting redundantly with its paralog
  Knirps-related (knrl) it directs tracheal cell migration and dorsal/ventral branch
  morphogenesis (in part by repressing spalt downstream of Dpp signaling), and it spatially
  restricts endoreduplication domains in the developing fore- and hindgut by repressing S-phase
  genes.
