      retrievable (publisher restriction and PMC bot check).
- id: PMID:26362788
  title: Proteomic mapping in live Drosophila tissues using an engineered ascorbate peroxidase.
  findings:
  - statement: Matrix-targeted APEX proximity labelling in live fly muscle identifies the
      mitochondrial matrix proteome; Srlp is among the matrix proteins (source of the FlyBase
      IDA annotation).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; method specifically maps matrix versus whole-mitochondrion
      proteins. The Srlp-specific hit is in the supplementary inventory, which is not cached.
- id: PMID:30931935
  title: Srlp is crucial for the self-renewal and differentiation of germline stem cells via RpL6
    signals in Drosophila testes.
  findings:
  - statement: CRISPR deletion of Srlp is homozygous lethal; heterozygotes are viable and fertile.
    supporting_text: The homozygous Srlp mutation was lethal
  - statement: Srlp RNAi in early germ cells (nos-Gal4) or cyst cells (tj-Gal4) disrupts germline
      stem cell maintenance and differentiation in the testis.
  - statement: Overexpressed HA-tagged Srlp co-purifies RpL6 and many other proteins (205 hits) in
      S2 cells; co-IP confirms association with RpL6. Srlp knockdown or overexpression changes
      mRNA levels of spliceosome and ribosome subunits. The paper names the gene
      Spliceosome-Ribosome Linker Protein on this basis.
    supporting_text: Results of the co-immunoprecipitation assay confirmed that the Srlp protein
      could combine with the RpL6 protein
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Full text cached. Phenotypes (lethality, testis GSC defects) are informative about
      requirement but not about mechanism. The RpL6 association comes from pull-down of an
      overexpressed tagged protein from whole S2 cells, a setting in which a mitochondrial matrix
      protein is exposed to cytosolic ribosomes after lysis; no subcellular localisation of Srlp
      was performed. The "spliceosome-ribosome linker" mechanism rests on mRNA-level changes and
      is not supported by direct functional assays. FlyBase has not made GO annotations from this
      paper, and this review does not add any.
- id: file:DROME/Srlp/Srlp-bioinformatics/RESULTS.md
  title: Srlp active-site and family-placement check
  findings:
  - statement: Srlp is in PANTHER PTHR43802:SF1 with CG5611 (54.9% identity over aligned
      columns), retains the first crotonase catalytic glutamate (E158) but has Met at the
      position of the second catalytic glutamate of enoyl-CoA hydratase (ECHS1 E164), and has a
      presequence-like N-terminus.
    supporting_text: sequence evidence does not support assigning enoyl-CoA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible script fetching sequences live from UniProt; pairwise alignment
      at about 30% identity is approximate.
core_functions:
- description: >-
    Srlp is a mitochondrial matrix protein with a crotonase fold whose molecular activity is
    unknown. Matrix residence is experimentally established in Drosophila; no enzymatic or
    binding activity has been demonstrated, and sequence evidence (loss of the second catalytic
    glutamate of enoyl-CoA hydratase, heterogeneous SF1 chemistry) does not support assigning a
    specific reaction.
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:26362788
    supporting_text: we demonstrate that this approach can be used effectively in vivo to analyze
      the Drosophila mitochondrial matrix proteome
  - reference_id: file:DROME/Srlp/Srlp-bioinformatics/RESULTS.md
    supporting_text: Whether Srlp is catalytic at all
  knowledge_gaps:
  - gap_statement: The biochemical activity and substrate of Srlp are unknown; it is not known
      whether the crotonase fold is catalytically active given loss of the second catalytic
      glutamate.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Srlp catalytically active, and if so on which acyl-CoA or non-CoA substrate,
    given that it keeps the first but not the second catalytic glutamate of enoyl-CoA hydratase?
- question: Is the reported Srlp-RpL6 association physiological, given that Srlp is a
    mitochondrial matrix protein and the association was detected only after cell lysis with
    overexpressed protein? Could it reflect mitochondrial ribosomes rather than cytosolic RpL6?
- question: Are the testis germline stem cell and lethality phenotypes secondary to a
    mitochondrial metabolic defect?
suggested_experiments:
- description: Purify recombinant mature Srlp (lacking the presequence) and screen enoyl-CoA
    hydratase, isomerase and acyl-CoA hydrolase activities against a panel of short- and
    medium-chain and branched acyl-CoAs; test E158 and the M185 position by mutagenesis.
  experiment_type: biochemical activity assay
- description: Confirm submitochondrial localisation of endogenously tagged Srlp by imaging and
    protease-protection assays, and profile acyl-CoA and acylcarnitine levels in Srlp mutant
    or knockdown tissue to identify the affected metabolic pathway.
  experiment_type: localisation and metabolomics
