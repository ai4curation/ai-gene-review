id: Q9VG69
gene_symbol: Srlp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Srlp (CG5844) encodes a 378-residue protein made of an Arg/Lys-rich, acid-free N-terminal
  segment resembling a mitochondrial presequence, a single crotonase-fold
  (enoyl-CoA hydratase/isomerase-like, Pfam PF00378) domain, and a disordered, highly charged
  C-terminal tail. It belongs to PANTHER subfamily PTHR43802:SF1 together with its fly paralog
  CG5611, C. elegans ech-3, and bacterial crotonase-fold enzymes of differing chemistry. The
  protein has been identified in the mitochondrial matrix of fly muscle by in vivo APEX proximity
  labelling. Its biochemical activity is unknown: it keeps the first catalytic glutamate of the
  crotonase fold but has methionine at the position of the second catalytic glutamate of
  canonical enoyl-CoA hydratase, so a hydratase reaction cannot be assumed. Loss-of-function
  studies report that the gene is essential (homozygous CRISPR deletion is lethal), that germline
  or cyst-cell RNAi disrupts germline stem cell maintenance and differentiation in the testis,
  and that knockdown in S2 cells impairs suppression of translation during hypoxia. The name
  "spliceosome-ribosome linker protein" comes from a pull-down/mass-spectrometry study of an
  overexpressed tagged protein that co-purified ribosomal protein RpL6; this name does not
  describe an established molecular function and fits poorly with the matrix localisation.
existing_annotations:
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IDA
  original_reference_id: PMID:26362788
  qualifier: located_in
  review:
    summary: >-
      Srlp was detected in the mitochondrial matrix proteome of Drosophila muscle using a
      matrix-targeted APEX proximity-labelling system. The N-terminus has the composition of a
      mitochondrial presequence (5 Arg/Lys, no acidic residues in the first 30 residues), which
      independently supports import into mitochondria.
    action: ACCEPT
    reason: >-
      Direct in vivo experimental localisation by FlyBase curators from a full-text paper whose
      method specifically distinguishes matrix from whole-mitochondrion proteins, consistent with
      the presequence-like N-terminus found in our sequence analysis. This is the only
      experimentally established cellular location for Srlp and is the most reliable
      experimental fact about the protein; it is suitable as a reference for transfer within
      PTHR43802:SF1 only together with presequence evidence in the recipient.
    supported_by:
    - reference_id: PMID:26362788
      supporting_text: we demonstrate that this approach can be used effectively in vivo to analyze
        the Drosophila mitochondrial matrix proteome
    - reference_id: file:DROME/Srlp/Srlp-bioinformatics/RESULTS.md
      supporting_text: a composition typical of a cleavable mitochondrial presequence
- term:
    id: GO:0071456
    label: cellular response to hypoxia
  evidence_type: IMP
  original_reference_id: PMID:18653470
  qualifier: involved_in
  review:
    summary: >-
      CG5844 was a hit in a genome-wide S2-cell RNAi screen for genes needed to down-regulate
      translation during hypoxia; knockdown allowed continued induction of a GFP reporter under
      hypoxia. The cached copy of the paper is abstract-only and does not name CG5844, so the
      strength and specificity of the CG5844 result could not be checked here.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is a single-screen loss-of-function phenotype made by FlyBase curators who
      read the full text, so it is retained rather than second-guessed. It is not core: it
      reports that the protein is needed for the hypoxic shutdown of translation in cultured
      cells, not what Srlp does. A mitochondrial matrix protein of unknown enzymatic activity may
      influence this response indirectly (for example through mitochondrial metabolism or
      oxygen sensing), and the screen does not place Srlp in the signalling route (Tsc1/Tsc2,
      Ptp61F, TOR) that the paper characterises. The function is experimentally reported only for
      Drosophila S2 cells and should not be transferred to relatives without independent evidence.
    supported_by:
    - reference_id: PMID:18653470
      supporting_text: We carried out a genome-wide RNA interference (RNAi) screen in Drosophila
        S2 cells for functions required to down-regulate translation during hypoxia
references:
- id: PMID:18653470
  title: An RNA interference screen identifies a novel regulator of target of rapamycin that
    mediates hypoxia suppression of translation in Drosophila S2 cells.
  findings:
  - statement: Genome-wide S2-cell RNAi screen for genes required to suppress translation during
      hypoxia; CG5844/Srlp is the source of the FlyBase IMP annotation to cellular response to
      hypoxia.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract-only in cache; the abstract does not mention CG5844, so the gene-level
