    reason: 'IBA verdict: inherited, as a non-core role. The node contains only TH orthologs. The enzyme
      performs no step of learning itself, but GO''s practice for transmitter-synthesising enzymes is to
      annotate the learning and memory processes their product is needed for: fly Ddc and Hn and mouse Dbh
