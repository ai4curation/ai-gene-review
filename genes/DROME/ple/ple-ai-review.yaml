- id: file:DROME/ple/ple-deep-research-flybase.md
  title: FlyBase gene description for ple (DROME)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Three sentences. Traced: tyrosine hydroxylase converting L-tyrosine to L-DOPA as the
      first, rate-limiting step of dopamine synthesis (PMID:10358021, 12555273); dopamine as a neurotransmitter
      (PMID:12555273, 21187381); dopamine and L-DOPA as precursors of melanin and of the sclerotization precursors
      NADA and NBAD (PMID:16299587, 21808060, 21187381). "Cytosolic" rests on the cytosolic-zinc control of
      fly TH (PMID:34732185) and on vertebrate TH; no fly fractionation study was found. The text omits the
      two tissue-specific isoforms and the essential epidermal role. The served text writes beta as the unrendered
      entity "&bgr;". No claim is wrong.'
core_functions:
- description: Neuronal tyrosine 3-monooxygenase (DTH I) that hydroxylates L-tyrosine to L-DOPA in the cytoplasm
    of dopaminergic neurons, the rate-limiting step of dopamine synthesis, providing the fly's only catecholamine
    neurotransmitter.
  molecular_function:
    id: GO:0004511
    label: tyrosine 3-monooxygenase activity
  directly_involved_in:
  - id: GO:0006585
    label: dopamine biosynthetic process from tyrosine
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0043204
    label: perikaryon
  - id: GO:0030424
    label: axon
  supported_by:
  - reference_id: PMID:10358021
    supporting_text: The recombinant DTH isoforms are enzymatically active in the presence of ferrous iron
      and a tetrahydropteridine co-substrate.
  - reference_id: PMID:12555273
    supporting_text: In Drosophila as in vertebrates, the rate-limiting step in DA biosynthesis is catalyzed
      by the enzyme tyrosine hydroxylase (TH).
  - reference_id: PMID:21187381
    supporting_text: We found that DA is absent or below detection limits in the adult brain of these flies.
- description: Epidermal tyrosine 3-monooxygenase (DTH II, the major isoform) that supplies L-DOPA and dopamine
    for cuticle melanization and sclerotization, essential for cuticle formation and survival.
  molecular_function:
    id: GO:0004511
    label: tyrosine 3-monooxygenase activity
  directly_involved_in:
  - id: GO:0048067
    label: cuticle pigmentation
  - id: GO:0006585
    label: dopamine biosynthetic process from tyrosine
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12717737
    supporting_text: We show that the embryonic lethality of ple can be rescued by expression of the hypodermal,
      but not the neural, DTH isoform in all DA cells, indicating that the hypoderm- isoform is absolutely required
      for cuticle biosynthesis and survival in Drosophila.
  - reference_id: PMID:21808060
    supporting_text: Cuticular tanning processes are initiated by the hydroxylation of tyrosine to dopa by
      tyrosine hydroxylase and the subsequent decarboxylation of dopa to dopamine by dopa-decarboxylase (Ddc),
      which serves as a catechol precursor for the synthesis of melanin or derived quinones to tan and strengthen
      the cuticle matrix ( 23 )
suggested_questions:
- question: Does the acidic 71-residue segment of the hypodermal isoform (DTH II) mediate its lower sensitivity
    to dopamine feedback inhibition and its requirement for dopamine in PKA activation, and does it bind partners
    such as 14-3-3 or Catsup?
- question: Is fly TH associated with synaptic vesicles or the vesicular monoamine transporter at dopaminergic
    terminals, as proposed for mammalian TH, which would bear on whether it takes part in transmitter loading?
- question: Should UniProt P18459 swap its isoform names so that the displayed sequence with the acidic insert
    is the hypodermal isoform?
suggested_experiments:
- description: Express each DTH isoform specifically in dopaminergic neurons of ple mutants rescued in the
    hypoderm, and compare brain dopamine, learning and locomotion, to test whether the neural isoform's regulatory
    properties matter for behaviour.
- description: Fractionate fly head extracts (cytosol, membranes, synaptic vesicle fraction) and immunoblot
    for TH, Ddc and Vmat to test whether fly TH associates with vesicles at terminals.
