- id: file:DROME/ple/ple-uniprot.txt
  title: UniProt entry P18459 (ple)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Swiss-Prot record. The catalytic activity, cofactor, pathway and family lines are correct.
      Two statements are wrong: the FUNCTION line is vertebrate text about adrenergic neurons, which flies
      do not have, and the two isoform names are swapped relative to the papers that define them. The subcellular
      location lines are by similarity to mouse Th. PE level 2 (transcript) understates the evidence: both
      recombinant isoforms have been purified and assayed (PMID:10358021).'
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P18459
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Plays an important role in the physiology of adrenergic neurons.
      confidence: CONFIRMED
      explanation: 'Drosophila has no adrenergic (noradrenaline or adrenaline) neurons; dopamine is its only
        catecholamine neurotransmitter, and the fly enzyme makes L-DOPA for dopamine in dopaminergic neurons
        and for melanin and sclerotization precursors in the epidermis. Suggested wording: ''Catalyzes the
        rate-limiting step in dopamine biosynthesis, in dopaminergic neurons (neuronal isoform) and in the
        epidermis, where L-DOPA and dopamine are precursors of cuticle melanin and sclerotization agents
        (hypodermal isoform).'''
      supported_by:
      - reference_id: PMID:12555273
        supporting_text: Dopamine (DA) is the only catecholaminergic neurotransmitter in the fruit fly Drosophila
          melanogaster.
      - reference_id: PMID:21187381
        supporting_text: Because DA is also required in Drosophila as a precursor substrate for cuticle sclerotization
          and melanization, inactivating mutations of the genomic TH , alias pale ( ple ) locus, results in
          unpigmented cuticle and late embryonic lethality ( 19 )
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P18459
      slot: CC:ALTERNATIVE PRODUCTS
      requested_change: REPOINT
      asserted_value: Name=Neuronal; IsoId=P18459-1; Sequence=Displayed; Name=Hypodermal; IsoId=P18459-2;
        Sequence=VSP_000545
      corrected_value: Name=Hypodermal; IsoId=P18459-1; Sequence=Displayed; Name=Neuronal; IsoId=P18459-2;
        Sequence=VSP_000545
      confidence: CONFIRMED
      explanation: The displayed 579-residue sequence contains residues 60-130, a 71-residue segment with
        23 acidic and 1 basic residue (computed in ple-bioinformatics/RESULTS.md). Birman et al. 1994 and
        Vie et al. 1999 define this acidic 71-residue insertion as the feature of DTH II, the hypodermal (epidermal)
        isoform; DTH I, the CNS isoform, lacks it and corresponds to the 1989 cDNA (PMID:2483109, predicted
        57,861 Da, matching the 508-residue VSP_000545 isoform). UniProt therefore labels the displayed sequence
        'Neuronal' and VSP_000545 'Hypodermal', the reverse of the published assignment; the VAR_SEQ note
        'Missing (in isoform Hypodermal)' should read 'Missing (in isoform Neuronal)'.
      supported_by:
      - reference_id: PMID:7929381
        supporting_text: The major isoform (Type II) contains a novel acidic extension of 71 amino acids in
          the amino-terminal regulatory domain
      - reference_id: PMID:7929381
        supporting_text: Type I mRNA is present only in the CNS, where it is the primary form.
      - reference_id: PMID:10358021
        supporting_text: DTH II specifically contains a very acidic segment of 71 amino acids inserted in the
          regulatory domain.
      - reference_id: PMID:10358021
        supporting_text: Expression of DTH I is restricted to the central nervous system, whereas DTH II is
          expressed in non-nervous tissues like the epidermis.
