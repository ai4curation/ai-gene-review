id: P18459
gene_symbol: ple
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'pale (ple) encodes tyrosine 3-monooxygenase (tyrosine hydroxylase, TH), the iron- and
  tetrahydrobiopterin-dependent aromatic amino acid hydroxylase that converts L-tyrosine to L-DOPA, the
  first and rate-limiting step in dopamine synthesis; dopa decarboxylase (Ddc) completes the pathway.
  The cytosolic enzyme is feedback-inhibited by dopamine, activated by PKA phosphorylation of Ser32 in
  its N-terminal regulatory domain, and inhibited by cytosolic zinc, which competes with its ferrous iron
  cofactor. Tissue-specific alternative splicing gives two isoforms: DTH I, expressed only in the central
  nervous system, and DTH II, the major form, which carries an extra acidic segment of 71 residues in the
  regulatory domain, is expressed in the epidermis (hypoderm) and differs in cofactor affinity and dopamine
  inhibition. In the dopaminergic neurons of the brain, ple-derived dopamine is the only catecholamine
  neurotransmitter of the fly, and loss of neural TH leaves the brain without dopamine, with reduced activity,
  longer sleep, locomotor decline, hypophagia, loss of aversive olfactory learning and altered temperature
  preference and courtship, all rescued by L-DOPA. In the epidermis, L-DOPA and dopamine made by ple are
  the precursors of black and brown melanins and of the sclerotization precursors N-acetyldopamine (NADA)
  and N-beta-alanyldopamine (NBAD), so ple is required for cuticle tanning (pigmentation and hardening);
  null mutants die as unpigmented late embryos, and the hypodermal isoform alone rescues survival. ple is
  also transcriptionally induced around epidermal wounds, and dopamine made in tracheal cells restrains
  tracheal cell migration by regulating endocytosis of the FGF receptor Breathless.'
alternative_products:
- name: Neuronal
  id: P18459-1
  description: UniProt's name for the displayed 579-residue sequence. This sequence carries the 71-residue
    acidic segment (residues 60-130) that the literature assigns to DTH II, the hypodermal isoform, so
    the published assignment is the reverse of UniProt's naming (see the source defect on the UniProt
    reference).
- name: Hypodermal
  id: P18459-2
  sequence_note: VSP_000545
  description: UniProt's name for the 508-residue isoform lacking residues 60-130. It corresponds to the
    1989 cDNA (57.9 kDa) and to DTH I, the CNS isoform, in the literature.
