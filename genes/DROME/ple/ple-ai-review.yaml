- term:
    id: GO:0001963
    label: synaptic transmission, dopaminergic
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:98735
  - PANTHER:PTN000158532
  review:
    summary: Dopaminergic synaptic transmission inherited from the bilaterian TH node PTN000158532, seeded
      by mouse Th.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'IBA verdict: the phylogeny is sound but the term does not describe what the enzyme does. PTN000158532
      contains only TH orthologs, so this is not a paralog problem. The term is defined as the vesicular
      release of dopamine and the activation of dopamine receptors and its postsynaptic effects; making the
      transmitter is a separate process (dopamine biosynthesis), already captured on ple. The mouse seed
      is a mutant-phenotype annotation: without TH there is no dopamine to release, which is necessity, not
      participation. The comparator check agrees: in human, mouse, rat, fly, worm and zebrafish the term
      is on TH, on dopamine receptors and on several Parkinson genes by mutant phenotype, but not on DDC,
      the enzyme of the next synthesis step, nor on the vesicular or plasma-membrane dopamine transporters.
      No fly experiment measured dopaminergic transmission in ple mutants. Not REMOVE, because ple is
      genuinely required for the process and GO''s mammalian practice accepts the mouse row.'
    supported_by:
    - reference_id: PMID:12555273
      supporting_text: In Drosophila as in vertebrates, the rate-limiting step in DA biosynthesis is catalyzed
        by the enzyme tyrosine hydroxylase (TH).
    - reference_id: file:DROME/ple/ple-notes.md
      supporting_text: ple is necessary for dopaminergic transmission but performs none of its steps.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000158532
        source_label: bilaterian TH clade (PTHR11473:SF15)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node is correct for TH; the term names a downstream process the enzyme does not perform.
      - source_id: MGI:MGI:98735
        source_label: mouse Th
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mutant-phenotype seed (necessity of dopamine for transmission).
      residue_claims_not_applicable: The question is whether the enzyme performs a step of the process,
        not a residue change.
