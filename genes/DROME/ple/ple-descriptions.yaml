- source: Alliance_Imported
  text: pale (ple) encodes a cytosolic tyrosine hydroxylase that catalyzes the hydroxylation of L-tyrosine
    to form L-dopa, the first and rate-limiting step in the synthesis of dopamine (and eventually, melanin).
    Dopamine acts as a neurotransmitter regulating various processes. It is also a precursor for the synthesis
    of melanin and the cuticle sclerotization precursors, N-acetyldopamine (NADA) and N-&bgr;-alanyldopamine
    (NBAD).
  source_type: curated
  url: https://flybase.org/reports/ple.html
  source_id: FB:FBgn0005626
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 5
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 5
    overall_notes: 'Every claim traced: TH reaction, first and rate-limiting step of dopamine synthesis,
      dopamine as transmitter, and dopamine as precursor of melanin, NADA and NBAD. ''Cytosolic'' rests
      on indirect fly evidence. Omits the neuronal and hypodermal isoforms; the served text has an unrendered
      ''&bgr;''.'
- source: Alliance_Automated
  text: Enables tyrosine 3-monooxygenase activity. Involved in several processes, including adult chitin-containing
    cuticle pigmentation; regulation of epithelial cell migration, open tracheal system; and thermosensory
    behavior. Predicted to be located in perinuclear region of cytoplasm and synapse. Predicted to be
    active in axon; cytoplasm; and perikaryon. Is expressed in several structures, including aminergic
    neurons; gut section; neuroblast lineage clone; synaptic neuropil domain; and synaptic neuropil subdomain.
    Used to study Parkinson's disease. Human ortholog(s) of this gene implicated in Parkinson's disease;
    heroin dependence; hypertension; movement disease (multiple); and obesity. Orthologous to human TH
    (tyrosine hydroxylase).
  source_type: automated
