findings:
- category: discrepancy
  text: UniProt's FUNCTION says the enzyme acts in the physiology of adrenergic neurons; flies have no
    adrenergic neurons, and the review records a CONFIRMED UniProt source defect.
  sources:
  - UniProt
- category: gap
  text: No text mentions the two tissue-specific isoforms (neuronal DTH I and the major hypodermal DTH
    II, which alone rescues survival); the review also finds UniProt's isoform names swapped.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The automated texts never mention dopamine biosynthesis, ple's core process, while listing peripheral
    processes and long expression and disease lists.
  sources:
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: The automated texts place ple in the perinuclear region of cytoplasm, a location transferred from
    mouse Th that the review marks as over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
- category: insight
  text: Only the FlyBase text gives the epidermal role in making melanin and the sclerotization precursors
    NADA and NBAD, which the review confirms and treats as a core function.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: FlyBase and the automated texts agree on a tyrosine hydroxylase with roles in pigmentation
    and behaviour; UniProt's single sentence about adrenergic neurons is wrong for the fly and disagrees
    with both.
