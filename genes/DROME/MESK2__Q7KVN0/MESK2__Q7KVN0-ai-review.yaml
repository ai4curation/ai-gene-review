product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MESK2 (Misexpression suppressor of KSR 2, CG15669, FBgn0043070) is the single
  Drosophila member of the animal NDRG (N-myc downstream-regulated) protein family. Q7KVN0 is
  isoform I (485 residues), the gene-centric canonical product in the reference proteome; it
  has the same sequence as the cDNA record Q9GU50. The protein consists of an Ndr
  alpha/beta-hydrolase-fold domain followed by a disordered C-terminal tail rich in polar and
  glycine residues. At the nucleophile-elbow position that carries the catalytic serine in
  active alpha/beta hydrolases, MESK2 has glycine (Gly152), as human NDRG2 does, whose crystal
  structure lacks a catalytic triad. MESK2 is therefore expected to be a noncatalytic,
  fold-retaining protein. It is recovered by fluorophosphonate activity-based probes from adult
  male head proteome, but no catalytic activity has been measured. By descent from the
  eumetazoan NDRG ancestor it is predicted to be cytoplasmic. Misexpression of MESK2 in the eye
  modulates RAS1/KSR-dependent photoreceptor signalling, glial RNAi knockdown reduces the
  rhythmicity of circadian locomotor behaviour, and insertion alleles are recessive lethal. Its
  molecular activity, binding partners and mechanism are unknown.
