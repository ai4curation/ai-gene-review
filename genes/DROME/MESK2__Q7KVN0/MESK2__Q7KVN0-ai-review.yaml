      site, the residue MESK2 lacks at the canonical position.
    supporting_text: all members, without any exception to date, use a nucleophilic serine residue in
      the enzyme active site
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source of the HDA serine hydrolase activity row. The cached file is abstract-only, but
