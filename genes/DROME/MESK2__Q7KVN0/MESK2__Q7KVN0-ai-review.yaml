existing_annotations:
- term:
    id: GO:0017171
    label: serine hydrolase activity
  evidence_type: HDA
  original_reference_id: PMID:33827210
  qualifier: enables
  review:
    summary: The row comes from a fluorophosphonate activity-based protein profiling atlas in which
      MESK2 was identified, at the protein level, among FP-biotin/avidin-enriched proteins from adult
      male head (Table 1, "Unknown hydrolase"). GO:0017171 is defined as catalysis using a serine
      nucleophile activated by an acid-base triad. MESK2 has glycine (Gly152) at the nucleophile-elbow
      position (IGFGVGAGANI), as in human NDRG2, whose structure lacks the Ser-His-Asp triad. The
      paper reports no probe-modified MESK2 peptide, no competition with a serine hydrolase inhibitor,
      and no follow-up on MESK2.
    action: MARK_AS_OVER_ANNOTATED
    reason: Read with the full text (PMC7610703), the experiment shows enrichment of MESK2 by an FP
      probe, which could reflect labelling of a non-canonical residue or co-enrichment with a bound
      partner. It does not show triad-dependent serine hydrolase catalysis. MESK2 lacks the serine
      nucleophile at the canonical position, and its family (PANTHER PTHR11034) is structurally
      characterised as noncatalytic. The observation is kept on record but should not be taken as the
      molecular function of MESK2 or transferred to other proteins. No better MF term is supported.
    supported_by:
    - reference_id: file:DROME/MESK2__Q7KVN0/MESK2__Q7KVN0-bioinformatics/RESULTS.md
      supporting_text: '`MESK2 | Unknown hydrolase | Male | Head | Ahmed et. al., 2020`'
    - reference_id: file:DROME/MESK2/MESK2-bioinformatics/RESULTS-rereview.md
      supporting_text: hNDRG2 146G -> Q7KVN0 (152, 'G')
    - reference_id: PMID:21247902
      supporting_text: The most striking difference between NDRG2 and other members of ABH superfamily is
        the absence of the classical catalytic triad, Ser-His-Asp.
    - reference_id: PMID:33827210
      supporting_text: all members, without any exception to date, use a nucleophilic serine residue in
        the enzyme active site
core_functions:
- description: Noncatalytic NDRG-family alpha/beta-hydrolase-fold protein of unknown molecular activity,
    predicted (by PAINT descent) to act in the cytoplasm. The catalytic-serine position is a glycine,
    so no hydrolase activity is assigned; recovery by a fluorophosphonate probe in proteome-wide
    profiling is not taken as evidence of catalysis.
