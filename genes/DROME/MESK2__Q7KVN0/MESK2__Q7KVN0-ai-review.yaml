- id: PMID:29487148
  title: Regulation of Circadian Behavior by Astroglial MicroRNAs in Drosophila.
  findings:
  - statement: Pan-glial RNAi knockdown of MESK2 with two independent transgenes reduced circadian
      locomotor rhythmicity.
    supporting_text: glial knockdown of MESK2 using either of two different RNAi transgenes also decreased
      rhythmicity
  - statement: The biochemical role of MESK2 is unknown.
    supporting_text: Beyond a possible regulation of Ras/ERK signaling, there is little known about the
      biochemical role of MESK2 in Drosophila or mammals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The strongest loss-of-function evidence for the gene, but it is an
