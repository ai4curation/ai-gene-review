suggested_questions:
- question: Is MESK2 labelled directly by FP probes (a probe-modified peptide, competable by a serine
    hydrolase inhibitor), or is it co-enriched with a bound FP-reactive partner in head proteome?
- question: Should the Eumetazoa-level PAINT signal transduction IBD (seeded only by human NDRG1), which
    GOA propagates to Q9GU50, be retained for fly MESK2, given that the fly evidence for Ras modulation
    is misexpression-only?
- question: Do the MESK2 isoforms that differ at their N- and C-terminal extensions (isoform I versus
    isoforms A/E/F) have different partners or subcellular distributions?
suggested_experiments:
- description: Site-level FP-probe chemoproteomics on adult male head lysate, with heat-denatured,
    no-probe and inhibitor-competition controls, to determine whether and where MESK2 is modified.
  experiment_type: proteomics
- description: Express recombinant MESK2 Ndr domain and test FP-probe labelling and esterase activity,
    with an engineered G152S variant as a comparison.
  experiment_type: biochemistry
- description: Endogenous tagging of MESK2 isoform I for localization in glia and eye discs and for
    proximity labelling of binding partners.
  experiment_type: cell biology
knowledge_gaps:
- gap_statement: The molecular activity of MESK2 is unknown. No binding partner, ligand or regulated
    target has been identified, so the mechanism behind its Ras-modulating and glial circadian
    phenotypes cannot be stated, and it is unknown why the protein is recovered by an FP probe.
  gap_kind:
  - BIOLOGY
