  review:
    summary: >-
      CPTI YFP-trap localisation screen of Drosophila embryos (Lye et al. 2014). The
      CG42684 (raskol) insertion was the only line in the screen to localise to the
      apical cortex of dividing cells (category II), and it also appeared at the new
