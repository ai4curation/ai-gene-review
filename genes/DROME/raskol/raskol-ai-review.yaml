- id: PMID:30763317
  title: Evolutionary rate covariation analysis of E-cadherin identifies Raskol as
    a regulator of cell adhesion and actin dynamics in Drosophila.
  findings:
  - statement: Raskol-YFP colocalises with DE-cadherin at polar-cell apical membranes,
      border-cell contacts, amnioserosa contacts and the dorsal-closure zippering front.
    supporting_text: Immunolabeling of egg chambers with DE-cad antibody revealed colocalization
      between DE-cad and Raskol at the apical surface of PCs and at BC-BC contacts
  - statement: raskol RNAi in border cells reduces DE-cadherin at BC-BC contacts.
    supporting_text: Knockdown of CG42684 (Fig 4D), CG16952 (Fig 4E), CG11593 (Fig 4F),
      babo (S1B Fig) and Hrb98DE (S1C Fig) caused a significant reduction in DE-cad levels
      at BC-BC contacts.
  - statement: raskol RNAi in polar cells causes border-cell cluster dissociation.
    supporting_text: Expression of raskol RNAi in PCs caused BC disassociation in 63%
      of egg chambers
  - statement: raskol RNAi lets actin protrusions form all around the BC cluster without
      changing the number of front protrusions.
    supporting_text: Interestingly, the number of front-oriented protrusions in control
      and raskol RNAi expressing BCs did not differ significantly
  - statement: The GTPase substrate is not identified; Rac1 restriction is a prediction.
    supporting_text: We predict that in leading BCs, Raskol limits active Rac1 to the
      leading protrusion to induce localized actin cytoskeletal remodeling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC6375579). This is the only functional study of
      raskol. The perturbations are all RNAi, with no rescue or second independent
      allele reported, and there is no biochemical GAP assay. Localisation uses an
      endogenous YFP-trap allele.
