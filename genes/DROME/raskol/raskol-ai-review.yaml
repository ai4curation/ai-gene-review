suggested_questions:
- question: Which small GTPase does Raskol act on in vivo (Ras85D, Ras64B, Rap1 or Rac)?
    The SF60 subfamily includes both Ras GAPs (GAP-2) and a Rap-like GAP (Bud2), so the
    substrate cannot be inferred from family membership.
- question: Is the border-cell adhesion and protrusion-polarity phenotype caused by loss
    of GAP catalytic activity, or by a scaffolding role of the PH/C2 and disordered
    C-terminal regions at DE-cadherin contacts?
- question: Should border follicle cell migration (GO:0007298) be annotated once the RNAi
    phenotype is confirmed with a second RNAi line, a null allele or rescue? It was not
    added here because the current evidence is a single RNAi perturbation.
suggested_experiments:
- description: In vitro GAP assays of the purified Raskol RasGAP domain against Ras85D,
    Rap1 and Rac1, with an Arg515Ala arginine-finger mutant as a catalytically dead control.
- description: Generate a CRISPR null of raskol, and rescue border-cell adhesion and protrusion
    defects with wild-type versus Arg515Ala transgenes to test whether GAP activity is required.
- description: Use FRET or pull-down activity reporters for Ras, Rap1 and Rac in raskol-depleted
    border-cell clusters to identify the GTPase whose activity spreads beyond the leading
    cell.
