core_functions:
- description: >-
    Inferred GTPase-activating protein of the RasGAP family, acting at the cortex and
    at DE-cadherin-based cell-cell contacts. The activity is inferred from the conserved
    RasGAP domain (arginine finger Arg515) and from PTHR10194 PAINT and SF60 subfamily
    evidence (C. elegans GAP-2). It is not measured for Raskol, and its GTPase substrate
    in flies is unknown. Localisation to the apical cortex, the apical plasma membrane and
    DE-cadherin contacts is established experimentally in Drosophila.
