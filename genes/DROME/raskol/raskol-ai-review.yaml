- term:
    id: GO:0046580
    label: negative regulation of Ras protein signal transduction
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8MLZ5
  review:
    summary: >-
      Transferred by UniProt from C. elegans GAP-2 (Q8MLZ5). GAP-2 is in the same
      PANTHER subfamily (PTHR10194:SF60), so this is a within-subfamily transfer. GAP-2
      was cloned by complementing the fission-yeast Ras-GAP mutant gap1. Loss of gap-2
      suppresses let-23 (EGFR) and let-60 (Ras) reduction-of-function lethality, which
      places GAP-2 as a negative regulator of LET-60 Ras.
    action: ACCEPT
    reason: >-
      The transfer is evolutionarily grounded. Donor and target share PANTHER
      subfamily SF60, and both keep the catalytic arginine finger. The donor's evidence
      is functional (yeast complementation and genetic epistasis with Ras-pathway
      mutants), not just sequence-based. Negative regulation of small-GTPase signalling
      is the expected process outcome of the core GAP activity. In Drosophila, however,
      raskol has not been placed in a Ras pathway experimentally, and the fly authors
      only propose that it restricts Ras/Rho/Rac signalling. Bud2, another SF60 member,
      acts on a Rap-like GTPase, so the substrate may vary within the subfamily. This
      annotation is therefore an inference by homology, not an experimental result in
      flies.
    supported_by:
    - reference_id: PMID:9619631
      supporting_text: a loss of gap-2 function could suppress larval lethality in both
        let-23 and let-60 reduction-of-function mutants, in which the Ras activity was
        lowered.
    - reference_id: PMID:9619631
      supporting_text: GAP-2 appears to function as a negative regulator of LET-60 Ras
        during larval development.
    - reference_id: PMID:30763317
      supporting_text: We propose that Raskol functions with DE-cad to restrict Ras/Rho
        signaling and help guide BC migration.
