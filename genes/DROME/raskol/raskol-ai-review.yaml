description: >-
  Raskol (CG42684) is a large (1580 aa) Drosophila member of the Ras GTPase-activating
  protein family, with an N-terminal PH domain, a C2 domain, a central RasGAP domain that
  retains the arginine-finger residue (Arg515) and the FLR motif, and a long, largely
  disordered C-terminal region with a DAB2P_C (DAB2IP-like) segment. It belongs to PANTHER
  subfamily PTHR10194:SF60, together with C. elegans GAP-2, yeast Bud2 and Dictyostelium
  ngap; the mammalian DAB2IP, RASAL2 and SynGAP proteins lie in separate subfamilies. Its
  GTPase-activating activity and its substrate GTPase have not been measured directly; GAP
  activity is inferred from the conserved catalytic domain and from experimental data on
  the subfamily member GAP-2, which complements a fission-yeast gap1 mutant and acts
  genetically as a negative regulator of LET-60 Ras. In flies, YFP-tagged Raskol is
  cytoplasmic and cortical: it is enriched at the apical cortex and apical plasma membrane
  of embryonic epithelial cells, and in egg chambers it colocalises with DE-cadherin at
  polar-cell apical membranes and border-cell contacts, and at amnioserosa cell contacts
  and the zippering front during dorsal closure. RNAi knockdown in the ovary reduces
  DE-cadherin at border-cell contacts, causes border-cell cluster dissociation and
  migration delay, and lets actin-rich protrusions form around the whole cluster rather
  than only at its front. These data suggest that Raskol limits small-GTPase signalling at
  cadherin-based contacts to maintain cluster adhesion and polarised protrusion; the
  GTPase it acts on (Ras, Rap or Rac, as the authors propose) has not been identified.
