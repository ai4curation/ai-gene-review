  review:
    summary: >-
      This is a root-node (PTN008939999) IBD for the whole RasGAP family. The donors
      include C. elegans GAP-1 and GAP-2 (WB:WBGene00001515, WB:WBGene00001516), so an
      SF60 member supports the node.
    action: MODIFY
    reason: >-
      The claim is correct but general. PAINT deliberately placed it at the family root,
      where the GTPase substrate differs between branches. For Raskol, the
      within-subfamily evidence supports the more specific descendant GO:0046580
      negative regulation of Ras protein signal transduction, which the gene already
      carries by ISS from GAP-2. That term is proposed as the refinement. The direction
      (negative) follows from the GAP mechanism, which lowers the level of active GTP-bound
      GTPase. Ras is the best-supported subfamily substrate (GAP-2 and LET-60), but it
      has not been confirmed in flies.
    proposed_replacement_terms:
    - id: GO:0046580
      label: negative regulation of Ras protein signal transduction
