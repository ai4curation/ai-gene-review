  review:
    summary: >-
      PAINT places GTPase activator activity at the PTHR10194 root node PTN008939999,
      which is ancestral to every RasGAP-family subfamily, including SF60 to which
      Raskol belongs. The donors include p120GAP (RASA1), NF1, RASA2/3, yeast Ira1/Ira2
      and Bud2 (an SF60 member). Raskol keeps an intact RasGAP domain with the PROSITE
      RasGAP signature, the arginine finger at Arg515 and the FLR motif (SIFLRFLCPA, residues 527-536).
    action: ACCEPT
    reason: >-
      Raskol lies inside the clade that inherited this IBD. Its catalytic residues are
      conserved, and nothing in its sequence or data suggests it has lost the activity.
      Its own GAP activity has never been assayed. The term stays at the general level
      and is not refined to a specific Ras or Rap GTPase activator, for two reasons.
      SF60 contains GAPs for different GTPases: GAP-2 acts on LET-60 Ras and Bud2 on
      the Rap-like Rsr1. The fly study names Ras, Rho and Rac only as candidates.
      This is the core molecular function. In Drosophila it is supported by inference
      only (IBA plus domain conservation), not by experiment.
