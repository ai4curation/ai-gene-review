  review:
    summary: >-
      Raza et al. measured cytoplasmic Raskol-YFP in polar and border cells, with levels
      about 2x higher in polar cells. The protein is present in the cytoplasm, but it is
      most concentrated at the cell cortex and plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localisation is directly observed in Drosophila with an endogenous YFP-trap
      allele (CPTI line), so it is real. However, the cytoplasmic pool is not where
      the protein's activity has been placed. That role is at the cortex and at
      cadherin-based contacts, which apical cortex and plasma membrane capture. The
      term is as precise as the data allow for the diffuse pool, so it is kept as
      non-core rather than modified.
    supported_by:
    - reference_id: PMID:30763317
      supporting_text: Analysis of Raskol-YFP protein localization in BC clusters revealed
        that cytoplasmic levels of Raskol were ~2x higher in PCs compared to BCs
