descriptions:
- source: UniProt
  text: GTPase-activating protein, which acts as a negative regulator for some members
    of the Ras family (By similarity). Probably decreases their signaling activity
    by stimulating their intrinsic GTPase activity, thereby lowering the levels of
    the GTP-bound active form (By similarity). Functions with DE-cadherin (shg) to
    promote embryonic border cell (BC) migration and adhesion by regulating the distribution
    of actin protrusions in BCs (PubMed:30763317). Promotes shg-mediated adhesion
    at the BC interfaces and likely maintains BC cluster adhesion during BC detachment
    from the follicular epithelium and subsequent BC migration (PubMed:30763317).
    Also required for restricting the development of actin-rich protrusions to the
    front of migrating BC clusters thus ensuring unidirectional BC migration (PubMed:30763317).
    Possibly functions by suppressing Rac1 signaling in non-leading BCs, thus limiting
    its activity to leading BCs where it initiates localized actin cytoskeleton remodeling
    to produce the polarized protrusions (PubMed:30763317).
