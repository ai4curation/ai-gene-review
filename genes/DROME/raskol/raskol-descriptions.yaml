- source: Alliance_Automated
  text: Predicted to enable GTPase activator activity. Predicted to be involved in
    negative regulation of Ras protein signal transduction. Located in cytoplasm.
    Is expressed in adult brain cell body rind. Used to study developmental disorder
    of mental health. Human ortholog(s) of this gene implicated in several diseases,
    including artery disease (multiple); autosomal dominant intellectual developmental
    disorder 5; periodontitis; prostate cancer; and stomach cancer. Orthologous to
    several human genes including DAB2IP (DAB2 interacting protein); RASAL2 (RAS protein
    activator like 2); and SYNGAP1 (synaptic Ras GTPase activating protein 1).
