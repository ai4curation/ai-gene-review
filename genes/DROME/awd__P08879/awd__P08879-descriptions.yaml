      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Same gene-level FlyBase text: NDPK in dynamin-dependent endocytosis
      of surface receptors and in morphogenesis. Pvr and border cell migration are
      not covered in the review.'
- source: Alliance_Automated
  text: Enables several functions, including magnesium ion binding activity; nucleoside
    diphosphate kinase activity; and purine ribonucleoside triphosphate binding activity.
    Involved in several processes, including establishment or maintenance of polarity
    of follicular epithelium; nucleoside phosphate biosynthetic process; and open
    tracheal system development. Located in nuclear microtubule. Is expressed in several
    structures, including Malpighian tubule primordium; embryonic/larval midgut primordium;
    follicle cell; germline cell; and larval somatic muscle cell. Human ortholog(s)
    of this gene implicated in neuroblastoma; ovary epithelial cancer; and teratoma.
    Orthologous to several human genes including NME2 (NME/NM23 nucleoside diphosphate
    kinase 2) and NME1-NME2 (NME1-NME2 readthrough).
