id: P08879
gene_symbol: awd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  abnormal wing discs (awd; also Killer of prune, Nm23) encodes the major nucleoside diphosphate
  kinase (NDPK, EC 2.7.4.6) of Drosophila, a 153-residue NME/Nm23-type enzyme about 78% identical
  to human NME1 and NME2. Purified Awd is a homohexamer that transfers the gamma-phosphate of ATP
  to ribo- and deoxyribonucleoside diphosphates by a ping-pong mechanism through an N-delta
  phosphohistidine on His119, with Mg2+ as cofactor; crystal structures of the free and
  phosphorylated enzyme have been solved. Awd is a soluble cytoplasmic protein that co-purifies
  with microtubules. Null mutants die around pupariation with small imaginal discs, lymph glands
  and brain lobes, and their neuroblasts arrest in metaphase. An H119A transgene that lacks NDPK
  activity does not rescue the null, so the catalytic activity is required in vivo; human NME2,
  but not NME1, can substitute. Genetic studies place Awd in dynamin (shibire)-dependent
  endocytosis: awd alleles enhance shibire synaptic-vesicle recycling defects, and loss of awd
  causes Breathless/FGFR to accumulate in tracheal cells, adherens-junction components to
  accumulate in follicle cells, and internalized Notch to stall in enlarged Rab5-positive early
  endosomes. In the ovary Awd negatively regulates border cell migration. Its down-regulation in
  border cells allows optimal spatial Pvr (PDGF/VEGF receptor) and JAK/STAT signalling, and its
  overexpression stalls migration and reverts the effects of constitutively active Pvr or
  dominant-negative dynamin. The favoured explanation is that Awd supplies GTP to dynamin and Rab5, but local
  GTP delivery has not been demonstrated directly.
