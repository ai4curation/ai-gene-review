suggested_questions:
- question: >-
    Does Awd act in endocytosis by delivering GTP locally to dynamin (Shibire) and Rab5, or do the
    endocytic phenotypes reflect lower bulk GTP? Whether an annotation such as dynamin-dependent
    endocytosis is warranted depends on this. At present the evidence shows necessity, not
    participation, and the mammalian convention for NME1/NME2 should be checked first.
- question: >-
    Is any Awd present in mitochondria (for example the intermembrane space, like a fraction of
    yeast YNK1), as the PAINT mitochondrion node implies, or is the fly protein exclusively
    cytoplasmic and microtubule-associated?
- question: >-
    Is the histidine-dependent protein kinase activity reported for fly NDPK (PMID:8579610)
    physiologically relevant, given that it has not been reproduced for Awd?
suggested_experiments:
- description: >-
    Rescue the awd null with H119A and with substrate-binding-site mutants targeted to endosomes or
    synapses, and measure local GTP/GDP with a genetically encoded sensor, to test whether
    NDPK-derived GTP is limiting for dynamin and Rab5 function.
  experiment_type: genetic rescue with biosensor imaging
- description: >-
    Fractionate adult and larval mitochondria (with protease protection) or use proximity labelling
    to test whether a pool of Awd resides in mitochondria.
  experiment_type: subcellular fractionation
