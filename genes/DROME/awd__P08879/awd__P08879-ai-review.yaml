  review:
    summary: >-
      PAINT places NDPK activity at PTN000887110, an ancestral node spanning bacterial, plant,
      fungal and animal NDPKs. Awd is inside this clade (PANTHER PTHR11349:SF91, with yeast YNK1
      and worm ndk-1) and is itself one of the experimental donors (FB:FBgn0000150).
    action: ACCEPT
    reason: >-
      The phylogenetic inference agrees with direct biochemistry on the fly enzyme: purified Awd
      has NDPK activity, forms the active-site phosphohistidine, and retains all catalytic and
      nucleotide-binding residues. Its own presence among the donors marks experimental grounding
      on the target.
    supported_by:
    - reference_id: PMID:2175255
      supporting_text: We present evidence that the awd gene codes for a nucleoside diphosphate
        kinase (NDP kinase) and that this Awd/NDP kinase is microtubule associated.
    - reference_id: PMID:7669763
      supporting_text: In both enzymes, the active site histidine was phosphorylated on N delta,
        and it was the only site of phosphorylation.
