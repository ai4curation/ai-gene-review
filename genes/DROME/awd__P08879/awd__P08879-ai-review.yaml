- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:2175255
  qualifier: involved_in
  review:
    summary: >-
      Neuroblasts of awd null larvae arrest in metaphase, which Biggs et al. attributed to a
      requirement for microtubule-associated Awd in spindle microtubule polymerization.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mutant phenotype is solid and was scored by the curator from the full paper, but it
      is a loss-of-function consequence: a cell-wide NTP-regenerating enzyme being necessary for
      mitosis does not show that Awd executes a step of the cell cycle. The likeliest link is GTP
      supply to tubulin polymerization, which has not been tested directly. Kept as a non-core,
      experimentally supported process; not suitable for transfer as a core function.
    supported_by:
    - reference_id: PMID:2175255
      supporting_text: Neuroblasts in Drosophila larvae homozygous for a null mutation in the awd
        gene are arrested in metaphase, indicating that microtubule-associated Awd/NDP kinase
        plays a critical role in spindle microtubule polymerization.
