  review:
    summary: >-
      Mitochondrial NDPK activity placed at PTN000142925, seeded by mitochondrial or
      mitochondria-associated NDPKs (human NME4 and NME3, yeast YNK1, Dictyostelium and plant
      mitochondrial isoforms).
    action: KEEP_AS_NON_CORE
    reason: >-
      There is no Drosophila evidence for a mitochondrial pool of Awd. Awd has no N-terminal
      targeting extension, and the cited localization studies describe it as cytoplasmic and
      microtubule-associated. However, its PANTHER subfamily partner yeast YNK1 (PTHR11349:SF91),
      which also lacks a classical presequence, is one of the donors, and the PAINT curator placed
      the term on a node that contains Awd. No fly-specific evidence of loss argues against the
      node placement, so the row is kept as an inherited, non-core and unverified location. Do
      not transfer it as experimentally established for Awd.
    supported_by:
    - reference_id: file:DROME/awd__P08879/awd__P08879-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:2175255}.'
