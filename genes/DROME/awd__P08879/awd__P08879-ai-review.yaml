core_functions:
- description: >-
    Nucleoside diphosphate kinase. The cytoplasmic Awd homohexamer transfers the gamma-phosphate
    of ATP to ribo- and deoxyribonucleoside diphosphates through an N-delta phosphohistidine on
    His119, regenerating GTP, UTP, CTP and dNTPs. Experimentally established in Drosophila by
    enzyme purification, crystal structures and active-site mutagenesis, and inherited from the
    PAINT NDPK node.
  molecular_function:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  directly_involved_in:
  - id: GO:0009142
    label: nucleoside triphosphate biosynthetic process
  - id: GO:0006183
    label: GTP biosynthetic process
  - id: GO:0009202
    label: deoxyribonucleoside triphosphate biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:1320004
    supporting_text: We purified the nucleoside diphosphate kinases from wild-type and mutant
      larvae by a simple procedure involving affinity chromatography on blue Sepharose. Both
      proteins are purified as hexamers in their native state.
  - reference_id: PMID:7669763
    supporting_text: In both enzymes, the active site histidine was phosphorylated on N delta, and
      it was the only site of phosphorylation.
  - reference_id: PMID:8806830
    supporting_text: The null mutant phenotype cannot be rescued at all by a transgene that has 750
      bp of awd upstream regulatory DNA fused to a full-length awd cDNA with a mutation that
      eliminates NDP kinase activity by replacement of the active site histidine with alanine.
  - reference_id: PMID:2175255
    supporting_text: We present evidence that the awd gene codes for a nucleoside diphosphate
      kinase (NDP kinase) and that this Awd/NDP kinase is microtubule associated.
