descriptions:
- source: UniProt
  text: Anti-apoptotic protein which functions as a caspase regulator, using its E3
    ubiquitin-protein ligase activity to smother caspase activity. Binds, ubiquitinates
    and inactivates initiator caspase Dronc, and effector caspases Drice and Dcp-1.
    Acts as a Nedd8- E3 ubiquitin-protein ligase for Drice. Suppresses apoptosis by
    targeting the apoptosome for ubiquitination and inactivation. Plays an important
    role in cell motility. Overexpression suppresses rpr and hid- dependent cell death
    in the eye. Interaction of Diap1 with Dronc is required to suppress Dronc-mediated
    cell death through Diap1-mediated ubiquitination of Dronc. Acts as a positive
    regulator of Wnt signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24306
  source_id: Q24306
