    overall_notes: 'Detailed: E3 ligase that ubiquitinates Dronc, DrICE and Dcp-1,
      NEDD8 ligase for DrICE, suppresses rpr/hid death. Ends on peripheral claims
      (cell motility, positive regulation of Wnt signaling).'
- source: Alliance_Imported
  text: Death-associated inhibitor of apoptosis 1 (Diap1) encodes an E3 ubiquitin
    ligase with a caspase inhibitor activity that is involved in the control of apoptosis.
