    overall_notes: 'Correct but minimal: an E3 ligase with caspase-inhibitor activity
      in apoptosis control. No caspases or RHG antagonists named.'
- source: Alliance_Automated
  text: Enables several functions, including cysteine-type endopeptidase inhibitor
    activity involved in apoptotic process; enzyme binding activity; and ubiquitin-like
    protein ligase activity. Involved in several processes, including germ cell development;
    protein modification by small protein conjugation; and regulation of signal transduction.
    Located in nucleus and perinuclear region of cytoplasm. Is expressed in several
    structures, including Malpighian tubule primordium; ganglia; germline cell; head
    epidermis primordium; and imaginal disc. Human ortholog(s) of this gene implicated
    in several diseases, including X-linked lymphoproliferative syndrome 2; breast
    cancer; carcinoma (multiple); extranodal marginal zone lymphoma of mucosa-associated
    lymphoid tissue; and prostate cancer. Orthologous to human XIAP (X-linked inhibitor
    of apoptosis); BIRC2 (baculoviral IAP repeat containing 2); and BIRC3 (baculoviral
    IAP repeat containing 3).
