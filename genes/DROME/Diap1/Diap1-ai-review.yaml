suggested_questions:
- question: Which endogenous lysines on Dronc, DrICE, and Dcp-1 distinguish degradative,
    nondegradative, and neddylation-dependent DIAP1 inhibition in vivo?
- question: Do Drosophila DIAP1 and mammalian XIAP use an orthologous nuclear Gro/TLE 
    ubiquitination mechanism during endogenous Wg/Wnt signaling, or was the S2/XIAP 
    mechanism co-opted in a narrower context?
- question: Which nonapoptotic Diap1 phenotypes in border-cell migration, SOP 
    morphogenesis, arista patterning, and Eiger signaling require direct caspase 
    ubiquitination rather than altered DIAP1 turnover or a distinct substrate?
suggested_experiments:
- hypothesis: DIAP1 uses separable BIR/RING interfaces to inhibit Dronc, effector 
    caspases, and RHG antagonists in apoptotic versus nonapoptotic contexts.
  description: Generate endogenous Diap1 separation-of-function alleles that selectively
    disrupt Dronc binding, cleaved DrICE/Dcp-1 binding, UbcD1 recruitment, or NEDD8 
    transfer, then quantify apoptosis, Dronc/DrICE/Dcp-1 ubiquitination and neddylation,
    border-cell migration, and SOP shaft-cell morphogenesis in the same allelic series.
  experiment_type: structure-guided endogenous separation-of-function genetics
- hypothesis: Nuclear DIAP1 promotes Wingless signaling by ubiquitinating Drosophila 
    Groucho at the TCF/Lef repressor complex in vivo.
  description: Use tagged endogenous Gro and Diap1, Wg-ON and Wg-OFF imaginal-disc 
    states, ubiquitin remnant profiling, and Gro lysine mutants to test whether 
    Diap1-dependent Gro monoubiquitination controls TCF occupancy independently of 
    caspase inhibition.
  experiment_type: endogenous ubiquitin-remnant proteomics with Wg reporter genetics
