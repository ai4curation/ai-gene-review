id: Q24306
gene_symbol: Diap1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Diap1 encodes the essential Drosophila inhibitor-of-apoptosis protein DIAP1/thread,
  a BIR- and RING-domain E3 ligase that binds the initiator caspase Dronc and the effector
  caspases DrICE and Dcp-1 to restrain apoptosis. Reaper/Hid/Grim-family antagonists, Jafrac2,
  and dOmi/HtrA2 relieve this brake by binding DIAP1, while DIAP1 ubiquitinates or neddylates
  caspases and selected non-caspase substrates in cytosolic and contextual nuclear/developmental
  pathways.'
