id: Q9V853
gene_symbol: Smurf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Smurf (DSmurf, lack) is the Drosophila ortholog of vertebrate Smurf1/Smurf2, a HECT-domain
  E3 ubiquitin-protein ligase with C2 and WW domains that acts in the cytoplasm. Its best-established
  role is to restrict Dpp/BMP signalling: it binds and ubiquitinates Dpp-activated (phosphorylated) MAD
  for degradation and, together with the kinase Fused, ubiquitinates the type I BMP receptor Thickveins,
  generating sharp BMP response gradients in embryonic dorsal-ventral patterning, hindgut development,
  and germline stem cell differentiation in ovary and testis. Smurf also ubiquitinates and controls turnover
  and trafficking of Hedgehog pathway components (Smoothened and Patched) and the Hippo pathway kinase
  Warts.'
