- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:24302888
  qualifier: involved_in
  review:
    summary: Smurf, activated by Smo, ubiquitinates Patched to promote its endocytic turnover, which positively
      regulates Hh signalling; it also promotes receptor endocytosis.
    action: KEEP_AS_NON_CORE
    reason: The Ptc ubiquitination underlying these terms is a direct activity of Smurf, captured in core
      functions by its ubiquitin protein ligase activity on Hh pathway receptors. These process terms
      describe the Hh-dependent, opposite-sign output of the same ligase (Ptc removal promotes signalling)
      and an endocytic consequence, so they are kept as non-core descriptions rather than a separate core
      role.
    supported_by: &id007
    - reference_id: PMID:24302888
      supporting_text: endogenous Smurf protein could be co-immunoprecipitated by anti-Ptc antibody (Figure
        1D)
