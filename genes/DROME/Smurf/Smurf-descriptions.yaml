descriptions:
- source: UniProt
  text: E3 ubiquitin-protein ligase which accepts ubiquitin from an E2 ubiquitin-conjugating
    enzyme in the form of a thioester and then directly transfers the ubiquitin to
    targeted substrates (PubMed:11703946, PubMed:12754252, PubMed:24302888). Down-regulates
    Dpp signaling after gastrulation by promoting MAD ubiquitination and subsequent
    degradation (PubMed:12754252). Acts as a positive regulator of smoothened signaling
    pathway by mediating ubiquitination of patched (ptc), leading to ptc endocytosis
    and lysosomal degradation (PubMed:24302888).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V853
  source_id: Q9V853
