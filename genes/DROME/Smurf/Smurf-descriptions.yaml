      score: 4
    overall_notes: Correct HECT ligase that degrades MAD to restrict Dpp. Calls Smurf
      a positive regulator of Hedgehog signaling through Patched degradation, while
      the review accepts negative regulation of smoothened signaling.
- source: Alliance_Automated
  text: Enables ubiquitin protein ligase activity. Involved in several processes,
    including germarium-derived egg chamber formation; positive regulation of receptor-mediated
    endocytosis; and regulation of signal transduction. Located in cytosol. Is expressed
    in adult head; germarium; spermatozoon; wing hinge primordium; and wing pouch.
    Orthologous to several human genes including SMURF2 (SMAD specific E3 ubiquitin
    protein ligase 2).
