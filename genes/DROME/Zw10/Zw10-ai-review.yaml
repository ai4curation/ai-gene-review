- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT2G32900
  - PANTHER:PTN000258496
  - UniProtKB:O43264
  review:
    summary: Phylogenetic transfer of ER-Golgi trafficking from the ZW10/Dsl1-NRZ family.
    action: MODIFY
    reason: Fly Zw10 localizes to ER and Golgi and with Rint1 is required for ER-Golgi trafficking, so a
      Golgi-ER transport role is well supported. However this term is the anterograde (COPII, ER-to-Golgi)
      direction, whereas the Dsl1/NRZ complex is an ER-resident tether for vesicles returning from the
      Golgi (retrograde), as the supporting quote states, and the fly data do not show an anterograde
      role. The direction-neutral parent Golgi vesicle transport (already present as an ISS row and used
      in core_functions) is the appropriate replacement.
    proposed_replacement_terms:
    - id: GO:0048193
      label: Golgi vesicle transport
    supported_by:
    - reference_id: PMID:22685323
      supporting_text: form a second complex involved in vesicle transport between Golgi and ER
    - reference_id: PMID:25453831
      supporting_text: localized to ER membranes and tethers and then fuses vesicles returning from the
        Golgi
