id: Q9W4X9
gene_symbol: Zw10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Zw10 (Zeste-white 10) is a conserved coiled-coil protein with two separable roles. In mitosis
  it is a subunit of the Rod-Zw10-Zwilch (RZZ) complex, an outer-kinetochore/fibrous-corona component
  that accumulates on unattached kinetochores, recruits Spindly-dynein-dynactin and the Mad1-Mad2 checkpoint
  complex, and is required for spindle assembly checkpoint signalling and accurate sister chromatid segregation;
  after attachment the RZZ streams away from kinetochores along kinetochore microtubules in a dynein-dependent
  manner. In interphase and in spermatocytes Zw10 associates with ER and Golgi membranes and, together
  with Rint1, functions in ER-Golgi membrane trafficking, maintaining Golgi stack number and morphology
  and supplying plasma membrane for cleavage furrow ingression during male meiotic cytokinesis.
