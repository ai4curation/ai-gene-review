- source: Alliance_Imported
  text: Zeste-white 10 (Zw10) encodes a subunit of the RZZ complex located at the
    kinetochores of chromosomes. The RZZ complex plays an essential role in the spindle
    assembly checkpoint that ensures proper connections between chromosomes and the
    mitotic spindle. The product of Zw10 is also found on the Golgi stacks and endoplasmic
    reticulum, where it functions in membrane formation and trafficking.
