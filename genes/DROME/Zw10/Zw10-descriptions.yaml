- source: Alliance_Automated
  text: Enables small GTPase binding activity. Involved in several processes, including
    cytokinetic process; mitotic spindle assembly checkpoint signaling; and nuclear
    division. Located in Golgi apparatus; kinetochore; and spindle. Part of RZZ complex.
    Is expressed in several structures, including adult head; antennal anlage; central
    brain anlage; gland; and male germline cell. Orthologous to human ZW10 (zw10 kinetochore
    protein).
