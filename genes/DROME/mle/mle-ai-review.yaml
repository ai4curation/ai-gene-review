id: P24785
gene_symbol: mle
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: mle (maleless) encodes a DExH-box RNA helicase of the RNA helicase A/DHX9 family with two
  N-terminal double-stranded RNA-binding domains (dsRBDs). In males MLE is a subunit of the male-specific
  lethal (MSL) dosage compensation complex. It binds the tandem stem-loops of the noncoding roX1 and roX2
  RNAs and, using ATP-dependent 3'-to-5' unwinding, remodels them so that MSL2 can bind and the roX RNAs
  are incorporated into the complex. This RNA remodeling is required for assembly of the complex and its
  spreading along the male X chromosome, where it raises transcription of X-linked genes about two-fold;
  mle null males die as larvae. MLE is nuclear in both sexes but coats the X chromosome only in males.
  A temperature-sensitive allele (napts) reduces neuronal sodium-channel function, consistent with an
  additional role of MLE in processing or editing of the para transcript.
