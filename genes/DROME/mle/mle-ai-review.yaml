    of roX lncRNAs, enabling MSL2 binding and roX incorporation during dosage compensation complex assembly
    on the male X.
  molecular_function:
    id: GO:0034458
    label: 3'-5' RNA helicase activity
  directly_involved_in:
  - id: GO:0042714
    label: dosage compensation complex assembly
  - id: GO:0009047
    label: dosage compensation by hyperactivation of X chromosome
  locations:
  - id: GO:0000805
    label: X chromosome
  in_complex:
    id: GO:0016456
    label: X chromosome located dosage compensation complex, transcription activating
  supported_by:
  - reference_id: PMID:26545078
    supporting_text: The MLE helicase remodels the roX lncRNAs, enabling the lncRNA-mediated assembly
      of the Drosophila dosage compensation complex.
  - reference_id: PMID:9184214
    supporting_text: this mutation abolished both NTPase and helicase activities of MLE
  - reference_id: file:DROME/mle/mle-deep-research-falcon.md
    supporting_text: In this pathway, MLE is an RNA-remodeling enzyme and assembly factor
- description: Binds roX1/roX2 lncRNA stem-loops through its tandem dsRBDs, which tethers MLE in the MSL
    complex and is required for its localization to the male X.
  molecular_function:
    id: GO:0106222
    label: lncRNA binding
  directly_involved_in:
  - id: GO:0009047
    label: dosage compensation by hyperactivation of X chromosome
  locations:
  - id: GO:0000805
    label: X chromosome
  in_complex:
    id: GO:0072487
    label: MSL complex
  supported_by:
  - reference_id: PMID:23870142
    supporting_text: MLE RNA helicase and MSL2 ubiquitin ligase, bind evolutionarily conserved domains
      containing tandem stem-loops in roX1 and roX2 RNAs in vivo
  - reference_id: PMID:30649456
    supporting_text: Here, we report a 2.90Å crystal structure of tandem dsRBDs of MLE in complex with
      a 55mer stem-loop of roX2 (R2H1).
suggested_questions:
- question: Does MLE act on the para transcript (RNA editing or splicing) in neurons, and does that explain
    the napts neural phenotypes?
- question: Is MLE's DNA-unwinding activity, seen in vitro, used in any in vivo process in flies?
suggested_experiments:
- description: CLIP-seq for MLE in female or neuronal tissue to identify roX-independent RNA targets,
    including para pre-mRNA, and test whether helicase-dead MLE alters their processing.
