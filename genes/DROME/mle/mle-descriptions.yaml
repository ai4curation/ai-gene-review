- source: Alliance_Imported
  text: maleless (mle) encodes a helicase and a member of the Male-Specific-Lethal
    dosage compensation complex, which increases male X chromosome transcription approximately
    two-fold. mle homozygous mutant males die as larvae, while females are viable.
  source_type: curated
