descriptions:
- source: UniProt
  text: RNA helicase component of the male-specific lethal (MSL) histone acetyltransferase
    complex, a multiprotein complex essential for elevating transcription of the single
    X chromosome in the male (X chromosome dosage compensation) (PubMed:1653648, PubMed:25158899,
    PubMed:26545078). Within the MSL complex, the helicase activity of mle remodels
    roX non-coding RNA (roX1 and roX2)s to promote assembly of the MSL complex (PubMed:23870142,
    PubMed:26545078, PubMed:30649456, PubMed:30805612). Able to unwind blunt-ended
    RNA duplexes and has specificity for uridine-rich nucleotides (PubMed:26545078).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P24785
  source_id: P24785
