- source: Alliance_Automated
  text: Enables several functions, including 3'-5' RNA helicase activity; ATP hydrolysis
    activity; and RNA binding activity. Involved in several processes, including determination
    of adult lifespan; male courtship behavior, veined wing generated song production;
    and regulation of gene expression. Located in chromatin; cytosol; and nuclear
    chromosome. Part of MSL complex and X chromosome located dosage compensation complex,
    transcription activating. Is active in X chromosome. Is expressed in adult head.
    Used to study epilepsy. Human ortholog(s) of this gene implicated in autosomal
    dominant intellectual developmental disorder 75. Orthologous to human DHX9 (DExH-box
    helicase 9).
  source_type: automated
