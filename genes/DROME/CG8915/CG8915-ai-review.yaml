- id: PMID:29360036
  title: ketu mutant mice uncover an essential meiotic function for the ancient RNA helicase YTHDC2.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Full text read. It supports mammalian YTHDC2 activity, the Bgcn-is-a-paralog conclusion, and
      the existence in non-Drosophila schizophoran flies of a YTH-less YTHDC2 homolog with intact R3H
      and helicase motifs. Its claim that no Drosophila genome has that more YTHDC2-like version is
      contested by CG8915. CG8915 has exactly that architecture but no ankyrin-repeat domain, which
      the paper treats as diagnostic of the family, and the paper never names CG8915. Re-review
      2026-10-20: the claim remains DISPUTED rather than refuted, because a phylogeny that includes
      CG8915 has not been done.
  findings:
  - statement: Non-Drosophila schizophoran flies carry a YTH-less YTHDC2 homolog with intact R3H and helicase
      motifs, distinct from Bgcn; the authors report that Drosophila lacks it.
    supporting_text: most schizophoran flies also have a second YTHDC2 homolog that lacks the YTH domain
      but that, unlike Bgcn, has intact R3H and helicase motifs I and II
  - statement: Bgcn lost ATP-binding and hydrolysis motifs and cannot be an ATP-dependent helicase, so
      Bgcn's mechanism must not be transferred to CG8915, which retains these motifs.
    supporting_text: thus making it impossible for Bgcn to have the ATP-dependent RNA helicase activity
      that is presumably retained in other YTHDC2 family members
core_functions:
- description: ATP-dependent DEAH-box RNA helicase that binds RNA through its R3H and helicase core and
    unwinds or remodels it with 3'-to-5' polarity. The function is inferred from the intact catalytic
    motifs and from YTHDC2 subfamily membership. The RNA substrates and biological context are unknown.
  molecular_function:
