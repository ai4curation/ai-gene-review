  review:
    action: ACCEPT
    summary: CG8915 retains the canonical Walker A (motif I) ATP-binding P-loop of DEAH helicases.
    reason: The aligned motif I in CG8915 (232-240 GATGSGKST) matches the GxTGSGKT/ST consensus that
      binds ATP in DEAH/RHA helicases. This contrasts with Bgcn, whose motif I is degenerate (AALCWDKSV)
      and is reported to preclude ATP binding. ATP binding is intrinsic to the helicase core function.
