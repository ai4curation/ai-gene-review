    id: GO:0034458
    label: 3'-5' RNA helicase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9H6S0
  review:
    action: ACCEPT
    summary: A sound curator transfer from human YTHDC2, a member of the same PANTHER subfamily (SF213),
      to a protein that keeps the complete catalytic helicase core.
    reason: The transfer is limited to the helicase core, which CG8915 shares with YTHDC2 (about 43-44%
      identity over both helicase lobes). Human YTHDC2 is biochemically an RNA-induced ATPase with 3'-to-5'
      helicase activity, and 3'-to-5' translocation is the general polarity of DEAH/RHA helicases. CG8915
      lacks the YTHDC2 ankyrin-repeat insertion and the YTH domain, so no N6-methyladenosine recognition
      or ARD-dependent partner recruitment is implied by this row. The FlyBase ISS is accepted as the
      core molecular function, with the caveat that no Drosophila enzymology exists.
    supported_by:
    - reference_id: PMID:29033321
      supporting_text: RNA-induced ATPase with a 3'→5' RNA helicase activity.
    - reference_id: file:DROME/CG8915/CG8915-bioinformatics/RESULTS-rereview.md
      supporting_text: CG8915 therefore has the R3H plus intact DEAH helicase architecture without the
        two YTHDC2-specific accessory modules.
    - reference_id: file:DROME/CG8915/CG8915-uniprot.txt
      supporting_text: "DR   PANTHER; PTHR18934:SF213; 3'-5' RNA HELICASE YTHDC2; 1."
