  label: Drosophila melanogaster
description: CG8915 is an R3H-containing DEAH-family RNA helicase with conserved ATP-binding and catalytic
  motifs. It is inferred to couple ATP hydrolysis to RNA remodeling with 3'-to-5' polarity, based on its
  relationship to characterized YTHDC2-family enzymes. Its physiological RNA targets and cellular compartment
  remain unresolved. The protein is distinct from the divergent helicase-like Bgcn protein and lacks an
  annotated YTH methyladenosine-reader domain.
