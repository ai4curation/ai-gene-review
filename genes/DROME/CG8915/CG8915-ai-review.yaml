suggested_questions:
- question: Should PAINT add a 3'-5' RNA helicase activity IBD at the PTHR18934:SF213
    YTHDC2-subfamily node, or should CG8915 continue receiving only broad helicase activity
    by IBA until the Drosophila YTHDC2/Bgcn phylogeny and Drosophila-specific helicase
    polarity are resolved?
- question: Is CG8915 the Drosophila ortholog of the YTH-less, R3H-intact YTHDC2-like paralog found in
    other schizophoran flies, which has since lost the ankyrin-repeat insertion? Or is it a separate
    R3H-DEAH lineage within PTHR18934:SF213? A tree of SF213 sequences that includes CG8915, Bgcn
    and the non-Drosophila schizophoran copies would settle this.
suggested_experiments:
- description: Test recombinant CG8915 for RNA-stimulated ATPase activity and for unwinding of 3'-tailed
    versus 5'-tailed RNA duplexes, with a motif II (DEAH to AAAH) mutant as the negative control.
  experiment_type: in vitro biochemistry
- description: Identify CG8915-bound RNAs and protein partners in ovary or early embryo (for example by
    CLIP and IP-mass spectrometry of an endogenously tagged allele), and test whether CG8915 associates
    with Bam, Bgcn or other germline RNA regulators.
  experiment_type: RNA-protein interaction profiling
