  label: Drosophila melanogaster
description: CG8915 encodes a 976-residue DEAH-box (DHX-type) RNA helicase. It has an N-terminal R3H
  domain, a two-lobed helicase core with an intact ATP-binding P-loop (GATGSGKST) and a DEAH motif II,
  and C-terminal HA2 and OB-fold domains. PANTHER places it in the YTHDC2 subfamily of DEAH helicases,
  and its best bidirectional human match is YTHDC2. Unlike vertebrate YTHDC2, CG8915 has no ankyrin-repeat
  insertion between its helicase lobes and no YTH N6-methyladenosine-reader domain. It is also distinct
  from the fly YTHDC2-family paralog Bgcn, whose helicase motifs are degenerate. By conserved mechanism,
  CG8915 is expected to act as an RNA-stimulated ATPase that unwinds or remodels RNA with 3'-to-5' polarity.
  Its RNA targets, partners, subcellular location and biological role have not been studied experimentally.
  The transcript is maternally deposited and is detected in embryonic primordial germ cells.
