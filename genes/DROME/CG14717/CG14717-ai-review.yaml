  label: Drosophila melanogaster
description: >-
  CG14717 is a 306-residue Drosophila melanogaster mitochondrial matrix
  alpha/beta-hydrolase-fold pseudoenzyme of the ABHD11 family (PTHR46118:SF4)
  that arose by Diptera-specific gene duplication alongside its catalytically
  active paralog CG2059. Unlike CG2059 and vertebrate ABHD11, CG14717 replaces
  the essential beta-5 GxSxG nucleophilic serine with glycine (Gly120 within
  116-ALGHGMGGR-124) and alters the canonical HGLGG oxyanion-hole loop
  (50-HDLNL-54) while retaining the beta-6 aspartate (Asp144) and loop
  histidine (His282), rendering the protein catalytically inactive toward
  serine-hydrolase ester substrates; its endogenous non-catalytic role in fly
  mitochondria remains unknown.
