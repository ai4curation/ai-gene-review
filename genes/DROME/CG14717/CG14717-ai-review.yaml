suggested_questions:
- question: >-
    Does the catalytically inactive Gly120 pseudoenzyme CG14717 associate with
    the Drosophila mitochondrial 2-oxoglutarate dehydrogenase complex or its
    active paralog CG2059 as a regulatory or substrate-binding subunit?
suggested_experiments:
- hypothesis: >-
    Recombinant CG14717 lacks fluorophosphonate reactivity and esterase
    catalysis due to its Gly120 substitution, whereas Gly120Ser reversion
    partially restores reactivity or mitochondrial affinity purification
    identifies non-catalytic matrix binding partners.
  description: >-
    Assay purified wild-type CG14717 and a Gly120Ser revertant alongside active
    paralog CG2059 with fluorophosphonate-rhodamine ABPP probes and p-nitrophenyl
    esters, and perform AP-MS from isolated Drosophila mitochondria to determine
    its endogenous complex associations.
  experiment_type: Affinity purification-mass spectrometry and site-directed mutagenesis ABPP assay
