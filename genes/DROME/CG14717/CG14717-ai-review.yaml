references:
- id: file:DROME/CG14717/CG14717-hypotheses/kgap-cg14717-noncatalytic-surfaces/openscientist.md
  title: OpenScientist analysis of which non-catalytic surfaces the CG14717 pseudoenzyme retains
  findings:
  - statement: >-
      CG14717 has lost exactly one triad residue, the nucleophile, keeping the Asp-His dyad in native
      geometry and the substrate cavity in position; the conserved-surface and cap-divergence proxies give
      no positive support for a scaffolding role, and no 2-oxoglutarate dehydrogenase subunit has been
      reported as a partner for CG14717 or any invertebrate ortholog.
    supporting_text: >-
      The retained Asp-His dyad in native geometry means the loss is a point change on an otherwise
      intact catalytic scaffold.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally against Q9VGJ4: 306 residues, GHGMGG at 118-123 with Gly120 and Met121, His52, Asp53, Leu54,
      Asn55, Asp144, Gly281 and His282, the Pfam AB-hydrolase-1 domain at 46..288, the PANTHER PTHR46118:SF4
      assignment, and the N-terminal 40 residues carrying five arginines, one lysine and one acidic residue.
      The eight GOA rows were checked against the local GOA file and match, including ECO:0000250 for both
      the carboxylesterase and the matrix row and ECO:0000320 for the NOT peptidase row. Not verified: the
      AlphaFold superposition and RMSD, the cavity volumes and overlap, the surface-conservation permutation
      test, the orthogroup scoring, the IntAct record counts and the YbfF distances. Three of the run's
      findings are blinded reproductions of local analyses withheld from the prompt and agree with them
      exactly: Gly120, Asp144 and His282, the 52-HDLNL-56 oxyanion loop, and the correction of the human
      Q8NFV4 charge-relay acid from the annotated Asp228 to Asp156.
