knowledge_gaps:
- gap_statement: >-
    Endogenous non-catalytic biological role and binding partners of the
    mitochondrial matrix pseudoenzyme CG14717 in Drosophila melanogaster are
    unknown.
  boundary: >-
    Determine whether CG14717 scaffolds mitochondrial matrix 2-oxoacid dehydrogenase subunits or binds
    lipoylated/acyl-CoA ligands non-catalytically in vivo. An OpenScientist run
    (kgap-cg14717-noncatalytic-surfaces) tests both halves of that question and splits them: the
    architecture supports ligand binding and gives no positive support for complex scaffolding. It also
    reproduces, blinded, three findings this project had already made locally and withheld from the prompt.
    The pseudoenzyme call is now auditable position by position, and every residue was confirmed in the
    local Q9VGJ4 record: the nucleophile elbow reads GHGMGG at 118-123 against GHSMGG in human ABHD11 and in
    the catalytic fly paralog CG2059, so the attacking serine is Gly120; the oxyanion-hole glycine
    equivalent to human Gly65 is Asp53 and human Phe67 is Asn55, giving the 52-HDLNL-56 loop; and the
    charge-relay pair is untouched, Asp144 with His282 preceded by Gly281, hydrogen bonding at 2.72
    Angstrom, the same distance measured in the human model. Exactly one triad residue is lost, the
    nucleophile, on an otherwise intact catalytic scaffold. Resolving the triad required the same correction
    this project had already recorded in its human ABHD11 review and bioinformatics file: UniProt annotates
    Asp228 of Q8NFV4 as part of the charge-relay system, but the acid lies 24 residues after the
    nucleophile, which is Asp156, and the run measures Asp228 at 20.73 Angstrom from Ser132. The pocket has
    not collapsed. After superposition of the two models, 241 CA pairs at 1.31 Angstrom with every catalytic
    anchor landing within half an Angstrom of its sequence-predicted partner, a grid cavity search finds the
    enclosed site still present at the position of the ABHD11 active site, lined by the equivalent residues,
    with 75 per cent of the human cavity volume reproduced at 0.77 Angstrom mean displacement; the absolute
    volumes reverse between two grid thresholds, so the run reads this as retained rather than enlarged, and
    deleting the Asp53 side chain in silico changes it by only about 20 cubic Angstrom, meaning that
    substitution narrows the site without plugging it. The scaffolding test is negative on both proxies that
    exist. Across 16 Drosophilid orthologs the most conserved surface residues show no spatial clustering at
    all, sitting if anything more dispersed than chance, while the same test on cavity-lining residues
    returns a strong positive, so the method detects a real cluster when there is one; and the exposed face
    of the cap insertion, which in this fold is where partner contacts sit, is the least conserved surface
    of the protein. Power is the stated caveat, since seven of the 16 orthologs are over 84 per cent
    identical and an interface conserved in chemical character rather than residue identity would be missed,
    so this argues against a conserved scaffolding surface without excluding a lineage-restricted one. A
    second limit is firmer and is the reason the test had to be indirect: no experimental structure of
    ABHD11 exists in any species, only the bacterial relative YbfF, and the human ABHD11 association with
    the 2-oxoglutarate dehydrogenase complex rests on coimmunoprecipitation and rescue with no interface
    map, so the assembly surfaces this gap asks about have never been defined in the catalytic relative. On
    partners the answer is that some exist and all are weak: six chaperone associations from a tagged
    affinity-purification map, which for a matrix protein reads as a folding client and is also a known
    background pattern, and one yeast two-hybrid hit with a cytosolic farnesyltransferase subunit that is
    topologically inconsistent with the matrix. No subunit of the 2-oxoglutarate dehydrogenase complex has
    been reported for CG14717 or for any invertebrate ortholog, which is the single interaction that would
    carry the scaffolding reading across. Two further results sharpen what remains. The nucleophile loss is
    old and repeated: in the CG14717 orthogroup 16 of 19 scorable proteins have lost the serine, by glycine
    in 13 lineages and independently by aspartate and asparagine in two others, spanning the melanogaster
    group, the repleta and virilis radiations and the Hawaiian lineage, while the catalytic paralog
    orthogroup keeps it in 41 of 42. That is relaxed selection on catalysis rather than one ancient switch
    to a single conserved non-catalytic role. Yet the gene is maintained as a full-length well-folded ORF,
    and the import signal is not merely intact but more presequence-like than the catalytic human
    ortholog's, with the highest net positive charge, the fewest acidic residues and the largest amphipathic
    moment of the three proteins compared, all consistent with the N-terminal 40 residues of the local
    record. Selection has therefore acted differently on the two ends of this protein, which is the
    strongest argument available that it still does something. No annotation action follows: the run's
    reading of the carboxylesterase row as paralog carry-over is the conclusion this review had already
    reached and stated in the same terms, and it confirms that neither activity-based proteomics study
    produced a CG14717 record, as both methods need an intact nucleophile.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  provenance:
  - reference_id: file:DROME/CG14717/CG14717-notes.md
