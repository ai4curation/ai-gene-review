gene_symbol: HSPC300
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: HSPC300 (Brick1/Brk1 ortholog) is the smallest subunit of the WAVE regulatory complex, a
  short coiled-coil protein that associates with SCAR and Abi in the SCAR-Abi-HSPC300 trimer. HSPC300
  contributes to stability of all WRC subunits in vivo and to WRC-driven, Arp2/3-dependent actin protrusions
  such as lamellipodia. Loss of HSPC300 phenocopies loss of other WRC subunits in axonal growth and neuromuscular
  junction development.
