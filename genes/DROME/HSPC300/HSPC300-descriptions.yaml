- source: Alliance_Imported
  text: Haematopoietic stem/progenitor cell protein 300 (HSPC300) encodes a subunit
    of the Scar/WAVE complex, which activates the Arp2/3 complex at the plasma membrane
    to generate membrane protrusions that drive cell migration.
