- source: Alliance_Automated
  text: Involved in several processes, including central nervous system morphogenesis;
    positive regulation of plasma membrane bounded cell projection assembly; and regulation
    of Arp2/3 complex-mediated actin nucleation. Part of SCAR complex. Is expressed
    in larval central nervous system; larval longitudinal connective; ovary; and symmetrical
    commissure. Orthologous to human BRK1 (BRICK1 subunit of SCAR/WAVE actin nucleating
    complex).
