- source: Alliance_Automated
  text: Predicted to enable fatty-acyl-CoA binding activity; long-chain fatty acyl-CoA
    dehydrogenase activity; and very-long-chain fatty acyl-CoA dehydrogenase activity.
    Predicted to be involved in fatty acid beta-oxidation using acyl-CoA dehydrogenase.
    Predicted to be located in mitochondrion. Is expressed in several structures,
    including adult head; adult heart; embryonic salivary gland duct; larval muscle
    system; and salivary gland body primordium. Human ortholog(s) of this gene implicated
    in very long chain acyl-CoA dehydrogenase deficiency. Orthologous to human ACADVL
    (acyl-CoA dehydrogenase very long chain).
