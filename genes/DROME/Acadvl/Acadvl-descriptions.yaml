descriptions:
- source: UniProt
  text: Very long-chain specific acyl-CoA dehydrogenase is one of the acyl-CoA dehydrogenases
    that catalyze the first step of mitochondrial fatty acid beta-oxidation (FAO),
    breaking down fatty acids into acetyl- CoA and allowing the production of energy
    from fats. The first step of FAO consists in the proR-proR stereospecific alpha,
    beta- dehydrogenation of fatty acyl-CoA thioesters using the electron transfer
    flavoprotein (ETF) as their physiologic electron acceptor, resulting in the formation
    of trans-2-enoyl-CoA ((2E)-enoyl-CoA). Among the different mitochondrial acyl-CoA
    dehydrogenases, very long-chain specific acyl-CoA dehydrogenase acts specifically
    on fatty acyl-CoAs with saturated 12 to 24 carbons long primary chains.
  source_type: curated
  url: https://www.uniprot.org/uniprot/A1ZBJ2
  source_id: A1ZBJ2
