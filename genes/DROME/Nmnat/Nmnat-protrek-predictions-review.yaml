    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 13.86). Protein ADP-ribosyltransferase-substrate adaptor activity describes proteins
      that present substrates to PARPs. Nmnat supplies the NAD+ that ADP-ribosyltransferases consume,
      but it is not an adaptor for them and no such interaction is reported. This is the same substrate-consumer
      conflation as the dfrP glycine-biosynthesis call: the enzyme is being annotated to a process
      that uses its product.
