    summary: >-
      Rank 2 (score 14.10). Nicotinamide riboside biosynthesis runs in the opposite direction from
      NMNAT: NR is produced by dephosphorylation of NMN by 5'-nucleotidases, whereas Nmnat consumes
      NMN to make NAD+. The term is in the right metabolic neighbourhood - NAD salvage - and names
      the wrong reaction within it, the recurring pattern for enzymes with well-populated pathway
      context.
