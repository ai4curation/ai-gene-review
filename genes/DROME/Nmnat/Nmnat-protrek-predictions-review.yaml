description: >-
  ProTrek sequence-to-text retrieval for Drosophila Nmnat, the bifunctional NAD+ synthesis enzyme
  and moonlighting chaperone. Rank 1 is the exact primary catalytic activity, and rank 4 its parent;
  the model gets the enzymology right and misses everything else. The chaperone/holdase arm - this
  review's third core function, supported by an IDA unfolded protein binding annotation and by the
  neuroprotective axon-maintenance phenotype - is absent from the top five, even though ProTrek's
  own free-text channel returns the axon survival factor description at rank 2. Assessment: 1 correct
  not novel (CNN), 2 nonparalog incorrect (NPI).
