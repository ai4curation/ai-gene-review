  text: Enables nicotinamide-nucleotide adenylyltransferase activity; nicotinate-nucleotide
    adenylyltransferase activity; and unfolded protein binding activity. Involved
    in several processes, including NAD+ biosynthetic process via the salvage pathway;
    negative regulation of neuromuscular synaptic transmission; and neuron projection
    maintenance. Located in several cellular components, including neuromuscular junction;
    neuronal cell body; and presynaptic active zone. Used to study neurodegenerative
    disease. Human ortholog(s) of this gene implicated in Leber congenital amaurosis
    9 and spondyloepiphyseal dysplasia, sensorineural hearing loss, intellectual developmental
    disorder, and Leber congenital amaurosis. Orthologous to several human genes including
    NMNAT1 (nicotinamide nucleotide adenylyltransferase 1). [provided by Alliance
