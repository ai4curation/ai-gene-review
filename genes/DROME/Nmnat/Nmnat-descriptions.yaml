- source: Alliance_Automated
  text: Enables nicotinamide-nucleotide adenylyltransferase activity and protein folding
    chaperone. Involved in several processes, including NAD+ biosynthetic process
    via the salvage pathway; negative regulation of neuromuscular synaptic transmission;
    and neuron projection maintenance. Located in neuromuscular junction; neuronal
    cell body; and presynaptic active zone. Is active in cytosol and nucleus. Used
    to study neurodegenerative disease. Human ortholog(s) of this gene implicated
    in Leber congenital amaurosis 9 and spondyloepiphyseal dysplasia, sensorineural
    hearing loss, intellectual developmental disorder, and Leber congenital amaurosis.
    Orthologous to several human genes including NMNAT1 (nicotinamide nucleotide adenylyltransferase
    1).
