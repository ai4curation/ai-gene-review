- source: Alliance_Imported
  text: Nicotinamide mononucleotide adenylyltransferase (Nmnat) encodes an essential
    enzyme in the NAD salvage pathway, catalyzing the last step of NAD synthesis.
    It is also a neuronal maintenance factor that protects neurons from excitotoxicity,
    environmental stress and protein misfolding induced degeneration.
