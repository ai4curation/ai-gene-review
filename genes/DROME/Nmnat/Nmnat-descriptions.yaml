descriptions:
- source: UniProt
  text: 'Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN)
    and ATP (PubMed:17132048, PubMed:19403820). Essential for viability (PubMed:17132048).
    Stress-response chaperone protein that prevents toxic aggregation of proteins
    and promotes proteasome-mediated degradation of misfolded proteins; this is independent
    of its NAD(+) synthesis activity (PubMed:18344983). Neuroprotective in response
    to toxic protein aggregation, for example by overexpressed Atx-1/ataxin-1 (PubMed:18344983).
    Required for maintenance and integrity of mature neurons, protecting them from
    neuronal activity-induced neurodegeneration (PubMed:17132048, PubMed:19403820).
    Required for the maintenance of axonal and dendritic integrity in both central
    and peripheral neurons (PubMed:21596138, PubMed:22425156). Chaperone function
    and neuroprotective roles are largely independent of NAD(+) synthesis activity
    (PubMed:17132048, PubMed:18344983, PubMed:21596138). . [Isoform C]: Catalyzes
    the formation of NAD(+) from nicotinamide mononucleotide (NMN) and ATP (PubMed:26616331).
    Has, or stimulates, chaperone holdase activity but not refoldase activity (PubMed:26616331).
    Does not have neuroprotective properties and may stimulate apoptosis and neurodegeneration
    in response to toxic protein aggregates (PubMed:26616331). . [Isoform D]: Catalyzes
    the formation of NAD(+) from nicotinamide mononucleotide (NMN) and ATP (PubMed:26616331).
    Has, or stimulates, chaperone holdase and refoldase activity (PubMed:26616331).
    Neuroprotective and reduces the toxic load of protein aggregates, preventing apoptosis
    and neurodegeneration (PubMed:26616331). Promotes clearance of nuclear misfolded
    protein aggregates (PubMed:26616331).'
