    action: REMOVE
    reason: Insects are cholesterol auxotrophs and lack de novo sterol biosynthesis, so SCAP cannot regulate
      a cholesterol biosynthetic process in Drosophila; the fly SREBP-SCAP system instead controls fatty
      acid and phospholipid synthesis.
    supported_by:
