gene_symbol: SCAP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SCAP (SREBP cleavage-activating protein) is a polytopic endoplasmic reticulum membrane protein
  with a sterol-sensing domain and C-terminal WD40 repeats that binds the regulatory domain of the membrane-bound
  transcription factor SREBP. In the SREBP-SCAP complex it escorts SREBP in COPII vesicles from the ER
  to the Golgi, where site-1 and site-2 proteases release the N-terminal transcription factor domain.
  Drosophila cannot synthesize sterols, and in flies SREBP processing is controlled mainly by membrane
  phospholipid (phosphatidylethanolamine) levels rather than by sterols, so SCAP-dependent SREBP activation
  regulates fatty acid and phospholipid synthesis.
