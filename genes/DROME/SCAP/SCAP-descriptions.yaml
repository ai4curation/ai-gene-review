descriptions:
- source: UniProt
  text: 'Escort protein required for cholesterol as well as lipid homeostasis. Regulates
    export of the SCAP-SREBP complex from the endoplasmic reticulum to the Golgi upon
    low cholesterol, thereby regulating the processing of sterol regulatory element-binding
    proteins (SREBPs) SREBF1/SREBP1 and SREBF2/SREBP2. At high sterol concentrations,
    formation of a ternary complex with INSIG (INSIG1 or INSIG2) leads to mask the
    ER export signal in SCAP, promoting retention of the complex in the endoplasmic
    reticulum. Low sterol concentrations trigger release of INSIG, a conformational
    change in the SSD domain of SCAP, unmasking of the ER export signal, promoting
    recruitment into COPII-coated vesicles and transport of the SCAP-SREBP to the
    Golgi: in the Golgi, SREBPs are then processed, releasing the transcription factor
    fragment of SREBPs from the membrane, its import into the nucleus and up-regulation
    of LDLR, INSIG1 and the mevalonate pathway. Binds cholesterol via its SSD domain.'
  source_type: curated
