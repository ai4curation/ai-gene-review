findings:
- category: discrepancy
  text: UniProt and the automated texts describe sterol-regulated SREBP processing
    and cholesterol synthesis. The review says flies cannot make sterols and regulate
    SREBP through phosphatidylethanolamine, and it removes the cholesterol biosynthesis
    annotation.
