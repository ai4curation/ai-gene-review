- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010977
  review:
    summary: Amino acid metabolic process from InterPro IPR010977.
    action: MODIFY
    reason: Amino acid metabolic process is a family-level InterPro inference. Tyramine is not an amino
      acid, so tyramine biosynthetic process (GO:1901695) is not a descendant of this term; the replacement
      is a lateral move to the informative process, which the gene already carries by IMP, rather than
      a narrowing. (The strict amino-acid-side specialization would be L-tyrosine catabolic process, GO:0006572,
      but tyrosine decarboxylation is studied here as tyramine synthesis.)
    proposed_replacement_terms:
    - id: GO:1901695
      label: tyramine biosynthetic process
    supported_by:
    - reference_id: PMID:15691831
      supporting_text: Flies with a mutation in dTdc2 lack neural tyramine and octopamine
      reference_section_type: ABSTRACT
- term:
    id: GO:0006589
    label: octopamine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:15691831
  qualifier: involved_in
  review:
    summary: Tdc2 mutants lack neural octopamine as well as tyramine.
    action: ACCEPT
    reason: Tdc2 catalyzes the first step of octopamine synthesis (tyrosine to tyramine, which Tbh then
      hydroxylates), so Tdc2 itself performs a step of the octopamine biosynthetic pathway; loss of Tdc2
      abolishes neural octopamine.
    supported_by:
