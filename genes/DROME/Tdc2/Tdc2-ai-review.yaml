suggested_questions:
- question: Does rhythmic translation of Tdc2 in clock neurons produce rhythmic tyramine/octopamine release,
    and which receptor mediates the effect on locomotor rhythmicity?
suggested_experiments:
- description: Measure tyramine and octopamine in sorted clock neurons across the circadian cycle in wild-type
    and per0 flies to test whether rhythmic TDC2 protein produces rhythmic amine levels.
