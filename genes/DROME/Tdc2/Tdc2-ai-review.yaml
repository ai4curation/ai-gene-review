  label: Drosophila melanogaster
description: Tdc2 encodes the neural tyrosine decarboxylase of Drosophila melanogaster, a pyridoxal 5'-phosphate-dependent
  group II aromatic amino acid decarboxylase that converts L-tyrosine to tyramine, the first and committed
  step in the synthesis of the trace amine neurotransmitters tyramine and octopamine. Tdc2 is expressed
  in tyraminergic/octopaminergic neurons of the central nervous system, and Tdc2 mutants lack neural tyramine
  and octopamine. Loss of Tdc2 causes female sterility through failure of egg deposition, strongly reduced
  adult locomotor activity, hypersensitivity to cocaine, and loss of circadian locomotor rhythmicity;
  the latter reflects a requirement for Tdc2 within clock neurons, where TDC2 protein levels oscillate.
  The non-neural paralog Tdc1 performs the same reaction in peripheral tissues.
