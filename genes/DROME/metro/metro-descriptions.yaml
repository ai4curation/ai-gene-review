descriptions:
- source: Alliance_Imported
  text: menage a trois (metro) encodes controls the expansion of larval neuromuscular
    junctions (NMJs) and the proper establishment of synaptic boutons. At NMJs Metro
    associates with the adaptor protein encoded by veli to stabilize the product of
    dlg1 in a trimeric scaffold complex that limits the size of active zones and glutamate
    receptor fields.
