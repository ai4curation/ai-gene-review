    summary: Cell-junction localization is biologically supported by direct immunolocalization of Metro
      to the subsynaptic reticulum (SSR) of type I boutons at larval neuromuscular junctions, where it
      stabilizes junctional DlgS97 with DLin-7. The gene already carries GO:0071212 subsynaptic reticulum
      by IDA (an is_a/part_of descendant of cell junction via synapse, checked in OLS4) and GO:0005911
      cell-cell junction by IBA, so the prediction is correct but less precise. The identical cell-junction
      term in GOA rests only on an ARBA rule, which the gene review refines to SSR.
