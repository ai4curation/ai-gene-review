      supporting_text: In this study we have identified Metro, a novel p55/MPP-like Drosophila MAGUK as
        a major binding partner of perisynaptic DlgS97 at larval NMJs.
    - reference_id: PMID:20427642
      supporting_text: Based on homotypic LIN-2,-7 (L27) domain interactions, Metro stabilizes junctional
        DlgS97 in a complex with the highly conserved adaptor protein DLin-7.
