- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:20427642
  qualifier: enables
  review:
    action: NEW
    summary: Metro's tandem L27 domains bind the L27 domain of DLin-7 (C-terminal L27 required) and the
      N-terminal L27 domain of DlgS97 (N-terminal L27 sufficient) in pull-downs, Metro co-immunoprecipitates
      with DLin-7 from muscle, and Metro is the linker that brings DLin-7 into the DlgS97 complex at the
      NMJ.
    reason: This is the core molecular activity directly demonstrated for Metro and is currently absent
      from GOA, whose MF rows are all fold-derived electronic transfers. Adaptor activity (bringing two
      proteins together so they act in a coordinated way) describes the L27-mediated linkage of DlgS97
      and DLin-7 better than bare protein binding. The same L27 linker role is conserved in its closest
      vertebrate relatives (MPP7 with LIN7 and DLG1), but the annotation rests on Metro's own data.
    supported_by:
    - reference_id: PMID:20427642
      supporting_text: Based on homotypic LIN-2,-7 (L27) domain interactions, Metro stabilizes junctional
        DlgS97 in a complex with the highly conserved adaptor protein DLin-7.
    - reference_id: file:DROME/metro/metro-publication-artifacts/PMID_20427642.txt
      supporting_text: Metro is essential for the recruitment of DLin-7 to NMJs
