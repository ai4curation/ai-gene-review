taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Metro is a p55/MPP-family MAGUK scaffold that organizes perisynaptic protein complexes at
  Drosophila larval neuromuscular junctions. Through its L27 domains it links DlgS97 and DLin-7, stabilizing
  synaptic organization and controlling bouton formation and postsynaptic receptor-field size. Its guanylate-kinase-like
  domain does not establish enzymatic phosphate transfer.
