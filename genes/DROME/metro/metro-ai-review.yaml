id: A1Z8G0
gene_symbol: metro
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Metro (Menage a trois) is a p55/MPP-like membrane-associated guanylate kinase (MAGUK)
  scaffold protein with two N-terminal L27 domains followed by PDZ, SH3 and a C-terminal guanylate-kinase-like
  (GUK) domain. It is expressed mainly in the developing nervous system and in larval body-wall muscle,
  where it is concentrated postsynaptically in the subsynaptic reticulum (SSR) of type I boutons at glutamatergic
  neuromuscular junctions (NMJs). Through homotypic L27-domain interactions Metro binds both the L27
  domain of DLin-7 and the N-terminal L27 domain of the Dlg isoform DlgS97, linking them into a tripartite
  perisynaptic scaffold complex; Metro and DLin-7 depend on each other for junctional localization, and
  Metro is essential for recruiting DLin-7 to NMJs. Loss of Metro reduces bouton number, enlarges boutons,
  produces poorly differentiated boutons and alters glutamate receptor field size, so the complex contributes
  to NMJ growth and synaptic organization. Its GUK domain lacks the residues required for guanylate kinase
  catalysis (including the P-loop lysine and the GMP-recognition serine), consistent with the non-catalytic
  protein-interaction role of MAGUK GUK domains.
existing_annotations:
- term:
