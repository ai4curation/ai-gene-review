- term:
    id: GO:0008582
    label: regulation of synaptic assembly at neuromuscular junction
  evidence_type: IMP
  original_reference_id: PMID:20427642
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: metro null mutants have fewer and enlarged type Ib boutons with impaired differentiation,
      rescued by Metro-B expression; Metro acts as part of the perisynaptic DlgS97-DLin-7 scaffold that
      shapes NMJ expansion and bouton formation.
    reason: The phenotype is at the NMJ itself (bouton number, size, differentiation) rather than a remote
      organismal outcome, and Metro physically builds the perisynaptic scaffold that controls these
      properties, so participation in regulating synaptic assembly at the NMJ is well supported by the
      FlyBase IMP curation and the full text.
    supported_by:
    - reference_id: PMID:20427642
      supporting_text: In a remarkably interdependent manner, Metro and DLin-7 act downstream of DlgS97
