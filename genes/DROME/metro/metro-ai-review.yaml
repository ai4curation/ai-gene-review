      supporting_text: The structures of the currently solved MAGUK GK domains have convincingly demonstrated
        that MAGUK GKs cannot catalyze the conversion of GMP to GDP due to the lack of critical catalytic
        residues and the loss or dramatically weakening of GMP binding
