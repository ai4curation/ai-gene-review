suggested_questions:
- question: Does the Metro GUK domain bind phosphorylated partner peptides, as other MAGUK GUK domains
    do, and if so which synaptic partners does it recognise?
suggested_experiments:
- description: Test purified Metro SH3-GUK tandem for GMP/ATP binding (ITC or fluorescent nucleotide
    analogues) alongside an active guanylate kinase control, and screen it against phospho-peptide libraries
    to identify GUK-domain partners.
