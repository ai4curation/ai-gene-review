    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000400325
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Electronic transfer from the guanylate-kinase fold. Metro's GUK-like domain has lost the
      Walker A lysine (Arg402 in GAPGVGRN) and the GMP-recognition serine (Pro422), and structurally characterised
      MAGUK GUK domains have lost or dramatically weakened nucleotide binding. No nucleotide-binding assay
      exists for Metro.
    reason: The UniRule-derived nucleotide-binding term reflects the ancestral guanylate kinase fold rather
      than a demonstrated or biologically meaningful activity of Metro. The target retains a remodelled
      P-loop with Arg in place of the Walker A lysine and the scaffold-type Ser-to-Pro change at the GMP
      site (local analysis), and structural and biochemical work on MAGUK GUK domains, including MPP-family
      members, shows that nucleotide binding has been lost or reduced to very low affinity as these domains
      became phospho-protein-binding modules. Residual weak binding cannot be excluded, so the term is
      not refuted outright, but it over-states the function of this scaffold.
    supported_by:
    - reference_id: file:DROME/metro/metro-bioinformatics/RESULTS.md
      supporting_text: 'The complete target segment corresponding to yeast residues 9–16 is

        **GAPGVGRN** (Metro396–403), compared with **GPSGTGKS** in yeast.'
