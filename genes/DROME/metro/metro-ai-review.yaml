  review:
    action: KEEP_AS_NON_CORE
    summary: The PAINT node places epithelial and synaptic cell-cell junction localization at the MPP/PALS
      ancestor, and Metro is inside that clade. Metro's documented junction is the synapse (NMJ SSR); it
      is virtually absent from epithelia, so the epithelial sense of the inherited term is not realised
      in Metro.
    reason: The IBA is a reasonable phylogenetic inference (Metro is a member of the PTN001137125 descendant
      clade, PANTHER SF42), and the neuromuscular junction is biologically a junction between two cells.
      However, the donor evidence is largely epithelial adherens/tight-junction localization of MPP and
      PALS proteins, and the Metro study found Metro virtually absent from epithelial tissues. The specific,
      experimentally supported location for Metro is the subsynaptic reticulum, which GO does not place
      under cell-cell junction. The term is retained as non-core rather than removed.
    supported_by:
