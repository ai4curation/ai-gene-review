  review:
    action: REMOVE
    summary: The exact Metro guanylate-kinase-like domain carries the scaffold-associated Ser-to-Pro change
      at the GMP-recognition site (Pro422), His488 at the position of catalytic-enzyme Asp101, and substantial
      ATP-loop remodeling. Independent alignments recover the known active-enzyme and MAGUK controls.
      Together with primary biochemical and structural evidence for repurposing of MPP/MAGUK GUK domains
      and the directly demonstrated Metro scaffold function, this refutes electronic transfer of conventional
      kinase/transferase activity. It does not imply complete loss of nucleotide binding.
