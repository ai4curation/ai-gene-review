  review:
    action: REMOVE
    summary: Metro's GUK-like domain lacks the catalytic and GMP-recognition residues of guanylate kinases
      (Arg402 at the P-loop lysine, Pro422 at the GMP serine, His488 at catalytic Asp101); MAGUK GUK domains
      are non-catalytic, and Metro's demonstrated activity is L27-mediated scaffolding.
