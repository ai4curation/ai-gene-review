suggested_questions:
- question: Does the full text of PMID:32540344 (or its bioRxiv preprint) contain a CG31099-specific statement
    that FlyBase used for the ecdysteroid 22-kinase TAS, or was the annotation made by analogy to BmEc22K
    for the whole EcKL family?
- question: Where does PANTHER subfamily PTHR11012:SF6 (CG31099, CG6830) fall among the 13 EcKL subfamilies
    of Scanlan and Robin (2024), and does any characterized EcKL lie in that subfamily?
suggested_experiments:
- description: Express recombinant CG31099 and screen ATP-dependent phosphorylation of ecdysone, 20-hydroxyecdysone
    and a panel of hydroxylated xenobiotics by LC-MS product identification, alongside a catalytic-loop
    (H248/D250/N255) mutant control.
  experiment_type: in vitro enzyme assay
- description: Generate a CRISPR null allele of CG31099, confirm the RNAi developmental phenotype with genomic
    rescue, and compare ecdysteroid-phosphate conjugate profiles between null and control animals.
  experiment_type: genetic loss of function with metabolomics
