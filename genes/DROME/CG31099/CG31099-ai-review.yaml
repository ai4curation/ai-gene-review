    summary: The cited study proposes family-wide detoxification-by-phosphorylation hypotheses from genomic
      and expression analyses. Its accessible abstract does not establish CG31099-catalyzed phosphorylation
      of an ecdysteroid specifically at position 22. The kinase-like family assignment supports a candidate
      catalytic role, but exact substrate and positional specificity require target-specific or well-resolved
      subfamily evidence.
