description: CG31099 encodes a 400-residue member of the insect ecdysteroid-kinase-like family containing
  a CHK-kinase-like domain. Such proteins are candidates for small-molecule phosphoconjugation, but the
  substrate and physiological role of CG31099 have not been established. A role in steroid metabolism
  or xenobiotic detoxification remains a family-informed hypothesis.
