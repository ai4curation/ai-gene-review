product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG31099 (also catalogued as Dro14-0 and, in some records, CG10551) encodes a 400-residue
  member of the insect ecdysteroid kinase-like (EcKL) family. The protein consists of a single CHK
  kinase-like (APH-type) domain that retains the HxDxxxxN catalytic-loop motif typical of small-molecule
  kinases of this fold, and it belongs to PANTHER subfamily PTHR11012:SF6 together with CG6830. EcKL
  proteins are proposed to transfer phosphate from ATP to hydroxyl groups on small molecules such as
  ecdysteroids or dietary and environmental toxins, but no substrate, enzymatic activity, subcellular
  location or pathway has been experimentally established for CG31099. The two biochemically characterized
  ecdysteroid 22-kinases of the family (silkworm BmEc22K and mosquito AgEcK2) lie in other subfamilies.
  Ubiquitous RNAi knockdown reduced adult offspring numbers in a family-wide screen, suggesting a developmental
  requirement whose molecular basis is unknown.
existing_annotations:
- term:
    id: GO:0106389
    label: ecdysteroid 22-kinase activity
  evidence_type: TAS
  original_reference_id: PMID:32540344
  qualifier: enables
  review:
    summary: FlyBase TAS for ecdysteroid 22-kinase activity, traced to the 2020 Drosophila EcKL family
      analysis. The accessible abstract frames the family as candidate detoxification kinases and does
      not report a CG31099 assay; the full text could not be read. Phylogenetically, CG31099 is not in
      the subfamily of either characterized ecdysteroid 22-kinase.
    action: UNDECIDED
    reason: The supporting publication is abstract-only in our cache and the bioRxiv/journal full text
      was not retrievable, so the specific author statement the FlyBase curator relied on cannot be read;
      per the curation rules this TAS is left UNDECIDED rather than removed. The available evidence leans
      against a confident transfer of this precise activity. (1) The cited abstract proposes a family-wide
      detoxification-kinase hypothesis, not a demonstrated ecdysteroid C-22 phosphorylation by CG31099.
      (2) The 2024 phylogenomic study places the only two genes known to encode ecdysteroid 22-kinases
      (BmEc22K, subfamily A; AgEcK2, subfamily D) in different EcKL subfamilies and names its Drosophila
      ecdysteroid-kinase candidates as CG5644, CG13813 and Pinkman, not CG31099. (3) In PANTHER,
      CG31099 is in PTHR11012:SF6, whereas BmEc22K (Q0PCR8) is in SF54 and CG5644, the direct ortholog
      of AgEcK2, is in SF47 (file:DROME/CG31099/CG31099-bioinformatics/RESULTS-rereview.md); the only
      other fly SF6 member, CG6830, is uncharacterized. There are no IBA annotations from PAINT for this
      subfamily. The CHK domain retains its HxDxxxxN catalytic-loop motif, so a small-molecule kinase
      activity is plausible, but neither the substrate class nor the C-22 regiospecificity is supported
      by evolutionary placement or by any target-specific experiment.
    supported_by:
    - reference_id: PMID:32540344
      supporting_text: We propose the hypothesis that members of the arthropod-specific ecdysteroid kinase-like
        (EcKL) gene family encode detoxicative kinases.
    - reference_id: file:DROME/CG31099/CG31099-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: /note="CHK kinase-like"
    - reference_id: PMID:38291829
      supporting_text: Our results show the only two genes known to encode ecdysteroid kinases belong
        to different subfamilies and therefore ecdysteroid metabolism functions must be spread throughout
        the EcKL family.
    - reference_id: PMID:38291829
      supporting_text: CG13813 and Pinkman are D. melanogaster subfamily A genes that could also encode
        ecdysteroid kinases
    - reference_id: file:DROME/CG31099/CG31099-bioinformatics/RESULTS-rereview.md
      supporting_text: neither biochemically characterised ecdysteroid 22-kinase
