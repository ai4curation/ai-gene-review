descriptions:
- source: Alliance_Imported
  text: SKP1-related A (SkpA) encodes a subunit of Skp, Cullin, F-box (SCF)-containing
    ubiquitin ligase complexes. It regulates centrosome duplication, chromatin condensation,
    cell cycle progression, cell polarity, dendrite pruning and endoreduplication.
  source_type: curated
