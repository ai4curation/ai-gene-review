- source: Alliance_Automated
  text: Enables ubiquitin ligase complex scaffold activity. Involved in several processes,
    including DNA endoreduplication; negative regulation of signal transduction; and
    positive regulation of cell cycle. Part of SCF ubiquitin ligase complex. Is expressed
    in adult head and adult heart. Used to study neurodegenerative disease. Orthologous
    to human SKP1 (S-phase kinase associated protein 1).
