core_functions:
- description: 'SkpA is the Skp1 adaptor of SCF ligases: it binds the Cullin-1 N-terminus and the F-box
    of substrate receptors (Slimb, Ago, Fsn, Fsd, Ntc, Rca1, Fbxo42, Skp2), bridging them to the Cul1-Roc1a
    catalytic core.'
  molecular_function:
    id: GO:0160072
    label: ubiquitin ligase complex scaffold activity
  contributes_to_molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0031146
    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0019005
    label: SCF ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:11500045
    supporting_text: We show that putative Drosophila SCF core subunits dSkpA and dRbx1 both interact
      directly with dCu11 and the F-box protein Slmb.
  - reference_id: PMID:21170036
    supporting_text: Fsd is an F-box protein that directly interacts with both Skp1 and Bcd
suggested_questions:
- question: Which of the eight fly Skp1 paralogs substitute for SkpA in specific tissues (e.g. testis-enriched
    SkpB/C/D), and do they share F-box partners?
- question: Which SCF substrate(s) explain centrosome overduplication in skpA mutants independently of
    Cyclin E?
suggested_experiments:
- hypothesis: A non-Cyclin-E SCF-SkpA substrate (for example Plk4 via Slimb) drives centrosome overduplication
    in skpA mutants.
  description: Combine skpA null with Plk4 heterozygosity or a Slimb-binding-site Plk4 allele and quantify
    centrosome number in larval neuroblasts.
