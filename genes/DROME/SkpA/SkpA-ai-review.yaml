id: O77430
gene_symbol: SkpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SkpA is the principal Drosophila Skp1 ortholog, one of several Skp1-related genes, and the
  adaptor subunit of SCF (Skp1-Cullin1-F-box) cullin-RING ubiquitin ligases. Its BTB/POZ-like N-terminal
  region binds the N-terminus of Cullin-1 and its C-terminal helices bind the F-box of substrate receptors
  such as Slimb, Archipelago, Fates-shifted, Nutcracker, Rca1, Fbxo42 and Skp2, linking each receptor
  to the Cul1-Roc1a catalytic core. Through these SCF complexes SkpA supports ubiquitin-dependent proteasomal
  degradation of many regulators, and loss of SkpA causes centrosome overduplication, chromatin condensation
  and endoreduplication defects, derepression of the IMD immune pathway, synaptic overgrowth through elevated
  Wnd/JNK signaling, increased apoptosis, and defects in neuronal pruning and synaptonemal complex maintenance.
  SkpA is present in the cytoplasm and nucleus.
