    action: MARK_AS_OVER_ANNOTATED
    summary: This is a very broad ARBA-derived process term. For the gene it reflects heparan sulfate
      synthesis by full-length Ttv, and that role is unlikely to transfer to the 299-residue ttv-PC product.
    reason: The same reasoning applies as for glycoprotein biosynthetic process. ttv-PC lacks the GT47
      GlcA-transferase domain and the luminal targeting signal, and keeps only the weakly active EXT1-type
      GT-A domain. No experiment links this product to carbohydrate-derivative metabolism. The ARBA rule
      is a family-level association and is not evidence about this isoform.
    supported_by:
