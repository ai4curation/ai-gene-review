id: D5SHU8
gene_symbol: ttv
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  D5SHU8 is the 299-residue ttv-PC product of the Drosophila tout-velu (ttv) gene, encoded by the
  alternative transcript ttv-RC. Its sequence is identical to residues 462-760 of full-length
  Tout-velu (Ttv, EXT1 ortholog, Q9V730, 760 aa), so it consists only of the C-terminal GT64 (GT-A
  fold) glycosyltransferase domain. It lacks the N-terminal signal-anchor helix and the GT47 (GT-B)
  domain. Full-length Ttv is a type II ER/Golgi membrane protein. With Sotv (EXT2) it forms the
  heparan sulfate co-polymerase, which adds alternating GlcA and GlcNAc residues to proteoglycan chains
  and is needed for Hedgehog, Wingless and Dpp morphogen distribution. ttv-PC keeps the GT-A DxD motif
  and several donor-binding arginines. At the uridine and phosphate contact positions it carries the
  substitutions that mark the weakly active human EXT1 GT-A domain. It has no signal or transmembrane
  segment that would deliver it to the secretory pathway, where heparan sulfate is polymerised. The
  protein is supported only at the transcript level. Whether it is made in vivo, which compartment it
  occupies, and whether it has any catalytic or regulatory activity have not been studied.
existing_annotations:
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
  review:
    action: REMOVE
    summary: ER membrane localization for D5SHU8 comes from an ARBA rule that assigns family-level
      "single-pass type II membrane protein" topology. That topology cannot apply to ttv-PC, which lacks
      the signal-anchor helix.
    reason: In full-length Ttv, ER/Golgi membrane residence depends on the N-terminal signal-anchor
      helix (Q9V730 TRANSMEM 7-25, type II). D5SHU8 begins at Ttv residue 462. It contains no
      hydrophobic segment comparable to that helix, and UniProt's sequence-analysis features predict
      no transmembrane or signal region for this entry. A protein without a signal sequence or signal
      anchor is not inserted into the ER membrane. The annotation is a family-level electronic
      projection whose stated topology is contradicted by this product's own sequence. Removing it here
      does not affect the gene's experimentally supported ER and Golgi localization, which belongs to
      the full-length PA/PB products (Q9V730).
    supported_by:
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: D5SHU8 residue 1 aligns to Ttv residue 462, and identity over the whole of D5SHU8 is 100.0%. D5SHU8 is an N-terminally truncated product of the same gene. It has no residues from Ttv 1-461, which include the signal-anchor helix (7-25) and the N-terminal GT47 (GT-B) domain.
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: D5SHU8 has no segment comparable to the control helix. Its most hydrophobic window falls inside the GT-A fold, and UniProt's own sequence-analysis tools annotate no transmembrane or signal feature on D5SHU8.
    - reference_id: file:DROME/ttv/ttv-reference-Q9V730-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: Helical; Signal-anchor for type II membrane protein
- term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004263
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The gene takes part in heparan sulfate proteoglycan biosynthesis through the full-length
      Ttv-Sotv co-polymerase. That role is unlikely to transfer to the 299-residue ttv-PC product.
    reason: Heparan sulfate chain elongation happens in the lumen of the ER and Golgi. In the human
      EXT1-EXT2 complex, the GlcA-transferase step is carried out by the N-terminal EXT1 GT47 domain,
      which ttv-PC lacks, and the GlcNAc-transferase step mainly by the EXT2 GT-A domain. The EXT1 GT-A
      domain, the only domain present in ttv-PC, is described as weakly active. When it was expressed on
      its own, as ttv-PC would be, no protein was produced. ttv-PC also has no signal sequence and so
      would not reach the lumen where its acceptor chains are. The InterPro exostosin match correctly
      classifies the sequence, but participation in glycoprotein biosynthesis by this product has never
      been shown and is biologically implausible. The process is supported for the gene through
      full-length Ttv (Q9V730), not through this isoform.
    supported_by:
    - reference_id: PMID:36593275
      supporting_text: The N-terminal EXT1 GT47 GT-B domain catalyzes β1,4GlcA transfer, whereas the C-terminal EXT2 GT64 GT-A domain catalyzes α1,4GlcNAc transfer.
    - reference_id: PMID:36593275
      supporting_text: Expression of EXT2 alone, single GT-A or GT-B domains from EXT1 or co-expression of GT-A or GT-B domains from EXT1 and EXT2 led to no protein secretion
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: D5SHU8 residue 1 aligns to Ttv residue 462, and identity over the whole of D5SHU8 is 100.0%. D5SHU8 is an N-terminally truncated product of the same gene. It has no residues from Ttv 1-461, which include the signal-anchor helix (7-25) and the N-terminal GT47 (GT-B) domain.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR015338
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The InterPro GT64-domain mapping to membrane reflects the type II membrane topology of
      full-length exostosins. ttv-PC has no membrane anchor.
    reason: The GT64 domain is luminal and soluble. Exostosins are held in membranes by their N-terminal
      signal-anchor helix, which ttv-PC lacks. The general membrane term is less tightly bound to a
      specific topology than the ER-membrane row. Membrane association through partners such as Sotv
      can be imagined, but for a protein without a signal sequence it would require a pathway that has
      not been demonstrated. This is therefore marked as an over-annotation for this isoform rather than
      accepted. Full-length Ttv (Q9V730) is a membrane protein.
    supported_by:
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: D5SHU8 has no segment comparable to the control helix. Its most hydrophobic window falls inside the GT-A fold, and UniProt's own sequence-analysis tools annotate no transmembrane or signal feature on D5SHU8.
    - reference_id: PMID:36402845
      supporting_text: Expression of EXT1 or EXT2 alone resulted in almost undetectable amounts of secreted protein
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004263
  - InterPro:IPR015338
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: ttv-PC keeps a GT-A (GT64) fold with its DxD motif. It corresponds, however, to the EXT1
      GT-A domain, which is weakly active in the human co-polymerase, could not be expressed on its own,
      and in ttv-PC is not linked to a secretory-pathway signal.
    reason: Human EXT1 is placed in the same PANTHER subfamily as Ttv (PTHR48261:SF3), which justifies
      using the human EXT1-EXT2 structures to interpret ttv-PC. Li et al. found that only two of the four
      potential active sites in EXT1-EXT2 bind donor and acceptor (EXT1 GT-B and EXT2 GT-A). The EXT1 GT-A
      domain is "weakly active", and mutating it produced only minor changes in activity. Leisico et al.
      instead observed reduced GlcNAc-T activity when the EXT1 GT-A DxD was mutated, so this domain may
      contribute some activity within the intact heterodimer. In ttv-PC the DxD and R595/R701 equivalents
      are conserved. The uridine-stacking aromatic and phosphate-binding basic residues of the active
      EXT2 GT-A site are not; as in human EXT1, the aligned positions carry other residues. Any activity
      reported for EXT1 GT-A was measured inside the full-length heterodimer. A free GT-A domain
      translated without a signal sequence would not encounter Sotv or the luminal acceptors.
      Glycosyltransferase capability is therefore an over-reach for this product. It is a reasonable
      family-level statement but not an activity this isoform is expected to perform. PAINT gives the
      full-length Ttv entry IBA terms for acetylglucosaminyltransferase and glucuronosyltransferase
      activity but no IBA rows to D5SHU8. This most likely reflects isoform coverage rather than a
      curator's decision, and is not used as evidence either way.
    supported_by:
    - reference_id: PMID:36593275
      supporting_text: For example, Lys651 in the active EXT2 GT-A domain is replaced by Gln677 in the weakly active EXT1 GT-A domain
    - reference_id: PMID:36593275
      supporting_text: In contrast, mutations in the EXT1 GT-A or EXT2 GT-B domains resulted in wild-type activity levels (R325A), minor reductions (D565A, D567A, R595A, W612A, W612A and Y308A) or slightly enhanced (Q328A) activities
    - reference_id: PMID:36402845
      supporting_text: A decrease in GlcNAc glycosyl transferase activity in the EXT1 D565N/D567N and EXT2 D538N/D540N mutants confirms that the C-terminal GT-A domains of EXT1 and EXT2 harbor GlcNAc-T activity
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: 'Interpretation: ttv-PC keeps the conserved metal- and donor-binding core of the GT-A fold (DxD, R595, R701). At the uridine/phosphate positions, however, it has the same substitutions that distinguish the "weakly active" human EXT1 GT-A domain from the active EXT2 GT-A domain.'
