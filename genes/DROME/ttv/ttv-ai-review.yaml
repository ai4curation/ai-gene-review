core_functions: []
suggested_questions:
- question: Is the ttv-RC transcript translated into a stable ttv-PC protein in vivo, and if so, in
    which tissues and subcellular compartment does it accumulate?
- question: If ttv-PC is made, does it act as a dominant-negative or regulatory partner of Ttv or Sotv
    (for example through GT-A domain dimerization), or is it a non-functional product of alternative
    transcript processing?
suggested_experiments:
- description: Detect endogenous ttv-PC with an antibody against the C-terminal domain, or with a
    C-terminal epitope knock-in, comparing ttv-RC-specific RNAi or isoform-specific deletion to
    distinguish the 34 kDa product from full-length Ttv. Determine its localization relative to ER and
    Golgi markers.
  experiment_type: protein expression and localization
- description: Express ttv-PC in ttv mutant or Sotv-overexpressing backgrounds and measure heparan
    sulfate chain length and morphogen (Hh, Wg, Dpp) distribution in wing imaginal discs. This tests
    whether the isoform has rescuing, inert or dominant-negative activity.
  experiment_type: genetic rescue and dominant-negative test
