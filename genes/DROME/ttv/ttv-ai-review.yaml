taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tout-velu is an exostosin-family glycosyltransferase associated with heparan-sulfate synthesis.
  The native 299-residue PC isoform retains the C-terminal glycosyltransferase region but lacks the N-terminal
  membrane anchor and the other glycosyltransferase domain found in full-length Ttv. Its catalytic competence,
  intracellular targeting and contribution to glycan synthesis remain unresolved.
