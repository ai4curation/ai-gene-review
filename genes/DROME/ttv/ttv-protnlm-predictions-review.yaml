    label: glycosyltransferase activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: Focused sequence and homology review supports GO:0016757 as a correct broad prediction
      for D5SHU8. This 299-residue ttv-PC product is a colinear, 100%-identical copy of the canonical
      Ttv C-terminal GT64 domain, aligns strongly to the human EXT1 GT64 catalytic region, and retains
      the active-site Asp, DED binding motif and most catalytic or substrate-binding residues. The call
      should remain generic and isoform-caveated because no isolated-domain assay proves autonomous activity,
      and the short product lacks the GT47 domain and membrane anchor required for full-length Ttv
      heparan-sulfate biosynthesis.
