  review:
    assessment: UNC
    confidence_score: 1
    summary: D5SHU8 is the 299-residue ttv-PC product, identical to Ttv residues 462-760, so it contains
      only the C-terminal GT64 (GT-A) domain. It keeps the DxD motif and the active-site Asp equivalent.
      The same term is already carried by D5SHU8 as an InterPro2GO electronic annotation, so the prediction
      is not novel; the gene review marks that row over-annotated for this product. Family transfer is
      justified at the domain level, because Ttv and human EXT1 share a PANTHER subfamily. However, the
      human EXT1 GT-A domain is described as weakly active in the EXT1-EXT2 co-polymerase, and mutating
      it gave only minor activity changes in one study. A second study found reduced GlcNAc-T activity
      after EXT1 GT-A DxD mutation, so the domain may contribute activity inside the intact heterodimer.
      All of these measurements were made on full-length protein. ttv-PC lacks the signal-anchor helix
      and the GT47 domain and has no predicted signal or transmembrane segment, so it is not expected
      to reach the secretory-pathway acceptors or partner Sotv. Neither activity of the isolated domain
      nor its absence has been tested, and a PubMed search found no study of this isoform; UNC is retained.
    supported_by:
    - reference_id: file:DROME/ttv/ttv-bioinformatics/RESULTS.md
      supporting_text: The C-terminal glycosyltransferase-region active-site Asp670 maps to target Asp209,
        and the source-record nucleotide-sugar/metal-binding residues in this region are retained.
    - reference_id: file:DROME/ttv/ttv-flybase.txt
      supporting_text: ttv-PC FBpp0305368 34.4 299 9.71 D5SHU8 NP_001260972 AGB93504
    - reference_id: file:DROME/ttv/ttv-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: It has no residues from Ttv 1-461, which include the signal-anchor helix (7-25)
        and the N-terminal GT47 (GT-B) domain.
    - reference_id: PMID:36593275
      supporting_text: For example, Lys651 in the active EXT2 GT-A domain is replaced by Gln677 in the
        weakly active EXT1 GT-A domain
    - reference_id: PMID:36402845
      supporting_text: A decrease in GlcNAc glycosyl transferase activity in the EXT1 D565N/D567N and
        EXT2 D538N/D540N mutants confirms that the C-terminal GT-A domains of EXT1 and EXT2 harbor GlcNAc-T
        activity
    - reference_id: file:DROME/ttv/ttv-hypotheses/fly41-short-isoform-glycosyltransferase/openscientist.md
      supporting_text: Of the nine canonical catalytic/substrate-binding residues, **8 are retained**
        in D5SHU8, including the active-site **Asp670 → Asp209** and the **DED binding motif (canonical
        581–583 → D5SHU8 120–122)**
