    summary: D5SHU8 is the 299-residue ttv-PC isoform, not the full-length760-residue protein. The retained
      C-terminal region contains the annotated catalytic Asp and multiple ligand-binding residues, so
      short length does not justify categorical refutation of glycosyltransferase activity. However, the
      other domain and N-terminal targeting/anchor region are absent, and the current data do not establish
      folding, complex support or substrate access in PC. An equivalent electronic annotation exists but
      adds no independent validation. Target-specific activity or a convincing domain-level functional
      analysis is missing; UNC preserves this distinction.
