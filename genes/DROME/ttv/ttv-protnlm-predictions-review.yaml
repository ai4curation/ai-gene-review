  source_version: UniProt API snapshot 2026-09-08
  source_reference_id: file:DROME/ttv/ttv-protnlm-source.json
  predicted_term:
    id: GO:0016757
    label: glycosyltransferase activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: D5SHU8 is the 299-residue ttv-PC isoform, not the full-length 760-residue protein. The
      retained C-terminal region contains the annotated catalytic Asp and multiple ligand-binding residues, so
      short length does not justify categorical refutation of glycosyltransferase activity. However, the
      other domain and N-terminal targeting/anchor region are absent, and the current data do not establish
      folding, complex support or substrate access in PC. An equivalent electronic annotation exists but
      adds no independent validation. OpenScientist found the broad parent term defensible by homology
      but still cautioned that catalytic evidence is from full-length Ttv, not isolated D5SHU8. Target-specific
      activity or a convincing domain-level functional analysis is missing; UNC preserves this distinction.
    supported_by:
    - reference_id: file:DROME/ttv/ttv-bioinformatics/RESULTS.md
      supporting_text: The C-terminal glycosyltransferase-region active-site Asp670 maps to target Asp209,
        and the source-record nucleotide-sugar/metal-binding residues in this region are retained.
    - reference_id: file:DROME/ttv/ttv-flybase.txt
      supporting_text: ttv-PC FBpp0305368 34.4 299 9.71 D5SHU8 NP_001260972 AGB93504
    - reference_id: PMID:36593275
      supporting_text: 'EXT1 and EXT2, where each protein monomer contains distinct GT47 (GT-B fold) and

        GT64 (GT-A fold) glycosyltransferase domains.'
    - reference_id: file:DROME/ttv/ttv-hypotheses/fly41-short-isoform-glycosyltransferase/openscientist.md
      supporting_text: Of the nine canonical catalytic/substrate-binding residues, **8 are retained**
        in D5SHU8, including the active-site **Asp670 → Asp209** and the **DED binding motif (canonical
        581–583 → D5SHU8 120–122)**
