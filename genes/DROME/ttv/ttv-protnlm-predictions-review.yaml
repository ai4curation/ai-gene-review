- id: file:DROME/ttv/ttv-hypotheses/fly41-short-isoform-glycosyltransferase/openscientist.md
  title: OpenScientist audit of the Ttv short-isoform glycosyltransferase prediction
  findings:
  - statement: OpenScientist confirmed that D5SHU8 is the isolated C-terminal GT64 domain of Ttv and
      preserves most catalytic machinery.
    supporting_text: The 299-residue D5SHU8 sequence aligns **co-linearly and with 100% identity (299/299)
      to residues 462–760 of the canonical reviewed ttv protein Q9V730 (760 aa)**, beginning at canonical
      offset 461.
  - statement: OpenScientist found direct catalytic evidence for full-length Ttv/EXT1 rather than for
      the isolated D5SHU8 isoform.
    supporting_text: No published study reports catalytic activity for an isolated EXT1/ttv GT64 domain,
      nor for this specific 299-aa isoform.
