description: 'ProtNLM2 (UniProt API snapshot 2026-09-08) emitted one GO prediction for D5SHU8, the 299-residue
  ttv-PC product that corresponds to the C-terminal GT64 (GT-A) domain of Tout-velu (residues 462-760
  of Q9V730). Broad glycosyltransferase activity is already present as an InterPro2GO electronic annotation,
  so it is not novel. Its correctness for this product is unresolved: the DxD motif is retained, but the
  equivalent human EXT1 GT-A domain is weakly active within the EXT1-EXT2 heterodimer, and ttv-PC lacks
  the signal anchor and partner domain needed to reach luminal acceptors. The prediction is scored UNC.'
