descriptions:
- source: Alliance_Imported
  text: tout-velu (ttv) encodes a glycosyltransferase that forms a complex with sotv
    to catalyze the alternating transfer of glucuronic acid (GlcA) and N-acetylglucosamine
    (GlcNAc) to their respective acceptors, GlcNAc and GlcA, during the elongation
    of the heparan sulfate glycosaminoglycan chain.
  source_type: curated
  url: https://flybase.org/reports/ttv.html
  source_id: FB:FBgn0265974
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Accurate for full-length Ttv (EXT1) in heparan sulfate elongation
      with Sotv, but this entry is the 299-residue ttv-PC fragment, which the review
      says lacks the GT47 domain and membrane anchor and has no studied activity.
- source: Alliance_Automated
  text: Enables N-acetylglucosaminyl-proteoglycan 4-beta-glucuronosyltransferase activity
    and glucuronosyl-N-acetylglucosaminyl-proteoglycan 4-alpha-N-acetylglucosaminyltransferase
    activity. Involved in glycosaminoglycan biosynthetic process; heparan sulfate
    proteoglycan biosynthetic process; and primordial germ cell migration. Located
    in Golgi apparatus and endoplasmic reticulum. Part of EXT1-EXT2 complex. Used
    to study germ cell cancer. Human ortholog(s) of this gene implicated in chondrosarcoma
    and hereditary multiple exostoses. Orthologous to several human genes including
    EXT1 (exostosin glycosyltransferase 1).
  source_type: automated
