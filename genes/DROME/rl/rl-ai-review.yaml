id: P40417
gene_symbol: rl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  rl encodes Rolled, the Drosophila ERK-family MAP kinase activated by Dsor1/MEK
  in receptor-driven Ras/MAPK pathways. Activated Rolled phosphorylates
  cytoplasmic and nuclear substrates, including transcriptional regulators, to
  execute EGFR, Sevenless, Torso, FGF, Pvr, insulin, and stress-associated
  signaling outputs.
