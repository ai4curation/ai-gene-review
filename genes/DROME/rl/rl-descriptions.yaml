    overall_notes: 'Correct and compact: core MAP kinase of RAS/MAPK, inactivated
      by PTP-ER and Mkp3, phosphorylating cytoplasmic and nuclear effectors.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity; MAP kinase activity;
    and protein kinase binding activity. Involved in several processes, including
    cell surface receptor protein tyrosine kinase signaling pathway; larval lymph
    gland hemocyte differentiation; and regionalization. Located in cytosol; neuromuscular
    junction; and nucleus. Is expressed in several structures, including imaginal
    disc; somatic precursor cell; tracheal primordium; trunk visceral muscle primordium;
    and wing vein. Used to study cancer and chromosome 16p11.2 deletion syndrome,
    593-kb. Human ortholog(s) of this gene implicated in several diseases, including
    Noonan syndrome 13; Parkinson's disease; carcinoma (multiple); endometrial disease;
    and pulmonary hypertension. Orthologous to several human genes including MAPK1
    (mitogen-activated protein kinase 1).
