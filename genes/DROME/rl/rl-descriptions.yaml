descriptions:
- source: UniProt
  text: Serine/threonine kinase which acts as an essential component of the MAP kinase
    signal transduction pathway to regulate proliferation, differentiation and effect
    cell fate decisions in various tissues (PubMed:19965758, PubMed:22140578, PubMed:27552662,
    PubMed:8157002). Required downstream of phl/Raf in the sev/sevenless, tor/torso,
    and EGF receptor homolog Egfr signal transduction pathways (PubMed:8157002). Required
    for embryonic epithelial tissue repair (PubMed:22140578). During larval development,
    mediates Ptth/tor signaling leading to the production of ecdysone, a hormone required
    for the initiation of metamorphosis (PubMed:19965758).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40417
  source_id: P40417
