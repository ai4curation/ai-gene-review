id: P48592
gene_symbol: RnrS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: RnrS encodes the small (R2, beta, M2) subunit of Drosophila class Ia ribonucleotide reductase,
  a ferritin-like diiron protein that generates the tyrosyl radical needed for catalysis. RnrS transfers
  radical character to the large subunit RnrL, where ribonucleoside diphosphates are reduced to deoxyribonucleoside
  diphosphates. The cytosolic R1-R2 complex supplies dNTPs for nuclear and mitochondrial DNA synthesis.
  RnrS mRNA is maternally deposited and later expressed in proliferating tissues, and maternal RNR
  supply is thought to be important for the rapid early embryonic nuclear divisions.
