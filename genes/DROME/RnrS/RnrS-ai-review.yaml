suggested_questions:
- question: Is Drosophila RnrS regulated by cell-cycle-dependent degradation or nuclear export like mammalian
    RRM2 and yeast R2, and does a p53R2-like damage-inducible R2 exist in flies?
suggested_experiments:
- hypothesis: RnrS protein levels are the rate-limiting determinant of embryonic dNTP pools.
  description: Combine maternal RnrS knockdown titration with single-embryo dNTP measurements and tagged
    endogenous RnrS imaging through the syncytial cycles.
