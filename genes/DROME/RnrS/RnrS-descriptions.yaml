    overall_notes: Same generic text as RnrL. It does not say this is the radical-generating
      small subunit.
- source: Alliance_Automated
  text: Predicted to enable ribonucleoside-diphosphate reductase activity, thioredoxin
    disulfide as acceptor. Predicted to be involved in deoxyribonucleotide biosynthetic
    process. Predicted to be located in cytoplasm. Predicted to be part of ribonucleoside-diphosphate
    reductase complex. Predicted to be active in cytosol. Is expressed in several
    structures, including embryonic/larval midgut primordium; ganglia; gut section;
    head epidermis primordium; and surface glial cell. Human ortholog(s) of this gene
    implicated in autosomal dominant progressive external ophthalmoplegia with mitochondrial
    DNA deletions 5; mitochondrial DNA depletion syndrome 8a; pancreatic cancer; and
    sensorineural hearing loss. Orthologous to several human genes including RRM2
    (ribonucleotide reductase regulatory subunit M2).
  source_type: automated
