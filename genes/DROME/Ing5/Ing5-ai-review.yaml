  review:
    summary: IBA for H3K4me3 reader activity (PTN008942935; donors include human ING proteins Q8WYH8,
      Q9H160, Q9NXR8, Q9UK53, yeast and Arabidopsis ING proteins).
    action: ACCEPT
    reason: The ING PHD finger that reads H3K4me3 is conserved across the family, and Ing5 is inside the
      clade; consistent with ING5 function in the human MOZ/MORF and HBO1 complexes. Accepted as a phylogenetic
      inference; H3K4me3 binding has not been measured for fly Ing5, so it is not used as the core molecular
      function.
