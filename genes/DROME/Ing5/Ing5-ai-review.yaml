taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ing5 is a Drosophila member of the inhibitor of growth (ING) family, with a C-terminal PHD
  finger of the type that recognizes histone H3 trimethylated at lysine 4. It is a subunit of the Enok
  (MOZ/MORF-type) histone acetyltransferase complex with the catalytic subunit Enok, the scaffold Br140
  and Eaf6, and is required for the complex's acetylation of histone H3 lysine 23 in vivo. Through the
  complex it contributes to promoting the G1/S transition by restraining PCNA unloading.
