    overall_notes: Names the Enok complex, elg1 interaction and G1/S transition via
      PCNA unloading. Calls Ing5 itself a histone acetyltransferase, whereas the review
      treats it as a non-catalytic activator subunit.
- source: Alliance_Automated
  text: Enables acetyltransferase activator activity. Involved in DNA strand elongation
    involved in DNA replication. Located in nucleus. Part of MOZ/MORF histone acetyltransferase
    complex. Is expressed in central brain primordium; embryonic brain; larval ventral
    nerve cord; and ventral nerve cord primordium. Orthologous to human ING4 (inhibitor
    of growth family member 4) and ING5 (inhibitor of growth family member 5).
