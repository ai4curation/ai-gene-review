- source: Alliance_Automated
  text: Enables GTP binding activity. Involved in several processes, including microtubule
    cytoskeleton organization; nuclear pore complex assembly; and regulation of mitotic
    cell cycle. Located in cell cortex; mitotic spindle microtubule; and nuclear envelope.
    Colocalizes with mitotic spindle. Is expressed in several structures, including
    embryonic/larval midgut primordium; ganglia; glial cell; gut section; and head
    epidermis primordium. Human ortholog(s) of this gene implicated in type 1 diabetes
    mellitus. Orthologous to human RAN (RAN, member RAS oncogene family).
