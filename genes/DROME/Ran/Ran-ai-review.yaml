id: Q9VZ23
gene_symbol: Ran
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Ran (Ran10A, CG1404) is the single Ran-family small GTPase of Drosophila melanogaster. It
  cycles between a GTP-bound form, generated in the nucleus by the chromatin-bound exchange factor RCC1,
  and a GDP-bound form produced in the cytoplasm by RanGAP-stimulated hydrolysis. The resulting RanGTP
  gradient across the nuclear envelope sets the direction of nucleocytoplasmic transport: RanGTP releases
  NLS cargo from importins in the nucleus and loads cargo onto exportins such as CRM1/Embargoed for export
  of proteins and RNPs. After nuclear envelope breakdown, chromatin-proximal RanGTP promotes spindle assembly
  by freeing spindle factors from importins; fly Ran localizes around mitotic and meiotic spindles, is
  required for spindle assembly, chromosome alignment and segregation in syncytial embryos, and contributes
  to pole organisation of the acentrosomal oocyte spindle and to sperm-aster microtubules needed for pronuclear
  fusion. RanGTP binds the RA domains of Canoe and is needed for Mud recruitment to cortical Pins in the
  Pins(TPR)/Mud/dynein spindle orientation pathway. In oogenesis Ran regulates condensation of Nup358-containing
  nucleoporin granules and biogenesis of annulate lamellae and nuclear pores. Ran is essential for viability.'
