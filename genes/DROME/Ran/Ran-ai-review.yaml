suggested_questions:
- question: Should fly Ran carry a mitotic spindle assembly annotation (Silverman-Gavrila and Wilde 2006,
    PMID:16481399), given that RanGTP acts by releasing spindle assembly factors from importins rather
    than by building the spindle itself?
- question: Is the Canoe RA domain-RanGTP interaction required in neuroblasts in vivo, and does RanGTP
    at the neuroblast cortex arise from a chromatin-derived gradient or a local pool?
- question: Does fly Ran contribute directly to bulk poly(A)+ mRNA export, or only to export of specific
    exportin-dependent RNAs?
suggested_experiments:
- description: Express a Canoe RA-domain mutant that cannot bind RanGTP in canoe mutant larval neuroblasts
    and score Mud cortical recruitment and spindle orientation, to test the S2-cell model in vivo.
- description: Image a RanGTP FRET sensor in syncytial embryos and oocytes to map RanGTP around mitotic
    and acentrosomal meiotic spindles.
