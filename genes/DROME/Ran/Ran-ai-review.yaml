  review:
    summary: Nuclear pore (part_of).
    action: MARK_AS_OVER_ANNOTATED
    reason: Ran is a soluble shuttling GTPase that passes through nuclear pores with transport receptors
      (and is imported by NTF2); it is not a structural subunit of the nuclear pore complex. part_of nuclear
