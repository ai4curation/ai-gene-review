- term:
    id: GO:0002949
    label: tRNA threonylcarbamoyladenosine modification
  evidence_type: IGI
  original_reference_id: PMID:26516084
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9VV41
  review:
    summary: Involvement in tRNA t6A modification as an auxiliary KEOPS subunit.
    action: NEW
    reason: 'The UniProt entry lists GO:0070525 (tRNA threonylcarbamoyladenosine metabolic process, IBA:GO_Central)
      for this gene. That term is now obsolete ("an unnecessary grouping class") and replaced_by GO:0002949,
      and current GOA carries neither term for this gene, so the PAINT process assertion was lost in the
      obsoletion rather than rejected. Comparator check: yeast PCC1 (UniProtKB:Q3E833) carries GO:0002949
      (ComplexPortal), whereas human TP53RK and LAGE3 carry neither GO:0002949 nor GO:0070525 in QuickGO.
      The auxiliary KEOPS subunits do part of the work of the t6A step (Bud32 provides the tRNA-stimulated
      ATPase; Pcc1 dimerizes the complex and lines the tRNA-binding surface), and fly Bud32/Pcc1 support
      t6A synthesis in yeast complementation. We therefore restore the PAINT intent with the current term.
      Evidence code IGI with fly Kae1/Tcs3 (UniProtKB:Q9VV41): in PMID:26516084 fly Pcc1 co-expressed with
      fly Kae1 improved rescue of a yeast kae1 null relative to fly Kae1 alone. A yeast pcc1 null was not
      complemented, so the evidence is the co-expression result, as flagged in suggested_questions.'
    supported_by:
    - reference_id: PMID:26516084
      supporting_text: complementation of Drosophila Kae1 and other t6A factors in corresponding yeast
        null mutants demonstrates that these metazoan genes execute t6A synthesis
      reference_section_type: ABSTRACT
    - reference_id: PMID:26516084
      supporting_text: Figure 4D shows a kae1 mutant expressing Drosophila Kae1 + Pcc1 (sector 1), Drosophila
