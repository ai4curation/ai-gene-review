taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tcs6 encodes the Drosophila melanogaster ortholog of yeast Pcc1 and human LAGE3, a small
  (111 amino acid) CTAG/Pcc1-family subunit of the EKC/KEOPS complex. In KEOPS, Pcc1 binds the catalytic
  subunit Kae1 (Tcs3 in flies) and acts as the dimerization module of the complex, homodimerizing or heterodimerizing
  with Gon7. The complex transfers the threonylcarbamoyl moiety of threonylcarbamoyl-AMP to adenosine
  37 of ANN-decoding tRNAs, forming the universal t6A modification that supports accurate decoding. Tcs6
  itself has not been studied experimentally in flies; its role is inferred from the conserved KEOPS architecture.
