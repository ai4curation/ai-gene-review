suggested_questions:
- question: Does Drosophila Tcs6 complement a yeast pcc1 null mutant, and does its loss reduce t6A levels
    in flies as Tcs3 loss does?
suggested_experiments:
- description: Express Tcs6 in a yeast pcc1 deletion strain and measure growth and t6A; in flies, quantify
    t6A in Tcs6 mutant or RNAi larvae.
