    label: L-galactose dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044479
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: InterPro2GO transfer of the plant L-galactose dehydrogenase activity via the LGALDH-like
      signature; CG18547 lies outside the plant clade to which PAINT confined this activity.
    reason: IPR044479 (LGALDH-like) matches the whole PTHR42686-type AKR group, which also contains
      D-arabinose, D-threo-aldose and pyridoxal dehydrogenases, so the signature does not fix substrate.
      In the PANTHER tree CG18547 diverges from Arabidopsis LGALDH at the Eukaryota node; PAINT placed
      GO:0010349 only at the land-plant node PTN000920391 and gave the fly gene just the generic
      oxidoreductase term from the subfamily root. L-galactose oxidation is a step of the plant
      ascorbate pathway, for which there is no evidence in insects. The catalytic tetrad is intact, so
      some sugar dehydrogenase activity is possible, but the L-galactose-specific claim is an over-transfer.
    supported_by:
    - reference_id: file:DROME/CG18547/CG18547-bioinformatics/RESULTS.md
      supporting_text: is propagated to O81884 from PTN000920391 (plant node)
    - reference_id: file:DROME/CG18547/CG18547-bioinformatics/RESULTS.md
      supporting_text: LCA with Arabidopsis LGALDH (O81884) is PTN000199432 (Eukaryota)
