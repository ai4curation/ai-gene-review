    id: GO:0070485
    label: dehydro-D-arabinono-1,4-lactone biosynthetic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q04212
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Sequence-similarity transfer of yeast ARA2's erythroascorbate-pathway role; the fly gene
      sits in the metazoan clade, outside the fungal node where PAINT placed this process.
    reason: Dehydro-D-arabinono-1,4-lactone (D-erythroascorbate) synthesis is a fungal pathway in which
      ARA2 oxidises D-arabinose and ALO1 completes the route. In the PANTHER tree CG18547 and ARA2
      share only the Opisthokont ancestor PTN000199433, and PAINT propagated ARA2's D-arabinose dehydrogenase
      and GO:0070485 terms only from the fungal node PTN000920371, a deliberate omission for the metazoan
      clade. There is no evidence that Drosophila makes erythroascorbate. The AKR fold supports
      oxidoreductase chemistry but not participation in this pathway.
    supported_by:
    - reference_id: file:DROME/CG18547/CG18547-bioinformatics/RESULTS.md
      supporting_text: LCA with yeast ARA2 (Q04212) is PTN000199433 (Opisthokonts)
    - reference_id: file:DROME/CG18547/CG18547-bioinformatics/RESULTS.md
      supporting_text: Neither specific function was placed at a node ancestral to CG18547.
