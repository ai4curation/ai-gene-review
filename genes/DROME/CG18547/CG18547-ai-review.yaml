suggested_questions:
- question: Do the three tandem Drosophila paralogs CG18547, CG3397 and CG12224 share a substrate, and
    is their function related to that of the C. elegans co-ortholog mec-14 in touch receptor neurons?
- question: Should modules/erythroascorbate_biosynthesis use the fungal PAINT node PTN000920371 rather
    than the whole PTHR42686 family as the selector for the Ara2-type step, given that the family includes
    metazoan and plant members that do not perform it?
suggested_experiments:
- description: Express and purify recombinant CG18547 and screen aldoses, aldehydes and pyridoxal with
    NAD+ and NADP+ (oxidative) and NADH/NADPH (reductive) to define substrate and cofactor specificity;
    include a Tyr76Phe tetrad mutant as a catalytic-dead control.
  experiment_type: biochemical assay
- description: Generate a CG18547 null (and CG18547/CG3397/CG12224 triple) and test lymph gland
    prohemocyte composition, oxidative-stress tolerance and metabolite profiles against a genomic-rescue
    control.
  experiment_type: genetic loss of function
