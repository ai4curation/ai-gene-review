taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG18547 encodes a 345-residue soluble aldo-keto reductase (AKR) of the GH17980p-related
  family (PANTHER PTHR42686), whose characterised members are NAD(P)+-dependent sugar and pyridoxal
  dehydrogenases (plant L-galactose dehydrogenase, yeast D-arabinose dehydrogenase ARA2). It retains
  the complete AKR Asp-Tyr-Lys-His catalytic tetrad and is therefore expected to be an active NAD(P)-dependent
  oxidoreductase, but its physiological substrate, cofactor preference and reaction direction have
  not been determined. CG18547 is one of three tandem Drosophila paralogs (with CG3397 and CG12224)
  that are co-orthologous to Caenorhabditis elegans mec-14; the family is absent from vertebrates.
  Its transcript marks a glutathione S-transferase-rich subpopulation of larval lymph gland prohemocytes.
  It sits outside the plant and fungal clades in which L-galactose dehydrogenase and erythroascorbate
  synthesis functions are established, so those pathway roles are not expected in the fly.
