  review:
    action: UNDECIDED
    summary: L-galactose substrate specificity is not resolved by the AKR domain.
    reason: The exact target contains an NADP-dependent oxidoreductase/aldo-keto-reductase domain, but
      these enzymes accommodate diverse carbonyl substrates. The family assignment does not establish
      L-galactose dehydrogenase activity in fly.
