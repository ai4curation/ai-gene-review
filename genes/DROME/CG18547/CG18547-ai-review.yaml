  review:
    action: ACCEPT
    summary: PAINT root-node (PTN002448388) inference of oxidoreductase activity, consistent with a
      complete AKR catalytic tetrad in CG18547.
    reason: CG18547 descends from PTN002448388, the PTHR42686:SF1 root at which PAINT placed only the
      generic oxidoreductase term, using Arabidopsis LGALDH and yeast ARA2 as experimental descendants.
      The fly protein retains Asp71, Tyr76, Lys102 and His143 aligned to the LGALDH tetrad, so catalytic
      competence is expected. Because characterised members in the subfamily act on different substrates
      and PAINT declined to place a more specific term at a node ancestral to the fly gene, this broad
      term is as precise as the evidence allows.
