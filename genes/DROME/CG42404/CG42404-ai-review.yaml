  review:
    action: ACCEPT
    summary: Membrane localization is supported by the PAINT node for the DGCR2 subfamily and by the
      conserved transmembrane helix of the fly protein.
    reason: The PAINT assertion at PTN000391897 is grounded in the mouse Dgcr2 (SEZ-12) membrane annotation
      and covers PTHR15256:SF6, the subfamily that contains CG42404, human DGCR2 and mouse Dgcr2. The fly
      protein retains the DGCR2 transmembrane helix, basic juxtamembrane segment and PPxY-type motif in a
      block aligning at about 35% identity with DGCR2, so it is inside the clade and has kept the feature
