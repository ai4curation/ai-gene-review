taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG42404 encodes a 1133-residue single-pass membrane protein of the DGCR2/IDD family (PANTHER
  PTHR15256, subfamily SF6), the insect relative of vertebrate DGCR2. Its N-terminal region carries a von
  Willebrand factor type C (VWFC) domain followed by a transmembrane helix, a basic juxtamembrane segment
  and a proline-rich PPxY-type motif, all conserved with vertebrate DGCR2, and then a long, largely
  disordered, low-complexity C-terminal extension that has no counterpart in vertebrate members. Unlike
  vertebrate DGCR2, the fly protein lacks the LDL-receptor class A module and the C-type lectin-like domain.
  It is expected to reside in a cellular membrane, but its topology, ligand or binding partners, molecular
  activity and biological role have not been determined experimentally.
