core_functions:
- description: Single-pass membrane protein of the DGCR2/IDD family with an extracellular-type VWFC domain,
    a conserved juxtamembrane PPxY-type motif and a long disordered C-terminal extension. No molecular
    activity, binding partner or biological role has been established.
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:8630060
    supporting_text: The deduced amino acid sequence of SEZ-12 revealed that it encodes membrane-bound C-type
      lectin
  - reference_id: file:DROME/CG42404/CG42404-bioinformatics/RESULTS-rereview.md
    supporting_text: The conserved core shared by fly and vertebrate members is VWFC + single TM + juxtamembrane
      tail with a PPxY-type motif.
  knowledge_gaps:
  - gap_statement: The topology, membrane compartment, binding partners and molecular activity of CG42404
      are unknown, including whether its conserved PPxY-type motif binds WW-domain proteins and what its
      fly-specific disordered C-terminal extension does.
    boundary: Vertebrate DGCR2 associates with the Reelin complex in cortical neurons, but the fly protein
      lacks the DGCR2 C-type lectin and LDL-A ectodomain modules.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is the N-terminal hydrophobic segment of CG42404 a cleaved signal peptide, making the VWFC domain
    extracellular and the long disordered region cytoplasmic as in vertebrate DGCR2 type I topology?
- question: Does the conserved PPPYE motif of CG42404 and DGCR2 mediate binding to WW-domain proteins, and
    is that interaction shared between insects and vertebrates?
suggested_experiments:
- description: Tag endogenous CG42404 (e.g. CRISPR knock-in at the C terminus, with a separate N-terminal
    epitope after the putative signal peptide) to determine membrane compartment and topology in tissues
    where it is expressed, such as the mushroom body.
- description: Affinity purification with mass spectrometry from fly heads using tagged CG42404, comparing
    wild type with a PPPYE-to-AAAAE mutant, to identify partners that depend on the conserved motif.
