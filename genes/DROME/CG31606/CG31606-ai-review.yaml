knowledge_gaps:
- gap_statement: The molecular activity, binding partners and physiological role of the secreted
    CG31606 protein are entirely undetermined.
  boundary: The protein is a predicted secreted small protein with a signal peptide and no
    recognised domain. It is restricted to the melanogaster species group and has no characterised
    homolog anywhere.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Localisation of a tagged protein, a loss-of-function phenotype screen and
    identification of interaction partners.
  provenance:
  - reference_id: file:DROME/CG31606/CG31606-bioinformatics/rereview/RESULTS-rereview.md
    supporting_text: It has no characterised ortholog in any model organism or in human, no PANTHER
      subfamily and no PAINT node.
suggested_questions:
- question: Is CG31606 secreted into the hemolymph (for example by the fat body), and does its
    expression respond to infection, nutrition or other stress, as for other lineage-restricted
    secreted Drosophila proteins?
- question: Does the weak similarity to TsetseEP-domain-labelled Drosophila proteins (for example
    CG42763) reflect a real shared fold?
suggested_experiments:
- description: Express an epitope-tagged CG31606 under its native regulatory region (or in the
    fat body) and test whether the protein is secreted into the hemolymph. Also check whether
    removing the signal peptide abolishes secretion.
- description: Make a CRISPR null allele and screen for viability, fertility, immune and
    metabolic phenotypes. Combine this with hemolymph proteomics to identify interaction partners.
