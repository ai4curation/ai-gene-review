      reference_id: file:DROME/CG31606/CG31606-uniprot.txt
      supporting_text: SIGNAL          1..18
    - reference_id: file:DROME/CG31606/CG31606-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: InterPro reports 0 integrated entries for Q8IPG8, and UniProt lists no PANTHER
        family.
    - reference_id: file:DROME/CG31606/CG31606-deep-research-falcon.md
