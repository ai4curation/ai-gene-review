- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    action: MODIFY
    summary: The sequence supports a secreted product. Extracellular region is the best-supported
      location, but it is a sequence-based inference and has not been observed directly.
    reason: The protein has a SignalP-predicted cleavable signal peptide followed by a soluble
      179-residue mature chain. It has no transmembrane segment and no C-terminal KDEL/HDEL
      ER-retention motif, so the default fate is secretion. The broad term GO:0005576 extracellular
      region is as specific as this evidence allows. A more specific location, such as
      extracellular space or hemolymph, would need direct localisation data. No experiment has
      measured where the protein is.
    supported_by:
    - *id001
    - reference_id: file:DROME/CG31606/CG31606-bioinformatics/RESULTS.md
      supporting_text: The C-terminal sequence is EEIASRILALKDNYQCA, without a hydrophobic anchor or canonical
        KDEL/HDEL retention terminus.
    proposed_replacement_terms:
    - id: GO:0005576
      label: extracellular region
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: No biological process is known. The ND root annotation is appropriate.
    reason: No perturbation or gene-specific phenotype study exists. Transcriptional responsiveness
      in a single high-throughput dataset, mentioned in the deep-research report, does not show that
      the protein takes part in any process. The gene is lineage-restricted and has no characterised
      relative, so no process can be inferred by homology.
    supported_by:
    - reference_id: file:DROME/CG31606/CG31606-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: CG31606 is a taxonomically restricted gene of the *D. melanogaster* species group.
    - reference_id: file:DROME/CG31606/CG31606-deep-research-falcon.md
      supporting_text: found no focused functional publication
