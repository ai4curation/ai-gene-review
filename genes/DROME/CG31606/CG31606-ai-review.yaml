id: Q8IPG8
gene_symbol: CG31606
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG31606 encodes a small (197-residue) uncharacterised protein that is restricted to
  the Drosophila melanogaster species group. It has a predicted cleavable N-terminal signal peptide
  (residues 1-18) followed by a soluble mature chain with no transmembrane segment, no ER-retention
  signal and no recognised protein family or domain. This suggests the protein is secreted. Orthologs
  are found only in melanogaster-group drosophilids, and the gene has no characterised homolog in
  other insects, model organisms or vertebrates. Its molecular activity, binding partners and
  physiological role have not been studied.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    action: ACCEPT
    summary: No molecular function is known. The ND root annotation correctly records the absence of
      evidence.
    reason: No gene-specific functional study exists, and no characterised relative can be used for
      transfer. The protein has no InterPro or PANTHER signature. Its only detectable relatives are
      uncharacterised Drosophila proteins that match at marginal E-values over part of the sequence.
      A signal peptide shows entry into the secretory pathway but says nothing about molecular
      activity.
    supported_by:
