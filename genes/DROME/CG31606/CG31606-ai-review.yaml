description: CG31606 encodes a small protein with a cleavable N-terminal signal peptide and a soluble
  mature region, consistent with secretion. Its molecular activity, ligand and physiological role are
  unknown. Partial structural similarity to an apolipoprotein provides a lipid-function hypothesis but
  does not establish a lipid-binding or transport mechanism.
