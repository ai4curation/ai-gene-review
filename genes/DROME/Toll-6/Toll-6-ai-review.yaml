    label: neurotrophin signaling pathway
  - id: GO:0043524
    label: negative regulation of neuron apoptotic process
  - id: GO:0048167
    label: regulation of synaptic plasticity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23892553
    supporting_text: Here we show that Toll paralogs unrelated to the mammalian neurotrophin
      receptors function as neurotrophin receptors in fruit flies.
  - reference_id: PMID:28373203
    supporting_text: Collectively, these data show that Toll-6 and -7 signal via the canonical
      MyD88 pathway to promote neuronal survival in the CNS.
  - reference_id: PMID:28846707
    supporting_text: Kek-6 and Toll-6 interact physically, and together regulate structural
      synaptic plasticity and homeostasis.
- description: Neuronal wiring receptor instructing motor axon targeting and,
    cell autonomously in olfactory projection neurons, dendrite targeting and synaptic
    partner matching; the olfactory role does not need the cytoplasmic domain, and its
    ligand and molecular activity are unknown, so no molecular function is asserted.
  directly_involved_in:
