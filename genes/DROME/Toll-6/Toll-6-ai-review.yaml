id: Q9VUN0
gene_symbol: Toll-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Toll-6 is a Toll-family type I transmembrane receptor with an extracellular
  leucine-rich-repeat ectodomain and a cytoplasmic TIR domain, closely related to the
  long Toll receptors 18w (Toll-2), Toll-7 and Toll-8. It is expressed in the embryonic,
  larval and adult central nervous system and is a cell-surface receptor for the
  Spätzle-family neurotrophins DNT2 (Spz5) and, promiscuously, DNT1 (Spz2). Neurotrophin
  binding to Toll-6 promotes neuronal survival through MyD88 and NF-kappaB, while in
  other contexts Toll-6 promotes cell death through Wek, Sarm and JNK; in motoneurons a
  Toll-6, dSARM and FoxO pathway regulates microtubule dynamics. Together with Toll-7 it
  is required for motor axon targeting, neuronal survival and locomotion, and with the
  kinase-less Trk-like receptor Kek-6 it regulates neuromuscular junction growth, active
  zone formation and structural plasticity of dopaminergic circuits. In the olfactory
  system Toll-6 acts cell autonomously in projection neurons to instruct dendrite
  targeting and synaptic partner matching, independently of its cytoplasmic domain. In
  the early embryo Toll-6 is expressed in stripes and acts with Toll-2 and Toll-8 in a
  positional code that directs planar polarity, cell intercalation and convergent
  extension. Spz5 signalling through Toll-6 also primes glia for phagocytosis of dying
  neurons. Toll-6 is not required for antimicrobial peptide induction.
