- term:
    id: GO:0048495
    label: Roundabout binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0264089
  - MGI:MGI:1315203
  - PANTHER:PTN002911633
  - UniProtKB:O75093
  - UniProtKB:O75094
  - UniProtKB:O94813
  review:
    summary: IBA from Slit-clade node PTN002911633, seeded only by Slit ligands (human SLIT1-3,
      Drosophila Slit).
    action: REMOVE
    reason: Robo binding is the defining ligand property of Slit proteins, carried by their
      second LRR domain within a Slit-specific architecture (four LRR domains, EGF repeats,
      laminin-G and C-terminal cystine-knot domains). Toll-6 lacks that architecture; it is
      a Toll-like receptor (LRR ectodomain, transmembrane segment, TIR domain) whose ligands
      are the Spätzle-family neurotrophins, and no study reports Toll-6 binding Robo. Its
      inclusion in the Slit clade (PANTHER subfamily PTHR45836:SF8) is contradicted by UniProt's
      HMM assignment to PTHR24366:SF96 and by its clear paralogy to 18w, Toll-7 and Toll-8.
      The family review for PTHR45836 already records PTN002911633 as NEEDS_PRUNING for SF8.
      This is an over-propagated IBA argued against on biological grounds.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002911633
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Robo binding is sound for the Slit seeds; the Toll-6 (SF8) branch should be
          pruned with an IRD, as recorded in the PTHR45836 family review.
    supported_by:
    - reference_id: file:DROME/Toll-6/Toll-6-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the Toll-like receptor family.
