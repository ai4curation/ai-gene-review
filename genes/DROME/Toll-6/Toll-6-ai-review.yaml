      (PMID:25741726); genetic interaction with 18w (Toll-2) and Tollo (Toll-8) in
      convergent extension (PMID:25363762). All correct. The text is incomplete rather
      than wrong: it omits neuronal survival, motor axon targeting, structural synaptic
      plasticity with Kek-6 (PMID:28846707, PMID:39704728) and glial Spz5-Toll-6
      signalling (PMID:30745142).
core_functions:
- description: Cell-surface receptor for the Spätzle-family neurotrophins DNT2 (Spz5) and
    DNT1, signalling through MyD88/NF-kappaB to promote neuronal survival and, with the
    co-receptor Kek-6, regulating synapse growth and structural synaptic plasticity.
  molecular_function:
