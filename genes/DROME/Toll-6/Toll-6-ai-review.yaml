    label: dendrite guidance
  - id: GO:0007411
    label: axon guidance
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:25741726
    supporting_text: Toll-6 and Toll-7, members of the Toll receptor family best known for
      functions in innate immunity and embryonic patterning, cell autonomously instruct the
      targeting of specific classes of PN dendrites and ORN axons, respectively
  - reference_id: PMID:23892553
    supporting_text: Altogether, our data show that Toll-6 and Toll-7 are required for locomotion,
      motor-axon targeting and neuronal survival.
suggested_questions:
- question: Should PAINT add an IRD at the Toll-6 branch (PANTHER PTHR45836:SF8) below the
    Slit nodes PTN002911633 and PTN002911625, or should Toll-6 be moved out of the SLIT
    HOMOLOG family to sit with its Toll paralogs (18w, Toll-7, Toll-8) as UniProt's HMM
    assignment (PTHR24366:SF96) implies?
- question: What ectodomain ligand or co-receptor mediates the cytoplasmic-domain-independent
    role of Toll-6 in projection-neuron dendrite targeting, and is it DNT2?
- question: Is GO:0005030 neurotrophin receptor activity the right MF for the
    cytoplasmic-domain-independent wiring role, or does that role need a distinct
    cell-surface recognition term?
suggested_experiments:
- description: Test whether DNT2 (spz5) or DNT1 mutants phenocopy toll-6 VA1d
    projection-neuron dendrite mistargeting, and whether an ectodomain point mutant that
    abolishes DNT2 binding still rescues targeting.
- description: Measure direct binding of the Toll-6 ectodomain to heparin and to Robo
    ectodomains (SPR/BLI) to settle the Slit-node IBA claims experimentally.
