- term:
    id: GO:0043524
    label: negative regulation of neuron apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:23892553
  review:
    summary: Toll-6 is required for, and sufficient to promote, survival of CNS neurons.
    action: NEW
    reason: Toll-6 mutant embryos have increased CNS apoptosis and lose Eve+ neurons, and
      activated Toll-6 expressed in neurons rescues naturally occurring cell death and the
      cell death caused by loss of DNT2. Toll-6 does part of the work as the receptor that
      initiates the MyD88/NF-kappaB pro-survival signal. This is the principal neurotrophic
      outcome of the receptor and is not captured by the existing annotations. Toll-6 can
      also promote apoptosis in other contexts (pupae, via Wek/Sarm/JNK), which the
      negative-regulation term does not deny; survival is the best-supported in vivo role.
    supported_by:
    - reference_id: PMID:23892553
      supporting_text: Altogether, our data show that Toll-6 and Toll-7 are required for locomotion,
        motor-axon targeting and neuronal survival.
    - reference_id: PMID:28373203
      supporting_text: Collectively, these data show that Toll-6 and -7 signal via the canonical
        MyD88 pathway to promote neuronal survival in the CNS.
