id: Q9VB22
gene_symbol: pins
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: pins (Partner of Inscuteable, also Rapsynoid) encodes the Drosophila GPSM/LGN-family scaffold
  protein, built from N-terminal tetratricopeptide repeats (TPRs) and three C-terminal GoLoco motifs.
  Through its GoLoco motifs Pins binds GDP-bound Galphai (and Galphao), acting as a guanine nucleotide
  dissociation inhibitor that anchors it to the cell cortex and frees Gbetagamma. Its TPR domain is held
  in an autoinhibited closed state that Galphai binding opens, allowing direct binding of Inscuteable,
  Mud (NuMA), and Canoe. In dividing neuroblasts and sensory organ precursor cells Pins forms an apical
  (or anterior) cortical crescent with Galphai and Insc, and couples this polarity to mitotic spindle
  orientation by recruiting Mud and dynein-based pulling forces, contributing to unequal daughter size
  and to asymmetric segregation of fate determinants.
