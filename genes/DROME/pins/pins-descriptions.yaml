- source: Alliance_Automated
  text: Enables protein domain specific binding activity. Involved in asymmetric neuroblast
    division and establishment of mitotic spindle orientation. Located in apical cortex.
    Part of raps-insc complex. Is expressed in several structures, including embryonic/larval
    midgut; embryonic/larval midgut primordium; epithelium; larval muscle system;
    and neuroblasts. Used to study brain cancer and cancer. Human ortholog(s) of this
    gene implicated in sensorineural hearing loss. Orthologous to several human genes
    including GPSM2 (G protein signaling modulator 2).
