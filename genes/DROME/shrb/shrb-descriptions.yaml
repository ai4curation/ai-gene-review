    overall_notes: 'Accurate and detailed: ESCRT-III polymerization, ILV budding and MVB formation, Notch
      down-regulation, germline and SOP abscission, spermiogenesis, and septate junctions, each tied to
      a fly paper. Membrane repair is a hedged family-level claim with no fly experiment, and the Dpp
      clause rests on an lgd paper. The text is long and omits the nuclear envelope role and neuron pruning;
      the dendrite phenotype is only in the disruption-phenotype section.'
