descriptions:
- source: UniProt
  text: Probable core polymerization component of the endosomal sorting required for transport (ESCRT)
    III complex involved in multiple cellular processes requiring the outward bending of membranes, including
    vesicle budding, membrane repair and cytokinesis (Probable). The ESCRT pathway involves 4 complexes
    (ESCRT-0, -I, -II and -III) that sequentially assemble on the cytoplasmic side of membranes and induce
    membrane remodeling, budding and scission. As part of the ESCRT-III complex, involved in the budding
    of intraluminal vesicles (ILVs) into endosomes to form multivesicular bodies (MVBs), which target
    their contents for degradation via the endolysosomal pathway (PubMed:16713958). Involved in regulation
    of signal transduction pathways, including the Notch and BMP/decapentaplegic (dpp) pathways, by sequestering
    the intracellular domains of activated receptors into ILVs, isolating them from the cytoplasm and
    targeting them for lysosomal degradation (PubMed:22162134, PubMed:25804739). Involved in targeting
    ubiquitilated proteins, such as mono-ubiquitilanated N/Notch, to MVBs for degradation (PubMed:22162134,
    PubMed:33660341). Plays a role in wing development by regulating Notch signaling (PubMed:22162134).
    Involved in abscission of germline cells during oogenesis (PubMed:25647097). Involved in spermiogenesis
    (PubMed:33660341). Required for efficient cytoplasmic isolation and abscission during cytokinesis
    of epithelial sensory organ precursor cells (PubMed:37226981). May be involved in septate junction
    remodeling and maintenance (PubMed:37226981).
  source_type: curated
