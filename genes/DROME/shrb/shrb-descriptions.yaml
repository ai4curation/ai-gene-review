findings:
- category: discrepancy
  text: FlyBase says 'inward membrane budding' and UniProt 'outward bending of membranes'. Both describe
    ESCRT-III budding away from the cytoplasm, one from the endosome lumen's point of view, so they do
    not conflict, but the wording can mislead.
  sources:
  - Alliance_Imported
  - UniProt
- category: discrepancy
  text: FlyBase and UniProt list membrane repair among Shrub's roles; the review found no Drosophila experiment
    testing it, so the claim is family-level.
  sources:
  - Alliance_Imported
  - UniProt
- category: gap
  text: No text mentions the nuclear envelope. Shrub gathers at reforming daughter nuclei in neuroblasts
    and is needed for lagging chromosome fragments to rejoin them, and the review accepts the inherited
    nuclear envelope and nuclear membrane reassembly rows.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The automated text never names ESCRT-III or abscission, Shrub's two core functions.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: UniProt and FlyBase agree on Shrub as the ESCRT-III core subunit in MVB biogenesis, cytokinesis
    and signalling, and both carry the same untraced membrane repair claim. The automated text is true
    but lists peripheral contexts.
