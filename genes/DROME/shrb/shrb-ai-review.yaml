- id: file:DROME/shrb/shrb-deep-research-flybase.md
  title: FlyBase gene description for shrb (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Checked each claim. Vps32/Snf7, filament-forming ESCRT-III subunit: traced (PMID:16713958,
      PMID:27452459). Multivesicular body biogenesis: traced (PMID:19571114, PMID:22162134, PMID:33349255).
      Cytokinesis: traced (PMID:25635693, PMID:25647097, PMID:37226981). Regulation of membrane-associated
      signalling: traced (Notch and EGFR, PMID:19571114, PMID:22162134). ''Membrane repair'' could not
      be traced. No Drosophila experiment testing Shrub in plasma membrane or wound repair was found (queries
      in the notes), so it reads as a family-level statement; it is untraced rather than wrong. ''Inward
      membrane budding'' is the endosome-centred description of ILV formation and matches its apparent
      source, the abstract of PMID:33660341. Other papers call the same topology outward budding, away
      from the cytoplasm. The first sentence has an editorial duplication (''encodes Shrub encodes''),
      recorded below as an OTHER defect. The text omits the dendrite and neuron-pruning roles behind the
      gene''s name and the nuclear envelope role.'
    source_defects:
    - defect_type: OTHER
      resource: FLYBASE
      record: FB:FBgn0086656
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: shrub (shrb) encodes Shrub encodes Vps32/Snf7, a filament-forming subunit of the
        ESCRT-III complex involved in inward membrane budding.
      corrected_value: shrub (shrb) encodes Vps32/Snf7, a filament-forming subunit of the ESCRT-III complex
        involved in inward membrane budding.
      cause: OTHER
      confidence: CONFIRMED
      explanation: 'Editorial error, not a wrong biological statement: the first sentence repeats its
        verb phrase (''encodes Shrub encodes''). It looks like the gene-name lead-in was joined to a sentence
        adapted from the abstract of PMID:33660341 (''Shrub (CG8055) encodes the vps32/snf7 protein, a
        filament-forming subunit ...''). The biology (Vps32/Snf7, filament-forming ESCRT-III subunit)
        is correct, so the defect is filed as OTHER rather than WRONG_STATEMENT. Suggested text: ''shrub
        (shrb) encodes Vps32/Snf7 (CHMP4), a filament-forming subunit of the ESCRT-III complex ...''.
        Optionally, ''inward membrane budding'' could read ''membrane budding away from the cytoplasm'',
        since other sources describe the same topology as outward budding.'
      supported_by:
      - reference_id: file:DROME/shrb/shrb-deep-research-flybase.md
        supporting_text: shrub (shrb) encodes Shrub encodes Vps32/Snf7, a filament-forming subunit of
          the ESCRT-III complex involved in inward membrane budding.
      - reference_id: PMID:33660341
        supporting_text: Shrub (CG8055) encodes the vps32/snf7 protein, a filament-forming subunit of
          the ESCRT (endosomal sorting complexes required for transport)-III complex involved in inward
          membrane budding.
