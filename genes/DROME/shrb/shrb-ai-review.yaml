id: Q8T0Q4
gene_symbol: shrb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: shrub (shrb) encodes the Drosophila ortholog of Snf7/Vps32 and CHMP4, the core polymerizing
  subunit of the ESCRT-III membrane-remodeling machinery. Shrub monomers assemble into striated filaments
  through complementary electrostatic interfaces. Its regulator Lethal (2) giant discs (Lgd, the CC2D1
  ortholog) binds the same self-assembly surface and is needed for full Shrub activity. ESCRT-III polymers
  act on the cytosolic face of membranes to bud and cut membrane away from the cytoplasm. On maturing
  endosomes, Shrub and Vps4 pinch off intraluminal vesicles to form multivesicular bodies. This sequesters
  ubiquitylated cargo such as the Notch receptor for lysosomal degradation and ends its signalling. Loss
  of ESCRT-III function causes excess Notch and EGFR signalling and overgrowth, and with Deltex and Kurtz,
  Shrub also sets the level of ligand-independent Notch activation from late endosomes. At the end of
  cell division Shrub is recruited to the midbody, where it is needed for abscission of female germline
  stem cells and of epithelial sensory organ precursors. ALIX, Aurora B and Lgd set the timing of germline
  stem cell abscission, and either too little or too much Shrub delays abscission and produces stem cysts.
  In sensory organ precursors Shrub is also recruited to membrane protrusions of neighbouring cells and
  is needed for septate junction integrity. In neurons, an ESCRT module that needs a direct Shrub-Myopic
  interaction severs dendrites during pruning, and shrub mutant sensory neurons have small dendritic fields
  with excess branching, the phenotype that named the gene. In dividing neuroblasts Shrub gathers at the
  reforming nuclear envelope and is needed for lagging acentric chromosome fragments to rejoin daughter
  nuclei, consistent with the conserved ESCRT-III role in sealing the nuclear envelope. Shrub is also
  required for autophagy and for spermatogenesis.
