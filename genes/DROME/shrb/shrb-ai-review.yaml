knowledge_gaps:
- gap_statement: It has not been tested whether Shrub, recruited by the fly CHMP7-type paralog CG5498,
    is required to seal the reforming nuclear envelope in Drosophila cells, as CHMP4B is in human cells;
    the fly evidence is localization at reforming daughter nuclei and a requirement for reintegration
    of lagging chromosome fragments.
  boundary: Shrub-GFP localizes to the periphery of reforming daughter nuclei in neuroblasts and Shrub
    is needed for acentric fragments to rejoin nuclei (PMID:32032426); no nuclear compartmentalization
    assay has been done on Shrub- or CG5498-depleted fly cells.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: PMID:32032426
    supporting_text: Shrub-GFP puncta localized along the periphery of daughter nuclei, presumably mediating
      fusion of nuclear membrane on daughter nuclei
  - reference_id: PMID:32032426
    supporting_text: RNAi depletion of Shrub also resulted in acentrics forming micronuclei in 51% (n
      = 37) of divisions imaged (compared with 17% of control divisions).
suggested_questions:
- question: Does the fly CHMP7 paralog CG5498 recruit Shrub to the reforming nuclear envelope, and is
    the semi-closed mitosis of syncytial embryos also ESCRT-III dependent?
- question: Is Shrub required for plasma membrane or wound repair in any Drosophila tissue, as the FlyBase
    and UniProt texts state at family level?
- question: Should the GO:0070938 contractile ring row from PMID:25635693 be replaced by midbody, the
    structure where GFP-Shrub was actually seen?
suggested_experiments:
- description: Measure nuclear compartmentalization (GFP-NLS retention, dextran exclusion) after mitosis
    in neuroblasts depleted of Shrub or CG5498, with live imaging of Shrub-GFP at the reforming envelope.
- description: Laser-wound larval epidermis or body-wall muscle expressing Shrub-GFP and test recruitment
    to the wound and repair kinetics after shrb knockdown.
