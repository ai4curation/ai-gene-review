  review:
    summary: Nuclear envelope (is_active_in), inherited from the PTHR22761 family root; seeds include
      human CHMP4A, CHMP4B and CHMP4C.
    action: ACCEPT
    reason: The IBD sits on PTN000509386, the root of the Snf7/CHMP4-CHMP6-CHMP7 family, and its seeds
      include the CHMP4 proteins themselves (CHMP4A, CHMP4B, CHMP4C) as well as CHMP7 and yeast Snf7 and
      Chm7. Shrub is a direct CHMP4 ortholog, descends from the node with no loss on its path, and flies
      have the CHMP7-type paralog (CG5498) that recruits CHMP4 to the reforming envelope in human cells.
      Fly data agree. In dividing larval neuroblasts, Shrub-GFP puncta line the reforming daughter nuclei
      in telophase and mark the sites where lagging acentric fragments fuse into them. The assay cannot
      separate the inner and outer membranes, and ESCRT-III is recruited to the envelope only transiently
      at mitotic exit, which is when it acts there, so is_active_in nuclear envelope is the right claim.
      The envelope is a real site of action but not the main one, which is the endosome and the midbody.
      It is accepted because nuclear envelope sealing is one of the conserved membrane-scission activities
      of CHMP4.
