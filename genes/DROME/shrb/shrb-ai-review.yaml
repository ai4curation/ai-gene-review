    supporting_text: The ESCRT-III protein Shrub in flies, or its homologs in yeast (Snf7) or humans (CHMP4B),
      is a critical polymerizing component of ESCRT-III needed to effect membrane fission.
  - reference_id: PMID:27452459
    supporting_text: Mutations that disrupt interface salt bridges interfere with Shrub polymerization
      and function.
  - reference_id: PMID:22389409
    supporting_text: We found that Lgd interacts directly with the ESCRT-III subunit Shrub through the
      DM14 domains.
  - reference_id: PMID:33349255
    supporting_text: which is eventually pinched off as an ILV by the concerted action of ESCRT-III and
      Vps4
  - reference_id: PMID:33349255
    supporting_text: This hypomorphic shrub mutant situation causes a slight decrease in the rate of ILV
      formation that appears to result in incomplete incorporation of Notch into ILVs.
  - reference_id: PMID:22162134
    supporting_text: Shrub promotes the lysosomal degradation of the receptor by mediating its delivery
      into multivesicular bodies (MVBs).
  - reference_id: PMID:19571114
    supporting_text: All ESCRT components are required for trafficking of ubiquitylated proteins and are
      required to prevent excess Notch and EGFR signaling.
