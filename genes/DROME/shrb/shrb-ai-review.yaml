- term:
    id: GO:0051258
    label: protein polymerization
  evidence_type: IDA
  original_reference_id: PMID:27452459
  qualifier: involved_in
  review:
    summary: Protein polymerization; purified Shrub core forms striated filaments through an electrostatic
      interface.
    action: NEW
    reason: Shrub polymerization is the core of its ESCRT-III function and has been assayed directly for
      the fly protein. The crystal structure shows the lattice contacts. The purified helical hairpin
      forms elongated striated filaments by EM. Charge-reversal mutants at the interface fail to polymerize
      and fail to rescue shrb null lethality. Shrub does the work of the process (it is the polymerizing
      monomer), so this is participation, not necessity. The comparators, human CHMP4A and CHMP4B, carry
      this term from experiments. GOA has no such row for shrb.
    supported_by:
    - reference_id: PMID:27452459
      supporting_text: The EM data show clear evidence for formation of Shrub polymers, which assemble
        as elongated, striated filaments (Figure 3A).
    - reference_id: PMID:27452459
      supporting_text: Mutations that disrupt interface salt bridges interfere with Shrub polymerization
        and function.
    - reference_id: PMID:27452459
      supporting_text: In contrast to wild-type Shrub, none of these point mutants were able to rescue
        the embryonically lethal phenotype (Figure 3D).
    - reference_id: file:DROME/shrb/shrb-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Homopolymer; forms elongated striated filaments of uniform ~10nm width (PubMed:27452459).
    - reference_id: file:DROME/shrb/shrb-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: 'R->E: Prevents homopolymerization due to disruption of electrostatic interaction.'
core_functions:
- description: Core polymerizing ESCRT-III subunit that buds and cuts intraluminal vesicles from the limiting
    membrane of maturing endosomes, forming multivesicular bodies and sorting ubiquitylated membrane proteins
    such as Notch for lysosomal degradation, which ends their signalling.
