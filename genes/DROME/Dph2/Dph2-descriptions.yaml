- source: Alliance_Automated
  text: Predicted to enable 2-(3-amino-3-carboxypropyl)histidine synthase activity.
    Predicted to be involved in protein histidyl modification to diphthamide. Predicted
    to be located in cytoplasm. Predicted to be part of 2-(3-amino-3-carboxypropyl)histidine
    synthase complex. Is expressed in several structures, including anterior endoderm;
    anterior endoderm anlage; central brain primordium; embryonic/larval midgut primordium;
    and ganglia. Human ortholog(s) of this gene implicated in diphthamide deficiency
    syndrome 2. Orthologous to human DPH2 (diphthamide biosynthesis 2).
