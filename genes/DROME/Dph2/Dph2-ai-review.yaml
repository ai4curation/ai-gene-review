id: Q9VFE9
gene_symbol: Dph2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dph2 is the Drosophila ortholog of DPH2, the partner subunit of DPH1 in the heterodimeric
  radical SAM enzyme that performs the first step of diphthamide biosynthesis. Within the complex DPH2
  helps keep the [4Fe-4S] cluster of DPH1 in a reduced, catalytically competent state, enabling transfer
  of the 3-amino-3-carboxypropyl group from S-adenosyl-L-methionine to the conserved histidine of translation
  elongation factor 2 (eEF2) in the cytoplasm. Diphthamide contributes to translational fidelity and is
  the target of diphtheria toxin.
