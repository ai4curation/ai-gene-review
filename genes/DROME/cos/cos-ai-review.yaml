  review:
    summary: Cos2 has a kinesin motor domain and has been reported to move along microtubules in a nucleotide-dependent
      manner.
    action: KEEP_AS_NON_CORE
    reason: Cos2 is described as an atypical kinesin, and a mutation (S182N) designed to block nucleotide
      hydrolysis has been reported to perturb its movement along microtubules. The nucleotide-bound state
      of the motor domain matters for Ci binding and processing, but the signaling functions of Cos2 are
      explained by its scaffold role; motility is retained here as a real but non-core activity.
    supported_by:
    - reference_id: PMID:20850429
      supporting_text: Cos2 has been shown to move along microtubules and this activity is perturbed by
        alterations, including S182N, expected to block nucleotide binding or hydrolysis
