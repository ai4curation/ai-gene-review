core_functions:
- description: 'Scaffold (signaling adaptor) of the Hedgehog signaling complex: in the absence of Hh,
    Cos2 binds Ci and recruits PKA, GSK3/Shaggy and CK1 so that Ci is hyperphosphorylated and processed
    to the Ci-75 repressor, keeping the pathway off.'
