gene_symbol: cos
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Costal-2 (Cos2) is an atypical kinesin-family protein (KIF27/KIF7 subfamily) that scaffolds
  the cytoplasmic Hedgehog signaling complex (HSC) together with the Fused kinase and the transcription
  factor Cubitus interruptus (Ci). In the absence of Hedgehog, Cos2 binds Ci through several domains,
  retains it in the cytoplasm and recruits PKA, GSK3/Shaggy and CK1 so that Ci is hyperphosphorylated,
  bound by SCF-Slimb and partially proteolysed to the Ci-75 repressor. When Hedgehog activates Smoothened,
  the phosphorylated Smoothened C-terminal tail binds Cos2 and recruits the Cos2-Fused complex to the
  membrane, where Fused is activated and phosphorylates Cos2; Cos2-kinase complexes dissociate and full-length
  Ci is stabilized and activated. Cos2 thus acts both as a negative regulator that keeps the pathway off
  and as a component required for maximal signaling. It binds microtubules and its motor domain retains
  nucleotide-dependent behaviour, but its essential roles are as a scaffold rather than as a cargo transporter.
  Cos2 is also required for ciliary localization of Smoothened in olfactory sensory neurons, and its levels
  are controlled by Ubr3-mediated ubiquitination.
