    label: Hedgehog signaling complex
  supported_by:
  - reference_id: PMID:15691767
    supporting_text: PKA, GSK3, and CKI directly bind the N- and C-terminal regions of Cos2, both of which
      are essential for Ci processing.
  - reference_id: PMID:15691767
    supporting_text: We propose that Cos2 recruits multiple kinases to efficiently phosphorylate Ci
- description: Cos2 binds Ci and tethers full-length Ci in the cytoplasm, preventing its nuclear import.
