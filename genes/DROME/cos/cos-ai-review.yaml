suggested_questions:
- question: Is the nucleotide-dependent motility of Cos2 along microtubules required in vivo, or does
    the motor domain act only as a nucleotide-regulated binding module for Ci (as suggested by the S182N
    analyses in PMID:20850429)?
suggested_experiments:
- description: Compare Hh-dependent Ci processing and ptc/dpp target expression in cos2 null wing disc
    clones rescued with wild-type Cos2, a motility-dead but nucleotide-binding Cos2, and a nucleotide-binding-dead
    Cos2 (S182N/G175A), using single-molecule imaging to confirm motility status.
