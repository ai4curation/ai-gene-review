      score: 5
    overall_notes: 'Correct and specific: scaffolds kinases and Ci for hyperphosphorylation
      and SCF-Slimb processing, which Hh blocks. Adds a hedged gut uracil/Duox immune
      role.'
- source: Alliance_Imported
  text: costa (cos) encodes a kinesin-like protein and a key component in the Hedgehog
    (Hh) pathway that is involved in pattern formation and growth control. It forms
    a complex with the product of fu to restrict the activity of the Hh pathway transcription
    factor encoded by ci.
