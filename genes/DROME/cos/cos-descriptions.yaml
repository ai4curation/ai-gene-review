    overall_notes: 'Correct: kinesin-like Hh pathway component forming a complex with
      Fused to restrain Ci. No kinase recruitment or Smo binding.'
- source: Alliance_Automated
  text: Enables several functions, including enzyme binding activity; microtubule
    binding activity; and smoothened binding activity. Involved in several processes,
    including follicle cell of egg chamber development; intraciliary transport; and
    negative regulation of smoothened signaling pathway. Located in cytosol. Part
    of Hedgehog signaling complex and microtubule associated complex. Colocalizes
    with extrinsic component of cytoplasmic side of plasma membrane. Is expressed
    in segment; wing disc; wing disc anterior compartment; and wing disc posterior
    compartment. Orthologous to human KIF27 (kinesin family member 27).
