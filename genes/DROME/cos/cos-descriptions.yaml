descriptions:
- source: UniProt
  text: Regulates cubitus interruptus (ci) processing by recruiting multiple kinases
    to promote its efficient phosphorylation. Scaffolds multiple kinases and ci into
    proximity to promote its hyperphosphorylation, which then targets it for SCFSlimb/proteasome-
    mediated processing to generate its repressor form. Hh signaling inhibits ci phosphorylation
    by interfering with the cos-ci-kinases complex formation. Negatively regulates
    hh-signaling pathways during various processes, including photoreceptor differentiation
    (PubMed:25639794, PubMed:27195754). May negatively regulate a hh- signaling pathway
    which functions in the intestinal immune response to bacterial uracil by activating
    the Duox-dependent production of reactive oxygen species (ROS) (PubMed:25639794).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16844
  source_id: O16844
