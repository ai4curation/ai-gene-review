          same study places CG33116/dCCS1 exclusively in the ER, so this deep ancestral node is the
          wrong level for a compartment that differs between the paralogs.
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000045767
  - UniProtKB:Q9C0D9
  - UniProtKB:Q9Y6K0
  review:
    action: ACCEPT
    summary: Follows directly from the inherited ethanolaminephosphotransferase activity. That reaction
      is the final, PE-forming step of the CDP-ethanolamine pathway.
    reason: The CDP-ethanolamine:diacylglycerol ethanolaminephosphotransferase reaction itself produces
      phosphatidylethanolamine, so the gene product does the catalytic work of this process; this is
      participation, not mere requirement. The process is inherited with the activity from the
      SELENOI/CEPT1-seeded node and is consistent with CG33116's EPT1-lineage placement and ER residence.
      The CPE (sphingolipid) synthesis assayed in PMID:23449981 was attributed to CG4585, not CG33116,
      so no sphingolipid process is inferred here.
    supported_by:
    - *id003
    - *id004
    - *id005
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000045767
        source_status: SUPPORTS_TRANSFER
        comment: PE biosynthesis is propagated from SELENOI/EPT1 and CEPT1 descendants and fits CG33116
          as an invertebrate EPT1-lineage enzyme.
