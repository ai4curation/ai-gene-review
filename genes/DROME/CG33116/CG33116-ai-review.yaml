- id: PMID:23449981
  title: Ceramide phosphoethanolamine biosynthesis in Drosophila is mediated by a unique ethanolamine
    phosphotransferase in the Golgi lumen.
  findings:
  - statement: CG33116/dCCS1 localizes exclusively to the ER (S2 and HeLa cells), unlike its paralog
      CG7149/dCCS3, which is partly at the Golgi.
    supporting_text: dCCS1 and dCCS2 localized exclusively to the ER, whereas dCCS3 and dCCS4 partially
      co-localized with the Golgi marker GM130
  - statement: CG33116 and CG7149 are fly-lineage duplicates with a single human orthologue.
    supporting_text: CG33116 and CG7149 (46% identity) have only one human orthologue and must therefore
      have originated from a gene duplication specific to the fly lineage
  - statement: Depleting CG33116 did not reduce CDP-ethanolamine-dependent ceramide phosphoethanolamine
      synthesis; CG4585/dCCS4 is the CPE synthase.
    supporting_text: Contrary to removal of dCCS1, dCCS2, or dCCS3, depletion of dCCS4 caused a major
      (∼60%) reduction in CPES activity
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The title is about the CPE synthase CG4585, but the paper explicitly
      tests CG33116 (dCCS1) for localization and CPES activity. It is the only direct experimental
      source for CG33116.
