  review:
    action: ACCEPT
    summary: Core activity, inherited from the EPT1/SELENOI lineage in which CG33116 sits.
    reason: CG33116 is in PANTHER subfamily PTHR10414:SF71, the invertebrate EPT1-type subfamily (no
      vertebrate members; includes C. elegans ept-1), whose vertebrate counterpart SF47 is SELENOI/EPT1.
      This placement is supported by the identity pattern (about 48% to SELENOI versus 25-33% to CEPT1,
      CHPT1 and fly bbc) and by the primary paper, which states that CG33116 and CG7149 share a single
      human orthologue. The PAINT ancestor PTN000045767 carries this activity seeded by human SELENOI
      and CEPT1, both of which have experimental ethanolaminephosphotransferase activity. CG33116 keeps
      the complete CAPT catalytic motif. No direct assay of CG33116 exists, but nothing indicates a loss
      of function, and the IBA is accepted as the core activity. The same node now also carries a 2026
      cholinephosphotransferase IBD, not present in the CG33116 GOA snapshot; because CG33116 is in the
      ethanolamine-specific SELENOI lineage, not the dual-specificity CEPT1 lineage, choline transfer is
      not assumed.
    supported_by:
