  review:
    action: REMOVE
    summary: Golgi residence was propagated from Golgi-localized relatives, but CG33116 itself was shown
      to localize only to the ER.
    reason: The Golgi IBD at PTN000045767 is seeded by CHPT1 (Q8WUD6, mouse Chpt1) and by FBgn0031948,
      which is CG7149/dCCS3, the fly paralog of CG33116. In the same experiment CG33116/dCCS1 localized
      exclusively to the ER in both S2 and HeLa cells, while CG7149/dCCS3 went partly to the Golgi.
      This is direct target-specific evidence that the compartment diverged after the fly-lineage
      duplication, and it contradicts Golgi residence for CG33116. The vertebrate EPT1-lineage member
      SELENOI, its closest characterized relative, is also an ER enzyme. The negative is supported by
      a direct experiment, not by low donor counts.
    supported_by:
