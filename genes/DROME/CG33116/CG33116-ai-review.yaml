  review:
    action: ACCEPT
    summary: CG33116/dCCS1 belongs to the choline/ethanolamine phosphotransferase subfamily and is an
      ER protein.
    reason: CG33116/dCCS1 belongs to the choline/ethanolamine phosphotransferase subfamily and is an ER
      protein. The primary comparative study separates this protein from ceramide phosphoethanolamine
      synthase CG4585, and the PAINT ancestral assignment supports conserved phosphatidylethanolamine
      synthesis from CDP-ethanolamine and diacylglycerol. Donor specificity is a phylogenetic inference,
      and the same PAINT ancestor now also carries a cholinephosphotransferase IBD that is absent from
      the CG33116 GOA snapshot; the localization experiment is direct.
    supported_by:
    - &id003
      reference_id: PMID:23449981
      supporting_text: three proteins from the CEPT subfamily (dCCS1/CG33116, dCCS2/CG6016 and dCCS3/CG7149)
    - &id001
      reference_id: PMID:23449981
      supporting_text: Both dCCS1-V5 and dCCS2-V5 localized exclusively to the ER, as evidenced by a reticular
        and nuclear envelope staining that overlapped extensively with the ER marker PE-methyltransferase
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000045767
        source_status: SUPPORTS_TRANSFER
        comment: The shared ancestor propagates ethanolaminephosphotransferase activity from experimentally
          characterized SELENOI/EPT1 and CEPT1 descendants; CG33116 remains CEPT-related rather than in
          the arthropod CPES branch, but its donor specificity may be dual rather than ethanolamine-only.
