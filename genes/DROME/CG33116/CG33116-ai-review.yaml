  review:
    action: KEEP_AS_NON_CORE
    summary: The broad InterPro phosphotransferase assignment is donor-agnostic and compatible with an ER CEPT-family enzyme
      but leaves donor specificity unresolved.
    reason: The broad annotation is consistent with the identified ER choline/ethanolamine phosphotransferase.
      GO:0016780 is the donor-agnostic InterPro parent for this CDP-alcohol phosphotransferase family,
      while CG33116's experimentally resolved ER compartment and inherited phosphatidylethanolamine-synthesis
      process convey its biological role more precisely. PTN000045767 now carries both
      ethanolaminephosphotransferase and cholinephosphotransferase IBDs, but CG33116's GOA snapshot
      has only the GO:0004307 ethanolaminephosphotransferase IBA and the available target study did
      not assay CDP-choline usage.
    supported_by:
    - *id003
    - *id001
