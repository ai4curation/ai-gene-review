  label: Drosophila melanogaster
description: CG33116 (dCCS1) is a seven-pass endoplasmic-reticulum membrane enzyme of the CDP-alcohol
  phosphotransferase family. It belongs to the invertebrate branch of the ethanolaminephosphotransferase
  (EPT1/SELENOI) lineage, the counterpart of the vertebrate selenoprotein SELENOI, and arose with its
  Golgi-associated paralog CG7149 from a fly-lineage duplication. By descent it is inferred to catalyze
  the final step of the CDP-ethanolamine (Kennedy) pathway, transferring phosphoethanolamine from
  CDP-ethanolamine to diacylglycerol to make phosphatidylethanolamine; it retains the complete
  CDP-alcohol phosphotransferase catalytic motif. Its enzymatic activity has not been measured directly.
  It is not the ceramide phosphoethanolamine synthase of Drosophila, which is the unrelated Golgi enzyme
  CG4585/Cpes.
