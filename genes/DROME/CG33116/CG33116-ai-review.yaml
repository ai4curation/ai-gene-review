suggested_questions:
- question: Does CG33116/dCCS1 use CDP-ethanolamine exclusively, as SELENOI does, or does it also
    transfer phosphocholine from CDP-choline? Does it accept 1-alkyl-2-acylglycerol, making ether-linked
    PE, as SELENOI does?
  experts:
  - Lipid biochemist with Drosophila Kennedy-pathway expertise
- question: After the fly-lineage duplication, how do the ER enzyme CG33116 and the Golgi-associated
    CG7149 divide PE synthesis between them, by tissue, by compartment or by acceptor?
suggested_experiments:
- description: Express CG33116 in yeast lacking ept1 and cpt1, or in SELENOI-null mammalian cells, and
    measure microsomal CDP-ethanolamine and CDP-choline phosphotransferase activity with diacyl and
    alkylacyl glycerol acceptors. Include a catalytic-aspartate (D134/D138) mutant as a control.
- description: Measure PE and plasmalogen-PE species by lipidomics in CG33116 and CG7149 single and double
    mutant flies or S2 RNAi cells, labelling with [14C]ethanolamine.
