  label: Drosophila melanogaster
description: CG33116 is an endoplasmic-reticulum membrane member of the choline/ethanolamine phosphotransferase
  family. It is inferred to catalyze the final Kennedy-pathway transfer of phosphoethanolamine from CDP-ethanolamine
  to diacylglycerol, producing phosphatidylethanolamine. Its ER localization distinguishes it from Golgi-associated
  relatives involved in phospholipid and sphingolipid metabolism.
