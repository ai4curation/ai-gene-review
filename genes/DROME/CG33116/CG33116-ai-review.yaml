core_functions:
- description: Transfers phosphoethanolamine from CDP-ethanolamine to diacylglycerol at the ER
    membrane, the final step of de novo phosphatidylethanolamine synthesis by the Kennedy pathway.
    This is inferred from its membership of the EPT1/SELENOI lineage; it has not been assayed directly.
  molecular_function:
    id: GO:0004307
    label: ethanolaminephosphotransferase activity
  directly_involved_in:
