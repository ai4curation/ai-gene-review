  review:
    summary: >-
      L-allo-threonine aldolase activity by phylogenetic inference (PTN000033149; donors yeast GLY1 S000000772,
      E. coli LtaE P75823, Arabidopsis THA1/THA2).
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT node is grounded by microbial and plant low-specificity threonine aldolases, and mouse
      Tha1 (the closest characterized animal homolog) also cleaves L-allo-threonine, so the activity is
      plausible for CG10184. In the animal clade, however, the characterized enzyme strongly prefers hydroxytrimethyllysine,
      so threonine cleavage is likely a side activity. The term is as precise as the evidence allows;
      kept as non-core.
    supported_by:
    - reference_id: PMID:38615009
      supporting_text: >-
        As we found that the mouse enzyme has a strong preference (1000 folds) for HTML towards threonine,
        the name hydroxytrimethyllysine aldolase (Htmla) would be a better descriptor of the mouse gene.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000033149
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Threonine aldolase node grounded by yeast, bacterial and plant enzymes; activity plausible but
          likely secondary in animals.
