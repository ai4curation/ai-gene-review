- term:
    id: GO:0004793
    label: threonine aldolase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6XPS7
  review:
    summary: >-
      Threonine aldolase activity (L-threonine to glycine plus acetaldehyde) transferred from mouse Tha1
      (Q6XPS7).
    action: KEEP_AS_NON_CORE
    reason: >-
      Mouse Tha1 has measurable L-threonine aldolase activity (IDA), but about 1000-fold lower efficiency
      than with hydroxytrimethyllysine. The term (defined on L-threonine) is already specific; kept as
      a non-core side activity.
    supported_by:
    - reference_id: PMID:38615009
      supporting_text: >-
        As we found that the mouse enzyme has a strong preference (1000 folds) for HTML towards threonine,
        the name hydroxytrimethyllysine aldolase (Htmla) would be a better descriptor of the mouse gene.
