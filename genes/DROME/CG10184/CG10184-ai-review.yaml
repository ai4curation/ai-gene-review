      Glycine biosynthesis by phylogenetic inference from yeast GLY1 and E. coli LtaE (PTN000033149).
    action: KEEP_AS_NON_CORE
    reason: >-
      In yeast GLY1 is a major source of glycine from threonine. Any aldolase activity of CG10184 (on
