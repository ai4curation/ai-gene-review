  label: Drosophila melanogaster
description: >-
  CG10184 (synonym HTMLA) encodes an uncharacterized Drosophila melanogaster pyridoxal 5'-phosphate-dependent
  aldolase of the threonine aldolase family (aromatic amino acid beta-eliminating lyase fold, Pfam PF01212).
  It is the fly member of the PANTHER L-threonine aldolase family (PTHR48097) and is related to yeast
  GLY1 and mouse Tha1. Mouse Tha1 cleaves L-threonine and L-allo-threonine to glycine and acetaldehyde
  but strongly prefers 3-hydroxy-N6,N6,N6-trimethyl-L-lysine, which it cleaves to 4-trimethylaminobutanal
  and glycine, the second step of L-carnitine biosynthesis. By homology CG10184 is therefore a candidate
  cytosolic hydroxytrimethyllysine aldolase (and threonine aldolase) in flies; none of these activities
  has been tested for the fly protein, and the fly genome also encodes serine hydroxymethyltransferase,
  which in mammals has weak hydroxytrimethyllysine aldolase activity.
