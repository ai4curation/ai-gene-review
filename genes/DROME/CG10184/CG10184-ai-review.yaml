suggested_questions:
- question: >-
    Which fly enzyme catalyses the hydroxytrimethyllysine aldolase step in vivo: CG10184, Shmt, or both,
    and what are their relative catalytic efficiencies with HTML versus threonine?
suggested_experiments:
- description: >-
    Express CG10184 recombinantly and measure kcat/Km with 3-hydroxy-trimethyllysine, L-threonine and
    L-allo-threonine; in parallel measure HTML accumulation and carnitine levels in CG10184 mutant flies.
  hypothesis: >-
    CG10184 is the main fly HTMLA, with a strong preference for HTML over threonine, as for mouse Tha1.
