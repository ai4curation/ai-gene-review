id: Q03017
gene_symbol: cact
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cactus is the Drosophila member of the IkappaB family of NF-kappaB inhibitors. It is a cytoplasmic
  ankyrin-repeat protein that binds the Rel-family transcription factors Dorsal and Dif, masking their
  DNA-binding and nuclear-localization functions and retaining them in the cytoplasm. Activation of the
  Toll receptor by cleaved Spaetzle leads, via the MyD88-Tube-Pelle complex, to Pelle-mediated phosphorylation
  of N-terminal signal-responsive serines in Cactus and its Slimb (betaTrCP)-dependent proteasomal degradation,
  releasing Dorsal/Dif to enter nuclei. A separate, signal-independent turnover pathway acts through the
  C-terminal PEST region. Maternally, a ventral-to-dorsal gradient of Cactus degradation shapes the nuclear
  Dorsal gradient that patterns the embryonic dorsoventral axis; loss of cactus ventralizes and stabilized
  alleles dorsalize embryos. In larvae and adults Cactus restrains Toll-dependent antifungal and anti-Gram-positive
  antimicrobial peptide gene expression, and its own transcription is induced by Toll signaling as negative
  feedback. Cactus also regulates prohemocyte differentiation in the lymph gland and accumulates with
  Dorsal at the postsynaptic side of larval neuromuscular junctions.
