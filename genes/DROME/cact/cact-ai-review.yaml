suggested_questions:
- question: Does Cactus sequester Dorsal and Dif with different affinities, and does this contribute to
    the different Rel-protein usage in embryo (Dorsal) versus adult fat body (Dif)?
- question: What is the in vivo role, if any, of IKKbeta (ird5/DLAK) in Cactus turnover, given that Pelle
    is the Toll-dependent Cactus kinase and IKK is dispensable for Toll signaling?
- question: Is the postsynaptic accumulation of Cactus and Dorsal at the NMJ controlled by Toll signaling
    or by a Toll-independent calcium/calcineurin pathway?
- question: Does GO need an explicit convention for IkappaB-family proteins acting in IKK-independent
    Rel pathways, so that IBA propagation of canonical NF-kappaB terms does not reach insect Cactus?
suggested_experiments:
- description: Quantitative binding measurements (e.g. ITC or SPR) of full-length Cactus with Dorsal and
    Dif Rel-homology domains, including Cactus isoforms A and C.
- description: In vivo phospho-site mapping of Cactus in fat body after fungal infection in pelle kinase-dead
    versus ird5 mutant backgrounds to define which kinase acts in immunity.
- description: Muscle-specific cactus knockdown with electrophysiology to test whether postsynaptic Cactus
    regulates NMJ plasticity independently of Toll.
