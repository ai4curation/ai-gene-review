  review:
    summary: IBA from the IkappaB clade for negative regulation of canonical (IKK-dependent) NF-kappaB
      signaling.
    action: MODIFY
    reason: Cactus inherits the IkappaB inhibitory function, and the node placement is sound. However
      GO:0043124 regulates the canonical NF-kappaB cascade, which GO defines as IKK-dependent. In the
      fly Toll pathway Cactus is phosphorylated by Pelle and Drosophila IKK does not function in that
      pathway (PMID:24086459). The lineage-appropriate term, already carried by Cactus with abundant experimental
      support, is negative regulation of Toll signaling pathway.
    proposed_replacement_terms: &id008
    - id: GO:0045751
      label: negative regulation of Toll signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008710654
        comment: IkappaB-clade ancestor; the inhibitory function is correctly inherited by Cactus, but
          the canonical NF-kappaB term is defined as IKK-dependent, and the fly Toll pathway uses Pelle
          rather than IKK as the Cactus kinase. The lineage-appropriate term is negative regulation of
          Toll signaling pathway.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
