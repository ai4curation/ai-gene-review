descriptions:
- source: UniProt
  text: Involved in the formation of the dorsoventral pattern. It inhibits nuclear
    translocation of the dorsal morphogen in the dorsal region of the embryo. Acts
    as a negative regulator of the NF-kappa-B (rel) signaling pathway. Cact is degraded
    by IKKbeta, this is essential for NF-kappa-B (rel) activation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03017
