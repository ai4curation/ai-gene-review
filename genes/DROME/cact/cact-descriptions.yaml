    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: IkappaB homolog binding Dorsal and Dif, Toll-induced
      destruction.'
- source: Alliance_Automated
  text: Enables NF-kappaB binding activity and protein sequestering activity. Involved
    in several processes, including negative regulation of antifungal peptide production;
    negative regulation of hemocyte differentiation; and negative regulation of signal
    transduction. Located in cytosol; neuromuscular junction; and subsynaptic reticulum.
    Is expressed in several structures, including adult head; adult heart; adult neuromuscular
    junction; embryonic/larval salivary gland; and somatic muscle cell. Used to study
    collagen disease. Human ortholog(s) of this gene implicated in several diseases,
    including childhood-onset asthma; disease of cellular proliferation (multiple);
    ectodermal dysplasia and immunodeficiency 2; liver disease (multiple); and lung
    disease (multiple). Orthologous to several human genes including NFKBIA (NFKB
    inhibitor alpha).
