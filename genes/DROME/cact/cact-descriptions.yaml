    overall_notes: 'Correct: dorsoventral pattern, inhibits Dorsal import, negative
      regulator of Rel. ''Degraded by IKKbeta'' conflicts with the review, where Pelle
      phosphorylates Cactus in Toll signaling; the IKK/Relish branch does not use
      Cactus.'
- source: Alliance_Imported
  text: cactus (cact) encodes the homolog of mammalian IkappaB. cact product acts
    as an inhibitor of NF-kappaB signaling by binding to the products of dl and Dif,
    which prevents their nuclear translocation. Toll signaling promotes the destruction
    of cact protein, which allows the products of dl and Dif to enter the nucleus
    and regulate gene expression.
  source_type: curated
  url: https://flybase.org/reports/cact.html
  source_id: FB:FBgn0000250
