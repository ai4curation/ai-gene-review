id: P17276
gene_symbol: Hn
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Henna (Hn, CG7399; historically also called Pah, DTPH, DTPHu or Tph) encodes the Drosophila
  phenylalanine hydroxylase, a cytosolic, non-heme-iron, tetrahydrobiopterin-dependent aromatic amino
  acid hydroxylase of the PANTHER phenylalanine-4-hydroxylase subfamily (PTHR11473:SF24) that also contains
  mammalian PAH. The 452-residue Hn-PA/PC protein has an N-terminal ACT regulatory domain, a central catalytic
  domain carrying the conserved iron-ligand residues (His284, His289, Glu329) and a C-terminal oligomerization
  region. Its principal reaction is the hydroxylation of L-phenylalanine to L-tyrosine, the first step of
  phenylalanine degradation and the only endogenous route to tyrosine; recombinant Hn also hydroxylates
  L-tryptophan to 5-hydroxytryptophan, and in vivo Hn acts as the peripheral (non-neuronal) tryptophan hydroxylase
  supplying serotonin for early developmental events, whereas the paralog Trhn (CG9122) provides neuronal
  serotonin. Hn protein is most abundant in the larval fat body and adult head, peaks at pupariation and
  pharate adult formation, and is also detected in larval dopaminergic neurons. Through tyrosine supply it
  feeds catecholamine (DOPA, dopamine) synthesis for cuticle sclerotization and pigmentation; henna mutants
  have dark brown eyes with reduced red drosopterin pigments, and fat-body knockdown makes dietary tyrosine
  conditionally essential and triggers a compensatory protein (yeast) appetite.
