core_functions:
- description: Phenylalanine 4-hydroxylase converting L-phenylalanine to L-tyrosine, the first step of
    phenylalanine degradation and the sole endogenous route to tyrosine; required in the fat body (and
    possibly hemocytes) to keep tyrosine a non-essential amino acid. Established experimentally in Drosophila
    (recombinant enzyme assay, mutant enzyme activity, RNAi with tyrosine-specific rescue) and inherited
    from the bilaterian PAH ancestor (PAINT node PTN000895564, PANTHER PTHR11473:SF24).
