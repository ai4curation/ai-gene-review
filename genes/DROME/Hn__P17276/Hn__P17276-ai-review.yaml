suggested_questions:
- question: How is the substrate preference of Hn between phenylalanine and tryptophan controlled in different
    tissues (for example fat body versus cuticle or embryo), and does phosphorylation of Ser272 or the
    ACT domain switch it?
- question: By what mechanism does loss of Hn reduce drosopterin eye pigments; does it act through tetrahydrobiopterin
    consumption and recycling or through another route?
- question: Do the alternative Hn isoforms (Hn-PA/PC versus the N-terminally truncated Hn-PD) differ in
    activity or tissue distribution?
suggested_experiments:
- description: Measure steady-state kinetics of purified Hn with phenylalanine and tryptophan, with and
    without phenylalanine pre-activation and CaMKII phosphorylation, to define the basis of its dual specificity.
  experiment_type: enzyme kinetics
- description: Tissue-specific Hn knockdown combined with targeted metabolomics of tyrosine, 5-hydroxytryptophan,
    DOPA and biopterins in fat body, epidermis and head.
  experiment_type: metabolomics
