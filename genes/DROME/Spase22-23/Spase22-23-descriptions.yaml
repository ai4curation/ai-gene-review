descriptions:
- source: UniProt
  text: Essential component of the signal peptidase complex (SPC) which catalyzes
    the cleavage of N-terminal signal sequences from nascent proteins as they are
    translocated into the lumen of the endoplasmic reticulum (By similarity). Essential
    for the SPC catalytic activity, possibly by stabilizing and positioning the active
    center of the complex close to the lumenal surface (By similarity). . (Microbial
    infection) Plays an important role in infection by flaviviruses such as West Nile
    virus and Dengue virus type 2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VCA9
