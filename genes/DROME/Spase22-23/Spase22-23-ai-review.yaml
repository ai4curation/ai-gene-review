taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Spase22-23 encodes the Drosophila ortholog of SPCS3 (yeast Spc3), a single-pass ER membrane
  accessory subunit of the endoplasmic reticulum signal peptidase complex (SPC). In other eukaryotes this
  subunit is essential for SPC catalytic activity, and together with the catalytic subunit SEC11 it forms
  the core of the complex. With twr (SEC11), Spase12 (SPCS1) and Spase25 (SPCS2), it cleaves N-terminal
  signal peptides from secretory and membrane proteins as they are translocated into the ER.
