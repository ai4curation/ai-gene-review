  - InterPro:IPR006775
  review:
    action: UNDECIDED
    summary: The exact target is native PC (X2JE45), which differs from the longer PB isoform in its N-terminal
      GH116 region.
    reason: The exact target is native PC (X2JE45), which differs from the longer PB isoform in its N-terminal
      GH116 region. Its conserved catalytic Glu362 and Asp575 support hydrolase potential, but 177 PB
      N-terminal residues are replaced by a distinct 28-residue segment. Primary human GBA2 isoform experiments
      show that N-terminal alterations can abolish activity despite expression. Those changes are not
      identical to fly PC, so neither catalytic activity nor inactivity is established for this particular
      isoform; an isoform-resolved assay is needed.
    supported_by:
    - &id001
      reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: Both global and local MAFFT alignments map human GBA2 Glu527 to PC Glu362 and Asp677
        to PC Asp575 (PB Glu511 and Asp724). The catalytic nucleophile and acid/base residue types are
        retained.
    - &id002
      reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: PC has a distinct 28-residue N-terminus followed by a 771-residue sequence identical
        to PB residues 178–948.
    - &id003
      reference_id: PMID:33261081
      supporting_text: Thus, all human GBA2 isoforms were expressed but only isoform 1 clearly hydrolyzed
        the MUG substrate.
