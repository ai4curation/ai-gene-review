  - *id004
knowledge_gaps:
- gap_statement: It is unknown whether the CG33090-PC isoform, which lacks the region corresponding to human
    GBA2 residues 1-193, folds into an active GH116 glucosidase, and whether any CG33090 product hydrolyzes
    glucosylceramide in the fly.
  boundary: The longer CG33090 products are GBA2 orthologs with intact catalytic residues. PC keeps the
    catalytic region but has a different N terminus. Human GBA2 isoforms with smaller N-terminal-domain
    changes were inactive. No Drosophila CG33090 product has been assayed.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Isoform-resolved expression and activity assays of PC versus PB, plus lipidomics of CG33090
    mutant flies.
  provenance:
  - *id004
  - *id005
suggested_questions:
- question: Is the CG33090-RC transcript, which encodes the N-terminally truncated PC isoform, translated
    at appreciable levels in any tissue, and does its product retain the activity of the full-length GBA2
    ortholog?
- question: Do CG33090 loss-of-function flies accumulate glucosylceramide or other glucosylated lipids,
    as GBA2-deficient mammals do?
suggested_experiments:
- description: >-
    Express FLAG-tagged CG33090-PB and CG33090-PC side by side in Drosophila S2 cells (or COS-7 cells, as
    for the human isoforms) and measure 4-methylumbelliferyl beta-D-glucoside hydrolysis and
    glucosylceramide turnover with conduritol-B-epoxide-insensitive assays, including PB E511A and
    D724A catalytic mutants as negative controls.
- description: >-
    Profile glucosylceramides and ceramides in CG33090 null or RNAi flies versus controls, with
    transgenic rescue by PB or PC, to establish the in vivo substrate and test each isoform's contribution.
