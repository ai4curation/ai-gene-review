taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG33090 encodes GBA2-family glycoside hydrolase proteins related to non-lysosomal glucosylceramidases.
  Its 799-residue PC isoform has a distinct shortened N-terminus and shares a 771-residue C-terminal sequence
  with the longer PB isoform. PC retains the conserved GH116 catalytic nucleophile and acid/base residues,
  while the effect of its altered N-terminal domain on glucoside hydrolysis and lipid metabolism remains
  unresolved.
