core_functions:
- description: >-
    Predicted GH116 retaining beta-glucosidase, inferred for the CG33090 gene from its 1:1 orthology to
    human GBA2 within PANTHER subfamily PTHR12654:SF0 and from conservation of the catalytic
    nucleophile/acid-base pair. The physiological substrate in the fly (by analogy with GBA2, glucosylceramide)
    and the subcellular site of action have not been tested. This entry describes the gene-level
    expectation for its full-length products. Whether the N-terminally truncated PC isoform (X2JE45) shares
    the activity is unresolved, which is why the corresponding existing annotation is UNDECIDED.
  molecular_function:
    id: GO:0008422
    label: beta-glucosidase activity
  supported_by:
  - reference_id: file:DROME/CG33090/CG33090-uniprot.txt
    supporting_text: 'DR   PANTHER; PTHR12654:SF0; NON-LYSOSOMAL GLUCOSYLCERAMIDASE; 1.'
