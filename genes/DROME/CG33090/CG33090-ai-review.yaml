id: X2JE45
gene_symbol: CG33090
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG33090 is the single Drosophila melanogaster ortholog of the GBA2 non-lysosomal glucosylceramidases,
  members of glycoside hydrolase family 116 (GH116; PANTHER PTHR12654:SF0). Its 948-residue PB product
  (Q7KT91) aligns over its catalytic core with human GBA2, which hydrolyzes glucosylceramide to glucose
  and ceramide using a retaining mechanism with a glutamate nucleophile and an aspartate acid/base. X2JE45
  is the 799-residue PC isoform. In PC a distinct 28-residue N terminus replaces PB residues 1-177, the
  region corresponding to roughly the first 193 residues of human GBA2, which include part of the
  N-terminal beta-sandwich domain. PC keeps the rest of the N-terminal domain, the complete catalytic
  region and both catalytic residues (Glu362 and Asp575). The fly gene has not been characterized
  experimentally. Its glycosidase activity, physiological substrates (for example insect
  glucosylceramides), subcellular location and physiological role are inferred from GBA2 orthology.
  Whether the shortened PC isoform is catalytically active is not known.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006775
  review:
    action: UNDECIDED
    summary: Plausible family-level glycosidase activity, but unresolved for the exact PC isoform, which lacks
      the GBA2 N-terminal region corresponding to human residues 1-193.
    reason: >-
      The InterPro2GO mapping from the GH116 catalytic region (IPR006775) correctly describes the family
      chemistry. CG33090 is grounded phylogenetically as the GBA2 ortholog: X2JE45 itself is classified in
      PANTHER subfamily PTHR12654:SF0, the same subfamily as human GBA2, and it keeps the experimentally
      defined catalytic nucleophile and acid/base pair (PC Glu362 and Asp575, equivalent to human Glu527 and
      Asp677). The difficulty is the isoform. The re-review mapping shows that PC's shared sequence begins
      at human GBA2 position 194, so PC has no counterpart for human residues 1-193. That region includes
      the N-terminal-domain beta-strand where a six-residue insertion (between human residues 189 and 190,
      isoform X1) abolished detectable activity even though the protein was expressed. Human isoforms with
      other internal changes were also inactive. These results do not prove PC inactive, because none of
      the human variants match the PC truncation, but they remove the usual basis for treating any product
      with an intact catalytic domain as active. GO usually records function at the gene level, and the
      longer CG33090 products such as PB/Q7KT91 would be expected to carry beta-glucosidase activity
      from the GBA2 subfamily. For this accession, neither activity nor inactivity is established. The row
      stays UNDECIDED and should not be refined to beta-glucosidase or glucosylceramidase activity until
      the native PC protein is assayed.
    supported_by:
    - reference_id: file:DROME/CG33090/CG33090-uniprot.txt
      supporting_text: 'DR   PANTHER; PTHR12654:SF0; NON-LYSOSOMAL GLUCOSYLCERAMIDASE; 1.'
    - &id001
      reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: Both global and local MAFFT alignments map human GBA2 Glu527 to PC Glu362 and Asp677
        to PC Asp575 (PB Glu511 and Asp724). The catalytic nucleophile and acid/base residue types are
        retained.
    - &id002
      reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: PC has a distinct 28-residue N-terminus followed by a 771-residue sequence identical
        to PB residues 178–948.
    - &id004
      reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS-rereview.md
      supporting_text: In both alignments PC position 29, the first residue of the sequence shared with PB,
        aligns with PB position 178 and human GBA2 position 194.
    - &id005
      reference_id: PMID:33261081
      supporting_text: Surprisingly, isoform X1, which has an insertion of six amino acid between residues
        189 and 190 in a β-strand of the N-terminal non-catalytic domain compared to isoform 1, showed no
        significant activity, indicating that the structural integrity of the N-terminal domain is also
        critical to the activity.
    - &id003
      reference_id: PMID:33261081
      supporting_text: Thus, all human GBA2 isoforms were expressed but only isoform 1 clearly hydrolyzed
        the MUG substrate.
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008928
  - InterPro:IPR012341
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: A generic six-hairpin glycosidase superfamily mapping. It does not describe the GBA2 subfamily
      process, and activity of the PC isoform is unproven.
    reason: >-
      The row is propagated from the six-hairpin glycosidase superfamily signatures (IPR008928, IPR012341).
      These are shared by many carbohydrate-active enzyme families with unrelated substrates, so the term
      carries no information about the GBA2 subfamily. GBA2 family chemistry acts on glucosylceramide, a
      glycosphingolipid. In GO, glucosylceramide catabolic process falls under lipid metabolic process and
      carbohydrate derivative metabolic process, not under carbohydrate metabolic process, so the term does
      not fit the expected biology even for the full-length CG33090 products. For this PC isoform, any
      catalytic process participation also depends on the unresolved activity question raised for the
      glycosidase row. No specific replacement is proposed: the more specific candidate, glucosylceramide
      catabolic process, has not been shown for any Drosophila product, and PAINT has not propagated it to
      this gene.
    supported_by:
    - *id002
    - *id004
    - *id005
