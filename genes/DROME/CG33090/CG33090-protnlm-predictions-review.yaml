  review:
    assessment: UNC
    confidence_score: 1
    summary: X2JE45 is the native 799-residue PC isoform. It retains the catalytic residues corresponding
      to human GBA2 Glu527 and Asp677, but replaces PB residues 1–177 with a distinct 28-residue N-terminus
      that alters the GH116 N-terminal region. Human GBA2 isoform experiments establish that such noncatalytic-domain
      changes can impair activity; they do not demonstrate that this different fly isoform is inactive.
      The specific missing evidence is activity or fold integrity of native PC, rather than uncertainty
      about the GBA2 family as a whole.
    supported_by:
    - reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: Both global and local MAFFT alignments map human GBA2 Glu527 to PC Glu362 and Asp677
        to PC Asp575 (PB Glu511 and Asp724). The catalytic nucleophile and acid/base residue types are
        retained.
    - reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
      supporting_text: PC has a distinct 28-residue N-terminus followed by a 771-residue sequence identical
        to PB residues 178–948.
    - reference_id: PMID:33261081
      supporting_text: Thus, all human GBA2 isoforms were expressed but only isoform 1 clearly hydrolyzed
        the MUG substrate.
