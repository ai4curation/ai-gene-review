- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: ISS
  original_reference_id: PMID:22758915
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q15126
  review:
    summary: >-
      FlyBase ISS placing Pmvk in the peroxisome by similarity to human PMVK, citing a homology
      inventory of predicted fly peroxisomal proteins. Pmvk's localisation was not tested in that
      study, the donor's peroxisomal localisation was later refuted, and the fly protein has no
      peroxisomal targeting signal.
    action: REMOVE
    reason: >-
      Under the root-organelle policy (projects/ORGANELLES.md, rule 3) this is a synthesis row, so
      its source was examined. Faust et al. built their list by BLAST from human proteins recorded
      as peroxisomal in UniProt (PMID:22758915) and did not test Pmvk. The donor claim does not
      hold: human PMVK is exclusively cytosolic by fractionation, digitonin permeabilisation and
      immunofluorescence (PMID:14729858), carries a curated NOT-peroxisome annotation, and its
      UniProt entry now records the peroxisomal assignment as superseded. On the target, fly Pmvk
      ends in ...LDRLQLQYR with no PTS1, and Drosophila appears to import matrix proteins only
      through PTS1 (PMID:22758915), so there is no route into the organelle. The organelle claim
      is unsupported for this gene; it is an over-propagated localisation rather than an assay
      limit, so the row is removed and no peroxisomal sub-compartment is proposed.
    supported_by:
    - reference_id: PMID:14729858
      supporting_text: No indication of a peroxisomal localization was obtained.
    - reference_id: file:human/PMVK/PMVK-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Was originally thought to be located in the peroxisome
    - reference_id: PMID:22758915
      supporting_text: Similar to Caenorhabditis elegans, Drosophila appears to only utilize the peroxisome
        targeting signal type 1 system for matrix protein import.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
