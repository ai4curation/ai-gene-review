id: Q9VIT2
gene_symbol: Pmvk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Pmvk (CG10268) encodes the Drosophila phosphomevalonate kinase, a 189-residue member of the
  animal-type phosphomevalonate kinase family. These enzymes have a P-loop
  nucleoside-monophosphate-kinase fold, unrelated to the GHMP-type phosphomevalonate kinases of fungi, plants
  and some prokaryotes, and catalyse the ATP-dependent phosphorylation of (R)-mevalonate
  5-phosphate to (R)-mevalonate 5-diphosphate, the second phosphorylation in the mevalonate
  pathway to isopentenyl diphosphate. The fly enzyme has not been characterised
  biochemically; its activity is inferred from close similarity to human PMVK, whose ATP- and
  substrate-binding residues it conserves. In insects the mevalonate pathway lacks the sterol
  branch: Drosophila cannot synthesise sterols and obtains them from the diet, so the pathway
  supplies non-sterol isoprenoids such as juvenile hormone precursors, prenyl groups for
  protein prenylation, dolichol and ubiquinone side chains. Pmvk has no peroxisomal targeting
  signal and, like its human ortholog, is expected to act in the cytosol. A preprint reports
  that Pmvk and other mevalonate pathway enzymes are needed for developmental axon regrowth of
  mushroom body neurons.
