        comment: Human PMVK was once reported peroxisomal but is cytosolic (PMID:14729858) and
          carries a NOT-peroxisome IDA; the transfer copies a refuted localisation to a fly
          protein that also lacks a PTS1.
    source_defects:
    - defect_type: WRONG_TERM
      resource: FLYBASE
      requested_change: DELETE_ROW
      asserted_value: GO:0005777
      confidence: PROBABLE
      explanation: >-
        FlyBase ISS (with UniProtKB:Q15126, reference PMID:22758915) places Pmvk in the
        peroxisome. PMID:22758915 is a BLAST inventory of fly homologs of human proteins listed
        as peroxisomal and did not test Pmvk. The donor's peroxisomal localisation was refuted
