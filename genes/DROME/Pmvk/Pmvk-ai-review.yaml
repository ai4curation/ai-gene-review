- term:
    id: GO:0006695
    label: cholesterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915853
  - PANTHER:PTN000991923
  - UniProtKB:Q15126
  review:
    summary: >-
      PAINT cholesterol-biosynthesis inference from the PTHR13101 root node, seeded by mouse and
      human PMVK. Drosophila cannot synthesise sterols, so the process does not exist in this
      organism.
    action: REMOVE
    reason: >-
      The fly genome lacks enzymes of the sterol branch (PMID:14960281), Drosophila is a sterol
      auxotroph that takes sterols from its diet (PMID:20940226), and the insect mevalonate pathway
      has no sterol branch (PMID:15355237). The IBD at PTN000991923 is right for vertebrates but
      the node is the family root, so it reaches insects; no IRD or IKR blocks it
      (`just paint-losses DROME Pmvk`). This is a lineage mismatch at the node, not a failure of
      the enzyme's activity, which is accepted above. The PTHR13101 family review lists GO:0006695
      only as a node assessment (SOUND, from the human member), not as a term assessment scoped to
      the subfamily, so this REMOVE is a finding for that node rather than a member exception.
      Comparator: in QuickGO (taxon 7227, exact), GO:0006695 is carried only by Pmvk, Mvk (IBA via
      PTHR43290 PTN000825262) and Mvd (UniPathway IEA), and not by fly Hmgcr, so the term on fly
      mevalonate enzymes is a propagation artefact rather than fly curation.
    supported_by:
    - reference_id: PMID:14960281
      supporting_text: we found that the fly genome lacks several enzymes required for cholesterol biosynthesis
    - reference_id: PMID:20940226
      supporting_text: Drosophila cannot synthesize sterols, but do require them for development.
    - reference_id: PMID:15355237
      supporting_text: The mevalonate pathway in insects has two important peculiarities, the absence
        of the sterol branch and the synthesis of juvenile hormone (JH)
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000991923
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cholesterol biosynthesis holds for the vertebrate seeds but not for insects, which
          lack the sterol branch; the IBD sits at the family root with no loss on the insect
          lineage.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      requested_change: CHECK
      asserted_value: GO:0006695
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        PAINT IBD of GO:0006695 cholesterol biosynthetic process at PTHR13101 root node
        PTN000991923 (seeds MGI:1915853, UniProtKB:Q15126) propagates to Drosophila Pmvk.
        Drosophila and other insects cannot synthesise sterols (PMID:20940226, PMID:14960281,
        PMID:15355237). Either move the IBD to a vertebrate node or add an IRD/IKR for GO:0006695
        at the arthropod or insect node. The same pattern affects fly Mvk through PTHR43290 node
        PTN000825262 (taxon Eumetazoa). Based on the abstracts of the cited papers, whose sterol
        auxotrophy statements are explicit.
