id: Q09147
gene_symbol: btl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Breathless (Btl) is one of the two Drosophila fibroblast growth factor receptors (FGFR2
  homolog), a single-pass type I transmembrane receptor tyrosine kinase with five extracellular Ig-like
  domains and a cytoplasmic split tyrosine kinase domain. Its ligand is the FGF Branchless (Bnl). Bnl
  binding at the plasma membrane and on cytonemes activates Btl, which phosphorylates and signals through
  the FGFR-specific adaptor Dof/Stumps/Heartbroken, recruiting Corkscrew (SHP2), Src64B and Ras to activate
  the MAPK cascade. Btl is expressed in the developing tracheal system, midline glia and several other
  cell types. Its best-defined role is in tracheal (respiratory) system morphogenesis: Btl activity directs
  chemotactic migration of tracheal epithelial cells toward Bnl sources to form primary branches, selects
  tip cells, and, in a dose-dependent way, specifies secondary and terminal branch cell fates. It also
  drives filopodial activity, larval terminal branching and adult air sac formation. In other contexts
  Btl contributes to midline and retinal glial migration, border cell migration in the ovary, eye disc
  morphogenesis, axon retraction in the adult brain, and maintenance of lymph gland blood progenitors.'
