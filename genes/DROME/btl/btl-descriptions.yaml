- source: Alliance_Automated
  text: Enables fibroblast growth factor receptor activity. Involved in several processes,
    including border follicle cell migration; negative regulation of cell differentiation;
    and open tracheal system development. Located in plasma membrane. Colocalizes
    with cytoneme. Is expressed in several structures, including abdominal tracheal
    metamere; imaginal disc; primary segmental tracheal branch primordium; tracheal
    section; and tracheal system. Human ortholog(s) of this gene implicated in several
    diseases, including bone disease (multiple); carcinoma (multiple); hematologic
    cancer (multiple); hypogonadotropic hypogonadism (multiple); and skin disease
    (multiple). Orthologous to several human genes including FGFR1 (fibroblast growth
    factor receptor 1); FGFR2 (fibroblast growth factor receptor 2); and FGFR3 (fibroblast
    growth factor receptor 3).
