core_functions:
- description: 'Hedgehog co-receptor: Ihog (redundantly with Boi) binds Patched directly, is needed to
    present Patched at the cell surface, and together with Patched forms the high-affinity Hedgehog receptor
    whose ligand binding relieves Smoothened inhibition.'
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0035230
    label: cytoneme
  supported_by:
  - reference_id: file:DROME/ihog/ihog-deep-research-falcon.md
    supporting_text: Ihog is an extracellular Hh co-receptor rather than an enzyme; FN1 captures Hh, while
      FN2 probably engages Ptc or another receptor-complex component.
  - reference_id: PMID:20048000
    supporting_text: On the basis of their joint roles in ligand binding, signal transduction, and receptor
      trafficking, we conclude that Ihog and Ptc together constitute the Drosophila Hh receptor.
- description: Heparin-dependent binding of Hedgehog through the first FNIII repeat; heparin induces Ihog
    dimerization and is required for high-affinity Hh binding.
  molecular_function:
    id: GO:0097108
    label: hedgehog family protein binding
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17077139
    supporting_text: Here, we show that heparin binding induces Ihog dimerization and is required to mediate
      high-affinity interactions between Ihog and Hh.
suggested_questions:
- question: Do Ihog and Boi act purely as ligand-binding co-receptors that help Hh inhibit Ptc, or do
    they also contribute directly to Ptc trafficking/cholesterol-transport activity?
suggested_experiments:
- description: Reconstitute purified Ptc with Ihog or Boi in proteoliposomes and measure Hh binding affinity
    and Ptc sterol-transport activity with and without Hh, to separate co-receptor binding from effects
    on Ptc activity.
