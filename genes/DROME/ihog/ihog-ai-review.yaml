gene_symbol: ihog
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Interference hedgehog (Ihog) is a single-pass type I transmembrane protein of the immunoglobulin
  superfamily, with immunoglobulin and fibronectin type III (FNIII) repeats in its ectodomain, belonging
  to the conserved Ihog/CDO/BOC family. Ihog and its paralog Brother of ihog (Boi) act as partially redundant
  Hedgehog co-receptors: the first FNIII repeat binds the N-terminal Hedgehog signaling domain in a heparin-dependent
  manner, heparin induces Ihog dimerization, and Ihog binds Patched directly, is required for presentation
  of Patched at the cell surface, and together with Patched forms the high-affinity Hedgehog receptor.
  Cells lacking both Ihog and Boi cannot respond to Hedgehog, so the paralogs are jointly essential for
  Hedgehog pathway activation in embryos, wing and eye discs. Ihog is at the plasma membrane, including
  basal cytonemes along which Hedgehog moves, helps retain Hedgehog on the cell surface, and independently
  mediates calcium-independent trans-homophilic cell-cell interactions that contribute to cell segregation
  in the wing disc.'
