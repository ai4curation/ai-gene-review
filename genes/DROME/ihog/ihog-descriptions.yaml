    - rubric: specificity
      score: 4
    overall_notes: 'Correct: Hh co-receptor at the level of Ptc, interacting with
      Disp, Dlp, Dally and Shf; imaginal and cuticle patterning. Boi redundancy not
      mentioned.'
- source: Alliance_Automated
  text: Enables several functions, including coreceptor activity; hedgehog family
    protein binding activity; and heparin binding activity. Involved in several processes,
    including maintenance of protein location in extracellular region; regionalization;
    and smoothened signaling pathway. Located in cell surface; cytoneme; and plasma
    membrane. Is expressed in several structures, including dorsal epidermis primordium;
    embryonic anal pad; embryonic dorsal epidermis; embryonic epipharynx; and imaginal
    disc. Human ortholog(s) of this gene implicated in holoprosencephaly 11. Orthologous
    to human BOC (BOC cell adhesion associated, oncogene regulated) and CDON (cell
    adhesion associated, oncogene regulated).
  source_type: automated
