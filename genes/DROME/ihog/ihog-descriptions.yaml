- source: Alliance_Imported
  text: interference hedgehog (ihog) encodes a type 1 membrane protein that acts as
    a co-receptor for the product of hh upstream or at the level of the receptor encoded
    by ptc. It interacts with the products of disp, dlp, dally and shf. It is involved
    in imaginal pattern formation and embryonic cuticle pattern formation.
  source_type: curated
  url: https://flybase.org/reports/ihog.html
  source_id: FB:FBgn0031872
