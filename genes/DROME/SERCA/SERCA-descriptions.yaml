- source: Alliance_Automated
  text: Enables P-type calcium transporter activity. Involved in several processes,
    including calcium ion transport from cytosol to endoplasmic reticulum; intestinal
    stem cell homeostasis; and stabilization of membrane potential. Located in sarcoplasmic
    reticulum membrane. Is active in sarcoplasmic reticulum. Is expressed in several
    structures, including adult central nervous system; embryonic/larval midgut primordium;
    germline cell; gut section; and muscle cell. Used to study Brody myopathy and
    heart disease. Human ortholog(s) of this gene implicated in hypertension (multiple);
    keratosis (multiple); and muscular disease (multiple). Orthologous to human ATP2A1
    (ATPase sarcoplasmic/endoplasmic reticulum Ca2+ transporting 1); ATP2A2 (ATPase
    sarcoplasmic/endoplasmic reticulum Ca2+ transporting 2); and ATP2A3 (ATPase sarcoplasmic/endoplasmic
    reticulum Ca2+ transporting 3).
  source_type: automated
