    - reference_id: PMID:28399403
      supporting_text: The thermogenic phenotypes in THADA knockout flies are relatively mild, perhaps
        reflecting the ectothermic nature of flies.
core_functions:
- description: P-type (P2A) Ca2+-ATPase of the ER and SR membrane that couples ATP hydrolysis to pumping
    Ca2+ from the cytosol into the ER/SR lumen, clearing cytosolic Ca2+ and filling intracellular Ca2+
    stores; regulated by SclA/SclB, Seipin and THADA.
  molecular_function:
    id: GO:0005388
    label: P-type calcium transporter activity
  directly_involved_in:
  - id: GO:1903515
    label: calcium ion transport from cytosol to endoplasmic reticulum
  - id: GO:0006874
    label: intracellular calcium ion homeostasis
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0033017
    label: sarcoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:24807223
    supporting_text: SERCA, an endoplasmic reticulum (ER) calcium pump, is solely responsible for transporting
      cytosolic calcium into the ER lumen.
  - reference_id: PMID:28399403
    supporting_text: An SERCA activity assay that quantifies Ca2+-dependent ATP hydrolysis (Gehrig et
      al., 2012) revealed that loss of THADA leads to significantly elevated calcium-dependent SERCA activity
      both in flies
  - reference_id: file:DROME/SERCA/SERCA-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=Ca(2+)(in) + ATP + H2O = Ca(2+)(out) + ADP + phosphate + H(+);
  - reference_id: file:DROME/SERCA/SERCA-uniprot.txt
    supporting_text: Endoplasmic reticulum membrane
suggested_questions:
- question: Does the GO_REF:0000108 rule that infers located_in synapse from neuromuscular synaptic transmission
    need an exclusion for integral ER/SR membrane proteins such as SERCA?
- question: Does PMID:16899722 contain electrophysiological evidence that justifies stabilization of membrane
    potential (GO:0030322) for SERCA, or should the row be re-termed?
- question: How do the SERCA regulators SclA/SclB, Seipin and THADA differ in mechanism (inhibition of
    Ca2+ affinity versus uncoupling), and are they tissue-restricted?
suggested_experiments:
- description: Measure Ca2+ transport and ATP hydrolysis stoichiometry of purified or microsomal Drosophila
    SERCA with and without THADA, SclA/SclB or Seipin to distinguish inhibition from uncoupling, and test
    heat production in SERCA hypomorphs by microcalorimetry.
  experiment_type: biochemical assay
- description: Localise endogenously tagged SERCA at the larval NMJ and photoreceptor terminals with presynaptic
    ER markers to establish whether a presynaptic ER pool exists.
  experiment_type: imaging
