  review:
    action: KEEP_AS_NON_CORE
    summary: Uncoupled SERCA ATP hydrolysis is a recognised source of heat; in flies the evidence is via
      THADA, an uncoupler whose loss reduces heat production, and SERCA knockdown rescues THADA-mutant
      obesity.
    reason: SERCA itself performs the heat-generating futile hydrolysis, so it does work in thermogenesis;
