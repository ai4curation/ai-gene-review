id: P22700
gene_symbol: SERCA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SERCA (Ca-P60A, CG3725) is the single sarco/endoplasmic reticulum Ca2+-ATPase of Drosophila
  melanogaster, a P2A-type P-type ATPase with ten transmembrane helices, cytoplasmic actuator, phosphorylation
  (catalytic Asp351) and nucleotide-binding domains. It couples ATP hydrolysis to the transport of Ca2+
  from the cytosol into the lumen of the endoplasmic reticulum and, in muscle, the sarcoplasmic reticulum,
  thereby lowering cytosolic Ca2+ and filling the intracellular Ca2+ stores released through ryanodine
  and InsP3 receptors. Its activity is tuned by binding partners including the sarcolamban micropeptides
  SclA/SclB in muscle, Seipin in fat body and THADA, which acts as an uncoupler. Through store filling
  and Ca2+ clearance SERCA is required for muscle relaxation and cardiac function, neurotransmitter release
  at neuromuscular and photoreceptor synapses, fat storage and organismal energy balance, and ER-dependent
  maturation of the Notch receptor; null loss is lethal.
