id: A8DZ15
gene_symbol: CG34171
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG34171 (SPH244, FlyBase FBgn0085200) encodes a serine protease homolog of the S1A (chymotrypsin-like)
  family in Drosophila melanogaster. This entry, A8DZ15, is the 292-residue CG34171-PB product. It has
  an N-terminal signal peptide (residues 1-16), a single complete trypsin-like S1 domain (residues
  38-265) with no clip or other accessory module, and a strongly hydrophobic C-terminal segment
  (residues 274-292). The domain keeps the histidine (H72) and aspartate (D124) positions of the
  catalytic triad, but phenylalanine (F222) replaces the catalytic serine, so the protein is not
  expected to hydrolyse peptide bonds. The second product of the gene, CG34171-PC (X2JEK1), shares the
  first 167 residues and then ends after half of the S1 domain. In PANTHER 19.0 CG34171 belongs to
  subfamily PTHR24260:SF136, together with twelve other fly S1 proteins. Most of them have also lost
  catalytic residues. The one subfamily member with a known function, the multidomain Toll-pathway
  protease modSP, is only distantly related. The signal peptide points to the secretory pathway, but
  the C-terminal hydrophobic tail leaves open whether the mature protein is released or anchored at
  the cell surface. Transcripts are mildly enriched in testis and are detected in Malpighian tubule.
  No biochemical, genetic, localization or interaction study of CG34171 has been published, and its
  molecular and biological roles are unknown.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IKR
  original_reference_id: PMID:30367934
  qualifier: enables
  negated: true
  review:
    summary: >-
      Correct NOT annotation. In CG34171-PB the S1 domain is complete, but phenylalanine (F222)
      sits at the catalytic-serine position, so the His-Asp-Ser triad is broken.
    action: ACCEPT
    reason: >-
      Cao and Jiang (2018) divided insect SP-related sequences into proteases and noncatalytic homologs
      by whether they keep the His-Asp-Ser triad, and listed CG34171 as SPH244. FlyBase files the gene
      among the S1A non-peptidase homologs. Two independent alignments of A8DZ15 against active bovine
      trypsin (P00760) put F222 in the trypsin S200 column, with H72 and D124 at the His and Asp
      columns. A serine endopeptidase uses the serine as its nucleophile, so its replacement by
      phenylalanine rules out canonical activity. This is a sequence-based negative, not a failed
      enzyme assay, but it is the strongest claim the evidence supports. It agrees with the NOT
      peptidase activity row and with the same NOT annotation on the PC product (X2JEK1).
    supported_by:
    - reference_id: PMID:30367934
      supporting_text: based on the presence or absence of the His-Asp-Ser catalytic triad
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: A8DZ15 has H72 and D124 at the His and Asp columns and F222 at the Ser column,
        so its catalytic triad is not intact.
    - reference_id: file:DROME/CG34171/CG34171-bioinformatics/RESULTS.md
      supporting_text: A8DZ15 has F222 at the serine-equivalent position.
    - reference_id: file:DROME/CG34171/CG34171-flybase.txt
      supporting_text: Serine protease homologs of the S1A family are similar in amino acid sequence to
        S1A serine proteases but are enzymatically inactive due to the lack of catalytic residue(s).
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0030926
  - FB:FBgn0033033
  - FB:FBgn0051217
  - PANTHER:PTN000667087
  - UniProtKB:A0A1S4GMJ4
  - UniProtKB:A0A1S4H5S2
  - WB:WBGene00006623
  review:
    summary: >-
      Plausible location. The PAINT node assigns extracellular region to the family, and A8DZ15
      itself has a predicted N-terminal signal peptide. Whether the mature protein is released or
      held at the cell surface by its hydrophobic C-terminal tail is unknown.
    action: ACCEPT
    reason: >-
      The IBA was placed at the Ecdysozoa-level node PTN000667087. Its seeds are secreted S1 proteins
      with direct localization evidence: psh, scaf, modSP (the only seed in CG34171's PANTHER 19.0
      subfamily, SF136), two mosquito CLIPs and a nematode protein. Losing the catalytic serine does
      not change a protein's trafficking, and the SignalP signal peptide (1-16) on this accession
      independently supports entry into the secretory pathway. One caveat: residues 274-292 form a
      hydrophobic C-terminal segment that could be a GPI-attachment signal or a membrane anchor, so
      the protein might stay attached to the outer face of the plasma membrane. That would still place
      its noncatalytic S1 domain outside the cell. No localization experiment exists, and GOA carries
      no more specific term, so the inherited term is accepted as the best-supported location.
    supported_by:
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-uniprot.txt
      supporting_text: FT   SIGNAL          1..16
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: A hydrophobic C-terminal tail after a signal peptide fits either a GPI-anchor
        attachment signal or a C-terminal membrane anchor.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: >-
      Automatic mapping from the trypsin-domain signature. It assumes catalytic peptide-bond
      hydrolysis, which this product lacks, and no data place CG34171 in a proteolytic process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IPR001254 to GO:0006508 mapping assumes that any trypsin-domain protein cleaves peptide
      bonds. That assumption fails for A8DZ15, which has phenylalanine at the catalytic-serine
      position. The accepted NOT peptidase activity and NOT serine-type endopeptidase activity rows
      record the same defect. Some insect serine protease homologs do take part in protease
      cascades as noncatalytic cofactors, so participation is not impossible. But no cascade,
      partner protease or substrate has been linked to CG34171. PAINT also gave this gene no
      proteolysis IBA, only extracellular region and innate immune response from PTN000667087.
      The term is kept as an over-annotation rather than removed, because a cofactor role has not
      been ruled out. This matches the action on the same row for the PC product (X2JEK1).
    supported_by:
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: A8DZ15 has H72 and D124 at the His and Asp columns and F222 at the Ser column,
        so its catalytic triad is not intact.
    - reference_id: PMID:30367934
      supporting_text: SPHs are enzymatically inactive due to the lack of catalytic residue(s) but some of
        them (e.g. Masquerade) have known regulatory functions
- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IKR
  original_reference_id: GO_REF:0000047
  qualifier: enables
  supporting_entities:
  - MEROPS:S01.UNA
  negated: true
  review:
    summary: >-
      Correct NOT annotation. MEROPS classes the protein as an unassigned S1 non-peptidase homolog
      (S01.UNA), and the catalytic serine is replaced by phenylalanine.
    action: ACCEPT
    reason: >-
      The key-residue inference rests on the same defect as the NOT serine-type endopeptidase row:
      F222 at the catalytic-serine position of an otherwise complete S1 domain. No other peptidase
      class is plausible for a trypsin-fold protein, so NOT peptidase activity is a fair
      generalisation of the triad loss. FlyBase lists the gene among the S1A non-peptidase homologs.
    supported_by:
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: A8DZ15 has H72 and D124 at the His and Asp columns and F222 at the Ser column,
        so its catalytic triad is not intact.
    - reference_id: file:DROME/CG34171/CG34171-flybase.txt
      supporting_text: Serine protease homologs of the S1A family are similar in amino acid sequence to
        S1A serine proteases but are enzymatically inactive due to the lack of catalytic residue(s).
- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0027930
  - FB:FBgn0030051
  - FB:FBgn0030926
  - FB:FBgn0039102
  - FB:FBgn0039494
  - FB:FBgn0051217
  - FB:FBgn0052382
  - FB:FBgn0052383
  - PANTHER:PTN000667087
  - UniProtKB:A0A1S4H5S2
  review:
    summary: >-
      Inherited from the deep (Ecdysozoa-level) PAINT node PTN000667087, whose seeds are immune
      cascade proteases and one mosquito serine protease homolog. No immune evidence exists for
      CG34171 itself. Kept as a non-core, phylogenetically inferred process.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT curator placed innate immune response at PTN000667087 from eight Drosophila seeds
      (psh, MP1, spirit, SPE, grass, modSP, sphinx1, sphinx2) and Anopheles CLIPA8 (A0A1S4H5S2), a
      noncatalytic CLIP homolog. Because a noncatalytic homolog is among the seeds, the loss of
      CG34171's catalytic serine is not by itself evidence that the immune function was lost. In
      PANTHER 19.0, only modSP shares CG34171's subfamily (SF136), at 23% identity and with a
      different domain architecture (LDLa and Sushi modules that CG34171 lacks). The node is
      therefore an inference across distantly related proteins, not a transfer from a close
      relative. No infection, expression-induction, RNAi or interaction data link CG34171 to
      immunity. The gene's known expression (mild testis enrichment, Malpighian tubule transcripts)
      neither supports nor excludes an immune role. Without target-specific evidence of loss, the
      node judgement is not overturned, but it is kept as non-core. The specific Toll-initiating role
      of modSP is not transferred.
    supported_by:
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: Of the FlyBase seeds that PAINT used at PTN000667087, only modSP is in SF136.
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: modSP's specific role as a Toll-pathway initiator protease is therefore not transferred.
    - reference_id: file:DROME/CG34171/CG34171-deep-research-falcon.md
      supporting_text: No CG34171-specific loss-of-function, gain-of-function, RNAi, infection, developmental,
        or biochemical phenotype was found.
