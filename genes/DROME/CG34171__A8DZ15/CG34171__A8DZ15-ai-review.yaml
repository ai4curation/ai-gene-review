core_functions:
- description: >-
    Noncatalytic S1A serine protease homolog with a signal peptide that routes it into the secretory
    pathway. Its single trypsin-like domain has phenylalanine in place of the catalytic serine. No
    molecular activity, partner or biological process has been established for it.
  supported_by:
  - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
    supporting_text: A8DZ15 has H72 and D124 at the His and Asp columns and F222 at the Ser column,
      so its catalytic triad is not intact.
  - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-uniprot.txt
    supporting_text: FT   SIGNAL          1..16
  locations:
  - id: GO:0005576
    label: extracellular region
  knowledge_gaps:
  - gap_statement: >-
      The molecular role of the noncatalytic S1 domain of CG34171 is unknown. It could be a cofactor or
      regulator of a catalytic serine protease, a substrate-binding decoy, or have no protease-related
      role. No partner protease, ligand or substrate has been identified.
    boundary: >-
      Established: the catalytic serine is replaced by phenylalanine (sequence-based), and there is a
      predicted signal peptide. PANTHER places the gene in an S1 subfamily that is mostly noncatalytic.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: file:DROME/CG34171/CG34171-deep-research-falcon.md
      supporting_text: No CG34171-specific loss-of-function, gain-of-function, RNAi, infection, developmental,
        or biochemical phenotype was found.
    resolution: Affinity purification from tissue or hemolymph to identify partners, and assays of
      whether CG34171 changes the activity of candidate S1 proteases.
  - gap_statement: >-
      Whether mature CG34171-PB is released or anchored at the cell surface by its hydrophobic
      C-terminal segment (residues 274-292) is unknown, as are the tissues where the protein is made.
    boundary: >-
      Established: a predicted N-terminal signal peptide and a hydrophobic C-terminal tail. Transcripts
      are mildly testis-enriched and detected in Malpighian tubule.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
    provenance:
    - reference_id: file:DROME/CG34171__A8DZ15/CG34171__A8DZ15-bioinformatics/RESULTS.md
      supporting_text: This analysis does not decide between these, so the protein's final location (secreted
        versus cell-surface anchored) is unresolved.
    resolution: An epitope-tagged knock-in with phosphatidylinositol-specific phospholipase C release
      tests and imaging of testis and Malpighian tubule.
suggested_questions:
- question: >-
    PANTHER placements for CG34171 disagree. The PANTHER 19.0 fly HMM file places A8DZ15 in
    PTHR24260:SF136, UniProt cross-references PTHR24276:SF96, and the GOA IBA rows come from PTHR24256
    node PTN000667087. Which placement do PAINT curators intend, and does the innate immune response IBA
    hold once the tree is reconciled?
- question: >-
    Is the C-terminal hydrophobic segment of CG34171-PB (FIADRFSLFSFIILMLSIV) a GPI-attachment signal,
    making the protein a cell-surface serine protease homolog?
- question: >-
    Are both CG34171 products (PB/A8DZ15 and the truncated PC/X2JEK1) translated in vivo, and in which
    tissues?
suggested_experiments:
- description: >-
    Make an endogenous epitope-tagged CG34171 knock-in. Use it to find where PB is expressed (testis,
    Malpighian tubule) and whether it is secreted, GPI-anchored (released by PI-PLC) or membrane-bound.
  experiment_type: localization
- description: >-
    Generate a null allele and test immune readouts (Toll-dependent Drosomycin induction, melanization,
    survival after Gram-positive or fungal infection) and male fertility. This would test the inherited
    innate immune IBA directly.
  experiment_type: genetic loss of function
