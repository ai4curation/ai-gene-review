    overall_notes: Generic SCAD text asserting C4-C6 specificity. The review says
      this specificity rests on rule-based inference and that the paralog Arc42, not
      CG4860, gives the SCAD-deficiency profile in flies.
- source: Alliance_Automated
  text: Predicted to enable short-chain fatty acyl-CoA dehydrogenase activity. Predicted
    to be involved in butyrate catabolic process and fatty acid beta-oxidation using
    acyl-CoA dehydrogenase. Predicted to be active in mitochondrion. Is expressed
    in embryonic/larval oenocyte. Human ortholog(s) of this gene implicated in alcohol
    use disorder and short chain acyl-CoA dehydrogenase deficiency. Orthologous to
    human ACADS (acyl-CoA dehydrogenase short chain).
