  title: 'Temporally restricted expression of transcription factor betaFTZ-F1: significance for embryogenesis,
    molting and metamorphosis in Drosophila melanogaster.'
  findings:
  - statement: The developmental betaFTZ-F1 isoform localizes to nuclei.
    supporting_text: 'We found that an isoform of FTZ-F1, betaFTZ-F1, is

      expressed in the nuclei of almost all tissues slightly before the first and

      second larval ecdysis and before pupation.'
