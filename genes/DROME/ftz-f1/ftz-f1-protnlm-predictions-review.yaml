description: 'The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for M9NFK2.
  DNA-binding transcription factor activity, RNA polymerase II-specific (GO:0000981), and nucleus (GO:0005634)
  are supported omission candidates: primary FTZ-F1 DNA-binding/reporter experiments and betaFTZ-F1 nuclear
  localization complement exact sequence identity to reviewed P33244-2 and retention of the shared DNA-binding
  domain. This does not transfer every expression pattern of the longer isoform or establish the historical
  predictor input. Nuclear-receptor family membership alone does not establish ligand-regulated transcription.
  The separate FUNCTION paragraph supports broad transcriptional regulation but has a PLI judgment for
  high-affinity thyroid-hormone receptor specificity. This completed record assesses the absence of GO
  output; predictions is empty because no GO or EC prediction was emitted. The narrative judgments remain
  in the linked function review and are not scores assigned to the omission.'
