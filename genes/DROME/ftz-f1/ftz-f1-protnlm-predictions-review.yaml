- id: PMID:2113881
  title: A sequence-specific DNA-binding protein that activates fushi tarazu segmentation gene expression.
  findings:
  - statement: Purified FTZ-F1 recognizes specific regulatory DNA.
    supporting_text: 'We have purified to homogeneity a sequence-specific DNA-binding

      factor, FTZ-F1, that binds to two sites located within the zebra element and to

      two sites within the ftz protein-coding sequence.'
  - statement: Recognition-site mutations impair both binding and reporter expression.
    supporting_text: 'the

      binding to FTZ-F1 is disrupted in vitro, and the intensity of lacZ expression is

      reduced in transformed embryos'
