  review:
    summary: Beta FTZ-F1 participates in the intracellular ecdysone-response pathway.
    action: ACCEPT
    reason: The term describes a signaling pathway initiated by an intracellular ligand-receptor interaction;
      a participant need not itself bind the initiating hormone. BetaFTZ-F1 supplies competence for the
      ecdysone-induced transcriptional cascade and controls its stage-specific response (PMID:7954827).
      Its downstream role supports pathway participation without implying that FTZ-F1 is an ecdysone or
      thyroid-hormone binding receptor.
