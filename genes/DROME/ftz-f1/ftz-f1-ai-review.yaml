  review:
    summary: Nuclear-receptor family membership is established; ligand-regulated transcription is not
      established.
    action: MODIFY
    reason: QuickGO defines GO:0004879 as DNA-binding transcription factor activity regulated by ligand
      binding. FTZ-F1 has well-supported transcriptional activity in the absence of added ligand, and
      its crystal structure contains an intramolecular helix in the canonical pocket (PMID:21775434).
      Solution NMR and lipid-binding experiments demonstrate a dynamic pocket and phospholipid binding
      (PMID:29547262), so an absolute inability to bind ligands would be incorrect. However, these findings
      do not demonstrate ligand-dependent transcriptional regulation. The experimentally established RNA
      polymerase II transcription factor activity is the appropriate supported assignment; family terminology
      alone does not meet the GO definition.
    supported_by:
    - reference_id: PMID:21775434
      supporting_text: the ligand-binding pocket of the FTZ-F1 LBD is completely occupied by helix 6 (H6)
        of the receptor
    - reference_id: PMID:29547262
      supporting_text: Indeed, we show that the Ftz-F1 LBD can bind phospholipids, not unlike its orthologs.
    - *id001
    proposed_replacement_terms:
