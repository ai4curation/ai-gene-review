id: M9NFK2
gene_symbol: ftz-f1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: FTZ-F1 is an NR5A-family nuclear transcription factor that recognizes specific DNA elements
  and controls developmental gene expression in Drosophila. Alternative N-terminal isoforms share the
  DNA-binding and C-terminal regulatory domains. The beta developmental product represented by M9NFK2
  provides temporal competence for ecdysone-responsive transcription during molting and metamorphosis
  and participates in feedback regulation of its expression. FTZ-F1 can activate transcription without
  an added small-molecule ligand; its regulatory domain binds the Ftz cofactor and has a dynamic pocket
  capable of phospholipid binding in vitro.
