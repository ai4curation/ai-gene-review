    overall_notes: Generic PLC sentence plus essential phototransduction role, then
      a long passage on hh-dependent Duox gut immunity via Cad99C. Gives a peripheral
      role equal weight and omits INAD anchoring and Gq GAP activity.
- source: Alliance_Automated
  text: Enables GTPase activator activity and phosphatidylinositol-4,5-bisphosphate
    phospholipase C activity. Involved in several processes, including entrainment
    of circadian clock by photoperiod; negative regulation of compound eye retinal
    cell programmed cell death; and phospholipase C-activating opsin-mediated signaling
    pathway. Located in rhabdomere. Part of inaD signaling complex. Is expressed in
    several structures, including Bolwig nerve; brain; light-sensitive neurons; organism
    subdivision; and photoreceptor. Used to study retinal degeneration and retinal
    disease. Orthologous to human PLCB4 (phospholipase C beta 4).
  source_type: automated
