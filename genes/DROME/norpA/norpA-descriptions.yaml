descriptions:
- source: UniProt
  text: The production of the second messenger molecules diacylglycerol (DAG) and
    inositol 1,4,5-trisphosphate (IP3) is mediated by activated phosphatidylinositol-specific
    phospholipase C enzymes (By similarity). Essential component of the phototransduction
    pathway (PubMed:2457447). Essential downstream component of a hh-signaling pathway
    which regulates the Duox-dependent gut immune response to bacterial uracil; required
    for the activation of Cad99C and consequently Cad99C-dependent endosome formation,
    which is essential for the Duox-dependent production of reactive oxygen species
    (ROS) in response to intestinal bacterial infection (PubMed:25639794).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13217
  source_id: P13217
