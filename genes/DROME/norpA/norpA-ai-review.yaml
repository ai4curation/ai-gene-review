suggested_questions:
- question: Which norpA isoform (A/B or C/D) mediates the non-visual roles in gut epithelium, Malpighian
    tubule, gustatory and thermosensory neurons, and do these pools assemble with an INAD-like scaffold?
- question: Is NORPA in photoreceptor axon terminals catalytically engaged during synaptic transmission,
    and is it coupled to Gq there in the absence of rhodopsin?
- question: Does the INAD PDZ5 interaction with the NORPA G-box homology region regulate GAP activity
    toward Gq-alpha independently of PLC catalysis?
suggested_experiments:
- hypothesis: Presynaptic NORPA PLC activity contributes to neurotransmitter release from photoreceptor
    terminals.
  description: Express a catalytically dead NORPA (X/Y-box active-site mutant) or wild-type NORPA specifically
    in photoreceptors of a norpA null and compare lamina FM dye loading, synaptic Ca2+ imaging and ERG
    on/off transients; use a rhabdomere-restricted versus axon-targeted construct to separate compartments.
  experiment_type: genetic rescue with live imaging
- hypothesis: NORPA directly accelerates GTP hydrolysis by Drosophila Gq-alpha.
  description: Single-turnover GTPase assays with purified Dgq-alpha and recombinant NORPA (wild-type,
    catalytically dead, and C-terminal/G-box mutants), with and without INAD PDZ domains.
  experiment_type: biochemical assay
