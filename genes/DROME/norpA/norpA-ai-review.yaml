id: P13217
gene_symbol: norpA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: norpA (no receptor potential A) encodes the eye-enriched phosphoinositide-specific phospholipase
  C beta (PLCbeta4-like) of Drosophila. It is the effector enzyme of fly phototransduction. Light-activated
  rhodopsin activates Gq, and Gq-alpha stimulates NORPA to hydrolyse phosphatidylinositol 4,5-bisphosphate
  (PIP2) into IP3 and diacylglycerol. The resulting lipid changes open the TRP and TRPL cation channels
  and depolarize the photoreceptor. NORPA is a peripheral membrane protein concentrated in the rhabdomere.
  There it is anchored in the INAD signalplex through direct binding of its C-terminus and an internal
  region to INAD PDZ1 and PDZ5. NORPA also acts as a GTPase-activating protein for the visual Gq-alpha,
  which ensures rapid termination of the light response. Null mutants are blind and undergo light-dependent
  retinal degeneration. Outside the eye, NORPA provides PLCbeta signalling for TRPA1-dependent larval
  thermotaxis and bitter chemical avoidance, for Galphaq-Ca2+-dependent DUOX activation in gut immunity,
  and for neuropeptide-stimulated IP3/Ca2+ signalling in Malpighian tubules. Through eye phototransduction
  it is also one of the light-input routes for circadian clock entrainment.
