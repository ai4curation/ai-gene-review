    supporting_text: Gut-microbe contact rapidly activates PLCbeta through Galphaq, which in turn mobilizes
      intracellular Ca(2+) through inositol 1,4,5-trisphosphate generation for DUOX-dependent ROS production.
  - reference_id: PMID:12547945
    supporting_text: Thus, we describe a role for norpA and itpr in renal epithelia and show that both
