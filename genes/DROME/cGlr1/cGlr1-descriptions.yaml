descriptions:
- source: UniProt
  text: Nucleotidyltransferase that catalyzes the formation of cyclic GMP-AMP (3',2'-cGAMP)
    from ATP and GTP and plays a key role in antiviral innate immunity (PubMed:34261127,
    PubMed:34261128). Synthesizes 3',2'-cGAMP in a two-step reaction through production
    of the linear intermediate pppA(2'-5')pG (PubMed:34261127). Acts as a key sensor
    of double-stranded RNA (dsRNA), the presence of dsRNA in the cytoplasm being a
    danger signal that triggers the immune responses (PubMed:34261127). Directly binds
    dsRNA, activating the nucleotidyltransferase activity, leading to synthesis of
    3',2'-cGAMP, a second messenger that binds to and activates Sting, thereby triggering
    the antiviral immune response via activation of the NF-kappa-B transcription factor
    Rel (Relish) (PubMed:34261127, PubMed:34261128). 3',2'-cGAMP is protected from
    poxin cleavage (PubMed:34261127).
