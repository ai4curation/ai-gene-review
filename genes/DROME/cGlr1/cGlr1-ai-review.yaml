gene_symbol: cGlr1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cyclic GMP-AMP synthase-like receptor 1 (cGLR1) is a cytosolic cGAS-like nucleotidyltransferase
  of the Mab-21 family that functions as a pattern-recognition receptor for long double-stranded RNA.
  On binding dsRNA (longer than about 30 bp), it is allosterically activated to synthesize, from ATP and
  GTP and using Mg2+/Mn2+ as cofactor, the non-canonical cyclic dinucleotide second messenger 3',2'-cGAMP
  (also producing 2',3'-cGAMP and contributing to 2',3'-c-di-GMP synthesis during infection), through
  a two-step reaction via a linear pppA(2'-5')pG intermediate. The resulting cyclic dinucleotides bind
  and activate the innate-immune adaptor STING (dSTING), which signals through the NF-kappaB transcription
  factor Relish to drive an antiviral transcriptional response. cGLR1 is an invertebrate analog of vertebrate
  cGAS in the cGAS-STING antiviral pathway, tuned to sense viral RNA rather than DNA.
