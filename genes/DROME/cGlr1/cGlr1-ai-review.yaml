      contributes to 2',3'-c-di-GMP.
suggested_questions:
- question: What is the endogenous source and structure of the viral dsRNA recognized by cGLR1 during
    natural infection, and how is self versus non-self RNA discriminated?
- question: How is the balance between 3',2'-cGAMP, 2',3'-cGAMP and 2',3'-c-di-GMP outputs regulated,
    and what determines dSTING responsiveness to each?
suggested_experiments:
- description: Structure-guided separation-of-function mutants that uncouple dsRNA binding from catalysis,
    tested for antiviral protection in vivo.
- description: Quantitative CDN metabolomics across a panel of RNA and DNA viruses in cGLR1 versus cGLR2
    single and double mutants to define each receptor's contribution.
