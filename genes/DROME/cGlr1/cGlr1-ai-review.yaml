core_functions:
- description: dsRNA-activated cyclic-dinucleotide (3',2'-cGAMP) synthase that initiates cGAS/STING antiviral
    signalling. cGLR1 binds long viral dsRNA, which allosterically activates its nucleotidyltransferase
    to convert ATP and GTP into the second messenger 3',2'-cGAMP (and 2',3'-cGAMP) in the cytosol.
  supported_by:
