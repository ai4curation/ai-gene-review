descriptions:
- source: Alliance_Imported
  text: Malic enzyme (Men) encodes a dehydrogenase that catalyzes the oxidation of
    malate to pyruvate, with the concomitant reduction of NADP[+] to NADPH. It functions,
    along with the products of Idh, G6pd, and Pgd, in a small network of NADP reducing
    enzymes.
  source_type: curated
