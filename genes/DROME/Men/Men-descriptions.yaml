- source: Alliance_Automated
  text: Enables malate dehydrogenase (decarboxylating) (NADP+) activity. Involved
    in NADPH regeneration; malate metabolic process; and sleep. Is active in cytosol.
    Is expressed in several structures, including adult brain cell body rind; brain;
    embryonic/larval hemocyte; germline cell; and somatic precursor cell. Orthologous
    to several human genes including ME1 (malic enzyme 1).
