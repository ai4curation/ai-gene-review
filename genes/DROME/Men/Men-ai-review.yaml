suggested_questions:
- question: >-
    How do Men and the mitochondrial paralog Men-b divide malate-derived NADPH production between cytosol
    and mitochondria, and do they compensate for each other?
suggested_experiments:
- description: >-
    Measure cytosolic NADPH/NADP+ (genetically encoded sensor) and de novo lipogenesis (13C-acetate) in
    Men null larvae on high-sugar diet.
  hypothesis: >-
    Men is required for full cytosolic NADPH supply to fatty acid synthesis on carbohydrate-rich diets.
