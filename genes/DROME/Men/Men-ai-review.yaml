  review:
    summary: >-
      Mitochondrial localization by phylogenetic inference (PTN001157886; donors mouse Me2/Me3, rat, human
      ME2 P23368).
    action: REMOVE
    reason: >-
      The donors are the mitochondrial malic enzymes ME2 and ME3. Men is the cytosolic NADP-malic enzyme
      of flies: it lacks an N-terminal mitochondrial targeting sequence and its activity is recovered
      in the cytosolic, non-mitochondrial fraction. The mitochondrial paralog in flies is Men-b. The transfer
      is wrong for this gene.
    supported_by:
