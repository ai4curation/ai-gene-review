- term:
    id: GO:0006740
    label: NADPH regeneration
  evidence_type: IDA
  original_reference_id: PMID:120193
  qualifier: involved_in
  review:
    summary: >-
      Men catalyses NADP+ reduction coupled to malate decarboxylation and supplies about a third of larval
      NADPH; RNAi of Men abolishes malate-induced NADPH production in S2 cells.
    action: NEW
    reason: >-
      The enzyme itself performs the NADPH-generating step, so this is direct participation, not a substrate
      or necessity relationship. The term grounds the FlyBase NADPH regeneration group. Comparator check:
      human PGD and IDH1 carry GO:0006740 (IEA), and the fly Idh review proposes the same term as the
      replacement for NADP+ metabolic process.
    supported_by:
    - reference_id: PMID:120193
      supporting_text: >-
        The tissue activity of NADP-ME is very high in early third instar larvae, providing about 33%
        of the NADPH at this life stage.
    - reference_id: PMID:20700104
      supporting_text: >-
        Indeed, abrogation of malate-induced NADPH production by downregulation of Men demolished the
        protective effects of malate
