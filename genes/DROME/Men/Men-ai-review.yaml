id: Q9VG31
gene_symbol: Men
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Men encodes the cytosolic NADP+-dependent malic enzyme (NADP-ME, EC 1.1.1.40) of Drosophila melanogaster,
  a homotetrameric, divalent-cation-dependent enzyme that oxidatively decarboxylates (S)-malate to pyruvate
  and CO2 while reducing NADP+ to NADPH. All cytosolic malic enzyme activity in flies derives from Men.
  The enzyme is a major source of cytosolic NADPH, providing about a third of larval NADPH, and is induced
  by dietary carbohydrate and juvenile hormone and repressed by dietary lipid, linking it to lipogenesis.
  Its NADPH output sets the threshold for apoptosis in S2 cells through inhibitory phosphorylation of
  the caspase Dronc, and larval overexpression raises the NADPH/NADP+ ratio, lowers triglyceride and glycogen
  stores and extends lifespan. Natural Men alleles that alter its kinetic properties segregate in fly
  populations.
