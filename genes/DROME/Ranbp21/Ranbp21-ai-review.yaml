    label: tRNA export from nucleus
  evidence_type: IMP
  original_reference_id: PMID:16963774
  qualifier: involved_in
  review:
    summary: dmExp5 is the main candidate tRNA exporter in Drosophila, which lacks exportin-t. RNAi lowers
      mature tRNA levels.
    action: NEW
    reason: The exportin itself carries the cargo through the pore, so this is participation, not
      substrate necessity. The fly evidence combines direct RanGTP-dependent tRNA binding with reduced
      tRNA-Met and tRNA-Ser after RNAi. Drosha or DGCR8 RNAi did not reduce tRNA, ruling out a secondary
      effect of miRNA loss. The export defect itself is inferred from steady-state levels, as the
      authors note. Direct compartment-resolved export assays are lacking, hence IMP rather than IDA.
    supported_by:
    - reference_id: PMID:16963774
      supporting_text: A significant decrease in tRNA-Met and tRNA-Ser as well as miR-2 levels was observed
        by the knockdown of dmExp5
    - reference_id: PMID:16963774
      supporting_text: These findings exclude the possibility that the repression of tRNA caused by the depletion
        of dmExp5 in S2 cells was a secondary effect due to the loss of miRNA function.
    - reference_id: PMID:16963774
      supporting_text: it was predicted that no Exp-t orthologous gene exists in several arthropods including
        Drosophila melanogaster (dm)
