  review:
    summary: RNAi of dmExp5 lowers mature miR-2 and, more strongly, mirtron hairpins and their mature
      products. dmExp5 binds pre-miRNA with RanGTP.
    action: NEW
    reason: Two independent fly RNAi studies, with different dsRNAs, show reduced pre-miRNA-pathway
      products after Exp5 depletion. Mirtron hairpins are especially sensitive (60-80% reduction), and
      canonical miRNAs drop modestly. Human XPO5 partially rescues the miR-2 defect. Together with
