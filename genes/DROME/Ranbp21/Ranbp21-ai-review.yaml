suggested_questions:
- question: Does endogenous Drosophila Exp5 export intronless mRNAs or lncRNAs, as suggested by PAR-CLIP of
    overexpressed protein, and does it cooperate with dU2AF50 in doing so?
- question: Does fly Exp5 export eEF1A or other proteins via tRNA bridging, as vertebrate Exp5 does? This
    would decide whether protein export from nucleus applies to the exportin-5 clade beyond vertebrates.
- question: Are pre-tRNAs exported before 5'/3' end processing in vivo, and where are RNase P and RNase Z
    located in fly cells?
suggested_experiments:
- hypothesis: Ranbp21 is required for nuclear export of tRNA and pre-miRNA in vivo.
  description: Generate Ranbp21 null or germline-clone mutants and measure the nuclear/cytoplasmic
    distribution of tRNAs and pre-miRNAs by fractionation and FISH, with rescue by a genomic transgene.
  experiment_type: genetic loss-of-function with subcellular RNA localisation
- hypothesis: The PAR-CLIP mRNA/lncRNA targets are genuine endogenous Exp5 cargoes.
  description: CLIP endogenously tagged Exp5 (CRISPR knock-in) and test nuclear retention of top intronless
    mRNA targets after Exp5 depletion.
  experiment_type: CLIP and RNA localisation
