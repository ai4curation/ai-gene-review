  review:
    summary: Protein export is the hallmark of the XPO1/CRM1 branch of this family. No protein cargo
      has been identified for Drosophila Exp5.
    action: MARK_AS_OVER_ANNOTATED
    reason: This IEA comes from an ARBA rule combined with the shared XPO1/5 family signature (IPR045065),
