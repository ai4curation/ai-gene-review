description: >-
  Ranbp21 encodes Drosophila exportin-5 (dmExp5), a 1241-residue karyopherin of the importin-beta
  superfamily (exportin-5 subfamily). It has an N-terminal importin-beta Ran-binding domain and an
  exportin-5-specific C-terminal region. Like other exportins it forms RanGTP-dependent complexes with
  cargo. Recombinant dmExp5 binds pre-miRNA hairpins and, more strongly than human XPO5, tRNAs; in both
  cases binding needs RanGTP. Drosophila has no exportin-t ortholog, and RNAi depletion of Ranbp21 in S2
  cells lowers mature tRNA and miRNA levels. Hairpins from splicing-derived mirtrons are especially
  sensitive. Ranbp21 is therefore regarded as the main nuclear exporter of tRNAs and pre-miRNAs in flies.
  PAR-CLIP of overexpressed dmExp5 also recovers 7SL RNA, tRNA precursors that still carry 5' leaders and
  3' trailers, and a set of mRNAs and lncRNAs. These suggest further cargoes, but their export has not
  been tested functionally.
