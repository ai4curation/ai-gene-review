suggested_questions:
- question: Are fly Vps53 loss-of-function phenotypes (e.g. in neurons or spermatogenesis) a combination
    of the scat (GARP) and Vps50 (EARP) phenotypes, as expected for a shared core subunit?
suggested_experiments:
- description: Tissue-specific Vps53 RNAi with readouts for Lerp (M6PR) retrieval to the TGN and for endocytic
    recycling of a plasma-membrane cargo, compared with scat and Vps50 depletion.
