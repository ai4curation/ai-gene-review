gene_symbol: Vps53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps53 (CG3338) is the Drosophila ortholog of VPS53, a large CATCHR-family helical-rod subunit
  shared by the GARP and EARP multisubunit tethering complexes. With Vps51 and Vps52 it forms the common
  core of GARP, which also contains Vps54 (scattered) and tethers endosome-derived carriers at the trans-Golgi
  network for retrograde retrieval of cargo such as lysosomal hydrolase receptors, and of EARP, which
  contains Vps50 (syndetin) instead and supports recycling of endocytosed cargo to the plasma membrane.
  Fly Vps53 co-purifies with the other GARP subunits on GTP-bound Arl5, Rab4 and Rab30 and co-precipitates
  with Vps50 in S2 cells.
