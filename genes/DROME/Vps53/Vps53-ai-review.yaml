  review:
    summary: Vps53 associates with the Vps50 (CG4996/Vps54L) subunit that defines the fly EARP (GARPII)
      complex.
    action: NEW
    reason: GFP-CG4996/Vps50 co-precipitated Myc-tagged Vps53 (CG3338) and Vps52 from S2 cells, and the
      four proteins co-purified on Rab4 columns, defining a Vps54-free version of GARP that corresponds
      to EARP. Vps51 already carries EARP complex by IBA; adding it here keeps the shared core subunits
      consistent.
    supported_by:
