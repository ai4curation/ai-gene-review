findings:
- category: discrepancy
  text: FlyBase says Sur is expressed almost exclusively in the embryonic heart; the
    review lists embryonic trachea, adult heart, corpora cardiaca and insulin-producing
    cells.
  sources:
  - Alliance_Imported
- category: gap
  text: The FlyBase claim of increased oxidative stress in Sur-deficient adult hearts
    is not mentioned in the review.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: Agreement on a cardioprotective SUR-type KATP subunit; the automated
    text reduces it to an ABC transporter.
