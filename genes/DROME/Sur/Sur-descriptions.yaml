descriptions:
- source: UniProt
  text: May function as regulatory subunit of ATP-sensitive potassium channels (KATP)
    and form KATP channels with a member of the ATP- sensitive inward rectifier potassium
    channel family (By similarity). May also have channel activity by itself (in vitro).
    May protect the heart during hypoxia. May protect against heart failure under
    conditions of tachycardic stress.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VL32
  source_id: Q9VL32
