      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'Hedged but correct: probable KATP regulatory subunit, channel
      activity in oocytes, protection during hypoxia and tachycardic stress.'
- source: Alliance_Imported
  text: Sulfonylurea receptor (Sur) encodes a predicted ATP-sensitive K[+] channel
    expressed almost exclusively in the embryonic heart. Sur loss in the adult heart
    causes increased oxidative stress and pacing-induced heart failure.
  source_type: curated
  url: https://flybase.org/reports/Sur.html
  source_id: FB:FBgn0028675
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Predicted KATP channel and pacing-induced heart failure are correct.
      'Expressed almost exclusively in the embryonic heart' conflicts with the review
      (trachea, adult heart, corpora cardiaca, insulin-producing cells). The oxidative
      stress claim is not covered in the review.
- source: Alliance_Automated
  text: Predicted to enable ABC-type transporter activity. Involved in response to
    hypoxia. Predicted to be located in membrane. Predicted to be active in plasma
    membrane. Is expressed in several structures, including adult heart; anterior-posterior
    subdivision of organism; cardiogenic mesoderm; dorsal vessel wall cell; and gland.
    Human ortholog(s) of this gene implicated in several diseases, including dilated
    cardiomyopathy (multiple); familial atrial fibrillation; glucose metabolism disease
    (multiple); hypertrichotic osteochondrodysplasia Cantu type; and intellectual
    disability and myopathy syndrome. Orthologous to human ABCC8 (ATP binding cassette
    subfamily C member 8) and ABCC9 (ATP binding cassette subfamily C member 9).
  source_type: automated
  url: https://flybase.org/reports/Sur.html
  source_id: FB:FBgn0028675
