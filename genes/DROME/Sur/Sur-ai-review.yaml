gene_symbol: Sur
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sur (Sulfonylurea receptor, Dsur, CG5772) is the single Drosophila member of the SUR subfamily
  of ABCC-type ATP-binding cassette proteins, a 2223-residue multi-pass membrane protein with two transmembrane
  domains and two nucleotide-binding domains. By homology to mammalian SUR1/SUR2 it is the regulatory,
  nucleotide- and sulfonylurea-sensing subunit of ATP-sensitive potassium (KATP) channels at the plasma
  membrane; expressed in Xenopus oocytes it produces glibenclamide-sensitive potassium currents. It is
  expressed in the embryonic dorsal vessel and tracheal system, the adult heart (under direct control
  of Tinman and Pannier, declining with age), adipokinetic hormone-producing corpora cardiaca cells and
  brain insulin-producing cells. Knockdown reduces cardiac tolerance of hypoxia and pacing stress and
  has been linked to antiviral survival and night-time sleep; contrary to a long-standing hypothesis,
  Sur is not required for cuticular chitin synthesis.
