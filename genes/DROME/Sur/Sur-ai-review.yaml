  review:
    action: ACCEPT
    summary: NBD2 retains a consensus Walker A and catalytic Walker B glutamate as in mammalian SURs,
      where NBD2 hydrolyses MgATP as part of channel regulation.
    reason: 'The InterPro ABC ATP-binding domain mapping is supported by sequence: NBD2 carries an intact
      P-loop and a Walker B with the catalytic glutamate (LVLDE), while NBD1 has the degenerate aspartate
      typical of ABCC NBD1 (Sur-bioinformatics/RESULTS.md). Mammalian SUR1/SUR2 hydrolyse ATP at NBD2
      and the post-hydrolytic MgADP state stimulates the channel. ATP hydrolysis has not been measured
      for Drosophila Sur, but the conserved catalytic machinery makes the inference sound. It is an intrinsic
      part of the nucleotide-sensing regulatory mechanism, not evidence of solute pumping.'
    supported_by:
