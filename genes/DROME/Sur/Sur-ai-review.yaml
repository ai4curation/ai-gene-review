  review:
    action: KEEP_AS_NON_CORE
    summary: Knockdown of Sur reduces cardiac tolerance of hypoxic stress; a physiological role of the
      cardiac KATP-type channel, not the core molecular activity.
    reason: PMID:16882722 (abstract cached; FlyBase curator read the full text) reports that dSUR knock-down
