- id: file:DROME/Sur/Sur-deep-research-flybase.md
  title: FlyBase gene description for Sur (DROME)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Checked each claim. "Predicted ATP-sensitive K[+] channel" agrees with the review (Sur is the
      regulatory SUR subunit, and Dsur alone gives glibenclamide-sensitive currents in oocytes). The
      expression claim is wrong: the cloning paper reports embryonic expression in both the tracheal system
      and the dorsal vessel (PMID:10506204), and Sur is also expressed in the adult heart (PMID:16882722),
      corpora cardiaca (PMID:15372035) and adult insulin-producing cells (PMID:20195385). Pacing-induced
      heart failure after Sur knockdown agrees with PMID:16882722. The claim of increased oxidative stress
      in Sur-deficient adult hearts could not be verified: the cached abstract of PMID:16882722 (no full
      text) reports reduced protection against hypoxic stress, not oxidative stress, and no other cached or
      PubMed-retrievable Sur paper reports it. It is therefore not added to the description.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0028675
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Sulfonylurea receptor (Sur) encodes a predicted ATP-sensitive K[+] channel expressed almost
        exclusively in the embryonic heart.
      confidence: CONFIRMED
      explanation: >-
        "Expressed almost exclusively in the embryonic heart" is contradicted by the cloning paper, which
        found Dsur specifically expressed in both the developing tracheal system and the dorsal vessel
        (Nasonkin et al. 1999, PMID:10506204). Sur is also expressed in the adult heart under Tinman and
        Pannier control (PMID:16882722) and in adult insulin-producing cells (PMID:20195385). Suggest
        "expressed in the embryonic dorsal vessel and tracheal system and in the adult heart". Separately,
        the next sentence's "increased oxidative stress" could not be traced; PMID:16882722 describes
        reduced tolerance of hypoxic stress, so that wording may also need checking.
      supported_by:
      - reference_id: PMID:10506204
        supporting_text: During Drosophila embryogenesis, the Dsur gene is specifically expressed in the
          developing tracheal system and dorsal vessel.
      - reference_id: PMID:16882722
        supporting_text: dSUR plays a protective role against hypoxic stress and pacing-induced heart failure.
      - reference_id: PMID:20195385
        supporting_text: in situ hybridization detecting transcripts for the sulfonylurea receptor (SUR) subunit
          of the KATP channel in adult IPCs.
core_functions:
- description: Regulatory, nucleotide- and sulfonylurea-sensing subunit of ATP-sensitive potassium channels,
    inferred from SUR-subfamily membership and supported by glibenclamide-sensitive potassium currents
    on heterologous expression; its two NBDs bind (and at NBD2 likely hydrolyse) ATP to couple cellular
    energy state to channel gating.
