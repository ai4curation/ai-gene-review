suggested_questions:
- question: Which Drosophila inward rectifier (Irk1, Irk2 or Irk3) partners with Sur to form native KATP
    channels in heart, corpora cardiaca and insulin-producing cells?
- question: Is the glibenclamide-sensitive current seen with Dsur alone in oocytes due to endogenous Xenopus
    Kir subunits, or does Sur have intrinsic channel activity?
- question: What is the function of the ~1.7 kb Sur-specific sequence insertion with no homology to known
    genes?
suggested_experiments:
- description: Co-express Sur with each Drosophila Irk subunit in a Kir-free heterologous system and record
    ATP-, MgADP- and glibenclamide-sensitive currents; test Walker A/B mutants of NBD1 and NBD2.
- description: Measure ATPase activity of purified Sur NBDs or full-length protein to confirm NBD2-dependent
    hydrolysis.
