  review:
    action: MODIFY
    summary: Sur belongs to the SUR clade of ABCC proteins that act as potassium channel regulators rather
      than primary active transporters; replace with potassium channel regulator activity.
    reason: GO:0140359 asserts ATP-driven translocation of a substrate. The PAINT node (PTN009085477)
      is a deep ABCC node seeded mostly by MRP-type transporters; within it the SUR subfamily (ABCC8/ABCC9
      and fly Sur) has specialised as the regulatory subunit of KATP channels, and no transported solute
      has been shown for any SUR, including Sur. Mammalian SURx are electrophysiologically inert alone
      and confer nucleotide and sulfonylurea sensitivity on Kir6 channels; Dsur expression gives glibenclamide-sensitive
