- term:
    id: GO:0035208
    label: positive regulation of hemocyte proliferation
  evidence_type: IGI
  original_reference_id: PMID:20168330
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0004864
  review:
    summary: Retain the genetic interaction in the activated-JAK haemocyte tumour model as context-dependent
      biology.
    action: KEEP_AS_NON_CORE
    reason: Bina et al. identify CG4793 in an RNAi screen for effectors of hopTumL-induced melanotic tumours;
      its depletion suppresses the tumour index. This supports the existing FlyBase IGI inference in that
      overproliferation model, rather than demonstrating a universal positive effect on normal haemocyte
      proliferation. Direct circulating-haemocyte counts in the article concern baz, not CG4793. The physiological
      parasitoid assay instead establishes a negative effect on lamellocyte-mediated encapsulation, a
      distinct outcome and context.
    supported_by:
    - reference_id: file:DROME/CG4793/CG4793-publication-artifacts/PMID_20168330.txt
      supporting_text: 'CG4793, CG1572 and CG13559—were identified whose knockdown significantly reduces
        the development of tumours in the

        adult fly'
    - &id002
      reference_id: PMID:33644706
      supporting_text: Conversely, knockdown of CG4793 in lamellocytes resulted in a significant increase
        in the encapsulation rate.
- term: &id003
    id: GO:0140540
    label: negative regulation melanotic encapsulation of foreign target
  evidence_type: IMP
  original_reference_id: PMID:33644706
  review:
    summary: CG4793 restrains lamellocyte-mediated encapsulation of parasitoid eggs.
    action: NEW
    reason: Two independent RNAi constructs increase encapsulation when CG4793 is depleted in lamellocytes,
      with no effect after plasmatocyte depletion. This directly supports negative regulation of the melanotic
      encapsulation response in the tested Drosophila–Leptopilina clavipes infection model. The experiment
      is gene-level; it does not establish which CG4793 isoform or molecular partner mediates the effect.
    supported_by:
    - *id002
