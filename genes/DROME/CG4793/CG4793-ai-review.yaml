  review:
    summary: Participation in proteolysis is unresolved for this inactive protease homolog.
    action: UNDECIDED
    reason: The target lacks the conventional serine nucleophile, so its S1 domain cannot justify intrinsic
      peptide-bond hydrolysis. Proteolysis is a biological process, however, and a pseudoenzyme could
      participate noncatalytically by regulating an active protease. The cellular-immunity experiments
      do not identify such a proteolytic mechanism for CG4793. Target-specific catalytic loss challenges
      transfer of enzymatic activity, but does not alone refute this broader process assertion.
    supported_by:
    - *id001
    - reference_id: PMID:33644706
      supporting_text: However, a detailed mechanistic understanding of how these S1A family genes regulate
        cellular immunity and how their activity may be linked to JAK-STAT pathway signaling remain to
        be established.
