  negated: true
  review:
    summary: The negated peptidase annotation is consistent with the disrupted catalytic machinery of
      CG4793.
    action: ACCEPT
    reason: This is a NOT annotation, not a positive enzyme assignment. Independent alignment of the exact
      Q8IP30 sequence to two active trypsin controls identifies glycine at the catalytic serine position,
      with additional substitutions at the aligned His/Asp positions. The controls retain the intact triad.
      This supports loss of conventional S1 peptidase activity and agrees with the published SPH classification;
      it does not exclude noncatalytic regulation of other proteases.
    supported_by:
    - &id001
      reference_id: file:DROME/CG4793/CG4793-bioinformatics/RESULTS.md
      supporting_text: Global domain alignments to active trypsins P00760 and P00761 map the catalytic
        His, Asp and Ser to Q8IP30 Glu145, Asn191 and Gly290, respectively. In particular, the catalytic
        serine is replaced by glycine in the conserved local segment TCKGDGGAPLA.
