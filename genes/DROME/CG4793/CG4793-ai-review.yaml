description: 'CG4793 (SPH208/cSPH128) encodes a 910-residue secretory-pathway serine protease homolog
  with an N-terminal protease-like domain and a long repetitive C-terminal region. Its catalytic-site
  substitutions support a nonenzymatic regulatory role rather than serine endopeptidase activity. CG4793
  is a JAK/STAT-responsive regulator of cellular immunity: depletion in lamellocytes increases parasitoid-egg
  encapsulation, whereas depletion in a constitutively active JAK tumour model suppresses melanotic tumour
  formation. Its direct molecular partners and mechanism are unresolved.'
