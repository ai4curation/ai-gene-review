    summary: The exact 910-residue Q8IP30 sequence has a protease-like domain with glycine replacing the
      catalytic serine, supported by substantial-coverage alignments to two active trypsin controls. The
      controls agree on the additional His-to-Glu and Asp-to-Asn site mappings, although the histidine
      region is more divergent. These residue observations, rather than the SPH name or an automated domain
      caution alone, refute conventional serine endopeptidase catalysis. Four existing GOA NOT annotations
      are concordant negative annotations, not evidence that the positive prediction is correct or non-novel.
      The source gives model score 0.99 and phmmer donor Q7Z410 with score 226.0; donor similarity cannot
      restore the missing nucleophile. Gene-specific RNAi establishes cellular immune regulation, without
      assaying purified-protein proteolysis or resolving a direct mechanism.
    supported_by:
    - reference_id: file:DROME/CG4793/CG4793-bioinformatics/RESULTS.md
      supporting_text: Global domain alignments to active trypsins P00760 and P00761 map the catalytic
        His, Asp and Ser to Q8IP30 Glu145, Asn191 and Gly290, respectively. In particular, the catalytic
        serine is replaced by glycine in the conserved local segment TCKGDGGAPLA.
    - reference_id: PMID:33644706
      supporting_text: CG4793 is an SPH gene and encodes a protein that is predicted to be catalytically
        inactive.
