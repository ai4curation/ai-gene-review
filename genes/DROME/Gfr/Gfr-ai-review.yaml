id: Q9VHT4
gene_symbol: Gfr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gfr (Golgi GDP-fucose transporter; also known as neurally altered carbohydrate, nac) is the
  Drosophila ortholog of human SLC35C1, a multi-pass Golgi membrane nucleotide-sugar transporter of the
  TPT/SLC35C family. It imports cytosolic GDP-fucose into the Golgi lumen, in exchange for GMP as described
  for SLC35C1, and is specific for GDP-fucose among nucleotide sugars tested. Gfr supplies the donor for
  Golgi fucosyltransferases and is required for core alpha1,3- and alpha1,6-fucosylation of N-glycans,
  including the neural HRP epitope. Together with the ER transporter Efr it provides GDP-fucose for O-fucosylation
  of Notch EGF repeats and so supports Notch signaling; Gfr mutants model the human congenital disorder
  of glycosylation CDG-IIc (LAD-II).
