    reference_section_type: ABSTRACT
suggested_questions:
- question: Does Gfr function as an obligate GDP-fucose/GMP antiporter in Drosophila Golgi membranes,
    and is its activity limited by luminal GMP export?
suggested_experiments:
- description: Reconstitute purified Gfr in proteoliposomes preloaded with GMP or GDP and measure GDP-fucose
    uptake to test antiport coupling directly.
