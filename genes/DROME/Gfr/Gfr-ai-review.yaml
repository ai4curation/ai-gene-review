core_functions:
- description: Gfr is a Golgi membrane SLC35C1-type transporter that imports cytosolic GDP-fucose into
    the Golgi lumen with high specificity, supplying Golgi fucosyltransferases for N-glycan core fucosylation
    and, redundantly with Efr, the O-fucosylation of Notch.
  molecular_function:
    id: GO:0005457
    label: GDP-fucose transmembrane transporter activity
