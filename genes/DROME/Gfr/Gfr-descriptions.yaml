descriptions:
- source: UniProt
  text: Involved in GDP-fucose import from the cytoplasm into the Golgi lumen (PubMed:15530860,
    PubMed:22745127). Plays a major role in the fucosylation of N-glycans (PubMed:15530860,
    PubMed:22745127). Functions redundantly with Efr in the O-fucosylation of Notch,
    positively regulating Notch signaling (PubMed:19948734).
  source_type: curated
