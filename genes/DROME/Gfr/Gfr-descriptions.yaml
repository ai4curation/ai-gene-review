- source: Alliance_Automated
  text: Enables GDP-fucose transmembrane transporter activity. Involved in GDP-fucose
    import into Golgi lumen. Located in Golgi membrane and Golgi-associated vesicle.
    Is expressed in adult head. Used to study congenital disorder of glycosylation
    type II. Human ortholog(s) of this gene implicated in congenital disorder of glycosylation
    type IIc. Orthologous to human SLC35C1 (solute carrier family 35 member C1).
