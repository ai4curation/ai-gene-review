taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Ar2 (CG10638) encodes an NADPH-dependent aldo-keto reductase of the AKR1B family, a paralog
  of the Drosophila aldose reductase Ar1. Like Ar1 it is predicted to reduce glucose to sorbitol in the
  cytosol, the first step of the polyol pathway that converts glucose to fructose. Ar1 and Ar2 act redundantly:
  flies lacking both have reduced hemolymph sorbitol and impaired polyol-pathway-dependent glucose sensing
  by the transcription factor Mondo in the fat body.'
