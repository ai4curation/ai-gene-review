- source: Alliance_Automated
  text: Predicted to enable aldose reductase (NADPH) activity. Involved in D-sorbitol
    biosynthetic process and fructose biosynthetic process. Predicted to be active
    in cytosol. Is expressed in several structures, including Malpighian tubule primordium;
    adult head; embryonic/larval midgut primordium; ganglia; and gut section. Human
    ortholog(s) of this gene implicated in 46,XY sex reversal 8 and congenital bile
    acid synthesis defect 2. Orthologous to several human genes including AKR1B10
    (aldo-keto reductase family 1 member B10).
