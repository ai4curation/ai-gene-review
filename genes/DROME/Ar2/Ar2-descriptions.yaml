- source: Alliance_Imported
  text: Aldose reductase 2 (Ar2) encodes an enzyme predicted to catalyze the NADPH-dependent
    reduction of aldose sugars and other carbonyl-containing compounds to their corresponding
    alcohols. It is involved in the biosynthesis of D-fructose from D-glucose.
  source_type: curated
  url: https://flybase.org/reports/Ar2.html
  source_id: FB:FBgn0036290
