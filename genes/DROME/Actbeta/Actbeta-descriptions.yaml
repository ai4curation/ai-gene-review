    - rubric: specificity
      score: 4
    overall_notes: Babo/Smox signaling and neural expression are correct. Lists metabolism,
      insulin signaling, hemocyte development and body size; the review covers the
      AKH/metabolic role but not hemocyte development or body size.
- source: Alliance_Automated
  text: Predicted to enable cytokine activity. Involved in several processes, including
    animal organ morphogenesis; mushroom body development; and positive regulation
    of imaginal disc growth. Predicted to be active in extracellular region. Is expressed
    in several structures, including epithelial cell; ganglia; inner photoreceptor
    cell; male germline cell; and presumptive embryonic/larval system. Human ortholog(s)
    of this gene implicated in brain ischemia. Orthologous to several human genes
    including INHBA (inhibin subunit beta A); INHBB (inhibin subunit beta B); and
    INHBC (inhibin subunit beta C).
