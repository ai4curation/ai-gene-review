descriptions:
- source: UniProt
  text: Controls several aspects of neuronal morphogenesis; essential for optic lobe
    development, EcR-B1 expression in larval brains, mushroom body remodeling, dorsal
    neuron morphogenesis and motoneuron axon guidance. Ligands Actbeta and daw act
    redundantly through the Activin receptor Babo and its transcriptional mediator
    Smad2 (Smox), to regulate neuroblast numbers and proliferation rates in the developing
    larval brain.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O61643
  source_id: O61643
