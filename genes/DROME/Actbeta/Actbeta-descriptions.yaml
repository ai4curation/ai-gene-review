    overall_notes: 'Correct and cited neuronal roles: mushroom body remodeling, motoneuron
      axon guidance, neuroblast proliferation through Babo and Smox. No metabolic
      role.'
- source: Alliance_Imported
  text: Activin-&bgr; (Act&bgr;) encodes a ligand of the TGF beta superfamily. It
    signals through the type I receptor encoded by babo and the Smad family member
    encoded by Smox. Act&bgr; is expressed primarily in the central and peripheral
    nervous systems and its product regulates aspects of metabolism, insulin signaling,
    hemocyte development and body size.
  source_type: curated
  url: https://flybase.org/reports/Actβ.html
  source_id: FB:FBgn0024913
