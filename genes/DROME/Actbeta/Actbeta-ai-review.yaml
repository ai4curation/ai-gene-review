- term:
    id: GO:0007476
    label: imaginal disc-derived wing morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084208
  review:
    summary: Actbeta affects wing development in addition to its neuronal and metabolic functions.
    action: KEEP_AS_NON_CORE
    reason: The wing growth and size phenotypes support a developmental effect in
      imaginal-disc-derived wings. Retain this morphogenesis-level assertion as a contextual
      outcome, without claiming that Actbeta directly specifies every wing pattern element.
    supported_by:
    - reference_id: PMID:18820452
      supporting_text: In wing discs, expression of an activated form of dSMAD2 promotes growth
        similar to dACT and activated BABO.
    - reference_id: PMID:23485686
      supporting_text: the expression of the four candidate TGFβ ligands (Activinβ, Dawdle, Maverick
        and Myoglianin) in the wing disc is required to obtain normal levels of TGFβ signalling in
        this tissue.
