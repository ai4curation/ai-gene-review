id: O61643
gene_symbol: Actbeta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Actbeta is a secreted activin-like TGF-beta-family cytokine in Drosophila. Its mature signaling
  ligand activates a receptor complex containing the type I kinase Baboon and type II kinase Punt, leading
  to Smox-dependent transcription. Actbeta participates in neuronal remodeling, neuroblast proliferation,
  photoreceptor specification and neuromuscular signaling. Midgut enteroendocrine cells also release Actbeta
  to enhance adipokinetic-hormone responses in the fat body, linking diet to carbohydrate mobilization
  and glycemic control.'
