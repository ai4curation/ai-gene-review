  review:
    summary: The relevant receptor pathway is activin signaling.
    action: MODIFY
    reason: The broad TGF-beta-superfamily receptor pathway is correct, and native dACT signaling
      through Babo/Punt to Smox specifies the activin branch. This does not imply a vertebrate
      TGF-beta ligand branch or an exclusive Babo isoform.
    supported_by:
    - reference_id: PMID:18820452
      supporting_text: Only Drosophila Activin (dACT) and the Activin-like ligand Dawdle (DAW)
        signal through BABO in combination with the type II receptor PUNT and activate dSMAD2.
    proposed_replacement_terms:
