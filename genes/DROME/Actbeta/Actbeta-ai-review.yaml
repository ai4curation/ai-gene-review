- term:
    id: GO:0016319
    label: mushroom body development
  evidence_type: IMP
  original_reference_id: PMID:12581521
  qualifier: involved_in
  review:
    summary: Actbeta signaling contributes to mushroom body remodeling.
    action: KEEP_AS_NON_CORE
    reason: Stage-specific dActivin loss interferes with remodeling; the Babo/Smox pathway regulates
      EcR-B1 expression. This is a neural developmental output rather than a separate intrinsic
      ligand activity.
