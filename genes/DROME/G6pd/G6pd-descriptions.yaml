    - rubric: specificity
      score: 4
    overall_notes: 'Correct: cytosolic, rate-limiting first step of the oxidative
      pentose phosphate pathway, a source of NADPH. No fly-specific findings.'
- source: Alliance_Imported
  text: Glucose-6-phosphate dehydrogenase (G6pd) encodes a cytosolic enzyme that catalyzes
    the oxidation of glucose 6-phosphate to 6-phosphogluconate with the concomitant
    reduction of NADP+ to NADPH in the oxidative branch of the pentose phosphate pathway.
  source_type: curated
  url: https://flybase.org/reports/G6pd.html
  source_id: FB:FBgn0004057
  review:
