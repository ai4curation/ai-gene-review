    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct apart from naming the product 6-phosphogluconate; the enzyme
      makes 6-phosphoglucono-lactone. NADPH production in the oxidative PPP is stated.
- source: Alliance_Automated
  text: Enables glucose-6-phosphate dehydrogenase activity. Involved in pentose-phosphate
    shunt, oxidative branch. Predicted to be active in cytosol. Is expressed in adult
    fat body and adult head. Human ortholog(s) of this gene implicated in several
    diseases, including anemia (multiple); bilirubin metabolic disorder; cerebrovascular
    disease; malaria (multiple); and neonatal jaundice. Orthologous to human G6PD
    (glucose-6-phosphate dehydrogenase).
