descriptions:
- source: UniProt
  text: Cytosolic glucose-6-phosphate dehydrogenase that catalyzes the first and rate-limiting
    step of the oxidative branch within the pentose phosphate pathway/shunt, an alternative
    route to glycolysis for the dissimilation of carbohydrates and a major source
    of reducing power and metabolic intermediates for fatty acid and nucleic acid
    biosynthetic processes.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P12646
  source_id: P12646
