taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  G6pd (Zwischenferment, Zw; CG12529) encodes the cytosolic glucose-6-phosphate dehydrogenase of Drosophila
  melanogaster, which catalyses the first and rate-limiting step of the oxidative pentose phosphate pathway:
  oxidation of D-glucose 6-phosphate to 6-phospho-D-glucono-1,5-lactone with reduction of NADP+ to NADPH.
  The enzyme exists in dimeric and tetrameric forms whose equilibrium differs between natural Zw allozymes
  and is shifted by NADP+. G6pd-derived NADPH maintains reduced glutathione and supports lipid synthesis;
  G6pd is activated by sugar-dependent phosphorylation by salt-inducible kinase 3 (SIK3), which is required
  for survival on high-sugar diets, and its ubiquitous or neuronal overexpression raises NADPH and the
  GSH/GSSG ratio, increases resistance to oxidative stress and extends lifespan. Flies with low-activity
  or null alleles have reduced pentose shunt activity.
