- term:
    id: GO:0001746
    label: Bolwig's organ morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:10704398
  qualifier: involved_in
  review:
    summary: >-
      Bolwig's organ (the larval photoreceptor) requires Hedgehog input, and the cited study defines a
      Ci- and Fused-independent branch of the pathway acting in its formation. As the Hedgehog
      receptor, ptc participates by setting how much signal the primordium receives, not by any
      organ-specific activity of its own.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained as a genuine but peripheral, tissue-level consequence of ptc's restraint of Smoothened
      signalling. The cached record is abstract-only and foregrounds hh, eya and so; the FlyBase
      curator read the full text and we do not overrule that, but the annotation is not evidence of a
      distinct molecular role for ptc in larval eye morphogenesis.
    supported_by:
    - reference_id: PMID:10704398
      supporting_text: >-
        Neither Atonal expression nor Bolwig's organ formation occurred in the absence of hedgehog,
        eyes absent or sine oculis activity.
    - reference_id: PMID:10704398
      supporting_text: >-
        the Hedgehog signaling pathway required for Bolwig's organ development is a new type and lacks
        Fused kinase and Cubitus interruptus as downstream components
- term:
    id: GO:0005119
    label: smoothened binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000847539
  - UniProtKB:Q13635
  - UniProtKB:Q9Y6C5
  review:
    summary: >-
      A PAINT node assertion placing Smoothened binding on the ancestral Patched receptor, seeded by
      human PTCH1 and PTCH2. Drosophila ptc descends from that node, so the propagation is mechanically
      correct; the question is whether the term describes what fly Patched actually does.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not wrong at the level of complex membership - Patched and Smoothened do co-immunoprecipitate and
      co-fractionate in Drosophila (PMID:17284519) - but the fly evidence argues specifically against
      reading this as a direct receptor-transducer interaction. Inhibition of Smoothened persists when
      Smoothened is in 50-fold molar excess and substoichiometric Patched suffices, which is the
      signature of a catalytic, indirect mechanism (PMID:26863604), and the trafficking data were
      already interpreted that way (PMID:10966113). A bare binding term invites the reading that
      association is the mechanism, which is exactly the point the Drosophila literature contests. The
      node placement itself is defensible at family level and is not challenged here, so the row is
      marked as over-annotated rather than removed, and it is deliberately not carried into
      core_functions.
    supported_by:
    - reference_id: PMID:26863604
      supporting_text: It is unlikely that Ptc inhibits Smo by direct association
    - reference_id: PMID:10966113
      supporting_text: >-
        These findings raise the possibility that Patched acts indirectly to regulate Smoothened
        activity.
    - reference_id: PMID:17284519
      supporting_text: >-
        We find that Cubitus interruptus, Sex-lethal, Patched and Smoothened co-immunoprecipitate and
        co-fractionate, suggesting a large complex of both membrane and cytoplasmic components of the
        Hedgehog pathway.
    additional_reference_ids:
    - PMID:17284519
    - PMID:26863604
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000847539
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Ancestral Patched node. The IBD placement is defensible at family level and is not
          challenged; what does not carry to Drosophila is the enables-level binding claim, since the
          fly evidence indicates substoichiometric, catalytic restraint rather than association.
      - source_id: UniProtKB:Q13635
        source_label: PTCH1
        source_status: UNRESOLVED
        comment: >-
          Human donor for the node; the directness of the PTCH1-SMO interaction was not adjudicated in
          this fly review.
      - source_id: UniProtKB:Q9Y6C5
        source_label: PTCH2
        source_status: UNRESOLVED
        comment: Human donor for the node; not independently assessed here.
