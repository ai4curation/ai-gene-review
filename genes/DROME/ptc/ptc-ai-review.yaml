- term:
    id: GO:0005929
    label: cilium
  evidence_type: IDA
  original_reference_id: PMID:24768000
  qualifier: located_in
  review:
    summary: >-
      Drosophila olfactory sensory neurons are among the few ciliated cells in the animal, and the
      cited study identifies a cilium-based Hedgehog pathway in them in which the pathway components,
      including Patched, are found in the ciliary compartment.
    action: ACCEPT
    reason: >-
      Accepted as a real but narrowly restricted location. UniProt independently curates cilium
      membrane for ptc from this same paper, so two curation groups reading the full text agree. The
      annotation should not be read as implying that fly Hedgehog signalling is generally ciliary: the
      paper itself stresses that Drosophila cells are non-ciliated during development, and the
      canonical wing-disc pathway runs on a cytoplasmic Costal-2 complex at the plasma membrane.
    supported_by:
    - reference_id: PMID:24768000
      supporting_text: >-
        Drosophila cells are nonciliated during development, which has led to the assumption that
        cilia-mediated Hh signaling is restricted to vertebrates. Here, we identify and characterize a
        cilia-mediated Hh pathway in Drosophila olfactory sensory neurons.
    - reference_id: file:DROME/ptc/ptc-uniprot.txt
      supporting_text: Cell projection, cilium
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:11279500
  qualifier: involved_in
  review:
    summary: >-
      Loss of ptc in ovarian somatic cells gives ligand-independent Hedgehog signalling and
      supernumerary somatic stem cells, while loss of Hedgehog signalling prevents these cells from
      proliferating as stem cells. The phenotype is a change in stem cell proliferation, which
      GO:0007346 describes only very loosely.
    action: MODIFY
    reason: >-
      The essence is sound - ptc restrains a proliferative response - but regulation of mitotic cell
      cycle is a generic cell-cycle term that does not capture what the experiment shows. The assayed
      phenotype is the size of the somatic stem cell pool, so GO:0072091 regulation of stem cell
      proliferation is the accurate term. Kept out of core_functions either way: this is a
      tissue-specific consequence of ptc restraining Smoothened, not a separate activity.
    proposed_replacement_terms:
    - id: GO:0072091
      label: regulation of stem cell proliferation
    supported_by:
    - reference_id: PMID:11279500
      supporting_text: >-
        These cells cannot proliferate as stem cells in the absence of Hh signalling, whereas excessive
        Hh signalling produces supernumerary stem cells.
    - reference_id: PMID:11279500
      supporting_text: >-
        Here we show that Hh acts specifically on stem cells in the Drosophila ovary.
- term:
    id: GO:0007411
    label: axon guidance
  evidence_type: IMP
  original_reference_id: PMID:15754211
  qualifier: involved_in
  review:
    summary: >-
      In ptc mutants the medial longitudinal tract crosses the midline inappropriately. The cited study
      traces this to loss and mis-specification of the pioneer neuron vMP2 following loss of Ptc
      activity in the neuroectoderm, i.e. the guidance defect is a downstream, non-cell-autonomous
      consequence of altered neural identity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper's own title and conclusion state that Patched regulation of axon guidance works by
      specifying neural identity, and that mis-specification and loss of neurons contribute
      non-autonomously to the pathfinding defect. Annotating ptc as involved_in axon guidance therefore
      over-reads a real phenotype: Patched does none of the work of guiding a growth cone, and the
      mutant axons even ignore the Slit/Robo cues that do. The annotation is not removed, since the
      genetic requirement is real and the curator read the full text, but it should not be treated as
      a guidance function.
    supported_by:
    - reference_id: PMID:15754211
      supporting_text: >-
        Our results show that guidance defects of this tract are due to loss and mis-specification of
        vMP2, which results in the projection from pCC to either stall or project outward near the
        location of vMP2.
    - reference_id: PMID:15754211
      supporting_text: >-
        These results provide insight into how mis-specification and loss of neurons can
        non-autonomously contribute to defects in axon pathfinding.
- term:
    id: GO:0007455
    label: eye-antennal disc morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:11934850
  qualifier: involved_in
  review:
    summary: >-
      Loss of ptc activity perturbs cell proliferation in the eye-antennal disc and produces adult head
      capsule defects. The authors interpret this as a non-canonical, positive Patched-Smoothened route
      acting through the Activin type I receptor Baboon rather than as simple derepression.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine tissue-level requirement for ptc, retained as non-core because it is a developmental
      outcome rather than a molecular activity. The proposed positive Ptc-Smo-Babo mechanism is a
      minority interpretation that has not been widely corroborated, so the annotation is kept on the
      strength of the loss-of-function phenotype rather than on that model.
    supported_by:
    - reference_id: PMID:11934850
      supporting_text: >-
        We show that Ptc regulates Drosophila head development by promoting cell proliferation in the
        eye-antennal disc.
    - reference_id: PMID:11934850
      supporting_text: >-
        Thus, loss of Ptc or Smoothened activity affects cell proliferation in the eye-antennal disc
        and results in adult head capsule defects.
