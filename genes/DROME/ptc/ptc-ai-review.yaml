id: P18502
gene_symbol: ptc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  patched (ptc) is a 1286-residue, twelve-pass integral membrane protein of the RND permease
  superfamily and the cell-surface receptor for the Hedgehog (Hh) morphogen in Drosophila. It carries
  a sterol-sensing domain spanning transmembrane helices 2-6, two large glycosylated extracellular
  loops that form the ligand-binding face, and a long disordered cytoplasmic C-terminal tail. Patched
  has two linked activities. First, in the absence of ligand it is the pathway's brake: it holds the
  class-F receptor Smoothened inactive and destabilised, so that Cubitus interruptus is processed into
  its transcriptional repressor form. Hedgehog binding abolishes this restraint and triggers
  ubiquitin-dependent internalisation and degradation of Patched, allowing Smoothened to accumulate in
  a phosphorylated, active state at the plasma membrane. The restraint appears to be indirect and
  catalytic rather than a stoichiometric Patched-Smoothened association, and in Drosophila it is
  associated with Patched control of membrane lipid pools: Patched binds phosphatidylinositol
  4-phosphate through its sterol-sensing domain and phosphatidic acid through its C-terminal tail, and
  mutating the phosphatidic acid sites abolishes Smoothened inhibition. Second, because patched is
  itself a Hedgehog target gene, ligand-induced Patched acts as a sink that binds and internalises
  Hedgehog and thereby shortens and steepens the morphogen gradient. High-affinity ligand binding and
  transduction additionally require the Ig/fibronectin co-receptors Interference hedgehog and Brother
  of ihog, which bind Patched directly and promote its surface presentation, although Patched alone is
  sufficient to sequester ligand. Patched functions at the plasma membrane, concentrated on the basal
  surface and on signalling filopodia where Hedgehog-sending and Hedgehog-receiving cells contact, and
  cycles through endocytic vesicles; in Drosophila olfactory sensory neurons, one of the few ciliated
  cell types in the animal, it also localises to the ciliary membrane. Independently of Hedgehog
  signalling, Patched internalises lipophorin particles and lowers intracellular lipid droplet
  content. Through its control of Hedgehog reception, patched is required for embryonic segment
  polarity and for anterior/posterior patterning and growth of the imaginal discs, and its loss causes
  ligand-independent pathway activation, overgrowth and mis-specification in many tissues.
