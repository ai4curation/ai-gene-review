    review_notes: >-
      The loss-of-function phenotype in the eye-antennal disc is sound, but the paper's central claim -
      a non-canonical positive Ptc-Smo route acting through the Activin receptor Baboon - runs against
      the overwhelming evidence that Patched represses Smoothened, and has not been widely
      corroborated. The annotation is kept on the phenotype, not on the model.
