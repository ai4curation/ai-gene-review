  knowledge_gaps:
  - gap_statement: >-
      Whether Patched restrains Smoothened by moving a lipid across or within the membrane, and which
      lipid that is, is unresolved in Drosophila. The fly evidence identifies three different lipid
      relationships - PI(4)P binding by the sterol-sensing domain, phosphatidic acid binding by the
