core_functions:
- description: >-
    Cell-surface receptor for the Hedgehog morphogen. Patched binds the lipid-modified Hedgehog ligand
    at the basal plasma membrane and on cytoneme contact sites and transmits the occupancy state across
    the membrane, switching from the restraining, pathway-off configuration to the relieved,
    pathway-on configuration. High-affinity binding and transduction are potentiated by the
    Ig/fibronectin co-receptors Ihog and Boi, which bind Patched directly, but Patched alone is
    sufficient to retain and sequester ligand.
