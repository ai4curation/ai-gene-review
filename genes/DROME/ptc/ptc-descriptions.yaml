    overall_notes: 'Correct and compact: 12-pass protein that binds, internalizes
      and degrades Hh to limit its range, and represses Smo.'
- source: Alliance_Automated
  text: Enables several functions, including hedgehog family protein binding activity;
    lipoprotein particle receptor activity; and phospholipid binding activity. Involved
    in several processes, including Bolwig's organ morphogenesis; imaginal disc development;
    and regulation of signal transduction. Located in basal plasma membrane; cilium;
    and endocytic vesicle. Colocalizes with fusome. Is expressed in several structures,
    including anterior-posterior subdivision of organism; gut section; imaginal disc;
    somatic cell of ovariole; and synaptic neuropil domain. Used to study neurodegenerative
    disease. Human ortholog(s) of this gene implicated in several diseases, including
    carcinoma (multiple); holoprosencephaly (multiple); medulloblastoma; nevoid basal
    cell carcinoma syndrome (multiple); and stomach cancer. Orthologous to human PTCH1
    (patched 1) and PTCH2 (patched 2).
