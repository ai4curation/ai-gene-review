descriptions:
- source: UniProt
  text: 'Segmentation polarity protein, which inhibits the smoothened signaling pathway
    by acting as a receptor for hedgehog morphogen (PubMed:10966113, PubMed:24302888,
    PubMed:2582494, PubMed:2797178, PubMed:8898207). In absence of hedgehog, acts
    as an inhibitor of smoothened protein (smo) by preventing smo access to cholesterol:
    mechanistically, acts as a cholesterol transporter, which depeletes cholesterol
    from the outer leaflet of plasma membrane, thereby preventing cholesterol-binding
    to the extracellular CRD region of smo (By similarity). Hedgehog-binding inhibits
    ptc cholesterol transporter activity, promoting smo activation by cholesterol
    and transduction of the smoothened signaling pathway (By similarity).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P18502
  source_id: P18502
