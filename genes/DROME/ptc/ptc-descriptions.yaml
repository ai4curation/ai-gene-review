    overall_notes: Hedgehog receptor that inhibits Smoothened. The cholesterol-transporter
      mechanism is from vertebrates (by similarity); the review explains fly Ptc control
      of Smo through PI4P and phosphatidic acid instead.
- source: Alliance_Imported
  text: patched (ptc) is a segment polarity gene that encodes a 12-pass transmembrane
    protein involved in Hh signalling regulation. ptc product contributes to the binding,
    internalization and degradation of the ligand encoded by hh, limiting its activity
    spatial range. ptc product also represses the constitutive signaling activity
    of the transmembrane protein encoded by smo.
  source_type: curated
