id: O96651
gene_symbol: Top3beta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Top3beta encodes Drosophila DNA topoisomerase 3-beta, a type IA topoisomerase that cleaves
  one strand of single-stranded or highly unwound nucleic acid through a transient 5'-phosphotyrosyl intermediate
  (catalytic Tyr332), passes the other strand, and rejoins it. Fly Top3beta weakly relaxes hypernegatively
  supercoiled DNA, can cleave A/T-rich unwound regions, and also acts as an RNA topoisomerase that interlinks
  complementary single-stranded RNA circles. It forms a stable complex with its scaffold Tdrd3, which
  stimulates both activities and connects Top3beta to FMRP and the RISC components AGO2 and p68. Through
  this complex Top3beta promotes siRNA-guided heterochromatin formation and HP1 recruitment, silencing
  of heterochromatic transposons, and expression of neuronal mRNAs such as ptk2/FAK at the neuromuscular
  junction, which is needed for normal synapse formation.
