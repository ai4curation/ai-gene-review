suggested_questions:
- question: What are the in vivo RNA substrates of Drosophila Top3beta in RISC-dependent heterochromatin
    silencing and in neuronal mRNA translation?
suggested_experiments:
- hypothesis: Top3beta catalytic activity on mRNA is required for ptk2/FAK translation at the NMJ.
  description: Rescue Top3beta mutants with wild-type or Y332F transgenes and measure ptk2 mRNA association
    with polysomes and FAK protein at NMJs, alongside CLIP to map Top3beta-bound transcripts.
