  evidence_type: IDA
  original_reference_id: PMID:27582462
  qualifier: enables
  review:
    summary: Top3beta converts two complementary single-stranded RNA circles into a double-stranded RNA
      circle, a strand-passage reaction on RNA.
    action: ACCEPT
    reason: Direct biochemical demonstration of RNA topoisomerase activity, enhanced by Tdrd3 and dependent
      on the catalytic tyrosine.
    supported_by:
    - reference_id: PMID:27582462
      supporting_text: Top3β is capable of converting two such single-stranded RNA circles into a double-stranded
        RNA circle, and this strand-annealing activity is enhanced by TDRD3.
- term:
    id: GO:0141194
    label: siRNA-mediated heterochromatin formation
  evidence_type: IGI
  original_reference_id: PMID:30470739
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0026015
  review:
    summary: Top3beta interacts with RISC and is required for heterochromatin formation and transcriptional
      silencing.
    action: ACCEPT
    reason: Top3beta mutants are defective in PEV silencing and HP1 recruitment, and RNA-binding and catalytic
      activities are both required, supporting a direct role as an RNA topoisomerase in siRNA-guided heterochromatin
      formation.
    supported_by:
    - reference_id: PMID:30470739
      supporting_text: Notably, Top3β mutants defective in either RNA binding or catalytic activity are
        deficient in promoting HP1 recruitment and silencing of transposable elements.
    - reference_id: PMID:30470739
      supporting_text: Our data suggest that Top3β may act as an RNA topoisomerase in siRNA-guided heterochromatin
        formation and transcriptional silencing.
