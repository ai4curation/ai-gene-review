- source: Alliance_Imported
  text: Topoisomerase 3&bgr; (Top3&bgr;) encodes an RNA topoisomerase that participates
    in both transcription and translation. It promotes transcription by being recruited
    by the product of Tdrd3, an epigenetic reader recognizing dimethylarginine motifs
    in core histones. It contributes to translation by complexing with the product
    of Fmr1, an RNA-binding protein deficient in fragile X mental retardation syndrome.
  source_type: curated
