- source: Alliance_Automated
  text: Enables DNA topoisomerase type I (single strand cut, ATP-independent) activity
    and RNA topoisomerase activity. Involved in DNA topological change; positive regulation
    of translation; and siRNA-mediated heterochromatin formation. Part of DNA topoisomerase
    III-beta-TDRD3 complex. Orthologous to human TOP3B (DNA topoisomerase III beta).
