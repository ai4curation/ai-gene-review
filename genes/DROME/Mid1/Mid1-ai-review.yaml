- term:
    id: GO:0016247
    label: channel regulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001813414
  - PomBase:SPAC1F5.08c
  - UniProtKB:B1AL88
  review:
    summary: PAINT inference of channel regulator activity from fission yeast Mid1 (SPAC1F5.08c) and human
      NALF1 (B1AL88) via PTN001813414.
    action: ACCEPT
    reason: 'Fly data directly support this inherited function: knockdown of Mid1/Nlf-1 suppresses the
      NA-dependent sodium current and overexpression increases it, indicating that Mid1 controls NA channel
      activity and/or localization. This is Mid1''s core molecular role.'
    supported_by:
    - reference_id: PMID:26276633
      supporting_text: Conversely, NLF-1 overexpression increases NA current, firing frequency and membrane
        potential in the evening when these parameters are typically at their troughs in wild-type flies,
        suggesting that Nlf-1 controls activity and/or localization of NA.
      reference_section_type: RESULTS
- term:
    id: GO:0034703
    label: cation channel complex
  evidence_type: IGI
  original_reference_id: PMID:24639627
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0002917
  review:
    summary: Genetic-interaction based assignment of Mid1 (CG33988) to the NA cation channel complex.
    action: MODIFY
    reason: The NA/NALCN channel complex conducts a sodium leak current, so GO:0034706 sodium channel
      complex is the appropriate, more specific term. Membership rests on co-expression and phenocopy
      in flies (IGI) and on the conserved Mid1/NALF association with NALCN-family channels; the same replacement
      is applied to all subunits (na, unc79, unc80, Mid1).
    proposed_replacement_terms:
    - id: GO:0034706
      label: sodium channel complex
    supported_by:
    - reference_id: PMID:24639627
      supporting_text: We validate this predicted association by showing that the Mid1 homolog in Drosophila,
        encoded by the CG33988 gene, is coordinately expressed with NALCN, and that knockdown of either
        protein creates identical phenotypes in several behaviors associated with NALCN function.
      reference_section_type: ABSTRACT
- term:
    id: GO:0035176
    label: social behavior
  evidence_type: IMP
  original_reference_id: PMID:24639627
  qualifier: involved_in
  review:
    summary: Neural CG33988 knockdown suppresses social clustering like na knockdown.
    action: KEEP_AS_NON_CORE
    reason: Experimentally supported, but social clustering is a downstream behavioral consequence of
      reduced NA channel function rather than a core role.
    supported_by:
    - reference_id: PMID:24639627
      supporting_text: neurally induced RNAi knockdown of na and CG33988 similarly and significantly suppressed
        the social clustering
      reference_section_type: RESULTS
- term:
    id: GO:0045475
    label: locomotor rhythm
  evidence_type: IMP
  original_reference_id: PMID:24639627
  qualifier: involved_in
  review:
    summary: Pan-neural CG33988 RNAi produces the na-like circadian locomotor defect.
    action: ACCEPT
    reason: Mid1 is required, with NA, for normal circadian locomotor activity; independently confirmed
      by suppression of behavioral rhythms on Nlf-1 knockdown (PMID:26276633).
    supported_by:
    - reference_id: PMID:24639627
      supporting_text: RNAi knockdown of CG33988 using the same pan-neural driver results in an identical
        circadian aberration (Figure 3).
      reference_section_type: RESULTS
    - reference_id: PMID:26276633
      supporting_text: Moreover, RNAi knockdown of Nlf-1 results in suppression of behavioral rhythms,
        NA expression and related current.
      reference_section_type: RESULTS
- term:
    id: GO:0098659
    label: inorganic cation import across plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001813414
  - PomBase:SPAC1F5.08c
  - UniProtKB:B1AL88
  review:
    summary: PAINT inference of inorganic cation import across the plasma membrane, from yeast Mid1 (SPAC1F5.08c)
      and human NALF1 (B1AL88) via PTN001813414.
    action: MODIFY
    reason: The Mid1/NALF clade supports channel-mediated cation entry, but in flies the conducted ion
      is sodium through the NA leak channel, whose current depends on Mid1/Nlf-1. Refine to GO:0035725
      sodium ion transmembrane transport, the term used for the NA complex pore subunit, for consistency
      across the complex.
    proposed_replacement_terms:
    - id: GO:0035725
      label: sodium ion transmembrane transport
    supported_by:
    - reference_id: PMID:26276633
      supporting_text: NA-dependent current was also strongly suppressed after Nlf-1 knockdown
      reference_section_type: RESULTS
