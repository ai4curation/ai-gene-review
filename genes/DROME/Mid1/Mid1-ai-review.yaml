  - PomBase:SPAC1F5.08c
  - SGD:S000005235
  - UniProtKB:B1AL88
  review:
    summary: PAINT inference of plasma membrane localization from yeast Mid1 (SGD:S000005235), fission
      yeast (SPAC1F5.08c) and human NALF1 (B1AL88) via PTN001813414.
    action: ACCEPT
    reason: Mid1 sits inside the Mid1/NALF clade, whose characterized members act with their cation channels
      at the plasma membrane, and the fly protein regulates the plasma membrane NA leak current. No fly
      localization data exist; nematode NLF-1 has been reported in the ER, which is recorded as an open
      question.
