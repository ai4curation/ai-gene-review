taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Mid1 (CG33988, also called Nlf-1, NCA localization factor 1) is the Drosophila member of
  the NALF/FAM155 family, a membrane protein with a cysteine-rich domain related to the yeast Mid1 subunit
  of the Cch1 calcium channel and to the mammalian NALCN auxiliary factors NALF1/NALF2. It is co-expressed
  with the sodium leak channel pore subunit NA (narrow abdomen) and acts as a positive regulator of the
  NA channel: in circadian DN1p pacemaker neurons Mid1/Nlf-1 is rhythmically transcribed under CLOCK control,
  and its level sets NA protein expression, the NA-dependent sodium leak current, resting depolarization
  and firing. Loss of Mid1 phenocopies na, disrupting circadian locomotor rhythms and social clustering.'
