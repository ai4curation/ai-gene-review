suggested_questions:
- question: Is Drosophila Mid1/Nlf-1 a stable component of the NA channel at the plasma membrane, as for
    mammalian NALF1 with NALCN, or an ER-resident factor that promotes NA trafficking, as reported for
    nematode NLF-1?
suggested_experiments:
- description: Tag endogenous Mid1 and NA and test co-immunoprecipitation from fly heads and subcellular
    co-localization (ER versus plasma membrane) in clock neurons.
