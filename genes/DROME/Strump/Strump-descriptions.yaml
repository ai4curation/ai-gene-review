    overall_notes: 'Correct: WASH complex component regulating Wash NPF activity and
      endosomal targeting, and a negative result for hemocyte migration. Mostly by
      similarity; omits nuclear envelope budding.'
- source: Alliance_Automated
  text: Involved in endocytic recycling and nuclear envelope budding. Located in nucleoplasm.
    Part of WASH complex. Colocalizes with nuclear envelope. Is expressed in adult
    head. Human ortholog(s) of this gene implicated in Ritscher-Schinzel syndrome
    1 and hereditary spastic paraplegia 8. Orthologous to human WASHC5 (WASH complex
    subunit 5).
