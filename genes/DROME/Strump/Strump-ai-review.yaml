gene_symbol: Strump
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Strumpellin (Strump, CG12272; WASHC5 ortholog, homologous to the human hereditary spastic
  paraplegia gene KIAA0196) is the large alpha-solenoid subunit of the pentameric WASH complex, together
  with Wash, FAM21, CCDC53 and SWIP. With SWIP it forms the structural core that holds the Arp2/3-activating
  Wash subunit in a regulated state and positions the complex on endosomes, where branched actin patches
  sort cargo into recycling and retrograde tubules. The fly WASH complex is required for recycling of
  integrins and V-ATPase and, together with capping protein and Arp2/3, for nuclear envelope budding.
  In flies the WASH regulatory complex, which includes Strumpellin, also contributes to oogenesis.
