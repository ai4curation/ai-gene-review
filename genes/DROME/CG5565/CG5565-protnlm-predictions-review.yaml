  title: CG5565 comparison with human PUDP
  findings:
  - statement: The target aligns across almost all human PUDP residues and retains the mapped catalytic
      Asp positions.
    supporting_text: The native 240-residue CG5565 protein aligns across 226 of 228 human PUDP/Q08623
      residues, with 98 identical aligned positions (43.4% of aligned pairs). Human annotated catalytic
      Asp14 and Asp16 map to target Asp16 and Asp18.
- id: PMID:20722631
  title: HDHD1, which is often deleted in X-linked ichthyosis, encodes a pseudouridine-5'-phosphatase.
  findings:
  - statement: Purified human HDHD1/PUDP strongly prefers pseudouridine 5'-phosphate among the tested
      phosphate esters; this is the characterized ortholog evidence.
    supporting_text: 'Purified human

      recombinant HDHD1 dephosphorylated pseudouridine 5''-phosphate with a kcat of 1.6

      s-1, a Km of 0.3 μM and a catalytic efficiency at least 1000-fold higher than

      that on which it acted on other phosphate esters, including 5''-UMP.'
