description: The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for Q9VQ04.
  Phosphatase activity (GO:0016791) is a supported omission candidate; pseudouridine 5'-phosphatase activity
  (GO:1990738) is a more specific candidate supported by FlyBase's manual ortholog transfer to experimentally
  characterized human PUDP, together with near-complete sequence alignment and retained catalytic Asp
  positions. The substrate assignment is an orthology-based inference, not a direct CG5565 assay; the
  alignment alone does not establish substrate specificity. The separate FUNCTION claim of in-vitro D,L-glyceraldehyde
  3-phosphate dephosphorylation remains UNC and is not disproved by the better-supported physiological
  substrate. This completed record assesses the absence of GO output; predictions is empty because no
  GO or EC prediction was emitted. The narrative judgment remains in the linked function review and is
  not a score assigned to the omission.
