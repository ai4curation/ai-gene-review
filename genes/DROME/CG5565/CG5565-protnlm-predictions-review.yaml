description: The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for Q9VQ04.
  The re-reviewed gene supports pseudouridine 5'-phosphatase activity (GO:1990738), already carried in
  GOA by FlyBase ISS transfer from experimentally characterized human PUDP and by the PAINT IBD at PANTHER
  node PTN000431252, under which CG5565 descends; the broader phosphatase activity (GO:0016791) is also
  already annotated. An emitted prediction of either term would therefore not be novel. The near-complete
  alignment to human PUDP with retained catalytic Asp16/Asp18 supports the HAD phosphatase activity, but
  the substrate assignment is an orthology-based inference, not a direct CG5565 assay, and no CG5565
  publication was found in PubMed. The separate ProtNLM2 FUNCTION text claiming in-vitro D,L-glyceraldehyde
  3-phosphate dephosphorylation is UNC and is not disproved by the better-supported physiological substrate.
  This completed record assesses the absence of GO output; predictions is empty because no GO or EC
  prediction was emitted.
