  label: Drosophila melanogaster
description: CG5565 is a 240-residue haloacid dehalogenase-family protein predicted to dephosphorylate
  pseudouridine 5′-phosphate, based on its relationship to the characterized human PUDP enzyme. This activity
  removes phosphate from a modified nucleotide derived from RNA. Its precise substrate range, physiological
  role and subcellular location have not been directly established in Drosophila.
