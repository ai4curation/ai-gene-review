  review:
    summary: PAINT places generic phosphatase activity at the eukaryotic node PTN000431251, from which
      CG5565 descends. The term is correct, but CG5565 also descends from the Unikont node
      PTN000431252, which carries the more specific pseudouridine 5'-phosphatase IBD seeded by human
      PUDP and yeast YKL033W-A.
    action: MODIFY
    reason: The broad phosphatase IBD is phylogenetically sound and CG5565 retains the HAD catalytic
      Asp pair, so the claim holds. It is less specific than the evidence allows. A PANTHER 19 tree
      walk places CG5565 under PTN000431252, the node bearing the GO:1990738 IBD (dated 20260729 and
      not yet propagated to GOA, which is why this snapshot carries only the PTN000431251 term).
      GO:1990738 is_a phosphatase activity and the gene already carries it by FlyBase ISS, so
      refine to it. The plant glycerol-3-phosphatase IBD placed in the bikont lineage
      (PTN008360158) is not inherited by CG5565 and is deliberately not proposed.
