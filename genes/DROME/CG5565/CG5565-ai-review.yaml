    id: GO:1990738
    label: pseudouridine 5'-phosphatase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q08623
  review:
    summary: FlyBase transfer from human PUDP (Q08623), whose purified recombinant enzyme is kinetically
      selective for pseudouridine 5'-phosphate. The transfer is phylogenetically grounded. CG5565 and
      human PUDP both descend from PANTHER node PTN000431252, where PAINT curators independently
      placed the same function.
    action: ACCEPT
    reason: The donor activity is directly measured (PMID:20722631). The relationship is established
      by tree placement, not similarity alone. CG5565 is a co-ortholog of human PUDP through a
      dipteran duplication (PTN000431298) and lies below the PTN000431252 IBD for GO:1990738. The
      SF38 (fly) versus SF43 (human) subfamily labels do not argue against transfer, because SF43
      arises only after a recent Catarrhini duplication and mouse Pudp is SF38. The catalytic Asp
      pair is conserved. Caveat - no fly paralog has been assayed, and post-duplication substrate
      divergence among the five fly paralogs cannot be excluded.
    supported_by:
    - *id001
    - *id004
    - &id005
      reference_id: file:DROME/CG5565/CG5565-bioinformatics/RESULTS-rereview.md
      supporting_text: The SF38 (CG5565) versus SF43 (human PUDP) label difference therefore reflects
        a recent primate-lineage split, not a deep divergence separating the fly gene from the
        characterised mammalian enzyme.
    - *id003
