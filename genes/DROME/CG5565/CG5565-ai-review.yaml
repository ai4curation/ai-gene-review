  label: Drosophila melanogaster
description: CG5565 encodes a 240-residue haloacid dehalogenase (HAD) subfamily IA
  phosphatase of the Gpp1/Gpp2-like (PTHR18901) family, with an intact N-terminal DxD catalytic
  motif (Asp16/Asp18). It is one of five Drosophila paralogs (with Gs1l, CG5561, CG5556 and CG5564)
  produced by a dipteran-lineage duplication within the eukaryotic clade that includes human and
  mouse PUDP and yeast YKL033W-A. Human PUDP is a highly selective pseudouridine 5'-phosphatase, which
  dephosphorylates pseudouridine 5'-phosphate released by turnover of pseudouridine-containing RNA so
  that free pseudouridine can be excreted. CG5565 is therefore predicted to have the same activity,
  but the fly protein has not been assayed, and whether all five paralogs retain this substrate
  preference is unknown. CG5565 transcripts are strongly testis-enriched and the protein has been
  detected in the sperm proteome; no loss-of-function phenotype linked to its enzymatic activity has
  been reported.
