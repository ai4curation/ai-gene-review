core_functions:
- description: Predicted hydrolysis of pseudouridine 5'-phosphate to pseudouridine and phosphate, the
    activity of the human and yeast PUDP enzymes. CG5565 inherits it through descent from the PANTHER
    Unikont node PTN000431252 and retains the HAD catalytic Asp pair. The fly protein has not been
    assayed.
  molecular_function:
    id: GO:1990738
    label: pseudouridine 5'-phosphatase activity
  supported_by:
  - *id001
  - *id004
  - *id003
suggested_questions:
- question: Have all five dipteran PUDP-clade paralogs (CG5565, Gs1l, CG5561, CG5556, CG5564) retained
    pseudouridine 5'-phosphate selectivity after the PTN000431298 duplication, or has the strongly
    testis-enriched CG5565 diverged in substrate preference?
suggested_experiments:
- description: Express recombinant CG5565 and assay phosphatase activity against pseudouridine
    5'-phosphate, UMP and other sugar or nucleotide phosphates, in parallel with Gs1l, to obtain
    kinetic constants comparable to those measured for human PUDP.
  experiment_type: in vitro enzyme kinetics
- description: Measure pseudouridine 5'-phosphate and free pseudouridine in testis and whole-fly
    extracts from CG5565 loss-of-function or RNAi animals, alone and combined with paralog
    knockdown, to test whether CG5565 contributes to pseudouridine 5'-phosphate clearance in vivo.
  experiment_type: metabolomics
