    overall_notes: 'Correct and current: MCIA complex member in complex I assembly.'
- source: Alliance_Imported
  text: Enigma (Egm) encodes a mitochondrial acyl-CoA dehydrogenase that catalyzes
    the first of the four reactions of fatty acid beta-oxidation, which consists in
    the dehydrogenation of fatty acyl-CoA thioesters to generate (2E)-enoyl-CoA. The
    electrons produced are transferred to the mitochondrial respiratory chain via
    the FAD regeneration system.
  source_type: curated
  url: https://flybase.org/reports/Egm.html
  source_id: FB:FBgn0086712
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 2
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 1
    - rubric: specificity
      score: 3
    overall_notes: Describes Egm only as an acyl-CoA dehydrogenase in fatty acid beta-oxidation
      feeding electrons to the respiratory chain. The review says this activity has
      not been shown for the fly protein and that the essential role is complex I
      assembly.
- source: Alliance_Automated
  text: Predicted to enable acyl-CoA dehydrogenase activity and protein-macromolecule
    adaptor activity. Involved in several processes, including compound eye morphogenesis;
    fatty acid beta-oxidation using acyl-CoA dehydrogenase; and negative regulation
    of cellular response to oxidative stress. Located in mitochondrial matrix. Part
    of mitochondrial complex I intermediate assembly complex. Is active in mitochondrion.
    Is expressed in several structures, including adult head; adult heart; anterior
    endoderm; embryonic/larval midgut primordium; and gut section. Used to study nuclear
    type mitochondrial complex I deficiency 20. Human ortholog(s) of this gene implicated
    in nuclear type mitochondrial complex I deficiency 20. Orthologous to human ACAD9
    (acyl-CoA dehydrogenase family member 9).
  source_type: automated
  url: https://flybase.org/reports/Egm.html
  source_id: FB:FBgn0086712
