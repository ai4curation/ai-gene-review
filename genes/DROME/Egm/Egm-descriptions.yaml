- source: RefSeq
  text: Predicted to enable medium-chain fatty acyl-CoA dehydrogenase activity; protein-macromolecule
    adaptor activity; and very-long-chain fatty acyl-CoA dehydrogenase activity. Involved
    in several processes, including compound eye morphogenesis; fatty acid beta-oxidation;
    and negative regulation of cellular response to oxidative stress. Located in mitochondrial
