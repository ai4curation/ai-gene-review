findings:
- category: discrepancy
  text: FlyBase describes Egm as a beta-oxidation acyl-CoA dehydrogenase; UniProt
    and the review make it an MCIA complex I assembly factor whose dehydrogenase activity
    is undemonstrated in flies.
  sources:
  - Alliance_Imported
  - UniProt
review:
