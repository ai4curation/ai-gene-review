core_functions:
- description: >-
    Egm (dACAD9) is a core component of the mitochondrial complex I intermediate assembly (MCIA)
    complex and functions as a protein-macromolecule adaptor/scaffold that, together with the
    Drosophila orthologs of ECSIT and NDUFAF1, drives biogenesis of the membrane-arm PP-b (ND2)
    sub-module of respiratory chain complex I. Loss of Egm stalls CI assembly intermediates
    and destabilizes the partner MCIA factors, mirroring the essential, conserved CI-assembly
    role of human ACAD9.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0160295
    label: mitochondrial complex I intermediate assembly complex
  supported_by:
  - reference_id: PMID:34386730
    supporting_text: RNAi-mediated knockdown of dACAD9 resulted in a reduction in the 
      amount of dNDUFAF1 and dECSIT that accumulates in AIs in ACAD9-kd samples
  - reference_id: PMID:34386730
    supporting_text: ACAD9 regulates biogenesis of some sub-assemblies in the PP-b 
      sub-module
  - reference_id: PMID:34386730
    supporting_text: all 5 components of the MCIA complex were associated with 
      subcomplexes in FAF4-kd and FAF3-kd samples
proposed_new_terms: []
suggested_questions:
- question: >-
    Does Drosophila Egm retain measurable FAD-dependent acyl-CoA dehydrogenase activity, and
    if so with what chain-length preference? By orthology to human ACAD9 a residual long/very-long-chain
    activity is expected, but the fly protein has never been enzymatically characterized, so
    the ISS/IEA enzymatic annotations remain unverified for Drosophila.
- question: >-
    Are the lipid-homeostasis, oxidative-stress and lifespan phenotypes of Egm mutants (PMID:16434470)
    a direct consequence of loss of an acyl-CoA dehydrogenase enzyme, or downstream effects
    of complex I / OXPHOS deficiency? The 2006 study predates the CI-assembly-factor paradigm,
    and the two interpretations make different predictions for a catalytically dead but assembly-competent
    allele.
suggested_experiments:
- description: >-
    Test the assembly-vs-enzyme separation of function in vivo by rescuing Egm-null larvae with
    (a) wild-type Egm, (b) a catalytically inactive (predicted active-site) Egm variant, and
    (c) a variant predicted to disrupt ECSIT/MCIA binding, then assay complex I assembly (BN-PAGE),
    CI activity, triglyceride levels, oxidative-stress resistance and viability. This would
    establish whether the essential function and the metabolic/longevity phenotypes depend on
    the CI-assembly activity, the dehydrogenase activity, or both.
  hypothesis: >-
    The CI-assembly (adaptor) function of Egm, not its residual dehydrogenase activity, accounts
    for
    its essential role and for the lipid/oxidative-stress/lifespan phenotypes, paralleling human
    ACAD9 where a catalytically dead mutant still rescues CI biogenesis.
- description: >-
    Biochemically characterize recombinant Egm: measure FAD occupancy and acyl-CoA dehydrogenase
    activity across a chain-length substrate panel (medium-, long-, very-long-chain acyl-CoA),
    and test whether the fly ECSIT ortholog induces deflavination of Egm as it does for human
    ACAD9.
  hypothesis: >-
    Egm binds FAD and has modest long/very-long-chain (not medium-chain) acyl-CoA dehydrogenase
    activity that is downregulated by ECSIT binding, consistent with the conserved deflavination
    switch of human ACAD9.
