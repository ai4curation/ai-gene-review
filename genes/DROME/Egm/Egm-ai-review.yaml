    summary: The physiological medium-chain catabolic role of Egm remains unresolved.
    action: UNDECIDED
    reason: PTN000098033 carries the current PAINT IBD, but the served v19 tree lacks both
      that node and exact Egm leaf, so an MCAD-only target ancestry was not established. 
