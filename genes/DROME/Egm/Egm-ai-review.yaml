    action: KEEP_AS_NON_CORE
    reason: >-
      As an ACAD-family member, Egm is plausibly involved in fatty acid metabolism (consistent
      with the reduced-triglyceride phenotype of null larvae; PMID:16434470), but this is a
      broad parent term and a secondary function relative to CI assembly. Human ACAD9 has genuine,
      separable fatty-acid oxidation capacity (PMID:25721401); the established fly MCIA role
      does not demonstrate loss of catalysis. Target enzymatic specificity remains inferred.
    supported_by:
    - reference_id: PMID:16434470
