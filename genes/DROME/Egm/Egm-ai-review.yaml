- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetically inferred role in the acyl-CoA dehydrogenase step of fatty acid beta-oxidation.
      Egm belongs to the ACAD family and retains the ACAD fold, so a residual FAO-enzyme role
      is plausible by orthology to human ACAD9. However, the fly protein's dehydrogenase activity
      has not been directly demonstrated, and its dominant role is CI assembly. Retained as
      a non-core, by-similarity annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      By orthology to human ACAD9 (a bona fide, if secondary, acyl-CoA dehydrogenase), Egm may
      contribute to the ACAD step of beta-oxidation, and homology-plus-phenotype evidence in
      the fly (PMID:16434470) is consistent with a lipid-metabolism role. This is a plausible
      secondary function but not the core function, which is CI assembly. Human ACAD9 has genuine,
      separable fatty-acid oxidation capacity (PMID:25721401); the established fly MCIA role
      does not demonstrate loss of catalysis. Target enzymatic specificity remains inferred.
    supported_by:
    - reference_id: PMID:16434470
      supporting_text: homology to ACADs, the enzymes that catalyze the first of four 
        reactions that constitute one cycle of the β-oxidation pathway
