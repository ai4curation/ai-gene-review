# --- Annotation 7: fatty acid metabolic process (IEA, ARBA) ---
- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      ARBA machine-learning electronic annotation placing Egm in fatty acid metabolism, based
      on ACAD family membership. Plausible by orthology to human ACAD9's secondary FAO activity,
      but broad and not directly demonstrated for the fly protein. Retained as a non-core, by-similarity
