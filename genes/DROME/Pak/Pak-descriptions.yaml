descriptions:
- source: UniProt
  text: Protein kinase involved in intracellular signaling pathways downstream of
    integrins and receptor-type kinases that plays an important role in cytoskeleton
    dynamics, in cell adhesion, migration, proliferation, apoptosis, mitosis, and
    in vesicle-mediated transport processes. May be required for the formation of
    dendritic spines and excitatory synapses (By similarity). During muscle embryogenesis,
    promotes proper muscle morphogenesis, as well as guidance and targeting of subsets
    of myotubes (PubMed:18996366). In the developing eye, required for guidance and
    targeting of photoreceptor (R cell) axon projections but not for axon outgrowth,
    differentiation or target induction (PubMed:10399914). Activated by a Rac-mediated
    signaling pathway that controls axon outgrowth and guidance (PubMed:10847683,
    PubMed:10798395). Is recruited to membranes by dock/dreadlocks, probably when
    dock/dreadlocks is associated with activated receptors (PubMed:10399914).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VI13
