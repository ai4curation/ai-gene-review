    overall_notes: 'Correct: Rac/Cdc42 effector kinase in growth cone guidance, synaptic
      development and epithelial morphogenesis.'
- source: Alliance_Automated
  text: Enables SH3 domain binding activity; protein serine/threonine kinase activity;
    and small GTPase binding activity. Involved in several processes, including autophagic
    cell death; dorsal closure, spreading of leading edge cells; and regulation of
    synapse organization. Located in several cellular components, including cell leading
    edge; lateral plasma membrane; and muscle cell postsynaptic specialization. Is
    active in neuromuscular junction. Colocalizes with actin filament and focal adhesion.
    Is expressed in several structures, including adult somatic muscle cell; amnioserosa;
    ganglia; head epidermis primordium; and tract. Human ortholog(s) of this gene
    implicated in breast disease (multiple); intellectual disability (multiple); ovarian
    disease; renal cell carcinoma; and schizophrenia. Orthologous to human PAK1 (p21
    (RAC1) activated kinase 1); PAK2 (p21 (RAC1) activated kinase 2); and PAK3 (p21
    (RAC1) activated kinase 3).
