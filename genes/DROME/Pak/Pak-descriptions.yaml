- source: Alliance_Imported
  text: p21-activated kinase (Pak) encodes a serine/threonine effector kinase for
    the small GTPases Rac and the product of Cdc42 involved in cytoskeletal regulation.
    The product of Pak contributes to growth cone guidance, synaptic development,
    and epithelial morphogenesis in both the ovary and embryo.
  source_type: curated
  url: https://flybase.org/reports/Pak.html
  source_id: FB:FBgn0267698
