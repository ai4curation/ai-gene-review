suggested_questions:
- question: Which substrates does Drosophila Pak phosphorylate in growth cones and at the postsynaptic NMJ (e.g.
    LIM kinase, Dlg, cytoskeletal regulators), and is direct phosphorylation needed for each in vivo function?
- question: How does Pak, a cytoplasmic kinase, act as an ecdysone secondary response gene required for transcriptional
    induction of death effectors in salivary glands?
- question: Should GOA represent Pak's role in septate junction formation (recruiting the Scribble complex) as a
    scaffolding activity independent of kinase activity?
suggested_experiments:
- experiment_type: Phosphoproteomics
  hypothesis: Postsynaptic Pak phosphorylates specific NMJ proteins (including Dlg) to control SSR development,
    separately from the Dock-dependent glutamate receptor branch.
  description: Compare muscle phosphoproteomes of wild type, pak null and kinase-dead (K459A) rescue larvae, and
    test identified sites by phospho-mutant rescue.
- experiment_type: In vitro kinase assay
  hypothesis: Drosophila Pak is activated by GTP-Rac/Cdc42 and phosphorylates LIM kinase in the activation loop.
  description: Purify recombinant Pak, Pak-K459A and Pak-HTVH/LTVL, assay autophosphorylation and LIMK phosphorylation
    with and without GTPgammaS-loaded Rac1 or Cdc42.
