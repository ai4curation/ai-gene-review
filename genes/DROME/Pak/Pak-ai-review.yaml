    summary: Cytoskeleton (located_in) based on a mutant phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited result is that loss of dPak disrupts the leading-edge cytoskeleton, a phenotype; a phenotype
      cannot establish that Pak is a cytoskeletal component. Pak colocalizes with actin structures (captured by
      the separate colocalizes_with actin filament IDA row) and acts on the cytoskeleton as a signalling kinase,
      so located_in cytoskeleton overstates the evidence.
