id: Q9VI13
gene_symbol: Pak
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pak (DPAK, dPak) is the Drosophila group I p21-activated kinase, an ortholog of mammalian PAK1-3. It
  is a STE20-family serine/threonine kinase with an N-terminal PXXP motif that binds the SH3 domain of the adaptor
  Dock (Dreadlocks), a CRIB/GTPase-binding and autoinhibitory region that binds GTP-bound Rac and Cdc42, and a C-terminal
  kinase domain. Recruited to activated guidance receptors (Dscam, Robo) by Dock and activated by Rac downstream
  of the Trio GEF, Pak relays guidance signals to the actin cytoskeleton in growth cones and is required for photoreceptor,
  olfactory, Bolwig's nerve and CNS midline axon guidance. At the larval neuromuscular junction, postsynaptic Pak
  (localized by the RhoGEF dPix and partnered with Git) controls glutamate receptor abundance and subsynaptic reticulum
  development. In epithelia Pak is enriched at the leading edge and at adhesion sites, where it maintains the leading-edge
  cytoskeleton during dorsal closure, promotes septate junction formation by recruiting the Scribble complex, and
  organizes basal F-actin in follicle cells; it also contributes to myotube guidance and ecdysone-triggered tissue
  responses during metamorphosis.
