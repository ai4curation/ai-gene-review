descriptions:
- source: Alliance_Imported
  text: glorund (glo) encodes a hnRNP F/H family RNA-binding protein that binds directly
    to nanos mRNA and regulates its translation during late stages of oogenesis. The
    functions of the product of glo include nurse cell nuclear chromatin organization,
    axis patterning as well as being required for viability to adulthood.
  source_type: curated
  url: https://flybase.org/reports/glo.html
  source_id: FB:FBgn0259139
