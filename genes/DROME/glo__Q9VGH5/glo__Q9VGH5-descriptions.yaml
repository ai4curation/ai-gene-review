      score: 4
    overall_notes: 'Correct: binds nanos mRNA and represses translation in late oogenesis.
      Nurse cell chromatin organization is presented as a function, though the review
      treats it as an indirect phenotype.'
- source: Alliance_Automated
  text: Predicted to enable mRNA binding activity. Involved in chromosome organization;
    oocyte axis specification; and regulation of translation. Part of protein-containing
    complex. Is expressed in adult head; embryonic brain; embryonic/larval midgut;
    and larval ventral nerve cord. Human ortholog(s) of this gene implicated in Sjogren's
    syndrome; bone development disease; and syndromic X-linked intellectual developmental
    disorder bain type. Orthologous to several human genes including HNRNPF (heterogeneous
    nuclear ribonucleoprotein F) and HNRNPH1 (heterogeneous nuclear ribonucleoprotein
    H1).
