  - UniProtKB:P31943
  - UniProtKB:P52597
  - UniProtKB:Q6NXG1
  - UniProtKB:Q9H6T0
  review:
    summary: >-
      PAINT placed regulation of RNA splicing at PTN000360053, seeded by hnRNP F/H1, ESRP1/2,
      mouse Esrp2 and fly Fusilli. Glo is in its own PANTHER subfamily (SF76), so this is an
      ancestral-node inference rather than a subfamily transfer. Drosophila data fit it but do
