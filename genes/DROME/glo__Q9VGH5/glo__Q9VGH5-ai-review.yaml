- term:
    id: GO:0043484
    label: regulation of RNA splicing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0023441
  - MGI:MGI:1917326
