      PAINT kept the broad parent term at this deep node and did not place a specific
      alternative-splicing term, so this review does not refine it by transfer. The inference is
      reasonable and is backed by Glo-specific genetic and interaction data. Splicing regulation
      by Glo is still inferred in Drosophila, not directly demonstrated.
    supported_by:
