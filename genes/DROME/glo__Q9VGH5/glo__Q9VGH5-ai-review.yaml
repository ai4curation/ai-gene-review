- term:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  evidence_type: IDA
  original_reference_id: PMID:16516833
  qualifier: enables
  review:
    summary: >-
      Glo binds a specific cis-regulatory element, stem-loop III of the nanos TCE, and represses
      translation of unlocalized nanos mRNA in the oocyte. Repression in vivo tracks Glo binding
      in vitro. Glo inhibits both initiation and elongation, the latter by recruiting dFMRP
      through qRRM2. Any two qRRMs are sufficient to repress nanos in vivo.
    action: NEW
    reason: >-
      This is the best-defined molecular activity of Glo and is experimentally established in
      Drosophila. Glo itself binds the regulatory element, and the repression depends on that
      binding, so this is participation rather than mere necessity. The term (no children) is
      the precise MF and is not an ancestor or descendant of other terms on the gene apart from
      the binding parents.
    supported_by:
    - reference_id: PMID:16516833
      supporting_text: We establish that the ability of the TCE to repress translation in vivo
        reflects its ability to bind Glorund in vitro.
    - reference_id: PMID:37427795
      supporting_text: In vivo experiments further indicated that any two qRRMs are sufficient
        to repress nos translation.
    - reference_id: PMID:35699205
      supporting_text: Our findings suggest that Glo regulates nos translation elongation by recruiting
        dFMRP
