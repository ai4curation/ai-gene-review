id: Q9VGH5
gene_symbol: glo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Glorund (Glo, CG6946) is the Drosophila member of the hnRNP F/H-related RNA-binding protein
  family. Its full-length 586-residue product (isoforms A, B and D) has three quasi-RNA
  recognition motifs (qRRMs) separated by low-complexity, glycine-rich segments. Glo occurs in
  both the nucleus and the cytoplasm of ovarian germline and somatic cells. In late oocytes it
  binds the structured translational control element (TCE) in the nanos mRNA 3' UTR and
  represses translation of unlocalized nanos mRNA, which restricts Nanos protein to the posterior
  pole. It blocks both translation initiation and a post-initiation step; for the latter it
  recruits the fragile X protein dFMRP through its qRRM2 domain, causing ribosome stalling. Each
  qRRM has two RNA-recognition surfaces, one for G-tract RNA and one for the UA-rich TCE motif.
  Crystal structures and mutagenesis show that any two qRRMs are enough to recognise and repress
  nanos. Glo also binds the splicing-associated proteins Hrp48 (Hrb27C) and Half-pint (PUF68)
  directly. It is needed for nurse-cell chromosome dispersion, gurken mRNA localization and
  dorsal-ventral patterning of the egg chamber, all of which depend only on its G-tract binding
  mode and are rescued by the Otu-104 splice isoform of ovarian tumor. This points to a nuclear
  role in alternative splicing, although no splicing change has been shown directly. glo is
  required for viability to adulthood. RNAi studies also implicate it in lipid storage and
  lipoprotein gene expression in the fat body and gut.
