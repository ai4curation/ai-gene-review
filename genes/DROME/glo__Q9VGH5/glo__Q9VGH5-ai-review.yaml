- id: file:DROME/glo__Q9VGH5/glo__Q9VGH5-bioinformatics/RESULTS.md
  title: glo (Q9VGH5) PANTHER placement and isoform comparison
  findings: []
core_functions:
- description: >-
    Sequence- and structure-specific mRNA-binding translational repressor. In late oocytes Glo
    binds the translational control element (G-tract plus structured UA-rich stem-loop III) in
    the nanos 3' UTR through tandem qRRMs, any two of which suffice. It represses translation of
    unlocalized nanos mRNA at initiation and at elongation, and for the elongation block it
    recruits dFMRP through its qRRM2 domain. This activity is experimentally established in
    Drosophila.
  molecular_function:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  directly_involved_in:
  - id: GO:0017148
    label: negative regulation of translation
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:16516833
    supporting_text: We establish that the ability of the TCE to repress translation in vivo reflects
      its ability to bind Glorund in vitro.
  - reference_id: PMID:37427795
    supporting_text: In vivo experiments further indicated that any two qRRMs are sufficient to
      repress nos translation.
  - reference_id: PMID:35699205
    supporting_text: Our findings suggest that Glo regulates nos translation elongation by recruiting
      dFMRP
- description: >-
    G-tract RNA-binding activity of each qRRM, used in the nucleus with the directly bound
    partners Hrp48 and the splicing factor Half-pint. This is proposed to regulate alternative
    splicing of ovarian tumor (production of Otu-104), which is needed for nurse-cell chromosome
    dispersion and gurken-dependent dorsal-ventral patterning. G-tract binding and the
    partner interactions are experimentally established. The splicing role is supported by the
    deep PAINT node (PTN000360053) and genetic rescue but has not been shown directly in
    Drosophila.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  directly_involved_in:
  - id: GO:0043484
    label: regulation of RNA splicing
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:28380354
    supporting_text: Our finding that the G-tract binding mode alone is required for Glo function
      in dorsal-ventral patterning and chromosome dispersion supports this idea.
  - reference_id: PMID:19013444
    supporting_text: plays a role both in mRNA localization and nurse cell chromosome organization,
      probably by regulating alternative splicing of ovarian tumor
suggested_questions:
- question: >-
    Does Glo directly regulate otu alternative splicing (Otu-104 versus Otu-98)? Which other
    pre-mRNAs require the Glo G-tract binding mode, and does Glo act with Hfp and Hrp48 on the
    same introns?
- question: >-
    Glo sits in its own PANTHER subfamily (PTHR13976:SF76), separate from the mammalian hnRNP
    F/H subfamilies. Which hnRNP F/H functions beyond the PAINT-propagated RNA binding, nucleus
    and splicing regulation (for example polyadenylation or G-quadruplex recognition) are
    conserved in Glo?
- question: >-
    Isoform C (Q8INJ6) contains only qRRM1 and part of qRRM2. Since any two intact qRRMs are
    needed for nanos repression, does this short product have any independent function, or does
    it act as a regulator or dominant-negative of full-length Glo?
suggested_experiments:
- description: >-
    RNA-seq of glo germline-clone ovaries, together with Glo CLIP from ovaries, to identify
    G-tract targets and test directly whether otu exon usage and other splicing events depend
    on Glo and on its G-tract binding residues (W58, Y155, Y490).
- description: >-
    Tethering assay (lambdaN-Glo variants on a reporter lacking the TCE) in an ovary-extract
    translation system, to separate Glo's own repressive activity from dFMRP recruitment by
    qRRM2.
