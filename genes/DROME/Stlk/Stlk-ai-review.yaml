taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Stlk is the Drosophila ortholog of STRAD (STE20-related kinase adaptor), a STE20-family
  pseudokinase that lacks key catalytic residues and is not known to have phosphotransferase activity.
  It acts as a regulatory cofactor of the tumor-suppressor kinase LKB1: together with the scaffold Mo25
  it forms the LKB1-Stlk-Mo25 heterotrimer, in which STRAD binding allosterically activates LKB1 and promotes
  its cytoplasmic retention. The complex phosphorylates and activates AMPK and AMPK-related kinases, linking
  LKB1 to energy-stress signalling and to restraint of TORC1-driven cell and organ growth.'
