- description: >-
    Sequence-specific binding to RNA polymerase II regulatory DNA at promoters and enhancers,
    via four C2H2 zinc fingers (CAA-repeat containing sites).
  molecular_function:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
