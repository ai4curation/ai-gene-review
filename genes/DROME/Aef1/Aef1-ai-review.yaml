  review:
    summary: >-
      Aef1 binds specific sites in RNA polymerase II gene enhancers (Adh adult enhancer, yolk
      protein and Fbp1 enhancers) and the Adh proximal promoter initiator region; DNase I
      footprinting and EMSA with recombinant protein confirm sequence-specific binding.
    action: ACCEPT
    reason: >-
      The IBA is consistent with direct experimental evidence on Aef1 itself (nuclear extract
      binding, recombinant protein footprinting, binding-site mutations that de-repress Adh
      in vivo) and with ChIP-seq motif enrichment. The four C2H2 zinc fingers provide the DNA
      binding domain. The term is as specific as warranted for a factor binding both
      promoters and enhancers.
    supported_by:
    - reference_id: PMID:1508206
      supporting_text: We have identified a protein in Drosophila nuclear extracts that binds
        specifically to a site within the AAE (adult enhancer factor 1 [AEF-1]).
