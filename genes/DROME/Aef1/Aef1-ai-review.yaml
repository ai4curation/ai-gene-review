gene_symbol: Aef1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Aef1 (Adult enhancer factor 1, CG5683) is a 308-aa nuclear Drosophila protein with an
  N-terminal low-complexity region rich in glutamine and alanine and four tandem C-terminal
  C2H2 zinc fingers. It was identified as a sequence-specific DNA-binding protein from
  nuclear extracts that binds a negative control element in the fat body-specific Adh adult
  enhancer (AAE) and in yolk protein gene enhancers, and acts as a transcriptional repressor
  of these elements in cotransfection and in transgenic flies. AEF-1 binding sites restrict
  ectopic (ovarian) activity of the yolk protein fat body enhancer, where the female
  doublesex protein antagonizes it, and AEF-1 represses the Adh proximal promoter during
  the larval-to-adult promoter switch and the ecdysone-responsive Fbp1 enhancer outside the
  fat body, where it is antagonized by GATAb. Genome-wide profiling in S2 cells places Aef1
  at nucleosome-depleted promoters and putative enhancers co-occupied by SAGA, dSWI/SNF,
  ORC and CBP, enriched for (CAA)n motifs, and Aef1 knockdown alters expression of several
  hundred genes, indicating a broader role as a sequence-specific RNA polymerase II
  transcription regulator. Aef1 is expressed broadly, including ovary, fat body and
  olfactory organ neurons.
