core_functions:
- description: >-
    Sequence-specific C2H2 zinc finger repressor that binds negative control elements in
    RNA polymerase II enhancers and promoters (Adh adult enhancer and proximal promoter
    initiator, yolk protein and Fbp1 fat body enhancers) and represses their transcription,
    restricting tissue- and stage-specific expression.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
