  review:
    summary: >-
      Correct, but Aef1's experimentally characterized activity is that of a sequence-specific
      repressor: it represses the Adh adult enhancer in cotransfection, mutation of its site
      de-represses Adh in vivo, and it represses the Adh proximal promoter and the Fbp1
      ecdysone response unit.
    action: MODIFY
    reason: >-
      The general DNA-binding transcription factor term is true but less specific than the
      evidence supports. Multiple independent studies (Falb and Maniatis 1992; Ren and
      Maniatis 1998; Brodu et al. 2001; An and Wensink 1995) show repressor activity on
      RNA polymerase II genes, so the row is refined to the repressor child
      GO:0001227. The genome-wide RNAi study (PMID:40771843) shows Aef1 affects hundreds of
      genes but does not establish activator activity, so an activator term is not added.
    proposed_replacement_terms:
    - id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    supported_by:
    - reference_id: PMID:1508206
      supporting_text: A cDNA encoding the AEF-1 protein was isolated and shown to act as
        a repressor of the AAE in cotransfection studies.
    - reference_id: PMID:1508206
      supporting_text: Base substitutions in the AEF-1 binding site that disrupt AEF-1 binding
        in vitro result in a significant increase in the level of Adh expression in vivo.
    - reference_id: PMID:9463385
      supporting_text: this Adh promoter switch is regulated by a zinc finger repressor protein
        (AEF-1)
    - reference_id: PMID:11493575
      supporting_text: We identified this repressor as AEF-1
