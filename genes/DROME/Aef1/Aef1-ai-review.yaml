      sites
suggested_questions:
- question: Does Aef1 act as an activator at any of the 342 genes deregulated by Aef1 RNAi
    in S2 cells, given its co-occupancy with SAGA, CBP and H3K27Ac at active promoters and
    enhancers, or is it uniformly a repressor?
- question: Does the reported Aef1 interaction with the SAGA DUB module mediate repression,
    or does it reflect a separate co-activator-linked function?
- question: Is the olfactory behaviour defect of gene-trap line BG01171 attributable to Aef1
    or to its second, unmapped pGT insertion?
suggested_experiments:
- experiment_type: Genome-wide expression with direction analysis
  description: Classify Aef1-RNAi responsive genes with Aef1 ChIP peaks as up- or
    down-regulated, and test reporter activity of representative bound enhancers with
    wild-type versus (CAA)n-mutant sites, to determine whether Aef1 is a dedicated repressor.
- experiment_type: Clean loss-of-function genetics
  description: Generate a CRISPR null or precise excision of the BG01171 insertion and
    retest olfactory trap behaviour and Adh/yolk protein expression in adult fat body.
