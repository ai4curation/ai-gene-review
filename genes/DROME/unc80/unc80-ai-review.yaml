suggested_questions:
- question: Does Drosophila UNC80 mediate regulation of NA channel activity by neuropeptide or second
    messenger signaling, as mammalian UNC80 does for NALCN?
suggested_experiments:
- description: Record the NA-dependent sodium leak current in DN1p clock neurons of unc80 mutants rescued
    with NA overexpression to separate UNC80's effect on channel gating from its effect on NA levels.
