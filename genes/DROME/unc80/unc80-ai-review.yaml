    summary: PAINT inference of cation channel activity from C. elegans unc-80 (WB:WBGene00006812) via
      PTN001589593.
    action: MODIFY
    reason: UNC80 is not a pore-forming protein; it contributes to the channel activity of the NA/NALCN
      complex, which conducts a sodium leak current. The term should be refined to GO:0005272 sodium channel
      activity and is best expressed with the contributes_to qualifier, consistent with the treatment
