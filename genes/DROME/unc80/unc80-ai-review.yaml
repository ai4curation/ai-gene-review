id: Q9VB11
gene_symbol: unc80
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: unc80 (CG18437) encodes the Drosophila ortholog of UNC80, a very large intracellular accessory
  subunit of the NALCN-type sodium leak channel. UNC80 forms a complex with the pore subunit NA (narrow
  abdomen) and with UNC79 in the fly brain, and the three proteins depend on one another post-transcriptionally
  for normal protein levels. UNC80 is required in circadian pacemaker neurons for robust circadian locomotor
  rhythms, with mutant phenotypes indistinguishable from na mutants, and its requirement cannot be bypassed
  by raising NA levels, indicating roles in channel function beyond stabilizing the pore subunit.
