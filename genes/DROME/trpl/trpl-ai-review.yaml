id: P48994
gene_symbol: trpl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: trpl encodes TRPL (transient receptor potential-like), a TRPC-type cation channel subunit
  with N-terminal ankyrin repeats, six transmembrane helices and a C-terminal TRP domain followed by two
  calmodulin-binding sites. In Drosophila photoreceptors TRPL and TRP together form the light-activated
  conductance downstream of rhodopsin, Gq and the phospholipase C NORPA; TRPL assembles mainly as homomultimers
  in vivo, can also co-assemble with TRPgamma, and is a non-selective, Ca2+-permeable channel that is
  constitutively active when expressed alone. Its activity is modulated by Ca2+/calmodulin, the immunophilin
  FKBP59, polyunsaturated fatty acids and metabolic stress. TRPL is concentrated in the rhabdomere microvillar
  membrane in the dark and translocates to the cell body in light, which tunes photoreceptor sensitivity
  (long-term adaptation). Outside the eye, TRPL acts as a camphor-activated channel in the dendrites of
  bitter gustatory receptor neurons, provides neuropeptide-evoked Ca2+ entry in Malpighian tubule principal
  cells, and is present in photoreceptor axon terminals.
