- term:
    id: GO:0005262
    label: calcium channel activity
  evidence_type: IDA
  original_reference_id: PMID:11514552
  qualifier: enables
  review:
    summary: TRPL is a Ca2+-permeable cation channel; Ca2+ influx through TRPL has been measured in Sf9
      cells, Xenopus oocytes and photoreceptors.
    action: ACCEPT
    reason: Supported by direct Ca2+-influx measurements (fura-2 in Sf9 cells, oocyte Ca2+ add-back) and
      in vivo Ca2+ entry that is abolished only when both trp and trpl are removed. TRPL is less Ca2+-selective
      than TRP, but calcium is a physiologically relevant permeant ion, so this term is accepted alongside
      the broader cation channel term.
    supported_by:
    - *id004
    - &id005
      reference_id: PMID:10908615
      supporting_text: We report that anoxia rapidly and reversibly depolarizes the photoreceptors and
        induces Ca(2+) influx into these cells in the dark.
    - *id003
