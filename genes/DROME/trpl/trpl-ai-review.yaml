- term:
    id: GO:0005261
    label: monoatomic cation channel activity
  evidence_type: IDA
  original_reference_id: PMID:10896160
  qualifier: enables
  review:
    summary: TRPL forms a constitutively active non-selective cation channel when expressed alone and
      is one of the two light-activated conductances of photoreceptors.
    action: ACCEPT
    reason: Core molecular function. TRPL homomultimers are constitutively active cation channels in heterologous
      cells and, with TRP, constitute the light-activated conductance in vivo. The channel is non-selective
      with modest Ca2+ preference, so monoatomic cation channel activity is the most accurate MF; calcium
      channel activity is also supported.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:8646774
      supporting_text: We demonstrate that the light-activated conductance is composed of TRP and TRPL
        ion channels and that each can be activated on its own.
    - &id003
      reference_id: PMID:11707492
      supporting_text: leading to activation of two classes of Ca(2+)-permeable light-sensitive channel,
        encoded by the trp and trpl genes
