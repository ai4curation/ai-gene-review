    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: UNIPROT
      slot: With/From
      requested_change: CHECK
      asserted_value: UniProtKB:P19334
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The With/From partner is TRP (UniProtKB:P19334). PMID:9215637 reports TRP-TRPL coassembly
        in vitro and in co-expression, but in vivo work (PMID:23687378) found that TRP and TRPL
        assemble exclusively as homomultimers in photoreceptors, so the TRP heteromer is not
        supported as the physiological partner. PMID:9215637 does not study TRPgamma, so no
        corrected partner can be drawn from this reference. The well-supported heteromeric
        partner of TRPL is TRPgamma (Trpgamma, UniProtKB:Q9VJJ7; PMID:10896160); consider
        a separate heterodimerization row from that paper, and either remove this row or
        qualify it as an in vitro TRP-TRPL result.
      supported_by:
      - reference_id: PMID:23687378
        supporting_text: We found that TRP and TRPL assemble exclusively as homomultimeric channels in their
          native environment.
