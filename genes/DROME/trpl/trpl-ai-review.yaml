  review:
    summary: Store-operated calcium channel activity, propagated from the TRPC clade and from a review
      of S2-cell expression.
    action: MARK_AS_OVER_ANNOTATED
    reason: TRPL expressed alone is constitutively active rather than store-operated; store-operated currents
      were reported for TRP and for TRP-TRPL co-expression in vitro, but TRP and TRPL assemble as separate
      homomultimers in vivo, and phototransduction gating is PLC-dependent and store-independent. A single
      later study inferred a store-operated mechanism for TRP/TRPL in photoreceptor axon terminals, but
      only from double-mutant loss of a depletion-induced Ca2+ signal. The store-operated claim therefore
      exceeds the evidence for TRPL itself.
