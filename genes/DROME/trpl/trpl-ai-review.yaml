  evidence_type: IGI
  original_reference_id: PMID:10908615
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003861
  review:
    summary: Anoxia opens TRP and TRPL channels in the dark; the response is abolished in trpl;trp double
      mutants.
    action: KEEP_AS_NON_CORE
    reason: The channels themselves are the effectors of the anoxic depolarization, so TRPL does part
      of the work of the response. This reflects a property of channel gating (ATP-dependent closure)
      rather than a physiological role, so it is kept as non-core.
    supported_by:
    - *id031
- term:
    id: GO:0050912
    label: detection of chemical stimulus involved in sensory perception of taste
  evidence_type: IDA
  original_reference_id: PMID:24013593
  review:
    summary: TRPL is a camphor-activated channel in bitter gustatory receptor neurons and is required
      for taste (not olfactory) avoidance of camphor.
    action: NEW
    reason: 'Participation test: TRPL is itself the sensor. Camphor activates TRPL::GFP in S2 cells that
      otherwise do not respond, and misexpressing trpl in sweet GRNs makes them respond to camphor, so
      the channel does the detecting rather than only being required for it. Comparator: other insect
      taste receptor channels activated directly by tastants (e.g. gustatory receptors, TRPA1 in bitter
      GRNs) are the gene products that carry detection-of-chemical-stimulus taste terms.'
    supported_by:
    - reference_id: PMID:24013593
      supporting_text: The transient receptor potential-like (TRPL) cation channel was a direct target
        for camphor in gustatory receptor neurons
    - reference_id: PMID:24013593
      supporting_text: To investigate whether camphor directly activated TRPL, we expressed a TRPL::GFP
        fusion protein in Drosophila S2 cells and performed Ca2+ imaging.
    - reference_id: PMID:24013593
      supporting_text: Thus, trpl was required for avoiding the taste and not the smell of camphor.
- term:
    id: GO:0030424
    label: axon
  evidence_type: IDA
  original_reference_id: PMID:22952921
  review:
    summary: TRPL is detected in photoreceptor axon terminals in the lamina and medulla.
    action: NEW
    reason: Immunostaining with a monoclonal anti-TRPL antibody, controlled on trpl;trp null tissue, shows
      TRPL in photoreceptor axons co-labelled with a photoreceptor marker. Proposed as a non-core location;
      the functional role there (store-operated Ca2+ entry supporting exocytosis) rests on double-mutant
      data and is not proposed as a process term.
    supported_by:
    - reference_id: PMID:22952921
      supporting_text: Additionally, we found TRPL in these two neuropiles, where photoreceptors synapse
        with secondary neurons.
    - reference_id: PMID:22952921
      supporting_text: These results show that PLC, PKC, TRP and TRPL are present in photoreceptor axons.
