  review:
    summary: Inositol 1,4,5-trisphosphate binding, propagated across the TRPC family.
    action: MARK_AS_OVER_ANNOTATED
    reason: No study shows that TRPL binds IP3 directly. InsP3 stimulated TRPL-mediated Ca2+ inflow in
      oocytes, but that is consistent with an indirect, IP3-receptor-dependent route; in photoreceptors,
      excitation does not require IP3 receptors. The family-level IP3-binding assertion (largely from
      mammalian TRPC-IP3R coupling) is not established for TRPL.
    supported_by:
    - reference_id: PMID:9494079
      supporting_text: InsP3 in a process that does not involve Ca2+ and calmodulin
    - reference_id: PMID:11707492
