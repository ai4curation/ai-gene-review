- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IDA
  original_reference_id: PMID:10371201
  qualifier: enables
  review:
    summary: TRPL was cloned as a calmodulin-binding protein and has two C-terminal calmodulin-binding
      sites (CBS-1, Ca2+-dependent; CBS-2) that modulate channel activity.
    action: ACCEPT
    reason: Well supported by direct biochemical binding studies (fusion proteins, peptides, labelled
      calmodulin) and by mutagenesis showing CBS-1 is needed for Ca2+/calmodulin regulation of Ca2+ inflow.
      This is a regulatory binding property of the channel rather than its primary activity, but it is
      a specific and well-established molecular function.
    supported_by:
    - &id008
      reference_id: PMID:8670063
      supporting_text: we now show that two calmodulin-binding sites are present in the C-terminal domain
        of the Trpl protein, CBS-1 and CBS-2
    - &id009
      reference_id: PMID:10371201
      supporting_text: identified two distinct sites at the C-terminus of the transient receptor potential-like
        ion channel
    - &id010
      reference_id: PMID:1314616
      supporting_text: We have isolated a number of Drosophila cDNAs on the basis of their encoding calmodulin-binding
        proteins.
