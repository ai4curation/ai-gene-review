suggested_questions:
- question: 'What gates TRPL in the rhabdomere: DAG/PUFAs, PIP2 depletion, protons, or mechanical changes
    of the microvillar membrane, and does this differ from TRP?'
- question: Does TRPL contribute to a store-operated Ca2+ entry pathway in photoreceptor axon terminals
    independently of TRP, and does it interact with Stim/Orai there?
- question: Should the TRPC-family IBA assertions of store-operated channel activity and IP3 binding be
    scoped away from TRPL, which is constitutively active when expressed alone?
suggested_experiments:
- description: Single-mutant (trpl alone, and trp alone) analysis of depletion-induced Ca2+ entry and
    FM dye exocytosis in lamina photoreceptor terminals, to assign the axonal store-operated current to
    TRPL specifically.
- description: Direct binding assays of purified TRPL (or its cytosolic domains) with radiolabelled IP3
    to test the IBA-propagated IP3-binding claim.
- description: Cryo-EM structure of TRPL homotetramer with bound calmodulin and camphor to map the ligand
    site and CBS-1/CBS-2 regulatory mechanism.
