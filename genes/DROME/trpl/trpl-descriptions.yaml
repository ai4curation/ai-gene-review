- source: Alliance_Automated
  text: Enables several functions, including calcium channel activity; calmodulin
    binding activity; and protein heterodimerization activity. Involved in several
    processes, including cellular response to anoxia; phototransduction, visible light;
    and sensory perception of sound. Located in dendrite and rhabdomere microvillus
    membrane. Part of cation channel complex and inaD signaling complex. Is expressed
    in several structures, including adult gnathal ganglion; eye disc; light-sensitive
    neurons; organism subdivision; and sense organ. Human ortholog(s) of this gene
    implicated in lung cancer. Orthologous to human TRPC4 (transient receptor potential
    cation channel subfamily C member 4) and TRPC5 (transient receptor potential cation
    channel subfamily C member 5).
