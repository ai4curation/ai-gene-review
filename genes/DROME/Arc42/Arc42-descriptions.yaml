- source: Alliance_Imported
  text: Activator-recruited cofactor subunit 42 (Arc42) encodes a mitochondrial short-chain
    acyl-CoA dehydrogenase that catalyzes the first of the four reactions of fatty
    acid beta-oxidation, which consists in the dehydrogenation of fatty acyl-CoA thioesters
    to generate (2E)-enoyl-CoA. The electrons produced are transferred to the mitochondrial
    respiratory chain via the FAD regeneration system.
