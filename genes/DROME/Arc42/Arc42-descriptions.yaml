  text: Predicted to enable short-chain fatty acyl-CoA dehydrogenase activity. Involved
    in fatty acid beta-oxidation using acyl-CoA dehydrogenase. Predicted to be located
    in mitochondrial matrix. Predicted to be active in mitochondrion. Is expressed
    in adult head; adult heart; anterior midgut primordium; embryonic/larval midgut;
    and posterior midgut primordium. Human ortholog(s) of this gene implicated in
    alcohol use disorder and short chain acyl-CoA dehydrogenase deficiency. Orthologous
    to human ACADS (acyl-CoA dehydrogenase short chain).
