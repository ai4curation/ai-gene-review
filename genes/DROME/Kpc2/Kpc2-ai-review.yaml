  label: Drosophila melanogaster
description: Kpc2 (CG11025) is the Drosophila homologue of KPC2/UBAC1, a ubiquitin-like (UBL) and ubiquitin-associated
  (UBA) domain adaptor protein. It forms the KIP1 ubiquitination-promoting complex (KPC) with the RING
  E3 ligase Kpc1; the two proteins co-immunoprecipitate from testes and are mutually required for each
  other's stability. Kpc2 is expressed in testes and sperm, exists as unmodified, monoubiquitinated and
  phosphorylated-monoubiquitinated forms (the modified form in mature sperm), and localizes with Kpc1
  to the tip of the sperm flagellum. The complex is required for localization of the polycystin-2 homologue
  Amo at the flagellar tip, and Kpc2 mutant males are sterile because their sperm are not stored in the
  female.
