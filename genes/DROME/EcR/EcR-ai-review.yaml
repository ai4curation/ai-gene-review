id: P34021
gene_symbol: EcR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: EcR (Ecdysone receptor) is the ligand-binding subunit of the insect steroid hormone receptor,
  an NR1-subfamily nuclear receptor that forms an obligate heterodimer with Ultraspiracle (USP, the RXR
  homolog). Only the EcR/USP heterodimer binds 20-hydroxyecdysone with high affinity and binds ecdysone
  response elements (EcREs) in cis-regulatory regions of target genes. In the absence of hormone the complex
  represses targets with corepressors (e.g. Alien, SMRTER); hormone binding converts it into an activator
  that recruits coactivators such as Taiman, the Trr/Cmi COMPASS-like H3K4 methyltransferase complex and
  UTX, and induces the primary-response genes (BR-C, E74, E75) that start the ecdysone transcriptional
  hierarchy. Alternative promoters and splicing produce three isoforms (EcR-A, EcR-B1, EcR-B2) that share
  the DNA- and ligand-binding domains but differ in their N-terminal AF1 regions; isoform-specific AF1
  coactivators (e.g. Cryptocephal/ATF4 for EcR-B2) and tissue-specific isoform expression underlie distinct
  tissue responses. Through this receptor activity EcR controls embryonic morphogenesis, hatching, larval
  molts, pupariation and metamorphosis, including neuronal pruning and remodelling, programmed death and
  autophagy of larval tissues, and adult functions in oogenesis, sleep, memory and lifespan.
