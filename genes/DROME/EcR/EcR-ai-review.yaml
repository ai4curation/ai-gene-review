suggested_questions:
- question: Should the IBA for negative regulation of inflammatory response (from vertebrate LXR donors)
    be pruned from the arthropod EcR branch of the NR1H PAINT tree, given no insect evidence?
- question: Is there experimental support for EcR in sperm individualization (PMID:9550716), whose abstract
    does not mention EcR?
- question: Should EcR-B2-specific coactivator binding (CRC) be recorded with isoform P34021-3, since
    the interaction requires the EcR-B2 AF1 and does not occur with EcR-B1?
- question: Is the cardioblast differentiation annotation (PMID:16284119) better represented as metamorphic
    cardiac myocyte reprogramming, since the abstract describes remodelling of differentiated larval cardiomyocytes?
suggested_experiments:
- description: Map AF1-specific coactivators for EcR-A and EcR-B1 (e.g. proximity labelling of isoform-specific
    N-termini in relevant tissues) to explain isoform-specific transcriptional outputs, analogous to CRC
    for EcR-B2.
- description: Test whether EcR/USP directly binds and represses inflammatory or immune effector genes
    in insect immune tissues (ChIP-seq plus reporter assays) to evaluate the propagated anti-inflammatory
    function.
