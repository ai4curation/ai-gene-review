  review:
    summary: Unliganded EcR/USP acts as a repressor of ecdysone target genes; the IBA is consistent with
      Drosophila evidence.
    action: ACCEPT
    reason: Genetic data show that the unliganded EcR/USP complex represses target genes until the hormone
      titre rises, and reviews describe EcR/USP as both activator and repressor in vivo. The PAINT node
      places transcriptional repression at the NR1 ancestor; EcR sits inside that clade and has direct
      Drosophila support, so the IBA is sound.
    supported_by:
    - &id020
      reference_id: PMID:16267093
      supporting_text: We propose that the unliganded receptor complex is repressive and that this repression
        is relieved as the hormone titers increase at the onset of metamorphosis
    - &id016
      reference_id: PMID:10920384
      supporting_text: functioning as both a transcriptional activator and repressor in vivo
