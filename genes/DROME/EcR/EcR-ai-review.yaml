    label: ecdysone receptor signaling pathway
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0008230
    label: ecdysone receptor holocomplex
  supported_by:
  - reference_id: PMID:1913820
    supporting_text: EcR protein binds DNA with high specificity at ecdysone response elements
  - reference_id: PMID:1913820
    supporting_text: Expression of EcR in such resistant cells by transfection restores their ability
      to respond to the hormone
  - reference_id: PMID:8247157
    supporting_text: natural ecdysones selectively promote physical association between EcR and USP, and
      conversely, that high-affinity hormone binding requires both EcR and USP
- description: Binds the steroid hormone 20-hydroxyecdysone (ecdysone) in its ligand-binding domain; high-affinity
    binding requires heterodimerisation with USP.
  molecular_function:
    id: GO:0035100
    label: ecdysone binding
  directly_involved_in:
  - id: GO:0035076
    label: ecdysone receptor signaling pathway
  locations:
