core_functions:
- description: 'Ligand-activated nuclear receptor: as the hormone-binding subunit of the EcR/USP heterodimer,
    binds ecdysone response elements and, when liganded by 20-hydroxyecdysone, activates RNA polymerase
    II transcription of ecdysone target genes.'
