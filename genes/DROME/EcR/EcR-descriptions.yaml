    overall_notes: 'Correct but narrow: ecdysone receptor binding EcREs and recruiting
      Trr for target activation. Omits USP heterodimerization, repression without
      hormone and developmental roles.'
- source: Alliance_Imported
  text: Ecdysone receptor (EcR) encodes a protein that interacts with the product
    of usp to form the nuclear ecdysone receptor heterodimer, which modulates, in
    conjunction with co-activators and co-repressors, the activities of hundreds of
    genes in a tissue- and stage-specific way. EcR is widely expressed in embryonic
    and larval tissues and in some adult tissues where its activities (modulated by
    the hormone ecdysone) trigger both molting and metamorphosis.
  source_type: curated
  url: https://flybase.org/reports/EcR.html
  source_id: FB:FBgn0000546
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: forms the nuclear receptor with Usp, modulates hundreds
      of genes with coactivators and corepressors, triggers molting and metamorphosis.
      No isoforms or targets.'
- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription factor activity,
    RNA polymerase II-specific; protein dimerization activity; and transcription coregulator
    binding activity. Involved in several processes, including heart development;
    instar larval or pupal development; and nervous system development. Acts upstream
    of with a positive effect on regulation of macroautophagy. Located in several
    cellular components, including dendrite; nucleus; and polytene chromosome. Part
    of activator ecdysone receptor complex and repressor ecdysone receptor complex.
    Is expressed in several structures, including epithelium; follicle cell; gland;
    gut section; and larval imaginal tissue. Human ortholog(s) of this gene implicated
    in artery disease (multiple); cerebrovascular disease (multiple); heart disease;
    obesity; and type 2 diabetes mellitus. Orthologous to several human genes including
    NR1H2 (nuclear receptor subfamily 1 group H member 2).
  source_type: automated
  url: https://flybase.org/reports/EcR.html
  source_id: FB:FBgn0000546
