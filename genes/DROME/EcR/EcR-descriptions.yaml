descriptions:
- source: UniProt
  text: Receptor for ecdysone (PubMed:1913820, PubMed:30293839). Binds to ecdysone
    response elements (ECRES) following ecdysone-binding, and recruitment of a complex
    containing the histone methyltransferase trr; leads to transcriptional activation
    of target genes (PubMed:1913820, PubMed:30293839).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34021
  source_id: P34021
