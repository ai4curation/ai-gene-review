core_functions: []
suggested_questions:
- question: Is CG33453 secreted, and do the PA and PB isoforms, which differ at the signal-peptide region
    and by one residue in the mature chain, differ in secretion or processing?
- question: Is the large dipteran expansion of PTHR20898:SF0 functionally coherent (for example, binding
    one class of hydrophobic ligand), or have members diverged in ligand and tissue as chemosensory CheB proteins
    have?
suggested_experiments:
- description: Express epitope-tagged CG33453-PA and -PB in Drosophila S2 cells and compare protein in conditioned
    medium versus lysate, with a signal-peptide deletion as control, to test secretion.
- description: Map endogenous expression with a knock-in reporter, focusing on chemosensory appendages and
    their support cells, and test a CRISPR null allele with genomic rescue for chemosensory and courtship phenotypes.
- description: Purify the mature protein and screen candidate hydrophobic ligands (cuticular hydrocarbons,
    fatty acids) by thermal-shift or native mass spectrometry to test the ligand-binding hypothesis for DUF1091.
