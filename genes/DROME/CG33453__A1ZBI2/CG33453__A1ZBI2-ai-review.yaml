id: A1ZBI2
gene_symbol: CG33453
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG33453 (FlyBase FBgn0053453) encodes a small Drosophila protein; this entry, A1ZBI2, is the
  175-residue PA product (FBpp0085748). It consists of a predicted N-terminal signal peptide (residues 1-23)
  followed by a single DUF1091 domain (Pfam PF06477, SMART DM8). The second product, PB (A0A0B4LFV5, 174
  residues), is identical apart from a two-residue indel inside the signal peptide and a one-residue indel
  in the mature chain. CG33453 belongs to PANTHER family PTHR20898, an insect-restricted family with a large
  dipteran expansion and no vertebrate members, and to its Drosophila-expanded subfamily PTHR20898:SF0, which
  has about a hundred D. melanogaster members including daedalus (CG33690). The signal peptide predicts entry
  into the secretory pathway, but no molecular activity, ligand, binding partner, site of action, expression
  domain or physiological role has been established experimentally for CG33453 or for any other member of
  the family.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: Correct ND statement. No molecular function is known for CG33453-PA, for its PB isoform, or
      for any member of PANTHER PTHR20898.
    action: ACCEPT
    reason: A Europe PMC search for CG33453 and FBgn0053453 (2026-10-21) returned no publications, and the
      gene-level Falcon deep research found no biochemical, genetic, interaction or localization study of
      CG33453. The only domain, DUF1091, is a domain of unknown function. The single experimentally studied
      member of the same subfamily (PTHR20898:SF0), daedalus/CG33690, has diet-dependent activity phenotypes
      but no proposed molecular function, the family has no Swiss-Prot reviewed members, and there are no
      PAINT/IBA annotations anywhere in the family. There is therefore no phylogenetically grounded function
      to transfer, and the ND assertion is an accurate statement of current knowledge.
    supported_by:
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: There is no retrieved target-specific knockout, RNAi, rescue, biochemical, proteomic,
        interaction, or localization result for CG33453.
    - reference_id: PMID:32502405
      supporting_text: No biological function has been suggested for dls, and the protein it encodes contains
        a conserved domain of unknown function (InterPro DUF1091).
    - reference_id: file:DROME/CG33453/CG33453-bioinformatics/RESULTS-rereview.md
      supporting_text: No member of the family has a Swiss-Prot entry, so no member has a curated, experimentally
        determined molecular function.
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: Correct ND statement. The predicted signal peptide is the only localization clue, and no
      experimental localization exists.
    action: ACCEPT
    reason: SignalP predicts a signal peptide at residues 1-23 of PA, so the protein is expected to enter
      the secretory pathway and may be secreted. No tagged-protein, fractionation or secretion experiment
      has been reported for CG33453, and a signal peptide alone does not distinguish extracellular, lumenal
      or membrane-associated fates (no transmembrane segment is predicted). A positive extracellular term
      would rest on one sequence prediction, so the ND root is retained rather than replaced.
    supported_by:
    - reference_id: file:DROME/CG33453__A1ZBI2/CG33453__A1ZBI2-uniprot.txt
      supporting_text: SIGNAL          1..23
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: No CG33453-specific immunolocalization, tagged-protein imaging, fractionation, or secretion
        experiment was found.
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: Correct ND statement. No biological process has been demonstrated, and phenotypes of the paralog
      daedalus are not transferable.
    action: ACCEPT
    reason: The only process hypothesis in the literature is a family-level role in chemosensory or pheromone
      signal handling, based on the expression of two other CheA/DUF1091 proteins in male chemosensory sensilla
      and on weak profile similarity to CheB proteins. Neither is a phylogenetically grounded transfer to CG33453.
      The diet-dependent climbing and activity phenotypes of daedalus/CG33690 belong to a different gene in
      a large, rapidly diversifying subfamily, and they are organismal phenotypes, not evidence of process
      participation. No process can be assigned, so the ND root stands.
    supported_by:
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: No signaling or biochemical pathway has been demonstrated for CG33453.
    - reference_id: PMID:32502405
      supporting_text: a previously uncharacterized gene that modulates diet-dependent changes in physical
        activity
