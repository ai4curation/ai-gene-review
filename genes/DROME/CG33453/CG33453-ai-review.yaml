description: CG33453 encodes a small Drosophila protein of the DUF1091 family with a predicted N-terminal
  secretion signal. The native 174-residue PB isoform is closely related to the 175-residue PA product
  of the same locus. Its native molecular activity, extracellular destination and physiological partners
  remain uncharacterized.
