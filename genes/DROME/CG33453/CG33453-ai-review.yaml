core_functions: []
suggested_questions:
- question: Do PA and PB of CG33453 differ in secretion or processing, given that their only differences
    are an indel at the signal-peptide cleavage region and a single-residue insertion in the mature chain?
- question: Is the large dipteran expansion of PTHR20898:SF0 functionally coherent (for example, a shared
    class of hydrophobic ligand), or do members diverge as the chemosensory CheB proteins do?
suggested_experiments:
- description: Express epitope-tagged CG33453-PA and -PB in Drosophila S2 cells and compare protein in conditioned
    medium versus lysate, with a signal-peptide deletion as control, to test secretion.
- description: Map endogenous expression with a knock-in reporter, focusing on chemosensory appendages and
    their support cells, and test a CRISPR null allele for chemosensory and courtship phenotypes.
