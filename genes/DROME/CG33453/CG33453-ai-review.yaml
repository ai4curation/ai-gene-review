id: A0A0B4LFV5
gene_symbol: CG33453
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG33453 encodes a small (about 175 residue) Drosophila protein made of a predicted N-terminal
  signal peptide followed by a single DUF1091 domain. It belongs to PANTHER family PTHR20898, an insect-restricted
  family that has expanded greatly in Diptera, and sits in the large Drosophila-expanded subfamily PTHR20898:SF0
  together with roughly a hundred other D. melanogaster entries, including daedalus (CG33690). The gene produces
  two near-identical isoforms, PA (175 aa) and PB (174 aa), which differ only by a two-residue indel inside
  the signal peptide and a single-residue indel in the mature chain. The signal peptide implies entry into
  the secretory pathway, but no molecular activity, ligand, partner, tissue of action or physiological role
  has been established for CG33453 or for any member of its subfamily.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    action: ACCEPT
    summary: Correct ND statement; no molecular function is known for CG33453 or for any member of its PANTHER
      subfamily.
    reason: A literature search (Falcon deep research, re-checked here) found no gene-specific biochemical,
      genetic, interaction or localization study of CG33453. Its DUF1091 domain is literally of unknown function,
      and the only experimentally studied member of the same PANTHER subfamily (PTHR20898:SF0), daedalus/CG33690,
      has a diet-dependent activity phenotype but no proposed molecular function. No family member has a
      Swiss-Prot entry and there are no IBA/PAINT annotations for the family, so there is no phylogenetically
      grounded function to transfer. The ND assertion therefore stands as an accurate record that the function
      is unknown.
    supported_by:
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: There is no retrieved target-specific knockout, RNAi, rescue, biochemical, proteomic,
        interaction, or localization result for CG33453.
    - reference_id: PMID:32502405
      supporting_text: No biological function has been suggested for dls, and the protein it encodes contains
        a conserved domain of unknown function (InterPro DUF1091).
    - reference_id: file:DROME/CG33453/CG33453-bioinformatics/RESULTS-rereview.md
      supporting_text: No member of the family has a Swiss-Prot entry, so no member has a curated, experimentally
        determined molecular function.
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    action: ACCEPT
    summary: Correct ND statement; the predicted signal peptide is the only localization clue and no experimental
      localization exists.
    reason: SignalP predicts an N-terminal signal peptide (residues 1-22 in PB), so the protein is expected
      to enter the secretory pathway and is plausibly secreted, as is reported for the CheA/DUF1091 proteins
      in general. No tagged-protein, fractionation or secretion assay has been reported for CG33453, and a
      signal peptide alone does not establish whether the mature protein is extracellular, lumenal or membrane
      associated. Adding a positive extracellular term would rest on a single sequence prediction, so the
      ND root is retained as accurate.
    supported_by:
    - reference_id: file:DROME/CG33453/CG33453-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..22
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: No CG33453-specific immunolocalization, tagged-protein imaging, fractionation, or secretion
        experiment was found.
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Correct ND statement; no biological process has been demonstrated, and phenotypes of the paralog
      daedalus must not be transferred.
    reason: The proposed family-level role in chemosensory or pheromone-signal handling comes from the expression
      of other CheA/DUF1091 proteins in male chemosensory sensilla and a weak, remote profile similarity to
      CheB proteins; neither is a phylogenetically grounded transfer to CG33453. The diet-dependent climbing
      and activity phenotypes of daedalus/CG33690 belong to a distinct paralog in a subfamily of about a hundred
      rapidly evolving fly genes, and are organismal phenotypes rather than evidence of process participation.
      No process can therefore be assigned and the ND root is retained.
    supported_by:
    - reference_id: file:DROME/CG33453/CG33453-deep-research-falcon.md
      supporting_text: No signaling or biochemical pathway has been demonstrated for CG33453.
    - reference_id: PMID:32502405
      supporting_text: a previously uncharacterized gene that modulates diet-dependent changes in physical
        activity
