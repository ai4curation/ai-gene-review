  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: The structural donor for this prediction is human GM2 activator P17900. That protein presents
      ganglioside GM2 for lysosomal hydrolysis, a substrate-specific pathway that cannot be transferred
      solely from a moderate fold match. Primary lipid-analysis and transgenic-reconstitution work shows
      that gangliosides are not intrinsically detectable in ordinary Drosophila and must be induced using
      introduced synthesis enzymes and supplied precursor. This contradicts assignment of an endogenous
      ganglioside-catabolism role to native CG33453. It does not claim that flies cannot sialylate glycoproteins
      or that an engineered/exogenous substrate could never be degraded. No equivalent positive target
      annotation exists.
    supported_by:
