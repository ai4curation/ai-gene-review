- source: Alliance_Automated
  text: Enables cell adhesion molecule binding activity and coreceptor activity. Involved
    in several processes, including garland nephrocyte differentiation; heterophilic
    cell-cell adhesion; and sensory organ development. Located in nephrocyte diaphragm
    and plasma membrane. Part of protein complex involved in cell adhesion. Is active
    in apical plasma membrane and presynaptic membrane. Colocalizes with cell-cell
    junction. Is expressed in several structures, including head; medulla layer; muscle
    cell; myoblast; and nephrocyte. Used to study kidney disease and nephrotic syndrome.
    Human ortholog(s) of this gene implicated in nephrotic syndrome type 23. Orthologous
    to human KIRREL1 (kirre like nephrin family adhesion molecule 1); KIRREL2 (kirre
    like nephrin family adhesion molecule 2); and KIRREL3 (kirre like nephrin family
    adhesion molecule 3).
