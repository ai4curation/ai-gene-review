descriptions:
- source: Alliance_Imported
  text: kin of irre (kirre) encodes a transmembrane protein of the Ig superfamily
    that is involved in heterotypic interactions with the product of sns. Interactions
    with intracellular adaptors regulate cytoskeleton dynamics. Its biological roles
    include myoblast aggregation and fusion, nephrocyte diaphragm formation, and cell
    sorting in the eye and wing imaginal discs.
  source_type: curated
  url: https://flybase.org/reports/kirre.html
