core_functions:
- description: Kirre on founder myoblasts binds Sns/Hbs on fusion-competent myoblasts (and itself in trans),
    mediating the recognition and adhesion that initiate myoblast fusion and recruiting Rols7/Loner via
    its cytodomain. The same heterophilic adhesion between Kirre/Rst in interommatidial cells and Hbs/Sns
    in primary pigment cells drives preferential adhesion that separates ommatidia in the pupal eye.
