id: Q9W4T9
gene_symbol: kirre
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Kirre (Kin of irre, also called Dumbfounded/Duf) is a Neph1/KIRREL-family single-pass transmembrane
  protein of the immunoglobulin superfamily with five extracellular Ig domains and a signaling cytoplasmic
  tail. As a member of the Irre cell recognition module it engages in homophilic adhesion and heterophilic
  adhesion with the Nephrin-like proteins Sticks and stones (Sns) and Hibris (Hbs). In embryonic founder
  myoblasts Kirre acts redundantly with its paralog Roughest as the attractant and adhesion receptor for
  Sns-expressing fusion-competent myoblasts, and its cytodomain recruits Rolling pebbles (Rols7/Antisocial)
  and Loner to sites of fusion. In nephrocytes Kirre and Sns are core structural components of the nephrocyte
  (slit) diaphragm, required for its formation and for size-selective filtration. Kirre also mediates
  IRM adhesion in pupal eye cell sorting and sensory organ spacing, and acts as a co-receptor for Side-IV
  in synapse formation.
