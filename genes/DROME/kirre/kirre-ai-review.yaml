suggested_questions:
- question: Do Kirre homophilic and Kirre-Sns heterophilic interactions use the same Ig1 interface, as
    for SYG-1 orthologs, and does this determine competition between fusion and diaphragm assembly?
suggested_experiments:
- hypothesis: Kirre Ig1 interface mutants that block Sns binding abolish both myoblast fusion and nephrocyte
    diaphragm formation.
  description: Express structure-guided Kirre Ig1 point mutants in duf rst double mutant embryos and in
    kirre knockdown nephrocytes and assay fusion index and diaphragm number by EM.
