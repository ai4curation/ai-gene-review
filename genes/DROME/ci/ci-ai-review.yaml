  - FB:FBgn0003444
  review:
    summary: IGI with smoothened (FB:FBgn0003444) from the study showing that Slimb binds phosphorylated Ci-155
      to direct its conversion to the repressor Ci-75. Ci-75, the N-terminal fragment produced by phosphorylation-dependent
      partial proteolysis of Ci-155, is constitutively nuclear and represses hedgehog itself and other Hedgehog
      target genes. Repression of RNA polymerase II transcription is one of the two core outputs of this gene
      product.
    action: ACCEPT
