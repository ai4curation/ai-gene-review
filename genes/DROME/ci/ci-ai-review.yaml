- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029133
  review:
    summary: Electronic ARBA annotation of the Ci/GLI family to negative regulation of RNA polymerase II transcription.
      Ci-75, the N-terminal fragment produced by phosphorylation-dependent partial proteolysis of Ci-155,
      is constitutively nuclear and represses hedgehog itself and other Hedgehog target genes. Repression
      of RNA polymerase II transcription is one of the two core outputs of this gene product.
    action: ACCEPT
    reason: 'Accepted. The electronic assertion coincides with the directly demonstrated repressor output
      of this gene: proteolysis converts Ci-155 into a nuclear repressor form (PMID:9215627), and repressor
      and activator forms control overlapping but distinct subsets of Hedgehog targets (PMID:10102270). The
      term is at the right level of specificity for a Pol II transcription factor.'
    supported_by:
    - reference_id: PMID:9215627
      supporting_text: This form translocates to the nucleus where it represses hh and other target genes.
- term:
    id: GO:0000122
