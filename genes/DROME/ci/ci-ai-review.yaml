gene_symbol: ci
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cubitus interruptus (Ci) is the sole Gli-family C2H2 zinc-finger transcription factor of Drosophila
  melanogaster and the terminal effector of Hedgehog signalling; cells lacking it show no Hedgehog output
  at all. The 1397-residue full-length protein, Ci-155, is a latent transcriptional activator. In cells not
  receiving Hedgehog it is held in the cytoplasm in a microtubule-associated complex with the kinesin-related
  protein Costal-2, the Ser/Thr kinase Fused and Suppressor of fused, where Costal-2-recruited protein kinase
  A, glycogen synthase kinase 3 and casein kinase 1 phosphorylate it on clustered, successively primed sites.
  The resulting extended phosphodegron is read by Slimb, the F-box substrate receptor of an SCF ubiquitin
  ligase, and commits Ci-155 to partial proteasomal proteolysis that removes the C-terminal activation and
  tethering domains. The product, the roughly 75 kDa Ci-75, is constitutively nuclear and acts as a sequence-specific
  transcriptional repressor of hedgehog itself and of other Hedgehog target genes; this repressor state is
  the default output of the pathway. Hedgehog reception blocks the processing, so Ci-155 accumulates, is further
  phosphorylated by Fused and casein kinase 1, is released from Suppressor of fused, and is imported through
  a bipartite nuclear localisation signal and a PY-NLS read by Transportin. Nuclear Ci-155 then activates
  targets such as decapentaplegic, patched, wingless and knot/collier, recruiting the coactivator CBP (nejire)
  to do so, and is in turn limited by the Cullin-3 substrate adaptor Roadkill/HIB. Both forms recognise the
  same GLI/Ci consensus sequence in RNA polymerase II cis-regulatory regions through five C2H2 zinc fingers,
  so the dose and duration of Hedgehog exposure is translated into a graded ratio of activator to repressor.
  Through these two opposing outputs Ci patterns the anterior compartment of every embryonic segment and imaginal
  disc, and contributes to eye, wing, leg, labial, genital and posterior spiracle morphogenesis, to ovarian
  and hindgut stem-cell behaviour, and to Hedgehog-dependent epithelial immunity in the gut.
