  review:
    summary: 'IDA: chromatin immunoprecipitation places Ci on the knot/collier regulatory region, where it
      acts together with the RNA-binding protein dA2BP1/Rbfox1 to activate kn in the L3-L4 intervein region
      of the wing disc.'
    action: ACCEPT
    reason: Accepted. The general cis-regulatory-region binding term is the appropriate level here rather
      than the sequence-specific descendant, because the point of the cited study is precisely that kn lacks
