  evidence_type: NAS
  original_reference_id: PMID:2166702
  qualifier: involved_in
  review:
    summary: Author statement, from the original cloning paper, that ci encodes a transcriptional regulator.
    action: MODIFY
    reason: The essence is correct but the term is the pan-polymerase root of the transcription-regulation
      branch. Every characterised Ci target - wingless, patched, decapentaplegic, knot/collier, hairy - is
      an RNA polymerase II gene, and the Pol II-specific term is already carried by the IBA row, so the general
      term should be replaced rather than kept alongside it.
    proposed_replacement_terms:
    - id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    supported_by:
    - reference_id: PMID:2166702
      supporting_text: Sequence analysis indicates that the protein encoded by the ciD transcript contains
        a domain of five tandem amino acid repeats that have sequence similarity to the zinc-finger repeats
        of the Xenopus transcription factor TFIIIA
