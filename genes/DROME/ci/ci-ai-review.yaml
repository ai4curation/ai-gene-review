suggested_questions:
- question: Where exactly is Ci-155 cleaved, and what determines that the proteasome stops at that point instead
    of degrading the protein completely? The processed product has never been mapped to a residue, and the
    UniProt repressor chain is annotated with an undefined C-terminal boundary.
- question: Does the Ci-75 repressor use a dedicated corepressor, or does it repress simply by occupying GLI
    sites and excluding Ci-155? Groucho and Atrophin have been proposed for Ci/GLI repressors, but no partner
    has been shown to be required for repression of hedgehog itself.
- question: Is the Hippo-antagonising activity of Ci in ovarian escort cells a property of Ci-155, of Ci-75,
    or of a form that never reaches the nucleus, and does it require DNA binding at all?
- question: Which Hedgehog targets are controlled principally by loss of Ci-75 and which by gain of Ci-155?
    Activator and repressor forms are known to control overlapping but distinct target subsets, but the split
    has not been resolved genome-wide.
suggested_experiments:
- hypothesis: Ci-75 represses hedgehog and other targets by direct occupancy of GLI sites, and a separable
    corepressor-recruiting region is required for repression but not for DNA binding.
  description: Generate endogenous ci alleles that produce only the truncated repressor (by installing a stop
    codon at the mapped processing site) and derivatives carrying point mutations across the N-terminal region,
    then score repression of hedgehog and of patched enhancer reporters alongside CUT&RUN occupancy in anterior
    compartment cells.
- hypothesis: The activator and repressor forms occupy overlapping but non-identical sets of cis-regulatory
    elements in vivo.
  description: Perform form-specific chromatin profiling by tagging Ci at both the N and C termini, so that
    N-terminal signal reports both forms and C-terminal signal reports only Ci-155, in wing discs sorted by
    position relative to the anteroposterior boundary, and compare the site sets with matched transcriptomes.
- hypothesis: Ci binding to Hippo, rather than Ci transcriptional output, is what drives germline stem cell
    differentiation in escort cells.
  description: Test separation-of-function ci alleles that retain Hippo binding but carry disrupted zinc fingers,
    and the converse, for rescue of the escort-cell phenotype and for Yorkie nuclear localisation.
