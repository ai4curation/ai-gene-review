    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:8769644
  qualifier: involved_in
  review:
    summary: IMP from Alexandre et al., who established Ci as the direct transcriptional effector of Hedgehog
      target genes. Ci-75, the N-terminal fragment produced by phosphorylation-dependent partial proteolysis
      of Ci-155, is constitutively nuclear and represses hedgehog itself and other Hedgehog target genes.
      Repression of RNA polymerase II transcription is one of the two core outputs of this gene product.
    action: ACCEPT
    reason: Accepted as core. The cached record for this paper is abstract-only and foregrounds the activator
