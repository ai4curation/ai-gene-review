- description: Sequence-specific recognition of GLI/Ci consensus sites in RNA polymerase II cis-regulatory
    regions, through five C2H2 zinc fingers retained by both Ci-155 and Ci-75. This shared DNA-binding activity
    is what allows one protein to deliver opposite transcriptional outputs to the same target enhancers, and
    it is the activity the PAINT node places at the bilaterian ancestor of the Ci/GLI family.
