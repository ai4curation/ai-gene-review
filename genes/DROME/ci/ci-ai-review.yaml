        to Ci-75, which represses key Hh target genes
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:10102270
  qualifier: involved_in
  review:
    summary: IMP from the study separating activator and repressor forms of Ci in limb development. Ci-75,
      the N-terminal fragment produced by phosphorylation-dependent partial proteolysis of Ci-155, is constitutively
      nuclear and represses hedgehog itself and other Hedgehog target genes. Repression of RNA polymerase
      II transcription is one of the two core outputs of this gene product.
    action: ACCEPT
    reason: Accepted as core. Methot and Basler showed that the cleavage generating the repressor is essential
      for limb patterning and is regulated by Hedgehog in vivo, and that repressor and activator forms control
      distinct target subsets. This is direct in vivo evidence that Ci performs Pol II transcriptional repression
      itself.
    supported_by:
    - reference_id: PMID:10102270
      supporting_text: A repressor form of Ci arises in the absence of Hh signaling by proteolytic cleavage
        of intact Ci.
- term:
