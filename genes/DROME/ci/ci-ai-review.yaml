- term:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:9215627
  qualifier: enables
  review:
    summary: Proposed addition. GOA records the repressor output of Ci only as a biological process (GO:0000122,
      five rows) and as the unsigned parent molecular function (GO:0000981), while the signed activator molecular
      function GO:0001228 is present. The repressor molecular function is missing, although Ci-75 is the best-characterised
      transcriptional repressor in the pathway.
    action: NEW
    reason: 'Participation test: the entity that performs the repression is Ci itself. Ci-155 is cleaved to
      a C-terminally truncated form that enters the nucleus and represses hedgehog and other Hedgehog target
      genes (PMID:9215627); this repressor form binds the same GLI/Ci consensus sites through the same five
      zinc fingers, and its cleavage is required for limb patterning in vivo (PMID:10102270). No other gene
      product does the repressing. Comparator test: the signed repressor term is applied to the Ci/GLI repressor-forming
      paralogue elsewhere in the family - mouse Gli3 carries GO:0001227 - and the term is in ordinary use
      in Drosophila, so its absence here is a gap rather than a convention. On redundancy: GO:0001227 is a
      child of GO:0000981, which ci already carries, but GOA already pairs GO:0000981 with the sibling GO:0001228
      on this same gene product, so adding GO:0001227 completes the activator/repressor pair rather than merely
      refining an existing assertion. Proposed with IDA evidence from the paper that demonstrated the repressor
      form directly.'
    supported_by:
    - reference_id: PMID:9215627
      supporting_text: This form translocates to the nucleus where it represses hh and other target genes.
    - reference_id: PMID:9215627
      supporting_text: Proteolysis that is inhibited by hedgehog targets Cubitus interruptus protein to the
        nucleus and converts it to a repressor.
    - reference_id: PMID:10102270
      supporting_text: A repressor form of Ci arises in the absence of Hh signaling by proteolytic cleavage
        of intact Ci.
    - reference_id: PMID:16386907
      supporting_text: the sole Drosophila Gli homolog, Cubitus interruptus (Ci), undergoes partial proteolysis
        to Ci-75, which represses key Hh target genes
core_functions:
- description: Hedgehog-dependent transcriptional activator. Stabilised, Fused/CK1-phosphorylated Ci-155 is
    imported into the nucleus, binds GLI/Ci consensus sites in the cis-regulatory regions of Hedgehog target
    genes and switches them on, recruiting the coactivator CBP/nejire. This is the activating half of the
    pathway output.
  molecular_function:
