      hh target genes, even in the absence of hh activity
  - reference_id: PMID:9122207
    supporting_text: We demonstrate that Ci binding sites in the wg promoter are necessary for this transcriptional
      activation.
  - reference_id: PMID:10669739
    supporting_text: Taken together, our data suggest that dCBP function is necessary for ci-mediated transactivation
      of wg during Drosophila embryogenesis.
- description: Constitutive transcriptional repressor in the pathway-off state. Phosphorylation-dependent
    partial proteolysis of Ci-155 produces the C-terminally truncated Ci-75, which is constitutively nuclear
    and represses hedgehog and other Hedgehog target genes from the same binding sites. Much of Hedgehog biology
    is relief of this repression rather than gain of activation.
