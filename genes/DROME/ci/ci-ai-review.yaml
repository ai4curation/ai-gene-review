  review:
    summary: IBA from PAINT node PTN000456649 for regulation of RNA polymerase II transcription, the process
      in which the whole Ci/GLI family acts.
    action: ACCEPT
    reason: Accepted as core. The node is bilaterian and ci is a descendant; ci itself is among the declared
      sources, which signals experimental grounding on the target rather than circular support. The fly protein
      both activates and represses Pol II targets, so the parent process term is the right family-level statement.
