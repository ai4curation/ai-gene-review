descriptions:
- source: UniProt
  text: Has a dual function as a transcriptional activator and a repressor of the
    hedgehog (Hh) pathway. The full-length ci form (ciFL), acts as an activator (ciA)
    while ciR, its C-terminally truncated form, acts as a repressor. Involved in segment
    polarity. Required for the normal development of the posterior half of each embryonic
    segment. Engrailed protein directly represses ci expression in posterior compartment
    cells. Essential component of a hh-signaling pathway which regulates the Duox-dependent
    gut immune response to bacterial uracil; required to activate Cad99C-dependent
    endosome formation, norpA- dependent Ca2+ mobilization and p38 MAPK, which are
    essential steps in the Duox-dependent production of reactive oxygen species (ROS)
    in response to intestinal bacterial infection (PubMed:25639794).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19538
  source_id: P19538
