      score: 4
    overall_notes: 'Correct: dual activator/repressor (ciFL vs ciR), segment polarity,
      engrailed repression, plus a cited gut uracil/Duox immune role. Does not name
      Cos2, Fu, Su(fu), the kinases or Slimb.'
- source: Alliance_Imported
  text: cubitus interruptus (ci) encodes a Zn-finger family of transcription factor.
    It contributes to Hedgehog (Hh) signaling pathway that is involved in pattern
    formation and growth control. The product of ci undergoes limited proteolysis
    to be converted into a truncated form that function as a transcription repressor
    in the absence of the ligand encoded by hh but is converted into a full-length
    transcription activator in the presence of the product of hh.
  source_type: curated
  url: https://flybase.org/reports/ci.html
  source_id: FB:FBgn0004859
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'Correct and compact: Gli-type zinc-finger factor, proteolytic
      processing to repressor without Hh and activator with Hh. No partners named.'
- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription activator activity,
    RNA polymerase II-specific; cAMP response element binding protein binding activity;
    and protein homodimerization activity. Involved in several processes, including
    negative regulation of hippo signaling; regionalization; and regulation of transcription
    by RNA polymerase II. Located in cytosol and nucleus. Part of Hedgehog signaling
    complex. Is expressed in several structures, including anlage in statu nascendi;
    developmental compartment; germ layer; head epidermis primordium; and imaginal
    disc. Used to study primary bacterial infectious disease. Human ortholog(s) of
    this gene implicated in several diseases, including Culler-Jones syndrome; Pallister-Hall
    syndrome; anodontia; polydactyly (multiple); and synostosis (multiple). Orthologous
    to several human genes including GLI2 (GLI family zinc finger 2) and GLI3 (GLI
    family zinc finger 3).
  source_type: automated
  url: https://flybase.org/reports/ci.html
  source_id: FB:FBgn0004859
