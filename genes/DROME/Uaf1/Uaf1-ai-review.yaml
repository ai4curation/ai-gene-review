suggested_questions:
- question: Does fly Uaf1 also partner Usp1 in DNA damage tolerance, as in mammals?
- question: Should GO add a specific USP12/USP46-UAF1-WDR20 deubiquitinase complex term in place of the
    generic peptidase complex?
suggested_experiments:
- hypothesis: Fly Uaf1 acts with Usp1 in DNA damage responses independently of Usp12-46.
  description: Test Uaf1 and Usp1 mutants or RNAi for sensitivity to DNA crosslinkers and PCNA/FANCD2
    monoubiquitination levels.
