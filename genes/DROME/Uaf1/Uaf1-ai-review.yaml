  label: Drosophila melanogaster
description: 'Uaf1 (WD repeat-containing protein 48 homolog) is the fly ortholog of USP1-associated factor
  1, a WD40 beta-propeller protein that binds and allosterically activates ubiquitin-specific proteases
  of the USP1/USP12/USP46 family. In Drosophila it is a regulatory subunit, with Wdr20, of the Usp12-46
  deubiquitylase complex: it stabilizes Usp12-46 and increases its catalytic turnover. The complex deubiquitylates
  the Wingless co-receptor Arrow/LRP6, raising its cell-surface level and the sensitivity of cells to
  Wingless, so Uaf1 promotes Wingless signaling strength. By analogy with human UAF1, it may also partner
  USP1 in DNA damage tolerance and homologous recombination. Uaf1 is predicted to be nuclear.'
