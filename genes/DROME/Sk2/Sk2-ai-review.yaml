gene_symbol: Sk2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sk2 (sphingosine kinase 2; CG32484) is one of the two Drosophila sphingosine kinases.
  It is a soluble enzyme of the diacylglycerol-kinase (DAGKc) fold. It uses ATP to phosphorylate
  sphingoid long-chain bases, including sphingosine and dihydrosphingosine (sphinganine), producing
  sphingosine 1-phosphate (S1P) and dihydrosphingosine 1-phosphate (DHS1P). The enzyme complements a
  yeast sphingosine kinase mutant, and its activity is mainly cytosolic. In S2 cells part of the
  protein associates with Lamp1-positive lysosomal membranes, whereas Sk1 is found at the plasma
  membrane. Sk2 overexpression shifts the DHS1P/S1P balance towards DHS1P. Loss of Sk2 raises
  long-chain base levels. Sk2 hypomorphs are viable but have reduced ovulation and flight
  performance, and Sk1 Sk2 double mutants are reported to be lethal. In photoreceptors, raising Sk2
  activity speeds lysosomal degradation of rhodopsin and TRP and causes retinal degeneration. Glial
  Sk2 is needed for presynaptic homeostatic potentiation at the larval neuromuscular junction. These
  physiological effects are thought to follow from changes in the balance of sphingoid bases and
  their phosphates.
