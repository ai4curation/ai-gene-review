suggested_questions:
- question: GO:0046512 sphingosine biosynthetic process is propagated by PAINT (PTN000270644) to sphingosine
    kinases, which consume rather than produce sphingosine. Should the PAINT node carry sphingoid metabolic
    process (GO:0046519) or sphingosine metabolic process (GO:0006670) instead?
- question: Is the lysosomal-membrane pool of Sk2 seen in S2 cells also present at endogenous expression
    levels in photoreceptors or other tissues? If so, what targets Sk2 to lysosomes?
- question: What makes Sk2 favour DHS1P over S1P relative to Sk1 in vivo? Is it substrate preference or
    compartmental access to dihydrosphingosine?
suggested_experiments:
- description: Endogenously tagged Sk2 (CRISPR knock-in) imaged with Lamp1 and organelle markers in photoreceptors
    and fat body, together with fractionation checked for lysosomal and ER markers, to test whether lysosomal
    association happens at physiological levels.
  experiment_type: localization
- description: Steady-state kinetics of purified Sk1 and Sk2 with C14 sphingosine and C14 dihydrosphingosine
    to test whether Sk2 has an intrinsic preference for dihydrosphingosine.
  experiment_type: enzyme kinetics
