- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000413795
  review:
    summary: Sk2 has a DAGKc kinase domain with conserved ATP-binding positions. Sphingosine kinase
      uses ATP as the phosphate donor.
    action: KEEP_AS_NON_CORE
    reason: True, because ATP is a substrate of the sphingosine kinase reaction. The conserved
      GSGN312-315 motif in the DAGKc domain is needed for activity. ATP binding is a component of the
      catalytic activity rather than a separate function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:21321100
      supporting_text: We introduced substitutions (GSGN312–315 to DDDD) in the corresponding conserved
        domain of Drosophila Sk2 and generated transgenic flies.
