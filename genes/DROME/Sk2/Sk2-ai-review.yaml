- id: PMID:14722126
  title: Characterization of the Drosophila sphingosine kinases and requirement for
    Sk2 in normal reproductive function.
  findings:
  - statement: Sk2 complements a yeast sphingosine kinase mutant, has mainly cytosolic activity
      and phosphorylates a range of sphingoid bases.
    supporting_text: Both genes functionally and biochemically complement a yeast sphingosine kinase
      mutant, express predominantly cytosolic activities, and are capable of phosphorylating a range
      of endogenous and non-endogenous sphingoid base substrates.
  - statement: An Sk2 transposon mutant has raised long-chain base levels and defects in flight and
      ovulation. The allele was later shown to be a hypomorph rather than a null (PMID:21321100).
    supporting_text: A null Sk2 transposon insertion mutant demonstrated elevated long chain base levels,
      impaired flight performance, and diminished ovulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title and abstract match the GOA IDA rows for sphingosine kinase activity and sphingolipid
      metabolism. Only the abstract is cached. PMID:21321100 reports that the "null" allele is a hypomorph.
  full_text_unavailable: true
- id: PMID:21321100
  title: Sphingosine kinases and their metabolites modulate endolysosomal trafficking
    in photoreceptors.
  findings:
  - statement: Sk2 localizes to the cytoplasm and to Lamp1-positive lysosomal membranes in S2 cells.
    supporting_text: Sk2 shows cytoplasmic staining; additionally, we found that Sk2 can localize to
      lysosomal membranes, as seen by its colocalization with GFP-tagged Drosophila lysosome-associated
      membrane protein 1 (Lamp1), a lysosomal marker
  - statement: Sk2 phosphorylates both sphingosine and dihydrosphingosine.
    supporting_text: Sk1 and Sk2 use both sphingosine and DHS as substrates and generate S1P and DHS1P.
  - statement: A catalytically dead GSGN312-315 to DDDD Sk2 does not cause the photoreceptor degeneration
      seen with wild-type Sk2 overexpression.
    supporting_text: Targeted overexpression of this mutant form of Sk2 does not lead to photoreceptor
      degeneration
  - statement: The Sk2 P-element allele is a hypomorph, and Sk1 and Sk2 are partly redundant.
    supporting_text: The Sk2 P-element mutant reported earlier is a hypomorph and not a null mutant
      because we could detect a transcript and a small amount of protein (unpublished data).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3044112). It supports the lysosomal membrane IDA. The trafficking
      and degeneration results come mostly from overexpression and lipid feeding, and are not used as
      process annotations.
