- term:
    id: GO:0046512
    label: sphingosine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000270644
  - UniProtKB:Q9NRA0
  - UniProtKB:Q9NYA1
  review:
    summary: PAINT propagation of sphingosine biosynthetic process from human SPHK1/SPHK2 to the fly
      sphingosine kinases.
    action: MODIFY
    reason: GO:0046512 is the formation of sphingosine, but a sphingosine kinase consumes sphingosine
      by phosphorylating it to S1P. Sphingosine itself is made by ceramidase action on ceramide. The
      kinase belongs in sphingoid base metabolism, not sphingosine biosynthesis. The family placement
      is sound, since Sk2 is in the clade and shares its activity. The term choice is the problem, so
      the row is corrected laterally to GO:0046519 sphingoid metabolic process. That term covers both
      sphingosine and dihydrosphingosine, which the fly Sk2 phosphorylates. It is the parent of
      GO:0006670 sphingosine metabolic process, the parent of the IBA term.
    proposed_replacement_terms:
    - id: GO:0046519
      label: sphingoid metabolic process
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000270644
        source_label: PTN000270644
        source_status: UNRESOLVED
        comment: Clade placement of Sk2 is sound, since it is a catalytically competent sphingosine
          kinase. The seed annotations on human SPHK1/SPHK2 that led to a biosynthetic (product-is-sphingosine)
          term were not inspected in this session. The kinase consumes sphingosine rather than forming
          it.
    supported_by:
    - reference_id: PMID:21321100
      supporting_text: Sphingosine kinases catalyze the conversion of sphingosine to S1P
    - reference_id: PMID:21321100
      supporting_text: Sk1 and Sk2 use both sphingosine and DHS as substrates and generate S1P and DHS1P.
