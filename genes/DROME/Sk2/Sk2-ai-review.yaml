core_functions:
- description: ATP-dependent sphingoid-base kinase that phosphorylates sphingosine and dihydrosphingosine
    to S1P and DHS1P. It acts in the cytoplasm, with an additional pool on lysosomal membranes, and
    controls the balance of sphingoid long-chain bases and their 1-phosphates.
