- source: Alliance_Imported
  text: bifid (bi) encodes a T-box transcription factor that controls cell proliferation,
    viability and cell migration. It contributes to the development of several tissues
    such as brain, eyes and wings. In wing development it is activated by the product
    of dpp and to a lesser extent by Wg signaling.
  source_type: curated
  url: https://flybase.org/reports/bi.html
  source_id: FB:FBgn0000179
