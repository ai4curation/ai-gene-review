    overall_notes: 'Correct: T-box factor controlling proliferation, viability and
      migration in brain, eye and wing; Dpp and Wg activate it.'
- source: Alliance_Automated
  text: Enables DNA binding activity. Involved in several processes, including compound
    eye morphogenesis; negative regulation of transcription by RNA polymerase II;
    and wing disc development. Located in nucleus. Is expressed in several structures,
    including anterior-posterior subdivision of organism; compartment boundary; head
    epidermis primordium; imaginal disc; and synaptic neuropil domain. Used to study
    cancer. Human ortholog(s) of this gene implicated in heart disease (multiple);
    ulnar-mammary syndrome; and vertebral anomalies and variable endocrine and T-cell
    dysfunction. Orthologous to human TBX2 (T-box transcription factor 2) and TBX3
    (T-box transcription factor 3).
  source_type: automated
