- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:15582779
  qualifier: involved_in
  review:
    summary: >-
      Domain-swap chimeras of OMB and ORG-1 in transfection assays; the abstract reports
      OMB as transcriptionally neutral relative to the strong activator ORG-1, and notes
      activation/repression properties determine specificity.
    action: ACCEPT
    reason: >-
      The cached paper is abstract-only; the curator presumably saw a repression readout in
      the full text. The repressor role is independently supported by genetic evidence
      (derepression of kuz/kul in omb null discs, PMID:30599067; ap repression,
      PMID:36907311; repression of Dpp/Hh targets in haltere, PMID:25793870) and by the
      well-characterized repressor activity of the orthologs TBX2/TBX3. Core function.
    supported_by:
    - reference_id: PMID:15582779
      supporting_text: In cell culture transfection assays, ORG-1 was a strong transcriptional
        activator, whereas OMB appeared neutral.
    - reference_id: PMID:15582779
      supporting_text: both transcriptional activation/repression properties as well as
        intrinsic DNA binding specificity can contribute to the functional characteristics
        of T-domain factors
