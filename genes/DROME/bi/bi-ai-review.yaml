core_functions:
- description: >-
    Nuclear T-box (Tbx2 subfamily) sequence-specific DNA-binding transcription factor that
    acts predominantly as a repressor of RNA polymerase II target genes (e.g. kuzbanian,
    kuzbanian-like, apterous, master of thick veins) to interpret Dpp/Wg and Hh positional
    information.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20033428
    supporting_text: provide evidence for loss of Omb DNA-binding activity in all three
      newly identified missense mutations
  - reference_id: PMID:30599067
    supporting_text: Analysis of a TBX2 loss-of-function Drosophila model revealed that
      kuzbanian and kuzbanian - like , orthologs of ADAM10, were derepressed compared
      to wild type.
  - reference_id: PMID:36907311
    supporting_text: Collectively, Omb is a repressive signal for ap expression in the
      ventral compartment
- description: >-
    Dpp-responsive transcriptional effector required in the wing imaginal disc for A/P
    pattern formation, compartment boundary maintenance, epithelial architecture and wing
