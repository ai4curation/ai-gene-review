      at the A/P boundary of the larval wing disc
suggested_questions:
- question: >-
    Is Omb an obligate repressor (as TBX2/TBX3) in all contexts, or does it directly activate
    targets such as spalt and vestigial, which are genetically Omb-dependent in the wing?
- question: >-
    Does Omb bind Zelda protein, or does the FlyBase IPI row (PMID:23891688) reflect only Zelda
    ChIP occupancy of the omb locus?
- question: >-
    Which Omb target genes mediate ICg-glia positioning and glial number in the optic lobe
    downstream of bantam, and should a glial cell migration process be annotated once direct
    evidence is available?
suggested_experiments:
- description: >-
    Genome-wide Omb ChIP-seq or CUT&RUN in wing discs and optic lobe combined with RNA-seq of
    omb mutant tissue to define direct activated versus repressed targets.
- description: >-
    Cell-autonomous omb loss-of-function (MARCM) in optic-lobe ICg-glia to test whether Omb
    directly controls glial migration and proliferation independently of bantam.
- description: >-
    Reporter assays with Omb and co-repressors (Groucho, HDAC/Rpd3) to test whether Omb
    repression requires a TBX2-like HDAC1 co-factor mechanism.
