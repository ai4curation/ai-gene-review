id: Q24432
gene_symbol: bi
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  bifid (bi), better known as optomotor-blind (omb), encodes Omb, the single Drosophila
  member of the Tbx2 subfamily of T-box transcription factors (orthologous to vertebrate
  TBX2/TBX3). The 972-residue nuclear protein carries a central T-box DNA-binding domain
  (residues 332-513) flanked by long disordered N- and C-terminal regions. Omb binds DNA
  through its T-domain and acts mainly as a transcriptional repressor: in cell culture it
  lacks the strong activation function of its paralog ORG-1, and genetically it represses
  targets such as master of thick veins, apterous (in the ventral wing), the ADAM10
  orthologs kuzbanian and kuzbanian-like, and Dpp/Hh targets in the haltere. omb is a
  primary target of Dpp (via relief of Brinker repression) and Wg signalling in the wing
  disc and of Hh signalling in the adult abdomen. Its graded expression in the central
  wing pouch is required for distal wing growth and survival, A/P compartment boundary
  maintenance, epithelial architecture and cell affinity, and vein (L5) positioning; it
  also specifies posterior identity in abdominal tergites (Quadroon pigmentation alleles),
  and is required in optic-lobe glia (ICg-glia) and HS/VS lobula plate neurons for correct
  visual-system development. Null alleles are pupal lethal.
