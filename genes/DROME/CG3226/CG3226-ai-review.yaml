gene_symbol: CG3226
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG3226 encodes the Drosophila ortholog of mammalian calcyclin-binding
  protein / Siah-interacting protein (CacyBP/SIP), a small (230 aa) protein with an
  N-terminal Siah-interacting domain, a central CS (HSP20-like, SGT1-type) domain and
  a C-terminal SGS domain. By homology it is expected to act as an adaptor that bridges
  the RING E3 ubiquitin ligase Sina/Siah to SKP1 and an F-box protein, promoting
  ubiquitination of targets such as beta-catenin, and to reside in the cytoplasm and
  nucleus; none of these molecular properties has been tested for the fly protein.
  Genetic evidence shows that loss of CG3226 causes dilated cardiomyopathy in adult
  flies, rescued by genomic or heart-specific expression of CG3226. Unlike its vertebrate
  orthologs, the fly protein has no S100 calcium-binding partners, because the S100
  family is restricted to chordates.
