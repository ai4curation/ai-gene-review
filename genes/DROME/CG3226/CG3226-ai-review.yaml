  supporting_entities:
  - InterPro:IPR037893
  review:
    summary: InterPro2GO transfer of the calcium-dependent S100A6 (calcyclin) interaction
      of vertebrate CacyBP/SIP to all family members. The S100 family is restricted
      to chordates (vertebrates plus a few tunicate sequences); D. melanogaster encodes
      no S100 protein (0 PF01023 proteins in UniProt), so CG3226 has no S100 partner
      in vivo. This is the annotation flagged by Wei et al. 2020 (PMID:32470107), and
      the flag holds.
    action: REMOVE
    reason: Taxon-inappropriate electronic transfer. The partner family does not exist
      in insects, so the binding function cannot be exercised in the fly. The fix belongs
      upstream, as a taxon constraint on GO:0044548 (Chordata) or a restriction of
      the IPR037893 InterPro2GO mapping.
    propagation_review:
