- id: file:DROME/CG3226/CG3226-uniprot.txt
  title: UniProtKB Q9W3Y3 entry for CG3226 (DROME)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The FUNCTION comment of this unreviewed entry is an ARBA rule transfer from vertebrate
      CacyBP/SIP. The E3-bridge role and beta-catenin degradation are plausible by homology but untested
      in the fly; they should name the fly ortholog Armadillo rather than human CTNNB1. The
      "calcium-dependent ubiquitination" claim does not apply to Drosophila, because the calcium
      dependence of vertebrate CacyBP/SIP comes from S100 partners and flies have no S100 proteins.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9W3Y3
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: May be involved in calcium-dependent ubiquitination and subsequent proteasomal degradation
        of target proteins.
      confidence: PROBABLE
      explanation: The FUNCTION comment of Q9W3Y3 (from ARBA rule ARBA00025145) says the protein "May be involved
        in calcium-dependent ubiquitination". In vertebrates the calcium dependence of CacyBP/SIP comes from its
        binding to calcium-loaded S100 proteins (S100A6/calcyclin), but the S100 family is restricted to chordates
        and D. melanogaster has no S100-domain protein. The rule should not assert calcium dependence for insect
        members; "May be involved in ubiquitination and subsequent proteasomal degradation of target proteins"
        would be accurate. The beta-catenin sentence should also name the fly ortholog (Armadillo) rather than
        CTNNB1.
      supported_by:
      - reference_id: PMID:18275604
        supporting_text: There is no evidence for S100 proteins in invertebrates
      - reference_id: PMID:27764152
        supporting_text: All S100 hits were within vertebrates, with the exception of four hits from the tunicate
          Oikopleura dioica
      - reference_id: file:DROME/CG3226/CG3226-bioinformatics/RESULTS.md
        supporting_text: CG3226 has no S100 protein to bind in D. melanogaster
