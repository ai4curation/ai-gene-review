proposed_new_terms: []
suggested_questions:
- question: Does CG3226 bind Sina and/or Sinah and SkpA in vivo, and does it promote
    ubiquitination of Armadillo or other substrates such as Tramtrack?
- question: Is the cardiomyopathy of CG3226 loss a developmental defect or a failure
    of adult cardiac maintenance/contractility, and is it mediated through Armadillo?
- question: Should GO:0044548 S100 protein binding carry a taxon constraint (only
    in Chordata), or the IPR037893 InterPro2GO mapping be restricted, so that it is
    not propagated to invertebrate CacyBP/SIP orthologs?
- question: In the absence of S100 proteins, is the C-terminal SGS region of fly CacyBP/SIP
    regulated by another calcium sensor, or is calcium regulation a vertebrate innovation?
suggested_experiments:
- description: Co-immunoprecipitation or yeast two-hybrid of CG3226 with Sina, Sinah,
    SkpA and Ebi, and in vivo ubiquitination assays of Armadillo in CG3226 mutant
    tissue.
- description: Temporally restricted (adult-only versus developmental) heart-specific
    RNAi or rescue of CG3226 with OCT phenotyping, to separate developmental from
    maintenance roles.
