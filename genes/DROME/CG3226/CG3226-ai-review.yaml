  review:
    summary: Casad et al. identified CG3226 as the gene responsible for dilated cardiomyopathy
      in Df(1)Exel6240 using smaller deletions and rescue with genomic and heart-specific
      CG3226 transgenes. The assayed phenotype is adult heart dimensions and fractional
      shortening; a strictly developmental defect versus a defect in adult heart maintenance
      or contraction is not distinguished.
    action: KEEP_AS_NON_CORE
    reason: Solid genetic evidence (deletion phenocopy plus transgene rescue) that CG3226
      is required for normal adult heart structure/function. The FlyBase curator chose
      heart development from the full text; we defer on term choice, but the term
      is a pleiotropic tissue-level outcome rather than the protein's core molecular
      role.
