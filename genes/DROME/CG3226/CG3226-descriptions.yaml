  text: May be involved in calcium-dependent ubiquitination and subsequent proteasomal
    degradation of target proteins. Probably serves as a molecular bridge in ubiquitin
    E3 complexes. Participates in the ubiquitin-mediated degradation of beta-catenin
    (CTNNB1).
