descriptions:
- source: UniProt
  text: Enzyme that cleaves trehalose to produce 2 glucose molecules that can be used
    by the glycolytic pathway (Probable). Glycolysis is essential in glial cells but
    not in neurons; neurons rely on the citric acid cycle for their energy needs,
    and on lactate and alanine secreted into the hemolymph by glial cells to fuel
    it (PubMed:26235423).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W2M2
