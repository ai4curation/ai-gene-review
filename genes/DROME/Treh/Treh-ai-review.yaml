taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Treh encodes the Drosophila trehalase, a glycoside hydrolase family 37 enzyme that hydrolyses
  the disaccharide alpha,alpha-trehalose into two glucose molecules. Alternative transcripts produce a
  secreted form with an N-terminal signal peptide (sTreh) and a cytoplasmic form without it (cTreh), which
  share the same catalytic domain. Treh is the main source of trehalose-hydrolysing activity in vivo;
  loss of Treh causes trehalose accumulation, reduced circulating glucose, pupal lethality and poor desiccation
  tolerance, showing that continuous trehalose turnover maintains glucose levels and body water homeostasis.
  Treh expression is induced by ecdysteroid signaling at the prepupal-pupal transition to break down circulating
  trehalose.
