suggested_questions:
- question: Where does the secreted sTreh isoform act - in the hemolymph, gut lumen or extracellular space
    of specific tissues - and is it the isoform that maintains circulating glucose?
suggested_experiments:
- description: Tag endogenous sTreh and cTreh isoforms to map their tissue and subcellular distribution,
    and test isoform-specific rescue of Treh null glucose and water-homeostasis phenotypes.
