id: Q961D1
gene_symbol: CycK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CycK (CG15218) is the Drosophila cyclin K, the activating cyclin of the RNA polymerase II
  CTD kinase Cdk12. Cyclin K co-purifies with nuclear dCDK12 as its cyclin subunit, and the CycK-Cdk12
  complex phosphorylates Ser2 of the Pol II CTD on transcribed genes to promote transcription elongation.
  Cyclin K also binds other CDKs in two-hybrid screens, but its established role is as the regulatory
  subunit of the elongation-phase CTD kinase.
