- source: Alliance_Imported
  text: Cyclin K (CycK) encodes a Cyclin-homologous subunit that forms a complex with
    the transcriptional kinase encoded by Cdk12. This complex phosphorylates the carboxy
    terminal domain of the large subunit of RNA polymerase II (encoded by Polr2A)
    and contributes to pre-mRNA processing, transcription and chromatin structure.
