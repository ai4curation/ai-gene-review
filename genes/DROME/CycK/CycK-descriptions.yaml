  text: Regulatory subunit of cyclin-dependent kinases that mediates activation of
    target kinases. Plays a role in transcriptional regulation via its role in regulating
    the phosphorylation of the C- terminal domain (CTD) of the large subunit of RNA
    polymerase II (POLR2A).
