descriptions:
- source: Alliance_Imported
  text: Ankyrin 2 (Ank2) encodes a cytoskeletal binding protein required for proper
    function of the product of &bgr;-Spec via direct interaction. It contributes to
    the regulation of short-term memory, sound perception, microtubule cytoskeleton
    and neuromuscular junction development and synapsis.
  source_type: curated
  url: https://flybase.org/reports/Ank2.html
  source_id: FB:FBgn0261788
