- term:
    id: GO:1900074
    label: negative regulation of neuromuscular synaptic transmission
  evidence_type: IMP
  original_reference_id: PMID:22153373
  qualifier: involved_in
  review:
    action: REMOVE
    summary: 'Contradicted by the cited full text: loss of ank2 lowers evoked EPSPs, secondary to NMJ degeneration.'
    reason: The full text of Keller et al. 2011 is available. It reports that ank2 mutants have reduced average
      EPSP amplitudes and attributes the reduction to the severe degeneration of the presynaptic terminal in these
      mutants, which eiger loss suppresses. A loss-of-function decrease in transmission is the opposite of what
      "negative regulation of neuromuscular synaptic transmission" asserts, and the effect is an indirect consequence
      of terminal loss rather than regulation of transmission. A sign-corrected replacement (positive regulation)
      is not proposed, because the reduced transmission follows from degeneration, which the neuron cellular homeostasis
      row already covers. The same gene-level row is on every Ank2 product accession; the problem is the claim itself,
      not the isoform.
    supported_by:
    - reference_id: PMID:22153373
      supporting_text: Next, we confirmed that the loss of ank2 results in impaired average EPSP amplitudes
    - reference_id: PMID:22153373
      supporting_text: The occurrence of severely degenerated NMJs in ank2 mutants (Figures 2E and 2F) correlates
        well with the number of recordings that show large defects in EPSP amplitude compared to wild-type
