    action: UNDECIDED
    summary: Neuron cellular homeostasis is not resolved for the short Ank2-PE isoform.
    reason: The full-text study directly tests ank2 mutants and shows severe NMJ degeneration with genetic
      suppression by eiger loss, supporting the neuronal-homeostasis role of the Ank2 locus. It uses the
