suggested_questions:
- question: Which localization, interaction and neuronal phenotypes have been measured specifically for Ank2-PE
    (Q3KN55; FBpp0292239), rather than the giant Ank2 isoforms?
- question: Do the LOPIT peptides and the Tramtrack interaction-screen ORF distinguish the 697-residue Ank2-PE product
    from other Ank2 proteins?
- question: What evidence supports the negative direction of the neuromuscular-transmission annotation in the ank2/eiger
    experiment?
core_functions:
- description: Short Ank2-PE product made of an isoform-specific N terminus and the N-terminal 13 ankyrin repeats
    shared with the giant Ank2 membrane-cytoskeleton adaptors; associated with the plasma membrane by organelle
    proteomics. No molecular function has been established for this product, and it lacks the giant-isoform regions
    responsible for microtubule organisation and synapse stabilisation.
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19317464
    supporting_text: Here, we apply LOPIT, a mass-spectrometry based technique that simultaneously maps proteins
      to specific subcellular compartments, to Drosophila embryos.
  - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
    supporting_text: Residues 159-667 of Q3KN55 are identical to residues 9-517 of both the UniProt gene-centric
      canonical Ank2 product M9MRX4
  - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
    supporting_text: Of the 21 UniProt ANK repeat features on M9MRX4 and on Q7KU92, 13 lie fully inside the block
      shared with Q3KN55.
  knowledge_gaps:
  - gap_statement: The binding partners, subcellular distribution and neuronal role of the short Ank2-PE product
      are unknown. It is not known whether its partial ankyrin repeat domain binds Neuroglian or other transmembrane
      partners, or whether it reaches presynaptic terminals.
    boundary: Giant Ank2-L/XL functions at the NMJ are established and depend on ARD subdomains and on the extended
      C terminus; Q3KN55 shares only giant-isoform residues 9-517.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:31475145
      supporting_text: We show that specific subdomains control synaptic but not axonal localization of Ank2-L.
suggested_experiments:
- description: Express epitope-tagged Ank2-PE in motoneurons of ank2 mutants and test its localisation (axon, presynaptic
    membrane, soma) and binding to Neuroglian, and whether it rescues any ank2 phenotype; complement with isoform-specific
    CRISPR deletion of the PE first exon.
