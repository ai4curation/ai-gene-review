- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:37061542
  qualifier: enables
  supporting_entities:
  - UniProtKB:P17789
  review:
    action: KEEP_AS_NON_CORE
    summary: A binary interaction with Tramtrack is recorded, without an established physiological activity.
    reason: The IPI annotation and UniProt IntAct record identify binding to Tramtrack (P17789), with
      four experiments recorded for Q3KN55. Retain the measured interaction as non-core; generic protein
      binding neither establishes an evolved molecular function nor justifies a transcriptional or synaptic
      role for this isoform. The large-scale interaction paper provides assay context, but its main text
      does not identify the Ank2 construct, so the exact ORF remains a follow-up question.
    supported_by:
