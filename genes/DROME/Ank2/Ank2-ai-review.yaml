      Ank2-L.
suggested_questions:
- question: Which localization, interaction and neuronal phenotypes have been measured specifically for
    Ank2-PE (Q3KN55; FBpp0292239), rather than the giant Ank2 isoforms?
- question: Do the LOPIT peptides and the Tramtrack interaction-screen ORF distinguish the 697-residue
    Ank2-PE product from other Ank2 proteins?
- question: What evidence supports the negative direction of the neuromuscular-transmission annotation
    in the ank2/eiger experiment?
