id: Q3KN55
gene_symbol: Ank2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ank2 encodes a diverse set of neuronal ankyrin proteins. Its giant isoforms stabilize presynaptic
  terminals by organizing the membrane-associated cytoskeleton and synaptic microtubules. Q3KN55 corresponds
  specifically to the 697-residue Ank2-PE isoform, with a low-complexity N terminus followed by ankyrin
  repeats. It does not contain the extended C-terminal region responsible for the well-characterized microtubule-organizing
  activity of Ank2-L. The physiological partners, localization and independent role of this short isoform
  remain incompletely established.
