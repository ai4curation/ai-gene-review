- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IMP
  original_reference_id: PMID:18439405
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: Microtubule cytoskeleton organization is not resolved for the short Ank2-PE isoform.
    reason: Q3KN55 is the 697-residue Ank2-PE polypeptide, whereas the decisive synaptic studies characterize
      giant Ank2 isoforms. The gene-level experimental annotation is credible, but the available evidence
      does not establish that this short product independently executes the same role. This is an unresolved
      isoform transfer, not evidence that the FlyBase curator annotated the wrong gene. The paper explicitly
      maps stabilization and microtubule organization to the extended C terminus of Ank2-L, absent from
      the selected ankyrin-repeat-only architecture; full text is unavailable in the publication cache,
      so additional experiments on Ank2-PE cannot be excluded.
    supported_by:
