- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:37061542
  qualifier: enables
  supporting_entities:
  - UniProtKB:P17789
  review:
    action: REMOVE
    summary: Generic protein binding (Tramtrack, from a large-scale binary interaction screen) is uninformative.
    reason: 'The IPI row records a binary interaction with the transcriptional repressor Tramtrack (P17789) from
      the genome-scale Drosophila yeast two-hybrid network; UniProt/IntAct record four experiments for Q3KN55. Under
      the protein-binding policy the bare GO:0005515 term is removed because it carries no functional information.
      Removal does not mean the interaction was not observed. No more specific molecular function can be derived
      from it: a cytoplasmic membrane-associated ankyrin-repeat product and a nuclear BTB-zinc-finger repressor
      have no established shared process.'
    supported_by:
    - reference_id: file:DROME/Ank2/Ank2-uniprot.txt
      record_section: ["CC:INTERACTION"]
      supporting_text: 'Q3KN55; P17789: ttk; NbExp=4; IntAct=EBI-15122666, EBI-6173284;'
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: HDA
  original_reference_id: PMID:19317464
  qualifier: located_in
  review:
    action: ACCEPT
    summary: Retain the experimental plasma-membrane association.
    reason: 'The HDA row records plasma-membrane association from LOPIT proteomics in Drosophila embryos. This broad
      location is compatible with the retained ankyrin-repeat interaction module and the membrane-associated cellular
      ankyrin family; it does not require the giant isoforms’ extended microtubule-binding tail. Defer to the curated
      experimental protein assignment rather than reject a plausible observation because the cached abstract lacks
      the peptide table. Isoform-discriminating peptides remain worth checking, and this membrane association does
      not establish secretion, extracellular exposure or localization to a particular presynaptic nanodomain. Re-review
      (2026-10-20): the LOPIT assignment is a FlyBase gene-level row on every Ank2 accession; Q3KN55 retains the
      N-terminal 13 ANK repeats shared with the membrane-associated giant isoforms, so a cytoplasmic-face plasma-membrane
      location is compatible with its sequence, and the broad term is as precise as the proteomic evidence allows.'
    supported_by:
    - reference_id: file:DROME/Ank2/Ank2-PE-flybase-source.txt
      supporting_text: CG42734-PE
    - reference_id: PMID:19317464
      supporting_text: Here, we apply LOPIT, a mass-spectrometry based technique that simultaneously maps proteins
        to specific subcellular compartments, to Drosophila embryos.
    - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
      supporting_text: Residues 159-667 of Q3KN55 are identical to residues 9-517 of both the UniProt gene-centric
        canonical Ank2 product M9MRX4
- term:
    id: GO:0007528
    label: neuromuscular junction development
  evidence_type: IMP
  original_reference_id: PMID:18439405
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: Neuromuscular junction development is not resolved for the short Ank2-PE isoform.
    reason: 'Q3KN55 is the 697-residue Ank2-PE polypeptide, whereas the decisive synaptic studies characterize giant
      Ank2 isoforms. The gene-level experimental annotation is credible, but the available evidence does not establish
      that this short product independently executes the same role. This is an unresolved isoform transfer, not
      evidence that the FlyBase curator annotated the wrong gene. The paper explicitly maps stabilization and microtubule
      organization to the extended C terminus of Ank2-L, absent from the selected ankyrin-repeat-only architecture;
      full text is unavailable in the publication cache, so additional experiments on Ank2-PE cannot be excluded.
      Re-review (2026-10-20): FlyBase makes this annotation to the Ank2 gene and UniProt/GOA carry it on every Ank2
      product accession (the same row is on the canonical M9MRX4 and on Ank2-L Q7KU92), so it is a gene-level claim
      that is not in doubt for the locus. Q3KN55 shares only giant-isoform residues 9-517 (13 of 21 ANK repeats)
      and no experiment identifies the short PE product, so its own participation stays UNDECIDED; the gene-level
      claim belongs on the canonical-product review.'
    supported_by:
    - reference_id: file:DROME/Ank2/Ank2-PE-flybase-source.txt
      supporting_text: CG42734-PE
    - reference_id: PMID:18439405
      supporting_text: The stabilizing functions of Ank2-L can be mapped to the extended C-terminal domain that
        we demonstrate can directly bind and organize synaptic microtubules.
    - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
      supporting_text: Residues 159-667 of Q3KN55 are identical to residues 9-517 of both the UniProt gene-centric
