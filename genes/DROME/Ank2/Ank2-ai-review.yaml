- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: HDA
  original_reference_id: PMID:19317464
  qualifier: located_in
  review:
    action: ACCEPT
    summary: Retain the experimental plasma-membrane association.
    reason: The HDA row records plasma-membrane association from LOPIT proteomics in Drosophila embryos.
      This broad location is compatible with the retained ankyrin-repeat interaction module and the membrane-associated
      cellular ankyrin family; it does not require the giant isoforms’ extended microtubule-binding tail.
      Defer to the curated experimental protein assignment rather than reject a plausible observation
      because the cached abstract lacks the peptide table. Isoform-discriminating peptides remain worth
      checking, and this membrane association does not establish secretion, extracellular exposure or
      localization to a particular presynaptic nanodomain.
    supported_by:
