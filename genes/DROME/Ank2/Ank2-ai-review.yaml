- term:
    id: GO:1900074
    label: negative regulation of neuromuscular synaptic transmission
  evidence_type: IMP
  original_reference_id: PMID:22153373
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: Negative regulation of neuromuscular synaptic transmission is not resolved for the short
      Ank2-PE isoform.
    reason: The full text shows reduced evoked EPSP amplitudes after ank2 loss and recovery when eiger
      is also removed. This supports maintenance of synaptic integrity and transmission, but does not
      by itself establish an evolved function of negatively regulating transmission. The genetic background
      and short-isoform contribution also remain unresolved. The physiological direction and annotation
      rationale require closer curator/figure-level review before retaining this negative-regulation term
      as core or proposing removal.
    supported_by:
