id: Q3KN55
gene_symbol: Ank2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Ank2 (Ankyrin 2) is the neuronal ankyrin of Drosophila. The locus encodes many products, from short
  ankyrin-repeat proteins to the giant Ank2-L and Ank2-XL isoforms. The giant isoforms are membrane-cytoskeleton
  adaptors in motoneuron axons and presynaptic terminals: they link the L1-family adhesion molecule Neuroglian to
  the spectrin cytoskeleton and, through their extended C-terminal regions, bind and organise presynaptic microtubules,
  which maintains neuromuscular junction stability. The product described here, Ank2-PE (697 aa), consists of an
  isoform-specific histidine-rich N terminus followed by the first 13 of the ankyrin repeats shared with the giant
  isoforms and a short unique C-terminal tail. It has none of the giant-isoform sequence beyond the N-terminal part
  of the repeat domain. It has been detected at the plasma membrane by organelle proteomics, but its own binding
  partners and neuronal role have not been determined.'
existing_annotations:
- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IMP
  original_reference_id: PMID:18439405
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: True of the Ank2 gene (giant isoforms), but an over-annotation of the 697-residue Ank2-PE product,
      which lacks the microtubule-binding region.
    reason: Ank2 mutants show disorganised presynaptic microtubules, and Pielage et al. 2008 map the stabilising
      and microtubule-organising activity of Ank2-L to its extended C-terminal domain, which binds synaptic microtubules
      directly. The annotation is a gene-level FlyBase assertion carried on every Ank2 product accession. Q3KN55
      contains only giant-isoform residues 9-517 (13 of the 21 ANK repeats) and nothing C-terminal to them, so it
      lacks the region to which this activity has been mapped. The claim is correct for the locus and should be
      kept on the canonical/giant products, but attributing microtubule cytoskeleton organisation to this short
      product over-annotates it. This is not a statement that the curator chose the wrong gene.
    supported_by:
    - reference_id: PMID:18439405
      supporting_text: The stabilizing functions of Ank2-L can be mapped to the extended C-terminal domain that
        we demonstrate can directly bind and organize synaptic microtubules.
    - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
      supporting_text: Residues 159-667 of Q3KN55 are identical to residues 9-517 of both the UniProt gene-centric
        canonical Ank2 product M9MRX4
    - reference_id: file:DROME/Ank2/Ank2-bioinformatics/RESULTS-rereview.md
      supporting_text: Of the 21 UniProt ANK repeat features on M9MRX4 and on Q7KU92, 13 lie fully inside the block
        shared with Q3KN55.
