    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    confidence_score: 0
    summary: Q3KN55 is the native short Ank2-PE product of the Drosophila neuronal ankyrin locus, not
      a latrotoxin. The prediction metadata identify alpha-latrocrustotoxin Q9XZC0 as the phmmer donor
      (model score 0.49; phmmer score 293.2). The experimentally determined latrotoxin structure requires
      a central membrane-insertion domain in addition to ankyrin-like repeats; generic repeat similarity
      does not transfer its evolved inter-organism toxic function to the fly cellular ankyrin. The target
      record instead shows a low-complexity N terminus and ankyrin repeats, with no evidence for the toxin-specific
      architecture or venom role. This is a biologically incompatible functional transfer, not a demonstrated
      paralog relationship or a FlyBase annotation error. No equivalent toxin term occurs in the target
      GOA.
