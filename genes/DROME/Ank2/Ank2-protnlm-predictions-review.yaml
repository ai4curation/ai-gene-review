  review:
    assessment: NPI
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    confidence_score: 0
    summary: Residence in the extracellular region requires a route out of the cell, normally an N-terminal
      signal peptide, and the 697-residue Ank2-PE product scored here has none. Its N terminus begins
      MAQFVTHIQPTLMEASQGHVPHHH and continues as a histidine-rich, disordered, low-complexity segment
      (MobiDB-lite disordered region 17-112) with no hydrophobic core, and the record carries no signal
      peptide or transmembrane feature. Q3KN55 consists of that unique N terminus, the first 13 ankyrin
      repeats shared with the giant isoforms, and a short tail, none of which supplies a secretion signal.
      The model's donor is the secreted spider toxin Q9XZC0, whose compartment cannot be transferred through
      shared ankyrin repeats. Characterized Ank2 isoforms are intracellular membrane-cytoskeleton adaptors,
      and the Ank2 ankyrin-repeat domain that Ank2-PE retains is described as part of an intracellular
      linker to transmembrane partners. Neither Q3KN55 nor the sibling Ank2 product M9MRX4 carries an
      extracellular term in GOA.
