  review:
    assessment: UNC
    confidence_score: 1
    summary: Ank2-dependent synaptic stability and neurotransmission make a role in vesicle release conceivable,
      but they do not establish exocytosis by the exact 697-residue Ank2-PE isoform. The principal experiments
      characterize giant Ank2 isoforms and their extended C-terminal microtubule-organizing region. The
      API metadata indicate human ankyrin-1 P16157 as the donor for this claim (model score 0.53; phmmer
      score 889.4), rather than the latrotoxin donor used for the toxin claim. Donor exocytosis annotation
      and synaptic phenotypes are insufficient to resolve transfer across these distinct proteins and
      isoforms. An Ank2-PE-specific secretion assay or supported interaction with the vesicle-fusion apparatus
      is missing, and a PubMed search of Drosophila Ank2 found no exocytosis or secretion study, so neither
      correctness nor biological refutation is justified. The term is absent from the GOA of both Q3KN55
      and the sibling Ank2 product M9MRX4.
