id: Q3KN55
gene_symbol: Ank2
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
status: COMPLETE
description: The selected protein is the short neuronal Ank2-PE isoform. Toxin activity is contradicted
  by its cellular ankyrin identity and the distinct multidomain mechanism of the indicated latrotoxin
  donor. Exocytosis and extracellular localization remain unverified for this exact isoform; gene-level
  synaptic evidence and donor labels cannot resolve either claim.
