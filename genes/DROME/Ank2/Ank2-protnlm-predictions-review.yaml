  predicted_term:
    id: GO:0005576
    label: extracellular region
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: The cellular ankyrin identity and intracellular scaffold biology of characterized Ank2 isoforms
      argue against a secreted extracellular protein. The model instead points to the secreted spider
      toxin Q9XZC0 (model score 0.54; phmmer score 293.2); its compartment cannot be transferred through
      shared ankyrin repeats. However, the available localization studies concern giant Ank2 isoforms
      or an unresolved proteomics protein group, and the 697-residue Ank2-PE product lacks direct isoform-specific
      localization data. The sequence record has no annotated signal peptide, but absence of a signal
      annotation alone is not a complete localization test. Extracellular residence therefore remains
      unsupported rather than experimentally refuted for this exact product; no equivalent target GOA
      term exists.
    supported_by:
