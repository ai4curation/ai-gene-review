      supporting_text: CG42734-PE
    - reference_id: PMID:18439406
      supporting_text: we recovered mutations in Drosophila ankyrin 2 (ank2) affecting two giant Ank2
        isoforms that are specifically expressed in the nervous system and associate with the presynaptic
        membrane cytoskeleton.
