- source: Alliance_Imported
  text: Sterile20-like kinase (Slik) encodes a member of the Sterile-20 kinase family.
    It acts via Raf to promote cell proliferation in imaginal disc epithelia. Independently,
    Slik acts via the product of Moe to support epithelial integrity.
  source_type: curated
  url: https://flybase.org/reports/Slik.html
