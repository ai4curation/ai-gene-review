- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including cytoskeleton organization; metaphase/anaphase transition of mitotic
    cell cycle; and rhabdomere membrane biogenesis. Located in several cellular components,
    including cleavage furrow; mitotic spindle midzone; and rhabdomere. Is expressed
    in adult head and spermatozoon. Orthologous to several human genes including SLK
    (STE20 like kinase).
  source_type: automated
