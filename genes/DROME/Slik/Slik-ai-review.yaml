    label: establishment of mitotic spindle orientation
  evidence_type: IMP
  original_reference_id: PMID:18283112
  qualifier: involved_in
  review:
    summary: Slik-depleted S2 cells show unstable spindle orientation from metaphase to
      ana/telophase, phenocopying Moesin loss.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is well documented, but Slik acts through activating Moesin at
      the cortex; spindle orientation is a downstream consequence of cortical stability.
      Kept as a non-core process rather than removed, since the curator-reported phenotype
      is real and Slik-dependent cortical p-Moesin is part of the mechanism.
    supported_by:
