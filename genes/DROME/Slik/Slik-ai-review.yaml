id: A4UZU8
gene_symbol: Slik
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Slik (Sterile20-like kinase; CG4527, also Plkk1) is the Drosophila member of
  the GCK-V subfamily of Ste20 serine/threonine kinases, orthologous to human SLK and
  STK10/LOK. It has an N-terminal kinase domain, a long disordered middle region and a
  C-terminal coiled-coil domain. Its best-established catalytic function is phosphorylation
  of the conserved C-terminal threonine (T559) of Moesin, the sole fly ERM protein, which
  opens and activates Moesin so that it links cortical F-actin to the plasma membrane; it
  also phosphorylates Talin T152 at muscle attachment sites and promotes inactivating
  phosphorylation of Merlin. Slik is concentrated at the cell cortex (apical cortex of
  epithelia, the luminal membrane of tracheal terminal cells, the mitotic cortex and
  cleavage furrow of dividing cells), where its cortical association depends on its
  coiled-coil domain and on dephosphorylation by the STRIPAK PP2A complex. Through Moesin
  activation Slik maintains cortical stability and spindle positioning in mitosis and
  epithelial integrity in imaginal discs. A kinase-independent activity of the coiled-coil
  domain promotes tissue growth and can tubulate membranes into cytonemes, and Slik
  suppresses JNK-dependent apoptosis.
