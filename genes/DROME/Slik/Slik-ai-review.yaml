core_functions:
- description: Ste20-family protein serine/threonine kinase that phosphorylates the conserved
    C-terminal threonine (T559) of Moesin at the cell cortex, activating Moesin to link
    cortical F-actin to the plasma membrane; this maintains cortical stability in mitosis
    and epithelial integrity. Additional substrates include Talin (T152).
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0030866
    label: cortical actin cytoskeleton organization
  locations:
  - id: GO:0005938
    label: cell cortex
  - id: GO:0045179
    label: apical cortex
  supported_by:
  - reference_id: PMID:26170449
    supporting_text: wild-type Slik phosphorylated a truncated form of Moesin consisting
      of the C-terminal actin-binding domain
  - reference_id: PMID:18283112
    supporting_text: Collectively, our data show that Slik-dependent phosphorylation of
      moesin at T559 directs moesin activation and function during mitosis.
  - reference_id: PMID:32960945
    supporting_text: (d) Once at the cell cortex, Slik can phosphorylate the PtdIns(4,5)P2-primed
      moesin on its T559.
suggested_questions:
- question: Is the spindle midzone localization (GO:1990023) of Slik in dividing S2 cells
    distinct from its equatorial cortex/cleavage furrow signal?
- question: Does Slik phosphorylate Merlin directly, and on which residue, given that Slik
    promotes Merlin phosphorylation in vivo but direct phosphorylation was left unresolved?
- question: Is Slik a stable STRIPAK subunit (analogous to GCK-III kinases) or a transient
    STRIPAK substrate, and should membrane tubulation by its coiled-coil domain (cytoneme
    formation) be captured with a molecular function term?
suggested_experiments:
- description: In vitro kinase assays of purified Slik on Merlin and on peptide libraries
    to define substrate residue specificity (Ser versus Thr) and test direct Merlin
    phosphorylation.
- description: Endogenously tagged Slik (CRISPR knock-in) imaging in dividing S2 cells and
    neuroblasts with spindle and furrow markers to resolve cortical, furrow and midzone pools.
- description: Endogenous Slik AP-MS in S2 cells to test stoichiometric association with
    STRIPAK subunits (Cka, Strip, Mob4).
