- id: PMID:17060498
  title: Phosphorylation and activity of the tumor suppressor Merlin and the ERM protein
    Moesin are coordinately regulated by the Slik kinase.
  findings:
  - statement: Slik controls Merlin localization and phosphorylation and Moesin phosphorylation;
      Slik binds Merlin and Moesin in vitro, but direct phosphorylation was not shown.
    supporting_text: It remains unclear whether Slik itself can directly phosphorylate
      either protein or whether there are one or more kinases operating downstream of Slik.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Strong genetic/biochemical regulation data; the IDA for
      kinase activity is generous as the authors state direct phosphorylation is unresolved.
- id: PMID:18283112
  title: Moesin and its activating kinase Slik are required for cortical stability
    and microtubule organization in mitotic cells.
  findings:
  - statement: Slik phosphorylates/activates Moesin T559 at the mitotic cortex; Slik depletion
      phenocopies Moesin loss for cortical stability, spindle organization and positioning.
    supporting_text: Collectively, our data show that Slik-dependent phosphorylation of
      moesin at T559 directs moesin activation and function during mitosis.
  - statement: Slik protein distribution parallels p-Moesin through division.
    supporting_text: Importantly, using antibodies to detect the Slik kinase, we found
      that distribution of the Slik protein paralleled p-moesin localization throughout
      division in wild-type cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC2265583). Supports kinase function in vivo, cortex
      and cleavage-furrow localization and mitotic phenotypes; no text mention of spindle
      midzone.
- id: PMID:26170449
  title: Regulation of Catalytic and Non-catalytic Functions of the Drosophila Ste20
    Kinase Slik by Activation Segment Phosphorylation.
  findings:
  - statement: Immunoprecipitated Slik phosphorylates the Moesin C-terminal domain and
      itself in vitro; the CCD directs apical localization and a non-catalytic growth function.
    supporting_text: wild-type Slik phosphorylated a truncated form of Moesin consisting
      of the C-terminal actin-binding domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; direct biochemical evidence of kinase activity.
- id: PMID:32960945
  title: STRIPAK regulates Slik localization to control mitotic morphogenesis and epithelial
    integrity.
  findings:
  - statement: Slik associates with STRIPAK (Cka, Strip); STRIPAK PP2A dephosphorylates
      Slik to promote its cortical association and Moesin activation.
    supporting_text: Here, we show that Slik is a new STRIPAK-associated kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read.
