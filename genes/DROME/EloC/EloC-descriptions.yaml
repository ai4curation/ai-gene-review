      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Correct on wing cell identity and the Elongin complex interacting
      with Corto. Omits the cullin-RING ligase adaptor role, the main role in the
      review.
- source: Alliance_Automated
  text: Enables chromatin binding activity. Involved in several processes, including
    imaginal disc-derived wing vein specification; negative regulation of receptor
    signaling pathway via JAK-STAT; and target-directed miRNA degradation. Part of
    Cul2-RING ubiquitin ligase complex; Cul3-RING ubiquitin ligase complex; and elongin
    complex. Is expressed in adult head. Orthologous to human ELOC (elongin C).
  source_type: automated
  url: https://flybase.org/reports/EloC.html
  source_id: FB:FBgn0266711
