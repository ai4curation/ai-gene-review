descriptions:
- source: Alliance_Imported
  text: Elongin C (EloC) encodes an essential protein for development that participates
    in the control of wing cell identity. EloB, EloC and EloA encode for subunits
    of the Elongin complex, which interacts in vivo with the chromatin factor encoded
    by corto.
  source_type: curated
  url: https://flybase.org/reports/EloC.html
  source_id: FB:FBgn0266711
