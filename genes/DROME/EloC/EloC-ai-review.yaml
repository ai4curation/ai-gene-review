suggested_questions:
- question: Is the fly Dora/ZSWIM8 TDMD ligase built on Cul3 (as reported) or on Cul2/Cul5, given that
    EloB/C usually partner with Cul2/Cul5?
- question: Does fly EloC contribute to Pol II elongation in vivo independently of its CRL adaptor role,
    for example at rhomboid?
suggested_experiments:
- hypothesis: EloC acts at rhomboid as part of the Elongin elongation complex rather than as a CRL adaptor.
  description: Compare wing-vein phenotypes and rhomboid Pol II elongation (PRO-seq/ChIP) in EloA, Vhl,
    Cul2 and Cul5 knockdowns versus EloC knockdown.
