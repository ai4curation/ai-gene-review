description: 'Elongin C (EloC) is a small Skp1-like protein that, together with the ubiquitin-like Elongin
  B, forms the EloB/C heterodimer. EloB/C serves two roles: as the adaptor of cullin-RING ligases, EloC
  binds the BC-box of substrate receptors such as Vhl, SOCS-box proteins (Socs36E) and the ZSWIM8 ortholog
  Dora, and links them to Cul2 (or Cul5) and the RING protein Roc1a, forming ligases such as the VCB-Cul2
  complex that ubiquitinates HIF-alpha/Sima, the Cul5-Socs36E ligase that dampens JAK/STAT signaling,
  and a Dora ligase required for target-directed miRNA degradation; and, with Elongin A, as part of the
  Elongin transcription elongation complex that increases RNA polymerase II elongation. In the wing, EloC
  binds the rhomboid locus and acts with EloA/B in vein versus intervein specification. EloC is found
  in the nucleus and cytoplasm.'
