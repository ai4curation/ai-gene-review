- id: PMID:31409654
  title: Apical polarity proteins recruit the RhoGEF Cysts to promote junctional myosin assembly.
  findings:
  - statement: Cysts (CG10188) is the single Drosophila ortholog of the four mammalian Lbc-family RhoGEFs p114RhoGEF (ARHGEF18), GEF-H1 (ARHGEF2), p190RhoGEF (ARHGEF28), and AKAP-13 (AKAP13).
    supporting_text: To explore the regulation of Rho GTPases in vivo, we analyzed the Rho GTPase guanine nucleotide exchange factor (RhoGEF) Cysts, the Drosophila orthologue of mammalian p114RhoGEF, GEF-H1, p190RhoGEF, and AKAP-13.
  - statement: Cysts is recruited to the apico-lateral adherens junction region by the Crumbs complex and Bazooka/Par3, where it activates Rho1 and stabilizes junctional myosin II.
    supporting_text: We demonstrate that Cysts is recruited to the apico-lateral membrane through interactions with the Crumbs complex and Bazooka/Par3.
  - statement: Maternal loss of cyst disrupts adherens junction integrity during gastrulation and collapses the embryonic epidermis into small epithelial vesicles/cysts.
    supporting_text: Maternal knockdown of CG10188 caused an embryonic lethal phenotype characterized by the formation of many small epithelial vesicles or cysts instead of a large continuous epithelial sheet.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding genetic and cell-biological characterization of Drosophila cyst (full text cached). Despite naming the gene and establishing its Crumbs/Bazooka-dependent adherens junction localization and Rho1 activation, it previously contributed zero GO annotations to the Drosophila record; used here to ground two NEW annotations (GO:0005912 and GO:0034332).
