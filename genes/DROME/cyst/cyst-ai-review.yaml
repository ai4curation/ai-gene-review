core_functions:
- description: Catalyzes GDP-to-GTP exchange on Rho1 at apico-lateral adherens junctions (recruited downstream of the Crumbs complex and Bazooka/Par-3) and at the cytokinetic cleavage furrow rim, driving localized Rok and non-muscle myosin II activation required for adherens junction organization and epithelial tissue integrity.
