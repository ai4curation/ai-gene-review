taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cysts (Cyst; also called Dp114RhoGEF or CG10188) is the single-copy Drosophila melanogaster Lbc-family Dbl-homology/pleckstrin-homology (DH/PH) guanine nucleotide exchange factor orthologous to vertebrate ARHGEF18 (p114RhoGEF), ARHGEF2 (GEF-H1), ARHGEF28 (p190RhoGEF), and AKAP13 (AKAP-Lbc). It contains an N-terminal C1-like zinc-finger motif, a central DH/PH catalytic module (residues 442-799 in isoform M9PBE1) that activates Rho1 rather than Rac or Cdc42, and a long coiled-coil and disordered C-terminal region that mediates subcellular recruitment. In embryonic epithelia, interactions with the Crumbs apical polarity complex and Bazooka/Par-3 recruit Cysts to the apico-lateral adherens junction belt, where localized Rho1 activation drives Rok-dependent non-muscle myosin II assembly to maintain adherens junction integrity and apicobasal epithelial sheet cohesion during gastrulation. During epithelial cytokinesis in the pupal notum, Cysts localizes to the ingressing cleavage furrow rim and signals through Rho1 in neighboring-cell mechanosensing to promote daughter-daughter membrane juxtaposition prior to de novo adherens junction assembly.
