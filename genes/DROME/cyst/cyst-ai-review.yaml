  knowledge_gaps:
  - gap_statement: Quantitative in vitro nucleotide-exchange kinetics of purified recombinant Cysts DH/PH against Drosophila Rho1, Rac1, Rac2, Mtl, and Cdc42 have not been measured.
    boundary: In vivo genetic epistasis, biosensor imaging, and GST-GTPase pull-downs in PMID:31409654 establish selective coupling to Rho1 over Rac1 and Cdc42, but intrinsic kcat/Km parameters of the isolated fly DH/PH cassette have not been determined.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Direct kinetic comparison with vertebrate ARHGEF18, ARHGEF2, ARHGEF28, and AKAP13 would test whether strict RhoA/Rho1 selectivity and PH-domain positive-feedback binding to Rho1-GTP predated vertebrate Lbc-family duplication.
    resolution: Stopped-flow MANT-GDP/GTP exchange assays and isothermal titration calorimetry using purified Cysts DH and DH-PH proteins against Drosophila Rho1, Rac1, and Cdc42.
suggested_questions:
- question: Does the PH domain of Drosophila Cysts bind activated Rho1-GTP to drive positive-feedback clustering at adherens junctions, analogous to the PH-RhoA-GTP interface solved for vertebrate p114RhoGEF and AKAP-Lbc?
  experts:
  - Ulrich Tepass, Drosophila epithelial polarity and Cysts characterization
  - Paul C. Sternweis, structural biology of Lbc-family PH-RhoA-GTP positive feedback
- question: Does Cysts associate with microtubules or undergo mitotic kinase phosphoinhibition prior to cleavage furrow ingression in Drosophila epithelia, or was microtubule sequestration acquired specifically along the vertebrate SF20 (ARHGEF2) and SF22 (ARHGEF28) lineages?
  experts:
  - Yohanns Bellaiche, Drosophila epithelial cytokinesis and Cysts/RhoGEF4 dynamics
  - Tony J. C. Harris, Bazooka/Par-3 and adherens junction actomyosin assembly
suggested_experiments:
- description: Measure stopped-flow MANT-GDP dissociation kinetics of purified Drosophila Cysts DH (residues 442-637) and DH-PH (residues 442-799) modules against Rho1, Rac1, Rac2, Mtl, and Cdc42, using the catalytic CR3 mutant Y590A as negative control, and test binding of the isolated PH domain to GMPPNP-loaded Rho1.
- description: Map the minimal Crumbs- and Bazooka/Par-3-interacting motifs within the disordered C-terminal tail of Cysts (residues 965-1334) by CRISPR knock-in deletion alleles in Drosophila embryos and pupal notum to test whether junctional maintenance and cytokinetic furrow recruitment rely on shared or separable recruitment interfaces.
