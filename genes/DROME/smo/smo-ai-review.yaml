        co-fractionate, suggesting a large complex of both membrane and cytoplasmic components of the
        Hedgehog pathway.
    - reference_id: PMID:8898207
      supporting_text: Hh binds to Ptc, or a Ptc-Smo complex, and thereby induces Smo activity
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:14597665
  qualifier: enables
  supporting_entities:
  - FB:FBgn0000352
  review:
    summary: The interaction recorded here is between the Smo C-terminal cytoplasmic tail and the kinesin-related
      scaffold Costal-2, the step that brings the Cos2/Fused/Ci complex to the activated receptor at the
      membrane.
    action: MODIFY
    reason: A bare protein binding annotation carries no functional information, but the cited evidence
      supports a specific one. Smo's phosphorylated tail recruits the Cos2/Fu complex to the plasma membrane,
      and deleting the Cos2-binding segment abolishes signalling without abolishing the rest of the receptor,
      so Smo is acting as the adaptor that couples the receptor to the cytoplasmic signalling complex.
      Modify to GO:0030674 protein-macromolecule adaptor activity, the molecular function assigned to
      this step in modules/hedgehog_signaling.yaml.
    proposed_replacement_terms: &id001
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    additional_reference_ids:
    - PMID:21844892
    supported_by:
    - reference_id: PMID:14597665
      supporting_text: Smo physically interacts with Costal2 (Cos2) and Fused (Fu) through its C-tail.
        Deletion of the Cos2/Fu-binding domain from Smo abolishes its signaling activity.
    - reference_id: PMID:21844892
      supporting_text: Collectively, our data indicate that, in response to a Hh gradient and Smo activity,
        the Cos2/Fu complex is recruited to the cell membrane through an interaction between Smo and Cos2.
