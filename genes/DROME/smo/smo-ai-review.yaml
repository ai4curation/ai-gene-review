- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17284519
  qualifier: enables
  supporting_entities:
  - FB:FBgn0264270
  review:
    summary: Cubitus interruptus, Sex-lethal, Patched and Smoothened co-immunoprecipitate and co-fractionate,
      which the authors interpret as a single large complex containing both membrane and cytoplasmic pathway
      components.
    action: REMOVE
    reason: Removed because the generic term is uninformative and, unlike the Costal-2 rows, the evidence
      here does not support a more specific molecular function for Smo. The recovery of Sex-lethal with
      Smo is from a co-immunoprecipitation of a large multi-protein assembly, so it does not establish
      a direct Smo-Sxl contact or any activity Smo performs on Sxl; the authors' own model has Sxl acting
      on Ci and on endocytic cycling. Removal does not mean the reported co-purification is false.
    supported_by:
    - reference_id: PMID:17284519
      supporting_text: Cubitus interruptus, Sex-lethal, Patched and Smoothened co-immunoprecipitate and
        co-fractionate, suggesting a large complex of both membrane and cytoplasmic components of the
