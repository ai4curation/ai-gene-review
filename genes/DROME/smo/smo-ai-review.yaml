      the objection is to the node placement. Drosophila smo is absent from the WITH/FROM list, no Hh/Smo
      commissural guidance role of this kind is described in the fly, and a vertebrate-scoped sibling
      node (PTN002601731) already exists that would carry the same evidence without reaching into protostomes.
      Contrast the cilium and dendrite rows at the same node, where fly smo is itself a seed and the assertion
      therefore stands.'
