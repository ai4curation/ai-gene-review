- term:
    id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:18987629
  qualifier: involved_in
  review:
    summary: Hedgehog stimulation activates Galphai through Smo and lowers intracellular cAMP; genetic
      reduction of Galphai or of cAMP phosphodiesterase modifies smo wing phenotypes, placing the adenylate
      cyclase-inhibiting branch immediately downstream of Smo.
    action: ACCEPT
    reason: Accepted as a core process annotation. This names the immediate biochemical branch in which
      Smo itself acts, not a remote developmental phenotype, and it is the fly counterpart of the same
      term accepted on human SMO.
    supported_by:
    - reference_id: PMID:18987629
      supporting_text: Here we present in vitro and in vivo evidence in Drosophila that Smo activates
        a G protein to modulate intracellular cyclic AMP levels in response to Hh.
    - reference_id: PMID:18987629
      supporting_text: Our results demonstrate that Smo functions as a canonical GPCR, which signals through
        Galphai to regulate Hh pathway activation.
