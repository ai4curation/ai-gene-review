    id: GO:0007224
    label: smoothened signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003444
  - MGI:MGI:108075
  - PANTHER:PTN000885245
  - UniProtKB:Q98SW5
  - UniProtKB:Q99835
  - ZFIN:ZDB-GENE-980526-89
  review:
    summary: Smo is the obligate membrane transducer of the Drosophila Hedgehog pathway. Hh relieves Ptc-mediated
      inhibition; PKA, CK1 and Gprk2 progressively phosphorylate the long C-terminal tail; the tail opens,
      dimerises, and recruits the Costal-2/Fused complex to the membrane, activating Fused and switching
      Cubitus interruptus from repressor to activator.
    action: ACCEPT
    reason: Accepted as the core process. This is the single best-supported annotation on the gene, resting
      on mutant clone analysis in embryos and imaginal discs, structure-function dissection of the C-tail,
      phosphosite mapping, conformational FRET reporters and biochemical reconstitution.
    supported_by:
    - reference_id: PMID:15616566
      supporting_text: Our data indicate that Hh induces progressive Smo phosphorylation by PKA and CKI,
        leading to elevation of Smo cell-surface levels and signalling activity.
    - reference_id: PMID:14597665
      supporting_text: Smo physically interacts with Costal2 (Cos2) and Fused (Fu) through its C-tail.
        Deletion of the Cos2/Fu-binding domain from Smo abolishes its signaling activity.
