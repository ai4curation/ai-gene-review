- term:
    id: GO:1903078
    label: positive regulation of protein localization to plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:17658259
  qualifier: involved_in
  review:
    summary: Hedgehog drives targeting of the Fused kinase to the plasma membrane, and this depends on
      Smo; membrane-anchored Fused becomes a potent Ptc-resistant pathway activator, and Smo and Gprk2
      together bind the Fused regulatory domain.
    action: ACCEPT
    reason: Accepted as a core process annotation. Concentrating Fused at the membrane is not an indirect
      downstream consequence but the direct mechanism by which Smo activates the kinase, and it is executed
      by Smo's own C-terminal tail acting with Cos2.
    additional_reference_ids:
    - PMID:21844892
    - PMID:30541874
    supported_by:
    - reference_id: PMID:17658259
      supporting_text: We show here that HH induces FU targeting to the plasma membrane in a SMO-dependent
        fashion and that, reciprocally, FU controls SMO stability and phosphorylation.
    - reference_id: PMID:21844892
      supporting_text: Collectively, our data indicate that, in response to a Hh gradient and Smo activity,
        the Cos2/Fu complex is recruited to the cell membrane through an interaction between Smo and Cos2.
    - reference_id: PMID:30541874
      supporting_text: we show that the last amino acids of the cytoplasmic tail of Smo, in combination
        with G protein-coupled receptor kinase 2 (Gprk2), bind to the regulatory domain of Fused (Fu)
        and highly activate its kinase activity
- term:
    id: GO:2000134
    label: negative regulation of G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:15809036
  qualifier: involved_in
  review:
    summary: In the differentiating Drosophila eye, all cells arrest in G1 ahead of the morphogenetic
      furrow, and this arrest depends redundantly on Dpp and Hedgehog signalling.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core. The G1/S block is imposed by cell cycle regulators such as Dacapo and
      Rbf/E2F acting downstream; Hh/Smo is one of two redundant extracellular inputs. This is a cellular
      consequence of Smo signalling, not a step Smo performs.
    supported_by:
    - reference_id: PMID:15809036
      supporting_text: All cells arrest in G1 prior to the start of neurogenesis. Arrest depends on Dpp
        and Hh, acting redundantly.
- term:
    id: GO:2000736
    label: regulation of stem cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:28619819
  qualifier: involved_in
  review:
    summary: In escort cells of the germarium, Hedgehog signalling limits BMP ligand production so that
      germline cysts can differentiate; Hh and Yorkie do this through separate outputs.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core. Regulation of stem cell differentiation here is a niche-level effect
      produced by Ci-dependent changes in BMP ligand expression. Smo's role is reception of the Hh signal.
    supported_by:
    - reference_id: PMID:28619819
      supporting_text: Here, we show that in ECs both Hh and Yki limit production of BMP ligands to allow
        germline differentiation.
