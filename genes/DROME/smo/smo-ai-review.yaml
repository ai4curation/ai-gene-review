  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9VDD8
  review:
    summary: Hedgehog promotes binding of the deubiquitinase USP8 to Smo residues 625-753, which span
      the three PKA/CK1 phosphorylation clusters; USP8 removes Smo ubiquitin and promotes its accumulation
      at the cell surface.
    action: REMOVE
    reason: 'Removed because the generic term is uninformative and the evidence does not support a more
      specific molecular function for Smo. In this interaction Smo is the substrate: USP8 is the deubiquitinase
      and Smo is the protein whose ubiquitination it removes, so the informative annotations belong on
      USP8 (its hydrolase activity) and on Smo''s own trafficking, not on a bare binding row. Removal
      does not mean the interaction is false; it is well mapped, to Smo residues 625-753.'
    supported_by:
    - reference_id: PMID:22253573
      supporting_text: we show that Hh promotes the interaction of USP8 with Smo aa625-753, which covers
        the three PKA and CK1 phosphorylation clusters
    - reference_id: PMID:22253573
      supporting_text: USP8 promotes the accumulation of Smo at the cell surface and prevents localization
        to the early endosomes, presumably by deubiquitinating Smo.
