id: P91682
gene_symbol: smo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Smoothened (Smo) is the class-F seven-transmembrane receptor that transduces Hedgehog signalling
  in Drosophila. In the absence of ligand, Patched (Ptc) keeps Smo inactive and destabilised; Hedgehog
  binding to Ptc relieves that inhibition and Smo accumulates at the plasma membrane in a progressively
  activated state. What distinguishes the fly protein from its vertebrate orthologue is an unusually long
  (~480-residue) C-terminal cytoplasmic tail. Hedgehog drives graded phosphorylation of this tail by protein
  kinase A, casein kinase 1 and G protein-coupled receptor kinase 2, which neutralises inhibitory arginine
  clusters, switches the tail from a closed to an open conformation, promotes its dimerisation, and converts
  it into a docking platform for the kinesin-related scaffold Costal-2 and the Ser/Thr kinase Fused. Recruiting
  the Costal-2/Fused complex to the membrane activates Fused, blocks proteolytic processing of the transcription
  factor Cubitus interruptus into its repressor form, and releases the Ci activator. Because this cytoplasmic
  complex performs the organising role that the primary cilium plays in vertebrates, Hedgehog transduction
  in fly epithelia such as the imaginal discs proceeds without a cilium; in the ciliated olfactory sensory
  neurons, however, Smo localises to the sensory cilium and signals from there in an intraflagellar-transport-dependent
  manner. Smo also behaves as a canonical GPCR, coupling to Galphai to lower cAMP, and its activation
  state is tuned by membrane lipids: phosphatidylinositol 4-phosphate binds an arginine motif in the C-tail
  and phosphatidic acid binds a pocket in the transmembrane core. Through these mechanisms Smo governs
  embryonic segment polarity, anterior/posterior patterning and growth of the imaginal discs, eye and
  head development, ovarian somatic stem cell maintenance and follicle cell development, and a Hedgehog-dependent
  arm of the gut epithelial immune response to bacterial uracil.'
existing_annotations:
- term:
    id: GO:0001745
    label: compound eye morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:16651542
  qualifier: involved_in
  review:
    summary: Hedgehog signalling through Smo shapes the developing compound eye; manipulating the Hh-induced
      Cul3 adaptor Roadkill, which limits Ci levels, disorganises pigment and cone cells.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core. Compound eye morphogenesis is a tissue-level developmental output of
      Hh/Smo signalling rather than an activity Smo itself performs. The molecular work Smo does here
      is the same receptor transduction captured by GO:0007224.
    supported_by:
    - reference_id: PMID:16651542
      supporting_text: rdx manipulation in the eye revealed a novel role for Hh in the organization and
        survival of pigment and cone cells
- term:
    id: GO:0001746
    label: Bolwig's organ morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:10704398
  qualifier: involved_in
  review:
    summary: Bolwig's organ (the larval photoreceptor) fails to form without Hedgehog signalling, which
      acts with eyes absent and sine oculis to drive atonal expression; notably this branch operates without
      Fused kinase or Cubitus interruptus.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core. This is a developmental output downstream of Smo-mediated Hh reception,
      not a molecular function of Smo. The observation that the branch is Fu/Ci-independent is interesting
      for pathway architecture but does not change Smo's role as the transducer.
    supported_by:
    - reference_id: PMID:10704398
      supporting_text: Neither Atonal expression nor Bolwig's organ formation occurred in the absence
        of hedgehog, eyes absent or sine oculis activity.
- term:
    id: GO:0002385
    label: mucosal immune response
  evidence_type: IMP
  original_reference_id: PMID:25639794
  qualifier: involved_in
  review:
    summary: Bacterial uracil triggers a Hedgehog pathway in the adult gut epithelium that induces Cadherin
      99C and Cad99C-dependent signalling endosomes, which are required for DUOX-dependent reactive oxygen
      species production; smo knockdown abolishes this response and reduces survival after infection.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core. Smo genuinely transduces the Hh signal that initiates this epithelial
      immune response, and UniProt records it as an experimentally supported function, but the mucosal
      immune response itself is executed downstream by Cad99C, PLC-beta/PKC/Ca2+ and DUOX. This is a physiological
      output of Smo signalling rather than Smo's own activity.
    supported_by:
    - reference_id: PMID:25639794
      supporting_text: Uracil-induced Hh signaling is required for intestinal expression of the calcium-dependent
        cell adhesion molecule Cadherin 99C (Cad99C) and subsequent Cad99C-dependent formation of endosomes.
    - reference_id: file:DROME/smo/smo-uniprot.txt
      supporting_text: 'Essential component of a hh-signaling pathway which

        CC       regulates the Duox-dependent gut immune response to bacterial uracil'
