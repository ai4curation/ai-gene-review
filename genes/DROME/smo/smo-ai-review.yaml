- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IDA
  original_reference_id: PMID:18987629
  qualifier: enables
  review:
    summary: 'Drosophila Smo signals as a canonical GPCR: Hh stimulation activates Galphai in a Smo-dependent
      manner and lowers intracellular cAMP, and Galphai acts downstream of Smo and upstream of Fused and
      Ci.'
    action: ACCEPT
    reason: Accepted as a core molecular function. The seven-transmembrane architecture was recognised
      in the original cloning paper and heterotrimeric G protein coupling was demonstrated directly in
      fly cells and wing discs.
    supported_by:
    - reference_id: PMID:18987629
      supporting_text: Our results demonstrate that Smo functions as a canonical GPCR, which signals through
        Galphai to regulate Hh pathway activation.
    - reference_id: PMID:18987629
      supporting_text: Here we present in vitro and in vivo evidence in Drosophila that Smo activates
        a G protein to modulate intracellular cyclic AMP levels in response to Hh.
    - reference_id: PMID:8700230
      supporting_text: Sequence analysis of the smoothened transcription unit reveals a single open reading
        frame encoding a protein with seven putative transmembrane domains. This structure is typical
        of G-protein-coupled receptors, suggesting that the Smoothened protein may act as a receptor for
        the Hedgehog ligand.
- term:
