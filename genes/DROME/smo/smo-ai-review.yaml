proposed_new_terms: []
suggested_questions:
- question: Drosophila Smo localises to the sensory cilium of olfactory sensory neurons and signals there,
    yet imaginal-disc Hedgehog transduction is cilium-independent. Do the ciliary and cytoplasmic routes
    use the same Smo C-tail phosphorylation code, or does ciliary signalling read a different set of sites?
- question: How much of fly Hedgehog signalling output actually flows through Galphai and cAMP, as opposed
    to the Cos2/Fused route, and can the two be separated genetically in the wing disc?
- question: Vertebrate SMO is activated by sterols binding the cysteine-rich domain and a transmembrane
    channel, whereas the demonstrated lipid ligands of fly Smo are PI(4)P and phosphatidic acid. Is sterol
    regulation conserved in Drosophila, or has the fly receptor switched to a different lipid code?
- question: Should the PAINT commissural neuron axon guidance assertion at node PTN000885245 be moved
    to the vertebrate-scoped sibling node PTN002601731, given that both descendant evidences are vertebrate?
suggested_experiments:
- hypothesis: Ciliary and non-ciliary Hedgehog transduction in Drosophila require different subsets of
    the C-terminal tail phosphorylation clusters of Smo.
  description: Generate an allelic series of endogenous smo knock-ins in which each of the three PKA/CK1
    serine clusters, the Gprk2 site Ser741/Thr742 and the distal Fused-binding segment are mutated individually
    to alanine. Score, in the same animals, Hedgehog target gene induction in the wing disc (cilium-independent)
    and in olfactory sensory neurons (cilium-dependent), together with Smo localisation to the sensory
    cilium and to the disc plasma membrane.
  experiment_type: CRISPR knock-in allelic series with tissue-paired reporter and imaging readouts
- hypothesis: The Smo C-terminal tail acts as the adaptor that recruits the Costal-2/Fused complex, and
    this adaptor role is separable from Galphai coupling.
  description: Introduce endogenous separation-of-function smo alleles that delete the Cos2-binding segment
    while leaving the transmembrane core intact, and, separately, that disrupt the predicted Galphai coupling
    surface. Measure Cos2/Fu recruitment to the membrane by FRET, Fused activation-loop phosphorylation,
    cellular cAMP, Ci-155 processing and target gene expression, with wild-type rescue controls.
  experiment_type: Separation-of-function knock-in with FRET, phospho-specific immunoblot and cAMP readouts
