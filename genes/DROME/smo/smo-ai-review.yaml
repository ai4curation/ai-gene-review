- term:
    id: GO:0005929
    label: cilium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0003444
  - MGI:MGI:108075
  - PANTHER:PTN000885245
  - UniProtKB:Q99835
  - ZFIN:ZDB-GENE-980526-89
  review:
    summary: Drosophila cells are largely non-ciliated during development, and imaginal-disc Hh transduction
      runs on the cytoplasmic Cos2/Fu complex without a cilium. In the ciliated olfactory sensory neurons,
      however, Smo localises to the sensory cilium, ciliary targeting requires the intraflagellar transport
      machinery together with Cos2 and Fused, and the cilium mediates expression of Hh target genes.
    action: ACCEPT
    reason: 'Accepted as a genuine, cell-type-restricted signalling location. This annotation resolves
      the question of why fly smo appears among the seeds of the PAINT cilium row at node PTN000885245:
      the fly gene carries its own experimental ciliary annotation (IDA, PMID:24768000), so the eumetazoan
      placement is grounded in protostome as well as vertebrate evidence rather than being a vertebrate
      assertion propagated into flies. UniProt independently records Cell projection, cilium membrane
      on the strength of the same study. The cilium is not where the classical imaginal-disc pathway operates,
      but it is where Smo acts in olfactory sensory neurons, which is what the annotation asserts.'
    supported_by:
    - reference_id: PMID:24768000
      supporting_text: We demonstrate that several fundamental key aspects of the vertebrate cilia pathway,
        such as ciliary localization of Smoothened and the requirement of the intraflagellar transport
        system, are present in Drosophila.
    - reference_id: PMID:24768000
      supporting_text: Here, we identify and characterize a cilia-mediated Hh pathway in Drosophila olfactory
        sensory neurons.
    - reference_id: PMID:24768000
      supporting_text: We show that Cos2 and Fused are required for the ciliary transport of Smoothened
        and that cilia mediate the expression of the Hh pathway target genes.
    - reference_id: file:DROME/smo/smo-uniprot.txt
      supporting_text: Cell projection, cilium membrane
