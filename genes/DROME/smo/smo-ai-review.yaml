  - PANTHER:PTN000885245
  - UniProtKB:Q99835
  review:
    summary: Patched is the upstream negative regulator of Smo, and Ptc and Smo are recovered together
      in a large membrane complex in Drosophila, consistent with the phylogenetic assertion of patched
      binding at the Smoothened node.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core, matching the human SMO review. The IBA rests on a node placement for
      which fly and vertebrate Smoothened are both descendants, and the physical association is reported
      in flies; but Ptc acts largely by controlling Smo's access to activating lipids rather than through
      a required stable receptor complex, so patched binding is not Smo's principal molecular activity.
    supported_by:
    - reference_id: PMID:17284519
