findings:
- category: discrepancy
  text: UniProt describes Smo activation by cholesterol and translocation to the primary
    cilium; the review states fly epithelia transduce Hh without a cilium, through
    the C-tail and Costal-2/Fused.
  sources:
  - UniProt
