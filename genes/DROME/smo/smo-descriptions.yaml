- source: Alliance_Imported
  text: smoothened (smo) encodes a critical component of the Hedgehog signaling pathway.
    It is regulated by phosphorylation, dimerization, and cell-surface accumulation
    upon Hedgehog stimulation. The product of smo is also regulated by ubiquitin and
    other small molecules such as phospholipids.
