- source: Alliance_Automated
  text: Enables several functions, including phospholipid binding activity; protein
    homodimerization activity; and protein kinase binding activity. Involved in several
    processes, including animal organ morphogenesis; negative regulation of G1/S transition
    of mitotic cell cycle; and segment polarity determination. Located in several
    cellular components, including cilium; dendrite; and neuronal cell body. Colocalizes
    with axon. Is expressed in several structures, including anlage in statu nascendi;
    antennal anlage; developmental compartment; epithelium; and head epidermis primordium.
    Used to study primary bacterial infectious disease. Human ortholog(s) of this
    gene implicated in basal cell carcinoma; endocrine gland cancer (multiple); hamartoma;
    malignant pleural mesothelioma; and syndactyly. Orthologous to human SMO (smoothened,
    frizzled class receptor).
