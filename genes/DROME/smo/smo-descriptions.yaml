descriptions:
- source: UniProt
  text: 'G protein-coupled receptor, which transduces the smoothened signaling pathway
    and which is required for correct patterning of every segment (PubMed:10966113,
    PubMed:15616566, PubMed:15691767, PubMed:8700230, PubMed:8706127). Activated by
    cholesterol in response to hedgehog (hh) morphogen (By similarity). In absence
    of hedgehog, smo is inactivated by patched protein (ptc), which prevents smo access
    to cholesterol (By similarity). In response to hh-binding to ptc, inhibition is
    relieved, promoting smo translocation to primary cilium and activation by cholesterol:
    cholesterol causes a conformation change that triggers signaling via G protein
    G(i), mediating inhibition of adenylate cyclase activity and decreassed production
    of cAMP (By similarity). Essential component of a hh-signaling pathway which regulates
    the Duox-dependent gut immune response to bacterial uracil; required to activate
    Cad99C-dependent endosome formation, norpA- dependent Ca2+ mobilization and p38
    MAPK, which are essential steps in the Duox-dependent production of reactive oxygen
    species (ROS) in response to intestinal bacterial infection (PubMed:25639794).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P91682
  source_id: P91682
