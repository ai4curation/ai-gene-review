  review:
    summary: Maintenance of apical/basal cell polarity from alc mutant analysis.
    action: UNDECIDED
    reason: The same paper states that the photoreceptor maintenance function acts by mechanisms unrelated
      to polarity, and the energy-dependent polarity phenotype of AMPK mutants reported earlier could
      not be reproduced by a later study (PMID:24337115). The polarity data in the full text are not visible
      to us, so we cannot adjudicate this annotation.
    supported_by:
    - reference_id: PMID:18562613
      supporting_text: AMPK is required for proper viability of differentiated photoreceptors by mechanisms
        unrelated to polarity events that AMPK controls in epithelial tissues.
    - reference_id: PMID:24337115
      supporting_text: In following up on these findings, we observed that AMPK controls cell size in
        the follicle cell epithelium, but were unable to reproduce the energy-dependent polarity phenotype.
