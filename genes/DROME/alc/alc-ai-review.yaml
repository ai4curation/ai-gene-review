taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Alicorn (alc) encodes the single beta subunit of Drosophila AMP-activated protein kinase
  (AMPK). The beta subunit is a non-catalytic scaffold that bridges the catalytic alpha subunit (AMPKalpha)
  and the nucleotide-sensing gamma subunit (SNF4Agamma) through its C-terminal domain and carries a carbohydrate-binding
  module. Alicorn is required for AMPK activity and acts in the cytoplasm as part of the energy-sensing
  AMPK heterotrimer. In vivo it is essential for the maintenance of mature photoreceptors and other neurons,
  protecting them from activity-dependent, nonapoptotic degeneration.
