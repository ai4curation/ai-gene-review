- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific
    and RNA polymerase II cis-regulatory region sequence-specific DNA binding activity.
    Involved in several processes, including digestive tract development; gland development;
    and heart development. Located in nucleus. Is expressed in several structures,
    including adult heart; cardiogenic mesoderm; dorsal vessel; dorsal vessel wall
    cell; and pericardial cell. Used to study congenital heart disease. Orthologous
    to human NKX2-2 (NK2 homeobox 2).
