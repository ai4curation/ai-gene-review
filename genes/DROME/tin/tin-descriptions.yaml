- source: UniProt
  text: DNA binding protein (PubMed:9694800). Acts synergistically with the Mad-Med
    transcription factor complex to regulate certain dpp- responsive genes (PubMed:9694800).
    Required for the development of heart and visceral muscle; for the formation of
    somatic muscles. Has a crucial function in the early mesodermal subdivisions.
