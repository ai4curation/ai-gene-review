core_functions:
- description: Sequence-specific RNA polymerase II DNA-binding transcription factor that binds NK-2 sites
    in mesodermal enhancers and activates target genes (tinman autoregulation, bagpipe, pannier, D-mef2,
    Hand, eve), acting combinatorially with Smad, GATA/Pannier, T-box/Doc and dTCF.
  molecular_function:
