      containing two Tinman binding sites, both of which are essential for enhancer function in cardiac
      muscle cells
  - reference_id: PMID:11336505
    supporting_text: pannier is a direct transcriptional target of Tinman in the heart-forming region
  - reference_id: PMID:15750188
