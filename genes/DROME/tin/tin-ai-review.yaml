  review:
    summary: ARBA machine-learning inference of nervous system development.
    action: REMOVE
    reason: tin is a mesoderm-specific factor; this rule likely reflects neural roles of vertebrate NK-2
      paralogs (e.g. Nkx2-1, Nkx2-2). The only nervous-system phenotypes reported for tin (loss of FMRFa
