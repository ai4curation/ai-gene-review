id: P22711
gene_symbol: tin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'tinman (tin) encodes an NK-2 class homeodomain transcription factor, the Drosophila ortholog
  of vertebrate Nkx2-5. It is expressed first throughout the trunk mesoderm as a direct target of Twist,
  is then maintained in the dorsal mesoderm by Dpp/Smad signaling together with Tin autoregulation, and
  finally persists in a subset of cardioblasts. Tin binds NK-2 (TCAAGTG-type) sites in enhancers and activates
  target genes including bagpipe (visceral mesoderm), pannier, D-mef2, Hand, even-skipped and tinman itself.
  It is required for formation of the heart (dorsal vessel cardioblasts and pericardial cells, and the
  lymph gland from cardiogenic mesoderm), for visceral mesoderm/midgut musculature, and for specification
  of a subset of dorsal somatic muscle founders; later, cardioblast-intrinsic Tin specifies working myocardium
  versus ostial cells by repressing Dorsocross and is needed for adult heart remodeling and function.
  Tin is necessary but not sufficient for heart induction: it confers mesodermal competence to respond
  to Dpp and Wg and acts combinatorially with Pannier (GATA), Dorsocross (T-box), dTCF and pMad on cardiac
  enhancers.'
