suggested_questions:
- question: Which Tin target enhancers require Tin binding directly versus only Tin-dependent competence
    (e.g. via pnr/Doc induction), and does Tin act as a pioneer-like factor on cardiac enhancers given
    its early pan-mesodermal occupancy?
- question: Is the repression of Dorsocross in working myocardial cells direct (Tin-bound repressive enhancer)
    or indirect, and does it justify a negative regulation of transcription annotation?
- question: Should the visceral mesoderm-specification role of tin (bap activation) be represented by
    a more specific term such as visceral mesoderm cell fate specification, which is currently lacking
    in GO?
suggested_experiments:
- description: Cardioblast- and adult-heart-specific degron depletion of Tin combined with CUT&RUN/ATAC
    to distinguish direct Tin targets maintaining adult heart function (e.g. miR-1, ion channel genes)
    from developmental competence targets.
- description: Mutate Tin sites in a Dorsocross cardiac enhancer to test whether Tin directly represses
    Doc in working myocardial cells.
