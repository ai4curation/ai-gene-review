  review:
    summary: GTP of the beta-tubulin E site is hydrolysed in the lattice at a composite inter-dimer site; accepted
      as a conserved family property.
    action: ACCEPT
    reason: The exchangeable GTP of the alpha/beta heterodimer is bound by beta-tubulin (E site) and hydrolysed
      after incorporation into the lattice, with the catalytic residue contributed by the alpha-tubulin of the next
      dimer. Q24560 retains the full tubulin/FtsZ GTPase domain and beta-tubulin signatures, so it supplies the
      nucleotide-binding half of the hydrolytic site. Accepted, consistent with the paralog betaTub97EF review;
      no betaTub56D-specific hydrolysis rate has been measured and the family-level scope of this term is recorded
      as unresolved in the PTHR11588 family review.
    supported_by:
    - &id006
      reference_id: file:DROME/betaTub56D/betaTub56D-uniprot.txt
      supporting_text: InterPro; IPR003008; Tubulin_FtsZ_GTPase.
    - &id005
      reference_id: PMID:9428769
      supporting_text: Each tubulin monomer binds a guanine nucleotide, which is nonexchangeable when it is bound
        in the alpha subunit, or N site, and exchangeable when bound in the beta subunit, or E site.
    - &id012
      reference_id: PMID:9989499
      supporting_text: The exchangeable nucleotide in beta-tubulin is exposed at the plus end of the microtubule,
        while the proposed catalytic residue in alpha-tubulin is exposed at the minus end.
