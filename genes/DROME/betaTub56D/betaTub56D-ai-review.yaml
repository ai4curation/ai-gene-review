  review:
    summary: Microtubule cytoskeleton organization by incorporation into the lattice; experimentally confirmed for
      this gene.
    action: ACCEPT
    reason: 'Q24560 is a full-length (447 aa) beta-tubulin with intact tubulin GTPase and C-terminal domains; PANTHER
      19.0 places it in PTHR11588:SF504 (TUBULIN BETA-1 CHAIN-RELATED), in the arthropod beta-tubulin clade PTN000904125
      with betaTub60D and betaTub65B, inside the tubulin-root PAINT node PTN000172598 from which this IBA descends.
      Gene-specific evidence confirms the inherited term: betaTub56D RNAi in larval fat body disrupts/eliminates
      the perinuclear microtubule array, and the maternally supplied protein is incorporated into embryonic spindles.
      A beta-tubulin organizes the microtubule cytoskeleton by being polymerized into it, which is direct participation.'
    supported_by:
