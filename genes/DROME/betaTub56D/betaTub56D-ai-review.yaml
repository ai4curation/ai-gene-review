  review:
    summary: Root-level tubulin PAINT inference; betaTub56D is a mitotic spindle component, kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Q24560 is a full-length (447 aa) beta-tubulin with intact tubulin GTPase and C-terminal domains; PANTHER
      19.0 places it in PTHR11588:SF504 (TUBULIN BETA-1 CHAIN-RELATED), in the arthropod beta-tubulin clade PTN000904125
      with betaTub60D and betaTub65B, inside the tubulin-root PAINT node PTN000172598 from which this IBA descends.
      betaTub56D is the maternally supplied beta-tubulin incorporated into mitotic spindles of early embryos and
      the only beta isotype in mitotically active early spermatogenic cells, so it contributes to mitosis as a spindle
      subunit. The cell-cycle term is a broad umbrella for that structural contribution; the specific gene-level
      evidence is captured as located_in mitotic spindle (NEW) rather than by asserting a more specific mitotic
      process, because no mitosis-specific assay on betaTub56D itself (as opposed to generic beta-tubulin depletion)
      is available in the cached literature. Retained, non-core.
    supported_by:
    - *id001
    - reference_id: PMID:8246879
      supporting_text: In the early, mitotically active stages of spermatogenesis, only the beta 1 tubulin isotype
        is expressed.
