id: Q24560
gene_symbol: betaTub56D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: betaTub56D encodes beta1-tubulin, the major ubiquitously and constitutively expressed beta-tubulin
  of Drosophila melanogaster. Together with alpha-tubulin it forms the alpha/beta heterodimer that polymerizes head-to-tail
  into microtubule protofilaments, with beta-tubulin binding the exchangeable GTP whose hydrolysis in the lattice
  underlies microtubule dynamics. The protein is supplied maternally and is incorporated into mitotic spindles of
  the early embryo; zygotically it is strongly expressed in the central and peripheral nervous system, chordotonal
  organs and muscle attachment sites (apodemes), and it is the only beta isotype in early mitotic germ cells of
  the testis and a major isotype of cyst cells. Depletion removes the microtubule array of larval fat body cells,
  and zygotic loss is lethal in the first larval instar. Its folding and stability depend on the prefoldin subunit
  Mgr, with which it interacts together with Vhl.
