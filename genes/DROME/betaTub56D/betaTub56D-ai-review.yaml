    summary: ARBA developmental-process prediction; necessity, not participation.
    action: MARK_AS_OVER_ANNOTATED
    reason: ARBA machine-learning prediction of a broad developmental process. betaTub56D is essential (zygotic
      nulls die as first-instar larvae) and its loss has many tissue-level consequences (e.g. nuclear mispositioning
      in fat body), but these are necessity evidence for a ubiquitous cytoskeletal subunit, not evidence that tubulin
      performs a step of organ development or morphogenesis. The direct contribution is captured by the microtubule
      terms; the developmental term is an over-annotation.
