- source: Alliance_Automated
  text: A structural constituent of cytoskeleton. Predicted to be involved in microtubule
    cytoskeleton organization and mitotic cell cycle. Located in microtubule. Is expressed
    in several structures, including apodeme; ganglia; gonad; head epidermis primordium;
    and sensory organ cell. Human ortholog(s) of this gene implicated in Leber congenital
    amaurosis with early-onset deafness; complex cortical dysplasia with other brain
    malformations (multiple); congenital symmetric circumferential skin creases 1;
    hypomyelinating leukodystrophy 6; and torsion dystonia 4. Orthologous to several
    human genes including TUBB2B (tubulin beta 2B class IIb) and TUBB4B (tubulin beta
    4B class IVb).
