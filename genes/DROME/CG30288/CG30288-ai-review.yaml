suggested_questions:
- question: Is CG30288 catalytically active, and does it prefer Arg/Lys at P1 as its Asp at the S1-pocket
    position predicts, rather than the chymotrypsin-like specificity in its UniProt name?
- question: Do the four Drosophila-specific PTHR24256:SF546 paralogs (CG30288, CG30289, CG30414, SPH158)
    arise from recent tandem duplication, and do they share expression in fat body or another secreting
    tissue?
suggested_experiments:
- description: Express recombinant pro-CG30288, activate it with trypsin at Arg42, and profile P1 specificity
    with a positional-scanning fluorogenic peptide library; use an S225A mutant as the inactive control.
- description: Map the tissue and stage of expression with an endogenously tagged allele, and test secretion
    into hemolymph by proteomics.
