  label: Drosophila melanogaster
description: CG30288 (SP225) encodes a predicted secreted serine endopeptidase of the S1A (trypsin-like)
  family. The 282-residue protein has an N-terminal signal peptide, a short propeptide and a single S1
  protease domain with an intact His-Asp-Ser catalytic triad (His83, Asp132, Ser225). Its protease domain
  is predicted to be activated by cleavage after Arg42. It has no clip domain. An aspartate at the base
  of the predicted S1 specificity pocket suggests trypsin-like preference for Arg or Lys at the cleavage
  site, rather than the chymotrypsin-like preference implied by its automatic name. CG30288 belongs to
  a Drosophila-specific PANTHER subfamily with three uncharacterized paralogs, including the neighbouring
  gene CG30289. Its physiological substrate, tissue of action and biological role have not been studied
  experimentally.
