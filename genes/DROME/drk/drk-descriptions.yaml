    overall_notes: 'Correct and cited: adaptor in Sevenless and Ack signaling linking
      receptor to Sos, plus scolopidia/AMMC and apoptosis roles. EGFR and Torso not
      named.'
- source: Alliance_Imported
  text: downstream of receptor kinase (drk) encodes an adaptor protein that recognizes
    phosphorylated tyrosine residues of membrane receptors and triggers the Ras/Raf/MAPK
    pathway. drk product contributes to the regulation of cytoskeletal organization
    and participates in developmental and cognitive processes (associative learning,
    anesthesia resistant memory).
  source_type: curated
  url: https://flybase.org/reports/drk.html
  source_id: FB:FBgn0004638
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: phosphotyrosine-recognizing adaptor triggering Ras/Raf/MAPK,
      with cytoskeletal, learning and anesthesia-resistant memory roles. No Sos named.'
- source: Alliance_Automated
  text: Enables phosphotyrosine residue binding activity; signaling receptor binding
    activity; and signaling receptor complex adaptor activity. Involved in several
    processes, including cell surface receptor protein tyrosine kinase signaling pathway;
    learning or memory; and open tracheal system development. Located in plasma membrane
    and presynapse. Part of protein-containing complex. Is expressed in several structures,
    including embryonic/larval midgut primordium; imaginal disc; somatic trunk mesoderm
    derivative; synaptic neuropil domain; and synaptic neuropil subdomain. Used to
    study autosomal recessive nonsyndromic deafness 114. Human ortholog(s) of this
    gene implicated in autosomal recessive nonsyndromic deafness 114; breast cancer;
    prostate adenocarcinoma; and prostate cancer. Orthologous to several human genes
    including GRB2 (growth factor receptor bound protein 2).
  source_type: automated
