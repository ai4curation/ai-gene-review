descriptions:
- source: UniProt
  text: Adapter protein which modulates signaling mediated by several receptor tyrosine
    kinases such as sev and Ack (PubMed:22615583, PubMed:8462097, PubMed:8462098).
    Required for proper signaling by sevenless (PubMed:8462097, PubMed:8462098). May
    act to stimulate the ability of Sos to catalyze Ras1 activation by linking sevenless
    and Sos in a signaling complex (PubMed:8462097, PubMed:8462098). Required for
    functional and morphological integrities of the scolopidia, sensory neurons and
    the antennal mechanosensory and motor center (AMMC) brain neuropil (PubMed:30610177).
    Required for Ack-dependent suppression of apoptosis in the eye (PubMed:22615583).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08012
  source_id: Q08012
