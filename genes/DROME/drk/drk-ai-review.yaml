id: Q08012
gene_symbol: drk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  drk encodes the Drosophila GRB2-family adaptor Downstream of receptor kinase.
  Its SH2 domain binds phosphotyrosine motifs on activated receptor tyrosine
  kinases and its SH3 domains bind proline-rich partners such as Sos and Dos,
  recruiting Ras activators and scaffolds to receptor complexes. Drk couples
  EGFR, Sevenless, Torso, and additional RTKs to Ras/MAPK signaling.
existing_annotations:
