      - RGD:619758
      - UniProtKB:P62993
    review:
      summary: 'IBA: phosphotyrosine residue binding, the conserved SH2-domain activity of Drk/GRB2 adaptors.'
      action: ACCEPT
      reason: Drk is an SH2/SH3 receptor-proximal adaptor whose SH2 domain recognizes
        phosphotyrosine motifs on activated RTKs and phosphorylated scaffolds; this IBA is placed on
        the same GRB2/Sem-5/DRK family node as the direct fly and vertebrate evidence.
      supported_by:
        - reference_id: PMID:8462098
          supporting_text: These results suggest that drk binds autophosphorylated receptor tyrosine
            kinases with its SH2 domain and the Sos GNRP through its SH3 domains, thereby coupling
            receptor tyrosine kinases to Ras activation.
