gene_symbol: CG17404
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG17404 (SP149) encodes a 275-residue secreted serine protease of the chymotrypsin (S1A) family. It
  has an N-terminal signal peptide (residues 1-20), a short 14-residue propeptide and a single trypsin-like S1 catalytic
  domain (residues 35-274). It has no clip domain or other accessory module. The His80-Asp124-Ser225 catalytic triad
  and the GDSGG oxyanion/nucleophile motif are intact, so the protein is predicted to be a catalytically active
  serine endopeptidase. It is probably made as a zymogen and activated by cleavage at the R34-I35 bond, which would
  release the IVGG mature N terminus. In the PANTHER tree CG17404 belongs to a small subfamily (PTHR24256:SF562).
  The subfamily contains two tandem Drosophila paralogs (CG12256 and CG3916) and single-copy genes from mosquito,
  beetle and Trichoplax, but no characterised member. Its substrate, cleavage specificity, tissue of action and
  physiological role are unknown.
