description: CG17404 is a predicted secreted S1-family serine endopeptidase also known as SP149. Its catalytic
  histidine-aspartate-serine triad is retained, supporting proteolytic potential. Chymotrypsin-like substrate
  preference and specific equivalence to mammalian CTRL remain unresolved.
