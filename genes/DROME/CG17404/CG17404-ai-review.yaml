knowledge_gaps:
- gap_statement: The substrates, cleavage specificity, activating protease, tissue of expression and physiological
    role of CG17404 are unknown. No member of its PANTHER subfamily (SF562) has been characterised.
  boundary: 'Established by sequence only: secretion signal, an intact catalytic triad, a predicted R34-I35 zymogen
    activation site, and placement in an SF562 clade that diverged from the characterised tryptase and Easter/Sp7
    clades at a Eumetazoa-level duplication.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: Decides whether this conserved but neglected lineage (also present in mosquito, beetle and Trichoplax)
    is a digestive, immune or developmental protease. It also decides whether homology transfer from any characterised
    PTHR24256 clade is ever justified for SF562.
  resolution: Recombinant expression and activation of the zymogen, followed by peptide-library and proteome-wide
    (N-terminomics) cleavage assays; tissue expression mapping; and loss-of-function alleles covering the tandem
    CG17404/CG12256/CG3916 cluster.
suggested_questions:
- question: Is the S1 specificity pocket of CG17404 (Gly at chymotrypsin position 189) compatible with chymotrypsin-like
    aromatic P1 cleavage, as the PROSITE-derived EC 3.4.21.1 name implies, or with some other P1 preference?
- question: Are CG17404, CG12256 and CG3916, the three tandem SF562 paralogs, functionally redundant, and which
    enzyme activates their zymogens?
suggested_experiments:
- description: Express CG17404 as a zymogen, activate it by cleavage at R34-I35 (for example with enterokinase after
    engineering a site), and profile its P1-P4 specificity with positional-scanning fluorogenic peptide libraries.
    Use an S225A mutant as a negative control.
- description: Map CG17404 expression by tissue (RNA in situ or a tagged knock-in), then test a CRISPR deletion
    of the CG17404/CG12256/CG3916 cluster for digestive, immune (melanization, Toll output) or developmental phenotypes.
