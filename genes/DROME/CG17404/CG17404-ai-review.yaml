core_functions:
- description: Secreted single-domain S1A serine endopeptidase with an intact His-Asp-Ser catalytic triad. It is
    predicted to cleave internal peptide bonds of unidentified extracellular protein substrates after zymogen activation.
  supported_by:
  - *id005
  - reference_id: file:DROME/CG17404/CG17404-bioinformatics/RESULTS-rereview.md
    supporting_text: 'A single candidate zymogen activation site matches the S1A mature-N-terminus pattern: the
      bond R34-I35, followed by IVGGA.'
  - *id011
  - *id006
  - *id008
