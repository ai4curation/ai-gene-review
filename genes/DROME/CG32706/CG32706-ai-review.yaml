    action: UNDECIDED
    summary: The cited whole-animal screen distinguishes bacterial-defense defects from reduced infection
      endurance. The accessible abstract does not identify the CG32706 mutant or which class it occupies,
      and full text could not be retrieved. Preserve the experimental annotation unresolved rather than
      assume that a ribosome-assembly protein cannot affect host defense.
