    label: endonucleolytic cleavage in ITS1 to separate SSU-rRNA from 5.8S rRNA and LSU-rRNA from tricistronic
      rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IBA
