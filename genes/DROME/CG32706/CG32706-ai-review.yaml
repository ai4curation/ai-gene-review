  review:
    action: KEEP_AS_NON_CORE
    summary: PAINT inference from node PTN000267771 to the single ABT1/Esf2 subfamily (PTHR12311:SF7) that
      contains CG32706 and yeast Esf2. Yeast Esf2 depletion blocks cleavage at A2 (the ITS1 site separating
      SSU from LSU precursors), as a consequence of failed SSU-processome assembly.
    reason: The phylogenetic placement is sound (single subfamily, one-to-one, RRM and family core intact;
      see bioinformatics re-review), so the IBA is retained. Esf2 is a component of the SSU processome,
      the particle that performs the A0-A2 cleavages, and so contributes structurally to the machinery,
      but it is not the endonuclease, and the yeast paper attributes the cleavage defect to failed processome
      assembly. The cleavage process is therefore kept as a non-core consequence of the core assembly role
      (GO:0034462), not as the protein's primary function.
