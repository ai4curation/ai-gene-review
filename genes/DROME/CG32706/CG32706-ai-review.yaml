taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG32706 encodes a conserved ABT1/Esf2-family RNA-binding protein. Its family is involved
  in nucleolar small-subunit processome assembly and the early pre-rRNA processing events that produce
  mature 18S rRNA. The protein is expected to act as an RNA-associated assembly factor rather than as
  the endonuclease that cleaves the precursor.
