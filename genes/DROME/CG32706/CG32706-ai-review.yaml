taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG32706 encodes the Drosophila member of the ABT1/Esf2 protein family, a 230-residue
  protein with a central RNA-recognition motif (RRM) and the conserved ABT1/Esf2 core segment that follows
  it. It is the fly counterpart of budding-yeast Esf2 and vertebrate ABT1 within a single PANTHER subfamily.
  In yeast, Esf2 is a nucleolar component of the small-subunit (SSU) processome/90S preribosome that
  associates with the 5' external transcribed spacer and U3 snoRNA, binds pre-rRNA, stimulates the ATPase
  activity of the DEAD-box helicase Dbp8, and is required for SSU-processome assembly and compaction and
  hence for the early pre-rRNA cleavages that generate 18S rRNA. By descent, CG32706 is expected to act
  in the nucleolus as an RNA-binding assembly factor of the 40S-subunit biogenesis machinery rather
  than as a nuclease. No biochemical or localization study of the fly protein itself has been reported;
  a piggyBac insertion near the 3' end of the gene increased susceptibility to Listeria monocytogenes
  infection with elevated bacterial load in a whole-animal screen.
