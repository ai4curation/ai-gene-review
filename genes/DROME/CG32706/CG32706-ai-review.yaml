suggested_questions:
- question: Does CG32706 bind and stimulate the ATPase of the fly Dbp8 ortholog, as yeast Esf2 does
    for Dbp8? The fly protein lacks most of the yeast C-terminal region required for Dbp8 binding, and
    PAINT did not propagate an ATPase-activator activity to the clade.
- question: Is the increased Listeria load of the 3'-end piggyBac insertion line due to loss of CG32706
    function, and if so is it a specific immune role or a general consequence of reduced ribosome biogenesis?
suggested_experiments:
- description: Tag CG32706 at the endogenous locus and test nucleolar localization and co-sedimentation
    with 90S preribosomes; RNAi or CRISPR knockdown followed by northern analysis of early pre-rRNA intermediates.
- description: Excise the 10881 piggyBac insertion (precise excision revertants) or generate an independent
    CRISPR null, and retest Listeria monocytogenes susceptibility and bacterial load.
