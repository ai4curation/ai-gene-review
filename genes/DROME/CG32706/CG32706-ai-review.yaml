  review:
    action: ACCEPT
    summary: The target belongs to the specific ABT1/Esf2 family, and its conserved RNA-binding domain
      is retained. In yeast, Esf2 depletion impairs SSU-processome assembly and the early pre-rRNA cleavages
      required for 18S synthesis. This conserved ribosome-assembly role supports the phylogenetic inference,
      without assigning an intrinsic nuclease reaction to the protein.
    reason: The target belongs to the specific ABT1/Esf2 family, and its conserved RNA-binding domain
