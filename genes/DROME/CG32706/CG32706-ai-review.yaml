- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:18245331
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Whole-animal forward screen; a piggyBac line (10881) inserted within 100 bp of the 3' end
      of CG32706 was more susceptible to Listeria monocytogenes, with increased bacterial load, and more
      sensitive to S. aureus.
    reason: The full text (PMC2278058, read online; not in the local cache) places the CG32706 insertion
      line in the defense-defect class (increased L. monocytogenes growth), which is exactly what the curator
      annotated, so the experimental annotation is retained. It rests on a single insertion allele without
      reported revertant or second-allele confirmation, and a general defect in ribosome biogenesis is a
      plausible indirect cause; no immune-specific activity of the protein is known. It is therefore kept
      as a non-core, organism-level process.
    supported_by:
    - reference_id: PMID:18245331
      supporting_text: In the second
        group, mutants have a typical defense defect in which bacterial growth is
        increased and survival is decreased.
