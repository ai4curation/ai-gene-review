description: 'The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for Q8IRM9.
  RNA binding (GO:0003723) and small-subunit processome assembly (GO:0034462) are supported omission candidates:
  the target has the specific ABT1/Esf2 family assignment and retained RNA-recognition motif, existing
  PAINT/IBA annotations, and a characterized yeast Esf2 homolog that binds pre-rRNA and supports processome
  assembly. This is a conserved family inference, not a direct fly biochemical assay. The separate FUNCTION
  paragraph has CNN judgments for the broad processome/18S-rRNA claims and UNC for the exact yeast-named
  A0/A1/A2 cleavage-site requirements. No intrinsic nuclease activity is inferred. This completed record
  assesses the absence of GO output; predictions is empty because no GO or EC prediction was emitted.
  The narrative assessments remain in the linked function review and are not scores assigned to the omission.'
