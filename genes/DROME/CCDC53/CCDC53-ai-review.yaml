gene_symbol: CCDC53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CCDC53 (CG7429; WASHC3 ortholog) is a small coiled-coil subunit of the pentameric WASH complex,
  which also contains Wash, FAM21, SWIP and Strumpellin. Within the complex CCDC53 bridges the WASH and
  FAM21 head regions with the SWIP-Strumpellin core, helping to assemble and regulate the Arp2/3-activating
  Wash subunit on endosomes. The fly WASH complex is required for endosomal recycling of integrins and
  V-ATPase and, together with capping protein and Arp2/3, for nuclear envelope budding.
