descriptions:
- source: UniProt
  text: Acts at least in part as component of the WASH complex which may regulate
    wash nucleation-promoting factor (NPF) activity and is required for its membrane
    targeting during endosomal sorting (By similarity). During embryogenesis, not
    involved in the wash-dependent developmental migration of hemocytes anteriorly
    from the tail (PubMed:25739458).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VLT8
