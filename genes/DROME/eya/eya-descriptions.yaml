    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Says Eya regulates transcription through its intrinsic phosphatase
      activity; the review cites genomic rescue showing the phosphatase is dispensable
      for eye development. So and Dac partners and eye progenitor survival are correct.
- source: Alliance_Imported
  text: eyes absent (eya) encodes a transcriptional cofactor that physically interacts
    with several other retinal determination proteins, including those encoded by
    ey, dac, and so. The product of eya regulates eye, gonad, and brain development
    as well as axon pathfinding.
  source_type: curated
