findings:
- category: discrepancy
  text: UniProt says Eya regulates transcription through its phosphatase activity;
    the review says the phosphatase is dispensable for eye development and acts in
    axon pathfinding.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: Sources agree on a So-partnered coactivator with phosphatase activity;
    UniProt overstates the phosphatase's role in transcription.
