    overall_notes: 'Correct: transcriptional cofactor binding Ey, Dac and So, in eye,
      gonad and brain development and axon pathfinding.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity; protein tyrosine
    phosphatase activity; and transcription coactivator activity. Involved in several
    processes, including animal organ morphogenesis; nervous system development; and
    regulation of gene expression. Located in cytosol and nucleus. Is expressed in
    several structures, including anlage in statu nascendi; anterior-posterior subdivision
    of organism; head epidermis primordium; somatic cell of ovariole; and somatic
    trunk mesoderm derivative. Used to study branchiootorenal syndrome and eye disease.
    Human ortholog(s) of this gene implicated in auditory system disease (multiple);
    branchiootic syndrome 1; branchiootorenal syndrome (multiple); congestive heart
    failure; and dilated cardiomyopathy (multiple). Orthologous to several human genes
    including EYA4 (EYA transcriptional coactivator and phosphatase 4).
