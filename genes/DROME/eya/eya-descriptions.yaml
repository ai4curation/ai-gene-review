descriptions:
- source: UniProt
  text: Tyrosine phosphatase thought to play a role in transcription regulation during
    organogenesis through its intrinsic protein phosphatase activity (PubMed:14628052,
    PubMed:14628053). The phosphatase activity was shown in vitro. Appears to function
    together with So and Dac in eye development (PubMed:9428512, PubMed:9428513).
    Required for the survival of eye progenitor cells at a critical stage in morphogenesis
    (PubMed:8431945).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05201
  source_id: Q05201
