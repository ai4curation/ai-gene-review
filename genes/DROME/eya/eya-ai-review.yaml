suggested_questions:
- question: What are the physiological protein substrates of Eya's tyrosine phosphatase in Drosophila
    (beyond autodephosphorylation), and in which tissues is the activity required given that it is dispensable
    for eye development and viability?
- question: Is the N-terminal 'threonine phosphatase motif' an intrinsic phosphatase, or does it act through
    associated phosphatases (e.g. PP2A) and transactivation, as suggested by VP16 substitution?
suggested_experiments:
- description: Substrate-trapping (D-to-A active-site) Eya pulldown with phosphoproteomics in eye discs
    and embryonic CNS, comparing nuclear- and cytoplasm-restricted Eya, to identify in vivo phosphotyrosine
    substrates.
