  title: The eye-specification proteins So and Eya form a complex and regulate multiple steps in Drosophila
    eye development.
  findings:
  - statement: So and Eya physically interact and synergize to induce ectopic eyes.
    supporting_text: interact in yeast and in vitro through evolutionarily conserved domains
- id: PMID:9428513
  title: Dachshund and eyes absent proteins form a complex and function synergistically to induce ectopic
    eye development in Drosophila.
  findings:
  - statement: Eya and Dac physically interact and synergize.
    supporting_text: we show that the Dachshund and Eyes Absent proteins can physically interact through
      conserved domains
- id: PMID:9428418
  title: The Drosophila eyes absent gene directs ectopic eye formation in a pathway conserved between
    flies and vertebrates.
  findings:
  - statement: eya alone can induce ectopic eyes.
    supporting_text: eya could itself direct ectopic eye formation, indicating that eya has the capacity
      to function as a master control gene for eye formation
- id: PMID:17714699
  title: Identification of transcriptional targets of the dual-function transcription factor/phosphatase
    eyes absent.
  findings:
  - statement: Eya provides transactivation and So DNA binding; phosphatase mutants do not globally impair
      transcriptional output.
    supporting_text: we examined the expression profiles of tissue expressing phosphatase mutant eya and
      found that reducing phosphatase activity did not globally impair transcriptional output
- id: PMID:12917324
  title: Functional dissection of eyes absent reveals new modes of regulation within the retinal determination
    gene network.
  findings:
  - statement: Eya transactivation maps to a P/S/T-rich region and is potentiated by MAPK.
    supporting_text: We have mapped the transactivation potential of EYA to an internal proline-, serine-,
      and threonine-rich region that includes the EYA domain 2 (ED2) and two MAPK phosphorylation consensus
      sites
- id: PMID:23554934
  title: Eyes absent tyrosine phosphatase activity is not required for Drosophila development or survival.
  findings:
  - statement: Genomic rescue with active-site mutant Eya fully restores eyes and viability.
    supporting_text: We conclude that the tyrosine phosphatase activity of Eya is not required for normal
      eye development or survival in Drosophila.
- id: PMID:14628042
  title: Eya protein phosphatase activity regulates Six1-Dach-Eya transcriptional effects in mammalian
    organogenesis.
  findings:
  - statement: In mammals Eya phosphatase activity switches Six1-Dach from repression to activation.
    supporting_text: The phosphatase function of Eya switches the function of Six1-Dach from repression
      to activation, causing transcriptional activation through recruitment of co-activators.
- id: PMID:9584118
  title: Eyeless initiates the expression of both sine oculis and eyes absent during Drosophila compound
    eye development.
  findings:
  - statement: ey induces eya and so, which then act in a positive feedback loop.
    supporting_text: sine oculis and eyes absent then appear to participate in a positive feedback loop
      that regulates the expression of all three genes.
core_functions:
- description: Eya is a non-DNA-binding nuclear transcriptional coactivator recruited to enhancers by
    the SIX-family factor So; within the So/Eya complex its P/S/T-rich transactivation region (substitutable
    by VP16) activates RNA polymerase II target genes such as dac, atonal and string, driving eye-disc
    progenitor survival and compound eye development.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
