id: Q05201
gene_symbol: eya
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: eyes absent (eya) encodes the founding member of the EYA family, a conserved nuclear transcriptional
  coactivator that also carries a C-terminal Eya domain (ED) belonging to the haloacid dehalogenase (HAD)
  phosphatase superfamily. Eya lacks DNA-binding activity and is recruited to target enhancers by the
  SIX-family homeodomain factor Sine oculis (So); in the So/Eya complex So supplies DNA binding and Eya
  supplies transactivation through an internal proline/serine/threonine-rich region, and Eya also binds
  Dachshund. The ED is a metal (Mg2+)-dependent protein tyrosine phosphatase that uses an aspartate nucleophile
  and can dephosphorylate itself; Abelson kinase phosphorylation shifts a pool of Eya to the cytoplasm,
  where its phosphatase activity contributes to axon pathfinding, although genomic rescue shows that tyrosine
  phosphatase activity is dispensable for normal eye development and viability. Within the retinal determination
  network eya is induced by Eyeless, acts in positive feedback with so, eyeless and dachshund, is required
  for survival and differentiation of eye disc progenitors, and can induce ectopic eyes. Outside the eye
  eya is required for somatic gonadal precursor identity and gonad formation, somatic cyst cell support
  of spermatocyte development, main-body follicle cell fate (repressing polar cell fate), Bolwig's organ
  formation, somatic muscle development downstream of Tinman, and specification of Apterous cluster neurons
  in the ventral nerve cord.
