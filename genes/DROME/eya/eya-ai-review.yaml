    supporting_text: Two members of this network, Eyes absent (EYA) and Sine oculis (SO), form a transcriptional
      complex in which EYA provides the transactivation function while SO provides the DNA binding activity.
- description: Eya binds the DNA-binding transcription factor So (and Dachshund) through its conserved
    Eya domain, which is how it is brought to target enhancers.
