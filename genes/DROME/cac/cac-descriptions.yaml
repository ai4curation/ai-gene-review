    overall_notes: 'Correct: pore-forming subunit at presynaptic active zones for
      evoked release, plus courtship song.'
- source: Alliance_Automated
  text: Enables high voltage-gated calcium channel activity and low voltage-gated
    calcium channel activity. Involved in several processes, including detection of
    light stimulus involved in visual perception; male courtship behavior, veined
    wing generated song production; and secretion by cell. Located in several cellular
    components, including apical plasma membrane; basolateral plasma membrane; and
    presynaptic active zone membrane. Part of voltage-gated calcium channel complex.
    Is expressed in several structures, including adult head; ganglia; glial cell;
    lamina; and motor neurons. Used to study epilepsy; familial hemiplegic migraine
    1; and hereditary ataxia. Human ortholog(s) of this gene implicated in Lambert-Eaton
    myasthenic syndrome; brain disease (multiple); and neurodegenerative disease (multiple).
    Orthologous to several human genes including CACNA1B (calcium voltage-gated channel
    subunit alpha1 B) and CACNA1E (calcium voltage-gated channel subunit alpha1 E).
  source_type: automated
  url: https://flybase.org/reports/cac.html
