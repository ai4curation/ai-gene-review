- source: Alliance_Imported
  text: cacophony (cac) encodes the primary structural subunit of a voltage-gated
    calcium channel, which is located at presynaptic active zones. It functions in
    evoked neurotransmitter release at neuromuscular synapses. It contributes to male
    courtship behavior and a wide range of neurophysiological processes.
  source_type: curated
  url: https://flybase.org/reports/cac.html
  source_id: FB:FBgn0263111
