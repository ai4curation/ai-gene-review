  text: Voltage-sensitive calcium channels (VSCC) mediate the entry of calcium ions
    into excitable cells and are also involved in a variety of calcium-dependent processes,
    including muscle contraction, neurotransmitter release, gene expression, cell
    motility, cell division and cell death (By similarity). Probably encodes a dihydropyridine-
    insensitive current. Vital for survival to adulthood.
