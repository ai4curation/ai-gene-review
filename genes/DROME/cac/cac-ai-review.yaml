  evidence_type: IMP
  original_reference_id: PMID:14715138
  qualifier: involved_in
  review:
    summary: cac^TS2 reduces high-K+-evoked FM1-43 exocytosis at the larval NMJ without affecting endocytosis.
    action: MODIFY
    reason: Cac does not execute membrane fusion; it supplies the Ca2+ influx that triggers synaptic vesicle
      exocytosis. The SynGO term GO:0099703 (induction of synaptic vesicle exocytosis by positive regulation
      of presynaptic cytosolic calcium ion concentration) describes exactly this step of synaptic transmission
      and is the precise placement for a presynaptic VGCC.
    proposed_replacement_terms:
    - id: GO:0099703
      label: induction of synaptic vesicle exocytosis by positive regulation of presynaptic cytosolic
        calcium ion concentration
    supported_by:
    - reference_id: PMID:14715138
      supporting_text: In a temperature-sensitive Ca(2+) channel mutant, cacophony(TS2), exocytosis induced
        by high K(+) decreased at nonpermissive temperatures, while endocytosis remained unchanged.
    - reference_id: PMID:22952921
      supporting_text: Single synaptic boutons resolved in the lamina by FM4-64 fluorescence revealed
        that vesicle exocytosis depends on cacophony, TRP and TRPL.
