core_functions:
- description: Pore-forming alpha1 subunit of the presynaptic Cav2 channel that conducts depolarization-evoked
    Ca2+ entry at the active zone, providing the Ca2+ trigger for synaptic vesicle exocytosis and neurotransmitter
    release.
  molecular_function:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  directly_involved_in:
  - id: GO:0098703
    label: calcium ion import across plasma membrane
  - id: GO:0099703
    label: induction of synaptic vesicle exocytosis by positive regulation of presynaptic cytosolic calcium
      ion concentration
  - id: GO:0007269
    label: neurotransmitter secretion
  - id: GO:0007268
    label: chemical synaptic transmission
  locations:
  - id: GO:0048787
    label: presynaptic active zone membrane
  in_complex:
    id: GO:0005891
    label: voltage-gated calcium channel complex
  supported_by:
  - reference_id: PMID:10864946
    supporting_text: neurotransmitter release in cac(TS2) is markedly reduced at elevated temperatures,
      indicating that cac encodes a primary alpha1 subunit functioning in synaptic transmission
  - reference_id: PMID:12122048
    supporting_text: Notably, rescue of rapid, calcium-triggered neurotransmitter release was achieved
      by neural expression of a single cDNA containing a subset of alternative exons and lacking any conserved
      synaptic-protein interaction sequence.
  - reference_id: PMID:16820014
    supporting_text: Presynaptic Ca2+ signals evoked by single and multiple action potentials showed a
      temperature-dependent reduction.
  - reference_id: PMID:14715960
    supporting_text: transgenic expression of a cac-encoded alpha1 subunit fused with enhanced green fluorescent
      protein efficiently rescues cac lethal mutations and allows in vivo analysis of calcium channel
      localization at active zones
  - reference_id: PMID:19596851
    supporting_text: Thus, the T-bar organized by BRP overlays the field of Ca2+ channels at the AZ center.
  - reference_id: PMID:14715138
    supporting_text: In a temperature-sensitive Ca(2+) channel mutant, cacophony(TS2), exocytosis induced
      by high K(+) decreased at nonpermissive temperatures, while endocytosis remained unchanged.
  - reference_id: PMID:22952921
    supporting_text: Single synaptic boutons resolved in the lamina by FM4-64 fluorescence revealed that
      vesicle exocytosis depends on cacophony, TRP and TRPL.
- description: Carries high voltage-activated (and an amiloride-insensitive low voltage-activated) Ca2+
    current in neuronal somata and dendrites.
  molecular_function:
    id: GO:0008331
    label: high voltage-gated calcium channel activity
  directly_involved_in:
  - id: GO:0098703
    label: calcium ion import across plasma membrane
  locations:
  - id: GO:0036477
    label: somatodendritic compartment
  in_complex:
    id: GO:0005891
    label: voltage-gated calcium channel complex
  supported_by:
  - reference_id: PMID:22183725
    supporting_text: we show that Dmca1A underlies the HVA somatodendritic calcium currents in vivo
  - reference_id: PMID:22183725
    supporting_text: We further demonstrated that the Ca(v)2 homolog, Dmca1A, mediated the amiloride-insensitive
      component of LVA current.
  - reference_id: PMID:19004991
    supporting_text: CAC channels are the major contributors to the slow-inactivating PLTXII-sensitive
      current based on selective reduction of this component in hypomorphic cac mutants (NT27 and TS3)
suggested_questions:
- question: Does Cac itself localize to lysosomes in fly neurons, as shown for mouse CACNA1A, or does
    its role in autophagosome-lysosome fusion arise from plasma-membrane Ca2+ entry?
- question: Is the Malpighian tubule epithelial fluid transport role attributable to Cac or to the L-type
    Ca-alpha1D channel, given the dihydropyridine/phenylalkylamine pharmacology used?
- question: Does the nbA^H18 (cac^H18) loss of light responsiveness reflect a photoreceptor (receptor
    potential) defect or loss of synaptic output from photoreceptors?
- question: FlyBase carries NOT involved_in neurotransmitter secretion from PMID:25811491; should this
    row be withdrawn given that the paper treats cac as required for release?
suggested_experiments:
- description: Endogenously tagged Cac (CRISPR knock-in) co-stained with lysosomal markers in photoreceptors,
    and rescue of the cac autophagy phenotype with a plasma-membrane-restricted versus lysosome-targeted
    Cac.
- description: Tubule-specific RNAi of cac versus Ca-alpha1D with CAP2b-stimulated fluid secretion (Ramsay
    assay) and [Ca2+]i imaging.
- description: Intracellular photoreceptor recordings in nbA^H18 eye clones to separate phototransduction
    from synaptic transmission defects.
