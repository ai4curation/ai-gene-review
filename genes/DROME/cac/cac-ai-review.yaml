  qualifier: involved_in
  negated: true
  review:
    summary: 'NOT annotation: cac does not participate in neurotransmitter secretion.'
    action: REMOVE
    reason: Contradicted, including by the cited paper itself, which describes cac as required for neurotransmitter
      release and shows cac mutant clones lack ERG on-transients. The negative finding in that paper is
      that the autophagy defect is not secondary to loss of release; this NOT row appears to encode that
      conclusion as a negation of the process. Removing the NOT does not by itself assert the positive
      claim, which is separately accepted.
    supported_by:
    - reference_id: PMID:25811491
      supporting_text: It indicates that loss of neurotransmitter release in cac and stj mutants is not
        causing autophagy defects per se.
    - reference_id: PMID:25811491
      supporting_text: 'Since cac, stj, and Vha100–1 (ID: 43442)are all required for neurotransmitter
        release, and mutations in these genes result in SV accumulation in the photoreceptor terminals'
    - reference_id: PMID:25811491
      supporting_text: In response to a 1 s light pulse, cac alleles lack on transients at day 3 and day
        33.
    source_defects:
    - defect_type: OTHER
      resource: FLYBASE
      slot: Qualifier
      requested_change: DELETE_ROW
      asserted_value: GO:0007269
      confidence: PROBABLE
      explanation: FlyBase row NOT|involved_in GO:0007269 neurotransmitter secretion (IMP, PMID:25811491)
