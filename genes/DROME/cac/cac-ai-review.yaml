    label: regulation of heart rate
  evidence_type: IMP
  original_reference_id: PMID:16076631
  qualifier: involved_in
  review:
    summary: cac^S and cac^TS2 mutants and cac deficiency heterozygotes have faster, more regular heartbeats.
    action: KEEP_AS_NON_CORE
    reason: Dominant heart-rate phenotypes of cac alleles and deletions implicate Cac channels in the
      larval/pupal cardiac pacemaker. This is a physiological role of the channel outside the nervous
      system and peripheral to its core presynaptic function; the authors also invoke a second Ca2+ channel
      in pacemaking.
    supported_by:
    - reference_id: PMID:16076631
      supporting_text: Hearts of both cac(S) and cac(TS2) mutants beat significantly more rapidly than
        wild type and the heartbeat is more regular across temperature.
    - reference_id: PMID:16076631
      supporting_text: in addition to Dmca1A, a second Ca(2+) channel with different kinetics is also
        involved in pacemaking
