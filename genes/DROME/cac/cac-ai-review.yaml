  review:
    summary: InterPro2GO from an EF-hand (IPR002048) match in the proximal C-terminus.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cav alpha1 subunits carry an EF-hand-like motif in the C-terminal tail that contributes to
      Ca2+/calmodulin-dependent regulation, but no Ca2+-binding activity has been shown for Cac, and Ca2+
      handling by the channel is permeation through the pore, which is captured by voltage-gated calcium
      channel activity. A generic calcium ion binding annotation from a single domain match over-states
      what is known.
