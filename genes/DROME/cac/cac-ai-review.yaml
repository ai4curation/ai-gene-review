  review:
    summary: Cac is the alpha1 subunit of a Cav2 voltage-gated calcium channel complex.
    action: ACCEPT
    reason: As the pore-forming subunit, Cac is part of the heteromeric VGCC complex (alpha1 with beta
      and alpha2delta, e.g. Stj). The Cav2 IBA node (PTN001295293) includes cac itself and mammalian CACNA1A/B/E;
      the target sits squarely in that clade. Genetic interaction with the alpha2delta subunit stj, which
      phenocopies cac in PMID:25811491, also supports a shared complex.
    supported_by:
    - reference_id: file:DROME/cac/cac-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the calcium channel alpha-1 subunit (TC 1.A.1.11) family.
    - reference_id: PMID:14715960
      supporting_text: transgenic expression of a cac-encoded alpha1 subunit fused with enhanced green
        fluorescent protein efficiently rescues cac lethal mutations and allows in vivo analysis of calcium
        channel localization at active zones
