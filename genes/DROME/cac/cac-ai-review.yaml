id: P91645
gene_symbol: cac
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: cacophony (cac; Dmca1A; nightblind A) encodes the pore-forming alpha1 subunit of the sole
  Drosophila Cav2-type (N/P/Q/R-type) voltage-gated calcium channel. The protein has four homologous repeats
  of six transmembrane segments with S4 voltage sensors and is extensively alternatively spliced and RNA-edited.
  Cac channels cluster at the centre of presynaptic active zones, beneath the Bruchpilot T-bar, where
  depolarization-evoked Ca2+ entry through them triggers synaptic vesicle exocytosis; cac is the primary
  presynaptic calcium channel for evoked release at the larval neuromuscular junction and also supports
  release at central cholinergic synapses, photoreceptor terminals and amacrine cells. In neuronal somata
  and dendrites Cac carries high voltage-activated (and part of the low voltage-activated) Ca2+ current.
  Cac-dependent Ca2+ entry also contributes to presynaptic homeostatic potentiation, NMJ growth, local
  Ca2+ transients that trigger dendrite pruning, and autophagosome-lysosome fusion in photoreceptor terminals.
  Null alleles are lethal; viable alleles alter courtship song (cac^S), vision (nbA) and cause temperature-sensitive
  paralysis (cac^TS2).
