    overall_notes: 'Correct: catalytic subunit of the ER signal peptidase complex
      cleaving N-terminal signal sequences, with h-region length preference.'
- source: Alliance_Automated
  text: Enables serine hydrolase activity. Predicted to be involved in protein maturation.
    Located in endomembrane system. Is expressed in several structures, including
    adult head; adult heart; embryonic/larval midgut primordium; gland; and gut section.
    Orthologous to several human genes including SEC11A (SEC11 homolog A, signal peptidase
    complex subunit).
