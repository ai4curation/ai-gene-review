descriptions:
- source: UniProt
  text: Catalytic component of the signal peptidase complex (SPC) which catalyzes
    the cleavage of N-terminal signal sequences from nascent proteins as they are
    translocated into the lumen of the endoplasmic reticulum. Specifically cleaves
    N-terminal signal peptides that contain a hydrophobic alpha-helix (h-region) shorter
    than 18-20 amino acids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O97066
