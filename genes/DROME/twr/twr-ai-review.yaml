taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: twr encodes the Drosophila SEC11-family catalytic subunit of the endoplasmic reticulum signal
  peptidase complex (SPC), a peptidase S26B (Ser-His dyad) protease anchored in the ER membrane as a single-pass
  type II protein with its active site in the lumen. Together with the accessory subunits Spase12 (SPCS1),
  Spase25 (SPCS2) and Spase22-23 (SPCS3), it cleaves N-terminal signal peptides from secretory and membrane
  proteins as they are translocated into the ER, a step required for their maturation and correct localization.
