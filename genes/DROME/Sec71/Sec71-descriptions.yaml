descriptions:
- source: Alliance_Automated
  text: Enables guanyl-nucleotide exchange factor activity and small GTPase binding
    activity. Involved in Golgi to plasma membrane protein transport; positive regulation
    of endocytosis; and positive regulation of neuron remodeling. Located in trans-Golgi
    network. Is expressed in adult head. Human ortholog(s) of this gene implicated
    in epilepsy and periventricular nodular heterotopia. Orthologous to several human
    genes including ARFGEF2 (ARF guanine nucleotide exchange factor 2).
