- term:
    id: GO:0043001
    label: Golgi to plasma membrane protein transport
  evidence_type: IGI
  original_reference_id: PMID:28420712
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0010348
  review:
    action: ACCEPT
    summary: Genetic interaction with Arf1 indicates that Sec71 is needed for Golgi to plasma membrane
      protein transport.
    reason: Consistent with the BIG-family role in post-Golgi trafficking and with the requirement for
      Sec71 in biosynthetic delivery of apical and basolateral membrane proteins in photoreceptors (PMID:31649044).
      The cached record is abstract-only; the curator saw the full text.
    supported_by:
    - reference_id: PMID:28420712
      supporting_text: we show that the Sec71/Arf1-mediated trafficking process is a prerequisite for
        Rab5-dependent endocytosis to facilitate endocytosis and degradation of the cell-adhesion molecule
        Neuroglian (Nrg).
    - reference_id: PMID:31649044
      supporting_text: Taken together, our observations indicate that Sec71 contributes to the secretion
        of both apical and basolateral proteins in PRCs, suggesting a defect in Golgi processing (Figure
        3E).
- term:
    id: GO:0045807
    label: positive regulation of endocytosis
  evidence_type: IMP
  original_reference_id: PMID:28420712
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Loss of Sec71 impairs Rab5-dependent endocytosis of Neuroglian in sensory neurons.
    reason: Experimental, but the abstract presents Sec71/Arf1-mediated trafficking as a prerequisite
      for endocytosis, i.e. an indirect effect of its Golgi function rather than direct participation
      in endocytosis. Kept as non-core; full text not available to check further.
    supported_by:
    - reference_id: PMID:28420712
      supporting_text: we show that the Sec71/Arf1-mediated trafficking process is a prerequisite for
        Rab5-dependent endocytosis to facilitate endocytosis and degradation of the cell-adhesion molecule
        Neuroglian (Nrg).
- term:
    id: GO:0048471
    label: perinuclear region of cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0198
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Perinuclear region of cytoplasm from an ARBA-based UniProt subcellular location.
    reason: The assignment rests on an ARBA rule transferring the mammalian BIG1/BIG2 perinuclear (Golgi
      ribbon) appearance. Drosophila Golgi exists as dispersed stacks, and Sec71 was localized to trans-Golgi
      puncta, not a perinuclear zone; the informative location is already covered by the Golgi and trans-Golgi
      network rows.
    supported_by:
    - reference_id: PMID:22291037
      supporting_text: Examination of S2 cells expressing GFP-tagged Sec71 revealed that it was associated
        with the Golgi and overlapped with a trans-Golgi marker (dGolgin245) while being clearly distinct
        from a cis-Golgi marker (dGM130), indicating a trans-Golgi localization
    - reference_id: PMID:33262309
      supporting_text: These results indicate that Sec71 is the sole BFA target for BFA body formation
        and controls Golgi stack separation.
- term:
    id: GO:1904801
    label: positive regulation of neuron remodeling
  evidence_type: IGI
  original_reference_id: PMID:28420712
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0028538
  review:
    action: KEEP_AS_NON_CORE
    summary: Sec71 is required for dendrite pruning of ddaC sensory neurons during metamorphosis (genetic
      interaction with FB:FBgn0028538).
    reason: Well-supported developmental phenotype, but it reflects the general need for Sec71/Arf1-dependent
      Golgi trafficking (needed for endocytic removal of Neuroglian) in pruning neurons; a pleiotropic,
      non-core process for a housekeeping trans-Golgi Arf GEF.
    supported_by:
    - reference_id: PMID:28420712
      supporting_text: Like Arf1, Sec71 is also important for dendrite pruning, but not for apoptosis,
        of sensory neurons.
    - reference_id: PMID:28420712
      supporting_text: we show that the Sec71/Arf1-mediated trafficking process is a prerequisite for
        Rab5-dependent endocytosis to facilitate endocytosis and degradation of the cell-adhesion molecule
        Neuroglian (Nrg).
