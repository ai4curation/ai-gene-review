  review:
    action: REMOVE
    summary: NAS from ComplexPortal CPX-26617, which lists fly Sec71 as a subunit of the ER Sec62/Sec63
      translocon complex; rough endoplasmic reticulum membrane follows from that membership.
    reason: This is a symbol collision with yeast Sec71 (=Sec66), the small single-pass membrane subunit
      of the Sec63 complex. Drosophila Sec71 is an unrelated soluble BIG1/BIG2-type Sec7-domain Arf1 GEF
      at the trans-Golgi network, with no transmembrane segment and no Sec66 domain. The cited paper (PMID:15901661)
      concerns CrebA-dependent expression of secretory pathway genes and gives no evidence that fly Sec71
      is in a translocon complex. The row is a non-experimental mapping that is demonstrably wrong.
    supported_by:
