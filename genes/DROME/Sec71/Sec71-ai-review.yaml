id: Q9VJW1
gene_symbol: Sec71
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sec71 (CG7578) is the single Drosophila member of the BIG1/BIG2 (ARFGEF1/ARFGEF2) subfamily
  of large Sec7-domain guanine nucleotide exchange factors for ARF GTPases. It is a soluble 1653-residue
  protein with the conserved DCB, HUS, catalytic Sec7 and HDS domains, and is recruited from the cytosol
  to trans-Golgi network membranes through a direct GTP-dependent interaction between its N-terminal region
  and the Arf-like GTPase Arl1. At the trans-Golgi it activates Arf1 (Arf79F), preferentially binding
  GDP-Arf1, and Sec71 and Arf1 depend on each other for Golgi localization. It is the sole brefeldin A
  target whose inhibition causes Golgi stacks to aggregate, and it keeps Golgi stacks separated. Through
  Arf1 activation it supports post-Golgi biosynthetic trafficking of apical and basolateral membrane proteins
  (photoreceptors), and its loss affects processes that depend on this trafficking, including dendrite
  pruning of sensory neurons, Rab5-dependent endocytosis of Neuroglian, neural stem cell reactivation
  and neuroblast polarity.
