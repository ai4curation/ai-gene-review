- id: PMID:15901661
  title: CrebA regulates secretory activity in the Drosophila salivary gland and epidermis.
  findings:
  - statement: CrebA drives high expression of ER targeting/translocation and ER-Golgi transport genes
      in the salivary gland; the abstract gives no evidence about Sec71 complex membership.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Cited by ComplexPortal CPX-26617 for a Sec62/Sec63 complex containing fly Sec71. The
      paper is about transcriptional control of secretory genes; fly Sec71 is a BIG-family Arf GEF, not
      the yeast Sec71/Sec66 translocon subunit, so the paper cannot support those rows.
- id: PMID:22291037
  title: The small G protein Arl1 directs the trans-Golgi-specific targeting of the Arf1 exchange factors
    BIG1 and BIG2.
  findings:
  - statement: Arl1-GTP binds Sec71 directly through the region N-terminal to the Sec7 domain and recruits
      it to trans-Golgi membranes.
    supporting_text: This indicates that Arl1 recruits Sec71 to Golgi membranes, but it appears that Arl1’s
      effects are augmented by additional interactions elsewhere in the protein.
  - statement: Sec71-GFP localizes to the trans-Golgi in S2 cells.
    supporting_text: Thus, Sec71 binds to Arl1-coated liposomes in vitro and colocalizes with Arl1 on
      the trans-Golgi in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; Drosophila S2 cell and liposome experiments directly on Sec71 (CG7578).
      Supports the IPI small GTPase binding (Arl1) and IDA trans-Golgi network rows.
- id: PMID:28420712
  title: Sec71 functions as a GEF for the small GTPase Arf1 to govern dendrite pruning of Drosophila sensory
    neurons.
  findings:
  - statement: Sec71 is a GEF for Arf1, preferentially binding GDP-Arf1, and is required for dendrite
      pruning of ddaC neurons.
    supporting_text: We further identified Sec71 as a guanine nucleotide exchange factor for Arf1 that
      preferentially interacts with its GDP-bound form.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; title and abstract match the FlyBase experimental rows (GEF
      IDA/IPI, Golgi IDA, IGI/IMP process rows).
- id: PMID:31649044
  title: Identification of Genes Required for Apical Protein Trafficking in Drosophila Photoreceptor Cells.
  findings:
  - statement: Sec71 knockdown in photoreceptors reduces apical (Crb, Eys, Rh1) and basolateral (Nrv)
      proteins, placing Sec71 in Golgi biosynthetic trafficking.
    supporting_text: Taken together, our observations indicate that Sec71 contributes to the secretion
      of both apical and basolateral proteins in PRCs, suggesting a defect in Golgi processing (Figure
      3E).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; RNAi screen with follow-up on Sec71 in photoreceptors.
- id: PMID:33262309
  title: Sec71 separates Golgi stacks in Drosophila S2 cells.
  full_text_unavailable: true
  findings:
  - statement: Genome-edited BFA-resistant and BFA-hypersensitive Sec71 alleles show Sec71 is the BFA
      target for BFA-body formation and controls Golgi stack separation.
    supporting_text: These results indicate that Sec71 is the sole BFA target for BFA body formation and
      controls Golgi stack separation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache.
- id: PMID:37567172
  title: Golgi-dependent reactivation and regeneration of Drosophila quiescent neural stem cells.
  full_text_unavailable: true
  findings:
  - statement: Arf1 and its GEF Sec71 promote quiescent neural stem cell reactivation and protrusion regeneration
      through microtubule growth.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only; downstream developmental phenotype.
- id: PMID:40208939
  title: Arf1 and ARFGEF2/Sec71 control neuroblast polarity by anchoring nonmuscle myosin II.
  findings:
  - statement: Sec71 loss of function or dominant-negative Sec71 disrupts neuroblast apicobasal polarity
      and cortical PI(4)P and myosin II localization.
    supporting_text: Taken together, these observations indicate that Arf1 and Sec71 may facilitate the
      localization of nonmuscle myosin II to the cell cortex in mitotic neuroblasts.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; developmental phenotypes downstream of Golgi/Arf1 function.
