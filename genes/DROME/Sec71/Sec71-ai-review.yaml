    label: positive regulation of ARF protein signal transduction
  - id: GO:0043001
    label: Golgi to plasma membrane protein transport
  locations:
  - id: GO:0005802
    label: trans-Golgi network
  supported_by:
  - reference_id: PMID:28420712
    supporting_text: We further identified Sec71 as a guanine nucleotide exchange factor for Arf1 that
      preferentially interacts with its GDP-bound form.
  - reference_id: PMID:22291037
    supporting_text: Thus, Sec71 binds to Arl1-coated liposomes in vitro and colocalizes with Arl1 on
      the trans-Golgi in vivo.
  - reference_id: PMID:31649044
    supporting_text: Taken together, our observations indicate that Sec71 contributes to the secretion
      of both apical and basolateral proteins in PRCs, suggesting a defect in Golgi processing (Figure
      3E).
suggested_questions:
- question: Does Sec71 also activate the class II Arf (Arf102F) and Arl1 itself, or only Arf1 (Arf79F),
    at the trans-Golgi?
- question: Should ComplexPortal CPX-26617 replace Q9VJW1 with a true fly Sec66 ortholog, and does Drosophila
    have one?
- question: Does Arf1-GTP recognise Sec71 as an effector, forming a positive-feedback loop that stabilises
    its trans-Golgi recruitment, as proposed for BIG1?
suggested_experiments:
- description: Measure Sec71 Sec7-domain catalysed nucleotide exchange on purified myristoylated Arf79F,
    Arf102F and Arl1 on liposomes, with and without Arl1-GTP, to define substrate specificity and the
    effect of membrane recruitment on activity.
- description: Use the genome-edited BFA-resistant Sec71 allele in vivo to separate Sec71-dependent from
    other BFA-sensitive (Gartenzwerg/GBF) functions in neuronal dendrite pruning and photoreceptor trafficking.
