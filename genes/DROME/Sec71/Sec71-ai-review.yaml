  review:
    action: ACCEPT
    summary: Phylogenetic inference that Sec71, as a BIG/Sec7-family member, has guanyl-nucleotide exchange
      factor activity.
    reason: Sec71 is the fly ortholog of BIG1/BIG2 and is inside the Sec7/BIG clade whose GEF activity
      the PAINT node asserts; the fly gene appears among the experimental seeds because its own GEF activity
      toward Arf1 was shown (PMID:28420712). No evidence of loss. GO:0005085 is the most specific available
      term now that ARF GEF activity (GO:0005086) is obsolete.
    supported_by:
    - reference_id: PMID:28420712
      supporting_text: We further identified Sec71 as a guanine nucleotide exchange factor for Arf1 that
        preferentially interacts with its GDP-bound form.
    - reference_id: PMID:22291037
      supporting_text: Sec71 is the Drosophila ortholog of human BIG1/BIG2, although it has not been extensively
        characterized.
