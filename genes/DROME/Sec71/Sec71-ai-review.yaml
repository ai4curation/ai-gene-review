- id: file:DROME/Sec71/Sec71-bioinformatics/RESULTS.md
  title: Sec71 ComplexPortal SEC62-SEC63 complex membership check
  findings:
  - statement: Fly Sec71 is a soluble BIG-family Sec7 GEF while yeast Sec71 is Sec66, a single-pass Sec63-complex
      subunit; CPX-26617 membership reflects a name collision.
core_functions:
- description: 'Arf1 guanine nucleotide exchange factor at the trans-Golgi network: Sec71 is recruited
    to trans-Golgi membranes by Arl1-GTP and uses its Sec7 domain to load Arf1 with GTP, driving post-Golgi
    secretory trafficking and maintaining separation of Golgi stacks.'
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
