suggested_questions:
- question: Does Drosophila Mettl1 also install internal m7G in mRNAs or miRNAs, as reported for mammalian
    METTL1, and does any of that contribute to the testis phenotype?
- question: Why is m7G-dependent tRNA abundance critical in testis but not in somatic tissues?
suggested_experiments:
- hypothesis: Testis-specific tRNA decay pathways make m7G46-lacking tRNAs unstable mainly in the male
    germline.
  description: Compare tRNA half-lives and decay factor expression in Mettl1-KO testes and somatic tissues;
    test whether depleting candidate decay factors restores tRNA levels and spermatid elongation.
