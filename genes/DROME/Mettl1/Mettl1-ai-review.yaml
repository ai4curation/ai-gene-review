id: O77263
gene_symbol: Mettl1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mettl1 (CG4045) is the Drosophila ortholog of METTL1/Trm8, the catalytic subunit of the Mettl1-Wuho
  tRNA (m7G46) methyltransferase. Using S-adenosylmethionine, it methylates guanosine 46 at N7 in the
  variable loop of a subset of tRNAs carrying the RAGGU motif; this activity requires the WD40 partner
  Wuho (WDR4/Trm82 ortholog). m7G46 stabilizes the modified tRNAs, and in Mettl1 knockout flies these
  tRNAs are depleted, ribosomes stall at the codons they decode and translation of spermatid-elongation
  genes falls. Mettl1 is dispensable for somatic development but its catalytic activity is required for
  spermatid elongation and male fertility.
