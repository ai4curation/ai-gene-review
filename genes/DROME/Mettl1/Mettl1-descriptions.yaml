descriptions:
- source: UniProt
  text: Catalytic component of Mettl1-wuho methyltransferase complex that mediates
    the formation of N(7)-methylguanine in a subset of RNA species, such as tRNAs,
    mRNAs and microRNAs (miRNAs) (PubMed:39317727). Catalyzes the formation of N(7)-methylguanine
    at position 46 (m7G46) in a subset of tRNAs that contain the 5'-RAGGU-3' motif
    within the variable loop (By similarity) (PubMed:39317727). M7G46 interacts with
    C13-G22 in the D-loop to stabilize tRNA tertiary structure and protect tRNAs from
    decay (By similarity). Required for the elongation step of spermatid formation
    (PubMed:39317727).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O77263
  source_id: O77263
