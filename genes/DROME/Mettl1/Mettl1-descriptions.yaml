- source: Alliance_Automated
  text: Enables tRNA (guanine(46)-N7)-methyltransferase activity. Involved in tRNA
    methylation. Part of tRNA (m7G46) methyltransferase complex. Is expressed in anterior
    midgut primordium; embryonic/larval midgut; posterior midgut primordium; and tracheal
    primordium. Orthologous to human METTL1 (methyltransferase 1, tRNA methylguanosine).
