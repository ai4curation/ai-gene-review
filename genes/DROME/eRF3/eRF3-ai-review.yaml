id: Q9VK85
gene_symbol: eRF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: eRF3 is the Drosophila class II eukaryotic peptide chain release factor, a translational
  GTPase of the EF-Tu/EF-1A family. It forms a complex with eRF1 and delivers it to ribosomes paused at
  stop codons; GTP hydrolysis by eRF3 allows eRF1 to accommodate into the peptidyl transferase centre
  and release the nascent chain. eRF3 loss-of-function alleles cause maternal-effect nonsense suppression
  through stop-codon readthrough and are lethal in larvae.
