suggested_questions:
- question: Does Drosophila eRF3 have a PABP-binding N-terminal extension that links termination to mRNA
    deadenylation and decay, as in yeast and mammals?
suggested_experiments:
- hypothesis: The eRF3 N-terminal region couples termination to poly(A)-binding protein and mRNA stability
    in Drosophila.
  description: Test pAbp binding of eRF3 N-terminal fragments and measure reporter mRNA stability in S2
    cells after replacing endogenous eRF3 with an N-terminally truncated variant.
  experiment_type: biochemistry and reporter assays
