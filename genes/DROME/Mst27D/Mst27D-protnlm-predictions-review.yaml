    summary: Microtubule binding is directly supported by CH-domain experiments, full-length localization
      and the bundling phenotype. The same broad term already appears in GOA. Although GOA also contains
      plus-end binding, primary evidence shows that Mst27D binds along the lattice rather than sharing
      EB1’s preference, so the unsupported narrower annotation is not grounds for LSP. ProtNLM correctly
      captures the established broad activity.
    supported_by:
    - reference_id: PMID:37428798
      supporting_text: Moreover, Mst27D binds all along MTs, contrasting with Eb1’s preference for growing
        MT plus ends.
    - reference_id: PMID:37428798
      supporting_text: In Mst27D null mutants, this bundling process does not occur and nuclear elongation
        is abnormal.
