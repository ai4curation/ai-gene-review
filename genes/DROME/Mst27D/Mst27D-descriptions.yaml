descriptions:
- source: Alliance_Imported
  text: Male specific transcript 27D (Mst27D) encodes a protein required for normal
    elongation of the spermatid nucleus from spherical to needle shape. Mst27D is
    transcribed exclusively in mid to late spermatocytes.
