    overall_notes: 'Correct: required for spermatid nuclear elongation, transcribed
      in spermatocytes. No EB1 family, Nup358 or microtubule bundling mechanism.'
- source: Alliance_Automated
  text: Predicted to enable microtubule plus-end binding activity. Predicted to be
