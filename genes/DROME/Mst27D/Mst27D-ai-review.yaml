  review:
    summary: The characterized native Mst27D role begins after meiosis and supports spermatid
      microtubule bundling rather than spindle assembly.
    action: REMOVE
    reason: 'The spindle-assembly IBD at PTN000065701 describes ancestral EB-family biology. PMID:37428798
      provides target-specific developmental divergence: endogenous Mst27D accumulation begins
      after meiosis, and null-mutant analysis detects no earlier abnormalities but severe spermatid
      nuclear-elongation defects. This combination of native timing and stage-resolved perturbation
      challenges retention of the ancestral spindle-assembly role, rather than simply relying
      on absent target experiments or distant experimental descendants.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000065701
        source_label: PTN000065701
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
