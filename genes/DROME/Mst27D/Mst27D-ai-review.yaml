  review:
    summary: The proposed effect of Mst27D bundling on microtubule stability has not been tested. No
      target data address polymerization or depolymerization directly.
    action: UNDECIDED
    reason: Canonical EBs regulate microtubule dynamics at growing plus ends. Mst27D has lost plus-end
      tracking and the EBH domain, which argues against inheriting that mechanism. However, the authors
      propose that Mst27D-driven bundling stabilizes dense-complex microtubules, and demecolcine shows
      that dense-complex formation needs dynamic polymerization. This could be a different route to
      regulating dynamics, but no assay of microtubule growth or shrinkage with and without Mst27D has
      been done. The ancestral mechanism is unlikely to apply. Whether a bundling-based effect on stability
      exists is unknown. This review neither accepts nor removes the term.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000065701
        source_label: PTN000065701
        source_status: UNRESOLVED
        comment: The plus-end mechanism behind the donors' term has diverged in Mst27D. A bundling-based
          stabilization effect has been proposed but not tested.
