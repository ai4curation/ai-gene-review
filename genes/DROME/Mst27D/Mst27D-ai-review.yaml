suggested_questions:
- question: Does the Mst27D CH domain bind microtubules directly in vitro? Is its lattice-wide binding
    caused by specific substitutions in the CH domain, compared with the plus-end-tracking CH domain
    of Eb1?
- question: Is the concentration of endogenous Mst27D in spermatids high enough to cross-link microtubules
    directly? Or does Mst27D bundle mainly by concentrating other bundling factors at the nuclear envelope?
suggested_experiments:
- description: Reconstitute purified full-length Mst27D with dynamic microtubules (TIRF). Test for lattice
    binding versus plus-end tracking, for microtubule bundling, and for effects on growth and catastrophe
    rates. This would test the bundling activity directly and decide the IBA term for regulation of microtubule
    polymerization or depolymerization.
  experiment_type: in vitro reconstitution (TIRF microscopy)
