  review:
    summary: Full-length Mst27D binds along microtubules without EB1-like plus-end preference;
      the narrower plus-end assertion remains unresolved.
    action: UNDECIDED
    reason: PTN000065701 carries the ancestral plus-end localization and binding assertions. GO:0051010
      requires binding to the plus end, and GO:0035371 identifies the growing plus end; neither
      definition requires preferential comet-like tracking. PMID:37428798 establishes lattice-wide
      binding and loss of Eb1-like preference, which does not automatically exclude any end binding.
      The comet-forming construct is the isolated C-terminal fragment lacking the N-terminal CH
      domain, not a C-terminal truncation retaining that domain; the authors propose heterodimerization
      with endogenous EB-family proteins. Neither the fragment result nor the lack of preference
      settles full-length inherited capacity.
