  review:
    summary: Spindle-midzone localization is poorly matched to the characterized native postmeiotic
      Mst27D distribution.
    action: MARK_AS_OVER_ANNOTATED
    reason: PTN000065701 carries the spindle-midzone IBD. Endogenous Mst27D begins accumulating
      after meiosis and localizes to the spermatid nuclear envelope/dense complex (PMID:37428798).
      This target-specific timing and distribution challenge a native spindle-midzone assignment;
      a microtubule-organizing center is a different and broader structure and is being assessed
      separately. Retain a cautious over-annotation call rather than claiming that all possible
      ectopic or low-level spindle association has been excluded.
