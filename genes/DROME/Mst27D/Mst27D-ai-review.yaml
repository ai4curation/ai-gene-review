- term:
    id: GO:0001578
    label: microtubule bundle formation
  evidence_type: IMP
  original_reference_id: PMID:37428798
  review:
    action: NEW
    summary: Mst27D is required for progressive bundling of dense-complex microtubules during
      spermatid nuclear elongation.
    reason: Loss of Mst27D prevents normal progressive bundling and disrupts nuclear elongation;
      overexpression also promotes microtubule cables. This is the direct cytoskeletal assembly
      role.
    supported_by:
    - reference_id: PMID:37428798
      supporting_text: In Mst27D null mutants, this bundling process does not occur and nuclear
        elongation is abnormal.
