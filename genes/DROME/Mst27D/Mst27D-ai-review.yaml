taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mst27D (CG31907) is a spermatid-specific member of the EB1/RP-EB microtubule-associated
  protein family. It belongs to a fly-lineage EB subfamily that also contains Drosophila Eb1. Its N-terminal
  calponin-homology (CH) domain binds microtubules. Its divergent C-terminal region (residues 151-424)
  lacks the EB1 C-terminal (EBH) domain and the acidic EEY/F tail of canonical EB proteins; it mediates
  homodimerization and binds the nuclear pore protein Nup358. Endogenous Mst27D accumulates after meiosis.
  It localizes to the nuclear envelope region that still holds nuclear pore complexes, and to the microtubule
  bundle of the adjacent dense complex. Unlike Eb1, which tracks growing microtubule plus ends, Mst27D
  binds along the whole microtubule lattice. At high concentration it bundles microtubules. In spermatids
  it links nuclear pore complexes to the dense-complex microtubules and is needed to bundle these progressively
  into a single bundle. Null mutants fail to form this bundle and their spermatid nuclei elongate abnormally.
