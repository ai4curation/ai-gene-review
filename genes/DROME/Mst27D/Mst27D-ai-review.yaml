- term:
    id: GO:0001578
    label: microtubule bundle formation
  evidence_type: IMP
  original_reference_id: PMID:37428798
  review:
    action: NEW
    summary: Mst27D is required to bundle the dense-complex microtubules progressively, and it bundles
      microtubules itself when expressed in cultured cells.
    reason: Mst27D does part of the work of this process. It is not only necessary for it. Null spermatids
      fail to form the dense-complex bundle. In S2R+ cells, high Mst27D levels bundle microtubules into
      cables, with either EGFP or monomeric mCherry tags. A chimera that cannot reach NPCs still bundles.
      The authors propose that an Mst27D dimer cross-links two microtubules through its two CH domains.
      The perturbation and gain-of-function data together support direct participation.
    supported_by:
    - reference_id: PMID:37428798
      supporting_text: In Mst27D null mutants, this bundling process does not occur and nuclear elongation
        is abnormal.
    - reference_id: PMID:37428798
      supporting_text: MT bundling was also obtained with the chimeric protein Mst27D_CH-Eb1_CT-EGFP,
        indicating that the MT bundling activity does not require the concentration of Mst27D by recruitment
        to NPCs
    - reference_id: PMID:37428798
      supporting_text: Extensive MT bundling was clearly apparent in S2R+ cells expressing high levels
        of Mst27D-EGFP or Mst27D-mCherry
- term:
    id: GO:0007290
    label: spermatid nucleus elongation
  evidence_type: IMP
  original_reference_id: PMID:37428798
  review:
    action: NEW
    summary: Mst27D is the physical linker between nuclear pores and the dense-complex microtubule bundle,
      and this linkage shapes the elongating spermatid nucleus.
    reason: This is not a downstream phenotype. Mst27D is a structural link in the force-bearing connection
      between the nuclear envelope and the microtubule bundle, and the nucleus elongates along that bundle.
      It does part of the work of nuclear shaping. Nup358 is needed to bring Mst27D to the nuclear envelope.
      Without Mst27D, nuclear elongation is abnormal. Spag4 forms a separate nuclear-envelope-to-microtubule
      connection at the basal body, and Mst27D acts independently of it.
    supported_by:
    - reference_id: PMID:37428798
      supporting_text: In summary, our phenotypic characterizations demonstrated that Mst27D function
        is required for normal nuclear elongation in spermatids
    - reference_id: PMID:37428798
      supporting_text: Our present work demonstrates that the spermatid-specific Mst27D protein links
        NPCs to the MT bundle of the DC
