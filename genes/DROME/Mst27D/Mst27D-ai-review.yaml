  review:
    summary: Mst27D recruits Nup358, and with it nuclear pore complexes, to microtubules. Its C-terminal
      region binds Nup358, and co-expressed Nup358 is drawn into Mst27D-induced microtubule cables.
    action: ACCEPT
    reason: In canonical EBs this process is +TIP recruitment through the EBH domain, which Mst27D lacks.
      The general process is nevertheless supported in the target through a divergent C-terminal region.
      Mst27D's C-terminal region binds Nup358. When overexpressed, Mst27D draws co-expressed mCherry-Nup358
