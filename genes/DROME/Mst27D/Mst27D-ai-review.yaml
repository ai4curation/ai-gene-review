taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mst27D is a spermatid-specific microtubule-binding protein related to the EB1 family. Its
  N-terminal calponin-homology domain binds microtubules, while its C-terminal region mediates dimerization
  and binding to the nuclear pore protein Nup358. This links the nuclear envelope to the spermatid dense
  complex and promotes progressive microtubule bundling during nuclear elongation. Unlike canonical EB1,
  intact Mst27D binds along microtubules rather than preferentially tracking their growing plus ends.
