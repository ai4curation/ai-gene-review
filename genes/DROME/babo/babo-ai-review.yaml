- term:
    id: GO:0007476
    label: imaginal disc-derived wing morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:16648592
  qualifier: involved_in
  review:
    summary: Babo affects imaginal-disc-derived wing morphology.
    action: KEEP_AS_NON_CORE
    reason: The wing-shape study and independently established receptor/Smox growth role support a
      contextual developmental annotation. Wing shape and wing size are not assumed to be
      interchangeable.
    supported_by:
    - reference_id: PMID:23485686
      supporting_text: Although loss of either babo or Smad2 expression reduce growth in the wing
        blade in a similar manner, loss of Smad2 can also cause phenotypes related to ectopic BMP
        signalling, suggesting a physiological role for this transducer in the regulation of Mad
        spatial activation.
- term:
    id: GO:0008340
    label: determination of adult lifespan
  evidence_type: IMP
  original_reference_id: PMID:29615416
  qualifier: acts_upstream_of_positive_effect
  review:
    summary: Adult Babo signaling affects lifespan in an experimental tissue-dependent context.
    action: KEEP_AS_NON_CORE
    reason: The adult knockdown study and curated phenotype support lifespan modulation; it is not a
      universal pro-longevity or anti-longevity function, since tissue, age and ligand differ
      between studies.
    supported_by:
    - reference_id: file:DROME/babo/babo-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Conditional RNAi-mediated knockdown in adult flies reduces lifespan by 3 to
        10 days (PubMed:29615416).
