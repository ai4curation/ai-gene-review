  qualifier: involved_in
  review:
    summary: Babo signaling promotes neuroblast proliferation.
    action: KEEP_AS_NON_CORE
    reason: Brain proliferation is supported by loss-of-function and neuroblast rescue experiments.
      This is a specific developmental output of the activin receptor rather than an independent
      catalytic function.
