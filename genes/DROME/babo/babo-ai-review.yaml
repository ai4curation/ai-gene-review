id: A1Z7L8
gene_symbol: babo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Baboon is the Drosophila type I activin-family receptor serine/threonine kinase. In a cell-surface
  complex with a type II receptor, it transduces activin-family ligands by phosphorylating the C-terminal
  motif of Smox, promoting Smox–Medea complex formation and transcriptional responses. Alternative extracellular
  domains create Babo-A, Babo-B and Babo-C isoforms with distinct ligand and tissue requirements; Dawdle
  preferentially signals through Babo-C with Punt. Babo regulates growth, neuronal development and remodeling,
  neuromuscular physiology and metabolic responses. Under particular experimental conditions it can also
  phosphorylate the BMP-branch Smad Mad, with Smox limiting this cross-talk.'
