  evidence_type: IMP
  original_reference_id: PMID:23485686
  qualifier: involved_in
  review:
    summary: Babo regulates wing size through its growth signaling output.
    action: KEEP_AS_NON_CORE
    reason: Loss of babo or Smox reduces wing growth, while altered Smox abundance changes
      cross-talk with BMP signaling. Retain the tissue-specific size outcome without conflating
      growth with all aspects of wing patterning.
