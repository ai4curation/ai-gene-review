  review:
    summary: Babo is required for development of adult-specific neurons.
    action: KEEP_AS_NON_CORE
    reason: Mosaic experiments show an autonomous late-larval requirement in neurons. This is a
      contextual developmental output of receptor signaling.
    supported_by:
