- source: Alliance_Automated
  text: Enables activin binding activity and activin receptor activity, type I. Involved
    in several processes, including imaginal disc morphogenesis; nervous system development;
    and positive regulation of SMAD protein signal transduction. Acts upstream of
    with a positive effect on determination of adult lifespan. Located in plasma membrane.
    Part of activin receptor complex. Is expressed in several structures, including
    adult head; embryonic/larval fat body; embryonic/larval gut; female germline cell;
    and imaginal disc. Human ortholog(s) of this gene implicated in Loeys-Dietz syndrome
    1; Lynch syndrome; disease of cellular proliferation (multiple); and liver cirrhosis.
    Orthologous to human ACVR1B (activin A receptor type 1B); ACVR1C (activin A receptor
    type 1C); and TGFBR1 (transforming growth factor beta receptor 1).
