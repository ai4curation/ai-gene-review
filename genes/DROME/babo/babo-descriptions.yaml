descriptions:
- source: UniProt
  text: 'Type I transmembrane receptor serine/threonine kinase involved in the activin-like
    TGF-beta signaling pathway (PubMed:10320478, PubMed:17119022, PubMed:18820452,
    PubMed:8289834). Forms a receptor complex with a type II transmembrane receptor
    serine/threonine kinase, and upon activation by an activin/TGF-beta- like ligand
    phosphorylates downstream receptor-regulated SMAD (R-SMAD) transcription factors,
    inducing their nuclear localization resulting in regulation of activin/TGF-beta-responsive
    genes (PubMed:10320478, PubMed:17119022, PubMed:18820452, PubMed:8289834). When
    part of a heteromeric complex with the type I receptor put/punt can be activated
    by the activin/TGF-beta-like ligands Actbeta/activin, daw/dawdle and possibly
    myo/myoglianin; ligand specificity is probably isoform- dependent (PubMed:17119022,
    PubMed:18820452, PubMed:8289834). Upon activation phosphorylates the R-SMAD Smox/SMAD2
    to activate the canonical TGF-beta pathway (PubMed:10320478, PubMed:17119022,
    PubMed:18820452, PubMed:19766717, PubMed:9887103). Can also phosphorylate Mad,
    the R-SMAD of the dpp BMP-like signaling pathway, in response to daw signaling
    but to a lesser extent (PubMed:18820452, PubMed:22563507). Phosphorylation of
    Mad is competitively regulated by Smox/SMAD2 (PubMed:22563507). Positive regulator
    of cell proliferation, probably through activation of the SMAD2-dependent activin
    signaling pathway (PubMed:9887103). Required for normal proliferation of medulla
    neuroblasts and laminar precursor cells in the optic lobe (PubMed:18171686). Involved
    in regulation of the ecdysteroid hormone receptor EcR in neuronal cells throughout
    the central nervous system (PubMed:38913612). Involved in axonal and dendritic
    pruning and neural remodeling of mushroom body gamma neurons during metamorphosis
    through regulation of EcR (PubMed:12581521). Involved in differentiation of dorsal
    cluster and ellipsoid body adult-specific neurons prior to metamorphosis (PubMed:16437159).
    Required in motoneurons for axon guidance or outgrowth of ISNb and SNa axons (PubMed:17119022).
    Involved in regulation of wing growth (PubMed:18820452). Signaling by daw or myo
    is involved in lifespan determination through regulation of proteasome- mediated
    degradation of misfolded or damaged proteins (PubMed:29615416). [Isoform B]: When
    in complex with put/punt can be activated by the activin-like TGF-beta ligands
    Actbeta or daw but may be the main isoform involved in Actbeta signaling (PubMed:17119022,
    PubMed:18820452, PubMed:8289834). This isoform is not essential for signaling
    by daw but may contribute; requires Isoform C (PubMed:19766717). Not required
    for brain growth during larval development (PubMed:38913612). Required for optic
    lobe development and photoreceptor axon targeting; regulates proliferation of
    precursor cells in the optic lobe (PubMed:18171686). Required for viability (PubMed:18171686).
    . [Isoform A]: When in complex with put/punt can be activated by the activin-like
    TGF-beta ligands Actbeta or daw (PubMed:17119022, PubMed:18820452, PubMed:8289834).
    May be the main isoform involved in myo/myoglianin signaling to activate the canonical
    TGF-beta signaling pathway (Probable). This isoform is not essential for signaling
    by daw but may contribute; requires Isoform C (PubMed:19766717). Involved in regulation
    of the ecdysteroid hormone receptor EcR in neuronal cells throughout the central
    nervous system (PubMed:38913612). Important for regulation of larval brain growth,
    including proliferation and conversion of neuroepithelial cells (PubMed:38913612).
    . [Isoform C]: Essential for signaling by daw leading to activation of the canonical
    TGF-beta pathway and phosphorylation of Smox/SMAD2 (Probable) (PubMed:19766717).
    Important for larval development (PubMed:38913612).'
