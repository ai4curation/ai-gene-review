- source: Alliance_Imported
  text: baboon (babo) encodes the type I receptor for the activin-like ligands encoded
    by daw, Act&bgr; and myo. There are three isoforms of the product of babo that
    differ only in their extracellular domain likely resulting in different ligand
    binding specificity. It can form a complex with the type II receptors put or wit
    in the presence of an activin like ligand. This results in the transcriptional
    regulation of activin responsive genes.
