- source: Alliance_Automated
  text: Enables aldose reductase (NADPH) activity. Involved in D-sorbitol biosynthetic
    process and fructose biosynthetic process. Located in cytoplasm and extracellular
    region. Is expressed in several structures, including adult brain cell body rind;
    adult head; adult heart; follicle cell; and germline cell. Human ortholog(s) of
    this gene implicated in several diseases, including arteriosclerosis; diabetic
    neuropathy; diabetic retinopathy; kidney disease (multiple); and type 2 diabetes
    mellitus. Orthologous to several human genes including AKR1B1 (aldo-keto reductase
    family 1 member B).
