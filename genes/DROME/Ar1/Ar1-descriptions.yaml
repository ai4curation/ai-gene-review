descriptions:
- source: UniProt
  text: Catalyzes the NADPH-dependent reduction of a wide variety of carbonyl-containing
    compounds to their corresponding alcohols. Displays enzymatic activity towards
    endogenous metabolites such as aromatic and aliphatic aldehydes, ketones, monosaccharides,
    bile acids and xenobiotics substrates. Key enzyme in the polyol pathway, catalyzes
    reduction of glucose to sorbitol during hyperglycemia. Reduces steroids and their
    derivatives and prostaglandins (By similarity). Through production of prostaglandin
    F2alpha may regulate the activity of non- muscle myosin II in an autocrine or
    paracrine fashion; influences border cell and nurse cell stiffness to facilitate
    border cell cluster migration (PubMed:38283991). Also regulates the cell surface
    localization of integrins in an autocrine or paracrine fashion; influences border
    cell adhesion to maintain border cell cluster morphology (PubMed:38283991). In
    hemocytes, probably contributes to production of sugar alcohols in the hemolymph,
    which act as alarmins involved in gut-fat body innate immunological communication
    (GFIC); leads to activation of the imd/Relish signaling pathway in the fat body
    (PubMed:31350199).
  source_type: curated
