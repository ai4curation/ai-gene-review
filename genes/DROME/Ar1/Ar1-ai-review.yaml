id: M9PF61
gene_symbol: Ar1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ar1 (Akr1B, CG6084) encodes a cytosolic NADPH-dependent aldo-keto reductase of the AKR1B
  family, the Drosophila counterpart of human aldose reductase AKR1B1. It reduces glucose to sorbitol,
  the first step of the polyol pathway that converts glucose to fructose via sorbitol, and, like other
  AKR1B enzymes, has broad specificity for aldehydes and carbonyl compounds, including the reduction of
  prostaglandin H2 to prostaglandin F2alpha. With its paralog Ar2 it is required for hemolymph sorbitol
  production; this polyol pathway flux lets fat body cells sense glucose uptake through the transcription
  factor Mondo. In hemocytes Ar1 produces sorbitol and galactitol that act as alarmins relaying gut immune
  activation to the fat body, and in the ovary Akr1B-derived prostaglandin F2alpha promotes border cell
  migration and cluster cohesion.
