core_functions:
- description: Ar1 reduces glucose to sorbitol with NADPH in the cytosol, the first step of the polyol
    pathway that converts glucose to fructose; this flux supports glucose sensing by Mondo in the fat
    body and sugar-alcohol alarmin production by hemocytes.
  molecular_function:
    id: GO:0004032
    label: aldose reductase [NAD(P)H] activity
  directly_involved_in:
  - id: GO:0006061
    label: D-sorbitol biosynthetic process
  - id: GO:0046370
    label: fructose biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:35687590
    supporting_text: Levels of sorbitol in the hemolymph were reduced in AR mutants and were increased
      in Sodh mutants
    reference_section_type: RESULTS
  - reference_id: PMID:31350199
    supporting_text: Aldose reductase (AR) in hemocytes, the rate-limiting enzyme of the polyol pathway,
      is necessary and sufficient for the increase of plasma sugar alcohols.
    reference_section_type: ABSTRACT
  - reference_id: file:DROME/Ar1/Ar1-deep-research-falcon.md
