      genetic evidence in hemocytes**
suggested_questions:
- question: Has the glucose-reducing activity and PGH2-reductase activity of purified Ar1 been measured,
    and how do its kinetic parameters compare with Ar2?
suggested_experiments:
- description: Purify Ar1 and Ar2 and measure kinetics with glucose, galactose, glyceraldehyde and PGH2
    to define their relative contributions to polyol and prostaglandin synthesis.
