core_functions:
- description: >-
    Notch transcriptional coactivator: Mastermind binds the NICD-Su(H) complex on DNA to form the CSL-Notch-Mastermind
    activator complex and drive transcription of Notch target genes.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:11390662
    supporting_text: >-
      Furthermore, Drosophila Mam forms a similar complex with the intracellular domain of Drosophila
      Notch and Drosophila CSL protein during activation of Enhancer of split, the Drosophila counterpart
      of HES.
  - reference_id: PMID:11390662
    supporting_text: >-
      These results indicate that Mam is an essential component of the transcriptional apparatus of Notch
      signaling.
  - reference_id: PMID:29478922
    supporting_text: >-
      In Notch-OFF nuclei, a small proportion of CSL molecules transiently binds DNA, while in Notch-ON
      conditions CSL recruitment increases dramatically at target loci, where complexes have longer dwell
      times conferred by the Notch co-activator Mastermind.
suggested_questions:
- question: >-
    What mechanism underlies the Notch-independent requirement for Mastermind in ovarian follicle stem
    cells, and does Mam act as a coactivator for other transcription factors in Drosophila?
- question: >-
    Should PANTHER PTHR16431 be split so that Mastermind proteins are not grouped with Mis18 centromere-licensing
    proteins, preventing centromeric IBA propagation to mam?
suggested_experiments:
- description: >-
    ChIP-seq of endogenous tagged Mam in Notch-ON versus Notch-OFF tissues and in follicle stem cells
    to identify Su(H)-independent Mam binding sites.
