- term:
    id: GO:0007219
    label: Notch signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:29478922
  qualifier: involved_in
  review:
    summary: >-
      mam is a neurogenic gene encoding a core nuclear component of the Notch signaling pathway (IDA).
    action: ACCEPT
    reason: >-
      Genetic interactions with N, Dl and dx, dominant-negative truncations phenocopying Notch loss, and
      biochemical complex formation place Mam at the transcriptional output step of Notch signaling. Core
      process.
    supported_by:
    - reference_id: PMID:29478922
      supporting_text: >-
        In Notch-OFF nuclei, a small proportion of CSL molecules transiently binds DNA, while in Notch-ON
        conditions CSL recruitment increases dramatically at target loci, where complexes have longer
        dwell times conferred by the Notch co-activator Mastermind
    - reference_id: PMID:9917364
      supporting_text: >-
        Notch signalling requires Mastermind, suggesting that Mastermind acts downstream of Notch to determine
        the vMP2 cell fate.
    - reference_id: PMID:11390662
      supporting_text: >-
        These results indicate that Mam is an essential component of the transcriptional apparatus of
        Notch signaling.
