id: P21519
gene_symbol: mam
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  mam (mastermind) encodes a large, glutamine-rich nuclear protein that is the transcriptional coactivator
  of the Notch pathway. Its N-terminal MamL-1 domain binds the composite surface formed by the Notch intracellular
  domain (ankyrin repeats) and the CSL factor Su(H) on DNA, completing the CSL-Notch-Mastermind activator
  complex; Mam lengthens the dwell time of Su(H) complexes at target enhancers and promotes transcription
  of Enhancer of split genes and other Notch targets. Mam binds many sites on polytene chromosomes and
  its chromatin binding depends partly on the SAGA/Tip60 subunit Nipped-A. As a neurogenic gene, mam is
  required for lateral inhibition during neurogenesis and for many Notch-dependent fate decisions (sensory
  organ lineages, CNS neuron identity, wing margin, mesoderm, oogenesis); a Notch-independent requirement
  in ovarian follicle stem cells has also been reported.
