    label: chromosome, centromeric region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1913828
  - PANTHER:PTN001046424
  - PomBase:SPCC970.12
  review:
    summary: >-
      IBA to a centromere/CENP-A-deposition term from PANTHER node PTN001046424 of PTHR16431.
    action: REMOVE
    reason: >-
      PTHR16431 places Drosophila Mastermind in the same family as the Mis18 CENP-A licensing proteins
      (fission yeast mis18, human MIS18A and OIP5/Mis18-beta). The centromeric IBD is seeded only by Mis18
      orthologs. Drosophila Mam is a MamL-1 domain Notch coactivator with no Mis18 domain and no evidence
      of centromere association; Drosophila CENP-A (CID) deposition is instead attributed to CAL1. This
      is a family-assignment artefact, not an inherited function.
    propagation_review: &id001
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001046424
        source_label: PTN001046424
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: PTHR16431 groups Mis18 proteins (fission yeast mis18, human/mouse MIS18A and OIP5/Mis18-beta)
          with Drosophila Mastermind; the centromeric IBD at this node is seeded only by Mis18 orthologs
          (MGI:1913828 = mouse Mis18a; PomBase:SPCC970.12 = S. pombe mis18). Drosophila mam carries the
          MamL-1 Notch-binding domain, has no Mis18/Yippee-like domain, and has no evidence of centromere
          function.
