taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gmer encodes the Drosophila GDP-L-fucose synthase (GDP-4-keto-6-deoxy-D-mannose 3,5-epimerase/4-reductase,
  the ortholog of human GFUS/TSTA3, also called FX). This cytosolic NADP(H)-dependent short-chain dehydrogenase/reductase
  family enzyme converts the Gmd product, GDP-4-dehydro-6-deoxy-D-mannose, into GDP-beta-L-fucose by sequential
  3,5-epimerization and 4-reduction, the second and final step of de novo GDP-fucose synthesis. Because
  flies lack a fucose salvage pathway, Gmer is the sole source of the GDP-fucose used for Notch O-fucosylation
  and N-glycan fucosylation.
