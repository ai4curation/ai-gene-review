suggested_questions:
- question: Are Gmer loss-of-function phenotypes identical to Gmd loss (Notch signaling defects and larval
    lethality), as expected if Gmer is the only route to GDP-fucose?
suggested_experiments:
- description: Generate Gmer null alleles and measure Notch O-fucosylation, N-glycan core fucosylation
    (HRP epitope) and Notch target expression in wing discs, with rescue by human GFUS.
