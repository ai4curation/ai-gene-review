  text: GDP-4-keto-6-deoxy-D-mannose 3,5-epimerase/4-reductaseGDP-L-fucose synthase
    (Gmer) encodes an enzyme that catalyzes the two-step NADP-dependent conversion
    of GDP-4-dehydro-6-deoxy-D-mannose to GDP-L-fucose, involving an epimerase and
    a reductase reaction. It is involved in the last step of the 'de novo' synthesis
    of GDP-L-fucose from GDP-mannose.
