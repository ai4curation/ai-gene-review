gene_symbol: Br140
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Br140 is the Drosophila homolog of the BRPF scaffold proteins (BRPF1/2/3), with PHD-zinc-knuckle-PHD,
  bromodomain and PWWP chromatin-reader modules. It is the scaffold subunit of the Enok (MOZ/MORF-type)
  histone acetyltransferase complex, which also contains the catalytic subunit Enok, Ing5 and Eaf6. Br140
  is required for the complex's acetylation of histone H3 lysine 23 in vivo and for normal Enok protein
  levels. Through the Enok complex it associates with the Elg1 PCNA-unloader complex, and the complex
  promotes the G1/S transition by limiting PCNA unloading from chromatin.
