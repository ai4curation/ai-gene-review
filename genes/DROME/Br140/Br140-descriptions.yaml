- source: Alliance_Automated
  text: Enables acetyltransferase activator activity. Involved in DNA strand elongation
    involved in DNA replication. Located in nucleus. Part of MOZ/MORF histone acetyltransferase
    complex. Is expressed in several structures, including embryonic anal pad; embryonic
    dorsal epidermis; embryonic lateral cord; embryonic ventral epidermis; and ventral
    midline of embryo. Human ortholog(s) of this gene implicated in bipolar disorder;
    intellectual disability; and schizophrenia. Orthologous to several human genes
    including BRPF1 (bromodomain and PHD finger containing 1) and BRPF3 (bromodomain
    and PHD finger containing 3).
