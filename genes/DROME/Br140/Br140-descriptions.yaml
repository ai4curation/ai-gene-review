descriptions:
- source: UniProt
  text: Scaffold subunit of the histone acetyltransferase (HAT) Enok complex which
    has histone H3 acetyltransferase activity (PubMed:27198229). As part of the Enok
    complex, associates with the Elg1 RFC-like complex and down-regulates its PCNA-unloading
    function to promote the G1/S transition (PubMed:27198229). May also play a role
    in maintaining the protein levels and stability of enok (PubMed:27198229).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q7JVP4
