- source: Alliance_Imported
  text: Bromodomain-containing protein, 140kD (Br140) encodes a histone acetyltransferase
    that is a component of the Enok complex, which interacts with the product of elg1
    via Br140 to promote the G1/S transition via proliferating cell nuclear antigen
    (PCNA) unloading.
  source_type: curated
  url: https://flybase.org/reports/Br140.html
