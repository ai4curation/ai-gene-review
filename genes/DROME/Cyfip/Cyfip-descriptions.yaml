- source: RefSeq
  text: Predicted to enable RNA 7-methylguanosine cap binding activity. Involved in
    several processes, including centripetally migrating follicle cell migration;
    positive regulation of filopodium assembly; and regulation of Arp2/3 complex-mediated
    actin nucleation. Located in apical part of cell and cytoplasm. Part of SCAR complex.
    Is expressed in several structures, including adult head; embryonic/larval gut;
    embryonic/larval neuromuscular junction; ganglia; and tract. Used to study chromosome
    15q11.2 deletion syndrome. Human ortholog(s) of this gene implicated in autism
    spectrum disorder; developmental and epileptic encephalopathy 65; and schizophrenia.
    Orthologous to human CYFIP1 (cytoplasmic FMR1 interacting protein 1) and CYFIP2
    (cytoplasmic FMR1 interacting protein 2). [provided by Alliance of Genome Resources,
    Jun 2026]
