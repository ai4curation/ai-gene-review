descriptions:
- source: UniProt
  text: Plays a role in guidance and morphology of central and peripheral axons and
    in synaptic morphology. Also required for formation of cell membrane protrusions
    and for bristle development (PubMed:12818175, PubMed:14588242, PubMed:15269173,
    PubMed:15385157). Plays a role in regulating mitochondrial activity, energy metabolism
    and membrane potential which maintains normal gamma-aminobutyric acid (GABA) signaling
    and ensures normal social behavior (PubMed:32200800).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VF87
  source_id: Q9VF87
