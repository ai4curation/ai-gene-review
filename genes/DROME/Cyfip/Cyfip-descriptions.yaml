    overall_notes: 'Correct: WAVE complex, Fmr1 and Rac1 partners, morphogenesis and
      synapse.'
- source: Alliance_Automated
  text: Predicted to enable small GTPase binding activity. Involved in several processes,
    including centripetally migrating follicle cell migration; positive regulation
    of filopodium assembly; and sensory organ development. Located in apical part
    of cell and cytoplasm. Part of SCAR complex. Is expressed in several structures,
    including adult head; embryonic/larval gut; embryonic/larval neuromuscular junction;
    ganglia; and tract. Used to study chromosome 15q11.2 deletion syndrome. Human
    ortholog(s) of this gene implicated in autism spectrum disorder; developmental
    and epileptic encephalopathy 65; and schizophrenia. Orthologous to human CYFIP1
    (cytoplasmic FMR1 interacting protein 1) and CYFIP2 (cytoplasmic FMR1 interacting
    protein 2).
