- source: Alliance_Imported
  text: Cytoplasmic FMR1 interacting protein (Cyfip) encodes an essential protein
    that is a component of the WAVE actin nucleator complex. It controls actin cytoskeleton
    remodeling and interacts with the products of Fmr1 and Rac1. It controls morphogenesis
    and synapse organization.
  source_type: curated
  url: https://flybase.org/reports/Cyfip.html
  source_id: FB:FBgn0038320
