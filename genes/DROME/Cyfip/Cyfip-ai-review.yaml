id: Q9VF87
gene_symbol: Cyfip
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cyfip (Sra-1, the Drosophila CYFIP1/2 ortholog) is a large subunit of the WAVE regulatory
  complex that forms a heterodimer with Hem/Kette. Cyfip binds the small GTPase Rac1 and, with Abi, forms
  the WRC surface that binds WIRS motifs in membrane receptors; Rac binding to Cyfip relieves the inhibition
  of SCAR, allowing stimulation of Arp2/3-mediated actin nucleation. Cyfip also binds the fragile X protein
  dFMR1, linking Rac signalling to FMRP function. Cyfip is enriched in the nervous system and is required
  for axon growth and guidance, synapse and neuromuscular junction morphology, bristle development and
  specific aspects of compound eye morphogenesis.
