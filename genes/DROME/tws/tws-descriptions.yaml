- source: Alliance_Automated
  text: Enables protein phosphatase regulator activity. Involved in several processes,
    including maintenance of neuroblast polarity; positive regulation of signal transduction;
    and regulation of cell cycle process. Located in cytosol and nucleus. Part of
    protein phosphatase type 2A complex. Is expressed in several structures, including
    adult optic lobe; embryonic/larval hindgut; female germline cell; gonad; and imaginal
    disc. Used to study autosomal dominant cerebellar ataxia. Human ortholog(s) of
    this gene implicated in Alzheimer's disease; brain disease; breast cancer; primary
    cerebellar degeneration; and spinocerebellar ataxia 12. Orthologous to several
    human genes including PPP2R2B (protein phosphatase 2 regulatory subunit Bbeta).
