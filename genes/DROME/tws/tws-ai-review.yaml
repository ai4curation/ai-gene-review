id: P36872
gene_symbol: tws
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: twins (tws; also aar) encodes the B55/PR55 regulatory subunit of Drosophila protein phosphatase
  2A. Tws binds the Pp2A-29B scaffold and Microtubule star catalytic subunit to form PP2A-B55/Tws, which
  dephosphorylates substrates of Cdk1 and other mitotic kinases. PP2A-Tws is inhibited at mitotic entry
  by Greatwall-phosphorylated Endos and reactivated for mitotic exit; it is required for proper anaphase
  (tws/aar mutants show lagging chromatids and anaphase bridges), for centrosome maturation, and for centriole
  duplication by counteracting Plk4 autophosphorylation and stabilizing Plk4. Tws shuttles through the
  nucleus but acts mainly in the cytoplasm. In development PP2A-Tws restricts aPKC to the apical cortex
  of neuroblasts to control polarity and self-renewal, influences sensory organ cell fate and imaginal
  disc patterning, and has been implicated in Wingless, Hedgehog and Toll/cGMP signaling. With PP2A-B56
  it also counterbalances Aurora B during acentrosomal oocyte spindle assembly.
