- hypothesis: PP2A-Tws directly dephosphorylates Plk4 at its autophosphorylated degron.
  description: Reconstitute PP2A-Tws with purified Plk4 phosphorylated in vitro, measure degron dephosphorylation
    and Slimb binding, and test a Tws mutant unable to bind Plk4 for centriole duplication in S2 cells.
  experiment_type: in vitro reconstitution plus cell-based rescue
