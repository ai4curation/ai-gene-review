  text: Enables chromatin binding activity; histone H4K16 acetyltransferase activity;
    and lncRNA binding activity. Involved in DNA damage response, signal transduction
    by p53 class mediator; chromatin remodeling; and positive regulation of DNA-templated
    transcription. Located in nuclear chromosome and polytene chromosome interband.
    Part of chromatin and transcription regulator complex. Is active in X chromosome.
    Human ortholog(s) of this gene implicated in heart disease and intellectual disability.
    Orthologous to human KAT8 (lysine acetyltransferase 8).
