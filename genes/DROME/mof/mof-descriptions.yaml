- source: Alliance_Imported
  text: males absent on the first (mof) encodes a MYST family histone acetyltransferase
    that acetylates the product of His4 at Lysine 16. It is part of the male-specific
    lethal complex that mediates dosage compensation by transcriptional upregulation
    of the male X chromosome. In addition, it is part of the non-specific lethal complex
    which regulates expression of housekeeping genes in males and females.
