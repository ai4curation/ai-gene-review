id: O02193
gene_symbol: mof
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: mof (males absent on the first) encodes the Drosophila MYST-family histone acetyltransferase
  (KAT8 ortholog) that deposits most acetylation of histone H4 on lysine 16 (H4K16ac). In males it is
  the catalytic subunit of the male-specific lethal (MSL) dosage compensation complex, which together
  with MSL1, MSL2, MSL3, MLE and the roX lncRNAs coats the single X chromosome and acetylates H4K16 across
  active X-linked genes, decompacting chromatin and contributing to the roughly two-fold transcriptional
  upregulation of the male X. Loss of mof is male-lethal. In both sexes MOF is also a subunit of the nonspecific
  lethal (NSL) complex, which binds promoters of thousands of housekeeping genes and promotes their transcription.
  MOF has a chromobarrel domain that binds nucleic acids, including roX2 RNA, and a C2HC zinc finger required
  for nucleosome binding and catalysis. Maternally deposited MOF establishes H4K16ac domains that prime
  zygotic gene activation, and mof is also required for normal survival after ionizing radiation.
