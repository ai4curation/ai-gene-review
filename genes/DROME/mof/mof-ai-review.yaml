suggested_questions:
- question: How is MOF partitioned between the MSL and NSL complexes in male cells, and does MSL2-mediated
    ubiquitylation of MOF control that partitioning?
- question: Is MOF's H4K16 acetyltransferase activity alone sufficient for the two-fold upregulation of
    the male X, or are non-catalytic functions of MOF in the MSL complex also required?
