    overall_notes: 'Correct: phospholipase B deacylating PtdCho at sn-1 and sn-2,
      glia wrapping and neuron/glia survival; OP-induced axonopathy refers to the
      vertebrate NTE. PKA-C3 not named.'
- source: Alliance_Imported
  text: swiss cheese (sws) encodes a transmembrane protein that hydrolyzes phosphatidylcholine
    and binds to and inhibits the C3 catalytic subunit of protein kinase A. Its loss
    leads to neuronal and glial degeneration and apoptotic cell death.
  source_type: curated
  url: https://flybase.org/reports/sws.html
  source_id: FB:FBgn0003656
  review:
