descriptions:
- source: UniProt
  text: Phospholipase B that deacylates intracellular phosphatidylcholine (PtdCho),
    generating glycerophosphocholine (GroPtdCho). This deacylation occurs at both
    sn-2 and sn-1 positions of PtdCho. Its specific chemical modification by certain
    organophosphorus (OP) compounds leads to distal axonopathy. Plays a role in the
    signaling mechanism between neurons and glia that regulates glia wrapping during
    development of the adult brain. Essential for membrane lipid homeostasis and cell
    survival in both neurons and glia of the adult brain.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9U969
  source_id: Q9U969
