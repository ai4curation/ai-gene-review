      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 5
    overall_notes: 'Correct and compact: phosphatidylcholine hydrolase that binds
      and inhibits PKA-C3; loss causes neuronal and glial degeneration.'
- source: Alliance_Automated
  text: Enables cAMP-dependent protein kinase inhibitor activity; carboxylic ester
    hydrolase activity; and glycerophospholipase activity. Involved in endoplasmic
    reticulum membrane organization; ensheathment of neurons; and phosphatidylcholine
    metabolic process. Located in plasma membrane. Is active in endoplasmic reticulum
    membrane. Is expressed in CNS glial cell; adult brain; adult head; and cell body
    rind of adult lamina. Used to study blindness; cerebellar ataxia; hereditary spastic
    paraplegia; and neurodegenerative disease. Human ortholog(s) of this gene implicated
    in Boucher-Neuhauser syndrome; Laurence-Moon syndrome; Oliver-McFarlane syndrome;
    and hereditary spastic paraplegia 39. Orthologous to several human genes including
    PNPLA6 (patatin like domain 6, lysophospholipase).
