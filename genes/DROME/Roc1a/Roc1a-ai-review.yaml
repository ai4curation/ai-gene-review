id: Q9W5E1
gene_symbol: Roc1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Roc1a (RING-box protein 1A; Rbx1/Hrt1 ortholog) is a small RING-H2 zinc-finger protein that
  forms the catalytic module of Drosophila cullin-RING ubiquitin ligases. Its N-terminal strand forms
  an intermolecular beta-sheet with the cullin C-terminal domain, letting it bind Cul1, Cul2, Cul3 and
  Cul4, and its RING-H2 domain binds ubiquitin-charged E2 enzymes (such as UbcD1/Effete) and promotes
  polyubiquitin transfer; purified Roc1a supports E2-dependent polyubiquitin chain formation even without
  a cullin. As part of SCF (SkpA-Cul1-F-box) complexes it is required for proteolytic processing of Cubitus
  interruptus, Armadillo destruction and dendrite pruning, and as part of Cul2-EloB/C complexes it acts
  with Vhl to ubiquitinate HIF-alpha (Sima). Roc1a is essential for cell proliferation and viability and
  is not functionally interchangeable with its paralogs Roc1b and Roc2. It localizes to the nucleus and
  cytoplasm.
