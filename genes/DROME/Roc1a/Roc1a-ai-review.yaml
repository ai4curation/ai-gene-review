suggested_questions:
- question: Does Roc1a, like human RBX1, act as the NEDD8 E3 for fly cullins in vivo, and is this distinct
    from Roc1b in testis?
- question: Why can a Roc1a chimera carrying the Roc1b RING bind the same cullins and act as an E3 in
    vitro yet fail to rescue Roc1a lethality?
suggested_experiments:
- hypothesis: Roc1a is required for Cul1 neddylation in vivo.
  description: Measure neddylated versus unneddylated Cul1, Cul2 and Cul3 in Roc1a mutant clones or RNAi-depleted
    S2 cells, and rescue with RING-dead Roc1a.
