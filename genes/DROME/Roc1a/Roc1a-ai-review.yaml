core_functions:
- description: 'Roc1a is the catalytic RING-H2 subunit of cullin-RING ligases: it binds the cullin C-terminus
    and recruits ubiquitin-charged E2 (UbcD1/Effete), directly promoting polyubiquitin transfer to substrates
    held by SCF (Slimb, other F-box proteins) and Cul2-EloB/C-Vhl receptor modules.'
  molecular_function:
