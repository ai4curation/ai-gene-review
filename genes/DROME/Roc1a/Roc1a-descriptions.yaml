- source: Alliance_Imported
  text: Regulator of cullins 1a (Roc1a) encodes a C2H2 type zinc finger protein and
    component of several Cullin-Ring E3 ubiquitin ligase complexes. It binds directly
    to the Cullin subunit within the CRL complex and functions to recruit ubiquitin-charged
    E2 proteins.
