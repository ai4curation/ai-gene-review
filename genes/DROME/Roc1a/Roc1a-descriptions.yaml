- source: Alliance_Automated
  text: Enables cullin family protein binding activity and ubiquitin protein ligase
    activity. Involved in several processes, including negative regulation of signal
    transduction; positive regulation of neuron remodeling; and positive regulation
    of proteasomal ubiquitin-dependent protein catabolic process. Located in nucleus.
    Part of cullin-RING ubiquitin ligase complex. Is expressed in wing disc. Orthologous
    to human RBX1 (ring-box 1).
