descriptions:
- source: UniProt
  text: Core component of multiple SCF (SKP1-CUL1-F-box protein) E3 ubiquitin-protein
    ligase complexes which mediate the ubiquitination of proteins involved in cell
    cycle progression, signal transduction and transcription. Through the RING-type
    zinc finger, seems to recruit the E2 ubiquitination enzyme to the complex and
    brings it into close proximity to the substrate. Required for the specific SCF-dependent
    proteolysis of CI, but not that of ARM, suggesting that it also participates in
    the selection of substrates inside the SCF complex (PubMed:12062088). During early
    metamorphosis, part of the SCF-slmb complex that negatively regulates the InR/PI3K/TOR
    pathway to activate the pruning of unnecessary larval ddaC dendrites and mushroom
    body axons (PubMed:24068890). The SCF-slmb complex also regulates asymmetrical
    division of neuroblasts and inhibits ectopic neuroblast formation partly through
    SAK and Akt1 (PubMed:24413555). Also part of an SCF complex required for caspase
    activation during sperm differentiation (Probable).
  source_type: curated
