  label: Drosophila melanogaster
description: 'dorsal (dl) encodes a Rel/NF-kappaB family transcription factor with an N-terminal Rel homology
  domain (DNA binding and dimerization) and a C-terminal transactivation region. Maternally supplied Dorsal
  is held in the cytoplasm by the IkappaB homologue Cactus; ventral activation of the Toll receptor by
  the cytokine Spaetzle, relayed through Myd88, Tube and the kinase Pelle, triggers Cactus degradation
  and Dorsal nuclear import. The resulting ventral-to-dorsal nuclear gradient acts as the morphogen that
  specifies dorsoventral cell fates in the blastoderm embryo: Dorsal binds kappaB-like sites to activate
  ventral and lateral genes (twist, snail, sog) and, together with Groucho-recruiting cofactors at ventral
  repression regions, to repress dorsal genes (zen, dpp). After embryogenesis Dorsal acts with the paralogue
  Dif downstream of Toll in the larval fat body to induce antimicrobial peptides such as drosomycin, and
  in hemocytes to sustain blood cell number and differentiation. It forms homodimers and heterodimers
  with Dif and Relish. An alternative isoform (Dorsal B) is concentrated with Cactus at the postsynaptic
  neuromuscular junction, where it does not enter nuclei.'
