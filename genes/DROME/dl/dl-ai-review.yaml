  review:
    summary: IBA canonical NF-kappaB signal transduction.
    action: KEEP_AS_NON_CORE
    reason: GO:0007249 is defined as the IKK-dependent NF-kappaB cascade. Dorsal is released by signal-dependent
      degradation of its IkappaB, Cactus, which is the conserved core of that cassette; however, in the
      Drosophila Toll branch Cactus degradation does not require the fly IKKbeta homologue ird5, which
      is dedicated to Relish/Imd signalling. The annotation is broadly homologous but the IKK clause of
      the definition is not met; Toll signaling pathway (GO:0008063) is the accurate process term.
    additional_reference_ids:
    - PMID:11156609
    supported_by:
    - reference_id: PMID:11156609
      supporting_text: ird5/DmIkk β homozygous mutant females are fertile, demonstrating that this gene
        is not required for degradation of Cactus during dorsal-ventral patterning in the embryo.
    - reference_id: PMID:9025065
      supporting_text: As in the case for I kappa B and NF-kappa B, Cactus inhibits Dorsal by retaining
        it in the cytoplasm.
