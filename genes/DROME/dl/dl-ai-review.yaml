suggested_questions:
- question: Should the Drosophila Toll-Cactus-Dorsal/Dif branch be annotated to canonical NF-kappaB signal
    transduction (GO:0007249), whose definition requires IKK, given that Cactus degradation in this branch
    is ird5/IKKbeta-independent and the Cactus kinase is not firmly established?
- question: Is the non-canonical NF-kappaB IBA (GO:0038061) at the Rel-family PANTHER node intended to
    reach class II Rel proteins of insects, which lack a processable p100-like precursor and NIK?
- question: What target genes distinguish Dorsal homodimers from Dorsal-Dif and Dorsal-Relish heterodimers
    in the larval fat body and hemocytes?
- question: Does the Dorsal B isoform at the neuromuscular junction have any activity beyond stabilizing
    Cactus?
suggested_experiments:
- description: Genome-wide ChIP-seq/CUT&RUN of Dorsal in larval fat body before and after infection, compared
    with Dif, to define shared and paralogue-specific immune targets.
- description: Isoform-specific knockout of Dorsal B to test its role at the neuromuscular junction independently
    of Dorsal A/C.
- description: Identify the kinase that phosphorylates Cactus downstream of Pelle in the embryo, to resolve
    whether any IKK-like activity is involved.
