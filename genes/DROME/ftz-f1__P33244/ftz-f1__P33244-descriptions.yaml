descriptions:
- source: UniProt
  text: Acts as a cofactor to fushi tarazu (ftz) (PubMed:9020363, PubMed:9020364).
    Facilitates the binding of ftz to DNA (PubMed:9020363, PubMed:9020364). Binds
    the sequence element 5'-YCYYGGYCR-3' in the zebra element of ftz (PubMed:9020363,
    PubMed:9020364). Probably functions as a nuclear receptor for a yet unknown ligand
    (PubMed:23737522, PubMed:9020363, PubMed:9020364). In contrast to vertebrate homologs,
    not activated by phospholipids (PubMed:23737522).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33244
  source_id: P33244
