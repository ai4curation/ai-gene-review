    - rubric: specificity
      score: 4
    overall_notes: 'Correct and cited: cofactor of Ftz binding the zebra element,
      nuclear receptor for an unknown ligand, not activated by phospholipids. Omits
      the betaFTZ-F1 ecdysone competence role.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific;
    RNA polymerase II-specific DNA-binding transcription factor binding activity;
    and transcription cis-regulatory region binding activity. Involved in several
    processes, including instar larval or pupal development; juvenile hormone mediated
    signaling pathway; and nervous system development. Located in nucleus. Is expressed
    in several structures, including appendage; follicle cell; gland; gut section;
    and ring gland. Human ortholog(s) of this gene implicated in 46,XX sex reversal
    4; 46,XY sex reversal 3; Zellweger syndrome; primary ovarian insufficiency 7;
    and spermatogenic failure 8. Orthologous to several human genes including NR5A1
    (nuclear receptor subfamily 5 group A member 1).
  source_type: automated
