proposed_new_terms: []
suggested_questions:
- question: Does any endogenous small molecule regulate FTZ-F1 activity in vivo, or is the
    ligand-binding-type domain purely a coactivator-docking module? FTZ-F1 does not bind
    phospholipids, and mammalian orthologs rescue fly mutants.
- question: Which betaFTZ-F1 targets in the prepupal ecdysone response are direct
    (FTZ-F1 bound at F1 response elements) and which are indirect through BR-C and E93,
    and does FTZ-F1 act through cofactor recruitment at early-gene promoters as it does
    with Ftz?
- question: Is the role of FTZ-F1 in juvenile hormone activation of E75A, shown in S2
    cells, also seen in vivo, and does it depend on GCE in larval tissues?
suggested_experiments:
- description: Genome-wide ChIP-seq or CUT&RUN for betaFTZ-F1 in mid-prepupal salivary
    glands and fat body, combined with RNA-seq of tissue-specific ftz-f1 knockdowns
    across the late-prepupal ecdysone pulse.
  hypothesis: betaFTZ-F1 directly occupies F1 response elements in the enhancers of
    stage-specific ecdysone-inducible genes (E93, BR-C, E74, E75, shade) before the
    prepupal pulse, defining the gene set whose induction depends on FTZ-F1-mediated
    competence.
- description: Mutate the FTZ-F1 ligand-binding pocket and the AF-2 helix separately in
    the endogenous gene (CRISPR knock-in) and test rescue of segmentation and
    metamorphosis phenotypes.
  hypothesis: AF-2-mediated coactivator binding, but not pocket occupancy by a ligand, is
    required for FTZ-F1 function in vivo.
