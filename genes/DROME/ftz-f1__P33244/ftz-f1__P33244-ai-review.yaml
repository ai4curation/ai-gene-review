- term:
    id: GO:0004879
    label: nuclear receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR016355
  review:
    summary: InterPro NR5-like family mapping to nuclear receptor activity, a
      DNA-binding transcription factor activity defined as regulated by ligand binding.
    action: MODIFY
    reason: FTZ-F1 is structurally a nuclear receptor, but the GO term requires regulation
      by ligand binding, and no ligand is known. Drosophila FTZ-F1 does not bind
      phospholipids (unlike human LRH-1), and its activity in vivo is explained by
      coactivator (Ftz) binding to the AF-2 region. Rescue of fly mutants by mammalian
      orthologs argues against specific activating ligands. The experimentally supported
      activity is ligand-independent DNA-binding transcription activation, so
      GO:0001228 is the safer term. Phospholipid or other ligand regulation of human
      LRH-1 must not be transferred to FTZ-F1.
    proposed_replacement_terms:
    - id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    supported_by:
    - reference_id: PMID:23737522
      supporting_text: We also show by mass spectrometry and biochemical assays that
        FTZ-f1 is incapable of PL binding.
    - reference_id: PMID:23340581
      supporting_text: The functional equivalence of ftz-f1 orthologs in these sensitive
        in vivo assays argues against specific activating ligands for NR5A family
        members.
