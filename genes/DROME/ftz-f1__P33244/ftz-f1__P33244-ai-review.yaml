    action: MODIFY
    reason: The fly evidence behind the seed is juvenile hormone signaling, in which
      FTZ-F1 is bound at E75A enhancers, interacts with MET and GCE, and is required for
      JH activation of E75A. That specific descendant (GO:0035626) is already carried by
      the gene. FTZ-F1 is an orphan receptor and does not itself detect a hormone; its
      role in this pathway is as the DNA-bound factor that recruits the JH receptor
      components.
