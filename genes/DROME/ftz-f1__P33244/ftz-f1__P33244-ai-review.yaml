id: P33244
gene_symbol: ftz-f1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  ftz-f1 encodes FTZ-F1 (NR5A3), the Drosophila member of the NR5A subfamily of nuclear
  receptors. It binds DNA as a monomer through a C4 zinc-finger DNA-binding domain plus
  the adjacent FTZ-F1 box, recognising the extended half-site YCAAGGYCR, and activates
  RNA polymerase II transcription from nuclear sites. Two isoforms with different
  N-termini share the DNA-binding and ligand-binding-type domains. Maternally supplied
  alphaFTZ-F1 (isoform B) is an obligatory cofactor of the homeodomain pair-rule protein
  Fushi tarazu (Ftz): Ftz binds the FTZ-F1 AF-2 helix through an LXXLL nuclear-receptor
  box, the two proteins bind DNA cooperatively at composite sites, and together they
  activate Ftz target genes such as engrailed, drumstick and no ocelli in alternate
  parasegments. Loss of maternal FTZ-F1 gives ftz-like pair-rule defects. The
  betaFTZ-F1 isoform (isoform A) is expressed briefly before each larval molt and in
  mid-prepupae, where it gives the stage-specific competence for the late-prepupal
  ecdysone response, enhancing induction of BR-C, E74, E75 and E93. It is needed for the
  prepupal-pupal transition (head eversion, leg elongation, salivary gland cell death),
  for molting, for gamma-neuron remodeling in the mushroom body (via EcR-B1), for
  pupation timing in the fat body (via the ecdysone 20-monooxygenase gene shade), and for
  ecdysteroid production in the prothoracic gland, where it regulates scavenger-receptor
  genes needed for lipid uptake. In S2 cells FTZ-F1 binds enhancers of E75A, interacts
  with the bHLH-PAS juvenile hormone receptor candidates MET and GCE, and is required for
  juvenile hormone activation of E75A. No activating ligand is known: FTZ-F1 does not bind
  phospholipids, and its ligand-binding domain acts as a coactivator-binding module.
