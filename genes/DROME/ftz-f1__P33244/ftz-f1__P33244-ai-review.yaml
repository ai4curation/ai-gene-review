core_functions:
- description: >-
    Monomeric sequence-specific DNA-binding transcription activator. The C4 zinc-finger
    DNA-binding domain and the adjacent FTZ-F1 box together recognise the YCAAGGYCR
    element in cis-regulatory regions of RNA polymerase II genes and activate them.
    Shown directly for both alpha and beta isoforms in Drosophila. No activating ligand
    is known.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8164672
    supporting_text: Cotransfection assays in mammalian cell culture indicate that both
      receptors contribute to the net transcriptional activity of a reporter gene through
