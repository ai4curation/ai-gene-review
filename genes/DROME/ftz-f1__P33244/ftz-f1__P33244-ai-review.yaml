- term:
    id: GO:0007366
    label: periodic partitioning by pair rule gene
  evidence_type: IMP
  original_reference_id: PMID:9020364
  review:
    summary: Proposed new annotation. Embryos lacking maternal Ftz-F1 show ftz-like
      pair-rule cuticle defects because Ftz is expressed but fails to activate its
      targets; maternal alphaFTZ-F1 is an obligatory Ftz cofactor.
    action: NEW
    reason: >-
      Participation test: FTZ-F1 does part of the work of the pair-rule step. It is a
      DNA-bound co-activator in the Ftz/FTZ-F1 complex that directly activates Ftz target
      genes (engrailed, drm) at composite binding sites, and its binding sites are needed
      for stripe enhancer activity. It is not a substrate or an upstream requirement only.
      It plays the same role at these enhancers as Ftz, the pair-rule gene product. The
      evidence comes from two independent Nature papers (maternal germline clones and
      biochemistry) and later target-gene work, so this is not a lone screen hit. The
      process is not covered by any existing row. Comparator check: Ftz itself carries
      pair-rule segmentation terms. The PAINT node did not propagate a segmentation term,
      which is expected because the role is lineage-specific to insects.
    supported_by:
    - reference_id: PMID:9020364
      supporting_text: Embryos lacking Ftz-F1 display ftz-like pair-rule cuticular
        defects.
    - reference_id: PMID:9020363
      supporting_text: Here we show that the orphan nuclear receptor alphaFtz-F1 (ref. 3),
        which is deposited in the egg during oogenesis, is an obligatory cofactor for Ftz.
    - reference_id: PMID:19679121
      supporting_text: The drm genomic region harbors two separate seven-stripe
        enhancers, identified by virtue of predicted Ftz-F1 binding sites, and these
        sites are necessary for stripe expression in vivo.
