- source: Alliance_Automated
  text: Enables FAD binding activity and blue light photoreceptor activity. Involved
    in several processes, including detection of light stimulus; entrainment of circadian
    clock by photoperiod; and regulation of gene expression. Located in cytosol and
    nucleus. Is expressed in several structures, including brain; inner photoreceptor
    cell; organism subdivision; pacemaker neurons; and synaptic neuropil domain.
