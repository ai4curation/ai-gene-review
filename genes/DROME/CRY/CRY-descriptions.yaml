descriptions:
- source: UniProt
  text: Blue light-dependent regulator that is the input of the circadian feedback
    loop (PubMed:10063806, PubMed:10233998, PubMed:10417378, PubMed:16527739, PubMed:17298948,
    PubMed:18597555, PubMed:36994075, PubMed:9845369). Has no photolyase activity
    for cyclobutane pyrimidine dimers or 6-4 photoproducts (PubMed:10063806). Regulation
    of expression by light suggests a role in photoreception for locomotor activity
    rhythms (PubMed:10063806, PubMed:10233998, PubMed:9845369). Functions, together
    with per, as a transcriptional repressor required for the oscillation of peripheral
    circadian clocks and for the correct specification of clock cells (PubMed:10417378,
    PubMed:16527739, PubMed:36994075, PubMed:9845370). Genes directly activated by
    the transcription factors Clock (Clk) and cycle (cyc) are repressed by cry (PubMed:10417378,
    PubMed:16527739). Necessary for light-dependent magnetosensitivity, an intact
    circadian system is not required for the magnetoreception mechanism to operate
    (PubMed:18641630). Required for both the naive and trained responses to magnetic
    field, consistent with the notion that cry is in the input pathway of magnetic
    sensing (PubMed:18641630).
