id: O77059
gene_symbol: CRY
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Drosophila cryptochrome, the FAD-binding blue-light photoreceptor
  that entrains the circadian clock. This is one of the strongest results in the cohort: ranks 1 and
  2 are exact GOA matches to unusually specific IMP-supported terms - detection of light stimulus
  involved in magnetoreception, and UV-A/blue light phototransduction - and rank 5 is the review's
  core molecular function, blue light photoreceptor activity. The free-text channel correctly returns
  the type-I cryptochrome description including the negative statement 'Has no photolyase activity'.
  Assessment: 2 correct not novel (CNN), 1 uncertain (UNC).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/DROME/CRY/CRY-uniprot.txt
- genes/DROME/CRY/CRY-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0050980
    label: detection of light stimulus involved in magnetoreception
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 17.95), an exact GOA match with IMP evidence. Magnetoreception is among
      the most specific and least generic things that can be said about Drosophila CRY, and the model
      ranks it first - it is not defaulting to a family-level photoreceptor label. Already annotated,
      so not novel, but this is the retrieval working as intended on a well-characterised protein.
    supported_by:
    - reference_id: file:DROME/CRY/CRY-uniprot.txt
      supporting_text: >-
        Cryptochrome-1
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0009588
    label: UV-A, blue light phototransduction
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 2 (score 17.76), a second exact GOA match. Correct and specific: it names the wavelength
      range and the signalling role, distinguishing type-I insect cryptochrome from the light-independent
      mammalian CRY1/2 repressors that dominate the cryptochrome literature. Already annotated.
    supported_by:
    - reference_id: file:DROME/CRY/CRY-uniprot.txt
      supporting_text: >-
        Belongs to the DNA photolyase class-1 family
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0008062
    label: eclosion rhythm
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 17.69), absent from GOA and a strict descendant of the annotated circadian rhythm.
      Eclosion rhythm is a genuine clock output in Drosophila and CRY contributes light input to the
      clock, so the term is not unreasonable; but CRY's characterised phenotypes are in locomotor
      rhythm and entrainment rather than eclosion, and eclosion rhythms are comparatively robust to
      cry loss. A plausible refinement that a curator would need phenotype evidence to accept; left
      uncertain.
    supported_by:
    - reference_id: file:DROME/CRY/CRY-uniprot.txt
      supporting_text: >-
        Cryptochrome-1
