    overall_notes: 'Correct but narrow: Tgo/Trh heterodimers control breathless and
      Tgo acts in hypoxia. Does not say it is the general ARNT partner of Sim, Ss,
      Sima and Dys.'
- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription activator activity,
    RNA polymerase II-specific; myosin binding activity; and protein heterodimerization
    activity. Involved in several processes, including imaginal disc-derived leg joint
    morphogenesis; nervous system development; and regulation of transcription by
    RNA polymerase II. Located in nucleus. Part of RNA polymerase II transcription
    regulator complex. Is expressed in several structures, including embryonic head
    segment; ganglia; glial cell; presumptive embryonic/larval system; and tracheal
    primordium. Human ortholog(s) of this gene implicated in epilepsy and renal cell
    carcinoma. Orthologous to human ARNT (aryl hydrocarbon receptor nuclear translocator)
    and ARNT2 (aryl hydrocarbon receptor nuclear translocator 2).
  source_type: automated
  url: https://flybase.org/reports/tgo.html
