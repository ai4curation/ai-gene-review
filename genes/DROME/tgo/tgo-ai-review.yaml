id: O15945
gene_symbol: tgo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tango (Tgo) is the Drosophila ortholog of ARNT/HIF-beta, a ubiquitously expressed bHLH-PAS
  transcription factor that serves as the common heterodimerization partner of cell-type-specific class
  I bHLH-PAS proteins. Tgo dimerizes with Single-minded (CNS midline), Trachealess (trachea, salivary
  gland, leg), Dysfusion (tracheal fusion cells, tarsal joints), Spineless (AhR ortholog; antenna, distal
  leg, R7 photoreceptor subtype choice), Sima (HIF-alpha; hypoxia response) and the NXF-like factor, and
  the heterodimers bind CME/NCGTG-type enhancer elements to activate, or in some contexts repress, target
  genes. Partner binding promotes nuclear accumulation of Tgo, which is otherwise largely cytoplasmic.
  Through these partners Tgo is required for CNS midline and tracheal development, leg segment and joint
  formation, glial migration, photoreceptor rhodopsin choice, border cell migration and HIF-dependent
  hypoxic and insulin-induced transcription.
