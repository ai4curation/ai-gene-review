knowledge_gaps:
- gap_statement: Whether CG6836 transports anything, which solute it moves, and whether it needs a
    partner subunit are unknown.
  boundary: CG6836 is placed in the OST-alpha lineage, whose vertebrate members transport bile acids
    and steroid conjugates only as OST-alpha/OST-beta heterodimers. Flies have no recognized OST-beta,
    and insects lack bile acids.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Heterologous expression (Xenopus oocytes or S2 cells), alone and with candidate fly
    single-pass partners, with uptake and efflux assays for steroid conjugates, ecdysteroids and
    eicosanoid-like lipids.
  provenance:
  - reference_id: PMID:20538072
    supporting_text: Alternatively, the invertebrate OSTα orthologue may not require a partner protein or
      may utilize a different partner protein, and OSTβ evolved more recently as a cofactor for OSTα in vertebrate
      species.
suggested_questions:
- question: Does CG6836 reach the plasma membrane on its own, or does it need a fly single-pass partner
    that plays the role of vertebrate OST-beta?
- question: Is CG6836 left out of the PANTHER 19.0 fly classification on purpose, and which PTHR23423
    subfamily would its sequence score into?
- question: Are the substrates ecdysteroid conjugates or other steroid-derived solutes, the class proposed
    as the ancestral cargo of the OST-alpha lineage?
suggested_experiments:
- description: Tag endogenous CG6836 by CRISPR knock-in. Determine its tissue distribution and apical
    or basolateral polarity in epithelia such as the midgut and Malpighian tubules. Use surface
    biotinylation and PNGase F to test the predicted extracellular glycosylated N-terminus.
- description: Express CG6836 in Xenopus oocytes, alone and together with candidate fly partners. Measure
    uptake and efflux of radiolabelled steroid conjugates (estrone-3-sulfate, taurocholate as a positive
    control set by the vertebrate transporter) and of ecdysteroid conjugates.
