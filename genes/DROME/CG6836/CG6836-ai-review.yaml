- id: PMID:20538072
  title: 'Getting the mOST from OST: Role of organic solute transporter, OSTalpha-OSTbeta, in bile acid
    and steroid metabolism.'
  findings:
  - statement: Ensembl Compara lists fly FBgn0036834 (CG6836) among putative OST-alpha orthologs. Because
      invertebrates lack bile acids, the ancestral OST-alpha substrates are proposed to be other molecules,
      such as steroid hormones or eicosanoids.
    supporting_text: Since bile acids (salts) have not been detected in invertebrate animals [34], these
      results suggest that the original function of OSTα was to transport non-bile acid (salt) substrates
      such as steroid hormones or eicosanoids.
  - statement: An invertebrate OST-alpha may not need OST-beta, or may use a different partner.
    supporting_text: Alternatively, the invertebrate OSTα orthologue may not require a partner protein or
      may utilize a different partner protein, and OSTβ evolved more recently as a cofactor for OSTα in vertebrate
      species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: DOI 10.1016/j.bbalip.2010.06.002 resolved to this PMID via PubMed. Full text was cached
      from PMC. It is the only literature that names FBgn0036834, and it does so as a putative ortholog
      in a sequence-analysis section. It contains no experimental data on the fly protein.
- id: PMID:23506901
  title: 'The heteromeric organic solute transporter, OSTα-OSTβ/SLC51: a transporter for steroid-derived
    molecules.'
  findings:
  - statement: Vertebrate OST-alpha is a seven-TM subunit. It must heterodimerize with OST-beta for stability
      and for delivery to the plasma membrane. The complex works by facilitated diffusion.
    supporting_text: The transporter functions via a facilitated
      diffusion mechanism, and can mediate either efflux or uptake depending on the
      electrochemical gradient of its substrates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: DOI 10.1016/j.mam.2012.11.005 resolved to this PMID via PubMed. It is a vertebrate-only
      review, used as comparative context and for the OST-beta partner caveat. It does not mention the fly
      protein.
- id: file:DROME/CG6836/CG6836-bioinformatics/RESULTS.md
  title: CG6836 family placement analysis (MAFFT alignment and NJ tree of PTHR23423 members)
  findings:
  - statement: CG6836 groups with vertebrate SLC51A, inside an OST-alpha-like clade that also contains
      the worm osta proteins. It falls outside the TMEM184 and Hfl1-like proteins. Pairwise identity is
      low (15-21%) and the tree has no bootstrap.
    supporting_text: In the NJ tree CG6836 is sister to the vertebrate SLC51A clade (human, mouse, zebrafish).
