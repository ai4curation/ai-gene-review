taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG6836 is a seven-pass OST-alpha-family membrane protein with a probable transport role.
  Its topology and evolutionary placement support membrane integration and a likely cell-surface location.
  The transported organic solute, partner requirements and physiological role in Drosophila remain unresolved;
  mammalian bile-acid transport specificity cannot be assumed.
