  review:
    action: ACCEPT
    summary: Plasma membrane is a reasonable OST-alpha ortholog inference, though it has not been tested
      in the fly.
    reason: UniProt curators assign "Cell membrane" by similarity (ECO:0000250), and this IEA row maps that
      assignment to GO. The re-review tree places CG6836 in the OST-alpha (SLC51A) lineage, and Dawson et
      al. list FBgn0036834 among putative OST-alpha orthologs. Vertebrate OST-alpha works at the
      basolateral plasma membrane. The predicted topology (glycosylated extracellular N-terminus, seven
      transmembrane helices) is what a cell-surface protein would have. One caveat is kept explicit.
      Vertebrate OST-alpha needs OST-beta to reach the plasma membrane, and no fly OST-beta is known. So
      the location is a homology inference, not a measured fact. It is the most specific location the
      evidence supports, and no evidence points to another compartment.
