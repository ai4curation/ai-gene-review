taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG6836 encodes a 328-residue multi-pass membrane protein of the OST-alpha/TMEM184
  family (Pfam Solute_trans_a), with seven predicted transmembrane helices, a predicted extracellular
  N-terminus carrying several N-glycosylation sequons and a cytoplasmic C-terminus. Phylogenetic analysis
  and Ensembl Compara place it in the OST-alpha (SLC51A) lineage rather than with the TMEM184 or Hfl1
  proteins. It is therefore the fly counterpart of the vertebrate OST-alpha subunit, which pairs with
  OST-beta to form a facilitated-diffusion transporter for bile acids and steroid conjugates. No
  experimental work has been done on the fly protein. Its substrate, its partner requirement (no fly
  OST-beta is known), its subcellular location and its physiological role are all undetermined. Insects
  lack the vertebrate enterohepatic bile-acid circulation, and the ancestral substrates of the
  OST-alpha lineage are thought to be other steroid-like or lipid-derived solutes.
