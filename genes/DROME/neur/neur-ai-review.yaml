core_functions:
- description: >-
    RING E3 ubiquitin ligase that ubiquitinates the intracellular domains of the DSL Notch
    ligands Delta and Serrate in signal-sending cells, promoting their endocytosis and thereby
    their capacity to activate Notch in neighbouring cells.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
