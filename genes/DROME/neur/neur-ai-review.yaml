- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: IDA
  original_reference_id: PMID:22162135
  qualifier: involved_in
  review:
    summary: >-
      Neur catalyses multi-/polyubiquitylation of the Delta intracellular domain in a cell-based
      assay.
    action: ACCEPT
    reason: >-
      IDA from a direct ubiquitylation assay on the Neur substrate Delta; the product was
      multi- or polyubiquitylated Dl. This is the process realised by Neur's E3 activity.
      Note that the signalling-relevant modification may be multi-monoubiquitylation; the
      term is acceptable as the paper reports high-molecular-mass poly/multi-ubiquitin species.
    supported_by:
    - reference_id: PMID:22162135
      supporting_text: >-
        Using a cell-based assay, we detected ubiquitylation of Dl by both Neur and Mib1.
    - reference_id: PMID:22162135
      supporting_text: >-
        This shows that these E3 ligases catalyze preferentially the multi- or polyubiquitylation
        of Dl.
- term:
