- term:
    id: GO:0070086
    label: ubiquitin-dependent endocytosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:3643092
  - PANTHER:PTN000276953
  review:
    summary: >-
      IBA (PTN000276953): Neuralized family proteins drive ubiquitin-dependent endocytosis
      of their substrates.
    action: ACCEPT
    reason: >-
      Neur ubiquitinates Delta and thereby routes it into an Epsin-dependent endocytic pathway;
      its phosphoinositide-binding motif is additionally required for Delta endocytosis downstream
      of ubiquitination, so Neur does work in this process.
    supported_by:
    - reference_id: PMID:11740940
      supporting_text: >-
        Collectively, our data indicate that Neur is a ubiquitin ligase that positively regulates
        the N pathway by promoting the endocytosis and degradation of Dl.
    - reference_id: PMID:18061562
      supporting_text: >-
        We show that interactions between phosphoinositides and Neuralized contribute to the
        membrane localization of Neuralized in the absence of Delta, and that the phosphoinositide-binding
        motif is required for Neuralized to endocytose Delta downstream of Delta ubiquitination.
