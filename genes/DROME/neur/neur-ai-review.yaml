    label: plasma membrane
  supported_by:
  - reference_id: PMID:11740940
    supporting_text: >-
      In this report, we present genetic and biochemical evidence that Neur is a RING-type,
      E3 ubiquitin ligase.
  - reference_id: PMID:22162135
    supporting_text: >-
      Using a cell-based assay, we detected ubiquitylation of Dl by both Neur and Mib1.
  - reference_id: PMID:11740940
    supporting_text: >-
      Collectively, our data indicate that Neur is a ubiquitin ligase that positively regulates
      the N pathway by promoting the endocytosis and degradation of Dl.
  - reference_id: PMID:16093323
    supporting_text: >-
      Simultaneous absence of neuralized and mib1 completely abolishes Notch signaling in
      both aforementioned contexts, making it likely that ubiquitination is a prerequisite
      for Delta/Serrate signaling.
  - reference_id: file:DROME/neur/neur-deep-research-falcon.md
    supporting_text: >-
      The primary substrates of Neuralized are the Delta-Serrate-LAG2 (DSL) family Notch ligands
