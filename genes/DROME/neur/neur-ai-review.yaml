- term:
    id: GO:0008593
    label: regulation of Notch signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0002932
  - PANTHER:PTN000276953
  - UniProtKB:O76050
  review:
    summary: >-
      IBA (PTN000276953) for regulation of Notch signaling in the Neuralized family.
    action: ACCEPT
    reason: >-
      Neur is a positive regulator of Notch signalling via DSL ligand ubiquitination. The
      IBA is sound; GO:0045747 (positive) is the more precise term, supported experimentally.
