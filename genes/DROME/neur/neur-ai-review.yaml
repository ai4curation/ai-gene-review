id: P29503
gene_symbol: neur
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Neuralized (Neur) is a membrane-associated RING-type E3 ubiquitin ligase that activates
  the Notch ligands Delta and Serrate in signal-sending cells. Its NHR1 (neuralized homology
  repeat) domain docks onto an NXXN motif in the Delta intracellular domain, and its C-terminal
  RING domain transfers ubiquitin to lysines of the ligand intracellular domain, routing the
  ligand into Epsin-dependent endocytosis that is required for productive trans-activation
  of Notch. A basic phosphoinositide-binding motif targets Neur to the plasma membrane. Neur
  is expressed in neural precursors (SOPs), segregates asymmetrically into pIIb during SOP
  division, and is the dominant ligand E3 for lateral inhibition and SOP lineage decisions,
  whereas the structurally unrelated Mind bomb 1 acts in most other Notch contexts; Neur can
  functionally substitute for Mib1. Neur activity is antagonised by Bearded-family proteins,
  which compete with Delta for NHR1 binding. Neur also targets Stardust isoforms to promote
  Crumbs endocytosis.
