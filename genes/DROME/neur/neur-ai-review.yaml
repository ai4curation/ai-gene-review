- term:
    id: GO:0005768
    label: endosome
  evidence_type: IDA
  original_reference_id: PMID:17065551
  qualifier: colocalizes_with
  review:
    summary: Neur colocalizes with Hrs-positive endosomes in salivary gland cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Colocalization reflects Neur trafficking with its endocytosed substrate Delta; plasma
      membrane is the primary site of action.
    supported_by:
    - reference_id: PMID:17065551
      supporting_text: >-
        As a control, we analyzed the degree of colocalization between Hrs and GFP and found
        little colocalization (quantified in Figure 3 C and data not shown), suggesting the
        bona fide presence of V5-Neur PA in Hrs-positive endosomes.
