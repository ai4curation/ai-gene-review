- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      Nuclear localization from UniProt subcellular location, which is itself flagged by curator
      inference (ECO:0000305).
    action: REMOVE
    reason: >-
      All experimental localization data place Neur at the plasma membrane (via its phosphoinositide-binding
      motif), apical cortex, cytoplasm and endosomes, where it ubiquitinates DSL ligands.
      No experimental support for nuclear localization is available; the early proposal of
      a nuclear/DNA-binding role predates the characterization of the NHR and RING domains.
      This electronic mapping should not be propagated.
    supported_by:
    - reference_id: PMID:10970873
      supporting_text: >-
        We show that Neu protein is localized primarily at the plasma membrane.
    - reference_id: PMID:18061562
      supporting_text: >-
        We show that interactions between phosphoinositides and Neuralized contribute to the
        membrane localization of Neuralized in the absence of Delta, and that the phosphoinositide-binding
        motif is required for Neuralized to endocytose Delta downstream of Delta ubiquitination.
    - reference_id: PMID:28400441
      supporting_text: >-
        Neuralized (Neur) is a conserved membrane-associated E3 ubiquitin ligase
- term:
