suggested_questions:
- question: >-
    Is multi-monoubiquitylation or K63-linked polyubiquitylation of the Delta ICD the signalling-relevant
    Neur product in vivo?
- question: >-
    How does Neur activate Delta in the ubiquitylation-independent mode reported for some
    lateral inhibition events?
suggested_experiments:
- description: >-
    Ubiquitin-linkage-specific mass spectrometry of Delta ICD from SOPs expressing endogenous
    Neur versus Mib1, with lysine-less Delta rescue.
