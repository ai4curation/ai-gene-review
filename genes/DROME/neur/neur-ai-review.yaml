  evidence_type: IGI
  original_reference_id: PMID:15760269
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0263601
  review:
    summary: >-
      Neur positively regulates Notch signalling by ubiquitinating and promoting endocytosis
      of DSL ligands in signal-sending cells.
    action: ACCEPT
    reason: >-
      Central, repeatedly demonstrated biological role (IMP/IGI with Dl, Ser, mib1). Neur
      acts in the signal-sending cell to activate ligand.
    supported_by:
    - reference_id: PMID:11740940
      supporting_text: >-
        Collectively, our data indicate that Neur is a ubiquitin ligase that positively regulates
        the N pathway by promoting the endocytosis and degradation of Dl.
    - reference_id: PMID:16093323
      supporting_text: >-
        Simultaneous absence of neuralized and mib1 completely abolishes Notch signaling in
        both aforementioned contexts, making it likely that ubiquitination is a prerequisite
        for Delta/Serrate signaling.
    - reference_id: PMID:15829515
      supporting_text: >-
        We conclude that ubiquitination of Delta and Serrate by Neuralized and D-mib is an
        obligate feature of DSL ligand activation throughout Drosophila development.
    - reference_id: PMID:15930117
      supporting_text: >-
        Here, we present evidence that the Drosophila ortholog of Mib (Dmib) is required for
        ubiquitination and signaling activity of DSL ligands in cells that normally do not
        express Neur, and can be functionally replaced by ectopically expressed Neur.
    - reference_id: PMID:16459303
      supporting_text: >-
        In Drosophila, the E3 ubiquitin ligase Neuralized (Neur) promotes the endocytosis
        and signaling activity of the ligand Delta (Dl).
    - reference_id: PMID:15760269
      supporting_text: >-
        We conclude that D-mib and Neur are two structurally distinct proteins that have similar
        molecular activities but distinct developmental functions in Drosophila.
    - reference_id: PMID:28960177
      supporting_text: >-
        Neur, which is needed for these processes, was shown to be able to activate Dl in
        an ubi-independent manner.
