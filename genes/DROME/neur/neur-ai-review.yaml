- term:
    id: GO:0007399
    label: nervous system development
  evidence_type: IMP
  original_reference_id: PMID:11180964
  qualifier: involved_in
  review:
    summary: neur loss-of-function causes neurogenic phenotypes.
    action: KEEP_AS_NON_CORE
    reason: >-
      Very general developmental process; neur contributes through Notch-mediated lateral
      inhibition. Retained as non-core.
    supported_by:
    - reference_id: PMID:11180964
      supporting_text: >-
        We find that neu is required cell-autonomously for lateral inhibition during peripheral
        neurogenesis and for multiple asymmetric cell divisions in the sensory lineage.
- term:
    id: GO:0007400
    label: neuroblast fate determination
  evidence_type: IMP
  original_reference_id: PMID:28306050
  qualifier: involved_in
  review:
    summary: >-
      neur mutants show excess sensory precursors, reflecting failure of Notch-mediated lateral
      inhibition.
    action: KEEP_AS_NON_CORE
    reason: Downstream developmental consequence of ligand activation; non-core.
    supported_by:
    - reference_id: PMID:28306050
      supporting_text: >-
        We have found that the loss of function of all the seven neurogenic loci that were
        tested causes an increase in replicating sensory precursor cells, consistent with
        the model that these neurogenic genes normally participate in the process of restricting
        the number of neuronal precursors.
