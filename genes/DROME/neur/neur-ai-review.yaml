- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16459303
  qualifier: enables
  supporting_entities:
  - FB:FBgn0000216
  review:
    summary: >-
      Neur binds Bearded family proteins (Tom and other BFMs), which inhibit Neur-mediated
      Delta endocytosis.
    action: REMOVE
    reason: >-
      GO:0005515 protein binding is uninformative. The IPI rows from this paper record binding
      of Neur to Bearded-family proteins (BFMs), which are Neur inhibitors that compete with
      Delta for the Neur NHR1 substrate-docking surface. The interaction is real and biologically
      important, but no more informative molecular function of Neur is captured by binding
      its inhibitor; removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:16459303
      supporting_text: >-
        In this study, we identify proteins of the Bearded (Brd) family as interactors of
        Neur.
    - reference_id: PMID:19580805
      supporting_text: >-
        we provide evidence that members of the Bearded family of proteins (BFMs) inhibit
        Dl activation in non-SOP cells by binding to Neur and preventing it from interacting
        with Dl.
