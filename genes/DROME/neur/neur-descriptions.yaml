descriptions:
- source: UniProt
  text: Probable E3 ubiquitin-protein ligase involved in regulation of Notch signaling
    (PubMed:15760269, PubMed:15829515). May ubiquitinate the intracellular domains
    of Notch ligands Dl/delta and Ser/serrate, leading to their endocytosis and degradation
    (PubMed:15760269, PubMed:15829515). Involved in neurogenesis. Interacts with other
    neurogenic proteins in the specification of the neuroblast versus epidermoblast
    cell fate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P29503
  source_id: P29503
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: E3 ligase ubiquitinating Delta and Serrate intracellular
      domains for endocytosis in Notch signalling and neurogenesis. ''Endocytosis
      and degradation'' misses that endocytosis is needed to activate the ligand;
      no epithelial role.'
- source: Alliance_Imported
  text: neuralized (neur) encodes an E3 ubiquitin ligase of the RING family. It is
    part of the Notch signaling pathway, where it is thought to contribute to the
    endocytosis-dependent activation of the ligand. It also has Notch-independent
    functions in epithelial morphogenesis.
  source_type: curated
  url: https://flybase.org/reports/neur.html
  source_id: FB:FBgn0002932
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and compact: RING E3 promoting endocytosis-dependent ligand
      activation, plus Notch-independent epithelial morphogenesis (Stardust/Crumbs).'
- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate binding activity and ubiquitin protein
    ligase activity. Involved in several processes, including cell fate determination;
    long-term memory; and regulation of cell development. Located in perinuclear region
    of cytoplasm and plasma membrane. Colocalizes with endosome. Is expressed in several
    structures, including Kenyon cell; imaginal disc; sense organ; somatic precursor
    cell; and synaptic neuropil subdomain. Used to study intestinal cancer. Orthologous
    to several human genes including NEURL1 (neuralized E3 ubiquitin protein ligase
    1) and NEURL1B (neuralized E3 ubiquitin protein ligase 1B).
  source_type: automated
  url: https://flybase.org/reports/neur.html
  source_id: FB:FBgn0002932
