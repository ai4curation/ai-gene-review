gene_symbol: kek1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Kekkon-1 (Kek1) is a single-pass type-I transmembrane glycoprotein of Drosophila
  melanogaster and the founding member of the Kekkon family. Its ectodomain combines an
  array of leucine-rich repeats (LRRs) with a single immunoglobulin (Ig)-like domain,
  followed by one transmembrane helix and a long, largely disordered cytoplasmic tail. Kek1
  is a dedicated negative-feedback inhibitor of the Drosophila EGF receptor (DER/EGFR); it
  is transcriptionally induced by EGFR activity and its extracellular LRRs bind directly to
  the receptor to form an inactive heterodimeric complex, blocking ligand binding, receptor
  autophosphorylation and downstream ERK activation. Binding and inhibition are separable
  activities: the first two LRRs specify high-affinity EGFR binding, while the
  juxta/transmembrane region is additionally required for inhibition (a bipartite
  mechanism), and the cytoplasmic tail directs apical plasma-membrane localization. This
  feedback attenuation shapes multiple EGFR-dependent developmental decisions, most notably
  patterning of the follicular epithelium and dorsoventral axis during oogenesis, and eye
  development. Kek1 was originally identified together with kek2 as an LRR+Ig cell-surface
  protein expressed in differentiating CNS neurons and in patterned epithelia; single kek1
  deletion produces no overt phenotype, consistent with family redundancy. The
  EGFR-inhibitor role is conserved among dipterans but is absent from vertebrates and
  Caenorhabditis.
