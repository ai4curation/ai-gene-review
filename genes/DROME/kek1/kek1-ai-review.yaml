core_functions:
- description: Kek1 binds directly to the Drosophila EGF receptor (DER/EGFR) through its
    extracellular leucine-rich repeats (chiefly LRR1 and LRR2), forming a heterodimeric
    complex with the receptor.
  molecular_function:
    id: GO:0005154
    label: epidermal growth factor receptor binding
  supported_by:
  - reference_id: PMID:12900463
    supporting_text: the extracellular Leucine-Rich Repeat (LRR) domains of Kek1 are
      critical for its function through direct association with DER
  - reference_id: PMID:15166146
    supporting_text: while the LRRs suffice for EGFR binding
- description: By binding EGFR and forming an inactive complex, Kek1 acts as a direct
    inhibitor of the receptor, blocking growth-factor binding, receptor autophosphorylation
    and downstream ERK activation, thereby providing transcriptionally-induced negative
    feedback on EGFR signaling. Binding (LRRs) and inhibition (juxta/transmembrane region)
    are separable, and the protein acts apically at the plasma membrane.
  molecular_function:
