suggested_questions:
- question: >-
    What is the structural basis of the Kek1-EGFR (DER domain V) interaction, and does the
    Ig domain contribute to binding or specificity beyond the LRRs?
- question: >-
    Does Kek1 have EGFR-independent functions in CNS neurons or at synapses, given its early
    neuronal expression and reported Toll-family interactions not represented in current GOA?
suggested_experiments:
- description: >-
    Cryo-EM or crystallographic structure of the Kek1 ectodomain in complex with the DER
    extracellular region to define the inhibitory interface.
- description: >-
    Quantitative single-molecule or FRET assays to measure how the juxta/transmembrane
    region converts EGFR binding into inhibition (heterodimer formation versus ligand
    exclusion).
