descriptions:
- source: Alliance_Imported
  text: kekkon 1 (kek1) encodes a transmembrane protein that acts in a negative feedback
    loop to modulate the activity of the product of Egfr in a number of tissues, including
    follicle cells and imaginal discs. It also plays a role in axonal outgrowth in
    the central nervous system.
  source_type: curated
