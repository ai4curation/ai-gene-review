- source: Alliance_Automated
  text: Enables epidermal growth factor receptor binding activity and signaling receptor
    inhibitor activity. Involved in negative regulation of epidermal growth factor
    receptor signaling pathway and oogenesis. Located in apical plasma membrane. Is
    expressed in several structures, including cuboidal/columnar epithelium; follicle
    cell; imaginal disc; larval midline neurons; and peripheral nervous system. Orthologous
    to human LRRC24 (leucine rich repeat containing 24).
  source_type: automated
