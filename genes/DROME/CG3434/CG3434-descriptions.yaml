findings:
- category: discrepancy
  text: The automated text says CG3434 enables queuine transglycosylase activity.
    UniProt and the review call it the non-catalytic accessory subunit that lacks
    the catalytic residues.
  sources:
  - Alliance_Automated
  - UniProt
review:
  reviewer: AI
  rubrics:
