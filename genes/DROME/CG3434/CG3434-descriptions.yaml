descriptions:
- source: UniProt
  text: Non-catalytic subunit of the queuine tRNA-ribosyltransferase (TGT) that catalyzes
    the base-exchange of a guanine (G) residue with queuine (Q) at position 34 (anticodon
    wobble position) in tRNAs with GU(N) anticodons (tRNA-Asp, -Asn, -His and -Tyr),
    resulting in the hypermodified nucleoside queuosine (7-(((4,5-cis-dihydroxy-2-
    cyclopenten-1-yl)amino)methyl)-7-deazaguanosine).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VSZ6
  source_id: Q9VSZ6
