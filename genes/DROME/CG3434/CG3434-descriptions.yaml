    overall_notes: 'Correct and specific: non-catalytic TGT subunit, queuine exchange
      at G34 of tRNA-Asp, -Asn, -His and -Tyr.'
- source: Alliance_Automated
  text: Predicted to enable tRNA-guanosine(34) queuine transglycosylase activity.
    Predicted to be involved in tRNA wobble guanine modification. Predicted to be
    located in cytoplasmic side of mitochondrial outer membrane. Predicted to be part
    of tRNA-guanine transglycosylase complex. Is expressed in several structures,
    including Malpighian tubule primordium; dorsal pharyngeal muscle cell; embryonic/larval
    midgut; embryonic/larval midgut primordium; and head mesoderm. Orthologous to
    human QTRT2 (queuine tRNA-ribosyltransferase accessory subunit 2).
  source_type: automated
