taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG3434 encodes the Drosophila ortholog of QTRT2, the non-catalytic accessory subunit of eukaryotic
  tRNA-guanine transglycosylase. It is predicted to heterodimerize with the catalytic subunit Tgt (QTRT1
  ortholog) to form the cytoplasmic enzyme that replaces guanine 34 in the anticodon of tRNA-Asp, tRNA-Asn,
  tRNA-His and tRNA-Tyr with salvaged queuine, producing queuosine. CG3434 keeps the TGT fold and zinc-binding
  site but lacks the catalytic residues, and contributes to substrate binding and complex function rather
  than catalysis. No Drosophila-specific experimental studies have been reported.
