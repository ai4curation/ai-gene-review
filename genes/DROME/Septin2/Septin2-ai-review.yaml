- term:
    id: GO:0051726
    label: regulation of cell cycle
  evidence_type: IGI
  original_reference_id: PMID:24433211
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0026361
  review:
    summary: Imaginal cell proliferation defect of Sep2 Sep5 double mutants.
    action: MARK_AS_OVER_ANNOTATED
    reason: The double mutant lacks imaginal discs, which the authors attribute to failed imaginal cell
      proliferation. There is no evidence that Sep2 or Sep5 regulate cell-cycle progression as such; the
      proliferation defect is best explained by the septin requirement for cytokinesis. 'Regulation of
      cell cycle' over-interprets the phenotype.
    supported_by:
    - reference_id: PMID:24433211
      supporting_text: Sep2 Sep5 double mutants have an early pupal lethal phenotype and lack imaginal
        discs, suggesting that these genes have redundant functions during imaginal cell proliferation
