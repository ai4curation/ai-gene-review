id: P54359
gene_symbol: Septin2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Septin2 (Sep2) is a Drosophila SEPT6-class septin that forms the Sep1-Sep2-Pnut hetero-oligomer
  with Peanut and Septin1. Unlike Pnut and Sep1, recombinant Sep2 binds GTP but shows no detectable GTPase
  activity and does not exchange bound nucleotide, consistent with a structural role in complex assembly.
  Sep2 and its retrogene paralog Sep5 act redundantly in imaginal cell proliferation, while Sep2 alone
  is needed for normal egg chamber formation. Sep2 binds and bundles actin filaments and, within the Anillin-recruited
  Sep1-Sep2-Pnut complex, organises the actomyosin ring during cell wound repair and contributes to border
  cell migration.
