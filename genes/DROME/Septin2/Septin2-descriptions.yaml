    oogenesis; and wound healing. Located in septin ring. Part of septin complex.
    Is expressed in several structures, including Malpighian tubule primordium; ganglia;
    gut section; head epidermis primordium; and larval muscle cell. Human ortholog(s)
    of this gene implicated in Parkinson's disease. Orthologous to several human genes
    including SEPTIN11 (septin 11).
