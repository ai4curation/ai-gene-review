core_functions: []
suggested_questions:
- question: >-
    Is the 176-residue CG34171-PC product (X2JEK1) translated and stable in vivo, or is it a minor product
    of the multiphasic-reading-frame stop? It contains only the N-terminal half of a trypsin-like fold.
- question: >-
    Does CG34171 (either product) act as a noncatalytic cofactor or regulator in an extracellular serine
    protease cascade, as some insect SPHs do? If so, which catalytic protease does it partner with? This
    would justify, or refute, the gene-level IBA innate immune response and the IEA proteolysis rows.
- question: >-
    PANTHER placement differs by isoform and source. X2JEK1 is assigned to PTHR24256, and the gene's IBA
    comes from PTHR24256 node PTN000667087. UniProt maps A8DZ15 to PTHR24276:SF96, and the PANTHER 19.0
    fly classification file maps it to PTHR24260:SF136. Which family placement do PAINT curators intend
    for this locus?
suggested_experiments:
- description: >-
    Isoform-specific proteomics or epitope-tagged knock-in alleles to find out whether the PC (X2JEK1)
    and PB (A8DZ15) products are both made, secreted, and where (testis, Malpighian tubule, hemolymph).
- description: >-
    Express and purify the CG34171-PB protein, test it for amidase or protease activity against
    chromogenic substrates (expected to be negative), and use co-immunoprecipitation from hemolymph
    after immune challenge to look for partner serine proteases.
