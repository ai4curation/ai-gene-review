id: X2JEK1
gene_symbol: CG34171
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG34171 (SPH244) is a Drosophila melanogaster gene encoding a secreted serine protease homolog (SPH)
  of the S1A chymotrypsin-like family. It is listed among the S1A non-peptidase homologs, the protease-like
  proteins that have lost catalytic residues. The locus produces two polypeptides that share an N-terminal
  signal peptide and the first 167 residues. An alternative translation stop gives the 176-residue CG34171-PC
  product (X2JEK1). That product keeps the histidine and aspartate positions of the S1 catalytic triad
  but ends after the first half of the trypsin-like domain, so it lacks the C-terminal region that contains
  the catalytic serine. The 292-residue CG34171-PB product (A8DZ15) has a complete S1 domain with phenylalanine
  in place of the catalytic serine. Neither product is expected to be an active serine protease. Expression
  data show mild enrichment in testis, and transcripts are detected in Malpighian tubule. No biochemical,
  genetic or localization study of either product has been published. Its biological role, including
  whether it acts as a noncatalytic cofactor in an extracellular protease cascade as some insect SPHs
  do, is unknown.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IKR
  original_reference_id: PMID:30367934
  qualifier: enables
  negated: true
  review:
    summary: >-
      The NOT annotation is correct. The X2JEK1 product lacks the C-terminal part of the S1 domain that
      carries the catalytic serine, and the longer product of the same gene has phenylalanine at that
      position.
    action: ACCEPT
    reason: >-
      This is a negated key-residue inference, and the evidence supports it. Cao and Jiang (2018) classified
      insect SP-related sequences as SPs or SPHs by whether they keep the His-Asp-Ser catalytic triad,
      and listed CG34171 as SPH244. FlyBase files the gene among the S1A non-peptidase homologs. The
      repository's alignment against active bovine trypsin (P00760) and the first, active S1 domain of
      toad ovochymase (Q66TN7) confirms the defect for this exact accession. X2JEK1 keeps H72 and D124,
      but its domain ends at residue 161, and no sequence aligns to the catalytic-serine region. A serine
      endopeptidase needs that serine as its nucleophile. PAINT reaches the same conclusion for this
      lineage: in PTHR24256, several Drosophila nodes carry NOT GO:0004252 IKR assertions that diverge
      from the catalytic ancestor PTN001207268. This is a sequence-based negative, not a failed enzyme
      assay. It is still the strongest claim the evidence supports.
    supported_by:
    - &id001
      reference_id: file:DROME/CG34171/CG34171-bioinformatics/RESULTS.md
      supporting_text: X2JEK1 preserves H72 and D124 but lacks the aligned catalytic-serine region. A8DZ15
        has F222 at the serine-equivalent position.
    - reference_id: PMID:30367934
      supporting_text: based on the presence or absence of the His-Asp-Ser catalytic triad
    - &id002
      reference_id: file:DROME/CG34171/CG34171-flybase.txt
      supporting_text: Serine protease homologs of the S1A family are similar in amino acid sequence to
        S1A serine proteases but are enzymatically inactive due to the lack of catalytic residue(s).
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: >-
      This term comes from mapping the trypsin-domain signature to GO, and it assumes catalytic peptide-bond
      hydrolysis. This product is not catalytic, and nothing shows it taking part in a proteolytic process
      by another route.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IPR001254 to GO:0006508 mapping assumes that a trypsin-domain protein hydrolyses peptide bonds.
      That assumption fails here. The accepted NOT serine-type endopeptidase annotation and the sequence
      analysis show that X2JEK1 has lost the catalytic serine region, and FlyBase also records NOT peptidase
      activity for the gene by key-residue inference. Some insect SPHs do take part in proteolytic cascades
      as noncatalytic cofactors, so the term is not impossible. However, no data link CG34171 to any
      cascade, partner protease or substrate. PAINT made the same distinction. It propagated proteolysis
      (IBD) only from the catalytic node PTN001207268, and the gene's only phylogenetic process annotation
      is innate immune response, from PTN000667087. The gene carries no IBA proteolysis row. We treat
      that omission as a deliberate curator decision. The term is kept but marked as an over-annotation,
      not removed, because participation as a cofactor has not been ruled out.
    supported_by:
    - *id001
    - *id002
    - reference_id: PMID:30367934
      supporting_text: SPs and their non-catalytic homologs (SPHs) have
