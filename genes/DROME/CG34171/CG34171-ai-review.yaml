id: X2JEK1
gene_symbol: CG34171
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG34171 encodes serine-protease-like proteins of the S1 family with an N-terminal secretion
  signal. The 176-residue X2JEK1 product corresponds to CG34171-PC and shares its first 167 residues with
  the longer, 292-residue CG34171-PB protein. The short product retains the histidine and aspartate positions
  of the canonical catalytic triad but lacks the C-terminal region containing its serine position. The
  longer protein carries phenylalanine at that position. The biochemical and physiological roles of the
  short product remain unresolved.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IKR
  original_reference_id: PMID:30367934
  qualifier: enables
  negated: true
  review:
    summary: 'Retain the explicit NOT annotation: the selected short product lacks the catalytic-serine
      region.'
    action: ACCEPT
    reason: 'This is a negated IKR annotation, not a positive activity assertion. The primary study classifies
      SPs versus SPHs by catalytic-triad conservation, and current sequence analysis independently supports
      the negative conclusion for X2JEK1: H72/D124 are retained but the aligned catalytic-serine region
      is absent. The long CG34171 product instead has F222 at the serine-equivalent position. The distinct
      isoform defects support absent canonical catalysis without treating the long protein sequence as
      the target or implying a direct negative enzyme assay.'
    supported_by:
    - &id001
      reference_id: file:DROME/CG34171/CG34171-bioinformatics/RESULTS.md
      supporting_text: X2JEK1 preserves H72 and D124 but lacks the aligned catalytic-serine region. A8DZ15
        has F222 at the serine-equivalent position.
    - reference_id: PMID:30367934
      supporting_text: based on the presence or absence of the His-Asp-Ser catalytic triad
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: Participation in proteolysis is unresolved despite the absence of intrinsic protease activity.
    action: UNDECIDED
    reason: The InterPro trypsin-domain mapping does not establish an intact catalytic mechanism in the
      short product. Nevertheless, a noncatalytic protease homolog can participate in a proteolytic cascade
      through a cofactor role, so loss of activity alone does not refute this biological-process annotation.
      No target-specific evidence establishes such participation, and gene-level SPH/immune-family context
      cannot determine the role of the short PC isoform.
    supported_by:
    - *id001
