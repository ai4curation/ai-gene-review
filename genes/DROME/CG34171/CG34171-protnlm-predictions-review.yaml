  review:
    assessment: NPI
    confidence_score: 0
    summary: X2JEK1 is the 176-residue CG34171-PC isoform, not the 292-residue PB product. Two alignment
      modes and two active S1-domain references place H72 and D124 at conserved catalytic positions, but
      the entire catalytic-serine region is absent from the short product. The longer product has F222
      at that position; that is a separate substitution and must not be assigned to the missing short-product
      sequence. This contradicts the predicted intrinsic activity and agrees with the explicit NOT IKR
      annotation to the same term. The raw prediction records Q66TN7 as its donor at model score 0.99,
      but its hit coordinates and historical input sequence are unavailable. The decisive evidence is
      the reproduced catalytic-region defect, not agreement with a database label or the SPH synonym.
    supported_by:
    - reference_id: file:DROME/CG34171/CG34171-bioinformatics/RESULTS.md
      supporting_text: X2JEK1 preserves H72 and D124 but lacks the aligned catalytic-serine region. A8DZ15
        has F222 at the serine-equivalent position.
    - reference_id: PMID:30367934
      supporting_text: based on the presence or absence of the His-Asp-Ser catalytic triad
