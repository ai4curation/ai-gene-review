    overall_notes: 'Correct and compact: Polo-like kinase that phosphorylates centrosomal
      proteins, autoregulates by autophosphorylation, and is needed for centriole
      and basal body biogenesis.'
- source: Alliance_Automated
  text: Enables identical protein binding activity and protein serine/threonine kinase
    activity. Involved in several processes, including microtubule cytoskeleton organization;
    regulation of centriole replication; and syncytial blastoderm mitotic cell cycle.
    Colocalizes with centriole. Is expressed in several structures, including dorsal
    epidermis primordium; embryonic epipharynx; embryonic foregut; embryonic hypopharynx;
    and foregut primordium. Human ortholog(s) of this gene implicated in microcephaly
    and chorioretinopathy 2. Orthologous to human PLK4 (polo like kinase 4).
