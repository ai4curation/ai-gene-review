- source: Alliance_Imported
  text: Sak kinase (SAK) encodes a serine/threonine protein kinase member of the Polo-like
    kinase family. It phosphorylates centrosomal proteins and self-regulates by autophosphorylation.
    It is required for centriole biogenesis and formation of the basal bodies of cilia
    and flagella.
  source_type: curated
  url: https://flybase.org/reports/SAK.html
  source_id: FB:FBgn0026371
