descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase that plays a central role in centriole duplication.
    Able to trigger procentriole formation on the surface of the mother centriole
    cylinder, using mother centriole as a platform, leading to the recruitment of
    centriole biogenesis proteins such as Sas-6. When overexpressed, it is able to
    induce centrosome amplification through the simultaneous generation of multiple
    procentrioles adjoining each parental centriole during S phase. Centrosome amplification
    following overexpression can initiate tumorigenesis, highlighting the importance
    of centrosome regulation in cancers.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O97143
  source_id: O97143
