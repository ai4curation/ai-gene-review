core_functions:
- description: Centriole-localized Ser/Thr kinase that initiates procentriole assembly by phosphorylating Ana2 (STAN
    motif), enabling Ana2 to recruit Sas-6 and build the cartwheel.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - *id001
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:21987638
    supporting_text: We found that Plk4-KD can autophosphorylate in vitro and can phosphorylate kinase-dead Plk4-KD
      in trans
  - reference_id: PMID:25264260
    supporting_text: Drosophila Plk4 phosphorylates four conserved serines in the STAN motif of the core centriole
      protein Ana2 to enable it to bind and recruit its Sas6 partner
  - reference_id: PMID:16326102
    supporting_text: downregulation of SAK in Drosophila cells, by mutation or RNAi, leads to loss of centrioles,
      the core structures of centrosomes
  - reference_id: PMID:29263250
    supporting_text: When we over-ride the auto-destruction of Plk4, it remains localized to multiple sites in the
      outer ring of the centriole and, if catalytically active, recruits Ana2 to these sites
- description: Homodimeric kinase that trans-autophosphorylates its downstream regulatory element (degron), priming
    its own SCF-Slimb-mediated ubiquitination and degradation to limit centriole duplication to once per cycle.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0046777
    label: protein autophosphorylation
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:21987638
    supporting_text: We found that Plk4-KD can autophosphorylate in vitro and can phosphorylate kinase-dead Plk4-KD
      in trans
  - reference_id: PMID:21987638
    supporting_text: we found that the Plk4 kinase activity is needed for its degradation because kinase-dead Plk4
      expressed in S2 cells is more stable than wild-type (wt) Plk4
  - reference_id: PMID:23000383
    supporting_text: Surprisingly, the structure reveals two tandem homodimerized polo boxes, PB1-PB2, that form
      a unique winged architecture
  - reference_id: PMID:19084407
    supporting_text: This complex physically interacts with SAK/PLK4, and in its absence, SAK/PLK4 accumulates,
      leading to the striking formation of multiple daughter centrioles surrounding each mother
suggested_questions:
- question: Besides Ana2, which Sak substrates (e.g. Asl, Sas-6, Sas-4) are phosphorylated in vivo and are any required
    for centriole duplication?
- question: How does PP2A-Twins dephosphorylation of the DRE coordinate with Asl binding to switch Sak from ring-like
    to single-focus localization?
- question: Should GO capture Ana2 as has_input of Sak kinase activity in a centriole-duplication GO-CAM?
suggested_experiments:
- description: Phosphoproteomics of centriolar proteins in embryos expressing analog-sensitive Sak to identify direct
    in vivo substrates.
- description: Live imaging of Sak-SBM versus kinase-dead Sak combined with Ana2 STAN phospho-mimetics to separate
    localization from activity requirements.
