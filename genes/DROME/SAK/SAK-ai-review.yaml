id: O97143
gene_symbol: SAK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SAK (Sak/Plk4) is the Drosophila Polo-like kinase 4, a centriole-associated serine/threonine protein
  kinase that initiates and limits centriole duplication. It has an N-terminal kinase domain, a downstream regulatory
  element carrying a Slimb-binding phosphodegron, a homodimerizing cryptic polo box (PB1-PB2) that binds the centriolar
  receptor Asterless, and a C-terminal polo box. Recruited to the proximal end of mother centrioles by Asterless,
  Sak phosphorylates the STAN motif of Ana2, allowing Ana2 to recruit Sas-6 and seed cartwheel/procentriole assembly.
  Loss of Sak causes centriole loss, failure of sperm axoneme formation and defects in syncytial embryonic divisions
  and male meiosis, whereas overexpression drives centriole amplification and de novo centriole formation. Sak levels
  are controlled by trans-autophosphorylation of its degron, which triggers SCF-Slimb-mediated ubiquitination and
  proteolysis; PP2A-Twins counteracts this autophosphorylation to stabilize Sak in mitosis.
