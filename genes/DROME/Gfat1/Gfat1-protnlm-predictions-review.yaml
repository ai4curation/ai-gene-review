description: 'The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for A8Y5A1,
  the native 434-residue Gfat1-PF product. Omission of the complete glutamine-dependent amidotransferase
  activity (GO:0004360) is not a supported deficiency: this exact product lacks the catalytic cysteine
  and most of the glutaminase module needed for that reaction. The retained SIS domains and ligand-bound
  structures of homologous human isomerase domains support carbohydrate derivative binding (GO:0097367)
  as a broad, qualified omission candidate, not proof of target-specific binding or catalysis. Participation
  in UDP-N-acetylglucosamine biosynthesis remains unresolved for this isoform. The separate FUNCTION claim
  of the complete glutamine-dependent reaction is NPI because of the missing catalytic architecture. This
  completed record assesses the absence of GO output; predictions is empty because no GO or EC prediction
  was emitted. The narrative judgment remains in the linked function review and is not a score assigned
  to the omission.'
