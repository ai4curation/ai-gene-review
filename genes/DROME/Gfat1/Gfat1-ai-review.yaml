    label: L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005855
  - EC:2.6.1.16
  review:
    action: REMOVE
    summary: This IEA assigns the complete glutamine-dependent reaction to PF, but its sequence lacks
      the N-terminal catalytic cysteine and most of the glutaminase domain.
    reason: This IEA assigns the complete glutamine-dependent reaction to PF, but its sequence lacks the
      N-terminal catalytic cysteine and most of the glutaminase domain. Both nitrogen extraction from
      glutamine and transfer to the sugar site are required for the stated intrinsic activity. Retained
      SIS domains do not provide the missing glutamine-hydrolysis machinery.
    supported_by:
    - &id001
      reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Only 40 of 299 residues of the annotated glutamine-amidotransferase domain remain,
        and its N-terminal catalytic Cys2 is absent.
    - &id002
      reference_id: PMID:16339762
      supporting_text: 'Glucosamine-6P synthase catalyzes the synthesis of glucosamine-6P from

        fructose-6P and glutamine and uses a channel to transfer ammonia from its

        glutaminase to its synthase active site.'
