id: A8Y5A1
gene_symbol: Gfat1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Gfat1 (zeppelin, CG12449) encodes glutamine:fructose-6-phosphate amidotransferase 1, the enzyme
  that catalyses the first committed step of hexosamine biosynthesis (L-glutamine + D-fructose
  6-phosphate to L-glutamate + D-glucosamine 6-phosphate), supplying UDP-N-acetylglucosamine for
  chitin synthesis and protein glycosylation. Full-length Gfat1 products (e.g. the 694-residue
  Gfat1-PA) combine an N-terminal glutaminase (class II glutamine amidotransferase, Ntn-hydrolase)
  domain with a C-terminal pair of SIS sugar-isomerase domains; fly Gfat1 activity is feedback
  inhibited by UDP-GlcNAc and stimulated by PKA, it is expressed in chitin-synthesising embryonic
  tissues and larval salivary glands, and null mutants die by the first larval instar. This accession
  is the Gfat1-PF isoform (434 residues), an N-terminally truncated product that starts at the
  equivalent of Met261 of Gfat1-PA. It is identical to the C-terminal 434 residues of the full-length
  protein, keeps both SIS sugar-phosphate-binding domains, and lacks the catalytic Cys2 nucleophile
  together with all but the last 40 residues of the glutaminase domain. It therefore cannot by itself
  carry out the glutamine-dependent amidotransferase reaction. Whether it binds sugar phosphates,
  pairs with full-length subunits, or has any physiological role has not been tested.
existing_annotations:
- term:
    id: GO:0004360
    label: L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005855
  - EC:2.6.1.16
  review:
    action: REMOVE
    summary: The full-length Gfat1 products have this activity, but the Gfat1-PF isoform has lost
      the glutaminase domain and its catalytic Cys2, so it cannot perform the glutamine-dependent reaction.
    reason: >-
      The activity is well supported for the gene: fly GFAT1 expressed in yeast had activity regulated
      by UDP-GlcNAc and PKA (PMID:11716769), and full-length Gfat1 (Q7PLC7, PANTHER PTHR10937:SF0)
      falls under PAINT node PTN000101302, where GO:0004360 was placed with fly Gfat1 itself among the
      seeds. Those experiments and that node describe a protein with both domains. The reaction needs
      the N-terminal glutaminase to hydrolyse glutamine and pass the ammonia through a channel to the
      isomerase site (PMID:16339762). A8Y5A1 (Gfat1-PF) is exactly the C-terminal 434 residues of the
      694-residue Gfat1-PA. It keeps only 40 of the 299 residues of the glutamine-amidotransferase domain
      and lacks the Cys2 nucleophile. This automated mapping, made from the family signature (IPR005855)
      and the EC number, therefore assigns this gene product an activity its sequence cannot carry out.
      The removal applies only to this accession and not to the gene; the activity should stay on
      the full-length products. Whether PF could form a mixed dimer with full-length subunits and
      contribute to the shared sugar site is untested and is raised as a question, not annotated.
    supported_by:
    - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Only 40 of 299 residues of the annotated glutamine-amidotransferase domain remain,
        and its N-terminal catalytic Cys2 is absent.
    - reference_id: PMID:16339762
      supporting_text: 'Glucosamine-6P synthase catalyzes the synthesis of glucosamine-6P from

        fructose-6P and glutamine and uses a channel to transfer ammonia from its

        glutaminase to its synthase active site.'
    - reference_id: PMID:11716769
      supporting_text: Expressing Dmel/GFAT1 in yeast we showed that Dmel/GFAT1 activity is controlled
        by UDP-N-acetylglucosamine and PKA in the yeast total protein extract system.
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415720
  review:
    action: UNDECIDED
    summary: The gene takes part in hexosamine (amino-sugar) metabolism through its full-length enzyme.
      No step of that process has been shown to be carried out by the truncated PF isoform.
    reason: >-
      Gfat1's role in amino-sugar metabolism comes from the catalytic full-length products
      (PMID:11716769; PMID:32615907). PF lacks the glutaminase module, so it cannot catalyse the
      committed step. A non-catalytic contribution, such as sugar-phosphate binding or regulating or
      partnering with full-length subunits, is possible but has never been tested for this isoform.
      Losing catalysis does not prove that the isoform takes no part in the process, so the row is
      left undecided rather than removed.
    supported_by:
    - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Free-ammonia use, trans-complementation and a regulatory role are not demonstrated
        and are not assumed.
    - reference_id: PMID:32615907
      supporting_text: first committed step of the hexosamine biosynthesis pathway (HBP) using
- term:
    id: GO:0006048
    label: UDP-N-acetylglucosamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00113
  review:
    action: UNDECIDED
    summary: This UniPathway mapping is correct for the catalytic Gfat1 enzyme, but the glutaminase-deficient
      PF isoform has not been shown to do any part of UDP-GlcNAc synthesis.
    reason: >-
      The full-length GFAT reaction is the committed first step of hexosamine biosynthesis
      (PMID:32615907). Fly Gfat1 activity is feedback inhibited by UDP-GlcNAc (PMID:11716769), and gfat1
      null mutants die (PMID:32615907); that lethality shows the gene is required, not what PF does.
      PF lacks the catalytic glutaminase domain (Cys2 and most of the domain), so the IEA's assumption of
      a complete enzyme does not hold for this accession. No evidence shows any other contribution by
      PF, and none rules one out.
    supported_by:
    - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Only 40 of 299 residues of the annotated glutamine-amidotransferase domain remain,
        and its N-terminal catalytic Cys2 is absent.
    - reference_id: PMID:32615907
      supporting_text: Deletions for either enzyme were fully lethal
- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000415720
  review:
    action: MODIFY
    summary: PF keeps both SIS sugar-isomerase domains, whose conserved ligands are sugar phosphates
      (carbohydrate derivatives), so carbohydrate derivative binding is the more accurate term.
    reason: >-
      Both SIS domains are intact in PF (reference residues 372-512 and 543-684). In the GFAT/GlmS
      family, the isomerase domain binds hexose 6-phosphates. The isolated human GFAT isomerase domain
      was crystallised with glucose 6-phosphate and glucosamine 6-phosphate (PMID:19059404). The
      relationship to the human enzyme rests on membership of family PTHR10937 and on descent from
      PAINT node PTN000101302, where the GFAT activity, and so this isomerase-site binding, was placed
      above fly Gfat1, E. coli GlmS (both in SF0) and human GFPT1/GFPT2 (SF12/SF10). The human protein
      sits in a different subfamily, so only this family-wide sugar-phosphate binding is transferred.
      The ligands are sugar phosphates, which are carbohydrate derivatives rather than free
      carbohydrates, so the claim is better expressed by GO:0097367 carbohydrate derivative binding,
      a term this product already carries. Binding by PF itself has not been measured.
    proposed_replacement_terms:
    - id: GO:0097367
      label: carbohydrate derivative binding
    supported_by:
    - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Both SIS domains are fully retained (reference 372–512 and 543–684).
    - reference_id: PMID:19059404
      supporting_text: 'We now report the first structures of the isomerase domain of the

        human GFAT in the presence of cyclic glucose-6-phosphate and linear

        glucosamine-6-phosphate.'
