  review:
    action: ACCEPT
    summary: Both C-terminal SIS sugar-phosphate-binding domains are intact in PF, which supports
      this broad binding term.
    reason: >-
      PF keeps the whole C-terminal isomerase region. Ligand-bound structures of the homologous human
      isomerase domain (same PANTHER family PTHR10937, below the GFAT PAINT node PTN000101302) show
      hexose-phosphate binding at this site (PMID:19059404). The broad term matches what the retained
      domains imply. A more specific ligand term, such as fructose-6-phosphate binding, is not used,
      because the site binds substrate, product and a glucose 6-phosphate analogue, and nothing has
      been measured for PF. The term does not claim the complete glutamine-dependent reaction or any
      pathway flux.
    supported_by:
    - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
      supporting_text: Both SIS domains are fully retained (reference 372–512 and 543–684).
    - reference_id: PMID:19059404
      supporting_text: 'We now report the first structures of the isomerase domain of the

        human GFAT in the presence of cyclic glucose-6-phosphate and linear

        glucosamine-6-phosphate.'
