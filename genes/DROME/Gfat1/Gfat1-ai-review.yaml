core_functions:
- description: Gfat1-PF keeps the C-terminal SIS sugar-isomerase region that binds hexose phosphates
    in GFAT-family enzymes. Without the glutaminase domain it cannot carry out the glutamine-dependent
    amidotransferase reaction of full-length Gfat1, and its native role is unresolved.
  molecular_function:
    id: GO:0097367
    label: carbohydrate derivative binding
  supported_by:
  - reference_id: file:DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
    supporting_text: Both SIS domains are fully retained (reference 372–512 and 543–684).
  - reference_id: PMID:19059404
    supporting_text: 'We now report the first structures of the isomerase domain of the

      human GFAT in the presence of cyclic glucose-6-phosphate and linear

      glucosamine-6-phosphate.'
suggested_questions:
- question: Is the Gfat1-PF (434 aa, N-terminally truncated) protein made in vivo, and if so in which
    tissues and in what amount relative to the full-length Gfat1 isoforms?
- question: Can Gfat1-PF form mixed dimers with full-length Gfat1 or Gfat2 subunits, and would that
    add to or reduce GFAT activity at the shared sugar site?
- question: Since glucosamine-6-phosphate rescues gfat2 but not gfat1 null flies, does any Gfat1 product,
    including truncated isoforms such as PF, have a role beyond producing GlcN6P?
suggested_experiments:
- description: Express recombinant Gfat1-PF and full-length Gfat1-PA. Measure fructose-6-phosphate and
    glucosamine-6-phosphate binding, glutamine-dependent and ammonia-dependent GlcN6P synthesis, and
    co-purification with full-length subunits.
- description: Use isoform-specific tagging or targeted proteomics of the unique Met261 start to test
    whether the PF polypeptide exists in vivo, and test whether a PF-only transgene rescues any
    gfat1 null phenotype.
