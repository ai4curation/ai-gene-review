gene_symbol: Gfat1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gfat1 encodes glutamine-fructose-6-phosphate amidotransferase isoforms associated with hexosamine
  metabolism. The native 434-residue PF isoform preserves the C-terminal sugar-isomerase region but lacks
  most of the N-terminal glutaminase domain, including its catalytic cysteine. It lacks the catalytic
  machinery required to execute the complete intrinsic glutamine-dependent reaction of the full-length
  enzyme. Its retained sugar-binding region may support ligand binding or other functions, while its physiological
  contribution remains unresolved.
