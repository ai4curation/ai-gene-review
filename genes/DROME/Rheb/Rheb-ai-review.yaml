core_functions:
- description: GTP-bound Rheb directly activates the TORC1 kinase complex; this is the GTPase switch through
    which Tsc1/Tsc2 (and upstream insulin, PVR and nutrient signals) control TORC1.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:1904263
    label: positive regulation of TORC1 signaling
  - id: GO:0007264
    label: small GTPase-mediated signal transduction
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:12766776
    supporting_text: Genetic and biochemical tests indicate that Rheb functions in the insulin signalling
      pathway downstream of Tsc1-Tsc2 and upstream of TOR
  - reference_id: PMID:22493059
    supporting_text: expression of TOR and RAPTOR, together with their upstream activator Rheb, was sufficient
      to provide TORC1 activity
  - reference_id: PMID:36435842
    supporting_text: we observed that Rheb localized to Golgi stacks of primary spermatocytes, as assessed
      by co-staining with the Golgi marker Lava lamp
- description: Intrinsic GTPase activity (stimulated by the Tsc1/Tsc2 GAP) returns Rheb to the inactive
    GDP-bound state, switching off TORC1 activation.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0007264
    label: small GTPase-mediated signal transduction
  supported_by:
  - reference_id: file:DROME/Rheb/Rheb-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Binds GTP and exhibits intrinsic GTPase activity
  - reference_id: PMID:19216764
    supporting_text: Tsc1 and Tsc2 (which together form a Rheb GAP)
suggested_questions:
- question: Does Drosophila Rheb inhibit TORC2 only indirectly through TORC1-S6K feedback, or also directly?
    UniProt's text for PMID:22493059 ('may also have a role in activating TORC2 signaling') and the negative
    regulation of TORC2 IDA row from the same paper disagree.
- question: Is Tctp a bona fide Rheb GEF in vivo, given that the GEF activity of mammalian TCTP toward
    RHEB has been disputed?
- question: 'Where does Drosophila Rheb activate TORC1 in somatic cells: Golgi (GOLPH3-dependent), lysosomal
    membranes as in mammals, or both?'
- question: Should PMID:11782951 (a 2002 review not mentioning Rheb in its abstract) be the reference
    for an IMP insulin receptor signaling annotation, or is it mis-keyed?
suggested_experiments:
- description: Image endogenously tagged Rheb (CRISPR knock-in) in fat body and imaginal disc cells with
    Golgi and lysosome markers under fed and starved conditions, and test TORC1 output after GOLPH3/sau
    depletion.
- description: Measure TORC2 (Akt S505) phosphorylation in Rheb loss-of-function cells with and without
    S6K co-depletion to separate direct from feedback effects of Rheb on TORC2.
