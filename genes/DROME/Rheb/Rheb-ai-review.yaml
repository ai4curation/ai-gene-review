id: Q9VND8
gene_symbol: Rheb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rheb (Ras homolog enriched in brain; CG1081) is the Drosophila member of the Rheb family
  of Ras-superfamily small GTPases. It is C-terminally farnesylated (CaaX box) and associates with endomembranes,
  including the Golgi apparatus, where its recruitment depends on GOLPH3/sauron. GTP-loaded Rheb is the
  direct upstream activator of the TOR kinase complex TORC1; its activity is restrained by the Tsc1/Tsc2
  GTPase-activating protein complex, which relays insulin/PI3K-Akt, PDGF/VEGF-receptor and nutrient inputs,
  and Tctp has been reported to promote its GTP loading. Through TORC1 and its effectors (S6K, 4E-BP,
  Atg1) Rheb drives protein synthesis, ribosome biogenesis and cell growth, and represses autophagy. Loss
  of Rheb arrests larval growth and reduces cell size and G1-S progression, whereas overexpression enlarges
  cells and tissues, enlarges neuromuscular junctions and causes TOR-dependent photoreceptor axon misrouting.
  TORC2 output is reduced by Rheb, most likely through TORC1-S6K feedback.
