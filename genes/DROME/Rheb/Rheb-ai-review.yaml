  review:
    summary: IBA (is_active_in plasma membrane) from the Ras/Rheb family node PTN000631348, seeded mostly
      by Ras/Ral/Rap GTPases.
    action: MARK_AS_OVER_ANNOTATED
    reason: Plasma membrane is a Ras-family property (H-/K-/N-Ras, Ral, Rap) propagated from the broad
      Ras/Rheb node. Rheb lacks the second palmitoylation/polybasic signal that targets Ras to the plasma
      membrane; fly and human Rheb are reported on Golgi/ER and (in mammals) lysosomal membranes, and
      no Drosophila evidence places Rheb at the plasma membrane. Reactome places DRheb at the plasma membrane
      only as a modelling convention for its inferred GEF/GAP reactions. Over-annotation, not removed
      because a minor PM pool cannot be excluded.
    supported_by:
    - *id001
    - *id006
    - reference_id: file:DROME/Rheb/Rheb-deep-research-manual.md
      supporting_text: No Drosophila evidence for plasma membrane localization was found in cached literature.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000631348
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Broad Ras/Ral/Rap/Rheb node; the plasma membrane seeds are Ras, Ral and Rap GTPases with
          plasma-membrane targeting signals that Rheb lacks. Rheb-clade evidence places it on Golgi/ER
          (and lysosomal) endomembranes.
