- source: Alliance_Automated
  text: Enables GTPase activity. Involved in several processes, including positive
    regulation of nervous system development; regulation of TOR signaling; and regulation
    of macroautophagy. Predicted to be located in Golgi membrane and endoplasmic reticulum
    membrane. Predicted to be active in plasma membrane. Is expressed in adult head
    and medullary zone of lymph gland primary lobe. Used to study disease of metabolism;
    tuberous sclerosis; and type 2 diabetes mellitus. Orthologous to several human
    genes including RHEB (Ras homolog, mTORC1 binding).
