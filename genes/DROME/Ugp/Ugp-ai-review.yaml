suggested_questions:
- question: Is fly Ugp regulated by oligomerization (octamer formation) as human UGP2 is, and does its
    activity limit glycogen or trehalose synthesis in the fat body?
suggested_experiments:
- description: Measure glycogen, trehalose and UDP-glucose levels after fat-body-specific Ugp knockdown.
