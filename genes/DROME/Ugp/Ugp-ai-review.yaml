id: Q9VSW1
gene_symbol: Ugp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ugp encodes the Drosophila UTP--glucose-1-phosphate uridylyltransferase (UDP-glucose pyrophosphorylase,
  UGPase), the ortholog of human UGP2. This cytosolic enzyme reversibly forms UDP-alpha-D-glucose and
  diphosphate from alpha-D-glucose 1-phosphate and UTP. UDP-glucose is the glucosyl donor for glycogen
  synthase and trehalose-6-phosphate synthase, the substrate of UDP-glucose 6-dehydrogenase (Sugarless)
  for UDP-glucuronate and UDP-xylose synthesis, and a donor for protein and lipid glucosylation, placing
  Ugp at the branch point between glucose-phosphate metabolism and nucleotide-sugar-dependent biosynthesis.
