- source: Alliance_Imported
  text: UDP-glucose pyrophosphorylase (Ugp) encodes an enzyme that catalyzes the formation
    of UDP-glucose from UTP and glucose 1-phosphate. UDP-glucose is essential for
    glycogen biosynthesis and is also a precursor for the synthesis of UDP-glucuronate
    and UDP-galactose that are used for protein glycosylation.
  source_type: curated
  url: https://flybase.org/reports/Ugp.html
  source_id: FB:FBgn0035978
