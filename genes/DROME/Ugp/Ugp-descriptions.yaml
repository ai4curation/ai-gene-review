    - rubric: specificity
      score: 4
    overall_notes: Correct and covers glycogen, UDP-glucuronate and UDP-galactose
      branches. Omits trehalose synthesis.
- source: Alliance_Automated
  text: Enables UTP:glucose-1-phosphate uridylyltransferase activity. Involved in
    UDP-alpha-D-glucose biosynthetic process and response to hyperoxia. Located in
    cytosol. Is expressed in several structures, including adult brain; adult brain
    cell body rind; adult head; germline cell; and larval somatic muscle cell. Human
    ortholog(s) of this gene implicated in developmental and epileptic encephalopathy
    83. Orthologous to human UGP2 (UDP-glucose pyrophosphorylase 2).
  source_type: automated
