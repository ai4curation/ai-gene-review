id: M9NEG4
gene_symbol: mud
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Mushroom body defect (Mud) is a very large coiled-coil protein, the Drosophila counterpart of
  vertebrate NuMA and C. elegans LIN-5. During mitosis Mud is recruited to specific domains of the
  cell cortex, where it couples polarity cues to the mitotic spindle: in neuroblasts the
  GDP-Galphai-activated Pins TPR domain binds a short C-terminal Mud motif and recruits Mud to the
  apical cortex (with Canoe/RanGTP assisting recruitment), in the sensory organ precursor pI cell
  Dishevelled recruits Mud to the posterior cortex, and in epithelia Mud accumulates at tricellular
  junctions in a Pins-independent, Gliotactin-dependent manner. Mud binds microtubules and acts with
  cytoplasmic dynein to generate astral microtubule pulling forces that orient the spindle. Mud is
  also found at centrosomes/spindle poles, where it contributes to centrosome organization, and at
  the central spindle pole body of the tandem meiosis II spindles in oocytes, which is required for
  female fertility. Loss of mud causes spindle misorientation, symmetric neuroblast division,
  neuroblast over-proliferation and the eponymous mushroom body defects, and mud also acts in
  postmitotic neurons in a Netrin-independent pathway promoting midline axon crossing.
