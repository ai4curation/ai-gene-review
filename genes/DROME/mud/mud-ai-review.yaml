core_functions:
- description: Cortical spindle-orientation effector. Recruited to polarized cortical domains by
    Galphai-activated Pins (TPR domain), Dishevelled or tricellular junctions, Mud binds astral
    microtubules and, with cytoplasmic dynein, generates the pulling forces that align the mitotic
    spindle with the polarity axis, enabling asymmetric neuroblast division and oriented epithelial
    division.
