suggested_questions:
- question: Is the Wnt signalosome IDA (PMID:12711303) based on an experiment that assayed Fz2, given that the abstract
    concerns only Axin, DCAP and Arrow?
- question: Which protease cleaves Fz2 to release the C-terminal fragment in the Frizzled Nuclear Import pathway,
    and is this cleavage used outside the NMJ?
- question: Does the gene-trap line BG01711 (PMID:22530061) disrupt fz2 or CG8771, and should any FlyBase olfaction-related
    data linked to fz2 via this line be re-attributed?
suggested_experiments:
- hypothesis: The Fz2 C-terminal fragment released in the FNI pathway acts in the nucleus independently of Armadillo.
  description: Generate endogenous fz2 knock-ins with a non-cleavable C-terminus or a mutated PDZ-binding motif
    and measure nuclear DFz2-C, synaptic bouton number and Armadillo target expression in larval muscle.
  experiment_type: CRISPR knock-in with imaging and reporter readouts
