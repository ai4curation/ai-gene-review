core_functions:
- description: 'Wnt receptor activity: Fz2 binds Wingless (and Wnt4/Wnt5) via its CRD and, with the LRP5/6 co-receptor
    Arrow, transduces the signal across the plasma membrane to Dishevelled, stabilising Armadillo; redundant with
    Fz.'
