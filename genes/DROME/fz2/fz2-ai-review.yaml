gene_symbol: fz2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Frizzled 2 (Fz2, DFz2) is a class-F seven-transmembrane Wnt receptor of Drosophila. Its N-terminal
  cysteine-rich FZ domain binds Wingless (Wg) and other Wnts (Wnt4, Wnt5), and its cytoplasmic tail carries a KTxxxW
  Dishevelled-binding motif and a C-terminal PDZ-binding motif. Together with Frizzled (Fz), with which it is largely
  redundant, Fz2 is the primary Wg receptor: with the LRP5/6 co-receptor Arrow it forms Wnt-induced receptor complexes
  at the plasma membrane that recruit Dishevelled and stabilise Armadillo (beta-catenin), driving embryonic segment
  polarity, CNS, heart and midgut patterning and wing margin development. Fz2 also captures and internalises Wg,
  shaping its extracellular distribution. At the larval neuromuscular junction it mediates a non-canonical Frizzled
  Nuclear Import pathway: postsynaptic Fz2 is endocytosed, trafficked with the PDZ protein dGRIP, cleaved, and its
  C-terminal fragment enters the muscle nucleus to promote synapse development. Wnt4- and Wnt5-Fz2 signalling further
  guides cell migration in the ovary and salivary gland, retinal and motor axon targeting, and axon extension in
  the brain.'
