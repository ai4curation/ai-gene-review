- description: 'Frizzled Nuclear Import pathway at the larval NMJ: Wg-bound postsynaptic Fz2 is endocytosed, transported
    via dGRIP (bound through its C-terminal PDZ-binding motif), cleaved, and its C-terminal fragment imported into
    the muscle nucleus to promote synapse development.'
