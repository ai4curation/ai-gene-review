- id: PMID:22530061
  title: A screen for genes expressed in the olfactory organs of Drosophila melanogaster identifies genes involved
    in olfactory behaviour.
  findings:
  - statement: Gene-trap line BG01711, mapped by BDGP to fz2, was shown by 3-prime RACE to splice into CG8771, so
      its olfactory expression and behaviour phenotype cannot be attributed to fz2.
    supporting_text: For BG01711, the RACE results showed the vector was spliced to the CG8771 gene at cytological
      region 49B12, contradicting the BDGP prediction at 76A1 in the Frizzled 2 gene.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. The fz2 association of gene-trap BG01711 is ambiguous (fz2 or CG8771); no fz2
      function in olfaction can be inferred, and no annotation is proposed from it.
