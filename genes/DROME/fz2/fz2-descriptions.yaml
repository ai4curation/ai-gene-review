descriptions:
- source: UniProt
  text: Receptor for Wnt proteins. Most of frizzled receptors are coupled to the beta-catenin
    canonical signaling pathway, which leads to the activation of disheveled proteins,
    inhibition of GSK-3 kinase, nuclear accumulation of beta-catenin and activation
    of Wnt target genes. A second signaling pathway involving PKC and calcium fluxes
    has been seen for some family members, but it is not yet clear if it represents
    a distinct pathway or if it can be integrated in the canonical pathway, as PKC
    seems to be required for Wnt-mediated inactivation of GSK-3 kinase. Both pathways
    seem to involve interactions with G proteins. Required to coordinate the cytoskeletons
    of epidermal cells to produce a parallel array of cuticular hairs and bristles.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VVX3
  source_id: Q9VVX3
