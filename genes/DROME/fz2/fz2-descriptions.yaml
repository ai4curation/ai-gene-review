    overall_notes: Generic Frizzled-family text (canonical and Ca2+/PKC pathways)
      padded with speculation; the planar hair polarity sentence fits Fz rather than
      Fz2's main role as a Wg receptor.
- source: Alliance_Automated
  text: Enables PDZ domain binding activity; Wnt receptor activity; and Wnt-protein
    binding activity. Involved in several processes, including Wnt signaling pathway;
    instar larval or pupal development; and neuron differentiation. Located in nucleus
    and plasma membrane. Part of Wnt signalosome. Colocalizes with early endosome
    and late endosome. Is expressed in several structures, including adult gnathal
    ganglion; anterior-posterior subdivision of organism; gut section; somatic cell
    of testis; and synaptic neuropil domain. Orthologous to several human genes including
    FZD5 (frizzled class receptor 5).
  source_type: automated
