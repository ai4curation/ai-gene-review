    label: Malpighian tubule development
  evidence_type: IMP
  original_reference_id: PMID:20432470
  qualifier: involved_in
  review:
    summary: Activated Ras transforms adult Malpighian-tubule stem cells rather than establishing
      normal tubule development.
    action: MARK_AS_OVER_ANNOTATED
    reason: Ras85D pathway perturbation changes this downstream phenotype, but the term is more
      specific to the experimental readout than to Ras85D itself. The row is not grossly false, yet
      it overstates a context-specific or oncogenic output as a direct reusable Ras85D process.
