- term:
    id: GO:1904263
    label: positive regulation of TORC1 signaling
  evidence_type: IMP
  original_reference_id: PMID:23878397
  qualifier: involved_in
  review:
    summary: Pvr/Ras signaling can feed into TORC1 signaling through Tsc1/Tsc2.
