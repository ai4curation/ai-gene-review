id: P08646
gene_symbol: Ras85D
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Ras85D encodes the major Drosophila Ras switch used by receptor tyrosine
  kinase pathways. In its GTP-bound state, plasma-membrane Ras85D activates
  downstream effectors including Raf to drive the MAPK cascade downstream of
  Egfr, Sevenless, Torso, FGF, and Pvr signaling, while intrinsic GTP hydrolysis
  and RasGAPs return the protein to the GDP-bound inactive state.
