- source: Alliance_Imported
  text: Ras oncogene at 85D (Ras85D) encodes a protein that acts downstream of several
    cell signals, most notably from Receptor Tyrosine Kinases, to regulate tissue
    growth and development. When abnormally activated it can direct developmental
    defects and tissue hyperplasia, mimicking aspects of human disease including Rasopathies
    and cancer, respectively.
  source_type: curated
  url: https://flybase.org/reports/Ras85D.html
  source_id: FB:FBgn0003205
