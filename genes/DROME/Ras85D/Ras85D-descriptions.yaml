    - rubric: specificity
      score: 2
    overall_notes: 'Correct but general: acts downstream of RTKs to regulate growth
      and development, models RASopathies and cancer. No effectors or GTPase cycle.'
- source: Alliance_Automated
  text: Enables G protein activity and protein serine/threonine kinase activator activity.
    Involved in several processes, including cell surface receptor protein tyrosine
    kinase signaling pathway; instar larval or pupal development; and respiratory
    system development. Located in plasma membrane. Is expressed in several structures,
    including adult head; adult heart; brain; germline cell; and imaginal disc. Used
    to study Noonan syndrome 3; cancer (multiple); and heart disease (multiple). Human
    ortholog(s) of this gene implicated in several diseases, including Costello syndrome;
    Noonan syndrome (multiple); cardiofaciocutaneous syndrome (multiple); disease
    of cellular proliferation (multiple); and uterine disease (multiple). Orthologous
    to several human genes including HRAS (HRas proto-oncogene, GTPase).
  source_type: automated
