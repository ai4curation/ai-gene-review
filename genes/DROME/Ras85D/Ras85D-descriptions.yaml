descriptions:
- source: UniProt
  text: Ras proteins bind GDP/GTP and possess intrinsic GTPase activity (By similarity).
    Plays a role in eye development by regulating cell growth, survival of postmitotic
    ommatidial cells and differentiation of photoreceptor cells (PubMed:11290305).
    During larval development, mediates Ptth/tor signaling leading to the production
    of ecdysone, a hormone required for the initiation of metamorphosis (PubMed:19965758).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08646
  source_id: P08646
