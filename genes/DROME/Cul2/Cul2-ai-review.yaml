gene_symbol: Cul2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cullin-2 (Cul2) is the scaffold of Cul2-RING ubiquitin ligases in Drosophila. Its N-terminal
  cullin-repeat region binds the Elongin B/C adaptor, which in turn binds BC-box substrate receptors such
  as Vhl (forming the VCB-Cul2 ligase that targets HIF-alpha/Sima) and C-degron receptors, while its C-terminal
  cullin homology domain binds the RING protein Roc1a that recruits the E2. Cul2 ligases act in the nucleus
  and cytoplasm. Genetic studies implicate Cul2 in limiting JAK/STAT signaling with Socs36E in egg-chamber
  border cell specification, in restricting niche Dpp/BMP signaling for germline stem cell differentiation
  in the ovary, in germline enclosure by somatic cyst cells in the testis, in female germline development
  and in larval neuromuscular junction organization. The host Cul2-EloB/C ligase is also hijacked by the
  Cricket paralysis virus 1A protein to degrade Argonaute-2.
