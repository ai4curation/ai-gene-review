      score: 3
    overall_notes: Correct but covers only the germarium/Dpp niche phenotype.
- source: Alliance_Automated
  text: Enables ubiquitin ligase complex scaffold activity. Involved in several processes,
    including growth of a germarium-derived egg chamber; male germ-line cyst encapsulation;
    and negative regulation of signal transduction. Located in perinuclear region
    of cytoplasm. Part of Cul2-RING ubiquitin ligase complex. Is expressed in several
    structures, including antennal disc; egg chamber; eye disc posterior to the morphogenetic
    furrow; germline cell; and organism subdivision. Orthologous to human CUL2 (cullin
    2).
  source_type: automated
  url: https://flybase.org/reports/Cul2.html
