descriptions:
- source: Alliance_Imported
  text: Cullin 2 (Cul2) encodes a protein that plays important roles during oogenesis.
    Reduction of the product of Cul2 in somatic cells produces tumorous germaria with
    excess germline stem cell-like cells due to the elevation of Dpp signaling in
    the niche.
  source_type: curated
  url: https://flybase.org/reports/Cul2.html
  source_id: FB:FBgn0032956
