  text: Predicted to enable H3-H4 histone complex chaperone activity. Predicted to
    contribute to histone binding activity. Involved in several processes, including
    DNA metabolic process; DNA replication-dependent chromatin assembly; and nucleosome
    assembly. Located in chromatin and nucleus. Part of CAF-1 complex. Human ortholog(s)
    of this gene implicated in colon cancer; high grade glioma; neuroblastoma; and
    systemic lupus erythematosus. Orthologous to human CHAF1A (chromatin assembly
    factor 1 subunit A).
