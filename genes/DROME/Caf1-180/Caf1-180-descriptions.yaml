descriptions:
- source: Alliance_Imported
  text: Chromatin assembly factor 1, p180 subunit (Caf1-180) encodes a component of
    the chromatin assembly factor-1, which couples DNA replication to histone deposition.
    The product of Caf1-180 is involved in nucleosome organization, DNA endoduplication
    and double-strand DNA break repair.
