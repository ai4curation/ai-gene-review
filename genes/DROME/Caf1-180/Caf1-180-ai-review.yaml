taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Caf1-180 (p180) is the large subunit of Drosophila chromatin assembly factor 1 (CAF-1), the
  heterotrimeric histone H3-H4 chaperone (Caf1-180, Caf1-105, Caf1-55) that deposits newly synthesized
  H3-H4 onto DNA behind the replication fork and at sites of DNA repair. Caf1-180 is the CHAF1A/Cac1 ortholog
  and scaffolds the complex by binding both Caf1-105 and Caf1-55. It is essential for Drosophila development
  and oogenesis, is required for efficient replication of euchromatin and normal nucleosome organization
  in endocycling cells, contributes to heterochromatic silencing and Polycomb-mediated cell fate maintenance,
  and supports recombinational repair of double-strand breaks. Human CHAF1A can substitute for it in vivo.
