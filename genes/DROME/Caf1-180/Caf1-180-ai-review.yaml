suggested_questions:
- question: Does the reduced heterochromatic silencing in p180 mutants reflect a direct role of CAF-1
    in recruiting HP1/heterochromatin factors, as for mammalian CHAF1A, or an indirect effect of defective
    replication-coupled assembly?
suggested_experiments:
- description: Separation-of-function p180 alleles disrupting PCNA binding versus HP1-interaction motifs,
    scored for S-phase chromatin assembly and position-effect variegation.
