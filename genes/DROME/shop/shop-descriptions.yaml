- source: Alliance_Automated
  text: Enables sulfite oxidase activity. Involved in intracellular sulfate ion homeostasis
    and sulfide oxidation. Is active in mitochondrion. Is expressed in adult head;
    embryonic hindgut; embryonic large intestine; embryonic/larval ensheathing glial
    cell; and embryonic/larval midgut. Used to study isolated sulfite oxidase deficiency.
    Human ortholog(s) of this gene implicated in inherited metabolic disorder and
    isolated sulfite oxidase deficiency. Orthologous to human SUOX (sulfite oxidase).
