- id: PMID:30158546
  title: >-
    The sulfite oxidase Shopper controls neuronal activity by regulating glutamate homeostasis in Drosophila
    ensheathing glia.
  findings:
  - statement: >-
      Shopper is a mitochondrial sulfite oxidase required in ensheathing glia; mutants have reduced SO
      activity, elevated sulfite and altered glutamate homeostasis affecting locomotion.
    supporting_text: >-
      In summary, these results demonstrate that the sulfite oxidase Shopper acts in ensheathing glial
      mitochondria to control larval locomotion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; primary characterization of shop.
- id: PMID:38416643
  title: >-
    Identifying potential dietary treatments for inherited metabolic disorders using Drosophila nutrigenomics.
  findings:
  - statement: >-
      shop mutants model isolated sulfite oxidase deficiency; dietary cysteine depletion rescues development
      and survival.
    supporting_text: >-
      We show that dietary cysteine depletion normalizes their metabolic profile and rescues development,
      neurophysiology, behavior, and lifelong fly survival
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; disease-model and diet study.
core_functions:
- description: >-
    Sulfite oxidase activity: molybdopterin-dependent oxidation of sulfite to sulfate in the mitochondrial
    intermembrane space, the terminal step of sulfur oxidation from cysteine and sulfide; required in
    ensheathing glia to keep sulfite low.
  molecular_function: *id003
  directly_involved_in:
  - *id002
  locations:
  - *id001
  supported_by:
  - reference_id: PMID:30158546
    supporting_text: >-
      The sulfite oxidase activity is drastically reduced upon lack of shopper either by ubiquitous suppression
      (Act5C-Gal4) or in shopper-deficient animals (Df(1)shopper+4) compared to controls.
  - reference_id: PMID:30158546
    supporting_text: >-
      shopper encodes a homolog of the human sulfite oxidase named SUOX, which localizes to the intermembrane
      space of mitochondria.
proposed_new_terms: []
suggested_questions:
- question: >-
    Why is Shopper function specifically required in ensheathing glia, and is sulfite toxicity or downstream
    glutamate imbalance the proximate cause of the locomotor defect?
suggested_experiments:
- description: >-
    Measure sulfite, thiosulfate and sulfate in glia-specific shop knockdown larvae by LC-MS and test
    rescue by targeting a heterologous sulfite oxidase to the intermembrane space.
  hypothesis: >-
    Sulfite accumulation in ensheathing glia, rather than sulfate deficiency, drives the shop phenotype.
