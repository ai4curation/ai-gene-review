taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  shop (shopper, CG7280) encodes the Drosophila melanogaster sulfite oxidase, a homolog of human SUOX.
  It is a molybdopterin- and heme-containing enzyme of the mitochondrial intermembrane space that oxidizes
  sulfite to sulfate, passing electrons via its cytochrome b5 domain to cytochrome c. It performs the
  terminal step of the oxidation of sulfur from cysteine catabolism and hydrogen sulfide. shop mutants
  have strongly reduced sulfite oxidase activity and elevated sulfite; Shopper is specifically required
  in ensheathing glia, where excess sulfite disturbs glutamate homeostasis and larval locomotion. shop
  mutants model isolated sulfite oxidase deficiency: they are sensitive to dietary cysteine, sulfite and
  thiosulfate, and a cysteine-depleted diet normalizes their metabolism and rescues development and survival.
