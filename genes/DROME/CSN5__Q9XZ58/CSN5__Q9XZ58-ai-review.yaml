- term:
    id: GO:0000338
    label: protein deneddylation
  evidence_type: IMP
  original_reference_id: PMID:12737805
  qualifier: involved_in
  review:
    summary: >-
      CSN4 and CSN5/Jab1 mutants were used to show that the CSN removes Nedd8 from Cullin1
      during Drosophila oogenesis. This is the direct biochemical process carried out by the
      CSN5-containing complex, and the JAMM motif of CSN5 is the catalytic center.
    action: ACCEPT
    reason: >-
      Direct in vivo evidence in this species that CSN5 loss blocks cullin deneddylation. CSN5
      supplies the active site of the isopeptidase (PMID:12183637), so it performs this process
      itself and does not merely regulate it. Core function.
    supported_by:
    - reference_id: PMID:12737805
      supporting_text: Using CSN4 and CSN5/Jab1 mutants, we show that the CSN acts during Drosophila
        oogenesis to remove Nedd8 from Cullin1, a subunit of the SCF ubiquitin ligase.
    - reference_id: PMID:12183637
      supporting_text: Metal chelators and point mutations within JAMM abolished CSN-dependent cleavage
        of Nedd8 from Cul1, yet had little effect on CSN complex assembly.
- term:
