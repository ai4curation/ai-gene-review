- term:
    id: GO:0032435
    label: negative regulation of proteasomal ubiquitin-dependent protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:17251548
  qualifier: involved_in
  review:
    summary: >-
      CSN5 knockdown in S2 cells (with cycloheximide chase) and csn5 heterozygous embryos
      showed that the COP9 signalosome protects Rbf1 and Rbf2 from proteasome-dependent
      degradation. Lactacystin reversed the loss of Rbf in csn5 mutant embryos.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported in this species and mechanistically plausible through the
      control of cullin-RING ligases, but specific to particular substrates. CSN-mediated
      deneddylation can increase or decrease the degradation of a given substrate. This is
      therefore a context-dependent regulatory outcome, not a core activity.
    supported_by:
    - reference_id: PMID:17251548
      supporting_text: The proteasome-mediated destruction of Rbf1 and Rbf2 is increased in cells and
        embryos with diminished COP9 activity, suggesting that the COP9 signalosome protects Rbf proteins
        during embryogenesis.
