- term:
    id: GO:0007409
    label: axonogenesis
  evidence_type: IMP
  original_reference_id: PMID:11779478
  qualifier: involved_in
  review:
    summary: >-
      In a set of CSN5 missense alleles, R1-R6 photoreceptor axon targeting to the lamina is
      disrupted. These R cells use lamina glia as intermediate targets, and CSN5 is required
      in R cells to induce the glial migration.
    action: KEEP_AS_NON_CORE
