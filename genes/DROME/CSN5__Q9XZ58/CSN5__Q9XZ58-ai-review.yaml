id: Q9XZ58
gene_symbol: CSN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CSN5 (also called Jab1; gene CG14884, formerly quo) is the catalytic subunit of the Drosophila
  COP9 signalosome (CSN), an eight-subunit complex related to the lid of the 26S proteasome. Its
  N-terminal MPN domain (residues 52-189) carries a JAMM metal-binding motif (His135, His137, Asp148)
  that forms the active site of the signalosome's NEDD8 isopeptidase. The complex removes NEDD8 from
  the cullin subunits of cullin-RING ubiquitin ligases such as SCF complexes. CSN5 has no isopeptidase
  activity on its own and needs the other signalosome subunits; it is also found as a free monomer or
  in smaller sub-complexes. In flies, point mutations in the JAMM motif abolish cullin-1 deneddylation,
  and csn5 mutants accumulate neddylated cullin-1. Through this control of cullin-RING ligase activity,
  CSN5 affects the stability of cell-cycle regulators, including the turnover of Cyclin E in early
  oogenesis and the protection of the retinoblastoma-family proteins Rbf1 and Rbf2 from proteasomal
  degradation. CSN5 is in the cytoplasm and the nucleus. Null alleles are larval lethal. Mutants have
  defects in oocyte meiotic progression and axis formation, female germline stem cell self-renewal,
  somatic support of the male germline, photoreceptor differentiation and the R-cell signal that
  induces lamina glial migration, and blood cell homeostasis (melanotic masses and excess
  lamellocytes). These phenotypes are thought to follow from altered cullin-RING ligase activity.
