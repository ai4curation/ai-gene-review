- term:
    id: GO:0140492
    label: metal-dependent deubiquitinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2389572
  - PANTHER:PTN000045368
  - SGD:S000001900
  - UniProtKB:O00487
  - UniProtKB:O15372
  - UniProtKB:P46736
  - UniProtKB:Q92905
  - UniProtKB:Q17QP9
  review:
    summary: >-
      Propagated from PTN000045368, a deep JAMM/MPN node above the CSN5 clade. Most of its
      donors are in other PANTHER subfamilies: PSMD14 (O00487, SF43), BRCC3 (P46736, SF34),
      EIF3H (O15372, SF3) and yeast RPN11 (SGD:S000001900). Human COPS5 (Q92905) is also a donor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The established substrate of the CSN5 catalytic site, in flies and in other species, is
      NEDD8 conjugated to cullins. The deNEDDylase activity on the CSN5-clade node
      (PTN000045369) captures that activity. GO:0140758 metal-dependent deNEDDylase activity
      is not a descendant of deubiquitinase activity; the two are sibling ubiquitin-like
      protein peptidase activities. There is no Drosophila evidence that CSN5 or the CSN
      cleaves ubiquitin conjugates, and the donor evidence for a deubiquitinase is concentrated
      in other subfamilies, the proteasome lid and BRISC/BRCA1-A deubiquitinases. Placing the
      deubiquitinase activity at the deep JAMM node is sound for those lineages, but for the
      CSN5 clade it over-states the function. The row is not removed, because mammalian COPS5
      is a donor and reported deubiquitinase activity of CSN5 in other contexts has not been
      excluded here. It is marked as over-annotated and should not be used as a basis for
      transfer.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000045368
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep JAMM/MPN node whose deubiquitinase donors are mainly in other PTHR10410 subfamilies (PSMD14 SF43, RPN11 SF5, BRCC3 SF34). The CSN5 clade (SF6, node PTN000045369) has NEDD8-cullin as its established substrate; no Drosophila evidence for ubiquitin cleavage.
    supported_by:
    - reference_id: file:DROME/CSN5__Q9XZ58/CSN5__Q9XZ58-bioinformatics/RESULTS.md
      supporting_text: Functions characterised in other subfamilies, such as the proteasomal deubiquitinase
        activity of PSMD14/RPN11 or the K63-specific deubiquitinase activity of BRCC3, are not subfamily
        functions of CSN5 and are not transferred on this basis.
    - reference_id: PMID:12183637
      supporting_text: COP9 signalosome (CSN) cleaves the ubiquitin-like protein Nedd8 from the Cul1
        subunit of SCF ubiquitin ligases.
- term:
    id: GO:0140758
    label: metal-dependent deNEDDylase activity
  evidence_type: IDA
  original_reference_id: PMID:12737805
  qualifier: enables
  review:
    summary: >-
      Csn5 mutant ovaries accumulate neddylated Cullin1, which shows that the CSN removes Nedd8
      from Cul1 in vivo. In combination with the JAMM mutagenesis in PMID:12183637, which
      included Drosophila Csn5 point mutants that abolish cul1 deneddylation, this establishes
      CSN5 as the metal-dependent catalytic subunit of the deNEDDylase.
    action: ACCEPT
    reason: >-
      The core molecular function, established experimentally in this species. As the subunit
      that carries the active site, CSN5 is appropriately annotated with enables, while noting
      that activity requires the assembled complex.
    supported_by:
    - reference_id: PMID:12737805
      supporting_text: we show that the CSN acts during Drosophila oogenesis to remove Nedd8 from Cullin1
    - reference_id: file:DROME/CSN5__Q9XZ58/CSN5__Q9XZ58-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: 'H->A: Abolishes ability to deneddylate cul1.'
    - reference_id: PMID:12183637
      supporting_text: Metal chelators and point mutations within JAMM abolished CSN-dependent cleavage
        of Nedd8 from Cul1
- term:
    id: GO:2000434
    label: regulation of protein neddylation
  evidence_type: NAS
  original_reference_id: PMID:10531038
  qualifier: involved_in
  review:
    summary: >-
      An author-statement annotation from the 1999 paper that first described the Drosophila
      signalosome. The paper predates the discovery that CSN is a NEDD8 isopeptidase.
    action: MODIFY
    reason: >-
      CSN5 does not regulate the conjugation of NEDD8 (neddylation). It catalyses the removal
      of NEDD8 from cullins, which is protein deneddylation. The essence of the claim (CSN5
      controls the neddylation state of cullins) is sound, but the correct process term is
      GO:0000338 protein deneddylation, which the gene already carries by IMP.
    proposed_replacement_terms:
    - id: GO:0000338
      label: protein deneddylation
    supported_by:
    - reference_id: PMID:12737805
      supporting_text: we show that the CSN acts during Drosophila oogenesis to remove Nedd8 from Cullin1
