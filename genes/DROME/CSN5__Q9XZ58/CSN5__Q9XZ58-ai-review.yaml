- term:
    id: GO:0007281
    label: germ cell development
  evidence_type: IMP
  original_reference_id: PMID:25459658
  qualifier: involved_in
  review:
    summary: >-
      RNAi knockdown of CSN subunits in the somatic support (cyst) cells of the testis
      disrupted enclosure of the germline and lowered the levels of the Jak/STAT effectors
      Zfh-1 and Chinmo in somatic cells next to the hub.
    action: KEEP_AS_NON_CORE
    reason: >-
      The requirement is non-autonomous: CSN acts in the somatic support cells, through
      distinct cullin-RING ligases (Cul1, Cul2), to maintain the environment that germ cells
      need. This is a real developmental role, but it is peripheral to the core deneddylase
      function. The more specific male germ-line cyst encapsulation annotation from the same
      paper describes the defect more precisely.
    supported_by:
    - reference_id: PMID:25459658
      supporting_text: Expression of RNA-hairpins against subunits of the COnstitutively Photomorphogenic-9-
        (COP9-) signalosome (CSN) in somatic support cells disrupted germline enclosure.
- term:
    id: GO:0007310
    label: oocyte dorsal/ventral axis specification
  evidence_type: IMP
  original_reference_id: PMID:12397113
  qualifier: involved_in
  review:
    summary: >-
      CSN5 mutations block Gurken accumulation and disrupt both oocyte axes. The phenotype is
      suppressed by mutations in mei-41 (the checkpoint kinase) or mei-W68 (needed to form
      meiotic double-strand breaks), so it results from activation of a meiotic DNA damage
      checkpoint.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Because loss of the DNA-break-forming or checkpoint machinery suppresses the axis
      defect, CSN5 is not part of the axis specification machinery. Its loss triggers a
      checkpoint that then blocks Gurken translation. This is an indirect, downstream
      phenotype, not participation in axis specification. The annotation is kept as a record
      of the genetic requirement but should not be treated as a CSN5 function or transferred
      to other species.
    supported_by:
    - reference_id: PMID:12397113
      supporting_text: Accordingly, the CSN5 phenotype is suppressed by mutations in mei-41 or by mutations
        in mei-W68, which is required for double strand break formation.
    - reference_id: PMID:12397113
      supporting_text: CSN5 regulates axis formation by checkpoint-dependent, translational control of
        Gurken.
