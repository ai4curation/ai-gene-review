core_functions:
- description: >-
    Provides the JAMM metal-dependent catalytic site of the COP9 signalosome's NEDD8 isopeptidase,
    which removes NEDD8 from the cullin subunits of cullin-RING ubiquitin ligases. This has been
    shown experimentally in Drosophila (JAMM point mutants; accumulation of neddylated Cul1 in
    csn5 mutants). The activity requires the assembled complex.
  molecular_function:
    id: GO:0140758
    label: metal-dependent deNEDDylase activity
  directly_involved_in:
  - id: GO:0000338
    label: protein deneddylation
  in_complex:
    id: GO:0008180
    label: COP9 signalosome
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12737805
    supporting_text: we show that the CSN acts during Drosophila oogenesis to remove Nedd8 from Cullin1
  - reference_id: PMID:12183637
    supporting_text: Metal chelators and point mutations within JAMM abolished CSN-dependent cleavage
      of Nedd8 from Cul1, yet had little effect on CSN complex assembly.
  - reference_id: PMID:10531038
    supporting_text: have shown by co-immunoprecipitation and gel-filtration analysis that these proteins
      are components of the Drosophila COP9 signalosome.
  - reference_id: file:DROME/CSN5__Q9XZ58/CSN5__Q9XZ58-bioinformatics/RESULTS.md
    supporting_text: His135, His137 and Asp148 are present
suggested_questions:
- question: Does the reported deubiquitinase activity of mammalian COPS5 have any counterpart in
    Drosophila CSN5, or is the metal-dependent deubiquitinase IBA from PTN000045368 an
    over-propagation onto the CSN5 clade that should be blocked at PTN000045369?
- question: Which phenotypes of csn5 mutants (hemocyte overproliferation, lamellocyte
    differentiation, Rbf stabilization) depend on cullin deneddylation, and which reflect
    CSN5 functions outside the holocomplex, given that CSN5 also exists as a monomer?
suggested_experiments:
- description: Rescue csn5-null animals with transgenes carrying the catalytically dead JAMM mutant
    (H135A/H137A or D148N) in comparison with wild-type CSN5, and score hemocyte, germline stem
    cell and Rbf-stability phenotypes. This would separate deneddylase-dependent roles from
    non-catalytic roles.
- description: Test reconstituted Drosophila CSN for isopeptidase activity on ubiquitin-conjugated
    substrates (K48 and K63 chains, monoubiquitinated proteins) side by side with NEDD8-Cul1,
    to resolve whether any deubiquitinase activity belongs to the CSN5 clade.
