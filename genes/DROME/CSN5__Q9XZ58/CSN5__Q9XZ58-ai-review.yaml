    label: compound eye photoreceptor cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:11779478
  qualifier: involved_in
  review:
    summary: >-
      Analysis of CSN5 protein-null alleles showed that the COP9 signalosome is required at an
      early stage of development for R-cell (photoreceptor) differentiation.
