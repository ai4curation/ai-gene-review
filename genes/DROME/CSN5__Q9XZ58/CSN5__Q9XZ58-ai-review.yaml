  qualifier: involved_in
  review:
    summary: >-
      csn5-null larvae have more hemocytes, and many of them have differentiated into
      lamellocytes, a cell type rarely seen in wild-type larvae. The authors conclude that CSN5
      negatively regulates hemocyte differentiation.
    action: KEEP_AS_NON_CORE
    reason: >-
      A loss-of-function phenotype interpreted as negative regulation. It is probably mediated
      by misregulated signalling (for example Toll/Dorsal or other cullin-RING ligase targets)
      and not by direct CSN5 action on a differentiation step. Kept as a non-core,
      tissue-specific role.
    supported_by:
