  - MGI:MGI:2443075
  - PANTHER:PTN000286163
  review:
    summary: >-
      PAINT inference from the CPEB family root node PTN000286163. The donors include mouse Cpeb1
      (MGI:108442), which sits in the same PANTHER subfamily (PTHR12566:SF9) as Orb, as well as
      Orb2 and mouse Cpeb2/Cpeb3 from other subfamilies. Orb is inside the clade that inherits this
      function and has no evidence of losing it. No cached study, however, shows Orb directly
      repressing translation in the fly. The fly work shows activation by polyadenylation. The
      repression seen in the fly orb autoregulatory loop is carried out by dFMR1, not Orb.
    action: KEEP_AS_NON_CORE
    reason: >-
      Repression of target mRNAs before activation is a well-known activity of CPEB1-subfamily
      proteins, and the IBA puts it at a node that includes the CPEB1 subfamily, so the inference
      is phylogenetically sound for Orb. It is kept as non-core because it is not experimentally
      established in Drosophila. The fly experiments show only activation by Orb (oskar, orb, aPKC
      targets), and anyone transferring function from Orb should know this activity rests on the
      vertebrate CPEB1 donors.
    supported_by:
    - reference_id: file:DROME/orb__Q9VCN7/orb__Q9VCN7-uniprot.txt
      supporting_text: PTHR12566:SF9; CYTOPLASMIC POLYADENYLATION ELEMENT-BINDING PROTEIN 1
    - reference_id: PMID:15737929
      supporting_text: We show that dFMR1 functions as a negative regulator in the orb autoregulatory
        circuit, downregulating orb mRNA translation.
