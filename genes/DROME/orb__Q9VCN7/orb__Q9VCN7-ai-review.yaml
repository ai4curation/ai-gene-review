core_functions:
- description: >-
    Binds cytoplasmic polyadenylation element-like sequences in the 3-prime UTRs of maternal mRNAs
    (oskar, aPKC, orb) in the oocyte cytoplasm and P-body-like sponge bodies. This specifies the
    targets for cytoplasmic poly(A)-tail elongation by canonical PAP and Wispy, which activates
    their localized translation. This activity is experimentally established in Drosophila.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0180011
    label: cytosolic mRNA polyadenylation
  - id: GO:0046012
    label: positive regulation of oskar mRNA translation
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:10525352
    supporting_text: the osk 3' UTR can be UV cross-linked to Orb protein in ovarian extracts
  - reference_id: PMID:27791065
    supporting_text: Both Orb and Orb2 bind linear cytoplasmic polyadenylation element-like sequences
      in the 3' UTRs of largely overlapping target mRNAs
  - reference_id: PMID:12538512
    supporting_text: We conclude that Orb-mediated cytoplasmic polyadenylation stimulates oskar
      translation
- description: >-
    Acts as a CPEB-family translation regulator that activates translation of oocyte-localized
    mRNAs, including positive autoregulation of orb mRNA. It works by associating with poly(A)
    polymerases in an ovarian complex and with mRNP partners such as Rasputin and dFMR1.
  molecular_function:
    id: GO:0045182
    label: translation regulator activity
  directly_involved_in:
  - id: GO:0045727
    label: positive regulation of translation
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15737929
    supporting_text: In Drosophila, Orb is responsible for mediating the translational activation of
      mRNAs localized within the developing oocyte.
  - reference_id: PMID:18434412
    supporting_text: Both Wispy and PAP interact with Orb genetically and physically in an ovarian
      complex.
suggested_questions:
- question: >-
    PAINT places translational repressor activity at the CPEB family root, and vertebrate CPEB1
    represses CPE-containing mRNAs before activating them. Does fly Orb also repress any target
    directly, for example in nurse cells or before oocyte localization, or is repression in the fly
    germline delegated to partners such as dFMR1, Bruno and Cup?
- question: >-
    Do the N-terminally distinct Orb isoforms (915-residue A/G versus 559-residue C/E) differ in
    localization, phosphorylation-dependent activation, or partner recruitment?
- question: >-
    Orb is described as germline-restricted, but Bgee reports testis expression. What is Orb's
    function in spermatogenesis, and does it use the same polyadenylation mechanism?
suggested_experiments:
- description: >-
    Tethering assays (MS2 or lambdaN-Orb on a reporter 3-prime UTR) in ovaries or S2 cells, with and
    without PAP or Wispy depletion. These would test directly whether Orb alone can repress
    translation of a non-polyadenylated reporter, and whether its activation needs poly(A)
    polymerase recruitment.
- description: >-
    Isoform-specific rescue of orb-null germlines with transgenes encoding only the 915-residue
    A/G product or only the 559-residue C/E product, assaying 16-cell cyst formation, oskar poly(A)
    length and Osk protein accumulation.
