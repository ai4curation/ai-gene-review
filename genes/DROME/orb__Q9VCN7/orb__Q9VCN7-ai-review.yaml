id: Q9VCN7
gene_symbol: orb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Orb (oo18 RNA-binding protein) is the single Drosophila member of the CPEB1 subfamily of
  cytoplasmic polyadenylation element-binding proteins. Q9VCN7 is the 915-residue product of orb
  isoforms A and G; it has a long, partly disordered N-terminal region followed by two RNA
  recognition motifs and a C-terminal ZZ-type zinc-binding domain. Orb is a germline protein. It is
  found in the cytoplasm of every cell of the 16-cell germline cyst and then becomes concentrated in
  the oocyte, in sponge bodies (P-body-like ribonucleoprotein granules) and nuage, and beneath the
  oocyte cortex. Orb binds cytoplasmic polyadenylation element-like sequences in the 3-prime UTRs of
  maternal mRNAs, including oskar, aPKC and its own orb transcript. It acts with canonical poly(A)
  polymerase and the GLD-2-type poly(A) polymerase Wispy, which co-purify with it in an ovarian
  complex, to lengthen the poly(A) tails of these mRNAs, and this activates their translation where
  they are localized. Orb also associates with dFMR1, Rasputin and other proteins in mRNP complexes;
  dFMR1 restrains translation of orb mRNA. Through this localized translational activation Orb is
  required for 16-cell cyst formation and oocyte differentiation, oskar protein accumulation at the
  posterior pole, gurken-dependent dorsoventral patterning, and repolarization of the oocyte
  cytoskeleton together with the Par proteins.
