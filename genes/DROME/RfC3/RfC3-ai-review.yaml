core_functions:
- description: RfC3 is one of the four AAA+ small subunits of the replication factor C clamp loader, which
    uses ATP to open PCNA and load it onto primer-template junctions so that polymerases delta and epsilon
    can elongate processively.
  contributes_to_molecular_function:
