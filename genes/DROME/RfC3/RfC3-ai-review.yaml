  - *id006
- description: With the large subunit Elg1, RfC3 forms the Elg1 RFC-like complex that unloads PCNA from
    DNA after replication; in Drosophila S2 cells this complex is bridged to the Enok acetyltransferase
    complex through Br140.
  contributes_to_molecular_function:
    id: GO:0061860
    label: DNA clamp unloader activity
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0031391
    label: Elg1 RFC-like complex
  supported_by:
  - *id008
  - reference_id: PMID:27198229
    supporting_text: knocking down elg1 using dsRNAs did not affect total PCNA levels but resulted in
      increases in the levels of both chromatin-bound PCNA and monoubiquitinated PCNA
    reference_section_type: RESULTS
suggested_questions:
- question: Does the Drosophila Ctf18-RFC complex exist and use the same four small subunits, and do the
    fly small subunits therefore contribute to cohesion establishment as in yeast?
- question: Which of the four small-subunit ATP sites are required for PCNA unloading by the Drosophila
    Elg1 complex, as opposed to loading by RFC?
suggested_experiments:
- description: Reconstitute Drosophila RFC and Elg1-RLC from recombinant subunits and measure PCNA loading
    and unloading on primed templates, testing Walker A/B mutants of each small subunit.
