gene_symbol: RfC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: RfC3 (annotated as activator 1 subunit 5; ortholog of human RFC5) is one of the four AAA+
  small subunits of replication factor C, the ATP-dependent clamp loader that opens the PCNA sliding clamp
  and loads it onto primer-template junctions for processive DNA synthesis by polymerases delta and epsilon.
  Like the other small subunits it is shared with the RFC-like complexes and co-purifies with Elg1 in
  the Drosophila Elg1 PCNA-unloader complex. It acts in the nucleus during DNA replication and repair
  synthesis.
