knowledge_gaps:
- gap_statement: The molecular activity of CG18507 is undetermined. Vertebrate TMEM268 stabilizes specific
    integrin subunits (ITGB4, CD11b) that have no fly ortholog, so whether the fly protein stabilizes
    any membrane protein, and which, is untested.
  boundary: CG18507 is a predicted two-helix membrane protein in the TMEM268 subfamily, and its mRNA
    is expressed in embryonic trachea under Trachealess control.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
- gap_statement: The membrane compartment and topology of CG18507, and the role of its fly-specific
    disordered N-terminal extension, are undetermined.
  boundary: Two transmembrane helices are predicted; human TMEM268 is seen in ER and plasma membrane.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
suggested_questions:
- question: Does CG18507 bind and stabilize any Drosophila integrin or other membrane protein, as
    TMEM268 does for ITGB4 and CD11b in mammals, or is the integrin-stabilizing role a vertebrate
    innovation?
- question: Is CG18507 required in the embryonic tracheal epithelium, where its mRNA is expressed
    under Trachealess control, or is that expression without a functional requirement?
suggested_experiments:
- description: Tag endogenous CG18507 (for example with a tag in a region shared by all isoforms)
    and determine its subcellular localization in embryonic trachea and cultured cells by co-staining
    with ER and plasma-membrane markers.
  experiment_type: localization
- description: Make a CG18507 null allele and score tracheal tube morphology, lumen maturation and
    viability, then test whether PS integrin surface levels change in mutant tissue.
  experiment_type: genetic loss-of-function
- description: Affinity-purify tagged CG18507 from fly tissue and identify co-purifying membrane proteins
    by mass spectrometry.
  experiment_type: interaction proteomics
