- id: PMID:21963537
  title: Trachealess (Trh) regulates all tracheal genes during Drosophila embryogenesis.
  findings:
  - statement: In an in situ screen of about 100 BDGP tracheal-expressed genes, tracheal expression
      of every gene examined was absent in trh mutants from late stage 12; 20 of 38 early-expressed
      genes required trh at all stages. The deep-research report places CG18507 (cDNA RE25285) in
      Table 1 of this screen among the early-expressed Trh-dependent genes; Table 1 is not present
      in the cached text and was not independently verified.
    supporting_text: We found that expression of 20 of the 38 early-expressed genes absolutely required
      trh at all stages.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PMID resolves to Chung, Chavez and Andrew 2011 (Dev Biol), full text cached. It is
      the only gene-specific experimental source found. It reports transcript expression and its
      genetic dependence on Trh, not a function of the CG18507 protein, so it supports no GO
      annotation. The CG18507 row lies in Table 1, which the cached text lacks.
- id: PMID:30361615
  title: Deletion of TMEM268 inhibits growth of gastric cancer cells by downregulating the ITGB4 signaling
    pathway.
  findings:
  - statement: Human TMEM268 localizes mainly to the endoplasmic reticulum and plasma membrane in gastric
      cancer cells, and its loss reduces cell-surface ITGB4.
    supporting_text: Immunofluorescence assay demonstrated that the TMEM268 protein was mainly present
      in the endoplasmic reticulum and plasma membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Experimental characterization of the human ortholog in the same PANTHER subfamily
      (PTHR31193:SF1). Used for family-level context only; the ITGB4 partner has no fly ortholog,
      so no partner-specific function is transferred.
- id: PMID:38730209
  title: Deletion of Tmem268 in mice suppresses anti-infectious immune responses by downregulating CD11b
    signaling.
  findings:
  - statement: Mammalian TMEM268 binds the C-terminus of CD11b and inhibits its endosomal-lysosomal
      degradation.
    supporting_text: Furthermore, the findings suggest that TMEM268 interacts with the C-terminus of
      CD11b and inhibits its degradation via the endosomal–lysosomal pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse and cell-based study of the vertebrate ortholog. CD11b (ITGAM) is a vertebrate
      leukocyte integrin with no Drosophila ortholog, so the stabilization mechanism is not transferred
      to CG18507.
- id: file:DROME/CG18507/CG18507-bioinformatics/RESULTS.md
  title: CG18507 vs TMEM268 isoform and ortholog comparison
  findings:
  - statement: All five CG18507 UniProt products share an identical N-terminal region including both
      transmembrane helices and differ only at the C-terminus; the conserved core (fly 227-399) aligns
      to human TMEM268 39-215 at 30.5% identity, and fly residues 1-226 have no vertebrate counterpart.
    supporting_text: M9PBB3 is a full-length alternative product of the gene, not a fragment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible script in the gene bioinformatics folder; sequences fetched live from
      UniProt.
- id: file:DROME/CG18507/CG18507-deep-research-falcon.md
  title: Falcon deep research report for CG18507
  findings: []
