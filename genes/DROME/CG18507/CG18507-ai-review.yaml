id: M9PBB3
gene_symbol: CG18507
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG18507 encodes the Drosophila member of the TMEM268 family (PANTHER PTHR31193, subfamily
  SF1; Pfam DUF4481), a predicted multi-pass membrane protein. The fly protein has a long,
  largely disordered and low-complexity N-terminal extension (about residues 1-226) that has no
  counterpart in vertebrate TMEM268, followed by a conserved core that aligns to human TMEM268
  and contains two predicted transmembrane helices (residues 292-310 and 316-339). The gene
  produces several alternative products that differ only at their C-termini. In the embryo,
  CG18507 mRNA is expressed in the developing tracheal system, where its expression depends on
  the bHLH-PAS transcription factor Trachealess. In mammals, TMEM268 localizes to the endoplasmic
  reticulum and plasma membrane and stabilizes integrin subunits (beta4 integrin in gastric cancer
  cells, CD11b in phagocytes) by limiting their degradation; flies lack orthologs of those
  integrin partners, and no molecular activity, partner, membrane compartment or loss-of-function
  phenotype has been established for CG18507 itself.
references:
- id: file:DROME/CG18507/CG18507-uniprot.txt
  title: DROME/CG18507/CG18507-uniprot.txt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact UniProt record for the benchmark accession; supplies the Phobius transmembrane
      helices, MobiDB-lite disordered regions and PANTHER/Pfam classification used here. The protein
