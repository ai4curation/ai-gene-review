core_functions:
- description: Rho-associated, non-catalytic adaptor that, by inheritance from the ancestral
    rhophilin shared with vertebrate RHPN1 and RHPN2, limits Rho-dependent actin stress-fiber
    assembly. The HR1 region is the predicted Rho-binding module and the BRO1 and PDZ domains
    the predicted effector-coupling surfaces; fly partners are unknown.
  directly_involved_in:
  - id: GO:0051497
    label: negative regulation of stress fiber assembly
  - id: GO:0007165
    label: signal transduction
  supported_by:
  - reference_id: PMID:25071083
    supporting_text: Taken together, these results indicate that Rhophilin-1 is an inhibitor of
      Rho-dependent stress fiber formation in vitro
  - reference_id: PMID:12221077
    supporting_text: the Bro1 and PDZ domains of Rhophilin-2 were required for disassembly
  - reference_id: file:DROME/Rhp/Rhp-uniprot.txt
    supporting_text: DR   InterPro; IPR011072; HR1_rho-bd.
suggested_questions:
- question: Does fly Rhp bind Rho1 through its HR1/REM-1 region, and is binding nucleotide-state
    selective as reported for mouse Rhophilin-1 or nucleotide-independent as reported for human
    RHPN1 and RHPN2?
- question: Mammalian rhophilin couples RhoA to STRIPAK and Hippo kinase activation (PMID:31792377).
    Does fly Rhp associate with fly STRIPAK, Merlin or Kibra?
suggested_experiments:
- description: Generate a CRISPR null allele of Rhp with genomic rescue, test the reported
    embryonic requirement, and examine actomyosin (phospho-Sqh, F-actin) organization in mutant
    epithelia and follicle cells; combine with Rho1-GTP pulldown of HR1 fragments and endogenous
    tagging to define localization.
