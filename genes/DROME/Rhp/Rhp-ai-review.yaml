- term:
    id: GO:0051497
    label: negative regulation of stress fiber assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1098783
  - PANTHER:PTN001126281
  - UniProtKB:Q8IUC4
  review:
    action: ACCEPT
    summary: Sound phylogenetic inference; both vertebrate paralogs that descend from the same
      ancestral node limit Rho-dependent stress-fiber formation, and fly Rhp is their
      pre-duplication co-ortholog.
    reason: The PAINT node PTN001126281 was seeded with experimental evidence from both
      vertebrate paralogs, mouse Rhpn1 (MGI:1098783) and human RHPN2 (Q8IUC4), each with an IDA
      for this term from PMID:25071083, and RHPN2 was earlier shown to disassemble stress fibres
      in HeLa cells in a Bro1- and PDZ-dependent manner (PMID:12221077). Because the activity is
      shared by both products of the vertebrate duplication, placing it at the ancestral node is
      appropriate, and fly Rhp (PANTHER SF15, outside the RHPN1 SF6 and RHPN2 SF5 subfamilies,
      about 35% identical to each, see file:DROME/Rhp/Rhp-bioinformatics/RESULTS-rereview.md)
      descends from that node. There is no fly evidence of loss or divergence, and the HR1, BRO1
      and PDZ domains that RHPN2 needs for this effect are all present. The only fly experiment, an
      S2-cell RNAi screen, found no effect on lamella formation, which is a Rac/Arp2/3 readout and
      does not test stress fibres, so it does not contradict the IBA. The mammalian evidence is
      from overexpression and podocyte knockout, so the fly role remains an inference.
    supported_by:
    - reference_id: PMID:25071083
      supporting_text: Taken together, these results indicate that Rhophilin-1 is an inhibitor of
        Rho-dependent stress fiber formation in vitro
    - reference_id: PMID:12221077
      supporting_text: Rhophilin-2-expressing HeLa cells showed a loss of actin stress fibers,
    - reference_id: PMID:12221077
      supporting_text: the Bro1 and PDZ domains of Rhophilin-2 were required for disassembly
    - reference_id: file:DROME/Rhp/Rhp-uniprot.txt
      supporting_text: DR   PANTHER; PTHR23031:SF15; LD12055P; 1.
    - reference_id: file:DROME/Rhp/Rhp-bioinformatics/RESULTS-rereview.md
      supporting_text: fly Rhp is roughly equidistant (34-36% identity) from both
