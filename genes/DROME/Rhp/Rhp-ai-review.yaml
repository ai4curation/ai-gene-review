  label: Drosophila melanogaster
description: Rhophilin is a multidomain Rho-effector-family protein containing HR1 Rho-binding, BRO1,
  and PDZ domains. This architecture supports a signaling scaffold associated with cytoskeletal regulation,
  while its exact partners and the conservation of stress-fiber regulation in Drosophila remain incompletely
  resolved.
