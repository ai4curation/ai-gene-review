gene_symbol: Rhp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rhp (CG8497) encodes Drosophila rhophilin, a 718-residue non-catalytic multidomain
  protein with an N-terminal HR1/REM-1 Rho-binding region, a central BRO1-like domain and a C-terminal
  PDZ domain. It is the single fly member of the rhophilin family and is phylogenetically a
  pre-duplication co-ortholog of vertebrate Rhophilin-1 and Rhophilin-2. By homology with those
  proteins, which bind RhoA through the HR1 region and, when expressed in cultured cells, limit
  Rho-dependent actin stress-fiber formation in a manner that needs the BRO1 and PDZ domains, Rhp
  is inferred to act as a Rho-associated adaptor that restrains contractile actomyosin
  structures. No direct biochemical, localization or mechanistic study of the fly protein has
  been published; in an S2-cell RNAi screen its depletion did not visibly affect lamella
  formation.
existing_annotations:
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011072
  review:
    action: ACCEPT
    summary: Broad but defensible; the HR1 Rho-binding module places Rhp in Rho-family GTPase
      signalling as a downstream adaptor.
    reason: The InterPro2GO mapping derives from the HR1 Rho-binding domain (IPR011072), present
      in Rhp (REM-1 domain, residues 36-110). Vertebrate rhophilins bind RhoA through this
      region and act downstream of it, so participation in signal transduction is a sound
      family-level inference. A more specific term (e.g. Rho protein signal transduction) is not
      supported for the fly protein because no fly Rho1 interaction has been shown, so this
      general term is as precise as the evidence allows. It is not a claim of GTPase or GEF/GAP
      activity.
    supported_by:
    - reference_id: file:DROME/Rhp/Rhp-uniprot.txt
      supporting_text: DR   InterPro; IPR011072; HR1_rho-bd.
