core_functions:
- description: Myristoylated peripheral membrane protein of the medial and trans Golgi, inferred from
    HID1 orthologs, that supports maturation of dense-core secretory granules formed at the trans-Golgi
    network, including immature-granule homotypic fusion, cargo sorting and TGN acidification. No intrinsic
    molecular activity is known.
  directly_involved_in:
  - id: GO:0061792
    label: secretory granule maturation
  locations:
