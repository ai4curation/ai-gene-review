- term:
    id: GO:0061792
    label: secretory granule maturation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2445087
  - PANTHER:PTN001090684
  review:
    action: ACCEPT
    summary: Secretory granule maturation is the best-characterized metazoan HID1 function and is inherited
      by CG8841 from a PAINT node below the eukaryote root.
    reason: PAINT placed this term at PTN001090684, a node distinct from the eukaryote-level PTN000491103
      from which CG8841 also descends (GOA propagates it to the fly protein), seeded by mouse Hid1, whose beta-cell knockout blocks homotypic fusion of
      immature secretory granules (PMID:27751232). Rat HID-1 knockout cells show defective dense-core
      vesicle formation and TGN acidification (PMID:29074564), and C. elegans HID-1 is a component of
      the dense-core-vesicle neurosecretory pathway (PMID:21115972). CG8841 is within SF12 and about
      69% identical to mouse Hid1; the IBA is accepted as the core inferred process, while recognising
      that no Drosophila experiment has tested it.
    supported_by:
    - reference_id: PMID:27751232
      supporting_text: HID-1 deficiency prevented secretory granule maturation by blocking homotypic fusion
        of immature secretory granules
    - reference_id: PMID:29074564
      supporting_text: HID-1 KO cells also exhibit defects in TGN acidification together with mislocalization
        of the Golgi-enriched vacuolar H+-ATPase subunit isoform a2.
    - reference_id: PMID:21115972
      supporting_text: our findings indicate that HID-1 is a novel component of a DCV-based neurosecretory
        pathway
