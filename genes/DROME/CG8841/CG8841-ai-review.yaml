id: Q0E9B5
gene_symbol: CG8841
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG8841 encodes the Drosophila HID1 protein, an 837-residue member of the conserved HID1/Ecm30
  family (PANTHER PTHR21575:SF12) that is about 69% identical to mammalian HID1 and retains the N-terminal
  Gly2 myristoylation motif and the conserved C-terminal region. It is unrelated to the DMC1 meiotic
  recombinase despite carrying Dmc1 as a database gene name. By orthology to experimentally studied HID1
  proteins, it is expected to be a myristoylated peripheral membrane protein that cycles between the
  cytosol and the cytosolic face of the medial and trans Golgi, where it supports Golgi organization and,
  in neuroendocrine and peptidergic cells, the biogenesis and maturation of dense-core secretory granules,
  including trans-Golgi network acidification, cargo sorting and homotypic fusion of immature granules.
  No catalytic or specific binding activity is known for any HID1 protein, and the fly protein has not
  itself been studied experimentally.
