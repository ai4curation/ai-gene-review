product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG8841 is an HID1/Ecm30-family protein associated by phylogenetic and similarity inference
  with Golgi organization, intracellular protein transport, and secretory-granule maturation. Its likely
  role is in secretory-pathway membrane organization rather than DNA recombination, despite the historical
  Dmc1 alias; its molecular activity is unresolved.
