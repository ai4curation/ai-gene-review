- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8IV36
  review:
    action: KEEP_AS_NON_CORE
    summary: HID1 orthologs influence sorting of secretory cargo at the trans-Golgi network, which is a
      form of intracellular protein transport, but the mechanism is unresolved.
    reason: Loss of HID-1 in rat neuroendocrine cells impairs sorting of regulated-secretory cargo and
      dense-core formation (PMID:29074564), and the human localization study proposed a role in intra-Golgi
      trafficking (PMID:21337012). Whether HID1 participates directly in a transport step or acts indirectly
      through TGN acidification is not known, so a more specific transport term is not justified. The
      broad term is kept as non-core; the granule-maturation term better captures the core role.
    supported_by:
    - reference_id: PMID:29074564
      supporting_text: Loss of HID-1 causes a reduction in the number of LDCVs and affects their morphology
        and biochemical properties, due to impaired cargo sorting and dense core formation.
    - reference_id: PMID:21337012
      supporting_text: We propose that HID-1 is probably involved in the intracellular trafficking within
        the Golgi region.
