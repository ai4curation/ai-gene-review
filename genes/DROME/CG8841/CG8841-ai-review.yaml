  supporting_entities:
  - PANTHER:PTN000491103
  - PomBase:SPAC17A5.16
  review:
    action: KEEP_AS_NON_CORE
    summary: Golgi organization is an ancestral HID1-family role inherited from the eukaryote-level node.
    reason: PAINT placed this term at the eukaryote node PTN000491103 seeded by the fission-yeast Golgi-resident
      HID1 ortholog SPAC17A5.16, whose mutant lacks stacked Golgi (PMID:40899782); negations were applied
      only to fungal clades. CG8841 descends from this node, so the inheritance is retained. The seed
      is distant (about 26-30% identity to CG8841) and no metazoan Golgi-structure phenotype is documented
      in the cited evidence, so the term is kept as a non-core family-level role rather than the core
      metazoan function.
    supported_by:
    - reference_id: PMID:40899782
      supporting_text: Transmission electron microscopy revealed that the SPAC17A5.16 mutant lacks a stacked
        Golgi apparatus (GA) form, suggesting a role in maintaining GA structure.
    - reference_id: file:DROME/CG8841/CG8841-bioinformatics/RESULTS.md
      supporting_text: Fungal members of the same subfamily are much more distant (25-30%)
