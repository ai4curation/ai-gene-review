    label: Golgi membrane
  - id: GO:0005797
    label: Golgi medial cisterna
  - id: GO:0000138
    label: Golgi trans cisterna
  supported_by:
  - reference_id: PMID:27751232
    supporting_text: HID-1 deficiency prevented secretory granule maturation by blocking homotypic fusion
      of immature secretory granules
  - reference_id: PMID:21337012
    supporting_text: mammalian HID-1 localized to the medial- and trans- Golgi apparatus as well as the
      cytosol
  - reference_id: file:DROME/CG8841/CG8841-bioinformatics/RESULTS.md
    supporting_text: CG8841 is a full-length HID1 protein, about 69% identical to the mammalian HID1
suggested_questions:
- question: Does CG8841 localize to the medial/trans Golgi in Drosophila peptidergic neurons and endocrine
    cells, and is this localization dependent on Gly2 myristoylation?
- question: What is the molecular activity of HID1 proteins, for example whether they position the V-ATPase
    a2 subunit at the trans-Golgi network directly or act through another partner?
suggested_experiments:
- description: Generate a CG8841 null allele and a Gly2-to-Ala rescue construct, and assay dense-core-vesicle
    number, neuropeptide storage and release, and Golgi-associated V-ATPase a-subunit localization in
    peptidergic neurons or the larval ring gland.
