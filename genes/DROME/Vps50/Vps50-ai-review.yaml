gene_symbol: Vps50
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps50 (CG4996; also called Vps54L, ortholog of human VPS50/syndetin/CCDC132) is the subunit
  that defines the endosome-associated recycling protein (EARP) complex. It is distantly related to Vps54
  and replaces it on the shared Vps51-Vps52-Vps53 core, converting the Golgi-associated GARP tether into
  an endosomal tether. In Drosophila S2 cells Vps50 co-purifies with Vps51-Vps53 as an effector of GTP-bound
  Rab4 and Rab14, co-localizes with Rab4 on endosomes and co-precipitates with Vps52 and Vps53. By analogy
  with mammalian syndetin, EARP engages the SNARE syntaxin 6 and supports recycling of internalized cargo
  from endosomes to the plasma membrane, rather than endosome-to-Golgi retrograde traffic.
