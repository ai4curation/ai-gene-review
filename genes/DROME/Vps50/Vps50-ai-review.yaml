suggested_questions:
- question: Which cargoes depend on Vps50/EARP for recycling in Drosophila tissues, and does fly EARP
    function in dense-core vesicle maturation in neurons as reported for worm and mouse EARP?
suggested_experiments:
- description: Generate Vps50 null flies and measure recycling of endocytosed cargo (e.g. in nephrocytes
    or S2 cells) and Rab4-endosome morphology, contrasting with scat (GARP) mutants.
