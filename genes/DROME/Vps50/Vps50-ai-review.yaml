  review:
    summary: Vps50 is part of the Vps54-free form of GARP described as GARPII, which corresponds to EARP.
    action: MODIFY
    reason: The cited paper found CG4996 co-purifying with Vps51-53 in place of Vps54 and named the resulting
      complex GARPII. This complex was subsequently defined in mammals as EARP, which has its own GO term
      (GO:1990745); GARP complex (GO:0000938) refers to the Vps54-containing complex. The correct location
      for Vps50 is EARP complex.
