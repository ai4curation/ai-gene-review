  review:
    summary: Endosome-to-Golgi retrograde transport is the function of GARP (Vps54), not of Vps50-containing
      EARP.
    action: MARK_AS_OVER_ANNOTATED
    reason: Depletion of syndetin, the human Vps50 ortholog, did not affect retrograde transport of Shiga
      toxin B subunit to the Golgi or TGN46 localization; the retrograde process belongs to GARP, which
      contains Vps54/scat instead of Vps50. The IEA (InterPro IPR040047) and NAS rows transfer a GARP
      property to the EARP-specific subunit.
