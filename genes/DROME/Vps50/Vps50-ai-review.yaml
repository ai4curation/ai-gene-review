core_functions:
- description: As the defining subunit of the EARP tethering complex, Vps50 directs the shared Vps51-Vps52-Vps53
    core to Rab4-positive endosomes and contributes to tethering of carriers that recycle internalized
    cargo to the plasma membrane.
