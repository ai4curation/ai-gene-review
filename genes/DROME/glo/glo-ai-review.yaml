    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:16516833
  review:
    summary: The cytoplasmic pool, in the oocyte and in nurse cells, is where Glo represses nanos translation.
    action: NEW
    reason: Glo is both nuclear and cytoplasmic (PMID:19013444, citing Kalifa et al. 2006). It represses
