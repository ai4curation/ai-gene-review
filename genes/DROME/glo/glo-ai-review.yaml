id: Q8INJ6
gene_symbol: glo
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Glorund is an RNA-binding regulator of translation and RNA processing in Drosophila oogenesis.
  The Q8INJ6 isoform-C record is a short 179-residue RRM-containing product, whereas gene-level experiments
  establish repression of nanos translation, association with Hrp48 and Half-pint, and roles in oocyte
  RNA localization. Which of these activities and localizations are retained by this short isoform remains
  unresolved.
