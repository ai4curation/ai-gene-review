- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:16516833
  qualifier: involved_in
  review:
    summary: Glo is a translational repressor of unlocalized nanos mRNA in late oogenesis. The direction
      of regulation is known, so negative regulation of translation is the more precise term.
    action: MODIFY
    reason: Loss of glo derepresses nanos translation in late oocytes (PMID:16516833, PMID:28380354). Glo
      blocks translation initiation and also imposes a post-initiation block (PMID:21460235). The
      post-initiation block involves recruiting dFMRP to inhibit elongation (PMID:35699205). The direction
      is unambiguously negative, so the term should be refined to negative regulation of translation (GO:0017148).
      Glo does this work itself, because its qRRMs bind the TCE. This applies to the gene's long product.
      Isoform C, with one complete qRRM, is not expected to repress nanos alone (PMID:37427795).
    proposed_replacement_terms:
    - id: GO:0017148
      label: negative regulation of translation
    supported_by:
    - reference_id: PMID:16516833
      supporting_text: reveal a specific role for an hnRNP in repression of nanos translation during oogenesis
    - reference_id: PMID:21460235
      supporting_text: Furthermore, we show that, during late oogenesis, nos translation is also repressed
        post-initiation and provide evidence that Glo mediates this event.
    - reference_id: PMID:35699205
      supporting_text: Our findings suggest that Glo regulates nos translation elongation by recruiting dFMRP
