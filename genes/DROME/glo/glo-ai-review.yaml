      text is not wrong, but Otu-104 partly rescues it, which places Glo upstream through regulation of
      ovarian tumor splicing rather than as a chromatin-organizing factor. The review therefore keeps the
      phenotype in the description and marks the chromosome-organization annotation as over-annotated. Gene-level
      text; the 179-residue isoform C reviewed here is not expected to carry these functions by itself.
core_functions:
- description: >-
    Sequence- and structure-selective binding of the nanos 3' UTR translational
    control element, through G-tract and UA-rich-stem recognition by at least two
    qRRMs. This binding represses translation of unlocalized nanos mRNA in the
    late oocyte cytoplasm, at initiation and post-initiation (dFMRP recruitment).
    This is a property of the long three-qRRM product. Isoform C (Q8INJ6) has one
    complete qRRM and is not expected to perform it alone.
  molecular_function:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  directly_involved_in:
  - id: GO:0017148
    label: negative regulation of translation
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:28380354
    supporting_text: both modes of RNA recognition are required for translational repression of nos during
      oogenesis
  - reference_id: PMID:37427795
    supporting_text: at least two qRRMs are required for TCE recognition and translational repression of
      nos in vivo
  - reference_id: PMID:35699205
    supporting_text: Our findings suggest that Glo regulates nos translation elongation by recruiting dFMRP
- description: >-
    G-tract RNA binding. Each qRRM, including qRRM1, the one complete in isoform C,
    binds single-stranded G-tract RNA independently. In the nucleus, Glo associates
    directly with Hrp48 and Half-pint, probably to regulate alternative splicing of
    ovarian tumor. This G-tract-mode activity is needed for nurse-cell chromosome
    dispersion and gurken localization.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:28380354
    supporting_text: We conclude that, like hnRNP F qRRMs, Glo qRRMs are each capable of interacting with
      G-tract RNA.
  - reference_id: PMID:28380354
    supporting_text: regulation of Glo target RNAs required for chromosome organization and grk regulation
      specifically require the G-tract RNA binding mode
  - reference_id: PMID:19013444
    supporting_text: probably by regulating alternative splicing of ovarian tumor
  - reference_id: file:DROME/glo/glo-bioinformatics/RESULTS-rereview.md
    supporting_text: Q8INJ6 contains all of qRRM1, only 27 residues (142-168) of qRRM2, and none of qRRM3
      or the glycine-rich region.
suggested_questions:
- question: Is Glorund isoform C (Q8INJ6, with one complete qRRM plus 27 residues of qRRM2) made as a
    stable protein, and does it act as a dominant-negative competitor of full-length Glo for G-tract targets?
- question: Does Glo bind otu pre-mRNA directly, or is otu splicing regulated indirectly through Half-pint?
    The answer would decide whether a splicing-regulation process term (for example GO:0000381) is warranted.
suggested_experiments:
- description: Express tagged isoform C (Q8INJ6) in glo mutant ovaries and test nanos co-immunoprecipitation,
    Nos repression, and rescue of nurse-cell chromosome dispersion and gurken localization. Compare with
    the full-length product.
  experiment_type: transgenic rescue / RNA immunoprecipitation
- description: CLIP or RIP-seq of endogenous Glo in ovaries to identify otu and other G-tract targets.
  experiment_type: CLIP-seq
