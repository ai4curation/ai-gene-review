    summary: Germline glo clones give dorsal-ventral polarity defects through gurken mislocalization. This
      is a genuine germline requirement, but it is downstream of Glo's RNA-processing role, probably otu
      splicing.
    action: KEEP_AS_NON_CORE
    reason: Germline clones of glo162x produce dorsal-ventral polarity defects and mislocalized gurken (PMID:19013444).
