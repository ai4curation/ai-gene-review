- term:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  evidence_type: IDA
  original_reference_id: PMID:28380354
  review:
    summary: Glo binds the translational control element in the nanos 3' UTR directly in vitro, and binds
      nanos mRNA in vivo.
    action: NEW
    reason: The direct ligand of Glo's best-characterized activity is a defined 3'-UTR element. Kalifa et
      al. identified Glo by its specific binding to TCE stem-loop III (PMID:16516833). Tamayo et al. showed
      by EMSA that Glo qRRM1,2 binds the TCE through the TCEI G-tract and the TCEIII UA-rich stem, and that
      both are needed in vivo (PMID:28380354). Warden et al. confirmed in vivo association with nanos mRNA
      (PMID:37427795). This term is more specific than the existing mRNA binding term. It describes the
      long product, because isoform C, with one complete qRRM, is not expected to bind the TCE stably.
    supported_by:
    - reference_id: PMID:28380354
      supporting_text: Glo qRRM1,2 did bind stably to the TCE, with two plateaus apparent in the binding curve
    - reference_id: PMID:16516833
      supporting_text: Here we identify a Drosophila hnRNP, Glorund, that interacts specifically with stem-loop
        III.
- term:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  evidence_type: IMP
  original_reference_id: PMID:28380354
  review:
    summary: Glo represses nanos translation by binding the TCE in its 3' UTR. Mutations that remove either
      RNA-binding mode abolish repression in vivo, which matches this molecular function.
    action: NEW
    reason: GO:0000900 combines sequence-element binding with translational repression. Glo binds the nanos
      TCE (PMID:16516833, PMID:28380354). Triple point mutants that remove either binding mode (GloWYY, GloRKH)
      fail to repress nanos even though they are expressed at normal levels (PMID:28380354). Mutating both
      Glo recognition motifs in the TCE disrupts repression (PMID:28380354). Repression needs at least two
      intact qRRMs (PMID:37427795). Glo is therefore the factor that binds the element and causes repression,
      not merely a requirement for it. This is the core activity of the full-length gene product, not of
      the one-qRRM isoform C.
    supported_by:
    - reference_id: PMID:28380354
      supporting_text: both modes of RNA recognition are required for translational repression of nos during
        oogenesis
    - reference_id: PMID:37427795
      supporting_text: at least two qRRMs are required for TCE recognition and translational repression of
        nos in vivo
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:16516833
  review:
    summary: Glo is detected in the nuclei and cytoplasm of nurse cells, the oocyte and follicle cells.
    action: NEW
    reason: The 2009 study, citing antibody staining by Kalifa et al. 2006, states that Glo is nuclear and
      cytoplasmic and proposes a nuclear Glo-Hrp48-Hfp splicing complex (PMID:19013444). The nuclear pool
      matches its proposed role in otu splicing and its requirement for nurse-cell chromosome dispersion.
      The canonical long product carries an IBA for nucleoplasm from the hnRNP F/H clade node PTN000360053.
      This localization is established for the gene's long product. It is not mapped to isoform C, which
      has not been localized.
    supported_by:
    - reference_id: PMID:19013444
      supporting_text: whereas Glo and Hrp48 are both nuclear and cytoplasmic
