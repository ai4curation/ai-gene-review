id: Q8INJ6
gene_symbol: glo
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Glorund (Glo, CG6946) is a Drosophila RNA-binding protein of the hnRNP F/H-like
  group within the ESRP/hnRNP H/F family (PANTHER PTHR13976). The long product
  (Q9VGH5, 586 residues) has three quasi-RNA-recognition motifs (qRRMs) separated
  by a glycine/asparagine-rich region. Each qRRM binds single-stranded G-tract RNA,
  and each also has a basic RNP2 surface that recognizes a double-stranded UA-rich
  motif. In late oogenesis Glo binds the translational control element (TCE) in the
  nanos 3' UTR, using both binding modes and at least two qRRMs. It represses
  translation of the unlocalized nanos mRNA at initiation and after initiation,
  the latter in part by recruiting dFMRP through qRRM2. This restricts Nanos
  protein to the posterior pole. Glo is found in the nucleus and cytoplasm of nurse
  cells, the oocyte and follicle cells. It binds the hnRNP Hrp48 and the splicing
  factor Half-pint, and probably regulates alternative splicing of ovarian tumor.
  Through this activity, which needs only the G-tract binding mode, it is required
  for nurse-cell chromosome dispersion, gurken mRNA localization and
  dorsal-ventral patterning. Knockdown studies also implicate glo in lipid storage
  and in expression of lipoprotein genes in the fat body and intestine.
  Q8INJ6 is isoform C, a 179-residue product: residues 1-168 match the long
  product, followed by an 11-residue unique tail. It has a complete qRRM1, only the
  first 27 residues of qRRM2, no qRRM3 and no glycine-rich region. A Glo protein
  with a single intact qRRM does not bind or repress nanos in vivo, so isoform C
  alone is not expected to carry out nanos repression. Its own expression and
  activity have not been tested.
