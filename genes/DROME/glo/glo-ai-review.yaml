- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: ISS
  original_reference_id: PMID:10908586
  qualifier: enables
  review:
    summary: Glo is a direct mRNA-binding protein. It binds the nanos 3' UTR TCE in vitro and in vivo. The
      cited genome survey does not discuss Glo, but direct evidence supports the claim.
    action: ACCEPT
    reason: The ISS rests on a genome-wide survey of RNA-binding proteins (PMID:10908586) that does not
      name Glorund. Later direct experiments confirm the claim. Recombinant Glo binds nanos TCE RNA, and
      binding correlates with repression in vivo (PMID:16516833). Tandem qRRM1,2 binds the TCE with two
      affinity components (PMID:28380354). GFP-Glo co-immunoprecipitates nanos mRNA in vivo when at least
      two qRRMs are intact (PMID:37427795). This is a gene-level claim. A product with a single intact qRRM,
      like isoform C, did not co-immunoprecipitate nanos, so this row should not be read as an
      isoform-C-specific measurement. More specific mRNA 3'-UTR binding is proposed as NEW.
    supported_by:
    - reference_id: PMID:16516833
      supporting_text: We establish that the ability of the TCE to repress translation in vivo reflects
        its ability to bind Glorund in vitro.
    - reference_id: PMID:37427795
