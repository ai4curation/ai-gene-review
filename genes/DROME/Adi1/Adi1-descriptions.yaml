descriptions:
- source: UniProt
  text: Catalyzes 2 different reactions between oxygen and the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene
    (DHK-MTPene) depending upon the metal bound in the active site. Fe-containing
    acireductone dioxygenase (Fe-ARD) produces formate and 2-keto-4- methylthiobutyrate
    (KMTB), the alpha-ketoacid precursor of methionine in the methionine recycle pathway.
    Ni-containing acireductone dioxygenase (Ni-ARD) produces methylthiopropionate,
    carbon monoxide and formate, and does not lie on the methionine recycle pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q6AWN0
  source_id: Q6AWN0
