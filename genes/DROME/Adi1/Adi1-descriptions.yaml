    overall_notes: Accurate on the metal-dependent dual reactions (Fe-ARD in methionine
      salvage, Ni-ARD off-pathway).
- source: Alliance_Imported
  text: Acireductone dioxygenase 1 (Adi1) encodes an enzyme that catalyzes the Fe-dependent
    oxidative cleavage of 1,2-dihydroxy-5-(methylsulfanyl)pent-1-en-3-one to produce
    formate and 4-methylsulfanyl- 2-oxobutanoate, the keto-acid precursor of L-methionine
    in the L-methionine salvage pathway (MTA cycle). Adi1 can also catalyzes the Ni-dependent
    oxidative cleavage of 1,2-dihydroxy-5-(methylsulfanyl)pent-1-en-3-one to produce
    3-(methylsulfanyl)propanoate and formate.
  source_type: curated
  url: https://flybase.org/reports/Adi1.html
  source_id: FB:FBgn0052068
