id: Q6AWN0
gene_symbol: Adi1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Adi1 (DADI1, CG32068) encodes the acireductone dioxygenase of Drosophila melanogaster, a cupin-fold
  metalloenzyme that catalyses the last oxidative step of the methionine salvage (MTA) cycle. With Fe2+
  in the active site it converts the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene and O2 into
  formate and 4-methylthio-2-oxobutanoate, the 2-oxo acid precursor that is transaminated to methionine;
  with Ni2+ bound it instead produces 3-methylthiopropionate, CO and formate, an off-pathway reaction.
  Adi1 mutant females have reduced egg production under dietary restriction, altered ovarian methionine
  metabolism, and are rescued by the fly or human enzyme (but not a catalytically dead human mutant) or
  by dietary methionine, showing that methionine salvage supports fecundity when dietary methionine is
  limiting.
