- term:
    id: GO:2000243
    label: positive regulation of reproductive process
  evidence_type: IMP
  original_reference_id: PMID:25037729
  qualifier: involved_in
  review:
    summary: Adi1 mutant females lay fewer eggs under dietary restriction (CACAO annotation).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The fecundity defect is fully rescued by dietary methionine, so Adi1 supports egg production by
      supplying methionine, not by regulating the reproductive process. This is a necessity (metabolic
      supply) relationship, not a regulatory role; the paper's own wording ("regulation of methionine
      metabolism") refers to metabolism, not reproduction.
    supported_by:
    - reference_id: PMID:25037729
      supporting_text: 4 mM methionine to the fly food completely rescued the fecundity defect (Figure
        4)
