suggested_questions:
- question: >-
    What metal occupies the fly Adi1 active site in vivo, and does the Fe/Ni ratio change with diet or
    tissue?
- question: >-
    Why is methionine salvage required for fecundity only under dietary restriction, and which ovarian
    cell types depend on it?
suggested_experiments:
- description: >-
    Purify Adi1 from fly ovaries and determine bound metal by ICP-MS; assay KMTB versus methylthiopropionate
    production.
  hypothesis: Fly Adi1 is predominantly the Fe-form and produces the methionine precursor in vivo.
