  title: ADI1, a methionine salvage pathway enzyme, is required for Drosophila fecundity.
  findings:
  - statement: >-
      Adi1 (DADI1) mutant females show reduced fecundity under dietary restriction, rescued by fly or
      catalytically active human ADI1 or by dietary methionine; ovarian methionine metabolism is altered.
    supporting_text: >-
      Based on these data, we concluded that human ADI1 is functionally interchangeable with Drosophila
      ADI1 and that the enzymatic activity of ADI1 is essential for normal egg production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; only fly functional study of Adi1.
