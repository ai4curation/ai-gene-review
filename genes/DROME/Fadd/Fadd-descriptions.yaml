    - rubric: specificity
      score: 4
    overall_notes: Imd pathway role against Gram-negative bacteria and Dredd binding and processing
      are correct. Gives as much weight to Dredd-induced apoptosis, an overexpression result,
      as to the immune role; omits the Imd death-domain interaction and the dSTING antiviral
      role.
