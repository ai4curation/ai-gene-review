descriptions:
- source: UniProt
  text: Component of the IMD signaling pathway and is required for the host defense against
    Gram-negative bacteria. Interacts with Dredd, promotes cleavage of Dredd and is necessary
    and sufficient for enhancing Dredd-induced apoptosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V3B4
  source_id: Q9V3B4
