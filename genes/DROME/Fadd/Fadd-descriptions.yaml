findings:
- category: discrepancy
  text: The automated text says Fadd enables CARD domain binding; Fadd binds the Dredd prodomain
    through a death effector domain interaction (PMID:22549468, PMID:41904322), and the Dredd
    prodomain is not a CARD.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source describes the recruitment of Fadd to activated dSTING, where Fadd and Dredd
    are required for Relish activation and antiviral defense (PMID:41904322).
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- category: insight
  text: UniProt's emphasis on Dredd-induced apoptosis reflects the mammalian FADD paradigm;
    flies lack death-domain receptors and Eiger-induced death is Dredd-independent (PMID:12176339),
    so the main fly role of Fadd is NF-kappaB (Relish) signalling.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All texts agree that Fadd acts in the Imd antibacterial pathway between Imd
    and Dredd; the curated texts are accurate, and the automated text misnames the Dredd-binding
    domain.
