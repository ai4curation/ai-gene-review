id: Q9V3B4
gene_symbol: Fadd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Fas-associated death domain (Fadd, also called dFADD or BG4) is a cytoplasmic adaptor
  protein with an N-terminal death effector domain (DED) and a C-terminal death domain (DD).
  It is a core component of the immune deficiency (Imd) pathway that responds to DAP-type
  peptidoglycan of Gram-negative bacteria: after PGRP-LC or PGRP-LE activation, Fadd binds
  the death domain of Imd through its own death domain and recruits the initiator caspase
  Dredd (the caspase-8 homolog) through DED-DED contact. This complex, with the E3 ligase
  Diap2, drives Dredd-dependent cleavage of Imd and Relish, activation of the IKK complex and
  JNK, and induction of antimicrobial peptide genes, so Fadd mutants are highly susceptible to
  Gram-negative infection but resist Gram-positive bacteria normally. Fadd is also recruited
  to activated, oligomerized dSTING and, with Dredd, is required for STING-induced Relish
  activation and antiviral defense, and it limits Sindbis virus replication. Outside immunity,
  Fadd and Dredd act in the non-apoptotic caspase-dependent individualization of spermatids,
  and overexpressed Fadd can promote Dredd-dependent cell death. Flies lack death-domain
  receptors of the CD95/Fas type, and death induced by the fly TNF Eiger does not require
  Dredd.
