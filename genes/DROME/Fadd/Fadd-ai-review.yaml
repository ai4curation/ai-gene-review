  title: UniProtKB Q9V3B4 (FADD_DROME) Swiss-Prot record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed Swiss-Prot record. The FUNCTION text (Imd pathway component required against
      Gram-negative bacteria; binds Dredd, promotes its cleavage and enhances Dredd-induced
      apoptosis) traces to PMID:12433364 and PMID:10934188, and the Imd, Dredd and Diap2
      interactions and cytoplasmic location are cited correctly. The apoptosis statement comes
      from an overexpression assay. The N-terminal region is still labelled "Death-inducing",
      the name given by Hu and Yang; later work shows it is a death effector domain
      (PMID:41904322). The record does not yet mention the dSTING antiviral role.
