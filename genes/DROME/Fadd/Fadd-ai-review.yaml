- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:10934188
  qualifier: involved_in
  review:
    summary: Fadd enhances Dredd processing and Dredd-induced cell death; a physiological apoptotic
      role is limited.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cloning paper (abstract-only cache) reports that Fadd enhances the cell-death activity
      and processing of Dredd, and in vivo, apoptosis driven by overexpressed dRYBP requires
      Dredd and Fadd (PMID:19255589). Developmental apoptosis in flies runs through Dronc and
      Dark, and Fadd mutants are viable with mainly immune defects, so the apoptotic role is
      real but peripheral.
    supported_by:
    - reference_id: PMID:10934188
      supporting_text: dFADD binds to DREDD through the death-inducing domain and enhances the cell
        death activity and proteolytic processing of DREDD.
    - reference_id: PMID:19255589
      supporting_text: requires the function of the pro-apoptotic REAPER, HID and GRIM proteins, the
        apical caspase DREDD, the adaptor dFADD protein as well as TRITHORAX (TRX)
