  title: FlyBase gene description for Fadd (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The single sentence (an adaptor acting downstream of Imd and upstream of the caspase
      Dredd in the immune deficiency pathway) is traced to PMID:12123572 (epistasis placing
      dFADD between Imd and Dredd) and PMID:12433364 (dFADD associates with IMD and acts
      downstream of it), and agrees with later biochemistry (PMID:41904322). No claim is
      wrong. The text omits the dSTING antiviral pathway, the spermatid individualization
      role and the domain basis of the two interactions.
