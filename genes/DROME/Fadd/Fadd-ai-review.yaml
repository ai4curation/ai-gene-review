- term:
    id: GO:0031265
    label: CD95 death-inducing signaling complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN008354262
  - RGD:628700
  - UniProtKB:Q13158
  review:
    summary: Flies have no CD95/Fas; Fadd assembles instead in the PGRP-LC/Imd and dSTING signalling
      complexes.
    action: REMOVE
    reason: >-
      GO:0031265 is the complex formed when ligand-bound Fas/CD95 recruits FADD, procaspase-8/10
      and c-FLIP. CD95 is a vertebrate death receptor; Drosophila has no CD95 ortholog and its two
      TNF receptors lack death domains (PMID:33824334). The fly complex containing Fadd and the
      caspase-8 homolog Dredd forms on PGRP-LC with Imd and Diap2, or on oligomerized dSTING, and
      leads to NF-kappaB (Relish) activation rather than to death. The IBD at PTN008354262 is a
      vertebrate complex propagated to the whole metazoan node; it does not apply to the fly.
    supported_by:
    - reference_id: PMID:33824334
      supporting_text: although it seems to lack an intracellular death-domain or Traf-interacting-motif
        required for canonical JNK signalling
    - reference_id: PMID:41904322
      supporting_text: Both IMD and dSTING recruit the adapter molecule dFADD in complex with the Caspase-8
        homologue DREDD
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008354262
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human and rat FADD are DISC components; the CD95 receptor that defines the complex
          does not exist in Drosophila.
