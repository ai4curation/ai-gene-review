- term:
    id: GO:0097191
    label: extrinsic apoptotic signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:109324
  - PANTHER:PTN008354262
  - UniProtKB:Q13158
  review:
    summary: No receptor-initiated apoptotic pathway using Fadd is known in flies; the fly Fadd-Dredd
      module mainly drives NF-kappaB signalling.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD (Eumetazoa) is seeded by human and mouse FADD, whose extrinsic apoptotic role
      depends on death receptors. Flies lack death-domain receptors (PMID:33824334), and the
      one fly TNF, Eiger, kills through JNK and the apoptosome without Dredd (PMID:12176339).
      The receptor-initiated Fadd-Dredd pathway in flies (PGRP-LC to Imd) activates Relish
      rather than apoptosis. Fadd can promote Dredd-dependent cell death when Fadd or dRYBP is
      overexpressed (PMID:10934188, PMID:19255589), so a pro-apoptotic capacity is not in
      doubt, but an extrinsic, receptor-to-death signalling pathway has not been shown. Not
      removed, because Imd overexpression and UV-induced death involve the Imd branch and a
      receptor input to Fadd-dependent death has not been excluded (PMID:11703941).
    supported_by:
    - reference_id: PMID:11703941
      supporting_text: We also show that imd is involved in the apoptotic response to UV irradiation.
    - reference_id: PMID:12176339
      supporting_text: A direct mode of action via the apical FADD/caspase-8 pathway may have been coopted
        by some TNF signaling systems only at subsequent stages of evolution.
    - reference_id: PMID:33824334
      supporting_text: although it seems to lack an intracellular death-domain or Traf-interacting-motif
        required for canonical JNK signalling
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008354262
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mammalian FADD transmits death-receptor signals; the death-receptor input is absent
          in Drosophila, where the Fadd-Dredd module serves Imd and dSTING signalling.
