- term:
    id: GO:0002230
    label: positive regulation of defense response to virus by host
  evidence_type: IMP
  original_reference_id: PMID:19763182
  qualifier: involved_in
  review:
    summary: Fadd, like other Imd pathway components, limits Sindbis virus replicon replication,
      and it is required for dSTING-dependent antiviral defense.
    action: ACCEPT
    reason: >-
      Sindbis replicon replication rises in dfadd heterozygotes, as in relish, imd and dredd
      heterozygotes. Independent later work shows that Fadd is recruited to activated dSTING
      and, with Dredd, is required for STING-induced Relish activation and antiviral activity in
      vivo (PMID:41904322). Antiviral signalling is a core role alongside antibacterial
      signalling.
    supported_by:
    - reference_id: PMID:19763182
      supporting_text: fold higher in F1 progeny heterozygous for relish, imd, dfadd and dredd respectively
        when compared to the replication in a wt fly background.
    - reference_id: PMID:41904322
      supporting_text: Finally, we show that both dFADD and DREDD are required for the antiviral activity
        of dSTING in vivo.
- term:
    id: GO:0005123
    label: death receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008354262
  - RGD:628700
  review:
    summary: Drosophila has no death-domain receptors; the death domain of fly Fadd binds the cytoplasmic
      adaptors Imd and dSTING, not a receptor.
    action: REMOVE
    reason: >-
      GO:0005123 is binding to a death receptor, a TNF receptor family member with a
      cytoplasmic death domain. The IBD at PTN008354262 (Eumetazoa) is seeded only by rat Fadd,
      whose partners are vertebrate death receptors such as Fas. The fly genome has two TNF
      receptors, Wengen and Grindelwald, and neither has a death domain; they signal through
      Traf2 to JNK, and Eiger-induced death does not use Dredd. The upstream receptor of the
      fly Fadd pathway, PGRP-LC, recruits Imd rather than Fadd, and Fadd's death domain binds
      Imd and dSTING. The partner class the term names is absent from the target lineage, so
      the function cannot be inherited here.
    supported_by:
    - reference_id: PMID:33824334
      supporting_text: although it seems to lack an intracellular death-domain or Traf-interacting-motif
        required for canonical JNK signalling
    - reference_id: PMID:12176339
      supporting_text: Unlike its mammalian counterparts, however, the apoptotic effect of Eiger does
        not require the activity of the caspase-8 homolog DREDD, but it completely depends on its ability
        to activate the JNK pathway.
    - reference_id: PMID:41904322
      supporting_text: Altogether, these data indicate that the residues E220 and Y223 in IMD interact
        with R171 in dFADD, with a contribution of E177.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008354262
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Rat Fadd binds vertebrate death receptors; Drosophila lacks death-domain TNF receptors,
          so the binding cannot occur in the fly lineage.
