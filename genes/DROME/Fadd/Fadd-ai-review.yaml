suggested_questions:
- question: Does Fadd contribute to any receptor-initiated cell death in flies (for example downstream
    of PGRP-LC or Imd after UV or in intestinal infection), or is its pro-apoptotic activity confined
    to overexpression settings?
- question: Which partners mediate the Dredd-independent requirement for Fadd in spermatid individualization?
- question: Should the dSTING-Fadd-Dredd-Relish route be annotated to the cGAS/STING signaling pathway
    term, whose definition is written around cGAS-produced cGAMP, given that flies use cGAS-like receptors
    (cGLR1/2)?
suggested_experiments:
- description: Test UV- and Imd-overexpression-induced apoptosis in Fadd null larvae, and Eiger-induced
    eye ablation in a Fadd null background, to define any Fadd-dependent apoptotic pathway.
- description: Reconstitute Fadd null flies with DD-interface (R171A) or DED-interface mutants and test
    Gram-negative survival, viral (dSTING) resistance and spermatid individualization separately.
