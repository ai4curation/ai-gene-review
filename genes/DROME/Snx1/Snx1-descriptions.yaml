- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol binding activity and phosphatidylinositol-3-phosphate
    binding activity. Predicted to be involved in retrograde transport, endosome to
    Golgi. Predicted to be located in endosome. Predicted to be part of retromer,
    tubulation complex. Predicted to be active in endosome membrane. Is expressed
    in several structures, including adult head; adult heart; ganglia; germline cell;
    and gut section. Orthologous to human SNX1 (sorting nexin 1) and SNX2 (sorting
    nexin 2).
