- description: As the SNX1/Vps5 subunit of the SNX-BAR retromer subcomplex (heterodimer with Snx6), Snx1
    binds PI3P-containing endosomal membranes through its PX domain and, with its BAR domain, helps form
    the tubules through which retromer cargo is retrieved to the trans-Golgi network.
