suggested_questions:
- question: Which cargoes, if any, require Snx1 in Drosophila, given that Snx1 null flies are viable and
    fertile and the Wls route depends on Snx3 instead?
suggested_experiments:
- description: Proteomic comparison of endosome-to-TGN cargo (e.g. Lerp) and plasma-membrane recycling
    cargo in Snx1 and Snx6 null tissues, including double mutants to test redundancy with other SNX-BAR
    proteins.
