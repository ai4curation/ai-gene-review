- term:
    id: GO:0061357
    label: positive regulation of Wnt protein secretion
  evidence_type: IMP
  original_reference_id: PMID:22041890
  qualifier: involved_in
  negated: true
  review:
    summary: Snx1 is not required for Wingless secretion (NOT annotation).
    action: ACCEPT
    reason: Wg secretion and signalling are normal in Dsnx1 null clones, and Snx1 overexpression cannot
      substitute for Snx3; Wls recycling for Wg secretion uses the Snx3-retromer rather than the SNX-BAR
      retromer. The negative annotation is well supported.
    supported_by:
    - reference_id: PMID:22041890
      supporting_text: In support of this view, Wg and Sens levels were not altered in Dsnx1 mutant clones
    - reference_id: PMID:22041890
      supporting_text: Both their and our independent observations reach the same conclusion that SNX3,
        rather than SNX1 and SNX6, is required for Wg/Wnt secretion and Wls recycling.
