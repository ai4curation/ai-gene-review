gene_symbol: Snx1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Snx1 (CG2774) is the Drosophila ortholog of the SNX-BAR sorting nexins SNX1/SNX2 and of yeast
  Vps5. It contains a phosphoinositide-binding PX domain and a membrane-curvature-sensing BAR domain,
  and heterodimerizes with Snx6 (the SNX5/SNX6 ortholog) to form the membrane-remodelling SNX-BAR subcomplex
  that associates with the Vps35-Vps26-Vps29 cargo-selective retromer trimer on endosomes. SNX-BAR heterodimers
  bind 3-phosphoinositide-rich endosomal membranes and shape them into tubules from which cargo is retrieved
  to the trans-Golgi network or recycled. In Drosophila, Snx1 null mutants are viable and fertile and,
  unlike the cargo-specific Snx3, Snx1 is not required for retromer-dependent recycling of Wntless and
  Wingless secretion. Genetic reduction of Snx1 together with Snx6 modifies midline axon crossing in sensitized
  embryonic backgrounds, and Snx1 Snx6 double mutants accumulate APP-like cargo at larval neuromuscular
  junctions; like mammalian SNX1/2, it likely acts in the SNX-BAR ESCPE-1 coat, which can sort cargo independently
  of the retromer trimer.
