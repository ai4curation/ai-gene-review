      supporting_text: We conclude that Fbxo42 promotes the degradation of Ataxin-2 by mediating the
        ubiquitylation of the C244 residue.
    - reference_id: PMID:40804044
      supporting_text: Treating cells with CHX and MG132, an inhibitor of the proteosome, led to a significant
        stabilization of Ataxin-2-GFP
    - reference_id: PMID:40804044
      supporting_text: while Fbxo42 RNAi depletion protects Ataxin-2-GFP from degradation
    - reference_id: PMID:33382409
