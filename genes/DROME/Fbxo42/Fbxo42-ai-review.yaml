gene_symbol: Fbxo42
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Fbxo42 (CG6758) is a 667-residue F-box protein with an N-terminal F-box (residues 21-70)
  followed by a kelch-type beta-propeller (Pfam Beta-prop_FBX42). It is the substrate-recognition
  subunit of an SCF (SkpA-Cul1-Roc1a) cullin-RING ubiquitin ligase; its F-box is required for
  binding to SkpA. Two substrates or targets are characterised in the fly. In S2 cells and
  ER-stressed tissues, SCF-Fbxo42 binds the RNA-binding protein Ataxin-2, promotes its
  ubiquitylation (Ataxin-2 Cys244 is the candidate acceptor site), and drives its proteasomal
  degradation. Fbxo42 is recruited to Ataxin-2 granules under ER or arsenite stress, and this
  releases sequestered Xbp1 mRNA for translation late in the unfolded protein response; loss of
  Fbxo42 suppresses Xbp1s-induced retinal cell death. In the female germline, SCF-Fbxo42 lowers
  the level of the PP2A-B56 regulatory subunit Widerborst (Wrd) and is required for assembly
  and maintenance of the synaptonemal complex and for karyosome formation. Fbxo42 is expressed
  in the larval brain, ring gland and eye disc and in the adult brain, testis and ovary.
