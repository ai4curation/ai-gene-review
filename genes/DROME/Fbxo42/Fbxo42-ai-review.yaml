  review:
    action: ACCEPT
    summary: Fbxo42 directs SCF-dependent ubiquitylation and proteasomal turnover of Ataxin-2.
    reason: >-
      This is the core process for the gene, and it is now supported directly, not only by sequence
      model. In S2 cells and fly tissues, Fbxo42 is needed for Ataxin-2-ubiquitin conjugates.
      Overexpressing Fbxo42 accelerates Ataxin-2 turnover in cycloheximide chase, depleting it slows
      turnover, and MG132 stabilises Ataxin-2 (PMID:40804044). In the ovary, Fbxo42 depletion raises
      PP2A-B56 (Wrd) levels (PMID:33382409), but Wrd ubiquitylation was not tested there. Fbxo42 is
      the substrate-recognition subunit; Roc1a-Cul1 and the E2 carry out ubiquitin transfer.
    supported_by:
