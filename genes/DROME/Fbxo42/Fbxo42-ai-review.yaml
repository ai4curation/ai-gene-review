  label: Drosophila melanogaster
description: Fbxo42 is the substrate-recognizing F-box subunit of an SCF ubiquitin ligase. In Drosophila
  oocytes, SCF-Fbxo42 downregulates the PP2A-B56 phosphatase subunit and promotes assembly and maintenance
  of the synaptonemal complex. Its F-box and kelch-like architecture support substrate recognition and
  complex assembly rather than intrinsic ubiquitin transfer.
