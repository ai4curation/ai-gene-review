suggested_questions:
- question: >-
    Should Fbxo42 receive a cellular-component annotation to cytoplasmic stress granules? Fbxo42 foci
    decorate Ataxin-2 granules after DTT or arsenite treatment (PMID:40804044), but it is recruited to the
    granule surface and is not shown to be a stable constituent.
- question: >-
    Should a process term capture the Ataxin-2/Xbp1 role, for example a regulation term under the IRE1-mediated
    unfolded protein response? Fbxo42 acts by degrading a translational repressor of Xbp1 mRNA, and the
    organismal readout (suppression of Xbp1s-induced retinal degeneration) is a downstream phenotype.
- question: >-
    Is PP2A-B56 (Wrd) a direct SCF-Fbxo42 ubiquitylation substrate, or does Fbxo42 lower its level indirectly
    through the PP2A A/C core subunits it co-purifies with?
suggested_experiments:
- description: In vitro reconstitution of SCF-Fbxo42 with Ataxin-2 and Wrd, combined with mass-spectrometric
    mapping of ubiquitylation sites, to separate direct from indirect substrates.
- description: Endogenous tagging of Fbxo42 with live imaging, with and without ER stress, to define its
    basal subcellular localization and the kinetics of its recruitment to Ataxin-2 granules.
- description: Test whether human FBXO42 (same PANTHER subfamily PTHR46432:SF1) ubiquitylates ATXN2 or ATXN2L
    under ER stress, to establish whether the Ataxin-2 substrate relationship is conserved.
