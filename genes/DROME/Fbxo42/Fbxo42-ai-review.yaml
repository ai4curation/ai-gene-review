- term:
    id: GO:1905088
    label: positive regulation of synaptonemal complex assembly
  evidence_type: IMP
  original_reference_id: PMID:33382409
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Germline Fbxo42 depletion blocks assembly of the filamentous synaptonemal complex and causes its premature disassembly.
    reason: >-
      Several independent shRNAs give the same defect. The proposed mechanism is regulatory: by lowering
      PP2A-B56 (Wrd), Fbxo42 shifts the balance toward phosphorylation and so toward synaptonemal-complex
      assembly, and Wrd overexpression phenocopies the knockdown. A regulation term, rather than
      participation in assembly, therefore describes Fbxo42's role at the right level. This is a
      physiological role specific to the germline, alongside the Ataxin-2 role in somatic stress responses.
    supported_by:
    - reference_id: PMID:33382409
      supporting_text: Depletion of CG6758 (which we call Fbxo42) prevented assembly of the fully filamentous
        synaptonemal complex and prematurely disassembled the partially formed structure
    - reference_id: PMID:33382409
      supporting_text: Our biochemical and genetic evidence suggests that Fbxo42 promotes synaptonemal
        complex assembly by negatively controlling the level of the protein phosphatase PP2A-B56.
