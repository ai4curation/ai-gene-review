description: 'The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for Q9VVS1.
  Mitochondrion (GO:0005739) is a supported omission candidate because the primary Dic4 study reports
  mitochondrial localization of the expressed Dic proteins, and the current exact accession is the native
  302-residue Dic4 product. A specific transport-activity omission is not established: reconstituted Dic4
  showed no detectable transport in the published dicarboxylate-carrier assays, while the accessible abstract
  does not establish that thiamine pyrophosphate was tested. The separate FUNCTION prediction of mitochondrial
  thiamine pyrophosphate uptake therefore remains UNC. This completed record assesses the absence of GO
  output; predictions is empty because no GO or EC prediction was emitted. The narrative judgment remains
  in the linked function review and is not a score assigned to the omission.'
