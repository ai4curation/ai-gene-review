- id: file:DROME/Dic4/Dic4-hypotheses/fly41-thiamine-pyrophosphate-transport/openscientist.md
  title: OpenScientist audit of Dic4 mitochondrial thiamine pyrophosphate transport
  findings:
  - statement: OpenScientist found no positive support for ThPP transport by Dic4 and traced that specific
      activity to the characterized Tpc1 carrier.
    supporting_text: The most important caveat is that ThPP was likely never directly assayed against Dic4,
      so it is unmeasured rather than formally excluded — but no positive evidence supports the assignment,
      and the function is already correctly located on Tpc1.
