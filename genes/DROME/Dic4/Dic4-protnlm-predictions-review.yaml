description: 'The ProtNLM2 API snapshot retrieved 2026-09-08 contains no GO-term predictions for Q9VVS1,
  so there is nothing to score. The absence is assessed against the re-reviewed gene. The terms best supported
  for Dic4 are mitochondrion (GO:0005739, IDA) and mitochondrial inner membrane (GO:0005743, IBA), both
  already in GOA and accepted by the gene review, so emitting either would have been CNN rather than a
  novel prediction. No transport activity is supported: reconstituted Dic4 catalysed no homo- or hetero-exchange
  of dicarboxylates or phosphate, GOA carries NOT annotations for dicarboxylic acid transmembrane transporter
  activity and dicarboxylic acid transport, and the gene review marks the IBA sulfate, thiosulfate and phosphate
  transport terms as over-annotations. Omitting a transport-activity term is therefore appropriate. The separate
  FUNCTION-text proposal of mitochondrial thiamine pyrophosphate uptake has no positive support and remains
  UNC; that activity belongs to the characterized carrier Tpc1. A PubMed search for Dic4, DmDic4p and CG18363
  returned only the primary characterization study. predictions is empty because no GO or EC prediction
  was emitted; the narrative judgment remains in the linked function review and is not a score assigned
  to the omission.'
