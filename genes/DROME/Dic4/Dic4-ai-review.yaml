- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002067
  review:
    summary: Retain general transmembrane transport as an inferred carrier function while leaving
      substrate identity unresolved.
    action: ACCEPT
    reason: PTHR45618 retains general transmembrane transporter activity at PTN002515516. Negative
      reconstitution results for a tested substrate panel do not demonstrate absence of transport
      for every substrate and condition. The existing OpenScientist report itself acknowledges
      untested substrates and unresolved folding/insertion conditions. The carrier architecture
      and curated ancestral transport function support this broad IEA without converting sulfate,
      thiosulfate, phosphate or ThPP into demonstrated Dic4 substrates.
    supported_by:
    - reference_id: file:DROME/Dic4/Dic4-hypotheses/fly41-thiamine-pyrophosphate-transport/openscientist.md
      supporting_text: '"no activity" cannot formally exclude an untested substrate.'
