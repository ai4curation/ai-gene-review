- term:
    id: GO:0015116
    label: sulfate transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0027610
  - FB:FBgn0033248
  - PANTHER:PTN000756618
  review:
    summary: Ancestral anion-transport IBA, contradicted by the negative Dic4 reconstitution and its substituted
      contact points.
    action: MARK_AS_OVER_ANNOTATED
    reason: PAINT placed phosphate, sulfate and thiosulfate transport at the eukaryote-level node PTN000756618,
      seeded by Dic1 and Dic3, and Dic4 is a member of the same PANTHER subfamily (SF13), so the transfer
      is phylogenetically grounded. The PAINT curator has already added a fly-lineage NOT node (PTN000640888)
      that removes the dicarboxylate terms from Dic4, while leaving the phosphate/sulfur-anion terms in
      place. Target-specific evidence argues against these remaining terms. Dic4 itself was reconstituted
      in the same assay system in which Dic1 and Dic3 were active, and it catalysed neither homo- nor
      hetero-exchange; the authors state that it cannot transport dicarboxylates or phosphate. They attribute
      this to substitutions at substrate contact points CP1 and CP2 in a duplicated, fast-evolving copy,
      and Dic4 has the longest branch among the fly Dic paralogs in our tree. The refolded inclusion-body
      assay cannot exclude an untested substrate or condition, and the abstract-only primary paper does
      not list every substrate tested, so this is marked as over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:32842667
      supporting_text: Unexpectedly, DmDic4p was unable to catalyze either homo- or hetero-exchanges,
        after its reconstitution into liposomes
    - reference_id: PMID:32842667
      supporting_text: As regards DmDic4p, its inability to transport dicarboxylates or phosphate could
        arise from a loss of some conserved residues located on CP1 and CP2.
    - reference_id: PMID:32842667
      supporting_text: Its gene could be derived from a duplication of the DmDIC ancestral gene, but the
        lack of selective pressure upon this gene copy would have allowed mutations impairing DmDic4p’s
        transport function
    - reference_id: file:DROME/Dic4/Dic4-bioinformatics/RESULTS-rereview.md
      supporting_text: 'The curator therefore deliberately withdrew dicarboxylate

        transport from the Dic4 lineage but left the phosphate/sulfur-anion terms in place.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000756618
        source_label: PTN000756618
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Activity is supported for donors Dic1 and Dic3; the Dic4 reconstitution was negative
          and its contact points are substituted.
