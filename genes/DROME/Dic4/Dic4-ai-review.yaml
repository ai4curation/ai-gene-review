core_functions:
- description: Mitochondrial inner-membrane carrier-family protein of the dicarboxylate-carrier subfamily
    with no transport activity detected in reconstitution assays; its substrate, if any, is unknown.
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:21130726
    supporting_text: All expressed proteins are localized in mitochondria.
  - reference_id: PMID:32842667
    supporting_text: Unexpectedly, DmDic4p was unable to catalyze either homo- or hetero-exchanges, after
      its reconstitution into liposomes
suggested_questions:
- question: Should PAINT extend the fly-lineage NOT node PTN000640888 to phosphate, sulfate and thiosulfate
    transport, given that reconstituted Dic4 catalysed no exchange of any tested substrate?
- question: Does Dic4 have a substrate outside the dicarboxylate/phosphate/sulfur-anion panel, or is it
    a transport-dead paralog?
suggested_experiments:
- description: Reconstitute Dic4 and CP1/CP2-restored variants into proteoliposomes and screen a broad
    substrate panel, including nucleotides and cofactors, alongside active Dic1 and Dic3 controls.
