    supporting_text: No transport activity was observed for DmDic4p.
  - statement: Dic4 is localized in mitochondria
    supporting_text: All expressed proteins are localized in mitochondria.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
