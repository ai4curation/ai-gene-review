  label: Drosophila melanogaster
description: Dic4 is a Drosophila mitochondrial carrier-family protein. The 302-residue PA/PC
  product has the tripartite architecture of an inner-membrane carrier, but its physiological
  substrate remains unresolved. Reconstituted Dic4 did not exhibit transport in the published
  dicarboxylate-carrier assay panel, unlike Dic1 and Dic3.
