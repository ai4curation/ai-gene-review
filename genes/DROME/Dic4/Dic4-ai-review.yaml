  - FB:FBgn0033248
  - PANTHER:PTN000756618
  review:
    summary: The substrate-specific ancestral transport inference remains unresolved against the
      negative Dic4 reconstitution result.
    action: UNDECIDED
    reason: PTHR45618 places this substrate-related IBD at PTN000756618. PMID:21130726 reports
      no transport activity for DmDic4p; the accessible primary abstract and review PMID:32842667
      support a real target-specific conflict. The existing OpenScientist report discusses the
      negative assays but does not settle substrate-by-substrate conditions, folding/insertion
      competence, or untested alternatives. Its absence-of-experiment and alternative-carrier
      arguments are not adopted as proof of loss. Retain UNDECIDED and request human inspection
      of the full primary assay panel, rather than commission a duplicate report.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
