  - UniRule:UR000413536
  review:
    summary: Membrane is a correct broad location for mitochondrial Dic4.
    action: ACCEPT
    reason: The primary study localizes DmDic4p to mitochondria, and mitochondrial-carrier architecture
      plus the inherited inner-membrane annotation specify its membrane context. A valid broad
      membrane term need not be replaced merely because a narrower localization is also annotated.
