id: Q9VVS1
gene_symbol: Dic4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dic4 (CG18363) is a Drosophila melanogaster member of the mitochondrial carrier (SLC25) family,
  placed with Dic1-Dic3 and the mammalian dicarboxylate carrier SLC25A10 in the dicarboxylate-carrier
  subfamily (PANTHER PTHR45618:SF13). The 302-residue protein has the three repeated Mito_carr domains
  of an inner-membrane carrier, is expressed mainly at the pupal stage and localizes to mitochondria.
  Unlike its paralogs Dic1 (dicarboxylate/phosphate antiporter) and Dic3 (phosphate/sulfate/thiosulfate
  antiporter), recombinant Dic4 reconstituted into liposomes catalysed no homo- or hetero-exchange of
  dicarboxylates or phosphate. Substitutions at conserved substrate contact points CP1 and CP2 have been
  proposed to explain this, consistent with a duplicated, fast-evolving paralog. Whether Dic4 transports
  an untested substrate, or has lost transport activity, is unknown.
