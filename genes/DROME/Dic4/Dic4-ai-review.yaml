      by reconstituted DmDic4p; Dic1 and Dic3 serve as active controls in the same system.
- id: PMID:32842667
  title: 'Drosophila melanogaster Mitochondrial Carriers: Similarities and Differences with the Human
    Carriers.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text review by the same group; gives details of the Dic4 negative result (no homo/hetero-exchange,
      no dicarboxylate or phosphate transport) and the CP1/CP2 substitution hypothesis.
  findings:
  - statement: Dic4 catalysed neither homo- nor hetero-exchange after reconstitution
    supporting_text: Unexpectedly, DmDic4p was unable to catalyze either homo- or hetero-exchanges, after
      its reconstitution into liposomes
  - statement: Loss of CP1/CP2 residues proposed to explain lack of dicarboxylate and phosphate transport
    supporting_text: As regards DmDic4p, its inability to transport dicarboxylates or phosphate could
      arise from a loss of some conserved residues located on CP1 and CP2.
