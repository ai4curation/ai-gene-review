  title: OpenScientist assessment of Dic4 thiamine pyrophosphate transport
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read substantive findings and limitations. The primary negative reconstitution
      result is relevant, but the report also acknowledges untested ThPP and unresolved folding/assay
      conditions. Its refuted/paralog-carry-over verdict overstates absent experiments and a
      coarse identity-based tree; a characterized Tpc1 does not exclude another carrier with
      overlapping capacity.
