- source: Alliance_Imported
  text: oo18 RNA-binding protein (orb) encodes a RNA-binding protein required for
    the formation of the egg chamber and establishment of polarity during oogenesis.
    It is involved in mRNA polyadenylation and the regulation of osk mRNA translation.
  source_type: curated
