    overall_notes: 'Correct: RNA-binding protein for egg chamber formation and oocyte
      polarity, acting in mRNA polyadenylation and osk translation. Gurken and the
      CPEB family are not named.'
- source: Alliance_Automated
  text: Enables mRNA binding activity. Involved in cytosolic mRNA polyadenylation;
    oogenesis; and positive regulation of oskar mRNA translation. Located in P granule
    and cell cortex. Part of ribonucleoprotein complex. Is active in P-body. Is expressed
    in several structures, including antennal lobe; cuboidal/columnar epithelium;
    germarium region 2a; germline cell; and gonad. Orthologous to human CPEB1 (cytoplasmic
    polyadenylation element binding protein 1).
