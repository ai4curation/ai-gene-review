- term:
    id: GO:0045182
    label: translation regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR034819
  review:
    action: ACCEPT
    summary: >-
      Core molecular function: Orb is a sequence-specific mRNA-binding translational regulator of the
      CPEB family.
    reason: >-
      CPEB-family proteins act as both translational activators and repressors, and PAINT places a
      repressor-type activity at the family node, while fly Orb is experimentally an activator acting
      through recruitment of poly(A) polymerases rather than a direct effect on the ribosome. The broad
      translation regulator activity is therefore as precise as the combined evidence warrants for the
      molecular function; the direction is captured in the process term.
    supported_by:
    - reference_id: PMID:15737929
      supporting_text: Orb is a germline-specific RNA
        binding protein and is one of the founding members of the CPEB family of
        translational regulators.
    - reference_id: PMID:12538512
      supporting_text: Orb-mediated cytoplasmic polyadenylation stimulates oskar
        translation
- term:
    id: GO:0045451
    label: germ plasm oskar mRNA localization
  evidence_type: IMP
  original_reference_id: PMID:7926753
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: >-
      Strong orb mutants fail to localize oskar mRNA asymmetrically within the oocyte; Orb is found in
      oskar mRNA complexes.
    reason: >-
      Orb is physically associated with oskar mRNA and its mutant phenotype includes mislocalized oskar
      mRNA, so its involvement in oskar localization is accepted from the curator's IMP. Part of the
      phenotype may reflect the earlier requirement of orb for oocyte polarity (microtubule
      repolarization), so this is retained as non-core rather than core.
    supported_by:
    - reference_id: PMID:7926753
      supporting_text: orb is required for the
        asymmetric distribution of oskar and gurken mRNAs within the oocyte during the
        later stages of oogenesis.
    - reference_id: PMID:30865627
      supporting_text: We show that repolarization of the oocyte also requires orb and
        that orb is needed for the proper functioning of the Par proteins.
