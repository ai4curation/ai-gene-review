- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR034819
  review:
    action: MODIFY
    summary: >-
      Correct but general. In Drosophila the experimental evidence shows Orb activates translation of
      its targets by promoting cytoplasmic polyadenylation.
    reason: >-
      Orb-mediated poly(A) elongation stimulates oskar translation, Osk protein is undetectable in strong
      orb mutants, and Orb drives positive autoregulatory translation of orb mRNA and translation of
      gurken. Orb itself does part of the work, recognizing the target 3-prime UTR and recruiting
      poly(A) polymerases (it is in an ovarian complex with PAP and Wispy). Positive regulation of
      translation (an is_a descendant) is therefore supported. The family-level repressor activity
      inferred by PAINT for CPEB proteins has not been demonstrated for fly Orb and is not transferred
      here.
    supported_by:
    - reference_id: PMID:12538512
      supporting_text: We conclude that Orb-mediated cytoplasmic polyadenylation stimulates oskar
        translation to achieve the high levels of Oskar protein necessary for posterior
        patterning and germline differentiation.
    - reference_id: PMID:15737929
      supporting_text: Orb is responsible for mediating the translational activation of
        mRNAs localized within the developing oocyte.
    - reference_id: PMID:18434412
      supporting_text: Both Wispy and PAP interact with
        Orb genetically and physically in an ovarian complex.
    proposed_replacement_terms:
    - id: GO:0045727
      label: positive regulation of translation
