id: Q8IMZ2
gene_symbol: orb
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Orb is a cytoplasmic polyadenylation element-binding protein that recognizes sequences in
  mRNA 3-prime untranslated regions and controls maternal mRNA translation and localization. It is enriched
  in the developing oocyte, where its post-transcriptional regulation supports germline development and
  establishment of oocyte polarity. Its C-terminal RNA-recognition region is conserved in the shorter
  Q8IMZ2 form.
