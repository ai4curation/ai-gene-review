id: Q8IMZ2
gene_symbol: orb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Orb (oo18 RNA-binding protein) is the Drosophila member of the CPEB1 subfamily of cytoplasmic
  polyadenylation element-binding proteins. It is a germline-enriched cytoplasmic RNA-binding protein
  whose C-terminal region of two RNA recognition motifs and a ZZ-type zinc-binding domain recognizes
  linear cytoplasmic polyadenylation element-like sequences in the 3-prime untranslated regions of
  target mRNAs. In the ovary Orb accumulates in the oocyte, where it promotes cytoplasmic
  poly(A)-tail elongation (in an ovarian complex with canonical poly(A) polymerase and the GLD-2-type
  poly(A) polymerase Wispy) and thereby activates localized translation of maternal mRNAs, including
  oskar, gurken and its own orb mRNA. Through this localized translational activation Orb is required
  for 16-cell cyst formation and oocyte differentiation, oskar protein accumulation at the posterior
  pole, gurken-dependent dorsoventral patterning and microtubule repolarization of the oocyte. Q8IMZ2
  is the 559-residue product of orb transcripts C and E; it lacks the N-terminal 356 residues of the
  915-residue canonical Orb product (Q9VCN7) but retains the complete C-terminal RNA-binding region.
