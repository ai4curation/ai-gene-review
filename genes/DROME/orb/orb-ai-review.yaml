suggested_questions:
- question: >-
    Do the N-terminally truncated Orb isoforms (C/E, 559 aa; F, 617 aa) differ from the 915-residue
    isoform in oocyte localization, phosphorylation-dependent activation, or translational repression
    versus activation?
- question: >-
    PAINT infers a repressor-type translation regulator activity at the CPEB family node; is there
    direct evidence that fly Orb represses translation of any target, or is that function restricted
    to vertebrate CPEB1 in this subfamily?
suggested_experiments:
- description: >-
    Isoform-specific rescue of orb-null germlines with transgenes encoding only the 559-residue C/E
    product versus the 915-residue product, assaying 16-cell cyst formation, oskar poly(A) length and
    Osk protein accumulation.
