  review:
    summary: Double-stranded telomeric DNA binding inherited from the RAD50 clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT node is seeded only by budding yeast Rad50 (SGD:S000005194), whose binding is to
      telomerase-generated TG repeats. The term denotes binding to a telomere-specific DNA sequence, and
      Drosophila telomeres are retrotransposon arrays that lack such repeats and are capped in a sequence-independent
      manner. Fly Rad50 does act at telomeres (capping), but the sequence-specific binding activity
      is unlikely to apply in this lineage.
    supported_by:
    - reference_id: file:DROME/rad50/rad50-deep-research-falcon.md
