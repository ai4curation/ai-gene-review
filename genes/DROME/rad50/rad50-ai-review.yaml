id: Q9W252
gene_symbol: rad50
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: rad50 encodes the Drosophila ortholog of RAD50, the structural maintenance of chromosomes
  (SMC)-like ATPase subunit of the Mre11-Rad50-Nbs (MRN) complex. Rad50 has ABC-type ATPase head domains
  joined by a long coiled-coil with a zinc-hook dimerization motif and binds DNA ends. It regulates Mre11
  nuclease activity in DSB end processing and homologous recombination repair. In Drosophila, Rad50 is
  distributed along mitotic chromosomes and is unstable without Mre11. With Mre11 and Nbs it caps telomeres,
  which Drosophila maintains by retrotransposition rather than telomerase, by promoting recruitment of
  HOAP and HP1. rad50 mutants show telomere fusions, chromosome breakage, accumulation of spontaneous
  DSBs, elevated apoptosis and pupal lethality.
