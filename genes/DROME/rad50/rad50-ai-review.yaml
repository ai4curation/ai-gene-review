- term:
    id: GO:0051880
    label: G-quadruplex DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000429848
  - SGD:S000005194
  review:
    summary: G-quadruplex DNA binding inherited from the RAD50 clade.
    action: KEEP_AS_NON_CORE
    reason: The basis is phylogenetic - the PAINT node is seeded by budding yeast Rad50 (SGD:S000005194).
      G-quadruplex binding is a structure-specific (not telomere-specific) property, and G4-forming
      sequences occur across the fly genome even though fly telomeres lack G-rich repeats, so the
      inheritance is not excluded. No fly Rad50 binding assay exists, so it is retained only as an
      inherited non-core activity on the strength of the phylogenetic inference.
