descriptions:
- source: UniProt
  text: 'Component of the MRN complex, which plays a central role in double-strand
    break (DSB) repair, DNA recombination, maintenance of telomere integrity and meiosis
    (PubMed:15135728, PubMed:15296753). The MRN complex is involved in the repair
    of DNA double-strand breaks (DSBs) via homologous recombination (HR), an error-free
    mechanism which primarily occurs during S and G2 phases (By similarity). The complex
    (1) mediates the end resection of damaged DNA, which generates proper single-stranded
    DNA, a key initial steps in HR, and is (2) required for the recruitment of other
    repair factors and efficient activation of ATM and ATR upon DNA damage (By similarity).
    The MRN complex possesses single-strand endonuclease activity and double-strand-specific
    3''-5'' exonuclease activity, which are provided by MRE11, to initiate end resection,
    which is required for single-strand invasion and recombination (By similarity).
    Within the complex, RAD50 is both required to bind DNA ends and hold them in close
    proximity and regulate the activity of MRE11 (By similarity). RAD50 provides an
    ATP-dependent control of MRE11 by positioning DNA ends into the MRE11 active site:
    ATP-binding induces a large structural change from an open form with accessible
    MRE11 nuclease sites into a closed form (By similarity).'
  source_type: curated
