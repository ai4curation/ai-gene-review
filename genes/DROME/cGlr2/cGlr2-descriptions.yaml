descriptions:
- source: UniProt
  text: Nucleotidyltransferase that catalyzes the formation of cyclic GMP-AMP from
    ATP and GTP and plays a key role in antiviral innate immunity (PubMed:34261128).
    Directly binds some unknown nucleic acid, activating the nucleotidyltransferase
    activity, leading to synthesis of both 3',2'-cGAMP and 2',3'-cGAMP second messengers
    (PubMed:34261128). 3',2'-cGAMP and 2',3'-cGAMP bind to and activate Sting, thereby
    triggering the antiviral immune response via activation of the NF- kappa-B transcription
    factor Rel (Relish) (PubMed:34261128).
  source_type: curated
  url: https://www.uniprot.org/uniprot/A8DYP7
  source_id: A8DYP7
