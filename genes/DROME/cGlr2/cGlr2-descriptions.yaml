- source: Alliance_Automated
  text: Enables 2',3'-cyclic GMP-AMP synthase activity; 3',2'-cyclic GMP-AMP synthase
    activity; and double-stranded RNA binding activity. Involved in cGAS/STING signaling
    pathway; immune response involved in response to exogenous dsRNA; and response
    to virus. Predicted to be active in cytosol. Orthologous to human ITPRIPL1 (ITPRIP
    like 1) and MAB21L4 (mab-21 like 4).
