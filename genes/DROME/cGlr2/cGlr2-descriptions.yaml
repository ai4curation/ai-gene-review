    overall_notes: 'Correct: makes 3'',2''- and 2'',3''-cGAMP, activating Sting and
      Relish; ligand unknown. Omits 2'',3''-c-di-GMP.'
- source: Alliance_Imported
  text: cGAS-like receptor 2 (cGlr2) encodes a receptor sensing viral infections.
    It produces cyclic dinucleotide second messengers that activate the STING pathway.
