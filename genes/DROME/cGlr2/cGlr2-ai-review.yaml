  label: Drosophila melanogaster
description: Cyclic GMP-AMP synthase-like receptor 2 (cGLR2) is a cytosolic cGAS-like nucleotidyltransferase
  of the Mab-21 family that contributes to antiviral innate immunity in Drosophila. On activation by a
  nucleic-acid ligand (double-stranded RNA enhances its activity), it synthesizes from ATP and GTP a range
  of cyclic dinucleotide second messengers, including 2',3'-cGAMP, 3',2'-cGAMP and, distinctively, 2',3'-c-di-GMP.
  These cyclic dinucleotides bind and activate the innate-immune adaptor STING (dSTING) and the downstream
  NF-kappaB transcription factor Relish, driving an antiviral transcriptional response. cGLR2 acts alongside
  cGLR1 as part of the invertebrate cGAS-STING pathway, expanding the repertoire of cyclic dinucleotide
  signals beyond 2',3'-cGAMP.
