    summary: cGLR2 acts as a nucleic-acid sensor whose cyclic-dinucleotide synthesis is enhanced by double-stranded
      RNA; structure-guided modelling supports a conserved dsRNA-binding surface. Note the strongest in
      vitro binding/structural data are for cGLR2 orthologs and the endogenous activating ligand of D.
      melanogaster cGLR2 remains formally unidentified.
