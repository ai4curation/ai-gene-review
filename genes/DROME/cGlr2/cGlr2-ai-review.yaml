  title: The virus-induced cyclic dinucleotide 2'3'-c-di-GMP mediates STING-dependent antiviral immunity
    in Drosophila.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cai et al. 2023 (Immunity); full text cached. Shows 2',3'-c-di-GMP is the major product
      of Drosophila cGLR2, that dsRNA facilitates cGLR2 activity, and that cGLR-dependent CDN production
      is virus-induced in vivo; also notes the cGLR2 ligand remains unknown.
suggested_questions:
- question: What is the endogenous ligand that activates D. melanogaster cGLR2 in vivo, and is dsRNA the
    physiological trigger or only one of several activating nucleic acids?
- question: What is the biological role of the distinctive cGLR2 product 2',3'-c-di-GMP relative to the
    cGAMP isomers in dSTING activation, and how do cGLR1 and cGLR2 divide labor during infection?
suggested_experiments:
- description: Identify the physiological cGLR2 activator by crosslinking/immunoprecipitation of cGLR2-associated
    nucleic acids from virus-infected D. melanogaster, with in vitro reconstitution of activity.
- description: Compare antiviral protection and CDN profiles of cGLR2 catalytic and ligand-binding mutants
    against a panel of RNA and DNA viruses, in cGLR1/cGLR2 single and double mutant backgrounds.
