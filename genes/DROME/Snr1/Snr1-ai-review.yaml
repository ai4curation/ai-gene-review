      by GO:0035060 brahma complex, which in GO is a sibling of npBAF and nBAF, not a parent. A species-specific
      complex term inherited across a phylum boundary is an over-propagation that can be argued on biological
      grounds, so the row is removed; the IBD should move to a vertebrate node.
