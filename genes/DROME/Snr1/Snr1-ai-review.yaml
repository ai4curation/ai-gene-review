  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Checked each claim. Core component of the ATP-dependent SWI/SNF (Brahma) complex: traced
      to the co-purification and complex-composition papers (PMID:7579694, PMID:15060132, PMID:18299390).
      Tumour suppressor and requirement for endosomal trafficking-mediated signalling: traced to PMID:27923836,
      which also shows the cytoplasmic pool behind it. Nothing is wrong. The text omits Snr1''s best-studied
      roles as a regulatory subunit that both activates and represses Brm target genes (wing veins, ecdysone-response
      genes, Zeste and Relish targets), its binding to Trithorax and cyclin E, and its roles in neural
      stem cell development.'
