    label: nBAF complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:1328366
  - PANTHER:PTN000001220
  review:
    summary: nBAF complex (vertebrate neural BAF assembly) inherited from the Bilateria node, seeded only
      by mouse Smarcb1.
    action: REMOVE
    reason: The PAINT IBD sits on PTN000001220, the Bilateria node of the SMARCB1 subfamily, from a single
      seed, mouse Smarcb1, so every protostome SMARCB1 ortholog inherits it, including fly Snr1, worm
      snfc-5 and the mosquito, beetle, tick and leech genes. The term names a vertebrate assembly. GO
      defines npBAF and nBAF by the human subunits that switch at cell-cycle exit (BAF45a and BAF53a in
      progenitors; BAF45b/c and BAF53b in neurons), and that switch is how vertebrate SWI/SNF complexes
      gain neural specificity. Flies have one BAF53, Bap55, which either human paralog can replace in
      fly neurons, and the neural-precursor and neuronal roles of the two paralogs diverged after the
      vertebrate-insect split. The fly BRM complex lacks the subunit heterogeneity of the human complexes.
      The Brahma complexes that act in fly neuroblasts and neurons (BAP and PBAP) are already captured
      by GO:0035060 brahma complex, which in GO is a sibling of npBAF and nBAF, not a parent. A species-specific
      complex term inherited across a phylum boundary is an over-propagation that can be argued on biological
      grounds, so the row is removed; the IBD should move to a vertebrate node.
    supported_by:
    - reference_id: file:DROME/Snr1/Snr1-bioinformatics/RESULTS.md
      supporting_text: GO:0071564 npBAF complex and GO:0071565 nBAF complex were placed on this node from
        a single seed, mouse Smarcb1 (MGI:MGI:1328366).
    - reference_id: file:DROME/Snr1/Snr1-bioinformatics/RESULTS.md
      supporting_text: Each protostome in the tree has a single SMARCB1-family gene, and PAINT has recorded
        no loss (IKR/IRD) anywhere below PTN002558537.
    - reference_id: PMID:17640523
      supporting_text: As neural progenitors exit the cell cycle, these subunits are replaced by the homologous
        BAF45b, BAF45c, and BAF53b.
    - reference_id: PMID:17640523
      supporting_text: More broadly, these studies suggest that SWI/SNF-like complexes in vertebrates
        achieve biological specificity by combinatorial assembly of their subunits.
    - reference_id: PMID:21284845
      supporting_text: The human homologs of Bap55 are BAF53a and BAF53b, with approximately equal homology.
    - reference_id: PMID:21284845
      supporting_text: These data suggest that the functions for BAF53a and b (in neural precursors and
        postmitotic neurons, respectively) diverge after the evolutionary split between vertebrates and
        insects.
    - reference_id: PMID:9735357
      supporting_text: The BRM complex is even more highly related to the human BRG1 and hBRM complexes,
        but lacks the subunit heterogeneity characteristic of these complexes.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000001220
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilateria node; the neural BAF subunit switch is vertebrate, so the IBD is placed too
          deep.
      - source_id: MGI:MGI:1328366
        source_label: Mus musculus Smarcb1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Valid seed for the mouse npBAF/nBAF complexes, which have no fly counterpart.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000001220
      slot: paint_annotation
      requested_change: CHECK
      asserted_value: GO:0071565
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: The IBD for GO:0071565 sits on PTN000001220, the Bilateria node of the PTHR10019 SMARCB1
        subfamily, from a single seed, mouse Smarcb1 (MGI:MGI:1328366). npBAF and nBAF are defined by
        the vertebrate BAF45a/BAF53a to BAF45b/c/BAF53b subunit switch; protostomes such as Drosophila
        have single BAF53 (Bap55) and BAF45 orthologs and no such switch, so the IBD propagates a vertebrate
        assembly to every protostome SMARCB1 ortholog. Suggest moving the IBD to a vertebrate node (a
        candidate is PTN002558529, Euteleostomi, on the human SMARCB1 path; the exact node depends on
        when ACTL6B and the DPF paralogs arose) or adding an IKR on the Protostomia node PTN002558537.
      supported_by:
      - reference_id: file:DROME/Snr1/Snr1-bioinformatics/RESULTS.md
        supporting_text: GO:0071564 npBAF complex and GO:0071565 nBAF complex were placed on this node
          from a single seed, mouse Smarcb1 (MGI:MGI:1328366).
      - reference_id: PMID:21284845
        supporting_text: These data suggest that the functions for BAF53a and b (in neural precursors
          and postmitotic neurons, respectively) diverge after the evolutionary split between vertebrates
          and insects.
- term:
    id: GO:0097150
    label: neuronal stem cell population maintenance
  evidence_type: IMP
  original_reference_id: PMID:28350987
  qualifier: involved_in
  review:
    summary: Neuronal stem cell population maintenance, from the super elongation complex paper.
    action: UNDECIDED
    reason: The cached publication is abstract-only, the abstract is about the super elongation complex
      and does not mention Snr1, and the full text was not available. Other fly papers show that Snr1
      restrains neuroblast fate (premature neuroblast formation from neuroepithelium, neuroblast perdurance,
      ectopic type II neuroblasts when it is lost). Whether this paper shows Snr1 is needed to maintain
      neuroblasts could not be checked, so the row is left undecided rather than overruled.
    supported_by:
    - reference_id: PMID:28350987
      supporting_text: Here, we use Drosophila neuroblasts to demonstrate that the super elongation complex
        (SEC) acts as an intrinsic amplifier to drive cell fate commitment.
    - reference_id: file:DROME/Snr1/Snr1-notes.md
      supporting_text: the cached abstract is about the super elongation complex and does not mention
        Snr1; full text not available
    - reference_id: PMID:37294080
      supporting_text: Loss of Snr1 in neuroepithelial cells leads to premature neural stem cell formation.
    - reference_id: PMID:37294080
      supporting_text: Additionally, loss of Snr1 in neural stem cells results in inappropriate perdurance
        of neural stem cells into adulthood.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:27923836
  qualifier: located_in
  review:
    summary: Cytoplasm; endogenous Snr1 is in both nucleus and cytoplasm of imaginal disc and salivary
      gland cells.
    action: NEW
    reason: GOA has only nuclear locations for Snr1. Immunostaining shows endogenous Snr1 in the cytoplasm
      as well as the nucleus of wing disc cells, unlike the other SWI/SNF subunits tested. An NES-deleted
      Snr1 fails to suppress overgrowth, so the cytoplasmic pool matters for its tumour-suppressor role.
      The comparator, human SMARCB1, is known to shuttle between nucleus and cytoplasm. Only the location
      is added; the cytoplasmic activity is unknown and is recorded as a knowledge gap.
    supported_by:
    - reference_id: PMID:27923836
      supporting_text: Unlike other components of the SWI/SNF complex that were detected only in the nucleus,
        Snr1 was observed in both the nucleus and the cytoplasm.
    - reference_id: PMID:27923836
      supporting_text: In contrast, although endogenous Snr1 was mainly detected in the nucleus of disc
        cells, its expression was also detected in the cytoplasm of the cells
    - reference_id: PMID:27923836
      supporting_text: These data suggest that the cytoplasmic function of Snr1 is required for its tumor-suppressing
        role in Drosophila imaginal disc.
core_functions:
- description: Core subunit of the BAP and PBAP Brahma (SWI/SNF) complexes, through which it contributes
    to ATP-dependent chromatin remodeling and coactivation of RNA polymerase II target genes (Zeste-dependent
    homeotic genes, Akirin/Relish immune genes, ecdysone-response genes).
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000228
    label: nuclear chromosome
  in_complex:
    id: GO:0035060
    label: brahma complex
  supported_by:
  - reference_id: PMID:7579694
    supporting_text: The snr1 and brm proteins are present in a large (> 2 x 10(6) Da) complex, and they
      co-immunoprecipitate from Drosophila extracts.
  - reference_id: PMID:18299390
    supporting_text: Both complexes share seven core subunits, including the Brahma ATPase, but differ
      in a few signature subunits; POLYBROMO and BAP170 specify PBAP, whereas OSA defines BAP.
  - reference_id: PMID:10809665
    supporting_text: Reconstituted transcription reactions established that the Brahma (BRM) chromatin-remodeling
      complex is essential for Zeste-directed activation on nucleosomal templates.
  - reference_id: PMID:25180232
    supporting_text: A large-scale unbiased proteomic analysis revealed that Akirin orchestrates NF-κB
      transcriptional selectivity through the recruitment of the Osa-containing-SWI/SNF-like Brahma complex
      (BAP).
  - reference_id: PMID:37294080
    supporting_text: Thus, knockdown of Snr1 in either neuroepithelial cells or neuroblasts resulted in
      reduced expression of the Snr1 target genes br and Eip93F.
- description: Regulatory subunit that restricts BRM-dependent remodeling and mediates repression of specific
    targets, together with histone deacetylases and DNA-binding repressors that it contacts (Net in wing
    intervein cells; Earmuff, with HDAC3, in type II neuroblast lineages).
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0035060
    label: brahma complex
  supported_by:
  - reference_id: PMID:15013794
    supporting_text: The SNR1-mediated repression is dependent on cooperation with histone deacetylases
      (HDAC) and physical associations with NET, a localized vein repressor.
  - reference_id: PMID:16990270
    supporting_text: Importantly, SNR1 mediates ATP-independent repression functions of the complex in
      cooperation with histone deacetylases and direct contacts with gene-specific repressors.
  - reference_id: PMID:22467207
    supporting_text: revealing that SNR1 functions to restrict BRM-dependent nucleosome remodeling activities
      downstream of the promoter region.
  - reference_id: PMID:24618901
    supporting_text: Furthermore, Bap60 and Snr1, two other components of the Brm complex, also physically
      associate with Erm in a protein complex.
  - reference_id: PMID:24618901
    supporting_text: Thus, the Brm-HDAC3-Erm complex is a novel repressor complex that suppresses dedifferentiation
      of INPs back into type II neuroblasts.
proposed_new_terms:
- proposed_name: negative regulation of cell dedifferentiation
  proposed_definition: Any process that stops, prevents or reduces the frequency, rate or extent of cell
    dedifferentiation.
  justification: GO has cell dedifferentiation (GO:0043697) but no generic regulation terms for it; only
    vascular associated smooth muscle cell dedifferentiation has them. Snr1, brm, HDAC3 and erm prevent
    intermediate neural progenitors from dedifferentiating into type II neuroblasts (PMID:24618901) and
    are currently annotated to the process itself.
  proposed_parent:
    id: GO:0048523
    label: negative regulation of cellular process
  supported_by:
  - reference_id: PMID:24618901
    supporting_text: Thus, the Brm-HDAC3-Erm complex is a novel repressor complex that suppresses dedifferentiation
      of INPs back into type II neuroblasts.
knowledge_gaps:
- gap_statement: 'The molecular activity of cytoplasmic Snr1 is unknown: which proteins it binds outside
    the nucleus and which step of endosomal trafficking it affects, such that its loss deregulates Notch,
    JNK and JAK/STAT signalling and causes neoplastic overgrowth.'
  boundary: Snr1 is in the cytoplasm and its cytoplasmic pool is needed for tumour suppression in imaginal
    discs (PMID:27923836); the nuclear chromatin-remodeling activity is well established.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  provenance:
  - reference_id: PMID:27923836
    supporting_text: These data suggest that the cytoplasmic function of Snr1 is required for its tumor-suppressing
      role in Drosophila imaginal disc.
  - reference_id: PMID:27923836
    supporting_text: Aberrant regulation of multiple signaling pathways, including Notch, JNK, and JAK/STAT,
      was responsible for tumor progression upon snr1-depletion.
suggested_questions:
- question: Does cytoplasmic Snr1 bind Shibire (dynamin), as human SMARCB1 binds Dynamin-2, and is that
    binding what its tumour-suppressor role in endosomal trafficking needs?
- question: Does Snr1 contact Net and Earmuff directly, and is the repression it mediates independent
    of BRM ATPase activity, as the ATP-independent repression model proposes?
- question: Should PAINT move the npBAF and nBAF IBDs from the Bilateria node PTN000001220 to a vertebrate
    node, or add an IKR on the protostome clade?
suggested_experiments:
- description: Proximity labelling (TurboID) of wild-type, NES-deleted and nuclear-excluded Snr1 in wing
    disc cells to identify cytoplasmic partners, followed by endosome marker and Notch trafficking assays
    in the matching rescue backgrounds.
- description: CUT&RUN for Snr1, Brm, Osa and Polybromo in vein and intervein cells of the wing disc,
    with RNA-seq after snr1 or brm knockdown, to separate Snr1-dependent activated and repressed targets.
