- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000001220
  - UniProtKB:Q12824
  review:
    summary: Transcription coactivator activity, inherited from the Bilateria node of the SMARCB1 subfamily
      (seed human SMARCB1).
    action: ACCEPT
    reason: PAINT placed this IBD on PTN000001220 (Bilateria), seeded by human SMARCB1, with the transcription-coregulator
      IBD at the family root above it. Fly Snr1 descends from it with no recorded loss, and coactivation
      by the SWI/SNF remodeler is an ancestral function of the complex, not a vertebrate one, so the placement
      holds. Fly data agree. The purified BRM complex is essential for Zeste-dependent activation on chromatin.
      Akirin recruits BAP to activate a subset of Relish targets. Snr1 knockdown lowers expression of
      br and Eip93F, and Snr1 sits on their transcribed chromatin. Snr1 is also called a repressor and
      tumour suppressor, and both are true. It restricts BRM activity in wing intervein cells and on ecdysone-induced
      genes. It joins HDAC3 and the repressor Erm to stop intermediate neural progenitors dedifferentiating.
      Its imaginal-disc tumour suppression depends on a cytoplasmic pool and endosomal trafficking, not
      on transcription. These roles coexist with the coactivator activity and do not contradict it. Snr1
      is a coregulator subunit whose output depends on context, so the coactivator term is accepted as
      one core activity. The activity is the complex's, and Snr1 contributes to it as a core subunit.
      The repressive side is recorded on the transcription-factor binding row and in core_functions.
    supported_by:
    - reference_id: file:DROME/Snr1/Snr1-bioinformatics/RESULTS.md
      supporting_text: GO:0003713 transcription coactivator activity sits on the same node, seeded by
        human SMARCB1 (UniProtKB:Q12824).
