id: Q24090
gene_symbol: Snr1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Snf5-related 1 (Snr1, also called BAP45) encodes the Drosophila ortholog of SMARCB1 (SNF5/INI1),
  one of the core subunits shared by the two fly Brahma (SWI/SNF) ATP-dependent chromatin-remodeling complexes,
  BAP (with OSA) and PBAP (with Polybromo, BAP170 and SAYP). Within these complexes Snr1 is a regulatory
  subunit that targets and tunes BRM remodeling. It takes part in transcriptional activation, for example
  of Zeste-dependent homeotic genes, of Akirin-dependent Relish immune targets and of ecdysone-response
  genes. It also takes part in cell-type-specific repression through histone deacetylases and gene-specific
  repressors, such as the wing vein repressor Net and the Fez-family factor Earmuff in neural progenitor
  lineages. SNR1 binds the SET domain of Trithorax and associates with cyclin E. The gene is essential
  and is required throughout development. It controls wing vein and intervein patterning and growth, the
  transition of optic lobe neuroepithelium to neural stem cells and their later differentiation, suppression
  of dedifferentiation of intermediate neural progenitors, and dendrite targeting of olfactory projection
  neurons. Unlike other Brahma complex subunits, Snr1 is also found in the cytoplasm. Its loss causes
  neoplastic overgrowth of imaginal epithelia, with defective endosomal trafficking and deregulated Notch,
  JNK and JAK/STAT signalling, and this tumour-suppressor role requires the cytoplasmic pool.
