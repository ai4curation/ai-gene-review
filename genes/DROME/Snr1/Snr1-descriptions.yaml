findings:
- category: discrepancy
  text: The automated text says Snr1 enables Tat protein binding. The annotation behind it is Snr1 binding
    the fly Fez-family transcription factor Earmuff, so the review modifies it to DNA-binding transcription
    factor binding and records a WRONG_TERM defect.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No text describes Snr1 as a regulatory subunit that both activates and represses Brm target genes,
    the repression depending on HDACs and repressors such as Net and Earmuff.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: insight
  text: Only the FlyBase text records the cytoplasmic, endosomal trafficking-linked tumour-suppressor
    role that separates Snr1 from the other Brahma complex subunits; the review adds a cytoplasm location
    from the same paper.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: The two texts barely overlap. FlyBase gives complex membership and tumour suppression,
    and the automated text lists binding activities and developmental processes. They agree on the Brahma
    complex. The automated text adds a wrong Tat binding activity, and neither describes the coregulator
    role.
