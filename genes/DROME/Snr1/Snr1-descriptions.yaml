descriptions:
- source: Alliance_Imported
  text: Snf5-related 1 (Snr1) encodes a core component of the ATP-dependent SWI/SNF chromatin-remodeling
    complex (Brahma complex). It functions as a tumor suppressor and is required for maintaining normal
    endosomal trafficking-mediated signaling cascades.
  source_type: curated
  url: https://flybase.org/reports/Snr1.html
  source_id: FB:FBgn0011715
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: 'Every claim checks out: core subunit of the Brahma (SWI/SNF) complex, tumour suppressor,
      and required for endosomal trafficking-mediated signalling, which matches the cytoplasmic tumour-suppressor
      role in imaginal discs. It leaves out the main body of Snr1 work: its regulatory role in the complex,
      with both activation (Zeste, Relish, ecdysone targets) and repression (with HDACs, Net and Earmuff),
      Trx and cyclin E binding, and its neural stem cell roles.'
- source: Alliance_Automated
  text: Enables SET domain binding activity and Tat protein binding activity. Involved in several processes,
    including imaginal disc-derived wing morphogenesis; negative regulation of neuroblast proliferation;
    and regulation of DNA-templated transcription. Located in nucleus. Part of brahma complex. Is expressed
    in several structures, including antennal anlage; embryonic/larval midgut primordium; ganglia; head
    epidermis primordium; and imaginal disc. Used to study Coffin-Siris syndrome 3; atypical teratoid
    rhabdoid tumor; and rhabdoid cancer. Human ortholog(s) of this gene implicated in Coffin-Siris syndrome
    3; meningioma; rhabdoid cancer; rhabdoid tumor predisposition syndrome 1; and schwannomatosis (multiple).
    Orthologous to human SMARCB1 (SWI/SNF related BAF chromatin remodeling complex subunit B1).
  source_type: automated
