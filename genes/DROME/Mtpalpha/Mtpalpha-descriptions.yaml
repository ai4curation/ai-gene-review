- source: Alliance_Imported
  text: Mitochondrial trifunctional protein &agr; subunit (Mtp&agr;) encodes a subunit
    of the mitochondrial trifunctional protein. It possesses 3-enoyl-CoA hydratase
    and 3-hydroxyacyl-CoA dehydrogenase activities, which catalyze the second and
    third steps,respectively, of the &bgr;-oxidation of long-chain fatty acids.
