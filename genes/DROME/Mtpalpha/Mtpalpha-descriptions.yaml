- source: Alliance_Automated
  text: Predicted to enable enoyl-CoA hydratase activity and long-chain (3S)-3-hydroxyacyl-CoA
    dehydrogenase (NAD+) activity. Involved in fatty acid beta-oxidation. Located
    in peroxisome. Is expressed in adult head; adult heart; embryonic/larval lymph
    gland; and spermatozoon. Used to study lipid metabolism disorder and steatotic
    liver disease. Human ortholog(s) of this gene implicated in long chain 3-hydroxyacyl-CoA
    dehydrogenase deficiency; mitochondrial trifunctional protein deficiency 1; and
    steatotic liver disease. Orthologous to human HADHA (hydroxyacyl-CoA dehydrogenase
    trifunctional multienzyme complex subunit alpha).
