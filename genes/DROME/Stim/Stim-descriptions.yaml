- source: RefSeq
  text: Enables calcium ion binding activity; calcium-induced calcium release activity;
    and store-operated calcium channel activity. Involved in several processes, including
    chaeta development; detection of calcium ion; and store-operated calcium entry.
    Located in endoplasmic reticulum-plasma membrane contact site. Is expressed in
    several structures, including adult head; ectoderm; embryonic/larval midgut primordium;
    epithelial furrow; and imaginal disc. Used to study dilated cardiomyopathy; hypertrophic
    cardiomyopathy; and obesity. Human ortholog(s) of this gene implicated in Stormorken
    syndrome; gastrointestinal system cancer (multiple); immunodeficiency 10; lung
    cancer; and tubular aggregate myopathy 1. Orthologous to human STIM1 (stromal
    interaction molecule 1) and STIM2 (stromal interaction molecule 2). [provided
    by Alliance of Genome Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/32556
  source_id: GeneID:32556
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: Older release that says Stim enables store-operated calcium channel
      activity and calcium-induced calcium release activity. Stim gates the Orai channel
      rather than forming it, and the review carries neither term; it also drops the
      calcium sensor activity.
findings:
- category: discrepancy
  text: RefSeq states store-operated calcium channel activity and calcium-induced
    calcium release activity. The review treats Stim as the ER Ca2+ sensor and Orai
    regulator, and has neither term.
  sources:
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources agree on Stim as the mediator of store-operated Ca2+
    entry; only the RefSeq version assigns it channel activity itself.
