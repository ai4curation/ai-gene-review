    - rubric: specificity
      score: 3
    overall_notes: 'Correct: ER membrane protein essential for store-operated Ca2+
      entry, with the neuronal flight role. Does not name Orai or the Ca2+-sensing
      mechanism; contains a typo (''endomasplic'').'
- source: Alliance_Automated
  text: Enables calcium ion binding activity and calcium ion sensor activity. Involved
    in several processes, including chaeta development; detection of calcium ion;
    and store-operated calcium entry. Located in endomembrane system. Part of calcium
    channel complex and endoplasmic reticulum-plasma membrane contact site. Is expressed
    in several structures, including adult head; ectoderm; embryonic/larval midgut
    primordium; epithelial furrow; and imaginal disc. Used to study dilated cardiomyopathy;
    hypertrophic cardiomyopathy; and obesity. Human ortholog(s) of this gene implicated
    in several diseases, including Stormorken syndrome; gastrointestinal system cancer
    (multiple); immunodeficiency 10; lung cancer; and tubular aggregate myopathy 1.
    Orthologous to human STIM1 (stromal interaction molecule 1) and STIM2 (stromal
    interaction molecule 2).
  source_type: automated
  url: https://flybase.org/reports/Stim.html
  source_id: FB:FBgn0045073
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
