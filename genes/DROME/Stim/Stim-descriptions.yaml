- source: Alliance_Imported
  text: Stromal interaction molecule (Stim) encodes an endomasplic reticulum-membrane
    protein that is an essential component of the store-operated calcium entry mechanism,
    which in neurons regulates flight.
  source_type: curated
  url: https://flybase.org/reports/Stim.html
  source_id: FB:FBgn0045073
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
