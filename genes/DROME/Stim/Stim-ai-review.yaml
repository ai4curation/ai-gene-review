id: P83094
gene_symbol: Stim
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Stim is the single Drosophila stromal interaction molecule, a single-pass endoplasmic reticulum
  membrane protein that senses ER luminal Ca2+ through an EF-hand/SAM module and activates the plasma
  membrane CRAC channel formed by Orai. When ER Ca2+ stores are depleted, Stim oligomerises and accumulates
  at ER-plasma membrane junctions, where its cytosolic C-terminal region binds and gates Orai, driving
  store-operated Ca2+ entry that refills the ER and sustains cytosolic Ca2+ signals. Stim is essential
  for larval survival, and its loss affects bristle and wing vein patterning, neuronal Ca2+ signaling
  required for flight, and presynaptic Ca2+ handling at ER-plasma membrane contacts.
