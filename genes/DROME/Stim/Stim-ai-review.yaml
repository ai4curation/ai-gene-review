suggested_questions:
- question: Does Drosophila Stim have a functional plasma membrane pool, as reported for mammalian STIM1,
    or does it act exclusively from the ER at ER-PM junctions?
- question: Are the bristle and wing vein phenotypes of dSTIM perturbation mediated through Orai-dependent
    SOCE or through SOCE-independent roles?
suggested_experiments:
- hypothesis: Stim developmental phenotypes in the notum and wing require Orai channel gating.
  description: Compare Stim RNAi phenotypes with Orai dominant-negative (E180A) expression and test rescue
    by a gating-defective Stim SOAR mutant in the same tissues.
