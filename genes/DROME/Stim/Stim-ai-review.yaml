  review:
    summary: Stim binds Ca2+ through its luminal EF-hand, which underlies its sensing of ER Ca2+ content.
    action: ACCEPT
    reason: The EF-hand Ca2+-binding motif is conserved in Stim and is the basis of its sensor function;
      the IBA reflects the conserved STIM family property. The cited paper proposes rather than directly
      measures Ca2+ binding in the text we can see, but the function is clearly correct for the gene family,
      so the curator is deferred to.
