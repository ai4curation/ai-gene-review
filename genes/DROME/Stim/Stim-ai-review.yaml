    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:107476
  - PANTHER:PTN001031746
  - RGD:1306831
  - UniProtKB:Q13586
  - UniProtKB:Q9P246
  - WB:WBGene00021910
  review:
    summary: Plasma membrane localisation for Stim.
    action: KEEP_AS_NON_CORE
    reason: Stim acts mainly from the ER membrane at ER-plasma membrane junctions, where it contacts Orai
      in the plasma membrane; the Zhang et al. model of Stim translocating "to the plasma membrane" reflects
      accumulation at ER-PM junctions. A minor surface pool is described for mammalian STIM1 and is the
      basis of the family-level IBA, but there is no Drosophila evidence that Stim functions as a plasma
      membrane resident protein. ER membrane and ER-PM contact site are the informative locations; the
      plasma membrane rows are retained as non-core.
    supported_by: &id005
    - reference_id: PMID:18820677
      supporting_text: translocating from the ER to junctions adjacent to the plasma membrane
