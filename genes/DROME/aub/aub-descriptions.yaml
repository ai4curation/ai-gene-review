- source: Alliance_Automated
  text: Enables RNA endonuclease activity producing 5'-phosphomonoesters, hydrolytic
    mechanism; mRNA binding activity; and piRNA binding activity. Involved in several
    processes, including dorsal appendage formation; oocyte development; and regulation
    of gene expression. Located in cytoplasm. Is active in P granule and Yb body.
    Is expressed in adult head; female germline cyst; germarium; germline cell; and
    gonad. Orthologous to human PIWIL1 (piwi like RNA-mediated gene silencing 1) and
    PIWIL3 (piwi like RNA-mediated gene silencing 3).
