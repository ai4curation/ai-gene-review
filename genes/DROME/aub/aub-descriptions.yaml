descriptions:
- source: UniProt
  text: Component of the perinuclear meiotic nuage, a germline- specific subcellular
    membraneless ribonucleoprotein compartment involved in production of transposable
    element-repressing Piwi- interacting RNA (piRNA)-induced silencing complexes (piRISCs),
    which are essential for maintaining germline integrity during oogenesis; essential
    for the formation and/or structural integrity of nuage particles (PubMed:12538514,
    PubMed:15090597, PubMed:17428915, PubMed:18590813, PubMed:26212455, PubMed:26295961).
    Acts via the Piwi- interacting RNA (piRNA) metabolic process, which mediates the
    repression of transposable elements during meiosis by forming complexes composed
    of piRNAs and Piwi proteins and governs the methylation and subsequent repression
    of transposons (PubMed:17346786, PubMed:19959991, PubMed:20980675, PubMed:34210982).
    Directly binds piRNAs, a class of 24 to 30 nucleotide RNAs that are generated
    by a Dicer-independent mechanism and are primarily derived from transposons and
    other repeated sequence elements (PubMed:17872506, PubMed:19959991, PubMed:20980675,
    PubMed:26212455, PubMed:26295961). Shows RNA cleavage or slicer activity; including
    aub-piRNA complexes from ovary and testis (PubMed:17322028, PubMed:17872506, PubMed:34210982).
    When loaded with guide piRNAs recognizes and cleaves complementary RNAs to repress
    their expression and produce complementary piRNAs (PubMed:17346786, PubMed:34210982).
    Together with Piwi protein AGO3 recruited to subregions of the perinuclear nuage
    by krimp, which coordinates their activity in the ping-pong amplification step
    of secondary piRNA biogenesis (PubMed:26295961, PubMed:34210982). Krimp recruits
    piRNA bound aub and unbound AGO3, bringing them into close proximity to facilitate
    the loading onto AGO3 of freshly cut piRNAs generated by aub cleavage of target
    sequences; krimp recognizes the piRNA loading state of the Piwi proteins via symmetrically
    dimethylated arginine modification in their N-terminus (PubMed:34210982). Important
    for asymmetric ping-pong amplification to bias production towards antisense piRNAs
    capable of silencing transposable elements (PubMed:26212455). Required for the
    localization of mael and krimp to the meiotic nuage (PubMed:12538514, PubMed:17428915).
    In ovary, associates predominantly with antisense piRNAs that contain uridine
    at their 5' end (PubMed:26212455). In testis, associates with Su(Ste) antisense
    piRNAs (most abundant class of piRNAs found in complex with aub in testes) and
    negatively regulates Ste expression, most likely by cleaving its transcripts (PubMed:17872506).
    Also in testis, may repress translation of vas when associated with a piRNA derived
    from chromosome X, termed AT-chX-1, whose sequence shows strong complementarity
    to vas mRNA (PubMed:17872506). Involved in repression of long interspersed nuclear
    elements (LINEs) including HeT-A, I-element and TART LINEs (PubMed:17428915).
    Repression of specialized telomeric retroelements HeT-A and TART is involved in
    telomere regulation; Drosophila telomeres being maintained by transposition of
    specialized telomeric retroelements (PubMed:16452506). Also involved in telomeric
    trans- silencing, a repression mechanism by which a transposon or a transgene
    inserted in subtelomeric heterochromatin has the capacity to repress in trans,
    in the female germline, a homologous transposon, or transgene located in euchromatin
    (PubMed:14752161, PubMed:15372228). Involved in the suppression of meiotic drive
    of sex chromosomes and autosomes (PubMed:23267055, PubMed:9927466). Involved in
    transposon silencing in the adult brain (PubMed:23559253). Required for dorsal-ventral
    as well as anterior-posterior patterning of the egg (PubMed:11526087). Required
    during oogenesis for primordial germ cell formation and activation of RNA interference
    (PubMed:12154120). During early oogenesis, required for osk mRNA silencing and
    polarization of the microtubule cytoskeleton (PubMed:15035984, PubMed:1783295,
    PubMed:8625849). During mid- oogenesis, required for osk mRNA localization to
    the posterior pole and efficient translation of osk and grk (PubMed:15035984,
    PubMed:1783295, PubMed:8625849). During embryogenesis, required for posterior
    localization of nanos (nos) mRNA, independently of osk, and pole cell formation
    (PubMed:15035984, PubMed:20937269). Forms a complex with smg, twin, AGO3 and specific
    piRNAs that targets nanos mRNA (and probably other maternal mRNAS) for deadenylation
    promoting its decay during early embryogenesis (PubMed:20953170).
