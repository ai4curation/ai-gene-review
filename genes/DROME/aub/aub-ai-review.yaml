id: O76922
gene_symbol: aub
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Aubergine (Aub) is a cytoplasmic PIWI-clade Argonaute of the Drosophila germline. Loaded
  with antisense, 5-uridine piRNAs, Aub localizes to perinuclear nuage, where it slices complementary
  transposon transcripts; the cleavage products are loaded onto Ago3 (with Krimper scaffolding and Tudor-domain
  proteins recognising symmetric dimethylarginines in the Aub N-terminus), driving the ping-pong amplification
  of secondary piRNAs and post-transcriptional transposon silencing. Maternal Aub is also a component
  of posterior germ plasm/polar granules, where piRNA-guided binding traps germ plasm mRNAs and supports
  pole cell formation, while in the bulk embryo it recruits CCR4-NOT to deadenylate and clear maternal
  mRNAs such as nanos.
