suggested_questions:
- question: How does piRNA-guided Aub distinguish targets to slice (transposons) from those to trap (germ
    plasm mRNAs) or deadenylate (nanos)?
suggested_experiments:
- experiment_type: Slicer-dead knock-in
  hypothesis: Germ plasm mRNA trapping by Aub is slicer-independent whereas transposon silencing is slicer-dependent.
  description: Compare germ plasm mRNA localization and TE expression in aub DAH knock-in embryos and
    ovaries.
