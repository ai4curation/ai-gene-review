- source: Alliance_Imported
  text: brother of ihog (boi) encodes a transmembrane protein that binds to the product
    of hh. The products of boi and ihog promote Hh signaling in receiving cells by
    acting as a co-receptor for the effector protein encoded by ptc. The product of
    boi also can suppress Hh signaling through a sequestration and release mechanism
    in cells producing the product of hh. It regulates many hh-dependent processes
    including proliferation, cell fate specification, and patterning.
  source_type: curated
  url: https://flybase.org/reports/boi.html
  source_id: FB:FBgn0040388
