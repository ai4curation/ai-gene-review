    overall_notes: 'Correct and complete: binds Hh, co-receptor with Ihog and Ptc,
      sequestration in producing cells.'
- source: Alliance_Automated
  text: Enables coreceptor activity and hedgehog family protein binding activity.
    Involved in several processes, including compound eye photoreceptor cell differentiation;
    maintenance of protein location in extracellular region; and regionalization.
    Located in cell surface and cytoneme. Is expressed in several structures, including
    Malpighian tubule primordium; embryonic/larval midgut primordium; epithelium;
    gut section; and imaginal disc. Orthologous to human BOC (BOC cell adhesion associated,
    oncogene regulated).
