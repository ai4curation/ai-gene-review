taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Brother of ihog (Boi) is a single-pass type I transmembrane protein of the immunoglobulin
  superfamily (Ihog/CDO/BOC family) with immunoglobulin and fibronectin type III repeats in its ectodomain.
  Boi is a paralog of Interference hedgehog (Ihog) and acts partially redundantly with it as a Hedgehog
  co-receptor (Ihog contributing more to long-range and Boi to short-range signaling in some tissues):
  it binds Hedgehog through an FNIII repeat and, with Patched, mediates Hedgehog reception, so that cells
  lacking both Boi and Ihog cannot activate the Hedgehog pathway in eye and wing imaginal discs. Boi also
  binds and retains Hedgehog on the cell surface; in the ovary, Boi in apical cells sequesters Hedgehog
  and limits its diffusion, thereby restraining follicle stem cell proliferation. Boi localizes to the
  cell surface and to cytonemes, and the Ihog proteins mediate homophilic cell-cell interactions.'
