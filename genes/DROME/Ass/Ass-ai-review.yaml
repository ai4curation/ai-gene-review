id: O97069
gene_symbol: Ass
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Ass (CG1315) encodes the Drosophila argininosuccinate synthase (citrulline--aspartate ligase),
  a type 1 argininosuccinate synthase that condenses L-citrulline with L-aspartate in an ATP-dependent
  reaction to form 2-(N-omega-L-arginino)succinate, AMP and diphosphate. With argininosuccinate lyase
  (Argl) it converts citrulline back to L-arginine in the cytosol, where the enzyme is expected to act
  as a homotetramer. Flies are not known to possess a complete ornithine-urea cycle, so this pathway is
  thought to serve arginine recycling, for instance from the citrulline co-product of nitric oxide synthase,
  rather than urea production.
existing_annotations:
- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00158
  review:
    summary: UniPathway-based mapping of argininosuccinate synthase to the urea cycle.
    action: REMOVE
    reason: The mapping assumes a vertebrate-type hepatic urea cycle. Insects make only one arginase whose
      role is not ammonia detoxification, and Drosophila is not known to have the carbamoyl-phosphate/ornithine
      transcarbamylase arm needed to run the cycle. In flies Ass acts in the citrulline-to-arginine segment
      (L-arginine biosynthetic process), which is already annotated. Treated consistently with the urea-cycle
      IEA on Arg. A comparative analysis of 150 insect genomes found ornithine carbamoyltransferase absent
      from all of them, so no insect can run the urea cycle.
    supported_by:
    - reference_id: PMID:10878001
      supporting_text: Most organisms, including insects, produce only one type of arginase, whose function
        is not centered on ammonia detoxification.
    - reference_id: PMID:40081835
      supporting_text: no insect can synthesize arginine via the urea cycle, as ornithine carbamoyltransferase
        is absent from all genomes analysed
