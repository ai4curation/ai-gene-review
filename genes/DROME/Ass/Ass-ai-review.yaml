  title: 'The loss of the urea cycle and ornithine metabolism in different insect orders: an omics approach.'
  findings:
  - statement: Across 150 insect genomes ornithine carbamoyltransferase is absent, so no insect runs a
      urea cycle; arginase is broadly conserved and ASS/ASL recycle NOS-derived citrulline where retained.
