suggested_questions:
- question: Does Drosophila Ass recycle the citrulline produced by nitric oxide synthase, and is its expression
    co-regulated with Nos in neurons or immune tissues?
suggested_experiments:
- description: Trace 13C/15N-citrulline into arginine in control versus Ass-knockdown larvae to quantify
    the contribution of the Ass-Argl route to the arginine pool.
