descriptions:
- source: Alliance_Imported
  text: Argininosuccinate synthase (Ass) encodes an enzyme that is predicted to catalyze
    the condensation of L- citrulline, a by-product of nitric oxide formation, and
    L-aspartate to form L-argininosuccinate. Ass is probably involved in L-arginine
    biosynthesis.
  source_type: curated
  url: https://flybase.org/reports/Ass.html
  source_id: FB:FBgn0026565
