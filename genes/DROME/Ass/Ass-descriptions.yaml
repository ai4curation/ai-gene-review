    overall_notes: 'Correct: condenses citrulline (from NO synthesis) with aspartate
      for arginine regeneration.'
- source: Alliance_Automated
  text: Predicted to enable argininosuccinate synthase activity. Predicted to be involved
    in L-arginine biosynthetic process. Predicted to be active in cytosol. Human ortholog(s)
    of this gene implicated in citrullinemia; classic citrullinemia; hepatocellular
    carcinoma; and melanoma. Orthologous to human ASS1 (argininosuccinate synthase
    1).
