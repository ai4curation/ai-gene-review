- source: Alliance_Automated
  text: Predicted to contribute to GTPase activator activity. Involved in several
    processes, including germline cell cycle switching, mitotic to meiotic cell cycle;
    negative regulation of TORC1 signaling; and negative regulation of cell size.
    Located in autolysosome and nucleus. Part of Seh1-associated complex. Is expressed
    in adult head. Used to study familial focal epilepsy with variable foci 2. Human
    ortholog(s) of this gene implicated in familial focal epilepsy with variable foci
    2. Orthologous to human NPRL2 (NPR2 like, GATOR1 complex subunit).
