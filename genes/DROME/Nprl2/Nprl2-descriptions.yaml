- source: Alliance_Imported
  text: Nitrogen permease regulator-like 2 (Nprl2) encodes a component of the highly
    conserved GAP activity towards rags 1 (GATOR1) complex, which inhibits the product
    of mTor activity in response to amino acid starvation. The product of Nprl2, as
    well as the other GATOR1 components encoded by Nprl3 and Iml1, regulates early
    meiotic progression.
