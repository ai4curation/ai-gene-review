id: Q8IN89
gene_symbol: wrd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: well rounded (wrd; also called PP2A-B') encodes a B56 (B', PR61) family regulatory subunit
  of Drosophila protein phosphatase 2A, paralogous to widerborst. Wrd joins the Pp2A-29B scaffold and
  Microtubule star catalytic subunit to form a PP2A-B56 holoenzyme and targets it to specific substrates.
  Wrd-PP2A dephosphorylates S6K, so wrd mutants show elevated insulin/TOR signaling, reduced triglycerides
  and shortened lifespan; it also acts downstream of TOR in starvation-induced autophagy. Wrd is enriched
  at central and neuromuscular synapses, where it is required for normal synaptic growth, microtubule
  bundling and transmitter release, and it links Liprin-alpha to PP2A to restrain GSK-3beta and prevent
  ectopic accumulation of synaptic material in axons. In female meiosis PP2A-B56 (Wrd, partly redundant
  with Wdb) maintains sister chromatid cohesion and kinetochore-microtubule attachments, and Wrd levels
  must be kept low by SCF-Fbxo42 for synaptonemal complex assembly.
