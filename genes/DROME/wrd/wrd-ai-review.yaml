suggested_questions:
- question: Is the anti-apoptotic role attributed to B'-containing PP2A in Drosophila mediated by Wrd,
    Wdb or both, and through which substrate?
suggested_experiments:
- hypothesis: Wrd-PP2A directly dephosphorylates S6K at the TORC1 site in vivo.
  description: Express a Wrd variant unable to bind the LxxIxE short linear motif pocket in wrd null flies
    and test S6K T398 phosphorylation, triglyceride levels and lifespan.
  experiment_type: structure-function rescue
