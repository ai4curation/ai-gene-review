- source: Alliance_Automated
  text: Predicted to enable protein phosphatase activator activity. Involved in several
    processes, including negative regulation of signal transduction; neuromuscular
    synaptic transmission; and synaptonemal complex disassembly. Predicted to be located
    in several cellular components, including chromosome, centromeric region; microtubule
    organizing center; and nucleoplasm. Predicted to be part of protein phosphatase
    type 2A complex. Predicted to be active in cytosol and nucleus. Is expressed in
    embryonic/larval neuromuscular junction and larval central nervous system. Human
    ortholog(s) of this gene implicated in autosomal dominant intellectual developmental
    disorder and autosomal dominant intellectual developmental disorder 35. Orthologous
    to human PPP2R5D (protein phosphatase 2 regulatory subunit B'delta) and PPP2R5C
    (protein phosphatase 2 regulatory subunit B'gamma).
