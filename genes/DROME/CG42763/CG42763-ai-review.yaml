id: M9MRG9
gene_symbol: CG42763
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG42763 encodes a small (191-residue) uncharacterised protein that is restricted to
  the Drosophila melanogaster species group. It has a predicted cleavable N-terminal signal peptide
  (residues 1-22) followed by a soluble mature chain with no transmembrane segment, no ER-retention
  signal and no recognised protein family or domain, which suggests that the protein is secreted.
  Full-length orthologs are found only in melanogaster-group drosophilids, and the only detectable D.
  melanogaster relative is the equally uncharacterised CG31606, which matches over part of the
  sequence at a marginal E-value. The gene is transcribed, but its molecular activity, binding
  partners, tissue of action and physiological role have not been studied.
