- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    action: MODIFY
    summary: The sequence supports a secreted product. Extracellular region is the best-supported
      location, but it is a sequence-based inference and has not been observed directly.
    reason: The protein has a SignalP-predicted cleavable signal peptide (residues 1-22) followed by
      a soluble 169-residue mature chain. It has no transmembrane segment and no C-terminal KDEL/HDEL
      ER-retention motif, so the default fate is secretion. The broad term GO:0005576 extracellular
      region is as specific as this evidence allows. A more specific location, such as extracellular
      space or hemolymph, would need direct localisation data, and no experiment has measured where
      the protein is.
    supported_by:
    - reference_id: file:DROME/CG42763/CG42763-uniprot.txt
      supporting_text: SIGNAL          1..22
    - reference_id: file:DROME/CG42763/CG42763-bioinformatics/RESULTS.md
      supporting_text: The C-terminal sequence is ILKYLTRFPSAKCTLPN,
        which has no hydrophobic anchor and no KDEL/HDEL ER-retention motif.
    proposed_replacement_terms:
    - id: GO:0005576
      label: extracellular region
