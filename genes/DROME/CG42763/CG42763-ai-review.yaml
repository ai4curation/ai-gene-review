knowledge_gaps:
- gap_statement: The molecular activity, binding partners, site of expression and physiological
    role of the predicted secreted CG42763 protein are entirely undetermined.
  boundary: The protein is a predicted secreted small protein with a signal peptide and no
    recognised domain. It is restricted to the melanogaster species group, and its only detectable
    paralog (CG31606) is also uncharacterised.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  resolution: Localisation of a tagged protein, a loss-of-function phenotype screen and
    identification of interaction partners.
  provenance:
  - reference_id: file:DROME/CG42763/CG42763-bioinformatics/RESULTS.md
    supporting_text: It has no characterised ortholog
      in any species, no PANTHER subfamily and no PAINT node
suggested_questions:
- question: Is CG42763 secreted into the hemolymph or a reproductive or gut lumen, and in which
    tissues and life stages is it expressed?
- question: Do CG42763 and CG31606 share a fold (for example by structure-prediction comparison),
    and did they arise by duplication within the melanogaster group?
suggested_experiments:
- description: Express an epitope-tagged CG42763 under its native regulatory region and test
    whether the protein is secreted, and whether removing the signal peptide abolishes secretion.
- description: Make a CRISPR null allele and screen for viability, fertility, immune and
    metabolic phenotypes, alone and combined with a CG31606 null to test for redundancy.
