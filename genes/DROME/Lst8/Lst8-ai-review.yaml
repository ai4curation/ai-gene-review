taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Lst8 (GbetaL/mLST8 homolog) is a small WD40-repeat beta-propeller protein that binds the
  kinase domain of the TOR kinase and is the only conserved TOR-binding protein found in both TOR complex
  1 and TOR complex 2. Genetic analysis in Drosophila shows that, despite its physical presence in both
  complexes, Lst8 functions exclusively in TORC2: lst8 null mutants retain TORC1 activity, but lose TORC2
  function, with reduced cell-autonomous growth that is rescued by Myc. Through TORC2, Lst8 is required
  for TORC2-dependent Akt hydrophobic-motif phosphorylation and for nuclear localization of Myc. Lst8
  is cytoplasmic and also interacts with the Golgi PI4P effector GOLPH3.'
