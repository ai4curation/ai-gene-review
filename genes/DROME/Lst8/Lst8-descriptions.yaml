descriptions:
- source: UniProt
  text: Subunit of TORC1 and TORC2, which regulate cell growth and survival in response
    to nutrient and hormonal signals (PubMed:22493059, PubMed:25999153). Essential
    for TORC2-mediated regulation of cell growth and phosphorylation of Akt1 (PubMed:22493059,
    PubMed:25999153). However it is not required for TORC1-mediated functions such
    as TORC1- dependent regulation of cell growth, autophagy and phosphorylation of
    S6K (PubMed:22493059).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W328
  source_id: Q9W328
