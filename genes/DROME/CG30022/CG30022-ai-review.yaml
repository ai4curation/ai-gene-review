  - UniProtKB-SubCell:SL-0173
  review:
    summary: Mitochondrion from ARBA/UniProt subcellular location; the organelle claim holds.
    action: ACCEPT
    reason: >-
      Root organelle term from an electronic synthesis row, so the check is whether the organelle claim
      holds. It does, by family membership and sequence: CG30022 falls in the mitochondrial ETHE1
      subfamily (PANTHER PTHR43084:SF1), and the fly sequence has an approximately 50-residue N-terminal
      region predicted to target mitochondria. No fly localization assay exists. Human ETHE1 is a
      matrix enzyme, but the mitochondrion term is informative in its own right and is kept rather than
      replaced by a sub-compartment; the organelle is where the core sulfide-oxidation activity acts.
    supported_by:
