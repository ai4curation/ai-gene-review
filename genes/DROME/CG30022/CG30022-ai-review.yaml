    label: nucleoplasm
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:O95571
  review:
    summary: Nucleoplasm transferred from human ETHE1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Nuclear localization of human ETHE1 comes from an early study of overexpressed protein (originally
      named HSCO), whereas the catalytic function is in the mitochondrial matrix, where the human protein
      is localized experimentally. No fly data support a nuclear pool; over-annotation for the fly ortholog.
