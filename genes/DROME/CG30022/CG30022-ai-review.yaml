id: A0ACM8PZC4
gene_symbol: CG30022
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG30022 encodes the Drosophila melanogaster ortholog of ETHE1, the mitochondrial persulfide dioxygenase
  (sulfur dioxygenase), a non-heme Fe(II)-dependent member of the metallo-beta-lactamase (glyoxalase II-like)
  superfamily. By orthology it oxidizes glutathione persulfide (S-sulfanylglutathione), formed when sulfide:quinone
  oxidoreductase oxidizes hydrogen sulfide, to sulfite with release of glutathione, the second step of
  the mitochondrial sulfide oxidation pathway, in the mitochondrial matrix. Its activity, localization
  and physiological role have not been examined experimentally in flies. In UniProt the gene is also annotated
  with the name CG9026.
