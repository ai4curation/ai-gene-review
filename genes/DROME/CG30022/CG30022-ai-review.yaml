proposed_new_terms: []
suggested_questions:
- question: >-
    Do CG30022 mutant flies accumulate sulfide, thiosulfate and C4/C5 acylcarnitines as in ETHE1-deficient
    ethylmalonic encephalopathy?
- question: >-
    UniProt lists two entries for this gene (A0ACM8PZC4 and Q86PD3) and gives the name CG9026 on one;
    which is the canonical product?
suggested_experiments:
- description: >-
    Generate CG30022 null flies and measure tissue H2S, thiosulfate and persulfide levels; assay recombinant
    CG30022 with glutathione persulfide.
  hypothesis: CG30022 is the fly persulfide dioxygenase and its loss causes sulfide toxicity.
