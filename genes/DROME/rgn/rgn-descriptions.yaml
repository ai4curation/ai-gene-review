  text: Predicted to enable carbohydrate binding activity. Involved in tissue regeneration.
    Predicted to be active in trans-Golgi network and trans-Golgi network transport
    vesicle. Is expressed in adult heart and prothoracic leg disc. Human ortholog(s)
    of this gene implicated in cerebral amyloid angiopathy; coronary artery disease;
    and myocardial infarction. Orthologous to several human genes including CLEC9A
    (C-type lectin domain containing 9A); CLEC2A (C-type lectin domain family 2 member
    A); and CLEC2B (C-type lectin domain family 2 member B).
