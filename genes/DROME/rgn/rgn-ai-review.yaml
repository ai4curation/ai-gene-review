  review:
    action: UNDECIDED
    summary: Transport-vesicle residence remains unresolved for the same PTHR23211:SF0 transfer.
    reason: PANTHER:PTN000575073 also drives the trans-Golgi transport-vesicle placement from mammalian
      TGN38/TGOLN proteins in PTHR23211:SF0. A signal peptide and C-type lectin fold make Rgn compatible
      with secretory-pathway entry but do not identify a trans-Golgi transport vesicle, and no cached
      target-specific evidence places the 808-residue Rgn product in TGN-derived vesicles or a TGN38-like
      trafficking cycle. Because the target and seeds are in the same PANTHER subfamily, the row is
      unresolved rather than demonstrably over-propagated.
