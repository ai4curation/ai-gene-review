  review:
    action: UNDECIDED
    summary: The same-subfamily trans-Golgi-network IBA remains unresolved for fly Rgn.
    reason: PANTHER:PTN000575073 propagates trans-Golgi localization from mammalian TGN38/TGOLN proteins.
      Those seeds and M9PFV8 are all classified in PTHR23211:SF0, so this is not a cross-subfamily
      transfer. Drosophila Rgn is nevertheless an 808-residue secretory-pathway C-type-lectin-domain
      regeneration factor with no target-specific localization experiment or direct evidence for a
      TGN38-like cargo-receptor cycle, so the exact inherited trans-Golgi location should remain unresolved.
