  review:
    action: REMOVE
    summary: Trans-Golgi network residence is propagated from TGN38/TGOLN2, but Rgn lacks the membrane
      anchor and sorting signal that define that localization, and shows no detectable sequence
      conservation with the seeds.
    reason: PANTHER:PTN000575073 is the single annotated node of PTHR23211 and its IBD for trans-Golgi
      network is seeded by vertebrate TGN38/TGOLN2 proteins, which are type I membrane proteins whose
      trans-Golgi residence and recycling depend on a single transmembrane segment and the cytoplasmic
      YQRL tyrosine sorting motif. Although M9PFV8 is classified in the same PANTHER subfamily
      (PTHR23211:SF0), it has no transmembrane segment and no C-terminal tyrosine motif (the UniProt
      record carries no transmembrane feature; our hydropathy scan found none after the signal peptide),
      and its domain architecture (signal peptide, C-type lectin-like domain, charged disordered tail) is
      unlike TGN38. Local alignment of Rgn to the TGOLN2 and TGN38 seeds is confined to the
      compositionally biased disordered region and is not distinguishable from composition-matched
      shuffled controls, whereas Rgn's lectin-like domain aligns clearly to PTHR22803 C-type lectins.
      The target therefore lacks the determinants of the propagated compartment, and no experiment places
      Rgn in the trans-Golgi network. Transit of a signal-peptide protein through the Golgi would not
      justify an is_active_in assertion.
