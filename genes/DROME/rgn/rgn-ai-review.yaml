description: Regeneration is a secretory-pathway C-type-lectin-domain protein implicated in imaginal-disc
  regeneration and intestinal epithelial repair. Genetic perturbation affects blastema formation, intestinal
  progenitor signaling and regenerative growth, while its ligand specificity and direct subcellular localization
  remain unresolved.
