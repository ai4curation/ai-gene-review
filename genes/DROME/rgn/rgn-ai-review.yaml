- term:
    id: GO:0042246
    label: tissue regeneration
  evidence_type: IMP
  original_reference_id: PMID:18485344
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Reducing rgn dosage delays blastema formation in imaginal-disc regeneration, and rgn
      deficiency in gut progenitors impairs epithelial repair.
    reason: Two independent P-element alleles in CG6014 (rgn1, rgn2) fail to complement. Heterozygous
      animals delay blastema formation by about one day under both wg-induced and fragmentation-induced
      regeneration, and they reduce regeneration-induced transdetermination. Precise excisions of rgn1
      suppress its semi-lethality and revert the transdetermination phenotype. An independent 2026 study (abstract only) reports that rgn deficiency in intestinal
      progenitors disrupts Notch signalling, depletes intestinal stem cells and causes intestinal atrophy
      during epithelial repair. GO:0042246 is as specific as the evidence allows, because GO has no
      imaginal-disc regeneration term and the molecular mechanism is unknown. The process term is broad
      and may partly reflect a regulatory role (the authors speculate that Rgn attenuates Wg signalling),
      so regulation terms are not proposed.
    additional_reference_ids:
    - PMID:41935796
    supported_by:
    - reference_id: PMID:18485344
      supporting_text: We conclude that two gene copies of rgn are required for proper timing of blastema
        formation and to initiate blastema cell division and growth.
    - reference_id: PMID:41935796
      supporting_text: we demonstrate that Rgn deficiency in progenitors disrupts Notch signaling
