  review:
    action: UNDECIDED
    summary: Trans-Golgi-network residence is unresolved for the exact long isoform.
    reason: The IBA is a curated phylogenetic assertion. The 808-residue record contains an N-terminal
      signal peptide and a C-type lectin domain; those features establish secretory-pathway compatibility
      but do not distinguish soluble secretion from Golgi residence.
