suggested_questions:
- question: Is the PTHR23211 (TGN38) classification of Rgn and its insect orthologs a genuine homology,
    or does it come from HMM matches to the shared charged, low-complexity region? Rgn has no transmembrane
    segment or YQRL motif, and its pairwise similarity to TGN38/TGOLN2 is not above shuffled controls.
- question: Where does Rgn act? Is it secreted into the extracellular space, retained in the secretory
    pathway, or associated with the cell surface?
- question: Does the Rgn C-type lectin-like domain bind Wingless or heparan sulfate, given that it lacks
    the canonical Ca2+/sugar-binding motifs?
suggested_experiments:
- hypothesis: Rgn is a secreted protein that acts extracellularly at the regeneration blastema.
  description: Tag endogenous rgn (CRISPR knock-in) with a functional-rescue test, then image it in
    regenerating discs and gut with and without permeabilisation to determine whether it is secreted
    and where it acts.
  experiment_type: localization
- hypothesis: The non-canonical Rgn CTLD binds a glycoprotein or glycosaminoglycan ligand such as Wingless
    or heparan sulfate rather than simple sugars.
  description: Express the purified Rgn CTLD and test binding to a glycan array, heparan sulfate and
    Wingless, with and without calcium.
  experiment_type: binding assay
