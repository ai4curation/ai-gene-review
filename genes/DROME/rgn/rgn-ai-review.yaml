id: M9PFV8
gene_symbol: rgn
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Regeneration (Rgn, CG6014) is a Drosophila protein with an N-terminal signal peptide, a
  C-type lectin-like domain (residues 70-199) and a long, highly charged, predicted disordered C-terminal
  region; it has no transmembrane segment. The gene encodes two nearly identical products (808 and 800
  residues) that differ by eight residues inside the lectin-like domain. rgn is not expressed in undamaged
  leg imaginal discs but is induced in blastema cells after disc fragmentation or ubiquitous Wingless
  expression, and reducing rgn dosage delays blastema formation and lowers regeneration-induced
  transdetermination. rgn is also required in adult intestinal progenitors for Notch signalling,
  intestinal stem-cell maintenance and epithelial repair. Its molecular activity, ligand and
  subcellular site of action are unknown; the lectin-like domain lacks the canonical calcium- and
  sugar-binding motifs, so carbohydrate binding is not established.
