- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000415793
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The C-type lectin-like domain is real, but it lacks the canonical calcium/sugar-binding
      motifs and no ligand has been measured, so carbohydrate binding is a fold-level over-inference.
    reason: The rule transfers carbohydrate binding from the presence of a C-type lectin-like domain.
      C-type lectin-like domains are a fold, and many bind proteins, lipids or nothing carbohydrate-like.
      In canonical Ca2+-dependent CTLDs, sugar binding uses the EPN (mannose-type) or QPD (galactose-type)
      motif and the WND motif at calcium site 2; the Rgn CTLD has none of these, and the UniProt
      PROSITE-ProRule annotation itself cautions that conserved residues are missing. No ligand assay exists
      for Rgn. The original description of Rgn raises Wingless glycoprotein binding only as a speculation.
    supported_by:
    - reference_id: file:DROME/rgn/rgn-bioinformatics/RESULTS.md
      supporting_text: 'CTLD (70-199): cysteines at 74, 91, 174, 190 and 198. EPN absent; QPD absent;
        WND absent.'
    - reference_id: file:DROME/rgn/rgn-uniprot.txt
      supporting_text: 'CC   -!- CAUTION: Lacks conserved residue(s) required for the propagation of

        CC       feature annotation. {ECO:0000256|PROSITE-ProRule:PRU00040}.'
    - reference_id: PMID:18485344
      supporting_text: Such domains have been reported to bind a variety of ligands, principally carbohydrates,
        but also glycoproteins, lipids, receptors and inorganic surfaces
- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: ISS
  original_reference_id: PMID:16475980
  qualifier: enables
  supporting_entities:
  - FB:FBgn0016675
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The ISS donor, galactose-specific lectin-galC1 (DL1), belongs to a different PANTHER family
      (PTHR22803) and retains sugar-binding motifs that Rgn lacks.
    reason: The donor FBgn0016675 (lectin-galC1, UniProt Q9VIX1) is a small secreted galactose-specific
      C-type lectin classified in PTHR22803, whereas Rgn is classified in PTHR23211. The similarity between
      the two is limited to the C-type lectin-like domain (31.5% identity over ~110 residues). That
      relationship supports a shared fold, not a shared ligand, and Rgn lacks the QPD/EPN and WND motifs
      used for Ca2+-dependent sugar binding. PMID:16475980 characterises DL1, not Rgn. Same action as the
      IEA row for this term.
    supported_by:
