  label: Drosophila melanogaster
description: Regeneration is a secretory-pathway C-type-lectin-domain protein implicated in imaginal-disc
  regeneration. Genetic perturbation affects blastema formation and growth, while its ligand specificity
  and the relationship between the 808-residue isoform and its inferred trans-Golgi localization remain
  unresolved.
