  review:
    action: REMOVE
    summary: The trans-Golgi-network IBA over-propagates a mammalian TGN38/TGOLN compartment to divergent
      fly Rgn.
    reason: PANTHER:PTN000575073 propagates trans-Golgi localization from mammalian TGN38/TGOLN proteins
      in PTHR23211. Drosophila Rgn is a divergent secretory C-type-lectin-domain regeneration factor;
      its cached UniProt record predicts secretory-pathway entry and an N-terminal C-type lectin domain
      but no post-signal membrane anchor, and the target-specific primary papers support regeneration
      roles rather than TGN residence or a TGN38-like cargo-receptor cycle.
