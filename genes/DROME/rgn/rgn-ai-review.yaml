    label: trans-Golgi network transport vesicle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:105079
  - PANTHER:PTN000575073
  review:
    action: REMOVE
    summary: TGN-derived transport-vesicle residence is propagated from the TGN38 recycling cycle, which
      requires a transmembrane cargo-receptor architecture that Rgn lacks.
    reason: The same node (PANTHER:PTN000575073) propagates trans-Golgi network transport vesicle
      localization seeded by mouse TGN38 (MGI:105079). That localization reflects TGN38 cycling between
      the trans-Golgi network and the plasma membrane as an integral membrane protein, driven by its
      cytoplasmic tyrosine motif. Rgn has no transmembrane segment and no tyrosine sorting motif, its
      architecture is a signal peptide plus C-type lectin-like domain plus charged disordered tail, and
      no sequence conservation with the seeds was detected above shuffled controls. No experiment
      places Rgn in TGN-derived vesicles.
    supported_by:
