  evidence_type: IMP
  original_reference_id: PMID:18485344
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Rgn contributes to imaginal-disc regeneration and intestinal epithelial repair.
    reason: The full text of PMID:18485344 maps rgn alleles to CG6014 and reports altered blastema regeneration
      after genetic perturbation; the abstract of PMID:41935796 reports that Rgn deficiency perturbs gut
      progenitor signaling and intestinal stem-cell maintenance. The broad gene-level regeneration process
      is well supported although the ligand, molecular mechanism and isoform contributions remain unresolved.
    additional_reference_ids:
