- source: Alliance_Automated
  text: Predicted to enable delta(3)-delta(2)-enoyl-CoA isomerase activity. Predicted
    to be involved in fatty acid beta-oxidation. Predicted to be located in mitochondrion
    and peroxisome. Predicted to be active in peroxisomal matrix. Is expressed in
    adult heart and embryonic Malpighian tubule. Orthologous to human ECI2 (enoyl-CoA
    delta isomerase 2).
