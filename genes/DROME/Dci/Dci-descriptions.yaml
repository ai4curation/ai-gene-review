descriptions:
- source: Alliance_Imported
  text: Dodecenoyl-CoA delta-isomerase (Dci) encodes a putative peroxisomal enzyme
    that catalyzes the isomerization of 3-cis (3Z) and 3-trans (3E) double bonds into
    2-trans (2E) in mono- and polyunsaturated enoyl-CoA thioesters in peroxisomal
    fatty acid beta-oxidation. When overexpressed, extends lifespan, enhances stress
    tolerance to oxidative and starvation stress and activates the product of foxo.
  source_type: curated
  url: https://flybase.org/reports/Dci.html
  source_id: FB:FBgn0035169
