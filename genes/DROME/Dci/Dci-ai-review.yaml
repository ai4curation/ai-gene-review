core_functions:
- description: >-
    delta(3),delta(2)-enoyl-CoA isomerase (EC 5.3.3.8): repositions the double bond of (3Z)/(3E)-enoyl-CoA
    intermediates to (2E)-enoyl-CoA, the auxiliary step that lets unsaturated fatty acids with double
    bonds at odd-numbered positions re-enter the beta-oxidation spiral. Dci is the peroxisomal-type
    (PECI/ECI2-class) isomerase in Drosophila. Assigned by family membership (PANTHER PTHR43684:SF1,
    ECH_1 domain) and a C-terminal PTS1 (-AKL); the fly enzyme has not been assayed directly.
  supported_by:
  - reference_id: file:DROME/Dci/Dci-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: "PANTHER; PTHR43684:SF1; ENOYL-COA DELTA ISOMERASE 2; 1."
  - reference_id: file:DROME/Dci/Dci-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: "Pfam; PF00378; ECH_1; 1."
