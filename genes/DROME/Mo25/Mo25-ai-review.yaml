- term:
    id: GO:1904263
    label: positive regulation of TORC1 signaling
  evidence_type: TAS
  original_reference_id: PMID:36899949
  qualifier: involved_in
  review:
    summary: Annotation from a study of LKB1 regulation by PDK1, where the LKB1 complex activates AMPK
      and thereby lowers mTOR activity.
    action: MODIFY
    reason: The LKB1-Stlk-Mo25 complex activates AMPK, which inhibits TORC1; cells with hyperactive (phospho-deficient)
      LKB1 show decreased mTOR activity. The direction of the annotation is therefore inverted; negative
      regulation of TORC1 signaling is the appropriate term (matching the Lkb1 review).
    proposed_replacement_terms:
    - id: GO:1904262
      label: negative regulation of TORC1 signaling
    supported_by:
    - reference_id: PMID:36899949
      supporting_text: Cells expressing phospho-deficient LKB1 consequently display enhanced AMPK activation
        and decreased mTOR activity, resulting in reduced cell size.
