  label: Drosophila melanogaster
description: Mo25 is the Drosophila ortholog of the MO25/CAB39 armadillo-repeat scaffold protein. Together
  with the pseudokinase Stlk (STRAD), it forms a heterotrimeric complex with the tumor-suppressor kinase
  LKB1 that stabilizes LKB1 in an active conformation, so that the complex phosphorylates and activates
  AMPK and AMPK-related kinases and thereby restrains TORC1-dependent growth. Mo25 is cytoplasmic and
  can be recruited to the cell cortex by LKB1. In neuroblasts, Mo25 also acts with the GC (germinal center)
  kinase Fray to control basal localization of the cell-fate determinant Miranda during asymmetric cell
  division.
