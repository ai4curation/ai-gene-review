- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine kinase activator activity. Predicted
    to be involved in positive regulation of TORC1 signaling. Located in cytoplasm
    and nucleus. Is expressed in adult head; anterior midgut primordium; embryonic
    Malpighian tubule; embryonic/larval midgut; and posterior midgut primordium. Human
    ortholog(s) of this gene implicated in disease of cellular proliferation and hepatocellular
    carcinoma. Orthologous to human CAB39 (calcium binding protein 39) and CAB39L
    (calcium binding protein 39 like).
