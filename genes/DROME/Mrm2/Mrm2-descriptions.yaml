descriptions:
- source: UniProt
  text: S-adenosyl-L-methionine-dependent 2'-O-ribose methyltransferase that catalyzes
    the formation of 2'-O-methyluridine at position 1579 (Um1579) in the mitochondrial
    large subunit ribosomal RNA (mtLSU rRNA), a universally conserved modification
    in the peptidyl transferase domain of the mtLSU rRNA. This activity may require
    prior 2'-O-methylguanosine modification at position 1580 (Gm1580) by MRM3. Essential
    for late-stage assembly of mtLSU required for efficient translation of mitochondrial
    DNA encoded proteins; methyltransferase activity is not required for this function.
    Essential for mitochondrial respiratory function.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VDT6
