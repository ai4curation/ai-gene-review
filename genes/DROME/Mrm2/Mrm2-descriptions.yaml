- source: Alliance_Automated
  text: Predicted to enable rRNA (uridine-2'-O-ribose)-methyltransferase activity.
    Involved in mitochondrial large ribosomal subunit assembly. Predicted to be active
    in mitochondrion. Is expressed in adult head. Used to study mitochondrial DNA
    depletion syndrome 17. Human ortholog(s) of this gene implicated in mitochondrial
    DNA depletion syndrome 17. Orthologous to human MRM2 (mitochondrial rRNA methyltransferase
    2).
