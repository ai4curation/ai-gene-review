suggested_questions:
- question: Which nucleotide of Drosophila mt:lrRNA corresponds to the human MRM2 target uridine, and
    is it 2'-O-methylated in a Mrm2-dependent way?
- question: Does fly Mrm2, like human MRM2, support mitochondrial large-subunit assembly independently
    of its catalytic activity?
suggested_experiments:
- hypothesis: Mrm2 installs the conserved A-loop uridine 2'-O-methylation in fly mt:lrRNA.
  description: Map 2'-O-methylation of mt:lrRNA by RiboMeth-seq or LC-MS/MS in control and Mrm2-knockdown
    or null flies, and assay recombinant Mrm2 on fly mt-rRNA substrates.
- hypothesis: Catalytically dead Mrm2 (K201A) rescues fly development and mtLSU assembly.
  description: Rescue Mrm2 RNAi or null animals with wild-type or K201A transgenes; measure mtLSU/mtSSU
    sedimentation, mitochondrial translation and respiratory-chain levels.
