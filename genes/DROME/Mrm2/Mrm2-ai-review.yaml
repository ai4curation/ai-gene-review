gene_symbol: Mrm2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mrm2 (CG11447) encodes the Drosophila mitochondrial rRNA methyltransferase 2, a nuclear-encoded
  precursor with an N-terminal mitochondrial targeting sequence and a single FtsJ/RlmE-family class I
  SAM-dependent methyltransferase domain. It belongs to the same PANTHER subfamily as bacterial RlmE and
  human MRM2, which 2'-O-methylate a universally conserved uridine in the A-loop of the large-subunit
  rRNA peptidyl transferase centre, and it retains the catalytic lysine and SAM-binding residues of those
  enzymes. Human MRM2 also acts as a late-stage assembly factor for the mitochondrial ribosome large subunit,
  a role that does not need its methyltransferase activity. In flies, RNAi knockdown of Mrm2 causes developmental
  delay, late-pupal lethality and reduced respiratory-chain subunit levels, and muscle-specific knockdown
  impairs locomotion, consistent with a requirement in mitochondrial ribosome biogenesis. The fly modification
  site and enzyme activity have not been measured directly.
