gene_symbol: Mrm2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mrm2 is a mitochondrial RlmE-family rRNA 2-prime-O-methyltransferase and large-ribosomal-subunit
  assembly factor. Its N-terminal targeting sequence directs it toward the mitochondrial compartment,
  where homologous MRM2 proteins modify rRNA and support late mitoribosome maturation. Fly knockdown severely
  impairs development; biochemical work on human MRM2 separates its assembly requirement from its methyltransferase
  activity.
