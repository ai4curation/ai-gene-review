suggested_questions:
- question: Is the reported requirement for pnr in Toll-pathway antimicrobial peptide induction (genome-wide
    S2 RNAi screen) direct, or does it reflect the U-shaped hit and an indirect cell-state effect?
- question: Should pnr carry a dorsal closure (GO:0007391) annotation given that it is required upstream
    of dpp in leading-edge epidermis, or is acts-upstream-of the appropriate representation for a transcriptional
    regulator of this process?
- question: Do Pnr-alpha and Pnr-beta differ in their cardiogenic activity, as they do in proneural regulation?
suggested_experiments:
- description: Mesoderm-specific degron depletion of Pnr after cardiac specification, combined with CUT&RUN
    for Pnr, Tin and Doc, to define direct shared cardiac enhancers and late (adult heart) Pnr targets.
