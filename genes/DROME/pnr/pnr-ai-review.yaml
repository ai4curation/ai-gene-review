  review:
    summary: 'Phylogenetic inference (GATA family node PTN001600628) that pnr negatively regulates Pol
      II transcription. Pnr acts as a repressor in some contexts: it represses a pericardial fate in cardiac
      mesoderm, Pnr-beta represses pnr-alpha transcription, and some pnr alleles cause gain of achaete-scute
      expression.'
    action: KEEP_AS_NON_CORE
    reason: GATA factors are context-dependent activators/repressors and the node placement is sound;
      for pnr, repression is documented (pnr-alpha repression by Pnr-beta; opposing effects on achaete-scute)
      but its best-characterized activity is activation, so this is kept as a non-core aspect.
    supported_by:
