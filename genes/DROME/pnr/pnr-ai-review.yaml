id: P52168
gene_symbol: pnr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'pannier (pnr) encodes a GATA-family transcription factor with two C4 zinc fingers (GATA
  domain); two isoforms (Pnr-alpha and Pnr-beta) are produced from alternative promoters. Pnr binds GATAAG
  sites and activates transcription; its N-terminal zinc finger heterodimerizes with the FOG-family cofactor
  U-shaped (Ush), which inhibits Pnr activity. Pnr acts in the nucleus in two principal settings. In the
  dorsal mesoderm it is a cardiogenic factor: induced by Dpp together with Tinman and Dorsocross, it cross-regulates
  with these factors, synergizes with Tinman (with which it physically associates) and directly activates
  cardiac targets such as Hand and Tbx20/neuromancer, and is required for formation of cardioblasts, pericardial
  cells and lymph gland; mouse GATA4 can substitute for it. Pnr also contributes to adult heart physiology.
  In the dorsal ectoderm and the notum region of the wing imaginal disc it acts as a selector-like factor
  specifying medial dorsal identity, is required for embryonic dorsal closure (as an upstream activator
  of dpp in leading-edge cells) and for pupal thorax closure, and serves as the prepattern factor that
  directly activates the achaete-scute proneural genes through the dorsocentral enhancer, bridged by the
  cofactor Chip to Achaete/Scute-Daughterless at the promoter, so positioning dorsocentral and scutellar
  bristles.'
