    overall_notes: 'Correct: activator of achaete-scute genes in dorsal fate, nervous
      system and lymph gland development. Heart development and the GATA family are
      not named.'
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific;
    RNA polymerase II-specific DNA-binding transcription factor binding activity;
    and protein heterodimerization activity. Involved in several processes, including
    heart development; pericardial nephrocyte differentiation; and regulation of gene
    expression. Acts upstream of with a positive effect on imaginal disc fusion, thorax
    closure. Located in nucleus. Is expressed in several structures, including amnioserosa
    anlage; anterior-posterior subdivision of organism; cardiogenic mesoderm; epithelium;
    and imaginal disc. Human ortholog(s) of this gene implicated in several diseases,
    including adenocarcinoma (multiple); artery disease (multiple); atrial fibrillation
    (multiple); congenital heart disease (multiple); and cryptorchidism. Orthologous
    to several human genes including GATA5 (GATA binding protein 5).
