descriptions:
- source: UniProt
  text: Transcriptional regulator involved in several developmental processes during
    embryonic and imaginal disks development. Involved in determining dorsal cell
    fate. Acts as an essential transcriptional regulator of proneural achaete-scute
    complex (AS-C) and is required for its spatial regulation during development of
    the adult peripheral nervous system, and hence for the positioning of neural precursors.
    It is the only factor to directly activate AS-C genes.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52168
  source_id: P52168
