    overall_notes: Correct on dorsal fate and direct achaete-scute activation. Omits
      the cardiogenic role, U-shaped and dorsal closure.
- source: Alliance_Imported
  text: pannier (pnr) encodes a transcription factor that acts as an activator of
    proneural achaete-scute complex genes. Its roles include dorsal cell fate determination,
    nervous system development and lymph gland development.
