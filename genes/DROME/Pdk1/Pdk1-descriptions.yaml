      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: Ser/Thr kinase in insulin receptor signaling that phosphorylates
      and activates Akt1 and S6k to control cell growth and organ size. Adds anti-apoptotic,
      axon pathfinding and spermatogenesis roles, the last two hedged.'
- source: Alliance_Automated
  text: Enables 3-phosphoinositide-dependent protein kinase activity and protein kinase
    activator activity. Involved in several processes, including phosphatidylinositol
    3-kinase/protein kinase B signal transduction; positive regulation of cell size;
    and synaptic assembly at neuromuscular junction. Located in neuromuscular junction.
    Is expressed in several structures, including adult brain cell body rind; central
    brain anlage; central brain primordium; embryonic dorsal epidermis; and embryonic
    head epidermis. Used to study alcohol use disorder. Human ortholog(s) of this
    gene implicated in prostate cancer. Orthologous to several human genes including
    PDPK1 (3-phosphoinositide dependent protein kinase 1).
  source_type: automated
  url: https://flybase.org/reports/Pdk1.html
