descriptions:
- source: UniProt
  text: Serine/threonine kinase required for embryonic development. Inhibits apoptosis.
    Acts in the insulin receptor transduction pathway which regulates cell growth
    and organ size, by phosphorylating and activating Akt1 and S6k. May be involved
    in axonal pathfinding and synaptogenesis, and in spermatogenesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W0V1
  source_id: Q9W0V1
  review:
