gene_symbol: Cables1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cables1 is a cyclin-fold protein required for the organization of sensory and motile cilia
  in Drosophila. It is recruited to maturing sperm basal bodies, and its loss disrupts neuronal ciliary
  architecture and the central pair of sperm axonemal microtubules. Its molecular activity at the basal
  body remains unresolved.
