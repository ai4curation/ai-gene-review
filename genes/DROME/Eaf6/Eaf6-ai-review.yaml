id: Q9VRN3
gene_symbol: Eaf6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Eaf6 is the Drosophila homolog of the small, conserved MEAF6/EAF6 subunit shared by several
  MYST histone acetyltransferase complexes. It is a subunit of the Enok (MOZ/MORF-type) complex with the
  catalytic subunit Enok, the scaffold Br140 and Ing5, and is required for the complex's acetylation of
  histone H3 lysine 23 in vivo. By orthology with yeast and human EAF6 it is inferred to belong also to
  Tip60/NuA4-type acetyltransferase complexes, but direct evidence for this in flies is unresolved. Through
  the Enok complex it contributes to H3K23 acetylation and to promoting the G1/S transition.
