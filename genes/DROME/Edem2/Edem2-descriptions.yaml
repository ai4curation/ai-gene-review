- source: Alliance_Imported
  text: ER degradation enhancer, mannosidase alpha-like 2 (Edem2) encodes a lectin
    involved in the degradation of proteins during endoplasmic reticulum (ER) stress,
    which is generated by the presence of unfolded proteins in the ER.
