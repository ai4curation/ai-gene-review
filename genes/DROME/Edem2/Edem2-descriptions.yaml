- source: Alliance_Automated
  text: Enables misfolded protein binding activity. Involved in endoplasmic reticulum
    unfolded protein response and ubiquitin-dependent glycoprotein ERAD pathway. Located
    in endoplasmic reticulum. Is expressed in adult head. Human ortholog(s) of this
    gene implicated in congenital disorder of glycosylation type IIv. Orthologous
    to human EDEM3 (ER degradation enhancing alpha-mannosidase like protein 3).
