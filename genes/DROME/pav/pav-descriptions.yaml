descriptions:
- source: Alliance_Imported
  text: pavarotti (pav) encodes a microtubule motor protein from the Kinesin superfamily.
    It plays important roles during the mitotic cycle including spindle formation,
    cortical cytoskeleton reorganization and cytokinesis. It also negatively regulates
    Wnt activity.
  source_type: curated
  url: https://flybase.org/reports/pav.html
  source_id: FB:FBgn0011692
