      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: kinesin required for spindle formation, cortical reorganization
      and cytokinesis, and a negative regulator of Wnt activity. Does not name centralspindlin
      or RacGAP50C.'
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity; microtubule binding activity;
    and microtubule motor activity. Involved in several processes, including cytoskeleton-dependent
    cytokinesis; larval somatic muscle development; and negative regulation of canonical
    Wnt signaling pathway. Located in several cellular components, including male
    germline ring canal; somatic ring canal; and spindle. Part of centralspindlin
    complex. Is expressed in several structures, including embryonic central brain
    glial cell; ganglia; germline cell; head epidermis primordium; and sensory nervous
    system primordium. Human ortholog(s) of this gene implicated in congenital dyserythropoietic
    anemia type IIIa. Orthologous to human KIF23 (kinesin family member 23).
  source_type: automated
  url: https://flybase.org/reports/pav.html
