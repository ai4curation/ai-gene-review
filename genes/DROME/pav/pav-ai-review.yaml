suggested_questions:
- question: Has plus-end-directed motility of Pav-KLP been measured directly in vitro, or is directionality
    inferred only from MKLP1/ZEN-4? This determines whether plus-end-directed microtubule motor activity
    can be annotated.
- question: How does nuclear Pav (with Tum) restrain Wnt target-gene transcription downstream of beta-catenin,
    and is a motor or microtubule-binding activity needed for that role?
- question: Is the kinetochore microtubule annotation from PMID:17046997 supported in the full text, given
    that the abstract describes central spindle microtubule plus ends?
suggested_experiments:
- description: Single-molecule TIRF motility and microtubule-gliding assays with recombinant Pav-KLP (alone
    and with RacGAP50C) to establish direction, velocity and antiparallel bundling activity.
- description: ChIP or proximity labelling of nuclear Pav in Wnt-responsive cells to identify chromatin
    or transcription-factor partners mediating its repression of Wnt targets.
