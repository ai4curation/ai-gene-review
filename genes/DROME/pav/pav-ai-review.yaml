id: Q9VZF5
gene_symbol: pav
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pavarotti (Pav, Pav-KLP) is the Drosophila kinesin-6, the ortholog of mammalian MKLP1/KIF23
  and C. elegans ZEN-4. It has an N-terminal kinesin motor domain and a C-terminal MKLP1 Arf-binding domain,
  and with the RhoGAP RacGAP50C/Tumbleweed forms the heterotetrameric centralspindlin complex. In mitosis
  and meiosis Pav-KLP associates with spindle and astral microtubules, is delivered to microtubule plus
  ends at anaphase, bundles antiparallel microtubules of the central spindle (spindle midzone), and concentrates
  at the equatorial cortex, cleavage furrow and contractile ring, later persisting in the midbody. It
  is essential for central spindle formation, for positioning and assembling the actomyosin contractile
  ring and for maintaining myosin II at the furrow, so pav mutants fail cytokinesis. In germline and somatic
  cells that divide incompletely, Pav-KLP remains as a stable component of ring canals. Its interphase
  pool is nuclear (C-terminal NLS) and restrains Wnt/Wingless target-gene activity downstream of beta-catenin.
  In post-mitotic neurons Pav-KLP brakes kinesin-1-driven microtubule-microtubule sliding, limiting neurite
  outgrowth, a role tuned by Trc phosphorylation of S745 and 14-3-3 binding; in myotubes it contributes
  to microtubule organization needed for muscle guidance.
