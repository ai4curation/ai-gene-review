suggested_questions:
- question: >-
    Is the CG42331-PC transcript (which encodes Q9VC41, without the signal peptide) translated,
    and if so, is the product intracellular? This would test whether the extracellular location
    applies to all products of the gene.
- question: >-
    What substrate does CG42331 oxidise, and does the long disordered C-terminal region
    target it to a particular extracellular structure (for example cuticle, matrix or a
    pigment granule)?
suggested_experiments:
- description: >-
    Express the peroxidase domain recombinantly and measure guaiacol/ABTS peroxidase activity,
    with a His86 (distal His) mutant as a negative control.
  experiment_type: biochemical enzyme assay
- description: >-
    Tag the endogenous gene and compare where the PB/PD and PC isoforms localise in tissues
    where the gene is expressed (for example the esophagus, according to Bgee).
  experiment_type: localization
