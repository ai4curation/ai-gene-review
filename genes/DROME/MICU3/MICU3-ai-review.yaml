gene_symbol: MICU3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MICU3 (CG4662) encodes a neuronally enriched EF-hand protein of the MICU family, related
  to the uniporter gatekeeper MICU1, that associates with the mitochondrial calcium uniporter on the intermembrane-space
  side of the inner mitochondrial membrane. In mammals MICU3 pairs with MICU1 and enhances MCU-mediated
  calcium uptake in neurons. In flies, MICU3 cannot substitute for MICU1, does not suppress the damage
  caused by overexpressed MCU and EMRE, and enhances the MCU co-expression phenotype, consistent with
  a stimulatory rather than gatekeeping role; MICU3 null flies are viable with mild neurological impairment
  and a modestly shortened lifespan.
