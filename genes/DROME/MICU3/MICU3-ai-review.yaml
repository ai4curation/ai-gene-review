suggested_questions:
- question: Does Drosophila MICU3 heterodimerize with MICU1, as mammalian MICU3 does, and does it lower
    the calcium threshold for uniporter opening in neurons?
suggested_experiments:
- description: Measure stimulus-evoked mitochondrial calcium uptake in MICU3 null neurons and test MICU1-MICU3
    co-immunoprecipitation from fly heads.
