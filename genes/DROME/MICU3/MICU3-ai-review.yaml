  review:
    summary: Traceable author statement that MICU3 is a regulatory subunit of the uniporter.
    action: ACCEPT
    reason: MICU3 modifies uniporter activity (co-expression with MCU enhances the MCU phenotype) without
      acting as the main gatekeeper. Calcium channel regulator activity is as precise as the fly data
      allow and is MICU3's core molecular role.
