descriptions:
- source: UniProt
  text: Probable serine/threonine-protein kinase; maternally required for correct
    patterning in the posterior part of each embryonic metamere. May be involved in
    control of cell division during metamorphosis and ovarian development. May interact
    with costal-2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23647
  source_id: P23647
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Dated and hedged: ''probable'' kinase, ''may interact with costal-2'',
      and a vague cell-division role. The review treats Fu as an established Hh-activated
      kinase in the Cos2/Ci complex.'
- source: Alliance_Automated
  text: Enables protein homodimerization activity; protein serine/threonine kinase
    activity; and smoothened binding activity. Involved in several processes, including
    intraciliary transport; negative regulation of signal transduction; and regionalization.
    Located in cytosol. Part of Hedgehog signaling complex. Colocalizes with extrinsic
    component of cytoplasmic side of plasma membrane. Is expressed in cystoblast;
    egg chamber; germarium region 2; imaginal disc; and wing disc anterior compartment.
    Human ortholog(s) of this gene implicated in primary ciliary dyskinesia 46. Orthologous
    to human STK36 (serine/threonine kinase 36).
  source_type: automated
