- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: NAS
  original_reference_id: PMID:9244297
  qualifier: involved_in
  review:
    summary: NAS from a study describing the Fu/Cos2/Ci complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: Fused is a positive transducer of Hh signalling that promotes Ci activator function and inhibits
      formation of the Ci repressor; the cited abstract describes complex formation and access of Ci to
      the nucleus, not repression of transcription by Fu. Any effect on transcription is indirect via
      Ci, and negative regulation of RNA Pol II transcription misrepresents Fu's role.
    supported_by:
    - reference_id: PMID:9244297
      supporting_text: We conclude that the complex may facilitate signaling from HH by governing access
        of the cubitus interruptus protein to the nucleus.
