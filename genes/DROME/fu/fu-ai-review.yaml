id: P23647
gene_symbol: fu
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Fused (fu) is a cytoplasmic serine/threonine protein kinase of Drosophila that transduces
  the Hedgehog (Hh) signal. Fu has an N-terminal kinase domain and a C-terminal regulatory domain through
  which it associates with the kinesin-related protein Costal2 (Cos2), the transcription factor Cubitus
  interruptus (Ci) and Suppressor of fused in the microtubule- and membrane-associated Hedgehog signalling
  complex. Hh-induced conformational change of Smoothened recruits Cos2/Fu and, with Gprk2, promotes Fu
  kinase-domain dimerization and activation-loop phosphorylation; active Fu phosphorylates Cos2 and other
  targets, antagonizes Su(fu), inhibits Ci processing into a repressor and promotes Ci nuclear import
  and activator function, specifying segment polarity and wing pattern. Fu also partners with the E3 ligase
  Smurf to ubiquitinate the BMP receptor Thickveins, sharpening BMP responses during germline stem cell
  differentiation, and it is required for ciliary Smoothened transport in olfactory neurons.
