  review:
    summary: Retain the curated phylogenetic inference of an innate-immune role, at its broad level.
    action: ACCEPT
    reason: 'PAINT placed this process at ancestral node PTN000667087, seeded by experimental annotations
      of Toll-pathway serine proteases and homologues (Persephone, Spirit, MP1, SPE, Grass, ModSP, Sphinx1/2).
      CG43124 descends from that node, so the IBA is a curated node-level judgement rather than a pairwise
      transfer. The node placement is deep: in PANTHER 19.0 those donors fall in several subfamilies of
      PTHR24260 (SF134, SF135, SF136, SF140, SF144), whereas CG43124 is classified in SF147 together with
      the developmental protease Snake and the immune-cell-regulating CG10764. Catalytic loss does not
      argue against the inheritance, because the node''s own seeds include the noncatalytic homologues
      Sphinx1 and Sphinx2 and SPHs are known to act as cascade regulators (e.g. CG4793 in hemocyte encapsulation).
      There is no CG43124-specific evidence of loss or divergence, so the IBA is accepted at its broad process
      level. It is not refined to Toll signalling, melanization or encapsulation, and no catalytic or cascade
      mechanism is inferred.'
    supported_by:
