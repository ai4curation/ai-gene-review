- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IKR
  original_reference_id: PMID:30367934
  qualifier: enables
  negated: true
  review:
    summary: 'Accept the negated peptidase annotation: CG43124 is a noncatalytic serine-protease homolog.'
    action: ACCEPT
    reason: The annotation is explicitly NOT, and its absence-of-key-residues inference is supported by
      an independent profile alignment of the exact 245-residue CG43124-PA sequence. The conserved catalytic
      histidine and aspartate positions align to Ser69 and Asn112 in a significant trypsin-domain segment,
      while the active trypsin control recovers all three catalytic residues. Cao and Jiang classify SP
      versus SPH proteins using this triad criterion. The C-terminal catalytic-serine position cannot
      be mapped reliably, so no third-site replacement is claimed. This is a sequence-based loss-of-catalysis
      assessment, not a direct biochemical inactivity assay.
