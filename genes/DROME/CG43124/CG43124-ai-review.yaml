  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: The positive molecular function of CG43124 is unknown; the ND statement is accurate.
    action: ACCEPT
    reason: The ND root records that no positive molecular function has been established, and this re-review
      confirms that. No CG43124-specific experimental study was found by targeted searches on the gene
      symbol, synonym SPH249, FlyBase id and UniProt accession. The only molecular-function statements
      that can be made are negative (loss of peptidase activity, captured by the two NOT rows, which do
      not count as positive annotations in this aspect). Catalytic-triad substitutions rule out conventional
      peptidase chemistry but do not identify a binding, cofactor or regulatory activity, and no
      subfamily-specific activity can be transferred from catalytic relatives such as Snake. The unknown-function
      statement is therefore correct as it stands.
