suggested_questions:
- question: Which extracellular partners and molecular activity mediate the inferred innate-immune role
    of CG43124?
- question: Does CG43124 serve as a noncatalytic cofactor in a defined protease cascade?
- question: Is CG43124 expressed in immune tissues (fat body, hemocytes) or induced by infection, and does
    its tandem neighbour CG43125 (same PANTHER 19.0 subfamily) share or diverge from its catalytic-site substitutions?
suggested_experiments:
- description: Generate a CG43124 null (CRISPR) and test survival and Toll/Imd target-gene induction after
    Gram-positive bacterial or fungal challenge, and encapsulation of parasitoid wasp eggs.
- description: Express tagged CG43124 in S2 cells or fat body to confirm secretion into the medium/hemolymph,
    and identify hemolymph binding partners by co-immunoprecipitation and mass spectrometry.
