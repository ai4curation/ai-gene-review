taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG43124 (SPH249) encodes a 245-residue secreted serine-protease homolog (S1A non-peptidase
  homolog) of Drosophila melanogaster, the single product of a one-transcript gene at 3R 98C3. After a
  predicted N-terminal signal peptide (residues 1-20) the protein consists of a single trypsin-like (peptidase
  S1) domain with no clip domain. Two of the three catalytic-triad positions are substituted (the histidine
  aligns to Ser69 and the aspartate to Asn112) and no canonical GDSG catalytic-serine motif is present, so
  the protein is predicted to be a noncatalytic pseudoprotease. It belongs to the insect tryptase-related
  serine-protease lineage whose members act in extracellular protease cascades of innate immunity and
  development, and phylogenetic inference places it in an immune-associated clade, but no experiment has
  yet addressed its expression, partners or biological role.
