  label: Drosophila melanogaster
description: CG43124 (SPH249) is a predicted secreted serine-protease homolog of Drosophila melanogaster.
  Its single annotated 245-residue polypeptide contains a trypsin-like region but substitutes serine and
  asparagine for two essential catalytic-triad residues, supporting a noncatalytic pseudoenzyme identity.
  A phylogenetically inferred role in innate immunity is compatible with the nonenzymatic functions of
  insect serine-protease homologs. Its specific molecular partners and effector mechanism remain uncharacterized.
