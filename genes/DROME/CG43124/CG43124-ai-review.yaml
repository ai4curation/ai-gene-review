  review:
    summary: The native noncatalytic molecular function is unresolved.
    action: KEEP_AS_NON_CORE
    reason: The ND root term records unknown molecular function rather than an enzyme activity. Catalytic-triad
      substitutions support absence of conventional peptidase activity, but do not identify a positive
      binding, cofactor or regulatory function. Retain the uncertainty marker without presenting it as
      a mechanistic core function.
