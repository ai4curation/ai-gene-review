    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: The exact target is the single 245-residue CG43124-PA polypeptide. Reproducible PF00089 profile
      alignment maps the essential trypsin catalytic histidine and aspartate to target Ser69 and Asn112
      within a significant homologous segment; active bovine trypsin provides a successful positive control.
      The catalytic-serine region is poorly aligned, so a third substitution is not asserted. These two
      replacements contradict conventional serine endopeptidase chemistry and support a noncatalytic homolog.
      The original prediction has model score 0.98 and phmmer donor Q90WD8, toad ovochymase-2; fold similarity
      to this protease does not restore the missing target catalytic residues. Target GOA contains an
      explicit NOT annotation for the same activity, consistent with this independent analysis. Opposite polarity is not an equivalent existing positive annotation or CNN. Pseudoenzyme
      overannotation is supported; prediction-time sequence identity and the native noncatalytic function
      remain unestablished.
    supported_by:
    - reference_id: file:DROME/CG43124/CG43124-bioinformatics/RESULTS.md
      supporting_text: 'CG43124 lacks two essential residues of the trypsin catalytic triad: the profile-aligned
        histidine is Ser69 and the aspartate is Asn112.'
