      supporting_text: CG43124-PA FBpp0293647 28.4 245 8.18 A0A0B4K7P3 NP_001247345 AFH06662
    - reference_id: PMID:30367934
      supporting_text: 'The SP-related sequences in each species were divided into SPs or SPHs

        based on the presence or absence of the His-Asp-Ser catalytic triad'
