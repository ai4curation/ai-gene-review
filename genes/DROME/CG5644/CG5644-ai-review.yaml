suggested_questions:
- question: Which full-text statement in PMID:32540344 did FlyBase rely on for the CG5644 ecdysteroid
    22-kinase TAS, given that the paper predates the biochemical characterisation of AgEcK2 (2022) and
    did not list CG5644 as a detoxification candidate?
- question: Should the FlyBase TAS be replaced by an ISO annotation with AgEcK2 (F5HIV2) as the with/from,
    given that AgEcK2 itself currently has no GO annotation for its experimentally shown 20E 22-kinase activity?
- question: Is CG5644 responsible for the ecdysone 22-phosphate reported in Drosophila adult ovaries,
    perhaps through its reported expression in border cells?
suggested_experiments:
- description: Express recombinant CG5644 and test ATP-dependent phosphorylation of ecdysone, 20-hydroxyecdysone
    and 3-dehydro/3-epi ecdysteroids by LC-MS/MS, identifying the phosphorylated position. Include a catalytic-loop
    mutant (H289/D291/N296).
  experiment_type: in vitro enzyme assay
- description: Generate a CRISPR null allele of CG5644 and profile ecdysteroids and ecdysteroid phosphates
    in ovaries, adult heads and developmental stages. Test whether the misexpression arrest phenotype needs
    the catalytic loop.
  experiment_type: genetic loss of function with metabolomics
