gene_symbol: CG5644
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG5644 (Dro42-0) encodes a 459-residue protein of the insect ecdysteroid kinase-like (EcKL)
  family. It has a single CHK kinase-like domain of the aminoglycoside-phosphotransferase fold (residues
  161-357), and this domain keeps the HGDxWVNN catalytic loop. Small-molecule kinases of this fold transfer
  phosphate from ATP to hydroxyl groups. CG5644 is in EcKL subfamily D (Diptera clade Dip14), which is
  conserved as single-copy orthologs across flies. It is the 1:1 ortholog of Anopheles gambiae EcK2, an
  enzyme that phosphorylates 20-hydroxyecdysone at C-22 in vitro and that inactivates the hormone in
  virgin female mosquitoes. Both proteins are in PANTHER subfamily PTHR11012:SF47. On this basis CG5644
  is predicted to be an ecdysteroid 22-kinase that converts active ecdysteroids into 22-phosphate conjugates.
  In Drosophila the evidence is genetic and indirect. Ubiquitous or prothoracic gland misexpression causes
  partly penetrant developmental arrest, which fits a role in ecdysteroid inactivation. No enzyme assay,
  loss-of-function allele or ecdysteroid-phosphate measurement has been reported for the fly protein.
  The gene is expressed mainly in the adult nervous system and is reported to be enriched in migratory
  ovarian border cells. Its physiological substrate and its role in the fly are unknown.
existing_annotations:
- term:
    id: GO:0106389
    label: ecdysteroid 22-kinase activity
  evidence_type: TAS
  original_reference_id: PMID:32540344
  qualifier: enables
  review:
    summary: FlyBase TAS for ecdysteroid 22-kinase activity, citing the 2020 Drosophila EcKL family paper.
      Later work agrees with this assignment. CG5644 is the subfamily-D/SF47 1:1 ortholog of the biochemically
      characterised mosquito 20E 22-kinase AgEcK2, and its misexpression in flies gives developmental phenotypes
      that fit ecdysteroid inactivation.
    action: ACCEPT
    reason: The activity is the most likely core function of CG5644, and the evidence supports the annotation
      at the level of orthology rather than direct demonstration. (1) Evolutionary placement. CG5644 and AgEcK2
      (AGAP002181, F5HIV2) are in the same PANTHER subfamily (PTHR11012:SF47) and eggNOG group. They are
      the same length, share 38.8% identity, and both keep the HGDxWVNN catalytic loop. The published EcKL
      phylogeny places both in subfamily D / Dip14 as direct orthologs in a clade conserved across Diptera.
      This is subfamily-level orthology, not a best-hit transfer. (2) The donor activity is experimental.
      Recombinant AgEcK2 phosphorylated 20E to 20E 22-phosphate in vitro. (3) Fly genetics fits the hypothesis.
      Ubiquitous and prothoracic gland misexpression of CG5644 caused developmental arrest, and the authors
      interpret this as consistent with ecdysteroid 22-kinase activity. The cited 2020 paper is abstract-only
      in our cache, and its abstract does not name CG5644, so the curator's exact statement cannot be checked.
      The function is well supported by later evidence, though, so I defer to the curator rather than mark
      it UNDECIDED. Caveats for downstream use. No biochemical assay of the Drosophila protein exists. The
      22-regiospecificity and the ecdysteroid substrate are inferred from the mosquito ortholog. AgEcK2 itself
      did not detectably phosphorylate 3-dehydro-20E, so substrate range within the ecdysteroids may differ.
      None of this transfers to CG6830 or other non-SF47 EcKLs.
    supported_by:
    - reference_id: PMID:38291829
      supporting_text: CG5644 is the direct ortholog of AgEcK2, making it an excellent ecdysteroid 22-kinase
        candidate
    - reference_id: PMID:38291829
      supporting_text: belongs to subfamily D and therefore the Diptera OLC Dip14
    - reference_id: PMID:35794471
      supporting_text: we validated its ecdysteroid kinase activity by incubating it with 20E, which resulted
        in phosphorylated 20E22P
    - reference_id: PMID:39208453
      supporting_text: These data are consistent with the hypothesis that CG5644 encodes an ecdysteroid
        22-kinase
    - reference_id: file:DROME/CG5644/CG5644-bioinformatics/RESULTS.md
      supporting_text: CG5644 and AgEcK2 are in the same PANTHER subfamily (PTHR11012:SF47)
