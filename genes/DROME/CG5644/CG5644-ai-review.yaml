core_functions:
- description: Predicted ATP-dependent ecdysteroid 22-kinase that phosphorylates the C-22 hydroxyl of
    active ecdysteroids such as 20-hydroxyecdysone, producing inactive 22-phosphate conjugates. The activity
    is inferred from 1:1 subfamily-D (PANTHER SF47) orthology to the biochemically characterised mosquito
    AgEcK2 and is supported in Drosophila only by misexpression phenotypes. It is not directly demonstrated.
  molecular_function:
    id: GO:0106389
    label: ecdysteroid 22-kinase activity
  supported_by:
