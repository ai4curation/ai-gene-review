  label: Drosophila melanogaster
description: Elba3 (CG15634) is a small nuclear adaptor protein without recognizable domains that is expressed
  transiently around the Drosophila blastoderm stage. It bridges the N-terminal domains of the BEN-domain
  proteins Elba1 and Elba2 to assemble the heterotrimeric Elba complex, which binds the asymmetric CCAATAAG
  Elba site in the Fab-7 boundary of the bithorax complex and confers early, developmentally restricted
  enhancer-blocking activity. Elba3 itself lacks DNA-binding activity.
