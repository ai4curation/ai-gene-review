    summary: Member of the heterotrimeric Elba boundary complex (Elba1, Elba2, Elba3).
    action: KEEP_AS_NON_CORE
    reason: Complex membership is directly supported (co-purification and reconstitution), but the GO
      term "chromatin silencing complex" (a complex that mediates transcriptional silencing) does not
