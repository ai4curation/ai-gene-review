description: Sns has established gene-level developmental roles, but the selected isoform B contains an
  extra 63-residue insertion with a predicted membrane-spanning segment. Gene-level Sns-dependent muscle
  and tissue morphogenesis is strongly supported. Membrane association is supported by the retained hydrophobic
  regions and direct Sns cell-surface localization.
