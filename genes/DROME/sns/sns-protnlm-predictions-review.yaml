id: Q0E9F2
gene_symbol: sns
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
status: COMPLETE
description: Q0E9F2 is the representative GOA product of the Drosophila sns gene, a nephrin-subfamily
  transmembrane immunoglobulin-superfamily adhesion receptor required for myoblast fusion, garland nephrocyte
  adhesion and fusion, nephrocyte diaphragm formation and ommatidial patterning. All three ProtNLM2 terms
  (cell differentiation, anatomical structure morphogenesis, membrane) are true of the gene but are ancestors
  of more specific terms it already carries with experimental support (garland nephrocyte differentiation
  and myoblast fusion; compound eye and chaeta morphogenesis; plasma membrane and nephrocyte diaphragm),
  and each exact term is already in GOA for this accession. They are therefore scored as less precise
  than existing annotation. The 63-residue insertion specific to this isoform (with a predicted extra
  hydrophobic segment) is an open topology question but does not refute these broad gene-level terms.
