      supporting_text: The Drosophila sticks-and-stones (sns) locus was identified on the basis of its
        mutant phenotype, the complete absence of body wall muscles and corresponding presence of unfused
        myoblasts.
    - &id002
      reference_id: file:DROME/sns/sns-bioinformatics/RESULTS.md
      supporting_text: The sole difference is a 63-residue insertion at the reference 1059/1060 junction,
        corresponding to target 1060–1122.
    - &id003
      reference_id: file:DROME/sns/sns-bioinformatics/RESULTS.md
      supporting_text: The selected record predicts transmembrane segments 1089–1112 (within the insertion)
        and 1141–1166 (in the shared sequence).
