  review:
    assessment: UNC
    confidence_score: 1
    summary: Sns has established gene-level developmental roles, but the selected isoform B contains an
      extra 63-residue insertion with a predicted membrane-spanning segment. All shared residues are conserved,
      yet an additional membrane crossing could change presentation of the signaling tail required in
      fusion and differentiation. The accessible experiments do not resolve this topology or establish
      function of this exact longer form. Thus the prediction remains uncertain for the selected sequence,
      without disputing Sns gene-level differentiation biology.
    supported_by:
