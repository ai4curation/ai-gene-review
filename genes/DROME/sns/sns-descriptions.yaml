descriptions:
- source: Alliance_Imported
  text: sticks and stones (sns) encodes a single-pass transmembrane protein of the
    immunoglobulin superfamily, which mediates cell-cell recognition and adhesion.
    The product of sns marks the fusion competent population of myoblasts. It also
    contributes to formation and function of the nephrocyte diaphragm and cell sorting
    within the developing ommatidia.
  source_type: curated
