- source: Alliance_Automated
  text: Enables cell adhesion mediator activity. Involved in several processes, including
    garland nephrocyte differentiation; heterophilic cell-cell adhesion; and sensory
    organ development. Located in nephrocyte diaphragm and plasma membrane. Part of
    protein complex involved in cell adhesion. Is active in apical plasma membrane.
    Is expressed in several structures, including adult head; muscle cell; myoblast;
    nephrocyte; and sensory organ cell. Used to study kidney disease; nephrotic syndrome;
    and nephrotic syndrome type 1. Human ortholog(s) of this gene implicated in nephrotic
    syndrome type 1. Orthologous to human NPHS1 (NPHS1 adhesion molecule, nephrin).
  source_type: automated
