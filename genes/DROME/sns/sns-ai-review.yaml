  review:
    action: KEEP_AS_NON_CORE
    summary: Sns-mediated founder-cell adhesion is required for the dynamic F-actin focus that forms in fusion-competent
      myoblasts at the fusion site; in reconstituted S2R+ cell fusion, Sns-associated F-actin foci depend
      on WASP, WIP and SCAR.
    reason: The cached abstract of the cited study states that several known fusion components regulate
      the actin foci, without naming Sns, and its full text could not be retrieved. Independent reconstitution
      work summarized in the deep-research report links Sns to adaptor-mediated WASP/SCAR-Arp2/3 actin
      polymerization at the fusion interface, so Sns plausibly contributes to organizing this actin structure
      through its cytoplasmic tail. Deferring to the FlyBase IMP curator, the row is kept, but as non-core,
      because the actin polymerization itself is carried out by the WASP and SCAR/Arp2/3 machinery and
      Sns acts as the adhesion receptor that positions it.
    supported_by:
