id: Q0E9F2
gene_symbol: sns
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sticks and stones (Sns) is a transmembrane immunoglobulin-superfamily adhesion
  receptor of the nephrin subfamily (PANTHER PTHR11640:SF136, shared with its paralog Hibris, vertebrate
  nephrin/NPHS1 and C. elegans SYG-2). Its extracellular region of Ig and fibronectin type III domains
  binds the Kirre/Neph1-family proteins Dumbfounded/Kirre and Roughest in trans, forming heterophilic
  adhesion complexes. On fusion-competent myoblasts Sns recognizes founder cells and is required for myoblast
  fusion and body-wall and visceral muscle formation, with its tyrosine-phosphorylated cytoplasmic tail
  linking adhesion to the fusion machinery. In nephrocytes Sns and Kirre localize to and are required to
  assemble the nephrin-like filtration diaphragm that controls protein uptake. The same adhesion system
  contributes to ommatidial separation in the eye, spacing of wing-margin sensory bristles, and somatic
  cyst-cell support of spermatid maturation.
