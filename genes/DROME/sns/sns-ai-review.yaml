suggested_questions:
- question: Does the 63-residue insertion unique to isoform B (Q0E9F2 residues 1060-1122), which carries
    a second predicted transmembrane segment, actually span the membrane, and if so does it invert or
    sequester the cytoplasmic tail that recruits fusion machinery?
- question: Is the garland-nephrocyte adhesion requirement (curated as homophilic cell-cell adhesion) mediated
    by Sns-Sns trans binding, or by heterophilic Sns-Kirre binding between co-expressing cells?
- question: Does the Sns cytoplasmic domain directly organize the F-actin focus in fusion-competent myoblasts,
    or is actin focus formation only a downstream consequence of Sns-mediated founder-cell adhesion?
suggested_experiments:
- hypothesis: The isoform-B-specific hydrophobic insertion is a functional transmembrane segment.
  description: Express tagged isoforms A and B in S2 cells or FCMs and map tail orientation by selective
    permeabilization or protease protection; test each isoform for rescue of sns myoblast fusion and nephrocyte
    diaphragm defects.
- hypothesis: Sns does not bind itself in trans.
  description: Cell-aggregation and surface-plasmon-resonance assays with Sns ectodomain alone versus Sns
    plus Kirre, alongside GCN adhesion assays in kirre-null backgrounds expressing Sns.
