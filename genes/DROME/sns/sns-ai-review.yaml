id: Q0E9F2
gene_symbol: sns
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sticks and stones (Sns) is a nephrin-related immunoglobulin-superfamily adhesion protein.
  It recognizes Kirre/Roughest on apposed cells, enabling myoblast fusion and organizing nephrocyte filtration
  diaphragms. Its extracellular Ig and fibronectin-type domains and intracellular signaling region couple
  cell recognition to tissue morphogenesis. Sns also contributes to eye organization, sensory-organ spacing
  and reproductive support-cell functions.
