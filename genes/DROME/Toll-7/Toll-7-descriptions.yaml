descriptions:
- source: UniProt
  text: Toll-related receptor which binds to the neurotrophins NT1 and spz5 (PubMed:10973475,
    PubMed:23892553). Essential for antiviral autophagy, it detects and binds to the
    vesicular stomatitis virus (vsv) following infection (PubMed:22464169). This role
    is likely to be independent of the canonical Toll, immune deficiency, and JAK-STAT
    signaling pathways (PubMed:22464169). Functions in olfactory circuit assembly
    by promoting synaptic partner matching between olfactory receptor neurons (ORN)
    axons and projection neurons (PN) dendrites partners in the antennal lobe (PubMed:25741726).
    Function in the Va1d ORNs is necessary and sufficient for correct targeting to
    their partner PN dendrites (PubMed:25741726). Also involved in the targeting of
    other classes of ORN axons (PubMed:25741726). Functions with Toll-6 to regulate
    motor axon targeting and neuronal survival in the central nervous system (CNS)
    (PubMed:23892553). May be an upstream component of the NF-kappa-B (rel) regulatory
    cascade (PubMed:23892553).
  source_type: curated
