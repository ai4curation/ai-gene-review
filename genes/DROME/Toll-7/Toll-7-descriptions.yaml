- source: Alliance_Automated
  text: Enables neurotrophin receptor activity; transmembrane signaling receptor activity;
    and virion binding activity. Involved in several processes, including Toll signaling
    pathway; regulation of defense response; and response to virus. Located in external
    side of plasma membrane. Is expressed in several structures, including adult head;
    adult olfactory antennal lobe glomerulus; cuboidal/columnar epithelium; ganglia;
    and head epidermis primordium.
