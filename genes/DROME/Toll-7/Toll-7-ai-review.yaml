  label: Drosophila melanogaster
description: 'Toll-7 is a Toll-family type I transmembrane receptor with an extracellular leucine-rich-repeat
  ectodomain and a cytoplasmic TIR domain, expressed at the plasma membrane and prominently in the central
  nervous system. It is a receptor for the Spätzle-family neurotrophins DNT1 (Spz2) and DNT2 (Spz5), and
  its ectodomain also binds Spätzle-1. In the nervous system Toll-7, together with its paralog Toll-6,
  regulates motor axon targeting, neuronal survival and locomotion, and cell-autonomously instructs olfactory
  receptor neuron axon targeting and synaptic partner matching. Toll-7 also contributes to antiviral defence:
  it associates with vesicular stomatitis virus and Rift Valley fever virus particles at the cell surface
  and is required for virus-induced autophagy that restricts these viruses, through a MyD88- and NF-kappaB-independent
  mechanism. Whether it also drives canonical Toll pathway antimicrobial peptide induction is disputed.'
