- term:
    id: GO:0038187
    label: pattern recognition receptor activity
  evidence_type: IC
  original_reference_id: PMID:22464169
  qualifier: enables
  supporting_entities:
  - GO:0009897
  - GO:0010508
  - GO:0046790
  review:
    summary: Curator inference of pattern recognition receptor activity from virion binding at the cell
      surface and Toll-7-dependent antiviral autophagy.
    action: KEEP_AS_NON_CORE
    reason: 'This is the only PRR-branch MF on a Drosophila Toll and the only one with direct pathogen-binding
      data behind it: Toll-7 co-precipitates VSV and RVFV virions at the cell surface, and the authors
      conclude it is a PRR. The inference falls short of the standard for vertebrate TLRs in three ways:
      (1) binding is shown only by co-precipitation of whole virions, with no defined viral ligand molecule,
      affinity or structure; (2) the specificity control (Toll does not bind VSV) is contradicted by Chowdhury
      et al. 2019, who found Toll-1 ectodomain also binds VSV; (3) an independent study reported that
      Toll-7 is not required for hemocyte VSV defence. Toll-7 is otherwise a neurotrophin receptor for
      Spätzle-family ligands. Kept as non-core pending ligand identification, not accepted as core.'
    supported_by:
    - reference_id: PMID:22464169
      supporting_text: Here we have shown that Toll-7 is a PRR both in vitro and in adult flies; loss
        of Toll-7 led to increased vesicular stomatitis virus (VSV) replication and mortality.
    - reference_id: PMID:22464169
      supporting_text: We found that VSV interacted with endogenous Toll-7 at the plasma membrane, and
        that this interaction was lost upon RNAi depletion of Toll-7
    - reference_id: PMID:22464169
      supporting_text: Our findings that Toll-7 interacts with VSV virions suggest that Toll-7 might act
        directly as a pattern recognition receptor more similar to mammalian TLRs, a previously unknown
        mechanism for an insect Toll receptor.
    - reference_id: PMID:31088910
      supporting_text: our results corroborate that Toll-7 binds VSV while showing that Toll-1 also binds
        this virus
    - reference_id: PMID:31088910
      supporting_text: other results indicate that autophagy plays a minor role in hemocyte-mediated defense
        against VSV and does not depend on Toll-7
