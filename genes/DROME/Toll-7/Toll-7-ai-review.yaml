suggested_questions:
- question: Is whole-virion co-precipitation sufficient to annotate GO:0038187 pattern recognition receptor
    activity, whose definition requires binding a pathogen-associated molecular pattern? Which VSV/RVFV
    component (e.g. envelope glycoprotein) binds Toll-7, and is the interaction direct?
- question: Given conflicting reports on Toll-1 binding VSV and on Toll-7 requirement in hemocyte antiviral
    defence, should the Toll-7 PRR and cell-surface PRR signalling annotations be retained, downgraded,
    or replaced by virion binding plus defense response to virus alone?
- question: Does Toll-7 activate the canonical MyD88/Tube/Pelle/Dif pathway in vivo, or is its reported
