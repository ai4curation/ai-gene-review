gene_symbol: wuho
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'wuho (wh, CG15897) encodes a WD40-repeat protein, the Drosophila ortholog of WDR4/Trm82.
  It is the non-catalytic subunit of the Mettl1-Wuho tRNA (m7G46) methyltransferase: it binds the catalytic
  subunit Mettl1 and is required for Mettl1 to methylate guanosine 46 of a subset of tRNAs. Wuho is expressed
  in male and female germline and somatic gonadal cells, with nuclear and cytoplasmic pools. Loss of wuho
  causes male sterility, with spermatogenesis arrested at spermatid elongation, and female semi-sterility.
  In the ovary Wuho also acts with the TRIM-NHL protein Mei-P26 to maintain germline stem cells, complete
  their abscission and limit mitotic divisions of their progeny, a role that may be separate from the
  tRNA methyltransferase.'
