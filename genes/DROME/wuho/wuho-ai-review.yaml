suggested_questions:
- question: Are the Mei-P26-dependent ovarian functions of Wuho independent of Mettl1 and tRNA m7G, or
    do they reflect reduced translation of specific germline mRNAs?
suggested_experiments:
- hypothesis: The ovarian germline defects of wuho mutants are separable from loss of tRNA m7G46.
  description: Compare ovarian phenotypes of wuho, Mettl1-KO and catalytic-dead Mettl1 rescue flies, and
    test Wuho point mutants that disrupt Mettl1 binding but not Mei-P26 binding.
