- source: Alliance_Automated
  text: Involved in oogenesis and spermatogenesis. Located in cytoplasm; female germ
    cell nucleus; and male germ cell nucleus. Part of tRNA (m7G46) methyltransferase
    complex. Human ortholog(s) of this gene implicated in Galloway-Mowat syndrome
    6 and microcephaly, growth deficiency, seizures, and brain malformations. Orthologous
    to human WDR4 (WDR4 tRNA N7-guanosine methyltransferase non-catalytic subunit).
