descriptions:
- source: UniProt
  text: Required for the Mettl1-dependent formation of N(7)- methylguanine at position
    46 (m7G46) in tRNA (By similarity) (PubMed:39317727). In the Mettl1-wuho methyltransferase
    complex, it is required to stabilize and induce conformational changes of the
    catalytic subunit (By similarity). Required for binding of nanos mRNA and repression
    of translation by the mei-P26-bgcn-bam-sxl complex (PubMed:31941704). May cooperate
    with mei-P26 and nanos to derepress the BMP signaling pathway (PubMed:31941704).
    May cooperate with mei-P26 to suppress expression of a subset of microRNAs (PubMed:31941704).
    May cooperate with mei-P26 to regulate bam expression levels in germline cells
    during gametogenesis (PubMed:31941704). Required to promote mitosis to meiosis
    transition during gametogenesis (PubMed:31941704). May regulate germline cell
    division in part by regulating ribosome biogenesis (PubMed:31941704).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W415
