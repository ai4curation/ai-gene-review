descriptions:
- source: Alliance_Imported
  text: Enoyl-CoA hydratase, short chain 1 (Echs1) encodes a mitochondrial enzyme
    that catalyzes the second of the four reactions of fatty acid beta-oxidation,
    which consists in the hydration of (2E)-enoyl-CoA to generate (3S)-3-hydroxyacyl-CoA.
  source_type: curated
  url: https://flybase.org/reports/Echs1.html
  source_id: FB:FBgn0033879
