      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 5
    overall_notes: 'Correct: mitochondrial enzyme hydrating 2E-enoyl-CoA to 3S-hydroxyacyl-CoA
      in step two of beta-oxidation. Omits the valine catabolism role.'
- source: Alliance_Automated
  text: Predicted to enable 3-hydroxypropionyl-CoA dehydratase activity. Involved
    in L-valine catabolic process. Located in mitochondrion. Is expressed in several
    structures, including adult head; adult heart; dorsal pharyngeal muscle cell;
    germline cell; and gut section. Used to study amino acid metabolic disorder and
    mitochondrial short-chain enoyl-CoA hydratase 1 deficiency. Human ortholog(s)
    of this gene implicated in mitochondrial short-chain enoyl-CoA hydratase 1 deficiency.
    Orthologous to human ECHS1 (enoyl-CoA hydratase, short chain 1).
  source_type: automated
  url: https://flybase.org/reports/Echs1.html
