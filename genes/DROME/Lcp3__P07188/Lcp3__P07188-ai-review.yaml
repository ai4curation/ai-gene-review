id: P07188
gene_symbol: Lcp3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Lcp3 (Larval cuticle protein 3, LCP-III, CG2043) is a small secreted structural protein
  of the Drosophila melanogaster larval chitin-based cuticle. It is one of the major low-molecular-weight,
  urea-extractable proteins of the third-instar larval cuticle and is encoded in the 44D larval cuticle
  protein gene cluster together with the related Lcp1, Lcp2 and Lcp4 genes, which are abundantly expressed
  in the epidermis of third-instar larvae. The 112-residue precursor has an N-terminal signal peptide
  (residues 1-16) and a Rebers-Riddiford (R&R, chitin-binding type-4) consensus domain, placing it in
  the CPR cuticular protein family (PANTHER PTHR10380, subfamily SF237, together with the other Drosophila
  larval cuticle proteins, the pupal cuticle protein Pcp and lobster exoskeletal cuticle proteins). The
  mature protein was partially sequenced from larval cuticle, and it is deposited by the larval epidermis
  into the extracellular chitin-protein matrix, where it acts as a structural constituent of the larval
  cuticle. Direct chitin binding, its layer within the procuticle and an organismal loss-of-function phenotype
  have not been established for Lcp3 itself.
