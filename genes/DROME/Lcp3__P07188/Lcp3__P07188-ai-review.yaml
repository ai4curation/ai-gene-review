references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:101231
  title: 'The procuticle of Drosophila: heterogeneity of urea-soluble proteins.'
  full_text_unavailable: true
  findings:
  - statement: Urea-soluble proteins extracted from untanned larval cuticle resolve into five major and
      three minor components, at least three of which are specified by separate structural genes.
    supporting_text: Preliminary genetic analysis indicates that at least three of the five proteins are
      specified by separate structural genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; title and PMID verified against fetched PubMed record. The abstract
      predates gene cloning and does not name LCP-III; attribution to Lcp3 rests on the FlyBase curator's
      full-text reading together with the later sequence match (PMID:6817923).
- id: PMID:17628275
  title: 'Drosophila cuticular proteins with the R&R Consensus: annotation and classification with a new
    tool for discriminating RR-1 and RR-2 sequences.'
  full_text_unavailable: true
  findings:
  - statement: Genome-wide annotation of 101 Drosophila R&R-consensus cuticular proteins, retaining original
      names (such as the Lcp genes) for previously verified cuticle proteins.
    supporting_text: The original names have been retained, and the 72 newly annotated proteins have been
      given names beginning with Cpr followed by the chromosomal band in which the gene is located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; source of the FlyBase ISM rows. Family-level classification; the
      abstract does not say whether Lcp3 is RR-1 or RR-2.
- id: PMID:6168386
  title: 'The cuticle genes of drosophila: a developmentally regulated gene cluster.'
  full_text_unavailable: true
  findings:
  - statement: The 44D cluster genes are abundantly expressed in late third-instar larval epidermis and
      encode larval cuticle proteins of common ancestry.
    supporting_text: Thus the cuticle genes encoded by the segment at 44D are members of a family of genes
      of common ancestry, which share the same pattern of developmental expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; primary cloning of the Lcp cluster. Does not resolve Lcp3-specific
      timing within the third instar.
- id: PMID:6817923
  title: 'Cuticle protein genes of Drosophila: structure, organization and evolution of four clustered
    genes.'
  full_text_unavailable: true
  findings:
  - statement: Protein sequences of four of the five major third-instar cuticle proteins match four of
      the cloned 44D genes, each encoding a signal peptide.
    supporting_text: These four sequences are identical with those predicted from the sequences of four
      of the five genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; cited by the reviewed UniProt entry as the source of the Lcp3 nucleotide
      and partial protein sequence. Not a GOA reference, added as primary support.
- id: PMID:6441593
  title: Pupal and larval cuticle proteins of Drosophila melanogaster.
  full_text_unavailable: true
  findings:
  - statement: Major larval cuticle proteins are low-molecular-weight non-glycosylated proteins distinct
      in primary structure from pupal cuticle proteins.
    supporting_text: The five major larval proteins have low molecular weights (less than 20000) and are
      not glycosylated.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; class-level biochemical evidence, not Lcp3-specific in the abstract.
