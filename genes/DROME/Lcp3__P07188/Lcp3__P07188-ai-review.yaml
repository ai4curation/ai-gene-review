    - reference_id: PMID:6817923
      supporting_text: Amino acid sequences of four of the five major third instar cuticle proteins have
        been determined.
- term:
    id: GO:0008363
    label: larval chitin-based cuticle development
  evidence_type: IC
  original_reference_id: PMID:6168386
  qualifier: involved_in
  supporting_entities:
  - GO:0008010
  review:
    summary: Lcp3 contributes structural material to the larval cuticle synthesised and deposited by the
      epidermis; acceptable as the process context of its structural function.
    action: KEEP_AS_NON_CORE
    reason: GO:0008363 is defined as synthesis and deposition of the chitin-based larval cuticle. A structural
      constituent that is secreted by the epidermis and incorporated into that cuticle contributes the
      structure on which the process outcome depends (the scaffold-like case in the participation test),
      so the curator's IC inference from GO:0008010 is defensible. It is non-core because the gene's informative
      contribution is the structural molecular function; there is no Lcp3-specific loss-of-function phenotype
      (a Beagle transposon insertion in the Lcp3 TATA box abolishes protein, but no organismal defect was
      reported), so no claim beyond being a deposited component is made.
    supported_by:
    - reference_id: PMID:6168386
      supporting_text: Three of the four abundantly expressed genes have been shown to code for larval
        cuticle proteins
    - reference_id: file:DROME/Lcp3/Lcp3-deep-research-falcon.md
      supporting_text: It does **not** establish the organismal consequence of losing LCP3, because the
        insertion may influence neighboring genes and no clean null/rescue phenotype was reported.
- term:
