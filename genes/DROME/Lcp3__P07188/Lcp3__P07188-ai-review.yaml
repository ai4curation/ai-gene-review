- term:
    id: GO:0008010
    label: structural constituent of chitin-based larval cuticle
  evidence_type: IDA
  original_reference_id: PMID:101231
  qualifier: enables
  review:
    summary: Core function. Lcp3 is one of the major urea-soluble proteins extracted from Drosophila larval
      cuticle.
    action: ACCEPT
    reason: Fristrom et al. 1978 resolved the urea-soluble proteins of untanned larval cuticle into five
      major and three minor components and showed that several are encoded by separate structural genes.
      The cached abstract does not name LCP-III, but the later protein sequencing of the major third-instar
      cuticle proteins (Snyder et al. 1982, PMID:6817923; partial protein sequence of Lcp3 per the reviewed
      UniProt entry) ties Lcp3 to this protein set. The curator read the full text; the claim is biologically
      coherent (secreted R&R protein that is a bulk component of larval cuticle), so it is accepted.
    supported_by:
    - reference_id: PMID:101231
      supporting_text: Proteins, soluble in 7 M urea, 4 M guanidine hydrochloride, or 2% sodium dodecyl
        sulfate, have been extracted from untanned larval cuticles of Drosophila melanogaster.
    - reference_id: PMID:6817923
      supporting_text: Amino acid sequences of four of the five major third instar cuticle proteins have
        been determined.
- term:
    id: GO:0008010
    label: structural constituent of chitin-based larval cuticle
  evidence_type: IDA
  original_reference_id: PMID:6168386
  qualifier: enables
  review:
    summary: Core function. The 44D cluster genes, including Lcp3, encode larval cuticle proteins expressed
      in late third-instar epidermis.
    action: ACCEPT
    reason: Snyder et al. 1981 cloned the 44D cluster and showed that three of the four abundantly expressed
      genes code for larval cuticle proteins (and the fourth probably does). Together with the protein-sequence
      match in PMID:6817923, this establishes Lcp3 as a protein of the larval cuticle. Experimental evidence
      in D. melanogaster for this specific gene product.
    supported_by:
    - reference_id: PMID:6168386
      supporting_text: Three of the four abundantly expressed genes have been shown to code for larval
        cuticle proteins
    - reference_id: PMID:6168386
      supporting_text: Four of the genes are clustered within 7.9 kb of DNA and are abundantly expressed
        as poly(A)RNA in the epidermis of late third instar larvae
- term:
    id: GO:0008010
    label: structural constituent of chitin-based larval cuticle
  evidence_type: ISM
  original_reference_id: PMID:17628275
  qualifier: enables
  review:
    summary: Consistent with the experimental rows; Lcp3 is one of the previously characterised R&R cuticle
      proteins in the genome-wide Drosophila CPR annotation.
    action: ACCEPT
    reason: Karouzou et al. 2007 annotated the Drosophila R&R-consensus proteins with a profile HMM; Lcp3
      is among the 29 previously named proteins whose authenticity as cuticular proteins had been verified
      by protein sequence data from isolated cuticle. The sequence model alone would support only the
      general cuticle term, but for this gene the larval specificity is independently established experimentally,
      so the row is accepted, consistent with the IDA rows for the same term.
    supported_by:
    - reference_id: PMID:17628275
      supporting_text: for several their authenticity as cuticular proteins had been verified by protein
