  review:
    summary: Broad process context for an R&R cuticle protein; true for Lcp3 as a deposited cuticle component.
    action: KEEP_AS_NON_CORE
    reason: The R&R-consensus classification supports Lcp3 being a cuticular protein deposited during chitin-based
      cuticle formation. In the current GO release GO:0008363 (larval chitin-based cuticle development)
