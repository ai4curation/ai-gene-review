suggested_questions:
- question: Does Lcp3 bind chitin directly through its R&R domain, as shown for some other CPR proteins?
    Chitin binding (GO:0008061) is currently only a family-level inference for this protein and should
    not be transferred from it as experimental evidence.
- question: Is the larval restriction of Lcp3, as opposed to the pupal Pcp in the same PANTHER subfamily
    SF237, a property of the protein or only of its transcriptional program?
suggested_experiments:
- description: Express the recombinant Lcp3 R&R region (e.g. as a GST fusion) and measure binding to purified
    chitin, with conserved R&R aromatic residues mutated as controls.
  hypothesis: Lcp3 binds polymeric chitin through its Rebers-Riddiford domain like other CPR-family proteins.
- description: Generate a clean CRISPR Lcp3 null leaving Lcp1, Lcp2 and Lcp4 intact and assess larval
    cuticle ultrastructure, permeability and mechanics.
  hypothesis: Loss of Lcp3 alone alters larval procuticle composition with little organismal effect owing
    to redundancy within the 44D cluster.
