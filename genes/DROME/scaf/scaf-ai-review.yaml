id: Q7K5M0
gene_symbol: scaf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  scaf encodes Scarface, a secreted Drosophila S1-family serine protease
  homolog whose catalytic triad is disrupted. Scarface is induced by JNK
  signaling and acts extracellularly during epithelial remodeling, supporting
  germ-band retraction, dorsal closure, male genitalia rotation, notum
  morphogenesis, thorax closure, epithelial polarity and radiation-induced
  hinge-to-pouch plasticity through mechanisms that include negative regulation
  of JNK output and control of polarized Laminin A localization.
