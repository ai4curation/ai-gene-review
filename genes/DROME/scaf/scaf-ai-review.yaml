core_functions:
- description: >-
    Secreted Scaf acts as a catalytically inactive S1-family serine-protease
    homolog at the extracellular epithelial interface, where it supports
    polarized Laminin A localization and epithelial-sheet morphogenesis during
    germ-band retraction, dorsal closure, male genitalia rotation and thorax
    closure while feeding back on JNK signaling.
  directly_involved_in:
    - id: GO:0007391
      label: dorsal closure
  locations:
    - id: GO:0005576
      label: extracellular region
  supported_by:
    - reference_id: PMID:20379222
      supporting_text: >-
        We propose that Scarface has a key role in regulating the polarized
        localization of laminin A in this developmental context.
    - reference_id: PMID:20530545
      supporting_text: >-
        Overall, our results identify the SPH-encoding gene scaf as a new
        transcriptional target of JNK signalling and reveal the first secreted
        regulator of the JNK pathway acting in a negative-feedback loop during
        epithelial morphogenesis.
    - reference_id: PMID:25737837
      supporting_text: >-
        Consequently, down-regulation of scarface results in a thoracic-cleft
        phenotype that phenocopies the JNK pathway defect.
- description: >-
    In irradiated larval wing discs, JNK-dependent induction of Mmp1 and Scaf in
    hinge cells promotes epithelial-to-epithelial hinge-to-pouch fate change and
    translocation during regeneration after radiation damage.
  locations:
    - id: GO:0005576
      label: extracellular region
  supported_by:
    - reference_id: PMID:42531335
      supporting_text: >-
        Functional validation using RNA interference revealed that secreted
        Matrix Metalloprotease 1 (Mmp1) and the related secreted protease
        homolog Scarface (Scaf) are required in hinge cells for IR-induced cell
        fate conversion and translocation.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which extracellular protein, receptor, or protease cascade is the direct
    target of catalytically inactive Scaf during Laminin A polarization and JNK
    feedback?
- question: >-
    Does radiation-induced Scaf use the same extracellular mechanism as
    embryonic dorsal closure and thorax closure, or a regeneration-specific
    branch downstream of JNK?
