- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: >-
      Removed: the InterPro trypsin-domain mapping asserts proteolysis for
      catalytically inactive Scaf despite accepted NOT peptidase annotations.
    action: REMOVE
    reason: >-
      The IPR001254 mapping infers proteolysis from the retained
      trypsin/peptidase-S1 fold, but Scaf's GOA set also carries multiple
      accepted NOT peptidase annotations because Scaf lacks the catalytic
      residue set needed for peptide-bond hydrolysis. A noncatalytic SPH could
      regulate an extracellular protease cascade, but the cached Scaf
      literature has not shown Scaf hydrolyzing peptide bonds or participating
      directly in proteolysis. This positive IEA should therefore be removed
      rather than retained as a broad process annotation.
    additional_reference_ids:
      - PMID:30367934
      - file:interpro/panther/PTHR24250/PTHR24250-review.yaml
    supported_by:
      - reference_id: file:interpro/panther/PTHR24250/PTHR24250-review.yaml
        supporting_text: >-
          Its official SF27 elastase-like label is a classification label, not
          evidence that Scarface cleaves elastin or other proteins.
