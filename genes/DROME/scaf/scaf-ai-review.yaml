      genetic interaction and should be kept. The 2010 JNK-feedback study
      directly connects secreted Scaf to the epithelial fusion process that
      rotates the pupal genital disc.
    supported_by:
      - reference_id: PMID:20530545
        supporting_text: >-
          Live imaging of the latter process reveals that, like for dorsal
          closure, JNK directs the dorsal fusion of two epithelial layers in the
          pupal genital disc.
