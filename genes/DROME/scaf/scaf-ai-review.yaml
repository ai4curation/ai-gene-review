- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IKR
  original_reference_id: PMID:12568721
  qualifier: enables
  negated: true
  review:
    summary: >-
      Accepted as a negated catalytic annotation: Scaf is an S1-family
      serine-protease homolog rather than an active serine endopeptidase.
    action: ACCEPT
    reason: >-
      The original Ross et al. family analysis classified Drosophila serine
      proteases and homologs, and the cached abstract is not Scaf-specific.
      However, later full-text family curation explicitly separates active SPs
      from inactive SPHs by conservation of the His-Asp-Ser catalytic triad, and
      the PTHR24250 family review records Q7K5M0 as an inactive serine protease
      homolog with loss of the canonical triad. The NOT annotation should
      therefore be kept.
    additional_reference_ids:
      - PMID:30367934
      - file:interpro/panther/PTHR24250/PTHR24250-review.yaml
    supported_by:
      - reference_id: PMID:30367934
        supporting_text: >-
          based on the presence or absence of the His-Asp-Ser catalytic triad as
          described
      - reference_id: file:interpro/panther/PTHR24250/PTHR24250-review.yaml
        supporting_text: >-
          Drosophila Scarface is a secreted regulator of epithelial
          morphogenesis and laminin organization that lacks the canonical
          protease catalytic triad.
