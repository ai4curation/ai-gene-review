descriptions:
- source: UniProt
  text: Inactive serine protease that plays a role in germ-band retraction and dorsal
    closure morphogenesis in embryogenesis; contributes to amnioserosa attachment
    and epithelial apico-basal polarity by regulating the localization of laminin
    LanA on the apical side of the amnioserosa epithelium (PubMed:20379222, PubMed:28628612).
    Contributes to epithelial morphogenesis probably by regulating the bsk/JNK pathway,
    as part of a negative-feedback loop, and by modulating the cross-talk between
    the Egfr, bsk/JNK and dpp signal transduction pathways (PubMed:20379222, PubMed:28628612).
    In larval development, antagonizes the morphogenetic movements controlled by the
    bsk/JNK signaling including male genitalia formation and thorax development (PubMed:20379222,
    PubMed:20530545, PubMed:25737837).
  source_type: curated
