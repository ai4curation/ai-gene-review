- source: Alliance_Automated
  text: Involved in embryonic development via the syncytial blastoderm; establishment
    or maintenance of epithelial cell apical/basal polarity; and imaginal disc morphogenesis.
    Located in cytoplasm and extracellular region. Colocalizes with apical plasma
    membrane and endosome. Is expressed in several structures, including adult head;
    dorsal epidermis primordium; embryonic head epidermis; embryonic ventral epidermis;
    and epithelium.
