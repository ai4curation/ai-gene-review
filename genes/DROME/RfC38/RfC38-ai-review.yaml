- description: With the large subunit Elg1, RfC38 forms the Elg1 RFC-like complex that unloads PCNA from
    DNA after replication; in Drosophila S2 cells this complex is bridged to the Enok acetyltransferase
    complex through Br140.
  contributes_to_molecular_function:
