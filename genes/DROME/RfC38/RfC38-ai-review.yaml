    reference_section_type: RESULTS
suggested_questions:
- question: Does the Drosophila Ctf18-RFC complex exist and use the same four small subunits, and do the
    fly small subunits therefore contribute to cohesion establishment as in yeast?
- question: Which of the four small-subunit ATP sites are required for PCNA unloading by the Drosophila
    Elg1 complex, as opposed to loading by RFC?
suggested_experiments:
- description: Reconstitute Drosophila RFC and Elg1-RLC from recombinant subunits and measure PCNA loading
    and unloading on primed templates, testing Walker A/B mutants of each small subunit.
