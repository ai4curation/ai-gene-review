  label: Drosophila melanogaster
description: RfC38 (ortholog of human RFC3) is one of the four AAA+ small subunits of replication factor
  C, the ATP-dependent clamp loader that opens PCNA and places it on primer-template DNA so that polymerases
  delta and epsilon elongate processively. The same small subunits assemble with alternative large subunits
  into RFC-like complexes; in Drosophila RfC38 co-purifies with Elg1 in the Elg1 complex that unloads
  PCNA from chromatin after replication. RfC38 is a nuclear protein essential for viability.
