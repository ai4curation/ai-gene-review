taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sord1 (Sodh-1, Sdh-1, CG1982) encodes one of two Drosophila sorbitol dehydrogenases, a zinc-dependent
  medium-chain dehydrogenase/reductase that forms tetramers and oxidizes sorbitol (D-glucitol) and related
  polyols with NAD(+); it converts sorbitol to fructose, the second step of the polyol pathway. Sord1
  is the major sorbitol dehydrogenase transcript, expressed mainly in larvae and adults. Together with
  its close paralog Sord2 it is required for sorbitol clearance, polyol-pathway-dependent glucose sensing
  through the transcription factor Mondo, and production of circulating fructose, which signals through
  the gustatory receptor Gr43a in enteroendocrine cells; neuronal loss of both sorbitol dehydrogenases
  causes sorbitol accumulation and age-dependent synaptic degeneration.
