    overall_notes: 'Correct: NAD-dependent oxidation of sorbitol and xylitol, fructose
      synthesis, possibly glucuronate catabolism. Omits the Mondo and fructose sensing
      roles.'
- source: Alliance_Automated
  text: Enables D-sorbitol dehydrogenase (acceptor) activity and L-iditol 2-dehydrogenase
    (NAD+) activity. Involved in D-sorbitol catabolic process and fructose biosynthetic
    process. Predicted to be active in cytosol. Is expressed in several structures,
    including adult head; adult heart; amnioserosa; dorsal ectoderm anlage; and ectoderm
    anlage. Human ortholog(s) of this gene implicated in autosomal recessive distal
    hereditary motor neuronopathy 8. Orthologous to human SORD (sorbitol dehydrogenase).
  source_type: automated
