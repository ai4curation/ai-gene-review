    overall_notes: Correct sulfide quinone oxidoreductase chemistry with glutathione
      as acceptor, but it reads as if measured, while the review says the fly enzyme
      is uncharacterized.
- source: Alliance_Automated
  text: Predicted to enable FAD binding activity; glutathione-dependent sulfide quinone
    oxidoreductase activity; and sulfide:quinone oxidoreductase activity. Predicted
    to be involved in sulfide oxidation. Predicted to be active in mitochondrion.
    Is expressed in adult head and adult heart. Human ortholog(s) of this gene implicated
    in inherited metabolic disorder. Orthologous to human SQOR (sulfide quinone oxidoreductase).
