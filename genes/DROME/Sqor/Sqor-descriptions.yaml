descriptions:
- source: UniProt
  text: Catalyzes the oxidation of hydrogen sulfide with the help of a quinone, such
    as ubiquinone-10, giving rise to thiosulfate and ultimately to sulfane (molecular
    sulfur) atoms. Requires an additional electron acceptor; can use sulfite, sulfide
    or cyanide (in vitro). It is believed the in vivo electron acceptor is glutathione.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VZF6
  source_id: Q9VZF6
