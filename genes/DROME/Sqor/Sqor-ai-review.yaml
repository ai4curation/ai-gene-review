  review:
    summary: >-
      Sulfide:quinone oxidoreductase activity (sulfane sulfur product) by phylogenetic inference (PTN000066985).
    action: MODIFY
    reason: >-
      GO:0070224 describes the bacterial-type reaction releasing elemental sulfane sulfur. The animal
      enzyme transfers the sulfane sulfur to glutathione (or sulfite). Fly Sqor is classified in the
      mitochondrial (animal) SQOR subfamily of PANTHER, which contains the human donor SQOR (Q9Y6N5);
      the glutathione-dependent activity is therefore assigned by family membership and similarity
      to human SQOR, not by a fly assay (the UniProt RHEA:55156 reaction line is an ARBA prediction
      and is not cited). The matching term GO:0106436 is already annotated (IEA, ISS). The two GO
      terms are siblings, so this is a lateral refinement to the reaction the animal enzyme performs.
    proposed_replacement_terms:
    - *id002
    supported_by:
    - reference_id: file:DROME/Sqor/Sqor-uniprot.txt
      record_section: ["DR:PANTHER"]
