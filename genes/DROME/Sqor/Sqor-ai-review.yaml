  title: >-
    Identifying potential dietary treatments for inherited metabolic disorders using Drosophila nutrigenomics.
  findings:
  - statement: >-
      Sqor transcript is dysregulated in shop (sulfite oxidase) mutant larvae and normalized by a cysteine-free
      diet.
    supporting_text: >-
      Genes dysregulated in shop larvae on 100% Cys diet (Eip55E [CTH], Sam-s [MatI-III], and Sqor [SQOR])
      were largely normalized by the Cys-free diet
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Expression-level observation only; no Sqor function tested.
