id: Q9VZF6
gene_symbol: Sqor
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Sqor encodes the Drosophila melanogaster sulfide:quinone oxidoreductase, an FAD-dependent flavoprotein
  of the SQRD family orthologous to human SQOR. By orthology it catalyses the first and committed step
  of mitochondrial hydrogen sulfide oxidation: it oxidizes H2S, transferring the sulfane sulfur to an
  acceptor (glutathione, giving S-sulfanylglutathione, or sulfite, giving thiosulfate) and the electrons
  via FAD to ubiquinone, feeding the respiratory chain. It is expected to act at the matrix face of the
  inner mitochondrial membrane. The fly enzyme has not been characterized; Sqor transcript levels are
  altered in sulfite oxidase (shop) mutant larvae in a dietary cysteine-dependent manner.
