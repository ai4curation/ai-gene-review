suggested_questions:
- question: >-
    Is Sqor required for sulfide detoxification in flies, and does it contribute to H2S-dependent effects
    on lifespan under dietary restriction?
suggested_experiments:
- description: >-
    Measure H2S oxidation by isolated mitochondria from Sqor mutant and control flies, and sulfide tolerance
    of the mutants.
  hypothesis: Sqor is the main entry point for mitochondrial sulfide oxidation in flies.
