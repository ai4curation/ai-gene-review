id: P48603
gene_symbol: cpb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: cpb (burned) encodes the beta subunit of Drosophila capping protein, the CapZ-family alpha/beta
  heterodimer that binds actin filament barbed ends and prevents addition and loss of actin monomers.
  Cpb and Cpa are mutually dependent for stability. cpb null mutants are larval lethal, weak alleles disrupt
  actin bundles in developing bristles, and loss of capping protein causes F-actin accumulation, degeneration
  of eye tissue, extrusion of wing blade cells, and defects in lamella formation, nurse cell cortical
  integrity and dumping, oocyte determination and border cell migration. Capping protein acts antagonistically
  to Ena/VASP, restrains Src/JNK signaling and tissue growth via F-actin control, caps the Arp1 filament
  of dynactin and associates with the WASH machinery.
