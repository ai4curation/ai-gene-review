    in Drosophila.
  findings: []
core_functions:
- description: Cpb, as the beta subunit of the obligate alpha/beta capping protein heterodimer, binds
    actin filament barbed ends and blocks monomer addition and loss, limiting F-actin accumulation in
    the cortex, lamellipodia and filopodia.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0051016
    label: barbed-end actin filament capping
  - id: GO:0030036
    label: actin cytoskeleton organization
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  in_complex:
    id: GO:0008290
    label: F-actin capping protein complex
  supported_by:
  - *id003
  - *id013
suggested_questions:
- question: Which Drosophila tissues use dynactin-associated versus free capping protein heterodimer,
    and are any cpb phenotypes attributable to dynactin rather than actin filament capping?
suggested_experiments:
- hypothesis: Cpb phenotypes in bristles and nurse cells reflect barbed-end capping of actin filaments
    rather than dynactin function.
  description: Compare cpb hypomorph phenotypes with dynactin (Arp1/p150Glued) knockdown in the same tissues,
    and rescue cpb with a beta-tentacle mutant deficient in actin capping but competent for heterodimer
    formation.
