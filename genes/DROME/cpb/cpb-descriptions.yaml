- source: Alliance_Automated
  text: Enables protein heterodimerization activity. Involved in several processes,
    including barbed-end actin filament capping; oogenesis; and regulation of plasma
    membrane bounded cell projection assembly. Part of F-actin capping protein complex.
    Colocalizes with adherens junction. Is expressed in several structures, including
    amnioserosa; anterior-posterior subdivision of organism; embryonic/larval hemocyte;
    embryonic/larval midgut primordium; and gut section. Orthologous to human CAPZB
    (capping actin protein of muscle Z-line subunit beta).
  source_type: automated
