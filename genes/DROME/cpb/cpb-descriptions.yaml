- source: Alliance_Imported
  text: capping protein beta (cpb) encodes an actin-binding protein that, together
    with cpa, binds to the fast growing ends of actin filaments, restricting the addition
    or loss of actin monomers. It restricts JNK signaling, modulates Hippo signaling,
    maintains epithelial integrity and neuronal homeostasis, controls proliferation/apoptosis
    in wing imaginal discs, and promotes oogenesis.
  source_type: curated
  url: https://flybase.org/reports/cpb.html
  source_id: FB:FBgn0011570
