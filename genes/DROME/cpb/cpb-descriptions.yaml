descriptions:
- source: UniProt
  text: F-actin-capping proteins bind in a Ca(2+)-independent manner to the fast growing
    ends of actin filaments (barbed end) thereby blocking the exchange of subunits
    at these ends. Unlike other capping proteins (such as gelsolin and severin), these
    proteins do not sever actin filaments. Forms, with CAPZB, the barbed end of the
    fast growing ends of actin filaments in the dynactin complex and stabilizes dynactin
    structure. The dynactin multiprotein complex activates the molecular motor dynein
    for ultra-processive transport along microtubules (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48603
  source_id: P48603
