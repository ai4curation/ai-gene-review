- source: Alliance_Automated
  text: Enables DNA binding activity. Involved in DNA damage checkpoint signaling;
    DNA replication; and DNA replication checkpoint signaling. Located in nucleus.
    Part of Elg1 RFC-like complex. Is expressed in several structures, including adult
    head; antennal primordium; central brain primordium; head epidermis primordium;
    and somatic stem cell. Orthologous to human RFC2 (replication factor C subunit
    2).
