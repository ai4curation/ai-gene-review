taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: ClpX (CG4538) encodes the AAA+ ATPase subunit of the Drosophila mitochondrial ClpXP protease.
  Hexameric ClpX recognizes specific matrix proteins, unfolds them with energy from ATP hydrolysis and
  translocates them into the proteolytic chamber of the ClpP tetradecamer. In fly cells ClpX binds both
  ClpP and the mitochondrial RNA-binding protein DmLRPPRC1, and loss of ClpX or ClpP stabilizes DmLRPPRC1,
  linking ClpXP-mediated proteolysis to control of mitochondrial mRNA abundance and translation and to
  mitochondrial protein quality control.
