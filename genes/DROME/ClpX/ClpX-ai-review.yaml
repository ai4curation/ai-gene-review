suggested_questions:
- question: Does fly ClpX have ClpP-independent chaperone functions, for example in loading cofactors
    into mitochondrial enzymes such as ALAS, as reported for yeast and mammalian ClpX?
- question: What degron does ClpX recognize in DmLRPPRC1, and is the C-terminal alanine important?
suggested_experiments:
- hypothesis: ClpX recognizes DmLRPPRC1 through a C-terminal degron.
  description: Mutate or extend the C-terminus of DmLRPPRC1 and measure its turnover and co-immunoprecipitation
    with ClpX in S2 cells expressing catalytically inactive ClpP.
