descriptions:
- source: Alliance_Automated
  text: Predicted to enable ABC-type heme transporter activity and heme binding activity.
    Involved in cellular detoxification of cadmium ion. Located in vacuolar membrane.
    Is expressed in adult head; adult heart; embryonic/larval midgut; and gastric
    caecum. Human ortholog(s) of this gene implicated in dyschromatosis universalis
    hereditaria. Orthologous to human ABCB6 (ATP binding cassette subfamily B member
    6 (LAN blood group)).
  source_type: automated
