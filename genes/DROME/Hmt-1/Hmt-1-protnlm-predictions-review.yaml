  predicted_term:
    id: GO:0140359
    label: ABC-type transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: ABC-type transporter activity is supported by the complete ABCB6-type architecture of Hmt-1
      (TMD0, ABC transmembrane domain and ABC nucleotide-binding cassette) and by functional rescue of the
      fission-yeast hmt-1 cadmium-hypersensitivity phenotype by DmHMT-1, which acts without transporting
      Cd-phytochelatin complexes; the human ortholog ABCB6 is an ATP-driven porphyrin/heme transporter and
      heavy-metal efflux pump. The identical term GO:0140359 is already annotated to Hmt-1 (InterPro2GO IEA)
      and the gene review accepts it as the core molecular function, the precise level the cadmium evidence
      allows because the transported cadmium species is unresolved. The more specific ABC-type heme transporter
      activity is also carried (IBA, eumetazoan ABCB6 PAINT node), but it does not describe the cadmium
      role, so the prediction is not materially less precise than the curated core function. Not novel.
    supported_by:
    - reference_id: PMID:19001374
      supporting_text: 'heterologously expressed DmHMT-1

        suppresses the Cd2+ hypersensitivity of S. pombe hmt-1 mutants and localizes to

        the vacuolar membrane but does not transport Cd.PC complexes.'
    - reference_id: file:DROME/Hmt-1/Hmt-1-uniprot.txt
      supporting_text: DR   InterPro; IPR032410; ABCB6_N.
    - reference_id: file:DROME/Hmt-1/Hmt-1-uniprot.txt
