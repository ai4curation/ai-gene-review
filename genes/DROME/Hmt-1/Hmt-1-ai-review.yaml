    action: MARK_AS_OVER_ANNOTATED
    summary: Golgi membrane is one of eleven compartments that an ARBA subcellular-location rule copies
      from mammalian ABCB6 onto this unreviewed fly entry; there is no fly or heterologous evidence for
      a Golgi site of action.
    reason: The only experimental localization of DmHMT-1 places it in the vacuolar membrane after expression
      in S. pombe (PMID:19001374). The ARBA location list mirrors the biosynthetic and endolysosomal itinerary
      reported for mammalian ABCB6 (PMID:22655043); a Golgi transit stage is not a site where the transporter
      acts, and PAINT curators placed only vacuolar membrane at the opisthokont ABCB6 node (PTN008609345),
      not Golgi membrane. Golgi membrane is therefore over-annotation for the fly protein.
