  review:
    action: ACCEPT
    summary: ABC-type heme/porphyrin transport is the PAINT assignment at the eumetazoan ABCB6 node, from
      which Hmt-1 descends; human ABCB6 hemin:GSH-stimulated ATP hydrolysis and substrate-bound structures
      ground it.
    reason: PTN001199916 is placed at Eumetazoa (taxon 6072) and seeded by human ABCB6 (Q9NP58); Drosophila
      Hmt-1 is inside that clade (PANTHER subfamily PTHR24221:SF654, ABCB6) and retains the ABCB6-specific
