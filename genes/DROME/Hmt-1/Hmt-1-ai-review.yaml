    summary: The specific Golgi membrane assignment is not resolved by the available DmHMT-1 experiment.
    reason: The specific Golgi membrane assignment is not resolved by the available DmHMT-1 experiment.
      The target protein localizes to a vacuolar membrane when expressed in fission yeast; this does not
      distinguish the many additional compartments assigned through automated location mappings. A target-resolved
      localization study or conserved targeting determinant for this compartment is missing, so this assignment
      is not promoted to a core site of action.
