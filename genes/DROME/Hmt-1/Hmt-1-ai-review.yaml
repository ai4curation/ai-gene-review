  - *choi_sf9
  - *choi_e752q
- description: Inherited ABCB6-clade ATP-dependent transport of heme and porphyrins across an organellar
    membrane. Assigned by PAINT at the eumetazoan ABCB6 node and grounded in human ABCB6 biochemistry
    and structures; not yet tested for the fly protein, and its physiological importance in Drosophila
    is unknown.
  molecular_function:
