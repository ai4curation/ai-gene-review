id: Q9VF20
gene_symbol: Hmt-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hmt-1 (CG4225, DmHMT-1) is the Drosophila member of the ABCB6/HMT-1 clade of ATP-binding
  cassette half-transporters. The single 866-residue product has an N-terminal ABCB6-type membrane extension
  (TMD0), a six-helix ABC transmembrane domain and a C-terminal ABC nucleotide-binding domain, and is
  expected to function as a homodimer that couples ATP hydrolysis to translocation of solutes across
  an organellar membrane. When expressed in fission yeast, DmHMT-1 restores cadmium tolerance to hmt-1
  mutants and localizes to the vacuolar membrane, but it does not transport cadmium-phytochelatin complexes,
  consistent with the absence of phytochelatin synthase from the fly genome; its cadmium-detoxifying role
  is therefore phytochelatin-independent. Orthologous human ABCB6 transports porphyrins and hemin and
  binds cadmium-glutathione and cadmium-phytochelatin complexes whose binding stimulates ATP hydrolysis,
  so heme/porphyrin and thiol-coordinated metal transport are conserved activities of the clade. The
  endogenous membrane in fly cells and the chemical species that DmHMT-1 moves have not been determined.
