    label: ABC-type transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011527
  review:
    action: ACCEPT
    summary: ABC-type transporter activity is the appropriate substrate-neutral term for the transport
      that underlies cadmium detoxification, whose substrate is unresolved.
    reason: Hmt-1 has a complete ABC half-transporter architecture (TMD0, ABC transmembrane domain and
      ABC cassette). Its best-supported fly role, cadmium detoxification (PMID:19001374), proceeds by an
      ABC-type activity whose substrate (free Cd2+, a Cd-glutathione complex or another conjugate) is not
      determined; DmHMT-1 does not transport Cd-phytochelatin. A more specific heme transporter term is
      accepted separately, but it would not describe the cadmium role, so the generic term is kept as
      the precise level the cadmium evidence allows rather than refined.
    supported_by:
    - *dmhmt1_main
    - *uniprot_abcb6n
    - *uniprot_abc_nbd
    - &choi_efflux
      reference_id: PMID:38822018
      supporting_text: also functions as a heavy metal efflux pump
