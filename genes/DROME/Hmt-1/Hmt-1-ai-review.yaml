- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    action: REMOVE
    summary: Hmt-1 is a ten-helix integral membrane protein; the extracellular-region row is a mapping
      of "Secreted, extracellular exosome" copied from mammalian ABCB6 found in reticulocyte exosomes.
    reason: The SL-0243 mapping derives from the ARBA location rule, whose mammalian basis is ABCB6 carried
      on exosomes shed by maturing reticulocytes (PMID:22655043). That is a membrane-vesicle observation
      specific to erythroid maturation, a cell type insects lack, and it does not mean the protein is a
      soluble extracellular-region component. DmHMT-1 has ten predicted transmembrane helices and localizes
      to an intracellular vacuolar membrane in the only experimental study (PMID:19001374). There is no
      biological basis to place it in the extracellular region.
    supported_by:
    - &kiss_exosome
      reference_id: PMID:22655043
      supporting_text: ABCB6 is a glycoprotein present in the membrane of mature erythrocytes and in exosomes
        released from reticulocytes during the final steps of erythroid maturation
