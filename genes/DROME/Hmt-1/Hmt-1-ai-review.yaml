    summary: DmHMT-1 rescues the cadmium hypersensitivity of S. pombe hmt-1 mutants, a phytochelatin-independent
      detoxification role that the human ABCB6 ortholog shares.
    reason: The complementation experiment directly shows that DmHMT-1 performs the cellular function
      missing in hmt-1 mutant yeast, and the authors conclude a phytochelatin-independent role in Cd2+
      detoxification, consistent with the fly genome lacking phytochelatin synthase. As an ATP-driven transporter
      that removes cadmium from the cytosol, Hmt-1 performs the detoxifying step itself, so this is participation
      rather than an indirect phenotype. Human ABCB6 binds Cd(II):glutathione, is stimulated by it, and
      protects insect Sf9 cells from cadmium only when catalytically active (PMID:38822018), supporting
      the role as conserved in the clade. The caveat is that the assay is heterologous.
    supported_by:
    - *dmhmt1_main
    - &dmhmt1_pc
      reference_id: PMID:19001374
      supporting_text: invoke a PC-independent role for these transporters in Cd2+ detoxification
    - &dmhmt1_nopcs
      reference_id: PMID:19001374
      supporting_text: Drosophila, whose genome lacks PCS homologs, functions in heavy metal detoxification
    - &choi_sf9
      reference_id: PMID:38822018
      supporting_text: cells infected with baculoviruses carrying the hABCB6core gene exhibited enhanced
        viability, retaining 40% compared with untreated controls, even at a concentration as high as 50
        μM
    - *choi_e752q
