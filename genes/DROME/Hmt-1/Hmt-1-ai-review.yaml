suggested_questions:
- question: Where does endogenous Hmt-1 reside in fly cells (lysosome, endosomes, or another membrane),
    and does its location change with cadmium exposure?
- question: Which cadmium species does DmHMT-1 transport in the absence of phytochelatins; is Cd(II)-bis-glutathione
    a substrate, as for human ABCB6?
- question: Does Drosophila Hmt-1 transport heme or porphyrins in vivo, and does loss of Hmt-1 alter porphyrin
    accumulation or heme-dependent processes?
suggested_experiments:
- description: Purify DmHMT-1 (or its TMD0-deleted core) and measure ATPase stimulation by Cd(II):GSH,
    hemin:GSH and coproporphyrin III, with a Walker B glutamate-to-glutamine mutant as control.
  experiment_type: biochemical reconstitution
- description: Tag endogenous Hmt-1 by CRISPR knock-in and co-localize with lysosomal (LAMP1, Spinster)
    and endosomal (Rab5, Rab7) markers in fat body and Malpighian tubule, with and without dietary cadmium.
  experiment_type: localization
- description: Compare cadmium survival and tissue cadmium content in Hmt-1 null versus control flies,
    with rescue by wild-type and ATPase-dead transgenes, to test whether the yeast complementation result
    reflects an in vivo role.
  experiment_type: genetic loss of function
