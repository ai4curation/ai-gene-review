core_functions:
- description: ATP-driven ABC half-transporter that protects cells from cadmium by a phytochelatin-independent
    mechanism, acting at a vacuolar (lysosome-like) membrane in the heterologous assay; the transported
    cadmium species is unresolved, and thiol-coordinated Cd(II) is the leading candidate from the human
    ortholog.
  molecular_function:
    id: GO:0140359
    label: ABC-type transporter activity
  directly_involved_in:
