id: Q9VF20
gene_symbol: Hmt-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hmt-1 is an ABCB6-family membrane transporter that couples ATP hydrolysis to solute translocation.
  The Drosophila protein confers cadmium tolerance and targets the vacuolar membrane when expressed in
  fission yeast, without requiring cadmium-phytochelatin transport. Conserved ABCB6-family properties
  support heme/porphyrin handling, while the physiological transported metal complex and the endogenous
  fly compartment remain incompletely resolved.
