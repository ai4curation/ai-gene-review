- source: Alliance_Imported
  text: Raf oncogene (Raf) encodes a serine-threonine protein kinase that acts downstream
    of the product of Ras85D. It activates the MEK/ERK pathway to regulate cell proliferation,
    differentiation and survival downstream of receptor tyrosine kinases such as those
    encoded by tor, Egfr, and sev.
  source_type: curated
  url: https://flybase.org/reports/Raf.html
  source_id: FB:FBgn0003079
  review:
