      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and compact: Ser/Thr kinase downstream of Ras85D that
      activates MEK/ERK downstream of Torso, Egfr and Sevenless.'
- source: Alliance_Automated
  text: Enables MAP kinase kinase kinase activity and kinase binding activity. Involved
    in several processes, including cell surface receptor protein tyrosine kinase
    signaling pathway; epithelial cell migration; and regionalization. Predicted to
    be located in plasma membrane. Predicted to be active in cytoplasm. Is expressed
    in several structures, including anterior endoderm; anterior endoderm anlage;
    central brain primordium; embryonic/larval midgut primordium; and ganglia. Used
    to study cancer; carcinoma; cardiomyopathy; and high grade glioma. Human ortholog(s)
    of this gene implicated in several diseases, including Noonan syndrome (multiple);
    Noonan syndrome with multiple lentigines (multiple); cardiofaciocutaneous syndrome
    (multiple); dilated cardiomyopathy 1NN; and disease of cellular proliferation
    (multiple). Orthologous to human ARAF (A-Raf proto-oncogene, serine/threonine
    kinase); BRAF (B-Raf proto-oncogene, serine/threonine kinase); and RAF1 (Raf-1
    proto-oncogene, serine/threonine kinase).
