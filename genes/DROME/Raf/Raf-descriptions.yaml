descriptions:
- source: UniProt
  text: Serine/threonine kinase required in the early embryo for the formation of
    terminal structure (PubMed:3135183, PubMed:8423783). Also required during the
    proliferation of imaginal cells (PubMed:3135183). May act downstream of Ras85D
    in the tor signal transduction pathway (PubMed:8423783). During larval development,
    mediates Ptth/tor signaling leading to the production of ecdysone, a hormone required
    for the initiation of metamorphosis (PubMed:19965758).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P11346
