id: P11346
gene_symbol: Raf
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Raf encodes the Drosophila RAF-family MAP kinase kinase kinase activated
  downstream of Ras85D. Receptor and Ras signaling recruit and activate Raf at
  the cytoplasmic face of membranes, where Raf phosphorylates Dsor1/MEK and
  propagates signals through the Rolled/ERK MAPK cascade during EGFR, Torso,
  Sevenless, and FGF pathway outputs.
