    overall_notes: Correct on cytosolic NADP-dependent isocitrate to 2-oxoglutarate
      conversion and the NADPH network with Men, G6pd and Pgd. The peroxisomal NADPH
      regeneration claim is not supported by the review.
- source: Alliance_Automated
  text: Enables isocitrate dehydrogenase (NADP+) activity. Involved in NADPH regeneration;
    cellular response to oxidative stress; and isocitrate metabolic process. Is active
    in cytosol and mitochondrion. Is expressed in several structures, including adult
    head; adult heart; embryonic anal pad; germline cell; and gut section. Used to
    study D-2-hydroxyglutaric aciduria and cancer. Human ortholog(s) of this gene
    implicated in autoimmune disease; bile duct disease; hematologic cancer (multiple);
    hepatocellular clear cell carcinoma; and high grade glioma (multiple). Orthologous
    to human IDH1 (isocitrate dehydrogenase (NADP(+)) 1).
  source_type: automated
