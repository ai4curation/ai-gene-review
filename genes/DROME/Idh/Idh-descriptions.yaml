descriptions:
- source: Alliance_Imported
  text: Isocitrate dehydrogenase (Idh) encodes a cytosolic enzyme that catalyzes the
    oxidative decarboxylation of isocitrate to 2-oxoglutarate, with the concomitant
    reduction of NADP[+] to NADPH. It functions, along with Men, G6pd, and Pgd, in
    a small network of NADP reducing enzymes. Idh also participates in NADPH regeneration
    in the mitochondrion and the peroxisome.
  source_type: curated
  url: https://flybase.org/reports/Idh.html
  source_id: FB:FBgn0001248
