- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008982454
  - UniProtKB:P9WKL1
  review:
    summary: >-
      Tricarboxylic acid cycle by phylogenetic inference (PTN008982454; donor Mycobacterium tuberculosis
      Icd P9WKL1).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only experimental donor is a bacterial NADP-IDH, which is the TCA-cycle isocitrate dehydrogenase
      in bacteria. In animals the TCA-cycle step is catalysed by the NAD+-dependent isocitrate dehydrogenase
      complex (Idh3 subunits in flies), and the NADP+-dependent enzymes are regarded as NADPH-producing
      enzymes. Fly evidence links Idh to NADPH supply and redox balance, not to TCA-cycle flux; the term
      is therefore an over-annotation for this gene.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P9WKL1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bacterial Icd is the TCA-cycle IDH; in animals that role is taken by NAD-IDH.
