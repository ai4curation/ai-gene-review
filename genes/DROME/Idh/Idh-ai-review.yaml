taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Idh encodes the NADP+-dependent isocitrate dehydrogenase of Drosophila melanogaster, a homodimeric Mg2+/Mn2+-dependent
  enzyme that oxidatively decarboxylates isocitrate to 2-oxoglutarate and CO2 while reducing NADP+ to
  NADPH. Unlike mammals, which use separate genes for the cytosolic/peroxisomal (IDH1) and mitochondrial
  (IDH2) enzymes, flies make both forms from a single gene: alternative transcripts encode mitochondrial
  isoforms with an N-terminal targeting sequence (IDHm) and a cytosolic isoform lacking it (IDHc). The
  enzyme is a major source of NADPH for glutathione- and thioredoxin-based antioxidant defence and for
  lipid synthesis. Idh mutant flies have reduced IDH activity and NADPH/NADP+ ratio, accumulate reactive
  oxygen species and are hypersensitive to rotenone, and Idh overexpression protects DJ-1-deficient dopaminergic
  neurons from oxidative stress. In flight muscle, Idh knockdown raises the NADP+:NADPH ratio and impairs
  assembly of respiratory complex I, linking matrix NADPH supply to oxidative phosphorylation biogenesis.
