suggested_questions:
- question: >-
    What fraction of cytosolic NADPH in fly fat body comes from IDHc compared with G6pd/Pgd and Men, and
    does this change with diet (sugar versus lipid)?
- question: >-
    Do the mitochondrial IDHm isoforms contribute to TCA-cycle isocitrate oxidation in flies, or only
    to matrix NADPH supply?
- question: >-
    Is the complex I assembly defect of Idh knockdown muscle caused by loss of matrix NADPH specifically
    (IDHm isoforms), and is it shared with Men-b knockdown?
suggested_experiments:
- description: >-
    Isoform-specific knockouts (IDHc versus IDHm) followed by compartment-resolved NADPH/NADP+ sensors
    and 13C-isotope tracing of isocitrate/2-oxoglutarate flux.
  hypothesis: IDHc and IDHm supply NADPH to separate compartments and are not functionally redundant.
