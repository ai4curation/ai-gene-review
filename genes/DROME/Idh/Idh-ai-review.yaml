- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:96413
  - PANTHER:PTN002483519
  - RGD:2862
  - SGD:S000004954
  - UniProtKB:C8VIX5
  - UniProtKB:O75874
  review:
    summary: >-
      Peroxisome localization by phylogenetic inference (PTN002483519; donors human IDH1 O75874, mouse
      Idh1, rat Idh1, yeast IDP3, Aspergillus C8VIX5).
    action: REMOVE
    reason: >-
      Peroxisomal targeting of the donor enzymes (human IDH1, yeast IDP3) depends on a C-terminal PTS1
      signal. All Drosophila Idh isoforms in UniProt (B7Z0E0, Q7KUB1, Q8IQA7, Q7KUB0, Q9VSI6) end in ...AVAAK,
      which lacks a PTS1, and fly Idh isoforms are described as cytosolic or mitochondrial. There is no
      fly evidence for peroxisomal Idh; the transfer is not supported for this gene. Murari et al. note
      that CG7176 "could function in the cytosol, peroxisome, and/or mitochondrion" because it is the
      sole IDH1/IDH2 ortholog, but that is a possibility raised from orthology, not an observation, and
      it does not overcome the absence of a PTS1. This automated IBA row is removed, whereas the curator-made
      ISS row is only marked as over-annotated, in deference to the curator.
    supported_by:
    - reference_id: PMID:28827794
      supporting_text: >-
        However, in Drosophila, a cytosolic isoform (IDHc) and mitochondrial isoforms (IDHm1 and IDHm2)
        are expressed from the single gene IDH
    - reference_id: PMID:35544578
      supporting_text: >-
        CG7176 (dIDH2) is the sole Drosophila ortholog of both IDH1 and IDH2, suggesting that it could
        function in the cytosol, peroxisome, and/or mitochondrion.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002483519
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donors carry a C-terminal PTS1; fly Idh isoforms end in AVAAK and lack it.
