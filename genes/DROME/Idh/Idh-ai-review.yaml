- id: PMID:28827794
  title: >-
    Isocitrate protects DJ-1 null dopaminergic cells from oxidative stress through NADP+-dependent isocitrate
    dehydrogenase (IDH).
  findings:
  - statement: >-
      A single Drosophila IDH gene encodes cytosolic and mitochondrial isoforms; Idh mutants have reduced
      IDH activity and NADPH/NADP+ ratio, accumulate ROS and are rotenone-sensitive; Idh overexpression
      protects DJ-1 mutant dopaminergic neurons.
    supporting_text: >-
      From these results, we concluded that IDH is an important antioxidant enzyme that protects cells
      downstream of DJ-1 under oxidative stress.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; primary fly genetic and biochemical evidence.
