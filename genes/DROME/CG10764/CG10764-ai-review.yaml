  review:
    summary: Predicted serine endopeptidase activity of the N-terminal protease domain; supported by an
      intact catalytic triad, but not experimentally measured.
    action: ACCEPT
    reason: The N-terminal S1 domain (38-265) retains H78, D121 and S214 in canonical SAAHC, NDIGLL
      and GDSGGP motifs, matching the UniProt PROSITE-ProRule active-site features, so the protein is
      predicted to be a catalytically competent S1A serine endopeptidase. This is the best-supported
      molecular function, but it rests on sequence evidence only. The EC 3.4.21.1 (chymotrypsin)
      mapping behind part of this combined IEA is a generic ProRule assignment; the S1-pocket Asp208
      instead predicts trypsin-like specificity, so the EC number should not be read as a substrate
      specificity claim.
