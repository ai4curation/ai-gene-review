- term:
    id: GO:0035207
    label: negative regulation of hemocyte proliferation
  evidence_type: IGI
  original_reference_id: PMID:20168330
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0004864
  review:
    summary: FlyBase genetic-interaction annotation from the hopTum (JAK gain-of-function) blood-cell
      tumour model; experimentally based, but the mechanism is unknown.
    action: KEEP_AS_NON_CORE
    reason: Bina et al. identified CG10764 as a JAK/STAT target in haemocyte-like cells and tested
      target knockdown in the hop (FBgn0004864) gain-of-function model of haemocyte
      over-proliferation. A later paper from another group summarises that CG10764 and CG4793 had
      opposing effects on the hopTum phenotype. The cached record is abstract-only, so the direction
      of the CG10764 effect could not be checked here; the FlyBase curator read the full text and
      the annotation is kept. It is a regulatory, genetic-interaction phenotype in a tumour model
      with no mechanism, and the protein most plausibly acts as a secreted protease upstream of
      it, so it is retained as non-core rather than as the gene's core process.
    supported_by:
    - reference_id: PMID:20168330
      supporting_text: we use transcript profiling of Drosophila haemocyte-like cells to identify
        JAK/STAT target genes, combined with an in vivo model for JAK-induced blood cell
        overproliferation, to identify the main effectors required for haematopoietic
        tumour development
    - reference_id: PMID:33644706
      supporting_text: these S1A family members were also shown to have opposing effects on the phenotype
        seen in hopTum flies, which display a melanotic phenotype due to ectopic JAK-STAT signaling
