  - FB:FBgn0051217
  - FB:FBgn0052382
  - FB:FBgn0052383
  - PANTHER:PTN000667087
  - UniProtKB:A0A1S4H5S2
  review:
    summary: Phylogenetic inference of innate immune involvement; independently consistent with the
      RNAi encapsulation phenotype in haemocytes.
    action: ACCEPT
    reason: PAINT placed innate immune response at the ecdysozoan node PTN000667087 of the PTHR24256
      tree, seeded by Drosophila immune proteases such as the Toll-pathway SPs. PANTHER 19.0 now
      classifies CG10764 in PTHR24260:SF147 rather than in the subfamilies of those seeds, so the
      IBA alone would be a weak basis for transfer. However, CG10764 has its own species-specific
      evidence that it acts in the cellular immune response. Knockdown with two independent RNAi
      lines in either plasmatocytes (eater-GAL4) or lamellocytes (msn-GAL4) reduced
      encapsulation of Leptopilina clavipes eggs. That is a cell-autonomous immune-cell phenotype,
      not a remote organismal one. The general term is accepted. The specific step it acts in, and
      whether its activity is direct, is unknown, so no more specific process is proposed.
    supported_by:
    - reference_id: PMID:33644706
      supporting_text: We find that knocking down CG10764 with either of the RNAi lines in lamellocytes
    - reference_id: PMID:33644706
      supporting_text: results in a significant reduction in the proportion of wasp eggs that are successfully
        encapsulated. These findings suggest that CG10764 may act as a positive regulator of encapsulation
        in both fly immune cell types.
