id: A1ZAT2
gene_symbol: CG10764
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG10764 (SP77) encodes a 523-residue secreted S1A (chymotrypsin-fold) serine protease of
  Drosophila melanogaster with an N-terminal signal peptide and two tandem trypsin-like domains.
  The N-terminal domain carries an intact His-Asp-Ser catalytic triad (H78, D121, S214) and an
  S1-pocket Asp (D208) typical of trypsin-like specificity, whereas the C-terminal domain lacks
  the catalytic His and Ser and is a non-catalytic protease-like domain. Its enzymatic activity,
  activation mechanism and substrates have not been measured. CG10764 is transcriptionally
  induced by JAK/STAT signalling in haemocyte-like cells and modifies the JAK-driven hopTum
  haematopoietic tumour phenotype, and RNAi knockdown in either plasmatocytes or lamellocytes
  reduces encapsulation of parasitoid wasp eggs, indicating that it is required for the larval
  cellular immune response. How the protease acts in these processes is unknown.
