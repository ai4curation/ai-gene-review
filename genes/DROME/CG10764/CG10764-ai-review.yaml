suggested_questions:
- question: Which step of the larval encapsulation response requires CG10764? It could be haemocyte
    activation, lamellocyte differentiation, adhesion to the egg, or melanization. Does that
    requirement depend on its catalytic Ser214?
- question: PANTHER 19.0 places A1ZAT2 in PTHR24260:SF147, while the GOA IBA rows derive from
    PTN000667087 in the PTHR24256 tree. Should the PAINT innate-immune assertion be re-evaluated
    for the SF147 tandem PD+PLD clade?
- question: What is the direction of the CG10764 knockdown effect on hopTum haemocyte
    over-proliferation, and is CG10764 induced by JAK/STAT in vivo after wasp infection?
suggested_experiments:
- description: Generate a CG10764 null allele and a catalytic-dead S214A rescue transgene. Test
    encapsulation and melanization after Leptopilina infection, to separate a requirement for
    the protein from a requirement for its protease activity.
  experiment_type: genetic loss of function with rescue
- description: Express recombinant CG10764, identify its activating protease, and profile cleavage
    specificity on peptide libraries to test the predicted trypsin-like P1 preference.
  experiment_type: biochemical activity assay
