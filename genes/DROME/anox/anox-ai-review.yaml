id: Q9VRG6
gene_symbol: anox
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Drosophila anox (current FlyBase symbol Acbp-Ank, CG33713, FBgn0064116) encodes a soluble
  243-residue intracellular acyl-CoA-binding protein translated from the 3' open reading
  frame of the dicistronic CG33071 transcription unit. As the insect ortholog of vertebrate
  ACBD6 and the sole ankyrin-repeat-containing member among the nine Drosophila acyl-CoA
  binding proteins, Q9VRG6 pairs an N-terminal four-helix acyl-CoA-binding (ACB) domain
  (residues 9-94) conserving the CoA-headgroup triad (Tyr36, Lys40, Lys62) and acyl-chain
  pocket tyrosine (Tyr81) with two C-terminal ankyrin repeats (residues 148-180 and
  181-213), while lacking any transmembrane segment. Expressed in cephalic chemosensory
  organs and central nervous system neurons of larvae and adults, the ACBP-ANK protein acts
  upstream of neuronal insulin receptor (InR / dInR) transcription and Akt-dFOXO signaling
  to sustain gustatory sugar responsiveness, larval mouth-hook feeding activity, and adult
  food intake.
