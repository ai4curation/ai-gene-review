suggested_questions:
- question: >-
    Does Drosophila Acbp-Ank (anox) directly bind and stimulate Drosophila
    N-myristoyltransferase (Nmt) in chemosensory and CNS neurons, and does impaired
    N-myristoylation of a neuronal signaling target account for the constitutive Akt
    activation and dInR repression in GS1189 mutants?
  experts:
  - Yoichi Hayakawa
  - Eric Soupene
suggested_experiments:
- hypothesis: >-
    Recombinant Drosophila Acbp-Ank binds long-chain unsaturated fatty-acyl-CoAs via Tyr81
    and forms a complex via its C-terminal ankyrin repeats (residues 148-213) with Drosophila
    Nmt that protects N-myristoylation from palmitoyl-CoA competition, and point mutation of
    Tyr81 or deletion of the ANK repeats abolishes rescue of the GS1189 larval feeding
    defect.
  description: >-
    Assay acyl-CoA binding and Drosophila Nmt stimulation in vitro for wild-type Acbp-Ank,
    Y81A, and DeltaANK variants, and test UAS rescue of larval feeding and CNS dInR
    expression in Anox-Gal4; GS1189 flies.
  experiment_type: biochemical acyl-CoA/Nmt assays and transgenic UAS domain-rescue in Drosophila
