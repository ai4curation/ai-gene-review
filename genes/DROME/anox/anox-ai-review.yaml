- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      The N-terminal ACB domain of ACBD6 is sufficient for selective long-chain
      fatty-acyl-CoA binding.
    supporting_text: >-
      Removal of the two ANK motifs, ACBD6-ΔC, had no effect on the binding activity or on
      the substrate preference ( Fig. 4 ). Thus, the ACB domain present at the N terminus is
      sufficient for binding to the substrate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes biochemical function of the conserved ACB domain in the
      metazoan ACBD6 clade.
- id: PMID:18773904
  title: A gene involved in the food preferences of larval Drosophila melanogaster.
  full_text_unavailable: true
  findings:
  - statement: >-
      P-element inactivation of the CG33071 locus in Drosophila strain GS1189 abolishes
      larval food preference, and precise reversion restores normal gustatory/olfactory food
      choice.
    supporting_text: >-
      The fact that the CG33071 gene expression was inactivated by the P-element insertion in
      the GS1189 strain, and that reversion of this gene completely recovered the normal food
      preference, indicates that this gene contributes to the control of food preferences in
      Drosophila larvae.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Initial genetic identification of the GS1189 / CG33071 food-preference mutant in
      Drosophila larvae (cached abstract-only).
- id: PMID:21917925
  title: Identification of a novel gene, anorexia, regulating feeding activity via
    insulin signaling in Drosophila melanogaster.
  findings:
  - statement: >-
      Anox encodes an acyl-CoA binding protein with a C-terminal ankyrin-repeat domain
      expressed in larval cephalic chemosensory organs and central nervous system neurons.
    supporting_text: >-
      In Drosophila larvae, Anox encodes an acyl-CoA binding protein with an ankyrin repeat
      domain that is expressed in the cephalic chemosensory organs and various neurons in the
      central nervous system (CNS).
  - statement: >-
      Immunoblotting of larval CNS extracts detects the 3'-ORF ACBP-ANK protein (CG33713 /
      Q9VRG6) rather than the 5'-ORF RRM polypeptide of the dicistronic CG33071 locus.
    supporting_text: >-
      Immunoblotting showed a clear band cross-reacted with anti-ACBP-ANK protein IgG but did
      not show the positive band cross-reacted with anti-RRM protein antibody ( Fig. 2 C ),
      indicating that at least the ACBP-ANK protein expressed in normal fly larvae could act
      as an Anox gene product.
  - statement: >-
      CNS overexpression and knockdown of Anox positively regulate dInR transcription and
      correspondingly elevate or repress Drosophila larval feeding activity.
    supporting_text: >-
      We further found that Anox regulates expression of the insulin receptor gene ( dInR );
      overexpression and knockdown of Anox in the CNS, respectively, elevated and repressed
      dInR expression, which altered larval feeding activity in parallel with Anox expression
      levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary full-text characterization of Drosophila anox / Acbp-Ank (CG33713, Q9VRG6),
      verifying translation of the ACBP-ANK ORF and dissecting its role upstream of neuronal
      dInR expression and feeding behavior.
- id: PMID:30642881
  title: ACBD6 protein controls acyl chain availability and specificity of the N-myristoylation
    modification of proteins.
  findings:
  - statement: >-
      Soluble ankyrin-repeat ACBD6 proteins across divergent eukaryotes bind and stimulate
      N-myristoyltransferase enzymes while protecting them from acyl-CoA competitors.
    supporting_text: >-
      The human ankyrin-repeat-containing ACBD6 protein supports the reaction catalyzed by
      the human and Plasmodium N -myristoyltransferase (NMT) enzymes. Likewise, the newly
      identified Plasmodium ACBD6 homologue regulates the activity of the NMT enzymes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; demonstrates evolutionary conservation of NMT regulation across
      eukaryotic soluble ACB+ANK proteins.
