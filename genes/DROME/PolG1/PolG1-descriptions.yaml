    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct that it is the catalytic subunit of the mtDNA polymerase.
      'Repair' is plausible by analogy to vertebrates but not shown in flies. Omits
      proofreading and paternal mtDNA elimination.
- source: Alliance_Automated
  text: Enables 3'-5'-DNA exonuclease activity; DNA-directed DNA polymerase activity;
    and nucleotide binding activity. Involved in DNA-templated DNA replication; sperm
    individualization; and sperm mitochondrion organization. Located in mitochondrial
    nucleoid. Part of gamma DNA polymerase complex. Used to study Alpers-Huttenlocher
    syndrome; autosomal dominant progressive external ophthalmoplegia with mitochondrial
    DNA deletions 4; and mitochondrial metabolism disease. Human ortholog(s) of this
    gene implicated in several diseases, including brain disease (multiple); liver
    disease (multiple); mitochondrial DNA depletion syndrome (multiple); mitochondrial
    myopathy (multiple); and ovarian disease (multiple). Orthologous to human POLG
    (DNA polymerase gamma, catalytic subunit).
