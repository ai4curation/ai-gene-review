- source: Alliance_Imported
  text: DNA polymerase gamma subunit 1 (PolG1) encodes the catalytic subunit of mitocondrial
    DNA polymerase gamma, which is responsible for the replication and repair of the
    mitochondrial genome.
  source_type: curated
  url: https://flybase.org/reports/PolG1.html
  source_id: FB:FBgn0004406
