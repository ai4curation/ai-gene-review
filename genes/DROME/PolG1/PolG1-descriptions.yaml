descriptions:
- source: UniProt
  text: As the catalytic component of the DNA polymerase gamma complex is involved
    in the replication of mitochondrial DNA (mtDNA) (PubMed:11917141, PubMed:15537632,
    PubMed:19924234, PubMed:28430993, PubMed:3095323, PubMed:7499423, PubMed:8798543).
    Has both 5'-3' DNA polymerase and a highly mispair-specific 3'-5' exonuclease
    activity (PubMed:15537632, PubMed:26554610, PubMed:2671990, PubMed:28430993, PubMed:7499423,
    PubMed:8798543). At the end of mtDNA replication DNA ends are ligated to produce
    a closed circular mtDNA molecule, its exonuclease activity is required for formation
    of these ligatable ends by preventing DNA synthesis from continuing past the 5'-end
    of downstream DNA into duplex DNA regions (PubMed:28430993). Does not possess
    DNA primase activity, does not catalyze strand displacement synthesis and does
    not contain a 5'-3' exonuclease activity to catalyze nick translation (PubMed:3095323).
    Important for promoting the elimination of paternal mitochondrial DNA during spermatogenesis,
    however its exact role in this function has not yet been identified and appears
    to be independent of its 3'-5'-exonuclease activity and only partially dependent
    on its DNA polymerase activity (PubMed:28318978).
