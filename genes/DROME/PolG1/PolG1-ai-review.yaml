id: Q27607
gene_symbol: PolG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: PolG1 (tamas) encodes the catalytic subunit of DNA polymerase gamma, the family A DNA polymerase
  that replicates the mitochondrial genome. With its accessory subunit PolG2 it forms a heterodimeric
  holoenzyme in the mitochondrial matrix that carries 5'-3' DNA polymerase and mispair-specific 3'-5'
  proofreading exonuclease activities and is stimulated by mtSSB. tamas mutants deplete mtDNA and are
  lethal, exonuclease-deficient alleles accumulate mtDNA point mutations and deletions, and disease-modelling
  alleles act as dominant negatives. In the testis Tamas also localizes to mtDNA nucleoids and is needed
  to eliminate paternal mitochondrial genomes during spermatid development, largely independently of its
  exonuclease.
