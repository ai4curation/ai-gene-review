suggested_questions:
- question: Why is nero associated with the ER, and does ER-proximal hypusination favour eIF5A function
    in translation of secretory or membrane proteins?
suggested_experiments:
- hypothesis: ER association of nero is required for its in vivo function.
  description: Map the ER-association determinant of nero, express a cytosol-restricted variant in nero
    mutant clones, and compare hypusinated eIF5A, cell size and autophagy markers to wild-type rescue.
  experiment_type: structure-function rescue
