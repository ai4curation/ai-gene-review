id: Q9V9U4
gene_symbol: nero
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: nero is the Drosophila deoxyhypusine hydroxylase (DOHH), a HEAT-repeat, non-heme diiron monooxygenase
  that catalyses the second and final step of eIF5A hypusination, hydroxylating the deoxyhypusine residue
  formed by Dhps to give mature hypusine. Nero is a peripheral protein on the cytoplasmic face of the
  endoplasmic reticulum. nero mutant cells are small, show reduced protein synthesis, altered proliferation
  and increased autophagy, phenotypes shared with eIF5A knockdown, and catalytically impaired nero fails
  to rescue them.
