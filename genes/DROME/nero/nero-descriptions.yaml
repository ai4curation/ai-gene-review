      on the ER, negatively regulates autophagy. Writes eEF5 for eIF5A.'
- source: Alliance_Automated
  text: Enables deoxyhypusine monooxygenase activity. Involved in peptidyl-hypusine
    biosynthetic process. Is extrinsic component of endoplasmic reticulum membrane.
    Is expressed in several structures, including anterior endoderm; anterior endoderm
    anlage; embryonic/larval midgut; embryonic/larval midgut primordium; and head
    mesoderm. Human ortholog(s) of this gene implicated in microcephaly. Orthologous
    to human DOHH (deoxyhypusine hydroxylase).
