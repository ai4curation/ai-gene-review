    overall_notes: Deoxyhypusine hydroxylation of eIF5A is correct; growth, protein
      synthesis and autophagy roles match the review. 'Essential for organismal viability'
      and a 'wide number of processes' are broad.
- source: Alliance_Imported
  text: nero (nero) encodes a deoxyhypusine hydroxylase enzyme that is required for
    the hypusination of eEF5 and is localized to the endoplasmic reticulum. It negatively
    regulates autophagy.
