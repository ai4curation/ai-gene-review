    - rubric: specificity
      score: 5
    overall_notes: 'Correct and compact: N-terminal palmitoylation of both Hh and
      Spitz, with the Spitz modification restricting diffusion.'
- source: Alliance_Automated
  text: Enables protein-cysteine S-palmitoyltransferase activity. Involved in several
    processes, including N-terminal peptidyl-L-cysteine N-palmitoylation; peptide
    hormone processing; and regionalization. Predicted to be located in cytosol and
    membrane. Predicted to be active in endoplasmic reticulum. Is expressed in adult
    head. Human ortholog(s) of this gene implicated in chondrodysplasia-pseudohermaphroditism
    syndrome. Orthologous to several human genes including HHAT (hedgehog acyltransferase).
  source_type: automated
  url: https://flybase.org/reports/rasp.html
