descriptions:
- source: UniProt
  text: Required in hedgehog (hh) expressing cells for production of appropriate signaling
    activity in embryos and in the imaginal precursors of adult tissues. Acts within
    the secretory pathway to catalyze N-terminal palmitoylation of Hh; this lipid
    modification is required for the embryonic and larval patterning activities of
    the Hh signal. Not required for Wg signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VZU2
  source_id: Q9VZU2
