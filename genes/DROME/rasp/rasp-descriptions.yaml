      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: N-terminal palmitoylation of Hh in the secretory pathway,
      required for Hh patterning activity, not needed for Wg. Omits Spitz.'
- source: Alliance_Imported
  text: rasp (rasp) encodes an acyltransferase enzyme that adds essential N-terminal
    palmitate modifications to the secreted signaling domains of the products of hh
    and spi. The modification of the product of spi appears to increase the local
    concentration of the ligand by restricting its diffusion.
  source_type: curated
  url: https://flybase.org/reports/rasp.html
  source_id: FB:FBgn0024194
  review:
