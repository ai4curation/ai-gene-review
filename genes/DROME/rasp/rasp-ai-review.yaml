  evidence_type: IDA
  original_reference_id: PMID:16459296
  qualifier: enables
  review:
    summary: Rasp promotes palmitate addition to the N-terminal cysteine of Spitz.
    action: ACCEPT
    reason: Experimental evidence that Rasp palmitoylates the N-terminal cysteine of Spitz. Caveat - GO:0019706
      strictly specifies transfer to a sulfur atom, whereas the stable Rasp/HHAT product is an amide to
      the alpha-amino group of the N-terminal cysteine (captured by GO:0018009); a transient S-palmitoyl
      intermediate followed by S-to-N shift has been proposed but is not established. The experimental
      curator annotation is accepted, but this term should not be propagated or used as the target of
      MODIFYs (the human HHAT review makes the same point and uses GO:0016409 for broader rows).
    supported_by:
    - reference_id: PMID:16459296
      supporting_text: In cultured cells, Rasp promotes palmitate addition to the N-terminal cysteine
        residue of Spitz
