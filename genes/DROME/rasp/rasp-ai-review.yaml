gene_symbol: rasp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rasp (also called Skinny hedgehog, Sightless or Central missing) is a multipass membrane-bound
  O-acyltransferase (MBOAT) family protein, the Drosophila ortholog of Hedgehog acyltransferase (HHAT).
  It acts in the secretory pathway of signal-producing cells to attach palmitate to the N-terminal cysteine
  of secreted ligands, producing an amide-linked N-palmitoyl cysteine. Rasp palmitoylates the cholesterol-
  modified Hedgehog signaling domain, a modification required for full Hedgehog activity, so rasp mutants
  have segment-polarity and imaginal disc patterning defects although Hedgehog is still produced and cholesterol-modified.
  Rasp also palmitoylates the N-terminal cysteine of the EGFR ligand Spitz, which tethers Spitz to the
  plasma membrane, restricts its diffusion and is required for its developmental functions. Rasp does
  not act on Wingless, which is acylated by the related enzyme Porcupine.
