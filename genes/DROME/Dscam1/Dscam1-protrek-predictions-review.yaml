description: >-
  ProTrek sequence-to-text retrieval for Dscam1, the hypervariable Drosophila cell adhesion molecule
  that mediates isoform-specific self-recognition. The top three calls map onto this review's core
  functions almost exactly: the two adhesion-mediator terms are absent from GOA and correspond to
  the review's third core molecular function, and rank 3 is the IDA/IMP-supported dendrite self-avoidance
  process. Rank 5 adds the annotated axon guidance receptor activity. The free-text channel independently
  returns the self-avoidance description at 19.3. Assessment: 1 correct novel (COR), 1 correct not
  novel (CNN), 1 less precise (LSP).
