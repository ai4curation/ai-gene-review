- source: Alliance_Automated
  text: Enables antigen binding activity; axon guidance receptor activity; and identical
    protein binding activity. Involved in several processes, including detection of
    mechanical stimulus involved in sensory perception of touch; nervous system development;
    and regulation of neuron projection development. Located in several cellular components,
    including axon; dendrite; and perikaryon. Is expressed in several structures,
    including adult head; dorsal pharyngeal muscle; embryonic/larval recurrent nerve;
    ganglia; and synaptic neuropil domain. Used to study Down syndrome and autism
    spectrum disorder. Orthologous to human DSCAM (DS cell adhesion molecule) and
    DSCAML1 (DS cell adhesion molecule like 1).
