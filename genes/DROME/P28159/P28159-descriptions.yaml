descriptions:
- source: UniProt
  text: Transcriptional regulator that plays a central role in Notch signaling, a
    signaling pathway involved in cell-cell communication that regulates a broad spectrum
    of cell-fate determinations (PubMed:10673509, PubMed:1617729, PubMed:21262215,
    PubMed:8674407). Binds directly the 5'-GTGRGAR-3' DNA consensus sequence, which
    is present in the regulatory region of several genes (PubMed:10673509). Acts as
    a transcriptional repressor when it is not associated with Notch proteins (PubMed:10673509).
    When associated with some Notch protein, it acts as a transcriptional activator
    that activates transcription of Notch target genes (PubMed:10673509). Required
    for transcription of Sim (PubMed:10673509). Specifically binds to the immunoglobulin
    kappa-type J segment recombination signal sequence (PubMed:1617729, PubMed:1617730,
    PubMed:1744127). Required for neurogenesis in imaginal disks (PubMed:1617730,
    PubMed:7813798). In the larval brain, might play a role as a transducer of Notch
    signaling during type II neuroblast development (PubMed:21262215). Also functions
    independently of the Notch pathway, in the development of the bristle sensory
    organ precursor cell (PubMed:12642500).
