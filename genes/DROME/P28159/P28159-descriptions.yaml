- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription activator activity,
    RNA polymerase II-specific; RNA polymerase II cis-regulatory region sequence-specific
    DNA binding activity; and histone acetyltransferase binding activity. Contributes
    to DNA-binding transcription repressor activity, RNA polymerase II-specific. Involved
    in several processes, including imaginal disc development; long-term memory; and
    regulation of transcription by RNA polymerase II. Located in cytoplasm and polytene
    chromosome. Part of CSL-Notch-Mastermind transcription factor complex and RNA
    polymerase II transcription repressor complex. Is active in nucleus. Is expressed
    in several structures, including anlage in statu nascendi; brain; larval imaginal
    tissue; sensory nervous system primordium; and somatic precursor cell. Used to
    study Adams-Oliver syndrome and alcohol use disorder. Human ortholog(s) of this
    gene implicated in Adams-Oliver syndrome 3 and dilated cardiomyopathy. Orthologous
    to human RBPJ (recombination signal binding protein for immunoglobulin kappa J
    region).
