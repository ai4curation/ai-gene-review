- term:
    id: GO:0001709
    label: cell fate determination
  evidence_type: TAS
  original_reference_id: PMID:15018932
  qualifier: involved_in
  review:
    summary: >-
      Su(H) TAS annotation to 'cell fate determination'. Su(H) is the CSL transcription factor of the
      Notch pathway, and its loss or misregulation alters this developmental process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Su(H) mediates Notch-dependent activation and Hairless-dependent default repression of Notch target
      genes in essentially every Notch-dependent developmental decision. The annotation is sound but describes
      a downstream developmental context rather than the core DNA-binding transcription factor activity;
      kept as non-core.
