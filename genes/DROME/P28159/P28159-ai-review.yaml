id: P28159
gene_symbol: Su(H)
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Su(H) (Suppressor of Hairless) encodes the Drosophila CSL (CBF1/RBP-J, Su(H), LAG-1) transcription factor,
  the DNA-binding effector of Notch signaling. It binds CSL sites (YGTGRGAA) through its N-terminal Rel-homology
  and beta-trefoil domains. In the absence of Notch signaling, Su(H) binds the adaptor/corepressor Hairless
  through its C-terminal domain; Hairless recruits Groucho and dCtBP to repress target genes (default
  repression), and other corepressors such as Insensitive and Ebi/SMRTER act in specific contexts. Upon
  Notch activation, the Notch intracellular domain binds Su(H) and recruits Mastermind, forming an activator
  complex that drives transcription of Enhancer of split complex genes, deadpan and other targets; Notch
  and Hairless compete for Su(H). Su(H) also has Notch-independent repressor functions, e.g. repression
  of sim in the embryo and promotion of sensory organ precursor development. Su(H) acts in essentially
  all Notch-dependent processes, including neurogenesis, sensory organ development, wing and leg patterning,
  hematopoiesis and memory.
