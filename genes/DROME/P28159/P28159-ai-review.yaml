suggested_questions:
- question: >-
    How widespread are Notch-independent (Hairless-dependent or Hairless-independent) repressor functions
    of Su(H), beyond sim repression and SOP development?
- question: >-
    Is the Su(H)-Lilliputian (super elongation complex) interaction direct, and should it be captured
    as coactivator binding on Su(H) or as DNA-binding transcription factor binding on Lilliputian?
suggested_experiments:
- description: >-
    Genome-wide Su(H) occupancy in Hairless-null versus Notch-activated tissue to separate default-repression
    sites from activation sites.
