suggested_questions:
- question: How is AGO3 loading restricted to sense piRNAs, and what mechanism lets AGO3 suppress homotypic
    Aub:Aub ping-pong independently of slicing?
suggested_experiments:
- experiment_type: In vitro reconstitution
  hypothesis: Krimper-mediated proximity of piRNA-loaded Aub and empty AGO3 is sufficient for direct handover
    of Aub cleavage products.
  description: Reconstitute Aub slicing with purified Krimper and unloaded methylated AGO3 and monitor
    AGO3 loading of the 3 cleavage fragment.
