core_functions:
- description: 'Sense-piRNA-guided slicer of the ping-pong cycle: cleaves antisense piRNA precursor/cluster
    transcripts in nuage to generate Aub-bound antisense secondary piRNAs, amplifying transposon-targeting
    piRNA pools.'
