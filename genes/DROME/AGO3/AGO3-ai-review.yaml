id: Q7PLK0
gene_symbol: AGO3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Argonaute 3 (AGO3) is a cytoplasmic PIWI-clade Argonaute of the Drosophila germline that
  localizes to perinuclear nuage. It binds predominantly sense-strand piRNAs (adenine at position 10)
  generated by Aubergine slicing of transposon transcripts, and its own slicer activity cleaves antisense
  piRNA-cluster transcripts to produce new antisense piRNAs for Aub, completing the ping-pong amplification
  cycle. Recruitment with Aub into a Krimper-scaffolded complex depends on symmetric arginine dimethylation
  of its N-terminus. AGO3 slicing is essential for piRNA amplification and transposon silencing in ovaries
  and testes, and AGO3 also restrains homotypic Aub:Aub ping-pong.
