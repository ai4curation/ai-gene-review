- source: Alliance_Imported
  text: Argonaute 3 (AGO3) encodes a germline-specific Argonaute/Piwi family protein,
    which interacts with Piwi-interacting RNAs (piRNAs) to form effector complexes.
    It exhibits piRNA-guided RNA cleavage activity required for both piRNA amplification
    and transposon silencing, thereby securing germline development.
