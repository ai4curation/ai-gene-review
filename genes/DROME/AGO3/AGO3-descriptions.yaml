- source: Alliance_Automated
  text: Enables RNA endonuclease activity producing 5'-phosphomonoesters, hydrolytic
    mechanism and piRNA binding activity. Involved in secondary piRNA processing and
    transposable element silencing by piRNA-mediated mRNA destabilization. Located
    in cytoplasm. Is active in P granule. Is extrinsic component of mitochondrial
    outer membrane. Is expressed in female germline cyst; germarium; and germline
    cell. Orthologous to several human genes including PIWIL2 (piwi like RNA-mediated
    gene silencing 2).
