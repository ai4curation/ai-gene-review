descriptions:
- source: UniProt
  text: Component of the perinuclear meiotic nuage, a germline- specific subcellular
    membraneless ribonucleoprotein compartment involved in production of transposable
    element-repressing Piwi- interacting RNA (piRNA)-induced silencing complexes (piRISCs),
    which are essential for maintaining germline integrity during oogenesis (PubMed:22303351,
    PubMed:26295961). Acts via the Piwi-interacting RNA (piRNA) metabolic process,
    which mediates the repression of transposable elements during meiosis by forming
    complexes composed of piRNAs and Piwi proteins and governs the methylation and
    subsequent repression of transposons (PubMed:17322028, PubMed:17346786, PubMed:19395009,
    PubMed:20980675). Piwi protein that directly binds piRNAs, a class of 24 to 30
    nucleotide RNAs that are generated by a Dicer-independent mechanism and are primarily
    derived from transposons and other repeated sequence elements (PubMed:17322028,
    PubMed:17346786, PubMed:26212455, PubMed:26295961). Associates predominantly with
    sense piRNAs that contain adenine at nucleotide 10, but shows no preference for
    uridine at the 5' end (PubMed:17322028, PubMed:17346786, PubMed:26212455). Shows
    RNA cleavage or slicer activity (PubMed:17322028). Together with Piwi protein
    aub recruited to subregions of the perinuclear nuage by krimp, which coordinates
    their activity in the ping-pong amplification step of secondary piRNA biogenesis
    (PubMed:26295961, PubMed:34210982). Krimp recruits piRNA bound aub and unbound
    AGO3, bringing them into close proximity to facilitate the loading onto AGO3 of
    freshly cut piRNAs generated by aub cleavage of target sequences; krimp recognizes
    the piRNA loading state of the Piwi proteins via symmetrically dimethylated arginine
    modification in their N-terminus (PubMed:34210982). Important for asymmetric ping-pong
    amplification to bias production towards antisense piRNAs capable of silencing
    transposable elements (PubMed:19395009, PubMed:26212455). In testis, associates
    with Su(Ste) and AT-chX-1 piRNAs mostly produced from antisense precursors (PubMed:20980675).
    In the germline, acts to amplify pools of antisense piRNAs, among others Su(Ste),
    AT-chX-1 and roo, and to limit sense piRNA accumulation (PubMed:20980675). Forms
    a complex with smg, twin, aub and specific piRNAs that targets nos mRNA (and probably
    other maternal mRNAS) for deadenylation promoting its decay during early embryogenesis
    (PubMed:20953170). Involved in transposon silencing in the adult brain (PubMed:23559253).
