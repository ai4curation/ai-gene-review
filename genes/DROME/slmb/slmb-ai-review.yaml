id: A0A0B4KHK1
gene_symbol: slmb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Supernumerary limbs (Slimb, Slmb) is the Drosophila beta-TrCP ortholog, an F-box/WD40-repeat
  protein that serves as the substrate-recognition subunit of the SCF(Slimb) cullin-RING ubiquitin ligase
  (SkpA-Cul1-Roc1a-Slimb). Its N-terminal D (dimerization) domain and F-box bind SkpA, and its WD40 beta-propeller
  binds phosphodegrons created by kinases such as PKA, GSK3 and CK1 on substrates. SCF(Slimb) ubiquitinates
  these phosphorylated substrates for proteasomal degradation or, for the Hedgehog effector Cubitus interruptus
  (Ci), partial proteolysis to the Ci-75 repressor (using K11-linked chains). Through degradation of Ci
  and Armadillo/beta-catenin it restrains Hedgehog and Wingless signaling; other substrates include Plk4
  (centriole duplication), Cactus (Toll pathway), Relish (IMD pathway), Period and Timeless (circadian
  clock), Expanded and Kibra (Hippo pathway), aPKC/Par-6 (epithelial and oocyte polarity), Cap-H2 (condensin
  II), Gcm (gliogenesis) and Akt (dendrite pruning). It acts in the cytoplasm and nucleus.
