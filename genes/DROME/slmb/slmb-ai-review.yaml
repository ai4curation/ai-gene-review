suggested_questions:
- question: What determines whether SCF(Slimb)-ubiquitinated Ci-155 is partially processed to Ci-75 versus
    completely degraded, beyond K11 linkage and Ter94 recruitment?
- question: Should the many substrate-specific developmental outputs of Slimb (oogenesis, polarity, glia,
    pruning) be captured as process annotations on Slimb, or only on the regulated pathways via has_input
    on the SCF(Slimb) activity?
suggested_experiments:
- hypothesis: Different slmb isoforms or D-domain dimerization states select distinct substrate sets.
  description: Express D-domain dimerization mutants and isoform-specific Slimb variants in slmb null
    clones and quantify Ci, Arm, Plk4 and Expanded turnover by quantitative proteomics.
