core_functions:
- description: 'Slimb is the WD40 F-box substrate receptor of SCF(Slimb): its F-box binds SkpA and its
    WD40 propeller recognizes CK1/GSK3/PKA-generated phosphodegrons, bridging phosphorylated substrates
    (Ci, Armadillo, Plk4, Cactus, Expanded, Kibra, Per/Tim, Akt) to the Cul1-Roc1a catalytic core.'
