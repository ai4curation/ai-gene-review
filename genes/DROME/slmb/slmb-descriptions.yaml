descriptions:
- source: Alliance_Imported
  text: supernumerary limbs (slmb) encodes an essential, conserved F-box protein and
    a component of the SCF (Skp/Cullin/F-box) E3 ubiquitin-ligase, providing substrate
    specificity to the SCF. It negatively regulates multiple signaling pathways and
    cellular processes by promoting the proteasome-mediated degradation or cleavage
    of its targets, including the products of arm and ci (Wg and Hh signaling), SAK,
    per and Cap-H2.
  source_type: curated
