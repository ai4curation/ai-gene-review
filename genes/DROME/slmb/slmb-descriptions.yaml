- source: Alliance_Automated
  text: Enables beta-catenin destruction complex binding activity; phosphoprotein
    binding activity; and ubiquitin-like ligase-substrate adaptor activity. Involved
    in several processes, including negative regulation of signal transduction; oogenesis;
    and regulation of cell cycle process. Part of SCF ubiquitin ligase complex. Is
    expressed in several structures, including antennal anlage; anterior endoderm
    anlage; follicle cell; ganglia; and organism subdivision. Used to study Menkes
    disease. Human ortholog(s) of this gene implicated in eye disease. Orthologous
    to several human genes including BTRC (beta-transducin repeat containing E3 ubiquitin
    protein ligase).
  source_type: automated
