descriptions:
- source: UniProt
  text: Required for activation of NF-kappaB transcription factors in the immune deficiency
    (Imd) signaling cascade which is essential for innate immune responses upon infection
    by Gram-negative bacteria (PubMed:16894030, PubMed:17068333). Promotes cytoplasmic
    cleavage of Rel and its translocation to the nucleus where it drives expression
    of antimicrobial peptides (PubMed:17068333, PubMed:24374974). Binds, polyubiquitinates
    and activates Dredd which is required for Rel- mediated induction of antimicrobial
    peptides (PubMed:22549468). Anti- apoptotic protein which binds, ubiquitinates
    and inactivates the effector caspase Drice (PubMed:18166655). Suppresses rpr and
    hid- dependent cell death in the eye (PubMed:8548811). However, has also been
    shown to have little, if any, role in the regulation of the canonical caspase-dependent
    apoptosis pathway (PubMed:17068333). Plays a role in regulating the expression
    of ion channels (PubMed:24374974).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24307
