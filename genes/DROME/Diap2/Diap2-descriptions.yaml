- source: Alliance_Automated
  text: Enables several functions, including cysteine-type endopeptidase inhibitor
    activity; cysteine-type endopeptidase inhibitor activity involved in apoptotic
    process; and enzyme binding activity. Involved in several processes, including
    defense response to bacterium; positive regulation of biosynthetic process of
    antibacterial peptides active against Gram-negative bacteria; and protein polyubiquitination.
    Located in nucleus and perinuclear region of cytoplasm. Is expressed in Malpighian
    tubule. Human ortholog(s) of this gene implicated in several diseases, including
    X-linked lymphoproliferative syndrome 2; breast cancer; carcinoma (multiple);
    extranodal marginal zone lymphoma of mucosa-associated lymphoid tissue; and prostate
    cancer. Orthologous to several human genes including XIAP (X-linked inhibitor
    of apoptosis); BIRC2 (baculoviral IAP repeat containing 2); and BIRC3 (baculoviral
    IAP repeat containing 3).
