- source: Alliance_Imported
  text: Death-associated inhibitor of apoptosis 2 (Diap2) encodes a protein with ubiquitin
    E3-ligase activity that functions in the Imd pathway by conjugating the product
    of imd with K63-polyubiquitin chains.
