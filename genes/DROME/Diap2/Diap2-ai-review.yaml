core_functions:
- description: DIAP2 uses its RING E3 ligase activity to catalyze K63-linked ubiquitination of 
    Dredd, Imd, and Kenny in the cytoplasmic peptidoglycan/Imd pathway, enabling Relish activation 
    and antimicrobial-peptide gene induction after Gram-negative bacterial challenge.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0061057
    label: peptidoglycan recognition protein signaling pathway
  - id: GO:0070534
    label: protein K63-linked ubiquitination
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:20122400
    supporting_text: DIAP2 is the E3 for IMD K63-Ubiquitination in vivo
    reference_section_type: RESULTS
  - reference_id: PMID:22549468
    supporting_text: DIAP2 promoted the conjugation of K63-linked Ub chains on DREDD
    reference_section_type: RESULTS
  - reference_id: PMID:30026495
    supporting_text: K63-linked ubiquitin chains conjugated to Kenny by DIAP2
    reference_section_type: ABSTRACT
  - reference_id: PMID:34262145
    supporting_text: Unrestrained Diap2 drives Imd sigalling by ubiquitinating Imd, Dredd and Kenny
    reference_section_type: RESULTS
proposed_new_terms: []
suggested_questions:
- question: Which endogenous DIAP2 substrates besides Dredd, Imd, and Kenny are ubiquitinated during
    acute systemic infection versus chronic gut exposure to commensal peptidoglycan?
- question: Does endogenous DIAP2 restrain apoptotic DrICE in a defined developmental or stress 
    context, or is the DrICE branch mainly an overexpression and sensitized-stress activity 
    secondary to the IMD-pathway role?
- question: What mechanism links Diap2 to Malpighian-tubule ion-channel expression, and does that 
    epithelial branch require DIAP2 RING activity on the same substrates used in fat-body IMD 
    signaling?
suggested_experiments:
- hypothesis: DIAP2 uses separable BIR2/BIR3 and RING interfaces to place K63-linked ubiquitin on 
    distinct Imd-pathway substrates in vivo.
  description: Generate endogenous Diap2 alleles that selectively disrupt Dredd/Imd binding or the 
    RING E2 interface, infect larvae and adults with Ecc15 or stimulate dissected guts with DAP-type
    peptidoglycan, and quantify ubiquitin remnants on Dredd, Imd, and Kenny together with Relish 
    cleavage and AMP transcript induction.
  experiment_type: endogenous separation-of-function allelic series with ubiquitin-remnant 
    proteomics
- hypothesis: The DIAP2-DrICE covalent-trapping branch limits sublethal DrICE activity without being
    sufficient to replace DIAP1 as the canonical apoptosis inhibitor.
  description: Introduce DIAP2 Asp100 and BIR3 point mutants at the endogenous locus and compare 
    basal gut inflammation, SCAT3 DrICE reporter activity, x-ray sensitization, and canonical 
    developmental apoptosis against wild-type and RING-mutant rescue alleles.
  experiment_type: structure-guided endogenous mutant rescue with live caspase reporters
