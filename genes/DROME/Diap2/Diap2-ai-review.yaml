id: Q24307
gene_symbol: Diap2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Diap2 encodes Drosophila inhibitor of apoptosis protein 2, a cytoplasmic and contextual
  nuclear BIR-domain RING E3 ubiquitin ligase that acts mainly in the Imd innate immune pathway downstream
  of peptidoglycan recognition. Its RING-dependent K63-linked ubiquitination of IMD-pathway components
  including Dredd, Imd, and Kenny promotes Relish/NF-kappaB activation and antimicrobial peptide induction
  after Gram-negative bacterial challenge; DIAP2 can also bind and ubiquitinate the effector caspase DrICE,
  raising the apoptotic threshold without serving as the essential canonical caspase brake performed by
  DIAP1.'
