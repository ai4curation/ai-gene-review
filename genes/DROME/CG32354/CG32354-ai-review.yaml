suggested_questions:
- question: Is the hydrophobic segment at residues 57-78 an uncleaved signal anchor (type II membrane
    protein) or a cleaved internal signal peptide that releases the Kazal array as a secreted protein?
- question: Do any of the Kazal-like domains with K/R at the predicted P1 position (386, 457, 509, 612)
    inhibit trypsin-like serine proteases, or does CG32354 instead bind growth factors as its paralog
    Fs does?
suggested_experiments:
- description: Express epitope-tagged CG32354 in S2 cells or imaginal discs and test surface exposure
    versus secretion (non-permeabilized staining, medium immunoblot) to resolve topology.
- description: Test recombinant Kazal-domain fragments against a panel of serine proteases (trypsin, chymotrypsin,
    elastase, fly immune proteases) to establish or exclude inhibitory activity.
