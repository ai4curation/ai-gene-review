core_functions:
- description: Uncharacterized extracellular-facing protein carrying an array of seven follistatin/Kazal-like
    domains, probably anchored in the membrane by a single N-terminal hydrophobic segment. Its molecular
    activity (protease inhibition, growth-factor binding or another extracellular interaction) has not
    been determined.
