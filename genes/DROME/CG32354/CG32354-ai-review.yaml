taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG32354 (FlyBase FBgn0052354; current UniProt gene name CG7159) encodes an uncharacterized
  662-residue Drosophila protein built from seven follistatin/Kazal-like cysteine-rich domains preceded
  by a single hydrophobic segment (residues 57-78) and no N-terminal signal peptide, suggesting a membrane-anchored
  protein with an extracellular Kazal-domain array, though its topology has not been tested. It belongs
  to the arthropod-specific PANTHER subfamily PTHR10913:SF79 of the follistatin-related family; its nearest
  characterised relatives are the fly follistatin Fs (a paralog from an arthropod-level duplication) and,
  more distantly, the human co-orthologs SPINK5 and TMEFF1/2. No target-specific biochemical, genetic
  or localization study exists; the only literature report places it among Spitz-responsive genes expressed
  in the peripodial epithelium of the eye imaginal disc. Whether its Kazal domains inhibit serine proteases,
  bind growth factors, or play another extracellular role is unknown.
existing_annotations:
- term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000400195
  review:
    action: UNDECIDED
    summary: Serine-type endopeptidase inhibitor activity is a plausible but untested hypothesis from
      the Kazal-domain architecture; phylogenetic evidence does not support transfer.
    reason: The IEA comes from a UniRule assignment triggered by Kazal-type domain signatures. The domains
      are of the follistatin-type Kazal (KAZAL_FS) class, which in follistatin, agrin and TMEFF proteins
      mostly lacks protease-inhibitory activity. In the PANTHER 19 tree the only PAINT assertion of GO:0004867
      in PTHR10913 is placed on PTN000099251 (Theria, seed SPINK5), not on any ancestor of CG32354, so
      PAINT curators deliberately did not propagate inhibitor activity to the Ecdysozoa clade. The seven
      predicted reactive-bond sites carry mixed P1 residues (P, T, S, K, K, R, R), and UniProt cautions
      that the rule lacks conserved residues for feature propagation. Some K/R P1 sites leave inhibition
      possible, so the claim is neither supported nor refuted; no assay exists.
