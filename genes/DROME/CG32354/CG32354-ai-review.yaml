  - UniProtKB:O95633
  - UniProtKB:P19883
  - UniProtKB:Q9NQ38
  - ZFIN:ZDB-GENE-030131-1033
  review:
    action: KEEP_AS_NON_CORE
    summary: Broad family-level developmental assertion inherited from the Eumetazoa duplication node;
      untested for CG32354 and non-core.
    reason: The earlier review left this UNRESOLVED because the cached PAINT slice gave PTN000099219 no
      taxon. The PANTHER 19 tree shows PTN000099219 is the Eumetazoa duplication node directly beneath
      the family root and is an ancestor of CG32354, so CG32354 lies inside the clade to which PAINT assigned
      cell differentiation. Its seeds include the fly paralogs CG12716 and anon-f, which share the Hexapoda-Crustacea
      duplication node with CG32354, and follistatin-family proteins from vertebrates. There is no target-specific
      evidence of loss or divergence, so the IBA is not removed. The term is very broad, CG32354 has no
      developmental assay, and the eye-disc expression screen shows only Spitz-responsive expression.
      It is therefore kept as non-core rather than accepted as a defined function.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000099219
        source_status: SUPPORTS_TRANSFER
        comment: Eumetazoa duplication node beneath the PTHR10913 root, on the Q9VSK1 path in the PANTHER
          19 tree; heterogeneous seeds including fly CG12716 and anon-f. Supports only a broad developmental
          role, no specific differentiation process.
    supported_by:
    - reference_id: file:DROME/CG32354/CG32354-bioinformatics/RESULTS-rereview.md
      supporting_text: PTN000099219 (Eumetazoa duplication, cell differentiation)
    - reference_id: PMID:17553483
