  review:
    action: KEEP_AS_NON_CORE
    summary: Extracellular localization of the Kazal-domain array is inherited from the family root and
      is consistent with the architecture, but the exact topology (membrane-anchored vs secreted) is unresolved.
    reason: 'PTN000099217 is the Eukaryota root of the PTHR10913 tree and an ancestor of CG32354 in the
      PANTHER 19 tree, so the IBA follows from a sound root-level placement: all characterised family
      members act outside the cell. CG32354 has no N-terminal signal peptide but a single predicted helix
      at 57-78, so it may be a signal-anchored membrane protein whose Kazal domains face the extracellular
      space rather than a freely secreted protein. Extracellular region is retained as the most precise
      location the evidence supports; plasma membrane or cell surface cannot be asserted without topology
      data. It is kept as non-core because it says nothing about the protein''s activity.'
