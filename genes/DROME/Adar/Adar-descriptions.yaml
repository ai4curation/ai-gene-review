descriptions:
- source: UniProt
  text: 'Has A-to-I RNA editing activity on extended dsRNA: edits RNA- binding protein Rnp4F. A-to-I editing
    of pre-mRNAs acts predominantly through nervous system targets to affect adult nervous system integrity,
    function and behavior. Essential for adaptation to environmental stresses, such as oxygen deprivation,
    and for the prevention of premature neuronal degeneration, through the editing of ion channels as
    targets.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NII1
  source_id: Q9NII1
