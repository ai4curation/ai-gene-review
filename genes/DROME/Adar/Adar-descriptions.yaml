- source: Alliance_Automated
  text: Enables double-stranded RNA adenosine deaminase activity. Involved in several processes, including
    RNA modification; locomotor rhythm; and negative regulation of BMP signaling pathway. Located in nucleolus.
    Is expressed in several structures, including adult head; amnioproctodeal invagination; brain; ectoderm
    anlage; and embryonic/larval gut. Human ortholog(s) of this gene implicated in microcephaly. Orthologous
    to human ADARB1 (adenosine deaminase RNA specific B1) and ADARB2 (adenosine deaminase RNA specific
    B2 (inactive)).
  source_type: automated
