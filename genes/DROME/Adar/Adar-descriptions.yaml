    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct on A-to-I editing of dsRNA, the nervous-system targets, hypoxia tolerance and
      neurodegeneration; the Rnp4F example rests on a paper that inferred dADAR editing without a mutant
      test. Omits the ADAR2 orthology, nuclear and nucleolar localization, auto-editing and the immune
      and editing-independent roles.
- source: Alliance_Imported
