id: Q9NII1
gene_symbol: Adar
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Adar encodes the single adenosine deaminase acting on RNA (ADAR) of Drosophila, an A-to-I
  RNA editing enzyme orthologous to vertebrate ADAR2 (ADARB1); insects have lost the ADAR1 gene. The
  protein has two double-stranded RNA binding domains (dsRBDs) followed by a zinc-containing deaminase
  domain. Adar binds double-stranded or hairpin regions of RNA and hydrolytically deaminates selected
  adenosines to inosines, which the ribosome and splicing machinery read as guanosines. Editing is largely
  cotranscriptional and takes place in the nucleus, where Adar is diffusely nucleoplasmic, enriched in
  the nucleolus and concentrated in extra-nucleolar foci. Adar edits hundreds of transcripts, most of
  them encoding ion channels, receptors and other proteins of synaptic transmission, and it also edits
  primary microRNA transcripts of the let-7 complex, changing their processing by Drosha. Adar edits its
  own transcript near the active site (Ser to Gly), producing a less active enzyme in a negative feedback
  loop that tunes editing levels. Editing rises sharply at metamorphosis and in the adult nervous system;
  null mutants are viable but adults show uncoordinated locomotion, temperature-sensitive paralysis,
  tremor, altered circadian and courtship behaviour, increased neuronal excitability, hypersensitivity
  to hypoxia and heat, and age-dependent neurodegeneration. Editing of endogenous dsRNA also prevents
  Dicer-2-dependent induction of innate immune genes, and Adar has editing-independent roles in
  suppressing neurodegeneration and R-loop accumulation. Adar is also expressed in male germline stem
  cells and spermatocytes, where it is needed for normal early spermatogenesis. Transfer RNA A37 inosine
  is made by a separate enzyme, Adat1.'
