  review:
    summary: Cytoplasm inherited from the family root PTN000098822, seeded by human and mouse ADAR1, mouse
      Adad2 and worm adr-1 and adr-2.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'IBA verdict: not supported for fly Adar. Cytoplasm is not a root organelle term. The node
      is the eukaryotic root, and the vertebrate seeds are ADAR1-clade proteins, whose cytoplasmic activity
      belongs to the interferon-inducible ADAR1 p150 isoform; insects have lost ADAR1, and fly Adar is
      the ADAR2 ortholog, whose vertebrate member (ADARB1) is not a seed. The worm seeds are mainly nuclear,
      and ADR-2 is mislocalized when its nuclear partner ADBP-1 is lost. Every fly observation places Adar
      in the nucleus and nucleolus, editing is cotranscriptional, and only nuclear human ADAR forms substitute
      for it in flies. No fly isoform has been reported in the cytoplasm (PubMed searches recorded in the
      notes). Not REMOVE, because a minor cytoplasmic pool, as reported for worm ADR-2 in adbp-1 mutants,
      has not been excluded.'
