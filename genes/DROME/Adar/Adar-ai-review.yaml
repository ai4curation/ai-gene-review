- term:
    id: GO:0008251
    label: tRNA-specific adenosine deaminase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G01760
  - FB:FBgn0028658
  - PANTHER:PTN000098822
  review:
    summary: tRNA-specific adenosine deaminase activity inherited from the PTHR10910 root node PTN000098822,
      seeded by Arabidopsis TAD1 and fly Adat1.
    action: REMOVE
    reason: 'IBA verdict: not inherited; the node placement over-propagates an ADAT1 function to the ADARs.
      Both seeds are ADAT1-type tRNA A37 deaminases: Arabidopsis TAD1 in the Bikont clade, and fly Adat1,
      which PANTHER 19 places inside the ADAR2 clade as a Drosophila-specific duplicate of Adar, although
      InterPro assigns it (Q9V3R6) to PTHR46516 with human ADAT1. Placing the IBD at the eukaryotic root
      with losses only on three single leaves makes every animal ADAR inherit tRNA deamination. ADARs and
      ADATs probably share an ancestor, but the activities have separated: fly ADAT1 is the tRNA A37 deaminase
      and has no activity on dsRNA, human ADAT1 does not edit ADAR substrates, and fly Adar is a dsRBD-containing
      editase whose substrates are dsRNA and pre-mRNA. No assay of fly Adar, or of any animal ADAR, on tRNA
      was found. This is not a weak measured activity but an activity with no evidence at all, in an organism
      with a dedicated enzyme for the reaction, so REMOVE.'
    supported_by:
    - reference_id: PMID:10629039
      supporting_text: The enzyme has no activity on dsRNA substrates but is a tRNA deaminase with specificity
        for adenosine 37 of insect alanine tRNA.
    - reference_id: PMID:10430867
      supporting_text: It does not modify adenosines residing in double-stranded RNA or in pre-mRNAs that
        serve as substrates for ADAR1 or ADAR2.
    - reference_id: PMID:10917596
      supporting_text: Partially purified dADAR expressed in Pichia pastoris has robust nonspecific A-to-I
        deaminase activity on synthetic dsRNA substrates.
    - reference_id: file:DROME/Adar/Adar-bioinformatics/RESULTS.md
      supporting_text: With the IBD at the root and no loss on the ADAR1 or ADAR2 clades, every animal ADAR
        (human ADAR and ADARB1, worm adr-2, fly Adar) inherits a tRNA deaminase activity that no ADAR has
        been shown to have.
    - reference_id: file:DROME/Adar/Adar-notes.md
      supporting_text: No paper found that assays fly Adar (or any animal ADAR) on tRNA (PubMed "Drosophila
        Adar tRNA", 3 hits, none an assay; see Sources).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000098822
        source_label: PTHR10910 root (Eukaryota)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IBD at the root with losses only on three leaves; no loss on the ADAR1 or ADAR2 clades.
      - source_id: AGI_LocusCode:AT1G01760
        source_label: Arabidopsis TAD1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: ADAT1-type tRNA A37 deaminase in the Bikont clade PTN007471815.
      - source_id: FB:FBgn0028658
        source_label: fly Adat1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The fly tRNA A37 deaminase (PMID:10629039); PANTHER 19 nests it beside Adar, InterPro
          assigns it to PTHR46516 with human ADAT1.
      residue_claims_not_applicable: The argument is a separation of substrate classes between the ADAT1
        and ADAR lineages, not a change at a point residue.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000098822
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0008251
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: 'The GO:0008251 tRNA-specific adenosine deaminase activity IBD at PTN000098822, the Eukaryota
        root of PTHR10910, is seeded by AT1G01760 (Arabidopsis TAD1) and FBgn0028658 (fly Adat1), both
        ADAT1-type tRNA A37 deaminases. With losses only on three leaves (worm adr-1 PTN000099132, fly cg12493
        PTN001331203, a Tribolium gene PTN004208710), the IBD gives IBA rows for tRNA deamination to every
        animal ADAR, including human ADAR and ADARB1 and fly Adar, none of which has been shown to act on
        tRNA. Fly ADAT1 has no dsRNA activity (PMID:10629039) and human ADAT1 does not edit ADAR substrates
        (PMID:10430867). In the PANTHER 19.0 tree fly Adat1 is a leaf of the ADAR2 clade (duplication node
        PTN007471810 with Adar and cg12493), while InterPro''s HMM assigns Q9V3R6 to PTHR46516 (tRNA-specific
        adenosine deaminase 1) with human ADAT1, so the tree placement of this seed may itself be a PANTHER
        artefact. Alternatives: place the IBD on the Bikont TAD1 node PTN007471815 and on the Adat1 leaf only,
        or add an IRD on the metazoan ADAR clades once Adat1 is moved out of them. Raised from the fly Adar
        leaf after reading the PTHR10910 tree and IBD.gaf (19.0, 2026-08-28) and the ADAT abstracts; the
        same rows reach human ADAR and ADARB1. The GO:0006396 RNA processing IBD on the same node shares
        the two seeds but is true of ADARs, so it is not disputed.'
      supported_by:
      - reference_id: PMID:10629039
        supporting_text: The enzyme has no activity on dsRNA substrates but is a tRNA deaminase with specificity
          for adenosine 37 of insect alanine tRNA.
      - reference_id: PMID:10430867
        supporting_text: It does not modify adenosines residing in double-stranded RNA or in pre-mRNAs that
          serve as substrates for ADAR1 or ADAR2.
