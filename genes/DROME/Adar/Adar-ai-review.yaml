  review:
    summary: RNA processing inherited from PTN000098822, seeded by ADARs and by the tRNA deaminases Adat1
      and Arabidopsis TAD1.
    action: KEEP_AS_NON_CORE
    reason: Broad but true for fly Adar, and the ADAR seeds alone support it. Editing alters pre-mRNAs
      cotranscriptionally, intronic editing is linked to splicing, and editing of let-7-C primary transcripts
      changes their processing by Drosha. GO places adenosine to inosine editing under RNA modification,
      not under RNA processing, so no asserted term entails this one; it is kept as non-core context for
      the editing function. Unlike the tRNA deaminase row from the same node, the claim does not depend
      on the ADAT1 seeds.
    supported_by:
    - reference_id: PMID:24561617
      supporting_text: For example, a single A-to-I change at the -6 residue of pri-miR-100, the first miRNA
        in this let-7-C polycistronic transcript, leads to enhanced miRNA processing by Drosha and consequently
        enhanced functional miR-100 both in vitro as well as in vivo.
    - reference_id: PMID:22658416
      supporting_text: These intronic sites occur preferentially within introns that are poorly spliced cotranscriptionally,
        suggesting a link between editing and splicing.
