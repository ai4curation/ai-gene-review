suggested_questions:
- question: Does fly Adar act on any substrate in the cytoplasm, for example to keep dsRNAs below the
    Dicer-2 sensing threshold, or is all of its innate-immune function explained by nuclear editing of
    transcripts that are later exported?
- question: Should the PAINT IBD for GO:0008251 tRNA-specific adenosine deaminase activity be moved from
    the PTHR10910 root (PTN000098822) to the plant TAD1 clade and the Adat1 leaf, and is the placement of
    fly Adat1 inside the ADAR2 clade a PANTHER tree artefact, given that InterPro assigns it to PTHR46516?
- question: How does Adar suppress R-loops without editing, and does this editing-independent activity
    use the dsRBDs, the deaminase domain as an RNA-binding module, or partners?
- question: What is the basis of the FlyBase statement that Adar is involved in glucose metabolism?
suggested_experiments:
- description: Tag endogenous Adar isoforms (alternative N-termini and the exon 3a spacer) and image them
    with nuclear-export inhibition or in stressed neurons, to test whether any isoform shuttles to the cytoplasm.
- description: Assay recombinant dADAR on in vitro transcribed fly tRNA-Ala and measure A37 inosine in
    total tRNA of Adar null and Adat1 mutant flies, to test formally whether Adar contributes any tRNA
    deamination.
- description: Map Adar occupancy at R-loop-prone loci (CUT&Tag or DRIP after Adar knockdown) in wild-type
    and E374A flies to separate the RNA-binding from the catalytic contribution to R-loop suppression.
