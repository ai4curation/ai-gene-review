core_functions:
- description: Double-stranded RNA adenosine deaminase (A-to-I editase) that binds duplex regions of
    pre-mRNAs and pri-miRNAs through its two dsRBDs and deaminates selected adenosines to inosine,
    cotranscriptionally in the nucleus, recoding mainly nervous-system transcripts (ion channels and
    synaptic proteins) and editing its own transcript to tune its activity.
  molecular_function:
    id: GO:0003726
    label: double-stranded RNA adenosine deaminase activity
  directly_involved_in:
  - id: GO:0006382
    label: adenosine to inosine editing
  - id: GO:0016556
    label: mRNA modification
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:10917596
    supporting_text: Partially purified dADAR expressed in Pichia pastoris has robust nonspecific A-to-I
      deaminase activity on synthetic dsRNA substrates.
  - reference_id: PMID:10966106
    supporting_text: Correspondingly, all known Drosophila site-specific RNA editing (25 sites in three ion
      channel transcripts) is abolished.
  - reference_id: PMID:22658416
    supporting_text: We conclude that ADAR-mediated editing is more widespread than previously indicated
      and largely occurs cotranscriptionally.
