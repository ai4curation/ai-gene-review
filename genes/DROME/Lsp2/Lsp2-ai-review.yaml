suggested_questions:
- question: Should GO:0005616 larval serum protein complex be broadened (or a sibling term created) so
    that the LSP-2 homohexamer can be captured, given that the current definition covers only the LSP-1
    alpha/beta/gamma heterohexamer?
- question: What is the function of Lsp2 expression in the adult fat body and head, after the larval store
    has been consumed?
suggested_experiments:
- description: Lsp2-specific knockout with quantification of adult tissue growth and lipid/amino acid
    reserves, to separate the Lsp2 contribution from the combined Lsp1/Lsp2 knockdown phenotypes.
