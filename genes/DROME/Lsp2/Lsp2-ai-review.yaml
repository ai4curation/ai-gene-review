description: Lsp2 encodes larval serum protein 2 (LSP-2), a hexamerin storage protein of Drosophila melanogaster
  belonging to the arthropod hemocyanin/phenoloxidase superfamily. Unlike LSP-1, which is a heterohexamer
  of alpha, beta and gamma subunits, LSP-2 is a homohexamer of a single subunit that is more distantly
  related to the LSP-1 chains. It is synthesized by the fat body and secreted into the larval hemolymph,
  then retrieved into the fat body around pupariation as a reserve of amino acids for adult development;
  Lsp2 is also expressed in the adult fat body. Fat-body knockdown of storage proteins (together with
  Lsp1alpha) alters the allocation of amino acids between early- and late-forming organs and reduces adult
  fitness.
