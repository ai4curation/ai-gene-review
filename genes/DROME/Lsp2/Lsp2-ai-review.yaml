- term:
    id: GO:0005616
    label: larval serum protein complex
  evidence_type: IDA
  original_reference_id: PMID:6804227
  qualifier: part_of
  review:
    summary: Peptide mapping comparing LSP-1 subunits and LSP-2.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005616 is defined as "A multisubunit protein complex which, in Drosophila, is a heterohexamer
      of three subunits, alpha, beta and gamma." ComplexPortal CPX-2224 (Larval serum protein complex)
      lists exactly Lsp1alpha, Lsp1beta and Lsp1gamma as members, and ComplexPortal annotated GO:0005616
      by IPI to these three chains only. The 1980 study compared LSP-2 with the LSP-1 subunits by peptide
      mapping and found them homologous but distinct; it does not show LSP-2 in the alpha/beta/gamma heterohexamer.
      LSP-2 forms its own homohexameric serum protein, which the current definition does not cover.
    supported_by:
    - reference_id: PMID:6804227
      supporting_text: These observations show that the LSP-1 subunits are more closely related to each
        other than any is to LSP-2
      reference_section_type: ABSTRACT
