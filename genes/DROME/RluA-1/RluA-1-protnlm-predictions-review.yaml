    summary: The pseudouridine-synthesis prediction is correct. The published alignment of the exact
      Q9VKV0 protein shows that the conserved motif I residues and the residues needed for catalysis are
      retained, so the protein can be expected to carry out the RluA-family isomerization. The gene already
      carries this exact term in GOA, so the prediction is not novel. It is broader than the tRNA
      pseudouridine synthesis process supported by the gene's RPUSD2 subfamily placement, but that
      process is not yet an existing annotation on the gene, and the rRNA process term it does carry is
      an over-propagation; LSP therefore does not apply. The fly protein's endogenous substrates remain
      untested.
    supported_by:
