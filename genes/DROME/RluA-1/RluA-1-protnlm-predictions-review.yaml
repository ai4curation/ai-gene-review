      supporting_text: Each of the fully conserved non-catalytic residues (i.e., motif I, Figure 1A) and
        critical residues thought to be important for catalysis (asterisks, Figure 1A) are conserved in
        both RluA-1 and RluA-2.
    - reference_id: PMID:33028630
