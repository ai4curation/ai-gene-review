  review:
    action: ACCEPT
    summary: tRNA Psi32 formation is the activity conserved across the characterized RPUSD2 subfamily, to
      which RluA-1 belongs; it is accepted as the best-supported specific activity.
    reason: The EC mapping itself stems from an ARBA-derived name, which is not evidence. The claim rests
      instead on evolutionary placement. RluA-1 is in PANTHER subfamily PTHR21600:SF40 together with yeast
      Rib2/Pus8 and Pus9 and human RPUSD2. Rib2 (cytoplasmic) and Pus9 (mitochondrial) are each required for
      tRNA Psi32, and human RPUSD2 forms Psi32 in mitochondrial tRNAs and other anticodon-loop Psi.
      Conservation of this activity across fungi and mammals, together with the retained catalytic residues
      in RluA-1, supports transferring it within the subfamily. The fly tRNA substrates, and whether RluA-1
      and RluA-2 split cytosolic and mitochondrial targets, have not been tested.
    supported_by:
    - *yeast32
    - reference_id: PMID:41136621
      supporting_text: Compared with bacterial RluA, eukaryotic RPUSD2 has lost its activity towards rRNAs,
        while its function on tRNA Ψ32 is well maintained.
