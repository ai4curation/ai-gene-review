    summary: Psi31 is a minor, tRNA-specific outcome of RPUSD2-subfamily specificity, seen so far only for
      one human mitochondrial tRNA.
    reason: Human RPUSD2 modifies the first unpaired uridine of the anticodon loop, which is position 31 in
      mt-tRNALeu(CUN) but position 32 in most substrates. Psi31 activity is therefore plausible for an SF40
      enzyme but is a subsidiary consequence of the Psi32-type specificity and has no fungal or fly
      experimental counterpart. It is kept as non-core.
