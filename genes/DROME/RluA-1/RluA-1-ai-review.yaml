  review:
    action: NEW
    summary: An endogenous GFSTF exon-trap fusion of RluA-1 localizes to nuclei of larval sensory neurons.
    reason: The GFSTF (GFP exon-trap) cassette was inserted into a coding intron of the endogenous RluA-1
      gene, so the signal reports the protein's location, unlike the membrane-targeted mCD8::GFP used with
      the RluA-1-GAL4 expression reporter. Nuclear localization fits a tRNA modification enzyme acting on
      pre-tRNAs, as human RPUSD2 does, though nuclear residence of a tagged protein in one cell type does
      not exclude other compartments.
