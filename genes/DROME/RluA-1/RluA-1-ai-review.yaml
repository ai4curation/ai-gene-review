- term:
    id: GO:1904057
    label: negative regulation of sensory perception of pain
  evidence_type: IMP
  original_reference_id: PMID:33028630
  review:
    action: NEW
    summary: Loss of RluA-1 in nociceptors causes thermal and mechanical hyperalgesia, with null alleles
      and cDNA rescue supporting the locus assignment. RluA-1 therefore restrains nociceptive sensitivity;
      this does not identify the RNA target linking its enzymatic function to behavior.
    reason: Loss of RluA-1 in nociceptors causes thermal and mechanical hyperalgesia, with null alleles
      and cDNA rescue supporting the locus assignment. RluA-1 therefore restrains nociceptive sensitivity;
      this does not identify the RNA target linking its enzymatic function to behavior.
    supported_by:
    - reference_id: PMID:33028630
      supporting_text: Tissue-specific RNAi, genetic null mutant, and cDNA rescue experiments all indicate
        that loss of the RluA-1 gene from whole animals, or specifically from nociceptors, results in
        hyperalgesia.
