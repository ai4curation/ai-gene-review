  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: rRNA pseudouridylation is an ancestral bacterial RluA-family activity that the eukaryotic
      RPUSD2 subfamily, which contains RluA-1, does not appear to retain.
    reason: The IBA is placed at the deep node PTN002727951, whose rRNA-acting donors are mainly bacterial
      RluA/RluC/RluD/RsuA/RluE/RluF (several in other PANTHER subfamilies or even the separate PTHR47683
      family) and yeast mitochondrial Pus5 (SF81). RluA-1 sits in PANTHER subfamily PTHR21600:SF40 (RPUSD2),
      and every experimentally characterized SF40 member modifies tRNA rather than rRNA. Yeast Rib2/Pus8 and
      Pus9 form Psi32 in cytoplasmic and mitochondrial tRNAs, and human RPUSD2 acts on tRNA anticodon-loop
      positions 31, 32 and 34; the human tRNA Psi mapping study concludes that eukaryotic RPUSD2 has lost
      activity towards rRNA. No rRNA modification has been reported for RluA-1. The term is therefore
      likely an over-propagation from a node deeper than the RPUSD2 branch, but it is not removed because
      the fly protein itself has not been tested.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002727951
        comment: Deep RluA-family node spanning bacterial RluA/RluC/RluD and RPUSD-type eukaryotic
          subfamilies. rRNA pseudouridylation is experimentally grounded in bacterial and yeast Pus5
          branches, but the RPUSD2 subfamily (SF40) containing RluA-1 has diverged to tRNA substrates
          and human RPUSD2 lacks rRNA activity, so the rRNA process should not be inherited by SF40.
    supported_by:
