gene_symbol: RluA-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: RluA-1 (CG31719) encodes a 739-residue stand-alone pseudouridine synthase of the RluA family
  in Drosophila melanogaster, with a C-terminal RsuA/RluA-like catalytic domain (residues ~385-531,
  catalytic Asp428) preceded by a long, partly disordered N-terminal extension. It belongs to the eukaryotic
  RPUSD2 subfamily (PANTHER PTHR21600:SF40), whose characterized members in yeast (Pus9, Rib2/Pus8) and
  human (RPUSD2) isomerize the first unpaired uridine of the tRNA anticodon loop, chiefly position 32
  (and 31 or 34 in some tRNAs), and have lost the ancestral bacterial RluA activity on rRNA. Drosophila
  has two members of this subfamily, RluA-1 and RluA-2. RluA-1 is expressed specifically in larval peripheral
  sensory neurons, where an endogenously tagged protein is nuclear; its own RNA substrates have not been
  mapped. Loss of RluA-1 from nociceptors causes thermal and mechanical hypersensitivity and hyperbranched
  class IV dendrites, phenotypes whose link to a particular modified RNA is unknown.
