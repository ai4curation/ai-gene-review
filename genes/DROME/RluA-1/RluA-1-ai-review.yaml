- id: PMID:41136621
  title: A comprehensive tRNA pseudouridine map uncovers targets dependent on human stand-alone pseudouridine
    synthases.
  findings:
  - statement: Human RPUSD2 (SF40) modifies the first unpaired anticodon-loop uridine of tRNAs and has
      lost the bacterial RluA rRNA activity.
    supporting_text: Compared with bacterial RluA, eukaryotic RPUSD2 has lost its activity towards rRNAs,
