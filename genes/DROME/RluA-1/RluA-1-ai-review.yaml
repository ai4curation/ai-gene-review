- id: PMID:33028630
  title: Loss of Pseudouridine Synthases in the RluA Family Causes Hypersensitive Nociception in Drosophila.
  full_text_unavailable: false
  findings:
  - statement: RluA-1 retains the conserved RluA-family catalytic motifs; the alignment explicitly uses
      Q9VKV0 together with human/mouse RPUSD2 and yeast Rib2/Pus9.
    supporting_text: 'RluA-1-PABC_Dm: Q9VKV0, RluA-2-PC_Dm: Q9VKU8, RUSD2_Hs: Q8IZ73'
  - statement: An endogenous GFSTF exon trap localizes RluA-1 to sensory-neuron nuclei.
    supporting_text: a GFP exon trap for RluA-1 protein localized to the nuclei of these neurons.
  - statement: Loss of RluA-1 causes hyperalgesia rescued by nociceptor cDNA expression, and hyperbranched
      class IV dendrites; the RNA target mediating these phenotypes is unknown.
    supporting_text: Tissue-specific RNAi, genetic null mutant, and cDNA rescue experiments all indicate
      that loss of the RluA-1 gene from whole animals, or specifically from nociceptors, results in hyperalgesia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the only primary study of fly RluA-1. Provides conservation, localization
      and phenotype data, but no biochemical or RNA-mapping data.
