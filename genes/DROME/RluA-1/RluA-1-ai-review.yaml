suggested_questions:
- question: Which tRNAs (cytosolic or mitochondrial) carry RluA-1-dependent pseudouridine in Drosophila
    sensory neurons, and do RluA-1 and RluA-2 split substrates as yeast Rib2 and Pus9 do?
- question: Is the nociceptive hypersensitivity and dendrite hyperbranching of RluA-1 mutants caused
    by loss of a tRNA modification, an mRNA modification, or a non-catalytic role? Phenotype-based process
    terms (e.g. negative regulation of sensory perception of pain) were not proposed because the gene's
    contribution may be indirect.
suggested_experiments:
- description: Map pseudouridine (e.g. BID-seq or PRAISE) in tRNA and poly(A) RNA from wild-type, RluA-1,
    RluA-2 and double-mutant larvae, and test catalytic-dead (D428A) RluA-1 for rescue of nociceptive
    hypersensitivity.
