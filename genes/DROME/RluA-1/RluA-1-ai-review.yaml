id: Q9VKV0
gene_symbol: RluA-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: RluA-1 is a nuclear RluA-family pseudouridine synthase expressed in Drosophila sensory neurons.
  Its conserved catalytic domain supports site-specific conversion of RNA uridine to pseudouridine, although
  the endogenous RNA substrates and modified positions remain unknown. RluA-1 restrains nociceptive sensitivity
  and influences sensory-neuron dendrite architecture.
