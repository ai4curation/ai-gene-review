core_functions:
- description: Stand-alone RluA-family pseudouridine synthase of the RPUSD2 subfamily that isomerizes
    the first unpaired uridine of the tRNA anticodon loop (chiefly U32); activity inferred from conserved
    catalytic residues and subfamily-wide experimental data, with fly tRNA substrates not yet mapped.
