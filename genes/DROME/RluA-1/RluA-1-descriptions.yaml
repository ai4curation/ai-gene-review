      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: States mRNA pseudouridylation and tRNA positions 31, 32 and 34
      in cytosolic and mitochondrial tRNAs as facts. The review infers the U32 tRNA
      activity only from the RPUSD2 subfamily, and fly substrates have not been mapped.
- source: Alliance_Imported
  text: RluA pseudouridine synthase 1 (RluA-1) encodes a pseudouridine synthase, an
    enzyme catalyzing the formation of the most abundant nucleoside modification of
    RNA, pseudouridine.
