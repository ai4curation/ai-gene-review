descriptions:
- source: UniProt
  text: Pseudouridine synthase that catalyzes pseudouridylation of mRNAs. In addition,
    it catalyzes the formation of pseudouridine mainly at positions 31 and 32 in the
    anticodon loop of cytosolic and mitochondrial tRNAs, and at position 34 of certain
    cytosolic tRNAs such as tRNA(Ile).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VKV0
  source_id: Q9VKV0
  review:
    reviewer: AI
    rubrics:
