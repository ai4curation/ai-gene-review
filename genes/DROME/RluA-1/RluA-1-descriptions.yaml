      no neuronal phenotype.'
- source: Alliance_Automated
  text: Predicted to enable pseudouridine synthase activity. Predicted to be involved
    in enzyme-directed rRNA pseudouridine synthesis. Is expressed in several structures,
    including adult central brain; adult optic lobe; dorsal pharyngeal muscle cell;
    embryonic/larval dorsal vessel; and sensory neurons. Orthologous to human RPUSD2
    (RNA pseudouridine synthase domain containing 2).
