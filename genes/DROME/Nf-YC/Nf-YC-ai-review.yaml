gene_symbol: Nf-YC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nf-YC is the histone-fold subunit C of the Drosophila CCAAT-binding factor NF-Y. It heterodimerizes
  with Nf-YB, and the dimer recruits Nf-YA to form the heterotrimer that binds CCAAT boxes in target promoters.
  Nf-YC is expressed in all photoreceptors; in R7 neurons NF-YC is required to repress the R8 transcription
  factor Senseless late in differentiation, so that R7 axons target the correct medulla layer, and NF-Y
  is also needed for R7 differentiation.
