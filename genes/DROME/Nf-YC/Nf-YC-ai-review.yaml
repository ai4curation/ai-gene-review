suggested_questions:
- question: Is repression of senseless in R7 a direct effect of NF-Y binding to the sens locus, and which
    R7-specific cofactors convert NF-Y into a repressor there?
suggested_experiments:
- description: Map NF-Y occupancy at the senseless locus in sorted R7 cells and test CCAAT-box mutations
    in a sens reporter for derepression in R7.
