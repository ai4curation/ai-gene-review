core_functions:
- description: Histone-fold subunit that heterodimerizes with Nf-YB and, with Nf-YA, forms the NF-Y heterotrimer
    that binds CCAAT boxes and regulates Pol II transcription, including repression of senseless in R7
    photoreceptors.
