id: Q24475
gene_symbol: rpr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'rpr encodes Reaper, a short Drosophila IAP antagonist that promotes apoptotic caspase activation by
  binding DIAP1 through an N-terminal IAP-binding motif, inhibiting DIAP1 survival functions, and stimulating UbcD1-dependent
  DIAP1 autoubiquitination and degradation. A GH3 helical region mediates phospholipid-dependent mitochondrial outer-membrane
  association and multimerization with Reaper/Hid/Grim family partners, increasing the efficiency of IAP turnover
  in developmental, steroid-triggered, and DNA-damage-induced apoptosis contexts.'
