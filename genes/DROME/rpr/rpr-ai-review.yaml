proposed_new_terms: []
suggested_questions:
- question: Which endogenous DIAP1 substrates are selected for Reaper-dependent autoubiquitination versus 
    neddylation or nondegradative ubiquitination during normal developmental apoptosis?
- question: Does DIAP2 binding measurably buffer Reaper in any apoptotic tissue, or is Reaper-DIAP2 binding 
    incidental relative to the genetically dominant Reaper-DIAP1 axis?
- question: How do the GH3 helix, Hid-dependent mitochondrial recruitment, and phospholipid binding combine at
    endogenous expression levels in salivary-gland, midgut, and neuroblast apoptosis?
suggested_experiments:
- hypothesis: Reaper requires distinct IBM and GH3 surfaces to couple DIAP1 binding to DIAP1 ubiquitin 
    transfer in vivo.
  description: Generate endogenous rpr alleles that separately disrupt the N-terminal IAP-binding motif, the 
    GH3 lipid/Hid interface, and the self-association residues mapped by Sandu et al.; measure DIAP1 
    ubiquitination, DIAP1 turnover, DrICE/Dronc activity, and developmental apoptosis in embryos, larval 
    midgut, salivary gland, and neuroblast lineages.
  experiment_type: structure-guided endogenous separation-of-function allele series with ubiquitin-remnant 
    proteomics and live caspase reporters
- hypothesis: dBruce restrains Reaper abundance through IBM- and GH3-dependent direct ubiquitination without 
    changing the DIAP1-bound Reaper pool.
  description: Tag endogenous Reaper, compare wild-type and lysine-deficient Reaper in dBruce catalytic 
    mutants, and quantify Reaper abundance, non-lysine ubiquitin conjugates, and DIAP1 occupancy after 
    developmental and genotoxic induction of apoptosis.
  experiment_type: endogenous epitope tagging with ubiquitin-site proteomics
