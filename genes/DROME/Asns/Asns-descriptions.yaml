- source: Alliance_Imported
  text: Asparagine synthetase (Asns) encodes a cytosolic enzyme that catalyzes the
    transfer of the amino group of L-glutamine to L-aspartate to produce L-asparagine
    and L-glutamate. It is the main enzyme involved in L-asparagine biosynthesis.
