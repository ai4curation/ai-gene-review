suggested_questions:
- question: Is the intestinal stem cell phenotype of Asns knockdown due to asparagine shortage per se,
    or to altered aspartate/glutamine balance and downstream nutrient signalling?
suggested_experiments:
- description: Express a catalytically dead Asns (active-site Cys1 mutant) in Asns-knockdown intestinal
    stem cells to test whether the rescue requires enzymatic activity.
