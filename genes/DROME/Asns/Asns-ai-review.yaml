taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Asns (CG33486) encodes the Drosophila glutamine-dependent asparagine synthetase, a class
  II (Ntn-type) glutamine amidotransferase with an N-terminal glutaminase domain and a C-terminal synthetase
  domain. It transfers the amide nitrogen of L-glutamine to L-aspartate in an ATP-dependent reaction,
  producing L-asparagine, L-glutamate, AMP and diphosphate, and is the only route of de novo asparagine
  synthesis in the fly. The enzyme is cytosolic. In the adult midgut, knockdown of Asns in intestinal
  stem cells lowers asparagine levels and causes age-like stem-cell overproliferation and intestinal dysfunction
  that are rescued by dietary asparagine.
