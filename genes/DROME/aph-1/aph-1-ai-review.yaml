suggested_questions:
- question: Does Drosophila, which has a single aph-1 gene, use alternative aph-1 isoforms to tune gamma-secretase
    substrate preference in the way mammalian APH1A and APH1B complexes differ?
suggested_experiments:
- hypothesis: Aph-1 transmembrane residues contacting Presenilin are required for holoprotein stabilisation
    but separable from substrate selectivity.
  description: Express aph-1 point mutants in an aph-1 null background in vivo and measure Psn holoprotein
    levels, Notch S3 cleavage, and cleavage of non-Notch substrates.
