id: Q9VQG2
gene_symbol: aph-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: aph-1 encodes the Drosophila anterior pharynx-defective 1 protein, a seven-transmembrane
  subunit of gamma-secretase, the intramembrane aspartyl protease complex formed with Presenilin (Psn),
  Nicastrin (Nct) and pen-2. Aph-1 acts as an assembly scaffold that associates with Nicastrin and stabilises
  the Presenilin holoprotein within the nascent complex before pen-2-dependent endoproteolytic activation.
  As a required subunit of gamma-secretase, aph-1 is needed for the intramembrane cleavage of ligand-activated
  Notch that releases the Notch intracellular domain and for gamma-secretase cleavage of other type I
  membrane proteins such as human APP expressed in fly cells.
