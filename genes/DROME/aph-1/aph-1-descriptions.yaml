- source: Alliance_Automated
  text: Predicted to enable protein-macromolecule adaptor activity. Involved in amyloid-beta
    formation; membrane protein proteolysis; and protein stabilization. Located in
    late endosome and recycling endosome. Part of gamma-secretase complex. Human ortholog(s)
    of this gene implicated in coronary artery disease and human immunodeficiency
    virus infectious disease. Orthologous to human APH1A (aph-1A gamma-secretase subunit)
    and APH1B (aph-1B gamma-secretase subunit).
