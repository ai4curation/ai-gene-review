descriptions:
- source: UniProt
  text: Essential subunit of the gamma-secretase complex, an endoprotease complex
    that catalyzes the intramembrane cleavage of integral membrane proteins such as
    Notch. It probably represents a stabilizing cofactor for the presenilin homodimer
    that promotes the formation of a stable complex.
  source_type: curated
