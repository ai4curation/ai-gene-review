- source: Alliance_Imported
  text: anterior pharynx defective 1 (aph-1) encodes a scaffolding subunit of the
    gamma-secretase complex together with the products of Psn, Nct and pen-2. It is
    involved in several Notch related processes such as differentiation, cellular
    organization and developmental patterning via gamma-secretase proteolitic function.
  source_type: curated
