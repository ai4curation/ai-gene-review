suggested_questions:
- question: Does GEN resolve Holliday junctions in vivo in Drosophila (e.g. contribute to mitotic crossovers or
    to resolution of recombination intermediates, GO:0071140), or are 5' flaps and simpler branched structures its
    main physiological substrates, as its much faster flap cleavage suggests?
- question: 'How is GEN access to chromatin regulated in flies: is it excluded from interphase nuclei and released
    at nuclear envelope breakdown as for human GEN1, and how can the earlier nuclear immunostaining in embryos be
    reconciled?'
- question: The UniProt Q9VRJ0 FUNCTION text states that DmGEN does not cleave Holliday junction substrates; should
