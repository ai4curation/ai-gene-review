taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Gen (DmGEN, mus324) encodes the Drosophila ortholog of human GEN1 and yeast Yen1, a member of the
  XPG/RAD2 family of Mg2+-dependent structure-selective endonucleases (GEN/class IV subfamily) with closely spaced
  XPG-N and XPG-I nuclease domains, an H3TH DNA-binding region and a chromodomain-like region. Purified Gen cleaves
  5'' flaps (preferring blocked flaps), the lagging strand of replication-fork-like structures, splayed arms, and
  Holliday junctions, which it cuts symmetrically to give ligatable nicked duplexes after dimerizing on the junction;
  it also has a weak nick-dependent 5''-3'' exonuclease activity. In flies Gen is the principal structure-selective
  nuclease for DNA damage tolerance: mutants are strongly hypersensitive to alkylating, crosslinking and replication-blocking
  agents and to ionizing radiation, with MUS81-MMS4 acting as a backup, and Gen becomes essential in the absence
  of the BLM or FANCM helicases. In interphase cells the protein appears largely cytoplasmic, as reported for its
  human ortholog, although nuclear staining was reported in early embryos.'
