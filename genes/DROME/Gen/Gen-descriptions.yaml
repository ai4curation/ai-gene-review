      score: 3
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 5
    overall_notes: Specific on 5'-flap and blocked-flap cleavage and weak exonuclease,
      but says Gen does not cleave Holliday junctions, which the review contradicts
      (symmetric HJ resolution after dimerization).
