id: Q9VK45
gene_symbol: mTor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'mTor (Target of rapamycin, TOR) is the single Drosophila TOR kinase, a ~280 kDa PI3K-related
  serine/threonine protein kinase with N-terminal HEAT repeats, FAT, FRB (FKBP12-rapamycin binding), kinase
  and FATC domains. It is the catalytic subunit of two complexes: TORC1, with Raptor, which integrates
  amino acid, energy and insulin/Rheb inputs to promote protein synthesis, ribosome biogenesis and cell
  growth (via S6K and 4E-BP/Thor) and to suppress autophagy; and TORC2, with Rictor, Sin1 and Lst8, which
  phosphorylates the hydrophobic motif of Akt (Ser505, equivalent to human Ser473) and Tricornered kinase,
  and regulates cell growth and dendritic tiling. TOR self-associates into multimers. Through TORC1 it
  controls cell and organismal size, the starvation-induced autophagy response, nutrient-dependent developmental
  decisions (for example the mitotic-to-meiotic switch in ovarian cysts), RNA polymerase III output and
  lifespan; reduced TOR signaling extends lifespan.'
