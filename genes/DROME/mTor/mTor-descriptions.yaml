- source: Alliance_Automated
  text: Enables chromatin DNA binding activity and protein kinase activity. Involved
    in several processes, including cell surface receptor protein tyrosine kinase
    signaling pathway; negative regulation of catabolic process; and positive regulation
    of cellular component biogenesis. Located in cytoplasm. Part of TORC1 complex
    and TORC2 complex. Is expressed in adult head. Human ortholog(s) of this gene
    implicated in several diseases, including diabetes mellitus (multiple); epilepsy;
    kidney disease (multiple); lung disease (multiple); and prostate cancer. Orthologous
    to human MTOR (mechanistic target of rapamycin kinase).
