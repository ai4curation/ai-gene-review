descriptions:
- source: UniProt
  text: Core histone-binding subunit that may target chromatin assembly factors, chromatin
    remodeling factors and histone deacetylases to their histone substrates in a manner
    that is regulated by nucleosomal DNA. Component of several complexes which regulate
    chromatin metabolism. These include the chromatin assembly factor 1 (CAF-1) complex,
    which is required for chromatin assembly following DNA replication and DNA repair;
    the nucleosome remodeling and deacetylase complex (the NuRD complex), which promotes
    transcriptional repression by histone deacetylation and nucleosome remodeling;
    the nucleosome remodeling factor (NURF) complex, which catalyzes ATP-dependent
    nucleosome sliding and facilitates transcription of chromatin; and the polycomb
    group (PcG) repressor complex ESC-E(Z), which promotes repression of homeotic
    genes during development. Also required for transcriptional repression of E2F
    target genes by E2f2 and Rbf or Rbf2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24572
