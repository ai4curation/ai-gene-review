    - rubric: specificity
      score: 3
    overall_notes: Correct but covers only the MuvB core; omits CAF-1, NURF and PRC2
      despite the gene name.
- source: Alliance_Automated
  text: Enables histone binding activity; histone deacetylase binding activity; and
    transcription cis-regulatory region binding activity. Contributes to nucleosome
    binding activity. Involved in several processes, including DNA replication-dependent
    chromatin assembly; nucleosome organization; and regulation of gene expression.
    Located in chromatin; nucleus; and polytene chromosome. Part of CAF-1 complex
    and nucleus. Is expressed in several structures, including adult head; embryonic/larval
    midgut primordium; ganglia; germline cell; and head epidermis primordium. Used
    to study azoospermia. Human ortholog(s) of this gene implicated in X-linked spermatogenic
    failure 9. Orthologous to several human genes including RBBP4 (RB binding protein
    4, chromatin remodeling factor).
