- source: Alliance_Imported
  text: Chromatin assembly factor 1, p55 subunit (Caf1-55) encodes a subunit of the
    MuvB core complex. The MuvB core binds to the oncoprotein encoded by Myb and the
    Rbf-E2f2-Dp tumor suppressor complex, thereby controlling the expression of many
    genes, including critical regulators of the cell cycle.
  source_type: curated
  url: https://flybase.org/reports/Caf1-55.html
  source_id: FB:FBgn0263979
