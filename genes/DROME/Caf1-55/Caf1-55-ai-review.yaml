- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:15545624
  qualifier: involved_in
  review:
    summary: Caf1-55 is a subunit of Myb-MuvB/dREAM and PRC2, which repress RNA polymerase II target genes.
    action: ACCEPT
    reason: Members of the Myb-MuvB complex, including p55, corepress developmentally regulated genes;
      p55 is also an integral PRC2 subunit. Negative regulation of Pol II transcription is a legitimate
      process role of this shared scaffold subunit.
    supported_by:
    - reference_id: PMID:15545624
      supporting_text: Members of the Myb-MuvB complex were localized to promoters and were shown to corepress
        transcription of developmentally regulated genes
