- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IDA
  original_reference_id: PMID:30208321
  qualifier: enables
  review:
    summary: Annotation based on promoter occupancy of the MRT-NURF repressor at plin1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Caf1-55 is a WD40 histone-binding protein with no sequence-specific DNA-binding domain; promoter
      occupancy reflects recruitment by the SANT-domain protein MRT, which is the factor shown to bind
      the plin1 promoter. The cis-regulatory binding molecular function is better attributed to MRT.
    supported_by:
    - reference_id: PMID:30208321
      supporting_text: MRT binds to the promoter of plin1, the gene encoding the LD-resident protein perilipin,
        and inhibits the transcription of plin1
