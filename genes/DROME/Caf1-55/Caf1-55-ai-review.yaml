suggested_questions:
- question: How is the limited cellular pool of Caf1-55 partitioned among CAF-1, NURF, PRC2, NuRD, SIN3
    and dREAM, and does competition between complexes regulate any of them in vivo?
- question: Does Caf1-55 act as a CENP-A (CID) assembly chaperone in vivo, as suggested by the CID-H4-RbAp48
    complex reconstituted in vitro?
suggested_experiments:
- description: Complex-selective separation-of-function Caf1-55 mutants (for example in the Su(z)12-binding
    edge versus the H3-tail pocket) tested for H3K27me3, CAF-1 chromatin assembly and NURF-dependent transcription
    in imaginal disc clones.
