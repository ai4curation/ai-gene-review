id: Q24572
gene_symbol: Caf1-55
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Caf1-55 (p55, Nurf55, Caf1) is the single Drosophila ortholog of human RBBP4/RBBP7 (RbAp48/46),
  a seven-bladed WD40 beta-propeller histone-binding protein that serves as a shared histone-targeting
  module of many chromatin complexes. Its propeller binds the N-terminal tail of histone H3 on its top
  face and helix 1 of histone H4 on its side, a site that overlaps the binding site for the PRC2 subunit
  Su(z)12. Caf1-55 is an integral subunit of the replication-coupled H3-H4 chaperone CAF-1, the ATP-dependent
  nucleosome remodeling factor NURF, the Polycomb repressive complex 2 (ESC/E(Z)), the NuRD remodeling-deacetylase
  complex, SIN3/RPD3 deacetylase complexes, the Myb-MuvB/dREAM repressor complex and its testis-specific
  paralog tMAC, the Ash1 histone methyltransferase complex, and a CENP-A (CID)-H4 assembly complex. Through
  these complexes it supports chromatin assembly, nucleosome remodeling, Polycomb silencing of homeotic
  genes and transcriptional repression of E2F targets, and it is essential for cell survival and segment
  identity during development.
