taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Shmt (CG3011) encodes the single Drosophila serine hydroxymethyltransferase (EC 2.1.2.1),
  a pyridoxal 5'-phosphate-dependent tetrameric enzyme that reversibly converts L-serine and tetrahydrofolate
  into glycine and 5,10-methylene-tetrahydrofolate, supplying one-carbon units for purine, thymidylate
  and methionine/S-adenosylmethionine synthesis. Alternative transcripts encode a long isoform with an
  N-terminal mitochondrial presequence and a shorter cytoplasmic isoform, so the one gene covers the mitochondrial
  and cytosolic functions split between SHMT2 and SHMT1 in vertebrates; a minor nuclear pool associates
  with the nuclear lamina. Maternal Shmt catalytic activity is essential for the last syncytial nuclear
  cycle before the midblastula transition, and glycine synthesis in circadian pacemaker neurons contributes
  to normal free-running period.
