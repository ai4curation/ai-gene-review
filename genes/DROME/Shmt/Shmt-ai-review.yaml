core_functions:
- description: PLP-dependent serine hydroxymethyltransferase that interconverts L-serine and glycine while
    transferring the hydroxymethyl one-carbon unit to tetrahydrofolate, producing 5,10-methylene-THF for
    the folate cycle; the single fly gene supplies both cytoplasmic and mitochondrial isoforms, with a
    minor nuclear pool.
