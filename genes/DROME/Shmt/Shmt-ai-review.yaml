suggested_questions:
- question: Which SHMT-dependent metabolite (thymidylate, purines or S-adenosylmethionine) becomes limiting
    in interphase 13 of Shmt germline-clone embryos?
- question: Do the mitochondrial and cytoplasmic Shmt isoforms have separable developmental requirements,
    given that flies have only one SHMT gene?
suggested_experiments:
- hypothesis: Thymidylate (dTMP) depletion causes the interphase-13 arrest of Shmt mutant embryos.
  description: Inject Shmt germline-clone embryos with thymidine, formate or hypoxanthine and score progression
    through mitosis 13 and cellularization, combined with targeted nucleotide metabolomics.
- hypothesis: Mitochondrial and cytoplasmic Shmt isoforms are each sufficient for embryonic viability.
  description: Rescue Shmt nulls with genomic transgenes in which the alternative start codons are mutated
    to express only the long (mitochondrial) or short (cytoplasmic) isoform.
