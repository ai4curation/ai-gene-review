    overall_notes: 'Correct: PLP enzyme making glycine and 5,10-methylene-THF, a major
      one-carbon source. Adds a predicted carnitine biosynthesis step, which the review
      keeps as non-core.'
- source: Alliance_Automated
  text: Enables glycine hydroxymethyltransferase activity. Involved in several processes,
    including L-serine catabolic process; behavioral response to ethanol; and glycine
    biosynthetic process. Located in cytoplasm and nucleus. Is expressed in several
    structures, including adult head; adult heart; embryonic/larval midgut; embryonic/larval
    midgut primordium; and somatic trunk mesoderm derivative. Used to study alcohol
    use disorder; amino acid metabolic disorder; and cancer. Human ortholog(s) of
    this gene implicated in breast cancer and neurodevelopmental disorder with cardiomyopathy,
    spasticity, and brain abnormalities. Orthologous to several human genes including
    SHMT1 (serine hydroxymethyltransferase 1).
