- source: Alliance_Imported
  text: Serine hydroxymethyl transferase (Shmt) encodes a conserved pyridoxal phosphate-containing
    enzyme that converts serine into glycine and N5,N10-methylentetrahydrofolate.
    This reaction represents a major source for activated C1 units and tetrahydrofolate-mediated
    C1 metabolism. Shmt is also predicted to catalyze the cleavage of 3-hydroxy-trimethyllysine
    into 4-(trimethylamino)butanal and glycine, the second step of carnitine biosynthesis.
  source_type: curated
  url: https://flybase.org/reports/Shmt.html
  source_id: FB:FBgn0029823
