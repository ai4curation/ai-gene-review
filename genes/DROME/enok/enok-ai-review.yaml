suggested_questions:
- question: Does the Enok complex's effect on PCNA unloading require its acetyltransferase activity, and
    if so what is acetylated (histones, PCNA or Elg1)?
suggested_experiments:
- description: Rescue Enok-depleted S2 cells with wild-type or catalytically dead Enok and measure chromatin-bound
    PCNA and G1/S progression, to test whether acetyltransferase activity is needed to restrain Elg1-mediated
    PCNA unloading.
