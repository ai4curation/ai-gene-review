gene_symbol: enok
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: enok (enoki mushroom) encodes the Drosophila KAT6 (MOZ/MORF) family MYST histone acetyltransferase.
  It is the catalytic subunit of the Enok complex, which also contains the bromodomain-PHD scaffold Br140
  (BRPF homolog), the ING-family protein Ing5 and Eaf6. Enok is the main enzyme that acetylates histone
  H3 at lysine 23 (H3K23ac) in flies, and all complex subunits are needed for full activity. The complex
  binds the Elg1 PCNA-unloader complex and restrains PCNA unloading from chromatin to promote the G1/S
  transition. Enok acetylation activates transcription of specific genes; in the ovary it promotes expression
  of rhino and recruitment of Rhino to piRNA clusters, supporting piRNA production and transposon silencing.
  enok mutants arrest mushroom body neuroblast proliferation, and Enok is required in the germline and
  in niche cells to maintain female germline stem cells.
