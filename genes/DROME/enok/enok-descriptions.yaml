- source: Alliance_Imported
  text: enoki mushroom (enok) encodes a MYST family histone acetyltransferase that
    acetylates lysine residues on histones, including H3K23, to regulate gene transcription.
    It contributes to stem cell self-renewal, oogenesis and neural development.
