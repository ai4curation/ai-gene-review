- source: Alliance_Automated
  text: Enables histone H3K23 acetyltransferase activity. Involved in several processes,
    including female germ-line stem cell population maintenance; nervous system development;
    and positive regulation of DNA-templated transcription. Part of MOZ/MORF histone
    acetyltransferase complex. Is expressed in spermatozoon; wing hinge primordium;
    and wing pouch. Human ortholog(s) of this gene implicated in several diseases,
    including Ohdo syndrome, SBBYS variant; acute myeloid leukemia; bipolar disorder;
    intellectual disability (multiple); and leiomyoma. Orthologous to several human
    genes including KAT6B (lysine acetyltransferase 6B).
