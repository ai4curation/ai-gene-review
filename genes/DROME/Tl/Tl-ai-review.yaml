suggested_questions:
- question: Toll-1 ectodomain was reported to co-precipitate VSV virions (Chowdhury et al. 2019), whereas
    Toll served as a non-binding specificity control for VSV and RVFV in two other studies. Can direct
    binding be tested with purified components (e.g. SPR with Toll ectodomain and VSV-G), and does any
    virus activate Toll independently of Spätzle?
- question: Should GO represent that Drosophila Toll is not a pattern recognition receptor more explicitly,
    for example by a taxon-appropriate check that prevents GO:0038187 or GO:0002224-branch terms from
    propagating to Spätzle-activated Tolls by IBA or InterPro2GO?
- question: Is the effect of Toll on insulin signalling best captured as negative regulation of insulin
    receptor signaling, given that the block is at Pdk1-dependent Akt phosphorylation downstream of PIP3?
suggested_experiments:
- description: Surface plasmon resonance or bio-layer interferometry of purified Toll ectodomain against
    purified VSV-G and RVFV glycoproteins, with Toll-7 ectodomain as positive control, to resolve the
    conflicting virion co-precipitation data.
- description: VSV infection of spz null and Tl null flies side by side, with drosomycin readout, to test
    whether any antiviral contribution of Toll is Spätzle-independent.
