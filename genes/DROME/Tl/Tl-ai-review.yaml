  review:
    summary: Toll-1 ectodomain co-precipitated VSV virions in vitro, and VSV activated AMP promoters in
      S2 cells expressing Toll-1.
    action: UNDECIDED
    reason: 'Directly contradicted by two independent experiments from another lab that used Toll as the
      specificity control: Toll did not precipitate with VSV (Nakamoto et al. 2012) or with RVFV (Moy
