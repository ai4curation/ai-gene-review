- term:
    id: GO:0004896
    label: cytokine receptor activity
  evidence_type: IMP
  original_reference_id: PMID:12872120
  qualifier: enables
  review:
    summary: Toll is the receptor for the processed cytokine Spätzle (C-106); mature Spätzle binds the
      Toll ectodomain and triggers a Toll-dependent immune response.
    action: ACCEPT
    reason: Cytokine receptor activity is the most precise available description of the core molecular
      function of Toll. Unlike vertebrate TLRs, Toll is activated by an endogenous cytokine, not by a
      microbial molecule; this is supported by direct binding, stoichiometry and crystal structures.
    supported_by:
    - reference_id: PMID:12872120
