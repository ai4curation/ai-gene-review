taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Toll (Tl) is a type I transmembrane receptor with an extracellular leucine-rich-repeat ectodomain
  and a cytoplasmic Toll/interleukin-1 receptor (TIR) domain; it is the founding member of the Toll/Toll-like
  receptor family. Its ligand is the endogenous cystine-knot cytokine Spätzle, which is cleaved by an
  extracellular serine protease cascade and binds the concave face of the membrane-distal LRR solenoid;
  Toll does not bind microbial molecules directly. Ligand binding promotes receptor dimerisation and endocytosis,
  and the TIR domain recruits MyD88 (with Weckle), which assembles Tube and the kinase Pelle, leading
  to degradation of the IkappaB homolog Cactus and nuclear import of the NF-kappaB proteins Dorsal and
  Dif. Maternal Toll, uniformly distributed on the plasma membrane of the syncytial embryo and activated
  ventrally, generates the nuclear Dorsal gradient that specifies the dorsoventral axis. In larvae and
  adults the same Spätzle-Toll pathway, triggered by circulating recognition proteins (PGRP-SA, GNBP1,
  GNBP3) and the protease Persephone, induces antifungal and antibacterial peptides such as drosomycin
  in the fat body and is required for defence against fungi and Gram-positive bacteria. Toll signalling
  is also reused in muscle and heart development, as a repulsive synaptic target cue, in cell competition,
  wound-induced gene expression and in fat-body control of growth and insulin signalling.
