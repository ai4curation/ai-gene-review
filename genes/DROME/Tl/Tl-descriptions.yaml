- source: Alliance_Automated
  text: Enables several functions, including TIR domain binding activity; identical
    protein binding activity; and virion binding activity. Involved in several processes,
    including Toll signaling pathway; nervous system development; and regulation of
    gene expression. Located in cleavage furrow; early endosome; and external side
    of plasma membrane. Is expressed in several structures, including ISN innervated
    muscle cell of A1-7; adult head; embryonic dorsal vessel; embryonic/larval aorta;
    and embryonic/larval heart. Used to study collagen disease; glucose metabolism
    disease; and primary immunodeficiency disease. Human ortholog(s) of this gene
    implicated in several diseases, including artery disease (multiple); bacterial
    infectious disease (multiple); immune system disease (multiple); lung disease
    (multiple); and sensory system disease (multiple). Orthologous to several human
    genes including TLR1 (toll like receptor 1); TLR10 (toll like receptor 10); and
    TLR2 (toll like receptor 2).
