descriptions:
- source: UniProt
  text: Receptor for the cleaved activated form of spz, spaetzle C- 106 (PubMed:12872120).
    Binding to spaetzle C-106 activates the Toll signaling pathway and induces expression
    of the antifungal peptide drosomycin (PubMed:10973475, PubMed:12872120, PubMed:8808632).
    Component of the extracellular signaling pathway that establishes dorsal-ventral
    polarity in the embryo (PubMed:3931919). Promotes heterophilic cellular adhesion
    (PubMed:2124970). Involved in synaptic targeting of motoneurons RP5 and V to muscle
    12 (M12); functions as a repulsive cue inhibiting motoneuron synapse formation
    on muscle 13 (M13) to guide RP5 and V to the neighboring M12, where its expression
    is repressed by tey (PubMed:20504957). May also function in embryonic neuronal
    survival and the synaptic targeting of SNa motoneurons (PubMed:19018662).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08953
  source_id: P08953
