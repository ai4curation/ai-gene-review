taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Drp1 (CG3210) is the Drosophila dynamin-related GTPase of the DNM1L/Dnm1 family that divides mitochondria.
  Like human DNM1L it has a GTPase domain, a middle domain and a GTPase effector domain, and lacks the PH and proline-rich
  domains of classical dynamins such as shibire. Drp1 has a soluble cytosolic pool and is recruited to the mitochondrial
  outer membrane, where it forms foci at fission sites; its recruitment depends on actin dynamics and is reduced
  in mutants for the ER protein Creld. Loss or knockdown of Drp1 elongates and clusters mitochondria, and overexpression
  fragments them. By dividing mitochondria Drp1 allows them to be distributed within cells: in drp1 mutant neurons
  mitochondria are largely absent from synapses, which then fail to mobilize reserve-pool vesicles during intense
  stimulation, and in spermatocytes mitochondria cluster abnormally. Drp1 interacts genetically with Pink1 and parkin
  in maintaining muscle mitochondria, is needed for the programmed germline mitophagy that removes defective mitochondrial
  DNA in the ovary, and contributes to Folded gastrulation signalling at the ventral furrow and to crystal cell
  differentiation in the lymph gland. Drp1-type dynamins also divide peroxisomes in yeast and mammals; in the fly,
  dominant-negative human DNM1L variants enlarge peroxisomes. drp1 null mutants are lethal, and human DNM1L rescues
  the lethality.'
