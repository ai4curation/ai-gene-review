suggested_questions:
- question: Does loss of fly Drp1 change peroxisome number and size, and do the fly Mff and Fis1 homologs recruit
    it to peroxisomes as in mammals?
- question: Do fly Drp1 isoforms differ in their variable domain, and does any of them associate with microtubules,
    as the isoform-dependent microtubule pool of mammalian DRP1 does?
- question: Should the PAINT microtubule-binding IBD, seeded only by shibire, move from the dynamin-family root
    (PTN000170013) to the classical dynamin node (PTN008520579)?
- question: Does fly Drp1 assemble into rings or spirals on the outer membrane, and which fly adaptor is the main
    receptor?
suggested_experiments:
- experiment_type: Peroxisome reporter genetics
  description: Score GFP-SKL or PMP34-Cerulean peroxisomes in drp1 null mitotic clones in salivary gland, fat body
    and muscle, and after Drp1 RNAi in S2 cells, with Pex11 knockdown as a comparison.
  hypothesis: Loss of fly Drp1 gives fewer, larger and elongated peroxisomes, as loss of DNM1L does in mammalian
    cells.
- experiment_type: Microtubule co-sedimentation
  description: Compare purified fly Drp1 and shibire in microtubule co-sedimentation assays with and without GTP
    analogues.
  hypothesis: Shibire binds microtubules through its proline-rich domain; Drp1 does not.
