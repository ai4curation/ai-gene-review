  review:
    summary: IBA from the dynamin-family root PTN000170013 for microtubule, seeded by human DNM2, worm dyn-1 and
      Arabidopsis DRP1A.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The IBD sits on the root duplication node above the split between the Drp1 clade and the classical
      dynamins, and none of its seeds is a Drp1-clade protein. Classical dynamin associates with microtubules through
      its C-terminal proline-rich domain; fly Drp1, like human DNM1L, has no PH or proline-rich domain. No fly study
      has localized Drp1 to microtubules. Mammalian DRP1 has an isoform-dependent microtubule-associated pool, so
      the claim is not impossible for a Drp1-clade protein, but it is unsupported for the fly gene: over-annotation
      by propagation from paralogs.'
    supported_by:
