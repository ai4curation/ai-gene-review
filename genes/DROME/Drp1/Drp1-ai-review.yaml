  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Two sentences. Traced to fly papers: a dynamin-like GTPase that mediates mitochondrial fission
      (PMID:20194754, PMID:34295888); translocation from the cytoplasm to mitochondria (PMID:35867795, PMID:29249285);
      maintenance of postmitotic neuronal function (synaptic transmission fails during intense stimulation in drp1
      mutants, PMID:16055061); viability (drp1 nulls are lethal and rescued by human DNM1L, PMID:26931468). Not
      traced to fly data: oligomerization, which is shown for yeast Dnm1 and mammalian DRP1 but in no fly study
      found, and a role in ''normal neuronal development'' (PubMed searches recorded in the notes). Neither is contradicted,
      so UNVERIFIED rather than DISPUTED. The text omits Drp1''s role in distributing mitochondria to synapses,
      which is the founding fly phenotype.'
