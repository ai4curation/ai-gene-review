  review:
    summary: IBA from PTN008520527 (Unikonts) in the Drp1 clade, seeded by human DNM1L, mouse Dnm1l and yeast Dnm1
      and Vps1.
    action: ACCEPT
    reason: Peroxisome division by Drp1-type dynamins is conserved from yeast (Dnm1, Vps1) to mammals (DNM1L), and
      fly Drp1 descends from the node with no recorded loss. No study has scored peroxisomes after loss of fly Drp1,
      but human DNM1L variants that cannot replace fly Drp1 enlarge and cluster peroxisomes in fly salivary glands,
      while wild-type DNM1L does not, which fits a dynamin-based division step in fly peroxisomes that a dominant-negative
      DNM1L poisons. Fly Drp1 is the only member of the clade in the fly. Accepted as a second organelle target
      of the same fission activity; fly-specific confirmation is a suggested experiment.
    supported_by:
    - reference_id: file:DROME/Drp1/Drp1-bioinformatics/RESULTS.md
