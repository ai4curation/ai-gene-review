findings:
- category: discrepancy
  text: The automated text leads with predicted microtubule binding. The IBA behind it is seeded
    only by shibire and placed at the dynamin-family root above the split from the Drp1 clade,
    and Drp1 lacks the proline-rich domain through which classical dynamins bind microtubules;
    the review marks it over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: The automated text describes Drp1 by positive regulation of mitochondrial fission; Drp1
    is the GTPase that performs fission, and the review moves that row to mitochondrial fission.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions that Drp1 is needed to distribute mitochondria to synapses and in
    spermatocytes (PMID:16055061, PMID:18690063).
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions peroxisome fission, which Drp1-type dynamins perform in yeast and
    mammals; in the fly the evidence is so far indirect (dominant-negative DNM1L variants).
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All texts describe a dynamin-like GTPase for mitochondrial fission; the automated
    text adds the over-annotated microtubule binding and a regulation framing.
