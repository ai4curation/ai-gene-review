descriptions:
- source: Alliance_Imported
  text: Dynamin related protein 1 (Drp1) encodes a dynamin-like GTPase that mediates mitochondrial
    fission through a process that involves translocation to the mitochondrial outer membrane
    and oligomerization. It is required for normal neuronal development and maintenance of postmitotic
    neuronal function and viability.
  source_type: curated
  url: https://flybase.org/reports/Drp1.html
  source_id: FB:FBgn0026479
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Dynamin-like GTPase that mediates mitochondrial fission after translocation
      to mitochondria, and a requirement for neuronal function and viability, all agree with
      fly data. Oligomerization and 'normal neuronal development' are not traced to any fly
      study, though neither is contradicted. Omits the role in distributing mitochondria to
      synapses and spermatocytes, the founding fly phenotype.
- source: Alliance_Automated
  text: Predicted to enable GTPase activity and microtubule binding activity. Involved in several
    processes, including mitochondrion organization; positive regulation of mitochondrial fission;
    and ventral furrow formation. Acts upstream of with a positive effect on lymph gland crystal
    cell differentiation. Is active in mitochondrion. Is expressed in adult head. Human ortholog(s)
    of this gene implicated in encephalopathy due to defective mitochondrial and peroxisomal
    fission 1 and optic atrophy 5. Orthologous to human DNM1L (dynamin 1 like).
  source_type: automated
  url: https://flybase.org/reports/Drp1.html
  source_id: FB:FBgn0026479
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: GTPase activity, mitochondrion and the fission-linked processes are right,
      but it leads with predicted microtubule binding, which the review marks over-annotated
      (inherited from shibire at the dynamin-family root), and it describes Drp1 by positive
      regulation of mitochondrial fission rather than as the fission GTPase. Includes peripheral
      contexts (ventral furrow, crystal cells) and names DNM1L as the human ortholog.
