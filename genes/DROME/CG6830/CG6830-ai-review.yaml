suggested_questions:
- question: Does the full text of PMID:32540344 contain a CG6830-specific statement that FlyBase used
    for the ecdysteroid 22-kinase TAS, or was the annotation applied to the whole EcKL gene group by analogy
    to BmEc22K?
- question: Are both CHK kinase-like domains of CG6830 catalytically active, and do they act on the same
    or different substrates?
suggested_experiments:
- description: Express recombinant full-length CG6830 and each CHK domain separately, and screen ATP-dependent
    phosphorylation of ecdysone, 20-hydroxyecdysone and a panel of hydroxylated xenobiotics by LC-MS product
    identification, with catalytic-loop mutants (D299A, D727A) as controls.
  experiment_type: in vitro enzyme assay
- description: Repeat the ubiquitous misexpression with catalytic-loop mutant constructs to test whether
    the developmental arrest depends on phosphotransfer, and generate a CRISPR null allele to test endogenous
    requirement and xenobiotic sensitivity.
  experiment_type: genetic gain and loss of function
