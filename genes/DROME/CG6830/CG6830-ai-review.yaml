core_functions:
- description: Putative ATP-dependent small-molecule kinase transferring phosphate to a hydroxyl group
    of an as-yet unidentified substrate, inferred from EcKL family membership and retention of the HxDxxxxN
    catalytic loop in both CHK kinase-like domains; no activity has been measured for CG6830.
  molecular_function:
