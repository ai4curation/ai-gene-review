  review:
    action: UNDECIDED
    summary: FlyBase TAS for ecdysteroid 22-kinase activity, traced to the 2020 Drosophila EcKL family
      analysis. The accessible abstract frames the family as candidate detoxification kinases and reports
      no CG6830 assay; the full text is not in our cache. CG6830 is not in the PANTHER subfamily of either
      characterized ecdysteroid 22-kinase, and no PAINT node propagates this activity to its subfamily.
    reason: The supporting publication is abstract-only here, so the specific author statement the FlyBase
      curator relied on cannot be read; per the curation rules this TAS is left UNDECIDED rather than
      removed. The evidence available leans against a confident transfer of this precise activity. (1)
      The cited abstract proposes a family-wide detoxification-kinase hypothesis, not a demonstrated ecdysteroid
      C-22 phosphorylation by CG6830. (2) The 2024 phylogenomic study shows that the only two genes known
      to encode ecdysteroid kinases (BmEc22K, subfamily A; AgEcK2, subfamily D) lie in different EcKL subfamilies,
      and treats the expanded subfamily-H dipteran clades, which include the Dro24 lineage, as candidates
      for detoxification. (3) In PANTHER, CG6830 is in PTHR11012:SF6 together only with the equally uncharacterized
      CG31099, while BmEc22K is in SF54 and CG5644, the fly ortholog of AgEcK2, is in SF47. (4) The only
      direct CG6830 experiment, a misexpression screen, gave developmental arrest but did not measure
      ecdysteroid levels or any enzyme activity. Both CHK domains retain the HxDxxxxN catalytic loop, so
      a small-molecule kinase activity is plausible, but neither the steroid substrate class nor the C-22
      regiospecificity is supported by evolutionary placement or by a target-specific experiment.
    supported_by:
    - reference_id: PMID:32540344
      supporting_text: We propose the hypothesis that members of the arthropod-specific ecdysteroid kinase-like
        (EcKL) gene family encode detoxicative kinases.
    - reference_id: PMID:38291829
      supporting_text: Our results show the only two genes known to encode ecdysteroid kinases belong
        to different subfamilies and therefore ecdysteroid metabolism functions must be spread throughout
        the EcKL family.
    - reference_id: PMID:38291829
      supporting_text: Dip1, Dip3, and Dip4 EcKLs in other dipterans should be investigated for possible
        detoxification functions
    - reference_id: PMID:39208453
      supporting_text: Only misexpression of CG6830 and CG5644 caused significant developmental arrest
        before the adult stage
    - reference_id: file:DROME/CG6830/CG6830-bioinformatics/RESULTS-rereview.md
      supporting_text: both SMART CHK kinase-like domains (174-369 and 605-797) retain
    - reference_id: file:DROME/CG6830/CG6830-uniprot.txt
