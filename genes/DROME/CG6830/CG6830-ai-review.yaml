  label: Drosophila melanogaster
description: CG6830 (also catalogued as Dro24-1) encodes an 891-residue member of the insect ecdysteroid
  kinase-like (EcKL) family. The protein carries two CHK kinase-like (APH-type) domains, each of which
  retains the HxDxxxxN catalytic-loop motif typical of small-molecule kinases of this fold, preceded
  by a short disordered N-terminal region. EcKL proteins are predicted to be cytosolic kinases that
  transfer phosphate from ATP to hydroxyl groups on small molecules such as ecdysteroids or dietary and
  environmental toxins; CG6830 belongs to an expanded dipteran lineage that has been proposed as a candidate
  for detoxification functions. No substrate, enzymatic activity, subcellular location, endogenous requirement
  or pathway has been established for CG6830. Ubiquitous misexpression of a CG6830 open reading frame
  arrests development before the adult stage, a gain-of-function effect whose molecular basis is unknown.
  The two biochemically characterized ecdysteroid 22-kinases of the family (silkworm BmEc22K and mosquito
  AgEcK2) lie in other subfamilies.
