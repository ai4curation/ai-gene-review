suggested_questions:
- question: Fly Myd88 combines the PI(4,5)P2-binding sorting role of mammalian TIRAP with MyD88's death
    domain. Should the IBA/InterPro propagation of mammalian MyD88 terms account for this, for example
    by propagating phosphoinositide binding within the insect clade only?
- question: Does Myd88 act downstream of Toll-family receptors other than Toll-1 (e.g. Toll-5/Tehao, Toll-7)
    in vivo, or is it specific to Toll-1 signalling?
- question: Is the MyD88-FADD death domain association seen on overexpression in S2 cells relevant in
    vivo, given that FADD and Dredd act in the IMD pathway?
- question: The InterPro2GO mapping from IPR017281 (MyD88 family) to positive regulation of canonical
    NF-kappaB signal transduction reaches insect MyD88, whose pathway is IKK-independent. Should that
    mapping be restricted to vertebrates?
suggested_experiments:
- description: Structural analysis (cryo-EM) of the Drosophila MyD88-Tube-Pelle death domain assembly
    bound to the Toll TIR domain, compared with the vertebrate Myddosome.
  hypothesis: The fly complex forms a higher-order helical assembly with Tube bridging MyD88 and Pelle,
    differing in stoichiometry from the MyD88-IRAK4-IRAK2 Myddosome.
  experiment_type: structural biology
- description: Knock-in of lipid-binding-defective and PLCdelta-PH-substituted Myd88 alleles, with live
    imaging of Toll, Myd88 and Tube in fat body cells during infection.
  hypothesis: PI(4,5)P2 binding sets the plasma membrane as the site of Toll signal initiation, and Myd88
    membrane residence is rate-limiting for signalling.
  experiment_type: genetic knock-in and live imaging
