gene_symbol: Myd88
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Myd88 (krapfen) is the Drosophila orthologue of MyD88, a signalling adaptor with an N-terminal
  death domain, a central TIR domain and a C-terminal extension that binds phosphoinositides, preferentially
  PI(4,5)P2. The C-terminal extension holds Myd88 at the plasma membrane. When the cytokine Spaetzle activates
  the Toll receptor, Myd88 binds the Toll TIR domain through its own TIR domain and, through its death
  domain, recruits the adaptor Tube, which in turn recruits the kinase Pelle into a MyD88-Tube-Pelle death
  domain complex. The zinc finger protein Weckle helps link Myd88 to Toll in the embryo. Pelle then drives
  phosphorylation and degradation of the IkappaB homologue Cactus and nuclear entry of Dorsal or Dif.
  Maternal Myd88 is essential for dorsoventral patterning of the embryo, and in larvae and adults Myd88
  is required for Toll-dependent Drosomycin induction and survival of fungal and Gram-positive bacterial
  infection, but not for the IMD-mediated response to Gram-negative bacteria.
