descriptions:
- source: Alliance_Imported
  text: Myd88 (Myd88) encodes an adaptor protein involved in in the Toll pathway functioning
    downstream of the product of Tl and upstream of the product of tub. Toll pathway
    is a signaling cascade that plays a key role in various developmental and immune
    processes, notably embryonic dorsoventral patterning and regulation of antimicrobial
    peptides.
  source_type: curated
  url: https://flybase.org/reports/Myd88.html
  source_id: FB:FBgn0033402
