    overall_notes: 'Correct: Toll pathway adaptor downstream of Tl and upstream of
      tube, in DV patterning and antimicrobial peptide regulation.'
- source: Alliance_Automated
  text: Enables Toll binding activity; phosphatidylinositol-4,5-bisphosphate binding
    activity; and signaling adaptor activity. Involved in several processes, including
    Toll signaling pathway; defense response to symbiont; and regulation of gene expression.
    Located in cytoplasmic side of plasma membrane. Is expressed in several structures,
    including anal pad primordium; embryonic anal pad; embryonic/larval midgut; embryonic/larval
    midgut interstitial cell; and embryonic/larval midgut primordium. Human ortholog(s)
    of this gene implicated in colorectal cancer (multiple); hepatocellular carcinoma;
    lung cancer (multiple); lymphoma (multiple); and primary immunodeficiency disease.
    Orthologous to human MYD88 (MYD88 innate immune signal transduction adaptor).
  source_type: automated
