id: P17644
gene_symbol: nAChRalpha2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: nAChRalpha2 (Dalpha2, also called SAD) encodes a ligand-binding alpha subunit of Drosophila
  neuronal nicotinic acetylcholine receptors (nAChRs), pentameric Cys-loop ligand-gated cation channels.
  The protein has an extracellular N-terminal ligand-binding domain with the Cys-loop and the vicinal
  cysteine pair of alpha subunits, four transmembrane helices and a large M3-M4 cytoplasmic loop. Dalpha2
  is expressed only in the central nervous system, where it is found in synaptic neuropil. It does not
  form functional channels by itself; it co-assembles with other subunits, and native complexes containing
  Dalpha2 together with Dalpha1 (ALS) and Dbeta2 (SBD), all encoded at chromosomal region 96A, have been
  purified from fly heads. Heteromers such as Dalpha1/Dalpha2/Dbeta1(/Dbeta2) form acetylcholine-gated
  cation channels in which Dalpha2 shifts acetylcholine sensitivity and lowers neonicotinoid affinity,
  and hybrid Dalpha2/vertebrate beta2 receptors have long been used to model insecticide action. In vivo,
  alpha2 acts postsynaptically in mushroom body output neurons, where it is needed for the expression
  of appetitive memory and its dynamics change with learning. PANTHER places it in subfamily PTHR18945:SF430
  with the divergent subunit NtR.
