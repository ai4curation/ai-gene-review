- id: file:DROME/nAChRalpha2/nAChRalpha2-uniprot.txt
  title: UniProt record P17644
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The FUNCTION comment is a generic nAChR family statement and is correct as far as it goes. It does not name the Drosophila partner subunits (Dalpha1, Dbeta1, Dbeta2) with which Dalpha2 forms functional receptors (PMID:32611810), the effect of Dalpha2 on neonicotinoid sensitivity, or its postsynaptic role in mushroom body output neurons in appetitive memory (PMID:36250621).
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P17644
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:P17644
      confidence: PROBABLE
      explanation: >-
        The FUNCTION comment gives only the generic acetylcholine receptor mechanism. Gene-specific statements could be added: Dalpha2 does not form functional channels alone but co-assembles with Dalpha1 and Dbeta1 (and Dbeta2) into acetylcholine-gated channels whose agonist and neonicotinoid sensitivity it shapes (PMID:32611810), and it acts postsynaptically in mushroom body output neurons for appetitive memory (PMID:36250621).
      supported_by:
      - reference_id: PMID:32611810
        supporting_text: >-
          suggesting that both Dα2 and Dβ2 subunits coassemble with the Dα1/Dβ1 nAChR to form robust nAChRs with features distinct from the Dα1/Dβ1 nAChR
      - reference_id: PMID:36250621
        supporting_text: >-
          with α2 as a postsynaptic substrate underlying appetitive training-induced plasticity processes
core_functions:
- description: 'Ligand-binding alpha subunit of heteropentameric neuronal nicotinic acetylcholine receptors:
    with Dalpha1 and Dbeta1 (and Dbeta2) it forms acetylcholine-gated cation channels in which it shapes
    agonist sensitivity. It does not form functional channels alone or in pairs with other Drosophila
    subunits.'
