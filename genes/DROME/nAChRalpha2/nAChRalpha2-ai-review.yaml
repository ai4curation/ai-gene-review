  review:
    summary: PAINT IBA (PTN000434994) for regulation of membrane potential.
    action: MODIFY
    reason: Correct but general. The membrane potential that Dalpha2-containing receptors regulate is
      the postsynaptic one, at cholinergic synapses; GO:0060078 regulation of postsynaptic membrane potential
      is already carried by this gene.
    proposed_replacement_terms:
    - id: GO:0060078
      label: regulation of postsynaptic membrane potential
    supported_by:
    - *id009
    - *id008
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000434994
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryote-level node of the Cys-loop receptor family; the general term is correctly inherited
          by all members including Dalpha2. The MODIFY only refines the term to the more specific process
          supported for this gene, not a propagation error.
