suggested_questions:
- question: Are Dalpha2-containing native receptors measurably Ca2+-permeable, which would justify the
    PAINT calcium ion transport IBA for insect alpha subunits?
- question: Should a postsynaptic receptor subunit whose knockdown impairs memory expression and whose
    turnover changes with training be annotated to a synaptic plasticity process, or is that a downstream
    consequence of its channel activity?
- question: Given that NtR shares PANTHER subfamily SF430 with Dalpha2 but falls outside the nAChR clade
    in the Matthews 2018 tree, which (if any) Dalpha2 properties can be transferred to NtR?
suggested_experiments:
- description: Measure Ca2+ permeability (reversal potential shifts or Ca2+ imaging) of TMX3-enabled Dalpha1/Dalpha2/Dbeta1
    versus Dalpha1/Dbeta1 receptors.
- description: Record MBON cholinergic EPSCs in nAChRalpha2 null or MBON-specific knockdown flies to quantify
    the subunit contribution to synaptic current.
