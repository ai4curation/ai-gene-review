    overall_notes: Generic nAChR family sentence about conformational change and channel
      opening. Nothing specific to Dalpha2, its partners or its role in CNS synapses
      and memory.
- source: Alliance_Automated
  text: Contributes to acetylcholine receptor activity and acetylcholine-gated monoatomic
    cation-selective channel activity. Involved in cholinergic synaptic transmission
    and monoatomic cation transmembrane transport. Part of acetylcholine-gated channel
    complex. Is expressed in several structures, including adult head; dorsal ectoderm;
    dorsal ectoderm anlage; dorsal epidermis primordium; and ganglia. Human ortholog(s)
    of this gene implicated in asthma; autosomal dominant nocturnal frontal lobe epilepsy
    1; autosomal dominant nocturnal frontal lobe epilepsy 4; and nicotine dependence.
    Orthologous to human CHRNA2 (cholinergic receptor nicotinic alpha 2 subunit) and
    CHRNA4 (cholinergic receptor nicotinic alpha 4 subunit).
