- source: Alliance_Imported
  text: draper (drpr) encodes a single-pass transmembrane receptor that is involved
    in phagocytosis by glia, macrophages, and epithelia. It signals downstream through
    the proteins encoded by Src42A and Shark to promote Rac1 function and transcriptional
    changes through the products of Jra and Stat92E. It is also required for activation
    of autophagy in salivary glands.
