descriptions:
- source: UniProt
  text: 'Receptor which is involved in the phagocytosis of a variety of cells including
    apoptotic cells, severed and pruned axons, degenerating dendrites, salivary gland
    cells, germline cells and bacteria (PubMed:15342648, PubMed:16772168, PubMed:16772169,
    PubMed:18984163, PubMed:20577216, PubMed:22992958, PubMed:24412417). Binds to
    the ligand prtp which relocates from the endoplasmic reticulum to the cell surface
    during apoptosis (PubMed:19927123, PubMed:23337816). Ligand-binding may promote
    tyrosine phosphorylation mediated by Src42a, interaction with shark and subsequent
    activation of phagocytosis (PubMed:18432193). Also binds to the membrane phospholipid
    phosphatidylserine which is exposed on the surface of apoptotic cells (PubMed:23420848).
    Required for the phagocytosis of apoptotic cells by macrophages (PubMed:15342648).
    Also required for the phagocytosis of apoptotic neurons by glial cells in the
    embryonic nervous system (PubMed:12765609). Acts downstream of NimC4/simu in the
    glial phagocytosis of apoptotic neurons (PubMed:18455990). Plays a role in the
    glial engulfment of larval axons as part of programmed axon pruning during metamorphosis
    (PubMed:16772168, PubMed:16772170). Also mediates glial cell clearance of severed
    axons following axonal injury (PubMed:16772169, PubMed:27498858). Required for
    the engulfment of degenerating dendrites by epidermal cells (PubMed:24412417).
    Required in the ovary for the engulfment and subsequent processing of dying germline
    cells by follicular epithelial cells through activation of the JNK/bsk pathway
    (PubMed:22992958, PubMed:27347682). Plays a role in neuromuscular junction development
    by mediating the clearance of presynaptic debris and immature boutons which are
    shed by growing synapses (PubMed:19707574). Required for larval salivary gland
    cell death which occurs following a rise in steroid levels after puparium formation
    (PubMed:20577216). Also involved in bacterial phagocytosis (PubMed:18984163).
    Required for hemocyte phagocytosis of the Gram- positive bacterium S.aureus (PubMed:19890048).
    Lipoteichoic acid, synthesized by the S.aureus lipoteichoic acid synthase ltaS,
    acts as a ligand for drpr in this process (PubMed:19890048). Together with Src42a
    and shark, promotes the migration of macrophages to sites of wounding as part
    of a signaling cascade where Scr42a detects production of hydrogen peroxide at
    wound sites which triggers phosphorylation of drpr and subsequent recruitment
    and activation of shark (PubMed:26028435). Also required for macrophage priming
    which occurs following phagocytosis of apoptotic cells and ensures that macrophages
    develop a form of molecular memory that allows them to later mount an inflammatory
    response to tissue damage and bacterial infection (PubMed:27212238). Is also an
    essential factor in the regulation of muscle development and myogenesis, and as
    a consequence is required for normal locomotion (PubMed:12765609, PubMed:25111228,
    Ref.27). Likely to control the balance between skeletal muscle satellite cells
    proliferation and differentiation through regulation of the notch signaling pathway
    (PubMed:25111228, PubMed:30802937, Ref.27). . [Isoform B]: Promotes engulfment
    of axonal debris by glial cells following axonal injury. . [Isoform A]: Potently
    inhibits glial cell engulfment of axonal debris produced following axonal injury.'
