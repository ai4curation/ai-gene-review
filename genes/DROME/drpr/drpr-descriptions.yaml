- source: Alliance_Automated
  text: Enables phosphatidylserine binding activity. Involved in several processes,
    including autophagic cell death; cell competition in a multicellular organism;
    and engulfment of apoptotic cell. Located in axon; cytoplasm; and postsynaptic
    membrane. Is expressed in several structures, including adult fat body; adult
    head; brain; glial cell; and synaptic neuropil domain. Used to study myopathy
    and neurodegenerative disease. Human ortholog(s) of this gene implicated in congenital
    myopathy 10A and congenital myopathy 10B. Orthologous to several human genes including
    MEGF10 (multiple EGF like domains 10) and MEGF11 (multiple EGF like domains 11).
