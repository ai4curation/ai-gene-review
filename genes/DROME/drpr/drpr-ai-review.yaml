taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Draper (drpr) is the Drosophila member of the CED-1/MEGF10 family of engulfment receptors,
  a single-pass type I transmembrane protein with an N-terminal EMI domain, a long array of atypical EGF-like
  repeats, and a cytoplasmic tail carrying an NPxY motif (binding the PTB adaptor Ced-6) and an immunoreceptor
  tyrosine-based activation motif (ITAM). Draper recognizes "eat-me" cues on dying cells and debris, including
  phosphatidylserine (directly or bridged by the secreted protein Orion), the apoptotic-cell surface protein
  Pretaporter, and bacterial lipoteichoic acid. Ligation promotes Src42A-dependent phosphorylation of
  the ITAM, recruitment of the Syk-family kinase Shark, Ced-6- and TRAF4-dependent signalling, Rac1-driven
  membrane extension and engulfment, and JNK/AP-1 and STAT92E transcriptional responses that further up-regulate
  draper expression. The activating isoform Draper-I is opposed by the alternatively spliced Draper-II,
  whose ITIM-like motif recruits the phosphatase Corkscrew to terminate glial responses. Draper mediates
  clearance by professional and non-professional phagocytes in many settings: engulfment of apoptotic
  cells by embryonic macrophages and glia, glial clearance of pruned and injury-severed axons, epidermal
  clearance of degenerating dendrites, glial and muscle removal of shed presynaptic debris at the neuromuscular
  junction, follicle cell engulfment of dying nurse cells, winner-cell engulfment during cell competition,
  and hemocyte phagocytosis of Staphylococcus aureus. It also acts as a damage receptor required for macrophage
  migration to wounds, its corpse-induced up-regulation primes macrophages for later inflammatory responses,
  and it is required cell-autonomously for autophagy during salivary gland cell death and for adult muscle
  maintenance.'
