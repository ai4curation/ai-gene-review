core_functions:
- description: Cell-surface engulfment receptor that recognizes eat-me signals (phosphatidylserine, Pretaporter,
    lipoteichoic acid) on apoptotic cells, neuronal debris and bacteria, and drives their engulfment by
    macrophages, glia, epidermal and follicle cells.
  molecular_function:
    id: GO:0005044
    label: scavenger receptor activity
  directly_involved_in:
  - id: GO:0043652
    label: engulfment of apoptotic cell
  - id: GO:0043654
    label: recognition of apoptotic cell
  - id: GO:0006911
    label: phagocytosis, engulfment
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001891
    label: phagocytic cup
  supported_by:
  - reference_id: PMID:23420848
    supporting_text: Draper is a phosphatidylserine-binding receptor for phagocytosis
  - reference_id: PMID:19927123
    supporting_text: Pretaporter relocates from the endoplasmic reticulum to the cell surface during apoptosis
      to serve as a ligand for Draper in the phagocytosis of apoptotic cells
  - reference_id: PMID:15342648
    supporting_text: These results indicate that Drosophila hemocytes/macrophages execute Draper-mediated
      phagocytosis to eliminate apoptotic cells.
  - reference_id: PMID:27347682
    supporting_text: The phagocytic receptor Draper is present on the phagocytic cup
- description: ITAM/NPxY-bearing transmembrane signalling receptor that, after ligation, is phosphorylated
    by Src42A and recruits Shark, Ced-6 and TRAF4 to activate engulfment and JNK/STAT92E-dependent glial
    responses to axon injury; isoform Draper-II antagonizes this signalling via Corkscrew.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0048678
    label: response to axon injury
  - id: GO:0006911
    label: phagocytosis, engulfment
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:18432193
    supporting_text: We propose that ligand-dependent Draper receptor activation initiates the Src42A-dependent
      tyrosine phosphorylation of Draper, the association of Shark and the activation of the Draper pathway.
  - reference_id: PMID:28165006
    supporting_text: Draper is cell autonomously required for glial activation of transcriptional reporters
      after axonal injury
  - reference_id: PMID:22426252
    supporting_text: Draper-II suppresses Draper-I signaling through a previously undescribed immunoreceptor
      tyrosine-based inhibitory motif (ITIM)-like domain and the tyrosine phosphatase Corkscrew (Csw).
  - reference_id: PMID:16772169
    supporting_text: In draper mutants, glia fail to respond morphologically to axon injury, and severed
      axons are not cleared from the CNS.
suggested_questions:
- question: Is the 'scavenger receptor activity' term the right MF for CED-1/Draper/MEGF10-family receptors,
    whose ligands include phosphatidylserine and proteins rather than modified lipoproteins, or is a more
    specific 'apoptotic cell receptor activity'-type term needed?
- question: Does Draper signal as a damage receptor in macrophages (H2O2-Src42A-Draper-Shark) through
    a ligand, or is it activated ligand-independently by oxidant-triggered Src42A?
- question: How does Draper act cell-autonomously in dying salivary gland cells to induce autophagy, and
    what ligand engages it in that self-clearance context?
- question: Is Draper present in neuronal axons (as UniProt states for olfactory receptor neurons), or
    does all axonal-region staining after injury derive from glial processes?
- question: Should UniProt's evidence for 'Postsynaptic cell membrane' on Q9W0A0 cite PMID:19707574 only,
    rather than PMID:22992958 (a follicle cell study)?
suggested_experiments:
- hypothesis: Draper is not expressed in olfactory receptor neurons and the axonal signal after injury
    is glial.
  description: Compare Draper immunostaining around severed ORN axons after glia-specific versus neuron-specific
    drpr RNAi, or with an endogenously tagged drpr allele imaged with cell-type-specific membrane markers.
  experiment_type: imaging
- hypothesis: The Draper-II ITIM-like motif is required to terminate macrophage priming as it is for glial
    responses.
  description: Express Draper-I alone or Draper-I plus Draper-II in H99 macrophages and score wound recruitment
    and bacterial uptake after corpse-independent Draper induction.
  experiment_type: genetic
