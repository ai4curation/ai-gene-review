descriptions:
- source: Alliance_Imported
  text: Synaptojanin (Synj) encodes a synaptic Phosphoinositide phosphate (PtdInsP)
    phosphatase that catalyzes the hydrolysis of phosphate groups from phosphorylated
    inositols. It is recruited or stabilized by the product of EndoA to endocytic
    membranes, and it catalyzes dephosphorylation reactions implicated in the uncoating
    of nascent endocytic vesicles. When the product of Synj dephosphorylates phosphoinositides
    on nascent vesicles, endocytic adaptors with affinity for these lipids will leave
    the membrane to uncoat the vesicle.
  source_type: curated
  url: https://flybase.org/reports/Synj.html
  source_id: FB:FBgn0034691
  review:
    reviewer: AI
    rubrics:
