      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: phosphoinositide phosphatase recruited by Endophilin
      that promotes uncoating of endocytic vesicles. Repeats the uncoating point and
      omits the SAC domain role in autophagosome maturation and Minibrain regulation.'
- source: Alliance_Automated
  text: Predicted to enable inositol-1,4,5-trisphosphate 5-phosphatase activity and
    phosphatidylinositol phosphate phosphatase activity. Involved in several processes,
    including maintenance of presynaptic active zone structure; positive regulation
    of autophagosome assembly; and synaptic vesicle endocytosis. Located in type I
    terminal bouton; vacuole; and vesicle membrane. Is expressed in several structures,
    including adult head; embryonic/larval gut; embryonic/larval salivary gland; eye-antennal
    disc; and larval central nervous system. Used to study Parkinson's disease. Human
    ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's disease
    20; and developmental and epileptic encephalopathy 53. Orthologous to several
    human genes including SYNJ1 (synaptojanin 1).
  source_type: automated
  url: https://flybase.org/reports/Synj.html
  source_id: FB:FBgn0034691
