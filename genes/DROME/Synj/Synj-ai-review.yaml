    label: synaptic vesicle endocytosis
  - id: GO:0016191
    label: synaptic vesicle uncoating
  - id: GO:0046856
    label: phosphatidylinositol dephosphorylation
- description: SAC-domain phosphoinositide phosphatase. The N-terminal SAC domain removes 3- and 4-phosphates
    from PI(3)P, PI(4)P and PI(3,5)P2. At presynaptic terminals this activity is needed for maturation
    of nascent autophagosomes, by releasing Atg18a, and for efficient bulk endocytosis. In wing discs
    it limits PI(4)P levels.
  molecular_function:
    id: GO:0043812
    label: phosphatidylinositol-4-phosphate phosphatase activity
  supported_by:
  - reference_id: PMID:10224048
    supporting_text: Purified recombinant SAC1-like domains convert yeast
      lipids phosphatidylinositol (PI) 3-phosphate, PI 4-phosphate, and PI
      3,5-bisphosphate to PI, whereas PI 4,5-bisphosphate is not a substrate.
  - reference_id: PMID:28331029
    supporting_text: accumulate the PI(3)P/PI(3,5)P2-binding protein Atg18a on nascent synaptic
      autophagosomes, blocking autophagosome maturation at fly synapses
  - reference_id: PMID:34596663
    supporting_text: Synj's
