- term:
    id: GO:0016191
    label: synaptic vesicle uncoating
  evidence_type: IMP
  original_reference_id: PMID:14622578
  qualifier: involved_in
  review:
    action: NEW
    summary: Synj performs the PI(4,5)P2-hydrolysis step that releases clathrin adaptors during uncoating
      of endocytosed synaptic vesicles.
    reason: Synj does part of the work of uncoating. Its 5-phosphatase removes the PI(4,5)P2 that anchors
      clathrin adaptors, and synj mutants accumulate coated vesicles. Comparator check (QuickGO, GO:0016191),
      looking at other genes in the same role. Worm unc-26 (IMP, PMID:10931870) and mouse Synj1 (IDA/IMP)
      carry this term, as does the uncoating cofactor auxilin (Dnajc6). The absence of the term on fly
      Synj is therefore a gap, not a convention. The term is a specific step within synaptic vesicle
      endocytosis, not a redundant ancestor of an existing term.
    supported_by:
    - reference_id: PMID:14622578
      supporting_text: Endophilin recruits and stabilizes Synj on newly formed vesicles to promote vesicle
        uncoating.
