taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Synj is a dual-domain phosphoinositide phosphatase that supports synaptic vesicle recycling.
  Its SAC domain and central inositol 5-phosphatase region act within a long protein recruited to presynaptic
  vesicles by Endophilin. In Drosophila, Synj loss disrupts synaptic vesicle organization and transmission,
  consistent with phosphoinositide turnover during vesicle uncoating.
