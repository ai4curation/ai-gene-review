- term:
    id: GO:0097352
    label: autophagosome maturation
  evidence_type: IMP
  original_reference_id: PMID:28331029
  qualifier: involved_in
  review:
    action: NEW
    summary: The SAC domain of Synj dephosphorylates PI(3)P/PI(3,5)P2 on nascent presynaptic autophagosomes,
      releasing Atg18a and allowing maturation.
    reason: This is participation, not a downstream phenotype. Synj is present at the presynaptic terminal,
      and its SAC catalytic activity acts on the lipids of the nascent autophagosome membrane. An endogenous
      knock-in of a single SAC-domain residue (R228Q), which leaves 5-phosphatase function and endocytosis
      intact, traps the PI(3)P-binding protein Atg18a on autophagosomes and blocks their maturation.
      Synj therefore performs a lipid-remodelling step of maturation. It is a non-core role relative
      to vesicle recycling.
    supported_by:
    - reference_id: PMID:28331029
      supporting_text: accumulate the PI(3)P/PI(3,5)P2-binding protein Atg18a on nascent synaptic
        autophagosomes, blocking autophagosome maturation at fly synapses
    - reference_id: PMID:28331029
      supporting_text: Synaptojanin drives synaptic endocytosis by
        dephosphorylating PI(4,5)P2, but this function appears normal in SynaptojaninRQ
        knock-in flies.
