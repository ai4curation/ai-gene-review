core_functions:
- description: PI(4,5)P2 5-phosphatase at presynaptic endocytic membranes. The central 5-phosphatase
    domain converts PI(4,5)P2 to PI(4)P on newly endocytosed synaptic vesicle membrane, where Endophilin
    recruits Synj. This releases clathrin adaptors so that vesicles can uncoat and recycle. The activity
    is potentiated by Minibrain/DYRK1A phosphorylation at S1029.
  molecular_function:
    id: GO:0004439
    label: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
  supported_by:
  - reference_id: PMID:24977345
    supporting_text: increased the 5′-phosphatase activity of immunoprecipitated Synj in vitro
  - reference_id: PMID:34596663
    supporting_text: These results indicate that Synj's 5′-PPase activity, or the ability to convert
      PI(4,5)P2 to PI(4)P, is essential for CME
  - reference_id: PMID:14622578
    supporting_text: Endophilin recruits and stabilizes Synj on newly formed vesicles to promote vesicle
      uncoating.
  locations:
  - id: GO:0098793
    label: presynapse
  - id: GO:0012506
    label: vesicle membrane
  directly_involved_in:
