gene_symbol: Synj
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Synj (synaptojanin, CG6562) is the single Drosophila synaptojanin, a 1218-residue cytosolic
  dual phosphoinositide phosphatase that associates peripherally with presynaptic and vesicular membranes.
  It has an N-terminal SAC phosphatase domain, which removes phosphate from PI(3)P, PI(4)P and PI(3,5)P2,
  a central inositol polyphosphate 5-phosphatase domain, which converts PI(4,5)P2 to PI(4)P, an RRM-like
  module and a disordered proline-rich C-terminal region that binds the SH3 domain of Endophilin. Synj
  is enriched at presynaptic terminals, where Endophilin recruits and stabilizes it on newly formed vesicles.
  There its 5-phosphatase activity removes PI(4,5)P2 to promote clathrin uncoating in synaptic vesicle
  endocytosis, and null mutants retain only a slowed form of classical endocytosis. Minibrain/DYRK1A
  phosphorylates Synj at S1029, which raises its 5-phosphatase activity and shifts retrieval between
  vesicle pools; calcineurin dephosphorylates this site. Its two catalytic domains act differently in
  bulk endocytosis. The SAC domain is needed for maturation of presynaptic autophagosomes, where
  it releases the PI(3)P-binding protein Atg18a. In wing imaginal discs, Synj also limits PI(4)P levels
  and thereby dampens Smoothened activation in Hedgehog signalling.
