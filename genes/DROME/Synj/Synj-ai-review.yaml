suggested_questions:
- question: Does fly Synj hydrolyse soluble Ins(1,4,5)P3 at physiologically relevant rates, as the
    PAINT-inherited GO:0052658 implies, or is its 5-phosphatase effectively lipid-restricted in vivo?
- question: Is the SAC-domain activity of fly Synj demonstrable in vitro on PI(3)P versus PI(4)P, and
    does the R228Q substitution abolish it in the fly protein as in human SYNJ1?
- question: Should the Synj effect on Smoothened activation in wing discs (RNAi-only, single study) be
    captured as a regulation-of-Hedgehog-signalling annotation, or is it an indirect consequence of altered
    PI(4)P pools?
suggested_experiments:
- description: Purify recombinant fly Synj SAC domain, wild type and R228Q, and measure phosphate release
    from PI(3)P, PI(4)P and PI(3,5)P2 by malachite green assay. This tests the transferred SAC specificity
    directly.
- description: Assay purified fly Synj 5-phosphatase domain on Ins(1,4,5)P3 and Ins(1,3,4,5)P4 alongside
    PI(4,5)P2 to establish whether the soluble-substrate activity inherited by IBA is retained.
