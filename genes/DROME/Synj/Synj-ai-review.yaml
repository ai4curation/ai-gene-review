    action: UNDECIDED
    summary: Nucleic-acid binding is not established by the phosphatase architecture.
    reason: The independent fly experiments establish lipid dephosphorylation and vesicle recycling. The
      broad domain-derived nucleic-acid binding assertion needs a specific binding assay; a phosphoinositide
      substrate is not a nucleic acid.
