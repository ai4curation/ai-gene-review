  review:
    summary: Phylogenetic transfer of glutamate-activated, adenylate cyclase-inhibiting receptor activity
      from group II/III metabotropic glutamate receptors to BOSS.
    action: MARK_AS_OVER_ANNOTATED
    reason: BOSS belongs to the class C GPCR family, but nothing shows that it binds glutamate or inhibits
      adenylate cyclase. Its N-terminal domain is a divergent Venus flytrap fold that binds Sevenless,
      and the only ligand screen found a glucose-specific response, with the downstream mechanism unresolved.
      The node's experimental grounding is in bona fide mGluRs; BOSS appears to have diverged in ligand
      and coupling, so the transfer is not supported for it.
