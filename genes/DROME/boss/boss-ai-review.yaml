description: 'Bride of sevenless (BOSS) is a seven-transmembrane class C GPCR-family glycoprotein with
  a large N-terminal extracellular domain. In the developing compound eye it is expressed on the apical
  surface of the R8 photoreceptor and acts as the membrane-bound ligand of the Sevenless receptor tyrosine
  kinase on the neighbouring R7 precursor: a C-terminal peptide of its ectodomain binds Sevenless, the
  R7 precursor internalizes the whole BOSS protein together with the receptor, and Sevenless activation
  induces the R7 fate. Membrane anchoring is required for activation, since a soluble ectodomain binds
  but antagonizes Sevenless. The same ligand-receptor pair restricts germline stem cell niche formation
  in the embryonic male gonad. Independently of Sevenless, BOSS responds to extracellular glucose in the
  fat body, and boss mutants show raised circulating sugar and lipid, reduced insulin pathway activity
  and a shortened lifespan, although the G-protein coupling behind this response is not established. The
  ligand role is shown only in Drosophila; other insects have a BOSS cognate recognizable by its
  transmembrane region, with no detectably conserved Sevenless-binding ectodomain.'
