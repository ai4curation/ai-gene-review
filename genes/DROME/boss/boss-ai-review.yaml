suggested_questions:
- question: Is glucose the direct ligand of BOSS, which part of the divergent Venus flytrap domain binds
    it, and which G protein (if any) carries the signal to the insulin pathway?
- question: Do dipteran BOSS orthologs outside Drosophila act as Sevenless ligands, as curated rule CR-0006
    assumes for the order?
- question: Should the FlyBase GO:0035997 rhabdomere microvillus membrane row (PMID:1857416) be the apical
    plasma membrane of R8 in the eye disc instead?
suggested_experiments:
- description: Direct binding of glucose to purified BOSS ectodomain (e.g. isothermal titration or thermal
    shift), and G-protein coupling assays (GTPgammaS, BRET) in BOSS-expressing cells.
- description: Rescue of the boss R7 phenotype in D. melanogaster with BOSS from a non-drosophilid dipteran
    (e.g. mosquito) and from a non-dipteran insect cognate (e.g. Tribolium).
