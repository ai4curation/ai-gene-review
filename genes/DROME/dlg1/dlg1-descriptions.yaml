descriptions:
- source: UniProt
  text: During embryonic development, some isoforms are essential for proper neuronal
    differentiation and organization. Required for cell polarity; maintenance of apicobasal
    polarity. Plays a critical role at septate junctions in cellular growth control
    during larval development. The presence of a guanylate kinase domain suggests
    involvement in cellular adhesion as well as signal transduction to control cellular
    proliferation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31007
  source_id: P31007
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: 'Correct on polarity, septate junctions and growth control, but
      dated: it infers adhesion and signaling from the GUK domain, which the review
      treats as a non-catalytic interaction module. No NMJ or spindle roles.'
- source: Alliance_Automated
  text: Predicted to enable protein kinase binding activity. Involved in several processes,
    including asymmetric protein localization involved in cell fate determination;
    basal protein localization; and oogenesis. Located in several cellular components,
    including apicolateral plasma membrane; basolateral plasma membrane; and tight
    junction. Is active in apical cortex and type Ib terminal bouton. Colocalizes
    with presynaptic membrane. Is expressed in several structures, including epithelial
    cell; eye photoreceptor cell; ganglia; neuron projection bundle; and synaptic
    neuropil domain. Used to study benign neoplasm; cancer (multiple); chromosome
    3q29 microdeletion syndrome; developmental disorder of mental health; and kidney
    disease. Human ortholog(s) of this gene implicated in autosomal dominant intellectual
    developmental disorder 62; intellectual disability; invasive ductal carcinoma;
    and non-syndromic X-linked intellectual disability 90. Orthologous to several
    human genes including DLG3 (discs large MAGUK scaffold protein 3).
  source_type: automated
  url: https://flybase.org/reports/dlg1.html
  source_id: FB:FBgn0001624
