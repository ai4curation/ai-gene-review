id: P31007
gene_symbol: dlg1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Discs large (Dlg) is the Drosophila membrane-associated guanylate kinase homolog (MAGUK),
  the founding member of the PSD-95/SAP97 family. Its L27 (DlgS97 isoforms), three PDZ, SH3 and guanylate
  kinase-like (GUK) domains form a peripheral membrane scaffold. The GUK domain is a non-catalytic protein-interaction
  module. In epithelia Dlg sits on the cytoplasmic face of the septate junction and lateral membrane.
  With Scribble and Lethal giant larvae it defines the basolateral domain, maintaining apicobasal polarity,
  septate junctions and proliferation control (neoplastic tumour suppressor). In mitotic neuroblasts and
  other dividing cells, cortical Dlg is recruited by Aurora-A-phosphorylated Pins and couples it to the
  kinesin Khc-73 and astral microtubules to orient the spindle; it also maintains cortical Lgl for basal
  determinant targeting. At the larval neuromuscular junction Dlg is the principal postsynaptic scaffold
  of the subsynaptic reticulum. It clusters Fas2 and Shaker channels through PDZ binding, recruits Scrib
  via GukH, and stabilizes GluRIIB-containing glutamate receptors; PAR-1 phosphorylation controls its
  synaptic targeting. The DlgS97 isoform is required for adult synapse function and complex behaviours.
