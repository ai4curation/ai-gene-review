  review:
    summary: 'IGI with Ran in induced-polarity S2 cells: dlg and ran double knockdown worsens spindle
      orientation more than ran alone, placing Dlg in the PinsLINKER/Dlg/Khc-73 branch parallel to Canoe/Ran/Mud.'
