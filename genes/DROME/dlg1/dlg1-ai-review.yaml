- id: file:DROME/dlg1/dlg1-uniprot.txt
  title: UniProtKB entry P31007 (DLG1_DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Checked the CC FUNCTION claims. Roles in neuronal differentiation, apicobasal polarity and
      septate-junction growth control are correct. The text omits two well-established roles that the review
      treats as core, the postsynaptic PDZ scaffold that clusters Fas2 and Shaker at the neuromuscular junction
      (PMID:9390515) and the Pins-Dlg-Khc-73 spindle orientation pathway (PMID:16377571, PMID:19766567). The closing
      sentence inferring adhesion and proliferation signalling from the guanylate kinase domain is outdated; the
      Dlg GK domain is a non-catalytic protein-interaction module that binds Pins and GukH (PMID:26740169, PMID:11937021).
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P31007
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: The presence of a guanylate kinase domain suggests involvement in cellular adhesion as well
        as signal transduction to control cellular proliferation.
      confidence: PROBABLE
      explanation: The UniProt FUNCTION comment ends with a homology-based speculation that "The presence of a
        guanylate kinase domain suggests involvement in cellular adhesion as well as signal transduction to control
        cellular proliferation." The Dlg GK domain is now known to be a non-catalytic protein-binding module; in
        Drosophila it binds GukH at synapses and phosphorylated Pins in mitotic cells, where it promotes spindle
        orientation (PMID:11937021, PMID:19766567, PMID:26740169). The sentence could be replaced by a statement
        of these GK-domain interactions.
      supported_by:
      - reference_id: PMID:19766567
        supporting_text: We conclude that the PinsLINKER recruits Dlg to the cortex, where the DlgGK domain promotes
          spindle orientation.
      - reference_id: PMID:26740169
        supporting_text: Specifically, we found that Anc-GK1PID has no detectable guanylate kinase activity, but
          it binds Pins with moderate affinity and is highly effective in orienting the mitotic spindle in cell
          culture
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P31007
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:P31007
      confidence: PROBABLE
      explanation: The FUNCTION comment does not mention two well-established Dlg roles. At the larval neuromuscular
        junction Dlg is the postsynaptic PDZ scaffold that clusters Fasciclin II and Shaker channels through their
        C-termini (PMID:9390515). In neuroblasts and S2 cells cortical Dlg is recruited by phosphorylated Pins and
        couples it to the kinesin Khc-73 and astral microtubules to orient the mitotic spindle (PMID:16377571,
        PMID:19766567). Suggest adding both.
      supported_by:
      - reference_id: PMID:9390515
        supporting_text: the PDZ-containing protein Discs-Large (Dlg) controls the localization of these proteins,
          most likely through a direct interaction with their C-terminal amino acids
      - reference_id: PMID:16377571
        supporting_text: Khc-73 localizes to astral microtubule plus ends, and Dlg/Khc-73 and Dlg/Pins coimmunoprecipitate,
          suggesting that microtubules induce Pins/Galphai cortical polarity through Dlg/Khc-73 interactions.
