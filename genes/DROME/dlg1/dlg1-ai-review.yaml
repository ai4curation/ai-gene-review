suggested_questions:
- question: What is Dlg's molecular activity in basolateral polarity beyond cortically stabilizing Scrib?
    Does it act through Lgl's aPKC-inhibiting activity or through a separate membrane-binding mechanism?
- question: Should FlyBase's GMP kinase activity TAS rows, and the derived GMP/GDP metabolic process IEA
    rows, be retired, given that the MAGUK GUK domain is non-catalytic?
- question: Which Dlg isoforms (DlgA vs DlgS97) carry the epithelial versus synaptic functions in vivo,
    and should isoform-specific annotations be made for the synaptic behaviour phenotypes?
suggested_experiments:
- description: Assay purified Dlg GUK domain for GMP phosphotransfer, alongside a GUK point mutant that
    blocks Pins/GukH binding, to document the absence of catalysis directly for the fly protein.
- description: Use endogenously tagged isoform-specific Dlg alleles and proximity labelling in follicle
    epithelium versus larval muscle to identify the direct partners that carry the polarity and synaptic
    scaffold functions.
