- term:
    id: GO:0001708
    label: cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:19948068
  qualifier: involved_in
  review:
    summary: Loss of dlg in posterior follicle cells abolishes posterior follicle cell fate.
    action: MARK_AS_OVER_ANNOTATED
    reason: The fate defect follows from disrupted epithelial polarity and the resulting failure of coordinated
      EGFR, JAK/STAT and Notch signalling. Dlg does not specify fate itself; it maintains the polarized
      epithelium that the signals act in.
    supported_by:
    - &id025
      reference_id: PMID:19948068
      supporting_text: Further, we showed that the aberrant coordinated activities of EGFR, JAK/STAT and
        Notch pathways elicited by mutations in scrib/dlg are causally linked to defective specification
        of the PFC fate in the mosaic clones.
    - &id024
      reference_id: PMID:19948068
      supporting_text: removal of scrib or dlg function from the follicle cells at posterior terminal
        of the egg chamber causes a complete loss of the PFC fate
