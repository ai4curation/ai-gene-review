- term:
    id: GO:0004385
    label: GMP kinase activity
  evidence_type: TAS
  original_reference_id: PMID:10458610
  qualifier: enables
  review: &id001
    summary: TAS asserting GMP kinase (guanylate kinase) activity, based on homology of the Dlg C-terminal
      GUK domain to guanylate kinases.
    action: REMOVE
    reason: The MAGUK GUK domain is a protein-interaction domain that lost catalytic activity during evolution.
      Ancestral reconstruction shows the GK protein-interaction domain gained Pins binding as enzyme activity
      was lost. The Dlg GUK binds GukH and Pins. No assay has shown Dlg phosphorylating GMP.
    supported_by:
    - &id035
      reference_id: PMID:26740169
      supporting_text: Specifically, we found that Anc-GK1PID has no detectable guanylate kinase activity,
        but it binds Pins with moderate affinity and is highly effective in orienting the mitotic spindle
        in cell culture
    - reference_id: PMID:19769408
      supporting_text: Membrane-associated guanylate kinases (MAGUKs) organize protein complexes at specific
        cellular sites by regulating interactions with their COOH-terminal guanylate kinase-like domains
        (GKs).
    - &id002
      reference_id: PMID:11937021
      supporting_text: Here we report the isolation of a new DLG-interacting protein, GUK-holder, that
        interacts with the GUK domain of DLG and which is dynamically expressed during synaptic bouton
        budding.
