- source: Alliance_Automated
  text: Involved in several processes, including cellular response to amino acid starvation;
    negative regulation of TORC1 signaling; and negative regulation of cell size.
    Located in autolysosome and nucleus. Part of GATOR2 complex. Used to study familial
    focal epilepsy with variable foci 3. Human ortholog(s) of this gene implicated
    in familial focal epilepsy with variable foci 3. Orthologous to human NPRL3 (NPR3
    like, GATOR1 complex subunit).
