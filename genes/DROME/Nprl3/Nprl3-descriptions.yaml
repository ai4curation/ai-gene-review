- source: Alliance_Imported
  text: Nitrogen permease regulator-like 3 (Nprl3) encodes a component of the highly
    conserved GAP activity towards rags 1 (GATOR1) complex, which inhibits the product
    of mTor activity in response to amino acid starvation. The product of Nprl3, as
    well as the other GATOR1 components encoded by Nprl2 and Iml1, regulates early
    meiotic progression.
