id: Q9VVN4
gene_symbol: mus304
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: mus304 encodes the Drosophila ortholog of ATRIP (ATR-interacting protein), a non-catalytic
  coiled-coil protein that partners with the ATR kinase MEI-41 to form the ATR-ATRIP checkpoint complex.
  mus304 is required for the ionizing-radiation-induced G2-M DNA damage checkpoint in imaginal discs,
  for lengthening of the late syncytial nuclear cycles in the embryo, for chromosome break repair and
  genome stability, for normal levels of meiotic recombination and chromosome segregation in females,
  and, redundantly with the ATM pathway, for telomere protection. Epitope-tagged MUS304 expressed in unperturbed
  cultured cells is predominantly cytoplasmic, but after irradiation GFP-tagged MUS304 forms nuclear foci
  at damaged heterochromatin.
