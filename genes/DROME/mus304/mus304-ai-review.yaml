suggested_questions:
- question: Does Drosophila MUS304 bind RPA-coated ssDNA and recruit MEI-41 to it, as vertebrate ATRIP
    does, and what controls the balance between its cytoplasmic and damage-induced nuclear pools?
suggested_experiments:
- hypothesis: An endogenous nuclear pool of MUS304 is recruited to damaged chromatin with MEI-41.
  description: Tag endogenous mus304 by CRISPR knock-in and image it with RPA70 and gamma-H2Av after irradiation
    or HU in imaginal discs and syncytial embryos.
