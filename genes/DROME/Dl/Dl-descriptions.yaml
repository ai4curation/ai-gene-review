- source: Alliance_Imported
  text: Delta (Delta) encodes a single pass transmembrane EGF family protein and one
    of two ligands of the Notch signaling pathway. It regulates cell fate decisions
    and cell proliferation. Post transcriptional modification (such as by fucosylation,
    ubiquitination and proteolysis) of the product of Delta is key for its functions.
  source_type: curated
  url: https://flybase.org/reports/Delta.html
  source_id: FB:FBgn0000463
