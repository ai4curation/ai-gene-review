    - rubric: specificity
      score: 4
    overall_notes: 'Correct: single-pass EGF-repeat Notch ligand regulating cell fate
      and proliferation, with post-translational modification (ubiquitination, proteolysis)
      key to function. Names no partners.'
- source: Alliance_Automated
  text: Enables Notch binding activity; glycosphingolipid binding activity; and receptor
    ligand activity. Involved in several processes, including animal organ morphogenesis;
    nervous system development; and oogenesis. Located in several cellular components,
    including apical cortex; apical plasma membrane; and cytoplasmic vesicle. Colocalizes
    with cytoplasmic vesicle. Is expressed in several structures, including epithelium;
    gut section; imaginal disc; light-sensitive neurons; and somatic precursor cell.
    Used to study cancer and dilated cardiomyopathy. Human ortholog(s) of this gene
    implicated in Adams-Oliver syndrome; epilepsy; and limb ischemia. Orthologous
    to human DLL1 (delta like canonical Notch ligand 1) and DLL4 (delta like canonical
    Notch ligand 4).
