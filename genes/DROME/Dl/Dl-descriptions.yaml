descriptions:
- source: UniProt
  text: Acts as a ligand for Notch (N) receptor (PubMed:10935637). Essential for proper
    differentiation of ectoderm (PubMed:10935637). Required for the correct separation
    of neural and epidermal cell lineages (PubMed:10935637). Fringe (fng) acts in
    the Golgi to determine the type of O-linked fucose on the EGF modules in N, altering
    the ability of N to bind with Delta (PubMed:10935637). Ofut1 also has a role in
    modulating the interaction (PubMed:10935637). Interacts with glycosphingolipids,
    specifically N5 (GalNAc-alpha1-4GalNAc-beta1- 4GlcNAc-beta1-3Man-beta1-4Glc-beta1-1Cer)
    the product of alpha4GT1 and alpha4GT2; the interaction regulates endocytosis
    and subcellular localization (PubMed:20176925).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10041
  source_id: P10041
