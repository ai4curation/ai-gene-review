core_functions:
- description: >-
    Membrane-bound DSL ligand: Delta binds Notch in trans and, through Neuralized/Mind bomb-dependent
    endocytosis, activates Notch on neighbouring cells.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  - id: GO:0046331
    label: lateral inhibition
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:10504334
    supporting_text: >-
      Molecular evidence has established that direct heterotypic interactions occur between the Drosophila
      receptor Notch and the ligands Delta and Serrate, and that homotypic interactions occur between
      Delta molecules on opposing cell surfaces.
  - reference_id: PMID:1657403
    supporting_text: >-
      We find that of the 36 EGF repeats of Notch, only two, 11 and 12, are both necessary and sufficient
      to mediate interactions with Delta.
  - reference_id: PMID:20176925
    supporting_text: >-
      Endocytosis of the transmembrane ligands Delta (Dl) and Serrate (Ser) is required for the proper
      activation of Notch receptors.
- description: >-
    Receptor ligand activity: Delta binding triggers Notch activation (trans-activation); soluble Kuzbanian-shed
    Delta ectodomain can also bind Notch.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15611340
    supporting_text: >-
      Using atomic force microscopy on live cells, chemical inhibitors, and conventional analyses, we
      show that the rate of Notch signaling is linked to the adhesion force between cells expressing Notch
      receptors and Delta ligand.
  - reference_id: PMID:9872749
    supporting_text: >-
      Here biochemical and genetic analyses show that the ligand Delta is cleaved on the surface, releasing
      an extracellular fragment capable of binding to Notch and acting as an agonist of Notch activity.
suggested_questions:
- question: >-
    How do cis-inhibition by Delta and trans-activation compete in vivo, and does Kuzbanian-mediated Delta
    shedding tune this balance in tissues other than the midgut?
- question: >-
    Is the Kuzbanian-shed soluble Delta ectodomain a physiological agonist in vivo, or mainly a mechanism
    to down-regulate ligand activity?
suggested_experiments:
- description: >-
    Endogenous Delta alleles lacking Neuralized- and Mind bomb-targeted lysines, combined with force-sensor
    readouts, to separate ubiquitin-dependent endocytic pulling from ubiquitin-independent signaling.
