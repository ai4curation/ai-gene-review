  review:
    summary: >-
      Delta binds the Notch receptor in trans via its N-terminal DSL/MNNL and EGF region; Notch EGF repeats
      11-12 are necessary and sufficient for Delta binding (IBA).
    action: ACCEPT
    reason: >-
      Direct binding of Delta to Notch is established by cell aggregation, soluble-ectodomain binding,
      force and co-immunoprecipitation assays; the IBA reflects a PAINT node covering DSL ligands across
      metazoa. This is the core molecular function of a DSL ligand.
    supported_by:
    - reference_id: PMID:10504334
      supporting_text: >-
        Molecular evidence has established that direct heterotypic interactions occur between the Drosophila
        receptor Notch and the ligands Delta and Serrate, and that homotypic interactions occur between
        Delta molecules on opposing cell surfaces.
    - reference_id: PMID:1657403
      supporting_text: >-
        We find that of the 36 EGF repeats of Notch, only two, 11 and 12, are both necessary and sufficient
        to mediate interactions with Delta.
