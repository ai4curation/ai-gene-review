id: P10041
gene_symbol: Dl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Dl (Delta) encodes the principal DSL-family transmembrane ligand of the Drosophila Notch receptor. Its
  extracellular region carries an N-terminal MNNL/DSL domain followed by nine EGF-like repeats; a single
  transmembrane segment and short intracellular domain follow. Delta on one cell binds Notch EGF repeats
  11-12 on an adjacent cell. Ubiquitination of the Delta intracellular domain by the E3 ligases Neuralized
  and Mind bomb drives epsin-dependent ligand endocytosis, which exerts the pulling force needed to expose
  Notch to ADAM (Kuzbanian) cleavage, and results in trans-endocytosis of the Notch ectodomain. Delta
  can also inhibit Notch expressed in the same cell (cis-inhibition) and is itself shed by Kuzbanian.
  Delta-Notch signaling mediates lateral inhibition during neurogenesis and sensory organ development,
  wing vein and margin patterning, eye development, oogenesis and many other cell-fate decisions.
