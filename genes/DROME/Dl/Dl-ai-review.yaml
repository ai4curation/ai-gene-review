- term:
    id: GO:0000902
    label: cell morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028811
  review:
    summary: >-
      Dl IEA annotation to 'cell morphogenesis'. Delta is a Notch ligand, and perturbing Delta alters
      this developmental process through loss or misregulation of Notch signaling.
    action: KEEP_AS_NON_CORE
    reason: >-
      Delta acts as the principal transmembrane DSL ligand for Notch in Drosophila, and its requirement
      in this context reflects Delta-Notch signaling there. The annotation is biologically sound but records
      a downstream developmental outcome of signaling rather than the core ligand activity; kept as non-core.
