- term:
    id: GO:0005768
    label: endosome
  evidence_type: IDA
  original_reference_id: PMID:19295516
  qualifier: located_in
  review:
    summary: >-
      Delta is endocytosed and trafficked through vesicles, Sara/early endosomes and multivesicular bodies.
    action: KEEP_AS_NON_CORE
    reason: >-
      Ubiquitin-dependent (Neur/Mib1) endocytosis of Delta is required for signaling activity and trans-endocytosis
      of the Notch ectodomain, and also mediates ligand turnover. Endosomal localization is well documented
      but reflects ligand regulation; kept as non-core.
    supported_by:
    - reference_id: PMID:19295516
      supporting_text: >-
        We thus uncover a new mechanism to bias signalling even before asymmetric endocytosis of Sanpodo
        and Delta takes place in the daughter cells: already during SOP mitosis, asymmetric targeting
        of Delta and Notch-containing Sara endosomes will increase Notch signalling in pIIa and decrease
        it in pIIb
    - reference_id: PMID:20176925
      supporting_text: >-
        Endocytosis of the transmembrane ligands Delta (Dl) and Serrate (Ser) is required for the proper
        activation of Notch receptors.
