    overall_notes: Calls Serrate a 'putative' Notch ligand (By similarity), which
      is dated, since its Notch ligand activity is well established in flies. Adds
      glycosphingolipid binding and wing and tracheal development.
- source: Alliance_Automated
  text: Enables Notch binding activity; glycosphingolipid binding activity; and receptor
    ligand activity. Involved in several processes, including imaginal disc development;
    larval development; and lateral inhibition. Located in several cellular components,
    including apical cortex; apical plasma membrane; and axolemma. Is expressed in
    several structures, including dorsal thoracic disc primordium; epithelium; gut
    section; imaginal disc; and organism subdivision. Used to study dilated cardiomyopathy.
    Human ortholog(s) of this gene implicated in Alagille syndrome; Charcot-Marie-Tooth
    disease; autosomal recessive limb-girdle muscular dystrophy type 27; congenital
    heart disease (multiple); and multiple sclerosis. Orthologous to human JAG1 (jagged
    canonical Notch ligand 1) and JAG2 (jagged canonical Notch ligand 2).
  source_type: automated
  url: https://flybase.org/reports/Ser.html
