descriptions:
- source: UniProt
  text: Putative Notch ligand involved in the mediation of Notch signaling (By similarity).
    Interacts with glycosphingolipids, specifically N5 (GalNAc-alpha1-4GalNAc-beta1-4GlcNAc-beta1-3Man-beta1-
    4Glc-beta1-1Cer) the product of alpha4GT1 and alpha4GT2; the interaction regulates
    endocytosis and subcellular localization (PubMed:20176925). Involved in several
    developmental processes, including of the wings and the tracheal system (PubMed:1840519,
    PubMed:2125287).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P18168
