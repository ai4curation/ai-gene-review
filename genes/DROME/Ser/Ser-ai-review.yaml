core_functions:
- description: >-
    Membrane-bound DSL ligand: Serrate binds Notch in trans (EGF repeats 11-12) and, through Mind bomb/Neuralized-dependent
    endocytosis, activates Notch in neighbouring cells; Fringe glycosylation of Notch reduces Serrate
    responsiveness.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:1657403
    supporting_text: >-
      We report a novel molecular interaction between Notch and Serrate, another EGF-homologous transmembrane
      protein containing a region of striking similarity to Delta, and show that the same two EGF repeats
      of Notch also constitute a Serrate binding domain.
  - reference_id: PMID:10504334
    supporting_text: >-
      Contrary to previous suggestions, our evidence implies that the interactions between Serrate and
      Notch are similar in affinity to those between Delta and Notch.
  - reference_id: PMID:9202123
    supporting_text: >-
      This is achieved by fng through a cell-autonomous mechanism that inhibits a cell's ability to respond
      to Serrate protein and potentiates its ability to respond to Delta protein.
- description: >-
    Receptor ligand activity: Serrate trans-activates Notch, e.g. in wing D/V boundary signaling and crystal
    cell specification.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9202123
    supporting_text: >-
      Ser and Dl encode transmembrane ligands for Notch, whereas fng encodes a pioneer protein.
  - reference_id: PMID:17006545
    supporting_text: >-
      The second, a novel motif, is necessary for interactions with Mindbomb1/Neuralized and is strictly
      required for Serrate to trans-activate and internalise efficiently but not for it to inhibit Notch
      signalling.
  - reference_id: PMID:12569125
    supporting_text: >-
      Serrate signaling through the Notch pathway is critical in the regulation of Lz expression and the
      specification of crystal cell precursors, thus providing a key distinction between the two lineages.
suggested_questions:
- question: >-
    Which structural features of Serrate (cysteine-rich region, DOS-like EGF repeats) account for its
    differential sensitivity to Fringe-modified Notch compared with Delta?
suggested_experiments:
- description: >-
    Compare endogenous Serrate and Delta cis-inhibition strength at the wing D/V boundary using ligand
    alleles specifically defective in trans-activation (Mib1/Neur-binding motif mutants).
