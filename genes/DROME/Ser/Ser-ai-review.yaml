id: P18168
gene_symbol: Ser
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Ser (Serrate) encodes a DSL-family transmembrane ligand of the Drosophila Notch receptor, the ortholog
  of vertebrate Jagged. Its extracellular region contains an N-terminal MNNL/DSL domain, 14 EGF-like repeats
  and a cysteine-rich region. Serrate binds Notch EGF repeats 11-12 with an affinity similar to Delta,
  and its signaling competence depends on Mind bomb/Neuralized-mediated ubiquitination and endocytosis
  via a conserved intracellular motif. Serrate also cis-inhibits Notch in the same cell. Glycosylation
  of Notch by Fringe reduces responsiveness to Serrate while potentiating Delta signaling, which restricts
  Serrate-Notch signaling to the dorsal/ventral boundary of the wing disc. Serrate signaling contributes
  to wing margin formation, leg segmentation, eye development, embryonic denticle patterning, salivary
  gland and tracheal development, glial proliferation and crystal cell specification during hematopoiesis.
