  review:
    summary: >-
      Serrate binds Notch in trans via the same EGF repeats (11-12) of Notch that bind Delta (IBA).
    action: ACCEPT
    reason: >-
      Direct Serrate-Notch binding is shown by cell aggregation and soluble ectodomain binding assays,
      with affinity similar to Delta-Notch; binding is modulated by Ofut1 and Fringe. Core molecular function
      of the ligand.
    supported_by:
    - reference_id: PMID:1657403
      supporting_text: >-
        We report a novel molecular interaction between Notch and Serrate, another EGF-homologous transmembrane
        protein containing a region of striking similarity to Delta, and show that the same two EGF repeats
        of Notch also constitute a Serrate binding domain.
    - reference_id: PMID:10504334
      supporting_text: >-
        Contrary to previous suggestions, our evidence implies that the interactions between Serrate and
        Notch are similar in affinity to those between Delta and Notch.
