descriptions:
- source: UniProt
  text: Catalytic subunit of the queuine tRNA-ribosyltransferase (TGT) that catalyzes
    the base-exchange of a guanine (G) residue with queuine (Q) at position 34 (anticodon
    wobble position) in tRNAs with GU(N) anticodons (tRNA-Asp, -Asn, -His and -Tyr),
    resulting in the hypermodified nucleoside queuosine (7-(((4,5-cis-dihydroxy-2-
    cyclopenten-1-yl)amino)methyl)-7-deazaguanosine). Catalysis occurs through a double-displacement
    mechanism. The nucleophile active site attacks the C1' of nucleotide 34 to detach
    the guanine base from the RNA, forming a covalent enzyme-RNA intermediate. The
    proton acceptor active site deprotonates the incoming queuine, allowing a nucleophilic
    attack on the C1' of the ribose to form the product.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VPY8
  source_id: Q9VPY8
