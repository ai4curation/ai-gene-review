suggested_questions:
- question: Is Tgt required for queuosine in Drosophila tRNAs, and does dietary or microbial queuine availability
    alter fly translation or physiology through Tgt?
suggested_experiments:
- hypothesis: Tgt is the sole source of queuosine in fly tRNAs.
  description: Measure Q-tRNA by APB-northern or LC-MS in Tgt mutants raised on queuine-supplemented and
    queuine-free axenic diets.
