  label: Drosophila melanogaster
description: Tgt (CG4947) encodes the Drosophila ortholog of QTRT1, the catalytic subunit of eukaryotic
  tRNA-guanine transglycosylase. Together with the accessory subunit CG3434 (QTRT2 ortholog) it exchanges
  guanine 34 at the anticodon wobble position of tRNA-Asp, tRNA-Asn, tRNA-His and tRNA-Tyr for queuine,
  a micronutrient base that animals obtain from diet and gut microbes, producing queuosine. The zinc-containing
  enzyme works by a double-displacement mechanism through a covalent enzyme-tRNA intermediate. Queuosine
  at the wobble position tunes decoding of NAC/NAU codons. Function in flies is inferred from orthologs;
  no Drosophila-specific experimental studies of the gene have been reported.
