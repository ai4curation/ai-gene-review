core_functions:
- description: As the GARP-defining subunit, Scat/Vps54 targets the Vps51-Vps52-Vps53 core to the trans-Golgi
    and contributes to tethering of endosome-derived carriers, enabling retrieval of cargo such as the
    M6PR homolog Lerp to the TGN.
  contributes_to_molecular_function:
    id: GO:7770062
    label: vesicle membrane tethering activity
  directly_involved_in:
