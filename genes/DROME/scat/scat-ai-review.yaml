    label: Golgi trans cisterna
  in_complex:
    id: GO:0000938
    label: GARP complex
  supported_by:
  - reference_id: PMID:27481842
    supporting_text: The Vps54 (Scat) protein, a subunit of the GARP tethering complex, is a central factor
      in retrograde transport to the trans-Golgi.
  - reference_id: PMID:27481842
    supporting_text: The trans-Golgi marker Golgin245 showed co-localization with GFP-Lerp in WT, but
      not in the scat1 mutant postmeiotic round spermatids
suggested_questions:
- question: Why is scat loss largely restricted to a male-sterile phenotype in flies, whereas GARP loss
    is lethal or neurodegenerative in other animals (e.g. the wobbler mouse Vps54 allele)? Is there redundancy
    with EARP or other retrograde pathways in somatic fly tissues?
suggested_experiments:
- description: Examine somatic tissues (neurons, fat body, salivary gland) of scat1 null animals for Lerp
    missorting and lysosomal hydrolase secretion, and test genetic interaction with Vps50.
