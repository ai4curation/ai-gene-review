gene_symbol: scat
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'scattered (scat, CG3766) encodes the Drosophila ortholog of VPS54, the subunit that defines
  the Golgi-associated retrograde protein (GARP) tethering complex. Scat joins the Vps51-Vps52-Vps53 core
  shared with the EARP complex and targets it to the trans side of the Golgi, where GARP captures endosome-derived
  carriers carrying cargo such as the mannose-6-phosphate receptor homolog Lerp back to the trans-Golgi
  network. GARP is recruited to the TGN in part by the Arf-like GTPase Arl5. scat null males are completely
  sterile: in spermatids the trans side of the Golgi-derived acroblast is disrupted, the acrosome fails
  to form, nuclei fail to complete elongation and individualization of the spermatid cyst does not occur.
  In larval motor neurons scat is required for normal organization of the TGN syntaxin Syx16 and restrains
  neuromuscular junction growth, and in sensory neurons GARP loss causes free-sterol accumulation at the
  TGN and defective dendrite regrowth after pruning.'
