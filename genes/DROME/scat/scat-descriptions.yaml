- source: Alliance_Automated
  text: Predicted to enable syntaxin binding activity. Involved in endocytic recycling
    and spermatid development. Located in Golgi trans cisterna. Part of GARP complex.
    Is expressed in several structures, including anterior endoderm; dorsal ectoderm
    anlage; embryonic/larval midgut primordium; gland; and gut section. Used to study
    motor neuron disease. Orthologous to human VPS54 (VPS54 subunit of GARP complex).
