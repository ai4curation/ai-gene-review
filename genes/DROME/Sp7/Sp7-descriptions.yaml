descriptions:
- source: UniProt
  text: Serine protease that, by cleaving and activating prophenoloxidase (PPO1) after
    immune challenge, plays an essential role in the melanization immune response
    to septic wounding (PubMed:16256951, PubMed:16322759, PubMed:16861233, PubMed:19071960,
    PubMed:24260243). May function in diverse Hayan-dependent PPO1- activating cascades
    that are negatively controlled by different serpin proteins; Spn27A in the hemolymph
    and Spn77BA in the trachea (PubMed:16322759, PubMed:18854145, PubMed:24260243).
    Important for the innate immune response to fungi (PubMed:16861233). Regulation
    of melanization and PPO1 activation appears to be largely independent of the Toll
    signaling pathway (PubMed:16861233).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9V3Z2
