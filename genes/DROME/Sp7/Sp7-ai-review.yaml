suggested_questions:
- question: Is Sp7 the terminal PPO1-activating protease in vivo (as in vitro cleavage suggests), or
    does it act upstream of MP1, as the genetic data indicate?
- question: Should PPO1 cleavage by Sp7 be captured as GO:0031638 zymogen activation (or a has_input
    PPO1 extension on the activity)? This needs a comparator check against other PPO-activating
    proteases such as Hayan, Manduca PAP1 and Holotrichia PPAF1.
- question: Which protease cleaves the Sp7 zymogen (between the activation propeptide and Ile137), and
    is it ModSP/Grass-dependent?
suggested_experiments:
- description: Determine the in vivo PPO1 cleavage site and kinetics in Sp7 and MP1 single and double
    mutants, and test whether catalytically dead Sp7 (S341A) rescues PO activation in Sp7 nulls.
- description: Identify the activating protease of proSp7 by N-terminal sequencing of activated Sp7
    from infected hemolymph combined with ModSP, Grass and Hayan mutant backgrounds.
