gene_symbol: Sp7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sp7 (CG3066; also called MP2 and PAE1) is a secreted clip-domain serine protease of
  the S1A (trypsin-like) family in Drosophila melanogaster. It is synthesised as a zymogen with an
  N-terminal clip domain, an activation propeptide and a C-terminal trypsin-like catalytic domain
  with an intact His-Asp-Ser catalytic triad. Sp7 is expressed in blood cells, including crystal
  cells, and is induced by wounding and infection. Once activated, it cleaves prophenoloxidase-1
  (PPO1) in the hemolymph, and genetic loss of Sp7 abolishes the induced phenoloxidase activity
  and the melanization reaction at sites of septic injury. Its activity is inhibited by the serpin
  Spn27A, and it lies downstream of the Toll-activating proteases ModSP and Grass. The
  Sp7-dependent melanization is needed for clearance of Staphylococcus aureus and affects survival
  after infection with several bacteria and fungi. Genetic and biochemical studies disagree on
  whether Sp7 cleaves PPO1 directly in vivo or acts upstream of the protease MP1.
