  review:
    summary: InterPro2GO transfer of corepressor activity from the BEN-solo family. Elba1/Elba2 bind DNA
      directly through their BEN domains and can repress reporters carrying Insv or Elba sites, so they
      act as sequence-specific DNA-binding repressors rather than as corepressors.
    action: MODIFY
    reason: The repression capacity is real but is exerted by the protein's own sequence-specific DNA
      binding, which GO captures with DNA-binding transcription repressor activity, not corepressor activity
      (a factor recruited by another DNA-binding protein). The Notch-corepressor role of Insv/BEND6 does
      not transfer to the Elba class; that point is recorded on the Notch process rows.
