    supporting_text: DNA binding depends upon the BEN domains in Elba1 and Elba2
- description: Broadly chromatin-associated protein that supports internucleosomal spacing and nuclear
    compaction in early embryos, functionally overlapping linker histone H1.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  directly_involved_in:
  - id: GO:0006325
    label: chromatin organization
  locations:
  - id: GO:0005704
    label: polytene chromosome band
  supported_by:
  - reference_id: PMID:27687115
    supporting_text: In H1-depleted animals, ectopic expression of Elba2 rescues the increased lethality
      and ameliorates abnormalities of chromosome architecture and heterochromatin functions
proposed_new_terms:
- proposed_name: Elba complex
  proposed_definition: A heterotrimeric nuclear protein complex consisting of two BEN-domain DNA-binding
    proteins (Elba1, Elba2) bridged by an adaptor (Elba3) that binds the CCAATAAG Elba site in chromatin
    boundary elements and confers developmentally restricted insulator activity. Described in Drosophila.
  justification: The Elba heterotrimer is currently annotated to chromatin silencing complex, which misdescribes
    an insulator/boundary complex.
suggested_questions:
- question: Does Elba2 bind nucleosomal linker DNA directly, like H1, and is its H1-like activity separable
    from its sequence-specific BEN-domain DNA binding?
suggested_experiments:
- description: Test BEN-domain DNA-binding mutants of Elba2 for rescue of H1-depletion lethality and for
    internucleosomal spacing in syncytial embryos.
