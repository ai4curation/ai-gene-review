- term:
    id: GO:0005677
    label: chromatin silencing complex
  evidence_type: IDA
  original_reference_id: PMID:23240086
  qualifier: part_of
  review:
    summary: Member of the heterotrimeric Elba boundary complex (Elba1, Elba2, Elba3).
    action: KEEP_AS_NON_CORE
    reason: Complex membership is directly supported (co-purification and reconstitution), but the GO
      term "chromatin silencing complex" (a complex that mediates transcriptional silencing) does not
      describe Elba, which is an insulator/boundary DNA-binding complex rather than a silencing complex.
      No GO cellular component term exists for the Elba complex; a new term is proposed. Retained as the
      best available CC term.
    supported_by:
    - reference_id: PMID:23240086
      supporting_text: All three Elba proteins are present in the Elba complex detected in 0–6 hr nuclear
        extracts and all three are required for chromatin domain boundary function in vivo
