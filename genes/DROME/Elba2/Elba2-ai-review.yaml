taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Elba2 (CG9883) is a BEN-solo domain DNA-binding protein of the Drosophila early embryo. With
  Elba1 and the adaptor Elba3 it forms the heterotrimeric Elba complex, in which the BEN domains of Elba1
  and Elba2 jointly recognize the CCAATAAG Elba site in the Fab-7 boundary of the bithorax complex and
  confer early enhancer-blocking (insulator) activity. Elba2 is also expressed beyond the blastoderm stage
  and associates broadly with chromatin, colocalizing with linker histone H1 on polytene chromosomes;
  its loss perturbs internucleosomal spacing and nuclear compaction in syncytial embryos, and ectopic
  Elba2 can substitute for H1 in vivo. Individually it can bind Insv-type CCAATTGG sites and repress reporters,
  but it does not regulate Notch signaling in neural development.
