descriptions:
- source: UniProt
  text: The heterotrimeric Elba complex is required for chromatin domain boundary
    function during early embryogenesis. It binds to a 8-bp sequence 5'-CCAATAAG-3'
    in the Fab-7 insulator or boundary element in the bithorax complex and contributes
    to its insulator or boundary activity (PubMed:23240086). Elba2 can act as a transcriptional
    repressor and binds the palindromic sequence 5'-CCAATTGG-3' to mediate transcriptional
    repression (PubMed:25561495).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VQD6
  source_id: Q9VQD6
