- source: Alliance_Automated
  text: Enables chromatin binding activity. Contributes to chromatin insulator sequence
    binding activity and sequence-specific DNA binding activity. Involved in heterochromatin
    boundary formation and negative regulation of DNA-templated transcription. Located
    in nucleus and polytene chromosome band. Part of chromatin silencing complex.
    Is expressed in several structures, including anlage in statu nascendi; antennal
    anlage; antennal primordium; central brain anlage; and head epidermis primordium.
