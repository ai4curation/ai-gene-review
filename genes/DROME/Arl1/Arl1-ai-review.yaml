suggested_questions:
- question: 'Which factor activates Arl1 on the Drosophila trans-Golgi: is Garz (GBF1) a direct Arl1 GEF,
    as the genetic data of PMID:26116655 suggest, or does a SYS1/ARFRP1-type pathway act as in yeast and
    mammals?'
- question: Is the accelerated secretion and ER-to-Golgi shift in arf72A photoreceptors (PMID:21693198)
    a direct Arl1 role at the ER, or a consequence of lost golgin/Sec71 recruitment at the TGN?
- question: Why is AP-1 recruitment Arl1-dependent in salivary gland but not in all tissues, given that
    golgin recruitment depends on Arl1 everywhere tested (PMID:24610947)?
suggested_experiments:
- description: Measure GEF activity of purified Garz and Sec7-domain proteins on myristoylated Arl1-GDP
    on liposomes, and test whether Arl1 directly stimulates Sec71 GEF activity toward Arf1.
- description: Compare ER exit kinetics (e.g. RUSH reporters) in arl1 null and golgin- or Sec71-depleted
    photoreceptors or S2 cells to separate direct ER roles from TGN effector-recruitment defects.
