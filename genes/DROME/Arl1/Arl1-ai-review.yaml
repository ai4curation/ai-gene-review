id: P25160
gene_symbol: Arl1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Arl1 (Arf-like 1; also arflike/Arf72A) is an essential, N-myristoylated Arf-family small
  GTPase that binds and hydrolyses GTP and associates with the cytoplasmic face of trans-Golgi/TGN membranes.
  In its GTP-bound form it recruits peripheral proteins to the trans-Golgi: the four GRIP-domain golgins
  (dGolgin-245, dGolgin-97 and dGCC88 depend on it for Golgi targeting; dGCC185 only weakly), the Arf1
  exchange factor Sec71 (BIG1/BIG2 ortholog), and the BAR-domain protein Arfaptin. By recruiting Sec71
  it promotes Arf1 activation and AP-1 clathrin adaptor recruitment at the TGN, which larval salivary
  glands require to form secretory granules. Arl1 is not required for overall Golgi integrity. Loss of
  Arl1 in photoreceptors expands the Golgi, accelerates secretion and suppresses retinal degeneration
  caused by a misfolded rhodopsin, and in motor neurons Arl1 acts with Garz and Arfaptin at the Golgi
  to support synapse growth.'
