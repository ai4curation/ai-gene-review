  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Original cloning paper for Drosophila arl; reports GTP binding and hydrolysis
      by recombinant protein, absence of ARF activity, and lethality of a recessive allele.
- id: PMID:21693198
  title: Drosophila arf72A acts as an essential regulator of endoplasmic reticulum quality control and
    suppresses autosomal-dominant retinopathy.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Arf72A (Arl1) on photoreceptor Golgi membranes; loss of function expands
      the Golgi, accelerates secretion and suppresses ninaE(D1) degeneration. Increased ER localization
      is reported only in the ninaE(D1) model.
- id: PMID:22291037
  title: The small G protein Arl1 directs the trans-Golgi-specific targeting of the Arf1 exchange factors
    BIG1 and BIG2.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Liposome affinity purification from S2 extracts identifies Sec71 as a direct
      Arl1-GTP effector; Arl1 and Sec71 colocalize on the trans-Golgi, and Arl1 recruits the Sec71 N-terminus
      to the Golgi.
- id: PMID:24610947
  title: The Arf family G protein Arl1 is required for secretory granule biogenesis in Drosophila.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Arl1 null clones lose Golgi targeting of three GRIP golgins; Arl1 is required
      for AP-1 recruitment and secretory granule formation in salivary gland; Golgi integrity unaffected.
- id: PMID:26116655
  title: The guanine exchange factor Gartenzwerg and the small GTPase Arl1 function in the same pathway
    with Arfaptin during synapse growth.
  findings:
  - statement: Arl1 co-immunoprecipitates with Arfaptin, is required for its Golgi localization in S2
      cells, and colocalizes with it at the Golgi of motor neuron soma; Arl1, Garz and Arfaptin interact
      genetically for synapse growth.
    supporting_text: These data demonstrate that both Arl1 and Garz colocalize with Arfip at the GA in
      motor neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Supports Arfaptin as an Arl1 effector at the Golgi; synapse-growth data are
      genetic-interaction phenotypes.
