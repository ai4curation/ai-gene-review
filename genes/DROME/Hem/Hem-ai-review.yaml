core_functions:
- description: Hem/Kette is a structural WRC subunit that partners with Cyfip and stabilises SCAR, enabling
    Rac-regulated, SCAR-dependent activation of Arp2/3 actin nucleation at the cell cortex.
  directly_involved_in:
