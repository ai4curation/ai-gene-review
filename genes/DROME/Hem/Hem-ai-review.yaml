id: P55162
gene_symbol: Hem
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hem (Kette, the Drosophila Nap1/NCKAP1 ortholog) is a large structural subunit of the WAVE
  regulatory complex, forming a heterodimer with Cyfip/Sra-1 that together with the SCAR-Abi-HSPC300 trimer
  holds SCAR inactive until Rac-dependent activation at the membrane. Hem is required to stabilise SCAR
  and the other subunits, so its loss abolishes WRC-driven, Arp2/3-dependent actin protrusions. In vivo,
  Hem/Kette is needed for axon growth and pathfinding, neuronal migration, myoblast fusion, neuromuscular
  junction growth and bristle morphogenesis; it is mostly cytoplasmic with a fraction at the membrane
  and focal contacts.
