    - rubric: specificity
      score: 4
    overall_notes: WAVE complex component that prevents SCAR degradation in neuronal
      migration is correct. The asymmetric neuroblast division role (insc, numb) is
      not covered by the review.
- source: Alliance_Automated
  text: Involved in several processes, including myoblast fusion; nervous system development;
    and regulation of Arp2/3 complex-mediated actin nucleation. Part of SCAR complex.
    Is active in neuromuscular junction. Is expressed in several structures, including
    adult head; ganglia; germline cell; neuroblasts; and tract. Used to study developmental
    disorder of mental health. Human ortholog(s) of this gene implicated in immunodeficiency
    72. Orthologous to several human genes including NCKAP1 (NCK associated protein
    1).
