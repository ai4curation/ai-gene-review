- source: Alliance_Imported
  text: HEM-protein (Hem) encodes a component of the WAVE Regulatory Complex. Hem
    product regulates processes such as neuronal migration and asymmetric division
    of neural precursors by inhibiting the product of SCAR degradation. In the asymmetric
    process, the Hem-pathway indirectly maintains proper localization of proteins
    such as those encoded by insc and numb.
  source_type: curated
  url: https://flybase.org/reports/Hem.html
