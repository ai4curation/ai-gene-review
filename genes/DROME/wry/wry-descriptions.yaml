  text: Enables Notch binding activity and receptor ligand activity. Involved in Notch
    signaling pathway and heart process. Located in cell surface. Is expressed in
    several structures, including adult head; embryonic central brain neurons; ganglia;
    larval nervous system; and larval ventral midline glial cell. Used to study dilated
    cardiomyopathy. Orthologous to human DNER (delta/notch like EGF repeat containing).
