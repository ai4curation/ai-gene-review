gene_symbol: wry
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Weary (Wry, CG31665) is a single-pass type I transmembrane protein with tandem calcium-binding
  EGF-like repeats that acts as a non-canonical Notch ligand. Unlike Delta and Serrate it lacks a DSL
  (Delta-Serrate-Lag2) domain, yet in cultured cells it mediates adhesion with Notch-expressing cells
  and trans-activates Notch in a gamma-secretase-dependent manner. wry deficiency causes dilated cardiomyopathy
  in adult flies, which is rescued by cardiac expression of Wry or of the canonical Notch ligands, and
  Wry can rescue cardiac but not wing defects caused by Serrate knockdown, indicating a role in Notch-dependent
  maintenance of adult heart function.
