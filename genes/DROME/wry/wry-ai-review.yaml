suggested_questions:
- question: Which Notch EGF repeats does Wry bind in the absence of a DSL domain, and does Wry signal
    in tissues other than the adult heart (it is a single-study ligand)?
suggested_experiments:
- description: Generate a clean wry null allele and test cardiac and other Notch-dependent phenotypes,
    together with direct binding assays of the purified Wry ectodomain to Notch EGF-repeat fragments.
