- source: Alliance_Automated
  text: Enables citrate transmembrane transporter activity and malate transmembrane
    transporter activity. Involved in malate transmembrane transport and mitochondrial
    citrate transmembrane transport. Located in Nebenkern and mitochondrion. Is expressed
    in Nebenkern; adult head; adult heart; and larval neuroblast. Used to study DiGeorge
    syndrome; combined D-2- and L-2-hydroxyglutaric aciduria; and mitochondrial metabolism
    disease. Human ortholog(s) of this gene implicated in 2-hydroxyglutaric aciduria;
    combined D-2- and L-2-hydroxyglutaric aciduria; and congenital myasthenic syndrome.
    Orthologous to human SLC25A1 (solute carrier family 25 member 1).
  source_type: automated
