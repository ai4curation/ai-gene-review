descriptions:
- source: Alliance_Imported
  text: scheggia (sea) encodes a carrier protein of the inner mitochondrial membrane
    that plays a central role in fatty acid and sterol biosynthesis. It catalyses
    an electroneutral exchange of citrate for another tricarboxylate, a dicarboxylate
    (L-malate), or phosphoenolpyruvate across the inner mitochondrial membrane. The
    product of sea is also required to prevent chromosome breaks.
  source_type: curated
  url: https://flybase.org/reports/sea.html
  source_id: FB:FBgn0037912
