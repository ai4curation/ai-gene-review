  label: Drosophila melanogaster
description: scheggia (sea, CG6782) encodes the Drosophila mitochondrial citrate carrier (DmCIC), the
  ortholog of human SLC25A1. A member of the mitochondrial carrier family with three SOLCAR repeats, it
  sits in the inner mitochondrial membrane and exports citrate from the matrix to the cytosol in exchange
  for malate; reconstituted recombinant Sea shows transport properties similar to mammalian citrate carriers.
  Cytosolic citrate supplied by Sea is cleaved by ATP-citrate lyase (ATPCL) to acetyl-CoA. sea mutants
  have impaired mitochondrial citrate efflux, reduced global histone acetylation, extensive chromosome
  breakage and ATR-dependent cell-cycle arrest in mitotic cells, and Sea is also found in the Nebenkern,
  the fused mitochondrial derivative of spermatids.
