suggested_questions:
- question: Does the chromosome breakage of sea mutants arise from reduced histone acetylation, from altered
    cytosolic lipid synthesis, or from another citrate-dependent process, given that ATPCL loss does not
    reduce global histone acetylation?
suggested_experiments:
- description: Supplement sea mutant larvae with acetate (to bypass citrate via acetyl-CoA synthetase)
    and score chromosome breaks and histone acetylation.
