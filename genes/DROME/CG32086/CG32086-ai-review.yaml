id: M9NF85
gene_symbol: CG32086
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG32086 (synonym CG6100) encodes an uncharacterized Drosophila member of the EFHB
  (EF-hand domain-containing family member B, CFAP21) subfamily of the EFHC/EFHB protein family. M9NF85
  is a 475-residue alternative isoform of the gene, identical to the 491-residue CG32086-RA product
  (Q8IQG0) except for a 16-residue internal deletion, and it retains the C-terminal EFHB-type EF-hand
  domain (residues 399-469). The fly protein lacks the canonical calcium-binding EF-hand loop present
  in vertebrate EFHB. The gene is expressed in elongating spermatids. Vertebrate EFHB proteins are
  microtubule inner proteins of ciliary and sperm flagellar doublet microtubules, and the fly protein
  is predicted by family membership to share that axonemal location, but no experimental study of
  CG32086 function, binding activity or localization has been reported.
