core_functions:
- description: Predicted structural component of the sperm flagellar axoneme. By EFHB-subfamily
    membership the protein is expected to act as a microtubule inner protein of axonemal doublet
    microtubules; its molecular activity is unknown, and calcium-sensor activity is not supported by
    the fly sequence.
  locations:
  - id: GO:0005879
    label: axonemal microtubule
  supported_by:
  - reference_id: file:DROME/CG32086/CG32086-bioinformatics/RESULTS-rereview.md
    supporting_text: Localization to axonemal doublet microtubules is the best-supported family-level inference;
      calcium-sensor activity is not supported by the fly sequence.
knowledge_gaps:
- gap_statement: The molecular activity and cellular location of the CG32086 product are undetermined;
    whether it is a microtubule inner protein of Drosophila sperm flagellar doublet microtubules, as its
    vertebrate EFHB relatives are, whether its non-canonical EF-hand region binds any metal ion, what it
    binds, and whether loss of function has a phenotype (alone or with its two EFHB-subfamily paralogs
    FBgn0053489 and FBgn0053490) are all untested.
  boundary: The gene is an EFHB-subfamily (PTHR12086:SF12) member expressed in elongating spermatids, and
    the encoded protein lacks a canonical calcium-binding EF-hand loop.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
suggested_questions:
- question: Should the IBA calcium ion sensor activity (GO:0061891), regulation of store-operated calcium
    entry and regulation of calcineurin-NFAT signaling terms on the CG32086-RA product (Q8IQG0) stand,
    given that the fly EFHB-subfamily proteins lack the canonical calcium-binding loop and the donor
    evidence is a single human study?
- question: Does the 16-residue segment present in Q8IQG0 but absent from M9NF85 have any isoform-specific
    role, or are the two products functionally equivalent?
suggested_experiments:
- description: Tag endogenous CG32086 and image elongating spermatids and mature sperm, and check for the
    protein in cryo-EM or proteomic analyses of fly sperm axonemal doublet microtubules.
  hypothesis: CG32086 is a microtubule inner protein of the sperm flagellar axoneme.
  experiment_type: localization
- description: Generate a CG32086 null allele, alone and combined with loss of the two EFHB-subfamily
    paralogs, and assay male fertility and sperm motility.
  hypothesis: The fly EFHB-subfamily proteins are redundantly required for sperm flagellar function.
  experiment_type: genetic loss of function
