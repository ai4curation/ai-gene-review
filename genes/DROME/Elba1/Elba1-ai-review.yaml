    supporting_text: DNA binding depends upon the BEN domains in Elba1 and Elba2
proposed_new_terms:
- proposed_name: Elba complex
  proposed_definition: A heterotrimeric nuclear protein complex consisting of two BEN-domain DNA-binding
    proteins (Elba1, Elba2) bridged by an adaptor (Elba3) that binds the CCAATAAG Elba site in chromatin
    boundary elements and confers developmentally restricted insulator activity. Described in Drosophila.
  justification: The Elba heterotrimer is currently annotated to chromatin silencing complex, which misdescribes
    an insulator/boundary complex.
suggested_questions:
- question: Is the Elba complex required for Fab-7 boundary function in vivo in its native chromosomal
    context, given the redundancy with GAF and other boundary factors and the non-essential nature of
    elba2?
suggested_experiments:
- description: Analyse abdominal segment identity and Fab-7 boundary function in elba1 null embryos and
    in Fab-7 alleles carrying mutated Elba sites, using CRISPR-engineered endogenous loci.
