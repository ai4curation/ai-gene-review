core_functions:
- description: BEN-domain subunit of the Elba heterotrimer that, with Elba2 and Elba3, binds the CCAATAAG
    Elba site in the Fab-7 boundary and confers early embryonic enhancer-blocking activity.
  contributes_to_molecular_function:
    id: GO:0043035
    label: chromatin insulator sequence binding
  directly_involved_in:
