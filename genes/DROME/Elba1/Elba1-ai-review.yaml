taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Elba1 (Bsg25A) is a BEN-solo domain DNA-binding protein expressed transiently around the
  blastoderm stage of Drosophila embryogenesis. Together with Elba2 and the adaptor Elba3 it forms the
  heterotrimeric Elba complex, in which the BEN domains of Elba1 and Elba2 jointly recognize the asymmetric
  CCAATAAG Elba site in the Fab-7 boundary of the bithorax complex and confer early, developmentally restricted
  enhancer-blocking (insulator) activity. On its own Elba1 can bind Insv-type CCAATTGG palindromes and
  repress reporters, but unlike Insv it does not regulate Notch signaling in neural development.
