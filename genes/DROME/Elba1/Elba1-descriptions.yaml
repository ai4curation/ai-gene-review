    overall_notes: 'Correct and specific: Elba heterotrimer binds CCAATAAG in the
      Fab-7 boundary for early embryonic insulator activity; Elba1 alone binds CCAATTGG
      and represses.'
- source: Alliance_Automated
  text: Contributes to chromatin insulator sequence binding activity and sequence-specific
    DNA binding activity. Involved in embryonic development via the syncytial blastoderm
    and heterochromatin boundary formation. Located in nucleus. Part of chromatin
    silencing complex. Is expressed in anlage in statu nascendi; central brain anlage
    in statu nascendi; and ectoderm anlage.
