descriptions:
- source: UniProt
  text: Myosin is a protein that binds to actin and has ATPase activity that is activated
    by actin. Together CLIP-190 and jar may coordinate the interaction between the
    actin and microtubule cytoskeleton. May link endocytic vesicles to microtubules
    and may be involved in transport in the early embryo and in the dynamic process
    of dorsal closure. It is believed that its function changes during the life cycle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01989
  source_id: Q01989
