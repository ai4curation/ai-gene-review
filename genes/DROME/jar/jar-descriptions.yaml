    - rubric: specificity
      score: 2
    overall_notes: Opens with generic myosin text and hedged claims (CLIP-190 coordination,
      endocytic vesicles, dorsal closure). No minus-end motility, spermatid individualization
      or Miranda transport.
- source: Alliance_Automated
  text: Enables calmodulin binding activity and cytoskeletal protein binding activity.
    Involved in several processes, including cytoskeleton organization; embryonic
    development via the syncytial blastoderm; and germ cell development. Located in
    several cellular components, including germline ring canal; growth cone; and investment
    cone. Part of microtubule associated complex and myosin VI complex. Is expressed
    in several structures, including adult heart; anterior-posterior subdivision of
    organism; brain; follicle cell; and spermatozoon. Human ortholog(s) of this gene
    implicated in autosomal dominant nonsyndromic deafness 22; autosomal recessive
    nonsyndromic deafness 37; ovarian cancer; and sensorineural hearing loss. Orthologous
    to human MYO6 (myosin VI).
  source_type: automated
