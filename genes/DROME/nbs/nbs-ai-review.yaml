suggested_questions:
- question: Does the Nbs FHA domain bind phosphorylated CtIP or other phospho-proteins in Drosophila,
    explaining its specific requirement for HR repair but not for the checkpoint?
suggested_experiments:
- hypothesis: The Nbs-HOAP interaction is required for telomere capping independently of Nbs-dependent
    nuclear import of Mre11-Rad50.
  description: Map and mutate the HOAP-binding surface of Nbs, then test telomere fusion and MR nuclear
    localization in nbs mutant rescue lines.
