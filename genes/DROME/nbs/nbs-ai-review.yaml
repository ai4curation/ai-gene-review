id: Q9VT40
gene_symbol: nbs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: nbs encodes the Drosophila ortholog of NBN (nibrin), the regulatory subunit of the Mre11-Rad50-Nbs
  (MRN) complex, with an N-terminal FHA domain and BRCT domains. Nbs interacts with Mre11 and imports
  the Mre11-Rad50 complex into the nucleus and onto chromatin. It is required for both ATM (tefu) and
  ATR (mei-41)-dependent DNA damage responses, including the radiation-induced G2/M checkpoint, p53- and
  Chk2 (Mnk)-dependent signaling, and homologous recombination gap repair. Its FHA domain is needed for
  HR repair and radiation resistance but only marginally for the checkpoint. Nbs also protects telomeres
  from fusion in both ATM- and ATR-controlled pathways, interacts with the capping protein HOAP, and a
  maternal Nbs pool is essential for telomere capping in the early embryo.
