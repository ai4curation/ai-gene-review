descriptions:
- source: Alliance_Imported
  text: nbs (nbs) encodes a component of the conserved MRN complex, which plays an
    important role in the repair of DNA double strand breaks. The product of nbs is
    required to prevent chromosome breakage, interacts with the telomere capping complex
    and prevents telomeric fusions.
