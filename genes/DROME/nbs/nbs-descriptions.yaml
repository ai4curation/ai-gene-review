  text: Predicted to enable damaged DNA binding activity. Involved in DNA metabolic
    process and intracellular signal transduction. Located in nucleus. Part of Mre11
    complex. Human ortholog(s) of this gene implicated in several diseases, including
    Nijmegen breakage syndrome; acute lymphoblastic leukemia; aplastic anemia; rectum
    cancer; and reproductive organ cancer (multiple). Orthologous to human NBN (nibrin).
