- source: Alliance_Automated
  text: Predicted to enable 3'-5'-RNA exonuclease activity and polyribonucleotide
    nucleotidyltransferase activity. Involved in mitochondrial mRNA catabolic process.
    Part of mitochondrial degradosome. Is active in mitochondrion. Is expressed in
    several structures, including adult head; embryonic/larval midgut primordium;
    gut section; larval central nervous system; and somatic trunk mesoderm derivative.
    Human ortholog(s) of this gene implicated in autosomal recessive nonsyndromic
    deafness 70; combined oxidative phosphorylation deficiency 13; sensorineural hearing
    loss; and spinocerebellar ataxia 25. Orthologous to human PNPT1 (polyribonucleotide
    nucleotidyltransferase 1).
