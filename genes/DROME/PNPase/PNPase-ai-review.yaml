suggested_questions:
- question: Does fly PNPase, like human PNPT1, also occupy the intermembrane space and contribute to RNA
    import into mitochondria, or is it exclusively a matrix degradosome component?
suggested_experiments:
- hypothesis: Fly PNPase catalytic activity, not only its presence, is required to prevent mitochondrial
    dsRNA accumulation and release.
  description: Rescue dmpnpase knockout larvae with wild-type or phosphorolysis-dead PNPase and quantify
    antisense RNA, J2-positive dsRNA in mitochondrial and cytosolic fractions, and immune gene induction.
  experiment_type: genetic rescue
