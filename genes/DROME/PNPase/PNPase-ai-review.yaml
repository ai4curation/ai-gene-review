id: Q9V9X7
gene_symbol: PNPase
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: PNPase (CG11337) is the Drosophila mitochondrial polynucleotide phosphorylase, a trimeric
  phosphorolytic 3'-5' exoribonuclease of the PNPase/RNase PH family with KH and S1 RNA-binding domains.
  With the helicase SUV3 it forms the mitochondrial degradosome, which degrades mitochondrial mRNAs that
  are not protected by LRPPRC and rapidly removes non-coding antisense transcripts generated by bidirectional
  mitochondrial transcription. Loss of PNPase in flies stabilizes mitochondrial mRNAs and antisense RNAs,
  impairs respiratory chain function and leads to accumulation of mitochondrial double-stranded RNA, some
  of which escapes to the cytosol.
