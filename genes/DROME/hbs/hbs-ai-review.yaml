  - *id010
suggested_questions:
- question: Is the Hbs requirement for Presenilin maturation and Notch signaling a cell-autonomous trafficking
    role of the cytodomain, or a consequence of IRM adhesion?
suggested_experiments:
- hypothesis: The Hbs cytoplasmic domain mediates the Presenilin interaction independently of extracellular
    IRM binding.
  description: Rescue hbs mutants with ectodomain-deleted or cytodomain-deleted Hbs and assay Psn maturation,
    Notch reporter activity and ommatidial sorting.
