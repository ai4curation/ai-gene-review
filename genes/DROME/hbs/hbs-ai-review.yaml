taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hibris (Hbs) is a Nephrin-like single-pass transmembrane protein of the immunoglobulin superfamily,
  with eight Ig-like domains, a fibronectin type III domain and a cytoplasmic tail, and is a paralog of
  Sticks and stones (Sns). As a member of the Irre cell recognition module, Hbs engages in heterophilic
  adhesion with the Neph-like proteins Kirre (Dumbfounded) and Roughest (Rst). Hbs binds Kirre in cell
  aggregation assays and in vivo; binding to Rst is detected biophysically with low-micromolar affinity
  through the first Ig domain of Rst, although Hbs-expressing S2 cells did not aggregate with Rst-expressing
  cells. In fusion-competent myoblasts Hbs acts partly redundantly with Sns as a ligand for founder-cell
  Kirre/Rst during myoblast fusion. In the pupal eye Hbs in primary pigment cells engages Kirre/Rst in
  interommatidial cells to drive preferential adhesion and cell sorting, with its apical localisation stabilised by the adaptor Cindr. Hbs is also
  required for Presenilin maturation and normal Notch signaling, and contributes to sensory organ spacing.
