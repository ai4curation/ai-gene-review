core_functions:
- description: Hbs, displayed on fusion-competent myoblasts and primary pigment cells, binds the Neph-like
    IRM proteins Kirre and (with low affinity) Rst in trans, mediating heterophilic cell-cell adhesion that drives myoblast
    fusion (redundantly with Sns) and preferential adhesion-based cell sorting in the pupal eye.
  molecular_function:
