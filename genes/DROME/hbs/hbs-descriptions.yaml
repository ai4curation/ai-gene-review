- source: Alliance_Automated
  text: Enables cell adhesion mediator activity. Involved in several processes, including
    Malpighian tubule stellate cell differentiation; heterophilic cell-cell adhesion;
    and sensory organ development. Located in adherens junction. Part of protein complex
    involved in cell adhesion. Is active in apical plasma membrane. Colocalizes with
    endosome. Is expressed in several structures, including PNS glial cell; epithelium;
    imaginal disc; light-sensitive neurons; and presumptive wing vein. Human ortholog(s)
    of this gene implicated in nephrotic syndrome type 1. Orthologous to human NPHS1
    (NPHS1 adhesion molecule, nephrin).
