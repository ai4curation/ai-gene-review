- question: Does betaTub97EF upregulation contribute causally to cellular cold acclimation (e.g. GO:0070417 cellular
    response to cold), or is the cold-induced expression a regulatory feature of the locus with the protein simply
    stabilizing whatever microtubules it joins?
- question: Which UniProt accession (Q8MST5/E1JIZ8 versus Q9VAX7) corresponds to the exon-4B versus exon-4C splice
    form described by Myachina et al. 2017?
suggested_experiments:
- description: Purify recombinant betaTub97EF-4B and -4C heterodimers (or betaTub56D/97EF chimeras) and measure
    dynamic instability parameters (catastrophe and rescue frequencies, GTP hydrolysis rate) in vitro across 14-30
    C to identify the core residues responsible for stabilization.
