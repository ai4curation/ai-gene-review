taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Beta-tubulin 97EF is a tissue-regulated beta-tubulin subunit that contributes to cytoplasmic
  microtubule structure. Its major exon-4B form is induced at low temperature and promotes microtubule
  stability, particularly in gut and hemocytes. The minor exon-4C form has a different temperature response
  and greater overexpression toxicity. Both forms retain the conserved guanine-nucleotide-binding tubulin
  architecture.
