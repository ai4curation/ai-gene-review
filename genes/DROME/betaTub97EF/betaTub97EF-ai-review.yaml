id: Q8MST5
gene_symbol: betaTub97EF
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: betaTub97EF encodes one of the five beta-tubulins of Drosophila melanogaster, a lineage-specific beta-tubulin
  isotype conserved across arthropods. It assembles with alpha-tubulin into cytoplasmic microtubules, binds the
  exchangeable GTP of the heterodimer, and gives the polymer unusually high resistance to depolymerization; the
  stabilizing property maps mainly to its tubulin core rather than its C-terminal tail. Expression is tissue-restricted,
  highest in gut epithelia (notably embryonic hindgut boundary cells) and also in hemocytes, wing discs and follicle
  cells, and is selectively increased at low temperature. Mutually exclusive internal exons (4B, the major cold-induced
  form, and 4C, a minor form) generate two isoforms that differ at 13 positions between residues 177 and 223. Null
  mutants are viable and fertile but show mildly reduced embryonic survival in the cold, consistent with a role
  in cold acclimation through microtubule stabilization.
