  review:
    action: ACCEPT
    summary: 'Q8MST5 is a full-length beta-tubulin (457 aa, intact tubulin GTPase and C-terminal domains) in the
      beta-tubulin clade under the tubulin-root PAINT node PTN000172598; within PANTHER it is the sole fly member
      of subfamily SF490 and its own tree node, sister to the clade holding betaTub56D, betaTub60D and betaTub65B.
      The IBA is consistent with gene-specific data: betaTub97EF incorporates into cytoplasmic microtubules, and
      changing its proportion in hemocytes or removing it in the gut alters microtubule stability. Organizing the
      microtubule cytoskeleton by being polymerized into it is direct participation.'
