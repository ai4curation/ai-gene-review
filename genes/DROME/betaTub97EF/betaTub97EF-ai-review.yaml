  review:
    action: ACCEPT
    summary: The exchangeable GTP of the alpha/beta heterodimer is bound by beta-tubulin (E site) and is hydrolysed
      after incorporation into the lattice; the catalytic residue is contributed by the alpha-tubulin of the next
      dimer, so the active site is composite. Q8MST5 has an intact tubulin/FtsZ GTPase domain in the beta-tubulin
      clade, so it supplies the nucleotide-binding half of the hydrolytic site. Accepted as a conserved family property,
      noting that no betaTub97EF-specific GTPase rate has been measured and that the activity is realized only in
      the polymer.
