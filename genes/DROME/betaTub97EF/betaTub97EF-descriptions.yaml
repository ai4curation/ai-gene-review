- source: Alliance_Imported
  text: '&bgr;-Tubulin at 97EF (&bgr;Tub97EF) is one of five distinct paralogs that
    codes for a &bgr;-tubulin protein. &bgr;-tubulin protein can polymerize into microtubules
    after heterodimerization with an &agr;-tubulin protein. &bgr;Tub97EF expression
    is tissue-specific and up-regulated at low temperature. Microtubules containing
    this beta-tubulin are relatively stable.'
  source_type: curated
