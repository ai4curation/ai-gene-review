- source: Alliance_Automated
  text: Predicted to enable GTP binding activity. Predicted to be a structural constituent
    of cytoskeleton. Involved in imaginal disc fusion, thorax closure. Predicted to
    be located in microtubule cytoskeleton. Predicted to be active in cytoplasm and
    microtubule. Is expressed in several structures, including adult glial cell; adult
    head; adult heart; neuromuscular junction; and spermatozoon. Human ortholog(s)
    of this gene implicated in autosomal dominant isolated macrothrombocytopenia 1.
    Orthologous to human TUBB1 (tubulin beta 1 class VI).
