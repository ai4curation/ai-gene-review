suggested_questions:
- question: Do the alpha, beta and gamma LSP-1 subunits assemble randomly into mixed hexamers, and do
    individual subunits differ in uptake by the fat body receptor or in amino acid composition?
suggested_experiments:
- description: Subunit-specific knockouts of Lsp1alpha, Lsp1beta and Lsp1gamma, with quantification of
    hexamer composition and adult tissue growth, to test whether the subunits are functionally redundant.
