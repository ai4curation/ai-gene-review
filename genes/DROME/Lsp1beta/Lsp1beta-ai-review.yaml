description: Lsp1beta encodes the beta subunit of larval serum protein 1 (LSP-1), a hexamerin storage
  protein of Drosophila melanogaster. Hexamerins belong to the arthropod hemocyanin/phenoloxidase superfamily
  but have lost the copper-binding sites and oxygen-carrying function. LSP-1 is synthesized by the larval
  fat body and secreted into the hemolymph, where it becomes the major hemolymph protein of late third-instar
  larvae; it is a family of hexamers assembled from three related subunits, alpha, beta and gamma, encoded
  by genes on different chromosomes. Around pupariation the hexamers are taken back up into the fat body
  and serve as a reserve of amino acids that is mobilized during the non-feeding pupal stage to build
  adult tissues; preventing hexamerin accumulation alters the allocation of amino acids between early-
  and late-forming organs and reduces adult fitness.
