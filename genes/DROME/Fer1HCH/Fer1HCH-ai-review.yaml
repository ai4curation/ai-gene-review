suggested_questions:
- question: What hemolymph receptor or uptake route takes up iron-loaded secreted ferritin in target tissues,
    and how is iron released from it?
- question: Is the IRE-lacking Fer1HCH mRNA isoform induced by iron loading the main source of Fer1HCH
    protein under iron overload?
suggested_experiments:
- hypothesis: Iron-loaded secreted ferritin is endocytosed by specific tissues such as nephrocytes and
    the nervous system.
  description: Track fluorescently tagged holoferritin injected into or expressed from the gut of ferritin-deficient
    larvae, and screen candidate endocytic receptors by tissue-specific RNAi for loss of uptake.
