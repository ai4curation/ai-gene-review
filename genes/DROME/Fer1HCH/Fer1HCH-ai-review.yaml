gene_symbol: Fer1HCH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Fer1HCH encodes the heavy-chain homolog (H subunit) of Drosophila secreted ferritin. Twelve
  Fer1HCH and twelve Fer2LCH subunits assemble in the secretory pathway into a 24-mer iron-storage cage
  that is loaded with iron in the Golgi and secreted into hemolymph. Fer1HCH carries the ferroxidase center
  that oxidizes Fe(2+) for deposition as a ferric mineral core, and this activity is essential in vivo.
  Ferritin is required in midgut enterocytes for dietary iron absorption, exporting iron toward the hemolymph,
  and in other tissues for sequestering and detoxifying excess iron; ferritin loss causes embryonic and
  early larval lethality. Fer1HCH transcripts carry an iron-responsive element and their processing is
  regulated by dietary iron.
