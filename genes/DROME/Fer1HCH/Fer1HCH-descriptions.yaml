descriptions:
- source: UniProt
  text: Stores iron in a soluble, non-toxic, readily available form (By similarity)
    (PubMed:23771129). Important for iron homeostasis (By similarity) (PubMed:23064556,
    PubMed:23771129). Iron is taken up in the ferrous form and deposited as ferric
    hydroxides after oxidation (By similarity) (PubMed:17603097, PubMed:23771129).
    Ferritin is composed of a heavy (H) chain which is responsible for the oxidation
    and uptake of ferrous iron, and a light (L) chain which facilitates the nucleation
    of the ferrihydrite iron core (PubMed:23771129). Required for dietary iron absorption
    in the midgut (PubMed:23064556). Involved in tissue iron detoxification by exporting
    excess iron (PubMed:23064556). Functions as an antioxidant and protects the developing
    organs from cell-mediated ferroptosis (PubMed:31568497). Required for embryo and
    larval development (PubMed:26192321). Plays a role in blood cell (haemocyte) differentiation
    in the lymph gland at the larval stage (PubMed:29237257). May also store Zn(2+)
    and Mn(2+) and thus may play a role in zinc and manganese homeostasis (PubMed:23771129).
  source_type: curated
