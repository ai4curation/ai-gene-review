- source: Alliance_Imported
  text: Ferritin 1 heavy chain homologue (Fer1HCH) encodes one of two subunits of
    the major iron storage complex, the ferritin molecule. In insects, ferritin is
    assembled from 12 Fer1HCH and 12 Fer2LCH subunits and can be found in the secretory
    pathway of cells and in hemolymph. The product of Fer1HCH has ferroxidase activity
    required for iron loading into ferritin and is essential for embryogenesis.
  source_type: curated
