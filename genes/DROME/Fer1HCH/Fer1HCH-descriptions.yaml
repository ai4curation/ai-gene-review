- source: Alliance_Automated
  text: Enables ferrous iron binding activity. Involved in several processes, including
    detoxification of iron ion; iron ion import across plasma membrane; and sleep.
    Located in Golgi apparatus; extracellular region; and fusome. Part of ferritin
    complex. Is expressed in several structures, including anterior-posterior subdivision
    of organism; brain; epithelial cell; nephrocyte; and somatic trunk mesoderm derivative.
