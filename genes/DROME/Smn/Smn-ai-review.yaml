    label: SMN-Gemin2 complex
  supported_by:
  - reference_id: PMID:18621711
    supporting_text: An affinity chromatography strategy has permitted us the purification of an assembly-active
      complex composed of SMN and Gemin2 only.
  - reference_id: PMID:18621711
