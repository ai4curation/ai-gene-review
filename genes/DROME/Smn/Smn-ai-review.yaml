suggested_questions:
- question: Which of the Smn loss-of-function phenotypes (NMJ, locomotion, stem cell, tracheal lumen,
    sarcomere) are explained by reduced snRNP assembly and U12 splicing, and which reflect snRNP-independent
    activities of Smn?
- question: Should FlyBase retain mRNA splicing, via spliceosome (IMP) citing PMID:22813737, given that
    the paper reports no appreciable minor-intron splicing defects in Smn null larvae?
- question: Is the Smn requirement in tracheal terminal cell lumen formation (single RNAi line) reproducible
    with independent alleles or RNAi lines and rescue, and does it depend on Zpr1-Smn interaction?
- question: Is the Smn-alpha-actinin association a direct functional interaction relevant to sarcomere
    assembly, or a secondary association of the SMN complex with Z-line proteins?
suggested_experiments:
- description: Express Smn variants that separately disrupt Gemin2 binding, Tudor-domain Sm protein binding
    or YG-box oligomerization in an Smn null background, and measure Sm core assembly, snRNA levels, U12
    splicing and NMJ/locomotor phenotypes to separate snRNP-dependent from snRNP-independent functions.
- description: Repeat tracheal terminal-cell analysis with Smn null mosaic (MARCM) clones and transgenic
    rescue to confirm a cell-autonomous Smn requirement for lumen formation.
