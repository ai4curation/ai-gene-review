core_functions:
- description: Core scaffold of the SMN-Gemin2 complex that binds Sm proteins and transfers them onto
    Sm-site spliceosomal snRNAs to assemble the Sm core of U snRNPs in the cytoplasm, discriminating target
    from non-target RNAs.
  contributes_to_molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
