id: Q9VV74
gene_symbol: Smn
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Survival motor neuron protein (Smn), the single Drosophila ortholog of human SMN1/SMN2.
  Smn is a 226-residue protein with an N-terminal Gemin2-binding region, a central Tudor domain and a
  C-terminal YG-box region that mediates self-association. It forms the core of the SMN complex, which
  in flies is unusually simple: an assembly-active Smn-Gemin2 heterodimer that associates with Gemin3,
  Gemin5 (rigor mortis) and a Gemin4 ortholog. The complex binds the full set of Sm proteins and loads
  them onto Sm-site containing spliceosomal snRNAs in the cytoplasm, while preventing misassembly on non-target
  RNAs. Smn is mainly cytoplasmic and enriched in cytoplasmic U snRNP bodies (U bodies); a minor pool
  is found in nuclear Cajal bodies and gems, and in muscle it also localizes to sarcomeric Z lines/I bands,
  where it associates with alpha-actinin, and to the postsynaptic side of the neuromuscular junction.
  Smn is essential: loss reduces snRNA levels (particularly minor-spliceosome snRNAs), perturbs splicing
  of a subset of U12 introns, and causes larval arrest, reduced locomotion, neuromuscular junction and
  motor-circuit defects, and stem cell and germline defects, making the fly a model for spinal muscular
  atrophy.'
