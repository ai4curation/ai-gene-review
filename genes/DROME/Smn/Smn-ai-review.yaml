- term:
    id: GO:0140597
    label: protein carrier chaperone
  evidence_type: IDA
  original_reference_id: PMID:18621711
  qualifier: contributes_to
  review:
    summary: The purified Smn-Gemin2 complex binds the complete set of Sm proteins and transfers them
      exclusively onto Sm-site snRNAs.
    action: NEW
    reason: Direct biochemical evidence that the Smn-Gemin2 heterodimer acts as an assembly chaperone
      that carries Sm proteins and delivers them to cognate snRNAs. Smn contributes to this activity as
      a subunit of the complex (Gemin2 is the other stoichiometric component), hence contributes_to. This
      captures the molecular activity underlying the accepted spliceosomal snRNP assembly annotations;
      no existing MF row describes it.
    supported_by:
    - reference_id: PMID:18621711
      supporting_text: Simultaneous incubation of all heterooligomers with the dSMN/dGemin2 dimer resulted
        in its efficient loading with the complete set of Sm proteins
    - reference_id: PMID:18621711
      supporting_text: In contrast, Sm proteins bound to the SMN complex were exclusively transferred
        onto the cognate snRNA
    - reference_id: file:DROME/Smn/Smn-deep-research-manual.md
      supporting_text: The SMN-Gemin2 complex carries the whole set of Sm proteins
