- source: Alliance_Automated
  text: Enables alpha-actinin binding activity and identical protein binding activity.
    Involved in several processes, including chemical synaptic transmission; protein-RNA
    complex assembly; and synapse organization. Acts upstream of or within P-body
    assembly. Located in several cellular components, including Z disc; cytoplasmic
    U snRNP body; and nuclear body. Part of SMN complex; SMN-Gemin2 complex; and SmD-containing
    SMN-Sm protein complex. Is expressed in several structures, including adult head;
    anterior endoderm anlage; ganglia; germline cell; and gonad. Used to study childhood
    spinal muscular atrophy; intermediate spinal muscular atrophy; juvenile spinal
    muscular atrophy; and spinal muscular atrophy. Human ortholog(s) of this gene
    implicated in Werdnig-Hoffmann disease; adult spinal muscular atrophy; intermediate
    spinal muscular atrophy; juvenile spinal muscular atrophy; and spinal muscular
    atrophy. Orthologous to human SMN1 (survival of motor neuron 1, telomeric) and
    SMN2 (survival of motor neuron 2, centromeric).
