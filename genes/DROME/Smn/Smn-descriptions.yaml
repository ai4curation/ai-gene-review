- source: Alliance_Imported
  text: survival motor neuron (Smn) encodes the eponymous member of the SMN complex,
    which functions as an assembly chaperone for Sm-class small nuclear ribonucleoproteins.
    The SMN complex contains three other 'Gemin' proteins encoded by Gem2, Gem3 and
    rig. Smn is essential for viability but higher levels of the protein are required
    for proper neuromuscular development and function.
