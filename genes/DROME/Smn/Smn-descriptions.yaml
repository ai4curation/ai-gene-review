descriptions:
- source: UniProt
  text: Core component of the survival motor neuron (SMN) complex that plays an essential
    role in spliceosomal small nuclear ribonucleoprotein (snRNP) assembly in the cytoplasm,
    is required for pre-mRNA splicing in the nucleus and acts as a chaperone that
    discriminates target and non-target RNAs of Sm proteins (PubMed:18923150, PubMed:23063130,
    PubMed:23063131, PubMed:30563832). A major component of nuclear bodies known as
    gems (gemini of Cajal bodies) thought to be storage depots of excess SMN complexes
    (PubMed:21627586). Required for normal expression of spliceosomal snRNAs and for
    U12 intron splicing. Required in cholinergic neurons, but not in motor neurons,
    to ensure correct splicing and proper levels of stas mRNA and normal neurotransmitter
    release by motor neurons (PubMed:23063130, PubMed:23063131). However, Smn is required
    in motor neurons, but not in cholinergic neurons, for normal motor behavior but
    plays no role in synaptic transmission according to a report (PubMed:23103409).
    In both muscle and neurons, required for the formation of a normal neuromuscular
    junction (NMJ) structure. Plays a neuron-specific role in long-term homeostatic
    compensation at the larval NMJ. In the thorax of adult flies, required for Act88F,
    an indirect flight muscle (IFM)-specific actin, expression and for proper IFM
    myofibril formation. In nurse cells, oocytes and follicle cells, required to maintain
    normal organization of nuclear compartments including chromosomes, nucleoli, Cajal
    bodies, histone locus bodies and heterochromatin. Required for the functional
    integrity of the cytoplasmic U snRNP body (U body) and P body. Required in dividing
    postembryonic neuroblasts (pNBs) for the correct basal localization of mira. The
    tight regulation of its expression is critical for stem cell division, proliferation
    and differentiation in male germline and developing central nervous system (CNS).
    Required for tracheal terminal cell lumen formation.
