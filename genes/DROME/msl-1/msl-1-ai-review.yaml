id: P50535
gene_symbol: msl-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: msl-1 (male-specific lethal 1) encodes the central scaffold subunit of the MSL dosage compensation
  complex in Drosophila males. MSL1 forms a homodimer through a coiled-coil, and two MSL2 subunits bind
  the MSL1 dimer; its C-terminal PEHE region binds MOF and MSL3, so MSL1 bridges the targeting, acetyltransferase
  and chromatin-reading subunits. Dimerization of MSL1 is required for targeting and spreading of the
  complex along the male X chromosome, where the complex binds active genes, especially their 3' ends,
  and directs H4K16 acetylation by MOF to raise transcription about two-fold; loss of msl-1 is male-lethal.
  MSL1 is itself ubiquitylated by MSL2, and in both sexes it can bind gene promoters independently of
  the other MSL proteins.
