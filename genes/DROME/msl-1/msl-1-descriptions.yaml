- source: Alliance_Imported
  text: male-specific lethal 1 (msl-1) encodes a protein that is thought to form a
    scaffold to organize the full male-specific-lethal dosage compensation complex,
    which increases male X chromosome transcription approximately two-fold. msl-1
    homozygous mutant males die as larvae, while females are viable.
