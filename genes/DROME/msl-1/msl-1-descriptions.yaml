descriptions:
- source: UniProt
  text: 'Component of the male-specific lethal (MSL) histone acetyltransferase complex,
    a multiprotein complex essential for elevating transcription of the single X chromosome
    in the male (X chromosome dosage compensation) (PubMed:21726816, PubMed:7781064).
    The MSL complex specifically associates with the single X chromosome in males
    and mediates formation of H4K16ac, promoting a two-fold activation of X chromosome
    (PubMed:16543150, PubMed:18510926). In complex with msl-2, promotes ubiquitination
    of histone H2B (PubMed:21726816). In addition to its role in dosage compensation
    in males, regulates the activity of gene promoters: acts together with Cdk7 to
    promote phosphorylation of ''Ser-5'' of the C-terminal heptapeptide repeat domain
    (CTD) of the largest RNA polymerase II subunit Polr2A (PubMed:27183194).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50535
