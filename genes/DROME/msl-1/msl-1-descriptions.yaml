- source: Alliance_Automated
  text: Enables transcription cis-regulatory region binding activity. Contributes
    to chromatin binding activity. Involved in dosage compensation by hyperactivation
    of X chromosome. Located in nuclear chromosome. Part of MSL complex and X chromosome
    located dosage compensation complex, transcription activating. Is active in X
    chromosome. Is expressed in central brain primordium; embryonic brain; larval
    ventral nerve cord; posterior midgut primordium; and trunk mesoderm. Orthologous
    to human MSL1 (MSL complex subunit 1).
