descriptions:
- source: Alliance_Imported
  text: Eb1 (Eb1) encodes a microtubule end-binding protein that contributes to organization
    of the microtubule cytoskeleton. It is involved in chromosome segregation, wound
    healing and flight behavior.
  source_type: curated
  url: https://flybase.org/reports/Eb1.html
  source_id: FB:FBgn0027066
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct microtubule plus-end binding protein organizing the cytoskeleton,
      in chromosome segregation. Wound healing and flight behavior are peripheral
      phenotypes; the review marks wound healing as over-annotated.
- source: Alliance_Automated
  text: Enables microtubule plus-end binding activity and myosin binding activity.
    Involved in several processes, including melanotic encapsulation of foreign target;
    microtubule cytoskeleton organization; and pseudocleavage involved in syncytial
    blastoderm formation. Located in axonal growth cone; cytoplasm; and microtubule.
    Colocalizes with cytoplasmic microtubule; microtubule plus-end; and spindle microtubule.
    Is expressed in several structures, including adult head; embryonic/larval dorsal
    vessel; embryonic/larval optic lobe; female germline cell; and larval muscle cell.
    Human ortholog(s) of this gene implicated in congenital symmetric circumferential
    skin creases 2. Orthologous to several human genes including MAPRE1 (microtubule
    associated protein RP/EB family member 1) and MAPRE3 (microtubule associated protein
    RP/EB family member 3).
  source_type: automated
  url: https://flybase.org/reports/Eb1.html
  source_id: FB:FBgn0027066
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Plus-end binding is correct, but leads with melanotic encapsulation
      (marked over-annotated in the review) and pseudocleavage, and omits spindle
      function and partner recruitment.
