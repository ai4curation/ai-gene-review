- term:
    id: GO:0000022
    label: mitotic spindle elongation
  evidence_type: IDA
  original_reference_id: PMID:12213835
  qualifier: involved_in
  review:
    summary: Anti-EB1 antibody injection into syncytial embryos caused defective anaphase spindle elongation
      (live imaging), consistent with EB1 promoting microtubule growth in the central spindle.
    action: ACCEPT
    reason: Direct in vivo evidence in Drosophila (Rogers et al. 2002). EB1, as the core plus-end tracking
      protein, sustains growth of interpolar microtubules, which contributes to anaphase B spindle elongation;
      Dm EB1 accumulates on interpolar bundles in late anaphase. This is a genuine role of the gene product
      in spindle mechanics, not a remote organismal phenotype.
    supported_by:
    - reference_id: PMID:12213835
      supporting_text: live cell imaging of mitosis in Drosophila embryos reveals defective spindle elongation
        and chromosomal segregation during anaphase after antibody injection
    - reference_id: PMID:12213835
      supporting_text: Embryos in late anaphase and telophase also showed a dramatic accumulation of Dm
        EB1 staining on interpolar microtubule bundles and midbodies
- term:
