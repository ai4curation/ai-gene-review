core_functions:
- description: 'Microtubule plus-end tracking: Dm EB1 autonomously recognises growing microtubule plus
    ends and forms comets on interphase, astral and spindle microtubules. This function is experimentally
    established in Drosophila and is ancestral to eukaryotic EB proteins (PAINT node PTN000065701).'
  molecular_function: *id002
  locations:
  - *id001
  directly_involved_in:
  - *id003
  supported_by:
  - reference_id: PMID:12213835
    supporting_text: Dm EB1 staining clearly coincided with individual microtubules and exhibited a comet-like
      gradient of staining, with the greatest intensity at the most distal tip of the microtubule
  - reference_id: PMID:12213835
    supporting_text: depletion of EB1 by RNA-mediated inhibition (RNAi) in interphase cells causes a dramatic
      increase in nondynamic microtubules (neither growing nor shrinking)
  - reference_id: PMID:21646401
    supporting_text: These results indicate that EB1 promotes dynamic microtubule behavior by recruiting
      the cargo protein Sentin and possibly also a microtubule polymerase to the microtubule tip
- description: 'Plus-end platform that recruits partner +TIPs: through its C-terminal EB homology domain
    and acidic tail, Dm EB1 binds and recruits Sentin, the spectraplakin Shot and CLIP-190 to growing
    plus ends. These are fly-specific experimental findings.'
  molecular_function: *id002
  locations:
  - *id001
  directly_involved_in:
  - id: GO:1904825
    label: protein localization to microtubule plus-end
  supported_by:
  - reference_id: PMID:21646401
    supporting_text: We demonstrate that Sentin's association with EB1 was critical for its plus end localization
      and function
  - reference_id: PMID:21646401
    supporting_text: we purified the C-terminal 142 aa of Sentin (841–982) tagged with GFP and showed
      its direct binding to GST-EB1C (209–292 aa) but not to GST-EB1N (1–208 aa) in vitro
  - reference_id: PMID:15699215
    supporting_text: In EB1 RNAi-treated cells, Shot never associated with microtubules (n = 900 cells),
      either at their tips or along their length
  - reference_id: PMID:16105886
    supporting_text: directly interacts with the CAP-Gly domain of CLIP-190 and is required to localise
      CLIP-190 at microtubule plus-ends
- description: 'Mitotic spindle assembly and function: by sustaining astral and interpolar microtubule
    growth, Dm EB1 is required for astral microtubules, focused spindle poles, central spindle positioning
    and anaphase spindle elongation in S2 cells and syncytial embryos.'
  molecular_function: *id002
  locations:
  - id: GO:0005876
    label: spindle microtubule
  directly_involved_in:
  - id: GO:0051225
    label: spindle assembly
  - id: GO:0000022
    label: mitotic spindle elongation
  supported_by:
  - reference_id: PMID:12213835
    supporting_text: several defects in microtubule organization are observed in RNAi-treated mitotic
      cells, including a drastic reduction in astral microtubules, malformed mitotic spindles, defocused
      spindle poles, and mispositioning of spindles away from the cell center
  - reference_id: PMID:12213835
    supporting_text: live cell imaging of mitosis in Drosophila embryos reveals defective spindle elongation
      and chromosomal segregation during anaphase after antibody injection
suggested_questions:
- question: Does Dm EB1 heterodimerise with its PTHR10623:SF6 paralogs (EB-SUN/CG18190, CG32371, Mst27D)
    in vivo, as the Y2H EB1-CG32371 interaction suggests, and do such heterodimers change cargo selection?
- question: Which of the plus-end functions established for Eb1 can reasonably transfer to SF6 paralogs,
    such as Mst27D, that diverge in the C-terminal cargo-binding region?
suggested_experiments:
- description: Reconstitute Dm EB1 together with Sentin and Msps on dynamic microtubules in vitro, to
    test whether the EB1-Sentin complex directly suppresses pausing and promotes growth.
  experiment_type: in vitro reconstitution
- description: Co-immunoprecipitation and FRET of tagged EB1 with CG32371 and EB-SUN in S2 cells, to test
    whether they heterodimerise through the EB homology domain.
  experiment_type: protein interaction assay
