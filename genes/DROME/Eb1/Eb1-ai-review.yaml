id: A1Z6P3
gene_symbol: Eb1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Eb1 (CG3265) encodes Drosophila EB1, the ubiquitously expressed founding member of the fly
  EB1/MAPRE family of microtubule plus-end tracking proteins. It has an N-terminal calponin-homology (CH)
  domain that recognises growing microtubule ends, and a C-terminal coiled-coil/EB homology domain that
  dimerises and binds cargo (SxIP-motif proteins such as Sentin and the spectraplakin Shortstop) and,
  through its acidic C-terminal tail ending in EEY, the CAP-Gly protein CLIP-190. EB1 forms comets at
  the growing plus ends of interphase and spindle microtubules. Acting as a plus-end platform, it recruits
  these partners, keeps microtubules dynamic (depletion leaves many microtubules paused), and is needed
  for astral microtubules, spindle assembly, pole focusing, spindle positioning and anaphase spindle elongation.
  In postmitotic cells it supports the integrity of chordotonal mechanosensory organs, and it contributes
  to uniform minus-end-out microtubule polarity in dendrites. Eb1 is essential for viability. In PANTHER
  it lies in the fly-lineage subfamily PTHR10623:SF6, together with Mst27D, EB-SUN (CG18190), CG32371,
  CG2955 and CG15306; human MAPRE1/2/3 belong to separate subfamilies.
