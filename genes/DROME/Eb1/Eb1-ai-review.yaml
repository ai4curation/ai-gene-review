    action: ACCEPT
    reason: The Goshima et al. (2005) result (abstract-only in cache) is consistent with Rogers et al.
      2002 and Li et al. 2011, which both report shorter spindles after EB1 depletion. The cached abstract
      names EB1 explicitly among the polymerization-promoting factors whose depletion shortens the spindle.
      Accepted in agreement with the IDA row for the same term.
    supported_by:
    - reference_id: PMID:16303556
