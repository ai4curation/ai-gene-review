        or overexpression of Kinesin-8
    - reference_id: PMID:21646401
      supporting_text: In S2 cells, EB1 or XMAP215Msps RNAi knockdown increases the pause during interphase
        and results in the formation of shorter spindles
- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IDA
  original_reference_id: PMID:21646401
  qualifier: involved_in
  review:
    summary: Li et al. (2011) show that EB1 promotes microtubule dynamics in S2 cells by recruiting the
      cargo Sentin (and indirectly the polymerase Msps) to growing plus ends; EB1 or Sentin depletion
      increases microtubule pausing.
    action: MODIFY
    reason: The finding is sound, but 'microtubule cytoskeleton organization' is broader than the evidence.
      What the paper actually establishes is that EB1 controls the dynamic state (growth versus pausing)
      of microtubule plus ends, i.e. regulation of microtubule polymerization or depolymerization, a term
      this gene already carries by IBA. That term is a regulation term and not an is_a descendant of GO:0000226,
      so this is a refinement to the term that matches the observed activity rather than a strict descendant.
    proposed_replacement_terms:
    - &id003
      id: GO:0031110
      label: regulation of microtubule polymerization or depolymerization
    supported_by:
    - reference_id: PMID:21646401
      supporting_text: These results indicate that EB1 promotes dynamic microtubule behavior by recruiting
        the cargo protein Sentin and possibly also a microtubule polymerase to the microtubule tip
    - reference_id: PMID:12213835
      supporting_text: depletion of EB1 by RNA-mediated inhibition (RNAi) in interphase cells causes a
        dramatic increase in nondynamic microtubules (neither growing nor shrinking)
