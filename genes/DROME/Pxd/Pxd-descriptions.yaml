findings:
- category: discrepancy
  text: FlyBase describes Pxd as a glutathione-oxidizing antioxidant enzyme. UniProt,
    the automated text and the review describe the chorion-hardening heme peroxidase.
  sources:
  - Alliance_Imported
  - UniProt
- category: discrepancy
  text: The automated and RefSeq texts name human EPX as an ortholog. The review states
    Pxd has no vertebrate ortholog and belongs to an arthropod-specific expansion.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 2
  overall_notes: UniProt and the automated texts agree on chorion peroxidase. FlyBase
    describes a different, glutathione-linked antioxidant enzyme.
