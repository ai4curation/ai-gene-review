    overall_notes: Describes a glutathione-oxidizing, catalase-like enzyme that makes
      water and oxygen in the oxidative stress response. The review describes a secreted
      heme peroxidase that cross-links chorion tyrosines, and does not support the
      glutathione chemistry.
- source: Alliance_Automated
  text: Enables lactoperoxidase activity. Predicted to be involved in egg chorion
    assembly. Located in egg chorion. Is expressed in endochorion; follicle cell;
    and micropyle. Human ortholog(s) of this gene implicated in asthma and leukocyte
    disease. Orthologous to human EPX (eosinophil peroxidase).
