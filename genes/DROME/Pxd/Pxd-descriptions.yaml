- source: Alliance_Imported
  text: Peroxidase (Pxd) encodes an enzyme that converts hydrogen peroxide to water
    and molecular oxygen, in the process oxidizing glutathione to glutathione disulfide.
    It is involved in the cellular response to oxidative stress.
