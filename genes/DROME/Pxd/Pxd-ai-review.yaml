  - reference_id: PMID:15979004
    supporting_text: This specific peroxidase is involved in the chorion hardening process, through protein crosslinking mediated by the formation of di- and tri-tyrosine bonds.
  - reference_id: PMID:15979004
    supporting_text: the Pxd peroxidase is selectively localized in the chorion structures and particularly in the endochorion and innermost chorionic layer (ICL)
suggested_questions:
- question: >-
    Is Pxd required in vivo for chorion hardening? A Pxd null or follicle-cell RNAi has not been
    reported, and CG4009, its closest paralog (same subfamily SF86), could share the role.
- question: >-
    Which chorion proteins does Pxd cross-link, and does it also act on vitelline membrane proteins,
    whose cross-linking during egg activation is peroxidase-dependent?
- question: >-
    Where a substrate relationship needs to be machine-readable, should Pxd's activity carry a
    has_input to chorion proteins in a GO-CAM, rather than a process term on the substrates?
suggested_experiments:
- description: >-
    Make a Pxd null (or follicle-cell-specific RNAi) and test eggshell hardening by bleach
    resistance, di-tyrosine fluorescence and chorion protein solubility; compare with CG4009
    knockdown and the double knockdown.
  experiment_type: genetic loss-of-function
- description: >-
    Assay recombinant Pxd with iodide, bromide, chloride and thiocyanate as well as phenolic
    substrates, to determine whether it has any of the halide or pseudohalide activities of
    vertebrate peroxidases or is restricted to phenolic donors.
  experiment_type: biochemical enzyme assay
