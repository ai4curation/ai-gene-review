- term:
    id: GO:0007306
    label: egg chorion assembly
  evidence_type: IC
  original_reference_id: PMID:15979004
  qualifier: involved_in
  supporting_entities:
  - GO:0042600
  review:
    summary: >-
      FlyBase inferred this from the chorion localisation of Pxd and its di-tyrosine forming
      activity. Pxd is the enzyme that hardens the chorion by cross-linking chorion proteins through
      di- and tri-tyrosine bonds.
    action: ACCEPT
    reason: >-
      Pxd does part of the work of chorion assembly: it catalyses the final cross-linking step that
      hardens the chorion. Its mRNA is in late follicle cells, the protein is in the endochorion and
      innermost chorionic layer, and the recombinant enzyme forms di-tyrosine with H2O2. Older work
      showed that the chorion contains an endogenous peroxidase activity that cross-links chorion
      proteins in late stage 14 and is blocked by peroxidase inhibitors, and that peroxidase and
      H2O2 sit in the same chorion layers where Pxd is found. This is participation as the catalyst,
      not merely a requirement. The support is biochemical and positional; no Pxd mutant or RNAi
      eggshell phenotype has been published, so the in vivo requirement has not been tested
      genetically.
    supported_by:
    - reference_id: PMID:15979004
      supporting_text: This specific peroxidase is involved in the chorion hardening process, through protein crosslinking mediated by the formation of di- and tri-tyrosine bonds.
    - reference_id: PMID:28305174
      supporting_text: TheDrosophila chorion contains an endogenous peroxidase activity which remains inactive until late stage 14 when it catalyzes the crosslinking of the chorionic proteins.
    - reference_id: PMID:18620142
      supporting_text: 'it was found that the enzyme exists in two out of the five egg-shell layers: the innermost choronic layer and the endochorion'
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010255
  review:
    summary: >-
      InterPro2GO mapping from the haem peroxidase superfamily. UniProt records heme b as cofactor
      by similarity, and the proximal heme-iron ligand His437 is conserved.
    action: KEEP_AS_NON_CORE
    reason: >-
      Animal haem peroxidases need a bound heme for catalysis, and Pxd keeps the proximal His that
      ligates the heme iron as well as the distal His and Arg. Heme binding is very likely correct.
      It is a cofactor-binding property that serves the peroxidase activity rather than a separate
      function, so it is kept as non-core. Heme binding has not been measured directly for Pxd.
    supported_by:
    - reference_id: file:DROME/Pxd/Pxd-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 heme b (iron(II)-protoporphyrin IX) group per subunit.
