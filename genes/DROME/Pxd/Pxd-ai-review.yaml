- id: file:DROME/Pxd/Pxd-deep-research-flybase.md
  title: FlyBase gene description for Pxd (DROME)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The FlyBase text describes Pxd as an antioxidant enzyme that converts H2O2 to water and oxygen
      while oxidizing glutathione, acting in the response to oxidative stress. None of this is shown for Pxd.
      The only biochemical study of Pxd (PMID:15979004) shows H2O2-dependent conversion of tyrosine to
      di-tyrosine by the recombinant enzyme, with expression in late-stage follicle cells and localisation in
      the endochorion. This identifies Pxd as the chorion-hardening heme peroxidase. Producing O2 from H2O2 is
      catalase chemistry, and oxidation of glutathione is the reaction of selenium/thiol glutathione
      peroxidases, not of animal heme peroxidases. The response-to-oxidative-stress claim is an
      electronic over-annotation in this review.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0004577
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Peroxidase (Pxd) encodes an enzyme that converts hydrogen peroxide to water and molecular
        oxygen, in the process oxidizing glutathione to glutathione disulfide.
      confidence: PROBABLE
      explanation: The FlyBase description says Pxd "converts hydrogen peroxide to water and molecular oxygen,
        in the process oxidizing glutathione to glutathione disulfide" and is "involved in the cellular response
        to oxidative stress". This mixes catalase chemistry (O2 release) with glutathione peroxidase chemistry,
        and neither has been shown for Pxd. Pxd (DmPO) is a secreted animal-type heme peroxidase expressed in
        follicle cells at stages 11-14. The recombinant enzyme uses H2O2 to cross-link tyrosine to di-tyrosine,
        and the protein sits in the endochorion and innermost chorionic layer (Konstandi et al. 2005,
        PMID:15979004). The description should call Pxd the chorion peroxidase that uses H2O2 to form
        di-tyrosine cross-links between chorion proteins during eggshell hardening.
      supported_by:
      - reference_id: PMID:15979004
        supporting_text: in the presence of H2O2 was able to convert tyrosine residues to di-tyrosine moieties
      - reference_id: PMID:15979004
        supporting_text: the Pxd peroxidase is selectively localized in the chorion structures and particularly
          in the endochorion and innermost chorionic layer (ICL)
core_functions:
- description: >-
    Secreted heme peroxidase of the eggshell that uses H2O2 to oxidise tyrosine (a phenolic donor)
    to di-tyrosine. Made by follicle cells late in oogenesis and deposited in the endochorion and
    innermost chorionic layer, it catalyses the di- and tri-tyrosine cross-linking of chorion
    proteins that hardens the chorion. The activity was measured on recombinant protein and the
    location by immunostaining; the in vivo requirement has not been tested genetically.
  molecular_function:
    id: GO:0140825
    label: lactoperoxidase activity
  directly_involved_in:
