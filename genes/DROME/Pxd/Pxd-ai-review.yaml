- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - GO:0004601
  - GO:0140825
  review:
    summary: >-
      Inferred automatically from the peroxidase activity annotations.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Consuming H2O2 is part of any peroxidase reaction, but Pxd works outside the cell, in the
      chorion, where the follicle cells produce H2O2 on purpose to drive tyrosine cross-linking.
      Its role is to build the eggshell, not to detoxify oxidants at the cellular level, and no
      study connects Pxd to oxidant detoxification. The inference rule applies a process that is
      typical of intracellular antioxidant peroxidases to an extracellular cross-linking enzyme.
    supported_by:
    - reference_id: PMID:18620142
      supporting_text: It is concluded that hydrogen peroxide is an endogenous, programmed product of the follicle cells, responsible for the action of peroxidase in order to oxidize the tyrosyl residues producing di-tyrosine and tri-tyrosine bonds between the chorion polypeptides.
- term:
    id: GO:0140825
    label: lactoperoxidase activity
  evidence_type: IDA
  original_reference_id: PMID:15979004
  qualifier: enables
  review:
    summary: >-
      Recombinant mature Pxd converted tyrosine residues to di-tyrosine in the presence of H2O2.
      Tyrosine is a phenolic donor, so this is the reaction defined by GO:0140825
      (2 a phenolic donor + H2O2 = 2 a phenolic radical donor + 2 H2O; EC 1.11.1.7).
    action: ACCEPT
    reason: >-
      This is the core, experimentally established activity of Pxd. The term label refers to
      lactoperoxidase, but its definition is the generic phenolic-donor peroxidase reaction, which
      fits the measured activity. Neither this annotation nor the phylogeny supports the halide or
      thiocyanate oxidation of vertebrate lactoperoxidase (GO:0036393 sits on vertebrate PAINT
      nodes that Pxd does not descend from); only the phenolic-donor reaction should be transferred
      to relatives.
    supported_by:
    - reference_id: PMID:15979004
      supporting_text: in the presence of H2O2 was able to convert tyrosine residues to di-tyrosine moieties
    - reference_id: file:DROME/Pxd/Pxd-bioinformatics/RESULTS.md
      supporting_text: The halide and thiocyanate oxidising activities of vertebrate myeloperoxidase, lactoperoxidase and eosinophil peroxidase are therefore not phylogenetically assigned to Pxd.
