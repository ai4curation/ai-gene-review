      not transferred. The evidence for Pxd itself supports the more specific phenolic-donor term
      GO:0140825, which the gene already carries by IDA, so this general term is refined to it.
      GO:0140825 is labelled lactoperoxidase activity, but its definition is the generic phenolic
      donor reaction of EC 1.11.1.7 and does not imply halide or thiocyanate oxidation.
