      and its own activity was measured on recombinant protein.
    action: MODIFY
    reason: >-
      The claim is correct and phylogenetically sound: Pxd descends from PTN000158755, it keeps the
      catalytic residues, and its recombinant protein converts tyrosine to di-tyrosine with H2O2.
      Pxd appearing among the node's seeds is expected, not circular. PTN000158755 is the only
      PTHR11475 IBD node that Pxd inherits. The more specific halide, thiocyanate and iodide
