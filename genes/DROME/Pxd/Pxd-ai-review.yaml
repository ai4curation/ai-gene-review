id: Q01603
gene_symbol: Pxd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Pxd (CG3477, DmPO) encodes the chorion peroxidase of Drosophila melanogaster, a secreted
  690-residue animal-type heme peroxidase (PANTHER PTHR11475 subfamily SF86) with a signal
  peptide and a single peroxidase domain that keeps the distal His, transition-state Arg and
  proximal heme-iron His. Pxd mRNA is expressed in ovarian follicle cells during late
  oogenesis (stages 11-14), and the protein localises to the eggshell, in the endochorion and
  the innermost chorionic layer. Recombinant Pxd uses H2O2 to convert tyrosine to
  di-tyrosine. These findings identify Pxd as the enzyme behind the long-known
  H2O2-dependent peroxidase activity that hardens the chorion at the end of oogenesis by
  forming di- and tri-tyrosine cross-links between chorion proteins. No loss-of-function
  phenotype has been reported, so the in vivo requirement for Pxd in chorion hardening rests
  on biochemistry and localisation rather than genetics. Pxd has no vertebrate or nematode
  ortholog; it belongs to an arthropod-specific expansion of peroxidases that also contains
  CG4009, CG10211, cardinal and CG42331.
