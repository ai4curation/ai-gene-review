taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: NT1 (DNT1, Spätzle 2) encodes Drosophila neurotrophin 1, a secreted Spätzle-family cystine-knot
  protein made as a prepro-protein that is cleaved by furins and released both full length and as mature
  cystine-knot forms. It is expressed at the embryonic CNS midline, in muscles and in the adult brain.
  DNT1 binds the Toll-family receptors Toll-7 and Toll-6, which act as neurotrophin receptors; mature
  DNT1 activates NF-kappaB (Dorsal/Dif) and ERK signaling to promote neuronal survival, whereas pro-DNT1
  can activate pro-apoptotic JNK signaling. DNT1 maintains neuronal survival non-autonomously in the embryonic
  CNS, is needed for motor axon targeting, and with DNT2 contributes to synaptogenesis at the larval neuromuscular
  junction. It also binds the Trk-like Kek-6, and in the larval trachea it is the proposed ligand of Toll-8/Tollo
  in a module that dampens antimicrobial peptide expression.
