- term:
    id: GO:0031637
    label: regulation of neuronal synaptic plasticity in response to neurotrophin
  evidence_type: IMP
  original_reference_id: PMID:19018662
  qualifier: involved_in
  review:
    summary: Annotated from Zhu et al. (2008), which shows survival and targeting phenotypes and only
      speculates about synaptic plasticity. Sutcliffe et al. (2013) later showed that DNT1 and DNT2 together
      are required at the larval NMJ for synaptogenesis and normal bouton number.
    action: KEEP_AS_NON_CORE
    reason: The cited paper does not itself test synaptic plasticity, but the claim is supported by later
      NMJ work in which DNT1 acts redundantly with DNT2 as a muscle-derived retrograde factor. Synaptic
      roles are better established for DNT2 (PMID:28846707) than for DNT1, so the term is kept as non-core
      for NT1.
    additional_reference_ids:
    - PMID:24124519
    supported_by:
    - reference_id: PMID:24124519
      supporting_text: Our data indicate that DNTs are produced in muscle and are required in neurons
        for synaptogenesis.
    - reference_id: PMID:24124519
      supporting_text: DNT1 and DNT2 function together at the muscles 6,7 NMJ
    - reference_id: PMID:24124519
      supporting_text: Most likely alterations in DNT function and synapse formation induce NMJ plasticity
        leading to homeostatic adjustments that increase terminal size restoring overall synaptic transmission.
