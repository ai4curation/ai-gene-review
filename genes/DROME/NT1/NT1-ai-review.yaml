  review:
    summary: Chowdhury et al. (2019) showed that the DNT1 (Spz-2) cystine knot activates a drosomycin
      reporter in S2 cells expressing full-length Toll-1 or Toll-7.
    action: MODIFY
    reason: GO:0008063 is defined by ligand binding to the receptor Toll (Toll-1), the immune and dorsal-ventral
      pathway. For DNT1 the Toll-1 arm rests only on an over-expression reporter assay in S2 cells; no
      in vivo study places DNT1 in Toll-1 signaling. The Toll-7 arm of the same assay, and the in vivo
      genetic and signaling work (McIlroy et al. 2013; Foldi et al. 2017), show DNT1 activating Toll-7/Toll-6
      as a neurotrophin, which is the neurotrophin signaling pathway (GO:0038179). As a ligand, DNT1 is
      part of the pathway it initiates (projects/LIGANDS_IN_SIGNALING.md).
