      ligand activity or a child, not a receptor-specific binding term. The PAINT node already carries
      growth factor activity (GO:0008083), a child of receptor ligand activity, which fits a neurotrophin;
      it is the replacement. The node placement itself is sound: NT1 is inside the clade and has its own
      binding evidence.'
