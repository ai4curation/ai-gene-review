description: Both predictions are correct for Drosophila cyclin A, which retains the complete cyclin
  domain in this isoform C product. The CDK-regulator activity is already annotated on the canonical
  product P14785 by experimental evidence, and mitotic cell cycle phase transition is less specific than
  the G1/S and G2/M transition terms the gene already carries or is reviewed to carry.
