    summary: The PC isoform preserves the complete cyclin domain of characterized Drosophila CycA. Primary
      work on the CycA–Cdk1 system demonstrates control of CDK substrate recognition through the cyclin
      hydrophobic patch. The one-residue N-terminal isoform difference lies outside that domain, supporting
      the regulator activity. The canonical product of the same gene, P14785, already carries this exact
      term in GOA by experimental evidence (accepted as its core function in the gene review), so the
      prediction is not novel and CNN applies; actual inclusion in the model training set is not established.
