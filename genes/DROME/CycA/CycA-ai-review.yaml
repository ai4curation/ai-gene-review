  label: Drosophila melanogaster
description: 'Cyclin A regulates cyclin-dependent kinases during Drosophila cell-cycle progression and
  mitotic entry. Its abundance and localization change during the cycle: it accumulates in interphase
  cytoplasm, relocates to the nuclear region in prophase and is degraded during mitosis. The native 490-residue
  PC isoform retains the complete cyclin domain of the characterized 491-residue PA protein, differing
  by one N-terminal residue.'
