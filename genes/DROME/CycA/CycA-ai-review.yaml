id: M9NFR3
gene_symbol: CycA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Cyclin A (CycA, CG5940) is the A-type cyclin of Drosophila and the only mitotic
  cyclin that is essential for mitosis in the fly embryo. It is a non-catalytic
  regulatory subunit of the cyclin-dependent kinase Cdk1 (Cdc2): through its
  N-terminal and C-terminal cyclin-box folds it binds and activates Cdk1, and its
  hydrophobic patch contributes to Cdk1 substrate recognition. CycA accumulates in
  the interphase cytoplasm, where it is kept by nuclear export, enters the nucleus in
  prophase and is degraded by APC/C-dependent proteolysis during mitosis. CycA-Cdk1
  activity drives the G2/M transition, acting synergistically with cyclin B; its
  essential mitotic contribution in the embryo is to keep the APC/C activator
  Fizzy-related (Fzr) inactive in G2, so that mitotic cyclins are not destroyed
  before mitosis. When ectopically stabilized, CycA-Cdk1 can also promote S-phase
  entry, and loss of CycA converts mitotic cycles into endocycles. M9NFR3 is the
  490-residue isoform C product, which differs from the reviewed 491-residue
  isoform A (P14785) only by the absence of one N-terminal glutamine and retains
  both cyclin-box folds.
existing_annotations:
- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028458
  review:
    action: MODIFY
    summary: Correct, but the fly genetics establish a more specific role in the
      G2/M transition of the mitotic cell cycle.
    reason: >-
      The ARBA term is true but general. Zygotic cycA mutant embryos fail to enter
      mitosis after the maternal supply is exhausted (Lehner and O'Farrell 1989, 1990),
      and cycA;cycB double mutants arrest in G2 before mitosis 15, a block rescued by
      either cyclin (Knoblich and Lehner 1993). CycA is the regulatory subunit of the
      Cdk1 kinase that performs this transition, so it participates in the process
      rather than being merely required for it. The specific supported descendant is
      GO:0000086 G2/M transition of mitotic cell cycle (is_a descendant of
      GO:0000278, verified in OLS). An S-phase-promoting capacity exists but was shown
      only by ectopic expression (Sprenger et al. 1997) and is not proposed here.
      Isoform C retains both cyclin folds (local alignment), so the gene-level
      evidence applies to this product.
    proposed_replacement_terms:
    - id: GO:0000086
      label: G2/M transition of mitotic cell cycle
    supported_by:
    - reference_id: PMID:8428595
      supporting_text: demonstrate that cyclin A has a mitotic function and that it acts
        synergistically with cyclin B during the G2-M transition.
    - reference_id: PMID:8428595
      supporting_text: BrdU-labeling experiments indicate that cell cycle progression is
        blocked in G2 before entry into the fifteenth round of mitosis.
    - reference_id: PMID:2139805
      supporting_text: in mutant embryos deficient in cyclin A, cells that accumulate
        only cyclin B do not enter mitosis.
    - reference_id: PMID:2564316
      supporting_text: 'a functional cyclin A gene was required for continued division

        after exhaustion of maternally contributed cyclin A.'
    - reference_id: file:DROME/CycA/CycA-bioinformatics/RESULTS.md
      supporting_text: The annotated cyclin domain 206–332 is fully retained and maps to target 205–331.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026330
  review:
    action: KEEP_AS_NON_CORE
    summary: CycA is nuclear in prophase, but it is cytoplasmic through interphase and
      nuclear accumulation is not required for its mitotic function.
    reason: >-
      Embryo immunostaining shows CycA relocating to the nuclear region early in
      prophase, and the reviewed isoform carries a nucleus IDA, so the location is
      real. It is transient, however: CycA is held in the interphase cytoplasm by
      Leptomycin B-sensitive nuclear export, and CycA tethered outside the nucleus,
      even at the membrane, still induces mitosis (Dienemann and Sprenger 2004). The
      term is as precise as the evidence warrants but is not the core site of
      function, so it is kept as non-core. Cytoplasm is proposed as a NEW location
      below. The PAINT node PTN000019791 also places nucleus at the cyclin ancestor,
      with FBgn0000404 among the donors.
    supported_by:
    - reference_id: PMID:2564316
      supporting_text: 'cyclin A accumulates in the interphase cytoplasm of cellularized embryos, but

        relocates to the nuclear region early in prophase'
    - reference_id: PMID:15203007
      supporting_text: Surprisingly, nuclear accumulation was not required, and even a
        membrane-tethered form of CycA was able to induce mitosis.
    - reference_id: file:DROME/CycA/CycA-bioinformatics/RESULTS.md
      supporting_text: The annotated cyclin domain 206–332 is fully retained and maps to target 205–331.
- term:
    id: GO:0051301
    label: cell division
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027793
  review:
    action: ACCEPT
    summary: CycA-Cdk1 drives entry into mitosis, which is required for continued cell
      divisions in the embryo.
    reason: >-
      Cyclin A is required for continued embryonic divisions after the maternal pool
      is exhausted, and its Cdk1 complex drives mitotic entry. Cell division is the
      standard process term for mitotic cyclins and is not entailed by the more
      specific G2/M transition term proposed above (that term sits under mitotic cell
      cycle, not under cell division), so it is retained rather than marked
      redundant.
    supported_by:
    - reference_id: PMID:2564316
      supporting_text: 'a functional cyclin A gene was required for continued division

        after exhaustion of maternally contributed cyclin A.'
    - reference_id: PMID:2139805
      supporting_text: in mutant embryos deficient in cyclin A, cells that accumulate
        only cyclin B do not enter mitosis.
- term:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  evidence_type: IPI
  original_reference_id: PMID:17431409
  qualifier: part_of
  review:
    action: NEW
    summary: CycA functions as the cyclin subunit of a CycA-Cdk1 holoenzyme.
    reason: >-
      Not in GOA for M9NFR3. The reviewed isoform A is curated as a component of the
      Frs-CycA-Cdk1 complex (PMID:17431409), and fly cyclin A is reported to complex
      only with Cdk1/cdc2. The PAINT IBD for this complex at PTN000019791 includes
      vertebrate and yeast donors and covers the cyclin family. The more specific
      GO:0097124 cyclin A2-CDK2 complex (an IBA on P14785) is not proposed, because
      Drosophila CycA does not partner Cdk2.
    supported_by:
    - reference_id: file:DROME/CycA/CycA-reference-P14785-uniprot.txt
      supporting_text: Component of the Frs-CycA-Cdk1 complex composed of CycA, Cdk1
    - reference_id: PMID:9210381
      supporting_text: In Drosophila , however, cyclin A only complexes with cdc2, so
        that both S and G2 roles are presumed to be carried out by cyclin A–cdc2
