core_functions:
- description: >-
    Regulatory (non-catalytic) subunit of Cdk1 that activates the kinase and directs
    substrate recognition through its hydrophobic patch; CycA-Cdk1 drives the G2/M
    transition, in part by keeping Fzr/APC-C inactive in G2.
  molecular_function:
    id: GO:0016538
    label: cyclin-dependent protein serine/threonine kinase regulator activity
  directly_involved_in:
  - id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  supported_by:
  - reference_id: PMID:8428595
    supporting_text: demonstrate that cyclin A has a mitotic function and that it acts
      synergistically with cyclin B during the G2-M transition.
  - reference_id: PMID:17431409
    supporting_text: 'We propose that binding

      of Frs to cyclins blocks the hydrophobic patch to interfere with Cdk1 substrate

      recognition.'
  - reference_id: PMID:15203007
    supporting_text: Rather,
      CycA-dependent kinase activity is required to inhibit one inhibitor of mitosis,
      the Fzr protein.
  - reference_id: file:DROME/CycA/CycA-bioinformatics/RESULTS.md
    supporting_text: The annotated cyclin domain 206–332 is fully retained and maps to target 205–331.
suggested_questions:
- question: Which Cdk1 phosphorylation sites on Fzr (Cdh1) depend specifically on CycA rather
    than CycB or CycE, and is Fzr a direct CycA-Cdk1 substrate in G2 of cycle 16?
- question: The reviewed CycA isoform A (P14785) carries an IBA to GO:0097124 cyclin A2-CDK2
    complex, but Drosophila CycA is reported to complex only with Cdk1. Should that IBA be
    excluded for the fly lineage?
suggested_experiments:
- description: Phosphoproteomics of cycA mutant versus wild-type embryos at cycle 16 with
    Rca1 co-expression, to separate CycA-Cdk1 substrates from the indirect consequence of
    premature APC/C-Fzr activation.
