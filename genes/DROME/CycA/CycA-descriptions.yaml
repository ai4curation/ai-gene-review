- source: Alliance_Automated
  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in several processes, including G1/S transition of mitotic cell cycle;
    regulation of mitotic cell cycle; and syncytial blastoderm mitotic cell cycle.
    Located in several cellular components, including fusome; male germ cell nucleus;
    and spectrosome. Is expressed in several structures, including brain; germline
    cell; head epidermis primordium; presumptive embryonic/larval system; and sensory
    nervous system primordium. Human ortholog(s) of this gene implicated in prostate
    cancer. Orthologous to human CCNA1 (cyclin A1) and CCNA2 (cyclin A2).
