gene_symbol: Vps51
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps51 (CG15087; Ang2/Fat-free in other species) is the Drosophila ortholog of VPS51, the
  small N-terminal coiled-coil subunit of the GARP and EARP multisubunit tethering complexes. With Vps52
  and Vps53 it forms the core shared by GARP, which additionally contains Vps54 (scattered) and tethers
  endosome-derived carriers at the trans-Golgi network for retrograde transport of cargo such as lysosomal
  hydrolase receptors, and EARP, which contains Vps50 (syndetin) instead and supports recycling of endocytosed
  cargo to the plasma membrane. In Drosophila cell and head lysates Vps51 co-purifies with the other GARP
  subunits as an effector of GTP-bound Rab4, Rab6/Rab14 and the Arf-like GTPase Arl5.
