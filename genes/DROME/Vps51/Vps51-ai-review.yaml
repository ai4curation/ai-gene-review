suggested_questions:
- question: Does Drosophila Vps51 mediate GARP/EARP binding to SNAREs (e.g. Syx16, Syx6) as its yeast
    and human orthologs do, and is it needed for assembly of both complexes in vivo?
suggested_experiments:
- description: Generate Vps51 null mutants and test GARP and EARP integrity (co-immunoprecipitation of
    Vps52/Vps53 with scat and Vps50), Lerp retrieval to the TGN, and male fertility.
