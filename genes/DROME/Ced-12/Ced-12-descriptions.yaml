- source: Alliance_Imported
  text: Ced-12 (Ced-12) encodes a protein that functions with Dock family members
    (encoded by mbc or spg) to regulate GTPase activity. It contributes to myoblast
    fusion, apoptotic cell engulfment, cell migration, and embryonic cellularization.
