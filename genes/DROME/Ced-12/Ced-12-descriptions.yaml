descriptions:
- source: UniProt
  text: Involved in cytoskeletal rearrangements required for phagocytosis of apoptotic
    cells and cell motility. Acts in association with DOCK1 and CRK. Was initially
    proposed to be required in complex with DOCK1 to activate Rac Rho small GTPases.
    May enhance the guanine nucleotide exchange factor (GEF) activity of DOCK1. .
