- source: Alliance_Automated
  text: Enables guanyl-nucleotide exchange factor activity. Involved in several processes,
    including border follicle cell migration; imaginal disc fusion, thorax closure;
    and positive regulation of JNK cascade. Located in cytoplasm and nucleus. Is expressed
    in several structures, including adult brain cell body rind; adult head; follicle
    cell; ganglia; and muscle cell. Orthologous to several human genes including ELMO1
    (engulfment and cell motility 1) and ELMO2 (engulfment and cell motility 2).
