id: Q9VLD7
gene_symbol: aust
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Australin (aust) is a testis-specific paralog of Borealin (borr) that replaces Borr in the
  chromosomal passenger complex (CPC) during the two male meiotic divisions of Drosophila. Like Borr it
  self-associates and binds DNA in vitro. Aust accumulates on condensing chromosomes at meiosis I entry,
  colocalizes with Incenp at kinetochores in metaphase, accumulates at the cell equator in anaphase and
  at the central spindle midzone in telophase. It directs the CPC to kinetochores and is required for
  sister chromatid cohesion, chromosome alignment and segregation, and for initiating central spindle
  formation, equatorial anillin and actin accumulation and furrow constriction in male meiosis, but not
  for meiotic histone phosphorylation or spindle formation. Aust can substitute for Borr in mitotic S2
  cells.
