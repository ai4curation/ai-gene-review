suggested_questions:
- question: Which Aust-specific features (it lacks the central ~140 residues of Borr) adapt the CPC to
    the long male meiotic divisions, and does Aust contribute to a Mei-S332-independent cohesion mechanism?
suggested_experiments:
- hypothesis: The region missing from Aust relative to Borr is dispensable for male meiosis but not mitosis.
  description: Express Borr lacking its central region, or Aust, from the aust promoter in aust mutants
    and from the borr promoter in borr mutants, and score meiotic cohesion, segregation and cytokinesis
    and mitotic polyploidy.
  experiment_type: paralog swap rescue
