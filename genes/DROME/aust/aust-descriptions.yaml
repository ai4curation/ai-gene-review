- source: Alliance_Automated
  text: Enables DNA binding activity. Involved in male meiosis chromosome segregation;
    male meiosis cytokinesis; and male meiosis sister chromatid cohesion. Located
    in kinetochore and meiotic spindle midzone. Part of chromosome passenger complex.
    Is expressed in primary spermatocyte and testis.
