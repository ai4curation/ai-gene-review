descriptions:
- source: Alliance_Imported
  text: australin (aust) is a male meiotic specific paralogue of borr, which encodes
    one of the three targeting subunits for the product of aurB in the chromosomal
    passenger complex (CPC). The CPC is critical in regulating multiple aspects of
    cell division, including chromosome condensation, kinetochore function and cytokinesis,
    through the kinase activity of the product of aurB.
  source_type: curated
