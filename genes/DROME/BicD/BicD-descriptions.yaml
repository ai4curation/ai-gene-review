descriptions:
- source: UniProt
  text: This protein is essential for differentiation. It may play a role in localizing
    of Nanos (a maternal determinant) activity in oocytes. Functions redundantly with
    BicDR (PubMed:38264934). During oogenesis, plays a specific role, together with
    Rab6 but independently of Sec5, in the polarization of the oocyte microtubule
    cytoskeleton, in oskar mRNA localization and in the anterodorsal secretion of
    grk. Plays a role in the biogenesis of annulate lamellae containing nuclear pore
    complex components (PubMed:31626769). During macrochaetae development, together
    with BicDR, involved in Rab 6 and Spn-F stability and distribution and actin cytoskeleton
    organization (PubMed:38264934).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16568
  source_id: P16568
