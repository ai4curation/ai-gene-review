- source: Alliance_Imported
  text: Bicaudal D (BicD) encodes a cytoplasmic protein that links diverse cargo to
    the dynein/dynactin motor. Cargos like mRNAs, proteins and organelles are transported
    along microtubules. Through this mechanism the product of BicDcontrols spatial
    aspects of gene expression and polarity formation during development. Additionally,
    it supports physiology of differentiated polar cells and the function of the nervous
    system.
  source_type: curated
  url: https://flybase.org/reports/BicD.html
  source_id: FB:FBgn0000183
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: links mRNA, protein and organelle cargo to dynein/dynactin
      for polarity and nervous system function.'
- source: Alliance_Automated
  text: Enables cargo adaptor activity; clathrin heavy chain binding activity; and
    small GTPase binding activity. Involved in several processes, including mRNA transport;
    oocyte differentiation; and regulation of vesicle-mediated transport. Located
    in cytoplasm. Colocalizes with clathrin-coated endocytic vesicle membrane. Is
    expressed in several structures, including adult brain; embryonic/larval midgut
    primordium; epidermis; germline cell; and gut section. Used to study spinal muscular
    atrophy with lower extremity predominant 2A. Human ortholog(s) of this gene implicated
    in spinal muscular atrophy with lower extremity predominant 2A and spinal muscular
    atrophy with lower extremity predominant 2B. Orthologous to human BICD1 (BICD
    cargo adaptor 1) and BICD2 (BICD cargo adaptor 2).
