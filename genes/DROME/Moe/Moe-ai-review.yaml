id: P46150
gene_symbol: Moe
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Moesin (Moe) is the single ERM (ezrin/radixin/moesin) protein of Drosophila melanogaster.
  It has an N-terminal FERM domain that binds PI(4,5)P2 and the cytoplasmic tails of membrane proteins,
  and a C-terminal ERM domain that binds F-actin. Phosphorylation of Thr559 by Slik (and in some contexts
  Rho-kinase), after PI(4,5)P2-dependent membrane recruitment, opens the protein so that it links cortical
  actin to the cytoplasmic face of the plasma membrane, mainly at the apical cortex of epithelial cells,
  microvilli and the rhabdomere base of photoreceptors. Moe organizes the cortical actin cytoskeleton,
  keeps Rho1 activity in check in part by recruiting the RhoGAP Conundrum to the cortex, and through its
  FERM domain also binds and anchors microtubules at the cortex. These activities underlie its roles in
  epithelial apical-basal polarity and integrity, mitotic cell rounding and spindle organization, anchoring
  of the oocyte cortical actin needed for posterior germ plasm anchoring, rhabdomere morphogenesis, tracheal
  lumen morphogenesis and R8 axon targeting. A minor nuclear pool associates with active chromatin and
  contributes to mRNA export with PCID2.
