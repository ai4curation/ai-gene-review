- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:19592131
  qualifier: located_in
  review:
    summary: Moe is detected in the nucleus, dynamically during the cell cycle and at sites of active
      transcription.
    action: KEEP_AS_NON_CORE
    reason: Nuclear localization is documented by two independent groups but represents a minor pool linked
      to mRNA export, peripheral to the core cortical function. (Row 14 from PMID:20519583 is a colocalizes_with
