core_functions:
- description: 'Membrane-cytoskeleton linker: PI(4,5)P2-recruited, Slik-phosphorylated Moe binds F-actin
    with its C-terminal ERM domain and anchors the cortical actin cytoskeleton to the cytoplasmic face
    of the (apical) plasma membrane, organizing the cortex for epithelial polarity, cell shape and mitotic
    rounding.'
  molecular_function:
    id: GO:0003779
    label: actin binding
  directly_involved_in:
  - id: GO:0030866
    label: cortical actin cytoskeleton organization
  - id: GO:0008360
    label: regulation of cell shape
  - id: GO:0045197
    label: establishment or maintenance of epithelial cell apical/basal polarity
  locations:
  - id: GO:0098592
    label: cytoplasmic side of apical plasma membrane
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:12360288
    supporting_text: We show that Dmoesin is required during oogenesis for anchoring microfilaments to
      the oocyte cortex.
  - reference_id: PMID:23468526
    supporting_text: has the ability to bind to and organize cortical F-actin
  - reference_id: PMID:20519583
    supporting_text: PtdIns(4,5)P(2) binding is essential for moesin recruitment to the membrane and for
      its subsequent phosphorylation.
  - reference_id: PMID:18207738
    supporting_text: We find that the Moesin is activated upon entry into mitosis, is necessary for the
      accompanying increase in cortical rigidity and cell rounding
- description: 'Phosphoinositide-binding membrane recruitment: the FERM domain binds PI(4,5)P2, which
    recruits Moe to the plasma membrane and permits its activating phosphorylation.'
  molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:20519583
    supporting_text: PtdIns(4,5)P(2) binding is essential for moesin recruitment to the membrane and for
      its subsequent phosphorylation.
- description: FERM-domain microtubule binding that anchors and stabilizes astral/cortical microtubules
    at the cell cortex, coordinating spindle organization with cortical shape changes in mitosis.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0034453
    label: microtubule anchoring
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:23857773
    supporting_text: In this paper, we show that the ERM protein Moesin directly binds to microtubules
      in vitro and stabilizes microtubules at the cell cortex in vivo.
  - reference_id: PMID:23857773
    supporting_text: Moesin directly anchors microtubules to the cortex and regulate their dynamics.
- description: Membrane adaptor that recruits the RhoGAP Conundrum to the apical/junctional cortex, restraining
    Rho1 activity in epithelia.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:23468526
    supporting_text: We demonstrate that Moe interacts with an unusual RhoGAP, Conundrum (Conu), and recruits
      it to the cell cortex to negatively regulate RhoA activity.
  - reference_id: PMID:23468526
    supporting_text: Furthermore, Conu lost its junctional localization when Moe was strongly depleted
      using a previously published RNA interference (RNAi) transgene
  - reference_id: PMID:12511959
    supporting_text: Moesin facilitates epithelial morphology not by providing an essential structural
      function, but rather by antagonizing activity of the small GTPase Rho.
suggested_questions:
- question: Does Moe's nuclear role in mRNA export depend on its actin-binding activity, and which isoforms/phospho-forms
    enter the nucleus?
- question: Should GO:0045807 positive regulation of endocytosis (PMID:25065756) be withdrawn at FlyBase,
    given that the paper places endocytosis upstream of phospho-Moe?
- question: Is GO:1990023 mitotic spindle midzone (PMID:18283112) intended, or should it be the equatorial
    cortex/cleavage furrow?
- question: Does PMID:18836316 contain Moe-specific data supporting determination of left/right symmetry?
suggested_experiments:
- description: Test whether endocytosis rates (e.g., dextran or Crumbs uptake) change in Moe-null or Moe-K212,213M
    tracheal terminal cells to decide whether Moe affects endocytosis at all.
- description: Measure photoreceptor electroretinograms in Moe T559A/T559D-expressing flies to test any
    direct effect on light-evoked membrane potential.
