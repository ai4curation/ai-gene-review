- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0011661
  - PANTHER:PTN001150648
  - RGD:1359472
  - RGD:621260
  - UniProtKB:P15311
  - UniProtKB:P35241
  review:
    summary: Moe binds actin through its C-terminal ERM actin-binding domain and links cortical actin
      to the plasma membrane.
    action: ACCEPT
    reason: Actin binding is the defining activity of ERM proteins and is supported for Drosophila Moe
      by genetic and cell-biological data (anchoring of microfilaments to the oocyte cortex, organization
      of cortical F-actin). The IDA from PMID:8666669 rests mainly on F-actin colocalization and sequence
      conservation of the C-terminal actin-binding region, and the NAS (PMID:14644201) is a general review,
      but the claim itself is well supported; IBA placement at the ERM node (PTN001150648) is sound.
    supported_by:
    - reference_id: file:DROME/Moe/Moe-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Involved in connections of major cytoskeletal structures to the plasma membrane
    - reference_id: PMID:23468526
      supporting_text: has the ability to bind to and organize cortical F-actin
    - reference_id: PMID:18207738
      supporting_text: Moesin is the sole Drosophila member of the ERM proteins, which, once activated
        via phosphorylation, crosslink actin filaments to the cytoplasmic tails of plasma membrane proteins.
    - reference_id: PMID:12360288
      supporting_text: We show that Dmoesin is required during oogenesis for anchoring microfilaments
        to the oocyte cortex.
