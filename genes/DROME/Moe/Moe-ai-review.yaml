- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23468526
  qualifier: enables
  supporting_entities:
  - FB:FBgn0039994
  review:
    summary: Moe binds the RhoGAP Conundrum (Conu) via its FERM domain (co-IP, yeast two-hybrid) and recruits
      it to the cell cortex.
    action: MODIFY
    reason: 'Bare protein binding is uninformative. The paper shows more than binding: Moe recruits Conu
      to the cortex, and Conu loses junctional localization on Moe depletion. This supports protein-membrane
      adaptor activity (Moe binds the membrane via PI(4,5)P2 and tethers Conu there).'
    proposed_replacement_terms:
    - id: GO:0043495
      label: protein-membrane adaptor activity
    supported_by:
    - reference_id: PMID:23468526
      supporting_text: We demonstrate that Moe interacts with an unusual RhoGAP, Conundrum (Conu), and
        recruits it to the cell cortex to negatively regulate RhoA activity.
    - reference_id: PMID:23468526
      supporting_text: Furthermore, Conu lost its junctional localization when Moe was strongly depleted
        using a previously published RNA interference (RNAi) transgene
