descriptions:
- source: UniProt
  text: Involved in connections of major cytoskeletal structures to the plasma membrane
    (PubMed:8666669). Together with wgn, involved in control of axon targeting of
    R8 and R2-R5 photoreceptors, independent of egr (PubMed:23544124). In the nucleus,
    recruited to sites of active transcription by RNA polymerase II where it has a
    role in nuclear mRNA export together with the mRNA export factor PCID2 and other
    messenger ribonucleoprotein (mRNP) particles (PubMed:28554770).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P46150
  source_id: P46150
