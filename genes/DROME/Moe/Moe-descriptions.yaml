- source: Alliance_Imported
  text: Moesin (Moe) encodes an Ezrin, Radixin, Moesin (ERM) protein involved in cortical
    cytoskeleton stability. It regulates the products of crb and Rho1. The product
    of Moe contributes to apical-basal polarity, mitotic spindle organisation and
    epithelial integrity.
  source_type: curated
  url: https://flybase.org/reports/Moe.html
  source_id: FB:FBgn0011661
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: ERM protein for cortical stability, regulating Crb and
      Rho1, in apical-basal polarity, spindle organisation and epithelial integrity.'
- source: Alliance_Automated
  text: Enables actin binding activity; microtubule binding activity; and phosphatidylinositol-4,5-bisphosphate
    binding activity. Involved in several processes, including cytoskeleton organization;
    neuron development; and open tracheal system development. Located in several cellular
    components, including cleavage furrow; euchromatin; and mitotic spindle midzone.
    Is active in cytoplasmic side of apical plasma membrane. Is extrinsic component
    of cytoplasmic side of plasma membrane. Colocalizes with cytoplasm; cytoskeleton;
    and nucleus. Is expressed in several structures, including abdominal tracheal
    metamere; epithelium; ganglia; glomerulus; and gut section. Human ortholog(s)
    of this gene implicated in autosomal recessive nonsyndromic deafness 24 and immunodeficiency
    50. Orthologous to human EZR (ezrin); MSN (moesin); and RDX (radixin).
  source_type: automated
