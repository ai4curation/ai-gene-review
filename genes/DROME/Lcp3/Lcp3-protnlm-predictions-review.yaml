  label: Drosophila melanogaster
status: COMPLETE
description: >-
  ProtNLM2 emitted no GO or EC predictions for A0A0B4KEF3 in the frozen
  2026-09-08 API snapshot. It emitted a protein name, a Secreted location,
  and the function text "Component of the rigid cuticle of the spider".
  The absence of GO output is an informative coverage omission: the current
  target is identical over all 112 residues to reviewed Lcp3 P07188 at the
  same FlyBase locus, which has experimental FlyBase annotations for
  GO:0008010 structural constituent of chitin-based larval cuticle and
  GO:0062129 chitin-based extracellular matrix. These are well-supported
  expected functions, not predictions emitted by ProtNLM. The separate
  function-description review supports the broad cuticle claim, leaves the
  rigid qualifier uncertain, and rejects the spider attribution. This record
  assesses missing GO output without assigning a VDCL score to an absent
  prediction or asserting a benchmark-wide recall value; the prediction-time
  input sequence and training-set membership remain unknown.
