suggested_questions:
- question: Does Lcp3 bind chitin directly through its R&R domain, as shown for some other CPR proteins,
    and should GO chitin binding (GO:0008061) be propagated across the PTHR10380 SF237 subfamily or only
    to members with direct binding data?
- question: Is the larval stage restriction of Lcp3 (as opposed to the pupal Pcp in the same PANTHER subfamily)
    a property of the protein or only of its transcriptional program, i.e. could Lcp3 substitute for other
    CPR proteins in pupal or adult cuticle?
suggested_experiments:
- description: Express recombinant Lcp3 R&R domain (or GST fusion) and measure binding to purified chitin,
    with conserved R&R aromatic residues mutated as controls.
  hypothesis: Lcp3 binds polymeric chitin through its Rebers-Riddiford domain like other CPR-family proteins.
- description: Generate a clean CRISPR Lcp3 null (leaving Lcp1, Lcp2 and Lcp4 intact) and assess larval
    cuticle ultrastructure, permeability and mechanical properties.
  hypothesis: Loss of Lcp3 alone has little organismal effect because of redundancy within the 44D cluster,
    but alters larval procuticle composition.
