  review:
    summary: Lcp3 has the more specific structural role in the larval chitin-based cuticle.
    action: MODIFY
    reason: The broad structural annotation is biologically correct, but GO:0008010 captures the supported
      larval specificity. A0A0B4KEF3 and experimentally grounded reviewed Lcp3 P07188 encode the identical
      current 112-residue polypeptide and map to the same FlyBase gene. P07188 records direct protein
      sequencing from larval material and FlyBase IDA annotation to the larval-cuticle structural term;
      this is stronger evidence than the automated mapping alone.
