gene_symbol: Lcp3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Lcp3 (Larval cuticle protein 3, LCP-III, CG2043) is a small secreted structural protein
  of the Drosophila melanogaster larval chitin-based cuticle. It is one of the major third-instar larval
  cuticle proteins and is encoded in the 44D larval cuticle protein gene cluster together with the related
  Lcp1, Lcp2 and Lcp4 genes, which are expressed in the epidermis of third-instar larvae. The 112-residue
  precursor carries an N-terminal signal peptide (residues 1-16) and a Rebers-Riddiford (R&R, chitin-binding
  type-4) cuticle-protein domain, placing it in the CPR cuticular protein family (PANTHER PTHR10380, subfamily
  SF237). The mature protein was sequenced from larval cuticle, and it resides in the extracellular chitin-protein
  matrix secreted by the larval epidermis, where it contributes to the structure of the larval cuticle.
  Direct chitin binding, its precise layer within the procuticle and an organismal loss-of-function phenotype
  have not been established for Lcp3 itself.
