taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Lcp3 is a secreted structural protein of the Drosophila melanogaster larval chitin-based
  cuticle. The 112-residue precursor contains an N-terminal signal peptide and a Rebers–Riddiford cuticle-protein
  domain. Lcp3 contributes to the extracellular cuticular matrix produced by the larval epidermis; its
  expression and protein evidence are associated with the third-instar larval cuticle.
