  review:
    action: ACCEPT
    summary: No molecular activity has been demonstrated for CG46301, so the ND root annotation stands.
    reason: No experiment on the fly protein is found in the literature search (deep research, PubMed-cached
      leads). The only experimental work on the family is on mouse NOL4 splice variants. They bind the
      transcription factors Mlr1/Mlr2 and suppress or enhance their transactivation (PMID:25366156). The
      fly protein is in a different PANTHER subfamily (SF22) from vertebrate NOL4 (SF17). Mlr-modulating
      activity is a variant-dependent result for a single subfamily and is not shown as a conserved family
      activity, so it is not transferred. The HTH_NOL4 domain is a structural classification and does not
      by itself establish DNA binding.
    supported_by:
    - reference_id: file:DROME/CG46301/CG46301-deep-research-falcon.md
