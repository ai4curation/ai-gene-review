    supporting_text: It is therefore the most complete product, not a fragment
core_functions: []
suggested_questions:
- question: Is CG46301 the single invertebrate co-ortholog of vertebrate NOL4 and NOL4L, and is PANTHER
    SF22 a sister clade to both vertebrate subfamilies?
- question: Does the fly protein bind and modulate the Mblk-1 family transcription factor E93 (Eip93F),
    the insect counterpart of the mouse Mlr1/Mlr2 partners of NOL4?
- question: Do the short products of CG46301 that lack the HTH_NOL4 domain (A0A1W5PVN5, A0A1W5PW03)
    have functions separate from the full-length 1237-residue product?
suggested_experiments:
- description: Endogenously tag CG46301 with CRISPR (separately on the N- and C-terminal exons) and determine
    its nuclear and nucleolar distribution relative to fibrillarin in neurons and other tissues where
    it is expressed.
- description: Test interaction of full-length CG46301 and its HTH_NOL4 region with E93 by co-immunoprecipitation,
    and measure E93-dependent reporter activity with and without CG46301.
