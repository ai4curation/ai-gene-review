id: A0A1W5PXH3
gene_symbol: CG46301
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG46301 is the single Drosophila melanogaster member of the NOL4/NOL4L (nucleolar protein
  4) family. The gene model merges the former CG17341 and CG16879 annotations. A0A1W5PXH3 is its longest
  product (1237 residues). It has an N-terminal region that aligns with the N-terminal part of vertebrate
  NOL4 and a C-terminal NOL4 helical (HTH_NOL4) domain at residues 789-886, which is about 80% identical
  to the corresponding domain of human NOL4 and NOL4L. Much of the rest of the protein is predicted
  disordered and low-complexity, and a coiled coil lies near the C terminus. PANTHER places it in its own
  subfamily, separate from the vertebrate NOL4 and NOL4L subfamilies. By family inference it is a nuclear
  (nucleoplasmic) protein. Mammalian NOL4 splice variants bind Mblk-1-related transcription factors and
  modulate their transactivation, but no molecular activity, partner or biological process has been tested
  for the fly protein, and neither nucleolar residence nor a role in ribosome biogenesis is established.
