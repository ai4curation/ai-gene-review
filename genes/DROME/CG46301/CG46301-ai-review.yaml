description: CG46301 is a 1237-residue NOL4/NOL4L-family protein with a nucleolar-protein-4 helical domain.
  Its gene model incorporates the CG17341 and CG16879 names. A nuclear location is inferred by curated
  similarity annotation, while its molecular activity and the role of its extended sequence remain unresolved.
