- id: PMID:25366156
  title: Splicing variants of NOL4 differentially regulate the transcription activity of Mlr1 and Mlr2
    in cultured cells.
  findings:
  - statement: Mouse NOL4 splice variants bind the Mblk-1-related transcription factors Mlr1 and Mlr2
      and modulate their transactivation in reporter assays in S2 cells. The proteins assayed were murine,
      not fly CG46301.
    supporting_text: We identified nucleolar protein 4 (NOL4) splicing variants as major interaction partners
      for both Mlr1 and Mlr2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The cached abstract confirms that the study is of mouse NOL4 variants with mouse Mlr1/Mlr2.
      Drosophila S2 cells were only the reporter host. The proteins are vertebrate NOL4 (PANTHER SF17),
      so the paper is family background for CG46301 (SF22) and not direct evidence. Abstract only.
