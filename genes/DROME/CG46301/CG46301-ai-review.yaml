      supporting_text: 'FT   DOMAIN          789..886

        FT                   /note="Nucleolar protein 4 helical"

        FT                   /evidence="ECO:0000259|Pfam:PF23079"'
    - reference_id: file:DROME/CG46301/CG46301-bioinformatics/RESULTS-rereview.md
      supporting_text: The helical domain is equally similar to NOL4 and NOL4L, so it does not discriminate
        between them.
