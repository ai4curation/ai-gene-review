- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q96MY1
  review:
    action: ACCEPT
    summary: FlyBase transferred nucleoplasmic localization from human NOL4L by curator judgement. Family
      placement supports this.
    reason: The donor, human NOL4L (Q96MY1), is in PANTHER subfamily SF19 and the fly protein is in SF22,
      so this is a family-level transfer rather than a transfer within one subfamily. Nuclear localization
      is reported in both vertebrate subfamilies. Human NOL4 (SF17) and human NOL4L (SF19) both have nucleoplasm
      localization from HPA immunofluorescence, so this is a shared family property, not a feature of one
      paralog. The fly HTH_NOL4 domain is about 80% identical to both human proteins. Nucleoplasm is a
      broad location claim. It does not imply nucleolar residence, which is not established for the fly
      protein. No target-specific evidence contradicts the transfer. The term is no more specific than the
      evidence allows.
    supported_by:
    - reference_id: file:DROME/CG46301/CG46301-uniprot.txt
      supporting_text: DR   InterPro; IPR039788; NOL4/NOL4L.
