  title: 'Serine proteases and their homologs in the Drosophila melanogaster genome: an initial analysis
    of sequence conservation and phylogenetic relationships.'
  findings:
  - statement: Drosophila clip-domain SP inventory.
    supporting_text: Among the 147 SPs and 57 SPHs studied, 24 SPs and 13 SPHs contain at least one regulatory
      clip domain.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Genome-wide SP classification (abstract).
- id: PMID:1425342
  title: Activation of the easter zymogen is regulated by five other genes to define dorsal-ventral polarity
    in the Drosophila embryo.
  findings:
  - statement: Upstream maternal genes act solely by controlling Easter zymogen activation.
    supporting_text: The ea delta N mutant bypasses the requirement for five other maternal effect genes,
      indicating that these five genes exert their effects on dorsal-ventral patterning solely by controlling
      the activation of the easter zymogen.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Easter zymogen distribution and ea delta N epistasis (abstract).
- id: PMID:14654000
  title: A serpin regulates dorsal-ventral axis formation in the Drosophila embryo.
  findings:
  - statement: Loss of Spn27A causes uniform Toll signalling.
    supporting_text: Female flies deficient in Serpin-27A produce embryos that lack dorsal-ventral polarity
      and show uniform high levels of Toll signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Spn27A regulates the D/V cascade (abstract).
- id: PMID:14667416
  title: Spatial regulation of developmental signaling by a serpin.
  findings:
  - statement: A serpin confines Toll signalling to the ventral side.
    supporting_text: We show here that this cascade is regulated by a serpin-type serine protease inhibitor,
      which plays an essential role in confining Toll signaling to the ventral side of the embryo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Spn27A confines Toll signalling ventrally (abstract).
- id: PMID:16399077
  title: A Spätzle-processing enzyme required for toll signaling activation in Drosophila innate immunity.
  findings:
  - statement: Easter processes pro-Spaetzle during development; SPE in immunity.
    supporting_text: Although in Drosophila the Easter protease processes the pro-Spätzle protein to generate
      the Toll ligand during development
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'SPE vs Easter: separate processing enzymes for immunity vs development (abstract).'
- id: PMID:2107028
  title: Dominant and recessive alleles of the Drosophila easter gene are point mutations at conserved
    sites in the serine protease catalytic domain.
  findings:
  - statement: Dominant Easter alleles cleave the normal substrate but escape spatial regulation.
    supporting_text: The results suggest that the dominant easter products cleave the normal substrate,
      but fail to respond to a spatially asymmetric regulator.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Point mutations at conserved catalytic-domain sites (abstract).
- id: PMID:22578419
  title: A ventrally localized protease in the Drosophila egg controls embryo dorsoventral polarity.
  findings:
  - statement: Activated Easter processes Spaetzle into the Toll ligand.
    supporting_text: Activated Snk cleaves and activates Easter (Ea), exclusively on the ventral side
      of the embryo. Activated Ea then processes Spätzle (Spz) into the activating ligand for Toll
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; GD promotes Snk cleavage of Easter in ventral PVS.
- id: PMID:23729565
  title: In vitro maturation of Drosophila melanogaster Spätzle protein with refolded Easter reveals a
    novel cleavage site within the prodomain.
  findings:
  - statement: Refolded Easter cleaves pro-Spaetzle isoforms in vitro.
    supporting_text: show that the renatured enzyme performs the activation cleavage of two Spätzle isoforms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Refolded Easter performs Spz activation cleavage plus a secondary prodomain cleavage
      (abstract).
- id: PMID:2492450
  title: The role of easter, an apparent serine protease, in organizing the dorsal-ventral pattern of
    the Drosophila embryo.
