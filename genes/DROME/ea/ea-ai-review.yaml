- term:
    id: GO:0007311
    label: maternal specification of dorsal/ventral axis, oocyte, germ-line encoded
  evidence_type: TAS
  original_reference_id: PMID:10449356
  qualifier: involved_in
  review:
    summary: Review-based (TAS) annotation to maternal specification of the D/V axis of the oocyte, germ-line
      encoded.
    action: MODIFY
    reason: Easter mRNA is maternally supplied, but the term describes polarization of the oocyte itself.
      Easter acts after fertilization in the perivitelline space of the embryo to generate the Toll ligand;
      injected easter RNA rescues mutant embryos, showing the product is required only post-fertilization.
      The oocyte-polarity step is carried out by Gurken/EGFR signalling and Pipe in the follicle cells.
      The correct process for Easter is embryonic dorsal/ventral axis specification (GO:0009950), which
      the gene already carries by IMP.
    supported_by:
    - reference_id: PMID:2492450
      supporting_text: This result confirmed that the cDNA encodes easter and that the easter product
        is only required after fertilization.
    - reference_id: PMID:10449356
      supporting_text: Pipe regulates the production of an unidentified cue that activates the Toll signalling
        pathway.
    proposed_replacement_terms: &id016
    - id: GO:0009950
      label: dorsal/ventral axis specification
