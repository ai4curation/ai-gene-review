    action: MARK_AS_OVER_ANNOTATED
    reason: 'Absence of a ventral furrow is a downstream consequence of dorsalization: without Toll ligand
      there is no nuclear Dorsal, no twist/snail expression, and hence no mesoderm invagination. Easter
      does none of the work of ventral furrow formation (a cell-shape-change morphogenesis process); its
      participation is in generating the Toll ligand that specifies the D/V axis.'
    supported_by:
    - &id015
      reference_id: PMID:12493753
      supporting_text: mutations in Ea that abrogate Ca(2+) binding result in complete loss of activity
    - &id013
      reference_id: PMID:2492450
      supporting_text: Loss-of-function mutations in easter result in a dorsalization of the embryonic
        pattern, while dominant gain-of-function mutations ventralize the embryonic pattern.
