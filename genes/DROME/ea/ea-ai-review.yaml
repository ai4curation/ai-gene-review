id: P13582
gene_symbol: ea
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Easter (ea) is a secreted clip-domain serine protease of the trypsin-like S1A family (PANTHER
  PTHR24256, subfamily SF527 'serine protease Easter'). It is synthesised as a zymogen with an N-terminal
  clip domain and activation peptide, is maternally supplied, and functions in the perivitelline space
  of the early Drosophila embryo as the terminal protease of the Nudel/Gastrulation defective/Snake/Easter
  cascade. Easter zymogen is cleaved by Snake at Arg127-Ile128 only on the ventral side of the embryo,
  a step that depends on Pipe-mediated sulfation of vitelline membrane components and on Gastrulation
  defective. Activated Easter then cleaves pro-Spaetzle to release the C-terminal cystine-knot dimer that
  binds and activates the Toll receptor, establishing the ventral-to-dorsal nuclear gradient of Dorsal
  that specifies embryonic dorsal/ventral cell fates. Active Easter is rapidly trapped in a covalent complex
  by the serpin Spn27A, which confines signalling ventrally and shapes the gradient. A predicted Ca2+-binding
  loop is required for activity. Easter is not required for the immune Toll pathway, in which the related
  protease SPE processes Spaetzle.
