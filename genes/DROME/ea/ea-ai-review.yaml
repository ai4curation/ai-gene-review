- term:
    id: GO:0160032
    label: Toll receptor ligand protein activation cascade
  evidence_type: IDA
  original_reference_id: PMID:11296245
  qualifier: involved_in
  review:
    summary: Biochemical reconstruction showing Gd activates Snk, which activates Easter (LeMosy et al.
      2001).
    action: ACCEPT
    reason: Easter is the final protease of the Ndl/Gd/Snk/Ea cascade and itself catalyses the step that
      generates the Toll ligand, cleaving pro-Spaetzle. It therefore does the work of this cascade, not
      merely being acted upon (although it is also a substrate of Snk). This role is specific to Easter
      and its developmental pathway; Easter is not the Spaetzle-processing enzyme of the immune Toll pathway
      (that is SPE), so the term should not be transferred to other PTN001207268 members without direct
      evidence.
    supported_by:
    - &id019
      reference_id: PMID:11296245
      supporting_text: Here, we demonstrate biochemically that GD activates Snake, which in turn activates
        Easter.
