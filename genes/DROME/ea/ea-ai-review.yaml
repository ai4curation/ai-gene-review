- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:12421704
  qualifier: enables
  review:
    summary: Experimental serine endopeptidase annotation from PMID:12421704. Easter is a secreted trypsin-like
      (S1A) serine protease with an intact His-Asp-Ser catalytic triad; the activated enzyme cleaves pro-Spaetzle
      at Arg-Val to release the Toll ligand. Activity has been shown directly with recombinant and refolded
      enzyme and in embryo extracts.
    action: ACCEPT
    reason: Core molecular function of Easter. The cited work assays Easter catalytic activity directly
      or via processing of its substrate Spaetzle or its covalent trapping by the serpin Spn27A (a mechanism-based
      inhibitor that requires an active serine protease). Where only the abstract is cached, we defer
      to the curator, as the function is independently well established.
    supported_by:
    - &id007
      reference_id: PMID:12421704
      supporting_text: These mutant ea(D) proteins retain protease activity, as determined by the production
        of processed Spätzle both in the embryo and in cultured Drosophila cells.
