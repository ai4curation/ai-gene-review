suggested_questions:
- question: 'How does the Pipe-sulfated vitelline membrane cue, together with the non-catalytic N-terminal
    region of Gd, promote the productive Snake-Easter encounter: by scaffolding, by conformational activation,
    or by concentration?'
- question: Which of the node-level properties of PTN001207268 (serine endopeptidase activity, extracellular
    location) hold for the uncharacterised SF546 paralogs (CG30288, CG30289, CG30414, SPH158), and do
    any of them retain the catalytic triad?
suggested_experiments:
- description: Structure of the Snake-Easter-Gd complex bound to sulfated vitelline membrane proteins,
    to define how the ventral cue licenses Easter zymogen cleavage.
  experiment_type: structural biology
