- source: Alliance_Imported
  text: easter (ea) encodes a secreted serine protease that upon activation by the
    product of snk cleaves the ligand of the Toll pathway encoded by spz during early
    embryonic development. This ea role is restricted to the dorso-ventral patterning
    of the embryo.
