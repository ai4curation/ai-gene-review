descriptions:
- source: UniProt
  text: Component of the extracellular signaling pathway that establishes the dorsal-ventral
    pathway of the embryo (PubMed:12493753, PubMed:2107028, PubMed:9477324). A protease
    cascade involving ndl, gd, snk and ea results in activation of the spz Toll receptor
    ligand; acts downstream of ndl, gd and snk and is required for proteolytic processing
    of spz (PubMed:20605458, PubMed:9477324). Activation of ea requires both activation
    of the ndl-gd-snk protease cascade and sulfation of a vitelline membrane component
    by pip (PubMed:20605458). Localized activation of the Toll receptor in the ventral
    region of the embryo defines cell identities along the dorsal-ventral continuum
    (PubMed:9477324).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13582
