    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:40801807
    supporting_text: BNIP3 is required for mitophagosome formation.
  - reference_id: PMID:36323236
    supporting_text: We show that PGM requires the mitophagy receptor BNIP3, mitochondrial fission and translation
      factors, and members of the Atg1 complex, but not the mitophagy factors PINK1 and Parkin.
  - reference_id: PMID:37633267
    supporting_text: These results indicate that BNIP3 is required for mitophagy in the same cells where Rtnl1,
      Trp1 and Atl are specifically required for ER-phagy.
  - reference_id: PMID:41576035
    supporting_text: These data indicate that Mtch and BNIP3 function in the same genetic pathway to control
      enterocyte mitophagy during intestine development.
