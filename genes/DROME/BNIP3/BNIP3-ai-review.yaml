    summary: >-
      Schmid et al. 2022 (Nat Aging) showed that neuronal induction of BNIP3 promotes mitophagy and
      prevents dysfunctional mitochondria from accumulating in the ageing brain. In the full text,
      however, the mitophagy experiments overexpressed a human BNIP3 transgene (UAS-hBNIP3-HA). The
      only loss-of-function experiment on fly BNIP3 (RNAi) measured lifespan, not mitophagy.
    action: ACCEPT
