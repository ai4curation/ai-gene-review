  review:
    summary: >-
      A PAINT IBD at the bilaterian node PTN001032684. Every seed is a vertebrate protein
      (human, mouse, rat, zebrafish BNIP3/BNIP3L), and most come from overexpression-induced cell
      death assays.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      No Drosophila study shows a pro-apoptotic role for BNIP3. The available data point the other
      way. BNIP3 KO flies are viable. Overexpressing fly GFP-BNIP3 in larval muscle does not even
      induce mitophagy, and no toxicity was reported. Neuronal overexpression of human BNIP3 in
      flies reduced cleaved-caspase-3-positive cells in the aged brain. Fly BNIP3 has no
      recognisable BH3 consensus (only a W-rich segment aligns to the human BH3 region), and fly
      apoptosis is driven mainly by the IAP-antagonist pathway rather than BH3-only proteins. The
      vertebrate death activity may be a lineage-specific gain, or an overexpression phenotype,
      rather than an activity inherited at the Bilateria node. A latent death activity under
      strong overexpression has not been tested in flies, so this is marked as over-annotation
      rather than removed.
