    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:40801807
    supporting_text: We confirmed that HA-tagged Drosophila Atg18a co-immunoprecipitated with GFP-tagged full-length
      Drosophila BNIP3, and that this interaction was attenuated by the deletion of the MER (residues 42–53)
  - reference_id: PMID:40801807
    supporting_text: From these results, we conclude that both MER and LIR motifs contribute to BNIP3-mediated
      mitophagy, with some redundancy in their contributions to selectivity.
  - reference_id: PMID:40801807
    supporting_text: All BNIP3 constructs retain an intact TMD at the C-terminus, ensuring their localization
      to the outer mitochondrial membrane
- description: >-
    Developmentally programmed and stress-induced mitophagy in several tissues. BNIP3 is required
    to clear larval mitochondria during metamorphic muscle remodelling, for PINK1/Parkin-independent
    programmed germline mitophagy that enforces mtDNA quality control, and for developmental
    mitochondrial clearance in enterocytes, where it acts in a pathway with Mtch, Vps13D, PINK1 and
    Parkin.
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  locations:
