    - reference_id: PMID:40801807
      supporting_text: However, at 4 d APF, the Mito-GFP signal was nearly absent in the control, while a strong
        Mito-GFP signal was observed in the BNIP3 KO (Figure 6D, D’), indicating that BNIP3-mediated mitophagy
        degrades larval muscle mitochondria during muscle remodeling.
