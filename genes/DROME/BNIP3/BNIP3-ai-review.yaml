suggested_questions:
- question: >-
    Does fly BNIP3 have any cell-death-promoting activity when overexpressed at high levels? Is the
    W-rich segment that aligns with the vertebrate BH3 region a degenerate BH3 able to engage the
    fly Bcl-2 proteins Debcl or Buffy?
- question: >-
    Why does fly BNIP3 act independently of PINK1/Parkin in the germline but in one genetic pathway
    with Mtch, Vps13D, PINK1 and Parkin in enterocytes? Is the difference due to how BNIP3 is
    inserted and stabilised (Mtch-dependent) or to tissue-specific turnover (for example by an
    FBXL4 ortholog)?
- question: >-
    The PANTHER bilaterian node PTN001032684 carries vertebrate-only seeds for nucleus, positive
    regulation of apoptotic process and mitochondrial fragmentation involved in apoptotic process.
    Should these IBDs move to a vertebrate BNIP3/BNIP3L node, given no invertebrate support and
    the fly data against a pro-apoptotic role?
suggested_experiments:
- hypothesis: Fly BNIP3 lacks pro-apoptotic activity in vivo.
  description: >-
    Overexpress fly BNIP3 (wild type, LIR/MER mutants, and a variant with the W-rich segment
    mutated) at high levels in the larval eye disc and wing disc. Score apoptosis (cleaved Dcp-1,
    TUNEL, adult eye/wing phenotypes) with and without p35 or Diap1 co-expression. Test binding to
    Debcl and Buffy by co-IP.
  experiment_type: in vivo overexpression and cell-death assay
- hypothesis: Endogenous fly BNIP3 is exclusively at the mitochondrial outer membrane, with no functional nuclear pool.
  description: >-
    Make an endogenous N-terminal GFP knock-in of BNIP3 (keeping the tail anchor intact). Image
    embryos, ovaries, remodelling muscle and enterocytes, and do nuclear/mitochondrial
    fractionation, to test the high-throughput nuclear localization call.
  experiment_type: endogenous tagging and localization
