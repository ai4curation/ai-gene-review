    summary: >-
      Taoka et al. 2025 (eLife) studied BNIP3 KO and RNAi in dorsal internal oblique muscles, where
      larval muscle mitochondria normally go during metamorphic remodelling. Loss of BNIP3 blocks
      mitophagy flux (Mito-QC), stops mitophagosomes forming, and lets larval mitochondria
      accumulate. Full-length BNIP3 rescues; LIR+MER double mutants do not.
    action: ACCEPT
