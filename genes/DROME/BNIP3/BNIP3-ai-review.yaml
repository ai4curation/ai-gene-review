  review:
    summary: >-
      Palozzi et al. 2022 (Cell Metab) ran a large-scale screen in the female germline. They found
      that programmed germline mitophagy (PGM), which enforces mtDNA quality control, requires
      BNIP3 and the Atg1 complex but not PINK1/Parkin.
    action: ACCEPT
    reason: >-
      Only the abstract is cached, but it states plainly that PGM requires BNIP3. The result agrees
      with Lieber et al. 2019 (germline RNAi of BNIP3 blocks mtDNA selection) and with the
