    action: KEEP_AS_NON_CORE
    reason: >-
      "Is active in nucleus" asserts that the protein does its function in the nucleus. The
      vertebrate seeds reflect context-specific nuclear pools of BNIP3/NIX (for example in
      glioma, neurons and cardiomyocytes) that are minor relative to the mitochondrial pool. No
      invertebrate member has evidence of a nuclear activity, and every fly function described
      (mitophagy receptor activity) is carried out at the OMM. The fly HDA nuclear call
