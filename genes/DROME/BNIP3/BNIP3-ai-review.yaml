gene_symbol: BNIP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  BNIP3 (CG5059) is the single Drosophila ortholog of the vertebrate mitophagy receptors BNIP3
  and BNIP3L/NIX (NIP3 family, PANTHER PTHR15186). It is a 201-residue tail-anchored protein of
  the mitochondrial outer membrane. A C-terminal transmembrane helix anchors it in the membrane,
  and the N-terminal region faces the cytosol. That region carries an LC3-interacting region
  (LIR, WIEL at residues 16-19) and a minimal essential region (MER, residues 42-53). Fly BNIP3
  acts as a receptor for selective autophagy of mitochondria (mitophagy). The LIR binds Atg8a
  and the MER binds the WIPI ortholog Atg18a, so BNIP3 recruits autophagic membranes to
  mitochondria. The two motifs act partly redundantly. BNIP3 is required for several
  developmentally programmed and stress-induced mitophagy programmes: removal of larval muscle
  mitochondria during metamorphic muscle remodelling; programmed germline mitophagy, which
  enforces mtDNA quality control in the ovary independently of PINK1 and Parkin; developmental
  mitochondrial clearance in the intestine, where it acts in a genetic pathway with Mtch, Vps13D,
  PINK1 and Parkin; hypoxia-induced mitophagy in larval muscle; and mitophagy in ageing flight
  muscle. Loss of BNIP3 is compatible with viability but causes mitochondria to accumulate in
  these tissues and shortens adult lifespan. Unlike vertebrate BNIP3, fly BNIP3 has no
  recognisable BH3 consensus. There is no experimental evidence in Drosophila for a pro-apoptotic
  role, nor for ER or ER-phagy receptor function.
