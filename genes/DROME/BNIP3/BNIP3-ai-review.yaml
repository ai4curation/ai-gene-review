      a nuclear activity at the Bilateria node is not supported by invertebrate data. A
      high-throughput fly observation of nuclear signal does exist, so the row is kept as
      non-core (matching the HDA row) rather than marked as over-annotation, with the caveat that
      the node placement deserves PAINT re-examination.
