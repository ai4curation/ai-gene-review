    summary: >-
      A logical-inference annotation derived from GO:0140580 to the term labelled "obsolete
      substrate localization to autophagosome".
    action: REMOVE
    reason: >-
      The GOA label itself marks the term as obsolete, so the annotation is not useful. The
      underlying biology (recruiting mitochondria to autophagic membranes) is fully captured by
      GO:0140580 mitochondrion autophagosome adaptor activity and GO:0000423 mitophagy. This
      matches the action taken for the same row on human BNIP3.
- term:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:40801807
  qualifier: enables
  review:
    summary: >-
      Taoka et al. 2025 show that fly BNIP3 recruits autophagic machinery to mitochondria. Its LIR
      binds Atg8a and its MER binds Atg18a. Atg18a co-immunoprecipitates with BNIP3 in a
      MER-dependent way. LIR+MER mutations abolish BNIP3-mediated mitochondrial clearance in vivo
      and stop BNIP3 itself being degraded by autophagy.
    action: ACCEPT
    reason: >-
      This is the core molecular function. Binding to autophagosome-machinery proteins is shown,
      the binding motifs are mapped, and in vivo rescue shows the motifs are needed for
      mitochondrial clearance.
    supported_by:
    - reference_id: PMID:40801807
      supporting_text: We confirmed that HA-tagged Drosophila Atg18a co-immunoprecipitated with GFP-tagged full-length
        Drosophila BNIP3, and that this interaction was attenuated by the deletion of the MER (residues 42–53)
    - reference_id: PMID:40801807
      supporting_text: Furthermore, the combination of ΔLIR and ΔMER resulted in mitochondria accumulation nearly
        identical to that observed in BNIP3 KO flies
    - reference_id: PMID:40801807
      supporting_text: From these results, we conclude that both MER and LIR motifs contribute to BNIP3-mediated
        mitophagy, with some redundancy in their contributions to selectivity.
