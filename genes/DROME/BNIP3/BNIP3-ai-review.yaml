core_functions:
- description: >-
    Mitophagy receptor in the mitochondrial outer membrane. Tail-anchored BNIP3 tethers
    mitochondria to forming autophagosomes. Its N-terminal LIR binds Atg8a and its MER binds
    Atg18a, which recruits autophagic machinery and drives selective autophagic removal of
    mitochondria.
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
