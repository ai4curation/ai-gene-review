suggested_questions:
- question: PANTHER 19.0 HMMs place CG43742 in PTHR24260:SF147 while UniProt and the GOA IBA rows use PTHR24256/PTN000667087;
    does the innate-immune IBA still hold once the PAINT tree is reconciled with the SF147 placement?
- question: Is CG43742 secreted into the hemolymph by the fat body, and which protease activates its zymogen?
suggested_experiments:
- description: Express recombinant CG43742 (wild type and S207A), activate it, and profile cleavage specificity
    on peptide libraries to test whether the N-terminal domain is an active endopeptidase.
- description: Make a CG43742 null allele and test larval hemolymph protease activity, melanization and survival
    after bacterial, fungal and parasitoid-wasp challenge, alongside CG10764 mutants.
