- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0027930
  - FB:FBgn0030051
  - FB:FBgn0030926
  - FB:FBgn0039102
  - FB:FBgn0039494
  - FB:FBgn0051217
  - FB:FBgn0052382
  - FB:FBgn0052383
  - PANTHER:PTN000667087
  - UniProtKB:A0A1S4H5S2
  review:
    action: KEEP_AS_NON_CORE
    summary: Innate-immune participation is supported as a PAINT ancestral inference.
    reason: PAINT placed GO:0045087 at PTN000667087, an Ecdysozoa-level ancestor whose seeds are Drosophila and
      mosquito CLIP proteases of the Toll and melanization cascades (psh, MP1, spirit, SPE, grass, sphinx1/2, modSP).
      CG43742 descends from that node, so the IBA is a deliberate phylogenetic judgment and there is no target-specific
      evidence of loss. In PANTHER 19.0, however, CG43742 is classified in PTHR24260:SF147, which contains none
      of the seeds and also contains the developmental protease Snake; the nearest characterized relative on its
      tandem-domain branch, CG10764/SP77, is supported only by an RNAi encapsulation phenotype. The immune-process
      inference is therefore kept as a plausible but non-core, ancestral assertion.
    supported_by:
    - reference_id: file:DROME/CG43742/CG43742-bioinformatics/RESULTS.md
      supporting_text: The PANTHER 19.0 fruit-fly HMM classification assigns A0A0B4KFF2 to PTHR24260:SF147 (EG:BACR7A4.3
        PROTEIN-RELATED)
    - reference_id: file:DROME/CG43742/CG43742-bioinformatics/RESULTS.md
      supporting_text: all fall in other PTHR24260 subfamilies (SF134-SF145) in PANTHER 19.0, not in SF147.
    - reference_id: PMID:33644706
      supporting_text: CG10764 likely encodes an active serine protease, and may influence immune activation through
        the direct cleavage of target proteins.
    additional_reference_ids:
    - file:interpro/panther/PTHR24256/PTHR24256-paint.tsv
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000667087
        source_status: SUPPORTS_TRANSFER
        comment: PAINT places an innate-immune assertion at the Ecdysozoa-level ancestor; CG43742 is below the node,
          though in PANTHER 19.0 it sits in subfamily SF147 that contains none of the experimental seeds. No target-specific
          loss or incompatible sequence change was found; the catalytic triad of domain 1 is intact.
- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026902
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Protein maturation is an ARBA association that asserts a processing role with no identified substrate.
    reason: This IEA comes only from an ARBA machine-learning rule (ARBA00026902). Protein maturation would require
      CG43742 to process a specific precursor (as Toll-pathway or prophenoloxidase-activating CLIP proteases do),
      and no substrate, cascade position or processing event is known for this protein. Generic proteolysis captures
      what its sequence supports; the more specific maturation process is an over-annotation.
    supported_by:
    - reference_id: file:DROME/CG43742/CG43742-bioinformatics/RESULTS.md
      supporting_text: 'S1 domain 1 (residues 35-258) carries H73 in a TAAHC motif, D121 and S207 in a DSGGP motif:
        the His-Asp-Ser triad is complete.'
