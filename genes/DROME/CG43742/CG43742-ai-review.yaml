id: A0A0B4KFF2
gene_symbol: CG43742
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG43742 (SP251) encodes a 474-residue secreted serine protease of the S1A (chymotrypsin-fold) family
  with two tandem trypsin-like domains and no clip domain. The N-terminal S1 domain (residues 35-258) retains the
  complete His73-Asp121-Ser207 catalytic triad, whereas the C-terminal S1 domain (282-472) lacks the catalytic histidine
  and serine motifs and is a non-catalytic protease-like domain. A predicted signal peptide (1-20) indicates secretion.
  Phylogenetically it groups with other long tandem-domain S1A proteins of Drosophila, including CG10764/SP77, within
  a fly-expanded protease subfamily. It is predicted to act as an extracellular serine endopeptidase, but its substrates,
  activating protease and physiological role have not been studied experimentally.
