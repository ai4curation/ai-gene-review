taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Dph1 is the Drosophila ortholog of DPH1/OVCA1, the [4Fe-4S]-cluster-containing catalytic
  subunit of the DPH1-DPH2 heterodimeric radical SAM enzyme that performs the first step of diphthamide
  biosynthesis. The complex transfers the 3-amino-3-carboxypropyl group of S-adenosyl-L-methionine to
  the conserved histidine of translation elongation factor 2 (eEF2) in the cytoplasm; the diphthamide
  modification is later completed by Dph5, Dph6 and Dph7 and contributes to translational fidelity. In
  humans, DPH1 loss of function causes a recessive neurodevelopmental syndrome.
