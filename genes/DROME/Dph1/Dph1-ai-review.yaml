suggested_questions:
- question: Is diphthamide synthesis essential in Drosophila, and do Dph1 or Dph2 mutants show reduced
    translational fidelity (-1 frameshifting) or developmental phenotypes comparable to the human DPH1
    syndrome?
suggested_experiments:
- hypothesis: Loss of Dph1 abolishes diphthamide on Drosophila eEF2.
  description: Generate Dph1 null flies and test eEF2 diphthamide status by diphtheria toxin ADP-ribosylation
    and mass spectrometry, then measure -1 ribosomal frameshifting with dual-luciferase reporters.
  experiment_type: genetic knockout plus biochemistry
