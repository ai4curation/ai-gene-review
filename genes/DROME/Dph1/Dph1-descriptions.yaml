- source: Alliance_Automated
  text: Predicted to enable 2-(3-amino-3-carboxypropyl)histidine synthase activity.
    Predicted to be involved in protein histidyl modification to diphthamide. Predicted
    to be located in cytoplasm. Predicted to be part of 2-(3-amino-3-carboxypropyl)histidine
    synthase complex. Is expressed in several structures, including amnioserosa; anterior
    endoderm; embryonic/larval midgut primordium; ganglia; and gut section. Human
    ortholog(s) of this gene implicated in diphthamide deficiency syndrome 1. Orthologous
    to human DPH1 (diphthamide biosynthesis 1).
  source_type: automated
