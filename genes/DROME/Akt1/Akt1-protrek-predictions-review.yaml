    label: torso signaling pathway
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 16.46). Torso is a Drosophila receptor tyrosine kinase acting through
      Ras/MAPK to pattern the embryonic termini; Akt1 is the AGC-family kinase downstream of PI3K
      in insulin signalling. The two pathways are distinct and Akt1 has no annotated role in torso
      signalling. With ranks 2, 4 and 5 also torso terms, four of the five calls commit to one wrong
      pathway.
    supported_by:
