    id: GO:0016029
    label: subrhabdomeral cisterna
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: LOCALIZATION_DEFAULT
    summary: >-
      Rank 3 (score 16.37). The subrhabdomeral cisterna is a specialised endoplasmic reticulum compartment
      of Drosophila photoreceptor cells. Akt1 is annotated by IDA to the nucleus, cytosol, cell cortex
      and neuronal cell body; nothing places it in photoreceptor ER. Taken together the top five would
      give a curator five confident, specific and entirely wrong annotations for one of the best-studied
      kinases in the organism.
    supported_by:
