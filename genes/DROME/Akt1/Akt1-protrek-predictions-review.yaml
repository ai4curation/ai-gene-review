id: Q8INB9
gene_symbol: Akt1
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Drosophila Akt1 (protein kinase B). This is the cohort's
  most complete failure on a well-characterised gene: all five top calls concern the Torso receptor
  tyrosine kinase pathway or a photoreceptor ER structure, and none of Akt1's 50 GOA terms - protein
  serine/threonine kinase activity with IDA and IMP evidence, insulin receptor signalling with five
  independent evidence codes, PI3K/PKB signal transduction - appears anywhere in the top five. The
  free-text channel fails differently and equally badly, returning descriptions of the C. elegans
  caspase homolog cnt-1. The UniProt entry's own PANTHER assignment for this protein is PTHR24351,
  ribosomal protein S6 kinase, so the automatic annotation is off-target too; only the curated GOA
  identifies the protein correctly. Assessment: 3 nonparalog incorrect (NPI).
