descriptions:
- source: UniProt
  text: Serine/threonine kinase involved in various developmental processes (PubMed:10587646,
    PubMed:10962553, PubMed:11740943, PubMed:11872800, PubMed:12172554, PubMed:12893776,
    PubMed:14525946, PubMed:15466161, PubMed:15712201, PubMed:9601646). During early
    embryogenesis, acts as a survival protein (PubMed:10962553, PubMed:9601646). During
    mid-embryogenesis, phosphorylates and activates trh, a transcription factor required
    for tracheal cell fate determination (PubMed:11740943). Also regulates tracheal
    cell migration (PubMed:11740943, PubMed:14525946). Later in development, acts
    downstream of PI3K and Pk61C/PDK1 in the insulin receptor transduction pathway
    which regulates cell growth and organ size, by phosphorylating and antagonizing
    FOXO transcription factor (PubMed:10587646, PubMed:10962553, PubMed:11752451,
    PubMed:12893776, PubMed:24603715, PubMed:25329475, PubMed:29025897). Controls
    follicle cell size during oogenesis (PubMed:15712201). May also stimulate cell
    growth by phosphorylating Gig/Tsc2 and inactivating the Tsc complex (PubMed:12172554,
    PubMed:15466161). Dephosphorylation of 'Ser-586' by Phlpp triggers apoptosis and
    suppression of tumor growth (PubMed:10962553).
