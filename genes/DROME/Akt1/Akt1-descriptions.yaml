- source: Alliance_Imported
  text: Akt kinase (Akt) encodes the core kinase component of the insulin/insulin-like
    growth factor pathway. It functions downstream of the product of Pi3K92E and is
    activated by phosphatidylinositol binding and phosphorylation. It regulates cell
    growth and survival, stress responses and ageing.
