- source: Alliance_Automated
  text: Enables protein serine kinase activity and protein serine/threonine kinase
    activity. Involved in several processes, including cell surface receptor protein
    tyrosine kinase signaling pathway; negative regulation of cell communication;
    and regulation of neuron projection development. Acts upstream of with a positive
    effect on regulation of growth and regulation of hemocyte proliferation. Located
    in several cellular components, including cell cortex; cytosol; and neuronal cell
    body. Is expressed in several structures, including anterior endoderm; egg chamber;
    embryonic/larval midgut primordium; ganglia; and gut section. Used to study Parkinson's
    disease; alcohol use disorder; carcinoma; and type 2 diabetes mellitus. Human
    ortholog(s) of this gene implicated in several diseases, including Cowden syndrome
    6; Proteus syndrome; amphetamine abuse; disease of cellular proliferation (multiple);
    and glucose metabolism disease (multiple). Orthologous to human AKT1 (AKT serine/threonine
    kinase 1); AKT2 (AKT serine/threonine kinase 2); and AKT3 (AKT serine/threonine
    kinase 3).
