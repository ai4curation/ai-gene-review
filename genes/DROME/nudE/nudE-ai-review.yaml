id: Q9VT70
gene_symbol: nudE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: NudE is the single Drosophila member of the NudE/NDE1-NDEL1 family, a coiled-coil protein
  that binds Lis1 and cytoplasmic dynein and tethers Lis1 to the motor to promote dynein function. In
  dividing larval neuroblasts NudE localizes to kinetochores (dependent on Lis1 and Cenp-meta) and streams
  onto kinetochore microtubules; it is needed for focused spindle poles, attachment of centrosomes to
  the spindle, chromosome congression and dynein-dependent stripping of checkpoint proteins, so null mutant
  neuroblasts arrest in metaphase. In male meiosis it associates with the nuclear envelope and spindle
  envelope and is required for centrosome migration from the cortex to the nucleus and accurate chromosome
  segregation. In the ovary NudE is required in the germline for oocyte specification, and in border cells
  for collective migration. In sensory neurons it co-moves with Golgi outposts and other cargoes and is
  required, with Lis1, for dendrite arborization, uniform axonal microtubule polarity and positioning
  of the nucleus relative to the primary dendrites.
