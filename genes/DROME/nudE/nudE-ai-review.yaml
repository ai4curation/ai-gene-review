- term:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  evidence_type: ISS
  original_reference_id: PMID:37940657
  qualifier: enables
  review:
    summary: NudE-family proteins bind dynein and Lis1 and promote Lis1-mediated assembly of activated
      dynein-dynactin-adaptor complexes; Drosophila NudE requires its Lis1-binding residues for function
      and its loss is rescued by raising Lis1.
    action: NEW
    reason: 'The existing annotations carry no molecular function beyond microtubule binding (not core
      for the fly protein). Human Nde1 recruits Lis1 to autoinhibited dynein and promotes activated-complex
      assembly in reconstitution. Fly genetics are consistent with the same activity: Lis1-binding mutant
      NudE only partially rescues, and extra Lis1 fully rescues nudE dendrite defects, and NudE regulates
      dynein function at kinetochores. GO:0140659 matches the module term for the NudE unit and the human
      NDEL1 review. Proposed as ISS because the direct biochemistry is on the human protein. Falcon deep
      research agrees (non-enzymatic dynein regulatory cofactor) and notes that stable soluble NudE-dynein
      association was not detected in the fly TAP experiment, reinforcing that the direct-activity evidence
      is from the human protein.'
    supported_by:
    - &id020
      reference_id: PMID:37940657
      supporting_text: We find that Nde1 recruits Lis1 to autoinhibited dynein and promotes Lis1-mediated
        assembly of dynein-dynactin adaptor complexes
    - &id019
