descriptions:
- source: UniProt
  text: Chaperone protein with functions in nuclear localization (PubMed:26490864).
    Required for centrosome duplication and formation and function of the mitotic
    spindle (By similarity). In postmitotic neurons, acts with nudC downstream of
    dar1 to ensure correct positioning of the nuclei in primary dendrites and as a
    consequence, is required for determining multipolar neuron morphology (PubMed:26490864).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VT70
  source_id: Q9VT70
  review:
    reviewer: AI
    rubrics:
