      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Chaperone with roles in nuclear localization, centrosome duplication
      (by similarity) and neuronal nuclear positioning downstream of dar1. Calling
      it a chaperone misses that it is a Lis1-dynein regulator.
- source: Alliance_Imported
  text: nudE (nudE) encodes a conserved protein that localizes to kinetochores and
    spindle microtubules. It contributes to the spindle checkpoint, spindle orientation,
    centrosome behavior and dendrite morphogenesis.
  source_type: curated
  url: https://flybase.org/reports/nudE.html
  source_id: FB:FBgn0036059
