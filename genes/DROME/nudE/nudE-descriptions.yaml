    overall_notes: 'Correct: kinetochore and spindle microtubule localization, spindle
      checkpoint, spindle orientation, centrosome behaviour and dendrite morphogenesis.
      Lis1 and dynein are not named.'
- source: Alliance_Automated
  text: Predicted to enable microtubule binding activity. Involved in several processes,
    including neuron projection morphogenesis; nuclear chromosome segregation; and
    oogenesis. Located in several cellular components, including kinetochore; spindle;
    and spindle envelope. Is expressed in germline cell; pole plasm; and primordial
    germ cell. Used to study Rubinstein-Taybi syndrome. Human ortholog(s) of this
    gene implicated in lissencephaly 4 and microcephaly. Orthologous to several human
    genes including NDEL1 (nudE neurodevelopment protein 1 like 1).
  source_type: automated
