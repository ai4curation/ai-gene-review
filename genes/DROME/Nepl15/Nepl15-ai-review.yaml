core_functions:
- description: Nepl15 is a predicted secreted, non-catalytic M13-family protein of the fat body. It is
    required for normal triacylglyceride and glycogen storage, and overexpression increases that storage.
    These genetic findings are experimental. Its molecular activity is unknown. Peptide binding and
    sequestration has been proposed but not tested, so no molecular function or process term is asserted.
    The extracellular location is predicted from sequence, not shown experimentally.
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:33483521
    supporting_text: these results suggest that Nepl15 is required for normal TAG and glycogen storage in
      both males and females
  - reference_id: PMID:33483521
    supporting_text: Nepl15 is likely to be a secreted protein, rather than a transmembrane protein.
  - reference_id: file:DROME/Nepl15/Nepl15-bioinformatics/RESULTS.md
    supporting_text: The sequence therefore predicts a secreted protein, not a type II membrane protein.
knowledge_gaps:
- gap_statement: The molecular activity of Nepl15 is unknown. The protein is predicted to lack peptidase
    activity, and no ligand or binding partner has been identified to explain its effect on nutrient
    storage.
  boundary: Nepl15 is a fat-body-enriched M13 protein that is predicted to be secreted. It has lost the
    zinc ligands and the catalytic glutamate. Loss and overexpression change triacylglyceride and glycogen
    storage in opposite directions.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Test whether secreted Nepl15 binds candidate neuropeptides (for example sNPF, NPF,
    tachykinins, allatostatins or drosulfakinins) and protects them from cleavage by active neprilysins.
  provenance:
  - reference_id: PMID:33483521
    supporting_text: Protein modeling suggests that Nepl15 is able to bind and sequester peptide targets
      of catalytically active Drosophila M13 family members
suggested_questions:
- question: Is Nepl15 secreted into the hemolymph by the fat body, and which tissues does the secreted
    protein reach?
- question: Does Nepl15 act on nutrient storage directly, for example by regulating a peptide hormone
    pathway, or indirectly through the slower larval development of the mutants? If a direct role is
    established, would regulation of lipid storage (GO:0010883) be the appropriate process term?
- question: Is the eye-disc RNAi phenotype reproduced in the Nepl15 knockout, or is it an off-target
    effect of the single RNAi strain?
suggested_experiments:
- description: Express epitope-tagged Nepl15 in the fat body and detect it in hemolymph and in conditioned
    medium of S2 cells, to test the predicted secretion experimentally.
- description: Assay recombinant Nepl15 against standard neprilysin peptide substrates, with Nep2 or Nep4
    as positive controls and a variant in which R521, Q522 and R582 are reverted to H, E and E. Measure
    binding of candidate neuropeptides to the wild-type protein.
- description: Examine the eyes of Nepl15 knockout flies, and repeat the eye-disc knockdown with an
    independent RNAi line, to test the RNAi-based eye-development phenotype.
