- term:
    id: GO:0001745
    label: compound eye morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:22952997
  qualifier: involved_in
  review:
    summary: In an RNAi screen of genes induced downstream of Eyeless and Notch, knockdown of CG4721
      (Nepl15) with several eye-disc Gal4 drivers gave a strong eye phenotype. Atonal-dependent R8
      selection and the progression of the morphogenetic furrow were disrupted. This is the only
      experimental basis for the annotation.
    action: KEEP_AS_NON_CORE
    reason: The full text was read. The phenotype was reproduced with several drivers, but every
      experiment used one UAS-RNAi strain, and no rescue or second independent reagent is reported. The
      later knockout study describes homozygous null flies as viable and fertile and does not report an
      eye defect, so the RNAi result has not been confirmed genetically. The molecular basis is unknown,
      and for a predicted secreted non-catalytic protein any role in eye patterning is likely to be
      indirect. Following the policy of deferring to curator-made experimental annotations, the row is
      kept, but as a non-core developmental role and not as evidence of mechanism.
    supported_by:
    - reference_id: PMID:22952997
      supporting_text: This approach uncovered a strong phenotype for the RNAi strain targeting the CG4721
        gene.
    - reference_id: PMID:22952997
      supporting_text: we have shown that the predicted gene CG4721, which was identified by our transcriptomics
        approach, has a previously unknown function in Drosophila eye development.
    - reference_id: PMID:33483521
      supporting_text: Homozygous knockout flies are viable and fertile.
