  review:
    summary: Nepl15 inherits this plasma-membrane location from the PAINT node PTN000199753. The donors
      at that node are type II membrane ectoenzymes. Nepl15 has a signal peptide and no transmembrane
      anchor, so it has lost that membrane anchor and is predicted to be secreted.
    action: MODIFY
    reason: The PAINT placement fits the ancestral M13 proteins (MME, ECE1, KEL, PHEX and their rodent
      and fly orthologs), which are anchored by an N-terminal signal-anchor segment. Nepl15 differs from
      them. Its only hydrophobic segment is the SignalP signal peptide at residues 1-22, and no later
      segment is hydrophobic enough to act as an anchor. The authors who characterised Nepl15 also
      describe it as likely secreted, a feature shared by most Drosophila Nepl15 orthologs. This is
      target-specific evidence that the inherited location has been lost, so the row is modified to
      extracellular region. No experiment has localized the protein, and the replacement remains a
      sequence-based prediction.
