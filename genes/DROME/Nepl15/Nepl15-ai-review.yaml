- id: PMID:33483521
  title: The Drosophila melanogaster Neprilysin Nepl15 is involved in lipid and carbohydrate storage.
  findings:
  - statement: Nepl15 is predicted to be secreted and catalytically inactive, from sequence analysis and
      homology modelling.
    supporting_text: Nepl15 has changes in critical catalytic residues that are conserved across the Drosophila
      genus and likely renders the Nepl15 protein catalytically inactive.
  - statement: Nepl15 knockout males store less triacylglyceride and glycogen.
    supporting_text: Knock-out mutations in Nepl15 result in reduced levels of triglycerides and glycogen
      in adult males but not in females.
  - statement: Overexpression of Nepl15 increases nutrient storage.
    supporting_text: Conversely, over-expression of Nepl15 in certain tissues results in increases in triglyceride
      and glycogen storage in males.
  - statement: Peptide sequestration is proposed from modelling and has not been tested.
    supporting_text: Protein modeling suggests that Nepl15 is able to bind and sequester peptide targets
      of catalytically active Drosophila M13 family members
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This is the primary functional study, with a knockout made by ends-out
      recombination, Gal4-driven overexpression and expression profiling. The secretion and inactivity
      claims are predictions (signal-peptide analysis and homology models), not experiments. The storage
      phenotypes are experimental. GOA carries no annotation from this paper.
