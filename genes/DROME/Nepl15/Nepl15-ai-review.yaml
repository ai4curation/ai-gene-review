gene_symbol: Nepl15
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nepl15 (CG4721) is a neprilysin-like protein of the M13 metallopeptidase family in Drosophila
  melanogaster. Its gene lies in a tandem cluster with Nepl13 and Nepl14 at cytological band 94C4, and
  the protein belongs to the insect-specific PANTHER subfamily PTHR11733:SF238. The 686-residue protein
  keeps the M13 N-terminal and C-terminal domains and the overall neprilysin fold. It has an N-terminal
  signal peptide and no transmembrane anchor, so it is predicted to be secreted rather than to be a type
  II membrane ectoenzyme like neprilysin. Two of the three zinc ligands are replaced by arginine and the
  catalytic glutamate by glutamine (HExxH reads RQMLH), and these changes are conserved across Drosophila
  Nepl15 orthologs, so the protein is predicted to be catalytically inactive. Nepl15 transcripts are most
  abundant in the larval and adult fat body. Knockout flies are viable and fertile but store less
  triacylglyceride and glycogen as adult males, develop more slowly as larvae and die sooner under
  starvation, and overexpression increases triacylglyceride and glycogen storage. Knockout females live
  longer, according to a preprint. RNAi knockdown in the developing eye disc disrupts ommatidial
  patterning. How the protein acts is unknown. One proposal, from homology modelling only, is that it
  binds and sequesters neuropeptides that active neprilysins would otherwise cleave.
