- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000718
  - InterPro:IPR008753
  - InterPro:IPR018497
  review:
    summary: InterPro2GO assigns proteolysis to every protein that matches the M13 family and domain
      signatures. Nepl15 matches them because it keeps the M13 fold, but it has lost the zinc ligands
      and the catalytic glutamate. This review accepts its two NOT peptidase activity annotations.
    action: REMOVE
    reason: A gene product is involved in proteolysis only if it does some of the work, normally by
      hydrolysing peptide bonds. In Nepl15, H584 and E647 of human neprilysin, which coordinate zinc,
      align to R521 and R582, and the catalytic E585 aligns to Q522. The authors who characterised
      Nepl15 report the same substitutions and find them conserved across Drosophila Nepl15 orthologs.
      No peptidase assay, substrate or partner protease has been reported. The domain-to-GO mapping
      therefore fails for this pseudoenzyme, and a positive proteolysis assertion would contradict the
      accepted NOT peptidase activity rows. If Nepl15 is later shown to sequester peptides and protect
      them from active neprilysins, that would be a binding or regulatory role and would need its own
      annotation.
    supported_by:
    - reference_id: file:DROME/Nepl15/Nepl15-bioinformatics/RESULTS.md
      supporting_text: Two of the three zinc ligands
        (H584 and E647) are replaced by arginine, and the catalytic glutamate is replaced by glutamine.
    - reference_id: PMID:33483521
      supporting_text: two of the three His and Glu residues involved in Zn(II) coordination in M13 family
        members are changed to Arg in the Drosophila Nepl15 orthologs
    - reference_id: PMID:33483521
      supporting_text: the Glu residue that helps deprotonate the hydrolytic water in other M13 family
        members is replaced by Gln
