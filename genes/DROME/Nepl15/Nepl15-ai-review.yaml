  review:
    summary: This NOT peptidase activity annotation is accepted. FlyBase made it from the genome-wide
      Drosophila Nep/Nepl motif survey, which places Nepl15 among the Nepl proteins that lack catalytic
      motifs.
    action: ACCEPT
    reason: The survey classified every fly M13 protein by the presence of the HExxH, ENIAD, CxxW and
      NAY/FY motifs, and Nepl15 falls into the motif-deficient Nepl class. The exact-sequence alignment
      and the primary Nepl15 paper agree. This is the same claim as the GO_REF:0000047 row, and both are
      accepted.
