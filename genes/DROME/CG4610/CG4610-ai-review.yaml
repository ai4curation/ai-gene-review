suggested_questions:
- question: Do Drosophila mitochondrial tRNAs carry taurinomethyluridine at U34, as in mammals, and is
    the taurine-specific MF term appropriate for the fly GTPBP3-MTO1 complex?
suggested_experiments:
- hypothesis: CG4610 loss abolishes the U34 C5 modification of fly mt-tRNAs and impairs mitochondrial
    translation.
  description: Mass-spectrometric nucleoside analysis of purified mt-tRNAs from CG4610 mutant or knockdown
    flies, combined with mitochondrial ribosome profiling or respiratory chain assays.
