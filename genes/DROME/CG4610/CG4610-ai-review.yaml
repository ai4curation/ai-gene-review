id: Q9W245
gene_symbol: CG4610
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG4610 encodes the Drosophila ortholog of MTO1 (bacterial MnmG/GidA), an FAD-dependent MnmG-family
  enzyme. By homology it acts with the GTPBP3 ortholog CG18528 in the mitochondrial GTPBP3-MTO1 complex,
  which modifies the wobble uridine (U34) of a subset of mitochondrial tRNAs at C5 (taurinomethylation
  in mammals), a modification that supports accurate codon reading during mitochondrial translation. No
  Drosophila-specific experimental studies have been reported; function and mitochondrial location are
  inferred from orthologs.
