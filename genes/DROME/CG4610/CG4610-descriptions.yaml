  text: Predicted to enable flavin adenine dinucleotide binding activity. Predicted
    to contribute to tRNA 5-taurinomethyluridine synthase activity. Predicted to be
    involved in mitochondrial tRNA wobble uridine modification. Predicted to be located
    in cytoplasm. Predicted to be part of GTPBP3-MTO1 complex. Predicted to be active
    in mitochondrion. Human ortholog(s) of this gene implicated in combined oxidative
    phosphorylation deficiency 10. Orthologous to human MTO1 (mitochondrial tRNA translation
    optimization 1).
