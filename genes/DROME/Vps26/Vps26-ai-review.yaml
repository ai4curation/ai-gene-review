core_functions:
- description: As a subunit of the retromer cargo-selective complex, Vps26 contributes to recognition
    of transmembrane cargo such as Wntless and Notch on endosomes and to their retrieval to the trans-Golgi
    network or recycling to the plasma membrane, sparing them from lysosomal degradation.
  contributes_to_molecular_function:
    id: GO:0140312
    label: cargo adaptor activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  - id: GO:0032456
    label: endocytic recycling
  locations:
  - id: GO:0005768
    label: endosome
  in_complex:
    id: GO:0030906
    label: retromer, cargo-selective complex
  supported_by:
  - reference_id: PMID:18193032
    supporting_text: In the absence of the retromer components Dvps35 or Dvps26, but in presence of Wg,
      Wls is degraded and Wg secretion impaired.
  - reference_id: PMID:30176986
    supporting_text: Notch is a bona fide cargo protein of retromer
suggested_questions:
- question: Do fly Vps26 and Vps35 bind Wntless and Notch through the conserved Vps26-Snx3 cargo-binding
    groove used for PhiX[LM] motifs in mammals?
suggested_experiments:
- description: Structure-guided Vps26 point mutants that disrupt the Snx3/cargo-binding interface, tested
    for rescue of Wntless retrieval and Notch trafficking in vivo.
