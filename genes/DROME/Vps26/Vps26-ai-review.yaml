gene_symbol: Vps26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Vps26 (CG14804) is the Drosophila ortholog of VPS26, an arrestin-fold subunit of the retromer
  cargo-selective complex (Vps35-Vps26-Vps29). Together with Vps35, Vps26 recognizes sorting motifs in
  the cytoplasmic tails of transmembrane cargo on endosomes and, with Snx3 or SNX-BAR sorting nexins,
  retrieves that cargo to the trans-Golgi network or recycles it to the plasma membrane, sparing it from
  lysosomal degradation. In flies, Vps26 is essential for development and is required for retromer-dependent
  retrieval of the Wnt cargo receptor Wntless, and hence for Wingless secretion, but not for Hedgehog
  or Dpp signalling. Retromer also retrieves Notch in neural progenitors, preventing ectopic Notch activation
  and tumorigenesis, maintains lysosomal degradative capacity in the fat body, and supports neuronal homeostasis
  together with the phospholipase iPLA2-VIA, which binds Vps26 and Vps35. In wing-disc epithelia Vps26
  marks vesicles at an apical trafficking hub and is needed to maintain apical Crumbs and septate-junction
  delivery of the claudin-like protein Megatrachea.
