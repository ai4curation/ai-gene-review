descriptions:
- source: UniProt
  text: Component of the retromer complex which acts in conjunction with wingless
    (wg) and clathrin-mediated endocytosis to sustain a wntless (wls) traffic loop.
    This loop encompasses the Golgi, the cell surface, an endocytic compartment and
    a retrograde route leading back to the Golgi, thereby enabling wls to direct wg
    secretion. The hh and dpp signaling pathways do not require the retromer complex
    suggesting that it does not play a general role in exocytosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W552
  source_id: Q9W552
