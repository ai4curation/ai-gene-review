- source: Alliance_Automated
  text: Enables cargo receptor activity. Involved in endosome to plasma membrane protein
    transport and regulation of Wnt signaling pathway. Part of retromer complex. Is
    expressed in adult head; adult heart; and light-sensitive neurons. Used to study
    brain cancer. Human ortholog(s) of this gene implicated in diabetic retinopathy
    and type 2 diabetes mellitus. Orthologous to several human genes including VPS26B
    (VPS26 retromer complex component B).
