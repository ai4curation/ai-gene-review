      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: BTB protein mediating germline transcriptional repression
      and Torso degradation to allow germ cell formation.'
- source: Alliance_Automated
  text: Enables ubiquitin-like ligase-substrate adaptor activity. Involved in several
    processes, including negative regulation of torso signaling pathway; negative
    regulation of transcription by RNA polymerase III; and pole cell fate determination.
    Located in cell cortex and nuclear periphery. Part of Cul3-RING ubiquitin ligase
    complex and nuclear pore. Is expressed in several structures, including embryonic
    dorsal epidermis; embryonic/larval midgut primordium; ganglia; germline cell;
    and gut section. Orthologous to human GMCL1 (germ cell-less 1, spermatogenesis
    associated) and GMCL2 (germ cell-less 2, spermatogenesis associated).
  source_type: automated
