- source: Alliance_Imported
  text: germ cell-less (gcl) encodes a conserved BTB (broad-complex, tramtrack, and
    bric-a-brac) protein that mediates transcriptional repression in the germline
    and the degradation of the receptor tyrosine kinase encoded by tor, which in turn
    allows germ cell formation.
  source_type: curated
  url: https://flybase.org/reports/gcl.html
  source_id: FB:FBgn0005695
  review:
