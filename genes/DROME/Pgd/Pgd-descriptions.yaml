  text: Phosphogluconate dehydrogenase (Pgd) encodes a cytosolic enzyme that catalyzes
    the oxidation of 6-phospho-D-gluconate to D-ribulose 5-phosphate, with the concomitant
    reduction of NADP+ to NADPH in the oxidative branch of the pentose phosphate pathway.
