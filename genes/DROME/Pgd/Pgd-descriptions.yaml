- source: Alliance_Automated
  text: Enables phosphogluconate dehydrogenase (decarboxylating) activity. Involved
    in glucose homeostasis and pentose-phosphate shunt, oxidative branch. Predicted
    to be active in cytosol. Is expressed in adult head; adult heart; gonad; gut section;
    and imaginal disc. Orthologous to human PGD (phosphogluconate dehydrogenase).
