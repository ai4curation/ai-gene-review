taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Pgd encodes the 6-phosphogluconate dehydrogenase of Drosophila melanogaster, a homodimeric cytosolic
  enzyme that catalyses the third and last step of the oxidative pentose phosphate pathway: the NADP+-dependent
  oxidative decarboxylation of 6-phospho-D-gluconate to D-ribulose 5-phosphate and CO2, producing the
  second NADPH of the pathway. Classic studies of Pgd and Zw (G6pd) mutants established the role of the
  pentose phosphate pathway in fly metabolism. In a genome-scale RNAi screen Pgd knockdown altered circulating
  sugar levels.
