- term:
    id: GO:0006740
    label: NADPH regeneration
  evidence_type: IC
  original_reference_id: PMID:817945
  qualifier: involved_in
  review:
    summary: >-
      Pgd reduces NADP+ to NADPH as it decarboxylates 6-phosphogluconate, producing the second NADPH of
      the oxidative pentose phosphate pathway.
    action: NEW
    reason: >-
      Inferred from the 6-phosphogluconate dehydrogenase (decarboxylating) activity that is experimentally
      established for fly Pgd (IDA, IMP) and from its role in the oxidative pentose-phosphate shunt shown
      with Pgd mutants (PMID:817945, title-only in the cache). The enzyme itself performs the NADPH-generating
      step, so this is direct participation, not a substrate or necessity relationship. Same reasoning
      as for the NEW NADPH regeneration row on Men; comparator: human PGD carries GO:0006740 (IEA), and
      G6pd and Idh carry it in this module through the MODIFY of NADP+ metabolic process. Evidence code
      IC because no cached fly paper measures NADPH output of Pgd directly.
    supported_by:
    - reference_id: file:DROME/Pgd/Pgd-uniprot.txt
      supporting_text: >-
        Catalyzes the oxidative decarboxylation of 6-phosphogluconate to ribulose 5-phosphate and CO(2),
        with concomitant reduction of NADP to NADPH.
