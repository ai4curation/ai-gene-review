suggested_questions:
- question: Is GatC required for GatA/GatB protein stability in flies, as reported for the human complex?
suggested_experiments:
- hypothesis: GatC loss destabilizes GatA and GatB and blocks mitochondrial Gln-tRNA(Gln) formation.
  description: Immunoblot GatA and GatB and assay mt-tRNA(Gln) charging in GatC mutant or RNAi flies.
