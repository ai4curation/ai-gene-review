id: Q86BL4
gene_symbol: GatC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: GatC (CG33649) encodes the small C subunit of the mitochondrial glutamyl-tRNA(Gln) amidotransferase
  (GatCAB), which converts glutamate mischarged onto mitochondrial tRNA(Gln) into glutamine, providing
  Gln-tRNA(Gln) for mitochondrial translation. GatC has no catalytic activity of its own; it wraps around
  the interface of the catalytic GatA and GatB subunits and is needed for assembly and stability of the
  heterotrimer. Function is inferred from orthologs; GatC has not been studied directly in flies.
