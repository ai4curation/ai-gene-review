- term:
    id: GO:0008046
    label: axon guidance receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic (IBA) inference of axon guidance receptor activity from the IgSF adhesion/guidance
      family. There is no direct experimental demonstration that Klingon transduces a guidance signal, and
      as a GPI-anchored protein it lacks a cytoplasmic domain and would require a co-receptor to signal.
      The experimentally demonstrated molecular function of Klingon is homophilic cell-cell adhesion.
    action: MODIFY
    reason: >-
      Klingon's demonstrated molecular activity is homophilic cell-cell adhesion, not receptor-mediated
      guidance signalling. As a GPI-anchored protein it has no cytoplasmic domain and cannot itself
      transduce a guidance signal, so the family-level 'axon guidance receptor activity' inherited from
      the IgSF adhesion/guidance family overstates what klg does; cell-cell adhesion mediator activity
      captures the evidence more precisely. This mirrors the sibling trn review, where the same kind of
      over-broad IBA molecular function on a cell-surface adhesion protein is modified to GO:0098632.
      Knock-on: the GO:0007411 axon guidance annotation below is a GO_REF:0000108 inter-ontology link
      whose WITH/FROM is this GO:0008046 IBA, so it inherits this term's weakness.
    proposed_replacement_terms:
    - id: GO:0098632
      label: cell-cell adhesion mediator activity
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
    supported_by:
    - reference_id: PMID:9043060
      supporting_text: >-
        it is associated with the cell membrane by a glycosyl-phosphatidylinositol linkage and can
        mediate homophilic adhesion
