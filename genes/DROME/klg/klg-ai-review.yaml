proposed_new_terms: []
suggested_questions:
- question: >-
    Does Klingon function as a signalling receptor for axon guidance, or purely as an adhesive ligand that
    requires a transmembrane co-receptor given its GPI anchor?
- question: >-
    What is the identity and functional relevance of Klingon's heterophilic ectodomain partners (e.g. cDIP)
    in R7 development and in mushroom-body long-term memory?
suggested_experiments:
- description: >-
    Tissue-/time-restricted klg knockdown and rescue with cell-adhesion-dead vs GPI-anchor-deleted variants
    to separate homophilic adhesion from any receptor/co-receptor signalling in R7 development and LTM.
- description: >-
    Quantitative bead-binding / SPR of the Klingon ectodomain against candidate IgSF partners (cDIP, Dpr/DIP
    family) to map its heterophilic interaction network and test its contribution to neuron-glia adhesion at
    mushroom-body neuropil boundaries.
