gene_symbol: klg
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Klingon (klg) is a Drosophila melanogaster cell-surface glycoprotein of the immunoglobulin
  superfamily (IgSF). It has three C2-type immunoglobulin-like domains followed by a fibronectin
  type III repeat and is attached to the outer leaflet of the plasma membrane through a
  glycosylphosphatidylinositol (GPI) anchor, i.e. it is an extrinsic, lipid-anchored membrane
  protein rather than a transmembrane one. In cultured cells Klingon mediates homophilic
  cell-cell adhesion, which is its core molecular activity. It is expressed in restricted
  subsets of neurons during embryonic neurogenesis and in the developing eye, where it is
  required in the R7 photoreceptor precursor for correct R7 cell-fate commitment and
  differentiation, functioning in the context of the sevenless/Ras signalling pathway and
  binding other IgSF ectodomains (e.g. cDIP). In the adult brain Klingon protein accumulates
  at neuropil-glia interfaces, including around the lobes and calyces of the mushroom bodies,
  and is acutely required for protein-synthesis-dependent long-term memory (but not
  anesthesia-resistant memory); its levels are up-regulated by Notch signalling upon memory
  induction, placing it downstream of Notch as an effector that links Notch activity to memory
  consolidation. klingon mutants (also recovered as the ruslan/rus allele) additionally show
  altered behavioural responses to ethanol. Neuronal expression and IgSF family relationships
  have further led to its inclusion among candidate axon-guidance/adhesion molecules.
