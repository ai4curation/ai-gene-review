- source: Alliance_Automated
  text: Predicted to enable axon guidance receptor activity. Involved in several processes,
    including behavioral response to ethanol; homophilic cell-cell adhesion; and long-term
    memory. Predicted to be extrinsic component of plasma membrane. Predicted to be
    active in axon; neuronal cell body; and plasma membrane. Is expressed in several
    structures, including adult brain; adult head; eye disc; inner photoreceptor cell;
    and presumptive embryonic/larval system.
