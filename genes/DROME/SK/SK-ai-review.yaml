suggested_questions:
- question: Should the FlyBase IDA annotation to GO:0009881 photoreceptor activity
    from PMID:21957252 be withdrawn, given that dSK is a K+ channel acting in photoreceptor
    cells rather than a light-absorbing molecule?
- question: Which dSK isoforms (N-terminal variants and RNA-edited forms) are expressed
    in photoreceptors, lamina interneurons, projection neurons and muscle, and do
    they differ in Ca2+ sensitivity or trafficking?
- question: What structural basis underlies the apamin insensitivity of dSK relative
    to mammalian SK2?
suggested_experiments:
- description: Heterologous expression of individual dSK isoforms with calmodulin
    in HEK293 cells or Xenopus oocytes, with inside-out patch recordings to determine
    Ca2+ EC50, single-channel conductance and pharmacology.
- description: Cell-type-specific rescue of dSK in L4 monopolar cells versus photoreceptors
    to test which lamina cells account for the network oscillation phenotype.
