- id: PMID:21957252
  title: The Drosophila SK channel (dSK) contributes to photoreceptor performance
    by mediating sensitivity control at the first visual network.
  findings:
  - statement: dSK null photoreceptors lack a slow Ca2+/calmodulin-dependent K+ current,
      restored by transgenic rescue; the current is 1-EBIO-enhanced but apamin-insensitive.
    supporting_text: However, the dSK current was not altered by apamin treatment,
      suggesting that dSK is apamin insensitive
  - statement: dSK is enriched in lamina photoreceptor axons and non-glutamatergic
      monopolar cells.
    supporting_text: dSK is highly enriched at the lamina synaptic network where it
      localizes to photoreceptor axons and a group of nonglutamatergic monopolar cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3758547). Primary source for channel activity,
      localization and photoreceptor physiology; does not support photoreceptor activity
      (light absorption).
- id: PMID:22509342
  title: Roles of the Drosophila SK channel (dSK) in courtship memory.
  findings:
  - statement: dSK null and dominant-negative flies show enhanced 30-min courtship
      memory after short training but defective 24-h memory after extended training.
    supporting_text: While it negatively regulates 30 min memory acquisition, dSK
      is required for 24 h memory formation.
  - statement: dSK is highly expressed in antennal lobe projection neurons.
    supporting_text: dSK is highly expressed in PNs connecting ALs and MB calyx.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read (PMC3324495). Behavioral phenotypes are downstream
      of neuronal excitability; not used for new process annotations.
- id: PMID:24671529
  title: Synaptic excitation is regulated by the postsynaptic dSK channel at the Drosophila
    larval NMJ.
  findings:
  - statement: Postsynaptic dSK at the larval NMJ is activated by Ca2+ entering through
      the postsynaptic membrane, causing EPSP depression and resting potential hyperpolarization.
    supporting_text: Ca(2+) entering at the postsynaptic membrane was sufficient to
      activate dSK channels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract reviewed; independent physiological evidence for dSK channel
      function in muscle.
- id: PMID:31350259
  title: Ca(2+)-Activated K(+) Channels Reduce Network Excitability, Improving Adaptability
    and Energetics for Transmitting and Perceiving Sensory Information.
  findings:
  - statement: dSK and dSlo mutants show homeostatic changes in R1-R6 photoreceptor-LMC
      circuits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract reviewed; extends the visual network role of dSK.
