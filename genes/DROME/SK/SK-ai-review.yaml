      supporting_text: the current was Ca 2+ /calmodulin-dependent as it was absent
        either when extracellular Ca 2+ was removed or in cam flies lacking calmodulin
    - reference_id: PMID:21957252
      supporting_text: upon indirect activation by Ca 2+ through a constitutively
        bound calmodulin
