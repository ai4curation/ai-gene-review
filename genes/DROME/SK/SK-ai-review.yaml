  review:
    summary: Calmodulin binding inherited from the SK channel ancestor; dSK carries
      the conserved C-terminal CaM-binding domain (PF02888).
    action: ACCEPT
    reason: Constitutive calmodulin association is the Ca2+-sensing mechanism of
      all SK channels. dSK has the conserved CaMBD, and its native current is
      absent in calmodulin mutant photoreceptors, consistent with CaM-dependent
      gating. The IBA node placement on the SK clade, which includes dSK, is sound.
    supported_by:
