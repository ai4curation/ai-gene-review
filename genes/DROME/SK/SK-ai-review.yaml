id: Q7KVW5
gene_symbol: SK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  SK (dSK) is the single Drosophila member of the KCNN family of small-conductance
  calcium-activated potassium channels. It is a multi-pass membrane protein with
  four predicted transmembrane helices around a K+-selective pore (GYG motif) and
  a C-terminal calmodulin-binding domain; by analogy with mammalian SK1-3, four
  subunits form a voltage-independent channel gated by Ca2+ acting through
  constitutively bound calmodulin. Several N-terminally divergent isoforms arise
  by alternative splicing, and the transcript is a target of ADAR RNA editing.
  In R1-R6 photoreceptors dSK carries a slow, 1-EBIO-enhanced but apamin-insensitive
  Ca2+/calmodulin-dependent K+ current that is lost in null mutants and restored by
  transgenic rescue. The protein is enriched in the lamina synaptic network, in
  photoreceptor axons and a subset of non-glutamatergic monopolar cells (including
  L4), where it acts as an activity-dependent damper that prevents oscillation and
  supports gain control during light-dark transitions. At the larval neuromuscular
  junction, postsynaptic dSK is activated by Ca2+ entering through the postsynaptic
  membrane during transmission, depressing EPSPs and hyperpolarizing the muscle
  resting potential. dSK also shapes courtship memory, limiting 30-min memory
  acquisition while being required for 24-h long-term memory.
