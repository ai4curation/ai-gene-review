- term:
    id: GO:0009881
    label: photoreceptor activity
  evidence_type: IDA
  original_reference_id: PMID:21957252
  qualifier: enables
  review:
    summary: dSK is a K+ channel expressed in photoreceptors, not a light-absorbing
      photoreceptor molecule.
    action: REMOVE
    reason: GO:0009881 photoreceptor activity describes molecules that absorb and
      respond to electromagnetic radiation (opsins, cryptochromes, phytochromes).
      The full text of PMID:21957252 (read in full here) shows dSK encodes a Ca2+-activated
      K+ current in photoreceptor cells and tunes photoreceptor and lamina gain;
      light-induced somatic currents were normal in mutants. Nothing in the paper
      indicates that dSK absorbs light. The annotation conflates "functions in photoreceptor
      cells" with the molecular activity of a photoreceptor, so the term is contradicted
      by the evidence it cites. The cell-level role is captured by GO:0016057 regulation
      of membrane potential in photoreceptor cell.
    supported_by:
    - reference_id: PMID:21957252
      supporting_text: This was supported by their normal somatic light-induced currents
        and high dSK expression in the lamina circuits.
