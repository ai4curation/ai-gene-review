findings:
- category: discrepancy
  text: UniProt says the channel is blocked by apamin (By similarity). FlyBase and
    the review say fly dSK is apamin insensitive.
  sources:
  - UniProt
  - Alliance_Imported
- category: discrepancy
  text: The automated text claims photoreceptor activity (light absorption). The review
    removes this annotation.
  sources:
  - Alliance_Automated
