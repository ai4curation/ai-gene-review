      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct calcium-activated voltage-independent K+ channel and afterhyperpolarization
      role. 'Blocked by apamin (By similarity)' is contradicted by fly data showing
      apamin insensitivity.
- source: Alliance_Imported
  text: small conductance calcium-activated potassium channel (SK) encodes a potassium
    channel subunit. Four SK subunits together form a voltage-independent potassium
    channel, which is activated by intracellular calcium levels and is required for
    normal photoreceptor light response. Contrary to its mammalian counterpart, Drosophila
    SK channel is not sensitive to apamin, at least not in photoreceptors.
  source_type: curated
  url: https://flybase.org/reports/SK.html
  source_id: FB:FBgn0029761
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and current: tetrameric Ca2+-activated K+ channel, needed
      for the photoreceptor light response, apamin insensitive.'
- source: Alliance_Automated
  text: Enables photoreceptor activity and small conductance calcium-activated potassium
    channel activity. Involved in potassium ion transport and regulation of membrane
    potential in photoreceptor cell. Located in membrane. Is expressed in several
    structures, including adult brain; adult head; retina; sensory system neurons;
    and synaptic neuropil domain. Human ortholog(s) of this gene implicated in disease
    of mental health; myoclonic dystonia 34; paranoid schizophrenia; and schizophrenia.
    Orthologous to human KCNN1 (potassium calcium-activated channel subfamily N member
    1); KCNN2 (potassium calcium-activated channel subfamily N member 2); and KCNN3
    (potassium calcium-activated channel subfamily N member 3).
  source_type: automated
  url: https://flybase.org/reports/SK.html
  source_id: FB:FBgn0029761
