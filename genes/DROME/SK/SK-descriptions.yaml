descriptions:
- source: UniProt
  text: Forms a voltage-independent potassium channel activated by intracellular calcium.
    Activation is followed by membrane hyperpolarization. Thought to regulate neuronal
    excitability by contributing to the slow component of synaptic afterhyperpolarization.
    The channel is blocked by apamin (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q7KVW5
  source_id: Q7KVW5
  review:
    reviewer: AI
    rubrics:
