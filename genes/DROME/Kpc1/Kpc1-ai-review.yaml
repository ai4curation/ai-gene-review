  label: Drosophila melanogaster
description: Kpc1 (CG6752) is the Drosophila homologue of KPC1/RNF123, a large SPRY- and RING-finger-containing
  E3 ubiquitin ligase. With its partner Kpc2 (the UBAC1/KPC2 homologue) it forms the KIP1 ubiquitination-promoting
  complex (KPC); the two proteins co-immunoprecipitate from testes and stabilize one another, and Kpc1
  is required for monoubiquitination of Kpc2. Kpc1 is enriched in the male germ line and localizes, with
  Kpc2, to the tip of the mature sperm flagellum, where the complex is required for localization of the
  polycystin-2 channel Amo; loss of Kpc1 causes failure of sperm storage in females and male sterility.
  Direct fly substrates of its ligase activity have not been identified.
