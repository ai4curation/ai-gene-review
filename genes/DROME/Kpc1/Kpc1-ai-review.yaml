suggested_questions:
- question: What are the direct ubiquitination substrates of fly KPC at the sperm flagellar tip, and how
    does KPC activity promote Amo localization without binding Amo?
suggested_experiments:
- hypothesis: Kpc1 RING catalytic activity, not only complex scaffolding, is required for Amo localization
    and sperm storage.
  description: Rescue Kpc1 mutants with a RING-dead Kpc1 transgene and test Kpc2 monoubiquitination, Amo
    tip localization and sperm storage; combine with proximity labeling at the flagellar tip to identify
    candidate substrates.
  experiment_type: structure-function rescue
