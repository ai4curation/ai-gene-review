- source: Alliance_Imported
  text: Tyrosine decarboxylase 1 (Tdc1) encodes an enzyme that catalyzes the decarboxylation
    of L-tyrosine to form tyramine. Tdc1 is involved in the production of tyramine
    an octopamine in non-neuronal tissues.
