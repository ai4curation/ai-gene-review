- source: Alliance_Automated
  text: Predicted to enable carboxy-lyase activity. Involved in behavioral response
    to ethanol and tyramine biosynthetic process. Predicted to be active in cytoplasm.
    Is expressed in several structures, including embryonic epipharynx; embryonic
    hypopharynx; foregut primordium; gut section; and sensory cluster.
