core_functions:
- description: Tdc1 is a pyridoxal 5'-phosphate-dependent tyrosine decarboxylase that converts L-tyrosine
    to tyramine in non-neural tissues, notably the principal cells of the Malpighian tubule, where locally
    synthesized tyramine drives diuretic and chloride-conductance responses.
