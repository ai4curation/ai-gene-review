suggested_questions:
- question: Why does ectopic Tdc1 rescue Tdc2 mutant egg-laying more completely than Tdc2 itself - does
    Tdc1 have higher specific activity, stability or different regulation?
suggested_experiments:
- description: Purify recombinant Tdc1 and Tdc2 and compare kinetic parameters (kcat, Km for L-tyrosine
    and L-DOPA) to test whether differential activity explains the disparity in rescue efficiency.
