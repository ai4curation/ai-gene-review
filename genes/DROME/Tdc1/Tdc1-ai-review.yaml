description: 'Tdc1 encodes the non-neural tyrosine decarboxylase of Drosophila melanogaster, a pyridoxal
  5''-phosphate-dependent group II aromatic amino acid decarboxylase that converts L-tyrosine to tyramine.
  It is one of two fly tyrosine decarboxylase paralogs: Tdc2 supplies tyramine (and thereby octopamine)
  in neurons, whereas Tdc1 is expressed in non-neural tissues. Its best characterized physiological role
  is in the principal cells of the Malpighian tubule, where Tdc1-dependent synthesis of tyramine from
  tyrosine mediates the diuretic and transepithelial chloride-conductance responses of the tubule to applied
  tyrosine. Ectopic expression of Tdc1 in Tdc2 neurons rescues Tdc2 mutant phenotypes, showing that the
  enzyme is catalytically active in vivo.'
