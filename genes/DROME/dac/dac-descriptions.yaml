- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in imaginal disc development; negative regulation of
    gene expression; and nervous system development. Located in nucleus. Is expressed
    in several structures, including eye photoreceptor cell; head epidermis primordium;
    imaginal disc; optic lobe narrow field columnar neurons; and organism subdivision.
    Orthologous to several human genes including DACH1 (dachshund family transcription
    factor 1).
