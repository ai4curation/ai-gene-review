- source: RefSeq
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in several processes, including antennal joint development;
    genital disc sexually dimorphic development; and nervous system development. Located
    in nucleus. Is expressed in several structures, including head epidermis primordium;
    imaginal disc; organism subdivision; procephalic neuroblast; and visual system
    neurons. Orthologous to several human genes including DACH1 (dachshund family
    transcription factor 1). [provided by Alliance of Genome Resources, Jun 2026]
