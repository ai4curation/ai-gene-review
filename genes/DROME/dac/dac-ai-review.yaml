- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000286552
  - UniProtKB:Q9UI36
  review:
    summary: IBA transfer of RNA polymerase II cis-regulatory region sequence-specific DNA binding from the Dachshund
      family node PTN000286552, grounded in human DACH1 experimental data.
    action: KEEP_AS_NON_CORE
    reason: The PAINT node is grounded in human DACH1, whose DD1/Dachbox-N domain adopts a winged-helix-like DNA-binding
      fold and binds DNA (PMID:12057194, PMID:12215533). DD1 is the most conserved and only essential domain of
      fly Dac (PMID:15242803), so inheritance of a DNA-binding capacity is plausible and the node placement is not
      contradicted. However, no fly experiment has shown sequence-specific DNA binding by Dac; fly genetics and
      biochemistry describe Dac as a cofactor acting with Eya and CtBP. Kept as non-core pending fly-specific evidence.
    supported_by:
    - reference_id: PMID:15242803
      supporting_text: We show that only DD1 is essential for Dac function
    - reference_id: PMID:12057194
      supporting_text: The protein forms an alpha/beta structure containing a DNA binding motif similar to that
        found in the winged helix/forkhead subgroup of the helix-turn-helix family.
- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1277991
  - PANTHER:PTN000286552
  - UniProtKB:Q9UI36
  review:
    summary: IBA transfer of RNA polymerase II DNA-binding transcription factor activity from the Dachshund family
      node, grounded in human DACH1 and mouse Dach1.
    action: KEEP_AS_NON_CORE
    reason: 'As for the DNA-binding IBA, the inference rests on vertebrate DACH1 data (direct binding to DACH1-responsive
      elements, PMID:20956529 cited on the DACH1 review). The fly protein is conserved in the DD1 domain and the
      node placement is defensible, but in Drosophila Dac''s demonstrated molecular role is that of a cofactor:
      it complexes with Eya and binds CtBP, and is classified with the Ski/Sno corepressors. The core molecular
      function for dac is therefore taken as transcription coregulator activity; DNA-binding TF activity is retained
      as non-core.'
    supported_by:
    - reference_id: PMID:15242803
      supporting_text: Dachshund (Dac) is a highly conserved nuclear protein that is distantly related to the Ski/Sno
        family of corepressor proteins
    - reference_id: PMID:9428513
      supporting_text: the Dachshund and Eyes Absent proteins can physically interact through conserved domains
- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: TAS
  original_reference_id: PMID:38528987
  qualifier: enables
  review:
    summary: TAS for DNA-binding transcription factor activity based on a microPublication showing direct GST pull-down
      binding between Dac and CtBP.
    action: MODIFY
    reason: The paper refers to Dac as a 'transcription factor' but presents no DNA-binding data; its experimental
      content is a direct physical interaction between Dac and the transcriptional corepressor CtBP, consistent
      with Dac acting as a transcriptional coregulator. The author statement does not support DNA-binding transcription
      factor activity; the evidence instead supports transcription coregulator activity.
    proposed_replacement_terms:
    - id: GO:0003712
      label: transcription coregulator activity
    supported_by:
    - reference_id: PMID:38528987
      supporting_text: Our present study shows that Dac and CtBP bind each other directly, as determined by GST
        pull-down assays.
    - reference_id: PMID:38528987
      supporting_text: suggest the direct binding of these two transcription regulators in the cells of the eye
        disc promotes the Drosophila eye specification
