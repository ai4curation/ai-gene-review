description: 'dachshund (dac) encodes a nuclear protein of the Ski/Sno/Dac family, distinguished by two conserved
  domains: the N-terminal DD1/Dachbox-N (Ski/Sno/Dac homology domain, a winged-helix-like fold in the vertebrate
  ortholog) and the C-terminal DD2/Dachbox-C coiled-coil. Dac is a core member of the retinal determination network
  with Eyeless, Sine oculis and Eyes absent: it is required for eye formation, it and eya positively regulate each
  other''s expression, Dac and Eya physically interact and act synergistically, and targeted dac expression is sufficient
  to induce ectopic retina. No sequence-specific DNA binding has been demonstrated for the fly protein; it behaves
  as a transcriptional cofactor that partners with Eya and binds the corepressor CtBP directly. Outside the eye,
  dac specifies medial (intermediate) leg segments in proximodistal patterning, is required for antennal joint formation,
  mushroom body neuron differentiation and axon guidance, lamina neuron differentiation in the optic lobe, and sex-specific
  development of the genital disc.'
