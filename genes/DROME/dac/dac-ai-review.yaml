suggested_questions:
- question: Should the retinal determination factors (dac, ey, toy, so, eya) carry 'specification of animal organ
    identity' (GO:0010092)? Ectopic dac or ey converts non-eye imaginal tissue to retina, but a QuickGO comparator
    check (2026-10) found the term used only for appendage/segment identity selectors (Ubx, Dll, ss, hth, Tbr1) and
    on no Pax6, Six, Eya or Dach ortholog in any species, so it is left as a question rather than asserted.
- question: Does fly Dac bind DNA directly through its DD1 (Dachbox-N) domain, as reported for vertebrate DACH1,
    or does it reach chromatin only via partners such as So/Eya, so that the IBA-propagated DNA-binding TF activity
    should be revisited?
- question: Is the PRDLS motif in Dac required for CtBP binding and for Dac function in eye specification, i.e.
    is Dac predominantly a corepressor in vivo?
suggested_experiments:
- description: CUT&RUN for endogenously tagged Dac in eye-antennal discs, with and without so/eya, combined with
    in vitro EMSA of the fly DD1 domain, to determine whether Dac binds DNA autonomously and identify its direct
    targets.
- description: CRISPR knock-in of a PRDLS-mutant dac allele to test whether CtBP binding is required for retinal
    determination and leg patterning.
