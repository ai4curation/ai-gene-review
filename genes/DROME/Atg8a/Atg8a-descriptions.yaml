findings:
- category: gap
  text: No source says that Atg8a binds LIR-motif proteins (Atg1, Ref(2)P, Kenny, GMAP, ER-phagy
    receptors) through its LIR docking site, the mechanism of selective autophagy that the Atg8a-LDS
    flies show is needed for degradation of those proteins and for normal lifespan.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The FlyBase text presents lipidation as how Atg8a works and omits that non-lipidated
    Atg8a is essential for larval midgut removal and viability (PMID:33249988).
  sources:
  - Alliance_Imported
- category: discrepancy
  text: The automated text names protein kinase binding as Atg8a's only activity and lists only
    peripheral processes and locations; it omits autophagosome formation and macroautophagy,
    which the review accepts as core.
  sources:
  - Alliance_Automated
  - RefSeq
- category: insight
  text: FlyBase describes the PE link correctly as a covalent conjugation. The PAINT IBA row
    records the same fact as phosphatidylethanolamine binding, a non-covalent activity by GO's
    definition, which the review marks over-annotated.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: The curated text agrees with the review on every claim it makes; the automated
    text picks only peripheral annotations. Neither mentions LIR docking.
