descriptions:
- source: Alliance_Imported
  text: Autophagy-related 8a (Atg8a) encodes a ubiquitin-like protein that is conjugated to
    phosphatidylethanolamine, and this lipid modification anchors it into the membrane of forming
    and completed autophagosomes. Atg8a product has roles in autophagosome formation, maintaining
    neuromuscular function and normal lifespan.
  source_type: curated
  url: https://flybase.org/reports/Atg8a.html
  source_id: FB:FBgn0052672
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Every claim traces to fly papers: PE conjugation, anchoring in forming and
      completed autophagosome membranes, autophagosome formation, neuromuscular function and
      lifespan. It describes the PE link correctly as a conjugation. It omits the LIR-docking
      role through which Atg8a recruits Atg1 and cargo receptors for selective autophagy, and
      the essential lipidation-independent roles in midgut removal and viability.'
- source: Alliance_Automated
  text: Enables protein kinase binding activity. Involved in several processes, including determination
    of adult lifespan; larval midgut cell programmed cell death; and reticulophagy. Located
    in amphisome; autolysosome; and type I terminal bouton. Is expressed in adult head and ovary.
    Used to study syndromic intellectual disability. Orthologous to human GABARAP (GABA type
    A receptor-associated protein).
  source_type: automated
  url: https://flybase.org/reports/Atg8a.html
  source_id: FB:FBgn0052672
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Each statement is true, but the selection is peripheral: protein kinase
      binding is the only activity named, and the processes and locations listed (lifespan,
      midgut cell death, reticulophagy, amphisome, autolysosome, terminal bouton) are all non-core
      in the review. Autophagosome formation, macroautophagy and the autophagosome membrane
      are missing. Names GABARAP as the human ortholog, which the tree supports.'
