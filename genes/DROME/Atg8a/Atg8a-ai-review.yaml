- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000103522
  - UniProtKB:Q9GZQ8
  review:
    summary: IBA from the Atg8-family root PTN000103522, seeded only by human MAP1LC3B.
    action: KEEP_AS_NON_CORE
    reason: A single human seed is no weakness for a root node of a protein family whose members all dock selective-autophagy
      receptors. In the fly, endogenous Atg8a is recruited around mitochondria that are being cleared in the developing
      midgut and accumulates around undegraded mitochondria in vps13d and pink1 mutant cells, and the fly mitophagy
      receptor BNIP3 uses its LIR motif together with an Atg18a-binding motif. The inheritance holds. Mitophagy
      is one of several selective cargo routes that use Atg8a, so it is kept as non-core, as is reticulophagy below.
    supported_by:
    - reference_id: PMID:34459871
      supporting_text: By contrast, we observed that recruitment of Atg8a to mitochondria is independent of Pink1
        function
    - reference_id: PMID:34459871
      supporting_text: Atg8a puncta in these mutant cells were enlarged and seemed to localize around ATP5a-labeled
        mitochondria that failed to be degraded
    - reference_id: PMID:40801807
      supporting_text: From these results, we conclude that both MER and LIR motifs contribute to BNIP3-mediated
        mitophagy, with some redundancy in their contributions to selectivity.
