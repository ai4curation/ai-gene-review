    summary: IBA from the Atg8-family root PTN000103522, seeded only by Dictyostelium atg8a.
    action: MODIFY
    reason: Nitrogen starvation is the trigger used in Dictyostelium, yeast and plants. In Drosophila, starvation-induced
      autophagy is studied by moving larvae to a sucrose-only diet, which removes dietary amino acids, and Atg8a
      puncta and lipidation are the readouts of that response. Atg8a takes part in the response through autophagosome
      formation, so the inheritance of a starvation-response role holds; the fly-appropriate stimulus is amino-acid
      starvation (GO:0034198), a sibling of nitrogen starvation under cellular response to starvation. Lateral correction,
      non-core.
