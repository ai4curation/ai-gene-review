gene_symbol: Atg8a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Atg8a (CG32672) is the main Drosophila Atg8-family ubiquitin-like protein and belongs to the GABARAP
  subfamily (88% identical to human GABARAP); its paralog Atg8b is expressed in the male germline. After Atg4 removes
  the residues that follow Gly116, the Atg7/Atg3/Atg12-Atg5-Atg16 conjugation system attaches Atg8a covalently to
  phosphatidylethanolamine, and the lipidated form (Atg8a-II) decorates phagophore and autophagosome membranes and
  is carried into autolysosomes. Lipidated Atg8a is required for autophagosome formation and starvation-induced
  autophagy. Through its LIR docking site (K48/Y49) it binds LIR-motif proteins, including the Atg1 kinase, the
  cargo receptor Ref(2)P, Kenny, the ER-phagy receptors Atlastin and Trp1 and the Golgi protein GMAP, and so links
  cargo to the autophagic membrane for selective autophagy of protein aggregates, ER, Golgi and mitochondria. In
  glia, Atg8a conjugated to phagosomes promotes their fusion with lysosomes during clearance of axon debris. Atg8a
  also has lipidation-independent roles: the non-lipidated protein is needed for developmental removal of the larval
  midgut and for viability, and nuclear Atg8a interacts with Sequoia, YL-1 and Sir2, which control expression of
  autophagy genes. Loss of Atg8a shortens lifespan, reduces climbing ability and causes accumulation of ubiquitinated
  proteins and neuronal degeneration.'
