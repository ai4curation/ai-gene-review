suggested_questions:
- question: How should GO record that an Atg8-family protein is covalently conjugated to phosphatidylethanolamine?
    Phosphatidylethanolamine binding (non-covalent by the definition of binding) and protein tag activity (attachment
    to a protein) are both used for Atg8 proteins, and neither definition fits a ubiquitin-like protein whose target
    is a lipid. Protein-membrane adaptor activity (GO:0043495) is also defined as a binding activity, so it does not
    escape the objection either. This review follows the corpus convention (both rows accepted, as for yeast ATG8,
    human GABARAP and MAP1LC3B, and worm lgg-1 and lgg-2); a change would need a family-wide sweep.
- question: Does fly Atg8a bind the intracellular loops of the insect GABA receptor subunits RDL, LCCH3 or GRD,
    as GABARAP binds the vertebrate gamma2 subunit? If not, the PAINT GABA receptor binding IBD at the Eumetazoa
    GABARAP node (PTN000861087) should move to the vertebrate GABARAP clade.
- question: Is Atg8a required for mitochondrial clearance in the developing midgut and remodelling muscle, and which
    fly receptors besides BNIP3 use it?
- question: What does non-lipidated Atg8a do in developmental removal of the larval midgut, and is that role nuclear?
suggested_experiments:
- experiment_type: Protein interaction assay
  description: Test binding of purified fly Atg8a (wild type and LDS K48A/Y49A) to the intracellular M3-M4 loops
    of RDL, LCCH3 and GRD, with the human GABA-A gamma2 loop and human GABARAP as positive controls, by pull-down
    or isothermal titration calorimetry.
  hypothesis: Fly Atg8a keeps the ability to bind the vertebrate gamma2 loop but has no comparable partner among
    insect GABA receptor subunits.
- experiment_type: Mitophagy reporter genetics
  description: Score mito-QC or mt-Keima reporters in Atg8a null, Atg8a-G116* and Atg8a-LDS clones in the larval
    midgut at pupariation and in remodelling abdominal muscle.
  hypothesis: Developmental mitochondrial clearance needs lipidated Atg8a and its LIR docking site.
- experiment_type: Separation-of-function rescue
  description: Rescue Atg8a null animals with lipidation-defective (G116A), LDS-mutant and nuclear-excluded Atg8a,
    and score viability, midgut removal and starvation-induced autophagy.
  hypothesis: Viability and midgut removal need non-lipidated Atg8a with an intact LIR docking site, independent
    of autophagosome formation.
