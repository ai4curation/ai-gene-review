  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Two sentences, every claim traced to fly papers: PE conjugation (PMID:23873149, PMID:37248218);
      anchoring in the membrane of forming and completed autophagosomes (PMID:25481477); a role in autophagosome
      formation (PMID:37633267); maintenance of neuromuscular function (PMID:38701988: climbing, muscle integrity,
      neuronal degeneration); normal lifespan (PMID:18059160, PMID:35649355). The text omits the LIR-docking role
      through which Atg8a recruits cargo receptors and Atg proteins, and the essential lipidation-independent roles
      (recorded below as a missing statement).'
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0052672
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: FB:FBgn0052672
      confidence: CONFIRMED
      explanation: The description presents PE conjugation as the way Atg8a works. Jipa et al. (2021) showed with
        lipidation-defective alleles that lipidated Atg8a is required for autophagy but that the non-lipidated protein
        is essential for developmental removal of the larval midgut and for viability, and midgut removal needs
        Atg8a but not the lipidation machinery. A sentence on these lipidation-independent roles would complete
        the description.
      supported_by:
      - reference_id: PMID:33249988
        supporting_text: lipidated Atg8a is required for autophagy, while its non-lipidated form is essential for
          developmentally programmed larval midgut elimination and viability
      - reference_id: PMID:25882046
        supporting_text: Although Atg8a has an essential role in midgut removal, the components required for lipidation
          are not essential.
