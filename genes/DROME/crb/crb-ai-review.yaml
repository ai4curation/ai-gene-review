    label: protein-macromolecule adaptor activity
  evidence_type: IC
  original_reference_id: PMID:20498073
  qualifier: enables
  review:
    summary: Crb's short cytoplasmic tail links multiple cytoplasmic partners (Sdt, aPKC, Moesin, Expanded,
      MyoV) to the apical plasma membrane.
    action: NEW
    reason: Crb has no enzymatic activity; its molecular function is to bring cytoplasmic proteins into
      a membrane-anchored assembly. Its FBM directly binds Expanded and is required for apical Ex localization,
      its PBM binds Sdt, it binds aPKC, and it recruits MyoV to the plasma membrane in S2R+ cells. Protein-macromolecule
      adaptor activity is the most specific MF that covers this; protein kinase C binding captures only
      one partner.
