id: P10040
gene_symbol: crb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Crumbs (Crb) is a large single-pass type I transmembrane protein of Drosophila epithelia
  and photoreceptors, with about 30 EGF-like repeats and laminin G-like domains extracellularly and a
  short 37-residue cytoplasmic tail carrying a juxtamembrane FERM-binding motif and a C-terminal PDZ-binding
  motif. Crb is restricted to the apical plasma membrane, concentrating in the subapical region just apical
  to the zonula adherens and, in photoreceptors, on the stalk membrane. Its tail recruits Stardust (which
  binds Patj and Lin-7) to form the subapical complex, binds and is phosphorylated by aPKC, links to Moesin
  and beta-Heavy spectrin, and binds the FERM protein Expanded; extracellular Crb-Crb interactions help
  stabilize it at the membrane. Through these interactions Crb specifies and expands the apical membrane
  domain, is required for assembly and maintenance of the zonula adherens and apical-basal polarity during
  tissue remodelling, promotes Hippo signalling to restrain growth, limits Notch activation, controls
  photoreceptor stalk and rhabdomere morphogenesis, and protects photoreceptors from light-induced degeneration
  by stabilizing myosin V for rhodopsin transport. It is the orthologue of human CRB1-3; CRB1 mutations
  cause retinal dystrophies.
