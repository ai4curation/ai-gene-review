core_functions:
- description: 'Apical transmembrane adaptor: the Crb cytoplasmic tail recruits Stardust (and through
    it Patj/Lin-7), aPKC, Moesin/beta-Heavy spectrin and Expanded to the apical plasma membrane, organizing
    the subapical complex that specifies the apical domain and positions the zonula adherens.'
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0045197
    label: establishment or maintenance of epithelial cell apical/basal polarity
  - id: GO:0045186
    label: zonula adherens assembly
  - id: GO:0045176
    label: apical protein localization
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  in_complex:
    id: GO:0035003
    label: subapical complex
  supported_by:
  - reference_id: PMID:11740560
    supporting_text: Stardust proteins colocalize with Crumbs and bind to the carboxy-terminal amino acids
      of its cytoplasmic tail
  - reference_id: PMID:15302858
    supporting_text: via direct binding of DaPKC to both Crb and Patj, and identify Crumbs as a phosphorylation
      target of DaPKC
  - reference_id: PMID:12500938
    supporting_text: Crumbs interacts with the cortical cytoskeleton made of DMoesin and beta heavy-Spectrin
  - reference_id: PMID:11740559
    supporting_text: Stardust and Crumbs are mutually dependent in their stability, localization and function
      in controlling the apicobasal polarity of epithelial cells
  - reference_id: PMID:11850624
    supporting_text: We show that Crb controls localization of the adherens junction through its intracellular
      domain
- description: 'Upstream regulator of Hippo signalling: the juxtamembrane FERM-binding motif binds Expanded
    and recruits it to the apical membrane, promoting Hippo pathway activity and restricting Yorkie-driven
