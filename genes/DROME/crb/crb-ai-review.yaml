  review:
    summary: Notch binding is propagated from Notch ligands (Delta, Serrate, Jagged, Dll) in the EGF-repeat
      PAINT family; no evidence that Drosophila Crb binds Notch.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBA donors are canonical Notch ligands. Crb shares EGF repeats with them but is not a
      Notch ligand; Drosophila Crb limits Notch signalling indirectly (gamma-secretase activity, Notch/Delta
      endocytosis) rather than by a demonstrated Notch-binding activity. The binding claim exceeds the
      evidence for this gene.
    supported_by:
