suggested_questions:
- question: Does the Crb extracellular domain bind Notch or Delta directly in Drosophila, or is Crb's
    restriction of Notch activity entirely via endocytosis and gamma-secretase modulation?
- question: Should FlyBase/UniProt use a dedicated photoreceptor stalk membrane CC term instead of rhabdomere
    or photoreceptor connecting cilium for Crb localization in insect photoreceptors?
- question: Is the reported CGX (Crb-Galla-Xpd) role in mitotic chromosome segregation reproducible, and
    which Crb pool (membrane or spindle-associated) mediates it?
suggested_experiments:
- description: Purified Crb ectodomain binding assays (SPR or pull-down) against Notch and Delta ectodomains
    to test direct binding.
- description: Crb FBM and PBM point mutants in photoreceptor clones to separate MyoV stabilization from
    Sdt complex assembly.
