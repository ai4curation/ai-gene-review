descriptions:
- source: UniProt
  text: Plays a central role in cell polarity establishment, and contributes to the
    organization of zonula adherens, epithelial morphogenesis, and tissue growth (PubMed:10102271,
    PubMed:11740560, PubMed:12900452, PubMed:2344615). Participates in the assembly,
    positioning and maintenance of adherens junctions via its interaction with the
    SAC complex (PubMed:10102271, PubMed:11076972, PubMed:11740560, PubMed:12900452).
    Controls the coalescence of the spots of zonula adherens (ZA) into an adhesive
    ring around the cells (PubMed:11740560). It may act as a signal (PubMed:2344615).
    Involved in morphogenesis of the photoreceptor rhabdomere, for positioning and
    growth of rhabdomere and AJ during the crucial period of photoreceptor extension
    along the proximodistal axis of the retina (PubMed:12900452). In cooperation with
    aPKC, required for the formation and maintenance of the rhabdomeric and stalk
    apical cortical membrane domains (PubMed:32579558). Recruits aPKC to the apical
    stalk membrane where it phosphorylates and displaces rhabdomere specifying proteins
    such as PIP82, to restrict their localization and thus activity to the rhabdomeric
    apical domain (PubMed:32579558). Component of the crb- galla-Xpd (CGX) complex
    which is essential for proper mitotic chromosome segregation in early embryos
    (PubMed:25065591). The CGX complex is also required for cell proliferation in
    developing wing disks (PubMed:25065591). In the CGX complex, acts with galla-1
    or galla-2 to recruit Xpd and thus form the functional complex. Together with
    apn, plays a key role in trachea development at larval stages (PubMed:30645584).
