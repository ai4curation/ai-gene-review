- source: Alliance_Automated
  text: Enables protein kinase C binding activity. Involved in several processes,
    including adherens junction organization; morphogenesis of an epithelium; and
    respiratory system development. Located in several cellular components, including
    apicolateral plasma membrane; photoreceptor connecting cilium; and rhabdomere.
    Is expressed in several structures, including epithelial cell; epithelium; eye
    photoreceptor cell stalk; gut section; and rhabdomere. Used to study Leber congenital
    amaurosis; Leber congenital amaurosis 8; retinal disease; retinitis pigmentosa;
    and retinitis pigmentosa 12. Human ortholog(s) of this gene implicated in focal
    segmental glomerulosclerosis 9; pigmented paravenous chorioretinal atrophy; retinal
    disease (multiple); and ventriculomegaly - cystic kidney disease. Orthologous
    to several human genes including CRB1 (crumbs cell polarity complex component
    1).
