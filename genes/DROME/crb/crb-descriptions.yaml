- source: Alliance_Imported
  text: crumbs (crb) encodes a transmembrane protein that binds to multiple proteins
    such as those encoded by sdt, par-6, AP-2&agr;, yrt, ex and Moe. It contributes
    to organization of zonula adherens, epithelial morphogenesis, apico-basal cell
    polarity, and is a negative regulator of Notch activity and growth control via
    the Hippo pathway. In photoreceptor cells it is involved in morphogenesis, the
    trafficking of the product of ninaE and prevention of light-dependent photoreceptor
    degeneration.
