  review:
    action: MODIFY
    summary: The PDE4/dunce enzyme is cAMP-selective.
    reason: The precise substrate is cAMP, established by genetic and biochemical characterization of
      dunce and supported by the intact PDE4 catalytic domain in this 983-residue product. The broad cyclic-nucleotide
      term does not assert cGMP specificity but can be refined.
