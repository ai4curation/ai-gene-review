id: Q9W4S9
gene_symbol: Pde4
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pde4/dunce is a cAMP-specific phosphodiesterase that controls the amplitude and duration
  of cAMP signaling. The 983-residue product retains the PDE4 regulatory and catalytic architecture. In
  Drosophila neurons, dunce-dependent cAMP turnover shapes synaptic transmission, excitability, learning
  and memory; behavioral and developmental effects depend on the cells and isoforms in which the enzyme
  is expressed.
