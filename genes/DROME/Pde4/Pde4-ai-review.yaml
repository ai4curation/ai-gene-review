core_functions:
- description: Hydrolyzes cAMP to AMP with its metal-dependent PDE4 catalytic domain, terminating cAMP/PKA
    signals in neurons including mushroom body and antennal-lobe neurons, where this regulates synaptic
    excitation and memory.
  molecular_function:
    id: GO:0004115
    label: 3',5'-cyclic-AMP phosphodiesterase activity
  directly_involved_in:
  - id: GO:0006198
    label: cAMP catabolic process
  - id: GO:0141162
    label: negative regulation of cAMP/PKA signal transduction
  supported_by:
  - *id002
  - *id005
  - *id003
  - *id006
suggested_questions:
- question: Do isoforms N/G (Q9W4S9), which use a distinct N-terminal exon, differ from other dunce isoforms
    in expression pattern or subcellular targeting, for example in mushroom body or antennal-lobe neurons?
- question: The PAINT-derived IBA for cGMP phosphodiesterase activity (GO:0047555) on the dnc entry Q9W4T4
    conflicts with the cAMP specificity of PDE4-class enzymes; should that node assignment be revisited?
suggested_experiments:
- description: Isoform-specific rescue of dnc null mutants with the N/G coding sequence, assaying head
    cAMP levels, anesthesia-resistant memory and female fertility, to test whether this N-terminal variant
    supports the locus functions.
