- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002073
  - InterPro:IPR036971
  review:
    action: MODIFY
    summary: True but uninformative; the PDE dampens cAMP/PKA signaling.
    reason: The InterPro2GO mapping gives generic signal transduction. A cAMP PDE does not transmit a
      signal; it terminates the cAMP second-messenger signal. The informative process is negative regulation
      of cAMP/PKA signal transduction, which PAINT curators assign by IBA to all four human PDE4 paralogs
      and to other cAMP-hydrolysing PDE subfamilies. In dnc mutants cAMP rises, and in embryonic motoneurons
      the dunce background mimics elevated cAMP/PKA activity.
    supported_by:
    - *id005
    - &id007
      reference_id: PMID:14507965
      supporting_text: Synaptic excitation is increased in genetic backgrounds that lack either a cAMP-specific
        phosphodiesterase
    - *id006
    proposed_replacement_terms:
    - id: GO:0141162
      label: negative regulation of cAMP/PKA signal transduction
- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028185
  review:
    action: MODIFY
    summary: dunce modulates synaptic transmission through cAMP; it does not carry out transmission.
    reason: Mutant analyses show that loss of dunce PDE activity raises synaptic excitation and changes
      neuronal excitability and Ca2+ dynamics through cAMP/PKA. The enzyme does none of the steps of transmitter
      release or reception; it regulates the strength of transmission by limiting cAMP. The cited 12040051
      study is mainly about growth-cone Ca2+ regulation; the curator's reading is respected but the term
      is refined, not removed. Modulation of chemical synaptic transmission is the accurate process.
    supported_by: &id008
    - *id007
    - reference_id: PMID:12040051
      supporting_text: These mutations cause deficiencies in several learning paradigms and alter synaptic
        transmission, growth cone motility, and action potential generation.
    proposed_replacement_terms: &id009
    - id: GO:0050804
      label: modulation of chemical synaptic transmission
