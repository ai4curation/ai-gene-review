  qualifier: enables
  supporting_entities:
  - RHEA:25277
  - EC:3.1.4.53
  review:
    action: ACCEPT
    summary: 'Core activity: hydrolysis of cAMP to AMP.'
    reason: The dnc locus encodes the cAMP-specific PDE whose activity is lost in dnc mutants; a dnc cDNA
      expressed in yeast produced cAMP PDE activity with the properties of the fly enzyme. Q9W4S9 (isoforms
      N/G) shares an identical 614-residue C-terminal block with the canonical dnc entry P12252, including
      the whole PDEase domain and all catalytic residues, so the locus-level biochemistry applies to this
      product. The ISS row's donor, yeast PDE2 (PTHR11347:SF198), is in a different PANTHER subfamily
      from dnc (SF219), but both descend from PAINT node PTN001682918, where cAMP PDE activity was placed
      by IBD, so the transfer is phylogenetically consistent.
    supported_by: &id004
    - *id002
    - &id005
      reference_id: PMID:3030881
      supporting_text: Mutations of dunce alter or abolish the activity of this enzyme, produce elevated
        cAMP levels
    - *id003
