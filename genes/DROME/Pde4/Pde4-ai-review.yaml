    label: conditioned taste aversion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089914
  review:
    action: KEEP_AS_NON_CORE
    summary: Larval aversive odor-quinine conditioning fails in dnc1 mutants; a behavioral readout of
      cAMP-dependent plasticity.
    reason: In the cited larval paradigm an odorant is paired with quinine, which fits the GO definition
      (a chemical compound coupled with a noxious stimulus). dnc1 larvae fail to form this memory while
      their naive olfactory and quinine responses are normal, so the defect is in plasticity, not sensation.
      The gene product's own contribution is cAMP hydrolysis in the relevant neurons; the behavior is
      an organismal outcome and is kept as non-core.
    supported_by: &id001
