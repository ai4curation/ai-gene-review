- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028185
  review:
    action: ACCEPT
    summary: dunce-dependent cAMP turnover regulates synaptic transmission.
    reason: Drosophila neuronal recordings show altered synaptic excitation and compensatory membrane
      excitability in dunce backgrounds, supporting a direct neuromodulatory role. The experiments are
      locus-level and do not establish that all alternatively spliced isoforms have identical expression.
    supported_by:
