id: Q9W4S9
gene_symbol: Pde4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pde4 (dunce, dnc) encodes the Drosophila PDE4-class cAMP-specific 3',5'-cyclic phosphodiesterase,
  which hydrolyzes cAMP to AMP and so limits the amplitude and duration of cAMP/PKA signals. The locus
  produces many isoforms with different N-termini from alternative promoters and splicing; this entry
  (Q9W4S9) covers isoforms N and G, a 983-residue product that carries the PDE4 upstream conserved region
  and the complete metal-dependent catalytic domain shared by all dunce isoforms. The enzyme is concentrated
  in mushroom body neuropil, and loss of dunce activity raises cAMP, alters synaptic excitation, neuronal
  excitability and terminal arborization, and disrupts associative and nonassociative learning, short-term
  and anesthesia-resistant memory, circadian period, temperature preference and female post-mating behavior
  and fertility.
