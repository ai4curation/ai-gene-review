  review:
    action: MODIFY
    summary: Correct but general; the dunce enzyme is cAMP-specific.
    reason: InterPro2GO assigns the generic cyclic-nucleotide PDE activity from the PDEase catalytic domain.
      Expression of dnc cDNA in yeast gave cAMP PDE activity matching the fly enzyme, Q9W4S9 carries the
      full catalytic domain with every annotated catalytic and cAMP/metal-binding residue of the canonical
      entry, and the PAINT IBD for GO:0004115 sits on an ancestral node (PTN001682918) that includes dnc.
