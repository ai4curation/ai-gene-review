    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: Correct that it hydrolyses cAMP and is needed for female fertility
      and learning, but the enzyme activity and learning role are marked 'By similarity'
      although both were shown directly in the fly. No mushroom body, memory phases
      or isoform complexity.
- source: Alliance_Imported
  text: Phosphodiesterase 4 (Pde4) encodes a cAMP-specific phosphodiesterase, responsible
    for cAMP degradation. Pde4 product plays a pivotal role in neurological and behavioral
    plasticity including synaptic development and function, learning and courtship.
    The product of Pde4 is also known to affect regulation of several developmental
    processes such as oogenesis.
  source_type: curated
  url: https://flybase.org/reports/Pde4.html
  source_id: FB:FBgn0000479
