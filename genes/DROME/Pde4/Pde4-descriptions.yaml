    - rubric: specificity
      score: 3
    overall_notes: 'Correct and current: cAMP-specific phosphodiesterase with roles
      in synaptic development and function, learning, courtship and oogenesis. Names
      no partners or the PKA pathway.'
- source: Alliance_Automated
  text: Enables 3',5'-cyclic-AMP phosphodiesterase activity. Involved in several processes,
    including axon extension; learning or memory; and thermosensory behavior. Located
    in cytosol and nucleus. Is expressed in several structures, including Kenyon cell;
    gland; mushroom body; synaptic neuropil domain; and synaptic neuropil subdomain.
    Human ortholog(s) of this gene implicated in several diseases, including acrodysostosis;
    alcohol dependence; asthma; chronic obstructive pulmonary disease; and stroke.
    Orthologous to several human genes including PDE4B (phosphodiesterase 4B).
  source_type: automated
  url: https://flybase.org/reports/Pde4.html
  source_id: FB:FBgn0000479
