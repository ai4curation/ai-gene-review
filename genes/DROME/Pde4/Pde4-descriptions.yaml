- source: RefSeq
  text: Predicted to enable 3',5'-cyclic-AMP phosphodiesterase activity and 3',5'-cyclic-GMP
    phosphodiesterase activity. Involved in several processes, including axon extension;
    learning or memory; and thermosensory behavior. Located in cytosol and nucleus.
    Is expressed in several structures, including Kenyon cell; gland; mushroom body;
    synaptic neuropil domain; and synaptic neuropil subdomain. Human ortholog(s) of
    this gene implicated in acrodysostosis; alcohol dependence; asthma; chronic obstructive
    pulmonary disease; and stroke. Orthologous to several human genes including PDE4B
    (phosphodiesterase 4B). [provided by Alliance of Genome Resources, Jun 2026]
