descriptions:
- source: UniProt
  text: Hydrolyzes the second messenger cAMP, which is a key regulator of many important
    physiological processes (By similarity). Vital for female fertility. Required
    for learning/memory (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9W4S9
  source_id: Q9W4S9
