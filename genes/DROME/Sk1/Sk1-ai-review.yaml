- description: Sphingoid base kinase that phosphorylates sphingosine and dihydrosphingosine (sphinganine)
    to S1P and DHS1P, acting in the cytosol and at the plasma membrane; it sets the cellular S1P level
    and the DHS1P/S1P balance together with its paralog Sk2.
