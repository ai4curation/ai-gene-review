suggested_questions:
- question: Is Drosophila Sk1 the functional counterpart of mammalian SPHK1 or SPHK2 (or neither), and
    does any Sk1 pool reach mitochondria as mammalian SPHK2 does?
- question: Does Sk1 regulate Rhodopsin and TRP trafficking through intracellular S1P acting on a defined
    effector, given that Drosophila lacks S1P G protein-coupled receptors?
suggested_experiments:
- description: Localize endogenous Sk1 (knock-in tag) in photoreceptors and S2 cells with organelle markers
    including mitochondria, to test the plasma-membrane/cytosol assignment without overexpression.
- description: Measure purified Sk1 kinetics on sphingosine versus dihydrosphingosine to determine whether
    substrate preference explains the different DHS1P/S1P outcomes of Sk1 and Sk2.
