gene_symbol: Sk1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Sk1 (CG1747) is one of two Drosophila melanogaster sphingosine kinases. It is a 641-residue
  protein with a diacylglycerol kinase-like (DAGKc) catalytic domain and a disordered N-terminal region,
  and it phosphorylates the sphingoid bases sphingosine and dihydrosphingosine to sphingosine 1-phosphate
  (S1P) and dihydrosphingosine 1-phosphate (DHS1P), complementing a yeast sphingosine kinase mutant. Sk1
  is largely cytosolic with a plasma-membrane-associated pool, whereas its paralog Sk2 associates with
  lysosomes. Sk1-null flies are viable and fertile but accumulate sphingosine and dihydrosphingosine,
  have reduced S1P and a raised DHS1P/S1P ratio, and show reduced Rhodopsin and TRP levels in photoreceptors,
  a phenotype attributed to altered endolysosomal trafficking. Sk1 and Sk2 are partly redundant, as double
  mutants are lethal.
