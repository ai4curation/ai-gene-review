- source: Alliance_Imported
  text: Sphingosine kinase 1 (Sk1) encodes an enzyme that catalyzes the phosphorylation
    of sphingosine to sphingosine 1-phosphate, a bioactive lipid mediator. It regulates
    cell proliferation, differentiation, endolysosomal trafficking and muscle cell
    repair.
  source_type: curated
