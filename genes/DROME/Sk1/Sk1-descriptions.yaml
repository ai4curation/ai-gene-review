- source: Alliance_Automated
  text: Enables sphingosine kinase activity. Involved in sphingolipid metabolic process.
    Located in cytosol and plasma membrane. Is expressed in adult head; embryonic/larval
    midgut primordium; gut section; and mesoderm. Used to study cardiomyopathy. Human
    ortholog(s) of this gene implicated in type 2 diabetes mellitus. Orthologous to
    several human genes including SPHK2 (sphingosine kinase 2).
