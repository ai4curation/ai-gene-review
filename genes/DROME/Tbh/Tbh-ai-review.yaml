id: Q86B61
gene_symbol: Tbh
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tbh encodes tyramine beta-hydroxylase (tyramine beta-monooxygenase), the copper-dependent,
  ascorbate-requiring monooxygenase that hydroxylates tyramine to octopamine, the final step of octopamine
  biosynthesis in Drosophila melanogaster. It is the insect counterpart of mammalian dopamine beta-hydroxylase,
  a single-pass membrane protein of the copper type II ascorbate-dependent monooxygenase family that is
  expressed in octopaminergic neurons of the brain and ventral ganglion, including neurons innervating
  the oviduct. Tbh null mutants lack octopamine and accumulate tyramine; they are female sterile because
  ovulation fails, and they show defects in larval locomotion, flight initiation and maintenance, aggression,
  male courtship choice and courtship conditioning, appetitive olfactory learning and memory, and ethanol
  tolerance, reflecting the many neuromodulatory roles of octopamine.
