core_functions:
- description: Tbh is a copper-dependent, ascorbate-requiring tyramine beta-monooxygenase that hydroxylates
    tyramine to octopamine, the final step of octopamine synthesis in octopaminergic neurons; it is a
    DBH-family membrane protein whose vesicle compartment has not been determined in flies.
  molecular_function:
    id: GO:0004836
    label: tyramine-beta hydroxylase activity
  directly_involved_in:
  - id: GO:0006589
    label: octopamine biosynthetic process
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:16376104
    supporting_text: TbetaM efficiently hydroxylates the aliphatic carbon of phenolic amines such as tyramine
      (the physiological substrate) and dopamine
    reference_section_type: ABSTRACT
  - reference_id: PMID:8656284
    supporting_text: T beta h-null flies are octopamine-less but survive to adulthood.
    reference_section_type: ABSTRACT
  - reference_id: file:DROME/Tbh/Tbh-deep-research-falcon.md
    supporting_text: mutant has no detectable octopamine and approximately **10-fold elevated tyramine**
suggested_questions:
- question: Is Drosophila Tbh localized to dense-core or small synaptic vesicle membranes in octopaminergic
    neurons, and is a soluble form released as for mammalian DBH?
suggested_experiments:
- description: Immuno-electron microscopy or vesicle fractionation of fly head extracts to determine the
    vesicle class and membrane association of endogenous Tbh.
