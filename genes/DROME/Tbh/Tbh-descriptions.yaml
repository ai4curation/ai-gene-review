    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and broad: rate-limiting enzyme of octopamine synthesis,
      with egg laying, olfactory learning, aggression, flight, locomotion and ethanol
      attraction.'
- source: Alliance_Automated
  text: Enables tyramine-beta hydroxylase activity. Involved in several processes,
    including behavioral response to ethanol; inter-male aggressive behavior; and
    learning or memory. Predicted to be located in membrane. Predicted to be active
    in extracellular region and secretory granule membrane. Is expressed in several
    structures, including adult brain; adult central complex; octopaminergic neurons;
    synaptic neuropil domain; and ventral nerve cord. Used to study alcohol use disorder.
    Human ortholog(s) of this gene implicated in several diseases, including alcohol
    use disorder; attention deficit hyperactivity disorder; dopamine beta-hydroxylase
    deficiency; hypertension; and migraine with aura. Orthologous to human DBH (dopamine
    beta-hydroxylase).
