descriptions:
- source: UniProt
  text: Catalyzes the hydroxylation of tyramine into octopamine, a neurotransmitter
    involved in ovulation and locomotion (PubMed:14623230, PubMed:14978721, PubMed:16376104,
    PubMed:8656284). Functions in an amine-mediated Bacc-dependent signaling pathway
    that negatively regulates acute ethanol sensitivity (PubMed:23142736). Involved
    in facilitation of nociceptive escape behavior in response to potentially damaging
    stimuli, such as high temperatures (PubMed:37309249).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86B61
