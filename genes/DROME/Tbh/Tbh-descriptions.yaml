- source: Alliance_Imported
  text: Tyramine &bgr; hydroxylase (Tbh) encodes a monooxygenase that catalyzes the
    conversion of tyramine to octopamine and is the key limiting enzyme in octopamine
    synthesis. It regulates egg laying, positive associative olfactory learning and
    memory, aggression, flight initiation and maintenance, locomotor activity and
    attraction to ethanol containing food sources.
  source_type: curated
  url: https://flybase.org/reports/Tbh.html
  source_id: FB:FBgn0010329
