    label: axon extension
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091396
  review:
    summary: IEA annotation to axon extension; dnc larvae show enhanced motor nerve terminal arborization.
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation is that elevated cAMP in dnc mutants increases nerve-terminal branching at
      the larval NMJ (PMID:14960616). That is an indirect, sign-reversed effect of losing a cAMP-degrading
      enzyme on terminal arborization, not participation of dnc in axon extension. The abstract attributes
      the temperature-dependent plasticity to rutabaga-dependent mechanisms.
