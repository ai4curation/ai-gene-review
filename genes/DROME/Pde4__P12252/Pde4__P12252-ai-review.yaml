- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002073
  - InterPro:IPR036971
  review:
    summary: InterPro2GO mapping from the PDEase domain to signal transduction.
    action: MODIFY
    reason: 'Too general and wrongly framed: dnc does not transduce a signal but terminates cAMP second-messenger
      signals by hydrolysing cAMP. The informative process is negative regulation of cAMP/PKA signal transduction
      (GO:0141162), which is also the PAINT IBD at the ancestral node PTN001682918 that contains dnc.
      In Drosophila, dnc loss phenocopies elevated cAMP or PKA activity in neurons (PMID:14507965).'
    proposed_replacement_terms:
    - &id019
      id: GO:0141162
      label: negative regulation of cAMP/PKA signal transduction
    supported_by:
