core_functions:
- description: Hydrolyses cAMP to 5'-AMP through its metal-dependent PDE4 catalytic domain, terminating
    and spatially restricting cAMP/PKA signals; in mushroom-body Kenyon cells and antennal-lobe neurons
    this controls the cAMP signals that support olfactory learning and memory.
  molecular_function: *id013
  directly_involved_in:
  - id: GO:0006198
    label: cAMP catabolic process
  - *id019
  supported_by:
  - *id002
  - *id003
  - *id020
  - *id016
suggested_questions:
- question: Do the dnc isoforms with distinct N-termini (II, I, N/G, R and others) differ in subcellular
    targeting or partner binding within Kenyon cells, as PDE4 isoforms do in mammals?
- question: The PAINT node PTN001682918 that carries the GO:0004115 IBD (with dnc as a seed) also carries
    a cGMP phosphodiesterase (GO:0047555) IBD; since the dnc-dependent enzyme is cAMP-specific, should
    the cGMP term be pruned below the PDE4 clade?
suggested_experiments:
- description: Purify recombinant dnc isoform II catalytic domain and determine Km/kcat for cAMP versus
    cGMP and the metal-ion requirement, to replace the 1980s crude-extract kinetics with defined-protein
    data.
- description: Use endogenously tagged dnc isoforms with compartment-targeted cAMP sensors in mushroom-body
    lobes to test which isoforms confine learning-induced cAMP to specific axonal compartments.
