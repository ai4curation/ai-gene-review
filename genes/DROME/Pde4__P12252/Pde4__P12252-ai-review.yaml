  review:
    summary: InterPro2GO mapping from the PDEase catalytic domain to the generic 3',5'-cyclic-nucleotide
      PDE term.
    action: MODIFY
    reason: 'True but less specific than the evidence: the dnc enzyme is cAMP-specific (amorphic alleles
      lack the cAMP-specific PDE, PMID:6265472; cDNA expression gives cAMP PDE activity, PMID:1660926).
      Replace with the child term GO:0004115, which this gene already carries by EXP. Do not refine towards
      cGMP hydrolysis: the dnc-dependent activity is the cAMP-specific form.'
    proposed_replacement_terms:
    - &id013
      id: GO:0004115
      label: 3',5'-cyclic-AMP phosphodiesterase activity
    supported_by:
    - &id003
      reference_id: PMID:6265472
      supporting_text: The mutant strains dunceM14, dunceM11, and dunceML appear to be amorphic, because
        they completely lack the cAMP-specific phosphodiesterase normally present in adult flies. These
        strains exhibit extremely high levels of cAMP.
    - &id002
      reference_id: PMID:1660926
      supporting_text: Expression of a cDNA clone in yeast containing a large portion of the open reading
        frame produced cAMP PDEase activity identical in properties to the Drosophila enzyme affected
        by the dnc mutation.
