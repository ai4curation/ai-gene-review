  review:
    summary: IEA annotation to conditioned taste aversion; dnc1 larvae fail aversive odour-quinine conditioning.
    action: KEEP_AS_NON_CORE
    reason: Loss-of-function dnc mutants are defective in this behaviour, and the defect is attributed
