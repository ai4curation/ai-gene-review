id: P12252
gene_symbol: dnc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: dnc (dunce) encodes the Drosophila PDE4-class 3',5'-cyclic-AMP phosphodiesterase, a cytoplasmic,
  metal-dependent enzyme that hydrolyses cAMP to 5'-AMP and so limits the amplitude, duration and spatial
  spread of cAMP/PKA signalling. The locus is large and complex, producing many isoforms with distinct
  N-termini through alternative promoters, splicing and initiation; this entry (P12252, isoform II) carries
  the PDE4 upstream conserved region and the C-terminal PDEase catalytic domain shared by all dnc isoforms.
  cAMP-specific PDE activity was shown directly by expression of dnc cDNA, and amorphic dnc mutants lack
  this activity and accumulate cAMP. The protein is concentrated in mushroom-body neuropil, and loss of
  dnc impairs olfactory learning, short-term and anesthesia-resistant memory, courtship conditioning and
  female fertility, and alters synaptic excitation and nerve-terminal growth.
