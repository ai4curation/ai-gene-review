  review:
    summary: Golgi membrane localization transferred from rat Uxs1 (Q5PQX0).
    action: MODIFY
    reason: Correct by homology, but the IEA row places Uxs more precisely in the Golgi cisterna membrane
      (GO:0032580), a child of Golgi membrane already annotated to Uxs. Fly Uxs has the N-terminal signal-anchor
      of a type II membrane protein, consistent with mammalian UXS1. No fly localization data exist.
    proposed_replacement_terms:
