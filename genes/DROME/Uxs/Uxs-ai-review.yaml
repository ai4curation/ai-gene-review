suggested_questions:
- question: Does fly Uxs reside in the ER, the Golgi or both, and does luminal UDP-xylose synthesis make
    the UDP-xylose transport activity of Efr and Frc partly redundant?
suggested_experiments:
- description: Assay recombinant Uxs for UDP-glucuronate decarboxylase activity and localize tagged Uxs
    relative to ER and cis/medial Golgi markers in imaginal discs.
