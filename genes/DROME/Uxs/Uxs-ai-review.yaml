  - UniProtKB:Q8NBZ7
  - WB:WBGene00005019
  review:
    summary: Phylogenetic inference of cytoplasmic activity from the UXS family node, grounded largely
      by cytosolic plant isoforms.
    action: REMOVE
    reason: The cytosolic UXS isoforms (Arabidopsis UXS3/5/6) lack the N-terminal signal-anchor; the animal
      UXS1 clade, including fly Uxs, is a type II membrane protein whose catalytic domain faces the ER/Golgi
      lumen. Cytoplasm is therefore the wrong compartment for the fly enzyme.
    supported_by:
    - reference_id: file:DROME/Uxs/Uxs-uniprot.txt
      supporting_text: Single-pass type II membrane protein
    - reference_id: file:DROME/Uxs/Uxs-deep-research-falcon.md
      supporting_text: with catalytic activity facing an organelle lumen rather than acting outside the
        cell.
