id: Q9VSE8
gene_symbol: Uxs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Uxs encodes the Drosophila UDP-glucuronic acid decarboxylase (UDP-xylose synthase), the ortholog
  of human UXS1. It is an NAD(+)-dependent short-chain dehydrogenase/reductase family enzyme that converts
  UDP-alpha-D-glucuronate to UDP-alpha-D-xylose. By homology to UXS1 it is a single-pass type II membrane
  protein of the early secretory pathway with its catalytic domain in the lumen, where UDP-xylose is used
  to initiate glycosaminoglycan linkage regions on proteoglycan core proteins and to elongate O-glucose
  glycans on Notch EGF repeats.
