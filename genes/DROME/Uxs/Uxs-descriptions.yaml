descriptions:
- source: Alliance_Imported
  text: UDP-xylose synthase (Uxs) encodes a Golgi enzyme that catalyzes the NAD-dependent
    decarboxylation of UDP-&agr;-D-glucuronate to UDP-&agr;-D-xylose. UDP-&agr;-D-xylose
    is required for the biosynthesis of the tetrasaccharide linker of heparan sulfate
    and chondroitin sulfate proteoglycans and for the addition of xylose to O-glucose
    on EGF repeats.
  source_type: curated
  url: https://flybase.org/reports/Uxs.html
  source_id: FB:FBgn0035848
