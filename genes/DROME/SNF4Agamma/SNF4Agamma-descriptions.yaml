    overall_notes: 'Correct but does not say it is the AMPK gamma subunit that senses
      AMP: lipid metabolism, autophagy and starvation.'
- source: Alliance_Automated
  text: Predicted to enable AMP binding activity; protein kinase binding activity;
    and protein kinase regulator activity. Involved in several processes, including
    behavioral response to starvation; cholesterol homeostasis; and triglyceride storage.
    Located in cytosol and nucleus. Is expressed in several structures, including
    adult head; adult ventral nerve cord; anterior endoderm; embryonic/larval midgut
    primordium; and larval midline neurons. Used to study neurodegenerative disease.
    Human ortholog(s) of this gene implicated in Wolff-Parkinson-White syndrome; glycogen
    storage disease; hypertrophic cardiomyopathy 6; and lethal congenital glycogen
    storage disease of heart. Orthologous to several human genes including PRKAG2
    (protein kinase AMP-activated non-catalytic subunit gamma 2).
