id: Q9VDD2
gene_symbol: SNF4Agamma
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SNF4Agamma is the single gamma (regulatory) subunit of Drosophila AMP-activated protein kinase
  (AMPK). Its tandem cystathionine-beta-synthase (CBS/Bateman) domains bind adenine nucleotides, allowing
  the heterotrimer (with the catalytic subunit AMPKalpha and the beta subunit Alicorn) to sense the cellular
  AMP/ATP ratio and activate the kinase under energy stress. SNF4Agamma is required for AMPK activity,
  for developmental (ecdysone-triggered) and stress-induced autophagy in the larval fat body, where it
  moves into nuclei at the onset of autophagy, and for normal lipid storage and starvation responses.
  A neuron-enriched isoform affected by the loechrig mutation links AMPK to HMG-CoA reductase regulation
  and neuronal maintenance.
