- source: Alliance_Imported
  text: Bloom syndrome helicase (Blm) encodes a protein that plays important roles
    in repairing replication fork damage and double-strand breaks. It promotes repair
    through non-crossover mechanisms, though it also has roles in meiotic recombination.
