descriptions:
- source: UniProt
  text: Participates in DNA replication and repair (By similarity). Exhibits a magnesium-dependent
    ATP-dependent DNA-helicase activity that unwinds single- and double-stranded DNA
    in a 3'-5' direction (By similarity). Involved in DNA double strand break repair,
    including the synthesis-dependent strand annealing (SDSA) pathway (PubMed:25205745).
    Involved in DNA interstrand cross-link repair (PubMed:25205745).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VGI8
  source_id: Q9VGI8
