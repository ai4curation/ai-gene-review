- source: Alliance_Automated
  text: Enables 3'-5' DNA helicase activity; DNA/DNA annealing activity; and Y-form
    DNA binding activity. Involved in DNA metabolic process and negative regulation
    of double-strand break repair via single-strand annealing. Located in nucleus.
    Used to study Bloom syndrome. Human ortholog(s) of this gene implicated in Bloom
    syndrome. Orthologous to human BLM (BLM RecQ like helicase).
