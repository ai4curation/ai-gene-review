suggested_questions:
- question: GO has no process term for double Holliday junction dissolution (the BLM-TOP3A non-crossover
    pathway); should one be created so that Blm and Top3alpha can be annotated to it rather than to the
    generic HR term?
- question: Is the nucleus IDA row from PMID:31772289 based on Drosophila Blm, or on the transfected human
    BLM imaged in S2 cells?
- question: Does Drosophila Blm act directly in replication fork processing (e.g. fork reversal/restart)
    during the rapid syncytial cycles, or are embryonic anaphase bridges a consequence of unresolved recombination
    intermediates?
suggested_experiments:
- experiment_type: In vitro reconstitution
  hypothesis: Drosophila Blm disassembles Rad51-mediated D-loops after limited primer extension, and this
    is stimulated by RPA.
  description: Reconstitute Spn-A (Rad51)-mediated D-loops with a polymerase extension step and measure
    Blm-dependent release of the extended strand with wild-type versus ATPase-dead Blm.
- experiment_type: Live imaging
  hypothesis: Endogenously tagged Blm is recruited to replication and repair foci in syncytial embryo
    nuclei.
  description: Image a CRISPR-tagged Blm in early embryos with and without DNA damage to establish its
    native subnuclear/chromatin localization.
