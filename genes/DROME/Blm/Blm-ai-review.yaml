    id: GO:0005634
    label: nucleus
  supported_by:
  - &id012
    reference_id: PMID:17272294
    supporting_text: is a DNA-dependent ATPase, has 3'-->5' DNA helicase activity, prefers forked substrate
      DNAs and anneals complementary DNAs
  - reference_id: PMID:15501916
    supporting_text: DmBlm acts downstream of strand invasion to unwind a D-loop intermediate to free
      the newly synthesized strand
