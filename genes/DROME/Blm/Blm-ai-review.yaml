id: Q9VGI8
gene_symbol: Blm
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Blm (mus309, CG6920) is the Drosophila melanogaster ortholog of the human Bloom syndrome
  RecQ helicase BLM and yeast Sgs1. It is a nuclear, ATP-dependent 3'-5' DNA helicase with DEAD/DEAH helicase,
  RecQ zinc-binding (RQC) and HRDC domains and a long N-terminal region. Purified Blm is a DNA-dependent
  ATPase that prefers forked DNA, displaces strands and anneals complementary strands, and together with
  topoisomerase IIIalpha and RPA dissolves double Holliday junctions into non-crossover products by convergent
  branch migration. In vivo Blm promotes homologous recombination repair of double-strand breaks by synthesis-dependent
  strand annealing, acting after Rad51-mediated strand invasion to disassemble D-loops; it suppresses
  mitotic crossing over, homeologous single-strand annealing and error-prone end joining, and becomes
  essential when the Holliday junction resolvases MUS81-MMS4, MUS312-SLX1 or GEN are absent. Blm is also
  required for normal meiotic crossover number and distribution and, maternally, for the rapid syncytial
  embryonic cell cycles; mutants are hypersensitive to DNA-damaging agents, female sterile and show age-related
  genome rearrangements and tumours.
