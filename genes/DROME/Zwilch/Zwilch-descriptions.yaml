descriptions:
- source: UniProt
  text: Essential component of the mitotic checkpoint, which prevents cells from prematurely
    exiting mitosis (PubMed:15886105, PubMed:17576797). Required for the assembly
    of the dynein-dynactin, Mad2 complexes and spindly/CG15415 onto kinetochores (PubMed:15886105,
    PubMed:17576797). Its function related to the spindle assembly machinery is proposed
    to depend on its association in the RZZ complex (PubMed:22685323). Failure to
    assemble the complex due to the absence of any one of its components, results
    in the incorrect redistribution of the remaining components to diverse membrane
    compartments (PubMed:22685323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VA00
