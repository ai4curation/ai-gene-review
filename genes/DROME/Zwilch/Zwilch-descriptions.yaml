- source: Alliance_Imported
  text: Zwilch (Zwilch) encodes a subunit of the RZZ complex located at the kinetochores
    of chromosomes. The RZZ complex plays an essential role in the spindle assembly
    checkpoint that ensures proper connections between chromosomes and the mitotic
    spindle.
