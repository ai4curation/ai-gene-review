id: Q9VA00
gene_symbol: Zwilch
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Zwilch is a conserved subunit of the Rod-Zw10-Zwilch (RZZ) complex, isolated as a component
  of the immunopurified Zw10/Rod complex. It localizes with Rod and Zw10 to unattached kinetochores and,
  after attachment, along kinetochore microtubules, and as part of RZZ is required for kinetochore recruitment
  of dynein-dynactin and Mad2, for spindle assembly checkpoint signalling, and for accurate chromosome
  segregation. Unlike Zw10 and Rod, Zwilch does not associate with ER or Golgi membranes and is not needed
  for Golgi organization or spermatocyte cytokinesis, so its role appears restricted to the kinetochore.
