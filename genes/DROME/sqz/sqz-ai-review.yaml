id: Q9VDZ3
gene_symbol: sqz
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Squeeze (Sqz, CG5557) is a Krueppel-like C2H2 zinc-finger transcription factor of Drosophila melanogaster with
  five C2H2 fingers flanked by long disordered, glutamine-rich regions. It is expressed in restricted subsets of embryonic
  and larval CNS neurons, including the thoracic apterous (Ap) cluster and all leucokinergic neurons. Sqz acts in combinatorial
  transcription factor codes that specify neuronal subtype identity: in the Tv neurons of the Ap cluster it cooperates with
  Ap and a retrograde BMP signal to activate the neuropeptide gene FMRFamide, and with its directly binding co-activator Nab
  it limits the number of Ap-expressing neurons; it is also required for leucokinin expression in brain and suboesophageal
  leucokinergic neurons. Sqz is further required in olfactory projection neurons for dendritic targeting and has been implicated genetically in neuroblast lineage development. Loss of sqz causes larval lethality with a body-wall overcontraction phenotype. Sequence-specific
  DNA binding is inferred from the zinc-finger array and family placement but has not been demonstrated directly. Sqz, Rotund
  and Datilografo form a group of related insect zinc-finger regulators related to vertebrate ZNF384.'
