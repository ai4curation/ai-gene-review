core_functions:
- description: Nuclear C2H2 zinc-finger transcription factor that, together with the co-activator Nab, Apterous and BMP signalling,
    regulates neuron subtype-identity genes such as FMRFamide and leucokinin. The regulatory role is established genetically
    in Drosophila; sequence-specific DNA binding is inferred from the five-finger array and PAINT placement and has not been
    shown directly.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0048666
    label: neuron development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id001
  - *id002
  - reference_id: PMID:17428824
    supporting_text: We also showed by pull-down assays that Nab binds directly to Rotund and Squeeze via its conserved C-terminal
      domain.
  - *id005
  - *id003
suggested_questions:
- question: What DNA sequence do the five Sqz zinc fingers recognise, and are FMRFa and Lk regulatory regions bound directly
    by Sqz?
- question: Should Sqz's role in Tv and leucokinergic neurons be annotated as neuron fate specification (GO:0048665)? FlyBase
    used neuron development for sqz and nab, and the co-acting Ap-cluster regulators do not carry GO:0048665, so this convention
    should be confirmed with FlyBase before changing it.
- question: Does Sqz act only as an activator (with Nab as co-activator), or can it also repress, as Nab does with Rotund?
suggested_experiments:
- description: Determine the Sqz binding motif by protein-binding microarray or SELEX of the finger array, then map Sqz occupancy
    in Ap-cluster or leucokinergic neurons by targeted DamID and test FMRFa/Lk enhancer reporters with mutated motifs.
- description: Test whether the Nab-binding region of Sqz is required for FMRFa activation by rescuing sqz mutants with Sqz
    variants unable to bind Nab.
