  review:
    summary: IBA from PAINT node PTN004619861 (Eukaryota-level C2H2 DNA-binding transcription factor clade) asserting sequence-specific
      binding to RNA polymerase II cis-regulatory DNA.
    action: ACCEPT
    reason: Sqz is a Krueppel-like protein with five canonical C2H2 fingers (aa 158-297) and sits inside the PAINT clade whose
      members bind cis-regulatory DNA; nothing in the sqz record suggests loss of the fingers or of DNA binding. Sqz acts
      genetically as a transcriptional regulator of FMRFa, Lk and ap-cluster genes and recruits the non-DNA-binding co-activator
      Nab, which is consistent with Sqz being the DNA-bound partner. Direct DNA binding by Sqz (motif, footprint, PBM/SELEX
      or ChIP) has not been shown in the literature reviewed, so this activity is inherited by phylogeny rather than established
      experimentally for Sqz.
