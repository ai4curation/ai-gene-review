id: P48591
gene_symbol: RnrL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: RnrL encodes the large (R1, alpha, M1) subunit of Drosophila class Ia ribonucleotide reductase.
  The catalytic subunit binds ribonucleoside diphosphates (ADP, GDP, CDP, UDP) and, using the tyrosyl
  radical generated by the small subunit RnrS, reduces them to the corresponding 2'-deoxyribonucleoside
  diphosphates with thioredoxin as the ultimate reductant. Its N-terminal ATP cone (activity site) and
  specificity site bind ATP and dNTPs to balance the dNTP pools, and in flies the enzyme is also restrained
  by IRBIT. RnrL acts in the cytoplasm to supply DNA precursors for replication and repair. Its loss causes
  replication stress in intestinal stem cells and impairs early embryonic development, and a hypomorphic
  allele selectively impairs compensatory growth of damaged imaginal discs.
