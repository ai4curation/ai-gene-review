suggested_questions:
- question: Does Drosophila IRBIT inhibit fly RNR by stabilizing dATP at the RnrL activity site, as shown
    for the human enzyme?
suggested_experiments:
- hypothesis: The compensatory-growth-specific RnrL allele weakens R1-R2 association, limiting dNTP supply
    only under high proliferative demand.
  description: Measure dNTP pools and R1-R2 co-immunoprecipitation in wild-type and A4B5 mutant imaginal
    discs during normal and compensatory growth.
