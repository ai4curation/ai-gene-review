- source: Alliance_Automated
  text: Predicted to enable ATP binding activity and ribonucleoside-diphosphate reductase
    activity, thioredoxin disulfide as acceptor. Involved in tissue regeneration.
    Predicted to be part of ribonucleoside-diphosphate reductase complex. Is expressed
    in several structures, including Malpighian tubule primordium; embryonic/larval
    midgut primordium; ganglia; glial cell; and gut section. Human ortholog(s) of
    this gene implicated in autosomal recessive progressive external ophthalmoplegia
    with mitochondrial DNA deletions 6. Orthologous to human RRM1 (ribonucleotide
    reductase catalytic subunit M1).
