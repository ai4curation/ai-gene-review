    summary: The native 178-residue Hn-PD isoform lacks substrate/cofactor architecture required for conventional
      hydroxylase chemistry, as established by mapping human PAH structural sites through full-length
      Hn. This refutes intrinsic hydroxylase activity but does not exclude a noncatalytic or regulatory
      contribution to aromatic amino acid metabolism. No evidence establishes such a process contribution
      by PD, so the broad process prediction remains UNC.
