    summary: The exact native PD isoform lacks the PAH substrate-responsive loop, pterin-binding loop
      and cofactor-stacking Phe site, established by human-to-full-length-Hn mapping and their absence
      from PD. Primary structural and mutagenesis studies identify these as reaction-center features;
      only 149 of 307 aligned catalytic-domain residues remain. The three iron ligands and Glu cofactor
      contact are retained, but cannot supply the missing substrate/cofactor architecture. This refutes
      transfer of conventional pteridine-dependent hydroxylase chemistry, despite overlap with an existing
      electronic annotation. The conclusion concerns intrinsic catalysis, not all possible process participation
      or a supposed error in the native transcript sequence.
    supported_by:
    - *id001
    - reference_id: PMID:10694386
      supporting_text: 'Site-specific mutations of Glu286 (E286A and E286Q), Phe254 (F254A and

        F254L), and Tyr325 (Y325F) have confirmed the important contribution of Glu286

        and Phe254 to the normal positioning of the pterin cofactor and catalytic

        activity of hPheOH.'
    - reference_id: PMID:12126628
      supporting_text: 'The largest

        change occurs in the loop region comprising residues 131-155'
