    summary: Henna participates in aromatic amino acid metabolism by catalysing phenylalanine 4-hydroxylation,
      so this process term on the exact Hn-PD sequence depends on the pteridine-dependent hydroxylase
      reaction center. Hn-PD (178 residues, identical to P17276 275-452, initiating at internal Met275)
      lacks the ACT domain and the regions corresponding to the human PAH substrate-responsive loop 131-155,
      pterin-binding loop 245-250 and cofactor-stacking Phe254; only 149 of 307 catalytic-domain positions
      remain, although the iron ligands are retained. Without that architecture PD cannot perform the
      hydroxylation step, and no non-catalytic contribution to the process has been shown for this product.
      The term is true of the gene through full-length Henna (P17276) but not for this product. Novelty
      is not at issue, as the term is an existing electronic annotation on E8NH57.
