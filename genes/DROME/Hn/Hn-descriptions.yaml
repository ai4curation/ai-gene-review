      score: 3
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Gene-level text, correct for full-length Henna (phenylalanine and
      peripheral tryptophan hydroxylation, pteridine synthesis), but this accession
      is the truncated Hn-PD product that lacks the ACT domain and half the catalytic
      domain.
- source: Alliance_Automated
  text: Enables phenylalanine 4-monooxygenase activity and tryptophan 5-monooxygenase
    activity. Involved in several processes, including aromatic amino acid metabolic
    process; dopamine biosynthetic process; and long-term memory. Predicted to be
    located in cytosol. Is expressed in several structures, including aminergic neurons;
    brain; ellipsoid body; embryonic/larval fat body; and head. Used to study phenylketonuria.
    Human ortholog(s) of this gene implicated in intellectual disability and phenylketonuria.
    Orthologous to human PAH (phenylalanine hydroxylase).
  source_type: automated
