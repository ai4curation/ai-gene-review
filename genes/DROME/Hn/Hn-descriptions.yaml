descriptions:
- source: Alliance_Imported
  text: 'Henna (Hn) encodes a tryptophan phenylalanine hydroxylase. It is a dual function
    enzyme: it hydroxylates both phenylalanine to generate tyrosine, as well as tryptophan
    to generate the precursor for peripheral (non-neuronal) serotonin. It is also
    involved in pteridine synthesis.'
  source_type: curated
  url: https://flybase.org/reports/Hn.html
  source_id: FB:FBgn0001208
  review:
    reviewer: AI
    rubrics:
