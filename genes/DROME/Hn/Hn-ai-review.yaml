taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Henna encodes phenylalanine hydroxylase isoforms involved in aromatic amino-acid metabolism.
  The native 178-residue PD product retains the C-terminal iron-ligand region but lacks much of the
  catalytic scaffold, including the substrate-responsive loop and pterin-binding architecture. These losses
  contradict conventional pteridine-dependent hydroxylase activity. Its metal-binding capacity and possible
  noncatalytic physiological role remain unresolved.
existing_annotations:
- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001273
  - InterPro:IPR018301
  - InterPro:IPR036951
  review:
    action: REMOVE
    summary: PD lacks the conserved substrate/cofactor architecture required for the hydroxylase reaction.
    reason: Human PAH structural-site mapping through a full-length Hn positive control shows that the
      substrate-responsive loop 131–155, pterin-binding loop 245–250 and cofactor-stacking Phe254 correspond
      to intact full-length Hn regions but are entirely absent from PD. Mutagenesis establishes the importance
      of the cofactor-stacking site, and the deleted domain segment encompasses substantially more than
      that residue. Retained iron ligands cannot replace the missing substrate/pteridine reaction-center
      architecture. This directly contradicts transfer of the conventional enzyme activity to the short
      product; it does not deny possible metal binding or an unrelated noncatalytic role.
    supported_by:
    - &id001
      reference_id: file:DROME/Hn/Hn-bioinformatics/RESULTS.md
      supporting_text: The human substrate-responsive loop 131–155 (PMID:12126628), pterin-binding loop
        245–250 and cofactor-stacking Phe254 (PMID:10694386) are absent in PD.
    - &id002
      reference_id: PMID:10694386
      supporting_text: 'Site-specific mutations of Glu286 (E286A and E286Q), Phe254 (F254A and

        F254L), and Tyr325 (Y325F) have confirmed the important contribution of Glu286

        and Phe254 to the normal positioning of the pterin cofactor and catalytic

        activity of hPheOH.'
    - &id003
      reference_id: PMID:12126628
      supporting_text: 'The largest

        change occurs in the loop region comprising residues 131-155'
