id: E8NH57
gene_symbol: Hn
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Henna (Hn, CG7399) encodes the Drosophila phenylalanine hydroxylase, a non-heme-iron,
  tetrahydrobiopterin-dependent aromatic amino acid hydroxylase of the PANTHER PTHR11473:SF24
  (phenylalanine-4-hydroxylase) subfamily that converts L-phenylalanine to L-tyrosine. The full-length
  452-residue enzyme (Hn-PA/PC, UniProt P17276) has an N-terminal ACT regulatory domain, a central
  catalytic domain and a C-terminal oligomerization region, and is expressed in the larval fat body,
  adult head and a subset of neurons; loss of Henna gives the henna eye-colour phenotype and makes
  dietary tyrosine conditionally essential. This entry (E8NH57) is the alternative Hn-PD product,
  a 178-residue polypeptide encoded by transcript Hn-RD that initiates at internal Met275 of the
  full-length protein and is identical to its residues 275-452. Hn-PD lacks the ACT domain and roughly
  half of the catalytic domain, including the regions that correspond to the substrate-responsive loop,
  the pterin-binding loop and the pterin-stacking phenylalanine of human PAH, while keeping the three
  iron-ligand residues and the C-terminal oligomerization region. It is therefore not expected to
  carry out the hydroxylation reaction itself; whether the Hn-PD polypeptide accumulates in vivo,
  binds iron, or associates with full-length Henna subunits is unknown.
existing_annotations:
- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001273
  - InterPro:IPR018301
  - InterPro:IPR036951
  review:
    action: REMOVE
    summary: Catalytic activity of full-length Henna transferred by signature to the truncated Hn-PD isoform,
      which lacks the pterin-binding and substrate-loop half of the catalytic domain.
    reason: The term is correct for the Henna gene (full-length P17276, experimentally shown to hydroxylate
      phenylalanine and placed by PAINT under PTN000895564 with Hn among the donors), but this IEA is
      attached to the Hn-PD product E8NH57, which starts at internal Met275 and is identical to P17276
      275-452. Mapping human PAH structural sites through a full-length Hn positive control shows that
      the substrate-responsive loop 131-155, pterin-binding loop 245-250 and cofactor-stacking Phe254
      correspond to intact full-length Hn regions (130-154, 244-249, Phe253) but are entirely absent
      from PD; only 149 of 307 catalytic-domain positions remain. Mutagenesis establishes that the
      pterin-positioning residues are needed for catalysis. The InterPro/ARBA signatures fire on the
      retained C-terminal half and the iron ligands, which cannot by themselves form a reaction centre.
      This is a domain-architecture mismatch, so the catalytic activity should not be asserted for this
      polypeptide. It says nothing against full-length Henna activity.
    supported_by:
    - &id001
      reference_id: file:DROME/Hn/Hn-bioinformatics/RESULTS.md
      supporting_text: The human substrate-responsive loop 131–155 (PMID:12126628), pterin-binding loop
        245–250 and cofactor-stacking Phe254 (PMID:10694386) are absent in PD.
    - &id002
      reference_id: PMID:10694386
      supporting_text: 'Site-specific mutations of Glu286 (E286A and E286Q), Phe254 (F254A and

        F254L), and Tyr325 (Y325F) have confirmed the important contribution of Glu286

        and Phe254 to the normal positioning of the pterin cofactor and catalytic

        activity of hPheOH.'
    - &id003
      reference_id: PMID:12126628
      supporting_text: 'The largest

        change occurs in the loop region comprising residues 131-155'
