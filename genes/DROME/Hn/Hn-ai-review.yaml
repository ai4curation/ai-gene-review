    - *id002
- term:
    id: GO:0006571
    label: L-tyrosine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004505
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: True of the Henna gene through its full-length enzyme, but over-attributed to the truncated
      Hn-PD product, which cannot catalyse the hydroxylation step.
    reason: Phenylalanine hydroxylation by full-length Henna supplies tyrosine and feeds aromatic amino
      acid metabolism, and this is well supported at the gene level (PAINT PTN000895564 IBD for L-tyrosine
      biosynthesis and L-phenylalanine catabolism with FlyBase Hn as donor). The row here, however,
      is on E8NH57 (Hn-PD) and rests only on the electronic catalytic inference (GO_REF:0000108 from
      GO:0004505, or InterPro signatures). Hn-PD lacks the substrate and pterin architecture needed for
      catalysis, so it does none of the work of the process by catalysis. A non-catalytic contribution
      (e.g. association with full-length subunits through the retained C-terminal oligomerization region)
      is conceivable but has never been tested, so participation is not supported for this product.
      The claim is not false for the gene, hence over-annotation rather than removal.
    supported_by:
    - *id004
    - *id005
    - *id001
    - *id002
