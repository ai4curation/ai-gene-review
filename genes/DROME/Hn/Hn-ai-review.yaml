- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001273
  - InterPro:IPR018301
  - InterPro:IPR036951
  review:
    action: UNDECIDED
    summary: All three iron-coordinating residue identities are retained, but metal binding requires their
      correct spatial assembly in a folded pocket.
    reason: All three iron-coordinating residue identities are retained, but metal binding requires their
      correct spatial assembly in a folded pocket. The large catalytic-domain truncation prevents establishing
      that geometry from sequence matches alone. In full-length PAH the iron sits in a pocket built by
      the catalytic domain as a whole, half of which is missing from PD. Iron binding is plausible but
      neither predicted with confidence nor tested for the native Hn-PD polypeptide.
    supported_by:
    - &id004
      reference_id: file:DROME/Hn/Hn-bioinformatics/RESULTS.md
      supporting_text: Iron-ligand positions His284, His289 and Glu329 map to target His10, His15 and
        Glu55.
    - &id005
