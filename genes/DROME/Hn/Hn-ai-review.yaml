core_functions: []
suggested_questions:
- question: Is the Hn-PD polypeptide (E8NH57, initiating at internal Met275) translated and stable in
    vivo, and in which tissues or stages is the Hn-RD transcript expressed relative to Hn-RA/RC?
- question: Can Hn-PD bind iron or co-assemble with full-length Henna subunits through the retained
    C-terminal oligomerization region, and if so does it modulate phenylalanine hydroxylase activity?
suggested_experiments:
- description: Detect endogenous Hn-PD with a C-terminal epitope tag knocked into the Hn locus or by
    targeted proteomics of peptides unique to its N-terminus, comparing tissues where Hn-RD is expressed.
- description: Co-express tagged Hn-PD with full-length Hn in S2 cells, test co-immunoprecipitation and
    measure phenylalanine hydroxylase activity of the mixed population versus full-length Hn alone.
