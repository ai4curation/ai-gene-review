gene_symbol: SWIP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: SWIP (CG13957; WASHC4/KIAA1033 ortholog) is a large structural subunit of the pentameric
  WASH complex, which also contains Wash, FAM21, CCDC53 and Strumpellin. With Strumpellin it forms the
  core that holds the Arp2/3-activating Wash subunit in a regulated state on endosomes, where the complex
  builds branched actin patches that sort cargo into recycling and retrograde routes. The fly WASH complex
  is required for recycling of integrins and V-ATPase and, together with capping protein and Arp2/3, for
  nuclear envelope budding.
