    overall_notes: Correct WASH complex component (By similarity), plus the finding
      that it is not needed for hemocyte migration.
- source: Alliance_Imported
  text: Strumpellin and WASH-interacting protein (SWIP) encodes a protein that is
    part of the multi-subunit WASH regulatory complex (SHRC) to activate Arp2/3-mediated
    actin nucleation in a context-dependent manner. The product of SWIP, along with
    the SHRC, has been found to play a role in actin architecture and ooplasmic streaming
    during oogenesis, in endosome recycling, and in integrin-mediated cell spreading
    of hemocytes.
  source_type: curated
  url: https://flybase.org/reports/SWIP.html
