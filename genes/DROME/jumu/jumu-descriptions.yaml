descriptions:
- source: Alliance_Imported
  text: jumeau (jumu) encodes a multi-functional transcription factor that acts upstream
    of a Polo-kinase dependent pathway in one report. Its roles include asymmetric
    protein localization, chromatin modification, dendrite formation and organ (eye,
    wing and bristle) development.
  source_type: curated
  url: https://flybase.org/reports/jumu.html
  source_id: FB:FBgn0015396
