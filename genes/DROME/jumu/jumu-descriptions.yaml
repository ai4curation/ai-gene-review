    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: 'Correct in outline: multifunctional transcription factor upstream
      of Polo, in asymmetric localization, chromatin and eye, wing and bristle development.
      Does not say it is a forkhead factor; the dendrite formation role is not in
      the review.'
- source: Alliance_Automated
  text: Enables transcription cis-regulatory region binding activity. Involved in
    several processes, including imaginal disc-derived wing morphogenesis; nucleolus
    organization; and positive regulation of receptor signaling pathway via JAK-STAT.
    Located in euchromatin; nucleolus; and polytene chromosome chromocenter. Is expressed
    in several structures, including RP neuron; cardiogenic mesoderm; ganglia; gonad;
    and somatic precursor cell. Human ortholog(s) of this gene implicated in Nezelof
    syndrome; T-cell immunodeficiency, congenital alopecia, and nail dystrophy; alopecia;
    nail disease; and primary immunodeficiency disease. Orthologous to human FOXN1
    (forkhead box N1) and FOXN4 (forkhead box N4).
  source_type: automated
