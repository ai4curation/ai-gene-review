gene_symbol: jumu
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Jumu is a nuclear forkhead transcription factor and chromatin-associated regulator. It recognizes
  Forkhead sites in cis-regulatory DNA and controls context-dependent gene expression, including repression
  of the Nidogen enhancer in the embryonic heart. Its dosage affects chromatin and nucleolar organization,
  while its transcriptional programs regulate asymmetric cell fates, cardiac progenitor divisions and
  wound-responsive JAK/STAT signaling.
