- id: file:DROME/jumu/jumu-bioinformatics/RESULTS-rereview.md
  title: PANTHER 19.0 subfamily placement of jumu and FOXN proteins (re-review analysis)
  findings:
  - statement: Jumu is classified with vertebrate FOXN4 orthologs in PANTHER 19.0 subfamily PTHR13962:SF17,
      not in PTHR46721:SF3 as the UniProt cross-reference states.
    supporting_text: In the official PANTHER 19.0 classification, jumu Q9XTP7 sits in PTHR13962:SF17
- id: file:DROME/jumu/jumu-deep-research-falcon.md
  title: Falcon deep research report on jumu
  findings:
  - statement: Jumu-regulated cardiac division effectors such as neb are genetically validated, but direct
      enhancer binding has not been shown.
    supporting_text: Direct functional binding of Jumu to a *neb* enhancer was not demonstrated in that
      study.
- id: PMID:16547170
  title: Genome-wide analyses identify transcription factors required for proper morphogenesis of Drosophila
    sensory neuron dendrites.
  findings:
  - statement: In an embryonic RNAi screen, jumu knockdown increased the number of peripheral sensory
      neurons and caused dendrite morphogenesis defects.
    supporting_text: RNAi of six other genes, including jumeau , a winged-helix TF known to regulate neuroblast
      cell fate and the number of PNS neurons, similarly caused an increase in neuronal number as well
      as defects in dendrite morphogenesis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Parrish et al. 2006, Genes Dev); full text cached. A genome-wide dsRNA
      injection screen hit. The dendrite defect accompanies an increase in neuron number, consistent with
      the known jumu role in neural cell-fate decisions, so it does not establish a direct role in dendrite
      formation.
- id: file:DROME/jumu/jumu-deep-research-flybase.md
  title: FlyBase gene description for jumu (DROME)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Checked against the review. The forkhead transcription factor identity, action upstream
      of Polo kinase in cardiac progenitor divisions, asymmetric protein localization in neural and cardiac
      lineages, chromatin effects (position-effect variegation, chromocenter localization) and eye, wing
      and bristle development are all covered by the review's cited literature. The dendrite formation
      role traces to a genome-wide RNAi screen (PMID:16547170), where the dendrite defect accompanied extra
      PNS neurons; it was checked and judged peripheral, so no annotation was added.
core_functions:
- description: Sequence-specific forkhead transcription factor that binds Forkhead sites in cis-regulatory
    DNA and represses RNA polymerase II transcription, as shown for the Nidogen enhancer in the embryonic
    heart.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:22378636
    supporting_text: These results suggest that Jumu acts through Fkh-binding sites to repress Ndg expression
      in the heart.
  - reference_id: PMID:22378636
    supporting_text: By contrast, the binding of Jumu was detected in vitro only at the Fkh2 site, with
      only an excess of wild-type but not mutated Fkh2 unlabeled probe being capable of competing.
  - reference_id: PMID:10887088
    supporting_text: Jumu protein shows nuclear localisation
suggested_questions:
- question: Does Jumu directly activate any of its cell-division target genes (for example neb, polo
    or the 13 genes with nearby Jumu ChIP peaks), or are all activating effects indirect? The answer
    decides whether Jumu also has DNA-binding transcription activator activity.
- question: Does the Jumu winged-helix domain contribute structurally to chromocenter and nucleolar
    organization, as its resemblance to linker histone H1/H5 suggests, or are the chromatin and nucleolar
    phenotypes secondary to misregulated transcription?
- question: Which PANTHER placement is correct for Q9XTP7, PTHR13962:SF17 (official PANTHER 19.0 HMM
    classification, with vertebrate FOXN4) or PTHR46721:SF3 (UniProt cross-reference)?
suggested_experiments:
- description: Mutate Jumu-bound Forkhead motifs in enhancers of candidate activated targets (neb, sti,
    SMC2) and test reporter activity in wild-type and jumu mutant mesoderm to determine whether Jumu
    activates them directly.
- description: Test whether a DNA-binding-defective Jumu (forkhead-domain point mutant) still localizes
    to the chromocenter and nucleolus and still modifies position-effect variegation.
