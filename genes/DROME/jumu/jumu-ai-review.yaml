  review:
    action: ACCEPT
    summary: Jumu is a chromatin-associated forkhead transcription factor; chromatin localization is
      independently supported by polytene chromosome immunostaining.
    reason: The cited genome-wide S2-cell RNAi/localization study is abstract-only in the cache, so the
      exact Jumu observation cannot be inspected; the FlyBase curator read the full text. The claim is
      biologically sound and independently supported by immunostaining showing DOM/Jumu at the chromocenter
      and specific euchromatic loci of polytene chromosomes, as expected for a sequence-specific DNA-binding
      factor. Chromatin is the appropriate general location for a DNA-bound transcription factor and is
      accepted.
