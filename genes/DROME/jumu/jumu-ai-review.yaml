- id: PMID:39684645
  title: Genome-Wide Expression Profiling and Phenotypic Analysis of Downstream Targets Identify the Fox
    Transcription Factor Jumeau as a Master Regulator of Cardiac Progenitor Cell Division.
  full_text_unavailable: false
  findings:
