id: Q9XTP7
gene_symbol: jumu
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Jumeau (Jumu, historically Domina/Dom) is a 719-residue nuclear forkhead/winged-helix
  transcription factor of the FOXN group; in the PANTHER 19.0 classification it falls in the FOXN4
  subfamily together with vertebrate FOXN4. It binds Forkhead sites in cis-regulatory DNA and can act
  as a sequence-specific transcriptional repressor, as shown for the Nidogen cardiac enhancer, where it
  cooperates with the forkhead factor CHES-1-like. Jumu is also required for expression of a large set
  of mesodermal genes, many of them cell-division genes, although direct activation of those targets
  has not been shown. The protein accumulates at the polytene chromocenter, at specific euchromatic
  bands and in the nucleolus; jumu dosage modifies position-effect variegation and nucleolar and
  chromatin morphology. Through these transcriptional programs Jumu acts in asymmetric sibling-neuron
  fate decisions in the embryonic CNS, symmetric and asymmetric cardiac progenitor divisions (upstream
  of Polo kinase), larval hematopoiesis and wound-induced JAK/STAT activation, and eye and wing morphogenesis.
