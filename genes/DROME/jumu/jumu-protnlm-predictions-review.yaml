    summary: Correct but not novel. EMSAs show that Jumu binds a Forkhead (FkhS-type) site in the Nidogen
      mesodermal enhancer in a sequence-specific manner, and Jumu cooperates with CHES-1-like to repress
      that enhancer in the heart. GOA already carries the predicted term itself (IEA, InterPro) and the
      more specific descendant GO:0000987 cis-regulatory region sequence-specific DNA binding (IBA, accepted
      in the gene review and also proposed there as the refinement of the IDA cis-regulatory region binding
      row); GO:0000987 is_a GO:0043565 (OLS4 ancestry), so the prediction is less precise than an existing
      supported annotation.
    supported_by:
    - reference_id: PMID:22378636
      supporting_text: Electrophoretic mobility shift assays (EMSAs) confirmed that three Drosophila mesodermal
        Fkh TFs bind to these sites (Fig. 1E-H). Although the binding to some of these sites is relatively
        weak, albeit sequence specific
    - reference_id: PMID:22378636
      supporting_text: 'CHES-1-like cooperates with Jumu to repress this enhancer in the

        heart.'
    - reference_id: PMID:22378636
      supporting_text: 'different combinations of Fkh sites, corresponding to two different sequence

        specificities, mediate the particular functions of each TF.'
