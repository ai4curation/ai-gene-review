  - term:
      id: GO:0005102
      label: signaling receptor binding
    evidence_type: IPI
    original_reference_id: PMID:15054108
    qualifier: enables
    supporting_entities:
      - UniProtKB:Q8MLV1
    review:
      summary: Lam binds the Drosophila lamin B receptor (LBR) by co-IP and in vitro binding.
      action: REMOVE
      reason: The interaction with dLBR is real, but GO:0005102 signaling receptor binding asserts that the partner
        is a signaling receptor. LBR is an integral inner nuclear membrane protein named 'receptor' only historically;
        it transduces no signal. The term is a wrong mapping of the name. No informative replacement MF exists beyond
        bare protein binding, which policy excludes; the LBR anchoring role is captured by the nuclear envelope
        organization and lamina terms.
      supported_by:
        - reference_id: PMID:15054108
          supporting_text: dLBR can be shown by co-immunoprecipitations and in vitro binding assays to bind to the
            Drosophila B-type lamin Dm0
