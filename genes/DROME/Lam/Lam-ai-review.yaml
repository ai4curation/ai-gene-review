core_functions:
  - description: 'Lam is the structural B-type lamin of the nuclear lamina: coiled-coil dimers polymerize head-to-tail
      into filaments that support nuclear envelope assembly and integrity, space nuclear pore complexes, and anchor
      inner nuclear membrane proteins (Otefin, Bocksbeutel, MAN1, Klarsicht).'
    molecular_function: *id001
    directly_involved_in:
      - id: GO:0006998
        label: nuclear envelope organization
      - id: GO:0045107
        label: intermediate filament polymerization
      - id: GO:0051664
        label: nuclear pore localization
      - id: GO:0090435
        label: protein localization to nuclear envelope
    locations:
      - *id006
    supported_by:
      - *id003
      - *id031
      - *id022
      - *id023
      - *id036
      - *id037
  - description: Lam binds chromatin through its tail domain and tethers silent gene clusters and heterochromatin
      to the nuclear periphery, acting as a docking scaffold for repression.
    molecular_function:
      id: GO:0003682
      label: chromatin binding
    directly_involved_in:
      - id: GO:0031507
        label: heterochromatin formation
    locations:
      - *id006
    supported_by:
      - *id018
      - *id027
      - *id026
      - *id033
suggested_questions:
  - question: Does Lam bind histones H2A/H2B directly, or does the competition in PMID:10077600 reflect binding
      to a nucleosome surface that also requires other factors? A direct-binding assay would decide whether histone
      binding should be annotated in addition to chromatin binding.
  - question: PMID:2517292 is the basis of a nuclear envelope lumen annotation; does the immuno-EM in that paper
      place lamin in the perinuclear space, or was the spindle envelope or nuclear lamina intended?
  - question: Which annotations cited to PMID:20702563 (a Lamin C paper) rest on experiments with Lam Dm0 itself?
  - question: GO has no term for the meiotic or mitotic spindle envelope that retains Lam in Drosophila; is a cellular
      component term warranted?
suggested_experiments:
  - hypothesis: The Lam tail binds the H2A/H2B acidic patch of nucleosomes directly.
    description: Binding of purified Lam tail domain to reconstituted nucleosomes and to acidic-patch mutant nucleosomes,
      measured by fluorescence polarization or ITC, with tail deletion mutants from PMID:10077600.
    experiment_type: binding assay
  - hypothesis: Lam anchors Klarsicht at the nucleus through a SUN-domain protein (Klaroid) bridging the inner and
      outer nuclear membranes.
    description: Proximity labelling (TurboID-Lam) in eye discs with and without klaroid, followed by quantification
      of perinuclear Klarsicht in Lam and klaroid single and double mutants.
    experiment_type: proteomics and genetics
