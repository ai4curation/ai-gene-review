id: P08928
gene_symbol: Lam
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Lam (lamin Dm0) is the sole B-type nuclear lamin of Drosophila melanogaster, an intermediate filament
  protein with a short head, a coiled-coil rod, an Ig-fold tail and a C-terminal CaaX (CxxM) box that is farnesylated
  and anchors the protein to the nucleoplasmic face of the inner nuclear membrane. Lam forms coiled-coil homodimers
  that polymerize head-to-tail into filaments of the nuclear lamina; cdc2 and PKA phosphorylation of the head region
  disassembles the polymer at mitosis. It is expressed in all cells throughout development, alongside the later,
  tissue-restricted A-type lamin LamC. The lamina built by Lam supports nuclear envelope assembly and integrity,
  spaces nuclear pore complexes, and anchors inner nuclear membrane proteins such as Otefin, Bocksbeutel, MAN1,
  LBR and the KASH protein Klarsicht. Its tail binds chromatin, and Lam tethers silent gene clusters and heterochromatin
  at the nuclear periphery. Loss of Lam causes NPC clustering, fragile or fragmented nuclear envelopes and late
  pupal lethality, with defects in photoreceptor nuclear migration, tracheal branching, oocyte polarity, testis
  niche organization, male meiotic cytokinesis and fat-body heterochromatin.
