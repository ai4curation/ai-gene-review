- source: Alliance_Automated
  text: Enables chromatin binding activity; protein homodimerization activity; and
    signaling receptor binding activity. A structural constituent of cytoskeleton.
    Involved in several processes, including animal organ morphogenesis; nucleus organization;
    and tube morphogenesis. Located in chromosome; cytoplasm; and nuclear envelope.
    Is expressed in several structures, including adult head; adult heart; somatic
    cell of testis; specialized Malpighian tubule cell; and spermatid cyst. Used to
    study myopathy. Human ortholog(s) of this gene implicated in several diseases,
    including autosomal dominant primary microcephaly (multiple); intrinsic cardiomyopathy
    (multiple); lipodystrophy (multiple); muscular dystrophy (multiple); and type
    2 diabetes mellitus (multiple). Orthologous to human LMNA (lamin A/C); LMNB1 (lamin
    B1); and LMNB2 (lamin B2).
