descriptions:
- source: UniProt
  text: Component of the nuclear lamina, a fibrous layer on the nucleoplasmic side
    of the inner nuclear membrane, which is thought to provide a framework for the
    nuclear envelope and interacts with chromatin (PubMed:10077600, PubMed:15035436,
    PubMed:22393432, PubMed:3126192, PubMed:9394018). Essential for nuclear envelope
    assembly; required for the association of membrane vesicle nuclear envelope precursors
    with decondensing chromatin (PubMed:1527167). Involved in the organization and
    spacing of nuclear pore complexes on the nucleus surface; complements LamC (PubMed:15996653).
    May have a role in the localization of the LEM domain proteins Ote, bocks and
    MAN1 to the nuclear membrane (PubMed:15035436, PubMed:16439308). Required for
    uniform distribution of type-A lamin LamC within the nuclear lamina (PubMed:15996653).
    In spermatocytes, plays a role in maintaining LamC nuclear localization; regulates
    meiotic cytokinesis by maintaining the structure of the spindle envelope, and
    by contributing to the formation of the contractile ring and central spindle (PubMed:27402967).
    Required for nuclear migration and to link the microtubule organizing center (MTOC)
    to the nucleus (PubMed:14617811). In addition, is required for nuclear envelope
    localization of klar (PubMed:14617811). Maternal expression is critical for embryogenesis
    (PubMed:15054108). Involved in dorsal-ventral patterning in oocytes (PubMed:11533666).
    Required for structural organization of cytoplasmic processes during tracheal
    terminal branch outgrowth (PubMed:11533666). Zygotic expression is critical for
    late larval and pupal development (PubMed:15996653). May be involved in the nuclear
    localization or stability of the ecdysone receptor EcR (PubMed:15996653).
