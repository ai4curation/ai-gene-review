suggested_questions:
- question: Does purified MEI-9-ERCC1, alone or with MUS312 and HDM, cleave Holliday junctions or
    other branched DNA, and with what specificity?
- question: Why do Ercc1 mutants lose fewer meiotic crossovers than mei-9 mutants, and does MEI-9 act
    with MUS312 but without ERCC1 at those crossovers?
- question: Does MEI-9 act in somatic single-strand annealing or nonhomologous-tail removal in flies,
    as Rad1-Rad10 does in yeast?
- question: Should GO have a term for the meiosis-specific MEI-9-ERCC1-MUS312-HDM crossover complex,
    separate from the ERCC4-ERCC1 heterodimer?
suggested_experiments:
- description: Purify MEI-9-ERCC1 with and without MUS312 and HDM and test nuclease activity on
    Holliday junction, 3'-flap and bubble substrates, including a catalytic-motif point mutant.
- description: Test mei-9 and Ercc1 mutants in an I-SceI direct-repeat single-strand annealing
    reporter and in a P-element gap repair assay to define any somatic recombination role.
