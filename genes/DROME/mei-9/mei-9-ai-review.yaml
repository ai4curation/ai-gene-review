- term:
    id: GO:0000712
    label: resolution of meiotic recombination intermediates
  evidence_type: IMP
  original_reference_id: PMID:17339219
  qualifier: involved_in
  review:
    summary: mei-9 mutants convert crossover-designated intermediates into noncrossovers, placing
      MEI-9 at the resolution step.
    action: ACCEPT
    reason: >-
      Molecular analysis of heteroduplex DNA in mei-9 products shows that crossovers are lost
      while noncrossovers with unrepaired heteroduplex appear, consistent with MEI-9 cutting
      double Holliday junctions and their dissolution in its absence. This is the core meiotic
      function; that MEI-9 itself does the cutting is a model, as the fly enzyme has not been
      assayed in vitro.
    supported_by:
    - reference_id: PMID:17339219
      supporting_text: in the absence of MEI-9 activity, the double Holliday junction intermediate
        instead undergoes dissolution to generate noncrossover products in which heteroduplex is
        unrepaired.
