      (PMID:25205745). mei-9 is also not synthetically lethal with Blm, unlike mus312
      (PMID:22022278). Nonreciprocal mitotic events such as single-strand annealing, the
      likely basis of the yeast seed, have not been tested in flies, so the row is marked as
      over-annotated rather than removed.
    supported_by:
