- id: file:DROME/mei-9/mei-9-uniprot.txt
  title: UniProtKB Q24087 (XPF_DROME) Swiss-Prot record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Reviewed Swiss-Prot record. XPF family membership, the ERCC4 domain, the HDM interaction
      (PMID:18957705) and the NER role (PMID:826452) agree with the literature, and the Holliday
      junction resolution role is correctly worded as a possibility. The FUNCTION sentence that
      MEI-9 is required for repair of mismatches within meiotic heteroduplex DNA reflects the
      older interpretation of postmeiotic segregation in mei-9 females; Radford et al. 2007
      (PMID:17339219) showed that the unrepaired heteroduplex arises because crossover-designated
      intermediates are dissolved into noncrossovers, so the phenotype reports crossover failure,
      not a mismatch repair defect. The FUNCTION text also omits interstrand crosslink repair
      and the MUS312 and ERCC1 requirements.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q24087
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Also required for the repair of mismatches within meiotic heteroduplex DNA
        and for nucleotide excision repair.
      confidence: PROBABLE
      explanation: >-
        The mismatch-repair clause rests on the postmeiotic segregation seen in mei-9 females.
        Radford et al. 2007 (PMID:17339219) mapped heteroduplex DNA in mei-9 products and found
        patterns unlike those of the mismatch-repair-defective Msh6 mutant, concluding that the
        meiotic function of MEI-9 is in crossover formation rather than mismatch repair. The
        reduced nick-dependent repair in mei-9 mutant extracts (PMID:9488459) is a measured
        effect of unclear mechanism, not evidence for repair of meiotic heteroduplex. Suggest
        replacing the clause with the interstrand crosslink repair role and keeping the
        nucleotide excision repair statement. Confidence is PROBABLE because the in vitro
        extract result has not been re-tested.
      supported_by:
      - reference_id: PMID:17339219
        supporting_text: In the absence of mei-9 activity, postmeiotic segregation associated with
          noncrossovers occurs at the expense of crossover products, suggesting that the underlying
          meiotic function for MEI-9 is in crossover formation rather than mismatch repair.
      - reference_id: PMID:17339219
        supporting_text: analysis of the arrangement of heteroduplex DNA in the postmeiotic segregation
          products reveals different patterns from those observed in Drosophila Msh6 mutants, which
          are mismatch-repair defective.
- id: file:DROME/mei-9/mei-9-deep-research-flybase.md
  title: FlyBase gene description for mei-9 (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Checked both sentences. MEI-9 as the catalytic subunit of the MEI-9-ERCC1
      structure-specific endonuclease in nucleotide excision repair is stated in PMID:15944364
      and rests on the NER defect of mei-9 mutants (PMID:826452) and the ERCC1 two-hybrid
      interaction (PMID:10812334); the catalytic designation is by homology, because the fly
      enzyme has not been assayed in vitro (PMID:19595722, PMID:22022278). The interaction of
      MEI-9 and ERCC1 with MUS312 to generate meiotic crossovers is shown by PMID:12504024
      (MUS312-MEI-9 binding and identical meiotic phenotype) and PMID:15944364 (MEI-9 bridges
      ERCC1 and MUS312). No claim is wrong. The text omits interstrand crosslink repair, the
      Hold'em partner, and the fact that MEI-9 is not needed for mitotic crossovers.
