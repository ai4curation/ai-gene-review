- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000015911
  - UniProtKB:Q92889
  review:
    summary: Damage-specific DNA binding is not an established activity of XPF-family nucleases and
      has not been examined for MEI-9.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD has a single seed, human XPF, whose own evidence is a repair-incision assay rather
      than a binding measurement (left UNDECIDED in the human ERCC4 review). XPF-ERCC1 is a
      structure-specific nuclease that cuts single-strand/double-strand junctions; in nucleotide
      excision repair the lesion is recognised by XPC- and XPA-type factors, which flies also
      have, and the nuclease is recruited to the opened DNA. No fly experiment has measured MEI-9
      binding to damaged DNA. The node placement is not in question; the term overstates what the
      family does.
    supported_by:
    - reference_id: PMID:15944364
      supporting_text: Drosophila MEI-9 is the catalytic subunit of a DNA structure-specific endonuclease
        required for nucleotide excision repair (NER).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000015911
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Single human seed whose evidence is incision of crosslinked DNA, not damage-specific
          binding; MEI-9 placement under the node is correct.
