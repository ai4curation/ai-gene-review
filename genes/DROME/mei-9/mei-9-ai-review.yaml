    action: ACCEPT
    reason: >-
      XPF-ERCC1 cuts duplex DNA at the junction with a 3' single-stranded arm (the 5' incision
      in NER, 3'-flap removal). The IBD at PTN000015911 is seeded by human XPF; MEI-9 is inside
      the XPF-only family, keeps the ERCC4 nuclease domain, and forms the heterodimer with ERCC1
      (PMID:10812334), so the contributes_to qualifier matches the subunit's role. The fly
