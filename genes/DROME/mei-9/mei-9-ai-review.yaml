  review:
    summary: Plausible inherited role in homologous recombination repair of DSBs; in flies it is
      shown only for meiotic DSBs.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD at PTN000015911 rests on plant, fission yeast, human and Dictyostelium
      descendants, and MEI-9 is inside the clade. In flies the documented role is in the
      homologous repair of programmed meiotic DSBs into crossovers, which meets the GO:0000724
      definition (repair from a homologous template with reciprocal or nonreciprocal exchange),
      and a review states that MEI-9 acts in some DSB repair pathways (PMID:10908583). No fly
      assay of somatic gap repair, synthesis-dependent strand annealing or single-strand
      annealing has tested mei-9, and the separation-of-function work suggests the
      recombination role of MEI-9 is meiotic (PMID:22022278). No evidence of loss, so the
      row is kept, but as non-core.
    supported_by:
    - reference_id: PMID:10908583
      supporting_text: The Drosophila homologue of Rad1, MEI-9, is involved in some DSB repair pathways
        (Baker et al. 1976)
    - reference_id: PMID:22022278
      supporting_text: We found that mei-9; mus309 double mutants are viable, consistent with the
        previous finding that MEI-9–ERCC1 interacts with MUS312 in meiotic recombination, but not in
        somatic DNA repair [42].
    propagation_review:
