  review:
    summary: In Drosophila, mitotic crossovers do not require MEI-9; the recombination function of
      MEI-9 appears to be meiotic.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MEI-9 descends from the eukaryote IBD node, so this is a question of divergence in the fly
      lineage, not of placement. Two fly assays address it directly. Spontaneous mitotic
      recombination is at or above control levels in mei-9 mutants (PMID:17248870), and the
