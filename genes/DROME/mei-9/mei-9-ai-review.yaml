  review:
    summary: MEI-9 is the XPF subunit of the conserved XPF-ERCC1-XPA nucleotide excision repair
      incision complex.
    action: ACCEPT
    reason: >-
      GO:0000110 is defined by its yeast (Rad1-Rad10-Rad14) and human (XPF-ERCC1-XPA)
      compositions, so it is not a yeast-only complex. The IBD sits at PTN000015911 (Eukaryota)
      in PTHR10150, a family of XPF orthologs only; MEI-9 descends from that node and no loss is
      recorded on the Drosophila branch. The fly evidence fits the inheritance: MEI-9 binds
      ERCC1 and depends on it for stability (PMID:10812334, PMID:15944364), mei-9 is required
      for excision of UV-induced pyrimidine dimers (PMID:826452), and flies have an XPA ortholog
      (Xpac, P28518). No fly experiment has shown MEI-9-ERCC1 together with XPAC, so membership
      of the three-subunit complex is inferred, but nothing argues against it.
    supported_by:
    - reference_id: PMID:10812334
      supporting_text: ERCC1(Dm) interacts strongly in a yeast two-hybrid assay with MEI-9, indicative
        of the presumed requirement for these polypeptides to dimerize to form the functional endonuclease.
    - reference_id: PMID:826452
      supporting_text: is deficient in the excision of UV-induced pyrimidine dimers in both sexes
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000015911
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryote-level IBD in an XPF-only family; MEI-9 is a descendant, is required
          for NER and binds ERCC1, and the fly genome encodes the XPA partner.
