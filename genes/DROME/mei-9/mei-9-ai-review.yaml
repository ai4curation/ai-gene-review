id: Q24087
gene_symbol: mei-9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  meiotic 9 (mei-9) encodes the Drosophila ortholog of XPF/ERCC4 (yeast Rad1), the
  catalytic subunit of a nuclear structure-specific DNA endonuclease that functions as a
  heterodimer with ERCC1. In somatic cells MEI-9-ERCC1 is required for nucleotide excision
  repair: mei-9 mutant cells fail to excise UV-induced pyrimidine dimers, and mutants are
  hypersensitive to UV light, alkylating agents and DNA crosslinkers, reflecting roles in
  nucleotide excision repair and interstrand crosslink repair. In female meiosis MEI-9 is
  required for most crossovers, and therefore for normal homolog disjunction, but not for
  gene conversion. This meiotic function needs a physical interaction with the scaffold
  protein MUS312 (the SLX4 ortholog) and involves the OB-fold protein Hold'em; a
  MEI-9-ERCC1-MUS312-HDM complex is thought to cut double Holliday junction intermediates
  into crossovers, and in its absence these intermediates are dissolved into noncrossovers.
  Separation-of-function alleles show that the MUS312 interaction is needed for the meiotic
  but not the repair functions. MEI-9 is not needed for spontaneous mitotic crossovers,
  which are made by other MUS312-associated nucleases. The nuclease activity of the fly
  complex has not been measured directly and is inferred from the conserved XPF nuclease
  domain.
