descriptions:
- source: UniProt
  text: Implicated in recombination events during meiosis, mostly in meiotic exchange. May
    directly resolve Holliday junctions within recombination intermediates leading to DNA
    exchange. Also required for the repair of mismatches within meiotic heteroduplex DNA and
    for nucleotide excision repair.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24087
  source_id: Q24087
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Meiotic exchange, a possible Holliday junction resolution role and nucleotide
      excision repair are correct. The claim that MEI-9 repairs mismatches in meiotic heteroduplex
      DNA is outdated (PMID:17339219 attributes the postmeiotic segregation to crossover failure).
      Omits interstrand crosslink repair and the ERCC1 and MUS312 partners.
- source: Alliance_Imported
  text: meiotic 9 (mei-9) encodes the catalytic subunit of the Mei-9-Ercc1 structure-selective
    endonuclease that functions in nucleotide excision repair. The products of mei-9 and Ercc1
    interact with the product of mus312 to generate meiotic crossovers.
  source_type: curated
  url: https://flybase.org/reports/mei-9.html
  source_id: FB:FBgn0002707
  review:
