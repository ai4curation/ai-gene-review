      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Both sentences agree with the review (catalytic subunit of MEI-9-ERCC1
      in nucleotide excision repair; interaction with MUS312 to make meiotic crossovers).
      Omits interstrand crosslink repair and the Hold'em partner.
- source: Alliance_Automated
  text: Enables protein heterodimerization activity. Involved in DNA metabolic process; female
    meiosis chromosome segregation; and oocyte fate determination. Part of protein-containing
    complex. Human ortholog(s) of this gene implicated in Fanconi anemia complementation group
    Q; XFE progeroid syndrome; pancreatic cancer; polyneuropathy due to drug; and xeroderma
    pigmentosum (multiple). Orthologous to human ERCC4 (ERCC excision repair 4, endonuclease
    catalytic subunit).
  source_type: automated
  url: https://flybase.org/reports/mei-9.html
