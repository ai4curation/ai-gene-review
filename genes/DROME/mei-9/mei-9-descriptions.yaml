findings:
- category: discrepancy
  text: UniProt says MEI-9 repairs mismatches in meiotic heteroduplex DNA; the review treats
    this as outdated, because the heteroduplex in mei-9 products reflects dissolution of crossover
    intermediates, not a mismatch repair defect (PMID:17339219).
  sources:
  - UniProt
- category: discrepancy
  text: The automated text lists oocyte fate determination; the review marks it as an indirect,
    PCH2-dependent checkpoint delay in crossover-defective mutants.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions interstrand crosslink repair, for which mei-9 is essential (PMID:15166153),
    or that MEI-9 is dispensable for mitotic crossovers (PMID:25205745).
  sources:
  - UniProt
  - Alliance_Imported
- category: gap
  text: The automated text omits the catalytic (endonuclease) role and the meiotic crossover
    function that the two curated texts state.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: The FlyBase and UniProt texts agree on the two main roles (nucleotide excision
    repair and meiotic crossover formation); UniProt adds an outdated mismatch repair claim,
    and the automated text is generic and leads with an indirect phenotype.
