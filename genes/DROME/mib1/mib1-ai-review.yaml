    summary: 'IBA (PTN008608909): Mib proteins act in Notch signalling.'
    action: ACCEPT
    reason: >-
      Mib1 acts in the signal-sending cell to activate DSL ligands; well supported in Drosophila
      (double neur mib1 mutants abolish signalling). GO:0045747 is more precise but this parent
      is correct.
