id: Q9VUX2
gene_symbol: mib1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Mind bomb 1 (Mib1, D-mib) is a large cytoplasmic RING-type E3 ubiquitin ligase with an N-terminal
  substrate-recognition region (MIB/HERC2 and ZZ-type zinc finger domains), a central ankyrin-repeat
  region and C-terminal RING fingers. It binds the intracellular domains of the Notch ligands
  Delta and Serrate and ubiquitinates specific lysines (K742 is the most important in Delta),
  routing the ligands into Epsin-dependent endocytosis that is required for trans-activation
  of Notch and for release of ligand from cis-inhibition. Mib1 is expressed broadly (e.g.
  ubiquitously in the wing disc) and is the main ligand E3 for wing margin specification,
  leg segmentation and vein formation, while the structurally unrelated Neuralized predominates
  in lateral inhibition and SOP lineages; the two are partially redundant and mutually substitutable,
  and loss of both abolishes DSL signalling. Mib1 localizes to the cytoplasm and apical cortex
  of epithelial cells.
