core_functions:
- description: >-
    RING E3 ubiquitin ligase that ubiquitinates the intracellular domains of the DSL Notch
    ligands Delta and Serrate, promoting their endocytosis and activation for trans-signalling
    to Notch in neighbouring cells.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0045747
    label: positive regulation of Notch signaling pathway
  - id: GO:0006897
    label: endocytosis
  locations:
  - id: GO:0045179
    label: apical cortex
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:22162135
    supporting_text: >-
      Using a cell-based assay, we detected ubiquitylation of Dl by both Neur and Mib1.
  - reference_id: PMID:15829515
    supporting_text: >-
      We find that D-mib uses its ubiquitin ligase activity to promote DSL ligand activity,
      an activity that is correlated with its ability to induce the endocytosis and degradation
      of both Delta and Serrate (see also Le Borgne et al., 2005).
  - reference_id: PMID:16093323
    supporting_text: >-
      Simultaneous absence of neuralized and mib1 completely abolishes Notch signaling in
      both aforementioned contexts, making it likely that ubiquitination is a prerequisite
      for Delta/Serrate signaling.
  - reference_id: PMID:15760269
    supporting_text: >-
      Moreover, the activity of the D-mib gene is required for the endocytosis of Ser in wing
      imaginal disc cells.
  - reference_id: PMID:40050848
    supporting_text: >-
      Moreover, we show that a combination of six Ks in the ICD is required for the full activation
      of Dl by Mib1, with K742 being the most important one.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is the bipartite MIB1-JAG1 docking mode (N-box and second site) conserved for Drosophila
    Serrate, and how does it differ from Neur's NXXN-dependent docking on Delta?
- question: >-
    Which non-DSL substrates of Drosophila Mib1 (e.g. centriolar satellite or other signalling
    proteins) contribute to its phenotypes?
suggested_experiments:
- description: >-
    Endogenous tagging of Mib1 with proximity labelling in wing disc cells to identify substrates
    beyond Delta and Serrate.
