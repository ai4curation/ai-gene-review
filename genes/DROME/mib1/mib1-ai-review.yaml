        We show here that a Drosophila ortholog of Mind bomb (D-mib) is a positive component
        of Notch signaling that is required for multiple Neuralized-independent, Notch-dependent
        developmental processes.
    - reference_id: PMID:15829515
      supporting_text: >-
        We find that D-mib uses its ubiquitin ligase activity to promote DSL ligand activity,
        an activity that is correlated with its ability to induce the endocytosis and degradation
        of both Delta and Serrate (see also Le Borgne et al., 2005).
    - reference_id: PMID:16093323
      supporting_text: >-
        Simultaneous absence of neuralized and mib1 completely abolishes Notch signaling in
        both aforementioned contexts, making it likely that ubiquitination is a prerequisite
        for Delta/Serrate signaling.
    - reference_id: PMID:15930117
      supporting_text: >-
        Here, we present evidence that the Drosophila ortholog of Mib (Dmib) is required for
        ubiquitination and signaling activity of DSL ligands in cells that normally do not
        express Neur, and can be functionally replaced by ectopically expressed Neur.
    - reference_id: PMID:28960177
      supporting_text: >-
        Our analysis suggests that one important role of DSL protein ubi by Mib1 is their
        release from cis-inhibitory interactions with Notch, enabling them to trans-activate
        Notch on adjacent cells.
    - reference_id: PMID:40050848
      supporting_text: >-
        Moreover, we show that a combination of six Ks in the ICD is required for the full
        activation of Dl by Mib1, with K742 being the most important one.
