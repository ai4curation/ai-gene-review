descriptions:
- source: UniProt
  text: E3 ubiquitin-protein ligase involved in regulation of Notch signaling (PubMed:15760269,
    PubMed:15829515, PubMed:20176925). Ubiquitinates the intracellular domains of
    Notch ligands Dl/delta and Ser/serrate, leading to their endocytosis and degradation
    (PubMed:15760269, PubMed:15829515, PubMed:20176925). Regulates a subset of Notch
    signaling events, including wing margin specification, leg segmentation and vein
    determination, that are distinct from those events requiring neuralize (neur)
    activity (PubMed:15760269, PubMed:15829515, PubMed:20176925). Also modulates lateral
    inhibition, a neur- and Dl-dependent signaling event, suggesting a distinct but
    partially complementary function with neur (PubMed:15760269, PubMed:15829515).
    Involved in the development of sensory organ precursors and wings (PubMed:15829515).
  source_type: curated
