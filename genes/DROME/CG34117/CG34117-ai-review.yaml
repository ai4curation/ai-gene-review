  review:
    action: ACCEPT
    summary: No specific molecular-function term can yet be assigned. The only characterized subfamily
      member, human FMC1, is known to bind the F1-assembly factor ATPAF2, which supports no informative
      MF term beyond protein binding.
    reason: A literature search found no study of CG34117 itself. The human ortholog's known molecular
      property, co-immunoprecipitation with ATPAF2, would map only to bare protein binding, which repo
      policy treats as uninformative. FMC1 is not a catalytic subunit, so no enzymatic activity is implied.
      Keeping the ND root is correct until a specific activity is defined.
