- term:
    id: GO:0033615
    label: mitochondrial proton-transporting ATP synthase complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001271866
  - UniProtKB:Q96HJ9
  review:
    action: ACCEPT
    summary: Complex V assembly is the core process. It is inherited from PAINT node PTN001271866 and grounded
      on human FMC1 knockout and rescue data together with FMC1 binding to the F1 assembly factor ATPAF2.
    reason: Human FMC1 (Q96HJ9) is in the same PANTHER subfamily as CG34117 and aligns with it over its
      whole length. FMC1 knockout specifically destabilized complex V, reducing F1 alpha and beta subunit
      levels, assembled complex V and in-gel ATPase activity. Re-expression rescued every defect. FMC1
      also co-immunoprecipitates with ATPAF2, a dedicated F1 assembly factor. FMC1 is therefore part of
      the assembly machinery itself, not a downstream requirement. That meets the participation bar for
      an assembly process. The yeast temperature dependence is not transferred, because yeast Fmc1 is
      a separate-family analog.
    supported_by:
    - reference_id: PMID:28719601
      supporting_text: in the absence of C7orf55 we observed a specific destabilization of the mitochondrial
        complex V using three assays
    - reference_id: PMID:28719601
      supporting_text: All the defects in complex V were entirely rescued by the reintroduction of a CRISPR-resistant
        version of C7orf55
    - reference_id: file:DROME/CG34117/CG34117-bioinformatics/RESULTS-rereview.md
      supporting_text: CG34117 and human FMC1 are in the same PANTHER family and subfamily.
