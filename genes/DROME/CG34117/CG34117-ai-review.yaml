- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P40491
  review:
    action: UNDECIDED
    summary: The matrix sub-compartment is plausible, but the only basis for it is yeast Fmc1 (P40491).
      Yeast Fmc1 is in a different PANTHER family and shows no detectable sequence homology to the animal
      FMC1 proteins.
    reason: The ISS donor P40491 is classified in PANTHER PTHR28015, whereas CG34117 and human FMC1 are
      in PTHR31716. The paper that characterized human FMC1 states that the human and yeast proteins have
      no BLASTP-detectable homology. They share only an LYRM-type Pfam assignment, so the similarity-based
      transfer has no sequence basis. Yeast Fmc1 is a soluble matrix protein. Human FMC1 binds ATPAF2,
      and the F1 assembly that ATPAF2 assists takes place on the matrix side. Matrix localization of
      CG34117 is therefore likely. However, no experiment places any PTHR31716 member in the matrix rather
      than at the matrix face of the inner membrane. The location is kept as UNDECIDED rather than accepted,
      and the with/from is flagged for the source to check.
    supported_by:
    - reference_id: PMID:28719601
      supporting_text: these short human and yeast proteins have no sequence homology detectable via BLASTP
    - reference_id: file:DROME/CG34117/CG34117-bioinformatics/RESULTS-rereview.md
      supporting_text: Yeast Fmc1 is in a different PANTHER family (PTHR28015).
    - reference_id: PMID:11096112
      supporting_text: Fmc1p is a soluble protein located in the mitochondrial matrix.
