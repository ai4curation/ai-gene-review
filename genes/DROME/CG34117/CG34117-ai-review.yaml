  label: Drosophila melanogaster
description: CG34117 is a small animal FMC1-family protein inferred to participate in mitochondrial ATP-synthase
  assembly. The characterized yeast Fmc1 comparison acts in the mitochondrial matrix to support F1 assembly
  or stability, particularly under heat stress. The fly protein is an assembly-factor homolog rather than
  an ATP-synthase catalytic subunit; target-specific localization and assembly assays remain unavailable.
