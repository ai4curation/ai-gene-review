id: Q0KI97
gene_symbol: CG34117
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG34117 encodes a small (101 aa) mitochondrial protein of the animal FMC1 family (PANTHER
  PTHR31716:SF1), the Drosophila ortholog of human FMC1 (C7orf55). It is a non-catalytic assembly factor
  for mitochondrial ATP synthase (complex V). Human FMC1 is in the same PANTHER subfamily and aligns
  collinearly with the fly protein over its whole length. It localizes to mitochondria and binds the F1-assembly
  chaperone ATPAF2. Its loss destabilizes the F1 alpha and beta subunits and lowers the amount and activity
  of assembled complex V. The fly protein is therefore expected to support assembly of the F1 catalytic
  sector inside mitochondria. Yeast Fmc1 is a functional analog in a separate PANTHER family, with no
  detectable sequence homology. No fly-specific localization, interaction or assembly experiment has
  been reported.
