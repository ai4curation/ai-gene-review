core_functions:
- description: Non-catalytic mitochondrial assembly factor for ATP synthase (complex V), inferred from
    its in-subfamily human ortholog FMC1. FMC1 binds the F1 assembly chaperone ATPAF2 and is needed for
    stable F1 alpha and beta subunits and for assembled, active complex V.
  locations:
  - id: GO:0005739
    label: mitochondrion
  directly_involved_in:
  - id: GO:0033615
    label: mitochondrial proton-transporting ATP synthase complex assembly
  supported_by:
  - reference_id: PMID:28719601
    supporting_text: in the absence of C7orf55 we observed a specific destabilization of the mitochondrial
      complex V using three assays
  - reference_id: PMID:28719601
    supporting_text: First, we confirmed mitochondrial localization (Fig 6A) by immunostaining with antibodies
      to endogenous C7orf55
  - reference_id: file:DROME/CG34117/CG34117-bioinformatics/RESULTS-rereview.md
    supporting_text: CG34117 and human FMC1 are in the same PANTHER family and subfamily.
suggested_questions:
- question: Does CG34117 bind the fly ATPAF2 ortholog, as human FMC1 binds ATPAF2, and does it sit in
    the soluble matrix or at the matrix face of the inner membrane?
- question: Do animal FMC1 (PTHR31716) and yeast Fmc1 (PTHR28015) share LYRM ancestry, or did they converge
    on similar roles? Should yeast-based transfers to animal FMC1 proteins be withdrawn?
suggested_experiments:
- description: Knock down CG34117 by RNAi in fly tissue or S2 cells, then assess complex V by blue-native
    PAGE with in-gel ATPase activity and measure ATP5A/ATP5B levels, rescuing with an RNAi-resistant
    transgene.
- description: Tag CG34117 at its endogenous locus and use mitochondrial subfractionation with protease
    protection to place it in the matrix or at the inner membrane. Co-immunoprecipitate it to test binding
    to the fly ATPAF2 ortholog.
