- source: Alliance_Automated
  text: Enables PDZ domain binding activity and identical protein binding activity.
    Involved in several processes, including homophilic cell-cell adhesion; regulation
    of myoblast fusion; and sensory organ development. Located in adherens junction
    and plasma membrane. Part of protein complex involved in cell adhesion. Is active
    in apical plasma membrane. Is expressed in several structures, including anlage
    in statu nascendi; anterior-posterior subdivision of organism; imaginal disc;
    medulla layer; and pigment cell. Human ortholog(s) of this gene implicated in
    nephrotic syndrome type 23. Orthologous to human KIRREL1 (kirre like nephrin family
    adhesion molecule 1); KIRREL2 (kirre like nephrin family adhesion molecule 2);
    and KIRREL3 (kirre like nephrin family adhesion molecule 3).
  source_type: automated
