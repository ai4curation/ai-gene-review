id: Q08180
gene_symbol: rst
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Roughest (Rst, also Irregular chiasm C-roughest) is a Neph1/KIRREL-family single-pass transmembrane
  protein of the immunoglobulin superfamily with five extracellular Ig domains, and a paralog of Kirre.
  As an Irre cell recognition module protein it forms homophilic and heterophilic adhesion complexes with
  the Nephrin-like proteins Hibris and Sticks and stones. In embryonic founder myoblasts Rst acts redundantly
  with Kirre as an attractant and adhesion receptor required for myoblast fusion. In the pupal retina
  Rst in interommatidial cells binds Hbs on primary pigment cells to drive the preferential adhesion and
  cell rearrangements that space ommatidia and determine which surplus lattice cells are eliminated; its
  cytoplasmic domain binds the CD2AP ortholog Cindr and X11L/Mint PDZ proteins that link it to the actin
  cytoskeleton. Rst also contributes to sensory organ spacing, optic lobe wiring and timing of salivary
  gland histolysis.
