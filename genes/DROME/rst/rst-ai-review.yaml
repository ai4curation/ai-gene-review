    label: compound eye morphogenesis
  evidence_type: IDA
  original_reference_id: PMID:20599904
  qualifier: involved_in
  review:
    summary: Rst acts in IRM-mediated preferential adhesion that sorts interommatidial cells and separates
      ommatidia in the pupal eye.
    action: ACCEPT
    reason: In the pupal retina Kirre and Rst (in interommatidial cells) bind Hbs and Sns (in primary
      pigment cells); this heterophilic preferential adhesion is necessary and sufficient to keep ommatidia
      apart. The adhesion molecule directly does the cell-sorting work, so compound eye morphogenesis
      is an appropriate (if developmental) process annotation.
