core_functions:
- description: Rst on interommatidial cells binds Hbs (and Sns) on primary pigment cells, mediating heterophilic
    preferential adhesion that drives cell sorting and ommatidial spacing in the pupal eye; its cytodomain
    engages Cindr and X11L PDZ adaptors.
