suggested_questions:
- question: Does Rst signal through its cytodomain partners (Cindr, X11L) to direct cell movements in
    the pupal eye, or is its role purely adhesive?
suggested_experiments:
- hypothesis: The Rst cytoplasmic domain is required for interommatidial cell sorting but not for myoblast
    fusion.
  description: Compare rst(CT) cytodomain-truncated alleles with full-length rescue in a kirre-sensitised
    background for embryonic fusion and pupal eye lattice patterning by live imaging.
