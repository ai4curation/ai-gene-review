- source: UniProt
  text: Part of the MTV complex that associates with the HipHop-HOAP complex to form
    the terminin telomere-capping complex involved in telomere maintenance and prevention
    of telomere fusion (PubMed:20679394, PubMed:27835648). As part of the MTV complex
    binds single stranded DNA in a sequence-independent manner, protecting it from
    degradation (PubMed:27835648).
