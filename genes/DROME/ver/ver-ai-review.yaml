id: Q9VTZ2
gene_symbol: ver
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: ver (verrocchio) encodes an OB-fold protein related to Rpa2/Stn1 that is a subunit of terminin,
  the Drosophila telomere-capping complex. Ver is enriched only at telomeres, interacts with HOAP and
  Moi, and with Moi and Tea forms the MTV complex, which binds and protects single-stranded DNA in a sequence-independent
  manner, analogous to CST. ver mutants show telomere fusions, and Ver is also needed for the S-phase
  assembly of HeT-A retrotransposon Gag (ORF1p) spheres at telomeres, linking end protection to the transposon-based
  elongation of Drosophila telomeres.
