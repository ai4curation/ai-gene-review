descriptions:
- source: UniProt
  text: Main component of the apoptosome, an adapter protein complex that mediates
    activation of the caspase cascade in programmed cell death initiated by the intrinsic
    apoptosis pathway (PubMed:10984473, PubMed:16310803, PubMed:21220123, PubMed:25644603,
    PubMed:27916517). Recruits the initiator caspase Dronc, promoting its autocatalytic
    cleavage and activation; triggers the caspase cascade upstream of the effector
    caspases Drice and dcp-1 (PubMed:10619022, PubMed:10619023, PubMed:10984473, PubMed:21220123,
    PubMed:25644603). Effector of reaper, grim and hid induced cell killing (PubMed:10559939,
    PubMed:10619023, PubMed:16645639). Produces at least two isoforms that may activate
    distinct caspases by separate pathways (PubMed:10619023). Nucleotide binding protein
    with strong specificity for dATP; dATP binding is not essential, but promotes
    homooligomerization to form the apoptosome complex (PubMed:10619022, PubMed:10619023,
    PubMed:16310803, PubMed:21220123, PubMed:25644603, PubMed:27916517). There is
    currently no evidence of dATPase activity and structural analysis of the nucleotide
    binding pocket suggests negligible to no dATPase activity (Probable). Caspase
    activation by the apoptosome was initially thought to be dependent on binding
    of cytochrome c released from mitochondria, as is the case for vertebrate orthologs
    (PubMed:10619022, PubMed:10619023). Apoptosis induction by the Dark apoptosome
    appears to be cytochrome c independent (PubMed:11901172). Required for stress-
    induced apoptosis, for example in response to radiation (UV or gamma) or treatment
    with macromolecular synthesis inhibitors like cycloheximide and actinomycin D
    (PubMed:11901172, PubMed:16533943). Required for most, but not all programmed
    cell death during embryonic development (PubMed:16645639). Involved in developmental
    cell number regulation by apoptosis, particularly during neuronal and sensory
    organ development (PubMed:10559939, PubMed:10619022, PubMed:10619023, PubMed:16533943,
    PubMed:16645639). Involved in reduction of midline glial cell numbers by programmed
    cell death during embryogenesis (PubMed:16645639). During metamorphosis involved
    in removal of larval salivary glands by programmed cell death, but not of the
    larval midgut (PubMed:16533943).
