- source: Alliance_Imported
  text: Death-associated APAF1-related killer (Dark) encodes an essential component
    of the apoptosome. The products of Dark and Dronc form a pivotal holoenzyme required
    for apoptotic cell death with the products of Dark acting as an adaptor of the
    multimeric complex.
