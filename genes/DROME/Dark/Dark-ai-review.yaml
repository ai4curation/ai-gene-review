suggested_questions:
- question: Does the physiologic Dark/Dronc activation complex in vivo resemble 
    the unsealed single ring, the post-activation Dark/Dronc-CARD double ring, 
    or a regulated mixture of assemblies?
- question: Which Dark-dependent Dronc substrates distinguish lethal apoptosis 
    from nonapoptotic outputs in spermatid individualization and chaeta 
    patterning?
- question: How should GO separate salivary-gland histolysis, autophagy, and 
    apoptosome-dependent killing so that Dark is not annotated to autophagy when
    autophagic features proceed upstream or in parallel?
suggested_experiments:
- hypothesis: Dronc-CARD binding to Dark WD1 gates assembly of the active 
    single-ring apoptosome rather than merely stabilizing post-activation 
    complexes.
  description: Introduce endogenous Dark WD1 interface alleles and Dronc CARD 
    loop alleles, then compare apoptosis, Dronc processing, spermatid 
    individualization, Dark/Dronc complex geometry, and DrICE cleavage in the 
    same genetic backgrounds.
  experiment_type: structure-guided endogenous rescue
- hypothesis: Nonapoptotic Dark/Dronc outputs use spatially restricted Dronc 
    activation below the threshold for effector-caspase cascade amplification.
  description: Measure endogenous Dark/Dronc assembly, Dronc cleavage, and 
    effector-caspase substrates with live reporters in spermatids and proneural 
    clusters, and compare them with matched cells undergoing lethal 
    developmental apoptosis.
  experiment_type: live caspase-activity imaging with separation-of-function 
    alleles
