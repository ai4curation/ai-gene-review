  qualifier: involved_in
  review:
    summary: The development-qualified apoptosis row is better represented as 
      Dark-dependent apoptotic signaling.
    action: MODIFY
    reason: The source establishes that Dark is required for Dronc processing 
      and embryonic programmed cell death, but the direct mechanistic step is 
      Dronc activation by the Dark apoptosome. Use the proximal positive 
      regulation of apoptotic signaling pathway term shared by the broad 
      apoptosis rows.
