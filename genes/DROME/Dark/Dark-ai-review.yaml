        degeneration
- term:
    id: GO:0070328
    label: triglyceride homeostasis
  evidence_type: IMP
  original_reference_id: PMID:24746817
  qualifier: involved_in
  review:
    summary: triglyceride homeostasis is a systemic downstream phenotype of 
      apoptosis-deficient mutants, not a direct Dark function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PMID:24746817 abstract describes apoptosis-deficient mutants 
      that spontaneously develop necrosis-driven systemic inflammation, altered 
      hemolymph SAM metabolism, and FOXO/Gnmt-linked energy effects. That 
      evidence places Dark upstream by preventing failed apoptosis and secondary
      necrosis, not as a direct executor of this distal immune or metabolic 
      process.
    supported_by:
