  evidence_type: IGI
  original_reference_id: PMID:22153373
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0261788
  review:
    summary: Dark participates in ank2 stress-induced motoneuron degeneration 
      rather than ordinary neuron homeostasis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper shows that dark loss suppresses ank2-dependent 
      neuromuscular degeneration, consistent with Dark amplifying local caspase 
      activity in a pathological stress model. GO:0070050 makes this look like a
      homeostatic maintenance function and overstates the biology.
