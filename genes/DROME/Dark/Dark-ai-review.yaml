id: Q7KLI1
gene_symbol: Dark
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Dark is the Drosophila Apaf-1/CED-4 family apoptosome adaptor that recruits
  the initiator caspase Dronc through CARD-dependent contacts and promotes Dronc autoprocessing
  in the cytosolic apoptosome. Its NB-ARC nucleotide-binding core and WD40 repeats
  support oligomerization and Dronc recruitment, placing Dark upstream of effector
  caspase activation in most developmental and stress-induced fly apoptosis. Dark/Dronc
  signaling is also reused in nonapoptotic caspase outputs such as spermatid individualization
  and sensory organ precursor patterning.'
alternative_products:
