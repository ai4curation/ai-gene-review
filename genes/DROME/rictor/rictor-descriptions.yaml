descriptions:
- source: Alliance_Imported
  text: rapamycin-insensitive companion of Tor (rictor) encodes an essential component
    of TOR complex 2 where it controls phosphorylation of protein kinases, such as
    those encoded by Akt and trc. The product of rictor contributes to the regulation
    of tissue growth, dendritic tiling, long term memory, tolerance to heat stress,
    and mitochondrial quality control.
  source_type: curated
  url: https://flybase.org/reports/rictor.html
  source_id: FB:FBgn0031006
