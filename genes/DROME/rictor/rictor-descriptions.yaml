    - rubric: specificity
      score: 4
    overall_notes: Correct on the TORC2 role in Akt and Trc phosphorylation, growth,
      dendritic tiling and heat stress. Long-term memory and mitochondrial quality
      control are not in the review.
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activator activity. Involved in several
    processes, including TORC2 signaling; cytoplasmic stress granule assembly; and
    positive regulation of signal transduction. Part of TORC2 complex. Human ortholog(s)
    of this gene implicated in breast ductal carcinoma; gastrointestinal system cancer
    (multiple); and lung cancer (multiple). Orthologous to human RICTOR (RPTOR independent
    companion of MTOR complex 2).
