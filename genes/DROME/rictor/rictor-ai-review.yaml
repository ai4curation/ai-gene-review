id: Q9VWJ6
gene_symbol: rictor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rictor (rapamycin-insensitive companion of TOR) is the large defining scaffold subunit of
  TOR complex 2 (TORC2), which in Drosophila also contains the TOR kinase, Sin1 and Lst8. Rictor has no
  catalytic activity of its own; it is required for TORC2 assembly and for TORC2-dependent phosphorylation
  of the hydrophobic motif of Akt (Ser505), which broadens the range of insulin/PI3K-Akt signaling and
  is particularly needed for Akt-driven hyperplasia, while rictor mutants are viable with only mild growth
  defects. Through TORC2, Rictor also promotes cell growth via nuclear localization of Myc, is required
  for heat-stress-induced stress granule formation, and regulates dendritic tiling of sensory neurons
  (via Tricornered kinase), dendrite scaling with body size, and synaptic growth at the neuromuscular
  junction.
