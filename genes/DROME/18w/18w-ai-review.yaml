suggested_questions:
- question: 'What is the ligand (if any) of 18W/Toll-2 in convergent extension: heterophilic binding to
    Toll-6/Toll-8 or other cell-surface proteins, or a Spätzle-family cytokine other than Spz-1?'
- question: Does 18W signal through its TIR domain (MyD88/Tube/Pelle) during convergent extension, or
    does it act mainly as an adhesion/recognition molecule upstream of myosin II polarity?
- question: Is the larval fat-body phenotype of 18w a direct requirement of 18W or a neomorphic effect
    of the 18w7-35 allele, as Ligoxygakis et al. raised?
suggested_experiments:
- description: Test binding of 18W ectodomain to Toll-6, Toll-8 and Spätzle-family cystine knots with
    purified proteins, and assay convergent extension with TIR-deleted 18W rescue constructs.
- description: Re-examine larval AMP induction and fat-body development with a clean 18w null (CRISPR)
    allele to separate direct from neomorphic effects.
