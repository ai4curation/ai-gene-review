  label: Drosophila melanogaster
description: 18 wheeler (18w, also called Toll-2) is a Toll-family type I transmembrane receptor with
  an extracellular leucine-rich-repeat ectodomain and a cytoplasmic TIR domain. It has no identified ligand
  and is not activated by Spätzle-1. 18W is expressed in segmental stripes in the embryo, in migrating
  cells and in subsets of ovarian follicle cells, and promotes cell aggregation when expressed in S2 cells.
  Together with Toll-6 and Toll-8, expressed in overlapping transverse stripes under pair-rule control,
  it forms a positional cell-surface code that directs planar polarity of myosin II and Par-3, cell intercalation
  and germband convergent extension. 18w is also required for imaginal disc eversion and adult appendage
  morphogenesis, follicle cell migration and egg shape, and larval fat body development. It is not required
  for adult antimicrobial responses and does not act as a pattern recognition receptor for bacteria.
