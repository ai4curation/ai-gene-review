descriptions:
- source: Alliance_Imported
  text: 18 wheeler (18w) encodes a member of the Toll-like receptor family. It contributes
    to multiple processes including ovarian follicle cell migration, antibacterial
    humoral response and ventral cord development. A role in convergent extension
    during early embryogenesis is suggested by the genetic interaction of 18w with
    Toll-6 and Tollo.
  source_type: curated
  url: https://flybase.org/reports/18w.html
  source_id: FB:FBgn0287775
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Toll-like receptor with follicle cell migration and convergent
      extension roles is correct. Lists antibacterial humoral response, which the
      review marks as over-annotated (18w is not required for adult antimicrobial
      responses). No mention of the Toll-6/Toll-8 positional code or imaginal disc
      morphogenesis.
- source: Alliance_Automated
