gene_symbol: Pld
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pld is the single conventional (HKD-type) phospholipase D of Drosophila melanogaster. It
  hydrolyzes membrane phosphatidylcholine to phosphatidic acid and choline through two HKD catalytic
  motifs, and carries an N-terminal PX domain, a PH domain and a polybasic PI(4,5)P2-interacting region
  that govern its membrane targeting and regulation. Its activity is stimulated by receptor signaling
  and by ARF GTPases. The phosphatidic acid it produces acts in membrane trafficking. During embryonic
  cellularization Pld is found on small cytoplasmic vesicles and is needed for normal Golgi morphology
  and for insertion of Golgi-derived secretory vesicles into the growing plasma membrane. In photoreceptors
  it sits in the cell body and at the base of the rhabdomere. There it supports light sensitivity and
  phosphoinositide (PIP2) replenishment, and during illumination it drives Arf1- and retromer-dependent
  recycling of endocytosed rhodopsin back to the rhabdomere membrane, protecting photoreceptors from
  light-dependent degeneration.
