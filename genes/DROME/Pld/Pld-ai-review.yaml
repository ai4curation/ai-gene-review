- term:
    id: GO:0035091
    label: phosphatidylinositol binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001683
  - InterPro:IPR036871
  review:
    action: KEEP_AS_NON_CORE
    summary: The PX domain (residues 146-355) and the polybasic PI(4,5)P2-interacting motif make phosphoinositide
      binding plausible. GO:0035091 covers PtdIns and its phosphorylated derivatives, so the term fits
      the domain-based inference. No binding assay on fly Pld is published in the cached literature.
    reason: The term definition explicitly includes phosphorylated derivatives, so the earlier concern
      about parent PtdIns versus PIPs does not apply. The PX-domain InterPro2GO mapping is a sound family-level
      inference. Phosphoinositide binding is a regulatory and targeting feature, not the catalytic core,
      and no more specific lipid can be named from direct fly data. Note that A4UZ54 lacks an 18-residue
      segment near the C-terminal end of the PX domain (after residue 338) that is present in the 1278-residue
      cDNA product. Whether this alters lipid binding is unknown.
    supported_by:
    - reference_id: PMID:17156430
      supporting_text: a PI(4,5)P2-interacting motif, and a conserved carboxy terminus
