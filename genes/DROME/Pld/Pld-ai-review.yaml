- term:
    id: GO:0007030
    label: Golgi organization
  evidence_type: IMP
  original_reference_id: PMID:17156430
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Pld-null cellularizing embryos have enlarged Lva-marked Golgi or Golgi-derived vesicles.
      The phenotype is real, but it reads out a defect in Golgi-derived vesicle trafficking rather than
      a dedicated role in organizing the Golgi.
    reason: The experimental phenotype supports the annotation, so it is retained. However, Pld does
      not localize to the Golgi at steady state, and the authors interpret the enlarged Golgi structures
      as a consequence of impaired production and trafficking of fusion-competent vesicles. The core
      process is captured by the vesicle-fusion regulation term, so Golgi organization is non-core.
    supported_by:
    - reference_id: PMID:17156430
      supporting_text: chronic Pld deficiency causes abnormal Golgi structure and secretory vesicle trafficking.
    - reference_id: PMID:17156430
      supporting_text: Of note, Pld does not exhibit steady-state localization in the Golgi.
- term:
    id: GO:0007349
    label: cellularization
  evidence_type: IMP
  original_reference_id: PMID:17156430
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Pld-null embryos show delayed cellularization and defective insertion of Golgi-derived
      membrane into the extending plasma membrane. Pld contributes to this process by supplying vesicle
      trafficking, which is a developmental context for its core membrane-trafficking role.
    reason: Cellularization is a cellular membrane-growth process. Pld contributes directly by promoting
      delivery of Golgi-derived vesicles to the furrows, not only as a distant downstream phenotype, so
      the annotation is retained. It is a context-specific use of the core trafficking function, hence
      non-core.
    supported_by:
    - reference_id: PMID:17156430
      supporting_text: Our results suggest that Pld functions to promote trafficking of Golgi-derived
        fusion-competent vesicles during cellularization.
