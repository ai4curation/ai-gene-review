- term:
    id: GO:2001137
    label: positive regulation of endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:27848911
  qualifier: involved_in
  review:
    action: NEW
    summary: In illuminated photoreceptors, Pld loss causes accumulation of endocytosed Rab7-positive
      rhodopsin-containing vesicles and loss of rhabdomere membrane. Rescue requires catalytically active
      Pld. Pld overexpression clears these vesicles in a retromer- and Arf1-dependent manner.
    reason: The study combines loss of function, catalytic-dependent rescue, rescue by an independent
      PA source, and gain-of-function epistasis with retromer and Arf1. Together these show that Pld-derived
      PA promotes recycling of endocytosed membrane back to the plasma membrane. Pld performs a step
      in this process by supplying PA, so this is participation and not only necessity. The comparator
      check is consistent, since the lipid enzyme PLA2G4E carries this term by IMP in human and mouse.
      The term is a regulation term because PA modulates retromer-dependent sorting rather than forming
      part of the recycling machinery.
    supported_by:
    - reference_id: PMID:27848911
      supporting_text: In wild-type photoreceptors, during illumination, enhanced PLD activity was sufficient
        to clear RLVs from the cell body by a process dependent on Arf1-GTP levels and retromer complex
        function.
    - reference_id: PMID:27848911
      supporting_text: These phenotypes were associated with reduced levels of phosphatidic acid, the
        product of PLD activity and were rescued by reconstitution with catalytically active PLD.
