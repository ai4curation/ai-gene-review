- term:
    id: GO:0010004
    label: gastrulation involving germ band extension
  evidence_type: IMP
  original_reference_id: PMID:17156430
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Only a minority of Pld-null embryos (15 of 78) showed abnormal gastrulation with a thin,
      shortened germ band, and the authors attribute this to defects that began during cellularization.
      This is a downstream developmental phenotype, not evidence that Pld does work within gastrulation.
    reason: The paper offers no gastrulation-specific mechanism, and three of the fifteen affected embryos
      still hatched. The authors explicitly suggest the gastrulation defect could follow from the earlier
      cellularization abnormalities. Under the participation standard, this is a pleiotropic consequence
      of the trafficking defect. The row is experimental and is not contradicted, so it is marked over-annotated
      rather than removed.
    supported_by:
    - reference_id: PMID:17156430
      supporting_text: 15 displayed abnormal gastrulation (which could have ensued from abnormalities
        initiated during cellularization).
