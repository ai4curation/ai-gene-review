- id: PMID:17156430
  title: A role for Phospholipase D in Drosophila embryonic cellularization.
  findings:
  - statement: Drosophila Pld is a bona fide PLD stimulated by receptor signaling and ARF1, and the
      H1095N HKD2 mutant is inactive.
    supporting_text: Taken together, these findings demonstrate that Pld is a bona fide PLD and can
      be regulated by ARF GTPases
  - statement: Pld localizes to small cytoplasmic vesicles in cellularizing embryos. Its loss alters
      Golgi-derived vesicle size and blocks plasma membrane insertion of Neurotactin.
    supporting_text: chronic Pld deficiency causes abnormal Golgi structure and secretory vesicle trafficking.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Source of the IDA activity and localization rows and the developmental
      IMP rows. The cloned cDNA encodes 1278 residues (a Q7KML4-type isoform), whereas the benchmark accession
      A4UZ54 is a 1260-residue isoform.
- id: PMID:27848911
  title: Phospholipase D activity couples plasma membrane endocytosis with retromer dependent recycling.
  findings:
  - statement: The dPLD3.1 null has no detectable in vivo PLD activity and reduced retinal PA. Catalytically
      active Pld rescues retinal degeneration and rhodopsin-vesicle accumulation.
    supporting_text: These phenotypes were associated with reduced levels of phosphatidic acid, the
      product of PLD activity and were rescued by reconstitution with catalytically active PLD.
  - statement: Enhanced Pld activity clears endocytosed rhodopsin vesicles in a retromer- and Arf1-dependent
      manner.
    supporting_text: enhanced PLD activity was sufficient to clear RLVs from the cell body by a process
      dependent on Arf1-GTP levels and retromer complex function.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached from PMC (eLife 2016). Not cited by GOA for this accession. It supports
      the NEW endocytic-recycling annotation and gives in vivo confirmation of PLD activity.
