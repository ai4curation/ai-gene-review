suggested_questions:
- question: Does the 18-residue segment near the end of the PX domain, absent from the A4UZ54 isoform
    but present in the 1278- and 1364-residue products, change phosphoinositide binding or membrane targeting?
- question: Is the embryonic requirement for Pld at budding of fusion-competent vesicles from the Golgi
    or at their fusion with the plasma membrane?
suggested_experiments:
- description: Compare liposome binding of recombinant PX domains from the 1260- and 1278-residue isoforms
    across a phosphoinositide panel, and test isoform-specific rescue of dPLD3.1 retinal degeneration.
