gene_symbol: Pld
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pld is the Drosophila phospholipase D that hydrolyzes phosphatidylcholine to generate phosphatidic
  acid. This lipid-signaling enzyme supports Golgi organization, secretory-vesicle trafficking and membrane
  delivery during cellularization, and contributes to phosphoinositide homeostasis and photoreceptor function.
  It localizes to the cytoplasm and small cytoplasmic vesicles in cellularizing embryos.
