  predicted_term:
    id: GO:0016042
    label: lipid catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Pld hydrolyzes phosphatidylcholine to phosphatidic acid and choline, a lipid-catabolic
      reaction demonstrated for the Drosophila enzyme, which loses activity when a conserved catalytic
      residue is mutated. The prediction is therefore correct, but the same gene already carries the
      more specific is_a descendant GO:0009395 phospholipid catabolic process, by PAINT IBA on the
      canonical product B7YZT5 (node PTN004499769), and GO:0006654 phosphatidic acid biosynthetic
      process on this product. Lipid catabolic process adds no information beyond those annotations.
      Both annotated HKD catalytic regions are present in A4UZ54.
    supported_by:
    - reference_id: PMID:15883198
      supporting_text: D. melanogaster Pld exhibits classic Pld activity, increases its activity in signaling
        contexts, and is inactivated by a point mutation to the conserved catalytic domain
    - reference_id: PMID:17156430
      supporting_text: Phospholipase D (PLD), which hydrolyzes the membrane phospholipid phosphatidylcholine
        to yield the lipid second messenger phosphatidic acid
    - reference_id: PMID:27848911
      supporting_text: Phospholipase D (PLD) is an enzyme that hydrolyzes phosphatidylcholine (PC) to
        generate phosphatidic acid (PA).
