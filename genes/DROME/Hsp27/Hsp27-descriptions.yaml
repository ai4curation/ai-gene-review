- source: Alliance_Automated
  text: Enables unfolded protein holdase activity. Involved in several processes,
    including behavioral response to starvation; determination of adult lifespan;
    and protein refolding. Located in cytoplasm and nucleus. Part of endoplasmic reticulum
    chaperone complex. Is expressed in several structures, including ganglia; germline
    cell; glial cell; head epidermis primordium; and somatic precursor cell.
  source_type: automated
