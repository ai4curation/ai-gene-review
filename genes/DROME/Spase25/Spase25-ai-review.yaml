    summary: PAINT inference of protein targeting to ER from yeast via PTN000317824.
    action: REMOVE
    reason: 'The SPC acts after a protein has been targeted and is being translocated: it cleaves the
      signal peptide in the ER lumen but does not direct proteins to the ER. Targeting is performed by
