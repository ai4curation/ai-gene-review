taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Spase25 encodes the Drosophila ortholog of SPCS2 (yeast Spc2), a two-pass ER membrane accessory
  subunit of the endoplasmic reticulum signal peptidase complex (SPC). In other eukaryotes it enhances
  the enzymatic activity of the complex and facilitates interactions between components of the translocation
  site. With the catalytic subunit twr (SEC11) and the accessory subunits Spase12 (SPCS1) and Spase22-23
  (SPCS3), it cleaves N-terminal signal peptides from secretory and membrane proteins as they enter the
  ER.
