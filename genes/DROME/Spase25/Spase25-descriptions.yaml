- source: UniProt
  text: Component of the signal peptidase complex (SPC) which catalyzes the cleavage
    of N-terminal signal sequences from nascent proteins as they are translocated
    into the lumen of the endoplasmic reticulum (By similarity). Enhances the enzymatic
    activity of SPC and facilitates the interactions between different components
    of the translocation site (By similarity).
