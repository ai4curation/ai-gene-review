id: Q9V3Y8
gene_symbol: IKKepsilon
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: IKKepsilon, also called Ik2 or dTBK1, is a serine/threonine protein kinase that regulates
  polarized cytoskeletal organization and recycling-endosome traffic. Its substrates include Spn-F, Nuclear
  fallout and DIAP1, linking phosphorylation to transport, cell elongation and nonapoptotic caspase regulation.
  Localized kinase activity contributes to bristle growth, oocyte polarity and dendrite pruning. In enterocytes
  it also supports cyclic-dinucleotide/STING-dependent antiviral immunity through induced gene expression.
