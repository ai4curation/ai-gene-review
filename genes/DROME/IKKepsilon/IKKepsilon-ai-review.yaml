- term:
    id: GO:0009967
    label: positive regulation of signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027202
  review:
    action: MODIFY
    summary: Ik2/dTBK1 acts as a kinase within STING-dependent signaling, not as a generic positive regulator
      of signal transduction; replace with the specific pathway it participates in.
    reason: This ARBA-derived term frames Ik2 as an upstream positive regulator of unspecified signalling.
      The only signalling context with fly evidence is the cyclic-dinucleotide/dSTING antiviral pathway,
      in which dTBK1 is required for protection and for induced gene expression in enterocytes (PMID:34965418),
      i.e. it is a pathway component. That role is captured by GO:0140896 cGAS/STING signaling pathway (IMP,
      accepted). The broad regulatory umbrella is therefore replaced by the specific pathway term. Ik2 also
      acts in bristle elongation and dendrite pruning, but those contexts are not signal transduction regulation.
    supported_by:
    - *id007
    - *id008
    proposed_replacement_terms:
    - id: GO:0140896
      label: cGAS/STING signaling pathway
