suggested_questions:
- question: Which residues of DIAP1, Spn-F and Nuf are phosphorylated by Ik2, and is there a shared
    substrate motif with the mammalian TBK1/IKBKE phospho-sites on Rab11-FIP3?
- question: Does dTBK1 act on Relish, IKKbeta or dSTING itself in the enterocyte antiviral pathway, i.e.
    which substrate links it to NF-kappaB-dependent antiviral gene expression in a lineage without IRFs?
suggested_experiments:
- description: In vitro kinase assays with recombinant Ik2 and dSTING, IKKbeta and Relish, combined with
    phospho-site mutant rescue in enterocyte-specific dTBK1 knockdown flies, to identify the antiviral
    substrate of dTBK1.
