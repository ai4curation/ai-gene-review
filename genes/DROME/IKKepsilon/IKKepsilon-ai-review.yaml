id: Q9V3Y8
gene_symbol: IKKepsilon
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: IKKepsilon (Ik2, dTBK1) is the single Drosophila member of the TBK1/IKK-epsilon branch of
  the IKK kinase family, a 720-residue cytoplasmic serine/threonine protein kinase with an N-terminal kinase
  domain followed by ubiquitin-like and coiled-coil scaffold domains. It is activated locally at the distal
  tip of growing mechanosensory bristles, where the adaptor Spindle-F links it to dynein and retains it.
  There it phosphorylates Spn-F and Nuclear fallout, the Rab11/dynein adaptor, controlling the shuttling
  of recycling endosomes, and it regulates F-actin and microtubule organization needed for polarized cell
  elongation of bristles, arista laterals and tracheal terminal cells. It also phosphorylates DIAP1 and
  promotes its degradation, setting the threshold of nonapoptotic caspase activity during sensory organ
  development. Further roles in oocyte cytoskeletal polarity and in local severing of sensory neuron dendrites
  during pruning have been shown. In intestinal enterocytes dTBK1 is required for cyclic-dinucleotide/dSTING-dependent
  antiviral protection and induced antiviral gene expression, a conserved innate immune function of the
  TBK1 clade.
