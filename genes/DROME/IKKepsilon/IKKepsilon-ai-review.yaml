  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1929658
  - PANTHER:PTN000540338
  - UniProtKB:Q14164
  - UniProtKB:Q9UHD2
  review:
    action: REMOVE
    summary: Taxon-incompatible propagation; Drosophila has no type I interferons, so the fly kinase cannot
      positively regulate their production.
    reason: This IBA comes from PAINT node PTN000540338, placed at Bilateria, but every IBD seed for this
      term is vertebrate (human TBK1 Q9UHD2, human IKBKE Q14164, mouse Ikbke); fly IKKepsilon is a seed
      for activation of innate immune response at the same node but not for this term. Type I interferons
      and IRF3/IRF7 are vertebrate innovations, and flies are described as devoid of interferons (PMID:30119996).
      The process therefore cannot occur in Drosophila, so this is a lineage-specific function propagated
      too deep in the tree. The conserved antiviral role of dTBK1 is retained through GO:0002218, GO:0140374
      and GO:0140896.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000540338
        source_label: TBK1/IKBKE clade node (Bilateria)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: All IBD seeds for GO:0032481 at this node are vertebrate (UniProtKB:Q9UHD2, UniProtKB:Q14164,
          MGI:MGI:1929658); fly IKKepsilon seeds only GO:0002218 here. Type I interferon production is vertebrate-restricted
          and absent from Drosophila.
