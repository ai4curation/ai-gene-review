  review:
    action: KEEP_AS_NON_CORE
    summary: ik2 mutants disrupt bristle microtubule organization; Ik2 acts as a regulator rather than a
      microtubule-bundling component.
    reason: The mutant phenotype (PMID:19917727) shows that Ik2 is required for the polarized organization
      of bristle shaft microtubules, so the annotation is supported by target-specific genetics. Ik2 is a
      kinase that acts at the bristle tip through Spn-F and recycling-endosome traffic; it is not itself
      a microtubule-binding or bundling protein. Its mechanistic contribution is better represented by the
      accepted regulation of cytoskeleton organization (GO:0051493) and endocytic recycling annotations,
      so this row is retained as non-core.
