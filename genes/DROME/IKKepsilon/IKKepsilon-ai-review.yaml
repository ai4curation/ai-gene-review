  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Induced antiviral gene expression is a downstream output of dSTING signalling, already covered
      by the accepted pathway and antiviral response terms.
    reason: c-di-GMP-induced srg3 expression is dTBK1-dependent (PMID:34965418), so the claim is not false.
      However, the kinase does not act directly on gene expression; the transcriptional output is executed
      downstream by NF-kappaB factors. Positive regulation of gene expression is a broad, indirect consequence
