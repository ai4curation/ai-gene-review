      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: kinase that targets DIAP1 for degradation, regulates
      Nuf, and acts in bristle morphogenesis, oocyte polarity and dendrite development.
      Omits the recycling-endosome/Spn-F mechanism and the dSTING antiviral role.'
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity and small GTPase binding
    activity. Involved in several processes, including cell maturation; cytoskeleton
    organization; and sensory organ development. Located in cell tip and cytoplasm.
    Human ortholog(s) of this gene implicated in brain disease; frontotemporal dementia
    and/or amyotrophic lateral sclerosis 4; and vasculitis. Orthologous to human TBK1
    (TANK binding kinase 1) and IKBKE (inhibitor of nuclear factor kappa B kinase
    subunit epsilon).
  source_type: automated
  url: https://flybase.org/reports/IKKε.html
