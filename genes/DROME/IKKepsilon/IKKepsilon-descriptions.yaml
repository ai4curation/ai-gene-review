    dementia and/or amyotrophic lateral sclerosis 4. Orthologous to human TBK1 (TANK
    binding kinase 1) and IKBKE (inhibitor of nuclear factor kappa B kinase subunit
    epsilon). [provided by Alliance of Genome Resources, Jul 2025]
