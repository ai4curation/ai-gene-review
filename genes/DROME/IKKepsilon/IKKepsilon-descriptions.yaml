descriptions:
- source: Alliance_Imported
  text: I-kappaB kinase &egr; (IKK&egr;) encodes a serine-threonine kinase that targets
    the inhibitor of apoptosis encoded by Diap1 for degradation. It also negatively
    regulates protein kinase C and the dynein adaptor encoded nuf. The product of
    IKK&egr; contributes to the specification of bristle cells, bristle cell morphogenesis,
    oocyte polarity, and dendrite development.
  source_type: curated
  url: https://flybase.org/reports/IKKε.html
  source_id: FB:FBgn0086657
  review:
    reviewer: AI
    rubrics:
