- description: As the SNX5/6 (Vps17-like) partner of Snx1 in the SNX-BAR retromer subcomplex, Snx6 binds
    endosomal phosphoinositides and helps tubulate early endosome membranes for retrieval of cargo to
    the trans-Golgi network, supporting lysosomal function.
