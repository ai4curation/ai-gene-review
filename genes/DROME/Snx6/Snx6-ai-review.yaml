gene_symbol: Snx6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Snx6 (CG8282) is the Drosophila ortholog of the SNX-BAR sorting nexins SNX5/SNX6 and the
  functional counterpart of yeast Vps17. It has a PX phosphoinositide-binding domain and a BAR domain
  and partners with Snx1 (SNX1/2 ortholog) to form the SNX-BAR membrane-remodelling subcomplex of retromer
  on early endosomes, which tubulates endosomal membranes for cargo retrieval to the trans-Golgi network.
  In the larval fat body Snx6, like Vps26, Vps35 and Snx3, is required for proper autolysosomal degradation,
  consistent with a role in retromer-dependent maintenance of lysosomal function. Snx6 null flies are
  viable and fertile, and Snx6 is not required for Wntless recycling or Wingless secretion, which depend
  on Snx3-retromer.
