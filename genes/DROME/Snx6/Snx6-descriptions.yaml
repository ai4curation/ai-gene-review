descriptions:
- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol-3-phosphate binding activity. Predicted
    to be involved in phagosome-lysosome fusion involved in apoptotic cell clearance
    and retrograde transport, endosome to Golgi. Predicted to be located in endosome.
    Predicted to be part of retromer, tubulation complex. Is expressed in adult head;
    adult heart; embryonic/larval garland cell; and garland cell primordium. Orthologous
    to several human genes including SNX32 (sorting nexin 32) and SNX6 (sorting nexin
    6).
  source_type: automated
