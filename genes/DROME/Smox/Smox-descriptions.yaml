- source: Alliance_Imported
  text: Smad on X (Smox) encodes the primary transcription factor that mediates Activin
    signalling. Upon phosphorylation by the receptor encoded by babo, it forms a complex
    with the co-Smad protein encoded by Med. This complex translocates to the nucleus
    where it regulates expression of target genes.
