descriptions:
- source: UniProt
  text: Receptor-regulated SMAD (R-SMAD) involved in the activin-like TGF-beta pathway
    (PubMed:10320478). Acts downstream of the type I transmembrane receptor serine/threonine
    kinase babo (PubMed:10320478). Competitively regulates phosphorylation of Mad,
    the R-SMAD of the BMP signaling pathway, by babo (PubMed:22563507). Heterodimerizes
    with the Co-SMAD Med/medea upon activation of the activin pathway and translocates
    to the nucleus, where it transcriptionally activates activin-responsive genes
    (PubMed:10320478). Involved in axonal and dendritic pruning and neural remodeling
    of mushroom body gamma neurons during metamorphosis, probably through regulating
    expression of the ecdysteroid receptor EcR (PubMed:12581521). Involved in differentiation
    of dorsal cluster and ellipsoid body adult-specific neurons prior to metamorphosis
    (PubMed:16437159). Required for axon guidance or outgrowth of ISNb and SNa axons
    (PubMed:17119022). Involved in regulation of wing imaginal disc growth (PubMed:18820452).
    Signaling by daw or myo is involved in lifespan determination through regulation
    of proteasome-mediated degradation of misfolded or damaged proteins (PubMed:29615416).
  source_type: curated
