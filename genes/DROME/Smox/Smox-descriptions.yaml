- source: Alliance_Automated
  text: Enables chromatin DNA binding activity. Involved in several processes, including
    cell surface receptor protein serine/threonine kinase signaling pathway; imaginal
    disc development; and nervous system development. Acts upstream of with a positive
    effect on determination of adult lifespan. Located in cytosol and nucleus. Part
    of heteromeric SMAD protein complex. Is expressed in several structures, including
    embryonic anal pad; embryonic/larval midgut; ganglia; germline cell; and larval
    muscle cell. Human ortholog(s) of this gene implicated in Loeys-Dietz syndrome
    (multiple); Lynch syndrome; congenital heart disease; female reproductive organ
    cancer (multiple); and pancreatic cancer. Orthologous to human SMAD2 (SMAD family
    member 2) and SMAD3 (SMAD family member 3).
