id: O96660
gene_symbol: Smox
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Smox is the Drosophila receptor-regulated Smad of the activin-family signaling branch. Activated
  Baboon phosphorylates its C-terminal motif, enabling association with the co-Smad Medea and nuclear
  transcriptional responses. Smox binds regulatory DNA through its MH1 domain and can activate or repress
  target genes depending on the promoter and cellular context. It controls growth, neuronal remodeling
  and differentiation, synaptic physiology and metabolic responses; in muscle it can repress Atg8a and
  autophagy. Smox also limits conditional Baboon-to-Mad cross-talk, helping separate activin and BMP outputs.'
