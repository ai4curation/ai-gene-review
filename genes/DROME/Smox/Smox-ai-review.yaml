- term:
    id: GO:0042592
    label: homeostatic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027526
  review:
    summary: A defined homeostatic output is glucose homeostasis.
    action: MODIFY
    reason: The broad homeostatic-process claim is refined to the experimentally annotated
      glucose-balance output. This does not assign metabolic enzyme activity to Smox.
    supported_by:
    - reference_id: PMID:28178568
      supporting_text: Activin-β (Actβ), an activin ligand predominantly produced in the
        enteroendocrine cells (EEs) of the midgut, is upregulated by chronic high-sugar diet and
        signals through Babo to promote AKH action in the fat body, leading to hyperglycemia.
    proposed_replacement_terms:
    - id: GO:0042593
      label: glucose homeostasis
- term:
    id: GO:0042593
    label: glucose homeostasis
  evidence_type: IMP
  original_reference_id: PMID:28178568
  qualifier: involved_in
  review:
    summary: Smox-dependent activin signaling contributes to glycemic regulation.
    action: KEEP_AS_NON_CORE
    reason: The full metabolic study places Smox in the Babo/Punt pathway controlling AKH response.
      It is a regulated endocrine transcriptional output rather than glucose sensing or metabolism
      by Smox itself.
    supported_by:
    - reference_id: PMID:28178568
      supporting_text: Activin-β (Actβ), an activin ligand predominantly produced in the
        enteroendocrine cells (EEs) of the midgut, is upregulated by chronic high-sugar diet and
        signals through Babo to promote AKH action in the fat body, leading to hyperglycemia.
- term:
    id: GO:0044719
    label: regulation of imaginal disc-derived wing size
  evidence_type: IMP
  original_reference_id: PMID:23485686
  qualifier: involved_in
  review:
    summary: Smox regulates imaginal-disc-derived wing size.
    action: KEEP_AS_NON_CORE
    reason: Loss of Smox reduces wing growth and can additionally alter BMP-patterning outputs. This
      tissue-specific size-regulation annotation is supported without conflating it with a universal
      growth effect.
    supported_by:
    - reference_id: PMID:23485686
      supporting_text: Although loss of either babo or Smad2 expression reduce growth in the wing
        blade in a similar manner, loss of Smad2 can also cause phenotypes related to ectopic BMP
        signalling, suggesting a physiological role for this transducer in the regulation of Mad
        spatial activation.
- term:
    id: GO:0045464
    label: R8 cell fate specification
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00095238
  review:
    summary: Smox controls the activin contribution to R8 subtype specification.
    action: KEEP_AS_NON_CORE
    reason: The retinal study directly positions Smox downstream of Babo and in parallel with
      Mad-dependent BMP signaling. This is a specific terminal cell-fate output, retained
      consistently across evidence types.
    supported_by:
    - reference_id: PMID:28853393
      supporting_text: We find that the Activin receptor Baboon is required in R8 to receive
        non-redundant signaling from the three Activin ligands, activating the transcription factor
        dSmad2.
