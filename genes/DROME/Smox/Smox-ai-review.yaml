  title: Curated UniProt record for Drosophila Smox
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only curated functional, location or sequence-feature statements are used; not GO
      lines, names, protein-existence levels or ARBA-only predictions.
  findings:
  - statement: Smox occupies the soluble cytoplasmic compartment before or alongside nuclear
      signaling.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: Translocates from the cytoplasm to the nucleus upon activation of a receptor
      serine/threonine kinase complex composed of babo and punt
  - statement: Smox participates in motoneuron axon guidance.
    record_section: ["CC:FUNCTION"]
    supporting_text: Required for axon guidance or outgrowth of ISNb and SNa axons
      (PubMed:17119022).
  - statement: Adult Smox signaling affects lifespan in a tissue- and sex-dependent manner.
    record_section: ["CC:DISRUPTION PHENOTYPE"]
    supporting_text: Conditional ubiquitous or muscle specific RNAi-mediated knock down in adult
      flies reduces lifespan by 3 to 10 days in females, but not in males (PubMed:29615416).
  - statement: Smox influences wing cell proliferation and receptor cross-talk.
    record_section: ["CC:FUNCTION"]
    supporting_text: Competitively regulates phosphorylation of Mad, the R-SMAD of the BMP signaling
      pathway, by babo (PubMed:22563507).
