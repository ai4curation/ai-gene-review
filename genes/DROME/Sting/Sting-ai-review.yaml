proposed_new_terms: []
suggested_questions:
- question: >-
    Does dSTING physically nucleate the Relish/IMD signaling complex (e.g. via its cryptic RHIM
    motif and interaction with IMD), and could a more informative molecular-function term for a
    signaling-adapter/scaffold activity be assigned in addition to the cyclic-dinucleotide binding
    activities?
- question: >-
    Is the autophagy-promoting activity of dSTING mechanistically the same ERGIC/LC3-lipidation
    process as mammalian STING, or does the fly use a distinct route? This bears on whether the
    inherited autophagosome/reticulophagy annotations should be upgraded to experimental or remain
    inherited/non-core.
suggested_experiments:
- description: >-
    Quantitative CDN-binding and dSTING-activation assays (e.g. thermophoresis/ITC plus reporter
    activation) comparing 3'2'-cGAMP, 2'3'-cGAMP, c-di-GMP and 2'3'-c-di-GMP to define the in vivo
    ligand hierarchy and the residues responsible for isomer selectivity.
- description: >-
    Tissue-resolved epistasis (enterocyte, fat body, brain) placing dSTING relative to dIKKbeta,
    Relish and dTBK1 to map which downstream branch (AMP induction, Nazo/antiviral genes, autophagy)
    dominates in each context.
