- term:
    id: GO:0032481
    label: positive regulation of type I interferon production
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR029158
  review:
    summary: >-
      InterPro2GO electronic mapping from the STING domain (IPR029158) to type I interferon
      production. This is taxonomically inappropriate for Drosophila, which has no type I
      interferons and no TBK1-IRF3-IFN axis; dSTING instead signals to NF-kappaB (Relish).
    action: REMOVE
    reason: >-
      Insects lack type I interferons entirely, so dSTING cannot regulate their production. Every
      experimental study of dSTING shows an NF-kappaB (Relish)-dependent, interferon-independent
      output; the authors explicitly note that this antiviral program predates the emergence of
      interferons in vertebrates. This is a demonstrably wrong over-propagated electronic mapping
      that should be removed on biological/taxonomic grounds.
    supported_by:
