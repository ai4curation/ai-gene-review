- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1919762
  - PANTHER:PTN005046674
  - UniProtKB:Q86WV6
  review:
    summary: >-
      Phylogenetic (IBA) transfer of the ancestral STING autophagy function. dSTING does induce
      autophagy in a physiological context (Zika virus in the brain), but the specific
      autophagosome-assembly step reflects the mammalian STING/ERGIC-LC3 mechanism rather than a
      fly-specific demonstration; kept as a non-core, inherited annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD node placement is sound - dSTING falls within the STING clade that has an autophagy
      role, and Drosophila dSTING does drive autophagy against Zika virus. However, autophagy is a
      context-specific, non-core function for dSTING relative to its central cyclic-dinucleotide
      sensing / NF-kappaB (Relish) signaling role, and the precise assembly step is not directly
      demonstrated in the fly.
    supported_by:
    - reference_id: PMID:29934091
      supporting_text: inducing autophagy in the brain.
