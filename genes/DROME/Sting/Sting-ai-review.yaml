id: A0A0B4LFY9
gene_symbol: Sting
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Drosophila Sting (dSTING, CG1667) is the single fly ortholog of the STING family and a
  multi-pass endoplasmic reticulum membrane protein that acts as an innate-immune signaling
  adapter. It directly binds cyclic dinucleotides - bacterial cyclic di-GMP and the
  virus-induced cyclic GMP-AMP isomers 3'2'-cGAMP (its preferred ligand) and 2'3'-cGAMP that
  are synthesized by the cGAS-like receptors cGLR1 and cGLR2 in response to RNA/DNA virus
  infection. Ligand binding drives dSTING oligomerization (via a cryptic RHIM motif) and
  activation of the NF-kappaB transcription factor Relish through the IMD pathway kinase
  dIKKbeta. Because insects lack type I interferons and the TBK1-IRF3-IFN axis, dSTING signals
  to NF-kappaB rather than to interferon, inducing antimicrobial peptides and antiviral genes.
  It mediates defense against bacteria (Listeria monocytogenes, Coxiella burnetii) and a broad
  range of viruses, and in the adult brain restricts Zika virus by inducing autophagy.
