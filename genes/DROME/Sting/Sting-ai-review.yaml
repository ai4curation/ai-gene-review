    Binds virus-induced cyclic GMP-AMP dinucleotides, with a strong preference for the cGLR1
    product 3'2'-cGAMP, as the ligand-recognition event that activates dSTING signaling. Structural
    and biochemical data define the isomer-selective binding site.
