descriptions:
- source: UniProt
  text: 'Facilitator of innate immune signaling that binds cyclic dinucleotides produced
    in response to infection by bacteria and/or viruses, and promotes the activation
    of the NF-kappa-B transcription factor Rel (Relish) (PubMed:29924997, PubMed:29934091,
    PubMed:30119996, PubMed:33262294, PubMed:34261127, PubMed:34261128). Recognizes
    and binds cyclic di-GMP (c-di-GMP), a cyclic dinucleotide messenger produced by
    bacteria such as L.monocytogenes, leading to activation of the peptidoglycan recognition
    protein (IMD) signaling pathway and activation of Rel (Relish) (PubMed:29924997).
    Innate immune response is triggered in response to double-stranded RNA from viruses
    delivered to the cytoplasm: Sting acts by specifically binding cyclic dinucleotides
    3'',2''-cGAMP and 2'',3''-cGAMP produced by cGlr1 and cGlr2 in response to RNA
    virus in the cytosol (PubMed:34261127, PubMed:34261128). Has a strong preference
    for 3'',2''-cGAMP compared to other cyclic dinucleotides such as 2'',3''-cGAMP
    or 3''3''-c-di-GMP (PubMed:34261127). Upon binding to 3'',2''-cGAMP, activates
    an antiviral immune response, leading to the activation of Rel (Relish) (PubMed:34261127,
    PubMed:34261128). Activated in brain in response to Zika virus infection, leading
    to autophagy (PubMed:29934091).'
