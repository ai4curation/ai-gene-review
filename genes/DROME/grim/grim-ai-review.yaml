id: Q24570
gene_symbol: grim
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'grim encodes a short Drosophila Reaper/Hid/Grim-family IAP antagonist that promotes apoptotic
  caspase activation. Grim binds BIR domains of DIAP1/DIAP2-family IAPs through its N-terminal IAP-binding
  motif, countering IAP restraint of DrICE-family caspases, and also uses an internal GH3 amphipathic
  helix to associate with mitochondria and remodel cytochrome-c distribution during apoptosis induction
  in selected developmental cell-death programs.'
