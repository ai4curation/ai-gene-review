suggested_questions:
- question: Should GO provide a molecular-function term for the Grim/Reaper/Sickle GH3-side 
    mitochondrial effector activity, so this domain is not represented only by broad apoptotic 
    mitochondrial changes process terms?
- question: Which endogenous Drosophila death contexts require Grim-DIAP2 binding in addition to 
    canonical DIAP1 antagonism, given that DIAP2 is primarily curated as a drICE threshold regulator
    and Imd-pathway ubiquitin ligase?
suggested_experiments:
- description: Use endogenous grim rescue transgenes carrying separable IAP-binding-motif and GH3 
    mutations to quantify which developmental death events require BIR-domain binding, mitochondrial
    association, or both domains.
- description: Image tagged Grim at endogenous expression levels with DIAP1, DIAP2, active DrICE, 
    and mitochondrial markers to distinguish cytosolic, nuclear, and mitochondrial pools across 
    cells that die versus survive.
