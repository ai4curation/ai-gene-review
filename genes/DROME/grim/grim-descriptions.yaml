    overall_notes: 'Correct: IAP antagonist inducing apoptosis in the CNS, including
      juvenile neurons at metamorphosis. No DIAP1 named.'
- source: Alliance_Automated
  text: Enables protein homodimerization activity. Involved in several processes,
    including determination of adult lifespan; melanization defense response; and
    positive regulation of release of cytochrome c from mitochondria. Located in mitochondrial
    matrix; nucleus; and plasma membrane. Is expressed in several structures, including
    Malpighian tubule; anlage in statu nascendi; anterior endoderm anlage; central
    brain anlage in statu nascendi; and ganglia. Used to study Alzheimer's disease
    1.
