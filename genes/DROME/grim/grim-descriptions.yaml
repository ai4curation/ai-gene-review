- source: Alliance_Imported
  text: grim (grim) encodes a member of the inhibitor of apoptotic protein antagonists.
    In response to death signals, it induces apoptosis of cells in the central nervous
    system. It is important particularly for the apoptosis of specific juvenile neurons
    during metamorphosis.
  source_type: curated
  url: https://flybase.org/reports/grim.html
