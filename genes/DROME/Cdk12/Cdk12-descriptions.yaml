- source: Alliance_Automated
  text: Enables RNA polymerase II CTD heptapeptide repeat kinase activity; cyclin
    binding activity; and protein sequestering activity. Involved in RNAi-mediated
    antiviral immunity against RNA virus; positive regulation of transcription elongation
    by RNA polymerase II; and transcription by RNA polymerase II. Located in nuclear
    chromosome and polytene chromosome puff. Part of cyclin K-CDK12 complex and nuclear
    cyclin-dependent protein kinase holoenzyme complex. Is active in cytosol. Human
    ortholog(s) of this gene implicated in congenital heart defects, dysmorphic facial
    features, and intellectual developmental disorder; hepatocellular carcinoma; intellectual
    disability; and prostate carcinoma. Orthologous to several human genes including
    CDK13 (cyclin dependent kinase 13).
