suggested_questions:
- question: Does Drosophila Cdk12, as the single CDK12/CDK13 ortholog, combine the CDK12-like role in
    long-gene and DNA-damage-response gene expression with CDK13-like functions?
suggested_experiments:
- description: Analog-sensitive Cdk12 allele in flies to measure acute effects on Ser2 phosphorylation,
    elongation rate and intronic polyadenylation genome-wide.
