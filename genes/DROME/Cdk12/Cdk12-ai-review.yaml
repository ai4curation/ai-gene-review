id: Q9VP22
gene_symbol: Cdk12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cdk12 (CG7597) is the single Drosophila ortholog of human CDK12/CDK13 and yeast Ctk1, a cyclin-dependent
  protein kinase that with its partner cyclin K forms the elongation-phase RNA polymerase II CTD kinase.
  dCDK12 colocalizes with hyperphosphorylated, elongating Pol II on polytene chromosomes, is enriched
  in the bodies and 3' ends of active genes, phosphorylates the CTD in vitro and is required for CTD Ser2
  phosphorylation in cells. It contributes to expression of long and signaling-related transcripts such
  as mapk in RAS/MAPK signaling, and in S2 cells a cytoplasmic pool binds the Flock House virus RNAi suppressor
  B2 and counteracts its suppression of antiviral RNAi.
