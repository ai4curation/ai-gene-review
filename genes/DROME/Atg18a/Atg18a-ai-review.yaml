  review:
    summary: IBA from the PROPPIN family root, seeded only by the three yeast PROPPINs (Atg18, Atg21, Hsv2).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Nucleophagy was defined in yeast, where it runs through yeast-specific routes: piecemeal microautophagy
      of the nucleus at nucleus-vacuole junctions and Atg39-receptor-dependent macronucleophagy. All three seeds
      are yeast proteins, and placing the IBD at the family root extends the process to every metazoan PROPPIN.
      No nucleophagy of any kind has been described in Drosophila (PubMed nucleophagy[tiab] AND Drosophila[tiab]
      returned one unrelated toxicity study, 2026-11-16), so there is no fly process for Atg18a to inherit a role
      in. Not impossible if fly cells degrade nuclear material by macroautophagy, but unsupported; over-annotation.'
