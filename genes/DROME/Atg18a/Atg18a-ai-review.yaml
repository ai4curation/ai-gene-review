suggested_questions:
- question: Which fly PROPPIN partners Atg2 in phagophore expansion? Atg2 co-immunoprecipitates more efficiently
    with Atg18b (CG8678) than with Atg18a, Atg2 is not needed for Atg8a puncta while Atg18a is, and in mammals the
    main ATG2 partner is WIPI4 (fly CG11975).
- question: Does Atg18a recruit Atg16 (and so the Atg12-Atg5-Atg16 conjugation machinery) to phagophores, as WIPI2b
    recruits ATG16L1 in mammals? This would explain why Atg8a puncta fail to form without Atg18a.
- question: Is Atg18a required for pexophagy in Drosophila tissues where it occurs (for example under iron chelation
    or Hsc70-5 depletion)?
- question: Do the PAINT IBA rows placed at the PROPPIN family root (PTN000132136) also propagate yeast-only processes
    such as nucleophagy to Atg18b and CG11975, which have no demonstrated autophagy role?
suggested_experiments:
- experiment_type: Separation-of-function rescue
  description: Rescue Atg18a null mutants with Atg18a carrying LRRG-to-LTTG (phosphoinositide-binding) substitutions
    or Atg9-binding-surface mutations, and score Atg8a puncta, Atg9 recruitment to Ref(2)P aggregates, Ref(2)P clearance
    and viability.
  hypothesis: PI3P binding and Atg9 binding are both needed for Atg18a's early role in phagophore formation.
- experiment_type: In vitro lipid binding
  description: Measure binding of purified fly Atg18a, Atg18b and CG11975 to PI3P- and PI(3,5)P2-containing liposomes
    and lipid arrays.
  hypothesis: All three fly PROPPINs bind PI3P; Atg18a also binds PI(3,5)P2, as its pharmacology at synapses suggests.
- experiment_type: Pexophagy reporter genetics
  description: Express the pexo-QC or Keima-SKL reporter (PMID:39904371) with Atg18a, Atg18b or CG11975 RNAi under
    deferiprone or Hsc70-5 depletion.
  hypothesis: Pexophagy in the fly requires Atg18a but not Atg18b or CG11975.
