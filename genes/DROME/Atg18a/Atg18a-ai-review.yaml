  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'One sentence. The role in autophagy is verified (PMID:24374083, PMID:22952930 and others). The
      claim that Atg18a acts by "participating in isolation membrane elongation around cytoplasmic cargoes" could
      not be traced to any Drosophila study (PubMed searches recorded in the notes file): it matches the yeast and
      mammalian Atg2-Atg18 model of phagophore expansion. The fly data place Atg18a earlier, at Atg9 delivery to
      the phagophore assembly site and at Atg8a puncta formation, a step Atg2 is not needed for in the fly (PMID:24374083),
      so the elongation wording is unconfirmed rather than shown wrong. "Regulates autophagy" understates a core
      component of the autophagosome-forming machinery but is not wrong. The text omits PI3P binding and the phagophore
      assembly site location.'
