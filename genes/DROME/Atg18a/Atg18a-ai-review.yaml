  label: Drosophila melanogaster
description: 'Atg18a (CG7986) is the Drosophila WIPI1/WIPI2-type member of the PROPPIN (Atg18/WIPI) family, a soluble
  seven-bladed WD40 beta-propeller that binds phosphatidylinositol 3-phosphate through a conserved LRRG motif and
  is recruited from the cytoplasm to phagophore membranes at the phagophore assembly site. It acts at an early step
  of autophagosome formation: it binds Atg9 and is needed for Atg9 to reach the assembly site, it is needed for
  Atg8a-positive phagophores to form (unlike Atg2), it can bridge Atg9 to the Ref(2)P/p62 cargo receptor, and it
  binds the mitophagy receptor BNIP3. Accordingly, Atg18a is required for starvation-induced autophagy in the fat
  body and for selective autophagy of protein aggregates, mitochondria and glycogen, and through these for autophagy-dependent
  midgut programmed cell death, T-tubule remodelling in muscle, antiviral defence against VSV and RVFV, and mitochondrial
  integrity in heart and flight muscle. At synapses it decorates nascent autophagosomes in a PI3P- and PI(3,5)P2-dependent
  manner and is removed by the synaptojanin SAC1 phosphatase. Null mutants are lethal. A second WIPI1/2-like paralog,
  Atg18b (CG8678), and the WIPI3/4-like CG11975 have no established roles.'
