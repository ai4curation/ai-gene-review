findings:
- category: discrepancy
  text: FlyBase says Atg18a acts by participating in isolation membrane elongation; fly data
    place it earlier, as required for Atg9 recruitment to the phagophore assembly site and for
    Atg8a puncta formation, a step Atg2 is not needed for. The elongation role is the yeast
    and mammalian Atg2-Atg18 model and has not been tested in the fly.
  sources:
  - Alliance_Imported
- category: gap
  text: No source mentions that Atg18a binds Atg9 and the cargo receptors Ref(2)P and BNIP3,
    or that it is needed for selective autophagy of mitochondria, protein aggregates and glycogen.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: The FlyBase text omits PI3P binding and PROPPIN/WIPI family membership, which the automated
    text gives as predictions.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: Both texts place Atg18a in macroautophagy and agree with the review; the curated
    text is brief and frames the mechanism by the yeast elongation model, the automated text
    lists true predicted activities and downstream processes.
