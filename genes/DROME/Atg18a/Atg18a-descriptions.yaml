descriptions:
- source: Alliance_Imported
  text: Autophagy-related 18a (Atg18a) encodes a protein that regulates autophagy by participating
    in isolation membrane elongation around cytoplasmic cargoes.
  source_type: curated
  url: https://flybase.org/reports/Atg18a.html
  source_id: FB:FBgn0035850
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Correctly places Atg18a in autophagy, but "regulates autophagy" undersells
      a core autophagosome-forming component, and the specific claim of a role in isolation
      membrane elongation is not traced to fly data, which put Atg18a upstream at Atg9 delivery
      to the phagophore assembly site and Atg8a puncta formation. No mention of PI3P binding,
      the PROPPIN/WIPI family or the selective autophagy roles.
- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol-3,5-bisphosphate binding activity; phosphatidylinositol-3-phosphate
    binding activity; and protein-macromolecule adaptor activity. Involved in several processes,
    including T-tubule organization; larval midgut cell programmed cell death; and macroautophagy.
    Located in autophagosome. Is expressed in several structures, including adult head; anlage
    in statu nascendi; antennal anlage; central brain anlage; and central brain anlage in statu
    nascendi. Human ortholog(s) of this gene implicated in musculoskeletal system disease. Orthologous
    to several human genes including WIPI2 (WD repeat domain, phosphoinositide interacting 2).
