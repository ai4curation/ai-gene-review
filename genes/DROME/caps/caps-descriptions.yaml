descriptions:
- source: Alliance_Imported
  text: capricious (caps) encodes a transmembrane receptor with leucine-rich repeats
    that mediates cell interaction in a homophilic or heterophilic manner. caps product
    contributes to cellular interaction critical for synapse formation and axon guidance,
    as well as mediating morphogenesis of multiple tissues, including wings, legs
    and the tracheal system.
  source_type: curated
  url: https://flybase.org/reports/caps.html
  source_id: FB:FBgn0023095
