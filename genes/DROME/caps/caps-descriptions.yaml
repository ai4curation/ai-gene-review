      score: 3
    overall_notes: 'Correct: LRR transmembrane adhesion receptor, homophilic or heterophilic,
      in synapse formation, axon guidance and wing, leg and tracheal morphogenesis.
      Does not name the motor neuron-muscle matching mechanism, myopodia or the Tartan
      paralog.'
- source: Alliance_Automated
  text: Involved in several processes, including axon guidance; branch fusion, open
    tracheal system; and homophilic cell-cell adhesion. Located in muscle cell projection.
    Colocalizes with cytoneme. Is expressed in several structures, including antennal
    lobe glomerulus; embryonic/larval motor neurons; gut section; larval somatic muscle
    cell; and organism subdivision. Orthologous to human LRRN2 (leucine rich repeat
    neuronal 2).
  source_type: automated
