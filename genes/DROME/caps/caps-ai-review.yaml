proposed_new_terms: []
suggested_questions:
- question: >-
    Does Caps have an obligate heterophilic binding partner (a dedicated receptor/ligand) in
    addition to its homophilic activity, and is this the "common receptor" shared with Tartan?
- question: >-
    Does the Caps cytoplasmic tail transduce an intracellular signal (e.g. during target
    recognition or tracheal outgrowth), or does it act mainly by regulating adhesion/localization?
suggested_experiments:
- description: >-
    Biochemically identify in vivo Caps binding partners (e.g. by proximity labeling or affinity
    purification from neural/tracheal tissue) to test homophilic versus heterophilic engagement and
    the proposed shared Caps/Trn receptor.
- description: >-
    Structure-guided separation-of-function alleles of the Caps ectodomain versus cytoplasmic tail,
    assayed across NMJ target selection, photoreceptor layer targeting, and tracheal branch fusion,
    to determine which activities require intracellular signaling.
