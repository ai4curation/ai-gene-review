- term:
    id: GO:0016477
    label: cell migration
  evidence_type: TAS
  original_reference_id: PMID:12508275
  qualifier: involved_in
  review:
    summary: >-
      Caps contributes to cell migration non-cell-autonomously: it is localized on the surface of
      mesodermal bridge-cells and instructs the outgrowth of dorsal trunk branch cells toward each
      other during tracheal network formation. This is a real but peripheral, context-specific role
      rather than a core function, so it is retained as non-core. The identical annotation
      (GO:0016477, TAS, PMID:12508275) is present in trn-goa.tsv and is adjudicated the same way in
      the trn review.
    action: KEEP_AS_NON_CORE
    reason: >-
      The general 'cell migration' term is supported by the concrete role of Capricious as an
      instructive bridge-cell cue for outgrowing tracheal branch cells; it captures a real but
      indirect and non-core aspect of caps function. The original TAS reference is a short commentary
      that does not itself discuss caps, so supporting evidence is drawn from the tracheal study
      instead. Kept consistent with the trn review, which handles the same GOA row identically.
    supported_by:
    - reference_id: PMID:16764850
      supporting_text: >-
        Capricious is specifically localized on the surface of bridge-cells and facilitates the
        outgrowing dorsal trunk cells of adjacent metameres toward each other.
    - reference_id: PMID:16764850
