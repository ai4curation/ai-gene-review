- term:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  evidence_type: IDA
  original_reference_id: PMID:16423695
  qualifier: enables
  review:
    summary: >-
      The GOA set contains no molecular-function annotation, yet Caps' central activity is
      cell-surface adhesion mediation: expression of Caps in otherwise non-adhesive S2 cells induces
      homophilic aggregation, demonstrating that Caps directly mediates cell-cell adhesion. Proposed
      as a NEW molecular-function annotation to capture the core activity underlying the many BP
      contexts (target recognition, boundary formation).
    action: NEW
    reason: >-
      Adds the missing core molecular function. Direct cell-aggregation assay (IDA) shows Caps
      mediates homophilic cell-cell adhesion; a specific MF term is more informative than the
      generic cell-adhesion BP terms alone.
    supported_by:
    - reference_id: PMID:16423695
      supporting_text: CAPS promotes homophilic cell adhesion in transfected S2 cells
