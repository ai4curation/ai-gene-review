gene_symbol: caps
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  capricious (caps; CG11282; FBgn0023095) is a Drosophila melanogaster single-pass type I
  transmembrane protein of the leucine-rich-repeat (LRR) cell-surface receptor class. Its
  extracellular region is built from a horseshoe-shaped LRR array (multiple LRR repeats plus an
  LRR C-terminal cap) followed by a single transmembrane helix and a cytoplasmic tail. Caps is the
  paralog of Tartan (Trn), with which it shares ~65% extracellular-domain identity and largely
  overlapping, partially redundant functions. Biochemically Caps behaves as a cell-surface
  adhesion/recognition molecule: it promotes homophilic cell adhesion in cultured cells and is also
  proposed to engage heterophilic partners. Its best-characterized role is as a target-recognition
  label in the nervous system, where reciprocal expression of Caps on motor neurons and their
  target muscles (and on photoreceptor axons and their recipient layers) directs selective synaptic
  matching; Caps concentrates at the tips of cellular projections such as myopodia (postsynaptic
  muscle filopodia) where initial neuromuscular contacts form. Beyond neural wiring, the same
  adhesion/recognition activity is deployed in tracheal dorsal-trunk branch fusion (Caps on
  mesodermal bridge cells), salivary-gland tubulogenesis, imaginal-disc compartment-affinity
  boundaries, and cytoneme-mediated signaling. Caps thus functions broadly as an LRR
  cell-adhesion molecule that confers cell-type-specific surface identity used for adhesion,
  boundary formation, and synaptic/axonal target selection.
existing_annotations:
- term:
    id: GO:0007416
    label: synapse assembly
  evidence_type: IMP
  original_reference_id: PMID:24386266
  qualifier: involved_in
  review:
    summary: >-
      Caps contributes to synapse formation only indirectly, through its target-recognition
      role. At the NMJ, caps (and caps trn) mutants have fewer myopodia-growth-cone contacts and
      reduced nascent synaptic sites (PMID:19270171). However, the cited visual-system study
      concluded that Caps is largely dispensable for synaptogenesis proper in R8 photoreceptors,
      distinguishing target recognition from synapse assembly. Keep as a non-core, downstream
      consequence of Caps-mediated partner matching rather than a core synapse-assembly activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotated function is real at the NMJ but secondary to Caps' core adhesion/recognition
      role, and the cited reference itself argues against a major direct synaptogenic role in the
      photoreceptor system. Better supported as non-core.
    supported_by:
    - reference_id: PMID:19270171
      supporting_text: The nascent synaptic sites of M12 were also reduced
    - reference_id: PMID:24386266
      supporting_text: Caps does not have a major role in synapse formation at specific sites in R8 photoreceptor axons
- term:
    id: GO:0036194
    label: muscle cell projection
  evidence_type: IDA
  original_reference_id: PMID:19270171
  qualifier: located_in
  review:
    summary: >-
      A Caps-GFP fusion expressed in muscle 12 accumulates at the tips of myopodia (the
      postsynaptic filopodia of body-wall muscles), directly documenting Caps localization to a
      muscle cell projection. This localization is mechanistically tied to Caps' function in
      sensing and stabilizing contacts with the correct presynaptic partner.
    action: ACCEPT
    reason: >-
      Direct imaging evidence (IDA) for Caps at myopodia, a muscle cell projection; the term
      accurately captures the observed subcellular localization.
    supported_by:
    - reference_id: PMID:19270171
      supporting_text: CAPS, expressed as a GFP-fusion protein in M12, accumulated at the tips of myopodia
- term:
    id: GO:0035230
    label: cytoneme
  evidence_type: IDA
  original_reference_id: PMID:24385607
  qualifier: colocalizes_with
  review:
    summary: >-
      In the tracheal air-sac primordium, a tracheally expressed Caps:GFP fusion is detected along
      cytonemes and concentrated at their tips, and caps is required for cytoneme-mediated Dpp
      reception. This supports colocalization of Caps with cytonemes, consistent with its general
      enrichment at the tips of cellular projections.
    action: ACCEPT
    reason: >-
      Direct fluorescence localization (IDA) of Caps:GFP to cytonemes; colocalizes_with qualifier
      is appropriate for an overexpressed reporter localization.
    supported_by:
    - reference_id: PMID:24385607
      supporting_text: Caps:GFP that was expressed in trachea was detected in ASP cytonemes, and concentrated at the tips
- term:
    id: GO:0007436
    label: larval salivary gland morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:19064711
  qualifier: involved_in
  review:
    summary: >-
      caps was recovered in a salivary-gland (fork head-GAL4) gain-of-function tubulogenesis screen,
      and gain- versus loss-of-function comparison implicates it in salivary gland morphogenesis.
      This is one of several tissue-specific developmental contexts in which Caps' adhesion/
      recognition activity is deployed, so it is retained as a non-core developmental role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported (IMP) developmental role, but peripheral to the core LRR
      adhesion/target-recognition function; appropriate to keep as non-core for this pleiotropic gene.
    supported_by:
    - reference_id: PMID:19064711
      supporting_text: The analysis of caps and tartan mutant phenotypes suggests a role for these genes in salivary gland morphogenesis
- term:
    id: GO:0007156
    label: homophilic cell-cell adhesion
  evidence_type: IDA
  original_reference_id: PMID:16423695
  qualifier: involved_in
  review:
    summary: >-
      Caps promotes homophilic cell adhesion when expressed in cultured S2 cells, providing direct
      biochemical/cell-based evidence for a homophilic adhesion activity. This is central to Caps'
      proposed mechanism as a layer-/target-specific cell adhesion molecule, although later work
      indicates that in vivo axon-target recognition is not exclusively homophilic.
    action: ACCEPT
    reason: >-
      Direct cell-aggregation assay (IDA) demonstrates homophilic adhesion; this captures a core
      molecular behavior of Caps.
    supported_by:
    - reference_id: PMID:16423695
      supporting_text: CAPS promotes homophilic cell adhesion in transfected S2 cells
- term:
    id: GO:0072499
    label: photoreceptor cell axon guidance
  evidence_type: IMP
  original_reference_id: PMID:16423695
  qualifier: involved_in
  review:
    summary: >-
      caps is reciprocally expressed in R8 axons and their target layer; caps loss causes local R8
      targeting errors and ectopic caps in R7 redirects R7 axons to the R8 recipient layer. A later
      reassessment found the endogenous requirement modest ("marginal role") and redundant, so this
      is a genuine but non-core, context-specific manifestation of Caps' target-recognition function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported (IMP) but a tissue-specific, low-penetrance/redundant instance of the
      broader target-recognition activity; better represented as non-core.
    supported_by:
    - reference_id: PMID:16423695
      supporting_text: caps loss-of-function mutations cause local targeting errors by R8 axons, including layer change
    - reference_id: PMID:24386266
      supporting_text: Caps has a marginal role in the guidance of R8 photoreceptor axons and is
        not redundant with Tartan.
- term:
    id: GO:0008045
    label: motor neuron axon guidance
  evidence_type: IMP
  original_reference_id: PMID:18817735
  qualifier: involved_in
  review:
    summary: >-
      Caps is expressed on subsets of body-wall muscles (including muscle 12) and functions with its
      paralog Trn in the guidance and target selection of ISNb/SNa motor axons; trn caps double
      mutants roughly double the ISNb/SNa guidance-defect penetrance relative to single mutants,
      showing a genuine (partially redundant) caps contribution. This is a core, well-characterized
      function of Caps.
    action: ACCEPT
    reason: >-
      Strong experimental support (IMP) for Caps in motor-axon guidance/targeting; represents the
      best-studied context of the gene's core recognition function.
    supported_by:
    - reference_id: PMID:18817735
