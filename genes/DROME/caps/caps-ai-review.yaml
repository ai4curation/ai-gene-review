- term:
    id: GO:0035147
    label: branch fusion, open tracheal system
  evidence_type: IMP
  original_reference_id: PMID:16764850
  qualifier: involved_in
  review:
    summary: >-
      Caps is displayed on mesodermal bridge-cells and instructs the outgrowing dorsal-trunk cells
      of adjacent tracheal metameres toward each other, contributing to branch interconnection/
      fusion; Caps requires both its extracellular and intracellular domains for this role. A
      tissue-specific developmental deployment of the adhesion/recognition activity, retained as
      non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally supported (IMP) developmental role in tracheal branch fusion, but a specialized
      context of the core surface-recognition function rather than the central activity itself.
    supported_by:
    - reference_id: PMID:16764850
      supporting_text: Capricious is specifically localized on the surface of bridge-cells and facilitates the outgrowing dorsal trunk cells of adjacent metameres toward each other
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: NAS
  original_reference_id: PMID:12717815
  qualifier: involved_in
  review:
    summary: >-
      Cell adhesion is a correct, if very general, description of Caps activity: Caps is an LRR
      cell-surface adhesion molecule that promotes homophilic adhesion (PMID:16423695) and is
      proposed to act as a homophilic/heterophilic adhesion receptor (PMID:19064711). The cited
      reference (an abstract-only wing-vein-development review) does not itself discuss caps, and a
      more specific term (homophilic cell-cell adhesion, GO:0007156) is already annotated. Keep as a
      broad, non-core parent.
    action: KEEP_AS_NON_CORE
    reason: >-
      The function is accurate but general and better captured by the specific homophilic adhesion
      annotation; the NAS reference is a review that does not directly support the caps claim, so
      this is retained only as a broad non-core term rather than accepted as a core annotation.
    supported_by:
    - reference_id: PMID:19064711
