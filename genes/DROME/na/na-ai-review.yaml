id: A8JUW5
gene_symbol: na
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: narrow abdomen (na) encodes the single Drosophila member of the NALCN family, a four-domain
  (24-transmembrane-segment) channel related to voltage-gated sodium and calcium channels. NA forms the
  pore of a voltage-insensitive sodium leak channel in the neuronal plasma membrane, in a complex with
  the large accessory proteins UNC79 and UNC80 and the Mid1/NALF-related protein Mid1; loss of any subunit
  reduces the levels of the others. In circadian pacemaker neurons NA carries a daytime sodium leak current
  that depolarizes the resting membrane potential and promotes firing, so na mutants are hyperpolarized
  and show weak circadian locomotor rhythms, an inverted light-dark activity profile, poor morning anticipation
  and reduced light-evoked activity. Mutants are also altered in sensitivity to volatile anesthetics such
  as halothane, and knockdown affects social clustering and larval gentle-touch responses.
