- term:
    id: GO:0042752
    label: regulation of circadian rhythm
  evidence_type: IMP
  original_reference_id: PMID:16364900
  qualifier: involved_in
  review:
    summary: na mutants have poor circadian rhythms and altered phase of behavior, with intact PERIOD
      oscillations.
    action: KEEP_AS_NON_CORE
    reason: NA acts downstream of the molecular clock (PER oscillations are intact), controlling the phase
      and rhythmicity of behavioral output. Regulation of circadian rhythm is acceptable in that output
      sense, but it is a systems-level consequence of neuronal excitability rather than the channel's
      core activity.
    supported_by:
    - reference_id: PMID:16364900
      supporting_text: These data implicate NA and the pacemaker neural network in controlling phase and
        rhythmicity.
      reference_section_type: ABSTRACT
