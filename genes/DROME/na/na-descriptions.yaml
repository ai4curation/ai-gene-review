- source: Alliance_Automated
  text: Enables monoatomic ion channel activity. Involved in several processes, including
    locomotor rhythm; response to anesthetic; and sensory perception of touch. Located
    in axon terminus and neuronal cell body. Part of cation channel complex. Is expressed
    in adult head; adult optic lobe; ellipsoid body; spermatozoon; and supraesophageal
    ganglion. Human ortholog(s) of this gene implicated in congenital limbs-face contractures-hypotonia-developmental
    delay syndrome. Orthologous to human NALCN (sodium leak channel, non-selective).
