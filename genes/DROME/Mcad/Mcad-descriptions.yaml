descriptions:
- source: UniProt
  text: Medium-chain specific acyl-CoA dehydrogenase that catalyzes the first step
    of mitochondrial fatty acid beta-oxidation, an aerobic process that breaks down
    fatty acids into acetyl-CoA and allows the production of energy from fats (PubMed:29563254).
    The first step of fatty acid beta-oxidation consists in the removal of one hydrogen
    from C-2 and C-3 of the straight-chain fatty acyl-CoA thioester, resulting in
    the formation of trans-2-enoyl-CoA (By similarity). Electron transfer flavoprotein
    (ETF) is the electron acceptor that transfers electrons to the main mitochondrial
    respiratory chain via ETF- ubiquinone oxidoreductase (ETF dehydrogenase) (By similarity).
    May contribute to Pink1-mediated regulation of fatty acid and amino acid metabolism,
    through a mechanism that is independent of its acyl-CoA dehydrogenase activity
    (PubMed:29563254).
