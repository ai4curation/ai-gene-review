- source: Alliance_Imported
  text: Medium-chain acyl-CoA dehydrogenase (Mcad) encodes a mitochondrial enzyme
    that catalyzes the first of the four reactions of fatty acid beta-oxidation, which
    consists in the dehydrogenation of fatty acyl-CoA thioesters to generate (2E)-enoyl-CoA.
    The electrons produced are transferred to the mitochondrial respiratory chain
    via the FAD regeneration system.
