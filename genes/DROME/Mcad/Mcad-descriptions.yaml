- source: Alliance_Automated
  text: Enables medium-chain fatty acyl-CoA dehydrogenase activity. Involved in fatty
    acid beta-oxidation using acyl-CoA dehydrogenase. Located in cytosol and mitochondrial
    matrix. Is expressed in several structures, including adult head; adult heart;
    epithelium; germline cell; and gut section. Used to study medium chain acyl-CoA
    dehydrogenase deficiency. Human ortholog(s) of this gene implicated in medium
    chain acyl-CoA dehydrogenase deficiency. Orthologous to human ACADM (acyl-CoA
    dehydrogenase medium chain).
