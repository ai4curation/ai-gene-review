- source: Alliance_Automated
  text: Predicted to enable acetyl-CoA C-acetyltransferase activity. Predicted to
    be involved in fatty acid beta-oxidation and negative regulation of mitochondrial
    membrane permeability involved in apoptotic process. Predicted to be located in
    mitochondrial matrix. Predicted to be active in mitochondrion. Is expressed in
    several structures, including adult head; adult heart; epithelium; germline cell;
    and gut section. Orthologous to human ACAA2 (acetyl-CoA acyltransferase 2).
