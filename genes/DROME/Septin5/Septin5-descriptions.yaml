descriptions:
- source: Alliance_Imported
  text: Septin 5 (Septin5) encodes a member of the septin family of GTP-binding proteins.
    Septins form hetero-oligomeric filaments and rings that have roles in cytokinesis,
    cell polarity and membrane rigidity. Septin5 is not essential for development,
    but mutants display a synthetic lethal pupal phenotype when combined with mutations
    in its paralog Septin2.
  source_type: curated
  url: https://flybase.org/reports/Septin5.html
