- source: Alliance_Automated
  text: Enables actin filament binding activity. Involved in several processes, including
    actomyosin contractile ring organization; imaginal disc-derived wing morphogenesis;
    and wound healing. Predicted to be located in cytoskeleton. Predicted to be part
    of septin complex. Predicted to be active in cell division site; microtubule cytoskeleton;
    and septin ring. Is expressed in several structures, including anterior endoderm;
    dorsal ectoderm anlage; endoderm anlage; foregut anlage; and foregut anlage in
    statu nascendi. Orthologous to human SEPTIN10 (septin 10); SEPTIN11 (septin 11);
    and SEPTIN6 (septin 6).
  source_type: automated
