  review:
    summary: GTPase activity transferred to Sep5 by sequence similarity to Pnut.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ISS donor is Pnut (FBgn0013726), a SEPT7-class septin. Sep5 is a SEPT6-class retrogene
      copy of Sep2 (PMID:24433211, PMID:38728140), and recombinant Sep2 has no detectable GTPase activity
      (PMID:25355953). Sep5 hydrolytic activity has not been measured; GTP binding is well supported but
      hydrolysis is likely an over-transfer from a catalytically active paralog class.
    supported_by:
