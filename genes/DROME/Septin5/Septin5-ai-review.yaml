      supporting_text: 'Drosophila has 5 Septins that are grouped into three classes: Sep2 and Sep5 (SEPT6
        class), Sep1 and Sep4 (SEPT2 class), and Pnut (SEPT7 class)'
    - reference_id: PMID:25355953
