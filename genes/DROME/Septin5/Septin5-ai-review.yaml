  label: Drosophila melanogaster
description: Septin5 (Sep5) is a Drosophila SEPT6-class septin that arose as a retrogene copy of Septin2.
  It assembles with Septin4 and Peanut into the Sep4-Sep5-Pnut hetero-oligomer, which overlaps the actomyosin
  ring at cell wounds and bends actin bundles; Sep5 mutants show delayed actomyosin ring disassembly during
  wound repair. Sep5 binds and bundles actin filaments and acts redundantly with Sep2 in imaginal cell
  proliferation, although the two paralogs have partly diverged in function. Like Sep2, it is expected
  to bind GTP but its hydrolytic activity has not been demonstrated.
