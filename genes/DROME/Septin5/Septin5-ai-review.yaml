core_functions:
- description: Sep5 is a SEPT6-class septin subunit of the Sep4-Sep5-Pnut complex; it binds and bundles
    actin filaments, and the complex bends F-actin into wide rings overlapping the wound-edge actomyosin
    ring, promoting timely ring disassembly during cell wound repair.
