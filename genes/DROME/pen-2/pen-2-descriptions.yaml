descriptions:
- source: UniProt
  text: Essential subunit of the gamma-secretase complex, an endoprotease complex
    that catalyzes the intramembrane cleavage of integral membrane proteins such as
    Notch. It probably represents the last step of maturation of gamma-secretase,
    facilitating endoproteolysis of presenilin and conferring gamma-secretase activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86BE9
  source_id: Q86BE9
