    overall_notes: 'Correct: essential gamma-secretase subunit that triggers presenilin
      endoproteolysis and confers activity, with Notch as substrate.'
- source: Alliance_Automated
  text: Involved in amyloid-beta formation; positive regulation of endopeptidase activity;
    and proteolysis. Located in late endosome and recycling endosome. Part of gamma-secretase
    complex. Human ortholog(s) of this gene implicated in hidradenitis suppurativa.
    Orthologous to human PSENEN (presenilin enhancer, gamma-secretase subunit).
