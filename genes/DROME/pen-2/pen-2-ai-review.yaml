suggested_questions:
- question: Does Pen-2 activate Presenilin autoproteolysis only during assembly, or does it continue to
    modulate catalytic activity of mature Drosophila gamma-secretase toward different substrates?
suggested_experiments:
- hypothesis: Pen-2 transmembrane residues that stabilise the Presenilin fragments are required for Notch
    cleavage in vivo.
  description: Rescue pen-2 mutant clones with point mutants of the Pen-2 transmembrane segments and measure
    Psn NTF/CTF levels and Notch S3 cleavage reporters.
