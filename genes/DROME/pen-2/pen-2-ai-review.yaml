- term:
    id: GO:0006509
    label: membrane protein ectodomain proteolysis
  evidence_type: IDA
  original_reference_id: PMID:20421416
  qualifier: involved_in
  review:
    summary: Annotation to membrane protein ectodomain proteolysis from in vivo reconstitution of gamma-secretase.
    action: MODIFY
    reason: Gamma-secretase performs the intramembrane (S3/epsilon) cleavage that releases the intracellular
      domain of substrates whose ectodomain has already been shed by ADAM-family sheddases such as Kuzbanian.
      Ectodomain shedding is not a gamma-secretase reaction, so the appropriate process is membrane protein
      intracellular domain proteolysis.
