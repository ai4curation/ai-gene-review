  review:
    summary: Pen-2 is required for Presenilin endoproteolysis and confers gamma-secretase activity.
    action: ACCEPT
    reason: Pen-2 depletion prevents Presenilin endoproteolysis, and co-expression of Pen-2 with Aph-1
      and Nicastrin increases Presenilin fragment formation and gamma-secretase activity. This activating
      role is the core contribution of pen-2; endopeptidase activator activity (as for human PSENEN) captures
      the corresponding MF.
