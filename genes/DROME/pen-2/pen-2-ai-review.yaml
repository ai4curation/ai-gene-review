gene_symbol: pen-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: pen-2 (presenilin enhancer 2) encodes the smallest subunit of Drosophila gamma-secretase,
  a hairpin protein with two transmembrane segments that assembles with Presenilin (Psn), Nicastrin (Nct)
  and aph-1. Pen-2 is required for endoproteolytic cleavage of the Presenilin holoprotein into its N-
  and C-terminal fragments, the step that converts the assembled complex into an active intramembrane
  aspartyl protease. Through this activating role pen-2 is needed for gamma-secretase cleavage of ligand-activated
  Notch, releasing the Notch intracellular domain for signaling, and for cleavage of other type I membrane
  proteins such as human APP expressed in fly cells.
