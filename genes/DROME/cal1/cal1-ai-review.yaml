gene_symbol: cal1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CAL1 (chromosome alignment defect 1, CG5148) is the Drosophila-specific chaperone and assembly
  factor for the centromeric histone H3 variant CENP-A (CID). Although it lacks detectable sequence
  similarity to HJURP/Scm3, its N-terminal region wraps around the pre-nucleosomal CENP-A/H4
  heterodimer and is sufficient to assemble CENP-A nucleosomes in vitro, while its C-terminal
  region binds the cupin-domain dimer of CENP-C, which targets CAL1 and its CENP-A cargo to
  existing centromeres. CAL1 is present at centromeres in low copy number, where it limits
  deposition of CENP-A and CENP-C during mitotic exit, and it also resides in the nucleolus in
  association with Modulo. Tethering CAL1 to an ectopic chromosomal site is sufficient to establish
  a heritable CENP-A domain that assembles a functional kinetochore. CAL1 is essential for mitotic
  chromosome segregation and, with CENP-C, for centromere clustering and chromosome segregation in
  female meiosis.
