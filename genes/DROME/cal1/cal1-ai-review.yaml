suggested_questions:
- question: What is the function of the CAL1 nucleolar pool, and does Modulo-dependent nucleolar
    residence time the release of CAL1 for CENP-A deposition at mitotic exit?
- question: How is the low centromeric copy number of CAL1 controlled, and what limits CENP-A and
    CENP-C deposition per cell cycle?
suggested_experiments:
- description: Separate nucleolar and centromeric CAL1 pools (e.g., middle-region 392-722 deletion
    rescue in cal1 mutants) and measure new CENP-A loading by SNAP-tag pulse-chase.
