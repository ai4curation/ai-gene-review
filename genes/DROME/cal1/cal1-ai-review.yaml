    label: chromosome, centromeric region
  evidence_type: IDA
  original_reference_id: PMID:20940262
  qualifier: located_in
  review:
    summary: CAL1 localizes to centromeres, where it deposits CENP-A; shown by quantitative imaging
      and by many independent studies.
    action: ACCEPT
    reason: Centromere localization is well established and is where the core CENP-A assembly
      function acts.
    supported_by:
    - reference_id: PMID:20940262
      supporting_text: Using quantitative in vivo imaging to determine protein copy numbers at
        centromeres and kinetochores, we demonstrate that centromeric Cal1 levels are far lower
        than those of Cenp-A/Cid, Cenp-C and other conserved kinetochore components
    - reference_id: PMID:23028777
      supporting_text: Notably, CAL1 localizes to both centromeres and the nucleolus.
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IDA
  original_reference_id: PMID:17412918
  qualifier: located_in
  review:
    summary: Localization reported in the genome-wide S2-cell spindle screen (abstract only in
      cache). CAL1 sits at the CENP-A/CENP-C centromeric foundation of the kinetochore rather than
      being a stoichiometric kinetochore component.
    action: KEEP_AS_NON_CORE
    reason: Experimental localization by FlyBase curators who read the full text; consistent with
