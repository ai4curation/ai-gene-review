  evidence_type: IDA
  original_reference_id: PMID:24469636
  qualifier: involved_in
  review:
    summary: CAL1 assembles CENP-A nucleosomes in vitro and is sufficient to heritably seed
      CENP-A chromatin when tethered to an ectopic site.
    action: ACCEPT
    reason: This is the core process; CAL1 directly performs the deposition step.
    supported_by:
    - reference_id: PMID:24469636
      supporting_text: CAL1 selectively interacts with CENP-A and is sufficient to assemble CENP-A
