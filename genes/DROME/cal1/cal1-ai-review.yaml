      at centromeric chromatin.
    supported_by:
    - reference_id: PMID:17412918
      supporting_text: how centrioles, centrosomes, and kinetochores are assembled
    - reference_id: PMID:20940262
      supporting_text: Rather than providing a stoichiometric link within the mitotic kinetochore,
        Cal1 limits centromeric deposition of Cenp-A/Cid and Cenp-C during exit from mitosis.
