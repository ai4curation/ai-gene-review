descriptions:
- source: Alliance_Imported
  text: chromosome alignment defect 1 (cal1) encodes a protein that is required for
    maintenance of the epigenetic marks specifying centromeres. It binds to newly
    synthesized centromere-specific histone H3 variant encoded by cid and recruits
    it to the centromere by binding to the centromere protein encoded by Cenp-C.
  source_type: curated
