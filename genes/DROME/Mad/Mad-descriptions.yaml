- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription factor activity,
    RNA polymerase II-specific; co-SMAD binding activity; and transcription coactivator
    activity. Involved in several processes, including cell surface receptor protein
    serine/threonine kinase signaling pathway; imaginal disc development; and regulation
    of transcription by RNA polymerase II. Located in cytoplasm and nucleus. Part
    of RNA polymerase II transcription repressor complex and heteromeric SMAD protein
    complex. Is active in cytosol. Is expressed in several structures, including epithelium;
    germline cell; imaginal disc; larval efferent neurons; and wing vein. Used to
    study intestinal cancer and juvenile polyposis syndrome. Human ortholog(s) of
    this gene implicated in cardiomyopathy and primary pulmonary hypertension. Orthologous
    to human SMAD1 (SMAD family member 1); SMAD5 (SMAD family member 5); and SMAD9
    (SMAD family member 9).
