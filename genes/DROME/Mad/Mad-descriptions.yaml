- source: Alliance_Imported
  text: Mothers against dpp (Mad) encodes the primary transcription factor that mediates
    cellular response to the BMP like ligands encoded by dpp, scw and gbb. Upon phosphorylation
    by either the products of sax or tkv (type I BMP receptors), it forms a complex
    with the product of Med and translocates to the nucleus where, together with cofactors,
    it regulates expression of BMP response target genes.
