descriptions:
- source: UniProt
  text: Component of the Mad-Med transcription factor complex involved in the dpp/BMP
    TGF-beta signal transduction pathway (PubMed:15296719, PubMed:16109720, PubMed:7705627,
    PubMed:7768443, PubMed:8702167, PubMed:9230443, PubMed:9502724, PubMed:9694800).
    Acts downstream of the dpp-receptor protein serine/threonine kinase tkv/thickvein
    (PubMed:10320478). Becomes phosphorylated upon dpp- signaling, triggering association
    with Med and nuclear localization (PubMed:9502724, PubMed:9502733). Binds GC-rich
    enhancer sites with consensus sequence 5'-GCCGNCG-3' in the enhancer region of
    dpp- responsive genes (PubMed:15296719, PubMed:16109720, PubMed:9230443, PubMed:9694800).
    Mad-Med acts as a transcriptional activator but recruits shn/Shnurri to enhance
    its activity or switch to transcriptional repression (PubMed:11071761, PubMed:16109720).
    Regulates dpp-responsive genes by directly activating their expression or by repressing
    the transcriptional repressor brk/brinker (PubMed:12705870). Also involved in
    repression of other key developmental genes including bam and gsb (PubMed:15296719).
    Essential in the germline during oogenesis (PubMed:9502724). Required for dpp-
    signaling during dorsoventral patterning of the embryo (PubMed:14534137, PubMed:7768443,
    PubMed:9502733). Involved in anteroposterior patterning during wing imaginal disc
    growth (PubMed:17507407, PubMed:18820452, PubMed:7768443, PubMed:9230443).
