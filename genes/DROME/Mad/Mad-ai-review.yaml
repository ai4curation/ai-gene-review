id: P42003
gene_symbol: Mad
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mad (Mothers against dpp) is the Drosophila receptor-regulated Smad (R-Smad) of the BMP pathway,
  the ortholog of vertebrate SMAD1/5/9. In unstimulated cells it is a cytosolic monomer. Dpp, Gbb and
  Scw ligands activate type I receptors (Tkv, Sax), which phosphorylate the C-terminal SSXS motif; phosphorylated
  Mad then forms a heteromeric complex with the co-Smad Medea and accumulates in the nucleus. There its
  MH1 domain binds GC-rich Smad-binding sites in Pol II enhancers. At activating elements Mad/Medea directly
  induce target genes such as vestigial, dad and Ubx. At silencer elements a trimeric Mad/Medea complex
  recruits the zinc-finger protein Schnurri to repress brinker and other genes, converting the extracellular
  Dpp gradient into graded transcriptional outputs. Mad activity is limited by Smurf-mediated ubiquitination,
  linker phosphorylation by CDK8 and GSK3/Shaggy, Nemo-dependent nuclear export and phosphatases. Through
  this signalling role Mad is required for embryonic dorsal-ventral patterning, midgut induction, imaginal
  disc patterning and growth, germline and somatic stem cell maintenance, and retrograde BMP signalling
  that promotes neuromuscular junction growth.
