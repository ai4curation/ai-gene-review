  title: UniProt entry P42003 (MAD_DROME)
  findings: []
core_functions:
- description: Receptor-activated DNA-binding transcription factor that, with Medea, directly activates
    BMP target genes at Smad-binding enhancer elements.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0071144
    label: heteromeric SMAD protein complex
  supported_by:
  - reference_id: PMID:9230443
    supporting_text: possesses a sequence-specific DNA-binding activity that becomes apparent when carboxy-terminal
      residues are removed
  - reference_id: PMID:9230443
    supporting_text: Mad binds to and is required for the activation of an enhancer within the vestigial
      wing-patterning gene in cells across the entire developing wing blade.
  - reference_id: PMID:20010841
    supporting_text: activating input by the Smad signal transducers Mothers against Dpp (Mad) and Medea
      via competitive DNA binding
  - reference_id: PMID:36029115
    supporting_text: Unpredictably, both motifs mediate direct gene activation, with no involvement of
      the BMP derepression pathway regulators Schnurri and Brinker.
- description: With Medea and Schnurri, binds silencer elements to repress genes such as brinker, generating
    graded responses to the Dpp morphogen.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0090571
    label: RNA polymerase II transcription repressor complex
  supported_by:
  - reference_id: PMID:12705870
    supporting_text: the brk silencer serves as a direct target for a protein complex consisting of the
      Smad homologs Mad/Medea and the zinc finger protein Schnurri
  - reference_id: PMID:17008448
    supporting_text: by forming a Shn/Smad repression complex on defined promoter elements in the brinker
      (brk) gene
  - reference_id: PMID:11071761
    supporting_text: Furthermore we find that Shn and Mad can interact directly through discrete domains.
- description: Cytosolic R-Smad that, once phosphorylated by Tkv/Sax, binds the co-Smad Medea and carries
    the signal into the nucleus.
  molecular_function:
    id: GO:0070410
    label: co-SMAD binding
  directly_involved_in:
  - id: GO:0060395
    label: SMAD protein signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0071144
    label: heteromeric SMAD protein complex
  supported_by:
  - reference_id: PMID:9693372
    supporting_text: Mad forms a heteromeric complex with Drosophila Smad4 (Medea) upon phosphorylation
      by Thick veins (Tkv), a type I receptor for Dpp.
  - reference_id: PMID:9502724
    supporting_text: MEDEA is localized in the cytoplasm, is not regulated by phosphorylation, and requires
      physical association with MAD for nuclear translocation.
  - reference_id: PMID:9502733
    supporting_text: upon activation of the Dpp pathway, Mad is required to actively translocate Medea
      into the nucleus
  - reference_id: PMID:8681791
    supporting_text: Immunohistochemical studies localize MAD to the cytoplasm in all tissues examined.
suggested_questions:
- question: Should the Mad/Medea/Schnurri silencer complex be modelled as a distinct GO complex (or GO-CAM)
    rather than the generic RNA polymerase II transcription repressor complex?
- question: Does Mad bind the I-Smad Dad directly in vivo, as the IBA for I-SMAD binding implies, or does
    Dad act only at the receptor (Tkv) level?
- question: How does Mad's role in Wingless-dependent segmentation (via GSK3 linker phosphorylation) relate
    to its canonical BMP function, and is it independent of C-terminal phosphorylation?
suggested_experiments:
- description: Map genome-wide occupancy of endogenously tagged Mad (CUT&RUN) in wing discs and motor
    neurons to separate AE-type activation from SE-type repression targets in vivo.
- description: Test direct Mad-Dad binding with purified proteins and endogenously tagged alleles to resolve
    the I-SMAD binding inference.
