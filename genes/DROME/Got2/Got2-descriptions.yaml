- source: Alliance_Automated
  text: Enables L-aspartate:2-oxoglutarate transaminase activity. Involved in L-glutamate
    biosynthetic process and synapse assembly. Located in mitochondrion. Is expressed
    in several structures, including adult head; adult heart; embryonic/larval fat
    body; gastric caecum; and gut section. Human ortholog(s) of this gene implicated
    in developmental and epileptic encephalopathy 82. Orthologous to human GOT2 (glutamic-oxaloacetic
    transaminase 2).
  source_type: automated
