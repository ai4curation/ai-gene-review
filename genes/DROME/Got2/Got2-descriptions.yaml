descriptions:
- source: Alliance_Imported
  text: Glutamate oxaloacetate transaminase 2 (Got2) encodes a mitochondrial enzyme
    that catalyzes the interconversion of L-aspartate and alpha-ketoglutarate to oxaloacetate
    and L-glutamate. It is involved in glutamate and aspartate biosynthesis, gluconeogenesis
    and the malate-aspartate shuttle.
  source_type: curated
  url: https://flybase.org/reports/Got2.html
