  evidence_type: IMP
  original_reference_id: PMID:11753421
  qualifier: involved_in
  review:
    summary: Synapse assembly, from GOT mutants altering glutamate receptor field size at the NMJ (Featherstone
      et al. 2002).
    action: KEEP_AS_NON_CORE
    reason: Featherstone et al. manipulated presynaptic glutamate levels genetically and found that glutamate
      negatively regulates postsynaptic receptor field size during synaptogenesis. Got2 acts indirectly
      here, by setting the glutamate pool rather than by building synapses; the curators read the full
      text, so the annotation is retained but as a non-core, downstream consequence of the enzyme's metabolic
      role.
    supported_by:
    - reference_id: PMID:11753421
      supporting_text: Our data show that presynaptic glutamate is a strong negative regulator of postsynaptic
        receptor field size and function during development.
