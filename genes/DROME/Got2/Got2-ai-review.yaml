suggested_questions:
- question: Which AST isozyme (cytosolic Got1 or mitochondrial Got2) sets the presynaptic glutamate pool
    at the larval NMJ, and is the effect cell-autonomous in motor neurons?
suggested_experiments:
- description: Motor-neuron-specific Got2 knockdown with glutamate imaging (iGluSnFR) and receptor-field
    quantification to test whether Got2 controls nonvesicular glutamate release.
