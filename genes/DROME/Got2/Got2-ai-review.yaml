taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Got2 (CG4233) encodes the mitochondrial aspartate aminotransferase (glutamate oxaloacetate
  transaminase 2) of Drosophila melanogaster, a homodimeric pyridoxal 5'-phosphate-dependent class I aminotransferase.
  In the mitochondrial matrix it reversibly converts L-glutamate and oxaloacetate into 2-oxoglutarate
  and L-aspartate, providing the mitochondrial arm of the malate-aspartate shuttle and a major route for
  aspartate production and glutamate turnover. Got2 is detected in the fly mitochondrial proteome. Genetic
  manipulation of GOT activity in flies alters glutamate levels, and reduced presynaptic glutamate at
  the larval neuromuscular junction enlarges the postsynaptic glutamate receptor field, linking this metabolic
  enzyme to developmental tuning of glutamatergic synapses.
