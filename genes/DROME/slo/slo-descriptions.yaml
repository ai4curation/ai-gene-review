- source: Alliance_Automated
  text: Enables calcium-activated potassium channel activity. Involved in several
    processes, including male courtship behavior, veined wing generated song production;
    negative regulation of neuromuscular synaptic transmission; and regulation of
    synaptic assembly at neuromuscular junction. Located in membrane; neuron projection;
    and neuronal cell body. Is expressed in several structures, including adult brain;
    adult head; embryonic/larval midgut; embryonic/larval neuromuscular junction;
    and pedunculus of adult mushroom body. Used to study alcohol use disorder; heart
    conduction disease; paroxysmal nonkinesigenic dyskinesia 3; substance-related
    disorder; and withdrawal disorder. Human ortholog(s) of this gene implicated in
    several diseases, including Alzheimer's disease; cerebellar atrophy, developmental
    delay, and seizures; generalized epilepsy; paroxysmal nonkinesigenic dyskinesia
    3; and spermatogenic failure 79. Orthologous to several human genes including
    KCNMA1 (potassium calcium-activated channel subfamily M alpha 1).
  source_type: automated
  url: https://flybase.org/reports/slo.html
