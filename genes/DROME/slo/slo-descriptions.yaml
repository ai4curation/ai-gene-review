descriptions:
- source: UniProt
  text: Potassium channel activated by both membrane depolarization or increase in
    cytosolic Ca(2+) that mediates export of K(+). Its activation dampens the excitatory
    events that elevate the cytosolic Ca(2+) concentration and/or depolarize the cell
    membrane. It therefore contributes to repolarization of the membrane potential.
    Kinetics are determined by alternative splicing, phosphorylation status and its
    combination interaction with Slob and 14-3-3-zeta. While the interaction with
    Slob1 alone increases its activity, its interaction with both Slob1 and 14-3-3-zeta
    decreases its activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03720
  source_id: Q03720
