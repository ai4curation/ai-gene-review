- source: Alliance_Imported
  text: slowpoke (slo) encodes the structural alpha subunit of a BK ('maxi K') calcium-activated
    potassium channel. It regulates neurotransmitter release at the synapse and maintain
    electrical excitability in neurons and muscle cells.
