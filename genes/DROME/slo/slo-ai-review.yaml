suggested_questions:
- question: Does fly SLO localize to the postsynaptic (muscle) membrane at the larval NMJ, as the IBA
    postsynaptic membrane row implies, or mainly to presynaptic terminals?
- question: Are the NMJ morphology and active-zone phenotypes of slo nulls caused by a structural scaffolding
    role of the SLO C-terminal domain, or by a homeostatic response to altered excitability?
- question: PMID:21690310 places slo expression downstream of Tinman/Cdc42 in the heart, and tin/slo transheterozygotes
    are arrhythmic. Does SLO act in cardiomyocyte repolarization (supporting a cardiac process term),
    or is this an expression-level effect only?
suggested_experiments:
- description: Endogenous tagging of slo (e.g. MiMIC-based GFP knock-in) with super-resolution imaging
    at the larval NMJ to resolve pre- versus postsynaptic SLO localization.
- description: Muscle-specific versus neuron-specific slo RNAi or rescue in a slo null, with patch-clamp
    of adult cardiomyocytes and optical heartbeat analysis, to test a direct cardiac role.
