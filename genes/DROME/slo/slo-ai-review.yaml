- term:
    id: GO:0007623
    label: circadian rhythm
  evidence_type: IMP
  original_reference_id: PMID:12417656
  qualifier: involved_in
  review:
    summary: Circadian rhythm (IMP, slo1 and slo4 mutants).
    action: MODIFY
    reason: 'slo null flies lose rhythmic locomotor activity without a major change in total activity.
      What was assayed is the locomotor activity rhythm, so the more specific child locomotor rhythm (is_a
      circadian behavior) is the better term. The role is non-core: follow-up work shows the core molecular
      oscillator is intact and SLO acts in clock output circuitry.'
    supported_by:
    - reference_id: PMID:12417656
      supporting_text: a null mutation ( slo 4) in this locus results in behavioral arrhymicity without
        a major change in total activity levels.
    proposed_replacement_terms:
    - &id017
      id: GO:0045475
      label: locomotor rhythm
- term:
    id: GO:0008582
    label: regulation of synaptic assembly at neuromuscular junction
  evidence_type: IMP
  original_reference_id: PMID:25359729
  qualifier: involved_in
  review:
    summary: Regulation of synaptic assembly at NMJ (IMP, slo11481 null).
    action: KEEP_AS_NON_CORE
    reason: slo null larvae show enlarged synaptic boutons and enlarged, merged active zones, rescued
      by a slo transgene, and acting in a common pathway with DYSC. The authors call these non-canonical
      roles; the mechanism (direct scaffold vs homeostatic response to excitability) is unresolved, so
      the term is kept as a peripheral process.
    supported_by:
    - reference_id: PMID:25359729
      supporting_text: Like dysc mutants, slo 11481 larval synapses exhibited significantly increased
        bouton areas
