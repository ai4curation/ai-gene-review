id: Q03720
gene_symbol: slo
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'slowpoke (slo) encodes the pore-forming alpha subunit of the large-conductance Ca2+- and
  voltage-activated K+ (BK, maxi-K) channel of Drosophila, the founding member of the BK family. Each
  subunit has seven transmembrane segments (S0-S6) with an S4 voltage sensor and a K+-selective P-loop,
  followed by a large cytoplasmic region with two RCK domains and a calcium bowl that sense intracellular
  Ca2+; four subunits form the channel. Alternative splicing of the cytoplasmic region produces many isoforms
  with different gating kinetics. Expressed channels have a unitary conductance of about 126 pS and open
  with depolarization and micromolar cytoplasmic Ca2+. The channel carries K+ out of the cell and so repolarizes
  muscle and neuronal membranes after Ca2+ entry. It binds regulatory partners on its C-terminal domain:
  Slob (which raises channel activity), dSLIP1 (which lowers surface channel number), the kinases Src
  and PKA, and the PDZ scaffold Dyschronic. slo is expressed in muscle, central and peripheral neurons,
  mushroom bodies, midgut and trachea. Loss of slo increases neurotransmitter release at the larval neuromuscular
  junction, enlarges boutons and active zones, and abolishes circadian locomotor rhythms by disrupting
  clock output while the molecular oscillator keeps running. slo mutants also have abnormal courtship
  song, and slo induction underlies rapid tolerance to sedating solvents.'
