- source: Alliance_Automated
  text: Predicted to enable troponin C binding activity. Involved in several processes,
    including adult somatic muscle development; muscle cell cellular homeostasis;
    and sarcomere organization. Located in striated muscle thin filament. Colocalizes
    with nucleus. Is expressed in several structures, including adult head; adult
    heart; larval muscle system; mesoderm; and muscle cell. Used to study adenocarcinoma;
    cardiomyopathy; dilated cardiomyopathy; and heart disease. Human ortholog(s) of
    this gene implicated in arthrogryposis multiplex congenita; distal arthrogryposis
    type 2B1; and intrinsic cardiomyopathy (multiple). Orthologous to several human
    genes including TNNI3 (troponin I3, cardiac type).
