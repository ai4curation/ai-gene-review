- source: Alliance_Imported
  text: wings up A (wupA) encodes a cytoskeletal protein of the troponin complex of
    the muscle thin filament. It is involved in calcium-dependent regulation of muscle
    contraction, and in development of the embryonic heart, skeletal muscle and flight
    muscle It also contributes to non-muscle functions such as apico-basal polarity
    formation, nuclear division and maintenance of nuclear integrity.
  source_type: curated
