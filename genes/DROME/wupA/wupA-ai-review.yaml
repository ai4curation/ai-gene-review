id: P36188
gene_symbol: wupA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'wupA (wings up A; also heldup/hdp) is the single troponin I (TnI) gene of Drosophila melanogaster. Extensive
  alternative splicing (mutually exclusive exons, an optional exon 3 and alternative C-terminal exons) generates many TnI
  isoforms expressed with muscle-type and stage specificity. TnI is the inhibitory subunit of the thin-filament troponin complex
  (TnI-TnT-TnC) of striated body-wall, flight, leg, visceral and cardiac muscle: in the absence of Ca2+ it binds actin and,
  with tropomyosin, holds the thin filament in the blocked/closed state that prevents actomyosin cross-bridge cycling; Ca2+
  binding to troponin C relieves this inhibition. The hdp2 point mutation (A116V) uncouples this regulation, producing Ca2+-independent
  thin-filament activation, muscle hypercontraction and degeneration, and a dilated cardiomyopathy-like heart phenotype; splicing/regulatory
  alleles that reduce TnI levels block myofibril formation in flight muscles. wupA is haplolethal. Outside muscle, TnI is
  maternally deposited and found in epithelial cells, neuroblasts and S2 cells, where a sumoylation-dependent pool enters
  the nucleus; loss of function in these contexts perturbs nuclear divisions, apico-basal polarity protein localization and
  cell proliferation, by mechanisms not yet defined.'
