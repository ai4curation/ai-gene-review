- term:
    id: GO:0006942
    label: regulation of striated muscle contraction
  evidence_type: IDA
  original_reference_id: PMID:14990488
  qualifier: involved_in
  review:
    summary: TnI directly regulates striated muscle contraction by Ca2+-dependent inhibition of actomyosin interaction on
      the thin filament.
    action: NEW
    reason: 'Passes the participation test: TnI itself performs the inhibitory step (binding actin and holding tropomyosin
      in the blocked position), not merely being required. Direct assays on native Drosophila thin filaments show that the
      hdp2 TnI substitution leaves tropomyosin in the Ca2+-activated position irrespective of Ca2+ and shifts in vitro motility
      activation to lower Ca2+. Comparator check (QuickGO): human TNNI3 carries GO:0010882 regulation of cardiac muscle contraction by calcium ion signaling (IMP) and human TNNI1 carries GO:0006942 (NAS), so regulation-of-contraction terms are used for TnI orthologs, although coverage is sparse (the PAINT donors UniProtKB:P48788 and UniProtKB:P08057 lack them). The term is not an ancestor or descendant of muscle contraction
      (a regulation term).'
    supported_by:
    - reference_id: PMID:14990488
      supporting_text: Thin filaments from the Drosophila mutant heldup(2), which possesses a single amino acid conversion
        in troponin I
    - *id003
    - &id006
      reference_id: PMID:20658179
      supporting_text: the mutant troponin I caused activation of motility at pCa values higher than wild type
    - *id004
