  evidence_type: IMP
  original_reference_id: PMID:19567471
  qualifier: involved_in
  review:
    summary: Pre-cellular embryos from TnI mutants show abnormal syncytial nuclear divisions with chromosome fragment loss;
      TnI is maternally deposited.
    action: KEEP_AS_NON_CORE
    reason: 'IMP from the Ferrus lab (curator read the full text; we have the abstract only). The phenotype is genuine but
      the mechanism is not established: the paper proposes the Tn-Tm complex acts on motor systems needed for nuclear integrity,
      but no direct role of TnI in a step of nuclear division is shown. Retained as a non-core, non-muscle role; not a basis
      for a core function.'
    supported_by:
    - reference_id: PMID:19567471
      supporting_text: We show here that pre-cellular embryos of TnI, Tm1 and Tm2 mutants exhibit abnormal nuclear divisions
        with frequent loss of chromosome fragments.
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: NAS
  original_reference_id: PMID:1899228
  qualifier: enables
  review:
    summary: TnI binds F-actin; actin binding is the basis of its inhibitory action on the thin filament.
    action: ACCEPT
    reason: 'Actin binding is the canonical TnI activity (inhibitory region binds actin in low Ca2+). The NAS source only
      establishes homology to TnI, but the activity is supported by Drosophila genetics/biochemistry: hdp2 TnI weakens inhibition
      of the thin filament, and the hdp2 suppressor lies adjacent to the TnI actin-binding domain. Core molecular function.'
    supported_by:
    - &id005
      reference_id: PMID:21680742
      supporting_text: In the absence of calcium, TnI binds actin more tightly than myosin; in the presence of calcium, the
        TnI interaction is weakened, and now myosin binds more tightly.
    - reference_id: PMID:8589447
      supporting_text: The second site suppression is due to a leucine to phenylalanine change within a heptameric leucine
        string motif adjacent to the actin binding domain of TnI.
    - reference_id: PMID:1899228
      supporting_text: HL I encodes a family of proteins with extensive homology to invertebrate troponin I (TnI).
