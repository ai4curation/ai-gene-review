- id: PMID:17344088
  title: Characterisation of a bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) from
    Drosophila melanogaster.
  findings:
  - statement: Recombinant Apf/Datp is an asymmetrical Ap4A hydrolase producing ATP + AMP,
      active with Zn2+ or Mg2+ with pH-dependent substrate preference.
    supporting_text: >-
      diadenosine tetraphosphate is hydrolysed to ATP and AMP
      with K(m), k(cat) and k(cat)/K(m) values 9microM, 43s(-1) and 4.8microM(-1)s(-1)
  - statement: Ap6A is hydrolysed to ATP efficiently only at pH 7.5 with Mg2+.
    supporting_text: >-
      diadenosine hexaphosphate is efficiently
      hydrolysed to ATP only at pH 7.5 with 20mMMg(2+)
  - statement: mRNA highest in embryos and adult females.
    supporting_text: >-
      Patterns of Apf expression in Drosophila
      tissues show Apf mRNA levels to be highest in embryos and adult females.
  - statement: Apf-EGFP is predominantly nuclear, apparently associated with euchromatin
      and facultative heterochromatin.
    supporting_text: >-
      Subcellular localization with Apf-EGFP fusion constructs reveals Apf to be
      predominantly nuclear
  - statement: Apf differs from the Ap4A hydrolase activity previously purified from
      Drosophila embryos.
    supporting_text: >-
      with features that distinguish it from a previously reported bis
      (5'-nucleosyl)-tetraphosphatase hydrolase activity from Drosophila embryos
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Sole primary characterisation of the CG31713 product (cited as RN[2] in UniProt
      Q4V6M1, EMBL AAX68972). Abstract only in cache (full_text_available false).
- id: PMID:2558922
  title: 'Diadenosine 5",5"''P1,P4-tetraphosphatase in Drosophila embryos: developmental
    regulation and characterization.'
  findings:
  - statement: An Ap4A-hydrolysing activity purified from embryos peaks 1.5 h after
      fertilization; the 26 kDa enzyme was speculatively linked to nuclear division.
    supporting_text: >-
      The profile of activity is compatible with its involvement in the regulation of
      nuclear division.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      Biochemical activity from embryo extracts; the gene product was not identified,
      and PMID:17344088 states that recombinant Apf has features distinguishing it from
      this activity (26 kDa vs 16.6 kDa; Co2+ stimulation, Zn2+ inhibition vs Zn2+
      activation of Apf). Likely the source of the FlyBase comment linking Datp to
      nuclear division; that link is speculative and may concern a different enzyme.
- id: PMID:4066685
  title: Variation of Ap4A and other dinucleoside polyphosphates in stressed Drosophila
    cells.
  findings:
  - statement: Ap4A is sub-micromolar in growing Drosophila cells and rises under heat
      shock and high cadmium.
    supporting_text: >-
      Upon heat-shock from 19 to 37 degrees C, Ap4A, Ap3A, and Ap3G increase
      up to 2.2, 3, and 3.3 times their initial levels, respectively.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Context for Ap4A levels in Drosophila; does not study Datp.
core_functions:
- description: >-
    Asymmetrical hydrolysis of diadenosine 5',5'''-P1,P4-tetraphosphate (Ap4A) and
    related diadenosine polyphosphates to ATP plus AMP (or other products) by a
    divalent-cation-dependent Nudix active site, presumed to control Ap4A levels,
    predominantly in the nucleus.
  molecular_function:
    id: GO:0004081
    label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
