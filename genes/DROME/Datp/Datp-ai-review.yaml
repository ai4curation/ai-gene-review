- term:
    id: GO:0006167
    label: AMP biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000482012
  - WB:WBGene00003581
  review:
    summary: >-
      Process term propagated from the PTN000482012 node, whose only seed is the C.
      elegans ndx-4 IDA, itself based on AMP being a product of Ap4A hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      AMP is released as a by-product of degrading Ap4A, not as the purpose of a
      biosynthetic pathway, and there is no evidence that Datp contributes to cellular AMP
      pools. The process the enzyme actually executes is diadenosine tetraphosphate
      catabolic process (GO:0015967), proposed below. Same decision as for the ndx-4
      seed annotation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000482012
        comment: Node-level process term grounded only in the reaction product of Ap4A hydrolysis; the catabolic process term is the appropriate one.
      - source_id: WB:WBGene00003581
        source_label: ndx-4
        comment: Sole seed; its IDA rows are product-based process annotations, marked over-annotated in genes/worm/ndx-4.
