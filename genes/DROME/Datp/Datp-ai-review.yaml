gene_symbol: Datp
aliases:
- Apf
- CG31713
- Ap4A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Datp (Diadenosine tetraphosphatase; CG31713, formerly Apf) encodes the Drosophila
  asymmetrical diadenosine tetraphosphate (Ap4A) hydrolase, a small (142 aa, 16.6 kDa),
  heat-stable Nudix hydrolase of the PTHR21340:SF0 subfamily and the fly counterpart of
  human NUDT2 and C. elegans ndx-4. Recombinant enzyme hydrolyses Ap4A to ATP plus AMP
  (Km about 9-12 uM, kcat 13-43 s-1) using Mg2+ or Zn2+, with substrate preference
  depending on pH and metal ion; it also hydrolyses other diadenosine polyphosphates
  such as Ap6A, always releasing a nucleoside triphosphate. Fluoride inhibits the
  Mg2+-dependent reaction, consistent with a MgF3- transition-state analogue complex.
  Datp mRNA is most abundant in embryos and adult females, and an EGFP-tagged protein is
  predominantly nuclear, apparently associated with euchromatin and facultative
  heterochromatin, suggesting a nuclear site for control of Ap4A levels. Ap4A rises in
  Drosophila cells under heat shock and cadmium stress, but no in vivo role for Datp
  itself has been established.
