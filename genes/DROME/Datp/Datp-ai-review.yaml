suggested_questions:
- question: >-
    Does endogenous Datp localize to the nucleus and to specific chromatin domains, as
    the EGFP-fusion data suggest, and does nuclear Ap4A have a chromatin-related role in
    flies?
- question: >-
    Is Datp the enzyme responsible for the embryonic Ap4A hydrolase activity described
    by Vallejo and Leon (1989), or is that activity a distinct protein?
- question: >-
    Do Datp loss-of-function alleles (reported in FlyBase as viable and fertile) cause
    Ap4A accumulation, and does this affect stress responses such as heat shock?
suggested_experiments:
- description: >-
    Measure Ap4A/Ap3A by LC-MS in Datp null flies and embryos, at baseline and after heat
    shock or cadmium exposure, and test stress survival and fertility.
- description: >-
    Generate an endogenously tagged Datp knock-in and determine its tissue expression and
    nuclear/chromatin localization (e.g. by polytene chromosome immunostaining).
