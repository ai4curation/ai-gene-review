- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414055
  review:
    summary: >-
      UniRule-based inference of metal ion binding from the Nudix domain, whose
      glutamate-rich Nudix box coordinates the catalytic divalent cations.
    action: KEEP_AS_NON_CORE
    reason: >-
      Supported: the fly enzyme requires a divalent cation (Mg2+ or Zn2+) for activity,
      and fluoride inhibition only with Mg2+ implies an enzyme-bound Mg-fluoride
      complex. Metal binding is a cofactor feature of the catalytic mechanism rather than
      an independent function, so it is retained as non-core. The specific ion in vivo
      (likely Mg2+) is not established, so the generic term is appropriate.
    supported_by:
    - reference_id: PMID:17344088
      supporting_text: >-
        with substrate preference depending on pH and divalent ion (Zn(2+) or
        Mg(2+))
    - reference_id: PMID:17344088
      supporting_text: >-
        supporting the view that inhibition involves a specific, MgF(3)(-)-containing
        transition state analogue complex
- term:
    id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17344088
  qualifier: involved_in
  review:
    summary: >-
      Recombinant Datp (Apf) degrades Ap4A and other diadenosine polyphosphates.
    action: NEW
    reason: >-
      Datp itself catalyses the hydrolytic step, so it does the work of Ap4A catabolism
      (not a substrate or merely required). This is the process the enzyme directly
      executes and replaces the product-based AMP/ATP biosynthetic process IBAs.
      Comparator: C. elegans ndx-4 carries GO:0015967 by IDA (accepted in
      genes/worm/ndx-4). Evidence is from the abstract only (full text not cached), so
      the in vivo contribution to Ap4A levels remains untested.
    supported_by:
    - reference_id: PMID:17344088
      supporting_text: >-
        we have expressed and characterized a heat
        stable, 16.6kDa Nudix hydrolase (Apf) that specifically metabolizes these
        nucleotides from a Drosophila melanogaster cDNA
