  review:
    summary: >-
      Process term propagated from PTN000482012 because ATP is a product of Ap4A
      hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ATP liberated from sub-micromolar Ap4A pools is negligible compared with oxidative
      and substrate-level phosphorylation; Datp acts to remove Ap4A, not to make ATP.
      The fact that Apf always produces an NTP product describes the reaction chemistry,
      not participation in ATP biosynthesis. GO:0015967 is the appropriate process.
