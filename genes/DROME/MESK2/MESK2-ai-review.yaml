suggested_questions:
- question: Is the HDA serine hydrolase activity annotation on the canonical MESK2 record (Q7KVN0, from
    PMID:33827210) supported by probe-dependent, inhibitor-competable labelling of MESK2 peptides, given
    that MESK2 has glycine at the catalytic-serine position?
- question: Do the MESK2 isoforms that differ at their N- and C-terminal extensions (isoforms A/E/F versus
    isoform I) have different interaction partners or subcellular distributions?
- question: Does MESK2 act in glia through the same molecular interactions that let its overexpression
    modulate RAS1/KSR signalling in the eye?
suggested_experiments:
- description: Immunoprecipitation or proximity labelling of endogenously tagged MESK2 isoforms in adult
    glia and eye discs, to identify direct binding partners.
  experiment_type: proteomics
- description: Express recombinant MESK2 Ndr domain and test FP-probe labelling and esterase activity, with
    an engineered G234S variant as a positive-control comparison.
  experiment_type: biochemistry
- description: Glia-specific rescue of the MESK2 RNAi circadian phenotype with RNAi-resistant isoform A
    and isoform I transgenes.
  experiment_type: genetics
knowledge_gaps:
- gap_statement: The molecular activity of MESK2 is unknown. No binding partner, ligand or regulated
    target has been identified, so the mechanism behind its Ras-modulating and glial circadian
    phenotypes cannot be stated.
  gap_kind:
  - BIOLOGY
