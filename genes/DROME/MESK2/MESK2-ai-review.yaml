    summary: PAINT asserts cytoplasm (IBD) at the Eumetazoa NDRG node PTN000867215, seeded by
      experimental cytoplasmic localization of human, mouse and rat NDRG1-4. GOA propagates this IBA
      to the MESK2 record Q9GU50 but not to this isoform record. Q8T0V2 carries the same Ndr domain
      (identical to Q9GU50 over 338 residues) and no signal peptide or transmembrane segment, so the
      inherited location applies to it equally.
