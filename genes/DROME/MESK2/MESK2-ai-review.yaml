- id: PMID:33827210
  title: A Superfamily-wide Activity Atlas of Serine Hydrolases in &lt;i&gt;Drosophila melanogaster&lt;/i&gt;.
  full_text_unavailable: true
  findings:
  - statement: Fluorophosphonate activity-based protein profiling mapped serine hydrolase activities
      across Drosophila stages and tissues; this is the source of the gene-level HDA serine hydrolase
      activity row on the canonical record Q7KVN0.
    supporting_text: leveraging discovery chemoproteomics, we identify and globally map the full complement
      of SH activities during various developmental stages and in different adult tissues of Drosophila
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only. Whether MESK2 peptides were labelled in a probe-dependent manner could
