references:
- id: PMID:11063696
  title: A misexpression screen identifies genes that can modulate RAS1 pathway signaling in Drosophila
    melanogaster.
  full_text_unavailable: true
  findings:
  - statement: MESK2 was isolated as a misexpression modifier of RAS1/KSR signalling in the eye; the
      authors leave open whether such genes are pathway components or act in parallel pathways.
    supporting_text: These genes may represent new components of the RAS pathway or components of other
      signaling pathways that can modulate signaling by RAS.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Origin of the MESK2 name. The cached abstract does not name MESK2 individually; the
      MESK2 assignment is supported by You et al. 2018 citing this screen. Overexpression-only genetic
      interaction, so it does not establish pathway participation.
- id: PMID:29487148
  title: Regulation of Circadian Behavior by Astroglial MicroRNAs in Drosophila.
  findings:
  - statement: Pan-glial RNAi knockdown of MESK2 with two independent transgenes reduced circadian
      locomotor rhythmicity.
    supporting_text: glial knockdown of MESK2 using either of two different RNAi transgenes also decreased
      rhythmicity
  - statement: The biochemical role of MESK2 is unknown.
    supporting_text: Beyond a possible regulation of Ras/ERK signaling, there is little known about the
      biochemical role of MESK2 in Drosophila or mammals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The strongest loss-of-function evidence for the gene, but it is a
      behavioural phenotype without rescue; not used for a process annotation.
