  label: Drosophila melanogaster
description: MESK2 (Misexpression suppressor of KSR 2, CG15669) is the single Drosophila member of
  the animal NDRG (N-myc downstream-regulated) family. Its products are cytoplasmic proteins built
  around an Ndr alpha/beta-hydrolase-fold domain. At the nucleophile-elbow position that carries the
  catalytic serine in active hydrolases, MESK2 has glycine, as human NDRG2 does, so it is expected to
  be a noncatalytic fold-retaining protein rather than an esterase or lipase. The gene encodes several
  isoforms that share the Ndr core and differ at their N- and C-terminal extensions. When misexpressed
  in the developing eye, MESK2 modulates RAS1/KSR-dependent photoreceptor signalling. Knockdown in glia
  reduces the rhythmicity of circadian locomotor behaviour. Insertion alleles are recessive lethal. Its
  molecular activity, binding partners and mechanism are unknown.
