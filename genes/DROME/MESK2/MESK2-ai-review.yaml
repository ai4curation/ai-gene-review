- id: PMID:21247902
  title: Crystal structure of the human N-Myc downstream-regulated gene 2 protein provides insight into
    its role as a tumor suppressor.
  findings:
  - statement: Human NDRG2 retains the alpha/beta-hydrolase fold but lacks the catalytic triad.
    supporting_text: The most striking difference between NDRG2 and other members of ABH superfamily is
      the absence of the classical catalytic triad, Ser-His-Asp.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Family-level structural reference for the pseudo-active site. NDRG2 is in a different
      PANTHER subfamily (SF17) from MESK2 (SF56), so only the fold-level and residue-level comparison
      is transferred, not NDRG2-specific biology.
