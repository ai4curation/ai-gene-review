descriptions:
- source: UniProt
  text: Catalyzes the reaction that attaches fucose through an O- glycosidic linkage
    to a conserved serine or threonine residue found in the consensus sequence C2-X(4,5)-[S/T]-C3
    of EGF domains, where C2 and C3 are the second and third conserved cysteines (PubMed:12909620,
    PubMed:15692013). Specifically uses GDP-fucose as donor substrate and proper disulfide
    pairing of the substrate EGF domains is required for fucose transfer (By similarity).
    Plays a crucial role in Notch signaling (PubMed:12909620, PubMed:12917292, PubMed:17329366).
    Initial fucosylation of N/Notch by Ofut1 generates a substrate for Fng/Fringe,
    an acetylglucosaminyltransferase that can then extend the fucosylation on the
    Notch EGF repeats (PubMed:12909620). This extended fucosylation is required for
    optimal ligand binding and canonical NOTCH signaling induced by Delta/Dl or Ser/Serrate
    (PubMed:12909620, PubMed:12917292). Required for transport of N/Notch to the early
    endosome and to the apical membrane cell surface (PubMed:15692013, PubMed:17329366,
    PubMed:18194540). Facilitates secretion of N/Notch and may function as a chaperone
    independent of its fucosyltransferase activity (PubMed:15692013, PubMed:18194540).
    Fucosyltransferase activity is dispensible for embryonic developmental processes
    including neurogenesis (PubMed:18194540). Involved in Notch signaling during wing
    imaginal disc development (PubMed:18194540).
