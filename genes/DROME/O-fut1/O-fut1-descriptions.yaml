- source: Alliance_Automated
  text: Enables Notch binding activity and peptide-O-fucosyltransferase activity.
    Involved in several processes, including positive regulation of Notch signaling
    pathway; positive regulation of protein localization to cell surface; and protein
    O-linked glycosylation via fucose. Located in endoplasmic reticulum lumen. Is
    active in endoplasmic reticulum. Is expressed in adult head; central nervous system;
    embryonic/larval lymph gland; germline cell; and imaginal disc. Human ortholog(s)
    of this gene implicated in Dowling-Degos disease. Orthologous to human POFUT1
    (protein O-fucosyltransferase 1).
