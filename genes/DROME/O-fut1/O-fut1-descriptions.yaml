- source: Alliance_Imported
  text: O-fucosyltransferase 1 (Ofut1) encodes an endoplasmic reticulum enzyme that
    catalyzes the attachment of &bgr;-L-fucose to the hydroxyl group of serine or
    threonine residues in protein EGF-like repeats via an &agr;-glycosidic bond. It
    is involved in the synthesis of the O-fucosylated glycans on the N protein, which
    regulates N binding to its ligands encoded by Delta and Ser.
