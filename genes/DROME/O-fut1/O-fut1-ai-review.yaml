gene_symbol: Ofut1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Ofut1 (O-fut1, neurotic) is the Drosophila GDP-fucose protein
  O-fucosyltransferase 1 (glycosyltransferase family 65), a soluble
  endoplasmic reticulum lumenal enzyme that transfers fucose from GDP-fucose
  onto serine/threonine residues within the C2-X(4,5)-[S/T]-C3 consensus of
  EGF-like repeats, most importantly on the Notch receptor extracellular
  domain. The O-fucose it adds is the substrate that Fringe elongates with
  GlcNAc, so O-fut1 is required both for Fringe-dependent modulation of
  Delta/Serrate binding and for Notch-ligand binding generally. Independently
  of its catalytic activity, O-fut1 binds the Notch extracellular domain and
  acts as a Notch-specific chaperone that promotes Notch folding, exit from
  the ER, delivery to the cell surface and constitutive endocytic trafficking
  to early endosomes. Loss of O-fut1 gives a maternal neurogenic phenotype
  and cell-autonomous loss of Notch signalling in the signal-receiving cell,
  while overexpression inhibits signalling. A catalytically dead knock-in
  (R245A) retains chaperone activity and supports most, but not all
  (temperature-sensitive and Fringe-dependent), Notch signalling events.
