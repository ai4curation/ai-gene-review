  evidence_type: IMP
  original_reference_id: PMID:21965616
  qualifier: involved_in
  review:
    summary: >-
      In the adult midgut, reducing Notch pathway glycosylation (Gmd, and by
      the curator's reading O-fut1) impairs commitment of intestinal stem cell
      daughters, which needs high Notch activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached abstract is about Gmd and Notch signalling levels in stem
      cell commitment; the O-fut1 perturbation is presumably in the full text,
      which the curator read. The phenotype is a downstream consequence of
      reduced Notch signalling rather than a separate role of O-fut1, so it is
      kept as a non-core, context-specific process.
    supported_by:
    - reference_id: PMID:21965616
      supporting_text: >-
        Here, we show that distinct requirements for Notch activity exist:
        commitment requires high Notch activity, whereas terminal
        differentiation can occur with lower Notch activity.
