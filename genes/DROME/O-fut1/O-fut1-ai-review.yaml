suggested_questions:
- question: >-
    Is the Notch chaperone activity of O-fut1 conserved in vertebrate POFUT1,
    or is it a Drosophila-specific feature that makes the fly enzyme
    catalytically dispensable for Fringe-independent signalling?
suggested_experiments:
- description: >-
    Compare Notch folding/ER exit and signalling in flies carrying the
    catalytically dead O-fut1 R245A knock-in versus a chaperone-deficient
    but catalytically active allele (if separable), across temperatures and
    in rumi mutant backgrounds.
  experiment_type: in vivo genetic separation-of-function
