  evidence_type: IDA
  original_reference_id: PMID:15692013
  qualifier: enables
  review:
    summary: >-
      OFUT1 binds Notch in the ER; this binding underlies its chaperone
      function in Notch folding and ER exit.
    action: ACCEPT
    reason: >-
      Direct binding of OFUT1 to Notch is shown in the cited paper and is the
      molecular basis of its catalytic-activity-independent Notch chaperone
      function. Notch binding is informative here because OFUT1 is a
      Notch-selective folding/trafficking factor, not a generic glycosylation
      enzyme-substrate encounter.
    supported_by:
    - reference_id: PMID:15692013
      supporting_text: >-
        OFUT1 could bind to Notch, was required for the trafficking of
        wild-type Notch out of the endoplasmic reticulum, and could partially
        rescue defects in secretion and ligand binding associated with Notch
        point mutations.
