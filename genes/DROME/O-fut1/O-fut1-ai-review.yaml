- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:15692013
  qualifier: enables
  review:
    summary: >-
      OFUT1 has a Notch chaperone activity, separable from its
      fucosyltransferase activity, that facilitates folding and secretion of
      Notch.
    action: NEW
    reason: >-
      The chaperone activity is a distinct molecular function of O-fut1 (the
      catalytically dead R245A isoform retains it and rescues embryonic
      neurogenesis), and it is not captured by Notch binding or by the
      fucosyltransferase term. The activity is performed by O-fut1 itself on
      Notch. Evidence is cell-based (folding/secretion rescue of Notch point
      mutants) rather than an in vitro refolding assay, and it is Notch-selective;
      mammalian POFUT1 chaperone activity is less clear.
    supported_by:
    - reference_id: PMID:15692013
      supporting_text: >-
        We found that in Drosophila, Protein O-fucosyltransferase 1 (OFUT1),
        an enzyme that glycosylates epidermal growth factor-like domains of
        Notch, also has a distinct Notch chaperone activity.
    - reference_id: PMID:18194540
      supporting_text: >-
        Our results establish that Notch does not need to be O-fucosylated for
        fringe-independent Notch signaling in Drosophila; the chaperone
        activity of OFUT1 is sufficient for the generation of functional
        Notch.
