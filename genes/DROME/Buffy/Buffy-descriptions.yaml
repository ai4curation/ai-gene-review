      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Correct that Buffy is one of two fly Bcl-2 proteins. Mentions only
      energy metabolism; omits its anti-apoptotic role.
- source: Alliance_Automated
  text: Predicted to enable channel activity. Involved in several processes, including
    cellular response to starvation; ectopic germ cell programmed cell death; and
    positive regulation of macroautophagy. Located in endoplasmic reticulum. Part
    of Bcl-2 family protein complex. Is active in mitochondrion. Is expressed in anterior-posterior
    subdivision of organism; mesoderm; and salivary gland. Used to study Parkinson's
    disease. Orthologous to human BOK (BCL2 family apoptosis regulator BOK).
  source_type: automated
