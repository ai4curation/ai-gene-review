- source: Alliance_Imported
  text: Buffy (Buffy) encodes one of the two Bcl-2 family members in Drosophila (the
    other being the product of Debcl). Its loss has been linked to altered energy
    metabolism in larvae.
  source_type: curated
  url: https://flybase.org/reports/Buffy.html
