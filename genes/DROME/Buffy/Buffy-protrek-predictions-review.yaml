  predicted_term:
    id: GO:0051433
    label: BH2 domain binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 17.10). Buffy is a Bcl-2 family protein and therefore contains BH domains;
      this term is for proteins that bind someone else's BH2 domain, and the distinction between having
      a domain and binding one is exactly the confusion seen for the F-BAR protein gas7a in the other
      ProTrek cohort. Here it is harder to dismiss: Bcl-2 family members genuinely heterodimerise
      through their BH surfaces, and Buffy is documented to antagonise Debcl. But BH2-specific binding
      is not annotated for Buffy and the canonical interaction interface is BH3-in-groove. Recorded
      as uncertain.
    supported_by:
