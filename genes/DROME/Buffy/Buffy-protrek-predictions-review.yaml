  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Buffy, the Drosophila anti-apoptotic Bcl-2 family protein.
  The model places it in the Bcl-2 world confidently and correctly - rank 2 is an exact GOA match
  supported by IPI - and then names two specific mammalian complexes that have no Drosophila counterpart.
  The free-text channel is worse, returning C. elegans ced-9/ced-3 descriptions. Buffy's distinctive
  biology in this review, antagonising Debcl-driven mitochondrial apoptosis through the Debcl-Drp1
  axis, is not reached by either channel. Assessment: 1 correct not novel (CNN), 1 uncertain (UNC),
  1 paralog incorrect (PLI).
