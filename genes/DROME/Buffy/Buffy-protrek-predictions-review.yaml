    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 3 (score 16.97), scored MORE_SPECIFIC as a descendant of the correct rank-2 complex term.
      BIM (BCL2L11) is a mammalian BH3-only protein with no Drosophila ortholog; the fly Bcl-2 family
      comprises just Buffy and Debcl and lacks the expanded BH3-only repertoire. Rank 5 offers the
      BIM-BCL-xl complex on the same basis. Naming two vertebrate-specific complexes for a fly protein,
      both as refinements of a correct parent, is the same pattern as the Cul4B call for COP1.
