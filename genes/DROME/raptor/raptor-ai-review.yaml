gene_symbol: raptor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Raptor (regulatory-associated protein of TOR) is the defining scaffold subunit of TOR complex
  1 (TORC1), composed of an N-terminal caspase-like domain, HEAT repeats and a C-terminal WD40 beta-propeller.
  Raptor binds TOR and recruits TORC1 substrates such as S6K and 4E-BP/Thor, and in other species couples
  TORC1 to amino-acid signals through binding to Rag GTPases. In Drosophila, raptor is required for TORC1-dependent
  S6K Thr398 phosphorylation, cell growth and cell size, for suppression of autophagy (including in the
  developmentally dying larval midgut), for TORC1-mediated negative feedback on insulin/Akt signaling,
  and in muscle for normal development and eclosion.
