id: Q9VFJ3
gene_symbol: HtrA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: HtrA2 (Omi) is the Drosophila orthologue of the mitochondrial HtrA-family serine protease
  HTRA2/Omi, comprising a trypsin-like serine protease domain and a C-terminal PDZ domain. It is imported
  into mitochondria, where it resides in the intermembrane space and undergoes processive proteolytic
  maturation that exposes N-terminal IAP-binding motifs. Upon apoptotic stimuli mature HtrA2 is released
  from the intermembrane space, binds the BIR domains of DIAP1 and proteolytically cleaves and degrades
  DIAP1, relieving caspase inhibition and promoting cell death when overexpressed; DIAP1 in turn ubiquitinates
  HtrA2. Loss-of-function studies indicate it is largely dispensable for developmental and stress-induced
  apoptosis but required, through its catalytic activity, for the spontaneous death of male germ cells
  in the testis. It acts genetically downstream of Pink1 in some assays, and is processed by the mitochondrial
  rhomboid protease Rhomboid-7.
