descriptions:
- source: UniProt
  text: Serine protease that shows proteolytic activity against a non-specific substrate
    beta-casein. Promotes or induces cell death either by direct binding to and inhibition
    of BIRC proteins (also called inhibitor of apoptosis proteins, IAPs), leading
    to an increase in caspase activity, or by a BIRC inhibition-independent, caspase-
    independent and serine protease activity-dependent mechanism. Can antagonize antiapoptotic
    activity of th/Diap1 by directly inducing the degradation of th/Diap1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VFJ3
  source_id: Q9VFJ3
