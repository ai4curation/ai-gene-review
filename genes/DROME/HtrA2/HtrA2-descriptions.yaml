    - rubric: specificity
      score: 4
    overall_notes: Correct on serine protease activity and DIAP1 binding and degradation
      to promote death. Omits that HtrA2 is largely dispensable for apoptosis and
      acts mainly in male germ cell death; the beta-casein and caspase-independent
      claims are generic.
- source: Alliance_Automated
  text: Enables serine-type endopeptidase activity. Involved in several processes,
    including ectopic germ cell programmed cell death; mitochondrion organization;
    and spermatogenesis. Located in Nebenkern; cytosol; and mitochondrial envelope.
    Is expressed in adult head. Used to study Parkinson's disease. Human ortholog(s)
    of this gene implicated in several diseases, including 3-methylglutaconic aciduria
    type 8; CADASIL (multiple); gastrointestinal system cancer (multiple); macular
    degeneration (multiple); and neurodegenerative disease (multiple). Orthologous
    to several human genes including HTRA2 (HtrA serine peptidase 2).
