  label: Drosophila melanogaster
description: 'Wdr20 is a WD40-repeat protein that, with Uaf1, forms the regulatory part of the Usp12-46
  deubiquitylase complex. Wdr20 is an obligate stimulatory subunit of the USP12/USP46 proteases: it stabilizes
  Usp12-46 protein and allosterically increases its catalytic efficiency. The Usp46-Uaf1-Wdr20 complex
  deubiquitylates the Wingless co-receptor Arrow/LRP6, increasing its cell-surface abundance and the sensitivity
  of cells to Wingless, so Wdr20 promotes Wingless signaling strength during development. Wdr20 is predicted
  to be present in the cytoplasm and nucleus.'
