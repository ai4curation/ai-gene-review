suggested_questions:
- question: Does Wdr20 have Usp46-independent roles, for example with Usp12-46 substrates other than Arrow
    such as Notch?
suggested_experiments:
- hypothesis: Wdr20 is required for Usp12-46-dependent Notch receptor trafficking as well as Arrow stabilization.
  description: Deplete Wdr20 in wing discs and S2 cells and measure Notch surface levels and lysosomal
    trafficking alongside Arrow levels.
