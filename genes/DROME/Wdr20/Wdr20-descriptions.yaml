descriptions:
- source: UniProt
  text: Regulatory component of the Usp12-46 deubiquitylase complex (PubMed:37798281).
    This complex deubiquitylates the wg/wingless- signaling receptor arr/arrow, which
    stabilizes the receptor and increases its concentration at the cell surface; this
    enhances the sensitivity of cells to wg/wingless-signal stimulation (PubMed:37798281).
    This increases the amplitude and spatial range of the signaling response to the
    wg/wingless morphogen gradient, facilitating the precise concentration-dependent
    regulation of its target genes (PubMed:37798281). Required for wg/wingless-mediated
    signaling in the wing imaginal disc and for wg/wingless-dependent regulation of
    intestinal stem cell proliferation (PubMed:37798281).
  source_type: curated
