gene_symbol: mad2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Drosophila Mad2 is the fly ortholog of the HORMA-domain spindle assembly checkpoint (SAC)
  protein MAD2 (MAD2L1). It is nuclear and partly nuclear-envelope associated in interphase, where Mad1-C-Mad2
  is docked on the nuclear-basket protein Megator (TPR ortholog). In prometaphase Mad2 is recruited by
  Mad1 and the Rod/Zw10/Zwilch complex to the corona of unattached kinetochores, where the Mad1-C-Mad2
  template converts open Mad2 into closed Mad2 that binds Cdc20 and, with BubR1 and Bub3, inhibits APC/C-Cdc20
  to delay anaphase. Once kinetochores attach, Mad2 is stripped by dynein (via Spindly) along kinetochore
  microtubules to the poles. A pool also sits in a Megator-defined spindle matrix. Loss of Mad2 abolishes
  the checkpoint arrest after spindle damage and speeds up mitosis through premature cyclin B degradation.
  Unlike in other metazoans, mad2-null flies are viable and fertile, because spindle assembly in fly cells
  is fast enough to finish before anaphase. Mad2 becomes essential when spindle assembly is slowed, for
  example in cells with extra centrosomes or reduplicated (polytene) chromosomes.
