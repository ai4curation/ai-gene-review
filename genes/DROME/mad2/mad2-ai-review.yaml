- id: file:DROME/mad2/mad2-deep-research-manual.md
  title: Manual literature synthesis for Drosophila mad2
  findings: []
core_functions:
- description: 'Core spindle assembly checkpoint component: at unattached kinetochores, the Mad1-C-Mad2
    template converts open Mad2 into closed Mad2, which binds Cdc20 and, as part of the mitotic checkpoint
    complex, inhibits APC/C-Cdc20 so that cyclin B degradation and anaphase onset wait until all kinetochores
    are attached.'
  molecular_function:
    id: GO:1990948
    label: ubiquitin ligase inhibitor activity
  directly_involved_in:
  - id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  locations:
  - id: GO:0000776
    label: kinetochore
  in_complex:
    id: GO:1990728
    label: mitotic spindle assembly checkpoint MAD1-MAD2 complex
  supported_by:
  - reference_id: PMID:17182852
    supporting_text: Depletion of Mad2 by RNAi from S2 cells shows that it is essential to prevent mitotic
      exit after spindle damage
  - reference_id: PMID:20421417
    supporting_text: BubR1 and Mad2 can bind to Cdc20 independently
  - reference_id: PMID:31913420
    supporting_text: The strength of SAC response is dictated by the amount of Mad1-C-Mad2 present at
      KTs
  - reference_id: PMID:15886105
    supporting_text: Mad2 and Rod colocalize to the outermost kinetochore region (the corona)
suggested_questions:
- question: Why is the SAC dispensable for viability in Drosophila (mad2-null flies are viable and fertile)
    while MAD2 loss is lethal in mammals; is the difference fully explained by faster spindle assembly
    or by Mad2-independent BubR1-Cdc20 inhibition?
- question: Does Drosophila Mad2 directly inhibit APC/C-Cdc20 in a reconstituted fly MCC, and how much
    does it contribute relative to BubR1, given that BubR1 binds Cdc20 independently of Mad2?
- question: Is the interphase Mad1-C-Mad2 pool docked on Megator at nuclear pores catalytically active
    in premitotic MCC assembly in flies?
- question: Does Mad2 have any direct role in male germline stem cell asymmetric division, or does the
    Megator-rescue result reflect SAC-dependent mitotic timing only?
suggested_experiments:
- description: Reconstitute Drosophila MCC (Mad2, BubR1, Bub3, Cdc20) with purified fly APC/C and measure
    cyclin B ubiquitination with wild-type versus closure-defective (e.g. C-terminal safety-belt) Mad2
    mutants.
- description: Test mad2-null and mad2 safety-belt mutant clones in testis germline stem cells for GSC
    loss and APC2/spindle orientation defects to determine whether Mad2 is directly required for asymmetric
    GSC division.
