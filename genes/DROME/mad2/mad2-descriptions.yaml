- source: Alliance_Imported
  text: mad2 (mad2) encodes a conserved component of the spindle checkpoint. During
    mitosis, it is recruited to unattached kinetochores, where it binds the products
    of Mad1 and fzy, promoting the assembly of the mitotic checkpoint complex. During
    interphase, the product of mad2 is intranuclear, bound to the product of Mad1,
    and associated primarily with the nuclear pore complex.
  source_type: curated
  url: https://flybase.org/reports/mad2.html
  source_id: FB:FBgn0035640
