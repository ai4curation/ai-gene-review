- source: Alliance_Automated
  text: Involved in chromosome organization; male germ-line stem cell asymmetric division;
    and regulation of cell cycle process. Located in several cellular components,
    including nucleus; spindle; and spindle matrix. Is expressed in several structures,
    including antennal anlage; antennal primordium; central brain anlage; ganglia;
    and head epidermis primordium. Used to study cancer and microcephaly. Orthologous
    to human MAD2L1 (mitotic arrest deficient 2 like 1).
