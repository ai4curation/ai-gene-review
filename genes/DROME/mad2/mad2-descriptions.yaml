descriptions:
- source: UniProt
  text: Component of the mitotic checkpoint complex (MCC), which inhibits APC/C and
    delays chromosome segregation until all chromosomes are properly attached to the
    mitotic spindle. The MCC, which consists of CDC20, MAD2L1/MAD2, BUB1B/BUBR1 and
    BUB3, is a key player of the spindle assembly checkpoint. The MCC-bound APC/C
    complex is inactive and this delays the metaphase/anaphase transition. When the
    spindle assembly checkpoint is silenced, the MCC-APC/C complex recruits the E2
    enzyme UBCH10 and triggers the auto-ubiquitination of CDC20 in the MCC, thereby
    reactivating APC/C for transition into anaphase. In the closed conformation (C-MAD2)
    forms a heterotetrameric complex with MAD1L1 at unattached kinetochores during
    prometaphase, the complex recruits open conformation molecules of MAD2L1 (O-MAD2)
    and then promotes the conversion of O-MAD2 to C-MAD2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VRQ2
  source_id: Q9VRQ2
