- term:
    id: GO:0048699
    label: generation of neurons
  evidence_type: IMP
  original_reference_id: PMID:25291190
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: dati is required in neuronal precursors and postmitotic neurons for the correct number and distribution
      of cholinergic neurons.
    reason: dati1 homozygotes lose cholinergic projection neurons in the antennal lobe and have extra, enlarged
      CHA-positive cells near the lateral horn. The authors conclude that dati is needed in precursors as well as
      postmitotic neurons. They also state that dati does not determine cholinergic identity as such, so generation
      of neurons is preferred over a fate-commitment term. This is consistent with its expression late in the embryonic
      neuroblast transcription-factor cascade.
    supported_by:
    - reference_id: PMID:25291190
      supporting_text: Homozygosity for dati1 causes loss of cholinergic projection neurons in the antennal lobe.
    - reference_id: PMID:25291190
      supporting_text: Together, these results show that dati is required in postmitotic neurons as well as in the
        precursors of these cells.
    - reference_id: PMID:25291190
      supporting_text: these experiments revealed that dati is not required to determine cholinergic cell identity.
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:25291190
  review:
    action: NEW
    summary: DATI is a nuclear six-finger C2H2 protein classified as a Krueppel-like transcription factor; DNA-binding
      transcription factor activity is inferred from domain architecture.
    reason: The protein carries six C2H2 zinc fingers detected by PROSITE/Pfam/InterPro, the fingers are intact
      in every annotated isoform, and DATI is nuclear in neurons. The primary study classifies it as a Krueppel-like
      zinc-finger transcription factor. No DNA-binding or reporter assay exists for DATI itself, and its relatives
      (Squeeze, Rotund, ZNF384) are paralogs or distant homologs in different PANTHER subfamilies or families. The
      general term is therefore proposed, without RNA polymerase II specificity, a binding motif, or an activator/repressor
      direction. Nmp4/ZNF384 finger-mapping data are not transferred.
    supported_by:
    - reference_id: PMID:25291190
      supporting_text: dati encodes a zinc finger transcription factor closely related to rotund (rn) and squeeze
        (sqz) with homologs in several species, including humans
    - reference_id: file:DROME/dati/dati-uniprot.txt
      supporting_text: DR   InterPro; IPR013087; Znf_C2H2_type.
    - reference_id: file:DROME/dati/dati-uniprot.txt
      supporting_text: DR   PROSITE; PS50157; ZINC_FINGER_C2H2_2; 6.
    - reference_id: file:DROME/dati/dati-bioinformatics/RESULTS-rereview.md
      supporting_text: All six C2H2 motifs and the flanking sequence are otherwise identical, so Q9V4C9 is a full-length
        product of the gene and not a fragment.
    - reference_id: file:DROME/dati/dati-deep-research-falcon.md
      supporting_text: Its exact DNA-binding motif, direct target genes, transcriptional polarity, cofactors, and
        isoform-specific functions remain unknown.
