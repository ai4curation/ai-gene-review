- term:
    id: GO:0045925
    label: positive regulation of female receptivity
  evidence_type: IMP
  original_reference_id: PMID:25291190
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: dati is required in a small set of cholinergic neurons for female courtship acceptance; this is a well-supported
      behavioral consequence of dati loss.
    reason: Rejection is reverted by precise excision, reproduced by pan-neuronal and cholinergic RNAi, and separable
      from the locomotor defect. Positive regulation of female receptivity is the correct term for the phenotype.
      DATI acts by shaping the neurons that mediate the behavior, not as a regulator of the behavior itself, so
      the term is kept as non-core.
