suggested_questions:
- question: Which DNA sequence do the six DATI zinc fingers recognise, and does DATI activate or repress its targets
    in cholinergic neurons?
- question: Do the isoform B and A/C forms, which differ by a 10-residue insertion in finger 4, have different DNA-binding
    specificity?
- question: Is PANTHER placement of dati products in PTHR16515:SF49 (isoforms A-C), SF66 (GH06573p, with Squeeze)
    and PTHR24393 (isoform D) a classification artefact, given the identical finger arrays?
suggested_experiments:
- description: Determine the DATI binding motif by SELEX or protein-binding microarray of the finger array (isoforms
    B and A/C), then profile occupancy in brain neurons by targeted DamID or CUT&RUN.
- description: Profile transcriptomes of dati-RNAi versus control Cha-Gal4 neurons, and test candidate targets in
    reporter assays to establish activator or repressor function.
