id: Q9V4C9
gene_symbol: dati
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Datilografo (dati, CG2052) is a nuclear Krueppel-like C2H2 zinc-finger protein of Drosophila, carrying
  an array of six C2H2 fingers in the middle of a long, largely disordered polypeptide. Its fingers are most similar
  to those of the fly neuronal regulators Squeeze and Rotund and to vertebrate ZNF384, but true dati orthologs are
  restricted to arthropods. DATI is expressed in neuronal nuclei of the embryonic, larval and adult central nervous
  system. It is required for the correct number, distribution and projections of cholinergic neurons in the antennal
  lobe and lateral horn, and in both neuronal precursors and postmitotic neurons. Through a small set of cholinergic
  neurons it supports female acceptance of male courtship; separately it supports adult locomotion and normal mushroom-body
  gamma-lobe morphology. It is presumed to act as a sequence-specific transcription factor, but its DNA-binding
  motif, direct target genes and whether it activates or represses transcription have not been determined.
