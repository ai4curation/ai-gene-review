  review:
    action: KEEP_AS_NON_CORE
    summary: Adult locomotory behavior is a genuine IMP phenotype of dati mutants and RNAi, separable from the receptivity
      phenotype.
    reason: Mutant females have a climbing deficit that maps to different neurons from those needed for courtship
      acceptance. The term records an organism-level behavioral consequence of dati loss in the nervous system and
