taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Datilografo is a nuclear C2H2 zinc-finger transcriptional regulator related to Rotund/Squeeze
  and vertebrate ZNF384. It contributes to neuronal subtype specification and projection development in
  the fly brain. Its function in selected cholinergic neurons supports female courtship acceptance, while
  distinct neuronal contexts contribute to locomotor behavior. Its endogenous DNA targets and the direction
  of regulation at individual promoters remain unresolved.
