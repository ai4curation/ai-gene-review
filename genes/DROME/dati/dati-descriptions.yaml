    - rubric: specificity
      score: 3
    overall_notes: 'Correct: zinc-finger factor needed for neuronal differentiation
      in VNC and brain and in cholinergic neurons for female acceptance of courtship.
      Locomotion role omitted.'
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II transcription regulatory region sequence-specific
    DNA binding activity. Involved in adult locomotory behavior; nervous system development;
    and positive regulation of female receptivity. Predicted to be active in nucleus.
    Is expressed in several structures, including brain; embryonic abdomen; embryonic
    pars intercerebralis; larval nervous system; and larval ventral nerve cord. Human
    ortholog(s) of this gene implicated in speech disorder. Orthologous to human ZNF142
    (zinc finger protein 142).
  source_type: automated
