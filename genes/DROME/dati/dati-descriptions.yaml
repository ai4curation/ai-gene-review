descriptions:
- source: Alliance_Imported
  text: datilografo (dati) encodes a conserved zinc finger transcription factor required
    for the differentiation of neurons in the ventral nerve cord and the brain. In
    adult brains, the product of dati is required in cholinergic neurons to generate
    the decisions of accepting or rejecting male courtship.
  source_type: curated
  url: https://flybase.org/reports/dati.html
  source_id: FB:FBgn0262636
