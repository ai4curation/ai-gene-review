id: Q9V4C9
gene_symbol: dati
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
status: COMPLETE
description: Neither ProtNLM2 GO prediction for dati can be validated or refuted. DATI is a nuclear
  six-finger C2H2 protein that the only primary study classifies as a Krueppel-like transcription factor
  required in cholinergic neurons, which supports a general DNA-binding transcription factor activity.
  No DNA-binding, motif, target-promoter or reporter assay exists for DATI, its closest relatives with
  DNA-binding data sit in other PANTHER families, and PTHR16515 is functionally heterogeneous with no
  PAINT node covering dati. Both the RNA polymerase II cis-regulatory DNA-binding claim and the activator
  claim are therefore uncertain.
