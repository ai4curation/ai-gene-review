  review:
    assessment: UNC
    confidence_score: 1
    summary: The prediction is not in GOA, which carries no molecular-function annotation for dati. A
      general DNA-binding transcription factor role is supported by the nuclear six-finger C2H2 architecture
      and the primary study's classification of DATI as a Krueppel-like zinc-finger transcription factor.
      That study establishes requirements in neuronal precursors and postmitotic neurons but does not
      measure activation of any target promoter, and no reporter or transcriptome assay for DATI exists.
      The related Rotund, Squeeze and ZNF384 proteins are in different PANTHER subfamilies or families,
      and PTHR16515 is heterogeneous with no PAINT node placed over dati, so neither the activating direction
      nor RNA polymerase II specificity can be transferred. The claim cannot be validated or refuted.
