suggested_questions:
- question: Is Cactus the only physiological substrate needed for Toll signalling, or do Pelle phosphorylation
    of Tube, Toll, dTRAF2 and Cka each contribute in vivo? Which of these in vitro substrates are phosphorylated
    by endogenous Pelle after infection?
- question: Pelle has no counterpart of the IKK complex acting between it and Cactus. Should GO:0008384
    IkappaB kinase activity be applied more widely to Pelle orthologues in insects, or is the Pelle-to-Cactus
    shortcut specific to Drosophila and close relatives?
- question: The IRAK clade IBA propagates LPS-mediated signalling and nuclear localisation to Pelle. Should
    the PAINT node carrying GO:0031663 be moved to a vertebrate-specific node so that it no longer reaches
    insect Pelle?
suggested_experiments:
- description: Phosphoproteomics of fat bodies from wild-type and pll kinase-dead (K240R) knock-in flies
    after Micrococcus luteus infection, to identify Pelle-dependent phosphosites on Cactus, Tube, Cka
    and other candidates in vivo.
  hypothesis: Cactus degron phosphorylation depends on Pelle kinase activity in vivo, and other reported
    substrates may or may not be phosphorylated under physiological conditions.
  experiment_type: quantitative phosphoproteomics
- description: Reconstitute Toll-MyD88-Tube-Pelle assembly with purified proteins and cryo-EM, testing
    how death domain oligomerisation drives Pelle autophosphorylation.
  hypothesis: Pelle is activated by proximity-induced trans-autophosphorylation in a higher-order death
    domain assembly analogous to the vertebrate Myddosome.
  experiment_type: structural biology
