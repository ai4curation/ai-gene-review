- term:
    id: GO:0002804
    label: positive regulation of antifungal peptide production
  evidence_type: IDA
  original_reference_id: PMID:11743586
  qualifier: involved_in
  review:
    summary: Pelle is required downstream of MyD88 and Tube for Toll-dependent induction of the antifungal
      peptide Drosomycin.
    action: ACCEPT
    reason: Tauszig-Delamasure et al. showed that MyD88-driven Drs expression requires Tube and Pelle.
      Drosomycin induction is the principal transcriptional output of the Toll pathway in the fat body,
      and Pelle is the kinase that transduces that signal, so this regulatory annotation is a fair description
      of Pelle's role.
    supported_by:
    - reference_id: PMID:11743586
      supporting_text: required the death domain proteins Tube and Pelle to activate expression of Drs,
        which encodes Drosomycin
- term:
