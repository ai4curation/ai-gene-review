  review:
    summary: Pelle directly phosphorylates Cactus, the Drosophila IkappaB, at the signal-responsive degron
      serines, and also phosphorylates Ser32/Ser36 of the IkappaBalpha degron in vitro.
    action: NEW
    reason: 'Participation: Pelle is the catalyst of the step (in vitro kinase assays with recombinant
