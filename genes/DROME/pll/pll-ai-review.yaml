      and screens found no other Cactus kinase). Comparator: the catalytic IKK subunits (human CHUK/IKBKB,
      fly IKKbeta) carry GO:0008384 as the enzymes that phosphorylate IkappaB; Pelle stands in that same
      enzymatic role for Cactus. GO:0008384 is_a GO:0004674, which Pelle already carries, so this adds
      specificity rather than redundancy.'
