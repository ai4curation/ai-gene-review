id: Q05652
gene_symbol: pll
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pelle (pll) is the Drosophila member of the IRAK family of serine/threonine protein kinases,
  with an N-terminal death domain and a C-terminal kinase domain. It is the kinase of the Toll receptor
  pathway. After the cytokine Spaetzle activates Toll, the adaptor MyD88 binds the Toll TIR domain and
  recruits the death domain adaptor Tube, which in turn recruits Pelle through a death domain heterotrimer
  at the plasma membrane. Clustering activates Pelle, which autophosphorylates and phosphorylates the
  IkappaB homologue Cactus at its signal-responsive degron; the phosphorylated Cactus is recognised by
  the F-box protein Slimb and degraded, releasing the NF-kappaB family transcription factors Dorsal and
  Dif to enter the nucleus. Maternally supplied Pelle is essential for dorsoventral axis specification
  of the embryo, and in larvae and adults Pelle is required for Toll-dependent induction of antifungal
  and anti-Gram-positive antimicrobial peptides such as Drosomycin. Pelle has also been reported to phosphorylate
  the STRIPAK subunit Cka, activating Hippo signalling in the fat body, and it is needed for embryonic
  muscle patterning.
