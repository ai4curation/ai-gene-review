    overall_notes: Correct for the embryonic Toll pathway and Tube recruitment, but
      omits the kinase activity, Cactus phosphorylation and immune role.
- source: Alliance_Imported
  text: Pelle (pll) encodes a tyrosine kinase-like family serine-threonine protein
    kinase that functions in the Toll pathway, a signaling cascade that plays key
    roles in various developmental and immune processes, notably embryonic dorso-ventral
    patterning and regulation of antimicrobial peptide production.
  source_type: curated
  url: https://flybase.org/reports/pll.html
  source_id: FB:FBgn0010441
