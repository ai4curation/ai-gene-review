descriptions:
- source: UniProt
  text: Plays an essential role in the Tl receptor signaling pathway that establishes
    embryonic dorsoventral polarity; the signal directs import of dl into ventral
    and ventrolateral nuclei, thereby establishing dorsoventral polarity. Tub recruits
    pll to the plasma membrane and protein-protein interaction activates pll.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05652
  source_id: Q05652
