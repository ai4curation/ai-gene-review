    overall_notes: 'Correct: TKL-family Ser/Thr kinase of the Toll pathway in dorsoventral
      patterning and antimicrobial peptide production. Tube and Cactus are not named.'
- source: Alliance_Automated
  text: Enables protein domain specific binding activity; protein serine kinase activity;
    and protein serine/threonine kinase activity. Involved in several processes, including
    Toll signaling pathway; antifungal innate immune response; and dorsal/ventral
    pattern formation. Located in cytoplasm and plasma membrane. Human ortholog(s)
    of this gene implicated in several diseases, including carcinoma (multiple); diffuse
    scleroderma; immune system disease (multiple); maxillary sinusitis; and pulmonary
    tuberculosis. Orthologous to several human genes including IRAK1 (interleukin
    1 receptor associated kinase 1).
