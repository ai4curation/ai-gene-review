core_functions:
- description: Catalytic serine/threonine kinase subunit of the chromosomal passenger complex; at centromeres
    and kinetochores it phosphorylates chromatin and kinetochore substrates (histone H3 Ser10, MEI-S332)
    to drive chromosome condensation, correct kinetochore-microtubule attachments and ensure sister chromatid
    segregation.
