suggested_questions:
- question: Does Drosophila Aurora B directly phosphorylate Shrub (ESCRT-III) in germline stem cells,
    as human Aurora B phosphorylates CHMP4C, or is Shrub regulated indirectly through Borealin binding?
- question: Does Aurora B contribute to planar spindle orientation in epithelia (via Lgl phosphorylation)
    independently of its CPC localization, given that Aurora A also phosphorylates Lgl?
suggested_experiments:
- hypothesis: Aurora B directly phosphorylates Shrub to delay germline stem cell abscission.
  description: Map Aurora B sites on Shrub by in vitro kinase assays and mass spectrometry, then test
    phospho-dead and phosphomimetic Shrub knock-ins for germline stem cell abscission timing and stem-cyst
    formation.
  experiment_type: in vitro kinase assay plus knock-in genetics
