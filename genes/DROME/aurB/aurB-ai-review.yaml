id: Q9VKN7
gene_symbol: aurB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: aurora B (aurB) encodes the Drosophila Aurora B serine/threonine protein kinase, the catalytic
  subunit of the chromosomal passenger complex (CPC) with Incenp, Deterin (Survivin) and Borealin (Borr)
  or, in male meiosis, Australin. As a passenger protein it associates with condensing chromatin, concentrates
  at centromeres and kinetochores in prometaphase and metaphase, relocates to the central spindle midzone
  at anaphase and to the midbody in telophase. Aurora B phosphorylates histone H3 on serine 10 and is
  required for condensin recruitment and chromosome condensation, correction of kinetochore-microtubule
  attachments and faithful sister chromatid segregation, central spindle organization (including Pavarotti
  localization) and cytokinesis. In meiosis it phosphorylates the Shugoshin MEI-S332 to stabilize its
  centromeric association. Additional fly substrates include Lgl, whose phosphorylation releases it from
  the cortex during mitosis to permit planar spindle orientation, and Cyclin B; in the female germline
  Aurora B acts as an abscission timer, delaying abscission through inhibitory effects on Cyclin B and
  the ESCRT-III protein Shrub.
