- source: Alliance_Imported
  text: aurora B (aurB) encodes a serine-threonine kinase and member of the chromosomal
    passenger complex. It plays multiple roles in mitosis including the correction
    of erroneous chromosome-spindle interactions, chromosome condensation, kinetochore
    assembly, spindle assembly checkpoint and cytokinesis.
