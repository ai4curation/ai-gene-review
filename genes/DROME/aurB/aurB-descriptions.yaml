descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase that mediates both meiotic and mitotic chromosome
    segregation. Required for histone H3 'Ser-10' phosphorylation. Phosphorylates
    mei-S332 within residues 124-126 and stabilizes its association with centromeres
    during meiosis. May regulate the function of the ESCRT-III complex core component
    shrb during abscission of germline cells in oogenesis (PubMed:25647097).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VKN7
