- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including female germ-line stem cell asymmetric division; midbody abscission;
    and mitotic chromosome condensation. Located in kinetochore; meiotic spindle midzone;
    and midbody. Part of chromosome passenger complex. Is expressed in several structures,
    including antennal anlage; antennal primordium; female germline cell; ganglia;
    and head epidermis primordium.
