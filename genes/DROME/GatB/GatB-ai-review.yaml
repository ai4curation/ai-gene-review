  review:
    summary: Glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity with enables qualifier (UniRule/Rhea).
    action: ACCEPT
    reason: GatB carries the catalytic sites for the EC 6.3.5.7 reaction itself, phosphorylating and
      amidating Glu-tRNA(Gln) with ammonia supplied by GatA. The standard applied across this batch is that a
      subunit that catalyses the ligase reaction may enable it (GatB), whereas a subunit that only supports
      it, by supplying a substrate or binding tRNA, contributes to it (GatA, GatC, CG3434). The contributes_to
      rows additionally record that the holoenzyme needs all three subunits.
    supported_by:
    - reference_id: file:DROME/GatB/GatB-uniprot.txt
      supporting_text: This subunit probably recognizes tRNA(Gln)
