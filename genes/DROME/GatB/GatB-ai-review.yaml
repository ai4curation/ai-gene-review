id: Q9VCD0
gene_symbol: GatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: GatB (CG5463) encodes the B subunit of the mitochondrial glutamyl-tRNA(Gln) amidotransferase
  (GatCAB). Because mitochondria lack a glutaminyl-tRNA synthetase, tRNA(Gln) is charged with glutamate,
  and GatCAB converts the misacylated Glu-tRNA(Gln) into Gln-tRNA(Gln). GatB binds the tRNA, uses ATP
  to phosphorylate the glutamate side chain and amidates the activated intermediate with ammonia channelled
  from the glutaminase subunit GatA. The complex supplies Gln-tRNA(Gln) for mitochondrial translation.
  Function is inferred from orthologs and from the conserved GatB domain; GatB has not been studied directly
  in flies.
