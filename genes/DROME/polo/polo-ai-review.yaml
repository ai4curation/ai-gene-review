core_functions:
- description: 'Centrosome maturation kinase: Polo is recruited to centrosomes/centrioles and drives pericentriolar
    material recruitment (Polo-dependent Cnn phosphorylation) and centrosomal microtubule nucleation (phosphorylation
    of Asp), enabling bipolar spindle assembly.'
