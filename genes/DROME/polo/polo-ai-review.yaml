id: P52304
gene_symbol: polo
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'polo encodes the sole Drosophila Polo-like kinase, the founding member of the PLK family
  and the fly ortholog of human PLK1. The 576-residue protein has an N-terminal Ser/Thr protein kinase
  domain (activated by phosphorylation of Thr182 in the T-loop, by Aurora kinases in dividing cells and
  by the kinase Back Seat Driver in post-mitotic mesoderm) and a C-terminal polo-box domain that targets
  it to phospho-primed partners. Polo is cytoplasmic in interphase, where a pool is held on microtubules
  by Map205, and during division it moves sequentially to centrosomes/centrioles, kinetochores (outer
  kinetochore), the central spindle and the midbody. Its core activities are in cell division: it drives
  centrosome maturation and centrosomal microtubule nucleation (Polo-dependent phosphorylation of Centrosomin
  and Asp), promotes amphitelic kinetochore-microtubule attachment and chromosome bi-orientation, and
  is required for central spindle assembly, contractile ring formation and cytokinesis, including in male
  meiosis. Polo also acts in female meiosis (meiotic entry in the oocyte, MTOC function in meiosis II
  and the zygote), where Matrimony binds and inhibits it to maintain prophase I arrest. Through phosphorylation
  of specific substrates it contributes to neuroblast asymmetric division (Pon/Numb), oocyte determination
  (Maelstrom), Greatwall nuclear exclusion at mitotic entry, cardiac progenitor divisions, and myotube
  guidance after cell-cycle exit.'
