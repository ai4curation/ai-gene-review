  - id: GO:0000922
    label: spindle pole
  supported_by:
  - reference_id: PMID:18798690
    supporting_text: the individual depletion of only two proteins, Polo and Centrosomin (Cnn) can completely
      block centrosome maturation
  - reference_id: PMID:11283617
