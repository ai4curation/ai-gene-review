suggested_questions:
- question: Which Polo substrates at the central spindle (e.g. Pav-KLP/centralspindlin, Tum) are phosphorylated
    directly to trigger contractile ring assembly in Drosophila, as RACGAP1 is by PLK1 in human cells?
- question: Is the GO:0005828 kinetochore microtubule annotation from PMID:17046997 supported by the full
    text, or does it reflect central spindle microtubules?
- question: Does Polo act directly in post-mitotic myotube guidance through the same Tum/Pav module it
    uses in cytokinesis, and should such non-dividing roles be modelled separately?
suggested_experiments:
- description: Phosphoproteomics of Drosophila S2 cells or spermatocytes after acute Polo inhibition (analog-sensitive
    allele) during anaphase to identify direct central spindle and cortical substrates required for contractile
    ring assembly.
- description: Phospho-site mutant rescue of Pon, Asp and Cnn in vivo to separate direct Polo phosphorylation
    from indirect requirements in neuroblast asymmetry and centrosome maturation.
