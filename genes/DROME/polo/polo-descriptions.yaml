      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: 'Dated and narrow: ''may play a role'' in the mitotic cycle, plus
      augmin localization in mitosis and male meiosis. Omits centrosome maturation,
      kinetochore attachment and cytokinesis.'
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including cytoskeleton organization; larval somatic muscle development; and nuclear
    division. Located in several cellular components, including kinetochore; microtubule
    cytoskeleton; and midbody. Part of outer kinetochore. Is active in nucleus. Is
    expressed in several structures, including cardiogenic mesoderm; embryonic/larval
    optic lobe; ganglia; imaginal disc; and testis. Human ortholog(s) of this gene
    implicated in urinary bladder cancer. Orthologous to human PLK1 (polo like kinase
    1).
  source_type: automated
