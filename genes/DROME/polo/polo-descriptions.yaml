descriptions:
- source: UniProt
  text: May play a role in regulating both nuclear and cytoplasmic aspects of the
    mitotic cycle (PubMed:1660828). Regulates localization of the augmin complex during
    mitosis by ensuring its location on mitotic spindles (PubMed:24829288). Also regulates
    augmin complex localization during male meiosis by promoting its placement at
    kinetochores while preventing its association with spindle microtubules (PubMed:24829288).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52304
  source_id: P52304
