- term:
    id: GO:0045746
    label: negative regulation of Notch signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:16125166
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0004197
  review:
    summary: >-
      Fng inhibits Serrate-induced Notch activation and restrains Notch in several tissues.
    action: ACCEPT
    reason: >-
      Well supported; the dual sign reflects ligand-selective modulation by the same glycosylation.
    supported_by:
    - reference_id: PMID:9202123
      supporting_text: >-
        This is achieved by fng through a cell-autonomous mechanism that inhibits a cell's
        ability to respond to Serrate protein and potentiates its ability to respond to Delta
        protein.
    - reference_id: PMID:17923477
      supporting_text: >-
        In vitro glycosylation and ligand binding studies establish that the addition of N-acetylglucosamine
        onto O-fucose in vitro is sufficient both to enhance Notch binding to the Delta ligand
        and to inhibit Notch binding to the Serrate ligand.
    - reference_id: PMID:16643882
      supporting_text: >-
        In addition, we demonstrate that fringe expression is essential for Notch pathway
        inhibition and muscle differentiation.
    - reference_id: PMID:16125166
      supporting_text: >-
        We also show that the Serrate antagonist, fringe, must temper Notch activity to insure
        that the activation of the EGFR is not too robust.
