core_functions:
- description: >-
    Golgi O-fucosylpeptide beta1,3-N-acetylglucosaminyltransferase that elongates O-fucose
    on Notch EGF repeats, changing Notch ligand selectivity (enhancing Delta and reducing
    Serrate binding) and thereby modulating Notch signalling.
  molecular_function:
    id: GO:0033829
    label: O-fucosylpeptide 3-beta-N-acetylglucosaminyltransferase activity
  directly_involved_in:
  - id: GO:0036066
    label: protein O-linked glycosylation via fucose
  - id: GO:0008593
    label: regulation of Notch signaling pathway
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:10935626
    supporting_text: >-
      Drosophila and mammalian Fringe proteins possess a fucose-specific beta1,3 N-acetylglucosaminyltransferase
      activity that initiates elongation of O-linked fucose residues attached to epidermal
      growth factor-like sequence repeats of Notch.
  - reference_id: PMID:10935637
    supporting_text: >-
      Fringe catalyses the addition of N-acetylglucosamine to fucose, which is consistent
      with a role in the elongation of O-linked fucose O-glycosylation that is associated
      with EGF repeats.
  - reference_id: PMID:17923477
    supporting_text: >-
      In vitro glycosylation and ligand binding studies establish that the addition of N-acetylglucosamine
      onto O-fucose in vitro is sufficient both to enhance Notch binding to the Delta ligand
      and to inhibit Notch binding to the Serrate ligand.
  - reference_id: PMID:10899003
    supporting_text: >-
      These results indicate that Fringe does not exert its effects outside of the cell, but
      rather acts in the Golgi apparatus, apparently as a glycosyltransferase.
  - reference_id: PMID:9202123
    supporting_text: >-
      This is achieved by fng through a cell-autonomous mechanism that inhibits a cell's ability
      to respond to Serrate protein and potentiates its ability to respond to Delta protein.
proposed_new_terms: []
suggested_questions:
- question: >-
    How is the site selectivity of Fng on the 22 O-fucose sites of Notch determined, and which
    specific EGF repeats mediate the Delta-enhancing versus Serrate-inhibiting effects in
    vivo?
- question: >-
    Does Fng-mediated modification of Delta or Serrate O-fucose contribute to signalling in
    vivo, or is Notch the only physiologically relevant substrate?
suggested_experiments:
- description: >-
    Knock-in Notch alleles lacking individual Fng-preferred O-fucose sites, assayed at the
    wing D/V boundary for Delta vs Serrate responsiveness.
