        that fringe is required for polar cell fate.
    - reference_id: PMID:11034906
      supporting_text: >-
        Interfering with fng expression using antisense RNA experiments resulted in a typical
        fng mutant phenotype in the wing, and malformed egg chambers and abnormal organisation
        of the follicle cells in the ovaries, revealing that fng is essential in oogenesis
        for the proper formation of the egg chamber and for epithelial morphogenesis.
