  evidence_type: IGI
  original_reference_id: PMID:25255098
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0004197
  - FB:FBgn0004647
  review:
    summary: >-
      Fng potentiates Delta-induced (and in some contexts Serrate-induced) Notch activation.
    action: ACCEPT
    reason: >-
      Well supported; Fng is a context-dependent positive regulator of Notch.
    supported_by:
    - reference_id: PMID:9202123
      supporting_text: >-
        This is achieved by fng through a cell-autonomous mechanism that inhibits a cell's
        ability to respond to Serrate protein and potentiates its ability to respond to Delta
        protein.
    - reference_id: PMID:17923477
      supporting_text: >-
        In vitro glycosylation and ligand binding studies establish that the addition of N-acetylglucosamine
        onto O-fucose in vitro is sufficient both to enhance Notch binding to the Delta ligand
        and to inhibit Notch binding to the Serrate ligand.
    - reference_id: PMID:23152840
      supporting_text: >-
        Furthermore, our analysis suggests that Fng has also a positive effect on Ser signalling.
    - reference_id: PMID:11493544
      supporting_text: >-
        Our results indicate that fringe plays a key role in positioning Notch activation
        during early oogenesis, and establish a function for the polar cells in separating
        germline cysts into individual follicles.
    - reference_id: PMID:10935626
      supporting_text: >-
        We obtained biological evidence that Fringe-dependent elongation of O-linked fucose
        on Notch modulates Notch signalling by using co-culture assays in mammalian cells
        and by expression of an enzymatically inactive Fringe mutant in Drosophila.
