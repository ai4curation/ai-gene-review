descriptions:
- source: UniProt
  text: Glycosyltransferase involved in the elongation of O-linked ligands to activate
    Notch signaling. Possesses fucose-specific beta-1,3-N-acetylglucosaminyltransferase
    activity; extends the O-linked fucose on the Notch EGF repeats. Boundary-specific
    cell-signaling molecule that is responsible for dorsal-ventral cell interactions
    during wing development.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q24342
