- source: Alliance_Imported
  text: fringe (fng) encodes a Golgi-localized glycosyltransferase that catalyzes
    the attachment of N-acetyl-&agr;-D-glucosamine to O-fucosylated EGF-like repeats
    in selected membrane and secreted proteins. The O-fucosylation of EGF-like repeats
    in the N protein modulates the interaction of N with its ligands encoded by Ser
    and Delta.
  source_type: curated
  url: https://flybase.org/reports/fng.html
  source_id: FB:FBgn0011591
  review:
    reviewer: AI
    rubrics:
