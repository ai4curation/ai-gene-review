      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct on Golgi location and on modulating Notch binding to Ser
      and Delta, but writes N-acetyl-alpha-D-glucosamine for the beta1,3-linked GlcNAc
      and calls the modification O-fucosylation rather than its elongation.
- source: Alliance_Automated
  text: Enables O-fucosylpeptide 3-beta-N-acetylglucosaminyltransferase activity.
    Involved in several processes, including imaginal disc development; oogenesis;
    and regulation of Notch signaling pathway. Located in Golgi medial cisterna and
    Golgi membrane. Is expressed in several structures, including clypeo-labral primordium;
    epithelium; follicle cell; gut section; and imaginal disc. Human ortholog(s) of
    this gene implicated in spondylocostal dysostosis 3. Orthologous to human LFNG
    (LFNG O-fucosylpeptide 3-beta-N-acetylglucosaminyltransferase); MFNG (MFNG O-fucosylpeptide
    3-beta-N-acetylglucosaminyltransferase); and RFNG (RFNG O-fucosylpeptide 3-beta-N-acetylglucosaminyltransferase).
  source_type: automated
  url: https://flybase.org/reports/fng.html
