descriptions:
- source: UniProt
  text: Part of the MTV complex that associates with the HipHop-HOAP complex to form
    the terminin telomere-capping complex involved in telomere maintenance and prevention
    of telomere fusion (PubMed:19240120, PubMed:27835648). Potentially functions downstream
    of mei-41/ATR (PubMed:19240120). As part of the MTV complex binds single stranded
    DNA in a sequence-independent manner, protecting it from degradation (PubMed:27835648).
  source_type: curated
