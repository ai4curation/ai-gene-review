  text: Contributes to single-stranded telomeric DNA binding activity. Involved in
    protection from non-homologous end joining at telomere. Located in chromosome,
    telomeric region; nucleus; and polytene chromosome interband. Part of telomere
    cap complex. Is expressed in embryonic brain; embryonic/larval midgut; gonad;
    and mushroom body primordium.
