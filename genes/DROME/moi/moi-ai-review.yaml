  label: Drosophila melanogaster
description: moi (modigliani) encodes a small (about 20 kDa) telomere-capping protein produced from the
  bicistronic CG31241 locus, which also encodes the RNA methyltransferase Tgs1. Moi is enriched specifically
  at chromosome ends, interacts with HOAP and HP1, and together with Tea and Ver forms the MTV subcomplex
  of terminin, the Drosophila-specific capping complex that protects telomeres independently of DNA sequence.
  The purified MTV complex binds and protects single-stranded DNA without sequence specificity, analogous
  to CST or TPP1-POT1. Loss of Moi causes frequent telomeric fusions that are suppressed by ATR mutations.
