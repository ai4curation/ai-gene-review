suggested_questions:
- question: Is the terminin cap assembled stepwise (HipHop-HOAP on duplex DNA, then Tea-dependent MTV
    on single-stranded DNA), and how is its loading coordinated with HeT-A/TART retrotransposition?
suggested_experiments:
- description: Reconstitute full terminin (HOAP-HipHop plus Moi-Tea-Ver) on model telomere substrates
    with duplex and single-stranded regions and map which subunits contact DNA by crosslinking.
