- id: file:DROME/tim/tim-deep-research-flybase.md
  title: FlyBase gene description for tim (DROME)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Checked each claim. The TIM-PER complex and the requirement for circadian rhythms agree
      with the review (PMID:7481773, PMID:8128246). Mating behavior is traced to the circadian rhythm
      of female mating activity (PMID:11470898) and to male copulation duration (PMID:15324667). Larval
      phototaxis is traced to PMID:19285485. ''DNA replication'' could not be traced to any experiment:
      the FlyBase report lists no paper or phenotype for it, and its only replication items are the PAINT
      IBA rows, which are inherited from a node above the tim/timeout duplication. The replication role
      belongs to the paralog timeout (PMID:20153199).'
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0014396
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: It is involved in mating behavior, DNA replication and larval phototaxis.
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: No experiment shows fly tim (tim1) acting in DNA replication. The claim appears to
        restate the PAINT IBA predictions (replication fork protection complex, replication checkpoint,
        DNA repair), which fly tim inherits from the PTHR22940 root above the duplication that produced
        tim and timeout. The replication function belongs to the paralog timeout (tim2), which is essential
        for chromosome integrity, whereas tim null flies are viable and the tim1-type gene has been lost
        in mammals and bees. Suggest dropping 'DNA replication' from the tim description (it fits timeout).
        Confidence is PROBABLE because the source of the FlyBase sentence is not stated.
      supported_by:
      - &id001
        reference_id: PMID:20153199
        supporting_text: Phylogenetic analyses suggest that tim1 originated as a duplication of tim2 around
          the time of the Cambrian explosion.
      - &id002
        reference_id: PMID:20153199
        supporting_text: tim2 is an essential gene required for normal DNA metabolism and chromosome integrity
      - &id003
        reference_id: PMID:17065608
        supporting_text: The honey bee genome does not encode an ortholog of Drosophila Timeless (Tim1)
- id: file:DROME/tim/tim-uniprot.txt
  title: UniProtKB P49021 (TIM_DROME) Swiss-Prot record
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Curated FUNCTION, SUBUNIT and SUBCELLULAR LOCATION text agrees with the literature:
      TIM-PER heterodimer, light-induced TIM degradation, nuclear and perinuclear localization, no DNA
      binding. The description of nuclear entry as a TIM-PER complex is the 1990s model; live-cell work
      shows that PER and TIM can enter separately (PMID:16410523), but this is a matter of emphasis, not
      an error.'
