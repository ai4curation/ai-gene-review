existing_annotations:
- term:
    id: GO:0000076
    label: DNA replication checkpoint signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000533813
  - SGD:S000005217
  review:
    summary: DNA replication checkpoint signaling, inherited from the family root (seed yeast Tof1 only).
    action: REMOVE
    reason: 'The PAINT IBD for this term sits on PTN000533813, the Eukaryota root of PTHR22940, above
      the Eumetazoa duplication PTN008585095 that split the TIMELESS-homolog clade (fly timeout, human
      TIMELESS, worm tim-1; PTN000533822) from the insect TIM clade that contains fly tim (PTN008585096,
      subfamily SF5). Fly tim is inside the descendant set only through the pre-duplication ancestor,
      and PAINT has placed no loss annotation on the SF5 clade. The biology says the replication role
      stayed with the timeout lineage: fly tim2/timeout is essential for chromosome integrity, tim null
      flies develop and mate, and the tim1-type gene has been lost in mammals and honey bees while the
      timeout-type gene was kept. No experiment links fly tim to replication forks. Fly tim was neofunctionalised
      as the light-sensitive partner of PER. The IBD should be pruned from the SF5 clade (an IKR on PTN008585096),
      and this row removed.'
    supported_by:
    - &id004
      reference_id: file:DROME/tim/tim-bioinformatics/RESULTS.md
      supporting_text: Fly tim therefore inherits the root IBDs only through the ancestor of both paralogs.
    - &id005
      reference_id: file:DROME/tim/tim-bioinformatics/RESULTS.md
      supporting_text: PAINT has recorded no IKR/IRD loss anywhere in the SF5 clade
    - *id001
    - &id006
      reference_id: PMID:20153199
      supporting_text: Many organisms possess a single tim2-like gene that has been implicated in DNA
        synthesis
    - *id002
    - *id003
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000533813
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family root above the tim/timeout duplication; the replication function is retained in
          the TIMELESS-homolog clade (PTN000533822) that contains fly timeout, not in the insect TIM clade
          (PTN008585096) that contains fly tim.
