- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000533813
  - PomBase:SPBC216.06c
  review:
    summary: DNA binding, inherited from the family root (seed fission yeast Swi1 only).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Same node placement as the replication rows: the IBD is on the PTHR22940 root, above the
      duplication that separated tim from timeout, with no loss recorded on the insect TIM clade. DNA
      binding by TIMELESS/Swi1 serves fork protection, which fly tim does not do. Fly TIM still carries
      the HTH_TIMELESS and TIMELESS_C regions (Pfam PF26019, PF05029), so a residual DNA-binding surface
      cannot be excluded on sequence grounds, but no assay shows fly TIM binding DNA and UniProt''s curated
      text records that it does not appear to. TIM''s repressive effect on CLK-CYC is exerted through
      PER. Over-annotation rather than a demonstrated error.'
    supported_by:
    - *id004
    - *id005
    - reference_id: file:DROME/tim/tim-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Does not appear to bind DNA, suggesting indirect transcriptional inhibition.
    - &id017
      reference_id: PMID:12944510
      supporting_text: Unlike PER, nuclear TIM alone has no ability to repress transcription.
    - *id006
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
