core_functions:
- description: 'Light-sensitive partner of PER in the core clock feedback loop: TIM binds PER in the cytoplasm,
    stabilises it and controls the timing of PER nuclear entry, so that PER-dependent inhibition of CLOCK-CYCLE
    is delayed relative to per and tim transcription. TIM has no known enzymatic or DNA-binding activity
    and does not repress transcription on its own, so no molecular function term is asserted.'
