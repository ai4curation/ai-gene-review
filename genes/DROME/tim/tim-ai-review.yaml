suggested_questions:
- question: Does fly TIM retain any residual association with replisome components (e.g. a fly Tipin,
    Claspin or MCM), or has the insect TIM clade lost the Tof1-type replication interfaces entirely?
- question: Which parts of the TIMELESS fold conserved between TIM and TIMEOUT (N-terminal TIMELESS domain,
    HTH_TIMELESS, TIMELESS_C) are used by fly TIM for PER binding, CRY binding and nuclear import?
- question: Should PAINT add an IKR for the replication terms on the insect TIM clade (PTN008585096),
    and does the sea urchin SF5 member indicate that the clock function predates the protostome-deuterostome
    split?
suggested_experiments:
- description: Test whether tim01 or CRISPR tim null cells show replication stress markers (gamma-H2Av,
    RPA foci, hydroxyurea sensitivity) compared with timeout knockdown, to confirm that only timeout acts
    at forks.
- description: Map TIM interactors by proximity labelling in S2 cells and clock neurons to see whether
    any replisome proteins co-purify with TIM, as they do with TIMEOUT.
