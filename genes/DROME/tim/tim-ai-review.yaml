id: P49021
gene_symbol: tim
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'timeless (tim) encodes TIM, a large protein that is the light-sensitive partner of PERIOD
  (PER) in the Drosophila circadian clock. TIM binds the PAS region of PER in the cytoplasm, stabilises
  it and times its entry into the nucleus; nuclear PER (with TIM) inhibits the CLOCK-CYCLE transcription
  factor that activates per and tim, closing the core feedback loop. TIM itself does not repress transcription.
  Light resets the clock through TIM: activated CRYPTOCHROME binds TIM, and the F-box protein JETLAG directs
  its proteasomal degradation. tim null mutants are arrhythmic for eclosion and locomotor activity, and
  tim is needed for clock-driven outputs such as rhythms of mating, temperature preference, phagocytosis
  and sleep. A natural ls-tim/s-tim polymorphism alters light sensitivity and diapause. tim also affects
  male copulation duration and larval light avoidance. Fly tim is the insect circadian paralog of the
  TIMELESS family. The paralog timeout (tim2), the ortholog of mammalian TIMELESS and yeast Tof1/Swi1
  (replication fork protection proteins), is the family member needed for chromosome integrity in flies.
  No replication function has been shown for tim.'
