status: COMPLETE
descriptions:
- source: UniProt
  text: Required for the production of circadian rhythms. The biological cycle depends on the
    rhythmic formation and nuclear localization of the TIM-PER complex. Light induces the degradation
    of TIM, which promotes elimination of PER. Nuclear activity of the heterodimer coordinatively
    regulates PER and TIM transcription through a negative feedback loop. Behaves as a negative
    element in circadian transcriptional loop. Does not appear to bind DNA, suggesting indirect
    transcriptional inhibition.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49021
  source_id: P49021
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Accurate account of the TIM-PER feedback loop, light-induced TIM degradation
      and the lack of DNA binding. Frames nuclear entry as a TIM-PER complex (older model) and
      omits CRY/JET, clock outputs and the distinction from the replication paralog timeout.
- source: Alliance_Imported
  text: timeless (tim) encodes a key component of the tim-per complex, required for the production
    of circadian rhythms. It is involved in mating behavior, DNA replication and larval phototaxis.
  source_type: curated
  url: https://flybase.org/reports/tim.html
  source_id: FB:FBgn0014396
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: TIM-PER complex and circadian rhythms are right, as are mating behavior and
      larval phototaxis. 'DNA replication' has no experimental basis for tim; the replication
      role belongs to the paralog timeout, and the claim appears to restate the PAINT IBA rows.
      No mention of light entrainment.
- source: Alliance_Automated
  text: Predicted to enable DNA binding activity. Involved in several processes, including circadian
    temperature homeostasis; locomotor rhythm; and negative phototaxis. Located in cytosol and
    nucleus. Is expressed in several structures, including epithelium; gland; glial cell; organism
    subdivision; and pacemaker neurons. Used to study advanced sleep phase syndrome.
  source_type: automated
  url: https://flybase.org/reports/tim.html
  source_id: FB:FBgn0014396
  review:
    reviewer: AI
    rubrics: &id001
    - rubric: correctness
      score: 2
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Leads with 'Predicted to enable DNA binding activity', an IBA inherited from
      the replisome TIMELESS lineage that the review marks over-annotated (UniProt notes TIM
      does not appear to bind DNA). The process list picks clock outputs (temperature homeostasis,
      phototaxis) and omits the core PER partnership and light-dependent degradation.
- source: RefSeq
  text: Predicted to enable DNA binding activity. Involved in several processes, including circadian
    temperature homeostasis; locomotor rhythm; and negative phototaxis. Located in cytosol and
    nucleus. Is expressed in several structures, including epithelium; gland; glial cell; organism
    subdivision; and pacemaker neurons. Used to study advanced sleep phase syndrome. [provided
    by Alliance of Genome Resources, Jul 2025]
  source_type: automated
