      assessment.
findings:
- category: discrepancy
  text: FlyBase lists DNA replication among tim's roles; the review finds no experiment for
    it and assigns the replication role to the paralog timeout. The PAINT replication IBAs on
    tim are removed.
  sources:
  - Alliance_Imported
- category: discrepancy
  text: The automated text says tim is predicted to bind DNA, while UniProt's curated text says
    TIM does not appear to bind DNA; the review marks the DNA-binding IBA as over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
  - UniProt
- category: gap
  text: Only UniProt mentions light-induced TIM degradation; none of the texts names CRY binding
    or JET-mediated degradation, the mechanism of light entrainment.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- category: gap
  text: None of the texts says that fly tim is the insect circadian paralog and that timeout
    is the ortholog of mammalian TIMELESS.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: UniProt and FlyBase agree on the core TIM-PER clock role. FlyBase adds an untraced
    DNA replication role and the automated text a predicted DNA binding activity, both inherited
    from the replication paralog lineage; UniProt contradicts the latter.
