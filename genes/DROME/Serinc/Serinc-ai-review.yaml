- id: file:DROME/Serinc/Serinc-deep-research-flybase.md
  title: FlyBase gene description for Serinc (DROME)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      The only claim, that the gene (listed under the symbol TMS1) encodes a putative L-serine
      transmembrane transporter, was checked against the review's sources. No study has measured serine
      transport by the fly protein or by any SERINC; the family name comes from a proposed role in
      incorporating serine into lipids (PMID:31907454), and the only activity shown for purified SERINCs is
      phospholipid flipping by human SERINC3 and SERINC5 (PMID:37474505). The fly protein's own transport
      activity is undetermined.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: FLYBASE
      record: FB:FBgn0028399
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: TMS1 (TMS1) encodes a putative L-serine transmembrane transporter.
      confidence: PROBABLE
      explanation: >-
        "Putative L-serine transmembrane transporter" rests on the family name (serine incorporator), which
        was coined for a proposed role in serine incorporation into membrane lipids rather than for a measured
        serine transport activity. No SERINC, including the fly protein, has been shown to transport serine.
        The fly protein (DmSERINC) has been solved by cryo-EM as a ten-helix membrane protein with an
        acyl-chain-binding groove (PMID:31907454), and purified human SERINC3 and SERINC5 flip phospholipids
        in proteoliposomes (PMID:37474505). Suggest describing it as a SERINC-family multipass membrane protein
        of undetermined transport activity. The description also still uses the older symbol TMS1; the FlyBase gene symbol is now Serinc.
