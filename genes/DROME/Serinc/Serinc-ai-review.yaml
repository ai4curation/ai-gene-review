id: M9PCT1
gene_symbol: Serinc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Serinc (CG4672; also called DmSERINC or TMS1) is the single Drosophila member of the SERINC/TMS
  (TDE1) family of multipass integral membrane proteins. M9PCT1 is the 458-residue isoform C, one of six
  splice products that share the same ten-helix membrane core and differ by short indels in a cytosolic
  loop or, for isoform F, an alternative C-terminal segment. Cryo-EM of the purified fly protein shows
  protomers of ten transmembrane helices arranged in two subdomains around a diagonal helix, with
  cytoplasmic N and C termini, two extracellular disulphides, and a groove in subdomain B that holds an
  acyl chain. Phosphatidylserine, cholesterol and sulfatide stabilise the purified protein, and
  phosphatidylserine alters hydrogen/deuterium exchange around that groove. The purified fly protein
  forms hexamers held together largely by lipid, including cardiolipin. When expressed in human cells,
  DmSERINC reduces the infectivity of Nef-deficient HIV-1, as human SERINC5 does. Its native lipid-transport
  activity, subcellular compartment and physiological role in the fly have not been determined. The family
  name comes from an early proposal of serine incorporation into lipids, which later work has not upheld.
