  - statement: A subdomain-B groove binds an acyl chain, and phosphatidylserine alters HDX there. PS,
      cholesterol and sulfatide stabilise the protein.
    supporting_text: the cryo-EM map revealed presence of an acyl chain bound at this site
  - statement: Ectopic DmSERINC expression in HEK293T cells restricts Nef-deficient HIV-1. This heterologous
      assay is not evidence of a physiological antiviral process in the fly.
    supporting_text: Ectopic expression of DmSERINC during production of Nef-deficient HIV-1 virions strongly
      suppressed their infectivity
