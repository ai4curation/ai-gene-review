- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IDA
  original_reference_id: PMID:31907454
  qualifier: enables
  review:
    summary: Purified DmSERINC binds lipids directly. An acyl chain occupies the subdomain-B groove in the
      cryo-EM map, cardiolipin is bound at the protomer interfaces, phosphatidylserine, cholesterol and sulfatide
      raise its thermostability, and phosphatidylserine alters HDX around the groove.
    action: NEW
    reason: These are direct biochemical and structural observations on the purified fly protein. The
      structure and HDX numbering follows isoform A, but M9PCT1 is identical to it except for a 7-residue
      cytosolic-loop deletion and carries the whole groove (Serinc-bioinformatics/RESULTS.md). The generic
      lipid-binding term is used rather than phosphatidylserine binding because several lipids stabilise
      the protein and no binding constant or specificity was measured. Cardiolipin probably came from
      the yeast expression host and mediates hexamer contacts, so it is not proposed as a specific ligand.
      Phospholipid scramblase activity (GO:0017128) is not proposed. It has been shown for human SERINC3/5
      (PMID:37474505), which sit in other PANTHER subfamilies (SF51/SF16). The PAINT curators propagated
      only membrane from the family root and not scramblase or any process term, and no lipid-transport
      assay has been done on the fly protein.
    supported_by:
    - reference_id: PMID:31907454
      supporting_text: the cryo-EM map revealed presence of an acyl chain bound at this site
    - reference_id: PMID:31907454
      supporting_text: addition of phosphatidylserine, cholesterol or sulfatide increased DmSERINC and SERINC5
        protein thermostability
    - reference_id: PMID:31907454
      supporting_text: hydrogen/deuterium exchange (HDX) experiments with DmSERINC revealed that phosphatidylserine
        affected isotope exchange around the potential lipid binding groove in subdomain B
