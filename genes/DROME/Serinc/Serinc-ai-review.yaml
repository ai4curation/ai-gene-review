  label: Drosophila melanogaster
description: Serinc-PC is a native 458-residue SERINC-family multipass membrane protein. Its extensive
  transmembrane architecture supports a role in membrane biology, while the family name reflects historical
  associations with serine incorporation into lipids. The precise lipid substrate, transport mechanism
  and physiological role of this fly isoform are not directly established.
