suggested_questions:
- question: Does purified DmSERINC scramble phospholipids in proteoliposomes as human SERINC3/5 do? Should
    PAINT then place phospholipid scramblase activity at a node above SF9, or is that activity specific to
    the vertebrate subfamilies?
- question: Is the hexamer, bridged by cardiolipin from the yeast host, present in native fly membranes, or
    is it a feature of detergent purification?
suggested_experiments:
- description: Reconstitute purified DmSERINC (isoform C and isoform F, which has a different C-terminal
    segment) into proteoliposomes and measure ATP-independent flipping of NBD-labelled PS, PE and PC.
  experiment_type: in vitro lipid scrambling assay
- description: Tag endogenous Serinc by CRISPR knock-in and co-localise it with plasma membrane, ER, Golgi
    and endolysosomal markers in fly tissues to establish its native compartment.
  experiment_type: endogenous tagging and imaging
