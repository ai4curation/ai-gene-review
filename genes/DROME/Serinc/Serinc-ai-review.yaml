  review:
    summary: Serinc isoform C is an integral multipass membrane protein; membrane is the most specific
      location the evidence supports.
    action: ACCEPT
    reason: The cryo-EM structure of DmSERINC resolves ten transmembrane helices. M9PCT1 keeps the whole
      membrane core, including every structurally named residue and both disulphides (Serinc-bioinformatics/RESULTS.md),
      and Phobius predicts multiple transmembrane segments for this exact accession. The PAINT IBD for
      PTHR10383 sits at the eukaryotic root (PTN000043695) and is also only GO:0016020. No fly experiment
      places the native protein in a specific compartment. Human SERINC5 at the plasma membrane is in a
      different subfamily (SF16), and yeast TMS1 at the vacuole is a distant SF9 member, so neither
      location transfers. The generic term is therefore kept rather than refined.
    supported_by:
