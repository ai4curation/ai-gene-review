- source: Alliance_Automated
  text: Enables several functions, including WW domain binding activity; histone acetyltransferase
    binding activity; and transcription coactivator activity. Involved in several
    processes, including animal organ morphogenesis; neurogenesis; and regulation
    of cell development. Located in several cellular components, including adherens
    junction; cytoplasmic vesicle; and lateral plasma membrane. Part of CSL-Notch-Mastermind
    transcription factor complex. Colocalizes with late endosome and lysosome. Is
    expressed in several structures, including anterior-posterior subdivision of organism;
    compartment boundary; epithelial cell; germline cell; and larval optic anlage.
    Used to study alcohol use disorder; cancer (multiple); and neurodegenerative disease.
    Human ortholog(s) of this gene implicated in several diseases, including Alagille
    syndrome; CADASIL (multiple); Hajdu-Cheney syndrome; adult T-cell leukemia/lymphoma;
    and aortic valve disease 1. Orthologous to several human genes including NOTCH1
    (notch receptor 1) and NOTCH2 (notch receptor 2).
