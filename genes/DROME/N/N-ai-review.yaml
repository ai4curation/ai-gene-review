- term:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  evidence_type: IDA
  original_reference_id: PMID:11390662
  qualifier: part_of
  review:
    summary: >-
      NICD is a subunit of the CSL-Notch-Mastermind transcription factor complex with Su(H) and Mam.
    action: ACCEPT
    reason: >-
      Biochemical and structural studies show Drosophila NICD, Su(H) and Mam form the ternary activator
      complex on DNA.
    supported_by:
    - reference_id: PMID:11390662
      supporting_text: >-
        Expression of a human sequence related to Drosophila Mam (hMam-1) in mammalian cells augments
