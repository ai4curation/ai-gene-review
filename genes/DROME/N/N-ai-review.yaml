- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:11390662
  qualifier: enables
  review:
    summary: >-
      The released Notch intracellular domain (NICD) acts as a transcriptional coactivator with Su(H)/CSL
      and Mastermind at Notch-responsive enhancers.
    action: ACCEPT
    reason: >-
      NICD has no DNA-binding activity of its own; it binds Su(H) via the RAM domain and ankyrin repeats
      and, together with Mastermind, converts Su(H) from a repressor into an activator of E(spl) genes.
      Transcription coactivator activity accurately describes the nuclear function of the processed receptor.
    supported_by:
    - reference_id: PMID:11390662
      supporting_text: >-
        Furthermore, Drosophila Mam forms a similar complex with the intracellular domain of Drosophila
        Notch and Drosophila CSL protein during activation of Enhancer of split, the Drosophila counterpart
        of HES. These results indicate that Mam is an essential component of the transcriptional apparatus
        of Notch signaling
    - reference_id: PMID:8749394
      supporting_text: >-
        In vitro interaction studies, using proteins fused to glutathione-S-transferase, showed that RBP-J
        kappa and Su(H) bind directly to the RAM23 regions of mouse Notch1 and Drosophila Notch, respectively.
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IDA
  original_reference_id: PMID:15611340
  qualifier: enables
  review:
    summary: >-
      Notch is a single-pass type I transmembrane receptor for the membrane-bound ligands Delta and Serrate.
    action: ACCEPT
    reason: >-
      Notch binds Delta and Serrate via EGF repeats 11-12 and transduces the signal across the membrane;
      both ectodomain and intracellular domain are required for signaling-competent adhesion with Delta.
      This is the core receptor molecular function.
    supported_by:
    - reference_id: PMID:15611340
      supporting_text: >-
        Using atomic force microscopy on live cells, chemical inhibitors, and conventional analyses, we
        show that the rate of Notch signaling is linked to the adhesion force between cells expressing
        Notch receptors and Delta ligand
    - reference_id: PMID:1657403
      supporting_text: >-
        We find that of the 36 EGF repeats of Notch, only two, 11 and 12, are both necessary and sufficient
        to mediate interactions with Delta.
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001881
  - InterPro:IPR018097
  review:
    summary: >-
      Calcium ion binding inferred from EGF-like calcium-binding domains (InterPro).
    action: KEEP_AS_NON_CORE
    reason: >-
      The 36 EGF repeats of the Notch ectodomain include many calcium-binding EGF modules, and calcium
      binding is structurally important for ectodomain rigidity and ligand binding; it is a structural
      property supporting receptor function rather than the core activity.
    supported_by:
    - reference_id: PMID:1657403
      supporting_text: >-
        We find that of the 36 EGF repeats of Notch, only two, 11 and 12, are both necessary and sufficient
        to mediate interactions with Delta.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10935637
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10041
  review:
    summary: >-
      Generic protein binding (IPI) reflecting one of many reported Notch interactions (Delta, Su(H),
      Deltex, Nedd4/Su(dx), Numb/Sanpodo, Canoe, Akap200 and others).
    action: REMOVE
    reason: >-
      Protein binding is uninformative. Ligand binding is captured by transmembrane signaling receptor
      activity, Su(H) binding by transcription coactivator activity and the CSL-Notch-Mastermind complex,
      and E3 ligase/trafficking-factor interactions describe Notch as a substrate or cargo. Removal does
      not imply the interaction is false.
    supported_by:
    - reference_id: PMID:10935637
      supporting_text: >-
        Glycosyltransferase activity of Fringe modulates Notch-Delta interactions
