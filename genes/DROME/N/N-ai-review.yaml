- term:
    id: GO:0006110
    label: regulation of glycolysis
  evidence_type: IMP
  original_reference_id: PMID:26887408
  qualifier: involved_in
  review:
    summary: >-
      N IMP annotation to 'regulation of glycolysis'. Loss or gain of Notch function alters this process,
      one of the many developmental or physiological contexts in which Notch receptor signaling is deployed.
    action: KEEP_AS_NON_CORE
    reason: >-
      Notch is the single Drosophila Notch receptor and its signaling is used reiteratively in cell-fate
      decisions, boundary formation, proliferation and differentiation. The annotation is biologically
      sound, but it records a downstream context of Notch signaling rather than the core molecular role
      of N (ligand-activated transmembrane receptor whose released intracellular domain is a Su(H)/CSL
      coactivator). Kept as non-core.
    supported_by:
    - reference_id: PMID:26887408
      supporting_text: >-
        Loss of Notch signalling in Drosophila wing discs as well as in human microvascular cells leads
        to downregulation of glycolytic genes
