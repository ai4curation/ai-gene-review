id: P07207
gene_symbol: N
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  N (Notch) encodes the single Drosophila Notch receptor, a large single-pass type I transmembrane protein
  with 36 extracellular EGF-like repeats, three Lin-12/Notch repeats, a transmembrane region and an intracellular
  domain with a RAM region, ankyrin repeats and a C-terminal PEST region. EGF repeats 11-12 bind the DSL
  ligands Delta and Serrate presented on neighboring cells; ligand binding and endocytic pulling expose
  the receptor to ADAM (Kuzbanian) S2 cleavage and gamma-secretase (Presenilin) S3 cleavage, releasing
  the Notch intracellular domain (NICD). NICD enters the nucleus, binds the CSL DNA-binding factor Su(H)
  and recruits Mastermind to activate transcription of Enhancer of split and other target genes. Receptor
  activity is modulated by O-fucosylation (Ofut1), O-glucosylation (Rumi), Fringe-mediated GlcNAc elongation,
  cis-inhibition by ligands, and ubiquitin-dependent endocytic trafficking and lysosomal degradation (Deltex,
  Su(dx)/Nedd4, Cbl, ESCRT). Notch signaling controls lateral inhibition during neurogenesis and sensory
  organ development, boundary formation (wing margin), and numerous other cell-fate, proliferation and
  stem-cell decisions throughout development.
