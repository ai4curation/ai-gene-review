- term:
    id: GO:0007293
    label: germarium-derived egg chamber formation
  evidence_type: IMP
  original_reference_id: PMID:11493544
  qualifier: involved_in
  review:
    summary: >-
      N IMP annotation to 'germarium-derived egg chamber formation'. Loss or gain of Notch function alters
      this process, one of the many developmental or physiological contexts in which Notch receptor signaling
      is deployed.
    action: KEEP_AS_NON_CORE
    reason: >-
      Notch is the single Drosophila Notch receptor and its signaling is used reiteratively in cell-fate
      decisions, boundary formation, proliferation and differentiation. The annotation is biologically
      sound, but it records a downstream context of Notch signaling rather than the core molecular role
      of N (ligand-activated transmembrane receptor whose released intracellular domain is a Su(H)/CSL
      coactivator). Kept as non-core.
    supported_by:
    - reference_id: PMID:11493544
      supporting_text: >-
        Clones of cells mutant for Notch also lack polar cells and the requirement for Notch in follicle
        formation appears to map to the polar cells
