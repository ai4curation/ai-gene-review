core_functions:
- description: >-
    Ligand-activated transmembrane receptor: Notch binds Delta and Serrate on adjacent cells via EGF repeats
    11-12 and transduces the signal across the plasma membrane through regulated proteolysis.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:1657403
    supporting_text: >-
      We find that of the 36 EGF repeats of Notch, only two, 11 and 12, are both necessary and sufficient
      to mediate interactions with Delta.
  - reference_id: PMID:1657403
    supporting_text: >-
      We report a novel molecular interaction between Notch and Serrate, another EGF-homologous transmembrane
      protein containing a region of striking similarity to Delta, and show that the same two EGF repeats
      of Notch also constitute a Serrate binding domain.
  - reference_id: PMID:15611340
    supporting_text: >-
      Both the Notch extracellular and intracellular domains are required for the high adhesion force
      with Delta.
- description: >-
    After S3 cleavage the Notch intracellular domain enters the nucleus and acts as a transcriptional
    coactivator: it binds Su(H)/CSL through the RAM domain and ankyrin repeats and with Mastermind forms
    the activator complex on E(spl) and other target enhancers.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:8749394
    supporting_text: >-
      In vitro interaction studies, using proteins fused to glutathione-S-transferase, showed that RBP-J
      kappa and Su(H) bind directly to the RAM23 regions of mouse Notch1 and Drosophila Notch, respectively.
  - reference_id: PMID:11390662
    supporting_text: >-
      Furthermore, Drosophila Mam forms a similar complex with the intracellular domain of Drosophila
      Notch and Drosophila CSL protein during activation of Enhancer of split, the Drosophila counterpart
      of HES.
  - reference_id: PMID:7954795
    supporting_text: >-
      In cultured Drosophila cells, the Su(H) protein is sequestered in the cytoplasm when coexpressed
      with Notch protein and is translocated to the nucleus when Notch binds to its ligand Delta.
  - reference_id: PMID:8343960
    supporting_text: >-
      Our results indicate that the intracellular domains of Lin-12 and Notch have intrinsic activity
      and that the principal role of the extracellular domains in the intact proteins is to regulate this
      activity.
suggested_questions:
- question: >-
    How do Fringe-dependent GlcNAc elongation of O-fucose and Rumi-dependent O-glucosylation quantitatively
    shift Notch preference between Delta and Serrate at the Drosophila wing D/V boundary?
- question: >-
    What fraction of physiological Notch signaling in vivo arises from ligand-independent endosomal activation
    versus canonical ligand-induced S2/S3 cleavage?
suggested_experiments:
- description: >-
    Endogenous tagging of NICD with a cleavage-specific reporter combined with live imaging to quantify
    S3 cleavage rates in lateral inhibition versus boundary-signaling contexts.
