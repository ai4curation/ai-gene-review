taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Argl (CG9510) encodes the Drosophila argininosuccinate lyase, a fumarate lyase-superfamily
  enzyme that cleaves 2-(N-omega-L-arginino)succinate into L-arginine and fumarate. Acting after argininosuccinate
  synthase (Ass), it completes the conversion of L-citrulline back to L-arginine in the cytosol. Because
  flies are not known to run a complete ornithine-urea cycle, this two-step citrulline-to-arginine route
  is thought to serve mainly arginine recycling, for example regenerating arginine from the citrulline
  released by nitric oxide synthase. Argl is a member of the argininosuccinate lyase subfamily with conserved
  lyase-1 and ASL C-terminal domains; it has been characterised in flies mainly through sequence similarity
  and transcriptome studies rather than direct biochemistry.
