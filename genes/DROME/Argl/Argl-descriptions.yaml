descriptions:
- source: Alliance_Imported
  text: Argininosuccinate lyase (Argl) encodes an enzyme that is predicted to catalyze
    the reversible cleavage of L-argininosuccinate to fumarate and L-arginine. Argl
    is probably involved in L-arginine biosynthesis from L-citrulline.
  source_type: curated
  url: https://flybase.org/reports/Argl.html
