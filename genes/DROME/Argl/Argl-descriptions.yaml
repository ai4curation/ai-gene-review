      citrulline.
- source: Alliance_Automated
  text: Predicted to enable argininosuccinate lyase activity. Predicted to be involved
    in L-arginine biosynthetic process. Predicted to be active in cytosol. Is expressed
    in anterior midgut primordium; embryonic proventriculus; embryonic proventriculus
    inner layer; embryonic/larval midgut; and posterior midgut primordium. Used to
    study argininosuccinic aciduria. Human ortholog(s) of this gene implicated in
    amino acid metabolic disorder and argininosuccinic aciduria. Orthologous to human
    ASL (argininosuccinate lyase).
