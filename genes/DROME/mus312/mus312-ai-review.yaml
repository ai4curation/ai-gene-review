    correctness: VERIFIED
    review_notes: >-
      Checked each claim. MUS312 as a scaffolding protein that interacts with the MEI-9-ERCC1 and SLX1
      endonucleases, and its roles in DNA repair and meiotic recombination, agree with PMID:19595722 and the
      review. A physical interaction with MUS81-MMS4 is reported for vertebrate SLX4 and worm HIM-18; it
      was not found in the cached Drosophila papers and remains an open question in the review. The text
      correctly does not assign nuclease activity to MUS312 itself.
