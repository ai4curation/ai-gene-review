id: Q9VS48
gene_symbol: mus312
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: MUS312 is the Drosophila melanogaster ortholog of SLX4 (vertebrate BTBD12/SLX4/FANCP, C.
  elegans HIM-18, yeast Slx4). It is a large (1145 aa), largely disordered, non-catalytic nuclear scaffold
  protein that binds and directs structure-specific DNA endonucleases. During female meiosis MUS312 binds
  the XPF-family nuclease MEI-9 (with ERCC1 and HDM) and is required for the great majority of meiotic
  crossovers; it is proposed to direct MEI-9-ERCC1 to resolve double Holliday junction intermediates,
  and loss of MUS312 causes crossover failure and meiotic nondisjunction. MUS312 also forms the SLX1-SLX4
  structure-specific endonuclease with SLX1 and, independently of MEI-9, is required for resistance to
  DNA interstrand crosslinking agents. In somatic cells MUS312-SLX1 becomes essential in the absence of
  the BLM helicase (mus309) and, together with SLX1 and MUS81, generates spontaneous mitotic crossovers
  in Fancm mutants.
