suggested_questions:
- question: Does Drosophila MUS312 enhance the nuclease activity of SLX1 and MEI-9-ERCC1 in vitro as human
    SLX4 does (which would support enzyme activator activity in addition to adaptor activity)?
- question: Which nuclease partner(s) act with MUS312 in interstrand crosslink repair, given that this
    role is MEI-9-independent, and should interstrand cross-link repair (GO:0036297) be annotated to mus312
    once the partner is identified?
- question: Does fly MUS312 interact with MUS81-MMS4 or GEN, given that vertebrate SLX4 and worm HIM-18
    bind MUS81 but no such interaction has been reported in Drosophila?
suggested_experiments:
- description: Purify recombinant MUS312 (or its N-terminal MEI-9-binding region plus C-terminal SLX1-binding
    region) with SLX1 and MEI-9-ERCC1 and test cleavage of Holliday junctions, 5-prime flaps and fork
    structures with and without MUS312.
  hypothesis: MUS312 stimulates and directs the substrate specificity of its partner nucleases toward
    Holliday junctions.
- description: Generate separation-of-function mus312 alleles that disrupt SLX1 binding but retain MEI-9
    binding, and test HN2 sensitivity, meiotic crossing over, and viability in mus309 background.
  hypothesis: The SLX1 interaction mediates the ICL repair and BLM-backup roles, whereas the MEI-9 interaction
    mediates meiotic crossover formation.
