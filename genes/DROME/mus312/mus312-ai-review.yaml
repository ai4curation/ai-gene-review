- id: file:DROME/mus312/mus312-uniprot.txt
  title: UniProt record Q9VS48 (SLX4_DROME)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Checked the FUNCTION comment. MUS312 as a regulatory subunit that binds and stimulates
      structure-specific endonucleases, membership of the SLX1-SLX4 nuclease, and interaction with
      MEI-9-ERCC1 for meiotic crossovers agree with the review and PMID:19595722. The sentence assigning
      branched-DNA endonuclease activity to MUS312 itself is a By similarity statement that describes the
      SLX1-SLX4 heterodimer; in the human complex the activity depends on the SLX1 catalytic residues
      (PMID:19596236), and the fly work presents MUS312 as a non-catalytic subunit.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9VS48
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Has endonuclease activity towards branched DNA substrates, introducing single-strand cuts
        in duplex DNA close to junctions with ss-DNA (By similarity).
      confidence: CONFIRMED
      explanation: >-
        The FUNCTION comment says MUS312 "Has endonuclease activity towards branched DNA substrates". The
        nuclease activity belongs to its partner: in human SLX1-SLX4, mutations in SLX1 abolish the 5'-flap
        endonuclease activity (Fekairi et al. 2009, PMID:19596236), and Andersen et al. 2009 (PMID:19595722)
        propose that MUS312 and its vertebrate ortholog are non-catalytic subunits of Holliday junction
        resolvases. Suggest rewording to "The SLX1-SLX4 complex has endonuclease activity towards branched DNA
        substrates, contributed by the SLX1 catalytic subunit".
      supported_by:
      - reference_id: PMID:19596236
        supporting_text: Both mutations abolished the 5′-flap endonuclease activity of human SLX1-SLX4, confirming
          that the activity we detected in our FLAG-peptide eluates was SLX1-dependent.
      - reference_id: PMID:19595722
        supporting_text: we propose that MUS312 and BTBD12 are key non-catalytic subunits of Holliday junction
          resolvases.
