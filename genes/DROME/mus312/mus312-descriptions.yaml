descriptions:
- source: UniProt
  text: Regulatory subunit that interacts with and increases the activity of different
    structure-specific endonucleases. Has several distinct roles in protecting genome
    stability by resolving diverse forms of deleterious DNA structures originating
    from replication and recombination intermediates and from DNA damage (By similarity).
    Component of the SLX1-SLX4 structure-specific endonuclease that resolves DNA secondary
    structures generated during DNA repair and recombination. Has endonuclease activity
    towards branched DNA substrates, introducing single-strand cuts in duplex DNA
    close to junctions with ss-DNA (By similarity). Interacts with the structure-
    specific MEI-9-ERCC1 endonuclease to generate meiotic crossovers.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VS48
  source_id: Q9VS48
