- source: Alliance_Imported
  text: scully (scu) encodes a mitochondrial protein that is part of a three protein
    complex responsible for cleaving the 5'-end of mitochondrial tRNAs. scu product
    forms a sub-complex with the protein encoded by rswl. This sub-complex binds the
    tRNA and recruits the metallonuclease encoded by mldr, which is responsible for
    cleaving the phosphodiester backbone of the RNA. Loss of scu results in lethality
    and aberrantly processed mtDNA transcripts.
