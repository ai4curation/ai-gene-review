- source: Alliance_Automated
  text: Enables (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity and steroid dehydrogenase
    activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Involved
    in several processes, including acyl-CoA metabolic process; mitochondrial RNA
    processing; and steroid metabolic process. Located in mitochondrion. Part of mitochondrial
    ribonuclease P complex. Is active in mitochondrial matrix. Is expressed in several
    structures, including adult head; adult heart; embryonic/larval salivary gland;
    germline cell; and gut section. Used to study syndromic X-linked intellectual
    disability type 10. Human ortholog(s) of this gene implicated in pheochromocytoma
    and syndromic X-linked intellectual disability type 10. Orthologous to human HSD17B10
    (hydroxysteroid 17-beta dehydrogenase 10).
