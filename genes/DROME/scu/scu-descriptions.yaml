descriptions:
- source: UniProt
  text: Mitochondrial dehydrogenase involved in pathways of fatty acid, and steroid
    metabolism (PubMed:12917011). Versatile enzyme presenting two types of activity;
    L-3-hydroxyacyl-CoA dehydrogenase ((3S)-3-hydroxyacyl-CoA dehydrogenase) activity
    and hydroxysteroid dehydrogenase (HSD) activity with a wide substrate spectrum.
    As a (3S)- 3-hydroxyacyl-CoA dehydrogenase, it functions in the third step of
    the fatty acid beta-oxidation pathway, a major metabolic process in which fatty
    acids are oxidized to provide a significant source of energy, while also generating
    acyl-CoA metabolites used by many metabolic routes (Probable) (PubMed:12917011).
    As a HSD, it functions in the degradation pathways of glucocorticoids and sex
    steroids and epimerization of bile acids; catalyzes the beta-oxidation at position
    17 of androgens and estrogens, has 3-alpha-hydroxysteroid dehydrogenase activity
    with androsterone, and carries out oxidative conversions of 7- beta-hydroxylated
    bile acids like ursodeoxycholate or isoursodeoxycholate (also known as 3-beta,7-beta-dihydroxy-5-beta-
    cholan-24-oate or 7-beta-hydroxyisolithocholate, respectively). Also exhibits
    20-beta-OH and 21-OH dehydrogenase activities with C21 steroids (PubMed:12917011).
    Essential for structural and functional integrity of mitochondria (PubMed:27131785,
    PubMed:34199774, PubMed:35663400). Required for cell survival during embryonic
    development (PubMed:9585418). May play a role in germline formation (PubMed:12917011,
    PubMed:9585418). . In addition to mitochondrial dehydrogenase activity, moonlights
    as a component of mitochondrial ribonuclease P, a complex that cleaves tRNA molecules
    in their 5'-ends (PubMed:27131785, PubMed:34199774, PubMed:35663400). Essential
    for the structural and functional integrity of mitochondria (PubMed:27131785,
    PubMed:34199774, PubMed:35663400). Function is essential for pupal development
    (PubMed:27131785, PubMed:34199774).
