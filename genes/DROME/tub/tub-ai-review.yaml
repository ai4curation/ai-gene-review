suggested_questions:
- question: Is Tube a highly diverged orthologue of vertebrate IRAK4 (the proposed functional counterpart),
    and does the PANTHER placement of Tube within the IRAK/Pelle family reflect true homology of the death
    domain?
- question: 'What is the function of Tube binding to Dorsal via the Tube repeats: does it position Dorsal/Cactus
    near Pelle for phosphorylation?'
- question: Do other Drosophila Toll-family receptors (e.g. Toll-7, 18w) signal through Tube, or is Tube
    specific to the Toll-Spaetzle pathway?
suggested_experiments:
- description: Structural determination of the full MyD88-Tube-Pelle death-domain assembly (cryo-EM) to
    compare its stoichiometry with the vertebrate Myddosome.
- description: Rescue of tube null embryos and adults with Tube repeat-deleted constructs to test whether
    Dorsal binding by Tube is required for signalling in development and immunity.
- description: Tissue-specific tube knockdown in fat body versus hemocytes to separate its roles in humoral
    immunity and hematopoiesis.
