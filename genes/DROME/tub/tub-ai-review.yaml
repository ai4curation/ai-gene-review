  review:
    summary: IBA for nucleus from an ancestral node dominated by IRAK/Pelle-family kinases.
    action: REMOVE
    reason: No experimental report places Tube in the nucleus. It is membrane-associated in the syncytial
      embryo and cytoplasmic later, and it acts upstream of Cactus degradation, which releases Dorsal
      into nuclei. The nucleus assertion derives from experimental data on kinase-family members of the
      node. Tube has no kinase domain and is a death-domain adaptor, so the nuclear role is not inherited
      by the target.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000784925
        comment: Ancestral node whose nuclear assertion is grounded in kinase-family members; Tube is
          a kinase-less death-domain adaptor with experimental localization only at the plasma membrane
          and cytoplasm/cytosol.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
    additional_reference_ids:
    - PMID:22464168
    supported_by:
    - &id007
      reference_id: PMID:7635064
      supporting_text: We show by immunolocalization that tube protein associates with the plasma membrane
        during interphase.
    - &id006
      reference_id: PMID:22464168
      supporting_text: Expressing Tube in S2 cells revealed that Tube is found to be evenly distributed
