- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:12351681
  review:
    summary: Tube bridges MyD88 and the kinase Pelle in the Toll receptor signalling complex through two
      distinct death-domain surfaces.
    action: NEW
    reason: 'Tube has no catalytic activity; its molecular role is to assemble the MyD88-Tube-Pelle death-domain
      heterotrimer and recruit Pelle to the membrane, which is what signaling adaptor activity describes.
      Tube performs this bridging step itself, so it passes the participation test. Comparator check:
      MYD88 and TIRAP in human, and Drosophila Myd88, carry GO:0035591 in GOA. None of the existing Tube
      MF annotations capture the adaptor activity.'
    supported_by:
    - *id002
    - &id019
      reference_id: PMID:7635064
      supporting_text: We propose a model wherein tube activates pelle by recruiting it to the plasma
        membrane, thereby propagating the axis-determining signal.
