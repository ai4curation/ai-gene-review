id: P22812
gene_symbol: tub
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tube is a cytoplasmic adaptor protein of the Drosophila Toll pathway. It has an N-terminal
  death domain and C-terminal Tube repeats and no catalytic activity. On Toll activation by cleaved Spaetzle,
  the membrane-bound adaptor MyD88 recruits Tube to the cytoplasmic face of the plasma membrane. Tube
  uses two distinct surfaces of its death domain to bind the MyD88 and Pelle death domains, forming a
  MyD88-Tube-Pelle heterotrimeric complex that recruits and activates the IRAK-family kinase Pelle. Pelle
  then phosphorylates the IkappaB protein Cactus, leading to its degradation and to nuclear entry of the
  Rel proteins Dorsal and Dif. Tube also binds Dorsal through its C-terminal repeats. Maternally, tube
  is a dorsal-group gene required for ventral and lateral cell fates along the embryonic dorsoventral
  axis. In larvae and adults it is required for Toll-dependent induction of the antifungal peptide drosomycin
  and for resistance to fungal and Gram-positive bacterial infection. Zygotic Toll signalling through
  Tube also contributes to embryonic somatic muscle patterning.
