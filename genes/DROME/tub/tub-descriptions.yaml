    - rubric: specificity
      score: 3
    overall_notes: 'Correct: essential in Toll signalling for embryonic polarity;
      recruits and activates Pelle. ''Pupal pattern formation'' is not in the review,
      and the immune role is missing.'
- source: Alliance_Imported
  text: tube (tub) encodes an adaptor protein, which functions downstream of the product
    of Myd88 in the Toll pathway. Toll pathway is a signaling cascade that plays a
    key role in various developmental and immune processes, notably embryonic dorsoventral
    patterning and regulation of antimicrobial peptides.
