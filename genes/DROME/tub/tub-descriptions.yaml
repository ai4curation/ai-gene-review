- source: Alliance_Automated
  text: Enables protein domain specific binding activity and protein tyrosine kinase
    binding activity. Involved in several processes, including Toll signaling pathway;
    larval somatic muscle development; and positive regulation of antifungal peptide
    production. Located in cytoplasmic side of plasma membrane and cytosol. Is expressed
    in germline cell; oocyte; pole plasm; and primordial germ cell.
