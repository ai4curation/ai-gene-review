taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG11134 encodes the probable methylthioribulose-1-phosphate dehydratase of Drosophila melanogaster,
  a Zn2+-dependent class II aldolase-family (MtnB subfamily) enzyme that performs the third step of the
  methionine salvage pathway, the dehydration of 5-methylthioribulose 1-phosphate to 2,3-diketo-5-methylthiopentyl-1-phosphate.
  Its activity and cytosolic localization are inferred from orthology to the yeast and human enzymes (MDE1,
  APIP); the fly protein has not been studied experimentally.
