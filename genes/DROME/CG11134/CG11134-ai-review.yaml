suggested_questions:
- question: >-
    Human APIP also inhibits apoptosis via APAF1 binding and pyroptosis; does fly CG11134 have any role
    in cell death independent of methionine salvage?
suggested_experiments:
- description: >-
    Profile methionine-salvage intermediates and methionine in CG11134 mutants; test genetic interaction
    with Adi1 for fecundity under dietary restriction.
  hypothesis: CG11134 is required for methionine salvage in flies.
