- source: Alliance_Automated
  text: Enables ubiquitin ligase complex scaffold activity. Involved in several processes,
    including negative regulation of signal transduction; positive regulation of neuron
    remodeling; and positive regulation of protein metabolic process. Located in cytoplasm
    and nucleus. Part of SCF ubiquitin ligase complex. Is expressed in several structures,
    including adult head; anterior endoderm; embryonic/larval midgut primordium; germline
    cell; and imaginal disc. Orthologous to human CUL1 (cullin 1).
