id: Q24311
gene_symbol: Cul1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Cullin-1 (Cul1, lin-19) is the scaffold subunit of SCF (Skp1-Cul1-F-box) cullin-RING ubiquitin
  ligases in Drosophila. Its elongated N-terminal cullin-repeat domain binds the SkpA adaptor and thereby
  F-box substrate receptors (Slimb, Archipelago, Nutcracker, Fsn, Fbxo42, FipoQ and others), while its
  C-terminal cullin homology domain binds the RING protein Roc1a, which recruits the E2. Nedd8 conjugation
  to a conserved C-terminal lysine activates the ligase, and the COP9 signalosome removes it. SCF complexes
  built on Cul1 ubiquitinate phosphorylated substrates such as Cubitus interruptus, Armadillo, Cyclin
  E, Expanded and Akt, targeting them for proteasomal degradation or partial processing, and thereby act
  in Hedgehog, Wingless, Hippo, InR/TOR and IMD signaling, cell-cycle control, caspase activation during
  spermatid individualization, dendrite pruning and meiosis. Cul1 is found in the cytoplasm and nucleus.
