core_functions:
- description: 'Cul1 is the rigid cullin scaffold of SCF ligases: its N-terminal repeats bind SkpA (and
    through it F-box substrate receptors) and its C-terminal cullin homology domain binds Roc1a, positioning
    substrate and Roc1a-bound E2 for ubiquitin transfer; Nedd8 modification activates it.'
  molecular_function:
    id: GO:0160072
