    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  - id: GO:0000209
    label: protein polyubiquitination
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  in_complex:
