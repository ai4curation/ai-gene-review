    label: SCF ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:11500045
    supporting_text: We show that putative Drosophila SCF core subunits dSkpA and dRbx1 both interact
      directly with dCu11 and the F-box protein Slmb.
  - reference_id: PMID:12231629
    supporting_text: suggesting that the Cul1-based SCF complex requires Nedd8 modification for the degradation
      processes of Ci, Arm, and CycE in vivo
suggested_questions:
- question: How is Cul1 neddylation/deneddylation (CSN) cycling coordinated with F-box exchange (Cand1)
    to switch between SCF(Slimb), SCF(Ago) and testis SCF(Nutcracker) in vivo?
suggested_experiments:
- hypothesis: Neddylation-defective Cul1 (K->R at the conserved Nedd8 site) cannot support Ci processing
    or Cyclin E degradation in vivo.
  description: Rescue Cul1 null clones with wild-type or Nedd8-site mutant Cul1 and measure Ci-75/Ci-155
    ratios, Arm and Cyclin E levels in wing and eye discs.
