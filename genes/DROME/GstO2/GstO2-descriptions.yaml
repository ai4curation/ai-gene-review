- source: Alliance_Automated
  text: Enables glutathione dehydrogenase (ascorbate) activity and glutathione transferase
    activity. Involved in glutathione metabolic process. Located in cytosol and mitochondrion.
    Is expressed in several structures, including adult head; anterior endoderm; embryonic/larval
    garland cell; embryonic/larval midgut primordium; and gut section. Used to study
    amyotrophic lateral sclerosis type 6. Human ortholog(s) of this gene implicated
    in Alzheimer's disease; Parkinson's disease; and asthma. Orthologous to several
    human genes including GSTO2 (glutathione S-transferase omega 2).
