suggested_questions:
- question: Does GstO2 isoform A directly catalyse deglutathionylation of FUS Cys447 (as reported in vivo,
    PMID:35320731), and if so should protein-glutathione oxidoreductase (glutathione) activity (GO:0141049)
    be annotated alongside its glutathionylating activity on ATP synthase beta?
- question: Which sub-mitochondrial compartment holds GstO2 isoform A, and is the mitochondrial pool imported
    or peripherally associated, given that the protein lacks an obvious presequence?
- question: Are the opposing immune annotations from the Cronin et al. 2009 RNAi screen (negative regulation
    of innate immune response and defense response to Gram-negative bacterium) based on the same RNAi
    line, and were they reproduced?
suggested_experiments:
- description: Fractionate adult thorax mitochondria (with ER and cytosol markers) and use protease protection
    and isoform-specific antibodies to localise GstO2A and GstO2B.
  hypothesis: Isoform A, but not B, is present in the mitochondrial matrix where it glutathionylates ATP
    synthase beta.
- description: Measure glutathionylation and deglutathionylation kinetics of recombinant GstO2A, GstO2B
    and the C31A mutant on purified ATP synthase beta and FUS peptides containing Cys447.
  hypothesis: The direction of the GstO2 thiol-disulfide exchange depends on substrate and GSH/GSSG ratio,
    and the isoform N-terminal motifs (CPFS vs CPYS) set substrate preference.
