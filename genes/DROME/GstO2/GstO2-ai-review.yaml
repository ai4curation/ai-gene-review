core_functions:
- description: Glutathione-dependent dehydroascorbate reductase that regenerates ascorbate from dehydroascorbate
    using GSH; the dominant DHAR in the fly (mostly via isoform B), contributing to cellular antioxidant
    capacity.
  molecular_function:
    id: GO:0045174
    label: glutathione dehydrogenase (ascorbate) activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id006
  - *id009
  - *id007
- description: Cys31-dependent glutathione transferase that S-glutathionylates protein cysteines, notably
    the mitochondrial F1F0-ATP synthase beta subunit (isoform A), supporting ATP synthase activity and
    assembly.
  molecular_function:
    id: GO:0004364
    label: glutathione transferase activity
  directly_involved_in:
  - id: GO:0010731
    label: protein glutathionylation
