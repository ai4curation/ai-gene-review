taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: GstO2 (CG6673) is an Omega-class cytosolic glutathione S-transferase of Drosophila melanogaster.
  It has the thioredoxin-like GST N-terminal domain with an active-site cysteine (Cys31) and the all-alpha
  GST C-terminal domain, and is expressed as two alternatively spliced isoforms, A and B, that differ
  in their N-terminal region including the active-site motif. Like other Omega GSTs it has little activity
  toward CDNB but high glutathione-dependent thiol transferase and dehydroascorbate reductase (DHAR) activity;
  isoform B carries most of the DHAR activity and loss of the gene lowers whole-fly DHAR activity, perturbs
  the ascorbate/dehydroascorbate ratio and sensitises flies to paraquat. Isoform A catalyses S-glutathionylation
  of proteins, notably the mitochondrial F1F0-ATP synthase beta subunit, which supports ATP synthase activity
  and assembly; its overexpression suppresses parkin and PINK1 mutant phenotypes and neurotoxicity in
  fly TDP-43, TAF15 and FUS proteinopathy models. The protein is found in the cytosol and mitochondria.
