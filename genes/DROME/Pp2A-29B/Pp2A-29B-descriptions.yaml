- source: Alliance_Automated
  text: Enables protein phosphatase regulator activity. Involved in several processes,
    including RNA polymerase II transcription initiation surveillance; membraneless
    organelle assembly; and regulation of signal transduction. Located in centriole.
    Part of FAR/SIP/STRIPAK complex; INTAC complex; and protein phosphatase type 2A
    complex. Is active in chromatin; cytosol; and nucleus. Is expressed in several
    structures, including adult head; adult midgut; brain; embryonic/larval salivary
    gland; and female germline cell. Human ortholog(s) of this gene implicated in
    autosomal dominant intellectual developmental disorder 36 and lung cancer. Orthologous
    to human PPP2R1A (protein phosphatase 2 scaffold subunit Aalpha) and PPP2R1B (protein
    phosphatase 2 scaffold subunit Abeta).
