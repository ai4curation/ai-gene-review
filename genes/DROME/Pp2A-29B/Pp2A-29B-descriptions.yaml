- source: Alliance_Imported
  text: Protein phosphatase 2A at 29B (Pp2A-29B) encodes the structural A subunit
    of the trimeric PP2A phosphatase enzyme. It links the catalytic C subunit encoded
    by mts and a variable regulatory B family subunit, which directs the enzyme to
    distinct substrates. The roles of Pp2A-29B product include centriole duplication,
    chromosome segregation, autophagy, axonal transport, growth regulation, and active
    zone stabilization.
  source_type: curated
