descriptions:
- source: UniProt
  text: 'The PR65 subunit of protein phosphatase 2A serves as a scaffolding molecule
    to coordinate the assembly of the catalytic subunit and a variable regulatory
    B subunit (By similarity). Key mediator of a quality checkpoint during transcription
    elongation as part of the Integrator-PP2A (INTAC) complex (PubMed:32966759). The
    INTAC complex drives premature transcription termination of transcripts that are
    unfavorably configured for transcriptional elongation: within the INTAC complex,
    acts as a scaffolding subunit for mts/PP2A, which catalyzes dephosphorylation
    of the C-terminal domain (CTD) of Pol II subunit POLR2A/RPB1 and Spt5, thereby
    preventing transcriptional elongation (PubMed:32966759).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36179
