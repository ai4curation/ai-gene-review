id: P36179
gene_symbol: Pp2A-29B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Pp2A-29B encodes PR65, the structural A (scaffold) subunit of Drosophila protein phosphatase
  2A. Built from 15 HEAT-like repeats, it binds the catalytic subunit Microtubule star and one of several
  regulatory subunits (the B55 Twins, the B56 Widerborst or Well rounded, or the striatin Cka in STRIPAK),
  assembling the PP2A holoenzymes that dephosphorylate mitotic and signaling substrates. The A-C core
  is also recruited to the Integrator complex (INTAC), where it dephosphorylates the RNA polymerase II
  CTD and Spt5 to restrain promoter-proximal pause release. Like Mts, Pp2A-29B is required for mitotic
  spindle assembly, chromosome segregation, centrosome maturation and centriole duplication, and through
  specific holoenzymes for Hippo pathway restraint (STRIPAK), oocyte meiotic cohesion and spindle regulation,
  Hedgehog and insulin/S6K signaling.
