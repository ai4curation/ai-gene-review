- source: Alliance_Imported
  text: sugarless (sgl) encodes an UDP-glucose 6-dehydrogenase that catalyzes the
    conversion of UDP-D-glucose into UDP-D-glucuronate, a component of glycosaminoglycans.
    UDP-D-glucuronate is required for the biosynthesis of heparan sulfate and chondroitin
    sulfate proteoglycans.
