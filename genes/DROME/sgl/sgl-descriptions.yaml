- source: Alliance_Automated
  text: Enables UDP-glucose 6-dehydrogenase activity. Involved in several processes,
    including UDP-glucuronate biosynthetic process; epithelial cell migration, open
    tracheal system; and protein O-linked glycosylation via xylose. Acts upstream
    of with a positive effect on fibroblast growth factor receptor signaling pathway.
    Predicted to be located in cytoplasm. Predicted to be active in cytosol. Is expressed
    in several structures, including embryonic/larval hemocyte; embryonic/larval midgut
    cell; epithelial furrow; gut section; and somatic precursor cell. Human ortholog(s)
    of this gene implicated in developmental and epileptic encephalopathy 84. Orthologous
    to human UGDH (UDP-glucose 6-dehydrogenase).
