suggested_questions:
- question: Is Sgl activity rate-limiting for heparan sulfate levels in specific tissues, as suggested
    by dosage effects on white-apricot eye pigmentation?
suggested_experiments:
- description: Quantify UDP-glucuronate and UDP-xylose pools and HS disaccharides in sgl heterozygotes
    and tissue-specific sgl overexpression to test whether UDP-glucuronate supply limits HS synthesis.
