id: O02373
gene_symbol: sgl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: sugarless (sgl; also called kiwi or suppenkasper) encodes the Drosophila UDP-glucose 6-dehydrogenase,
  a cytosolic NAD(+)-dependent enzyme that oxidizes UDP-alpha-D-glucose to UDP-alpha-D-glucuronate. UDP-glucuronate
  is the uronic acid donor for heparan sulfate and chondroitin sulfate chains and the precursor of UDP-xylose,
  which initiates glycosaminoglycan linkage regions. sgl is therefore required for glycosaminoglycan and
  proteoglycan synthesis, and its mutants phenocopy loss of Wingless, Hedgehog and FGF receptor signaling,
  which depend on heparan sulfate proteoglycans, causing segment polarity, mesoderm migration and tracheal
  cell migration defects.
