  label: Drosophila melanogaster
description: CSN5 is the JAMM-family catalytic subunit of the COP9 signalosome, which removes Nedd8 from
  cullin proteins and regulates cullin-RING ubiquitin ligases. Its metalloprotease activity depends on
  assembly with other signalosome subunits. The native 325-residue PB isoform retains the MPN domain and
  JAMM metal-binding motif of the characterized PA product. CSN5 acts in nuclear and cytoplasmic regulatory
  complexes and supports diverse developmental processes.
