  review:
    summary: CSN5 is a COP9 signalosome component; the native PB product retains the full MPN/JAMM architecture
      of the characterized same-gene PA protein.
    action: NEW
    reason: The primary fly study isolated all eight COP9 components and established complex association
      by co-immunoprecipitation and gel filtration. The exact PB product differs by only two residues
      outside the MPN domain; the retained architecture supports transfer of complex membership, without
      claiming direct experimental isolation of PB.
    supported_by:
