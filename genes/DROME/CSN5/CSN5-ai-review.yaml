  review:
    action: ACCEPT
    summary: CSN5 occurs in both nuclear and cytoplasmic pools; nucleus is the appropriate compartment-level
      term for the PB product.
    reason: The reviewed same-gene PA entry (Q9XZ58) records nuclear and cytoplasmic localization, and
      FlyBase records an IDA for nuclear periphery (a part of the nucleus) from larval hemocyte
      immunostaining (PMID:17295838). PB is identical to PA except for two residues outside the MPN
      domain, so compartment-level localization transfers. Nucleus is as precise as is warranted across
      tissues; the nuclear-periphery observation is tissue-specific and was not tested on PB. The SubCell
      mapping is consistent with the conserved COP9 signalosome distribution.
    supported_by:
    - reference_id: file:DROME/CSN5/CSN5-reference-Q9XZ58-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000305|PubMed:10531038}. Nucleus'
