id: A0A0B4KHM2
gene_symbol: CSN5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CSN5 (also called Jab1) is the catalytic subunit of the Drosophila COP9 signalosome,
  an eight-subunit complex related to the 26S proteasome lid. Its MPN domain carries a JAMM metal-binding
  motif (His-x-His...Asp) that forms the active site of the signalosome's NEDD8 isopeptidase, which removes
  NEDD8 from the cullin subunits of cullin-RING ubiquitin ligases such as SCF complexes. CSN5 has no
  isopeptidase activity on its own; activity requires assembly with the other signalosome subunits. By
  resetting cullin neddylation, the complex controls ubiquitin-dependent turnover of cell-cycle and signalling
  proteins, for example Cyclin E in early oogenesis. CSN5 is found in the cytoplasm and the nucleus. Loss
  of CSN5 is lethal and disrupts oogenesis, germline stem cell maintenance, photoreceptor differentiation
  and glial migration, and hemocyte homeostasis; these are downstream consequences of altered cullin-RING
  ligase activity. The gene encodes two products, PA (327 aa) and PB (325 aa); PB lacks two residues
  (Gly278-Arg279) outside the MPN domain and keeps the complete catalytic region.
