- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000555
  review:
    action: MODIFY
    summary: Correct but too general; the specific activity is metal-dependent NEDD8 isopeptidase
      (deNEDDylase) activity on cullins, supplied by the CSN5 JAMM site within the COP9 signalosome.
    reason: The JAMM/MPN+ InterPro mapping to generic peptidase activity is right in kind, since JAMM
      proteins are metalloisopeptidases. For CSN5 the substrate is established. Metal chelators and
      JAMM point mutations abolish CSN-dependent removal of Nedd8 from Cul1, and fly csn5 mutants fail
      to deneddylate Cullin1 in the ovary. FlyBase already holds an IDA for GO:0140758 on the PA product
      (PMID:12737805), and PAINT propagates deNEDDylase activity from the CSN5 clade node PTN000045369.
      PB keeps His135, His137 and Asp148. The activity is expressed only in the assembled complex, so
      the core function records it with contributes_to_molecular_function and the COP9 signalosome.
    supported_by:
    - reference_id: PMID:12183637
      supporting_text: Metal chelators and point mutations within JAMM abolished CSN-dependent cleavage
        of Nedd8 from Cul1, yet had little effect on CSN complex assembly.
    - reference_id: PMID:12737805
      supporting_text: we show that the CSN acts during Drosophila oogenesis to remove Nedd8 from Cullin1
    - reference_id: file:DROME/CSN5/CSN5-reference-Q9XZ58-uniprot.txt
      supporting_text: In the complex, it probably acts as the catalytic center that mediates the cleavage
        of Nedd8 from cullins. It however has no metalloprotease activity by itself and requires the other
        subunits of the CSN complex.
    - reference_id: file:DROME/CSN5/CSN5-bioinformatics/RESULTS.md
      supporting_text: The MPN domain 52–189 and JAMM motif 135–148 are completely retained, including
        His135, His137 and Asp148.
    proposed_replacement_terms:
    - id: GO:0140758
      label: metal-dependent deNEDDylase activity
