      supporting_text: The MPN domain 52–189 and JAMM motif 135–148 are completely retained, including
        His135, His137 and Asp148.
    - reference_id: PMID:12183637
      supporting_text: 'The Jab1/MPN domain metalloenzyme (JAMM) motif

        in the Jab1/Csn5 subunit was found to underlie CSN''s Nedd8 isopeptidase

        activity.'
    - reference_id: PMID:21102408
      supporting_text: TA binds CSN4 and the synaptic regulator snapin in neuroblastoma cells and in brain
        synaptosomes.
