    summary: The target is a near-identical CSN5 splice product retaining the complete JAMM catalytic
      domain, and primary evidence establishes its COP9 deneddylation mechanism. The only experimental
      support for a synaptic-vesicle location in this ortholog group is a human COPS5 annotation from a
      mammalian study of the CSN complex in neuroblastoma cells and brain synaptosomes, whose abstract
      describes CSN4 binding and a role in synaptic protein stability rather than CSN5 residence in vesicles,
      and whose full text is not cached. Insects have no reported CSN5 synaptic localization, and no PAINT
      or curated phylogenetic transfer carries this term to the fly protein. The fly gene review records
      only nucleus and cytoplasm locations. The donor label from Xenopus Q6GLM9 is therefore not validated
      for the target, and no fly evidence refutes it. The term is absent from the GOA of both fly CSN5
      products.
