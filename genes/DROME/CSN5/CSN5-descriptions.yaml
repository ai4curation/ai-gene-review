descriptions:
- source: Alliance_Imported
  text: COP9 signalosome subunit 5 (CSN5) encodes the subunit 5 of the COP9 signalosome
    (CSN). The CSN plays a central role in the regulation of E3-cullin RING ubiquitin
    ligases. The product of CSN5 is an isopeptidase that deNEDDylates the cullin subunit
    of E3-cullin RING ubiquitin ligases.
  source_type: curated
