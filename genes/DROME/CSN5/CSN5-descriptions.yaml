- source: Alliance_Automated
  text: Enables metal-dependent deNEDDylase activity. Involved in several processes,
    including neurogenesis; oogenesis; and regulation of protein catabolic process.
    Located in cytoplasm and nuclear periphery. Part of COP9 signalosome. Is expressed
    in adult head and embryonic/larval midgut. Orthologous to human COPS5 (COP9 signalosome
    subunit 5).
