descriptions:
- source: Alliance_Imported
  text: abnormal wing discs (awd) encodes a nucleotide diphosphate kinase that regulates
    with the product of shi the endocytosis of different surface proteins (e.g. those
    encoded by N, btl, Pvr, and shg). During development, it regulates morphogenesis
    of trachea, follicular epithelium, and imaginal discs and contributes to neurotransmission
    and border cell migration.
  source_type: curated
  url: https://flybase.org/reports/awd.html
  source_id: FB:FBgn0000150
  review:
    reviewer: AI
    rubrics:
