      supporting_text: We purified the nucleoside
        diphosphate kinases from wild-type and mutant larvae by a simple procedure
        involving affinity chromatography on blue Sepharose.
    - reference_id: PMID:2175255
      supporting_text: We present evidence that the awd gene codes for a
        nucleoside diphosphate kinase (NDP kinase)
    - reference_id: PMID:7559441
