taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Abnormal wing discs encodes a nucleoside diphosphate kinase that maintains nucleotide triphosphate
  pools by transferring phosphate through a phosphohistidine intermediate. The native 168-residue PC/PD
  protein contains the complete 153-residue characterized enzyme sequence with an N-terminal extension.
  All mapped substrate-binding residues and the catalytic histidine are retained. Its core nucleotide-interconversion
  activity supports cellular growth and development. Awd also supports endocytic trafficking and early-endosome
  maturation, enabling the proper handling of signaling receptors such as Notch.
