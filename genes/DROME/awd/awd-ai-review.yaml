id: A0A0B4LHX6
gene_symbol: awd
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  abnormal wing discs (awd) encodes the Drosophila nucleoside diphosphate kinase (NDPK), the fly
  ortholog of the NME/NM23 group-I enzymes. Awd is a cytoplasmic, microtubule-associated homohexamer
  that transfers the gamma-phosphate of ATP to other ribo- and deoxyribonucleoside diphosphates through
  a phosphohistidine intermediate, keeping cellular GTP, UTP, CTP and dNTP pools supplied. Null mutants
  die as larvae with small imaginal discs and mitotic defects. Genetic studies also show that awd is
  needed for dynamin-dependent endocytosis and for receptor cargo such as Notch, Breathless/FGFR and
  adherens-junction proteins to progress through early endosomes; whether this reflects local GTP
  supply to dynamin or Rab5 has not been shown. In the ovary awd acts as a negative regulator of border
  cell migration; its down-regulation in border cells allows optimal Pvr and JAK/STAT signalling, and its
  overexpression stalls migration and suppresses the effect of constitutively active Pvr. This entry (A0A0B4LHX6) is the 168-residue awd-PC/PD
  gene-model product. It contains the whole 153-residue enzyme (P08879, awd-PE) after a 15-residue
  N-terminal extension. The enzyme purified from flies has the mass of the 153-residue form, which
  suggests that the extension is not part of the bulk native protein.
existing_annotations:
- term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001564
  - EC:2.7.4.6
  review:
    action: ACCEPT
    summary: Core catalytic activity of awd; directly assayed on the enzyme purified from flies.
    reason: >-
      NDPK activity has been measured directly for the enzyme purified from wild-type and mutant
      larvae (PMID:1320004; PMID:2175255). Active-site mutations that abolish the activity also
      abolish awd genetic function (PMID:7559441). The 168-residue gene-model product contains the
      entire 153-residue enzyme unchanged, including the phosphohistidine His (His134 here, His119 in
      P08879) and all annotated nucleotide-binding residues. The InterPro/EC-based IEA is therefore
      correct for this product. awd sits in PANTHER subfamily PTHR11349:SF91 with yeast YNK1 and
      worm ndk-1, a branch of the family whose members are catalytically active. Whether the N-terminal
      extension is ever translated is uncertain (see identity notes). That uncertainty does not affect
      what the protein does if made.
    supported_by:
