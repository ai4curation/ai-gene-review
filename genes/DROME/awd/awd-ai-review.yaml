- id: PMID:24528630
  title: Notch signaling during development requires the function of awd, the Drosophila homolog of human
    metastasis suppressor gene Nm23.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. Mutant-clone, marker co-localisation and Rab5CA epistasis data show awd is
      necessary for Notch progression past Rab5 early endosomes. The paper does not identify a
      molecular step that Awd performs in endosome maturation. On re-review it is no longer used to
