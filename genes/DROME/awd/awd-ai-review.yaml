      context for the description and suggested questions.
- id: PMID:18212059
  title: Awd, the homolog of metastasis suppressor gene Nm23, regulates Drosophila epithelial cell invasion.
  findings:
  - statement: Awd negatively regulates border cell migration by limiting Pvr and JAK/STAT signalling,
      and its overexpression suppresses constitutive Pvr and dominant-negative dynamin.
    supporting_text: Here we show that the metastasis suppressor gene homolog Nm23/awd is a negative
      regulator of border cell migration.
  - statement: Overexpression of awd reverts the phenotypes of constitutive Pvr and dominant-negative
      dynamin in border cells.
    supporting_text: Its overexpression in the border cells results in stalled migration and can revert
      the phenotype of overexpressing constitutive Pvr or dominant-negative dynamin.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Nallamothu et al. 2008, Mol Cell Biol); abstract only cached. It
      supports the FlyBase statements on border cell migration and on Pvr as a receptor whose signalling
      awd limits, consistent with the dynamin-dependent endocytosis role. Recorded in the description.
      No GO process row was added, because, as for Notch, the step Awd performs in Pvr endocytosis is
      not identified.
- id: file:DROME/awd/awd-deep-research-flybase.md
  title: FlyBase gene description for awd (DROME)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Checked each claim. NDP kinase activity, the role with shi/dynamin in endocytosis of
      Notch (PMID:24528630), Breathless and adherens-junction cargo, and morphogenesis of trachea,
      follicular epithelium and imaginal discs agree with the review. Pvr and border cell migration are
      supported by PMID:18212059 and were added to the description. The contribution to
      neurotransmission, which rests on genetic interaction with shibire, was not traced to a cached
      paper; it is consistent with the endocytosis role and is treated as peripheral.
