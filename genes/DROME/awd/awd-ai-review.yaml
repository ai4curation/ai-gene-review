suggested_questions:
- question: >-
    Is the 168-residue awd-PC/PD product (upstream initiation codon) ever translated in vivo?
    Bulk purified Awd has the mass of the Met-removed, N-acetylated 153-residue form, and
    substituting the downstream initiator Met abolishes protein accumulation. If so, is the
    hydrophobic N-terminal extension that SignalP calls a signal peptide functional?
- question: >-
    Does Awd act in endocytosis and early-endosome maturation by catalysing a step, for example
    locally supplying GTP to dynamin/Shibire or Rab5? Or is its requirement indirect, through
    nucleotide pools? The answer decides whether a process annotation such as early endosome to late
    endosome transport (GO:0045022) or a regulation term is appropriate. Neither is asserted here.
suggested_experiments:
- description: >-
    Tag endogenous awd at the C-terminus, and use N-terminal proteomics plus initiation-codon
    mutants (the upstream ATG versus the downstream Met16 ATG) to test whether any extended product
    is made and where it localises.
- description: >-
    Rescue awd null follicle-cell clones with catalytically dead (phosphohistidine His-to-Phe) versus
    wild-type Awd and score Notch progression from Rab5 to Rab7 compartments. This tests whether
    the endosomal requirement depends on phosphotransfer.
