  review:
    summary: Awd supports progression of endocytosed receptor cargo beyond early endosomes.
    action: NEW
    reason: The primary fly study combines mutant clones, live receptor trafficking, compartment markers
      and Rab5/NICD epistasis to place Awd in early-endosomal maturation required for receptor progression.
      The exact accession retains the complete characterized enzyme sequence with an N-terminal extension,
      supporting same-gene transfer of this broad role. Direct nucleotide delivery to Rab5 or dynamin
      is a mechanistic hypothesis, not an established reaction channel.
    supported_by:
    - &id004
      reference_id: PMID:24528630
      supporting_text: Taken together, these results suggest that during Notch signaling awd function
        is downstream of or is required for Rab5 function in promoting maturation of early endosomes.
