      supporting_text: Catalytic His119 maps to target His134; all seven annotated nucleotide-binding
        positions are preserved.
- term:
    id: GO:0006183
    label: GTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001564
  review:
    action: ACCEPT
    summary: NDPK carries out the final step of GTP synthesis (GDP + ATP -> GTP + ADP).
    reason: >-
      Awd catalyses the step itself, so this is participation, not mere requirement. GDP-to-GTP
      phosphorylation is one of the ribonucleoside reactions in the curated P08879 catalytic
      activity, supported by enzyme from flies (PMID:1320004). FlyBase also records experimental
      ribonucleoside triphosphate biosynthesis for awd. The PAINT IBA on the gene places
      nucleoside triphosphate biosynthesis at the ancestral node. The catalytic core is intact
      in this product.
    supported_by:
    - reference_id: file:DROME/awd/awd-reference-P08879-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Major role in the synthesis of nucleoside triphosphates other'
    - reference_id: PMID:1320004
      supporting_text: We purified the nucleoside
        diphosphate kinases from wild-type and mutant larvae
    - reference_id: file:DROME/awd/awd-bioinformatics/RESULTS.md
      supporting_text: Catalytic His119 maps to target His134; all seven annotated nucleotide-binding
        positions are preserved.
- term:
    id: GO:0006228
    label: UTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001564
  review:
    action: ACCEPT
    summary: NDPK carries out the final step of UTP synthesis (UDP + ATP -> UTP + ADP).
    reason: >-
      As for GTP, awd catalyses the terminal phosphorylation step. The term matches the
      broad-substrate ribonucleoside reaction curated for P08879 (PMID:1320004) and the
      NDPK step of de novo pyrimidine synthesis. UDP-to-UTP is the canonical NDPK step, and the
      catalytic core is intact in this product.
    supported_by:
    - reference_id: file:DROME/awd/awd-reference-P08879-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Major role in the synthesis of nucleoside triphosphates other'
    - reference_id: file:DROME/awd/awd-bioinformatics/RESULTS.md
      supporting_text: Catalytic His119 maps to target His134; all seven annotated nucleotide-binding
        positions are preserved.
- term:
    id: GO:0006241
    label: CTP biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001564
  review:
    action: ACCEPT
    summary: NDPK phosphorylates CDP to CTP, one route of cellular CTP supply.
    reason: >-
      NDPK phosphorylates CDP, and awd uses broad ribonucleoside substrates. CTP is mostly made by
      CTP synthase acting on UTP, so the NDPK contribution runs through the UTP pool and through
      CDP salvage. Awd still performs a step that yields CTP, so the term is a correct description
      of its catalysis. It is accepted for consistency with the shared InterPro mapping.
    supported_by:
    - reference_id: file:DROME/awd/awd-reference-P08879-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Major role in the synthesis of nucleoside triphosphates other'
    - reference_id: file:DROME/awd/awd-bioinformatics/RESULTS.md
      supporting_text: Catalytic His119 maps to target His134; all seven annotated nucleotide-binding
        positions are preserved.
