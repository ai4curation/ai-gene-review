descriptions:
- source: UniProt
  text: '[Protein hedgehog]: The C-terminal part of the hedgehog protein precursor
    displays an autoproteolysis activity that results in the cleavage of the full-length
    protein into two parts (N-product and C-product) (PubMed:7885476). In addition,
    the C-terminal part displays a cholesterol transferase activity that results by
    the covalent attachment of a cholesterol moiety to the C-terminal of the newly
    generated N-product (By similarity). Once cleaved, the C-product has no signaling
    activity and diffuses from the cell (PubMed:12586063). . [Protein hedgehog N-product]:
    The dually lipidated hedgehog protein N-product is a morphogen which is essential
    for a variety of patterning events during development (PubMed:11319862, PubMed:1340474,
    PubMed:1394430, PubMed:25639794, PubMed:27195754, PubMed:8166882). Establishes
    the anterior-posterior axis of the embryonic segments and patterns the larval
    imaginal disks. Binds to the patched (ptc) receptor, which functions in association
    with smoothened (smo), to activate the transcription of target genes wingless
    (wg), decapentaplegic (dpp) and ptc. In the absence of hh, ptc represses the constitutive
    signaling activity of smo through fused (fu). Essential component of a signaling
    pathway which regulates the Duox-dependent gut immune response to bacterial uracil;
    required to activate Cad99C- dependent endosome formation, norpA-dependent Ca2+
    mobilization and p38 MAPK, which are essential steps in the Duox-dependent production
    of reactive oxygen species (ROS) in response to intestinal bacterial infection
    (PubMed:25639794). During photoreceptor differentiation, it up-regulates transcription
    of Ubr3, which in turn promotes the hh- signaling pathway by mediating the ubiquitination
    and degradation of cos (PubMed:11319862, PubMed:1340474, PubMed:1394430, PubMed:25639794,
    PubMed:27195754, PubMed:8166882).'
