- source: Alliance_Imported
  text: hedgehog (hh) encodes the Hh signaling pathway ligand. It acts as a morphogen
    contributing to segment polarity determination, stem cells maintenance and cell
    migration. Post-translational modifications of the product of hh are essential
    for its restrictive spreading and signaling activity.
