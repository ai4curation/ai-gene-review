- source: Alliance_Automated
  text: Enables morphogen activity and patched binding activity. Involved in several
    processes, including eye morphogenesis; imaginal disc development; and open tracheal
    system development. Located in several cellular components, including cytoplasmic
    vesicle; extracellular region; and nucleus. Is expressed in several structures,
    including gut section; imaginal disc; imaginal disc posterior compartment; segment;
    and somatic precursor cell. Used to study primary bacterial infectious disease.
    Human ortholog(s) of this gene implicated in several diseases, including bone
    development disease (multiple); gastrointestinal system disease (multiple); gonadal
    dysgenesis (multiple); holoprosencephaly (multiple); and polydactyly (multiple).
    Orthologous to several human genes including DHH (desert hedgehog signaling molecule).
