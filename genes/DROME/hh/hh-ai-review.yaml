  evidence_type: IDA
  original_reference_id: PMID:9215627
  qualifier: involved_in
  review:
    summary: Hh inhibits the proteolytic processing of Cubitus interruptus that would otherwise generate
      the nuclear repressor form.
    action: KEEP_AS_NON_CORE
    reason: Kept, but as a non-core annotation. The event recorded here happens inside the responding
      cell, several steps downstream of ligand binding, and is performed by pathway components rather
      than by Hh itself; Hh is the input that changes its rate. Retaining it as non-core records the causal
      link without implying that the ligand executes the step. The proteolysis is carried out by the proteasome
      acting on a phosphorylated, Slimb-targeted Ci, within the responding cell; Hh sets whether it happens.
    supported_by:
    - reference_id: PMID:9215627
      supporting_text: Hh inhibits proteolysis of Ci, and we suggest that this inhibition leads to the
        observed patterns of expression of key target genes at the compartment border.
