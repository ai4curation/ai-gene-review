- term:
    id: GO:0008354
    label: primordial germ cell migration
  evidence_type: IDA
  original_reference_id: PMID:19389345
  qualifier: involved_in
  negated: true
  review:
    summary: 'A NOT annotation: this row asserts the absence of the function. A targeted re-examination,
      repeating the critical earlier experiments, found no support for Hh acting as a germ cell attractant
      in Drosophila, consistent with findings in zebrafish.'
    action: KEEP_AS_NON_CORE
    reason: 'The negation is well supported and should be retained; it is the strongest single piece of
      evidence on this question. Whether Hh guides migrating germ cells is contested in the primary literature,
      and GOA carries both sides: Deshpande and Schedl reported Hh-dependent germ cell migration and an
      hmgcr interaction, while Renault and colleagues repeated the critical experiments and found no direct
      role. FlyBase records the negative result as a NOT annotation on this same term. The rows are kept
      as non-core rather than removed or left undecided: hh mutants do show germ cell migration defects,
      but the best explanation for them is the gonadal-mesoderm route that is annotated separately, not
      a direct guidance activity of the ligand. Users of this term should read the positive and negated
      rows together.'
    supported_by:
    - reference_id: PMID:19389345
      supporting_text: In contrast to previously reported findings and consistent with findings in zebrafish
        our data do not support the notion that Hh has a direct role in the guidance of migrating germ
        cells in flies.
