- term:
    id: GO:0007267
    label: cell-cell signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000320
  - InterPro:IPR001657
  review:
    summary: An InterPro-to-GO mapping from the Hedgehog signalling domain and the Hint/Hog domain to
      the broad term cell-cell signalling. The direction is right but the mapping is far less specific
      than the pathway hh actually initiates, which is annotated here with direct evidence many times
      over.
    action: MODIFY
    reason: Cell-cell signalling is not wrong - Hh is the archetypal cell-cell signal of the fly embryo
      - but an InterPro signature that is diagnostic of a Hedgehog ligand supports the specific term.
      GO:0007224 smoothened signaling pathway is the term the same domains warrant and is already annotated
      to hh by IBA, IDA, IMP and IGI.
    proposed_replacement_terms:
    - id: GO:0007224
      label: smoothened signaling pathway
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:11279500
  qualifier: involved_in
  review:
    summary: 'Hh acts on somatic stem cells in the adult ovary: these cells cannot proliferate as stem
      cells without Hh signalling, and excess signalling produces supernumerary stem cells.'
    action: KEEP_AS_NON_CORE
    reason: Kept, but as a non-core annotation. The event recorded here happens inside the responding
      cell, several steps downstream of ligand binding, and is performed by pathway components rather
      than by Hh itself; Hh is the input that changes its rate. Retaining it as non-core records the causal
      link without implying that the ligand executes the step.
    supported_by:
    - reference_id: PMID:11279500
      supporting_text: These cells cannot proliferate as stem cells in the absence of Hh signalling, whereas
        excessive Hh signalling produces supernumerary stem cells.
- term:
    id: GO:0007367
    label: segment polarity determination
  evidence_type: IEP
  original_reference_id: PMID:8166882
  qualifier: involved_in
  review:
    summary: hh is a segment polarity gene, expressed in a series of segmental stripes from cellular blastoderm
      onwards; this IEP row is curated from the original structure-and-expression paper.
    action: KEEP_AS_NON_CORE
    reason: 'Kept, but as a non-core annotation. Drosophila hh is a single ligand with one biochemical
