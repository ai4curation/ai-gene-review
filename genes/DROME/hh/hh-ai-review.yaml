core_functions:
- description: The mature, dually lipidated Hh-Np released from posterior-compartment cells binds the
    Drosophila Hedgehog receptor, a complex of Patched with Ihog or Boi, on anterior cells. Binding relieves
    Patched-mediated inhibition of Smoothened, which switches conformation, is phosphorylated, accumulates
    at the cell surface and signals through the Costal-2/Fused/Suppressor of fused complex, blocking processing
    of Cubitus interruptus into its repressor form.
  molecular_function:
    id: GO:0005113
    label: patched binding
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:20048000
    supporting_text: We demonstrate that Ihog interacts directly with Ptc, is required for presentation
      of Ptc on the cell surface, and that Ihog and Ptc are both required for high-affinity Hh binding.
  - reference_id: PMID:26863604
    supporting_text: In Hedgehog (Hh) signaling, binding of Hh to the Patched-Interference Hh (Ptc-Ihog)
      receptor complex relieves Ptc inhibition on Smoothened (Smo).
- description: 'Hh-Np acts as a morphogen: target genes with different activation thresholds respond at
    different distances from the source, and the phosphorylation states of Smoothened and of Cubitus interruptus
    scale with ligand concentration and exposure time. Range is set by the lipid anchors and by the machinery
    that handles them - Dispatched, glypicans, lipophorin, Shifted, cytoneme transport and shedding of
    the lipidated termini.'
  molecular_function:
    id: GO:0016015
    label: morphogen activity
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:20412775
    supporting_text: Here, we show that interfering with the amount of apical Hh causes a dramatic change
      in the long-range activation of low-threshold Hh target genes, without similar effect on short-range,
      high-threshold targets.
  - reference_id: PMID:36271509
    supporting_text: Phosphorylation at the N-terminal, middle, and C-terminal Fu/CK1 sites occurred independently
      of one another and each increased progressively in response to increasing levels of Hh or increasing
      amounts of Hh exposure time.
  - reference_id: PMID:29522397
    supporting_text: Hence, palmitoylated membrane anchors restrict morphogen spread until site-specific
      processing switches membrane-bound Hh into bioactive forms with specific patterning functions.
- description: The C-terminal Hint/Hog domain of the Hh precursor is an enzyme acting on its own polypeptide.
    In a single reaction cycle in the secretory pathway it cleaves the chain between Gly257 and Cys258
    and esterifies cholesterol onto the new C terminus of the N-terminal signalling domain. Asp303 is
    required for the cholesterol transfer step and His329 for cleavage; the C-terminal product that is
    released has no signalling activity. Palmitoylation of Cys85, the N-terminal cysteine of the mature
    signalling domain, is then carried out by a separate enzyme, Rasp.
  molecular_function:
    id: GO:0140853
    label: cholesterol-protein transferase activity
  directly_involved_in:
  - id: GO:0016540
    label: protein autoprocessing
  supported_by:
  - reference_id: PMID:9335337
    supporting_text: The approximately 25 kDa carboxy-terminal domain of Drosophila Hedgehog protein (Hh-C)
      possesses an autoprocessing activity that results in an intramolecular cleavage of full-length Hedgehog
      protein and covalent attachment of a cholesterol moiety to the newly generated amino-terminal fragment.
  - reference_id: PMID:7885476
    supporting_text: We show here that the N product is the active species in both local and long-range
      signalling.
