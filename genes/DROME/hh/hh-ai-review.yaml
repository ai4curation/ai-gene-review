- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:1280560
  qualifier: located_in
  review:
    summary: Nuclear localisation attributed to Hh on the basis of a 1992 study that reported nuclear
      localisation of the hh RNA, not of the Hh protein.
    action: REMOVE
    reason: 'The cited paper is a molecular-organisation and expression study, and the localisation it
      reports is of the hh transcript, not of the protein: "This RNA is localized predominantly within
      nuclei until stage 10, when the localization becomes primarily cytoplasmic." No anti-Hh antibody
      data appear in it. The protein carries a cleaved N-terminal signal sequence, is co-translationally
      translocated into the secretory pathway, autoprocesses in the ER lumen and is released from the
      cell; there is no evidence for a nucleoplasmic or cytosolic pool, and no mechanism by which a signal-peptide-bearing
      ligand would reach either. This is not a case of second-guessing an assay that is hidden from us
      - the abstract states what was observed - so the annotation is removed rather than downgraded.'
    supported_by:
    - reference_id: PMID:1280560
      supporting_text: This RNA is localized predominantly within nuclei until stage 10, when the localization
        becomes primarily cytoplasmic.
