- term:
    id: GO:0005768
    label: endosome
  evidence_type: IDA
  original_reference_id: PMID:17484784
  qualifier: located_in
  review:
    summary: Hh-GFP is detected in intracellular, Dynamin-dependent punctate structures in receiving cells,
      a pool distinct from the extracellular ligand.
    action: KEEP_AS_NON_CORE
    reason: Kept, but as a non-core location. This compartment is part of the route the ligand takes to
      or from its site of action rather than the place where its receptor-binding activity is executed,
      which is the extracellular region. Endosomal Hh in receiving cells is a real and functionally important
      pool - receptor-mediated endocytosis shapes the gradient - but it is a trafficking compartment.
    supported_by:
    - reference_id: PMID:17484784
      supporting_text: Inhibition of Dynamin-dependent endocytosis blocked formation of intracellular
        Hh particles, but did not prevent movement of newly synthesized Hh to the apical or basolateral
        surfaces of target cells.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-DME-209271
  qualifier: located_in
  review:
    summary: A cytosolic location taken from a Drosophila Reactome model that places Hh autocleavage,
      Rasp-mediated palmitoylation and Dispatched-dependent release in the cytosol.
    action: REMOVE
    reason: Hh is never exposed to the cytosol. The precursor carries a cleaved signal sequence and is
      translocated into the endoplasmic reticulum, where the Hint/Hog domain performs cleavage and cholesterol
      transfer; Rasp palmitoylates the new N terminus within the secretory pathway; and Dispatched then
      releases the lipidated product from the plasma membrane to the outside. The cached Drosophila Reactome
      events place these steps in the cytosol - one is titled "N-HH moves from the cytosol to the extracellular
      region" - which is a compartment assignment in that model rather than an observation about the protein.
      GO:0005829 is defined as the part of the cytoplasm that does not contain organelles, so it is not
      merely imprecise here but wrong.
