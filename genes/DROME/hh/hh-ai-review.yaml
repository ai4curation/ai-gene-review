  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q62226
  review:
    summary: 'Cholesterol-protein transferase activity, transferred by curator judgement from mouse Shh
      (UniProtKB:Q62226). This is the reaction the Drosophila Hint/Hog domain performs: cleavage coupled
      to esterification of cholesterol onto Gly257, the new C terminus of the N-product.'
    action: ACCEPT
    reason: 'Retained as a core molecular function, and one of only two genuine catalytic activities of
      the gene product. The ISS transfer is safe here because the fly protein has its own direct evidence:
      the crystal structure of the Drosophila autoprocessing domain, the D303A mutation that abolishes
      cholesterol transfer, and the cholesterol glycine ester recorded at Gly257 by mass spectrometry.
      The family review assesses this term as family-wide, and the Hedgehog module places the reaction
      on the ligand itself rather than on an external enzyme.'
    supported_by:
    - reference_id: PMID:9335337
      supporting_text: The approximately 25 kDa carboxy-terminal domain of Drosophila Hedgehog protein
        (Hh-C) possesses an autoprocessing activity that results in an intramolecular cleavage of full-length
        Hedgehog protein and covalent attachment of a cholesterol moiety to the newly generated amino-terminal
        fragment.
