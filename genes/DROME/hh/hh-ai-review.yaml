id: Q02936
gene_symbol: hh
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'hedgehog (hh) encodes the single Hedgehog-family ligand of Drosophila melanogaster, the
  founding member of a secreted signalling protein family conserved throughout the eumetazoa. It is made
  as a 471-residue precursor that enters the secretory pathway, where its C-terminal Hint/Hog domain acts
  as an enzyme on its own polypeptide: it cleaves the precursor between Gly257 and Cys258 and, in the
  same reaction cycle, esterifies cholesterol onto the new C terminus of the N-terminal fragment. The
  acyltransferase Rasp (Skinny hedgehog) then attaches palmitate to Cys85, the N-terminal cysteine of
  that fragment, so that the mature signal, Hh-Np, carries a lipid at each end while the C-terminal product retains no
  signalling activity. Dual lipidation tethers Hh-Np to the membrane of the producing cell, and its release
  and spread depend on dedicated partners - the transporter Dispatched, heparan sulfate proteoglycans,
  lipophorin particles and the secreted factor Shifted - as well as on transport along cytonemes and on
  proteolytic shedding of the lipidated termini. In the embryonic epidermis and in the imaginal discs
  hh is transcribed in the posterior compartment under engrailed control, and the released ligand moves
  into the anterior compartment, where it binds a receptor complex of Patched together with Ihog or Boi.
  Ligand binding relieves Patched-mediated inhibition of Smoothened, which switches conformation, is phosphorylated,
  accumulates at the cell surface, and signals through the Costal-2/Fused/Suppressor of fused complex
  to block proteolytic processing of the transcription factor Cubitus interruptus into its repressor form
  and to generate Ci activator. Because target-gene output tracks ligand concentration and exposure time,
  Hh-Np behaves as a morphogen, and the graded response organises the anterior/posterior axis of every
  embryonic segment and of the wing, leg, eye-antennal, labial and genital discs. Hh signalling also acts
  in adult tissues, maintaining ovarian somatic stem cells and driving the uracil-induced, DUOX-dependent
  gut immune response.'
