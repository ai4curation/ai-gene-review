  review:
    summary: Hedgehog ligands assign identity to cells in a concentration-dependent way, and this IBA
      row propagates that shared developmental output from PAINT node PTN001726121, whose seeds include
      Drosophila hh itself alongside vertebrate ligands.
    action: KEEP_AS_NON_CORE
    reason: 'The node placement is sound - concentration-dependent assignment of cell identity is what
      Hedgehog ligands do in flies and vertebrates alike, and the fly gene is one of the descendant evidences
      used to place it. Kept, but as a non-core annotation. Drosophila hh is a single ligand with one
      biochemical output, and the many tissue phenotypes recorded for it are downstream outcomes of that
      one ligand activity in different developmental contexts. The annotation is biologically sound and
      worth keeping for phenotype retrieval, but core status is reserved for the ligand''s own activities:
      autoproteolysis with cholesterol transfer, Patched binding, and the smoothened signalling pathway
      it initiates.'
