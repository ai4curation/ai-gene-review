- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q62226
  review:
    summary: 'The C-terminal Hint/Hog domain does cleave the precursor, but the leaving group is cholesterol
      rather than water: cleavage and cholesterol esterification are one reaction cycle, which GO:0140853
      describes exactly and which is already annotated to hh from the same ISS source.'
    action: MODIFY
    reason: Endopeptidase activity is defined as hydrolysis of internal peptide bonds, and Hedgehog self-processing
      is a transesterification in which the thioester intermediate is resolved by the 3-beta-hydroxyl
      of cholesterol, not by water. The mechanism was established on the Drosophila protein itself, whose
      crystal structure identified the active-site residues and whose D303A mutation abolishes cholesterol
      transfer. The same MODIFY call was made on the human orthologue review (genes/human/SHH). Note that
      the Hedgehog module (modules/hedgehog_signaling.yaml) currently types the hh_autoprocessing annoton
      with GO:0004175; that divergence is deliberate and flagged rather than silently accepted.
    proposed_replacement_terms:
    - id: GO:0140853
      label: cholesterol-protein transferase activity
    supported_by:
    - reference_id: PMID:9335337
      supporting_text: The approximately 25 kDa carboxy-terminal domain of Drosophila Hedgehog protein
        (Hh-C) possesses an autoprocessing activity that results in an intramolecular cleavage of full-length
        Hedgehog protein and covalent attachment of a cholesterol moiety to the newly generated amino-terminal
        fragment.
    additional_reference_ids:
    - PMID:9335337
