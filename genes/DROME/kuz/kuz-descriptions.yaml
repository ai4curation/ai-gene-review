- source: Alliance_Automated
  text: Enables metalloendopeptidase activity. Involved in several processes, including
    border follicle cell migration; heart development; and nervous system development.
    Located in perivitelline space. Is expressed in several structures, including
    adult brain cell body rind; border follicle cell; embryonic/larval neuromuscular
    junction; epithelium; and imaginal disc. Used to study Alzheimer's disease 18.
    Human ortholog(s) of this gene implicated in Alzheimer's disease 18 and reticulate
    acropigmentation of Kitamura. Orthologous to human ADAM10 (ADAM metallopeptidase
    domain 10).
