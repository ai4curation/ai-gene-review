- term:
    id: GO:0007219
    label: Notch signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:9244301
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0004647
  review:
    summary: >-
      kuz is required for Notch signalling in many contexts, acting upstream of Su(H) in the
      Notch-receiving cell.
    action: ACCEPT
    reason: >-
      Kuz performs the ligand-induced S2 ectodomain cleavage of Notch, a required step of
      the pathway.
    supported_by:
    - reference_id: PMID:9428413
      supporting_text: >-
        kuzbanian genetic mosaics demonstrate that, during neurogenesis, wing margin formation
        and vein width specification kuzbanian is autonomously required in the cell where
        Notch is activated.
    - reference_id: PMID:9428413
      supporting_text: >-
        Genetic interactions between kuzbanian and different genes of the Notch pathway indicate
        that kuzbanian is required upstream of Suppressor of Hairless.
    - reference_id: PMID:18535782
      supporting_text: >-
        Using an in vitro model, we show that Kuz regulates Notch signaling primarily by activating
        the receptor and has little overall effect on signaling via disabling Delta.
    - reference_id: PMID:23091066
      supporting_text: >-
        The metalloprotease ADAM10/Kuzbanian catalyzes the ligand-dependent ectodomain shedding
        of Notch receptors and activates Notch.
    - reference_id: PMID:29195077
      supporting_text: >-
        Notch activation normally depends on Kuz (S2) and γ-secretase (S3) cleavages.
    - reference_id: PMID:41556123
      supporting_text: >-
        Strikingly, elevated Kuz expression alone is sufficient to cleave Notch and trigger
        ligand-independent signaling.
    - reference_id: PMID:17010965
      supporting_text: >-
        Constitutively active Notch rescued the migration defect due to dominant-negative
        KUZ, and conditional alleles of Delta and Notch also exhibited border cell migration
        defects.
