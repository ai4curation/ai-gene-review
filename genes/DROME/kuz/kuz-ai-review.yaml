core_functions:
- description: >-
    Zinc metalloendopeptidase (ADAM10) that performs the S2 ectodomain cleavage of Notch at
    the cell surface of the signal-receiving cell, enabling gamma-secretase S3 cleavage and
    Notch signalling.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0007220
    label: Notch receptor processing
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11799064
    supporting_text: >-
      Using transgenic Drosophila expressing transmembrane Notch proteins, we show that kuzbanian,
      independent of any role in Delta processing, is required for the cleavage of Notch.
  - reference_id: PMID:11799064
    supporting_text: >-
      Our data suggest that in Drosophila, kuzbanian can mediate S2 cleavage of Notch.
  - reference_id: PMID:9244301
    supporting_text: >-
      We provide genetic and biochemical evidence that Notch is an in vivo substrate for the
      KUZ protease, and that this cleavage may be part of the normal biosynthesis of functional
      Notch proteins.
  - reference_id: PMID:23091066
    supporting_text: >-
      The metalloprotease ADAM10/Kuzbanian catalyzes the ligand-dependent ectodomain shedding
      of Notch receptors and activates Notch.
  - reference_id: PMID:29195077
    supporting_text: >-
      Notch activation normally depends on Kuz (S2) and γ-secretase (S3) cleavages.
- description: >-
    Sheddase of other single-pass membrane proteins, including the Notch ligand Delta and
    the axon guidance receptor Robo (cleavage required for Robo repulsive signalling).
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9872749
    supporting_text: >-
      Here biochemical and genetic analyses show that the ligand Delta is cleaved on the surface,
      releasing an extracellular fragment capable of binding to Notch and acting as an agonist
      of Notch activity. The ADAM disintegrin metalloprotease Kuzbanian is required for this
      processing event.
  - reference_id: PMID:20570941
    supporting_text: >-
      Instead, Kuz acts in neurons to regulate repulsion and Kuz can cleave the Robo extracellular
      domain in Drosophila cells.
  - reference_id: PMID:20570941
    supporting_text: >-
      These observations support the model that Kuz-directed cleavage is important for Robo
      receptor activation.
proposed_new_terms: []
suggested_questions:
- question: >-
    What fraction of physiological Notch S2 cleavage in Drosophila is carried out by Kuz versus
    Tace (ADAM17) or Kul in different tissues?
- question: >-
    Does Delta ectodomain shedding by Kuz contribute to signal directionality in vivo, or
    is Kul the dominant Delta sheddase?
suggested_experiments:
- description: >-
    Tissue-specific kuz knockout combined with Tace/kul loss and S2-cleavage-specific Notch
    antibodies to quantify each protease's contribution.
