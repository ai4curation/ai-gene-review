id: Q9VJW9
gene_symbol: kuz
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Kuzbanian (Kuz) is the Drosophila ortholog of ADAM10, a single-pass type I transmembrane
  disintegrin and zinc metalloprotease (ADAM family, peptidase M12B). At the cell surface
  it performs the ligand-induced S2 cleavage of the Notch receptor ectodomain in the signal-receiving
  cell, which is a prerequisite for the gamma-secretase S3 cleavage that releases the Notch
  intracellular domain; kuz is required cell-autonomously in the Notch-activated cell upstream
  of Suppressor of Hairless. When overexpressed, Kuz can also cleave Notch in a ligand-independent
  manner, which is restrained by cis-Delta. Kuz additionally cleaves the ectodomain of Delta
  (with its paralog Kuzbanian-like) and of the axon guidance receptor Robo, the latter being
  required for Slit-Robo midline repulsion. Kuz trafficking and surface levels are regulated
  by TspanC8 tetraspanins. kuz mutants are neurogenic and affect lateral inhibition, wing
  margin, heart, glial and border cell migration.
