- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23091066
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9W4X6
  review:
    summary: >-
      Kuz interacts with TspanC8 tetraspanins (Tsp3A etc.) that regulate its trafficking.
    action: REMOVE
    reason: >-
      GO:0005515 protein binding is uninformative. The TspanC8-ADAM10/Kuz interaction regulates
      Kuz ER exit and surface distribution but does not define a Kuz molecular function beyond
      binding; removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:23091066
      supporting_text: >-
        Here, we show that the human tetraspanins of the evolutionary conserved TspanC8 subfamily
        (Tspan5, Tspan10, Tspan14, Tspan15, Tspan17, and Tspan33) directly interact with ADAM10,
        regulate its exit from the endoplasmic reticulum, and that four of them regulate ADAM10
        surface expression levels.
    - reference_id: PMID:23091066
      supporting_text: >-
        During oogenesis, TspanC8 genes were up-regulated in border cells and regulated Kuzbanian
        distribution, Notch activity, and cell migration.
