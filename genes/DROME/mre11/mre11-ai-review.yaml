    label: site of double-strand break
  in_complex:
    id: GO:0030870
    label: Mre11 complex
  supported_by:
  - reference_id: PMID:19520832
    supporting_text: the molecular defect is not the absence of MRN interaction or of Mre11 nuclease activities
- description: As part of the MRN complex, Mre11 protects Drosophila telomeres from fusion by promoting
    recruitment of the capping proteins HOAP and HP1.
