id: Q9XYZ4
gene_symbol: mre11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: mre11 encodes the Drosophila ortholog of MRE11, the manganese-dependent nuclease subunit
  of the Mre11-Rad50-Nbs (MRN) complex. Mre11 has metallophosphoesterase (calcineurin-like) nuclease and
  DNA binding domains and, by homology, single-stranded DNA endonuclease and 3'-5' exonuclease activities
  that initiate processing of DNA double-strand break ends. In Drosophila, which lacks telomerase, Mre11
  acts with Rad50, Nbs and ATM (tefu) to cap telomeres. It promotes recruitment of the capping proteins
  HOAP and HP1, and mre11 null mutants show frequent telomere fusions and chromosome breakage. Mre11 also
  stabilizes Rad50 and is required, with ATM, for the G2/M checkpoint induced by low-dose irradiation.
  Nbs is needed to import Mre11-Rad50 into the nucleus and to load it onto chromatin.
