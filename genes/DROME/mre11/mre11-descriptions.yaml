- source: Alliance_Automated
  text: Predicted to enable single-stranded DNA endonuclease activity. Involved in
    mitotic G2 DNA damage checkpoint signaling and telomere maintenance. Located in
    nucleus. Part of Mre11 complex. Is expressed in central brain primordium; embryonic
    brain; eye; larval ventral nerve cord; and ventral nerve cord primordium. Used
    to study ataxia-telangiectasia-like disorder 1. Human ortholog(s) of this gene
    implicated in several diseases, including Lynch syndrome; ataxia-telangiectasia-like
    disorder 1; endometrial cancer; gastrointestinal system cancer (multiple); and
    urinary bladder cancer. Orthologous to human MRE11 (MRE11 double strand break
    repair nuclease).
