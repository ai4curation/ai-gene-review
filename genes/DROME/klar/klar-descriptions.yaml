- source: Alliance_Automated
  text: Enables kinesin binding activity. Involved in several processes, including
    larval visceral muscle development; lipid droplet transport along microtubule;
    and lumen formation, open tracheal system. Located in microtubule; nuclear outer
    membrane; and perinuclear region of cytoplasm. Colocalizes with cytoplasmic microtubule
    and lipid droplet. Is expressed in several structures, including embryonic primordium
    of adult salivary gland; eye disc; eye disc posterior to the morphogenetic furrow;
    larval brain; and mesectoderm. Used to study Emery-Dreifuss muscular dystrophy.
  source_type: automated
