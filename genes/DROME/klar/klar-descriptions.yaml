- source: Alliance_Imported
  text: klarsicht (klar) encodes a member of the Nesprin family that links microtubule
    motors and various cellular structures. It controls the migration and positioning
    of nuclei in photoreceptors and muscles. It also regulates the motion of RNP granules
    in oocytes and lipid droplets in embryos.
