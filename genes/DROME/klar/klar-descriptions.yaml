descriptions:
- source: UniProt
  text: Component of the LINC (LInker of Nucleoskeleton and Cytoskeleton) complex
    involved in the connection between the nuclear lamina and the cytoskeleton (By
    similarity). Plays a role in the nuclear positioning and links the nucleus to
    the microtubule organizing center (MTOC) (PubMed:10556085, PubMed:15579692, PubMed:22927463).
    Collaborates with Msp300 to promote even spacing of the myonuclei at the periphery
    of striated muscle fibers by mediating a tight association between a nuclear ring
    structure of Msp300 and the plus ends of a unique astral microtubule (MT) network
    (PubMed:22927463).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9Y0E4
