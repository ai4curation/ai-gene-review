id: Q9Y0E4
gene_symbol: klar
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Klarsicht (Klar) is a large Drosophila protein, the founding member ("K") of the KASH family,
  that regulates microtubule-based positioning of specific cargoes. Alternative promoters, splicing and
  3' ends produce isoforms that share a long N-terminal region but carry different C-terminal targeting
  domains. The Klar-alpha isoform ends in a transmembrane KASH domain that places it in the outer nuclear
  membrane, where it depends on the SUN protein Klaroid (Koi) and on nuclear lamin. There it links the
  nucleus to the microtubule-organizing center and apical microtubules, and is required for the apical
  migration of photoreceptor and cone-cell nuclei in the developing eye (loss gives rough eyes). In larval
  muscle, Klar cooperates with the KASH protein Msp300 to attach a perinuclear Msp300 ring and the plus
  ends of an astral microtubule network to each myonucleus, producing even myonuclear spacing. The Klar-beta
  isoform instead carries a lipid-droplet-targeting domain; on embryonic lipid droplets it coordinates
  bidirectional dynein- and kinesin-1-driven transport, and in the oocyte it associates with kinesin-1
  and restrains the motility of oskar mRNA particles. Klar also supports apical membrane delivery during
  salivary gland tube morphogenesis. It is not essential for viability or fertility.
