suggested_questions:
- question: Klar isoforms have distinct cargoes (nuclear envelope via KASH; lipid droplets via the beta
    domain). Should the KASH-dependent and lipid-droplet annotations be made isoform-specific, as the
    whole-gene annotations currently mix them?
  experts:
  - FlyBase curators
- question: Is Klar a direct cytoskeletal motor regulator (GO:0140659) on lipid droplets and oskar RNPs,
    or does it act through another droplet-associated factor? Direct Klar-motor binding has not been shown
    with purified proteins.
  experts:
  - motor protein biochemists
suggested_experiments:
- description: Reconstitute purified Klar-beta (shared N-terminal region plus lipid-droplet domain) with
    dynein-dynactin and kinesin-1 on artificial lipid droplets and measure motor recruitment and run properties.
  hypothesis: The shared N-terminal region of Klar directly tunes the balance of opposing motors on its
    cargo.
  experiment_type: in vitro reconstitution
