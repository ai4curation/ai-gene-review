- source: Alliance_Automated
  text: Enables GTPase binding activity; chromatin binding activity; and lamin binding
    activity. Involved in several processes, including cytoskeleton organization;
    endosomal transport; and lysosomal lumen pH elevation. Located in endosome; nucleoplasm;
    and perinuclear region of cytoplasm. Part of WASH complex. Colocalizes with nuclear
    envelope. Is expressed in embryonic/larval hemocyte. Orthologous to several human
    genes including WASHC1 (WASH complex subunit 1).
