- source: Alliance_Imported
  text: washout (wash) encodes a Wiskott-Aldrich syndrome protein that polymerizes
    branched actin through activation of the Arp2/3 complex, as well as bundles and/or
    crosslinks actin and microtubules. It functions as a downstream effector of the
    product of Rho1 in a context dependent manner. It is involved in nuclear and cytoplasmic
    cytoskeleton related cellular processes, including ooplasmic streaming, endosome
    recycing, hemocyte migration, and global nuclear organization.
  source_type: curated
  url: https://flybase.org/reports/wash.html
