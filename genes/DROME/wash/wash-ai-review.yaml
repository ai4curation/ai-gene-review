id: Q7JW27
gene_symbol: wash
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'washout (wash, CG13176) encodes Drosophila WASH, the Wiskott-Aldrich syndrome protein and
  SCAR homolog that is the catalytic subunit of the pentameric WASH regulatory complex (with FAM21, CCDC53,
  SWIP and Strumpellin). Through its C-terminal VCA region WASH binds and activates the Arp2/3 complex,
  generating branched actin patches on early and recycling endosomes and lysosomes that drive fission
  of cargo-containing tubules. Working with retromer, it promotes retrieval and recycling of membrane
  proteins: in flies WASH is needed for recycling of integrins and the V-ATPase, for neutralization of
  lysosomes in macrophages, and with Rab9 and Vps35 for retrograde retrieval of the tracheal luminal protein
  Serpentine. In vitro and in the egg chamber WASH also bundles and crosslinks actin filaments and microtubules
  downstream of Rho1. Drosophila Wash additionally has nuclear functions: it binds B-type lamin, associates
  with heterochromatin, contributes to global nuclear organization, and with its regulatory complex, capping
  protein and Arp2/3 is required for nuclear envelope budding.'
