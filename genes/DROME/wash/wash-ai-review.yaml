core_functions:
- description: 'Wash is the Arp2/3-activating subunit of the WASH complex: its VCA region binds and activates
    Arp2/3 to build branched actin patches on endosomes, which with retromer drive sorting of cargo such
    as integrins, the V-ATPase and Serpentine into recycling and retrograde routes. GO has no Arp2/3 activator
    molecular-function term, so Arp2/3 complex binding is used as the core activity together with positive
    regulation of Arp2/3 nucleation.'
  molecular_function:
    id: GO:0071933
    label: Arp2/3 complex binding
  directly_involved_in:
  - id: GO:0034314
    label: Arp2/3 complex-mediated actin nucleation
  - id: GO:2000601
    label: positive regulation of Arp2/3 complex-mediated actin nucleation
  - id: GO:0032456
    label: endocytic recycling
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0005769
    label: early endosome
  in_complex:
    id: GO:0071203
    label: WASH complex
  supported_by:
  - reference_id: PMID:18159949
    supporting_text: The VCA domain of human WASH promotes actin polymerization by the Arp2/3 complex
      in vitro.
  - reference_id: PMID:27884932
    supporting_text: WASH generates actin patches on endosomes and lysosomes, thereby mediating both aforementioned
      functions.
suggested_questions:
- question: Is the nuclear pool of Wash (lamin binding, heterochromatin association) regulated by the
    same WASH complex subunits that control its endosomal activity, or by a distinct mechanism?
suggested_experiments:
- description: Separation-of-function wash alleles (VCA deletion vs. lamin-binding mutants) to test which
    phenotypes (integrin recycling, lysosome neutralization, nuclear morphology) require Arp2/3 activation.
