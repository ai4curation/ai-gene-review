    summary: Wash engages the Arp2/3 complex as a WAS-family nucleation-promoting factor.
    action: NEW
    reason: Wash is a WAS-family nucleation-promoting factor with Arp2/3-mediated actin nucleation activity,
      and WAS-family proteins activate Arp2/3 by binding it through their C-terminal VCA region. Drosophila
      Wash interacts genetically with Arp2/3 and is annotated to GO:0034314 Arp2/3 complex-mediated actin
      nucleation. GO has no Arp2/3 activator molecular-function term, so binding is the most specific
      available MF; physical binding by fly Wash is inferred from the conserved WAS-family mechanism rather
      than measured directly, hence ISS. No GOA row currently captures this core molecular function (same
      treatment as SCAR).
