- source: Alliance_Automated
  text: Enables microfilament motor activity and protein homodimerization activity.
    A structural constituent of muscle. Involved in several processes, including actin
    cytoskeleton organization; adult somatic muscle development; and epithelial cell
    migration. Located in A band and polytene chromosome puff. Is expressed in several
    structures, including adult digestive system; anterior-posterior subdivision of
    organism; gut section; muscle cell; and muscle system. Used to study cardiomyopathy
    (multiple) and muscle tissue disease (multiple). Human ortholog(s) of this gene
    implicated in several diseases, including Carney complex; contractures, pterygia,
    and spondylocarpotarsal fusion syndrome (multiple); heart disease (multiple);
    muscle tissue disease (multiple); and stroke. Orthologous to several human genes
    including MYH1 (myosin heavy chain 1) and MYH3 (myosin heavy chain 3).
