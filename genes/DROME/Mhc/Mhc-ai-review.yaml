suggested_questions:
- question: What evidence underlies the FlyBase IDA annotation of Mhc to polytene chromosome puff (GO:0005703)
    from PMID:10471711, an EMS screen whose abstract places the nearby mutants in other loci?
- question: Should Mhc carry a non-muscle cell migration annotation, given that border-cell and tracheal-cell
    migration defects are reported for Mhc3 while non-muscle myosin II (zipper) is the expected motor
    in these cells?
suggested_experiments:
- description: Isoform-specific (exon 9/11) knock-in or tagged alleles in border cells and tracheal air-sac
    cells to determine which Mhc isoform is expressed and whether it acts cell-autonomously with or independently
    of zipper.
