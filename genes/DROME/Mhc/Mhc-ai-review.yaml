id: P05661
gene_symbol: Mhc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Mhc encodes the single muscle myosin II heavy chain of Drosophila melanogaster. Extensive
  mutually exclusive alternative splicing (exons 3, 7, 9, 11, 15 and 18) generates many isoforms with
  muscle-type-specific kinetics, and an internal promoter yields myosin rod protein (MRP), which lacks
  the motor. The N-terminal motor domain is an actin-activated ATPase that binds F-actin and drives filament
  sliding; the long coiled-coil rod dimerises and polymerises with light chains into the thick filaments
  of the sarcomeric A band. MHC is the force generator of all larval and adult muscles, including the
  indirect flight, jump, cardiac and visceral muscles, and is required for myofibril assembly and maintenance.
  Point mutations model human myosin myopathies and cardiomyopathies. Mhc is also required in some non-muscle
  migrating cells (border cells, tracheal air-sac cells).
