descriptions:
- source: UniProt
  text: Has an important role in DNA replication and in maintaining genome integrity
    during replication stress (By similarity). Promotes PCNA deubiquitination (By
    similarity). As component of the Elg1 RFC- like complex, regulates the functions
    of the DNA polymerase processivity factor PCNA by unloading it from DNA after
    replication during the S phase of the cell cycle (PubMed:27198229). The PCNA-
    unloading might be regulated via interaction with the Enok acetyltransferase complex
    (PubMed:27198229). Might have a role in restarting of stalled/regressed replication
    forks during replication stress (By similarity). In the ovaries, has a role in
    nurse cell endoreplication (PubMed:27198229).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86BP6
