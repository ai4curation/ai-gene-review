suggested_questions:
- question: Does Drosophila Elg1 promote PCNA deubiquitination directly (as ATAD5 does with USP1-UAF1),
    or is the rise in PCNA-ub after elg1 RNAi a secondary consequence of PCNA retention on chromatin?
- question: How does the Br140-mediated contact with the Enok complex inhibit Elg1-dependent PCNA unloading
    mechanistically?
suggested_experiments:
- description: Reconstitute the Drosophila Elg1 RFC-like complex and test ATP-dependent PCNA unloading
    in vitro, with and without the Enok complex or Br140.
