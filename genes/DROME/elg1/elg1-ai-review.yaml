taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: elg1 encodes the Drosophila ortholog of yeast Elg1 and human ATAD5, the AAA+ large subunit
  of the Elg1 RFC-like complex, in which it replaces the RFC large subunit and assembles with the four
  shared small subunits RfC4, RfC38, RfC3 and CG8142. The complex unloads the PCNA sliding clamp from
  chromatin after DNA replication; depleting elg1 in S2 cells raises chromatin-bound and monoubiquitinated
  PCNA. The Elg1 complex associates through Br140 with the Enok histone acetyltransferase complex, which
  restrains PCNA unloading to promote the G1/S transition. In the ovary elg1 is needed for nurse-cell
  endoreplication, and mutants mislocalize gurken mRNA during oogenesis.
