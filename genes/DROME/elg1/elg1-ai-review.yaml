  evidence_type: NAS
  original_reference_id: PMID:24204884
  qualifier: involved_in
  review:
    summary: DNA strand elongation involved in DNA replication (NAS).
    action: MODIFY
    reason: The cited paper (PMID:24204884) concerns Elongin/Corto and does not discuss Elg1. Elg1 does
      not load PCNA for strand elongation; it removes PCNA after Okazaki fragment ligation, i.e. it acts
      in DNA replication but after elongation. The replication role is sound, so the term is generalized
      to GO:0006261 DNA-templated DNA replication.
    proposed_replacement_terms:
    - id: GO:0006261
      label: DNA-templated DNA replication
    supported_by:
    - &id003
      reference_id: PMID:27198229
      supporting_text: knocking down elg1 using dsRNAs did not affect total PCNA levels but resulted in
        increases in the levels of both chromatin-bound PCNA and monoubiquitinated PCNA
      reference_section_type: RESULTS
