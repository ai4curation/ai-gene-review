description: CG4704 encodes an uncharacterized 354-residue EF-hand protein of the MICU family, a paralog
  of the mitochondrial calcium uniporter gatekeeper MICU1 classified in the MICU1 subfamily. It carries
  two canonical EF-hand calcium-binding sites and is predicted, by family membership, to associate with
  the uniporter on the intermembrane-space side of the inner mitochondrial membrane and to regulate calcium
  uptake into mitochondria. No experimental studies of its expression, localization or function have been
  reported.
