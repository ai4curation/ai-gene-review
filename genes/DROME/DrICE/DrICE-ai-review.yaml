id: O01382
gene_symbol: DrICE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'DrICE is the major Drosophila short-prodomain effector caspase activated
  downstream of the Dark/Dronc apoptosome. It is a C14 cysteine endopeptidase that
  cleaves apoptotic substrates during the execution phase of apoptosis, is restrained
  by DIAP1 and DIAP2 BIR-domain IAP contacts, and is also reused in limited nonlethal
  outputs including spermatid individualization, nurse-cell removal, sensory-organ
  precursor patterning, and innate-immune damping through DIF or Diap2 cleavage and
  binding.'
