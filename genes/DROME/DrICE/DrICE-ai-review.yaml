suggested_questions:
- question: Which substrate-specific cleavage events distinguish lethal 
    DrICE/Dcp-1 apoptotic execution from low-level nonapoptotic DrICE activity 
    in spermatids, SOP cells, nurse cells, and the intestinal epithelium?
- question: How are DrICE-DIAP1 and DrICE-DIAP2 BIR-domain interactions rewired 
    between apoptotic inhibition, Diap2-dependent intestinal immune restraint, 
    and pathogen-induced Imd signaling?
- question: Does DrICE have a direct role in axon or dendrite pruning in vivo, 
    or are the abstract-only neuron-remodeling rows mostly evidence for the 
    effector-caspase branch as a whole?
suggested_experiments:
- hypothesis: DrICE execution of apoptosis and DrICE restraint of 
    commensal-triggered Imd signaling require separable substrate contacts.
  description: Use endogenous Drice alleles with active-site-proximal 
    substrate-recognition substitutions and Diap2-binding-interface 
    substitutions, then compare apoptotic substrate cleavage, 
    Drosocin/Diptericin induction, Diap2 stability, and survival after commensal
    and pathogenic bacterial challenges.
  experiment_type: structure-guided endogenous separation-of-function genetics
- hypothesis: Dcp-1 buffers DrICE only in selected developmental death programs 
    rather than throughout apoptotic execution.
  description: Profile cleaved substrates by quantitative N-terminomics in 
    matched wild-type, Drice-null, Dcp-1-null, and double-mutant apoptotic 
    tissues, including eye discs, nurse cells, vCrz neurons, and spermatids.
  experiment_type: comparative degradomics
