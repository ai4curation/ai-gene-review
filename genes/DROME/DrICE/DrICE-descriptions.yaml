- source: UniProt
  text: Involved in the activation cascade of caspases responsible for apoptosis execution.
    Acts downstream of rpr. Cleaves baculovirus p35 and lamin DmO in vitro.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O01382
  source_id: O01382
