      score: 3
    overall_notes: 'Dated: places DrICE in the caspase cascade downstream of rpr and
      lists in vitro cleavage of p35 and lamin DmO. Does not mention Dronc activation,
      DIAP1 inhibition or non-apoptotic roles.'
- source: Alliance_Imported
  text: Death related ICE-like caspase (Drice) encodes a major effector apoptotic
    caspase. It is essential for both developmental and damaged induced cell death,
    as well as several non-apoptotic vital cellular processes. It is activated by
    the product of Dark and the initiator caspase encoded by Dronc and is inhibited
    by the inhibitor of apoptosis encoded by Diap1.
  source_type: curated
  url: https://flybase.org/reports/Drice.html
  source_id: FB:FBgn0019972
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 5
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and current: major effector caspase for developmental
      and damage-induced death, activated by Dark and Dronc, inhibited by Diap1, with
      non-apoptotic roles.'
- source: Alliance_Automated
  text: Enables BIR domain binding activity; cysteine-type endopeptidase activity;
    and ubiquitin protein ligase binding activity. Involved in several processes,
    including negative regulation of signal transduction; neuron remodeling; and programmed
    cell death involved in cell development. Located in cytoplasm; nucleus; and plasma
    membrane. Is expressed in several structures, including central brain primordium;
    cystic bulge; embryonic/larval midgut; embryonic/larval midgut primordium; and
    ganglia. Human ortholog(s) of this gene implicated in Parkinson's disease; colon
    cancer; lung non-small cell carcinoma; myocarditis; and stomach cancer. Orthologous
    to human CASP3 (caspase 3).
  source_type: automated
  url: https://flybase.org/reports/Drice.html
  source_id: FB:FBgn0019972
