  review:
    summary: tRNA methylation, propagated from E. coli MnmE.
    action: MARK_AS_OVER_ANNOTATED
    reason: The MnmE/GTPBP3-MnmG/MTO1 reaction transfers a methylene from methylene-THF and links an amine
      (glycine, ammonia or taurine) to C5 of U34, i.e. an aminomethylation, not addition of a methyl group
      in the sense of GO tRNA methylation. The wobble uridine modification terms describe the process
      accurately.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P25522
        source_status: UNRESOLVED
        comment: E. coli MnmE does participate in U34 modification, but labelling the C5-aminomethylation
          as tRNA methylation stretches the term; the clade-level wobble uridine modification term transfers
          safely.
    supported_by:
    - reference_id: file:DROME/CG18528/CG18528-uniprot.txt
      supporting_text: tRNA modification GTPase GTPBP3, mitochondrial
