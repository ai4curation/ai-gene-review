id: Q9VC87
gene_symbol: CG18528
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: CG18528 encodes the Drosophila ortholog of GTPBP3 (bacterial MnmE/TrmE), a mitochondrial
  TrmE-family GTPase. By homology it partners with the MTO1 ortholog CG4610 to form the GTPBP3-MTO1 enzyme
  that installs a C5-substituted methyl group (taurinomethyl in mammals, carboxymethylaminomethyl in bacteria)
  on the wobble uridine (U34) of a subset of mitochondrial tRNAs, a modification needed for accurate decoding
  during mitochondrial translation. The protein has an N-terminal folate-binding TrmE domain, a central
  helical domain and a G domain whose GTP hydrolysis drives the reaction cycle. No Drosophila-specific
  experimental studies have been reported; function is inferred from orthologs.
