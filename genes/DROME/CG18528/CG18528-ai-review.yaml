suggested_questions:
- question: Which C5 substituent (taurinomethyl, carboxymethylaminomethyl or other) is present on the
    wobble uridine of Drosophila mitochondrial tRNAs, and does it depend on CG18528?
suggested_experiments:
- hypothesis: CG18528 is required for the C5 modification of U34 in Drosophila mt-tRNAs.
  description: Profile mt-tRNA modifications by LC-MS/MS or nanopore/primer-extension in CG18528 mutant
    or RNAi tissue, and assay mitochondrial translation and respiration.
