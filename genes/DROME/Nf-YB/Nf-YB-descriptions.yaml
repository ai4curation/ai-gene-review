descriptions:
- source: Alliance_Imported
  text: Nuclear factor Y-box B (Nf-YB) encodes a subunit of the nuclear transcription
    factor Y, which binds to the CCAAT box regulatory sequence. It regulates gene
    transcription and is involved in eye and thorax development.
  source_type: curated
  url: https://flybase.org/reports/Nf-YB.html
  source_id: FB:FBgn0032816
