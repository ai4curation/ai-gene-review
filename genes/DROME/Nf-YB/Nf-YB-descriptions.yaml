      score: 3
    overall_notes: NF-Y subunit binding CCAAT boxes in eye and thorax development.
      Thorax role is not covered in the review.
- source: Alliance_Automated
  text: Enables transcription cis-regulatory region binding activity. Contributes
    to sequence-specific DNA binding activity. Involved in several processes, including
    positive regulation of DNA-templated transcription; positive regulation of MAPK
    cascade; and positive regulation of R7 cell differentiation. Part of CCAAT-binding
    activity factor complex. Is expressed in embryonic brain and larval ventral nerve
    cord. Orthologous to human NFYB (nuclear transcription factor Y subunit beta).
  source_type: automated
