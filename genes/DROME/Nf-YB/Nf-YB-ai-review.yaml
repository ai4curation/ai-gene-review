id: Q8ST61
gene_symbol: Nf-YB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Nf-YB is the histone-fold subunit B of the Drosophila CCAAT-binding factor NF-Y. It heterodimerizes
  with Nf-YC through its histone-fold motif; the NF-YB/NF-YC dimer then recruits NF-YA to form the heterotrimer
  that binds CCAAT boxes in target promoters, with the histone-fold dimer contacting DNA flanking the
  CCAAT motif. In the eye imaginal disc NF-Y containing Nf-YB is required for R7 photoreceptor differentiation
  and regulates the pro-apoptotic Bcl-2 homolog debcl, whose promoter it occupies.
