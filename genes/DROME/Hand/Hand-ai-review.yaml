- term:
    id: GO:0007508
    label: larval heart development
  evidence_type: IMP
  original_reference_id: PMID:16467358
  qualifier: involved_in
  review:
    summary: Hand mutants (homologous recombination null) have hypoplastic myocardium, reduced pericardial cells
      and cardiac apoptosis; cardiac Hand expression rescues lethality.
    action: ACCEPT
    reason: Heart development is the best-established in vivo role of Hand, and the module annotates Hand to heart
      development. Note that Lo et al. 2007 report a normal embryonic dorsal vessel in their null allele but abnormal
      adult hearts, so the larval/adult heart requirement is the robust part.
    supported_by:
    - &id003
      reference_id: PMID:16467358
      supporting_text: Disruption of Hand function by homologous recombination also results in profound cardiac
        defects that include hypoplastic myocardium and a deficiency of pericardial and lymph gland hematopoietic
        cells, accompanied by cardiac apoptosis
    - &id005
      reference_id: PMID:17904115
      supporting_text: homozygous adult flies lacking Hand possess morphologically abnormal dorsal vessels characterized
        by a disorganized myofibrillar structure, reduced systolic and diastolic diameter, and abnormal heartbeat
        contractions
