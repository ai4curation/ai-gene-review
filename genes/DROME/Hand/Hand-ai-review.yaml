suggested_questions:
- question: Is Hand required for embryonic dorsal vessel formation (Han et al. 2006) or only for its pupal remodeling
    (Lo et al. 2007)? Do the differing alleles or genetic backgrounds explain the discrepancy?
- question: What are the direct (bound) Hand target genes in cardioblasts and visceral muscle, and which E-box variants
    and dimerization partners (Daughterless, Nautilus, Twist) does Hand use in vivo?
suggested_experiments:
- description: Hand CUT&RUN or ChIP-seq in larval/pupal dorsal vessel combined with RNA-seq of conditional Hand
    knockdown to define direct targets (e.g. Zasp52, Msp-300) and test E-box dependence of their enhancers.
- description: Side-by-side phenotyping of the Han et al. and Lo et al. Hand null alleles in a common genetic background
    with cardioblast and pericardial markers to resolve the embryonic heart requirement.
