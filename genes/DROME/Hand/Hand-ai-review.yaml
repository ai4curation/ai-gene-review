id: Q9VL05
gene_symbol: Hand
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Hand is the single Drosophila member of the Hand family of class B basic helix-loop-helix (bHLH) transcription
  factors (ortholog of vertebrate HAND1/HAND2). It is expressed in all cells of the dorsal vessel (cardioblasts
  and pericardial nephrocytes), in progenitors of the circular visceral muscles, in lymph gland hematopoietic progenitors,
  garland cells and a few CNS cells. Hand is a direct target of the cardiogenic factors Tinman (NK-2) and Pannier
  (GATA) in the heart, of Serpent (GATA) in the lymph gland and of Biniou (FoxF) in visceral mesoderm, and is expressed
  after these determinants, consistent with a role in differentiation rather than specification. Hand is a potent
  transcriptional activator that, probably as a heterodimer with E-protein (Daughterless) or other bHLH partners,
  regulates muscle structural genes such as Zasp52 and Msp-300. Loss of Hand causes semilethality, lymph gland deficiency,
  and abnormal adult hearts (disorganized myofibrils, impaired contractility) and midguts, reflecting a main requirement
  during pupal remodeling of the larval aorta into the adult heart; whether embryonic heart formation also requires
  Hand differs between mutant alleles. Hand is also required for wing heart formation.
