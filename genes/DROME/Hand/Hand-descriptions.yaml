- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific.
    Involved in several processes, including dendrite morphogenesis; heart development;
    and positive regulation of transcription elongation by RNA polymerase II. Located
    in nucleus. Is expressed in several structures, including circulatory system primordium;
    dorsal vessel; dorsal vessel wall cell; nephrocyte; and somatic precursor cell.
    Orthologous to several human genes including HAND2 (heart and neural crest derivatives
    expressed 2).
