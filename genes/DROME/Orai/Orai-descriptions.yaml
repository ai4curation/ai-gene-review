descriptions:
- source: UniProt
  text: Pore-forming subunit of inward rectifying Ca(2+) release- activated Ca(2+)
    (CRAC) channels. Assembles in hexameric CRAC channels that mediate Ca(2+) influx
    upon depletion of endoplasmic reticulum Ca(2+) store and channel activation by
    Ca(2+) sensor Stim, a process known as store-operated Ca(2+) entry (SOCE). Regulates
    transcription factor NFAT nuclear import.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9U6B8
