- source: Alliance_Automated
  text: Enables identical protein binding activity and store-operated calcium channel
    activity. Involved in calcium ion transport; positive regulation of calcineurin-NFAT
    signaling cascade; and positive regulation of calcium ion transport. Part of calcium
    channel complex. Is expressed in adult head; wing hinge primordium; and wing pouch.
    Used to study dilated cardiomyopathy and hypertrophic cardiomyopathy. Human ortholog(s)
    of this gene implicated in disease of cellular proliferation; immunodeficiency
    9; and tubular aggregate myopathy 2. Orthologous to human ORAI1 (ORAI calcium
    release-activated calcium modulator 1); ORAI2 (ORAI calcium release-activated
    calcium modulator 2); and ORAI3 (ORAI calcium release-activated calcium modulator
    3).
