  review:
    summary: Feske et al. found the Drosophila Orai ortholog in an RNAi screen for SOCE and NFAT import.
    action: MODIFY
    reason: Orai is the Ca2+-conducting channel, so its loss reduces Ca2+ transport because Orai performs
      the transport itself, not because it regulates another transporter. The process is better captured
      as store-operated calcium entry.
    proposed_replacement_terms:
