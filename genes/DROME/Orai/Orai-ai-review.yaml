suggested_questions:
- question: What is the physiological stoichiometry of the active Drosophila CRAC channel in vivo, given
    that photobleaching suggested tetramers while crystal and cryo-EM structures show hexamers?
- question: Which neuronal and non-neuronal Drosophila processes beyond flight depend on Orai-mediated
    SOCE rather than on other plasma membrane Ca2+ channels?
- question: Is the FlyBase ISS row assigning GO:0005246 calcium channel regulator activity to Orai (PMID:31009446,
    WITH human STIM1 Q13586) a data-entry error intended for Stim? Both the term and the donor are Stim-side,
    so FlyBase may wish to move the row to Stim rather than simply delete it.
suggested_experiments:
- hypothesis: Endogenous Orai channels in fly neurons are hexameric.
  description: Single-molecule photobleaching or cryo-ET of endogenously tagged Orai in Drosophila neurons
    before and after store depletion, to determine stoichiometry in native membranes.
