  review:
    summary: Orai is the pore-forming subunit of the CRAC channel and directly mediates store-operated
      Ca2+ entry (SOCE).
    action: ACCEPT
    reason: RNAi in S2 cells abolishes SOCE and CRAC current, selectivity-filter mutants alter CRAC current
      properties, and neuronal knockdown reduces SOCE. Orai conducts the Ca2+ influx itself, so involvement
      in SOCE is a core process annotation. The IBA is consistent with the conserved Orai family function.
