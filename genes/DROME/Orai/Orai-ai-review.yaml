core_functions:
- description: Orai subunits assemble into the hexameric CRAC channel in the plasma membrane and, when
    gated by store-depletion-activated Stim, conduct highly Ca2+-selective store-operated Ca2+ influx.
  molecular_function:
    id: GO:0015279
    label: store-operated calcium channel activity
  directly_involved_in:
