- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: ISS
  original_reference_id: PMID:31009446
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13586
  review:
    summary: ISS transfer of calcium channel regulator activity from human STIM1 (Q13586) to Orai.
    action: REMOVE
    reason: Calcium channel regulator activity describes the Stim-type activity that gates the CRAC channel.
      Orai is the channel pore itself, not a regulator of a separate channel, and STIM1 is not a homolog
      of Orai, so the sequence-similarity transfer has no basis. The appropriate MF for Orai is store-operated
      calcium channel activity, which is already annotated.
    supported_by:
    - reference_id: PMID:18820677
      supporting_text: Stim senses depletion of the ER Ca(2+) store and physically relays this information
        by translocating from the ER to junctions adjacent to the plasma membrane, and Orai embodies the
        pore of the plasma membrane calcium channel.
