id: Q9U6B8
gene_symbol: Orai
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Orai (olf186-F) is the sole Drosophila member of the Orai family of four-transmembrane plasma
  membrane proteins and forms the pore of the Ca2+ release-activated Ca2+ (CRAC) channel. When endoplasmic
  reticulum Ca2+ stores are depleted, the ER Ca2+ sensor Stim translocates to ER-plasma membrane junctions
  and binds Orai, gating a highly Ca2+-selective, inwardly rectifying channel whose selectivity filter
  is a ring of conserved glutamates (E180) contributed by each Orai subunit. Crystal and cryo-EM structures
  of fly Orai show a hexameric assembly around a central pore lined by TM1 helices. Orai-mediated store-operated
  Ca2+ entry refills ER stores and sustains cytosolic Ca2+ signals, including NFAT activation in cultured
  cells and neuronal Ca2+ signaling required for flight.
