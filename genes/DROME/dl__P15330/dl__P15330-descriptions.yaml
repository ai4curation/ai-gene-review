- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription activator activity,
    RNA polymerase II-specific; high mobility group box 1 binding activity; and identical
    protein binding activity. Involved in several processes, including Toll signaling
    pathway; positive regulation of hemocyte proliferation; and regulation of gene
    expression. Located in several cellular components, including cytosol; neuromuscular
    junction; and subsynaptic reticulum. Is expressed in several structures, including
    adult head; embryonic/larval hypodermal muscle cell; epithelium; germline cell;
    and neuromuscular junction. Human ortholog(s) of this gene implicated in breast
    disease (multiple); carcinoma (multiple); immunodeficiency 53; immunodeficiency
    92; and lymphoma. Orthologous to several human genes including RELA (RELA proto-oncogene,
    NF-kB subunit).
