descriptions:
- source: UniProt
  text: Embryonic developmental transcription factor (PubMed:10072776, PubMed:2598266,
    PubMed:30982648). The lateral or ventral identity of a cell depends upon the concentration
    of this protein in its nucleus during the blastoderm stage (PubMed:2598266). Acts
    as a morphogenetic transcription factor that specifically binds to the kappa-B-related
    consensus sequence 5'-GRGAAAANCC-3', located in the enhancer region of zygotic
    genes such as Zen, Twist, Snail and Decapentaplegic, promoting their expression
    (PubMed:10072776, PubMed:2598266, PubMed:30982648). Part of a signaling pathway
    involving NF-kappa-B and Toll-related receptors, that functions in the apoptosis
    of unfit cells during cell competition (PubMed:25477468). Mediates an immune response
    in larvae (PubMed:10072776). May be part of a NF-kappa- B and Tollo signaling
    cascade that regulates development of the peripheral nervous system (PubMed:18000549).
  source_type: curated
