core_functions:
- description: Integral ER-membrane phospholipid scramblase of the VMP1/DedA family. The activity is inferred
    phylogenetically from reconstituted human VMP1 (PTN000031590) and is thought to equilibrate phospholipids
    between the ER leaflets. The ER location has been established experimentally in fly.
  molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:33929485
    supporting_text: Together, these data indicate that both TMEM41B and VMP1 are scramblases.
  - reference_id: PMID:34019822
    supporting_text: GFP-Vmp1 co-localizes with the ER markers Sec61β and SERCA in intestine cells
  - reference_id: file:DROME/Tango5/Tango5-bioinformatics/RESULTS.md
    supporting_text: 'PANTHER: Q7KVQ7, Q9W2S1 and human VMP1 (Q96GC9) are all placed in PTHR10281:SF1
      VACUOLE MEMBRANE PROTEIN 1.'
- description: Required for autophagosome formation in fly larval intestine, which is shown experimentally.
    As an ER scramblase it is thought, by family inference, to supply donor-leaflet lipid for phagophore
    expansion.
  molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:34019822
    supporting_text: did not accumulate mCherryAtg8a autophagy reporter puncta
  - reference_id: PMID:33850023
    supporting_text: In vitro assays reveal TMEM41B, VMP1, and ATG9 as  scramblases.
suggested_questions:
- question: Does purified Drosophila Tango5, in either the long (Q9W2S1) or the short (Q7KVQ7) form, scramble
    phospholipids in proteoliposomes? Does the disordered N-terminal 102 residues of Q9W2S1 have any function?
- question: Should the inter-ontology inference from phospholipid scramblase activity to plasma membrane
    phospholipid scrambling (GO_REF:0000108) be restricted, so that ER scramblases such as VMP1 and TMEM41B
    do not receive a plasma-membrane process term?
- question: Are the S2-cell secretion and Golgi-ER fusion phenotypes direct consequences of losing ER lipid
    scrambling, or secondary to impaired autophagy or ER stress?
suggested_experiments:
- description: Reconstitute purified Tango5 isoforms in NBD-lipid proteoliposomes to measure scramblase
    activity. Test whether scramblase-dead point mutants in the conserved VTT core rescue vmp1(delta) lethality,
    autophagy and Golgi integrity.
