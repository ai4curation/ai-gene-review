id: Q9W2S1
gene_symbol: Tango5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tango5, also called Vmp1, is the Drosophila member of the VMP1 subfamily of DedA/VTT-domain
  multipass membrane proteins and is orthologous to human VMP1 (PANTHER PTHR10281:SF1). Q9W2S1 is the
  530-residue product. It has a disordered N-terminal region of about 130 residues followed by a conserved
  membrane core with four predicted transmembrane helices and the VMP1 C-terminal helical domain. A shorter
  product (Q7KVQ7) begins at the internal Met103. Endogenously GFP-tagged Vmp1 resides in the endoplasmic
  reticulum, and the gene is essential for viability. Experiments in flies show that Vmp1 is required for
  autophagosome formation and autophagic flux in the larval intestine. It also acts genetically upstream
  of Vps13D and Marf/Mfn2 in clearing mitochondria and limiting mitochondria-ER contact. An RNAi screen in
  S2 cells found that its depletion impairs constitutive secretion and causes Golgi membranes to fuse with
  the ER. Reconstituted human VMP1 is an ATP- and calcium-independent phospholipid scramblase. On that basis
  and by phylogenetic inference, Tango5 is thought to equilibrate phospholipids between the leaflets of the
  ER membrane, for example during phagophore expansion. Its own biochemical activity has not been measured.
