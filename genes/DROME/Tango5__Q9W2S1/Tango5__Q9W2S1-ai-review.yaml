  review:
    summary: Phospholipid scramblase activity was inferred phylogenetically at the eukaryotic VMP1 node from
      reconstituted human VMP1. It is the core molecular function, but it has not been measured for the fly
      protein.
    action: ACCEPT
    reason: Reconstituted human VMP1 scrambles phospholipids without needing ATP or calcium. A PAINT curator
      placed this activity at PTN000031590, the eukaryotic VMP1 clade. Q9W2S1 falls inside that clade and
      is in the same PANTHER subfamily as VMP1 (PTHR10281:SF1, about 55% identity). It keeps the whole conserved
      membrane core, including the VMP1 C-terminal helical domain, and has no known lineage-specific loss.
