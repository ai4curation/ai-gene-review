  review:
    summary: Autophagosome assembly, propagated from the VMP1 node PTN000031591. Fly experiments independently
      show that Vmp1 is required for autophagosome formation.
    action: ACCEPT
    reason: A PAINT curator placed autophagosome assembly at PTN000031591, using human VMP1 and Dictyostelium
      Vmp1 as donors. The fly gene lies inside this clade (PTHR10281:SF1), and there is no evidence that
      it has lost the function. Fly data agree with the node placement. Without vmp1, larval intestine cells
      fail to accumulate mCherry-Atg8a puncta and they accumulate the cargo receptor Ref2p. Requirement alone
      would not show participation. The family mechanism supplies that. VMP1 is an ER scramblase that
      re-equilibrates the ER donor leaflet while ATG2 transfers lipid to the growing phagophore, so it does
      part of the work of autophagosome assembly. Fly Tango5 has not been tested biochemically, so the mechanistic
      part of this claim is inferred.
