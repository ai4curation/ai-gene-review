  review:
    summary: Golgi organization was propagated at PTN000031591 from the fly and Dictyostelium experimental
      annotations. The phenotype is genuine but probably secondary to the protein's ER membrane role.
    action: KEEP_AS_NON_CORE
    reason: The PAINT curator judged Golgi organization to be an ancestral feature of the VMP1 clade, seeded
      by the fly S2-cell phenotype (Golgi membranes fusing with the ER) and by Dictyostelium Vmp1. The node
