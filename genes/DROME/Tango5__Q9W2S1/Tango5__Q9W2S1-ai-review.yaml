  review:
    summary: Inferring the process from the scramblase function puts the scrambling in the wrong membrane.
      Tango5 is an ER protein, not a plasma-membrane protein.
    action: MODIFY
    reason: This row was generated by an inter-ontology rule from the phospholipid scramblase activity IBA.
      The resulting process term is specific to the plasma membrane and describes loss of plasma-membrane
      lipid asymmetry with surface exposure of phosphatidylserine, as mediated by TMEM16 and XKR scramblases.
      Fly Vmp1 co-localizes with ER markers, and VMP1-family scrambling is understood to act on the ER bilayer.
      What is sound here is transbilayer phospholipid movement, so the location-neutral process phospholipid
      translocation is proposed instead. The ER-specific scrambling itself is inferred, not measured in fly.
    proposed_replacement_terms:
