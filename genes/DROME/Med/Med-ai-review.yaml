id: O62609
gene_symbol: Med
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'Medea is the shared Drosophila co-Smad transcription factor for BMP and activin-family signaling.
  It associates with activated Mad in the BMP branch and with Smox in the activin branch, forming heteromeric
  complexes that accumulate in the nucleus and regulate target genes. Medea directly contributes to regulatory
  DNA binding and can support transcriptional activation or Schnurri-dependent repression according to
  the enhancer context. It shuttles between cytosol and nucleus, with SUMOylation promoting nuclear export.
  These functions support embryonic dorsal–ventral patterning, imaginal-disc and neural development, stem-cell
  regulation and synaptic maturation.'
