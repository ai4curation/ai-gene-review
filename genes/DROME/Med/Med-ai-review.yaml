- term:
    id: GO:0009950
    label: dorsal/ventral axis specification
  evidence_type: IMP
  original_reference_id: PMID:9502722
  qualifier: involved_in
  review:
    summary: Medea is required for embryonic dorsal–ventral specification and patterning.
    action: KEEP_AS_NON_CORE
    reason: Maternal/zygotic genetic loss produces ventralization and prevents dorsal-fate induction
      downstream of activated Tkv. These precise developmental outputs are retained separately from
      the core transcriptional mechanism.
    supported_by:
    - reference_id: PMID:9502722
      supporting_text: Complete elimination of maternal and zygotic Medea activity in the early
        embryo results in a ventralized phenotype identical to that of null dpp mutants
