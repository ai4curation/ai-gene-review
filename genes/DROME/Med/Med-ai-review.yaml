- term:
    id: GO:0030509
    label: BMP signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0011648
  - FB:FBgn0288966
  - MGI:MGI:109452
  - MGI:MGI:1328787
  - MGI:MGI:1859993
  - MGI:MGI:894293
  - PANTHER:PTN000344419
  - RGD:3030
  - UniProtKB:O15198
  - UniProtKB:O43541
  - UniProtKB:Q13485
  - UniProtKB:Q15797
  - UniProtKB:Q99717
  - ZFIN:ZDB-GENE-990603-9
  - ZFIN:ZDB-GENE-991119-8
  review:
    summary: Medea is the shared co-Smad transcriptional effector of BMP signaling.
    action: ACCEPT
    reason: Mad-dependent association, nuclear translocation, enhancer binding and genetic loss
      independently establish a core Dpp/BMP role. Studies of morphogen dosage, SUMO/ubiquitin
      regulation, transcriptional elements and tissue outputs support that same function. Activin
      participation does not make these BMP annotations non-core.
    supported_by:
    - reference_id: PMID:9502724
      supporting_text: MEDEA is most similar to mammalian Smad4 and forms heteromeric complexes with
        MAD.
    - reference_id: PMID:9502724
      supporting_text: MEDEA is localized in the cytoplasm, is not regulated by phosphorylation, and
        requires physical association with MAD for nuclear translocation.
    - reference_id: PMID:20010841
      supporting_text: activating input by the Smad signal transducers Mothers against Dpp (Mad) and
        Medea via competitive DNA binding.
    - reference_id: PMID:12705870
      supporting_text: the brk silencer serves as a direct target for a protein complex consisting
        of the Smad homologs Mad/Medea and the zinc finger protein Schnurri.
