- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:14534137
  qualifier: located_in
  review:
    summary: Medea enters and functions in the nucleus.
    action: ACCEPT
    reason: Primary localization and signal-dependent Mad association demonstrate nuclear
      accumulation; SUMO-dependent export shows this is a regulated shuttle rather than an
      exclusively nuclear protein. All nucleus rows are judged consistently.
    supported_by:
    - reference_id: PMID:9502724
      supporting_text: MEDEA is localized in the cytoplasm, is not regulated by phosphorylation, and
        requires physical association with MAD for nuclear translocation.
    - reference_id: PMID:18794353
      supporting_text: Med is SUMO modified in the nucleus, and we provide evidence that SUMOylation
        triggers Med nuclear export.
