  evidence_type: IMP
  original_reference_id: PMID:16256740
  qualifier: involved_in
  review:
    summary: Medea-dependent BMP signaling regulates ovarian somatic stem-cell maintenance and
      follicle-lineage development.
    action: KEEP_AS_NON_CORE
    reason: The primary stem-cell study establishes a direct BMP requirement in somatic stem-cell
      self-renewal and division, with effects on their differentiated follicle lineage. This is a
      tissue-specific developmental output of the co-Smad.
    supported_by:
    - reference_id: PMID:16256740
      supporting_text: BMP signaling is required in SSCs to directly control their maintenance and
        division, but is dispensable for proliferation of their differentiated progeny.
- term:
    id: GO:0030718
    label: germ-line stem cell population maintenance
  evidence_type: IMP
  original_reference_id: PMID:9695953
  qualifier: involved_in
  review:
    summary: The exact Medea assay for female germline stem-cell maintenance/division needs
      verification.
    action: UNDECIDED
    reason: The available PMID:9695953 abstract describes Dpp and Saxophone and does not expose a
      Medea-specific assay. Moreover, PMID:9502724 distinguishes dispensability of Medea during
      oogenesis from essential Mad functions, so precise stage/endpoint context matters. This is not
      sufficient to reject the curated stem-cell claim; retain uncertainty rather than equating all
      oogenesis with stem-cell maintenance.
