- source: Alliance_Imported
  text: Medea (Med) encodes a protein that belongs to the highly conserved Smad family.
    It can bind its siblings encoded by Mad or Smox to facilitate signal transduction
    for the product of dpp or Activin ligands in the TGF-beta family. Med-complexes
    function as transcriptional regulators. Many developmental roles include dorsal-ventral
    patterning, patterning and proliferation of the wing disc and gene expression
    in the mushroom body of the larval brain.
