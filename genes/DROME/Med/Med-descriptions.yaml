descriptions:
- source: UniProt
  text: Component of the Mad-Med transcription factor complex involved in the dpp/BMP
    TGF-beta signal transduction pathway; not essential but enhances or modifies the
    signal (PubMed:15296719, PubMed:16109720, PubMed:7705627, PubMed:8702167, PubMed:9502724,
    PubMed:9694800). Functions downstream of dpp and its receptors (PubMed:9502722,
    PubMed:9694800). Associates with the R-SMAD Mad upon dpp-signaling and translocates
    to the nucleus (PubMed:9502724, PubMed:9502733). Can also associate with the activin-like
    pathway R- SMAD Smox (PubMed:16951053). Binds GC-rich enhancer sites with consensus
    sequence 5'-GTCTG-3' in the enhancer region of dpp-responsive genes (PubMed:15296719,
    PubMed:16109720, PubMed:9694800). Mad-Med acts as a transcriptional activator
    but recruits shn/Shnurri to enhance its activity or switch to transcriptional
    repression (PubMed:16109720). Regulates dpp-responsive genes by directly activating
    their expression or by repressing the transcriptional repressor brk/brinker (PubMed:12705870).
    Also involved in repression of other key developmental genes including bam and
    gsb (PubMed:15296719). Required for dpp-induced expression of tin/tinman during
    embryogenesis (PubMed:9694800). Required for dpp-signaling during dorsoventral
    patterning of the embryo (PubMed:9502724, PubMed:9502733). Maternal contribution
    is essential for dorsoventral patterning in embryos (PubMed:9502722). Involved
    in dpp/BMP signaling during development of imaginal discs (PubMed:9502733).
