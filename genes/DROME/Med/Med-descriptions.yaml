- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific;
    DNA-binding transcription repressor activity, RNA polymerase II-specific; and
    RNA polymerase II cis-regulatory region sequence-specific DNA binding activity.
    Involved in several processes, including cell surface receptor protein serine/threonine
    kinase signaling pathway; imaginal disc-derived appendage morphogenesis; and regulation
    of transcription by RNA polymerase II. Located in cytosol and nucleus. Part of
    RNA polymerase II transcription repressor complex and heteromeric SMAD protein
    complex. Is expressed in several structures, including follicle cell; ganglia;
    germ layer; gut section; and head epidermis primordium. Used to study intestinal
    cancer and juvenile polyposis syndrome. Human ortholog(s) of this gene implicated
    in several diseases, including Lynch syndrome; disease of cellular proliferation
    (multiple); hereditary hemorrhagic telangiectasia; juvenile polyposis syndrome;
    and juvenile polyposis-hereditary hemorrhagic telangiectasia syndrome. Orthologous
    to human SMAD4 (SMAD family member 4).
