gene_symbol: Det
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Deterin (Det) is the Drosophila Survivin, a small protein with a single baculovirus IAP repeat
  (BIR) domain and a C-terminal alpha-helical region but no RING finger. It is a subunit of the chromosomal
  passenger complex (CPC) together with Aurora B, Incenp and Borealin (or Australin in male meiosis),
  forming with Borealin the localization module that targets the complex. Deterin accumulates at kinetochores
  and centromeres in metaphase, moves to the central spindle at anaphase entry and concentrates at the
  spindle midzone in late anaphase and telophase. A separation-of-function allele (scapolo) shows that
  Survivin is required to bring the CPC and the centralspindlin kinesin Pavarotti to the central spindle
  and equatorial cortex, for central spindle and contractile ring assembly, and for cytokinesis in neuroblasts
  and in both male meiotic divisions; with Aurora B it also delays abscission in germline cysts. Deterin
  was first described as an inhibitor of reaper- and drug-induced apoptosis in transfected insect cells.
