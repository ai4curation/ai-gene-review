core_functions:
- description: Survivin subunit of the chromosomal passenger complex localization module that, with Borealin,
    targets the CPC to centromeres in metaphase and is essential to bring the CPC and Pavarotti to the
    central spindle and equatorial cortex in anaphase, enabling central spindle and contractile ring assembly
    and cytokinesis in mitosis and male meiosis.
