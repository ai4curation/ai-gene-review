    supporting_text: Survivin is essential to target the CPC and the mitotic kinesin-like protein 1 orthologue
      Pavarotti (Pav) to the central spindle and equatorial cell cortex during anaphase in both larval
      neuroblasts and spermatocytes
suggested_questions:
- question: Does Deterin's anti-apoptotic activity in transfected cells reflect a physiological role in
    vivo, or is it an overexpression effect of the BIR domain, given that Deterin's genetic requirements
    are in the CPC?
- question: Does Drosophila Survivin read a Haspin-dependent histone H3 threonine-3 phosphorylation mark
    to target the CPC to centromeres, as vertebrate Survivin does?
suggested_experiments:
- hypothesis: Deterin has no CPC-independent anti-apoptotic function in vivo.
  description: Compare apoptosis in imaginal discs expressing wild-type Deterin, a CPC-binding-defective
    Deterin and the scapolo variant, under reaper or irradiation challenge, with mitotic defects monitored
    in parallel.
  experiment_type: in vivo genetic separation-of-function
