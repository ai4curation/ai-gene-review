- source: Alliance_Automated
  text: Predicted to enable metal ion binding activity. Involved in several processes,
    including cytoskeleton-dependent cytokinesis; meiotic chromosome segregation;
    and spindle organization. Located in cytoplasm; kinetochore; and spindle midzone.
    Part of chromosome passenger complex. Is expressed in embryonic brain; gonad;
    nurse cell; oocyte; and ovary. Human ortholog(s) of this gene implicated in breast
    disease; cervix disease; prostate cancer; and transitional cell carcinoma. Orthologous
    to human BIRC5 (baculoviral IAP repeat containing 5).
