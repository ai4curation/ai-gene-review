description: CG45100 encodes a predicted 38-residue peptide from an upstream open reading frame associated
  with the Hdac3 5-prime untranslated region. Its strongly hydrophobic central segment is compatible with
  membrane insertion, but peptide production, membrane topology, and biological activity are not established.
