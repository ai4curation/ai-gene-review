  qualifier: is_active_in
  review:
    action: ACCEPT
    summary: No experimental localization exists. A membrane location is a sequence-based
      hypothesis only.
    reason: >-
      Phobius predicts one transmembrane helix (residues 12-30), and this hydrophobic segment
      is conserved across Drosophilidae. This makes membrane insertion a reasonable hypothesis,
      but no study has shown that the peptide is produced and where it localizes. A predicted
      helix in an ORF whose translation has not been demonstrated is not enough to replace ND
      with a membrane term, so ND stays as the honest state.
