    summary: No biological process is established for the peptide or for the uORF.
    reason: >-
      No study has tested the peptide (trans) or the uORF's effect on Hdac3 translation (cis).
      Hdac3 processes cannot be assigned to a separate translation product. A cis-regulatory
      role would in any case belong to the RNA element, not to the peptide this accession
      describes.
