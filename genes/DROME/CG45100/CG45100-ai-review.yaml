core_functions: []
suggested_questions:
- question: >-
    Is the CG45100 uORF translated in vivo, and does the 38-residue peptide accumulate as a
    stable product? Peptide-level conservation across Drosophilidae suggests selection on the
    encoded sequence.
- question: >-
    Does translation of the CG45100 uORF regulate translation of the downstream Hdac3 coding
    sequence in cis, separately from any activity of the peptide in trans?
suggested_experiments:
- description: >-
    Knock in a minimal epitope tag at the endogenous CG45100 ORF, or run targeted
    mass spectrometry for its predicted tryptic peptides, to test whether the peptide is made
    and where it localizes (membrane fractionation and imaging).
  experiment_type: endogenous tagging and targeted proteomics
- description: >-
    Make CRISPR alleles that separate cis from trans effects: a start-codon mutation, a
    frameshift that keeps RNA composition, and synonymous recoding. In each, measure Hdac3
    protein and mRNA levels and score phenotypes, with peptide-only rescue.
  experiment_type: genome editing and translation reporter assays
