  qualifier: enables
  review:
    action: ACCEPT
    summary: No molecular activity is known for the 38-residue uORF peptide; ND is the correct
      state.
    reason: >-
      Exact-identifier literature searches (all aliases, including the uORF and Hdac3-5'utr
      names) found no publication testing this peptide. The product has no domain, no PANTHER
      family and no characterized homolog. Its only Drosophilidae homologs (D. mauritiana to
      D. rubida) are uncharacterized. Nothing can be transferred by homology, and
      HDAC3 deacetylase activity cannot be transferred from the downstream ORF of the
      same transcript.
