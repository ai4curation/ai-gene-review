  label: Drosophila melanogaster
description: >-
  CG45100 (Hdac3-5'utr, Dmel_Hdac3_uORF) is a predicted 38-residue peptide encoded by an
  upstream open reading frame in the 5-prime leader of Hdac3 transcripts. It has no
  similarity to histone deacetylases or to any characterized protein family. Its central
  segment (residues 12-30) is strongly hydrophobic and is predicted to form a single
  transmembrane helix, flanked by basic residues on the N-terminal side. The peptide sequence,
  including this hydrophobic segment, is conserved across Drosophilidae, which fits a
  translated product under selection. No homolog outside the Drosophilidae has been found.
  Translation of the ORF, accumulation of the peptide, its membrane localization, and any
  function, either as a peptide acting in trans or as a uORF regulating Hdac3 translation
  in cis, have not been tested.
