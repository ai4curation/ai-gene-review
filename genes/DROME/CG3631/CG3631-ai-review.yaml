  qualifier: enables
  supporting_entities:
  - FB:FBgn0000658
  review:
    action: REMOVE
    summary: Protein phosphorylation is not established for the FAM20B-like CG3631 branch.
    reason: The cited full paper separates CG3631/FAM20B from CG31145/FAM20C and reports casein phosphorylation
      for CG31145, not CG3631. Structural and biochemical work identifies FAM20B as a glycan xylose kinase.
      The ISS transfer therefore assigns the substrate class of the other branch; the evidence supports
      an alcohol-group phosphotransferase inference instead.
    supported_by:
    - reference_id: PMID:22900076
      supporting_text: CG3631, which is most closely related to FAM20B
    - reference_id: PMID:29572475
      supporting_text: Fam20B phosphorylates a xylose residue to regulate proteoglycan synthesis.
