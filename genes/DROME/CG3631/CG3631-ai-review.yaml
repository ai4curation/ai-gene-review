  review:
    action: REMOVE
    summary: Protein serine/threonine kinase activity, transferred by sequence similarity from Four-jointed,
      is not supported for the FAM20B-subfamily protein CG3631.
    reason: The WITH/FROM donor is Four-jointed (fj, FBgn0000658), a Golgi protein kinase that phosphorylates
      Fat and Dachsous cadherin domains. Fj is classified in a different PANTHER family (PTHR13147) from
      CG3631 (PTHR12450, subfamily SF14 glycosaminoglycan xylosylkinase), and FAM20B shows only weak similarity
      to Fj. Within PTHR12450 the substrate class is subfamily-specific. FAM20C-type proteins (SF11) and
      the fly FAM20C-like CG31145 phosphorylate proteins; the cited paper reports casein kinase activity
      for CG31145, not CG3631. FAM20B, the SF14 subfamily member with experimental data, phosphorylates
      glycan-linked xylose rather than amino-acid side chains. PAINT propagated only the broad alcohol-group
      phosphotransferase term to CG3631 and not a protein-kinase term. A cross-family similarity transfer
      therefore assigns the substrate class of a different branch and should not be retained. The broad
      phosphotransferase activity is captured by the IBA row.
    supported_by:
    - reference_id: PMID:22900076
      supporting_text: Drosophila CG31145 also has Casein kinase activity (not shown).
    - reference_id: PMID:22900076
      supporting_text: CG3631, which is most closely related to FAM20B
    - reference_id: PMID:19473117
      supporting_text: FAM20B, a protein of unknown function that shows weak similarity to a Golgi kinase
        encoded by four-jointed
    - reference_id: PMID:29572475
      supporting_text: Fam20B phosphorylates a xylose residue to regulate proteoglycan synthesis.
