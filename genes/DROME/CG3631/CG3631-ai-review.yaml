  review:
    action: ACCEPT
    summary: Alcohol-group phosphorylation is the appropriate broad activity for the FAM20B branch.
    reason: The experimentally established FAM20B substrate is glycan-linked xylose, which carries the
      phosphorylated hydroxyl group. CG3631 has the FAM20B-like evolutionary placement documented in the
      primary comparison; the conserved broad chemistry is supported while direct fly substrate assays
      remain absent.
    supported_by:
