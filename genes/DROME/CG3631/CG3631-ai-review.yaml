description: CG3631 is a secretory-pathway FAM20-family kinase related to the glycosaminoglycan xylosylkinase
  FAM20B. Tagged protein localizes to both the endoplasmic reticulum and Golgi in Drosophila S2 cells.
  Its evolutionary placement supports a role in proteoglycan linker phosphorylation, whereas protein-substrate
  phosphorylation characterizes the distinct FAM20C/CG31145 branch.
