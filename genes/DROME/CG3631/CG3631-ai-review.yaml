suggested_questions:
- question: Does purified CG3631 phosphorylate Gal-Xyl or linker tetrasaccharide acceptors, and is it inactive
    on protein substrates such as casein (the substrate used for its paralog CG31145)?
- question: Is CG3631 the enzyme responsible for the 2-phosphoxylose detected on Drosophila proteoglycan
    linkage regions (for example on Windpipe)?
- question: GO lacks a specific molecular function term for glycosaminoglycan-protein linkage region xylose
    2-O-kinase activity (RHEA:19461); should one be requested so that FAM20B orthologs need not carry
    the broad GO:0016773?
suggested_experiments:
- description: Recombinant CG3631 kinase assay with Gal-beta1-4-Xyl-benzyl and linker tetrasaccharide acceptors
    versus casein, including a catalytic-site mutant as negative control.
  experiment_type: in vitro enzyme assay
- description: CG3631 null or RNAi flies analysed for linker-region 2-phosphoxylose by glycoproteomics
    and for heparan sulfate and chondroitin sulfate amounts and chain number.
  experiment_type: genetic loss of function with glycan analysis
