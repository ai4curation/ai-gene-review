  label: Drosophila melanogaster
description: CG3631 encodes the single Drosophila member of the FAM20B (glycosaminoglycan xylosylkinase)
  subfamily of the FAM20 family of secretory-pathway kinases. The 421-residue precursor has an N-terminal
  signal sequence followed by the conserved FAM20 C-terminal kinase domain, with the ATP-, Mn2+- and
  catalytic-site residues of the family. By orthology with vertebrate FAM20B it is expected to transfer
  phosphate from ATP to the 2-hydroxyl of the xylose that links glycosaminoglycan chains to proteoglycan
  core proteins, a transient modification that promotes completion of the common tetrasaccharide linker
  and initiation of heparan sulfate and chondroitin sulfate chains; 2-phosphoxylose has been detected
  on fly proteoglycan linkers. Tagged CG3631 resides in the endoplasmic reticulum and Golgi of S2 cells
  and is not secreted, unlike the second fly FAM20 protein CG31145, a FAM20C-like protein kinase. No
  enzyme assay or loss-of-function phenotype has been reported for CG3631 itself.
