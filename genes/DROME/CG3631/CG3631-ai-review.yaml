  review:
    action: ACCEPT
    summary: Alcohol-group phosphotransferase activity is the activity shared by the whole FAM20 kinase
      lineage and is correctly inherited by CG3631.
    reason: PTN000966557 is a deep node whose descendants include both the FAM20C-type protein kinases
      (human FAM20C Q8IXL6, mouse/rat Fam20c, worm famk-1) and FAM20B (O75063). The common chemistry is
      ATP-dependent phosphorylation of a hydroxyl group, on Ser/Thr side chains for FAM20C and on the
      xylose 2-hydroxyl for FAM20B. CG3631 sits in the FAM20B subfamily (PANTHER PTHR12450:SF14, with human
      FAM20B, mouse Fam20b and zebrafish fam20b) and retains the family ATP-binding, Mn2+-binding and catalytic
      residues annotated by UniProt. The PAINT curator placed this broad term at the deep node and did
      not propagate a protein-kinase term to the FAM20B branch, which is consistent with the subfamily
      difference in substrate. No more specific GO term for glycan-linked xylose 2-O-kinase activity exists,
      so the broad term is as precise as GO currently allows. Direct assays of fly CG3631 are lacking.
    supported_by:
    - reference_id: PMID:22900076
      supporting_text: CG3631, which is most closely related to FAM20B
    - reference_id: PMID:19473117
      supporting_text: we identified FAM20B as a kinase that phosphorylates the xylose residue in the linkage
        region
    - reference_id: PMID:29572475
      supporting_text: Fam20B phosphorylates a xylose residue to regulate proteoglycan synthesis.
    - reference_id: file:DROME/CG3631/CG3631-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR12450:SF14; GLYCOSAMINOGLYCAN XYLOSYLKINASE; 1.'
- term:
    id: GO:0030166
    label: proteoglycan biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002488224
  - ZFIN:ZDB-GENE-040724-125
  review:
    action: ACCEPT
    summary: Proteoglycan biosynthesis is the process in which the FAM20B-type xylose kinase acts.
    reason: This IBA comes from a FAM20B-branch node (PTN002488224) seeded by zebrafish fam20b, which is
      in the same PANTHER subfamily (SF14) as CG3631. The enzyme itself performs a step of the process,
      phosphorylating the linker xylose on the core protein, which promotes linker completion and glycosaminoglycan
      chain initiation, so this is participation rather than mere requirement. FAM20B knockdown and overexpression
      alter chondroitin sulfate and heparan sulfate amounts in human cells, and 2-phosphoxylose occurs
      on Drosophila linkage regions, although no CG3631-specific perturbation has been reported. The broad
      process term is appropriate because the linker is shared by heparan sulfate and chondroitin sulfate
      proteoglycans.
    supported_by:
    - reference_id: PMID:19473117
      supporting_text: These results suggest that FAM20B regulates the number of glycosaminoglycan chains
        by phosphorylating the xylose residue in the glycosaminoglycan-protein linkage region of proteoglycans.
    - reference_id: PMID:29572475
      supporting_text: xylose phosphorylation within the tetrasaccharide linker region of CS and HS proteoglycans
        has also been demonstrated in Drosophila , and this activity can probably be ascribed to Fam20B
    - reference_id: PMID:22900076
      supporting_text: CG3631, which is most closely related to FAM20B
