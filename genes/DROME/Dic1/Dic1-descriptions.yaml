descriptions:
- source: Alliance_Imported
  text: Dicarboxylate carrier 1 (Dic1) encodes a protein of the inner mitochondrial
    membrane that catalyzes an electroneutral exchange across the inner mitochondrial
    membrane of dicarboxylates (e.g. malonate, malate, succinate) for inorganic phosphate
    and certain sulfur-containing compounds (e.g. sulfite, sulfate, thiosulfate).
    The main role of the product of is in gluconeogenesis. The carrier protein has
    also an anaplerotic role supplying substrates for the Krebs cycle.
  source_type: curated
  url: https://flybase.org/reports/Dic1.html
  source_id: FB:FBgn0027610
