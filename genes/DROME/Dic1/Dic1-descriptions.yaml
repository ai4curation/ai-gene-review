    overall_notes: Correct on inner-membrane electroneutral exchange of dicarboxylates
      for phosphate and sulfur oxyanions. The gluconeogenesis and anaplerotic roles
      are inferred from mammalian carriers and stated as fact; contains a typo ('product
      of is').
- source: Alliance_Automated
  text: Enables transmembrane transporter activity. Involved in several processes,
    including C4-dicarboxylate transport; phosphate ion transmembrane transport; and
    thiosulfate transport. Is active in mitochondrion. Is expressed in adult head
    and adult heart. Human ortholog(s) of this gene implicated in mitochondrial DNA
    depletion syndrome 19. Orthologous to human SLC25A10 (solute carrier family 25
    member 10).
  source_type: automated
