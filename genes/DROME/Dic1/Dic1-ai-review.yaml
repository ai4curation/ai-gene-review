suggested_questions:
- question: >-
    Does Dic1 export thiosulfate produced by mitochondrial sulfide oxidation in vivo, and is it needed
    for sulfide tolerance?
suggested_experiments:
- description: >-
    Measure mitochondrial malate/phosphate exchange and thiosulfate efflux in mitochondria from Dic1 mutant
    flies.
  hypothesis: >-
    Dic1 is the main route for dicarboxylate/phosphate exchange and thiosulfate export in fly mitochondria.
