- term:
    id: GO:0015364
    label: dicarboxylate:phosphate antiporter activity
  evidence_type: IC
  original_reference_id: PMID:21130726
  qualifier: enables
  review:
    summary: >-
      Dicarboxylate/phosphate antiport inferred for Dic1 from its classification as a typical dicarboxylate
      carrier.
    action: NEW
    reason: >-
      The individual substrate annotations do not capture the exchange (antiport) mechanism that defines
      the dicarboxylate carrier. The cached source for PMID:21130726 is abstract-only: it defines the
      carrier family as catalysing electroneutral dicarboxylate/phosphate exchange and reports that reconstituted
      Dic1 behaves as a typical member of the family. The antiport mechanism is therefore a family-property
      inference drawn from the curator-supported substrate transport activities (IDA) together with that
      classification, hence the inference code IC rather than IDA. The carrier itself performs the transport,
      so this is direct participation.
    supported_by:
    - reference_id: PMID:21130726
      supporting_text: >-
        The dicarboxylate carrier is an important member of the mitochondrial carrier family, which catalyzes
        an electroneutral exchange across the inner mitochondrial membrane of dicarboxylates for inorganic
        phosphate and certain sulfur-containing compounds.
    - reference_id: PMID:21130726
      supporting_text: >-
        DmDic1p is a typical dicarboxylate carrier showing similar substrate specificity and inhibitor
        sensitivity as mammalian and yeast mitochondrial dicarboxylate carriers.
