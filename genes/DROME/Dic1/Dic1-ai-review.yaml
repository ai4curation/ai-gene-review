id: Q9Y166
gene_symbol: Dic1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Dic1 encodes the principal mitochondrial dicarboxylate carrier (DIC) of Drosophila melanogaster, a member
  of the SLC25 mitochondrial carrier family located in the inner mitochondrial membrane. Recombinant Dic1
  reconstituted into liposomes transports dicarboxylates such as malate and succinate, phosphate, sulfate
  and thiosulfate, and behaves as a typical dicarboxylate carrier, with substrate specificity and inhibitor
  sensitivity similar to the mammalian and yeast carriers. By analogy with those carriers, which catalyse
  electroneutral exchange of dicarboxylates for inorganic phosphate, Dic1 is expected to work as a dicarboxylate/phosphate
  antiporter. Dic1 is expressed at all developmental stages, unlike its paralogs Dic2-4. By moving dicarboxylates,
  phosphate and sulfur oxyanions across the inner membrane it links mitochondrial metabolism with cytosolic
  pathways and can export thiosulfate and sulfate produced by mitochondrial sulfide oxidation.
