    label: extracellular ligand-gated monoatomic ion channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006202
  - InterPro:IPR036734
  review:
    action: ACCEPT
    summary: Broad Cys-loop ligand-gated channel activity is the best-supported molecular function, inferred from
      superfamily membership.
    reason: NtR has a signal peptide, a Neur_chan_LBD ligand-binding domain with an intact Cys-loop disulfide (C337-C351)
      and four C-terminal hydrophobic segments, and it falls inside the Cys-loop LGIC superfamily both in PANTHER
      (PTHR18945) and in an independent ML tree. Every characterised member of this superfamily is a ligand-gated
      channel subunit, so this broad term is an appropriate superfamily-level inference. Ligand and ion selectivity
      are unknown, and the hallmark selectivity motif is not conserved, so nothing more specific is supported.
    supported_by:
    - &id001
      reference_id: file:DROME/NtR/NtR-bioinformatics/RESULTS-rereview.md
      supporting_text: The data support membership in the Cys-loop ligand-gated channel superfamily (Cys-loop, ligand-binding
        domain, four hydrophobic segments)
    - &id002
      reference_id: file:DROME/NtR/NtR-family-evidence.md
      supporting_text: The published Cys-loop ligand-gated ion-channel tree in Matthews et al. (2018), Extended
        Data Figure 10d, includes Dmel NTR as a distinct branch outside both shaded nicotinic acetylcholine-receptor
        groups.
    - &id003
      reference_id: file:DROME/NtR/NtR-flybase.txt
      supporting_text: UNCLASSIFIED LIGAND-GATED ION CHANNEL SUBUNITS
    - reference_id: PMID:30429615
      supporting_text: Many insecticides act on ion channels, and we curated members of the Cys-loop ligand-gated
        ion channel (Cys-loop LGIC) superfamily in AaegL5.
