  review:
    action: UNDECIDED
    summary: NtR occupies a distinct unclassified branch in the primary Cys-loop channel tree, outside
      the explicitly identified core and divergent nicotinic acetylcholine-receptor groups.
    reason: 'NtR occupies a distinct unclassified branch in the primary Cys-loop channel tree, outside
      the explicitly identified core and divergent nicotinic acetylcholine-receptor groups. This is
      target-specific uncertainty about the placement of ligand/selectivity functions on the ancestral
      lineage: broad channel homology does not resolve acetylcholine gating or calcium permeability
      for this branch. No target ligand or ion-selectivity assay was found. The specific IBA is neither
      confirmed nor refuted; broad ligand-gated channel function remains supported. The Falcon report
      found no direct assay, but its broader skepticism about channel membership is not adopted; the
      actual uncertainty is the NTR branch-specific functional assignment.'
    supported_by:
    - reference_id: file:DROME/NtR/NtR-family-evidence.md
      supporting_text: The published Cys-loop ligand-gated ion-channel tree in Matthews et al. (2018),
        Extended Data Figure 10d, includes Dmel NTR as a distinct branch outside both shaded nicotinic
        acetylcholine-receptor groups.
    - reference_id: file:DROME/NtR/NtR-flybase.txt
      supporting_text: UNCLASSIFIED LIGAND-GATED ION CHANNEL SUBUNITS
    - reference_id: file:DROME/NtR/NtR-deep-research-falcon.md
      supporting_text: No ligand-binding or electrophysiological experiment establishes association
        with a neuronal channel.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
