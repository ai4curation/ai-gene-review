id: Q9W288
gene_symbol: NtR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'NtR (CG6698) is a Drosophila membrane protein of the Cys-loop ligand-gated ion-channel superfamily.
  It has an N-terminal signal peptide, a farnesoic acid O-methyltransferase-like (Methyltransf_FA) domain of unknown
  role, an extracellular neurotransmitter-gated channel ligand-binding domain with a conserved Cys-loop disulfide,
  and four C-terminal transmembrane segments, consistent with a plasma-membrane channel subunit. It is related to
  nicotinic acetylcholine receptor subunits but forms a divergent branch: it lacks the loop-C vicinal cysteines
  that bind acetylcholine in alpha subunits and the M2 GEK ring that sets cation selectivity. Its activating ligand,
  ion selectivity, partner subunits, tissue of action and physiological role have not been determined.'
