suggested_questions:
- question: Does NtR form a functional channel on its own or with nAChR subunits, and if so what ligand gates it
    and which ions does it conduct, given that it lacks loop-C vicinal cysteines and the M2 GEK ring?
- question: Is PTHR18945:SF430 (PANTHER 19.0, grouping NtR with nAChRalpha2) or PTHR36695 (UniProt cross-reference)
    the correct PANTHER placement for Q9W288, and should PAINT add a loss (IRD) node for the NtR branch for acetylcholine-specific
    terms?
- question: What, if anything, is the function of the N-terminal Methyltransf_FA-like domain, which is unusual for
    a Cys-loop channel subunit?
suggested_experiments:
- description: Express NtR alone and with Dalpha/Dbeta nAChR subunits (with chaperones such as RIC-3 or TMX3) in
    Xenopus oocytes and screen a ligand panel (acetylcholine, GABA, glutamate, histamine, biogenic amines, pH) by
    two-electrode voltage clamp, measuring reversal potentials for ion selectivity.
- description: Endogenously tag NtR by CRISPR knock-in to determine tissue and subcellular localization (neuronal
    versus hemocyte or other tissues) before testing synaptic roles.
