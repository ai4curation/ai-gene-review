- id: file:DROME/NtR/NtR-deep-research-falcon.md
  title: Falcon research on NtR/CG6698/Q9W288
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read the full report. Its failure to find a ligand assay is useful, but its claim that no channel
      function can be inferred overlooks the published Cys-loop tree and FlyBase unclassified-channel grouping.
      Direct target assays are not required to accept conserved broad function. The report provides no primary evidence
      against the channel inference.
  findings:
  - statement: No direct ligand-binding or electrophysiological experiment was located by the provider.
    supporting_text: No ligand-binding or electrophysiological experiment establishes association with a neuronal
      channel.
  - statement: The report recognizes neuronal-channel ligand-binding domains but underweights their concordance
      with the independently verified family tree.
    supporting_text: '**Neur_chan_LBD:** Pfam **PF02931**.'
- id: file:DROME/NtR/NtR-bioinformatics/RESULTS-rereview.md
  title: NtR Cys-loop hallmark residue comparison (re-review)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible MAFFT comparison of Q9W288 with nAChRalpha2, nAChRbeta1 and CHRNA7 (compare_motifs_rereview.py;
      raw output compare_motifs_rereview.out).
  findings:
  - statement: NtR lacks the loop-C vicinal cysteines of acetylcholine-binding alpha subunits.
    supporting_text: the nAChRalpha2 C243-C244 and CHRNA7 vicinal Cys pair, which defines acetylcholine-binding
      alpha subunits, aligns with NtR M412-M413
  - statement: NtR lacks the M2 GEK cation-selectivity ring conserved in nAChRs.
    supporting_text: all three references share the GEK motif at the intracellular end of M2
