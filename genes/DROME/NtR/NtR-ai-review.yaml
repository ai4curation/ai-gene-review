  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: nAChR complex membership is propagated from a bilaterian nAChR node; NtR has lost key nAChR hallmarks.
    reason: 'PANTHER 19.0 places NtR in PTHR18945:SF430 beside nAChRalpha2, so this IBA follows mechanically from
      an nAChR PAINT node. Two lines of target-specific evidence argue that NtR has diverged from the ancestral
      nAChR state the node encodes: (1) an independent maximum-likelihood Cys-loop tree (Matthews et al. 2018, Extended
      Data Fig. 10d) places Dmel NTR on a long branch outside both the core and divergent nAChR groups, with no
      Aedes ortholog; (2) NtR lacks the loop-C vicinal cysteine pair that forms the acetylcholine-binding site of
      alpha subunits and lacks the M2 GEK intermediate ring that confers cation selectivity in all nAChRs, and the
      Cys-loop FPFD motif is replaced. No ligand, selectivity, expression-site or electrophysiological data exist
      for NtR. Assembly with nAChR subunits cannot be excluded, so the term is not refuted, but the transfer is
      most likely an over-propagation from the subfamily.'
    supported_by:
    - &id004
      reference_id: file:DROME/NtR/NtR-bioinformatics/RESULTS-rereview.md
      supporting_text: PANTHER 19.0 classification files place Q9W288 in PTHR18945:SF430
