id: Q9W288
gene_symbol: NtR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: NtR is a membrane protein of the Cys-loop ligand-gated ion-channel family, with an extracellular
  ligand-binding region and a hydrophobic C-terminal channel region. It occupies a distinct unclassified
  branch related to nicotinic receptor subunits. A general ligand-gated ion-channel role is supported
  by conserved architecture and family placement, while its activating ligand, ion selectivity, native
  partners and physiological signaling context remain unresolved. The protein also contains an N-terminal
  methyltransferase-like region of unknown biochemical role.
