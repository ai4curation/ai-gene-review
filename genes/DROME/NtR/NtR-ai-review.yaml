  review:
    action: ACCEPT
    summary: NtR is an unclassified Cys-loop ligand-gated channel subunit in the published insect channel-family
      tree.
    reason: NtR is an unclassified Cys-loop ligand-gated channel subunit in the published insect channel-family
      tree. Its ligand-binding architecture and membrane-spanning C-terminal region support a plasma-membrane
      ion-channel role and consequent membrane-potential regulation by conserved family inference. The
      ligand and ion selectivity remain unresolved.
    supported_by:
    - &id001
      reference_id: file:DROME/NtR/NtR-family-evidence.md
      supporting_text: The published Cys-loop ligand-gated ion-channel tree in Matthews et al. (2018),
        Extended Data Figure 10d, includes Dmel NTR as a distinct branch outside both shaded nicotinic
        acetylcholine-receptor groups.
    - &id002
      reference_id: file:DROME/NtR/NtR-flybase.txt
      supporting_text: UNCLASSIFIED LIGAND-GATED ION CHANNEL SUBUNITS
    - &id003
      reference_id: PMID:30429615
      supporting_text: Many insecticides act on ion channels, and we curated members of the Cys-loop ligand-gated
        ion channel (Cys-loop LGIC) superfamily in AaegL5.
