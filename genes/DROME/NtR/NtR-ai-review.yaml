    reason: This synaptic assignment is generated downstream of the specific cholinergic channel inference.
      NtR is a distinct unclassified Cys-loop channel branch, and its native synaptic localization,
      ligand and ion selectivity are not established. The propagated postsynaptic/excitatory context
      therefore remains unresolved even though a general plasma-membrane channel role is well supported.
