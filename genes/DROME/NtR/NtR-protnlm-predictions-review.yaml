  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: The generic ligand-gated channel claim is supported by the published Cys-loop channel-family
      tree, which includes Dmel NTR, and the target ligand-binding/channel architecture. It already appears
      in the exact-accession GOA record. NtR lies outside the identified nicotinic receptor groups, so
      this broad result does not validate the narrower acetylcholine-gating or calcium-permeability annotations.
      The OpenScientist audit reached the same split, retaining broad channel terms and downscoping
      the acetylcholine, calcium and cholinergic assignments as untested computational propagation.
    supported_by:
    - reference_id: file:DROME/NtR/NtR-family-evidence.md
      supporting_text: The published Cys-loop ligand-gated ion-channel tree in Matthews et al. (2018),
        Extended Data Figure 10d, includes Dmel NTR as a distinct branch outside both shaded nicotinic
        acetylcholine-receptor groups.
