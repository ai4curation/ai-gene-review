id: E1JIT1
gene_symbol: Gpdh3
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Gpdh3-PB is a native 1291-residue Drosophila glycerol-3-phosphate-dehydrogenase-related isoform.
  It contains the paired NAD-dependent GPDH domains near its N terminus followed by a long extension,
  supporting retained glycerol-3-phosphate/dihydroxyacetone-phosphate interconversion chemistry. The physiological
  flux direction, oligomeric state and function of the extension remain unresolved.
