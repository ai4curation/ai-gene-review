- term:
    id: GO:0141152
    label: glycerol-3-phosphate dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:11092
  - EC:1.1.1.8
  - UniRule:UR000080073
  review:
    action: UNDECIDED
    summary: Ancestral GPDH activity of the family; the D. melanogaster protein has lost the proton-acceptor
      lysine, so activity is untested and doubtful.
    reason: >-
      The previous review accepted this term from domain completeness. Re-examination shows that domain
      presence is not residue conservation. Gpdh3 is a PTHR11728:SF8 member, and the gene receives a
      positive PAINT IBA for the parent NAD(P)+ activity (GO:0047952) via PTN000919759. That is a real
      phylogenetic argument that the lineage was ancestrally an active GPDH, and obscura-group and
      willistoni orthologs still retain the catalytic lysine. In D. melanogaster and the rest of the
      melanogaster group, the residue aligned with the human GPD1 proton acceptor K204 is threonine, and
      the NAD-loop glycine is glutamate. The substitution is present in cDNA-derived entries as well as
      the genome model, so it is not a sequence error. This lineage-specific loss is the kind of
      target-specific divergence that an IBA node cannot see. The annotation is not removed, because
      no assay has shown inactivity. It should be resolved experimentally.
    supported_by:
    - reference_id: file:DROME/Gpdh3/Gpdh3-bioinformatics/RESULTS-rereview.md
      supporting_text: 204 (ACT_SITE, proton acceptor) | K204 | K206 | T205
    - reference_id: file:DROME/Gpdh3/Gpdh3-bioinformatics/RESULTS-rereview.md
      supporting_text: In D. melanogaster the threonine is present in all cDNA- and genome-derived entries
    - reference_id: file:DROME/Gpdh3/Gpdh3-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR11728:SF8; GLYCEROL-3-PHOSPHATE DEHYDROGENASE [NAD(+)]-RELATED; 1.
    - reference_id: file:DROME/Gpdh3/Gpdh3-deep-research-falcon.md
