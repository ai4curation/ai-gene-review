- id: file:DROME/Gpdh3/Gpdh3-bioinformatics/RESULTS-rereview.md
  title: Gpdh3 re-review bioinformatics (isoform comparison, active-site and ortholog motif survey)
  findings:
  - statement: D. melanogaster Gpdh3 has threonine at the position of the human GPD1 proton-acceptor
      lysine (K204) and glutamate at the middle glycine of the NAD-binding GxGxxG loop.
  - statement: The catalytic lysine is retained in obscura-group and willistoni Gpdh3 orthologs but
      replaced in the melanogaster group; the NAD-loop glutamate is conserved across the lineage.
  - statement: E1JIT1 (Gpdh3-PB) differs from Gpdh3-PA (Q8IN06) only by lacking a 14-residue segment
      after the C-terminal GPDH domain.
