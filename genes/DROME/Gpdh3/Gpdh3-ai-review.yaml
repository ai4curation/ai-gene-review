    summary: Ancestral process of the GPDH family; not established for D. melanogaster Gpdh3, whose
      catalytic lysine is replaced.
    reason: The gene (PANTHER leaf Q8IN06, Gpdh3-PA) inherits a positive IBA for this term from
      PTN000198006, and PAINT placed a NOT only on the CG34149 leaf, not on Gpdh3. That is a deliberate
