  review:
    action: ACCEPT
    summary: The complete NAD-dependent glycerol-3-phosphate dehydrogenase module is retained.
    reason: FlyBase explicitly identifies E1JIT1 as the native 1291-residue Gpdh3-PB isoform. Its N-terminal
      cofactor-binding and C-terminal GPDH catalytic domains are both present within residues 6-312, supporting
      the conserved reaction despite the long extension. The domain evidence supports an evolutionary
      enzyme inference; it is not a direct assay of the long isoform.
    supported_by:
