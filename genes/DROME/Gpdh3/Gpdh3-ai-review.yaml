id: E1JIT1
gene_symbol: Gpdh3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Gpdh3 (CG43343) encodes a large (about 1,300 residues), uncharacterized Drosophila paralog of the
  cytosolic NAD-dependent glycerol-3-phosphate dehydrogenase Gpdh1. Its first ~340 residues form a
  glycerol-3-phosphate dehydrogenase fold (NAD-binding Rossmann domain plus the helical C-terminal
  domain), followed by a long, largely disordered C-terminal extension with no recognized domain.
  The gene is one of two long-branch, testis-biased Gpdh paralogs that arose in the higher Diptera.
  Gpdh3 diverges at residues essential for the enzyme in its relatives: its NAD-binding glycine loop
  reads GxExxG instead of GxGxxG in all Drosophila orthologs, and in the melanogaster group the
  lysine that serves as the proton acceptor in human GPD1 is replaced by threonine. Whether
  D. melanogaster Gpdh3 still interconverts dihydroxyacetone phosphate and glycerol-3-phosphate, binds
  NAD, or has taken on a different role in the male germline has not been tested. The gene makes
  three products (PA 1304 aa, PB 1291 aa, PC 1303 aa) that differ only by a 14-residue segment
  just after the C-terminal GPDH domain; E1JIT1 is the PB product.
