core_functions: []
suggested_questions:
- question: Does D. melanogaster Gpdh3 retain any NAD-dependent glycerol-3-phosphate dehydrogenase
    activity despite the K-to-T substitution at the GPD1 proton-acceptor position, and does the
    obscura-group ortholog that retains the lysine?
- question: Should the PAINT IBA for GO:0047952 propagated to Gpdh3 from PTN000919759 be restricted
    given the melanogaster-group loss of the catalytic lysine (compare the NOT already placed on CG34149)?
- question: What is the function of the ~950-residue disordered C-terminal extension in the male germline?
suggested_experiments:
- hypothesis: The GPDH core of D. melanogaster Gpdh3 has lost DHAP reductase / G3P dehydrogenase activity
    because of the T205 substitution, while the D. pseudoobscura ortholog (lysine retained) is active.
  description: Express the GPDH cores (residues ~1-340) of D. melanogaster Gpdh3, a T205K revertant and
    the D. pseudoobscura ortholog, with fly Gpdh1 as a positive control; assay NADH-dependent DHAP reduction
    and NAD+-dependent G3P oxidation, and measure NAD(H) binding by fluorescence or ITC.
- hypothesis: Gpdh3 acts in spermatogenesis.
  description: Determine Gpdh3 protein localization in testis with a tagged knock-in, and test male
    fertility and sperm metabolism in a CRISPR null.
