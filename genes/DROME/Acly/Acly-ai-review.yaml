taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Acly (ATPCL, CG8322) encodes the Drosophila ATP-citrate lyase (ATP-citrate synthase), a large
  cytosolic homotetrameric enzyme whose N-terminal succinyl-CoA synthetase-like and C-terminal citrate
  synthase-like regions together cleave citrate, exported from mitochondria by the citrate carrier Scheggia
  (Sea), into acetyl-CoA and oxaloacetate in an ATP- and CoA-dependent reaction. It is the main source
  of nucleo-cytosolic acetyl-CoA from glucose-derived citrate. Depletion of ATPCL lowers acetyl-CoA levels;
  during male meiosis ATPCL-derived acetyl-CoA is used chiefly for fatty acid synthesis and is needed
  for spindle organisation, cytokinesis, fusome assembly and Golgi organisation. Unlike human ACLY it
  is largely dispensable for global histone acetylation in fly mitotic cells, although its loss causes
  moderate chromosome breakage that is strongly enhanced in sea mutants, and partial reduction of ATPCL
  in adults dampens midlife increases in acetyl-CoA and histone acetylation and extends lifespan.
