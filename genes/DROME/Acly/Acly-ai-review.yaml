suggested_questions:
- question: Which alternative acetyl-CoA source (for example acetyl-CoA synthetase AcCoAS) sustains histone
    acetylation in ATPCL-depleted fly cells?
- question: Why does ATPCL depletion cause chromosome breaks without lowering global histone acetylation,
    and is a specific acetylation site or lipid product involved?
suggested_experiments:
- description: Combine ATPCL and AcCoAS knockdown in larval brain cells and quantify histone acetylation
    and chromosome breakage to test redundancy of nuclear acetyl-CoA sources.
