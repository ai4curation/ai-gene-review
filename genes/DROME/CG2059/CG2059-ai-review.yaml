suggested_questions:
- question: >-
    Does Drosophila CG2059 conserve the mammalian ABHD11 function of
    deglutarylating S-glutaryl-lipoyl adducts on the mitochondrial
    2-oxoglutarate dehydrogenase complex E2 subunit (Nc73EF), and why does
    CG2059 show sexually dimorphic tissue activity in adult flies?
suggested_experiments:
- hypothesis: >-
    Loss of CG2059 catalytic activity (CRISPR knockout or Ser127Ala knock-in)
    causes accumulation of glutaryl-lipoyl adducts on Drosophila mitochondrial
    Nc73EF and elevated 2-oxoglutarate levels.
  description: >-
    Generate CRISPR/Cas9 null and Ser127Ala alleles of CG2059 in Drosophila
    melanogaster, measure lipoylation status of mitochondrial OGDHc (Nc73EF) and
    PDHc by immunoblotting and LC-MS metabolomics, and test in vitro hydrolysis
    of glutaryl-lipoamide by purified CG2059.
  experiment_type: CRISPR/Cas9 mutagenesis, mitochondrial metabolomics, and enzymatic lipoyl-thioesterase assay
