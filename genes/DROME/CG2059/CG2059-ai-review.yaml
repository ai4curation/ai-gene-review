    reason: >-
      Propagated from Eukaryota node PANTHER:PTN002919262 solely from high-copy
      overexpression triacylglycerol changes of yeast IMO32 (PMID:28465236),
      whereas mammalian ABHD11 acts on lipoylated OGDHc rather than cellular
      glycerolipids (PMID:27544863, PMID:32792488) and CG2059 has only been
