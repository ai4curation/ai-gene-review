id: Q9W3R8
gene_symbol: CG2059
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG2059 is a 308-residue Drosophila melanogaster mitochondrial matrix serine
  hydrolase and carboxylesterase of the alpha/beta-hydrolase superfamily
  (PTHR46118:SF4), representing the catalytically intact paralog of the
  Diptera-specific gene pair CG2059/CG14717. CG2059 conserves the canonical
  oxyanion-hole motif (60-HGLGG-64) and Ser127-Asp151-His286 charge-relay
  catalytic triad orthologous to human ABHD11, and exhibits experimentally
  verified esterolytic carboxylesterase and fluorophosphonate-reactive serine
  hydrolase activity in Drosophila fat body and adult tissues, although its
  endogenous mitochondrial physiological substrate and pathway in vivo remain
  uncharacterized.
