- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: Valid ND annotation because chemoproteomic studies establish CG2059 molecular activity without identifying its endogenous biological process in Drosophila.
    action: ACCEPT
    reason: >-
      Published Drosophila studies (PMID:22198472, PMID:33827210) detect
      carboxylesterase and serine-hydrolase catalytic activity of CG2059 with
      synthetic activity-based probes, but targeted literature searches confirm
      that no genetic or biochemical study in Drosophila melanogaster has
      determined its endogenous physiological pathway or whether it maintains
      mitochondrial OGDHc lipoylation; accepted with nd_case TRUE_GAP and a
      matching BIOLOGY BP_DARK knowledge gap per projects/NO_DATA.md.
    nd_case: TRUE_GAP
    supported_by:
    - reference_id: PMID:22198472
      supporting_text: >-
        This study employs a functional proteomics approach to identify
        esterolytic enzymes of the vinegar fly Drosophila melanogaster fat body.
    - reference_id: file:DROME/CG2059/CG2059-notes.md
      supporting_text: >-
        Targeted PubMed and cached-corpus queries for `("CG2059" OR
        "FBgn0029942" OR "Q9W3R8") AND ("Drosophila" OR "melanogaster")`
        confirmed that aside from functional esterase/serine-hydrolase
        chemoproteomic profiling in `PMID:22198472` and `PMID:33827210`,
        **zero** genetic perturbation or physiological substrate studies in
        *Drosophila melanogaster* have established which endogenous biological
        process `CG2059` performs in vivo
