descriptions:
- source: Alliance_Imported
  text: Threonyl-carbamoyl synthesis 5 (Tcs5) encodes an atypical Ser/Thr kinase part
    of the KEOPS/EKC complex. It phosphorylates the product of p53 and is regulated
    by the products of Akt and Rab35. It is involved in tRNAs modification, telomere
    and chromatin dynamics.
  source_type: curated
  url: https://flybase.org/reports/Tcs5.html
  source_id: FB:FBgn0035590
