      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: KEOPS membership and tRNA modification are correct. p53 phosphorylation,
      regulation by Akt and Rab35 and telomere dynamics come from human or yeast orthologs;
      the review treats the kinase activity as weak and non-core and does not cover
      Akt or Rab35.
- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    positive regulation of TOR signaling and positive regulation of cell growth. Located
    in cytoplasm. Is expressed in eye-antennal disc and imaginal disc. Human ortholog(s)
    of this gene implicated in Galloway-Mowat syndrome 4. Orthologous to human TP53RK
    (TP53 regulating kinase).
  source_type: automated
