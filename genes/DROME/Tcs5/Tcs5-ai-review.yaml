taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tcs5 (also called Prpk or Bud32; CG10673) encodes the Drosophila melanogaster ortholog of
  yeast Bud32 and human TP53RK (PRPK), the atypical RIO-type kinase subunit of the EKC/KEOPS complex.
  In KEOPS, Bud32 binds the catalytic subunit Kae1/Tcs3 and the Cgi121 subunit and functions mainly as
  a tRNA-stimulated ATPase that supports Kae1-catalyzed transfer of a threonylcarbamoyl group to adenosine
  37 of ANN-decoding tRNAs (t6A); Bud32-family proteins also show weak serine/threonine protein kinase
  activity in vitro. Drosophila Tcs5 partially complements the yeast bud32 null mutant. Tcs5 is expressed
  in all tissues examined, and its knockdown impairs cell growth and proliferation with phenotypes resembling
  loss of PI3K/TOR signalling, consistent with the requirement of t6A-modified initiator tRNA for TOR
  activity and growth.
