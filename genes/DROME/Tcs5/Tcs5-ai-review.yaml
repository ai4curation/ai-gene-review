- term:
    id: GO:0061711
    label: tRNA N(6)-L-threonylcarbamoyladenine synthase activity
  evidence_type: ISS
  original_reference_id: PMID:34614169
  qualifier: contributes_to
  review:
    summary: Tcs5 contributes to the KEOPS t6A synthase activity as its Bud32/TP53RK kinase/ATPase subunit.
    action: NEW
    reason: Tcs5 is the Drosophila Bud32/TP53RK ortholog, an auxiliary subunit of the EKC/KEOPS complex
      whose catalytic subunit (Kae1/Tcs3) carries the t6A synthase activity. Bud32 supports the reaction
      within the complex, so it contributes to rather than carries out the complex activity; same treatment
      as the dimerization subunit Tcs6. No GOA row currently grounds this core molecular function.
    supported_by:
    - reference_id: PMID:34614169
      supporting_text: The Kae1 subunit of KEOPS catalyzes the universal and essential tRNA modification
        N6-threonylcarbamoyl adenosine (t6A), while the auxiliary subunits Cgi121, the kinase/ATPase Bud32,
        Pcc1 and Gon7 play a supporting role.
    - reference_id: PMID:25629598
      supporting_text: Archaea and Eukarya use the KEOPS complex composed of Tcs3 (Kae1), Tcs5 (Bud32),
        Tcs6 (Pcc1) and Tcs7 (Cgi121) proteins
  supporting_entities:
  - UniProtKB:Q96S44
  - UniProtKB:P53323
- term:
    id: GO:0002949
    label: tRNA threonylcarbamoyladenosine modification
  evidence_type: ISS
  original_reference_id: PMID:26516084
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P53323
  - PANTHER:PTN000258658
  review:
    summary: Involvement in tRNA t6A modification as an auxiliary KEOPS subunit.
    action: NEW
    reason: 'The UniProt entry lists GO:0070525 (tRNA threonylcarbamoyladenosine metabolic process, IBA:GO_Central)
      for this gene. That term is now obsolete ("an unnecessary grouping class") and replaced_by GO:0002949,
      and current GOA carries neither term for this gene, so the PAINT process assertion was lost in the
      obsoletion rather than rejected. Comparator check: yeast BUD32 (UniProtKB:P53323) carries GO:0002949
      (ComplexPortal), whereas human TP53RK and LAGE3 carry neither GO:0002949 nor GO:0070525 in QuickGO.
      The auxiliary KEOPS subunits do part of the work of the t6A step (Bud32 provides the tRNA-stimulated
      ATPase; Pcc1 dimerizes the complex and lines the tRNA-binding surface), and fly Bud32/Pcc1 support
      t6A synthesis in yeast complementation. We therefore restore the PAINT intent with the current term.'
    supported_by:
    - reference_id: PMID:26516084
      supporting_text: complementation of Drosophila Kae1 and other t6A factors in corresponding yeast
        null mutants demonstrates that these metazoan genes execute t6A synthesis
      reference_section_type: ABSTRACT
    - reference_id: PMID:26516084
      supporting_text: the two KEOPS components Drosophila kae1 and bud32 both conferred substantial rescue
      reference_section_type: RESULTS
