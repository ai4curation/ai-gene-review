suggested_questions:
- question: Does Drosophila Tcs5 depletion reduce t6A levels in vivo, and is its growth/TOR phenotype
    rescued by increasing t6A-modified initiator tRNA?
suggested_experiments:
- description: Quantify t6A by LC-MS in Tcs5 knockdown or mutant larvae and test rescue of growth by overexpression
    of initiator tRNA-Met together with Tcs3.
