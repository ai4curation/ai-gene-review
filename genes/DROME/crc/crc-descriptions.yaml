    - rubric: specificity
      score: 4
    overall_notes: 'Correct: CREB/ATF bZIP factor and EcR coactivator for ETH expression.
      The UPR regulation of glycolytic genes is not covered in the review.'
- source: Alliance_Automated
  text: Enables RNA polymerase II cis-regulatory region sequence-specific DNA binding
    activity; RNA polymerase II-specific DNA-binding transcription factor binding
    activity; and transcription coactivator activity. Involved in several processes,
    including PERK-mediated unfolded protein response; instar larval or pupal development;
    and positive regulation of JNK cascade. Located in endoplasmic reticulum membrane.
    Is expressed in several structures, including LNv neurons; embryonic/larval anterior
    spiracle; embryonic/larval salivary gland; fat body; and ganglia. Human ortholog(s)
    of this gene implicated in prostate carcinoma. Orthologous to human ATF4 (activating
    transcription factor 4) and ATF5 (activating transcription factor 5).
  source_type: automated
  url: https://flybase.org/reports/crc.html
