descriptions:
- source: Alliance_Imported
  text: cryptocephal (crc) encodes a protein that belongs to a member of the CREB/ATF
    family of basic-leucine zipper transcription factors. It serves as an  coactivator
    of the product EcR of to promote expression the molting peptide hormone encoded
    by ETH. It also acts as an unfolded protein response transcription factor to regulate
    glycolytic genes in response to ER stress.
  source_type: curated
  url: https://flybase.org/reports/crc.html
  source_id: FB:FBgn0000370
