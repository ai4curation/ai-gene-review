suggested_questions:
- question: Does CRC bind the conserved ATF4 half-site next to the EcR half-site in the ETH promoter
    directly, as a DNA-bound partner of EcR-B2, or is it recruited only through the EcR-B2 AF1?
- question: Which bZIP partners does CRC heterodimerize with on its stress-response targets (for example
    C/EBP-family proteins), and do these differ from its partners in ecdysone signalling?
- question: GO:0030374 nuclear receptor coactivator activity is obsolete. Is there a way to record that
    CRC coactivation is specific to EcR isoform B2?
suggested_experiments:
- description: Run ChIP-seq of endogenous Crc-GFP in Inka cells and fat body, plus EMSA with recombinant
    CRC on the ETH promoter ATF4/EcR composite site and the 4E-BP intron sites, to test direct DNA binding.
- description: Test whether the CRC-R361E charge-swap mutant rescues ETH expression and ecdysis in Inka
    cells that express EcR-B2-E9K in vivo.
