    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IMP
  original_reference_id: PMID:16651547
  qualifier: enables
  review:
    summary: crc mutants lose ETH expression, which needs a 382 bp enhancer with two conserved
      ATF4-like recognition elements (PMID:16651547). Mutating the ATF4 sites of the 4E-BP intron
      enhancer also abolishes ATF4-dependent reporter induction (PMID:27979906).
    action: ACCEPT
    reason: The cached paper is abstract only, and a mutant phenotype cannot show DNA binding directly.
      The claim is still well founded. CRC has a canonical bZIP basic region (PROSITE BZIP_BASIC), and
      ATF4-site mutations in two fly enhancers abolish CRC-dependent expression. We defer to the FlyBase
      curator, who read the full text. Sequence-specific binding at RNA polymerase II enhancers is the
      DNA-binding part of the core activator function.
    supported_by:
    - reference_id: PMID:16651547
      supporting_text: crc activates ETH expression though a 382 bp enhancer, which completely recapitulates
        the ETH expression pattern
    - reference_id: PMID:27979906
      supporting_text: The 4E-BP intron has ATF4-binding sites that mediate such induction
