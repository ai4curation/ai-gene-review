taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: cryptocephal (crc) encodes the Drosophila ortholog of vertebrate ATF4, a CREB/ATF-family
  basic-leucine zipper (bZIP) transcription factor that acts in the nucleus. Alternative transcripts
  give bZIP-containing isoforms (CRC-A, CRC-B) and a C-terminally truncated form (CRC-D). CRC
  activates RNA polymerase II target genes through ATF4-type sites. Examples are the 4E-BP/Thor intronic
  enhancer, which it activates downstream of the eIF2alpha kinases GCN2 and PERK during amino acid
  deprivation, ER stress and normal development. In ecdysone signalling CRC binds the isoform-specific
  AF1 activation domain of ecdysone receptor isoform B2 through its leucine zipper. As an EcR-B2
  coactivator it drives ecdysis-triggering hormone (ETH) expression in the endocrine Inka cells. Loss
  of crc causes defects in larval ecdysis, pupariation, head eversion and imaginal disc elongation, as
  well as later metamorphic defects.
