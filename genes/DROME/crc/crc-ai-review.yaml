- term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  evidence_type: IMP
  original_reference_id: PMID:27979906
  review:
    summary: Knockdown of atf4 (crc) or crc mutant alleles abolishes induction of 4E-BP transcription
      in larvae on amino acid deprivation. The induction acts through ATF4 sites in the 4E-BP intron,
      downstream of GCN2. A crc hypomorph is also more vulnerable to amino acid deprivation.
    action: NEW
    reason: CRC itself carries out the transcriptional step of the GCN2-ATF4 amino acid starvation
      response, so this is participation, not only necessity. Comparator check - the term is carried by
      the corresponding transcription factors in other species, human ATF4 and yeast GCN4. GOA has no
      stress-response process term for this product.
    supported_by:
    - reference_id: PMID:27979906
      supporting_text: Together, these results indicate that ATF4 is a major mediator of 4E-BP induction
        in response to amino acid deprivation in Drosophila larvae.
    - reference_id: PMID:34919148
      supporting_text: This crc allele renders flies more vulnerable to amino acid deprivation and age-dependent
        retinal degeneration.
