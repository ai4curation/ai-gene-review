- source: Alliance_Automated
  text: Predicted to enable arginase activity and manganese ion binding activity.
    Predicted to be involved in L-arginine catabolic process and ammonium excretion.
    Predicted to be located in mitochondrion. Predicted to be active in cytosol. Is
    expressed in embryonic/larval fat body and head. Used to study hyperargininemia.
    Human ortholog(s) of this gene implicated in allergic disease; asthma; hepatocellular
    carcinoma; and hyperargininemia. Orthologous to human ARG1 (arginase 1) and ARG2
    (arginase 2).
