id: O76895
gene_symbol: Arg
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Arg (CG18104) encodes the single arginase of Drosophila melanogaster, a binuclear manganese
  ureohydrolase of the arginase family that hydrolyses L-arginine to L-ornithine and urea. The gene, which
  harbours the elav locus within its third intron, is expressed mainly from late embryogenesis onward,
  with embryonic transcripts concentrated in the fat body. Insects such as Drosophila make only one arginase
  and lack a complete hepatic-type urea cycle, so the enzyme is thought to act mainly in arginine catabolism
  and in supplying ornithine for proline and polyamine synthesis rather than in ammonia detoxification.
  Its N-terminus resembles a mitochondrial presequence, consistent with a mitochondrial matrix location,
  and a truncating loss-of-function allele is viable but causes a developmental delay.
existing_annotations:
- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00158
  review:
    summary: UniPathway-based mapping of arginase to the urea cycle.
    action: REMOVE
    reason: Arginase catalyses the final step of the vertebrate hepatic urea cycle, but the mapping assumes
      the presence of that cycle. Drosophila, like other insects, produces only one arginase whose role
      is not centred on ammonia detoxification, and flies are not ureotelic in the vertebrate sense (nitrogen
      is excreted mainly as uric acid). Without the upstream carbamoyl-phosphate/ornithine transcarbamylase
      arm, annotating the fly enzyme to the urea cycle process is an electronic over-propagation; the
      arginase activity and L-arginine catabolism terms capture the real function. A comparative analysis
      of 150 insect genomes found ornithine carbamoyltransferase absent from all of them, so no insect
      can run the urea cycle.
    supported_by:
    - reference_id: PMID:10878001
      supporting_text: Most organisms, including insects, produce only one type of arginase, whose function
        is not centered on ammonia detoxification.
    - reference_id: PMID:40081835
      supporting_text: no insect can synthesize arginine via the urea cycle, as ornithine carbamoyltransferase
        is absent from all genomes analysed
