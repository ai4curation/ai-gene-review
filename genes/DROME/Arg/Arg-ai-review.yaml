  review:
    summary: Mitochondrion, transferred from human ARG2.
    action: UNDECIDED
    reason: Insects have a single arginase that, like vertebrate extrahepatic ARG2, is not a urea-cycle
      enzyme, and the Drosophila protein has an arginine/lysine-rich N-terminal extension lacking acidic
      residues that resembles a mitochondrial presequence. However, that reading is from inspection of the
      sequence only (no targeting-prediction run), the manganese study mentions arginase among mitochondrial
      enzymes without testing the fly protein, and the deep research finds no fly evidence separating a
      mitochondrial from a cytosolic location. As with the competing cytosol IBA, this is left undecided
      pending localisation data.
