suggested_questions:
- question: Is Drosophila arginase exclusively mitochondrial, or does an alternative translation start
    or isoform produce a cytosolic pool, as the cytosol IBA would imply?
- question: Does Arg compete with nitric oxide synthase for arginine in fly tissues, and does its ornithine
    output feed proline or polyamine synthesis in the fat body?
suggested_experiments:
- description: Tag endogenous Arg (C-terminal knock-in) and co-stain with a mitochondrial matrix marker
    in fat body and gut to determine its subcellular localisation.
- description: Measure arginine, ornithine and urea in Arg loss-of-function larvae by metabolomics to
    define the in vivo flux through arginase.
