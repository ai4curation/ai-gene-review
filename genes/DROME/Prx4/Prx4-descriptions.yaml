    overall_notes: Hydrogen peroxide regulation and oxidative protein folding are
      reasonable. 'Atypical 2-Cys' conflicts with the review, which calls Prx4 a typical
      2-Cys peroxiredoxin. Does not say ER lumen.
- source: Alliance_Automated
  text: Enables thioredoxin-dependent peroxiredoxin activity. Involved in several
    processes, including cellular response to cold; hydrogen peroxide catabolic process;
    and positive regulation of receptor signaling pathway via JAK-STAT. Located in
    cytosol; endoplasmic reticulum; and extracellular region. Is expressed in several
    structures, including adult head; adult heart; embryonic/larval midgut primordium;
    gland; and gut section. Orthologous to human PRDX4 (peroxiredoxin 4).
  source_type: automated
  url: https://flybase.org/reports/Prx4.html
