id: Q9V3Q4
gene_symbol: Prx4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Prx4 (also Jafrac2, DPx-4156; CG1274) is the Drosophila orthologue of peroxiredoxin 4, a
  typical 2-Cys peroxiredoxin of the AhpC/Prx1 family with an N-terminal signal peptide. It resides mainly
  in the lumen of the endoplasmic reticulum, where it reduces hydrogen peroxide using its peroxidatic
  and resolving cysteines and is regenerated by thioredoxin-type reductants, limiting ER peroxide and
  lipid peroxidation and protecting against oxidative stress. Under stress or strong overexpression it
  is redistributed to the cytosol and secreted into the hemolymph, where it can trigger JAK/STAT and Relish/NF-kB
  stress responses. Signal-peptide cleavage exposes an N-terminal IAP-binding motif, and in one study
  the cytosolic mature form bound DIAP1, displaced Dronc and promoted cell death when overexpressed.
