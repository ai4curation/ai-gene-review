suggested_questions:
- question: Is Prx4/Jafrac2 required for any physiological apoptosis in vivo (loss-of-function), or is
    its IAP-antagonist activity restricted to overexpression and stress-released cytosolic pools?
suggested_experiments:
- hypothesis: Endogenous Prx4 released from the ER contributes to DIAP1 antagonism during stress-induced
    apoptosis.
  description: Generate an endogenous Prx4 allele with the mature N-terminal Ala18 of the IAP-binding
    motif mutated (preserving peroxidase activity) and measure Dronc/DrICE activation and cell death after
    UV or ER stress, compared with peroxidatic-cysteine mutants.
  experiment_type: endogenous separation-of-function allele
