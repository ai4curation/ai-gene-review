  review:
    summary: Mature Jafrac2/Prx4 binds DIAP1 through its N-terminal IAP-binding motif.
    action: MODIFY
    reason: Specific, motif-dependent DIAP1 binding from a single study. Binding maps to the DIAP1 BIR2
      domain, so BIR domain binding is the informative replacement for bare protein binding, matching the
      treatment of the equivalent HtrA2 rows. The binding underlies a conditional pro-apoptotic role
      (competitive displacement of Dronc) shown only by gain of function, so the replacement is still
      regarded as non-core; GO has no term for IAP antagonism itself.
