suggested_questions:
- question: Are Drosophila Rad1 mutant phenotypes equivalent to hus1 (HU/MMS sensitivity, female sterility,
    loss of the meiotic checkpoint), as expected for an obligate 9-1-1 subunit?
suggested_experiments:
- hypothesis: Rad1 loss phenocopies hus1 in somatic and meiotic checkpoint responses.
  description: Generate a Rad1 null allele by CRISPR and test HU/MMS sensitivity, meiotic checkpoint activation
    in DSB-repair mutant backgrounds, and Rad9A nuclear-envelope targeting.
