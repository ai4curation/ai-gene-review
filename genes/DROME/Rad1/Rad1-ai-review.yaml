taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rad1 encodes the Drosophila ortholog of RAD1, a PCNA-like subunit of the heterotrimeric Rad9-Rad1-Hus1
  (9-1-1) checkpoint clamp that is loaded onto damaged DNA to support ATR-dependent DNA damage checkpoint
  signaling and DNA repair. DmRad1 co-precipitates with DmRad9 and Hus1 and interacts with Hus1 directly.
  Tagged DmRad1 is distributed throughout the cytoplasm and nucleus when expressed alone and is recruited
  to the nuclear envelope in the complex containing Rad9 isoform A.
