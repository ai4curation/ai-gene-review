id: P54622
gene_symbol: mtSSB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: 'mtSSB (lopo, low power) encodes the Drosophila mitochondrial single-stranded DNA-binding
  protein, a homotetrameric SSB-family protein that coats single-stranded mtDNA exposed during replication.
  Purified mtSSB binds single-stranded DNA with strong preference over duplex DNA or RNA and stimulates
  the DNA polymerase and exonuclease activities of DNA polymerase gamma, chiefly by removing template
  secondary structure and promoting primer recognition and strand initiation. mtSSB is required to maintain
  mtDNA copy number: lopo mutants and RNAi knockdown deplete mtDNA, lose respiration and arrest cell proliferation,
  causing late larval lethality.'
