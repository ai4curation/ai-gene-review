suggested_questions:
- question: Does mtSSB physically contact Pol gamma or the mtDNA helicase in Drosophila, or is its stimulation
    of Pol gamma entirely mediated through the template?
suggested_experiments:
- description: Reconstitute the Drosophila minimal mitochondrial replisome (Pol gamma, mtDNA helicase,
    mtSSB) and measure rolling-circle synthesis with wild-type versus DNA-binding-defective mtSSB.
