descriptions:
- source: UniProt
  text: Binds preferentially and cooperatively to pyrimidine rich single-stranded
    DNA (ss-DNA) (PubMed:21953457, PubMed:7673145, PubMed:8206370). Required to maintain
    the copy number of mitochondrial DNA (mtDNA) and plays crucial roles during mtDNA
    replication that stimulate activity of the gamma complex polymerase PolG1/tam
    at the replication fork (PubMed:11294889, PubMed:14754882, PubMed:21953457, PubMed:26446790,
    PubMed:28318978, PubMed:7673145). Promotes PolG1 activity largely by organizing
    the template DNA and eliminating secondary structures to favor ss-DNA conformations
    that facilitate PolG1 activity (PubMed:21953457, PubMed:26446790, PubMed:7673145).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54622
  source_id: P54622
