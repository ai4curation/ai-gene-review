- source: Alliance_Automated
  text: Enables single-stranded DNA binding activity. Involved in DNA replication
    and positive regulation of DNA metabolic process. Located in mitochondrial chromosome.
    Is expressed in several structures, including adult head; adult heart; cuboidal/columnar
    epithelium; embryonic/larval midgut primordium; and gut section. Human ortholog(s)
    of this gene implicated in optic atrophy. Orthologous to human SSBP1 (single stranded
    DNA binding protein 1).
