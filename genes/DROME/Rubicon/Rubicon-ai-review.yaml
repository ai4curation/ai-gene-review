suggested_questions:
- question: Does fly Rubicon bind and inhibit Vps34/UVRAG through its RUN domain and bind Rab7
    through its RH domain, as human RUBCN does? If so, GO:0141039 phosphatidylinositol 3-kinase
    inhibitor activity could replace the broader regulator term.
- question: Should the root PAINT node PTN002915557 carry phosphatidylinositol phosphate binding
    when the only experimental seed is the vertebrate Pacer paralog and Rubicon-clade members
    lack lipid-binding data?
  experts:
  - PANTHER/PAINT curators
suggested_experiments:
- description: In vitro pull-downs and kinase assays with recombinant fly Rubicon (WT, delta-RUN,
    RH point mutants) against Vps34-Vps15-Atg6-UVRAG and GTP-Rab7. Then rescue Rubicon-null glia
    and eggs with these mutants.
  hypothesis: The RUN domain is needed for the anti-autophagy activity and the RH-Rab7 interaction
    is needed for LAP. If so, the two outputs of fly Rubicon are separable.
  experiment_type: biochemistry and genetic rescue
- description: Liposome flotation or PIP-strip assays with the purified fly RH and PIKBD regions.
  hypothesis: Fly Rubicon binds phosphoinositides directly, which would test the root-level PAINT
    phosphatidylinositol phosphate binding inference.
  experiment_type: lipid-binding assay
