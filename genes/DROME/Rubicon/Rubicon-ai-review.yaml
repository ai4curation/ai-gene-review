id: Q9W3C9
gene_symbol: Rubicon
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Rubicon (CG12772, dRubicon) is the single Drosophila member of the Rubicon/Pacer
  family, with an N-terminal RUN domain, central class III PI3-kinase (VPS34)-binding segments
  and a C-terminal zinc-containing Rubicon-homology (RH) domain, the same architecture as vertebrate
  Rubicon (RUBCN). It acts on endolysosomal membranes in two opposite directions, as vertebrate
  Rubicon does. It restrains canonical autophagy. Its protein level rises with age, and neuronal
  or systemic knockdown increases autophagosome and autolysosome pools in the brain, extends
  female lifespan and reduces polyglutamine toxicity. It also promotes LC3-associated phagocytosis
  (LAP) and LAP-like single-membrane Atg8a conjugation. In glia it localizes to Rab7-positive
  late endosomes/phagosomes and is required for phagosome-lysosome fusion and degradation of
  engulfed axon debris after nerve injury. In the fertilized egg, Rubicon on the limiting membrane
  of maternal multivesicular bodies is required for PtdIns(3)P production, Atg8a recruitment
  and elimination of the paternal mitochondrial derivative. Direct biochemical partners (VPS34/UVRAG,
  Rab7) are inferred from vertebrate Rubicon and have not been shown for the fly protein.
