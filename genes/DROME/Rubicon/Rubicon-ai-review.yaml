    supported_by:
    - reference_id: PMID:37248218
      supporting_text: Rubicon::mRFP showed a punctate distribution, which rarely overlapped with
        Rab5-positive early endosomes/phagosomes or Lamp1-marked lysosomes
    - reference_id: PMID:37248218
      supporting_text: Apparently, almost all Rubicon dots colocalized with Rab7-positive late
