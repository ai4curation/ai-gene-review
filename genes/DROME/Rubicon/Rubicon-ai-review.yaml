- term:
    id: GO:0006909
    label: phagocytosis
  evidence_type: IMP
  original_reference_id: PMID:37248218
  qualifier: involved_in
  review:
    summary: Rubicon loss (RNAi, CRISPR frameshift alleles, glia-specific knockout) impairs glial
      clearance of engulfed axon debris and phagosome-lysosome fusion; overexpression accelerates
      clearance. This fits the GO definition of phagocytosis, which includes delivery of the
      engulfed material to the lysosome.
    action: ACCEPT
    reason: GO:0006909 covers both engulfment and delivery of the phagosome to the lysosome. Rubicon
      acts at the LAP/phagosome-maturation stage, which is part of this process. A more specific
      NEW annotation to phagosome maturation is proposed below to capture the step.
    supported_by:
    - reference_id: PMID:37248218
      supporting_text: Similar to Rubicon RNAi, Rubiconfs1 hemizygotes and Rubiconfs1/fs2 trans-heterozygotes
        failed to clear axon debris in injured nerves
    - reference_id: PMID:37248218
      supporting_text: glial Rubicon overexpression decreased the pool of undigested axon fragments,
        indicating that increasing Rubicon level is sufficient to boost debris clearance
- term:
    id: GO:0045335
    label: phagocytic vesicle
  evidence_type: IDA
  original_reference_id: PMID:37248218
  qualifier: is_active_in
  review:
    summary: Glial Rubicon::mRFP colocalizes with engulfed, GFP-labelled axon debris in large
      Rab7-positive vesicles (LAPosomes) after nerve injury.
    action: ACCEPT
    reason: This is direct imaging evidence that Rubicon sits on phagosomes containing cargo, where
      it is needed for their maturation. The evidence uses an overexpressed tagged protein, but
      it matches the vertebrate Rubicon localization during LAP.
    supported_by:
    - reference_id: PMID:37248218
      supporting_text: we observed colocalization of glial Rubicon::mRFP and GFP-labeled axon
        debris at 1 and 2 days after wing nerve injury, indicating that engulfed axon fragments
        are contained in LAPosomes
- term:
    id: GO:1901981
    label: phosphatidylinositol phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002915557
  - UniProtKB:Q9H714
  review:
    summary: Phosphatidylinositol phosphate binding is inherited from the eukaryote-level root
      node PTN002915557. Its only experimental seed is human Pacer (RUBCNL). There is no lipid-binding
      data for fly Rubicon or for human Rubicon.
    action: MARK_AS_OVER_ANNOTATED
    reason: The fly protein shares the RH and PIKBD modules with Pacer, and it acts on PtdIns(3)P-rich
      endolysosomal membranes. Fly Rubicon is needed for PtdIns(3)P production on LAP-like vesicles
      in the egg. Placing the term at the root is therefore plausible. However, the seeding evidence
      comes only from the vertebrate Pacer paralog, and the PIP-binding region of Pacer is not mapped.
      Direct lipid binding has not been shown for the fly protein, and fly Rubicon is RUBCN-like.
      Human Rubicon was not pulled down by PtdIns(3)P beads, and its RH-domain structure lacks the
      basic residues of a PI(3)P-binding FYVE motif. The term is therefore treated as an
      over-propagation from the vertebrate Pacer lineage, matching the human and mouse RUBCN
      reviews.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002915557
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root node seeded only by vertebrate RUBCNL/Pacer (PMID:28306502); Rubicon-lineage
          members, including this one, have no lipid-binding evidence.
    supported_by:
    - reference_id: file:DROME/Rubicon/Rubicon-uniprot.txt
      record_section: ["DR:GO"]
      supporting_text: GO; GO:1901981; F:phosphatidylinositol phosphate binding; IBA:GO_Central.
    - reference_id: PMID:38977659
      supporting_text: Other LAP pathway events, such as Rubicon-dependent production of PtdIns(3)P
        and association of ROS with the sperm flagellum, also unfold during this process.
- term:
    id: GO:0010507
    label: negative regulation of autophagy
  evidence_type: IMP
  original_reference_id: PMID:30783089
  qualifier: involved_in
  review:
    summary: Systemic knockdown of dRubicon increases autophagosome and autolysosome pools in
      the brain. Neuronal knockdown extends female lifespan and reduces polyQ inclusions, consistent
      with Rubicon acting as a conserved negative regulator of autophagy.
    action: NEW
    reason: This is the defining vertebrate-Rubicon activity, and it is the main fly phenotype
      reported. Rubicon itself is the regulator, so the participation test is met. The comparator
      check also holds, because human RUBCN carries GO:0010507 and the Euteleostomi PAINT node
      PTN002915566 carries the related negative regulation of autophagosome maturation. Fly Rubicon
      sits outside that vertebrate node, so it does not receive the term by IBA. The evidence
      is RNAi-based, from one lab.
    supported_by:
    - reference_id: PMID:30783089
      supporting_text: Systemic knockdown of dRubicon significantly increased steady-state autophagosome
        and autolysosome pools in the brain
    - reference_id: PMID:34189208
      supporting_text: Previously, we focused on Rubicon, a negative regulator of autophagy, and
        demonstrated that knockdown of the Drosophila homolog of Rubicon (dRubicon) suppressed
        locomotor dysfunction in a fly model of polyQ disease.
- term:
    id: GO:0090382
    label: phagosome maturation
  evidence_type: IMP
  original_reference_id: PMID:37248218
  qualifier: involved_in
  review:
    summary: Rubicon on Rab7-positive phagosomes is required for phagosome-lysosome fusion and
      breakdown of engulfed axon debris in glia (LC3-associated phagocytosis).
    action: NEW
    reason: The phenotype is specifically a failure of phagosome maturation and fusion with lysosomes,
      not of engulfment. Rubicon is a component of the LAP-specific PI3KC3 complex on the phagosome,
      so it does part of the maturation work rather than merely being required for it. This term
      is a more precise process annotation than phagocytosis and is not an ancestor or descendant
      of GO:0006909.
    supported_by:
    - reference_id: PMID:37248218
      supporting_text: Atg8a and Rubicon co-localize with phagocytosed axon fragments in glia,
        and glial loss of a subset of autophagy genes and of Rubicon impairs debris elimination
        and phagosome-lysosome fusion
