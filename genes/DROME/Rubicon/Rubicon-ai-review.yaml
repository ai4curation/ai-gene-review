- term:
    id: GO:0035014
    label: phosphatidylinositol 3-kinase regulator activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q92622
  review:
    summary: Fly Rubicon keeps the RUN and PIKBD regions that human RUBCN uses to bind and regulate
      the UVRAG-containing VPS34 complex. Fly genetics shows Rubicon-dependent PtdIns(3)P production
      on LAP-like vesicles.
    action: NEW
    reason: Human RUBCN binds VPS34 through its RUN domain and inhibits PIK3C3 lipid kinase activity
      in canonical autophagy. On LAPosomes, the same Rubicon-containing complex sustains PtdIns(3)P
      production. Fly Rubicon has the same domain architecture and behaves the same way genetically
      in both contexts. The direction-neutral parent term is used rather than GO:0141039 inhibitor
      activity, because the fly protein has not been assayed biochemically and it promotes PI3K
      output in LAP.
    supported_by:
    - reference_id: PMID:38977659
      supporting_text: Other LAP pathway events, such as Rubicon-dependent production of PtdIns(3)P
        and association of ROS with the sperm flagellum, also unfold during this process.
