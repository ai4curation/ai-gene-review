  review:
    summary: Early endosome location was transferred by similarity from human RUBCN. In fly glia,
      tagged Rubicon is mainly on Rab7-positive late endosomes/phagosomes and rarely overlaps
      with Rab5-positive early endosomes.
    action: MODIFY
    reason: Human RUBCN is mainly in late endosomes/lysosomes, and the only direct fly localization
      data show Rubicon::mRFP puncta almost entirely on Rab7-positive late endosomes/phagosomes,
      rarely on Rab5-positive early endosomes. Late endosome (GO:0005770) is the better-supported
      compartment for the fly protein. Its C-terminal RH domain is the Rab7-binding module in
      human Rubicon.
