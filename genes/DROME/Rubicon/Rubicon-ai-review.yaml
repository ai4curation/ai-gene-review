core_functions:
- description: Negative regulator of canonical autophagy, as vertebrate Rubicon is. By similarity
    to RUBCN, its RUN and PIKBD regions are expected to bind and restrain the UVRAG-containing
    VPS34 complex, and its RH domain to engage Rab7 on late endosomes. Loss of fly Rubicon raises
    neuronal autophagy and extends lifespan.
