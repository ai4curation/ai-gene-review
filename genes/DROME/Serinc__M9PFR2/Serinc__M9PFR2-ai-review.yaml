id: M9PFR2
gene_symbol: Serinc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Serinc (CG4672; also called DmSERINC, TMS1 or TMS1d) is the single Drosophila member of
  the SERINC/TMS (TDE1) family of multipass integral membrane proteins. M9PFR2 is the 467-residue
  isoform F, one of six splice products of the gene and the one UniProt and PANTHER treat as the
  gene's canonical sequence. Cryo-EM of the purified fly protein, carried out on the 465-residue
  isoform A, shows protomers of ten transmembrane helices arranged as two subdomains around a long
  diagonal helix, with cytoplasmic termini, two extracellular disulphides, a hydrophilic cleft between
  the subdomains, and a groove in subdomain B occupied by an acyl chain. Phosphatidylserine,
  cholesterol and sulfatide stabilise the purified protein, phosphatidylserine alters
  hydrogen/deuterium exchange around that groove, and the protein purifies as a lipid-bridged hexamer.
  Isoform F shares the whole membrane core and the lipid-binding groove with the characterised isoform
  but replaces the last helix and the C-terminal tail with an unrelated segment. When expressed in
  human cells, DmSERINC reduces the infectivity of Nef-deficient HIV-1, as human SERINC5 does. The
  protein's lipid-transport activity, native membrane compartment and physiological role in the fly
  are undetermined, and the family name comes from an early proposal of serine incorporation into
  lipids that later work has not upheld.
