- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: ISS
  original_reference_id: PMID:31907454
  qualifier: enables
  review:
    summary: The purified fly protein binds lipids directly through a groove in subdomain B. The
      measurements were made on isoform A, and isoform F retains that groove intact, so the activity is
      proposed for this accession by sequence inference rather than by direct assay.
    action: NEW
    reason: Three direct observations on the purified fly protein establish lipid binding - an acyl
      chain modelled into the subdomain-B groove in the cryo-EM map, a thermostability shift on adding
      phosphatidylserine, cholesterol or sulfatide, and a phosphatidylserine-dependent change in
      hydrogen/deuterium exchange around the same groove. The evidence code is ISS, not IDA, because the
      paper's residue numbering matches isoform A (Q9VV58) at all 18 named positions and so the assayed
      protein was isoform A, a different UniProt entry. The inference to isoform F is tight where it
      matters, since the groove is formed by TM5, 7, 8 and the C-terminal end of TM4, all inside the
      region the two isoforms share residue for residue, and isoform F keeps 17 of the 18 named residues
      including both disulphides and the interface pocket. It is not a whole-protein identity claim,
      because the two diverge completely after isoform-A residue 419, so isoform F lacks the invariant
      Lys438 of the inter-subdomain cleft and replaces the structure's final helix TM10, part of
      subdomain B, with a segment Phobius does not call transmembrane. The generic term is used rather
      than phosphatidylserine binding because several unrelated lipids stabilise the protein and no
      specificity or affinity was measured; cardiolipin, which bridges the hexamer, most likely came
      from the yeast expression host. Phospholipid scramblase activity is deliberately not proposed,
      for three reasons. It is demonstrated for human SERINC3/5, which sit in PTHR10383:SF51 and :SF16;
      the family's only PAINT node (PTN000043695, eukaryotic root) propagates membrane and nothing
      else; and no transport assay has been run on any fly isoform.
    supported_by:
    - reference_id: PMID:31907454
      supporting_text: the cryo-EM map revealed presence of an acyl chain bound at this site
    - reference_id: PMID:31907454
      supporting_text: addition of phosphatidylserine, cholesterol or sulfatide increased DmSERINC and
        SERINC5 protein thermostability, while cardiolipin stabilised DmSERINC only
    - reference_id: PMID:31907454
      supporting_text: hydrogen/deuterium exchange (HDX) experiments with DmSERINC revealed that
        phosphatidylserine affected isotope exchange around the potential lipid binding groove in
        subdomain B
    - reference_id: file:DROME/Serinc__M9PFR2/Serinc__M9PFR2-bioinformatics/RESULTS.md
      supporting_text: Isoform F therefore retains **17 of the 18 structurally named DmSERINC residues**
