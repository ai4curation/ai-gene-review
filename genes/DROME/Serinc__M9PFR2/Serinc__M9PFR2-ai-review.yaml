  - reference_id: PMID:31907454
    supporting_text: The surface of subdomain B features an elongated groove formed by TM5, 7, 8 and the
      C-terminal end of TM4
  - reference_id: file:DROME/Serinc__M9PFR2/Serinc__M9PFR2-bioinformatics/RESULTS.md
    supporting_text: Isoform F therefore retains **17 of the 18 structurally named DmSERINC residues**
knowledge_gaps:
- gap_statement: Whether the Drosophila SERINC protein moves lipids across the bilayer, and if so which
    lipids and in which direction, is undetermined. No transport or scrambling assay has been performed
    on any fly isoform.
  boundary: Direct lipid binding by the purified fly protein is established structurally and
    biophysically, and the human paralogs SERINC3 and SERINC5 flip PS, PE and PC in proteoliposomes.
    What is missing is any measurement of translocation by the fly protein itself.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: The fly has a single SERINC gene, so an activity measured on it would say what the
    family's conserved activity is, without the redundancy of the five vertebrate paralogs.
  resolution: Reconstitute purified fly SERINC into proteoliposomes and assay ATP-independent flipping
    of labelled phospholipids.
  provenance:
  - reference_id: PMID:31907454
    supporting_text: The conserved cellular functions of SERINCs remain unclear
- gap_statement: The membrane compartment in which the fly protein resides and acts is unknown, and so
    is its physiological role, since no loss-of-function phenotype has been reported for the gene.
  boundary: The protein is certainly in a membrane, given ten transmembrane helices in the structure
    and mass-spectrometric detection in an adult head membrane fraction. Nothing narrows that to the
    plasma membrane, the endomembrane system or any organelle in the fly.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: Without a compartment and a phenotype, the single fly SERINC cannot be placed in any
    pathway, and the human paralogs' plasma-membrane and antiviral biology cannot be tested for
    conservation.
  resolution: Tag the endogenous gene by CRISPR knock-in, localise the product against compartment
    markers, and phenotype a null allele.
  provenance:
  - reference_id: PMID:31907454
    supporting_text: The conserved cellular functions of SERINCs remain unclear
suggested_questions:
- question: Is isoform F translated at a meaningful level in the fly, and does its alternative
    C-terminal segment, which replaces the structure's final transmembrane helix and the invariant
    Lys438, change folding, hexamer formation or membrane targeting relative to isoform A?
- question: Does the purified fly protein scramble phospholipids as human SERINC3 and SERINC5 do? If it
    does, should PAINT move a scramblase activity term onto the eukaryotic node PTN000043695, which
    currently carries only membrane?
- question: Is the lipid-bridged hexamer seen after purification, with cardiolipin at the protomer
    interfaces, present in native fly membranes, or is it a product of expression in yeast and
    detergent extraction?
suggested_experiments:
- hypothesis: The fly SERINC protein is an ATP-independent phospholipid scramblase, like its human
    paralogs.
  description: Express and purify fly SERINC isoform A and isoform F separately, reconstitute each into
    proteoliposomes, and measure dithionite-quenched flipping of NBD-labelled PS, PE and PC with and
    without ATP. Comparing the two isoforms also tests whether the alternative C-terminus matters.
  experiment_type: in vitro lipid scrambling assay
- hypothesis: The fly SERINC protein occupies a specific membrane compartment that the structure alone
    cannot reveal.
  description: Knock a fluorescent tag into the endogenous Serinc locus by CRISPR, in a way that tags
    all isoforms and in a way that tags only the isoform-F-specific exon, and co-localise the products
    with plasma membrane, ER, Golgi, endosomal and lysosomal markers across fly tissues.
  experiment_type: endogenous tagging and imaging
- hypothesis: Loss of the single fly SERINC gene produces a lipid or membrane phenotype that the
    redundant vertebrate paralogs mask.
  description: Generate a null allele of CG4672, then combine viability and tissue phenotyping with
    leaflet-resolved lipid probes and lipidomics, rather than bulk lipid abundance alone, and rescue
    with individual isoforms.
  experiment_type: loss-of-function genetics with lipidomics
