- id: PMID:31907454
  title: A bipartite structural organization defines the SERINC family of HIV-1 restriction factors.
  findings:
  - statement: The fly has a single SERINC gene, and cryo-EM of the purified protein shows a hexamer of
      ten-helix protomers organised as two subdomains around a long diagonal helix, with two
      extracellular disulphides.
    supporting_text: Each of the six identical DmSERINC subunits consists of ten transmembrane helices
      (TM) arranged into two subdomains
  - statement: Subdomain B carries an elongated groove that holds an acyl chain in the cryo-EM map,
      phosphatidylserine, cholesterol and sulfatide stabilise the protein, and phosphatidylserine
      alters hydrogen/deuterium exchange at the groove.
    supporting_text: The surface of subdomain B features an elongated groove formed by TM5, 7, 8 and the
      C-terminal end of TM4
  - statement: Conserved residues named in the paper, which define the interface pocket and the
      inter-subdomain cleft, follow isoform A numbering, and the cleft residue Lys438 has no counterpart
      in isoform F.
    supporting_text: At the extracellular side of the structure, Gln181, Tyr282, Tyr285, Ser289, Lys438,
      and Thr414 line a hydrophilic cleft between the two subdomains that is corked by Trp418
  - statement: Ectopic DmSERINC expression in human cells restricts Nef-deficient HIV-1. This is a
      heterologous assay and is not evidence of an antiviral process in the fly.
    supporting_text: Ectopic expression of DmSERINC during production of Nef-deficient HIV-1 virions
      strongly suppressed their infectivity
  - statement: The authors state that the conserved cellular role of the family is still unresolved.
    supporting_text: The conserved cellular functions of SERINCs remain unclear
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read from the cached record. It is the only primary study of the fly
      protein. Its residue numbering matches isoform A (Q9VV58) at all 18 named positions, so the
      characterised protein is isoform A and not this accession; see the bioinformatics RESULTS file
      in this folder.
