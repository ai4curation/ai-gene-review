core_functions:
- description: Multipass integral membrane protein of the SERINC/TMS family that binds lipids directly
    in a groove formed by transmembrane helices 4, 5, 7 and 8 of subdomain B. Whether this binding
    serves transbilayer lipid movement, as it does for the human paralogs, has not been tested for any
    fly isoform.
  molecular_function:
