descriptions:
- source: UniProt
  text: Component of the EKC/KEOPS complex that is required for the formation of a
    threonylcarbamoyl group on adenosine at position 37 (t(6)A37) in tRNAs that read
    codons beginning with adenine. The complex is probably involved in the transfer
    of the threonylcarbamoyl moiety of threonylcarbamoyl-AMP (TC-AMP) to the N6 group
    of A37. Likely plays a direct catalytic role in this reaction, but requires other
    protein(s) of the complex to fulfill this activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9VV41
  source_id: Q9VV41
