  text: Predicted to enable tRNA N(6)-L-threonylcarbamoyladenine synthase activity.
    Involved in positive regulation of translational initiation and tRNA threonylcarbamoyladenosine
    modification. Predicted to be located in nucleus. Predicted to be part of EKC/KEOPS
    complex. Predicted to be active in cytoplasm. Used to study Galloway-Mowat syndrome
    3. Human ortholog(s) of this gene implicated in Galloway-Mowat syndrome 3. Orthologous
    to human OSGEP (O-sialoglycoprotein endopeptidase).
