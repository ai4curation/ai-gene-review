id: Q9VV41
gene_symbol: Tcs3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Tcs3 (also called Kae1; CG4933) encodes the Drosophila melanogaster ortholog of Kae1/OSGEP,
  the catalytic subunit of the EKC/KEOPS complex. Tcs3 is an ASKHA-fold threonylcarbamoyltransferase of
  the Kae1/TsaD family that transfers the threonylcarbamoyl moiety of L-threonylcarbamoyl-AMP (made by
  Sua5/Tcs2) onto adenosine 37 of ANN-decoding tRNAs, forming the universal anticodon loop modification
  N6-threonylcarbamoyladenosine (t6A), which stabilizes codon-anticodon pairing. In the KEOPS complex
  it is bridged to the Bud32/Tcs5 kinase/ATPase and the Pcc1/Tcs6 dimerization subunit. Drosophila Tcs3
  complements the yeast kae1 mutant, and fly mutants have reduced t6A and strong growth defects; t6A-modified
  initiator tRNA is limiting for TOR activity and growth, and kae1 mutants also develop melanotic masses
  with lymph gland overgrowth.
