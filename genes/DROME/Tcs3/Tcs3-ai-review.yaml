suggested_questions:
- question: Why do Drosophila kae1 null larvae retain substantial t6A - is there maternal perdurance,
    or a contribution from the mitochondrial paralog Qri7 (CG14231) to cytoplasmic tRNAs?
suggested_experiments:
- description: Measure t6A in cytoplasmic and mitochondrial tRNA fractions from kae1 germline-clone embryos
    and kae1; CG14231 double mutants to identify the source of residual t6A.
