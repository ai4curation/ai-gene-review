      of human GBA2 depends on. It also keeps the catalytic nucleophile and acid/base (PB Glu511 and Asp724,
      aligned with human Glu527 and Asp677), and nothing indicates a loss of function. The activity is
      inferred, not measured, for the fly protein. Hydrolysis of the beta-glucosidic bond is the general
      chemistry and is what this term asserts; which physiological substrate is used is a separate
