id: Q7KT91
gene_symbol: CG33090
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  CG33090 (FBgn0028916) is the single Drosophila melanogaster ortholog of the vertebrate non-lysosomal
  glucosylceramidase GBA2, a member of glycoside hydrolase family 116 (GH116). Q7KT91 is the 948-residue
  CG33090-PB product, the reviewed canonical protein of the gene. It has an N-terminal GH116
  beta-sandwich domain and a C-terminal (alpha/alpha)6 catalytic domain, and it keeps the glutamate
  nucleophile and aspartate acid/base (PB Glu511 and Asp724) that were identified by mutagenesis in human
  GBA2 (Glu527 and Asp677). In vertebrates GBA2 is a retaining beta-glucosidase. It hydrolyzes
  glucosylceramide to glucose and ceramide outside the lysosome, can transfer glucose from
  glucosylceramide to cholesterol, and acts as a peripheral protein on the cytosolic face of the ER and
  Golgi. The fly protein has not been studied biochemically or genetically beyond large-scale screens. Its
  beta-glucosidase activity is inferred from phylogenetic placement within the GBA2 subfamily
  (PTHR12654:SF0), and its glucosylceramide substrate, membrane association and physiological role are
  inferred from vertebrate GBA2. Fly-specific data are limited to in vivo phosphorylation of Ser214, Ser667
  and Ser669 in an embryonic phosphoproteome, detection in adult-head membrane proteomics, and RNAi or
  insertion lines that are viable and male-fertile.
