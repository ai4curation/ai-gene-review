- term:
    id: GO:0016139
    label: glycoside catabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9HCG7
  review:
    summary: Transferred from human GBA2 assays on artificial and bile-acid glucosides. The physiological
      glycoside substrates of the fly enzyme are unknown, so the process claim is an over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor annotation (human GBA2 IDA, PMID:17105727) reflects hydrolysis of glucosides measured in
      vitro, including artificial 4-methylumbelliferyl beta-glucoside, and the earlier bile acid
      3-O-glucoside activity. GO:0016139 is not an ancestor of glucosylceramide catabolic process, so this
      row does not stand in for the glycosphingolipid process. Bile acid glucosides do not exist in
      insects. A catabolic process role in the fly for any non-lipid glycoside has no evidence: neither the
      donor's in vivo substrate, glucosylceramide, nor any fly glycoside has been tested. The activity
      itself is captured by beta-glucosidase activity. Asserting a physiological glycoside catabolic
      process on top of that overstates what is known. PAINT did not propagate this term.
    supported_by:
    - reference_id: PMID:11489889
      supporting_text: A novel microsomal beta-glucosidase was recently purified and characterized from
        human liver that catalyzes the hydrolysis of bile acid 3-O-glucosides as endogenous compounds.
- term:
    id: GO:0046527
    label: glucosyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q69ZF3
  review:
    summary: Transglucosylation (glucose transfer from glucosylceramide to cholesterol) is shown in vitro
      for mammalian GBA2 only. It is untested in Drosophila and was not propagated by PAINT.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mouse Gba2 transfers glucose from glucosylceramide to cholesterol in vitro, and GBA2-deficient mice
      have less cholesteryl glucoside. Transglycosylation is a side reaction that the retaining
      double-displacement mechanism makes possible: the glycosyl-enzyme intermediate is intercepted by an
      acceptor alcohol other than water. Many retaining beta-glucosidases can do this in vitro, so the
      capacity alone does not show that the fly enzyme acts as a glucosyltransferase in vivo. No sterol
      glucoside formation has been shown for Drosophila, flies take up rather than synthesize sterols, and
      PAINT did not propagate the term. The row is therefore an over-annotation for this species. It is
      not removed, because the mechanism makes the activity chemically plausible.
    supported_by:
    - reference_id: PMID:26724485
      supporting_text: demonstrate that through transglucosylation both GBA and GBA2 are able to catalyze
        in vitro the transfer of glucosyl-moieties from GlcCer to cholesterol, and vice versa.
    - reference_id: PMID:32144204
      supporting_text: possess not only GlcCer hydrolase activity, but also transglucosylation activity
