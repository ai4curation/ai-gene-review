core_functions:
- description: >-
    Retaining GH116 beta-glucosidase. Inferred for Drosophila from PAINT placement of beta-glucosidase
    activity at the PTHR12654 family node PTN000291742, from membership in the GBA2 subfamily SF0, and from
    conservation of the catalytic nucleophile and acid/base (PB Glu511 and Asp724). The fly enzyme has not
    been assayed. By analogy with vertebrate GBA2, the expected physiological substrate is
    glucosylceramide, hydrolyzed on the cytosolic face of membranes, but this substrate assignment is not
    established in the fly (see knowledge_gaps).
  molecular_function:
    id: GO:0008422
    label: beta-glucosidase activity
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: file:DROME/CG33090__Q7KT91/CG33090__Q7KT91-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: 'DR   PANTHER; PTHR12654:SF0; NON-LYSOSOMAL GLUCOSYLCERAMIDASE; 1.'
  - reference_id: file:DROME/CG33090/CG33090-bioinformatics/RESULTS.md
    supporting_text: Both global and local MAFFT alignments map human GBA2 Glu527 to PC Glu362 and Asp677
      to PC Asp575 (PB Glu511 and Asp724).
  - reference_id: PMID:17080196
    supporting_text: Recombinant GBA2 hydrolyzed glucosylceramide to glucose and ceramide
knowledge_gaps:
- gap_statement: The physiological substrate(s) of Drosophila CG33090 are unknown. In particular, it has
    not been tested whether it hydrolyzes glucosylceramide or transfers glucose to sterols, as vertebrate
    GBA2 does.
  boundary: Beta-glucosidase chemistry is grounded by PAINT and by conservation of the catalytic residues.
    The substrate assignment rests only on vertebrate GBA2 data, and PAINT did not propagate
    glucosylceramidase activity. No CG33090 mutant has had its lipids profiled, and the available RNAi and
    insertion lines are viable and male-fertile.
