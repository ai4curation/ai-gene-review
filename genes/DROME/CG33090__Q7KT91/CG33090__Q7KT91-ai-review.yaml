  review:
    summary: Glucosylceramide hydrolysis is the defining activity of the GBA2 subfamily, which includes
      CG33090, but no Drosophila product has been assayed and PAINT did not propagate this term.
    action: UNDECIDED
    reason: >-
      The row comes from the combined automatic pipeline (InterPro IPR014551 GBA2-type beta-glucosidase,
      EC 3.2.1.45 and RHEA:13269). The evolutionary grounding is sound: Q7KT91 is in PANTHER subfamily
      PTHR12654:SF0 together with human GBA2 (Q9HCG7) and mouse Gba2 (Q69ZF3), DIOPT scores the pair 14/14,
      and the catalytic Glu/Asp pair is conserved. Glucosylceramide hydrolysis has been shown directly for
      recombinant mouse and human GBA2. However, PAINT curators placed only beta-glucosidase activity
      (GO:0008422) at the family-wide node PTN000291742, which also spans plant and bacterial GH116 enzymes.
      They did not assert glucosylceramidase activity at that node or at the narrower deuterostome node
      PTN000291746, even though IDA annotations for human and mouse GBA2 were available. Following the
      campaign rule, I treat that as a deliberate decision. Substrate specificity within GH116 varies
      (bacterial TxGH116 is a broad beta-glucosidase), and the fly substrate is untested. Flies do make
      glucosylceramide, so the activity is plausible, but it is not established for this species. I leave
      the row UNDECIDED rather than accept a substrate-specific claim that rests only on vertebrate data.
