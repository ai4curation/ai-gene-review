  review:
    summary: Phylogenetically grounded core activity. PAINT placed beta-glucosidase activity at the
      family-wide node PTN000291742, and Q7KT91 keeps a complete GH116 catalytic domain with both catalytic
      residues.
    action: ACCEPT
    reason: >-
      PAINT curators placed beta-glucosidase activity at PTN000291742, the ancestral node of the whole
      PTHR12654 family; its descendants include plant and bacterial GH116 enzymes as well as vertebrate GBA2.
