- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: Rests on an outdated single-pass transmembrane model of GBA2. Mammalian GBA2 is a peripheral
      ER/Golgi protein facing the cytosol, and fly phosphosites contradict the predicted extracellular
      topology.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The SubCell mapping is taken from the UniProt location "Cell membrane; Single-pass membrane protein".
      That location is flagged ECO:0000305 (curator inference) and has a predicted helix at 737-753 that
      places residues 1-736 outside the cell. This follows early GBA2 work that put the enzyme at or near
      the cell surface. Later work on mouse GBA2 showed that it is not an integral membrane protein: it is a
      cytosolic protein tightly associated with ER and Golgi membranes, and both its termini and the
      catalytic domain face the cytosol. Fly-specific data agree with a cytosolic catalytic region:
      Ser214 and Ser667/Ser669, which the predicted topology places in the extracellular segment, are
      phosphorylated in vivo in embryos, and intracellular kinases would make that modification. No
      Drosophila localization study supports the plasma membrane. The term is not impossible, because human
      GBA2 was reported near the cell surface, but as a location for the fly protein it is an over-annotation.
    supported_by:
    - reference_id: file:DROME/CG33090__Q7KT91/CG33090__Q7KT91-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cell membrane {ECO:0000305}; Single-pass membrane'
