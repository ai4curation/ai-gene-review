suggested_questions:
- question: Does CG33090 hydrolyze glucosylceramide in vivo? If it does, do null flies accumulate the
    glucosylceramide species made by the fly glucosylceramide synthase GlcT-1?
- question: Why did PAINT curators propagate beta-glucosidase activity but not glucosylceramidase activity
    across PTHR12654? Would a glucosylceramidase assertion at the SF0 (metazoan GBA2) node be justified?
- question: Unlike Gba2-knockout mice, fly CG33090 insertion lines are male-fertile. Does that reflect
    divergent physiology or incomplete loss of function?
suggested_experiments:
- description: >-
    Express recombinant CG33090-PB (wild type, and E511A and D724A catalytic mutants) and assay hydrolysis
    of 4-methylumbelliferyl beta-D-glucoside and of fly glucosylceramide, with conduritol B epoxide
    insensitivity and N-butyl-deoxynojirimycin sensitivity as GBA2 diagnostics. Also test glucose transfer
    to cholesterol and ergosterol.
  hypothesis: CG33090-PB is an active GBA2-type glucosylceramidase.
  experiment_type: in vitro enzyme assay
- description: >-
    Lipidomic profiling of glucosylceramides, ceramides and sterol glucosides in CG33090 null mutants
    versus controls, with transgenic PB rescue.
  hypothesis: Loss of CG33090 causes non-lysosomal glucosylceramide accumulation in fly tissues.
  experiment_type: lipidomics
- description: >-
    Localize an endogenously tagged CG33090-PB in fly tissues with ER and Golgi markers, and test its
    topology by protease protection.
  hypothesis: Like mammalian GBA2, CG33090 is a peripheral protein on the cytosolic face of the ER and
    Golgi.
