  review:
    summary: The expected process for a GBA2-subfamily enzyme, but untested in Drosophila and not
      propagated by PAINT. Left undecided, consistent with the glucosylceramidase activity row.
    action: UNDECIDED
    reason: >-
      The InterPro2GO mapping from IPR014551 (GBA2-type beta-glucosidase) is the process counterpart of the
      glucosylceramidase activity row. In mouse, loss of GBA2 causes glucosylceramide to accumulate in
      testis, brain and liver, which shows that the vertebrate enzyme catabolizes this lipid in vivo. No
      Drosophila CG33090 mutant has been profiled for lipids, and PAINT did not assert this process at any
      node of PTHR12654. If CG33090 does hydrolyze glucosylceramide, the fly protein would perform the
      catalytic step itself, so this would be genuine process participation. The evidence gap concerns the
      fly substrate, not the logic of the annotation. The row is UNDECIDED pending a fly assay or lipidomics.
    supported_by:
    - reference_id: PMID:17080196
      supporting_text: We conclude that GBA2 is a glucosylceramidase whose loss causes accumulation of
        glycolipids and an endoplasmic reticulum storage disease.
- term:
    id: GO:0008206
    label: bile acid metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9HCG7
  review:
    summary: Insects do not synthesize bile acids, and even in mouse GBA2 loss leaves bile acid metabolism
      normal. Not transferable to Drosophila.
    action: REMOVE
    reason: >-
      This ISS is transferred from human GBA2, which was first purified and cloned as a microsomal bile acid
      3-O-glucoside beta-glucosidase from liver. The process does not exist in Drosophila. Insects cannot
      synthesize sterols de novo and convert dietary sterols to ecdysteroids, not to bile acids, so the
      vertebrate hepatic bile acid pathway (CYP7A1 and its partners) is absent. The process is also weakly
      grounded in the donor lineage: Gba2-knockout mice had normal bile acid metabolism, and mouse Gba2
      carries a curated NOT annotation for this term, which led to the enzyme being redefined as a
      glucosylceramidase. PAINT did not propagate the term. This is a pathway-context error, so the row is
      removed.
    supported_by:
    - reference_id: PMID:17080196
      supporting_text: we generated mice deficient in GBA2 and found that these animals had normal bile
        acid metabolism
    - reference_id: PMID:11489889
      supporting_text: where it displayed bile acid beta-glucosidase activity
