    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR014551
  review:
    summary: Membrane association is supported for the GBA2 subfamily and by fly adult-head membrane
      proteomics. A more specific compartment has not been established for Drosophila.
    action: ACCEPT
    reason: >-
      GBA2-subfamily proteins are tightly associated with membranes, and in mouse GBA2 this association,
      in particular with phospholipids, is needed for activity. FlyBase records CG33090 polypeptide in the
      membrane fraction of adult heads by mass spectrometry (Aradska et al. 2015). The mammalian
      compartments (cytosolic face of the ER and cis-Golgi) are not tested in the fly, so "membrane" is as
      precise as the Drosophila evidence allows. It is not refined further, and the membrane is not
      treated as an integral one (see the plasma membrane row).
    supported_by:
    - reference_id: PMID:23250757
      supporting_text: 'Results: GBA2 is not an integral membrane protein but rather is membrane-associated
        at the ER and Golgi.'
