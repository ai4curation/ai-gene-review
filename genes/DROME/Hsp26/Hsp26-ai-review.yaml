- id: file:DROME/Hsp26/Hsp26-notes.md
  title: Hsp26 IBA re-review notes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual notes from the 2026-09-28 IBA re-review, including PubMed recency search and source-level checks.
core_functions:
- description: >-
    Hsp26 binds non-native client proteins and suppresses heat-induced aggregation without an ATP-driven folding cycle. It preserves clients for subsequent reactivation by the cellular chaperone machinery. Purified Hsp26 directly protects citrate synthase and luciferase, and luciferase can then be reactivated by other chaperones in reticulocyte lysate plus ATP.
  directly_involved_in:
  - id: GO:0042026
    label: protein refolding
  - id: GO:0009408
    label: response to heat
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:16572729
    supporting_text: Altogether, these results demonstrate that Hsp22, Hsp23, Hsp26, and Hsp27 can maintain heat-treated luciferase in a refoldable state, from which it can be refolded by other chaperones into an active enzyme.
  - reference_id: PMID:26705243
    supporting_text: The four classical small HSPs (HSP22, HSP23, HSP26, and HSP27) were all highly induced after a heat shock
  molecular_function:
    id: GO:0140309
    label: unfolded protein holdase activity
suggested_questions:
- question: Can primary Hsp26 nuclear-matrix fractionation or imaging data distinguish a true conditional nuclear pool from Hsp23/Hsp27 antibody cross-reactivity and cytosolic contamination?
