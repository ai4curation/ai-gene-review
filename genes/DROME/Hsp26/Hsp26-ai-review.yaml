id: P02517
gene_symbol: Hsp26
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Drosophila melanogaster Hsp26 is an alpha-crystallin-domain small heat shock protein with ATP-independent holdase activity. It binds non-native clients during stress, suppresses heat-induced aggregation, and preserves damaged proteins for subsequent refolding by other chaperones. Hsp26 is highly heat-inducible, predominantly cytosolic, and less efficient than Hsp22 or Hsp27 in purified citrate synthase and luciferase protection assays. It associates with Hsp23; Hsp23/Hsp26 dosage modulates neuromuscular-junction synapse number in developing motor neurons. Hsp26 is also developmentally regulated, with strong early-embryo and germline expression, and its basal expression in ovaries is maintained differently from most Hsp genes after Med15 depletion.
