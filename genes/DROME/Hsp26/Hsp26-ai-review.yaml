- id: PMID:15308776
  title: Multiple-stress analysis for isolation of Drosophila longevity genes.
  findings:
  - statement: Overexpression of Hsp26 extends mean lifespan by 30% and increases stress resistance.
    supporting_text: Overexpression of either hsp26 or hsp27 extended the mean lifespan by 30%, and the flies also displayed increased stress resistance
  - statement: Hsp26 identified as a longevity gene through multiple-stress screening.
    supporting_text: This screen indeed identified 13 genes, some already known to be involved in longevity, plus candidate genes. Two of these, hsp26 and hsp27, were chosen to test for their effects on lifespan
- id: PMID:16313561
  title: Cold hardening and transcriptional change in Drosophila melanogaster.
  findings:
  - statement: Hsp26 transcript abundance increases during cold hardening treatment (0 degrees C for 2 h).
    supporting_text: these assays suggest that stress proteins, including Hsp23, Hsp26, Hsp83 and Frost as well as membrane-associated proteins may contribute to the cold hardening response
  - statement: Evidence is expression-based only (microarray and qPCR).
    supporting_text: Microarray analysis to examine the changes in transcript abundance associated with cold hardening treatment...Quantitative RT-PCR was used to independently determine transcript abundance
- id: PMID:16572729
  title: Differences in the chaperone-like activities of the four main small heat shock proteins of Drosophila melanogaster.
  findings:
  - statement: Hsp26 prevents heat-induced aggregation of citrate synthase but requires 5-fold molar excess compared to Hsp22 and Hsp27 at 1:1 ratio.
    supporting_text: A 5 M excess of Hsp23 and Hsp26 was required to obtain the same efficiency with either citrate synthase or luciferase as substrate
  - statement: In in vitro refolding with reticulocyte lysate, 30% luciferase recovery with Hsp26 (vs 50% for Hsp22, 40% for Hsp27).
    supporting_text: In an in vitro refolding assay with reticulocyte lysate, more than 50% of luciferase activity was recovered when heat denaturation was performed in the presence of Hsp22, 40% with Hsp27, and 30% with Hsp23 or Hsp26.
  - statement: Sedimentation analysis shows Hsp26 binds denatured luciferase at 42 degrees C.
    supporting_text: These differences in luciferase reactivation efficiency seemed related to the ability of sHsps to bind their substrate at 42 degrees C, as revealed by sedimentation analysis of sHsp and luciferase on sucrose gradients
  - statement: Hsp26 is a holdase chaperone that maintains substrates in a refoldable state.
    supporting_text: the 4 main sHsps of Drosophila share the ability to prevent heat-induced protein aggregation and are able to maintain proteins in a refoldable state, although with different efficiencies
- id: PMID:18045836
  title: Sisyphus, the Drosophila myosin XV homolog, traffics within filopodia transporting key sensory and adhesion cargos.
  findings:
  - statement: Hsp26 identified as a putative cargo of Sisyphus myosin XV.
    supporting_text: We have identified several putative Sisyphus cargos, including DE-cadherin (also known as Shotgun) and the microtubule-linked proteins Katanin-60, EB1, Milton and aPKC
- id: PMID:19715580
  title: The small heat shock protein (sHSP) genes in the silkworm, Bombyx mori, and comparative analysis with other insect sHSP genes.
  findings:
  - statement: Comparative genomic analysis of sHSP genes across five insect species.
    supporting_text: we performed comparative analyses with the sHSPs from other four insects whose complete genome sequences are available
  - statement: Confirms conserved alpha-crystallin domain and chaperone function across insect sHSPs.
    supporting_text: sHSPs primarily have chaperone activity and reflect the response machine of organisms to some extreme stresses existing in environment
  - statement: Drosophila has 11 sHSP genes, most located on chromosome 3L.
    supporting_text: D. melanogaster has 11 sHSP genes...chromosome 3 of D. melanogaster (8 sHSP genes)
- id: PMID:24292889
  title: Ube3a, the E3 ubiquitin ligase causing Angelman syndrome and linked to autism, regulates protein homeostasis through the proteasomal shuttle Rpn10.
  findings:
  - statement: Hsp26 detected in cytoplasmic fraction by high-throughput proteomics in Drosophila.
    supporting_text: "We have now devised a protocol to screen for substrates of this particular ubiquitin ligase. In a neuronal cell system, we find direct ubiquitination by Ube3a of three proteasome-related proteins Rpn10, Uch-L5, and CG8209, as well as of the ribosomal protein Rps10b."
  full_text_unavailable: true
- id: PMID:26705243
  title: Specific protein homeostatic functions of small heat-shock proteins increase lifespan.
  findings:
  - statement: Hsp26 is one of four classical Drosophila sHSPs highly induced after heat shock.
    supporting_text: The four classical small HSPs (HSP22, HSP23, HSP26, and HSP27) were all highly induced after a heat shock
  - statement: Overexpression of Hsp26 increases luciferase refolding in S2 cells.
    supporting_text: overexpression of the classical small HSPs (HSP23, HSP26, and HSP27) increased luciferase refolding
  - statement: sHSP-mediated refolding requires functional HSP70 machinery.
    supporting_text: our results strongly suggest that the refolding capacity of D. melanogaster HSP27 and CG14207 is partially dependent on an intact HSP70 machine
  - statement: Among Drosophila small HSPs, CG14207 is a specialized HSP70-dependent refolder and HSP67BC a specialized HSP70-independent anti-aggregase, defining the functional poles against which classical members such as Hsp26 sit.
    supporting_text: We identified CG14207 as a novel and potent small HSP member that exclusively assisted in HSP70-dependent refolding of stress-denatured proteins. Furthermore, we report that HSP67BC, which has no role in protein refolding, was the most effective small HSP preventing toxic protein aggregation in an HSP70-independent manner.
- id: PMID:32437379
  title: Small heat shock proteins determine synapse number and neuronal activity during development.
  findings:
  - statement: Hsp23 and Hsp26 physically interact in adult head extracts.
    supporting_text: These results confirm the physical interaction between sHSP23 and sHSP26
  - statement: Both sHSPs accumulate in synaptic buttons at the larval NMJ.
    supporting_text: The confocal images show an accumulation and colocalization of sHSP23 and sHSP26 throughout the NMJ but particularly intense in the synaptic buttons
  - statement: The balance of Hsp23 and Hsp26 modulates synapse number and neuronal activity.
    supporting_text: we suggest that sHSP23 and sHSP26 together form a complex that promotes synapse formation in presynaptic neurons
- id: PMID:38944040
  title: Next-generation Drosophila protein interactome map and its functional implications.
  findings:
  - statement: Large-scale Drosophila interactome study documenting Hsp26-Hsp23 physical interaction.
    supporting_text: "The network contains 32,668 interactions among 3,644 proteins, organized into 632 clusters representing putative functional modules."
- id: PMID:30400176
  title: Developmental Expression and Functions of the Small Heat Shock Proteins in Drosophila.
  findings:
  - statement: |-
      sHSPs prevent nonspecific aggregation of substrate proteins in an ATP-independent
      manner, confirming Hsp26 acts as an ATP-independent holdase rather than an
      ATP-dependent foldase.
    supporting_text: |-
      They play a crucial role in the maintenance of protein homeostasis, preventing nonspecific aggregation of the substrate protein in an ATP-independent manner
    reference_section_type: INTRODUCTION
  - statement: |-
      Hsp26 is highly expressed in early stage embryos (4-6 h after egg laying) and
      enriched in testis and ovaries, indicating developmentally regulated,
      stress-independent expression.
    supporting_text: |-
      Hsp26, Hsp67Ba, Hsp23, and Hsp27 are highly expressed in early stage embryos (4–6 h after egg laying, AEL)
    reference_section_type: RESULTS
  - statement: |-
      Hsp26 mRNA is present in nurse cells and later in the oocyte during oogenesis.
    supporting_text: |-
      Hsp26 mRNA is present in nurse cells and later in the oocyte
    reference_section_type: RESULTS
  - statement: |-
      Hsp26 is expressed in male germline cells, including primary spermatocytes and
      some spermatogonia and spermatids, via dedicated spermatocyte-specific regulatory
      elements.
    supporting_text: |-
      Hsp26 is expressed in germline cell types including primary spermatocytes, and in some spermatogonia and spermatids
    reference_section_type: RESULTS
  - statement: |-
      Ubiquitous RNAi knockdown of six Drosophila sHsps including Hsp26 caused
      lethality, indicating an essential developmental role for the sHsp family.
    supporting_text: |-
      ubiquitous RNAi knockdown of six Drosophila sHsps (Hsp23, Hsp26, Hsp27, CG4461, l(2)efl, and CG14207) resulted in lethality
    reference_section_type: INTRODUCTION
- id: PMID:39353569
  title: Moesin contributes to heat shock gene response through direct binding to the Med15 subunit of the Mediator complex in the nucleus.
  findings:
  - statement: |-
      In Med15-silenced ovaries, Hsp26 (together with Hsp70Ba) was an exception:
      unlike most surveyed Hsp genes, its basal expression was not significantly
      reduced, suggesting Hsp26 has a distinct/compensatory basal regulatory
      architecture.
    supporting_text: |-
      We then measured the activity of Hsp genes in Med15-silenced ovaries and found that, with the exception of the Hsp70Ba and Hsp26 genes, the expression of the examined Hsp genes was significantly reduced, however to varying degrees compared to that of the WT
    reference_section_type: RESULTS
- id: file:DROME/Hsp26/Hsp26-deep-research-falcon.md
  title: Falcon deep research report on Drosophila melanogaster Hsp26 (CG4183, P02517)
  findings:
  - statement: |
      Hsp26 is a small heat shock protein of the alpha-crystallin/HSP20 family that
      functions primarily as an ATP-independent holdase chaperone, binding
      misfolded/unfolding proteins to prevent aggregation and keeping them
      folding-competent for downstream ATP-dependent chaperone systems.
    supporting_text: |-
      They typically assemble as **dimers** (ACD-mediated) that serve as building blocks for **dynamic oligomers**, and they function primarily as **ATP-independent “holdase” chaperones**: they bind misfolded/unfolding proteins to prevent nonspecific aggregation and keep clients in a folding-competent state for subsequent refolding or processing by ATP-dependent chaperone systems.
    reference_section_type: OTHER
  - statement: |
      In comparative in vitro assays, Hsp26 inhibits heat-induced aggregation of
      citrate synthase and luciferase but is less efficient than Hsp22/Hsp27,
      requiring approximately 5-fold molar excess to match their suppression.
    supporting_text: |-
      Hsp26 required approximately a **5-fold molar excess** to reach suppression levels achieved by Hsp22/Hsp27 near 1:1 ratios in citrate synthase aggregation assays.
    reference_section_type: OTHER
  - statement: |
      In a luciferase refolding paradigm, recovery in the presence of Hsp26 was
      35.7% +/- 3.5%, versus 54.9% +/- 2.8% (Hsp22) and 42.8% +/- 3.3% (Hsp27),
      consistent with the holdase model feeding ATP-dependent refolding.
    supporting_text: |-
      luciferase activity recovery after denaturation in the presence of Hsp26 was **35.7% ± 3.5%**, compared with **54.9% ± 2.8%** (Hsp22) and **42.8% ± 3.3%** (Hsp27).
    reference_section_type: OTHER
  - statement: |
      Hsp26 is predominantly cytosolic/cytoplasmic with a granular staining pattern
      distinct from Hsp23, with a minor fraction also detected in the nuclear matrix
      of embryos and S2 cells.
    supporting_text: |-
      Hsp26 is **predominantly cytosolic/cytoplasmic**, with a **granular cytosolic staining pattern** distinct from Hsp23; a **minor fraction** was also detected in the **nuclear matrix** of embryos and S2 cells.
    reference_section_type: OTHER
  - statement: |
      Hsp26 exists as multiple molecular forms (reported as five isoforms), with
      three phosphorylatable serines and observed ubiquitination in fly neurons.
    supporting_text: |-
      Hsp26 exists as multiple molecular forms: reports summarize the presence of **five isoforms**, and note that **three serines can be phosphorylated** and that **ubiquitination** of Hsp26 has been observed in fly neurons.
    reference_section_type: OTHER
  - statement: |
      Hsp26 is developmentally regulated, highly expressed in early embryos (4-6 h
      after egg laying) and enriched in ovaries and testes.
    supporting_text: |-
      It is described as highly expressed in **early embryos (4–6 h after egg laying)**, and enriched in **ovaries** and **testes**.
    reference_section_type: OTHER
  - statement: |
      Ubiquitous RNAi knockdown of multiple sHsps including Hsp26 caused lethality,
      supporting an indispensable contribution to proteostasis and tissue robustness
      during development.
    supporting_text: |-
      ubiquitous RNAi knockdown of multiple sHsps including Hsp26 caused **lethality**, supporting that sHsps (including Hsp26) contribute indispensably to proteostasis and tissue robustness during development.
    reference_section_type: OTHER
  - statement: |
      In Med15-silenced ovaries, Hsp26 (and Hsp70Ba) was an explicit exception that
      did not show the basal expression reduction seen for other Hsp genes,
      indicating distinct basal regulatory control.
    supporting_text: |-
      **Hsp26 (and Hsp70Ba)** were explicit **exceptions** and did not show the basal reduction observed for other Hsp genes under those conditions.
    reference_section_type: OTHER
