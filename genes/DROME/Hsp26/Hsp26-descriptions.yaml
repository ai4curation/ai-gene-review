- source: Alliance_Automated
  text: Enables myosin binding activity and unfolded protein holdase activity. Involved
    in several processes, including cold acclimation; determination of adult lifespan;
    and protein refolding. Located in cytosol. Is expressed in several structures,
    including Malpighian tubule primordium; embryonic/larval midgut primordium; ganglia;
    germline cell; and gut section. Human ortholog(s) of this gene implicated in adult-onset
    myofibrillar myopathy 2A; cataract 16 multiple types; cataract 9 multiple types;
    dilated cardiomyopathy 1II; and infantile-onset myofibrillar myopathy-2B. Orthologous
    to human CRYAA (crystallin alpha A) and CRYAB (crystallin alpha B).
  source_type: automated
  url: https://flybase.org/reports/Hsp26.html
