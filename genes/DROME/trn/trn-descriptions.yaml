descriptions:
- source: Alliance_Imported
  text: tartan (trn) encodes a transmembrane leucine-rich repeat protein. It is closely
    related to caps and genetically interacts with it. Together they regulate embryonic
    motor axon guidance and innervation of antennal lobe glomeruli by olfactory sensory
    axons. The product of trn is a substrate for the product of Ptp52F and genetically
    interacts with it to regulate guidance of SNa motor axons.
  source_type: curated
  url: https://flybase.org/reports/trn.html
  source_id: FB:FBgn0010452
