- source: Alliance_Automated
  text: Predicted to enable signaling receptor activity. Involved in branch fusion,
    open tracheal system; larval salivary gland morphogenesis; and motor neuron axon
    guidance. Is expressed in several structures, including eye photoreceptor cell;
    gut section; head epidermis primordium; imaginal disc; and larval optic anlage.
    Orthologous to human LRRN2 (leucine rich repeat neuronal 2).
  source_type: automated
