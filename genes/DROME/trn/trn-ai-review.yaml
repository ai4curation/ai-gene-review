- term:
    id: GO:0008045
    label: motor neuron axon guidance
  evidence_type: IMP
  original_reference_id: PMID:18817735
  qualifier: involved_in
  review:
    summary: >-
      Well-supported experimental annotation. Trn was recovered in a cell-surface-molecule
      screen for synaptic target selection, and embryonic loss-of-function analysis shows
      that Trn and Caps act largely redundantly to guide and target motor axons: trn caps
      double mutants have stronger motor-axon phenotypes than trn alone, and neuronal Trn
      expression rescues the phenotype. This is a core neural function of trn.
    action: ACCEPT
    reason: >-
      Direct genetic evidence (loss of function, double-mutant enhancement, and cell-type-
      specific rescue) supports involvement of trn in motor neuron axon guidance/targeting,
      acting redundantly with its paralog caps.
    supported_by:
    - reference_id: PMID:18817735
      supporting_text: >-
        If so, Trn and Caps might function in a redundant manner to regulate axon guidance and
        to label muscles as axonal targets.
    - reference_id: PMID:18817735
      supporting_text: >-
        trn caps double mutant embryos have stronger motor axon phenotypes than trn single
        mutants
    - reference_id: PMID:18817735
      supporting_text: >-
        The trn caps phenotype was rescued to ~20% penetrance for both ISNb and SNa phenotypes
