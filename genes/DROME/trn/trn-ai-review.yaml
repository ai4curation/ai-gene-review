proposed_new_terms: []
suggested_questions:
- question: >-
    What is the direct molecular binding partner of the Tartan LRR ectodomain - does it bind
    homophilically to Trn/Caps, heterophilically to a shared receptor, or to a distinct
    ligand?
- question: >-
    Is any part of Tartan's function dependent on its short cytoplasmic tail, or is the
    extracellular LRR domain fully sufficient across all developmental contexts?
suggested_experiments:
- description: >-
    Cell aggregation / bead-binding assays with S2 cells expressing Trn (and Caps) to test
    directly for homophilic vs heterophilic adhesion and to identify the binding partner.
  hypothesis: >-
    Trn mediates cell-cell adhesion by binding a partner (Caps, Trn, or a shared receptor) on
    apposed cell surfaces.
- description: >-
    Domain-swap and cytoplasmic-tail-truncation rescue experiments across imaginal-disc
    affinity, axon-targeting, and tracheal contexts to define the minimal functional unit of
    Trn.
  hypothesis: >-
    The extracellular LRR domain is sufficient for Trn function in most or all contexts, with
    the short cytoplasmic tail largely dispensable.
