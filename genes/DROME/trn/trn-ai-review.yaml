- term:
    id: GO:0007436
    label: larval salivary gland morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:19064711
  qualifier: involved_in
  review:
    summary: >-
      Loss-of-function analysis of caps and tartan mutants in a study of salivary gland
      tubulogenesis supports a role for trn in salivary gland morphogenesis. This is a
      specific developmental context for a pleiotropic LRR adhesion protein rather than
      its core molecular activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The experimental (IMP) annotation is supported by the cited study, which identified
      caps/trn as LRR adhesion hits and analysed mutant phenotypes. It is a genuine but
      context-specific developmental role, so it is retained as non-core rather than as a
      core function.
    supported_by:
    - reference_id: PMID:19064711
      supporting_text: >-
