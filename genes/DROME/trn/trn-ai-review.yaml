- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: file:DROME/trn/trn-uniprot.txt
  qualifier: located_in
  review:
    summary: >-
      Trn is a single-pass type I transmembrane protein (N-terminal signal peptide, one
      predicted transmembrane helix, extracellular LRR ectodomain), consistent with residence
      in the plasma membrane where it engages neighbouring cell surfaces. UniProt carries an
      ARBA electronic annotation to the parent term cell periphery (GO:0071944); plasma
      membrane is the specific compartment for this cell-surface adhesion molecule. Added as a
      NEW annotation to capture the localization underlying trn's adhesion function.
    action: NEW
    reason: >-
      Localization to the plasma membrane is not present in the GOA set but is strongly implied
      by the protein architecture and by the existing cell-periphery electronic annotation, and
      it is required to represent where trn's cell-cell adhesion activity occurs.
    supported_by:
    - reference_id: file:DROME/trn/trn-uniprot.txt
      supporting_text: >-
        C:cell periphery
    - reference_id: file:DROME/trn/trn-uniprot.txt
      supporting_text: >-
        Transmembrane helix
