  label: Drosophila melanogaster
description: >-
  Tartan (Trn) is a single-pass type I transmembrane protein of the leucine-rich-repeat
  (LRR) cell-surface family, closely related to and largely redundant with its paralog
  Capricious (Caps). Its extracellular region is an LRR horseshoe (roughly ten LRR units
  capped by an LRR C-terminal cysteine-rich domain) displayed at the plasma membrane,
  followed by a single transmembrane helix and a short cytoplasmic tail. Trn functions as a
  cell-surface adhesion/affinity molecule that mediates cell-cell recognition and helps
  establish differences in affinity between neighbouring cell populations, and it acts
  largely through its extracellular LRR domain. Through this activity it contributes to the
  formation of affinity boundaries between cell groups in imaginal discs, to selective
  recognition of targets during motor and photoreceptor axon guidance, and to epithelial
  and tracheal morphogenesis, where it provides a permissive substrate for migrating cells.
  The Trn and Caps LRR domains are interchangeable and are thought to engage a common
  partner/receptor on apposed cells; the precise molecular binding partners of Trn remain
  incompletely defined.
existing_annotations:
- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic (IBA) call from GO_Central propagating a signaling-receptor molecular
      function across an LRR family that also contains bona fide signaling receptors
      (e.g. human TLR3 and CD180). For tartan there is no evidence of transmembrane signal
      transduction; the protein acts as a cell-surface LRR adhesion/affinity molecule and
      exerts its function through its extracellular domain, so a more informative and better
      supported molecular function is cell-cell adhesion mediator activity.
    action: MODIFY
    reason: >-
      Trn's molecular function is that of a cell-surface LRR adhesion molecule rather than a
      classical signal-transducing receptor. Its role maps to the extracellular LRR domain,
      and it is repeatedly described as a candidate homophilic/heterophilic adhesion receptor
      whose LRR domain is interchangeable with that of Caps and engages a common partner. The
      IBA 'signaling receptor activity' is over-broad (inherited from a TLR-containing family);
      cell-cell adhesion mediator activity captures the evidence more precisely.
    proposed_replacement_terms:
    - id: GO:0098632
      label: cell-cell adhesion mediator activity
