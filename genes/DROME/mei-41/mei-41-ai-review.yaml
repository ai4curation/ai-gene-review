core_functions:
- description: MEI-41 (ATR), in complex with mus304 (ATRIP), acts as a serine/threonine protein kinase
    that senses replication stress and processed DNA breaks and phosphorylates checkpoint effectors (Grapes/Chk1,
    H2Av) to arrest the cell cycle before mitosis.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0000077
    label: DNA damage checkpoint signaling
  - id: GO:0033314
    label: mitotic DNA replication checkpoint signaling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0070310
    label: ATR-ATRIP complex
  supported_by:
  - reference_id: PMID:22796626
    supporting_text: Similar to the Drosophila mei-41/ATR and grp/Chk1 mutants, embryos of the Claspin
      mutant showed defects in checkpoint activation
  - reference_id: PMID:10733527
    supporting_text: We show that several Drosophila homologs of checkpoint genes, mei-41, grapes, and
      14-3-3epsilon, regulate a DNA damage checkpoint in the developing eye.
- description: MEI-41 kinase activity promotes completion of homologous recombination repair of double-strand
    breaks, particularly the late annealing steps of synthesis-dependent strand annealing.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0045003
    label: double-strand break repair via synthesis-dependent strand annealing
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17194776
    supporting_text: We found that mei-41 mutants are defective in completing the later steps of homologous
      recombination repair, but have no defects in end-joining repair.
suggested_questions:
- question: Which MEI-41 substrates, beyond Grapes/Chk1 and H2Av, mediate its checkpoint-independent contribution
    to the late annealing steps of SDSA?
- question: Does mus304 (ATRIP) recruit MEI-41 to RPA-coated ssDNA in Drosophila as in vertebrates, and
    is Drosophila TopBP1 (mus101) the activator of the complex?
suggested_experiments:
- hypothesis: MEI-41 kinase activity, not only its scaffold role, is required for SDSA completion.
  description: Compare a kinase-dead mei-41 transgene with wild-type rescue in the P-element gap-repair
    SDSA assay in a grp lok double-mutant background to separate checkpoint-independent repair roles.
