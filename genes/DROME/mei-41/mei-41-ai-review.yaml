id: Q9VXG8
gene_symbol: mei-41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: mei-41 encodes the Drosophila ortholog of ATR (ataxia telangiectasia and Rad3-related), a
  very large PI3K-related protein kinase (PIKK) of the ATM subfamily with HEAT-repeat, FAT, kinase and
  FATC domains. Together with its partner mus304 (ATRIP), MEI-41 senses single-stranded DNA at stalled
  replication forks and processed double-strand breaks and phosphorylates SQ/TQ substrates, including
  the effector kinase Grapes (Chk1) and histone H2Av, to activate checkpoint signaling. It enforces the
  DNA replication checkpoint that lengthens the late syncytial nuclear cycles of the embryo, the G2-M
  DNA damage checkpoint in larval imaginal discs and neuroblasts, and meiotic checkpoints during oogenesis.
  MEI-41 also promotes completion of homologous recombination repair (synthesis-dependent strand annealing),
  meiotic crossing over and, redundantly with ATM (tefu), telomere protection against end-to-end fusion.
