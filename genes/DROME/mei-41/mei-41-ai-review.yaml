- term:
    id: GO:0000706
    label: meiotic DNA double-strand break processing
  evidence_type: IDA
  original_reference_id: PMID:22024169
  qualifier: involved_in
  review:
    summary: The cited study shows MEI-41 is required for meiotic checkpoint activity and, with ATM, phosphorylates
      H2Av at meiotic DSBs; the term describes 5'-3' exonucleolytic resection.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0000706 is defined as the exonucleolytic resection of meiotic DSB ends. ATR is a signaling
      kinase that acts at processed breaks (it phosphorylates H2Av and enforces the meiotic checkpoint)
      rather than a resection enzyme. The curator read the full text, so the annotation is kept, but it
      overstates MEI-41's role; meiotic DSB repair signaling is better captured by the checkpoint and
      recombination terms.
    supported_by:
    - reference_id: PMID:22024169
      supporting_text: ATR mutant analysis indicated that it is required for checkpoint activity, whereas
        ATM may not be. Both kinases phosphorylate H2AV
