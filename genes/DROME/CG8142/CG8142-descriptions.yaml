- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and DNA
    binding activity. Predicted to contribute to DNA clamp loader activity. Predicted
    to be involved in DNA repair and DNA-templated DNA replication. Part of Elg1 RFC-like
    complex. Is expressed in several structures, including central brain primordium;
    embryonic central brain neurons; embryonic/larval midgut; ganglia; and surface
    glial cell. Human ortholog(s) of this gene implicated in neuromuscular disease.
    Orthologous to human RFC4 (replication factor C subunit 4).
