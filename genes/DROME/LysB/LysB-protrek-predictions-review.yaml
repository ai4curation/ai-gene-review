  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 15.30) and absent from GOA. This review establishes that LysB is a midgut
      digestive lysozyme, not an immune effector: it is expressed in the digestive tract, absent from
      fat body and hemocytes, and repressed rather than induced by systemic infection. ProTrek's free-text
      channel independently returns 'The main role of this lysozyme is in digestion'. Correct, novel,
      and it corrects the emphasis of the existing ISS annotation.
    supported_by:
    - reference_id: PMID:8159165
      supporting_text: >-
        LysB is expressed in the midgut where it functions in digestion of bacteria from food
