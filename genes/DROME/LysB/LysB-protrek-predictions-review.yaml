id: Q08694
gene_symbol: LysB
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster (Fruit fly)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Drosophila Lysozyme B, a secreted c-type lysozyme that acts
  in gut digestion rather than in systemic immunity. Rank 1 is digestion - this review's core biological
  process, and absent from GOA, whose only process term is defense response to Gram-negative bacterium
  by ISS - and rank 2 is the exact enzymatic activity. Getting the digestive rather than immune framing
  first is a real discrimination: GO-GPT went the other way and its immune-response calls were scored
  PLI in that evaluation. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 less precise
  (LSP).
