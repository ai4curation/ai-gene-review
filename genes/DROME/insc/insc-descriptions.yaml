- source: Alliance_Automated
  text: Enables cytoskeletal adaptor activity. Involved in several processes, including
    Malpighian tubule tip cell differentiation; apical protein localization; and nervous
    system development. Located in apical cortex. Part of raps-insc complex. Is expressed
    in several structures, including anlage in statu nascendi; gut section; head epidermis
    primordium; midgut primordium; and somatic precursor cell. Used to study Charcot-Marie-Tooth
    disease type 2. Orthologous to human INSC (INSC spindle orientation adaptor protein).
  source_type: automated
