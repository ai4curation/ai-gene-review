descriptions:
- source: Alliance_Imported
  text: inscuteable (insc) encodes an adaptor protein required for asymmetric cell
    division. It interacts with the microtubule binding protein encoded by mud and
    the adaptor encoded by pins. It also binds to the apical complex proteins encoded
    by baz, par-6 and aPKC and may recruit microtubule binding proteins to the apical
    cell cortex to induce apical-basal spindle orientation.
  source_type: curated
  url: https://flybase.org/reports/insc.html
  source_id: FB:FBgn0011674
