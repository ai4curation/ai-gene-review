  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly on insc; shows lineage/stage-dependent requirement of insc
      for sibling cell fate specification via ACD feeding differential Notch. PubMed-verified.
- id: PMID:22171003
  title: Inscuteable and NuMA proteins bind competitively to Leu-Gly-Asn repeat-enriched
