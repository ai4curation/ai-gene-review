  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text states Galphai-bound Pins (GoLoco1) recruits Insc to the
      apical cortex; supports apical localization and the Insc-Pins(raps) relationship.
