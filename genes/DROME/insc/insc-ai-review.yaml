- id: PMID:19088087
  title: Ancestry-independent fate specification and plasticity in the developmental
    timing of a typical Drosophila neuronal lineage.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: GOA reference for insc regulation of asymmetric cell division and
      regulation of nervous system development, but the cached abstract and full text
      concern the T-box gene mid in the RP2/sib lineage and do not describe insc experiments.
