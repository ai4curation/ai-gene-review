  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Insc nucleates the apical complex; required for protein localization,
      spindle orientation, and (with Staufen) prospero RNA localization; apical colocalization.
      PubMed-verified.
- id: PMID:9888987
  title: Identification of Miranda protein domains regulating asymmetric cortical
    localization, cargo binding, and cortical release.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Miranda-focused study that documents Inscuteable among the apically
      localized proteins in interphase neuroblasts (apical cortex localization); notes
      Insc uniquely stays apical while other factors move basally. PubMed-verified.
core_functions:
- description: >-
    Cytoskeletal adaptor/scaffold activity - Inscuteable bridges the apical Par polarity
    complex (Bazooka/Par3) to the Partner-of-Inscuteable (Pins/raps, the Drosophila LGN
    ortholog)-Galphai spindle-tethering machinery, nucleating an apical protein complex at
    the apical cell cortex. This bridging couples apical-basal cell polarity to mitotic
    spindle orientation and is the molecular basis of Insc function in asymmetric division.
  supported_by:
  - reference_id: PMID:22171003
    supporting_text: the adaptor Inscuteable (Insc) bridges between Par3 and the spindle
      tethering machinery assembled on
  - reference_id: PMID:8626022
    supporting_text: shows certain features common to a family of putative cytoskeletal
      associated proteins
  molecular_function:
    id: GO:0008093
    label: cytoskeletal adaptor activity
  directly_involved_in:
  - id: GO:0055059
    label: asymmetric neuroblast division
  - id: GO:0000132
    label: establishment of mitotic spindle orientation
  - id: GO:0045176
    label: apical protein localization
  locations:
  - id: GO:0045179
    label: apical cortex
  in_complex:
    id: GO:1990499
    label: raps-insc complex
proposed_new_terms: []
suggested_questions:
- question: What is the direct mechanistic basis for the insc mutant susceptibility
    to intestinal Vibrio cholerae infection (PMID:19046341) - is it an indirect consequence
    of altered asymmetric division/renewal in the gut epithelium, or a distinct role?
- question: Are the somatic-muscle and Malpighian-tubule phenotypes of insc(nem) direct
    requirements for Insc in those precursor divisions, or secondary to CNS/PNS defects?
suggested_experiments:
- hypothesis: The Insc-Par3 and Insc-Pins interactions are separable arms of a single
    adaptor bridge, each required for a distinct step of asymmetric division.
  description: Generate structure-guided separation-of-function alleles disrupting
    the Insc-Par3 versus Insc-Pins interfaces and assay each for apical complex assembly,
    spindle orientation, and basal determinant segregation in neuroblasts.
  experiment_type: structure-function mutagenesis and in vivo imaging
- hypothesis: The infection-susceptibility phenotype reflects an insc requirement in
    asymmetric division/renewal of the adult gut epithelium rather than a direct immune
    function.
  description: Perform tissue-specific insc knockdown in adult intestinal stem cells
    during V. cholerae challenge and score epithelial integrity, cell death, and survival.
  experiment_type: conditional RNAi and infection assay
