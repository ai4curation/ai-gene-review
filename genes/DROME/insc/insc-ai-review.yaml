    in the developing central nervous system.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Live-imaging study of neuroblast spindle rotation and anaphase spindle
      asymmetry directing ACD; supports the spindle-orientation role. PubMed-verified
      title/abstract match.
- id: PMID:10625542
  title: Multiple signalling pathways establish cell fate and cell number in Drosophila
    malpighian tubules.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Malpighian tubule tip-cell study (wingless/Notch/Numb). Cached abstract
      does not name insc; the IMP presumably rests on full-text data not available
      here. Relevance to insc plausible (asymmetric tip-cell division; insc expressed
      in Malpighian tubules) but unverified.
- id: PMID:10903176
  title: Mechanism of glia-neuron cell-fate switch in the Drosophila thoracic neuroblast
    6-4 lineage.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Shows insc (and miranda) mutations disrupt Prospero behavior and
      the glia-neuron fate switch in NB6-4T; supports cortical/ACD role. Abstract explicitly
      names inscuteable.
- id: PMID:10973066
  title: Genetics of heart development.
  findings: []
  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: Cited (TAS) for insc sensory organ development, but this is a review
      of cardiac/heart development in zebrafish and Drosophila; the abstract does not
      mention inscuteable or sensory organs. Appears to be a wrong/mis-applied citation
      for this annotation; the sensory-organ-development role itself is real but should
      be sourced to a primary pI/SOP study (e.g. PMID:12526793).
- id: PMID:11707517
  title: Inscuteable-dependent apical localization of the microtubule-binding protein
    Cornetto suggests a role in asymmetric cell division.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly on insc; documents apical-cortex localization (interphase-metaphase),
      the Insc-Cornetto interaction (2-hybrid), and inscuteable-dependent apical protein
      localization. PubMed-verified.
- id: PMID:12526793
  title: Apical complex genes control mitotic spindle geometry and relative size of
    daughter cells in Drosophila neuroblast and pI asymmetric divisions.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Apical-complex (incl. insc pathway) control of spindle geometry and
      daughter-cell size in NB and pI (sensory organ precursor) divisions; supports
      ACD and sensory-organ roles. PubMed-verified.
- id: PMID:16377571
