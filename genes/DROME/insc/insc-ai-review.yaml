gene_symbol: insc
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: >-
  Inscuteable (Insc) is a Drosophila cytoskeletal adaptor/scaffold protein that couples
  apical-basal cell polarity to mitotic-spindle orientation during asymmetric cell
  division (ACD) in neural progenitors (neuroblasts) and sensory-organ precursors (pI
  cells). The protein has an N-terminal disordered region, a central ARM-like repeat
  region and a conserved Inscuteable C-terminal (Insc_C) domain, but no catalytic domain.
  Insc localizes to the apical cell cortex from interphase through metaphase, where it
  acts as a molecular bridge linking the Par complex (Bazooka/Par3-atypical PKC) to the
  Partner-of-Inscuteable (Pins/raps, the Drosophila LGN ortholog)-Galphai spindle-tethering
  machinery. Through this bridging activity Insc nucleates an apical protein complex that
  (i) orients and rotates the mitotic spindle along the apical-basal axis, (ii) directs
  apical localization of partner proteins, and (iii) is required for basal segregation of
  cell-fate determinants (Numb, Prospero, Miranda, Staufen) and prospero mRNA into the
  ganglion mother cell. Insc is thereby required for correct neuroblast sibling-cell fate
  specification, the glia-neuron cell-fate switch, and normal CNS and peripheral nervous
  system development; loss of insc (also known as nem) additionally perturbs somatic muscle
  and other precursor populations that rely on asymmetric division.
