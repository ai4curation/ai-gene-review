id: Q9VBC7
gene_symbol: amon
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Amontillado (AMON, dPC2) is the Drosophila ortholog of neuroendocrine prohormone convertase 2, a soluble
  subtilisin/kexin-family (peptidase S8) serine endopeptidase of the regulated secretory pathway. It is made as
  a signal-peptide- and prodomain-containing zymogen, and its maturation and secretion as an active enzyme require
  the neuroendocrine helper protein 7B2 and an insect-cell processing context. In peptidergic neurons of the brain
  and ventral nerve cord, in corpora cardiaca endocrine cells and in midgut enteroendocrine cells it cleaves neuropeptide
  and peptide-hormone precursors at basic sites; it is required for production of mature adipokinetic hormone (and
  hence normal circulating sugar levels) and of many other neurohemal and enteroendocrine peptides. Loss of amon
  impairs peptide-dependent hatching, larval molting, wandering and pupal development.
