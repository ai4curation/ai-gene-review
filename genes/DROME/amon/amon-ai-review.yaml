id: Q9VBC7
gene_symbol: amon
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Amontillado is the Drosophila PC2-like serine endopeptidase that matures neuropeptide and
  peptide-hormone precursors in the secretory pathway. Productive maturation and secretion require the
  helper protein 7B2 and an insect-cell processing context. Its substrates include the adipokinetic hormone
  precursor, linking peptide processing to sugar homeostasis, developmental transitions and behavior.
