  review:
    action: UNDECIDED
    summary: Membrane association is not established by secretion or a signal peptide.
    reason: The exact protein has a cleavable N-terminal signal peptide and a soluble secretory convertase
      architecture. The direct experiment establishes secretion; it does not distinguish transient membrane
      association or provide an anchor. The inherited membrane assertion therefore needs target-specific
      support.
