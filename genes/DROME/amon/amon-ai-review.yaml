        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep node spanning membrane-anchored furin, KEX2 and PCSK7 as well as soluble PC1/PC2; generic
          membrane fits the anchored members directly but is only peripheral, if at all, for the soluble PC2 lineage.
      - source_id: UniProtKB:P16519
        source_label: PCSK2
        source_status: UNRESOLVED
        comment: Human PC2, in the same PTHR42884:SF13 subfamily, is among the donors, so membrane association is
          grounded for at least one PC2; no fly test exists.
