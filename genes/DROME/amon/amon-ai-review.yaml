  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Pupal and larval developmental progression depends on amon.
    reason: Conditional rescue establishes stage-specific requirements for developmental transitions mediated
      by peptide processing.
    supported_by:
    - reference_id: PMID:19559693
      supporting_text: amon is required during pupal development for head eversion, leg and wing disc
        extension, and abdominal differentiation.
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: EXP
  original_reference_id: PMID:10749852
  qualifier: enables
  review:
    action: ACCEPT
    summary: Amontillado is a catalytically active prohormone-processing serine endopeptidase.
    reason: Activity appears when fly PC2 matures and is secreted from S2 cells with 7B2. The active-site-mutant
      rescue and mature-hormone loss experiments independently connect serine proteolysis to biological
      function.
    supported_by:
    - reference_id: PMID:10749852
      supporting_text: when dPC2 and either d7B2 or r7B2 were coexpressed in Drosophila S2 cells, abundant
        immunoreactive dPC2 was secreted into the medium, coincident with the appearance of PC2 activity.
    - reference_id: PMID:20523747
      supporting_text: mass spectrometric profiling shows that the production of mature AKH is inhibited
        in amon mutants.
