- term:
    id: GO:0045464
    label: R8 cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:28853393
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: R8 subtype specification is an indirect, RNAi-only consequence of presumed ligand processing in neighbouring
      R7 cells.
    reason: Amon RNAi reduces pale ommatidia, and an amon reporter is enriched in pale R7. The authors propose that
      amon processes BMP/Activin ligands in R7, which then signal to R8; ligand cleavage by amon was not shown.
      Amon therefore at most supplies a ligand-maturation step in a different cell, so 'involved in R8 cell fate
      specification' overstates its participation. The curator's IMP is kept visible but flagged as over-annotation.
    supported_by:
    - reference_id: PMID:28853393
      supporting_text: We propose a model where pale R7-specific ligand processing by Amon and possibly additional
        factors instructs non-redundant signaling by two arms of the TGFβ family to specify pale R8 subtypes
