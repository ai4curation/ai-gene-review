  review:
    action: UNDECIDED
    summary: Generic membrane association is inherited from a deep convertase node and is not established for amon.
    reason: This IBA is placed at PTN002451026, a deep subtilisin/kexin node whose donors are dominated by membrane-anchored
      convertases (furin, KEX2, PCSK7) but also include human PCSK2. Amon has a signal peptide and no transmembrane
      segment, and the only fly localisation data show secretion. Peripheral association of PC2 with secretory-granule
      membranes is reported for mammals but not tested in fly, so neither acceptance nor removal is warranted on
      current evidence.
    supported_by:
