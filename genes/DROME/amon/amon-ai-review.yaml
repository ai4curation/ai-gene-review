  review:
    action: ACCEPT
    summary: Amontillado is a catalytically active prohormone-processing serine endopeptidase.
    reason: 'Direct fly evidence: active dPC2 appears in S2-cell medium with 7B2, a catalytic-histidine mutant fails
      to rescue hatching, and mature AKH is lost in mutants. The IBA comes from PTN002451026, the subtilisin/kexin
