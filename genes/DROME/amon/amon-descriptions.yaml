- source: Alliance_Automated
  text: Enables serine-type endopeptidase activity. Involved in several processes,
    including R8 cell fate specification; hatching behavior; and larval wandering
    behavior. Located in extracellular region. Is expressed in several structures,
    including adult head; ganglia; gut section; larval CNS neuron; and presumptive
    embryonic/larval system. Human ortholog(s) of this gene implicated in myocardial
    infarction and type 2 diabetes mellitus. Orthologous to human PCSK2 (proprotein
    convertase subtilisin/kexin type 2).
