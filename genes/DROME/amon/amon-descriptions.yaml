descriptions:
- source: UniProt
  text: Serine endopeptidase which is involved in the processing of hormone and other
    protein precursors at sites comprised of pairs of basic amino acid residues (PubMed:10749852,
    PubMed:20523747, PubMed:21138435). Required during embryonic and larval development,
    probably by proteolytically processing peptide hormones involved in hatching,
    larval growth and larval molting (PubMed:12586710). Required for the processing
    and activation of Akh which maintains normal hemolymph sugar levels (PubMed:20523747).
    Has been shown in one study to be required for processing of sli into slit N-product
    and slit C- product in the embryo which is necessary for lateral transverse muscle
    elongation but has been shown in another study not to be required for sli cleavage
    (PubMed:27628033, PubMed:32994163). Required for larval hatching (PubMed:10436051).
    Also required for normal larval wandering behavior which occurs prior to pupariation
    (PubMed:21138435). Required during pupal development for head eversion, leg and
    wing disk extension, and abdominal differentiation (PubMed:19559693). Required
    during eye development for R8 photoreceptor cell specification by regulating processing
    of ligands required for the BMP and activin signaling pathways (PubMed:28853393).
