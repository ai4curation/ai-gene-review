- source: Alliance_Imported
  text: amontillado (amon) encodes a member of the Prohormone Convertase (PC) family
    of proteolytic enzymes. PCs generally recognize conserved basic amino acid sequences
    within protein precursors to direct catalysis of specific cleavage. amon product
    directly cleaves sli protein and may also target the propeptide encoded by Akh.
    It is also required for the production of bioactive neuropeptide hormones (e.g.
    those encoded by Hug, Crz, Ms, Capa and sNPF).
  source_type: curated
