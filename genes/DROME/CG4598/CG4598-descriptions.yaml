descriptions:
- source: UniProt
  text: Key enzyme of fatty acid beta-oxidation. Able to isomerize both 3-cis (3Z)
    and 3-trans (3E) double bonds into the 2-trans (2E) form in a range of enoyl-CoA
    species, with a preference for (3Z)-enoyl- CoAs over (3E)-enoyl-CoAs. The catalytic
    efficiency of this enzyme is not affected by the fatty acyl chain length.
