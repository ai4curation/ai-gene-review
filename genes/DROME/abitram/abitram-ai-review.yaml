id: Q9VFR1
gene_symbol: abitram
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7227
  label: Drosophila melanogaster
description: Drosophila melanogaster Abitram (encoded by abitram / CG9288) is an uncharacterized 214-amino-acid
  (~23.8 kDa) member of the eukaryotic ABITRAM (Simiate) protein family carrying the conserved GCV_H/Abitram
  single-hybrid-motif domain followed by a short C-terminal disordered charged tail, and encoded by a
  transcript harboring an evolutionarily conserved dipteran upstream open reading frame (CPuORF). Comparative
  evidence from mammalian ABITRAM and hemipteran insect (Gerris buenoi) Simiate RNAi phenotypes supports
  conserved roles in monomeric and filamentous actin binding, regulation of actin filament polymerization,
  and nuclear localization.
references:
- id: PMID:24349419
  title: Identification and characterisation of Simiate, a novel protein linked to the fragile X syndrome.
  findings:
  - statement: Simiate mRNA contains FMRP recognition motifs and co-immunoprecipitates with FMRP from
      mouse brain homogenates as verified by RT-PCR.
    supporting_text: Following three washing steps and elution, the presence of Simiate-mRNA was proven
      by RT-PCR using RNA as well as water only as negative controls
    finding_review:
      finding_status: CURRENT
  - statement: Endogenous Simiate localizes to somata, dendrites, and SC35-positive nuclear speckles,
      and antibody blockade of endogenous Simiate in human HEK-293 cells triggers nuclear speckle compaction
      and rapid cell death.
    supporting_text: An antibody-based block of endogenous Simiate revealed that the protein is essential
      for cell survival.
    finding_review:
      finding_status: CORROBORATED
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational identification and characterization of Simiate (ABITRAM) across mouse brain
      slices, rat E17-E18 primary hippocampal neurons, and human HEK-293 cells (full text verified).
- id: PMID:24782708
  title: Simiate is an Actin binding protein involved in filopodia dynamics and arborization of neurons.
  findings:
  - statement: Purified recombinant mouse Simiate directly binds both monomeric G-actin and filamentous
      F-actin and reduces G-actin polymerization by 29% in vitro.
    supporting_text: A quantification (Figure 2B) revealed that the amount of Actin polymerized after
      a period of 3 h is reduced by 29% in the presence of Simiate
    finding_review:
      finding_status: CURRENT
  - statement: Endogenous Simiate colocalizes with F-actin in lamellipodia of human HEK-293 cells and
      with G- and F-actin in rat neuronal growth cones, while elevated GFP-Simiate enriches at filopodia
      tips and increases proximal dendritic branching.
    supporting_text: Using Lifeact-RFP to label Actin and antibodies to stain Simiate (Figures 1D,E),
      a colocalization of both proteins was found in lamellipodia of HEK-293 cells (Figure 1E).
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical demonstration of direct G-actin and F-actin binding and actin polymerization
      inhibition using recombinant mouse Simiate, alongside human HEK-293 and rat primary hippocampal
      neuron imaging (full text verified).
- id: PMID:26013685
  title: Special characteristics of the transcription and splicing machinery in photoreceptor cells of
    the mammalian retina.
  findings:
  - statement: Endogenous Simiate localizes to interior nuclear speckle clusters in inner retinal neurons
      and to the euchromatic nuclear periphery in rod and cone photoreceptors of mouse and degu retinae.
    supporting_text: In retinal neurons of the inner nuclear and ganglion cell layer, Simiate is concentrated
      in a clustered pattern in the nuclear interior, whereas in rod and cone photoreceptor cells, Simiate
      is present at the nuclear periphery.
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached abstract confirms nuclear and nuclear-speckle localization of endogenous Simiate
      in mouse and degu retinal neurons.
  full_text_unavailable: true
- id: PMID:35787638
  title: Simiate and the focal adhesion kinase FAK1 cooperate in the regulation of dendritogenesis.
  findings:
  - statement: Simiate associates with FAK1 in cytosolic and nuclear brain extracts, preferentially binding
      the calpain-cleaved 80 kDa FAK80 isoform in neuronal nuclei.
    supporting_text: Inside the nucleus, Simiate prefers to associate with FAK80, a Calpain2 cleavage
      product, which contains the FERM and the kinase domain of FAK1
    finding_review:
      finding_status: CURRENT
  - statement: Somatic Simiate promotes dendritic growth and branching whereas nuclear-targeted Simiate
      triggers primary dendrite development and increases active RNAP2 and hnRNP nuclear volumes, counterbalanced
      by nuclear FAK1.
    supporting_text: while Simiate expression in somata induces dendritic growth and branching (Fig. 14.6),
      nuclear Simiate triggers primary dendrite development and enhances transcription as well as processing
      activity
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Dissects cytosolic/growth-cone versus nuclear roles of Simiate and its interaction with
      FAK1/FAK80 using mouse brain fractions, HEK-293 lysates, and rat primary hippocampal neurons (full
      text verified).
- id: PMID:41617053
  title: Localisation and organisation of the focal adhesion kinase FAK1 and Simiate inside nuclear speckles.
  findings:
  - statement: STED super-resolution microscopy in mouse brain slices demonstrates that endogenous Simiate
      is highly enriched in the core domain of nuclear speckles whereas FAK1 localizes predominantly to
      the periphery.
    supporting_text: While FAK1 is predominantly localised in peripheral areas, Simiate is highly enriched
      in the core domain.
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached abstract provides super-resolution confirmation of Simiate enrichment within
      the core subdomain of mouse neuronal nuclear speckles.
  full_text_unavailable: true
- id: PMID:35193982
  title: Leg length and bristle density, both necessary for water surface locomotion, are genetically
    correlated in water striders.
  findings:
  - statement: Embryonic RNAi knockdown of the insect Simiate (abitram) ortholog in Gerris buenoi causes
      disorganized, size-variable actin-based sensory bristles and shortened embryonic legs.
    supporting_text: Simiate RNAi knockdown in G. buenoi resulted in embryos with bristles that are disorganized
      and variable in size, as well as shorter legs
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Provides the sole direct genetic perturbation of an insect abitram/Simiate ortholog,
      demonstrating defects in actin-bundle sensory bristles and appendage growth while noting the absence
      of prior bristle characterization in Drosophila melanogaster.
- id: PMID:18237443
  title: Comparative genomic analysis of novel conserved peptide upstream open reading frames in Drosophila
    melanogaster and other dipteran species.
  findings:
  - statement: Drosophila CG9288 (abitram) contains an evolutionarily conserved dipteran peptide upstream
      open reading frame (uORF) carrying a CX9C motif under purifying selection.
    supporting_text: the uORFs of CG30290 and CG9288
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Comparative genomic uORF study identifying a conserved peptide uORF in the 5' leader
      of CG9288 (abitram) across Diptera (note Table 2 mislabels CG9288's domain column, whereas the mORF
      is ABITM_DROME).
- id: PMID:26637434
  title: Dynamics of Dark-Fly Genome Under Environmental Selections.
  findings:
  - statement: CG9288 lies within a 37 kb chromosome 3R candidate QTL peak (LOD Peak 8) selected in dark-reared
      Drosophila populations.
    supporting_text: CG42375, CG9286, CG9288, CG9297
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Population-genomic mapping listing CG9288 among 12 genes in a 37 kb candidate region
      on chromosome 3R without single-gene functional testing.
