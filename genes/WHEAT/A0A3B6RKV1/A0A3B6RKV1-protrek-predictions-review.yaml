  label: Triticum aestivum
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for this wheat JmjC-domain protein, an ortholog of
  Arabidopsis JMJ22 in the JMJD6 subfamily. The case is a clean dissociation between
  ProTrek's two text channels. Its free-text Function retrieval is exactly right: the
  top two hits are verbatim the UniProt FUNCTION comments of AtJMJ20 and AtJMJ22
  ("demethylates 'Arg-3' (H4R3me) of histone H4 with a specific activity for H4R3me2"),
  which is precisely the function this review infers by orthology. Its GO-annotation
  retrieval, run over the same sequence and the same joint space, instead returns three
  H3-lysine demethylase terms - the high-frequency demethylase annotations in SwissProt -
  and misses H4R3 entirely. The correct arginine-demethylase chemistry is available in
  GO but is rare in the index, so it never surfaces. Two of the three top calls also
  resolve to terms GO has since obsoleted.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 0 less precise (LSP),
  0 uncertain (UNC), 3 incorrect (PLI).
