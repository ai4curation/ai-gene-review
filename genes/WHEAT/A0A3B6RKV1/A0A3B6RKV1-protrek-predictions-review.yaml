predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0071558
      label: histone H3K27me2/H3K27me3 demethylase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 17.20). The general claim - a 2-oxoglutarate/Fe(II)-dependent
        JmjC histone demethylase - is right, but the substrate specificity is that of the
        KDM6/JMJ13-type H3K27 demethylases, a different JmjC subfamily. This protein's
        domain architecture (F-box 89-135 + JmjC 285-445 in 511 aa) and its PANTHER
        subfamily assignment (PTHR12480:SF21) place it in JMJD6, whose characterised plant
        member AtJMJ22 is an H4R3me2 arginine demethylase. Assigning H3K27 specificity is
        a within-family subfamily error, the canonical PLI pattern. Notably ProTrek's own
        Function-subsection retrieval for the same query returns the correct AtJMJ22
        H4R3me2 description at rank 1, so the error is specific to the GO channel.
      supported_by:
        - reference_id: PMID:22483719
          supporting_text: >-
            the histone arginine demethylases, JMJ20 and JMJ22, act redundantly as positive regulators
            of seed germination
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0032454
      label: histone H3K9 demethylase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 16.68). Same failure as rank 1 with a different lysine position:
        H3K9 demethylation is the KDM3/KDM4/JMJ25-type activity, not JMJD6. The model is
        enumerating the frequent JmjC substrate specificities in SwissProt rather than
        discriminating the subfamily this sequence belongs to.
      supported_by:
        - reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-deep-research-falcon.md
          supporting_text: >-
            The protein contains both a JmjC histone demethylase domain and an F-box domain,
            and is predicted to localize to the nucleus, consistent with its chromatin-associated function.
