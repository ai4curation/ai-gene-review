  predicted_term:
    id: GO:0040029
    label: epigenetic regulation of gene expression
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: 'The target is in PANTHER subfamily PTHR12480:SF21 with Arabidopsis JMJ22 (Q67XX3), the reviewed
      protein named as the phmmer hit in the ProtNLM2 evidence record; the two share an F-box and JmjC
      domain, 62.6% global identity and the conserved Fe(II)-binding His330/Asp332/His413 triad. JMJ22
      is an experimentally characterised H4R3me2 arginine demethylase that activates GA3ox1/GA3ox2 expression
      by removing a repressive histone mark (PMID:22483719), and the JMJ22 gene review accepts epigenetic
      regulation of gene expression as its core process. Because the catalytic site and domain architecture
      are conserved in the closest same-subfamily ortholog, transfer of this broad chromatin-level process
      is a justified family inference, though not an observation on the wheat protein. The transfer has
      limits: the histone substrate has not been tested in wheat, the wheat gene review holds back from
      asserting a histone demethylase activity, and Arabidopsis JMJ22 also affects SAC51-family mRNA stability
      (PMID:35962471), so not every JMJ22 function is chromatin-based. The term is absent from the target''s
      GOA annotations, which carry only nucleus, DNA binding and metal ion binding.'
