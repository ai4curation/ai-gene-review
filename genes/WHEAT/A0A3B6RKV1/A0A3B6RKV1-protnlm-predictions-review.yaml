      any cereal JMJ22 ortholog. Orthology supports a conserved nuclear JmjC oxygenase but does not establish
      that the wheat protein sits in an equivalent light-signalling circuit, so the term can be neither
      confirmed nor refuted. It is absent from the target's GOA annotations.
