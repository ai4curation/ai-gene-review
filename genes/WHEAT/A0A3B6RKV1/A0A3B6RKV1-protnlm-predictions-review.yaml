status: COMPLETE
description: ProtNLM2 emitted five biological-process terms for this wheat F-box/JmjC protein, all transferred
  from its closest characterised same-subfamily (PTHR12480:SF21) ortholog, Arabidopsis JMJ22. Epigenetic
  regulation of gene expression is a justified transfer of JMJ22's experimentally established chromatin
  role (COR). Gibberellin-mediated signalling is incorrect, because JMJ22 acts upstream of gibberellin
  biosynthesis rather than in hormone signalling (NPI). Regulation of photomorphogenesis, response to
  red light and positive regulation of seed germination depend on the Arabidopsis phytochrome B-SOMNUS
  germination circuit and remain untested in wheat (UNC).
