    summary: 'The target is in PANTHER subfamily PTHR12480:SF21 with Arabidopsis JMJ22 (Q67XX3), the reviewed
      protein named as the phmmer hit in the ProtNLM2 evidence record; the two share an F-box and JmjC
      domain, 62.6% global identity and the conserved Fe(II)-binding His330/Asp332/His413 triad. The only
      experimental basis for this term in the family is the JMJ22 IMP annotation, and the JMJ22 evidence
      places the protein upstream of gibberellin biosynthesis: JMJ22 removes H4R3me2 at GA3ox1/GA3ox2
      and so raises gibberellin levels (PMID:22483719). That is regulation of hormone synthesis, not participation
      in gibberellin perception or signal transduction, and the reviewed JMJ22 record describes the role
      as triggering GA biosynthesis. The Arabidopsis JMJ22 gene review accordingly replaces this term
      with positive regulation of gibberellin biosynthetic process. The prediction therefore transfers
      a mis-specified process from the ortholog; even if the wheat protein shares the JMJ22 role, gibberellin-mediated
      signalling is the wrong process. No wheat experiment addresses it, and the term is absent from the
      target''s GOA annotations.'
