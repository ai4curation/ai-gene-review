- term:
    id: GO:0000987
    label: cis-regulatory region sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      This IBA rests on a single donor, an IDA by TAIR for Arabidopsis JMJ22 from Cho et al.
      2012 (PMID:22483719), placed at the eukaryote-level node PTN001753861. Only the abstract
      of that paper is cached. The abstract reports that SOMNUS, a zinc-finger protein,
      directly represses JMJ20/JMJ22, and that JMJ20/JMJ22 remove histone arginine
      methylation at GA3ox1/GA3ox2. The DNA-binding assay that underlies the TAIR IDA cannot
      be identified from the abstract, and it could have been the SOMNUS-promoter EMSA. JMJ22
      was also recovered as a promoter-binding protein in an Arabidopsis yeast one-hybrid
      screen (PMID:25533953, GO:0000976 IPI). JmjC demethylases are usually recruited to loci
      by other factors and have no known sequence-specific DNA-binding domain, and the wheat
      protein has no recognisable DNA-binding domain apart from the F-box and JmjC domain.
      The annotation is therefore neither confirmed nor refuted.
    action: UNDECIDED
    reason: >-
      The donor experimental annotation cannot be checked against full text, and the
      function is atypical for a JmjC/F-box protein without a DNA-binding domain. A
      curator-made IDA should not be overruled from an abstract, so this is left undecided
      rather than removed. The eukaryote-wide node placement on a single plant donor is also
      questionable, because animal JMJD8 is ER-lumenal.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001753861
        source_label: PTN001753861
        source_status: UNRESOLVED
