core_functions:
- description: >-
    Nuclear Fe(II)- and 2-oxoglutarate-dependent JmjC oxygenase of the plant F-box/JmjC
    (JMJ22-like) branch of PANTHER subfamily PTHR12480:SF21, with a fully conserved
    HxD...H iron-binding triad. By orthology to Arabidopsis JMJ22, the most likely activity
    is histone H4R3me2 arginine demethylation. That substrate-specific activity was not
    propagated by PAINT and has not been tested for the wheat protein, so it is not asserted
    here.
  supported_by:
  - reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-bioinformatics/RESULTS-rereview.md
    supporting_text: AtJMJ22 Fe(II) ligands H324, D326, H407 map to wheat H330, D332, H413 (all conserved).
  - reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-bioinformatics/Q67XX3-JMJ22-uniprot.txt
    supporting_text: >-
      Histone demethylase that demethylates 'Arg-3' (H4R3me) of
      histone H4 with a specific activity for H4R3me2 (PubMed:22483719).
  - reference_id: PMID:22483719
    supporting_text: >-
      the histone arginine demethylases, JMJ20 and JMJ22, act redundantly as positive
      regulators of seed germination
  molecular_function:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  locations:
  - id: GO:0005634
    label: nucleus
suggested_questions:
- question: >-
    Does the wheat JMJ22 ortholog demethylate H4R3me2 (or other methylarginine/lysine
    marks) in vitro, and is the activity shared by the 7A, 7B and 7D homeologs?
- question: >-
    What is the evidential basis of the TAIR IDA for GO:0000987 on JMJ22 in PMID:22483719,
    and is the PAINT placement of that term at eukaryote-level node PTN001753861 (which
    includes ER-lumenal animal JMJD8) appropriate?
- question: >-
    Does the F-box domain of plant JMJ22-like proteins assemble into SCF complexes, or is it
    a degenerate structural module?
suggested_experiments:
- description: >-
    Express recombinant A0A3B6RKV1 (wild type and H330A/H413A Fe-site mutants) and assay
    demethylation of H4R3me2 peptides and nucleosomes by mass spectrometry, with
    formaldehyde release as readout.
- description: >-
    Test whether the wheat gene complements the Arabidopsis jmj20 jmj22 double mutant's
    red-light seed germination defect.
- description: >-
    Co-immunoprecipitation with wheat SKP1/ASK homologs to test whether the F-box is
    functional.
