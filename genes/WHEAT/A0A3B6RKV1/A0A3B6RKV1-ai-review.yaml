- term:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  evidence_type: ISS
  original_reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-bioinformatics/RESULTS-rereview.md
  qualifier: enables
  review:
    summary: >-
      The protein has a complete JmjC domain with the Fe(II)-binding HxD...H triad
      (His330, Asp332, His413) conserved with its same-subfamily ortholog JMJ22, whose
      Fe(II)/2-oxoglutarate-dependent methylarginine demethylase reaction is experimentally
      established. The general dioxygenase activity is the level that holds across the
      PTHR12480 family (JMJD4, JMJD6, JMJD8, JMJ22) without assuming a substrate.
    action: NEW
    reason: >-
      Catalytic Fe(II)/2OG oxygenase activity is supported by conserved active-site residues
      and orthology to an enzyme with demonstrated 2OG-dependent activity. The substrate
      (histone H4R3me2 for JMJ22) is not asserted, because PAINT did not propagate JMJ22's
      histone demethylase activity and nothing has been tested for the wheat protein.
    supported_by:
    - reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-bioinformatics/RESULTS-rereview.md
      supporting_text: AtJMJ22 Fe(II) ligands H324, D326, H407 map to wheat H330, D332, H413 (all conserved).
    - reference_id: file:WHEAT/A0A3B6RKV1/A0A3B6RKV1-bioinformatics/Q67XX3-JMJ22-uniprot.txt
      supporting_text: 'Evidence={ECO:0000269|PubMed:22483719};'
