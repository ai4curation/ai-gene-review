taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
description: >-
  A0A3B6RKV1 (LOC123148885, TraesCS7A02G443400, chromosome 7A) encodes a 511-residue
  F-box/JmjC domain protein of bread wheat. It belongs to PANTHER subfamily PTHR12480:SF21
  (the JMJD8-related subfamily of the JMJD4/JMJD6/JMJD8 JmjC oxygenase family), which it
  shares with Arabidopsis JMJ22 (At5g06550) and animal JMJD8. Its closest characterised
  relative is Arabidopsis JMJ22, with which it shares the N-terminal F-box (residues 89-135)
  and C-terminal JmjC domain (residues 285-445; about 77% identity in the JmjC domain) and
  the Fe(II)-binding His330-Asp332-His413 triad. These features indicate an Fe(II)- and
  2-oxoglutarate-dependent oxygenase. JMJ22 is a nuclear histone H4 arginine-3 (H4R3me2)
  demethylase that, redundantly with JMJ20, promotes light (phytochrome B)-induced seed
  germination by removing repressive H4R3me2 at gibberellin biosynthesis genes GA3ox1 and
  GA3ox2. The wheat protein is therefore expected to act in the nucleus as a JmjC
  demethylase, possibly of methylarginine on histones, but neither its activity, substrate,
  the role of its F-box, nor any developmental function has been tested experimentally.
  Homeologous copies are encoded on chromosomes 7B and 7D.
