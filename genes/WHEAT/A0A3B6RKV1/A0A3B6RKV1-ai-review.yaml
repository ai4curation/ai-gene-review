    summary: >-
      PAINT node PTN001753861 (PTHR12480 SF21 clade) carries an IBD for nucleus seeded by
      Arabidopsis JMJ22 (AT5G06550), Trypanosoma Q386V9 and human JMJD8 (Q96S16). The wheat
