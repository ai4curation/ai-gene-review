- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      The JmjC domain (PROSITE PS51184) coordinates a catalytic Fe(II) through an HxD...H
      triad. In the wheat protein all three ligands are conserved (His330, Asp332, His413,
      mapped by alignment from JMJ22 His324, Asp326, His407). JMJ22 is annotated by UniProt
      to bind one Fe(2+) per subunit. The term is correct but general, and the supported
      specific metal is ferrous iron. The earlier review's replacement (histone demethylase
      activity) changed the claim rather than refining it, and PAINT did not propagate the
      JMJ22 histone demethylase activity to this clade.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports. The JmjC Fe(II) site is fully
      conserved, so the precise is_a descendant is ferrous iron binding.
    proposed_replacement_terms:
    - id: GO:0008198
      label: ferrous iron binding
    supported_by:
