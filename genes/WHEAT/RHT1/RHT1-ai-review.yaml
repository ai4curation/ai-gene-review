proposed_new_terms: []
suggested_questions:
- question: Does RHT-D1 inhibit IDD5 DNA binding, or recruit coactivators to IDD5 target loci? PMID:41615756
    explicitly leaves both mechanisms open; resolving this requires target-promoter and transcriptional assays.
- question: Which RHT1–PLATZ1 interactions alter transcription and growth, and how do their effects differ
    from the RHT1–IDD5 interaction?
suggested_experiments:
- description: Combine RHT-D1/IDD5 interaction mutants with promoter occupancy and transcriptional reporters
    at independently mapped IDD5 targets, comparing full-length and N-terminally truncated RHT-D1.
  hypothesis: The same DELLA growth phenotype may arise through TF sequestration or coactivation of growth-inhibitory
    genes.
  experiment_type: interaction mutagenesis and transcriptional regulation
