core_functions:
- description: Regulates gibberellin-responsive growth by binding nuclear transcription factors, with hormone-dependent
    turnover releasing DELLA-mediated growth restraint. Direct IDD5 binding is demonstrated with an N-terminally
    truncated RHT-D1 construct; the sign and promoter-level mechanism of each partner interaction remain context
    dependent.
