id: Q9ST59
gene_symbol: RHT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
description: RHT1 is a wheat DELLA protein that restrains gibberellin-responsive growth through nuclear interactions
  with transcriptional regulators. Its C-terminal GRAS region interacts with transcription factors including
  IDD5 and PLATZ1, linking gibberellin signaling to gene expression and cell elongation. Gibberellin promotes
  recognition of the N-terminal regulatory region by GID1 and subsequent ubiquitin-dependent degradation, releasing
  growth restraint. Green Revolution Rht-B1b and Rht-D1b alleles produce N-terminally truncated proteins by
  translational reinitiation; these proteins resist gibberellin-induced degradation and confer reduced stem
  elongation.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Nuclear localization is consistent with curated DELLA localization and directly observed RHT-D1–IDD5
      interaction.
    action: ACCEPT
    reason: UniProt records nucleus by similarity. In the primary 2026 wheat study, BiFC with an N-terminally
      truncated RHT-D1 construct and IDD5, together with DAPI, localizes the interaction to the nucleus. This
      is direct target-family evidence with the construct limitation stated; the nuclear location of TaGID2
      alone is not treated as a localization assay of RHT1.
    supported_by:
    - reference_id: file:WHEAT/RHT1/RHT1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Nucleus'
    - reference_id: PMID:41615756
      supporting_text: the interaction occurs in the nucleus
- term:
    id: GO:0009740
    label: gibberellic acid mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: The retired signaling annotation captures a genuine core pathway role; the negative-regulation
      term adds precision.
    action: MODIFY
    reason: Wheat RHT proteins restrain gibberellin-responsive growth, and their hormone-triggered degradation
      releases that restraint. Wild-type protein degradation and stabilized dwarfing alleles are directly demonstrated
      in PMID:33422695. RHT1 therefore does regulatory work in the signaling pathway, beyond merely being a
      degradation substrate. Recommend GO:0009938 for that inhibitory role. Retirement of a keyword mapping
      route does not itself establish a biological rejection or a curator error.
    proposed_replacement_terms:
    - id: GO:0009938
      label: negative regulation of gibberellic acid mediated signaling pathway
    supported_by:
    - reference_id: PMID:33422695
      supporting_text: their degradation in response to GAs.
- term: &id001
    id: GO:0140297
    label: DNA-binding transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:41615756
  review:
    summary: RHT-D1 physically interacts with IDD5, a DNA-binding transcription factor.
    action: NEW
    reason: Primary yeast two-hybrid and nuclear BiFC experiments demonstrate interaction of the RHT-D1 GRAS-containing
      truncation with IDD5. Independent wheat PLATZ1 interaction evidence is reported in PMID:37126674. This
      specific binding function captures the measured molecular activity without assuming that every partner
      interaction represses transcription at a genomic locus. The 2026 paper explicitly leaves IDD5 sequestration
      versus coactivation unresolved. The N-terminal truncation used in the interaction assays is described
      in the evidence; this is not a separate natural isoform annotation.
    supported_by:
    - &id002
      reference_id: PMID:41615756
      supporting_text: full-length IDD5-A1 interacted strongly with ∆RHT-D1
references:
- id: file:WHEAT/RHT1/RHT1-uniprot.txt
  title: UniProtKB - Q9ST59 (RHT1_WHEAT) DELLA protein RHT-1, Triticum aestivum.
  findings:
  - statement: UniProt FUNCTION - probable transcriptional regulator that acts as a repressor of the gibberellin
      (GA) signaling pathway, probably acting by participating in large multiprotein complexes that repress
      transcription of GA-inducible genes; upon GA application it is degraded by the proteasome, allowing the
      GA signaling pathway.
  - statement: Subcellular location is nucleus; the DELLA motif is required for GA-induced degradation; the
      protein is phosphorylated and ubiquitinated.
  - statement: Belongs to the GRAS family, DELLA subfamily, with a C-terminal GRAS domain and an N-terminal
      DELLA regulatory region; the Green Revolution semi-dwarf alleles Rht-B1b and Rht-D1b carry N-terminal
      deletions/truncations.
