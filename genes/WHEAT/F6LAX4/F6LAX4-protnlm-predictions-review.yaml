    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The target is a PP2A A-subunit scaffold capable of participating in regulatory holoenzymes. The
        PP2A structure shows how the A subunit associates with catalytic and regulatory subunits (PMID:17174897);
        the scaffold need not itself catalyze a reaction to participate in a chromosome-related process.
        Chromosome segregation occurs in plants, but no specific complex or functional experiment connects
        this wheat product to it in the inspected sources. The process is absent from the cached annotations
        and remains uncertain.
