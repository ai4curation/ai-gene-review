      id: GO:0046982
      label: protein heterodimerization activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The target has a PP2A regulatory A-subunit family assignment and HEAT-repeat scaffold architecture,
        consistent with its curated PP2A-complex IBA. Structural work establishes that the A and C subunits
        form a heterodimeric core enzyme before association with a regulatory B subunit (PMID:17174897).
        This conserved interaction supports protein heterodimerization even though a more informative
        functional description is PP2A scaffolding. The exact term is absent from the cached annotations
        and is not biologically incorrect merely because it is broad.
