predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0046982
      label: protein heterodimerization activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        F6LAX4 carries the PP2A regulatory subunit A family signatures (IPR051023, PANTHER
        PTHR10648:SF4) and descends from the eukaryote PP2A scaffold PAINT nodes, so the conserved
        scaffold-catalytic subunit association transfers to it as a family inference. Structural work
        on the PP2A holoenzyme shows that the scaffolding A subunit and the catalytic C subunit form a
        heterodimeric core enzyme to which a regulatory B subunit then binds (PMID:17174897), which is
        binding to a nonidentical protein to form a heterodimer. The term is not in the gene's GOA set
        and is not an ancestor or descendant of the existing protein phosphatase regulator activity
        IBA or of the protein complex scaffold activity the gene review proposes, so it is novel. It is
        a less informative description of the A subunit than complex scaffolding, but it is correct.
      supported_by:
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A. DR   PANTHER; PTHR10648:SF4;
            PROTEIN PHOSPHATASE 2 (FORMERLY 2A), REGULATORY SUBUNIT A, BETA ISOFORM-RELATED; 1.
        - reference_id: PMID:17174897
          supporting_text: >-
            The PP2A holoenzyme consists of a heterodimeric core enzyme
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-bioinformatics/RESULTS-rereview.md
          supporting_text: F6LAX4 is a co-ortholog of all three
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0043025
      label: neuronal cell body
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        The target is a Triticum aestivum protein. Neuronal cell body denotes the soma of a neuron, a
        cell type absent from plants, so this compartment cannot apply to the wheat PP2A scaffold. The
        term is absent from the gene's annotations and nothing in the gene review or the PTHR10648
        family review supports it for a plant member. The prediction alone does not establish which
        training example or model mechanism produced the error.
      error_type: TAXON_CONSTRAINT_VIOLATION
      supported_by:
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-uniprot.txt
          supporting_text: >-
            OS   Triticum aestivum (Wheat).
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-hypotheses/prediction-animal-specific-terms/openscientist.md
          supporting_text: >-
            plants have **no neurons**
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0007059
      label: chromosome segregation
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        In Arabidopsis, the PP2A regulatory subunits B'alpha and B'beta are required to maintain
        centromeric sister chromatid cohesion in meiosis, and the A1 structural subunit, a co-ortholog
        of F6LAX4, localizes with them to meiotic centromeres (PMID:30061120). This places the wheat
        scaffold plausibly in a PP2A-B' holoenzyme acting on chromosomes. The demonstrated function,
        however, is protection of centromeric cohesion, which GO represents as a sister chromatid
        cohesion process outside chromosome segregation; segregation defects in the mutants are a
        downstream consequence, and the genetic evidence is on the B' subunits, not on an A subunit.
        PAINT placed its meiotic centromeric cohesion IBD on an animal/fungal subclade that does not
        include F6LAX4. Support for the exact segregation term is therefore insufficient.
      supported_by:
        - reference_id: PMID:30061120
          supporting_text: >-
            The combined absence of the regulatory subunits PP2AB′α and PP2AB′β leads to the premature
            loss of chromosome cohesion in meiosis I.
        - reference_id: PMID:30061120
          supporting_text: >-
            PP2AB′α and PP2AB′β are redundantly required for the protection of centromeric sister
            chromatid cohesion in Arabidopsis male meiosis I and II
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-bioinformatics/RESULTS-rereview.md
          supporting_text: F6LAX4 is a co-ortholog of all three
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0000775
      label: chromosome, centromeric region
    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        GFP-tagged Arabidopsis PP2AA1, the structural A subunit and a co-ortholog of F6LAX4 (grasses
        have a single A-subunit lineage co-orthologous to all three Arabidopsis A subunits),
        colocalizes with centromeric histone CENH3 in male meiocytes from pachytene to metaphase II,
        together with the B'alpha regulatory subunit (PMID:30061120). Centromere targeting depends on
        the regulatory subunit rather than on the scaffold itself, but the A subunit is a member of the
        holoenzyme residing there, which suffices for a cellular component annotation. Transfer to the
        wheat ortholog is an inference, restricted in the source to meiotic stages. The term is absent
        from the gene's GOA set and is novel.
      supported_by:
        - reference_id: PMID:30061120
          supporting_text: >-
            The PP2AA1 structural and B′α regulatory subunit localize specifically to centromeres until
            metaphase II
        - reference_id: PMID:30061120
          supporting_text: >-
            PP2AA1-GFP also colocalized with CENH3, with some protein detected in regions close to the
            centromeres
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-bioinformatics/RESULTS-rereview.md
          supporting_text: F6LAX4 is a co-ortholog of all three
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0043005
      label: neuron projection
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        The target organism is Triticum aestivum. Neuron projections are neuronal structures, and
        plants have no neurons, so this localization is incompatible with the target taxon. It is
        absent from the gene's annotations and is not supported by the gene review or the PTHR10648
        family review for a plant member. No inference about model frequency bias is needed to
        establish the incompatibility.
      error_type: TAXON_CONSTRAINT_VIOLATION
      supported_by:
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-uniprot.txt
          supporting_text: >-
            OS   Triticum aestivum (Wheat).
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-hypotheses/prediction-animal-specific-terms/openscientist.md
          supporting_text: >-
            plants have **no neurons**
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:1990405
      label: protein antigen binding
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        The wheat product is a PP2A A-subunit scaffold. The human PP2A A-small t structure establishes
        that the viral small t antigen binds the scaffold as a PP2A inhibitor (PMID:17608567); the
        viral protein's name does not make that interaction immunological antigen recognition, which
        is what protein antigen binding describes. Plants lack the antibody and antigen-receptor
        systems that carry this activity, and the term is absent from the wheat annotations.
      error_type: TAXON_CONSTRAINT_VIOLATION
      supported_by:
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-uniprot.txt
          supporting_text: >-
            OS   Triticum aestivum (Wheat).
        - reference_id: PMID:17608567
          supporting_text: >-
            ST directly interacts with the PP2A scaffolding A subunit
        - reference_id: file:WHEAT/F6LAX4/F6LAX4-hypotheses/prediction-animal-specific-terms/openscientist.md
          supporting_text: >-
            plants have **no adaptive immune system / antibodies**
