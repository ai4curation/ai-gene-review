id: F6LAX4
gene_symbol: F6LAX4
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  F6LAX4 is the wheat PP2A scaffolding A subunit, a co-ortholog of the three Arabidopsis A subunits.
  Protein heterodimerization (the A-C core enzyme) and chromosome centromeric region (the
  Arabidopsis A1 ortholog colocalizes with CENH3 in meiocytes) are supported novel predictions.
  Neuronal localizations and protein antigen binding are incompatible with wheat biology.
  Chromosome segregation remains unresolved because the plant evidence establishes a role of the
  PP2A-B' holoenzyme in centromeric cohesion protection rather than in segregation itself.
