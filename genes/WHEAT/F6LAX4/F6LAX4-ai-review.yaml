  review:
    summary: The A subunit is an obligate structural component of the PP2A heterotrimer, so
      membership of the protein phosphatase type 2A complex is the defining cellular component
      of F6LAX4.
    action: ACCEPT
    reason: The IBA derives from the PAINT IBD on the eukaryote-level scaffold node PTN000068663,
      seeded by experimental annotations from budding and fission yeast, fly, worm, mouse, human,
      Candida and Dictyostelium A subunits. F6LAX4 descends from this node (PANTHER PTHR10648, and
      the re-review phylogeny places it with all other plant A subunits inside the conserved
      scaffold clade), carries the full HEAT-repeat solenoid, and has no sign of divergence.
      Structural work shows the scaffolding subunit is one of the two subunits of the PP2A core
      enzyme. Accepted as core.
