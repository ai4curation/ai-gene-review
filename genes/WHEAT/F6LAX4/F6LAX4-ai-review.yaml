- id: file:WHEAT/F6LAX4/F6LAX4-uniprot.txt
  title: UniProt record F6LAX4
  findings:
  - statement: TrEMBL PE3 entry, 587 aa, with PP2A regulatory subunit A family signatures
      (IPR051023, PF22646) and HEAT repeats spanning the whole protein.
- id: file:WHEAT/F6LAX4/F6LAX4-bioinformatics/RESULTS-rereview.md
  title: F6LAX4 phylogenetic placement among PP2A scaffold A subunits (re-review)
  findings:
  - statement: F6LAX4 is full length and groups with grass A subunits; the three Arabidopsis A
      subunits are eudicot-specific paralogs, so F6LAX4 is a co-ortholog of all three. The PANTHER
      SF4 versus SF29/SF36 split between grass and Arabidopsis A subunits is a subfamily-HMM
      boundary, not a functional divergence.
