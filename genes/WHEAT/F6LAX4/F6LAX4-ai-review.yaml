id: F6LAX4
gene_symbol: LOC123103357
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
description: >
  F6LAX4 is the bread wheat (Triticum aestivum) scaffolding A subunit (PR65 type) of protein
  phosphatase 2A (PP2A), encoded by a homoeologous locus set on chromosome group 5
  (TraesCS5A02G168400, TraesCS5B02G165200, TraesCS5D02G172700). The 587-residue, ~65 kDa protein
  consists almost entirely of tandem HEAT repeats that fold into a horseshoe-shaped alpha-helical
  solenoid. It has no catalytic activity. In the PP2A holoenzyme the A subunit binds the catalytic C
  subunit to form the A-C core dimer and provides the platform on which a variable regulatory B
  subunit (B55, B'/B56 or B''/PR72 type) docks, so the A subunit holds the heterotrimer together and,
  by permitting assembly of different holoenzymes, governs PP2A activity, substrate choice and
  subcellular targeting. Grass genomes encode a single lineage of A subunits that is co-orthologous to
  the three Arabidopsis A subunits (RCN1/PP2AA1, PP2AA2, PP2AA3); the Arabidopsis proteins are found in
  both the nucleus and the cytosol and, through the PP2A holoenzymes they scaffold, act in auxin
  transport, hormone signalling and development. No experimental study of the wheat protein itself has
  been reported.
