    Structural scaffold (A/PR65) subunit of the PP2A heterotrimeric holoenzyme. Its HEAT-repeat
    solenoid binds the catalytic C subunit to form the core dimer and docks a variable regulatory B
    subunit, holding the complex together and thereby regulating PP2A activity, substrate specificity
    and localization in the cytosol and nucleus.
