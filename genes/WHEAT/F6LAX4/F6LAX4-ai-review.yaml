  title: "Arabidopsis thaliana histone deacetylase 14 (HDA14) is an α-tubulin deacetylase that\
    \ associates with PP2A and enriches in the microtubule fraction with the putative histone acetyltransferase\
    \ ELP3."
  findings:
  - statement: Arabidopsis PP2A A subunits A1, A2 and A3 (co-orthologs of F6LAX4) reside in both the
