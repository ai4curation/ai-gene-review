references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic (IBA) annotations from GO_Central. GO:0000159 comes from the eukaryote
      scaffold node PTN000068663 and GO:0019888 from PTN000068596; PTN000068596 also carries a
      GO:0140378 protein complex scaffold activity IBD (2026-06-03) not yet in the fetched GOA.
      The BP IBDs at PTN000068664 (spindle assembly; meiotic sister chromatid cohesion,
      centromeric) are on an animal/fungal subclade and were not propagated to F6LAX4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >
      Node placements checked against interpro/panther/PTHR10648/PTHR10648-paint.tsv in the
      2026-10-20 re-review.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
