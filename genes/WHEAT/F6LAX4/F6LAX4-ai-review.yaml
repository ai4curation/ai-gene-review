      (GO:0005737) and protein-containing complex (GO:0032991).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >
      Automated ARBA mappings. Not used as evidence for themselves; the localizations are
      independently supported by PAINT IBDs and by PMID:22404109 for the Arabidopsis co-orthologs.
- id: file:WHEAT/F6LAX4/F6LAX4-deep-research-falcon.md
  title: Deep-research report (falcon / Edison Scientific Literature) - functional annotation of
    wheat PP2A scaffolding A subunit (F6LAX4 / LOC123103357).
  findings:
  - statement: No primary literature characterizes this wheat gene; functional annotation is
      family-level inference grounded in canonical PP2A-A structure-function evidence.
  - statement: The PP2A A subunit is a HEAT-repeat alpha-solenoid that binds the catalytic C
      subunit and recruits regulatory B subunits, controlling substrate specificity, localization
      and activity of PP2A holoenzymes.
  - statement: Arabidopsis RCN1/PP2AA1 functions in auxin distribution and root development, with
      redundancy among the three A subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >
      LLM deep-research synthesis; it transparently states that no wheat-specific literature
      exists. In the 2026-10-20 re-review it is retained but primary support was shifted to cached
      PMIDs, the human PPP2R1A UniProt curated function text and the new phylogeny; it remains
      cited only for one family-level statement on B-subunit-dependent specificity.
- id: PMID:17174897
  title: Structure of the protein phosphatase 2A holoenzyme.
  findings:
  - statement: Crystal structure of the PP2A heterotrimer showing the scaffolding subunit as one of
      the two subunits of the core enzyme, contacted by both catalytic and B'/B56 subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; quotes verified against the cached abstract. Structural work
      on the human holoenzyme; transfer to F6LAX4 rests on its descent from the eukaryote scaffold
      PAINT nodes.
