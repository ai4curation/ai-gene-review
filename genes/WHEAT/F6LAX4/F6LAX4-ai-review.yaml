suggested_questions:
- question: >
    Which PP2A catalytic C subunits and regulatory B subunits does the wheat A subunit assemble
    with in vivo, and do the 5A/5B/5D homoeologs form distinct or redundant holoenzymes?
- question: >
    Does the single grass A-subunit lineage cover the combined roles that are split among the three
    eudicot paralogs (RCN1/PP2AA1, PP2AA2, PP2AA3) in Arabidopsis, for example in auxin transport
    and root development?
suggested_experiments:
- description: >
    Express epitope-tagged F6LAX4 in wheat (or a heterologous plant system) and identify
    co-purifying PP2A catalytic C and regulatory B subunits by affinity purification mass
    spectrometry.
  hypothesis: >
    F6LAX4 is the structural scaffold of wheat PP2A holoenzymes, bridging the catalytic C subunit and
    diverse regulatory B subunits.
  experiment_type: interactome / protein-complex characterization
- description: >
    Test whether F6LAX4 complements the Arabidopsis rcn1 mutant root and auxin-transport phenotypes.
  hypothesis: >
    The grass A subunit is functionally equivalent to the eudicot RCN1/PP2AA1 scaffold.
  experiment_type: cross-species genetic complementation
