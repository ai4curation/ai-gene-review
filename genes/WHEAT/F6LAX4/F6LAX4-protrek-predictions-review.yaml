id: F6LAX4
gene_symbol: F6LAX4
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for this wheat PP2A scaffolding (A/PR65) subunit,
  a HEAT-repeat protein. This is the strongest head-to-head contrast in the benchmark.
  ProtNLM2 predicted six terms for this protein and all six were wrong, including
  animal-only compartments (neuronal cell body, neuron projection) and immune terms
  (protein antigen binding) for a plant protein. ProTrek's top three GO sentences are
  protein phosphatase type 2A complex (already in GOA), SCF complex assembly (wrong),
  and protein phosphatase regulator activity (already in GOA), and its top free-text
  Function hits are verbatim the PP2A A-subunit scaffold description. ProTrek identifies
  the protein correctly; its useful output here is confirmatory rather than novel,
  since both correct calls simply reproduce existing GOA annotations.
  Assessment: 2 correct not novel (CNN), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
  - genes/WHEAT/F6LAX4/F6LAX4-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0000159
      label: protein phosphatase type 2A complex
    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 15.10) and an exact match to an existing GOA annotation.
        The call is correct - the protein is the A/PR65 scaffolding subunit that holds the
        PP2A catalytic and regulatory B subunits together - but it is not novel: the term
        is already annotated for this entry. The value of the prediction is that it is
        right where a competing model was not, rather than that it adds an annotation.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0010265
      label: SCF complex assembly
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 2 (score 14.57). SCF complex assembly is an unrelated ubiquitin-ligase process;
        the PP2A A subunit is not an SCF component and has no reported role in SCF assembly.
        The likely cause is the HEAT/armadillo-like alpha-solenoid repeat architecture, which
        the model shares with cullin-family scaffolds - a fold-level rather than
        family-level match.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0019888
      label: protein phosphatase regulator activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 14.01) and again an exact match to an existing GOA annotation. Correct
        and appropriate for the scaffolding subunit, which modulates PP2A catalytic activity
        through subunit assembly, but contributes no new information over the current
        annotation set.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
