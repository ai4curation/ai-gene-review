id: A0A3B6GK97
gene_symbol: A0A3B6GK97
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
description: Patatin-like (PNPLA domain) protein of bread wheat (Triticum aestivum), encoded
  by the chromosome 3D locus TraesCS3D02G033600 in a tandem cluster of patatin genes. It belongs
  to PANTHER subfamily PTHR32176:SF103, a grass-specific clade of soluble patatin-type proteins
  whose nearest characterised relatives are the Arabidopsis pPLAII lipid acyl hydrolases
  (PLP1, PLP2, PLP4, PLP5), from which it is separated by a gene duplication that predates the
  monocot-dicot split. The deposited 302-residue protein contains only the C-terminal two-thirds
  of the patatin fold. Genomic sequence upstream of the annotated start encodes a further
  N-terminal region that matches the full-length 444-residue chromosome 3B homoeolog
  (TraesCS3B02G036500), so the 302-residue model is probably incomplete. Neither the
  reconstructed N-terminal region nor the 3B homoeolog carries the catalytic serine nucleophile
  (G-T-S-T-G) or the canonical oxyanion glycines (DGGG) of patatin enzymes; only the catalytic
  aspartate of the Ser-Asp dyad is retained. The product is therefore predicted to be a
  non-catalytic patatin-like protein. Its biological role, expression and any non-enzymatic
  activity are unknown, and no experimental data exist for this protein.
existing_annotations:
- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO transfer from the PNPLA domain (IPR002641) to lipid metabolic process.
      The mapping assumes a catalytically competent patatin lipid acyl hydrolase, which this
      product is predicted not to be.
    action: MARK_AS_OVER_ANNOTATED
    reason: The patatin/PNPLA domain places patatin enzymes in lipid metabolism because they
      hydrolyse glycerolipid acyl esters with a Ser-Asp dyad [PMID:12779324]. This product lacks
      the serine nucleophile. The re-review analysis shows that the 302-aa model is an incomplete
      gene model, but the genomic sequence upstream of the 3D locus and the full-length 3B
      homoeolog (A0A3B6FIU7, 93% identical) both lack the G-T-S-T-G elbow and carry a corrupted
      oxyanion block, so the catalytic serine is absent from the locus itself and not just from
      the model. A non-catalytic patatin-like protein could still have some lipid-related role
      (for example lipid binding), so the term is not shown to be false, but no evidence places
      this protein in lipid metabolism and the domain-based inference rests on an activity it
      cannot perform. The previous review accepted this row before the gene-model analysis was
      done; it is changed here to MARK_AS_OVER_ANNOTATED.
    supported_by:
    - reference_id: PMID:12779324
      supporting_text: patatin has a Ser-Asp catalytic dyad
    - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS-rereview.md
      supporting_text: Even the reconstructed full-length product, and the full-length 3B homoeolog,
        lack the catalytic serine nucleophile and the canonical oxyanion glycines.
    - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS.md
      supporting_text: the modeled 302-aa sequence lacks the entire N-terminal half of the patatin
    - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-uniprot.txt
      supporting_text: 'PE   3: Inferred from homology;'
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: ARBA rule assigning hydrolase activity on the basis of patatin family membership.
      The product lacks the catalytic serine nucleophile that patatin-type ester hydrolysis
      requires, in the deposited model, in the upstream genomic sequence that probably encodes
      its true N-terminus, and in its full-length 3B homoeolog.
    action: REMOVE
    reason: Patatin-family hydrolysis uses a Ser-Asp dyad, and mutation of the serine abolishes
      esterase activity [PMID:12779324]. The serine sits in the G-T-S-T-G nucleophile elbow, which
      every active pPLA reference and every intact chromosome-3 SF103 paralog carries (3A
      TraesCS3A02G046500, 3B TraesCS3B02G036800 and 3D TraesCS3D02G033200/033500). The query has
      no G-x-S-x-G motif, and the re-review analysis shows that this is not just a gene-model
      truncation. The 8 kb upstream of the annotated start encodes an N-terminal region matching
      the 3B homoeolog A0A3B6FIU7 at 87% identity, and both have an unrelated segment where the
      nucleophile elbow should be and SIDGGD/SIDGGS where intact paralogs have SIDGGG. A
      protein without the nucleophile cannot carry out patatin-type acyl-ester hydrolysis. No
      other hydrolase domain is present. This is a pseudoenzyme over-annotation by an electronic
      rule, so the annotation is removed. The previous review's MODIFY to carboxylic ester
      hydrolase activity (GO:0052689) is withdrawn for the same reason. The UniProt FUNCTION text
      describing lipolytic acyl hydrolase activity is itself an ARBA prediction and is not
      independent support.
    supported_by:
    - reference_id: PMID:12779324
      supporting_text: "Ser77 and Asp215 were \ncritical for both esterase and bioactivity"
    - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS-rereview.md
      supporting_text: The 3B/3D homoeolog pair
        is therefore predicted to encode a **non-catalytic patatin-like protein**
    - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS.md
      supporting_text: Without the
        nucleophilic Ser, acyl-ester hydrolysis is mechanistically impossible
