      the QuickGO GOA pull used to seed this review, so they are recorded here as
      out-of-band evidence rather than as existing_annotations entries.'
    supporting_text: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'GO_Central phylogenetic (PAINT/IBA) annotation reference. The UniProt record
      lists IBA GO:0004620 glycerophospholipase activity and GO:0047372 monoacylglycerol lipase
      activity, propagated from the eukaryote-level PAINT node PTN001282408 (seeded by
      Arabidopsis AT4G37050, AT4G37060 and AT4G37070; interpro/panther/PTHR32176/PTHR32176-paint.tsv).
      2026-10-20 re-review: the node placement is sound for the family, but this descendant has
      lost the catalytic serine, so the propagated lipase activities are not expected to hold for
      this product. This is a target-specific loss that PAINT propagation does not detect. These
      IBA rows are not in the GOA seed and are therefore not reviewed as existing annotations;
      the reference is no longer used as support for any function.'
- id: PMID:12779324
  title: 'The crystal structure, mutagenesis, and activity studies reveal that patatin
    is a lipid acyl hydrolase with a Ser-Asp catalytic dyad'
  findings:
  - statement: Patatin is a lipid acyl hydrolase that uses a non-classical Ser-Asp
      catalytic dyad rather than the canonical Ser-His-Asp triad; this defines the
      catalytic mechanism of the patatin/PNPLA domain family to which this wheat protein
      belongs.
    supporting_text: patatin has a Ser-Asp catalytic dyad
  - statement: Mutation of the catalytic serine or aspartate abolishes patatin esterase activity,
      so a patatin-family protein lacking the serine is not expected to be an active hydrolase.
    supporting_text: "Ser77 and Asp215 were \ncritical for both esterase and bioactivity"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (PMID:12779324). Defines the Ser-Asp dyad of the patatin
      family. Used in the re-review to argue that loss of the serine in this product precludes
      patatin-type hydrolase activity.
- id: PMID:16297072
  title: A pathogen-inducible patatin-like lipid acyl hydrolase facilitates fungal
    and bacterial host colonization in Arabidopsis
  findings:
  - statement: Plant patatin-like proteins (e.g. Arabidopsis PLP2) are pathogen-inducible
      cytoplasmic lipid acyl hydrolases with broad substrate specificity that contribute
      to lipid-based signaling in plant-pathogen interactions; this is the basis for
      the family-level "plant defense" association but has not been shown for this
      wheat protein.
    supporting_text: PLP2 encodes a cytoplasmic lipid acyl hydrolase with wide substrate
      specificity
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (PMID:16297072). Characterises Arabidopsis PLP2/pPLAIIalpha
      (O48723), which by the PANTHER tree is an out-paralog of this protein (separated at
      duplication node PTN009133995), not an ortholog. Background only; not used as support
      for any annotation in the re-review.
- id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-deep-research-falcon.md
  title: 'Deep research report: PNPLA domain-containing protein A0A3B6GK97 in wheat
    (Triticum aestivum) - family-level functional annotation from scientific literature'
  findings:
  - statement: Plant PNPLA/patatin proteins function as calcium-independent phospholipases
      with lipase/phospholipase A-type activities. Their primary roles include lipid
      mobilization during seed germination, membrane phospholipid turnover, and stress
      adaptation. Substrate specificity includes phosphatidylcholine, phosphatidylserine,
      triacylglycerols, and lysophospholipids.
    supporting_text: The best-supported plant functions are lipid mobilization during
      seed germination, initiation of storage-oil breakdown, membrane phospholipid
      turnover, and remodeling of LD surfaces to allow access of TAG lipases
  - statement: No direct literature exists for A0A3B6GK97; all functional inferences
      are family-level, drawn from rice OsPLB, Arabidopsis PLP/pPLA, rapeseed patatin-like
      lipase, and potato patatin studies.
    supporting_text: Direct literature on the wheat protein A0A3B6GK97 is not available
      in the current scientific literature
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Edison/falcon deep research report. Family-level review of plant
      PNPLA/patatin proteins; confirms that no gene-specific literature exists. Its family-level
      functions assume catalytic competence and so do not transfer to this non-catalytic
      member; no longer used as support in the re-review.
- id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS.md
  title: 'Bioinformatics analysis: pPLA subfamily placement and catalytic-site integrity
    of A0A3B6GK97'
  findings:
  - statement: By sequence identity (42-50% to pPLAII / rice pPLAs vs ~23% to pPLAIII and
      ~16% to pPLAI) and neighbour-joining placement, A0A3B6GK97 belongs to the pPLAII
      subfamily of plant patatin-related phospholipase A - the soluble lipid-acyl-hydrolase
      (defense/wounding/stress) clade - not pPLAIII (galactolipase/growth) or pPLAI
      (iPLA2-like). The single-domain architecture and this placement make a membrane
      trafficking role very unlikely.
    supporting_text: A0A3B6GK97 belongs to the pPLAII subfamily
  - statement: The modeled 302-aa sequence LACKS the N-terminal half of the patatin catalytic
      domain - both the oxyanion glycine-rich block (DGGG) and the catalytic-serine
      nucleophile elbow (G-T-S-T-G) are absent (zero G-x-S-x-G motifs in 302 aa), while the
      catalytic Asp is retained. As modeled the protein is predicted catalytically inactive;
      most parsimoniously an incomplete/incorrect gene model, though a genuine degenerate
      pseudo-enzyme cannot be excluded from sequence alone.
    supporting_text: the modeled 302-aa sequence lacks the entire N-terminal half of the patatin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible in-repo analysis (MSA of 13 characterized plant pPLAs + query).
      Its catalytic-site result stands. Its "pPLAII subfamily" placement holds only in the broad
      sense of the pPLAII-type clade; the PANTHER tree (RESULTS-rereview.md) shows the protein is
      not an ortholog of any Arabidopsis pPLAII gene. Its open question (gene-model artifact vs
      genuine loss) is answered by RESULTS-rereview.md - the model is incomplete, and the locus
      still lacks the catalytic serine. The second finding's quote was corrected in the re-review
      to a verbatim substring of RESULTS.md.
- id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS-rereview.md
  title: 'Re-review analysis (2026-10-20): gene model, homoeologs and phylogenetic placement
    of A0A3B6GK97'
  findings:
  - statement: The 302-aa TraesCS3D02G033600 model is incomplete; genomic sequence about 1.5 kb
      upstream encodes an N-terminal region matching the 444-aa 3B homoeolog A0A3B6FIU7.
    supporting_text: The 302-aa model is an incomplete gene model
  - statement: Neither the reconstructed 3D N-terminus nor the 3B homoeolog carries the catalytic
      serine elbow or the canonical oxyanion glycines, so the product is predicted to be a
      non-catalytic patatin-like protein.
    supporting_text: Even the reconstructed full-length product, and the full-length 3B homoeolog,
      lack the catalytic serine nucleophile and the canonical oxyanion glycines.
  - statement: In the PANTHER 19 tree the protein sits in grass-specific subfamily SF103, sister
      to rice PLP2, and is separated from the Arabidopsis pPLAII proteins by duplication node
      PTN009133995.
    supporting_text: A0A3B6GK97 is therefore
      not an ortholog of any Arabidopsis pPLAII protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible re-review analysis (UniProt and Ensembl REST, PANTHER tree API).
      Exon structure is inferred from protein-to-genome similarity, not spliced alignment, and
      expression was not examined.
- id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-uniprot.txt
  title: UniProtKB entry A0A3B6GK97
  reference_review:
