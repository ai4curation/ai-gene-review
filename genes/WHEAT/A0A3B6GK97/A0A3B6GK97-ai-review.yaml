core_functions: []
proposed_new_terms: []
suggested_questions:
- question: Is TraesCS3D02G033600 expressed, and does its transcript include the upstream
    N-terminal exons that match the 3B homoeolog TraesCS3B02G036500?
- question: Do the 3B/3D homoeologs (TraesCS3B02G036500, TraesCS3D02G033600) encode a stable
    non-catalytic patatin-like protein with a function of its own (for example lipid binding,
    or regulation of active paralogs in the same cluster), or are they degenerating copies?
- question: Should the IBA lipase annotations (GO:0004620, GO:0047372) propagated from PAINT
    node PTN001282408 be blocked for SF103 members that have lost the catalytic serine, such as
    A0A3B6GK97 and A0A3B6FIU7?
suggested_experiments:
- description: Map RNA-seq reads and full-length transcripts to the TraesCS3D02G033600 and
    TraesCS3B02G036500 loci to establish expression and the true exon structure, and check
    whether the reconstructed N-terminus is translated.
  experiment_type: transcriptomics / gene model curation
- description: Express the full-length homoeolog product and an intact paralog (for example
    TraesCS3A02G046500) and compare acyl hydrolase activity against phospholipids,
    galactolipids and acylglycerols, to test the prediction that the serine-less protein is
    inactive. Restoring the G-T-S-T-G elbow would test whether the serine alone accounts for
    any difference.
  experiment_type: in vitro enzyme assay
