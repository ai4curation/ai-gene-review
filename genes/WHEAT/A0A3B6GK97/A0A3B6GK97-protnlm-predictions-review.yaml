      label: lipase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        The existing reproducible sequence alignment and motif scan place this protein with plant patatins
        but show a missing N-terminal catalytic region, including the serine nucleophile and oxyanion
        block. Structural and mutational work establishes the patatin Ser-Asp catalytic dyad (PMID:12779324),
        so the missing serine region argues against lipase activity in the deposited 302-residue sequence.
        This is target-specific contrary evidence despite the more specific lipase IBAs in the cached
        UniProt record. Whether the deficiency reflects an incomplete gene model or a biological inactive
        protein remains unresolved.
