      summary: >-
        The reproducible alignment supports a patatin-family relationship but shows that the deposited
        sequence lacks the catalytic serine region. Thus, lipid hydrolysis by the encoded protein cannot
        be assumed from family membership. The predicted biological process could still apply through
        a noncatalytic role or to a corrected full-length gene model, neither of which is established
        by the inspected evidence. Lipid catabolic process is not present as an equivalent annotation
        in the cached records and remains uncertain.
