id: A0A3B6GK97
gene_symbol: A0A3B6GK97
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  Patatin-like (PNPLA) protein of the grass-specific PANTHER subfamily PTHR32176:SF103. The
  deposited 302-residue model is incomplete, but neither the upstream genomic sequence that
  probably encodes its N-terminus nor the full-length 3B homoeolog carries the catalytic serine
  nucleophile or the canonical oxyanion glycines, so the product is predicted to be a
  non-catalytic patatin-like protein. Lipase activity is contradicted, and participation in
  lipid catabolism is unresolved.
