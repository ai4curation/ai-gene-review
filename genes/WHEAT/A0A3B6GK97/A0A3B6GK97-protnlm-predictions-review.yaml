  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0016298
      label: lipase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      error_type: PSEUDOENZYME_OVERANNOTATION
      confidence_score: 0
      summary: >-
        Patatin-family acyl-ester hydrolysis depends on a Ser-Asp catalytic dyad, and mutation of
        the serine abolishes esterase activity (PMID:12779324). The deposited 302-residue model
        lacks the N-terminal catalytic region, and the gene-model analysis shows that this is not
        only a truncation artifact: the upstream genomic sequence that probably encodes the true
        N-terminus and the full-length 3B homoeolog both lack the G-T-S-T-G nucleophile elbow and
        the canonical DGGG oxyanion block, while intact paralogs in the same chromosome-3 cluster
        retain them. The protein is therefore predicted to be a non-catalytic patatin-like
        protein, and lipase activity is refuted. The gene review removes the electronic hydrolase
        activity annotation on these grounds. The lipase IBAs in the UniProt record propagate
        from a family-level PAINT node and do not detect this target-specific loss of the
        catalytic serine. No experimental data exist for this protein.
      supported_by:
