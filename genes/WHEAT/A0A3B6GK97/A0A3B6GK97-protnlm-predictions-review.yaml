  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0016042
      label: lipid catabolic process
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Lipid catabolic process is not carried by this gene in GOA; the gene has only the broader
        InterPro2GO lipid metabolic process annotation, which the gene review marks as
        over-annotated. Patatin-family membership would place the protein in lipid catabolism
        through acyl-ester hydrolysis, but the locus lacks the catalytic serine nucleophile and
        canonical oxyanion glycines, so hydrolysis by this protein cannot be assumed. A
        non-catalytic participant (for example a lipid-binding or regulatory role alongside the
        active paralogs in the same cluster) could still be involved in the process, so the
        absence of catalysis does not refute the term. No expression, interaction or phenotype
        data exist for this protein, and no literature on it was found, so the prediction can be
        neither validated nor refuted.
