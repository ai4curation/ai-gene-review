id: A0A3B6GK97
gene_symbol: A0A3B6GK97
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval against the SwissProt GO-annotation index for this
  patatin/PNPLA-domain protein from bread wheat. The three top-ranked GO sentences are
  phospholipase activity, oxylipin biosynthetic process and calcium-independent
  phospholipase A2 activity. ProTrek recovers the patatin family's acyl-hydrolase
  chemistry correctly and at a useful level of specificity - "phospholipase activity"
  is a genuine refinement over GOA's bare hydrolase activity and is more specific than
  ProtNLM2's "lipase activity" for the same protein - but its second hit assigns an
  oxylipin biosynthetic role that belongs to the pPLAIII/JA-pathway branch rather than
  the pPLAII defense-stress clade this protein sits in, and its third hit resolves to a
  GO term that has since been obsoleted. As with all assignments for this entry, the
  deposited 302-aa model lacks the catalytic-serine nucleophile elbow, so every call is
  a family-level inference rather than a property of this sequence.
  Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/WHEAT/A0A3B6GK97/A0A3B6GK97-uniprot.txt
