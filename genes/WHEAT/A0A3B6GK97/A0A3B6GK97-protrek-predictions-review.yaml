predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0120569
      label: phospholipase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (ProTrek score 13.35). GOA carries only the generic hydrolase
        activity (GO:0016787, IEA/ARBA) plus lipid metabolic process; phospholipase
        activity is a strict descendant and states the actual chemistry of the patatin
        fold. It is consistent with the GO_Central IBA annotations on this family
        (glycerophospholipase GO:0004620, monoacylglycerol lipase GO:0047372) and with
        the in-repo bioinformatics placing the protein in the pPLAII soluble
        acyl-hydrolase clade. Novel with respect to this protein's GOA and more specific
        than ProtNLM2's lipase activity call on the same protein.
      supported_by:
        - reference_id: PMID:12779324
          supporting_text: Patatin is a nonspecific lipid acyl hydrolase
        - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS.md
          supporting_text: A0A3B6GK97 belongs to the pPLAII subfamily
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0031408
      label: oxylipin biosynthetic process
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 11.59). Oxylipin biosynthesis is the signature of the pPLAIII
        subfamily and of the jasmonate-pathway lipases that release the alpha-linolenic
        acid precursor; it is not a property of the pPLAII defense-stress clade to which
        this protein belongs, and no oxylipin-pathway role is supported anywhere in the
        review for this entry. The prediction is a subfamily confusion within the
        patatin family - the retrieval finds the family neighbourhood but not the
        correct branch of it.
      supported_by:
        - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-bioinformatics/RESULTS.md
          supporting_text: A0A3B6GK97 belongs to the pPLAII subfamily
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047499
      label: calcium-independent phospholipase A2 activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 11.09). Biologically this is the right idea - plant patatin-related
        phospholipases are calcium-independent PLA enzymes - but the term was obsoleted
        in GO after ProTrek's text index was built, so the prediction cannot be recorded
        as a current annotation. It also cannot be confirmed for this entry: the deposited
        302-aa model lacks the catalytic-serine nucleophile elbow, so PLA2 regiospecificity
        is not testable from the sequence as modelled. Kept as UNC rather than scored
        against the ontology, since the failure is an index/ontology-drift artefact
        overlaid on a genuinely unverifiable specificity claim.
      supported_by:
        - reference_id: file:WHEAT/A0A3B6GK97/A0A3B6GK97-deep-research-falcon.md
          supporting_text: >-
            Plant PNPLA/patatin proteins function as calcium-independent phospholipases with
            lipase/phospholipase A-type activities acting on phospholipids, galactolipids, triacylglycerols,
            and lysophospholipids
