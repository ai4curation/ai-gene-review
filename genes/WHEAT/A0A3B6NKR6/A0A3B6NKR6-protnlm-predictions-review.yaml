id: A0A3B6NKR6
gene_symbol: A0A3B6NKR6
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  A0A3B6NKR6 is a full-length bread wheat member of the plant glucuronokinase subfamily
  (PANTHER PTHR38710:SF1) of GHMP kinases, with both GHMP kinase domains. By subfamily-level
  orthology to biochemically characterised Arabidopsis GLCAK1, it is expected to phosphorylate
  D-glucuronic acid at C1 with ATP. The single ProtNLM2 prediction, the broad process
  phosphorylation, is correct and novel relative to GOA, which carries only cytosol, ATP
  binding and an erroneous mevalonate-pathway mapping for this gene.
