    predicted_term:
      id: GO:0016310
      label: phosphorylation
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The target is in PANTHER subfamily PTHR38710:SF1 together with Arabidopsis GLCAK1, which
        was shown with recombinant protein to phosphorylate D-glucuronic acid to
        D-glucuronate-1-phosphate using ATP (PMID:19951951). The wheat protein keeps both GHMP
        kinase domains and the glucuronokinase-like signature, so the transfer of ATP-dependent
        sugar phosphorylation is a justified phylogenetic inference. The gene review proposes
        glucuronokinase activity (GO:0047940) and UDP-glucuronate biosynthetic process as NEW
        annotations on the same basis. A wheat study overexpressed the three hexaploid-wheat
        GlcAK homoeologs in Arabidopsis and reported metabolic phenotypes, but its abstract
        reports no kinase assay (PMID:36931562). GOA carries no phosphorylation term or
        descendant for this gene; it has only cytosol, ATP binding and a mevalonate-pathway
        mapping that the gene review removes. The prediction is therefore novel. It is broad,
        and a more informative annotation would name the glucuronate substrate.
