- term:
    id: GO:0006065
    label: UDP-glucuronate biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:19951951
  qualifier: involved_in
  review:
    summary: >-
      Glucuronokinase catalyses a step of UDP-glucuronate synthesis by the myo-inositol
      oxygenation route. It makes GlcA-1-phosphate, which UDP-sugar pyrophosphorylase then
      converts to UDP-GlcA. The gene product therefore does part of the work of the pathway
      itself; it is not merely a required input. Comparator check: the Arabidopsis
      UDP-glucose dehydrogenases (UGD2, UGD4), which catalyse the other route to UDP-GlcA,
      carry GO:0006065 by IDA. Arabidopsis GLCAK1 currently has only TAS
      inositol-metabolism and cell-wall terms, so this process term is not yet on the
      characterised ortholog.
    action: NEW
    reason: >-
      This is a catalytic participation in the pathway, which meets the participation test.
      It is proposed conservatively at the level of the UDP-GlcA product, not of downstream
      cell-wall or pollen phenotypes.
    supported_by:
    - reference_id: PMID:19951951
      supporting_text: It is the last missing enzyme in the myo-inositol oxygenation pathway to UDP-GlcA
core_functions:
- description: >-
    ATP-dependent glucuronokinase that phosphorylates D-glucuronic acid at C1 to give
    1-phospho-alpha-D-glucuronate in the cytosol. This step of the myo-inositol oxygenation
    and glucuronate-salvage route to UDP-glucuronic acid supplies nucleotide-sugar
    precursors for cell-wall polysaccharides. The function is inferred by subfamily-level
    orthology to biochemically characterised Arabidopsis GLCAK1.
  supported_by:
  - reference_id: PMID:19951951
    supporting_text: AtGlcAK is a novel plant sugar kinase able to phosphorylate d-GlcA to d-GlcA-1-phosphate in the presence of ATP.
