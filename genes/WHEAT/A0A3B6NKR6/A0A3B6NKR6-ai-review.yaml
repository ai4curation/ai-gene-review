- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      This row comes from a UniPathway cross-reference (UPA00057, isopentenyl diphosphate
      biosynthesis via the mevalonate pathway). That pathway mapping appears to be inherited
      from mevalonate kinase, another GHMP family. The same PANTHER data list a PAINT node,
      PTN000048555, seeded by mevalonate kinases, with GO:0019287 and mevalonate kinase
      activity. A0A3B6NKR6 belongs to the glucuronokinase family PTHR38710, not to the
      mevalonate kinase family. Its characterised Arabidopsis ortholog is a sugar-1-kinase
      that is highly specific for D-glucuronic acid. Neither Arabidopsis glucuronokinase
      carries a mevalonate-pathway annotation in GOA.
    action: REMOVE
    reason: >-
      The electronic pathway mapping is demonstrably wrong for this family. Glucuronokinase
      phosphorylates D-glucuronic acid and acts in nucleotide-sugar metabolism, not in
      isoprenoid precursor synthesis. Plants make mevalonate with a separate mevalonate kinase
      from a different GHMP family. The annotation comes from GHMP-superfamily membership
      rather than from the glucuronokinase clade.
