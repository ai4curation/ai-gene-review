suggested_questions:
- question: >-
    PAINT node PTN000048555, seeded by mevalonate kinases, is attached to PTHR38710 and
    propagates cytosol to glucuronokinases. Should the cytosol IBD for glucuronokinases be
    re-anchored on a glucuronokinase node, for example PTN008680403?
- question: >-
    Does UniPathway UPA00057, the mevalonate pathway, still map to PTHR38710 members, and
    can that pathway cross-reference be withdrawn for the glucuronokinase family?
suggested_experiments:
- description: >-
    Express recombinant A0A3B6NKR6 and assay ATP-dependent phosphorylation of D-glucuronic
    acid, with D-galacturonic acid, galactose and mevalonate as negative controls. This
    would confirm the orthology-based assignment in a grass.
