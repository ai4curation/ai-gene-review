  review:
    summary: >-
      Cytosolic localisation fits a soluble sugar-1-kinase that has no predicted targeting
      or membrane-spanning sequence. The characterised Arabidopsis ortholog was likewise
      predicted to be cytosolic. However, the PAINT node behind this IBA (PTN000048555) is
      seeded by mevalonate kinases (mouse and rat Mvk, yeast ERG12), not by glucuronokinases,
      and it does not occur in the PTHR38710 tree. The inference therefore rests on the GHMP
      superfamily, not on the glucuronokinase clade. One experimental report placed a
      YFP-tagged Arabidopsis paralog GLCAK2 at the plasma membrane, ER and tonoplast in
      transient tobacco expression; that has not been reproduced and does not fit the
      protein's lack of membrane features.
    action: ACCEPT
    reason: >-
      Cytosol is the most plausible compartment for this soluble enzyme. It is consistent
      with the sequence features and with the prediction made for the characterised
      Arabidopsis ortholog, so I accept it. The donor node is a mevalonate-kinase node
      (recorded in the bioinformatics results); this is a weakness of the provenance but not
      evidence against the location.
