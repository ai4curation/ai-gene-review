    review_notes: >-
      Full text cached (PMC2823444). The authors purified the lily pollen enzyme, cloned
      Arabidopsis At3g01640 (GLCAK1, Q93ZC9) and characterised the recombinant protein:
      strict D-GlcA specificity, ATP as donor, Mg2+. This is the experimental source for the
      orthology-based transfer.
  findings:
  - statement: Recombinant Arabidopsis glucuronokinase phosphorylates D-glucuronic acid to D-glucuronic acid-1-phosphate using ATP, with strict substrate specificity.
    supporting_text: The Arabidopsis enzyme only catalyzed the conversion of d-GlcA into its corresponding sugar-1-phosphate but failed to utilize any other monosaccharide tested in the assays
