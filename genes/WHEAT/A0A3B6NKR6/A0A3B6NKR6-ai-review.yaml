taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
description: >-
  A0A3B6NKR6 (TraesCS6A02G071400, chromosome 6A) is a 360-residue bread wheat member of the
  plant glucuronokinase family (PANTHER PTHR38710, subfamily SF1) within the GHMP kinase
  superfamily. It has the GHMP kinase N-terminal and C-terminal domains and the conserved
  glycine-rich phosphate-binding loop, and is full length relative to the characterised
  Arabidopsis glucuronokinases GLCAK1 and GLCAK2, with which it shares about 65% identity.
  By orthology to Arabidopsis GLCAK1 (and the enzyme purified from lily pollen), it is
  expected to phosphorylate D-glucuronic acid at C1 with ATP to give
  1-phospho-alpha-D-glucuronate. This is the step that links the myo-inositol oxygenation
  pathway, and glucuronic-acid salvage, to UDP-glucuronic acid, the precursor of UDP-xylose,
  UDP-arabinose and UDP-galacturonic acid for cell-wall polysaccharides. The protein has no
  predicted signal peptide, transit peptide or transmembrane segment and is expected to be
  cytosolic. The wheat protein itself has not been characterised experimentally.
