id: A0A3B6NKR6
gene_symbol: A0A3B6NKR6
taxon:
  id: NCBITaxon:4565
  label: Triticum aestivum
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a wheat GHMP-kinase family protein that this
  review identifies as a predicted glucuronokinase of the myo-inositol oxidation pathway.
  The top hit is glucuronokinase activity - an exact match to the core molecular function,
  absent from GOA - and the free-text Function channel returns the Arabidopsis GLAK
  description verbatim ("Sugar-1-kinase with a strict substrate specificity for
  D-glucuronic acid and ATP"). What makes this case notable is rank 2: the model also
  returns isopentenyl diphosphate biosynthesis via the mevalonate pathway, which is the
  term GOA already carries by IEA and which this review regards as the wrong branch of
  the GHMP family for this protein. So ProTrek's own top two calls straddle a real
  annotation dispute, and the correct side wins on score by 1.1 units - useful, but not
  a margin a pipeline could rely on. ProtNLM2 predicted only "phosphorylation" here.
  Assessment: 1 correct novel (COR), 2 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/WHEAT/A0A3B6NKR6/A0A3B6NKR6-uniprot.txt
  - genes/WHEAT/A0A3B6NKR6/A0A3B6NKR6-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047940
      label: glucuronokinase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 16.31), an exact match to this review's core molecular function
        and absent from GOA. The assignment rests on the glucuronokinase-like domain
        (IPR053034) alongside the GHMP N- and C-terminal domains and on homology to
        Arabidopsis GLAK2 (Q9LY82). Correct, specific and novel; it also implicitly disputes
        the existing IEA annotation, which places the protein in the mevalonate pathway.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0019287
      label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 15.24). Mechanically an exact match to GOA, which would normally score
        as correct-but-not-novel; it is scored PLI instead because this review concludes the
        existing IEA annotation is itself a paralog error. The GHMP kinase superfamily
        contains both the mevalonate-pathway kinases (mevalonate kinase, phosphomevalonate
        kinase - which ProTrek also returns at ranks 3 and 4) and the sugar-1-kinases; the
        InterPro evidence places this protein with the latter. The case is a caution for
        automated scoring against GOA: agreeing with an existing annotation is not the same
        as being right.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004631
      label: phosphomevalonate kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 15.07), with mevalonate kinase activity behind it at rank 4. Both are
        the mevalonate-branch specificities of the GHMP superfamily and both contradict the
        rank-1 call; the model offers the sugar kinase and the two isoprenoid kinases within
        1.3 score units of each other. Discriminating them is exactly the subfamily judgement
        that determines whether this protein belongs to cell-wall precursor supply or to
        isoprenoid biosynthesis, and the ranked list does not settle it.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
