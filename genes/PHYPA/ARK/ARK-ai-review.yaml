gene_symbol: ARK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3218
  label: Physcomitrium patens
description: ARK (also called ANR) is a PAS- and EDR-domain-containing Raf-like serine/threonine protein
  kinase in the moss Physcomitrium patens. It acts mainly in the cytosol upstream of subclass III SnRK2
  kinases to couple abscisic acid and osmotic stress to protective gene expression and dehydration tolerance.
  Recombinant ARK directly phosphorylates and activates PpSnRK2B, including its activation-loop serines;
  PpSnRK2D is also a demonstrated substrate. ABA stimulates phosphorylation of ARK Ser1029, which is required
  for normal signaling. ARK activation in moss therefore differs from the constitutive activity of Arabidopsis
  B2 RAFs. Loss of ARK compromises ABA-induced LEA protein accumulation, stress tolerance, and protonemal
  growth responses.
