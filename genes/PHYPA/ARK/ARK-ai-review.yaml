core_functions:
- description: Cytosolic Raf-like serine/threonine kinase that phosphorylates and activates subclass III
    SnRK2 proteins, positively regulating ABA and osmotic-stress signaling and protective transcription.
    Direct biochemical substrates include PpSnRK2B and PpSnRK2D; the moss ARK activation loop is itself
    regulated by ABA.
