description: 'GT47A (PpGT47A) is the single IRX10/XYS1-clade glycosyltransferase family 47
  protein of the moss Physcomitrium patens. The recombinant moss IRX10 homolog is a robust
  beta-1,4-xylan xylosyltransferase in vitro, more active than Arabidopsis IRX10, and the
  moss wall contains a glucuronoxylan with GlcA side chains. PpGT47A is expressed mainly in
  newly formed and expanding tissues of protonema and gametophores rather than in conducting
  tissue. A gt47a knockout has no visible phenotype and no detectable change in gametophore
  wall sugars, and PpGT47A only partly rescues the Arabidopsis irx10 irx10-L double mutant:
  growth improves but stem xylose stays low. It is therefore an active xylan synthase whose
  in vivo contribution in moss is minor or conditional, and it represents the IRX10 clade
  before its recruitment to vascular secondary walls.'
