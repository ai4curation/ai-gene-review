suggested_questions:
- question: Is moss glucuronoxylan reduced in gt47a knockouts when measured by xylan-specific
    methods (xylanase fingerprinting, antibody labelling) rather than total monosaccharides?
- question: Does PpGT47A partly rescue Arabidopsis irx10 irx10-L because it fails to partner
    Arabidopsis IRX9/IRX14, and does Physcomitrium have its own GT43 partners?
suggested_experiments:
- description: Xylanase-based oligosaccharide fingerprinting and LM10/LM11 immunolabelling
    of gt47a knockout gametophores and protonema.
  hypothesis: PpGT47A makes the moss glucuronoxylan backbone; loss lowers xylan below the
    sensitivity of total monosaccharide analysis.
  experiment_type: cell wall analysis
