gene_symbol: PINB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3218
  label: Physcomitrium patens
description: PINB is a canonical long-loop PIN auxin exporter in the moss Physcomitrium patens (historically
  Physcomitrella patens). It acts partly redundantly with PINA in auxin distribution, gametophore development
  and shoot tropisms, and makes a prominent contribution to sporophyte development. PINB reaches the plasma
  membrane, but native-promoter PINB-GFP has a more even membrane distribution and stronger intracellular
  signal than PINA in protonemata; polarity depends on tissue and expression context. Native double-mutant
  export phenotypes and conserved PIN-family transport activity support its biochemical role. During early
  phyllid growth, PINA and PINB mainly regulate intracellular auxin levels rather than driving basipetal
  transport; basal polarity appears later in differentiated tip cells.
