  label: Physcomitrium patens
description: 'SRK2A (PpSnRK2A/PpOST1) is a subclass III SNF1-related serine/threonine protein kinase of
  Physcomitrium patens, encoded by Pp3c5_21160. ABA and osmotic stress activate its kinase activity, and
  targeted loss reduces the ABA- and salt-activated SnRK2 pool. SRK2A functions redundantly with the other
  three moss SnRK2 kinases in ABA-dependent protonemal responses: its reintroduction restores ABA sensitivity
  to a quadruple SnRK2 knockout. The moss subclass III SnRK2 system couples ABA and upstream ARK signaling
  to protective transcription and dehydration tolerance. Direct ARK substrate phosphorylation has been
  demonstrated for other moss paralogs, especially SnRK2B and SnRK2D; the SRK2A-specific evidence establishes
  kinase activity and functional complementation.'
