- id: PMID:36696950
  title: A Physcomitrella PIN protein acts in spermatogenesis and sporophyte retention.
  findings:
  - statement: Current locus mapping identifies PINA as Pp3c23_10200 and PINB as Pp3c24_2970. Its PINC
      reproductive phenotypes are not assigned to PINA/PINB.
- id: PMID:19506555
  title: Subcellular homeostasis of phytohormone auxin is mediated by the ER-localized PIN5 transporter.
  findings:
  - statement: Historical PIN5/ER study cited by PMID:25448003 for heterologous PINA ER localization.
      Normal retrieval is abstract-only and does not resolve the native PINA construct/context independently.
- id: PMID:41984944
  title: Morphogenesis of moss leaf-like organs through variations in deeply shared developmental principles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native time-lapse study inspected, including PINA/PINB reporter localization, CRISPR
      double-mutant R2D2 experiments and growth modeling. Distinguishes early growing phyllids from later
      differentiated tip polarity; modeling did not explicitly simulate auxin transport. The inference
      of outward export is not an isolated-transporter flux measurement.
  findings:
  - statement: PINA and PINB lack clear basal polarization in early growing phyllids; previously reported
      polar or bipolar localization is restricted to later differentiated tip cells.
  - statement: Double-mutant auxin sensing and cellular growth analyses support regulation of intracellular
      auxin availability. They do not establish PIN-driven basipetal transport in early phyllids.
core_functions:
- description: Plasma-membrane auxin export regulating intracellular auxin availability and development
    in moss. In early growing phyllids, export limits intracellular auxin rather than directing basipetal
    tissue transport; polarity varies with tissue and developmental stage.
