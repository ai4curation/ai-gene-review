gene_symbol: PINA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3218
  label: Physcomitrium patens
description: PINA is a canonical long-loop PIN auxin exporter in the moss Physcomitrium patens (historically
  Physcomitrella patens). It localizes at the plasma membrane, with polar enrichment at protonemal tips
  and context-dependent distribution in leaves. Native mutant combinations with PINB affect auxin distribution,
  gametophore leaf development and shoot tropisms. Radioactive auxin-export assays with induced PINA-GFP
  in moss support its exporter activity. PINA contributes more strongly than PINB to some auxin-sensitive
  gametophore phenotypes, while their reproductive contributions differ. During early leaf-like organ
  (phyllid) growth, PINA and PINB mainly regulate intracellular auxin levels; basal polarity appears only
  later in differentiated tip cells, so export does not imply directional transport at every developmental
  stage.
