id: Q93HW4
gene_symbol: benB
product_type: PROTEIN
aliases:
  - RHA1_ro02385
status: COMPLETE
taxon:
  id: NCBITaxon:101510
  label: Rhodococcus jostii RHA1
description: >-
  benB of Rhodococcus jostii RHA1 encodes the beta (small) subunit of the
  oxygenase component of benzoate 1,2-dioxygenase. It belongs to the
  benzoate-specific BenB family of ring-hydroxylating dioxygenase beta
  subunits and, with the catalytic BenA alpha subunit and the BenC reductase,
  forms the enzyme that dihydroxylates benzoate to the cis-dihydrodiol that
  BenD converts to catechol. RHA1 benABCD expressed in Escherichia coli
  convert benzoate to catechol.
existing_annotations:
  - term:
      id: GO:0018623
      label: benzoate 1,2-dioxygenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    supporting_entities:
      - EC:1.14.12.10
    review:
      summary: >-
        The activity is that of the oxygenase complex to which BenB belongs;
        the beta subunit lacks the redox centres and contributes to rather
        than independently enables it.
      action: ACCEPT
      reason: >-
        Correct activity for the enzyme of which BenB is an integral subunit
        (BenB family TIGR03232), supported by heterologous reconstitution of
        RHA1 benABCD. The EC mapping assigns enables to each subunit; for a
        non-catalytic subunit the relation should be contributes_to, as
        recorded in core_functions.
      supported_by:
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
        - reference_id: file:RHOJR/benB/benB-uniprot.txt
          supporting_text: NCBIfam; TIGR03232; benzo_1_2_benB; 1.
      source_defects:
        - defect_type: WRONG_QUALIFIER
          resource: GOA_EBI
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: CONFIRMED
          explanation: >-
            The row is generated by EC-number mapping, which assigns the
            holoenzyme's EC 1.14.12.10 to every subunit that carries it and so
            emits enables for each. BenB is a non-catalytic subunit: it has no
            Rieske cluster and no mononuclear iron, and the active site lies in
            the BenA alpha subunit. GO's contributes_to relation exists for
            exactly this case, a subunit of a complex that carries the complex's
            activity without enabling it alone.
  - term:
      id: GO:0019380
      label: 3-phenylpropionate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002447682
    review:
      summary: >-
        TreeGrafter propagation from HcaF-type beta subunits in the broad
        PANTHER beta-subunit lineage; RHA1 BenB is in the benzoate-specific
        family and its pathway is benzoate catabolism.
      action: REMOVE
      reason: >-
        No evidence links RHA1 BenB to 3-phenylpropionate catabolism; it is
        classified in the benzoate dioxygenase small-subunit family and its
        operon converts benzoate to catechol.
      supported_by:
        - reference_id: file:RHOJR/benB/benB-uniprot.txt
          supporting_text: NCBIfam; TIGR03232; benzo_1_2_benB; 1.
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
  - term:
      id: GO:0043639
      label: benzoate catabolic process
    evidence_type: IC
    original_reference_id: PMID:11673430
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation for the oxygenase beta subunit; absent from
        GOA for this entry.
      action: NEW
      reason: >-
        BenB is an integral subunit of the oxygenase that performs the first
        step of benzoate catabolism, reconstituted from RHA1 benABCD in E. coli.
      supported_by:
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
