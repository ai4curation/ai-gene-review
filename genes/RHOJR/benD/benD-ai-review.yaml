id: Q93HW2
gene_symbol: benD
product_type: PROTEIN
aliases:
  - RHA1_ro02387
status: COMPLETE
taxon:
  id: NCBITaxon:101510
  label: Rhodococcus jostii RHA1
description: >-
  benD of Rhodococcus jostii RHA1 encodes the NAD+-dependent benzoate cis-diol
  dehydrogenase, a short-chain dehydrogenase/reductase of the BenD family that
  converts 1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate
  (2-hydro-1,2-dihydroxybenzoate), formed by benzoate 1,2-dioxygenase, to
  catechol. RHA1 benABCD expressed in Escherichia coli convert benzoate to
  catechol via this cis-diol intermediate.
existing_annotations:
  - term:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or
        NADP as acceptor
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002460465
    review:
      summary: Correct but general SDR activity; the specific activity is annotated.
      action: MODIFY
      reason: >-
        The supported, more specific descendant is
        1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
        (GO:0047116), which this entry already carries.
      proposed_replacement_terms:
        - id: GO:0047116
          label: 1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
      supported_by:
        - reference_id: file:RHOJR/benD/benD-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: NCBIfam; NF040811; BenD; 1.
  - term:
      id: GO:0030497
      label: fatty acid elongation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002460465
    review:
      summary: >-
        TreeGrafter propagation from FabG-like members of the large SDR
        family; RHA1 BenD is a BenD-family aromatic cis-diol dehydrogenase.
      action: REMOVE
      reason: >-
        Over-propagation across a functionally diverse SDR superfamily. RHA1
        BenD is in the BenD family and its operon converts benzoate to
        catechol; there is no evidence for a role in fatty acid elongation.
      supported_by:
        - reference_id: file:RHOJR/benD/benD-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: NCBIfam; NF040811; BenD; 1.
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
  - term:
      id: GO:0047116
      label: 1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    supporting_entities:
      - EC:1.3.1.25
    review:
      summary: >-
        Core activity: oxidation of the benzoate cis-diol to catechol.
      action: ACCEPT
      reason: >-
        BenD-family membership plus heterologous conversion of benzoate to
        catechol via the cis-diol by RHA1 benABCD; benD is the only
        dehydrogenase in the reconstituting gene set.
      supported_by:
        - reference_id: file:RHOJR/benD/benD-uniprot.txt
          record_section: ["DR:NCBIfam"]
          supporting_text: NCBIfam; NF040811; BenD; 1.
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
  - term:
      id: GO:0043639
      label: benzoate catabolic process
    evidence_type: IDA
    original_reference_id: PMID:11673430
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation; absent from GOA for this entry.
      action: NEW
      reason: >-
        BenD catalyses the second step of benzoate degradation to catechol,
        reconstituted from RHA1 benABCD in E. coli.
      supported_by:
        - reference_id: PMID:11673430
          supporting_text: >-
            Escherichia coli cells containing RHA1 benABCD transformed benzoate
            to catechol via 2-hydro-1,2-dihydroxybenzoate.
