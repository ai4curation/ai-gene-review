taxon:
  id: NCBITaxon:101510
  label: Rhodococcus jostii RHA1
description: >-
  benA of the actinobacterium Rhodococcus jostii RHA1 encodes the alpha
  (large) subunit of the oxygenase component of benzoate 1,2-dioxygenase, the
  enzyme that dihydroxylates benzoate to
  1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate
  (2-hydro-1,2-dihydroxybenzoate) as the first step of benzoate degradation to
  catechol. It has the Rieske [2Fe-2S] domain and catalytic C-terminal domain
  typical of ring-hydroxylating dioxygenase alpha subunits and belongs to the
  benzoate-specific BenA family. RHA1 benABCD expressed in Escherichia coli
  convert benzoate to catechol, and a benA insertion mutant neither grows on
  nor transforms benzoate. The chromosomal benABCDK cluster is related to the
  Acinetobacter baylyi ADP1 ben genes (33-65% identity) and also contributes
  to biphenyl catabolism in this PCB-degrading strain.
