suggested_questions:
  - question: >-
      Which Rieske-loop residue triggers the UniProt ProRule caution in RHA1
      BenA, and does it change the cluster's redox properties relative to
      proteobacterial BenA?
  - question: >-
      Should any gene product of the benABCD locus carry a biphenyl catabolic
      process term? PMID:11673430 reports that the benA mutant RBD169 shows
      diminished growth on biphenyl and concludes the ben genes are essential
      "not only in benzoate catabolism but also in biphenyl catabolism". No
      biphenyl term is proposed here deliberately: benzoate is a product of the
      biphenyl upper pathway (BphABCD), so BenA acts downstream of biphenyl
      degradation on its output rather than performing a step of it, and the
      growth defect is the expected consequence of blocking the pathway that
      consumes benzoate. Under the participation test this is necessity, not
      participation. A curator who disagrees should say which step of biphenyl
      catabolism BenA itself performs.
suggested_experiments:
  - description: >-
      Purify RHA1 BenAB with BenC and measure steady-state kinetics with
      benzoate and 3-chlorobenzoate, together with EPR of the Rieske cluster.
    experiment_type: enzymology and spectroscopy
