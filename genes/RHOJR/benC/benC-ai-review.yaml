    review:
      summary: >-
        Reductase activity of the BenC family (NADH oxidation coupled to
        [2Fe-2S] reduction) that supplies electrons to the oxygenase.
      action: ACCEPT
      reason: >-
        RHA1 BenC has the full ferredoxin-FAD-NAD domain architecture of the
        BenC family and is part of the gene set that reconstitutes benzoate
        dihydroxylation in E. coli; the term is the one used for reviewed BenC
        proteins.
      supported_by:
