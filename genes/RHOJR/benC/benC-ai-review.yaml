status: COMPLETE
taxon:
  id: NCBITaxon:101510
  label: Rhodococcus jostii RHA1
description: >-
  benC of Rhodococcus jostii RHA1 encodes the reductase (electron-transfer)
  component of benzoate 1,2-dioxygenase. Like proteobacterial BenC it has an
  N-terminal plant-type [2Fe-2S] ferredoxin domain followed by FAD- and
  NAD-binding reductase domains (BenC family NF040810), which transfer
  electrons from NADH to the BenAB oxygenase for dihydroxylation of benzoate.
  At 512 residues it is longer than the Acinetobacter and Pseudomonas
  proteins, and InterPro detects a C-terminal FadR/GntR C-terminal-like domain
  of unknown significance. RHA1 benABCD expressed in Escherichia coli convert
  benzoate to catechol.
