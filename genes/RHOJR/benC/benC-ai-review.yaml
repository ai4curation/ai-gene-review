suggested_questions:
  - question: >-
      Is the C-terminal FadR/GntR C-terminal-like extension of RHA1 BenC a
      genuine domain of the native protein (and if so, what does it do), or an
      artefact of the gene model?
suggested_experiments:
  - description: >-
      Express full-length and C-terminally truncated RHA1 BenC, compare their
      ability to support BenAB benzoate dihydroxylation, and test the
      extension for ligand binding.
    experiment_type: truncation analysis and enzymology
