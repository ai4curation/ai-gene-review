knowledge_gaps:
- gap_statement: >-
    The physiological substrate and exact molecular function of BT_4612 remain unverified.
  boundary: >-
    The primary pathway diagram assigns CASDH provisionally and the exact record supports PTHR43796:SF2
    membership. This subfamily also contains CAPADH enzymes; neither the name nor an upstream-pathway
    hypothesis distinguishes putrescine, DAP and agmatine chemistry. An OpenScientist run
    (kgap-bt4612-amine-supply) constrains the substrate only by exclusion, and the exclusion removes
    one of the three candidates. The organism can make agmatine, since a biosynthetic arginine
    decarboxylase is present, and it cannot make 1,3-diaminopropane: a Pfam domain census over all
    4,782 entries of the reference proteome returns zero members of the fold-III ornithine
    decarboxylase and SpeC/SpeF/CadA lysine decarboxylase families, and no protein is annotated to
    either the diaminobutyrate aminotransferase or the diaminobutyrate decarboxylase activity that
    would supply that diamine. Carboxynorspermidine is therefore excluded as a physiological
    product of this enzyme. The same census returns zero for spermidine synthase and for
    S-adenosylmethionine decarboxylase, so the classical spermidine route is absent at family level
    and whatever this enzyme does is this organism's only path to spermidine, which raises the stakes
    of the remaining ambiguity rather than resolving it. Between the two surviving candidates,
    carboxyspermidine and carboxyaminopropylagmatine, amine supply is silent, and the reason is a
    single protein. The genome contains exactly one arginase, agmatinase and ureohydrolase
    superfamily protein, annotated only as an arginase with no EC assigned, and that one protein is
    required by either route: as an agmatinase it makes putrescine upstream of this enzyme, giving
    carboxyspermidine, and as an N1-aminopropylagmatine ureohydrolase it acts downstream on the
    aminopropylagmatine product, giving carboxyaminopropylagmatine. Its specificity is not
    recoverable from sequence: unfiltered alignment scores it at 39, 38, 48 and 96 against human
    arginase, a bacterial arginase, the E. coli agmatinase and a characterised
    N1-aminopropylagmatine ureohydrolase respectively, while those four characterised proteins span
    172 to 257 against each other, so its best match falls below the lowest distance the family's own
    characterised members show. Genomic context does not rescue the question either, the four genes
    of the route being maximally dispersed with no shared operon and no polyamine-related gene within
    four loci of any of them. Two results stand independently of the substrate question, and both
    answer things this gap or its prompt asked for. The enzyme has no paralogue: it is the only
    protein of its Pfam domains and PANTHER family in the proteome, confirmed by an
    annotation-independent proteome-wide alignment, so the count that had to be established before
    interpretation is one. And the cofactor is NADP, assignable from sequence and from the structure
    of a 96.7 per cent identical ortholog, with all 33 cofactor-contacting residues of that structure
    identical here, the 2'-phosphate held by Ser34, Arg35, Thr36, Lys39 and Lys286, and an alanine at
    the end of beta-2 where an NAD-preferring enzyme would carry an acidic residue. Verified here
    against this entry's own record, which is 397 residues: Ala33, Ser34, Arg35, Thr36, Lys39 and
    Lys286, and separately that the carboxyspermidine decarboxylase the run places at the end of this
    route is this corpus's own BT_0674 entry, whose review records that its deletion depletes
    spermidine and decarboxylase activity. Not reproduced here: the proteome-wide Pfam census, the
    alignment scores for the ureohydrolase-family protein and its characterised comparators, the
    paralogue search, the 33-residue cofactor contact set and the identity to the ortholog structure.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: Determines physiological substrate use and the correct pathway assignment.
  resolution: >-
    Purify BT_4612, compare putrescine, DAP and agmatine with ASA and NADPH, verify products by LC-MS,
    and quantify carboxypolyamines and spermidine after deletion/complementation.
