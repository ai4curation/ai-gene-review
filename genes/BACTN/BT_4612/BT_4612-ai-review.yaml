knowledge_gaps:
- gap_statement: >-
    The physiological substrate and exact molecular function of BT_4612 remain unverified.
  boundary: >-
    The primary pathway diagram assigns CASDH provisionally and the exact record supports PTHR43796:SF2
    membership. This subfamily also contains CAPADH enzymes; neither the name nor an upstream-pathway
    hypothesis distinguishes putrescine, DAP and agmatine chemistry.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines physiological substrate use and the correct pathway assignment.
  resolution: >-
    Purify BT_4612, compare putrescine, DAP and agmatine with ASA and NADPH, verify products by LC-MS,
    and quantify carboxypolyamines and spermidine after deletion/complementation.
