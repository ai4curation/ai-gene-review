  label: Bacteroides thetaiotaomicron VPI-5482
description: >-
  Predicted NAD(P)-dependent carboxypolyamine dehydrogenase of the saccharopine dehydrogenase-like family.
  BT_4612 is assigned to PANTHER PTHR43796:SF2 and has the NAD(P)-binding and C-terminal catalytic domains
  of the CASDH/CANSDH/CAPADH group. It is a candidate upstream enzyme in Bacteroides thetaiotaomicron
  spermidine biosynthesis, but its physiological amine substrate and contribution to the native pathway
  have not been experimentally established.
