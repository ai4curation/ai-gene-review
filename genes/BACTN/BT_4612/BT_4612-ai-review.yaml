gene_symbol: BT_4612
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:226186
  label: Bacteroides thetaiotaomicron VPI-5482
description: >-
  Predicted NAD(P)-dependent carboxypolyamine dehydrogenase of the saccharopine dehydrogenase-like family.
  BT_4612 is assigned to PANTHER PTHR43796:SF2 and has the NAD(P)-binding and C-terminal catalytic domains
  of the CASDH/CANSDH/CAPADH group. It is a candidate upstream enzyme in Bacteroides thetaiotaomicron
  spermidine biosynthesis, but its physiological amine substrate and contribution to the native pathway
  have not been experimentally established.
references:
- id: file:BACTN/BT_4612/BT_4612-hypotheses/kgap-bt4612-amine-supply/openscientist.md
  title: OpenScientist analysis of BT_4612 amine supply, paralogue count and cofactor
  findings:
  - statement: >-
      The substrate is constrained only by exclusion, and the exclusion removes one candidate of three.
      The organism can make agmatine but not 1,3-diaminopropane, a proteome-wide Pfam census returning
      no fold-III ornithine decarboxylase, no SpeC/SpeF/CadA lysine decarboxylase and no diaminobutyrate
      route, so carboxynorspermidine is excluded. The same census finds no spermidine synthase and no
      S-adenosylmethionine decarboxylase, so this enzyme's reaction is the organism's only path to
      spermidine. Between carboxyspermidine and carboxyaminopropylagmatine amine supply is silent,
      because the single arginase-superfamily protein in the genome is required by either route and its
      specificity is unrecoverable, its best match to a characterised member falling below the lowest
      distance those members show among themselves. Independently: the enzyme has no paralogue, and the
      cofactor is NADP.
    supporting_text: >-
      Carboxynorspermidine is therefore excluded as a physiological product of BT_4612.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against this entry's own 397-residue UniProt record: Ala33, Ser34, Arg35, Thr36, Lys39
      and Lys286, the cofactor-signature positions. Verified separately that the carboxyspermidine
      decarboxylase the run places at the end of this route is this corpus's own BT_0674 entry
      (Q8A9Z1), whose review records that deletion depletes spermidine and decarboxylase activity, so
      the route assignment is consistent with work already in the repository. Not reproduced here: the
      proteome-wide Pfam census over 4,782 entries, the alignment scores for the arginase-superfamily
      protein against its characterised comparators, the paralogue search, the 33-residue cofactor
      contact set and the identity to the ortholog structure.
