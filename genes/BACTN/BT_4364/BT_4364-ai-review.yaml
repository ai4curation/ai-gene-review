suggested_questions:
- question: Which physiological molecule donates the N-acyl chain to Lnb, and does the enzyme use a covalent
    acyl intermediate?
- question: Does the predicted periplasmic domain orientation hold in the native membrane, and which catalytic
    residues can be distinguished from folding or stability determinants?
- question: What accounts for the 398-residue length reported for the Lnb model versus the 395-residue
    current Q89ZL3 sequence, despite agreement at H49, N66, C148 and C198?
suggested_experiments:
- description: Reconstitute purified Lnb with defined diacylglyceryl lipoprotein acceptors and candidate
    acyl donors; directly measure product formation and donor consumption.
  experiment_type: in vitro enzyme assay
- description: Measure native membrane topology and compare Lnb mutant abundance/stability with N-acylation
    activity to distinguish catalytic from structural effects.
  experiment_type: topology and mutagenesis analysis
proposed_new_terms:
- proposed_name: lipoprotein N-terminal cysteine N-acyltransferase activity
  proposed_definition: Catalysis of intermolecular transfer of an acyl group to the free alpha-amino group
    of the N-terminal S-diacylglyceryl-L-cysteine of a lipoprotein, producing a triacylated lipoprotein.
  justification: The acyltransferase genus is valid but does not identify the lipoprotein acceptor or
    terminal N-acylation reaction. Lnb-dependent reporter mass spectrometry and native B. thetaiotaomicron
    genetics establish the product chemistry in cells. The physiological acyl donor and purified-enzyme
    reaction remain unresolved, so this proposal deliberately does not require the phospholipid donor
    established for Lnt or LnsAB. BF9343_0945 reporter rescue in E. coli and BT_4364 native mutant/complementation
    are distinct assay scopes.
