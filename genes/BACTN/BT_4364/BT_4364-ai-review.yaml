references:
- id: PMID:39495918
  title: Identification and characterization of the lipoprotein N-acyltransferase in Bacteroides.
  findings:
  - statement: In the VPI-5482 Δtdk background, deleting BT_4364 shifts both a heterologous Lpp reporter
      and endogenous BT_3736/BT_3183 lipoproteins to forms consistent with loss of one acyl chain; complementation
      restores triacylation. This establishes the native gene role in N-acylation, while no purified-Lnb
      activity or acyl-donor assay is reported.
    supporting_text: In each case, complementation of the ΔBT_4364 strain with BT_4364 under the constitutive
      promoter us1311 was sufficient to restore triacylation.
  - statement: The functional evidence supports a distinct Lnb-dependent route; purified lipoprotein reporter
      analysis must not be confused with purification and reconstitution of the enzyme. The physiological
      donor remains unassigned.
    supporting_text: Further studies are required to characterize Lnb at the enzymatic level and within
      other Bacteroides strains.
  - statement: The B. thetaiotaomicron Lnb model predicts a periplasmic N-terminal domain and five transmembrane
      helices; this is not a compartment-resolved localization assay.
    supporting_text: Lnb is predicted to have five transmembrane helices and a periplasmic domain containing
      a DUF4105
  - statement: The native experiments use VPI-5482-derived Δtdk strains.
    supporting_text: B. theta strains were derived from VPI-5482 Δtdk (herein referred to as WT)
  - statement: C148S fails the cellular reporter rescue that C198S retains. This supports a requirement
      for C148 but does not directly demonstrate a cysteine-acyl intermediate; H49 and N66 remain model/conservation-based
      catalytic candidates.
    supporting_text: Only Lnb(C198S) could restore N-acylation activity to Δlnb cells, suggesting that
      C148 is essential for activity of Lnb
  - statement: Changes in total-membrane and outer-membrane-vesicle profiles do not identify whether affected
      clients are in the inner or outer membrane.
    supporting_text: As analysis was performed on TM, these data do not indicate protein localization
      in the inner versus outer membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The full cached primary Results, Discussion and Methods were read. In the VPI-5482 Δtdk
      background, deleting BT_4364 shifts both a heterologous Lpp reporter and endogenous BT_3736/BT_3183
      lipoproteins to forms consistent with loss of one acyl chain; complementation restores triacylation.
      This establishes the native gene role in N-acylation, while no purified-Lnb activity or acyl-donor
      assay is reported. Only the B. thetaiotaomicron protein was tested by C148S/C198S mutagenesis. The
      paper gives a 398-residue length for its Lnb model, whereas the current Q89ZL3 sequence is 395 residues;
      the four discussed positions H49/N66/C148/C198 nevertheless match that sequence. No cause of the
      length discrepancy is inferred.
