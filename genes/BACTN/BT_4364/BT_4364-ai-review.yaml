existing_annotations:
- term:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  evidence_type: EXP
  original_reference_id: PMID:39495918
  review:
    action: NEW
    summary: Experimentally established lipoprotein N-acylation represented by the valid acyltransferase
      genus.
    reason: In the VPI-5482 Δtdk background, deleting BT_4364 shifts both a heterologous Lpp reporter
      and endogenous BT_3736/BT_3183 lipoproteins to forms consistent with loss of one acyl chain; complementation
      restores triacylation. This establishes the native gene role in N-acylation, while no purified-Lnb
      activity or acyl-donor assay is reported. GO:0016747 captures transfer of a non-amino-acyl group
      without requiring an identified donor. GO:0016410 is obsolete; GO:0140186 concerns acyl-CoA-dependent
      lysine N6 acylation, not the observed N-terminal cysteine modification. The broad experimental code
      does not imply a purified-enzyme assay.
    supported_by:
    - reference_id: PMID:39495918
      supporting_text: We then analyzed endogenous B. theta lipoproteins BT_3736 and BT_3183 (Strep-tagged;
        chosen for their small size and compatibility with the assay) and observed a similar band shift
        in ΔBT_4364 cells
    - reference_id: PMID:39495918
      supporting_text: In each case, complementation of the ΔBT_4364 strain with BT_4364 under the constitutive
        promoter us1311 was sufficient to restore triacylation.
