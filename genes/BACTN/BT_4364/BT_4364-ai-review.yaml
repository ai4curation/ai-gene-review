  label: Bacteroides thetaiotaomicron VPI-5482
description: Lnb (BT_4364) is the membrane-associated lipoprotein N-acyltransferase of Bacteroides thetaiotaomicron
  VPI-5482. It carries out the terminal N-acylation step that produces triacylated lipoproteins. Loss
  of Lnb leaves the tested lipoproteins diacylated and changes lipoprotein surface abundance and vesicle
  cargo without preventing all cell-surface localization. Its predicted topology comprises a periplasmic
  N-terminal domain and five C-terminal transmembrane helices; the acyl donor and detailed reaction mechanism
  remain unresolved.
