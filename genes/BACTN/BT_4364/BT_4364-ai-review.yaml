core_functions:
- description: N-acylation of the free N-terminal cysteine amino group of a diacylglyceryl lipoprotein
    to produce a triacylated lipoprotein; donor identity remains unresolved. Activity is established in
    cells; plasma-membrane localization is inferred from the alpha-helical multipass architecture and
    predicted extracytoplasmic reaction domain, not direct native fractionation.
