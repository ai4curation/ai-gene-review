    label: carboxy-lyase activity
  justification: >-
    The target evidence supports carboxyspermidine decarboxylation. The dual-substrate family label
    does not establish carboxynorspermidine turnover by BT_0674, so this proposal is restricted to
    the supported reaction; neither absence of that alternative activity nor its native use is asserted.
  supported_by:
  - *id002
