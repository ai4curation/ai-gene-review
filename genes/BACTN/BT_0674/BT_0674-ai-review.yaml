      The established native product is spermidine; refine the pathway assignment accordingly.
    action: MODIFY
    reason: >-
      The generic NspC-family mapping to norspermidine does not establish endogenous norspermidine synthesis.
      Target-species deletion/complementation and decarboxylase activity support the carboxyspermidine-to-spermidine
