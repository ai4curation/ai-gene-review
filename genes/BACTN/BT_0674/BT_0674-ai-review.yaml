references:
- id: file:BACTN/BT_0674/BT_0674-hypotheses/kgap-bt0674-substrate-selectivity/openscientist.md
  title: OpenScientist analysis of BT_0674 family assignment and carboxyspermidine substrate selectivity
  findings:
  - statement: >-
      BT_0674 is the PLP-dependent decarboxylase step and not the dehydrogenase, with thirteen of
      fourteen PLP and product contacts identical to the characterised enzyme, but the pocket
      cannot discriminate among the candidate carboxylated amines, since an identical residue set
      is known to turn over two chain lengths in vivo; selectivity lies upstream at the partner
      dehydrogenase.
    supporting_text: >-
      The pocket **cannot discriminate** among carboxyspermidine, carboxynorspermidine and
      carboxyaminopropylagmatine.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      All fourteen named catalytic and cofactor positions, the 379-residue length, and the PF00278,
      TIGR01047 and cd06829 assignments were confirmed in the local Q8A9Z1 record; BT_4612's
      saccharopine-dehydrogenase Pfam pair and the PANTHER node in the withFrom of both IBA rows
      were confirmed in this repository too, so the run's family and provenance claims rest on
      locally checkable material. The structural mapping, the cavity-volume calculation and the
      comparison-set statistics were not recomputed. This run's reference validation reported every
      attempted quotation as unsupported, so none of its literature quotations is used here.
