  label: Bacteroides thetaiotaomicron VPI-5482
description: >-
  Carboxyspermidine decarboxylase (CasDC), a member of the NspC branch of the PLP-dependent group IV decarboxylase
  family. BT_0674 catalyzes the terminal conversion of carboxyspermidine to spermidine in Bacteroides
  thetaiotaomicron. Deletion depletes spermidine and decarboxylase activity and impairs growth in polyamine-free
  medium; complementation restores these phenotypes. A physiological norspermidine pathway is not established.
