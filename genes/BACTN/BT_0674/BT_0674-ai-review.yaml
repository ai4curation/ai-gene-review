- id: PMID:27118128
  title: Carboxyspermidine decarboxylase of the prominent intestinal microbiota species Bacteroides
    thetaiotaomicron is required for spermidine biosynthesis and contributes to normal growth.
  findings:
  - statement: >-
      Deletion and complementation connect CasDC with both decarboxylase activity and spermidine synthesis.
    supporting_text: "The complemented Δcasdc\nstrain restored the spermidine biosynthetic ability, decarboxylase
      activity, and\ngrowth."
  - statement: Publisher Figure 1 explicitly identifies the carboxyspermidine decarboxylase as
      BT_0674.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cache remains abstract-only after normal refresh; the subscription-only main text was not read.
      The abstract explicitly reports the genetic, activity and metabolite results used here. Accessible
      publisher Figure 1 independently resolves the locus identity. No purified-enzyme kinetics or unreported
      substrate panel is inferred. In particular, the available source does not establish
      carboxynorspermidine turnover, so the proposed MF is limited to carboxyspermidine.
proposed_new_terms:
- proposed_name: carboxyspermidine decarboxylase activity
  proposed_definition: >-
    Catalysis of the decarboxylation of carboxyspermidine to spermidine and carbon dioxide.
  proposed_parent:
