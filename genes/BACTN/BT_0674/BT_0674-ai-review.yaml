knowledge_gaps:
- gap_statement: >-
    The full substrate selectivity of BT_0674 is unresolved.
  boundary: >-
    The accessible primary abstract establishes carboxyspermidine-related activity and native spermidine
    synthesis; the full paper was inaccessible, and no exact kinetic constants or alternative-substrate
    exclusions are asserted. An OpenScientist run (kgap-bt0674-substrate-selectivity) settles the
    family and reaction and refutes the idea that the pocket determines the substrate. On
    assignment, BT_0674 is the decarboxylase step of the aspartate-semialdehyde-dependent
    spermidine route, PLP-dependent on a fold-type-III alanine-racemase scaffold, and not the
    dehydrogenase; the two steps are non-homologous folds, and in this genome the dehydrogenase
    is the separate protein BT_4612, which the local record confirms by carrying the
    saccharopine-dehydrogenase Pfam pair while this entry carries PF00278, NCBIfam TIGR01047 and
    CDD cd06829 for the carboxynorspermidine decarboxylase subfamily. Thirteen of fourteen PLP
    and product-contacting positions mapped from the characterised Campylobacter product complex
    are identical here, including the subfamily-diagnostic Leu310 where authentic diaminopimelate
    decarboxylases carry Glu; all fourteen were confirmed in the local Q8A9Z1 record. The
    refutation is that this pocket cannot discriminate among carboxyspermidine,
    carboxynorspermidine and carboxyaminopropylagmatine, and the decisive evidence is
    experimental rather than computational: the Campylobacter enzyme carrying exactly this
    residue set was shown by gene deletion to make spermidine in vivo despite being named for
    carboxynorspermidine, so an identical pocket turns over both chain lengths. The single
    Bacteroidota-specific substitution near the product amine changes the computed buried cavity
    volume by nothing under side-chain truncation. The run places selectivity upstream, at the
    partner dehydrogenase, which is where the question should go next rather than into kinetics
    on this enzyme alone. The run's annotation recommendations were checked and need no action,
    because this review already makes every one of them: removal of the diaminopimelate
    decarboxylase and lysine-biosynthesis IBA rows, which the local GOA confirms arrive from the
    same PANTHER node named in the withFrom of both rows, modification of the name-based
    nor-spermidine row to spermidine biosynthesis, and a new-term request for the molecular
    function, since no GO term exists for this EC number. One caution: this run's own reference
    validation reported every quotation it attempted as unsupported, so none of its literature
    quotations is relied on here and only its computed results and the locally checkable
    provenance are recorded.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: Determines physiological substrate use and the correct pathway assignment.
  resolution: >-
    Obtain full text and compare purified BT_0674 with carboxyspermidine, carboxynorspermidine and CAPA.
  provenance:
  - reference_id: PMID:27118128
  - reference_id: file:BACTN/BT_0674/BT_0674-hypotheses/kgap-bt0674-substrate-selectivity/openscientist.md
    supporting_text: >-
      Selectivity in this pathway is imposed upstream, at the partner dehydrogenase BT_4612
