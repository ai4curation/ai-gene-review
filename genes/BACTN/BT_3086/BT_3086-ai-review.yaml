proposed_new_terms:
- proposed_name: alpha-1,6-glucan hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of (1->6)-alpha-D-glucosidic linkages in
    (1->6)-alpha-D-glucans such as dextran, and in oligosaccharides derived from them,
    without commitment to endo- or exo-type cleavage.
  justification: >-
    GO's existing terms for hydrolysis of alpha-1,6-glucosidic linkages in alpha-1,6-glucan
    each build a cleavage mode, or a specific product, into the class, inherited from EC:
    GO:0033904 dextranase activity is "endohydrolysis of 1,6-alpha-D-glucosidic linkages
    in dextran" (EC 3.2.1.11); GO:0043896 glucan 1,6-alpha-glucosidase activity is the
    exo-acting EC 3.2.1.70, releasing glucose; GO:0033923 glucan
    1,6-alpha-isomaltosidase activity (EC 3.2.1.94, isomaltodextranase) removes
    "successive isomaltose units from the non-reducing ends of the chains"; and
    GO:0004574 oligo-1,6-glucosidase activity (EC 3.2.1.10) releases glucose from
    isomaltose and short alpha-1,6-linked oligosaccharides. There is no common parent
    asserting only the linkage and substrate,
    so a protein whose alpha-1,6-glucan activity is established while its cleavage mode
    is not cannot be annotated without overstating. That is the situation for BT_3086:
    the conserved subsite -2 architecture excludes a single-glucose alpha-glucosidase
    pocket but fits both an endodextranase and an isomaltose-releasing exodextranase,
    the only product data on the protein is an overnight endpoint digest (which cannot
    separate them), and the characterized ortholog transglycosylates, which makes
    product spectra a weak mechanistic readout generally. Its reported glucose plus
    isomaltose mixture is in fact what distinguishing EC 3.2.1.70 from EC 3.2.1.94 would
    turn on. The proposed term would be the parent of the four terms above and is
    reusable for other GH31, GH49 and GH66 members whose mode has not been determined.
  proposed_parent:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  supported_by:
  - reference_id: PMID:31552702
    supporting_text: binding of FjDex31A to the substrates at subsite -2 is likely to
      be important for its activity
  - reference_id: PMID:27170214
    supporting_text: The enzyme hydrolyzed dextran and pullulan to produce
      isomaltooligosaccharides and isopanose, respectively.
  - reference_id: file:BACTN/BT_3086/BT_3086-bioinformatics/RESULTS.md
    supporting_text: every dextranase-specific active-site residue reported for FjDex31A
      is conserved in BT_3086
suggested_questions:
- question: >-
    Is BT_3086 endo-acting like FjDex31A (EC 3.2.1.11), or does it act exo-wise on
    imported isomaltooligosaccharides, and if so releasing glucose (glucan
    1,6-alpha-glucosidase, EC 3.2.1.70) or isomaltose (glucan
    1,6-alpha-isomaltosidase, EC 3.2.1.94)?
    The glucose and isomaltose products reported for recombinant BT_3086 have been read
    as exo-type, but they come from an overnight endpoint digest, which an endo enzyme
    run to completion also reaches; FjDex31A, called an endodextranase, likewise
    releases glucose from isomaltotriose and isomaltotetraose, and its
    transglycosylation makes product spectra a weak readout of cleavage mode. The
    pathway position (periplasmic, acting on already-imported oligosaccharides
    downstream of the GH66 BT3087) argues exo; the ortholog's subsite architecture
    argues endo.
  experts:
  - Carbohydrate-active enzyme biochemists
- question: >-
    Does BT_3086 share the high transglycosylation activity of FjDex31A, and if so does
    chain-length adjustment of isomaltooligosaccharides matter for dextran utilization in
    B. thetaiotaomicron?
  experts:
  - Gut microbiome glycobiologists
suggested_experiments:
- description: >-
    Determine kinetics of recombinant BT_3086 on dextran versus isomaltose,
    isomaltotriose, isomaltotetraose and p-nitrophenyl alpha-glucoside, with time-course
    product profiling (HPAEC-PAD) and reducing-end assays to separate endo- from
    exo-action, alongside the G271 and Y522 mutants corresponding to the FjDex31A
    subsite -2 mutants.
  experiment_type: enzyme kinetics and product analysis
- description: >-
    Define subcellular location directly, by periplasmic versus cytoplasmic
    fractionation of dextran-grown B. thetaiotaomicron followed by immunodetection or
    proteomics of BT_3086.
  experiment_type: subcellular fractionation
