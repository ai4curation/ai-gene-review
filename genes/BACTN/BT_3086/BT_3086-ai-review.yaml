suggested_questions:
- question: >-
    Is BT_3086 endo-acting like FjDex31A, or does it act mainly exo-wise (glucan
    1,6-alpha-glucosidase, EC 3.2.1.70) on imported isomaltooligosaccharides? The
    glucose and isomaltose products reported for recombinant BT_3086 have been read as
    exo-type, but FjDex31A also releases glucose from isomaltotriose and
    isomaltotetraose.
  experts:
  - Carbohydrate-active enzyme biochemists
- question: >-
    Does BT_3086 share the high transglycosylation activity of FjDex31A, and if so does
    chain-length adjustment of isomaltooligosaccharides matter for dextran utilization in
    B. thetaiotaomicron?
  experts:
  - Gut microbiome glycobiologists
suggested_experiments:
- description: >-
    Determine kinetics of recombinant BT_3086 on dextran versus isomaltose,
    isomaltotriose, isomaltotetraose and p-nitrophenyl alpha-glucoside, with time-course
    product profiling (HPAEC-PAD) and reducing-end assays to separate endo- from
    exo-action, alongside the G271 and Y522 mutants corresponding to the FjDex31A
    subsite -2 mutants.
  experiment_type: enzyme kinetics and product analysis
- description: >-
    Define subcellular location directly, by periplasmic versus cytoplasmic
    fractionation of dextran-grown B. thetaiotaomicron followed by immunodetection or
    proteomics of BT_3086.
  experiment_type: subcellular fractionation
