    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011013
  review:
    summary: >-
      Over-annotation. The InterPro2GO mapping derives from the galactose
      mutarotase-like superfamily (IPR011013), which here is the N-terminal
      beta-sandwich domain of the GH31 catalytic unit, not an independent
      carbohydrate-binding module.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Substrate binding by the catalytic site is part of the hydrolase activity and is
      not separately annotated as carbohydrate binding. BT_3086 carries no CBM; its
      N-terminal domain (Pfam PF13802) is a standard part of the four-domain GH31 fold
      seen in the FjDex31A crystal structure, and no non-catalytic glycan binding has
      been shown for this protein or its characterized ortholog.
    supported_by:
    - reference_id: PMID:31552702
      supporting_text: 'FjDex31A is composed of four domains: an N-terminal domain, a
        catalytic domain, a proximal C-terminal domain, and a distal C-terminal domain,
        as observed in typical GH31 enzymes.'
