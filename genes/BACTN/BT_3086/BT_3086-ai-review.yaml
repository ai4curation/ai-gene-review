references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:38376161
  title: Bacteroides thetaiotaomicron metabolic activity decreases with polysaccharide
    molecular weight.
  findings:
  - statement: >-
      B. thetaiotaomicron grows on dextran using PUL48, in which the GH66 dextranase
      BT3087 is the main glycoside hydrolase. The full text (PMC10936149, beyond the
      cached abstract) reports that recombinant BT3086 releases glucose and isomaltose
      from dextran and that deleting BT3086 causes only a marginal growth defect, making
      it auxiliary to BT3087.
    supporting_text: At the enzymatic level, the dextranase BT3087, a glycoside hydrolase
      (GH) belonging to the GH family 66, is the main GH for dextran utilization
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title confirmed through the PMC id converter (PMC10936149 maps to PMID
      38376161). This is the only study with direct experimental data on BT3086 itself
      (deletion mutants, recombinant enzyme product profiling); the cached copy holds
      only the abstract, so the BT3086-specific results were read from the Europe PMC
      full text.
- id: PMID:37269952
  title: Bacteroidota polysaccharide utilization system for branched dextran exopolysaccharides
    from lactic acid bacteria.
  findings:
  - statement: >-
      Characterizes the F. johnsoniae dextran utilization locus containing the GH31
      dextranase FjDex31A and identifies homologous GH66 plus GH31 loci across
      Bacteroidota, including B. thetaiotaomicron VPI-5482. FjDex31A is predicted
      periplasmic, hydrolyses dextran and isomaltooligosaccharides, and transglycosylates
      them.
    supporting_text: Notably, FjDex31A has high transglycosylation activity toward
      isomaltooligosaccharides.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Establishes both the activity of the closest
      experimentally studied ortholog and the dextran-locus context shared with PUL48.
- id: PMID:27170214
  title: A glycoside hydrolase family 31 dextranase with high transglucosylation activity
    from Flavobacterium johnsoniae.
  findings:
  - statement: Fjoh_4430 (FjDex31A) is a GH31 dextranase that hydrolyses dextran to
      isomaltooligosaccharides and is inactive on maltose, maltotriose and soluble starch.
    supporting_text: In contrast, Fjoh_4430 did not act on trehalose, kojibiose, nigerose,
      maltose, maltotriose, or soluble starch.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Original biochemical characterization of the ortholog;
      the negative results on maltose and starch are what argue against the
      "alpha-glucosidase II" name carried by BT_3086.
- id: PMID:31552702
  title: Structural insights into polysaccharide recognition by Flavobacterium johnsoniae
    dextranase, a member of glycoside hydrolase family 31.
  findings:
  - statement: Crystal structures of FjDex31A identify the active-site residues that
      distinguish it from other GH31 enzymes; all of them are conserved in BT_3086.
    supporting_text: the architecture of active site residues in FjDex31A, other than
      subsite -1, is markedly different from that of other GH31 enzymes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; its residue numbering was used for the alignment in
      BT_3086-bioinformatics/RESULTS.md.
- id: file:BACTN/BT_3086/BT_3086-bioinformatics/RESULTS.md
  title: Active-site residue conservation between BT_3086 and FjDex31A
  findings:
  - statement: BT_3086 aligns to FjDex31A over 830 positions at 64.5% identity and
