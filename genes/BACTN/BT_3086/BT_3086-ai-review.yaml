  label: Bacteroides thetaiotaomicron VPI-5482
description: >-
  BT_3086 is a secreted, soluble glycoside hydrolase family 31 (GH31) enzyme of the
  human gut symbiont Bacteroides thetaiotaomicron, encoded in the dextran
  polysaccharide utilization locus PUL48 together with the GH66 dextranase BT3087,
  the SusC/SusD-like import and surface-binding proteins BT3089/BT3090 and the
  SusR-like regulator BT3091. Although named "alpha-glucosidase II" in the genome
  annotation, it shares about 64% sequence identity with the biochemically and
  structurally characterized Flavobacterium johnsoniae GH31 dextranase FjDex31A
  (Fjoh_4430) and conserves all of the active-site residues that distinguish that
  dextranase from exo-acting GH31 alpha-glucosidases. It carries a cleavable type I
  signal peptide and no membrane anchor, consistent with a periplasmic location, where
  it hydrolyses alpha-1,6-linked glucan (dextran and isomaltooligosaccharides) to
  glucose and isomaltose. It is auxiliary rather than essential for growth on dextran:
  the GH66 dextranase BT3087 makes the initial cuts in the polymer, while BT_3086 and
  the GH97 alpha-glucosidase BT4581 complete the conversion of imported
  oligosaccharides to glucose.
