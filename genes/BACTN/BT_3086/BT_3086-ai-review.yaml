  review:
    summary: >-
      Correct but general. The PANTHER PTHR22762 (GH31 alpha-glucosidase) node assigns
      O-glycosyl hydrolase activity, which BT_3086 clearly has; a family-level node
      cannot resolve the alpha-1,6-glucan (dextran) specificity of the FjDex31A-like
      subclade that BT_3086 belongs to.
    action: MODIFY
    reason: >-
      The GH31 glycosidase claim is well supported (intact GH31 N-terminal, TIM barrel
      and C-terminal domains; 64.5% identity to the characterized dextranase FjDex31A
      with all of its dextranase-specific active-site residues conserved; location in
      the B. thetaiotaomicron dextran locus PUL48). GO:0033904 dextranase activity is a
      descendant of this term and is supported by that evidence, so the row is refined
      rather than kept. Whether BT_3086 acts endo- or exo-wise is not settled; see
      suggested_questions.
    proposed_replacement_terms:
    - id: GO:0033904
      label: dextranase activity
    supported_by:
    - reference_id: PMID:27170214
      supporting_text: Our results indicate that Fjoh_4430 is a novel GH31 dextranase
        with high transglucosylation activity.
    - reference_id: file:BACTN/BT_3086/BT_3086-bioinformatics/RESULTS.md
      supporting_text: every dextranase-specific active-site residue reported for FjDex31A
        is conserved in BT_3086
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000509739
        source_label: GH31 alpha-glucosidase ancestral node (PTHR22762)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node's experimental seeds are eukaryotic GH31 enzymes (human GANAB/GANC
          and lysosomal GAA, yeast, fly, worm, plant and Dictyostelium orthologs),
          whose shared property is GH31 O-glycosyl hydrolase activity. The assertion at
          that depth is sound for BT_3086, which has the complete GH31 catalytic unit;
          it simply stops short of the alpha-1,6-glucan specificity that the
          bacterial FjDex31A-like branch shows and that this protein's conserved
          subsite residues support. No loss or divergence argues against the node
          assertion itself.
