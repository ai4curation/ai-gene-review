- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IC
  review:
    summary: >-
      Proposed. BT_3086 has a cleavable type I signal peptide (1-22) and no
      transmembrane segment or lipobox, and the equivalent dextran-locus GH enzymes with
      type I signal peptides are periplasmic.
    action: NEW
    reason: >-
      Two independent lines agree: sequence features (SignalP signal peptide, no TM
      helix, no lipoprotein anchor) indicate a soluble exported protein, and in
      Bacteroidota PULs the GHs with type I signal peptides act in the periplasm, which
      is where the FjDex31A ortholog was placed on the same grounds. Wong et al. 2024
      likewise describe BT3086 as a periplasmic alpha-glucosidase.
    supported_by:
