proposed_new_terms:
- proposed_name: chondroitin sulfate catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown
    of chondroitin sulfate, a sulfated glycosaminoglycan composed of repeating
    beta-(1,4)-D-glucuronic acid-beta-(1,3)-N-acetyl-D-galactosamine disaccharide
    units, occurring on the free polysaccharide chain rather than on an intact
    chondroitin sulfate proteoglycan.
  justification: >-
    GO has GO:0030214 hyaluronan catabolic process for the unsulfated
    glycosaminoglycan, but for chondroitin sulfate only GO:0030207 chondroitin
    sulfate proteoglycan catabolic process, which requires a core protein. Gut
    Bacteroides degrade free dietary chondroitin sulfate chains, so neither
    GO:0030207 nor the parent GO:0006027 glycosaminoglycan catabolic process
    fits: the first asserts a proteoglycan substrate that is absent, and the
    second cannot distinguish chondroitin sulfate from the other
    glycosaminoglycans this locus also handles. The gap affects every enzyme of
    the BT3324-BT3350 chondroitin sulfate utilization locus, not only this one.
  proposed_parent:
    id: GO:0006027
    label: glycosaminoglycan catabolic process
  supported_by:
  - reference_id: PMID:32005816
    supporting_text: The surface lyase, BT3328PL29, showed its highest enzymatic
      activity and affinity against CS-A > CS-C > HA and little activity on DS,
      differing from previous data18.
suggested_questions:
- question: Does BtCDH cleave dermatan sulfate? The 2018 and 2020 studies from
    the same group disagree, and the answer decides between chondroitin AC and
    chondroitin ABC lyase terms.
- question: Why is bt3328 important for fitness on hyaluronan in pooled RB-TnSeq
    (PMID:33657378) when the clean deletion strain grows normally on hyaluronan
    in pure culture (PMID:30262663, PMID:32005816)? Surface cleavage may matter
    only under competition for the released oligosaccharides.
- question: Is BtCDH endo-acting, as the 2018 product profile suggests, or does it
    act from the reducing end, as the 2020 oligosaccharide data indicate?
- question: Should GO have a chondroitin sulfate catabolic process term for free
    (non-proteoglycan) CS chains, as degraded by gut Bacteroides?
- question: Which of DUF4988 and DUF4955 carries the lyase catalytic site? Pfam
    entries PF16315 and PF16378 could be renamed to reflect PL29 if the active
    site maps to one of them.
suggested_experiments:
- description: Assay purified BtCDH side by side on DS, CS-A, CS-C and HA under
    identical conditions, with product analysis by HPLC and NMR, to settle the
    substrate range and cleavage mode.
  experiment_type: in vitro enzyme kinetics
- description: Solve the structure of BtCDH, or use an AlphaFold model with
    site-directed mutagenesis, to locate the PL29 catalytic residues relative to
    the DUF4988 and DUF4955 domains.
  experiment_type: structural biology and mutagenesis
