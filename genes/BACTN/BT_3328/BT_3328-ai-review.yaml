id: Q8A2H7
gene_symbol: BT_3328
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:226186
  label: Bacteroides thetaiotaomicron VPI-5482
aliases: [BtCDH]
description: >-
  BT_3328 (BtCDH) is an 868-residue cell-surface glycosaminoglycan lyase of
  Bacteroides thetaiotaomicron and the founding member of polysaccharide lyase
  family PL29. It is a lipoprotein, with a lipobox ending at Cys19 followed by
  an acidic surface-exposure signal. Its only Pfam domains are DUF4988
  (residues 25-199) and DUF4955 (716-867), neither of which is linked to a
  known function. The recombinant
  enzyme cleaves chondroitin sulfate (CS-A > CS-C) and hyaluronan by
  beta-elimination, releasing Delta4,5-unsaturated oligosaccharides, with a
  pH optimum of 7 and little dependence on divalent metals. Its activity on
  dermatan sulfate is contested, reported as degradation in one study and as
  little activity in another. The enzyme is encoded in the BT3328-BT3330 operon of the
  CS/DS/HA polysaccharide utilization locus, sits on the cell surface with
  the surface glycan-binding proteins BT3329 and BT3330, and starts
  extracellular depolymerisation of host glycosaminoglycans before uptake
  through the SusC/D-like transporter BT3331/BT3332. Pooled transposon fitness
  profiling finds it important for fitness on hyaluronan but not on chondroitin
  sulfate, whereas clean deletion strains grow normally on both in pure culture;
  how the two observations fit together is unresolved. The gene is present in
  every hyaluronan-degrading strain of one 17-strain Bacteroides panel and
  absent from the non-degraders, although a second panel scored a strain that
  has lost the gene among the best hyaluronan utilisers.
existing_annotations:
- term:
    id: GO:0030341
    label: chondroitin AC lyase activity
  evidence_type: IDA
  original_reference_id: PMID:32005816
  qualifier: enables
  review:
    summary: >-
      Proposed. The purified enzyme cleaves chondroitin sulfate A and C
      (GlcA-GalNAc linkages) and hyaluronan (GlcA-GlcNAc) by beta-elimination,
      which is the substrate range of a chondroitin AC lyase.
    action: NEW
    reason: >-
      GOA has no annotation for this protein. Both characterisation studies
      agree on activity against CS-A, CS-C and HA (PMID:30262663,
      PMID:32005816). They disagree on dermatan sulfate: the first reports
      degradation, and the second finds little activity on DS and notes the
      difference. GO:0034000 chondroitin-sulfate-ABC endolyase activity (the
      KBase dashboard's call) includes iduronate-containing DS linkages in its
      definition, so it is not used while the DS activity is contested.
      Chondroitin AC lyase activity covers the hexosaminyl-glucuronate bonds
      that both studies agree on. The EC-derived definition says the products
      are disaccharides, whereas BtCDH gives a mix of unsaturated di- to
      octasaccharides; no GO term distinguishes endo-acting chondroitin AC
      lyases.
    supported_by:
    - reference_id: PMID:32005816
      supporting_text: The surface lyase, BT3328PL29, showed its highest enzymatic
        activity and affinity against CS-A > CS-C > HA and little activity on DS,
        differing from previous data18.
    - reference_id: PMID:30262663
      supporting_text: We show that BtCDH exhibits polysaccharide lyase activity
        toward a variety of GAGs substrates including CS, DS, and HA.
- term:
    id: GO:0030340
    label: hyaluronate lyase activity
  evidence_type: IDA
  original_reference_id: PMID:30262663
  qualifier: enables
  review:
    summary: >-
      Proposed. Recombinant BtCDH degrades hyaluronan to Delta4,5-unsaturated
      oligosaccharides, so the HA-specific lyase term applies alongside
      chondroitin AC lyase activity.
    action: NEW
    reason: >-
      Direct enzyme assays with HA in two studies (PMID:30262663,
      PMID:32005816). HA is less preferred in vitro than CS-A or CS-C, and the
      clean deletion strain grows normally on HA (see the GO:0030214 row), so
      the term rests on the measured activity and not on a growth requirement.
      Pooled RB-TnSeq scores bt3328 as important for fitness on HA specifically
      (PMID:33657378); that is noted in suggested_questions and is not relied on
      here.
    supported_by:
    - reference_id: PMID:30262663
      supporting_text: When incubated with HA, BtCDH generated a series of unsaturated
        HA sugars
    - reference_id: PMID:32005816
      supporting_text: BT3328PL29 was only able to cleave HA oligosaccharides with
        a DP ≥ 8, indicating the enzyme has at least eight subsites
- term:
    id: GO:0030214
    label: hyaluronan catabolic process
  evidence_type: IDA
  original_reference_id: PMID:30262663
  qualifier: involved_in
  review:
    summary: >-
      Proposed. The enzyme cleaves hyaluronan itself, at the cell surface, which
      is the first step of hyaluronan breakdown by this bacterium.
    action: NEW
    reason: >-
      BtCDH does work in the process: it catalyses extracellular
      depolymerisation of HA, shown by direct enzyme assay and by whole-cell
      surface assays (PMID:30262663), so this is participation and not merely
      necessity. The evidence is the catalysis, not a growth requirement.
      Deleting the gene does not impair growth on HA in pure culture
      (PMID:30262663, PMID:32005816), and PMID:32005816 assigns the required HA
      lyase role to BT4410, so the HA-specific signal in pooled RB-TnSeq
      (PMID:33657378) is unexplained; that conflict is recorded as a DISPUTED
      finding and in suggested_questions, and does not bear on whether the
      enzyme participates. GO has no chondroitin sulfate catabolic
      process term (GO:0030207 is for proteoglycans, not the free dietary chains
      degraded here), and GO:0006027 glycosaminoglycan catabolic process is an
      ancestor of this term, so it is not added separately.
    supported_by:
    - reference_id: PMID:30262663
      supporting_text: When incubated with HA, BtCDH generated a series of unsaturated
        HA sugars
    - reference_id: PMID:30262663
      supporting_text: A combination of genetic and biochemical assays revealed
        that BtCDH localizes to the cell surface of B. thetaiotaomicron where it
        enables extracellular GAG degradation.
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:30262663
  qualifier: located_in
  review:
    summary: >-
      Proposed. Proteinase K shaving of whole cells and immunofluorescence with
      anti-BtCDH antibodies place the enzyme on the cell surface.
    action: NEW
    reason: >-
      Direct localisation by two independent assays in PMID:30262663,
      confirmed by surface co-immunoprecipitation with BT3329 and BT3330 in
      PMID:32005816.
    supported_by:
    - reference_id: PMID:30262663
      supporting_text: A combination of genetic and biochemical assays revealed
        that BtCDH localizes to the cell surface of B. thetaiotaomicron where it
        enables extracellular GAG degradation.
    - reference_id: PMID:32005816
      supporting_text: Collectively these data suggest that BT3328PL29, BT3329SGBP
        and BT3330SGBP interact with each other at the bacterial cell surface in
        vivo.
- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IC
  original_reference_id: PMID:30262663
  qualifier: located_in
  review:
    summary: >-
      Proposed. A lipoprotein on the surface of a Bacteroidetes cell is
      anchored in the outer membrane.
    action: NEW
    reason: >-
      Two independent lines agree. First, sequence: a lipobox ending in Cys19,
      which UniProt annotates as lipidated, followed by an acidic
      surface-exposure motif (BT_3328-bioinformatics/RESULTS.md). Second, the
      protein is surface-exposed and protease-accessible (PMID:30262663).
      Surface-exposed lipoproteins of Bacteroides are anchored in the outer
      leaflet of the outer membrane. DeepTMHMM in the KBase run classified the
      protein as soluble and secreted; that conflicts with both lines and is
      taken to be a mis-call of the lipoprotein signal peptide.
    supported_by:
    - reference_id: PMID:30262663
      supporting_text: As indicated earlier, BtCDH contains an N-terminal lipidation
        sequence
    - reference_id: file:BACTN/BT_3328/BT_3328-uniprot.txt
      record_section: ["FT:LIPID"]
      supporting_text: FT   LIPID           19
    - reference_id: file:BACTN/BT_3328/BT_3328-bioinformatics/RESULTS.md
      supporting_text: The residues after
        Cys19 are acidic (`DERDD`), the pattern of the *Bacteroides* lipoprotein
        export signal that sends lipoproteins to the cell surface.
references:
- id: PMID:30262663
  title: The human gut microbe Bacteroides thetaiotaomicron encodes the founding member
    of a novel glycosaminoglycan-degrading polysaccharide lyase family PL29.
  findings:
  - statement: Recombinant BT_3328 (BtCDH) is an endo-acting polysaccharide lyase
      degrading CS, DS and HA to Delta4,5-unsaturated oligosaccharides; it defines
      family PL29.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32005816
      review_notes: >-
        The DS activity is contested by the same group's later study, which
        reports little activity on DS and notes the difference from this paper.
        The CS and HA activities are not in dispute. This is why the review uses
        GO:0030341 chondroitin AC lyase activity rather than GO:0034000.
      supported_by:
      - reference_id: PMID:32005816
        supporting_text: The surface lyase, BT3328PL29, showed its highest enzymatic
          activity and affinity against CS-A > CS-C > HA and little activity on DS,
          differing from previous data18.
  - statement: BtCDH is a lipoprotein localised to the cell surface (proteinase K
      and immunofluorescence), where it enables extracellular GAG degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; primary biochemical and localisation evidence.
- id: PMID:32005816
  title: Metabolism of multiple glycosaminoglycans by Bacteroides thetaiotaomicron
    is orchestrated by a versatile core genetic locus.
  findings:
  - statement: BT3328 activity is CS-A > CS-C > HA with little activity on DS,
      differing from the earlier report; it interacts with BT3329 and BT3330 at
      the cell surface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; revises the DS activity of PMID:30262663 and
      describes cleavage from the reducing end of HA oligosaccharides, which
      sits uneasily with the earlier endo-acting classification.
- id: PMID:33657378
  title: Functional genetics of human gut commensal Bacteroides thetaiotaomicron
    reveals metabolic requirements for growth across environments.
  findings:
  - statement: RB-TnSeq shows BT3328 is important for fitness on HA but not CS.
    supporting_text: The polysaccharide lyase family PL29 enzyme encoded by BT3328
      was only important for fitness on HA, despite the activity of this enzyme
      against both HA and CS in vitro (Ndeh et al., 2018).
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:30262663
      - PMID:32005816
      review_notes: >-
        The pooled screen disagrees with targeted deletions. In PMID:30262663 the
        clean ORF deletion grows like wild type on HA, DS and CS-A, with only a
        minor late defect on CS-C, the reverse of the screen's substrate
        specificity. PMID:32005816 reports no growth impact for loss of the whole
        BT3328-BT3330 region. The two assays differ in kind, a pooled library of
        one strain against single clean deletions, so neither is simply wrong, but
        no reading reconciles them. This review therefore does not rest any
        annotation on the fitness signal.
      supported_by:
      - reference_id: PMID:30262663
        supporting_text: B. thetaiotaomicron WT and BtCDH cells grew at a very similar
          rates on various substrates, except for CSC where a minor defect in late
          phase growth was observed
      - reference_id: PMID:32005816
        supporting_text: However, no impact on growth was observed, consistent with
          Δbt3328 mutant growth data.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; the HA fitness signal is disputed by the targeted
      deletions, recorded on the finding.
- id: PMID:36523841
  title: Nutrient niche specificity for glycosaminoglycans is reflected in polysaccharide
    utilization locus architecture of gut Bacteroides species.
  findings:
  - statement: BT_3328 is present in all tested HA-degrading Bacteroides strains
      and absent from all non-degraders.
    supporting_text: all tested HA-degrading strains had the BT_3328 lyase, whereas
      this was absent in all non-HA degrading strains.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32005816
      review_notes: >-
        Holds for this paper's 17-strain panel, in which B. eggerthii is scored a
        CS-only degrader. PMID:32005816 scored B. eggerthii among the best HA
        utilisers while reporting that it has lost the BT3328-BT3330 region
        entirely, so the two panels disagree about that strain and the claim
        cannot be stated absolutely.
      supported_by:
      - reference_id: PMID:32005816
        supporting_text: When HA was the substrate B. ovatus and B. eggerthii out
          performed all other strains.
      - reference_id: PMID:32005816
        supporting_text: We observed BT3328PL29-BT3330SGBP were more rapidly diverging
          and completely lost in B. cellulosilyticus, B. intestinalis and B. eggerthii.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; comparative genomics and growth phenotypes. Its
      all-strains claim is disputed by PMID:32005816 for B. eggerthii.
