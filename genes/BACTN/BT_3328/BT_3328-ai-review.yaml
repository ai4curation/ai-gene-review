suggested_questions:
- question: Does BtCDH cleave dermatan sulfate? The 2018 and 2020 studies from
    the same group disagree, and the answer decides between chondroitin AC and
    chondroitin ABC lyase terms.
- question: Is BtCDH endo-acting, as the 2018 product profile suggests, or does it
    act from the reducing end, as the 2020 oligosaccharide data indicate?
- question: Should GO have a chondroitin sulfate catabolic process term for free
    (non-proteoglycan) CS chains, as degraded by gut Bacteroides?
- question: Which of DUF4988 and DUF4955 carries the lyase catalytic site? Pfam
    entries PF16315 and PF16378 could be renamed to reflect PL29 if the active
    site maps to one of them.
suggested_experiments:
- description: Assay purified BtCDH side by side on DS, CS-A, CS-C and HA under
    identical conditions, with product analysis by HPLC and NMR, to settle the
    substrate range and cleavage mode.
  experiment_type: in vitro enzyme kinetics
- description: Solve the structure of BtCDH, or use an AlphaFold model with
    site-directed mutagenesis, to locate the PL29 catalytic residues relative to
    the DUF4988 and DUF4955 domains.
  experiment_type: structural biology and mutagenesis
