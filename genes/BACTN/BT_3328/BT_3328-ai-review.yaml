core_functions:
- description: >-
    Outer-membrane-anchored, surface-exposed PL29 lyase that starts
    extracellular depolymerisation of hyaluronan and chondroitin sulfate by
    beta-elimination, working with the surface glycan-binding proteins BT3329
    and BT3330 ahead of SusC/D-mediated uptake. A clean deletion grows normally
    on these substrates in pure culture, so this surface step is contributory
    rather than essential under those conditions.
  molecular_function:
