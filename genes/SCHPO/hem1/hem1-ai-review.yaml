taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: hem1 (SPAC2F3.09; UniProt O14092) encodes mitochondrial 5-aminolevulinate synthase (ALAS,
  EC 2.3.1.37), a pyridoxal 5'-phosphate-dependent enzyme of the class-II aminotransferase family. In
  the mitochondrial matrix it condenses succinyl-CoA with glycine to 5-aminolevulinate, the first and
  committed step of heme biosynthesis. hem1 deletion is lethal unless ALA or hemin is supplied, so hem1
  mutants are used to make S. pombe depend on heme uptake.
