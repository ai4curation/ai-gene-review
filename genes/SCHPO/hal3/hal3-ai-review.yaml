  label: Schizosaccharomyces pombe 972h-
description: 'hal3 (SPAC15E1.04) encodes a 625-residue fission-yeast fusion protein whose N-terminal half
  is a Hal3/HFCD-family flavoprotein domain and whose C-terminal half is thymidylate synthase. The protein
  carries two essential biosynthetic activities: it is the sole (monogenic) phosphopantothenoylcysteine
  decarboxylase (PPCDC) of S. pombe, converting 4''-phosphopantothenoylcysteine to 4''-phosphopantetheine
  in coenzyme A biosynthesis, and its C-terminal domain is a thymidylate synthase that methylates dUMP
  to dTMP (it rescues a budding-yeast cdc21 mutant). Unlike budding yeast, where PPCDC is a Cab3-Sis2/Vhs3
  heterotrimer and thymidylate synthase is the separate Cdc21 protein, both activities reside in one S.
  pombe polypeptide, which is not proteolytically processed. Like budding-yeast Hal3, the N-terminal domain
  also binds and modestly inhibits the Ppz-family Ser/Thr phosphatases (S. pombe Pzh1) in vitro. The gene
  is essential and the protein is cytoplasmic/cytosolic.'
