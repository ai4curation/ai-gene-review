suggested_questions:
- question: Does the Hal3-like domain of Sp Hal3 inhibit Pzh1 in vivo enough to affect cation tolerance,
    or is the in vitro inhibition a vestigial property of the fused protein?
- question: Does fusing PPCDC and thymidylate synthase in one polypeptide allow co-regulation of CoA and
    dTMP supply (e.g. during S phase), or is the fusion functionally neutral?
suggested_experiments:
- description: Express the N-terminal and C-terminal domains as separate genes in a hal3 deletion background
    to test whether the split proteins support viability, growth rate and cation tolerance like the fusion.
