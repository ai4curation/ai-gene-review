- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISS
  original_reference_id: PMID:27499294
  qualifier: enables
  review:
    summary: ATPase activity of the UbiB-family Coq8 proteins, shown for S. cerevisiae Coq8 and inferred
      for S. pombe Coq8.
    action: NEW
    reason: S. cerevisiae Coq8 hydrolyses ATP in vitro, an activity enhanced by the UbiB-specific KxGQ
      motif, while trans protein kinase activity is not detected (PMID:27499294); human COQ8A/B carry
      the same activity, and the human COQ8B and S. cerevisiae COQ8 reviews make it the core function.
      S. pombe Coq8 is a UbiB/ADCK-family member and human COQ8A/ADCK3 partially complements the S. pombe
      deletion (PMID:24911838). No S. pombe ATPase assay exists, so the row is by sequence similarity
      (ISS); it matches the module's Coq8 annoton (GO:0016887). No GO process is added.
    supported_by:
    - reference_id: PMID:27499294
      supporting_text: WT Coq8NΔ41 has ATPase activity and an A197G mutation, which enhances MgATP binding
        in vitro, increased the ATPase activity (Figures 4A and S4A–S4C).
    - reference_id: file:SCHPO/coq8/coq8-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the protein kinase superfamily. ADCK protein kinase family.
    - reference_id: PMID:24911838
      supporting_text: Similarly, CoQ10 production by the S. pombe Δcoq8 strain was fully recovered by
        expression of S. pombe coq8 but only moderately recovered by expression of HsCOQ8/ADCK3 (Figure
        7C).
