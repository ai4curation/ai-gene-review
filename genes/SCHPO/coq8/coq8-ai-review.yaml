  label: Schizosaccharomyces pombe 972h-
description: coq8 (abc1Sp; SPBC2D10.18; UniProt Q92338) encodes the UbiB-family atypical kinase-like protein
  Coq8, a peripheral matrix-side inner-membrane component of the CoQ biosynthetic complex. By analogy
  to S. cerevisiae Coq8, its ATPase activity, stimulated by lipids and CoQ intermediates, is thought to
  help extract hydrophobic intermediates and assemble the CoQ synthome. coq8 mutants make no CoQ10, cannot
  grow on minimal medium without antioxidants, and are complemented by S. cerevisiae ABC1/COQ8.
