taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq8 (abc1) encodes the fission yeast Coq8 protein, a UbiB/ADCK-family atypical kinase-like
  protein in mitochondria, where its orthologs are peripheral proteins on the matrix side of the inner
  membrane within the CoQ biosynthetic complex. By homology with S. cerevisiae Coq8 and human COQ8A/B,
  it is an ATPase that binds CoQ intermediates and supports assembly and activity of the complex; whether
  it phosphorylates proteins or lipids in vivo is unresolved. coq8 mutants make no CoQ10, are respiration
  deficient, need antioxidants on minimal medium and overproduce sulfide; S. cerevisiae ABC1/COQ8 rescues
  the mutant and human COQ8A rescues it partially.
existing_annotations:
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: TAS
  original_reference_id: PMID:38425362
  qualifier: enables
  review:
    summary: TAS citing the in vitro COQ metabolon reconstruction, in which a reconstructed animal COQ8B
      phosphorylated COQ3 and showed only basal ATPase activity. COQ8-family UbiB proteins are atypical
      kinase-like ATPases whose physiological substrate is unresolved, and protein kinase activity has
      not been tested for S. pombe Coq8.
    action: MARK_AS_OVER_ANNOTATED
    reason: PomBase TAS (PMID:38425362). The cited paper does show protein phosphorylation (COQ3 by animal
      COQ8B, in vitro), so the term is not baseless. But this is real in vitro activity of unknown physiological
      relevance, from an animal protein, not S. pombe. UniProt's curated function (by similarity to human
      COQ8A/COQ8B) records that the substrate specificity is unclear, with protein-kinase and small-molecule
      or lipid-kinase models both proposed. Asserting protein kinase activity for S. pombe Coq8 therefore
      over-reaches the evidence. The human COQ8B review keeps the IDA row from the same paper as non-core
      because the assay was on that protein; here the statement is transferred to a protein never assayed,
      so MARK_AS_OVER_ANNOTATED. Yeast Coq8 shows ATPase but not trans protein kinase activity (PMID:27499294).
    supported_by:
    - reference_id: file:SCHPO/coq8/coq8-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'Its substrate specificity is still unclear: may act as a protein kinase that mediates
        phosphorylation of coq3 (By similarity).'
    - reference_id: file:SCHPO/coq8/coq8-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: acts as a small molecule kinase, possibly a lipid kinase that phosphorylates a
        prenyl lipid in the ubiquinone biosynthesis pathway, as suggested by its ability to bind coenzyme
        Q lipid intermediates (By similarity).
    - reference_id: PMID:38425362
      supporting_text: COQ3, but not COQ6, is phosphorylated by COQ8B at multiple sites
    - reference_id: PMID:38425362
      supporting_text: We observed a basal unspecific ATPase activity
