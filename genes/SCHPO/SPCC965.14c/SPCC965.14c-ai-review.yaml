  label: Schizosaccharomyces pombe 972h-
description: SPCC965.14c (UniProt O59834; the fission yeast FCY1 ortholog) encodes a probable cytosine
  deaminase (EC 3.5.4.1), which deaminates cytosine to uracil for salvage to UMP by UPRT. By orthology
  to S. cerevisiae FCY1, it is the enzyme that converts 5-fluorocytosine to 5-fluorouracil. Function is
  assigned by orthology; it is cytosolic in a genome-wide screen.
