taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Sec2 is the fission-yeast long Sec2-family Rab guanine nucleotide
  exchange factor. It acts with the upstream Rab11/Ypt31-family GTPase Ypt3 and
  the downstream Sec4/Ypt2-family GTPase Ypt2 at polarized exocytic sites in
  vegetative cells, localizing to cell tips and the medial division region, and
  it is also recruited to spindle-pole-associated sites and the forespore
  membrane during spore membrane formation.
