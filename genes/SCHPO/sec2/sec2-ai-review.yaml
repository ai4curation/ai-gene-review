  review:
    summary: PomBase transferred the exocytosis role from budding-yeast SEC2.
    action: ACCEPT
    reason: Appropriate orthology transfer. The Ypt3-Sec2-Ypt2 Rab cascade
      functions in fission-yeast post-Golgi exocytosis and is the counterpart
