suggested_questions:
- question: Should the PomBase Sec2 GEF annotation be extended to identify Ypt2
    as the likely physiological Rab substrate, with Ypt3 captured separately as
    the upstream GTP-bound recruiter?
  experts: []
suggested_experiments:
- description: Directly assay purified S. pombe Sec2 against Ypt2, Ypt3, and
    other fission-yeast Rab proteins to confirm Ypt2 as the Sec2 substrate and
    separate exchange activity from Ypt3-effector binding.
