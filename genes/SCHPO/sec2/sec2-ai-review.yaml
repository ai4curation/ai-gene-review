taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: sec2 encodes the long fission-yeast Sec2-family Rab guanine
  nucleotide exchange factor. In vegetative cells Sec2 is recruited by the
  Rab11-family protein Ypt3 and acts with Ypt2/Sec4-family exocytic Rab
  signaling at cell tips and the medial division site; during meiosis it is
  also recruited with the exocytic Rabs and the exocyst to the spindle pole
  body and prospore membrane initiation sites.
