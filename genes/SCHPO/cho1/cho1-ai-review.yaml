suggested_questions:
- question: Does S. pombe cho1, like S. cerevisiae Opi3 and mammalian PEMT, also catalyse the first PE methylation
    at a low rate, giving partial redundancy with cho2?
suggested_experiments:
- description: Measure PE, PMME and PDME methyltransferase activities in microsomes from cho1, cho2 and cho1 cho2
    deletion strains to define the substrate range of each enzyme.
