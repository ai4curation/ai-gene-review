- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P08456
  review:
    summary: 'PomBase ortholog transfer of mitochondrial outer membrane with/from UniProtKB:P08456, which is S.
      cerevisiae Cho1, the phosphatidylserine synthase. S. pombe cho1 is not the ortholog of S. cerevisiae CHO1:
      it is the OPI3 ortholog (PEMT family), whereas the S. cerevisiae Cho1 ortholog in S. pombe is pps1.'
    action: REMOVE
    reason: The transfer source is a non-orthologous protein that shares only the gene name (CHO1), so the inference
      is invalid for this protein. No S. pombe evidence places cho1 in the mitochondrial outer membrane.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: UniProtKB:P08456
        source_label: CHO1 (S. cerevisiae phosphatidylserine synthase)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mitochondrial outer membrane may be valid for S. cerevisiae Cho1, but Cho1 is a CDP-alcohol phosphatidyltransferase
          unrelated to the PEMT/Opi3-family S. pombe cho1; the source was apparently chosen by gene-name identity.
          The S. pombe ortholog of P08456 is pps1 (O94584).
      residue_claims_not_applicable: Source and target belong to unrelated protein families; the failure is a wrong-ortholog
        selection, not a residue-level divergence.
    supported_by:
    - reference_id: PMID:9755189
      supporting_text: Sequence analysis of the cho1+ gene indicates that it encodes a protein closely related to
        phospholipid methyltransferases from Saccharomyces cerevisiae and rat.
    - reference_id: PMID:9755189
      supporting_text: Phospholipid methyltransferases encoded by a rat liver cDNA and the S. cerevisiae OPI3 gene
        are both able to complement the choline auxotrophy of the S. pombe cho1 mutants.
