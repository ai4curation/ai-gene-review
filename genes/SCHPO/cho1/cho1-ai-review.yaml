taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: cho1 encodes the phosphatidyl-N-methylethanolamine N-methyltransferase of Schizosaccharomyces pombe
  (EC 2.1.1.71), a small multi-pass ER membrane protein of the PEMT/Opi3 family. It catalyses the second and third
  S-adenosylmethionine-dependent methylations, phosphatidyl-N-monomethylethanolamine to phosphatidyl-N,N-dimethylethanolamine
  and then to phosphatidylcholine, after cho2 has made the first methylation of phosphatidylethanolamine. cho1 mutants
  are choline auxotrophs, and S. cerevisiae OPI3 and rat PEMT complement them. Despite the shared name, S. pombe
  cho1 is the ortholog of S. cerevisiae OPI3, not of S. cerevisiae CHO1 (phosphatidylserine synthase, whose S. pombe
  ortholog is pps1).
