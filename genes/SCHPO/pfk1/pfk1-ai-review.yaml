suggested_questions:
- question: Does the distinct N-terminal region of S. pombe Pfk1 determine its homo-octameric assembly,
    and does it carry the allosteric functions that are split between the alpha and beta subunits in S.
    cerevisiae?
suggested_experiments:
- description: Map allosteric effector sites in homo-octameric S. pombe Pfk1 by cryo-EM with AMP, fructose
    2,6-bisphosphate and inhibitory ATP bound, and compare with the S. cerevisiae Pfk1/Pfk2 hetero-octamer.
