core_functions:
- description: Pfk1 is the sole ATP-dependent 6-phosphofructokinase of S. pombe. It phosphorylates fructose
    6-phosphate to fructose 1,6-bisphosphate in the cytosol, the committed and allosterically controlled
    step of glycolysis (activated by AMP and fructose 2,6-bisphosphate, inhibited by ATP), acting as a
    homo-octamer of identical subunits rather than the alpha4beta4 hetero-octamer of S. cerevisiae.
  molecular_function:
