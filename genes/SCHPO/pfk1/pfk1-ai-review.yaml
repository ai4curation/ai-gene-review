  label: Schizosaccharomyces pombe 972h-
description: Pfk1 (SPBC16H5.02) is the ATP-dependent 6-phosphofructokinase of the fission yeast Schizosaccharomyces
  pombe, a two-domain PFKA-family enzyme of 942 residues encoded by a single gene. It catalyses the phosphorylation
  of fructose 6-phosphate by ATP to fructose 1,6-bisphosphate in the cytosol, the first committed step
  of glycolysis. Unlike the hetero-octameric (alpha4beta4) phosphofructokinase of Saccharomyces cerevisiae,
  the S. pombe enzyme is a homo-octamer of ~100 kDa subunits (~800 kDa). Kinetically it shows weaker cooperativity
  toward fructose 6-phosphate and weaker ATP inhibition than the budding-yeast enzyme; fructose 2,6-bisphosphate
  and AMP relieve ATP inhibition and raise its affinity for fructose 6-phosphate. Expression of S. pombe
  pfk1 restores glucose growth to a S. cerevisiae pfk1 pfk2 double mutant.
