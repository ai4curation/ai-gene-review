  label: Schizosaccharomyces pombe 972h-
description: 'SPAC16C9.02c (UniProt Q09816; the fission yeast MEU1/MTAP ortholog) encodes S-methyl-5''-thioadenosine
  phosphorylase (EC 2.4.2.28). It phosphorolyses MTA, the by-product of spermidine/spermine synthesis,
  to adenine and 5-methylthioribose-1-phosphate: the first step of the MTA cycle (methionine salvage),
  which also returns adenine to purine salvage. Function is assigned by orthology; a genome-wide screen
  places it in the cytosol.'
