  label: Schizosaccharomyces pombe 972h-
description: ssd1 (SPAC1002.12c) encodes one of two fission yeast succinate-semialdehyde dehydrogenases
  (with ssd2), members of the aldehyde dehydrogenase family orthologous to S. cerevisiae UGA2 and human
  ALDH5A1. It oxidises succinate semialdehyde to succinate using NAD+ or NADP+, the final step of GABA
  degradation (the GABA shunt) that follows GABA transamination by uga1 and returns carbon to the TCA
  cycle as succinate. Its activity and cofactor use are inferred from the S. cerevisiae enzyme; genome-wide
  localisation places it in the cytosol. Despite the shared symbol it is unrelated to S. cerevisiae SSD1,
  an RNA-binding protein.
