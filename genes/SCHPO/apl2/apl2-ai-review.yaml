- id: PMID:19624755
  title: Deletion mutants of AP-1 adaptin subunits display distinct phenotypes in fission yeast.
  findings:
  - statement: Apl2 is the beta subunit of S. pombe AP-1; it binds Apm1 independently of Aps1 and Apl4, and all
      four subunits are needed for complex formation, endosomal association and endosomal exit of Syb1.
    supporting_text: In pull-down assay, Apm1 binds Apl2 even in the absence of Aps1 and Apl4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary S. pombe characterization of the AP-1 subunits, and the source of the PomBase IDA
      rows. Abstract only in cache.
- id: PMID:23028933
  title: Sip1, a conserved AP-1 accessory protein, is important for Golgi/endosome trafficking in fission yeast.
  findings:
  - statement: GFP-Apl2 localizes to FM4-64-positive Golgi/endosomes in a Sip1-dependent manner, and Sip1 binds
      Apl2 in GST pull-downs.
    supporting_text: Results showed that the Sip1 protein bound to each of the subunits of the AP-1 complex
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Gives direct GFP-Apl2 localization data.
- id: PMID:21304827
  title: Role of the Small GTPase Rho3 in Golgi/Endosome trafficking through functional interaction with adaptin in
    Fission Yeast.
  findings:
  - statement: Rho3 overexpression suppresses Δapl2 phenotypes, and Rho3 binds GST-Apl2 in vitro.
    supporting_text: The results showed that the Rho3 protein bound to each of the subunits of the AP-1 complex
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Shows a genetic and physical link to Rho3; it does not define a new
      molecular function for Apl2.
- id: PMID:23840894
  title: Sip1, an AP-1 accessory protein in fission yeast, is required for localization of Rho3 GTPase.
  findings: []
  reference_review:
