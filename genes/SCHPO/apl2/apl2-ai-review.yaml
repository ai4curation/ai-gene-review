    summary: IBA from the deep beta-adaptin node PTN000123671. Its endocytosis evidence comes only from metazoan
      beta proteins (human AP2B1 P63010 and rodent, fly, worm and fish beta1/2 orthologs), where AP-2 beta, and
      in metazoa a partly redundant beta1, act at the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node placement is sound for the metazoan beta1/beta2 lineage, but fungi have a separate AP-2
      beta. In the beta-adaptin tree, S. pombe apl1 groups with the AP-2 beta clade, while apl2 sits in the
      fungal AP-1 beta clade. Plasma-membrane endocytosis is the AP-2 role. Apl2 also lacks the appendage
      domain that metazoan beta1/2 use to recruit endocytic accessory proteins. All S. pombe data on Apl2
      concern Golgi/endosome traffic, and none shows a role in endocytosis. The PAINT curators placed the
      fungal AP-1 complex assertion at a separate node, PTN000123672, seeded by apl2 itself. No S. pombe
      experiment excludes a contribution to endocytosis, so the term is marked as over-annotated rather than
