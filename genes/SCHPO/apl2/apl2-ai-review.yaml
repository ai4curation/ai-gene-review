gene_symbol: apl2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  apl2 encodes the beta1 (large) subunit of the fission yeast AP-1 clathrin adaptor complex, a heterotetramer
  with the gamma subunit apl4, the mu1 subunit apm1 and the sigma1 subunit aps1. The 683-residue protein
  consists of the Adaptin_N trunk domain followed by a short hinge carrying a clathrin-box motif (LLDLD); unlike
  metazoan beta adaptins it has no C-terminal appendage domain. In pull-down assays Apl2 binds Apm1 even without
  the other two subunits, and all four subunits are needed for the complex to assemble and associate with
  membranes. GFP-Apl2 localizes to punctate Golgi/endosomal compartments, and this localization depends on the
  p200/Laa1-family accessory protein Sip1. Deletion of apl2 causes temperature and immunosuppressant
  sensitivity, more severe than loss of the gamma or sigma subunits, together with endosomal accumulation of
  the v-SNARE Syb1. This indicates that AP-1 is required for cargo exit from endosomes toward the Golgi and for
  recycling. Apl2 also binds the Rho GTPase Rho3 in vitro, and Rho3 overexpression suppresses the deletion
  phenotypes. Apl2 is therefore a structural core subunit of the clathrin-associated AP-1 coat that sorts
  membrane cargo at the trans-Golgi network and endosomes. Its direct binding to clathrin has not been tested
  in S. pombe and is inferred from the conserved clathrin box.
