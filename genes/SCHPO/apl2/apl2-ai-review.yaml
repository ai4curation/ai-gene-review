    review_notes: Mainly about Sip1 and Rho3. Background context; not used as support.
- id: PMID:15047861
  title: Loss of Apm1, the micro1 subunit of the clathrin-associated adaptor-protein-1 complex, causes distinct
    phenotypes and synthetic lethality with calcineurin deletion in fission yeast.
  findings: []
  reference_review:
    relevance: LOW
