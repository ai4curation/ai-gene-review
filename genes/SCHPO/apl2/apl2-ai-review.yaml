core_functions:
- description: >-
    Beta1 subunit and structural scaffold of the AP-1 clathrin adaptor heterotetramer (with apl4, apm1, aps1).
    Its trunk domain binds the mu1 subunit Apm1, and it contributes to the clathrin-cargo adaptor activity of
    the complex. Complex membership is experimentally established in S. pombe. Clathrin binding and the
    adaptor activity are inferred from the conserved clathrin box and from AP-1 orthologs.
  contributes_to_molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  - id: GO:0099638
    label: endosome to plasma membrane protein transport
  locations:
  - id: GO:0005802
    label: trans-Golgi network
  - id: GO:0005768
    label: endosome
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  supported_by:
  - reference_id: PMID:19624755
    supporting_text: In pull-down assay, Apm1 binds Apl2 even in the absence of Aps1 and Apl4
  - reference_id: PMID:19624755
    supporting_text: the four subunits are all essential for the heterotetrameric complex formation and for the
      AP-1 function in exit transport from endosomes
  - reference_id: PMID:23028933
    supporting_text: suggesting that the four adaptin subunits of the AP-1 complex are localized to the
      Golgi/endosomes
- description: >-
    Clathrin binding through the hinge clathrin-box motif LLDLD (623-627). This is inferred from sequence
    conservation and the AP-1 beta orthology; it has not been tested in S. pombe.
  molecular_function:
    id: GO:0030276
    label: clathrin binding
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  supported_by:
  - reference_id: file:SCHPO/apl2/apl2-bioinformatics/RESULTS.md
    supporting_text: 'One clathrin-box consensus match L[LI][DEN][LF][DE]: LLDLD at 623-627'
suggested_questions:
- question: Does Apl2 bind clathrin directly in S. pombe through its LLDLD hinge motif, given that it lacks the
    appendage domain that provides the second clathrin contact in metazoan beta adaptins?
- question: Does AP-1 return Syb1 from endosomes to the TGN, or recycle it directly to the plasma membrane? In
    other words, which of GO:0042147 and GO:0099638 describes the Apl2-dependent step?
- question: Does fission yeast AP-1 contribute at all to plasma-membrane endocytosis, or is that role restricted
    to AP-2 (apl1-containing) complexes as the separate fungal AP-2 beta clade suggests?
suggested_experiments:
- description: In vitro binding of recombinant Apl2 hinge (wild type and an LLDLD-to-AAAAA mutant) to the S. pombe
    clathrin heavy-chain terminal domain, plus complementation of Δapl2 with the mutant to test the role of the
    clathrin box in Syb1 sorting.
- description: Time-resolved imaging of Syb1 and an endosome-to-TGN cargo in Δapl2 cells co-labelled with TGN
    (Sec72) and early endosome markers, to place the trafficking block.
- description: FM4-64 and Lucifer Yellow uptake assays in Δapl2 versus Δapl1 cells, to test whether AP-1 beta
    contributes to endocytosis.
