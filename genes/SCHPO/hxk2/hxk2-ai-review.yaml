taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'Hexokinase 2 of fission yeast, the kinetically conventional cytosolic hexokinase (EC 2.7.1.1) that phosphorylates
  D-glucose with high affinity (Km about 0.16 mM) as well as D-fructose and D-mannose. It is the main glucose-phosphorylating
  enzyme: its loss doubles the generation time on glucose, whereas loss of hxk1 has no effect, and cells lacking both hexokinases
  cannot grow on glucose or fructose. S. pombe has no separate glucose-specific glucokinase, so hxk2 carries out the first
  step of glycolysis on glucose.'
