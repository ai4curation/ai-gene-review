suggested_questions:
- question: >-
    Does S. pombe use the same DHRSX/TDA5-type dehydrogenase steps flanking dfg10 (polyprenol oxidation
    and dolichal reduction), and which S. pombe SDR performs them?
suggested_experiments:
- description: >-
    Measure polyprenol, polyprenal and dolichol in an S. pombe dfg10 deletion and test complementation
    by human SRD5A3.
