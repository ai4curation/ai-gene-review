  label: Schizosaccharomyces pombe 972h-
description: >-
  dfg10 (SPAC7D4.09c; UniProt O14264, still named "Uncharacterized protein C7D4.09c") is the fission

  yeast member of the Dfg10/SRD5A3 branch of the steroid 5-alpha reductase family, a multi-pass

  endoplasmic reticulum membrane protein. By orthology to budding-yeast Dfg10 and human SRD5A3 it is the

  NADPH-dependent polyprenal reductase that reduces the alpha-isoprene double bond of polyprenal to

  give dolichal, the middle step of the polyprenol to polyprenal to dolichal to dolichol route. The

  dolichol produced is phosphorylated by sec59 to dolichyl phosphate, the lipid carrier for N-glycan

  precursor assembly, Dol-P-mannose and Dol-P-glucose. A genome-wide screen localized it to the ER; no

  direct S. pombe biochemical or genetic study has been reported.
