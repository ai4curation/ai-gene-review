  label: Schizosaccharomyces pombe 972h-
description: lys1 (SPAP7G5.04c; UniProt P40976), the fission yeast ortholog of S. cerevisiae LYS2, encodes
  L-2-aminoadipate reductase (AAR), the signature multidomain enzyme of the fungal alpha-aminoadipate
  pathway. Built like an NRPS module (adenylation, peptidyl-carrier and reductase domains), it adenylates
  alpha-aminoadipate, loads it onto its phosphopantetheine arm, and NAD(P)H-reduces it to alpha-aminoadipate
  semialdehyde. The carrier domain is activated by the PPTase lys7. Unusually, recombinant S. pombe Lys1p
  is already partly active without added PPTase. lys1 mutants are classical lysine auxotrophs, and lys1+
  is a standard marker. It is cytosolic in a genome-wide screen.
