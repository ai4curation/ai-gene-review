  - UniProtKB:Q9H6U8
  review:
    summary: PAINT inference of generic alpha-1,2-mannosyltransferase; correct, but both specific Dol-P-Man
      activities (Man6 and Man8 acceptors) are annotated and are its descendants.
    action: MODIFY
    reason: 'Changed from KEEP_AS_NON_CORE: the term is correct but general, and the gene carries two is_a descendants that together state the activity (GO:0052926 on the Man(6) acceptor and GO:0052918 on the Man(8) acceptor, both ACCEPT here), so both are listed as replacements. UniProt curates both Dol-P-Man-dependent alpha-1,2-mannosylation reactions (RHEA:29531, RHEA:29539) with a by-similarity function statement (ECO:0000250), and the protein is in glycosyltransferase family 22 (Pfam PF03901); the PAINT node is seeded by characterised ALG9 orthologs (S. cerevisiae ALG9, human ALG9). No S. pombe enzyme assay.'
    proposed_replacement_terms:
    - id: GO:0052926
      label: dol-P-Man:Man(6)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    - id: GO:0052918
      label: dol-P-Man:Man(8)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
