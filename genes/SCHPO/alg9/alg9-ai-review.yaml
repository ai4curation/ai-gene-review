taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: alg9 (SPAC1834.05; UniProt Q9P7Q9) encodes the Dol-P-Man-dependent alpha-1,2-mannosyltransferase
  Alg9, which adds the seventh and ninth mannoses. In the lumenal phase of dolichol-linked oligosaccharide
  (Glc3Man9GlcNAc2-PP-Dol) assembly on the ER membrane, it adds the next sugar to the growing precursor
  that oligosaccharyltransferase transfers to nascent glycoproteins. Function is assigned by orthology
  to the S. cerevisiae ALG enzymes.
