id: Q09694
gene_symbol: lys3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  lys3 (SPAC227.18; UniProt Q09694) encodes the S. pombe saccharopine
  dehydrogenase [NAD(+), L-lysine-forming], a cytosolic fungal LYS1/lys3-family
  enzyme that catalyzes the final alpha-aminoadipate-pathway step of
  L-lysine biosynthesis. It cleaves L-saccharopine with NAD(+) and water to
  yield L-lysine, 2-oxoglutarate, NADH, and a proton; classical lys3 mutants
  are lysine auxotrophs blocked at the saccharopine dehydrogenase step.
