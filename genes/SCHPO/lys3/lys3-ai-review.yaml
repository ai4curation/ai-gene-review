    summary: >-
      The eukaryotic PTN000123605 IBA correctly recognizes a saccharopine
      dehydrogenase, but lys3 lies in the exact fungal NAD(+),
      L-lysine-forming SF23 branch.
    action: MODIFY
    reason: >-
      PTN000123605 is a sound broad saccharopine-dehydrogenase ancestor seeded
      by fungal reciprocal enzymes, plant enzymes, metazoan AASS enzymes, and
      Candida LYS1. For Q09694 the term is too generic because the PANTHER
      member table places lys3 in PTHR11133:SF23, with S. cerevisiae LYS1,
      C. albicans LYS1, and Neurospora lys-4, and GOA already contains the
      exact NAD(+), L-lysine-forming GO:0004754 activity.
