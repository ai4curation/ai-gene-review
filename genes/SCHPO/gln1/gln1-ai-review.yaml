  label: Schizosaccharomyces pombe 972h-
description: gln1 (SPAC23H4.06; UniProt Q09179) encodes the only glutamine synthetase of fission yeast
  (EC 6.3.1.2). It makes glutamine from glutamate, ammonia and ATP, and with glutamate synthase (glt1)
  forms the GS/GOGAT ammonia assimilation cycle that operates especially under nitrogen limitation. gln1
  mutants lack GS activity and need glutamine. GS activity is high in ammonia-limited cultures and falls
  quickly when ammonia is added. The enzyme is cytosolic in a genome-wide screen.
