        source_label: Cpn10 mitochondrial localization node
        source_status: SUPPORTS_TRANSFER
        comment: PAINT assigns mitochondrion on a clade that includes fission-yeast Hsp10, and
          the broad organelle claim is independently consistent with UniProt's matrix placement.
