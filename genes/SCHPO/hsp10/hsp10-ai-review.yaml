suggested_questions:
- question: Which S. pombe mitochondrial matrix substrates are most dependent on hsp10-mediated
    gating of the Hsp60 folding chamber rather than on Hsp60 alone?
  experts: []
suggested_experiments:
- hypothesis: S. pombe hsp10 is needed for a subset of mitochondrial matrix proteins to reach
    folded, assembled states after import.
  description: Acutely deplete or conditionally inactivate hsp10 and use quantitative mitochondrial
    proteomics with solubility, protease-resistance, and complex-assembly readouts to identify
    matrix clients whose post-import folding depends on the Cpn10 co-chaperonin.
  experiment_type: conditional mitochondrial folding proteomics
