- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT2G44650
  - PANTHER:PTN000080668
  - SGD:S000005546
  - UniProtKB:P0A6F9
  - UniProtKB:Q8IDZ8
  review:
    summary: Protein folding is the conserved core process mediated by mitochondrial Cpn10/Hsp10.
    action: ACCEPT
    reason: Retain as the central biological process. Yeast Hsp10 is required for folding and
      assembly of proteins imported into the matrix and purified Hsp10 cooperates with Hsp60 in
      ATP-dependent substrate refolding.
    supported_by:
    - reference_id: PMID:7913473
      supporting_text: Hsp10 is required for the folding and assembly of proteins imported into the matrix compartment
    - reference_id: PMID:9256426
      supporting_text: In the presence of ATP, the purified yeast chaperonins mediate the refolding of mitochondrial malate dehydrogenase.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000080668
        source_label: ancestral Cpn10/GroES node
        source_status: SUPPORTS_TRANSFER
        comment: The root Cpn10 protein-folding node is supported by yeast HSP10 and other
          characterized Cpn10 proteins; fission-yeast hsp10 remains in the conserved Cpn10 clade.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR018369
  - InterPro:IPR020818
  - InterPro:IPR037124
  review:
    summary: The InterPro Cpn10 signatures support the conserved protein-folding role.
    action: ACCEPT
    reason: Retain protein folding for the Cpn10-family protein. The same Cpn10 signatures that
      identify hsp10 are experimentally tied to yeast Hsp10-dependent mitochondrial protein
      folding and Hsp60 binding.
    supported_by:
    - reference_id: PMID:7902576
      supporting_text: subsequent refolding of Rubisco is strictly dependent upon yeast cpn10
    - reference_id: PMID:7913473
      supporting_text: Hsp10 is required for the folding and assembly of proteins imported into the matrix compartment
- term:
    id: GO:0030150
    label: protein import into mitochondrial matrix
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P38910
  review:
    summary: PomBase transfers a mitochondrial matrix-import process from budding-yeast HSP10.
    action: KEEP_AS_NON_CORE
    reason: Keep as a non-core pathway-context annotation. Hsp10 acts after translocation to fold
      and assemble imported matrix proteins, and it can affect proteins that transit the matrix
      en route to the intermembrane space; the gene product does not drive the membrane-crossing
      transport step itself. The direct core process is protein folding in the matrix.
    supported_by:
    - reference_id: PMID:7913473
      supporting_text: Hsp10 is required for the folding and assembly of proteins imported into the matrix compartment
- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020818
  review:
    summary: The InterPro Cpn10 signature supports hsp10 as the Cpn10 partner of the Hsp60
      protein-folding chaperonin.
    action: ACCEPT
    reason: Retain as the molecular role hsp10 contributes to with Hsp60. Hsp10/Cpn10 caps the
      Hsp60/Cpn60 folding chamber and regulates its ATP cycle, so it contributes to the Hsp60-Hsp10
      protein-folding chaperone system even though it is not the ATP-binding ring subunit.
    supported_by:
    - reference_id: PMID:7902576
      supporting_text: In the presence of MgATP, yeast cpn60 and yeast cpn10 form a stable complex that can be isolated by gel filtration and that facilitates refolding of denatured Rubisco.
    - reference_id: PMID:9256426
      supporting_text: inhibition of ATP hydrolysis is mechanistically coupled to chaperonin-mediated protein folding
- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - SGD:S000000004
  review:
    summary: The protein-folding chaperone claim is correct, but the PomBase ISO row names the
      wrong budding-yeast donor.
    action: ACCEPT
    reason: Retain the GO term because hsp10 is the S. pombe ortholog of the conserved Cpn10
      co-chaperonin and Hsp10 contributes to Hsp60-dependent protein folding. The ISO evidence,
      however, cites SGD:S000000004 (SSA1/YAL005C, a cytosolic Hsp70), while the budding-yeast
      HSP10 ortholog is SGD:S000005546.
    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: POMBASE
      slot: With/From
      requested_change: REPOINT
      asserted_value: SGD:S000000004
      corrected_value: SGD:S000005546
      corrected_label: HSP10/YOR020C
      cause: IDENTIFIER_TRANSPOSITION
      confidence: CONFIRMED
      explanation: >-
        The hsp10 ISO annotation to GO:0044183 cites SGD:S000000004 as its
        With/From donor. SGD:S000000004 is SSA1/YAL005C, a cytosolic Hsp70; the
        S. cerevisiae ortholog that supports the transfer is HSP10/YOR020C,
        SGD:S000005546.
    supported_by:
    - reference_id: PMID:7902576
      supporting_text: identify the groES homolog cpn10 in yeast mitochondria
    - reference_id: PMID:7902576
      supporting_text: subsequent refolding of Rubisco is strictly dependent upon yeast cpn10
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000080668
  - UniProtKB:P9WPE5
  review:
    summary: The PANTHER metal-binding assertion is a root-family transfer from a bacterial
      crystal structure and is not established for mitochondrial Hsp10.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source IBD sits at the ancestral Cpn10/GroES node and rests on one
      M. tuberculosis Cpn10 structure that identified metal ion sites in the dome loop and
      proposed a stabilizing role. That is not enough to establish conserved metal binding as
      part of the S. pombe mitochondrial Hsp10 molecular function; no fission-yeast or
      budding-yeast experiment demonstrates this activity, and the core conserved role is
      Hsp60 binding and folding-chamber regulation.
    supported_by:
    - reference_id: PMID:11807250
      supporting_text: The binding sites for metal ions in the dome loop of cpn10 have been identified
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000080668
        source_label: ancestral Cpn10/GroES node
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The metal-binding IBD is placed at the 2020 root node of PTHR10772 from a
          single Mycobacterium tuberculosis Cpn10 crystal structure, so it is plausible but
          over-propagated to mitochondrial Hsp10 proteins.
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000080668
  - SGD:S000005546
  - UniProtKB:P61604
  - UniProtKB:Q8IDZ8
  review:
    summary: Hsp60/Cpn60 binding is the conserved direct molecular activity of Cpn10/Hsp10.
    action: ACCEPT
    reason: Retain as the most precise molecular function. Yeast Hsp10 binds Hsp60 with
      high affinity in a nucleotide-dependent manner and regulates the Hsp60 folding cycle.
    supported_by:
    - reference_id: PMID:9256426
      supporting_text: In the presence of ADP, one molecule of hsp10 binds to hsp60 with an apparent Kd of 0.9 nM
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000080668
        source_label: ancestral Cpn10/GroES node
        source_status: SUPPORTS_TRANSFER
        comment: The binding assertion is rooted at the conserved Cpn10/GroES-family node and
          is supported by direct budding-yeast HSP10-HSP60 interaction measurements.
