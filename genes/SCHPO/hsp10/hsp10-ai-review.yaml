  label: Schizosaccharomyces pombe 972h-
description: hsp10 encodes the mitochondrial matrix Cpn10/GroES-family co-chaperonin that binds
  the Cpn60/Hsp60 chaperonin, regulates its ATP-dependent folding chamber, and supports folding
  and assembly of imported mitochondrial proteins.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018369
  - InterPro:IPR020818
  review:
    summary: The Cpn10/GroES InterPro signatures are mis-mapped to ATP binding for this protein.
    action: REMOVE
    reason: Hsp10/Cpn10 regulates the Cpn60/Hsp60 ATPase-driven folding cycle, but the ATP-binding
      and ATP-hydrolysis activity resides in the Cpn60/Hsp60 chaperonin ring rather than in the
      Hsp10 co-chaperonin. Purified yeast Hsp10 binds Hsp60 in a nucleotide-dependent complex and
      inhibits Hsp60 ATPase activity; Hsp10 itself was assayed as the regulatory cofactor, not as an
      ATP-binding enzyme.
    supported_by:
    - reference_id: PMID:9256426
      supporting_text: Hsp10 inhibits the ATPase activity of hsp60 by about 40%.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: The PomBase HDA row comes from the fission-yeast proteome-scale localization study.
    action: ACCEPT
    reason: Retain the broad mitochondrial localization. PomBase curated this row from the
      fission-yeast ORFeome YFP localization dataset; the cached abstract confirms that Matsuyama
      et al. determined localization for roughly 90% of the S. pombe proteome.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: Next, we determined the localization of 4,431 proteins, corresponding to approximately 90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
- term:
    id: GO:0005739
