  - RGD:3208
  - SGD:S000000230
  - UniProtKB:Q38EM5
  - UniProtKB:Q57TX8
  - UniProtKB:Q9BV79
  review:
    summary: PAINT inference of mitochondrial location.
    action: ACCEPT
    reason: There is no sub-mitochondrial assay of S. pombe Etr1. The curated UniProt location (mitochondrion
      matrix) is by similarity to S. cerevisiae Etr1 (UniProtKB:P38071), and the record also predicts an
      N-terminal mitochondrial transit peptide (residues 1-18, sequence analysis); the protein falls in the
      PANTHER mitochondrial enoyl-ACP reductase family. Two independent lines (ortholog location, transit
      peptide) therefore agree on a mitochondrial, matrix-facing soluble enzyme, which is also where the
      type II fatty acid synthase acts. The genome-wide ORFeome screen (PMID:16823372) reported a cytoplasmic
      signal instead, so the location is inferred rather than shown for this protein.
    supported_by:
    - reference_id: file:SCHPO/etr1/etr1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion matrix'
