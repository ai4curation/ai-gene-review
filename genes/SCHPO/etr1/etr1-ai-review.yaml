  label: Schizosaccharomyces pombe 972h-
description: etr1 (SPAC26F1.04c; UniProt Q10488) encodes the mitochondrial MDR-family trans-2-enoyl-ACP
  reductase (Etr1), which reduces trans-2-enoyl-ACP to acyl-ACP with NADPH, completing each elongation
  cycle of mitochondrial type II fatty acid synthesis. Function is assigned by orthology to S. cerevisiae
  ETR1.
