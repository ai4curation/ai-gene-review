      supporting_text: >-
        A CEN plasmid-encoded YMIP protein restored normal MIP activity along
        with respiratory competence.
    - reference_id: PMID:21525245
      supporting_text: >-
        Oct1 cleavage increases the half-life of its substrate proteins, most
        likely by removing destabilizing amino acids at the intermediate's
        N-terminus.
