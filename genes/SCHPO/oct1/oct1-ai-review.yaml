- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      The S. pombe ORFeome study systematically localized most fission-yeast
      proteins by YFP tagging.
    supporting_text: we determined the localization of 4,431 proteins
- id: PMID:8035833
  title: >-
    MIP1, a new yeast gene homologous to the rat mitochondrial intermediate
    peptidase gene, is required for oxidative metabolism in Saccharomyces
    cerevisiae.
  findings:
  - statement: >-
      S. cerevisiae MIP1/OCT1 encodes the 772-aa zinc-motif-containing yeast
      mitochondrial intermediate peptidase; plasmid YMIP restores MIP activity
      and respiratory competence to mip1 mutant mitochondria.
    supporting_text: >-
      A CEN plasmid-encoded YMIP protein restored normal MIP activity along
      with respiratory competence.
- id: PMID:10332043
  title: >-
    Mitochondrial intermediate peptidase and the yeast frataxin homolog together
    maintain mitochondrial iron homeostasis in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Yeast Oct1/YMIP functionally interacts with frataxin/Yfh1 and affects
      mitochondrial iron levels through maturation of iron-utilizing
      mitochondrial proteins.
    supporting_text: >-
      YMIP is activated by ferrous iron in vitro and loss of YMIP activity
      leads to mitochondrial iron depletion
- id: PMID:21525245
  title: 'Mitochondrial protein turnover: role of the precursor intermediate peptidase Oct1 in protein stabilization.'
  findings:
  - statement: >-
      Yeast Oct1 removes destabilizing N-terminal octapeptides from
      MPP-generated precursor intermediates to stabilize mature imported
      mitochondrial proteins.
    supporting_text: >-
      Thus Oct1 converts unstable precursor intermediates generated by MPP into
      stable mature proteins.
- id: PMID:22984266
  title: Processing and topology of the yeast mitochondrial phosphatidylserine decarboxylase 1.
  findings:
  - statement: >-
      Yeast Psd1 maturation includes N-terminal processing by MPP and Oct1
      before Psd1 self-cleavage.
    supporting_text: >-
      We show that processing of Psd1 involves the action of the mitochondrial
      processing peptidase and Oct1
- id: PMID:28821623
  title: >-
    Proteolytic cleavage by the inner membrane peptidase (IMP) complex or Oct1
    peptidase controls the localization of the yeast peroxiredoxin Prx1 to
    distinct mitochondrial compartments.
  findings:
  - statement: >-
      Yeast Prx1 is sequentially processed by MPP and then Oct1 during import
      into the matrix.
    supporting_text: >-
      Prx1 is sequentially cleaved by mitochondrial processing peptidase and
      then by octapeptidyl aminopeptidase 1 (Oct1).
- id: PMID:1560019
  title: Amino-terminal octapeptides function as recognition signals for the mitochondrial intermediate peptidase.
  findings:
  - statement: >-
      MPP-generated N-terminal octapeptides can direct recognition by purified
      mammalian MIP.
    supporting_text: >-
      these octapeptides, present at the amino termini of the intermediates,
      direct recognition of these substrates by the mitochondrial intermediate
      peptidase
- id: PMID:1672532
  title: >-
    Cleavage of precursors by the mitochondrial processing peptidase requires a
    compatible mature protein or an intermediate octapeptide.
  findings:
  - statement: >-
      Many mitochondrial precursors are processed sequentially by MPP and MIP.
    supporting_text: >-
      Many precursors of mitochondrial proteins are processed in two successive
      steps by independent matrix peptidases
