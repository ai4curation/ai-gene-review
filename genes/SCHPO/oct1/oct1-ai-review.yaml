- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001617
  review:
    summary: >-
      Orthology transfer of a real S. cerevisiae iron-homeostasis phenotype,
      kept as a secondary consequence of substrate maturation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The S. cerevisiae source paper shows that Oct1/MIP functionally interacts
      with frataxin/Yfh1 and affects mitochondrial iron levels through
      maturation of ferrochelatase and other iron-using mitochondrial proteins.
      That supports transfer to the fission-yeast ortholog, but iron
      homeostasis is downstream of the core Oct1 precursor-processing reaction
      rather than an independent molecular role.
    supported_by:
    - reference_id: PMID:10332043
      supporting_text: >-
        loss of YMIP activity leads to mitochondrial iron depletion, suggesting
        that YMIP is part of a feedback loop in which iron stimulates maturation
        of YMIP substrates
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: SGD:S000001617
        source_label: S. cerevisiae OCT1
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The S. cerevisiae source directly supports Oct1 as a contributor to
          mitochondrial iron balance through maturation of iron-utilizing
          substrates, but this remains secondary to precursor processing.
