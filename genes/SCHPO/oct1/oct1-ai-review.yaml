id: Q10415
gene_symbol: oct1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Oct1 is the conserved mitochondrial intermediate peptidase of fission yeast, a
  zinc-dependent M3-family metalloendopeptidase predicted to reside in the
  mitochondrial matrix. By homology to S. cerevisiae Oct1/Mip1 and mammalian
  MIPEP, it removes an N-terminal octapeptide from selected nuclear-encoded
  mitochondrial precursor intermediates after the initial MPP cleavage, thereby
  producing stable mature forms of a subset of imported matrix and
  inner-membrane proteins.
