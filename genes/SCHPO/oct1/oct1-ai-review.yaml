  review:
    summary: >-
      PAINT inference of conserved mitochondrial intermediate peptidase
      activity in the Oct1/MIPEP subfamily.
    action: ACCEPT
    reason: >-
      S. pombe Oct1 belongs to the PANTHER mitochondrial intermediate
      peptidase subfamily PTHR11804:SF79, and no PAINT loss lies on its
      lineage. The S. cerevisiae ortholog Oct1/Mip1 is an experimentally
      characterized mitochondrial intermediate peptidase: a plasmid-encoded
      YMIP restored MIP activity and respiratory growth in a mip1 mutant, and
      later yeast work showed Oct1-dependent removal of octapeptides from
      multiple imported mitochondrial precursor intermediates.
    supported_by:
