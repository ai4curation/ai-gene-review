id: O43091
gene_symbol: dps1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: dps1 encodes subunit 1 of the fission yeast decaprenyl diphosphate synthase, a heterotetramer
  of two Dps1 and two Dlp1 subunits. The enzyme is a trans-prenyltransferase of the FPP/GGPP synthase
  family that condenses seven isopentenyl diphosphate units onto farnesyl diphosphate to make all-trans-decaprenyl
  diphosphate, the C50 side chain of ubiquinone-10 (coenzyme Q10). Dps1 carries the conserved polyprenyl
  synthase motifs; Dlp1 is only weakly similar, yet both are required for activity. Loss of dps1 abolishes
  CoQ10 synthesis, giving the coq-mutant phenotypes of oxidative-stress sensitivity, sulfide overproduction
  and a need for antioxidants on minimal medium. Dps1 localises to mitochondria. Human PDSS1 complements
  the dps1 deletion.
