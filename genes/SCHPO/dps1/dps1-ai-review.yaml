  label: Schizosaccharomyces pombe 972h-
description: 'dps1 (UniProt O43091) encodes one of the two subunits of the fission yeast heterotetrameric
  decaprenyl diphosphate synthase (Dps1-Dlp1). This trans-prenyltransferase extends FPP with IPP to all-trans-decaprenyl
  diphosphate, the side chain of ubiquinone-10. Both subunits are needed for activity: Dps1 resembles
  canonical prenyl diphosphate synthases, while Dlp1 is only weakly similar. Loss of either abolishes
  CoQ10 synthesis, giving the coq-mutant phenotypes of oxidative-stress sensitivity and a need for antioxidants
  on minimal medium. The enzyme is mitochondrial.'
