  qualifier: involved_in
  review:
    summary: IMP for trans,trans-farnesyl diphosphate biosynthesis from the dps disruptant. Dps1 uses
      FPP as its allylic primer and extends it to decaprenyl diphosphate; it does not form FPP.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:9133618
      supporting_text: This disruptant was not able to synthesize ubiquinone and had no detectable decaprenyl
        diphosphate synthase activity
    - reference_id: file:SCHPO/dps1/dps1-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=7 isopentenyl diphosphate + (2E,6E)-farnesyl diphosphate = all-trans-decaprenyl
        diphosphate + 7 diphosphate
    reason: By definition GO:0045337 is the formation of 2-trans,6-trans-farnesyl diphosphate. In the
      enzyme's curated reaction FPP is the substrate, not the product, and the phenotypes reported for
      the disruptant (no ubiquinone, no decaprenyl diphosphate synthase activity; PMID:9133618) say nothing
      about FPP formation, which in S. pombe belongs to the FPP synthase. The paper's full text is not
      cached, so the curator's reading cannot be checked fully, and the row is not removed; it is marked
      as an over-annotation that probably reflects the product's use of FPP. The correct process, GO:0006744,
      is accepted, and GO:0008299 covers isoprenoid chain elongation.
