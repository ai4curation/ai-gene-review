  review:
    summary: Genome-wide screen of mating-type switching factors in which cbp1 (abp1) deletion
      gives a variegated directionality phenotype.
    action: KEEP_AS_NON_CORE
    reason: Abp1 (Cbp1) is a genuine donor-choice factor in S. pombe; it binds the silent mat
      region and is needed for spreading of the Swi2-Swi5 recombination-promoting complex and
      for Mc-dependent Swi2 expression. This is a real but specialized role built on its general
      chromatin-adaptor activity, so it is non-core. The evidence in this paper is a mutant
      phenotype, so IMP would describe it better than IDA, but the term is correct.
    supported_by:
