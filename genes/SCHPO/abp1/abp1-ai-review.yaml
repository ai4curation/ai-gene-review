  title: Fission yeast CENP-B homologs nucleate centromeric heterochromatin by promoting
    heterochromatin-specific histone tail modifications.
  findings:
  - statement: Abp1 binds centromeric heterochromatin and, redundantly with Cbh1 and Cbh2, is needed
