taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Abp1 (ARS-binding protein 1, also called Cbp1; SPBC1105.04c) is a 522-residue nuclear,
  sequence-specific DNA-binding protein of fission yeast and the dominant member of the three
  S. pombe CENP-B-like proteins (with Cbh1 and Cbh2). It has two N-terminal helix-turn-helix
  DNA-binding domains (the ABP1-type and CENP-B-type HTH domains, solved by NMR bound to a
  21-bp recognition site), followed by a region derived from a pogo-like DDE transposase and
  a C-terminal dimerization region. The fission-yeast CENP-B-like proteins arose from a single
  domestication of a pogo-like transposase in the Schizosaccharomyces lineage, independently of
  mammalian CENP-B; no transposase or nuclease catalytic activity has been shown for Abp1. Abp1
  binds AT-rich sites in replication origins (ARS3002), the centromeric central core and a 10-bp
  motif in the long terminal repeats (LTRs) of Tf2 retrotransposons, and it occupies centromeric
  heterochromatin, origins, LTRs, rDNA repeats, the silent mating-type region and gene promoters
  in vivo. At these sites it acts as a recruitment platform: it brings class I/II histone
  deacetylases to Tf2 elements to silence them and cluster them into nuclear Tf bodies, recruits
  Cbh1 to LTRs, is needed for the mating-type regulator Mc to bind the swi2 promoter, and,
  redundantly with Cbh1 and Cbh2, promotes Swi6/HP1 recruitment and heterochromatic histone H3
  modifications at centromeres. Loss of Abp1 causes slow growth, chromosome missegregation,
  Tf2 derepression and mobilization, pervasive RNA polymerase II transcription at Tf2 and rDNA,
  ectopic RNAi-dependent rDNA heterochromatin, defective donor choice in mating-type switching,
  and fork stalling at Sap1-bound LTRs; deletion of all three CENP-B-like genes is lethal.
