  - statement: Abp1 binds cc2 central-core DNA and abp1 nulls show mitotic chromosome instability
      and a meiotic defect.
    supporting_text: Although inactivation of the abp1 gene is not lethal, the abp1 null strain displays
      marked mitotic chromosome instability and a pronounced meiotic defect.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked.
- id: PMID:17940212
  title: Convergent domestication of pogo-like transposases into centromere-binding proteins
    in fission yeast and mammals.
  findings:
  - statement: Abp1, Cbh1 and Cbh2 derive from a single pogo-transposase domestication in the
      fission-yeast lineage, independent of mammalian CENP-B and of Saccharomycetales Pdc2.
    supporting_text: Several lines of evidence suggest that Pdc2 is not orthologous to the fission
      yeast CENP-B -like genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked; establishes that no subfamily-specific function should be transferred
