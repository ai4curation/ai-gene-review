- term:
    id: GO:0010526
    label: transposable element silencing
  evidence_type: IMP
  original_reference_id: PMID:18094683
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Abp1 binds Tf2 LTRs and recruits HDACs to silence Tf2
      retrotransposons; its loss derepresses and mobilizes Tf2.
    action: NEW
    reason: Abp1 does part of the work of this process, as the DNA-binding adaptor that marks the
      LTR and brings the deacetylases that carry out silencing (comparable to other site-specific
      silencing recruiters), not merely a target or a requirement. Abp1 is the primary Tf2 silencing
      factor in S. pombe, shown by deletion, domain-mutant and ChIP data from several groups. Other
      Tf2 silencing factors such as Set1 and the Fft3 remodeler carry terms in this branch, so the
      term fits this kind of participant. A heterochromatin-specific child was not chosen because
      Abp1-dependent Tf2 silencing works through HDAC recruitment and Tf body clustering rather than
      classical H3K9me heterochromatin.
    supported_by:
    - reference_id: PMID:18094683
      supporting_text: CENP-B homologues of S. pombe localize at and recruit histone deacetylases
        to silence Tf2 retrotransposons.
    - reference_id: PMID:22907751
      supporting_text: Intriguingly, we uncovered an unexpected cooperation between Abp1 and the histone
        H3K4 methyltransferase Set1 in regulating sense and antisense transcriptional silencing of
        Tf2 retrotransposons and Tf body integrity.
    - reference_id: PMID:27343236
      supporting_text: Deletion of genes such as set1(+) (histone H3 lysine 4 methyltransferase) or
        abp1(+) (CENP-B homolog) that both alleviate silencing and clustering, result in a corresponding
        increase in mobilization.
