core_functions:
- description: Sequence-specific binding of centromeric DNA (central-core sites) through the
    N-terminal HTH domains, positioning Abp1 at centromeres where it acts, redundantly with Cbh1
    and Cbh2, as a nucleation factor for centromeric heterochromatin and supports chromosome
    segregation.
  molecular_function:
    id: GO:0019237
    label: centromeric DNA binding
  directly_involved_in:
  - id: GO:0031508
    label: pericentric heterochromatin formation
  locations:
  - id: GO:0000779
    label: condensed chromosome, centromeric region
  supported_by:
  - reference_id: PMID:10733588
    supporting_text: In this study, we determined that Abp1p binds to at least one of its target
      sequences within S. pombe centromere II central core (cc2) DNA with an affinity (K(s) = 7
      x 10(9) M(-1)) higher than those of other known centromere DNA-binding proteins for their
      cognate targets.
  - reference_id: PMID:12130537
    supporting_text: These results indicate that the CENP-B homologs act as site-specific nucleation
      factors for the formation of centromeric heterochromatin by heterochromatin-specific modifications
      of histone tails.
- description: Sequence-specific double-stranded DNA binding at non-centromeric sites, including
    replication origins (ARS3002), an AT-rich motif in Tf2 retrotransposon LTRs, rDNA repeats and
    gene promoters.
  molecular_function:
    id: GO:1990837
    label: sequence-specific double-stranded DNA binding
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:8552670
    supporting_text: Abp1 preferentially binds to multiple sites in ARS 3002 and to the DNA polymer
      poly[d(A.T)].
  - reference_id: PMID:22907751
    supporting_text: Here, we show that the multifaceted roles of Abp1, the prominent member of
      fission yeast CENP-Bs, are mediated in part via recognition of a 10-bp AT-rich motif present
      in most LTRs
- description: DNA-anchored chromatin adaptor that recruits effectors to its binding sites, bringing
    class I/II histone deacetylases to Tf2 LTRs to silence retrotransposons and cluster them into
    Tf bodies, recruiting Cbh1 to LTRs, and enabling Mc binding at the swi2 promoter.
  molecular_function:
    id: GO:0140463
    label: chromatin-protein adaptor activity
  directly_involved_in:
  - id: GO:0010526
    label: transposable element silencing
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:18094683
    supporting_text: CENP-B homologues of S. pombe localize at and recruit histone deacetylases
      to silence Tf2 retrotransposons.
  - reference_id: PMID:22042869
    supporting_text: Remarkably, abp1Δ abolished Mc localization at LTRs and swi2 ( Fig. 6 A ).
suggested_questions:
- question: The fission-yeast CENP-B-like proteins and mammalian CENP-B are convergent domestications,
    yet PANTHER places Abp1, Cbh1 and S. cerevisiae Pdc2 in one subfamily (PTHR19303:SF73). Should
    PAINT node PTN002712198 keep only family-generic terms (DNA binding, nucleus), so that centromeric
    or retrotransposon-silencing functions of Abp1 are not propagated to Pdc2, or vice versa?
- question: Should Abp1 carry a process term for promoting replication-fork progression through
    Sap1-bound LTRs (PMID:21151105), or is that, like meiotic recombination suppression at Tf2
    (PMID:26354768), better treated as a genome-integrity outcome of its chromatin role?
- question: Does the transposase-derived DDE region of Abp1, which is needed for silencing, contribute
    any catalytic activity, or is it purely a protein-interaction and dimerization scaffold?
suggested_experiments:
- description: Map which Abp1 surfaces bind class I/II HDACs (Clr6, Clr3) and Cbh1 using purified
    proteins and separation-of-function point mutants in the DDE and dimerization regions, then test
    those mutants for Tf2 silencing and Tf body clustering in vivo.
- description: Test the catalytic DDE residues of the Abp1 transposase-like region by mutation for
    any residual nicking or strand-transfer activity in vitro, and for in vivo silencing function.
