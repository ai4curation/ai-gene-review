description: >-
  met14 (SPAC1782.11) encodes adenylyl-sulfate kinase (APS kinase, EC 2.7.1.25)
  of fission yeast, the ortholog of Saccharomyces cerevisiae MET14. It
  transfers the gamma-phosphate of ATP to the 3'-hydroxyl of adenosine
  5'-phosphosulfate (APS), made by the ATP sulfurylase sua1, to give
  3'-phosphoadenylyl sulfate (PAPS). PAPS is the substrate of the
  thioredoxin-dependent PAPS reductase met16 and so feeds the reductive branch
  of sulfate assimilation that supplies sulfide for cysteine and methionine
  synthesis. met14 is a small monofunctional P-loop kinase of the APS kinase
  family. Its deletion causes methionine auxotrophy. It localizes to the
  cytosol, with an additional nuclear signal in a genome-wide localization
  screen.
