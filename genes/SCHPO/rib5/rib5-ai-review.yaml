  label: Schizosaccharomyces pombe 972h-
description: rib5 (SPCC1450.13c; UniProt Q9Y7P0) encodes riboflavin synthase (EC 2.5.1.9), which dismutates
  two molecules of 6,7-dimethyl-8-ribityllumazine into riboflavin and 5-amino-6-ribitylamino-2,4-pyrimidinedione,
  the last step of riboflavin biosynthesis. The recombinant S. pombe enzyme has been characterised. Fission
  yeast relies on its own riboflavin synthesis. The enzyme is cytosolic in a genome-wide screen.
