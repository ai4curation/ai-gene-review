  label: Schizosaccharomyces pombe 972h-
description: dsd1 (SPBC3B8.07c; UniProt O59715) encodes the dihydroceramide delta-4 desaturase (DES1 family),
  which introduces the 4E double bond into the sphingoid base of dihydroceramide to make sphingosine-containing
  ceramide. dsd1 disruption is viable, showing that sphingosine-based lipids are not essential in S. pombe,
  whose main complex sphingolipids are phytosphingosine-based (sur2). It is in the ER in a genome-wide
  screen.
