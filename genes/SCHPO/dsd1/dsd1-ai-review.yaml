- term:
    id: GO:0030148
    label: sphingolipid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011388
  review:
    summary: InterPro (DES1/DES2) mapping to sphingolipid biosynthesis; correct but general.
    action: MODIFY
    reason: Dsd1 is the dihydroceramide delta-4 desaturase (PMID:12633877; curated UniProt function tagged
      with that paper), converting N-acylsphinganine (dihydroceramide) to N-acylsphing-4-enine (ceramide),
      the step that produces sphingosine-containing sphingolipids. Sphingolipid biosynthesis is correct but
      less specific than the two descendants this gene already carries and the evidence supports, GO:0046512
      sphingosine biosynthetic process (IDA) and GO:0046513 ceramide biosynthetic process (IBA); both are
      listed because the reaction yields a ceramide whose base is sphingosine.
    proposed_replacement_terms:
    - id: GO:0046512
      label: sphingosine biosynthetic process
    - id: GO:0046513
      label: ceramide biosynthetic process
    supported_by:
    - reference_id: file:SCHPO/dsd1/dsd1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Delta(4)-fatty-acid desaturase which introduces a double bond at the 4-position in
        the long-chain base (LCB) of ceramides.
    - reference_id: file:SCHPO/dsd1/dsd1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=an N-acylsphinganine + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = an N-acylsphing-4-enine
        + 2 Fe(III)-[cytochrome b5] + 2 H2O;
    - reference_id: PMID:12633877
      supporting_text: This S. pombe gene designated SDCB3b8.07c was identified as the dihydroceramide
        Delta(4)-desaturase, responsible for the synthesis of sphingosine.
