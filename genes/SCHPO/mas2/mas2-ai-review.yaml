id: O94745
gene_symbol: mas2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Mas2 is the fission-yeast alpha subunit of mitochondrial processing peptidase
  (MPP), a mitochondrial matrix M16-family protein that partners with the
  catalytic beta subunit mas1 to mature imported mitochondrial precursor
  proteins. Mas2 lacks the beta-MPP zinc catalytic site and instead supports MPP
  cleavage by recognizing and binding mitochondrial presequences.
existing_annotations:
- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: ISS
  original_reference_id: PMID:9737975
  qualifier: enables
  supporting_entities:
  - SGD:S000001066
  negated: true
  review:
    summary: >-
      Correct NOT transfer: Mas2/alpha-MPP is the substrate-recognition subunit,
      not the catalytic MPP metallopeptidase subunit.
    action: ACCEPT
    reason: >-
      The S. pombe UniProt record explicitly cautions that mas2 does not seem
      to have protease activity because it lacks the MPP zinc-binding site, and
      the alpha-MPP paper used by PomBase studied alpha-MPP as a
      substrate-recognition subunit of heterodimeric MPP. The beta subunit
      mas1 carries the metalloendopeptidase active site.
    supported_by:
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:CAUTION
      supporting_text: as it lacks the zinc- binding site
    - reference_id: PMID:9737975
      supporting_text: >-
        alpha-MPP may function as a substrate-recognizing subunit
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: >-
      Direct high-throughput S. pombe localization evidence for a mitochondrial
      MPP subunit.
    action: ACCEPT
    reason: >-
      Mitochondrion is an informative root-organelle location for Mas2. The
      direct S. pombe HDA row agrees with the UniProt matrix localization and
      with Mas2's conserved role as the alpha subunit of matrix MPP.
    supported_by:
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion matrix'
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0170
  review:
    summary: >-
      Correct UniProt subcellular-location mapping for the matrix MPP alpha
      subunit.
    action: ACCEPT
    reason: >-
      UniProt places mas2 in the mitochondrial matrix with direct support from
      the fission-yeast ORFeome localization screen, and MPP removes
      presequences from precursors after their import into the matrix.
    supported_by:
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion matrix'
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001431
  review:
    summary: >-
      True for the MPP heterodimer but less informative than mitochondrial
      protein processing.
    action: TOO_GENERAL
    reason: >-
      Mas2 is not itself the zinc catalytic subunit, but it is required for
      mitochondrial processing peptidase to recognize imported precursors and
      cleave presequences. The broad proteolysis parent is therefore true for
      the alpha subunit as part of MPP, but the accepted GO:0034982
      mitochondrial protein processing row captures the specific process.
    supported_by:
    - reference_id: PMID:9737975
      supporting_text: >-
        alpha-MPP may function as a substrate-recognizing subunit
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Substrate recognition and binding subunit of the essential
        mitochondrial processing protease
- term:
    id: GO:0016504
    label: peptidase activator activity
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: enables
  supporting_entities:
  - GO:0017087
  review:
    summary: >-
      Correct inferred molecular function for the alpha-MPP partner that
      enables beta-MPP presequence cleavage.
    action: ACCEPT
    reason: >-
      Mas2 forms the MPP heterodimer with the catalytic beta subunit and is
      involved in substrate recognition and binding. The GO-CAM's use of
      peptidase activator activity for Mas2 therefore soundly splits the alpha
      and beta subunits of MPP: mas2 supplies the noncatalytic activator role,
      while mas1 carries the peptidase activity.
    supported_by:
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Substrate recognition and binding subunit of the essential
        mitochondrial processing protease
    - reference_id: PMID:9737975
      supporting_text: >-
        Mitochondrial processing peptidase is a heterodimer
- term:
    id: GO:0017087
    label: mitochondrial processing peptidase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000220169
  - RGD:621297
  - SGD:S000001066
  - SGD:S000004153
  - UniProtKB:Q38F91
  - UniProtKB:Q586V8
  - WB:WBGene00013880
  - WB:WBGene00022159
  review:
    summary: >-
      Correct PAINT transfer of conserved mitochondrial processing peptidase
      complex membership.
    action: ACCEPT
    reason: >-
      The PTHR11851 family review judges the PTN000220169 mitochondrial
      processing peptidase complex IBD sound for the eukaryotic alpha/beta-MPP
      duplication node. S. pombe mas2 is an alpha-MPP leaf in that subfamily and
      UniProt transfers mas2-mas1 MPP heterodimer membership by similarity to
      rat alpha-MPP.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11851/PTHR11851-review.yaml
      supporting_text: >-
        The duplication node joining the MPP alpha and beta lineages has 436
        reference leaves
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: >-
        Heterodimer of mas2 (alpha) and mas1 (beta) subunits
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000220169
        source_label: eukaryotic MPP alpha/beta duplication node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node joins the alpha- and beta-MPP lineages and correctly
          transfers MPP complex membership to S. pombe mas2.
- term:
    id: GO:0034982
    label: mitochondrial protein processing
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P11914
  review:
    summary: >-
      Correct similarity transfer from rat alpha-MPP for mitochondrial
      presequence processing.
    action: ACCEPT
    reason: >-
      Mas2 is the S. pombe alpha-MPP subunit, the M16-family partner that binds
      precursor presequences and supports beta-MPP cleavage. That role directly
      participates in mitochondrial protein processing by MPP even though Mas2
      is not the catalytic metallopeptidase subunit.
    supported_by:
    - reference_id: PMID:9737975
      supporting_text: >-
        alpha-MPP may function as a substrate-recognizing subunit
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Substrate recognition and binding subunit of the essential
        mitochondrial processing protease
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011249
  review:
    summary: >-
      Unsupported generic M16-family metal-binding transfer to the inactive
      alpha-MPP subunit.
    action: REMOVE
    reason: >-
      Mas2 belongs to the M16 family, but it is the inactive alpha-MPP subunit
      and lacks the MPP zinc-binding catalytic site. The generic
      Metalloenz_LuxS/M16-to-metal-ion-binding InterPro mapping therefore
      over-propagates the metal-binding activity to the noncatalytic alpha
      partner.
    supported_by:
    - reference_id: file:genes/SCHPO/mas2/mas2-uniprot.txt
      record_section:
      - CC:CAUTION
      supporting_text: Does not seem to have protease activity
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR011249
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The broad M16 metalloenzyme superfamily includes catalytic and
          noncatalytic subunits; mas2 is an inactive alpha-MPP that lacks the
          MPP zinc-binding site.
- term:
    id: GO:0070585
    label: obsolete protein localization to mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000178676
  - PANTHER:PTN002274973
  - SGD:S000001066
  - dictyBase:DDB_G0274809
  review:
    summary: >-
      Obsolete PAINT grouping-term assertion that overstates post-import MPP
      processing as mitochondrial localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MPP cleaves mitochondrial presequences after precursors reach the matrix;
      that protein-maturation role is captured by the accepted mitochondrial
      protein processing row. The now-obsolete GO:0070585 localization grouping
      term does not add a direct Mas2 localization-route activity.
    supported_by:
    - reference_id: PMID:9737975
      supporting_text: >-
        alpha-MPP may function as a substrate-recognizing subunit
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002274973
        source_label: alpha-MPP and MPP-associated core proteins
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The PAINT node identifies alpha-MPP as an imported-presequence
          processing partner, but GO:0070585 was obsoleted and overstates that
          post-import processing role as a mitochondrial protein-localization
          process.
