core_functions:
- description: Hydrolyzes C-terminal peptide bonds as a conserved vacuolar M20A carboxypeptidase,
    contributing to protein breakdown and amino-acid recycling. Catalytic assignment is inferred
    from the verified fungal CPS lineage; target substrate breadth and native maturation remain
    open.
  molecular_function:
    id: GO:0004181
    label: metallocarboxypeptidase activity
  directly_involved_in:
  - id: GO:0007039
    label: protein catabolic process in the vacuole
  locations:
  - id: GO:0000324
    label: fungal-type vacuole
  - id: GO:0005774
    label: vacuolar membrane
  - id: GO:0000328
    label: fungal-type vacuole lumen
  supported_by:
  - *id004
  - *id001
  - *id002
proposed_new_terms: []

suggested_questions:
- question: What peptide and nonpeptide N-acyl-amino-acid substrates does native SpCPS hydrolyze,
    and is measurable reverse amidation physiologically relevant?
- question: How is native SpCPS processed and partitioned between vacuolar membrane and lumen, and
    is any extracellular pool condition dependent?
suggested_experiments:
- hypothesis: >-
    SPAC24C9.08 has carboxypeptidase activity similar to S. cerevisiae CPS1
  description: >-
    Express and purify recombinant SPAC24C9.08 and assay for carboxypeptidase activity
    using Cbz-Gly-Leu as substrate. Compare activity to S. cerevisiae CPS1. Test
    substrate specificity with various dipeptides to determine P1 preference.
  experiment_type: biochemical enzyme assay

- hypothesis: >-
    SPAC24C9.08 has aminoacylase/N-acyl amino acid hydrolase activity like PM20D1
  description: >-
    Assay purified SPAC24C9.08 for hydrolysis of N-acyl amino acids (e.g., N-acetyl-
    L-methionine, N-oleoyl-phenylalanine) and for synthase activity (condensation
    of fatty acids with amino acids).
  experiment_type: biochemical enzyme assay

- hypothesis: >-
    SPAC24C9.08 deletion affects vacuolar proteolysis in S. pombe
  description: >-
    Generate SPAC24C9.08 deletion strain and assess vacuolar proteolysis using
    autophagy markers during nitrogen starvation. Compare to wild-type and to
    cpy1 (carboxypeptidase Y) deletion strains.
  experiment_type: genetic analysis
