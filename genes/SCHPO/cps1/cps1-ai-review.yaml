taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
aliases:
- cps1
description: >-
  Schizosaccharomyces pombe cps1 (SPAC24C9.08) encodes a vacuolar M20A metallopeptidase with conserved
  carboxypeptidase activity inferred from fungal ancestry. Its predicted zinc-dependent catalytic domain
  is associated with an N-terminal membrane anchor, and the protein enters the vacuolar sorting pathway.
  Cleavage of peptide substrates and amino-acid recycling in the vacuole are its inferred principal functions;
  its precise substrate range and native proteolytic maturation remain incompletely characterized. This
  protein is distinct from the glucan synthase Bgs1, which has also been called Cps1.
references:
- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission yeast
    Schizosaccharomyces pombe.
  findings:
  - statement: SPAC24C9.08 localizes to the fungal-type vacuole based on YFP tagging in
      high-throughput study
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome, by tagging each ORF with
      the yellow fluorescent protein
    reference_section_type: ABSTRACT
- id: PMID:27374330
  title: The Secreted Enzyme PM20D1 Regulates Lipidated Amino Acid Uncouplers of Mitochondria
  findings:
  - statement: PM20D1 is a bidirectional N-fatty-acyl-amino acid synthase/hydrolase that has
      diverged from classical carboxypeptidase function
    supporting_text: >-
      We demonstrate that PM20D1 is a bidirectional enzyme in vitro, catalyzing both the
      condensation of fatty acids and amino acids to generate N-acyl amino acids and also
      the reverse hydrolytic reaction
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verified. Mammalian PM20D1 bidirectional N-acyl-amino-acid
      catalysis and uncoupling; does not establish target activity or loss of carboxypeptidase
      function.
- id: PMID:2026161
  title: 'Carboxypeptidase yscS: gene structure and function of the vacuolar enzyme.'
  findings:
  - statement: S. cerevisiae CPS1 is a vacuolar carboxypeptidase with Gly-Xaa specificity
    supporting_text: >-
      Chromosomal disruption of the CPS1 gene completely abolishes carboxypeptidase
      yscS activity
    reference_section_type: ABSTRACT
  - statement: CPS1 enables growth on Cbz-Gly-Leu as sole leucine source
    supporting_text: >-
      The cloned CPS1 gene, which again enabled a leucine auxotrophic cps1-3 mutant
      to grow on the modified dipeptide Cbz-Gly-Leu (Cbz, benzyloxycarbonyl) as sole
      leucine source
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract verified. Direct Saccharomyces cerevisiae CPS1 gene rescue,
      synthetic-dipeptide utilization and loss of carboxypeptidase activity after disruption; source
      evidence, not a fission-yeast assay.
- id: PMID:1569061
  title: Biogenesis of the yeast vacuole (lysosome). The precursor forms of the soluble hydrolase
    carboxypeptidase yscS are associated with the vacuolar membrane.
  findings:
  - statement: Carboxypeptidase yscS precursor is membrane-associated, mature enzyme is soluble in
      vacuolar lumen
    supporting_text: >-
      The mature forms of carboxypeptidase yscS appeared soluble in the vacuolar lumen,
      while the precursor proteins accumulated tightly associated with the vacuolar membrane
    reference_section_type: ABSTRACT
  - statement: Carboxypeptidase yscS is synthesized as type II transmembrane precursor (77 and 74
      kDa glycoforms)
    supporting_text: >-
      After assembly into the vacuolar membrane, proteinase yscB presumably cleaves
      the precursor molecules to release soluble carboxypeptidase yscS forms into
      the lumen of the vacuole
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract verified. Direct S. cerevisiae precursor/mature processing and
      membrane/lumen localization; biochemical analogy for the fungal ancestral inference.
