  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0004046
    label: aminoacylase activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 14.49) and absent from GOA. Aminoacylase (N-acyl-L-amino acid amidohydrolase)
      is a genuine M20 family activity - human ACY1 is the archetype - and this review notes that
      the M20A subfamily has diverged to include enzymes with non-peptidase activities such as PM20D1,
      which is precisely the PANTHER family assigned to this entry. So this is a defensible alternative
      hypothesis to the carboxypeptidase assumption, not an error. Left uncertain, and flagged as
      a curation lead: it may be a better fit than the cps1 name suggests.
    supported_by:
