    summary: >-
      Rank 2 (score 14.35). Cysteine-type carboxypeptidase activity requires a catalytic cysteine
      nucleophile; M20 family peptidases are di-zinc metallopeptidases with a completely different
      catalytic mechanism, as this review's description of a predicted di-zinc centre states. Right
      reaction, wrong catalytic class.
    supported_by:
