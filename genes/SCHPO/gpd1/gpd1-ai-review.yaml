suggested_questions:
- question: Which glycerol-3-phosphate phosphatase completes glycerol synthesis in S. pombe downstream of Gpd1?
suggested_experiments:
- description: Purify recombinant Gpd1 and Gpd2 and compare kinetics with DHAP/NADH, then measure glycerol, NADH/NAD+ and
    osmotolerance in gpd1, gpd2 and double mutants under osmotic and anaerobic conditions.
