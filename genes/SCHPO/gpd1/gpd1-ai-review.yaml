taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: gpd1 encodes the osmotically induced NAD-dependent glycerol-3-phosphate dehydrogenase of Schizosaccharomyces
  pombe (EC 1.1.1.8), one of two GPD isozymes (with gpd2) that are about 60% identical. Gpd1 reduces dihydroxyacetone phosphate
  to sn-glycerol 3-phosphate with NADH in the cytosol, the committed step of glycerol synthesis. gpd1 transcription is induced
  by hyperosmotic stress through the Wis1 MAP kinase kinase pathway, and gpd1 deletion mutants fail to accumulate intracellular
  glycerol under high osmolarity and are osmosensitive for growth, so Gpd1 provides the glycerol used as compatible osmolyte.
