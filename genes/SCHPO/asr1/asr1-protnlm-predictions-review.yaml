    summary: Metal ion binding is supported by the target's zinc-finger architecture. The reviewed sequence
      record identifies a PHD finger at residues 122-170 (PROSITE-ProRule PRU00146) and an atypical RING
      finger at residues 18-79 (PRU00175). The PHD sequence retains the full Cys4-His-Cys3 zinc-ligand
      pattern (C124, C126, C141, C144, H149, C152, C165, C168), so zinc coordination by this domain is
      a diagnostic structural inference. No direct zinc-binding assay exists for the fission-yeast protein,
      and PubMed searches for the gene and the PHRF1 family returned no metal-binding experiment. The gene's
      GOA annotations contain no metal-ion or zinc-ion binding term (only ubiquitin protein ligase activity,
      which is not an is_a ancestor or descendant of metal ion binding), so the prediction is novel. The
      ProtNLM2 output was hydrated from GO:0008270 zinc ion binding, which would be the more precise term.
