  review:
    summary: PomBase assigns E3 ubiquitin-ligase activity by curated orthology to experimentally characterized
      budding-yeast Asr1.
    action: ACCEPT
    reason: PomBase assigns E3 ubiquitin-ligase activity by curated orthology to experimentally characterized
      budding-yeast Asr1. The target retains RING/PHD architecture, making the enzymatic transfer credible.
      The source directly demonstrates a RING ubiquitin ligase, but its Rpb1/Rpb2 substrate specificity
      and polymerase subunit-ejection mechanism remain ortholog evidence rather than observations on the
      fission-yeast target.
    supported_by:
    - &id001
      reference_id: PMID:19064926
      supporting_text: 'Here, we report that the

        Saccharomyces cerevisiae protein Asr1 is a RING finger ubiquitin-ligase that

        binds directly to RNA polymerase II via the carboxyl-terminal domain (CTD) of

        the largest subunit of the enzyme.'
