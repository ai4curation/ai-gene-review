suggested_questions:
- question: Which endogenous proteins does Asr1 ubiquitylate in fission yeast, and does it bind the phosphorylated
    CTD of RNA polymerase II as budding-yeast Asr1 does?
- question: Is budding-yeast Asr1 the true ortholog of the PHRF1/Atg35 lineage (PTHR12618:SF20)? If so, its
    PANTHER placement in the plant ATL RING-H2 family (PTHR45798) and the IBA it receives from that family's
    node should be revisited.
suggested_experiments:
- description: Purify recombinant Asr1 RING/PHD region and test E2-dependent autoubiquitination in vitro,
    with RING zinc-ligand cysteine mutants as controls; then test binding to Ser5P/Ser7P CTD peptides.
- description: Tag endogenous asr1 and perform ChIP and ubiquitin-remnant proteomics in wild-type and asr1
    deletion cells to identify chromatin occupancy and substrates.
