- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: No biological process has been established for the fission-yeast protein; the ND annotation
      is correct.
    action: ACCEPT
    reason: There are no fission-yeast studies of asr1 beyond the localization screen. The Falcon literature
      search found none, and a search for the budding-yeast relative found only budding-yeast papers. The
      budding-yeast processes (RNA polymerase II subunit ejection, subtelomeric silencing, alcohol tolerance,
      a septin phenotype seen on overexpression) are tied to Asr1-specific features or phenotypes. PomBase
      transferred only the molecular function by orthology and kept ND for process, and that choice should
      stand. The orthology is also not supported by PANTHER placement.
    supported_by:
    - reference_id: file:SCHPO/asr1/asr1-bioinformatics/RESULTS.md
      supporting_text: Only properties of the shared RING module (E3 ubiquitin ligase activity) are safe
        to transfer; Asr1-specific features such as Ser5P/Ser7P CTD recognition are not.
- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00028902
  review:
    summary: ARBA assignment of the root complex term; no complex is known for this protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: This ARBA prediction names only the uninformative root of the complex branch. No stable complex
      containing the fission-yeast protein has been described. Its budding-yeast relative binds RNA polymerase
      II transiently as an E3 enzyme and does not act as a polymerase subunit, so a part_of complex claim
      is not supported even by analogy.
    supported_by:
    - reference_id: PMID:19064926
      supporting_text: Ubiquitylation by Asr1 leads to the ejection of the Rpb4/Rpb7 heterodimer from the
        polymerase complex
- term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  evidence_type: ISO
  original_reference_id: PMID:19064926
  qualifier: enables
  supporting_entities:
  - SGD:S000006297
  review:
    summary: E3 ubiquitin ligase activity transferred by PomBase from budding-yeast Asr1; the RING module
      that carries the activity is conserved.
    action: ACCEPT
    reason: Budding-yeast Asr1 is a RING-finger ubiquitin ligase that ubiquitylates Rpb1 and Rpb2 and
      works with the E2 Ubc2. The fission-yeast protein keeps the RING and PHD fingers in the same order
      at the N-terminus, and its RING module aligns with Asr1 (z = 14) and still more closely with PHRF1
      and Atg35 in its own PANTHER subfamily (z = 28 and 23). Ubiquitin ligase activity is a property
      of that shared RING module, so the general MF term transfers, although PANTHER does not support
      the one-to-one orthology (Asr1 is classified in PTHR45798). The Rpb1/Rpb2 substrates, CTD phospho-recognition
      and E2 identity are Asr1-specific and are not transferred. Activity has not been tested on the
      fission-yeast protein.
    supported_by:
    - reference_id: PMID:19064926
      supporting_text: 'Here, we report that the

        Saccharomyces cerevisiae protein Asr1 is a RING finger ubiquitin-ligase that

        binds directly to RNA polymerase II via the carboxyl-terminal domain (CTD) of

        the largest subunit of the enzyme.'
    - reference_id: PMID:40513950
      supporting_text: Finally, we show that Ubc2 is an E2 of Asr1 for its ubiquitination properties.
    - reference_id: file:SCHPO/asr1/asr1-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF00628; PHD; 1.

        DR   Pfam; PF13639; zf-RING_2; 1.'
    - reference_id: file:SCHPO/asr1/asr1-bioinformatics/RESULTS.md
      supporting_text: All four proteins share a homologous N-terminal RING + PHD module (all z > 13).
