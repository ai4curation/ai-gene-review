description: Asr1 (SPCC126.07c) is a 571-residue fission-yeast protein with an N-terminal atypical
  RING finger (residues 18-79) followed by a PHD finger (residues 122-170) and a long, partly disordered
  C-terminal region. It belongs to the PHRF1-related PHD/RING family (PANTHER PTHR12618:SF20), which
  also contains human PHRF1 and Komagataella phaffii Atg35. It is predicted to act as a RING-type E3
  ubiquitin ligase, by orthology to budding-yeast Asr1, a RING/PHD ubiquitin ligase that binds the
  phosphorylated CTD of RNA polymerase II and ubiquitylates Rpb1 and Rpb2. A proteome-wide GFP-fusion
  screen placed the protein in both the nucleus and the cytosol. Its substrates, E2 partner and biological
  process in fission yeast have not been studied.
existing_annotations:
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027601
  review:
    summary: ARBA rule assigning chromatin location; plausible but not established for the fission-yeast
      protein.
    action: UNDECIDED
    reason: This is an ARBA machine-learning assertion with no fission-yeast chromatin evidence behind
      it; the only target localization data (an ORFeome GFP screen) report nucleus and cytosol, not chromatin.
      It is nevertheless plausible, because the budding-yeast protein that PomBase treats as the ortholog
      is recruited to RNA polymerase II through phosphorylated CTD and acts in subtelomeric silencing.
      That orthology is not supported by PANTHER, which puts budding-yeast Asr1 in a different family
      (see RESULTS.md), and the CTD recognition is a property of Asr1 rather than of the shared RING module.
      Without a chromatin immunoprecipitation or chromatin-fraction experiment on the fission-yeast protein
      the term can be neither accepted nor rejected.
    supported_by:
    - reference_id: PMID:40513950
      supporting_text: Ser7 is essential for the recruitment of Asr1 to RNAPII-CTD, potentially playing
        a role in the silencing of a subset of subtelomeric genes in budding yeast
