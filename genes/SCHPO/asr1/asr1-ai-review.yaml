  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Asr1 (SPCC126.07c, also called Pbr1) is a nuclear and cytosolic protein containing an N-terminal
  atypical RING finger and a PHD finger. Its cysteine- and histidine-rich zinc-finger architecture supports
  structural zinc binding and a conserved ubiquitin-ligase function inferred from budding-yeast Asr1.
  The physiological substrates and biological process controlled by Asr1 in fission yeast remain unresolved.
