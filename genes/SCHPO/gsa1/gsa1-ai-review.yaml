taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Glutathione synthetase of fission yeast (gsa1, also called gsh2), orthologous to budding-yeast
  GSH2 and human GSS. It catalyses the ATP- and Mg2+-dependent addition of glycine to gamma-L-glutamyl-L-cysteine
  to form glutathione, the second and final step of glutathione synthesis. The enzyme is made as a homodimer
  of the full-length 56 kDa chain. A metalloprotease can cut it into two fragments that stay associated
  as an equally active heterotetramer, which explains the older "large and small subunit" description.
  Disruption causes glutathione auxotrophy, and mutants make less of the glutathione-derived phytochelatins
  and are sensitive to cadmium. It is cytosolic.
