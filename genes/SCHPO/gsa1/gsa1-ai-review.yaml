  review:
    action: KEEP_AS_NON_CORE
    summary: 'Al-Lahham et al. 1999: a gsa1 point mutation lowers phytochelatin much more than GSH, and
      the authors proposed a bifunctional enzyme. Phytochelatin polymerisation is now attributed to phytochelatin
      synthase; gsa1 supplies the GSH substrate. Retained as a curator-supported but non-core, substrate-supply
      role.'
    reason: The bifunctional-enzyme interpretation predates identification of phytochelatin synthase;
      not overruled, but not core.
    supported_by:
    - reference_id: PMID:10219997
      supporting_text: This mutation leads to a significant reduction of phytochelatin synthesis, whereas
        glutathione synthesis is impaired to a far lesser extent
