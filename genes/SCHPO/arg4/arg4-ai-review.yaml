  label: Schizosaccharomyces pombe 972h-
description: 'arg4 (SPBC215.08c) encodes the large (synthetase, CarB-type) subunit of the arginine-specific
  carbamoyl-phosphate synthetase (CPSase A) of S. pombe, the ortholog of S. cerevisiae CPA2. It binds
  hydrogencarbonate, two ATP and ammonia (free or channelled from glutamine hydrolysed by the small subunit
  arg5) and makes carbamoyl phosphate, the carbamoyl donor for ornithine carbamoyltransferase (arg3).
  In S. pombe CPSase A is mitochondrial and repressed by arginine, and its carbamoyl phosphate is kept
  separate from the cytosolic pyrimidine-pathway pool made by ura1; in S. cerevisiae the equivalent enzyme
  is cytosolic. arg4 mutants require arginine. Note the nomenclature trap: S. pombe arg4 is not the ortholog
  of S. cerevisiae ARG4 (argininosuccinate lyase, which in S. pombe is arg41/arg7).'
