suggested_questions:
- question: Is carbamoyl phosphate made by mitochondrial CPSase A strictly channelled to arg3, and does
    arginine repression of arg5/arg4 explain the separate control of the arginine and pyrimidine pools?
suggested_experiments:
- description: Measure CPSase A and OTC activities in mitochondria from arg4 and ura1 mutants to test
    cross-feeding between the arginine and pyrimidine carbamoyl-phosphate pools.
