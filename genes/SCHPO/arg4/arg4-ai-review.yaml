core_functions:
- description: 'Large (synthetase) subunit of the mitochondrial arginine-specific carbamoyl-phosphate
    synthetase (arg5-arg4, CPSase A): ATP-dependent synthesis of carbamoyl phosphate from ammonia channelled
    from arg5 and hydrogencarbonate, supplying matrix OTC (arg3). Same activity as S. cerevisiae CPA2
    but located in mitochondria in S. pombe.'
