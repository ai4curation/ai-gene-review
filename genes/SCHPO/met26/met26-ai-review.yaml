  label: Schizosaccharomyces pombe 972h-
description: met26 (SPAC9.09; UniProt Q9UT19) encodes the cobalamin-independent methionine synthase (MetE
  family; EC 2.1.1.14), a zinc-dependent enzyme that moves the methyl group of 5-methyltetrahydropteroyltriglutamate
  to L-homocysteine to make L-methionine. This is the last step of de novo methionine synthesis and also
  regenerates methionine in the methyl cycle. met26 disruptants are methionine auxotrophs. Unusually,
  they also need adenine even when given methionine, because accumulated homocysteine inhibits purine
  synthesis. The enzyme is cytosolic in a genome-wide screen.
