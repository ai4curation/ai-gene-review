  label: Schizosaccharomyces pombe 972h-
description: pi047 (SPBC8D2.18c; UniProt O13639), the fission yeast ortholog of S. cerevisiae SAH1, encodes
  S-adenosyl-L-homocysteine hydrolase (EC 3.13.2.1), an NAD+-dependent enzyme. It hydrolyses the product
  of SAM-dependent methylation to L-homocysteine and adenosine. Removing S-adenosylhomocysteine, a competitive
  inhibitor of methyltransferases, lets methylation continue and returns homocysteine to the methionine
  cycle. Function is assigned by orthology; a genome-wide screen places it in the cytosol.
