- id: PMID:15383543
  title: Zim17, a novel zinc finger protein essential for protein import into mitochondria.
  findings:
  - statement: >-
      Budding-yeast Zim17 is a mitochondrial zinc-finger protein whose loss
      selectively diminishes matrix protein import.
    supporting_text: >-
      Loss of Zim17 selectively diminishes import of proteins into the matrix of
      mitochondria
- id: PMID:15642367
  title: Identification of a novel member of yeast mitochondrial Hsp70-associated motor
    and chaperone proteins that facilitates protein translocation across the inner
    membrane.
  findings:
  - statement: >-
      Budding-yeast Tim15/Zim17 cooperates with mtHsp70 to facilitate import of
      presequence-containing proteins into the matrix.
    supporting_text: >-
      Tim15/Zim17 therefore cooperates with mtHsp70 to facilitate import of
      presequence-containing proteins into the matrix
- id: PMID:15992824
  title: Inactivation of the mitochondrial heat shock protein zim17 leads to aggregation
    of matrix hsp70s followed by pleiotropic effects on morphology and protein biogenesis.
  findings:
  - statement: >-
      Budding-yeast Zim17 is a matrix heat shock protein that is loosely
      associated with the inner membrane and prevents Hsp70 aggregation in the
      mitochondrial matrix.
    supporting_text: >-
      Zim17 is a heat shock protein of the mitochondrial matrix that is loosely
      associated with the inner membrane
  - statement: >-
      Short-term inactivation of yeast Zim17 first causes matrix Hsp70
      aggregation, before the later import, Fe/S, and morphology defects.
    supporting_text: >-
      plays a specific role in preventing protein aggregation in the
      mitochondrial matrix
- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      The fission-yeast ORFeome screen localized thousands of YFP-tagged
      proteins, including the mitochondrion row curated by PomBase for
      SPAC24H6.02c.
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome
- id: PMID:17571076
  title: Structural basis of functional cooperation of Tim15/Zim17 with yeast mitochondrial
    Hsp70.
  findings:
  - statement: >-
      Tim15/Zim17 residues needed for yeast growth and matrix import also
      suppress mtHsp70 aggregation.
    supporting_text: >-
      the function of Tim15 in yeast cell growth is well correlated with its
      ability to suppress mtHsp70 aggregation
- id: PMID:23007651
  title: Biogenesis of the mitochondrial Hsp70 chaperone.
  findings:
  - statement: >-
      Yeast Hep1/Zim17 is required and sufficient with adenine nucleotide to
      mediate de novo folding of mtHsp70.
    supporting_text: >-
      Hep1 acts as a specialized chaperone mediating the de novo folding of an
      Hsp70 chaperone
- id: PMID:24030826
  title: The functional interaction of mitochondrial Hsp70s with the escort protein
    Zim17 is critical for Fe/S biogenesis and substrate interaction at the inner membrane
    preprotein translocase.
  findings:
  - statement: >-
      Conditional budding-yeast zim17 mutants show that Zim17 is needed for
      direct mtHsp70-substrate interaction, not merely for aggregate prevention.
    supporting_text: >-
      directly assists the functional interaction of mtHsp70 with substrate
      proteins
