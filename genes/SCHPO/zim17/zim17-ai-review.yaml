- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000467874
  - SGD:S000005254
  review:
    summary: >-
      Conserved Zim17/Hep1 proteins chaperone folding and soluble maintenance of
      mitochondrial Hsp70s.
    action: ACCEPT
    reason: >-
      Retain protein folding as a conserved core process. Budding-yeast Hep1 is
      required and sufficient, together with adenine nucleotide, for de novo
      folding of mtHsp70, and Zim17 inactivation first causes aggregation of
      matrix Hsp70s before the downstream import and Fe/S biogenesis defects
      appear.
    supported_by:
    - reference_id: PMID:23007651
      reference_section_type: ABSTRACT
      supporting_text: >-
        Hep1 acts as a specialized chaperone mediating the de novo folding of an
        Hsp70 chaperone
    - reference_id: PMID:15992824
      reference_section_type: ABSTRACT
      supporting_text: >-
        plays a specific role in preventing protein aggregation in the
        mitochondrial matrix
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000467874
        source_label: DNL-type Zim17/Hep1 PAINT node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node propagates the conserved Hsp70 escort protein function
          of DNL-type proteins; no PAINT loss is present on the fission-yeast
          lineage.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007853
  review:
    summary: >-
      The DNL-type zinc-finger signature supports structural zinc binding.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep zinc ion binding as a true but non-core molecular function. The
      S. pombe protein has the conserved DNL-type zinc-finger domain and
      PROSITE-predicted Zn(2+)-binding residues, while the direct activity of
      the protein family is the zinc-finger-dependent mtHsp70 escort/chaperone
      role.
    supported_by:
