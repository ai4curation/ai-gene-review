      mitochondria.
    action: ACCEPT
    reason: >-
      Retain the root mitochondrion term from the fission-yeast ORFeome
      localization screen. The direct assay is proteome scale and does not
      resolve matrix versus membrane topology, but the broad mitochondrial
      result matches the conserved Zim17/Hep1 family location.
