suggested_questions:
- question: >-
    Does S. pombe zim17/SPAC24H6.02c physically associate with Ssc1 and the
    matrix face of the TIM23 import motor, like budding-yeast Zim17/Tim15/Hep1,
    or is its matrix-import effect mediated only by maintaining soluble Ssc1?
  experts: []
suggested_experiments:
- description: >-
    Tag endogenous zim17/SPAC24H6.02c and test submitochondrial fractionation,
    carbonate extraction, and co-immunoprecipitation with Ssc1 under native and
    heat-stress conditions.
- description: >-
    Assay Ssc1 solubility, Fe/S enzyme activity, and presequence-containing
    precursor import after conditional zim17 depletion in S. pombe.
