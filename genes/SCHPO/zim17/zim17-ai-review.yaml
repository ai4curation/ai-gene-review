- term:
    id: GO:0030150
    label: protein import into mitochondrial matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000467874
  - SGD:S000005254
  review:
    summary: >-
      Zim17/Hep1 directly supports the Ssc1 mtHsp70 motor for import of
      matrix-targeted precursors.
    action: ACCEPT
    reason: >-
      Retain matrix protein import. Zim17 is not the Ssc1 motor itself, but
      multiple budding-yeast studies show that Zim17/Tim15/Hep1 cooperates with
      mtHsp70 and is required for presequence precursor import and productive
      Ssc1 substrate interaction at the inner-membrane translocase.
    supported_by:
    - reference_id: PMID:15642367
      reference_section_type: ABSTRACT
      supporting_text: >-
        Tim15/Zim17 therefore cooperates with mtHsp70 to facilitate import of
        presequence-containing proteins into the matrix
    - reference_id: PMID:24030826
      reference_section_type: ABSTRACT
      supporting_text: >-
        directly assists the functional interaction of mtHsp70 with substrate
        proteins
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000467874
        source_label: DNL-type Zim17/Hep1 PAINT node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Conserved yeast Zim17/Hep1 proteins act with mtHsp70 during
          matrix-targeted precursor import, and the Q09759 lineage has no
