- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000182996
  - PANTHER:PTN000467874
  review:
    summary: >-
      The DNL-type Zim17/Hep1 family has a conserved specialized chaperone
      activity toward mtHsp70.
    action: ACCEPT
    reason: >-
      Retain the broad protein folding chaperone molecular function. Yeast Hep1
      mediates de novo mtHsp70 folding and prevents self-aggregation of folded
      mtHsp70, and those data support treating DNL-type Zim17/Hep1 proteins as
      specialized chaperones for a chaperone.
    supported_by:
    - reference_id: PMID:23007651
      reference_section_type: ABSTRACT
      supporting_text: >-
        Hep1 acts as a specialized chaperone mediating the de novo folding of an
        Hsp70 chaperone
    - reference_id: file:genes/SCHPO/zim17/zim17-uniprot.txt
      record_section:
      - DR:PANTHER
      supporting_text: PANTHER; PTHR20922; DNL-TYPE ZINC FINGER PROTEIN; 1.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000467874
        source_label: DNL-type Zim17/Hep1 PAINT node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The molecular function is broad, but it captures the direct
          chaperone-for-mtHsp70 activity of characterized Zim17/Hep1 proteins.
- term:
    id: GO:0051131
    label: chaperone-mediated protein complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000467874
  - UniProtKB:Q5SXM8
  review:
    summary: >-
      This IBA appears to over-propagate an Hsp70 self-association/remodeling
      claim to a conserved assembly process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The yeast Zim17 literature supports de novo folding of mtHsp70,
      maintenance of mtHsp70 solubility, and mtHsp70 substrate interaction at
      the inner-membrane import motor. Those claims are captured by protein
      folding chaperone, protein folding, and matrix-import annotations; they
      are weaker than asserting that S. pombe zim17 drives chaperone-mediated
      assembly of a protein complex.
    supported_by:
    - reference_id: PMID:23007651
      reference_section_type: ABSTRACT
      supporting_text: >-
        Hep1 acts as a specialized chaperone mediating the de novo folding of an
        Hsp70 chaperone
    - reference_id: PMID:15992824
      reference_section_type: ABSTRACT
      supporting_text: >-
        plays a specific role in preventing protein aggregation in the
        mitochondrial matrix
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000467874
        source_label: DNL-type Zim17/Hep1 PAINT node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node supports the Hsp70 escort/chaperone function; the more
          specific protein-complex-assembly process does not follow from the
          yeast mtHsp70 folding and solubility evidence.
