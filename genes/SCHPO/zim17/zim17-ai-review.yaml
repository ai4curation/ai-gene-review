    summary: >-
      Correct orthology transfer from budding-yeast ZIM17/HEP1/TIM15 to the
      fission-yeast DNL-type zinc-finger protein.
    action: ACCEPT
    reason: >-
      Keep the matrix as the best supported sub-mitochondrial location. The
      budding-yeast protein is a matrix heat shock protein that is loosely
      associated with the inner membrane, and its mtHsp70 escort/chaperone role
      acts on matrix Hsp70s.
