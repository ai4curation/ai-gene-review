id: Q09759
gene_symbol: zim17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  zim17 encodes the fission-yeast ortholog of the conserved DNL-type
  zinc-finger Hsp70 escort protein Zim17/Hep1/Tim15. It is inferred to act in
  the mitochondrial matrix as a specialized protein-folding chaperone that keeps
  the matrix Hsp70 import motor soluble and able to engage substrate proteins
  during import of presequence-containing precursors.
