  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for tpx1, the single typical 2-Cys peroxiredoxin of S. pombe.
  Four of the five top calls are exact or near-exact GOA matches covering peroxide detoxification,
  redox homeostasis and thioredoxin peroxidase activity, so the enzymology is fully recovered. What
  is absent is the second half of this review's account - the H2O2-sensing redox-relay role that transduces
  peroxide signals to Pap1 and the Sty1/Atf1 MAPK pathway, for which GOA carries MAP kinase scaffold
  activity by EXP. The contrast with pmp20, the catalytically dead paralog in the same cohort, is
  instructive: ProTrek gives both proteins peroxidase chemistry, and is right for one and wrong for
  the other. Assessment: 2 correct not novel (CNN), 1 less precise (LSP).
