taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: rib4 (SPBC409.13; UniProt Q9UUB1) encodes 6,7-dimethyl-8-ribityllumazine synthase (lumazine
  synthase; EC 2.5.1.78), a homopentamer that condenses 5-amino-6-ribitylamino-2,4-pyrimidinedione with
  3,4-dihydroxy-2-butanone 4-phosphate to form 6,7-dimethyl-8-ribityllumazine, the direct precursor of
  riboflavin. Unusually, the S. pombe enzyme binds riboflavin tightly (KD 1.2 µM), forming a charge-transfer
  complex with Trp27, as shown by crystal structures with substrate and product analogues.
