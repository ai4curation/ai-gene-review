  - SGD:S000004701
  review:
    summary: 'PAINT inference: the PDX2/SNO glutaminase contributes to PLP synthase by supplying ammonia.'
    action: ACCEPT
    reason: 'UniProt curates the glutaminase reaction (L-glutamine + H2O = L-glutamate + NH4+) by similarity to Arabidopsis PDX2 (Q8LAD0), and classifies the protein in the glutaminase PdxT/SNO family (Pfam SNO, NCBIfam PLP_synth_Pdx2), whose members are the glutamine-hydrolysing subunits of PLP synthase. The evidence is by similarity and family membership; there is no S. pombe assay. The contributes_to qualifier fits a subunit whose glutaminase works as part of the synthase complex.'
