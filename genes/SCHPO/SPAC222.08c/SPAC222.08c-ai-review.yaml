  label: Schizosaccharomyces pombe 972h-
description: SPAC222.08c (UniProt Q9UTE4; the fission yeast SNO1/PDX2 ortholog) encodes the glutaminase
  subunit of the PLP synthase complex. It hydrolyses glutamine and channels the ammonia to the synthase
  subunit snz1 for de novo pyridoxal 5'-phosphate synthesis. Function is assigned by orthology; it is
  cytoplasmic in a genome-wide screen.
