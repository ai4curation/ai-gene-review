- term:
    id: GO:0008614
    label: pyridoxine metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000774355
  - SGD:S000001834
  - SGD:S000004701
  review:
    summary: PAINT inference of pyridoxine metabolism; the PdxT/SNO glutaminase feeds de novo PLP
      synthesis, which makes pyridoxal 5'-phosphate directly and does not pass through pyridoxine.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000774355
        source_status: UNRESOLVED
        comment: The node supplies the glutaminase subunit of PLP synthase, which makes PLP directly; pyridoxine metabolism is not the process it acts in. The S. cerevisiae SNO source annotations were not inspected, so whether the term is wrong at the node or only at this target is not settled.
    reason: Family membership (NCBIfam PLP_synth_Pdx2; PANTHER PLP synthase subunit SNO) places this
      protein as the glutaminase subunit of PLP synthase, whose product is pyridoxal 5'-phosphate. That
      route is captured by the de novo PLP biosynthesis row. Pyridoxine metabolic process is not an
      ancestor of PLP biosynthesis in GO, and nothing in the record or family evidence links the protein
      to pyridoxine itself, so the term over-reaches (likely an older vitamin-B6-as-pyridoxine usage
      propagated by PAINT). Changed from KEEP_AS_NON_CORE because the term is not shown to be true of
      the gene. No S. pombe experiment.
    supported_by:
    - reference_id: file:SCHPO/SPAC222.08c/SPAC222.08c-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'TIGR03800; PLP_synth_Pdx2'
    - reference_id: file:SCHPO/SPAC222.08c/SPAC222.08c-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PTHR31559; PYRIDOXAL 5''-PHOSPHATE SYNTHASE SUBUNIT SNO'
