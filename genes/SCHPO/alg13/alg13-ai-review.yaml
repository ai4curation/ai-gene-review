- term:
    id: GO:0098562
    label: cytoplasmic side of membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027341
  review:
    summary: Generic cytoplasmic side of membrane; the cytoplasmic side of the ER membrane is accepted
      in this review.
    action: TOO_GENERAL
    reason: True but uninformative. Alg13 is a soluble subunit that acts with the ER membrane protein
      Alg14 (by similarity) in the second, cytosol-facing step of dolichol-linked oligosaccharide
      assembly at the ER membrane; this supports the accepted cytoplasmic side of endoplasmic
      reticulum membrane (GO:0098554), which entails this term. Support is by similarity and from a
      review of the yeast pathway; none of the quotes names the cytoplasmic face explicitly.
    supported_by:
    - reference_id: file:SCHPO/alg13/alg13-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: "Heterodimer with alg14 to form a functional enzyme."
    - reference_id: PMID:9878760
      supporting_text: The oligosaccharide substrate for the N-linked protein glycosylation is assembled
        at the membrane of the endoplasmic reticulum.
