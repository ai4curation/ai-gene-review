  label: Schizosaccharomyces pombe 972h-
description: alg13 (SPAC56E4.02c; UniProt O14190) encodes the catalytic subunit Alg13 of the UDP-GlcNAc
  transferase, a cytosolic glycosyltransferase recruited to the ER by Alg14, which adds the second GlcNAc
  (beta-1,4) to GlcNAc-PP-dolichol. In the cytoplasmic phase of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol)
  assembly on the ER membrane, it adds the next sugar to the growing precursor that oligosaccharyltransferase
  transfers to nascent glycoproteins. Function is assigned by orthology to the S. cerevisiae ALG enzymes.
