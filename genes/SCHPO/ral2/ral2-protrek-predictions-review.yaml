    label: Kelch-containing formin regulatory complex
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 16.65) and absent from GOA. The Kelch-containing formin regulatory complex
      is the S. pombe tea1-tea4-for3 polarity module; ral2 does act in cell polarity, since its deletion
      produces spherical cells through the Ras1-Scd1-Cdc42 pathway, and it carries three N-terminal
      Kelch repeats. So the domain and the general pathway are right and the specific complex is not
      established. A reasonable lead rather than an annotation; left uncertain.
