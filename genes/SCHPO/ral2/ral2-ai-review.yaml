- id: PMID:2038319
  title: Identification of a GTPase-activating protein homolog in Schizosaccharomyces
    pombe.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed metadata and abstract checked; directly supports Ral2 as
      a positive Ras1 regulator while explicitly leaving its biochemical mechanism
      unresolved. PMC exposes only the abstract and scanned-document furniture.
  findings:
  - statement: The Ras-GTPase cycle in S. pombe involves the ral2 gene product as
      a positive regulator of Ras1, proposed to act either as a GDP-GTP exchange factor
      or as a negative regulator of the Gap1 GTPase- activating protein. Gap1 and
      Ste6 play antagonistic roles in this cycle.
    supporting_text: we suggest that this Ras-GTPase cycle involves the ra12 gene
      product, another positive regulator of Ras1 whose homologs have not been identified
      in other organisms, which could function either as a second GDP-GTP-exchanging
      protein or as a factor that negatively regulates Gap1 activity.
    reference_section_type: ABSTRACT
- id: file:SCHPO/ral2/ral2-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on S. pombe ral2 (P15258
    / SPBC21.05c).
  findings:
  - statement: Across independent fission-yeast genetics studies, ral2 is most consistently
      supported as a positive regulator of Ras1 signaling, functioning in Ras1-dependent
      control of mating competence and cell shape/polarized growth.
    supporting_text: Across independent fission-yeast genetics studies, ral2 is most
      consistently supported as a **positive regulator of Ras1 signaling** (a “putative
      activator of Ras1”), functioning in Ras1-dependent control of mating competence
      and cell shape/polarized growth.
    reference_section_type: OTHER
  - statement: 'Genetic epistasis places ral2 in the Ras-GTPase cycle: gap1 null bypasses
      the requirement for ral2 to keep Ras GTP-bound, and activating point mutations
      in the ras1 ORF suppress ral2 defects, supporting ral2 acting on Ras1 activation
      rather than on ras1 expression.'
    supporting_text: Point mutations in the **ras1 ORF** can suppress ral2 defects,
      supporting the idea that ral2 acts upstream of or on Ras1 activation rather
      than simply affecting ras1 expression.
    reference_section_type: OTHER
  - statement: ral2 is mechanistically framed as a positive regulator of Ras1 whose
      exact biochemistry was unresolved, hypothesized to be either a GDP->GTP exchange-type
      activator for Ras1 or an indirect negative regulator of the Ras1 GAP Gap1.
    supporting_text: 'ral2 is treated as a **positive regulator of Ras1** whose mechanism
      was unresolved: the ral2 product was hypothesized either to function as a **GDP→GTP
      exchange-type activator** for Ras1 or to act indirectly by **negatively regulating
      the Ras1 GAP Gap1**, thereby increasing Ras1-GTP.'
    reference_section_type: OTHER
  - statement: S. pombe Ral2 is reported to contain three Kelch repeats at its N-terminus
      and is placed in the Ras1-Scd pathway; Kelch repeats are protein-protein interaction
      modules, consistent with an adaptor/scaffold role rather than a defined catalytic
      activity.
    supporting_text: describe *S. pombe* Ral2 as containing **three Kelch repeats
      at its N-terminus**, and place it in the **Ras1–Scd pathway**.
    reference_section_type: OTHER
  - statement: A 2024 review of sexual differentiation initiation in S. pombe continues
      to classify ral2 as a Ras1-Scd pathway protein, reflecting ongoing recognition
      of ral2 as a Ras-pathway component.
    supporting_text: ral2 is included as a “Ras1–Scd pathway protein” in a curated
      pathway table, reflecting continued recognition of ral2 as a Ras-pathway component
      in modern syntheses of mating control.
    reference_section_type: OTHER
  - statement: No direct subcellular localization evidence (e.g., microscopy) for
      S. pombe Ral2 was retrieved; the available primary literature supports genetic/pathway
      placement and domain-level inference, so the high-throughput ER localization
      should be treated cautiously.
    supporting_text: No direct subcellular localization evidence for *S. pombe* Ral2
      (e.g., microscopy localization) was retrieved in the accessible texts used here;
      the available sources primarily provide genetic/pathway placement and domain-level
      inference.
    reference_section_type: OTHER
suggested_questions:
- question: What is the precise molecular function of ral2? Does it act as a scaffold
    bringing Ras1 together with its GEF, or does it have a different biochemical activity?
- question: Is the ER localization from the high-throughput study accurate, and if
    so, does ral2 function at the ER membrane to facilitate Ras1 activation at endomembranes?
- question: What is the significance of Ser-604 phosphorylation? Is it regulatory,
    and which kinase is responsible?
- question: Which interaction mediated by the Ral2 Kelch/BTB-like architecture promotes
    Ras1 activation, and does Ral2 regulate the Ste6 GEF, the Gap1 GAP, or Ras1
    through a distinct mechanism?
- question: Does ral2 interact directly with Ras1 protein, or does it act indirectly
    through other pathway components?
suggested_experiments:
- description: Co-immunoprecipitation or yeast two-hybrid assays to test for direct
    physical interaction between ral2 and ras1, and between ral2 and known pathway
    components (scd1, gef1, skp1).
- description: Structure-function analysis of ral2 kelch repeats by mutagenesis to
    determine which protein-protein interactions are essential for mating and morphology
    functions.
- description: Live-cell imaging of fluorescently tagged ral2 to confirm ER localization
    and determine if it colocalizes with Ras1 at specific membrane compartments.
- description: Phospho-mutant analysis (S604A, S604D) to determine if Ser-604 phosphorylation
    regulates ral2 function in mating or morphology.
