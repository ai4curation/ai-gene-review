    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  review:
    summary: The ND (no biological data) annotation for molecular function is appropriate.
      The specific biochemical activity of ral2 has not been characterized. Based
      on its kelch repeat domain and genetic interactions, it likely functions as
      a signaling adaptor or scaffold, but this has not been experimentally demonstrated
      at the molecular level.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:2586528
      supporting_text: Sequence analysis of the ral2 gene suggests that it encodes
        a polypeptide of 611 amino acid residues whose predicted amino acid sequence
        shows no strong homology to any known protein.
    - reference_id: file:SCHPO/ral2/ral2-deep-research-falcon.md
      supporting_text: Kelch repeats are ~44–56 aa motifs occurring in 5–7 repeats
        in many proteins and commonly forming **β-propeller structures**, generally
        functioning as protein–protein interaction modules.
