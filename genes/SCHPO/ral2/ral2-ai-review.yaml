taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Ral2 is a Kelch repeat-containing positive regulator of Ras1 signaling
  in S. pombe. It acts genetically upstream of Ras1 in pathways controlling mating-pheromone
  response, conjugation, and polarized cell shape, although its precise biochemical
  activity remains unknown. Ral2 contains three N-terminal Kelch repeats consistent
  with a protein-interaction role. Deletion of ral2 phenocopies ras1 deletion, producing
  spherical cells with no mating activity, while activated Ras1 restores rod-like
  morphology and pheromone response. Vegetative growth is unaffected by ral2 loss.
existing_annotations:
