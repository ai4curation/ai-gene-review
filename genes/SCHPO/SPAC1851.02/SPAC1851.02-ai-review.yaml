  label: Schizosaccharomyces pombe 972h-
description: SPAC1851.02 (UniProt Q9US20; the fission yeast SLC1 ortholog) encodes an ER 1-acylglycerol-3-phosphate
  O-acyltransferase (LPAAT; EC 2.3.1.51), which acylates lysophosphatidic acid at sn-2 to make phosphatidic
  acid, the branch point for phospholipid and triacylglycerol synthesis. Function is assigned by orthology;
  it is in the ER in a genome-wide screen.
