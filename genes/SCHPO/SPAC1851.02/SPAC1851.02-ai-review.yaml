      membership of the 1-acyl-sn-glycerol-3-phosphate acyltransferase family (curated SIMILARITY, NCBIfam
      TIGR00530, InterPro IPR004552), whose characterized members include S. cerevisiae Slc1 and human
      AGPAT1/2 among the PAINT donors. The family-level argument is accepted for this ortholog.
