  label: Schizosaccharomyces pombe 972h-
description: SPBC21C3.10c (UniProt Q9P7L3; the fission yeast RIB7 ortholog) encodes the NADPH-dependent
  2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate reductase (EC 1.1.1.302) of riboflavin biosynthesis.
  In fungi this ribosyl-side-chain reduction comes before deamination by rib2. Function is assigned by
  orthology; it is cytosolic in a genome-wide screen.
