  evidence_type: ISS
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Sec23 bridges inner-coat Sar1/Sec24 and
      outer-coat Sec13/Sec31 assemblies during COPII budding.
    action: NEW
    reason: >-
      Proposed as ISS from the conserved Sec23 COPII mechanism modeled in the
      PomBase ER-to-Golgi GO-CAM. Sar1-GTP recruits Sec23/Sec24 at ER exit
