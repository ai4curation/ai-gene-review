- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006385
  review:
    summary: >-
      Budding-yeast Sec23 participates with Lst1 in ER-phagy; by ISO this is
      plausible but peripheral for S. pombe Sec23-1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The budding-yeast donor paper shows that the
      Lst1-Sec23 cargo-adaptor complex associates with the ER-phagy receptor
      Atg40 and packages ER domains into autophagosomes. That supports a
      Sec23-family reticulophagy role by orthology, but no direct S. pombe
      Sec23-1 ER-phagy evidence was found, and this stress pathway is secondary
      to Sec23-1's core COPII ER-to-Golgi coat function.
    additional_reference_ids:
    - PMID:31273116
    supported_by:
    - reference_id: PMID:31273116
      supporting_text: >-
        we found an unexpected role for Lst1-Sec23 in ER-phagy that was
        independent from its function in secretion
      reference_section_type: ABSTRACT
