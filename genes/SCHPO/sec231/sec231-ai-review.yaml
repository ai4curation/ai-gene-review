  review:
    summary: >-
      Golgi membrane is a plausible cycling location for a peripheral Sec23
      COPII coat, but it is not the core site of Sec23-1 activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. UniProt's Golgi membrane call is by similarity and is
      compatible with Sec23 remaining peripherally associated with ER-derived
      COPII carriers as they move toward the cis-Golgi. The core Sec23-1
      activities are inner-coat assembly at ER exit sites and GAP-driven Sar1
      hydrolysis on the COPII vesicle membrane.
