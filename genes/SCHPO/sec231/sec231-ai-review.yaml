id: O74873
gene_symbol: sec231
product_type: PROTEIN
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
status: COMPLETE
description: >-
  sec231 encodes a Sec23-family peripheral COPII inner-coat subunit in fission
  yeast. Sec23-1 works with the Sec24 cargo adaptor after Sar1-GTP recruitment
  to ER exit sites, contributes the inner-coat scaffold that recruits Sec13/Sec31
  outer-coat assembly during COPII vesicle budding, and provides the GAP
  activity that accelerates Sar1 GTP hydrolysis during COPII coat turnover.
