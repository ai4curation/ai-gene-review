  - UniProtKB:Q9P003
  review:
    summary: >-
      The PANTHER cornichon node supports ER-to-Golgi transport for Cor1.
    action: ACCEPT
    reason: >-
      Accept. Cornichon cargo receptors facilitate ER export of membrane
      cargoes through COPII vesicles, and Cor1 inherits the ER-to-Golgi term
      from the appropriate PAINT cornichon node. No PAINT IRD or IKR loss was
      found on the S. pombe cor1 lineage.
    supported_by:
    - reference_id: PMID:41676957
      supporting_text: >-
        cornichons help their interaction partners to be incorporated into
        COPII-coated vesicles and thus be efficiently exported from the ER to
        the Golgi apparatus
