description: >-
  cor1 encodes an S. pombe cornichon-family multipass ER-membrane protein.
  Sequence, topology and PAINT placement support a predicted role as a COPII
  cargo receptor for ER-to-Golgi vesicle-mediated transport, parallel to the
  characterized fungal cornichon Erv14.
