knowledge_gaps:
- gap_statement: >-
    The direct S. pombe transmembrane cargoes selected by Cor1, and the extent
    to which that cargo repertoire overlaps with Erv14's, have not been
    experimentally resolved.
  boundary: >-
    Cor1 is predicted to be a cornichon COPII cargo receptor by orthology and
    conserved family signatures, but the cached S. pombe literature does not
    name an assayed Cor1 cargo or compare Cor1 and Erv14 specificity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct cargo assignment would determine whether the poorly characterized
    fission-yeast Cor1 protein is a redundant Erv14 paralog or specializes on a
    distinct subset of transmembrane cargoes.
  resolution: >-
    Identify cargoes that physically depend on Cor1 for efficient COPII
    packaging and compare their ER-export defects in cor1, erv14, and double
    mutant backgrounds.
  provenance:
  - reference_id: file:genes/SCHPO/cor1/cor1-notes.md
    supporting_text: >-
      the cached literature did not identify an assayed Cor1-specific cargo
suggested_questions: []
suggested_experiments:
- hypothesis: >-
    Cor1 and Erv14 export overlapping but non-identical sets of S. pombe
    transmembrane secretory cargoes.
  description: >-
    Endogenously tag Cor1 and Erv14, identify bound or proximal cargoes by
    affinity purification or proximity labeling under COPII-permissive
    conditions, and measure ER retention or COPII-vesicle incorporation of the
    candidate cargoes in cor1, erv14, and cor1 erv14 mutants.
  experiment_type: comparative cargo-receptor genetics and vesicle proteomics
