  label: Schizosaccharomyces pombe 972h-
description: met17 (UniProt O13326) encodes the PLP-dependent O-acetylhomoserine sulfhydrylase (homocysteine
  synthase; EC 2.5.1.49). It condenses O-acetyl-L-homoserine, made by met6, with sulfide to form L-homocysteine
  directly, without going through cystathionine. S. pombe lacks cystathionine beta-synthase and gamma-lyase,
  so methionine cannot be converted to cysteine; the direct sulfhydrylation route, with the forward cystathionine
  route (met3/str3), supplies homocysteine for methionine and SAM. Like other Met17-family enzymes, it
  also sulfhydrylates O-acetylserine in vitro. It is cytosolic in a genome-wide screen.
