  label: Schizosaccharomyces pombe 972h-
description: lsb6 (SPAC343.19; UniProt Q9UT42) encodes the type II phosphatidylinositol 4-kinase of fission
  yeast, the ortholog of S. cerevisiae Lsb6 and mammalian PI4K2A/B. It is a palmitoylated, membrane-bound
  enzyme on the vacuolar membrane and, in the localisation screen, also on the Golgi. lsb6 deletion modestly
  lowers membrane PI4P, more so together with loss of the Stt4 scaffold Efr3, but does not affect cytokinetic
  ring positioning; Stt4 and Pik1 make the main PI4P pools.
