  label: Schizosaccharomyces pombe 972h-
description: gdh1 (SPCC622.12c; UniProt P78804) encodes the NADP-specific glutamate dehydrogenase (EC
  1.4.1.4) of fission yeast. It reductively aminates 2-oxoglutarate with ammonium and NADPH to make glutamate,
  an anabolic route of ammonia assimilation that runs in parallel with the GS/GOGAT cycle. It is cytosolic
  in a genome-wide screen. Its deletion does not cause the invasive-growth defect seen in glt1 mutants.
