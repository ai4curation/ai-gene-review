suggested_questions:
- question: Does S. pombe Erg6 methylate lanosterol to eburicol in vitro, as suggested by eburicol accumulation
    under azole treatment in Schizosaccharomyces? GO has no lanosterol 24-C-methyltransferase term (GO:0003838 is
    defined on zymosterol only).
- question: Is the nuclear YFP signal reported for Erg6 in the ORFeome screen a nuclear-envelope/ER signal, and
    does Erg6 also reside on lipid droplets in fission yeast as in budding yeast?
suggested_experiments:
- hypothesis: S. pombe Erg6 accepts both zymosterol and lanosterol as methyl acceptors.
  description: Express S. pombe Erg6 and measure SAM-dependent methylation of zymosterol and lanosterol (kinetics,
    product identification by GC-MS).
  experiment_type: enzyme kinetics
