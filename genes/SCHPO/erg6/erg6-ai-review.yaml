  label: Schizosaccharomyces pombe 972h-
description: erg6 (SPBC16E9.05) encodes the sterol 24-C-methyltransferase of Schizosaccharomyces pombe, a SAM-dependent
  methyltransferase of the Erg6/SMT family. It transfers a methyl group from S-adenosyl-L-methionine to C-24 of
  zymosterol to form fecosterol (EC 2.1.1.41), adding the C-28 methyl group that distinguishes ergosterol from cholesterol.
  Sterol analyses of Schizosaccharomyces suggest that C-24 methylation can also occur on lanosterol, giving eburicol,
  so erg6 may act at two points of the pathway. erg6 deletion mutants are viable but make no ergosterol, accumulate
  lanosterol, have abnormal morphology, and are sensitive to cycloheximide and staurosporine; erg6 is induced under
  anaerobiosis via the SREBP Sre1. The enzyme is associated with the ER.
