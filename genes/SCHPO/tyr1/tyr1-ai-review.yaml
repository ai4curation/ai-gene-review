taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: tyr1 (SPCC1494.04c; UniProt O60078) encodes prephenate dehydrogenase, which oxidatively decarboxylates
  prephenate to 4-hydroxyphenylpyruvate, the committed step of tyrosine biosynthesis; a transamination
  then gives tyrosine. Whether it uses NAD+ or NADP+ has not been determined. tyr1 mutants are tyrosine
  auxotrophs and the gene is used as a selectable marker. The enzyme is cytosolic in a genome-wide screen.
existing_annotations:
- term:
    id: GO:0004665
    label: prephenate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003099
  - RHEA:21640
  - EC:1.3.1.13
  review:
    summary: EC/RHEA mapping of the NADP+-dependent reaction. UniProt names tyr1 NADP-dependent, while
      PAINT and the IMP assign NAD+. The cofactor specificity of S. pombe Tyr1 has not been measured.
    action: KEEP_AS_NON_CORE
    reason: Supported by family membership only. Tyr1 is in the prephenate/arogenate dehydrogenase family
      and the PANTHER NADP(+)-type prephenate dehydrogenase subfamily, carries a predicted NADP(+)-binding
      Rossmann motif (residues 5-34, sequence analysis) and a 6PGDH-type NADP-binding domain, and UniProt
      curates the NADP+-dependent reaction (EC 1.3.1.13) without an experimental tag. The S. pombe evidence
      (tyrosine auxotrophy, PMID:15704224) shows the step but not the cofactor, and other rows assign NAD+;
      the NADP+ form is plausible but unmeasured, so it is kept as non-core.
    supported_by:
    - reference_id: file:SCHPO/tyr1/tyr1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=prephenate + NADP(+) = 3-(4-hydroxyphenyl)pyruvate + CO2 + NADPH;
    - reference_id: file:SCHPO/tyr1/tyr1-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: 'FT   BINDING         5..34 FT                   /ligand="NADP(+)"'
    - reference_id: file:SCHPO/tyr1/tyr1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR006115; 6PGDH_NADP-bd.
    - reference_id: file:SCHPO/tyr1/tyr1-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR21363:SF0; PREPHENATE DEHYDROGENASE [NADP(+)]; 1.
