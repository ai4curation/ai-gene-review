- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000778915
  - SGD:S000000552
  review:
    summary: "PAINT inference of ATP hydrolysis from the in vitro ATPase of S. cerevisiae Pof1, an NMN-specific NMNAT; in vitro activity of unknown physiological relevance."
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: SGD:S000000552
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The S. cerevisiae Pof1 source has an in vitro ATPase but is an NMN-specific NMNAT; the ATPase is not shown to be physiological.
    reason: "The PAINT node is seeded by S. cerevisiae Pof1 (SGD:S000000552), whose purified protein showed ATPase activity in vitro (PMID:22204397). Pof1 was later shown to be an NMN-specific NMNAT (PMID:24759102), and nothing shows the ATPase is a physiological activity rather than a side reaction of the adenylyltransferase. Under the enzyme-specificity tiers this is real in vitro activity of unknown relevance, propagated into a species with no assay, so it is marked over-annotated rather than kept as a genuine secondary activity."
    supported_by:
    - reference_id: PMID:22204397
      supporting_text: In vitro analysis showed, however, that the purified Pof1p enzyme had no
        cytidylyltransferase activity but does have ATPase activity
