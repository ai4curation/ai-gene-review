  label: Schizosaccharomyces pombe 972h-
description: SPAC694.03 (UniProt Q9P7T7; the fission yeast POF1 ortholog) encodes a putative nicotinamide
  mononucleotide adenylyltransferase of the Pof1 type, distinct from the main NMNAT (SPAC806.06c). By
  orthology to S. cerevisiae Pof1, it adenylates NMN to NAD+ in the NMN/nicotinamide riboside salvage
  branch and may also hydrolyse ATP. Function is assigned by orthology; it is cytosolic in a genome-wide
  screen.
