  - SGD:S000003963
  - UniProtKB:Q709C8
  - UniProtKB:Q96RL7
  review:
    summary: >-
      PAINT placement at PTN000414879, seeded by budding yeast Vps13 and human
      VPS13C/VPS13A. Budding yeast Vps13 is recruited to the mitochondrial outer
      membrane by Mcp1 and acts at vacuole-mitochondria and endosome-mitochondria
      contacts. No S. pombe localization data exist (the ORFeome GFP fusion gave no
      signal).
    action: ACCEPT
    reason: >-
      Vps1302 lies within the clade that inherited the node, and nothing specific to
      Vps1302 suggests loss. The mitochondrial contact-site location is part of how
      Vps13 proteins deliver lipids to mitochondria. The adaptor that recruits
      fission yeast Vps1302 has not been identified.
    supported_by:
    - reference_id: PMID:28864540
      supporting_text: >-
        Here we show that the mitochondrial outer membrane protein Mcp1 functions in the
        same pathway as Vps13 by recruiting it to mitochondria and promoting its
        association to vacuole-mitochondria contacts.
    - reference_id: PMID:27280386
      supporting_text: >-
        In different growth conditions, Vps13 localizes to endosome-mitochondrion
        contacts and to the nuclear-vacuole junctions, indicating that Vps13 may function
        at membrane contact sites.
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0132
  review:
    summary: >-
      Electronic mapping from the UniProt subcellular-location line, which states
      trans-Golgi network by similarity (ECO:0000250). The basis is budding yeast Vps13,
      which binds Golgi membranes through Arf1 and its C-terminal PH-like domain and is
      directly required for TGN-to-prevacuolar compartment transport in vitro. No
      S. pombe localization data exist.
    action: KEEP_AS_NON_CORE
    reason: >-
      Golgi association is supported for the budding yeast protein in the same
      subfamily (PMID:34830155, PMID:28122955), and decreased acid phosphatase secretion
      in S. pombe vps1302 deletion cells is consistent with a secretory-pathway role
      (PMID:21850271). PAINT did not propagate any Golgi term to the SF93 clade. The
      transferred evidence therefore supports Golgi membranes in general and no more
      precise term. This is a peripheral location relative to the contact-site lipid
      transfer function, so the row is kept as non-core rather than refined.
    supported_by:
    - reference_id: PMID:34830155
      supporting_text: >-
        Furthermore, we characterized the PH-like domain of Vps13 as being responsible
        for the localization of Vps13 to Golgi membranes through an interaction with
        Arf1.
    - reference_id: PMID:28122955
      supporting_text: >-
        we show that Vps13p is directly required both for transport from the trans-Golgi
        network (TGN) to the late endosome/prevacuolar compartment (PVC) and for TGN
        homotypic fusion
    - reference_id: PMID:21850271
      supporting_text: >-
        The results showed that in Δapm1, Δvps1302 and Δgos1 cells the acid phosphatase
        secretion index was dramatically decreased to approximately 50% of that in
        wild-type cells (Figure 4).
