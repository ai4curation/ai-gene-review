suggested_questions:
- question: >-
    Which adaptors recruit S. pombe Vps1302 to endosomes, vacuoles or mitochondria, given
    that the budding yeast adaptors (Ypt35, Mcp1, Spo71) may not all have fission yeast
    counterparts?
- question: >-
    Are the meiotic phenotypes of vps1302 deletion strains caused by loss of the
    full-length protein or by loss of the nested Spo2 product made from the 3' end of
    the locus?
- question: >-
    How are functions divided between Vps1302 (SF93, Vps13 subfamily) and Vps1301
    (separate subfamily SF145) in S. pombe?
suggested_experiments:
- description: >-
    Endogenously tag Vps1302 at an internal site that preserves function (avoiding the
    C-terminus, which overlaps Spo2) and image it with organelle markers to test
    localization to endosome, vacuole and mitochondrial contacts.
  experiment_type: fluorescence microscopy
- description: >-
    Express the N-terminal chorein/groove region of Vps1302 and test glycerophospholipid
    binding and liposome-to-liposome transfer in vitro.
  experiment_type: in vitro lipid transfer assay
- description: >-
    Build a vps1302 allele that inactivates the long protein but leaves the spo2 ORF and
    its meiotic transcript intact (for example, an early in-frame stop), and compare its
    meiotic phenotypes with those of the full deletion.
  experiment_type: genetic separation-of-function analysis
