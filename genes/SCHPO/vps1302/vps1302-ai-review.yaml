        O42926 (vps1302) is in PTHR16166:SF93 "INTERMEMBRANE LIPID TRANSFER PROTEIN VPS13",
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
