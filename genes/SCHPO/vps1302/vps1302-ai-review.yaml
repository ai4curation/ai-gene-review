- term:
    id: GO:0120010
    label: intermembrane phospholipid transfer
  evidence_type: TAS
  original_reference_id: PMID:32213462
  qualifier: involved_in
  review:
    summary: >-
      PomBase traceable author statement citing the Lees & Reinisch review, which
      describes Vps13 and chorein-N proteins as bulk lipid transporters with an extended
      hydrophobic channel. The review discusses the family, not the S. pombe protein
      specifically.
    action: ACCEPT
    reason: >-
      This is the core process of VPS13-family proteins. Vps1302 belongs to the
      subfamily of budding yeast Vps13, whose glycerophospholipid transfer has been
      shown in vitro (PMID:30093493), and to the family whose structure shows a long
      hydrophobic groove (PMID:32182622). The function is inferred for S. pombe, not
      demonstrated there.
    supported_by:
    - reference_id: PMID:32213462
      supporting_text: >-
        Here, we highlight the recently identified chorein_N family of lipid
        transporters, including the Vps13 proteins and the autophagy protein Atg2.
    - reference_id: PMID:32182622
      supporting_text: >-
        The structure suggests that VPS13 and related proteins, like the autophagy
        protein ATG2, can act as bridges between organelle membranes to allow bulk lipid
        flow between organelles.
