- term:
    id: GO:0016236
    label: macroautophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0052113
  - PANTHER:PTN000414879
  - SGD:S000003963
  - dictyBase:DDB_G0267422
  review:
    summary: >-
      PAINT placement at PTN000414879, seeded by Drosophila, budding yeast and
      Dictyostelium VPS13 proteins. Budding yeast Vps13 is needed to package the ER
      into autophagosomes during ER-phagy, and is proposed to supply or remove
