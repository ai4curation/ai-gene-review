  review:
    summary: >-
      Transferred by sequence similarity from S. cerevisiae Vps13 (Q07878), which is in
      the same PANTHER subfamily (SF93). Purified budding yeast Vps13 binds
      glycerophospholipids and phosphoinositides directly. Not tested for the S. pombe
      protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      The transfer is phylogenetically grounded: Vps1302 and S. cerevisiae Vps13 are in
      the same subfamily, and the donor annotation rests on direct binding assays
      (PMID:30093493, PMID:28122955). Lipid binding is a mechanistic prerequisite of the
      core phospholipid transfer activity, not a separate function, so it is kept as
      non-core. It is not a GO ancestor of phospholipid transfer activity, so
      TOO_GENERAL does not apply.
    supported_by:
