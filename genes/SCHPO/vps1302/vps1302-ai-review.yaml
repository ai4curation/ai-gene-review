id: O42926
gene_symbol: vps1302
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Vps1302 (Vps13b, SPBC16C6.02c) is a 3131-residue member of the VPS13 family of
  bridge-like lipid transfer proteins, with an N-terminal chorein domain and an SHR-BD
  (VAB) domain. It belongs to the same PANTHER subfamily (PTHR16166:SF93) as budding
  yeast Vps13 and is the fission yeast counterpart of that protein, whereas the other
  S. pombe family member, Vps1301, falls in a separate subfamily. By homology with
  budding yeast Vps13, whose N-terminal region binds tens of glycerophospholipids and
  transfers them between membranes in vitro, Vps1302 is expected to form an extended
  hydrophobic groove that conducts phospholipids between apposed organelle membranes
  at contact sites involving endosomes, vacuoles and the mitochondrial outer membrane.
  None of these activities or localizations has yet been demonstrated for the fission
  yeast protein itself. The deletion mutant is viable; it secretes about half the
  wild-type level of acid phosphatase, is moderately sensitive to micafungin and
  FK506, and has normal vacuole fusion. The last 133 residues of Vps1302 (2999-3131)
  are identical to the sporulation protein Spo2, which is made from the 3' end of the
  same locus during meiosis.
