  review:
    summary: >-
      PAINT placement at PTN000414879, seeded by several metazoan and yeast VPS13
      members. In budding yeast, Vps13 maintains mitochondrial integrity and acts in
      parallel with ERMES. Gain-of-function Vps13 alleles bypass loss of ERMES, which
