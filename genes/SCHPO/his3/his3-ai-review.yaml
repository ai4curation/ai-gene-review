  label: Schizosaccharomyces pombe 972h-
description: his3 (SPBC11B10.02c; UniProt P36605), the fission yeast ortholog of S. cerevisiae HIS5, encodes
  histidinol-phosphate aminotransferase (imidazole acetol phosphate transaminase; EC 2.6.1.9). This PLP-dependent
  class-II aminotransferase transfers an amino group from glutamate to imidazoleacetol phosphate to form
  L-histidinol phosphate, step 7 of histidine biosynthesis. Its transcript falls under nitrogen limitation
  but not under histidine starvation. It is a common auxotrophic marker and is cytosolic in a genome-wide
  screen.
