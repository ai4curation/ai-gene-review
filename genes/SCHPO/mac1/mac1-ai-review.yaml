id: Q10268
gene_symbol: mac1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Mac1 is a fungal SUR7/PalI/Rim9-family multipass plasma-membrane protein in
  Schizosaccharomyces pombe that localizes to the cell tips and division septum.
  Its N-terminal transmembrane region anchors the long cytoplasmic region at the
  cell periphery, and balanced Mac1 dosage is required for efficient cell
  separation at elevated growth temperatures.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: Mac1 localization and mutant phenotypes are known, but no direct
      molecular activity has been determined.
    action: ACCEPT
    reason: >-
      The direct Mac1 paper establishes plasma-membrane/tip/septum localization
      and a high-temperature cell-separation phenotype; it does not identify a
      catalytic, transporter, or specific binding activity for Mac1. The ND
      molecular_function placeholder remains accurate until the elemental
      activity of this SUR7/PalI/Rim9-family protein is resolved.
    additional_reference_ids:
    - PMID:12206652
    supported_by:
    - reference_id: PMID:12206652
      supporting_text: >-
        mac1 null mutant cells had no overt phenotype at 22-32 degrees C, but,
        nevertheless, displayed a marked decrease in viability at 34-36 degrees
        C, accompanied by severe separation defects.
