suggested_questions:
- question: Does S. pombe Ppc1 use CTP or ATP as the nucleotide (human PPCS is ATP-preferring, bacterial
    CoaB uses CTP)?
- question: Does S. pombe form a CoA-synthesizing protein complex comparable to the S. cerevisiae CoA-SPC
    (Cab2-Cab3-Cab4-Cab5-Sis2/Vhs3) with hal3 and cab4/cab5?
suggested_experiments:
- description: Assay recombinant Ppc1 (wild type, T48I, M209T) for phosphopantothenoylcysteine synthesis
    with ATP versus CTP.
