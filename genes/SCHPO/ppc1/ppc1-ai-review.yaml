  label: Schizosaccharomyces pombe 972h-
description: 'Phosphopantothenate--cysteine ligase (phosphopantothenoylcysteine synthetase, PPCS; EC 6.3.2.51/6.3.2.5)
  of fission yeast, encoded by SPCC4B3.18 (UniProt still names it ''Uncharacterized protein C4B3.18'').
  It condenses 4''-phosphopantothenate with L-cysteine to 4''-phosphopantothenoylcysteine, the second
  step of CoA biosynthesis. Ppc1 is essential: temperature-sensitive mutants (ts-537, T48I; ts-88, M209T)
  map in ppc1; ppc1-537 becomes auxotrophic for pantothenate at permissive temperature and has greatly
  reduced CoA and acetyl-CoA, histone hypoacetylation, failure to exit quiescence, mitotic chromosome-segregation
  defects and fragile DNA. GFP-tagged Ppc1 is distributed throughout the cell.'
