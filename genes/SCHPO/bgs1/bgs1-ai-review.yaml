suggested_questions:
- question: Does purified Bgs1 make a strictly linear beta-1,3-glucan in vitro, and what part of
    the protein (or which partner) decides linear versus branched product compared with Bgs4?
- question: Is Sbg1 a stable stoichiometric partner of Bgs1 at the plasma membrane, as the Ghs2-Bgs3
    pairing suggests, and should GO represent such synthase-partner assemblies apart from the
    1,3-beta-D-glucan synthase complex?
- question: The PomBase GO-CAM for septum assembly gives Bgs4 the branched-glucan synthase child
    term but gives Bgs1 the parent GO:0003843. Should Bgs1 be updated to GO:0140753 linear
    1,3-beta-D-glucan synthase activity?
suggested_experiments:
- description: Purify Bgs1 (with or without Sbg1) in detergent or proteoliposomes, assay with
    UDP-[14C or 13C]glucose and analyze the product by linkage analysis or NMR to test directly
    whether it is linear beta-1,3-glucan.
- description: Use a catalytic-dead bgs1 allele expressed at normal levels to separate the role of
    the linear glucan product from structural roles of the Bgs1 protein in contractile ring
    stability and growth polarity.
