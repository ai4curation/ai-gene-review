  review:
    summary: GFP-Bgs1, expressed from its own promoter in a bgs1-deleted strain, localizes to the
      contractile ring and the growing septum during cytokinesis (Cortes et al. 2002).
    action: KEEP_AS_NON_CORE
    reason: The observation is sound, and Bgs1 builds the primary layer of the division septum.
      The septum itself, however, is a cell wall structure, while Bgs1 is an integral plasma
      membrane protein that sits in the membrane at the leading edge of the ingressing septum.
      Light microscopy cannot separate the septum from the membrane that lines it. The term is kept
      as a true but non-core statement; the core location of the activity is the cleavage furrow
      plasma membrane at the cell division site (GO:0032154, GO:0032153).
    supported_by:
    - reference_id: PMID:12356913
      supporting_text: 'During vegetative growth, Bgs1p always localizes to the growing zones: one
        or both ends during cell growth and contractile ring and septum during cytokinesis.'
    - reference_id: PMID:22891259
      supporting_text: both Ags1 and Bgs1 concentrated in a ring that moved with the edge of the
        growing septum.
