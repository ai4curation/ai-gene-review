id: Q10287
gene_symbol: bgs1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Bgs1 (also called Cps1 and Drc1) is one of the four Schizosaccharomyces pombe 1,3-beta-glucan
  synthases (Bgs1-4), large multi-pass plasma membrane proteins of glycosyltransferase family 48
  (FKS family) that use cytosolic UDP-glucose to make (1->3)-beta-D-glucan chains and extrude them
  into the cell wall. Bgs1 is essential and is responsible for the minor linear beta-1,3-glucan
  that forms the primary septum during cytokinesis. After mitosis it is delivered by
  Myo52-dependent, exocyst- and TRAPP-II-dependent secretory traffic to the plasma membrane next
  to the actomyosin contractile ring. It arrives there before the other glucan synthases, and its
  recruitment depends on the contractile ring and the septation initiation network. It then moves
  with the leading edge of the ingressing septum. Loss of Bgs1 function blocks primary septum
  assembly: cells arrest with a stable contractile ring, and null cells become multinucleate.
  Bgs1 is not needed for general cell integrity. It also localizes to growing cell tips (it is
  the first synthase to return to the old end after division), mating projections, the zygote
  neck, forespores and germinating spores. Linear beta-1,3-glucan made by Bgs1 at the tips helps
  maintain growth polarity together with the Tea1-Tea4 complex. Bgs1 co-immunoprecipitates with
  the alpha-glucan synthase Ags1, which co-localizes with it at the division site. Its trafficking
  to the plasma membrane depends on Sbg1, a single-pass membrane protein whose transmembrane
  domain is related to that of Ghs2, the partner of Bgs3.
