core_functions:
- description: >-
    Catalytic subunit of the 1,3-beta-glucan synthase that makes the linear beta-1,3-glucan of the
    primary septum. Bgs1 is delivered to the plasma membrane next to the contractile ring after
    mitosis, ahead of the other glucan synthases, and moves with the leading edge of the ingressing
    septum. There it polymerizes UDP-glucose into linear (1->3)-beta-D-glucan and extrudes it to
    form the primary septum, which is needed for septum assembly and cytokinesis.
  molecular_function:
