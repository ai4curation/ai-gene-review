  label: Schizosaccharomyces pombe 972h-
description: trp2 (SPAC19A8.15; UniProt O13831), the ortholog of S. cerevisiae TRP5, encodes tryptophan
  synthase (EC 4.2.1.20), a single polypeptide fusing the alpha and beta domains. The alpha domain cleaves
  indole-3-glycerol phosphate to indole and glyceraldehyde 3-phosphate; the indole is channelled to the
  PLP-dependent beta domain, which condenses it with serine to make tryptophan, the final step of the
  pathway. Function is assigned by orthology; it is cytosolic in a genome-wide screen.
