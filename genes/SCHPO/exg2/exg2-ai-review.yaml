- term:
    id: GO:0009251
    label: glucan catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001262628
  - UniProtKB:Q5AVZ7
  - UniProtKB:Q5B6Q3
  review:
    summary: >-
      PAINT places broad glucan catabolism at PTHR31297 node PTN001262628; Exg2
      inherits that broad family assertion, while its direct biochemical
      evidence argues against the narrower beta-1,6-glucanase activity
      propagated by other sources.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA comes from the PANTHER family-root node PTN001262628, not from a
      pairwise transfer to Exg1. Exg2-specific evidence is more nuanced than for
      Exg1 or Exg3: PMID:20852022 did not detect pustulan hydrolase activity for
      Exg2, but Exg2 is a GH5 membrane protein that altered cell-wall glucan
      deposition when overproduced, and PMID:25825517 found GFP-tagged Exg2 at
      the actin fusion focus and an exg2 deletion among the single glucanase
      deletions that reduced mating-pair fusion in a fus1Delta-sensitized
      background. The IBA is retained as a broad, non-core family-level
      catabolism assertion; the only direct catabolic-direction evidence is the
      mating fusion-focus role captured by GO:1904541, and the vegetative Exg2
      phenotype does not establish glucan catabolism as its normal core
      process.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001262628
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PAINT placed GO:0009251 at the broad PTHR31297 node inherited by Exg2;
          Exg2-specific wall-organization and mating-fusion data fit that broad
          process even though narrower beta-1,6-glucanase activity is
          contradicted for Exg2.
    additional_reference_ids:
    - PMID:20852022
    - PMID:25825517
    - file:interpro/panther/PTHR31297/PTHR31297-paint.tsv
    supported_by:
    - reference_id: file:interpro/panther/PTHR31297/PTHR31297-paint.tsv
      supporting_text: "PTHR31297\tPTN001262628\tGO:0009251\tP\tIBD\tfalse\tUniProtKB:Q5AVZ7|UniProtKB:Q5B6Q3\ttaxon:\t20170228"
    - reference_id: PMID:20852022
      supporting_text: >-
        Overexpression of Exg2 resulted in an increase in cell wall material at
        the poles and in the septum, but the putative catalytic activity of the
        protein was not required for this effect.
    - reference_id: PMID:25825517
      supporting_text: >-
        We used GFP tagged alleles of seven distinct glucanases—the
        endo-α(1,3)-glucanases Agn1 and Agn2 (Dekker et al., 2004, 2007), the
        endo-β(1,3)-glucanases Eng1 and Eng2 (Martín-Cuadrado et al., 2003,
        2008), and the β(1,6)-glucanases Exg1, Exg2, and Exg3
        (Dueñas-Santero et al., 2010). Remarkably, all seven colocalized with
        Myo52-tdTomato at the fusion focus (Fig. 5 A).
