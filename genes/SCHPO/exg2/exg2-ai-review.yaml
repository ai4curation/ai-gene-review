suggested_questions:
- question: >-
    Does Exg2 hydrolyze a beta-glucan substrate other than pustulan, catalyze a
    transglycosidase reaction, or regulate fungal wall deposition through a
    non-catalytic GH5-domain mechanism?
suggested_experiments:
- description: >-
    Purify membrane-reconstituted wild-type and catalytic-site mutant Exg2, test
    beta-1,6-, beta-1,3-, mixed-linkage, and intact fission-yeast wall substrates
    for hydrolysis or transglycosylation, and compare complementation of exg2
    wall-deposition and mating-fusion phenotypes.
  experiment_type: biochemical substrate profiling and genetic complementation
