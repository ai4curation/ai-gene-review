      fusion efficiency when crossed to fus1Delta. The annotation is supported
      as a mating-specific contribution to focal cell-wall digestion, but it is a
      contextual sexual-differentiation role rather than the vegetative
      growth-site activity captured by the 2010 Exg2 study.
    supported_by:
    - reference_id: PMID:25825517
      supporting_text: >-
        Remarkably, all seven colocalized with Myo52-tdTomato at the fusion
        focus (Fig. 5 A). Deletion of each single one of these, except eng1Δ,
        led to reduction in fusion efficiency in crosses to fus1Δ (Fig. 5 B).
