  review:
    summary: >-
      Exg2 is an experimentally supported integral membrane protein that
      localizes to growth-site membranes at poles and septa.
    action: ACCEPT
    reason: >-
      Fractionation established Exg2 as a single-pass/integral membrane protein,
      and weakly overexpressed Exg2-GFP localized at the plasma-membrane growth
