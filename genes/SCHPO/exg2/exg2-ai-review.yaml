- term:
    id: GO:1904541
    label: mating projection tip cell wall disassembly
  evidence_type: IGI
  original_reference_id: PMID:25825517
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPAC20G4.02c
  review:
    summary: >-
      Exg2 contributes to mating projection tip cell-wall disassembly at the
      Myo52-marked actin fusion focus during cell fusion.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:25825517 directly localized GFP-tagged Exg2 to the fusion focus and
