- term:
    id: GO:0000935
    label: division septum
  evidence_type: IDA
  original_reference_id: PMID:20852022
  qualifier: is_active_in
  review:
    summary: >-
      Exg2 is an integral membrane GH5-domain protein whose mildly overexpressed
      GFP fusion localizes to vegetative growth sites, including the division
      septum.
    action: ACCEPT
    reason: >-
      PMID:20852022 provides direct live-cell localization evidence: native
      Exg2-GFP was below detection, but weak nmt1-driven Exg2-GFP localized at
      cell poles and septa, matching Exg2's fractionation as an integral
      membrane protein. The septal IDA row is therefore a supported localization
      for Exg2.
    supported_by:
    - reference_id: PMID:20852022
      supporting_text: >-
        When Exg2-GFP was mildly overexpressed using the weak P41X- nmt1 +
        promoter, the localization of the protein could be determined. Exg2 was
        localized at the sites of cell growth, that is, the poles of the cell
        and the septum ( Fig. 3D , arrowheads).
