id: Q10444
gene_symbol: exg2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  exg2 encodes an integral membrane glycoside hydrolase family 5 protein in
  Schizosaccharomyces pombe. It localizes to plasma-membrane growth sites,
  including cell poles and the division septum, and influences
  beta-glucan-containing fungal cell-wall deposition when overproduced. Although
  Exg2 is related to the active Exg1 and Exg3 beta-glucanases, direct assays did
  not detect beta-1,6-glucanase activity for Exg2, and the wall phenotype caused
  by Exg2 overproduction does not require its predicted catalytic residues.
  During mating, Exg2-GFP also concentrates at the actin fusion focus, where it
  contributes redundantly with other glucanases to focal cell-wall digestion for
  cell fusion.
