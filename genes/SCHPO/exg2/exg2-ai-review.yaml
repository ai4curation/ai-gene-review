- term:
    id: GO:0031505
    label: fungal-type cell wall organization
  evidence_type: IMP
  original_reference_id: PMID:20852022
  qualifier: involved_in
  review:
    summary: >-
      Overexpressed Exg2 disrupts fungal-type cell-wall organization by causing
      excess glucan-rich wall material at poles and septa.
    action: ACCEPT
    reason: >-
      Exg2 overexpression caused growth and morphology defects with abnormal
      wall material enriched in beta-glucans at poles and septa; deleting the GH5
      domain abolished that phenotype, whereas mutating the putative catalytic
      residues did not. The IMP row captures a target-specific effect of Exg2 on
      fungal-type cell-wall organization without asserting a demonstrated
      beta-1,6-glucanase activity.
    supported_by:
    - reference_id: PMID:20852022
      supporting_text: >-
        The material stained well with aniline blue ( Fig. 5B ), indicating that
        it was cell wall and that at least a portion of it was comprised of
        β-glucans. The excess of cell wall accumulated specifically at the poles
        and septum of the cells.
