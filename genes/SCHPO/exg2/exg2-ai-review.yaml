- term:
    id: GO:0046557
    label: glucan endo-1,6-beta-glucosidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.2.1.75
  review:
    summary: >-
      The EC-to-GO catalytic inference should be removed for Exg2 because
      target-specific assays detected beta-1,6-glucanase activity for Exg1 and
      Exg3 but not for Exg2.
    action: REMOVE
    reason: >-
      EC:3.2.1.75 correctly maps to GO:0046557 for enzymes known to hydrolyze
      beta-1,6 linkages, but PMID:20852022 is direct counterevidence for Exg2:
      overexpressing exg2 did not increase pustulan-hydrolyzing activity, and
      mutating both putative GH5 catalytic residues did not abolish the Exg2
      overexpression wall phenotype. The automated EC inference therefore
      over-propagates a glucan endo-1,6-beta-glucosidase molecular function from
      active family members onto an Exg2 protein whose catalytic activity was not
      detected.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: EC:3.2.1.75
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The EC-to-GO mapping is appropriate for real EC:3.2.1.75 enzymes, but
          Exg2-specific assays detected no beta-1,6-glucanase activity and
          retained the overexpression phenotype after catalytic-site mutation.
    additional_reference_ids:
    - PMID:20852022
    supported_by:
    - reference_id: PMID:20852022
      supporting_text: However, no activity could be detected in cells overexpressing exg2 + .
    - reference_id: PMID:20852022
      supporting_text: >-
        However, the putative catalytic activity of the enzyme was not required
        for this effect since cells carrying the double mutant Exg2-A1A2 (and
        also the two single mutants Exg2-A1 and Exg2-A2) were almost identical
        to those overexpressing the full-length protein ( Fig. 7B ).
