description: rki1 (SPAC144.12; UniProt Q9UTL3) encodes ribose-5-phosphate isomerase (EC 5.3.1.6), which
  interconverts ribulose 5-phosphate and ribose 5-phosphate, supplying ribose 5-phosphate for PRPP and
  nucleotide synthesis. By orthology it works in the non-oxidative pentose phosphate pathway, which interconverts
  pentose phosphates and glycolytic intermediates. Its activity is induced by delta-gluconolactone and
  repressed by glucose. It is cytosolic in a genome-wide screen.
