  label: Schizosaccharomyces pombe 972h-
description: Galactokinase of fission yeast, a GHMP-kinase family enzyme orthologous to budding-yeast
  GAL1 that phosphorylates alpha-D-galactose to galactose 1-phosphate using ATP, the first step of the
  Leloir pathway. The gene is part of a subtelomeric gal7-gal10-gal1 cluster that is transcriptionally
  silenced in wild-type cells, which therefore cannot use galactose as a carbon source. When derepressed
  or overexpressed, gal1 is strongly galactose-induced and, together with gal7 and gal10, allows growth
  on galactose. It localises to the cytosol.
