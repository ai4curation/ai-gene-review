- term:
    id: GO:0033499
    label: D-galactose catabolic process, Leloir pathway
  evidence_type: EXP
  original_reference_id: PMID:21075050
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: 'Matsuzawa et al. 2011: gal1 (SPBPB2B2.13) is highly expressed and galactose-induced in
      the galactose-assimilating mutant FG2-8, and wild-type cells carrying gal7, gal10 and gal1 on a vector
      grow on galactose. Supports gal1 acting in the Leloir pathway when the silenced cluster is expressed.'
    reason: >-
      Only the abstract is cached; the PomBase curator read the full text, and the
      abstract supports the claim. The abstract's list "gal7+, SPBPB2B2.13, gal10+ and
      gal1+" names gal1 twice (SPBPB2B2.13 is gal1's own ORF name, as the earlier
      sentence of the abstract states); this looks like a wording slip and does not
      affect the conclusion. The function is conditional: the cluster is silenced in
      wild-type cells, which is a regulatory state rather than a loss of the pathway.
      Same action as the S. cerevisiae GAL1 Leloir pathway rows.
    supported_by:
    - reference_id: PMID:21075050
      supporting_text: expression of gal7+, SPBPB2B2.13, gal10+ and gal1+ genes increased in the wild-type
        strain when carried on a vector, and these transformants grew on galactose medium
    - reference_id: PMID:21075050
      supporting_text: were highly expressed and dramatically induced by addition of galactose
