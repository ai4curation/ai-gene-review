suggested_experiments:
- hypothesis: S. pombe gal1 is a functional ATP-dependent galactokinase.
  description: Purify recombinant gal1 and measure galactose 1-phosphate formation from alpha-D-galactose
    and ATP; in parallel test whether a gal1 deletion abolishes galactose growth of the derepressed FG2-8
    strain or of wild-type cells overexpressing gal7 and gal10.
  experiment_type: enzyme assay / genetic complementation
suggested_questions:
- question: Does S. pombe gal1 have any role in galactose sensing or gal-gene induction, given that S.
    pombe lacks the GAL4/GAL80/GAL3 regulatory system that gives S. cerevisiae Gal1 its inducer function?
