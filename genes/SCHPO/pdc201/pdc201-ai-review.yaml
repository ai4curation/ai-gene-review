gene_symbol: pdc201
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Pdc201 is a cytosolic pyruvate decarboxylase of Schizosaccharomyces pombe that converts pyruvate
  to acetaldehyde and carbon dioxide using thiamine diphosphate and magnesium. Its transcript and protein
  increase in stationary phase under control of Phx1, alongside increased total pyruvate decarboxylase
  activity and ethanol production. Deletion reduces stationary-phase viability, whereas overexpression
  improves long-term survival. The genetic and expression evidence links this isozyme to the stationary-phase
  fermentative response.
