core_functions:
- description: Thiamine diphosphate/Mg2+-dependent pyruvate decarboxylation in the cytosol, supplying
    acetaldehyde for fermentation. Strong stationary-phase induction and genetic survival phenotypes support
    a contribution during quiescence; the published activity measurements are for total cellular PDC.
  molecular_function:
    id: GO:0004737
    label: pyruvate decarboxylase activity
  directly_involved_in:
