  - reference_id: PMID:25102102
    supporting_text: Expression of pdc201+ and pdc202+ genes increased markedly during stationary phase,
      by about 500-fold and 50-fold, respectively.
  - reference_id: PMID:25102102
    supporting_text: PDC enzyme activity increased during stationary phase in wild type, but decreased
      in the mutant
  - reference_id: PMID:25102102
    supporting_text: the Δpdc201 and Δpdc202 mutations reduced cell viability in the stationary phase
suggested_questions:
- question: Is the survival benefit of pdc201 due to lower respiratory ROS, to NAD+ regeneration, or to
    acetaldehyde/ethanol production itself?
- question: Should chronological-lifespan phenotypes of pdc201 be captured as a regulatory/process annotation,
    or are they downstream consequences of its metabolic activity?
suggested_experiments:
- description: Measure pyruvate decarboxylase activity of purified pdc201 and of extracts from pdc201
    null stationary cells to quantify its share of stationary-phase activity.
- description: Test whether a catalytically inactive pdc201 (TPP-binding glutamate mutant) still extends
    chronological lifespan when overexpressed.
