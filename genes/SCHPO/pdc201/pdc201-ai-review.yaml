  label: Schizosaccharomyces pombe 972h-
description: pdc201 (SPAC3G9.11c) encodes a stationary-phase pyruvate decarboxylase (EC 4.1.1.1), a thiamine
  diphosphate- and Mg2+-dependent cytosolic enzyme that converts pyruvate to acetaldehyde and CO2. It
  groups phylogenetically with S. cerevisiae PDC1/PDC5/PDC6. Its transcript rises about 500-fold on entry
  into stationary phase, and also in stress and meiosis, under control of the homeobox transcription factor
  Phx1. Pdc201 protein increases from about 7,000 to 52,000 copies per cell in quiescence. Together with
  pdc202 it accounts for the Phx1-dependent rise in pyruvate decarboxylase activity in stationary cells,
  which diverts pyruvate from mitochondrial respiration to fermentation. Deletion of pdc201 lowers, and
  overexpression raises, long-term (chronological) viability.
