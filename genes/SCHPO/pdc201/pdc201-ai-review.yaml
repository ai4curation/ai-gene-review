core_functions:
- description: Thiamine diphosphate/Mg2+-dependent decarboxylation of pyruvate to acetaldehyde and CO2
    in the cytosol; the main Phx1-induced stationary-phase isozyme, which shifts pyruvate from respiration
    to fermentation. PomBase models it under generic pyruvate fermentation.
