- id: PMID:25102102
  title: A metabolic strategy to enhance long-term survival by Phx1 through stationary phase-specific
    pyruvate decarboxylases in fission yeast.
  findings:
  - statement: Defines all four PDC paralogs and distinguishes the abundant growth-phase Pdc101, weakly
      expressed Pdc102 and Phx1-induced stationary-phase Pdc201/Pdc202. Total PDC activity, ethanol production
      and survival experiments support a fermentative adaptation, not individual purified-isozyme kinetics.
    supporting_text: PDC enzyme activity increased during stationary phase in wild type, but decreased
      in the mutant.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct physiological study; isozyme-specific claims are bounded to expression and genetics.
      Full text cached and consulted.
