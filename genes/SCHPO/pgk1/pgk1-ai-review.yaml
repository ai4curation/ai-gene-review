description: 'Pgk1 (SPBC14F5.04c) is the phosphoglycerate kinase of the fission yeast Schizosaccharomyces
  pombe, a 414-residue monomeric (by similarity) enzyme encoded by a single gene. It catalyses the reversible,
  Mg2+-dependent transfer of the 1-phosphoryl group of 1,3-bisphosphoglycerate to ADP, producing 3-phosphoglycerate
  and ATP: the first ATP-generating step of glycolysis and, in reverse, a gluconeogenic step. The protein
  is cytosolic, with some nuclear signal in genome-wide localisation; a mitochondria-associated pool and
  a role in restraining mitochondrial acetyl-CoA synthesis are documented for the S. cerevisiae orthologue
  but have not been examined in S. pombe.'
