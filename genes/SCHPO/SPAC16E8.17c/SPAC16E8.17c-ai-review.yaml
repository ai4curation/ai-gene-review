- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000122012
  - RGD:619821
  - UniProtKB:O19069
  - UniProtKB:P0AGE9
  - UniProtKB:P53597
  - UniProtKB:Q51567
  - dictyBase:DDB_G0289325
  review:
    summary: PAINT inference of GDP-forming activity at an alpha-subunit node shared by ADP- and GDP-forming enzymes;
      the S. pombe enzyme is predicted to be the ADP-forming type (single A-type beta subunit; not assayed).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The alpha subunit does not set nucleotide specificity: by family rule (HAMAP MF_03222) it binds CoA and phosphate while nucleotide specificity is provided by the beta subunit, and the PomBase TCA-cycle GO-CAM (gomodel:665912ed00000015) models both S. pombe subunits with succinate-CoA ligase (ADP-forming) activity. That is a curator''s choice of term resting on the PAINT annotation, not an assay. The PTN000122012 node sits on the alpha subunit, which in animals partners both ATP- and GTP-specific beta subunits, so the GDP-forming label rides down to alpha subunits whose only partner is an A-type beta subunit (S. pombe has a single beta subunit, SPCC1620.08). Changed from KEEP_AS_NON_CORE, because the review argues the activity does not apply to the S. pombe enzyme. Re-examined with the family trees (2026-11-11, revised 2026-11-12): SPCC1620.08 falls in the A-type (SUCLA2) lineage of the beta subunit with S. cerevisiae Lsc2, and S. pombe, like the other fungal genomes under the alpha-subunit node PTN000874203 in the PANTHER tree, has no G-type (SUCLG2) beta gene, so the term should stop at that node. The absence is not kingdom-wide: early-diverging fungi (Mortierellomycota, Basidiobolus, Rozella) keep a SUCLG2-type gene. Within Dikarya one Taphrinomycotina species, Saitoella complicata, also has a Gln20 SUCLG2-type entry (A0A0E9NQG5); it groups with the Mortierellomycota genes only weakly, so vertical retention, transfer and contamination are not distinguished and its origin is unresolved. S. pombe itself has one beta gene, of the A type, so this does not change the reading for S. pombe. The action stays short of REMOVE because the S. pombe enzyme has not been assayed and Pro at position 20 of a beta subunit does not exclude GTP use; the S. cerevisiae ortholog Lsc1, whose enzyme used ATP but not GTP when assayed, removes the same row.'
    supported_by:
    - reference_id: file:SCHPO/SPAC16E8.17c/SPAC16E8.17c-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The alpha subunit of the enzyme binds the substrates coenzyme A and phosphate, while succinate binding and nucleotide specificity is provided by the beta subunit.
    - reference_id: file:SCHPO/SPAC16E8.17c/SPAC16E8.17c-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=succinate + ATP + CoA = succinyl-CoA + ADP + phosphate'
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: Yeast LSC2 and S. pombe SPCC1620.08 both fall in the SUCLA2 (A-type) daughter clade, not in the SUCLG2 (G-type) clade.
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: S. cerevisiae and S. pombe each encode one beta subunit, of the A type, so their alpha subunits have no SUCLG2-type partner.
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: The fungal alpha-subunit clade is node PTN000874203 (21 leaves), on the path from the root to LSC1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
