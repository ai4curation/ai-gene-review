  review:
    summary: Succinyl-CoA metabolism; the direct process of the reaction the enzyme catalyses.
    action: ACCEPT
    reason: 'True by family rule (HAMAP MF_03222): the enzyme interconverts succinyl-CoA and succinate, the reaction is reversible, and the term names the direct process of the reaction. It is not an ancestor of the TCA cycle term, and the gene carries no more specific succinyl-CoA process term. Changed from KEEP_AS_NON_CORE so that the term has the same action on every reviewed subunit of the enzyme, including the S. cerevisiae ortholog Lsc1, the source of this ISS.'
