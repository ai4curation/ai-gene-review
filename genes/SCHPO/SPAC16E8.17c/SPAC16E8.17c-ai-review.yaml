  - UniProtKB:O19069
  - UniProtKB:P0AGE9
  - UniProtKB:P53597
  - UniProtKB:Q51567
  - dictyBase:DDB_G0289325
  review:
    summary: PAINT inference of GDP-forming activity at an alpha-subunit node shared by ADP- and GDP-forming enzymes; the S. pombe enzyme is the ADP-forming type.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The alpha subunit does not set nucleotide specificity: by family rule (HAMAP MF_03222) it binds CoA and phosphate while nucleotide specificity is provided by the beta subunit, and the S. pombe enzyme is annotated with the ATP/ADP reaction. The PTN000122012 node sits on the alpha subunit, which in animals partners both ATP- and GTP-specific beta subunits, so the GDP-forming label rides down to fungal alpha subunits whose only partner (S. pombe has a single beta subunit, SPCC1620.08, of the ADP-forming type) is ADP-specific. Changed from KEEP_AS_NON_CORE, because the review argues the activity does not apply to the S. pombe enzyme.'
    supported_by:
    - reference_id: file:SCHPO/SPAC16E8.17c/SPAC16E8.17c-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The alpha subunit of the enzyme binds the substrates coenzyme A and phosphate, while succinate binding and nucleotide specificity is provided by the beta subunit.
