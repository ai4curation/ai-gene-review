  label: Schizosaccharomyces pombe 972h-
description: Alpha subunit of mitochondrial succinyl-CoA synthetase (ADP-forming; EC 6.2.1.5), the alpha-beta
  heterodimer that converts succinyl-CoA to succinate with substrate-level ATP formation in the TCA cycle. The
  S. pombe enzyme has not been characterised biochemically; its role is inferred from the S. cerevisiae Lsc1/Lsc2
  enzyme. The protein localises to mitochondria.
