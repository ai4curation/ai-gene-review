description: SPAC23A1.05 (UniProt O42843) encodes a small ER membrane protein assigned, by similarity
  to S. cerevisiae Tsc3 and animal ssSPT, as the small activating subunit of serine palmitoyltransferase,
  which stimulates the Lcb1-Lcb2 heterodimer. It is in the ER in a genome-wide screen.
