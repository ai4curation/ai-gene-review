  review:
    summary: 'Transfer from S. cerevisiae Tsc3: small subunit that activates SPT.'
    action: ACCEPT
    reason: 'Evidence is family membership only: the protein matches the serine palmitoyltransferase small subunit-like family (InterPro IPR024512, Pfam PF11779 SPT_ssu-like), whose characterised members (animal ssSPT; the functionally equivalent S. cerevisiae Tsc3 used as the ISO source) stimulate the Lcb1-Lcb2 SPT heterodimer. The record has no FUNCTION comment and the S. pombe protein has not been assayed; accepted on curator judgement of orthology plus family classification.'
    supported_by:
    - reference_id: file:SCHPO/SPAC23A1.05/SPAC23A1.05-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR024512; Ser_palmitoyltrfase_ssu-like.'
