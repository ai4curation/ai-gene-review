  label: Schizosaccharomyces pombe 972h-
description: SPAC1296.01c (UniProt Q09770) is one of two fission yeast phosphoacetylglucosamine mutases
  (AGM1/PCM1 family, EC 5.4.2.3), the other being SPAC13C5.05c. It interconverts N-acetylglucosamine 6-phosphate
  and N-acetylglucosamine 1-phosphate, the third step of the hexosamine pathway, which supplies UDP-GlcNAc
  for N-glycan and GPI-anchor synthesis and spore-wall chitin. The two paralogs are very similar, and
  how they divide the work is unknown. Function is assigned by orthology to S. cerevisiae PCM1; a genome-wide
  screen places the protein in the cytosol and nucleus.
