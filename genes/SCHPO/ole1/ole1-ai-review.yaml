suggested_questions:
- question: Does binding of Ole1 to the inner nuclear membrane protein Lem2 regulate local unsaturated lipid production
    for nuclear envelope integrity in S. pombe?
suggested_experiments:
- description: Measure fatty acid desaturation (C16:1/C18:1 content) in ole1 shut-off strains and test whether lem2
    deletion alters Ole1 activity or perinuclear localization.
