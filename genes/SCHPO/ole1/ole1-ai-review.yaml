  label: Schizosaccharomyces pombe 972h-
description: ole1 (SPCC1281.06c) encodes the delta-9 acyl-CoA desaturase (stearoyl-CoA desaturase, EC 1.14.19.1)
  of fission yeast, the orthologue of S. cerevisiae OLE1 and animal SCD. It is a multi-pass integral membrane protein
  of the endoplasmic reticulum with the conserved histidine boxes that bind a di-iron centre and a C-terminal fused
  cytochrome b5 domain that delivers electrons. It uses O2 to introduce a cis double bond at the delta-9 position
  of saturated acyl-CoAs such as palmitoyl- and stearoyl-CoA, generating the monounsaturated fatty acids of membrane
  phospholipids and storage lipids. The protein is distributed through the ER, including cortical and perinuclear
  ER, and associates with the inner nuclear membrane protein Lem2. Its catalytic activity is inferred from homology
  rather than measured for the S. pombe enzyme.
