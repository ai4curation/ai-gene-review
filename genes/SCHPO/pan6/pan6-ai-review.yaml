  label: Schizosaccharomyces pombe 972h-
description: Pantoate--beta-alanine ligase (pantothenate synthetase, PanC; EC 6.3.2.1) of fission yeast.
  It condenses (R)-pantoate with beta-alanine in an ATP-dependent reaction to form (R)-pantothenate (vitamin
  B5), the last step of de novo pantothenate synthesis. pan6 is required for the pantothenate-independent
  growth of S. pombe when uptake through the Liz1 transporter is lost, and for the ability of uracil or
  ureidopropionate (beta-alanine precursors from pyrimidine degradation) to substitute for pantothenate.
  The protein is cytosolic.
