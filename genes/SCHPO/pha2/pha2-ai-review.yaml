  - UniProtKB:P0A9J8
  - UniProtKB:P9WIC3
  - UniProtKB:Q6Z3Y3
  review:
    summary: PAINT inference from characterised prephenate dehydratases (S. cerevisiae PHA2); sound.
    action: ACCEPT
    reason: The protein carries the prephenate dehydratase (PDT) domain (Pfam PF00800, PROSITE PS51171), and UniProt assigns the reaction from the PROSITE rule; the phenylalanine auxotrophy of pha2 mutants (PMID:17622533) is consistent with loss of this step. No in vitro assay of S. pombe Pha2 exists; the experimental basis of the IBA is the characterised orthologs (e.g. S. cerevisiae PHA2).
    supported_by:
    - reference_id: file:SCHPO/pha2/pha2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=prephenate + H(+) = 3-phenylpyruvate + CO2 + H2O;
    - reference_id: file:SCHPO/pha2/pha2-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF00800; PDT; 1.
    - reference_id: PMID:17622533
      supporting_text: asn1 (+), cys2 (+) and pha2 (+) were required for biosynthesis of asparagine, cysteine and phenylalanine, respectively.
