taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pha2 (SPBC30D10.16; UniProt O14361) encodes prephenate dehydratase (EC 4.2.1.51), which converts
  prephenate to phenylpyruvate, the committed step of phenylalanine biosynthesis; a transamination then
  gives phenylalanine. pha2 mutants isolated in a genetic screen are phenylalanine auxotrophs and are
  used as markers. The enzyme is cytosolic in a genome-wide screen.
