- term:
    id: GO:0016624
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, disulfide as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001017
  review:
    summary: Generic InterPro-derived parent of the specific pyruvate dehydrogenase (acetyl-transferring)
      activity, which is already annotated.
    action: MODIFY
    reason: Correct but too general. pda1 carries the E1 dehydrogenase domain (InterPro IPR001017, behind
      this row) and is in the PDH E1 alpha subfamily (NCBIfam TIGR03182); UniProt curates the E1 reaction
      (EC 1.2.4.1), the reductive acetylation of the lipoyl-lysine disulfide of E2 by pyruvate. The specific
      descendant GO:0004739, which the gene already carries, is the supported term. Family and by-similarity
      evidence, not an S. pombe enzyme assay.
    proposed_replacement_terms:
    - id: GO:0004739
      label: pyruvate dehydrogenase (acetyl-transferring) activity
    supported_by:
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=N(6)-[(R)-lipoyl]-L-lysyl-[protein] + pyruvate + H(+) = N(6)-[(R)-S(8)-acetyldihydrolipoyl]-L-lysyl-[protein]
        + CO2
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: TIGR03182; PDH_E1_alph_y
