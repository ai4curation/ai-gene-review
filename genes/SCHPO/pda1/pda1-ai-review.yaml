  label: Schizosaccharomyces pombe 972h-
description: pda1 (SPAC26F1.03; UniProt Q10489) encodes the E1 alpha subunit of the mitochondrial pyruvate
  dehydrogenase complex. With pdb1 (E1 beta), it forms the thiamine diphosphate-dependent pyruvate decarboxylase/dehydrogenase
  (EC 1.2.4.1) that makes acetyl-CoA from pyruvate, linking glycolysis to the TCA cycle. Function is assigned
  by orthology; it is mitochondrial in a genome-wide screen.
