  - UniProtKB:P29804
  - UniProtKB:Q5B2R8
  review:
    summary: E1 alpha subunit; contributes to PDH E1 activity (PAINT/EC).
    action: ACCEPT
    reason: 'No experimental data on S. pombe pda1 itself. Support is the curated UniProt function, reaction (EC 1.2.4.1) and thiamine diphosphate cofactor (cofactor by similarity to human PDHA1, P08559), plus membership of the NCBIfam TIGR03182 pyruvate dehydrogenase E1 alpha subfamily, whose members are characterised E1 alpha subunits (S. cerevisiae PDA1, rat/human PDHA1 among the PAINT donors). E1 activity is carried by the alpha2beta2 tetramer with pdb1, so pda1 contributes to rather than alone enables the activity.'
    supported_by:
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'The pyruvate dehydrogenase complex catalyzes the overall conversion of pyruvate to acetyl-CoA and CO(2)'
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Name=thiamine diphosphate; Xref=ChEBI:CHEBI:58937;'
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'TIGR03182; PDH_E1_alph_y'
    - reference_id: file:SCHPO/pda1/pda1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Tetramer of 2 alpha and 2 beta subunits.'
