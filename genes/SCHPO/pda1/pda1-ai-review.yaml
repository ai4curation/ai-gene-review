  review:
    summary: Matrix location of this TCA enzyme (inference or mapping); consistent.
    action: ACCEPT
    reason: 'The UniProt location is by similarity (ECO:0000250), and the record has a predicted mitochondrial transit peptide (FT TRANSIT, ECO:0000255). A matrix location is also what the E1 function requires, since the PDH complex acts in the matrix. The genome-wide YFP screen (PMID:16823372, a separate HDA row) resolves only mitochondrion, not the sub-compartment.'
