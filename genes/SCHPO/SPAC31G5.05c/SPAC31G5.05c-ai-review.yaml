- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000202667
  - UniProtKB:P0AG07
  - UniProtKB:P32719
  - UniProtKB:Q96AT9
  review:
    summary: 'Divalent metal cofactor binding; subsidiary to the epimerase activity.'
    action: KEEP_AS_NON_CORE
    reason: 'By similarity only: the curated COFACTOR comment (by similarity to human RPE, Q96AT9) says one
      divalent cation is bound per subunit, active with Co, Fe, Mn or Zn, and the metal-binding residues are
      assigned by similarity to S. cerevisiae Rpe1 (P32719). Because several metals serve, the generic metal
      ion binding term is as precise as warranted; kept as non-core cofactor binding.'
    supported_by:
    - reference_id: file:SCHPO/SPAC31G5.05c/SPAC31G5.05c-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Binds 1 divalent metal cation per subunit. Active with Co(2+), Fe(2+), Mn(2+) and Zn(2+).'
