  label: Schizosaccharomyces pombe 972h-
description: SPAC31G5.05c (SPAC31G5.05c; UniProt O14105) encodes ribulose-5-phosphate 3-epimerase (EC
  5.1.3.1), which interconverts ribulose 5-phosphate and xylulose 5-phosphate, the transketolase donor.
  By orthology it works in the non-oxidative pentose phosphate pathway, which interconverts pentose phosphates
  and glycolytic intermediates. Its activity is induced by delta-gluconolactone and repressed by glucose.
  It is cytosolic in a genome-wide screen.
