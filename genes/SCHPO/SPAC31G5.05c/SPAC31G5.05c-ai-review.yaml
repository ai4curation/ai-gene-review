- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000202667
  - UniProtKB:P0AG07
  - UniProtKB:P32719
  - UniProtKB:Q96AT9
  review:
    summary: 'Carbohydrate metabolism, true in a broad sense: the enzyme interconverts the phosphorylated
      pentoses of the pentose phosphate pathway. GO places the pentose-phosphate shunt terms (GO:0006098,
      GO:0009051, GO:0009052) under neither glucose nor carbohydrate metabolic process, so this
      broad term has no more specific descendant in the pentose-phosphate branch and is kept as
      non-core context.'
    action: KEEP_AS_NON_CORE
    reason: 'Kept as non-core. The evidence is by similarity to human RPE (Q96AT9; curated FUNCTION
      and PATHWAY comments) and family membership (HAMAP MF_02227 RPE); the S. pombe EXP rows
      (PMID:9872416) cover the specific activity and non-oxidative pentose phosphate branch. GO:0009052
      is not an is_a/part_of descendant of carbohydrate metabolic process in the current ontology
      (checked with oaklib: its is_a/part_of closure reaches glucose 6-phosphate metabolic process
      and carbohydrate derivative metabolic process, not GO:0005975), so this term is not entailed
      elsewhere and is kept rather than marked TOO_GENERAL; the precise process is the accepted
      non-oxidative branch row.'
    supported_by:
    - reference_id: file:SCHPO/SPAC31G5.05c/SPAC31G5.05c-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes the reversible epimerization of D-ribulose 5-phosphate to D-xylulose 5-phosphate.'
    - reference_id: file:SCHPO/SPAC31G5.05c/SPAC31G5.05c-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Carbohydrate degradation; pentose phosphate pathway;'
    - reference_id: file:SCHPO/SPAC31G5.05c/SPAC31G5.05c-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'HAMAP; MF_02227; RPE; 1.'
