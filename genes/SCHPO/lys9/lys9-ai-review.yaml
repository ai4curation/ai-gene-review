id: O59711
gene_symbol: lys9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  lys9 encodes the fission-yeast saccharopine dehydrogenase
  [NADP(+), L-glutamate-forming], also called saccharopine reductase, in the
  cytosolic fungal alpha-aminoadipate pathway for L-lysine biosynthesis. The
  enzyme condenses L-alpha-aminoadipate semialdehyde with L-glutamate and uses
  NADPH to form L-saccharopine, the penultimate fungal-route step that is
  followed by Lys3-mediated saccharopine cleavage to L-lysine.
existing_annotations:
- term:
    id: GO:0004753
    label: saccharopine dehydrogenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G33150
  - FB:FBgn0286198
  - MGI:MGI:1353573
  - PANTHER:PTN000123605
  - SGD:S000001473
  - SGD:S000005333
  - UniProtKB:Q9UDR5
  review:
    summary: >-
      PTN000123605 correctly infers parent saccharopine dehydrogenase activity
      for the mixed LYS1/LYS9/AASS family, but lys9 has the exact NADP(+),
      L-glutamate-forming activity.
    action: MODIFY
    reason: >-
      The PTN000123605 activity node is a sound broad saccharopine
      dehydrogenase placement seeded by both the NAD(+), L-lysine-forming LYS1
      branch and the NADP(+), L-glutamate-forming LYS9 branch. O59711 is the
      S. pombe SF22 lys9 member with the GOA-supported exact GO:0004755
      reaction, so the parent GO:0004753 row is true but should be narrowed to
      the exact saccharopine reductase activity that this review also accepts.
    proposed_replacement_terms:
    - id: GO:0004755
      label: saccharopine dehydrogenase (NADP+, L-glutamate-forming) activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000123605
        source_label: PANTHER:PTN000123605
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The eukaryotic node supports generic saccharopine dehydrogenase
          activity, but lys9 is in the NADP(+), L-glutamate-forming SF22 branch
          and has a more precise accepted activity term.
    additional_reference_ids:
    - file:interpro/panther/PTHR11133/PTHR11133-paint.tsv
    - file:interpro/panther/PTHR11133/PTHR11133-entries.csv
    - file:SCHPO/lys9/lys9-uniprot.txt
    supported_by:
