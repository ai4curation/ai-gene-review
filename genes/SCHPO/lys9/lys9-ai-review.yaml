        AGI_LocusCode:AT4G33150|FB:FBgn0286198|MGI:MGI:1353573|SGD:S000001473|SGD:S000005333|UniProtKB:P43065|UniProtKB:Q9UDR5\t\
        taxon:2759\t20260828"
    - reference_id: file:interpro/panther/PTHR11133/PTHR11133-entries.csv
      supporting_text: >-
        O59711,"Saccharopine dehydrogenase [NADP(+), L-glutamate-forming]",protein,284812,Schizosaccharomyces pombe (strain 972 / ATCC 24843),Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast),lys9,450,PTHR11133:SF22,"ALPHA-AMINOADIPIC SEMIALDEHYDE SYNTHASE, MITOCHONDRIAL",True
