  label: Schizosaccharomyces pombe 972h-
description: lys9 (SPBC3B8.03; UniProt O59711), the ortholog of S. cerevisiae LYS9, encodes saccharopine
  dehydrogenase (NADP+, L-glutamate-forming; saccharopine reductase; EC 1.5.1.10). It condenses alpha-aminoadipate
  semialdehyde with glutamate and reduces the product to saccharopine, the penultimate step of the alpha-aminoadipate
  pathway. Function is assigned by orthology; it is cytosolic in a genome-wide screen.
