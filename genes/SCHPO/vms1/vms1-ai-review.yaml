- term:
    id: GO:0036503
    label: ERAD pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The inherited function is real but the term is wrong. The PTHR16036 IBD
      behind this IBA (node PTN000411325) is placed at the eukaryotic root and seeded
      only by S. cerevisiae VMS1, whose ERAD evidence is a modest, modulatory,
      post-ubiquitination effect reported before the family's catalytic activity was
      known. The conserved, mechanistically defined family function - cleavage of
      polypeptidyl-tRNA to rescue stalled cytosolic ribosomes - is not propagated by
      PAINT at all. Replace ERAD with rescue of stalled cytosolic ribosome.
    action: MODIFY
    reason: ERAD and ribosome-associated quality control are distinct pathways. The
      S. cerevisiae seed annotation shows Vms1p acting in parallel with the canonical
      Cdc48 ERAD cofactors and only modestly slowing substrate degradation, which is
      an accessory budding-yeast role rather than the ancestral eukaryotic function
      asserted at this node. The activity that is conserved from budding yeast to
      human, and for which fission-yeast vms1 retains the catalytic glutamine, is
      release of nascent chains from stalled 60S complexes. MODIFY rather than REMOVE
      because inheritance from the family node is genuine and vms1 would otherwise be
      left with no biological-process annotation at all.
    proposed_replacement_terms:
    - id: GO:0072344
      label: rescue of stalled cytosolic ribosome
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
