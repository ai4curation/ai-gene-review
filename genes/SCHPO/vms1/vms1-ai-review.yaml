core_functions:
- description: Inferred by orthology, not demonstrated in fission yeast. vms1 is
    predicted to act in the cytosol on 60S ribosomal subunits of stalled
    ribosome-nascent-chain complexes, cleaving the tRNA moiety of the polypeptidyl-tRNA
    to release the incomplete nascent chain for degradation and to generate a tRNA
    fragment that can be repaired and recycled. The inference rests on the conserved
    VLRF1 domain and the retained catalytic glutamine (Q249), together with the
    experimentally established activity of the S. cerevisiae and human orthologs; no
    fission-yeast biochemistry or genetics for vms1 has been published.
