id: O74977
gene_symbol: vms1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: vms1 is the fission-yeast member of the Vms1/ANKZF1 family, a clade of
  eRF1 homologs (VLRF1) that act in ribosome-associated quality control. In the
  characterised orthologs, the protein binds the 60S ribosomal subunit of stalled
  ribosome-nascent-chain complexes through its VLRF1 domain and cleaves the
  polypeptidyl-tRNA, severing the terminal 3'-CCA nucleotides of the tRNA so that the
  incomplete nascent chain is released for proteasomal degradation and the tRNA
  fragment can be repaired and recycled. Release also limits C-terminal Ala/Thr
  extension (CAT-tailing) of stalled mitochondrial precursor proteins, linking the
  activity to mitochondrial proteome integrity. The protein is a Cdc48/p97 cofactor
  and, in budding yeast, is a subunit of the Cdc48-Npl4-Vms1 complex that acts in
  stress-responsive mitochondria-associated degradation. Fission-yeast vms1 is
  cytoplasmic and cytosolic and retains the conserved catalytic glutamine of the
  family, but no fission-yeast-specific biochemical or genetic characterisation of its
  function has been published; its assignments therefore rest on orthology.
