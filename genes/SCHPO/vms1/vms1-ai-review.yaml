    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: The ND (no data) placeholder understates what is known. vms1 carries an
      intact VLRF1 domain and the catalytic glutamine (Q249) whose equivalent in human
      ANKZF1 (Q246) is required for polypeptidyl-tRNA cleavage, so an orthology-based
      tRNA nuclease molecular function is better than asserting no data.
    action: MODIFY
    reason: ND should be replaced once a defensible molecular function can be inferred.
      Own alignment work reproduces the UniProt ACT_SITE assignments for both yeasts
      and shows the fission-yeast catalytic context (RKQGGSQ) is identical to the
      budding-yeast one, so vms1 is not a degenerate pseudoenzyme. The replacement
      should be made at ISS strength (from UniProtKB:Q04311 or UniProtKB:Q9H8Y5), not
      as an experimental claim, since no fission-yeast biochemistry exists. This is
      the same molecular-function term this project proposes for the human ortholog
      ANKZF1, keeping the two reviews consistent.
