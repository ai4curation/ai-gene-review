  proposed_definition: Catalysis of the endonucleolytic removal of the terminal 3'-CCA
    nucleotides from the tRNA moiety of a polypeptidyl-tRNA bound in the P site of a
    60S ribosomal subunit, releasing the nascent polypeptide still esterified to a
    truncated tRNA and leaving a tRNA fragment that requires CCA re-addition before it
    can be re-aminoacylated.
  justification: The Vms1/ANKZF1 reaction is more specific than GO:0004549
    tRNA-specific ribonuclease activity, and it is not a peptidyl-tRNA hydrolase
    reaction (GO:0004045) because the peptidyl-tRNA ester bond is not broken. GO
    currently has no term for this chemistry, so the family can only be annotated with
    a parent term that loses the mechanistic detail.
  proposed_parent:
    id: GO:0004549
    label: tRNA-specific ribonuclease activity
  supported_by:
  - reference_id: PMID:31011209
    supporting_text: polypeptidyl-tRNAs on RQC complexes by precisely cleaving off
suggested_questions:
- question: Does fission-yeast vms1 actually cleave polypeptidyl-tRNA on 60S
    ribosome-nascent-chain complexes, or has the fission-yeast lineage repurposed the
    conserved catalytic glutamine for something else?
- question: Should the PTHR16036 IBD at PTN000411325 be re-placed rather than re-termed,
    that is, should an RQC IBD be added at the eukaryotic root where both human and
    budding-yeast experimental evidence sits, and the ERAD IBD restricted or dropped
    given that its only seed is a modulatory budding-yeast result?
- question: Is the budding-yeast ERAD contribution of Vms1p a genuinely separate
    pathway role, or a downstream consequence of Cdc48 cofactor competition that would
    be better captured without an ERAD process term?
- question: Does fission yeast perform CAT-tailing, and if so does vms1 antagonise it
    as the budding-yeast ortholog does?
suggested_experiments:
- description: Reconstitute fission-yeast 60S ribosome-nascent-chain complexes and test
    purified vms1 and a vms1-Q249L point mutant for cleavage of the P-site
    polypeptidyl-tRNA, resolving products to determine whether the 3'-CCA is removed.
  hypothesis: Fission-yeast vms1 is an active tRNA endonuclease that removes the 3'-CCA
    from polypeptidyl-tRNA on stalled 60S subunits, and this depends on Q249.
- description: Compare accumulation of stalled nascent chains and of aggregated
    mitochondrial precursor proteins in wild-type, vms1-delta and vms1-Q249L fission
    yeast under respiratory growth.
  hypothesis: Loss of vms1 catalytic activity, not just of the protein, causes
    accumulation of unreleased nascent chains and mitochondrial proteotoxicity.
- description: Assay degradation of a defined fission-yeast ERAD substrate in
    vms1-delta cells, with and without simultaneous loss of the fission-yeast Ufd1 and
    Npl4 cofactors, to test whether an ERAD contribution exists in this lineage at all.
  hypothesis: Fission-yeast vms1 makes no measurable contribution to ERAD, supporting
    removal rather than retention of an ERAD process term across the family.
