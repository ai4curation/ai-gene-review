- term:
    id: GO:0043541
    label: UDP-N-acetylglucosamine transferase complex
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - SGD:S000000447
  review:
    summary: 'Transferred by orthology from S. cerevisiae Alg7, which forms a multienzyme complex with Alg13 and Alg14; the GO term definition names Alg7p as a member of this complex. Peripheral to the catalytic function.'
    action: KEEP_AS_NON_CORE
    reason: 'By similarity to S. cerevisiae Alg7 (SGD:S000000447): Noffz et al. (PMID:19129246) showed that Alg7, Alg13 and Alg14 form a functional multienzyme complex, and the GO:0043541 definition lists Alg7p as the first-step subunit. The earlier summary called Gpt2 a separate enzyme outside the complex, which contradicts that evidence; it is corrected here. Kept as non-core because complex membership has not been tested in S. pombe and is peripheral to the catalytic function.'
    supported_by:
    - reference_id: PMID:19129246
      supporting_text: Alg7p, Alg13p, and Alg14p glycosyltransferases form a functional multienzyme complex
