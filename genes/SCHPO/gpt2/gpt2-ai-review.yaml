  label: Schizosaccharomyces pombe 972h-
description: gpt2 (gpt; SPBC15D4.04; UniProt P42881) encodes UDP-GlcNAc:dolichyl-phosphate N-acetylglucosamine-1-phosphate
  transferase (L-G1PT; ALG7/DPAGT1 ortholog; EC 2.7.8.15). This polytopic ER membrane enzyme transfers
  GlcNAc-1-P to dolichyl phosphate, the first and tunicamycin-sensitive step of LLO assembly on the cytoplasmic
  face of the ER. The S. pombe gene is functionally conserved with ALG7, and the conserved D252 and N185
  are essential for activity.
