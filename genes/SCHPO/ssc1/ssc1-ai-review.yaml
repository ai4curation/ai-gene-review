id: P22774
gene_symbol: ssc1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  ssc1 encodes the fission-yeast mitochondrial Hsp70 chaperone. The long
  isoform is imported into the mitochondrial matrix, where its ATPase-driven
  substrate cycle forms the core of the PAM motor for TIM23-dependent
  preprotein import, assists post-import folding, and works with Jac1 and Isu
  scaffold proteins during mitochondrial iron-sulfur cluster biogenesis.
alternative_products:
