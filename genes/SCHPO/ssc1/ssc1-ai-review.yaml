  review:
    summary: >-
      The S. pombe mitochondrial Hsp70 is a conserved PAM import-motor
      component.
    action: ACCEPT
    reason: >-
      Retain the PomBase ISO row. The donor is budding-yeast Ssc1, the
      mtHsp70 core of the presequence translocase-associated motor, and S.
      pombe ssc1 encodes its mitochondrial Hsp70 ortholog with matrix import
      and a curated by-similarity PAM-complex statement in UniProt.
    supported_by:
    - reference_id: PMID:14638855
      supporting_text: >-
        Three essential subunits of the motor are known: mitochondrial Hsp70
        (mtHsp70); the peripheral membrane protein Tim44; and the nucleotide
        exchange factor Mge1.
    - reference_id: PMID:1923816
      supporting_text: >-
