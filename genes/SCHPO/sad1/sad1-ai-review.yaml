gene_symbol: sad1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Sad1 is the single SUN (Sad1/UNC-84) domain protein of fission yeast and the founding member
  of the SUN family. It is an essential type II integral protein of the inner nuclear membrane: its nucleoplasmic
  N-terminal region contacts chromatin partners, a single transmembrane segment anchors it, and its C-terminal
  SUN domain projects into the perinuclear space where it binds the KASH proteins Kms1 and Kms2 of the
  outer nuclear membrane, forming LINC (linker of nucleoskeleton and cytoskeleton) complexes. Sad1 concentrates
  beneath the spindle pole body (SPB) throughout the mitotic and meiotic cycles. In vegetative cells it
  anchors the SPB to the nuclear envelope and, through Csi1 and Lem2, tethers the clustered centromeres
  beneath the SPB (Rabl configuration); at mitotic entry it redistributes into a ring around the SPB that
  initiates localized nuclear envelope remodelling and SPB insertion. In meiotic prophase the Bqt1-Bqt2
  complex bridges the telomere protein Rap1 to Sad1, so that the Sad1-Kms1 LINC complex connects the telomere
  bouquet to the SPB and to dynein-driven horsetail nuclear movement, promoting homolog pairing. Sad1-Kms1
  foci also form at persistent DNA double-strand breaks and couple them to microtubules, influencing repair
  pathway choice. An N-terminal histone-binding motif binds H2A-H2B and contributes to peripheral tethering
  of telomeres and the mating-type locus and to heterochromatin silencing.'
