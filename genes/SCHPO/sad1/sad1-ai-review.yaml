core_functions:
- description: 'SUN-KASH LINC anchor: the luminal SUN domain of Sad1 binds the KASH proteins Kms1 (meiosis,
    DNA damage) and Kms2 (mitotic SPB), coupling the inner nuclear membrane to the SPB and cytoplasmic
    microtubules; in meiotic prophase the Sad1-Kms1 complex, bridged to telomeres by Bqt1-Bqt2-Rap1, clusters
    telomeres at the SPB for horsetail movement.'
