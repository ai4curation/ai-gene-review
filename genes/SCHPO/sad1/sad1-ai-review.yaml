suggested_questions:
- question: GO:1990612 Sad1-Kms1 LINC complex is defined by its role in connecting DSBs to the cytoskeleton,
    yet it is an is_a child of GO:0034993 meiotic nuclear membrane microtubule tethering complex. Should
    its definition be broadened to include the meiotic telomere-SPB linkage (where Sad1-Kms1 is best characterized),
    or should it be reparented under GO:0106094 given the DSB role is mitotic (S/G2)?
  experts:
  - GO cellular component editors
  - PomBase curators
- question: Is the Sad1-Kms2 mitotic SPB LINC complex worth a sibling complex term, parallel to GO:1990612,
    given its distinct essential role in SPB anchoring and insertion?
  experts:
  - PomBase curators
suggested_experiments:
- description: Structure of the Sad1 SUN domain in complex with Kms1 and Kms2 KASH peptides, testing for
    the conserved SUN-KASH disulfide and trimeric assembly seen in human SUN2.
  hypothesis: Fungal SUN-KASH binding uses the same trimeric groove architecture as metazoan LINC complexes.
  experiment_type: X-ray crystallography / cryo-EM
