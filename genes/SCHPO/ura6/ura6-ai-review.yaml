  label: Schizosaccharomyces pombe 972h-
description: >-
  ura6 (SPCC1795.05c) is the fission yeast uridylate (UMP/CMP) kinase, a member of the

  adenylate kinase family (UMP-CMP kinase subfamily). It transfers the gamma-phosphate of ATP to UMP

  to form UDP, the obligatory step that converts UMP made by de novo synthesis (ura5/ura4) or by

  salvage (uracil phosphoribosyltransferase, uridine kinase) into the diphosphate that nucleoside

  diphosphate kinase (ndk1) converts to UTP and that ribonucleotide reductase can use toward dUTP/dTTP.

  By homology it prefers UMP and dUMP and can also phosphorylate CMP and dCMP. The protein is

  predominantly cytosolic with a nuclear pool. Its function is inferred from its HAMAP-family membership

  and from the biochemically characterized budding-yeast ortholog Ura6; no direct S. pombe biochemistry

  has been reported.
