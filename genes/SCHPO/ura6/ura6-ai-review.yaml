suggested_questions:
- question: >-
    Does S. pombe ura6 phosphorylate CMP/dCMP at physiologically relevant rates, i.e. is it also the CMP
    kinase of pyrimidine salvage as modelled for the module?
suggested_experiments:
- description: >-
    Assay recombinant ura6 with UMP, dUMP, CMP, dCMP and AMP to define substrate specificity, and test
    complementation of an S. cerevisiae ura6 shuffle strain.
