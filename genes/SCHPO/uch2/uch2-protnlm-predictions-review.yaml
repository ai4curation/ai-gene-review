    summary: Fission-yeast Uch2 is directly characterized as the major deubiquitinating enzyme associated
      with the 26S proteasome, and proteomic work recovers its association with the proteasome. Processing
      ubiquitin conjugates at this complex is a function in ubiquitin-dependent protein turnover even
      though the DUB removes ubiquitin rather than degrading the substrate polypeptide itself. The supported,
      more precise proteasomal protein catabolic process annotation GO:0010498 is already present. Thus
      the general catabolic-process prediction is correct but less precise; weak deletion phenotypes reflect
      redundancy and do not negate pathway participation.
