    summary: Fission-yeast Uch2 is directly characterized as the major deubiquitinating enzyme associated
      with the 26S proteasome, and proteomic work shows it co-purifies the complete proteasome. Processing
      ubiquitin conjugates at this complex is part of proteasome-mediated ubiquitin-dependent protein turnover,
      even though the DUB removes ubiquitin rather than degrading the substrate polypeptide itself. The
      predicted term is not novel; GOA already carries it (InterPro2GO), and the gene review treats it
      as correct but general, refining it to GO:0043161 proteasome-mediated ubiquitin-dependent protein
      catabolic process. GOA also carries the descendant GO:0071629 cytoplasm protein quality control
      by the ubiquitin-proteasome system (IGI, kept as non-core), an is_a descendant of GO:0006511 per
      OLS4. The prediction is therefore correct but less precise than supported annotations; viable deletion
      phenotypes reflect redundancy among proteasomal DUBs and do not negate participation.
