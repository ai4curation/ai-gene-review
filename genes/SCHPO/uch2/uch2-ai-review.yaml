suggested_questions:
- question: Which physiological NEDD8-conjugated proteins, if any, are direct Uch2 substrates, as distinct
    from cleavage of NEDD8 precursors or NEDD8-AMC in vitro?
- question: Does fission-yeast Uch2 share the Lys48-branch-specific debranching activity reported for
    mammalian UCH37/UCHL5, and is it activated by S. pombe Rpn13 as UCH37 is?
suggested_experiments:
- description: Reconstitute purified wild-type and C83A Uch2 with S. pombe Rpn13 and test hydrolysis
    of unbranched and branched K48/K63 ubiquitin chains to establish linkage and branch specificity.
