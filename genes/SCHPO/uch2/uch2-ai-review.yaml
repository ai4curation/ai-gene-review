      of the core proteasomal function rather than a distinct role, and Uch2 itself is nuclear, so it is
      kept as non-core.
- term:
    id: GO:0140492
    label: metal-dependent deubiquitinase activity
  evidence_type: HDA
  original_reference_id: PMID:20838651
  qualifier: enables
  review:
    summary: Uch2 is a UCH-family cysteine protease, not a JAMM metalloprotease; the metal-dependent term
      likely reflects activity of the co-purified proteasome (Rpn11).
    action: MODIFY
    reason: The census paper itself classifies UCH enzymes as cysteine proteases and JAMM enzymes (Rpn11)
      as metalloproteases. Uch2 has the C12 Cys-His catalytic site and no JAMM/MPN motif, and its pulldowns
      contain the whole proteasome including Rpn11, so a metal-dependent activity of the purified material
      cannot be attributed to Uch2. The supported molecular function is cysteine-type deubiquitinase activity.
    supported_by:
    - *id003
    - *id002
    - *id008
    proposed_replacement_terms:
    - id: GO:0004843
      label: cysteine-type deubiquitinase activity
