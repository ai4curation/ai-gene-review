taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Uch2 is the fission-yeast UCH37/UCHL5-family cysteine deubiquitinase associated with the
  26S proteasome. Its UCH catalytic domain processes ubiquitin conjugates, while a C-terminal extension
  promotes proteasome association and concentration at the nuclear periphery. It contributes to proteasome-associated
  ubiquitin-chain processing, with functional redundancy explaining viability of deletion mutants. Purified
  Uch2 also cleaves the artificial NEDD8-AMC substrate, although its physiological contribution to deconjugating
  NEDD8 from proteins remains less well established.
