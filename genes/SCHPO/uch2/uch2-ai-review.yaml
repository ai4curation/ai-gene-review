  review:
    summary: The cited paper shows that purified GST-Uch2 cleaves the model substrate NEDD8-AMC, but deletion
      of uch2 (alone or with uch1) has no effect on cullin neddylation in vivo.
    action: MARK_AS_OVER_ANNOTATED
    reason: Protein deneddylation is removal of NEDD8 from a conjugated target protein. The paper (full
      text read) demonstrates only cleavage of the fluorogenic NEDD8-AMC amide in vitro, and explicitly
      reports that deleting uch2 and uch1 together does not change Cul1 neddylation. No Uch2-dependent
      deconjugation of a NEDD8-protein conjugate is shown, and the authors interpret Uch2 as at most a
      minor contributor of NEDD8 precursor-processing activity. The in vitro activity is captured on the
      molecular-function row; participation in the cellular deneddylation process is not supported.
    supported_by:
