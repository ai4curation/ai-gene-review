    summary: The full paper directly demonstrates cleavage of NEDD8-AMC by purified GST-Uch2 and tests
      NEDD8-precursor processing genetically.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full paper directly demonstrates cleavage of NEDD8-AMC by purified GST-Uch2 and tests
      NEDD8-precursor processing genetically. It does not isolate Uch2-dependent hydrolysis of an isopeptide-linked
