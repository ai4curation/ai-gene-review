gene_symbol: uch2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Uch2 (SPBC409.06) is the fission-yeast member of the UCH37/UCHL5 branch of the peptidase
  C12 ubiquitin C-terminal hydrolases. The 300-residue protein has an N-terminal UCH catalytic domain
  with the conserved Gln-Cys-His-Asp catalytic residues and a C-terminal ULD extension that mediates
  its association with the 26S proteasome. Uch2 is the major deubiquitinating enzyme associated with
  the fission-yeast 26S proteasome, co-purifies the 19S and 20S particles, interacts with Rpn10 and
  localizes, like the proteasome, to the nucleus and predominantly the nuclear periphery. There it acts
  as a cysteine-type deubiquitinase that hydrolyses ubiquitin conjugates on proteasome-bound substrates,
  contributing to ubiquitin-dependent proteasomal degradation. uch2 is non-essential and deletion has
  no obvious effect on bulk ubiquitin-dependent proteolysis, consistent with redundancy among proteasomal
  deubiquitinases, although loss of uch2 partially suppresses a temperature-sensitive exocyst sec3 allele
  that is degraded by a proteasome-dependent quality-control pathway. Purified Uch2 also cleaves NEDD8-AMC
  in vitro, but deletion of uch2 does not alter cullin neddylation in vivo.
