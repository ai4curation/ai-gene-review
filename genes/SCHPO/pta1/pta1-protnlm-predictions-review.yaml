  review:
    assessment: LSP
    confidence_score: 2
    summary: Pta1 is a component of the experimentally characterized fission yeast CPF core. Purified-factor
      rescue of budding yeast pta1 mutant extracts establishes its conserved participation in mRNA cleavage
      and poly(A) addition. GOA already records co-transcriptional mRNA 3′-end processing, cleavage and
      polyadenylation pathway (GO:0180010). The broad mRNA-processing prediction is correct but loses
      the established mechanistic specificity and does not assign intrinsic nuclease activity.
    supported_by:
    - reference_id: PMID:33711009
      supporting_text: 'Holo-CPF consists of two component complexes (Fig 1): a 10-subunit CPF core composed
        of proteins Ysh1 (the cleavage endonuclease), Pla1 (the poly(A) polymerase), Pta1, Yth1 (a zinc
        finger protein), Pfs2 (a WD repeat protein), Iss1, Cft1 (a WD repeat protein), Cft2 (a metallo-β-lactamase/β-CASP
        protein), Ctf1, and Ssu72 (a phosphoprotein phosphatase); and a 3-subunit DPS complex comprising
        Dis2 (a phosphoprotein phosphatase), Ppn1, and Swd22 (a WD repeat protein).'
    - reference_id: PMID:10523662
      supporting_text: Extracts prepared from pta1 mutant strains are impaired in the cleavage and the
        poly(A) addition of both GAL7 and CYC1 substrates and exhibit little processing activity even
        after prolonged incubation. However, activity is efficiently rescued by the addition of purified
        CF II to the defective extracts.
