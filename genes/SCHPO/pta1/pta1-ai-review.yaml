taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Pta1 is a conserved noncatalytic component of the nuclear cleavage and polyadenylation factor
  complex. It supports cotranscriptional mRNA 3′-end formation and the coupling of RNA cleavage and polyadenylation
  to RNA polymerase II transcription termination. Its role is organization of the processing machinery,
  whose cleavage endonuclease and poly(A) polymerase are separate subunits.
