- term:
    id: GO:0008033
    label: tRNA processing
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000041
  review:
    summary: Orthology transfer of the budding yeast pta1-1 pre-tRNA accumulation phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only basis is the 1992 observation that the S. cerevisiae pta1-1 nonsense allele accumulates
      end-trimmed, intron-containing pre-tRNAs. The same study found normal pre-tRNA splicing endonuclease
      activity in mutant extracts, and the paper that later identified Pta1 as a CF II/CPF subunit states
      that the cause of the tRNA defect is unknown. There is no evidence that Pta1 performs or structurally
      supports any step of tRNA processing; the phenotype is a necessity observation from a mutant that
      also cripples mRNA 3'-end formation and is likely indirect. PAINT curators, who propagated CPF
      membership from the same SGD donor to node PTN000391745, did not propagate tRNA processing, and no
      tRNA-related phenotype or activity has been reported for pombe Pta1. The term is therefore kept
      out of the core description and flagged as an over-annotation rather than removed, because the
      ortholog phenotype itself is real.
    supported_by:
    - reference_id: PMID:1508188
      supporting_text: Extracts prepared from pta1-1 strains had normal pre-tRNA splicing endonuclease
        activity.
    - reference_id: PMID:10523662
      supporting_text: The cause of the tRNA splicing defect in yeast is not known.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: SGD:S000000041
        source_label: PTA1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >
          The SGD donor is an IMP from the pta1-1 nonsense allele (PMID:1508188); the pre-tRNA
          accumulation has no identified mechanism, splicing endonuclease activity is normal, and
          the phenotype is plausibly indirect, so it supports necessity rather than participation.
- term:
    id: GO:0030846
    label: termination of RNA polymerase II transcription, poly(A)-coupled
  evidence_type: NAS
  original_reference_id: PMID:33711009
  qualifier: involved_in
  review:
    summary: Participation of CPF, including its Pta1 scaffold, in poly(A)-coupled Pol II termination.
    action: ACCEPT
    reason: In S. pombe, CPF-mediated 3' processing precedes and is coupled to Pol II termination, and
      the CPF core contains the Ssu72 CTD phosphatase. In budding yeast Pta1 (same PANTHER subfamily),
      the Pta1 N-terminus is the Ssu72-binding region and is required for snoRNA termination and CTD
      Ser5-P dephosphorylation, giving the scaffold a structural part in the termination step rather
      than a mere requirement. Direct termination assays on pombe Pta1 are lacking, so this rests on
      complex-level evidence plus conserved subfamily mechanism.
    supported_by:
    - reference_id: PMID:33711009
      supporting_text: Fission yeast Schizosaccharomyces pombe Cleavage and Polyadenylation Factor (CPF)
        is a 13-subunit protein assembly responsible for the cotranscriptional 3’ processing of RNA polymerase
        II (Pol2) transcripts that precedes Pol2 transcription termination
    - reference_id: PMID:19188448
      supporting_text: The pta1-Delta75 mutant is defective for snoRNA termination, RNA polymerase II
        C-terminal domain Ser5-P dephosphorylation, and gene looping but is fully functional for mRNA
        3'-end processing.
- term:
    id: GO:0180010
    label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0005849
  review:
    summary: Curator inference from CPF membership to mRNA cleavage and polyadenylation.
    action: ACCEPT
    reason: This is the core process of the CPF core to which Pta1 belongs. Ortholog evidence within
      subfamily PTHR15245:SF20 shows that Pta1 is required for both cleavage and poly(A) addition in
      extracts and that defective extracts are rescued by the Pta1-containing CF II, and that Pta1
      contacts Ysh1 and other CPF subunits, so the scaffold contributes structure on which the processing
      steps depend. Pta1 does not catalyse either chemical step.
    supported_by:
    - reference_id: PMID:10523662
      supporting_text: Extracts prepared from pta1 mutant strains are impaired in the cleavage and the
        poly(A) addition of both GAL7 and CYC1 substrates and exhibit little processing activity even
        after prolonged incubation. However, activity is efficiently rescued by the addition of purified
        CF II to the defective extracts.
    - reference_id: PMID:19188448
      supporting_text: Furthermore, different regions of Pta1 interact with the CPF subunits Ssu72, Pti1,
        and Ysh1, supporting the idea that Pta1 acts as a scaffold to organize CPF.
