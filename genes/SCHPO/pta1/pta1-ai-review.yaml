  review:
    summary: termination of RNA polymerase II transcription, poly(A)-coupled is supported.
    action: ACCEPT
    reason: CPF executes cotranscriptional mRNA 3′ processing before termination; Pta1 is an established
      core subunit. Complementation of defective budding yeast pta1 extracts establishes conserved participation
      in cleavage and poly(A) addition. The inference concerns complex participation, not intrinsic nuclease
      or polymerase activity.
