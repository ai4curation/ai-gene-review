description: Pta1 is the fission yeast member of the symplekin/Pta1 family of HEAT/ARM-like helical
  scaffold proteins. It is a noncatalytic subunit of the ten-protein core of the nuclear cleavage and
  polyadenylation factor (CPF), the assembly that cleaves RNA polymerase II pre-mRNAs at the poly(A)
  site, adds the poly(A) tail and couples 3'-end processing to transcription termination. The cleavage
  endonuclease (Ysh1) and poly(A) polymerase (Pla1) are separate CPF subunits; by analogy with its
  budding yeast ortholog, which uses distinct regions to bind Ssu72, Pti1 and Ysh1, Pta1 is thought to
  organize the processing machinery and connect it to the Ssu72 CTD-phosphatase that acts in termination.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: PomBase records the molecular function of pta1 as unknown (ND).
    action: ACCEPT
    reason: No molecular activity of pombe Pta1 itself has been measured. The CPF composition study
      assigns the catalytic activities of the complex to other subunits and gives Pta1 no catalytic
      descriptor. In the budding yeast ortholog (same PANTHER subfamily PTHR15245:SF20), domain-deletion
      and interaction mapping support a scaffolding role, but the only MF terms SGD curators have assigned
      are generic protein binding and a complex-level contributes_to RNA binding, and PAINT propagated
      only the CPF complex term to this node. No specific MF term is established for this subfamily, so
      the ND statement remains the accurate description; a scaffold/adaptor MF is raised as a question
      instead.
    supported_by:
    - reference_id: PMID:33711009
      supporting_text: 'Holo-CPF consists of two component complexes (Fig 1): a 10-subunit CPF core composed
        of proteins Ysh1 (the cleavage endonuclease), Pla1 (the poly(A) polymerase), Pta1, Yth1 (a zinc
        finger protein), Pfs2 (a WD repeat protein), Iss1, Cft1 (a WD repeat protein), Cft2 (a metallo-β-lactamase/β-CASP
        protein), Ctf1, and Ssu72 (a phosphoprotein phosphatase); and a 3-subunit DPS complex comprising
        Dis2 (a phosphoprotein phosphatase), Ppn1, and Swd22 (a WD repeat protein).'
    - reference_id: PMID:19188448
      supporting_text: Furthermore, different regions of Pta1 interact with the CPF subunits Ssu72, Pti1,
        and Ysh1, supporting the idea that Pta1 acts as a scaffold to organize CPF.
