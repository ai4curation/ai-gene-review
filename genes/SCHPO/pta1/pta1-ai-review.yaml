suggested_questions:
- question: Does pombe Pta1 use its N-terminal region to bind and position Ssu72 within CPF, as in budding
    yeast, and would a scaffold MF term such as protein-macromolecule adaptor activity be justified for
    the symplekin/Pta1 subfamily as a whole?
- question: Is the budding yeast pta1-1 pre-tRNA accumulation an indirect consequence of impaired mRNA
    3'-end formation or transcription termination, and is any tRNA phenotype seen for pombe pta1 alleles?
suggested_experiments:
- description: Map pombe Pta1 binding surfaces for Ssu72, Ysh1 and Cft2 by deletion analysis and crosslinking
    mass spectrometry of purified CPF, and test N-terminal truncations for termination versus cleavage
    defects with RNA-seq readthrough analysis.
