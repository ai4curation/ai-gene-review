- term:
    id: GO:0008033
    label: tRNA processing
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000041
  review:
    summary: tRNA processing is retained as an ancillary annotation.
    action: KEEP_AS_NON_CORE
    reason: Budding yeast pta1 mutants accumulate intron-containing pre-tRNAs, supporting the curated
      orthology-based tRNA-processing association. Extracts retain normal tRNA-splicing endonuclease activity,
      so this phenotype does not establish Pta1 as a tRNA nuclease or make tRNA processing its principal
      conserved biochemical role.
    supported_by:
    - reference_id: PMID:1508188
      supporting_text: PTA1 was initially defined by a UV-induced mutation, pta1-1, that causes the accumulation
        of all 10 end-trimmed, intron-containing pre-tRNAs and temperature-sensitive but osmotic-remedial
        growth.
    - &id002
      reference_id: PMID:10523662
      supporting_text: Extracts prepared from pta1 mutant strains are impaired in the cleavage and the
        poly(A) addition of both GAL7 and CYC1 substrates and exhibit little processing activity even
        after prolonged incubation. However, activity is efficiently rescued by the addition of purified
        CF II to the defective extracts.
