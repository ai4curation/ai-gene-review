- term:
    id: GO:0051728
    label: cell cycle switching, mitotic to meiotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:7622618
  qualifier: involved_in
  review:
    summary: >-
      Kumada et al. 1995 (abstract-only in the cache) found that the nuc2 ts mutant is sterile even at the
      permissive temperature because it fails to arrest in G1 upon nitrogen starvation, the prerequisite for
      conjugation and entry into the sexual (meiotic) programme; starved nuc2 cells stop dividing and induce
      starvation-dependent genes normally but carry out an extra round of DNA replication.
    action: KEEP_AS_NON_CORE
    reason: >-
      The APC/C does part of the work here: in nitrogen-starved cells the APC/C-Ste9/Srw1 form ubiquitinates
      Cdc13/cyclin B so that Cdk1 activity falls and cells arrest in G1, and the same sterile, G2-arrested
      phenotype is produced by apc10 and ste9/srw1 mutants (Kominami et al. 1998, PMID:9736616). Nuc2 as a
      core ligase subunit therefore genuinely participates in the switch from the mitotic to the sexual
      cycle, and the PomBase term is the conventional one for this fission yeast phenotype. It is kept as
      non-core because it is a nutritional-arrest deployment of the same ligase whose core, best
      characterised function is the mitotic metaphase/anaphase transition.
    supported_by:
    - reference_id: PMID:7622618
      supporting_text: >-
        The nuc2 mutant fails to arrest at the G1 phase upon nitrogen starvation at the permissive
        temperature which is a prerequisite for conjugation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:7622618
      supporting_text: >-
        Therefore, the nuc2 mutant is deficient only for failure to block DNA replication upon starvation.
      reference_section_type: ABSTRACT
- term:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002649387
  - UniProtKB:Q9UJX3
  review:
    summary: >-
      PAINT node PTN002649387 propagates enzyme-substrate adaptor activity across the APC TPR-subunit family
      from a single seed, human ANAPC7. Nuc2/Apc3 does not read substrate degrons: D-box and KEN-box
      recognition is performed by the coactivator (Slp1 or Ste9) WD40 domain together with Apc10, and Apc3
      is the TPR subunit whose superhelical groove docks the C-terminal Ile-Arg tails of the coactivator and
      of Apc10, anchoring that substrate-receptor module to the Apc2-Apc11 catalytic core.
    action: MODIFY
    reason: >-
      The IBA is treated as a considered node judgment and the underlying biology (Nuc2 couples the
      substrate-recruiting module to the ligase) is sound, but the term is misplaced: an enzyme-substrate
      adaptor brings the enzyme its substrate, which for the APC/C is the coactivator together with Apc10.
      Nuc2 provides the docking scaffold that holds those adaptors on the catalytic core, and 20S APC/C
      assembly itself requires Nuc2; that is the definition of ubiquitin ligase complex scaffold activity
      (GO:0160072), the same replacement applied to the ANAPC7-seeded IBA on human CDC27 and yeast CDC16.
      Whether an ANAPC7 seed justifies an adaptor term for the whole family is raised in suggested_questions.
    proposed_replacement_terms:
    - id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
    supported_by:
    - reference_id: PMID:9264466
      supporting_text: The assembly of Cut9 into the 20S complex requires functional Nuc2, and vice versa.
      reference_section_type: ABSTRACT
    - reference_id: file:SCHPO/nuc2/nuc2-deep-research-falcon.md
      supporting_text: >-
        Repeated TPR-lobe binding sites engage short linear motifs, including C-box and isoleucine–arginine
        tails on APC/C coactivators or associated subunits.
    - reference_id: file:SCHPO/nuc2/nuc2-deep-research-falcon.md
