      reference_section_type: ABSTRACT
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:2297790
  qualifier: enables
  review:
    summary: >-
      Hirano et al. 1990 (abstract-only in the cache) mapped the ten 34-residue repeats of Nuc2 (now known as
      TPR motifs, modelled there as a 'snap helix'), located the nuc2-663 mutation in one repeat, and showed
      that a separate domain of the protein binds AT-rich DNA in vitro; the authors proposed that Nuc2 binds
      DNA and self-associates to form part of a chromosome scaffold.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The in vitro observation is genuine and was made by the group that cloned the gene, so the row is not
      removed, but it is not the function of Nuc2. Nuc2 was subsequently shown to be the Apc3/Cdc27 subunit of
      the APC/C ubiquitin ligase (PMID:9264466, PMID:12477395), the metaphase arrest of nuc2-663 is explained
      by failure to ubiquitinate Cut2 and Cdc13 rather than by loss of a chromosome-scaffold DNA-binding
      activity, and no later study has shown that Nuc2 binds DNA in vivo or that DNA binding contributes to
      APC/C function; the chromosome-scaffold model proposed in 1990 has been superseded. The only modern
      echo is that a flexible loop of human APC3 contacts the nucleosome acidic patch to concentrate the
      APC/C on chromatin, which is protein (histone), not DNA, binding and has not been tested for Nuc2.
      A 1990 in vitro AT-rich DNA-binding result for an isolated fragment therefore over-states the
      molecular function of this TPR scaffold subunit.
    supported_by:
    - reference_id: PMID:2297790
      supporting_text: >-
        The nuc2+ protein contains a domain, separated from ten 34 amino acid repeat segments, that is
        capable of binding AT-rich DNA in vitro.
      reference_section_type: ABSTRACT
    - reference_id: PMID:2297790
      supporting_text: >-
        The nuc2+ protein may in one way bind to DNA and in another way mutually associate to form a part
        of the chromosome scaffold.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9264466
      supporting_text: >-
        We show here that the fission yeast gene products Cut9 and Nuc2 are the subunits of the 20S complex,
        the putative APC (anaphase promoting complex)/cyclosome which contains ubiquitin ligase activity
        required for cyclin and Cut2 destruction.
      reference_section_type: ABSTRACT
    - reference_id: file:SCHPO/nuc2/nuc2-deep-research-falcon.md
      supporting_text: >-
        No direct S. pombe experiment establishes Nuc2 binding to nucleosomes or chromosomes through the
        same motif.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:3283148
  qualifier: is_active_in
  review:
    summary: >-
      Hirano, Hiraoka and Yanagida 1988 cloned nuc2+, raised antisera and showed by cell fractionation and
      Percoll gradients that the Nuc2 polypeptide (p67) co-fractionates with nuclei and is enriched in a
      salt-, LIS- and Triton-resistant, urea-soluble nuclear scaffold-like fraction.
    action: ACCEPT
    reason: >-
      Fission yeast undergoes a closed mitosis and the APC/C substrates Cut2/securin and Cdc13/cyclin B are
      nuclear at metaphase, so the nucleus is where Nuc2 executes its core function; the biochemical
      fractionation is consistent with UniProt's nuclear location and with the metaphase-arrest phenotype.
      Accepted as the core site of activity.
    supported_by:
    - reference_id: PMID:3283148
      supporting_text: >-
        Cellular fractionation and Percoll gradient centrifugation combined with immunoblotting show that
        p67 cofractionates with nuclei and is enriched in resistant structure that is insoluble in 2 M NaCl
      reference_section_type: ABSTRACT
    - reference_id: file:SCHPO/nuc2/nuc2-deep-research-falcon.md
      supporting_text: >-
        Its mitotic function is therefore executed in the nuclear compartment where chromosomes and the
        spindle remain enclosed.
