- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:2561424
  qualifier: involved_in
  review:
    summary: >-
      Yanagida 1989 (review in J Cell Sci Suppl, abstract-only in the cache) summarises the fission yeast
      mutants required for chromosome separation, listing nuc2+ among nda3+, top2+ and dis2+ as genes whose
      loss blocks mitotic chromosome separation; the underlying nuc2-663 phenotype is a metaphase-like arrest
      with condensed chromosomes on a short spindle.
    action: ACCEPT
    reason: >-
      The APC/C does part of the work of sister chromatid segregation: it ubiquitinates Cut2/securin, and
      only after securin destruction can Cut1/separase cleave cohesin and let the spindle pull the sisters
      apart. Nuc2 is an obligate structural subunit of that ligase (Cut9 and Nuc2 assemble into the 20S APC/C
      only when both are functional), and nuc2-663 cells fail to segregate chromosomes and elongate the
      spindle. The reference is a review rather than primary data, but the phenotype it summarises is the
      primary result of PMID:3283148, so the annotation is accepted as a core process.
    supported_by:
    - reference_id: PMID:2561424
      supporting_text: >-
        The roles of four representative genes, namely nda3+, nuc2+, top2+ and dis2+, encoding beta-tubulin,
        a nuclear scaffold-like protein, DNA topoisomerase II and type-1 protein phosphatase, respectively,
        are discussed in regard to the mechanisms and control of chromosome separation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:3283148
      supporting_text: >-
        specifically blocks mitotic spindle elongation at restrictive temperature so that nuclei in arrested
        cells contain a short uniform spindle (approximately 3-micron long), which runs through a metaphase
        plate-like structure consisting of three condensed chromosomes
      reference_section_type: ABSTRACT
    - reference_id: PMID:9264466
      supporting_text: >-
        We show here that the fission yeast gene products Cut9 and Nuc2 are the subunits of the 20S complex,
        the putative APC (anaphase promoting complex)/cyclosome which contains ubiquitin ligase activity
        required for cyclin and Cut2 destruction.
      reference_section_type: ABSTRACT
- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:7622618
  qualifier: involved_in
  review:
    summary: >-
      Kumada et al. 1995 (abstract-only in the cache) re-examined the nuc2 ts mutant and found that at the
      restrictive temperature septation occurs without chromosome separation, giving a 'cut' phenotype, and
      restated that nuc2 is required for exit from mitotic metaphase.
    action: ACCEPT
    reason: >-
      Direct mutant evidence that loss of Nuc2 blocks sister chromatid separation and segregation, and the
      mechanism is the one the APC/C executes (securin and cyclin ubiquitination). Same conclusion as the
      PMID:2561424 row; accepted as a core process.
    supported_by:
