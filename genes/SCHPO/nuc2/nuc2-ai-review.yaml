- description: >-
    After cytokinesis Nuc2 switches off the septation initiation network, apparently independently of the
    rest of the APC/C (cut9 and lid1 inactivation do not reproduce the defect): loss of Nuc2 leaves Cdc7 and
    Sid1 on the spindle pole bodies and Sid2 at the division site and produces multiple septa, whereas Nuc2
    overproduction prevents SIN-kinase recruitment, collapses the actomyosin ring and blocks septation. The
    proposed mechanism is an effect on the nucleotide state of the SIN GTPase Spg1 (favouring the Byr4-Cdc16
    GAP), but no direct biochemical activity has been shown, so no molecular function term is asserted for
    this role.
