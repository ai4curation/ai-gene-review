proposed_new_terms: []
suggested_questions:
- question: >-
    PAINT node PTN002649387 propagates enzyme-substrate adaptor activity (GO:0140767) to the whole APC TPR-subunit
    family from a single ANAPC7 seed. Given that Apc3/Nuc2 docks the coactivator and Apc10 IR tails rather
    than substrate degrons, should the node carry ubiquitin ligase complex scaffold activity (GO:0160072)
    instead?
  experts: []
- question: >-
    Chew and Balasubramanian 2008 (PMID:18208358) showed that Nuc2 inhibits the septation initiation network
    after cytokinesis and that cut9 and lid1 mutants do not share the phenotype. Is this an APC/C-independent
    activity of free Nuc2 acting on Spg1 nucleotide state (e.g. via Byr4-Cdc16), or a Nuc2-specific property
    of the holoenzyme, and should nuc2 carry a negative regulation of septation initiation signaling
    annotation (currently absent from GOA) on the strength of that paper?
  experts:
  - Balasubramanian MK
- question: >-
    Human APC3 contacts the nucleosome acidic patch through a flexible loop, concentrating the APC/C on
    mitotic chromatin. Does fission yeast Nuc2 have an equivalent chromatin-binding loop, and does this
    explain the 1990 observation that a non-TPR fragment of Nuc2 binds AT-rich DNA in vitro?
  experts: []
suggested_experiments:
- hypothesis: >-
    The SIN-inhibitory activity of Nuc2 is separable from its APC/C scaffold function and maps to a surface
    of the protein that is not needed for Cut9 incorporation or coactivator docking.
  description: >-
    Generate nuc2 point mutants guided by the human APC/C cryo-EM model that either disrupt the Cut9
    interface or the coactivator IR-tail pocket, verify APC/C assembly by Cut9-TAP and Nuc2 co-purification,
    then score Cdc7/Sid1 persistence at SPBs and multiseptation after cytokinesis; a mutant that retains
    APC/C assembly but loses SIN inhibition (or vice versa) would separate the two functions. In parallel
    test whether purified Nuc2 alters Spg1 GTP loading or Byr4-Cdc16 GAP activity in vitro.
  experiment_type: structure-guided mutagenesis with in vivo SIN localisation assays and in vitro GTPase assays
- hypothesis: >-
    The 1990 AT-rich DNA-binding activity of Nuc2 reflects a chromatin-tethering loop analogous to the
    nucleosome acidic-patch-binding loop of human APC3, rather than a chromosome-scaffold function.
  description: >-
    Map the DNA-binding fragment of Hirano et al. 1990 onto the Nuc2 sequence, test binding of the
    recombinant fragment to reconstituted nucleosomes versus free DNA, and assay whether deleting the region
    at the endogenous locus slows Cut2 and Cdc13 degradation or perturbs APC/C chromatin association
    (Nuc2-GFP on mitotic chromatin, ChIP) without affecting 20S APC/C assembly.
  experiment_type: biochemical nucleosome-binding assays and in vivo degradation kinetics
