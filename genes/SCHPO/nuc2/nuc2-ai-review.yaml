    summary: >-
      Matsuyama et al. 2006 (abstract-only in the cache) is the fission yeast ORFeome localisation screen in
      which 4,431 C-terminally YFP-tagged proteins, expressed from a plasmid promoter, were imaged; the
      PomBase HDA row records Nuc2-YFP signal at the cell division site.
    action: KEEP_AS_NON_CORE
    reason: >-
      A single high-throughput observation with an over-expressed, tagged protein, but it is biologically
      plausible: Nuc2 is an inhibitor of septation (nuc2 overexpression blocks septum formation and the
      mutant septates prematurely, PMID:7622618) and, independently of the rest of the APC/C, it switches
      off the SIN after cytokinesis, controlling Sid2 retention at the division site (PMID:18208358). The
      division site is therefore a credible secondary site of Nuc2 activity, but the core function is
      executed by the nuclear APC/C, so the row is kept as non-core rather than removed or promoted.
    supported_by:
