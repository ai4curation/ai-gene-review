core_functions:
- description: >-
    Nuc2 forms the outermost element of the APC/C TPR lobe (Cut23-Cut9-Nuc2, stabilised by Hcn1/Cdc26 and
    Apc13), providing the TPR groove that docks the C-terminal Ile-Arg tails of the coactivators Slp1/Cdc20
    and Ste9/Cdh1 and of Apc10, so that the substrate receptor is held against the Apc2-Apc11 catalytic
    module and Cut2/securin, Cdc13/cyclin B and other D-box/KEN-box substrates are ubiquitinated and degraded
    at the metaphase/anaphase transition and through mitotic exit.
