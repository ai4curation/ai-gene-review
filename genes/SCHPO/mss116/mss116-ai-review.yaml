  knowledge_gaps:
  - gap_statement: The direct RNA target of mss116 and the step of mitochondrial gene
      expression at which it acts are undetermined. It is unknown whether it remodels
      mt-rRNA during mitoribosome assembly, acts on the cox1 and cob1 introns, or acts
      at another step.
    boundary: Deletion destabilises mitoribosomal proteins of both subunits, reduces
      assembled mitoribosomes and abolishes global mitochondrial translation
      independently of introns, while mt-rRNA levels are unchanged. The protein is
      inside mitochondria but does not co-sediment with mitoribosomes or their
