suggested_questions:
- question: Which mitoribosomal subunit fails to assemble in fission-yeast
    mss116-delta cells, and does spMss116 physically associate with the large subunit
    or with early assembly intermediates as in budding yeast? The answer decides whether
    GO:0061668 can be refined to mitochondrial large ribosomal subunit assembly
    (GO:1902775).
- question: Do unspliced cox1 and cob1 precursors accumulate in mss116-delta cells with
    intron-containing mtDNA, and which introns (group I vs group II) depend on mss116?
    That would justify group I / group II intron splicing terms rather than the broader
    mitochondrial mRNA processing.
- question: Beyond the assembly defect, does fission-yeast mss116 have a direct,
    mRNA-specific role in Cox1 translation like the Pet309-dependent role of the
    budding-yeast ortholog? A direct role would justify a mitochondrial translation
    annotation.
- question: How do the two fission-yeast mitochondrial DEAD-box helicases, mss116 and
    Mrh5, divide mitoribosome-related work, given that Mrh5 associates with the
    mitoribosome and is required for cox1 translation?
suggested_experiments:
- description: Sucrose-gradient sedimentation of mitochondrial extracts from wild-type
    and mss116-delta cells (intronless mtDNA), probing mtLSU and mtSSU markers and
    tagged spMss116, under Mg2+ and EDTA conditions.
  hypothesis: spMss116 co-sediments with the large mitoribosomal subunit, and its loss
    specifically depletes mature large subunits.
- description: Complement mss116-delta cells (intronless mtDNA) with ATP-binding-site
    (residues 83-90) and DEAD-box (195-198) point mutants of spMss116 and assay mitoribosome assembly and
    mitochondrial translation.
  hypothesis: The ATPase/helicase activity of spMss116 is required for mitoribosome
    assembly, consistent with direct remodelling of rRNA.
- description: Northern blot or RT-PCR across exon-intron junctions of cox1 and cob1 in
    wild-type and mss116-delta cells with intron-containing mtDNA.
  hypothesis: Loss of mss116 causes accumulation of unspliced cox1 and cob1 precursors,
    showing a direct requirement for intron splicing.
