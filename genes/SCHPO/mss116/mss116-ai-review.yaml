  - statement: S. pombe mtDNA encodes a mitoribosomal small-subunit protein, so a
      primary translation defect can itself impair mtSSU assembly
    supporting_text: a small mitochondrial ribosomal (mitoribosome) subunit (mtSSU) protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only fission-yeast functional study of mss116. Full text (PDF extraction,
      supplied by the user) now cached and read; supplementary figures (S1-S3, Tables
      S1-S2) were not available. Single-lab study using a deletion allele, with
      complementation by overexpressed spMss116-HA. No catalytic-dead mutants and no
      biochemical activity assays were performed. The sucrose-gradient assembly assay
      probed only two mtSSU and one mtLSU marker protein. The study did not relocate the
      mtDNA-encoded mtSSU protein to the nucleus, so the assembly and translation
      defects cannot be ordered causally. The title's "required for mitoribosome
      assembly" is stronger than the paper's own conclusion, which only says mss116
      "may participate in mitoribosome assembly".
