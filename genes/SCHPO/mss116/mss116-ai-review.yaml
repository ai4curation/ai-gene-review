gene_symbol: mss116
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: mss116 encodes a nuclear-encoded, mitochondrially targeted DEAD-box
  ATP-dependent RNA helicase of fission yeast, one of only two mitochondrial DEAD-box
  helicases in this organism (the other is Mrh5). It carries an N-terminal
  mitochondrial transit peptide, a Q motif, and the helicase ATP-binding and
  C-terminal domains typical of the family. Deletion of mss116 in cells whose
  mitochondrial genome contains introns lowers the levels of the mitochondrially
  encoded cox1 and cob1 mRNAs, which are restored by removing the mitochondrial
  introns, consistent with a role in processing intron-containing transcripts as in
  the budding-yeast ortholog, where Mss116 acts as an RNA chaperone for splicing of
  group I and group II introns. Independently of introns, mss116 is required for
  mitochondrial ribosome assembly and for the stability of mitoribosomal proteins;
  its loss impairs mitochondrial translation and respiration and reduces viability in
  stationary phase. The translation defect is attributed to defective mitoribosome
  assembly. In budding yeast the ortholog associates with the large mitoribosomal
  subunit and joins early large-subunit assembly intermediates.
