- id: PMID:38604460
  title: The Schizosaccharomyces pombe DEAD-box protein Mss116 is required for mitoribosome
    assembly and mitochondrial translation.
  full_text_unavailable: true
  findings:
  - statement: In intron-containing mtDNA, deletion of mss116 lowers cox1 and cob1 mRNA,
      impairs mitochondrial translation and causes respiratory and stationary-phase
      viability defects
    supporting_text: Deletion of spmss116 in a mitochondrial intron-containing background
      significantly reduced the levels of mitochondrial DNA (mtDNA)-encoded cox1 and cob1
      mRNAs and impaired mitochondrial translation
  - statement: Removing mitochondrial introns restores cox1/cob1 mRNA levels but not
      translation or respiration
    supporting_text: Deletion of mitochondrial introns restored the levels of cox1 and
      cob1 mRNAs to wide-type (WT) levels but could not restore mitochondrial translation
      and respiration
  - statement: Mitoribosome assembly and mitoribosomal protein stability depend on
      mss116 irrespective of introns
    supporting_text: deletion of spmss116 in both mitochondrial intron-containing and
      intronless backgrounds impaired mitoribosome assembly and destabilization of
      mitoribosomal proteins
  - statement: The authors interpret the translation defect as secondary to defective
      mitoribosome assembly
    supporting_text: defective mitochondrial translation caused by deletion of spmss116
      is most likely due to impaired mitoribosome assembly
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The only fission-yeast functional study of mss116. PMID, title,
      journal (Mitochondrion 2024;76:101881) and DOI are consistent across PubMed,
      Europe PMC and the cached record. Only the abstract was available. Europe PMC
      lists it as not open access with no PMC copy; the bgpt MCP lookup failed (quota);
      web search found only abstract mirrors. The subunit affected, the assembly
      assay, any physical association of spMss116 with mitoribosomes, any direct
      splicing readout, catalytic-mutant tests and localisation data could therefore not
      be verified.
