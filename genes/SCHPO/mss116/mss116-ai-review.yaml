  - statement: The authors present the assembly role as a suggestion and propose
      mt-rRNA as a possible target
    supporting_text: Our study also suggests that spMss116 may participate in mitoribosome
      assembly.
  - statement: Budding-yeast Mss116 cannot substitute for spMss116
    supporting_text: overexpression of spmss116 but not scmss116 was able to restore
