- term:
    id: GO:0061668
    label: mitochondrial ribosome assembly
  evidence_type: IMP
  original_reference_id: PMID:38604460
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Deletion of mss116 impairs mitoribosome assembly
      and destabilises mitoribosomal proteins in fission yeast in both intron-containing
      and intronless mtDNA backgrounds, so the defect is independent of intron
      processing.
    action: NEW
    reason: The participation test is met by the ortholog, not by the fission-yeast
      abstract alone. In S. cerevisiae, Mss116 physically associates with the large
      mitoribosomal subunit and is incorporated into early large-subunit assembly
      intermediates, alongside the paralogous DEAD-box assembly factor Mrh4. It is
      therefore an RNA-remodelling assembly factor that does part of the work of
      assembly, like the bacterial DEAD-box assembly factor SrmB, not a substrate or a
      remote upstream requirement. The fission-yeast data establish necessity and
      intron independence. The generic term is used rather than mitochondrial large
      ribosomal subunit assembly (GO:1902775) because the abstract does not say which
      subunit is affected; the full text of PMID:38604460 is needed to refine it.
      Mitochondrial translation (GO:0032543) is deliberately not proposed. The authors
      attribute the translation defect to the assembly defect, and GO:0061668 is not
      part of translation in GO.
    supported_by:
    - reference_id: PMID:38604460
      supporting_text: deletion of spmss116 in both mitochondrial intron-containing and
        intronless backgrounds impaired mitoribosome assembly and destabilization of
        mitoribosomal proteins
    - reference_id: PMID:38604460
      supporting_text: defective mitochondrial translation caused by deletion of spmss116
        is most likely due to impaired mitoribosome assembly
    - reference_id: PMID:28520979
      supporting_text: although its role is not essential, Mss116 might participate in
        the biogenesis of the mtLSU, probably at an early step
    - reference_id: PMID:29514071
      supporting_text: Mss116 and Mrm2 are incorporated early
