  review:
    summary: UniProt subcellular location mapping (Mitochondrion matrix, By similarity).
      Fission-yeast data place the protein inside mitochondria (protected from
      proteinase K in intact organelles) and mostly in the carbonate-soluble fraction,
      with a small membrane-associated pool. Together with the predicted cleavable
      transit peptide, these give two independent lines for an internal soluble
      location.
    action: ACCEPT
    reason: The protease-protection assay alone cannot separate matrix from
      intermembrane space, because no intermembrane-space marker or mitoplast
      preparation was used. The cleavable N-terminal presequence, however, is the
      default matrix-targeting signal. All the processes that need mss116 (expression
      of mtDNA-encoded genes, mitoribosome assembly, processing of cox1 and cob1
      transcripts) take place in the matrix. The authors' suggestion of a peripheral
      membrane association, from a small carbonate-pellet fraction, is compatible with
      a matrix-side, inner-membrane-associated pool.
    supported_by:
