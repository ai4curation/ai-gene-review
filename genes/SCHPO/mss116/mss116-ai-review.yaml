      prepared in the presence of 0.5 mM MgCl2 and with dissociated mtLSU
- description: Maturation of intron-containing mitochondrial transcripts. Loss of
    mss116 lowers cox1 and cob1 mRNA only when mitochondrial introns are present. This
    is consistent with the ortholog's RNA chaperone role in group I and group II intron
    splicing, but in fission yeast splicing itself has not been directly shown in the
    accessible (abstract-level) evidence.
  molecular_function:
