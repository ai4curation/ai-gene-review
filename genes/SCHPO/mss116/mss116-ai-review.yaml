id: O13622
gene_symbol: mss116
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: mss116 encodes a nuclear-encoded, mitochondrially targeted DEAD-box
  ATP-dependent RNA helicase of fission yeast, one of four mitochondrial DEAD-box
  proteins in this organism (with Mrh5, Rpm2 and Irc3). It carries an N-terminal
  mitochondrial transit peptide, a Q motif, and the helicase ATP-binding and
  C-terminal domains typical of the family. The protein is inside mitochondria,
  protected from external protease and largely soluble, with a minor
  membrane-associated pool. Deletion of mss116 abolishes respiratory growth, causes
  loss of viability in stationary phase and strongly reduces synthesis of all
  mitochondrially encoded proteins, whether or not the mitochondrial genome carries
  introns. Mitochondrial ribosomal proteins of both subunits are destabilised and
  fully assembled mitoribosomes are reduced, while mitochondrial rRNA levels are
  unchanged. The protein itself does not co-sediment with mitoribosomes or their
  subunits. In cells with intron-containing mtDNA, mature cox1 and cob1 mRNAs are
  lost and intron-retaining precursors accumulate; removing the introns restores the
  mRNAs but not translation. Because splicing of these introns depends on
  intron-encoded maturases that are themselves made by mitochondrial translation, it
  is unresolved whether mss116 acts on the introns directly, as its budding-yeast
  ortholog does as an RNA chaperone for group I and II intron splicing. The
  budding-yeast protein cannot substitute for mss116, and the cox1-specific
  translational role of the budding-yeast ortholog appears to be carried out in
  fission yeast by the Mrh5 complex.
