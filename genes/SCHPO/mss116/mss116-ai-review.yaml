core_functions:
- description: ATP-dependent RNA helicase acting inside mitochondria (largely soluble,
    with a minor membrane-associated pool). It is required for global mitochondrial
    translation and for normal levels of assembled mitoribosomes and of mitoribosomal
    proteins of both subunits, independently of mitochondrial introns. Which step it
    acts at directly is unknown. It does not stably co-sediment with mitoribosomes, and
    the assembly and translation defects cannot be ordered causally from the published
    data. Its RNA substrate (the authors propose mt-rRNA) has not been identified.
  molecular_function:
    id: GO:0003724
    label: RNA helicase activity
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:38604460
    supporting_text: spMss116 was protected from proteinase K digestion in the absence
      of Triton X-100 (Fig. 1B), demonstrating that spMss116 is localized inside the
      mitochondria.
  - reference_id: PMID:38604460
    supporting_text: spMss116 possesses nine conserved motifs characteristic of the DEAD
      box family of RNA helicases
  - reference_id: PMID:38604460
