- term:
    id: GO:0090615
    label: mitochondrial mRNA processing
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15424
  review:
    summary: Transferred from S. cerevisiae Mss116, which acts directly as an RNA
      chaperone for splicing of all group I and II mitochondrial introns. In fission
      yeast, deletion of mss116 does cause accumulation of intron-retaining cox1 and
      cob1 pre-mRNAs and loss of the spliced mRNAs. However, the same deletion
      abolishes global mitochondrial translation, which the intron-encoded maturases
      required for splicing depend on. The authors explicitly leave open whether
      mss116 participates in splicing.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text was read; the uncertainty is direct versus indirect participation,
      which is a judgement, so UNDECIDED is not used. The fission-yeast splicing defect is
      real but is equally explained by an
      indirect route. Loss of mitochondrial translation removes the intron-encoded
      maturases, and splicing fails as a consequence. The paper does not separate the
      two, for example with a translation-competent allele or by measuring maturase
      levels. Orthology alone is a weak guide here, because the paper documents
      functional divergence. The budding-yeast protein cannot rescue the fission-yeast
      deletion, and its cox1 translational role is taken over in fission yeast by the
      Mrh5 complex. The annotation is not shown to be wrong, but neither a direct role
      nor a more specific group I or group II intron splicing term can be established
      from the available evidence.
    supported_by:
    - reference_id: PMID:38604460
      supporting_text: RT-PCR with cox1 and cob1 intron primers revealed that the levels
        of intronretaining cox1 and cob1 pre-mRNAs were increased in Δspmss116 cells
    - reference_id: PMID:38604460
      supporting_text: relies on their intron-encoded proteins, whose synthesis was
        dependent on mitochondrial translation.
    - reference_id: PMID:38604460
      supporting_text: It remains to be determined whether spMss116 participates in
        splicing of mitochondrial introns.
    - reference_id: PMID:15618406
      supporting_text: Mss116p, is required for the efficient splicing of all group I
        and II introns, some RNA end-processing reactions, and translation of a subset
        of mRNAs
