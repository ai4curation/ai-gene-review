- description: ATP-dependent RNA helicase / RNA chaperone acting in the mitochondrial
    matrix. It is required for mitochondrial ribosome assembly and for the stability of
    mitoribosomal proteins, independently of mitochondrial introns. The budding-yeast
    ortholog does this as an early large-subunit assembly factor.
