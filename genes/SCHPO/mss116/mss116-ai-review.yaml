suggested_questions:
- question: >-
    Should GO:0032543 mitochondrial translation be annotated from PMID:38604460? Global
    mitochondrial translation is lost in the deletion, independently of introns, and this is
    the paper's headline conclusion. It is not annotated here because the protein shows no
    association with mitoribosomes and the translation loss may follow from the assembly
    defect, so the evidence shows necessity rather than participation. For comparison,
    PomBase annotates the mitochondrial DEAD-box helicase mrh5, which binds the small
    subunit and activates cox1 translation, with molecular-function terms (mitochondrial
    small ribosomal subunit binding, translation activator activity); neither applies to
    mss116, which does not co-sediment with either subunit and whose defect is global.
- question: >-
    Should GO:0061668 mitochondrial ribosome assembly be annotated from PMID:38604460?
    The paper shows reduced assembled mitoribosomes and lower mtSSU and mtLSU protein
    levels in intron-containing and intronless backgrounds, with mt-rRNA unchanged. But
    the protein does not co-sediment with either subunit, and the authors only conclude
    it "may participate". In addition, S. pombe mtDNA encodes an mtSSU protein, so a
    primary translation defect could itself impair assembly. This review records
    necessity but declines to assert participation. Does PomBase hold this paper as
    phenotype (FYPO) annotations only, and was that deliberate?
- question: Is the accumulation of intron-retaining cox1 and cob1 pre-mRNAs a direct
    splicing defect or a consequence of losing the translation-dependent intron-encoded
    maturases? This decides whether GO:0090615 (or group I / group II intron splicing
    terms) should be kept for fission-yeast mss116.
- question: Why can budding-yeast Mss116 not replace fission-yeast mss116, and does
    this divergence argue against transferring budding-yeast process annotations
    (intron splicing, COX1-specific translation) to the fission-yeast protein at all?
- question: The small carbonate-resistant pool suggests a peripheral membrane
    association. Is fission-yeast mss116 associated with the matrix face of the inner
    membrane, where yeast mitoribosome assembly takes place?
suggested_experiments:
- description: Sucrose-gradient sedimentation of mitochondrial extracts from wild-type
    and mss116-delta cells under milder lysis conditions or after in-organello
    crosslinking, probing several mtLSU and mtSSU markers and tagged spMss116, and
    analysing mt-rRNA by northern blot across fractions.
  hypothesis: spMss116 transiently associates with an early mitoribosome assembly
    intermediate, which accumulates or is degraded in its absence. Its failure to
    co-sediment under standard DDM/Mg2+ conditions reflects a labile interaction.
- description: Complement mss116-delta cells (intronless mtDNA) with ATP-binding-site
    (residues 83-90) and DEAD-box (195-198) point mutants of spMss116 and assay
    mitoribosome assembly and mitochondrial translation.
  hypothesis: The ATPase/helicase activity of spMss116 is required for mitoribosome
    assembly, consistent with direct remodelling of rRNA.
- description: In intron-containing cells, use a conditional (degron or
    promoter-shutoff) mss116 allele to follow cox1 and cob1 splicing and mitochondrial
    translation over time after depletion. Alternatively, test in vitro whether
    purified spMss116 stimulates splicing of the cob1 group II intron or the cox1
    group I introns.
  hypothesis: If spMss116 acts directly on the introns, splicing fails before global
    translation declines and is stimulated by the purified protein in vitro. If it
    acts indirectly, splicing fails only after the maturases are depleted.
- description: CLIP or RNA immunoprecipitation of tagged spMss116 from mitochondria,
    followed by sequencing.
  hypothesis: spMss116 binds specific regions of the mitochondrial large- or
    small-subunit rRNA, identifying its assembly substrate.
