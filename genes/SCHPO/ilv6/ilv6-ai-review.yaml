  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: ORFeome-wide YFP localisation (Matsuyama et al. 2006) scored C-terminally tagged ilv6 as
      cytoplasmic; UniProt records the same result. GO cytoplasm includes the mitochondrion, so the annotation
      is formally compatible with a mitochondrial AHAS subunit.
    action: KEEP_AS_NON_CORE
    reason: Not contradicted, but not the informative compartment. The AHAS small subunit acts with ilv1
      in the mitochondrial matrix (S. cerevisiae ILV6 orthology, PomBase GO-CAM). Note that the 2022 review
      cites the same Matsuyama dataset as placing ilv6 in mitochondria, so the screen call is ambiguous;
      the HDA is kept rather than overruled.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: we determined the localization of 4,431 proteins, corresponding to approximately
        90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein
    - reference_id: file:SCHPO/ilv6/ilv6-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:16823372}.'
    - reference_id: PMID:35325114
      supporting_text: In S. pombe, both the products of ilv1+ and ilv6+ are localized in the mitochondria
        (Matsuyama et al. 2006), similar to baker's yeast and laboratory S. cerevisiae, suggesting that
        S. pombe ALS also acts in the mitochondria.
