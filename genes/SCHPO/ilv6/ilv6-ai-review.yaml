suggested_questions:
- question: Is the S. pombe AHAS valine feedback inhibition (reported for crude enzyme) dependent on ilv6,
    as for S. cerevisiae ILV6, and does ilv6 deletion cause any branched-chain amino acid bradytrophy?
- question: Is ilv6 mitochondrial (as stated in the 2022 review citing the ORFeome screen) or cytoplasmic
    (as recorded by PomBase/UniProt from the same screen)?
suggested_experiments:
- description: Reconstitute recombinant S. pombe ilv1 with and without ilv6 and measure acetolactate formation
    and valine/isoleucine inhibition; in parallel test growth of ilv6 deletion cells on minimal medium
    with and without valine.
- description: Image endogenously N- and C-terminally tagged ilv6 together with a mitochondrial marker
    to resolve the localisation discrepancy.
