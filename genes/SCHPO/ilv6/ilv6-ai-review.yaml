taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Regulatory (small) subunit of acetohydroxy-acid synthase (AHAS, acetolactate synthase) in
  fission yeast, encoded by SPBC14C8.04. It belongs to the AHAS small-subunit family (ACT-domain regulatory
  proteins) and is the ortholog of S. cerevisiae ILV6. By analogy with ILV6, it binds the catalytic subunit
  ilv1, stimulates its condensation of two pyruvates (valine/leucine branch) or pyruvate plus 2-oxobutanoate
  (isoleucine branch), and makes the enzyme sensitive to feedback inhibition by valine. The holoenzyme
  acts in the mitochondrial matrix at the first shared step of branched-chain amino acid biosynthesis.
  Its role is inferred by sequence similarity; it has not been characterised biochemically or genetically
  in S. pombe.
