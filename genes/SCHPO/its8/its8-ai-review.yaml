description: >-
  its8/mcd4 encodes the Schizosaccharomyces pombe GPI ethanolamine phosphate
  transferase 1, an ER multipass membrane enzyme of the PTHR12250/PIGN family
  that supports GPI-anchor biosynthesis by phosphoethanolamine modification of
  the nascent GPI precursor.
