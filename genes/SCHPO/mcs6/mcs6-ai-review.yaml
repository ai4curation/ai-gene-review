  review:
    summary: Lee et al. (1999) showed that Csk1 activates both monomeric and Mcs2-bound Mcs6, that Csk1
      can also activate Cdc2-cyclin complexes, and that only the csk1-delta mcs6-ts double mutant fails
      to activate Cdc2 and arrests before mitosis; Cdc2-cyclin complexes from the arrested cells could
      be re-activated in vitro by recombinant CAK. This defines Mcs6-Mcs2 as one of two partially redundant
      CAKs that phosphorylate the Cdc2 T-loop (Thr167). Cached record is abstract-only.
    action: MODIFY
    reason: The evidence is sound (Mcs6 phosphorylates the Cdc2 activation-loop threonine) but the enzyme
      assayed and genetically tested here is explicitly the cyclin-bound Mcs6-Mcs2 complex, i.e. a cyclin-dependent
      Ser/Thr kinase, for which GO:0004693 is the exact term already used on five other rows for this
      gene. Recording the specific child rather than the generic parent is more informative and keeps
      the term set consistent (the paired GO:0004674 row from PMID:22508988 is likewise refined to the
      position-specific CTD kinase terms).
    proposed_replacement_terms:
    - id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
    supported_by:
    - reference_id: PMID:10226032
