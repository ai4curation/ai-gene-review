id: Q12126
gene_symbol: mcs6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Mcs6 (also called Crk1 and Mop1) is the fission yeast ortholog of CDK7, an essential 335-residue
  cyclin-dependent serine/threonine protein kinase of the CMGC family. With its cyclin H-like partner
  Mcs2 and the RING-finger MAT1-like assembly factor Pmh1 it forms the trimeric Mcs6-Mcs2-Pmh1 complex,
  which exists both as a free ~200 kDa trimer and as the kinase module (TFIIK) of the general transcription
  factor TFIIH. The complex has two experimentally separable outputs. As a CDK-activating kinase (CAK)
  it phosphorylates the activation-loop residue Thr167 of the major cell-cycle CDK Cdc2, a modification
  required for full Cdc2-cyclin activity; this CAK role is shared with the monomeric Cak1-like kinase
  Csk1, so Cdc2 activation and cell-cycle progression fail only when both enzymes are impaired. As the
  TFIIH-associated kinase it phosphorylates the heptapeptide repeats of the RNA polymerase II C-terminal
  domain, preferentially on Ser5 and also on Ser7, during transcription initiation; this priming phosphorylation
  is required to recruit the Cdk9 (P-TEFb)-Pcm1 (cap methyltransferase) complex to the transcribing polymerase
  and stimulates subsequent CTD phosphorylation by Cdk9, coupling initiation to early elongation and mRNA
  capping. Mcs6 is itself activated by phosphorylation of its T-loop residue Ser165 by Csk1, and Pmh1
  can substitute for this phosphorylation. Conditional loss of Mcs6 lowers CTD Ser5 phosphorylation but
  reduces global transcription only modestly, instead selectively repressing a subset of genes enriched
  for the Sep1/Ace2-dependent cytokinesis and cell-separation program, so that mutant cells arrest as
  multiseptate, multinucleate cells. The protein localizes to the nucleus, with an additional cytoplasmic
  pool, and acts on chromatin-bound RNA polymerase II.
