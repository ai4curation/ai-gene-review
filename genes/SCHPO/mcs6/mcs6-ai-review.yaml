suggested_questions:
- question: Which Mcs6-dependent transcripts among the ~5% acutely repressed on Mcs6 inhibition require
    Ser5 phosphorylation per se versus Mcs6-dependent recruitment of Cdk9/Pcm1 and 5' capping, and does
    Ser7 phosphorylation by Mcs6 have a separable role?
  experts: []
- question: Do Mcs6 and Csk1 activate distinct Cdc2-cyclin subpopulations (Cdc2-Cig2 at G1/S versus Cdc2-Cdc13
    at G2/M) in vivo, or do they act redundantly on all Cdc2 complexes?
  experts: []
- question: 'PomBase annotates csk1 to G2/M transition of mitotic cell cycle (GO:0000086) by EXP from
    the csk1-delta mcs6-ts double-mutant study (PMID:10226032), and SGD annotates Cak1 to the same term,
    but mcs6 carries only regulation of cell cycle (GO:0051726, IBA): was omitting GO:0000086 for mcs6
    a deliberate decision (single mcs6 mutants activate Cdc2 normally because Csk1 compensates), or should
    the CAK contribution of Mcs6 to mitotic entry be annotated as it is for csk1?'
  experts: []
- question: Is the Cdc2-directed CAK reaction carried out by the free Mcs6-Mcs2-Pmh1 trimer or by TFIIH-incorporated
    Mcs6, and where in the cell (the cytoplasmic pool seen by YFP tagging versus the nucleus) does it
    take place?
  experts: []
suggested_experiments:
- hypothesis: Mcs6-dependent gene expression at the Sep1/Ace2 cell-separation cluster is mediated primarily
    through Cdk9/Pcm1 recruitment and cap methylation rather than through Ser5 phosphorylation alone.
  description: Combine acute mcs6-as inhibition with nascent-RNA sequencing, Pcm1 and Cdk9 ChIP-seq and
    cap-methylation profiling; test whether tethering Pcm1 or Cdk9 to the eng1+/ace2+ promoters restores
    expression when Mcs6 is inhibited.
  experiment_type: chemical genetics + nascent transcriptomics + ChIP-seq
- hypothesis: Mcs6 and Csk1 preferentially phosphorylate different Cdc2-cyclin complexes in vivo.
  description: In mcs6-as and csk1-delta backgrounds, immunoprecipitate Cdc2-Cig2 and Cdc2-Cdc13 separately
    across a synchronised cell cycle and quantify Thr167 phosphorylation and kinase activity; complement
    with phosphoproteomics of T-loop sites of all fission-yeast CDKs after acute Mcs6 inhibition.
  experiment_type: chemical genetics + phosphoproteomics
