  knowledge_gaps:
  - gap_statement: The division of labour between Mcs6 and Csk1 in activating Cdc2 bound to different
      cyclins (Cig2 at G1/S versus Cdc13 at G2/M), and whether specific Cdc2 subpopulations depend on
      the Mcs6 complex, remain unsettled; whether the free trimer or TFIIH-bound Mcs6 performs the CAK
      reaction is also unknown.
    boundary: Cdc2 Thr167 phosphorylation and Cdc2 activation are lost only when both Mcs6 and Csk1 are
      impaired; single mcs6 conditional mutants retain Cdc2 T-loop phosphorylation and arrest instead
      with a cell-separation/transcription phenotype.
