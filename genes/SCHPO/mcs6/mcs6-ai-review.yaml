  knowledge_gaps:
  - gap_statement: Whether the ~5% of transcripts that are acutely Mcs6-dependent (the Sep1/Ace2 cell-separation
      program) reflect a promoter-specific requirement for Ser5 phosphorylation, for Cdk9/Pcm1 recruitment
      and capping, or for another TFIIH-linked step is not resolved.
    boundary: Conditional or chemical-genetic loss of Mcs6 lowers bulk Ser5-P and Ser7-P rapidly but reduces
      global mRNA levels by at most about one third, so the kinase is not a universal requirement for
      Pol II transcription in fission yeast.
- description: 'CDK-activating kinase (CAK): as the Mcs6-Mcs2-Pmh1 trimer, phosphorylates the activation-loop
    residue Thr167 of Cdc2 (Cdk1), licensing Cdc2-cyclin activity for cell-cycle progression including
    the G2/M transition; this role is shared with, and can be compensated by, the monomeric CAK Csk1,
    which also activates Mcs6 itself by phosphorylating its T-loop Ser165.'
