core_functions:
- description: 'TFIIH/TFIIK kinase subunit: cyclin (Mcs2)-dependent phosphorylation of the RNA polymerase
    II CTD heptad repeats on Ser5 (and Ser7) at promoters during transcription initiation, priming the
    CTD for Cdk9 (P-TEFb) recruitment and activity and thereby promoting the transition to productive
    elongation and recruitment of the Pcm1 cap methyltransferase.'
