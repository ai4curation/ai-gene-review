  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0263237
  review:
    summary: PomBase curator transfer from Drosophila Cdk7 (FB:FBgn0263237), the metazoan ortholog, to
      Mcs6. Promoter clearance is the transition from initiation to elongation; TFIIH-kinase phosphorylation
      of the CTD on Ser5 is the canonical mark of this transition. In S. pombe, chemical-genetic inhibition
      of Mcs6 leaves PIC assembly and promoter-proximal Pol II unchanged but depletes Pol II downstream
      and blocks Cdk9/Pcm1 recruitment (PMID:19328067), i.e. the defect maps precisely to the initiation-to-elongation
      transition.
    action: ACCEPT
    reason: 'The ortholog-based transfer is consistent with the fission-yeast data: Mcs6 primes the CTD
      during initiation and its activity is needed for the polymerase to progress from an assembled PIC
      into productive elongation (PMID:19328067). This is the most mechanistically precise process term
      for the TFIIK/TFIIH kinase step and is compatible with the initiation (GO:0006367) and elongation-regulation
      (GO:0032968) annotations on either side of it.'
    additional_reference_ids:
    - PMID:19328067
    supported_by:
