    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD seeds are budding-yeast IMP annotations. The S. cerevisiae Kre6/Skn1 glucosidase
      IMP (PMID:10601196) rests on hydrophobic cluster analysis linking the proteins to GH16
