id: O13789
gene_symbol: SPAC17G6.11c
aliases:
- ghs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  SPAC17G6.11c encodes Ghs2 (Glycoside Hydrolase Sixteen domain 2), an essential Schizosaccharomyces
  pombe member of the Skn1/Kre6 family. It is a type II single-pass membrane glycoprotein with a
  cytosolic N-terminal region (residues 1-170), a signal-anchor transmembrane helix (171-191) and
  an extracellular/lumenal glycoside hydrolase family 16 (GH16) domain (218-587) that carries the
  conserved EXDXXE catalytic motif (E414-E419). Ghs2 travels through the secretory pathway and
  acts at the plasma membrane of the growing cell tips and the division site. There it is an
  obligate partner of the 1,3-beta-glucan synthase Bgs3, but not of Bgs1 or Bgs4. The two proteins
  co-localize, co-immunoprecipitate and need each other to localize, and the Ghs2
  transmembrane helix contributes to the interaction. Temperature-sensitive ghs2-2 (causative
  mutation F449L in the GH16 domain) and catalytic-motif mutants (E414A, E419A) cannot support
  growth, and Ghs2-E419A, which still keeps Bgs3 at the cell surface, acts as a dominant negative.
  Loss of Ghs2 function gives thick cell walls with large deposits of beta-glucan-rich material,
  and solid-state NMR shows less beta-1,3,6-branched glucan and beta-1,6-glucan. Ghs2 is
  proposed to add beta-1,6-linked branches to the linear beta-1,3-glucan made by Bgs3, by
  GH16-type transglycosylation. This branching activity is inferred from the domain, the
  catalytic-residue mutants and the wall chemistry; it has not been measured biochemically.
  The GH16 domain is also the likely target of the Kre6-directed antifungal compound D75-4590:
  the Y478I substitution confers resistance.
