- id: PMID:37792890
  title: Elevated levels of sphingolipid MIPC in the plasma membrane disrupt the coordination
    of cell growth with cell wall formation in fission yeast.
  findings:
  - statement: Names SPAC17G6.11c as Ghs2. It is essential, predicted to localize to the plasma
      membrane and to carry a GH16 laminarinase-like domain.
    supporting_text: the uncharacterized protein encoded by SPAC17G6.11c was of particular interest
      because it is essential, potentially localizes to the PM, and contains a Glycoside Hydrolase
      16 domain with homology to laminarinases which are β1,3 glucanases
  - statement: The temperature-sensitive ghs2-2 allele accumulates cell wall deposits between the
      plasma membrane and the existing wall, and interacts negatively with glucan synthase alleles.
    supporting_text: We observed cell wall deposits between the PM and existing cell wall at the restrictive
      temperature in ghs2-2 cells
  - statement: Ghs2 is described as an N-glycosylated plasma membrane protein needed for cell wall assembly.
    supporting_text: we identified Ghs2 as a previously uncharacterized N-glycosylated PM protein that
      is key to proper cell wall assembly
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC10578601). The first characterization and naming of Ghs2 and the
      source of the ghs2-2 allele. It is reference 33 of PMID:42786154, which cites it for the
      ghs2-2 wall deposits and for the T205P/F449L mutations. Its cell wall IMP is sound; the plasma
      membrane location is stated but not imaged in detail here.
- id: PMID:42786154
  title: A bipartite glucan synthase-remodeler module organizes branched glucan assembly
    in the fungal cell wall.
  findings:
  - statement: GFP-Ghs2 localizes to cell tips and the division site and co-localizes with Bgs3 there
      and in internal puncta. In bgs3-1 at 36 °C it becomes almost entirely cytoplasmic.
    supporting_text: GFP-Ghs2 localized to cell tips and the cell division site at both 25 °C and 36°C
  - statement: Ghs2 is needed for Bgs3 localization but not for Bgs1, Bgs4 or Ags1 localization.
    supporting_text: Ghs2 is specifically required for the proper subcellular localization of Bgs3, but
      not other glucan synthases
  - statement: HA3-Ghs2 co-immunoprecipitates with GFP-Bgs3 but not with RFP-Bgs4.
    supporting_text: HA3-Ghs2 and GFP-Bgs3 co-immunoprecipitated (Fig. 3b), whereas GFP-Ghs2 and RFP-Bgs4
      did not
  - statement: The Ghs2 TM helix can be replaced by the related Sbg1 TM helix but not by the unrelated
      Wsc1 helix. F449L in the GH16 domain is the causative mutation in ghs2-2.
    supporting_text: ghs2-T205P supported growth in ghs2-2 cells at the non-permissive temperature, whereas
      ghs2-F449L did not
  - statement: The catalytic-motif mutants E414A and E419A fail to complement. E419A keeps Bgs3 at
      the cell surface but causes severe wall defects and behaves as a dominant negative.
    supporting_text: The strong deleterious phenotype also suggests that ghs2-E419A behaves as a dominant-negative
      allele
  - statement: ghs2-2 and bgs3-1 cells have similarly thickened walls and large wall-material deposits.
    supporting_text: both ghs2-2 and bgs3-1 cells had markedly similar phenotypes with thickened cell walls
      and large pockets of excess wall material along the lateral sides and at the tips
  - statement: Solid-state NMR shows that ghs2-2 reduces mobile branched (beta-1,3,6) glucan by about
      17% and beta-1,6-glucan by about 30%, and that rigid-phase beta-1,6-glucan is undetectable in
      the mutants.
    supporting_text: the β-1,3,6-glucopyranose containing branched glucan (BBr) of bgs3-1 and ghs2-2 was
      reduced by ~ 58% and ~ 17%, respectively and, β-1,6-glucan was reduced by ~ 45% and ~ 30%, respectively
  - statement: D75-4590 phenocopies Ghs2 loss, and Ghs2-Y478I (analogous to the resistant Kre6 F552I)
      lowers sensitivity.
    supporting_text: Together, these data indicate that Y478 contributes to D75-4590 sensitivity, supporting
      a conserved inhibitor-binding site within the GH16 domain.
  - statement: The branching activity is a proposed model; the biochemical activity of Ghs2 was not measured.
    supporting_text: In contrast, the biochemical role of Ghs2 is unclear, although GH16 domains typically
      hydrolyze or transglycosylate β-glucans at various linkage sites
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC13612389). It establishes the Ghs2-Bgs3 partnership by co-localization,
      mutual localization dependence and co-IP, and gives TEM, solid-state NMR and inhibitor genetics.
      The branching chemistry is inferred, not assayed. The AlphaFold3 placement of the GH16 domain
      next to the Bgs3 extrusion pore is not a confident prediction in the deposited model
      (inter-chain PAE about 20-23 A; see the bgs3 review's AF3 re-analysis), so it is not used here
      as evidence for the GH16 position. Only the TM-TM interface is confidently predicted.
