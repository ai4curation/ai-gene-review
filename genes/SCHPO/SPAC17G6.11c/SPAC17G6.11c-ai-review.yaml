- term:
    id: GO:0070880
    label: fungal-type cell wall beta-glucan biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:42786154
  qualifier: involved_in
  review:
    summary: Solid-state NMR of intact ghs2-2 walls shows less beta-1,3,6-branched glucan and
      beta-1,6-glucan, and catalytic-motif mutants of the Ghs2 GH16 domain are non-functional.
    action: NEW
    reason: >-
      Ghs2 does some of the work of this process, not just support it. The gene product
      needed for the step is a GH16 enzyme whose catalytic glutamates (E414, E419) are required in
      vivo. Ghs2-E419A still keeps Bgs3 at the cell surface yet gives severe wall defects and acts
      dominant-negatively, which separates its catalytic contribution from a role as a
      scaffold for Bgs3. In ghs2-2 walls, solid-state NMR shows less branched (beta-1,3,6) glucan,
      less mobile beta-1,6-glucan and no detectable rigid beta-1,6-glucan. This makes the product
      composition, not only the wall's shape, dependent on Ghs2. The comparator check is
      favourable: the budding-yeast family members Kre6 and Skn1 carry the sibling term
      (1->6)-beta-D-glucan biosynthetic process by IMP, and the Bgs synthases carry the (1->3)
      descendant of this term. The new term is neither an ancestor nor a descendant of
      GO:0006078, and it covers the branched beta-1,3-glucan that the 2026 model puts at the centre
      of Ghs2's role. The exact reaction is inferred, not assayed, so the molecular function is
      left as a proposed term, not asserted.
    supported_by:
    - reference_id: PMID:42786154
      supporting_text: the β-1,3,6-glucopyranose containing branched glucan (BBr) of bgs3-1 and ghs2-2
        was reduced by ~ 58% and ~ 17%, respectively and, β-1,6-glucan was reduced by ~ 45% and
        ~ 30%, respectively
    - reference_id: PMID:42786154
      supporting_text: In contrast, mCherry-Bgs3 localized robustly to cell tips and the cell division
        site in cells expressing ghs2-E419A at 36 °C
    - reference_id: PMID:42786154
      supporting_text: The strong deleterious phenotype also suggests that ghs2-E419A behaves as a dominant-negative
        allele
    - reference_id: PMID:42786154
      supporting_text: Together, these findings identify the Ghs2-Bgs3 complex as the key determinant
        of branched β-glucan and β-1,6-glucan content
core_functions:
- description: >-
    Plasma membrane-anchored GH16 partner of the 1,3-beta-glucan synthase Bgs3 at growing cell tips
    and the division site. Ghs2 and Bgs3 depend on each other for localization and associate
    physically. The extracellular GH16 domain, through its catalytic glutamates, is required for
    normal amounts of branched beta-1,3,6-glucan and beta-1,6-glucan in the wall. It is proposed to
    add beta-1,6-linked branches to the nascent linear beta-1,3-glucan made by Bgs3. The catalytic
    activity has not been measured, so no molecular function term is asserted (see
    proposed_new_terms).
  directly_involved_in:
  - id: GO:0070880
    label: fungal-type cell wall beta-glucan biosynthetic process
  - id: GO:0006078
    label: (1->6)-beta-D-glucan biosynthetic process
  - id: GO:0031505
    label: fungal-type cell wall organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0051286
    label: cell tip
  - id: GO:0032153
    label: cell division site
  supported_by:
  - reference_id: PMID:42786154
    supporting_text: Ghs2 and Bgs3 are co-dependent for proper localization to cell tips and the division
      site
  - reference_id: PMID:42786154
    supporting_text: HA3-Ghs2 and GFP-Bgs3 co-immunoprecipitated (Fig. 3b), whereas GFP-Ghs2 and RFP-Bgs4
      did not
  - reference_id: PMID:42786154
    supporting_text: these findings support a model in which Bgs3 synthesizes linear β-1,3-glucan and
      Ghs2 subsequently introduces β-1,6-linked branch points onto the nascent polymer
  - reference_id: PMID:42786154
    supporting_text: Together, these findings identify the Ghs2-Bgs3 complex as the key determinant of
      branched β-glucan and β-1,6-glucan content
  knowledge_gaps:
  - gap_statement: The catalytic activity of the Ghs2 GH16 domain is undetermined. Neither the
      reaction (beta-1,6 branching transglycosylation vs. hydrolysis vs. another linkage), the donor
      and acceptor substrates, nor whether Ghs2 acts on the nascent Bgs3 chain or on wall glucan has
      been measured.
    boundary: Established are the obligate partnership and mutual localization dependence with Bgs3,
      the in vivo requirement for the E414 and E419 catalytic glutamates, the dominant-negative
      behaviour of E419A, and the loss of branched and beta-1,6-glucan in ghs2-2 walls.
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    significance: Ghs2 would be the first enzyme shown to make the beta-1,6 branch points of fungal
      beta-1,3-glucan. It is also the likely target of Kre6-directed antifungals such as D75-4590,
      whose inhibited activity is likewise undefined.
    resolution: In vitro assay of the purified GH16 domain, or of the reconstituted Bgs3-Ghs2 complex,
      on defined beta-1,3-glucan oligosaccharides, with linkage analysis of the products; then
      annotation to the proposed branching activity term if confirmed.
    provenance:
    - reference_id: PMID:42786154
      supporting_text: In contrast, the biochemical role of Ghs2 is unclear, although GH16 domains
        typically hydrolyze or transglycosylate β-glucans at various linkage sites
    - reference_id: PMID:42786154
      supporting_text: there is no direct biochemical evidence defining the specific enzymatic activity
        inhibited by these compounds
proposed_new_terms:
- proposed_name: (1->3)-beta-D-glucan 6-beta-glucanosyltransferase (branching) activity
  proposed_definition: >-
    Catalysis of the transfer of a (1->3)-beta-D-glucosyl segment from a (1->3)-beta-D-glucan donor
    to the O-6 hydroxyl of a glucose residue in a (1->3)-beta-D-glucan acceptor, creating a
    (1->6)-beta-D-glucosidic branch point.
  justification: >-
    Candidate term only, for the activity proposed for Ghs2 and possibly for the Kre6/Skn1 family.
    GO has a 1,4-alpha-glucan branching enzyme activity, and 1,3-beta-glucanosyltransferase activity
    (GO:0042124) is defined as chain elongation, but there is no term for creating beta-1,6 branch
    points on beta-1,3-glucan. The Ghs2 data (catalytic glutamates required, branched glucan reduced)
    are consistent with this activity but do not demonstrate it. The term should not be used for
    Ghs2 until the reaction has been assayed. Fungal Bgl2/Crh-type GH16/GH17 transglycosylases
    would be comparators.
  proposed_parent:
    id: GO:0016758
    label: hexosyltransferase activity
  supported_by:
  - reference_id: PMID:42786154
    supporting_text: these findings support a model in which Bgs3 synthesizes linear β-1,3-glucan and
      Ghs2 subsequently introduces β-1,6-linked branch points onto the nascent polymer
  - reference_id: PMID:42786154
    supporting_text: Our modeling and genetic evidence further support that the Ghs2 GH16 domain performs
      a branching reaction.
