  review:
    summary: InterPro2GO mapping from the beta-glucanase-like GH16 domain (IPR000757) to O-glycosyl
      hydrolase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: Ghs2 does have a GH16 domain with the conserved EXDXXE catalytic motif, and the in vivo
      function needs the catalytic glutamates (E414A and E419A fail to complement). So some
      GH16-type catalysis on beta-glucan is likely. But no activity of Ghs2, or of the Kre6/Skn1
      family, has been assayed. GH16 enzymes can hydrolyse or transglycosylate, and the only
      model for Ghs2 is transglycosylation that makes beta-1,6 branch points. Net hydrolysis is
      not the proposed function. The domain mapping is reasonable as an ancestral family
      property, but as a statement about what Ghs2 does it is an unsupported over-annotation.
