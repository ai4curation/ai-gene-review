    action: ACCEPT
    reason: The Kre6/Skn1 clade's role in beta-1,6-glucan formation is conserved and well supported,
      and Ghs2 (about 46% identical to Kre6, same architecture) is inside that clade. Ghs2-specific
      evidence agrees. In ghs2-2 cells, rigid-phase beta-1,6-glucan is no longer detectable and
