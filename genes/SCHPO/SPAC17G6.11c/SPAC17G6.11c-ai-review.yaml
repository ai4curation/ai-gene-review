suggested_questions:
- question: Should a molecular-function term for creating beta-1,6 branch points on beta-1,3-glucan
    be added to GO (see proposed_new_terms), and should the family-level glucosidase activity IBA
    at the Skn1/Kre6 node be revisited, given that its seed rests on sequence similarity rather than
    an assay?
- question: Is the Ghs2-Bgs3 assembly a stable stoichiometric complex that GO should represent, and
    should the analogous Sbg1-Bgs1 pairing be represented in the same way?
- question: Does Ghs2 act on the nascent Bgs3 chain as it is extruded or on glucan already in the
    wall, and what does the AF3 model, whose GH16 placement is not confident, actually
    constrain?
- question: Is the ER/ER-membrane localization of Ghs2 only a transit or overexpression signal, and
    should the is_active_in qualifiers on the ER rows be changed to located_in?
suggested_experiments:
- hypothesis: The Ghs2 GH16 domain transfers beta-1,3-glucan segments onto O-6 of beta-1,3-glucan
    acceptors.
  description: Express and purify the Ghs2 GH16 ectodomain (wild type, E414A, E419A, Y478I). Assay
    it on laminari-oligosaccharides and laminarin, with and without D75-4590. Analyse the products by
    HPAEC, MS and methylation linkage analysis to tell beta-1,6 branching transglycosylation from
    hydrolysis.
  experiment_type: in vitro enzymology
- hypothesis: Ghs2 branches the glucan produced by Bgs3 as it is made.
  description: Reconstitute Bgs3 with wild-type or E419A Ghs2 in proteoliposomes, feed UDP-[13C]glucose,
    and measure branch-point formation in the product by solid-state NMR or linkage analysis.
  experiment_type: biochemical reconstitution
- hypothesis: Ghs2 acts at the plasma membrane, not in the ER.
  description: Image endogenously tagged Ghs2 with ER and plasma membrane markers, and test whether
    a mutant held in the ER (for example, in a secretion mutant) supports branched-glucan synthesis.
  experiment_type: cell biology
