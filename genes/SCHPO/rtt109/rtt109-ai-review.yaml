  review:
    summary: >-
      Proposed GO-Central PAINT annotation for fission-yeast Rtt109 H3K56
      acetyltransferase activity.
    action: NEW
    reason: >-
      rtt109 is the S. pombe member of the active PTHR31571:SF2 RTT109
