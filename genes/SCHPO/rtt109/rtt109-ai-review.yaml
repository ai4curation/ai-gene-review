id: Q9Y7Y5
gene_symbol: rtt109
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Schizosaccharomyces pombe rtt109/kat11 encodes the fungal Rtt109 histone
  acetyltransferase that acetylates lysine 56 of histone H3 in a cell
  cycle-regulated nuclear chromatin program. Rtt109-dependent H3K56
  acetylation is linked to replication-coupled chromatin assembly and to
  tolerance of DNA damage during S phase.
