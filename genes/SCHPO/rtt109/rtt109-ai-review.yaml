      placement at PANTHER:PTN001586545.
- id: PMID:17369611
  title: Regulation of histone H3 lysine 56 acetylation in Schizosaccharomyces pombe.
  findings:
  - statement: S. pombe H3K56 acetylation is cell-cycle regulated and responds to
      genotoxic agents that damage DNA during replication.
    supporting_text: Lys-56 acetylation in Schizosaccharomyces pombe occurs transiently
      during passage through S-phase and is normally removed in G(2)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in the local cache. Directly studies
      the fission-yeast H3K56ac system that PomBase used as descendant evidence for
      the PTHR31571 PAINT node.
- id: PMID:17690098
  title: Acetylation of lysine 56 of histone H3 catalyzed by RTT109 and regulated
    by ASF1 is required for replisome integrity.
  findings:
  - statement: The S. pombe Rtt109 homolog has Asf1-dependent H3K56 HAT activity in
      vitro.
    supporting_text: the Rtt109 homolog in Schizosaccharomyces pombe (SpRtt109) also
      displayed an Asf1-dependent H3-K56 HAT activity in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in the local cache, but the abstract
      explicitly reports the S. pombe Rtt109 biochemical activity.
