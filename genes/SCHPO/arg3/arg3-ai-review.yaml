suggested_questions:
- question: 'How does Trx2 support arg3 levels independently of its catalytic cysteines: chaperoning import
    or folding, or stabilising the matrix enzyme?'
- question: Should GO record a mitochondrial citrulline export step in S. pombe, given the transporter
    (SPBC365.16) modelled in the PomBase GO-CAM?
suggested_experiments:
- description: Measure arg3 import and matrix stability (pulse-chase, protease protection) in trx2 deletion
    and cysteine-less trx2 strains.
