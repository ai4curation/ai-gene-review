taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: arg3 (SPAC4G9.10) encodes ornithine carbamoyltransferase (OTCase, EC 2.1.3.3), the ortholog
  of S. cerevisiae ARG3. It transfers the carbamoyl group of carbamoyl phosphate to L-ornithine to form
  L-citrulline. Unlike the cytosolic budding-yeast enzyme, S. pombe arg3 carries a mitochondrial targeting
  sequence and acts in the mitochondrial matrix together with the arginine-specific carbamoyl-phosphate
  synthetase (arg5/arg4), so fission yeast exports citrulline rather than ornithine from mitochondria.
  arg3 deletion causes arginine auxotrophy. arg3 levels and OTCase activity depend on the mitochondrial
  thioredoxin Trx2, which associates with arg3 and supports its function independently of its active-site
  cysteines; arg3 overexpression suppresses the arginine requirement of trx2 mutants.
