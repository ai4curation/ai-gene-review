  label: Schizosaccharomyces pombe 972h-
description: Small (72-residue) multi-pass ER-membrane regulatory subunit of the fission-yeast dolichol-phosphate-mannose
  synthase complex (dpm1-dpm2-dpm3). By homology with mammalian DPM2, it stabilises the dpm3 anchor subunit and enhances the
  catalytic activity of dpm1, which transfers mannose from GDP-mannose to dolichyl phosphate. The DPM2 subunit is absent from
  budding yeast, whose Dol-P-Man synthase is a single anchored polypeptide.
