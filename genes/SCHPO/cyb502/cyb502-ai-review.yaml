suggested_questions:
- question: Are Cyb502 and Oca8 redundant electron donors to the S. pombe sterol oxygenases (Erg25,
    Erg31/Erg32, Erg11), or does each paralog serve different ER or mitochondrial acceptors?
suggested_experiments:
- description: Construct cyb502 oca8 double deletions (alone and with ccr1 deletion) and profile sterols
    by GC-MS to test which sterol oxidation steps depend on cytochrome b5 in S. pombe and whether the two
    paralogs compensate for each other.
