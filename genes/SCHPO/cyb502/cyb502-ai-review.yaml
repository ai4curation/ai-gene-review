core_functions:
- description: Tail-anchored ER cytochrome b5 that carries single electrons from Cbr1 (NADH-cytochrome
    b5 reductase) to ER sterol oxygenases (C-5 desaturases Erg31/Erg32 in the PomBase model; C-4 methyl
    oxidase and CYP51 by homology with S. cerevisiae Cyb5). Probably partly redundant with Oca8.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
