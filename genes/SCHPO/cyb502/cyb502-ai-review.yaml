taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: cyb502 (SPBC29A10.16c) encodes one of two microsomal-type cytochrome b5 proteins in
  fission yeast (the other is oca8). It has an N-terminal heme-binding cytochrome b5 domain and a
  C-terminal tail anchor that inserts it into the endoplasmic reticulum membrane with the heme domain
  facing the cytoplasm. By homology with S. cerevisiae Cyb5 it is a one-electron carrier that accepts
  electrons from NADH-cytochrome b5 reductase (Cbr1) and delivers them to ER oxygenases of ergosterol
  synthesis, such as the C-5 sterol desaturases (Erg31/Erg32) and the C-4 methyl sterol oxidase. It
  has not been characterised biochemically in S. pombe, and its division of labour with Oca8 is
  unknown. Deletion is viable.
