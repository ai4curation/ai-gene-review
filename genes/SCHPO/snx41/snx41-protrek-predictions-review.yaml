description: >-
  ProTrek sequence-to-text retrieval for sorting nexin-41, a PX-BAR membrane adaptor of the Snx4 family.
  Ranks 1, 3, 4 and 5 are all correct: the annotated retrograde endosome-to-Golgi transport, the annotated
  PI3P binding that is this review's core molecular function, a late-endosome refinement and the cytoplasmic
  face of the endosome membrane. Both of this review's core functions are recovered. The free-text
  channel scores 21.50. Assessment: 1 correct novel (COR), 2 correct not novel (CNN).
