description: erg10 (SPBC215.09c; UniProt Q9UQW6) encodes the cytosolic acetoacetyl-CoA thiolase (acetyl-CoA
  C-acetyltransferase; EC 2.3.1.9). It condenses two acetyl-CoA into acetoacetyl-CoA, the first step of
  the mevalonate pathway, which leads to isopentenyl diphosphate and on to ergosterol and the other isoprenoids.
  Function is assigned by orthology to S. cerevisiae ERG10; a genome-wide screen places it in the cytosol.
