  label: Schizosaccharomyces pombe 972h-
description: nad1 (SPCC1235.04c; UniProt O74841) encodes FAD synthetase (FMN adenylyltransferase; EC 2.7.7.2),
  which adenylates FMN with ATP to form FAD, the second step in making flavin cofactors after riboflavin
  kinase (fmn1). Function is assigned by orthology to S. cerevisiae FAD1; it is cytosolic in a genome-wide
  screen.
