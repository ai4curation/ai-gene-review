taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Small (90-residue) ER-membrane subunit of the fission-yeast dolichol-phosphate-mannose synthase complex (dpm1-dpm2-dpm3).
  By homology with mammalian DPM3, its transmembrane N-terminal region sits in the ER membrane and its C-terminal coiled coil
  binds and tethers the soluble catalytic subunit dpm1, stabilising it and making the complex active. S. pombe dpm3 restores
  Dol-P-Man synthesis in DPM2-deficient hamster cells, showing that it functions as a DPM3 ortholog.
