taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ura5 (SPBC725.15) encodes the orotate phosphoribosyltransferase (OPRTase, EC 2.4.2.10) of fission yeast,
  a homodimeric PyrE-subfamily phosphoribosyltransferase that transfers the 5-phosphoribosyl group of PRPP to orotate
  to form orotidine 5'-monophosphate (OMP), the fifth step of de novo UMP synthesis. Loss of ura5 causes uracil
  auxotrophy and resistance to 5-fluoroorotic acid, so ura5 and ura4 mutations are the two classes of spontaneous
  5-FOA-resistant mutants. Unlike S. cerevisiae, which has two OPRTase paralogs (URA5 and URA10), S. pombe has a
  single ura5 gene. The enzyme is cytosolic.
