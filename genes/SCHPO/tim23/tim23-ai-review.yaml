core_functions:
- description: >-
    Tim23 is a core channel-forming subunit of the TIM23 presequence translocase
    that enables precursor protein translocation across the mitochondrial inner
    membrane for matrix import and TIM23-SORT inner-membrane insertion.
  supported_by:
  - reference_id: PMID:11713477
    supporting_text: >-
      The channel is formed by the C-terminal domain of Tim23 alone, whereas the
      N-terminal domain is required for selectivity and a high-affinity
      presequence interaction.
  - reference_id: PMID:11344168
    supporting_text: >-
      Depletion of either Tim17 or Tim23 led to loss of import competence of
      mitochondria and to a reduction in the number of preprotein-conducting
      channels.
