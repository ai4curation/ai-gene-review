      slot: With/From
      requested_change: CHECK
      asserted_value: UniProtKB:M0R003
      cause: UNKNOWN
      confidence: CONFIRMED
      explanation: >-
        The S. pombe tim23 ISO row to GO:0032977 membrane insertase activity
        uses UniProtKB:M0R003 as its With/From source, but M0R003 is an
        unreviewed Homo sapiens TIMM50 fragment rather than a Tim23 ortholog.
