  review:
    summary: >-
      Tim23 participates in TIM23-SORT inner-membrane insertion, but this ISO
      row is over-specific for its own WITH/FROM evidence: M0R003 is an
      unreviewed human TIMM50 fragment rather than a Tim23 ortholog.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Leave tim23 at GO:0008320 protein transmembrane transporter activity. The
      fetched ISO row does not support a Tim23 membrane-insertase molecular
      function because its supporting entity is TIMM50, and the process of
      TIM23-SORT inner-membrane insertion is already represented separately as
      GO:7770060.
    propagation_review:
