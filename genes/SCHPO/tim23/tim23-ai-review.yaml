  review:
    summary: >-
      This automatic process row is derived from the same unsupported
      GO:0032977 Tim23 insertase assertion and is too generic for the TIM23-SORT
      pathway.
    action: TOO_GENERAL
    reason: >-
      Establishment of protein localization to membrane is true for TIM23-SORT
