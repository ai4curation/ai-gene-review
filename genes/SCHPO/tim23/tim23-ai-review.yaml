  label: Schizosaccharomyces pombe 972h-
description: >-
  tim23 encodes the conserved Tim23 subunit of the mitochondrial TIM23
  presequence translocase. It is a multi-pass inner-membrane core component of
  the protein-conducting channel that transfers presequence-containing
  precursors into the matrix and participates in lateral sorting of selected
  inner-membrane proteins.
