  label: Schizosaccharomyces pombe 972h-
description: SPCC364.07 (UniProt P87228; the fission yeast SER3/SER33 ortholog) encodes D-3-phosphoglycerate
  dehydrogenase (EC 1.1.1.95). It oxidises 3-phosphoglycerate to 3-phosphohydroxypyruvate with NAD+, the
  first step of the phosphorylated pathway of serine biosynthesis from glycolysis. By similarity, it may
  also reduce 2-oxoglutarate to D-2-hydroxyglutarate. Function is assigned by orthology; a genome-wide
  screen places it in the cytosol.
