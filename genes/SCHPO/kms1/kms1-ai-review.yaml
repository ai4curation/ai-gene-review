suggested_questions:
- question: Kms1 has no InterPro KASH-domain match (only an EF-hand pair call of uncertain relevance)
    yet is treated as a canonical KASH protein. Does its C-terminal luminal tail bind the Sad1 SUN domain
    in the canonical KASH-groove manner, and is the EF-hand call real?
  experts:
  - LINC complex structural biologists
  - InterPro curators
- question: Should Kms1 carry a karyogamy process annotation (the kms1 name and original phenotype), and
    does Kms1 do work in nuclear fusion or only position SPBs for it?
  experts:
  - PomBase curators
suggested_experiments:
- description: Map and mutate the Kms1 C-terminal luminal tail and test Sad1 binding, Kms1 NE retention
    and telomere bouquet formation.
  hypothesis: A KASH-like luminal tail is necessary and sufficient for Sad1 binding and bouquet formation.
  experiment_type: mutagenesis with live-cell imaging
