  label: "Schizosaccharomyces pombe 972h-"
description: 'Kms1 (karyogamy meiotic segregation protein 1) is a KASH-domain protein of the fission yeast
  outer nuclear membrane. A C-terminal hydrophobic transmembrane segment and short luminal tail pair with
  the SUN protein Sad1 across the perinuclear space, forming the Sad1-Kms1 LINC complex that concentrates
  at the spindle pole body (SPB). Kms1 is present at the SPB in vegetative cells but is not required for
  vegetative growth. Its main role is in the sexual cycle: at karyogamy it sits at the leading edges of
  fusing nuclei, and in meiotic prophase it links the telomere bouquet (tethered to Sad1 through Rap1
  and Bqt1-Bqt2) to the SPB and to dynein-driven horsetail nuclear movement. kms1 mutants fail to form
  a single telomere cluster, have fragmented SPB/Sad1 material, and show reduced homolog pairing and allelic
  recombination with increased ectopic recombination. Its cytoplasmic region binds the dynein light chain
  Dlc1 in two-hybrid assays. In vegetative S/G2 cells, damage-induced Sad1-Kms1 foci couple persistent
  DNA double-strand breaks to microtubules and influence homology-directed repair pathway choice.'
