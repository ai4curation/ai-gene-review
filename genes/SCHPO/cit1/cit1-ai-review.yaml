  label: Schizosaccharomyces pombe 972h-
description: cit1 (SPAC6C3.04; UniProt Q10306) encodes the mitochondrial citrate synthase (EC 2.3.3.16),
  which condenses acetyl-CoA with oxaloacetate to citrate, the first step of the TCA cycle. Recombinant
  S. pombe citrate synthase is active and has been used as a substrate in chaperone assays. It is mitochondrial
  in a genome-wide screen.
