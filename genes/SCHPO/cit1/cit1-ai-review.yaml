- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000201223
  - UniProtKB:O75390
  review:
    summary: >-
      PAINT IBA for carbohydrate metabolic process on the citrate synthase node
      (PTN000201223); citrate synthase acts in the tricarboxylic acid cycle, and
      carbohydrate metabolic process is a broad grouping term that overstates a
      carbohydrate-specific role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Citrate synthase (Cit1) condenses acetyl-CoA and oxaloacetate to form
      citrate in the tricarboxylic acid (TCA) cycle (GO:0006099), which oxidizes
      acetyl-CoA derived from carbohydrates, fatty acids, and amino acids alike.
      Because GO:0006099 is not an ontology child of GO:0005975 (carbohydrate
      metabolic process), annotating Cit1 to carbohydrate metabolic process via
      PANTHER:PTN000201223 (seeded by human CS, UniProtKB:O75390) conflates the
      central TCA cycle step with upstream carbohydrate metabolism, matching the
      MARK_AS_OVER_ANNOTATED assessment on S. cerevisiae CIT1.
    supported_by:
    - reference_id: file:SCHPO/cit1/cit1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=oxaloacetate + acetyl-CoA + H2O = citrate + CoA + H(+);'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000201223
        source_label: PTN000201223
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Orthology across eukaryotic citrate synthases is valid, but the term
          is an overly broad pathway grouping for a TCA cycle enzyme.
      - source_id: UniProtKB:O75390
        source_label: CS
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human mitochondrial citrate synthase is a true ortholog of S. pombe
          Cit1, but GO:0005975 is an over-broad metabolic grouping.
