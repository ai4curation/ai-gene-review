  label: Schizosaccharomyces pombe 972h-
description: Putative ATP-dependent 5-oxoprolinase (Oxp2, SPAC11D3.14c; EC 3.5.2.9) of Schizosaccharomyces
  pombe, a 1260-residue member of the hydantoinase/oxoprolinase family. It is one of two complete paralogs,
  encoded by adjacent genes on opposite strands (oxp2 and oxp1); each carries both the hydantoinase A
  (actin-like ATPase) and hydantoinase B regions found in a single chain of S. cerevisiae Oxp1 and human
  OPLAH, so neither is a split half-enzyme. By orthology to the characterised S. cerevisiae Oxp1, it is
  expected to hydrolyse 5-oxo-L-proline (pyroglutamate) to L-glutamate coupled to ATP hydrolysis, recycling
  the 5-oxoproline produced when the ChaC-type enzyme Ggg1 degrades glutathione and by spontaneous cyclisation
  of glutamine/glutamate. The protein localises to the cytosol. No biochemical or genetic study of either
  S. pombe paralog has been reported.
