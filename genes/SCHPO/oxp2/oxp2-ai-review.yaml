suggested_questions:
- question: Are both Oxp1 and Oxp2 active 5-oxoprolinases, do they form homodimers or an Oxp1-Oxp2 heterodimer,
    and are they differentially expressed?
suggested_experiments:
- hypothesis: Oxp1 and Oxp2 are redundant 5-oxoprolinases.
  description: Measure intracellular 5-oxoproline by LC-MS and growth on 5-oxoproline as nitrogen source
    in oxp1, oxp2 and oxp1 oxp2 deletion strains; assay purified proteins for ATP-dependent 5-oxoproline
    hydrolysis.
