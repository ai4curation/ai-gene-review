core_functions:
- description: Cdk1-counteracting protein serine/threonine phosphatase that, after release from the nucleolus
    and relief of inhibitory Cdk1 phosphorylation in anaphase, dephosphorylates the mitotic inducer Cdc25
    (promoting its degradation and breaking the Cdc25-Cdc2 feedback loop) and other Cdk1 substrates such
    as Pxl1, thereby restraining the G2/M transition and promoting timely Cdk1 inactivation at exit from
    mitosis.
  supported_by:
  - reference_id: PMID:15128870
    supporting_text: Here we show that Flp1p is required for rapid degradation of the mitotic inducer
      Cdc25p at the end of mitosis, and that Cdc25p is a substrate of Flp1p in vitro. Down-regulation
      of Cdc25p activity by Flp1p may ensure a prompt inactivation of mitotic CDK complexes to trigger
      cell division.
    reference_section_type: ABSTRACT
  - reference_id: PMID:11448769
    supporting_text: In addition to its roles in anaphase, Clp1p regulates the G2/M transition since cells
      deleted for clp1 enter mitosis precociously and cells overexpressing Clp1p delay mitotic entry.
      Unlike Cdc14p, Clp1p appears to antagonize Cdk activity by preventing dephosphorylation of Cdc2p
      on tyrosine.
    reference_section_type: ABSTRACT
  - reference_id: PMID:16950131
    supporting_text: Cdk1 phosphorylates and inhibits the catalytic activity of the Cdc14 family member,
      Clp1/Flp1. As Cdk1 activity declines during anaphase progression, Clp1/Flp1 autocatalytically reverses
      these phosphorylation events to stimulate its own activity.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23297348
    supporting_text: Clp1 promotes mitotic exit by antagonizing the auto-amplification loop of Cdk1 by
      dephosphorylating Cdc25
    reference_section_type: INTRODUCTION
