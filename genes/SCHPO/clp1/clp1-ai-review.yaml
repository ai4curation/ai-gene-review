- description: Cytoplasmic phosphatase activity, tethered at the contractile ring by the anillin Mid1
    and held out of the nucleolus by SIN (Sid2)-dependent 14-3-3/Rad24 binding, that dephosphorylates
    Cdk1 sites on the F-BAR protein Cdc15, the formin Cdc12 and the SIN scaffold Cdc11, promoting contractile-ring
    assembly and robustness and sustaining septation initiation signaling so that a perturbed cytokinesis
    is completed before the next nuclear division (cytokinesis checkpoint).
  supported_by:
  - reference_id: PMID:18378776
    supporting_text: By generating a mutation in mid1 that selectively disrupts Clp1/Flp1 tethering, we
      reveal the specific functional consequences of Clp1/Flp1 activity at the CR, including dephosphorylation
      of the essential CR component Cdc15, reductions in CR protein mobility, and CR resistance to mild
      perturbation.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29343550
    supporting_text: At least some Cdk1 phosphosites on Cdc12 are dephosphorylated by Clp1, a member of
      the Cdc14 phosphatase family, thereby allowing maximal Cdc12 accumulation at the CR.
    reference_section_type: DISCUSSION
  - reference_id: PMID:15265986
    supporting_text: In addition, we show that Clp1p/Flp1p does not function simply to inhibit further
      rounds of nuclear division, but also allows damaged actomyosin rings to be maintained to facilitate
      completion of cell division. Ectopic activation of the SIN significantly bypasses the requirement
      of Clp1p/Flp1p for G2 delay as well as for completion of cytokinesis.
    reference_section_type: ABSTRACT
  - reference_id: PMID:16085489
    supporting_text: Here, we show that a phosphorylated form of Clp1p binds the 14-3-3 protein Rad24p
      and is retained in the cytoplasm in a Rad24p-dependent manner in response to cytokinesis defects.
      This physical interaction depends on the function of the SIN component, Sid2p.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23297348
    supporting_text: We confirmed association and dephosphorylation of multiple candidate substrates,
      including a key scaffolding component of the septation initiation network called Cdc11, an essential
      kinase of the conserved morphogenesis-related NDR kinase network named Shk1, and multiple Mlu1-binding
      factor transcriptional regulators.
    reference_section_type: ABSTRACT
