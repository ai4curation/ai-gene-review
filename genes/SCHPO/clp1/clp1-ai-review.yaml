suggested_questions:
- question: Which of the >70 substrate-trapping (Clp1-C286S) candidates from PMID:23297348 are direct
    in vivo substrates, and does Clp1 have any physiological phosphotyrosine substrate that would justify
    retaining a protein tyrosine phosphatase annotation?
- question: 'How should the opposite-sign effects of Clp1 on kinetochore attachment be represented: it
    repairs mono-oriented sister kinetochores with Aurora/Ark1 (PMID:15525536) yet antagonizes correction
    of merotelic attachments by lengthening the metaphase spindle via Klp9 (PMID:22264609), and GO currently
    offers only a positive-regulation term for biorientation?'
- question: 'What is the downstream effector of nucleoplasmic Clp1 after genotoxic stress (PMID:22918952):
    does it reset checkpoint-substrate phosphostates redundantly with other phosphatases, or act mainly
    through stress transcription factors such as Pcr1?'
suggested_experiments:
- hypothesis: Clp1 preferentially dephosphorylates Cdk1 pSer/pThr-Pro sites and has no phosphotyrosine
    substrates in vivo.
  description: Phosphoproteomics (including phosphotyrosine enrichment) comparing wild-type, clp1Δ and
    clp1-C286S cells released synchronously from an nda3-KM311 prometaphase block, cross-referenced with
    the Clp1-C286S substrate-trap interactome, to define the direct in vivo substrate set and test for
    any Clp1-dependent phosphotyrosine sites.
  experiment_type: phosphoproteomics
- hypothesis: Clp1 regulates kinetochore-microtubule attachment fidelity through Klp9-dependent control
    of metaphase spindle length rather than through a kinetochore-intrinsic substrate.
  description: Score lagging chromosomes and inter-kinetochore distance in clp1-NLS and clp1Δ cells combined
    with phospho-deficient (klp9-3A) and phospho-mimetic (klp9-3D) Klp9 alleles, and with ark1 hypomorphs,
    to separate the spindle-length (merotelic) pathway from the Aurora-dependent mono-orientation repair
    pathway.
  experiment_type: genetic interaction and live-cell imaging
