  review:
    summary: 'ARBA-predicted broad term. Clp1 is a mitotic cell-cycle regulator: it controls the G2/M
      transition, is released from the nucleolus at mitotic entry, dephosphorylates Cdk1 substrates in
      anaphase and couples cytokinesis to the nuclear cycle [PMID:11448769].'
    action: ACCEPT
    reason: Unquestionably true, if far less specific than the experimental rows (GO:0010972, GO:0031536,
      GO:0044878, GO:1902846) that capture the actual processes.
    supported_by:
    - reference_id: PMID:11448769
      supporting_text: We have identified the S. pombe Cdc14p homolog, Clp1p, and show that it is not
        required for mitotic exit but rather functions together with the SIN in coordinating cytokinesis
        with the nuclear-division cycle.
      reference_section_type: ABSTRACT
    - reference_id: PMID:11448769
      supporting_text: In addition to its roles in anaphase, Clp1p regulates the G2/M transition since
        cells deleted for clp1 enter mitosis precociously and cells overexpressing Clp1p delay mitotic
        entry. Unlike Cdc14p, Clp1p appears to antagonize Cdk activity by preventing dephosphorylation
        of Cdc2p on tyrosine.
      reference_section_type: ABSTRACT
