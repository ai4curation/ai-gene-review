- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IMP
  original_reference_id: PMID:22918952
  qualifier: involved_in
  review:
    summary: Broadus et al. 2012 showed that genotoxic stress (hydroxyurea, H2O2) but not heat or osmotic
      stress causes Clp1 to leave the nucleolus, through direct phosphorylation by the Rad3-dependent
      checkpoint kinases Cds1/Chk1, Pmk1 and Cdk1; phosphosite mutants that block this relocalization
      were characterized, and earlier work showed Clp1 release is needed for a normal checkpoint response
      to HU.
    action: KEEP_AS_NON_CORE
    reason: The gene product does respond to genotoxic stress in a checkpoint-kinase-dependent manner,
      so the term is correct, but the paper leaves the downstream role open (the authors suggest Clp1
      may reset checkpoint-substrate phosphostates redundantly with other phosphatases). This is a stress-specific,
      non-core function relative to the mitotic-exit/cytokinesis roles.
    supported_by:
    - reference_id: PMID:22918952
      supporting_text: Specifically, the Rad3 checkpoint effector kinases Cds1 and/or Chk1, the cell wall
        integrity mitogen-activated protein kinase Pmk1, and the cell cycle kinase Cdk1 directly phosphorylate
        Clp1 to promote genotoxic stress-induced nucleoplasmic accumulation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:22918952
      supporting_text: In contrast, Clp1-GFP did not relocalize to the nucleoplasm in either thermally
        or osmotically stressed cells (Figure 1, A–C) suggesting that nucleolar release is not a general
        response to cellular stress.
      reference_section_type: RESULTS
    - reference_id: PMID:22918952
      supporting_text: Alternatively, Clp1 may be involved in resetting the phosphostate of DNA replication/damage
        checkpoint substrates after resolution of a genotoxic insult in combination with other phosphatases,
        and its role may be masked by their presence.
      reference_section_type: DISCUSSION
