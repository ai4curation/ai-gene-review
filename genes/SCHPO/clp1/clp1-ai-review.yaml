  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Clp1 (also called Flp1) is the single Cdc14-family dual-specificity phosphoprotein phosphatase
  of the fission yeast Schizosaccharomyces pombe (537 aa; PTP-superfamily catalytic domain with the nucleophilic
  Cys286, followed by a disordered C-terminal tail carrying the Sid2 RxxS phosphosites and a Sal3-dependent
  nuclear localization signal). Although classified as a tyrosine phosphatase by fold, it physiologically
  removes phospho-Ser/Thr-Pro marks deposited by the cyclin-dependent kinase Cdc2 (Cdk1). During interphase
  Clp1 is sequestered in the nucleolus and at the spindle pole body; at mitotic entry it is released and
  distributes to the nucleoplasm, kinetochores, the mitotic spindle and midzone, the SPBs and the Mid1-tethered
  contractile ring, then returns to the nucleolus once cytokinesis is complete. Its activity is further
  gated by inhibitory Cdk1 phosphorylation that it reverses autocatalytically in anaphase, and the septation
  initiation network (SIN) kinase Sid2 phosphorylates its C-terminal RxxS sites to create a 14-3-3 (Rad24)
  binding site that holds Clp1 in the cytoplasm until the ring has constricted. Through these pools Clp1
  antagonizes Cdk1 and coordinates late mitosis with cell division: it dephosphorylates and destabilizes
  the mitotic inducer Cdc25, restraining the G2/M transition and hastening Cdk1 inactivation at mitotic
  exit; it dephosphorylates the kinesin-6 Klp9, the microtubule bundler Ase1 and the XMAP215 protein Dis1
  to drive anaphase B spindle elongation, and Nsk1 and the monopolin subunit Mde4 to support accurate
  chromosome segregation and biorientation; at the division site it dephosphorylates the F-BAR protein
  Cdc15, the formin Cdc12 and paxillin Pxl1 to promote contractile-ring assembly and stability; and, acting
  with the SIN and its scaffold Cdc11, it forms the cytokinesis checkpoint that delays the next nuclear
  division while a damaged ring is repaired. Unlike Saccharomyces cerevisiae Cdc14 it is not essential
  for mitotic exit or viability. Clp1 also leaves the nucleolus in interphase upon genotoxic or oxidative
  stress, phosphorylated by the checkpoint kinases Cds1/Chk1, the MAP kinase Pmk1 and Cdk1, and dephosphorylates
  the stress transcription factor Pcr1 to limit the oxidative-stress transcriptional response.'
