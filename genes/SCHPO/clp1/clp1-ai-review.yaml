- description: Nuclear phosphatase activity on the anaphase spindle, midzone and kinetochores that removes
    Cdk1 phosphates from the kinesin-6 Klp9, the bundler Ase1 and Dis1 to drive anaphase B spindle elongation,
    and from the kinetochore proteins Nsk1 and monopolin Mde4 to promote kinetochore-SPB association and
    sister-chromatid biorientation, ensuring accurate chromosome segregation.
  supported_by:
  - reference_id: PMID:19686686
    supporting_text: At the onset of anaphase B, clp1p (also known as flp1p (Cueille et al., 2001), homolog
      of Cdc14) dephosphorylates klp9p and ase1p, allowing them to physically bind to each other at the
      spindle midzone to initiate spindle elongation.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19686686
    supporting_text: whereas wildtype cells exhibited stereotypical anaphase B velocity (0.68 ± 0.09 n=11
      μm/min), mutants clp1off and ase1S>D-klp9S>D cells showed significantly decreased spindle velocities
      (0.35 ± 0.05 n=9 and 0.48 ± 0.08 n=12 μm/min, respectively)
    reference_section_type: RESULTS
  - reference_id: PMID:21965289
    supporting_text: Following dephosphorylation by Clp1 (Cdc14-like) phosphatase and at least one other
      phosphatase, Nsk1 localizes to the interface between kinetochores and the inner face of the spindle
      pole body during anaphase.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15525536
    supporting_text: Here, we report that Clp1p/Flp1p localizes to kinetochores in prometaphase and functions
      in chromosome segregation, since deletion of clp1/flp1 causes cosegregation of sister chromatids,
      when sister kinetochores are prone to mono-orientation.
    reference_section_type: ABSTRACT
