  review:
    summary: 'PAINT-inferred role in microtubule cytoskeleton organization. In fission yeast this is well
      grounded: at anaphase B onset Clp1 dephosphorylates the kinesin-6 Klp9, the bundler Ase1 and the
      XMAP215 protein Dis1 so that Klp9 is recruited to the antiparallel midzone and the anaphase spindle
      elongates at the normal rate [PMID:19686686, PMID:34080538].'
    action: KEEP_AS_NON_CORE
    reason: The phylogenetic placement is sound (the node is seeded by S. cerevisiae Cdc14 and C. elegans
      cdc-14, and Clp1 has direct evidence of the same kind), but spindle organization is one downstream,
      substrate-specific consequence of the enzyme's core activity of reversing Cdk1 phosphorylation.
      It is retained as a genuine but non-core process; the specific fission-yeast evidence is captured
      by the GO:1902846 rows.
    supported_by:
    - reference_id: PMID:19686686
      supporting_text: At the onset of anaphase B, clp1p (also known as flp1p (Cueille et al., 2001),
        homolog of Cdc14) dephosphorylates klp9p and ase1p, allowing them to physically bind to each other
        at the spindle midzone to initiate spindle elongation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:34080538
      supporting_text: Consequently, the spindle elongation velocity in anaphase B was reduced upon clp1
        deletion
      reference_section_type: RESULTS
