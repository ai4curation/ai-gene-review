  label: Schizosaccharomyces pombe 972h-
description: alg2 (SPBC11B10.01; UniProt Q96WW6) encodes the bifunctional alpha-1,3/alpha-1,6-mannosyltransferase
  Alg2, which adds the second and third mannoses to form the Man3GlcNAc2 core. In the cytoplasmic phase
  of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol) assembly on the ER membrane, it adds the
  next sugar to the growing precursor that oligosaccharyltransferase transfers to nascent glycoproteins.
  Function is assigned by orthology to the S. cerevisiae ALG enzymes.
