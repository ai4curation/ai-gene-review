  label: Schizosaccharomyces pombe 972h-
description: pcd1 (SPAC1556.04c; UniProt Q09190) encodes a putative zinc cytidine deaminase (EC 3.5.4.5),
  the ortholog of S. cerevisiae CDD1. It deaminates cytidine and deoxycytidine to uridine and deoxyuridine,
  routing pyrimidine nucleosides into uridine salvage. Function is assigned by orthology; it is cytosolic
  in a genome-wide screen.
