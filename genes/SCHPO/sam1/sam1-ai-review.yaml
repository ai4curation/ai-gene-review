  label: Schizosaccharomyces pombe 972h-
description: sam1 (SPBC14F5.05c; UniProt O60198) encodes the only S-adenosylmethionine synthetase (methionine
  adenosyltransferase; EC 2.5.1.6) of fission yeast. It condenses L-methionine and ATP into SAM, the universal
  methyl donor and the entry point of the methionine cycle. sam1 is essential. Low expression reduces
  mating and sporulation, and overexpression makes growth methionine-sensitive, which adenine partly relieves.
  The enzyme is cytosolic in a genome-wide screen.
