taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC17H9.13c (UniProt O13810; the fission yeast PRO1 ortholog, classical pro2 locus) encodes
  glutamate 5-kinase (EC 2.7.2.11), an amino-acid-kinase-family enzyme with a C-terminal PUA domain. It
  phosphorylates L-glutamate to L-glutamyl-5-phosphate, the first and feedback-regulated step of proline
  biosynthesis from glutamate. Function is assigned by orthology.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002478
  - InterPro:IPR036974
  review:
    summary: InterPro2GO mapping of the C-terminal PUA domain (IPR002478, IPR036974) to RNA binding; no
      member of the glutamate 5-kinase family has been shown to bind RNA.
    action: REMOVE
    reason: The PUA-to-RNA-binding mapping reflects RNA-modifying PUA proteins such as pseudouridine
      synthases. In glutamate 5-kinases the PUA domain modulates the amino-acid-kinase domain (dissection
      of the orthologous E. coli ProB), and SPAC17H9.13c is a member of that family. Removed as an
      over-propagated domain-to-function mapping, consistent with the same row in the E. coli and P.
      putida proB and S. cerevisiae PRO1 reviews; the family-wide argument is recorded in the notes of
      the PTHR43654 family review.
    additional_reference_ids:
    - PMID:16337196
    supported_by:
    - reference_id: PMID:16337196
      supporting_text: We propose that the PUA domain modulates the function of the AAK domain
    - reference_id: file:SCHPO/SPAC17H9.13c/SPAC17H9.13c-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the glutamate 5-kinase family.
