taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg5 (SPAC19A8.04; cyp61) encodes the cytochrome P450 sterol C-22 desaturase (CYP61) of Schizosaccharomyces
  pombe. Using O2 and NADPH-derived electrons from P450 reductase it introduces the C22=C23 double bond into the
  side chain of 5-dehydroepisterol (ergosta-5,7,24(28)-trienol), giving ergosta-5,7,22,24(28)-tetraen-3beta-ol,
  the substrate of the final reductase erg4 (EC 1.14.19.41). erg5 deletion mutants are viable but lack ergosterol
  and grow even when lanosterol and ergosterol are depleted further by terbinafine. Erg5 binds the heme protein
  Dap1 (PGRMC1 homolog), which is required for full activity of the two sterol P450s Erg11 and Erg5. erg5 is induced
  by Sre1 under low oxygen.
