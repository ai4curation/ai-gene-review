suggested_questions:
- question: Does Dap1 act on Erg5 as a heme chaperone, an electron-transfer partner, or a structural activator,
    and is ccr1 (P450 reductase) the sole reductant for S. pombe Erg5?
- question: Is S. pombe Erg5 inhibited by azoles as S. cerevisiae CYP61 is, and does erg5 deletion alter azole sensitivity?
suggested_experiments:
- hypothesis: Dap1 binding is required for heme incorporation or stability of Erg5.
  description: Measure Erg5 heme content, CO-difference spectrum and C-22 desaturase activity in microsomes from
    wild-type and dap1-deleted S. pombe.
  experiment_type: biochemistry
