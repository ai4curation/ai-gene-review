  label: Schizosaccharomyces pombe 972h-
description: erg26 (SPBC3F6.02c) encodes the C-3 sterol dehydrogenase/C-4 decarboxylase (sterol-4alpha-carboxylate
  3-dehydrogenase, decarboxylating; EC 1.1.1.170) of Schizosaccharomyces pombe, an extended short-chain dehydrogenase/reductase
  of the 3-beta-HSD family. Using NAD(P)+, it oxidises the 3beta-hydroxyl of 4alpha-carboxy sterols and decarboxylates
  them to 3-keto sterols, the second reaction of each C-4 demethylation round between Erg25 (oxidase) and Erg27
  (3-ketoreductase). It is a peripheral protein of the ER membrane and, by homology, part of the Erg25-Erg26-Erg27-Erg28
  C-4 demethylation complex.
