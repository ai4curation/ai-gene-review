suggested_questions:
- question: 'How does TORC1 inhibit Ppk18: by direct phosphorylation, through the S6K-like kinase Sck2,
    or through 14-3-3 sequestration as for Rim15? Is Ppk18 also activated by Cdk1 phosphorylation of its
    many Ser/Thr-Pro sites, as for metazoan Greatwall?'
  experts:
  - Sergio Moreno
  - Livia Perez-Hidalgo
- question: What is the division of labour between Ppk18, Cek1 and Ppk31 toward Igo1 in mitotic size control
    versus quiescence entry, and does the C-terminal CheY-like receiver domain or the PAS-like N-terminus
    of Ppk18 receive a signal?
  experts:
  - Sergio Moreno
  - Sandra Lopez-Aviles
suggested_experiments:
- hypothesis: Ppk18 relocalizes (cytosol to nucleus, or to a specific cytoplasmic site) when TORC1 is
    inhibited, analogous to Rim15 in budding yeast.
  description: Live imaging of endogenously tagged Ppk18-GFP in rich medium, after nitrogen removal and
    after Torin1/rapamycin-caffeine treatment, with Igo1-mCherry as a co-marker; would settle the nucleus-versus-cytosol
    question left open by the IBA and the ORFeome screen.
  experiment_type: live-cell imaging
- hypothesis: Igo1 Ser64 is the only physiologically relevant Ppk18 substrate; other phosphorylation changes
    in ppk18 deletion cells are secondary to PP2A-B55 reactivation.
  description: Quantitative phosphoproteomics of wild type, ppk18 deletion, ppk18 cek1 double deletion
    and igo1-S64A cells shortly after nitrogen removal, with and without pab1 deletion, to separate direct
    Ppk18 sites from PP2A-B55-dependent losses.
  experiment_type: phosphoproteomics / genetics
