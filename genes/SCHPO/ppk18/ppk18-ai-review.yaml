taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Ppk18 is one of the two Greatwall (MASTL/Rim15-family) AGC serine/threonine protein kinases
  of Schizosaccharomyces pombe (the other is Cek1, with Ppk31 a more distant relative). It has a canonical
  kinase domain (residues 566-934) followed by an AGC C-terminal extension and, unusually, a C-terminal
  CheY-like response-regulator receiver domain and an N-terminal PAS-like region of unknown function.
  Its established substrate is the endosulfine Igo1, which it phosphorylates on the conserved Ser64; phospho-Igo1
  binds and inhibits the PP2A-B55 holoenzyme (PP2A-Pab1). Ppk18 is held inactive by TORC1 in nutrient-rich
  medium. When nitrogen becomes limiting and TORC1 activity falls, Ppk18 is activated, Igo1 is phosphorylated,
  PP2A-B55 is inhibited, and the resulting accumulation of Cdk1-dependent phosphorylation on the Cdc25/Wee1
  control system allows full activation of Cdk1-cyclin B and entry into mitosis at a smaller cell size;
  ppk18 deletion cells fail to reduce their size in poor nitrogen, whereas moderate overexpression advances
  mitosis even in rich medium. The same Greatwall-endosulfine-PP2A-B55 switch relays nitrogen starvation
  to TORC2-Gad8 signalling and to the SAGA subunit Taf12, and is required for efficient commitment to
  sexual differentiation (mating and sporulation), for nitrogen-starvation G1 arrest, and, together with
  Cek1, for survival in quiescence, where the pathway supports Elongator-dependent tRNA modification and
  translation of quiescence transcripts. Under nutrient-rich growth ppk18 deletion has no cell-size or
  morphology phenotype on its own, but it shows synthetic size and shape defects with loss of the PP2A/PP6
  inhibitor Sds23. A genome-wide YFP screen places the protein in the cytosol.
