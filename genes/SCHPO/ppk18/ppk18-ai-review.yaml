- term:
    id: GO:1902472
    label: regulation of mitotic cytokinesis, division site positioning
  evidence_type: IGI
  original_reference_id: PMID:31553675
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPBC646.13
  review:
    summary: Schutt and Moseley 2019 (full text cached) tested ppk18 deletion in combination with sds23
      deletion. The double mutant showed more bent cells and a larger division size than either single
      mutant, but the authors state that the division-symmetry (cell half ratio) trend was not significantly
      different from sds23 deletion alone, and ppk18 deletion alone has no division-site defect.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IGI is real and the curator's reading is correct, but the specific claim, that Ppk18 regulates
      division-site positioning, rests on a non-significant trend that the authors themselves flag; the
      significant synthetic phenotypes in the same figure are cell shape and cell size at division, which
      the paper attributes to both pathways converging on PP2A to control mitotic entry (already captured
      by GO:1905287/GO:0007346). The annotation is not wrong in spirit (excess PP2A activity in the double
      mutant may well perturb CAR placement) but overstates the evidence for a division-plane role of
      Ppk18.
    supported_by:
    - reference_id: PMID:31553675
      supporting_text: Lastly, the cell half ratio was even further reduced for double mutant cells, but
        we note that the double mutants were not significantly different from sds23∆ alone despite this
        trend (Figure 5E).
