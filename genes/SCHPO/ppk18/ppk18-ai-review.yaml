- term:
    id: GO:0031139
    label: positive regulation of conjugation with cellular fusion
  evidence_type: IMP
  original_reference_id: PMID:29079657
  qualifier: involved_in
  review:
    summary: Laboucarie et al. 2017 (abstract-only in cache; full text consulted at PMC) show that ppk18
      deletion, like igo1 deletion and the igo1-S64A knock-in, weakly induces ste11+/mei2+ expression
      and sexual differentiation on starvation and fails to induce Taf12 phosphorylation; the sterility
      of ppk18 deletion is suppressed by removing PP2A-B55 (pab1).
    action: ACCEPT
    reason: 'Ppk18 does the work here: its Igo1-mediated inhibition of PP2A-B55 is what allows the TORC2/Gad8-driven
      Taf12 phosphorylation and commitment to mating once starvation is sensed, and pab1 deletion epistatically
      rescues the ppk18 sterility. The cached abstract states only the PP2A/TORC1 and Gad8/TORC2 arms;
      the ppk18 mutant data are in the full text (Fig 5, Appendix Fig S8), which the PomBase curator read.
      Promotion of conjugation is a genuine, if pleiotropic, output of the same nutrient-signalling switch
      and is retained.'
    supported_by:
    - &id012
      reference_id: PMID:29079657
      supporting_text: Taf12 phosphorylation increases early upon starvation and is controlled by the
        opposing activities of the PP2A phosphatase, which is activated by TORC1, and the TORC2-activated
        Gad8AKT kinase.
    - &id013
      reference_id: PMID:29079657
      supporting_text: Mutational analyses suggest that Taf12 phosphorylation prevents cells from committing
        to differentiation until starvation reaches a critical level.
    - &id014
      reference_id: file:SCHPO/ppk18/ppk18-deep-research-falcon.md
      supporting_text: Consistent with this connection, deletion of *ppk18* or *igo1* compromises nitrogen-starvation-induced
        G1 arrest and reduces sporulation, while reducing Pab1 activity produces the opposite, hyperfertile
        tendency and can suppress defects associated with excessive TORC1 signaling.
