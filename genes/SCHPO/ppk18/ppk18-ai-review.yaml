  title: Nutritional Control of Cell Size by the Greatwall-Endosulfine-PP2A·B55 Pathway.
  findings:
  - statement: Ppk18 (greatwall) is inhibited by TORC1 in nutrient-rich conditions; when nutrients are
      limiting its activation leads to Igo1 phosphorylation, PP2A-B55 inhibition, full Cdk1-cyclin B activation
      and mitotic entry at a smaller size.
    supporting_text: When nutrients are limiting, TORC1 activity falls off, and the activation of greatwall
      (Ppk18) leads to the phosphorylation of endosulfine (Igo1) and inhibition of PP2A·B55, which in
      turn allows full activation of Cdk1·CyclinB and entry into mitosis with a smaller cell size.
  - statement: The Ppk18-Igo1 pathway couples the nutritional environment to the cell-cycle machinery
      by regulating PP2A-B55.
    supporting_text: Here we show that the greatwall-endosulfine (Ppk18-Igo1 in fission yeast) pathway
      couples the nutritional environment to the cell-cycle machinery by regulating the activity of PP2A·B55.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in cache. The primary fission-yeast study defining Ppk18
      as the Greatwall kinase upstream of Igo1 and PP2A-B55 and the source of the IDA/IMP annotations.
- id: PMID:29079657
  title: TORC1 and TORC2 converge to regulate the SAGA co-activator in response to nutrient availability.
  findings:
  - statement: Taf12 phosphorylation on starvation is set by PP2A (activated by TORC1) opposing the TORC2-activated
      Gad8 kinase; the full text (not cached) shows ppk18 deletion reduces Taf12 phosphorylation and sexual
      differentiation, rescued by pab1 deletion.
    supporting_text: Taf12 phosphorylation increases early upon starvation and is controlled by the opposing
      activities of the PP2A phosphatase, which is activated by TORC1, and the TORC2-activated Gad8AKT
      kinase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'PubMed-verified; abstract-only in cache (publisher does not permit XML download). The
      ppk18 deletion data (Fig 5, Appendix Fig S8) were checked in the PMC HTML full text: ppk18, igo1
      and igo1-S64A mutants weakly induce ste11/mei2 and differentiation and fail to phosphorylate Taf12;
      pab1 deletion suppresses ppk18 sterility.'
- id: PMID:31553675
  title: The phosphatase inhibitor Sds23 regulates cell division symmetry in fission yeast.
  findings:
  - statement: ppk18 and igo1 single deletions have no cell-shape, size or division-symmetry defect in
      rich medium.
    supporting_text: Both igo1∆ and ppk18∆ mutants alone did not display defects in cell shape, cell length
      at division, or division symmetry under normal growing conditions, consistent with previous reports
      (Figure 5, B–E; Chica et al., 2016).
  - statement: sds23 ppk18 double mutants divide at a larger size and show more bent cells, but the division-symmetry
      trend is not significantly different from sds23 deletion alone.
    supporting_text: Lastly, the cell half ratio was even further reduced for double mutant cells, but
      we note that the double mutants were not significantly different from sds23∆ alone despite this
      trend (Figure 5E).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Ppk18 appears only in the genetic-interaction figure
      (Fig 5); the paper is primarily about Sds23.
