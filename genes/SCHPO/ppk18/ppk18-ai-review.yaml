    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IMP
  original_reference_id: PMID:26776736
  qualifier: involved_in
  review:
    summary: Ppk18 is the kinase that transduces falling TORC1 activity under nitrogen limitation into
      phosphorylation of Igo1 and inhibition of PP2A-B55; ppk18 deletion abolishes the nutrient-dependent
      cell-size response and moderate overexpression advances mitosis in rich medium.
    action: ACCEPT
    reason: 'Correct: Ppk18 sits in the middle of a signalling relay (TORC1 -| Ppk18 -> Igo1 -| PP2A-B55
      -> Cdk1), and the phenotypes are on the single ppk18 deletion. The term is generic; PomBase applies
      the same term to Igo1 for this paper, and the pathway-specific information is carried by the sibling
      GO:1905287 annotation. A more specific ''TORC1 signaling'' (GO:0038202) assignment would require
      establishing that Ppk18 is a direct TORC1 target, which the paper does not claim.'
