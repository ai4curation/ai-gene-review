core_functions:
- description: TORC1-restrained Greatwall protein serine kinase that, when nitrogen becomes limiting,
    phosphorylates the endosulfine Igo1 on Ser64 so that phospho-Igo1 inhibits PP2A-B55 (PP2A-Pab1); the
    loss of PP2A-B55 activity lets Cdk1-dependent phosphorylation of the Cdc25/Wee1 control system accumulate,
    fully activating Cdk1-cyclin B and advancing the G2/M transition so that cells divide at a smaller
    size.
