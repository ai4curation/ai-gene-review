taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: fol1 (SPBC1734.03; UniProt Q4LB35) encodes the trifunctional folic acid synthesis protein,
  ortholog of S. cerevisiae FOL1. It carries dihydroneopterin aldolase (EC 4.1.2.25), 6-hydroxymethyl-7,8-dihydropterin
  pyrophosphokinase (HPPK; EC 2.7.6.3) and dihydropteroate synthase (EC 2.5.1.15) domains, which turn
  dihydroneopterin into 7,8-dihydropteroate by coupling the pterin to 4-aminobenzoate. Function is assigned
  by orthology; it is cytosolic in a genome-wide screen.
