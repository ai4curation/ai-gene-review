    label: folic acid-containing compound metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006157
  review:
    summary: Broad parent of tetrahydrofolate biosynthetic process, which is asserted in this review.
    action: TOO_GENERAL
    reason: True but uninformative. By similarity to S. cerevisiae FOL1 (ECO:0000250|UniProtKB:P53848)
      and by its DHNA, HPPK and DHPS domains, fol1 catalyses three consecutive steps of tetrahydrofolate
      biosynthesis; the specific process GO:0046654 tetrahydrofolate biosynthetic process is asserted in
      this review. Orthology and domain evidence, not an S. pombe experiment.
    supported_by:
    - reference_id: file:SCHPO/fol1/fol1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes three sequential steps of tetrahydrofolate biosynthesis. {ECO:0000250|UniProtKB:P53848}'
