  label: Schizosaccharomyces pombe 972h-
description: nrk1 (SPBP22H7.06; UniProt Q9C0W1) encodes nicotinamide riboside kinase (EC 2.7.1.22), which
  phosphorylates nicotinamide riboside and nicotinic acid riboside to NMN and NaMN, a salvage route from
  these vitamin-B3 nucleosides into NAD+. Function is assigned by orthology to S. cerevisiae NRK1 and
  human NMRK1; it is cytosolic in a genome-wide screen.
