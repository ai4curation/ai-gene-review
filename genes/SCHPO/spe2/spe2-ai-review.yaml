taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: spe2 (SPBP4H10.05c; UniProt Q9P7E3) encodes S-adenosylmethionine decarboxylase (AdoMetDC;
  EC 4.1.1.50), a self-processing pyruvoyl-dependent enzyme. It makes decarboxylated SAM, the aminopropyl
  donor for spermidine and spermine synthesis. spe2 deletion cells cannot make spermidine or spermine
  and need spermidine to grow. Without it they show cell-cycle delay and G1 accumulation, then grow by
  elongation without dividing, with abnormal actin and calcofluor staining; as little as 1 µM spermidine
  is enough for normal growth.
