  label: Schizosaccharomyces pombe 972h-
description: dak2 (SPAC977.16c; UniProt O74215) encodes one of two dihydroxyacetone kinases of fission
  yeast (DAK family, EC 2.7.1.29). Together with dak1, it phosphorylates dihydroxyacetone (glycerone)
  produced by the glycerol dehydrogenase gld1, forming dihydroxyacetone phosphate. This is the second
  step of the oxidative (DHA) route of glycerol assimilation. dak1 and dak2 deletion strains cannot grow
  on glycerol and are sensitive to high dihydroxyacetone; dak1 contributes more because it is expressed
  more highly. Both genes are repressed by glucose. The purified enzymes also have weak activity on glyceraldehyde.
  dak2 is cytosolic in a genome-wide localisation screen.
