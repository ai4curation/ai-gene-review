  label: Schizosaccharomyces pombe 972h-
description: Bifunctional UDP-glucose 4-epimerase/aldose 1-epimerase of fission yeast, the ortholog of
  budding-yeast GAL10. An N-terminal NAD+-dependent epimerase domain interconverts UDP-galactose and UDP-glucose,
  and a C-terminal mutarotase domain is predicted to interconvert alpha and beta anomers of galactose
  and glucose. The gene lies in a subtelomeric gal7-gal10-gal1 cluster that is silenced in wild-type cells,
  which cannot grow on galactose. When expressed, gal10 supplies UDP-galactose for cell-surface galactosylation
  under low-glucose conditions alongside the main monofunctional epimerase uge1, and together with gal1
  and gal7 allows galactose assimilation through the Leloir pathway. Its activity is cytosolic by homology.
