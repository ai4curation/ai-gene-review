suggested_questions:
- question: Does the Lem2 interaction concentrate cho2 at the nuclear envelope to supply PC (or relieve PE) for
    nuclear membrane integrity?
suggested_experiments:
- description: Assay PE N-methyltransferase activity in microsomes from cho2 deletion strains, with and without
    S. cerevisiae CHO2 complementation, to confirm the first-step specificity and measure PMME accumulation.
