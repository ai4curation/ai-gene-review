  label: Schizosaccharomyces pombe 972h-
description: cho2 encodes the phosphatidylethanolamine N-methyltransferase of Schizosaccharomyces pombe (EC 2.1.1.17),
  the ortholog of S. cerevisiae Cho2 (Pem1). This multi-pass ER membrane enzyme of the Cho2 family catalyses the
  first S-adenosylmethionine-dependent methylation of phosphatidylethanolamine to phosphatidyl-N-monomethylethanolamine.
  The second and third methylations to phosphatidylcholine are done by the unrelated PEMT/Opi3-family enzyme cho1.
  cho2 mutants are choline auxotrophs blocked in the PE methylation route to PC. Cho2 associates with the inner
  nuclear membrane protein Lem2 and is found in perinuclear and cortical ER. S. pombe cho2 corresponds to S. cerevisiae
  CHO2, but S. pombe cho1 is the OPI3 ortholog, not the S. cerevisiae CHO1 PS synthase.
