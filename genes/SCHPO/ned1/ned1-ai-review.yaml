  label: Schizosaccharomyces pombe 972h-
description: ned1 (SPAC1952.13; UniProt Q9UUJ6) encodes the fission yeast lipin, an Mg2+-dependent phosphatidate
  phosphatase (EC 3.1.3.4) that dephosphorylates phosphatidic acid to diacylglycerol at the ER and nuclear
  envelope. It diverts PA from membrane phospholipid synthesis into triacylglycerol and so restrains nuclear
  membrane growth. ned1 mutants have misshapen nuclei, overgrown ER-like membranes and chromosome missegregation,
  and are microtubule-drug sensitive. Ned1 is regulated by dephosphorylation by the Nem1-Spo7 phosphatase,
  which is needed to keep mitotic competence and protect the nucleus in quiescence.
