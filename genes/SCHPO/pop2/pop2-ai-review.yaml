gene_symbol: pop2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Pop2 (also called Sud1) is one of the two Cdc4/Fbw7-type F-box/WD40-repeat proteins of Schizosaccharomyces
  pombe, the other being its paralogue Pop1. It is a non-catalytic substrate-recognition subunit of the
  SCF (Skp1-Cul1-F-box) ubiquitin ligase: an N-terminal region (residues 1-241) mediates heterooligomerisation
  with Pop1 and homooligomerisation, a central F-box binds the Skp1 orthologue Psh1, and a C-terminal
  seven-bladed WD40 beta-propeller reads phosphodegrons on substrates. At endogenous levels Pop2 co-purifies
  with Pop1, the cullin Pcu1/Cul1, Psh1/Skp1 and the RING subunit Pip1/Rbx1 in a ~500 kDa SCF(Pop1-Pop2)
  complex, and also assembles a Pop1-independent SCF(Pop2) complex that carries ubiquitin ligase activity.
  Within the heteromer Pop2 is tethered largely through Pop1 and its own F-box is dispensable for Rum1
  degradation, whereas the Pop1 F-box is essential. The defining substrates are the replication initiator
  Cdc18 (Cdc6) and the cyclin-dependent kinase inhibitor Rum1: Pop2 binds Cdc18 only after CDK phosphorylation
  at consensus sites, the purified Pop1-Pop2 complex binds CDK-phosphorylated Rum1 and polyubiquitylates
  it with E1, a Cdc34-class E2, ubiquitin and ATP, and cells lacking pop2 stabilise both proteins (Rum1
  half-life rises from ~20 to >100 min). By eliminating Cdc18 after origin licensing and Rum1 at the G1/S
  boundary, Pop2 restricts DNA replication to once per cell cycle; pop2 deletion causes spontaneous re-replication,
  diploidization and polyploidy, a phenotype milder than that of pop1 deletion, and the two genes do not
  cross-complement. Pop2 and Pop1 are additionally required for SCF-dependent instability of the S-phase
  cyclin Cig2 during G2 and M phase. Pop2 lacks the nuclear localisation signal of Pop1 and is found in
  both the nucleus, where the complete SCF(Pop1-Pop2) complex and its known substrates reside, and the
  cytoplasm, where a Pop2-only SCF of unknown substrate specificity has been proposed.
