core_functions:
- description: >-
    Substrate-recognition adaptor of the nuclear SCF(Pop1-Pop2) ubiquitin ligase: Pop2 heterooligomerises
    with Pop1 through its N-terminus and, via the Pop1-Pop2 WD40 receptor, captures CDK-phosphorylated
    Cdc18 and Rum1 (and contributes to Cig2 turnover) for Pip1/Rbx1-Pcu1-dependent polyubiquitylation
    and proteasomal destruction; Cdc18 removal after licensing prevents re-initiation of DNA replication,
    and Rum1 removal relieves CDK inhibition at G1/S.
  molecular_function:
