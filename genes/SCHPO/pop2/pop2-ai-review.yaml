suggested_questions:
- question: >-
    Pop1 carries a PomBase IMP annotation to positive regulation of G1/S transition (GO:1900087) that
    Pop2 lacks, although Rum1 half-life increases more than five-fold in pop2 deletants (PMID:12167173);
    is the Pop2 omission a deliberate reflection of the milder pop2 phenotype, or a curation gap?
- question: >-
    Does Pop2 contact phospho-Cdc18/phospho-Rum1 directly through its WD40 propeller, or is the degron
    read by Pop1 with Pop2 serving to dimerise and stabilise the receptor? Pop2 alone does not bind Rum1
    and Cdc18 binding to Pop2 requires Pop1, but a Pop2 WD40 point mutant has not been tested.
- question: >-
    Should the established substrates (Cdc18, Rum1, Cig2) be modelled as has_input on the Pop2 adaptor
    activity in a GO-CAM rather than as GO:0005515 rows, and should the SCF(Pop1-Pop2) heteromer be represented
    as a distinct complex from SCF(Pop2)?
suggested_experiments:
- hypothesis: >-
    The Pop1-independent SCF(Pop2) complex ubiquitylates a distinct set of cytoplasmic substrates that
    account for the pop2-specific phenotypes not shared with pop1.
  description: >-
    Compare ubiquitin-remnant (diGly) proteomes of wild-type, pop1-delta, pop2-delta and pop1-delta pop2-delta
    cells, and cytoplasmic versus nuclear fractions, to identify proteins whose ubiquitylation depends
    on Pop2 but not Pop1; validate candidates by cycloheximide chase and co-immunoprecipitation with Pop2-13Myc
    in a pop1-delta background.
  experiment_type: comparative ubiquitinome in F-box deletion strains
- hypothesis: >-
    Pop2's WD40 propeller directly reads the CDK phosphodegrons of Cdc18 and Rum1 within the Pop1-Pop2
    heteromer.
  description: >-
    Introduce arginine-to-alanine substitutions at the conserved phosphate-binding positions of the Pop2
    WD40 propeller (by analogy with Cdc4/Fbw7) at the endogenous locus, confirm Pop1 binding and SCF assembly
    are intact, and measure phospho-Rum1 and phospho-Cdc18 binding and in vitro polyubiquitylation by
    the mutant heteromer.
  experiment_type: structure-guided separation-of-function mutagenesis
