    summary: 'PAINT inference; the 2-oxoglutarate to succinyl-CoA step of the TCA cycle.'
    action: ACCEPT
    reason: 'IBA from the SucB node, where the target itself is among the descendant evidences; by similarity, the E2 is a component of the 2-oxoglutarate dehydrogenase complex, which converts 2-oxoglutarate to succinyl-CoA in the TCA cycle.'
