  review:
    summary: 'Similarity transfer of mitochondrial nucleoid association from S. cerevisiae, where Kgd2p crosslinks to mtDNA in organello. Not shown in S. pombe.'
    action: KEEP_AS_NON_CORE
    reason: 'By similarity to S. cerevisiae Kgd2p (P19262), identified among proteins formaldehyde-crosslinked to mtDNA in purified yeast mitochondria. No S. pombe evidence; nucleoid association is a secondary, moonlighting location of a TCA enzyme, so non-core.'
