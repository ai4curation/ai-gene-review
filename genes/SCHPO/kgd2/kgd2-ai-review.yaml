taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: kgd2 (SPBC776.15c; UniProt O94681) encodes the lipoylated E2 dihydrolipoyllysine-residue
  succinyltransferase (EC 2.3.1.61) core of the mitochondrial 2-oxoglutarate dehydrogenase complex. It
  transfers the succinyl group from its lipoyl arm to CoA to form succinyl-CoA in the TCA cycle. Function
  is assigned by orthology; it is mitochondrial in a genome-wide screen.
