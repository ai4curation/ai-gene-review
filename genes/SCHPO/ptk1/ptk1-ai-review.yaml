  label: Schizosaccharomyces pombe 972h-
description: Type II pantothenate kinase (PanK; EC 2.7.1.33) of fission yeast, encoded by SPBC4B4.01c.
  It is predicted to phosphorylate (R)-pantothenate to (R)-4'-phosphopantothenate with ATP, the first
  and normally rate-limiting step of coenzyme A synthesis; by homology to S. cerevisiae Cab1 its activity
  is likely feedback-regulated by acyl-CoAs. Endogenously GFP-tagged Ptk1 is distributed throughout the
  cell (cytoplasm and nucleus). Note that the PomBase name ptk1 is unrelated to S. cerevisiae PTK1 (a
  polyamine-transport protein kinase).
