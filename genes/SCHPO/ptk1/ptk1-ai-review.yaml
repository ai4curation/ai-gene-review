suggested_questions:
- question: Is ptk1 essential in S. pombe and is it feedback-inhibited by acetyl-CoA/malonyl-CoA as for
    Cab1 and mammalian PANKs?
suggested_experiments:
- description: Measure pantothenate kinase activity of recombinant ptk1 and its inhibition by acyl-CoAs;
    test complementation of an S. cerevisiae cab1 mutant.
