      pombe
  - reference_id: PMID:28640807
    supporting_text: Trx1 and Trx3 are the primary electron donors for RNR in fission yeast.
- description: Electron donor to the met16 PAPS-reductase system in sulfate assimilation. Native trx1
    deletion causes cysteine auxotrophy rescued by sulfite, supporting this physiological electron-transfer
    role. This does not assert a directly measured native Met16 intermolecular-disulfide intermediate
    or exclusive use of Trx1 under every condition.
  molecular_function:
