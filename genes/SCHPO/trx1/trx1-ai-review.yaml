- term:
    id: GO:0000103
    label: sulfate assimilation
  evidence_type: IMP
  original_reference_id: PMID:18758731
  qualifier: involved_in
  review:
    summary: Deletion of trx1 causes cysteine auxotrophy that is bypassed by sulfite, placing the requirement
      at the PAPS-to-sulfite step; Trx1 is the reductant (thioredoxin-dithiol cosubstrate) of the met16
      PAPS reductase. Thioredoxin does part of the work of this step, supplying the electrons and reducing
      the met16 active-site disulfide, and the PomBase GO-CAM includes trx1 part_of sulfate assimilation
      with input to met16. Accepted; a core process for trx1 in the context of sulfate assimilation, although
      trx1 is a pleiotropic reductant.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:18758731
      supporting_text: The Deltatrx1 mutant exhibited cysteine auxotrophy, which can be overcome by adding
        sulfite.
    - reference_id: PMID:18758731
      supporting_text: This suggests that Trxl serves as a primary electron donor for 3'-phosphoadenosine-5'-phosphosulfate
        (PAPS) reductase and thus is an essential protein for sulfur assimilation in S. pombe.
