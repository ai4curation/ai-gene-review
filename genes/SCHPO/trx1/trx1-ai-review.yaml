taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: trx1 (SPAC7D4.07c) encodes the main cytosolic thioredoxin of fission yeast, a 103-residue
  protein with a canonical CGPC active-site dithiol (Cys30/Cys33). Reduced Trx1 reduces disulfide bonds
  in target proteins by thiol-disulfide exchange, and is then re-reduced by the NADPH-dependent thioredoxin
  reductase trr1. Its main substrates include the peroxiredoxin Tpx1 and the glutathione peroxidase-like
  Gpx1, which use Trx1 to remove hydrogen peroxide; the ribonucleotide reductase subunit Cdc22, for which
  Trx1 and Trx3 are the main electron donors in dNTP synthesis; methionine sulfoxide reductases; and the
  PAPS reductase met16, for which Trx1 is the reducing cosubstrate in sulfate assimilation. trx1 deletion
  mutants are sensitive to oxidants, heat and salt, accumulate oxidized proteins, and are cysteine auxotrophs
  that can be rescued by sulfite. trx1 expression is induced by peroxide through the Pap1 transcription
  factor, and Trx1 also reduces oxidized Pap1. It is distinct from the mitochondrial thioredoxin trx2
  (SPBC12D12.07c), whose name UniProt lists as a trx1 synonym.
