  supported_by:
  - reference_id: PMID:18758731
    supporting_text: This suggests that Trxl serves as a primary electron donor for 3'-phosphoadenosine-5'-phosphosulfate
      (PAPS) reductase and thus is an essential protein for sulfur assimilation in S. pombe.
  - reference_id: PMID:28640807
    supporting_text: These two cascades have to recycle enzymes which suffer disulfide formation as
      part of their catalytic functions, such as the essential Cdc22 and the non-essential Tpx1, Mxr1
      or Met16 (Fig 1A).
