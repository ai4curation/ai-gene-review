- description: 'Reducing cosubstrate of the met16 PAPS reductase in sulfate assimilation: reduced Trx1
    supplies the two electrons for PAPS reduction to sulfite and re-reduces the met16 active-site disulfide;
    trx1 deletion causes a sulfite-rescued cysteine auxotrophy.'
  molecular_function:
