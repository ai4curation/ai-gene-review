description: mvd1 (SPAC24C9.03; UniProt O13963) encodes diphosphomevalonate decarboxylase (EC 4.1.1.33),
  a GHMP-family enzyme that carries out the ATP-dependent decarboxylation of 5-diphosphomevalonate to
  isopentenyl diphosphate. This is the final step of the mevalonate pathway and provides the C5 unit for
  all isoprenoids. Function is assigned by orthology to S. cerevisiae MVD1; a genome-wide screen places
  it in the cytosol.
