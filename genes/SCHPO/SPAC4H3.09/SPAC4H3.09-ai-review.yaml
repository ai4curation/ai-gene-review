  label: Schizosaccharomyces pombe 972h-
description: SPAC4H3.09 (UniProt Q10217; the fission yeast ACP1/NDUFAB1 ortholog) encodes the mitochondrial
  acyl carrier protein. Its 4'-phosphopantetheinylated serine carries acyl intermediates of mitochondrial
  type II fatty acid synthesis (mct1, oar2, htd2, etr1), producing octanoyl-ACP for lipoic acid synthesis.
  By orthology, acyl-ACP also binds Isd11 in the Nfs1-Isd11 cysteine desulfurase complex, coupling mtFAS
  to Fe-S cluster biogenesis. It is mitochondrial in a genome-wide screen.
