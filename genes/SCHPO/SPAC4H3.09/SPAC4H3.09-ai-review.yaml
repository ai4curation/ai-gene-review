  review:
    summary: Mapping; acyl-ACP is part of the Nfs1-Isd11-ACP core complex.
    action: ACCEPT
    reason: The ARBA mapping is not itself evidence; the claim rests on S. cerevisiae Acp1, shown by
      co-immunoprecipitation and BN-PAGE to be a stable subunit of the Nfs1-Isd11 (ISU) complex, and on
