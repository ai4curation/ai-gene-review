- term:
    id: GO:0009446
    label: putrescine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G08870
  - AGI_LocusCode:AT4G08900
  - PANTHER:PTN000144486
  review:
    summary: PAINT inference of putrescine biosynthesis via agmatine from PANTHER:PTN000144486
      (Arabidopsis agmatinases AT4G08870 and AT4G08900). S. pombe has no biosynthetic
      arginine decarboxylase and synthesizes putrescine de novo from ornithine via
      ornithine decarboxylase (spe1).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cross-kingdom IBA over-propagated from Arabidopsis thaliana agmatinases
      (AT4G08870, AT4G08900) at Eukaryota node PANTHER:PTN000144486. In plants,
      arginine decarboxylase and agmatinase constitute a major endogenous putrescine
      biosynthetic pathway, whereas S. pombe lacks arginine decarboxylase and
      synthesizes putrescine de novo from ornithine via ornithine decarboxylase (spe1).
      Although the putative agmatinase reaction (agmatine + H2O = urea + putrescine)
      would release putrescine and urea if acting on exogenous agmatine—making catabolic
      urea release (GO:0019627) a plausible non-core byproduct of ureohydrolase
      activity—annotating SPAPB24D3.03 to endogenous putrescine biosynthesis
      over-annotates a pathway absent in fission yeast.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: AGI_LocusCode:AT4G08870
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Arabidopsis thaliana agmatinase operating in the plant arginine decarboxylase
          pathway for putrescine biosynthesis, which is absent in S. pombe.
      - source_id: AGI_LocusCode:AT4G08900
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Arabidopsis thaliana agmatinase operating in the plant arginine decarboxylase
          pathway for putrescine biosynthesis, which is absent in S. pombe.
      - source_id: PANTHER:PTN000144486
        source_label: PTN000144486
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Eukaryota-level node where the plant ADC/agmatinase putrescine biosynthetic
          process does not generalize to fission yeast, which synthesizes putrescine via
          ornithine decarboxylase (spe1) and lacks arginine decarboxylase.
    supported_by:
    - reference_id: file:SCHPO/SPAPB24D3.03/SPAPB24D3.03-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=agmatine + H2O = urea + putrescine;'
