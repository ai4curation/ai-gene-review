- description: 'Single-turnover ADP-thiazole synthase: forms the adenylated thiamine thiazole (ADT) from
    NAD+ and glycine, using its own cysteine as sulfur donor in an iron-dependent reaction; the sole
    thiazole-forming enzyme of fission yeast.'
