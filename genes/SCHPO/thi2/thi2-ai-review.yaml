suggested_questions:
- question: Is S. pombe Thi2 also a strict single-turnover enzyme, and how does the cell sustain the
    very high nmt2 expression needed to make enough thiazole under thiamine limitation?
suggested_experiments:
- description: Purify recombinant S. pombe Thi2, reconstitute ADT formation from NAD+ and glycine, and
    test for the Cys-215 dehydroalanine mass shift to confirm the suicide mechanism shown for S.
    cerevisiae THI4.
