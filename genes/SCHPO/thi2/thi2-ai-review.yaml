  label: Schizosaccharomyces pombe 972h-
description: thi2 (also called nmt2; SPBC26H8.01) encodes the fission yeast thiamine thiazole synthase,
  the orthologue of S. cerevisiae THI4. It makes the adenylated thiazole precursor of thiamine
  (ADP-5-ethyl-4-methylthiazole-2-carboxylate) from NAD+ and glycine. The sulfur comes from an
  active-site cysteine of the enzyme itself in an iron-dependent reaction, so each molecule turns
  over only once. It is the only thiazole-forming enzyme in the organism. Its transcription is
  strongly repressed by thiamine, coordinately with nmt1, and deletion causes thiamine auxotrophy. The
  protein is cytoplasmic, with some nuclear signal in genome-wide localisation.
