taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: hem13 (SPAC222.11; UniProt Q9UTE2) encodes the oxygen-dependent coproporphyrinogen III
  oxidase (CPOX; EC 1.3.3.3), a homodimeric enzyme. It oxidatively decarboxylates the ring A and B
  propionates of coproporphyrinogen III to vinyl groups, giving protoporphyrinogen IX; this is the
  sixth step of heme biosynthesis. As in S. cerevisiae, the fungal enzyme is cytosolic. hem13 is
  essential. The hypomorphic hem13-1 (T263I) allele causes heme deficiency, cold sensitivity and
  strong hypersensitivity to hydroxyurea, which acts through oxidative stress.
