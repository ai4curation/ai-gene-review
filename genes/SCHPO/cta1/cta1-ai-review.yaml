taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: cta1 encodes the only catalase of Schizosaccharomyces pombe, a monofunctional heme catalase (EC 1.11.1.6) that
  dismutates hydrogen peroxide to water and dioxygen. Deletion abolishes cellular catalase activity and makes cells hypersensitive
  to high concentrations of exogenous hydrogen peroxide, and overexpression increases peroxide resistance; catalase activity
  is induced by osmotic stress and, via Pap1, in cells lacking thioredoxin reductase. Catalase is dispensable for normal aerobic
  growth, where the peroxiredoxin Tpx1 controls low steady-state peroxide levels, and acts as the second barrier when peroxide
  levels rise. Unlike budding yeast, which has a peroxisomal (Cta1) and a cytosolic (Ctt1) catalase, S. pombe has a single
  catalase gene; its C-terminus lacks the canonical PTS1 of S. cerevisiae Cta1, and its peroxisomal localization is inferred
  by similarity.
