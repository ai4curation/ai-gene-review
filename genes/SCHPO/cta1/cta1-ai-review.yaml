suggested_questions:
- question: 'Where is S. pombe catalase located: is there a peroxisomal pool despite the absence of the S. cerevisiae-type
    C-terminal PTS1, and is any catalase imported into mitochondria?'
suggested_experiments:
- description: Image endogenously tagged Cta1 with peroxisomal (e.g. PTS1-RFP) and mitochondrial markers and fractionate cells
    grown on glucose and on respiratory carbon sources, comparing wild type with pex mutants.
