taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPBC660.16 (UniProt P78812) encodes the decarboxylating 6-phosphogluconate dehydrogenase
  (EC 1.1.1.44), which oxidatively decarboxylates 6-phosphogluconate to ribulose 5-phosphate with NADP+,
  the second NADPH-producing step of the PPP. In S. pombe it also takes 6-phosphogluconate from a gluconate
  route (glucose dehydrogenase plus gluconate kinase), which bypasses G6PD. The purified enzyme is an
  unusual tetramer of 38 kDa subunits, is strictly NADP+-dependent, and is activated by Co2+ and Mn2+.
