taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: car1 (SPBP26C9.02c) encodes one of the two cytosolic, manganese-dependent arginases (EC 3.5.3.1)
  of fission yeast, an ortholog of S. cerevisiae CAR1. It hydrolyses L-arginine to L-ornithine and urea,
  the first step of arginine catabolism, which feeds ornithine into the ornithine aminotransferase (car2)
  route to proline and glutamate and also supplies ornithine for ferrichrome siderophore synthesis. car1
  complements a budding-yeast arginase mutant and its expression is induced by arginine and repressed
  by iron (via the GATA repressor Fep1), whereas its 88%-identical paralog aru1 is constitutive and contributes
  more strongly under the studied conditions. Deleting both genes abolishes detectable cellular arginase
  activity and nearly eliminates conversion of arginine into other amino acids.
