core_functions:
- description: Cytosolic Mn-dependent arginase that hydrolyzes L-arginine to L-ornithine and urea. Its
    contribution is modulated by arginine and iron conditions; deletion of the paralog Aru1 induces compensatory
    car1 expression, so single-mutant activities cannot be added to infer wild-type partitioning.
  molecular_function:
    id: GO:0004053
    label: arginase activity
  directly_involved_in:
  - id: GO:0006527
    label: L-arginine catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20435771
    supporting_text: Regardless of the iron status, all extracts possessed arginase activity except in
      the case of car1Δ car3Δ cell lysate.
  - reference_id: PMID:20435771
    supporting_text: Car1 activity was found to be downregulated in response to high concentrations of
      iron, whereas Car3 activity appears to be constitutive.
  - reference_id: PMID:20460254
    supporting_text: Interestingly, however, conversion was almost completely prevented in a car1Δ aru1Δ
      double deletion strain
  - reference_id: PMID:26075619
    supporting_text: prevention of Arg-6 conversion into glutamate, glutamine and proline can be achieved
      either by deletion of the single fission yeast ornithine transaminase gene, car2+, or by simultaneous
