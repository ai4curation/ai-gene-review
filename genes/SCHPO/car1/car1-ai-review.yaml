suggested_questions:
- question: How much flux passes through arginase-dependent ornithine-to-arginine recycling under different
    nitrogen and iron conditions, compared with net ornithine degradation? Isotope changes support recycling
    under the tested labeling conditions but do not quantify its general physiological contribution.
- question: Do Car1 and Aru1 form mixed oligomers whose composition changes with iron status, as speculated
    by Mercier and Labbe?
suggested_experiments:
- description: Purify recombinant Car1 and Aru1 and compare kinetic parameters and Mn2+ dependence; test
