core_functions:
- description: Mn2+-dependent hydrolysis of L-arginine to L-ornithine and urea in the cytosol, the first
    step of arginine catabolism; iron- and arginine-regulated minor arginase acting redundantly with aru1.
    Same core function as S. cerevisiae CAR1 (the CAR1 epiarginase/OTC-inhibitor role is not established
    in S. pombe, where OTC is mitochondrial).
  molecular_function:
    id: GO:0004053
    label: arginase activity
  directly_involved_in:
  - id: GO:0006527
    label: L-arginine catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id004
  - reference_id: PMID:20435771
    supporting_text: Car1 activity was found to be downregulated in response to high concentrations of
      iron, whereas Car3 activity appears to be constitutive.
  - *id001
  - reference_id: PMID:26075619
    supporting_text: prevention of Arg-6 conversion into glutamate, glutamine and proline can be achieved
      either by deletion of the single fission yeast ornithine transaminase gene, car2+, or by simultaneous
      deletion of the two arginase genes, car1+ and aru1+
  - *id006
suggested_questions:
- question: PomBase annotates car1 (IGI) and the GO-CAM 678073a900003902 arginase activities to GO:0000050
    urea cycle. Is this a deliberate PomBase convention for arginase in a non-ureotelic organism, or would
    L-arginine catabolic process (GO:0006527) be acceptable?
- question: Do Car1 and Aru1 form mixed oligomers whose composition changes with iron status, as speculated
    by Mercier and Labbe?
suggested_experiments:
- description: Purify recombinant Car1 and Aru1 and compare kinetic parameters and Mn2+ dependence; test
    for hetero-oligomer formation by co-immunoprecipitation from iron-starved cells.
