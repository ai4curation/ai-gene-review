- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2442664
  - PANTHER:PTN008512301
  - UniProtKB:P18133
  - UniProtKB:Q6XQN6
  review:
    summary: PAINT inference of cytosolic location for this soluble nicotinate phosphoribosyltransferase.
    action: ACCEPT
    reason: The IBA places S. pombe SPAC1486.06 inside the NAPRTase clade whose characterised members (mouse, human NAPRT and S. cerevisiae Npt1, the PAINT sources) are cytosolic; nothing specific to this protein argues for loss or divergence of that location. The UniProt record agrees with a soluble cytosolic enzyme. It has no SUBCELLULAR LOCATION comment, and its features include no signal peptide, transit peptide or transmembrane segment. The ORFeome HDA rows (PMID:16823372) add nuclear and mitochondrial signal, which does not exclude a cytosolic pool. Support is family membership, not an S. pombe localisation of the cytosol itself.
    supported_by:
    - reference_id: file:SCHPO/SPAC1486.06/SPAC1486.06-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the NAPRTase family.'
