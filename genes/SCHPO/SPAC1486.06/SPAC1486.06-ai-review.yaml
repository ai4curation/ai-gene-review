description: SPAC1486.06 (UniProt Q9UTK3; the fission yeast NPT1 ortholog) encodes nicotinate phosphoribosyltransferase
  (EC 6.3.4.21), which converts nicotinate and PRPP, with ATP, to nicotinate mononucleotide (NaMN) in
  the Preiss-Handler NAD+ salvage route. Function is assigned by orthology.
