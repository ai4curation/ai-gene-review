taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: vma1 encodes the catalytic A subunit of the cytosolic V1 sector of
  the vacuolar H+-ATPase in Schizosaccharomyces pombe. As part of the fungal
  vacuolar V-ATPase, Vma1 binds and hydrolyzes ATP in the V1 domain to power
  proton translocation by the membrane V0 sector, acidifying the vacuole and
  supporting vacuolar protein sorting, endocytic traffic, ion homeostasis, and
  vacuole biogenesis.
