- id: PMID:14735354
  title: Characterization of Schizosaccharomyces pombe mutants defective in vacuolar
    acidification and protein sorting.
  full_text_unavailable: true
  findings:
  - statement: Iwaki et al. disrupted S. pombe vma1 and vma3 to test the
      functions of V-ATPase subunit A and subunit c.
    supporting_text: the gene vma1 encoding subunit A or vma3 encoding subunit c was disrupted.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: vma1 and vma3 deletion mutants lost vacuolar acidification and
      were sensitive to neutral pH and high divalent-cation concentrations.
    supporting_text: |-
      deletion mutants lost the capacity for vacuolar acidification in vivo, and
      showed sensitivity to neutral pH or high concentrations of divalent cations
      including Ca2+.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: vma1 and vma3 deletions impaired endocytic/vacuolar trafficking
      and caused vacuolar protein sorting and vacuole morphology defects.
    supporting_text: |-
      Moreover, deletion of the S. pombe vma1+ or vma3+ gene resulted in pleiotropic
      phenotypes consistent with lack of vacuolar acidification, including the
      missorting of vacuolar carboxypeptidase Y, abnormal vacuole morphology, and
      mating defects.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary S. pombe vma1/vma3 disruption study;
      the local cache is abstract-only, but the abstract directly supports
      vma1-dependent vacuolar acidification and identifies vma1 as encoding the
      V-ATPase A subunit.
