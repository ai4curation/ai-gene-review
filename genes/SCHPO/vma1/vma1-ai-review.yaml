- term:
    id: GO:0046034
    label: ATP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  - InterPro:IPR022878
  - InterPro:IPR036121
  review:
    summary: ATP metabolism is a broad InterPro projection from ATPase
      signatures and overstates Vma1's biological-process role.
    action: MARK_AS_OVER_ANNOTATED
    reason: Vma1 hydrolyzes ATP as the energy-coupling step of vacuolar proton
      pumping; its core biological process is proton transmembrane transport,
      not ATP homeostasis or ATP metabolic regulation. The ATP metabolic
      process row is therefore a mechanistic side effect of the ATPase
      signature rather than a curated process assignment to keep as core.
