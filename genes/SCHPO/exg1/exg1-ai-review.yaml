suggested_questions:
- question: >-
    Which endogenous septal beta-1,6-glucan structures are the direct in vivo
    substrates of Exg1, and which hydrolases or wall-remodeling pathways
    compensate when exg1 is deleted?
suggested_experiments:
- description: >-
    Profile beta-1,6-glucan chain length and linkage patterns by sensitive
    glycan mass spectrometry in wild-type, exg1Delta, exg3Delta, and
    exg1Delta exg3Delta cells during synchronized septum assembly.
  hypothesis: >-
    Exg1 makes a localized, partially redundant contribution to beta-1,6-glucan
    trimming at the septal wall that is buffered by Exg3 or other wall
    hydrolases in single deletion cells.
