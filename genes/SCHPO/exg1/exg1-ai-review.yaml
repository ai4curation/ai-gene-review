id: Q9URU6
gene_symbol: exg1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  S. pombe exg1 encodes a secreted glycoside hydrolase family 5 glucan
  endo-1,6-beta-glucosidase. Exg1 is released to the extracellular region,
  accumulates at the division septum during cytokinesis, and endohydrolyzes
  beta-1,6-glucan polymers during fungal cell-wall beta-glucan remodeling. The
  protein also localizes with other secreted glucanases at the mating actin
  fusion focus, where local glucan hydrolysis contributes to cell-wall
  disassembly between mating partners.
core_functions:
- description: >-
    Secreted division-septum beta-1,6-glucan endoglucanase that hydrolyzes
    fungal cell-wall beta-1,6-glucan during vegetative septal cell-wall
    remodeling.
  molecular_function:
    id: GO:0046557
    label: glucan endo-1,6-beta-glucosidase activity
  directly_involved_in:
  - id: GO:0070879
    label: fungal-type cell wall beta-glucan metabolic process
  - id: GO:0051275
    label: beta-glucan catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0000935
    label: division septum
  supported_by:
  - reference_id: PMID:20852022
    supporting_text: >-
      The production of small amounts of glucose and large amounts of
      oligosaccharides of different sizes proved that Exg1 degraded linear
      β(1,6)-glucan substrates with an endolytic mode of action
  - reference_id: PMID:20852022
    supporting_text: >-
      only Exg1 was present in culture supernatants, indicating that the protein
      was secreted to the exterior of the cell and then released to the
      surrounding medium
  - reference_id: PMID:20852022
    supporting_text: >-
      Exg1 first started to accumulate as a ring surrounding the septa during the
      initial steps of their assembly
  - reference_id: file:interpro/panther/PTHR31297/PTHR31297-paint.tsv
    supporting_text: "PTHR31297\tPTN008631699\tGO:0046557\tF\tIBD\tfalse\tPomBase:SPBC1105.05\ttaxon:4895\t20260112"
