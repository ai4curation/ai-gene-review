  label: Schizosaccharomyces pombe 972h-
description: lys2 (SPAC343.16; UniProt Q9UT74), the fission yeast ortholog of S. cerevisiae LYS4, encodes
  mitochondrial homoaconitase (EC 4.2.1.36), a [4Fe-4S] aconitase-family hydratase. It hydrates cis-homoaconitate
  to homoisocitrate in the alpha-aminoadipate pathway of lysine biosynthesis. The cloned gene complements
  the classical lys2-97 auxotroph and is used as a selectable marker. It is mitochondrial in a genome-wide
  screen.
