status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for tam10, a fission-yeast-lineage-restricted protein of genuinely
  unknown function whose GOA records biological_process as ND. All five calls are cellular components
  - preribosome, spindle pole body variants, 90S preribosome - at scores from 13.8 to 12.6, the lowest
  band of the SCHPO set. The SPB cluster is the same attractor seen for atg38 and SPCC16C4.02c, so
  three unrelated S. pombe proteins draw it. Rank 1 has a thin thread of support: GOA carries nucleolus
  by ISS and RNA binding by ISO. Assessment: 2 uncertain (UNC), 1 repetition (REP).
