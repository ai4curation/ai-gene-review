  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 13.79) and absent from GOA. GOA does place tam10 in the nucleolus by ISS
      and assigns RNA binding by ISO, so a preribosome association is not unreasonable and rank 4
      (90S preribosome) points the same way. But both GOA terms are themselves computational, this
      review found no SMAP-domain primary literature at all, and deletion mutants have no phenotype.
      Recorded as uncertain: the most defensible thing ProTrek says about this protein, and still
      only a hypothesis.
