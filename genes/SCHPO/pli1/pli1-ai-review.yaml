id: O94451
gene_symbol: pli1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Pli1 is the sole Siz/PIAS-family SP-RING SUMO E3 ligase of fission yeast and the ortholog
  of budding yeast Siz1/Siz2 and human PIAS1-4. It has an N-terminal SAP chromatin-binding domain, a PINIT
  domain, a zinc-coordinating SP-RING that engages the SUMO E2 Hus5/Ubc9, and a disordered C-terminus.
  Pli1 catalyses the transfer of SUMO (Pmt3) from Hus5 to substrate lysines and is responsible for the
  bulk of cellular SUMO conjugates and for SUMO chain formation, whereas the second SP-RING ligase Nse2
  (Smc5/6 complex) serves a narrower DNA repair role. Pli1 is nuclear and acts on chromatin; Pli1-dependent
  substrates include condensin subunits, topoisomerase I and meiotic linear element proteins. Loss of
  pli1 is viable but causes reduced centromeric heterochromatin silencing, thiabendazole sensitivity and
  minichromosome loss, telomere elongation, elevated recombination at repeats, defective meiotic linear
  elements and recombination, and defects in SUMO-dependent relocation of arrested replication forks to
  nuclear pores. Pli1-made SUMO chains are recognised by the SUMO-targeted ubiquitin ligase Slx8-Rfp,
  and pli1 deletion suppresses STUbL mutant phenotypes. Pli1 is itself auto-SUMOylated and protected from
  STUbL/Cdc48-mediated degradation by the nuclear-pore-associated SUMO protease Ulp1.
