suggested_questions:
- question: Is Pli1 the direct E3 for Tpz1 K242 SUMOylation, and does this account fully for the telomere
    elongation of pli1 mutants?
- question: Which Pli1 substrates mediate its roles in centromeric heterochromatin silencing, and are
    these effects direct or a consequence of global loss of SUMOylation?
- question: Should telomere length regulation (negative regulation of telomere maintenance via telomerase)
    be annotated to Pli1, given that the substrate linking Pli1 to telomerase control is not yet established?
- question: Does the Pli1-dependent interstrand cross-link repair pathway operate independently of homologous
    recombination, as implied by the non-recombinational ICL repair annotation?
- question: How is Pli1 recruited to arrested forks and DSBs - via its SAP domain, via SUMO-SIM interactions,
    or via substrate binding?
suggested_experiments:
- hypothesis: Tpz1 K242 is a direct Pli1 substrate.
  description: Reconstitute SUMOylation of recombinant Tpz1 with purified E1, Hus5, Pmt3 and wild-type
    or SP-RING-mutant Pli1, and compare telomere length of pli1 delta, tpz1-K242R and the double mutant.
  experiment_type: biochemical reconstitution
- hypothesis: A defined Pli1-dependent sub-SUMOylome mediates its centromere, telomere and fork functions.
  description: SUMO-site proteomics in wild-type, pli1 delta and SP-RING point-mutant strains to define
    Pli1-dependent sites, followed by lysine-to-arginine mutation of candidate substrates.
  experiment_type: proteomics
- hypothesis: The SAP domain targets Pli1 to arrested forks.
  description: Live imaging and ChIP of SAP-domain-mutant Pli1 at an active RTS1 replication fork barrier,
    measuring fork relocation to NPCs and nascent-strand resection.
  experiment_type: cell biology / ChIP
