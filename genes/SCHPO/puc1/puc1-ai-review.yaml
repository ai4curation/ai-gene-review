suggested_questions:
- question: Martin-Castellanos et al. 2000 (MBoC 11:543), the paper that established Puc1-Cdc2 phosphorylation
    of Rum1 T58/T62, the Rum1-resistance of the Puc1-Cdc2 kinase and the G1/size phenotype of cig1 cig2
    puc1 cells, is not among the GOA references for puc1; should it be curated (IGI with cig1/cig2 for
    G1/S transition, and a Cdc2 has-input Rum1 relationship in a GO-CAM of the fission-yeast Start module)?
- question: What is the physiological substrate through which Puc1-Cdc2 restrains sexual differentiation
    - Rum1 destabilisation, extended inhibitory phosphorylation of Ste11, or the Cdc10/MBF complex it
    associates with under Ran1 control - and is 'negative regulation of cell cycle switching, mitotic
    to meiotic cell cycle' the intended level, given that the measured phenotype is mating (conjugation)
    efficiency and G1 arrest kinetics?
- question: Where is endogenous Puc1 through the cell cycle and during nitrogen starvation? The only localization
    data are a proteome-wide YFP screen (nucleus and cytosol); is the cytosolic pool a site of action
    or a sequestered/synthesis pool as for budding-yeast Cln3?
suggested_experiments:
- hypothesis: Puc1-Cdc2 restrains sexual differentiation by direct phosphorylation of Ste11 and/or Rum1
    rather than through bulk CDK activity.
  description: Combine an analog-sensitive cdc2-as allele with a rapidly degradable (AID) Puc1 in zfs1
    deletion cells, and follow Ste11 and Rum1 phosphorylation and Ste11-dependent transcription (ste11+,
    mei2+) by phospho-proteomics and RNA-seq within minutes of Puc1 depletion during nitrogen withdrawal;
    test phospho-site mutants of Ste11 and Rum1 (T58A/T62A) for suppression of the Puc1-overexpression
    mating block.
- hypothesis: Puc1 accumulates in the nucleus in late G1 and at the cycling/non-cycling transition, and
    nuclear localization is required for its function.
  description: Image endogenously tagged Puc1 (an mNeonGreen knock-in at the puc1 locus preserving the
    UTRs, as in the puc1-V5 allele) in single cells across the cycle and during nitrogen starvation, quantify
    nuclear/cytosolic ratios, and test NLS/NES-tagged Puc1 variants for rescue of the cig1 cig2 puc1 G1
    delay and of the zfs1 mating defect.
