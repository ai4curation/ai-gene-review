- term:
    id: GO:0023052
    label: signaling
  evidence_type: NAS
  original_reference_id: GO_REF:0000051
  qualifier: involved_in
  review:
    summary: PomBase keyword-mapping (NAS) annotation to the root-level term 'signaling'. Puc1 is a cyclin;
      its regulatory role in the nutrient-responsive decision between cycling and sexual differentiation
      is real, but it is executed as the activating subunit of the Cdc2 kinase, and GO already captures
      that with the specific G1/S-regulation and mitotic-to-meiotic switching terms on this gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term is not strictly false - Puc1 abundance integrates nitrogen/TOR input (via Zfs1) into
      the G1 decision - but 'signaling' at the root of the branch conveys no information about what Puc1
      does, and the specific terms (GO:1900087, GO:0110045) are already annotated. A generic keyword mapping
      of this kind is an over-annotation rather than a function to retain.
    supported_by:
    - reference_id: PMID:29084823
      supporting_text: We found that Zfs1 negatively regulates the G1 cyclin Puc1, and deregulated Puc1
        levels inhibit differentiation in the zfs1Δ mutant
      reference_section_type: ABSTRACT
    - reference_id: PMID:8006074
      supporting_text: We conclude that puc1 contributes to negative regulation of the timing of sexual
        development in fission yeast, and functions at the transition between cycling and non-cycling
        cells
      reference_section_type: ABSTRACT
