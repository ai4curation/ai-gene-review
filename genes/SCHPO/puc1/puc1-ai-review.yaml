  review:
    summary: 'Phylogenetic (PAINT) annotation of G1/S transition of the mitotic cell cycle from the G1-cyclin
      node PTN000019791 (cyclin D, Cln1/2/3, Cig1/Cig2, Puc1). Puc1 is the fission-yeast Cln-type cyclin:
      it complements budding-yeast cln1 cln2 cln3 deficiency, and in S. pombe the Puc1-Cdc2 kinase phosphorylates
      the CDK inhibitor Rum1 and, redundantly with Cig1 and Cig2, sets the length of G1 and the cell size
      at which S phase begins.'
    action: ACCEPT
    reason: 'The node placement is sound - promoting the G1/S transition is the ancestral function of
      the Cln/cyclin-D clade - and the target has its own direct support: complementation of G1-arrested
      cln- budding yeast (PMID:1828291), Puc1-Cdc2 phosphorylation of Rum1 with a marked G1 delay and
      increased size at S-phase entry in cig1 cig2 puc1 cells (Martin-Castellanos et al. 2000, cited via
      the deep-research file), and the Ran1/Cdc10 association at Start (PMID:9201720). Core function,
      although executed redundantly with Cig1/Cig2.'
    supported_by:
    - reference_id: PMID:1828291
      supporting_text: We have isolated a G1-type cyclin gene called puc1+ from S. pombe, using a functional
        assay in S. cerevisiae
      reference_section_type: ABSTRACT
