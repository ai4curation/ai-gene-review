  review:
    summary: Phylogenetic annotation of cyclin-dependent protein serine/threonine kinase regulator activity,
      the defining function of the cyclin family; puc1 (PomBase:SPBC19F5.01c) is itself among the experimental
      donors, as expected because PomBase carries the IGI row from Forsburg & Nurse 1991. Puc1 binds Cdc2
      and confers on it a Rum1-resistant kinase activity that phosphorylates Rum1 T58/T62.
    action: MODIFY
    reason: The IBD node placement is sound - CDK-regulatory activity is ancestral to the whole cyclin
      family and Puc1 is inside the clade with its own evidence - but every member of node PTN000019791
      is an activating cyclin (the node contains no CDK inhibitors), and for Puc1 specifically association
      with Cdc2 generates kinase activity (Martin-Castellanos et al. 2000) and Puc1 restores proliferation
      to cln-deficient budding yeast. The child term cyclin-dependent protein serine/threonine kinase
      activator activity (GO:0061575) is the accurate description; the parent 'regulator' term is not
      wrong, only less informative. Same refinement as applied in the budding-yeast CLN3 review.
    proposed_replacement_terms:
