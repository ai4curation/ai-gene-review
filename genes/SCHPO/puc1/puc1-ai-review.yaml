gene_symbol: puc1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Puc1 is the Cln-type (G1) cyclin of the fission yeast Schizosaccharomyces pombe. It has
  no catalytic activity of its own: it binds the single cell-cycle cyclin-dependent kinase Cdc2 and generates
  a Puc1-Cdc2 kinase that, unlike the Cdc13-Cdc2 and Cig2-Cdc2 complexes, is largely resistant to the
  G1 CDK inhibitor Rum1 and can phosphorylate Rum1 on the residues (Thr58/Thr62) that target it for SCF-dependent
  destruction. Through this Rum1-directed activity Puc1 helps open the G1 gate: redundantly with the B-type
  cyclins Cig1 and Cig2 it shortens G1 and couples entry into S phase to cell size, so that puc1 deletion
  alone is nearly silent whereas cig1 cig2 puc1 cells have a long G1, enter S phase at a larger size and
  arrest in G1 after fewer divisions when nitrogen is withdrawn. Puc1 cannot itself drive DNA replication,
  which requires the B-type cyclin-Cdc2 complexes; its role is to relieve G1 inhibition. puc1+ was discovered
  by its ability to complement budding-yeast cells lacking the G1 cyclins CLN1, CLN2 and CLN3, and the
  Puc1 cyclin associates in vivo with the Ran1/Pat1 kinase and with Cdc10, the DNA-binding subunit of
  the MBF Start transcription factor, under Ran1 control. Puc1 also governs the choice between continued
  proliferation and sexual differentiation: its transcript rises on nitrogen starvation while the protein
  is held down post-transcriptionally by the RNA-binding protein Zfs1, and Puc1 levels set, in a dose-dependent
  way, how readily cells exit the mitotic cycle to mate - overexpression blocks sexual development and
  rescues the lethal meiosis of pat1ts cells, while loss of puc1 restores mating to zfs1 mutants and accelerates
  G1 arrest under nitrogen limitation. Puc1 is non-essential, is nearly undetectable during meiotic prophase
  and has no specific meiotic function. Localization data come only from a proteome-wide YFP screen, which
  placed Puc1 in the nucleus and cytosol.'
