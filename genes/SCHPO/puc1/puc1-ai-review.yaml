- description: Regulatory cyclin subunit that binds and activates the Cdc2 (CDK1) serine/threonine kinase,
    forming the Rum1-resistant Puc1-Cdc2 G1 holoenzyme; in the nucleus this kinase phosphorylates the
    G1 CDK inhibitor Rum1 on its SCF-targeting sites and associates with the MBF subunit Cdc10, relieving
    G1 inhibition so that the B-type cyclin-Cdc2 complexes can fire, and thereby - redundantly with Cig1
    and Cig2 - promotes the G1/S transition and couples Start to cell size.
