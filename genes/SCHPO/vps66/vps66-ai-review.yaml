  label: Schizosaccharomyces pombe 972h-
description: vps66 (SPAC1783.02c; UniProt Q9US27) encodes the fission yeast ortholog of S. cerevisiae
  Loa1/Vps66, an acyl-CoA lysophosphatidic acid acyltransferase that prefers oleoyl-CoA. It makes phosphatidic
  acid for triacylglycerol homeostasis and lipid droplet formation. It is in the ER and Golgi in a genome-wide
  screen.
