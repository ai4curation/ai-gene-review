core_functions:
- description: Gamma-glutamyl transpeptidase/glutathione hydrolase that initiates degradation of glutathione
    and glutathione S-conjugates, releasing glutamate and Cys-Gly; induced on nitrogen starvation and
    poor carbon sources.
