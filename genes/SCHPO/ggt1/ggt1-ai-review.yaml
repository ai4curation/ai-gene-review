  label: Schizosaccharomyces pombe 972h-
description: Gamma-glutamyltransferase 1 (glutathione hydrolase proenzyme 1, Ggt1; EC 2.3.2.2 / 3.4.19.13)
  of Schizosaccharomyces pombe, one of two GGT-family Ntn-hydrolase paralogs (with Ggt2). It is a single-pass
  type II membrane protein whose proenzyme is predicted to autocleave into a heavy and a light chain carrying
  the catalytic N-terminal threonine. It cleaves the gamma-glutamyl bond of glutathione and glutathione
  S-conjugates, releasing L-glutamate (or transferring the gamma-glutamyl group to an acceptor) and L-cysteinylglycine,
  the first step of glutathione degradation. Increased gene dosage raises cellular GGT activity. ggt1
  transcription is induced by nitrosative stress and glutathione depletion (Pap1-dependent) and by non-fermentable
  carbon sources and nitrogen starvation (Pap1-independent), consistent with mobilisation of stored glutathione
  as a nitrogen and sulfur source. By analogy to S. cerevisiae Ecm38 it is expected to act at the vacuole,
  but a genome-wide tagging study detected tagged Ggt1 in the endoplasmic reticulum.
