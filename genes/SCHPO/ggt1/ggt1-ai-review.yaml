suggested_questions:
- question: 'Where does endogenous (not overexpressed) Ggt1 reside: vacuolar membrane like Ggt2 and S.
    cerevisiae Ecm38, or a different endomembrane compartment?'
- question: Do Ggt1 and Ggt2 have distinct physiological roles (nitrogen/carbon starvation for Ggt1, oxidative
    stress for Ggt2), and which accounts for most GGT activity?
suggested_experiments:
- hypothesis: Endogenously tagged Ggt1 localises to the vacuolar membrane.
  description: Image chromosomally tagged Ggt1 at native levels with an FM4-64 vacuole stain under nitrogen
    starvation; compare with an ER marker.
- hypothesis: Ggt1 and Ggt2 are redundant for use of glutathione as a nitrogen source.
  description: Measure GGT activity and growth on glutathione as sole nitrogen source in ggt1, ggt2 and
    ggt1 ggt2 deletion strains.
