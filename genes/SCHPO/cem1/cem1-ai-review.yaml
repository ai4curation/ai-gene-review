id: O94297
gene_symbol: cem1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Cem1 is a mitochondrial beta-ketoacyl-ACP synthase of the dissociated type II fatty-acid
  synthesis machinery. Its conserved ketoacyl-synthase domains and catalytic residues support malonyl-ACP-dependent
  two-carbon acyl-chain extension. Transfer from characterized mitochondrial OXSM/Cem1 homologs supports
  a role in producing acyl-ACP intermediates needed for mitochondrial metabolism, while its exact substrate
  range in fission yeast remains unresolved.
