  - UniProtKB:P9WQD9
  - UniProtKB:Q9NWU1
  review:
    summary: 3-oxoacyl-[acyl-carrier-protein] synthase activity is supported.
    action: ACCEPT
    reason: The beta-ketoacyl-synthase N- and C-terminal domains and annotated catalytic Cys/His residues
      establish the relevant enzyme family. Human mitochondrial OXSM directly elongates acyl-ACP and complements
      budding-yeast cem1 deficiency (PMID:15668256); this supports conserved mitochondrial fatty-acid
      synthesis by inference, without transferring an exact substrate preference to fission yeast.
    supported_by: &id001
    - reference_id: file:SCHPO/cem1/cem1-uniprot.txt
      supporting_text: DR   InterPro; IPR000794; Beta-ketoacyl_synthase.
    - reference_id: PMID:15668256
      supporting_text: 'The enzyme can elongate acyl-chains containing 2-14 carbon

        atoms with malonyl moieties attached in thioester linkage to the human

        mitochondrial acyl carrier protein and is able to restore growth to the

        respiratory-deficient yeast mutant cem1 that lacks the endogenous mitochondrial

        beta-ketoacyl synthase and exhibits lowered lipoic acid levels.'
