  review:
    summary: Process in which the condensation step is performed; propagated from PTN000918584.
    action: ACCEPT
    reason: The ketoacyl-ACP synthase directly performs the C-C bond-forming step of each elongation
      cycle, so it participates in (not merely supports) fatty acid biosynthesis. In mitochondria a
      single mtKAS carries out all elongation reactions (PMID:17242430). The budding-yeast cem1 null
      did not change bulk mitochondrial fatty acids (PMID:8412701), which is consistent with mtFAS
      making a specialised acyl-ACP pool rather than bulk lipid; the cytosolic Fas1/Fas2 complex makes
      bulk fatty acids. The term remains accurate for the mitochondrial pathway. PAINT curators did
      not propagate lipoate biosynthesis to this node; that omission is respected here.
    supported_by:
    - reference_id: PMID:17242430
      supporting_text: By comparison, mtKAS carries out all elongation reactions in the mitochondria.
    - reference_id: PMID:15668256
      supporting_text: The enzyme can elongate acyl-chains containing 2-14 carbon atoms with malonyl
        moieties attached in thioester linkage to the human mitochondrial acyl carrier protein
