suggested_questions:
- question: >-
    Does S. pombe cem1 deletion abolish protein lipoylation (pyruvate and 2-oxoglutarate
    dehydrogenase E2 subunits) and respiratory growth, as the budding-yeast cem1 null does?
- question: >-
    Should the mtKAS step be linked to lipoate biosynthesis in GO for this lineage? PAINT curators
    propagated only fatty acid biosynthesis and the KAS activity to PTN000918584, so any octanoyl-ACP
    to lipoate link would need experimental support in a fungal or animal ortholog first.
suggested_experiments:
- description: >-
    Complement a S. cerevisiae cem1-null strain with S. pombe cem1 (wild type and C170A) and assay
    respiratory growth and lipoylation, to test catalytic function and conservation.
- description: >-
    Assay recombinant mature Cem1 (residues 19-426) with S. pombe mitochondrial ACP-bound acyl
    substrates of increasing chain length to determine its chain-length preference.
