    summary: Core catalytic activity, propagated from the PANTHER PTHR11712 node PTN000918584 that
      unites bacterial FabB/FabF/KasA/KasB, plant KAS and human mitochondrial OXSM.
    action: ACCEPT
    reason: cem1 is classified in PANTHER subfamily PTHR11712:SF336 (3-oxoacyl-ACP synthase,
      mitochondrial) together with S. cerevisiae CEM1 and human/mouse OXSM, and it descends from the
      eukaryotic node PTN000918585 that carries the mitochondrial localisation of this lineage. The
      IBD at PTN000918584 is seeded by experimentally characterised condensing enzymes including human
      OXSM, which elongates C2-C14 acyl-ACP with malonyl-ACP and complements a cem1-null budding yeast
      (PMID:15668256). The fission yeast protein retains the full KS3 domain and the Cys-His-His
      catalytic triad (C170, H311, H351) that mtKAS enzymes use (PMID:17242430), so there is no
      sequence evidence for loss of activity. The node placement is therefore sound for this target.
