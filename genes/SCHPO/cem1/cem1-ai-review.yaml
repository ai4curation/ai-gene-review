gene_symbol: cem1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  cem1 (SPBC887.13c) encodes the fission yeast mitochondrial beta-ketoacyl-[acyl-carrier-protein]
  synthase (mtKAS, EC 2.3.1.41), a 426-residue freestanding FabF-like condensing enzyme of the
  thiolase-like superfamily. A predicted N-terminal mitochondrial presequence precedes a single
  ketosynthase (KS3) domain that retains the Cys-His-His catalytic triad (Cys170, His311, His351).
  By orthology with budding-yeast Cem1 and human OXSM it is expected to catalyse the decarboxylative
  Claisen condensation of malonyl-ACP with a growing acyl-ACP, the chain-extending step of the
  dissociated (type II) mitochondrial fatty acid synthase in the mitochondrial matrix. In other
  eukaryotes this pathway supplies octanoyl-ACP, the precursor of protein-bound lipoic acid, and
  longer acyl chains needed for respiratory competence. A genome-wide YFP-tagging screen places the
  S. pombe protein in mitochondria; its catalytic activity, chain-length preference and mutant
  phenotype have not been measured directly in fission yeast.
