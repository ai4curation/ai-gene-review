  review:
    summary: Transfer from S. cerevisiae Gut2, whose outer-membrane annotation comes from organelle proteomics.
      FAD-dependent G3P dehydrogenases are generally described as facing the intermembrane space on the
      inner membrane, where they reduce ubiquinone. No S. pombe data distinguish outer from inner membrane.
      mitochondrion and mitochondrial membrane capture what is known.
    action: MARK_AS_OVER_ANNOTATED
    reason: Sub-mitochondrial placement transferred by similarity is not well supported.
    supported_by:
    - reference_id: file:SCHPO/gut2/gut2-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion {ECO:0000250}.'
