  label: Schizosaccharomyces pombe 972h-
description: gut2 (SPCC1223.03c; UniProt O14400) encodes the mitochondrial FAD-dependent glycerol-3-phosphate
  dehydrogenase (EC 1.1.5.3). It oxidises sn-glycerol 3-phosphate to dihydroxyacetone phosphate and passes
  the electrons to the quinone pool of the respiratory chain. With the cytosolic NAD-dependent glycerol-3-phosphate
  dehydrogenases (gpd1, gpd2), it can form a glycerol-3-phosphate shuttle that moves cytosolic NADH reducing
  equivalents into respiration. It is mitochondrial in a genome-wide screen; function is assigned by orthology
  to S. cerevisiae GUT2.
