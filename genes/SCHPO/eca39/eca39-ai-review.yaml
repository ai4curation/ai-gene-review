core_functions:
- description: PLP-dependent branched-chain amino acid aminotransferase (EC 2.6.1.42), the single fission-yeast
    BCAT, which transaminates 2-oxoisovalerate, (S)-3-methyl-2-oxopentanoate and 2-oxoisocaproate with
    glutamate to give valine, isoleucine and leucine. This is the final step of all three biosynthetic
    branches; the enzyme is mitochondrial and is also detected in the cytoplasm.
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009098
    label: L-leucine biosynthetic process
  - id: GO:0009099
    label: L-valine biosynthetic process
  - id: GO:1901705
    label: L-isoleucine biosynthetic process
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:9483807
    supporting_text: A genetic growth assay for BCAT activity was established using an S. cerevisiae strain
      disrupted in both BCAT isoenzymes.
  - reference_id: PMID:9483807
    supporting_text: Consequently, the activity of the S. pombe BCAT was demonstrated by genetic and biochemical
      means.
  - reference_id: PMID:35325114
    supporting_text: At this stage, Ile and Val are produced by BCAAs aminotransferase (BCAT), encoded
      by eca39+, from (S)-3-methyl-2-oxopentanoate and 3-methyl-2-oxobutanoate, respectively
  - reference_id: PMID:35325114
    supporting_text: The final step in Leu biosynthesis, i.e. the transamination reaction, is catalyzed
      by BCAT Eca39, which is the same enzyme as in Ile and Val syntheses
  - reference_id: PMID:35325114
    supporting_text: As in Anheuser-Busch baker's yeast, BCAT Eca39 has been confirmed to be present in
      various parts of S. pombe cells, including cytoplasm and mitochondria
knowledge_gaps:
- gap_statement: eca39 is the only S. pombe BCAT, yet the isoleucine/valine 2-oxoacids are made in mitochondria
    while 2-oxoisocaproate is made in the cytosol. Whether eca39 is dual-localised (for example by alternative
    translation start or partial import), or whether one compartment's 2-oxoacids are transported to the
    other, is unknown.
  boundary: 'Established: transit peptide, mitochondrial presence, and a cytoplasmic/nuclear YFP signal
    from a C-terminally tagged ORFeome clone (possibly built on an earlier gene model; UniProt records
    a gene-model revision). Unknown: the endogenous distribution and the compartment in which each transamination
    occurs.'
  gap_kind:
  - BIOLOGY
  status: OPEN
suggested_experiments:
- description: Tag eca39 at the endogenous locus (C-terminal) and image with a mitochondrial marker; express
    transit-peptide-deleted and import-only variants in an eca39 deletion and test which restores growth
    without leucine, isoleucine or valine.
