gene_symbol: eca39
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Branched-chain amino acid aminotransferase (BCAT, EC 2.6.1.42) of fission yeast, encoded
  by SPBC428.02c and homologous to mammalian ECA39/BCAT and S. cerevisiae BAT1/BAT2. It is a pyridoxal
  5'-phosphate-dependent class-IV aminotransferase. It reversibly transfers the amino group of glutamate
  to 2-oxoisovalerate, (S)-3-methyl-2-oxopentanoate and 2-oxoisocaproate (4-methyl-2-oxopentanoate), forming
  valine, isoleucine and leucine; this is the last step of all three biosynthetic routes and the first
  step of their catabolism. It is the only BCAT of S. pombe and complements the branched-chain amino acid
  auxotrophy of an S. cerevisiae bat1 bat2 double mutant. It has an N-terminal mitochondrial transit peptide
  and is present in mitochondria, but a tagged version was also seen in the cytoplasm and nucleus. How
  one enzyme serves the mitochondrial Ile/Val trunk and the cytosolic end of the leucine branch is unresolved.
