suggested_questions:
- question: 'What is the role of the second argininosuccinate lyase paralog arg7, whose deletion does
    not cause auxotrophy: redundant low-level activity, a different expression condition, or a divergent
    function?'
- question: In the PomBase arginine GO-CAM the arg41 lyase activity rests on IBA evidence only while arg7
    carries IMP evidence; should the arg41 activity cite the deletion phenotype (PMID:32896087) as the
    paralog required for prototrophy?
suggested_experiments:
- description: Assay argininosuccinate lyase activity in extracts of arg41 and arg7 single and double
    deletions, and test complementation of arg41 deletion by arg7 overexpression.
