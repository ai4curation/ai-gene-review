description: arg41 (SPBC1539.03c; UniProt gene name argx) encodes an argininosuccinate lyase (EC 4.3.2.1)
  of the lyase 1 family, orthologous to S. cerevisiae ARG4. It cleaves 2-(N-omega-L-arginino)succinate
  into L-arginine and fumarate, the final step of arginine biosynthesis, and acts in the cytosol. S. pombe
  has a second argininosuccinate lyase paralog, arg7 (SPBC1773.14); deletion of arg41 causes arginine
  auxotrophy whereas deletion of arg7 does not, indicating that arg41 supplies most or all of the lyase
  activity needed for arginine prototrophy. The catalytic activity is inferred from sequence; it has not
  been assayed for the purified S. pombe protein.
