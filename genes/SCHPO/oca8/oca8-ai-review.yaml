  label: Schizosaccharomyces pombe 972h-
description: oca8 (SPCC16A11.10c) encodes one of two microsomal-type cytochrome b5 proteins in fission
  yeast (the other is cyb502). It has an N-terminal heme-binding cytochrome b5 domain and a C-terminal
  tail anchor for insertion into the endoplasmic reticulum membrane. By homology with S. cerevisiae
  Cyb5 it is a one-electron carrier that accepts electrons from NADH-cytochrome b5 reductase (Cbr1)
  and passes them to ER oxygenases of ergosterol synthesis, such as the C-5 sterol desaturases
  (Erg31/Erg32) and the C-4 methyl sterol oxidase. A genome-wide C-terminal YFP-tag screen reported a
  mitochondrial signal. The protein has not been characterised biochemically, and its relation to
  Cyb502 is unknown. Deletion is viable.
