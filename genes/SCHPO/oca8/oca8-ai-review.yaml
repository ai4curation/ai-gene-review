    summary: Keyword mapping of the UniProt "Mitochondrion" location, which UniProt attributes to the
      S. pombe ORFeome YFP screen. That screen tagged ORFs at the C terminus, which for a tail-anchored
      protein such as Oca8 can mistarget the fusion. PomBase did not make a matching HDA annotation.
      Some cytochromes b5 do reside in the mitochondrial outer membrane, so a mitochondrial pool is
      possible but unconfirmed.
    action: KEEP_AS_NON_CORE
