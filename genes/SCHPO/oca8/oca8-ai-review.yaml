core_functions:
- description: Tail-anchored ER cytochrome b5 that carries single electrons from Cbr1 to ER sterol
    oxygenases (C-5 desaturases Erg31/Erg32 in the PomBase model; C-4 methyl oxidase and CYP51 by
    homology with S. cerevisiae Cyb5). Probably partly redundant with Cyb502.
