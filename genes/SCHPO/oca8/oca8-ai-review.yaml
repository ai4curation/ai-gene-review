suggested_questions:
- question: Is Oca8 partly mitochondrial, as the C-terminally tagged ORFeome fusion suggested, and does
    it serve acceptors different from those of Cyb502?
suggested_experiments:
- description: Tag Oca8 at the N terminus (preserving the tail anchor) and co-localise it with ER and
    mitochondrial markers; combine with cyb502 oca8 double deletion and sterol GC-MS profiling.
