description: Vma8 is the fission yeast V-type proton ATPase subunit D, a conserved
  peripheral V1-sector component of the vacuolar V-ATPase. It functions as part
  of the fungal vacuole membrane rotary ATPase complex, contributing to ATP-driven
  proton pumping that acidifies the vacuole and other endomembrane compartments.
