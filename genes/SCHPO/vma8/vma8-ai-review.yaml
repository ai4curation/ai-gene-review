    summary: Mark as over-annotated. Vma8 is a peripheral V1 component that may
      have a soluble pool, but its established pump function is at vacuolar
      membranes.
    action: MARK_AS_OVER_ANNOTATED
    reason: Matsuyama et al. performed a high-throughput YFP localization screen,
      and the abstract-only cache does not expose the vma8 image or supplemental
      table. The broader functional evidence places Vma8 in the V1 sector on the
      cytoplasmic face of the vacuole membrane; the cytosol call should therefore
      not be treated as a core active site for V-ATPase proton pumping.
