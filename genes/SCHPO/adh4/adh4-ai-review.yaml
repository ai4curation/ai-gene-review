suggested_questions:
- question: Should adh4 carry an ethanol catabolic process (GO:0006068) annotation for its mitochondrial
    ethanol oxidation, given that S. pombe cannot use ethanol as sole carbon source?
- question: 'Where does adh4 act during compensatory fermentation in adh1 null cells: is a cytosolic pool
    produced, or is acetaldehyde reduced in the matrix with NADH exchanged by a shuttle?'
- question: Is adh4 a zinc- or an iron-activated enzyme in vivo, and is its induction by zinc deficiency
    a metal-sparing replacement for the zinc enzyme adh1?
suggested_experiments:
- description: Localise endogenously tagged adh4 in wild-type and adh1 null cells under fermentative conditions
    to test whether the protein relocates to the cytosol when it supports fermentation.
- description: Determine metal content and metal-dependent activity of purified adh4 (Fe2+ vs Zn2+) by
    ICP-MS and reconstitution.
