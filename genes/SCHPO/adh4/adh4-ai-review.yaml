  evidence_type: EXP
  original_reference_id: PMID:16999687
  qualifier: is_active_in
  review:
    summary: Adh4-dependent ethanol oxidation is experimentally localized to mitochondria; the separate
      matrix assignment supplies finer resolution.
    action: ACCEPT
    reason: PMID:16999687 reports ethanol-dependent, antimycin-sensitive oxygen uptake and alcohol dehydrogenase
      activity in isolated S. pombe mitochondria. The adh4 knockout identifies the gene responsible; detergent
      latency separately supports a matrix enzyme. Mitochondrion is an informative, directly supported
      organelle assertion and is retained under the root-organelle policy rather than replaced by matrix.
      The two existing matrix annotations remain separate. These oxidative assays do not establish the
      compartment of compensatory reductive fermentation.
    supported_by:
    - reference_id: PMID:16999687
      supporting_text: we show conclusively that the novel mitochondrial ADH is encoded by adh4
    - reference_id: PMID:16999687
      supporting_text: which demonstrates that the enzyme is located in the matrix
