description: 'adh4 (SPAC5H10.06c) encodes an NAD+-dependent alcohol dehydrogenase (EC 1.1.1.1) of the
  iron-activated group III (''ADH4-type'') family, unrelated in fold to the zinc ADH adh1 and homologous
  to S. cerevisiae ADH4 and Zymomonas ADH II. Biochemical and knockout work places it in the mitochondrial
  matrix, where it oxidises ethanol to acetaldehyde and supplies matrix NADH to the respiratory chain.
  adh4 is also the back-up fermentative enzyme: in adh1 null cells its expression rises and it supports
  ethanol production, and cells lacking both adh1 and adh4 cannot grow fermentatively. Its transcript
  is induced by zinc deficiency. UniProt records a Zn2+ cofactor by similarity, although the family is
  named for iron; the metal used in vivo has not been determined.'
