  label: Schizosaccharomyces pombe 972h-
description: 'Adh4 is an NAD-dependent alcohol dehydrogenase of Schizosaccharomyces pombe belonging to
  the iron-containing alcohol dehydrogenase family. Mitochondrial fractionation, activity assays and gene
  disruption place an ethanol-oxidizing activity in the mitochondrial matrix, where it supplies reducing
  equivalents for respiration. Adh4 also supports compensatory ethanol production in adh1-null cells,
  although the compartment of that reductive activity is unresolved. The family name does not establish
  its physiological metal: UniProt assigns zinc by similarity, and direct native metal identification
  remains lacking.'
