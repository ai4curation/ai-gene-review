suggested_questions:
- question: Does S. pombe aga1 have measurable acetyl-CoA-dependent N-acetylglutamate synthase activity,
    and does it contribute to N-acetylglutamate supply in arg6 deletion strains?
- question: Is aga1 feedback-inhibited by ornithine as reported for other ArgJ enzymes?
suggested_experiments:
- description: Purify the processed alpha/beta aga1 heterodimer and assay both ornithine acetyltransferase
    and acetyl-CoA-dependent glutamate acetylation; test whether aga1 overexpression rescues arg6 deletion.
