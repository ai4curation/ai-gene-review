description: 'aga1 (SPBC1271.14) encodes the fission-yeast ArgJ-family arginine biosynthesis bifunctional
  protein, the ortholog of S. cerevisiae ARG7. It is a mitochondrial matrix enzyme made as a single precursor
  that is autoproteolytically split into alpha and beta chains forming the active heterodimer. Its main
  activity is ornithine acetyltransferase (glutamate N-acetyltransferase, EC 2.3.1.35): it transfers the
  acetyl group of N2-acetyl-L-ornithine to L-glutamate, releasing L-ornithine and regenerating N-acetyl-L-glutamate,
  which closes the acetyl cycle of fungal arginine biosynthesis. ArgJ-family enzymes can also make N-acetylglutamate
  from acetyl-CoA (EC 2.3.1.1), but in fungi the anaplerotic synthase is a separate enzyme (arg6 in S.
  pombe). The activities are inferred from family membership and orthology; the protein has not been assayed
  directly in S. pombe, but deletion causes arginine auxotrophy and the protein localises to mitochondria.
  The UniProt entry carries no gene name; aga1 is the PomBase name.'
