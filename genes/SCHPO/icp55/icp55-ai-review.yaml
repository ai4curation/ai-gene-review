id: Q10439
gene_symbol: icp55
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  icp55 encodes a predicted mitochondrial M24B metallopeptidase, orthologous to
  S. cerevisiae Icp55/ICP55. It is inferred to act on the matrix side of the
  inner mitochondrial membrane as an intermediate cleaving peptidase, removing
  destabilizing N-terminal residues that remain after mitochondrial processing
  peptidase cleavage of imported precursor proteins.
existing_annotations:
- term:
    id: GO:0004177
    label: aminopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G09300
  - PANTHER:PTN001650889
  - SGD:S000000880
  - UniProtKB:Q9NQH7
  review:
    summary: >-
      Correct but general; the M24B/ICP55 inference supports the more specific
      metalloaminopeptidase term that this review also accepts.
    action: MODIFY
    reason: >-
      The PAINT transfer comes from characterized ICP55-family metallopeptidases
      that remove N-terminal residues from mitochondrial processing
      intermediates. GO:0070006 captures the metal-dependent aminopeptidase
      activity more precisely than the parent aminopeptidase term.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001650889
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node supports ICP55-family aminopeptidase activity; the
          target review refines that broad parent to the accepted M24B
          metalloaminopeptidase activity.
    proposed_replacement_terms:
    - id: GO:0070006
      label: metalloaminopeptidase activity
    supported_by:
    - reference_id: file:genes/SCHPO/icp55/icp55-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Aminopeptidase which cleaves preprotein intermediates
    - reference_id: PMID:19837041
      reference_section_type: ABSTRACT
      supporting_text: >-
        Icp55, which removes an amino acid from a characteristic set of
        MPP-generated N-termini
- term:
