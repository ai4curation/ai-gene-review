    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026971
  review:
    summary: >-
      True only as an ancestor of the supported mitochondrial location, and too
      broad to keep as a useful component annotation.
    action: TOO_GENERAL
    reason: >-
      icp55 has a predicted mitochondrial transit peptide, the direct
      fission-yeast localization row places it in mitochondria, and curator and
      homology calls place it in the mitochondrial matrix or on the matrix side
      of the inner membrane. The ARBA cytoplasm call is therefore just a broad
      ancestor of the specific mitochondrial locations.
    supported_by:
    - reference_id: PMID:16823372
      reference_section_type: ABSTRACT
      supporting_text: >-
        we determined the localization of 4,431 proteins, corresponding to
        approximately 90% of the fission yeast proteome
    - reference_id: file:genes/SCHPO/icp55/icp55-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Mitochondrion inner membrane
