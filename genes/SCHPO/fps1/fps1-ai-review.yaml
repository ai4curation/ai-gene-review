  label: Schizosaccharomyces pombe 972h-
description: 'fps1 (SPAC6F12.13c; UniProt O14230) encodes the essential farnesyl diphosphate synthase
  (FPS; EC 2.5.1.10) of fission yeast. It condenses DMAPP with two IPP units, through geranyl diphosphate,
  to (2E,6E)-farnesyl diphosphate, the branch-point precursor of sterols, dolichol, ubiquinone, heme A
  and farnesylated proteins. fps1 rescues S. cerevisiae FPS deficiency and E. coli ispA. S. pombe has
  no separate GGPP synthase: instead, Fps1 binds the FPS-like Spo9 to form a heteromeric complex with
  geranylgeranyl diphosphate synthase activity, which is needed for protein geranylgeranylation and forespore
  membrane growth.'
