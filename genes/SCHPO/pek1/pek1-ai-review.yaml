- id: PMID:10365961
  title: The MAPK kinase Pek1 acts as a phosphorylation-dependent molecular switch.
  findings:
  - statement: Pek1 is the MAPKK for the cell integrity MAPK Pmk1; unphosphorylated
      Pek1 inhibits Pmk1 signalling and Mkh1 phosphorylation converts it to an activator.
    supporting_text: Pek1, in its unphosphorylated form, acts as a potent negative regulator
      of Pmk1 MAPK signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; title and abstract match PubMed record and the
      UniProt RX line. Primary identification of Pek1.
- id: PMID:10591634
  title: Skh1, the MEK component of the mkh1 signaling pathway in Schizosaccharomyces
    pombe.
  findings:
  - statement: Skh1 (= Pek1) is the MEK of the Mkh1-Spm1 cascade; Mkh1, Skh1 and Spm1
      form a two-hybrid ternary complex and their deletions have identical cell wall phenotypes.
    supporting_text: We present biochemical and genetic evidence that Skh1 is the MEK
      component of the Mkh1-Spm1 MAP kinase cascade.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; independent identification of the same gene.
