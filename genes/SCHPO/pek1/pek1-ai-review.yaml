  label: Schizosaccharomyces pombe 972h-
description: >-
  Pek1 (also named Skh1/Mkk1; SPBC543.07) is the 363-residue MAP kinase kinase
  (MAPKK/MEK) of the fission yeast cell integrity pathway (CIP). It consists
  almost entirely of a STE-group protein kinase domain (residues 79-343) with the
  canonical ATP-binding lysine region and HRD catalytic aspartate, and the
  activation-loop Ser234/Thr238 sites that are phosphorylated by the upstream
  MAPKKK Mkh1. Pek1 sits in an unbranched Mkh1-Pek1-Pmk1(Spm1) module: it is
  required for basal and stress-induced activating phosphorylation of the
  ERK-type MAPK Pmk1, a constitutively active Pek1 (Pek1-DD) drives Pmk1
  tyrosine/dual phosphorylation in vivo, and purified Pek1-DD stimulates Pmk1
  kinase activity in vitro. Yeast two-hybrid data indicate that Mkh1, Pek1 and
  Pmk1 form a ternary complex. Unphosphorylated Pek1 also acts as a negative
  regulator of Pmk1 signalling, so that Pek1 behaves as a phosphorylation-dependent
  switch. Pek1 is mainly cytoplasmic and is also found at the
  division septum during cytokinesis. Loss of pek1 phenocopies loss of mkh1 or
  pmk1, causing sensitivity to cell wall-degrading enzymes, chloride/KCl
  sensitivity, multiseptation and defects in calcineurin-linked Ca2+ signalling,
  reflecting the outputs of the Pmk1 pathway rather than separate activities of
  Pek1. Pek1 belongs to the MAPKK family (PANTHER PTHR48013) and is the fission
  yeast member of the fungal cell-integrity MAPKK clade that also contains
  S. cerevisiae Mkk1/Mkk2 and Neurospora MEK-1.
