knowledge_gaps:
- gap_statement: The ilv3 deletion cannot grow on Edinburgh minimal medium even when leucine, isoleucine
    and valine are supplied, although it grows on synthetic dextrose medium with these amino acids. The
    basis of this medium-specific requirement is unknown.
  boundary: 'Established: BCAA auxotrophy and rescue by S. cerevisiae ILV3. Unknown: whether the EMM defect
    reflects pantothenate/CoA precursor (2-oxoisovalerate) limitation, a nitrogen-source effect on BCAA
    uptake, or a non-catalytic role of ilv3.'
  gap_kind:
  - BIOLOGY
  status: OPEN
suggested_experiments:
- description: Test whether pantothenate, 2-oxoisovalerate or a change of nitrogen source (ammonium chloride
    versus glutamate) rescues growth of ilv3 deletion cells on EMM plus Leu/Ile/Val.
