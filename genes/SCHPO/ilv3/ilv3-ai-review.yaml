  label: Schizosaccharomyces pombe 972h-
description: Dihydroxy-acid dehydratase (DHAD, EC 4.2.1.9) of fission yeast, encoded by SPAC17G8.06c (ilv3+)
  and orthologous to S. cerevisiae ILV3 and bacterial IlvD. It is an iron-sulfur cluster enzyme of the
  IlvD/EDD family. It dehydrates (2R)-2,3-dihydroxy-3-methylbutanoate to 2-oxoisovalerate (precursor of
  valine and leucine) and (2R,3R)-2,3-dihydroxy-3-methylpentanoate to (S)-3-methyl-2-oxopentanoate (precursor
  of isoleucine). It acts in mitochondria after ketol-acid reductoisomerase (ilv5). The deletion mutant
  needs branched-chain amino acids and is rescued by S. cerevisiae ILV3. The mutant also fails to grow
  on EMM even when Leu, Ile and Val are supplied, which points to an additional, unexplained requirement
  on that medium.
