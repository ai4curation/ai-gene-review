  label: Schizosaccharomyces pombe 972h-
description: alg3 (SPAC7D4.06c; UniProt Q9Y7I4) encodes the Dol-P-Man:Man5GlcNAc2-PP-Dol alpha-1,3-mannosyltransferase
  Alg3, which adds the first lumenal mannose after the Man5 intermediate is flipped. alg3 deletion in
  an och1 background produces truncated N-glycans, a strain used for humanised glycoprotein production.
  In the lumenal phase of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol) assembly on the
  ER membrane, it adds the next sugar to the growing precursor that oligosaccharyltransferase transfers
  to nascent glycoproteins. Function is assigned by orthology to the S. cerevisiae ALG enzymes.
