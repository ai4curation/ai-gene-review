description: SPCC1672.01 (UniProt O14059; the fission yeast HIS2 ortholog) encodes histidinol-phosphatase
  (EC 3.1.3.15) of the PHP hydrolase family, HisK subfamily. It dephosphorylates L-histidinol phosphate
  to L-histidinol, step 8 of histidine biosynthesis. Function is assigned by orthology to S. cerevisiae
  HIS2; a genome-wide screen places it in the cytosol.
