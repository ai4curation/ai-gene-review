  label: Schizosaccharomyces pombe 972h-
description: ura4 (SPCC330.05c) encodes the orotidine 5'-phosphate decarboxylase (OMPDC, EC 4.1.1.23) of fission
  yeast, which decarboxylates OMP to UMP, the final step of de novo UMP synthesis. It is the ortholog of S. cerevisiae
  URA3 (which complements ura4 deletion), not of budding-yeast URA4. ura4 mutants are uracil auxotrophs and 5-fluoroorotic
  acid resistant, making ura4+ the standard counter-selectable marker in S. pombe. ura4 deletion mutants accumulate
  OMP and lyse in polypeptone-containing medium near stationary phase, a cell-wall defect suppressed by uracil or
  by blocking upstream pathway steps. The enzyme is cytosolic; in heat-stressed cells it is among the thermo-sensitive
  endogenous proteins recruited into chaperone-containing protein aggregate centres.
