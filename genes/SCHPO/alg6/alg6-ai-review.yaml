  label: Schizosaccharomyces pombe 972h-
description: alg6 (SPBC342.01c; UniProt O43053) encodes the Dol-P-Glc:Man9GlcNAc2-PP-Dol alpha-1,3-glucosyltransferase
  Alg6, which adds the first glucose. alg6 mutants transfer unglucosylated Man9GlcNAc2 to proteins and
  depend on UDP-Glc:glycoprotein glucosyltransferase (gpt1) for monoglucosylated glycans under ER stress.
  In the lumenal phase of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol) assembly on the
  ER membrane, it adds the next sugar to the growing precursor that oligosaccharyltransferase transfers
  to nascent glycoproteins. Function is assigned by orthology to the S. cerevisiae ALG enzymes.
