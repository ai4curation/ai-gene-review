id: Q9UUI1
gene_symbol: lsm6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Lsm6 is a small (75-residue) Sm-fold protein of fission yeast and one of the seven
  subunits shared by two heteroheptameric Lsm rings that bind the 3' ends of RNAs. In the nucleus it
  is part of the Lsm2-8 ring, which binds the 3' oligouridylate tail of U6 snRNA, preferring the
  2',3'-cyclic phosphate end produced by Usb1, and acts as a chaperone for U6 in the U6 snRNP, the
  U4/U6.U5 tri-snRNP and spliceosome assembly. In fission yeast the same Lsm2-8 ring also binds the
  telomerase RNA TER1 and is a component of the telomerase holoenzyme, where it protects TER1 and
  promotes assembly with the reverse transcriptase Trt1 and the LARP7 protein Pof8. In the cytoplasm
  Lsm6 is part of the Lsm1-7 ring, which loads onto the 3' ends of oligouridylated or deadenylated
  mRNAs and, with Pat1, activates decapping and 5'-3' mRNA decay in P-bodies. Within both rings Lsm6
  sits between Lsm3 and Lsm5, and an Lsm5-Lsm6-Lsm7 subcomplex is an assembly intermediate of both
  rings and binds oligo(U) RNA on its own.
