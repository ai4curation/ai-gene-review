- term:
    id: GO:0005697
    label: telomerase holoenzyme complex
  evidence_type: EXP
  original_reference_id: PMID:35277511
  qualifier: part_of
  review:
    summary: telomerase holoenzyme complex is supported.
    action: ACCEPT
    reason: The nuclear Lsm2-8 ring protects telomerase RNA and supports telomerase assembly in fission
      yeast. This is a complex-level RNA-stabilization role, not reverse-transcriptase catalysis. The
      target is an experimentally established shared Lsm2-8 subunit. The original PMID:35277511 annotation
      is retained at its stated evidential scope; accessible source text and the independent evidence
      cited here are considered together.
    supported_by:
    - *id002
    - &id004
      reference_id: PMID:29422501
      supporting_text: Co-immunoprecipitation assays confirmed an interaction between Lsm3 and Lar7 (Fig.
        5b), indicating that they co-exist as a complex. Their association was sensitive to the presence
        of RNase and was abolished in lar7-W103A and lar7-FV197EE mutants. In addition, an interaction
        between wild-type Lar7 and Trt1 was detected, which was also dependent on RNA (Fig. 5c). These
        data suggested that Lar7, LSm2–8 and Trt1 independently bind to TER1 to form the telomerase ribonucleoprotein
        complex.
