      supporting_text: RNA binding assays show that Lsm2/3 and Lsm5/6/7 bind to oligo(U) whereas no RNA
        binding is observed for Lsm3 and Lsm4. Analysis of the inter-subunit interactions in Lsm5/6/7
        reveals the organization order among Lsm5, Lsm6 and Lsm7.
    - &id002
      reference_id: PMID:32518066
      supporting_text: The multi-ORF expression system was assembled into a single plasmid through ligation
        independent cloning as described for Lsm2–8, with the ORFs assembled in order Lsm6, Lsm3, Lsm2,
        Lsm1, Lsm4, Lsm7, and Lsm5.
