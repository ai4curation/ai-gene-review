    label: U5 snRNP
  evidence_type: IDA
  original_reference_id: PMID:26292707
  qualifier: part_of
  review:
    summary: Possibly attached to the wrong gene product; Lsm6 is not in the deposited PMID:26292707
      spliceosome model, whose U5 Sm ring contains SmF (smf1). Unverified against the full text, so
      left undecided and raised with PomBase as a source defect.
    action: UNDECIDED
    reason: PMID:26292707 is the 3.6-angstrom cryo-EM structure of an S. pombe spliceosome (PDB 3JB9).
      Its U2 and U5 snRNPs carry canonical Sm rings (SmB/D1/D2/D3/E/F/G). A live UniProt query of all
      entries cross-referencing 3JB9 returns 27 S. pombe proteins including all seven Sm proteins and
      smf1 (SmF), but no Lsm protein at all, and Lsm6 lists only Lsm-ring structures. Lsm6 is also not
      an Sm-ring subunit on any evidence; its PANTHER subfamily (PTHR11021:SF1) is the Lsm6 branch,
      distinct from the SmF branch. In QuickGO, lsm6 is the only one of the queried Sm-family proteins
      carrying PMID:26292707 annotations, while smf1 carries none. This is not an inference from a
      title; the deposited model of the cited paper does not contain this protein. The most likely
      explanation is a SmF/Lsm6 mix-up within the SmF/LSm6 family. However, the PDB cross-reference
      shows only what was modelled, not what was in the purified particle or in the paper's
      compositional data, and the cached publication is abstract-only. The curator may have used
      evidence not visible here, so this experimental row is UNDECIDED rather than removed; the
      proposed correction (to smf1) is carried by the source defect for PomBase to check.
    supported_by:
    - &pdb3jb9
      reference_id: file:SCHPO/lsm6/lsm6-bioinformatics/RESULTS-rereview.md
      supporting_text: 'Q9UUI1 (lsm6) in 3JB9: False. No Lsm-named protein is among the 3JB9 entries.'
    - &smf1none
      reference_id: file:SCHPO/lsm6/lsm6-bioinformatics/RESULTS-rereview.md
      supporting_text: The deposited model of the paper behind the three U2/U5 annotations contains SmF
        (smf1) but not Lsm6, and no Lsm2-8 subunit.
    source_defects:
    - &defect3jb9
      defect_type: WRONG_GENE_PRODUCT
      resource: POMBASE
      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: PomBase:SPAC2F3.17c
      corrected_value: PomBase:SPBC3E7.14
      corrected_label: smf1, Sm protein F (UniProtKB:O59734)
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PomBase annotates lsm6 (SPAC2F3.17c) to U2 snRNA binding, U2 snRNP and U5
        snRNP from PMID:26292707 (Yan et al. 2015, S. pombe spliceosome, PDB 3JB9).
        The 3JB9 model contains smf1 (SmF, SPBC3E7.14) and the other canonical Sm
        proteins but no Lsm protein, and smf1 carries no PMID:26292707 annotation.
        SmF and Lsm6 are members of the same SmF/LSm6 family, so a SmF-to-Lsm6 mix-up
        is the likely cause. Please check whether these three annotations were
