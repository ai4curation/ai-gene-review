id: Q9UUI1
gene_symbol: lsm6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Lsm6 is a conserved Sm-fold RNA-binding protein shared by the Lsm2-8 and Lsm1-7 complexes.
  Nuclear Lsm2-8 recognizes uridine-rich RNA ends and supports U6 snRNA function, spliceosome assembly
  and telomerase RNA protection. Cytoplasmic Lsm1-7 associates with Pat1 and promotes mRNA decapping and
  turnover. Fission yeast structures and RNA-binding assays establish the contribution of Lsm6 to these
  oligomeric RNA-binding assemblies.
