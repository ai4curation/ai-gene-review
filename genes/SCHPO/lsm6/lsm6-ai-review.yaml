suggested_questions:
- question: Were the PomBase PMID:26292707 annotations (U2 snRNA binding, U2 snRNP, U5 snRNP) intended
    for smf1 (SmF) rather than lsm6, given that the 3JB9 model contains SmF and no Lsm subunit?
- question: The Lsm6 PAINT node (PTN000111600) propagates P-body but not decapping or mRNA decay terms;
    is decapping deliberately restricted to Lsm1, or should Lsm1-7 subunits carry a contributes_to
    decapping-related annotation?
suggested_experiments:
- description: Test whether lsm6 point mutants at the Lsm5/Lsm3 interfaces separately disrupt Lsm2-8
    (U6 and TER1 levels) versus Lsm1-7 (mRNA decay) function in S. pombe.
