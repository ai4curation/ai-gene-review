    summary: Fission yeast crystallography and biochemical reconstitution place Lsm6 in the Lsm5/6/7
      subcomplex and in the Lsm1-7 ring bound to RNA, so membership of an Sm-like protein family complex
      is correct. The identical term GO:0120114 is already annotated to Q9UUI1 in GOA (IEA, ARBA), and
      the gene also carries the more specific Lsm2-8 and Lsm1-7-Pat1 complex terms, so the prediction is
      not novel.
    supported_by:
    - reference_id: PMID:22615807
      supporting_text: RNA binding assays show that Lsm2/3 and Lsm5/6/7 bind to oligo(U) whereas no RNA
        binding is observed for Lsm3 and Lsm4. Analysis of the inter-subunit interactions in Lsm5/6/7
        reveals the organization order among Lsm5, Lsm6 and Lsm7.
    - reference_id: PMID:32518066
      supporting_text: The structure of S. pombe Lsm1–7 bound to RNA.
