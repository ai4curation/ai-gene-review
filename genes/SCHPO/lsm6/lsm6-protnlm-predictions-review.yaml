description: Lsm6 is a subunit of the experimentally established S. pombe Lsm1-7 and Lsm2-8 RNA-binding
  rings. The single ProtNLM2 prediction, Sm-like protein family complex, is correct but repeats a term the
  gene already carries in GOA.
