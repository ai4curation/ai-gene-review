  label: Schizosaccharomyces pombe 972h-
description: zwf1 (SPAC3A12.18; UniProt O00091) encodes glucose-6-phosphate dehydrogenase (EC 1.1.1.49),
  the regulatory first enzyme of the oxidative pentose phosphate pathway. It oxidises glucose 6-phosphate
  to 6-phosphogluconolactone and generates NADPH. The S. pombe enzyme shows negative cooperativity towards
  glucose 6-phosphate and is competitively inhibited by the PPP intermediates glyceraldehyde 3-phosphate
  and ribulose 5-phosphate, which helps divide glucose 6-phosphate between glycolysis and the PPP. It
  is cytosolic.
