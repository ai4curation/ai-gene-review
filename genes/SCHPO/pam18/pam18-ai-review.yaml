description: >-
  pam18 encodes the conserved Tim14/Pam18 J-domain subunit of the
  presequence translocase-associated motor. It is an integral mitochondrial
  inner-membrane protein in the Pam18/Pam16 regulatory J-complex, where its
  matrix-facing J domain stimulates Ssc1/mtHsp70 ATPase activity to drive
  ATP-dependent translocation of presequence-containing proteins into the
  mitochondrial matrix.
