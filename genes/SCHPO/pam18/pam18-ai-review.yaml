suggested_questions:
- question: >-
    Does S. pombe pam18 have the same Pam16-coupled secondary association with
    respiratory-chain supercomplexes reported for budding-yeast Pam18, or is
    its conserved function limited to the PAM/TIM23 import motor?
  experts: []
suggested_experiments:
- hypothesis: >-
    The S. pombe Pam18 J domain stimulates Ssc1/mtHsp70 ATPase at the
    matrix-facing side of the TIM23-associated PAM complex, and Pam16
    heterodimerization is required to retain Pam18 at the presequence
    translocase.
  description: >-
    Reconstitute S. pombe Pam18 J-domain stimulation of purified Ssc1, then
    introduce Pam18 HPD and Pam16-interface mutations predicted from the
    budding-yeast Pam18/Pam16 structure and measure Ssc1 ATPase stimulation,
    Pam18-Pam16 binding, PAM/TIM23 association, and matrix-directed precursor
    import in isolated mitochondria.
