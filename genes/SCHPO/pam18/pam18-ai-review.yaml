- id: PMID:14605210
  title: J protein cochaperone of the mitochondrial inner membrane required for
    protein import into the mitochondrial matrix.
  findings:
  - statement: >-
      Budding-yeast Pam18 is an inner-membrane J-domain protein that stimulates
      Ssc1 ATPase activity and is required for protein import into the
      mitochondrial matrix.
    supporting_text: >-
      Pam18 stimulates the ATPase activity of Ssc1; depletion of Pam18 in vivo
      disrupts import of proteins into the mitochondrial matrix.
- id: PMID:14638855
  title: A J-protein is an essential subunit of the presequence
    translocase-associated protein import motor of mitochondria.
  findings:
  - statement: >-
      Budding-yeast Pam18/Tim14 is a matrix-facing mitochondrial inner-membrane
      J-protein of PAM whose J domain stimulates mtHsp70 ATPase activity and
      whose inactivation impairs matrix protein import.
    supporting_text: >-
      In summary, we report that an 18-kD integral inner membrane protein with
      a J-domain constitutes an essential component of the mitochondrial import
      motor PAM.
- id: PMID:14981507
  title: Pam16 has an essential role in the mitochondrial protein import motor.
  findings:
  - statement: >-
      Budding-yeast Pam16 interacts with Pam18 and is needed for the
      association of Pam18 with the presequence translocase.
    supporting_text: >-
      Pam16 interacts with Pam18 and is needed for the association of Pam18
      with the presequence translocase
- id: PMID:16105940
  title: Role of Pam16's degenerate J domain in protein import across the
    mitochondrial inner membrane.
  findings:
  - statement: >-
      Stable Pam18/Pam16 heterodimerization through the Pam18 J domain and the
      Pam16 J-like domain is critical for mitochondrial protein import.
    supporting_text: >-
      Pam16's degenerate J domain serves the critical function of forming a
      stable interaction with Pam18 and to position Pam18 precisely at the
      channel for optimal activity.
- id: PMID:18003975
  title: Interaction of the J-protein heterodimer Pam18/Pam16 of the
    mitochondrial import motor with the translocon of the inner membrane.
  findings:
  - statement: >-
      Pam18/Pam16 is a J-protein heterodimeric module of the import motor, and
      Pam18 retention at the translocon depends on interactions with Pam16 and
      Tim17.
    supporting_text: >-
      three interactions contribute to association of the heterodimer with the
      translocon: the N terminus of Pam16 with the matrix side of the
      translocon, the inner membrane space domain of Pam18 (Pam18(IMS)) with
      Tim17, and the direct interaction of the J-domain of Pam18 with the
      J-like domain of Pam16
- id: PMID:18400944
  title: 'Mitochondrial protein import motor: differential role of Tim44 in the
    recruitment of Pam17 and J-complex to the presequence translocase.'
  findings:
  - statement: >-
      Tim44 promotes recruitment of the Pam18/Pam16 J-complex to the TIM23
      presequence translocase.
    supporting_text: >-
      Tim44 promotes the binding of the J-complex to the presequence
      translocase
- id: PMID:35385740
  title: Coupling to Pam16 differentially controls the dual role of Pam18 in
    protein import and respiratory chain formation.
  findings:
  - statement: >-
      Budding-yeast Pam18 can redistribute to respiratory-chain supercomplexes
      when Pam16/Pam18 heterodimerization is disrupted, suggesting a secondary
      respiratory-chain-assembly role not yet established for S. pombe pam18.
    supporting_text: >-
      Redistribution of Pam18 decreases protein import into mitochondria but
      stimulates mtHsp70-dependent assembly of respiratory chain complexes.
