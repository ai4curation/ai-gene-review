gene_symbol: asp1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: asp1 (SPCC1672.06c; UniProt O74429) is the fission yeast PPIP5K/Vip1, a bifunctional inositol
  pyrophosphate enzyme. Its N-terminal ATP-grasp kinase domain phosphorylates the 1-position of 5-IP7,
  its preferred substrate, to give 1,5-IP8, and more slowly IP6 to 1-IP7. Its C-terminal histidine-acid-phosphatase-like
  domain specifically removes the 1-diphosphate of 1-IP7 and 1,5-IP8. That domain carries a [2Fe-2S] cluster
  which inhibits its activity, and inorganic phosphate antagonises it, so Asp1 sets cellular IP8 levels.
  IP8 controls phosphate homeostasis by promoting precocious termination of the lncRNAs that repress pho1,
  pho84 and tgp1. Asp1-generated IPPs also tune microtubule dynamics, bipolar spindle formation, chromosome
  segregation and polarised growth.
