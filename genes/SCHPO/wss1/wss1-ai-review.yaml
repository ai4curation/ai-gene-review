- term:
    id: GO:0019985
    label: translesion synthesis
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001176
  review:
    summary: A curated transfer of the budding-yeast Wss1 IDA/IMP annotation (PMID:24998930). Wss1 does
      not synthesize DNA. Its contribution is to reduce the protein adduct so that the lesion becomes
      bypassable. This is peripheral to its core proteolytic repair role.
    action: KEEP_AS_NON_CORE
    reason: The donor annotation is experimental, from a paper whose full text is not cached, and the
      orthology is subfamily-level. Removing it would overrule the curator without the evidence they
      used. However, GO:0019985 describes synthesis across a lesion by a specialized polymerase. Wss1
      acts upstream by proteolysing the crosslinked protein, so this is kept as a non-core, pathway-context
      annotation rather than core function. The S. pombe genetic data link wss1 to aldehyde tolerance
      but do not separately test a TLS role.
    supported_by:
    - reference_id: PMID:24998930
      supporting_text: We propose that DPC proteolysis enables repair of these unique lesions via downstream
        canonical DNA repair pathways.
- term:
    id: GO:0106300
    label: protein-DNA covalent cross-linking repair
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001176
  review:
    summary: The core process. Budding-yeast Wss1 (same PANTHER subfamily, SF1) has direct evidence for
      it, and S. pombe wss1 deletion mutants are sensitive to formaldehyde and acetaldehyde, two DPC-inducing
      agents.
    action: ACCEPT
    reason: Wss1 does the work of this process, because it proteolyses the protein component of the crosslink.
      The transfer is grounded at the PANTHER subfamily level, and target-organism genetics agree.
    supported_by:
    - reference_id: PMID:24998930
      supporting_text: Wss1 contributes to survival of DPC-harboring cells by acting on DPCs proteolytically
    - reference_id: PMID:32034465
      supporting_text: loss of Wss1 or Wss2, proteases involved in the removal of DNA-protein crosslinks,
        sensitizes cells to formaldehyde and leads to replication defects
    - reference_id: PMID:27687866
      supporting_text: We also show the involvement of Wss1-related metalloproteases, Wss1 and Wss2, in
        acetaldehyde tolerance.
