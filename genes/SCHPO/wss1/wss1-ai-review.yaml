    label: metalloendopeptidase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - SGD:S000001176
  review:
    summary: Core catalytic activity, transferred from budding-yeast Wss1 (P38838), which has IDA/IMP
      evidence for DNA-dependent metalloendopeptidase activity. Both proteins are in PANTHER subfamily
      PTHR46622:SF1, and both keep the HExxH...H zinc site with the same spacing.
    action: ACCEPT
    reason: The donor's experimental activity (PMID:24998930) is the defining Wss1 function. The transfer
      is grounded at the subfamily level, because Q9P7B5 and P38838 are both PTHR46622:SF1, not merely
      best hits. The catalytic Glu and three zinc-ligand histidines are conserved (H96/E97/H100/H106 vs
      P38838 H115/E116/H119/H125). The fission-yeast paralog Wss2/Wss1b is in a different PANTHER family
      (PTHR47795), so data on that protein were not used for this transfer.
    supported_by:
    - reference_id: PMID:24998930
      supporting_text: in vitro assays indicate that substrates such as topoisomerase 1 are processed
        by the metalloprotease directly and in a DNA-dependent manner
