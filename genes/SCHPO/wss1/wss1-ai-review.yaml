description: Wss1 (SPAC521.02) is a nuclear DNA-dependent zinc metalloprotease of the WLM (Wss1-like
  metalloprotease) family. It has an N-terminal WLM protease domain with an HExxH...H zinc-binding active
  site and a C-terminal SUMO-interaction motif. It belongs to the same PANTHER subfamily as budding-yeast
  Wss1, which proteolyses proteins covalently trapped on DNA, such as topoisomerase 1 cleavage complexes
  and formaldehyde-induced DNA-protein crosslinks, in a DNA-dependent manner. Fission-yeast wss1 deletion
  mutants are sensitive to formaldehyde and acetaldehyde and show replication defects, which is consistent
  with a conserved role in DNA-protein crosslink repair. In that role, proteolysis reduces the crosslinked
  protein to a small adduct that downstream repair and lesion-bypass pathways can process. The fission-yeast
  enzyme has not been assayed biochemically. Its paralog Wss2 (Wss1b) sits in a separate PANTHER family.
