  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Wss1 is a nuclear Wss1-like metalloprotease with a conserved WLM catalytic domain and a C-terminal
  SUMO-interaction motif. Its role in proteolytic repair of covalent DNA-protein cross-links is inferred
  from the characterized budding-yeast Wss1 family and curated phylogenetic evidence. Removal of the cross-linked
  protein allows downstream DNA repair or lesion bypass. Direct biochemical characterization of the fission-yeast
  protein remains limited.
