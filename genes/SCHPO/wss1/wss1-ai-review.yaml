suggested_questions:
- question: Does Wss1 associate with any nuclear membrane or membrane-bound complex, or is its nuclear
    signal restricted to soluble chromatin-associated pools?
- question: Are fission-yeast Wss1 (PTHR46622) and Wss2/Wss1b (PTHR47795) redundant for DNA-protein
    crosslink repair, or do they handle distinct lesion classes (e.g. Top1 cleavage complexes vs aldehyde-induced
    crosslinks)?
suggested_experiments:
- description: Purify recombinant Wss1 and its catalytic mutant (E97Q) and test DNA-dependent cleavage
    of a model DNA-bound substrate (e.g. histone H1 or Top1 cleavage complex). Test wss1-E97Q for formaldehyde
    and camptothecin sensitivity, alone and combined with wss2 and tdp1 deletions.
