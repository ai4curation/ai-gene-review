  review:
    summary: The target carries the diagnostic WLM domain and conserved metal-binding/catalytic residues.
    action: ACCEPT
    reason: The target carries the diagnostic WLM domain and conserved metal-binding/catalytic residues.
      Curated orthology and PAINT ancestry support inheritance of the Wss1 protease/DNA-repair function,
      whose mechanistic foundation is DNA-dependent proteolysis of cross-linked proteins in the characterized
      yeast homolog. This is a justified family inference, not target-specific experimental proof.
    supported_by:
