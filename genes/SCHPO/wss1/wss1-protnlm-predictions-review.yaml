  review:
    assessment: UNC
    confidence_score: 1
    summary: The prediction is absent from GOA, which carries only nucleus (GO:0005634) for the
      cellular-component aspect, and the gene review accepts nucleus as the sole supported location. The
      reviewed UniProt record places Wss1 in the nucleus from experimental evidence, and the ProtNLM2
      source hydrates the membrane claim from KW-0539 (Nucleus), which is not a membrane observation.
      The closest relative evidence, from budding-yeast Wss1 in the same PANTHER subfamily, is a GFP
      focus near the nuclear membrane and vacuolar localization upon genotoxic stress; proximity to the
      nuclear envelope and relocation to the vacuole do not demonstrate membrane association. Because a
      soluble protease lacking transmembrane helices could still associate peripherally with membranes,
      the claim is not refuted. Membrane fractionation, nuclear-envelope colocalization or a defined
      membrane-associated partner complex for Wss1 is missing.
