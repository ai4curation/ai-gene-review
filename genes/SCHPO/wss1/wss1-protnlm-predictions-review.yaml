description: ProtNLM2 emits one GO prediction for fission-yeast Wss1, the broad cellular component
  membrane (GO:0016020). It is scored UNC. Wss1 is an experimentally nuclear WLM-family DNA-dependent
  metalloprotease acting in DNA-protein crosslink repair, and neither the fission-yeast data nor the
  budding-yeast ortholog's localization (a focus near the nuclear membrane; vacuolar under genotoxic
  stress) establishes membrane residence, while the absence of a transmembrane segment does not exclude
  peripheral association.
