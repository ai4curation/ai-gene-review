- term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:46160
  - EC:1.6.5.9
  review:
    summary: InterPro/EC mapping to the old term for non-electrogenic NADH:quinone oxidoreductase. GO:0120555
      is the ubiquinone-specific child, which the oxphos module and the S. cerevisiae NDI1/NDE1 reviews
      use.
    action: MODIFY
    reason: The record's curated catalytic activities give both the generic quinone reaction (EC
      1.6.5.9, the basis of this mapping) and the ubiquinone-specific reaction (RHEA:23152), assigned by
      NDH-2 family membership and similarity to characterised type II NADH dehydrogenases rather than by
      an assay of this S. pombe protein. Ubiquinone is the mitochondrial substrate, so the more specific
      GO:0120555, already annotated to this gene, is the better term.
    proposed_replacement_terms:
    - id: GO:0120555
      label: NADH dehydrogenase (ubiquinone) (non-electrogenic) activity
    supported_by:
    - reference_id: file:SCHPO/SPAC3A11.07/SPAC3A11.07-uniprot.txt
