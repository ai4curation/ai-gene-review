    summary: Inner-membrane location by similarity to S. cerevisiae NDE1/NDI1.
    action: ACCEPT
    reason: The inner-membrane location is the S. cerevisiae ortholog's, transferred by similarity;
      it has not been resolved for this protein. The protein is experimentally mitochondrial, carries a
      predicted mitochondrial transit peptide, and belongs to the type II NADH dehydrogenase (NDH-2)
      family, whose mitochondrial members are monotopic enzymes on the inner membrane. The record has
      no TRANSMEM feature, consistent with peripheral rather than integral attachment. The quotes
      support the mitochondrial location and the family membership; the sub-compartment rests on the
      family argument.
