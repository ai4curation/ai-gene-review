taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC3A11.07 (UniProt O14121) encodes one of the fission yeast type II NADH dehydrogenases
  (NDH-2; EC 1.6.5.9), single-subunit flavoproteins that oxidise NADH and reduce ubiquinone without pumping
  protons. S. pombe has no complex I, so these enzymes are the entry point for NADH electrons into the
  respiratory chain. By similarity this paralog is probably external, intermembrane-space-facing (Nde1-like).
  It is mitochondrial in a genome-wide screen.
