description: >-
  SPCC63.14 encodes a fission-yeast EIS1-family protein. Phylogenetic
  inference places it in the fungal branch that acts at Pil1/Lsp1-containing
  eisosomes and participates in eisosome assembly, while its direct molecular
  function remains uncharacterized.
