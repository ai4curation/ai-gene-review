description: >-
  SPCC63.14 encodes a fission-yeast EIS1-family protein with no characterized
  molecular function. Two large-scale localization screens report cytoplasmic
  signal, while PAINT and PomBase ISO place it in a fungal eisosome branch whose
  reach into Taphrinomycotina remains unresolved.
