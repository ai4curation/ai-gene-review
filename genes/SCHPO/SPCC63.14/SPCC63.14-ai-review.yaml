  review:
    summary: >-
      ACCEPT: the PAINT process and location are inferable, but the elemental
      molecular function is still unknown.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      SPCC63.14 is a PTHR28298:SF1 EIS1-family member below the PTN002001648
      PAINT node that carries eisosome and eisosome assembly. Like its
      S. cerevisiae and Candida relatives, it does not yet have a defensible
      molecular_function term more specific than root.
