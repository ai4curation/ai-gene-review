  label: Schizosaccharomyces pombe 972h-
description: plc1 (SPAC22F8.11; UniProt P40977) encodes the only phosphoinositide-specific phospholipase
  C of fission yeast, a delta-class enzyme with an EF-hand and a C2 domain. It hydrolyses PI(4,5)P2 to
  diacylglycerol and inositol 1,4,5-trisphosphate. In yeasts, IP3 is the substrate from which the inositol
  polyphosphate and pyrophosphate kinases build IP4-IP8. plc1 disruptants are temperature sensitive and
  cannot grow in synthetic medium, and S. cerevisiae PLC1 complements them.
