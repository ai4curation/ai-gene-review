  qualifier: involved_in
  review:
    summary: 'Central function: under nitrogen limitation, TORC1 inhibition activates Ppk18,
      which phosphorylates Igo1 on Ser64; phospho-Igo1 inhibits PP2A-B55, permitting full
      Cdk1-cyclin B activation and entry into mitosis at a smaller cell size. igo1 deletion cells
