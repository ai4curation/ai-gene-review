  - *q_falcon_g2m
- description: The same phospho-switch relays TORC1 inactivation to differentiation and
    quiescence programmes. By inhibiting PP2A-Pab1, phospho-Igo1 allows TORC2-dependent
    Gad8 Ser546 phosphorylation and SAGA-Taf12 phosphorylation, licensing ste11/mei2
    induction, nitrogen-starvation G1 arrest, conjugation and sporulation; the resulting
    TORC2-Gad8 output also sustains Elongator-dependent tRNA modification and translation of
    AAA-codon-rich transcripts (rap1, sgo2, ctu1) during entry into quiescence, with telomere
    attachment, subtelomeric silencing and autophagic flux as downstream consequences.
