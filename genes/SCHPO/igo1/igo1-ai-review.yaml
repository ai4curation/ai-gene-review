proposed_new_terms: []
suggested_questions:
- question: Is inhibition of PP2A-Pab1 by phospho-Igo1 direct and stoichiometric, as for
    ENSA/ARPP19 and budding-yeast Igo1 (which bind the B55/catalytic-subunit interface and
    are slowly dephosphorylated), and what is the affinity? No purified fission-yeast
    Igo1-PP2A-Pab1 binding or inhibition constant has been reported, and the PomBase IDA
    rests on in vivo phosphatase activity and epistasis.
  experts:
  - Sergio Moreno
  - Anna Castro
- question: What do the Cdk1-consensus (Ser31, Ser89, Ser102) and PKA-consensus (Ser76, Ser115)
    phosphosites of Igo1 do? The Igo1-4A mutant has nutrient-dependent size phenotypes, but
    whether these sites modulate Ser64-dependent PP2A-B55 inhibition, Igo1 turnover, or
    PP2A-B55 substrate-competition (as the PKA site does for ENSA/ARPP19) is unresolved.
  experts:
  - Sergio Moreno
  - Livia Perez-Hidalgo
- question: Should the biological-process counterpart of the inhibitor activity (GO:0010923
    negative regulation of phosphatase activity) be added? Human ENSA/ARPP19 carry it, but the
    fission-yeast PP2A/PP6 inhibitor Sds23 carries only the molecular-function term, so PomBase
    appears to capture this through the MF annotation alone and no NEW term is proposed here. The
    human ENSA review in this repository does propose GO:0010923 as NEW, because human ARPP19 carries
    it by IDA; the divergence is a per-MOD convention judgment, not an oversight.
  experts:
  - Valerie Wood
suggested_experiments:
- hypothesis: Ser64-phosphorylated Igo1 is a direct, high-affinity inhibitor of the fission-yeast
    PP2A-Pab1 holoenzyme.
  description: Phosphorylate recombinant Igo1 (wild-type and S64A) with purified Ppk18 or a
    hyperactive Greatwall, then measure binding to and inhibition of PP2A-Pab1 affinity-purified
    from S. pombe (and, as a specificity control, PP2A-Par1/Par2 B56 holoenzymes) on a
    phospho-Ser/Thr substrate; complement with co-immunoprecipitation of Igo1-MYC with Pab1 in
    rich versus nitrogen-free medium.
  experiment_type: biochemistry
- hypothesis: The differentiation, quiescence-translation and telomere phenotypes of igo1 mutants
    are all explained by excess PP2A-Pab1 activity acting on Gad8.
  description: Compare igo1 deletion with igo1 deletion carrying a phosphomimetic gad8-S546E
    allele or reduced pab1 expression for ste11/mei2 induction, mating efficiency, polysome
    profiles, mcm5s2U34 tRNA modification and Rap1 protein levels after nitrogen removal; a full
    rescue by gad8-S546E would place every downstream phenotype on the single TORC2 branch.
  experiment_type: genetics
- hypothesis: Igo1 redistributes between cytosol and nucleus when the switch is activated.
  description: Image endogenously tagged Igo1 (C-terminal mNeonGreen, verified functional by
    size-at-division on nitrogen shift-down) in rich medium, after nitrogen removal and after
    TORC1 inactivation (tor2-51), quantifying nuclear/cytosolic ratio alongside Ser64
    phosphorylation.
  experiment_type: cell biology
