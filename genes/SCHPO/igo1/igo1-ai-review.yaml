taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Igo1 (also mug134; SPAC10F6.16) is the endosulfine-family phosphoprotein of
  Schizosaccharomyces pombe, a small (139 residue), largely disordered, non-catalytic
  protein that is the fission-yeast counterpart of human ENSA/ARPP19 and budding-yeast
  Igo1/Igo2. Its defining activity is phosphorylation-gated, stoichiometric inhibition of
  the PP2A-B55 holoenzyme (PP2A-Pab1). In nitrogen-rich medium TORC1 keeps the Greatwall
  kinase Ppk18 (and its paralog Cek1) inactive, Igo1 is unphosphorylated and PP2A-Pab1 is
  active. When nitrogen becomes limiting and TORC1 activity falls, Ppk18 phosphorylates
  Igo1 on the conserved Ser64 of the endosulfine motif and phospho-Igo1 binds and inhibits
  PP2A-Pab1. Because PP2A-B55 removes Cdk1-dependent phosphorylation, its inhibition lets
  Cdk1-cyclin B become fully active at a smaller cell size, so cells advance the G2/M
  transition and divide shorter; cells lacking igo1 fail to accelerate mitosis and to
  reduce their size on nitrogen shift-down, whereas in rich medium the deletion has no
  size or morphology phenotype of its own. The same switch relays TORC1 inactivation to
  TORC2 and to transcription: PP2A-Pab1 dephosphorylates Gad8 Ser546 and the SAGA subunit
  Taf12, and Igo1-dependent inhibition of the phosphatase allows Gad8 activation and Taf12
  phosphorylation, which are needed for timely ste11/mei2 induction, mating,
  nitrogen-starvation G1 arrest and sporulation; igo1-deleted and igo1-S64A cells are
  poorly fertile and pab1 deletion suppresses this. During entry into quiescence the
  Igo1-PP2A-B55 axis, acting through TORC2-Gad8 and Elongator-dependent tRNA anticodon
  modifications, sustains translation of AAA-lysine-codon-rich transcripts (rap1, sgo2,
  ctu1 and others), which accounts for the telomere-detachment, subtelomeric-silencing,
  autophagy and paromomycin-sensitivity phenotypes of igo1 mutants. Igo1 carries additional
  Cdk1- and PKA-consensus phosphosites of less certain physiological role, and it shows
  synthetic cell-shape and cell-size defects with loss of the PP2A/PP6 inhibitor Sds23.
  The transcript is meiotically upregulated (hence the mug134 name). A genome-wide YFP
  screen places the protein in the cytosol and nucleus.
