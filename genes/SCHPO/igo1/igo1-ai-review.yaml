core_functions:
- description: Greatwall (Ppk18/Cek1)-phosphorylated inhibitor of the PP2A-B55 (PP2A-Pab1)
    phosphatase that couples nitrogen availability to the G2/M size threshold. When TORC1
    activity falls on nitrogen limitation, Ppk18 phosphorylates Igo1 on Ser64; phospho-Igo1
    binds and stoichiometrically inhibits PP2A-Pab1, so that Cdk1-dependent phosphorylation
    accumulates, Cdk1-cyclin B is fully activated and cells enter mitosis and divide at a
    smaller size. In rich medium the switch is off and PP2A-Pab1 keeps cells growing in G2.
  molecular_function:
    id: GO:0004865
    label: protein serine/threonine phosphatase inhibitor activity
  directly_involved_in:
