- term:
    id: GO:1902472
    label: regulation of mitotic cytokinesis, division site positioning
  evidence_type: IGI
  original_reference_id: PMID:31553675
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPBC646.13
  review:
    summary: Schutt and Moseley 2019 (full text cached) combined igo1 deletion with deletion of
      sds23 (the PP2A/PP6 inhibitor, SPBC646.13). The double mutant had significantly more
      bent/curved cells and divided at a larger size than either single mutant, but the
      authors state that the division-symmetry (cell half ratio) trend was not significantly
      different from sds23 deletion alone, and igo1 deletion alone has no division-site
      defect.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IGI is real and the curator's reading is defensible, but the specific claim,
      that Igo1 regulates division-site positioning, rests on a trend the authors themselves
      flag as not significant; the significant synthetic phenotypes in the same figure are
      cell shape and cell size at division, which the paper attributes to both inhibitors
      converging on PP2A to control mitotic entry (already captured by GO:1905287). The
      annotation is not wrong in spirit - excess PP2A activity in the double mutant may well
      perturb contractile-ring placement, and PP2A itself is implicated in cytokinesis - but
      it overstates the evidence for a division-plane role of Igo1. Graded identically for
      Ppk18, whose IGI row rests on the same panel.
