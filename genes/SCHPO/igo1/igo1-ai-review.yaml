- id: file:SCHPO/igo1/igo1-deep-research-falcon.md
  title: Deep research report for igo1 (S. pombe), Falcon provider
  findings:
  - statement: Summarises the Ser64-dependent PP2A-B55 inhibition mechanism, the igo1 deletion
      G2/M and differentiation phenotypes, the TORC2-Gad8 crosstalk and the 2024 quiescence-
      translation study.
    supporting_text: '**Ppk18 phosphorylation of Igo1 at Ser64** is the central activating event
      supported by the mechanistic literature. Loss of *igo1* causes abnormally high PP2A-B55
      activity under nitrogen-poor or nitrogen-free conditions, while genetically reducing
      PP2A-B55 can rescue multiple *igo1Δ* phenotypes.'
  - statement: Flags that the UniProt "mRNA stability protein" description is outdated relative to
      the fission-yeast evidence.
    supporting_text: The historical description “mRNA stability protein” is incomplete relative to
      current evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Falcon (Edison) literature synthesis drawing on Perez-Hidalgo & Moreno 2017,
      Martin et al. 2017, Laboucarie et al. 2017, del Dedo et al. 2024 and a 2021 thesis. Its
      claims about Laboucarie 2017, Martin 2017 and del Dedo 2024 were checked against the
      open-access full texts (Europe PMC); its statement that no direct Igo1 localisation exists
