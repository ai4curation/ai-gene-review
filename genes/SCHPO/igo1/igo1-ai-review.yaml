- id: PMID:26776736
  title: Nutritional Control of Cell Size by the Greatwall-Endosulfine-PP2A·B55 Pathway.
  findings:
  - statement: The Ppk18-Igo1 pathway couples the nutritional environment to the cell cycle by
      regulating PP2A-B55 activity.
    supporting_text: Here we show that the greatwall-endosulfine (Ppk18-Igo1 in fission yeast)
      pathway couples the nutritional environment to the cell-cycle machinery by regulating the
      activity of PP2A·B55.
  - statement: Under nitrogen limitation, Ppk18 phosphorylates Igo1, which inhibits PP2A-B55 and
      allows full Cdk1-cyclin B activation and mitotic entry at a smaller size.
    supporting_text: When nutrients are limiting, TORC1 activity falls off, and the activation of
      greatwall (Ppk18) leads to the phosphorylation of endosulfine (Igo1) and inhibition of
      PP2A·B55, which in turn allows full activation of Cdk1·CyclinB and entry into mitosis
      with a smaller cell size.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. The primary fission-yeast paper
      establishing Igo1 as the endosulfine of the Greatwall-endosulfine-PP2A-B55 pathway;
      source of the IDA inhibitor row and the IMP signal-transduction and G2/M rows.
- id: PMID:29079657
  title: TORC1 and TORC2 converge to regulate the SAGA co-activator in response to
    nutrient availability.
  findings:
  - statement: Taf12 phosphorylation on starvation is set by PP2A (TORC1-activated) versus
      TORC2-Gad8; the full text shows that igo1 deletion and igo1-S64A fail to induce Taf12
      phosphorylation and differentiation, and that pab1 deletion suppresses their sterility.
    supporting_text: Taf12 phosphorylation increases early upon starvation and is controlled by
      the opposing activities of the PP2A phosphatase, which is activated by TORC1, and the
      TORC2-activated Gad8AKT kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache (PMC5709762; full text consulted online
      for the igo1 and igo1-S64A data in Fig 5 and Appendix Fig S8). Source of the IGI
      conjugation row with pab1.
- id: PMID:31553675
  title: The phosphatase inhibitor Sds23 regulates cell division symmetry in fission
    yeast.
  findings:
  - statement: igo1 deletion alone has no cell-shape, size or division-symmetry defect; combined
      with sds23 deletion it increases bent cells and division size, while the division-symmetry
      trend is not significant.
    supporting_text: Lastly, the cell half ratio was even further reduced for double mutant cells,
      but we note that the double mutants were not significantly different from sds23∆ alone
      despite this trend (Figure 5E).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Sds23 is the focus; Igo1 appears only in the
      genetic-interaction figure (Fig 5). Source of the IGI division-site-positioning row, which
      is graded as over-annotated because the relevant readout was not significant.
