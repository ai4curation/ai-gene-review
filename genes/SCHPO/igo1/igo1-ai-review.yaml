- term:
    id: GO:0031139
    label: positive regulation of conjugation with cellular fusion
  evidence_type: IGI
  original_reference_id: PMID:29079657
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPAC227.07c
  review:
    summary: Laboucarie et al. 2017 (abstract-only in the cache; full text consulted at PMC)
      show that igo1 deletion and the igo1-S64A knock-in weakly induce ste11+/mei2+ on
      starvation and are sterile, that these mutants fail to phosphorylate the SAGA subunit
      Taf12, and that deleting pab1 (PP2A-B55; the IGI partner SPAC227.07c) suppresses the
      sterility and restores Taf12 phosphorylation.
    action: ACCEPT
    reason: Igo1 does the work here - it is the phosphoprotein that inhibits PP2A-Pab1 once
      starvation is sensed, which is what allows Taf12 phosphorylation and TORC2-Gad8 activation
      and hence commitment to mating - and the pab1 epistasis pins the effector. The cached
      abstract states only the PP2A/TORC1 and Gad8/TORC2 arms; the igo1 mutant data (Fig 5,
      Appendix Fig S8) are in the full text, which the PomBase curator read. Independent support
      comes from Martin et al. 2017 (igo1 deletion blocks Gad8 Ser546 phosphorylation and mei2
      induction on TORC1 inactivation) and from the deep-research synthesis. Promotion of sexual
      differentiation is a genuine, if pleiotropic, output of the same nutrient-signalling
      switch and is retained as a second core function, consistent with the Ppk18 review.
    supported_by:
    - &q_laboucarie_taf12
      reference_id: PMID:29079657
      supporting_text: Taf12 phosphorylation increases early upon starvation and is controlled by
        the opposing activities of the PP2A phosphatase, which is activated by TORC1, and the
        TORC2-activated Gad8AKT kinase.
    - &q_laboucarie_commit
      reference_id: PMID:29079657
      supporting_text: Mutational analyses suggest that Taf12 phosphorylation prevents cells from
        committing to differentiation until starvation reaches a critical level.
    - &q_falcon_gad8
      reference_id: file:SCHPO/igo1/igo1-deep-research-falcon.md
      supporting_text: PP2A/Pab1 associates with Gad8 and opposes phosphorylation of Gad8 at
        **Ser546**. Inhibiting PP2A-B55 through Igo1 permits accumulation of Gad8-S546
        phosphorylation and greater TORC2 output.
    - &q_falcon_g1_sporulation
      reference_id: file:SCHPO/igo1/igo1-deep-research-falcon.md
      supporting_text: Cells lacking Igo1 fail to arrest normally in G1, show impaired
        starvation-induced cell-size reduction, and have reduced sporulation.
