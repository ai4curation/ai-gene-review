  label: Schizosaccharomyces pombe 972h-
description: Isopropylmalate isomerase (3-isopropylmalate dehydratase, EC 4.2.1.33) of fission yeast,
  encoded by SPAC9E9.03. It is a single-chain aconitase-family [4Fe-4S] enzyme in which the bacterial
  LeuC and LeuD regions are fused. It converts (2S)-2-isopropylmalate to (2R,3S)-3-isopropylmalate via
  2-isopropylmaleate, the second step of the leucine branch, which takes place in the cytosol after alpha-isopropylmalate
  leaves the mitochondria. leu2 mutants are leucine auxotrophs, and leu2 expression is regulated by the
  general amino acid control transcription factor Fil1. Despite the shared name, S. pombe leu2 is the
  counterpart of S. cerevisiae LEU1, not LEU2.
