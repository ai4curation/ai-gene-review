suggested_questions:
- question: Should the CLRC-pool annotations (histone H3K14 ubiquitin ligase activity, pericentric/subtelomeric/mating-type
    heterochromatin formation) be qualified with contributes_to for Rbx1, given that catalysis has only been shown
    for the assembled complex and rbx1 is the one CLRC subunit never individually tested for silencing because it
    is essential?
- question: Does S. pombe Rbx1 act as the NEDD8/Ned8 E3 for cullin neddylation with Ubc12, as human RBX1 does with
    UBE2M, and if so should NEDD8 transferase activity and protein neddylation be annotated to rbx1 rather than
    left implicit in the CSN/Ned8 literature on Pcu1 and Pcu3?
- question: Is there a functional Rbx2/Rnf7-like paralogue in fission yeast, or does Rbx1 serve every cullin (Pcu1,
    Pcu3, Pcu4 and any Cul5-like scaffold), which would bear on whether family-wide IBA terms are complete for this
    genome?
suggested_experiments:
- hypothesis: The Rbx1 RING is directly required for CLRC-mediated H3K14 ubiquitylation and for H3K9 methylation
    at heterochromatin in vivo.
  description: Construct a conditional (auxin-degron or temperature-sensitive) rbx1 allele and RING zinc-ligand
    point mutants expressed from the endogenous locus; measure H3K14ub and H3K9me2/3 at pericentric repeats, the
    mat locus and subtelomeres by ChIP, silencing of ura4+ reporters and TBZ sensitivity, distinguishing acute CLRC
    loss from the general SCF/CRL lethality.
  experiment_type: conditional allele and structure-guided mutagenesis with ChIP and silencing assays
- hypothesis: Rbx1 with Ubc12 neddylates Pcu1, Pcu3 and Pcu4 in fission yeast, and this activity is separable from
    its ubiquitin-ligase function.
  description: Reconstitute Pcu1-Rbx1, Pcu3-Rbx1 and Pcu4-Rik1-Rbx1 with Ned8, its E1 and Ubc12 in vitro, then test
    Rbx1 mutants at the E2-binding surface for selective loss of neddylation versus Ubc4/Ubc3-dependent substrate
    ubiquitylation, and confirm in vivo by cullin Ned8-conjugate blots in rbx1 mutant strains.
  experiment_type: biochemical reconstitution with separation-of-function mutants
