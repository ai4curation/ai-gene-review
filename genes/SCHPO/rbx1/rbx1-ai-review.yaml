gene_symbol: rbx1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Rbx1 (Pip1, "Pop-interacting protein 1"; ORF SPAC23H4.18c) is the 107-residue RING-H2 finger protein
  of Schizosaccharomyces pombe orthologous to human RBX1/ROC1 and budding yeast Hrt1, and it is the shared catalytic
  subunit of the fission yeast cullin-RING ubiquitin ligases (CRLs). Its N-terminal strand and RING-H2 domain, which
  coordinates three structural zinc ions, dock onto the C-terminal domain of a cullin - Pcu1/Cul1, Pcu3/Cul3 or
  Pcu4/Cul4 - to form the invariant cullin-RING core, and the RING then recruits a ubiquitin-charged E2 (Ubc3/Cdc34-like
  or Ubc4-type enzymes) and activates it so that ubiquitin is transferred directly onto a lysine of a substrate
  held by the receptor module at the far end of the cullin. Rbx1 forms no thioester of its own and recognises no
  substrate by itself; specificity is supplied by the interchangeable adaptor/receptor arms. In the SCF ligases
  (Pcu1, Psh1/Skp1 and an F-box protein) Rbx1 is the RING through which SCF(Pop1/Pop2) polyubiquitylates the CDK-phosphorylated
  CDK inhibitor Rum1 and the replication licensing factor Cdc18 for proteasomal degradation at the G1/S transition,
  and through which SCF(Fbh1) ubiquitylates the recombinase Rad51. In the Cul4-based CLRC complex (Pcu4, Rik1, Raf1/Dos1,
  Raf2/Dos2, Rbx1 with the H3K9 methyltransferase Clr4), Rbx1 is the RING-box subunit of the ligase that monoubiquitylates
  histone H3 at K14; H3K14ub stimulates Clr4 and is a prerequisite for H3K9 methylation, so the CLRC pool of Rbx1
  acts on chromatin in the assembly of pericentric, subtelomeric and mating-type heterochromatin, to which CLRC
  is recruited in part by the RNAi effector complex RITS. Rbx1 also associates with neddylated and unneddylated
  Pcu3, whose ligase activity is tuned by the COP9 signalosome. The protein is present in both the nucleus and the
  cytoplasm, and rbx1 is essential for viability.
