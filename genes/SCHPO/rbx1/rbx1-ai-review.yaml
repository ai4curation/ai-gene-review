  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: located_in
  supporting_entities:
  - GO:0031509
  review:
    summary: 'Inter-ontology inference: because rbx1 carries an IC annotation to subtelomeric heterochromatin formation
      (GO:0031509), the reasoner places it at the telomeric region of the chromosome. Any Rbx1 at subtelomeres would
      be there as the RING subunit of CLRC, which silences telomeric as well as centromeric and mating-type heterochromatin.'
    action: KEEP_AS_NON_CORE
    reason: The location is biologically plausible - CLRC acts at all three constitutive heterochromatin domains
      - but this row is a two-step inference (an IC process term, itself derived from CLRC membership, converted
      into a location by a logical link) with no direct localisation of Rbx1 to telomeres. Rbx1 is a nucleocytoplasmic
      RING protein whose only chromatin-region localisation with any evidence is pericentric heterochromatin (GO:0005721).
      Keep as a non-core, derived location rather than a core site of action.
    supported_by:
    - reference_id: PMID:16024659
      supporting_text: silencing of RNA polymerase II transcription occurs at heterochromatic loci that flank centromeric
        regions ( Allshire et al. 1994 ), within telomeres ( Nimmo et al. 1994 ) and at a specific interval within
        the mating-type locus
