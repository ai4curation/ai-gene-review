core_functions:
- description: 'Catalytic RING subunit of cullin-RING ubiquitin ligases: Rbx1 binds the C-terminal domain of the
    cullins Pcu1, Pcu3 and Pcu4 and recruits and activates a ubiquitin-charged E2, so that ubiquitin is transferred
    directly onto a lysine of the substrate positioned by the cullin-bound receptor module; the outputs are mainly
    degradative polyubiquitin chains and, in CLRC, histone monoubiquitylation.'
  molecular_function:
    id: GO:0061630
