  review:
    summary: IntAct-derived IPI recording that Pip1/Rbx1 co-precipitates with Psh1/Skp1 (Q9Y709). In this paper
      anti-Pip1 antisera bring down all five SCF(Pop1/Pop2) subunits, and Pip1, Pcu1 and Psh1 co-elute as a ~500
      kDa core; the direct Rbx1 contact within that core is with the cullin Pcu1, and Skp1 is bridged through the
      cullin.
    action: MODIFY
    reason: Bare protein binding carries no functional information. The informative molecular function this paper
      supports for Pip1/Rbx1 is its role as the cullin-bound RING subunit of the SCF core - it is identified as
      the HRT1/RBX1/ROC1 homologue, sits in the invariant Pip1p/Pcu1p/Psh1p core, and its immunopurified complexes
      ubiquitylate Rum1. That is what cullin family protein binding (GO:0097602, already on rbx1 by IBA) denotes;
      the Skp1 contact recorded here is indirect (via Pcu1) and is better represented by the SCF complex-membership
      annotations. Replace rather than remove because the specific function is established.
    proposed_replacement_terms:
