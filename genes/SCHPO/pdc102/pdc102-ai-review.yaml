taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pdc102 (SPAC186.09) encodes a predicted pyruvate decarboxylase (EC 4.1.1.1), a thiamine diphosphate-
  and Mg2+-dependent enzyme of the PDC family that would convert pyruvate to acetaldehyde and CO2 in the
  cytosol. It is the closest paralog of the main growth-phase enzyme pdc101 and belongs with it to a fungal/plant
  PDC clade distinct from S. cerevisiae PDC1/PDC5/PDC6. The substrate-, cofactor- and Mg2+-binding residues
  of the family are conserved. Under the conditions tested, pdc102 mRNA is barely detectable, the protein
  has not been detected in quantitative proteomics, and the deletion mutant has no stationary-phase viability
  defect, so its physiological contribution to fermentation is unknown. The tagged protein localises to
  cytosol and nucleus in a genome-wide screen.
