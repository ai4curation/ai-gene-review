suggested_questions:
- question: Under which condition, if any, is pdc102 expressed, and does it encode an active pyruvate
    decarboxylase or a diverged 2-oxo-acid decarboxylase?
suggested_experiments:
- description: Express and purify pdc102 and assay decarboxylase activity on pyruvate and other 2-oxo
    acids; screen stress and meiotic conditions for pdc102 expression.
