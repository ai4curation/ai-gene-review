  label: Schizosaccharomyces pombe 972h-
description: Homoserine kinase (EC 2.7.1.39) of Schizosaccharomyces pombe (SPBC4C3.03), a GHMP-family kinase orthologous to
  S. cerevisiae Thr1. It phosphorylates L-homoserine with ATP to O-phospho-L-homoserine, committing homoserine to threonine
  (and hence isoleucine) synthesis rather than methionine synthesis; threonine synthase then converts O-phospho-L-homoserine
  to threonine. thr1 is cytoplasmic in the S. pombe ORFeome localisation screen. Its function is inferred from the budding-yeast
  ortholog.
