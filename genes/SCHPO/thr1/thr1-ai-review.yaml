- term:
    id: GO:0006555
    label: L-methionine metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P17423
  review:
    summary: The budding-yeast donor supports homoserine partitioning into the threonine branch, but this
      does not establish an enzyme step in the fungal methionine branch.
    action: MARK_AS_OVER_ANNOTATED
    reason: The transfer source is UniProtKB:P17423 (S. cerevisiae Thr1). Its ATP-dependent homoserine
      phosphorylation feeds threonine, whereas fungal methionine synthesis uses homoserine O-acetylation.
      Changes to a shared precursor pool can affect methionine availability; that indirect competition
      is insufficient for this process assertion. Unlike plant HSK, fungal Thr1 does not make the activated
      homoserine substrate used by methionine synthesis.
    supported_by:
    - reference_id: file:SCHPO/thr1/thr1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'FUNCTION: Commits homoserine to the threonine biosynthesis pathway by'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P17423
        source_label: THR1
        source_status: UNRESOLVED
        comment: The donor is a characterized homoserine kinase. The specific methionine-process inference
          is not established by its threonine-pathway reaction or shared-precursor competition.
