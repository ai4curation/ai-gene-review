- id: file:SCHPO/met3/met3-uniprot.txt
  title: UniProtKB O74314 entry for S. pombe met3/SPBC15D4.09c (MET7_SCHPO)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Family assignment, PLP lysine and subcellular location (tied to PMID:10759889) are sound. The
      FUNCTION and CATALYTIC ACTIVITY lines are by similarity and name the bacterial O-succinyl ester; fungi activate
      homoserine by O-acetylation, as noted for STR2.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:O74314
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Catalyzes the formation of L-cystathionine from O-succinyl-L-homoserine (OSHS) and L-cysteine
      confidence: SUSPECTED
      explanation: The statement is by similarity (ECO:0000250) to bacterial MetB. Fungal methionine synthesis uses
        O-acetyl-L-homoserine, and S. pombe extracts contain O-acetylhomoserine sulfhydrylase acting on that ester
        (PMID:6526818). The comment should name O-acetyl-L-homoserine or say the O-succinyl reaction is inferred
        from the bacterial enzyme.
      supported_by:
      - reference_id: PMID:6526818
        supporting_text: A crude extract of Schizosaccharomyces pombe cells catalyzed sulfhydrylation of both O-acetyl-L-serine
          and O-acetyl-L-homoserine with H2S
