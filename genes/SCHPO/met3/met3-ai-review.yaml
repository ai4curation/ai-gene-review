suggested_questions:
- question: Does S. pombe met3 use O-acetyl-L-homoserine (the product of fungal homoserine O-acetyltransferase)
    rather than the O-succinyl ester recorded in UniProt, and is met3 deletion rescued by methionine but not cysteine,
    as expected for forward trans-sulfuration?
- question: Given that S. pombe extracts showed no cystathionine synthesis (PMID:6526818), under which conditions
    (sulfur source, cysteine or glutathione supply, met17 loss) is met3 expressed and required, and does met3 deletion
    enhance the methionine requirement of a met17 mutant?
suggested_experiments:
- description: Express recombinant met3 and assay L-cystathionine formation with O-acetyl-L-homoserine versus O-succinyl-L-homoserine
    and L-cysteine; test met3 met17 double deletion for methionine auxotrophy on cysteine as sulfur source.
