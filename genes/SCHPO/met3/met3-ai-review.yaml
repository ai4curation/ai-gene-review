- id: PMID:6526818
  title: 'O-Acetylhomoserine sulfhydrylase of the fission yeast Schizosaccharomyces pombe: partial purification,
    characterization, and its probable role in homocysteine biosynthesis.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract checked. Crude extracts made homocysteine by direct sulfhydrylation but no detectable
