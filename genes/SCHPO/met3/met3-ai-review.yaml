  supporting_entities:
  - GO:0003962
  review:
    summary: PomBase IC from its own GO:0003962 annotation to 'L-cysteine biosynthetic process' (also
      the process used for met3 in GO-CAM 66a3e0bb00001342). Cystathionine gamma-synthase consumes L-cysteine
      to make cystathionine, en route to homocysteine and methionine; cysteine synthesis via cystathionine
      (reverse trans-sulfuration) uses cystathionine beta-synthase and gamma-lyase instead.
    action: MODIFY
    reason: 'Direction error: the reaction catalysed is in the cysteine-to-homocysteine direction. The
      sulfur-amino-acid context is right but the correct process is L-homocysteine biosynthesis.'
    proposed_replacement_terms:
    - id: GO:0071269
      label: L-homocysteine biosynthetic process
