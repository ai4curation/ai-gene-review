- term:
    id: GO:0019344
    label: L-cysteine biosynthetic process
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0003962
  review:
    summary: PomBase IC (GO_REF:0000111) from its own GO:0003962 annotation to L-cysteine biosynthetic process;
      the same process is used for met3 in GO-CAM 66a3e0bb00001342. Cystathionine gamma-synthase consumes L-cysteine
      to make cystathionine, en route to homocysteine and methionine. Cysteine synthesis via cystathionine (reverse
      trans-sulfuration) needs cystathionine beta-synthase and gamma-lyase, which S. pombe lacks.
    action: MODIFY
    reason: 'Direction error: the reaction runs from cysteine towards homocysteine, and S. pombe cannot make cysteine
      from cystathionine at all. The sulfur-amino-acid context is right, so this is a lateral MODIFY to L-homocysteine
      biosynthetic process (the cysteine-to-homocysteine branch), not a refinement.'
    proposed_replacement_terms:
    - id: GO:0071269
      label: L-homocysteine biosynthetic process
    supported_by:
    - reference_id: PMID:11754480
      supporting_text: Schizosaccharomyces pombe, in contrast to Saccharomyces cerevisiae and Aspergillus nidulans,
        lacks cystathionine beta-synthase and cystathionine gamma-lyase, two enzymes in the pathway from methionine
        to cysteine.
    - reference_id: file:SCHPO/met3/met3-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=O-succinyl-L-homoserine + L-cysteine = L,L-cystathionine +
    source_defects:
    - defect_type: WRONG_TERM
      resource: POMBASE
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0019344 L-cysteine biosynthetic process
      corrected_value: GO:0071269 L-homocysteine biosynthetic process
      cause: OTHER
      confidence: PROBABLE
      explanation: The IC row (and the part_of edge of met3 in GO-CAM 66a3e0bb00001342) places cystathionine gamma-synthase
        in cysteine biosynthesis. The enzyme uses L-cysteine as a substrate and produces cystathionine for homocysteine
        synthesis; S. pombe lacks the cystathionine beta-synthase and gamma-lyase that would be needed to make cysteine
        via cystathionine (PMID:11754480).
      supported_by:
      - reference_id: PMID:11754480
        supporting_text: Schizosaccharomyces pombe, in contrast to Saccharomyces cerevisiae and Aspergillus nidulans,
          lacks cystathionine beta-synthase and cystathionine gamma-lyase, two enzymes in the pathway from methionine
