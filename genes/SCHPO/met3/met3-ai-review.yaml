taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: met3 (SPBC15D4.09c) encodes the probable fission yeast cystathionine gamma-synthase, a pyridoxal 5'-phosphate-dependent
  enzyme of the trans-sulfuration (Cys/Met metabolism PLP-dependent) family, MET7-type fungal subfamily. By homology
  it condenses L-cysteine with an activated homoserine ester (O-acetyl-L-homoserine in fungi) to L-cystathionine,
  the first step of forward trans-sulfuration from cysteine to homocysteine; cystathionine is then cleaved by the
  beta-lyase cbl1 to homocysteine, which is methylated to methionine. S. pombe makes most of its homocysteine by
  direct sulfhydrylation of O-acetylhomoserine (met17) and lacks the reverse trans-sulfuration enzymes, so it cannot
  make cysteine from methionine. The protein is cytosolic, with some nuclear signal in localisation screens; its
  activity has not been assayed directly. Despite the shared symbol, S. pombe met3 is unrelated to S. cerevisiae
  MET3 (ATP sulfurylase) and corresponds to S. cerevisiae STR2.
