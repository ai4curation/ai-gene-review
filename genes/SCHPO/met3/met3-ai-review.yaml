  label: Schizosaccharomyces pombe 972h-
description: met3 (SPBC15D4.09c; UniProt O74314, MET7_SCHPO) encodes the fission yeast cystathionine gamma-synthase
  (EC 2.5.1.48), a pyridoxal 5'-phosphate-dependent enzyme of the trans-sulfuration (Cys/Met metabolism
  PLP-dependent) family, fungal MET7/met-7 subfamily. It condenses L-cysteine with an activated homoserine
  ester (O-acetyl-L-homoserine in fungi; UniProt records the O-succinyl reaction of the family) to L-cystathionine,
  the first step of forward trans-sulfuration from cysteine to homocysteine; cystathionine is then cleaved
  by cystathionine beta-lyase cbl1 to homocysteine, which is methylated to methionine. The enzyme is cytosolic,
  with some nuclear signal in localisation screens. Despite the shared symbol, S. pombe met3 is unrelated
  to S. cerevisiae MET3 (ATP sulfurylase, which in S. pombe is sua1) and corresponds functionally to S.
  cerevisiae STR2.
