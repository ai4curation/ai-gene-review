  label: Schizosaccharomyces pombe 972h-
description: 'his7 (SPBC29A3.02c; UniProt O59667) encodes a bifunctional HisIE enzyme: phosphoribosyl-ATP
  pyrophosphohydrolase (EC 3.6.1.31) and phosphoribosyl-AMP cyclohydrolase (EC 3.5.4.19), carrying out
  steps 2 and 3 of histidine biosynthesis. In S. cerevisiae these activities sit in the trifunctional
  HIS4 together with histidinol dehydrogenase; in S. pombe the dehydrogenase is a separate protein, his2.
  his7+ complements an E. coli hisI mutant and is widely used as a selectable marker. It is cytosolic
  in a genome-wide screen.'
