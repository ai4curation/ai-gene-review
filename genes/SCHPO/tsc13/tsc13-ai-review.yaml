description: SPBC646.07c (PomBase tsc13) encodes the fission yeast very-long-chain enoyl-CoA reductase
  (trans-2-enoyl-CoA reductase, EC 1.3.1.38/1.3.1.93), a multi-pass endoplasmic reticulum membrane protein
  of the steroid 5-alpha-reductase family, orthologous to S. cerevisiae TSC13 and human TECR. It catalyses
  the NADPH-dependent reduction of trans-2-enoyl-CoA to the saturated acyl-CoA two carbons longer, the
  fourth and final step of each ER fatty-acid elongation cycle that also involves elo1/elo2, ifa38 and
  phs1. The resulting very-long-chain fatty acids are incorporated into ceramides and sphingolipids. Its
  function is inferred from orthology; ER localisation has been observed directly in a genome-wide S.
  pombe study.
