  label: Schizosaccharomyces pombe 972h-
description: >-
  ndk1 (SPAC806.07) is the nucleoside diphosphate kinase of fission yeast, a 151-residue homotrimeric

  NDK-family enzyme about 60% identical to budding-yeast Ynk1 and mammalian NME proteins. Using a

  phosphohistidine (His117) ping-pong mechanism it transfers the gamma-phosphate of ATP to ribo- and

  deoxyribonucleoside diphosphates, producing UTP, CTP, GTP and dNTPs; in pyrimidine synthesis it

  converts UDP (from ura6) to UTP. Disruption of ndk1 strongly reduces cellular NDK activity but is not

  lethal and has no obvious growth or mating phenotype, whereas a catalytically dead C116 allele acts
  as

  a dominant negative inhibitor of sexual development and pheromone-induced gene expression. The

  protein is mainly cytosolic, with nuclear signal in a genome-wide screen and a possible minor

  mitochondrial pool inferred from Ynk1.
