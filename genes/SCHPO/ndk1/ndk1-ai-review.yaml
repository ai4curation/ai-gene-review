suggested_questions:
- question: >-
    Since ndk1 deletion is viable with greatly reduced NDK activity, which enzyme(s) supply residual UTP/CTP/dNTP
    formation in S. pombe (e.g. adenylate kinases or other NDP-phosphorylating activities)?
- question: >-
    Does a fraction of S. pombe ndk1 localize to the mitochondrial intermembrane space as Ynk1 does in
    budding yeast?
suggested_experiments:
- description: >-
    Measure NTP/dNTP pools and residual NDP kinase activity in ndk1 deletion cells, and test synthetic
    lethality with adenylate kinase genes.
