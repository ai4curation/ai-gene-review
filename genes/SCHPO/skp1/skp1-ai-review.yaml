- description: 'F-box-binding subunit of the cullin-free Fbh1-Skp1 helicase heterodimer: Skp1 is required to obtain
    soluble Fbh1, and the heterodimer has ssDNA-dependent ATPase and 3''-5'' helicase activity that disrupts Rad51
    nucleoprotein filaments (anti-recombinase) yet stimulates strand exchange once initiated; when joined to Pcu1-Rbx1
    the same heterodimer forms SCF(Fbh1), which ubiquitinates Rad51. Through this assembly Skp1 modulates Rad51-mediated
    recombination in mitotic cells and, with Fbh1, clears meiotic recombination intermediates before anaphase I.'
