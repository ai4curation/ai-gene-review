  qualifier: enables
  supporting_entities:
  - PomBase:SPBC1703.06
  review:
    summary: Skp1 binds the F-box protein Pof10, F-box/WD40 protein whose F-box is required for Skp1 binding and
      whose overexpression sequesters Skp1 from Pop1. Ikebe et al. isolated six Skp1 interactors in a two-hybrid
      screen with S. pombe Skp1 as bait, including the F-box proteins Pof1, Pof5 and Pof10 (abstract-only cache;
      the abstract states the screen and that the Pof10 F-box is required for Skp1 binding).
    action: MODIFY
    reason: 'The informative molecular function behind this interaction is F-box domain binding (GO:1990444): the
      C-terminal helices of Skp1 (UniProt region 102-161, and the I110T mutant that loses Pof1/Pof3/Pof10 binding)
      dock the ~40-residue F-box motif of Pof10. Assembly of Pof10 into a Pcu1-containing SCF has not been demonstrated,
      so the scaffold term (GO:0160072) is not proposed here; bare protein binding does not capture the F-box contact,
      and the interaction itself is not in doubt.'
