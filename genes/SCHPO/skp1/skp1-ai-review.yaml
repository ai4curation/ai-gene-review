- term:
    id: GO:0000018
    label: regulation of DNA recombination
  evidence_type: IDA
  original_reference_id: PMID:25165823
  qualifier: involved_in
  review:
    summary: 'Skp1 is the obligate partner of the F-box helicase Fbh1: Fbh1 could be purified only as an Fbh1-Skp1
      heterodimer, and this complex disrupts Rad51 nucleoprotein filaments (an anti-recombinase activity), stimulates
      strand exchange once initiated, and, as SCF(Fbh1) with Pcu1-Rbx1, ubiquitinates Rad51 in vitro.'
    action: ACCEPT
    reason: Full text cached and read. The direct evidence (IDA) is on the purified heterodimer, of which Skp1 is
      a stoichiometric subunit that is required even to obtain soluble Fbh1, so Skp1 contributes the structure the
      recombination-modulating steps depend on rather than merely being required upstream. The helicase/translocase
      and receptor functions belong to Fbh1, which is why the parent term 'regulation of DNA recombination' (covering
      both the anti-recombinase and the pro-recombination effects reported) is the right level for Skp1, and why
      the more specific negative-regulation term is not proposed. Accepted as a distinct, directly evidenced Skp1-containing
      assembly (the Fbh1-Skp1 helicase complex, GO:0017117) rather than folded into the generic SCF function.
    supported_by:
    - &id016
      reference_id: PMID:25165823
      supporting_text: Because we could not purify Fbh1 alone, we purified Fbh1 and Skp1 as a protein complex (Figure
        S3A).
    - &id036
      reference_id: PMID:25165823
      supporting_text: 'we purified Fbh1, which could only be recovered as a heterodimer in complex with Skp1, and
        demonstrated that this complex plays two opposing roles in the DNA strand-exchange reaction: a negative
        role via disruption of Rad51 filament, and a positive role, via stimulation of the strand-exchange reaction'
    - &id037
      reference_id: PMID:25165823
      supporting_text: These results suggest that Fbh1 negatively regulates Rad51-mediated homologous recombination
        via its two putative, unrelated activities, namely DNA unwinding/translocation and ubiquitin ligation.
    - &id024
      reference_id: PMID:25165823
      supporting_text: As shown in Figure 4A, Rad51 was ubiquitinated in an Ubc4- and SCFFbh1-dependent manner.
- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000877296
  - PomBase:SPBC409.05
  - SGD:S000002736
  review:
    summary: Family-level inference that Skp1 acts in the mitotic cell cycle, placed at PANTHER:PTN000877296 with
      fission-yeast skp1 (SPBC409.05) itself and S. cerevisiae SKP1 among the descendant evidences.
    action: ACCEPT
    reason: 'Broad but correct, and arguably the right level for the fission-yeast gene: as the shared SCF adaptor
      Skp1 is required for SCF(Pop1/Pop2)-dependent destruction of the CDK inhibitor Rum1 and the licensing factor
      Cdc18 at G1/S, for Cig2 instability in G2/M, and skp1 alleles show a checkpoint-dependent G2 delay, mitotic
      arrest with high Cdc2 activity, anaphase failure and septation defects. PomBase:SPBC409.05 appearing in its
      own WITH/FROM is expected (the gene carries its own experimental cell-cycle evidence) and not circular. No
      single phase-specific child term is annotated experimentally in GOA for skp1, so the IBA is accepted as is.'
    supported_by:
    - &id019
      reference_id: PMID:11163211
      supporting_text: The instability of Cig2 during G2 and M is independent of either the APC/C or Pop1/Pop2,
        but requires Skp1, a core component of SCF.
    - reference_id: PMID:12511573
      supporting_text: A fraction of the skp1-3f cells arrest in mitosis with high Cdc2 activity.
    - reference_id: PMID:15147268
      supporting_text: skp1ts cells exhibit a G2 cell cycle delay, which is attributable to activation of the DNA
        damage checkpoint
    - reference_id: file:SCHPO/skp1/skp1-deep-research-falcon.md
      supporting_text: Phenotypes involving replication, recombination, cytokinesis, stress, ploidy and centromeres
        reflect failure of different F-box-receptor modules.
- term:
    id: GO:0000712
    label: resolution of meiotic recombination intermediates
  evidence_type: IMP
  original_reference_id: PMID:22292001
  qualifier: involved_in
  review:
    summary: skp1-a7 zygotes accumulate persistent Rhp51/Rad22 foci, form bent meiosis I spindles that are suppressed
      by removing Rec12/Spo11-dependent DSBs, and phenocopy fbh1 deletion and F-box mutants; the authors conclude
      that SCF/Skp1 with Fbh1 acts in resolution of meiotic recombination intermediates.
    action: KEEP_AS_NON_CORE
    reason: 'Full text cached and read; the genetic evidence is solid and the term follows the authors'' own wording,
      so the annotation is kept. It is graded non-core because it is a meiosis-specific, Fbh1-receptor-dependent
      output of the shared adaptor, and because the mechanistic step is uncertain: GO:0000712 is defined as cleavage
      and rejoining of intermediates such as Holliday junctions, whereas Fbh1-Skp1 is a helicase/anti-recombinase
      that dismantles Rad51 filaments and ubiquitinates Rad51 (PMID:25165823); the persistence of Rhp51 foci is
      consistent with a failure to remove Rad51 rather than a resolvase defect. The term choice is flagged as a
      question for PomBase rather than overruled.'
    additional_reference_ids:
    - PMID:25165823
    supported_by:
    - &id039
      reference_id: PMID:22292001
      supporting_text: Rhp51/Rad51-Rad22/Rad52 foci persisted until meiosis I in skp1 cells, proving accumulation
        of recombination intermediates.
    - reference_id: PMID:22292001
      supporting_text: The spindle bending was suppressed by inhibiting double strand break (DSB) formation, indicating
        that the entanglement was generated by the meiotic recombination machinery.
    - &id038
      reference_id: PMID:22292001
      supporting_text: We also found that the F-box mutant fbh1-P15A L26A showed the bent spindle phenotype as fbh1Δ
        and skp1-a7 did, indicating that Skp1 and Fbh1 act together to resolve the meiotic recombination intermediates.
    - reference_id: PMID:22292001
      supporting_text: Thus, SCF/Skp1 together with Fbh1 is likely to function in the resolution of meiotic recombination
        intermediates, thereby ensuring proper chromosome segregation.
- term:
