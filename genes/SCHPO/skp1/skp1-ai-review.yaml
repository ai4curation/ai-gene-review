core_functions:
- description: 'Adaptor/scaffold of SCF (Skp1-Pcu1-F-box-Pip1) ubiquitin ligases: the BTB/POZ-like N-terminus binds
    the cullin Pcu1 while the C-terminal helices bind the F-box motif of an interchangeable receptor (Pop1, Pop2,
    Pof1, Pof3, Pof14, Fbh1 and others), holding the receptor-bound phospho-substrate in register with the Pip1/Rbx1-bound
    E2 so that Rum1, Cdc18, Cig2, Ams2, Hst4, Pol2, Rad51 and other targets are polyubiquitinated for proteasomal
    destruction; Rum1 and Cdc18 removal drives the G1/S transition and limits re-replication, and Ams2/Hst4/Pol2
    turnover safeguards genome integrity. The adaptor populates both nuclear SCF (the site of the characterised
    substrates) and cytoplasmic SCF(Pop2) assemblies.'
  molecular_function:
    id: GO:0160072
    label: ubiquitin ligase complex scaffold activity
  contributes_to_molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
