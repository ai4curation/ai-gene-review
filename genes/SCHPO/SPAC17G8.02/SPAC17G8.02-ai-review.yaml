  label: Schizosaccharomyces pombe 972h-
description: SPAC17G8.02 (PomBase urh2; UniProt Q10314) is one of two fission yeast IUNH-family nucleoside
  hydrolases (urh2 and the paralog SPBC1683.06c) orthologous to S. cerevisiae Urh1. By orthology they
  hydrolyse uridine (and cytidine) to the free base and ribose, feeding pyrimidine base salvage. They
  also cleave nicotinamide riboside and nicotinic acid riboside, routing these NAD+ precursors into the
  nicotinamide/nicotinic acid salvage pathways. Neither S. pombe paralog has been characterised biochemically,
  and how they divide the work is unknown. The protein is cytosolic in a genome-wide screen.
