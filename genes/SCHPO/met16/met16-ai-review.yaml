description: >-
  met16 (SPAC13G7.06) encodes the thioredoxin-dependent
  3'-phosphoadenylyl-sulfate (PAPS) reductase of fission yeast (EC 1.8.4.8),
  the ortholog of Saccharomyces cerevisiae MET16 and of bacterial CysH. It
  reduces PAPS, made by the ATP sulfurylase sua1 and the APS kinase met14, to
  free sulfite and adenosine 3',5'-bisphosphate, taking the two electrons from
  reduced thioredoxin, which it releases as the disulfide. The cytosolic
  thioredoxin trx1 is the main reductant in vivo. The sulfite is then reduced
  to sulfide by the sir1/met10 NADPH-sulfite reductase. met16 is a cytosolic
  member of the PAPS reductase (CysH) family, and its deletion causes
  methionine auxotrophy.
