  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Yml6 is the mitochondrial large-subunit ribosomal protein uL4m. It is a conserved structural
  component of the mitoribosome that supports mitochondrial translation. The uL4 family contributes to
  the nascent-polypeptide exit-tunnel constriction, a feature retained in the characterized budding-yeast
  mitoribosome.
