- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000078778
  - UniProtKB:P60723
  review:
    summary: Regulation of translation was propagated from E. coli L4 (rplD, P60723). E. coli L4 represses
      its own S10 ribosomal-protein operon. There is no evidence for such regulation by a mitochondrial
      uL4m.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental donor is E. coli uL4 (P60723), and the term sits on the family-root
      node PTN000078778. The bacterial regulatory role is the autogenous feedback control of the S10 operon,
      in which free L4 acts on the operon's own leader mRNA. That mechanism depends on bacterial operon
      organization. The mitochondrial uL4m genes of fungi are single nuclear genes, not operons, and none
      of the eukaryotic donors at the mitochondrial node PTN000078780 (S. cerevisiae Yml6, human MRPL4,
      trypanosome uL4m) supplies a regulatory annotation. No study of Yml6 or its mitochondrial orthologs
      reports a translational-regulatory activity separate from its structural role in the ribosome.
      Being a subunit of the translating ribosome is not regulation of translation. The term is not absurd
      for a family that contains a known regulator, but for this mitochondrial member it is an over-propagation
      from a lineage-specific bacterial function.
    supported_by:
    - reference_id: file:SCHPO/yml6/yml6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Component of the mitochondrial ribosome (mitoribosome), a'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
