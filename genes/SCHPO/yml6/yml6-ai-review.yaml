  review:
    summary: regulation of translation is reviewed in the context of yml6.
    action: UNDECIDED
    reason: Yml6 is a conserved structural uL4m subunit, but that role does not itself establish regulation
      of translation. The accessible mitochondrial structural studies do not establish a regulatory mechanism
      for this target, and the PAINT ancestral regulatory assertion has not been resolved to its experimental
      grounding. Retain uncertainty rather than equating ordinary ribosome participation with regulatory
      activity.
