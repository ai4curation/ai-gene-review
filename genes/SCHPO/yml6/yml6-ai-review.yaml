suggested_questions:
- question: Does the S. pombe mitoribosome contain Yml6 at the same exit-tunnel position as budding-yeast
    uL4m, and do fission-yeast-specific extensions of uL4m contact mitochondrion-specific rRNA expansion
    segments?
- question: Is there any evidence for a translational-regulatory (autogenous) function of eukaryotic
    mitochondrial uL4m that would justify inheriting GO:0006417 from E. coli L4 at the family-root PAINT
    node?
suggested_experiments:
- description: Deplete Yml6 or make a conditional allele (S. pombe is petite-negative) and assay mtLSU
    assembly by sucrose-gradient profiling, followed by mitochondrial translation by in vivo labeling
    of mitochondrially encoded proteins.
  experiment_type: genetic depletion with mitoribosome profiling
