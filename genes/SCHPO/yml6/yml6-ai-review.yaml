  label: "Schizosaccharomyces pombe 972h-"
description: Yml6 (SPBC2D10.08c) is the nuclear-encoded mitochondrial large-subunit ribosomal protein
  uL4m of fission yeast, a 261-residue precursor with a predicted N-terminal mitochondrial transit
  peptide (residues 1-35) followed by the conserved ribosomal uL4 domain. It is imported into mitochondria
  and assembled into the 54S large subunit of the mitoribosome, the machine that synthesizes the
  mitochondrially encoded, largely membrane-embedded subunits of the respiratory chain and ATP synthase.
  It sits in the same PANTHER subfamily (PTHR10746:SF6) as budding-yeast Yml6 and human MRPL4. In the
  budding-yeast mitoribosome structure, uL4m, together with uL22m, forms the constriction of the nascent-polypeptide
  exit tunnel, a conserved structural feature of uL4 proteins. No enzymatic activity is attributed to
  the protein. Its molecular role is structural, binding rRNA and organizing the large-subunit architecture.
  In S. pombe, Yml6 has been recovered at low levels with the mitochondrial translational activator
  Ppr10.
