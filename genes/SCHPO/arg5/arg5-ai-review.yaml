core_functions:
- description: 'Glutamine amidotransferase (small) subunit of the mitochondrial arginine-specific carbamoyl-phosphate
    synthetase (arg5-arg4, CPSase A): hydrolyses glutamine and channels ammonia to arg4 for carbamoyl-phosphate
    synthesis feeding matrix OTC. Same activity as S. cerevisiae CPA1 but located in mitochondria in S.
    pombe.'
