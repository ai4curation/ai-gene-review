  label: Schizosaccharomyces pombe 972h-
description: 'arg5 (SPBC56F2.09c, also cpa1) encodes the small (glutamine amidotransferase, CarA-type)
  subunit of the arginine-specific carbamoyl-phosphate synthetase (CPSase A) of S. pombe, the ortholog
  of S. cerevisiae CPA1. It hydrolyses L-glutamine and passes the released ammonia to the large subunit
  arg4, which makes carbamoyl phosphate for ornithine carbamoyltransferase (arg3). The protein has an
  N-terminal mitochondrial transit peptide and CPSase A is mitochondrial and repressed by arginine in
  S. pombe, separate from the cytosolic pyrimidine-pathway CPSase within ura1. arg5 mutants require arginine.
  Note the nomenclature trap: S. pombe arg5 is not the ortholog of S. cerevisiae ARG5,6 (which corresponds
  to S. pombe arg11).'
