core_functions:
- description: Noncatalytic structural subunit of the tRNA-splicing endonuclease complex; partners Sen34
    in the 3'-splice-site half of the enzyme and supports recognition and cleavage of intron-containing
    pre-tRNAs, with catalysis supplied by Sen2 and Sen34.
  supported_by:
  - reference_id: PMID:9200603
    supporting_text: Our results demonstrate that the eucaryal tRNA splicing endonuclease contains two
      functionally independent active sites for cleavage of the 5' and 3' splice sites, encoded by SEN2
      and SEN34, respectively.
  - reference_id: PMID:17166513
    supporting_text: two catalytic subunits, Sen34 and Sen2, and two structural subunits, Sen15 and Sen54
  directly_involved_in:
