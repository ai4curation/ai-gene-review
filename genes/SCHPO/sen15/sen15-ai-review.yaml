- term:
    id: GO:0006388
    label: tRNA splicing, via endonucleolytic cleavage and ligation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR036167
  review:
    summary: Correct but broader than the step Sen15 contributes to.
    action: MODIFY
    reason: The overall tRNA splicing process includes exon ligation and 2'-phosphate removal, performed
      by tRNA ligase and phosphotransferase, not by the endonuclease. Sen15 contributes only to the first
      step, which GO represents as GO:0000379 tRNA-type intron splice site recognition and cleavage, a
      part_of child of GO:0006388 that the gene already carries (IBA and IEA, accepted above). The annotation
      is derived from IPR036167, a fold-level superfamily, so the more specific, phylogenetically supported
      term is preferred.
    proposed_replacement_terms:
    - id: GO:0000379
      label: tRNA-type intron splice site recognition and cleavage
    supported_by:
    - reference_id: PMID:9200603
      supporting_text: In yeast, the tRNA splicing endonuclease is responsible for identification and
        cleavage of the splice sites in pre-tRNA.
