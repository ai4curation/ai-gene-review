id: Q7LKV3
gene_symbol: sen15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  sen15 (SPAC959.10) encodes a 143-residue fission yeast member of the fungal Sen15 family, the
  predicted noncatalytic subunit of the heterotetrameric tRNA-splicing endonuclease (Sen2-Sen15-Sen34-Sen54).
  This complex recognizes intron-containing precursor tRNAs and cleaves them at the 5' and 3' splice
  sites, releasing the intron and two tRNA half-molecules that are subsequently joined by tRNA ligase.
  The two splice-site active sites lie in Sen2 and Sen34; Sen15 has a degenerate, catalytically inactive
  version of the archaeal endonuclease C-terminal fold and, by analogy with the budding-yeast and human
  orthologous complexes, pairs with Sen34 to form the 3'-splice-site half of the enzyme. In the human
  complex the substrate tRNA body is recognized by the other three subunits, so Sen15 is best regarded
  as an architectural/assembly subunit rather than an RNA-binding or catalytic one. Function in fission
  yeast is inferred from family membership; the protein has not been studied directly. A genome-wide
  YFP-tagging screen detected the protein in both nucleus and cytosol.
