- id: PMID:17166513
  title: Three-dimensional structure determined for a subunit of human tRNA splicing endonuclease (Sen15)
    reveals a novel dimeric fold.
  findings:
  - statement: Sen15 is a structural (noncatalytic) subunit with a fold related to the C-terminal domain
      of archaeal endonuclease; S. pombe Sen15 shares only ~23% identity with human Sen15.
    supporting_text: it shows only 23% and 20% sequence identities, respectively, to two yeast orthologs,
      Sp Sen15 from Schizosaccharomyces pombe and Sc Sen15 from Saccharomyces cerevisiae.
  reference_review:
