taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Sen15 is a small, conserved noncatalytic subunit of the heterotetrameric tRNA-splicing endonuclease
  complex. Together with Sen2, Sen34 and Sen54 it supports recognition and excision of introns from precursor
  tRNAs before the cleaved exons are ligated. The catalytic splice-site cleavage centers reside in Sen2
  and Sen34. Nuclear and cytosolic pools have been reported in fission yeast localization screens.
