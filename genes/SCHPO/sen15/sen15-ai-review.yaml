  review:
    summary: Membership of the tRNA-splicing endonuclease complex, propagated by PAINT from budding-yeast
      Sen15 within the fungal Sen15 family.
    action: ACCEPT
    reason: Q7LKV3 is in PANTHER PTHR28518:SF1 together with the experimentally characterized S. cerevisiae
      SEN15 (Q04675, SGD:S000004663), the donor of this IBA; budding-yeast SEN15 was purified as one
      of the four subunits of the endonuclease (PMID:9200603). The fungal Sen15 signature (IPR042777)
      is present, the protein is full-length relative to its family members, and UniProt curators
      describe sen15 as a subunit of the sen2/sen15/sen34/sen54 heterotetramer by similarity. Human
      TSEN15 (a different PANTHER family, PTHR28582, but the same Pfam Sen15 family PF09631) is likewise
      an obligatory subunit of the reconstituted tetramer (PMID:34584079). Complex membership is the
      core, best-supported claim for this protein.
