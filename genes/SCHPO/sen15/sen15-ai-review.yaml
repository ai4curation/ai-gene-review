- term:
    id: GO:0000379
    label: tRNA-type intron splice site recognition and cleavage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002003396
  - SGD:S000004663
  review:
    summary: Participation in the endonucleolytic step of tRNA splicing, propagated from budding-yeast
      SEN15.
    action: ACCEPT
    reason: GO:0000379 covers recognition of the tRNA-type intron and cleavage at both splice sites,
      which is exactly what the endonuclease complex does. Sen15 does not carry either active site (those
      are in Sen2 and Sen34; PMID:9200603), but as an obligatory structural subunit it contributes the
      structure on which the 3'-splice-site half of the enzyme depends (it pairs with Sen34; Sen15-Sen34
      interaction in yeast two-hybrid, PMID:17166513; human TSEN15-34 heterodimer crystal structure,
      PMID:34584079), so involved_in passes the participation test. The PAINT donor is in the same PANTHER
      subfamily (PTHR28518:SF1). PAINT propagated this BP and the complex CC but not the donor's contributes_to
      tRNA-intron endonuclease activity (GO:0000213, SGD IDA); that omission is respected here and no
      MF is added.
    supported_by:
    - reference_id: PMID:9200603
      supporting_text: Our results demonstrate that the eucaryal tRNA splicing endonuclease contains two
        functionally independent active sites for cleavage of the 5' and 3' splice sites, encoded by SEN2
        and SEN34, respectively.
    - reference_id: PMID:17166513
      supporting_text: Yeast two-hybrid analysis further showed strong interactions between Sen2 and Sen54
        and between Sen34 and Sen15
