suggested_questions:
- question: Should Sen15 orthologs carry contributes_to GO:0000213 tRNA-intron endonuclease activity
    (as S. cerevisiae SEN15 does by IDA), given that PAINT propagated only the complex and process terms
    from that node?
- question: Does the S. pombe tRNA-splicing endonuclease act in the nucleus, as in vertebrates, or on
    the mitochondrial surface/cytoplasm, as in S. cerevisiae?
suggested_experiments:
- description: Endogenously tag sen15 and a catalytic subunit (sen2 or sen34) and image them at low copy
    number, together with pre-tRNA northern blots after sen15 depletion, to establish where fission yeast
    tRNA splicing occurs and confirm sen15 is required for intron cleavage.
  experiment_type: localization and RNA processing assay
