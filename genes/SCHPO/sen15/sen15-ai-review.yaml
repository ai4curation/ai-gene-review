- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011856
  review:
    summary: Generic nucleic acid binding inferred from the tRNA endonuclease-like domain superfamily;
      not supported for the Sen15 subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR011856 is a structural superfamily covering the archaeal endonuclease fold shared by the
      catalytic subunits (Sen2, Sen34) and the structural subunits (Sen15, Sen54). Sen15 retains only
      the C-terminal part of that fold and lacks the catalytic triad (PMID:17166513). In the cryo-EM structures
      of the human TSEN complex bound to pre-tRNA, substrate recognition is attributed to TSEN34, TSEN54
      and TSEN2, not TSEN15 (PMID:37028420). Human TSEN15 is in a separate PANTHER family (PTHR28582)
      from fungal Sen15 (PTHR28518), but both share the Pfam Sen15 family and the same position in the
      complex, and nothing indicates RNA contacts by the fungal protein. The superfamily-to-GO mapping
      therefore transfers a property of the RNA-contacting subunits to a subunit that is not known to
      bind RNA. Not marked REMOVE because absence of contacts in human structures is negative evidence
      from a related family, not a direct test on the fission yeast protein.
    supported_by:
    - reference_id: PMID:37028420
      supporting_text: The mature domain of pre-tRNA is recognized by conserved structural elements of
        TSEN34, TSEN54, and TSEN2.
    - reference_id: PMID:17166513
      supporting_text: Sen15 and Sen54, which are otherwise non-homologous, contain C-terminal sequences
        similar to the stretch of MJ_endo that spans the last two β -strands
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: Nuclear signal from the PomBase genome-wide YFP-ORFeome localization screen.
    action: KEEP_AS_NON_CORE
    reason: The high-throughput screen (PMID:16823372; abstract only in cache) is the only localization
      evidence for the fission yeast protein and is consistent with tRNA splicing being nuclear in many
      eukaryotes. In S. cerevisiae the endonuclease is on the mitochondrial outer surface, so localization
      is lineage-variable and should not be transferred between yeasts. Kept, but not core, because a
      single HDA observation does not establish where the complex acts.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: Next, we determined the localization of 4,431 proteins, corresponding to approximately
        90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
