    label: tRNA splicing, via endonucleolytic cleavage and ligation
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Sen15 belongs to the fungal Sen15 family (IPR042777) of noncatalytic endonuclease subunits;
      the cleavage active sites lie in Sen2 and Sen34, and Sen15 pairs with Sen34 as a structural partner.
      Participation in tRNA splicing is therefore correct. However, Sen15 contributes only to the endonucleolytic
      step, not to exon ligation or 2'-phosphate removal, and the gene already carries the more specific
      GO:0000379 tRNA-type intron splice site recognition and cleavage (IBA from the same PANTHER subfamily
      and InterPro2GO), a descendant of the predicted GO:0006388 (OLS4 hierarchical ancestors). The prediction
      is broadly correct but less specific than the supported existing annotation. No fission-yeast experimental
      study of sen15 was found in PubMed.
    supported_by:
    - reference_id: PMID:9200603
      supporting_text: Our results demonstrate that the eucaryal tRNA splicing endonuclease contains two
        functionally independent active sites for cleavage of the 5' and 3' splice sites, encoded by SEN2
        and SEN34, respectively.
    - reference_id: PMID:17166513
      supporting_text: Yeast two-hybrid analysis further showed strong interactions between Sen2 and Sen54
        and between Sen34 and Sen15
    - reference_id: file:SCHPO/sen15/sen15-uniprot.txt
      supporting_text: DR   InterPro; IPR042777; Sen15_fungi.
