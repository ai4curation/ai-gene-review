id: Q7LKV3
gene_symbol: sen15
locus_tag: SPAC959.10
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
status: COMPLETE
description: Sen15 is the predicted noncatalytic structural subunit of the tRNA-splicing endonuclease
  complex, pairing with the 3'-splice-site catalytic subunit Sen34. The predicted tRNA-splicing process
  is correct but broader than the endonucleolytic step that Sen15 contributes to, which the gene already
  carries as GO:0000379 tRNA-type intron splice site recognition and cleavage.
