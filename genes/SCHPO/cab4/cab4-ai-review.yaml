  label: Schizosaccharomyces pombe 972h-
description: cab4 (SPAC1F12.08) encodes a 316-residue protein that is the fission-yeast ortholog of budding-yeast
  Cab4 (YGR277C), the phosphopantetheine adenylyltransferase (PPAT) of coenzyme A biosynthesis. It consists
  only of a cytidylyltransferase-like (nucleotidyltransferase, Rossmann-fold) domain homologous to the
  PPAT region of animal bifunctional CoA synthase (COASY); it has no dephospho-CoA kinase domain, the
  final CoA-forming step being carried out by the separate CoaE-family protein cab5. Its predicted activity
  is the ATP-dependent adenylylation of 4'-phosphopantetheine to 3'-dephospho-CoA, step four of CoA synthesis
  from pantothenate. The S. pombe protein has not been characterised biochemically; its function is inferred
  from domain content and orthology to S. cerevisiae Cab4, which is essential and is complemented by E.
  coli coaD. A YFP fusion localises to the cytosol and nucleus.
