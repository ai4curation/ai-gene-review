suggested_questions:
- question: Does S. pombe cab4 assemble with hal3, cab5 and the CoaB enzyme into a CoA-synthesizing complex
    like the budding-yeast CoA-SPC, given that the S. pombe PPCDC is a single fused protein rather than
    a Cab3-based heterotrimer?
suggested_experiments:
- description: Assay recombinant cab4 for 4'-phosphopantetheine adenylyltransferase activity and test
    complementation of an S. cerevisiae cab4 null or E. coli coaD mutant; confirm absence of dephospho-CoA
    kinase activity.
