  review:
    summary: IBA from PANTHER PTN000075336, a dephospho-CoA kinase node (donors E. coli CoaE, M. tuberculosis
      CoaE, mouse/human COASY, Arabidopsis DPCK). cab4 sits in the same PANTHER subfamily (PTHR10695:SF46)
      only because COASY fuses PPAT and DPCK domains; cab4 itself has a single cytidylyltransferase-like
      PPAT domain (Pfam PF01467) and no CoaE/DPCK domain (no IPR001977 or PF01121), so the inherited kinase
      activity cannot be performed by this protein. DPCK in S. pombe is provided by cab5. Same conclusion
      as the S. cerevisiae CAB4 review.
    action: REMOVE
    reason: Domain architecture excludes dephospho-CoA kinase activity; the IBA is a family-level over-propagation
      from bifunctional COASY/CoaE donors to a PPAT-only member.
