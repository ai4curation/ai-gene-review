  - PANTHER:PTN000308947
  - UniProtKB:Q9Y3A0
  review:
    summary: Coq4 is the CoQ ring decarboxylase (PAINT/EC/similarity), matching the S. cerevisiae COQ4
      review.
    action: ACCEPT
    reason: IBA from PAINT node PTN000308947 (PTHR12922, GO_REF:0000033). The C1 decarboxylase activity
      rests on COQ4-family membership (HAMAP MF_03111) and on the demonstration that COQ4 catalyses the
      C1 oxidative decarboxylation in heterologous hosts (PMID:38295803); there is no S. pombe Coq4 enzyme
