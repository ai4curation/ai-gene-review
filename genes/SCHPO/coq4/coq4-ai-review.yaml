id: O94453
gene_symbol: coq4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq4 encodes the fission yeast Coq4 protein of the COQ4 family, a zinc-binding peripheral
  protein on the matrix side of the mitochondrial inner membrane. By homology with COQ4 orthologs it catalyses
  the C1 oxidative decarboxylation of 4-hydroxy-3-methoxy-5-decaprenylbenzoate, the step that removes
  the carboxyl group of the ring precursor during coenzyme Q10 synthesis, and it organises the multi-subunit
  CoQ biosynthetic complex. Deletion of coq4 abolishes CoQ10 synthesis, and human or Arabidopsis COQ4
  complements the deletion.
