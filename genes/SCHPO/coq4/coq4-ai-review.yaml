description: coq4 (SPAC1687.12c; UniProt O94453) encodes Coq4, the zinc-dependent decarboxylase of the
  CoQ ring (C1 decarboxylation) and a scaffold of the CoQ synthome. It is one of the ten S. pombe genes
  (dps1, dlp1, ppt1, coq3-coq9) needed for CoQ10 synthesis, whose deletion abolishes CoQ10. It is a mitochondrial
  inner-membrane component of the CoQ biosynthetic complex.
