    - reference_id: file:SCHPO/coq4/coq4-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=4-hydroxy-3-methoxy-5-(all-trans-decaprenyl)benzoate + H(+) = 2-methoxy-6-(all-trans-decaprenyl)phenol
        + CO2
    - reference_id: PMID:38295803
      supporting_text: Here, we provide evidence that these two reactions occur in a single oxidative
        decarboxylation step catalyzed by COQ4.
    - reference_id: PMID:24911838
      supporting_text: Similar results were obtained when HsCOQ4 and HsCOQ6 were expressed in the Δcoq4
        and Δcoq6 strains, respectively (Figures 6A and 6B).
