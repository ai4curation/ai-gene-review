taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Cao1 is a copper-dependent, quinone-containing primary amine oxidase that catalyzes oxidative
  deamination of primary amines. The enzyme supports utilization of ethylamine as a nitrogen source in
  heterologous yeast assays and obtains copper in part through the Atx1 metallochaperone. Cao1 is cytosolic
  in vegetative cells and concentrates within forespores during meiosis, where its activity depends on
  copper supplied through Mfc1.
