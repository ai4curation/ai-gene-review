suggested_questions:
- question: What is the physiological substrate of Cao1 in S. pombe - small aliphatic amines released
    during nitrogen limitation, polyamines such as putrescine, or environmental xenobiotic amines?
- question: Which factor provides the Atx1-independent route of copper loading onto Cao1?
- question: Does the hydrogen peroxide produced by forespore-localized Cao1 have any role in spore maturation,
    or is forespore Cao1 simply a copper sink?
suggested_experiments:
- description: Publish quantitative growth of cao1-deletion versus wild-type and complemented strains
    on ethylamine, putrescine and other primary amines as sole nitrogen source, together with steady-state
    kinetics (Km, kcat) of purified Cao1 for these substrates.
  experiment_type: genetic and biochemical
- description: Confirm TPQ formation at Tyr407 by redox-cycling (NBT) staining, phenylhydrazine adduct
    spectroscopy or mass spectrometry of purified Cao1, and test a Y407F mutant for loss of activity.
  experiment_type: biochemical
