taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Cao1 (SPAC2E1P3.04, formerly spao1) is the single catalytically active copper/topaquinone
  (TPQ) amine oxidase of fission yeast, a member of the copper amine oxidase family (PANTHER PTHR10638,
  subfamily SF86) that also contains the Hansenula polymorpha methylamine oxidase. It catalyzes the oxygen-dependent
  oxidative deamination of primary amines to the corresponding aldehyde, ammonia and hydrogen peroxide,
  with ethylamine, putrescine and 1,8-diaminooctane among its preferred substrates, and allows primary
  amines such as ethylamine to be used as nitrogen sources. Activity requires copper; conserved C-terminal
  histidines are needed for activity, and the active-site tyrosine (Tyr407) in the conserved Asn-Tyr-Asp/Glu-Tyr
  motif is expected to be converted autocatalytically to TPQ. In vegetative cells Cao1 is cytosolic and
  excluded from the nucleus, and it obtains copper via the Ctr4/Ctr5 uptake system and largely through
  the Atx1 metallochaperone, with which it interacts. During meiosis Cao1 accumulates within forespores,
  where its activity depends on copper imported by the forespore membrane transporter Mfc1. The paralog
  Cao2 is expressed but shows no detectable amine oxidase activity.
