- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Cao1 carries a protein-derived topaquinone cofactor rather than binding a free quinone.
    action: KEEP_AS_NON_CORE
    reason: The InterPro2GO mapping reflects the TPQ cofactor of copper amine oxidases. In Cao1 the TPQ
      precursor tyrosine (Tyr407) is conserved and, by family homology, is autocatalytically oxidized to
      TPQ; TPQ is a covalently modified residue of the polypeptide, so quinone binding is at best a loose
      cofactor-level description rather than binding of an exogenous quinone ligand. It is retained as
      non-core (as for other copper amine oxidases in this repository, e.g. rat Aoc1); no target-specific
      TPQ spectroscopy has been reported.
    supported_by:
    - reference_id: PMID:18723604
      supporting_text: The first tyrosine within this sequence (indicated in bold) is known to be posttranslationally
        converted to TPQ by an autocatalytic mechanism ( 9 ).
