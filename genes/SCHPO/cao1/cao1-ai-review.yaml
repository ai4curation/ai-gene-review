  review:
    summary: Copper is the essential catalytic metal of Cao1, inherited from the copper amine oxidase ancestor.
    action: ACCEPT
    reason: The PAINT IBD at PTN000067313 places copper binding at the root of the copper amine oxidase
      family, and Cao1 sits in subfamily SF86 within that clade with all copper-coordinating histidines
      conserved. Target-specific evidence agrees - copper chelation or loss of copper delivery abolishes
      Cao1 activity without lowering Cao1 protein levels, and mutation of C-terminal histidines predicted
      to coordinate copper abolishes activity. The IBA and IEA rows make the same claim and are accepted
      together.
