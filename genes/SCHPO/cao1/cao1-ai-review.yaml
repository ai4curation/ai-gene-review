    id: GO:0006878
    label: intracellular copper ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:18723604
  qualifier: involved_in
  review:
    summary: Cao1 is a copper-requiring client enzyme, not a component of the copper homeostasis machinery.
    action: MARK_AS_OVER_ANNOTATED
    reason: In the full text the only cao1-deletion phenotype reported is loss of amine oxidase activity;
      no change in cellular copper content, distribution, uptake or copper-responsive gene expression is
      reported for cao1 mutants. The copper-related findings of the paper concern the requirement of Ctr4/Ctr5,
      Cuf1 and Atx1 for loading copper onto Cao1, with Cao1 activity used as a readout of copper bioavailability.
      This makes Cao1 the recipient (client) of copper distribution, a necessity relationship; the work
      of maintaining copper homeostasis is done by the transporters and chaperones. The curator-made IMP
      is not removed, but it overstates Cao1's role and is not a core process.
    supported_by:
    - reference_id: PMID:18723604
      supporting_text: Taken together, our analysis of mutants defective in cao1 + , cao2 + , or both genes
        revealed that cao1 + plays a unique role in producing amine oxidase activity in S. pombe .
    - reference_id: PMID:18723604
      supporting_text: Collectively, these results describe the first example of the ability of Atx1
        to act as a copper carrier for a molecule other than Ccc2 and its critical role in delivering
        copper to Cao1.
