description: Threonine synthase (EC 4.2.3.1) of Schizosaccharomyces pombe (SPAC9E9.06c; UniProt name thrc),
  a PLP-dependent ThrC-type enzyme orthologous to S. cerevisiae Thr4. It converts O-phospho-L-homoserine
  and water to L-threonine and phosphate, the last step of threonine synthesis from aspartate. The protein
  is cytosolic in the S. pombe ORFeome localisation screen. Its function is inferred from the budding-yeast
  ortholog..
