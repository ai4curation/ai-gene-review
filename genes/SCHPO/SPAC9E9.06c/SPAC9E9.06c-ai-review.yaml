suggested_questions:
- question: Is SPAC9E9.06c the only threonine synthase in S. pombe, and does its deletion cause threonine
    auxotrophy?
- question: Is S. pombe threonine synthase allosterically regulated (e.g. by S-adenosylmethionine as in
    plants) or, like fungal Thr4, unregulated?
suggested_experiments:
- description: Delete SPAC9E9.06c and test threonine auxotrophy; assay recombinant protein for O-phospho-L-homoserine-dependent
    threonine formation.
  experiment_type: genetics and enzyme assay
