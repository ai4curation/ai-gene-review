taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg4 (SPAC20G4.07c; originally named sts1 for staurosporine supersensitivity) encodes the Delta24(28)-sterol
  reductase of Schizosaccharomyces pombe, a multi-pass ER-membrane protein of the ERG4/ERG24 sterol reductase family
  related to the lamin B receptor. It catalyses the last step of ergosterol biosynthesis, the NADPH-dependent reduction
  of the C-24(28) methylene double bond of ergosta-5,7,22,24(28)-tetraen-3beta-ol to give ergosterol (EC 1.3.1.71).
  erg4 deletion mutants are viable but lack ergosterol and accumulate ergosta-5,7,22,24(28)-tetraenol; they are
  cold-sensitive and supersensitive to divalent cations and to several unrelated drugs including staurosporine,
  caffeine and SDS, reflecting altered membrane sterol composition.
