suggested_questions:
- question: Which of the pleiotropic sts1/erg4 phenotypes (cold sensitivity, divalent-cation and staurosporine supersensitivity)
    are due to loss of ergosterol versus accumulation of the Delta24(28) precursor?
suggested_experiments:
- hypothesis: S. pombe Erg4 is an NADPH-dependent Delta24(28)-sterol reductase.
  description: Assay NADPH-dependent reduction of ergosta-5,7,22,24(28)-tetraenol by microsomes from wild-type and
    erg4-deleted cells, or by heterologously expressed Erg4.
  experiment_type: enzyme assay
