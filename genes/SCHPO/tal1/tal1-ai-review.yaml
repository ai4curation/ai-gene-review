    summary: Broad parent; transaldolase interconverts sugar phosphates in the non-oxidative pentose phosphate pathway.
    action: KEEP_AS_NON_CORE
    reason: 'True by similarity (UniProt ECO:0000250, P15019) and transaldolase family membership (HAMAP MF_00492, InterPro IPR001585 TAL/FSA): Tal1 converts sedoheptulose-7-P and glyceraldehyde-3-P to erythrose-4-P and fructose-6-P, a carbohydrate metabolic reaction. The informative process is the non-oxidative pentose-phosphate shunt (GO:0009052, asserted in this review), but that term is not an is_a descendant of carbohydrate metabolic process, so this row is kept as non-core context rather than marked TOO_GENERAL.'
