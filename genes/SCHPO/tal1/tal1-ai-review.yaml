  label: Schizosaccharomyces pombe 972h-
description: tal1 (SPCC1020.06c; UniProt O42700) encodes transaldolase (EC 2.2.1.2), which transfers a
  three-carbon dihydroxyacetone unit from sedoheptulose 7-phosphate to glyceraldehyde 3-phosphate, giving
  erythrose 4-phosphate and fructose 6-phosphate. By orthology it works in the non-oxidative pentose phosphate
  pathway, which interconverts pentose phosphates and glycolytic intermediates. Its activity is induced
  by delta-gluconolactone and repressed by glucose. It is cytosolic in a genome-wide screen.
