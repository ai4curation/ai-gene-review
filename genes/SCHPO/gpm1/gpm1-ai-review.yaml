  label: Schizosaccharomyces pombe 972h-
description: Gpm1 (SPAC26F1.06) is the phosphoglycerate mutase of the fission yeast Schizosaccharomyces
  pombe, a member of the 2,3-bisphosphoglycerate-dependent (dPGM) branch of the histidine phosphatase
  superfamily. At 211 residues (~23 kDa) and monomeric, it is unusually small compared with the dimeric
  or tetrameric dPGMs of other organisms. It reversibly interconverts 3-phosphoglycerate and 2-phosphoglycerate
  via a phosphohistidine intermediate; the active-site His163 is required for mutase and phosphatase activity.
  The S. pombe enzyme is functional when expressed in a S. cerevisiae gpm1 deletion strain, and the protein
  localises to the cytosol, with some nuclear signal in genome-wide localisation.
