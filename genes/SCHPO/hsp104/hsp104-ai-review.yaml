- id: PMID:19759825
  title: The Schizosaccharomyces pombe Hsp104 disaggregase is unable to propagate
    the [PSI] prion.
  findings:
    - statement: >-
        Sp_hsp104 is heat inducible, required for S. pombe thermotolerance, and
        encodes a conserved disaggregase.
      supporting_text: >-
        As its S. cerevisiae counterpart, Sp_hsp104(+) is heat-inducible and
        required for thermotolerance in S. pombe.
    - statement: >-
        Sp_Hsp104 reactivates heat-denatured luciferase when expressed in S.
        cerevisiae, directly showing disaggregase activity.
      supporting_text: >-
        To confirm that the thermotolerance supported by Sp_hsp104+ is due to
        disaggregase activity of the protein, we performed luciferase
        reactivation assays
    - statement: >-
        Sp_Hsp104 is less efficient than Sc_Hsp104 in basal heterologous
        luciferase-reactivation assays.
      supporting_text: >-
        Under basal expression conditions, Sp_Hsp104 homolog is significantly
        less efficient than Sc_Hsp104 to reactivate luciferase.
    - statement: >-
        Sp_Hsp104 cannot maintain the S. cerevisiae [PSI+] prion in the
        absence of Sc_Hsp104.
      supporting_text: >-
        This demonstrates that Sp_Hsp104 is unable to propagate [PSI+] and/or
        that interaction with species-specific cofactors are required for this
        activity.
- id: PMID:24035542
  title: Fission yeast does not age under favorable conditions, but does so after
    stress.
  findings:
    - statement: >-
        Hsp104-associated protein aggregates correlate with cell death after
        stress in fission yeast.
      supporting_text: >-
        Cell death correlated with the inheritance of Hsp104-associated protein
        aggregates.
- id: PMID:24936793
  title: Fusion of protein aggregates facilitates asymmetric damage segregation.
  findings:
    - statement: >-
        The study directly imaged Hsp104-associated aggregates in vivo in S.
        pombe to follow aggregate fusion and segregation.
      supporting_text: >-
        by combining in vivo imaging of Hsp104-associated aggregates, a form of
        damage, with mathematical modeling
- id: PMID:25543137
  title: Dicer and Hsp104 function in a negative feedback loop to confer robustness
    to environmental stress.
  findings:
    - statement: >-
        Hsp104 prevents cytoplasmic Dicer inclusions and buffers
        temperature-induced aggregation and epigenetic instability.
      supporting_text: >-
        In the absence of Hsp104, Dicer accumulates in cytoplasmic inclusions
        and heterochromatin becomes unstable at elevated temperatures
- id: PMID:26152728
  title: A Two-step Protein Quality Control Pathway for a Misfolded DJ-1 Variant in
    Fission Yeast.
  findings:
    - statement: >-
        Hsp104 is required for efficient proteasomal degradation of the
        misfolded fission-yeast DJ-1 variant Sdj1-L169P.
      supporting_text: >-
        Hsp104 and Hsp70-type chaperones are required for efficient degradation
        of Sdj1-L169P.
- id: PMID:32075773
  title: Chaperone-Facilitated Aggregation of Thermo-Sensitive Proteins Shields Them
    from Degradation during Heat Stress.
  findings:
    - statement: >-
        Mild-heat protein aggregate centers contain or require Hsp104 and other
        chaperones.
      supporting_text: >-
        They contain and/or require several chaperones, such as Hsp104, Hsp16,
        and the Hsp40/70 couple Mas5/Ssa2.
- id: PMID:33176152
  title: Acute Heat Stress Leads to Reversible Aggregation of Nuclear Proteins into
    Nucleolar Rings in Fission Yeast.
  findings:
    - statement: >-
        Fission-yeast nucleolar rings disaggregate during recovery in an
        Hsp104-dependent manner.
      supporting_text: >-
        NuRs disaggregate, and their components relocate to their functional
        environments in an Hsf1- and Hsp104-dependent manner
