id: O94641
gene_symbol: hsp104
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  hsp104 encodes the fission-yeast cytosolic Hsp100/ClpB-family
  ATP-dependent protein disaggregase. The protein is heat inducible, supports
  acquired thermotolerance, localizes in the nucleus and cytoplasm, associates
  with stress-induced protein aggregates, and cooperates with partner
  chaperones to extract, unfold, and refold misfolded clients during proteotoxic
  stress recovery. In heterologous budding-yeast assays, S. pombe Hsp104 has
  weaker basal luciferase-reactivation activity than S. cerevisiae Hsp104 and
  cannot maintain the [PSI+] prion.
