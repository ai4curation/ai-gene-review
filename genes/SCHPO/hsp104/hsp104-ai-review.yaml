      and unfold aggregated proteins so they can be returned to the folding
      pathway during recovery from heat and other proteotoxic stresses. In
      S. cerevisiae, Sp_Hsp104 is weaker than Sc_Hsp104 at basal expression and
      does not sustain [PSI+] propagation.
