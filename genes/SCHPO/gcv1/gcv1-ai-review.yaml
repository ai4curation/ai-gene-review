description: gcv1 (SPAC31G5.14; UniProt O14110) encodes the mitochondrial aminomethyltransferase, the
  T protein of the glycine cleavage system (EC 2.1.2.10). It accepts the aminomethyl group carried on
  the lipoyl arm of the H protein (gcv3), transfers the one-carbon unit to tetrahydrofolate to form 5,10-methylene-THF,
  and releases ammonia; the reduced lipoyl arm is then reoxidised by dihydrolipoyl dehydrogenase (dld1).
  With the P protein (gcv2), the T protein makes the glycine cleavage system a mitochondrial source of
  one-carbon units for folate metabolism. Its function is assigned by orthology to S. cerevisiae GCV1
  and the GcvT family; no S. pombe-specific biochemistry has been reported.
