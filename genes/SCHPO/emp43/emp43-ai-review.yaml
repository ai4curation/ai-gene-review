id: O42707
gene_symbol: emp43
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  emp43 encodes a fission-yeast ERGIC-53-family type I membrane cargo receptor
  with a luminal L-type lectin-like domain, one transmembrane helix and a short
  cytosolic tail. It cycles between the endoplasmic reticulum, an ERGIC-like
  compartment, the Golgi and COPII-coated ER-to-Golgi vesicles, and works with
  the soluble luminal MCFD2-like partner Ssp120 to mediate export of selected
  glycosylated proteins through the early secretory pathway.
