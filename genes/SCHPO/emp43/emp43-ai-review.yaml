      ER and Golgi localization evidence for Emp43.
    supporting_text: we determined the localization of 4,431 proteins
- id: PMID:41203586
  title: >-
    Identification of an ERGIC-Like Compartment in Fission Yeast: Emp43 Functions
    as a Lectin-Like Cargo Receptor for Glycosylated Proteins.
  findings:
  - statement: >-
      Yamamoto and colleagues identified Emp43 as the S. pombe ERGIC-53 ortholog
      and Ssp120 as its functional MCFD2-like partner in an ERGIC-like compartment.
    supporting_text: Emp43 forms a complex with Ssp120
