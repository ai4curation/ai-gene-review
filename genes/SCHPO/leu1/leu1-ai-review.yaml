  label: Schizosaccharomyces pombe 972h-
description: 3-isopropylmalate dehydrogenase (beta-IPM dehydrogenase, EC 1.1.1.85) of fission yeast, encoded
  by SPBC1A4.02c. It is a homodimeric enzyme of the isocitrate/isopropylmalate dehydrogenase family that
  needs Mg2+ or Mn2+. Using NAD+, it oxidatively decarboxylates (2R,3S)-3-isopropylmalate to 4-methyl-2-oxopentanoate
  (2-oxoisocaproate), the third step of the leucine branch. The aminotransferase eca39 then converts 2-oxoisocaproate
  to leucine. The enzyme is cytosolic. The cloned gene complements E. coli leuB and S. cerevisiae leu2
  mutants. The leu1-32 allele (a G46E helix-capping substitution) is the standard fission-yeast leucine
  auxotrophic marker. Despite the shared name, S. pombe leu1 is the counterpart of S. cerevisiae LEU2,
  not LEU1.
