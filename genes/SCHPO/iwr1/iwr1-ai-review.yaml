- id: PMID:21504834
  title: Iwr1 directs RNA polymerase II nuclear import.
  findings:
  - statement: >-
      In S. cerevisiae, RNA polymerase II nuclear import requires Iwr1, which binds
      Pol II in the active-center cleft between the two largest subunits, then uses
      an N-terminal bipartite NLS recognized by karyopherin-alpha to direct import;
      Iwr1 is subsequently displaced by initiation factors and recycled. The
      function is Pol II specific, transcription independent, and conserved from
      yeast to human.
    supporting_text: >-
      Here we show that Pol II nuclear import requires the protein Iwr1 and provide
      evidence for cyclic Iwr1 function. Iwr1 binds Pol II in the active center cleft
      between the two largest subunits, maybe facilitating or sensing complete Pol II
      assembly in the cytoplasm. Iwr1 then uses an N-terminal bipartite nuclear
      localization signal that is recognized by karyopherin alpha to direct Pol II
      nuclear import.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Czeko et al. 2011, Mol Cell 42:261-266). Abstract-only in
      cache. This is the defining functional study for the Iwr1 family; it
      establishes the Pol II-specific nuclear-import-adaptor role that is transferred
      to S. pombe iwr1 by orthology (the ISO annotation cites the S. cerevisiae
      ortholog SGD:S000002273). The paper concerns S. cerevisiae, not S. pombe.
- id: PMID:21695216
  title: Iwr1 protein is important for preinitiation complex formation by all three
    nuclear RNA polymerases in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Iwr1 was originally identified through its physical interaction with RNA
      polymerase II and is conserved throughout eukaryotes; in S. cerevisiae it is
      additionally important for preinitiation complex formation by all three
      nuclear RNA polymerases.
    supporting_text: >-
      Iwr1, a protein conserved throughout eukaryotes, was originally identified by
      its physical interaction with RNA polymerase (Pol) II.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Esberg et al. 2011, PLoS ONE 6:e20829); full text in cache.
      S. cerevisiae study. Corroborates the Pol II physical interaction and directly
      demonstrates Pol III transcription and preinitiation-complex phenotypes, including
      a weak or indirect Pol III association. These results establish additional
      budding-yeast roles but do not show that they are conserved in S. pombe.
- id: PMID:26455955
  title: Different pathways for the nuclear import of yeast RNA polymerase II.
  findings:
  - statement: >-
      Budding-yeast Iwr1 facilitates import of assembled Pol II, but it is non-essential
      and parallel routes can import partial assemblies or individual subunits.
    supporting_text: >-
      However, as IWR1 is not an essential gene, Iwr1-independent pathway(s) for the
      nuclear import of Pol II must exist.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified S. cerevisiae study. Qualifies the original import model by showing
      that Iwr1 is a facilitating adaptor rather than the sole or obligate Pol II importer.
- id: PMID:28258010
  title: Iwr1 facilitates RNA polymerase II dynamics during transcription elongation.
  findings:
  - statement: >-
      Budding-yeast Iwr1 has a direct nuclear role during Pol II elongation and enzyme
      disassembly from chromatin, in addition to its import function.
    supporting_text: >-
      Our results indicate that Iwr1 interacts with RNPII during elongation and is
      involved in the disassembly of the enzyme from chromatin.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified S. cerevisiae primary study. Establishes an additional direct role
      for the ortholog, preventing the import-adaptor mechanism from being presented as
      the family's only activity; conservation in S. pombe remains untested.
- id: PMID:20473289
  title: Analysis of a genome-wide set of gene deletions in the fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      Genome-wide deletion analysis established a viable haploid deletion collection;
      PomBase associates iwr1 deletion viability with this screen.
    supporting_text: >-
      We found that 26.1% of fission yeast genes (1,260/4,836) were essential and 73.9%
      (3,576/4,836) were non-essential for viability of haploid cells in the growth
      conditions we used.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMC-verified genome-wide S. pombe deletion study. The current PomBase API records
      SPAC23H4.08/iwr1 deletion viability as viable; the paper's main text does not name
      iwr1, so this is high-throughput provenance rather than targeted characterization.
- id: PMID:28410370
  title: A systematic screen for morphological abnormalities during fission yeast sexual reproduction identifies a mechanism of actin aster formation for cell fusion.
  findings:
  - statement: >-
      A systematic S. pombe deletion screen measured mating morphology; PomBase assigns
      decreased mating efficiency and multiseptate-cell phenotypes to iwr1 deletion.
    supporting_text: >-
      We report here on a systematic screen for morphological abnormalities of the
      mating process in fission yeast Schizosaccharomyces pombe.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMC-verified high-throughput S. pombe mating-morphology screen. The current PomBase
      API links iwr1delta to FYPO:0000708 and FYPO:0004295 with this PMID; these screen
      phenotypes do not establish iwr1 molecular function.
- id: PMID:34250083
  title: Barcode sequencing and a high-throughput assay for chronological lifespan uncover ageing-associated genes in fission yeast.
  findings:
  - statement: >-
      A barcoded deletion screen measured stationary-phase lifespan; PomBase assigns
      loss of stationary-phase viability to iwr1 deletion.
    supporting_text: >-
      We then applied a refined method of barcode sequencing (Bar-seq), addressing
      technical and statistical issues raised by persisting DNA in dead cells and
      sampling bottlenecks in aged cultures, to screen for mutants showing altered
      lifespan during stationary phase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMC-verified high-throughput S. pombe chronological-lifespan study. The current
      PomBase API links iwr1delta to FYPO:0000245 with this PMID; the phenotype is a
      screen result, not a mechanistic study of iwr1.
- id: PMID:37787768
  title: Broad functional profiling of fission yeast proteins using phenomics and machine learning.
  findings:
  - statement: >-
      Broad chemical-genetic profiling measured deletion-mutant growth across many
      conditions; PomBase assigns hydroxyurea and methyl-methanesulfonate resistance to
      iwr1 deletion from this study.
    supporting_text: >-
      We assayed colony-growth phenotypes to measure the fitness of deletion mutants
      for 3509 non-essential genes in 131 conditions with different nutrients, drugs,
      and stresses.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMC-verified high-throughput S. pombe phenomics study. The current PomBase API
      links iwr1delta to FYPO:0002578 and FYPO:0000725 with this PMID. These resistance
      calls contrast with budding-yeast iwr1 mutant genotoxin sensitivity and require
      targeted replication.
