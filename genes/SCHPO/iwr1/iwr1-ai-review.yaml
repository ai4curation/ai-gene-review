core_functions:
- description: >-
    RNA polymerase II nuclear import adaptor: binds the fully assembled Pol II
    complex in the cytoplasm (in the active-center cleft, via the conserved Iwr1
    fold) and directs its karyopherin-alpha-dependent import into the nucleus,
    cycling on and off the polymerase. This is a facilitating rather than obligate
    import route, and budding-yeast Iwr1 also has a direct elongation/chromatin-release
    role. Assigned to S. pombe iwr1 by orthology to the experimentally characterized
    budding-yeast ortholog and by the Iwr1 family signature; not directly demonstrated
    in S. pombe.
  molecular_function:
    id: GO:0000993
    label: RNA polymerase II complex binding
  directly_involved_in:
  - id: GO:0006606
    label: protein import into nucleus
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21504834
    supporting_text: >-
      Iwr1 binds Pol II in the active center cleft between the two largest subunits,
      maybe facilitating or sensing complete Pol II assembly in the cytoplasm.
    reference_section_type: ABSTRACT
  - reference_id: PMID:21504834
    supporting_text: >-
      Here we show that Pol II nuclear import requires the protein Iwr1 and provide
      evidence for cyclic Iwr1 function.
    reference_section_type: ABSTRACT
  knowledge_gaps:
  - gap_statement: >-
      No targeted molecular assay has tested S. pombe Iwr1 binding to Pol II, its NLS,
      or its requirement for Pol II nuclear import. PomBase does record viable-deletion
      and pleiotropic high-throughput phenotypes, but none establishes this mechanism.
    boundary: >-
      Firmly established for the family/ortholog: S. cerevisiae Iwr1 binds assembled
      Pol II in the active-center cleft and directs karyopherin-alpha-dependent
      nuclear import in a cyclic, Pol II-specific, transcription-independent manner
      (PMID:21504834); the family is conserved yeast-to-human and defined by Pfam
      PF08574 / InterPro IPR040150. For S. pombe iwr1 specifically, GOA/PomBase carry
      only IBA/ISO/IEA function inferences and a molecular_function ND. Direct pombe
      screens record decreased mating efficiency and multiseptate cells (PMID:28410370),
      stationary-phase viability loss (PMID:34250083), and hydroxyurea resistance
      (PMID:37787768), but these phenotypes are mechanistically non-specific.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Iwr1 is a conserved facilitator of RNA polymerase II import, the enzyme that
      transcribes all protein-coding genes; whether and how this pathway
      operates in fission yeast (an evolutionarily distant model with its own import
      machinery) is a fundamental, untested question for a single-copy conserved gene.
    resolution: >-
      Assay a tagged iwr1 for physical association with S. pombe Pol II (Rpb1/Rpb2)
      and for nucleocytoplasmic shuttling; phenotype an iwr1 deletion for Pol II
      nuclear-localization defects and growth; test genetic/physical interaction with
      karyopherin-alpha (cut15/imp1).
    provenance:
    - reference_id: UniProt:O13951
      supporting_text: >-
        FUNCTION: Directs RNA polymerase II nuclear import. {ECO:0000250}.
    - reference_id: PMID:28410370
      supporting_text: >-
        We report here on a systematic screen for morphological abnormalities of the
        mating process in fission yeast Schizosaccharomyces pombe.
    - reference_id: PMID:34250083
      supporting_text: >-
        We then applied a refined method of barcode sequencing (Bar-seq), addressing
        technical and statistical issues raised by persisting DNA in dead cells and
        sampling bottlenecks in aged cultures, to screen for mutants showing altered
        lifespan during stationary phase.
    - reference_id: PMID:37787768
      supporting_text: >-
        We assayed colony-growth phenotypes to measure the fitness of deletion mutants
        for 3509 non-essential genes in 131 conditions with different nutrients, drugs,
        and stresses.
suggested_questions:
- question: >-
    Does S. pombe iwr1 physically associate with fission-yeast RNA polymerase II,
    and is it required for the polymerase's nuclear localization as in S. cerevisiae?
- question: >-
    Which of the existing high-throughput deletion phenotypes reproduce in targeted
    assays, and do any track with defective Pol II nuclear import?
- question: >-
    Does S. pombe Iwr1 also act during Pol II elongation and disassembly from damaged
    chromatin, as demonstrated for the budding-yeast ortholog?
suggested_experiments:
- hypothesis: >-
    iwr1 binds assembled S. pombe Pol II and mediates its karyopherin-alpha-dependent
    nuclear import.
  description: >-
    Affinity-purify tagged iwr1 and test for co-purification of Rpb1/Rpb2; assess
    Rpb1 nuclear/cytoplasmic distribution by microscopy in wild-type vs iwr1-deletion
    cells; test genetic interaction with karyopherin-alpha (imp1/cut15).
- hypothesis: >-
    The opposite genotoxin phenotypes of fission- and budding-yeast iwr1 mutants reflect
    a species-specific difference in Pol II import, elongation, or damage-arrest release,
    rather than a conserved directional response.
  description: >-
    Reproduce S. pombe iwr1-deletion resistance to hydroxyurea and MMS alongside matched
    S. cerevisiae sensitivity assays; quantify Pol II nuclear localization, chromatin
    occupancy, damage-arrest release, and nascent transcription; and test whether an
    Rpb3-NLS fusion separates import defects from nuclear elongation or chromatin-release
    functions. Treat failure to reproduce the high-throughput resistance calls as evidence
    for a screen-specific effect.
