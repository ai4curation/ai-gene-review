  label: Schizosaccharomyces pombe 972h-
description: Aspartate kinase (aspartokinase, EC 2.7.2.4) of Schizosaccharomyces pombe (SPBC19F5.04). It phosphorylates L-aspartate
  with ATP to 4-phospho-L-aspartate, the first committed step of the aspartate-family pathway that gives L-homoserine and
  from it threonine, isoleucine and methionine. hom3 is a monofunctional aspartokinase orthologous to S. cerevisiae Hom3,
  the threonine-inhibited control point of the pathway. GFP-tagged hom3 is cytosolic. Its function is inferred from the budding-yeast
  ortholog; no S. pombe enzymology is available.
