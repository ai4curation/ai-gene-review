suggested_questions:
- question: Is the requirement for ade3 in amino-acid-starvation repression of TORC1 a direct signalling
    role of the protein (e.g. at the vacuole with BFC) or an indirect effect of disrupted purine/nucleotide
    pools in the deletion strain?
suggested_experiments:
- description: Test whether a catalytically inactive ade3 point mutant (e.g. in the glutamine amidotransferase
    active site), grown with adenine, still supports TORC1 repression on amino-acid starvation and vacuolar
    relocalisation.
