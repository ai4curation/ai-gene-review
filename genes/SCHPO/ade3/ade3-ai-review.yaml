- term:
    id: GO:1904262
    label: negative regulation of TORC1 signaling
  evidence_type: EXP
  original_reference_id: PMID:34805795
  qualifier: involved_in
  review:
    summary: 'EXP (Kuang et al. 2021): ade3 deletion cells are rapamycin resistant and fail to dephosphorylate
      the TORC1 readout Rps6 efficiently on amino-acid starvation; Ade3 co-purifies with the BFC (Folliculin)
      complex. The authors themselves describe the finding as surprising for an enzyme whose only known
      activity is purine synthesis, and it is not resolved whether Ade3 acts as a signalling component
      or whether the phenotype is an indirect consequence of altered purine metabolism. Defer to the curator;
      keep as a non-core, possibly moonlighting role.'
    action: KEEP_AS_NON_CORE
    reason: Experimentally supported but mechanistically unresolved and secondary to the enzymatic function.
    supported_by:
    - reference_id: PMID:34805795
      supporting_text: Our results revealed that similar to BFC, Ade3, and Ptr2 are required for efficient
        repression of TORC1 in response to amino acid starvation (Figures 5C and 5D).
    - reference_id: PMID:34805795
      supporting_text: It was surprising to discover that Ade3, a phosphoribosylformylglycinamidine synthase
        enzyme whose only known activity is in adenine biosynthesis, is also required for efficient repression
        of TORC1 when cells are starved for amino acids.
core_functions:
- description: Single-chain FGAM synthase catalysing step 4 of de novo IMP synthesis (FGAR + glutamine
    + ATP -> FGAM + glutamate + ADP + Pi).
