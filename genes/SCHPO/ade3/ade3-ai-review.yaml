  review:
    summary: 'EXP (Kuang et al. 2021, FLCN/BFC paper): Ade3-GFP is diffuse in amino-acid-replete medium
      and co-localises with the FM4-64-stained vacuole after 90 min of amino-acid starvation. A real,
      condition-dependent observation; it is not where the enzyme carries out purine synthesis, and the
      resolution of the imaging does not distinguish membrane from lumen-proximal association.'
    action: KEEP_AS_NON_CORE
    reason: Starvation-induced relocalisation; not the site of the core enzymatic activity.
    supported_by:
    - reference_id: PMID:34805795
      supporting_text: Similarly, we found that Ade3-GFP is diffuse in amino acid replete conditions and
        localizes to vacuoles when cells are starved of amino acids for 90 min (Figure 6A).
