  label: Schizosaccharomyces pombe 972h-
description: ade3 (SPAC6F12.10c; synonym min11) encodes the 1323-residue single-chain (PurL-type) phosphoribosylformylglycinamidine
  synthase (FGAM synthase, FGAR amidotransferase, EC 6.3.5.3) of fission yeast, the ortholog of S. cerevisiae
  ADE6 and human PFAS. It catalyses the fourth step of de novo purine synthesis, the ATP-dependent amidation
  of formylglycinamide ribonucleotide (FGAR) with nitrogen from glutamine to give formylglycinamidine
  ribonucleotide (FGAM), using a C-terminal class I glutamine amidotransferase domain and PurM-like synthetase
  domains. ade3 mutants lack FGAR amidotransferase activity and require adenine. The enzyme is cytoplasmic;
  upon amino-acid starvation an Ade3-GFP fusion relocalises to the vacuole, and ade3 deletion impairs
  repression of TORC1 signalling during amino-acid starvation, a phenotype shared with the Folliculin
  (BFC) complex with which Ade3 co-purifies.
