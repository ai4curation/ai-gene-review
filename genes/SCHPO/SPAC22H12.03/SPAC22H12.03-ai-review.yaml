- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P75736
  review:
    summary: Over-reaching trans-kingdom ISS transfer from bacterial E. coli YbfF (P75736) in vitro acyl-CoA hydrolysis; eukaryotic mitochondrial homologs diverge in substrate specificity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Transferred by sequence similarity from cytoplasmic Escherichia coli YbfF
      (UniProtKB:P75736), which hydrolyzed palmitoyl-CoA and malonyl-CoA in
      vitro (PMID:18215690) without an established in vivo fatty-acid pathway
      phenotype, whereas eukaryotic mitochondrial homologs do not hydrolyze
      long-chain acyl-CoAs (PMID:27544863) and instead act on lipoylated OGDHc
      or short-chain alcohol/ester substrates.
    supported_by:
    - reference_id: PMID:18215690
      supporting_text: >-
        ybfF protein from Escherichia coli (Ec_ybfF) belongs to the esterase
        family for the large substrates, palmitoyl coenzyme A and malonyl
        coenzyme A, which are important cellular intermediates for energy
        conversion and biomolecular synthesis.
    - reference_id: PMID:27544863
      supporting_text: >-
        In contrast to YbfF, which reportedly hydrolyze long-chain acyl-CoA,
        hABHD11 did not utilize oleoyl-CoA or arachidonoyl-CoA.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - SOURCE_EVIDENCE_WEAK
      residue_claims_not_applicable: Ser95-Asp119-His250 triad is conserved, but helical-cap substrate specificity diverges between bacterial YbfF and eukaryotic mitochondrial homologs.
      source_entities:
      - source_id: UniProtKB:P75736
        source_label: Escherichia coli K-12 YbfF
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Bacterial cytoplasmic esterase assayed in vitro on acyl-CoAs without a demonstrated eukaryotic fatty-acid metabolic conserved role.
