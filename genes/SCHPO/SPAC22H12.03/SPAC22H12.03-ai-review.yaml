- id: PMID:18614015
  title: A mitochondrial protein compendium elucidates complex I disease biology.
  findings:
  - statement: Mouse Abhd11 localizes to mitochondria across 14 mouse tissues in MitoCarta, supporting eukaryotic PAINT mitochondrial transfer.
    supporting_text: >-
      Toward this goal, we performed mass spectrometry, GFP tagging, and
      machine learning to create a mitochondrial compendium of 1098 genes and
      their protein expression across 14 mouse tissues.
- id: PMID:27544863
  title: Chemoproteomic, biochemical and pharmacological approaches in the discovery
    of inhibitors targeting human α/β-hydrolase domain containing 11 (ABHD11).
  findings:
  - statement: Human ABHD11 lacks mono- or diacylglycerol lipase activity and hydrolyzes p-nitrophenyl butyrate.
    supporting_text: >-
      Our fluorescent activity assays designed for natural lipase substrates
      revealed no activity of hABHD11 towards mono- or diacylglycerols.
  - statement: Unlike bacterial YbfF, eukaryotic human ABHD11 does not hydrolyze long-chain acyl-CoAs such as oleoyl-CoA or arachidonoyl-CoA.
    supporting_text: >-
      In contrast to YbfF, which reportedly hydrolyze long-chain acyl-CoA,
      hABHD11 did not utilize oleoyl-CoA or arachidonoyl-CoA.
  - statement: Human ABHD11 hydrolyzes short-chain carboxylic esters such as p-nitrophenyl butyrate.
    supporting_text: >-
      Instead, hABHD11 readily utilized para-nitrophenyl butyrate (pNPC4),
      indicating lipase/esterase-type activity that could be exploited in
      inhibitor discovery.
