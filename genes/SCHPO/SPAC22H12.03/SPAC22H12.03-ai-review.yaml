  label: Schizosaccharomyces pombe 972h-
description: >-
  SPAC22H12.03 is a 270-residue Schizosaccharomyces pombe mitochondrial
  alpha/beta-hydrolase and the sole fission-yeast member of the ABHD11/IMO32
  family (PTHR46118:SF4). Experimentally localized to mitochondria by
  proteome-scale yellow fluorescent protein tagging, SPAC22H12.03 conserves the
  canonical oxyanion-hole loop (27-HGLLG-31) and Ser95-Asp119-His250
  charge-relay catalytic triad supporting carboxylic-ester hydrolase activity,
  while its endogenous mitochondrial physiological substrate in fission yeast
  remains uncharacterized.
