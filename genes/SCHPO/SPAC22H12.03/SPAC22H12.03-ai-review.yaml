knowledge_gaps:
- gap_statement: >-
    Endogenous physiological substrate and metabolic pathway of Schizosaccharomyces
    pombe SPAC22H12.03—specifically whether it maintains mitochondrial
    2-oxoglutarate dehydrogenase complex (kgd2) lipoylation like mammalian
    ABHD11 or acts as a short-chain acyltransferase/esterase—are unknown.
  boundary: >-
    Assay SPAC22H12.03 deletion mutants for respiratory growth, kgd2 lipoylation
    adducts, and volatile acetate-ester synthesis in S. pombe.
