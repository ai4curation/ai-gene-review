suggested_questions:
- question: >-
    How is compact 270-residue SPAC22H12.03 imported into Schizosaccharomyces
    pombe mitochondria without a long canonical N-terminal presequence, and
    does it deacylate lipoylated Kgd2 on the fission-yeast 2-oxoglutarate
    dehydrogenase complex?
suggested_experiments:
- hypothesis: >-
    Deletion or Ser95Ala mutation of SPAC22H12.03 in Schizosaccharomyces pombe
    causes accumulation of glutaryl-lipoyl adducts on mitochondrial Kgd2 and
    impairs respiratory growth on non-fermentable carbon sources.
  description: >-
    Compare wild-type, spac22h12.03Delta, and spac22h12.03-S95A fission-yeast
    strains on glycerol/acetate vs glucose media, determine sub-mitochondrial
    submitoplast protease protection, and profile Kgd2 lipoylation and
    2-oxoglutarate levels by anti-lipoate immunoblotting and LC-MS.
  experiment_type: Fission-yeast deletion/point-mutant phenotyping, submitochondrial fractionation, and Kgd2 lipoylation assay
