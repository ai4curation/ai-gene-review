taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg7 (SPAC13G7.01c) encodes lanosterol synthase (2,3-oxidosqualene cyclase, EC 5.4.99.7) of Schizosaccharomyces
  pombe, an ~83 kDa member of the terpene cyclase/mutase family that cyclises (S)-2,3-epoxysqualene to lanosterol,
  forming the tetracyclic sterol nucleus of ergosterol. The S. pombe cDNA was cloned by complementing an S. cerevisiae
  lanosterol synthase mutant. By analogy with budding yeast Erg7 it is a peripheral membrane protein of the ER and
  lipid droplets; S. pombe-specific localisation data are limited to a high-throughput YFP survey.
