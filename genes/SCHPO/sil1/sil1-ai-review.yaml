core_functions:
- description: 'Predicted nucleotide-exchange factor for ER BiP: Sil1 orthology and primary biochemical evidence from characterized orthologs support binding to the Hsp70 nucleotide-binding domain and stimulation of ADP release. This helps reset the BiP cycle for protein folding and translocation. ER/BiP specificity belongs to the Sil1 branch rather than every Fes1/HspBP1-family member. Direct pombe BiP binding and nucleotide-exchange measurements were not identified in the sources reviewed.'
  molecular_function:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:20430899
    supporting_text: Two NEFs have been identified for Kar2p in the ER lumen of Saccharomyces cerevisiae, namely Lhs1p and Sil1p
  knowledge_gaps:
  - gap_statement: Direct biochemical confirmation of the inferred S. pombe Sil1-BiP interaction and nucleotide-exchange activity was not identified in the sources reviewed.
    boundary: Sil1 orthology and characterized ortholog biochemistry support the existing molecular assignment. The remaining question is experimental confirmation and partner specificity in fission yeast, rather than absence of a functional hypothesis.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Confirms whether the strongly-inferred core function actually operates in fission yeast, and whether pombe BiP regulation follows the conserved two-NEF logic.
    resolution: In-vitro reconstitution of recombinant pombe Sil1 with pombe BiP measuring Sil1-stimulated nucleotide exchange / ATPase activity, plus co-immunoprecipitation of Sil1 with BiP from fission-yeast extracts.
    provenance:
    - reference_id: PMID:20430899
      supporting_text: These studies identified a role for the IIB domain of Kar2p in Sil1p binding and Sil1p-stimulated nucleotide exchange
knowledge_gaps:
- gap_statement: Whether Sil1 nucleotide-exchange activity is individually required in S. pombe, or is functionally redundant with the fission-yeast Hsp110/Grp170-type NEF (the Lhs1/Grp170 class), is undetermined; the phenotypic consequence of losing sil1 versus losing both BiP NEFs has not been tested in pombe.
  boundary: In S. cerevisiae, single sil1 or lhs1 deletions are viable but the sil1 lhs1 double deletion is lethal, showing the two NEFs are partly redundant and that BiP nucleotide exchange is essential. In S. pombe, sil1 deletion is viable, but no analogous single/double NEF-deletion analysis has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Determines whether sil1 is a dispensable, redundant NEF in pombe or contributes a non-redundant function, and whether the conserved "BiP has two NEFs, together essential" logic holds in fission yeast.
  resolution: Construct and phenotype pombe sil1 single and sil1 (Lhs1/Grp170-ortholog) double deletions for synthetic lethality and ER-stress sensitivity.
  provenance:
  - reference_id: PMID:20430899
    supporting_text: Individual deletions of LHS1 (Δlhs1) and SIL1 (Δsil1) in yeast cells are viable (13, 14), but the double deletion (Δlhs1Δsil1) is lethal suggesting that nucleotide exchange is essential for Kar2p activity and cell viability
- gap_statement: The mechanisms linking inferred Sil1-BiP regulation to the observed pombe growth and mating phenotypes, and the relevant physiological clients, remain unresolved in the sources reviewed.
  boundary: sil1 deletion is viable with grossly normal morphology; genome-wide phenomics and a mating-morphology screen recorded assorted stress phenotypes and an "incomplete cell wall disassembly at cell fusion site" phenotype, but there is no dedicated study of sil1 in fission yeast.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Whether sil1 has a specialized secretory/ER-proteostasis role in pombe (e.g. in mating or cell-wall remodeling) beyond generic BiP support is unresolved.
  resolution: Directed phenotyping of sil1 deletion under ER stress (tunicamycin, DTT) and mating conditions, and identification of Sil1/BiP-dependent secretory cargo by proteomics.
  provenance:
  - reference_id: PMID:37787768
    supporting_text: Many proteins remain poorly characterized even in well-studied organisms
- gap_statement: 'The membrane topology and ER-retention mechanism of pombe Sil1 are unresolved: the protein is annotated as a single-pass membrane protein from one predicted TM helix, yet SIL1-family orthologs are ER-lumenal, and no canonical HDEL/KDEL retention motif is evident in the pombe sequence.'
  boundary: ER localization is inferred, while UniProt predicts a hydrophobic segment at 20..40. Neither that prediction nor the ortholog comparison establishes whether the segment is cleaved or retained, and no direct pombe topology measurement was identified in the sources reviewed.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Clarifies whether the N-terminal hydrophobic segment is a signal/anchor for an ER-lumenal NEF (as in orthologs) and how the protein is retained in the ER.
  resolution: Determine subcellular localization and topology (protease-protection, lumenal vs membrane fractionation, tagged-protein imaging) of pombe Sil1.
suggested_questions:
- question: >-
    Does S. pombe Sil1 bind fission-yeast BiP and stimulate its nucleotide exchange, as
    its orthologs do for Kar2p and mammalian BiP?
  experts:
  - ER chaperone / Hsp70 co-chaperone biochemists
  - Fission-yeast secretory-pathway biologists
- question: >-
    Is sil1 functionally redundant with the pombe Hsp110/Grp170-type BiP NEF, such that
    the double deletion is synthetically lethal as in budding yeast?
  experts:
  - Yeast ER-proteostasis geneticists
suggested_experiments:
- experiment_type: In-vitro biochemistry
  description: >-
    Reconstitute recombinant pombe Sil1 with pombe BiP and measure Sil1-stimulated
    nucleotide exchange and ATPase activity to test the inferred NEF function directly.
- experiment_type: Genetic interaction analysis
  description: >-
    Build sil1 single and sil1 plus Lhs1/Grp170-ortholog double deletions and test for
    synthetic lethality and ER-stress (tunicamycin, DTT) hypersensitivity to define
    redundancy among pombe BiP NEFs.
- experiment_type: Localization / topology
  description: >-
    Determine the subcellular localization and membrane topology of tagged pombe Sil1
    (ER lumen vs membrane; protease protection) to resolve the single-pass-membrane vs
    lumenal ambiguity.
