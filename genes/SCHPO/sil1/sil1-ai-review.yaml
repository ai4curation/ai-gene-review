- id: PMID:20430899
  title: Interactions between Kar2p and its nucleotide exchange factors Sil1p and Lhs1p are mechanistically distinct.
  findings:
  - statement: The ER Hsp70 Kar2p (BiP) is regulated by two nucleotide-exchange factors, Sil1p and Lhs1p; NEFs promote ADP release to drive the next round of ATP binding in the chaperone cycle.
    supporting_text: Two NEFs have been identified for Kar2p in the ER lumen of Saccharomyces cerevisiae, namely Lhs1p and Sil1p
  - statement: Sil1p binds the IIB subdomain of the Kar2p ATPase domain to stimulate nucleotide exchange, mechanistically distinct from Lhs1p.
    supporting_text: These studies identified a role for the IIB domain of Kar2p in Sil1p binding and Sil1p-stimulated nucleotide exchange
  - statement: Single deletions of SIL1 or LHS1 are viable but the double deletion is lethal, showing BiP nucleotide exchange is essential and the two NEFs are partly redundant.
    supporting_text: Individual deletions of LHS1 (Δlhs1) and SIL1 (Δsil1) in yeast cells are viable (13, 14), but the double deletion (Δlhs1Δsil1) is lethal suggesting that nucleotide exchange is essential for Kar2p activity and cell viability
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC-verified full text (Hale, Lovell, de Keyzer & Stirling, J Biol Chem 2010). Primary S. cerevisiae biochemistry establishing Sil1p as a BiP/Kar2p NEF acting on the ATPase domain; it is the orthology basis for the pombe sil1 IBA/ISO annotations and directly supports the Sil1/Lhs1 redundancy knowledge gap. Work is in budding yeast, not fission yeast; used here for conserved-function reasoning.
- id: PMID:37787768
  title: Broad functional profiling of fission yeast proteins using phenomics and machine learning.
  findings:
  - statement: PomBase links high-throughput sil1 deletion growth phenotypes to this study; they do not directly establish BiP nucleotide-exchange activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Publication identity and gene-specific annotation linkage checked against the live PomBase SPAC1071.03c record (2026-09-05): annotation 397383 records diamide resistance at 3 mM/32 C; annotation 353035 records brefeldin-A sensitivity at 80 µM/32 C. These are high-throughput growth phenotypes, not direct molecular-function assays.'
- id: PMID:28410370
  title: A systematic screen for morphological abnormalities during fission yeast sexual reproduction identifies a mechanism of actin aster formation for cell fusion.
  findings:
  - statement: PomBase links sil1 deletion to incomplete cell-wall disassembly at the cell-fusion site in this high-throughput mating screen.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Gene-specific linkage checked against live PomBase SPAC1071.03c (2026-09-05), annotation 313604 / FYPO:0004806. The microscopy phenotype informs the residual biological-mechanism gap; it does not establish a direct fusion-machinery function.
- id: PMID:10958688
  title: Sls1p stimulates Sec63p-mediated activation of Kar2p in a conformation-dependent manner in the yeast endoplasmic reticulum.
  findings:
  - statement: Budding-yeast Scsls1 genetic interactions with translocation-deficient kar2 and sec63-1 mutants support a role in ER protein translocation.
    supporting_text: Synthetic lethality was observed between DeltaScsls1 and translocation-deficient kar2 or sec63-1 mutants, providing in vivo evidence for a role of ScSls1p in protein translocation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Fetched PubMed record and checked the donor QuickGO annotation: Q08199 / GO:0006616 / IMP cites this PMID. The abstract explicitly includes S. cerevisiae experiments despite the Sls1 nomenclature and Yarrowia context. The wrapper cached an abstract; precise SRP-dependent assay details were not independently resolved.'
