  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  Sil1 is a predicted nucleotide-exchange factor for the endoplasmic-reticulum Hsp70 chaperone BiP in Schizosaccharomyces pombe. PomBase identifies orthologs in human SIL1 and Saccharomyces cerevisiae SIL1. The protein belongs to the Sil1 branch of the broader SIL1/Fes1/HspBP1 family of armadillo-fold Hsp70 regulators; ER/BiP specificity should not be generalized to the cytosolic Fes1/HspBP1 relatives. In characterized Sil1 orthologs, binding to the Hsp70 nucleotide-binding domain promotes ADP release and supports the BiP chaperone cycle in protein folding and ER translocation. These molecular and compartmental assignments are inferred for fission-yeast Sil1; no direct biochemical characterization was identified in the sources reviewed. Its predicted N-terminal hydrophobic segment could function as a cleaved targeting signal or a retained membrane anchor, so soluble-lumenal versus membrane-anchored topology remains unresolved. Deletion is viable, and genome-wide screens report stress-response and mating phenotypes without identifying the affected BiP clients or the underlying mechanism.
