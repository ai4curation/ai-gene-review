    summary: >-
      Rank 3 (score 14.62). Reductive iron assimilation is the Fre/Fio1-Fip1 ferroxidase-permease
      route by which fission yeast takes up free ferric iron; it is a separate pathway from heme acquisition
      and does not involve Shu1. The two are alternative iron sources regulated by the same Fep1 repressor,
      which is the likely connection - co-regulation retrieved as shared function. Rank 4 supplies
      the correct heme import across plasma membrane and rank 5 the annotated iron-starvation response,
      so the usable calls are again below the errors.
