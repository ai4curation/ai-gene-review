description: >-
  ProTrek sequence-to-text retrieval for Shu1, the GPI-anchored cell-surface heme receptor of S. pombe.
  Four of the five top calls are heme-transport terms and two are exact GOA matches, so the biology
  is recovered well. The one substantive error is directional and mechanistic: rank 1 assigns heme
  export from the vacuole, which is the job of Shu1's downstream partner Abc3, while Shu1 imports
  heme into the vacuole. The correct import term is present at rank 4. Assessment: 1 correct not novel
  (CNN), 1 paralog incorrect (PLI), 1 nonparalog incorrect (NPI).
