    summary: >-
      Top-ranked hit (score 15.75). This review describes a two-step pathway: Shu1 captures extracellular
      heme at the plasma membrane and delivers it to the vacuole by ligand-induced endocytosis, and
      the vacuolar ABC transporter Abc3 then exports heme or iron from the vacuole to the cytosol.
      Rank 1 assigns Abc3's step to Shu1, reversing the direction across the vacuolar membrane. Scored
      MORE_SPECIFIC by closure against the annotated heme transport, so an ontology-only score would
      count this as a refinement.
