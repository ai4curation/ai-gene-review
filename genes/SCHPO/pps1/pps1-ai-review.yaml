taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pps1 encodes the single CDP-diacylglycerol-dependent phosphatidylserine synthase (CDP-diacylglycerol--serine
  O-phosphatidyltransferase, EC 2.7.8.8) of Schizosaccharomyces pombe, the ortholog of S. cerevisiae Cho1. The multi-pass
  ER membrane enzyme transfers the phosphatidyl group of CDP-diacylglycerol to L-serine, making essentially all
  cellular phosphatidylserine (PS). PS is the main precursor of phosphatidylethanolamine via the psd1-3 decarboxylases,
  and is concentrated in the inner leaflet of the plasma membrane at cell tips, where its negative charge helps
  position Rho1 and Cdc42. Deletion mutants lack PS, grow poorly without ethanolamine, and show defects in morphology,
  cytokinesis, actin organization, cell wall integrity, stationary-phase survival and salt tolerance. In S. pombe
  the symbol cho1 belongs to the phospholipid methyltransferase (OPI3 ortholog), not to PS synthase.
