suggested_questions:
- question: Is the plasma-membrane signal of GFP-Pps1 true plasma membrane or cortical ER, and are there ER-plasma
    membrane contact sites where PS is made for transfer to the plasma membrane?
suggested_experiments:
- description: Co-image functional GFP-Pps1 with cortical ER markers in wild-type and ER-plasma membrane tether
    mutants to separate cortical ER from plasma membrane localization.
