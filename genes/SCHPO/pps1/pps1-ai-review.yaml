  evidence_type: EXP
  original_reference_id: PMID:1324908
  qualifier: involved_in
  review:
    summary: The 1992 extract study measured CDP-DG synthase and PS synthase activities separately. PS synthase
      consumes CDP-DAG to make PS; it does not synthesise CDP-DAG, so an involved_in CDP-diacylglycerol biosynthetic
      process annotation to pps1 contradicts the reaction it catalyses (probably the CDP-DG synthase result attached
      to the wrong gene or term).
    action: MODIFY
    reason: The evidence in this paper for pps1 is PS synthase activity, which supports phosphatidylserine biosynthetic
      process. pps1 uses CDP-DAG as substrate and does no step of its synthesis (the CDP-DG synthase is bbl1).
    supported_by:
    - reference_id: PMID:1324908
      supporting_text: phosphatidylinositol (PI) synthase, and phosphatidylserine (PS) synthase in cell extracts
        of the fission yeast Schizosaccharomyces pombe
