suggested_questions:
- question: Does S. pombe aro1 deletion cause a complete aromatic amino acid requirement, confirming that no monofunctional
    shikimate-pathway enzymes substitute for AROM domains?
- question: Do the S. pombe AROM domains channel intermediates between active sites as proposed for fungal AROM?
suggested_experiments:
- description: Express aro1 domain truncations and assay each of the five activities; test aro1-deleted S. pombe for Phe/Tyr/Trp
    auxotrophy.
  experiment_type: enzyme assay and genetics
