  label: Schizosaccharomyces pombe 972h-
description: 'Pentafunctional AROM polypeptide of Schizosaccharomyces pombe (SPAC1834.02), orthologous to S. cerevisiae Aro1.
  A single chain of five domains catalyses steps 2-6 of the shikimate pathway: 3-dehydroquinate synthase, EPSP synthase (3-phosphoshikimate
  1-carboxyvinyltransferase), shikimate kinase, type I 3-dehydroquinate dehydratase and NADP-dependent shikimate dehydrogenase.
  Together these convert DAHP to 5-enolpyruvylshikimate 3-phosphate (EPSP), the precursor of chorismate and the aromatic amino
  acids. The DHQ synthase domain binds Zn2+. aro1 is cytosolic in the S. pombe ORFeome screen; its activities are assigned
  by homology to budding-yeast and bacterial enzymes.'
