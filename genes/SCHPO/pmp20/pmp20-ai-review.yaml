  findings:
  - statement: Human mitochondrial PRDX5 has an N-terminal transit peptide spanning residues 1 through 52.
    supporting_text: FT   TRANSIT         1..52
- id: file:SCHPO/pmp20/pmp20-bioinformatics/RESULTS.md
  title: Reproducible bioinformatics assessment of pmp20 thioredoxin-dependent peroxidase activity
  findings:
  - statement: pmp20 lacks sequence-level resolving cysteine support
    supporting_text: '- `pmp20`: 156 aa, **1 cysteine** total (`C43`), act-site annotated at 43, **no candidate resolving cysteine**.'
  - statement: Active-control resolving cysteine sites do not map to cysteine in pmp20
    supporting_text: 'Active-control resolving positions do **not** map to cysteine in `pmp20`:'
  - statement: AlphaFold model includes only one cysteine for pmp20
    supporting_text: '`pmp20`: model has only one cysteine SG atom (C43), so no Cys-Cys pair geometry is possible in the monomer.'
  - statement: Most Prx5-like homologs retain resolving-cysteine architecture, unlike pmp20
    supporting_text: "- Panel size: 27 reviewed eukaryotic Prx5-like proteins (`prx5_panel.tsv`).\n- Catalytic-state counts (`prx5_phylogeny_report.json`):\n  - `peroxidatic_plus_resolving`: 23\n  - `peroxidatic_only`: 4\n- `pmp20` class: `peroxidatic_only` (`prx5_catalytic_state.tsv`)."
  - statement: Prx5 dimer template mapping does not support a template-like C(P)-C(R) pair in pmp20
    supporting_text: target_supports_template_like_cp_cr_pair = no
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The stored reproducible alignment/output establishes absence of a second cysteine and of canonical comparator resolving positions. Its conclusion is limited to canonical Trx-dependent cycling; active single-Cys Candida Pmp20 demonstrates that this cannot exclude every redox mechanism. Primary target biochemistry, rather than motif absence alone, grounds rejection of specific peroxide turnover.
- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission yeast Schizosaccharomyces pombe.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract verifies the systematic S. pombe localization study; target-specific cytoplasm, cytosol, and nucleus assignments are present in the refreshed GOA and reviewed UniProt record.
  findings: []
- id: PMID:20356456
  title: Distinct functional roles of peroxiredoxin isozymes and glutathione peroxidase from fission yeast, Schizosaccharomyces pombe.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary identity and abstract verified against the independently retrieved complete PDF, now available as pmp20-Kim2010-full-text.txt. Negative Trx and GSH peroxidase results and DTT/ascorbate MCO assays support functional divergence; GSH is data-not-shown with no detailed assay protocol. Holdase is directly demonstrated in vitro (~30% citrate-synthase aggregation protection at16:1), while physiological clients remain unresolved. The central publication cache itself remains abstract-only.
  findings:
  - statement: Pmp20 has no thioredoxin-dependent peroxidase activity.
    supporting_text: However, peroxidase activity was not observed for PMP20 (peroxisomal membrane protein 20).
  - statement: Pmp20 has weak chaperone activity (inhibits thermal aggregation).
    supporting_text: TPx, PMP20, and GPx inhibited thermal aggregation of citrate synthase at 43(o)C, but BCP failed to inhibit the aggregation. The chaperone activities of PMP20 and GPx were weaker than that of TPx.
  - statement: Pmp20 may act as a molecular chaperone rather than a peroxidase.
    supporting_text: The fission yeast PMP20 without thioredoxin-dependent peroxidase activity may act as a molecular chaperone.
- id: PMID:24521463
  title: A genetic approach to study H2O2 scavenging in fission yeast--distinct roles of peroxiredoxin and catalase.
  findings:
  - statement: Tpx1 is the main enzyme controlling low peroxide levels during aerobic growth in S. pombe.
    supporting_text: Tpx1 is the only enzyme with sufficient sensitivity for peroxides and cellular abundance as to control the low levels produced during aerobic growth
- id: PMID:11278957
  title: Antioxidant system within yeast peroxisome. Biochemical and physiological characterization of CbPmp20 in the methylotrophic yeast Candida boidinii.
  findings:
  - statement: C. boidinii CbPmp20 (ortholog) has glutathione peroxidase activity and is essential for growth on methanol, more important than catalase.
    supporting_text: The His(6)-tagged CbPmp20 fusion protein was found to have glutathione peroxidase activity in vitro toward alkyl hydroperoxides and H(2)O(2).
  - statement: CbPmp20 pmp20-deletion strain has more severe growth defect than catalase deletion and does not accumulate H2O2.
    supporting_text: the pmp20Delta strain had a more severe growth defect than the cta1Delta strain, which lacks catalase, another antioxidant enzyme within the peroxisome.
  - statement: CbPmp20 likely decomposes lipid hydroperoxides at peroxisomal membranes rather than bulk H2O2.
    supporting_text: it is speculated to be the main function of CbPmp20 is to decompose reactive oxygen species generated at peroxisomal membrane surface, e.g. lipid hydroperoxides, rather than to decompose H(2)O(2).
- id: PMID:18694816
  title: Absence of the peroxiredoxin Pmp20 causes peroxisomal protein leakage and necrotic cell death.
  findings:
  - statement: H. polymorpha Pmp20 (ortholog) deletion causes peroxisomal protein leakage and necrotic cell death on methanol.
    supporting_text: This growth defect was paralleled by leakage of peroxisomal matrix proteins into the cytosol.
  - statement: Absence of Pmp20 leads to loss of peroxisome membrane integrity and necrotic cell death.
    supporting_text: We conclude that the absence of the peroxisomal peroxiredoxin leads to loss of peroxisome membrane integrity and necrotic cell death.
- id: PMID:20977338
  title: 'Peroxiredoxin 5: structure, mechanism, and function of the mammalian atypical 2-Cys peroxiredoxin.'
  findings:
  - statement: Mammalian PRDX5 (Pmp20 ortholog) reduces alkyl hydroperoxides and peroxynitrite efficiently, but H2O2 more modestly.
    supporting_text: PRDX5 is a peroxidase that can use cytosolic or mitochondrial thioredoxins to reduce alkyl hydroperoxides or peroxynitrite with high rate constants in the 10(6) to 10(7) M(-1)s(-1) range, whereas its reaction with hydrogen peroxide is more modest, in the 10(5) M(-1)s(-1) range.
  - statement: PRDX5 is viewed as a cytoprotective antioxidant rather than a redox sensor.
    supporting_text: PRDX5 has been viewed mainly as a cytoprotective antioxidant enzyme acting against endogenous or exogenous peroxide attacks rather than as a redox sensor.
