- id: file:SCHPO/pmp20/pmp20-hypotheses/function-hypothesis-go-0008379/openscientist.md
  title: OpenScientist focused review of pmp20 thioredoxin peroxidase activity
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused hypothesis review judged GO:0008379 thioredoxin peroxidase activity over-annotated for pmp20 and recommended removing or suppressing the computational annotation.
  - statement: The direct PMID:20356456 assay refutes thioredoxin-dependent peroxidase activity and supports holdase activity.
  - statement: The report emphasizes that the thermal aggregation protection assay supports holdase-type anti-aggregation activity rather than peroxidase activity.
  - statement: PMID:24521463 provides organism-level context that peroxide scavenging in S. pombe is primarily attributed to Tpx1, catalase, and Gpx1, not pmp20.
  - statement: The report states that a non-thioredoxin reductant was not tested.
    supporting_text: Glutathione peroxidase activity not explicitly tested
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - file:SCHPO/pmp20/pmp20-Kim2010-full-text.txt
      review_notes: The primary full-text Results report negative GSH-dependent peroxidase activity (data not shown); the report used an incomplete evidence view. This does not prove every physiological partner/substrate was excluded.
      supported_by:
      - reference_id: file:SCHPO/pmp20/pmp20-Kim2010-full-text.txt
        supporting_text: 'None of the fission yeast Prxs

          and GPx showed GSH-dependent peroxidase activity (data not

          shown).'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read the complete report. Both reports incorrectly state that GSH-dependent activity was untested; primary Results p171 directly contradicts this. Single-Cys architecture does not by itself imply inactivity, but a modeled active-site tetrad also cannot establish catalytic turnover. The first report supports the specific Trx rejection and actual holdase assay; the second raises a valid partner-dependence caveat but wrongly treats holdase as untested and conflates Prx5 with Prx6 terminology. Neither report establishes peroxisomal targeting by the name PMP20.
- id: file:interpro/panther/PTHR10430/PTHR10430-deep-research-falcon.md
  title: PANTHER family PTHR10430 (PEROXIREDOXIN) functional diversity analysis
  findings:
  - statement: Peroxiredoxin family has extensive mechanistic diversity across six classes; GO annotations should not be naively propagated without active-site profiling.
    supporting_text: Active-site profiling approaches (DASP/PREX; MISST) were developed specifically because no single BLAST-like threshold can resolve these subgroups.
  - statement: Hyperoxidized peroxiredoxins can switch to chaperone/holdase activity, representing a functional divergence from simple detoxification.
    supporting_text: hyperoxidized forms can produce high-molecular-weight species associated with **chaperone-like (holdase) activity**
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read the family report. Its useful mechanistic distinction between Prx5/Prx6, 1-Cys/2-Cys cycles, alternative reductants and redox/chaperone roles is background, not evidence that every member has catalysis. No target activity is established by family membership alone.
