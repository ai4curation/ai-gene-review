- id: file:interpro/panther/PTHR10430/PTHR10430-paint.tsv
  title: PTHR10430 PAINT ancestral assertions
core_functions:
- description: Weak, directly measured holdase activity that limits heat-induced citrate-synthase aggregation in vitro. Physiological clients remain unresolved; neither an active-refolding mechanism nor peroxide reduction is established.
  supported_by:
  - reference_id: PMID:20356456
    supporting_text: The fission yeast PMP20 without thioredoxin-dependent peroxidase activity may act as a molecular chaperone.
  - reference_id: PMID:20356456
    supporting_text: TPx, PMP20, and GPx inhibited thermal aggregation of citrate synthase at 43(o)C, but BCP failed to inhibit the aggregation. The chaperone activities of PMP20 and GPx were weaker than that of TPx.
  molecular_function:
    id: GO:0140309
    label: unfolded protein holdase activity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
suggested_questions:
- question: Does Pmp20 holdase activity protect specific endogenous client proteins during heat or oxidative stress in vivo?
- question: Does Pmp20 occupy peroxisomes or mitochondria under any physiological condition, despite lacking obvious canonical targeting features?
- question: Can native interaction partners or physiological substrates reveal redox activity beyond the negative Trx/GSH assays, or a noncatalytic contribution to redox homeostasis? GSH-dependent activity was already tested and negative (data not shown) in PMID20356456, contrary to both provider reports.
suggested_experiments:
- description: Compare wild-type and pmp20 deletion cells during heat and oxidative stress using aggregation-sensitive reporters and quantitative insoluble-proteome analysis to test whether the weak in vitro holdase activity is physiologically relevant and identify candidate clients.
- description: Use functional endogenous fluorescent tagging with organelle markers, complemented by organelle fractionation and protease-protection assays, to resolve Pmp20 localization and topology under basal and stress conditions.
