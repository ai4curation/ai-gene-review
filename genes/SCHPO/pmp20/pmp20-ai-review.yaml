    supporting_text: For *S. pombe* Pmp20 (Prx5-like), organic hydroperoxides are a plausible physiological substrate class (inference from family), but this remains to be confirmed by *S. pombe*-specific enzymology
    reference_section_type: OTHER
  - statement: 'Falcon''s expert synthesis proposes a dual function for S. pombe Pmp20p: antioxidant

