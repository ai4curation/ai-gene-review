suggested_questions:
- question: Does Pmp20 holdase activity protect specific endogenous client proteins
    during heat or oxidative stress in vivo?
- question: Does Pmp20 occupy peroxisomes or mitochondria under any physiological
    condition, despite lacking obvious canonical targeting features?
suggested_experiments:
- description: Compare wild-type and pmp20 deletion cells during heat and oxidative
    stress using aggregation-sensitive reporters and quantitative insoluble-proteome
    analysis to test whether the weak in vitro holdase activity is physiologically
    relevant and identify candidate clients.
- description: Use functional endogenous fluorescent tagging with organelle markers,
    complemented by organelle fractionation and protease-protection assays, to resolve
    Pmp20 localization and topology under basal and stress conditions.
