gene_symbol: pmp20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Pmp20 is a small Prx5-like protein with experimentally detected weak
  holdase activity. Recombinant Pmp20 inhibits heat-induced aggregation of citrate
  synthase but has no detectable peroxidase activity, consistent with its lack of a
  candidate resolving cysteine. Unlike active fungal Pmp20 and mammalian Prx5 homologs,
  the S. pombe protein has diverged from peroxide reduction toward prevention of
  unfolded-protein aggregation. Cytoplasmic, cytosolic, and nuclear pools have been
  observed, while possible organellar pools remain unresolved.
