id: O14313
gene_symbol: pmp20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Pmp20 is a small Prx5-like protein in Schizosaccharomyces pombe with cytosolic and nuclear pools. Recombinant Pmp20 has weak unfolded-protein holdase activity that inhibits thermal aggregation of citrate synthase. It retains a peroxidatic-cysteine region but lacks a second cysteine, and direct assays detected neither thioredoxin-dependent nor glutathione-dependent peroxidase activity. It also failed to protect glutamine synthetase in a thiol-driven oxidative-damage assay. Its physiological client proteins, possible additional redox partners and condition-dependent organellar distribution remain unresolved.
