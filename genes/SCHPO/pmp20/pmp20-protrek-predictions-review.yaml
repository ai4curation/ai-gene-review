id: O14313
gene_symbol: pmp20
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for pmp20, an S. pombe Prx5-subfamily peroxiredoxin that has
  lost peroxidase activity through absence of the resolving cysteine. Every top-five call assumes
  active peroxide chemistry, and the free-text channel returns glutathione-peroxidase descriptions.
  Kim et al. showed recombinant pmp20 has neither thioredoxin-dependent nor glutathione peroxidase
  activity, only weak holdase activity, which is why this review assigns protein folding chaperone
  as the core function. Rank 1 is the one intriguing exception - it is an inhibitor rather than an
  enzyme term, and so is closer to a lost-activity framing than anything else in the list. Assessment:
  1 less precise (LSP), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
