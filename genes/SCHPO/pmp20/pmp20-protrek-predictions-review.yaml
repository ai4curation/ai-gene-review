    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Rank 2 (score 16.90), with detoxification of hydrogen peroxide at rank 3. Both assert the peroxide-clearing
      activity that pmp20 was directly assayed and found not to have. This is a case where a negative
      experimental result exists in the literature and the model reproduces the family expectation
      regardless - the defining limitation of similarity-based annotation for neofunctionalised proteins.
    supported_by:
    - reference_id: PMID:20356456
      supporting_text: >-
        recombinant pmp20 has no thioredoxin-dependent peroxidase activity and no glutathione peroxidase
        activity
