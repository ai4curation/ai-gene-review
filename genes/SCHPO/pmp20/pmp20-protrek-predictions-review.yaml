  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0036479
    label: peroxidase inhibitor activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 17.49) and absent from GOA. Peroxidase inhibitor activity is not a claim
      anyone has made about pmp20, but it is the only call in the list that does not assert catalysis,
      and for a peroxireduxin-family member that has lost its resolving cysteine an inhibitory or
      dominant-negative role within the family is at least a coherent hypothesis. It is unsupported,
      so it is recorded as uncertain rather than credited - but it is worth noting as the one place
      in either cohort where the retrieval produced a non-catalytic term for a pseudoenzyme.
    supported_by:
    - reference_id: PMID:20356456
      supporting_text: >-
        recombinant pmp20 has no thioredoxin-dependent peroxidase activity and no glutathione peroxidase
        activity
