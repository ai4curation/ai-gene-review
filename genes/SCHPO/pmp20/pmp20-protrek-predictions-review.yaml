    summary: >-
      Rank 4 (score 16.70), an exact GOA match. Cell redox homeostasis is broad enough to accommodate
      a holdase that acts under oxidative stress without asserting peroxidase catalysis, and it is
      on the record for this entry. Correct at that level and much less precise than what this review
