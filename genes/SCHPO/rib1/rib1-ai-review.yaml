  review:
    summary: Generic ARBA-derived root of the specific GTP cyclohydrolase II activity, which is already annotated.
    action: MODIFY
    reason: Correct but too general. rib1 belongs to the GTP cyclohydrolase II family (InterPro IPR000926 RibA,
      NCBIfam TIGR00505 ribA) and UniProt curates the GTP cyclohydrolase II reaction (EC 3.5.4.25), so the
      specific descendant GO:0003935, which the gene already carries, is the supported term. Family-membership
      evidence, not an S. pombe enzyme assay.
    proposed_replacement_terms:
