- term:
    id: GO:0019238
    label: cyclohydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001084665
  - SGD:S000000129
  review:
    summary: PAINT inference of the parent cyclohydrolase activity; the specific GTP cyclohydrolase II
      activity is annotated.
    action: MODIFY
    reason: Changed from KEEP_AS_NON_CORE, because the term is correct but general rather than peripheral.
      rib1 sits in the GTP cyclohydrolase II family (PANTHER PTHR21327:SF29), inside the PAINT node, with no
      evidence of loss or divergence, so the IBA holds. The specific descendant GO:0003935 GTP cyclohydrolase
      II activity (cyclohydrolase > GTP cyclohydrolase > GTP cyclohydrolase II), which the gene already
      carries, is the supported term. Family-membership evidence, not an S. pombe assay.
    proposed_replacement_terms:
    - id: GO:0003935
      label: GTP cyclohydrolase II activity
    supported_by:
    - reference_id: file:SCHPO/rib1/rib1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=GTP + 4 H2O = 2,5-diamino-6-hydroxy-4-(5-phosphoribosylamino)-pyrimidine
        + formate + 2 phosphate + 3 H(+)
    - reference_id: file:SCHPO/rib1/rib1-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PTHR21327:SF29; GTP CYCLOHYDROLASE-2
    - reference_id: file:SCHPO/rib1/rib1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the GTP cyclohydrolase II family.'
    propagation_review:
