taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'psd3 encodes a phosphatidylserine decarboxylase of Schizosaccharomyces pombe (EC 4.1.1.65) that is
  orthologous to S. cerevisiae Psd2 and belongs to the bacterial-like PSD2-type subfamily. It is a large protein
  whose C-terminal PSD domain is preceded by a long non-catalytic N-terminal region with a C2 domain that keeps
  the Ca2+-binding residues. Like other PSDs it is a self-cleaving pyruvoyl proenzyme that converts phosphatidylserine
  to phosphatidylethanolamine. By homology it is expected to act on endosome and Golgi membranes; a genome-wide
  tagging survey placed it in the cytosol and at the periphery of the forming septum. psd3 overlaps with psd1 and
  psd2: only loss of all three causes PE deficiency and ethanolamine auxotrophy.'
