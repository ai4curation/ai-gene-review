core_functions:
- description: PSD2-type phosphatidylserine decarboxylase with an N-terminal C2-domain region, contributing (with
    psd1 and psd2) to PE synthesis outside the mitochondrion, probably on endosome/Golgi membranes as in S. cerevisiae.
  molecular_function:
    id: GO:0004609
    label: phosphatidylserine decarboxylase activity
  directly_involved_in:
  - id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  locations:
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:19286980
    supporting_text: psd1-3Delta cells produce lower levels of phosphatidylethanolamine than wild-type cells, even
      in medium supplemented with ethanolamine
  - reference_id: PMID:19286980
    supporting_text: indicating that the psd1 to psd3 gene products share overlapping essential cellular functions
  - reference_id: PMID:19286980
    supporting_text: A third predicted gene, which we have designated psd3 (GenBank locus tag SPAC31G5.15), was
      identified; it encodes a protein highly homologous in structure to S. cerevisiae Psd2
  - reference_id: file:SCHPO/psd3/psd3-uniprot.txt
    supporting_text: Endosome membrane
suggested_questions:
- question: Where does functional psd3 act in S. pombe (endosome, Golgi or septum periphery), and is its C2 domain
    needed for membrane targeting or for PS transfer as proposed for S. cerevisiae Psd2?
suggested_experiments:
- description: Tag psd3 at its native locus with a functional tag, colocalize with endosome and Golgi markers, and
    measure PE in psd1 psd2 double deletions with or without a C2-deleted psd3.
