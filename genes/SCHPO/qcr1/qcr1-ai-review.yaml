        agreement: CONTRADICTED
        argument: >-
          The PTN000220393 IRD is on the terminal S. pombe qcr1/Cor1 leaf and
          would block GO:0004222 metalloendopeptidase activity from the
          ancestral eukaryotic beta-MPP node PTN000220240. The full-text
          fission-yeast study showed that Cor1 retains a Zn2+ density at the
