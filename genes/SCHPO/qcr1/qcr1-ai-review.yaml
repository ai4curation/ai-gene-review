taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Qcr1 is the S. pombe mitochondrial-processing peptidase beta subunit and
  Cor1 core subunit of respiratory complex III. It contains the conserved M16
  zinc metallopeptidase active site, forms a mitochondrial processing peptidase
  with Mas2 for N-terminal presequence removal from imported mitochondrial
  precursors, and is also built into the mitochondrial CIII2-CIV supercomplex,
  where the Cor1-Cor2 pair retains matrix-facing MPP activity.
