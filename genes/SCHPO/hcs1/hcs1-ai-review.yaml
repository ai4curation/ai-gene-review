  label: Schizosaccharomyces pombe 972h-
description: hcs1 (SPAC4F8.14c; UniProt P54874) encodes 3-hydroxy-3-methylglutaryl-CoA synthase (EC 2.3.3.10).
  It condenses acetoacetyl-CoA with acetyl-CoA to give HMG-CoA, the second step of the mevalonate pathway.
  hcs1 is a single-copy essential gene, and disruptants grow only when mevalonate is supplied. The enzyme
  is cytosolic in a genome-wide screen.
