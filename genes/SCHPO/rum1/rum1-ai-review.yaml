- description: 'Phosphatase-docking input that sets Rum1 abundance under poor nutrition: an LxxIxE short
    linear motif in the disordered N-terminal region (residues 39-44, flanking the T58/T62 CDK phosphodegron)
    recruits PP2A-B56(Par1), which reverses CDK phosphorylation and lets Rum1 accumulate during nitrogen
    starvation, tipping the Rum1/CDK double-negative loop toward the low-CDK pre-Start state. This is a
    substrate-side interaction that regulates Rum1 rather than an activity Rum1 performs, but it is the
    switch that makes the starvation G1 arrest possible.'
