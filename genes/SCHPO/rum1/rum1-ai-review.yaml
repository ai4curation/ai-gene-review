      arrest is one instance of this pre-Start G1 control, and the paper itself generalises Rum1''s
      requirement to the wee1-50 and nitrogen-starvation G1 extensions. A pheromone-specific term
      (GO:0000751, mitotic cell cycle G1 arrest in response to pheromone) exists but has no PomBase
      annotations at all, so the row is retained under the PomBase convention rather than modified. Core
      process.'
    supported_by:
