suggested_experiments:
- hypothesis: Rum1 promotes APC/C-dependent Cdc13 destruction indirectly, through CDK inhibition, rather
    than by acting as a substrate adaptor.
  description: Reconstitute APC/C(Ste9)-dependent ubiquitination of Cdc13 in vitro with purified fission
    yeast components and test whether recombinant Rum1 stimulates ubiquitination of Cdc13 when CDK is
    absent or pre-inhibited (adaptor model) versus only when active Cdc2-cyclin is present in the reaction
    (indirect model); in vivo, compare Cdc13 half-life in rum1-null cells carrying an analogue-sensitive
    cdc2-as allele inhibited in G1.
  experiment_type: in vitro ubiquitination reconstitution with chemical-genetic epistasis
- hypothesis: The cyclin-binding and CDK-inhibitory functions of the central Rum1 region are separable
    from the N-terminal phosphoregulatory and PP2A-B56-docking region.
  description: Determine a structure (cryo-EM or crystallography) of the Rum1 inhibitory region bound to
    Cdc2-Cdc13, and test point mutants that disrupt cyclin-groove contact versus catalytic-cleft contact
    for inhibition of Cdc2-Cdc13, Cdc2-Cig2 and Cdc2-Cig1 in vitro and for G1 arrest and mating in vivo.
