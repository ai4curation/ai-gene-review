  - Moreno S
- question: Is Rum1's requirement for Cdc13 destruction in G1 direct (an adaptor delivering Cdc13 to the
    cyclosome, as proposed by Stern & Nurse and Correa-Bordes et al.) or indirect (CDK inhibition permitting
    Ste9 dephosphorylation and APC/C(Ste9) activation, as suggested by the PP2A-B56 work)? The answer
    determines whether GO:1905786 should be an involved_in or only an upstream causal relation in a GO-CAM.
  experts:
