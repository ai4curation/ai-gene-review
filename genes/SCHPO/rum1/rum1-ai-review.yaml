  - Nurse P
- question: PomBase uses mitotic G1 cell size control checkpoint signaling (GO:0031568) for every pre-Start
    G1 delay, including pheromone-induced arrest, and never uses GO:0000751 (mitotic cell cycle G1 arrest
    in response to pheromone). Is that a deliberate convention (pheromone arrest in S. pombe being the
    same Rum1/Ste9 pre-Start mechanism) that should be documented, or a gap?
