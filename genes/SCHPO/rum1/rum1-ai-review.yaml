- term:
    id: GO:0007089
    label: traversing start control point of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:8121488
  qualifier: involved_in
  review:
    summary: 'Traversing start control point of mitotic cell cycle, from the discovery paper: rum1 is a
      regulator of G1 progression that determines the length of G1 and restrains mitosis until G1 is
      finished; loss of rum1 shortens or abolishes the pre-Start G1 interval and overexpression blocks
      Start.'
    action: MODIFY
    reason: 'Rum1 is certainly a component of the Start control: it holds Cdc2 in a pre-Start form until
      the critical size is reached and its Cdc2-Cig1-triggered destruction is part of the switch. But in
      the current ontology GO:0007089 is a subclass of positive regulation of G1/S transition of mitotic
      cell cycle (GO:1900087), and Rum1''s contribution to Start is inhibitory, so the term now asserts
      the wrong sign for this gene. The negative-regulation sibling, negative regulation of G1/S
      transition of mitotic cell cycle (GO:2000134), states exactly what Rum1 does and is already on the
      gene from the same laboratory''s follow-up work (PMID:8521500, PMID:7593289). PomBase applies
      GO:0007089 to the positive Start players cig2, cdc13, pas1 and pef1 and also to the negative
      regulator par1, so this looks like a term-placement issue for PomBase and the ontology to settle
      rather than an evidential error; it is raised in suggested_questions.'
    proposed_replacement_terms:
    - id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
    supported_by:
    - reference_id: PMID:8121488
      supporting_text: 'It influences three aspects of G1 regulation: determination of the length of G1,
        dependence of S phase upon completion of mitosis, and restraint of mitosis until G1 is finished.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:7593289
      supporting_text: Here we present genetic data suggesting that rum1 maintains p34cdc2 in a pre-Start
        G1 form, inhibiting its activity until the cell achieves the critical mass required for Start, and
        find that in the absence of rum1 p34cdc2 has increased Start activity in vivo.
      reference_section_type: ABSTRACT
- term:
    id: GO:0031568
    label: mitotic G1 cell size control checkpoint signaling
  evidence_type: EXP
  original_reference_id: PMID:9614176
  qualifier: involved_in
  review:
    summary: 'Mitotic G1 cell size control checkpoint signaling from the pheromone paper (full text cached):
      rum1+ is required to maintain pheromone-induced G1 arrest by inhibiting and inducing proteolysis of
      the cdc13p-cdc2p kinase, and the same function operates wherever G1 is prolonged, e.g. in a wee1-50
