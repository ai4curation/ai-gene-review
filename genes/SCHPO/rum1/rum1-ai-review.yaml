gene_symbol: rum1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'rum1 encodes Rum1 (p25rum1), a 230-residue, largely intrinsically disordered, non-enzymatic
  cyclin-dependent kinase inhibitor and the only CKI of fission yeast. It binds the B-type cyclin subunit
  of Cdc2-cyclin holoenzymes through an approximately 80-residue central region that is the sole segment
  with similarity to budding-yeast Sic1, and it inhibits Cdc2-Cdc13 (the mitotic CDK) at low nanomolar
  concentration, inhibits Cdc2-Cig2 (the S-phase CDK) only partially, and leaves Cdc2-Cig1 untouched.
  Rum1 accumulates at anaphase and persists through G1, where it maintains Cdc2 in a pre-Start, low-activity
  form: it sets the length of pre-Start G1 so that cells reach the critical size before Start, prevents
  small or arrested G1 cells from launching a lethal mitosis, and keeps CDK-driven replication initiation
  off until Start. Its restraint of Cdc2-Cdc13 in G1 is coupled to APC/C(cyclosome)-dependent destruction
  of Cdc13, and Rum1 is specifically required for that destruction, so that G1 cells hold both a low
  kinase state and a low mitotic-cyclin state. When G1 must be prolonged, in a wee1 mutant, after nitrogen
  starvation, or in response to mating pheromone, Rum1 accumulates and is required to establish and
  maintain the G1 arrest that precedes conjugation; rum1-null cells fail to arrest and are sterile,
  whereas excess Rum1 in G2 blocks mitotic CDK, permits Cdc18 accumulation and drives repeated rounds of
  DNA replication without mitosis. Rum1 abundance is controlled by phosphorylation: Cdc2-Cig1 (and Puc1)
  phosphorylates Thr58/Thr62 at G1/S, creating the phosphodegron recognised by the F-box proteins
  Pop1/Pop2 of the SCF ubiquitin ligase and leading to proteasomal destruction, while under poor nutrition
  PP2A-B56(Par1), docked on an LxxIxE motif in the Rum1 N-terminal region, reverses this phosphorylation
  and stabilises the inhibitor. MAPK phosphorylation of Thr13/Ser19 reduces its inhibitory potency without
  abolishing CDK binding. Rum1 is a nuclear protein and acts on nuclear Cdc2-cyclin complexes.'
