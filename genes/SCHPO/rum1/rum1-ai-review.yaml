    label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  evidence_type: EXP
  original_reference_id: PMID:8521500
  qualifier: enables
  review:
    summary: 'Cyclin-dependent protein serine/threonine kinase inhibitor activity from the paper that
      defined the biochemistry: purified p25rum1 is a specific in vitro inhibitor of the p34cdc2/p56cdc13
      mitotic kinase, and in early G1 cells it associates with and inhibits that kinase while keeping
      Cdc13 levels low.'
    action: ACCEPT
    reason: 'This is the defining molecular function of Rum1 and the activity through which all of its
      cell-cycle roles are executed. The inhibition is direct, stoichiometric and cyclin-selective
      (complete inhibition of Cdc2-Cdc13 at 2.6 nM, partial inhibition of Cdc2-Cig2, no inhibition of
      Cdc2-Cig1), which justifies the CDK-specific term rather than a generic kinase-inhibitor term. Core
      function.'
