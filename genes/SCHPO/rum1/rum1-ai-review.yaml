suggested_questions:
- question: GO:0007089 (traversing start control point of mitotic cell cycle) is now a subclass of positive
    regulation of G1/S transition (GO:1900087), yet PomBase annotates the negative Start regulators rum1
    and par1 to it alongside the positive players cig2, cdc13, pas1 and pef1. Should the CKI and phosphatase
    rows be moved to GO:2000134, or should the ontology give the Start term a neutral parent so that all
    components of the switch can share it?
