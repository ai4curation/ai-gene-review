taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pyr1 (SPBC17G9.11c; UniProt Q9UUE1) encodes the single, biotin-dependent pyruvate carboxylase
  (EC 6.4.1.1) of fission yeast. It carboxylates pyruvate to oxaloacetate in the cytosol, supplying oxaloacetate
  for aspartate synthesis and for anaplerotic TCA replenishment, and for gluconeogenesis from pyruvate.
  It is cytosolic in a genome-wide screen.
