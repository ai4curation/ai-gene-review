  review:
    summary: UniProt cytoplasm mapping; the more specific cytosol location is already annotated.
    action: MODIFY
    reason: Correct but general; the gene already carries cytosol (GO:0005829) by HDA from the ORFeome
      screen and by IBA, both accepted. The UniProt Cytoplasm note is by similarity (ECO:0000250); the
      record has no SIGNAL, TRANSIT or TRANSMEM feature, so a soluble cytosolic enzyme is the expected
      location (the PANTHER subfamily name says mitochondrial, which reflects the animal members).
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
