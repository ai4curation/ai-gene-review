  review:
    summary: 'PomBase IDA (Nairn et al. 1998) to ''canonical glycolysis'' (GO:0061621), which is now obsolete in
      GO. The biology is right: the enzyme catalyses the last step of glycolysis and is feed-forward activated by
      FBP, a glycolytic intermediate. The replacement is the parent glycolytic process term.'
    action: MODIFY
    reason: GO:0061621 is obsolete; GO:0006096 glycolytic process is the current term for the same process.
