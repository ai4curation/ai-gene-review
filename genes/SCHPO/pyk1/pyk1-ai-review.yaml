  label: Schizosaccharomyces pombe 972h-
description: pyk1 (SPAC4H3.10c) encodes the sole pyruvate kinase of Schizosaccharomyces pombe (EC 2.7.1.40), a cytosolic
  Mg2+/K+-dependent enzyme that transfers the phosphoryl group of phosphoenolpyruvate to ADP, yielding pyruvate
  and ATP in the final, essentially irreversible step of glycolysis. The recombinant enzyme shows sigmoidal kinetics
  towards phosphoenolpyruvate that become hyperbolic in the presence of fructose-1,6-bisphosphate, i.e. it is feed-forward
  activated like budding-yeast Cdc19, and it behaves as a dimer-tetramer equilibrium in solution. It is a soluble
  cytosolic protein, used as a marker of bulk cytosol (including as a bulk autophagy cargo).
