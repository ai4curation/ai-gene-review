  label: Schizosaccharomyces pombe 972h-
description: Putative 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP) synthase (EC 2.5.1.54) of Schizosaccharomyces pombe
  (SPAC24H6.10c, PomBase aro4; UniProt Q09755 has no gene name), one of two class-I DAHP synthase paralogs in fission yeast
  together with aro3 (Q9UT09). It is predicted to condense phosphoenolpyruvate and D-erythrose 4-phosphate to DAHP, the first
  committed step of the shikimate pathway leading to chorismate and the aromatic amino acids. The protein is cytosolic and
  nuclear in the ORFeome localisation screen. Activity and feedback regulation have not been tested in S. pombe.
