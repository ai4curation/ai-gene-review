suggested_questions:
- question: Which aromatic amino acid (Phe, Tyr or Trp) feedback-inhibits aro4 (Q09755), and do the two S. pombe DAHP synthase
    paralogs partition feedback control as S. cerevisiae Aro3 (Phe) and Aro4 (Tyr) do?
- question: Is aro4 catalytically active and expressed at levels that contribute to aromatic amino acid prototrophy?
suggested_experiments:
- description: Purify recombinant aro4 and measure DAHP synthase activity and inhibition by Phe, Tyr and Trp; test single
    and double aro3/aro4 deletions for aromatic amino acid requirement.
  experiment_type: enzyme assay and genetics
