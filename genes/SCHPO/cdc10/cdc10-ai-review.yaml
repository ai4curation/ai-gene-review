- description: >-
    The C-terminal 61 residues of Cdc10 are the regulatory module through which the output of promoter-bound
    MBF is switched off and coupled to the genome-integrity checkpoints. This region is required
    to load the MBF-encoded corepressors Nrm1 and Yox1 onto MCB promoters, confining transcription
    to G1/S; its deletion (cdc10-C4) expresses MCB genes constitutively. Under replication stress,
    Cds1 phosphorylation of the repressors (and, sufficiently, of Cdc10 Ser720/Thr723) keeps the
    program on, whereas after DNA damage Chk1 binds Cdc10 and phosphorylates Ser720 and Ser732, releasing
    intact MBF from chromatin and repressing cdc18, cdt2 and other targets; a non-phosphorylatable
    Cdc10.2A mutant fails to release and is MMS-sensitive. Cdc10 thus acts as the coregulatory scaffold
    that integrates repression and activation of the same Pol II regulon.
