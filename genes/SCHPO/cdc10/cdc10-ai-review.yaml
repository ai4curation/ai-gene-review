- id: file:SCHPO/cdc10/cdc10-deep-research-falcon.md
  title: cdc10 deep research (falcon literature synthesis)
  findings:
  - statement: >-
      Res1/Res2 supply sequence-specific promoter recognition; Cdc10 is the interaction and regulatory
      platform.
    supporting_text: >-
      Accordingly, the most defensible model is that Res1/Res2 supply sequence-specific promoter
      recognition while the ankyrin-containing Cdc10 subunit serves as an essential interaction and
      regulatory platform.
  - statement: >-
      Cdc10-Res1-Res2 remain promoter-associated across the cycle; Cdc10 abundance is not the oscillator.
    supporting_text: >-
      Cdc10 abundance alone is not the cell-cycle oscillator. Increasing Cdc10 expression did not
      abolish periodic transcription, and Cdc10, Res1, and Res2 can remain associated with target
      promoters across the cell cycle.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Edison/falcon synthesis built on Ayte 1995, Ivanova 2013, Eshaghi 2011 and two 2024 papers;
      its claims were checked against the cached primary literature and are used only for the division-of-labour
      and constitutive-occupancy statements.
