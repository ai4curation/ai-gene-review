    summary: >-
      PAINT inference at the APSES-family node PTN000917496 (Swi4, Mbp1, Swi6 and their C. albicans
      and S. pombe counterparts). Every extant member of the node is a subunit of a G1/S transcription
      factor (SBF, MBF, fission-yeast MBF), so the node placement is sound; the donors are the three
