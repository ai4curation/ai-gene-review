suggested_questions:
- question: >-
    PomBase annotates Cdc10 with enables-qualified GO:0001228 on ten experimental rows, GO_Central
    propagates the same term from a PAINT node seeded only by the DNA-binding subunits (Res2, Swi4,
    Mbp1), and the contributes_to qualifier is used on one GO:0001228 row and three GO:0000978 rows.
    Given that Res1/Res2 supply MCB recognition and Rep2 supplies activation, what is the preferred
    GO representation of Cdc10's own activity: contributes_to GO:0001228, enables GO:0003713 transcription
    coactivator activity (as SGD uses for Swi6), or the neutral GO:0003712 coregulator activity given
    its equally documented repressive role through Nrm1/Yox1 loading?
  experts:
  - Valerie Wood
  - Robertus A. M. de Bruin
  - Jose Ayte
- question: >-
    Does the divergent APSES-like N-terminal region of Cdc10 (UniProt residues 66-173) contact DNA
    at all within the MBF-MCB complex, as a structural analysis of the Swi6 N terminus might suggest,
    or is it purely a protein-interaction surface? A structure of Cdc10-Res1/Res2 bound to an MCB
    would settle whether contributes_to is the right qualifier for the DNA-binding rows.
  experts:
  - Nick Jones
  - Stephen Whitehall
- question: >-
    Is the rRNA-transcription role inferred from the Cdc10-Pol5 interaction real? The 5S rRNA genes
    at which Cdc10 is enriched by ChIP-chip are Pol III templates, whereas Pol5 binds rDNA (Pol I)
    promoters, and no Cdc10 perturbation affecting rRNA synthesis has been reported.
  experts:
  - Christopher J. McInerny
  - Jurg Bahler
suggested_experiments:
- hypothesis: >-
    Cdc10 licenses the DNA-binding activity of Res1/Res2 by relieving an intramolecular auto-inhibition,
    as Swi6 does for Swi4, rather than by contributing DNA contacts, and the N-terminal APSES-like
    region of Cdc10 is dispensable for MCB binding.
  description: >-
    Reconstitute MBF from purified recombinant Res1 (full length and the N-terminal DNA-binding domain),
    Res2 and Cdc10 (full length, an N-terminal deletion lacking residues 66-173, and the C-terminal-truncated
    Cdc10-C4), and compare MCB binding by EMSA and fluorescence anisotropy; then determine a cryo-EM
    structure of the Res1-Cdc10-MCB complex. Complementary in vivo ChIP of Res1 in cdc10 conditional
    cells would test whether Res1 promoter occupancy requires Cdc10, as the ChIP-chip data of Eshaghi
    et al. 2011 suggest.
  experiment_type: biochemical reconstitution and structural analysis
- hypothesis: >-
    The Cdc10 C-terminal 61 residues form a phospho-regulated docking site for Nrm1/Yox1, and Chk1
    phosphorylation of Ser720/Ser732 evicts MBF by weakening the Res1/Res2-DNA interface rather than
    the Cdc10-Res interaction.
  description: >-
    Map the Nrm1 and Yox1 binding surface on the Cdc10 C terminus by pull-down with phospho-mimetic
    and non-phosphorylatable peptides, and use quantitative ChIP-seq of Cdc10, Res1, Res2, Nrm1 and
    Yox1 in cdc10-2A, cdc10-2E, cdc10-C4 and wild-type cells after MMS and HU to separate repressor
    loading from MBF eviction; measure nascent transcription (4tU-seq) in the same samples to determine
    which of the MBF targets (cdc18/cdt2 versus cdc22/mik1) respond to each mechanism.
  experiment_type: phosphosite mutagenesis with ChIP-seq and nascent transcription
- hypothesis: >-
    Cdc10 has an MBF-independent function at replication origins and 5S rRNA genes, reflected in
    its Res1/Res2-independent ChIP enrichment there.
  description: >-
    Perform ChIP-seq of Cdc10 in res1, res2 and rep2 deletion strains and in pol5 depleted cells
    to determine which Cdc10 sites depend on each partner, and combine with origin-firing assays
    (BrdU-IP or Okazaki-fragment sequencing) and Pol I/Pol III nascent-transcript measurements in
    cdc10-C4 and cdc10 conditional cells released from a G1 block, to test whether the extra-regulon
    binding has any transcriptional or replication consequence.
  experiment_type: genome-wide occupancy and functional genomics
