    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: EXP
  original_reference_id: PMID:14648198
  qualifier: enables
  review:
    summary: >-
      Cunliffe, White and McInerny 2004 (MGG; abstract-only cache): MCB motifs confer pre-meiotic
      S-phase transcription, a DSC1-like MCB-binding complex is present in meiotic cells, and mutation/over-expression
      of DSC1 components shows that cdc10, res2, rep1 and rep2 (but not res1) are required for correct
