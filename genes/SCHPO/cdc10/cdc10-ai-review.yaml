      cdc10 was defined by its Start-arrest phenotype: cdc10 mutants arrest in G1 with unreplicated
      DNA because MBF-dependent transcription of cdc18, cdt1, cdc22 and cig2 fails (PMID:7916658,
      PMID:8313888, PMID:7739540). The inherited process is the core function of the gene.
