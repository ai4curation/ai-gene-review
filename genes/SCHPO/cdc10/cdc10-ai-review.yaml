      molecular-function class fits the Res subunits, not the shared Swi6-like subunit; SGD annotates
      Swi6, the budding-yeast counterpart, to GO:0003713 transcription coactivator activity, and
      the SWI6 review in this repository makes the same substitution. Proposing GO:0003713 keeps
      the activation claim at the level Cdc10 executes (it binds the DNA-bound Res1/Res2 transcription
      factors and is essential for their output); retaining GO:0001228 with a contributes_to qualifier,
      as PomBase did on the Baum 1997 row, would be an equally acceptable representation.
