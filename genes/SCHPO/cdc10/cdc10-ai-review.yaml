    action: MODIFY
    reason: >-
      The essence, that Cdc10 is required for MBF to activate MCB-driven transcription in the meiotic
      as well as the mitotic cycle, is sound. Cdc10 has no demonstrated sequence-specific DNA-binding
      activity of its own: MCB recognition is supplied by the APSES domains of Res1 and Res2 (the
      isolated N-terminal 157 residues of Res1 bind the cdc22 promoter, and that fragment alone rescues
