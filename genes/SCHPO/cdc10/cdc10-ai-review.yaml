core_functions:
- description: >-
    Cdc10 is the shared core subunit of the MBF transcription factor. Through its C-terminal region
    and ankyrin domain it binds the C termini of the MCB-recognising subunits Res1 and Res2, forming
    the Res1-Cdc10 and Res2-Cdc10 heteromers that occupy MCB elements in the promoters of cdc18,
    cdt1, cdc22, cig2, cdt2 and the rest of the G1/S regulon; MBF activity in vivo depends on this
    interaction, and the complex stays promoter-bound through the cycle. Cdc10 supplies the platform
    on which the Rep2 activator (Rep1/Rep2 in meiosis) assembles, so that at Start MBF activates
    Pol II transcription of the replication and S-phase genes; cdc10 loss arrests cells in G1 with
    unreplicated DNA, and the same Res2-Cdc10 machinery drives MCB-dependent transcription of rec8,
    rec11, cdc18 and cdc22 in pre-meiotic S phase. Cdc10 does not itself contact the MCB sequence;
    it contributes to the DNA-binding activity of the complex it nucleates.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  contributes_to_molecular_function:
