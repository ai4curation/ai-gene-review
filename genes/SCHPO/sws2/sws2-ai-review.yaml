suggested_questions:
- question: Does S. pombe uS13m form the same intersubunit bridges (mB8-mB10, mB13) as S. cerevisiae
    uS13m, given that fission-yeast mitoribosome structure has not been determined?
suggested_experiments:
- description: Delete or deplete sws2 and measure respiratory growth and 35S labelling of mitochondrial
    translation products, and determine whether Sws2 co-sediments with the 37S small subunit.
