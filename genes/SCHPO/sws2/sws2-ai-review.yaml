  title: The structure of the yeast mitochondrial ribosome.
  findings:
  - statement: S. cerevisiae Sws2 (P53937) is modelled as uS13m in the mitoribosome small subunit
      and contributes to intersubunit bridges mB8 (with mL46), mB9 (with uL5), mB10 and mB13 (with
      21S rRNA helix H62).
    supporting_text: Most of the bridges present in the bacterial ribosome, with the exception of bridges
      B1a/b and B4, are also present in the yeast mitoribosome
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cryo-EM structure of the orthologous S. cerevisiae mitoribosome; supplementary table
      S1 lists Sws2 as uS13m and table S3 lists its bridge contacts. Main source for ortholog-based
      structural claims.
