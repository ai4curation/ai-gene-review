description: Sws2 (SPCC1795.07) is the fission yeast mitochondrial small-subunit ribosomal protein uS13m,
  a 151-residue nuclear-encoded member of the universal uS13 family that descends from the bacterial
  (alphaproteobacterial) S13 lineage rather than from the cytosolic uS13/Rps18 lineage. It localizes
  to mitochondria and, by orthology with Saccharomyces cerevisiae Sws2, is a structural constituent
  of the 37S small subunit of the mitoribosome, which translates the mitochondrially encoded
  respiratory-chain and ATP synthase subunits. In the S. cerevisiae mitoribosome structure uS13m sits
  in the head of the small subunit and contributes to several intersubunit bridges, contacting the
  large-subunit protein uL5, the mitochondria-specific protein mL46 and helix H62 of the large-subunit
  rRNA.
