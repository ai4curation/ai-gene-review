  label: Schizosaccharomyces pombe 972h-
description: 'SPAC13G7.12c (UniProt Q10276) encodes the only choline/ethanolamine kinase of fission yeast
  (EC 2.7.1.32). It phosphorylates choline, and by family similarity ethanolamine, with ATP: the first
  step of the Kennedy (CDP-choline and CDP-ethanolamine) pathways that convert exogenous or recycled head
  groups into phosphatidylcholine and phosphatidylethanolamine. Function is assigned by orthology to S.
  cerevisiae CKI1; a genome-wide screen places it in the cytosol and nucleus.'
