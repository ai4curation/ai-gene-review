  label: Schizosaccharomyces pombe 972h-
description: SPBC12C2.07c (UniProt Q09741; the fission yeast SPE3 ortholog) encodes spermidine synthase
  (EC 2.5.1.16), which transfers the aminopropyl group of decarboxylated SAM (from spe2) to putrescine
  to make spermidine. Spermidine is essential in S. pombe and, among other roles, is needed for eIF5A
  hypusination. S. pombe makes spermine but has no separate SPE4-type spermine synthase, so this enzyme
  may also make spermine. It is cytosolic in a genome-wide screen.
