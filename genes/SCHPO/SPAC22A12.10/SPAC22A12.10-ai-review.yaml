taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC22A12.10 (Ept1; UniProt O13901) encodes the only class-I CDP-alcohol phosphotransferase
  of fission yeast, a multipass ER/nuclear-envelope enzyme. It transfers phosphocholine from CDP-choline,
  or phosphoethanolamine from CDP-ethanolamine, onto diacylglycerol, completing the Kennedy pathway to
  phosphatidylcholine and phosphatidylethanolamine. In closed mitosis, DG is depleted from the inner nuclear
  membrane. DG consumption by Ept1, together with DG-to-PA conversion by the kinase Dgk1, drives the burst
  of glycerophospholipid synthesis that expands the nuclear envelope. ept1 deletion causes diploidisation,
  and ept1 dgk1 double mutants are barely viable.
