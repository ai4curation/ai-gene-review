    summary: IMP from the study showing that ept1 deletion impairs nuclear envelope expansion. Ept1 consumes
      DG to make PC and PE directly; Dgk1 is the enzyme that makes PA in that study. The supported process
      is glycerophospholipid synthesis from DG through the Kennedy pathway, not PA synthesis.
    action: MODIFY
    reason: Ept1 does not make phosphatidic acid; the phenotype reflects loss of Kennedy-pathway phospholipid
      synthesis.
