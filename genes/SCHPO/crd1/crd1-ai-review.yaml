suggested_questions:
- question: What is the substrate of the N-terminal HAD-like mitochondrial hydrolase domain fused to S.
    pombe CL synthase, and is the fusion functionally meaningful for cardiolipin synthesis or remodelling?
- question: Why is CL synthase essential in S. pombe but dispensable in S. cerevisiae?
suggested_experiments:
- description: Purify the processed N-terminal hydrolase chain and screen phosphatase/hydrolase activity
    on lipid and small-molecule phosphate substrates (e.g. PGP, nucleotide phosphates).
