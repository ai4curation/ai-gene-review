  label: Schizosaccharomyces pombe 972h-
description: Fission yeast cardiolipin synthase (CMP-forming; EC 2.7.8.41), encoded by SPAC22A12.08c as
  the C-terminal part of a tandem fusion protein whose N-terminal part is a HAD-like mitochondrial hydrolase
  of unknown function. The CL synthase transfers the phosphatidyl group of CDP-diacylglycerol to phosphatidylglycerol
  to form cardiolipin in the mitochondrial inner membrane, the last step of the CDP-DAG route to cardiolipin.
  Unlike S. cerevisiae crd1 mutants, the S. pombe gene is essential; S. pombe and S. cerevisiae CL synthases
  complement each other. Functional CL synthase is produced only from a minor transcript that retains
  intron IV (isoform 1), whereas the major spliced transcript encodes only the hydrolase part; the precursor
  is imported into mitochondria and proteolytically processed.
