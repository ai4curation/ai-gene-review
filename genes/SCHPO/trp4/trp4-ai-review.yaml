    summary: PAINT inference; step 2 of tryptophan synthesis.
    action: ACCEPT
    reason: UniProt places the enzyme at step 2/5 of tryptophan synthesis from chorismate, as a
      member of the anthranilate phosphoribosyltransferase (TrpD) family. trp4 itself appears among
      the PAINT sources (PomBase:SPBC16G5.08), reflecting its own experimental tryptophan-pathway
      annotation from the classical auxotrophic marker (PMID:17248775, abstract-only in the cache).
