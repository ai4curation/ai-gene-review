  label: Schizosaccharomyces pombe 972h-
description: trp4 (SPBC16G5.08; UniProt O60122), the ortholog of S. cerevisiae TRP4, encodes anthranilate
  phosphoribosyltransferase (EC 2.4.2.18), which transfers the phosphoribosyl group of PRPP to anthranilate,
  the second step of tryptophan biosynthesis. trp4 is a classical tryptophan auxotrophic locus. The enzyme
  is cytosolic in a genome-wide screen.
