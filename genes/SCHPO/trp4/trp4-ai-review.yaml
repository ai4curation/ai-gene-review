- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000312
  review:
    summary: Generic InterPro-derived parent (glycosyltransferase family 3 signature) of the specific
      anthranilate phosphoribosyltransferase activity, which is already annotated.
    action: MODIFY
    reason: Correct but too general. trp4 carries the glycosyltransferase family 3 domain (InterPro IPR000312,
      behind this row) and is a member of the TrpD family (HAMAP MF_00211, NCBIfam TIGR01245); UniProt curates
      the anthranilate phosphoribosyltransferase reaction (EC 2.4.2.18), a phosphoribosyl transfer. The specific
      descendant GO:0004048, which the gene already carries, is the supported term. Family-membership evidence.
    proposed_replacement_terms:
    - id: GO:0004048
      label: anthranilate phosphoribosyltransferase activity
    supported_by:
    - reference_id: file:SCHPO/trp4/trp4-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=N-(5-phospho-beta-D-ribosyl)anthranilate + diphosphate = 5-phospho-alpha-D-ribose
        1-diphosphate + anthranilate
    - reference_id: file:SCHPO/trp4/trp4-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: MF_00211; TrpD
    - reference_id: file:SCHPO/trp4/trp4-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR000312; Glycosyl_Trfase_fam3.
