  label: Schizosaccharomyces pombe 972h-
description: hem12 (SPCC4B3.05c; UniProt Q9USJ5) encodes uroporphyrinogen decarboxylase (UROD; EC
  4.1.1.37), a cytosolic enzyme that removes the four acetate carboxyl groups of uroporphyrinogen
  III one after another to give coproporphyrinogen III. This is the fifth step of heme biosynthesis
  and the last one in the cytosol before the pathway returns to mitochondria. Function is assigned
  by orthology to S. cerevisiae HEM12; a genome-wide screen places hem12 in the cytosol.
