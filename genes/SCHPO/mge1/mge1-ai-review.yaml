      supporting_text: >-
        The cached record is abstract-only, but the PomBase ISO row is
        biologically plausible and is retained as a non-core Mge1/Ssq1
        Fe/S-assembly role.
    - reference_id: PMID:28848044
      supporting_text: >-
        regulated crucial mtHsp70 functions, such as import of preproteins and
        biogenesis of Fe-S clusters.
