- term:
    id: GO:0030150
    label: protein import into mitochondrial matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000478265
  - SGD:S000005758
  - UniProtKB:Q8TAA5
  review:
    summary: >-
      PAINT transfers the Mge1/GRPEL role in the mitochondrial presequence
      import motor.
    action: ACCEPT
    reason: >-
      Retain protein import into the mitochondrial matrix. Mge1's nucleotide
      exchange activity reloads the matrix Hsp70 of the PAM import motor,
      supporting iterative binding and release of preproteins during
      presequence-dependent matrix import. Although the family-level
      PTHR21237 review leaves the full PTN000478265 eukaryotic node envelope
      unresolved, S. pombe mge1 falls in the fungal mitochondrial GrpE lineage
      with no recorded PAINT loss and a cached production GO-CAM already
      represents it in this matrix-import role.
    supported_by:
    - reference_id: PMID:14638855
      supporting_text: >-
        Transport of preproteins into the mitochondrial matrix is mediated by
        the presequence translocase-associated motor (PAM).
    - reference_id: PMID:28848044
      supporting_text: >-
        regulated crucial mtHsp70 functions, such as import of preproteins and
        biogenesis of Fe-S clusters.
