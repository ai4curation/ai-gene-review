id: O43047
gene_symbol: mge1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  mge1 encodes the fission-yeast mitochondrial GrpE-family nucleotide-exchange
  factor for matrix Hsp70 chaperones. It acts in the mitochondrial matrix as a
  PAM import-motor cofactor for ssc1 during ATP-dependent preprotein import
  through TIM23, uses the same Hsp70 nucleotide cycle during post-import
  protein folding, and may support Fe/S-cluster assembly.
