- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000740
  review:
    summary: >-
      GrpE-family nucleotide-exchange factors act as dimers, but
      self-association is secondary to the Hsp70 nucleotide-exchange activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep the GrpE homodimerization mapping as a non-core structural
      molecular function. Homodimeric assembly is a conserved GrpE-family
      property associated with DnaK/Hsp70 exchange-factor activity, but the
      core molecular function of mge1 is nucleotide exchange on mitochondrial
      Hsp70.
    supported_by:
    - reference_id: PMID:28848044
      supporting_text: NEF dimers traditionally observed in lower organisms
    - reference_id: file:SCHPO/mge1/mge1-uniprot.txt
      record_section:
      - DR:InterPro
      supporting_text: InterPro; IPR000740; GrpE.
- term:
    id: GO:0044571
    label: '[2Fe-2S] cluster assembly'
  evidence_type: ISO
  original_reference_id: PMID:12756240
  qualifier: involved_in
  supporting_entities:
  - SGD:S000005758
  review:
    summary: >-
      The Ssq1/Jac1 Fe/S-assembly role is a plausible non-core mitochondrial
      Hsp70 context for Mge1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep the ISO row as a secondary role for the shared mitochondrial GrpE
      nucleotide-exchange factor. In budding yeast, Mge1 is shared by the Ssc1
      and Ssq1 mitochondrial Hsp70 systems, and the human GRPEL proteins also
      regulate mtHsp70 functions including Fe-S cluster biogenesis. A second
      cached S. pombe GO-CAM, 6690711d00000331, places mge1 in this
      mitochondrial Fe/S-assembly role. This supports transfer to the
      fission-yeast ortholog, but the central role in GO-CAM 69729a3800007453
      is Ssc1/PAM-driven preprotein import.
    supported_by:
    - reference_id: PMID:12756240
      supporting_text: >-
        shares a nucleotide exchange factor, Mge1, with a second mitochondrial
        Hsp70, Ssc1.
    - reference_id: PMID:28848044
      supporting_text: >-
        regulated crucial mtHsp70 functions, such as import of preproteins and
        biogenesis of Fe-S clusters.
