  review:
    summary: >-
      PAINT assigns the conserved GrpE-family nucleotide-exchange activity.
    action: ACCEPT
    reason: >-
      Retain as the core molecular function. Budding-yeast Mge1 directly
      stimulates ATP and ADP release from the matrix Hsp70 Ssc1, human GRPEL1
      and GRPEL2 preserve mtHsp70 regulation, and the S. pombe protein is a
      mitochondrial GrpE-family member.
