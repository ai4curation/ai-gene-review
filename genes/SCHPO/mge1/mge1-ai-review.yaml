  - UniProtKB:Q8TAA5
  - UniProtKB:Q9HAV7
  review:
    summary: >-
      PAINT assigns the conserved GrpE-family nucleotide-exchange activity.
    action: ACCEPT
    reason: >-
      Retain as the core molecular function. Budding-yeast Mge1 directly
      stimulates ATP and ADP release from the matrix Hsp70 Ssc1, human GRPEL1
      and GRPEL2 preserve mtHsp70 regulation, and the S. pombe protein is a
      mitochondrial GrpE-family member.
    supported_by:
    - reference_id: PMID:9048947
      supporting_text: >-
        The release of both ATP and ADP from Ssc1 was stimulated in the
        presence of Mge1
    - reference_id: PMID:28848044
      supporting_text: >-
        Nucleotide exchange factors (NEFs) play a crucial role in exchanging
        ADP for ATP at mtHsp70's nucleotide-binding domain
