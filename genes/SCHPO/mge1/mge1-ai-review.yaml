suggested_questions:
- question: >-
    Does S. pombe mge1 also service an Ssq1-like mitochondrial Hsp70 during
    Fe/S-cluster assembly, as budding-yeast Mge1 does?
  experts: []
- question: >-
    Is fission-yeast mge1 a stable PAM-complex subunit under import conditions,
    or a soluble matrix cofactor that only transiently engages Ssc1 at the
    translocation pore?
  experts: []
suggested_experiments:
- hypothesis: >-
    mge1 nucleotide-exchange activity is required for repeated ssc1 cycling
    during fission-yeast matrix preprotein import.
  description: >-
    Purify S. pombe mge1 and ssc1 and measure ATP/ADP release from ssc1 with
    wild-type mge1 and GrpE-interface mutants, then test matching mge1 mutants
    in isolated-mitochondria import assays for saturating presequence reporter
    substrates.
  experiment_type: mitochondrial Hsp70 nucleotide-exchange and import reconstitution
