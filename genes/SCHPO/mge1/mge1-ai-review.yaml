- term:
    id: GO:0001405
    label: PAM complex, Tim23 associated import motor
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000478265
  - SGD:S000005758
  review:
    summary: >-
      The mitochondrial GrpE protein is a PAM import-motor cofactor.
    action: ACCEPT
    reason: >-
      Retain the PAM complex membership row as a functional motor-component
      annotation, not as evidence that Mge1 is a stable stoichiometric
      translocase subunit. Budding-yeast Mge1 is a named
      nucleotide-exchange subunit of the presequence translocase-associated
      motor even though it does not stably comigrate or copurify with the
      arrested TOM-TIM23 translocase. The S. pombe protein is a fungal GrpE
      ortholog, has no PAINT loss on the PTN000478265 import/PAM branch, and
      is annotated by UniProt as a PAM complex component by similarity; these
      fission-yeast-specific facts support the transfer for this descendant.
    supported_by:
    - reference_id: PMID:14638855
      supporting_text: >-
        Three essential subunits of the motor are known: mitochondrial Hsp70
        (mtHsp70); the peripheral membrane protein Tim44; and the nucleotide
        exchange factor Mge1.
    - reference_id: file:SCHPO/mge1/mge1-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: Component of the PAM complex
    - reference_id: file:interpro/panther/PTHR21237/PTHR21237-paint.tsv
      supporting_text: "PTHR21237\tPTN000478265\tGO:0001405\tC\tIBD\tfalse"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000478265
        source_label: eukaryotic mitochondrial GrpE PAM/import node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PTHR21237 review leaves full eukaryotic node breadth unresolved,
          but the PTN000478265 assertion is accepted for S. pombe mge1 because
          its fungal GrpE placement, clean PAINT loss check, and UniProt
          by-similarity PAM-component statement all agree with the
          characterized yeast Mge1 motor role.
