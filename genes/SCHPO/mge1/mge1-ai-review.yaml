core_functions:
- description: >-
    mge1 exchanges adenyl nucleotides on the mitochondrial matrix Hsp70 ssc1,
    driving mtHsp70 substrate-release cycles in the PAM motor during
    presequence-dependent import into the mitochondrial matrix.
  supported_by:
  - reference_id: PMID:9048947
    supporting_text: >-
      The release of both ATP and ADP from Ssc1 was stimulated in the presence
      of Mge1
  - reference_id: PMID:14638855
    supporting_text: >-
      Three essential subunits of the motor are known: mitochondrial Hsp70
      (mtHsp70); the peripheral membrane protein Tim44; and the nucleotide
      exchange factor Mge1.
