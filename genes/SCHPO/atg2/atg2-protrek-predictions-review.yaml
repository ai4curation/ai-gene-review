description: >-
  ProTrek sequence-to-text retrieval for Atg2, the bridge-like lipid transfer protein that feeds phospholipids
  from the ER to the growing phagophore. Ranks 1, 3, 4 and 5 are all correct - the phagophore assembly
  site, an annotated selective-autophagy process, lipid transfer activity and PI3P binding - covering
  this review's primary core function. Rank 2 is an obsolete term. This is one of the better ARGO139
  results, with the caveat that all four correct calls are already in GOA. Assessment: 3 correct not
  novel (CNN).
