description: 'BioReason-Pro RL web export for atg2 (SCHPO). GO-GPT produced 26 non-root terms; 8 non-generic IS_A leaf terms
  retained (MF:1 BP:5 CC:2). Current manual assessment: CNN:2 LSP:1 UNC:5 NPI:0. GO:0120013 lipid
  transfer activity is correct but less precise than existing lipid-transfer annotations. Remaining UNC entries
  require manual assessment. [ONTOLOGY_LABEL_AUDIT] The raw export contained 6 ID/label pairs that differ from current GO
  labels; structured leaf labels were normalized and the raw source was retained.'
references:
- id: doi:10.64898/2026.03.19.712954
  title: 'BioReason-Pro: Advancing Protein Function Prediction with Multimodal Biological Reasoning (Fallahpour et al. 2026)'
- id: file:SCHPO/atg2/atg2-hypotheses/prediction-lipid-transfer-activity/openscientist.md
  title: OpenScientist investigation of the atg2 lipid-transfer prediction
  findings:
  - statement: GO-GPT's lipid transfer activity prediction is supported but less precise than existing
      curated Atg2 annotations.
    supporting_text: The prediction that atg2 has lipid transfer activity is biologically correct
      and rests on unusually strong, organism-matched evidence.
source_documents:
- genes/SCHPO/atg2/atg2-bioreason-rl-predictions.md
- genes/SCHPO/atg2/atg2-hypotheses/prediction-lipid-transfer-activity/openscientist.md
predictions:
- source_method: GO-GPT
  source_version: bioreason.net/2026-03/rl
  source_reference_id: doi:10.64898/2026.03.19.712954
  predicted_term:
    id: GO:0120013
    label: lipid transfer activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      GO-GPT's lipid transfer activity prediction is biologically correct for S. pombe Atg2 but less
      precise than existing curated annotations. The focused OpenScientist investigation found that
      the S. pombe protein itself was used to establish direct phospholipid transfer activity and
      that GO:0120013 is a parent-level term relative to the existing lipid-species annotations,
      including GO:0140344 triglyceride transfer activity and GO:0120010 intermembrane phospholipid
      transfer. Assess as LSP rather than adding the generic parent term.
    supported_by:
    - reference_id: file:SCHPO/atg2/atg2-hypotheses/prediction-lipid-transfer-activity/openscientist.md
      supporting_text: GO:0120013 is a high-level *parent* term.
    - reference_id: file:SCHPO/atg2/atg2-hypotheses/prediction-lipid-transfer-activity/openscientist.md
      supporting_text: atg2 already curated with triglyceride transfer activity + intermembrane phospholipid
        transfer + membrane-adaptor activity
