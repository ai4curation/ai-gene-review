  label: Schizosaccharomyces pombe 972h-
description: Catalytic subunit of dolichol-phosphate-mannose (Dol-P-Man) synthase in fission yeast (EC 2.4.1.83). The soluble,
  236-residue GT2-family enzyme transfers mannose from cytosolic GDP-mannose to dolichyl phosphate on the cytoplasmic face
  of the endoplasmic reticulum, producing Dol-P-Man, the mannosyl donor for lumenal steps of N-glycan precursor assembly,
  GPI-anchor synthesis and protein O-mannosylation. Like the human enzyme and unlike S. cerevisiae Dpm1, it lacks a C-terminal
  transmembrane anchor and acts in a heterotrimeric complex with the small membrane subunits dpm2 and dpm3, which tether and
  stabilise it at the ER membrane. dpm1 is essential, and the null mutant is rescued by either the budding-yeast or the human
  Dol-P-Man synthase.
