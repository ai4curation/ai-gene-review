suggested_questions:
- question: Does S. pombe dpm1 require dpm2 and dpm3 for stability and activity in vivo as the human DPM1 does, given that
    budding-yeast Dpm1 (single-subunit, anchored) complements the dpm1 null without them?
suggested_experiments:
- description: Deplete dpm3 or dpm2 in S. pombe and measure dpm1 protein level, ER-membrane association and microsomal Dol-P-Man
    synthase activity.
