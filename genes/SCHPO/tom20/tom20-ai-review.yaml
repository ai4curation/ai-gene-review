proposed_new_terms: []
suggested_questions:
- question: >-
    Does S. pombe Tom20 participate in mitochondrial tRNA import, or is the
    current tRNA-import IBA an over-transfer from the specialized
    budding-yeast tRNA(Lys) import pathway?
  experts: []
suggested_experiments:
- hypothesis: >-
    S. pombe Tom20 has conserved presequence receptor activity and is separable
    from downstream Tom40 channel function.
  description: >-
    Reconstitute S. pombe Tom20, Tom22 and Tom40 in proteoliposomes and compare
    binding and translocation of radiolabeled presequence substrates with and
    without the Tom20 cytosolic domain.
  experiment_type: in vitro import assay
