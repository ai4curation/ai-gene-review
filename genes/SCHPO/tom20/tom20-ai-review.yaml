id: O14225
gene_symbol: tom20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  tom20 encodes a single-pass mitochondrial outer membrane receptor subunit of
  the TOM complex. Its cytosolic domain recognizes N-terminal mitochondrial
  targeting presequences on nuclear-encoded precursor proteins and helps hand
  those substrates to Tom22 and the Tom40 general import pore for import into
  the mitochondrial matrix, inner membrane, intermembrane space, or outer
  membrane.
