- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      Matsuyama et al. generated a high-throughput fission-yeast ORFeome/YFP
      localization resource that PomBase uses for the tom20 mitochondrial
      localization row.
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome, by tagging each ORF with
      the yellow fluorescent protein.
- id: PMID:9774667
  title: 'Preprotein translocase of the outer mitochondrial membrane: molecular
    dissection and assembly of the general import pore complex.'
  findings:
  - statement: >-
      Budding-yeast Tom20 is a TOM receptor that is more loosely associated with
      the Tom40/Tom22/small-Tom general import pore than Tom22 is.
    supporting_text: >-
      the other receptors, Tom20 and Tom70, are more loosely associated with this
      GIP complex and can be found in distinct subcomplexes.
- id: PMID:10519552
  title: Tom22 is a multifunctional organizer of the mitochondrial preprotein
    translocase.
  findings:
  - statement: >-
      Tom22 binds mitochondrial preproteins and couples the peripheral Tom20 and
      Tom70 receptors to the Tom40 channel.
    supporting_text: >-
      its cytosolic domain serves as docking point for the peripheral receptors
      Tom20 and Tom70.
- id: PMID:21173275
  title: Dual role of the receptor Tom20 in specificity and efficiency of protein
    import into mitochondria.
  findings:
  - statement: >-
      Tom20 recognizes mitochondrial presequences and tethers them to the TOM40
      complex during preprotein import.
    supporting_text: >-
      Therefore Tom20 has a dual role in protein import into mitochondria:
      recognition of the targeting signal in the presequence and tethering the
      presequence to the TOM40 complex to increase import efficiency.
