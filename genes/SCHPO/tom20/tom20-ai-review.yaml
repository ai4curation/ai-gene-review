core_functions:
- description: >-
    Tom20 is a cytosol-facing receptor of the mitochondrial outer membrane TOM
    complex that recognizes N-terminal mitochondrial targeting signals and helps
    deliver presequence-containing precursors to Tom22 and the Tom40 pore for
    import into the matrix and related TIM23 routes.
  supported_by:
  - reference_id: PMID:21173275
    supporting_text: >-
      Therefore Tom20 has a dual role in protein import into mitochondria:
      recognition of the targeting signal in the presequence and tethering the
      presequence to the TOM40 complex to increase import efficiency.
  - reference_id: PMID:10519552
    supporting_text: >-
      its cytosolic domain serves as docking point for the peripheral receptors
      Tom20 and Tom70.
