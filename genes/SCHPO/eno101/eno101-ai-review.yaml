  label: Schizosaccharomyces pombe 972h-
description: Eno101 (SPBC1815.01; UniProt synonym eno1, shared with its paralog eno102) is one of two
  enolases of the fission yeast Schizosaccharomyces pombe. The 439-residue protein belongs to the enolase
  family and, by similarity, is a Mg2+-dependent homodimer catalysing the reversible dehydration of 2-phosphoglycerate
  to phosphoenolpyruvate, the penultimate step of glycolysis. It localises to the cytosol, with some nuclear
  signal in genome-wide localisation. Its paralog eno102 (Q8NKC2) is about 66% identical and retains the
  full active site; the relative contributions of the two enzymes have not been characterised experimentally.
