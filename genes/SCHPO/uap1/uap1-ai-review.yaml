description: uap1 (qri1; SPBC1289.08; UniProt O94617) encodes UDP-N-acetylglucosamine pyrophosphorylase
  (EC 2.7.7.23). It joins N-acetylglucosamine 1-phosphate and UTP to make UDP-GlcNAc, the final step of
  the hexosamine pathway. UDP-GlcNAc is the donor for the first two sugars of the dolichol-linked N-glycan
  precursor, for GPI-anchor synthesis and for chitin. Function is assigned by orthology to S. cerevisiae
  QRI1; a genome-wide screen places it in the cytosol and nucleus.
