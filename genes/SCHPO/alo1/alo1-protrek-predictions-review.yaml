  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for alo1, the fungal D-arabinono-1,4-lactone oxidase that makes
  D-erythroascorbic acid. The model recovers the exact enzyme activity at rank 3 but leads with the
  vertebrate ascorbate pathway: rank 1 is L-ascorbic acid biosynthesis, ranks 2 and 4 are the plant
  and animal lactone oxidases. Fungi make the five-carbon analog D-erythroascorbate, not ascorbate,
  so the top call is a kingdom-level substitution. UniProt's own PANTHER family for this entry is
  L-GULONOLACTONE OXIDASE, the vertebrate enzyme, so the automatic annotation points the same way.
  Assessment: 1 correct not novel (CNN), 2 paralog incorrect (PLI).
