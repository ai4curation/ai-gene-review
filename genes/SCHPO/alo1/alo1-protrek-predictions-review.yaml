    summary: >-
      Top-ranked hit (score 18.22). L-ascorbic acid is the six-carbon vitamin C made by plants (via
      L-galactonolactone dehydrogenase) and by most vertebrates (via L-gulonolactone oxidase). Fungi
      including S. pombe make the five-carbon analog D-erythroascorbic acid instead, which is exactly
      what this review and the annotated process term describe. Right chemistry, wrong product, wrong
      kingdom.
