description: SFT predicts L-gulonolactone oxidase and L-ascorbic acid biosynthesis for
  alo1. The current gene review accepts only broad aldonolactone oxidoreductase
  activity because the exact native substrate is unresolved in S. pombe; L-gulonolactone
  oxidase is therefore UNC, while L-ascorbic acid biosynthesis remains PLI because
  PAINT explicitly prunes that plant/animal/bacterial process from the Dikarya branch.
  The mitochondrion prediction is CNN and correct.
