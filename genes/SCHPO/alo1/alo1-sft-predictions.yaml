    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Incorrect. GO:0019853 is L-ascorbic acid biosynthesis, not the fungal
      D-erythroascorbate process. Current PAINT places GO:0019853 at a mixed
      plant, animal and bacterial node and explicitly prunes it by IRD at
      PTN001015900, the Dikarya node that contains S. pombe alo1. The exact
      fungal D-erythroascorbate route is itself unresolved for S. pombe, but
      the L-ascorbic-acid prediction is still refuted by PAINT node placement.

