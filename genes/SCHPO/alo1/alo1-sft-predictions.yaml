    label: L-gulonolactone oxidase activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Uncertain. The current S. pombe review no longer accepts exact D-arabinono-1,4-lactone
      oxidase activity as the core molecular function: PomBase negates that exact
      substrate assignment and PAINT now propagates only a broad oxidoreductase activity
      to Q9HDX8. L-gulonolactone activity is not established for S. pombe either,
      but PTHR43762:SF1 contains multiple oxidoreductases with different substrates
      and budding-yeast ALO has relaxed aldonolactone specificity, so the
      L-gulonolactone prediction cannot be rejected as a clean wrong-paralog call
      until direct fission-yeast biochemistry is available.

