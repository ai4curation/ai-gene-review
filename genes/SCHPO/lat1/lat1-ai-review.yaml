description: lat1 (SPCC794.07; UniProt O59816) encodes the lipoylated E2 dihydrolipoyllysine-residue acetyltransferase
  (EC 2.3.1.12) that forms the core of the mitochondrial pyruvate dehydrogenase complex and transfers
  the acetyl group to CoA. Function is assigned by orthology to S. cerevisiae LAT1.
