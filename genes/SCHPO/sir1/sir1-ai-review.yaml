  label: Schizosaccharomyces pombe 972h-
description: >-
  sir1 (SPAC10F6.01c) encodes the beta (hemoprotein) subunit of the
  assimilatory NADPH-sulfite reductase of fission yeast (EC 1.8.1.2). It is the
  ortholog of Saccharomyces cerevisiae MET5 and is unrelated to the budding
  yeast silencing factor SIR1. With the flavoprotein alpha subunit met10 it is
  expected to form a cytosolic alpha2beta2 hemoflavoprotein that performs the
  six-electron reduction of sulfite to hydrogen sulfide using NADPH, the last
  reductive step of sulfate assimilation. The sulfide is then used to make
  homocysteine, methionine and cysteine. sir1 carries the catalytic
  siroheme-[4Fe-4S] centre in its C-terminal nitrite/sulfite reductase
  ferredoxin-like and 4Fe-4S domains, and a flavodoxin-like FMN-binding domain
  that in bacterial sulfite reductases sits on the flavoprotein subunit.
  Siroheme is supplied by the siroheme biosynthetic enzymes. sir1 is
  cytosolic.
