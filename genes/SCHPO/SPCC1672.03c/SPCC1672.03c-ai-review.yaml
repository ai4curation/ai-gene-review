  label: Schizosaccharomyces pombe 972h-
description: SPCC1672.03c (UniProt O14057; the fission yeast GUD1 ortholog) encodes guanine deaminase
  (EC 3.5.4.3), a zinc amidohydrolase that deaminates guanine to xanthine, routing guanine into xanthine
  oxidation (xan1) and urate catabolism. Function is assigned by orthology; a genome-wide screen places
  it in the cytosol.
