id: Q10252
gene_symbol: ppt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ppt1 (coq2) encodes the fission yeast 4-hydroxybenzoate polyprenyltransferase (EC 2.5.1.39),
  a UbiA-family multi-pass membrane enzyme of the mitochondrial inner membrane. It condenses 4-hydroxybenzoate
  with all-trans-decaprenyl diphosphate, forming the first membrane-bound intermediate of coenzyme Q10
  biosynthesis. ppt1 disruption abolishes CoQ10, causing antioxidant dependence on minimal medium, hydrogen
  peroxide and copper sensitivity and hydrogen sulfide overproduction; S. cerevisiae COQ2 and human COQ2
  complement the defect, and overexpression of ppt1 raises CoQ10 content.
