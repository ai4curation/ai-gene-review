- term:
    id: GO:0008299
    label: isoprenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000376176
  review:
    summary: Broad process; Ppt1 attaches the polyprenyl (isoprenoid) side chain to 4-hydroxybenzoate in CoQ synthesis.
    action: KEEP_AS_NON_CORE
    reason: Ppt1 condenses all-trans polyprenyl diphosphate with 4-hydroxybenzoate, forming the prenylated (isoprenoid-containing) first CoQ intermediate (UniProt function, ECO:0000269 PubMed:11092853 and HAMAP MF_03189). The term is defensible but peripheral and is not an ancestor of ubiquinone biosynthetic process (GO:0006744), which carries the core process, so it stays non-core rather than MODIFY.
    supported_by:
    - reference_id: file:SCHPO/ppt1/ppt1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the prenylation of para-hydroxybenzoate (PHB) with an all-trans polyprenyl group.
    - reference_id: file:SCHPO/ppt1/ppt1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Mediates the second step in the final reaction sequence of coenzyme Q (CoQ) biosynthesis, which is the condensation of the polyisoprenoid side chain with PHB, generating the first membrane-bound Q intermediate.
