  label: Schizosaccharomyces pombe 972h-
description: ppt1 (coq2; UniProt Q10252) encodes 4-hydroxybenzoate polyprenyltransferase (EC 2.5.1.39),
  the polytopic inner-membrane enzyme that attaches the decaprenyl chain to 4-hydroxybenzoate, the first
  committed step of the ubiquinone ring modifications. ppt1 disruption abolishes CoQ10 and is complemented
  by S. cerevisiae COQ2; overexpression raises CoQ10.
