  review:
    summary: IBA from the sterol C5-desaturase node PTN000221192 (human SC5D, rat Sc5d, C. albicans and S. cerevisiae
      ERG3). The inherited biology (Delta7-sterol C-5 desaturation) is correct for erg32, which with its paralog
      erg31 supplies the redundant C-5 desaturase of S. pombe. However GO:0000248 "C-5 sterol desaturase activity"
      has a text definition (5,7,24(28)-ergostatrienol + O2 + NADPH -> 5,7,22,24(28)-ergostatetraenol) that describes
      the C-22 desaturation catalysed by erg5 (cf. GO:0000249), not the C-5 reaction. GO:0050046 delta7-sterol 5(6)-desaturase
      activity (Rhea:54320, EC 1.14.19.20) matches the reaction UniProt assigns and is already annotated by IBA/IEA.
      Same decision as for S. cerevisiae ERG3.
    action: MODIFY
    reason: Intended activity is correct but the GO:0000248 definition describes the C-22 desaturase reaction; use
      the term whose definition matches the C-5 reaction.
