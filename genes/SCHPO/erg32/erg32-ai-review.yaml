suggested_questions:
- question: The text definition of GO:0000248 "C-5 sterol desaturase activity" describes the C-22 desaturation of
    5,7,24(28)-ergostatrienol (the erg5/GO:0000249 reaction). Should GO correct the definition or obsolete GO:0000248
    in favour of GO:0050046? PomBase's ergosterol GO-CAM (66c7d41500002088) types both erg31 and erg32 with GO:0000248.
- question: Do erg31 and erg32 differ in expression (e.g. Sre1/hypoxia induction), substrate preference or localisation,
    or are they fully redundant?
suggested_experiments:
- hypothesis: erg31 and erg32 encode redundant cytochrome b5-dependent Delta7-sterol C-5 desaturases.
  description: Sterol GC-MS of single and double deletants for episterol accumulation, and complementation of S.
    cerevisiae erg3 by each S. pombe gene.
  experiment_type: genetics / sterol profiling
