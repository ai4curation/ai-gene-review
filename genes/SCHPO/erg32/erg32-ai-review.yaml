taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'erg32 (SPBC27B12.03c; ORF name pi075) encodes one of two Delta7-sterol C-5 desaturases of Schizosaccharomyces
  pombe, a non-heme di-iron enzyme of the sterol desaturase family with histidine boxes and several transmembrane
  segments, homologous to budding-yeast Erg3 and animal SC5D. Using O2 and electrons from cytochrome b5 it introduces
  the C5=C6 double bond into episterol to form 5-dehydroepisterol. It localises to the ER membrane, with an additional
  Golgi signal in a genome-wide localisation screen. erg32 and its paralog erg31 are functionally redundant: either
  single deletion still allows ergosterol synthesis, whereas the double deletion abolishes it.'
