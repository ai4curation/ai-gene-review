  label: Schizosaccharomyces pombe 972h-
description: rib2 (SPCC4G3.16; UniProt P87241) encodes a bifunctional protein. Its C-terminal CMP/dCMP-type
  deaminase domain deaminates 2,5-diamino-6-ribitylamino-pyrimidinone 5'-phosphate in riboflavin biosynthesis
  (EC 3.5.4.26), the step after the RIB7-type reduction. Its N-terminal domain is a SAM-dependent protein-lysine
  N-methyltransferase by similarity, with no known substrate. The domain arrangement differs from S. cerevisiae
  Rib2, which pairs the deaminase with a pseudouridine synthase. The protein is cytosolic in a genome-wide
  screen.
