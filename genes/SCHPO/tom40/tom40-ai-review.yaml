proposed_new_terms: []
suggested_questions:
- question: >-
    Which S. pombe Tom40 surfaces mediate transfer of beta-barrel precursors to
    the SAM machinery versus transfer of carrier precursors to the TIM22
    pathway?
  experts: []
suggested_experiments:
- hypothesis: >-
    The conserved S. pombe Tom40 beta-barrel pore is required for matrix,
    TIM22-carrier, and beta-barrel outer-membrane precursor import.
  description: >-
    Deplete or temperature-inactivate Tom40 and compare import kinetics for a
    cleavable matrix reporter, a carrier inner-membrane reporter, and an
    outer-membrane beta-barrel reporter in isolated mitochondria.
  experiment_type: conditional import-pathway profiling
