- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      Matsuyama et al. generated a high-throughput fission-yeast ORFeome/YFP
      localization resource that PomBase uses for the tom40 mitochondrial
      localization row.
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome, by tagging each ORF with
      the yellow fluorescent protein.
- id: PMID:9774667
  title: 'Preprotein translocase of the outer mitochondrial membrane: molecular
    dissection and assembly of the general import pore complex.'
  findings:
  - statement: >-
      Budding-yeast Tom40 is the main general import pore component and forms
      the TOM core with Tom22 and small Tom subunits.
    supporting_text: >-
      The GIP complex, containing Tom40, Tom22, and three small Tom proteins,
      forms the central unit of the outer membrane import machinery.
- id: PMID:10519552
  title: Tom22 is a multifunctional organizer of the mitochondrial preprotein
    translocase.
  findings:
  - statement: >-
      Tom40 is the TOM channel protein stably associated with the Tom22 receptor.
    supporting_text: >-
      The central receptor Tom22 binds preproteins through both its cytosolic
      domain and its intermembrane space domain and is stably associated with
      the channel protein Tom40
