id: O13656
gene_symbol: tom40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  tom40 encodes the conserved beta-barrel pore of the mitochondrial outer
  membrane TOM complex. As the channel-forming subunit of the general import
  pore, Tom40 provides the passage through which nuclear-encoded mitochondrial
  precursor proteins cross the outer membrane before their handoff to matrix,
  inner-membrane, intermembrane-space, or outer-membrane sorting routes.
