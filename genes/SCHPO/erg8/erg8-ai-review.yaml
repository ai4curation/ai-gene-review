description: erg8 (SPAC343.01c; UniProt Q9UT88) encodes the fungal-type phosphomevalonate kinase (EC 2.7.4.2).
  It phosphorylates 5-phosphomevalonate to 5-diphosphomevalonate, the second ATP-dependent step of the
  mevalonate pathway to isopentenyl diphosphate. Function is assigned by orthology to S. cerevisiae ERG8;
  a genome-wide screen detected it mainly in the cytosol.
