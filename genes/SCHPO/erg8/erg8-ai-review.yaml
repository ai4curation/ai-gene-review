id: Q9UT88
gene_symbol: erg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  erg8 (SPAC343.01c) encodes the fission-yeast GHMP-family phosphomevalonate kinase. The enzyme
  phosphorylates (R)-mevalonate 5-phosphate with ATP to form (R)-mevalonate 5-diphosphate, the
  second of three mevalonate-pathway reactions that produce isopentenyl diphosphate and feed fungal
  sterol biosynthesis. The protein is cytosolic by PomBase curation from the genome-wide
  S. pombe ORFeome localization screen, and the same screen also reported nuclear and mitochondrial
  signal for the tagged protein.
