  review:
    summary: >-
      The PomBase IC row is acceptable as a CYC2-like process inference, but it
      should not be expanded into a cytochrome-b5 reductase molecular-function
      annotation.
    action: ACCEPT
    reason: >-
      The orthologous S. cerevisiae Cyc2p is an FAD-bound mitochondrial
      flavoprotein genetically and biochemically connected to the redox
      chemistry of c-type cytochrome maturation. That supports a conservative
      process annotation for the predicted fission Cyc2-like protein, but the
      specific electron acceptor of SPAC17H9.12c remains unknown.
    supported_by:
