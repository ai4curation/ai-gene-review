    summary: >-
      The budding-yeast CYC2 topology transfer conflicts with the target
      protein's mitochondrial outer-membrane annotation.
    action: REMOVE
    reason: >-
      SGD:S000005563 is budding-yeast CYC2, whose FAD domain is exposed to the
