  label: Schizosaccharomyces pombe 972h-
description: >-
  Schizosaccharomyces pombe SPAC17H9.12c encodes a predicted mitochondrial
  FAD-binding oxidoreductase in the flavoprotein pyridine nucleotide cytochrome
  reductase family. It is a single-pass membrane protein with an N-terminal
  transmembrane helix and a C-terminal FAD-binding FR-type domain, is in the
  PANTHER NADH-cytochrome b5 reductase family, and is inferred to act as a
  CYC2-like mitochondrial redox factor for cytochrome c heme attachment rather
  than as a CBR1-like Dph3 or sterol reductase.
core_functions:
- description: >-
    Predicted mitochondrial FAD-dependent oxidoreductase activity in a
    CYC2-like cytochrome c biogenesis pathway.
