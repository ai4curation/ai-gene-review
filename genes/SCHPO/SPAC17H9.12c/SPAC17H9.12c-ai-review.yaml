suggested_questions:
- question: >-
    What is the physiological redox partner for the predicted S. pombe
    Cyc2-like oxidoreductase SPAC17H9.12c?
- question: >-
    Does the single N-terminal transmembrane helix anchor SPAC17H9.12c in the
    mitochondrial outer membrane, or does the protein have a CYC2-like
    inner-membrane/intermembrane-space topology?
suggested_experiments:
- description: >-
    Endogenously tag SPAC17H9.12c and combine submitochondrial fractionation,
    protease protection, and colocalization with outer- and inner-membrane
    markers to resolve its membrane topology and FAD-domain orientation.
