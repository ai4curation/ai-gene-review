taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPBC2G5.05 (SPBC2G5.05; UniProt Q9URM2) encodes a thiamine-diphosphate-dependent transketolase
  (EC 2.2.1.1), which transfers two-carbon units between sugar phosphates in two reactions of the non-oxidative
  PPP. By orthology it works in the non-oxidative pentose phosphate pathway, which interconverts pentose
  phosphates and glycolytic intermediates. Its activity is induced by delta-gluconolactone and repressed
  by glucose. It is cytosolic in a genome-wide screen.
