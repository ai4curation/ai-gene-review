- id: PMID:18535244
  title: Fission yeast Pot1-Tpp1 protects telomeres and regulates telomere length.
  findings:
  - statement: Identifies Tpz1 as the fission yeast TPP1 homolog that complexes with Pot1 and recruits Ccq1 and Poz1 to protect telomeres and regulate telomerase.
    supporting_text: Here we report that Tpz1, the TPP1 homolog in fission yeast, forms a complex with Pot1. Tpz1 binds to Ccq1 and the previously undiscovered protein Poz1
  full_text_unavailable: true
- id: PMID:22101932
  title: Tel1ATM and Rad3ATR kinases promote Ccq1-Est1 interaction to maintain telomeres in fission yeast.
  findings: []
- id: PMID:24013504
  title: Tpz1 controls a telomerase-nonextendible telomeric state and coordinates switching to an extendible state via Ccq1.
  findings:
  - statement: Complete Taz1-Rap1-Poz1-Tpz1-Pot1 shelterin linkage mediated by Tpz1 establishes the telomerase-nonextendible state and negatively regulates telomere elongation.
    supporting_text: Here, we show that, in fission yeast, Tpz1 (the ortholog of human TPP1)-mediated complete linkage within the shelterin complex, bridging telomeric dsDNA to ssDNA, controls the telomerase-nonextendible state.
- id: PMID:24925530
  title: Tpz1TPP1 SUMOylation reveals evolutionary conservation of SUMO-dependent Stn1 telomere association.
  findings:
  - statement: SUMOylation of Tpz1 restricts telomere elongation by promoting telomere recruitment of the Stn1/Ten1 terminator complex.
    supporting_text: Tpz1 SUMOylation restricts telomere elongation and promotes Stn1/Ten1 telomere association, and a SUMO-Tpz1 fusion protein has increased affinity for Stn1.
- id: PMID:25131669
  title: Telomerase activation after recruitment in fission yeast.
  findings:
  - statement: Tpz1 OB-fold residues Lys75 and Thr78 activate telomerase repeat synthesis after telomere recruitment.
    supporting_text: identify lysine 75 (K75) and threonine 78 (T78) as the key residues required for telomere lengthening
- id: PMID:25330395
  title: Tpz1-Ccq1 and Tpz1-Poz1 interactions within fission yeast shelterin modulate Ccq1 Thr93 phosphorylation and telomerase recruitment.
  findings: []
- id: PMID:27253066
  title: Multi-step coordination of telomerase recruitment in fission yeast through two coupled telomere-telomerase interfaces.
