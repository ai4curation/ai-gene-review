id: O14246
gene_symbol: tpz1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Core structural adaptor and telomerase-regulating subunit of the Schizosaccharomyces pombe telomeric shelterin complex (Pot1-Tpz1-Poz1-Ccq1-Rap1-Taz1). Tpz1 contains an N-terminal oligonucleotide/oligosaccharide-binding (OB) fold homologous to vertebrate ACD/TPP1 that forms a stable heterodimer with the single-stranded G-overhang-binding protein Pot1, while distinct C-terminal motifs bind Ccq1 (residues 421-485) and Poz1 (residues 475-508) to complete the physical bridge to duplex-telomere-bound Taz1-Rap1. Tpz1 does not bind telomeric repeat DNA directly; instead, it protects chromosome 3' overhangs from degradation and end fusions by stabilizing Pot1 on telomeric ssDNA, recruits and activates the telomerase catalytic subunit Trt1 via a co-evolved OB-fold TEL-patch surface (including Lys75, Arg76, Ile77, Thr78, and Arg81) in coordination with Rad3/Tel1-phosphorylated Ccq1-Est1, and restricts over-elongation in cis through complete Taz1-Rap1-Poz1-Tpz1-Pot1 shelterin linkage and Lys242 SUMOylation-dependent recruitment of the Stn1-Ten1 complex.
