  label: Schizosaccharomyces pombe 972h-
description: Pro3 (SPAPYUG7.05) is the cytosolic pyrroline-5-carboxylate reductase of Schizosaccharomyces
  pombe, assigned from conserved enzyme architecture and phylogenetic evidence. It reduces P5C to L-proline
  in the final step of proline biosynthesis; NADH/NADPH usage is a curated comparative assignment. Native
  isotope tracing shows an arginase/ornithine-transaminase-dependent route from supplied arginine into
  proline, consistent with P5C reduction by Pro3, although the individual Pro3 reaction was not isolated
  in those experiments.
