  label: Schizosaccharomyces pombe 972h-
description: pro3 (SPAPYUG7.05) encodes the pyrroline-5-carboxylate reductase (P5CR, EC 1.5.1.2) of fission
  yeast, the ortholog of S. cerevisiae PRO3. It reduces 1-pyrroline-5-carboxylate (P5C) to L-proline using
  NADPH or NADH, the last step of proline biosynthesis from glutamate (after glutamate 5-kinase pro2 and
  gamma-glutamyl-phosphate reductase pro1). Because it is the only P5C reductase, it also reduces the
  P5C formed from arginine by the arginase/ornithine aminotransferase route, through which labelled arginine
  enters essentially all cellular proline. The protein is cytosolic. Its function is inferred from sequence
  and orthology; it has not been characterised biochemically in S. pombe.
