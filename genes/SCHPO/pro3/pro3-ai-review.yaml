suggested_questions:
- question: Is pro3 required for proline prototrophy in S. pombe, and does pro3 loss block the arginine-to-proline
    flux seen in SILAC experiments?
suggested_experiments:
- description: Assay P5C reductase activity (NADH and NADPH) in extracts of wild-type and pro3 deletion
    strains and test proline auxotrophy of the deletion.
