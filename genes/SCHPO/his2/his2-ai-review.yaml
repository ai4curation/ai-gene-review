  label: Schizosaccharomyces pombe 972h-
description: his2 (SPBC1711.13; UniProt Q9P777) encodes histidinol dehydrogenase (HisD; EC 1.1.1.23),
  a zinc-dependent enzyme that carries out the two NAD+-dependent oxidations of L-histidinol, through
  L-histidinal, to L-histidine. This is the last step of histidine biosynthesis. In S. cerevisiae the
  activity is the C-terminal domain of trifunctional HIS4; in S. pombe it is a separate protein, with
  the HisIE activities in his7. his2 mutants are histidine auxotrophs used as genetic markers. It is cytosolic
  in a genome-wide screen.
