  label: Schizosaccharomyces pombe 972h-
description: thi20 (SPBP8B7.17c) encodes one of three fission yeast members of the HMP/HMP-P kinase
  (ThiD) family, with thi201 and SPCC18B5.05c. Like S. cerevisiae Thi20/Thi21 it is a two-domain
  protein, with an N-terminal ribokinase-fold hydroxymethylpyrimidine (HMP) / HMP-phosphate kinase
  domain and a C-terminal TenA/thiaminase-II-like domain. By homology it phosphorylates HMP to HMP-P
  and HMP-P to HMP-PP, the activated pyrimidine that thiamine-phosphate synthase (Thi4) couples to
  the thiazole. Its activity has not been measured in S. pombe. It is cytoplasmic, with some nuclear
  signal. Large-scale deletion screens report it as essential, which is unexpected for a
  thiamine-synthesis kinase with two paralogues and is not yet explained.
