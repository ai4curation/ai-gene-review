suggested_questions:
- question: Why is thi20 reported as essential in S. pombe deletion collections when thiamine is present
    in rich medium and two paralogues (thi201, SPCC18B5.05c) exist; does Thi20 have a non-thiamine
    function, for example via its TenA-like C-terminal domain?
- question: Which of the three S. pombe HMP/HMP-P kinase paralogues carries the bulk of HMP-P kinase
    activity in thiamine-free medium?
suggested_experiments:
- description: Re-test thi20 deletion viability by tetrad dissection on media with and without thiamine
    and HMP, and assay recombinant Thi20, Thi201 and SPCC18B5.05c for HMP and HMP-P kinase activity and
    for thiaminase II activity.
