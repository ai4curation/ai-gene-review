  label: Schizosaccharomyces pombe 972h-
description: dfr1 (SPCC1223.08c; UniProt P36591) encodes dihydrofolate reductase (EC 1.5.1.3) fused at
  its N-terminus to an FSH1-like alpha/beta serine hydrolase domain. The DHFR domain reduces dihydrofolate
  to tetrahydrofolate with NADPH, completing de novo THF synthesis and regenerating THF after thymidylate
  synthesis. The cDNA confers trimethoprim resistance in E. coli and methotrexate resistance in yeasts.
  The fused FSH-like domain may have lysophospholipase activity, by analogy with S. cerevisiae Fsh1, but
  this is untested. The protein is cytosolic in a genome-wide screen.
