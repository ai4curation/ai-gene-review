taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: hem15 (SPCC320.09; UniProt O59786) encodes ferrochelatase (protoporphyrin ferrochelatase;
  EC 4.98.1.1), the terminal enzyme of heme biosynthesis. It sits on the inner mitochondrial membrane
  with its active site facing the matrix and inserts ferrous iron into protoporphyrin IX to form protoheme
  (heme b). Unlike S. cerevisiae Hem15, but like animal ferrochelatases, the S. pombe enzyme has four
  C-terminal cysteines that ligate a [2Fe-2S] cluster, which has been detected spectroscopically.
