suggested_questions:
- question: Is S. pombe pmi40 essential and is the null rescued by exogenous mannose, as for S. cerevisiae pmi40?
- question: Can S. pombe use mannose as a carbon source through hxk1/hxk2 and pmi40 (catabolic direction), as S. cerevisiae
    does?
suggested_experiments:
- description: Delete pmi40 in S. pombe and test growth with and without D-mannose; assay PMI activity in extracts.
