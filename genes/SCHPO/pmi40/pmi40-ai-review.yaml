  label: Schizosaccharomyces pombe 972h-
description: Mannose-6-phosphate isomerase (phosphomannose isomerase, EC 5.3.1.8) of fission yeast, a zinc-dependent cytosolic
  enzyme of the type I PMI family that reversibly interconverts D-fructose 6-phosphate and D-mannose 6-phosphate. In the biosynthetic
  direction it supplies mannose 6-phosphate, the precursor of GDP-mannose and hence of dolichyl-phosphate-mannose and all
  mannosylation reactions; in the reverse direction it can route mannose 6-phosphate from hexokinase into glycolysis. Its
  function is inferred from the type I PMI family and from S. cerevisiae PMI40; it has not been characterised biochemically
  in S. pombe.
