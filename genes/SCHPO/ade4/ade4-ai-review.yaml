description: ade4 (SPAC4D7.08c) encodes the 533-residue glutamine phosphoribosylpyrophosphate amidotransferase
  (amidophosphoribosyltransferase, EC 2.4.2.14) of fission yeast, the first and committed enzyme of de
  novo purine nucleotide synthesis. An N-terminal Ntn-type glutamine amidotransferase domain releases
  ammonia from glutamine, which the C-terminal phosphoribosyltransferase domain transfers to PRPP to form
  5-phospho-beta-D-ribosylamine; Mg(2+) is bound as cofactor. The enzyme is homologous to the S. cerevisiae
  Ade4, bacterial PurF and vertebrate PPAT enzymes; its stability and kinetic properties vary with growth
  phase and conditions. Unlike budding-yeast ADE4, ade4 mRNA is not repressed by adenine. The protein
  is cytoplasmic.
