suggested_questions:
- question: Given that adenine does not repress ade4 transcription in S. pombe, is flux through the committed
    step controlled mainly by purine nucleotide feedback inhibition and protein stability, as the growth-phase
    dependent kinetics suggest?
suggested_experiments:
- description: Measure feedback inhibition of purified S. pombe ade4 by AMP/ADP/GMP and test whether ade4
    forms cytoplasmic foci under purine limitation, as budding-yeast Ade4 does.
