  - InterPro:IPR006148
  review:
    summary: Broad grouping term; true, but less informative than the oxidative pentose-phosphate
      shunt term accepted in this review.
    action: KEEP_AS_NON_CORE
    reason: "The enzyme hydrolyses the sugar lactone 6-phosphogluconolactone in the oxidative pentose phosphate pathway, which UniProt files under carbohydrate degradation; this rests on 6-phosphogluconolactonase family membership (IPR005900) and a by-similarity function (ECO:0000250). Kept as non-core rather than TOO_GENERAL because in GO the accepted pentose-phosphate shunt, oxidative branch (GO:0009051) is not a descendant of carbohydrate metabolic process (checked with oaklib: its is_a/part_of closure reaches glucose 6-phosphate metabolic process and carbohydrate derivative metabolic process, not GO:0005975), so no specific term in this review entails it."
    supported_by:
    - reference_id: file:SCHPO/SPCC16C4.10/SPCC16C4.10-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: "Carbohydrate degradation; pentose phosphate pathway; D-
        ribulose 5-phosphate from D-glucose 6-phosphate (oxidative stage): step
        2/3."
