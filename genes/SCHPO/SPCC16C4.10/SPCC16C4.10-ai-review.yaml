taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPCC16C4.10 (UniProt O74455) encodes 6-phosphogluconolactonase (EC 3.1.1.31), which hydrolyses
  6-phosphoglucono-delta-lactone to 6-phosphogluconate, the second step of the oxidative pentose phosphate
  pathway. Like the other PPP enzymes, it is induced by delta-gluconolactone and repressed by glucose.
  It is cytosolic in a genome-wide screen.
