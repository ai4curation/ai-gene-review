taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: thi4 (SPAC23H4.10c) encodes the bifunctional thiamine biosynthetic enzyme of fission yeast, the orthologue
  of S. cerevisiae THI6 (not of budding-yeast THI4, whose thiazole synthase role is filled by S. pombe thi2/nmt2).
  Its N-terminal thiamine-phosphate synthase (TMP pyrophosphorylase, EC 2.5.1.3) domain condenses the thiazole phosphate
  with 4-amino-2-methyl-5-diphosphomethylpyrimidine (HMP-PP) to form thiamine monophosphate, joining the two branches
  of de novo thiamine synthesis, and its C-terminal hydroxyethylthiazole kinase (EC 2.7.1.50) domain phosphorylates
  free 4-methyl-5-(2-hydroxyethyl)thiazole for salvage. thi4 mutants are thiamine auxotrophs, and thi4 mRNA is strongly
  repressed by thiamine under control of the thi1 activator and the tnr negative regulators. The protein is cytosolic.
  The enzymatic activities are inferred from the budding-yeast orthologue and domain composition rather than measured
  for the S. pombe protein.
