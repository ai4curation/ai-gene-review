suggested_questions:
- question: Does the S. pombe thi4 TMP synthase domain, like THI6/TenI-type enzymes, accept the carboxythiazole
    phosphate (from the thi2 ADP-thiazole product) and decarboxylate it during coupling, and which enzyme removes
    AMP from ADP-thiazole in fission yeast?
suggested_experiments:
- description: Express and purify S. pombe thi4 and assay TMP synthase activity with carboxythiazole phosphate versus
    thiazole phosphate and HMP-PP, and hydroxyethylthiazole kinase activity, to confirm both orthology-inferred
    activities directly.
