description: Putative glutamate-cysteine ligase regulatory (modifier) subunit of fission yeast, the GCLM-like
  protein of the aldo-keto reductase-fold GCL light chain subfamily. It is predicted to bind the catalytic
  subunit gcs1 and modulate its activity in the first step of glutathione synthesis, as GCLM does for
  GCLC. Budding yeast has no ortholog. In S. pombe these activities rest on homology; binding to gcs1
  and modulation of its kinetics have not been shown directly. The protein is cytosolic.
