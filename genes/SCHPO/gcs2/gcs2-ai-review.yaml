suggested_questions:
- question: Does S. pombe gcs2 physically associate with gcs1 and alter its kinetic parameters, as mammalian
    GCLM does for GCLC?
suggested_experiments:
- hypothesis: gcs2 increases gcs1 catalytic efficiency and GSH feedback resistance.
  description: Measure GSH levels and gcs1 kinetics in gcs2 deletion versus wild type extracts, and test
    co-immunoprecipitation of tagged gcs1 and gcs2.
