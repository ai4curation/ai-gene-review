  label: Schizosaccharomyces pombe 972h-
description: SPAC1B3.01c (UniProt O13867; the fission yeast FUR1 ortholog) encodes uracil phosphoribosyltransferase
  (EC 2.4.2.9), which converts uracil and PRPP to UMP, the main route of uracil salvage. By orthology
  to S. cerevisiae FUR1, it is the enzyme that makes 5-fluorouracil toxic. Function is assigned by orthology;
  it is cytosolic in a genome-wide screen.
