  label: Schizosaccharomyces pombe 972h-
description: SPBC12C2.11 (UniProt Q09740; the fission yeast gfa1 ortholog) encodes glutamine:fructose-6-phosphate
  amidotransferase (GFAT; EC 2.6.1.16), the first and rate-limiting enzyme of the hexosamine pathway.
  Its N-terminal glutaminase domain releases ammonia from glutamine, and the C-terminal SIS isomerase
  domain uses it to convert fructose 6-phosphate to glucosamine 6-phosphate. The pathway goes on through
  gna1, the phosphoacetylglucosamine mutases (SPAC13C5.05c, SPAC1296.01c) and uap1 to UDP-GlcNAc, the
  donor for N-glycan and GPI-anchor synthesis and for spore-wall chitin. Function is assigned by orthology;
  a genome-wide screen places it in the cytosol.
