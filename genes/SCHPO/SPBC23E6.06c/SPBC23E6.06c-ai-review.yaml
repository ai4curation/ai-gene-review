  review:
    summary: PAINT inference of a mitochondrial intermembrane-space pool, inherited from S. cerevisiae Rib3; peripheral to the riboflavin biosynthesis function.
    action: KEEP_AS_NON_CORE
    reason: "The IBA places SPBC23E6.06c inside the DHBP synthase clade whose characterised member S. cerevisiae Rib3 (the PAINT source) has an intermembrane-space pool, and nothing specific to the S. pombe protein argues for loss of it. The ORFeome screen (PMID:16823372) records cytosol and nucleus, which does not exclude a minor intermembrane-space pool. The UniProt record has no SUBCELLULAR LOCATION comment or transit peptide, so the support is family membership only, and the location is kept as non-core."
