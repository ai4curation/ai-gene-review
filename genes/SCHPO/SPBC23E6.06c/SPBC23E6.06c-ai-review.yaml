  label: Schizosaccharomyces pombe 972h-
description: SPBC23E6.06c (UniProt O60181; the fission yeast RIB3 ortholog) encodes 3,4-dihydroxy-2-butanone
  4-phosphate synthase (EC 4.1.99.12), which converts ribulose 5-phosphate to 3,4-dihydroxy-2-butanone
  4-phosphate. This four-carbon unit is condensed with the pyrimidine precursor by lumazine synthase (rib4).
  Function is assigned by orthology; it is cytosolic in a genome-wide screen.
