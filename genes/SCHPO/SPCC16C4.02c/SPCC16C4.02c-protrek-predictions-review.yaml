  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a conserved-unknown S. pombe protein, the neurochondrin ortholog
  asi1/ceo6, whose GOA explicitly records molecular_function and biological_process as ND (no data).
  All five ProTrek calls are cellular components clustered around the spindle pole body, and rank
  4 is an exact match to the HDA-supported mitotic spindle pole body annotation. For a protein whose
  function is formally unknown, returning a plausible localisation rather than an invented activity
  is the right behaviour - and it is not what the model did for the comparable unknowns in the other
  cohort. Assessment: 1 correct not novel (CNN), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
