  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 14.61) and absent from GOA. The meiotic spindle pole body is a real S.
      pombe structure and the protein is HDA-localised to the mitotic SPB, so a meiotic SPB role is
      a coherent extension; its curated interactors include the SPB component Sfi1 and the cortical
      dynein anchor Num1/Mcp5. But no meiotic evidence exists for this gene and the free-text channel's
      'Has a role in meiosis' hits are generic. A reasonable lead; left uncertain.
