    summary: >-
      Rank 2 (score 14.52). The DNA recombinase auxiliary factor complex covers Rad51/Rad52-associated
      mediators; this protein has an ARM-repeat/neurochondrin architecture with no recombination link,
      and this review explicitly identifies and rejects a deep-research artefact that confused it
      with the distinct ORF SPCC16C4.20c in an Ino80 chromatin-remodelling paper. Asserting a DNA-repair
      complex for it repeats that confusion from a different direction.
