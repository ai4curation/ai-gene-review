    label: GTPase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000177161
  - PANTHER:PTN000195056
  - SGD:S000006139
  - UniProtKB:Q9NR31
  - UniProtKB:Q9Y6B6
  review:
    summary: >-
      Sar1 is the conserved COPII small GTPase, and GTP hydrolysis drives Sar1
      release from the COPII membrane during coat turnover.
    action: ACCEPT
    reason: >-
      Accept. The SAR1 PAINT node is consistent with the S. pombe functional
      homolog cloned by complementation and with conserved budding-yeast COPII
      mechanism: Sec23 stimulates Sar1 GTP hydrolysis, Sec31 enhances that GAP
      activity, and Sar1 hydrolysis promotes Sar1 dissociation from COPII
      membranes during coat turnover. No PAINT IRD or IKR loss was found on the
      S. pombe sar1 lineage.
    additional_reference_ids:
    - PMID:1396601
    supported_by:
    - reference_id: PMID:27432890
      supporting_text: GTP hydrolysis by Sar1 in turn causes its dissociation from the membrane
      reference_section_type: INTRODUCTION
    - reference_id: PMID:1396601
      supporting_text: >-
        two of which encode the S. pombe and A. thaliana homologues of Sar1p
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000195056
        source_status: SUPPORTS_TRANSFER
        comment: >-
          SAR1-family PAINT placement of small-GTPase activity; S. pombe sar1 is
          a cloned SAR1 functional homolog and remains in PTHR45684.
