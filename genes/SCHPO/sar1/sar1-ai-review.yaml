core_functions:
- description: >-
    Sar1 is the COPII small-GTPase switch that cycles between GTP- and
    GDP-bound states to recruit the Sec23/Sec24 inner coat to ER exit sites,
    initiate COPII-coated vesicle budding, and release from COPII membranes
    after Sec23/Sec31-stimulated GTP hydrolysis so that ER-to-Golgi carriers can
    uncoat and progress to tethering and fusion.
