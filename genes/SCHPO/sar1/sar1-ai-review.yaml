id: Q01475
gene_symbol: sar1
product_type: PROTEIN
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
status: COMPLETE
description: >-
  sar1 encodes the fission-yeast Sar1-family small GTPase that initiates and
  helps turn over the COPII coat during ER export. Sar1 is activated at the
  cytosolic face of ER exit sites by the Sec12-like exchange factor Spo14,
  recruits the Sec23/Sec24 inner-coat complex in its GTP-bound state, and
  hydrolyzes GTP to release COPII coat components during ER-to-Golgi transport
  vesicle uncoating.
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: >-
      Sar1 is peripherally associated with ER and COPII vesicle membranes, but
      the Golgi-membrane transfer is a weak by-similarity cycling-location call.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mark as over-annotated. UniProt maps Sar1 to ER, COPII-vesicle and Golgi
      membranes by similarity. The core mechanism instead places active Sar1 on
      the ER/ERES and on nascent COPII membranes, and Sar1 GTP hydrolysis must
      remove Sar1-GTP before the COPII coat productively engages Golgi tethering
      machinery. A transient Golgi-proximal population may exist, but this
      electronic row overstates it as an ordinary Sar1 site.
    supported_by:
    - reference_id: PMID:27432890
      supporting_text: >-
        Sar1-GTP, which prevents the Sec23-TRAPPI interaction, must be removed
        from the COPII cage before coming into contact with the Golgi membrane.
      reference_section_type: DISCUSSION
    - reference_id: file:genes/SCHPO/sar1/sar1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Golgi apparatus membrane {ECO:0000250}
      reference_section_type: DATABASE_ENTRY
- term:
