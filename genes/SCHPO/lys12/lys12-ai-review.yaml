  label: Schizosaccharomyces pombe 972h-
description: lys12 (SPAC31G5.04; UniProt O14104) encodes homoisocitrate dehydrogenase (EC 1.1.1.87), an
  NAD+- and Mg2+-dependent member of the isocitrate dehydrogenase family. It oxidatively decarboxylates
  homoisocitrate to 2-oxoadipate, the last mitochondrial step of the alpha-aminoadipate pathway. Function
  and mitochondrial location are assigned by orthology to S. cerevisiae LYS12; deletion causes lysine
  auxotrophy. The ORFeome screen recorded cytoplasmic signal for a tagged construct.
