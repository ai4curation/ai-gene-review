suggested_questions:
- question: Why is AIR synthetase activity of ade1 found only in the multimeric enzyme while GAR synthetase
    is active as a monomer, and does the oligomeric state regulate flux between steps 2 and 5?
suggested_experiments:
- description: Determine the oligomeric structure of recombinant ade1 and test whether AIR synthetase
    activity depends on multimerisation of the C-terminal PurM-like region.
