taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ade1 (SPBC405.01) encodes the bifunctional purine biosynthetic protein of fission yeast,
  the ortholog of S. cerevisiae ADE5,7. Its N-terminal ATP-grasp GAR synthetase region (phosphoribosylamine--glycine
  ligase, EC 6.3.4.13) catalyses the second step of de novo purine synthesis, and its C-terminal AIR synthetase
  region (phosphoribosylformylglycinamidine cyclo-ligase, EC 6.3.3.1) catalyses the fifth step, the ATP-dependent
  ring closure of FGAM to 5-aminoimidazole ribonucleotide. Classical genetics and enzymology showed that
  the two activities co-purify, reside in separate regions that can be mutated independently (ade1A and
  ade1B complementation groups), and that the enzyme forms a multimer of ~40 kDa subunits in which AIR
  synthetase activity requires the multimeric form. The protein is cytosolic and ade1 mutants require
  adenine.
