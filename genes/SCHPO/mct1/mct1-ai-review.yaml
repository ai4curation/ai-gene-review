  review:
    summary: Generic InterPro-derived parent of the specific activity, which is already annotated.
    action: MODIFY
    reason: 'Too general. By family membership (FabD family; Pfam Acyl_transf_1; PANTHER mitochondrial malonyl-CoA-ACP transacylase subfamily) and the curated EC 2.3.1.39 reaction, the transfer mct1 performs is malonyl from CoA to holo-ACP, i.e. [acyl-carrier-protein] S-malonyltransferase activity, which the gene already carries. No S. pombe enzyme assay is cached.'
