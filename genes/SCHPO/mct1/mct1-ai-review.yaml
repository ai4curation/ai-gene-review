    summary: Malonyl-CoA:ACP transacylase activity (PAINT/EC).
    action: ACCEPT
    reason: 'No S. pombe biochemistry. Support is the UniProt catalytic-activity statement (EC 2.3.1.39) and FabD-family membership (Pfam Acyl_transf_1 acyltransferase domain), the family of malonyl-CoA:ACP transacylases; the PAINT donors include E. coli FabD and S. cerevisiae MCT1. Function is therefore by orthology.'
