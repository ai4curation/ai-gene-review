  label: Schizosaccharomyces pombe 972h-
description: mct1 (SPAC11G7.05c; UniProt O13698) encodes mitochondrial malonyl-CoA:ACP transacylase (EC
  2.3.1.39), which loads malonyl groups onto mitochondrial ACP, the committed step of mitochondrial type
  II fatty acid synthesis (mtFAS). Function is assigned by orthology to S. cerevisiae MCT1; it is mitochondrial
  in a genome-wide screen.
