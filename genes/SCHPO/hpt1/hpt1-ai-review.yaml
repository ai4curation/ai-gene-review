  label: Schizosaccharomyces pombe 972h-
description: 'hpt1 (SPAC23C11.13c; UniProt O13917) encodes hypoxanthine-guanine(-xanthine) phosphoribosyltransferase
  (EC 2.4.2.8). This single PRPP-dependent enzyme salvages hypoxanthine, guanine and xanthine to IMP,
  GMP and XMP: one 8-azathioxanthine-resistance mutation removes all three activities together. Mutants
  lacking guanine PRTase (pur1) also take up guanine more slowly. The enzyme is assigned to the cytosol
  by curator inference.'
